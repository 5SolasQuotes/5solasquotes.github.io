<main class="wrap"><figure class="quote" id="q-1b4112b84c" data-kw="">
<blockquote><p>He particularly, as the original and supreme cause, completely governs and directs His creature in harmony with His will, so that both in body and soul, the creature will function in dependence upon God, in and through God, and according to the will of God. According to His counsel and sovereign will, He is the sole operator in the creature, since there is not even the least power in the creature to resist this will of God.

Both reason and the Holy Scriptures reveal very clearly that there is such divine cooperation in all creatures that move and are active. Even reason affirms that if God were not to cooperate in His creatures, they in their motions and activities would then be independent from God. The notion of such independence is utterly absurd and absolutely impossible, for no one is independent and no one functions independently. Only God is independent, for He is not superseded by anyone.

It is equally evident from the Holy Scriptures that not one body is capable of either living or moving apart from God’s cooperation, for Paul teaches in Acts 17:28, “For in him we live, and move, and have our being.” In Jeremiah 10:23, we read, “O LORD, I know that the way of man is not in himself: it is not in man that walketh to direct his steps.”

That a created spirit can neither function nor think, except by powerful divine cooperation, Paul teaches clearly, saying, “Not that we are sufficient of ourselves to think any thing as of ourselves; but our sufficiency is of God” (2 Cor. 3:5). Regarding the willing of our spirit, he writes, “For it is God which worketh in you both to will and to do of his good pleasure” (Phil. 2:13). Behold, it is thus evident that God, by His almighty and everywhere present power, not only sustains “as it were by His hand” all creation, but also continually and ceaselessly cooperates in His entire creation.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/theodorus-vandergroe.html">Theodorus VanderGroe</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Christian’s Only Comfort in Life and Death: An Exposition of the Heidelberg Catechism</cite>, trans. Bartel Elshout, ed. Joel R. Beeke (1838-44; 2 vols, Grand Rapids MI: Reformation Heritage Books, 2016), 1: 157-58.</span></figcaption>

</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-77c36c6e92" data-kw="">
<blockquote><p>Public and popular amusements were also interdicted, among Christians, on the Lord’s-day, from an early period; and when the empire became Christian, were prohibited by law, and under severe sanctions. No ludicrous sports, games, or recreations, however lawful at other times, were allowed on this day. The theatre, the horse-race, the circus, the diversion of hunting, the amusement of dancing, of luxurious feasting, and every kind of dissipating pleasure, were solemnly forbidden, and in many cases visited with heavy penalties. In short, the law of the Church forbade every occupation or amusement which was adapted in any measure to turn a day of spiritual and sacred rest, into a day of carnal indulgence.</p></blockquote>

<blockquote><p>1st Conclusion. Monuments or instruments of idolatry are of two sorts, either: [1.] Such things as have no other use at all but to contribute sorne subservient influence in or unto idolatrous worship, and because these have all their warrant from a mere commandment of man, they are simply not necessary, as the graven image, the idols themselves, all positive observances in God’s worship destitute of any command of God; and the use of these in any case must be scandalous and so unlawful because… [2.] But there be other things that are instruments of idolatry and subservient thereunto, in a common and physical influence, as a temple builded to the honor of a saint and for the adoring of images, and for the reading and opening the Word of God in the New and Old Testament, though in a corrupt way; these are not properly monuments of idolatry. Now the house or Church, as such is no monument, nor useless instrument in worship, such as is a surplice, a human holy day, for it has, as such, being a thing of walls and timber, no other than that very same physical influence in worshipping either the true God or a saint, that it has in civil use, in our ordinary dwelling, to wit, to fence our bodies in religious, in natural, in civil actions from injuries of heaven, clouds, and sin. The adjuncts of the Church, as crucifixes, images, altars, ravels, mass-clothes and the like, are properly monuments and instruments of idolaty, because these are not necessary, as is the material house, nor have they any common and physical influence in the worship, as the temple has, yea all the necessity or influence that they have in the worship is only religious and human flowing from the will of men, without either necessity from our natural constitution of body, or any word of Scripture, and therefore they are to be removed upon this ground, because they are unnecessary snares to idolatry… …An house for the worship of God is amongst the things that are necessary by way of disjunction in specie, not in individuo; that is, a house is necessary, in its physical use, to fence off our bodies, the injuries of sun, air and heaven, but not this house, for another house may serve the turn as conveniently.</p></blockquote>

</figure><figure class="quote" id="q-c327d58595" data-kw="">
<blockquote><p>At Glasgow, Mr. Andrew Gray, a youth of twenty-two years at most, lately laureate at St. Andrew’s, upon one preaching or two at Glasgow, Mr. Patrick Gillespie and his friends will have him admitted to his place. I refused to consent; the youth being so young, and utterly a stranger to us; his trials of expectant being hastily past in the Presbytery of Hamilton; and none of the ministers either of Edinburgh or St. Andrew’s, the places of his residence, being acquainted with him, as he professed; also his voice being so weak, that the most in our kirks heard him not.

The Magistrates and Town-Counsel being utterly against his admission, dealt with him earnestly not to trouble them: at first, his modesty was so great, that a small impediment seemed enough to scare him from accepting of any charge; but so soon as our Session (which is bot the echo of what our brethren speaks) had given him a call, without haste he went on to his trials, and, over the belly of the town’s protestation, was admitted by their part of the Presbytery minister of Glasgow.

His voice is not yet so good as to be heard by diverse. He has the new guise of preaching, which Mr. Hew Binning and Mr. Robert Leighton began, contemning the ordinary way of exponing and dividing a text, of railing doctrines and uses; but runs out in a discourse on some common head, in a high, romancing, unscriptural style, tickling the ear for the present, and moving the affections in some, but leaving, as he confesses, little or nought to the memory and understanding. This we must misken [sic], for we cannot help it.</p></blockquote>

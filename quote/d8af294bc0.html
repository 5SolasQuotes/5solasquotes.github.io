<blockquote><p>That old Serpent, which is the Devil and Satan, as he is likewise so stiled, ch. 12:9. and bound him a thousand years, which binding up or restraining was from such open rage of persecution as was used by the heathen emperors, but especially for that end which is spoken of in the next verse, to wit, that he should deceive the nations no more, which is to be understood, not absolutely from all sort of deceiving, but from that sort which he used before the preaching of the Gospel amongst the gentiles, by the responses of his hellish oracles, and such gross idolatry whereinto he drew them, and which by the preaching of the Gospel and conversion of the gentiles was silenced and abolished, and he (as it were) bound up therefrom. …During the time then wherein he was bound up from that sort of gross and paganish deceiving, he was never busier, by the vicar of his power, to whom he resigned his throne, as ch. 13:2, to deceive in a more subtil way, changing himself into an angel of light, and under presence and profession of the Christian name, to suppress and overthrow the truth of Christ Jesus, which thing to be true, may be seen, 1. By the great success of this manner of deception these thousand years, which he had, as we may see, ch. 13:16, so that all the world followed the beast, whose names were not written in the book of life. 2. By this, that v. 4. John saw the souls of these that were beheaded for the witness of Jesus, and had not worshipped the beast nor his image, living and reigning with Christ these thousand years, 〈 in non-Latin alphabet 〉, which v. 1. are called, 〈 in non-Latin alphabet 〉, without any article, to shew that he means these thousand years that Satan is bound up himself from the first sort of deceiving, yet is let loose as it were, in the vicar of his power to deceive after another manner and to kill the faithful witnesses spoken of, ch. 11:3. Verse. 3… Now for accommodation of history, to know the time when the Dragon was thus bound up, and the thousand years spoken of began, and thereafter ended and had their accomplishment. 1. The dragon was fully then bound up, when by Constantine’s conversion, heathenish and open persecution of the Gospel ceased, and the Christian religion by laws was every where established, for from that time the dragon had no loose chain for open rage as before, or paganish seduction; and this was about the three hundreth year of Christ, which leads us also to the point of his losing, which falls out about the one thousand three hundreth year of God, in the time of Boniface VIII, that monster of men, of whom their stories records, that he entred like a fox, lived like a lion and died like a dog, (Fascic. temp in vita Bonif. 8)… In whose time also, to evidence yet more Satan’s loosing, there was (as the same Platina reports) a sudden, general, and so huge an earthquake throughout all Italy, which lasted many days, as the like was never seen before, and which every where overthrew many houses. There appeared likewise (says he) a huge great comet portending some great calamity thereafter to fall out, so that heaven and earth gave signs and witnesses of the loosing of this dragon. And from the times of which Boniface many bloody persecutions against the professors of the truth were raised, who were called, Waldenses, Lollards, Hussites, and of late Lutherans, Calvinists, Huguenots and the like, many cruel plots hatched, and many bloody massacres acted and practiced. At this time also began that Ottoman race, and so Satan was let loose.</p></blockquote>

<blockquote><p>The issue of millennial debate among the Reformed is both highly complicated and rather uniquely related to the confessional issue. The new eschatologies of a future millennium ran counter to the eschatologies of the sixteenth-century Reformed which, from Bullinger’s commentary on the Apocalypse to Franciscus Junius’ annotations, as ensconced in the margins of later editions the Geneva Bible, understood the millennium as past. Although, moreover, the major Reformed confessions had tended to tread lightly concerning the last things, two of them, the Forty-two Articles of Edward VI and the Second Helvetic Confession, had strongly argued against “the fable of the millennium” and notions of a “golden age” on earth prior to the final judgment. What is rather remarkable, then, is the vast revision of Reformed eschatology that took place in the seventeenth century both in England and on the continent without yielding a major confessional confrontation – in fact, both witnessing an increased diversity in the tradition, a significant break with the views of the Reformers on the part of many orthodox Reformed writers evidenced by their acceptance of a doctrine of a future millennium. The spectrum of opinion among the continental Reformed, similar to what Gribben has identified among the English, is evidenced by the millennialism of Wilhelmus à Brakel on the one hand and the anti-millennial views of Francis Turretin on the other. Turretin, significantly, distinguished between the “crass” chiliasm of various heretics and the highly objectionable but not heretical “subtle” chiliasm of Piscator, Alsted, Mede, and Launaeus – an approach parallel to his objection to Amyraldianism.</p></blockquote>

<div class="actions"><button class="copy" data-copy="“The issue of millennial debate among the Reformed is both highly complicated and rather uniquely related to the confessional issue. The new eschatologies of a future millennium ran counter to the eschatologies of the sixteenth-century Reformed which, from Bullinger’s commentary on the Apocalypse to Franciscus Junius’ annotations, as ensconced in the margins of later editions the Geneva Bible, understood the millennium as past. Although, moreover, the major Reformed confessions had tended to tread lightly concerning the last things, two of them, the Forty-two Articles of Edward VI and the Second Helvetic Confession, had strongly argued against “the fable of the millennium” and notions of a “golden age” on earth prior to the final judgment. What is rather remarkable, then, is the vast revision of Reformed eschatology that took place in the seventeenth century both in England and on the continent without yielding a major confessional confrontation – in fact, both witnessing an increased diversity in the tradition, a significant break with the views of the Reformers on the part of many orthodox Reformed writers evidenced by their acceptance of a doctrine of a future millennium. The spectrum of opinion among the continental Reformed, similar to what Gribben has identified among the English, is evidenced by the millennialism of Wilhelmus à Brakel on the one hand and the anti-millennial views of Francis Turretin on the other. Turretin, significantly, distinguished between the “crass” chiliasm of various heretics and the highly objectionable but not heretical “subtle” chiliasm of Piscator, Alsted, Mede, and Launaeus – an approach parallel to his objection to Amyraldianism.”

— Richard Muller, ch. 1, “Diversity in the Reformed Tradition: a Historiographical Introduction” in eds. Haykin &amp; Jones, Drawn into Controversie: Reformed Theological Diversity &amp; Debates within Seventeenth-Century British Puritanism (V&amp;R, 2011), pp. 21-22">Copy</button><a class="share" href="https://x.com/intent/post?text=%E2%80%9CThe+issue+of+millennial+debate+among+the+Reformed+is+both+highly+complicated+and+rather+uniquely+related+to+the+confessional+issue.+The+new+eschatologies+of+a+future+millennium+ran+counter+to+the+eschatologies+of+the+sixteenth-century+Reformed+which%2C+from+Bullinger%E2%80%99s+commentary+on+the+Apocalypse+to+Franciscus+Junius%E2%80%99+annotations%2C+as+ensconced+in+the+margins+of+later+editions+the+Geneva+Bible%2C+understood+the+millennium+as+past.+Although%2C+moreover%2C+the+major+Reformed+confessions+had+tended+to+tread+lightly+concerning+the+last+things%2C+two+of+them%2C+the+Forty-two+Articles+of+Edward+VI+and+the+Second+Helvetic+Confession%2C+had+strongly+argued+against+%E2%80%9Cthe+fable+of+the+millennium%E2%80%9D+and+notions+of+a+%E2%80%9Cgolden+age%E2%80%9D+on+earth+prior+to+the+final+judgment.+What+is+rather+remarkable%2C+then%2C+is+the+vast+revision+of+Reformed+eschatology+that+took+place+in+the+seventeenth+century+both+in+England+and+on+the+continent+without+yielding+a+major+confessional+confrontation+%E2%80%93+in+fact%2C+both+witnessing+an+increased+diversity+in+the+tradition%2C+a+significant+break+with+the+views+of+the+Reformers+on+the+part+of+many+orthodox+Reformed+writers+evidenced+by+their+acceptance+of+a+doctrine+of+a+future+millennium.+The+spectrum+of+opinion+among+the+continental+Reformed%2C+similar+to+what+Gribben+has+identified+among+the+English%2C+is+evidenced+by+the+millennialism+of+Wilhelmus+%C3%A0+Brakel+on+the+one+hand+and+the+anti-millennial+views+of+Francis+Turretin+on+the+other.+Turretin%2C+significantly%2C+distinguished+between+the+%E2%80%9Ccrass%E2%80%9D+chiliasm+of+various+heretics+and+the+highly+objectionable+but+not+heretical+%E2%80%9Csubtle%E2%80%9D+chiliasm+of+Piscator%2C+Alsted%2C+Mede%2C+and+Launaeus+%E2%80%93+an+approach+parallel+to+his+objection+to+Amyraldianism.%E2%80%9D%0A%0A%E2%80%94+Richard+Muller%2C+ch.+1%2C+%E2%80%9CDiversity+in+the+Reformed+Tradition%3A+a+Historiographical+Introduction%E2%80%9D+in+eds.+Haykin+%26+Jones%2C+Drawn+into+Controversie%3A+Reformed+Theological+Diversity+%26+Debates+within+Seventeenth-Century+British+Puritanism+%28V%26R%2C+2011%29%2C+pp.+21-22&amp;url=https%3A%2F%2F5solasquotes.github.io%2Fquote%2F62580bf632.html&amp;via=5Solas" target="_blank" rel="noopener">Share on X</a><a class="perma" href="../quote/62580bf632.html">Permalink</a><a class="src" href="https://reformedbooksonline.com/topics/eschatology/#:~:text=The%20issue%20of%20millennial%20debate%20among,parallel%20to%20his%20objection%20to%20Amyraldianism&amp;text=The%20issue%20of%20millennial%20debate%20among%20the%20Reformed&amp;text=an%20approach%20parallel%20to%20his%20objection%20to%20Amyraldianism" rel="noopener" target="_blank">Read it online · Reformed Books Online</a></div>

<blockquote><p>For his heart would have served him too seduce all nations, and to hold them still in the pestilent errors of idolatry, yea and in all kind of horrible misdeeds. But God has plucked them out of the power of darkness, and removed them into the kingdom of his dear beloved Son, Col. …13, till the thousand years be fulfilled. That is to say, till Antichrist be come. And after that he must be let loose. This thing came to pass after that the dominion as well of Mahumet as of the Romish bishop was so increased in strength that they became terrible to all kings and princes of the earth, for as much as they were able, not only to grieve them when they listed, but also to cast them from their seats, and to tread them quite under foot, until they submitted their necks to false religion and rightless laws: which thing is done yet still at this day, according as Paul foretold. 2. Thess. 2. b. 11.</p></blockquote>

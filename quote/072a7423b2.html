<main class="wrap"><figure class="quote" id="q-072a7423b2" data-kw="">
<blockquote><p>One may object: (1) But is not a minister leading responsive readings inducing others to do what is wrong, which is prohibited by God’s Law (WLC #99.5–8)? Besides what has been said, to put it in a bit different way: Given that the impurities in responsive readings do not so corrupt the reading of the Word as to make the hurt more than the benefit, overturning the profit and substance of the ordinance itself, so God graciously receives this worship from sincere Christians. Leading weaker brothers in substantially good and Biblical worship as their consciences will bear (Rom. 14:5), especially given public order, is to direct them to their duty, which WLC #99.5–8 also obliges us to; and the moral necessity to do the greater good ordained of God, though mixed with impurities (without morally approving them), is greater than to abstain from that substantial and greater good because of its impurities. This is not to do “what God forbids,” which “is at no time to be done,” because this is precisely what “He commands” and “is always our duty” (WLC #99.5). If one does not agree, but believes it is sinful to ever personally perform, or direct others to do good things with impurities, inconvenience, an association of evil or that which another person could take scandal at, welcome to Separatism. Our puritan authors’ Scriptural Refutation of it will be instructive to you.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/travis-fentiman.html">Travis Fentiman</a></span><span class="wk"><span class="lbl">Work:</span> <cite>“Editor’s Extended Introduction” in English Puritans, A Refutation of the Errors of Separatists</cite>, (1604; RBO, 2025), pp. 89-90</span></figcaption>

asquotes.github.io%2Fquote%2F072a7423b2.html&amp;via=5Solas" target="_blank" rel="noopener">Share on X</a><a class="perma" href="../quote/072a7423b2.html">Permalink</a><a class="src" href="https://reformedbooksonline.com/topics/ethics#:~:text=One%20may%20object%3A%20%281%29%20But%20is,it%20will%20be%20instructive%20to%20you&amp;text=One%20may%20object%3A%20%281%29%20But%20is%20not%20a&amp;text=Refutation%20of%20it%20will%20be%20instructive%20to%20you" rel="noopener" target="_blank">Read it online · Reformed Books Online</a></div>
</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-f194c6ee17" data-kw="">
<blockquote><p>However, “evil” is an ambiguous term and may stand for miserable or moral evils. One may morally choose to undergo and suffer certain miserable (though not moral) evils in necessity, other alternatives not being available, likely, reasonable or best. Choosing to eat expired food rather than starve is not wrong, though starving would be. That one must have the best or none at all, is against the greater good; miserable evils often contain a significant degree of good, and we ought not to choose the worst.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/travis-fentiman.html">Travis Fentiman</a></span><span class="wk"><span class="lbl">Work:</span> <cite>“Editor’s Extended Introduction” in English Puritans, A Refutation of the Errors of Separatists</cite>, (1604; RBO, 2025), p. 139</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/the-christian-life/ethics-and-virtue.html">Ethics and Virtue</a></span></div>

</figure><figure class="quote" id="q-baf430d885" data-kw="">
<blockquote><p>Reckless Church union is not here being recommended; rather implementing union ought to be governed by nature’s light and laws, Christian prudence and the general rules of the Word. Union ought not to be sought if it would do greater hurt than good, for instance, if the one Church would shred into oblivion, whereas the two Churches separate would at least maintain what good had preexisted. Churches coming together in at least the fundamentals is not being held out as all or nothing; rather it is a goal which may be worked towards as it is able to be borne and as progress can be made.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/travis-fentiman.html">Travis Fentiman</a></span><span class="wk"><span class="lbl">Work:</span> <cite>“Editor’s Extended Introduction” in English Puritans, A Refutation of the Errors of Separatists</cite>, (1604; RBO, 2025), p. 184</span></figcaption>

</figure><figure class="quote" id="q-5d867ad12d" data-kw="">
<blockquote><p>Fourthly, that when the authority of the magistrate or Church has determined concerning the use of things indifferent, we are not now left free, nor are bound to look at the scandal of particular persons, but must make conscience of it that we offend not the Church, by working a greater hurt or loss to the Church than the particular hurt of private persons can extend unto. In such cases as this, the apostle’s rule holds: ‘If any man seem to be contentious, we have no such custom, nor the Church of God,’ 1 Cor. 11:16. And we are bound, in this text of the apostle Peter [1 Pet. 2:13], to obey the human ordinances of men in authority; from which obligation other men’s offense cannot free us. And the apostle charges us to look to it that we offend not the Church in prescribed ordinances and that we be careful not to offend private men in free ceremonies.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/nicholas-byfield.html">Nicholas Byfield</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Commentary on 1 &amp; 2 Peter</cite>, (London, 1637), on 1 Tim. 2:13, pp. 436–37</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/the-christian-life/ethics-and-virtue.html">Ethics and Virtue</a></span></div>

</figure><figure class="quote" id="q-94e343035f" data-kw="">
<blockquote><p>The errors and deficiencies one materially tolerates and accommodates for the time and circumstances under necessity, for the higher good in love, overlooking a multitude of sins (1 Pet. 4:8), without approving them, versus what one believes and the standard one seeks to reform unto, namely the spotless Word of God, are two different things which may consist with each other.</p></blockquote>

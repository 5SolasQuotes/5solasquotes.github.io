<blockquote><p>7. Independency and the Church way, besides the evil of it in itself considered (as being a schism in forsaking the reformed Churches and constituting new, the way of constituting Churches by the people, the way of making their ministers, the refusing of believers and their children to the sacraments (unlesse they be church members) with many more, all slat against the primitive patterns) has ever been from first to last a fountain of evil and a root of bitterness, of many bitter divisions and separations amongst themselves, of manifold errors and other mischiefs in those churches and places where they lived, God having always witnesses against it, and never blessing it with peace and truth.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/thomas-edwards.html">Thomas Edwards</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Antapologia, or a Full Answer to the Apologetical Narration of Mr. Goodwin, Mr. Nye, Mr. Sympson, Mr. Burroughs, Mr. Bridge… (London, 1644)</cite>, pp. 293-4</span></figcaption>

</figure><figure class="quote" id="q-db606a2cdc" data-kw="">
<blockquote><p>And upon the first day of the week, when the disciples came together to break bread, Paul preached unto them… and continued his speech until midnight… And there sat in a window a certain young man named Eutychus, being fallen into a deep sleep: and as Paul was long preaching, he sunk down with sleep, and fell down from the third loft, and was taken up dead. And Paul went down, and fell on him, and embracing him said, Trouble not yourselves; for his life is in him. When he therefore was come up again, and had broken bread, and eaten, and talked a long while, even till break of day, so he departed.” (Acts 20:7[-11]) Where we see that upon the Lord’s Day, when this casualty fell out even in the midst of God’s worship, and a little before the sacrament, that the congregation was for a time dissolved, and Paul the preacher, and the rest of the people, the hearers, came forth to succor this man, and then returned to perform the rest of God’s service that remained.</p></blockquote>

<blockquote><p>Question 3: Whether do you not hold all visible believers to be within the visible Church as members thereof, and not ‘without’, in the apostle’s sense, 1 Cor. 5, and therefore ought so to be acknowledged and accepted in all congregations wheresoever they shall come, and are so known: and ought (if they desire and be not otherwise unfit) of right to be permitted to partake in all God’s ordinances and Church privileges there, so far as they personally concern themselves, although they be not as yet fixed members in particular covenant, either with that congregation where for the present they reside, nor with any other? Question 4: Whether you do not hold that baptism rightly (for substance) partaked does make them that are so baptized, members of the visible Church: and so to have right (at least quoad nos [as far as to us]) to all the privileges thereof (so far as they are otherwise fit) until they be cast out (if they so deserve) by excommunication.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/richard-bernard.html">Richard Bernard</a></span><span class="wk"><span class="lbl">Work:</span> <cite>32 Questions (1639) in Richard Mather, Church-Government &amp; Church-Covenant Discussed, in an Answer of the Elders of the Several Churches in New-England to Two &amp; Thirty Questions Sent Over to Them by Diverse Ministers in England, to Declare their Judgments Therein… (London, 1643) Bernard was an English puritan. These questions were answered by the New England congregationalists, but it does not appear that Bernard ever published a response (at least that is on the internet) to those answers.</cite></span></figcaption>
<div class="meta"><span class="t"><a href="../topics/the-church/church-membership.html">Church Membership</a></span></div>

</figure><figure class="quote" id="q-5265bb184b" data-kw="">
<blockquote><p>3rd Conclusion. A visible profession of the truth and doctrine of godliness is that which essentially constitutes a visible church, and every member of the visible church; Only our [Independent] Brethren and we differ much about the nature of this profession which is required in members added to the Church. Our Brethren will have none members of the visible Church, but such as are satisfactory to the consciences of all the visible church, and give evidences so clear, as the judgement of discerning men can attain unto, that they are truly regenerated. We again do teach that the scandalously wicked are to be cast out of the Church by excommunication, and these of approved piety are undoubtedly members of the visible Church, so these of the middle sort are to be acknowledged members of the Church, though the Church have not a positive certainty of the judgement of charity that they are regenerated, so they be known: 1. to be baptized, 2. that they be free of gross scandals, 3. and profess that they be willing hearers of the doctrine of the Gospel. Such a profession as gives evidences to the positive certainty of the judgment of charity, of sound conversion, is not required to make and constitute a true, visible-Church.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/samuel-rutherford.html">Samuel Rutherford</a></span><span class="wk"><span class="lbl">Work:</span> <cite>3rd Conclusion, pp. 251-255 of Ch. 9, Section 9, ‘Of the Addition of Members to the Church’ in The Due Right of Presbyteries... (1644), pt. 1</cite></span></figcaption>
<div class="meta"><span class="t"><a href="../topics/the-church/church-membership.html">Church Membership</a></span></div>

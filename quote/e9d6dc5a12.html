<main class="wrap"><figure class="quote" id="q-e9d6dc5a12" data-kw="">
<blockquote><p>We content our selves with the intercession, sacrifice, and monarchy of J[esus] Christ, and can join to Him neither Saints, nor Priests, nor the Pope in any of those three qualities, which the Scripture of the New Testament attributes to none but Him alone. We deem His blood sufficient for the purgation of our souls, having never learnt that either S. Paul, or any other Saint was crucified for us; nor, That after this life the Saints shall enter into any other place, but only one of repose and rest.

After Baptism and the Lord’s Supper we desire no other Sacraments; not having heard in His Word, that he hath obliged us necessarily to go to the ear of any Priest to receive his absolution, or to the hand of any Bishop to have his chrism. We dare not adore the bread which we break, nor the cup which we bless; because all confess, That it is not permitted us to adore any but God only. We can neither invocate creatures, since we have in the Scripture neither commandment nor example for it; nor prostrate our selves before images, since we have express commands therein against it.

We scruple at making any thing an Article of our Faith, which we have not heard in the Word of God; be he an Apostle or an Angel that evangelizeth. So that since we find nothing in the Scripture of abstinence from meats, distinction of times, and other Roman ceremonies, nor of the Limbus of infants, or purgatory; we cannot yet be persuaded that it is necessary for us to believe them.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/jean-daille.html">Jean Daillé</a></span><span class="wk"><span class="lbl">Work:</span> <cite>An apology for the Reformed churches wherein is shewed the necessity of their separation from the Church of Rome: against those who accuse them of making a schism in Christendom</cite>, trans. Thomas Smith (Cambridge: University of Cambridge, 1653), p. 12.</span></figcaption>

</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-6bf0d74b86" data-kw="">
<blockquote><p>In an article on the Sabbath Alliance, the Free Church Magazine, edited by William M. Hetherington, warned that Sabbath-desecration would lead to the oppression of the working classes as they would no longer be guaranteed a day’s rest from their labours. This extract is therefore useful for reminding us that the first and second tables of the law cannot really be separated. Those who force their employees to work on the Lord’s Day are not loving their neighbours, and so their Sabbath-breaking is not only a sin against God but also a sin against their fellow-man:

We are delighted to hear that there is an active-movement began amongst the working classes on the subject. They have, of course, the most manifest interest in the protection of the Lord’s-day. It secures to them, by divine and human right, fifty-two whole days of rest out of the three hundred and sixty-five. Take these away from them, and they are reduced to the position of the veriest slaves, nay, to a position more degraded than that of any slaves in the world, and that without one farthing of compensation; for it is clear that they would get precisely the same wages for working six. But if the present course is unresisted, all labouring people will soon lose their Sabbaths. Railway officials are first employed, and already they feel the intolerable hardship. But why not also masons and labourers (as had already been the case in some parts of England), if the contractor has a piece of work to finish? The post-office officials at present work on Sabbath; but why not the bakers, as in London? Why not the carpenters? Why not the millers, as at Canonmills? In a word, there is no point to halt at, if the authority of the divine law is disregarded, and nothing will do but a determined combination to put down all public forms of Sabbath desecration. We rejoice, therefore, to find the working people taking up the question, and we shall be happy to record, from time to time, and to promote in every way, the success of this noble enterprise.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/free-church-magazine.html">Free Church Magazine</a></span><span class="wk"><span class="lbl">Work:</span> <cite>‘The Sabbath Alliance’ in Free Church Magazine</cite>, iv, no. 47 (Nov. 1847), pp 337-8.</span></figcaption>

<blockquote><p>19. One is not worthy to be called a theologian (theologus) who looks upon the “invisible things of God” [invisibilia Dei; Rom. 1:20] as though they were clearly “perceptible in those things which have actually happened” [1 Cor 1:21–25]

20. But who knows the visible things and the backside [posteriora Dei; Ex 33:23] of God seen through the passions and the cross.

21. The theologian of glory [theologus gloriae] calls evil good and good evil. The theologian of the cross [theologus crucis] calls a thing what it is.</p></blockquote>

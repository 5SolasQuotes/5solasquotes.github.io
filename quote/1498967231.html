</figure><figure class="quote" id="q-05567d1ee7" data-kw="">
<blockquote><p>When God ‘foreordains’ a sinner ‘to everlasting death,’ He decides to leave him in the sin which deserves everlasting death and results in it. The non-elect sinner has experienced the operation of common grace. It is an error to say that God shows no kind or degree of mercy to the non-elect. But he has resisted and defeated it. God decides to proceed no further with him by the bestowment of that special grace which regenerates, and ‘makes willing in the day of God’s power.’ The elect sinner has also experienced, resisted, and defeated common grace. God decides to proceed further with him, by effectual calling and regeneration.</p></blockquote>

<blockquote><p>Calvinists, indeed, do not admit that it is an accurate mode of stating the question, to put it in this form,—whether or not the grace or gracious operation of the Spirit be irresistible? for they do not dispute that, in some sense, men do resist the Spirit; and they admit that resistance to the Spirit may be predicated both of the elect and of the non-elect,—the non-elect having operations of the Spirit put forth upon them which they resist or throw off, and never yield to,—and the elect having generally resisted the operations of the Spirit for a time before they yielded to them. Accordingly, although the only thing in the Arminian declaration, as given in to the Synod of Dort [1618-9], which was regarded as containing a positive error in doctrine, was the assertion that, as to the mode of the Spirit’s operation in conversion, it was not irresistible, there is not, in the canons of the synod, any formal deliverance, in terminis [in such terms], upon this precise point, though all that the Arminians meant to assert, by denying the irresistibility of grace, is clearly and fully condemned. This statement likewise holds true, in all its parts, of our own [Westminster] Confession of Faith. It does not contain, in terminis [in such terms], an assertion of the irresistibility, or a denial of the resistibility, of the grace of God in conversion; but it contains a clear and full assertion of the whole truth which Arminians have generally intended to deny by asserting the resistibility of grace, and which Calvinists have intended to assert, when—accommodating themselves to the Arminian phraseology, but not admitting its accuracy—they have maintained that grace in conversion is irresistible. They [Calvinists] object to the word irresistible, as applied to their doctrine, because of its ambiguity,—because, in one sense, they hold grace in conversion to be resistible, and in another, not. It may be said to be resistible, and to be actually resisted, inasmuch as motions or operations of the Spirit upon men’s minds—which, in their general nature and bearing, may be said to tend towards the production of conversion—are resisted, or not yielded to, by the non-elect, and for a time even by the elect; while it may be said to be irresistible,—or, as Calvinists usually prefer calling it, insuperable, or infrustratable, or certainly efficacious,—inasmuch as, according to their doctrine, whenever the gracious divine power that is sufficient to produce conversion, and necessary to effect it, is put forth, it certainly overcomes all the resistance that men are able to make, and infallibly produces the result.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/william-cunningham.html">William Cunningham</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Historical Theology, vol. 2 (1862; Banner of Truth, 1994), ch. 25, ‘The Arminian Controversy’, Section 6, ‘Efficacious &amp; Irresistible Grace’</cite>, pp. 408-9</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/effectual-calling/efficacious-grace.html">Efficacious Grace</a></span></div>

get="_blank">Read it online · Reformed Books Online</a></div>
</figure><figure class="quote" id="q-afc27d8b3a" data-kw="">
<blockquote><p>II. Secondly, there is a conviction of conscience that brings with it some overpowering, some more, some less, some for one end, some for another. I say, some overpowering. In that dispute about the resistibility or irresistibility of grace, as far as I can see into the dispute, this distinction might be useful and advantageous toward the determining of it, viz. to consider what the Spirit of God does to the heart by way of trying it, and what it does with intent and resolution to overpower it. The former part of the distinction you have in Ex. 20:20, ‘Fear not, for the Lord is come to prove,’ or try, ‘you.’ The latter in Isa. 26:11, ‘They will not see, but they shall see and be ashamed.’ The former in Rev. 3:17, Christ stands at the door and knocks, to try whether He shall be entertained. The latter in Eze. 22:14, ‘How can thy heart endure and thy hands be strong in the day that I shall deal with thee, when I break in resolved to overpower thee?’ As in that blasted conviction I spake of before, there was a trying but no overpowering, so there is some overpowering conviction also, that is but for trial…. So that was a very overpowering conviction upon the conscience of Herod, that made him reverence John Baptist, and to hear him gladly and to do many things according to his doctrine; but it was far from attaining the utmost end of conviction: it was only by way of trial, whether he would come up to the utmost end or no. This conviction neither they in the text, nor Herod could resist, for conviction brake in, whether they would or no; but the ultimate operation of conviction they resisted; because in this conviction the Spirit of God did only try them, not resolved to overpower them to the utmost fruit and effect of conviction… For the first, it is well known how God tried the hearts and consciences of Pharaoh and the Egyptians, by Moses’ words and miracles, and how again and again He in some degree did overpower them; but still they resisted and came not up to the proper and ultimate effect of conviction, to own and to do their duty.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/john-lightfoot.html">John Lightfoot</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Works of the Reverend &amp; Learned John Lightfoot… (London: Scot, 1684), ‘A Sermon preached at Hertford Assize, March 17, 1664’, on Jn. 8:9</cite>, pp. 1083-84</span></figcaption>

<div class="actions"><button class="copy" data-copy="“II. Secondly, there is a conviction of conscience that brings with it some overpowering, some more, some less, some for one end, some for another. I say, some overpowering. In that dispute about the resistibility or irresistibility of grace, as far as I can see into the dispute, this distinction might be useful and advantageous toward the determining of it, viz. to consider what the Spirit of God does to the heart by way of trying it, and what it does with intent and resolution to overpower it. The former part of the distinction you have in Ex. 20:20, ‘Fear not, for the Lord is come to prove,’ or try, ‘you.’ The latter in Isa. 26:11, ‘They will not see, but they shall see and be ashamed.’ The former in Rev. 3:17, Christ stands at the door and knocks, to try whether He shall be entertained. The latter in Eze. 22:14, ‘How can thy heart endure and thy hands be strong in the day that I shall deal with thee, when I break in resolved to overpower thee?’ As in that blasted conviction I spake of before, there was a trying but no overpowering, so there is some overpowering conviction also, that is but for trial…. So that was a very overpowering conviction upon the conscience of Herod, that made him reverence John Baptist, and to hear him gladly and to do many things according to his doctrine; but it was far from attaining the utmost end of conviction: it was only by way of trial, whether he would come up to the utmost end or no. This conviction neither they in the text, nor Herod could resist, for conviction brake in, whether they would or no; but the ultimate operation of conviction they resisted; because in this conviction the Spirit of God did only try them, not resolved to overpower them to the utmost fruit and effect of conviction… For the first, it is well known how God tried the hearts and consciences of Pharaoh and the Egyptians, by Moses’ words and miracles, and how again and again He in some degree did overpower them; but still they resisted and came not up to the proper and ultimate effect of conviction, to own and to do their duty.”

— John Lightfoot, The Works of the Reverend &amp; Learned John Lightfoot… (London: Scot, 1684), ‘A Sermon preached at Hertford Assize, March 17, 1664’, on Jn. 8:9, pp. 1083-84">Copy</button><a class="share" href="https://x.com/intent/post?text=%E2%80%9CII.+Secondly%2C+there+is+a+conviction+of+conscience+that+brings+with+it+some+overpowering%2C+some+more%2C+some+less%2C+some+for+one+end%2C+some+for+another.+I+say%2C+some+overpowering.+In+that+dispute+about+the+resistibility+or+irresistibility+of+grace%2C+as+far+as+I+can+see+into+the+dispute%2C+this+distinction+might+be+useful+and+advantageous+toward+the+determining+of+it%2C+viz.+to+consider+what+the+Spirit+of+God+does+to+the+heart+by+way+of+trying+it%2C+and+what+it+does+with+intent+and+resolution+to+overpower+it.+The+former+part+of+the+distinction+you+have+in+Ex.+20%3A20%2C+%E2%80%98Fear+not%2C+for+the+Lord+is+come+to+prove%2C%E2%80%99+or+try%2C+%E2%80%98you.%E2%80%99+The+latter+in+Isa.+26%3A11%2C+%E2%80%98They+will+not+see%2C+but+they+shall+see+and+be+ashamed.%E2%80%99+The+former+in+Rev.+3%3A17%2C+Christ+stands+at+the+door+and+knocks%2C+to+try+whether+He+shall+be+entertained.+The+latter+in+Eze.+22%3A14%2C+%E2%80%98How+can+thy+heart+endure+and+thy+hands+be+strong+in+the+day+that+I+shall+deal+with+thee%2C+when+I+break+in+resolved+to+overpower+thee%3F%E2%80%99+As+in+that+blasted+conviction+I+spake+of+before%2C+there+was+a+trying+but+no+overpowering%2C+so+there+is+some+overpowering+conviction+also%2C+that+is+but+for+trial%E2%80%A6.+So+that+was+a+very+overpowering+conviction+upon+the+conscience+of+Herod%2C+that+made+him+reverence+John+Baptist%2C+and+to+hear+him+gladly+and+to+do+many+things+according+to+his+doctrine%3B+but+it+was+far+from+attaining+the+utmost+end+of+conviction%3A+it+was+only+by+way+of+trial%2C+whether+he+would+come+up+to+the+utmost+end+or+no.+This+conviction+neither+they+in+the+text%2C+nor+Herod+could+resist%2C+for+conviction+brake+in%2C+whether+they+would+or+no%3B+but+the+ultimate+operation+of+conviction

<main class="wrap"><figure class="quote" id="q-9116ca8fe1" data-kw="all things providence">
<blockquote><p>We believe that all things without exception are under divine providence: whether heavenly or sublunary, great or small, necessary and natural or free and contingent. Thus nothing in the nature of things can be granted or happen which does not depend upon it. God created all things, therefore he also takes care of all things.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/francis-turretin.html">Francis Turretin</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Institutes of Elenctic Theology</cite>, 6.3.1–2</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/providence/providence-in-general.html">Providence in General</a> › <a href="../topics/providence/providence-in-general/against-epicureans-and-chance.html">Against Epicureans and chance</a></span><span class="t"><a href="../topics/providence/fate-fortune-and-chance.html">Fate, Fortune and Chance</a> › <a href="../topics/providence/fate-fortune-and-chance/contingency.html">Contingency</a></span></div>

</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-c3a4da0f42" data-kw="providence wisdom">
<blockquote><p>That there is a Providence. The wisdom of God would not be so perspicuous, were there not a providence in the world. It is eminent in the creation, but more illustrious in the government of the creatures. A musician discovers more skill in the touching an instrument, and ordering the strings, to sound what notes he pleaseth, than he doth in the first framing and making of it. All God’s providences are but his touch of the strings of this great instrument of the world.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/stephen-charnock.html">Stephen Charnock</a></span><span class="wk"><span class="lbl">Work:</span> <cite>A Treatise on Divine Providence</cite>, Discourse on Divine Providence</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/providence/providence-in-general.html">Providence in General</a> › <a href="../topics/providence/providence-in-general/against-epicureans-and-chance.html">Against Epicureans and chance</a></span><span class="t"><a href="../topics/providence/government.html">Government</a> › <a href="../topics/providence/government/of-nations.html">Of nations</a></span></div>

</figure><figure class="quote" id="q-ca480713e5" data-kw="">
<blockquote><p>Providence without the word is a dark enigma. None can solve it. The best commentary on Providence is the Bible. The best commentary on the Bible is Providence. The events of a godly man&#x27;s life are to him the fulfillings of the Scriptures. In a thousand ways they teach him the true sense of promises and threatenings, predictions and narratives, precepts and doctrines. They mightily confirm his belief of the truth.</p></blockquote>

<main class="wrap"><figure class="quote" id="q-776aec0c23" data-kw="">
<blockquote><p>I am not, therefore, my dear Sir, surprised or too much grieved to bear the complaints you make of darkness within and without. I never, since I knew the ways of God, admired an easy religion—a religion attended with no conflicts, strivings, wrestlings, swoonings, and strong outcries of felt darkness, unbelief, depravity, and bondage.

There is, indeed, ease, pleasure, and rest to be found in Christ; but it is in the way of much fighting and struggling against our hellish adversaries, who are sure to be at our right hand to resist us, whenever we make an earnest attempt to come to the blessed Saviour, whose power and grace they dread and hate; and when we have got within the glorious city of refuge, and begin to drink of strong consolation, Satan envies every drop of comfort, and will do his utmost to dash the cup of consolation out of our hands.

But by faith we stand, even that faith which against hope believeth in hope; and the strength of our faith lies in the intercession of our High Priest and Advocate within the vail. Behold him holding up your case, in all its circumstances, before the glorious eyes of the Father sitting upon the throne of glory, and saying, “Jehovah rebuke thee, Satan: is not this a brand plucked out of the fire?” It is your part to come in at the back of this great Intercessor, hiding yourself, as it were, amidst the dazzling brightness of his glory, consenting from the heart to his suit, and waiting for the breaking forth of an answer, in your darkened, feeble, and sorrowful soul.

And you must give him time and full liberty to carry on his work, by emptying you from vessel to vessel, sifting you as wheat, burning and melting you in the refining furnace, until seven times pass over you. At length you shall see. him inclining to you, bowing the heavens and coming down, to draw you out of many waters, and to de liver you from the hand of strange children, whose mouth speaketh vanity, and their right hand is a right hand of falsehood.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/john-love.html">John Love</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Letter to a Christian Friend by the Late Rev. Dr Love of Glasgow. Now Published for the First time (15 January 1796) in Christian Miscellany</cite></span></figcaption>

</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-b4b9aa8640" data-kw="">
<blockquote><p>Christ intercedes for us, like the high priest, who, after he had offered the victim on the altar, carried its blood into the holy place, and there prayed for the people. The necessity of this intercession is sufficiently shown, not only because it was not enough to have purchased salvation, unless it were perpetually secured and applied; but also because we are not such characters as can draw near to God of ourselves, and therefore have need of a most influential advocate to plead our cause before God, against the continual accusation of the devil.

But when we say that Christ intercedes, we must not imagine that he falls down at the feet of his Father, or uses any prostration of his body, as a suppliant; for this idea is inconsistent with the glorified state and kingly authority, which he possesses both in heaven and in earth. It simply means, if I may so express it, Christ’s continual appearance in heaven before the Father; for the Father cannot look upon him without being appeased; and thus his appearance is equivalent to intercession, and has the same effect, as if Christ were to fall before his Father covered and stained with his own blood, and display before him his wounds and scars; thus the blood of Abel is said to have spoken or cried out.

It may denote, also, his unchangeable purpose of saving his elect, and also his presentation of our persons and prayers for acceptance before God; thus he is represented as the “angel with the golden censer and incense to be offered with the prayers of the saints,” (Rev. viii. 3.) Now this intercession is opposed to the twofold accusation, which the devil, “the accuser,” brings against us, and which our own sins bring against us, provoking the anger of God.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/benedict-pictet.html">Benedict Pictet</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Christian Theology</cite>, trans. Frederick Reyroux (1696; London, 1834), 6.15, pp 318-19.</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/priestly-office-satisfaction-and-atonement/necessity-of-satisfaction.html">Necessity of Satisfaction</a></span></div>

<blockquote><p>[Socinians and Photinians object:] (2) God is able to pardon sins without satisfaction. Therefore, it is probable, that He exacts no satisfaction. The antecedent is proven: Because He is able to remit of His own right as much as He pleases: since He is the absolute judge: but to each one one may remit as much as He pleases of his own right. Responses:

1. I deny the consequence; it is not valid to argue from the possible to the actual.

2. I also deny the antecedent. The proof is inconsequent: God is indeed able to remit of His own right as much as He pleases; but by His truth and righteousness He is not willing to remit so much, that without satisfaction He might forgive sins: because by His just judgment He once dictated to man the punishment of death: in the day that thou eatest therefore thou shalt surely die. Whence Scripture comments the righteousness of God in exacting satisfaction, Rom. 3:25. (3.) God wills to forgive us our sins without satisfaction. Therefore, He exacts no satisfaction. The antecedent is proven: because God does not exact anything from us except faith and repentance. Response: I deny the antecedent. The proof is inconsequent. For, even if from us He does not require and exact satisfaction: nevertheless, He exacts it from His Son, our Mediator, and imputes and grants the same to us freely. Faith itself implies this satisfaction: which is born toward Christ as the one redeeming and making satisfaction.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/marcus-friedrich-wendelin.html">Marcus Friedrich Wendelin</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Christian Theology 3rd</cite>, ed. (1634), Species of the Office of Christ, pt. 2</span></figcaption>

89.html">Permalink</a><a class="src" href="https://reformedbooksonline.com/on-the-necessity-of-the-atonement/#:~:text=Socinians%20and%20Photinians%20object%3A%5D%20%282%29%20God,the%20one%20redeeming%20and%20making%20satisfaction&amp;text=Socinians%20and%20Photinians%20object%3A%5D%20%282%29%20God%20is%20able&amp;text=Christ%20as%20the%20one%20redeeming%20and%20making%20satisfaction" rel="noopener" target="_blank">Read it online · Reformed Books Online</a></div>

<blockquote><p>Dr. Twisse maintained, as several eminently orthodox divines have done, ‘That God, by his absolute power, setting aside his decree or free constitution, can forgive sin without any satisfaction.’ He has a whole digression against Piscator and Lubbertus, on this subject.</p></blockquote>

<blockquote><p>Here Owen appears to waver. On the one hand he allows that punishments may vary provided that the end of satisfying justice is met. On the other hand he seems to make an exception of the atonement, arguing or rather implying that there could not be another mode of satisfaction for sin than atonement by the God-man, the surety who has substituted himself in the room of sinners. Yet he seems to allow the possibility (though one that we are not in a position to know about) that the manner, time etc. of punishment belongs entirely to God, whose counsel we do not know. Which raises the question of why, if punishments in general, in respect of their nature and circumstances, are in the hand of God, why the punishment for sin may not similarly be. And if it may similarly be, even if we have not a clue about what an alternative mode of punishment may be in this case, then the atonement by Christ is not necessary in even the restricted sense that Owen has argued for earlier.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/paul-helm.html">Paul Helm</a></span><span class="wk"><span class="lbl">Work:</span> <cite>‘Analysis 13 – Owen’s Option’</cite>, (2008) 17 paragrpahs at Helm’s Deep</span></figcaption>

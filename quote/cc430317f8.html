<blockquote><p>The Papists discover amazing stupidity by singing, in honor of Mary, those very words by which their superstition is expressly condemned, and who, in giving thanks, detach the woman&#x27;s saying, and leave out the correction.</p></blockquote>
<figcaption>— <a href="../authors/john-calvin.html">John Calvin</a>, <cite>Commentary on a Harmony of the Evangelists</cite>, Luke 11:27-28</figcaption>

<figcaption>— <a href="../authors/john-calvin.html">John Calvin</a>, <cite>Commentary on the Gospel according to John</cite>, John 2:4</figcaption>

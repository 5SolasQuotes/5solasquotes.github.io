<main class="wrap"><figure class="quote" id="q-d319205c37" data-kw="">
<blockquote><p>XVII… From this [Col. 1:2, “Grace be unto you, and peace, from God our Father and the Lord Jesus Christ.”] we gather the following axioms. … 2. The Son of God is equal and coequal with the Father in honor, worship, and glory, as well as in essence. Otherwise, the Apostle would not attribute the same glory to both the Father and the Son unless they share the same essence. Since God does not give His glory to another [Isa. 42:8] of a distinct essence, it is evident that the Father and the Son share the same essence.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/amandus-polanus.html">Amandus Polanus</a></span><span class="wk"><span class="lbl">Work:</span> <cite>‘Analytical Theses on Colossians</cite>, (on Col. 1:1-11) $3 Download tr. Jonathan Tomes (Basel: Johannes Schroeter, 1601)</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/the-person-of-christ/union-of-the-two-natures.html">Union of the Two Natures</a></span></div>

</figure><figure class="quote" id="q-04da18c64a" data-kw="">
<blockquote><p>Certainly from one perspective, as a creature and as man, it seems that He [Christ] cannot be exempted from the moral government of God, nor otherwise could He as a man have merited anything for Himself. From another perspective, if He were in Adam under the covenant of nature, then it would seem that in and with Adam who sinned, He violated that same covenant, which is beyond absurd. Therefore it seems most safe to state: although as a rational creature He cannot be exempted from moral government with respect to his natural duties, yet He could have been withdrawn by God from the same moral governance in the positive duties, such as the commandment not to eat of the forbidden fruit (upon the transgression of which the sin of the human race hangs).</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/petrus-van-mastricht.html">Petrus van Mastricht</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Theoretical Practical Theology</cite>, (RHB), vol. 3, bk. 3, ch. 12, section 9, ‘Was it [the CoW] also entered into with the second Adam?’</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/the-person-of-christ/union-of-the-two-natures.html">Union of the Two Natures</a></span></div>

</figure><figure class="quote" id="q-8d117e14bb" data-kw="">
<blockquote><p>Although we recognize in Christ a twofold union, one personal (of the two natures, the divine and human in one person), the other natural (of the soul and body in the one human nature)… These two unions differ from each other… (4) in their adjuncts, because that [union of body and soul] is separable and was dissolved by the death of Christ, while this [the personal union] is inseparable–what the Logos (Logos) has once assumed he never laid aside.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/francis-turretin.html">Francis Turretin</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Institutes of Elenctic Theology</cite>, … (P&amp;R), vol. 3, 13th Topic, ‘Person &amp; State of Christ’, 6th Question, ‘Did the Son of God assume human nature into the unity of his person?’, section 9, pp. 312-13</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/the-person-of-christ/union-of-the-two-natures.html">Union of the Two Natures</a></span></div>

</figure><figure class="quote" id="q-c52fb8e7b4" data-kw="">
<blockquote><p>I… The occasion for this calumny [by Romanists] is taken from Calvin’s words in Mt. 26, found in his Harmony of the Gospels. There, Calvin, writing about Christ’s prayer, “My Father, if it is possible, let this cup pass from me; yet not as I will, but as you will,” includes these words among others: ‘He was struck with fear and constricted by anxiety, so that it was necessary for him to vacillate, as it were, with alternating prayers amidst the violent waves of temptations. This is the reason why, having prayed for the cup to pass, He immediately reins Himself in, and submitting his prayer to the Father’s command, He chastises and recalls the request that had just slipped out. And there, He says, ‘This was not a deliberate prayer of Christ, but the force and sudden impulse of grief extorted the words, to which correction was immediately added; the same vehemence also took away the immediate memory of the heavenly decree.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/louis-le-blanc.html">Louis Le Blanc</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Theological Theses Published at Various Times</cite>, vol. 1 3rd ed. tr. by AI by Colloquia Scholastica at Discord (1675; London, 1683), on the Impeccability of Christ, p. 570 Latin</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/the-person-of-christ/union-of-the-two-natures.html">Union of the Two Natures</a></span></div>
<div class="actions"><button class="copy" data-copy="“I… The occasion for this calumny [by Romanists] is taken from Calvin’s words in Mt. 26, found in his Harmony of the Gospels. There, Calvin, writing about Christ’s prayer, “My Father, if it is possible, let this cup pass from me; yet not as I will, but as you will,” includes these words among others: ‘He was struck with fear and constricted by anxiety, so that it was necessary for him to vacillate, as it were, with alternating prayers amidst the violent waves of temptations. This is the reason why, having prayed for the cup to pass, He immediately reins Himself in, and submitting his prayer to the Father’s command, He chastises and recalls the request that had just slipped out. And there, He says, ‘This was not a deliberate prayer of Christ, but the force and sudden impulse of grief extorted the words, to which correction was immediately added; the same vehemence also took away the immediate memory of the heavenly decree.”

— Louis Le Blanc, Theological Theses published at Various Times in the Academy of Sedan, vol. 1 3rd ed. tr. by AI by Colloquia Scholastica at Discord (1675; London, 1683), on the Impeccability of Christ, p. 570 Latin">Copy</button><a class="share" href="https://x.com/intent/post?text=%E2%80%9CI%E2%80%A6+The+occasion+for+this+calumny+%5Bby+Romanists%5D+is+taken+from+Calvin%E2%80%99s+words+in+Mt.+26%2C+found+in+his+Harmony+of+the+Gospels.+There%2C+Calvin%2C+writing+about+Christ%E2%80%99s+prayer%2C+%E2%80%9CMy+Father%2C+if+it+is+possible%2C+let+this+cup+pass+from+me%3B+yet+not+as+I+will%2C+but+as+you+will%2C%E2%80%9D+includes+these+words+among+others%3A+%E2%80%98He+was+struck+with+fear+and+constricted+by+anxiety%2C+so+that+it+was+necessary+for+him+to+vacillate%2C+as+it+were%2C+with+alternating+prayers+amidst+the+violent+waves+of+temptations.+This+is+the+reason+why%2C+having+prayed+for+the+cup+to+pass%2C+He+immediately+reins+Himself+in%2C+and+submitting+his+prayer+to+the+Father%E2%80%99s+command%2C+He+chastises+and+recalls+the+request+that+had+just+slipped+out.+And+there%2C+He+says%2C+%E2%80%98This+was+not+a+deliberate+prayer+of+Christ%2C+but+the+force+and+sudden+impulse+of+grief+extorted+the+words%2C+to+which+correction+was+immediately+added%3B+the+same+vehemence+also+took+away+the+immediate+memory+of+the+heavenly+decree.%E2%80%9D%0A%0A%E2%80%94+Louis+Le+Blanc%2C+Theological+Theses+published+at+Various+Times+in+the+Academy+of+Sedan%2C+vol.+1+3rd+ed.+tr.+by+AI+by+Colloquia+Scholastica+at+Discord+%281675%3B+London%2C+1683%29%2C+on+the+Impeccability+of+Christ%2C+p.+570+Latin&amp;url=https%3A%2F%2F5solasquotes.github.io%2Fquote%2Fc52fb8e7b4.html&amp;via=5Solas" target="_blank" rel="noopener">Share on X</a><a class="perma" href="../quote/c52fb8e7b4.html">Permalink</a><a class="src" href="https://reformedbooksonline.com/topics/topics-by-subject/christ/the-human-and-divine-natures-of-christ/on-the-human-nature-of-christ/#:~:text=The%20occasion%20for%20this%20calumny%20%5Bby,immediate%20memory%20of%20the%20heavenly%20decree&amp;text=The%20occasion%20for%20this%20calumny%20%5Bby%20Romanists%5D%20is&amp;text=away%20the%20immediate%20memory%20of%20the%20heavenly%20decree" rel="noopener" target="_blank">Read it online · Reformed Books Online</a></div>

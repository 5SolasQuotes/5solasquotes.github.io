<main class="wrap"><figure class="quote" id="q-438aa6076f" data-kw="">
<blockquote><p>Material and formal cause, properly so called, does not have place in accidents, although by some all beings promiscuously, whether substances or accidents, are wont to be explained through four kinds of causes. Yet if anyone wishes to form analogical concepts of it [regeneration] after the manner of physical generation, let him consider: I. The Holy Spirit as the one generating, 1 Jn. 5:1. II. The transient matter or matter of generation, the Word of God, which is compared to seed, 1 Pet. 1:23. III. The proximate constituting matter, the intellect. IV. The form, faith or the new creature. V. The composite from man’s intellect with will and from the image of God or new creature: let it be the new man, the man of God, the spiritual man. VI. That introduced form informs and actuates the matter, and thus renders man active for spiritual life; moreover constitutes him in a certain kind of things and distinguishes him from all other men not regenerate; finally renders him fit for every good work.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/gisbertus-voetius.html">Gisbertus Voetius</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Disputation 29, ‘On Regeneration’, pt. 1</cite>, (1639) tr. AI by Roman Prestarri in Select Theological Disputations (1655), vol. 2, pp. 432-65 Latin at Confessionally Reformed Theology</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/theology/faith-and-reason.html">Faith and Reason</a></span></div>

</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-d4371b9201" data-kw="">
<blockquote><p>The idea that no philosophies are better than [an]other has also only become less plausible in the last ten years… The idea that there are no gradations among secular thinkers with regard to natural theology and natural law or even the hidden things is empirically disproven by Jordan Peterson and like thinkers… Cornelius Van Til and Karl Barth both argued that, among all the various positions of philosophers, we should not acknowledge that some are better and others worse. They are all equally the wisdom of this age to which the hidden wisdom of Christ is opposed. Emil Brunner came back with a rebuttal, affirming the betterness of the kind of anti-materialist and moral realist philosophy of Socrates, Plato, and Aristotle and their modern successors, as opposed to the naturalism of Darwin, Marx, Freud, and Nietzsche. I would say the same for Jordan Peterson with respect to the New Atheists.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/joel-carini.html">Joel Carini</a></span><span class="wk"><span class="lbl">Work:</span> <cite>”The Natural Man does Not Accept the Things of the Spirit of God’ – But He Can Accept Natural Theology: A Response to Brian Mattson &amp; Richard Gaffin’</cite>, (2024)</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/theology/faith-and-reason.html">Faith and Reason</a></span></div>

</figure><figure class="quote" id="q-cb67543f31" data-kw="">
<blockquote><p>It may well be, and I find it convincing, that there is a great deal of continuity between the mainstream of Protestant reformers, especially in the Reformed tradition, and the thought of Thomas Aquinas, on a wide variety of points, some metaphysical, some doctrinal, and some moral and practical. But it is not the case that the Reformers as such were concerned with being faithful Thomists. The teaching of Thomas Aquinas, whether engaged directly or filtered through various traditions and appropriated as such, was of instrumental value to the Reformers. The point for the Reformers in engaging Thomas was not so that they could become more faithful Thomists. Rather, they used Thomas to the extent that they found Thomas and his teachings helpful in clarifying the true teachings of the church and necessary reforms. The same is true, mutatis mutandis, for other predecessors, whether Bernard of Clairvaux, Duns Scotus, or Gregory of Rimini, which explains in part the persistent eclecticism of the Reformers—considered both individually and corporately—even where there is more or less clear dependence or reliance on an earlier authority. In this way, there is the potential for misunderstanding if something identified as Reformed Thomism or Calvinist Thomism is taken to mean that there was a self-styled attempt by Reformed theologians to be Thomists in the sixteenth or seventeenth centuries… The ‘sounder scholastics’ (like Thomas) are put to positive use more often essentially because they are sounder. But where a Reformer thinks that Thomas is mistaken or not helpful, there is little hesitation to depart from (or ignore) his thought.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/jordan-j-ballor.html">Jordan J. Ballor</a></span><span class="wk"><span class="lbl">Work:</span> <cite>‘The Prophetic Role of The Protestant Reformation’</cite>, (2024) in Hanover Review, vol. 3, no. 1 (2024)</span></figcaption>

<blockquote><p>XXIV. It is asked, fifth, whether infants before all use of reason are subject to actual sin… The Reformed, although they acknowledge that original corruption is actually present in infants, from which by nature they are prone to all actual sins, and moreover bear in themselves the seeds of the same, nonetheless deny that they are properly subject to any actual sin… Nevertheless they object:… (2) That the human mind consists in actual thought, which can not only be congruent with divine law, but also repugnant to it. I respond: (1) That the human mind is a thinking substance which, with organs adequately disposed, can think, we do not doubt, just as it is a reasoning substance, not because it is always reasoning in actuality, but because it can reason, with necessary things put in place.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/petrus-van-mastricht.html">Petrus van Mastricht</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Theoretical Practical Theology</cite>, (RHB), vol. 3, bk. 4, ch. 3, ‘Actual Sin’, sections 24</span></figcaption>

<blockquote><p>For we all acknowledge and clearly profess, that God infuses a righteousness of this kind in the very act of justifying; but we deny that the sentence of God in justifying has respectto this as to the cause by which man is constituted justified.</p></blockquote>

<blockquote><p>1. Justification is an action, by which God makes an ungodly man righteous, according to the good pleasure of his will, and without any merit of his own for salvation… 9. Therefore, although it is said figuratively, yet fittingly and truly, we say that we are justified by faith alone, comparing it with works and merits, and not by the works of the law, but by faith freely in our Lord Jesus Christ.</p></blockquote>

<blockquote><p>So the pardon of sin is given of grace, and not for works, though pardon be granted only to the penitent, and faith on our part, a lively, unfained and working faith be required to receive the promise. … The stipulation required is that we take God to be our God, that is, that we repent of our iniquities, believe the promises of mercy and embrace them with the whole heart, and yield love, fear, reverence, worship, and obedience unto Him, according to the prescript rule of his Word. Repentance is called for in this Covenant, as it sets forth the subject capable of salvation by faith, but is itself only an acknowledgement of sin, no healing of our wound, or cause of our acquittance. The feeling of pain and sickness causes a man to desire and seek remedy, but it is no remedy itself. (Lk. 13:5; Acts 11:18; 2 Cor. 7, 10; Eze. 18:27) Hunger and thirst make a man to desire and seek for food, but a man is not fed by being hungry. By repentance we know ourselves, we feel our sickness, we hunger and thirst after grace, but the hand which we stretch forth to receive it, is faith alone, without which repentance is nothing but darkness and despair. Repentance is the condition of faith and the qualification of a person capable of salvation: but faith alone is the cause of justification and salvation, on our part required. It is a penitent and petitioning faith, whereby we receive the promises of mercy, but we are not justified partly by prayer, partly by repentance, and partly by faith, but by that faith which stirs up godly sorrow for sin, and enforces us to pray for pardon and salvation. … In the Covenant of works, works were required as the cause of life and happiness: but in the Covenant of grace, though repentance be necessary and must accompany faith, yet not repentance, but faith only is the cause of life. The cause not efficient, as works should have been, if man had stood in the former Covenant, but instrumental only: for it is impossible that Christ, the death and blood of Christ, and our faith should be together the efficient or procuring causes of justification or salvation. … If then, when we speak of the conditions of the covenant of grace, by “condition” we understand whatsoever is required on our part, as precedent, concomitant, or subsequent to justification, repentance, faith, and obedience are all conditions; but if by “condition” we understand what is required on our part as the cause of the good promised, though only instrumental, faith or belief in the promises of free mercy is the only condition. … In this covenant man promises to repent of his sins, and, repenting, to cleave to the promise of mercy made in Jesus Christ, and in faith to yield willing, cheerful, and continual obedience.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/john-ball.html">John Ball</a></span><span class="wk"><span class="lbl">Work:</span> <cite>A Treatise of the Covenant of Grace… (London: 1645), ch. 3, ‘Of the Covenant of Grace in General’</cite>, pp. 17-21</span></figcaption>

<blockquote><p>XXX. Indeed, when we say that faith alone justifies, we do not even mean by that merely the act of believing taken precisely, as it is opposed to acts of love and hope, and is distinguished from repentance, or penitence, as being the condition demanded by the new covenant, or Gospel, for us to obtain the remission of our sins and to be absolved from them because of Christ. For just as the hope of pardon and the love of God, as well as sorrow for sin and the purpose of leading a new life, and, in a word, all the acts necessary for true and sincere conversion, are also required, so they are necessary and altogether prerequisite so that anyone may be received into favor by God and may be regarded by Him as justified. Indeed, that living and operative faith which we affirm justifies alone includes and involves all these acts. XXXI. And just as Scripture frequently asserts that we obtain the remission of sins through faith, so, no less frequently and expressly, does it teach that repentance and the entire conversion of the sinner to God are conditions without which the remission of sins cannot be obtained from God, and which, no less than faith, are required beforehand for it, although it neither effects nor merits it. To this belongs Solomon’s saying, already cited before, “He who hides his sins will not prosper, but he who confesses and forsakes them will obtain mercy.” And what Christ says in Luke, “Unless you repent, you will all likewise perish.” Hence it is that Peter thus exhorts the Jews, “Repent and be baptized every one of you in the name of Jesus Christ for the remission of your sins,” Acts 2:38. And, “Repent, therefore, and turn again, that your sins may be blotted out,” Acts 3:19. … LII. From what has now been explained, it is clear that the doctors of both the Roman and Reformed Schools recognize by common consent: … 2. That only living faith justifies, while dead faith contributes nothing to justice and salvation. 3. That not only the act of believing taken precisely but many other acts also, which concur to true repentance and serious conversion to God, are conditions required by God for one to obtain from Him the remission of sins and the infusion of new and habitual justice. 4. That the remission of sins and the renewal of the inner man are purely gratuitous gifts of God, which are not due out of justice to faith or any works, however much performed by the grace of God. 5. That it is fitting and suitable to divine goodness and wisdom to remit sins and grant the grace of the Holy Spirit to a sinner who sincerely repents and flees to God’s mercy by faith, but not to the unbelieving and impenitent. 6. That the new justice which the Holy Spirit creates in the faithful consists not only of the habit of faith but also of other Christian virtues.</p></blockquote>

on+of+your+sins%2C%E2%80%9D+Acts+2%3A38.+And%2C+%E2%80%9CRepent%2C+therefore%2C+and+turn+again%2C+that+your+sins+may+be+blotted+out%2C%E2%80%9D+Acts+3%3A19.+%E2%80%A6+LII.+From+what+has+now+been+explained%2C+it+is+clear+that+the+doctors+of+both+the+Roman+and+Reformed+Schools+recognize+by+common+consent%3A+%E2%80%A6+2.+That+only+living+faith+justifies%2C+while+dead+faith+contributes+nothing+to+justice+and+salvation.+3.+That+not+only+the+act+of+believing+taken+precisely+but+many+other+acts+also%2C+which+concur+to+true+repentance+and+serious+conversion+to+God%2C+are+conditions+required+by+God+for+one+to+obtain+from+Him+the+remission+of+sins+and+the+infusion+of+new+and+habitual+justice.+4.+That+the+remission+of+sins+and+the+renewal+of+the+inner+man+are+purely+gratuitous+gifts+of+God%2C+which+are+not+due+out+of+justice+to+faith+or+any+works%2C+however+much+performed+by+the+grace+of+God.+5.+That+it+is+fitting+and+suitable+to+divine+goodness+and+wisdom+to+remit+sins+and+grant+the+grace+of+the+Holy+Spirit+to+a+sinner+who+sincerely+repents+and+flees+to+God%E2%80%99s+mercy+by+faith%2C+but+not+to+the+unbelieving+and+impenitent.+6.+That+the+new+justice+which+the+Holy+Spirit+creates+in+the+faithful+consists+not+only+of+the+habit+of+faith+but+also+of+other+Christian+virtues.%E2%80%9D%0A%0A%E2%80%94+Louis+Le+Blanc%2C+Theological+Theses+published+at+Various+Times+in+the+Academy+of+Sedan%2C+vol.+1+3rd+ed.+tr.+by+AI+by+Colloquia+Scholastica+at+Discord+%281675%3B+London%2C+1683%29%2C+on+How+Faith+Justifies%2C+pp.+228-29%2C+234+Latin&amp;url=https%3A%2F%2F5solasquotes.github.io%2Fquote%2F377645d263.html&amp;via=5Solas" target="_blank" rel="noopener">Share on X</a><a class="perma" href="../quote/377645d263.html">Permalink</a><a class="src" href="https://reformedbooksonline.com/that-a-certain-inherent-holiness-or-graces-repentance-is-requisite-by-way-of-order-accompaniment-to-faith-in-christ-justification/#:~:text=XXX.%20Indeed%2C%20when%20we%20say%20that,but%20also%20of%20other%20Christ <blockquote><p>…take notice of this distinction, as a foundation, viz. that there is in Scripture a twofold repentance or humiliation of the soul for sin: The one antecedent and going before pardon, and this the Scripture requires as a necessary condition, without which forgiveness of sin cannot be obtained: of this repentance the Scripture for the most part speaks, Eze. 18:18, 30; Mt. 3.2; Mk. 6.12; Lk. 13:3; Acts 3:19; and generally in most places of Scripture. In the second place there is an humiliation of heart and brokenness of soul for sin, arising from the apprehension of God’s love in pardoning, whereby we grieve that we should deal so unkindly with so good and gracious a God: this, though more rarely, yet is sometimes spoken of in Scripture, as first in this woman, who out of the apprehension of God’s love in pardoning so much to her did pour out her soul in all ways of thankfulness. After this manner also was David’s repentance, Ps. 51; for he was thus deeply affected after Nathan had told him his sin was taken away; although it does appear by the psalm also that he had not as yet that sense of pardon which did quiet his conscience. This kind of affection was also in Paul, 1 Tim. 1:12–16; 1 Cor. 15:8–9, in which places the apostle, remembering his former sins, confesses them, and acknowledges thereby his unworthiness of all that grace and favour he had received; so that the apostle does not there humble himself that he may obtain mercy, but because he had obtained mercy. The most eminent instance of this kind of sorrow and shame is Eze. 16:62–63, where God promises to establish his covenant with them, and then mark the event of this: ‘That thou mayest remember and be confounded, and never open thy mouth more because of thy shame, when I am pacified toward thee.’ So then both these kinds of humiliations are to be owned and practiced; and therefore it is a false and dangerous error to acknowledge no other kind of repentance than the latter [former]. The Papists will not acknowledge this latter humiliation at all, because they deny all faith and assurance that a believer may have of his sins in particular. And others say that there is only this latter; and therefore the forementioned author, in his treatise of Gospel Repentance, makes this only gospel-repentance. But as gospel-faith is not that reflex act of the soul in a man whereby it is persuaded that Christ is his, but a direct act of taking and receiving Christ to be ours, so a gospel-repentance is not that mainly whereby we are humbled because we receive God’s love to us in pardoning, but principally in that loathing of ourselves to obtain pardon. It is therefore great ignorance in that author, in his treatise of Gospel Repentance, when p. 58, he calls repentance that goes before this faith, viz. that my sins are pardoned, a dead work; as if the faith that justifies, and without which it is impossible to please God, were the believing that my sins are pardoned; whereas the Scripture makes it to be the receiving of Christ and laying hold on Him. And seeing that the object must in order of nature be before the act that is employed about it, it follows infallibly that I must have justification before I can believe I have it. Repentance therefore may be thought to go before a twofold act of faith: first, that whereby Christ is laid hold upon and made ours, and so the repentance that precedes this may be called legal and slavish. Or secondly, before a persuasion that my sins are pardoned; and before this act of faith repentance must necessarily go, because the covenant of grace dispenses pardon only to such.</p></blockquote>

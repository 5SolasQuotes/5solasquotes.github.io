<main class="wrap"><figure class="quote" id="q-9275eb2aed" data-kw="">
<blockquote><p>Ignorance. Men hear of Christ, but are not acquainted with him; many come to the ordinances, but only to sit out the hour, not to grow in the knowledge of Jesus Christ. There is much in a man’s ends why he cometh to the ordinances: God seldom meets with a man in his word that cometh to it with a vain end; if they do not seek after knowledge they shall not find it. Many of the reports of Jesus Christ are lost upon an ignorant people; they hear the name, and do not weigh the thing in their thoughts; they look upon him as aliquem magnum—as some great person that the preachers talk of, and go no further.

Thousands are damned this way through their ignorance; they do not trouble their thoughts about getting the knowledge of Christ in his word, they come to the church and rest in that. There must be distinct apprehensions of the report of Christ before faith, not only to hear the sound, but weigh the sense: Rom. 10:14, ‘How shall they believe in him of whom they have not heard?’ that is, not only the sound of his name, but heard so as to weigh the doctrine that was delivered concerning him. This affected ignorance is a great hindrance when men do not apply themselves to knowledge; as it is, Prov. 2:2, 3, ‘Incline thine ear to wisdom, and apply thy heart to understanding: yea, if thou criest for knowledge, and liftest up thy voice for understanding.’

Many incline their ears, but they do not apply their hearts to knowledge, weigh and ponder what they hear; if they attend to it while it is spoken, they do not consider it afterwards in their more serious thoughts, and ponder it in their minds; and therefore no wonder they do not close with Christ: Rom. 3:11, ‘There is none that understandeth, none that seeketh after God.’ That will necessarily follow, if they do not understand Christ, they will not seek after him; a man will not value an unknown good. This is one hindrance, gross and affected ignorance.</p></blockquote>

<blockquote><p>But No Collection Is To Be Made In The Time of Divine Service Therefore though I cannot like of the disordered gathering for the poor that is in many places, where in the time of divine service you shall see men go up and down asking, receiving, changing, and bestowing of money – wherein many times you shall have them so disagree, that they are louder than the minister – and the rest stand looking, and listening unto them, leaving the worship of God (as though it did not concern them), and thus all is confused; so yet I am persuaded that this is the fittest time to make this provision. And I presume that it is not the meaning of our godly wise rulers in the church and commonwealth (who are abused therein), that any such thing should be done; but that the gathering being made at some other time of day, before or after the divine service, they might have it in a readiness beforehand, to bestow at the end of service upon the needy, according to their discretion; or generally to take some good order that God might be best served, our brethren relieved, and no man justly offended. {And it seems that Justin Martyr would insinuate thus much unto us, that in his time at their public assemblies not only there was collection for the poor, but in this manner. For speaking of all things that were done publicly, he speaks of this last, as though it were last done, when he says: ‘first the books of the prophets and apostles were read; then some exhortation was made to the people; after this there was prayer and thanksgiving.’ [157] Not that there was none before, but then were there solemn prayers for the whole Church, and for them that are in authority. ‘Fourthly, the creatures of bread and wine were blessed and distributed unto the people; and last of all the richer sort did contribute something to the poor, as God did make them able, and willing.’ By which as we may presume that it was his meaning to show that this was their order, that the reading and preaching of the Word of God and prayer went before the sacrament, so all of them before their collection for the poor; so that it did neither prevent any of them, nor was mingled with them; whose example should be our imitation.} 157. Justin Martyr, Apolog. 2 [Cf. First Apology, ch. 67, ANF 1, 186. Cf. Migne, PG 6, 430.] But we may say of this thing [offering during the worship service], as the papists do of private mass (which they cannot defend), that the iniquity of the people brought it in. For when men through covetousness would not follow the rule of the apostle, to put something apart for the poor, as they should find God had blessed them (1 Cor. 16:2), and so bring that with them and have it in readiness, as he says here, being persuaded that it is a duty which God requires of them, and so do it cheerfully (2 Cor. 9:7), as unto Him who has promised to reward it; but being left to their discretion, they have shifted it off as they might; and when divine service was ended, and now nothing more was to be done in the church but that, they would not tarry [for] it. Then, the collectors for the poor were compelled to take them in the midst of God’s service, when for very shame by starting {aside} they could not refuse. But from the beginning it was not so; and seeing God is not the author of confusion, all things in the Church must be done honestly and in good order (1 Cor. 14:33-40). {But what order can there be in this, that then, when the minister is reading or praying, unto the which all should attend without interruption, others should be chopping and changing of money, and squaring about it? Or to speak the best of it, quietly taking out their purse, seeking in it, and distributing out of it? We would think it strange, if while the pastor were thus occupied, some other men should read aloud a chapter in another end of the church, or three or four should begin to sing a psalm. Why then should it not seem as strange unto us, when the minister is occupied in the public service, that others should interpose themselves with gathering of money? Especially seeing that others may better agree together than these two, seeing they are more suitable, as being all of them parts of God’s divine immediate worship, and so is not the gathering and giving of alms, though it be a work of the Sabbath day. Besides, seeing the apostle does justly blame the Corinthians for not using their spiritual gifts so in the public assemblies, as the whole church might be best edified by them – saying, What is to be done then brethren? when ye come together, according as every one of you hath a psalm, or hath a doctrine, or hath a tongue, or hath revelation, or hath interpretation: let all things be done unto edifying (1 Cor. 14:26) – then how much more would he blame them, for so using their temporal gifts in the church, that they should tend to the destruction of themselves, and others? Now for a man, when he is devoutly occupied in any part of God’s public worship, to have another man come and pull him by the sleeve, and to whisper in his ear, and for him then to draw out his purse, and to change money; whether this be likely to edify, or destroy them both, that is, to further, or to hinder them in that about the which then they should be occupied, let other men judge. I am sure it is contrary to an injunction made in the days of our late sovereign Queen Elizabeth, of most blessed and famous memory, which as far as I conceive is not reversed by any of the last canons and ecclesiastical constitutions made in the first year of his Highness’ reign (whom God preserve and bless), in which it was decreed, ‘that no man, woman, or child, should otherwise be occupied in the time of service, than in quiet attendance to hear, mark, and understand that that is read, preached and ministered.’ [158] 158. Elizabeth, Injunct. Article 38 (Q. Iniunct. Articl. 38). [Cf. Injunctions given by the Queens Majesty concerning both the clergy and laity (1559; repr. c.1840), 9]. And so I conclude, that as alms giving is a necessary and perpetual duty to be performed upon the Sabbath day, so that it ought to be performed after that manner that no part of God’s public worship may be hindered, interrupted, or made unprofitable by it.</p></blockquote>

+without+interruption%2C+others+should+be+chopping+and+changing+of+money%2C+and+squaring+about+it%3F+Or+to+speak+the+best+of+it%2C+quietly+taking+out+their+purse%2C+seeking+in+it%2C+and+distributing+out+of+it%3F+We+would+think+it+strange%2C+if+while+the+pastor+were+thus+occupied%2C+some+other+men+should+read+aloud+a+chapter+in+another+end+of+the+church%2C+or+three+or+four+should+begin+to+sing+a+psalm.+Why+then+should+it+not+seem+as+strange+unto+us%2C+when+the+minister+is+occupied+in+the+public+service%2C+that+others+should+interpose+themselves+with+gathering+of+money%3F+Especially+seeing+that+others+may+better+agree+together+than+these+two%2C+seeing+they+are+more+suitable%2C+as+being+all+of+them+parts+of+God%E2%80%99s+divine+immediate+worship%2C+and+so+is+not+the+gathering+and+giving+of+alms%2C+though+it+be+a+work+of+the+Sabbath+day.+Besides%2C+seeing+the+apostle+does+justly+blame+the+Corinthians+for+not+using+their+spiritual+gifts+so+in+the+public+assemblies%2C+as+the+whole+church+might+be+best+edified+by+them+%E2%80%93+saying%2C+What+is+to+be+done+then+brethren%3F+when+ye+come+together%2C+according+as+every+one+of+you+hath+a+psalm%2C+or+hath+a+doctrine%2C+or+hath+a+tongue%2C+or+hath+revelation%2C+or+hath+interpretation%3A+let+all+things+be+done+unto+edifying+%281+Cor.+14%3A26%29+%E2%80%93+then+how+much+more+would+he+blame+them%2C+for+so+using+their+temporal+gifts+in+the+church%2C+that+they+should+tend+to+the+destruction+of+themselves%2C+and+others%3F+Now+for+a+man%2C+when+he+is+devoutly+occupied+in+any+part+of+God%E2%80%99s+public+worship%2C+to+have+another+man+come+and+pull+him+by+the+sleeve%2C+and+to+whisper+in+his+ear%2C+and+for+him+then+to+draw+out+his+purse%2C+and+to+change+money%3B+whether+this+be+likely+to+edify%2C+or+destroy+them+both%2C+that+is%2C+to+further%2C+or+to+hinder+them+in+that+about+the+which+then+they+should+be+occupied%2C+let+other+men+judge.+I+am+sure+it+is+contrary+to+an+injunction+made+in+the+days+of+our+late+sovereign+Queen+Elizabeth%2C+of+most+blessed+and+famous+memory%2C+which+as+far+as+I+conceive+is+not+reversed+by+any+of+the+last+canons+and+ecclesiastical+constitutions+made+in+the+first+year+of+his+Highness%E2%80%99+reign+%28whom+God+preserve+and+bless%29%2C+in+which+it+was+decreed%2C+%E2%80%98that+no+man%2C+woman%2C+or+child%2C+should+otherwise+be+occupied+in+the+time+of+service%2C+than+in+quiet+attendance+to+hear%2C+mark%2C+and+understand+that+that+is+read%2C+preached+and+ministered.%E2%80%99+%5B158%5D+158.+Elizabeth%2C+Injunct.+Article+38+%28Q.+Iniunct.+Articl.+38%29.+%5BCf.+Injunctions+given+by+the+Queens+Majesty+concerning+both+the+clergy+and+laity+%281559%3B+repr.+c.1840%29%2C+9%5D.+And+so+I+conclude%2C+that+as+alms+giving+is+a+necessary+and+perpetual+duty+to+be+performed+upon+the+Sabbath+day%2C+so+that+it+ought+to+be+performed+after+that+manner+that+no+part+of+God%E2%80%99s+public+worship+may+be+hindered%2C+interrupted%2C+or+made+unprofitable+by+it.%E2%80%9D%0A%0A%E2%80%94+Nicholas+Bownd%2C+Sabbathum+Veteris+et+Novi+Testamenti%2C+1635%2C+ed.+Christopher+Coldwell+%28Dallas%2C+TX+and+Grand+Rapids%2C+MI%3A+Naphtali+Press+and+Reformation+Heritage+Books%2C+2015%29&amp;url=https%3A%2F%2F5solasquotes.github.io%2Fquote%2F39a49d7ec1.html&amp;via=5Solas" target="_blank" rel="noopener">Share on X</a><a class="perma" href="../quote/39a49d7ec1.html">Permalink</a><a class="src" href="https://reformedbooksonline.com/topics/topics-by-subject/worship/tithes-and-offerings/offering-is-not-an-element-of-public-worship/#:~:text=But%20No%20Collection%20Is%20To%20Be,interrupted%2C%20or%20made%20unprofitable%20by%20it&amp;text=But%20No%20Collection%20Is%20To%20Be%20Made%20In&amp;text=be%20hindered%2C%20interrupted%2C%20or%20made%20unprofitable%20by%20it" rel="noopener" target="_blank">Read it online · Reformed Books Online</a></div>

</figure><figure class="quote" id="q-682b6ca324" data-kw="">
<blockquote><p>The Bishop presseth us with a fourth Argument, taken from the calling of people in great Towns, from their ordinary labours to Divine service. Which Argument Tilen also beateth upon. Ans. There is huge difference betwixt the rest which is enjoined upon anniversary Festivities, and the rest which is required, during the time of the weekly meetings for Divine Worship. For, 1. Upon Festival days, rest from labour is required all the day over, whereas upon the days of ordinary and weekly meetings, rest is required, only during the time of public Worship. 2. Cessation from labour for Prayers or Preaching on those appointed days of the week, at some occasions may be omitted, but the rest, and commemoration appointed by the Church to be precisely observed upon the anniversary Festival days, must not be omitted, in the Bishop’s judgment. 3. Men are straitly commanded &amp; compelled to rest from labour upon Holy days, but to leave work to come to the ordinary weekly meetings, they are only exhorted. And here I mark how the Bishop contradicteth himself: for in one place where his Antagonist maintaineth truly, that the Craftsman cannot be lawfully commanded nor compelled to leave his work, and to go to public Divine Service, except on the day that the Lord hath sanctified: He replieth, if he may be lawfully commanded to cease from his labour, during the time of divine service, he may be as lawfully compelled to obey the command.

Who can give these words any sense, or see anything in them said against his Antagonist’s position, except he be taken to say, that the Craftsman may be both commanded and compelled to leave his work, &amp; go to Divine Service, on the week days appointed for the same? Nay, he laboureth to prove thus much out of the 9. head of the first book of Discipline, which saith: In great Towns, we think expedient that every day there be either Sermon or common Prayers, &amp;c. Where there is nothing of compulsion, or a forcing command, only there is an exhortation. But ere the Bishop have said much, he forgetteth himself, and tells us, that it were against Equity &amp; Charity, to adstrict the husband-man to leave his plough, so oft as the days of weekly preaching do return, but that on the Festival days, reason would, that if he did not leave his plough willingly, by Authority he should be forced. Which place confirmeth this difference, which we give betwixt rest on the holy days, and rest at the times of weekly meeting.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/george-gillespie.html">George Gillespie</a></span><span class="wk"><span class="lbl">Work:</span> <cite>A dispute against the English-popish ceremonies, obtruded upon the Church of Scotland</cite>, (n.p., 1637), Part I, p. 24.</span></figcaption>

Who can give these words any sense, or see anything in them said against his Antagonist’s position, except he be taken to say, that the Craftsman may be both commanded and compelled to leave his work, &amp; go to Divine Service, on the week days appointed for the same? Nay, he laboureth to prove thus much out of the 9. head of the first book of Discipline, which saith: In great Towns, we think expedient that every day there be either Sermon or common Prayers, &amp;c. Where there is nothing of compulsion, or a forcing command, only there is an exhortation. But ere the Bishop have said much, he forgetteth himself, and tells us, that it were against Equity &amp; Charity, to adstrict the husband-man to leave his plough, so oft as the days of weekly preaching do return, but that on the Festival days, reason would, that if he did not leave his plough willingly, by Authority he should be forced. Which place confirmeth this difference, which we give betwixt rest on the holy days, and rest at the times of weekly meeting.”

3F+Nay%2C+he+laboureth+to+prove+thus+much+out+of+the+9.+head+of+the+first+book+of+Discipline%2C+which+saith%3A+In+great+Towns%2C+we+think+expedient+that+every+day+there+be+either+Sermon+or+common+Prayers%2C+%26c.+Where+there+is+nothing+of+compulsion%2C+or+a+forcing+command%2C+only+there+is+an+exhortation.+But+ere+the+Bishop+have+said+much%2C+he+forgetteth+himself%2C+and+tells+us%2C+that+it+were+against+Equity+%26+Charity%2C+to+adstrict+the+husband-man+to+leave+his+plough%2C+so+oft+as+the+days+of+weekly+preaching+do+return%2C+but+that+on+the+Festival+days%2C+reason+would%2C+that+if+he+did+not+leave+his+plough+willingly%2C+by+Authority+he+should+be+forced.+Which+place+confirmeth+this+difference%2C+which+we+give+betwixt+rest+on+the+holy+days%2C+and+rest+at+the+times+of+weekly+meeting.%E2%80%9D%0A%0A%E2%80%94+George+Gillespie%2C+A+dispute+against+the+English-popish+ceremonies%2C+obtruded+upon+the+Church+of+Scotland%2C+%28n.p.%2C+1637%29%2C+Part+I%2C+p.+24.&amp;url=https%3A%2F%2F5solasquotes.github.io%2Fquote%2F682b6ca324.html&amp;via=5Solas" target="_blank" rel="noopener">Share on X</a><a class="perma" href="../quote/682b6ca324.html">Permalink</a><a class="src" href="https://reformedcovenanter.wordpress.com/2023/05/20/george-gillespie-on-the-difference-between-mandatory-holy-days-and-voluntary-mid-week-gatherings/" rel="noopener" target="_blank">Read it online · Reformed Covenanter</a></div>

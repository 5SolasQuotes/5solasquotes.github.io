<blockquote><p>Reproaches have been the lot of the best men. They called Athanasius, Sathanasius; Cyprianus, Coprianus, a gatherer of dung; blessed Paul, ‘a pestilent fellow’; Dr. Story threw a faggot at sweet Mr. Denlie’s face as he was singing a psalm in the midst of the flames, saying, ‘I have spoiled a good old song.&#x27;</p></blockquote>

</figure><figure class="quote" id="q-fec6114fcb" data-kw="">
<blockquote><p>He [Baynes] subsequently discusses the difference of the words in terms of the manner of singing. He does say that a spiritual song might be one which is framed according to the Scripture (Baynes, [ed. London, 1658,] p. 505), but makes no suggestion that this is to be used in an ordinary public worship context. When he comes to “the sum of the verse,” he speaks of “singing both in private and publick, which this Scripture and Col. 3:16 do commend;” but where he speaks of the church service he confines his terms to “Psalms”—”and all things, Psalms, Prayers in the Church must be to edify” (p. 505). When he finally applies the passage he provides this maxim: “get the spirit of David to sing a Psalm of David” (p. 506).</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/paul-baynes.html">Paul Baynes</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Matthew Winzer, ‘Westminster and Worship Examined: a Review of Nick Needham’s Essay on the Westminster Confession of Faith’s Teaching Concerning the Regulative Principle, the Singing of Psalms, and the Use of Musical Instruments in the Public Worship of God’ from The Confessional Presbyterian #4</cite>, Matthew Winzer, ‘Westminster and Worship Examined: a Review of Nick Needham’s Essay on the Westminster Confession of Faith’s Teaching Concerning the Regulative Principle, the Singing of Psalms, and the Use of Musical Instruments in the Public Worship of God’ from The Confessional Presbyterian #4 (2008), p. 264</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/worship/psalmody.html">Psalmody</a></span></div>
<div class="actions"><button class="copy" data-copy="“He [Baynes] subsequently discusses the difference of the words in terms of the manner of singing. He does say that a spiritual song might be one which is framed according to the Scripture (Baynes, [ed. London, 1658,] p. 505), but makes no suggestion that this is to be used in an ordinary public worship context. When he comes to “the sum of the verse,” he speaks of “singing both in private and publick, which this Scripture and Col. 3:16 do commend;” but where he speaks of the church service he confines his terms to “Psalms”—”and all things, Psalms, Prayers in the Church must be to edify” (p. 505). When he finally applies the passage he provides this maxim: “get the spirit of David to sing a Psalm of David” (p. 506).”

— Paul Baynes, Matthew Winzer, ‘Westminster and Worship Examined: a Review of Nick Needham’s Essay on the Westminster Confession of Faith’s Teaching Concerning the Regulative Principle, the Singing of Psalms, and the Use of Musical Instruments in the Public Worship of God’ from The Confessional Presbyterian #4 (2008), p. 264">Copy</button><a class="share" href="https://x.com/intent/post?text=%E2%80%9CHe+%5BBaynes%5D+subsequently+discusses+the+difference+of+the+words+in+terms+of+the+manner+of+singing.+He+does+say+that+a+spiritual+song+might+be+one+which+is+framed+according+to+the+Scripture+%28Baynes%2C+%5Bed.+London%2C+1658%2C%5D+p.+505%29%2C+but+makes+no+suggestion+that+this+is+to+be+used+in+an+ordinary+public+worship+context.+When+he+comes+to+%E2%80%9Cthe+sum+of+the+verse%2C%E2%80%9D+he+speaks+of+%E2%80%9Csinging+both+in+private+and+publick%2C+which+this+Scripture+and+Col.+3%3A16+do+commend%3B%E2%80%9D+but+where+he+speaks+of+the+church+service+he+confines+his+terms+to+%E2%80%9CPsalms%E2%80%9D%E2%80%94%E2%80%9Dand+all+things%2C+Psalms%2C+Prayers+in+the+Church+must+be+to+edify%E2%80%9D+%28p.+505%29.+When+he+finally+applies+the+passage+he+provides+this+maxim%3A+%E2%80%9Cget+the+spirit+of+David+to+sing+a+Psalm+of+David%E2%80%9D+%28p.+506%29.%E2%80%9D%0A%0A%E2%80%94+Paul+Baynes%2C+Matthew+Winzer%2C+%E2%80%98Westminster+and+Worship+Examined%3A+a+Review+of+Nick+Needham%E2%80%99s+Essay+on+the+Westminster+Confession+of+Faith%E2%80%99s+Teaching+Concerning+the+Regulative+Principle%2C+the+Singing+of+Psalms%2C+and+the+Use+of+Musical+Instruments+in+the+Public+Worship+of+God%E2%80%99+from+The+Confessional+Presbyterian+%234+%282008%29%2C+p.+264&amp;url=https%3A%2F%2F5solasquotes.github.io%2Fquote%2Ffec6114fcb.html&amp;via=5Solas" target="_blank" rel="noopener">Share on X</a><a class="perma" href="../quote/fec6114fcb.html">Permalink</a><a class="src" href="https://reformedbooksonline.com/the-puritans-on-psalms-hymns-and-spiritual-songs-eph-519-col-316/#:~:text=He%20%5BBaynes%5D%20subsequently%20discusses%20the%20difference,a%20Psalm%20of%20David%E2%80%9D%20%28p.%20506&amp;text=He%20%5BBaynes%5D%20subsequently%20discusses%20the%20difference%20of%20the&amp;text=to%20sing%20a%20Psalm%20of%20David%E2%80%9D%20%28p.%20506" rel="noopener" target="_blank">Read it online · Reformed Books Online</a></div>
</figure><figure class="quote" id="q-d2065f7484" data-kw="">
<blockquote><p>We must have songs not only honorable but also holy, which are to be like needles to arouse us to pray and praise God, to meditate on his works, in order to love him, fear, honor and glorify him. But what St. Augustine says is true, that no one can sing things worthy of God unless he has received them from Him. For when we have searched here and there, we will not find better songs nor ones more appropriate for this purpose than the Psalms of David, which the Holy Spirit has spoken to him and made. Therefore, when we sing them, we are certain that God has put the words in our mouth as if they themselves sang in us to exalt his glory. Consequently Chrysostom exhorts both men, women and little children to learn to sing them in order that they may be like a meditation to associate them with the company of angels (Chrysostom, In Ps. 41:1,2). Besides, we must remember what St. Paul says, that spiritual songs cannot be better sung than from the heart (Eph. 5:19; Col. 3:16). But the heart requires understanding. And in that (says St. Augustine) lies the difference between the singing of men and that of birds (Aug. Enarr. in Ps. 81, 2.1). For a Linnet, a Nightingale or a Popinjay will sing well, but it will be without understanding. But man’s proper gift is to sing, knowing what he says; after understanding must follow the heart and the affection, something that can only happen when we have the song imprinted on our memory never to cease singing it.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/john-calvin.html">John Calvin</a></span><span class="wk"><span class="lbl">Work:</span> <cite>‘Letter to the Reader’ in The Form of Prayers and Songs of the Church</cite>, (1543)</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/worship/psalmody.html">Psalmody</a></span></div>

../quote/d2065f7484.html">Permalink</a><a class="src" href="https://reformedbooksonline.com/singing-of-praise#:~:text=We%20must%20have%20songs%20not%20only,memory%20never%20to%20cease%20singing%20it&amp;text=We%20must%20have%20songs%20not%20only%20honorable%20but&amp;text=on%20our%20memory%20never%20to%20cease%20singing%20it" rel="noopener" target="_blank">Read it online · Reformed Books Online</a></div>
</figure><figure class="quote" id="q-6a8daa9d23" data-kw="">
<blockquote><p>We knew that these psalms, and hymns and spiritual songs, though in other languages (and consequently so in other poetical measures) were inspired by the Holy-Ghost, to holy men of old for the edification and comfort of the Church and people of God in all ensuing ages to the end of the world. And for these holy ends we have with special care &amp; diligence translated them into such meters as are most usual and suitable for such holy poems, in our own language, having a special eye to the gravity of the phrase of sacred writ and sweetness of the verse.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/henry-dunster.html">Henry Dunster</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Psalms Hymns and Spiritual Songs of the Old and New Testament, faithfully translated into English metre, for the use, edification, and comfort, of the saints, in public &amp; private. Especially in New-England</cite>, ([Cambridge, Mass.], 1651), ‘To the Godly Reader’, no page number. This 3rd edition of the Bay Psalm Book psalter has the 150 psalms and other inspired Bible songs in it (the original Bay Psalm Book did not have the other Bible-Songs). On the title page is 2 Tim. 3:16-17; Col. 3:16; Eph. 5:18-19; James 5:13. This same psalter and preface were reprinted in Boston in 1698 with Cotton Mather’s name on it.</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/worship/psalmody.html">Psalmody</a></span></div>

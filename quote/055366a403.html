<main class="wrap"><figure class="quote" id="q-055366a403" data-kw="">
<blockquote><p>The Lord Christ Jesus takes delight in his own day. He delights to honour it. He delights to meet with and manifest himself to his disciples on it, as he showed before his ascension by appearing to them from time to time on this day. He delights to give his Holy Spirit on this day, as he intimated by choosing of it to pour it out on the primitive church in so remarkable a manner upon it, and by giving his Spirit to the apostle John on this day.

God blessed the seventh day of old, or appointed it to be a day wherein he especially would bestow blessings on his people as an expression, as it were, of his own joyful remembrance of that day and of the rest and refreshment he had on it; Exodus 31:16–17, “Wherefore the children of Israel shall keep the sabbath … for in six days the Lord made heaven and earth, and on the seventh day he rested, and was refreshed,” as princes give gifts on their birthday, on their marriage days, and the like.

But how much more reason has Christ to bless the day of his resurrection, and to delight to honour it, and to be conferring his graces and blessed gifts on his people on this day. It was a day wherein Christ rested and was refreshed in a literal sense. It was a day of great refreshment and joy to Christ, being the day of his deliverance from the chains of death, the day of his finishing that great and difficult work of redemption that had been upon his heart from all eternity, the day of his justification of the Father, the day of the beginning of his exaltation and the fulfilment of the promises of his Father, the day when he had eternal life, which he had purchased, put into his hands. And Christ does delight to distribute gifts and blessings and joy and happiness on this day, and will to the end of the world.

O, therefore, how well is it worth our while to improve this day, to call upon God and seek Jesus Christ on it!

Let awakened sinners be stirred up by these things to improve the sabbath day, as they would lay themselves most in the way of the Spirit of God. Improve the sabbath day to call upon God, for then he is near. Improve the sabbath day for reading the holy Scriptures and diligently attending his Word preached, for then is the likeliest time to have the Spirit accompanying of it. Let the saints that are desirous of growing in grace and enjoying communion with Christ improve the sabbath in order to it.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/jonathan-edwards.html">Jonathan Edwards</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Perpetuity and Change of the Sabbath</cite>, (1730-31) in Mark Valeri (ed.), Sermons and Discourses, 1730-1733: The Works of Jonathan Edwards Volume 17 (New Haven CN: Yale University Press, 2000), p. 246.</span></figcaption>

</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-25ed8c8b04" data-kw="">
<blockquote><p>Man, as a condemned sinner, can obtain nothing from God on his own account. He lies under the curse of a broken law; exposed to everlasting perdition. God can be to him only a consuming fire. There is an impassible barrier between such a man and God. There can be no communication between the holy and the unclean.

The prayers of the wicked are an abomination in the sight of God. He is surrounded with such an atmosphere of holiness, that the breathings of an impure spirit cannot reach him. There is only one channel of communication between the sinner and God, and that is Christ.

When God looks upon us, he can see nothing to approve. In his sight we are altogether as an unclean thing; even our righteousnesses are as filthy rags. Our holiest services are polluted in his sight. But there is a Day’s Man between us who is able to lay his hand upon both. Our prayers cannot come up before God with acceptance, but the angel of the everlasting covenant stands before the throne, with his golden vial, and He, the everlasting intercessor, pours from it the prayers of the saints, he perfumes them with the sacred incense of his own holiness, and they come up as a sweet savour before the Father. Thus it is that our prayers are all offered up for Christ’s sake, and it were well that we fully understood and deeply felt what is implied in the use of these most significant words.

There is reason to fear that many a prayer wafted heavenward remains unanswered, because the grand condition of all acceptable prayer is not fully felt as it ought to be! Men pray as if they had a right to ask, and a title to expect, favours from God, on their own independent footing. There is much trusting to his goodness and forbearance, and mercy, forgetful all the while, that God can only hear through the intercessor before the throne, and can only manifest his goodness through the one mediator, the man Christ Jesus.

When we ask of God, for Christ’s sake, the bestowment of any blessing, it were well that the truth were blazoned before the eye of our inner consciousness, that we cannot be accepted save in the beloved; that if God looks directly at us, we are condemned; that he can only be well pleased when he looks on us in the face of his anointed—when he beholds in the lamb that had been slain justice fully satisfied, and in the lamb now alive and living for ever more, the evidence of his own sealed and irrefragable covenant.

When we ask anything for Christ’s sake, we acknowledge that we are not worthy in ourselves to receive it—when we plead the name of Jesus, we acknowledge our own guilt, and proclaim him the sole ground of our hope —when we point to him, we entreat God not to look upon us—we renounce our own righteousness—we confess our own shame—we plead for a standing in Jesus—we claim an interest in his work—we profess to stand in his righteousness —to hope for mercy through his peace-speaking blood.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/william-wilson.html">William Wilson</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Believing Prayer Heard and Answered in The Free Church Pulpit; Consisting of Discourses by the Most Eminent divines of the Free Church of Scotland. Vol. I.</cite></span></figcaption>

<blockquote><p>The worship of God is twofold: principal or less principal. The Lord says, Hos. 6:6, ‘I will mercy, not sacrifice,’ that is, rather mercy than sacrifice. Where mercy is made the main and principal worship of God, and sacrifice also is worship, but the necessary or less principal… This principal worship has two properties. The first is eternity: for it begins in this life, and is perfected in the life to come. Because it is that everlasting worship wherewith angels and saints shall forever worship God in Heaven. And herein it differes from ceremonies and sacraments, which have an end in this life. The second is that it pleases God of itself, and that without sacraments or ceremonies: so there be no contempt of them: s it was in the thief upon the cross.</p></blockquote>

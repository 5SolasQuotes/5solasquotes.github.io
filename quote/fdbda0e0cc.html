<main class="wrap"><figure class="quote" id="q-fdbda0e0cc" data-kw="">
<blockquote><p>2. To die for all, and to be given for all, must in some places [in Scripture, such as 1 Tim. 2:4-6; 4:10; Heb. 2:9; 2 Cor. 5:14-15; Tit. 2:11] respect the sufficiency of the dignity in the death of Christ, but not always the efficacy of his death in the virtual extent of it, which none that I have read will maintain in this point of Christ’s dying for all.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/obadiah-sedgwick.html">Obadiah Sedgwick</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Bowels of Tender Mercy Sealed in the Everlasting Covenant... (London: Motershed, 1661), pt. 1, ch. 7, The Covenant of Grace considered in Relation to Christ the Mediator, sect. 8, Whether Jesus Christ as Mediator died for all and every man?</cite>, p. 304</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/priestly-office-satisfaction-and-atonement/extent-of-the-atonement.html">Extent of the Atonement</a></span></div>
<div class="actions"><button class="copy" data-copy="“2. To die for all, and to be given for all, must in some places [in Scripture, such as 1 Tim. 2:4-6; 4:10; Heb. 2:9; 2 Cor. 5:14-15; Tit. 2:11] respect the sufficiency of the dignity in the death of Christ, but not always the efficacy of his death in the virtual extent of it, which none that I have read will maintain in this point of Christ’s dying for all.”

</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-273d5b0188" data-kw="">
<blockquote><p>6. Christ was sufficient as a medicine to save the whole world, as the brazen serpent was to heal all Israel, yet only those that looked up were healed: So ’tis only those that apply this medicine, Habet in se quod omnibus prosit, sed si non bibitur non medetur. Prosper.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/christopher-ness.html">Christopher Ness</a></span><span class="wk"><span class="lbl">Work:</span> <cite>An Antidote against Arminianism, or a Succinct Discourse to Enervate &amp; Confute all the Five Points thereof… (Cockerill, 1700), ch. 11</cite>, p. 88</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/priestly-office-satisfaction-and-atonement/extent-of-the-atonement.html">Extent of the Atonement</a></span></div>
<div class="actions"><button class="copy" data-copy="“6. Christ was sufficient as a medicine to save the whole world, as the brazen serpent was to heal all Israel, yet only those that looked up were healed: So ’tis only those that apply this medicine, Habet in se quod omnibus prosit, sed si non bibitur non medetur. Prosper.”

</figure><figure class="quote" id="q-6b0a1efed6" data-kw="">
<blockquote><p>IV. Although then this most divine panace or catholic remedy is proposed to all in the Gospel, yet we believe that no efficacy of it can be transfused, except there be an applying of this by faith in the Son of God, even as there can be no efficacy in physic or medicaments, except the sick patient hearken to the physician, and apply his medicines; which metaphor the Holy Ghost uses in this case.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/david-pareus.html">David Pareus</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Article 2, ‘Of Christ’s Death &amp; Merit’ in Aphorisms of the Orthodox Doctrine of the Reformed Churches in Zachary Ursinus, The Sum of Christian Religion… (London: Young, 1645)</cite>, pp. 694-98</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/priestly-office-satisfaction-and-atonement/extent-of-the-atonement.html">Extent of the Atonement</a></span></div>

</figure><figure class="quote" id="q-dd1fec55c9" data-kw="">
<blockquote><p>They [the anti-predestinarians] also grant that ‘Christ died for us all’ and infer from this that his benefits are common to everyone. We gladly grant this, too, if we are considering only the worthiness of the death of Christ, for it might be sufficient for all the world’s sinners. Yet even if in itself it is enough, yet it did not have, nor has, nor will have effect in all men. The [Medieval] Scholastics also acknowledge the same thing when they affirm that Christ redeemed all men sufficiently but not effectually.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/peter-martyr-vermigli.html">Peter Martyr Vermigli</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Predestination &amp; Justification, tr. Frank A. James (Kirksville, Missouri: Sixteenth Century Essays &amp; Studies, 2003), vol. 8</cite>, p. 62</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/priestly-office-satisfaction-and-atonement/extent-of-the-atonement.html">Extent of the Atonement</a></span></div>
<div class="actions"><button class="copy" data-copy="“They [the anti-predestinarians] also grant that ‘Christ died for us all’ and infer from this that his benefits are common to everyone. We gladly grant this, too, if we are considering only the worthiness of the death of Christ, for it might be sufficient for all the world’s sinners. Yet even if in itself it is enough, yet it did not have, nor has, nor will have effect in all men. The [Medieval] Scholastics also acknowledge the same thing when they affirm that Christ redeemed all men sufficiently but not effectually.”

</figure><figure class="quote" id="q-1e4abf0ed1" data-kw="">
<blockquote><p>Second, we confess that Christ indeed rules now, and possesses all authority, both in heaven and on earth, according to both natures. But not presently, as far as the flesh is concerned. The apostle says that we are absent from Christ now on earth, not at home, and desire to leave the body to be joined to him. On this account we say that he has indeed not yet come nor is present in his flesh, but will certainly appear again, visibly from the invisible, or rather will come for all to see.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/theodore-beza.html">Theodore Beza</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Lutheranism vs. Calvinism: the Classic Debate at the Colloquy of Montbeliard, 1586, ed. Jeffrey Mallinson (St. Louis: Concordia Publishing House, 2017), ch. 2, ‘Person of Christ’, Response to Thesis 17</cite>, pp. 253-54</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/priestly-office-satisfaction-and-atonement/extent-of-the-atonement.html">Extent of the Atonement</a></span></div>
<div class="actions"><button class="copy" data-copy="“Second, we confess that Christ indeed rules now, and possesses all authority, both in heaven and on earth, according to both natures. But not presently, as far as the flesh is concerned. The apostle says that we are absent from Christ now on earth, not at home, and desire to leave the body to be joined to him. On this account we say that he has indeed not yet come nor is present in his flesh, but will certainly appear again, visibly from the invisible, or rather will come for all to see.”

— Theodore Beza, Lutheranism vs. Calvinism: the Classic Debate at the Colloquy of Montbeliard, 1586, ed. Jeffrey Mallinson (St. Louis: Concordia Publishing House, 2017), ch. 2, ‘Person of Christ’, Response to Thesis 17, pp. 253-54">Copy</button><a class="share" href="https://x.com/intent/post?text=%E2%80%9CSecond%2C+we+confess+that+Christ+indeed+rules+now%2C+and+possesses+all+authority%2C+both+in+heaven+and+on+earth%2C+according+to+both+natures.+But+not+presently%2C+as+far+as+the+flesh+is+concerned.+The+apostle+says+that+we+are+absent+from+Christ+now+on+earth%2C+not+at+home%2C+and+desire+to+leave+the+body+to+be+joined+to+him.+On+this+account+we+say+that+he+has+indeed+not+yet+come+nor+is+present+in+his+flesh%2C+but+will+certainly+appear+again%2C+visibly+from+the+invisible%2C+or+rather+will+come+for+all+to+see.%E2%80%9D%0A%0A%E2%80%94+Theodore+Beza%2C+Lutheranism+vs.+Calvinism%3A+the+Classic+Debate+at+the+Colloquy+of+Montbeliard%2C+1586%2C+ed.+Jeffrey+Mallinson+%28St.+Louis%3A+Concordia+Publishing+House%2C+2017%29%2C+ch.+2%2C+%E2%80%98Person+of+Christ%E2%80%99%2C+Response+to+Thesis+17%2C+pp.+253-54&amp;url=https%3A%2F%2F5solasquotes.github.io%2Fquote%2F1e4abf0ed1.html&amp;via=5Solas" target="_blank" rel="noopener">Share on X</a><a class="perma" href="../quote/1e4abf0ed1.html">Permalink</a><a class="src" href="https://reformedbooksonline.com/the-extent-of-christs-mediatorial-kingdom-2/#:~:text=Second%2C%20we%20confess%20that%20Christ%20indeed,will%20come%20for%20all%20to%20see." rel="noopener" target="_blank">Read it online · Reformed Books Online</a></div>

<main class="wrap"><figure class="quote" id="q-d0aee5950c" data-kw="">
<blockquote><p>Another reason can be drawn from the words of Aristotle. For in 2 Metaphysics 1, 5, he shows that those things which excel as true excel as beings, and in 4 Metaphysics 3, 4, 27-28, he shows that there is something supremely true because we see that of two false things one is falser than the other, from which it follows that one is also truer than the other. Now this is by its approximation to that which is simply and supremely true. Therefore, we may further conclude that there is something that is supremely being. And this we call God.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/thomas-aquinas.html">Thomas Aquinas</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Summa Contra Gentiles</cite>, bk. 1, ch. 13, ‘Arguments in Proof of God’s Existence’</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/existence-and-knowledge-of-god/existence-of-god.html">Existence of God</a></span></div>

</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-dcb915623b" data-kw="">
<blockquote><p>When we say that God has communicated the knowledge of Himself to mankind by the light of nature, we are not to be understood, which was observed before, as if we could attain to that knowledge, without any pains or industry of our own, and let us conduct ourselves in whatsoever manner we please. We only designed to say that the supreme Being has so formed us and arranged his works in such a beatiful order, that if we make a proper use of our reason, and contemplate the astonishing works of Deity with due attention, we must necessarily be led to the knowledge of our Creator, and learn the duties we owe to Him. But if we will be perfectly inattentive and careless in tracing out and investigating the evidences of our divine original, we must be altogether in the dark and ignorant with repsect to them. Thus, althought God has placed the glorious luminary the sun in the firmament to enlighten mankind, those who indulge themselves in sleep, who shut their eyes, or cover them with a veil, can reap no advantage from this blessing of nature. And indeed such was the unhappiness, I should rather say, the negligence, the stupidity, the corruption of mankind, that the sentiments of the Deity deducible from the light of nature, even from the remotest ages, were obscured to an astonishing degree in almost every nation. Some few glimmerings of them remained, but nothing more. In the place of one true God the Creator of Heaven and earth, they formed to themsevles imaginary divinities incredible in number… It is said that some among them altogether denied the existence of the supreme Being, which Tully affirms was the case with respect to Diagoras, Melius and Theodorus of Cyrene.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/jean-alphonse-turretin.html">Jean-Alphonse Turretin</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Dissertations on Natural Theology</cite>, tr. William Crawford (d. 1737; Belfast: Magee, 1777), Theses concerning Natural Theology in General, pp. 18-20</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/existence-and-knowledge-of-god/existence-of-god.html">Existence of God</a></span></div>

</figure><figure class="quote" id="q-fa7c31e8f3" data-kw="">
<blockquote><p>It would also seem well to observe that sensible things, from which human reason derives the source of its knowledge, retain a certain trace of likeness to God, but so imperfect that it proves altogether inadequate to manifest the substance itself of God. For effects resemble their causes according to their own mode, since like action proceeds from like agent; and yet the effect does not always reach to a perfect likeness to the agent.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/thomas-aquinas.html">Thomas Aquinas</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Summa Contra Gentiles</cite>, bk. 1, ch. 8</span></figcaption>

</figure><figure class="quote" id="q-2a8ade0fe4" data-kw="">
<blockquote><p>And it assuredly exists so truly, that it cannot be conceived not to exist. For it is possible to conceive of a being which cannot be conceived not to exist; and this is greater than one which can be conceived not to exist… There is, then, so truly a being than which nothing greater can be conceived to exist, that it cannot even be conceived not to exist; and this being thou art, O Lord, our God… For, if a mind could conceive of a being better than thee, the creature would rise about the Creator; and this is most absurd. And, indeed, whatever else there is, except thee alone, can be conceived not to exist. To thee alone, therefore, it belongs to exist more truly than all other beings, and hence in a higher degree than all others. For, whatever else exists does not exist so truly, and hence in a less degree it belongs to it to exist.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/anselm.html">Anselm</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Proslogium, or ‘Discourse’ on the Existence of God ToC in St. Anselm: Proslogium; Monologium; an Appendix in behalf of the Fool by Gaunilon</cite>, … tr. Sidney N. Deane (Chicago: Open Court Publishing Co., 1903), pp. 1-34, ch. 3, pp. 8-9</span></figcaption>

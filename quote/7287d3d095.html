<main class="wrap"><figure class="quote" id="q-7287d3d095" data-kw="">
<blockquote><p>…Under which two excuses [in the text] are comprehended all others of like sort, which flesh and blood does minister, for hindering to rise and open to Christ, and obey his calling, such as we see, Mt. 22, and are usually suggested by our corruption, as the quitting of our pleasure, or profit, our ease, credit, or companions, if we do so; and that we shall fall in disgust, hatred, and obloquy, and other like inconveniences: Neither is it a fit time as yet (but as Felix said to Paul, Acts 24:25) we may take a more convenient season for that, or the like purposes, etc. Such excuses do absenters of themselves from public exercises of divine worship, make, and profaners of the Lord’s Sabbath; such also do covetous extortioners, revengeful oppressors: unclean whoremongers, riotous, drunkards and the like, frame to themselves, and obtrude, and all for this end, to keep Christ out, though He frequently call and knock at their door to enter in. Observations: 1. We see hereby, that it is not an easy matter, but a very hard and difficult one to bring the soul and Christ together, into a near and constant fellowship… but take heed to his voice who calls and knocks, and, as the Father spake at Christ’s baptism from heaven, hear Him and obey. 2. We see, how strong is carnal corruption, and remnants of sin in the regenerate, to hold Christ at the door, and to sleight his voice, calling on the•… to open; and therefore, how much more stronger is the same in the unregenerate, and it is no marvel that they open not unto Him and disobey his voice.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/william-guild.html">William Guild</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Love’s intercourse between the Lamb &amp; his Bride, Christ and his Church, or a clear explication and application of the Song of Solomon</cite>, (London: Wilson, 1657), on Song 5:3, p. 210</span></figcaption>

</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-f48efaebde" data-kw="">

</figure><figure class="quote" id="q-994f18c156" data-kw="">
<blockquote><p>There is a double interpretation of this text, each of them claiming under very valuable interpreters; some making it a declaration of Christ’s readiness to come in to souls, and to give them a spiritual fellowship and communion with Himself; others interpreting it of Christ’s readiness to come to the Last Judgment, and to take his saints into an eternal joyful fellowship and communion with Himself: hence there is a different interpretation of every sentence in the text. I stand at the door; either, in my gospel dispensations, I stand at the door of sinners’ hearts; or, I am ready to come to judge the world. And knock, by the inward monitions and impressions of my Spirit, or my ministers more externally; or, I am about to knock, that is, I am ready to have the last trump sounded. If any man hear my voice, and open the door; that is, if any man will hearken to the counsels and exhortations of my ministers, and to the monitions of my Spirit, and not resist my Holy Spirit; or, if any man has heard my voice, and opened his heart to Me.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/john-collinges.html">John Collinges</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Matthew Poole’s English Annotations on the Holy Bible. Collinges was one of the men who finished Poole’s Commentary after he died, having gotten to Isa. 58</cite>, Rev. 3:20, “Behold, I stand at the door, and knock: if any man hear my voice, and open the door, I will come in to him, and will sup with him, and he with me.”</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/effectual-calling/means-of-calling.html">Means of Calling</a></span></div>

ote%2F994f18c156.html&amp;via=5Solas" target="_blank" rel="noopener">Share on X</a><a class="perma" href="../quote/994f18c156.html">Permalink</a><a class="src" href="https://reformedbooksonline.com/let-jesus-come-into-your-heart/#:~:text=There%20is%20a%20double%20interpretation%20of,and%20opened%20his%20heart%20to%20Me&amp;text=There%20is%20a%20double%20interpretation%20of%20this%20text&amp;text=my%20voice%2C%20and%20opened%20his%20heart%20to%20Me" rel="noopener" target="_blank">Read it online · Reformed Books Online</a></div>
</figure><figure class="quote" id="q-6d8c6769f4" data-kw="">
<blockquote><p>Yet it is a good observation of [an]other [Aquinas and Rupertus], that John [the Baptist] is not crier, but the voice of the crier: for it is Christ who cries in preachers; He speaks by the mouth of all his holy prophets: He cries, ‘O ye foolish, how long will ye love foolishness?’ He cries, ‘Repent for the kingdom of God is at hand.’ He cries, ‘Come unto Me all ye that are wearied and laden, and I will refresh you.’ To day then if ye will hear his voice, harden not your hearts, but suffer the words of exhortation and doctrine: be moved at his cry, lest He despise your call. As He says in the first of the Proverbs (v. 23): Because I have called, and ye have refused, I have stretched out mine hand, and none would regard: therefore they shall call upon Me, but I will not answer: they shall seek Me early, but they shall not find Me. Think on this all ye that forget God, ye that suffer Christ to stand and knock, and cry at the door of your hearts, and yet you will not let Him in.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/john-boys.html">John Boys</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Exposition of the Dominical</cite>, [Lordly] Epistles &amp; Gospels used in our English Liturgy... (d. 1625; 1638) | 4th Sunday in Advent, p. 109</span></figcaption>

%20in" rel="noopener" target="_blank">Read it online · Reformed Books Online</a></div>

<blockquote><p>And he ran before, and climbed up into a sycomore tree to see him: for he was to pass that way. And when Jesus came to the place, he looked up, and saw him, and said unto him, ‘Zacchaeus, make haste, and come down; for to day I must abide at thy house.’ And he made haste, and came down, and received Him joyfully. And when they saw it, they all murmured, saying, That he was gone to be guest with a man that is a sinner. And Zacchaeus stood, and said unto the Lord: Behold, Lord, the half of my goods I give to the poor; and if I have taken any thing from any man by false accusation, I restore him fourfold. And Jesus said unto him, ‘This day is salvation come to this house, forsomuch as he also is a son of Abraham. For the Son of man is come to seek and to save that which was lost.&#x27;</p></blockquote>

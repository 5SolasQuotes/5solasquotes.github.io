<main class="wrap"><figure class="quote" id="q-84e5bda01e" data-kw="">
<blockquote><p>This is brought forth in that text of the apostle, 2 Thess. 2:13, ‘because, when ye received the word of God which ye heard of us, ye received it not as the word of men, but as it is in truth, the word of God, which effectually worketh also in you that believe.’ [Power of rule and discipline is] to ministers [antecessoribus, those who come before] because in the name and power of Christ they manifest themselves amidst consciences, and they are ministers to consciences of laws broad and fixed, and of laws of faith and obedience, by which laws they are taken hold of; and they [the ministers] are σύνεργοι [‘laborers together’] and συνεργοῦντες [‘workers together’] of God (1 Cor. 3:9 &amp; 2 Cor. 6:1) in laws written on the heart, and on the mind (Heb. 10:16)… Therefore, they bear, impose and manifest divine laws to consciences, inasmuch as God, through ministers, may bear, impose and manifest them.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/gisbertus-voetius.html">Gisbertus Voetius</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Ecclesiastical Politics</cite>, (Amsterdam, 1663-1676), Vol. 4, pt. 3, bk. 4, Tract 1, ‘Of Ecclesiastical Power’, 7. Of the Legislative Power of the Churches, 5th Question, Response 2, p. 796</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/church-government-and-the-ministry/synods-and-assemblies.html">Synods and Assemblies</a></span></div>
<div class="actions"><button class="copy" data-copy="“This is brought forth in that text of the apostle, 2 Thess. 2:13, ‘because, when ye received the word of God which ye heard of us, ye received it not as the word of men, but as it is in truth, the word of God, which effectually worketh also in you that believe.’ [Power of rule and discipline is] to ministers [antecessoribus, those who come before] because in the name and power of Christ they manifest themselves amidst consciences, and they are ministers to consciences of laws broad and fixed, and of laws of faith and obedience, by which laws they are taken hold of; and they [the ministers] are σύνεργοι [‘laborers together’] and συνεργοῦντες [‘workers together’] of God (1 Cor. 3:9 &amp; 2 Cor. 6:1) in laws written on the heart, and on the mind (Heb. 10:16)… Therefore, they bear, impose and manifest divine laws to consciences, inasmuch as God, through ministers, may bear, impose and manifest them.”

</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-525562fed7" data-kw="">
<blockquote><p>Question 2. Is A Magistrate Held Responsible To Render Account Of All His Laws To His Subjects? And How Far Are They To Presume Such Laws To Be Just? After this foundation has been laid we would also inquire into certain other questions which would appear to be germane to this discourse that the consciences of many may be satisfied. First the question is raised whether the magistrate is held to render account of all his laws to any man soever so as to offer proof that they be fair and in accordance with the precepts of religion. I answer that he is not so held; nay more, that it is fair that all virtuous subjects should regard their lords in the light of virtue and should not presume of suspect anything unjust concerning them; nay, that it is not becoming that men in private station should inquire over curiously even concerning doubtful matters beyond their comprehension or station in life. If, however, the conscience of some be at a loss, they can and are even under an obligation to examine (albeit discreetly and in a peaceful manner) what elements of reason and justice are to be found in the command by which they are bidden or forbidden to do something; for the word of the apostle abides: “whatsoever is not of faith (that is while the conscience is in doubt whether that is being done justly or not) is sin”. But if what is commanded is openly sinful or unjust, then indeed that which has been said above applies.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/theodore-beza.html">Theodore Beza</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Concerning the Rights of Rulers Over Their Subjects &amp; the Duty Of Subjects Towards Their Rulers</cite>, (1574)</span></figcaption>

</figure><figure class="quote" id="q-db154a1515" data-kw="">
<blockquote><p>But, 2. All the power and authority of synods we conceive to be ministerial, not lordly, limited, regulated by the only Word of God in the Scripture, and in matters circumstantial, of order and decency, as time, place, persons… by the law of nature, rules of piety, charity, and Christian prudency, for the edification of our brethren and the glory of God; And a lawful synod we judge has power ministerial from Christ… commanding in the Lord… are to be obeyed, and the conscience submitted to them, not absolutely, not for the sole will and mere authority of the heralds, as if they were infallible, not with blind obedience, not without reclamation, or appeal, if they be either contrary or beside the scriptures, but conditionally in so far as they are agreeable to the Word of God…</p></blockquote>

</figure><figure class="quote" id="q-f01b2e689e" data-kw="">
<blockquote><p>If then nothing be good [simply] because rulers command it; but, by the contrary, they do lawfully command it because it is good. The Church’s power is one and the same in things indifferent, and necessary in matters of doctrine, discipline and order; for in both, the Church does not create goodness, but does by the light of the Word, or (which is a part of the Word) by nature’s light, find preexistent goodness in doctrine, discipline, and matters of order. Therefore, will of authority, as will, has no power to dispose of the east circumstance of time, place or person; but the Church’s power is ministerial and determined to what is good, expedient and convenient.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/samuel-rutherford.html">Samuel Rutherford</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Divine Right of Church Government</cite>, … (1646), pp. 648-9</span></figcaption>

</figure><figure class="quote" id="q-1e1630c6fb" data-kw="">
<blockquote><p>1 Cor. 6:12, ‘All things (indifferent) are lawful in themselves, but they are not expedient,’ if we be brought under the power or band of them by law. Therefore, in the means of worship, not only must we see what is lawful, but also what is profitable and conducing to the end… 1 Cor. 7:6, ‘But this I speak by permission, not of commandment.’ Therefore in things in which God has granted us liberty, to do or not to do, permission has place, not obliging necessity or penal laws. 13th Proposition. There cannot be commanding laws in things that are politicly good or evil according to the individual complexion, temperature, or gifts of singular men: [for example] to marry or not to marry, cannot be commanded, for where God looses, no power on earth can bind, v. 33. 1 Cor. 8:7, Paul condemns them in the use of their Christian liberty, ‘Howbeit there be not in every man this knowledge;’ then that rulers may make laws in things indifferent, without scandal, they must remove ignorance. 2. If there be but one person weak in knowledge (there is not in every man that knowledge), a law obliging all in things indifferent cannot be made.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/samuel-rutherford.html">Samuel Rutherford</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Divine Right of Church Government</cite>, … (London, 1646), Appendix, Question 1, pp. 6-7</span></figcaption>

<blockquote><p>Ch. 3, In what manner is the antecedent will of the salvation of all in God? Because of certain testimonies of Scripture by which it seems to be signified that God wills the salvation of all men, such as 1 Tim. 2; 2 Pet. 3; Eze. 18 and others (concerning which below), it is asked whether the antecedent will according to which (as was said above) God is said to will the salvation of all men, is in God: Formally and properly, just as the consequent will is; that is, whether the act signified by these words, “I would that all men be saved,” is properly and without metaphor in God, just as this act is: “I will Peter to be saved,” in the same way that a merchant in danger at sea properly has both of these acts: “I would that I preserve my merchandise” and “I will to throw it away”; Or, on the other hand, whether a will of this kind is in God only improperly and eminently. [This is what Estius argues below.] The same thing can also be asked concerning the antecedent will with respect to other goods which, although God does not will absolutely, are nevertheless proposed to men as they are either commanded by God through precepts or counseled by Him, or as they can be attained through the observance of counsels or the reception of the sacraments, such as the remission of sins, grace, justification, and virtues. For God also seems antecedently to will these goods for all, while through his goodness He everywhere proposes means to men for attaining them. Therefore it is asked whether the antecedent will of these things is also properly in God. For some have thought so, both because of the Scriptures: which, unless a will or velleity [a wish] and desire of this kind is formally and properly constituted in God will seem to be more simulated expressions than true declarations of divine love and affection toward the human race; and also because Christ properly had such a will by which He would that all be saved. Therefore it would not have been absurd to attribute it to God. They further confirm this by the authority of St. Thomas, who, art. 6, to the 1st, says that God wills antecedently every man to be saved in the same way that a just judge antecedently wills every man to live. Since, therefore, the judge properly wills this, it seems that God also properly wills that. But those who deny that there is formally and properly in God an antecedent will to which the voluntas beneplaciti [will of good-pleasure] corresponds [such as Estius] judge much more probably that the will signified by the name ‘velleity’ is not in God in this way. They say: That it is sufficient for a will of this kind to be constituted in God eminently, or by some trope, just as anger, repentance, mercy, and whatever good affections are in God are so, which are in human beings in such a way that they include some imperfection, such as change, passion, or defect; because of these imperfections they must necessarily be attributed to God either through the eminence of causality or through some other trope of speech. Now it is certain that God works in the hearts of the godly this affection, namely, that they all will that everyone be saved. Therefore such an affection is in God eminently. But that this will includes an imperfection, and therefore cannot formally be in God, is argued: First, from the name ‘velleity’. For St. Thomas, in the place mentioned above, considers that this will should rather be called by the name ‘velleity’. But velleity seems to be nothing other than a certain imperfect and suspended will. Secondly, because this will signifies a desire for some thing which is inefficacious, and such a thing cannot be in God. Thirdly, because such a will in God would be idle, and therefore in vain, since it would have no effect in things properly corresponding to itself. Fourthly, because if such a will is in God with respect to men, it will also be with respect to angels, which, nevertheless, the Scriptures nowhere signify. Indeed, no other reason for this seems to exist than that by such a manner of speaking it is signified not what God properly wills, but what men ought to will, and what godly men, through His working, will. But the godly do not will, nor ought they to will, the salvation of all angels, but only of men who are living in this life. Fifthly, because neither is God said to will the salvation of condemned men, namely, for the same reason that we have just mentioned: for He does not work this will in the godly [for the salvation of damned men]. Sixthly, because if that will is formally in God, it will be perpetual, and consequently God will always will the salvation of all men. This seems absurd, since not even godly men will this after this life. Hence there also arises a final argument: the holy angels and the spirits of the righteous in heaven do not have such a will because of the perfection of their state, by which it also comes about that they neither pray for the reprobate nor are moved by any compassion concerning the damned, but purely and perfectly praise God’s justice in their punishment, as is taught at the end of the fourth [book]. Therefore, much less ought such a will to be posited formally in God. Therefore, to the arguments of the opposing side it is answered that: The Scriptures require nothing else than that we posit in God the will of the salvation of all eminently, or in some other improper manner of willing, as will be explained below. Nor on this account does Scripture speak simulatorily, but improperly. For it is very well known that Scripture is full of figurative expressions concerning God, when, after the manner of human speech, it attributes to Him repentance, anger and other human passions, as well as the members of the human body. To the second [argument] it is answered that, granted that there was such a velleity in Christ, it does not follow that it is in God insofar as He is God. For Christ assumed human affections together with the truth of human nature. But what is objected from St. Thomas proves very little: For he makes the comparison in the general account of antecedent will, without descending to the particular manner in which such a will ought to be understood by us in God. Therefore no more does this follow than if you were to infer: “Therefore God wills mutably or with passion, since a human judge wills in this way.” For Scripture also uses such a likeness when it says: “As a mother has compassion on her children, so God will have compassion on you.” [Isa. 66:13] Yet mercy is not properly in God, but only eminently. You will object: It is proper to God to have mercy and to spare, as the prayer of the Church has it; but to punish is a work foreign to God, as the prophet says [in Isa. 28:21]. But to will all to be saved pertains to the mercy and goodness of God; therefore it is properly in God. I answer that the prayer of the Church speaks not of velleity, but of the works of divine mercy and clemency. These are said to be proper to God because the object of the divine will is true good, and it can be nothing else. This, however, shines forth more clearly in works of mercy than in vindicative justice. For the latter brings about evil. But evil, as such, is not willed by God; rather, it is willed only under the consideration of a certain good, namely, as just. And therefore this is called a work foreign to God, insofar, namely, as it is concerned with evil.</p></blockquote>

<blockquote><p>Circumcision then, and baptism now, without real grace is an ineffectual sign, of no avail to salvation. (Rom. 8:17)</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/william-bates.html">William Bates</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Sovereign &amp; Final Happiness of Man with the Effectual means to obtain it (London: J.D., 1680), ch. 3</cite>, p. 84</span></figcaption>

</figure><figure class="quote" id="q-6f9facaff9" data-kw="">
<blockquote><p>The Reformed [of the 1500’s and 1600’s], by contrast [from the Lutherans], argue a hidden will of God to bestow special saving grace irresistibly upon the elect, a voluntas decreti sive beneplaciti arcana [will of decree or hidden good-pleasure], more ultimate than the revealed will of God to offer salvation to all by means of a universal grace… The voluntas signi vel praecepti, the will of the sign or precept, is the voluntas revelata, or revealed will, of God and the voluntas moralis, or moral will, according to which God reveals in signs and precepts his plan for mankind both in the law and in the gospel. Here, again, the Lutherans and Reformed differ insofar as the former [the Lutherans] deny the contrast between a universally offered salvation revealed in the voluntas signi and a secret elective will in the voluntas beneplaciti. … The Reformed further argue the distinction of the voluntas decreti vel beneplaciti [will of decree or good-pleasure] or voluntas decernens [decreeing will] into the categories of voluntas efficiens, effecting will, and voluntas permittens, permitting will. Under the former category, God is viewed as directly or indirectly through instrumental causes effecting his positive will, whereas under the latter category God is understood as permitting both contingent events and acts of free will even when such events and acts go against his revealed will.</p></blockquote>

</figure><figure class="quote" id="q-394835e485" data-kw="">
<blockquote><p>1224. Rom. 9:18, ‘God has mercy on whom He will have mercy, and whom He will He hardens.’ Ch. 11:32, ‘God has concluded them all in unbelief, that He might have mercy upon all.’ The first place is concerning the most free will and power of God, who may have mercy on whom He please; his antecedent will reaches to all men, his consequent will is restrained to the believers and unbelievers, and so He will have mercy of the faithful, that they may be saved, but he justly punishes and hardens the unbelievers and wicked men who resist his grace freely offered unto them.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/johannes-thaddaeus.html">Johannes Thaddaeus</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Reconciler of the Bible… (London: Miller, 1662) | Romans</cite></span></figcaption>

</figure><figure class="quote" id="q-566fda3c78" data-kw="">
<blockquote><p>I. Although the will in God is only one and most simple, by which He comprehends all things by a single and most simple act that He sees and understands all things at one glance, yet because it is occupied differently about various objects, it thus happens that in our manner of conception, it may be apprehended as manifold (not in itself and intrinsically on the part of the act of willing, but extrinsically and objectively on the part of the things willed). … XVIII. There cannot be contrariety between these two wills because they do not will and nill the same thing in the same manner and respect… … XIX. Although God may be said to will the salvation of all by the will of sign and to nill it by the beneplacit will, yet there is no contradiction here….</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/francis-turretin.html">Francis Turretin</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Institutes of Elenctic Theology, ed. Dennison</cite>, pp. 220-26</span></figcaption>

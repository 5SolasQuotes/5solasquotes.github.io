<blockquote><p>But if it be inquired what it is whereby we immediately concur in a way of duty unto the continuation of our justified estate, that is, the pardon of our sins and acceptance with God, we say it is such [faith] alone. ‘For the just shall live by faith,’ Rom. 1.17. And as the apostle applies this divine testimony to prove our first or absolute justification to be by faith alone, so does he also apply it unto the continuation of our justification, as that which is by the same means only, Heb. 10:38-39, ‘Now the just shall live by faith: but if any man draw back, my soul shall have no pleasure in him. But we are not of them that draw back unto perdition: but of them that believe, unto the saving of the soul.’ The drawing back to perdition includes the loss of a justified estate really so or in profession. In opposition thereunto the apostle places believing unto the saving of the soul; that is, unto the continuation of justification unto the end. And herein it is, that the just live by faith, and the loss of this life can only be by unbelief. ‘So the life which we now live in the flesh, is by the faith of the Son of God, who loved us and gave Himself for us,’ Gal. 2:20. The life which we now lead in the flesh is the continuation of our justification, a life of righteousness and acceptation with God, in opposition unto a life by the works of the Law, as the next words declare, v. 21, ‘I do not frustrate the Grace of God; for if righteousness came by the Law, then is Christ dead in vain; and this life is by faith in Christ as He loved us, and gave Himself for us, that is, as he was a propitiation for our sins.’ This then is the only way, means and cause on our part of the preservation of this life, of the continuance of our justification; and herein are we kept by the power of God through faith unto salvation [1 Pet. 1:5]. … …the apostle gives us another account hereof; Rom. 5:1-3. For he distinguishes three things: our access into the grace of God, (2) our standing in that grace, (3) our glorying in that station against all opposition. By the first he expresses our absolute justification. By the second our continuation in the state whereinto we are admitted thereby; and by the third, the assurance of that continuation, notwithstanding all the oppositions we meet withal. And all these he ascribes equally unto faith, without the intermixture of any other cause or condition. And other places express to the same purpose might be pleaded. 3. The examples of them that did believe and were justified which are recorded in the Scripture, do all bear witness unto the same truth. The continuation of the justification of Abraham before God is declared to have been by faith only, Rom. 4:3. For the instance of his justification given by the apostle from Gen. 15:6 was long after he was justified absolutely. And if our first justification and the continuation of it, did not depend absolutely on the same cause, the instance of the one could not be produced for a proof, of the way and means of the other, as here they are. And David when a justified believer, not only places the blessedness of man in the free remission of sins, in opposition unto his own works in general, Rom. 4:6-7, but in his own particular case, ascribes the continuation of his justification and acceptation before God, unto grace, mercy, and forgiveness alone, which are no otherwise received but by faith, Ps. 130:3-5; 143:2. All other works and duties of obedience do accompany faith in the continuation of our justified estate as necessary effects and fruits of it, but not as causes, means, or conditions whereon that effect is suspended. It is patient waiting by faith, that brings in the full accomplishment of the promises, Heb. 6:12, 16… And the continuation of our justification depends solely on the same causes with our justification itself.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/john-owen.html">John Owen</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Doctrine of Justification by Faith</cite>, … (London: Boulter, 1677), ch. 5, p. 208-10</span></figcaption>

<blockquote><p>For as no man receives that general justification which discharges from the guilt of all foregoing sins, but on the concurrence of repentance, faith, a purpose of a new life, and other actions of the same kind; so no man retains a state free from guilt in respect of following sins, but by means of the same actions of believing in God, calling on God, mortifying the flesh, daily repenting and sorrowing for sins daily committed. The reason why all these are required on our part is this: Because these cannot be still absent, but their opposites will be present, which are contrary to the nature of a justified man—As therefore to the conservation of natural life it is necessarily required that a man carefully avoid fire, water, precipices, poisons and other things destructive to the health of the body; so to the conserving of spiritual life, it is necessarily required that a man avoid incredulity, impenitency and other things that are destructive and contrary to the salvation of souls; which cannot be avoided unless the opposite and contrary actions be exercised. And these actions do not conserve the life of grace properly and of themselves by touching the very effect of conservation, but improperly and by accident, by excluding and removing the cause of destruction.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/richard-baxter.html">Richard Baxter</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Richard Baxter’s Confession of his Faith</cite>, … (London: 1655), ch. 10, sect. 3, pp. 322-23</span></figcaption>

<div class="actions"><button class="copy" data-copy="“For as no man receives that general justification which discharges from the guilt of all foregoing sins, but on the concurrence of repentance, faith, a purpose of a new life, and other actions of the same kind; so no man retains a state free from guilt in respect of following sins, but by means of the same actions of believing in God, calling on God, mortifying the flesh, daily repenting and sorrowing for sins daily committed. The reason why all these are required on our part is this: Because these cannot be still absent, but their opposites will be present, which are contrary to the nature of a justified man—As therefore to the conservation of natural life it is necessarily required that a man carefully avoid fire, water, precipices, poisons and other things destructive to the health of the body; so to the conserving of spiritual life, it is necessarily required that a man avoid incredulity, impenitency and other things that are destructive and contrary to the salvation of souls; which cannot be avoided unless the opposite and contrary actions be exercised. And these actions do not conserve the life of grace properly and of themselves by touching the very effect of conservation, but improperly and by accident, by excluding and removing the cause of destruction.”

— Richard Baxter, Richard Baxter’s Confession of his Faith… (London: 1655), ch. 10, sect. 3, pp. 322-23">Copy</button><a class="share" href="https://x.com/intent/post?text=%E2%80%9CFor+as+no+man+receives+that+general+justification+which+discharges+from+the+guilt+of+all+foregoing+sins%2C+but+on+the+concurrence+of+repentance%2C+faith%2C+a+purpose+of+a+new+life%2C+and+other+actions+of+the+same+kind%3B+so+no+man+retains+a+state+free+from+guilt+in+respect+of+following+sins%2C+but+by+means+of+the+same+actions+of+believing+in+God%2C+calling+on+God%2C+mortifying+the+flesh%2C+daily+repenting+and+sorrowing+for+sins+daily+committed.+The+reason+why+all+these+are+required+on+our+part+is+this%3A+Because+these+cannot+be+still+absent%2C+but+their+opposites+will+be+present%2C+which+are+contrary+to+the+nature+of+a+justified+man%E2%80%94As+therefore+to+the+conservation+of+natural+life+it+is+necessarily+required+that+a+man+carefully+avoid+fire%2C+water%2C+precipices%2C+poisons+and+other+things+destructive+to+the+health+of+the+body%3B+so+to+the+conserving+of+spiritual+life%2C+it+is+necessarily+required+that+a+man+avoid+incredulity%2C+impenitency+and+other+things+that+are+destructive+and+contrary+to+the+salvation+of+souls%3B+which+cannot+be+avoided+unless+the+opposite+and+contrary+actions+be+exercised.+And+these+actions+do+not+conserve+the+life+of+grace+properly+and+of+themselves+by+touching+the+very+effect+of+conservation%2C+but+improperly+and+by+accident%2C+by+excluding+and+removing+the+cause+of+destruction.%E2%80%9D%0A%0A%E2%80%94+Richard+Baxter%2C+Richard+Baxter%E2%80%99s+Confession+of+his+Faith%E2%80%A6+%28London%3A+1655%29%2C+ch.+10%2C+sect.+3%2C+pp.+322-23&amp;url=https%3A%2F%2F5solasquotes.github.io%2Fquote%2F8cc0c0b6f2.html&amp;via=5Solas" target="_blank" rel="noopener">Share on X</a><a class="perma" href="../quote/8cc0c0b6f2.html">Permalink</a><a class="src" href="https://reformedbooksonline.com/on-the-continuation-of-justification/#:~:text=For%20as%20no%20man%20receives%20that <blockquote><p>[On Rom. 5:17, 19] And here some one may enquire what this gift of justice is which flows to us from Christ our head?… Of this gift the apostle thus speaks; ‘For if by the offence of one man, etc.’ by which words St. Paul declares that, through the merit and good work of the second Adam, many receive the gift of justice and life, as through the sin of the first Adam his posterity had contracted hurt and death. But what other thing could this gift have been but the gift of the Holy Ghost, who should bring both justice and life to those who are endowed with Him.</p></blockquote>

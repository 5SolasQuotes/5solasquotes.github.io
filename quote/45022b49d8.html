<main class="wrap"><figure class="quote" id="q-45022b49d8" data-kw="">
<blockquote><p>Yet shall the crown be given to good works done in Christ, of justice, not of dignity and equivalency of the work with that crown, but of the justice of God’s promise. For it is just that He should do what He promises, and He cannot do otherwise.</p></blockquote>

<div class="meta"><span class="t"><a href="../topics/good-works/necessity-of-good-works.html">Necessity of Good Works</a></span></div>
<div class="actions"><button class="copy" data-copy="“Yet shall the crown be given to good works done in Christ, of justice, not of dignity and equivalency of the work with that crown, but of the justice of God’s promise. For it is just that He should do what He promises, and He cannot do otherwise.”

</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-7c37598d0b" data-kw="">
<blockquote><p>19. In this life they [powers of human choice] avail nothing without the help of God, whether general or special. 20. General help is called the general motion of divine providence by which all things are governed and preserved. Acts 17:28; Heb. 1:3. 21. Special help is called the particular grace that moves, strengthens, and advances unto action. 22. And this is either apart from regenerating grace, by which God distributes moral gifts and moral virtues to whom he wills, even to the reprobate (1 Cor. 12), or it is joined with regenerating grace, that is, the saving grace of Christ, of which it is said in Jn. 15:5 and 1 Cor. 15:10. 23. I say that the powers of human choice (vires humani arbitrii) avail nothing in themselves, neither in earthly matters nor in heavenly matters. 24. I call earthly matters those things which pertain only to earthly life. 25. And these are either natural or moral. 26. Natural things are called those which are common to all living beings, such as eating, drinking, sleeping, walking, procreating, etc. 27. Moral things are called political or civil matters which pertain to establishing and preserving human life, household management, society, and the commonwealth—such as buying, selling, administering justice, serving in the military, cultivating peace, governing a family, learning the sciences and arts whether liberal or mechanical, etc. 28. Heavenly matters are those things which pertain to the heavenly and spiritual life in the kingdom of Christ, such as believing in God, calling upon God, doing the will of God, fulfilling the commandments of God, etc. These are also called spiritual matters, matters pertaining to salvation, pious, Christian, and religious matters. … 38. After the fall, choice, both regenerate and unregenerate, can choose and accomplish no natural things without the general help of God. 39. Much less is it able to choose and pursue political matters without the general help of God. 40. Indeed, it cannot desire and pursue moral virtues, disciplines, and arts without the special help of God, who in his goodness bends the will and supplies strength.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/amandus-polanus.html">Amandus Polanus</a></span><span class="wk"><span class="lbl">Work:</span> <cite>‘Theological Theses on the Choice of Man’, pt. 2</cite>, (Basel: Waldkirchius, 1597) trans. at Obedientia Mortis Christi Latin</span></figcaption>

</figure><figure class="quote" id="q-40404b66e7" data-kw="">
<blockquote><p>That works are alike profitable and necessary for believers is proved by many reasons: (1) because they are commanded by God… (2) because they are necessarily conjoined with faith… (3) because by good works God is glorified and our neighbor edified; (4) because He [they?] bears witness that we are justified by faith; (5) we ought to witness to God a grateful mind, which cannot be done otherwise than by good works; (6) they confirm our calling and surrender… (7) they are our roads of approach to the eternal inheritance…</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/johannes-braun.html">Johannes Braun</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Other citations (work not named)</cite>, Section 14 of ch. 11, ‘Of Good Works’ in Locus 12, ‘Of Sanctification’ in Part 3, ‘Of the Covenants Themselves’ in The Doctrine of the Covenants, or A System of Didactic and Elenctic Theology (Amsterdam, 1691) as translated by Heinrich Heppe, Reformed Dogmatics (Wipf &amp; Stock, 2007), ch. 22, ‘Sanctification’, section 25, p. 579</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/good-works/necessity-of-good-works.html">Necessity of Good Works</a></span></div>

ce" rel="noopener" target="_blank">Read it online · Reformed Books Online</a></div>
</figure><figure class="quote" id="q-86e5c042d6" data-kw="">
<blockquote><p>These good works, done in obedience to God’s commandments, are the fruits and evidences of a true and lively faith: and by them believers manifest their thankfulness, strengthen their assurance, edify their brethren, adorn the profession of the gospel, stop the mouths of the adversaries, and glorify God, whose workmanship they are, created in Christ Jesus thereunto, that, having their fruit unto holiness, they may have the end, eternal life.</p></blockquote>

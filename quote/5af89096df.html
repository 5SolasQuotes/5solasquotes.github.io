<main class="wrap"><figure class="quote" id="q-5af89096df" data-kw="">
<blockquote><p>10 Q. What is the difference between the law and the gospel? A. The law is a doctrine that God has implanted in human nature and has repeated and renewed in His commandments. In it He holds before us, as if in a manuscript, what it is we are and are not to do, namely, obey Him perfectly both inwardly and outwardly. He also promises eternal life on the condition that I keep the law perfectly my whole life long. On the other hand, He threatens eternal damnation if I do not keep every provision of the law my whole life long but violate it in one or more of its parts. As God says in Deuteronomy 27[:26] and Galatians 3[:10], “Cursed is everyone who does not continue in all things which are written in the book of the law, to do them.” And once the law has been violated, it has no promise that by the help of the law, that is, by works of the law, our sins might be forgiven. Rather, the sentence of condemnation is imposed upon us. The gospel or good news, however, is a doctrine of which even the wisest knew nothing by nature but which is revealed from heaven. In it God does not demand but rather offers and gives us the righteousness that the law requires. This righteousness is the perfect obedience of the suffering and death of Jesus Christ, through which all sin and damnation, made manifest by the law, is pardoned and washed away (Rom. 5; Gal. 3). Furthermore, God does not give us forgiveness of sins in the gospel on the condition that we keep the law. Rather, even though we never have kept it nor will ever be able to keep it perfectly, He still has forgiven our sins and given us eternal life as an unmerited gift through faith in Jesus Christ. John 1[:17] says, “The law was given through Moses, but grace and truth come through Jesus Christ.” And Romans 8[:3, 4]: “What for the law was impossible in that it was weak through the flesh, God did by sending His Son in the likeness of sinful flesh, and condemned sin the flesh through sin, that the righteousness required by the law might be fulfilled in us, who do not walk according to the flesh but according to the Spirit.” Finally, Galatians 3:[12–14]: “The law is not of faith but ‘The man who does it shall live by it.’ Christ, however, redeemed us from the curse of the law when He became a curse for us (for it is written, ‘Cursed is everyone who hangs on a tree’), that the blessing of Abraham might come upon the Gentiles in Christ Jesus and we thus might receive the promised Spirit through faith.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/caspar-olevianus.html">Caspar Olevianus</a></span><span class="wk"><span class="lbl">Work:</span> <cite>A Firm Foundation: An Aid to Interpreting the Heidelberg Catechism</cite>, trans. Lyle D. Bierma, Texts and Studies in Reformation and Post-Reformation Thought (Carlisle, United Kingdom; Grand Rapids, MI: Paternoster Press; Baker Books, 1995), 9–10.</span></figcaption>

</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-773bd4c750" data-kw="sixth commandment homicide">

</figure><figure class="quote" id="q-faff82bb91" data-kw="ceremonial abrogation">
<blockquote><p>The ceremonial law can be viewed in two ways: either with regard to doctrine and signification; or with regard to obligation and observance. The question is not whether it was abrogated as to doctrine. We confess that it still remains and is useful in many ways among Christians; and that the mystical truth, hidden under this shell, is always the same and of perpetual necessity. Rather the question is whether it was abrogated as to obligation and obedience and whether believers are still in subjection to the ceremonial law. This was the opinion not only of the Jews of old, but also of the Judaizing false apostles in the time of the apostles. However we, with the apostles and the whole church, deny it.</p></blockquote>

</figure><figure class="quote" id="q-09eadf03f7" data-kw="">
<blockquote><p>Therefore Paul separates the spiritual people of the new covenant from the Law when he says that this people is not the child of Hagar, who had a husband, but of Sarah, the free woman, who does not know the Law. In this way he sets the people of faith far above and beyond the Law. But if it is above and beyond the Law, then it is justified, not by the Law and works but solely by its spiritual birth, that is, by faith. For spiritual birth is nothing other than faith. Now just as the people of grace neither has the Law nor can have it, so the people of the Law neither has grace nor can have it; for it is impossible for Law and grace to exist together. Either we must be justified by faith and lose the righteousness of the Law, or we must be justified by the Law and lose grace and the righteousness of faith. It is a bitter and tragic loss when we keep the Law and lose grace. On the other hand, it is a fortunate and saving loss when we keep grace and lose the Law.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/martin-luther.html">Martin Luther</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Luther’s Works</cite>, Vol. 26: Lectures on Galatians, 1535, Chapters 1-4, ed. Jaroslav Jan Pelikan, Hilton C. Oswald, and Helmut T. Lehmann, vol. 26 (Saint Louis: Concordia Publishing House, 1999), 445.</span></figcaption>

<blockquote><p>Verse 4. That the righteousness of the law might be fulfilled in us, &amp;c. This verse expresses the design of God in sending his Son, and in condemning sin the flesh. He did thus condemn it, ἵνα, in order that the righteousness of the law might be fulfilled. The meaning, therefore, of this passage is determined by the view taken of ver.

3. If that verse means, that God, by sending his Son, destroyed sin us, then of course this verse must mean, ‘He destroyed sin, in order that we should fulfil the law;’ i.e. that we should be holy. But if ver. 3 is understood of the sacrificial death of Christ, and of the condemnation of sin him as the substitute of sinners, then this verse must be understood of justification, and not of sanctification. He condemned sin, in order that the demands of the law might be satisfied. This is the view of the passage given even by the majority of the early Fathers, and by almost all evangelical interpreters, including the Reformers. “Qui intelligunt Spiritu Christi renovatos legem implere, commentum a sensu Pauli penitus alienum afferunt; neque enim eo usque proficiunt fideles, quamdia peregrinantur in mundo, ut justificatio legis in illis plena sit, vel integra. Ergo hoc ad veniam referre necesse est; quia, dum nobis accepta fertur Christi obedientia, legi satisfactum est, ut pro justis censeamur.” That this is the true meaning of the passage appears not only from the connection and the course of the argument, but also from the following considerations:

1. It is consistent with the strict and natural meaning of the words. The word δικαίωμα, here used, means, first, something righteous, and then, second, something declared to be righteous and obligatory, an ordinance or precept; and, third, a righteous decision, a just judgment, as when in Rom. 1:29, the heathen are said to know the δικαίωμα, the righteous judgment of God; and, fourth, the act of declaring righteous, justification. In this sense δικαίωμα is antithetical to κατάκριμα. The δικαίωμα τοῦ νόμου, therefore, may mean, the righteous requirement of the law, that which satisfies its demands. In strict accordance therefore with the sense of the words, we may explain the passage to mean, ‘that the demands of the law might be satisfied in us.’ That is, that we might be justified. Christ was condemned, that to us there might be no condemnation. He was made sin, that we might be made righteousness, 2 Cor. 5:21. Or, if we take δικαίωμα in the sense of (Rechtfertigungsurtheil) a declaration of righteousness, an act of justification, the same idea is expressed: ‘Sin was condemned in Christ, in order that the sentence of justification might be fulfilled, or carried into effect in us.’ This is the explanation which Eckermann, Köllner, Philippi, and other modern interpreters adopt.

2. The analogy of Scripture. To make this passage teach the doctrine of subjective justification, that we are freed from condemnation or delivered from the law by our inward sanctification, is to contradict the plain teaching of the Bible, and the whole drift and argument of this epistle.

3. The concluding clause of the verse, (who walk not after the flesh, &amp;c.) demands the interpretation given above. In the other view of the passage, the latter clause is altogether unnecessary. Why should Paul say, that Christ died in order that they should be holy who are holy, i.e. those who walk not after the flesh? On the other hand, the second clause of the verse is specially pertinent, if the first treats of justification. The benefits of Christ’s death are experienced only by those who walk not after the flesh. The gospel is not antinomian. Those only are justified who are also sanctified. Holiness is the fruit and evidence of reconciliation with God. There is no condemnation to those who walk after the Spirit; and the righteousness of the law is fulfilled by those who walk after the Spirit. In both cases, the latter clause is designed to describe the class of persons who are entitled to appropriate to themselves the promise of justification in Christ.

4. Finally, as intimated in the above quotation from Calvin, it is not true that the righteousness of the law, in the sense of complete obedience, is fulfilled in believers. The interpretation which makes the apostle say, that we are delivered from the law by the work of Christ, in order that the complete obedience which the law demands might be rendered by us, supposes what all Scripture and experience contradicts. For an exposition of the last clause of the verse, see ver. 1.</p></blockquote>

<blockquote><p>Our justice or righteousness, that is, the justice or righteousness of the Gospel, whereby we are just in the sight of God, is not our conformity with the Law: but it is Christ’s satisfaction performed unto the Law for us, or the punishment, which He sustained for us, and so his whole humiliation (that is, his taking of flesh, his undertaking of servitude, penury, ignominy, and infirmity: his suffering of that bitter passion and death: all which He did undergo for us, but willingly) and that humiliation and satisfaction freely of God imputed unto us his faithful and believers. 1 Cor. 2:2, ‘I esteemed not to know anything among you, save Jesus Christ and Him crucified.’ Col. 2:10, ‘Ye are complete in Him.’ Rom. 5:19, ‘By the obedience of one shall many be made righteous.’ Isa. 53:5-6, ‘With his stripes we are healed. The Lord hath laid upon him the iniquity of us all.’ Now that Christ might perform obedience and satisfy for us, it behoved Him to be our Mediator, being by Himself just and holy, Heb. 7:26, ‘For such an High-Priest it became us to have, holy, harmeless, undefiled, separate from sinners, and made higher than the heavens.’ All these things are true perfectly and wholly in Christ. For He has perfectly fulfilled the Law for us: 1. by the holiness of his human nature. 2.by his obedience: for He became obedient unto the death, even the death of the cross: And the former fulfilling of the law, namely, the holiness of Christ’s human nature, was requisite for the other, even for his obedience. This obedience and satisfaction of Christ is our satisfaction, and our proper iustice, for which we please God, for which we are received into favor with God the Father, and which is imputed unto us. That former fulfilling of the Law is indeed imputed also unto us, namely the humiliation and justice or righteousness of Christ’s human nature, that we may be reputed holy before God: but this holiness of Christ is imputed unto us for his obedience or satisfaction sake: because He satisfied for us God’s justice, in sustaining eternal punishment and pains, which we should have sustained everlastingly. Hence is it, that the effusion of Christ’s blood (as being the complement and consummation of Christ’s satisfaction) is only said to be our justice and righteousness. 1 Jn. 1:7, ‘The blood of Jesus Christ cleanseth us from all sin,’ that is, not only from that which is past, but also from that which is to come. … 5. How Christ’s satisfaction is made our justice and righteousness: This question is adjoined because it seems absurd that we should be justified by that which is another man’s, and not ours. The satisfaction or justice of Christ is made ours, or applied unto us, two ways, that is, by a double application. The former application is God’s, who in respect of that fulfilling of the Law performed by Christ, accepts us, and applies the same unto us; that is, He imputes it, no less than if we had never sinned, or at least had paid and suffered sufficient punishment for our sins. For albeit to justify signifies to make just, yet in the Church it signifies another thing, and is taken in another sense. Or God does apply it, when He imputes the fulfilling of the Law performed by Christ unto us, even as if it were performed by us, neither will at all punish us. But to impute, is, to accept Christ’s satisfaction, performed to this end, that it might be our justice and righteousness. We then also apply unto us the fulfilling of the Law performed by Christ, when we are steadfastly persuaded, that God does impute, apply and give it unto us, and for it reputes us for just, absolving us from all guilt… That which we have now spoken of both applications, both God’s, and ours, does manifestly show what is meant in this place by justifying: Which is, that, to justify, is not to make one just who is uniust: but to repute him for just and righteous who is uniust, and to absolve the unjust and unrighteous from all guilt, and not to punish him, and this for another’s justice and righteousness imputed by faith unto us.</p></blockquote>

C+to+accept+Christ%E2%80%99s+satisfaction%2C+performed+to+this+end%2C+that+it+might+be+our+justice+and+righteousness.+We+then+also+apply+unto+us+the+fulfilling+of+the+Law+performed+by+Christ%2C+when+we+are+steadfastly+persuaded%2C+that+God+does+impute%2C+apply+and+give+it+unto+us%2C+and+for+it+reputes+us+for+just%2C+absolving+us+from+all+guilt%E2%80%A6+That+which+we+have+now+spoken+of+both+applications%2C+both+God%E2%80%99s%2C+and+ours%2C+does+manifestly+show+what+is+meant+in+this+place+by+justifying%3A+Which+is%2C+that%2C+to+justify%2C+is+not+to+make+one+just+who+is+uniust%3A+but+to+repute+him+for+just+and+righteous+who+is+uniust%2C+and+to+absolve+the+unjust+and+unrighteous+from+all+guilt%2C+and+not+to+punish+him%2C+and+this+for+another%E2%80%99s+justice+and+righteousness+imputed+by+faith+unto+us.%E2%80%9D%0A%0A%E2%80%94+Zacharias+Ursinus%2C+The+Sum+of+Christian+Religion%3A+Delivered%E2%80%A6+in+his+Lectures+upon+the+Catechism%E2%80%A6+tr.+Henrie+Parrie+%28Oxford%2C+1587%29%2C+%E2%80%98Of+Justification%E2%80%99%2C+4+What+is+our+iustice+%26+5+How+Christ%E2%80%99s+satisfaction+is+made+our+justice+and+righteousness%2C+pp.+680-82&amp;url=https%3A%2F%2F5solasquotes.github.io%2Fquote%2F95f67b534e.html&amp;via=5Solas" target="_blank" rel="noopener">Share on X</a><a class="perma" href="../quote/95f67b534e.html">Permalink</a><a class="src" href="https://reformedbooksonline.com/the-active-obedience-of-christ#:~:text=Our%20justice%20or%20righteousness%2C%20that%20is,righteousness%20imputed%20by%20faith%20unto%20us&amp;text=Our%20justice%20or%20righteousness%2C%20that%20is%2C%20the%20justice&amp;text=justice%20and%20righteousness%20imputed%20by%20faith%20unto%20us" rel="noopener" target="_blank">Read it online · Reformed Books Online</a></div>

<blockquote><p>From the imputation of righteousness, a meritorious claim upon life and the reward of life itself equally follow. For just as the sentence of sin’s remission has regard to three things—sin, liability to punishment, and punishment itself—so the sentence of justification has regard to three things—Christ’s righteousness or satisfaction, that merit which belongs to Christ’s righteousness or satisfaction (for his satisfaction is meritorious of eternal life), and life itself.</p></blockquote>

<blockquote><p>27. By the righteousness of Christ imputed to us we cannot be said absolutely or in every respect to be righteous, as if, on account of it, God regarded us as though we had performed all things required of us by his law. For then, after that righteousness of Christ had been admitted and accepted, God could demand no obedience to his law from us on our part. But by the righteousness of Christ imputed to us God esteems us righteous insofar as we have been transgressors of the divine law; so that we are said to be made righteous by that righteousness of Christ insofar as by our disobedience we had been constituted unrighteous. For Christ did not satisfy for all those things which we were bound to do by the law (for He would then have come into the world to dissolve the law), but only for those things which we had done against the law, or which, when we ought to have done them, we did not do.</p></blockquote>

<blockquote><p>Here the preceding cause [in Rom. 3:24] is Christ constituted a propitiation in his blood. In this impulsive cause, two things are noted: First, Christ’s justice or obedience is the meritorious cause of our salvation; Second, this justice and obedience consists in full satisfaction for our sins and complete fulfillment of the Law for us. Concerning the first, that Christ’s justice is the meritorious cause of our salvation: since it seems to conflict that we are saved by free grace and by merit, that is, a price paid, it must be thus understood. Christ’s merit opposes not God’s judgment simply or in itself, for Christ, as man and Son of God by the union of divine and human natures, has this of grace, not having earned it. As Augustine testifies, in Him the predestination of grace most clearly shines, so His merit opposes not God’s grace but is subordinate to it, depending thereon. But both God’s grace and Christ’s merit oppose our works, each in its order. Thus, grace, from which merit flows, and merit, whereby we are saved, stand together. This is proved by texts conjoining God’s love, Christ’s propitiation, reconciliation, redemption, and ransom, and by the same and like texts proving that Christ by His obedience truly merited salvation for us. For if He fully satisfied for our sins, paid the penalties due, appeased God’s wrath, and acquired eternal life, He rightly merited salvation for us. Merit here we call the most sufficient price to satisfy God’s judgment for sins and penalties and to acquire eternal life. In sum, respecting God, all is free; respecting God’s appeased wrath through the Son, there is merit, yet freely given to you. Concerning the second, that Christ’s justice consists in full satisfaction for our sins and complete fulfillment of the Law: Christ’s most full and perfect obedience or justice, whereby we are justified when imputed, includes both complete satisfaction for all sins and fulfillment of all the Law requires of us. For He was made under the Law for us, which demands two things: that we commit nothing against it, and omit nothing of it. Otherwise, it thunders woe against both him that does not what he ought and him that does what he ought not. But Christ is the fulfilling of the Law unto salvation for all that believe (Rom. 10). The righteousness of the Law is fulfilled in us, not by us, but in our Head, Christ, for us. Thus, chiefly, Christ by His obedience satisfied for our sins, bearing most sufficient penalties, whence Scripture greatly commends the benefit of Christ’s death, for by it we are redeemed from death. But He also perfectly fulfilled the Law for us, not only by suffering but by doing—yea, in suffering He acts, for He offers Himself as priest and is offered as victim (Rom. 4). Not only are sins not imputed, being remitted, but Christ’s justice is imputed, He who was made justice for us (1 Cor. 1:30). Yet to understand this rightly, note that Christ’s justice is threefold: First, essential, common to the three Persons, which is God Himself, for whatsoever is in God is God; Second, habitual justice, adorning His human nature from conception with purity far beyond angelic, yet created; Third, actual justice, whereby throughout His life, especially in suffering that death, He rendered obedience to the Father. This third alone enters the account of the merit of our justification, whereby we are not only redeemed from death but obtain eternal life through this perfect obedience perfectly rendered to the Law by Christ for us. … The matter of justification, as the term is variously taken, is considered by theologians not in one way, but it reduces to this: the matter is either the subject in which and from which this benefit arises, namely, Christ’s imputed justice, as taught above, which imputation includes both absolution from injustice through remission of sins (by which term Scripture often synecdochically comprehends the whole benefit of salvation) and the adjudication of Christ’s justice (Dan. 9, Rom. 4, 8, mentioning not only remission but the gift of justice); or the subject receiving this benefit, which is all and only the elect (Rom. 8, proved first a priori, because they are elect, then a posteriori, because they are justified). The form of justification is this application of Christ’s justice through faith, or that free imputation whereof we spoke (Rom. 4, Phil. 3, 2 Cor. 5), where the phrase ‘in Him’ notes two things: first, our justice is not inherent in us but Christ’s, existing outside us, yet ours by right of donation; second, we have Christ’s justice as Christ has our sin—not subjectively but relatively, by imputation, as shall be said in explicating the effects.</p></blockquote>

<div class="actions"><button class="copy" data-copy="“Here the preceding cause [in Rom. 3:24] is Christ constituted a propitiation in his blood. In this impulsive cause, two things are noted: First, Christ’s justice or obedience is the meritorious cause of our salvation; Second, this justice and obedience consists in full satisfaction for our sins and complete fulfillment of the Law for us. Concerning the first, that Christ’s justice is the meritorious cause of our salvation: since it seems to conflict that we are saved by free grace and by merit, that is, a price paid, it must be thus understood. Christ’s merit opposes not God’s judgment simply or in itself, for Christ, as man and Son of God by the union of divine and human natures, has this of grace, not having earned it. As Augustine testifies, in Him the predestination of grace most clearly shines, so His merit opposes not God’s grace but is subordinate to it, depending thereon. But both God’s grace and Christ’s merit oppose our works, each in its order. Thus, grace, from which merit flows, and merit, whereby we are saved, stand together. This is proved by texts conjoining God’s love, Christ’s propitiation, reconciliation, redemption, and ransom, and by the same and like texts proving that Christ by His obedience truly merited salvation for us. For if He fully satisfied for our sins, paid the penalties due, appeased God’s wrath, and acquired eternal life, He rightly merited salvation for us. Merit here we call the most sufficient price to satisfy God’s judgment for sins and penalties and to acquire eternal life. In sum, respecting God, all is free; respecting God’s appeased wrath through the Son, there is merit, yet freely given to you. Concerning the second, that Christ’s justice consists in full satisfaction for our sins and complete fulfillment of the Law: Christ’s most full and perfect obedience or justice, whereby we are justified when imputed, includes both complete satisfaction for all sins and fulfillment of all the Law requires of us. For He was made under the Law for us, which demands two things: that we commit nothing against it, and omit nothing of it. Otherwise, it thunders woe against both him that does not what he ought and him that does what he ought not. But Christ is the fulfilling of the Law unto salvation for all that believe (Rom. 10). The righteousness of the Law is fulfilled in us, not by us, but in our Head, Christ, for us. Thus, chiefly, Christ by His obedience satisfied for our sins, bearing most sufficient penalties, whence Scripture greatly commends the benefit of Christ’s death, for by it we are redeemed from death. But He also perfectly fulfilled the Law for us, not only by suffering but by doing—yea, in suffering He acts, for He offers Himself as priest and is offered as victim (Rom. 4). Not only are sins not imputed, being remitted, but Christ’s justice is imputed, He who was made justice for us (1 Cor. 1:30). Yet to understand this rightly, note that Christ’s justice is threefold: First, essential, common to the three Persons, which is God Himself, for whatsoever is in God is God; Second, habitual justice, adorning His human nature from conception with purity far beyond angelic, yet created; Third, actual justice, whereby throughout His life, especially in suffering that death, He rendered obedience to the Father. This third alone enters the account of the merit of our justification, whereby we are not only redeemed from death but obtain eternal life through this perfect obedience perfectly rendered to the Law by Christ for us. … The matter of justification, as the term is variously taken, is considered by theologians not in one way, but it reduces to this: the matter is either the subject in which and from which this benefit arises, namely, Christ’s imputed justice, as taught above, which imputation includes both absolution from injustice through remission of sins (by which term Scripture often synecdochically comprehends the whole benefit of salvation) and the adjudication of Christ’s justice (Dan. 9, Rom. 4, 8, mentioning not only remission but the gift of justice); or the subject receiving this benefit, which is all and only the elect (Rom. 8, proved first a priori, because they are elect, then a posteriori, because they are justified). The form of justification is this application of Christ’s justice through faith, or that free imputation whereof we spoke (Rom. 4, Phil. 3, 2 Cor. 5), where the phrase ‘in Him’ notes two things: first, our justice is not inherent in us but Christ’s, existing outside us, yet ours by right of donation; second, we have Christ’s justice as Christ has our sin—not subjectively but relatively, by imputation, as shall be said in explicating the effects.”

— Sr. Lucas Trelcatius, Commonplaces of Holy Theology, “Of Justification”, “Part Constructive”, p. 137 in Trelcatius Sr. &amp; Jr., Opuscula Theologica Omnia (d. 1602; Leiden: Orlers &amp; Maire, 1614), trans. AI at Confessionally Reformed Theology. Trelctius Sr. (1542–1602) was a reformed theologian and professer at Leiden, Netherlands.">Copy</button><a class="share" href="https://x.com/intent/post?text=%E2%80%9CHere+the+preceding+cause+%5Bin+Rom.+3%3A24%5D+is+Christ+constituted+a+propitiation+in+his+blood.+In+this+impulsive+cause%2C+two+things+are+noted%3A+First%2C+Christ%E2%80%99s+justice+or+obedience+is+the+meritorious+cause+of+our+salvation%3B+Second%2C+this+justice+and+obedience+consists+in+full+satisfaction+for+our+sins+and+complete+fulfillment+of+the+Law+for+us.+Concerning+the+first%2C+that+Christ%E2%80%99s+justice+is+the+meritorious+cause+of+our+salvation%3A+since+it+seems+to+conflict+that+we+are+saved+by+free+grace+and+by+merit%2C+that+is%2C+a+price+paid%2C+it+must+be+thus+understood.+Christ%E2%80%99s+merit+opposes+not+God%E2%80%99s+judgment+simply+or+in+itself%2C+for+Christ%2C+as+man+and+Son+of+God+by+the+union+of+divine+and+human+natures%2C+has+this+of+grace%2C+not+having+earned+it.+As+Augustine+testifies%2C+in+Him+the+predestination+of+grace+most+clearly+shines%2C+so+His+merit+opposes+not+God%E2%80%99s+grace+but+is+subordinate+to+it%2C+depending+thereon.+But+both+God%E2%80%99s+grace+and+Christ%E2%80%99s+merit+oppose+our+works%2C+each+in+its+order.+Thus%2C+grace%2C+from+which+merit+flows%2C+and+merit%2C+whereby+we+are+saved%2C+stand+together.+This+is+proved+by+texts+conjoining+God%E2%80%99s+love%2C+Christ%E2%80%99s+propitiation%2C+reconciliation%2C+redemption%2C+and+ransom%2C+and+by+the+same+and+like+texts+proving+that+Christ+by+His+obedience+truly+merited+salvation+for+us.+For+if+He+fully+satisfied+for+our+sins%2C+paid+the+penalties+due%2C+appeased+God%E2%80%99s+wrath%2C+and+acquired+eternal+life%2C+He+rightly+merited+salvation+for+us.+Merit+here+we+call+the+most+sufficient+price+to+satisfy+God%E2%80%99s+judgment+for+sins+and+penalties+and+to+acquire+eternal+life.+In+sum%2C+respecting+God%2C+all+is+free%3B+respecting+God%E2%80%99s+appeased+wrath+through+the+Son%2C+there+is+merit%2C+yet+freely+given+to+you.+Concerning+the+second%2C+that+Christ%E2%80%99s+justice+consists+in+full+satisfaction+for+our+sins+and+complete+fulfillment+of+the+Law%3A+Christ%E2%80%99s+most+full+and+perfect+obedience+or+justice%2C+whereby+we+are+justified+when+imputed%2C+includes+both+complete+satisfaction+for+all+sins+and+fulfillment+of+all+the+Law+requires+of+us.+For+He+was+made+under+the+Law+for+us%2C+which+demands+two+things%3A+that+we+commit+nothing+against+it%2C+and+omit+nothing+of+it.+Otherwise%2C+it+thunders+woe+against+both+him+that+does+not+what+he+ought+and+him+that+does+what+he+ought+not.+But+Christ+is+the+fulfilling+of+the+Law+unto+salvation+for+all+that+believe+%28Rom.+10%29.+The+righteousness+of+the+Law+is+fulfilled+in+us%2C+not+by+us%2C+but+in+our+Head%2C+Christ%2C+for+us.+Thus%2C+chiefly%2C+Christ+by+His+obedience+satisfied+for+our+sins%2C+bearing+most+sufficient+penalties%2C+whence+Scripture+greatly+commends+the+benefit+of+Christ%E2%80%99s+death%2C+for+by+it+we+are+redeemed+from+death.+But+He+also+perfectly+fulfilled+the+Law+for+us%2C+not+only+by+suffering+but+by+doing%E2%80%94yea%2C+in+suffering+He+acts%2C+for+He+offers+Himself+as+priest+and+is+offered+as+victim+%28Rom.+4%29.+Not+only+are+sins+not+imputed%2C+being+remitted%2C+but+Christ%E2%80%99s+justice+is+imputed%2C+He+who+was+made+justice+for+us+%281+Cor.+1%3A30%29.+Yet+to+understand+this+rightly%2C+note+that+Christ%E2%80%99s+justice+is+threefold%3A+First%2C+essential%2C+common+to+the+three+Persons%2C+which+is+God+Himself%2C+for+whatsoever+is+in+God+is+God%3B+Second%2C+habitual+justice%2C+adorning+His+human+nature+from+conception+with+purity+far+beyond+angelic%2C+yet+created%3B+Third%2C+actual+justice%2C+whereby+throughout+His+life%2C+especially+in+suffering+that+death%2C+He+rendered+obedience+to+the+Father.+This+third+alone+enters+the+account+of+the+merit+of+our+justification%2C+whereby+we+are+not+only+redeemed+from+death+but+obtain+eternal+life+through+this+perfect+obedience+perfectly+rendered+to+the+Law+by+Christ+for+us.+%E2%80%A6+The+matter+of+justification%2C+as+the+term+is+variously+taken%2C+is+considered+by+theologians+not+in+one+way%2C+but+it+reduces+to+this%3A+the+matter+is+either+the+subject+in+which+and+from+which+this+benefit+arises%2C+namely%2C+Christ%E2%80%99s+imputed+justice%2C+as+taught+above%2C+which+imputation+includes+both+absolution+from+injustice+through+remission+of+sins+%28by+which+term+Scripture+often+synecdochically+comprehends+the+whole+benefit+of+salvation%29+and+the+adjudication+of+Christ%E2%80%99s+justice+%28Dan.+9%2C+Rom.+4%2C+8%2C+mentioning+not+only+remission+but+the+gift+of+justice%29%3B+or+the+subject+receiving+this+benefit%2C+which+is+all+and+only+the+elect+%28Rom.+8%2C+proved+first+a+priori%2C+because+they+are+elect%2C+then+a+posteriori%2C+because+they+are+justified%29.+The+form+of+justification+is+this+application+of+Christ%E2%80%99s+justice+through+faith%2C+or+that+free+imputation+whereof+we+spoke+%28Rom.+4%2C+Phil.+3%2C+2+Cor.+5%29%2C+where+the+phrase+%E2%80%98in+Him%E2%80%99+notes+two+things%3A+first%2C+our+justice+is+not+inherent+in+us+but+Christ%E2%80%99s%2C+existing+outside+us%2C+yet+ours+by+right+of+donation%3B+second%2C+we+have+Christ%E2%80%99s+justice+as+Christ+has+our+sin%E2%80%94not+subjectively+but+relatively%2C+by+imputation%2C+as+shall+be+said+in+explicating+the+effects.%E2%80%9D%0A%0A%E2%80%94+Sr.+Lucas+Trelcatius%2C+Commonplaces+of+Holy+Theology%2C+%E2%80%9COf+Justification%E2%80%9D%2C+%E2%80%9CPart+Constructive%E2%80%9D%2C+p.+137+in+Trelcatius+Sr.+%26+Jr.%2C+Opuscula+Theologica+Omnia+%28d.+1602%3B+Leiden%3A+Orlers+%26+Maire%2C+1614%29%2C+trans.+AI+at+Confessionally+Reformed+Theology.+Trelctius+Sr.+%281542%E2%80%931602%29+was+a+reformed+theologian+and+professer+at+Leiden%2C+Netherlands.&amp;url=https%3A%2F%2F5solasquotes.github.io%2Fquote%2F2b18c6ea1b.html&amp;via=5Solas" target="_blank" rel="noopener">Share on X</a><a class="perma" href="../quote/2b18c6ea1b.html">Permalink</a><a class="src" href="https://reformedbooksonline.com/the-active-obedience-of-christ#:~:text=Here%20the%20preceding%20cause%20%5Bin%20Rom,be%20said%20in%20explicating%20the%20effects&amp;text=Here%20the%20preceding%20cause%20%5Bin%20Rom.%203%3A24%5D%20is&amp;text=as%20shall%20be%20said%20in%20explicating%20the%20effects" rel="noopener" target="_blank">Read it online · Reformed Books Online</a></div>

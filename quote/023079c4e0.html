<blockquote><p>XXIX. Though I here tell you once for all that I justify not all that I can thus bear with, yet we can submit by peaceable silence to many abuses in a Church which we dare not subscribe to and approve, and use also passive obedience where active is unlawful.</p></blockquote>

</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-2a0e069616" data-kw="">
<blockquote><p>Objection [of Rutherford’s Opponents]: In matters plainly determined by Scripture, rulers are to follow the Word of God; but in matters circumstantial or indifferent, where Scripture says neither for the one side nor for the other, what rulers think good is to be followed, there being no evil, nor impiety in that which they command. [Margin Note:] The will of rulers not a law to us in things indifferent. Answer [of Rutherford] 1: This is to make rulers in matters of salvation liable to the Scriptures of God, but in matters which men call indifferent, to make them Popes and to hang our consciences upon their sleeve, which is most absurd: 1. Because Paul, in matters most indifferent of days and meats, would not have the Romans to hang upon his judgement, but will rule both their practice and his own by the Law of nature: murder not, scandalize not. 2. What rulers think good is not a rule for constitutions and for people’s obedience in matters circumstantial; but the rule of rulers here in making laws, and of people in obeying laws, is goodness itself, order, decency, aptitude to edify, in things that they command; for it were strange if, in matters that they call ‘of salvation’, not [their] thoughts, but the Word of God should rule and square [regulate] canon-makers, but in matters indifferent, their thoughts should be a law. 3. Scripture and the Law of nature and right reason, which is a deduction from Scripture, is able sufficiently in all canons and constitutions to regulate both rulers and people, and to determine what is convenient in circumstances; and the Lord here is an infallible Judge, speaking in his Word, as He is in all matters which they call ‘fundamental’; yea, the Scripture shall be imperfect in the duties of the Second Table if it do not determine what is active scandal, or soul murder, as it does determine what is idolatry, what is lawful worship [in the First Table].</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/samuel-rutherford.html">Samuel Rutherford</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Divine Right of Church Government… (1646)</cite>, p. 656</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/civil-government-and-society/resistance-to-tyranny-and-lawful-authority.html">Resistance to Tyranny and Lawful Authority</a></span></div>

</figure><figure class="quote" id="q-13e6b614f3" data-kw="">
<blockquote><p>Whether they are sure that these superstitions of theirs may not run the round as other superstitions have done before them?… What if the next age should turn them into a dead formality? And what if the next age after that should make laws to enforce them? And then godly people first scruple them, and then fly from them as discerned superstition? And then the worst men be glad of that advantage to persecute those that would not submit to them? By this circulation, if the same men who invented… new and needless Church covenants, etc. could but live two or 300 years, they might come to be among the number of those who cry out of them as superstitious, and suffer persecution because they will not use them.</p></blockquote>

</figure><figure class="quote" id="q-dc45fd21f5" data-kw="">
<blockquote><p>XXI… Rulers have authority to command that which is good, though not in a faulty manner; and when we cannot do the good without the faulty manner, it is their fault and not ours: e.g. If an inconvenient time, place, text, tune, etc. be chosen, the union and concord which is held by agreeing in those modes is necessary: He that will not join in them cannot join in the worship. So that we obey the ruler or guide as a determiner of the means of concord, which is necessary, and not sub ratione erroris [under the rule of the error], [we do not obey and perform the action formally] as misdetermining, though [we do the action] in that which is [materially] misdetermined…º And it’s to us a lawful circumstance, because [it is] necessary to concord and [is] commanded, though mistakingly. XXII. We [nonconformists] never held it unlawful to join with a Church or minister that has some faults, both personal and in their acts of worship, as if all that joined were guilty of all the faults there committed: No not though we knew before hand that some false doctrine would be uttered or fault committed: Else we must separate from all the world, and all [people must separate] from us. … XXIV. We never judged needless affected singularity a duty, but judge it best in lawful things for concord’s sake to conform to the custom of the Churches where we live or come.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/richard-baxter.html">Richard Baxter</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The English Nonconformity as under King Charles II &amp; King James II Truly Stated &amp; Argued (London, 1689), ch. 2</cite>, pp. 11-16</span></figcaption>

</figure><figure class="quote" id="q-9be5ae0f6d" data-kw="">
<blockquote><p>But for no cause the most weighty can we choose either to shed innocent blood or to co-operate with the shedding of it, nor to co-operate with the works of darkness, for it is shameful that a servant may lawfully cooperate with and thrust his master in at a window to go to a whore; the jus or dominion of masters to command, and the right of servants to obey is only in the Lord. …the one kind of action in itself is as indifferent and susceptible of moral lawfulness and unlawfulness as the other. And if the master do cooperate to commit harlotry in climbing in at a window to a whore, and to robbing, in digging through an innocent man’s house in the night, to kill the master of the house, and to steal his goods, then the servant that cooperates in these same physical actions, and also digs through the innocent man’s house and kills himself, is the harlot and the robber by cooperation and participation, no less than the master. The naked relation of a captive and of a servant cannot make the captive and servant innocent and guiltless cooperators, for then to sin at the command of any conqueror and master, because I am in the condition of a captive and servant, were lawful, though God forbid and inhibit me to do what I do, by the command of my master and conqueror, for in so doing, Utor meo jure, ‘I use my right’ as a servant. For God forbids me in what relation I be in, servant or captive, to sin at the command of any, or for declining any ill of punishment, though as weighty as the torment of hell, separated from sinful despairing and blaspheming of God. Now to cooperate with that which I know to be a sin is to partake in other men’s sins, which is forbidden, as a sin, 1 Tim. 5:22; Eph. 5:11. But to run with the thief and to help an arch-robber, Prov. 1:13-14, is a consenting to his robbery and bloodshed.</p></blockquote>

<div class="actions"><button class="copy" data-copy="“But for no cause the most weighty can we choose either to shed innocent blood or to co-operate with the shedding of it, nor to co-operate with the works of darkness, for it is shameful that a servant may lawfully cooperate with and thrust his master in at a window to go to a whore; the jus or dominion of masters to command, and the right of servants to obey is only in the Lord. …the one kind of action in itself is as indifferent and susceptible of moral lawfulness and unlawfulness as the other. And if the master do cooperate to commit harlotry in climbing in at a window to a whore, and to robbing, in digging through an innocent man’s house in the night, to kill the master of the house, and to steal his goods, then the servant that cooperates in these same physical actions, and also digs through the innocent man’s house and kills himself, is the harlot and the robber by cooperation and participation, no less than the master. The naked relation of a captive and of a servant cannot make the captive and servant innocent and guiltless cooperators, for then to sin at the command of any conqueror and master, because I am in the condition of a captive and servant, were lawful, though God forbid and inhibit me to do what I do, by the command of my master and conqueror, for in so doing, Utor meo jure, ‘I use my right’ as a servant. For God forbids me in what relation I be in, servant or captive, to sin at the command of any, or for declining any ill of punishment, though as weighty as the torment of hell, separated from sinful despairing and blaspheming of God. Now to cooperate with that which I know to be a sin is to partake in other men’s sins, which is forbidden, as a sin, 1 Tim. 5:22; Eph. 5:11. But to run with the thief and to help an arch-robber, Prov. 1:13-14, is a consenting to his robbery and bloodshed.”

— Reformed Material, London Ministers | The Divine Right of Church Government... (1646), Appendix, pp. 85-86">Copy</button><a class="share" href="https://x.com/intent/post?text=%E2%80%9CBut+for+no+cause+the+most+weighty+can+we+choose+either+to+shed+innocent+blood+or+to+co-operate+with+the+shedding+of+it%2C+nor+to+co-operate+with+the+works+of+darkness%2C+for+it+is+shameful+that+a+servant+may+lawfully+cooperate+with+and+thrust+his+master+in+at+a+window+to+go+to+a+whore%3B+the+jus+or+dominion+of+masters+to+command%2C+and+the+right+of+servants+to+obey+is+only+in+the+Lord.+%E2%80%A6the+one+kind+of+action+in+itself+is+as+indifferent+and+susceptible+of+moral+lawfulness+and+unlawfulness+as+the+other.+And+if+the+master+do+cooperate+to+commit+harlotry+in+climbing+in+at+a+window+to+a+whore%2C+and+to+robbing%2C+in+digging+through+an+innocent+man%E2%80%99s+house+in+the+night%2C+to+kill+the+master+of+the+house%2C+and+to+steal+his+goods%2C+then+the+servant+that+cooperates+in+these+same+physical+actions%2C+and+also+digs+through+the+innocent+man%E2%80%99s+house+and+kills+himself%2C+is+the+harlot+and+the+robber+by+cooperation+and+participation%2C+no+less+than+the+master.+The+naked+relation+of+a+captive+and+of+a+servant+cannot+make+the+captive+and+servant+innocent+and+guiltless+cooperators%2C+for+then+to+sin+at+the+command+of+any+conqueror+and+master%2C+because+I+am+in+the+condition+of+a+captive+and+servant%2C+were+lawful%2C+though+God+forbid+and+inhibit+me+to+do+what+I+do%2C+by+the+command+of+my+master+and+conqueror%2C+for+in+so+doing%2C+Utor+meo+jure%2C+%E2%80%98I+use+my+right%E2%80%99+as+a+servant.+For+God+forbids+me+in+what+relation+I+be+in%2C+servant+or+captive%2C+to+sin+at+the+command+of+any%2C+or+for+declining+any+ill+of+punishment%2C+though+as+weighty+as+the+torment+of+hell%2C+separated+from+sinful+despairing+and+blaspheming+of+God.+Now+to+cooperate+with+that+which+I+know+to+be+a+sin+is+to+partake+in+other+men%E2%80%99s+sins%2C+which+is+forbidden%2C+as+a+sin%2C+1+Tim.+5%3A22%3

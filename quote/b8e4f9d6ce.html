<main class="wrap"><figure class="quote" id="q-b8e4f9d6ce" data-kw="">
<blockquote><p>What have these most pestilential Sophists left to Christ on which to exert his virtue? They say that he merited for us the first grace, that is, the occasion of meriting, and that it is our part not to let slip the occasion thus offered. O the daring effrontery of impiety! Who would have thought that men professing the name of Christ would thus strip him of his power, and all but trample him under foot?</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/john-calvin.html">John Calvin</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Institutes of the Christian Religion</cite>, 3.15.6</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/rome/justification.html">Rome: Justification</a> › <a href="../topics/rome/justification/merit.html">Merit</a></span><span class="t"><a href="../topics/good-works/merit-and-reward.html">Merit and Reward</a> › <a href="../topics/good-works/merit-and-reward/merit-of-condignity-and-congruity.html">Merit of condignity and congruity</a></span></div>
<div class="actions"><button class="copy" data-copy="“What have these most pestilential Sophists left to Christ on which to exert his virtue? They say that he merited for us the first grace, that is, the occasion of meriting, and that it is our part not to let slip the occasion thus offered. O the daring effrontery of impiety! Who would have thought that men professing the name of Christ would thus strip him of his power, and all but trample him under foot?”

— John Calvin, Institutes of the Christian Religion, 3.15.6">Copy</button><a class="share" href="https://x.com/intent/post?text=%E2%80%9CWhat%20have%20these%20most%20pestilential%20Sophists%20left%20to%20Christ%20on%20which%20to%20exert%20his%20virtue%3F%20They%20say%20that%20he%20merited%20for%20us%20the%20first%20grace%2C%20that%20is%2C%20the%20occasion%20of%20meriting%2C%20and%20that%20it%20is%20our%20part%20not%20to%20let%20slip%20the%20occasion%20thus%20offered.%20O%20the%20daring%20effrontery%20of%20impiety%21%20Who%20would%20have%20thought%20that%20men%20professing%20the%20name%20of%20Christ%20would%20thus%20strip%20him%20of%20his%20power%2C%20and%20all%20but%20trample%20him%20under%20foot%3F%E2%80%9D%0A%0A%E2%80%94%20John%20Calvin%2C%20Institutes%20of%20the%20Christian%20Religion%2C%203.15.6&amp;url=https%3A%2F%2F5solasquotes.github.io%2Fquote%2Fb8e4f9d6ce.html&amp;via=5Solas" target="_blank" rel="noopener">Share on X</a><a class="perma" href="../quote/b8e4f9d6ce.html">Permalink</a><a class="src" href="https://ccel.org/ccel/calvin/institutes" rel="noopener" target="_blank">Read it online · CCEL</a></div>
</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-16ec124bdb" data-kw="">
<blockquote><p>The whole dispute is as to The Cause of Justification. The Fathers of Trent pretend that it is twofold, as if we were justified partly by forgiveness of sins and partly by spiritual regeneration; or, to express their view in other words, as if our righteousness were composed partly of imputation, partly of quality. I maintain that it is one, and simple, and is wholly included in the gratuitous acceptance of God. I besides hold that it is without us, because we are righteous in Christ only.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/john-calvin.html">John Calvin</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Acts of the Council of Trent with the Antidote</cite>, Antidote to the Sixth Session, on the decree (ch. 7, the causes of justification)</span></figcaption>

</figure><figure class="quote" id="q-08d6a514fe" data-kw="Faith alone">
<blockquote><p>Man is justified by faith without works; therefore by faith alone. The reason of the consequence is manifest because there are not more modes of justifying than these two—by faith and by works. Thus, one being removed, the other must not only necessarily be left, but also left alone. Otherwise the enumeration would not be legitimate. … Now why would the apostle so often and so expressly institute an antithesis between faith and works in this matter, if works could concur with faith in any way to the act of justification? Would he not in this particular have occasioned believers to err by removing works absolutely and simply from it, if they contribute anything towards it?</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/francis-turretin.html">Francis Turretin</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Institutes of Elenctic Theology</cite>, 16.8.8</span></figcaption>

— Francis Turretin, Institutes of Elenctic Theology, 16.8.8">Copy</button><a class="share" href="https://x.com/intent/post?text=%E2%80%9CMan+is+justified+by+faith+without+works%3B+therefore+by+faith+alone.+The+reason+of+the+consequence+is+manifest+because+there+are+not+more+modes+of+justifying+than+these+two%E2%80%94by+faith+and+by+works.+Thus%2C+one+being+removed%2C+the+other+must+not+only+necessarily+be+left%2C+but+also+left+alone.+Otherwise+the+enumeration+would+not+be+legitimate.+%E2%80%A6+Now+why+would+the+apostle+so+often+and+so+expressly+institute+an+antithesis+between+faith+and+works+in+this+matter%2C+if+works+could+concur+with+faith+in+any+way+to+the+act+of+justification%3F+Would+he+not+in+this+particular+have+occasioned+believers+to+err+by+removing+works+absolutely+and+simply+from+it%2C+if+they+contribute+anything+towards+it%3F%E2%80%9D%0A%0A%E2%80%94+Francis+Turretin%2C+Institutes+of+Elenctic+Theology%2C+16.8.8&amp;url=https%3A%2F%2F5solasquotes.github.io%2Fquote%2F08d6a514fe.html&amp;via=5Solas" target="_blank" rel="noopener">Share on X</a><a class="perma" href="../quote/08d6a514fe.html">Permalink</a><span class="src none">No free online copy linked</span></div>
</figure><figure class="quote" id="q-9c4add85b0" data-kw="">
<blockquote><p>They say, we are justified by works, as by causes thereof: we say, that we are justified by works as by signs and fruits of our justification before God, and no otherwise.</p></blockquote>

<main class="wrap"><figure class="quote" id="q-047f196ad6" data-kw="">
<blockquote><p>The unchanged “heart is deceitful above all things,” and, insofar as godliness is concerned, “desperately wicked;” and in nothing do this deceitfulness and this desperate wickedness appear so radically, and truly, and conspicuously a part of our fallen being, as in the attempts which we make to palliate what is indefensible and inexcusable, and to characterise by the name of frailties and foibles what are held in the estimation of God, and represented in his Word, as symptoms of the deadliest enmity against the Most High, and sufficient to banish us from the light of his countenance for ever.

It is on this point that Satan exerts all his darkening, conscience-searing, and benumbing influence, for well does this subtle adversary know that when once the mask is taken off the face of sin, the sinner could not but loathe and avoid what he had lately admired and loved as “the perfection of beauty.” He, therefore, labours unweariedly, and both directly by his own suggestions, and indirectly through the agents whom he is permitted to employ, as prince of this apostate world, to keep the veil on the head of the seducer, and thus to lead the fancy to imagine charms in objects with whom are “the dead. and whose guests are in the depths of hell.”

Here he displays his delegated power, and thus he accomplishes those plans of opposition to the Divine purposes, and of unextinguishable hatred of goodness in the soul, which he formed from the moment that man was created, and the execution of which he commenced in paradise, and is still carrying on through the instrumentality of “the lust of the flesh, the lust of the eye, and the pride of life.”

This revealed truth has often been sneered at, or, where any thing like a sense of decency remains, attempted to be explained away by learned dissertations on figures of speech, and eastern personification, and hyperbole. Such a method of getting rid of a humiliating and troublesome doctrine may satisfy the corrupt infidel and the nominal Christian; but no sooner has the Spirit of God made a movement against the citadel of unbelief, and softened the stony heart, and touched the unclean lips with a live coal from the altar, than the reality of the devil’s presence and operation is felt and acknowledged. There is then an end of all delusion: sin stands disclosed in all its hideousness and hatefulness and sin is the name given to many thoughts, words, and actions, which were once regarded as any thing but offensive, either in the sight of God or man.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/robert-jeffrey.html">Robert Jeffrey</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Lot s Flight from Sodom’ in The Free Church Pulpit; Consisting of Discourses by the Most Eminent divines of the Free Church of Scotland. Vol. I.</cite></span></figcaption>

</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-21c465d880" data-kw="">
<blockquote><p>Q. What are you by Adam’s fall? A. I am wholly corrupted with sin, and continually subject to the curse and wrath of God.

Proofs.

• 1 That man’s nature is wholly corrupted with sin, Gen. 6.5. God saw that every imagination of the thoughts of man’s heart was only evil continually Rom. 5.12, 14. • 2 That every natural man is subject to God’s curse, Gal. 3.10. Cursed is every one, that continueth not in all things, which are written in the book of the Law to do them.

Q. What are your sins? A. A guiltiness in Adam’s first offence, and a disposition of my heart to every thing that is against the Law of God, with innumerable fruits thereof in thought, speech, and action.

Proofs.

• 1 That we are guilty of and in Adam’s first offence, Rom. 5.12. By the offence of one judgement came upon all men to condemnation. • 2 That our hearts are inclined to go against God’s Law, Rom. 7.23. I see another Law in my members, rebelling and warring against the Law of my mind, and leading me captive to the Law of sin, &amp;c. • 3 That we are thus corrupted from the beginning of our nature, Psal. 51.5. David saith, Behold, I was shapen in iniquity, and in sin did my mother conceive me, Job 14.4. • 4 That our actual sins are innumerable. Psal. 40.12. &amp; Ezra. 9, 6. Our iniquities are increased over our heads, and our trespasses are grown up to heaven.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/thomas-gouge.html">Thomas Gouge</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The principles of Christian religion. Proved by scripture, propounded by questions and answers: short for memory, plain for the meanest capacity, and profitable for all</cite>, (London: Samuel Man, 1645), p. 3.</span></figcaption>

<blockquote><p>We find three old opinions concerning the sin against the Holy-Ghost, but they were long since exploded; I will but only name them: First, saint Origen thought all sins committed after baptism, to be sins against the Holy Ghost: his reason was only a witty conceit of his own, that God the Father is in all things, the Son is only in all reasonable creatures, the Holy Ghost is only in all regenerate men; therefore when men sin against that divine Person that is in them, if they be heathens, they sin against God the Father or the Son; if they be Christians, they sin against the Holy Ghost. The Novatian heretics agreed with Origen in opinion, for they denied remission of sins to any that fell, thinking all falls of Christians to be the sin against the Holy Ghost: but this opinion is false; For else all sins were unpardonable to Christians: yet we find saint Paul remit the sin of the incestuous Corinthian; also our Savior charges the Pharisees with this sin, who were no Christians. Secondly, saint Augustine thought [after a revision of his earlier view] final impenitency to be the sin against the Holy Ghost; but final impenitency is no blasphemy, but only a general circumstance that may accompany any sin. Besides, our Savior intends that this sin may be found in this life, for he says it shall not be forgiven in this life, and the Pharisees were alive when they were accused of it. Thirdly, Peter Lombard and Thomas Aquinas thought sins of malice to be the sin against the Holy Ghost, and sins of infirmity against the Father, and sins of ignorance against the Son. This opinion is false, because the sin against the Holy Ghost must be a sin of some certain blasphemy; but malice is no certain sin, but a general [sin], and it is not always a blasphemy. The six differences the Schoolmen make of the sin against the Holy Ghost are: first, envying of our brother’s grace: secondly, impugning the known truth: thirdly, desperation, fourthly, presumption: fifthly, obstinacy: sixthly, final impenitency.</p></blockquote>

<blockquote><p>Whatsoever sin we see in the world, let us pray, and not despair; for God is the God of mercy. But for the sin to death, which is resisting grace, and fighting against mercy, and open blaspheming of the Holy Ghost, affirming that Christ’s miracles are done in Beelzebub, and his doctrine to be of the Devil, I think that no Christian man, if he perceive it, can otherwise pray than as Paul prayed for Alexander the coppersmith (2 Timothy, the last), ‘that God would reward him according unto his works.’ They that go back again after they know the truth, and give themselves willingly to sin for to follow it, and persecute the doctrine of truth by profession to maintain falsehood for their glory and vantage, are remediless: as ye may see: Heb. 6 and 10. Balaam sinned so; the false prophets in the Old Testament sinned so; the Pharisees sinned so; Alexander sinned so; and now many sin so, following their pride and covetousness.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/william-tyndale.html">William Tyndale</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Expositions &amp; Notes on Sundry Portions of the Holy Scriptures</cite>, … (d. 1536; Cambridge: Parker Society, 1849), The Exposition of the First Epistle of St. John, on 1 Jn. 5:16-17, p. 212</span></figcaption>

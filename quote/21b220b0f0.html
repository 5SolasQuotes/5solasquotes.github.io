<main class="wrap"><figure class="quote" id="q-21b220b0f0" data-kw="">
<blockquote><p>8. It [the word ‘justify’] may moreover be considered either with respect to the eternal decree, or with respect to its temporal application, or with respect to its φανέρωσις [phanerōsis, manifestation] at that last and decisive day of δικαιοκρισία [dikaiokrisia, righteous judgment]. The first is the cause of the second and third; the second is the index of the first; the third is the plenary execution of both.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/friedrich-spanheim.html">Friedrich Spanheim</a></span><span class="wk"><span class="lbl">Work:</span> <cite>‘Disputation on the Justification of Man before God’ in Disputationum Theologicarum Miscellaneorum Pars Prima</cite>, (Geneva: Chouët, 1652)</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/judgment-and-the-final-state/the-last-judgment.html">The Last Judgment</a></span></div>

</figure><figure class="quote" id="q-ed34e8b466" data-kw="">
<blockquote><p>Properly speaking, Christ&#x27;s Resurrection is not the meritorious cause, but the efficient and exemplar cause of our resurrection.... And since, as was stated above (Reply to Objection 2), the primary cause of human resurrection is the Divine justice, from which Christ has &quot;the power of passing judgment, because He is the Son of Man&quot; (John 5:27); the efficient power of His Resurrection extends to the good and wicked alike, who are subject to His judgment.</p></blockquote>

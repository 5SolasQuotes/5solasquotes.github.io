<blockquote><p>§XIV… in the first moment of conversion, while the intellect is being illuminated, the will is being prepared, disposed, and changed, it behaves merely passively, with Scripture as witness. … Man, however, being illuminated, aided, and renewed by this grace of God through the Word, and from being unwilling made willing, under grace, with a free but attendant will, without injury to his free will, freely and actively complies with operating grace, and with resistance having been taken away, willingly cooperates and concurs, according to the vow of the Church, Cant. 1:3: “Draw me, we will run after thee.” To which can be referred that passage in Jer. 20:7: “Thou hast seduced me, O Lord, and I am seduced: thou art stronger than I, and thou hast prevailed.” For grace does not kill free will, but remakes it; does not abolish it, but cherishes it; does not take it away, but transfers it, according to Prosper and Bernard.</p></blockquote>

<blockquote><p>…our conversion itself. Which is to be considered two ways:

1. In actu primo [in the first act], as it is the work of God’s Spirit on us, renewing our corrupt nature, healing all vitions, infusing all virtuous inclinations into each faculty; by which Habitual infused qualities they are disposed to all spiritual and holy actions. This is the work of God by his preventing grace.

2. In actu secundo [in the second act], as it is our work converting ourselves to God in all holy operations of faith, love, and godly obedience, which acts we do by the help of God’s subsequent and assisting grace. Of conversion in both senses we are to enquire, how far it may be resisted and hindered: touching the first, namely, our habitual conversion in the infusion of all gracious habits, this conclusion is to be defended: That in our first conversion or sanctification we are merely passive and cannot by any act of ours either work it ourselves or bind God’s working of it. This is apparent by the Scriptures, which testify unto us what our state is before conversion, what the work of God is in our conversion: namely that we are dead in sins, Eph. 2:1; Col. 2:13; Mt. 8:22; Eph. 5:14, that we are blind and very darkness in regard of spiritual knowledge, Rev. 3:18; Eph. 4:17, 5:8; Mt. 6:23; Lk. 4:18; Jn. 1:5; Acts 26:18; 1 Cor. 2:14, that our hearts are stony, destitute of all sense and motions of goodness, Eze. 36:26, 11:19. Again, that God’s work in our conversion is a raising from the dead, Eph. 2:5; Col. 2:12; Rev. 20:6; Jn. 5:21, 25, a restoring of sight to the blind, Lk. 4:18, a new generation and birth of a man, Jn. 1:13; 3:3, another creation of him, Eph. 2:10; Ps. 51:12; 2 Cor. 5:17; Gal. 6:15. The giving of a new heart of flesh and taking away of the old stony heart, Eze. 11:19. Out of which and many the like places we conclude that a man can do no more in the effecting or hindering of his first conversion than the matter can do in regard of the form, to receive or reject it, no more than Adam’s body could resist the entrance of the soul into it or Lazarus’s carcass and the dead bones in Ezekiel could refuse the spirit of life’s coming into them, no more than an infant can hinder its own conception and birth or the world the creation of itself, no more than the bodies of those sick persons whom Christ cured by his word could hinder the restitution of health when Christ commanded them to be whole, or the eyes of the blind could nill the restoring of their sight, or the air that is dark can refuse to be enlightened: in brief, a man’s heart can no more hinder the work of God’s grace in changing it out of stone into flesh than the body of Lot’s wife could resist the force of his power in turning it out of flesh into a pillar of salt. Against this doctrine of man’s passiveness in his first conversion our adversaries object many things, qualifying the rigor of those censures the Scriptures give touching our utter disability, eluding their force by many subtle shifts, all devised only to this purpose, that our conversion may not be thought to be altogether of grace but shared between the grace of God and some power of our own. To allege and answer every cavil were a business of more length than difficulty: unto them all in general I answer that he that takes a man’s judgment touching man’s abilities, he follows the sentence of a blind corrupt judge and that in his own cause. It is the Lord that judges us and it becomes us to submit to his censure, not to extol ourselves when he abases us, lest we be found liers like those hypocritical Laodiceans, boasting that we are rich and increased with goods and have need of nothing when in the mean God knows though we know not, how that we are wretched, and miserable, and poor, and blind, and naked, standing in need of all things. Wherefore let this truth always stand firm, that as no man can prepare himself by any strength of his own effectually to work his sanctification, either alone by himself or as a coworker with the Spirit of grace, so no man can hinder the work of God’s Spirit when he intends to bestow this first grace of sanctification upon a sinner. This of habitual conversion in the internal renovation of all the faculties, which cannot be resisted or hindered: in the next place we are to consider of conversion as it is our act, consisting in the operations and exercises of all gracious habits infused, as when we actually believe, repent and do other good works. This active conversion is nothing but the practice of sanctification, when being made holy and good, we do good and holy works, as a man after he is raised from death or restored to health performs the actions of a living, of a healthy man. For that similitude of St. Austin’s is certain, Non ideo currit rota, ut sit rotunda, etc. as a wheel runs not that it may be round, but because it is round; so the will believes not that it may be regenerate, but because it is regenerate. And therefore that is an error of the coursest bran when our adversaries make the act of believing to go before our sanctification: whereas nothing is more certain than this, that all holy actions whether of faith or any other grace come from that common root of holiness infused into our souls… …there is a double beginning or cause of every gracious action in a man regenerate:

1. The Spirit of God by his exciting and cooperating grace.

2. Man himself renewed and sanctified in all his faculties. The former is termedprincipium a quo[the principle from which], the latter principium quod [the principle that]: man works, but he must be moved thereto and assisted by the Spirit of Grace: both together concur to the producing of every holy action. I say both together: for although man in his first conversion was merely passive, God’s Spirit working all without man’s help: yet man in performance of any holy act is not merely active, able to do all of himself without God’s help. No, he is partly passive, partly active: passive as he stands in need of God’s grace to stir up, guide, and strengthen the endeavor of each faculty in the doing of good: Active in as much as being thus helped by grace, himself willingly moves himself to every godly work. Now by reason of this concurrence of man with God, these operations of grace are properly called man’s work, not God’s work in man. So that when a regenerate man believes, this act though it be caused by Gods Spirit, yet it is done and exercised by Man voluntarily moving himself in that action, and therefore we say it is man that believes, not God’s Spirit that believes: as if the act of believing were wrought in man’s will by the Spirit of God in the same sort as jugglers work strange motions in their puppets, which seem to do wondrous feats, but tis an unseen hand that’s the cause of all. Such gross conceits should not have been devised by ingenuous minds and put upon so plain and clear doctrine as that is touching the concurrence of God’s grace with our strength in all holy actions whatsoever. The point is easy to him that will understand: Every good desire and good work is partly from man, because he wills it: he works it; but principally from God’s Spirit, because He makes man to will and to work it. Without which cooperating grace man by habitual inherent grace could do no good work at all, according to that of Christ, Jn. 15:5, ‘Without Me ye can do nothing,’ and of the apostle, Phil. 1:6, ‘He that hath begun the good work will also perform it;’ and again, Phil. 2:13, ‘It is God that worketh in you both the will and the deed, even of his good pleasure:’ and again, 1 Cor. 15:10, ‘I have labored more abundantly than they all, yet not I but the grace of God which is in me.’</p></blockquote>

l+ourselves+when+he+abases+us%2C+lest+we+be+found+liers+like+those+hypocritical+Laodiceans%2C+boasting+that+we+are+rich+and+increased+with+goods+and+have+need+of+nothing+when+in+the+mean+God+knows+though+we+know+not%2C+how+that+we+are+wretched%2C+and+miserable%2C+and+poor%2C+and+blind%2C+and+naked%2C+standing+in+need+of+all+things.+Wherefore+let+this+truth+always+stand+firm%2C+that+as+no+man+can+prepare+himself+by+any+strength+of+his+own+effectually+to+work+his+sanctification%2C+either+alone+by+himself+or+as+a+coworker+with+the+Spirit+of+grace%2C+so+no+man+can+hinder+the+work+of+God%E2%80%99s+Spirit+when+he+intends+to+bestow+this+first+grace+of+sanctification+upon+a+sinner.+This+of+habitual+conversion+in+the+internal+renovation+of+all+the+faculties%2C+which+cannot+be+resisted+or+hindered%3A+in+the+next+place+we+are+to+consider+of+conversion+as+it+is+our+act%2C+consisting+in+the+operations+and+exercises+of+all+gracious+habits+infused%2C+as+when+we+actually+believe%2C+repent+and+do+other+good+works.+This+active+conversion+is+nothing+but+the+practice+of+sanctification%2C+when+being+made+holy+and+good%2C+we+do+good+and+holy+works%2C+as+a+man+after+he+is+raised+from+death+or+restored+to+health+performs+the+actions+of+a+living%2C+of+a+healthy+man.+For+that+similitude+of+St.+Austin%E2%80%99s+is+certain%2C+Non+ideo+currit+rota%2C+ut+sit+rotunda%2C+etc.+as+a+wheel+runs+not+that+it+may+be+round%2C+but+because+it+is+round%3B+so+the+will+believes+not+that+it+may+be+regenerate%2C+but+because+it+is+regenerate.+And+therefore+that+is+an+error+of+the+coursest+bran+when+our+adversaries+make+the+act+of+believing+to+go+before+our+sanctification%3A+whereas+nothing+is+more+certain+than+this%2C+that+all+holy+actions+whether+of+faith+or+any+other+grace+come+from+that+common+root+of+holiness+infused+into+our+souls%E2%80%A6+%E2%80%A6there+is+a+double+beginning+or+cause+of+every+gracious+action+in+a+man+regenerate%3A+1.+The+Spirit+of+God+by+his+exciting+and+cooperating+grace.+2.+Man+himself+renewed+and+sanctified+in+all+his+faculties.+The+former+is+termedprincipium+a+quo%5Bthe+principle+from+which%5D%2C+the+latter+principium+quod+%5Bthe+principle+that%5D%3A+man+works%2C+but+he+must+be+moved+thereto+and+assisted+by+the+Spirit+of+Grace%3A+both+together+concur+to+the+producing+of+every+holy+action.+I+say+both+together%3A+for+although+man+in+his+first+conversion+was+merely+passive%2C+God%E2%80%99s+Spirit+working+all+without+man%E2%80%99s+help%3A+yet+man+in+performance+of+any+holy+act+is+not+merely+active%2C+able+to+do+all+of+himself+without+God%E2%80%99s+help.+No%2C+he+is+partly+passive%2C+partly+active%3A+passive+as+he+stands+in+need+of+God%E2%80%99s+grace+to+stir+up%2C+guide%2C+and+strengthen+the+endeavor+of+each+faculty+in+the+doing+of+good%3A+Active+in+as+much+as+being+thus+helped+by+grace%2C+himself+willingly+moves+himself+to+every+godly+work.+Now+by+reason+of+this+concurrence+of+man+with+God%2C+these+operations+of+grace+are+properly+called+man%E2%80%99s+work%2C+not+God%E2%80%99s+work+in+man.+So+that+when+a+regenerate+man+believes%2C+this+act+though+it+be+caused+by+Gods+Spirit%2C+yet+it+is+done+and+exercised+by+Man+voluntarily+moving+himself+in+that+action%2C+and+therefore+we+say+it+is+man+that+believes%2C+not+God%E2%80%99s+Spirit+that+believes%3A+as+if+the+act+of+believing+were+wrought+in+man%E2%80%99s+will+by+the+Spirit+of+God+in+the+same+sort+as+jugglers+work+strange+motions+in+their+puppets%2C+which+seem+to+do+wondrous+feats%2C+but+tis+an+unseen+hand+that%E2%80%99s+the+cause+of+all.+Such+gross+conceits+should+not+have+been+devised+by+ingenuous+minds+and+put+upon+so+plain+and+clear+doctrine+as+that+is+touching+the+concurrence+of+God%E2%80%99s+grace+with+our+strength+in+all+holy+actions+whatsoever.+The+point+is+easy+to+him+that+will+understand%3A+Every+good+desire+and+good+work+is+partly+from+man%2C+because+he+wills+it%3A+he+works+it%3B+but+principally+from+God%E2%80%99s+Spirit%2C+because+He+makes+man+to+will+and+to+work+it.+Without+which+cooperating+grace+man+by+habitual+inherent+grace+could+do+no+good+work+at+all%2C+according+to+that+of+Christ%2C+Jn.+15%3A5%2C+%E2%80%98Without+Me+ye+can+do+nothing%2C%E2%80%99+and+of+the+apostle%2C+Phil.+1%3A6%2C+%E2%80%98He+that+hath+begun+the+good+work+will+also+perform+it%3B%E2%80%99+and+again%2C+Phil.+2%3A13%2C+%E2%80%98It+is+God+that+worketh+in+you+both+the+will+and+the+deed%2C+even+of+his+good+pleasure%3A%E2%80%99+and+again%2C+1+Cor.+15%3A10%2C+%E2%80%98I+have+labored+more+abundantly+than+they+all%2C+yet+not+I+but+the+grace+of+God+which+is+in+me.%E2%80%99%E2%80%9D%0A%0A%E2%80%94+William+Pemble%2C+Vindici%C3%A6+grati%C3%A6.+%3D+A+Plea+for+Grace%2C+More+especially+the+Grace+of+Faith%2C+%E2%80%A6+%28London%3A+1627%29%2C+p.+144&amp;url=https%3A%2F%2F5solasquotes.github.io%2Fquote%2Ff25ff943b7.html&amp;via=5Solas" target="_blank" rel="noopener">Share on X</a><a class="perma" href="../quote/f25ff943b7.html">Permalink</a><a class="src" href="https://reformedbooksonline.com/only-the-initial-aspect-of-regeneration-is-by-the-lord-working-alone-man-being-wholly-passive-therein/#:~:text=our%20conversion%20itself.%20Which%20is%20to,of%20God%20which%20is%20in%20me&amp;text=our%20conversion%20itself.%20Which%20is%20to%20be%20considered&amp;text=the%20grace%20of%20God%20which%20is%20in%20me" rel="noopener" target="_blank">Read it online · Reformed Books Online</a></div>

<blockquote><p>XXIV. In this [third state] it is asked: Whether in man’s first conversion to God our will cooperates actively with divine grace by its natural and inherent faculty, or whether in first conversion it behaves passively such that at the first moment of conversion it does not contribute at all, but allows the power of willing well to be infused into itself. The Papists assert the former; we, with Scripture, the latter. XXV. Eze. 11:19: ‘I will take away the heart of stone and give a heart of flesh.’ 1 Cor. 12:3: ‘No one can say Jesus is Lord except through the Holy Spirit.’ Ps. ‘Create in me a clean heart, O Lord, and renew a right spirit within me.’ Jn. 6:44: ‘No one can come to me unless the Father who sent me draws him.’ Phil. 2:13: ‘God is the one who works both to will and to accomplish.’ And these things concern that third [state]; the fourth follows. XXVI. In which those renewed and made children of God, moved by the Holy Spirit, act, namely freely cooperating with divine grace: for since the new man is gradually restored, that is, that image of God lost in Adam is gradually brought back, there is no doubt that they then freely will and meditate on actions conforming to divine Law.</p></blockquote>

olly-passive-therein/#:~:text=XXIV.%20In%20this%20%5Bthird%20state%5D%20it,on%20actions%20conforming%20to%20divine%20Law&amp;text=XXIV.%20In%20this%20%5Bthird%20state%5D%20it%20is%20asked&amp;text=and%20meditate%20on%20actions%20conforming%20to%20divine%20Law" rel="noopener" target="_blank">Read it online · Reformed Books Online</a></div>

<blockquote><p>I know no orthodox divine in the world, that presumes to thrust in any work of man’s into the covenant of grace, as a condition, which, in the Arminian sense, he may or may not perform, according to the power and pleasure of his own free will, without the preventing or determining grace of God; which preventing grace is contained in those promises, Eze. 36:25–27, etc. Nor yet that there is any meritorious worth, either of condignity or congruity in the Popish sense, in the very justifying act of faith, for the which God justifies and saves us. But we say, That though God, in the way of preventing grace, works faith in us, and when it is so wrought, we need his assisting grace to act it, yet neither his assisting nor preventing grace makes the act of faith no more to be our act; it is we that believe still though in God’s strength, and that upon our believing, or not believing, we have or have not the benefits of God’s promises; which is the very proper notion of a condition.</p></blockquote>

<div class="actions"><button class="copy" data-copy="“I know no orthodox divine in the world, that presumes to thrust in any work of man’s into the covenant of grace, as a condition, which, in the Arminian sense, he may or may not perform, according to the power and pleasure of his own free will, without the preventing or determining grace of God; which preventing grace is contained in those promises, Eze. 36:25–27, etc. Nor yet that there is any meritorious worth, either of condignity or congruity in the Popish sense, in the very justifying act of faith, for the which God justifies and saves us. But we say, That though God, in the way of preventing grace, works faith in us, and when it is so wrought, we need his assisting grace to act it, yet neither his assisting nor preventing grace makes the act of faith no more to be our act; it is we that believe still though in God’s strength, and that upon our believing, or not believing, we have or have not the benefits of God’s promises; which is the very proper notion of a condition.”

— John Flavel, “John Flavel’s (1630–1691) Reply to Baptist Hyper-Calvinism from Vindiciæ Legis et Fœderis and the Issue of Conditions” from Vindiciæ Legis et Fœderis: Or, A Reply to Mr. Philip Cary’s Solemn Call (1690) in The Whole Works of the Rev. Mr. John Flavel, 6 vols. (London: Baynes &amp; Son, 1820), vol. 6, pp. 348–56 at Theological Meditations">Copy</button><a class="share" href="https://x.com/intent/post?text=%E2%80%9CI+know+no+orthodox+divine+in+the+world%2C+that+presumes+to+thrust+in+any+work+of+man%E2%80%99s+into+the+covenant+of+grace%2C+as+a+condition%2C+which%2C+in+the+Arminian+sense%2C+he+may+or+may+not+perform%2C+according+to+the+power+and+pleasure+of+his+own+free+will%2C+without+the+preventing+or+determining+grace+of+God%3B+which+preventing+grace+is+contained+in+those+promises%2C+Eze.+36%3A25%E2%80%9327%2C+etc.+Nor+yet+that+there+is+any+meritorious+worth%2C+either+of+condignity+or+congruity+in+the+Popish+sense%2C+in+the+very+justifying+act+of+faith%2C+for+the+which+God+justifies+and+saves+us.+But+we+say%2C+That+though+God%2C+in+the+way+of+preventing+grace%2C+works+faith+in+us%2C+and+when+it+is+so+wrought%2C+we+need+his+assisting+grace+to+act+it%2C+yet+neither+his+assisting+nor+preventing+grace+makes+the+act+of+faith+no+more+to+be+our+act%3B+it+is+we+that+believe+still+though+in+God%E2%80%99s+strength%2C+and+that+upon+our+believing%2C+or+not+believing%2C+we+have+or+have+not+the+benefits+of+God%E2%80%99s+promises%3B+which+is+the+very+proper+notion+of+a+condition.%E2%80%9D%0A%0A%E2%80%94+John+Flavel%2C+%E2%80%9CJohn+Flavel%E2%80%99s+%281630%E2%80%931691%29+Reply+to+Baptist+Hyper-Calvinism+from+Vindici%C3%A6+Legis+et+F%C5%93deris+and+the+Issue+of+Conditions%E2%80%9D+from+Vindici%C3%A6+Legis+et+F%C5%93deris%3A+Or%2C+A+Reply+to+Mr.+Philip+Cary%E2%80%99s+Solemn+Call+%281690%29+in+The+Whole+Works+of+the+Rev.+Mr.+John+Flavel%2C+6+vols.+%28London%3A+Baynes+%26+Son%2C+1820%29%2C+vol.+6%2C+pp.+348%E2%80%9356+at+Theological+Meditations&amp;url=https%3A%2F%2F5solasquotes.github.io%2Fquote%2F9a1c37103a.html&amp;via=5Solas" target="_blank" rel="noopener">Share on X</a><a class="perma" href="../quote/9a1c37103a.html">Permalink</a><a class="src" href="https://reformedbooksonline.com/only-the-initial-aspect-of-regeneration-is-by-the-lord-working-alone-man-being-wholly-passive-therein/#:~:text=I%20know%20no%20orthodox%20divine%20in,very%20proper%20notion%20of%20a%20condition&amp;text=I%20know%20no%20orthodox%20divine%20in%20the%20world&amp;text=is%20the%20very%20proper%20notion%20of%20a%20condition" rel="noopener" target="_blank">Read it online · Reformed Books Online</a></div>

<blockquote><p>2. I have also proven in the first part of this Dispute, that an Ecclesiastical constitution cannot bind us nor take away our liberty in the using or not using of a thing indifferent in itself, except some other reason be showed us than the bare authority of the Church.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/george-gillespie.html">George Gillespie</a></span><span class="wk"><span class="lbl">Work:</span> <cite>English Popish Ceremonies (1637), pt. 2, ch. 9</cite>, p. 50</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/worship/ceremonies-and-things-indifferent.html">Ceremonies and Things Indifferent</a></span></div>

</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-dbc05a79dd" data-kw="">
<blockquote><p>In the second member [of the verse] he betrays an evil conscience, or, at least, he shows that he handled rather a private business than any public cause, for he complains that the apostles will cause the priests and the scribes to be hated for the death of Christ. … Notwithstanding this is the principal point of the accusation, that they did not obey the commandment of the priests… But the chief priest does not consider what is his duty towards God and the Church; he abuses his authority tyrannously, as if the same were not under any laws, as the Pope deals with us at this day; for seeing that he takes to himself an unbridled authority and government, he fears not to condemn us for schismatics, so soon as he sees us refuse his decrees; for he catches at these sentences: “He which despiseth you despiseth me,” (Luke 10:16;) and thereupon he concludes that we will rebel against God. But if he will be heard as the ambassador of Christ, he must speak out of the mouth of Christ. Now, forasmuch as he does manifestly play the minister of Satan, he borrows authority, without shame and color, of the name of Christ; yea, the very form of speech which the chief priest uses doth prove how carelessly spiritual tyrants who usurp such authority and lordship as is not subject to the Word of God, dare grant liberty to themselves to attempt whatsoever pleases them. With a commandment (says he) have we commanded. Whence comes such strait rigor, save only because they think that all that must be received without exception which they shall command?</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/john-calvin.html">John Calvin</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Commentary on Acts</cite>, 5:28</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/worship/ceremonies-and-things-indifferent.html">Ceremonies and Things Indifferent</a></span></div>

bc05a79dd.html">Permalink</a><a class="src" href="https://reformedbooksonline.com/on-arbitrary-laws-commands/#:~:text=In%20the%20second%20member%20%5Bof%20the,without%20exception%20which%20they%20shall%20command&amp;text=In%20the%20second%20member%20%5Bof%20the%20verse%5D%20he&amp;text=be%20received%20without%20exception%20which%20they%20shall%20command" rel="noopener" target="_blank">Read it online · Reformed Books Online</a></div>
</figure><figure class="quote" id="q-aabe31c142" data-kw="">
<blockquote><p>The State of the controversy is: Whether private confession and absolution is necessary? Whether bowing of the knees and an uncovering of the head is at the mention of the name of Jesus has been commanded? and lastly, whether Latin songs may be allowed in public assemblies? The Lutherans affirm; we deny.</p></blockquote>

<div class="meta"><span class="t"><a href="../topics/worship/ceremonies-and-things-indifferent.html">Ceremonies and Things Indifferent</a></span></div>

</figure><figure class="quote" id="q-429dcffa50" data-kw="">
<blockquote><p>1. The furious clamors and persecutions of the Papists did not permit this reformation of ceremonies at the first: which were so violent and bloody, that it gave small or no leisure to the teachers and lights of the Church, neither was it safe for them to bend their care or cogitations this way. 2. The people were so drowned in the deep darkeness and idolatry of the Papacy that the amendment of ceremonies, and of external worship could not in those beginnings be undertaken. It was necessary to use doctrine, and to instruct the people of sundry and horrible errors, idolatry, superstitions and abuses, which the whole Papacy and Popish ceremonies have in their departure, that so all those ugly things might first be removed out of their minds, before they were removed from their sight. That which is not the work of one year, but a task of long season: For as ceremonies which are visible things and apprehended by the eyes do more affect and move than the invisible doctrine; So the people did closely stick to their accustomed ceremonies, and opposed themselves vehemently against the reformation of them: Even as we see at this day to come to pass, when as yet sound doctrine has prevailed and flourished for above these 80 years. 3. The Church in Popery was nothing else but a sick body: In which from the sole of the foot to the crown of the head, there was nothing sound and entire: Wherefore at the first beginning of reformation that whole chaos and abomination of error, and of Popish idolatry could not suddenly be perceived, but use and experience did daily manifest and teach every day more, than at the first.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/wilhelm-zepperus.html">Wilhelm Zepperus</a></span><span class="wk"><span class="lbl">Work:</span> <cite>On the Sacraments (Herborn, 1606), ch. 13, fol. 324-26, 328, as trans. by John Sprint, Cassander Anglicanus, showing the Necessity of Conformity to the Prescribed Ceremonies of our Church in Case of Deprivation (London: Bill, 1623), ‘Reformed Practices’, pp. 173-74 Zepper (1550-1607) was a German reformer.</cite></span></figcaption>
<div class="meta"><span class="t"><a href="../topics/worship/ceremonies-and-things-indifferent.html">Ceremonies and Things Indifferent</a></span></div>

</figure><figure class="quote" id="q-0e132c236f" data-kw="">
<blockquote><p>There was a certain Count of your [Reformed] confession who possessed common jurisdiction in a certain church with a certain Prince of our [Lutheran] religion. Therefore since the Associate was judging that he [the reformed Count] had more of right in that church, he made sure that the altar was destroyed and that a table be built [for the Lord’s Supper] in the temple [church building]. The Prince found out later about this, and ordered that the table be removed and an altar be constructed again. The Count in return took care a second time in return that the altar be destroyed, and the table restored. The Prince likewise a second time ordered that the table be taken away and the altar restored. I do not know whether this happened a third time. But the [reformed] Count later heeded the [Lutheran] Prince’s strictness, and left off from his course, such that the altar remained in the temple in place of the table.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/jacob-andreae.html">Jacob Andreae</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Lutheranism vs. Calvinism: The Classic Debate at the Colloquy of Montbeliard 1586 (Concordia Publishing House, 2017), ch. 4, ‘On the Reformation of Temples, Images &amp; Organs’, p. 497 Andreae (1528–1590) was a leading Lutheran theologian debating Theodore Beza.</cite></span></figcaption>

<main class="wrap"><figure class="quote" id="q-4041cf2e7b" data-kw="">
<blockquote><p>4. We are justified by works, and not by faith only; by which are meant the fruits of sanctification: for true faith and true holiness will show itself by good works; faith gives us the first right, but works continue it, for otherwise a course of sin would put us into a state of damnation again: therefore at the Last Judgment these are considered, Rev. 20:12, ‘And the dead were judged out of those things which were written in the books, according to their works.’ Mt. 25:35-36: ‘For I was an hungry, and ye gave me meat; I was thirsty, and ye gave me drink; I was a stranger, and ye took me in; naked, and ye cloathed me; I was sick, and ye visited me; I was in prison, and ye came unto me.’ Faith is our consent, but obedience verifies it, or is our performance of what we consented unto; the one as covenant-making, the other as covenant-keeping; we are admitted by covenant-making, but continued in our privileges by covenant-keeping, Ps. 25:10, ‘All the paths of the Lord are mercy and truth unto such as keep his Covenant.’</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/thomas-manton.html">Thomas Manton</a></span><span class="wk"><span class="lbl">Work:</span> <cite>A Second Volume of Sermons… (London: Astwood, 1684), Sermons on Rom. 8, Sermon 43, on Rom. 8:33</cite>, p. 336</span></figcaption>

</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-8abea0f166" data-kw="">
<blockquote><p>These are the two parts of justification; the first is grace revealed by Christ, in that by Him we have God appeased, so that sin can no longer accuse us, but our conscience is, through trust in the mercy of God, brought back to security: the other is the gift of the Holy Ghost, with his gifts, who illuminates us against the defilements of the flesh and the spirit.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/martin-luther.html">Martin Luther</a></span><span class="wk"><span class="lbl">Work:</span> <cite>in William Forbes, Considerationes Modestae et Pacificae Controversiarum de Justificatione... 4th ed. (d. 1634; 1658; Oxford: Parker, 1850), vol. 1, bk. 2, ch. 4</cite>, pp. 179-81</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/justification/twofold-justification.html">Twofold Justification and Its Increase</a></span></div>
<div class="actions"><button class="copy" data-copy="“These are the two parts of justification; the first is grace revealed by Christ, in that by Him we have God appeased, so that sin can no longer accuse us, but our conscience is, through trust in the mercy of God, brought back to security: the other is the gift of the Holy Ghost, with his gifts, who illuminates us against the defilements of the flesh and the spirit.”

— Martin Luther, in William Forbes, Considerationes Modestae et Pacificae Controversiarum de Justificatione... 4th ed. (d. 1634; 1658; Oxford: Parker, 1850), vol. 1, bk. 2, ch. 4, pp. 179-81">Copy</button><a class="share" href="https://x.com/intent/post?text=%E2%80%9CThese+are+the+two+parts+of+justification%3B+the+first+is+grace+revealed+by+Christ%2C+in+that+by+Him+we+have+God+appeased%2C+so+that+sin+can+no+longer+accuse+us%2C+but+our+conscience+is%2C+through+trust+in+the+mercy+of+God%2C+brought+back+to+security%3A+the+other+is+the+gift+of+the+Holy+Ghost%2C+with+his+gifts%2C+who+illuminates+us+against+the+defilements+of+the+flesh+and+the+spirit.%E2%80%9D%0A%0A%E2%80%94+Martin+Luther%2C+in+William+Forbes%2C+Considerationes+Modestae+et+Pacificae+Controversiarum+de+Justificatione...+4th+ed.+%28d.+1634%3B+1658%3B+Oxford%3A+Parker%2C+1850%29%2C+vol.+1%2C+bk.+2%2C+ch.+4%2C+pp.+179-81&amp;url=https%3A%2F%2F5solasquotes.github.io%2Fquote%2F8abea0f166.html&amp;via=5Solas" target="_blank" rel="noopener">Share on X</a><a class="perma" href="../quote/8abea0f166.html">Permalink</a><a class="src" href="https://reformedbooksonline.com/on-a-twofold-justification/#:~:text=These%20are%20the%20two%20parts%20of,of%20the%20flesh%20and%20the%20spirit." rel="noopener" target="_blank">Read it online · Reformed Books Online</a></div>
</figure><figure class="quote" id="q-237767f776" data-kw="">
<blockquote><p>Thesis 10. And it also follows from this that the word ‘to be justified’ in this argument in no way should be thus understood as if that righteousness of Christ were infused into us. Rather, it is thus declared that, having seized Christ Himself together with His righteousness by faith, we are absolved from all our sins and death, and through the one same Christ Himself we are declared worthy of eternal life in the one same Christ. But one also speaks of a wider meaning of the term ‘righteousness’, as about that most perfect, which is subjectively in Christ alone according to the flesh and which alone, imputed to us by faith, pacifies our consciences before the tribunal of God. This concerning holiness within us is applied and inchoate in another gift of God. Thus, if ‘justification’ is taken as the free application of the latter rather than the former benefit, Christ having been seized by faith, we do not deny that the term ‘justification’ is comprehended as much as that benefit of that imputed and most perfect righteousness as the benefit of sanctification inchoate in us is. Yet we say that careful and painstaking care must be applied in order that one may not be confounded with the other and that we may know that the part first in order pleases and is accepted by God on account of Christ and in Christ alone is seized by faith, and that second gift of regeneration follows later.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/theodore-beza.html">Theodore Beza</a></span><span class="wk"><span class="lbl">Work:</span> <cite>‘Theses Written Out in Full with the Unanimous Consent of the Pastors of the Swiss Churches by the Authority of the Very Distinguished Senate of Bern in the General Synod on AD April 23, 1588’ in Justification by Faith Alone: Selected Writings from Theodore Beza (1519-1605), Amandus Polanus (1561-1610), Francis Turretin (1623-1687), trans. Casey Carmichael in Classic Reformed Theology (RHB, 2023)</cite>, pp. 113-14</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/justification/twofold-justification.html">Twofold Justification and Its Increase</a></span></div>
<div class="actions"><button class="copy" data-copy="“Thesis 10. And it also follows from this that the word ‘to be justified’ in this argument in no way should be thus understood as if that righteousness of Christ were infused into us. Rather, it is thus declared that, having seized Christ Himself together with His righteousness by faith, we are absolved from all our sins and death, and through the one same Christ Himself we are declared worthy of eternal life in the one same Christ. But one also speaks of a wider meaning of the term ‘righteousness’, as about that most perfect, which is subjectively in Christ alone according to the flesh and which alone, imputed to us by faith, pacifies our consciences before the tribunal of God. This concerning holiness within us is applied and inchoate in another gift of God. Thus, if ‘justification’ is taken as the free application of the latter rather than the former benefit, Christ having been seized by faith, we do not deny that the term ‘justification’ is comprehended as much as that benefit of that imputed and most perfect righteousness as the benefit of sanctification inchoate in us is. Yet we say that careful and painstaking care must be applied in order that one may not be confounded with the other and that we may know that the part first in order pleases and is accepted by God on account of Christ and in Christ alone is seized by faith, and that second gift of regeneration follows later.”

%80%9D%0A%0A%E2%80%94+Theodore+Beza%2C+%E2%80%98Theses+Written+Out+in+Full+with+the+Unanimous+Consent+of+the+Pastors+of+the+Swiss+Churches+by+the+Authority+of+the+Very+Distinguished+Senate+of+Bern+in+the+General+Synod+on+AD+April+23%2C+1588%E2%80%99+in+Justification+by+Faith+Alone%3A+Selected+Writings+from+Theodore+Beza+%281519-1605%29%2C+Amandus+Polanus+%281561-1610%29%2C+Francis+Turretin+%281623-1687%29%2C+trans.+Casey+Carmichael+in+Classic+Reformed+Theology+%28RHB%2C+2023%29%2C+pp.+113-14&amp;url=https%3A%2F%2F5solasquotes.github.io%2Fquote%2F237767f776.html&amp;via=5Solas" target="_blank" rel="noopener">Share on X</a><a class="perma" href="../quote/237767f776.html">Permalink</a><a class="src" href="https://reformedbooksonline.com/on-a-twofold-justification/#:~:text=Thesis%2010.%20And%20it%20also%20follows,second%20gift%20of%20regeneration%20follows%20later." rel="noopener" target="_blank">Read it online · Reformed Books Online</a></div>
</figure><figure class="quote" id="q-4aec9552f5" data-kw="">
<blockquote><p>Which being attentively marked, shows plainly how the faith of true believers cannot be divorced from hope and love; how faith is a part of sanctification, and yet unto justification necessary; how faith is perfected by good works, and no work of ours without faith; finally, how our fathers might hold that we are justified by faith alone, and yet hold truly, that without works we are not justified.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/richard-hooker.html">Richard Hooker</a></span><span class="wk"><span class="lbl">Work:</span> <cite>A Learned Discourse of Justification, Works &amp; how the Foundation of Faith is Overthrown (d. 1600; Oxford: Barnes, 1612), pp. 26-27 The statement at the end regarding double justification appears to be a concession with respect to England’s Christian predecessors under Popery, not the proper view of Hooker, as made evident by the rest of Hooker’s book.</cite></span></figcaption>
<div class="meta"><span class="t"><a href="../topics/justification/twofold-justification.html">Twofold Justification and Its Increase</a></span></div>

</figure><figure class="quote" id="q-dc9dff461e" data-kw="">
<blockquote><p>The Discourse of Albertus Pighius… shall be once again repeated, both for its Worth and Truth…: ‘…God therefore does justify us by his free grace or goodness wherewith he embraces us in Christ Jesus, when he clothes us with his innocency and righteousness as we are ingrafted into Him; for as that alone is true and perfect which only can endure in the sight of God, so that alone ought to be presented and pleaded for us before the divine tribunal, as the advocate of, or plea in our cause; resting hereon, we here obtain the daily pardon of sin; with whose purity being covered, our filth and the uncleanness of our imperfections are not imputed unto us, but are covered as if they were buried, that they may not come into the Jugdment of God; until the old man being destroyed and slain in us, divine Goodness receives us into peace with the second Adam.&#x27;</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/john-owen.html">John Owen</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Doctrine of Justification by Faith… (London: Boulter, 1677)</cite></span></figcaption>
<div class="meta"><span class="t"><a href="../topics/justification/twofold-justification.html">Twofold Justification and Its Increase</a></span></div>

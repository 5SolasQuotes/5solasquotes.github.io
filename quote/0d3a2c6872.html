<main class="wrap"><figure class="quote" id="q-0d3a2c6872" data-kw="">
<blockquote><p>Therefore when we treat of the merit of Christ, we do not place the beginning in him, but we ascend to the ordination of God as the primary cause, because of his mere good pleasure he appointed a Mediator to purchase salvation for us. Hence the merit of Christ is inconsiderately opposed to the mercy of God.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/john-calvin.html">John Calvin</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Institutes of the Christian Religion</cite>, 2.17.1</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/priestly-office-satisfaction-and-atonement/efficacy.html">Priestly Office: Satisfaction and Atonement: Efficacy</a> › <a href="../topics/priestly-office-satisfaction-and-atonement/efficacy/christs-merit.html">Christ&#x27;s merit</a></span><span class="t"><a href="../topics/justification/meritorious-cause.html">Meritorious Cause</a> › <a href="../topics/justification/meritorious-cause/christs-satisfaction-and-merit.html">Christ’s satisfaction and merit</a></span></div>
<div class="actions"><button class="copy" data-copy="“Therefore when we treat of the merit of Christ, we do not place the beginning in him, but we ascend to the ordination of God as the primary cause, because of his mere good pleasure he appointed a Mediator to purchase salvation for us. Hence the merit of Christ is inconsiderately opposed to the mercy of God.”

— John Calvin, Institutes of the Christian Religion, 2.17.1">Copy</button><a class="share" href="https://x.com/intent/post?text=%E2%80%9CTherefore%20when%20we%20treat%20of%20the%20merit%20of%20Christ%2C%20we%20do%20not%20place%20the%20beginning%20in%20him%2C%20but%20we%20ascend%20to%20the%20ordination%20of%20God%20as%20the%20primary%20cause%2C%20because%20of%20his%20mere%20good%20pleasure%20he%20appointed%20a%20Mediator%20to%20purchase%20salvation%20for%20us.%20Hence%20the%20merit%20of%20Christ%20is%20inconsiderately%20opposed%20to%20the%20mercy%20of%20God.%E2%80%9D%0A%0A%E2%80%94%20John%20Calvin%2C%20Institutes%20of%20the%20Christian%20Religion%2C%202.17.1&amp;url=https%3A%2F%2F5solasquotes.github.io%2Fquote%2F0d3a2c6872.html&amp;via=5Solas" target="_blank" rel="noopener">Share on X</a><a class="perma" href="../quote/0d3a2c6872.html">Permalink</a><a class="src" href="https://ccel.org/ccel/calvin/institutes" rel="noopener" target="_blank">Read it online · CCEL</a></div>
</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-9696a1ee04" data-kw="">
<blockquote><p>Our works are meritorious from two causes: first, by virtue of the Divine motion; and thus we merit condignly; secondly, according as they proceed from free-will in so far as we do them willingly, and thus they have congruous merit, since it is congruous that when a man makes good use of his power God should by His super-excellent power work still higher things. And therefore it is clear that no one can merit condignly for another his first grace, save Christ alone. … But one may merit the first grace for another congruously; because a man in grace fulfils God&#x27;s will, and it is congruous and in harmony with friendship that God should fulfil man&#x27;s desire for the salvation of another.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/thomas-aquinas.html">Thomas Aquinas</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Summa Theologiae</cite>, I-II, q. 114, a. 6</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/priestly-office-satisfaction-and-atonement/efficacy.html">Priestly Office: Satisfaction and Atonement: Efficacy</a> › <a href="../topics/priestly-office-satisfaction-and-atonement/efficacy/christs-merit.html">Christ&#x27;s merit</a></span><span class="t"><a href="../topics/justification/merit-of-congruity-and-condignity.html">Merit of Congruity and Condignity</a> › <a href="../topics/justification/merit-of-congruity-and-condignity/merit-of-congruity.html">Merit of congruity (de congruo)</a></span><span class="t"><a href="../topics/good-works/merit-and-reward.html">Merit and Reward</a> › <a href="../topics/good-works/merit-and-reward/merit-of-condignity-and-congruity.html">Merit of condignity and congruity</a></span><span class="t"><a href="../topics/rome/justification.html">Rome: Justification</a> › <a href="../topics/rome/justification/merit.html">Merit</a></span></div>
<div class="actions"><button class="copy" data-copy="“Our works are meritorious from two causes: first, by virtue of the Divine motion; and thus we merit condignly; secondly, according as they proceed from free-will in so far as we do them willingly, and thus they have congruous merit, since it is congruous that when a man makes good use of his power God should by His super-excellent power work still higher things. And therefore it is clear that no one can merit condignly for another his first grace, save Christ alone. … But one may merit the first grace for another congruously; because a man in grace fulfils God&#x27;s will, and it is congruous and in harmony with friendship that God should fulfil man&#x27;s desire for the salvation of another.”

</figure><figure class="quote" id="q-eaed42d1dd" data-kw="">
<blockquote><p>What then is our foundation in Christ? Is it that he begins salvation and leaves us to complete it? Is it that he only opened up the way, and left us to follow it in our own strength? By no means, but as Paul had a little before declared, it is to acknowledge that he has been given us for righteousness. … in short, all things of his are ours, we have all things in him, he nothing in us.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/john-calvin.html">John Calvin</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Institutes of the Christian Religion</cite>, 3.15.5</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/priestly-office-satisfaction-and-atonement/efficacy.html">Priestly Office: Satisfaction and Atonement: Efficacy</a> › <a href="../topics/priestly-office-satisfaction-and-atonement/efficacy/christs-merit.html">Christ&#x27;s merit</a></span><span class="t"><a href="../topics/justification/meritorious-cause.html">Meritorious Cause</a> › <a href="../topics/justification/meritorious-cause/christs-satisfaction-and-merit.html">Christ’s satisfaction and merit</a></span></div>
<div class="actions"><button class="copy" data-copy="“What then is our foundation in Christ? Is it that he begins salvation and leaves us to complete it? Is it that he only opened up the way, and left us to follow it in our own strength? By no means, but as Paul had a little before declared, it is to acknowledge that he has been given us for righteousness. … in short, all things of his are ours, we have all things in him, he nothing in us.”

— John Calvin, Institutes of the Christian Religion, 3.15.5">Copy</button><a class="share" href="https://x.com/intent/post?text=%E2%80%9CWhat%20then%20is%20our%20foundation%20in%20Christ%3F%20Is%20it%20that%20he%20begins%20salvation%20and%20leaves%20us%20to%20complete%20it%3F%20Is%20it%20that%20he%20only%20opened%20up%20the%20way%2C%20and%20left%20us%20to%20follow%20it%20in%20our%20own%20strength%3F%20By%20no%20means%2C%20but%20as%20Paul%20had%20a%20little%20before%20declared%2C%20it%20is%20to%20acknowledge%20that%20he%20has%20been%20given%20us%20for%20righteousness.%20%E2%80%A6%20in%20short%2C%20all%20things%20of%20his%20are%20ours%2C%20we%20have%20all%20things%20in%20him%2C%20he%20nothing%20in%20us.%E2%80%9D%0A%0A%E2%80%94%20John%20Calvin%2C%20Institutes%20of%20the%20Christian%20Religion%2C%203.15.5&amp;url=https%3A%2F%2F5solasquotes.github.io%2Fquote%2Feaed42d1dd.html&amp;via=5Solas" target="_blank" rel="noopener">Share on X</a><a class="perma" href="../quote/eaed42d1dd.html">Permalink</a><a class="src" href="https://ccel.org/ccel/calvin/institutes" rel="noopener" target="_blank">Read it online · CCEL</a></div>
</figure><figure class="quote" id="q-9eb8b9784d" data-kw="">
<blockquote><p>Seventhly, our merits depend on the merits of Christ, both because he merited for us the power of meriting, and because we merit as living members of Christ, and through the influence which we receive from him as from our head. Therefore it detracts from the glory of Christ if our merits are so imperfect that they are not merits ex condigno except by reason of God&#x27;s acceptance.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/robert-bellarmine.html">Robert Bellarmine</a></span><span class="wk"><span class="lbl">Work:</span> <cite>De Justificatione</cite>, 5.17 (translated from the Latin)</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/priestly-office-satisfaction-and-atonement/efficacy.html">Priestly Office: Satisfaction and Atonement: Efficacy</a> › <a href="../topics/priestly-office-satisfaction-and-atonement/efficacy/christs-merit.html">Christ&#x27;s merit</a></span><span class="t"><a href="../topics/good-works/merit-and-reward.html">Merit and Reward</a> › <a href="../topics/good-works/merit-and-reward/merit-of-condignity-and-congruity.html">Merit of condignity and congruity</a></span><span class="t"><a href="../topics/rome/justification.html">Rome: Justification</a> › <a href="../topics/rome/justification/merit.html">Merit</a></span></div>

</figure><figure class="quote" id="q-5f83191034" data-kw="definite atonement elect">
<blockquote><p>The common opinion of the Reformed is that Christ (from the mere good-pleasure of the Father) was appointed and given as a Redeemer and head, not to all men, but to a certain number of men. By the election of God, these compose his mystical body. For these alone, Christ (perfectly acquainted with his call) in order to fulfill the decree of election and the counsel of the Father, was willing and determined to die; also to add to the infinite price of his death a most efficacious and special intention to substitute himself in their place and to acquire faith and salvation for them.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/francis-turretin.html">Francis Turretin</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Institutes of Elenctic Theology</cite>, 14.14.8</span></figcaption>

<blockquote><p>As they have done and suffered much for vindicating and maintaining the liberty of their Religion, that what belongeth unto God may be rendered unto God; So do they desire, that according to the rule of righteousness, each man have his own, and above all men, That the things which are Caesar’s be rendered unto him, and to give him that which is God’s were a wronging both of God and Caesar. They have ever been willing to taxes and to pay subsidies above that which they were able. They join with the inward reverence of their hearts, external honour and obedience in all things lawful.

They pour forth their prayers to God in private and public, for all blessings spiritual and temporal upon his Royal Person and Government, and upon his Progeny; and for the same blessings upon the Queen’s Majesty, especially that God by his Spirit would give unto her the knowledge and love of the truth. They long for her conversion as an happiness to herself, and a means of great happiness to the King, to their Children, and to all their Subjects.

And, that the Lord may answer their prayers, they think it incumbent to the Church of England, nor can any bond whatsoever oblige them to the contrary, to use the best and most powerful means, and would most willingly in all humility, love and respect, join their endeavours for that blessed end. And as they thus present their best desires and prayers, so are they ready to sacrifice their lives to God for his Majesty’s good, and in their hearts are grieved that their loyalty, which they account their no small glory, should have been called in question.

Neither is this all. But moreover they do acknowledge that his Majesty, as supreme Magistrate, hath not only charge over the Common-wealth, but doth watch and hath inspection over the Church and Church matters, but in a civil way. Vos Episcopi in Ecclesia (saith Constantine) Ego extra Ecclesiam Episcopus à Deo constitutus sum. And therefore that he is, by his high calling and place, Custos utrius{que} tabulae, to command the precepts of the first table as well as of the second table to be obeyed: That he is Vindex Religionis by his sword, as the Spirit of God in Scripture is Iudex, and the Church is Index: That he hath power to turn the constitutions of the Church into Laws, and to confirm them by the civil sanction in Parliament: That he may constrain all his subjects to do duty in matters of religion, and may punish the transgressors: That when debates arise about Religion, he hath power to call the Assemblies of the Church, to be present and civilly preside in them, and to examine their constitutions, that he may discern of them both as a Christian caring for his own soul, and as supreme Magistrate watching over his people: and that he may do all things which can prove him to be a kind and careful nursing Father.

They account all that is vomited out to the contrary, [as, that they liked Anarchy better then Monarchy, and that they would turn a Kingdom into a democracy,] to be but the fictions and calumnies of the malicious enemies of God and his truth; not unlike the lies which were devised against the Christians of old: their consciences, their words, writings, and actions, even then when the world did put the worst constructions upon them, were witnesses of the integrity of their hearts.

They do still hold that there can be no antipathy betwixt one ordinance of God and another. By him Princes do reign, and he hath also appointed the Officers and Government of his own house. They do desire nothing more then that the Son of God may reign, and that with and under the Son of God, the King may command, and they, as good subjects to Christ and the King, may obey.</p></blockquote>

<blockquote><p>It was made very clear, however, by other statutes on this subject, that when actual murder had been committed, no advantage was to accrue to the perpetrator from the cities of refuge; though he might have fled thither, he was, on the proof of his guilt, to be delivered up to the Goel for summary execution. Nor was the altar of God – a still more sacred place than the cities of refuge, and in ancient times almost universally regarded as an asylum for criminals – to be permitted in such cases to afford protection; from this also the murderer was to be dragged to his deserved doom. In short, deliberate murder was to admit of no compromise and no palliation: the original law, ‘whoso sheddest man’s blood by man shall his blood be shed,’ must be rigorously enforced; and, doubtless, mainly also on the original ground, ‘because in the image of God made He him.’

To disregard the sanctity of human life, and tread it vilely in the dust, was like aiming a thrust at God Himself, disparaging His noblest work in creation, and the one that stood in peculiar relationship to His own spiritual being. Therefore, the violation of the sixth command by deliberate murder involved also a kind of secondary violation of the first; and to suffer the blood of the innocent to lie unavenged, was, in the highest sense, to pollute the land; it was to render it unworthy of the name of God’s inheritance.

So great was the horror entertained of this unnatural crime, and so anxious was the Lawgiver to impress men with the feeling of its contrariety to the whole spirit and object of the law, that, even in the case of an uncertain murder, there was a cry of blood which could not be disregarded; and when every effort had failed to discover the author of the deed, the elders of the city which lay nearest to the corpse were to regard themselves as in a manner implicated; they had to come publicly forward, and not only protest their innocence of the crime, and their ignorance of the manner in which it had been committed, but also to go through a process of purification by blood and water, that the charge of blood-guiltiness might not rest upon them and their land.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/patrick-fairbairn.html">Patrick Fairbairn</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Revelation of Law in Scripture: Considered with respect both to its own Nature, and to its Relative Place in Successive Dispensations. The Third Series of the ‘Cunningham Lectures’</cite>, (Edinburgh: T. &amp; T. Clark, 1869), pp 110-12.</span></figcaption>

<blockquote><p>First, that the setting up of Christ to be King is the greatest, the most desirable good that ever can betide any Nation.

Secondly, that the concurrence of Nobles and Commons, and Soldiers, and Ministers, and Citizens to this work; their concurrence I say in this work, is the most glorious, the most amiable, the most desirable means of attaining this great good that any soul can wish; and if both these be manifested, that the one is the greatest, and the other the most desirable means to attain it; where these two things meet there must needs be matter of great you.</p></blockquote>

<blockquote><p>Neither are Kings and Princes blameless in this case of Famine, who though their charge be to provide for the good of the people, yet they utterly neglect them, rather impoverishing their subjects, yea, even in the dearest years, burthening them with taxes and subsidies: the Court is costly, and will be gallant: horses, hounds, hawks, harlots, jesters, must be maintained, who wrings for it? the poor subject, who must rather be undone, then the Court should want: from whence followeth this inconvenience, that the people being thus exhausted, and drunk up by these sucking subsidies and exactions, many of them become desperate, and utterly neglect their family at home, and setting the Hare’s head to the Goose gibbets, and all that they have at a mumme [sic] chance, will rather loosely misspend it themselves, then thus to be made sponges, and that which they have to be squeezed from them by crushing Courtiers.</p></blockquote>

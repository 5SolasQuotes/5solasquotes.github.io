<main class="wrap"><figure class="quote" id="q-e2b4a0e89f" data-kw="order of decrees">
<blockquote><p>Although in the decrees (considered formally on the part of God), order cannot properly be attended to (because they are not many and divided acts, but one only and a most simple act by which he from eternity decreed all things), yet there is no objection to ascribing a certain order to them. As they are considered objectively and on our part … some order must necessarily be conceived in them.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/francis-turretin.html">Francis Turretin</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Institutes of Elenctic Theology</cite>, 4.18.2</span></figcaption>

</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-efeb675893" data-kw="liberty of decree">
<blockquote><p>The liberty of the divine decree does not hinder it from being God himself because it is free only terminatively and on the part of the thing, but not subjectively and on the part of God. It is free in the exercised act inasmuch as it resides in the liberty of God to decree this or that thing. It is not free in the signified act because to decree anything depends upon the internal constitution of God by which he understands and wills.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/francis-turretin.html">Francis Turretin</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Institutes of Elenctic Theology</cite>, 4.1.13</span></figcaption>

</figure><figure class="quote" id="q-f79e188641" data-kw="Stoical fate necessity">
<blockquote><p>As if we introduced a fatal and Stoical necessity; as if we would extinguish all religion in the minds of men by it, to soothe them on the bed of security and profanity or hurl them into the abyss of despair; as if we made God cruel, hypocritical and the author of sin—I shudder to relate it. Now as all these things are perfectly false, they ought unquestionably to be refuted by a sober and healthy exhibition of this doctrine from the word of God.</p></blockquote>

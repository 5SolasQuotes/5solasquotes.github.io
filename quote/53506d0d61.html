<main class="wrap"><figure class="quote" id="q-53506d0d61" data-kw="">
<blockquote><p>There is no rational creature which doth not set some one thing or other before its eyes as its main end and chief good; and according to the various predominants in sensual and mad men, are their various main ends. Hence is that there did result so many different opinions among heathen philosophers about man’s chief good. But here is the great mistake with foolish vain men, that whatever they seek after, it is but few who bend toward the true chief good, which is God himself.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/james-renwick.html">James Renwick</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Letter to the Honourable Societies of Strangers at Lewarden, in Friesland, 18 February 1686 in Thomas Houston (ed.), Spiritual Support and Consolation in Difficult Times: The Letters of the Rev. James Renwick (1865) in Works Doctrinal and Practical of the Rev. Thomas Houston, D.D. (4 vols, Edinburgh</cite></span></figcaption>
<div class="meta"><span class="t"><a href="../topics/worship.html">Worship</a></span></div>

</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-10c07668ac" data-kw="">
<blockquote><p>47. Yet because the lifting up of the heart to God is together required, Simul &amp; consequenter, and going along with the thing that is sung, and it is also the end of that meditation; therefore we are said to sing in our heart to the Lord, Col. 3:16, and psalms that are sung have the consideration of prayers.

48. But because this religious melody hath the respect of prayers, therefore it is not so fit that the Decalogue, and other such like, which do not partake the nature of prayer, be turned into meter and be sung instead of psalms. … 53. But in the melody of singing, because it tendeth to our mutual edification, attention, and stirring up of pious affections among us one toward another, Col. 3:16, therefore all do join their voices together, 1. Chron. 16:35; Mk. 14:26.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/william-ames.html">William Ames</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Marrow of Sacred Divinity Drawn out of the Holy Scriptures, and the Interpreters thereof, and brought into Method</cite>, (London: 1642), Book 2, ch. 9, ‘Of Prayer’, p. 284</span></figcaption>

</figure><figure class="quote" id="q-3c59836fcd" data-kw="">
<blockquote><p>Men, under the pretense of curing the defects and shortcomings, the nakedness and bareness, attaching to ecclesiastical arrangements as set before us in the New Testament, have been constantly proposing innovations and improvements in government and worship. The question is, How ought these proposals to have been received? Our answer is, There is a great general scriptural principle which shuts them all out. We refuse even to enter into the consideration of what is alleged in support of them. It is enough for us that they have no positive sanction from Scripture.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/william-cunningham.html">William Cunningham</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Reformers &amp; the Theology of the Reformation</cite>, (Edinburgh, Scotland: Banner of Truth, 1989 reprint), p. 36</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/worship/nature-of-worship.html">Nature of Worship</a></span></div>

</figure><figure class="quote" id="q-c003f2e045" data-kw="">
<blockquote><p>Again, your subjoined text of Scripture [to your book], ‘If the Lord be God, follow Him; but if Baal’—for what purpose was it set there? What? to signify that the God of the dissenters and of the Established Church differ as the living God and Baal?… It was uncharitable. Uncharitable? That is a trifle in comparison; it was profane and most impious wit: yet you are mighty fond of the conceit and we have it over and over in the book that the conformists and dissenters serve two Gods—as the one of them is miscalled—and have two religions!… and, for aught appears you intend, in most of them [established churches], you blaspheme as a senseless idol—rebuke, and forgive you!</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/john-howe.html">John Howe</a></span><span class="wk"><span class="lbl">Work:</span> <cite>‘Some Consideration of a Preface to an Inquiry Concerning the Occasional Conformity of Dissenters, etc.’ in The Works of John Howe</cite>, vol. 5, Containing the Treatises: On Divine Prescience and the Trinity… (d. 1705; Religious Tract Society, 1863), p. 284</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/worship/impurities-in-worship.html">Impurities in Worship</a></span></div>
<div class="actions"><button class="copy" data-copy="“Again, your subjoined text of Scripture [to your book], ‘If the Lord be God, follow Him; but if Baal’—for what purpose was it set there? What? to signify that the God of the dissenters and of the Established Church differ as the living God and Baal?… It was uncharitable. Uncharitable? That is a trifle in comparison; it was profane and most impious wit: yet you are mighty fond of the conceit and we have it over and over in the book that the conformists and dissenters serve two Gods—as the one of them is miscalled—and have two religions!… and, for aught appears you intend, in most of them [established churches], you blaspheme as a senseless idol—rebuke, and forgive you!”

— John Howe, ‘Some Consideration of a Preface to an Inquiry Concerning the Occasional Conformity of Dissenters, etc.’ in The Works of John Howe, vol. 5, Containing the Treatises: On Divine Prescience and the Trinity… (d. 1705; Religious Tract Society, 1863), p. 284">Copy</button><a class="share" href="https://x.com/intent/post?text=%E2%80%9CAgain%2C+your+subjoined+text+of+Scripture+%5Bto+your+book%5D%2C+%E2%80%98If+the+Lord+be+God%2C+follow+Him%3B+but+if+Baal%E2%80%99%E2%80%94for+what+purpose+was+it+set+there%3F+What%3F+to+signify+that+the+God+of+the+dissenters+and+of+the+Established+Church+differ+as+the+living+God+and+Baal%3F%E2%80%A6+It+was+uncharitable.+Uncharitable%3F+That+is+a+trifle+in+comparison%3B+it+was+profane+and+most+impious+wit%3A+yet+you+are+mighty+fond+of+the+conceit+and+we+have+it+over+and+over+in+the+book+that+the+conformists+and+dissenters+serve+two+Gods%E2%80%94as+the+one+of+them+is+miscalled%E2%80%94and+have+two+religions%21%E2%80%A6+and%2C+for+aught+appears+you+intend%2C+in+most+of+them+%5Bestablished+churches%5D%2C+you+blaspheme+as+a+senseless+idol%E2%80%94rebuke%2C+and+forgive+you%21%E2%80%9D%0A%0A%E2%80%94+John+Howe%2C+%E2%80%98Some+Consideration+of+a+Preface+to+an+Inquiry+Concerning+the+Occasional+Conformity+of+Dissenters%2C+etc.%E2%80%99+in+The+Works+of+John+Howe%2C+vol.+5%2C+Containing+the+Treatises%3A+On+Divine+Prescience+and+the+Trinity%E2%80%A6+%28d.+1705%3B+Religious+Tract+Society%2C+1863%29%2C+p.+284&amp;url=https%3A%2F%2F5solasquotes.github.io%2Fquote%2Fc003f2e045.html&amp;via=5Solas" target="_blank" rel="noopener">Share on X</a><a class="perma" href="../quote/c003f2e045.html">Permalink</a><a class="src" href="https://reformedbooksonline.com/on-impurities-in-worship/#:~:text=Again%2C%20your%20subjoined%20text%20of%20Scripture,a%20senseless%20idol%E2%80%94rebuke%2C%20and%20forgive%20you&amp;text=Again%2C%20your%20subjoined%20text%20of%20Scripture%20%5Bto%20your&amp;text=blaspheme%20as%20a%20senseless%20idol%E2%80%94rebuke%2C%20and%20f </figure><figure class="quote" id="q-599b291261" data-kw="">

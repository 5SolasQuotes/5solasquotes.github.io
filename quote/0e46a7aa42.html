<main class="wrap"><figure class="quote" id="q-0e46a7aa42" data-kw="">
<blockquote><p>But if they [the Resolutioners] will extend it [the ordination vows] further, and say that it is meaned of absolute subjection to the sentence of his brethren, whether he have offended or not, they may as well, and with more color of reason, say that he is bound by his oath, not only to give subjection, but also obedience† to all their admonitions, whether just or unjust, lawful or unlawful; because there is no express limitation in the words of the oath, these qualifications, being as we said before, amongst the praecognita [assumptions] and praesupposita [presuppositions] of all such questions and answers, and there being no need to express them, except where there are grounds of jealousy.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/james-guthrie.html">James Guthrie</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Protesters no Subverters, and presbyterie no papacie; or, A vindication of the protesting brethren, and of the government of the kirk of Scotland from the aspersions unjustly cast upon them</cite>, … (1658), p. 60</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/the-church/schism-and-separation.html">Schism and Separation</a></span><span class="t"><a href="../topics/civil-government-and-society/natural-law-and-civil-law.html">Natural Law and Civil Law</a></span><span class="t"><a href="../topics/worship/oaths-and-vows.html">Oaths and Vows</a></span></div>

</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-672cdeeb5e" data-kw="">
<blockquote><p>When the prelates were brought in upon them, ministers were then bound to keep possession of their rights so long as they could, by meeting in the judicatories, there being no restraint laid upon them by law from speaking their mind freely, and protesting as they saw occasion. they were in a capacity to do some things for vindicating Church-privileges, at least for exonering their own consciences; yea, and for curbing in a great part the prelates’ power.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/john-currie.html">John Currie</a></span><span class="wk"><span class="lbl">Work:</span> <cite>An Essay on Separation: or a Vindication of the Church of Scotland contra the Seceders</cite></span></figcaption>

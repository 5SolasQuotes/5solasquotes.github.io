<main class="wrap"><figure class="quote" id="q-2a0c39a651" data-kw="">
<blockquote><p>Because we are justified solely because of the righteousness of Christ, our role in justification is not to obey but to have faith in Christ… When we seek to justify ourselves by human effort of any kind, we undermine the sufficiency of Christ’s atoning work. Only justification by faith alone preserves the honor and glory of what Jesus did on the cross.</p></blockquote>
<figcaption>— <a href="../authors/jay-harvey.html">Jay Harvey</a>, <cite>Don’t Call it a Comeback</cite>, p. 100</figcaption>

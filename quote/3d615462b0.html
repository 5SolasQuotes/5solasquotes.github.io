<blockquote><p>Men perish by their own will, but against God’s will; I mean his antecedent will, and as revealed in his Word. For else men perish by God’s consequent will, having rejected the means of their own salvation.</p></blockquote>

</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-6255e86111" data-kw="">
<blockquote><p>God’s call sometimes is ineffectual, and sometimes effectual. So the same apostle plainly declares in 1 Thess. 2:13: “For this cause also thank we God, which effectually works also in you that believe.” Observe that it is the work of God’s Spirit in the heart, superadded to the Word of the Gospel, as spoken by men, that makes any call effectual. Without this inward work, God may call, and the soul will never answer… It is this effectual work of God’s Spirit, in regenerating the soul by infusing of habits of grace, which distinguishes an internal effectual call of God form a mere external and ineffectual one… The text makes sure that it might be known whether or not God has so called you by His Word, as that also He has worked in you by His Spirit; whether God has illuminated your understanding, and inclined your will, so that you have complied with God’s will, and have answered His call. Whether, when God drew you, you ran after Him (Cant. 1:4); whether, when God entreated and persuaded you to be reconciled to Him you consented (2 Cor. 5:20); whether, when He wooed you, He also won you; whether, when He invited you to the wedding supper of His Son, you made no excuse or delay, but accepted, and welcomed the offer of the Gospel with faith and love (Luke 14:18). All which if you did do, it arose from the power of an inward call, being superadded to the outward call of the Word…</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/richard-fairclough.html">Richard Fairclough</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Puritan Sermons, vol. 6, ‘The Papal Doctrine In Denying The Possibility Of Assurance Is False, And Has A Dangerous Tendency To Destroy The True Place And Comfort Of Souls In The Certain Hopes Of Everlasting Happiness. – 2 Peter 1:10’</cite>, p. 377-78</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/attributes-of-god/will-of-god.html">Will of God</a></span></div>

</figure><figure class="quote" id="q-fa4d387437" data-kw="">
<blockquote><p>XVIII. God by his antecedent will decreed to bestow faith and grace on us, which by his consequent will He resolved to deny us; his former will was moved by his own goodness, but his latter will was provoked by our wickedness: if we have unjustly rejected the grace which by his former will He resolved to give us, may not He justly by his latter will deny that grace, which was rejected so perversely by us. Lord, if thou art resolved by thy first will to bestow grace on me, let me not by my disobedience provoke thy second will to deny that grace unto me. XIX. Our wickedness is the cause that moves God to exercise his acts of justice; but his own bounty is the cause, and our misery the occasion, why He exercises his acts of mercy…</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/alexander-ross.html">Alexander Ross</a></span><span class="wk"><span class="lbl">Work:</span> <cite>A Century of Divine Meditations upon Predestination… (London: Young, 1646), pp. 15-16, 19, 21-23, 89-92 Ross (c. 1590–1654) was a Scottish minister and chaplain-in-ordinary to King Charles I. He was not the Aberdeen doctor of the same name.</cite></span></figcaption>
<div class="meta"><span class="t"><a href="../topics/attributes-of-god/will-of-god.html">Will of God</a></span></div>

Reformed Books Online</a></div>
</figure><figure class="quote" id="q-e449def23e" data-kw="">
<blockquote><p>He who is just could not have commanded anything impossible, nor is a man condemned for that which he could not avoid, for He is pious.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/jean-baptiste-gonet.html">Jean Baptiste Gonet</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Shield of Thomistic Theology, 5 vols. 10th ed. (1667; Antwerp: Pitteri, 1744), vol. 1, tract 4, On the Will of God &amp; his Providence, disp. 4, Antecedent &amp; Consequent Will of God tr. AI by The Faith Received | 110. The conclusion is therefore proven lastly by another fundamental reason. By the very fact that God, through an antecedent will, ordains men to salvation and a supernatural end, He obliges them to observe the supernatural precepts, which are the necessary means for its attainment: according to that saying of Christ, “If you wish to enter into life, keep the commandments.” But man cannot be obliged to the observance of supernatural precepts without sufficient aids: Therefore, God, through an antecedent will, prepares sufficient aids for men. The major premise is evident; the minor is proven: | Man cannot be obliged to the impossible: But the observance of supernatural precepts, without supernatural aid, at least sufficient, is impossible: Therefore, such aid being excluded, he cannot be obliged to it: The major premise is established from the Council of Trent (sess. 6, chap. 11), where it is said that God does not command impossibilities; and from Augustine (de natura &amp; gratia, chap. 69), saying: “It is most firmly believed that God, being just and good, could not have commanded impossibilities.” And in Sermon 16 de tempore: “We execrate the blasphemy of those who say that anything impossible has been commanded by God.” And in Sermon 6:</cite></span></figcaption>
<div class="meta"><span class="t"><a href="../topics/attributes-of-god/will-of-god.html">Will of God</a></span></div>

<blockquote><p>Christ therefore as God willed and approved the gathering of the Jerusalemites to Himself and their obedience as a thing so intensely dear to Him and morally pleasing, as is the care of a hen for her chicks, which she cherishes and nourishes by the expansion of her wings, although the Jerusalemites held that blandishing invitation of the Savior as cheap; meanwhile He denied to the same the grace which would have most sweetly procured their most free obedience, with liberty unimpaired, which is an invincible argument that God decreed that their obedience should never exist.</p></blockquote>

<div class="meta"><span class="t"><a href="../topics/attributes-of-god/will-of-god.html">Will of God</a></span></div>
<div class="actions"><button class="copy" data-copy="“Christ therefore as God willed and approved the gathering of the Jerusalemites to Himself and their obedience as a thing so intensely dear to Him and morally pleasing, as is the care of a hen for her chicks, which she cherishes and nourishes by the expansion of her wings, although the Jerusalemites held that blandishing invitation of the Savior as cheap; meanwhile He denied to the same the grace which would have most sweetly procured their most free obedience, with liberty unimpaired, which is an invincible argument that God decreed that their obedience should never exist.”

<main class="wrap"><figure class="quote" id="q-cde84f7fbd" data-kw="">
<blockquote><p>For my part I have often truly professed, that I look at many liturgies which I have read as I do at the prayers of some honest men who use little method, nor very meet words and often toss God’s name through weakness; who put that last which should be first, and that first which should be last, but yet the matter is honest and good. I would not prefer such a man in a congregation before an abler man who will speak more composedly and agreeable to the matter: But yet I would not be so peevish as utterly to refuse to join with such a one. But as God does not reject his prayers notwithstanding all his weakness, no more would I. And I had rather have such prayers than none at all.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/richard-baxter.html">Richard Baxter</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Cure of Church Divisions</cite>, (London: Symmons, 1670), pt. 1 | Direction 32, p. 186</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/worship/impurities-in-worship.html">Impurities in Worship</a></span></div>

</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-29283f1287" data-kw="">
<blockquote><p>Other churches there are in the world which are not evidently guilty of the enormities in doctrine, worship and discipline before discoursed of. These all we judge to be true churches of Christ; and do hope that his promised presence is with them in their assemblies. Answerable hereunto is our judgment concerning their officers or rulers, and all their sacred administrations. It becomes us to think and believe that the one [their offices] have authority from Christ and that the other [their sacred administrations] are accepted with Him: For it is most unwarrantable rashness and presumption, yea an evident fruit of ignorance, or want of love, or secular private interest, when, upon lesser differences men judge churches to be no true churches and their ministers to be no true ministers, and consequently all their administrations to be invalid… But the validity or invalidity of the ordinances of Christ, which are the means of union and communion with Him unto all his disciples, depend not on the determination of things highly disputable in their notion, and not inconsistent with true Gospel-obedience in their practice… We stand to the judgment of Christ and his Word. We cannot but judge indeed that many Churches have missed, and do miss in some things the precise rules of their due constitution and walking; that many of them have added useless, superfluous rites to the worship of God among them; that there is in many of them a sinful neglect of evangelical discipline, or a carnal rule erected in the stead of it; that errors in doctrines of importance and danger, are prevalent in sundry of them; that their rulers are much influenced by a spirit of bitterness and envy against such as plead for reformation beyond their measure or interest; yet that hereupon they should all or any of them immediately forfeit their church-state, so as to have no lawful ministers, nor acceptable sacred administrations, is in itself a false imagination, and such as was never by us entertained.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/john-owen.html">John Owen</a></span><span class="wk"><span class="lbl">Work:</span> <cite>A Discourse concerning Evangelical Love, Church-Peace &amp; Unity, with the Occasions &amp; Reasons present Differences &amp; Divisions about Things Sacred &amp; Religious</cite>, (1672), ch. 3, pp. 84-86</span></figcaption>

</figure><figure class="quote" id="q-ad2710556d" data-kw="">
<blockquote><p>This may move us to embrace integrity and sincerity, because the Lord so highly esteems it, that He accepts of our obedience as perfect which springs from it, though it be stained with much corruption, and joined with many imperfections. …those are said to have been perfect before God who in simplicity and uprightness of heart laboured after perfection, and served God in sincerity and truth, as Noah, Abraham, Job, David, Asa, Zachary and Elizabeth, though they had many corruptions and imperfections which in the Scriptures are recorded of them… And therefore David uses his sincerity in praying, as an argument to persuade the Lord to give him audience: ‘Give ear’ (says he) ‘unto my prayers, which go not out of feigned lips.’ (Ps. 17:1) And Hezekiah’s integrity of life, as a reason to move Him for the repealing of the sentence of death and prolonging of his days. ‘Remember now, O Lord,’ (says he) ‘I beseech thee, how I have walked before thee in truth, and with a perfect heart, etc.’ (Isa. 29:13)</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/john-downame.html">John Downame</a></span><span class="wk"><span class="lbl">Work:</span> <cite>A Guide to Godliness or a Treatise of a Christian Life</cite>, (London: 1622), bk. 4, ch. 1, §4 ‘That our imperfect obedience is accepted of God, if it be done in sincerity and integrity’, pp. 405-6</span></figcaption>

<blockquote><p>VIII. Though it be the surest way to peace and concord to take up with these necessary things, and we cannot approve of the narrow dividing principles of those men that will impose things unnecessary, to the excluding of the necessary, yet if our lawful rulers shall command it, or the peace of the Church through the distempers of the brethren shall require it, we shall obey, and consent in things that God has not forbidden; and if we suffer for well-doing, and for obeying God rather than men, we shall endeavor to imitate our Lord, who being reviled, reviled not again, and when he suffered, threatened not; but committed all to Him that judges righteously, 1 Pet. 2:23.</p></blockquote>

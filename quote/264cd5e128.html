<main class="wrap"><figure class="quote" id="q-264cd5e128" data-kw="">
<blockquote><p>While the covenant of works is not a prominent theme in Zacharias Ursinus’s Commentary on the Heidelberg Catechism, he does make at least one important reference to it in contrast to the covenant of grace. The idea that the covenant of works is a Westminsterian novelty has no credence in history. If it were a novel teaching of the Westminster Assembly, then why did prominent continental divines such as Francis Turretin and Herman Witsius also defend it? In the following extract, Ursinus contrasts the reward for obedience under the covenant of works with the rewards for the sincere, but imperfect obedience of believers in the covenant of grace:

Obj.4. The severity of divine justice does not render good according to works which are not perfectly good. But Christ in the final judgment will render to every one, and so to the saints also, according to their works. Therefore the works of the saints are so perfect that they will in themselves stand in the judgment of God.

Ans. There are here four terms; because the major must be understood of a legal reward of works, whilst the minor must be understood of a reward that is; evangelical; or to express it differently, we may say that the justice of God does not render good according to works which are imperfect, if he judges according to the covenant of perfect obedience to the law.

But Christ, in rewarding the works of the saints, will not judge according to the covenant of perfect works, but according to the covenant of faith, or of his own righteousness imputed and applied to them by faith; and yet he will judge them according to their works as according to the evidences of their faith, from which their works have proceeded, and which they, as the fruits of this faith, declare to be in them.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/zacharias-ursinus.html">Zacharias Ursinus</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Commentary on the Heidelberg Catechism</cite>, trans. G. W. Williard (1616; 2nd American edn, Columbus, 1852), pp 609-10.</span></figcaption>

<blockquote><p>Vers. 4. Wherefore my Brethren, ye also are become dead to the Law by the Body of Christ, that ye should be married to another, even to him who is raised from the dead, that we should bring forth fruit unto God.

The Apodosis of the comparison, to this manner; So you that were espoused formerly to the Law by a Covenant of Works, Christ being dead for you, that he might satisfy the Law, Justice, and the Covenant of Works in our name, you are judicially dead to the Law, in the body of Christ (for the Law, or Covenant of Works hath slain Christ, and you in him) and by consequence you are delivered from the matrimonial Covenant of the Law; so that without the breach of Justice you may enter into a new Covenant of Grace, with Christ, being raised from the dead.

To this end he shews, that the purpose of marriage being disannulled, betwixt the Law of Works and us, not that we should live as we list, but being raised from a state of death, by the Resurrection of Christ, that we should be espoused to another Husband, viz. to him which is raised from the dead, i. e. to Christ, who rose from the dead, and hath raised us with himself to newness of life, and hath espoused us to himself, according to the Covenant of Grace, that being married unto Christ, we might bring forth fruits of obedience to the glory of God.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/david-dickson.html">David Dickson</a></span><span class="wk"><span class="lbl">Work:</span> <cite>An exposition of all St. Paul’s epistles together with an explanation of those other epistles of the apostles St. James, Peter, John &amp; Jude: wherein the sense of every chapter and verse is analytically unfolded and the text enlightened</cite>, (London: Francis Eglesfield, 1659), p. 16.</span></figcaption>

</figure><figure class="quote" id="q-79de0305f6" data-kw="">
<blockquote><p>There is much confusion nowadays as to whether or not the covenant of grace is conditional or unconditional. Much of this confusion stems from not carefully distinguishing how older writers were employing their terms. When earlier Reformed divines argued that faith was the condition of the covenant of grace, the word condition was being used in an improper sense. Faith was not a condition properly speaking, in the sense of being a moving or meritorious cause. The only moving or meritorious cause in the covenant of grace is the righteousness of Christ Strictly speaking, then, the covenant of grace is unconditional. Alexander Moncrieff reminds us that to argue that the covenant of grace is conditional in a proper sense introduces a new legalism, which turns the covenant of grace into a covenant of works:

We observe, that altho’ a Consent to take Christ our Lord, to be ruled and governed by him, and to observe and keep his Commandments, be not the Condition and Terms of the Covenant of Grace, as we have already shewn, by which Doctrine Legalists have subverted the Gospel of Christ, and turned the Covenant of Grace into a new Law, or new Form of a Covenant of Works; yet, upon the Back of our believing the Promise, and trusting on the Person of Christ, by which we are personally entered into the Covenant, there doth necessarily follow an absolute Consent to take Christ for our Husband, Head and Lord; a Consent to take Christ as our only Priest, to be saved by his Righteousness alone …</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/alexander-moncrieff.html">Alexander Moncrieff</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Duty of National Covenanting Explained: In Some Sermons Preached at the Renovation of Our Covenants, National and Solemn League, in the Bond Adapted to our Present Situation and Circumstances in this Period, by the Associate Presbytery, at Abernethy, in the Month of July 1744</cite>, (Edinburgh: David Duncan, 1747), pp 33-34.</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/the-covenant-of-works.html">The Covenant of Works</a></span></div>

<blockquote><p>1. The law of Moses was, in the first place, a re-enactment of the covenant of works. A covenant is simply a promise suspended upon a condition. The covenant of works, therefore, is nothing more than the promise of life suspended on the condition of perfect obedience. The phrase is used as a concise and convenient expression of the eternal principles of justice on which God deals with rational creatures, and which underlie all dispensations, the Adamic, Abrahamic, Mosaic and Christian. Our Lord said to the lawyer who asked what he should do to inherit eternal life, “What is written in the law? How readest thou? And he answering said, Thou shalt love the Lord thy God with all thy heart, and with all thy soul, and with all thy strength, and with all thy mind; and thy neighbour as thy-self. And he said unto him, Thou hast answered right, this do and thou shalt live,” Luke 10:26–28. This is the covenant of works. It is an immutable principle that where there is no sin there is no condemnation, and where there is sin there is death. This is all that those who reject the gospel have to fall back upon. It is this principle which is rendered so prominent in the Mosaic economy as to give it its character of law. Viewed under this aspect it is the ministration of condemnation and death.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/charles-hodge.html">Charles Hodge</a></span><span class="wk"><span class="lbl">Work:</span> <cite>An Exposition of the Second Epistle to the Corinthians</cite>, (New York: A. C. Armstrong &amp; Son, 1891), 57–58.</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/the-covenant-of-works.html">The Covenant of Works</a></span></div>
<div class="actions"><button class="copy" data-copy="“1. The law of Moses was, in the first place, a re-enactment of the covenant of works. A covenant is simply a promise suspended upon a condition. The covenant of works, therefore, is nothing more than the promise of life suspended on the condition of perfect obedience. The phrase is used as a concise and convenient expression of the eternal principles of justice on which God deals with rational creatures, and which underlie all dispensations, the Adamic, Abrahamic, Mosaic and Christian. Our Lord said to the lawyer who asked what he should do to inherit eternal life, “What is written in the law? How readest thou? And he answering said, Thou shalt love the Lord thy God with all thy heart, and with all thy soul, and with all thy strength, and with all thy mind; and thy neighbour as thy-self. And he said unto him, Thou hast answered right, this do and thou shalt live,” Luke 10:26–28. This is the covenant of works. It is an immutable principle that where there is no sin there is no condemnation, and where there is sin there is death. This is all that those who reject the gospel have to fall back upon. It is this principle which is rendered so prominent in the Mosaic economy as to give it its character of law. Viewed under this aspect it is the ministration of condemnation and death.”

— Charles Hodge, An Exposition of the Second Epistle to the Corinthians, (New York: A. C. Armstrong &amp; Son, 1891), 57–58.">Copy</button><a class="share" href="https://x.com/intent/post?text=%E2%80%9C1.+The+law+of+Moses+was%2C+in+the+first+place%2C+a+re-enactment+of+the+covenant+of+works.+A+covenant+is+simply+a+promise+suspended+upon+a+condition.+The+covenant+of+works%2C+therefore%2C+is+nothing+more+than+the+promise+of+life+suspended+on+the+condition+of+perfect+obedience.+The+phrase+is+used+as+a+concise+and+convenient+expression+of+the+eternal+principles+of+justice+on+which+God+deals+with+rational+creatures%2C+and+which+underlie+all+dispensations%2C+the+Adamic%2C+Abrahamic%2C+Mosaic+and+Christian.+Our+Lord+said+to+the+lawyer+who+asked+what+he+should+do+to+inherit+eternal+life%2C+%E2%80%9CWhat+is+written+in+the+law%3F+How+readest+thou%3F+And+he+answering+said%2C+Thou+shalt+love+the+Lord+thy+God+with+all+thy+heart%2C+and+with+all+thy+soul%2C+and+with+all+thy+strength%2C+and+with+all+thy+mind%3B+and+thy+neighbour+as+thy-self.+And+he+said+unto+him%2C+Thou+hast+answered+right%2C+this+do+and+thou+shalt+live%2C%E2%80%9D+Luke+10%3A26%E2%80%9328.+This+is+the+covenant+of+works.+It+is+an+immutable+principle+that+where+there+is+no+sin+there+is+no+condemnation%2C+and+where+there+is+sin+there+is+death.+This+is+all+that+those+who+reject+the+gospel+have+to+fall+back+upon.+It+is+this+principle+which+is+rendered+so+prominent+in+the+Mosaic+economy+as+to+give+it+its+character+of+law.+Viewed+under+this+aspect+it+is+the+ministration+of+condemnation+and+death.%E2%80%9D%0A%0A%E2%80%94+Charles+Hodge%2C+An+Exposition+of+the+Second+Epistle+to+the+Corinthians%2C+%28New+York%3A+A.+C.+Armstrong+%26+Son%2C+1891%29%2C+57%E2%80%9358.&amp;url=https%3A%2F%2F5solasquotes.github.io%2Fquote%2F02254d7d48.html&amp;via=5Solas" target="_blank" rel="noopener">Share on X</a><a class="perma" href="../quote/02254d7d48.html">Permalink</a><a class="src" href="https://heidelblog.net/2016/04/hodge-do-this-and-live-is-a-covenant-of-works/" rel="noopener" target="_blank">Read it online · Heidelblog</a></div>
</figure><figure class="quote" id="q-706737c25c" data-kw="">
<blockquote><p>The Law—considered as a national covenant, by which their continued possession of the land of Canaan, and of all their privileges under the Theocracy, was left to depend on their external obedience to it,— might be called a national Covenant of Works, since their temporal welfare was suspended on the condition of their continued adherence to it; but, in that aspect of it, it had no relation to the spiritual salvation of individuals, otherwise than as this might be affected by their retaining, or forfeiting, their outward privileges and means of grace.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/james-buchanan.html">James Buchanan</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Doctrine of Justification</cite>, (Oxford: Oxford University Press, 1867), 38–39.</span></figcaption>

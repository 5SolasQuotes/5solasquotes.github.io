<blockquote><p>Familists make God in his nature and essence to dwell and work in all creatures, especially in the regenerate. But these are but fancies. 1. Because after Christ was raised from the dead to the glory of the Father and so entered into his glory, there is evidence that his manhead was entered in no degrees of communion in the essence power and glory of God equally with God; because there remaineth a body with flesh and bones that may be touched and handled. Luk. 24.36.37, 38, 39, 40. with the print of the nails in his hands and sides Joh. 20 27. now there is nothing of the nature, essential honour, and glory of God an infinite Spirit, that fills heaven and earth yea or of any spirit, in a body of bones flesh hands and feet and having in it such material and sensible qualities as the impression of wounds.

… Christ did eat with his disciples after his resurrection. Joh. 21.12, 13, 14, and so after he was entered in some degrees of glory and was seen of five hundred brethren at once 1 Cor. 15.6. Of Cleophas, of the twelve Apostles, of Paul also, now what ever partaketh of the essence of a Spirit, cannot eat, nor be seen with bodily eyes, and the disciples with their bodily eyes saw him ascend to heaven even till the clouds took him out of their sight. Acts 1. (3) The eyes of all believers and reprobates, even his enemies that pierced him, in the general Judgement shall see him: in which state Swenckefeldius dreams that the manhood is fully changed in the essence of God Rev. 1.7. now that the bodily eyes of men, and of Reprobate men, shall see the essence of God, who is invisible 1 Tim. 1.17. is a dream, for He dwells in light which no man can approach unto, though we nothing doubt but the man Christ, as man, is elevated now in heaven, to our uncomparable comfort, to such eminency of glory, above Men and Angels, as the capacity of a created thing can receive.

… [T]he Manhood of Christ is a creature, having beginning and a cause of being in time Mat. 1. Luk. 2 in the fullness of time Gal. 4. 4 was borne of a woman. Now what is man born of a woman that he should be equal in essence and nature with God? who is like unto God? Angels and created powers, cannot answer the question. God is essentially eternal, and eternity differenceth him from all things beside himself; Esay. 9.6. chap. 43.10. Before me there was no God, neither shall there be after me c. 40.28. Psal. 99.1, 2. Psal. 102.26.27. 1 Tim. 1.17. it’s then an everlasting contradiction, that a creature in time, can be a creator and a God before time, or partake of the essence of the eternal God, for God must then create another God, different in number from himself, our bodies shall be made conform to the glorious body of Christ. Phil. 3.21.

If the Manhood of Christ, and so his body, which is a part thereof, be changed into the essence of God, we must be like the very invisible and eternal essence of an infinite Spirit, and there is no glorifying of our bodies then, nor any resurrection, nor any caughting up of our bodies to the air to be ever with the Lord, but an utter extinction and an annihilation of our bodies and the body of Christ. Hence the flesh profiteth not, then the manhood does not spiritually quicken, give the Holy Ghost, justify, as Swenckefield says, but Christ God doth these.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/samuel-rutherford.html">Samuel Rutherford</a></span><span class="wk"><span class="lbl">Work:</span> <cite>A survey of the spiritual antichrist</cite>, (London: Andrew Crooke, 1648), Part 1.5, pp 17-18.</span></figcaption>

<blockquote><p>(j) That James expressly teaches that a person is justified by works, not by faith alone (James 2:14, 17–18, 20–26). I respond: (i) The passage has nothing about merits. (ii) It clearly is discussing a sterile faith, or one which is constantly devoid of works, the sort that does not justify, as we freely acknowledge with Paul (Gal. 5:6). (iii) The passage also could be understood about the justification that will happen in the last judgment, insofar as that will require the presence of good works. Not to mention that (iv) the passage could be understood about the justification or declaration of faith before God and men (v. 18).</p></blockquote>

<blockquote><p>VII. Third, the thief is admitted into paradise before the ascension of Christ according to his promise, “Today shalt thou be with me in paradise” (Lk. 23:43). Nor should it be said here that “today” must be construed with the preceding verb (“I say”) and not with what follows (“shalt thou be with me”) so that the meaning is “today I say unto thee, thou shalt be with me in paradise” (to wit, at the last judgment) because the construction will not suffer this. In vain would this be added because no one speaks except in the present time and it is clear that Christ refers to the words of the thief, “Remember me when thou comest into thy kingdom” (v. 42). Nor should it be said that paradise is limbo (as Maldonatus holds), because it appears from Scripture that paradise is located in heaven as a place of delight and of eternal happiness (2 Cor. 12:2, 4; Rev. 2:7). Nor should it be said that the thief requested only this—that Christ should remember him in paradise—because it is not absurd to say that Christ gave more to him than he asked, as the most kind Father is accustomed to do above what we seek. Nor is this a privilege peculiar to the thief and not common to others since faith and repentance (to whom this is given by Christ) is common to all true believers. Hence Bellarmine rightly proves from this passage that the saints immediately after death enjoy the vision of God (“De Sanctorum Beatitudine,” 1.7 Opera [1857], 2:437–38).

VIII. Fourth, Enoch and Elijah were translated to heaven (Heb. 11:5; 2 K. 2:11). For although this was peculiar to them that they were bodily whirled into heaven, it was not singular that they were spiritually admitted into it; yea, they were the solemn pledges to the pious of the heavenly glory to be at length obtained. Nor if the letter said to have been written from Elijah to Jehoram (2 Ch. 21:12) was handed to the king only after Elijah’s death, does it follow that it was written after his translation. It is one thing for it to have been written after his translation; another to have been given only then. The emptiness of the figment concerning the translation of Enoch and Elijah to a terrestrial paradise, also concerning their return to war against Antichrist has been elsewhere exposed (Volume I, Topic VIII, Question 7, Section 9).

IX. Fifth, the ancient believers waited for a heavenly city (Heb. 11:10) and had a great consolation and certain hope of glory in death (which would not have been the case if they had as yet to be hurled into hell). How could Jacob have testified that he waited with such earnestness the salvation of the Lord (Gen. 49:18) and David that he committed his spirit into the hand of the Lord (Ps. 31:5), if they should still be far off from the face of God and were to be glorified only after many ages? Nor can it be said that David thus commended to God the perfection of life because the words can bear no other meaning according to the style of Scripture than to deliver the soul to God (as is evident from the example of Stephen, Acts 7:59).</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/francis-turretin.html">Francis Turretin</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Institutes of Elenctic Theology</cite>, 12.11.7–9;, ed. James T. Dennison Jr., trans. George Musgrave Giger, vol. 2 (Phillipsburg, NJ: P&amp;R Publishing, 1992–97), 259–60.</span></figcaption>

— Francis Turretin, Institutes of Elenctic Theology, 12.11.7–9;, ed. James T. Dennison Jr., trans. George Musgrave Giger, vol. 2 (Phillipsburg, NJ: P&amp;R Publishing, 1992–97), 259–60.">Copy</button><a class="share" href="https://x.com/intent/post?text=%E2%80%9CVII.+Third%2C+the+thief+is+admitted+into+paradise+before+the+ascension+of+Christ+according+to+his+promise%2C+%E2%80%9CToday+shalt+thou+be+with+me+in+paradise%E2%80%9D+%28Lk.+23%3A43%29.+Nor+should+it+be+said+here+that+%E2%80%9Ctoday%E2%80%9D+must+be+construed+with+the+preceding+verb+%28%E2%80%9CI+say%E2%80%9D%29+and+not+with+what+follows+%28%E2%80%9Cshalt+thou+be+with+me%E2%80%9D%29+so+that+the+meaning+is+%E2%80%9Ctoday+I+say+unto+thee%2C+thou+shalt+be+with+me+in+paradise%E2%80%9D+%28to+wit%2C+at+the+last+judgment%29+because+the+construction+will+not+suffer+this.+In+vain+would+this+be+added+because+no+one+speaks+except+in+the+present+time+and+it+is+clear+that+Christ+refers+to+the+words+of+the+thief%2C+%E2%80%9CRemember+me+when+thou+comest+into+thy+kingdom%E2%80%9D+%28v.+42%29.+Nor+should+it+be+said+that+paradise+is+limbo+%28as+Maldonatus+holds%29%2C+because+it+appears+from+Scripture+that+paradise+is+located+in+heaven+as+a+place+of+delight+and+of+eternal+happiness+%282+Cor.+12%3A2%2C+4%3B+Rev.+2%3A7%29.+Nor+should+it+be+said+that+the+thief+requested+only+this%E2%80%94that+Christ+should+remember+him+in+paradise%E2%80%94because+it+is+not+absurd+to+say+that+Christ+gave+more+to+him+than+he+asked%2C+as+the+most+kind+Father+is+accustomed+to+do+above+what+we+seek.+Nor+is+this+a+privilege+peculiar+to+the+thief+and+not+common+to+others+since+faith+and+repentance+%28to+whom+this+is+given+by+Christ%29+is+common+to+all+true+believers.+Hence+Bellarmine+rightly+proves+from+this+passage+that+the+saints+immediately+after+death+enjoy+the+vision+of+God+%28%E2%80%9CDe+Sanctorum+Beatitudine%2C%E2%80%9D+1.7+Opera+%5B1857%5D%2C+2%3A437%E2%80%9338%29.+VIII.+Fourth%2C+Enoch+and+Elijah+were+translated+to+heaven+%28Heb.+11%3A5%3B+2+K.+2%3A11%29.+For+although+this+was+peculiar+to+them+that+they+were+bodily+whirled+into+heaven%2C+it+was+not+singular+that+they+were+spiritually+admitted+into+it%3B+yea%2C+they+were+the+solemn+pledges+to+the+pious+of+the+heavenly+glory+to+be+at+length+obtained.+Nor+if+the+letter+said+to+have+been+written+from+Elijah+to+Jehoram+%282+Ch.+21%3A12%29+was+handed+to+the+king+only+after+Elijah%E2%80%99s+death%2C+does+it+follow+that+it+was+written+after+his+translation.+It+is+one+thing+for+it+to+have+been+written+after+his+translation%3B+another+to+have+been+given+only+then.+The+emptiness+of+the+figment+concerning+the+translation+of+Enoch+and+Elijah+to+a+terrestrial+paradise%2C+also+concerning+their+return+to+war+against+Antichrist+has+been+elsewhere+exposed+%28Volume+I%2C+Topic+VIII%2C+Question+7%2C+Section+9%29.+IX.+Fifth%2C+the+ancient+believers+waited+for+a+heavenly+city+%28Heb.+11%3A10%29+and+had+a+great+consolation+and+certain+hope+of+glory+in+death+%28which+would+not+have+been+the+case+if+they+had+as+yet+to+be+hurled+into+hell%29.+How+could+Jacob+have+testified+that+he+waited+with+such+earnestness+the+salvation+of+the+Lord+%28Gen.+49%3A18%29+and+David+that+he+committed+his+spirit+into+the+hand+of+the+Lord+%28Ps.+31%3A5%29%2C+if+they+should+still+be+far+off+from+the+face+of+God+and+were+to+be+glorified+only+after+many+ages%3F+Nor+can+it+be+said+that+David+thus+commended+to+God+the+perfection+of+life+because+the+words+can+bear+no+other+meaning+according+to+the+style+of+Scripture+than+to+deliver+the+soul+to+God+%28as+is+evident+from+the+example+of+Stephen%2C+Acts+7%3A59%29.%E2%80%9D%0A%0A%E2%80%94+Francis+Turretin%2C+Institutes+of+Elenctic+Theology%2C+12.11.7%E2%80%939%3B%2C+ed.+James+T.+Dennison+Jr.%2C+trans.+George+Musgrave+Giger%2C+vol.+2+%28Phillipsburg%2C+NJ%3A+P%26R+Publishing%2C+1992%E2%80%9397%29%2C+259%E2%80%9360.&amp;url=https%3A%2F%2F5solasquotes.github.io%2Fquote%2Ff4007d5c72.html&amp;via=5Solas" target="_blank" rel="noopener">Share on X</a><a class="perma" href="../quote/f4007d5c72.html">Permalink</a><a class="src" href="https://heidelblog.net/2025/06/turretin-contra-the-limbus-patrum-3/" rel="noopener" target="_blank">Read it online · Heidelblog</a></div>
</figure><figure class="quote" id="q-16aaad586b" data-kw="">
<blockquote><p>In fact we assert from Scripture that the pious who have died under either of both testaments are not enjoying some heavenly joy apart from the presence of God, as some of the great men used to think [such as Justin Martyr, Dialogue with Trypho 5 and Irenaeus, Against Heresies 2.34.1 &amp; 5.31.2], but that they are fully enjoying true and unbroken blessedness in God’s very presence. Even so we do not deny that some degree of happiness is kept aside for them until the last day, when [their souls] will be joined to their bodies. This is demonstrated by very many places of Scripture, for also David locates the place of their true blessedness as the presence of God (Psalm 26:23 and [Ps.] 84). And Paul desires ‘to depart and to be with Christ’ (Philippians 1:23); and 2 Corinthians 5:8: ‘And so we choose rather to depart from the body and go to dwell with the Lord.’ The apostle testifies that Christ is with the Father, and on the Father’s throne (Revelation 3:21; John 17:5; Hebrews 9:24). Therefore also throughout Revelation the deceased saints are placed together with the angels before the throne of God and the Lamb, so that they sing constant praises and give thanks to Him, as can be seen in Revelation 4:8, 5:8, and 7:9.</p></blockquote>

<blockquote><p>4. If indeed theology is considered as it is knowledge endowed by God upon creatures, either communicated in this age or to be communicated in the future age, that theology is ectypal. And this theology is fashioned by God alone from the archetype, as it were, through various ways and degrees of communication; for men turning to and fro in this world, through the grace of revelation; for angels rather, and for blessed spirits in heaven, it is received through the grace of vision, by benefit of which we also, after this life, face to face; that is, before him and closely, shall contemplate him as he is, 1 Jn. 3:2.</p></blockquote>

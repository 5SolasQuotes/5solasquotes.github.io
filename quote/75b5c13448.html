<main class="wrap"><figure class="quote" id="q-75b5c13448" data-kw="">
<blockquote><p>The extremists upon both sides have a much easier task than the one who occupies the central position between them. A simple idea is much easier to define and manage than a complex one. But it is not so fertile, so prolific, or so completely true.

If simplicity and facility of management were all that the philosopher has to care for, the great comprehensive ideas of science would soon disappear; for they are neither uncomplex nor facile. “The simplest of governments,” says Webster while defending the excellent complexity of republicanism, “is a despotism.” The simplest of theories is the theory of an extremist.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/william-g-t-shedd.html">William G.T. Shedd</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Lectures upon the Philosophy of History</cite>, (Andover: W. F. Draper, 1857), p. 37.</span></figcaption>

</figure><figure class="quote" id="q-9b8f5296de" data-kw="">
<blockquote><p>There was a certain man in Caesarea called Cornelius… A devout man, and one that feared God with all his house, which gave much alms to the people, and prayed to God alway… And he said unto him, ‘Thy prayers and thine alms are come up for a memorial before God… And as Peter was coming in, Cornelius met him, and fell down at his feet, and worshipped him. But Peter took him up, saying, ‘Stand up; I myself also am a man.’… ‘…Now therefore are we all here present before God, to hear all things that are commanded thee of God.’ Then Peter opened his mouth, and said, ‘Of a truth I perceive that God is no respecter of persons: But in every nation he that feareth Him, and worketh righteousness, is accepted with Him….’ While Peter yet spake these words, the Holy Ghost fell on all them which heard the word.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/old-testament.html">The Bible</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Acts 10:1-4 25-26, 33-35, 44</cite></span></figcaption>

</figure><figure class="quote" id="q-501c80bd1e" data-kw="">
<blockquote><p>Paybody thinks kneeling in the act of receiving the Communion to be expedient for the reverend using and handling of that holy sacrament, and that much reverence arises to the sacrament from it. Answer: I verily believe that more reverence arises to the sacrament from kneeling than is due to it, but I am sure there is no less true reverence of that holy sacrament among such as kneel not in the receiving of it than among such as do kneel. I hope it is not unknown how humbly and reverently many sincere Christians, with feare and trembling, do address themselves to that most holy sacrament, who yet for all the world, would not kneel in receiving it. Thus we see that these expediencies pretended for the ceremonies are attained unto as well and better without them, than by them.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/george-gillespie.html">George Gillespie</a></span><span class="wk"><span class="lbl">Work:</span> <cite>English Popish Ceremonies</cite>, (1637) | pt. 2, ch. 2, p. 14</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/worship/posture-and-gestures.html">Posture and Gestures</a></span></div>

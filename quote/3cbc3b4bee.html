<main class="wrap"><figure class="quote" id="q-3cbc3b4bee" data-kw="">
<blockquote><p>The willingness of God to receive returning sinners is manifested in the highest degree; and the willingness of a sinner to return to Him in duty has the strongest engagements. He has done as much to encourage our obedience as to illustrate his glory. We cannot conceive what could be done greater for the salvation of our souls and consequently what could have been done more to enforce our observance. We have a Redeemer, as man, to copy it to us, and as God to perfect us in it. It would make the heart of any to tremble to wound Him that has provided such a salve for our sores and to make grace a warrant for rebellion:</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/stephen-charnock.html">Stephen Charnock</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Several Discourses upon the Existence &amp; Attributes of God</cite>, … (London: Newman, 1682) | Wisdom of God, p. 387</span></figcaption>

<blockquote><p>3. The third thing is the goodness of God in his government…. his goodness hovers over the whole frame… to conduct them to those ends which might illustrate his wisdom and goodness to his creatures. His goodness does no less incline Him to provide for them than to frame them. ‘Tis the natural inclination of man to love what is purely the birth of his own strength or skill. He is fond of preserving his own inventions, as well as laborious in inventing them. ‘Tis the glory of a man to preserve them as well as to produce them. God loves everything which He has made, which love could not be without a continued diffusiveness to them, suitable to the end for which He made them.</p></blockquote>

</figure><figure class="quote" id="q-b6bfd17c0d" data-kw="">
<blockquote><p>I come now to the next attribute expressed in this proclamation, merciful: ‘The Lord, the Lord God, strong, gracious, merciful, abundant in goodness and truth, keeping mercy for thousands, forgiving iniquity, transgression, and sin,’ Ex. 34:6-7. Things attributed to God here are of three sorts:

1. The inward disposition or inclination, or aptitude and readiness to mercy, that is in the four first attributes, merciful, gracious, long-suffering, much in goodness, and truth is added.

2. There are his purposes and resolutions of mercy, keeping mercy for thousands; and they are immanent acts in God, kept and laid up in God’s own breast.

3. There are extrinsical acts of mercy issuing from both: ‘pardoning iniquity, transgression, and sin.’ The meaning plainly is, first, God is merciful as He is Jehovah; that is his nature. Secondly, He fully resolves to show mercy; there is his heart. Thirdly, He has done it, and does it every day, in pardoning sin; there is his wont and practice. So that God is every way merciful: in his nature, in his purposes, and in his deeds and performance.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/thomas-goodwin.html">Thomas Goodwin</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Object &amp; Acts of Justifying Faith, pt. 1</cite>, bk. 1, ch. 8, on Ex. 34:6-7 in The Works (d. 1680; Edinburgh: James Nichol, 1864), vol. 8, p. 55</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/the-covenant-of-grace/the-gospel-offer.html">The Gospel Offer</a></span></div>

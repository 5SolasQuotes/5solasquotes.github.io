<blockquote><p>they have resolved to attack me in Rome; whoever will undertake that, let him not so much think of the vengeance of the consistory, but, going to the Tiber and crossing the mill-bridge, let him remember the bridge of Saint Angel.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/andre-rivet.html">André Rivet</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Theological Works</cite>, vol. 3, Jesuita Vapulans, or the Castigation of the Notes of Sylvester Petrasancta Loyola’s Sectary, On the Letter of Peter Molinaeus to Balzac (1535), ch. 15 tr. AI by The Faith Received | Nor did the infamous apostate Rebulli, who like another Balaam was hired to curse Israel, after the famous pamphlets published at Rome and elsewhere against our men, at last in the year 1611 had his head struck off in the prison itself, at the extremity of the bridge of Saint Angel, a spectacle to the Romans: who a little before, when he was writing to a friend at Rome and lessened those whom he had offended by his pamphlets, scorned them; “That”, he used to say</span></figcaption>

<blockquote><p>Must so many efforts be used to force from us [French protestants] that French heart that God and birth has given us? What have we done to merit so many misfortunes and such severe punishments? We are hunted, we are drove up and down as if we were the plagues of the Republic; We are treated as the enemies of the Christian name. In places where the Jews are tolerated, they have all manner of liberty, they exercise arts and merchandise; they are physicians, they are consulted, the health and life of Christians is put into their hands: And as for us, as if we were infected, we are forbidden to approach children that come into the world, we are banished from the bars and faculties, we are removed from the king’s person, we are banished from societies, our charges are taken from us, we are forbidden the use of all means that might secure us from being famished; we are abandoned to the hatred of the people, we are deprived of that precious liberty that we had purchased by so many services; our children are taken from us, who are a part of ourselves; we are made to lead a languishing life, in lowness, in poverty, and often in dark prisons. Formerly, when declarations were made against us, they were at most contented with registering them in the rolls. They are at present fixed up, they are cried about the streets as if they were gazettes, to inspire the people with a spirit of fury against us. And they have been so successful that in the great cities of France we expect to have our throats cut, one time or another, by a popular sedition; so that we are very near the Inquisition. Can it be said that there is liberty of conscience in a kingdom where the people are banished, lose their honor, and their goods are confiscated for religion’s sake? There needs nothing more than fire; and that terrible tribunal of the Inquisition, which France has been hitherto so much afraid of, will be established there. Are we Turks, are we infidels? We believe in Jesus Christ, we believe him the eternal Son of God, we invoke him solely; and we have no idols. We have a sovereign respect for the sacred Scriptures, we believe there is a Heaven and a Hell, the maxims of our morality are of so great a purity, that they dare not contradict them. We have a respect for kings, we are good subjects, good citizens, faithful in commerce: Let us be tried according to law, and it will appear if we have been engaged in any conspiracy against the State, and if we have any ways failed in our duty. Thanks be to God, nothing can stagger our fidelity, and the stock of love we have for our prince is not to be drained: if it depended on our enemies, we should be enemies of the State we make a part of; they design to push us on to crimes, that the king may have a just occasion of ruining us; but they have hitherto missed their aim, and are like to do so still; the king may see it, whilst that they so successfully turn the effects of his goodness from us, there is not one of us but who is ready to lose his life for his sake; we are Frenchmen as well as we are Reformed Christians; we would shed to the very last drop of the blood of our veins to serve our king, and for the preserving our religion, even to death.</p></blockquote>

<blockquote><p>§17. Now to the Political Means. I. Nothing is accomplished, indeed, things are done badly, by persecuting, harassing or oppressing the Jews, driving them away, or killing them. That is to say, those guilty of Judaism alone [should not be harassed or oppressed]. But those guilty of other crimes should be punished equally with others. Nevertheless, they should not be treated more harshly for that reason, because they are Jews. We do not wish innocent people to be constrained merely because they are Jews or Saracens. Among the ancient Sicilian laws, Emperor Frederick established this in Constitutions of Sicily, bk. 1, title 17 &amp; 26: ‘We cannot allow Jews and Saracens, whom the diversity of the Christian sect makes hostile, and who are deprived of every other assistance, to be defrauded of the power of our protection.’ Christian converts from Judaism have noted that this perverse practice of treating Jews more harshly is a great hindrance to the conversion of more people. For it is entirely foreign to the nature of faith to employ violence in order to produce belief. Petrus Alphonsus the Spaniard, in The Dialogue of Moses &amp; Peter: ‘To imprison and kill, until someone either believes or pays a tax, is not among the works of God; nor did any of the prophets command anyone to be compelled to believe.’ Likewise, Stephanus Isaacus (to whom, together with his father Johannes Isaacus, Cardinal and Papal Legate Franciscus de Mendoza had granted authority to investigate all the Jews throughout the three ecclesiastical electorates, and to rage against them with fire and sword) rightly said that this counsel was unjust and most wicked, and that more is accomplished through moderation and kindness than through cruelty or savagery, in his German Apology, p. 42. The same was noted by [Johannes] Pfefferkorn [d. 1523] and others. Therefore, the better and more common opinion, both among theologians and among jurists, is that the Jews should be tolerated—not indeed enticed, but, where they are found, not treated more harshly. Thus: • Baldus, vol. 1, Consil, 315-16 • Rolandus a Valle, vol. 3, Consil, 25 • Alexander of Hales, Summa, pt. 2, Questions 179-80 • Vincent of Beauvais, Spec. Doctr., bk. 10, ch. 38, etc. • Johannes Gerhard, Common Places, On the Magistrate, p. 631 • Hottinger, Thesaurus Philologicus, bk. 1, ch. 1, section 2, question 1 And the one who treated this matter learnedly and extensively in a separate book, Georgius Theodorus, Counselor of Hesse, De jure et statu Iudæorum in Republica Christianorum [On the Law and Status of the Jews in the Republics of Christians].</p></blockquote>

eration+and+kindness+than+through+cruelty+or+savagery%2C+in+his+German+Apology%2C+p.+42.+The+same+was+noted+by+%5BJohannes%5D+Pfefferkorn+%5Bd.+1523%5D+and+others.+Therefore%2C+the+better+and+more+common+opinion%2C+both+among+theologians+and+among+jurists%2C+is+that+the+Jews+should+be+tolerated%E2%80%94not+indeed+enticed%2C+but%2C+where+they+are+found%2C+not+treated+more+harshly.+Thus%3A+%E2%80%A2+Baldus%2C+vol.+1%2C+Consil%2C+315-16+%E2%80%A2+Rolandus+a+Valle%2C+vol.+3%2C+Consil%2C+25+%E2%80%A2+Alexander+of+Hales%2C+Summa%2C+pt.+2%2C+Questions+179-80+%E2%80%A2+Vincent+of+Beauvais%2C+Spec.+Doctr.%2C+bk.+10%2C+ch.+38%2C+etc.+%E2%80%A2+Johannes+Gerhard%2C+Common+Places%2C+On+the+Magistrate%2C+p.+631+%E2%80%A2+Hottinger%2C+Thesaurus+Philologicus%2C+bk.+1%2C+ch.+1%2C+section+2%2C+question+1+And+the+one+who+treated+this+matter+learnedly+and+extensively+in+a+separate+book%2C+Georgius+Theodorus%2C+Counselor+of+Hesse%2C+De+jure+et+statu+Iud%C3%A6orum+in+Republica+Christianorum+%5BOn+the+Law+and+Status+of+the+Jews+in+the+Republics+of+Christians%5D.%E2%80%9D%0A%0A%E2%80%94+Johannes+Hoornbeeck%2C+T%E2%80%99shuvah+Yehudah%2C+or+For+the+Convincing+%26+Converting+of+the+Jews+%28Leiden%2C+1655%29%2C+pp.+24-25+tr.+AI+Latin&amp;url=https%3A%2F%2F5solasquotes.github.io%2Fquote%2F160288216c.html&amp;via=5Solas" target="_blank" rel="noopener">Share on X</a><a class="perma" href="../quote/160288216c.html">Permalink</a><a class="src" href="https://reformedbooksonline.com/topics/judaism#:~:text=17.%20Now%20to%20the%20Political%20Means,Jews%20in%20the%20Republics%20of%20Christians&amp;text=17.%20Now%20to%20the%20Political%20Means.%20I.%20Nothing&amp;text=of%20the%20Jews%20in%20the%20Republics%20of%20Christians" rel="noopener" target="_blank">Read it online · Reformed Books Online</a></div>

<blockquote><p>There is one of the chief Reformed divines, Dr. Alting, who in his Problematical Theology, part. 2, problem 21, puts this question: Utrum Judaei in societate Christianorum tolerandi sint [Whether Jews are to be tolerated in the society of Christians]? And he does answer it affirmatively; and I am clearly of his opinion, that it is not only lawful, but if matters be rightly ordered towards them, expedient to admit of them; Nay to invite and encourage them to live in Reformed Christian commonwealths. How far it may be a sin to refuse them admittance when they do desire it upon lawful terms and in a reasonable way, is a further question, which cannot be decided, till the former points of the lawfulness and expediency of admitting of them be made out.</p></blockquote>

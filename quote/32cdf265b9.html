<main class="wrap"><figure class="quote" id="q-32cdf265b9" data-kw="">
<blockquote><p>Our Lord Christ also found life to be unpleasant and burdensome, yet he was unwilling to die unless it was his Father’s will. He fled from death, held onto life as long as he could, and said, “My time is not yet come.”

Elijah, Jonah, and other prophets likewise found life unendurable, cried out in their agony for death, and even cursed the day on which they were born, yet they had to fight against their weariness of life and continue to live until their hour had come.

Such words and examples you must truly obey and imitate as words and admonitions from the Holy Ghost, and you must cast out and reject the thoughts that impel you to act otherwise.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/martin-luther.html">Martin Luther</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Letter to Jonas von Stockhausen, 27 November 1532 in Luther: Letters of Spiritual Counsel, ed. and trans. Theodore G. Tappert, Library of Christian Classics, vol. 18 (London: SCM Press, 1955), p. 89.</cite></span></figcaption>

<blockquote><p>The oral contraceptive principle has its basis in the Talmud as a potion or ‘cup of roots,’ the kos shel ikkarin. The ‘roots’ in that potion may refer to its herbal ingredients (the modern progesterone pill makes use of roots of the Mexican yam), and the mixture, in varying compositions, had many purposes… The kos shel ikkarin itself could, in a different dosage or composition, cause fertility rather than sterility, or could cure certain ailments [pointing to its hormonal nature]. An inquiry concerning the wife’s right to drink a potion that would help her become pregnant (sam l’hit-abber) was addressed to the eminent R. Solomon ben Adret of the thirteenth century.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/david-m-feldman.html">David M. Feldman</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Birth Control in Jewish Law</cite>, (1968; Schocken Books, 1974) 315 pp. ToC, p. 235</span></figcaption>

</figure><figure class="quote" id="q-5be04dc6fd" data-kw="">
<blockquote><p>In the midst of explaining how the commands to punish criminals in the Old Testament were not prophecies of how they would be punished in the providence of God, but commands as to how they should be punished in accordance with the command of God, Samuel Rutherford reminds us that many of the penal sanctions bind the Gentile nations:

The words of the Law do reveal, what the Magistrate may do, jure, and what the guilty deserves by the Law, but do not reveal the intention and absolute decree of the Law-giver, and what punishment actually, and quoard eventum shall be inflicted upon the guilty, and what shall come to pass as a thing decreed of the Lord: So, Genesis 9:6, the murderer shall die by the Sword of the Magistrate, and Exodus 22:18-20, the witch, the man that lies with a beast, he that sacrifices to a strange God, shall die the death jure, merito, and by Law deserving, but it followeth not; but such as commit these abominations, do live, as is clear in the kings of Assyria, Chaldea, and many of Israel, who were not put to death, but lived quoad eventum, though contrary to the Word of God.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/samuel-rutherford.html">Samuel Rutherford</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The covenant of life opened; or, a treatise of the covenant of grace</cite>, ed. C. M. McMahon (1654; New Lennox IL, 2005), pp 32-3.</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/civil-government-and-society/natural-law-and-civil-law.html">Natural Law and Civil Law</a></span></div>

<main class="wrap"><figure class="quote" id="q-06eb791890" data-kw="">
<blockquote><p>No adventitious circumstance can equitably be made a qualification for the enjoyment of political rights. Such for example as property, or the color of a man’s skin! These do not confer upon their possessors either peculiarity of claim or fitness for the exercise of political rights. Property does not make a man either wiser or better: nor does the color of his skin or the shade of his complexion. An aristocracy based on the principle of education and mental superiority would be perfect wisdom in comparison of an aristocracy based on the principle of property or of color! This is so intuitively evident that I am afraid the man who docs not admit it as a first principle in the science of government is not to be convinced by argument, nor reached by any conclusion however legitimately drawn from the principles of equity.

The pretence that property gives its possessor a greater interest in the welfare of a state, and therefore a right to greater weight and influence in the government, is too superficial to satisfy any one, except such as are in possession of the assumed qualification, or those whose prejudices are enlisted already in its favor. […]

It is impossible to establish the equity of imposing taxation upon a citizen, and at the same time deny him the right of elective suffrage; thus subjecting him to the operation of laws which he has no power, directly or indirectly, of making. The fact that a man is to be made the subject of a law, is a sufficient reason on grounds of equity why he should have a voice in making that law; unless he may be disqualified by vice or by incompetence. But keeping out of view such exceptions as are necessary to preserve equity, and secure the objects for which civil society has been instituted, justice requires that every man should have a right to say by what laws he is to be governed, irrespective of any adventitious circumstance. Property furnishes no security to society that political rights will be properly exercised. A poor but virtuous man may take a deeper interest in the welfare of the state than his rich but wicked neighbor; and will most certainly promote its welfare incomparably more.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/david-scott.html">David Scott</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Distinctive principles of the Reformed Presbyterian Church</cite>, (Albany, 1841), pp 247-9.</span></figcaption>

<blockquote><p>5. [Henning] Arnisaeus [d. 1636, a German, Lutheran political writer] desires that kings may use sparingly the plenitude of their power for public good; there must be, says he, necessity to make it lawful to use the plenitude of their power justly; therefore Ahab sinned, in that he unjustly possessed Naboth’s vineyard… but this plenitude of power may be justly put forth in act, says he, if the public good may be regarded.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/samuel-rutherford.html">Samuel Rutherford</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Lex Rex</cite>, … (1644), p. 197</span></figcaption>

<blockquote><p>Slavery of servants to lords or masters, such as were of old amongst the Jews, is not natural, but against nature.

1. Because slavery is malum naturae, a penal evil and contrary to nature, and a punishment of sin.

2. Slavery should not have been in the world, if man had never sinned, no more than there could have been buying and selling of men, which is a miserable consequent of sin and a sort of death, when men are put to the toiling pains of the hireling, who longs for the shadow, and under iron harrows and saws, and to hew wood, and draw water continually.</p></blockquote>

</figure><figure class="quote" id="q-dd9259e14a" data-kw="">
<blockquote><p>The immediate nearest end of civil power is that the good of the commonwealth may be provided for and procured, whether it be in time of peace, according to the rules of law and council of judges, or in time of war according to the rules of military prudence; and so the temporal safety of the subjects may be procured and that external peace and civil liberty may be preserved, and being lost may be again restored.</p></blockquote>

</figure><figure class="quote" id="q-4ee9865af2" data-kw="">
<blockquote><p>With that in mind, I contend that the best commonwealth is the one that has as its chief end, the common or public good, especially in relation to spiritual matters, the glorifying and enjoying of God forever. If this is the chief end of man, it ought to be the chief end of every institution in the world, whether government, school, family, or religious assembly… If the chief end of government is the public good, as the [Westminster] Confession says and the American founders said, especially the spiritual welfare of its subjects, then he [the magistrate] must both decide what is true religion for himself and promote it. The most obvious means is the enforcement of God’s moral law, classically understood as both tables of the Decalogue.</p></blockquote>

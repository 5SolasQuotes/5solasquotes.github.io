<blockquote><p>4. Zepperus, On the Sacraments, ch. 13, fol. 324-26, 228 1. The furious clamors and persecutions of the Papists did not permit this reformation of ceremonies at the first: which were so violent and bloody, that it gave small or no leisure to the teachers and lights of the Church, neither was it safe for them to bend their care or cogitations this way. 2. The people were so drowned in the deep darkeness and idolatry of the Papacy that the amendment of ceremonies, and of external worship could not in those beginnings be undertaken. It was necessary to use doctrine, and to instruct the people of sundry and horrible errors, idolatry, superstitions and abuses, which the whole Papacy and Popish ceremonies have in their departure, that so all those ugly things might first bee removed out of their minds, before they were removed from their sight. That which is not the work of one year, but a task of long season: For as ceremonies which are visible things and apprehended by the eyes do more affect and move than the invisible doctrine; So the people did closely stick to their accustomed ceremonies, and opposed themselves vehemently against the reformation of them: Even as we see at this day to come to pass, when as yet sound doctrine has prevailed and flourished for above these 80 years. 3. The Church in Popery was nothing else but a sick body: In which from the sole of the foot to the crown of the head, there was nothing sound and entire: Wherefore at the first beginning of reformation that whole chaos and abomination of error, and of Popish idolatry could not suddenly be perceived, but use and experience did daily manifest and teach every day more, than at the first.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/john-sprint.html">John Sprint</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Cassander Anglicanus, showing the Necessity of Conformity to the Prescribed Ceremonies of our Church in Case of Deprivation (London: Bill, 1623), ‘Reformed Practices’</cite>, pp. 173-74</span></figcaption>

<blockquote><p>[About the Church of England:] She is the very eye of all the Churches, the peculiar of Christ, the refuge of the afflicted, the arsenal of the weak, the storehouse of the poor, the standard of better hope… [Diodati laments that] in the civil wars this illustrious fold of Christ should be torn in pieces, not by wild beasts indeed; and plundered, though not by robbers; but by the sheep themselves enraged against one another: A thing without example, and never heard of before in the Reformed Churches. We are all struck with horror when we hear of the battles that are fought by the people against their king; by brethren against brethren; by children against their parents; and by the flock of Christ against one another, and against the shepherds themselves.</p></blockquote>

</figure><figure class="quote" id="q-14b682a887" data-kw="">
<blockquote><p>Let us hear no more paraenetics for toleration or liberty of conscience: but as many as you will for a just and merciful accommodation… If you be the sons of peace, you shall be characterized by this shibboleth, you will call for accommodation, not for toleration; for one way, not for two. ‘Let there be no strife between us and you, for we be brethren: and is not the Canaanite and the Perizzite yet in the land?’ (Gen. 13:7-8) O let it not be told in Gath, nor published in the streets of Ashkelon, Let it not be said, that there can be no unity in the Church without prelacy. … It shall be no grief of heart to you afterward that you have pleased others as well as yourselves, and have stretched your principles for an accommodation in Church government as well as in worship, and that for the Church’s peace and edification; and that the ears of our common enemies may tingle (Act. 9:31) when it shall be said, ‘The Churches of Christ… have rest, and are edified, and walking in the fear of the Lord, and in the joy of the Holy Ghost are multiplied.’ Alas, how shall our divisions and contentions hinder the preaching and learning of Christ, and the edifying one another in love! Is Christ divided? says the apostle. There is but one Christ, yea the Head and the Body makes one Christ, so that you cannot divide the Body without dividing Christ. Is there so much as a seam in all Christ’s garment? Is it not woven throughout from the top to the bottom? Will you have one half of Israel to follow Tibni, and another half to follow Omri? O brethren, we shall be one in heaven, let us pack up differences in this place of our pilgrimage the best way we can. … Brethren, it is not impossible, pray for it, endeavor it, press hard toward the mark of accommodation. How much better is it that you be one with the other Reformed Churches, though somewhat straitened and bound up, than to be divided though at full liberty and elbow-room?” … I am persuaded if there were but a right understanding one of another’s intentions, the accommodation I speak of would not be difficult. Brethren, if you will not hearken to wholesome counsel, you shall be the more inexcusable… Therefore love the truth and peace, Yea, seek peace and pursue it. Consider what I say. The Lord guid your feet in the way of peace. And O that God would put it in your hearts to cry down toleration and to cry up accommodation!</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/george-gillespie.html">George Gillespie</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Wholesome Severity Reconciled with Christian Liberty (London, 1645) | A Paraenetic</cite></span></figcaption>

</figure><figure class="quote" id="q-13395f7f0e" data-kw="">
<blockquote><p>Because, where the doctrine itself is sound and pure, and the ceremonies used to a civil honesty and decency, the inconveniences are rather to be passed by in silence than that by occasion of them men should proceed to contentions and more grievous tumults; Calvin, Epistle 303, fol. 497. Because, albeit these things be not to be approved, yet, sometimes these indifferent things, howsoever offensive and burdensome, are to be born withal, so far forth (quoad aliter non liceat) as conveniently we cannot do otherwise, lest if men contend about them more bitterly then they ought, it be both an hindrance to the progress of the Gospel, and the things which in their own nature are indifferent, be taught by our vehement contention to be plainly wicked; which two points do bring with them most grievous inconveniences; P. Martyr to [John] Hooper, Common Places, folio 1086 [p. 117]. And therefore these things which the pastors cannot change, they should rather bear withal, than by forsaking the Church for that cause they should give occasion for far greater and more dangerous mischiefs unto Satan, who seeks nothing else; Beza, Epistle 12, fol. 99. … Because we must give place unto the sway of the times wherein we live, so far forth as may stand with keeping faith and a good conscience, Acts 28:11; 19:10, 26; 15:28-29; Master [William] Perkins, Cases of Conscience, bk. 3, ch. 2, fol. 482-83. Because if we cannot do the good that most we desire, in such exquisite manner as we would, we must content ourselves with the mean, and in things which are good and to be done, it is the safest course to satisfy ourselves in doing the less, lest in venturing to do the more, which cannot be, we grow to the extremity, and so fail or offend in our action, Eccl. 7:16; read the proofs: Perkins, Cases of Conscience, bk. 3, ch. 2, fol. 483-86.</p></blockquote>

selves+in+doing+the+less%2C+lest+in+venturing+to+do+the+more%2C+which+cannot+be%2C+we+grow+to+the+extremity%2C+and+so+fail+or+offend+in+our+action%2C+Eccl.+7%3A16%3B+read+the+proofs%3A+Perkins%2C+Cases+of+Conscience%2C+bk.+3%2C+ch.+2%2C+fol.+483-86.%E2%80%9D%0A%0A%E2%80%94+John+Sprint%2C+Cassander+Anglicanus%2C+showing+the+Necessity+of+Conformity+to+the+Prescribed+Ceremonies+of+our+Church+in+Case+of+Deprivation+%28London%3A+Bill%2C+1623%29+%7C+%E2%80%98Reformed+Practices%E2%80%99%2C+pp.+163-65&amp;url=https%3A%2F%2F5solasquotes.github.io%2Fquote%2F13395f7f0e.html&amp;via=5Solas" target="_blank" rel="noopener">Share on X</a><a class="perma" href="../quote/13395f7f0e.html">Permalink</a><a class="src" href="https://reformedbooksonline.com/on-impurities-in-worship/#:~:text=Because%2C%20where%20the%20doctrine%20itself%20is,bk.%203%2C%20ch.%202%2C%20fol.%20483%2D86." rel="noopener" target="_blank">Read it online · Reformed Books Online</a></div>

<blockquote><p>[Johannes G.] Vos says taking the [Scottish, civil] indulgence [in 1669-1688] involved ‘becoming Episcopalians’ and was ‘a compromise with an unscriptural form of Church government…’ Such ‘must be regarded as a sacrifice of principle… they compromised with prelacy.’ This is to confound material actions with their formal ends. The indulged ministers did not necessarily sacrifice or compromise any principle or become anything but presbyterians acting under limitations of a partially unscriptural form of external Church government. If Vos’s slurs were true, that anyone who materially accommodates and cooperates with rulers acting under erroneous principles, sinfully sacrifices principles and becomes as their rulers: would not the old Jewish Church of God, with intrinsic, divine-right Church government, ruled by their Erastian Babylonian rulers in their captivity (in a broken and declining state), have been in sin for so accepting that Erastian supremacy, at the very command of God (Jer. 27:12–13; 29:4–7)? The Erastian, absolutist, civil rulers over the Jews in Christ’s time dictated and changed who was the Jewish, episcopal high priest at their will, contrary to God’s ordinance (Lev. 16:32; Num. 20:25–28; 35:25). Yet they allowed Christ and the apostles to otherwise exercise their ministry freely while practicing presbyterianism (Lk. 7:3; Mt. 18:15–20), alongside the overseeing priests, or bishops (Mt. 26:3, 57; Mk. 11:27; Lk. 20:1). Though Christ and the apostles suffered greatly under these bishops (Mt. 16:21; 27:1; Mk. 8:31), yet without fleeing (Mt. 26:47–57; Jn. 18:4–8; Acts 16:25–30; 21:13), they appeared at their courts (Mt. 21:23; 26:59; Acts 21:13; 25:11) in that broken and declining state of the Church. Question: On Vos’s premise, were not Christ, the apostles and the whole Jewish Church in sin for cooperating under these restrictions? Would not churches today which cooperate under American rulers acting under erroneous principles be guilty of all their rulers’ errors? Say if churches limit (or do not exercise) their own liberty in some ways to comply with over-reaching government restrictions about a spreading disease, so churches may prevent worse things (such as being shut down, or scandalizing unbelievers they are seeking to win to the Gospel), are they therefore guilty of their rulers’ errors? Perhaps some will affirm this, as many have. When you accommodate your boss’s unnecessary restrictions at work for the greater good, are you sacrificing God’s divine-right of governance over you and you are guilty of your boss’s errors? Are you divinely obliged to suffer the consequences of getting fired and hazarding your family’s survival every time your company wants you to do something not fully in accord with God-prescribed, right reason?</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/travis-fentiman.html">Travis Fentiman</a></span><span class="wk"><span class="lbl">Work:</span> <cite>“Editor’s Extended Introduction” in English Puritans, A Refutation of the Errors of Separatists (1604; RBO, 2025)</cite>, pp. 133-34</span></figcaption>

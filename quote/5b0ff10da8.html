<blockquote><p>The ritual of Calvinism, like its creed, was founded, therefore, on the theory of a simple return to the scriptural and primitive pattern. Differing from the systems of Luther and [the English] Cranmer, it lost sight completely of all practices which had originated in a less remote antiquity; it left the missal and the breviary [Romanist responsive, liturgical books] among the rubbish of ‘idolatrous gear’ swept out from its renovated churches; refusing to tamper with the complications of a corrupt ceremonial, whose forms had long enough weighed upon and wearied the souls of men. It went back for authority and inspiration to the law and to the testimony of God.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/switzerland-geneva.html">Charles Baird</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Eutaxia</cite></span></figcaption>

</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-739cd44fcb" data-kw="">
<blockquote><p>1. The word ‘church’ [say the Independents] signifies always a gathered together church, or such as may gather together, Acts 11:26, a whole year they assembled with the Church, Acts 20:7, the disciples came together to break bread; so Acts 1:10; 2:44,46; Acts 5:12; 15:25. [Rutherford’s] Answer: [1.] Our brother Mr. [George] Gillespie (Assertion of the Government of the Church of Scotland, pt. 2, ch. 3, p. 141-42) says many interpreters expound [in Greek], ‘they were together’, that is, of one accord in love and amity: and also [physical] churches not being builded, and they meeting in private houses, as in Mary’s house, Acts 12, school of Tyrranus, Acts 19:9, in an upper chamber, Acts 20:8, Paul’s lodging at Rome, Acts 28:13. What private houses (Acts 10:9) could ordinarily contain so many thousands?

2. The Scripture speaks so [as] to give us an example of the public meeting for public worship where it is not needful that all met in one place collectively; it is enough they meet all distributively.

3. Neither does the word ‘church’ always signify a meeting of one single congregation, as Acts 12:5; prayers were made [for Peter in jail] by the church, that is by all professors [throughout Jerusalem]. Herod vexed the church, Acts 8:3. Saul made havoc of the church; ‘I persecuted the Church.’ (1 Cor. 15:9) There is no necessity to expound these of people meeting ordinarily to worship God; for Herod and Saul persecuted all, whither apostles or professors in houses, not respecting their meeting in one place; Also [that] it shall follow that prayers were not made in private, but only in the church, that is, in the convened congregation for Peter, which is absurd: And that they were a visible-church is clear, else Herod and Saul could not persecute them.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/samuel-rutherford.html">Samuel Rutherford</a></span><span class="wk"><span class="lbl">Work:</span> <cite>A Peaceable &amp; Temperate Plea for Paul’s Presbytery in Scotland</cite>, … (1642), ch. 7, ‘If there be No True Visible Church in the New Testament, but Only a Congregation Meeting in One Place, &amp; No Presbyterial or Representative Church (as They Call it) at All’, p. 81 Rutherford is arguing against the novel Independent Church government. See also the chapter at large.</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/worship/public-worship.html">Public Worship</a></span></div>

</figure><figure class="quote" id="q-07a400f136" data-kw="">
<blockquote><p>1. Our [Independent] Brethren say [that] it is… another thing to say [as the presbyterians] that it was impossible that they [the Christians in Jerusalem in Acts] could be one congregation and meet in one place… [Rutherford’s] Answer: …now the question then is… whether or no[t] was the Church at Jerusalem of such a competent number, only as that they could meet not only occasionally to hear a sermon, but in an ordinary Church-meeting, to hear the Word and communicate in the breaking of bread and seals of the Covenant; and though the want [lack] of a capacious house be also an extrinsic impediment why they could not meet… but it cannot be said that they wanted a capacious house for the ordinary meeting of a congregation, the ordinary and genuine use whereof is to be edified by the Word and sacraments; and that an ordinary house could contain such a number of thousands and multitudes as can be edified in a congregational way is denied.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/samuel-rutherford.html">Samuel Rutherford</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Due Right of Presbyteries, ‘Acts 15, A Pattern of a Juridicial Synod’</cite>, … (1644), pt. 1, pp. 426-27</span></figcaption>

 Books Online</a></div>
</figure><figure class="quote" id="q-ee7f641456" data-kw="">
<blockquote><p>Because there is a difference betwixt carrying the colors [banner or flag] in an army tali modo [in such a way] as all the army at once may see the colors, and the carrying of the colors. Yet the colors are a note-visible of such an army: so there is a difference betwixt preaching the Word, simpliciter, and preaching the Word, tali modo, ‘in such a way’ in one material house only. And therefore it is necessary that government which concerns many Churches consociated, be in its exercise hic &amp; nunc [here and now], larger than preaching of the Word in its exercise, hic &amp; nunc: which cannot be done but to a multitude which convenes epi to auto, ‘to the same material place’. And we see an act of government, Acts 15, by confession of our [Independent] Brethren, belonging to diverse consociated Churches and performed by them, and yet these cannot ordinarily meet to one and the same place in all their members for hearing of the Word.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/samuel-rutherford.html">Samuel Rutherford</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Due Right of Presbyteries, ‘Acts 15, A Pattern of a Juridicial Synod’</cite>, … (1644), pt. 1, pp. 303-304</span></figcaption>

<blockquote><p>The Schoolmen are generally for the negative, and so are many able Protestant Divines: Rivet (in Gen. 28, Exercitation 125 and in his Jesuita Vapulans), Capel (in Thes. Theol. Salmur), Mr. Cartwright (Against the Rhemists, on Heb. 7:4 and in his Necessity of Discipline). Mr. [John] Dod, Bishop [George] Carleton, Dr. [John] Prideaux, Dr. [William] Sclater [I] and Mr. Whateley, were for the affirmative.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/edward-leigh.html">Edward Leigh</a></span><span class="wk"><span class="lbl">Work:</span> <cite>‘Of Pastors: of their Maintenance’ in Body of Divinity</cite>, p. 461 (1654)</span></figcaption>

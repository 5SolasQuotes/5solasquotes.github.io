<main class="wrap"><figure class="quote" id="q-c547aa3f1d" data-kw="">
<blockquote><p>That which is a certain mark of our freedom from the covenant of works, and our title to the privileges of the covenant of grace, must needs also infer our union with Christ, and special interest in him; but the giving or indwelling of the sanctifying Spirit in us, is a certain mark of our freedom from the first covenant, under which all Christless persons still stand, and our title to the special privileges of the second covenant, in which none but the members are interested; and, consequently, it fully proves our union with the Lord Jesus. This is plain from the apostle’s reasoning Gal. 4:6, 7. “And because ye are sons, God has sent forth the spirit of his Son into your hearts, crying, Abba Father: Wherefore thou art no more a servant, but a son: and if a son, then an heir of God, through Christ.”

The spirit of the first covenant was a servile spirit, a spirit of fear and bondage, and they that were under that covenant were not sons, but servants; but the spirit of the new covenant is a free, ingenuous spirit, acting in the strength of God, and those that do so, are the children of God; and children inherit the blessed privileges and royal immunities contained in that great charter, the covenant of grace: they are heirs of God, and the evidence of this their inheritance, by virtue of the second covenant, and of freedom from the servitude and bondage of the first covenant, is the Spirit of Christ in their hearts, crying, Abba Father; So Gal. 5: 18. “If ye be led by the Spirit, ye are not under the law.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/john-flavel.html">John Flavel</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Method of Grace in the Gospel-Redemption</cite>, (1699) in The Works of John Flavel (1820; 6 vols, London: Banner of Truth: 1968), 2: 332.</span></figcaption>

<blockquote><p>Why then does He punish with perdition? No otherwise than as some just judge, that would have all men live regularly, and free from disorders; but having transgressed the laws, justice compels him, and that by a good and rectified will, to punish them. Some would have this will of God to be velleitatem [willingness] rather than voluntatem [will]; not so much an absolute will and resolution, as a willingness and desire: not unlike a merchant’s casting his freight overboard in a dangerous tempest. He would willingly save them, and yet he is willingly content to lose them, says one.</p></blockquote>

</figure><figure class="quote" id="q-fb0e36da0c" data-kw="">
<blockquote><p>The Scriptures of truth give no uncertain sound; there is nothing indefinite or ambiguous in them, no collision between the statements and descriptions of one inspired writer and another. The goodness of which they speak is a goodness which they describe in all its parts, and all its principles, and all its manifestations, with the most perfect harmony and mutual agreement—a goodness which is the same in every age and under every dispensation, in every rank of life and every state of society.

When they speak of Joseph of Arimathea, and Barnabas, and others, and say of them that they were “good” men, they use the epithet in a sense which they themselves have unfolded with the utmost clearness and precision; they speak of the goodness of these men of God according to that standard of truth and righteousness which is immutable as the throne of the Almighty, eternal as the character and attributes of Jehovah—of goodness manifested, not in one or a few particulars of life and conduct, but in all the dispositions, and graces, and conduct of the children of God. They speak of it, not as existing perfect and immaculately pure in this lower world, but as the goodness of the saints, the excellent ones of the earth, the sons of God and the followers of Christ, in contradistinction from those specious appearances which attract the notice and admiration of men, but are “abomination in the sight of God.”

In common conversation we are accustomed to use the epithet “bad,” as applicable only to men of the most abandoned character, but we ought never to forget that before God the whole world is divided into two classes, the good and the bad, the righteous and the wicked; the former comprehending in it the children of God in all the degrees of moral excellence to which they have attained, and the latter, the children of the wicked one, from the mere moralist on the one hand, to the most profligate and abandoned criminal on the other.

Goodness, in the Scripture sense of the word, is holiness; it is the goodness which God enjoins, and of which he himself presents the most perfect pattern—the goodness which, begun on earth in the regeneration of the true Christian, is accepted and approved through Christ Jesus, and which, increasing with the increase of God, is perfected at last in his presence in heaven.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/patrick-macfarlan.html">Patrick MacFarlan</a></span><span class="wk"><span class="lbl">Work:</span> <cite>On Goodness in The Free Church Pulpit; Consisting of Discourses by the Most Eminent divines of the Free Church of Scotland. Vol. I.</cite></span></figcaption>

</figure><figure class="quote" id="q-9a21d7ce66" data-kw="">
<blockquote><p>The covenant of grace partakes both of a testament and of a covenant. Hence it is not improperly called “a covenant by a testament,” “a testamentary covenant” and a “federal testament.” It is a covenant because after the manner of a covenant there was an agreement between parties and conditions were laid down on both sides, both on the part of God and on the part of man, and there was a mediator to reconcile the discordant parties. But it is also a “testament” (1) because it is a covenant in which an inheritance is promised (which necessarily demands the antecedent death of the testator, since he only then is reckoned an heir who obtains the goods by an intervention of the will of the disposer). Since therefore the covenant (diathēkē) is a promise (epangelia) of this kind (in virtue of which the inheritance is discerned), it must necessarily be testamentary. On this account, the apostle adds, “For where a diathēkē is [to wit, by which an inheritance is promised, i.e., a testament], there must also of necessity be the death of the testator.” (2) Because for our advantage only was this covenant made, as in a testament the advantage not of the testator but of the heirs is regarded; nor is God reconciled concerning mutual benefits, but concerning his own alone. (3) Because although conditions are set forth on both sides, they are entrusted for execution to the virtue and fidelity of only one party (namely, of God). Hence it is founded upon the mere grace of God and upon no disposition and merit of man (as will be fully proved in the proper place).</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/francis-turretin.html">Francis Turretin</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Institutes of Elenctic Theology</cite>, ed. James T. Dennison Jr., trans. George Musgrave Giger (Phillipsburg, NJ: P&amp;R Publishing, 1992–97), 12.1.3.</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/the-covenant-of-grace.html">The Covenant of Grace</a></span></div>
<div class="actions"><button class="copy" data-copy="“The covenant of grace partakes both of a testament and of a covenant. Hence it is not improperly called “a covenant by a testament,” “a testamentary covenant” and a “federal testament.” It is a covenant because after the manner of a covenant there was an agreement between parties and conditions were laid down on both sides, both on the part of God and on the part of man, and there was a mediator to reconcile the discordant parties. But it is also a “testament” (1) because it is a covenant in which an inheritance is promised (which necessarily demands the antecedent death of the testator, since he only then is reckoned an heir who obtains the goods by an intervention of the will of the disposer). Since therefore the covenant (diathēkē) is a promise (epangelia) of this kind (in virtue of which the inheritance is discerned), it must necessarily be testamentary. On this account, the apostle adds, “For where a diathēkē is [to wit, by which an inheritance is promised, i.e., a testament], there must also of necessity be the death of the testator.” (2) Because for our advantage only was this covenant made, as in a testament the advantage not of the testator but of the heirs is regarded; nor is God reconciled concerning mutual benefits, but concerning his own alone. (3) Because although conditions are set forth on both sides, they are entrusted for execution to the virtue and fidelity of only one party (namely, of God). Hence it is founded upon the mere grace of God and upon no disposition and merit of man (as will be fully proved in the proper place).”

— Francis Turretin, Institutes of Elenctic Theology, ed. James T. Dennison Jr., trans. George Musgrave Giger (Phillipsburg, NJ: P&amp;R Publishing, 1992–97), 12.1.3.">Copy</button><a class="share" href="https://x.com/intent/post?text=%E2%80%9CThe+covenant+of+grace+partakes+both+of+a+testament+and+of+a+covenant.+Hence+it+is+not+improperly+called+%E2%80%9Ca+covenant+by+a+testament%2C%E2%80%9D+%E2%80%9Ca+testamentary+covenant%E2%80%9D+and+a+%E2%80%9Cfederal+testament.%E2%80%9D+It+is+a+covenant+because+after+the+manner+of+a+covenant+there+was+an+agreement+between+parties+and+conditions+were+laid+down+on+both+sides%2C+both+on+the+part+of+God+and+on+the+part+of+man%2C+and+there+was+a+mediator+to+reconcile+the+discordant+parties.+But+it+is+also+a+%E2%80%9Ctestament%E2%80%9D+%281%29+because+it+is+a+covenant+in+which+an+inheritance+is+promised+%28which+necessarily+demands+the+antecedent+death+of+the+testator%2C+since+he+only+then+is+reckoned+an+heir+who+obtains+the+goods+by+an+intervention+of+the+will+of+the+disposer%29.+Since+therefore+the+covenant+%28diath%C4%93k%C4%93%29+is+a+promise+%28epangelia%29+of+this+kind+%28in+virtue+of+which+the+inheritance+is+discerned%29%2C+it+must+necessarily+be+testamentary.+On+this+account%2C+the+apostle+adds%2C+%E2%80%9CFor+where+a+diath%C4%93k%C4%93+is+%5Bto+wit%2C+by+which+an+inheritance+is+promised%2C+i.e.%2C+a+testament%5D%2C+there+must+also+of+necessity+be+the+death+of+the+testator.%E2%80%9D+%282%29+Because+for+our+advantage+only+was+this+covenant+made%2C+as+in+a+testament+the+advantage+not+of+the+testator+but+of+the+heirs+is+regarded%3B+nor+is+God+reconciled+concerning+mutual+benefits%2C+but+concerning+his+own+alone.+%283%29+Because+although+conditions+are+set+forth+on+both+sides%2C+they+are+entrusted+for+execution+to+the+virtue+and+fidelity+of+only+one+party+%28namely%2C+of+God%29.+Hence+it+is+founded+upon+the+mere+grace+of+God+and+upon+no+disposition+and+merit+of+man+%28as+will+be+fully+proved+in+the+proper+place%29.%E2%80%9D%0A%0A%E2%80%94+Francis+Turretin%2C+Institutes+of+Elenctic+Theology%2C+ed.+James+T.+Dennison+Jr.%2C+trans.+George+Musgrave+Giger+%28Phillipsburg%2C+NJ%3A+P%26R+Publishing%2C+1992%E2%80%9397%29%2C+12.1.3.&amp;url=https%3A%2F%2F5solasquotes.github.io%2Fquote%2F9a21d7ce66.html&amp;via=5Solas" target="_blank" rel="noopener">Share on X</a><a class="perma" href="../quote/9a21d7ce66.html">Permalink</a><a class="src" href="https://heidelblog.net/2016/05/turretin-on-covenant-and-testament/" rel="noopener" target="_blank">Read it online · Heidelblog</a></div>
</figure><figure class="quote" id="q-32484f2f45" data-kw="">
<blockquote><p>The Reformed orthodox describe God’s love as an act of the divine will or a movement toward the good–both toward the good in itself and toward the good as it is embodied in the creature. Indeed, the predications of will, love, and goodness conjoin in the basic definition, granting that the divine will is God’s propensity for the good that is ultimately the divine essence itself as the source of all good–and amor [love], strictly defined, is a propensity for the good (Mastricht, Theoretico-practica theol., II.xvii.3, 4, 6; cf. Brakel, Redelijke Godsdienst, I.iii.33. Note the similar definitions in Arminius, Disputationes privatae, XX.iii-iv.), or a desire or ‘appetite for union.’ (Heidanus, Corpus theol., II (p. 172).)</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/richard-muller.html">Richard Muller</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Post-Reformation Reformed Dogmatics</cite>, (Baker Academic, 2003), vol. 3, pp. 564-65</span></figcaption>

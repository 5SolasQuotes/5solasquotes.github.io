<main class="wrap"><figure class="quote" id="q-41308f88c5" data-kw="">
<blockquote><p>John does not, indeed, wish us to be rash in judging who has committed such a sin; rather, he the more inflames us to pray for all, because it is not easy to say of whom God is unwilling to forgive. But this sin is without doubt the hatred of the gospel on account of lusts, after someone has heard it, been convinced of its truth, and even rejoiced because of that hearing. John does not reproach compassion toward those who perish, but he wishes the godly finally to rest content with the judgments of God, and not to grieve and labor in vain. Yet he does not wish them to desist from praying, until that bitter root of an evil conscience—blessing itself, opposing the truth of the gospel, and attempting to drag back those who have been delivered into bondage—has manifested itself.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/johannes-cocceius.html">Johannes Cocceius</a></span><span class="wk"><span class="lbl">Work:</span> <cite>All the Works</cite>, 3rd ed. (d. 1669; Amsterdam, 1701), vol. 6, separate pagination, on 1 John 5, sect. 18 on v. 16, pp. 10-11 Trans. Chatgpt-5</span></figcaption>

</figure><figure class="quote" id="q-1cd6b34de3" data-kw="unpardonable">
<blockquote><p>This was opposed by the decree of the National Synod which met at Charenton in 1644, which sanctioned and confirmed the doctrine received in our churches concerning the imputation of Adam’s first sin and the hereditary corruption flowing upon all. The words of the decree are as follows: “Whereas a report has been made to the Synod of certain writings, printed and manuscript, by which the nature of original sin is made to consist solely in the hereditary corruption, originally residing in all men, but the imputation of the first sin of Adam is denied; the Synod condemns the aforesaid doctrine so far as it restricts the nature of original sin to the mere hereditary corruption of Adam’s posterity, excluding the imputation of the first sin by which he fell; and, under the penalty of censures of all kinds, forbids all pastors, professors and others who may treat this subject, to depart from the common opinion of all Protestant churches, which, besides corruption, have always acknowledged the aforesaid imputation to the whole posterity of Adam.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/francis-turretin.html">Francis Turretin</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Institutes of Elenctic Theology</cite>, 9.9</span></figcaption>

</figure><figure class="quote" id="q-cb5e6683ca" data-kw="">
<blockquote><p>But wilful sinner, how actest thou? To oppose the counsel and command of the Lord with all the heart, and mind, and soul. To love and follow and commit wickedness with all the heart, and mind, and soul. If this be not a deadly wound under the fifth rib, a mortal plague at the bottom of the will, what can you call the plague of the heart?… Every wilful sinning does add more hardness and more wilfulness of sinning to the heart still. A hard heart does harden by sinning: and the more the sin is wilful, the more the heart gathers hardness… So do wilful sinnings draw on one another, and from one the heart is emboldened to another.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/john-lightfoot.html">John Lightfoot</a></span><span class="wk"><span class="lbl">Work:</span> <cite>‘A Sin Unto Death, a Sermon’ on 1 Jn. 5:16</cite>, (1666) in Whole Works, ed. Pitman (1822), vol. 6, pp. 331-45, p. 1099</span></figcaption>

</figure><figure class="quote" id="q-264b86fd28" data-kw="">
<blockquote><p>Whatsoever sin we see in the world, let us pray, and not despair; for God is the God of mercy. But for the sin to death, which is resisting grace, and fighting against mercy, and open blaspheming of the Holy Ghost, affirming that Christ’s miracles are done in Beelzebub, and his doctrine to be of the Devil, I think that no Christian man, if he perceive it, can otherwise pray than as Paul prayed for Alexander the coppersmith (2 Timothy, the last), ‘that God would reward him according unto his works.’ They that go back again after they know the truth, and give themselves willingly to sin for to follow it, and persecute the doctrine of truth by profession to maintain falsehood for their glory and vantage, are remediless: as ye may see: Heb. 6 and 10. Balaam sinned so; the false prophets in the Old Testament sinned so; the Pharisees sinned so; Alexander sinned so; and now many sin so, following their pride and covetousness.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/william-tyndale.html">William Tyndale</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Expositions &amp; Notes on Sundry Portions of the Holy Scriptures</cite>, … (d. 1536; Cambridge: Parker Society, 1849), The Exposition of the First Epistle of St. John, on 1 Jn. 5:16-17, p. 212</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/sin/degrees-of-sin.html">Degrees of Sin</a></span></div>

<main class="wrap"><figure class="quote" id="q-4a83be204a" data-kw="decree efficient exemplar">
<blockquote><p>Since then they cannot belong to God accidentally, we must necessarily say that they are in him essentially, as immanent acts of his will with a relation and termination outside of him. … Efficient because all future things are for this reason future—that God has decreed them (nor can any prior cause of his works be assigned). Exemplar because the decree of God is (as it were) the idea of all things out of himself.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/francis-turretin.html">Francis Turretin</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Institutes of Elenctic Theology</cite>, 4.1.7</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/the-decrees-of-god/extent.html">Extent</a> › <a href="../topics/the-decrees-of-god/extent/decree-and-secondary-causes.html">Decree and secondary causes</a></span><span class="t"><a href="../topics/the-decrees-of-god/extent.html">Extent</a> › <a href="../topics/the-decrees-of-god/extent/all-things-including-sin-and-free-acts.html">All things, including sin and free acts</a></span></div>

</figure><figure class="quote" id="q-86e8b1fd52" data-kw="Permission Author of sin Holiness The Fall">
<blockquote><p>The almighty power, unsearchable wisdom, and infinite goodness of God, so far manifest themselves in His providence, that His determinate counsel extends itself even to the first fall, and all other sinful actions both of angels and men (Rom. 11:32–34; 2 Sam. 24:1; 1 Chron. 21:1); and that not by a bare permission, which also He most wisely and powerfully bounds, and otherwise orders and governs (2 Kings 19:28; Ps. 76:10), in a manifold dispensation to His most holy ends (Gen. 50:20; Isa. 10:6–7, 12); yet so, as the sinfulness of their acts proceeds only from the creatures, and not from God, who, being most holy and righteous, neither is nor can be the author or approver of sin (Ps. 50:21; 1 John 2:16).</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/particular-baptists.html">Particular Baptists</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Second London Baptist Confession of Faith</cite>, 1689, 5.4</span></figcaption>

</figure><figure class="quote" id="q-a0bf0ad744" data-kw="supralapsarian">
<blockquote><p>They who ascend above the fall (supra Lapsum) or creation to determine the object of predestination think … the decree of predestination should be made to precede the decree of creation and the permission of the fall. … Although this order contains nothing absolutely repugnant to the foundation of salvation and the analogy of faith … yet various objections hinder its reception.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/francis-turretin.html">Francis Turretin</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Institutes of Elenctic Theology</cite>, 4.18.4–5</span></figcaption>

</figure><figure class="quote" id="q-203bb6b5d2" data-kw="Author of sin">
<blockquote><p>Although the premotion of God is extended to evil actions, it does not on that account make God guilty of the fault or the author of sin. It only pertains to actions inasmuch as they are material and entitative (entitative), not however as they are moral, i.e., to the substance of the act, but not to its wickedness. … The magistrate is the cause of the death inflicted on the guilty person by the executioner, but is not the cause of the cruelty exhibited in that execution; the harp player is the cause of the sound, but not of the dissonance arising from the strings; and he who drives a lame horse is the cause of the motion, but not the lameness.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/francis-turretin.html">Francis Turretin</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Institutes of Elenctic Theology</cite>, 6.5.16</span></figcaption>

<main class="wrap"><figure class="quote" id="q-78e3553ba9" data-kw="">
<blockquote><p>2. The second precept is a rule of our whole worship of God, that we worship not God with any kind of worship besides that wherewith he commanded Himself to be worshipped: wherefore it commands the true and forbids all the fained and false worship of God, especially idols and images made to represent and worship God: also negligence of magistrates, whereby images or other instruments, which either do or may easily serve to idolatry, are tolerated in places subject to their authority, much more the worship of them; also hypocricy and prophaness.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/zachary-ursinus.html">Zachary Ursinus</a></span><span class="wk"><span class="lbl">Work:</span> <cite>A Collection of Certain Learned Discourses</cite>, p. 267 of 20, ‘Of the Six First Commandments’ in Rules &amp; Axions of Certain Chief Points of Christianity in A Collection of Certain Learned Discourses… (d. 1583; Oxford, 1600)</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/the-christian-life/obedience-and-profession.html">Obedience and Profession</a></span></div>

</figure><figure class="quote" id="q-dcd0422f7c" data-kw="">
<blockquote><p>I may say as Augustine did, though a good conscience be sufficient for myself, yet a good name is necessary for others; a good name is as precious ointment, yet there will not be wanting many flying reports to corrupt it; many are the obloquies and reproaches which by the sons of slander are cast upon me, they would fain have my name to be buried and rot above ground, before my friends can bury my body under it, yet herein is my comfort: there will be a resurrection of names as well as of bodies at the Last Day; I am assured that God will not only wipe off all tears from mine eyes, but all reproaches from my name also; I am, as says the apostle, counted a deceiver, yet true; as an apostate, yet firm to my first principles.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/christopher-love.html">Christopher Love</a></span><span class="wk"><span class="lbl">Work:</span> <cite>A Clear &amp; Necessary Vindication of the Principles &amp; Practices of me, Christopher Love, since my trial before, and condemnation by the High Court of Justice</cite>, (London, 1651), p. 1</span></figcaption>

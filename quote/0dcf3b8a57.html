<main class="wrap"><figure class="quote" id="q-0dcf3b8a57" data-kw="">
<blockquote><p>There are on the contrary, those things that pass from parent to child, which the parent by nature or special privilege, hath power to convey, as

1. The essential or integral parts of a species, with the natural properties, that do accompany it, so one brute beast brings forth another, one bird brings forth another, and man brings forth one of man-kind.

2. The privileges or burdens, which in Family or Nation are hereditary, they are conveyed from parents to posterity, from Ancestors to their Issue: As is the father, so is the child, as respecting these particulars: The child of a Free-man with St Paul is free born: The child of a Noble man is noble; The child of a bond-man (where servants were wholly their Masters to dispose) is a bond-man likewise. So the child, of a Turk is a Turk; The child of a Pagan is a Pagan; The child of a Jew is a Jew; The child of a Christian is a Christian: As by virtue of the grand Charter of Heaven among the people of God, this privilege doth descend: So it is of the nature of those things that are descendible.

3. The name of Jew or Christian would not long hold in any family, among any people, if this truth (that there is a generation, according to the flesh, which have this privilege to be accounted of the people of God) may not be yielded, but as it is in trades, the father is of one, the son of another, so we should see it in religions: But God provideth for a continuance in succession, from age to age, from generation to generation; he keeps them still within Covenant, though many do degenerate.

But some say, all this is blown away at one breath: That the Jews had this privilege cannot be denied. But this was a privilege peculiar to the seed of Abraham’s flesh, and not to the seed of his saith: Believing Jews had this birthright-privilege, Believing Christians have not, they must make profession of their faith before they be accounted among them that be holy.

I answer, Such a grant God did once vouchsafe by free Charter to his people: How can it be made appear that ever it was reversed, or any such limit put unto it? The Church of God hath held it in Fee by virtue of this grant from Abraham to this very hour, and there is no word of God to challenge them for usurpation; They that will out us of so long possession, must make their plea punctual for our eviction.

Secondly, Christians can produce new Covenant-advancing Scriptures, that Christ’s coming put them into a better and more comfortable condition then were believers in former ages: I would fain have them to produce any one new Covenant-depressing Scripture, to shew that we in any case are in a worse or more uncomfortable condition then our fathers. If it be said that though this Birth-privilege be taken away, yet we are not in a worse condition having it in other more desirable things enlarged.

Let these then shew when, and where this was taken away, and what was given in lieu and recompense of this want, and greatest discomfort that can come to a parent, as a parent, to have his issue expunged out of the number of God’s people who are holy: Let them produce those Scriptures, which so difference the old and new Covenant made with believers, that the one should be perpetual, the other personal; That the Covenant with the Jew shall transcend the Covenant with Christians, as an Inheritance for ever exceeds a Grant for term of life:

Let them give us an hint of any Reason why this privilege should belong to the heirs of Abraham’s body, and not to the heirs of his faith. That reason held forth by some, that Christ should come out of his loins is of no force, it excludes all the tribes out of that privilege but Judah, when every tribe of Israel in this were equal with Judah, every family of Judah’s tribe but David’s; And most of all, it would have excluded the seed of the Proselytes, that according to the flesh were strangers to Israel, when yet in this privilege they were equal.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/thomas-blake.html">Thomas Blake</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The birth-privilege, or, Covenant-holiness of believers and their issue in the time of the Gospel together with the right of infants to baptism</cite>, (London: Tho. Underhill, 1644), pp 5-7.</span></figcaption>

</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-9341b243da" data-kw="">
<blockquote><p>Now it remains to address the Magistrate, whom I judge can be described as a person chosen and instituted by God to defend the divine laws in matters of external discipline, by inflicting bodily punishment upon transgressors and by supporting and encouraging the good. The divine plan selects many people who do not act as magistrates. The ministers of the Church are one example. They still defend God’s word and laws, but not only in matters of external instruction. It is the duty of ministers to reach into the depths and motions of souls by way of the divine word. The Holy Spirit acts here as well, joining His strength with that of orthodox preaching and of the sacraments distributed by the Church.

The magistrate works alone in edifying and punishing transgressors. The minister binds the guilty and the incorrigible in the name of God, and excludes them from the kingdom of Heaven unless they correct their ways. The magistrate inflicts external punishment, working through the use of the sword. Both ministers and magistrates act to nurture the pious, but in different ways. The magistrate increases them in works, honours and merits. The minister consoles them through the promises of God and the sacraments.

The magistrate assures that the laws are kept most carefully, the guilty are punished, and the good are both helped and nurtured. The law acts as a mute magistrate, while the magistrate represents the moving and speaking law. Certainly he is also a minister of God since, as Paul said, magistrates sing the praises of those who live justly [Romans 13:3]. The magistrate wields the sword against the wicked, acting as the avenger and champion of God, and looks to nothing else but the salvation of men.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/peter-martyr-vermigli.html">Peter Martyr Vermigli</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Of a magistrate, and the difference between civil and ecclesiastical power (1561) in W. J. T. Kirby (ed.), The Zürich Connection and Tudor Political Theology</cite></span></figcaption>

</figure><figure class="quote" id="q-b8491921ea" data-kw="">
<blockquote><p>Now it was seen, and made plain to the World, that the suffering People in Scotland acted upon on Principles of Enthusiasm, blind Zeal or religious Frenzy, as their Enemies suggested; that they were no Enemies to Monarchy, Civil Government, order of Society, and the like, as had been scandalously said; but that they kept strictly to the Rule of God’s Word, adhered to an honest Cause, and acted upon just Principles: And when such Kings were called to the Throne, as desired to Rule for God, and the Good of the People, who made the Laws of God and Man the Rule of their Government, and the Prosperity of Religion, and of their Subjects the End of it; they knew how to obey, serve and defend such Princes with the Blood and Treasure, as well as they had Courage to resist and reject those, who, with the Breach of Faith, Honour or Constitution, became Tyrants and Persecutors, Enemies to God, and Destroyers of Men, as their former Princes had been.

This is evident by their Practice, at the Revolution; in that no sooner was the Prince of Orange Landed in England, and the Enemies of our Constitution began to stagger, but these People immediately took Arms, and successfully chased the bloody Party, out of their Country. But when this was done, what Measures did they take? Did they set up KING JESUS as a Temporal Prince, and the fifth Monarchy in his Name? Did they Preach the Doctrine of Dominion founded on Grace, or form Schemes of Republican Government? Did they erect themselves as Tyrants in the Room of those they pulled down, so making the People change their Masters, not their Yoke?

NO, NO, they adhered to the Legal Constitution of their Country, they submitted cheerfully to the Return of Magistracy, and the free Course of the Laws of their Country, they armed themselves, and came up to Edinburgh at their own Charge, formed themselves into Companies; indeed, they were able to have formed a considerable Army, and offered themselves to March to any Part of the Nation against the Popish and Jacobite Party; and especially they offered, and were accepted, and admitted to Guard the Convention of Estates, against the Attempt of the Duke of Gordon, who at that Time commanded a Popish Garrison in the Castle of Edinburgh; and against all, of any Denomination that should attempt to Disturb them; and to the eternal Honour of the wild Antimonarchical, Enthusiastic, Lunatic Cameronians, for so their Enemies had called them; they were the first Men in Scotland, that addressed or petitioned the Convention of Estates, to Place the Crown of Scotland on the Head of their Delivered King WILLIAM, which was done accordingly; to the restoring of Religion, healing the Breaches of Scotland, and the utter Confusion of their Persecutors …</p></blockquote>

NO, NO, they adhered to the Legal Constitution of their Country, they submitted cheerfully to the Return of Magistracy, and the free Course of the Laws of their Country, they armed themselves, and came up to Edinburgh at their own Charge, formed themselves into Companies; indeed, they were able to have formed a considerable Army, and offered themselves to March to any Part of the Nation against the Popish and Jacobite Party; and especially they offered, and were accepted, and admitted to Guard the Convention of Estates, against the Attempt of the Duke of Gordon, who at that Time commanded a Popish Garrison in the Castle of Edinburgh; and against all, of any Denomination that should attempt to Disturb them; and to the eternal Honour of the wild Antimonarchical, Enthusiastic, Lunatic Cameronians, for so their Enemies had called them; they were the first Men in Scotland, that addressed or petitioned the Convention of Estates, to Place the Crown of Scotland on the Head of their Delivered King WILLIAM, which was done accordingly; to the restoring of Religion, healing the Breaches of Scotland, and the utter Confusion of their Persecutors …”

<blockquote><p>The presbyterian government is more limited and less arbitrary than the independent government of single congregations, which, exempting themselves from the presbyterial subordination, and from being accountable to, and censurable by, classes or synods, must needs be supposed to exercise a much more unlimited or arbitrary power than the presbyterial churches do […]</p></blockquote>

— George Gillespie, Aaron’s rod blossoming; or, the divine ordinance of church government vindicated, (1646; Edinburgh, 1844), p. 84.">Copy</button><a class="share" href="https://x.com/intent/post?text=%E2%80%9CThe+presbyterian+government+is+more+limited+and+less+arbitrary+than+the+independent+government+of+single+congregations%2C+which%2C+exempting+themselves+from+the+presbyterial+subordination%2C+and+from+being+accountable+to%2C+and+censurable+by%2C+classes+or+synods%2C+must+needs+be+supposed+to+exercise+a+much+more+unlimited+or+arbitrary+power+than+the+presbyterial+churches+do+%5B%E2%80%A6%5D%E2%80%9D%0A%0A%E2%80%94+George+Gillespie%2C+Aaron%E2%80%99s+rod+blossoming%3B+or%2C+the+divine+ordinance+of+church+government+vindicated%2C+%281646%3B+Edinburgh%2C+1844%29%2C+p.+84.&amp;url=https%3A%2F%2F5solasquotes.github.io%2Fquote%2F8b3be8949a.html&amp;via=5Solas" target="_blank" rel="noopener">Share on X</a><a class="perma" href="../quote/8b3be8949a.html">Permalink</a><a class="src" href="https://reformedcovenanter.wordpress.com/2013/09/08/george-gillespie-on-independency-and-tyranny/" rel="noopener" target="_blank">Read it online · Reformed Covenanter</a></div>
</figure><figure class="quote" id="q-dc576be8fe" data-kw="">
<blockquote><p>Truly, the act involves the greatest inhumanity, that the one in need of necessities seeks a loan for the relief of his life, and the other, not satisfied with the capital, contrives revenues for himself from the misfortunes of the poor man and gathers wealth. The Lord has laid a dear command on us, saying: ‘And from him who would borrow of thee, do not turn away.’ But, the avaricious person, seeing a man by necessity bent down before his knees as a suppliant, practising all humility, and uttering every manner of petition, does not pity one who is suffering misfortune beyond his desert; he takes no account of his nature; he does not yield to his supplications; but, rigid and harsh he stands, yielding to no entreaties, touched by no tears, persevering in his refusal.

Calling down curses on himself and swearing that he is entirely without money, and is himself looking around to see if he can find someone who lends money out at interest, he is believed in his lie because of his oaths, and incurs the guilt of perjury as the evil gains of his inhumanity. But, when he who is seeking the loan makes mention of interest and names his securities, then, pulling down his eyebrows, he smiles and remembers somewhere or other a family friendship, and calling him associate and friend, he says, ‘We shall see if we have any money at all reserved. There Is a deposit of a dear friend who entrusted it to us for matters of business. He has assigned a heavy interest for it, but we shall certainly remit some and give it at a lower rate of interest.’

Making such pretenses, and fawning upon and enticing the wretched man with such words, he binds him with contracts; then, after having imposed on the man the loss of his liberty in addition to his oppressing poverty, he departs. As the borrower has made himself responsible for the interest, of whose full payment he has no idea, he accepts a voluntary servitude for life.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/st-basil.html">Basil of Caesarea</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Homily 12 on Psalm 14</cite>, 2 in Saint Basil’s Exegetic Homilies, trans. Agnes Clare Way in The Fathers of the Church: A New Translation, Volume 46 (Washington DC, 1963), pp 182-83.</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/civil-government-and-society/work-wealth-and-poverty.html">Work, Wealth and Poverty</a></span></div>

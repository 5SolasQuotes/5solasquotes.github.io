<main class="wrap"><figure class="quote" id="q-33c911faca" data-kw="">
<blockquote><p>Works are a cause of salvation: certainly [the term] ‘instrumental’ is more to be preferred than ‘efficient’.</p></blockquote>

</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-4689b0b30b" data-kw="">
<blockquote><p>So a holy person rejoiceth that the way of holiness is the appointed way to Heaven… he delights in the Gospel-constitution, because it requires universal holiness… This is solid rational religion, fit to be depended upon, in opposition to the antinomian licentiousness, the freaks of enthusiasm, and the irrational flights of passion and imagination on the one hand; and in opposition to formality, mere morality, and the self-sprung religion of nature on the other… Men are naturally averse to this Gospel method of salvation… they will endeavor to widen the way to Heaven, and persuade themselves they shall attain it, notwithstanding their continuance in some known iniquity, and though their hearts have never been thoroughly sanctified… How many give up their hopes of Heaven rather than part with sin… and must not such degenerate creatures be renewed ere they can be holy, or see the Lord!</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/samuel-davies.html">Samuel Davies</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Sermons</cite>, (Philadelphia, 1864), vol. 1, Sermon 9, ‘The Connection Between Present Holiness and Future Felicity’, on Heb. 12:14, pp. 277-78</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/good-works/necessity-of-good-works.html">Necessity of Good Works</a></span></div>

</figure><figure class="quote" id="q-d7f9c695a0" data-kw="">
<blockquote><p>And if you please further to infer that, because perseverance in sin of infidelity and impenitency, as they are the meritorious causes of damnation so they are the meritorious causes of the decree of damnation also: I think I may with as good reason take liberty to infer from the former, that seeing faith and repentance, yea and good works also are the disposing causes of salvation, therefore they are to be accounted the disposing causes of the decree of salvation, that is of our election also: And so your opinion shall appear at full and to life in his proper colors, not an hair’s breadth different, either from the Arminian heresy of late, or from the Pelagian heresy of old.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/william-twisse.html">William Twisse</a></span><span class="wk"><span class="lbl">Work:</span> <cite>A Discovery of Dr. Jackson’s Vanity</cite>, (1631), pp. 573-74</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/good-works/necessity-of-good-works.html">Necessity of Good Works</a></span></div>

</figure><figure class="quote" id="q-a63c435ec8" data-kw="">
<blockquote><p>We, indeed, allow that good works are required for righteousness; we only take away from them the power of conferring righteousness, because they cannot stand before the tribunal of God.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/john-calvin.html">John Calvin</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Commentary on the Catholic Epistles</cite>, James 2:25</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/good-works/necessity-of-good-works.html">Necessity of Good Works</a> › <a href="../topics/good-works/necessity-of-good-works/not-for-justification.html">Not for justification</a></span><span class="t"><a href="../topics/justification/paul-and-james.html">Paul and James</a> › <a href="../topics/justification/paul-and-james/romans-and-james-reconciled.html">Romans and James reconciled</a></span></div>

— John Calvin, Commentaries on the Catholic Epistles, James 2:25">Copy</button><a class="share" href="https://x.com/intent/post?text=%E2%80%9CWe%2C%20indeed%2C%20allow%20that%20good%20works%20are%20required%20for%20righteousness%3B%20we%20only%20take%20away%20from%20them%20the%20power%20of%20conferring%20righteousness%2C%20because%20they%20cannot%20stand%20before%20the%20tribunal%20of%20God.%E2%80%9D%0A%0A%E2%80%94%20John%20Calvin%2C%20Commentaries%20on%20the%20Catholic%20Epistles%2C%20James%202%3A25&amp;url=https%3A%2F%2F5solasquotes.github.io%2Fquote%2Fa63c435ec8.html&amp;via=5Solas" target="_blank" rel="noopener">Share on X</a><a class="perma" href="../quote/a63c435ec8.html">Permalink</a><a class="src" href="https://ccel.org/ccel/calvin/calcom45" rel="noopener" target="_blank">Read it online · CCEL</a></div>
</figure><figure class="quote" id="q-67b406b6a2" data-kw="">
<blockquote><p>But the consequent conditions are added to the antecedent, as following from them: which indeed are mutual between the parties, but oblige the one only so that the other is bound to do no more on their account: As if one having given or sold a plot of ground, should assign an annuity to be laid out upon the poor. Now conditions of that kind, when not performed, usually disannul the contract: and yet they do not constitute it. Nay, there would be no annuity, except the sale were already full and complete.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/daniel-chamier.html">Daniel Chamier</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Other citations (work not named)</cite>, Book 15, ‘Of the Necessity of Works’, 5 chapters in Panstratiae Catholicae (Geneva, 1626), vol. 3, place 3, question 3, pp. 509-22 as tr. Herman Witsius, Animadversions, p. 150</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/good-works/necessity-of-good-works.html">Necessity of Good Works</a></span></div>
<div class="actions"><button class="copy" data-copy="“But the consequent conditions are added to the antecedent, as following from them: which indeed are mutual between the parties, but oblige the one only so that the other is bound to do no more on their account: As if one having given or sold a plot of ground, should assign an annuity to be laid out upon the poor. Now conditions of that kind, when not performed, usually disannul the contract: and yet they do not constitute it. Nay, there would be no annuity, except the sale were already full and complete.”

— Daniel Chamier, Book 15, ‘Of the Necessity of Works’, 5 chapters in Panstratiae Catholicae (Geneva, 1626), vol. 3, place 3, question 3, pp. 509-22 as tr. Herman Witsius, Animadversions, p. 150">Copy</button><a class="share" href="https://x.com/intent/post?text=%E2%80%9CBut+the+consequent+conditions+are+added+to+the+antecedent%2C+as+following+from+them%3A+which+indeed+are+mutual+between+the+parties%2C+but+oblige+the+one+only+so+that+the+other+is+bound+to+do+no+more+on+their+account%3A+As+if+one+having+given+or+sold+a+plot+of+ground%2C+should+assign+an+annuity+to+be+laid+out+upon+the+poor.+Now+conditions+of+that+kind%2C+when+not+performed%2C+usually+disannul+the+contract%3A+and+yet+they+do+not+constitute+it.+Nay%2C+there+would+be+no+annuity%2C+except+the+sale+were+already+full+and+complete.%E2%80%9D%0A%0A%E2%80%94+Daniel+Chamier%2C+Book+15%2C+%E2%80%98Of+the+Necessity+of+Works%E2%80%99%2C+5+chapters+in+Panstratiae+Catholicae+%28Geneva%2C+1626%29%2C+vol.+3%2C+place+3%2C+question+3%2C+pp.+509-22+as+tr.+Herman+Witsius%2C+Animadversions%2C+p.+150&amp;url=https%3A%2F%2F5solasquotes.github.io%2Fquote%2F67b406b6a2.html&amp;via=5Solas" target="_blank" rel="noopener">Share on X</a><a class="perma" href="../quote/67b406b6a2.html">Permalink</a><a class="src" href="https://reformedbooksonline.com/good-works/#:~:text=But%20the%20consequent%20conditions%20are%20added,sale%20were%20already%20full%20and%20complete&amp;text=But%20the%20consequent%20conditions%20are%20added%20to%20the&amp;text=except%20the%20sale%20were%20already%20full%20and%20complete" rel="noopener" target="_blank">Read it online · Reformed Books Online</a></div>

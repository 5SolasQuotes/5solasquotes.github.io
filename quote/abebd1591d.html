<blockquote><p>Now before I close, let me commend to your notice and practice three or four things.

1. In reading this and such Gospel-Mysteries, you must believe above your Reason natural; so you give God the more honour, Rom. 4.19, 20. The Object of Abraham’s Faith, which was accounted to him for Righteousness, Gen. 15.6. &amp; 18.12. was of that nature, as whereat Sarah laughed; who therein was an Image of Natural Reason.

2. In your Reading and Reasoning of this and such points of eternal moment, ever think that part the safest, which doth least humour man’s pride, and most exalt the Glory of God; since the scope of the Gospel is to shut out boasting, and bring in self-denial, which none can deny.

3. In all your thought-debates about this Subject, seriously bethink your selves what is like to be your opinion of it when you come to die; [Cardinal] Bellarm[ine]. as you heard, professed new Divinity in it before his death.

4. If you have the opportunity to Converse with wounded spirits, and troubled Consciences, with whom it is or hath been as a Specimen of the day of Judgment; they will tell you whether any Righteousness but Jesus Christ made of God unto them Righteousness, could serve their turn in the presence of God, or satisfy their Conscience with a holding peace.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/obadiah-grew.html">Obadiah Grew</a></span><span class="wk"><span class="lbl">Work:</span> <cite>To the Serious Readers in The Lord Jesus Christ, the Lord our Righteousness, or, Christ the Righteousness of a Sinner before God delivered in Several Sermons</cite></span></figcaption>

<blockquote><p>The first commandment teaches us that God wants us to sincerely trust Him. Yet we must fear Him about everything else. … So the good works required by the first commandment are holy and must be obeyed. But who can live up to them? Certainly no one can completely obey the first commandment. Everyone is a sinner except for Christ. Christ, however, comes to us and says, “I have shed my blood for you. My blood cries out on your behalf.” Out of His grace and kindness, He brings us the forgiveness of our sins at no cost to us whatsoever.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/martin-luther.html">Martin Luther</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Faith Alone: A Daily Devotional</cite>, (p. 210). Zondervan. Kindle Edition.</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/justification.html">Justification</a></span></div>

</figure><figure class="quote" id="q-6c4c0825ad" data-kw="">
<blockquote><p>This excellency of the subject notwithstanding ought not to dull the edge of our most diligent search into it, but sharpen it rather, to endeavour so to define justification, that we may justify our definition. Which we cannot do, without distinguishing of a three-fold righteousness: first, a perfect righteousness, but not inherent; of which, 2 Cor. 5.21. secondly, inherent, but not perfect; of which, Luke 1.75. and Apoc. 22.11. thirdly, perfect and inherent, of which, Heb. 12.23. The first, is the righteousness by which we are justified; the second, by which we are sanctified; and the third, by which we are glorified.

The first consisteth as well of Christ’s active as his passive obedience, and in the imputation thereof by faith consisteth the essence of our justification, which may be thus defined: an act of God, whereby he acquitteth every penitent and believing sinner, by not imputing to him his sins, and imputing to him the perfect satisfaction and righteousness of Christ.

Every part of this definition may be proved by clear testimonies of Scripture; and besides, it hath that … certain mark or touch-stone of a true definition, that it meeteth with all doubts, and confronteth all errors broached against the nature of justification: first, the error of the Libertines, by that clause, every penitent: secondly, of the Antinomians, in the clause, not imputing their sin: thirdly, the Socinians, in the clause, perfect satisfaction: and lastly, the Arminians and Papists, in the last clause, imputing Christ’s righteousness, no habit or act of ours, no, not the act of faith.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/daniel-featley.html">Daniel Featley</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Sacra nemesis, The Levite’s scourge, or, Mercurius disciplined. Also diverse remarkable disputes and resolved in the Assembly of Divines related, episcopacy asserted, truth righted, innocency vindicated against detraction</cite>, (Oxford: Leonard Lichfield, 1644), p. 20.</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/justification/active-and-passive-obedience-imputed.html">Active and Passive Obedience Imputed</a></span></div>

</figure><figure class="quote" id="q-6a81fbefaf" data-kw="">
<blockquote><p>Is a believer’s justification complete at once; are all his sins, past, present and to come, on his first believing, pardoned? Justification, as has already been shown, changes a person’s state; and a believer’s state being changed, all his legal condemnation is at that time taken from off his person: union with Christ exempts from the same. “There is therefore now no condemnation to them that are in Christ Jesus” Rom. 8:1. Here is the high privilege of those in Christ asserted, namely, exemption from God’s condemnation; and the Holy Ghost here tells us, “There is therefore now no condemnation,” not the least condemnation remains to them “in Christ,” but their sins are freely remitted, “for his name’s sake, and all that believe are justified from all things” Acts 13:39. Here is a most complete absolution from all sins, for all those that believe in the Lord Christ. Thus Col. 1:13, “Having forgiven you all trespasses.” God does not, in the justification of his people, forgive some sins only, and leave others standing on the score. “Who forgiveth all thine iniquities,” Ps. 103:3. And not only so, but Christ covers the believer with the robe of righteousness, Isa. 61:10. For no sooner does a man truly believe in Christ, but his righteousness is imputed to him, and in and by that righteousness, he stands righteous before God, as well at the first as at the last; that righteousness of Christ by which we are justified, whether first or last, being most perfect: therefore the righteousness of justification cannot be increased, neither does our justification before God admit degrees, either in one and the same person, or yet in diverse men.—Downame on Justification, page 7. But God only forgives the sins that are past? Rom. 3:25. I answer, This looks to the sins of the saints, that were committed before Christ’s coming in the flesh, and holds forth God’s indulgence in pardoning of them, on the account of Christ’s engagement, though the price of their redemption was not actually laid down. To the same thing does the Holy Ghost speak, “And for this cause He is the Mediator of the new testament, that by means of death, for the redemption of the transgressions that were under the first testament,” Heb. 9:15. Here is that most excellent sacrifice, that looked as high as Adam, being the Lamb slain from the foundation of the world, from whence all the Old Testament saints had both full and free remission of all sin: and this I take to be the true meaning of this scripture. And though sin cannot properly be said to be actually forgiven, before it be committed, yet when the elect are, by the Holy Ghost, united to Christ, their persons are completely justified, and Christ having fulness of pardoning grace in his hands, their justification is continued and maintained by his intercession in heaven, 1 John 2:1. And thus the saints’ justification is, and continues to be, one constant and complete act of free grace, never to be reversed again.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/william-bridge.html">William Bridge</a></span><span class="wk"><span class="lbl">Work:</span> <cite>‘The Doctrine of Justification by Faith, Opened &amp; Applied from Rom. 3:24-25</cite>, …’ in Works (London: Tegg, 1845), vol. 5, pp. 382-89</span></figcaption>

+does+our+justification+before+God+admit+degrees%2C+either+in+one+and+the+same+person%2C+or+yet+in+diverse+men.%E2%80%94Downame+on+Justification%2C+page+7.+But+God+only+forgives+the+sins+that+are+past%3F+Rom.+3%3A25.+I+answer%2C+This+looks+to+the+sins+of+the+saints%2C+that+were+committed+before+Christ%E2%80%99s+coming+in+the+flesh%2C+and+holds+forth+God%E2%80%99s+indulgence+in+pardoning+of+them%2C+on+the+account+of+Christ%E2%80%99s+engagement%2C+though+the+price+of+their+redemption+was+not+actually+laid+down.+To+the+same+thing+does+the+Holy+Ghost+speak%2C+%E2%80%9CAnd+for+this+cause+He+is+the+Mediator+of+the+new+testament%2C+that+by+means+of+death%2C+for+the+redemption+of+the+transgressions+that+were+under+the+first+testament%2C%E2%80%9D+Heb.+9%3A15.+Here+is+that+most+excellent+sacrifice%2C+that+looked+as+high+as+Adam%2C+being+the+Lamb+slain+from+the+foundation+of+the+world%2C+from+whence+all+the+Old+Testament+saints+had+both+full+and+free+remission+of+all+sin%3A+and+this+I+take+to+be+the+true+meaning+of+this+scripture.+And+though+sin+cannot+properly+be+said+to+be+actually+forgiven%2C+before+it+be+committed%2C+yet+when+the+elect+are%2C+by+the+Holy+Ghost%2C+united+to+Christ%2C+their+persons+are+completely+justified%2C+and+Christ+having+fulness+of+pardoning+grace+in+his+hands%2C+their+justification+is+continued+and+maintained+by+his+intercession+in+heaven%2C+1+John+2%3A1.+And+thus+the+saints%E2%80%99+justification+is%2C+and+continues+to+be%2C+one+constant+and+complete+act+of+free+grace%2C+never+to+be+reversed+again.%E2%80%9D%0A%0A%E2%80%94+William+Bridge%2C+%E2%80%98The+Doctrine+of+Justification+by+Faith%2C+Opened+%26+Applied+from+Rom.+3%3A24-25%2C+%E2%80%A6%E2%80%99+in+Works+%28London%3A+Tegg%2C+1845%29%2C+vol.+5%2C+pp.+382-89&amp;url=https%3A%2F%2F5solasquotes.github.io%2Fquote%2F6a81fbefaf.html&amp;via=5Solas" target="_blank" rel="noopener">Share on X</a><a class="perma" href="../quote/6a81fbefaf.html">Permalink</a><a class="src" href="https://reformedbooksonline.com/topics/justification#:~:text=Is%20a%20believer%E2%80%99s%20justification%20complete%20at,grace%2C%20never%20to%20be%20reversed%20again&amp;text=Is%20a%20believer%E2%80%99s%20justification%20complete%20at%20once%3B%20are&amp;text=of%20free%20grace%2C%20never%20to%20be%20reversed%20again" rel="noopener" target="_blank">Read it online · Reformed Books Online</a></div>

<blockquote><p>Thirdly, add further what the Apostle doth, v. 4. [For he is the Minister of GOD to thee for good,] Is this true of persecuting Nero, in the case of his persecuting? Whereby the Apostle proves he will praise thee, doing that which is good? Surely in an over-ruling Work of GOD’S Grace, the very Devil is GOD’S instrument for GOOD, as to Job, (and we may say Minister too.) And Nero not a whit more in the Act of persecuting. But this far from St. Paul’s meaning: For he means a civil good, praising, and rewarding, and protecting. Nero did (St. Paul knew) quite contrary to this: He cannot then mean him as a Persecutor; and so never intends here to forbid resisting his Persecution.

Fourthly, go on one step further with the Apostle, which will yet make it more plain if more can be; [But if you do that which is evil then fear, for he bears not the Sword in vain, for he is the Minister of GOD, a Revenger to execute wrath on them that do evil) Evil contrary to Christianity is Idolatry, (for one thing,) and to make Christians Idolaters, did Nero and others persecute them, if they would cast in a grain of Incense into the Fire, by way of sacrifice to their Idols, they were freed.

Now is it St. Paul’s meaning, If you turn Idolater then fear, for Nero bears not the Sword in vain, for he is GOD’S Minister, a Revenger to execute Wrath upon them that commit Idolatry? Or is Christianity the evil they were to fear, as that which he used the Sword against, and that with great wrath and revenge? There is then nothing like the Dr’s Interpretation, In all these Arguments of the Apostle: but the clean contrary, besides what follows, v. 5, 6, 7.</p></blockquote>

<blockquote><p>Seeing therefore that God will not princes commandments should be obeyed in all things, but will have his rather suffer a thousand deaths, than do any thing that is evil: and sense also so many evils and mischiefs may follow in this life, where wicked princes wills may stand for laws, men ought both for God’s sake and commandment abstain to obey such commandments, and cleave unto this Maxim: we must obey God rather than man, for whose sake if we lose both goods and life, we ought to rejoice, that we be called to serve him, and not doubt, but as he is able to recompense it, so will he (according to his promise) reward it.

And besides also they ought to consider, that princes be ordained for the wealth and benefit of the people, and not to their destruction: to maintain common wealths, and not to subvert them: which rather than any man should consent unto, he ought (being a faithful man to his country) to abide all losses, both of body and goods. For next after God, men be borne to love, honour, and maintain their country.</p></blockquote>

<blockquote><p>Vers. 10. But chiefly them that walk after the flesh in the lust of uncleanness, and despise government, presumptuous are they, self-willed, they are not afraid to speak evil of dignities:

The sixth Note of Heretics is a luxurious and libidinous life, from which he gathers that the foresaid examples of God’s justice, justly threaten to them eternal destruction, chiefly, because they follow the flesh, or corrupt nature as their Captain, and proceed on in impurity, passing the course of their life in filthy [lusts], indulging the pleasures of the flesh.

Government] Note 7. Is the contempt of government, or lawful authority, which they would have taken out of the world, that there might be none to punish their vices. He describes and amplifies this vice with six Reasons.

Despise] Reas. 1. That it is not the naked disobedience of unlawful commands of a mistaking governor, but contempt of the Magistrate doing his duty, contempt of the very power and ordinance of God.

Presumptuous] Reas. 2. That it is presumptuousness joined with contempt.

And self] Reas. 3. That it is boldness in contempt joined with complacency in that sin.

To speak ill] Reas. 4. That it is boldness in contempt breaking forth into cursing, reproaches, evil speakings, which they cast upon Magistracy.

Vers. 11. Whereas Angels which are greater in power and might, bring not railing accusation against them before the Lord.

Reas. 5. That seeing they are vile fellows, they dare speak evil of Magistrates, which Angels that are more excellent than Magistrates, dare not speak ill of them: For although Angels are sometimes used to punish Princes, yet they always endeavour to maintain the estimation of Principalities, Magistrates, and Powers, against whom some Heretics proceed.

Vers. 12. But these, as natural brute beasts, made to be taken and destroyed, speak evil of the things that they understand not, and shall utterly perish in their own corruption,

Reas. 6. That heretics are like to brute beasts in this; For as beasts, 1. Are irrational: 2. They are driven by force, and not by counsel: 3. They being taken perish: So those Heretics who cannot bear Magistracy amongst men, or in the Church, but speak evil of this Ordinance. 1. Being void of judgement, they are ignorant of God’s Ordinance. 2. They are carried by a wicked inclination to blaspheme or to disgrace that which they do not understand. 3. As brute beasts they bring destruction to themselves, and perish by their own corruptness.

Vers. 13. And shall receive the reward of unrighteousness, as they that count it pleasure to riot in the day time: Spots they are and blemishes, sporting themselves with their own deceivings, while they feast with you:

14. Having eyes full of Adultery, and that cannot cease from sin, beguiling unstable souls, an heart they have exercised with covetous practices: cursed children:

He repeats the commination of their deserved condemnation, and adds the Eighth Note in three demonstrations of their impudence. The first is in open luxury, because in the day time, neither fearing the light of the Gospel, nor the Sun, they discover their minds to be given to luxury, delighting themselves in banquettings. The second demonstration of their impudence, in open incontinency, which they will not in the least endeavour to hide, but betray in their eyes, the adulteries of their heart, and will shew forth their impudence in their lust, and so they will not only pollute themselves, but will also deceive and ensnare their unstable souls destitute of solid and saving Faith. The third impudence consists in covetousness, the arts and methods whereof they will so meditate, and have their hearts so exercised with a vicious habit: Briefly comprehending these vices he calls those wicked men accursed.

Vers. 15. Which have forsaken the right way, and are gone astray, following the way of Balaam the Son of Bosor, who loved the wages of unrighteousness,

16. But was rebuked for his iniquity: the dumb Ass speaking with man’s voice, forbad the madness of the Prophet.

He compares the impudent covetousness of these men, to the covetousness of Balaam, whose History he briefly repeats out of Num. 22. who for the desire of reward, erred from the way, which he professed to follow, and at length gave himself to open impiety: wherein he became so stupid, that he was deservedly reprehended and chastised by his Asse; which likewise false Teachers, teaching false things, for filthy lucre sake, deserve.</p></blockquote>

more+excellent+than+Magistrates%2C+dare+not+speak+ill+of+them%3A+For+although+Angels+are+sometimes+used+to+punish+Princes%2C+yet+they+always+endeavour+to+maintain+the+estimation+of+Principalities%2C+Magistrates%2C+and+Powers%2C+against+whom+some+Heretics+proceed.%0A%0AVers.+12.+But+these%2C+as+natural+brute+beasts%2C+made+to+be+taken+and+destroyed%2C+speak+evil+of+the+things+that+they+understand+not%2C+and+shall+utterly+perish+in+their+own+corruption%2C%0A%0AReas.+6.+That+heretics+are+like+to+brute+beasts+in+this%3B+For+as+beasts%2C+1.+Are+irrational%3A+2.+They+are+driven+by+force%2C+and+not+by+counsel%3A+3.+They+being+taken+perish%3A+So+those+Heretics+who+cannot+bear+Magistracy+amongst+men%2C+or+in+the+Church%2C+but+speak+evil+of+this+Ordinance.+1.+Being+void+of+judgement%2C+they+are+ignorant+of+God%E2%80%99s+Ordinance.+2.+They+are+carried+by+a+wicked+inclination+to+blaspheme+or+to+disgrace+that+which+they+do+not+understand.+3.+As+brute+beasts+they+bring+destruction+to+themselves%2C+and+perish+by+their+own+corruptness.%0A%0AVers.+13.+And+shall+receive+the+reward+of+unrighteousness%2C+as+they+that+count+it+pleasure+to+riot+in+the+day+time%3A+Spots+they+are+and+blemishes%2C+sporting+themselves+with+their+own+deceivings%2C+while+they+feast+with+you%3A%0A%0A14.+Having+eyes+full+of+Adultery%2C+and+that+cannot+cease+from+sin%2C+beguiling+unstable+souls%2C+an+heart+they+have+exercised+with+covetous+practices%3A+cursed+children%3A%0A%0AHe+repeats+the+commination+of+their+deserved+condemnation%2C+and+adds+the+Eighth+Note+in+three+demonstrations+of+their+impudence.+The+first+is+in+open+luxury%2C+because+in+the+day+time%2C+neither+fearing+the+light+of+the+Gospel%2C+nor+the+Sun%2C+they+discover+their+minds+to+be+given+to+luxury%2C+delighting+themselves+in+banquettings.+The+second+demonstration+of+their+impudence%2C+in+open+incontinency%2C+which+they+will+not+in+the+least+endeavour+to+hide%2C+but+betray+in+their+eyes%2C+the+adulteries+of+their+heart%2C+and+will+shew+forth+their+impudence+in+their+lust%2C+and+so+they+will+not+only+pollute+themselves%2C+but+will+also+deceive+and+ensnare+their+unstable+souls+destitute+of+solid+and+saving+Faith.+The+third+impudence+consists+in+covetousness%2C+the+arts+and+methods+whereof+they+will+so+meditate%2C+and+have+their+hearts+so+exercised+with+a+vicious+habit%3A+Briefly+comprehending+these+vices+he+calls+those+wicked+men+accursed.%0A%0AVers.+15.+Which+have+forsaken+the+right+way%2C+and+are+gone+astray%2C+following+the+way+of+Balaam+the+Son+of+Bosor%2C+who+loved+the+wages+of+unrighteousness%2C%0A%0A16.+But+was+rebuked+for+his+iniquity%3A+the+dumb+Ass+speaking+with+man%E2%80%99s+voice%2C+forbad+the+madness+of+the+Prophet.%0A%0AHe+compares+the+impudent+covetousness+of+these+men%2C+to+the+covetousness+of+Balaam%2C+whose+History+he+briefly+repeats+out+of+Num.+22.+who+for+the+desire+of+reward%2C+erred+from+the+way%2C+which+he+professed+to+follow%2C+and+at+length+gave+himself+to+open+impiety%3A+wherein+he+became+so+stupid%2C+that+he+was+deservedly+reprehended+and+chastised+by+his+Asse%3B+which+likewise+false+Teachers%2C+teaching+false+things%2C+for+filthy+lucre+sake%2C+deserve.%E2%80%9D%0A%0A%E2%80%94+David+Dickson%2C+An+exposition+of+all+St.+Paul%E2%80%99s+epistles+together+with+an+explanation+of+those+other+epistles+of+the+apostles+St.+James%2C+Peter%2C+John+%26+Jude%3A+wherein+the+sense+of+every+chapter+and+verse+is+analytically+unfolded+and+the+text+enlightened%2C+%28London%3A+Francis+Eglesfield%2C+1659%29%2C+pp+301-02.&amp;url=https%3A%2F%2F5solasquotes.github.io%2Fquote%2Ff2098bc2eb.html&amp;via=5Solas" target="_blank" rel="noopener">Share on X</a><a class="perma" href="../quote/f2098bc2eb.html">Permalink</a><a class="src" href="https://reformedcovenanter.wordpress.com/2024/05/25/david-dickson-on-the-marks-of-a-false-teacher-2/" rel="noopener" target="_blank">Read it online · Reformed Covenanter</a></div>
</figure><figure class="quote" id="q-32e0e41645" data-kw="">
<blockquote><p>The chief priest layeth two crimes to the charge of the apostles, for he accuseth them of contumacy or stubbornness, because they obeyed not the decree of the council. In the second member he betrayeth an evil conscience, or, at least, he showeth that he handled rather a private business than any public cause, for he complaineth that the apostles will cause the priests and the scribes to be hated for the death of Christ.

Behold, therefore, what that is which nettleth them, because they fear the revenge and punishment of wicked murder. He pretendeth, at the first, doctrine; but we may gather out of the end that he was not so careful for doctrine. In the mean season, he accuseth the apostles of sedition; for he taketh that for a thing which all men, for the most part, did grant, that Christ was put to death justly.

Notwithstanding this is the principal point of the accusation, that they did not obey the commandment of the priests. It was an heinous offence not to obey the chief priest; how much more heinous was it, then, to despise the whole order? But the chief priest doth not consider what is his duty towards God and the Church; he abuseth his authority tyrannously, as if the same were not under any laws, as the Pope dealeth with us at this day; for seeing that he taketh to himself an unbridled authority and government, he feareth not to condemn us for schismatics, so soon as he seeth us refuse his decrees; for he catcheth at these sentences: “He which despiseth you despiseth me,” (Luke 10:16;) and thereupon he concludeth that we will rebel against God. But if he will be heard as the ambassador of Christ, he must speak out of the mouth of Christ.

Now, forasmuch as he doth manifestly play the minister of Satan, he borroweth authority, without shame and colour, of the name of Christ; yea, the very form of speech which the chief priest useth doth prove how carelessly spiritual tyrants who usurp such authority and lordship as is not subject to the word of God, dare grant liberty to themselves to attempt whatsoever pleaseth them. With a commandment (saith he) have we commanded. Whence cometh such strait rigour, save only because they think that all that must be received without exception which they shall command?</p></blockquote>

<blockquote><p>I conclude with one word: Although the Church may enjoin it on its children, not to maintain free intercourse with any private person who has been cast out of the Church, yet it cannot command subjects to revolt from their Sovereigns when excommunicated; because they are bound to continue rendering the obedience due to them by law natural, civil and divine.</p></blockquote>

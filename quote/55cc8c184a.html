<blockquote><p>[Stapleton:] ‘From the Church they take altars, crosses, images,’ etc. [Fulke:] Because the temple of God hath nothing to do with images, 2 Cor. 6:16.</p></blockquote>

</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-523fa3b4da" data-kw="">
<blockquote><p>And after all this, if it should please God [that] any person of the blessed and most holy Trinity should appear in any visible shape, that shape might be depicted; of that shape an image might be made; I mean, it might naturally; it might if it were done for lawful ends, and unless a commandment were to the contrary; and therefore so long as God keeps himself within the secret recesses of his sanctuary, and the majesty of his invisibility, so long it is plain he intends the very first sense and words of his [Second] Commandement: but if he should cancel the great reason [Dt. 4, end] of his Commandement, and make that by an act of his own to become possible which in the nature of things is impossible, that is, that an image can be made of God; I should believe that God did intend to dispense in that part of the Commandement, and declare that he intended it only for a temporary band: For if the reason of the commandement were taken away; either the commandement also ceases to oblige; or must be bound upon us by another reason, or a new sanction, or at lest a new declaration; or else it would follow that then his visible appearance would become a snare to mankind. But because yet he has not yet appeared visibly and has by no figure or idea represented the Godhead; and that it is a truth which must last as long as Christian religion lasts, that no man can see God, therefore it follows that it is at no hand lawful to make an image of God or relating to the divinity. If a dove be made it must not be intended to represent the Holy Ghost, for besides that no dove did appear, nor shape of a dove, yet if it did, it related not to the person of the Holy Ghost, but to the impression made upon the person on whom the light descended: and if the figure of the crucifix be made, or of Jesus in the flesh, it is wholly relative to the creature, not to him as God; for that is impious, and unreasonable and impossible to be done in any natural proportion.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/jeremy-taylor.html">Jeremy Taylor</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Ductor dubitantium, or, The Rule of Conscience in all her General Measures serving as a great instrument for the determination of cases of conscience</cite>, … (London, 1660), vol. 1, Of the Rule of Conscience, ch. 2, Rule 6, ‘Every thing in the Decalogue is not obligatory to Christians, is not a portion of the Moral or Natural law’ Taylor (1613–1667) was a cleric in the Church of England who achieved fame as an author during the Protectorate of Oliver Cromwell. He was Arminian in outlook., p. 336</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/worship/idolatry-and-images.html">Idolatry and Images</a></span></div>

</figure><figure class="quote" id="q-44abecf5a8" data-kw="">
<blockquote><p>The typical reformed view and practice was that the material church buildings of Romanists, when cleansed, may be repurposed for good uses (1 Tim. 4:4–5). On the more exceptional cases where a Romanist building had been so notoriously idolatrous and scandalous, the scandal not removing with the removal of the idolatry, the reformed typically destroyed the building wholly, not allowing it to be further used. The Separatists, as seen here, were generally for destroying all the buildings that had been used by Romanists, not thinking it lawful to repurpose the material goods. See [also] ‘On Church Buildings &amp; Architecture’ (RBO)…</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/travis-fentiman.html">Travis Fentiman</a></span><span class="wk"><span class="lbl">Work:</span> <cite>“Editor’s Extended Introduction” in English Puritans, A Refutation of the Errors of Separatists</cite>, (1604; 1644; RBO, 2025), p. 295 fn. 727</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/worship/idolatry-and-images.html">Idolatry and Images</a></span></div>

</figure><figure class="quote" id="q-528533c5d0" data-kw="">
<blockquote><p>But they say immediately, ‘We teach that these images are not to be worshipped.’ As if, in fact, says [Jerome] Zanchius (De Imagin., col. 402), ‘God had not once rather diligently done the same thing through Moses and the prophets, that we are doing. So then why did He even want all images abolished? Because it is not enough to teach by word that an evil thing must not be done; but the slight obstacles, the incentives, the causes, the occasions of evil doing must be abolished.’ It is not enough, with the scribes and Pharisees, to teach out of Moses’ chair what the people should do, but all occasions, yea, appearances of evil, are to be taken out of their sight. ‘Those things affect more powerfully, and affect more, which fall upon the eyes than those which fell upon the ears. And so Hezekiah had been able to warn the people not to worship the serpent, but he preferred to break it in pieces and completely remove it from visibility,’ says one well to this purpose. (Thomas Naogeorgus [Kirchmeyer] in 1 Jn 5:21)</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/george-gillespie.html">George Gillespie</a></span><span class="wk"><span class="lbl">Work:</span> <cite>English Popish Ceremonies</cite>, (Naphtali Press, 1993) | Part 3, Ch. 2, p. 167</span></figcaption>

<blockquote><p>Perhaps the Father’s flock, the little chosen flock of Christ, is with his son Moses, some faithful shepherd in the backside of a desert coming to the mountain of God, and there see visions of the flaming bush and the Angel of the Covenant in it? Dost thou delight where Christ does feed, though in secret and retired corners, and holdest communion with saints there?</p></blockquote>

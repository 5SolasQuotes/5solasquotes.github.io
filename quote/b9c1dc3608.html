<main class="wrap"><figure class="quote" id="q-b9c1dc3608" data-kw="">
<blockquote><p>We affirm that bread and wine are holy and heavenly mysteries of the body and blood of Christ, and that by them Christ Himself, being the true bread of eternal life, is so presently given unto us as that by faith we verily receive his body and his blood. Yet say we not this so, as though we thought that the nature and substance of the bread and wine is clearly changed and goeth to nothing: as many have dreamed in these later times, which yet could never agree among themselves, of this their dream.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/john-jewel.html">John Jewel</a></span><span class="wk"><span class="lbl">Work:</span> <cite>An Apology of the Church of England</cite>, Part 2</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/rome/sacraments.html">Rome: Sacraments</a> › <a href="../topics/rome/sacraments/transubstantiation.html">Transubstantiation</a></span></div>

</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-89510b8bf5" data-kw="">
<blockquote><p>So with respect to the Antichrist, it is most appropriate he be traced back to the idolatry of Rome, for he honors and worships the wafer-God of the Mass, who was truly unknown to the Fathers. Indeed, he worships the Angels and the Saints as protectors, helpers, and defenders, honoring them magnificently with gold, silver and precious things, in ornate external displays, and by building immense shrines for their veneration.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/francis-turretin.html">Francis Turretin</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Whether It Can Be Proven the Pope Is the Antichrist</cite>, 7th Disputation, p. 59</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/the-return-of-christ-antichrist-and-the-millennium/antichrist.html">Antichrist</a> › <a href="../topics/the-return-of-christ-antichrist-and-the-millennium/antichrist/the-papacy-as-antichrist.html">The papacy as Antichrist</a></span><span class="t"><a href="../topics/the-lords-supper/the-mass.html">The Mass</a> › <a href="../topics/the-lords-supper/the-mass/adoration-of-the-host.html">Adoration of the host</a></span><span class="t"><a href="../topics/rome/sacraments.html">Rome: Sacraments</a> › <a href="../topics/rome/sacraments/the-mass.html">The mass</a></span></div>
<div class="actions"><button class="copy" data-copy="“So with respect to the Antichrist, it is most appropriate he be traced back to the idolatry of Rome, for he honors and worships the wafer-God of the Mass, who was truly unknown to the Fathers. Indeed, he worships the Angels and the Saints as protectors, helpers, and defenders, honoring them magnificently with gold, silver and precious things, in ornate external displays, and by building immense shrines for their veneration.”

— Francis Turretin, Whether It Can Be Proven the Pope Is the Antichrist, 7th Disputation, p. 59">Copy</button><a class="share" href="https://x.com/intent/post?text=%E2%80%9CSo+with+respect+to+the+Antichrist%2C+it+is+most+appropriate+he+be+traced+back+to+the+idolatry+of+Rome%2C+for+he+honors+and+worships+the+wafer-God+of+the+Mass%2C+who+was+truly+unknown+to+the+Fathers.+Indeed%2C+he+worships+the+Angels+and+the+Saints+as+protectors%2C+helpers%2C+and+defenders%2C+honoring+them+magnificently+with+gold%2C+silver+and+precious+things%2C+in+ornate+external+displays%2C+and+by+building+immense+shrines+for+their+veneration.%E2%80%9D%0A%0A%E2%80%94+Francis+Turretin%2C+Whether+It+Can+Be+Proven+the+Pope+Is+the+Antichrist%2C+7th+Disputation%2C+p.+59&amp;url=https%3A%2F%2F5solasquotes.github.io%2Fquote%2F89510b8bf5.html&amp;via=5Solas" target="_blank" rel="noopener">Share on X</a><a class="perma" href="../quote/89510b8bf5.html">Permalink</a><span class="src none">No free online copy linked</span></div>
</figure><figure class="quote" id="q-0286a9a64d" data-kw="">
<blockquote><p>While the grace of God generally operates mediately, it is not inherent in the means as a divine deposit, but accompanies the use of these. This must be maintained in opposition to the Roman Catholics, the High Church Anglicans, and the Lutherans, who proceed on the assumption that the means of grace always operate in virtue of an inherent power, though their operation may be made ineffective by the condition or attitude of the recipient. Protestants, on the other hand, teach that the sacraments are not absolutely necessary unto salvation, but are obligatory in view of the divine precept.… That they are not absolutely necessary unto salvation, follows… from the fact that Scripture mentions only faith as the instrumental condition of salvation… and from the fact that the sacraments do not originate faith but presuppose it, and are administered where faith is assumed, Acts 2:41; 16:14,15,30,33; I Cor. 11:23-32; and from the fact that many were actually saved without the use of the sacraments.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/louis-berkhof.html">Louis Berkhof</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Systematic Theology</cite>, Means of Grace; Necessity of the Sacraments</span></figcaption>

</figure><figure class="quote" id="q-09094bc7fc" data-kw="">
<blockquote><p>The Offering of Christ once made is that perfect redemption, propitiation, and satisfaction, for all the sins of the whole world, both original and actual; and there is none other satisfaction for sin, but that alone. Wherefore the sacrifices of Masses, in the which it was commonly said, that the Priest did offer Christ for the quick and the dead, to have remission of pain or guilt, were blasphemous fables, and dangerous deceits.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/church-of-england.html">Church of England</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Thirty-Nine Articles</cite>, 1563, Art. 31</span></figcaption>

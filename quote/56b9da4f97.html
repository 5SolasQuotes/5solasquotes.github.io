<main class="wrap"><figure class="quote" id="q-56b9da4f97" data-kw="">
<blockquote><p>CANON 25. Concerning the love with which we love God. It is wholly a gift of God to love God. He who loves, even though he is not loved, allowed himself to be loved. We are loved, even when we displease him, so that we might have means to please him. For the Spirit, whom we love with the Father and the Son, has poured into our hearts the love of the Father and the Son (Rom 5:5).</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/second-council-of-orange.html">Second Council of Orange</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Canons And Decrees Of The Second Council Of Orange</cite>, (AD 529)</span></figcaption>

</figure><figure class="quote" id="q-82db385220" data-kw="">
<blockquote><p>Mercy is, God willing, to succor the creature in misery. Mercy in God is either essential: namely that which is in Him by necessity of nature, and had been in Him though He had never willed the manifestation thereof by showing mercy to any; this is God’s sufficiency to show mercy. Or, Relative, namely, that which is in Him with respect to the creature, and is his will to manifest mercy to whom He pleases; Ex. 33:19; Rom. 9:18. Mercy is increated, viz. the attribute of God: or created, viz. a transient act of God in time, or the effects of such transient acts: so vocation is said to be an act of mercy, Rom. 11:30, 32; 1 Pet. 2:10. Remission of sin, Lk. 1:78; Mt. 18:33; Salvation, Jud. 21. Increated mercy is God’s will to show mercy. Created mercy is God’s actual showing mercy according to his will. The effects of mercy are either special: proper to the elect, as flowing from special grace, Rom. 9:23. The elect are called (and by effectual calling so made) vessels of mercy. Or common, extended to those who are not elected, Lk. 6:35-36. Unto the beasts of the field, Ps. 104:27; Yea, over all his works, Ps. 145:9.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/john-norton.html">John Norton</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Orthodox Evangelist</cite>, ... (London: 1654), ch. 1, Of the Divine Essence, p. 14</span></figcaption>

</figure><figure class="quote" id="q-6ef1659461" data-kw="">
<blockquote><p>Grace is unmerited favor; and the grace or favor of God is the source of all good. Peace, according to the usage of the corresponding Hebrew word, means well-being in general. It comprehends all blessings flowing from the goodness of God. The apostle prays to Christ, and seeks from him blessings which God only can bestow. Christ therefore was to him the object of habitual worship. He lived in communion with Christ as a divine person, the ground of his confidence and the source of all good.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/charles-hodge.html">Charles Hodge</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Commentary on Ephesians</cite>, on 1:2</span></figcaption>

</figure><figure class="quote" id="q-dc898d5fef" data-kw="goodness benignity">
<blockquote><p>The goodness of God is that by which he is conceived not only absolutely and in himself as supremely good and perfect and the only good (Mk. 10:18) because he is such originally, perfectly and immutably; but also relatively and extrinsically as beneficent towards creatures (which is called benignity) because it is of the reason of good to be communicative of itself.</p></blockquote>

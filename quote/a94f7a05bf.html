<main class="wrap"><figure class="quote" id="q-a94f7a05bf" data-kw="">
<blockquote><p>We have no such custom, of women’s praying or prophesying with their heads uncovered, or men’s praying or prophesying with their heads covered; or we have no such custom of contending for these little frivolous things; neither any of the churches of God; and good Christians, in their practices, ought, in things of this nature, to have an eye and regard to the custom of their own church, and also of other Christian churches. Thus the apostle closes this discourse, and proceeds in the next verses to tax other abuses which were crept into this famous church.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/matthew-poole.html">Matthew Poole</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Annotations on 1 Cor. 11</cite>, v. 15 | v. 16</span></figcaption>

</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-89a86161ba" data-kw="">
<blockquote><p>Although there is much evidence for the practice of female veiling in the Classical world it has for the most part been ignored. Evidence for the veiling of Roman women is found in many sources. Ancient lexicographers list many names for veils that these women wore. Each of these veils was particular to the context in which they were worn and by whom they were worn. The plenitude of veiling terminology as well as the specialized nature of these veils alerts the reader to the importance that the Romans attributed to the veil, suggesting that it formed an important part of their culture and this is described in visual and literary terms by ancient artists and writers. … The practice of veiling is therefore viewed by the Romans in a positive light, and its disruption is understood by them as a cause for concern. This concern was especially apparent during the late republic. The dissolution of the traditional forms of government was in some ways problematized in terms of gender, with women’s abandonment of their traditional roles and their incursion into the public sphere being of specific importance. In order to remedy this, attempts were made by the new regime of Augustus to promote a return to what were seen to be traditional gender relations. This programme of moral reform made use of both formal, legalistic decree (the Julian marriage laws) and more propagandistic constructions (the public works of art). In this process traditional symbols assumed a high degree of salience. Because of its power to signify the beneficial and appropriate status of the female body, one of the most important of these symbols was the veil.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/lydia-lenore-veronica-matthews.html">Lydia Lenore Veronica Matthews</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Conspicuous Concealment</cite>, (University of KwaZulu-Natal, 2007) 225 pp. Pictures are on, pp. 149-204</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/worship/head-coverings-in-worship.html">Head Coverings in Worship</a></span></div>

</figure><figure class="quote" id="q-2c30adc8ce" data-kw="">
<blockquote><p>Among the Corinthians the covering of the head was not as it is with us, a token of preeminence and superiority, but a sign of subjection (Mr. [William] Perkins on Revelation); therefore the apostle would have the women of Corinth, when they came into the congregation, to have their heads covered, to signify their submission and reverence unto the ministry of the gospel.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/edward-leigh.html">Edward Leigh</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Annotations upon all the New Testament, Philological &amp; Theological</cite>, … (London, 1654), on 1 Cor. 11 | v. 10</span></figcaption>

</figure><figure class="quote" id="q-1d5a0c0a0c" data-kw="">
<blockquote><p>Paul… his traditions were the Gospel of Christ and honest manners and living, and such a good order as becomes the doctrine of Christ. As that a woman obey her husband, have her head covered, keep silence, and go womanly and christianly apparelled: that children and servants be in subjection: and that the young obey their elders, that no man eat but he that labours and works, and that men make an earnest thing of God’s Word, and of his holy Sacraments: and to watch, fast, and pray, and such like, as the Scripture commands. Which things he that would break were no christian man… There were also certain customs alway which were not commanded in pain of hell or everlasting damnation, as to watch all night, and to kiss one another: which as soon as the people abused, then they brake them. For which cause the bishops might break many things now in like manner. Paul also in many things which God had made free, gave pure and faithful counsel without tangling of any man’s conscience, and without all manner commanding under pain of cursing, pain of excommunication, pain of heresy, pain of burning, pain of deadly sin, pain of hell, and pain of damnation. As thou mayst see. 1 Cor. 7.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/william-tyndale.html">William Tyndale</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Obedience of a Christian Man, and how Christian Rulers ought to Govern in The Whole Works of W. Tyndall, John Frith &amp; Doctor Barnes, Three Worthy Martyrs &amp; Principal Teachers of this Church of England, Collected &amp; Compiled in One Tome Together</cite>, The Obedience of a Christian Man, and how Christian Rulers ought to Govern in The Whole Works of W. Tyndall, John Frith &amp; Doctor Barnes, Three Worthy Martyrs &amp; Principal Teachers of this Church of England, Collected &amp; Compiled in One Tome Together… (d. 1536; London, 1573), pp. 128-29</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/worship/head-coverings-in-worship.html">Head Coverings in Worship</a></span></div>

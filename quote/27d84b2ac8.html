<main class="wrap"><figure class="quote" id="q-27d84b2ac8" data-kw="">
<blockquote><p>This article analyses the recodification of the covering of women from the Reformation to the Enlightenment, discussing and juxtaposing rich visual material, normative regulations and court cases… Early modern costume books demonstrate the potential of the veil to map locally specific cultural differences manifested in dress. Veiled women could stand for propriety, yet veils might also be read as a sign of lust, disorder and seduction. Case studies of Reformation Basel and Zürich develop these broader findings in detail. They show not only that the veil provided a screen onto which could be projected strangeness and danger, but also how in practice it marked women as respectable or dishonourable, rich or poor, married or unwed. Furthermore, it was read as an index of morality and gained much attention in a fashion policy critical of luxury. The veil was thus central to an identity politics preoccupied with social ordering, moral standards, and also fashion.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/susanna-burghartz.html">Susanna Burghartz</a></span><span class="wk"><span class="lbl">Work:</span> <cite>‘Covered Women? Veiling in Early Modern Europe’ Pre Abstract in History Workshop Journal, no. 80 (Autumn, 2015), pp. 1-32 with numerous pictures</cite></span></figcaption>
<div class="meta"><span class="t"><a href="../topics/worship/head-coverings-in-worship.html">Head Coverings in Worship</a></span></div>

<blockquote><p>given her hair for a covering. There have been books written about the lawfulness or unlawfulness of men’s wearing long hair, and the due or undue lengths of men’s hair, the substance of which were too much to transcribe here. That which in these verses seems to be commended to us, as the will of God in this matter, is: 1. That men and women should so order their hair, as by it to preserve the distinction of sexes. 2. That men should not wear their hair after the manner of women, either disheveled, or curled, and tricked up about their heads, which speaks too much of an unmanly and effeminate temper, much more was what became not Christians. And if this be forbidden men, as to the use of their own hair, they stand concerned to consider whether it be lawful for them thus to wear and adorn themselves with the hair of other men and women.</p></blockquote>

<blockquote><p>Although certain ordinations of the apostles (which referred to the rites and circumstances of divine worship) were variable and instituted only for a time (as the sanction of not eating blood and of things strangled [Acts 15:20]; concerning the woman’s head being covered and the man’s being uncovered when they prophesy [1 Cor. 11:4, 5]) because there was a special cause and reason for them and (this ceasing) the institution itself ought to cease also; still there were others invariable and of perpetual observance in the church, none of which were founded upon any special occasion to last only for a time by which they might be rendered temporary…</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/francis-turretin.html">Francis Turretin</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Institutes, vol. 2, 11th Topic, The Law of God, 14th Question: The Lord’s Day</cite>, p. 95</span></figcaption>

</figure><figure class="quote" id="q-bcfb44bddb" data-kw="">
<blockquote><p>A habit is a mere accident of worship; the person, John or Thomas, is also an accident; but if God command such an ephod as Aaron and the priests were to wear, this is not a mere circumstance… And therefore these circumstances, taken in common and their universal nature, are merely physical circumstances; but taken in their particular and determinate restrictions, as such circumstances, they may be merely moral circumstances, such as are the common adjunct of the time of worship, the place, and the Sabbath time and the temple for Jewish worship. The former are circumstances merely physical, the latter merely moral; I mean, as they are restricted other ways… … I did say that Christ Jesus has set down in the Word a perfect platform of Church-government in all morals; I say in all morals because the Word does not teach us anything of circumstances, physical as physical. Scriptura talia non ponit, sed supponit [Scripture does not put forth such things, but supposes them]: The Scripture says not that the worship of God must have a time, a place, when, and where its to be performed, a person, who is to perform it, a habit, or garments on the person that worships; the Scripture teaches none of these, but supposes that they are and must be; because nature teaches that without time, place, person, habit, gesture, its unpossible that these or any human actions can be; And therefore prelatical formalists do without all sense or reason require that we should prove by Scripture, the lawfulness of time, place, person, habit, gesture in God’s worship; for these are presupposed in all actions, natural, civil, religious, private, public, lawful, unlawful, in acts of arts, sciences, of moral conversing and all; yea, there is as good reason that they demand Scripture to prove he must be a living man, who has a reasonable soul and senses, and is born of a woman, who preaches and administrates sacraments, which is presupposed by nature.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/samuel-rutherford.html">Samuel Rutherford</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Divine Right of Church Government... (1646) | Introduction</cite>, pp. 4-5</span></figcaption>

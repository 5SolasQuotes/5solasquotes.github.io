<blockquote><p>2. As concerning actions of Church-policy that cannot be warranted by the light of nature, and yet have intrinsical conveniency and aptitude to edify and decently to accommodate the worship of God. I conceive these may be done, but not because the Church so commands, as if their commandment were the formal reason of our obedience, but because partly the light of the Law of reason, partly scripture does warrant them… … Question. But does not the Church determine things that of themselves are indifferent, as whether [the] sermon should begin at nine of clock or ten in the morning; and after the Church has past a determination for the diet of ten a clock, the indifferency of either nine or ten is removed and the practice, without any warrant of Scripture, [is] restricted to one, for order and peace sake; and why may not the like be done in positives of Church-government? Answer. The truth is [that] the Church by her will puts no determination on the time, but only ministerially declares that which God’s providence accommodating itself to the season, climate, the conveniency of the congregation as they lie in distance from the place of meeting, has determined already…</p></blockquote>

</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-ef8518f3d8" data-kw="">

</figure><figure class="quote" id="q-7901dc92e0" data-kw="">
<blockquote><p>But as we have seen in what respect the laws of the Church do not bind, let us now see how they may be said to bind. That which binds is not the authority of the Church, nor any force which the Church can give to her laws. It must be then somewhat else which makes them able to bind, when they bind at all, and that is, ratio legis, ‘the reason of the law,’ without which the law itself cannot bind, and which has the chiefest and most principal power of binding. An ecclesiastical law says Junius (Animad. in Bellarmine, Controversy 3, bk. 4, ch. 16, note 87): ‘[Greek] sive depositio, non vere lex est, sed [Greek] aut canon, ac proinde dirigit quidem ut canon agentem voluntarie: non autem necessitate cogit, ut lex, etiam involuntarium quod si forte ante accedit coactio, ea non est de natura Canonis sed aliunde pervenit.’ An ecclesiastical canon says Tilen, ducit volentem, non trahit nolentem: quod si accedat coactio, ea Ecclesiastici Canonis natura est prorsus aliena. Calvin’s judgment is that an ecclesistical canon binds when manifestam utilitatem prae se fert [it bears a manifest utility before it], and when either [Greek] or charitatis ratio [the law of charity] does require that we impose a necessity on our liberty. It binds not then by its own authority in his mind. And what says the Canon Law itself? Sed sciendum est quod Ecclesiasticae prohibitiones proprias habent causas, quibus cessantibus, cessant &amp; ipsae. Hence Junius says that the law binds not per se [of itself], but only propter ordinem, charitatem, &amp; cautionem scandali [for the order, charity and caution of scandal]. Hence Ames: ‘quamvis ad justas leges humanas, justo modo observandas, obligentur homines in conscientiis suis a Deo; ipsae tamen leges humanae, qua sunt leges hominum, non obligant conscientiam.’ Hence Alsted: Lawes made by men of things indifferent, whether they be civil or ecclesiastical, do bind the conscience insofar as they agree with God’s Word, serve for the public good, maintain order, and finally, take not away liberty of conscience. Hence the Professors of Leiden say that laws bind not primo &amp; per se, sed secundario &amp; per accidens [firstly and of themselves, but secondarily and by accident], that is quatenus in illis lex aliqua Dei violatur [insofar as in them the law of God is anyway violated]. Hence I may compare the constitutions of the Church with responsa juris consultorum [responses of the lawyers of the law] among the Romans, which obliged no man, nisi ex aequo &amp; bono [except out of equity and good] says Danaeus. Hence it may be said that the lawes of the Church do only bind scandali &amp; contemptus ratione [by the reason of scandal and contempt], as Hospinian, and in case libertas fiat cum scandalo [liberty may be turned into scandal], as Paraeus: for it were scandal, not to give obedience to the laws of the Church when they prescribe things necessary or expedient for the eschewing of scandal, and it were contempt to refuse obedience to them when we are not certainly perswaded of the unlawfulness or inexpediency of the things prescribed. … We deny not then that the Churches’ canons about rites which serve for public order and edification do bind: We say only that it is not the authority of the Church framing the canon that binds, but the matter of the canon chiefly, warranted by God’s Word. Scimus enim quaecunque ad decorum &amp; ordinem pertinent, non habenda esse pro humanis placitis, quia divinitus approbantur (Calvin, Resp. ad Libel. de Pii Viri Officio, p. 413). Therefore we think concerning such canons that ‘they are necessary to be observed so far forth only as the keeping of them maintains decent order and prevents open offence.’ (Theodore Beza, Confession, ch. 5, Article 18; Perkins, ubi supra. &amp; Meisner, Philos. sobr., part 3, section 2, question 12)</p></blockquote>

— George Gillespie, English Popish Ceremonies... (Edinburgh, 1637) | 1st Part, ch. 4, pp. 9-10">Copy</button><a class="share" href="https://x.com/intent/post?text=%E2%80%9CBut+as+we+have+seen+in+what+respect+the+laws+of+the+Church+do+not+bind%2C+let+us+now+see+how+they+may+be+said+to+bind.+That+which+binds+is+not+the+authority+of+the+Church%2C+nor+any+force+which+the+Church+can+give+to+her+laws.+It+must+be+then+somewhat+else+which+makes+them+able+to+bind%2C+when+they+bind+at+all%2C+and+that+is%2C+ratio+legis%2C+%E2%80%98the+reason+of+the+law%2C%E2%80%99+without+which+the+law+itself+cannot+bind%2C+and+which+has+the+chiefest+and+most+principal+power+of+binding.+An+ecclesiastical+law+says+Junius+%28Animad.+in+Bellarmine%2C+Controversy+3%2C+bk.+4%2C+ch.+16%2C+note+87%29%3A+%E2%80%98%5BGreek%5D+sive+depositio%2C+non+vere+lex+est%2C+sed+%5BGreek%5D+aut+canon%2C+ac+proinde+dirigit+quidem+ut+canon+agentem+voluntarie%3A+non+autem+necessitate+cogit%2C+ut+lex%2C+etiam+involuntarium+quod+si+forte+ante+accedit+coactio%2C+ea+non+est+de+natura+Canonis+sed+aliunde+pervenit.%E2%80%99+An+ecclesiastical+canon+says+Tilen%2C+ducit+volentem%2C+non+trahit+nolentem%3A+quod+si+accedat+coactio%2C+ea+Ecclesiastici+Canonis+natura+est+prorsus+aliena.+Calvin%E2%80%99s+judgment+is+that+an+ecclesistical+canon+binds+when+manifestam+utilitatem+prae+se+fert+%5Bit+bears+a+manifest+utility+before+it%5D%2C+and+when+either+%5BGreek%5D+or+charitatis+ratio+%5Bthe+law+of+charity%5D+does+require+that+we+impose+a+necessity+on+our+liberty.+It+binds+not+then+by+its+own+authority+in+his+mind.+And+what+says+the+Canon+Law+itself%3F+Sed+sciendum+est+quod+Ecclesiasticae+prohibitiones+proprias+habent+causas%2C+quibus+cessantibus%2C+cessant+%26+ipsae.+Hence+Junius+says+that+the+law+binds+not+per+se+%5Bof+itself%5D%2C+but+only+propter+ordinem%2C+charitatem%2C+%26+cautionem+scandali+%5Bfor+the+order%2C+charity+and+caution+of+scandal%5D.+Hence+Ames%3A+%E2%80%98quamvis+ad+justas+leges+humanas%2C+justo+modo+observandas%2C+obligentur+homines+in+conscientiis+suis+a+Deo%3B+ipsae+tamen+leges+humanae%2C+qua+sunt+leges+hominum%2C+non+obligant+conscientiam.%E2%80%99+Hence+Alsted%3A+Lawes+made+by+men+of+things+indifferent%2C+whether+they+be+civil+or+ecclesiastical%2C+do+bind+the+conscience+insofar+as+they+agree+with+God%E2%80%99s+Word%2C+serve+for+the+public+good%2C+maintain+order%2C+and+finally%2C+take+not+away+liberty+of+conscience.+Hence+the+Professors+of+Leiden+say+that+laws+bind+not+primo+%26+per+se%2C+sed+secundario+%26+per+accidens+%5Bfirstly+and+of+themselves%2C+but+secondarily+and+by+accident%5D%2C+that+is+quatenus+in+illis+lex+aliqua+Dei+violatur+%5Binsofar+as+in+them+the+law+of+God+is+anyway+violated%5D.+Hence+I+may+compare+the+constitutions+of+the+Church+with+responsa+juris+consultorum+%5Bresponses+of+the+lawyers+of+the+law%5D+among+the+Romans%2C+which+obliged+no+man%2C+nisi+ex+aequo+%26+bono+%5Bexcept+out+of+equity+and+good%5D+says+Danaeus.+Hence+it+may+be+said+that+the+lawes+of+the+Church+do+only+bind+scandali+%26+contemptus+ratione+%5Bby+the+reason+of+scandal+and+contempt%5D%2C+as+Hospinian%2C+and+in+case+libertas+fiat+cum+scandalo+%5Bliberty+may+be+turned+into+scandal%5D%2C+as+Paraeus%3A+for+it+were+scandal%2C+not+to+give+obedience+to+the+laws+of+the+Church+when+they+prescribe+things+necessary+or+expedient+for+the+eschewing+of+scandal%2C+and+it+were+contempt+to+refuse+obedience+to+them+when+we+are+not+certainly+perswaded+of+the+unlawfulness+or+inexpediency+of+the+things+prescribed.+%E2%80%A6+We+deny+not+then+that+the+Churches%E2%80%99+canons+about+rites+which+serve+for+public+order+and+edification+do+bind%3A+We+say+only+that+it+is+not+the+authority+of+the+Church+framing+the+canon+that+binds%2C+but+the+matter+of+the+canon+chiefly%2C+warranted+by+God%E2%80%99s+Word.+Scimus+enim+quaecunque+ad+decorum+%26+ordinem+pertinent%2C+non+habenda+esse+pro+humanis+placitis%2C+quia+divinitus+approbantur+%28Calvin%2C+Resp.+ad+Libel.+de+Pii+Viri+Officio%2C+p.+413%29.+Therefore+we+think+concerning+such+canons+that+%E2%80%98they+are+necessary+to+be+observed+so+far+forth+only+as+the+keeping+of+them+maintains+decent+order+and+prevents+open+offence.%E2%80%99+%28Theodore+Beza%2C+Confession%2C+ch.+5%2C+Article+18%3B+Perkins%2C+ubi+supra.+%26+Meisner%2C+Philos.+sobr.%2C+part+3%2C+section+2%2C+question+12%29%E2%80%9D%0A%0A%E2%80%94+George+Gillespie%2C+English+Popish+Ceremonies...+%28Edinburgh%2C+1637%29+%7C+1st+Part%2C+ch.+4%2C+pp.+9-10&amp;url=https%3A%2F%2F5solasquotes.github.io%2Fquote%2F7901dc92e0.html&amp;via=5Solas" target="_blank" rel="noopener">Share on X</a><a class="perma" href="../quote/7901dc92e0.html">Permalink</a><a class="src" href="https://reformedbooksonline.com/on-guilt-innocence-in-breaking-church-ordinances-on-contumacy/#:~:text=But%20as%20we%20have%20seen%20in,part%203%2C%20section%202%2C%20question%2012&amp;text=But%20as%20we%20have%20seen%20in%20what%20respect&amp;text=Philos.%20sobr.%2C%20part%203%2C%20section%202%2C%20question%2012" rel="noopener" target="_blank">Read it online · Reformed Books Online</a></div>

<blockquote><p>6. If matters in their expediency be questionable and probable on both sides, the Church’s determination should end the controversy (say the Doctors), this is the doctrine of the Jesuits, Suarez, Thomas Sanches, and Gregory de Valentia, as I show[ed] before (supra, Question 6 of this treatise), when a thing is probable and I be resolved in conscience against neither of the sides, and fear the one side be [a] murdering him for whom Christ died, which is against God’s commandment, and know that human authority commands the contrary and am persuaded it is indifferent and a positive commandment of men: if the Church’s determination be here to sway my conscience to practice, is to me blind obedience for human authority, as it is such, gives no light. Ergo, it [the Church’s judgment] cannot remove my doubting and beget faith; and also the conscience is so much the bolder to venture on a sin against God for fear of eschewing a sin against men, which is questionable, and [that] in a matter indifferent; this is also the stout conscience of Bonaventura (2 Sentences, dist. 39), plus est standum praecepto Praelati quam conscientiae. 7. Our [Prelatist] Doctors say [that] our way is against the peace of the Church: But I answer [that] their way is Popish and against the truth of God in commanding our consciences to rest upon the wicked will of men.</p></blockquote>

<div class="actions"><button class="copy" data-copy="“6. If matters in their expediency be questionable and probable on both sides, the Church’s determination should end the controversy (say the Doctors), this is the doctrine of the Jesuits, Suarez, Thomas Sanches, and Gregory de Valentia, as I show[ed] before (supra, Question 6 of this treatise), when a thing is probable and I be resolved in conscience against neither of the sides, and fear the one side be [a] murdering him for whom Christ died, which is against God’s commandment, and know that human authority commands the contrary and am persuaded it is indifferent and a positive commandment of men: if the Church’s determination be here to sway my conscience to practice, is to me blind obedience for human authority, as it is such, gives no light. Ergo, it [the Church’s judgment] cannot remove my doubting and beget faith; and also the conscience is so much the bolder to venture on a sin against God for fear of eschewing a sin against men, which is questionable, and [that] in a matter indifferent; this is also the stout conscience of Bonaventura (2 Sentences, dist. 39), plus est standum praecepto Praelati quam conscientiae. 7. Our [Prelatist] Doctors say [that] our way is against the peace of the Church: But I answer [that] their way is Popish and against the truth of God in commanding our consciences to rest upon the wicked will of men.”

<main class="wrap"><figure class="quote" id="q-8c90bef990" data-kw="">
<blockquote><p>V. To make this clear, it must be observed that for the Reformed to seek peace and unity with other Protestants, it suffices if, after weighing and accurately judging everything according to God’s word, it appears that the remaining controversies between them are not such as to undermine the foundations of the Christian religion and true piety toward God. Thus, they can tolerate each other and recognize each other as brothers in Christ.

VI. This was the basis of the concord established a few years ago at Kassel between the theologians of Marburg and Rinteln. After both sides clearly and distinctly explained their doctrines and views to each other, and saw to what extent they agreed and what real differences remained, it was mutually acknowledged in good faith that what remained was not so significant as to prevent them from maintaining Christian and religious communion. Thus, they agreed on mutual tolerance and decided not to attack or insult each other but to maintain their own views until God revealed the truth to all while still communicating when the occasion arose, which has since been the practice.

VII. This was also the principle by which Paul attempted to reconcile believers of his time who contended among themselves over the observance of legal rites. He wanted those better instructed in Christian liberty, who had learned from the gospel that Mosaic ceremonies were abolished by Christ, to tolerate and bear with those still scrupulous about this matter and thought themselves bound to keep Mosaic ceremonies. He instructed them to admit such weak-in-faith individuals to their communion and not trouble their consciences by urging them to renounce their beliefs. This is reflected in Paul’s words to the Romans, “Accept the one whose faith is weak, without quarreling over disputable matters” (Romans 14:1), and to the Philippians, “If on some point you think differently, that too God will make clear to you. Only let us live up to what we have already attained” (Philippians 3:15-16).</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/louis-le-blanc.html">Louis Le Blanc</a></span><span class="wk"><span class="lbl">Work:</span> <cite>‘Whether from the proposed Reformed and Lutheran union, union with the Roman Church follows’ in Theological Theses Published at Various Times</cite>, ed. tr. by AI by Colloquia Scholastica (1675; London, 1683), pp. 950-57 Latin</span></figcaption>

</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-a9a7b7065a" data-kw="">
<blockquote><p>I. Since a division arose among Protestants regarding certain key points of the Christian religion, and those who follow the Helvetic, French, and Belgic Confessions have openly separated from those who adhere more closely to the Augsburg Confession [1530], the former, known specifically as the Reformed, have always tried to reconcile with those [Lutherans] of the Augsburg Confession, and have attempted various ways to establish ecclesiastical peace and remove the schism between the two groups.

II. Although these latter ones have often rejected the offered peace [by the Reformed] and many of them still seem very averse to it, sometimes the effort has met with success. For example, a hundred years ago at the Synod of Sandomierz, ministers who taught the Gospel of Christ according to both the Augsburg Confession and the Confession of the Waldensian Brethren and the Helvetic Churches in both Poland, Lithuania, and Samogitia came together in a common confession and were reconciled. Recently, in the Colloquium of Kassel, between the theologians of Marburg and Rinteln, a mutual communion was agreed upon despite remaining disagreements on what were considered fundamental issues.

III. Furthermore, in this century, there have been among other theologians of the Augsburg Confession some highly learned and celebrated men who publicly declared in their writings their desire for such ecclesiastical peace between the two Protestant parties and outlined the means to achieve it. For instance, Matthias, Bishop of Strängnäs in Sweden, in his book Northern Olive Branch, and George Calixtus, professor of theology at the University of Helmstedt, in his book Judgment on Theological Controversies between the Reformed and Lutherans.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/louis-le-blanc.html">Louis Le Blanc</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Theological Theses Published at Various Times</cite>, ed. tr. by AI by Colloquia Scholastica (1675; London, 1683), ‘Whether from the proposed Reformed and Lutheran union, union with the Roman Church follows,’, pp. 950-57 Latin</span></figcaption>

</figure><figure class="quote" id="q-31d09e463d" data-kw="">
<blockquote><p>Now why should we once name or make mention of that third kind of traditions, which do either shake the foundations of the salvation by Christ, either overthrow the things that are built upon that foundation. Such as are the supremacy of the bishop of Rome, the praying to saints, prayer for the dead, the making and the worshipping of idols, the magistral and doctoral determinations (as they call them) of free will, of merit, of pardons and of such other filthiness, the which things seeing they could never be established so long as the authority of the heavenly doctrine stood unshaken in his full force, so are they over impudent which do think that these things may be established either by the false forged title of the Church or by the prescription and length of time.</p></blockquote>

<blockquote><p>7. A particular Church of any one denomination, may fail in some points of doctrine and manners, and yet continue a living member of the true Church, if it fail not in fundamentals, and things simply necessary to salvation: for the light of truth has its degrees with men, and so has saving grace its intentions and remissions. The moon in the wane is the same which we sometimes see in the full. The Church of Ephesus, lost her first love, Rev: 2:4. The Church of Galatia was transported by false apostles into some dangerous opinions, Gal. 1, etc. The Church of Israel in Elijah’s time had in a great part forsaken the very covenants of God, 1 Kings 19:14, yet were there some names left, 7000 knees which had not bent to Baal. Now though no particular Church is exempt from the censure of the catholic, yet a Church is not presently to be forsaken by particular members thereof for some foul blemishes, nor many wicked men therein, though we must know that God sometimes for such things removes the candlestick from certain places, as from those seven famous Churches of Asia. ‘Tis not the place, but the saints which make the Church.</p></blockquote>

<div class="actions"><button class="copy" data-copy="“7. A particular Church of any one denomination, may fail in some points of doctrine and manners, and yet continue a living member of the true Church, if it fail not in fundamentals, and things simply necessary to salvation: for the light of truth has its degrees with men, and so has saving grace its intentions and remissions. The moon in the wane is the same which we sometimes see in the full. The Church of Ephesus, lost her first love, Rev: 2:4. The Church of Galatia was transported by false apostles into some dangerous opinions, Gal. 1, etc. The Church of Israel in Elijah’s time had in a great part forsaken the very covenants of God, 1 Kings 19:14, yet were there some names left, 7000 knees which had not bent to Baal. Now though no particular Church is exempt from the censure of the catholic, yet a Church is not presently to be forsaken by particular members thereof for some foul blemishes, nor many wicked men therein, though we must know that God sometimes for such things removes the candlestick from certain places, as from those seven famous Churches of Asia. ‘Tis not the place, but the saints which make the Church.”

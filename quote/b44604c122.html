<main class="wrap"><figure class="quote" id="q-b44604c122" data-kw="">
<blockquote><p>So that according to Zanchi, love and faith is one thing, when Christ is the object; therefore that love is not excluded from justification. And often he makes love to God as our end and chief good to go before faith in Christ as the way.</p></blockquote>

</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-04a4146caa" data-kw="">
<blockquote><p>It is a clear case, that these three [belief, fear and love] are the only means, yea a perfectly sufficient means to make the solder and the union between God and man, and to bring a man to the possession and fruition of God (for this comprehends the whole man), so that the whole man is possessed of God, and inflamed by God, when his understanding knows Him, and sees the excellency that is in Him, and when the affections of his heart cleave to Him, and close with the most sovereign affections of fear and love, and then when all his whole man is at the command of this, etc.</p></blockquote>

</figure><figure class="quote" id="q-c881c89bb4" data-kw="">
<blockquote><p>XXIII. This Orthodox doctrine of the justification of sinful man before God having been asserted from the Word of God, the following errors are overthrown: …

III. Of the Socinians:

      1. Who overthrow justification through and on account of Christ the Mediator and His λύτρον [lutron, ransom]; who admit no redemption and satisfaction of Christ except a metaphorical one.

      2. Who contend that Christ is our Saviour only on account of His prophetic and kingly office — inasmuch as He vindicated this title to Himself only by announcing salvation, confirming it, and communicating it, but not by meriting it. These and other portentous errors of this sort are both contrary to sacred Scripture and to the salutary doctrine of justification drawn and derived therefrom.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/friedrich-spanheim.html">Friedrich Spanheim</a></span><span class="wk"><span class="lbl">Work:</span> <cite>‘Disputation on the Justification of Man before God’ in Disputationum Theologicarum Miscellaneorum Pars Prima</cite>, (Geneva: Chouët, 1652), trans. AI by Roman Prestarri at Confessionally Reformed Theology</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/justification/nature-of-justification.html">Nature of Justification</a></span></div>

ormed Books Online</a></div>

<blockquote><p>Not any protestant divine… did ever teach that faith, new obedience, repentance are grounds upon which God justifies a sinner.</p></blockquote>

</figure><figure class="quote" id="q-b26f83fb13" data-kw="">
<blockquote><p>Consent I. They [Romanists] grant that in justification sin is pardoned by the merits of Christ, and that none can be justified without remission of sins: and that is well.

II. They grant that the righteousness whereby a man is made righteous before God, comes from Christ, and from Christ alone.

III. The most learned among them say that Christ’s satisfaction, and the merit of his death is imputed to every sinner that does believe, for his satisfaction before God: and hitherto we agree. The very point of difference is this: We hold that the satisfaction made by Christ in his death, and obedience to the Law, is imputed to us and becomes our righteousness. They say, it is our satisfaction and not our righteousness whereby we stand righteous before God: because it is inherent in the person of Christ as in a subject. Now the answer of the Papist to the former question is on this manner: The thing (says he) that makes us righteous before God, and causes us to be accepted to life everlasting, is remission of sins and the habit of inward righteousness, or charity with the fruits thereof. We condescend and grant that the habit of righteousness, which we call sanctification, is an excellent gift of God, and has his reward of God; and is the matter of our justification before man: because it serves to declare us to be reconciled to God, and to be justified; yet we deny it to be the thing, which makes us of sinners to become righteous or just before God. And this is the first point of our disagreement in the matter of justification: which must be marked; because if there were no more points of difference between us, this one alone were sufficient to keep us from uniting of our religions: for hereby the Church of Rome does raze the very foundation.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/william-perkins.html">William Perkins</a></span><span class="wk"><span class="lbl">Work:</span> <cite>A Reformed Catholic, The Eleventh Point</cite>, ... ([Cambridge] 1598), ch. 4, ‘The Justification of a Sinner’, pp. 926-27</span></figcaption>

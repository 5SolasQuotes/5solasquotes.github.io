<main class="wrap"><figure class="quote" id="q-89cd2cb2bd" data-kw="">
<blockquote><p>May any who profess the faith, and desire to come to the Lord’s supper, be kept from it? Such as are found to be ignorant or scandalous, notwithstanding their profession of the faith, and desire to come to the Lord’s supper, may and ought to be kept from that sacrament, by the power which Christ hath left in his church,[i] until they receive instruction, and manifest their reformation.[k] [i] 1 Cor. 11:27-34 compared with Matt. 7:6 and with 1 Cor. 5 and with Jude 23 and with 1 Tim. 5:22. [k] 2 Cor. 2:7.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/westminster-assembly.html">Westminster Assembly</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Westminster Larger Catechism #173</cite></span></figcaption>

</figure><figure class="quote" id="q-e59b4075dd" data-kw="">
<blockquote><p>[Rutherford’s] Answer: …no godly visible professors can tie themselves by [a] covenant or oath to exercise the common Christian acts of a church-member only to such a [local-church] society, but in an occasional and providential way: for it is as unlawful to tie Church-worship to one society or place under the New Testament, as it was to tie it of old to Bethel and Gilgal, Hos. 4:15 &amp; 9:14 &amp; 12:11; Amos 4:4, which is a demonstration that a godly professor carries about a soul with him, stands in need of Church-feeding by the Lord’s Supper and other Church ordinances in all the Christian world, and that he is to warn, admonish, comfort all Church-members, and to labor to gain a trespassing brother, not of the single congregation only whereof he is a member, Mt. 18, and neither Scriptures, nor sound divinity, nor the Law of Nature (which is not destroyed by the Gospel) will warrant to limit the word, ‘brother’, as Mr. [Thomas] Hooker does, and his Brethren, Mt. 18:15, ‘If thy brother trespass, if he hear thee, thou hast gained thy brother;’ to a brother only of the congregation of which the offended brother is a member…</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/samuel-rutherford.html">Samuel Rutherford</a></span><span class="wk"><span class="lbl">Work:</span> <cite>A Survey of the Survey of that Sum of Church-Discipline penned by Mr. Thomas Hooker... (1658), bk. 1</cite>, ch. 19; p. 102</span></figcaption>

</figure><figure class="quote" id="q-3a1f853f00" data-kw="">
<blockquote><p>…and if Brownism be a bitter error and way, then the way of the Apologists [who are congregationalists] is not very sweet, their way being but Brown’s younger brother, agreeing with the Brownists in the nature and definition of the visible Church, in the independent power of a particular congregation, in the way of making officers, in the way of their ordinances, as prophesying, in the way of forms of prayer, in the sacraments, none to be admitted but church members, cum multis alijs [with many other things], and I desire the Apologists to give any material difference (however their grounds are different, and they do not go so far in consequences, nor are not so gross) between their churches and the Brownists:</p></blockquote>

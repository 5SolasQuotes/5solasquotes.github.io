<main class="wrap"><figure class="quote" id="q-ebd4690abd" data-kw="">
<blockquote><p>When we are instituting comparisons between law and Gospel, let it not be forgotten that there was Gospel as well as law under the Jewish dispensation, and there is law as well as Gospel under the Christian.

Let it not be forgotten, in these days, that there was religious life under the old economy, as truly as there is under the new. Moses and Aaron were partakers of spiritual life as really as Peter and Paul: David and Isaiah were “alive unto God,” as surely as James and John.

In many and most important aspects, the Jewish and the Christian dispensations are alike. Spiritual life under both, is life by faith and not by works — a life dependent on divine promise and grace for its origin and continuance — a life of holiness under the same righteous law. But the two dispensations differ greatly from each other, thereby showing the inferiority of the earlier, and the exceeding superiority of the latter.

Under the Jewish economy, there was a life of faith, resting on God’s promise, and leading to holiness; but it was life involved in a measure of darkness concerning the method of acceptance — life under a measure of bondage by reason of the terrors of the law, ever so conspicuously presented to the view — and life restrained in its exercise because the full riches of divine grace were not then vouchsafed to the believing people of God.

But, under the Christian dispensation, while spiritual life is also a life of faith, resting on God’s promise, and leading to holiness, it is life whose faith is settled on the manifested Redeemer — life in the clear light of the Saviour’s work and example — life whose love has been kindled by the warmth of the Messiah’s great love, the sacred name from the eternal — life free from the law’s terror and condemnation — life developing under the unrestrained communications of the Spirit’s influence. Let us rejoice with exceeding gratitude, because of the excellence of that life which we have in Christ Jesus, our Lord; but let us not do despite to that law of God, which is “holy, just, and good.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/henry-calderwood.html">Henry Calderwood</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Moral Law in its Relation to Christian Life in Patrick Fairbairn et al., Divine Revelation Explained and Vindicated: A Course of Lectures for the Times, Delivered in Glasgow in the Spring of 1866</cite></span></figcaption>

</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-a5f9b1d95c" data-kw="">
<blockquote><p>No man can withdraw himself from the stated religious services of the community of which he is a member, without serious injury to his personal religious life. It is not without significance that the apostolic writer couples together the exhortations, “to hold fast the confession of our hope, that it waver not”, and “to forsake not the assembling of ourselves together.” When he commands us not to forsake “the assembling of ourselves together,” he has in mind, as the term he employs shows, the stated, formal assemblages of the community, and means to lay upon the hearts and consciences of his readers their duty to the church of which they are the supports, as well as their duty to themselves.

And when he adds, “As the custom of some is,” he means to put a lash into his command. We can see his lip curl as he says it. Who are these people who are so vastly strong, so supremely holy, that they do not need the assistance of the common worship for themselves; and who, being so strong and holy will not give their assistance to the common worship?</p></blockquote>

</figure><figure class="quote" id="q-35f6af8408" data-kw="">
<blockquote><p>I cannot set this forth in any plainer speech than David hath done in this short saying, ‘Kiss the Son, lest he be angry, and so you perish in the right way,’ Ps. ii. 12. By which speech the prophet teacheth, that God cannot be honoured by any other means than by that which Christ his Son hath taught, who saith himself in the fifth of John, ‘He that honoureth the Son, honoureth the Father; he that dishonoureth the Son, dishonoureth the Father.’

So that he meaneth in this place, that if you worship not the Son as he hath commanded, then you dishonour him; if you dishonour him, then you anger him; if you anger him, he casteth you off; if he casteth you off, then you err from the right way; and if you err from the right way, then you perish. For the avoiding whereof, all godly magistrates have had a special care to meditate in the law of the Lord; such were Moses, Joshua, David, Solomon, Asa, Jehoshaphat, Hezekiah, &amp;c. Of whose good example God grant all godly magistrates to make good use.</p></blockquote>

a></div>
</figure><figure class="quote" id="q-a529929750" data-kw="">
<blockquote><p>There are many promises that in gospel times magistrates shall lay out their power and exert their authority for the furtherance and preservation of the true worship of God, the profession of the faith, the worshippers and professors thereof, and therein the whole interest of Zion, Isa. i. 26, xlix. 22, 23; […] All the promises relating unto God’s providential dispensations in the world, with reference unto the interest of his church and people, do centre in this, that the rulers in and of the world shall exert and exercise their power in subserviency to the interest of Christ, which lies in his truth and his worship; which cannot be done if the power inquired after by denied, Isa. lx. 3, 11-17; Rev. xi. 15: To say, then, that the supreme magistrate, in a commonwealth of men professing the true Christian religion, ought not to exert his legislative and executive power in the defence and for the furtherance of the truth and worship of God, and for the restraint of the things that are destructive thereunto, is to say that “the promise of God is of no effect.</p></blockquote>

<blockquote><p>In these Ten Commandments was contained the sum and essence of all the law that was given unto Israel. Everything else in the way of law, that was delivered to the chosen people, had its foundation in those moral principles and precepts which the Decalogue contains.

This law laid down the rule of man’s obedience, — the righteous and immutable rule which defines and regulates his duty to God on the one hand, and to his fellow-creatures on the other.

The judicial law which, by Divine authority, was separately and subsequently instituted, was nothing more than the application of the great maxims of the moral law, to the government of Israel, as a church and nation placed under theocratic rule. In the details of that judicial law, there were necessarily, in such circumstances, many provisions of a merely local and temporary nature — intended for that people alone, and for the peculiar economy under which they lived. But in all its leading objects and aims, the judicial law of ancient Israel drew its spirit and derived its highest authority, from the law that was written on tables of stone.

Nor was it otherwise in the case of the ceremonial law. That law of meats and drinks, and divers washings and sacrifices of slain beasts, and other carnal ordinances, was, no doubt, in its literal and outward form, a purely positive institution, which had no moral worth or efficacy in itself considered. But nevertheless, the moral law — the law of the Ten Commandments — lay underneath it all. To transgress the moral law was to sin against God. And what was the great end and design of the ceremonial law, but to make palpable the awful and momentous fact, that sin is the abominable thing which God hates; and that without holiness — the holiness which the moral law embodies and demands — no man shall see the Lord.</p></blockquote>

<main class="wrap"><figure class="quote" id="q-003412738b" data-kw="">
<blockquote><p>At evening when the due time of repairing to rest approaches, call together again all thy family; read a chapter in the same manner that was prescribed in the morning; then, in a holy imitation of our Lord and his disciples, sing a psalm: but in singing of psalms, either after supper, or at any other time, observe these rules:

Rules to be observed in Singing of Psalms.

1. Beware of singing divine psalms for an ordinary recreation, as do men of impure spirits, who sing holy psalms intermingled with profane ballads: They are God’s word: take them not in thy mouth in vain.

2. Remember to sing David’s psalms with David’s spirit (Matt. xxii. 43.)

3. Practise St. Paul’s rule — “I will sing with the spirit, but I will sing with the understanding also.” (1 Cor. xiv. 15.)

4. As you sing uncover your heads (1 Cor. xi. 4), and behave yourselves in comely reverence as in the sight of God, singing to God in God’s own words; but be sure that the matter make more melody in your hearts (Eph. v. 19; Col. iii. 16) than the music in your ear; for the singing with grace in our hearts is that which the Lord is delighted withal, according to that old verse:

Non vox, sed votum; non miisica chordula, sed cor:

Non clamans, sed amana, psallit in aure Dei.

‘Tis not the voice, but vow;

Sound heart, not sounding string;

True zeal, not outward show,

That in God’s ear doth ring.

5. Thou mayest, if thou thinkest good, sing all the psalms over in order, for all are most divine and comfortable; but if thou wilt choose some special psalms, as more fit for some times and purposes, and such as, by the oft usage, thy people may the easier commit to memory.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/lewis-bayly.html">Lewis Bayly</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Practice of Piety: Directing a Christian to walk, that he may please God</cite>, (1612; Grand Rapids MI: Soli Deo Gloria, 2019), pp 154-55.</span></figcaption>

</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-4ddeaf76d2" data-kw="">
<blockquote><p>It is well known, that in the last century Mr. Rouse’s and Mr. Barton’s versions of the Psalms were much in use and highly esteemed and recommended by many; several other versions were also in use; but the New England and the Scotch were sung by many congregations, much recommended, being preferred by them as the closest versions and most agreeable to the original. For it was then the concurrent judgement of the dissenting churches, that nothing ought to be sung in public worship, but those psalms, hymns, and spiritual songs which God has provided his Church with in his inspired Word. But of late years these versions have been much despised by some, and laid aside by many congregations which formerly used them; because of the roughness of the lines… and other versions, or rather paraphrases on the psalms are made use of by them. Many others use hymns of mere human composure as preferable to the inspired ones. But there are yet many serious Christians, and some churches, that adhere to the sentiments of our godly ancestors in preferring Scripture psalms, hymns and songs to any mere human composures, lest they should incur the guilt of bringing strange fire to God’s altar…</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/samuel-pike.html">Samuel Pike</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Book of Psalms in Metre. Fitted to the Various Tunes in Common Use</cite>, … (London, 1751), ‘The Preface’, p. iii. Pike (1717?–1773) was an Independent minister in London, known for his work on cases of conscience. He argues for inspired Bible-song singing in the Preface.</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/worship/psalmody.html">Psalmody</a></span></div>

<blockquote><p>We allege, further, that there is no ground to conclude that the use of the inspired Psalms in the Church was abrogated at the close of the former economy.

It is an incontrovertible maxim, that whatever God has appointed to be observed in his worship should be perpetually observed, unless he himself intimated that it is temporary, or declares its abrogation. Singing God’s praise is obviously a moral duty, and, as such, of permanent obligation. Jehovah himself once appointed this duty to be performed in the words of David and Asaph; that is, by means of the inspired Psalms. Neither the duty of singing not the form of psalmody was of a ceremonial of judicial nature, [1] and, consequently, there is no reason to regard them abrogated when Christ came, and the partition wall was broken down. The church is, moreover, one in all ages. Every institution which her glorious Head has given her, she is bound carefully to observe, until it be abrogated by the same authority which first ordained it. No instance can be adduced in which the King of Zion has abrogated the use of the church’s inspired songs, or given permission to supplant them by the effusions of men. The divine sanction for using the Psalms is, therefore, yet disannulled, and the church now has the same warrant for drawing hence spiritual consolation, as had those to whom the sweet singer of Israel first delivered the inspired songs of Zion.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/covenanter.html">Covenanter</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Covenanter</cite>, Jan. 1835, p. 6</span></figcaption>

<blockquote><p>Q. 37: What is required touching singing of psalms in the church? That they be such as are parts of the Word of God, formed by the Holy Ghost into psalms or songs, which many may conveniently sing together, exhorting and admonishing themselves mutually with grace in their hearts (Matt. 26:30; Eph. 5:19; Col. 3:16).</p></blockquote>

<blockquote><p>Prayer of any sort is either mental or vocal… The latter goes outside the mind… Song is added to this. “Be full of the Spirit, speaking to one another with Psalms (also through musical instruments, which psallontai are mentioned), hymns (songs of whatever sort), and spiritual songs (constant in singing), singing the Psalms in your heart to the Lord” (Eph. 5:19; Col. 3:16). Some prayer is sudden, while some is premeditated and composed, and those either conceived or prescribed. Some are private, solitary or domestic, others are public, ordinary or extraordinary.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/johann-heinrich-heidegger.html">Johann Heinrich Heidegger</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Concise Marrow of Theology</cite>, (1697; RHB, 2019), Locus 23, ‘On the Grace of Sanctification’, section 14, p. 166</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/worship/psalmody.html">Psalmody</a></span></div>
<div class="actions"><button class="copy" data-copy="“Prayer of any sort is either mental or vocal… The latter goes outside the mind… Song is added to this. “Be full of the Spirit, speaking to one another with Psalms (also through musical instruments, which psallontai are mentioned), hymns (songs of whatever sort), and spiritual songs (constant in singing), singing the Psalms in your heart to the Lord” (Eph. 5:19; Col. 3:16). Some prayer is sudden, while some is premeditated and composed, and those either conceived or prescribed. Some are private, solitary or domestic, others are public, ordinary or extraordinary.”

<main class="wrap"><figure class="quote" id="q-b07c8bef17" data-kw="">
<blockquote><p>This dispute [with Hamilton] caused McWard a good deal of distress, and may well have hastened his death in May 1681. For these and other reasons Hamilton became decidedly unpopular among the Scottish exiles. Eventually realising that he was looked on generally as a ‘pest’–the term is his own–he decided, later in 1681, to leave Holland for good and move further into the Continent. His original intention was to go to Hungary, where he planned to align himself with the then persecuted supporters of the Protestant interest. He was dissuaded however from this by Herman Witsius, the great theologian of the Covenants, whom he had gone to see at Utrecht and with whom he was on friendly terms… …but rather go to the northern province of Friesland, where there was a particular work for him to do… and Witsius, when he consulted him again, nto only approved it but gave him a letter of introduction to a Friesland minister, William Brakel, of Leeuwarden… in Hamilton’s words, Brakel showed ‘unspeakable kindness’ to him, entertained him in his own house for several weeks, and gave him a most sympathetic hearing when he spoke of the plight of the persecuted church in Scotland. Brakel, indeed, was so impressed by what Hamilton told him that he wrote directly to the Societies expressing his strong support and concern at their plight and pledging himself to do all in his power to help them… Hamilton felt emboldened to broach… the possibility of having young men from the Societies trained for the ministry in Holland… Brakel and his friends offered not only to arrange for the students’ training, but to help with the costs themselves.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/maurice-grant.html">Maurice Grant</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Preacher to the Remnant: The Story of James Renwick</cite>, (Blue Banner Productions, 2009), p. 45</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/the-church/schism-and-separation.html">Schism and Separation</a></span></div>

</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-593ffe42d4" data-kw="">
<blockquote><p>It has been the sad observation of diverse, that every new trial has been the occasion of a new difference, if not division. The Lord partly, in his holy displeasure, withdrawing light and chastising his people for their sins, and partly trying and exercising of them in that great duty of mutual forbearance, so little made conscience of; and partly discovering infirmities, much dross in his own, by the contests so carnally managed.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/william-vilant.html">William Vilant</a></span><span class="wk"><span class="lbl">Work:</span> <cite>A Review &amp; Examination of a Book bearing the Title of The History of the Indulgence</cite>, … (London: Cockerill, 1681), Preface, p. 4</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/the-church/schism-and-separation.html">Schism and Separation</a></span></div>

</figure><figure class="quote" id="q-b9d7244e09" data-kw="">
<blockquote><p>It is known that many take offence at tolling of bells, at a minister’s [civilly appropriate] gown while he preaches, at the naming of the days of the week, after the Heathen style from the seven planets… It is true, bells are abused by Papists… But these be scandals taken, and not given, for we read not of scandals culpable in God’s word, but there be some apparent moral reason in them. 2. The object scandalizing has no necessity, why it should be. … Things that fall under an affirmative precept, and these cannot be totally omitted, for eschewing scandal: for whatever God has commanded, is some way necessary. Therefore, it some ways, and in some cases may be done, though offence be taken at it; but branches, or parts of affirmative precepts may be omitted for eschewing of scandal, as such a particular kneeling in prayer, in such a place¹…</p></blockquote>

ne · Reformed Books Online</a></div>
</figure><figure class="quote" id="q-a66813c47e" data-kw="">
<blockquote><p>There were schisms and contentions, envying and strife, incest and incest tolerated, such as is not named amongst the gentiles; going to law with their brethren for gain before infidels, harlotry, eating at the idol’s table, keeping fellowship with devils, coming to the Lord’s table drunken, eating and drinking damnation, a denying of a fundamental point of faith, the resurrection of the dead, and that with scoffing at it, murdering of weak souls whom Christ had died for, Paul’s name despitefully traduced.</p></blockquote>

<main class="wrap"><figure class="quote" id="q-7742e8c36a" data-kw="">
<blockquote><p>Nothing but the merit of Christ can be our righteousness in the sight of God, either as a whole, or a part only. We are justified only by believing, and receiving the righteousness of another, and not by our own works, or merit.</p></blockquote>

</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-b86bb291ee" data-kw="">
<blockquote><p>The Reformation doctrine of justification helps us to see that our salvation is the work of Christ for us. It also delivers us from a life of doubt and fear that causes us to wonder how God could possibly love sinners like us. It shows us that we have peace with God objectively because Christ has satisfied the demands of God for us, and it shows us subjectively because we can know confidently that by faith in Christ we are right with God.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/w-robert-godfrey.html">W. Robert Godfrey</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Tabletalk</cite>, April 2004, p. 18</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/justification/fruits-of-justification.html">Fruits of Justification</a> › <a href="../topics/justification/fruits-of-justification/peace-with-god.html">Peace with God</a></span><span class="t"><a href="../topics/assurance-peace-and-joy/spiritual-peace-and-joy.html">Spiritual Peace and Joy</a> › <a href="../topics/assurance-peace-and-joy/spiritual-peace-and-joy/peace-of-conscience.html">Peace of conscience</a></span></div>

</figure><figure class="quote" id="q-9fb981b913" data-kw="">
<blockquote><p>Here the question arises by what means are we justified? We answer with Paul, &quot;By faith only in Christ are we pronounced righteous, and not by works.&quot; Not that we reject good works. Far from it. But we will not allow ourselves to be removed from the anchorage of our salvation.</p></blockquote>

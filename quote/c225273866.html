<main class="wrap"><figure class="quote" id="q-c225273866" data-kw="">
<blockquote><p>Till our madness and profligacy in diversions, elections, and many things else, and the fearful murder, deceit, and robbery, committed in our East-India trade, and our hatred and contempt of Christ and his gospel, be turned into weeping, mourning, and girding with sack-cloth, I cannot expect any blessed prosperity for Britain. Nay, I am astonished that God, in his infinite patience, hath borne so long with us, and hath not dissolved us from being a nation.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/john-brown-of-haddington.html">John Brown of Haddington</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Parliament Dissolved in John Brown and Ebenezer Brown (eds), Select Remains of the Rev. John Brown, Late Minister of the Gospel at Haddington</cite></span></figcaption>

<blockquote><p>Thus there are certain devout Jews, so called, yet they stirred up persecution against Paul, Acts 13:50; 17:17. They were exceedingly affectionate and devout in their traditional worship they had of God; and so none [were] greater enemies to spiritual worship than they: So true is that of the apostle: ‘The wisdom of the flesh is enmity to God; and it is not, nor can be subject to Him,’ Rom. 8:7. [There is] No greater adversary in the world to the pure worship of God, than a man’s natural reason and carnal apprehensions, destitute of Scripture directions; all the false and superstitious worship which ever came into the Church (and she was scarce ever free) did flow from this fountain: a carnal and human judgment [about] what was fit and orderly, what was pleasing to God and what was displeasing. Austin observed this long ago; and certainly, the simplicity, and pure spiritual worship of God is very offensive and troublesome to carnal apprehensions. When therefore thou art to judge what is the best worship pleasing to God, and wherein He does most delight, do not consult with thy own methinks, or what custom and education has engaged thee to, but to what the Scripture informs therein.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/anthony-burgess.html">Anthony Burgess</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Spiritual Refining: or A Treatise of Grace and Assurance</cite>, … (London, 1652) | section 7, sermon 57</span></figcaption>

<blockquote><p>Those who go to their shops and exercise their trades openly or secretly on the Lord’s Day, thereby show that they mind the world more than God, and that they are more solicitous for the meat that perishes, than for that which endures to eternal life; and those who go to the ale-house, or follow their sports, and divert themselves or others with idle walking and talking, show that they mind the flesh more than God, and that they are wholly taken up with the mere animal life, and wretchedly estranged from the principles, powers, and pleasures of the spiritual and divine life.

If any pretend that they can perform the work of the Lord’s Day well enough, though they do not observe the rest of the day, they suppose themselves wiser than God, who has instituted the Sabbath rest in order to the better and more solemn management of the Sabbath work, both public and private.

We find now who are chargeable with the sin of profaning the Lord’s Day; let the conscience of everyone that is guilty herein deal faithfully with him in the reading of this, and say, “Thou art the man” (2 Samuel 12:7); thou art the man, the woman, that makest the Day of the Lord either a day of idleness, or a day of worldly business, and dost not spend it in the service of God and communion with Him.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/matthew-henry.html">Matthew Henry</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Sabbath: A Serious Address to those that Profane the Lord’s Day</cite>, (1713; Grand Rapids MI: Torwood Press, 2013), p. 8.</span></figcaption>

</figure><figure class="quote" id="q-2260bcf1bc" data-kw="">
<blockquote><p>God dwelt heretofore in his ark, inasmuch as He manifested his presence in it. But because the things which He set and made to be seen there were not [the] very nature, or the self-same perfections wherewith it is filled, but some simple effects of his power whereby the images of some of his perfections were in some sort delineated, it is evident that it cannot be truly said that the fulness of his Godhead dwelt there bodily [as in Col. 2:9]. Thus also manifested He Himself to Moses in the burning-bush, and afterwards to the apostles in cloven tongues as of fire, and before that the Holy Ghost appeared in the form of a dove. But besides that these manifestations being but transient, it cannot, upon them be affirmed that God ‘dwelt’ [as in Col. 2:9] in the bush or in the places where those other symbols appeared; besides this, I say, it is evident that the flame at the bush was not at all the divine nature, or any one of its perfections; and that neither the dove, nor the fiery tongues were any more the proper essence of the Holy Ghost or any one of his real and divine perfections, all these things being but forms created of God and consequently productions and works of his wherein He represented to his servants, as in a portrait or a rough-draught, some slight resemblance of what He is indeed. Whence it follows that though it might be said (which yet may not) of the places where these things appeared that the fulness of the Godhead dwelt in them, nevertheless it would be false to say that it dwelt in them bodily, it being clear that the things by reason whereof it should be said to have dwelt there, were not the body and the truth of his nature, but its shadow and symbol only… It remains then, we conclude, since the apostle here [in Col. 2:9] expressly asserts that all the fulness of the Godhead dwells bodily in Christ, that the divinity is in Him after a quite other manner than either in the symbols by which it is represented, or the creatures on which it sheds forth its grace and glory; that it so dwells in Jesus Christ as He has in Him, not some delineations and models by which it is figured forth, not those qualities and dispositions alone which it works by the presence of its grace in the most holy of its creatures, but its very self…</p></blockquote>

— Jean Daillé, Other citations (work not named), 49 Sermons upon the Whole Epistle… to the Colossians (d. 1670; London: White, 1672), pt. 2, 21st Sermon, on Col. 2:9, pp. 225-26">Copy</button><a class="share" href="https://x.com/intent/post?text=%E2%80%9CGod+dwelt+heretofore+in+his+ark%2C+inasmuch+as+He+manifested+his+presence+in+it.+But+because+the+things+which+He+set+and+made+to+be+seen+there+were+not+%5Bthe%5D+very+nature%2C+or+the+self-same+perfections+wherewith+it+is+filled%2C+but+some+simple+effects+of+his+power+whereby+the+images+of+some+of+his+perfections+were+in+some+sort+delineated%2C+it+is+evident+that+it+cannot+be+truly+said+that+the+fulness+of+his+Godhead+dwelt+there+bodily+%5Bas+in+Col.+2%3A9%5D.+Thus+also+manifested+He+Himself+to+Moses+in+the+burning-bush%2C+and+afterwards+to+the+apostles+in+cloven+tongues+as+of+fire%2C+and+before+that+the+Holy+Ghost+appeared+in+the+form+of+a+dove.+But+besides+that+these+manifestations+being+but+transient%2C+it+cannot%2C+upon+them+be+affirmed+that+God+%E2%80%98dwelt%E2%80%99+%5Bas+in+Col.+2%3A9%5D+in+the+bush+or+in+the+places+where+those+other+symbols+appeared%3B+besides+this%2C+I+say%2C+it+is+evident+that+the+flame+at+the+bush+was+not+at+all+the+divine+nature%2C+or+any+one+of+its+perfections%3B+and+that+neither+the+dove%2C+nor+the+fiery+tongues+were+any+more+the+proper+essence+of+the+Holy+Ghost+or+any+one+of+his+real+and+divine+perfections%2C+all+these+things+being+but+forms+created+of+God+and+consequently+productions+and+works+of+his+wherein+He+represented+to+his+servants%2C+as+in+a+portrait+or+a+rough-draught%2C+some+slight+resemblance+of+what+He+is+indeed.+Whence+it+follows+that+though+it+might+be+said+%28which+yet+may+not%29+of+the+places+where+these+things+appeared+that+the+fulness+of+the+Godhead+dwelt+in+them%2C+nevertheless+it+would+be+false+to+say+that+it+dwelt+in+them+bodily%2C+it+being+clear+that+the+things+by+reason+whereof+it+should+be+said+to+have+dwelt+there%2C+were+not+the+body+and+the+truth+of+his+nature%2C+but+its+shadow+and+symbol+only%E2%80%A6+It+remains+then%2C+we+conclude%2C+since+the+apostle+here+%5Bin+Col.+2%3A9%5D+expressly+asserts+that+all+the+fulness+of+the+Godhead+dwells+bodily+in+Christ%2C+that+the+divinity+is+in+Him+after+a+quite+other+manner+than+either+in+the+symbols+by+which+it+is+represented%2C+or+the+creatures+on+which+it+sheds+forth+its+grace+and+glory%3B+that+it+so+dwells+in+Jesus+Christ+as+He+has+in+Him%2C+not+some+delineations+and+models+by+which+it+is+figured+forth%2C+not+those+qualities+and+dispositions+alone+which+it+works+by+the+presence+of+its+grace+in+the+most+holy+of+its+creatures%2C+but+its+very+self%E2%80%A6%E2%80%9D%0A%0A%E2%80%94+Jean+Daill%C3%A9%2C+Other+citations+%28work+not+named%29%2C+49+Sermons+upon+the+Whole+Epistle%E2%80%A6+to+the+Colossians+%28d.+1670%3B+London%3A+White%2C+1672%29%2C+pt.+2%2C+21st+Sermon%2C+on+Col.+2%3A9%2C+pp.+225-26&amp;url=https%3A%2F%2F5solasquotes.github.io%2Fquote%2F2260bcf1bc.html&amp;via=5Solas" target="_blank" rel="noopener">Share on X</a><a class="perma" href="../quote/2260bcf1bc.html">Permalink</a><a class="src" href="https://reformedbooksonline.com/images-of-the-burning-bush-are-unlawful/#:~:text=God%20dwelt%20heretofore%20in%20his%20ark,its%20creatures%2C%20but%20its%20very%20self&amp;text=God%20dwelt%20heretofore%20in%20his%20ark%2C%20inasmuch%20as&amp;text=holy%20of%20its%20creatures%2C%20but%20its%20very%20self" rel="noopener" target="_blank">Read it online · Reformed Books Online</a></div>

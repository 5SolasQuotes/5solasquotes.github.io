<main class="wrap"><figure class="quote" id="q-a702a69ba8" data-kw="">
<blockquote><p>Since the initiative belongs to God in the order of grace, no one can merit the initial grace of forgiveness and justification, at the beginning of conversion. Moved by the Holy Spirit and by charity, we can then merit for ourselves and for others the graces needed for our sanctification, for the increase of grace and charity, and for the attainment of eternal life. Even temporal goods like health and friendship can be merited in accordance with God&#x27;s wisdom.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/catholic-church.html">Catholic Church</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Catechism of the Catholic Church</cite>, §2010</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/good-works/merit-and-reward.html">Merit and Reward</a></span><span class="t"><a href="../topics/good-works/merit-and-reward.html">Merit and Reward</a> › <a href="../topics/good-works/merit-and-reward/merit-of-condignity-and-congruity.html">Merit of condignity and congruity</a></span><span class="t"><a href="../topics/rome/justification.html">Rome: Justification</a> › <a href="../topics/rome/justification/merit.html">Merit</a></span></div>

</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-289bf00ef4" data-kw="">
<blockquote><p>By his good works the just man may merit for himself many graces and favours, not, however, by right and justice (de condigno), but only congruously (de congruo). Most theologians incline to the opinion that the grace of final perseverance is among the objects of congruous merit, which grace, as has been shown above, is not and cannot be merited condignly.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/joseph-pohle.html">Joseph Pohle</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Catholic Encyclopedia</cite>, s.v. “Merit” (1911)</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/justification/merit-of-congruity-and-condignity.html">Merit of Congruity and Condignity</a> › <a href="../topics/justification/merit-of-congruity-and-condignity/merit-of-congruity.html">Merit of congruity (de congruo)</a></span><span class="t"><a href="../topics/good-works/merit-and-reward.html">Merit and Reward</a> › <a href="../topics/good-works/merit-and-reward/merit-of-condignity-and-congruity.html">Merit of condignity and congruity</a></span><span class="t"><a href="../topics/rome/justification.html">Rome: Justification</a> › <a href="../topics/rome/justification/merit.html">Merit</a></span></div>

— Joseph Pohle, The Catholic Encyclopedia, s.v. “Merit” (1911)">Copy</button><a class="share" href="https://x.com/intent/post?text=%E2%80%9CBy%20his%20good%20works%20the%20just%20man%20may%20merit%20for%20himself%20many%20graces%20and%20favours%2C%20not%2C%20however%2C%20by%20right%20and%20justice%20%28de%20condigno%29%2C%20but%20only%20congruously%20%28de%20congruo%29.%20Most%20theologians%20incline%20to%20the%20opinion%20that%20the%20grace%20of%20final%20perseverance%20is%20among%20the%20objects%20of%20congruous%20merit%2C%20which%20grace%2C%20as%20has%20been%20shown%20above%2C%20is%20not%20and%20cannot%20be%20merited%20condignly.%E2%80%9D%0A%0A%E2%80%94%20Joseph%20Pohle%2C%20The%20Catholic%20Encyclopedia%2C%20s.v.%20%E2%80%9CMerit%E2%80%9D%20%281911%29&amp;url=https%3A%2F%2F5solasquotes.github.io%2Fquote%2F289bf00ef4.html&amp;via=5Solas" target="_blank" rel="noopener">Share on X</a><a class="perma" href="../quote/289bf00ef4.html">Permalink</a><a class="src" href="https://www.newadvent.org/cathen/10202b.htm" rel="noopener" target="_blank">Read it online · New Advent</a></div>
</figure><figure class="quote" id="q-fb00224ded" data-kw="">
<blockquote><p>No one can merit the initial grace which is at the origin of conversion. Moved by the Holy Spirit, we can merit for ourselves and for others all the graces needed to attain eternal life, as well as necessary temporal goods.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/catholic-church.html">Catholic Church</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Catechism of the Catholic Church</cite>, §2027</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/good-works/merit-and-reward.html">Merit and Reward</a></span><span class="t"><a href="../topics/good-works/merit-and-reward.html">Merit and Reward</a> › <a href="../topics/good-works/merit-and-reward/merit-of-condignity-and-congruity.html">Merit of condignity and congruity</a></span><span class="t"><a href="../topics/rome/justification.html">Rome: Justification</a> › <a href="../topics/rome/justification/merit.html">Merit</a></span></div>
<div class="actions"><button class="copy" data-copy="“No one can merit the initial grace which is at the origin of conversion. Moved by the Holy Spirit, we can merit for ourselves and for others all the graces needed to attain eternal life, as well as necessary temporal goods.”

— Catholic Church, Catechism of the Catholic Church, §2027">Copy</button><a class="share" href="https://x.com/intent/post?text=%E2%80%9CNo%20one%20can%20merit%20the%20initial%20grace%20which%20is%20at%20the%20origin%20of%20conversion.%20Moved%20by%20the%20Holy%20Spirit%2C%20we%20can%20merit%20for%20ourselves%20and%20for%20others%20all%20the%20graces%20needed%20to%20attain%20eternal%20life%2C%20as%20well%20as%20necessary%20temporal%20goods.%E2%80%9D%0A%0A%E2%80%94%20Catholic%20Church%2C%20Catechism%20of%20the%20Catholic%20Church%2C%20%C2%A72027&amp;url=https%3A%2F%2F5solasquotes.github.io%2Fquote%2Ffb00224ded.html&amp;via=5Solas" target="_blank" rel="noopener">Share on X</a><a class="perma" href="../quote/fb00224ded.html">Permalink</a><a class="src" href="https://www.vatican.va/archive/ENG0015/__P72.HTM" rel="noopener" target="_blank">Read it online · Vatican</a></div>
</figure><figure class="quote" id="q-1be46483e7" data-kw="">
<blockquote><p>From an ethical point of view the difference practically amounts to this that, if the reward due to condign merit be withheld, there is a violation of right and justice and the consequent obligation in conscience to make restitution, while, in the case of congruous merit, to withhold the reward involves no violation of right and no obligation to restore, it being merely an offence against what is fitting or a matter of personal discrimination (acceptio personarum). Hence the reward of congruous merit always depends in great measure on the kindness and liberality of the giver, though not purely and simply on his good will.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/joseph-pohle.html">Joseph Pohle</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Catholic Encyclopedia</cite>, s.v. “Merit” (1911)</span></figcaption>

</figure><figure class="quote" id="q-5444a34f69" data-kw="">
<blockquote><p>So then, we do good works, but not for merit— for what would we merit? Rather, we are indebted to God for the good works we do, and not God to us, since God “is at work in [us], enabling [us] both to will and to work for his good pleasure” (Phil. 2:13).</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/guido-de-bres.html">Guido de Brès</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Belgic Confession</cite>, Art. 24</span></figcaption>

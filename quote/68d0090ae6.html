<main class="wrap"><figure class="quote" id="q-68d0090ae6" data-kw="">
<blockquote><p>The infants of Christians are citizens of the Church, are born in the Covenant, with federal grace, and saints of saints: as citizens are born of citizens, the free are born of the free, slaves are born of slaves.</p></blockquote>

<div class="meta"><span class="t"><a href="../topics/baptism/subjects-of-baptism.html">Subjects of Baptism</a></span></div>

</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-ab2d9d02b6" data-kw="">
<blockquote><p>…use the best skill you have to instruct your children and servants, yet this is no reason to withdraw them from public instructions: nor can any man, who understands his religion, think he discharges his duty to God and the Church, merely by his private instruction of his family, when he neglects, or refuses to bring them to public instructions. 3. For he must consider, that his children and servants, who are baptized, are members of the Christian Church, and therefore ought to be subject to the instructions and discipline of it, as far as their age and capacity will permit. They do not only belong to his private care, but to the public care of the Church, who is to provide for the instruction of her children; and to deny the Church liberty to instruct her children, or not to interpose their own authority to make them submit to it, is to withdraw their children from the communion of the Church, after a solemn dedication of them to God.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/william-sherlock.html">William Sherlock</a></span><span class="wk"><span class="lbl">Work:</span> <cite>A Practical Discourse of Religious Assemblies… (London, 1681), pt. 2, ch. 5, pp. 303-4 Sherlock was an Anglican.</cite></span></figcaption>

</figure><figure class="quote" id="q-3f8c2f0925" data-kw="">
<blockquote><p>…ye [Separatists] are full Donatists [Eary Church heretics]… you do agree with them in the sum and substance of all the fowlest things…: … 16. That ye deny baptism to the children of open sinners which yet remain in the Church… 17. That ye make the stableness of God’s Covenant towards his Church to depend upon the works of men… 18. That ye hold circumcision among the Ten Tribes, or in Judah in time of idolatry, was no true seal of the Covenant, and yet ye say that concerning the outward cutting it was true circumcision: the like ye say of baptism administered in Popery.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/george-gifford.html">George Gifford</a></span><span class="wk"><span class="lbl">Work:</span> <cite>A Short Reply unto the Last Printed Books of Henry Barrow &amp; John Greenwood, the Chief Ringleaders of our Donatists in England… (London, 1591)</cite>, p. 97</span></figcaption>

</figure><figure class="quote" id="q-b67c148690" data-kw="">
<blockquote><p>For we do not see it necessary to posit, or even possible to posit, actual faith in those infants (which some conjecture, others strongly assert), unless it is solidly proved from Scripture. For that extraordinary and miraculous motion of John the Baptist, Lk. 1:44, seems to contribute nothing to this matter. Since from a miracle no consequence is valid to the ordinary force, causality, disposition, act, or effect of any thing.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/gisbertus-voetius.html">Gisbertus Voetius</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Disputation 29, ‘On Regeneration’, pt. 1 (1639) tr. AI by Roman Prestarri in Select Theological Disputations (1655), vol. 2, p. 432 ff. Latin at Confessionally Reformed Theology</cite></span></figcaption>
<div class="meta"><span class="t"><a href="../topics/baptism/subjects-of-baptism.html">Subjects of Baptism</a></span></div>

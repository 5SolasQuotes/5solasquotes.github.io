<main class="wrap"><figure class="quote" id="q-7b61e11f2c" data-kw="">
<blockquote><p>VI. Consummation or final perfection at the end of life. Hence death is called the abolition of sin by our [Heidelberg] Catechism, Question 42—just as the generation of one is called the corruption of another. For the abolition of sin is a consequent of death in the instant of nature, but a concomitant or connected thing in the instant of time. For these things happen simultaneously, so that in the first instant after death there is no longer any original sin, no struggle in the souls of the elect, and consequently no actual sin is any longer committed. This is elicited from 1 Cor. 13:9–10, colated with Heb. 12:23, where it treats of the state of blessed souls after death. To which also Heb. 4:10 can be referred, and the vow of the apostle in Phil. 1:21, 23, where τὸ κρεῖσσον [the better thing] is to be understood especially also with respect to the evil of guilt. This reason also is added: because nothing unclean shall enter (Rev. 21:27)—if indeed that place is expounded concerning the heavenly receptacle of souls—and Eph. 5:27. Finally, the final victory is in death and after death (2 Tim. 4:8). Therefore they are then free from all conflict, from every enemy—namely from that domestic one (Gal. 5:17, collated with Rom. 7:20). Problem 1. Whether Romans 7:24 can or ought to be understood as the body of sin or the old man, or rather as the mortal body which we carry about here? Response: Either can be understood. 2. Whether the laying down of the body in death is properly called the adequate and proximate cause of its abolition, and can be demonstrated therefrom? Response: Negative. 3. Whether the consummation of the sanctification of the soul departing hence is a work of the regenerating Spirit qua talis [as such]? Response: I do not see why this crowning and consummating grace cannot be attributed to the regenerating and sanctifying Spirit as such. 4. Whether the regenerate soul here conducts itself purely passively, or rather actively concurs with the motion of the Spirit, and that by virtue of the new creature implanted in it as the principium quo [principle by which]? Response: The latter can be affirmed. 5. Whether all that augmentation or degree which is required for perfection is infused at once and simultaneously, and thus added to the holiness or indwelling Spirit? Response: Affirmative. 6. Whether in the same instant of time in which sanctification and holiness (namely, in first act) is perfected, it is also excited to second act? Response: Nothing absurd is committed if this is affirmed. 7. Whether those very first acts elicited from perfection are to be reduced to the light of grace and the state of regeneration, or rather to the light of glory and the state of glorification? Response: I incline to the affirmative of the latter. 8. Whether perfect sanctification is accomplished in the same instant of time in which a man dies, or rather in the instant after, or in some instants afterward—if indeed a small delay of time is said to intervene, during which the separated soul is locally transferred into heaven; so that, with that small delay intervening, or at least in the proximate instant after the instant of death and in the instant before entrance into heaven, this is accomplished, and thus it does not enter into heaven without perfection? Response: I would rather ἐπέχειν [suspend judgment] here and hear the opinions of others.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/gisbertus-voetius.html">Gisbertus Voetius</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Disputation 30, ‘On Regeneration’, pt. 2</cite>, (1639) tr. AI by Roman Prestarri in Select Theological Disputations (1655), vol. 2, pp. 447ff. Latin at Confessionally Reformed Theology</span></figcaption>

C+and+can+be+demonstrated+therefrom%3F+Response%3A+Negative.+3.+Whether+the+consummation+of+the+sanctification+of+the+soul+departing+hence+is+a+work+of+the+regenerating+Spirit+qua+talis+%5Bas+such%5D%3F+Response%3A+I+do+not+see+why+this+crowning+and+consummating+grace+cannot+be+attributed+to+the+regenerating+and+sanctifying+Spirit+as+such.+4.+Whether+the+regenerate+soul+here+conducts+itself+purely+passively%2C+or+rather+actively+concurs+with+the+motion+of+the+Spirit%2C+and+that+by+virtue+of+the+new+creature+implanted+in+it+as+the+principium+quo+%5Bprinciple+by+which%5D%3F+Response%3A+The+latter+can+be+affirmed.+5.+Whether+all+that+augmentation+or+degree+which+is+required+for+perfection+is+infused+at+once+and+simultaneously%2C+and+thus+added+to+the+holiness+or+indwelling+Spirit%3F+Response%3A+Affirmative.+6.+Whether+in+the+same+instant+of+time+in+which+sanctification+and+holiness+%28namely%2C+in+first+act%29+is+perfected%2C+it+is+also+excited+to+second+act%3F+Response%3A+Nothing+absurd+is+committed+if+this+is+affirmed.+7.+Whether+those+very+first+acts+elicited+from+perfection+are+to+be+reduced+to+the+light+of+grace+and+the+state+of+regeneration%2C+or+rather+to+the+light+of+glory+and+the+state+of+glorification%3F+Response%3A+I+incline+to+the+affirmative+of+the+latter.+8.+Whether+perfect+sanctification+is+accomplished+in+the+same+instant+of+time+in+which+a+man+dies%2C+or+rather+in+the+instant+after%2C+or+in+some+instants+afterward%E2%80%94if+indeed+a+small+delay+of+time+is+said+to+intervene%2C+during+which+the+separated+soul+is+locally+transferred+into+heaven%3B+so+that%2C+with+that+small+delay+intervening%2C+or+at+least+in+the+proximate+instant+after+the+instant+of+death+and+in+the+instant+before+entrance+into+heaven%2C+this+is+accomplished%2C+and+thus+it+does+not+enter+into+heaven+without+perfection%3F+Response%3A+I+would+rather+%E1%BC%90%CF%80%CE%AD%CF%87%CE%B5%CE%B9%CE%BD+%5Bsuspend+judgment%5D+here+and+hear+the+opinions+of+others.%E2%80%9D%0A%0A%E2%80%94+Gisbertus <blockquote><p>…some speak of a sentence [in justification] before the angels, as if God did declare before them who is righteous; but this I think is altogether unscriptural: others speak of a sentence in conscience, but this is but the manifestation of justification. Let us first distinguish of justification, and then answer. There is a double justification, constitutive justification, whereby God makes us just in this life; sentential justification, whereby God pronounces us just at death and judgment. Constitutive justification is the foundation of sentential, for the true God will not pronounce us just unless we are such, and sentential justification is the compleature of constitutive: For here there is sententia judicis [a sentence of judgment] crowning us as righteous;</p></blockquote>

</figure><figure class="quote" id="q-b5655c6311" data-kw="">
<blockquote><p>Nor can I address every issue that arise in connection with the question of when the life of a human being ends, which has become no less heated because of its relationship to the ethics of euthanasia.† But as with the embryo, so too with human beings whose rational faculties no longer function due to brain damage, the fact that the exercise of a power is absent does not entail that the power itself is absent, or that the substantial form that grounds the power is absent. Recall what was said in chapter 5 about the relationship between a substance’s properties and the essence from which they flow or follow. The manifestation of the properties that flow from a substance’s essence can be blocked because of either damage or incomplete development, but the essence itself is nevertheless still there. † For treatment of the subject from an Aristotelian hylemorphist point of view, see Oderberg, Applied Ethics, chapter 2, and David S. Oderberg, “Death, Unity, and the Brain,” Theoretical Medicine and Bioethics 40 (2019): 359-79. The bottom line is that given hylemorphism, if a living human body is present, then its substantial form is present, which entails that the soul is present. Hence we are dealing with a rational animal or human being, whether or not the human being happens to be capable of exercising all his distinctively human powers.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/edward-feser.html">Edward Feser</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Immortal Souls: a Treatise on Human Nature Ref</cite>, (Editiones Scholastica, 2024), pt. 4, ch. 11, pp. 512-13</span></figcaption>

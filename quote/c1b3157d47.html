<main class="wrap"><figure class="quote" id="q-c1b3157d47" data-kw="">
<blockquote><p>All the other precepts of this [moral] Law remaining in full force in their proper sense, it cannot but be an injury done to this Command, either flatly to refuse it that privilege, or, which is little better, to evaporate it into allegories.

Nor was the day abolished as a typical ceremony, but that seventh only changed to a seventh still, and the very next to it; He who is Lord of the Sabbath, either himself immediately, or by his authority in his apostles, appointing that day of his resurrection for our sabbath, adding to the remembrance of the first creation, the memorial of accomplishing the new creation, the work of our redemption, which appeared then manifestly to be perfected, when our Redeemer broke the chains of death, and arose from the grave; he who is the light of the new world, shining forth anew the same day that light was made in the former creation.

This day was St. John, in the Spirit, taken up with those extraordinary revelations. Rev. i. 10. They were extraordinary indeed. And certainly, every Christian ought to be in the Spirit, in holy meditations and exercises on this day, more than the rest; winding up his soul, which the body poises downwards, to a higher degree of heavenliness;—ought to be particularly careful to bring a humble heart to speak to God in prayer, and hear Him in His word, a heart breathing after Him, longing to meet with Himself in His ordinances. And certainly, it is safer and sweeter to be thus affected towards the Lord’s day, than to be much busied about the debate of the change.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/robert-leighton.html">Robert Leighton</a></span><span class="wk"><span class="lbl">Work:</span> <cite>An Exposition of the Ten Commandments</cite>, (1701) in The Whole Works of the Most Reverend Father in God, Robert Leighton, D.D., Archbishop of Glasgow (2 vols, London: James Duncan, 1828), 2: 382.</span></figcaption>

</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-548c34f841" data-kw="">
<blockquote><p>Gregory says in a homily (vi in Evang.): ‘An idle word is one that lacks either the usefulness of rectitude or the motive of just necessity or pious utility.’ But an idle word is an evil, because ‘men… shall render an account of it in the day of judgment’ (Mt. 12:36): while if it does not lack the motive of just necessity or pious utility, it is good. Therefore every word is either good or bad. For the same reason every other action is either good or bad. Therefore no individual action is indifferent. …It sometimes happens that an action is indifferent in its species, but considered in the individual it is good or evil. And the reason of this is because a moral action… derives its goodness not only from its object, whence it takes its species; but also from the circumstances, which are its accidents, as it were; just as something belongs to a man by reason of his individual accidents, which does not belong to him by reason of his species. And every individual action must needs have some circumstance that makes it good or bad, at least in respect of the intention of the end. For since it belongs to the reason to direct; if an action that proceeds from deliberate reason be not directed to the due end, it is, by that fact alone, repugnant to reason, and has the character of evil. But if it be directed to a due end, it is in accord with reason; wherefore it has the character of good. Now it must needs be either directed or not directed to a due end. Consequently every human action that proceeds from deliberate reason, if it be considered in the individual, must be good or bad.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/thomas-aquinas.html">Thomas Aquinas</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Other citations (work not named)</cite>, pt. 2, pt. 1, question 18, ‘Of the Good &amp; Evil of Human Acts in General’ in Summa | 9. ‘Whether an individual action can be indifferent?’ [No]</span></figcaption>

<blockquote><p>the eighth anathema of the Council of 754, which condemns anyone who would contemplate the incarnate Logos ‘through the medium of material colors, and does not worship him with the whole heart, with the eyes of the mind, as he sits in excelsis, more dazzling than the sun, at the right hand of God, on the throne of glory.’ The whole case in behalf of this type of image is summarized in the sixteenth anathema of the Council as follows: ‘If anyone ventures to set up profitless figures of all the saints in soul-less, speechless images made of material colors — for this is a vain invention and the discovery of diabolical craft — and does not, on the contrary, reproduce their virtues in himself as actually living images, with the aid of what has been recorded about them in books, in order to be stimulated to zeal like theirs, as our inspired fathers have said, let him be anathema.’</p></blockquote>

</figure><figure class="quote" id="q-24e462fdf9" data-kw="">
<blockquote><p>The impiety and unrighteousness of men against God, being manifested in the Example of the Gentiles, he shews the wrath of God to be poured out upon the wicked; and withal the greatness of their iniquity, In that God gave them up judicially to their own affections, and most justly left them to themselves, for a punishment of their abominable Idolatry: That they which robbed God of his glory, might suffer in, and by themselves, the foulest ignominy: And that they which changed the glorious Attributes of God into lying images (which are nothing less than what they are called) should change themselves into beasts by their unbridled lusts. They are said to worship and serve things created, passing by the Creator: For although Idolaters seem, in the false representation of God by an Image, to intend him honour and worship, yet God altogether rejects that worship, and leaves it wholly to the Image or Creature, with whom he will not by any means share his worship.

God is called in this place, Blessed for ever, that we may know that the injurious carriage of Idolaters can detract nothing from the felicity of God; But that his glory and blessedness will abide for ever, to whom we all of us ought with the Apostle to ascribe it, saying, AMEN. …

In the Example of the Gentiles is propounded a further demonstration of man’s unrighteousness, and Gods wrath against the wicked: To wit, that God gave them up judicially to the hands of their own lusts, and defiled spirits (who served their own corrupt affections in matter of Religion) that (against Nature) the men and women in their abominable Sodomitical filthiness (below beasts, in their unnatural lusts) by way of requital should debase themselves, who by their Idolatry had abased the glory of God, in resembling him to Creatures and fictions of their own.</p></blockquote>

God is called in this place, Blessed for ever, that we may know that the injurious carriage of Idolaters can detract nothing from the felicity of God; But that his glory and blessedness will abide for ever, to whom we all of us ought with the Apostle to ascribe it, saying, AMEN. …

In the Example of the Gentiles is propounded a further demonstration of man’s unrighteousness, and Gods wrath against the wicked: To wit, that God gave them up judicially to the hands of their own lusts, and defiled spirits (who served their own corrupt affections in matter of Religion) that (against Nature) the men and women in their abominable Sodomitical filthiness (below beasts, in their unnatural lusts) by way of requital should debase themselves, who by their Idolatry had abased the glory of God, in resembling him to Creatures and fictions of their own.”

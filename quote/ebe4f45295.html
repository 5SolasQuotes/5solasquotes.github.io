<blockquote><p>MINISTERS should preserve a People from Corruption by good Government. God has given power of ruling to Ministers. Heb. 13.13. Obey them that rule you and submit to them. He has given a power of binding and losing. Mat. 16.19. What thou shalt bind on earth shall be bound in heaven. And he appoints that they rule well, 1 Tim 5.17. Ministers have a corrcive [corrective] power to execute censures on them that are obstinate.

Ministers must have a tender and compassionate spirit, but when Men are sturdy and rebellious, severity is compassion; executing Ecclesiastical censures is a terror to evil doers: this is a proper means that their spirits may be saved in the day of the Lord Jesus, 1 Cor. 5.5. Though private revenge is utterly forbidden, yet they are to revenge disobedience: 2 Cor. 10.6. Having in a readiness to revenge all disobedience. This is the way to purge out the old leaven, to bring Men to repentance, and to put a stop to growing iniquities, that the Land be not defiled.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/solomon-stoddard.html">Solomon Stoddard</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The duty of Gospel-ministers to preserve a people from corruption. Set forth, in a sermon preached at Brookfield, October 16. 1717. Being the day wherein the church was gathered, and Mr. Thomas Cheney, was ordained Pastor</cite>, (Boston: Samuel Phillips, 1718), p. 12.</span></figcaption>

</figure><figure class="quote" id="q-6b823de2b7" data-kw="">
<blockquote><p>Many today, from Radical Two Kingdom theologians to American Theonomists, think that you can be Reformed without adhering to the establishment principle. Indeed, some of them even accuse establishmentarians of being crypto-papists or crypto-communists (it is hard to know which is more absurd). The reality, however, is that the denial of the establishment principle is enough to exclude one from the pale of Reformed orthodoxy. As the Scottish Seceder William MacKray reminds us the Reformers, all of whom rejected Popery as the antichrist, regarded the establishment principle as anything but a left-over from Rome:

Among the Reformers from Popery — those master-spirits of the sixteenth century — the doctrine, that it is the duty of Christian rulers to protect the Church and her Institutions, and to provide for their maintenance throughout their dominions — was any thing but a matter of doubtful dispute. They demanded, and, with admirable resolution, persevered in endeavoring to accomplish the overthrow of the whole system, root and branch, of Papal idolatry and superstition, that had been for ages the curse and scourge of the nations of Europe;—but they demanded, at the same time, that the emancipated nations should do homage to Christ, by assuming and maintaining a pure and public profession of his name; and that the kings of the earth, who had long given their power to the beast, should now transfer it to the service of Him who “is the Prince of the kings of the earth.” It has been said, indeed, that this doctrine was one of the abominations of Antichrist, which they brought with them from the darkness in which they had been involved. But the assertion is altogether gratuitous.

The truth is, my brethren, the minds of these men were anything but predisposed to retain in their profession the peculiarities of Popery. They had felt its yoke to be so galling, and the utter ungodliness of the whole system was, in the light of God’s word, so plainly revealed before their view, that they were under strong inducement, in the circumstances in which they were placed, to reject every thing that had been at all connected with it. It was because they saw the principle in question to be so important for the welfare of the Church, and so clearly deducible from that divine record which they had been honored to bring forth from Antichristian darkness to the view of mankind, that they retained it in their creed.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/william-mackray.html">William MacKray</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Defence of civil establishments of religion in Reformed Presbyterian</cite></span></figcaption>

</figure><figure class="quote" id="q-eed89394a8" data-kw="">
<blockquote><p>The next debate of this nature and kind that fell in was, first, about accepting the [civil] indulgence, then about hearing indulged ministers. As to the first, this made no schism, so long as ministers held their debates among themselves. Some accepted, some not. Those who accepted preached in those parishes where they were indulged; others elsewhere, and sometimes there with them. The indulged ministers also preached elsewhere as they had occasion and access, but thought it not duty to offend the magistrate in breaking confinement to go unnecessarily elsewhere to preach, and thereby hazard the peaceable public exercise of their ministry, which was all they acknowledged they held of the magistrate… neither thought they the keeping of their confinement, though unjustly imposed, a sin, but rather suffering on their part.</p></blockquote>

e</a></div>

<blockquote><p>The principle of Church Establishments, properly understood, and apart from adventitious circumstances, is just the principle of national religion. It has many ramifications all springing from an acknowledgment of the universal supremacy of Christ, and bearing upon the duty of nations and their rulers to promote the advancement of true religion, and the prosperity of Christ’s cause and kingdom.

It is connected with the protection of the Sabbath, the promotion of scriptural education in the public schools, the conservation of the purity of the Scriptures, and the sacredness of the law of marriage. It assumes that nations are moral and responsible creatures, accountable to God in their corporate capacity, and the proper subjects of rewards and punishments.

It implies that wherever God’s Word exists, its existence and influence ought to be nationally acknowledged as the only supreme authority and the foundation of law. “There is no power but of God; the powers that be are ordained of God.” The civil magistrate is “a minister of God,” and therefore bound to honour and serve Him, whilst “he that ruleth over men must be just, ruling in the fear of God.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/james-a-begg.html">James A. Begg</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Establishment Principle Defended: A Reply to the Statement by the Committee of the United Presbyterian Church on Disestablishment and Disendowment</cite>, (Edinburgh: Johnstone, Hunter, &amp; Co., 1873), v-vi.</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/civil-government-and-society/church-and-state.html">Civil Government and Society: Church and State</a></span></div>

It is connected with the protection of the Sabbath, the promotion of scriptural education in the public schools, the conservation of the purity of the Scriptures, and the sacredness of the law of marriage. It assumes that nations are moral and responsible creatures, accountable to God in their corporate capacity, and the proper subjects of rewards and punishments.

It implies that wherever God’s Word exists, its existence and influence ought to be nationally acknowledged as the only supreme authority and the foundation of law. “There is no power but of God; the powers that be are ordained of God.” The civil magistrate is “a minister of God,” and therefore bound to honour and serve Him, whilst “he that ruleth over men must be just, ruling in the fear of God.”

— James A. Begg, The Establishment Principle Defended: A Reply to the Statement by the Committee of the United Presbyterian Church on Disestablishment and Disendowment, (Edinburgh: Johnstone, Hunter, &amp; Co., 1873), v-vi.">Copy</button><a class="share" href="https://x.com/intent/post?text=%E2%80%9CThe+principle+of+Church+Establishments%2C+properly+understood%2C+and+apart+from+adventitious+circumstances%2C+is+just+the+principle+of+national+religion.+It+has+many+ramifications+all+springing+from+an+acknowledgment+of+the+universal+supremacy+of+Christ%2C+and+bearing+upon+the+duty+of+nations+and+their+rulers+to+promote+the+advancement+of+true+religion%2C+and+the+prosperity+of+Christ%E2%80%99s+cause+and+kingdom.%0A%0AIt+is+connected+with+the+protection+of+the+Sabbath%2C+the+promotion+of+scriptural+education+in+the+public+schools%2C+the+conservation+of+the+purity+of+the+Scriptures%2C+and+the+sacredness+of+the+law+of+marriage.+It+assumes+that+nations+are+moral+and+responsible+creatures%2C+accountable+to+God+in+their+corporate+capacity%2C+and+the+proper+subjects+of+rewards+and+punishments.%0A%0AIt+implies+that+wherever+God%E2%80%99s+Word+exists%2C+its+existence+and+influence+ought+to+be+nationally+acknowledged+as+the+only+supreme+authority+and+the+foundation+of+law.+%E2%80%9CThere+is+no+power+but+of+God%3B+the+powers+that+be+are+ordained+of+God.%E2%80%9D+The+civil+magistrate+is+%E2%80%9Ca+minister+of+God%2C%E2%80%9D+and+therefore+bound+to+honour+and+serve+Him%2C+whilst+%E2%80%9Che+that+ruleth+over+men+must+be+just%2C+ruling+in+the+fear+of+God.%E2%80%9D%0A%0A%E2%80%94+James+A.+Begg%2C+The+Establishment+Principle+Defended%3A+A+Reply+to+the+Statement+by+the+Committee+of+the+United+Presbyterian+Church+on+Disestablishment+and+Disendowment%2C+%28Edinburgh%3A+Johnstone%2C+Hunter%2C+%26+Co.%2C+1873%29%2C+v-vi.&amp;url=https%3A%2F%2F5solasquotes.github.io%2Fquote%2F2ff0b37f7d.html&amp;via=5Solas" target="_blank" rel="noopener">Share on X</a><a class="perma" href="../quote/2ff0b37f7d

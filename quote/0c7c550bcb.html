<blockquote><p>the Chaldeans are daily refuted. How many things I remember being said by the Chaldeans to Pompey, how many to Crassus, how many to Caesar himself; that none of them would die except in old age, except at home, except with clarity, so that it seems very strange to me that anyone still exists who believes those whose predictions he sees refuted daily by fact and events”; yet all of these were taken away by a violent death, which is confirmed by the examples of Julian the Apostate, Ludovico Sforza, Prince of Milan, Edward VI, King of England, the son of Cardanus, and others, to whom things far different from what had been predicted happened. Hence 10 emperors, princes, and lawgivers have forbidden this art of divining from the stars, and wise men and the fathers have disapproved of it. Maecenas, in Dio, bk. 52, Oration to Augustus, said that “diviners should not be tolerated in a republic.” Augustus expelled the astrologers from the city, Tiberius and Claudius from Italy; Vitellius also severely judged that they should be deprived of the world and of life. See Code, bk. 9, Tit. 18; bk. 2, 5, 7, and Tacitus, bk. 2, Annals, ch. 32, in whose judgment, “mathematicians are a race of men untrustworthy to the powerful, deceitful to the hopeful: which in our state will always be both forbidden and retained.” Cf. Valerius Maximus, bk. 1, ch. 3; Curtius, bk. 4, ch. 10; bk. 7, ch. 7. If an event has corresponded to some predictions, this should be attributed either to the shrewdness of the diviners, who had knowledge of the morals, counsels, and studies of those consulting them; or to the credulity of those consulting, who have turned fortuitous chances into the fulfillment of the thing predicted; or to the work of the devil, from whose suggestion or inspiration such prophets can draw many things; or to the just judgment of God, who chastises the vain minds of men with those mockeries, and permits the superstition of men to feel the scourge of Satan.</p></blockquo >Read it online · Reformed Books Online</a></div>
</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-8a99d1bd51" data-kw="">
<blockquote><p>These people believe that the Bible clearly states that the Earth does not move, and hence the only acceptable Biblical cosmology is a geocentric one… We examine these arguments, and find them poorly founded. The Scriptural passages quoted do not address cosmology. Some geocentrists draw distinctions that do not exist in the original autographs or even in translations. In short, the Bible is neither geocentric nor heliocentric… Many evolutionists claim that disbelief in evolution is like disbelief that the Earth goes round the Sun. The obvious flaw is that the latter is repeatable and observable while the former is not…. …Aardsma’s ICR Impact article, where he points out something well known to high-school physics students, but apparently not to bibliosceptics—that it’s valid to describe motion from any reference frame, although an inertial one usually makes the mathematics simpler. But there are many times when the Earth is a convenient reference frame; i.e. at some point we all use the geocentric model in one sense. For instance, a planetarium is a geocentric model. Calculation of rising, transiting, and setting of various celestial objects is calculated geocentrically. There are numerous other examples. Since modern astronomers often use an Earth-centred reference frame, it’s unfair and anti-scientific to criticise the Bible for doing the same. But this is hardly the issue, and the use of the geocentric model under these circumstances hardly makes one a geocentrist. I’m using the term to describe those who claim that the Earth is the only valid reference frame and oppose the use of any other reference frame. Perhaps the best-known geocentrist in the world today [2001] is Gerardus Bouw, who has been a professor at Baldwin-Wallace College in Berea, Ohio… To distinguish modern geocentrism from ancient geocentrism, Bouw has coined the term ‘geocentricity’ for the former. Bouw has a Ph.D. in astronomy from Case Western Reserve University… Given Bouw’s stature as the chief champion of geocentricity, we will use his book by the same name as the primary source on the topic.</p></blockquote>

<blockquote><p>Although God is “an infinite and limitless ocean of substance” in which all pure perfections are unitedly and most simply contained, some of these perfections, according to our way of conceiving, are more essential, others existential, others attributal. So a question is proposed by philosophers, especially neo-Scholastics, namely about what the essence of God is, or what in God must be conceived after the likeness of essence. … The most perfect concept (namely the concept of all perfections simply at the highest level), which Scotus is speaking of, seems to express what is commonly called the physical essence of God. But a simpler and more perfect concept (because it does not seem to be merely a description by accumulation of perfections) is that of infinite being. This notion expresses essential or quidditative perfection rather than existential perfection; but from-itselfness or necessary existence, like from-anotherness or possible existence, express existential modes. Further, this notion of infinite being satisfies perfectly the three requisites of metaphysical essence, namely that: … 3) It is as it were the root from which the rest of the perfections flow. But, as Scotus well said, “of all the concepts conceivable by us, this one (of infinite being) includes virtually more things,” namely “every perfection simply under the idea of the infinite.” It is more difficult or impossible to prove immediately from any other perfection, as the perfection of from-itselfness, all other attributes or perfections, as unicity, intelligence, life etc.</p></blockquote>

— Alan B. Wolter, Little Summary of Metaphysics (Milwaukee: Bruce Publishing Co., 1958), pp. 93-95">Copy</button><a class="share" href="https://x.com/intent/post?text=%E2%80%9CAlthough+God+is+%E2%80%9Can+infinite+and+limitless+ocean+of+substance%E2%80%9D+in+which+all+pure+perfections+are+unitedly+and+most+simply+contained%2C+some+of+these+perfections%2C+according+to+our+way+of+conceiving%2C+are+more+essential%2C+others+existential%2C+others+attributal.+So+a+question+is+proposed+by+philosophers%2C+especially+neo-Scholastics%2C+namely+about+what+the+essence+of+God+is%2C+or+what+in+God+must+be+conceived+after+the+likeness+of+essence.+%E2%80%A6+The+most+perfect+concept+%28namely+the+concept+of+all+perfections+simply+at+the+highest+level%29%2C+which+Scotus+is+speaking+of%2C+seems+to+express+what+is+commonly+called+the+physical+essence+of+God.+But+a+simpler+and+more+perfect+concept+%28because+it+does+not+seem+to+be+merely+a+description+by+accumulation+of+perfections%29+is+that+of+infinite+being.+This+notion+expresses+essential+or+quidditative+perfection+rather+than+existential+perfection%3B+but+from-itselfness+or+necessary+existence%2C+like+from-anotherness+or+possible+existence%2C+express+existential+modes.+Further%2C+this+notion+of+infinite+being+satisfies+perfectly+the+three+requisites+of+metaphysical+essence%2C+namely+that%3A+%E2%80%A6+3%29+It+is+as+it+were+the+root+from+which+the+rest+of+the+perfections+flow.+But%2C+as+Scotus+well+said%2C+%E2%80%9Cof+all+the+concepts+conceivable+by+us%2C+this+one+%28of+infinite+being%29+includes+virtually+more+things%2C%E2%80%9D+namely+%E2%80%9Cevery+perfection+simply+under+the+idea+of+the+infinite.%E2%80%9D+It+is+more+difficult+or+impossible+to+prove+immediately+from+any+other+perfection%2C+as+the+perfection+of+from-itselfness%2C+all+other+attributes+or+perfections%2C+as+unicity%2C+intelligence%2C+life+etc.%E2%80%9D%0A%0A%E2%80%94+Alan+B.+Wolter%2C+Little+Summary+of+Metaphysics+%28Milwaukee%3A+Bruce+Publishing+Co.%2C+1958%29%2C+pp.+ <blockquote><p>…the world’s creation, ended in six days, and declared to be perfected by his resting upon the seventh. In which number of days, He also pointed out, as it were, a set period of time, according to the revolution whereof times might be ever after computed, by weeks, or sevens of days. So that in that time, in which He made and fully finished the world, He set out a proportion of time, in which that Holy day should be observed; and by the perfecting of the world upon the seventh day, designed the very day, which, in that revolution of time, should be consecrated to Himself, and that by the ground upon which it was to be observed.</p></blockquote>

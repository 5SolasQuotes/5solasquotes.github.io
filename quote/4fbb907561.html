<blockquote><p>14 Q. How often is the Lord’s Supper to be administered and received?

14 A. The Lord’s Supper is to be often administered, and received often by every Christian. 1 Cor. 11 24, 25, 26, 27, 28.

Is it often to be administered?

Yes.

Or, Seldom?

No.

And, Must it be received often?

Yes.

Or, Seldom?

No.

Or, May any keep away at their own pleasure, and come only when they list?

No.

Or, Are they excusable that refuse to come, because they have no leisure for worldly businesses?

No.

Or, Because they have not repented of their sins?

No.

Or, Because they are not in charity?

No.

Or, Any such like excuse?

No.</p></blockquote>

<blockquote><p>It is therefore evident that according to the Romish Church the mass is presented as a continual and oft repeated sacrifice of Christ, offered up by the priests, and that this repeated sacrifice is indeed necessary for the forgiveness of sins, both of those that are living on the earth and of the departed souls that are still in purgatory. According to the Roman Catholics the mass has all the essential elements of a true sacrifice. It is offered by a priest, Jesus Christ through the ministry of His earthly representative, the Roman Catholic priest. It has its victim, again Jesus Christ, as He is really present under the appearance of bread and wine. And it is offered up as a real sacrifice through the mystic rite of consecration.

In the mass there is, therefore, a continuation of the bloody sacrifice of Christ on the cross in an unbloody manner. The Romish Church does indeed maintain that this sacrifice of the mass is necessary, and they deny that it is quite sufficient that Christ once for all and forever shed His blood for the blotting out of all the sins of His people. This element of the mass, together with the element that the transubstantiated signs are to be worshipped by the church, the Heidelberg Catechism in Question 80 rightly calls an accursed idolatry.</p></blockquote>

<blockquote><p>5. We know the Tabernacle and Temple were corporal things made with hands and that they are things different from the spiritual things that they signify, as the sign and the thing signified; as therefore the Lord is express in the elements and rites of the Supper of the Lord, because all of them, bread, wine, taking, eating, breaking, pouring out the wine, drinking, are teaching and edifying signs; and our Lord never left it to the wisdom of men to devise signes to teach themselves: So in like manner, should the Lord expressly specify all the teaching and signifying signs in the Old Testament; and as Moses might devise none of his own, but was tied to follow the pattern which the Lord Himself showed to him in the mount: So are we now under the New Testament tied to the pattern of that same will revealed in the Word; and it is laid on us not to be wise above that which was written; and it is of perpetual equity: The supreme Lawgiver never left it to the wisdom of angels, or men, or prophet, apostle or Church, to serve and worship God as they thought good: But He Himself particularly prescribed the way, signs, and means: And because God has not been pleased in the New Testament to specify types of Christ incarnate, and come in the flesh already; therefore are we obliged in conscience to believe, and practise no more, either in doctrinals, or teaching types, or positives of Church-policy, than our pattern in the mount, the Scripture has warranted to us, to be the will of God…</p></blockquote>

</figure><figure class="quote" id="q-faa49b0340" data-kw="">
<blockquote><p>By reason, therefore, of this laver of repentance and knowledge of God, which has been ordained on account of the transgression of God’s people, as Isaiah cries, we have believed, and testify that that very baptism which he announced is alone able to purify those who have repented; and this is the water of life. But the cisterns which you have dug for yourselves are broken and profitless to you. For what is the use of that baptism which cleanses the flesh and body alone? Baptize the soul from wrath and from covetousness, from envy, and from hatred; and, lo! the body is pure. For this is the symbolic significance of unleavened bread, that you do not commit the old deeds of wicked leaven. But you have understood all things in a carnal sense, and you suppose it to be piety if you do such things, while your souls are filled with deceit, and, in short, with every wickedness. Accordingly, also, after the seven days of eating unleavened bread, God commanded them to mingle new leaven, that is, the performance of other works, and not the imitation of the old and evil works.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/justin-martyr.html">Justin Martyr</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Dialogue with Trypho the Jew</cite>, Ch. 14, Righteousness is Not Placed in Jewish Rites, but in the Conversion of the Heart Given in Baptism by Christ.</span></figcaption>

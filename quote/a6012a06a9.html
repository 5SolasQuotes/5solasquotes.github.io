<main class="wrap"><figure class="quote" id="q-a6012a06a9" data-kw="">
<blockquote><p>From what has been said it is now easy to gather that liberty does survive in our choice, even after sin, a liberty that is essential to man’s nature, one by which all the worst men, whatever they do, do it freely; yet not such a liberty as is independent from the first cause, nor which is fitted with strength for spiritual good, to accomplish it spiritually, and in this respect it is rather called enslaved than free.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/petrus-van-mastricht.html">Petrus van Mastricht</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Theoretical Practical Theology</cite>, (RHB), vol. 3 | section 11, p. 527, bk. 4, ch. 4, ‘The Penalty &amp; State of Sin’</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/free-will-and-inability/liberty-and-necessity.html">Liberty and Necessity</a></span></div>
<div class="actions"><button class="copy" data-copy="“From what has been said it is now easy to gather that liberty does survive in our choice, even after sin, a liberty that is essential to man’s nature, one by which all the worst men, whatever they do, do it freely; yet not such a liberty as is independent from the first cause, nor which is fitted with strength for spiritual good, to accomplish it spiritually, and in this respect it is rather called enslaved than free.”

</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-5a93869256" data-kw="">
<blockquote><p>XXII. The subject in which it [original sin] resides is not only the lower faculties, namely of sensing and appetition, nor only the superior faculties, namely of understanding and willing, but the whole man, both soul and body, with all their powers. Besides experience, these passages testify: Gen. 6:5; Jer. 17:9; 1 Cor. 2:14; Eph. 4:17-18; Rom. 6:12-13, etc.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/theodore-tronchin.html">Theodore Tronchin</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Theological Theses on Original Sin</cite>, trans. AI (Geneva: de la Planche, 1625), pp. 6-7 Tronchin (1582-1657) was a professor of Hebrew and theology at Geneva.</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/free-will-and-inability/liberty-and-necessity.html">Liberty and Necessity</a></span></div>

</figure><figure class="quote" id="q-7d5bc10676" data-kw="">
<blockquote><p>…the Reformed customarily distinguish on the one side a fourfold good with which a person can be occupied in his choice, namely: (1) natural good, walking, reasoning; (2) moral good, the exercise of some sort of civil virtue; (3) ecclesiastical good, to which sort belong the duties of external divine worship; and (4) a spiritual and saving good, which accompanies salvation (Heb. 6:9)… With these things posited, they determine that… In the state of grace, through regeneration he recovers the strength lost by sin for doing spiritual and saving good, yet with some sort of a surviving inclination to evil… in the state of sin [being unconverted], to him is present some sort of strength toward natural, moral, and ecclesiastical good, but absolutely none for spiritual and saving good.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/petrus-van-mastricht.html">Petrus van Mastricht</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Theoretical Practical Theology</cite>, (RHB), vol. 3, bk. 4, ch. 2 | section 25, pp. 462-63</span></figcaption>

</figure><figure class="quote" id="q-47cd471641" data-kw="">
<blockquote><p>Suppose an apparently strong and healthy man should apply to you for relief, and, when asked why he did not labor for his subsistence, should reply, Because I can find no one to employ me. If you wished to know whether this or indolence were the true reason, you would offer him employment; and if he then refused to labor, you would feel satisfied that he was slothful and undeserving of your charity. So, when God puts into the hands of sinners a price to get wisdom, and they do not improve it, it becomes evident that they do not wish, that they are not willing, to become religious.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/edward-payson.html">Edward Payson</a></span><span class="wk"><span class="lbl">Work:</span> <cite>‘Select Thoughts’, in The Complete Works of Edward Payson</cite>, vol. 1, p. 488 | The Sinner’s Unwillingness to go to Christ</span></figcaption>

</figure><figure class="quote" id="q-d5b8c9281a" data-kw="">
<blockquote><p>No creature can do those things that are above nature as principal agent; however, it can cause a motion by uncreated power as instrumental agent: for as there is an obediential potency in creation, so that whatever the Creator has disposed happens in it, thus also so that it happens by means of it, which is the definition of an instrument.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/thomas-aquinas.html">Thomas Aquinas</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Commentary on the Sentences</cite>, distinction 8, quest. 2, art. 3, Reply to obj. 4, bk. 4</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/free-will-and-inability/liberty-and-necessity.html">Liberty and Necessity</a></span></div>

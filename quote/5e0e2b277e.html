<main class="wrap"><figure class="quote" id="q-5e0e2b277e" data-kw="">
<blockquote><p>Study moderation in all things: Let not Christian prudence pass with you for wisdom of the flesh, nor Christian moderation for Laodicean lukewarmness. ‘Let your moderation be known to all men;’ let it be visible and apparent, both in your passions, opinions and discourses. 1st. Moderate your affections, let not wildfire take the place of zeal, nor zeal turn passionate, pickish, peevish and bitter… Nor does the wrath of man work the righteousness of God. 2ly. Be moderate in your opinions: This moral idol of the mind (opinion) is too apt to be adored and oversway. Put a temper to it and hang a balance upon it, to keep it in poise and course; for true is that in common experience, though a fallacy indeed, that opinio est veritate major. And for moderation in opinion, study well: (1) Your fallibility and aptness to mistake, and consequently to dwell in a constant self-jealousy and suspicion. We like not to allow of fluctuating and Pyrronian doubting about necessary and vital points, nor to hang all opinions either (like Mahomed’s tomb between the two loadstones) in an aequilibrio. Yet too much confidence in matters of mere opinion is oft a vanity, refuted sufficiently by the new discoveries time and industry produces, compelling us to alter. But what one thing does contribute more to beget and continue ruptures than conceit and idolizing of self-wisdom and self-opinion, with an undervaluing of all that differ from us, while yet (perhaps) they may hit nearer the mark of truth than we, and have better advantages to discover it than we? (2) Study self-reflection, to consider how oft ye have found in time your (once confident) opinions to have failed you, that you have been necessitated to change and take up new measures. And this will help you to much moderation, experience being the schoolmaster of very fools. (3) Be moderate in your discourses; how are some’s tongues dipped in gall and set on fire of Hell! and instead of edifying communication that may minister grace to the hearers, little other than rigid censuring and bitter backbiting of one another! O when shall our tongue be our glory, not our shame! but to bridle the intemperacy of the tongue, study to speak nothing but what God may hear, and as in his hearing; speak of others as of yourselves; and this will make you speak sparingly, charitably and with due moderation. And were tongues once well governed, and that unruly evil tamed, no doubt but differences would soon diminish. Let your moderation then in all things be known to all men, the Lord is at hand. Moderation in our way is like the symmetry in the humors of the body, which keeps all in health and happiness.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/john-bairdie.html">John Bairdie</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Balm from Gilead, or the Differences about the Indulgence Stated &amp; Impleaded in a Sober &amp; Serious Letter to Ministers &amp; Christians in Scotland</cite>, (1674; London, 1681), pp. 154-56</span></figcaption>

<blockquote><p>To put forward a more refined and true principle in alternative to [George] Gillespie’s: Things less than fully good, or impure, not inherently wrong, may in some circumstances, especially according to the degree of necessity, be personally, materially done, even in worship, public worship and Church government (though they occasion passive scandal in some), for the good in the things themselves and for attaining higher and weightier goods (in proportion to that degree), while seeking to avoid the greater hurt and scandal, without approving the impurities or what may be deficient in them. [John] Sprint essentially affirmed this principle, while Gillespie essentially denied it.</p></blockquote>

</figure><figure class="quote" id="q-71e99a049f" data-kw="">
<blockquote><p>But sure, all our jus and right… that captives and servants have to their masters and lords, is jus limitatum, a right ruled, limited, bounded by the Word of God; nor is the work they perform morally indifferent ([though] physically it is)… But for no cause the most weighty can we choose either to shed innocent blood or to co-operate with the shedding of it, nor to co-operate with the works of darkness, for it is shameful that a servant may lawfully cooperate with and thrust his master in at a window to go to a whore; the jus or dominion of masters to command, and the right of servants to obey is only in the Lord. …the one kind of action in itself is as indifferent and susceptible of moral lawfulness and unlawfulness as the other. And if the master do cooperate to commit harlotry in climbing in at a window to a whore, and to robbing, in digging through an innocent man’s house in the night, to kill the master of the house, and to steal his goods, then the servant that cooperates in these same physical actions, and also digs through the innocent man’s house and kills himself, is the harlot and the robber by cooperation and participation, no less than the master. The naked relation of a captive and of a servant cannot make the captive and servant innocent and guiltless cooperators, for then to sin at the command of any conqueror and master, because I am in the condition of a captive and servant, were lawful, though God forbid and inhibit me to do what I do, by the command of my master and conqueror, for in so doing, Utor meo jure, I use my right as a servant. For God forbids me in what relation I be in, servant or captive, to sin at the command of any, or for declining any ill of punishment, though as weighty as the torment of hell, separated from sinful despairing and blaspheming of God. Now to cooperate with that which I know to be a sin is to partake in other men’s sins, which is forbidden, as a sin, 1 Tim. 5:22; Eph. 5:11. But to run with the thief and to help an arch-robber, Prov. 1:13-14, is a consenting to his robbery and bloodshed.</p></blockquote>

— Samuel Rutherford, The Divine Right of Church Government... (1646), Appendix, p. 85-6">Copy</button><a class="share" href="https://x.com/intent/post?text=%E2%80%9CBut+sure%2C+all+our+jus+and+right%E2%80%A6+that+captives+and+servants+have+to+their+masters+and+lords%2C+is+jus+limitatum%2C+a+right+ruled%2C+limited%2C+bounded+by+the+Word+of+God%3B+nor+is+the+work+they+perform+morally+indifferent+%28%5Bthough%5D+physically+it+is%29%E2%80%A6+But+for+no+cause+the+most+weighty+can+we+choose+either+to+shed+innocent+blood+or+to+co-operate+with+the+shedding+of+it%2C+nor+to+co-operate+with+the+works+of+darkness%2C+for+it+is+shameful+that+a+servant+may+lawfully+cooperate+with+and+thrust+his+master+in+at+a+window+to+go+to+a+whore%3B+the+jus+or+dominion+of+masters+to+command%2C+and+the+right+of+servants+to+obey+is+only+in+the+Lord.+%E2%80%A6the+one+kind+of+action+in+itself+is+as+indifferent+and+susceptible+of+moral+lawfulness+and+unlawfulness+as+the+other.+And+if+the+master+do+cooperate+to+commit+harlotry+in+climbing+in+at+a+window+to+a+whore%2C+and+to+robbing%2C+in+digging+through+an+innocent+man%E2%80%99s+house+in+the+night%2C+to+kill+the+master+of+the+house%2C+and+to+steal+his+goods%2C+then+the+servant+that+cooperates+in+these+same+physical+actions%2C+and+also+digs+through+the+innocent+man%E2%80%99s+house+and+kills+himself%2C+is+the+harlot+and+the+robber+by+cooperation+and+participation%2C+no+less+than+the+master.+The+naked+relation+of+a+captive+and+of+a+servant+cannot+make+the+captive+and+servant+innocent+and+guiltless+cooperators%2C+for+then+to+sin+at+the+command+of+any+conqueror+and+master%2C+because+I+am+in+the+condition+of+a+captive+and+servant%2C+were+lawful%2C+though+God+forbid+and+inhibit+me+to+do+what+I+do%2C+by+the+command+of+my+master+and+conqueror%2C+for+in+so+doing%2C+Utor+meo+jure%2C+I+use+my+right+as+a+servant.+For+God+forbids+me+in+what+relation+I+be+in%2C+servant+or+captive%2C+to+sin+at+the+command+of+any%2C+or+for+declining+any+ill+of+punishment%2C+though+as+weighty+as+the+torment+of+hell%2C+separated+from+sinful+despairing+and+blaspheming+of+God.+Now+to+cooperate+with+that+which+I+know+to+be+a+sin+is+to+partake+in+other+men%E2%80%99s+sins%2C+which+is+forbidden%2C+as+a+sin%2C+1+Tim.+5%3A22%3B+Eph.+5%3A11.+But+to+run+with+the+thief+and+to+help+an+arch-robber%2C+Prov.+1%3A13-14%2C+is+a+consenting+to+his+robbery+and+bloodshed.%E2%80%9D%0A%0A%E2%80%94+Samuel+Rutherford%2C+The+Divine+Right+of+Church+Government...+%281646%29%2C+Appendix%2C+p.+85-6&amp;url=https%3A%2F%2F5solasquotes.github.io%2Fquote%2F71e99a049f.html&amp;via=5Solas" target="_blank" rel="noopener">Share on X</a><a class="perma" href="../quote/71e99a049f.html">Permalink</a><a class="src" href="https://reformedbooksonline.com/topics/ethics#:~:text=But%20sure%2C%20all%20our%20jus%20and,consenting%20to%20his%20robbery%20and%20bloodshed&amp;text=But%20sure%2C%20all%20our%20jus%20and%20right&amp;text=is%20a%20consenting%20to%20his%20robbery%20and%20bloodshed" rel="noopener" target="_blank">Read it online · Reformed Books Online</a></div>

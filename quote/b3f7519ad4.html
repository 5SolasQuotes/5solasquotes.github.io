<main class="wrap"><figure class="quote" id="q-b3f7519ad4" data-kw="">
<blockquote><p>If I cannot by this Attempt convince Atheists, (which perhaps is next to blanching an Ethiopian) yet I hope I shall do something towards preventing the Spreading of that pernicious Infection which they are the Authors of; I hope I shall effect something towards checking the Progress of that Hellish Ferment which works in the World at this day. It may be what I shall offer will be serviceable to bridle the Insolence of those bold Men, and to make them recoil and give back. It may be it will cripple and disable them, though they make a shift to be upon their Feet. Perhaps it may give them a Mortification, though they will not let us know so much.

Or, if my Hopes fail me as to this, yet I will not despair of Confirming, and Strengthening such who are really persuaded of the Doctrine here treated of. I may be helpful to establish these Persons in their Belief, though I cannot reclaim the Infidelity of others. But this is not the height of what I aim at; for, besides what I have already suggested, my Intention is that this Discourse should afford variety of matter to the Religious for their Devout Contemplations. I have set the Greater and Lesser World before them, and have so displayed the several parts of both, that they may everywhere discern the Eternal Godhead.

I have propounded those Visible and Remarkable Topicks whence pious Minds may infallibly deduce the Truth and Reality of Providence, and the adorable Excellency of the Power, Wisdom and Goodness of God, and his other Divine Perfections and Properties which respect Mankind. If I had not chiefly designed these Papers for such, I should not have so often alleged the Holy Scriptures: which with the other sort of Men are in no esteem, and are thought to have no Authority; no more than the Alcoran, or some Legendary Tale. But all those that have a true Sense of Religion on their Spirits, reverence and prize these Writings next to the Blessed Author of them; and they know that it is proper to prove a God out of his Own Book.

The Reader may observe that I frequently make use of Scripture in setting forth Natural things, those which appertain to the Heavens, Earth, Sea, &amp;c. and the Body of Man; because I would let the World see that this Holy Book is not only useful as to Divine and Spiritual Matters, but even in respect of all sorts of Humane Learning, which I have on another occasion amply proved. Having thus propounded the Designs of my Undertaking, (and if I be successful in any of them, I shall reckon it a great Happiness) I will enter upon the Work itself, by the Assistance of Him whose Existence and Providence I am now to demonstrate.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/john-edwards.html">John Edwards</a></span><span class="wk"><span class="lbl">Work:</span> <cite>A demonstration of the existence and providence of God, from the contemplation of the visible structure of the greater and the lesser world in two parts, the first shewing the excellent contrivance of the heavens, earth, sea, &amp;c., the second the wonderful formation of the body of man</cite>, (London: Jonathan Robinson and John Wyat, 1696), vii-viii.</span></figcaption>

</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-334c77873e" data-kw="">
<blockquote><p>…there is more than one way in which a thing is said in the heart or conceived. For, in one sense, an object is conceived, when the word signifying it is conceived; and in another, when the very entity, which the object is, is understood. In the former sense, then, God can be conceived not to exist; but in the latter, not at all. For no one who understands what fire and water are can conceived fire to be water, in accordance with the nature of the facts themselves, although this is possible according to the words. So then, no one who understands what God is can conceive that God does not exist; although he says these words in his heart, either without any or with some foreign signification. For, God is that than which a greater cannot be conceived. And he who thoroughly understands this, assuredly understands that this being so truly exists, that not even in concept can it be non-existent. Therefore, he who understans that God so exists, cannot conceive that he does not exist. I thank thee, gracious Lord, I thank thee; because what I formerly believed by thy bounty, I now so understand by thine illumination, that if I were unwilling to believe that thou does exist, I should not be able not to understand this to be true.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/anselm.html">Anselm</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Proslogium, or ‘Discourse’ on the Existence of God ToC in St. Anselm: Proslogium; Monologium; an Appendix in behalf of the Fool by Gaunilon</cite>, … tr. Sidney N. Deane (Chicago: Open Court Publishing Co., 1903), ch. 4, p.</span></figcaption>

<blockquote><p>We can briefly recapitulate the essentials of the preceding proofs and complete them in the following demonstration of the existence of one God. Beginning from the necessary and evident proposition that ‘it is possible that something exists’, we lay down three conclusions: first, that some being from-itself actually exists; second, that such a being is infinitely perfect; third, that only a single being infinitely perfect can exist. Conclusion 1: Some being from-itself actually exists. I prove this conclusion summarily as follows: if something can exist, this something is either a being from-itself altogether independent or a being from another and so dependent with respect to its continued existence. If it is from another there is required at the same time a cause conserving it in existence. If this cause is not a being from-itself there is either a) an infinite regress in conserving causes, or b) a circle in such causes, or c) there is an ultimate stand in some being simply first, namely in a first conserver that is not conserved by anything because it is a being from-itself.¹ ¹ [Wolter speaks on p. 81 of ‘Ockham’s proof from conservation (see Boehner, ‘Zu Ockhams Beweis der Existenz Gottes’, Franz. Stud. 32, 1950, 50ff)’.] But an infinite regress in conserving causes is impossible, for such causes must be simultaneous.¹ The like must be said of a circle in conserving causes. Therefore in either case, in order that something be able to exist, there is required as a condition sine qua non some other being that exists from-itself. But if a being from-itself did not actually exist, it could not exist. ¹ [“But what of the reason that a being persists? Either it is something that depends on another with respect to its existence and permanence or it is not… An infinite series of things existing simultaneously is impossible, because such a series would be simultaneously dependent and independent: dependent because it would be indifferent to existing and would not have in itself a reason for existing; independent because nothing would exist outside the series for it to depend on, otherwise it would not be an infinite series since limited and brought to an end in the being on which it depends. By such a series then cannot be explained why something exists. This argument is confirmed by an example. Who would say that a sufficient reason for the suspension of the whole of a chain could be found in the length itself of the chain even though it could not be found in any ring of the chain?</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/allan-b-wolter.html">Allan B. Wolter</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Little Summary of Metaphysics</cite>, (Milwaukee: Bruce Publishing Co., 1958), pt. 3, ch. 1, article 1, ‘On the Existence of a Single God’, pp. 77-81 Wolter (d. 2006) was a Scotus scholar. The below continues from Wolter’s section in ‘From ‘Something is Finite”., pp. 34-35]</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/existence-and-knowledge-of-god/existence-of-god.html">Existence of God</a></span></div>

non+some+other+being+that+exists+from-itself.+But+if+a+being+from-itself+did+not+actually+exist%2C+it+could+not+exist.+%C2%B9+%5B%E2%80%9CBut+what+of+the+reason+that+a+being+persists%3F+Either+it+is+something+that+depends+on+another+with+respect+to+its+existence+and+permanence+or+it+is+not%E2%80%A6+An+infinite+series+of+things+existing+simultaneously+is+impossible%2C+because+such+a+series+would+be+simultaneously+dependent+and+independent%3A+dependent+because+it+would+be+indifferent+to+existing+and+would+not+have+in+itself+a+reason+for+existing%3B+independent+because+nothing+would+exist+outside+the+series+for+it+to+depend+on%2C+otherwise+it+would+not+be+an+infinite+series+since+limited+and+brought+to+an+end+in+the+being+on+which+it+depends.+By+such+a+series+then+cannot+be+explained+why+something+exists.+This+argument+is+confirmed+by+an+example.+Who+would+say+that+a+sufficient+reason+for+the+suspension+of+the+whole+of+a+chain+could+be+found+in+the+length+itself+of+the+chain+even+though+it+could+not+be+found+in+any+ring+of+the+chain%3F%E2%80%9D%0A%0A%E2%80%94+Allan+B.+Wolter%2C+Little+Summary+of+Metaphysics%2C+%28Milwaukee%3A+Bruce+Publishing+Co.%2C+1958%29%2C+pt.+3%2C+ch.+1%2C+article+1%2C+%E2%80%98On+the+Existence+of+a+Single+God%E2%80%99%2C+pp.+77-81+Wolter+%28d.+2006%29+was+a+Scotus+scholar.+The+below+continues+from+Wolter%E2%80%99s+section+in+%E2%80%98From+%E2%80%98Something+is+Finite%E2%80%9D.%2C+pp.+34-35%5D&amp;url=https%3A%2F%2F5solasquotes.github.io%2Fquote%2F2bde2e5eac.html&amp;via=5Solas" target="_blank" rel="noopener">Share on X</a><a class="perma" href="../quote/2bde2e5eac.html">Permalink</a><a class="src" href="https://reformedbooksonline.com/proofs-arguments-for-god/#:~:text=We%20can%20briefly%20recapitulate%20the%20essentials,in%20any%20ring%20of%20the%20chain&amp;text=We%20can%20briefly%20recapitulate%20the%20essentials%20of%20the&amp;text=be%20found%20in%20any%20ring%20of%20the%20chain" rel="noopener" target="_blank">Read it online · Reformed Books Online</a></div>

<blockquote><p>1. There is something which exists 2. Something has existed eternally.

3. Something has been eternally self-existent.

4. What is self-existent must have all the perfections that anywhere exist, or in any subject.

5. What is self-existent must have all possible perfections, and every perfection in an infinite measure.

6. What has all possible perfection, and every perfection in an infinite measure, is God. If I can show that these propositions are founded on certain and evident truth, and that there is a necessary connection between them, the inference I would draw from them is clear and undeniable. … 2. Something has existed eternally… For if something had not always existed, nothing could ever have existed. To suppose any being to begin to exist antecedentaly to all other beings is to suppose it the cause of its own existence, and by necessary consequence to act before it is; but since there can be no operation either in order of time, or of human conception, previous to the subject of it, to say, a thing may act before it is, is in other words to say that a thing may be and may not be at the same time… there cannot be a more express and flaming contradiction.</p></blockquote>

<blockquote><p>[God] Must be infinitely perfect. Since man knows he is an imperfect being, he must suppose the perfections he wants [lacks] are seated in some other being, which has limited him, and upon which he depends. Whatsover we conceive of excellency or perfection must be in God; for we can conceive no perfection but what God has given us a power to conceive. And He that gave us power to conceive a transcendent perfection above whatsoever we saw or heard of, has much more in Himself, or else He could not give us such a conception.</p></blockquote>

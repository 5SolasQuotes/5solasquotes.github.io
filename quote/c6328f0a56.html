<main class="wrap"><figure class="quote" id="q-c6328f0a56" data-kw="">
<blockquote><p>…[After Bothwell in 1679] [Donald] Cargill received an urgent invitation from [Robert] M’Ward and Brown [of Wamphray] in Holland to go over and join them… he determined at once to accept. Apparently, however, there were others included in the invitation and time was pressing, for on receiving the letter Cargill wrote at once to Robert Hamilton, who was now in hiding in Galloway, to come to Edinburgh in all haste to meet him. Hamilton duly arrived, heavily disguised for fear of capture, and Cargill put the proposition to him. Hamilton, who was in daily danger of his life so long as he remained in the country, readily assented; and some time in mid-August he and Cargill appear to have left for Holland together.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/maurice-grant.html">Maurice Grant</a></span><span class="wk"><span class="lbl">Work:</span> <cite>No King but Christ: the Story of Donald Cargill</cite>, (Durham: Evangelical Press, 1988), p. 101</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/the-church/schism-and-separation.html">Schism and Separation</a></span></div>

</figure><figure class="quote" id="q-d9df8860b7" data-kw="">
<blockquote><p>Divisions and contendings have been the undoing of this Church first and last, but I think more of late, and more shamefully than ever, the matter being so small (if wisely considered) about which all this noise has been made. I take not upon me to justify the indulged ministers, neither will I rigidly condemn them: But, if the separating from their ministry and pressing the matter with such heat and violence shall be found to be good service done to Christ, I have read the Scriptures wrong; and the sad consequences of it are convincing enough, if people were humble and convincible. It was this contention which expelled that profitable and most edifying exercise of mutual prayer and Christian conference (that I may say nothing how it drove from the shepherds’ tents) upon which followed a sensible decay in the exercise of godliness.</p></blockquote>

</figure><figure class="quote" id="q-5f064b23ae" data-kw="">
<blockquote><p>There are several cases in which separation from the Church of England is sinful, as:

1. If any separate as the Papists do, because they are against sound doctrine or any good that is in the Church.

2. If any renounce communion with all the parish-churches under the name of the Church of England.

3. If any renounce communion with the Church of England as it is a Christian kingdom, headed by one Christian protestant king.

4. If they renounce communion with the Church of England as it is called one from the association or concord of its pastors or Church governors.

5. If any renounce communion with faulty bishops or worship, or discipline, simply and absolutely, and not only secundum quid [according to what; that is in a qualified manner], and so forsake the good that is in them for the sake of the evil. In a word, 1. all that separate for a wrong cause, 2. or further than they separate from Christ, or than Christ would have them separate, do sin. 2. But they that renounce any corruption as such, and the Church no further than secundum quid [according to that], as it is faulty, do well: For we must so renounce the faults of all Churches and Christians in the world (and our own first), but not the Churches and Christians for any tolerable faults, so that we commit no sin ourselves, which they impose as the condition of their communion.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/richard-baxter.html">Richard Baxter</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Richard Baxter on Worship &amp; Catholicity against Separatism &amp; John Owen</cite>, (1684; RBO, 2024), p. 85</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/the-church/schism-and-separation.html">Schism and Separation</a></span></div>

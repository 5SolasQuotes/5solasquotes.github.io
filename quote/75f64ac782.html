<main class="wrap"><figure class="quote" id="q-75f64ac782" data-kw="">
<blockquote><p>And lastly, to name no more, that we are to stick to the word of God, and not look among the traditions of men for the articles of our faith, or the behaviour of our life, Christ himself teacheth us in these words, But in vain do they worship me, teaching for doctrines the commandments of men. Matt. xv. 9. So that whatsoever worship we perform to God, unless it be of God’s commanding, it will never be of God’s accepting; it will be but a vain worship.

Nay, it will be so far from God’s accepting, that it will be of his rejecting; for it is so far from being a duty, that it is in plain terms a sin; for so saith our Saviour, Why do you also transgress the commandments of God by your tradition? ver. 3; and, Thus have you made the commandments of God of none effect by your traditions, ver. 6. So that to obtrude traditions of men for articles of faith, or to admit them for parts of divine worship necessary to salvation, is so far from having any countenance from the scriptures, that it is expressly forbidden in them. And therefore that it should be necessary to believe any thing merely upon tradition is itself a mere tradition.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/william-beveridge.html">William Beveridge</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Ecclesia Anglicana Ecclesia Catholica; or, The Doctrine of the Church of England Consonant to Scripture, Reason, and Fathers: In a Discourse upon the Thirty-Nine Articles Agreed upon in the Convocation held at London MDLXII</cite>, in The Theological Works of William Beveridge, D.D. (12 vols, Oxford: John Henry Parker, 1842-48), 7: 195.</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/worship.html">Worship</a></span></div>

</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-9cf2ae27bc" data-kw="">
<blockquote><p>Paul’s example reminds ministers of churches that they have to gear what they say to the capacity of their audience and use every means possible to win them over and call them back from their errors. Human minds come in many different shapes and sizes. Therefore, just as good teachers adapt themselves to the minds of their children, and just as trustworthy and skilled doctors (a simile that Jerome uses) pay close attention to the way their patients respond when they are trying to cure the more difficult diseases, so ministers of the Word must understand the thought pattern of their hearers in order to reach each one of them, and they should not hesitate to shout at them if they see that they are rude and uneducated. But they must be careful when doing this not to compromise the truth, because doing that is no service to anyone.

Those who are full of themselves could not be farther away from the spirit of Paul. They order people about, avoid any kind of discussion and refuse to have anything to do with those who disagree with them. At the same time, they attack people who are fine representatives of the cause of religion with sharp, or rather poisoned tracts written against them, condemn whole churches and cause trouble wherever they go.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/rudolf-gwalther.html">Rudolf Gwalther</a></span><span class="wk"><span class="lbl">Work:</span> <cite>In Divi Pauli Apostoli Epistolam ad Galatas Homiliae LXI</cite>, (Zurich, 1576). Quoted in Gerald L. Bray, Timothy F. George, Scott M. Manetsch (eds), Reformation Commentary on Scripture X: Galatians, Ephesians (Downers Grove IL: IVP Academic, 2011), p. 155.</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/worship.html">Worship</a></span></div>

</figure><figure class="quote" id="q-4843d0e5f4" data-kw="">
<blockquote><p>A second characteristic of Puritan worship was its utter simplicity and sincerity. This unostentatious and modest form of worship found its appropriate domestic setting in meeting-houses… The Puritans refused to let the pealing organ blow To the full-voiced quire below In service high and anthems clear… in favour of the pedestrian metres of the Psalms so that all could memorize them and sing them in unison… their sense of holiness in approaching God was so strong that they could do without any theatrical or adventitious aids which would make tawdry the splendour of the Creator’s covenant mercies to his own.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/horton-davies.html">Horton Davies</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Worship &amp; Theology in England, from Cranmer to Baxter and Fox</cite>, 1534-1690, pp. 530-31</span></figcaption>

</figure><figure class="quote" id="q-e51c37051c" data-kw="">
<blockquote><p>Tell me the articles of thy faith. I believe in God the Father almighty maker of heaven and earth. etc. Let young men be learned this creed perfectly, and let them say it not with mouth. But have it in their hearts, that they may set all there trust upon God their maker, that both he will and also is able to defend them. Thus it meaneth, almighty God is the maker of all things of heaven of earth of things visible and things invisible. All things that be, have their being of God, for without him nothing is made.

Corn, wine, oil, wool, and all things else, yea the Angels of heaven. All come of god, here we must consider that all these things were created for us. Oh, what a merciful father is this, which hath ordained such things for us so unworthy wretches? what will not he grant us hereafter, what will he deny now to his children? unto elder men and such as be more grown in their faith the mystery of the Trinity must be declared, so much as man’s weakness may comprehend. There is one God which made all things, both that are in heaven &amp; that are in earth. If thou dost trust in God, thou mayst be sure the devil cannot hurt them, much less no mortal creature.

To believe in God, is to have a constant trust in God, and to drive all thine hope in him, all other things and creatures set apart, and that shall cause us to love God truly, other else it is but a feigned &amp; hypocritical love. It followeth in the Creed.

And in Jesus Christ his only son. All mankind was damned utterly for their great and manifold offences, but Christ hath borne upon his Back all our sins satisfying his father for us, and delivering us from everlasting death, that now we should live to our master Christ, whosoever doth inwardly believe this, will conform his life honestly according to the commandments of God, eschewing all manner of vice, so much as in him lieth.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/johann-oecolampadius.html">Johann Oecolampadius</a></span><span class="wk"><span class="lbl">Work:</span> <cite>A sermon, of John Oecolampadius, to young men, and maidens</cite>, trans. John Foxe (London: Humfrey Powell, 1548), unpaginated.</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/worship.html">Worship</a></span></div>

<blockquote><p>If truly the consequence is made good only by the will of governors, then this consequence will be valid: All such things are orderly and decent; therefore, let the calf of Aaron be made and openly worshiped, for worship in such a visible way is by [the will of] the governors. A good consequence is one which stands indivisible: then it is a good consequence or not a good consequence. This consequence, however, where the truth has been mixed, depending partly on reason and partly on the will of men, is nothing.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/samuel-rutherford.html">Samuel Rutherford</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Examination of Arminianism</cite>, tr. Charles Johnson &amp; Travis Fentiman (1638-1642; 1668; RBO, 2019), ch. 1, section 17, p. 48</span></figcaption>

<blockquote><p>V. 3. But I] a new precept or renewed by the apostle, concerning common civility for habit [wearing of garments] namely that women in public assemblies of the church should be covered, and men should have their heads uncovered by reason that in those places and times, the covered head was sign of subjection and an uncovered head contrary wise of liberty; and command wherefore that they might keep in the church that degree amongst sexes which God had established, they were to observe such signs and marks thereof as were used by the common consent of nations. See Gen. 20:16 and 24:65… … V. 10. To have power] as who should say to go forth in public in a modest and civil manner for this necessity of women’s covering the head took place but only out of doors, and not within doors. And if they went abroad without a vail they were reputed as debauched women, like run away servants or soldiers that have not their master’s or captain’s pass…</p></blockquote>

</figure><figure class="quote" id="q-ccf1687a01" data-kw="">
<blockquote><p>But where find we that women which were prophetesses and immediately inspired were allowed to deliver their prophesy in the Church [according to Gillespie’s objector]? I suppose he had a respect to 1 Cor: 11:5, ‘But every woman that prayeth or prophesieth with her head covered, dishonoureth her head,’ which is meaned of the public assembly, for the apostle is speaking of covering or uncovering the head in the Church. [The argument of the last statement is that one can know that the context in 1 Cor. 11 is of public assemblies of the Church (as opposed to private) because it mentions the practice of headcoverings. That is, headcoverings had a distinctively public function, likely to all such societal, public functions. This is confirmed below.] But diverse interpreters understand here by a woman that prays or prophesies, a woman that joins as a hearer in the public assembly: and so verse 4, by a man that prays or prophesies [signifies] a man that is a hearer and joins in the ordinances. So that the Geneva annotation upon verse 5 gives a good sense of that text: that women which show themselves in public and ecclesiastical assemblies without the sign and token of their subjection, that is to say, uncovered, shame themselves. See more for this in Junius, his annotations on the Arabic version in that place. If the apostle by ‘prophesying’, 1 Cor. 11:4-5, understand prophesying by immediate inspiration, then the objection may be retorted and turned into an argument against the objectors [who advocated for regular lay preaching]: For the sense of the word ‘prophesying’ in the 11th chapter may give light to the word prophesying in the 14th chapter, verse 3. Peter Martyr (Common Places, eccles. 4, ch. 1) is indeed of opinion that women which were prophetesses and extraordinarily inspired might speak in the Church, provided that their heads were covered, in token of feminine subjection, and that the forbidding of women to speak in the Church extends to such, and so he reconciles, 1 Cor. 14:34; 1 Tim. 2:13 with 2 Cor. 11:5. I doubt his opinion in this particular is not well grounded, only so far I make use of it: that if 1 Cor. 11:5 be meant of prophetesses praying or prophesying in the Church (which the Objector has to prove). Then certainly the forbidding of women to speak in the Church cannot be understood universally, but with a reserve and exception of extraordinary cases. But how can this exception of prophetesses consist with the text, ‘Let your women keep silence in the Church,’ Why [Greek] your women, they had prophesying women, as is supposed by these of the other opinion, from 1 Cor. 11:5. Nay, even your women must be silent says the apostle; and the reasons which he adds are so universal as to comprehend even prophetesses, they are commanded to be under obedience, and to be in subjection (which Martyr himself notes), holds true of prophesying women as well as others; and that for that cause their heads were to be covered. Another reason is added, 1 Tim. 2:14, Adam was not deceived; but the woman being deceived, was in the transgression. It might be feared, says Peter Martyr, if women were permitted to speak in the Church, Satan should return to his first wile and deceive the man by the woman. Surely he that made use of Eve might also make use of a prophesying woman to deceive, and so much the more, because, now since the fall, both man and woman are more subject to tentation. So that both the apostle’s command and the reasons of it seem plainly to exclude even prophesying women from speaking in the Church; and if they be allowed to deliver extraordinary prophesies and revelations in the Church, why not also to prophesy as other gifted members? If that which is greater be allowed them, why not that which is less? And if prophetesses be excepted from the rule, 1 Cor. 14:34, why not also other women of excellent gifts?</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/george-gillespie.html">George Gillespie</a></span><span class="wk"><span class="lbl">Work:</span> <cite>A Treatise of Miscellany Questions</cite>, … (Edinburgh, 1649), | ch. 5, ‘Whether these prophets and prophesyings in the primitive Church, 1 Cor. 14; 12:28; Eph. 4:11, were extraordinary…’, pp. 75-76</span></figcaption>

in+the+11th+chapter+may+give+light+to+the+word+prophesying+in+the+14th+chapter%2C+verse+3.+Peter+Martyr+%28Common+Places%2C+eccles.+4%2C+ch.+1%29+is+indeed+of+opinion+that+women+which+were+prophetesses+and+extraordinarily+inspired+might+speak+in+the+Church%2C+provided+that+their+heads+were+covered%2C+in+token+of+feminine+subjection%2C+and+that+the+forbidding+of+women+to+speak+in+the+Church+extends+to+such%2C+and+so+he+reconciles%2C+1+Cor.+14%3A34%3B+1+Tim.+2%3A13+with+2+Cor.+11%3A5.+I+doubt+his+opinion+in+this+particular+is+not+well+grounded%2C+only+so+far+I+make+use+of+it%3A+that+if+1+Cor.+11%3A5+be+meant+of+prophetesses+praying+or+prophesying+in+the+Church+%28which+the+Objector+has+to+prove%29.+Then+certainly+the+forbidding+of+women+to+speak+in+the+Church+cannot+be+understood+universally%2C+but+with+a+reserve+and+exception+of+extraordinary+cases.+But+how+can+this+exception+of+prophetesses+consist+with+the+text%2C+%E2%80%98Let+your+women+keep+silence+in+the+Church%2C%E2%80%99+Why+%5BGreek%5D+your+women%2C+they+had+prophesying+women%2C+as+is+supposed+by+these+of+the+other+opinion%2C+from+1+Cor.+11%3A5.+Nay%2C+even+your+women+must+be+silent+says+the+apostle%3B+and+the+reasons+which+he+adds+are+so+universal+as+to+comprehend+even+prophetesses%2C+they+are+commanded+to+be+under+obedience%2C+and+to+be+in+subjection+%28which+Martyr+himself+notes%29%2C+holds+true+of+prophesying+women+as+well+as+others%3B+and+that+for+that+cause+their+heads+were+to+be+covered.+Another+reason+is+added%2C+1+Tim.+2%3A14%2C+Adam+was+not+deceived%3B+but+the+woman+being+deceived%2C+was+in+the+transgression.+It+might+be+feared%2C+says+Peter+Martyr%2C+if+women+were+permitted+to+speak+in+the+Church%2C+Satan+should+return+to+his+first+wile+and+deceive+the+man+by+the+woman.+Surely+he+that+made+use+of+Eve+might+also+make+use+of+a+prophesying+woman+to+deceive%2C+and+so+much+the+more%2C+because%2C+now+since+the+fall%2C+both+man+and+woman+are+more+subject+to+tentation.+So+that+both+the+apostle%E2%80%99s+co <blockquote><p>…here are rules of order for the outward fashion of praying and prophesying; these may be as variable as the other are constant, it is no more possible to fit all Churches and countries with one form than to fit all bodies with one suit, or all limbs with one size…. They, exercising these manly functions, presumed to take upon them manly fashions; whereas therefore bare-headedness was in Corinth, as also in all Greece and Rome a token of honor and superiority, and covering the head a token of subjection; these forward women usurp upon the fashions of their husbands, and will have their faces seen as well as their voices heard;</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/joseph-hall.html">Joseph Hall</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Shaking of the Olive Tree, the Remaining Works of that incomparable prelate Joseph Hall</cite>, … (d. 1656; 1660), ‘The Women’s Vail: or a Discourse concerning the Necessity or Expedience of the Close-Covering of the Heads of Women… upon 1 Cor. 11:10, Occasioned by an offence unjustly taken at a Modest Dress’, p. 237</span></figcaption>

<div class="actions"><button class="copy" data-copy="“…here are rules of order for the outward fashion of praying and prophesying; these may be as variable as the other are constant, it is no more possible to fit all Churches and countries with one form than to fit all bodies with one suit, or all limbs with one size…. They, exercising these manly functions, presumed to take upon them manly fashions; whereas therefore bare-headedness was in Corinth, as also in all Greece and Rome a token of honor and superiority, and covering the head a token of subjection; these forward women usurp upon the fashions of their husbands, and will have their faces seen as well as their voices heard;”

— Joseph Hall, The Shaking of the Olive-Tree, the Remaining Works of that Incomparable Prelate Joseph Hall… (d. 1656; 1660), ‘The Women’s Vail: or a Discourse concerning the Necessity or Expedience of the Close-Covering of the Heads of Women… upon 1 Cor. 11:10, Occasioned by an offence unjustly taken at a Modest Dress’, p. 237">Copy</button><a class="share" href="https://x.com/intent/post?text=%E2%80%9C%E2%80%A6here+are+rules+of+order+for+the+outward+fashion+of+praying+and+prophesying%3B+these+may+be+as+variable+as+the+other+are+constant%2C+it+is+no+more+possible+to+fit+all+Churches+and+countries+with+one+form+than+to+fit+all+bodies+with+one+suit%2C+or+all+limbs+with+one+size%E2%80%A6.+They%2C+exercising+these+manly+functions%2C+presumed+to+take+upon+them+manly+fashions%3B+whereas+therefore+bare-headedness+was+in+Corinth%2C+as+also+in+all+Greece+and+Rome+a+token+of+honor+and+superiority%2C+and+covering+the+head+a+token+of+subjection%3B+these+forward+women+usurp+upon+the+fashions+of+their+husbands%2C+and+will+have+their+faces+seen+as+well+as+their+voices+heard%3B%E2%80%9D%0A%0A%E2%80%94+Joseph+Hall%2C+The+Shaking+of+the+Olive-Tree%2C+the+Remaining+Works+of+that+Incomparable+Prelate+Joseph+Hall%E2%80%A6+%28d.+1656%3B+1660%29%2C+%E2%80%98The+Women%E2%80%99s+Vail%3A+or+a+Discourse+concerning+the+Necessity+or+Expedience+of+the+Close-Covering+of+the+Heads+of+Women%E2%80%A6+upon+1+Cor.+11%3A10%2C+Occasioned+by+an+offence+unjustly+taken+at+a+Modest+Dress%E2%80%99%2C+p.+237&amp;url=https%3A%2F%2F5solasquotes.github.io%2Fquote%2F3256f8381d.html&amp;via=5Solas" target="_blank" rel="noopener">Share on X</a><a class="perma" href="../quote/3256f8381d.html">Permalink</a><a class="src" href="https://reformedbooksonline.com/the-history-of-head-coverings/head-coverings-in-the-post-reformation-era/#:~:text=here%20are%20rules%20of%20order%20for,as%20well%20as%20their%20voices%20heard&amp;text=here%20are%20rules%20of%20order%20for%20the%20outward&amp;text=faces%20seen%20as%20well%20as%20their%20voices%20heard" rel="noopener" target="_blank">Read it online · Reformed Books Online</a></div>

<blockquote><p>(4) …1 Tim. 2:9. And therefore the leaving the breasts naked, in whole or in part, is a transgression of this rule; they uncover their nakedness which they should vail and hide, especially in God’s presence: as the apostle says, 1 Cor. 11:10, ‘The woman ought to have power on her head, because of the angels.’ In the assembly there you meet with angels and devils; angels to observe your garb and carriage, and devils to tempt you; therefore be covered because of the angels. Yet usually women come hither with a shameless impudence into the presence of God, men and angels. This is a practice that neither suits with modesty nor conveniency; nothing can be alleged for it but reasons of pride and wantonness; it feeds your own pride and provokes lust in others. You would think they were wicked women that should offer others poison to drink; they do that which is worse, lay a snare for the soul, uncover that which should be covered; lest you provoke others of your rank to imitate your vanity, if they should not by the fear of God be guarded from unclean thoughts and filthy desires.</p></blockquote>

<main class="wrap"><figure class="quote" id="q-db15e2124e" data-kw="">
<blockquote><p>THE visible Decay of Piety, and Evangelical Holiness, is a common subject of Complaint: and hardly ever more justly than now, with respect to the Generality of Churches, and particular Christians. All serious and considering Persons must needs reckon themselves obliged on that account both to Mourn and Fear. The causes of serious Mourning are too many, and too notorious, to be unobserved by those, who have any Knowledge of the present State of the Christian Religion in Europe, even among the most Reformed.

The general unacquaintedness with the Mysteries of the Gospel; the Reproach of the solemn Assemblies by the Corruption of its Doctrines and Worship, and the dishonour cast upon its most sacred Institutions; the late terrible Desolations of the Temple and Sanctuary, and grievous sufferings of our Brethren in many parts of the World; the shameful Apostacy of so many Thousands from the Doctrine and Worship of the Gospel, and other considerations of this kind, which might be named, do carry with them a loud call to Humiliation and Mourning.

But the Practical Degeneracy of Professing Christians unto Worldliness, Profaness, and Sensuality, doth not only afford matter of Lamentation for the present, but too much ground to Fear, that the bitterness of Death is not past; that God‘s Anger is not turned away, or his Controversy ended with the Protestant Churches. And after we have known so many Thousands to renounce and abjure their Religion in an Hour of Temptation, and see so many more (yea the far greatest part,) in a preparedness to Revolt, on the like or lesser Trials, by reason of their vicious Lives, (because they receive not the Truth in the Love of it,) what can we reasonably expect, but further Tokens of Divine Displeasure?

And how little of any encouraging Prospect is there, by the serious Reformation of Persons, Families, and Churches to turn away his Wrath? Where are there any Symptoms of the Recovery of the Power of Godliness, from whence in our Age there is so undeniable a Declension? (and acknowledged by all Parties that there is so.) How little is to be seen of any such thing, among those who are most Forward and Zealous in espousing the Reformed Interest? even such as would be thought of all others to be most concerned for its Preservation, and have suffered not a little for it?

The distressed case of our Brethren cannot but move our Bowels of Compassion, when we read or hear from time to time the Relation of the barbarous Proceedings of their Persecutors. But the sensual wicked Lives of professedly Reformed Christians, is certainly a more dreadful object to be considered, and ought so to be regarded by us, as the Consequences of it are much more to be feared, than of the fiercest Persecution by open and avowed Enemies. For the Church of Christ never lost either Truth or Holiness that way; it hath rather been a considerable outward Means, for the preservation and increase of Both. Though this cannot be said, but the direct Contrary, concerning Protestants persecuting one another for lesser Differences.

The sad Effects of it have been seen and felt to that degree, in weakening the common truly Christian Interest among us, that now, if ever, there is a louder Call than ordinary to Forbearance, and Forgiveness, and Unity of Affection; that our Divisions, with a revengeful, persecuting Spirit, may not prove our Ruin.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/john-shower.html">John Shower</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Serious reflections on time and eternity with some other subjects, moral and divine. To which is prefixed an introduction concerning the first day of the year, how observed by the Jews, and may best be employed by a serious Christian</cite>, (London: Joseph Watts, 1689), to the reader.</span></figcaption>

<blockquote><p>How much the ministry of the Word and sacraments should weigh with us… so as to be a perpetual badge for distinguishing the Church, has been explained; for we have shown, first, that wherever it exists entire and unimpaired, no errors of conduct, no defects should prevent us from giving the name of Church; and, secondly, that trivial errors in this ministry ought not to make us regard it as illegitimate. Moreover, we have shown that the errors to which such pardon is due, are those by which the fundamental doctrine of religion is not injured, and by which those articles of religion, in which all believers should agree, are not suppressed, while, in regard to the sacraments, the defects are such as neither destroy nor impair the legitimate institution of their Author.</p></blockquote>

<blockquote><p>But that is expressly restricted to that broken and declining state of the Church, Informatory Vindication, page 73, and tantum pro tempore [so far as the time], while they continued in that course, Testimony, page 30. Now the ministry of these with whom we are pleading to unite [the established Church of Scotland in 1690], is not so circumstantiated; it is not subject to strange lords, nor have they any holding, new or old upon any usurped power; nor are they by any confederacy servants of men: nor is our hearing of them a submitting unto any encroachment made upon the privileges of this Church, or liberties of this kingdom… But as that is restricted to the then broken and declining state in three several repetitions, Informatory Vindication, page 74 and 76. So now it cannot be applied to the generality of the present ministers, who now neither condemn the then testimony in their preaching, nor if they did in some things differ from it, would it be a sufficient ground of withdrawing, when that now is not the testimony, and they are faithful in the present testimony againft Popery, Prejacy, Erastianism and tyranny, etc… But whatever might be said for justifying that then in that broken and declining state of the Church, page 78, when these compliances were snares and stumbling-blocks persisted in and defended, that cannot be an argument now for withdrawing from all these compliers, when now the Church is not so declining but recovering her freedom from fetters, when now these cease to be snares and stumbling-blocks, when they are not persisted in, seeing also all these compliances are not alike, nor do they all deserve deposition.</p></blockquote>

<div class="actions"><button class="copy" data-copy="“But that is expressly restricted to that broken and declining state of the Church, Informatory Vindication, page 73, and tantum pro tempore [so far as the time], while they continued in that course, Testimony, page 30. Now the ministry of these with whom we are pleading to unite [the established Church of Scotland in 1690], is not so circumstantiated; it is not subject to strange lords, nor have they any holding, new or old upon any usurped power; nor are they by any confederacy servants of men: nor is our hearing of them a submitting unto any encroachment made upon the privileges of this Church, or liberties of this kingdom… But as that is restricted to the then broken and declining state in three several repetitions, Informatory Vindication, page 74 and 76. So now it cannot be applied to the generality of the present ministers, who now neither condemn the then testimony in their preaching, nor if they did in some things differ from it, would it be a sufficient ground of withdrawing, when that now is not the testimony, and they are faithful in the present testimony againft Popery, Prejacy, Erastianism and tyranny, etc… But whatever might be said for justifying that then in that broken and declining state of the Church, page 78, when these compliances were snares and stumbling-blocks persisted in and defended, that cannot be an argument now for withdrawing from all these compliers, when now the Church is not so declining but recovering her freedom from fetters, when now these cease to be snares and stumbling-blocks, when they are not persisted in, seeing also all these compliances are not alike, nor do they all deserve deposition.”

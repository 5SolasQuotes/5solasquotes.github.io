<main class="wrap"><figure class="quote" id="q-ecb08134b6" data-kw="">
<blockquote><p>We divide this Word into two principal parts or kinds: the one is called the ‘Law,’ the other the ‘Gospel.’ For all the rest can be gathered under the one or other of these two headings…Ignorance of this distinction between Law and Gospel is one of the principal sources of the abuses which corrupted and still corrupt Christianity.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/theodore-beza.html">Theodore Beza</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Christian Faith</cite>, trans. James Clark (East Sussex, UK: Focus Christian Ministries Trust), 40.</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/the-law-of-god.html">The Law of God</a></span></div>
<div class="actions"><button class="copy" data-copy="“We divide this Word into two principal parts or kinds: the one is called the ‘Law,’ the other the ‘Gospel.’ For all the rest can be gathered under the one or other of these two headings…Ignorance of this distinction between Law and Gospel is one of the principal sources of the abuses which corrupted and still corrupt Christianity.”

— Theodore Beza, The Christian Faith, trans. James Clark (East Sussex, UK: Focus Christian Ministries Trust), 40.">Copy</button><a class="share" href="https://x.com/intent/post?text=%E2%80%9CWe+divide+this+Word+into+two+principal+parts+or+kinds%3A+the+one+is+called+the+%E2%80%98Law%2C%E2%80%99+the+other+the+%E2%80%98Gospel.%E2%80%99+For+all+the+rest+can+be+gathered+under+the+one+or+other+of+these+two+headings%E2%80%A6Ignorance+of+this+distinction+between+Law+and+Gospel+is+one+of+the+principal+sources+of+the+abuses+which+corrupted+and+still+corrupt+Christianity.%E2%80%9D%0A%0A%E2%80%94+Theodore+Beza%2C+The+Christian+Faith%2C+trans.+James+Clark+%28East+Sussex%2C+UK%3A+Focus+Christian+Ministries+Trust%29%2C+40.&amp;url=https%3A%2F%2F5solasquotes.github.io%2Fquote%2Fecb08134b6.html&amp;via=5Solas" target="_blank" rel="noopener">Share on X</a><a class="perma" href="../quote/ecb08134b6.html">Permalink</a><a class="src" href="https://heidelblog.net/2022/09/beza-on-law-and-gospel/" rel="noopener" target="_blank">Read it online · Heidelblog</a></div>
</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-d06d978e9d" data-kw="">
<blockquote><p>It revived the promise of that covenant, —that of eternal life upon perfect obedience. So the apostle tells us that Moses thus describeth the righteousness of the law, “That the man which doeth those things shall live by them,” Romans 10:5; as he doth, Leviticus 18:5. Now this is no other but the covenant of works revived. Nor had this covenant of Sinai any promise of eternal life annexed unto it, as such, but only the promise inseparable from the covenant of works which it revived, saying, “Do this, and live.”</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/john-owen.html">John Owen</a></span><span class="wk"><span class="lbl">Work:</span> <cite>An Exposition of the Epistle to the Hebrews</cite>, 8:6; Works, vol. 22, p. 94</span></figcaption>

</figure><figure class="quote" id="q-faff82bb91" data-kw="ceremonial abrogation">
<blockquote><p>The ceremonial law can be viewed in two ways: either with regard to doctrine and signification; or with regard to obligation and observance. The question is not whether it was abrogated as to doctrine. We confess that it still remains and is useful in many ways among Christians; and that the mystical truth, hidden under this shell, is always the same and of perpetual necessity. Rather the question is whether it was abrogated as to obligation and obedience and whether believers are still in subjection to the ceremonial law. This was the opinion not only of the Jews of old, but also of the Judaizing false apostles in the time of the apostles. However we, with the apostles and the whole church, deny it.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/francis-turretin.html">Francis Turretin</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Institutes of Elenctic Theology</cite>, 11.25.1</span></figcaption>

</figure><figure class="quote" id="q-25c96cbda1" data-kw="moral law not abolished">
<blockquote><p>As it was not abolished but fulfilled by Christ, neither is its use among us to be abolished. Luke wants us to hear Moses and the prophets: “They have Moses and the prophets, let them hear them” (16:29). If they are to be heard, their commands must therefore be obeyed also. If this is said by Christ to the Jews of his time, it ought not forthwith to be understood of them to the exclusion of others. He does not give here a special, but a general precept to all who desire to escape the place of torment.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/francis-turretin.html">Francis Turretin</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Institutes of Elenctic Theology</cite>, 11.23.5</span></figcaption>

</figure><figure class="quote" id="q-900bb6b6ed" data-kw="third use rule of life">

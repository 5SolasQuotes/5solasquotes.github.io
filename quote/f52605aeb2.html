<blockquote><p>Touching civil society with them, two points are to be handled: [1.] What society may be used with them, and [2.] what not. For the first, we may use their society upon neccessity that cannot be avoided, unless we will utterly reject the fellowship of mankind. Paul, who forbids the Corinthians to company with a brother that is an idolator, for all this gives them liberrty to converse with the idolatrous of the world. (1 Cor. 5:10-11) This may seem strange but the reason is because the company of believers was then but small and the whole world beside was nothing but idolaters: and therefore it was impossible for believers to avoid their society unless they meant to go out of the world. And upon this necessity, Paul permits the Church in his days to use the fellowship of idolators; and for the very same cause he says, 1 Cor. 10:27, ‘If any of them that believe not bid you to a feast, go if ye will.’ Secondly, believers may lawfully join with idolaters in the society of concord. For by the general calling of Christianity they are bound to have peace with all men. Upon this ground may the Church make covenants of peace with idolators upon even and just conditions. Heb. 12:14, ‘Have peace towards all men, and holiness.’ Rom. 12:18, ‘Have peace with all men, if it be possible, and as much as in you lies.’ Thus Abraham made a league of peace with Aner and Eschol, king of the Amorites, and with Abimelech; and Isaac with Abimelech, and Jacob with Laban (Gen. 23-24): and Heber the Kenite with Jabin a foreign king (Judg. 4:17): and thelr examples have sufficient warrant. For that which we may do we may bind ourselves to do. Thirdly, we may use any such fellowship with them as is, or shall be occasioned by virtue of our particular calling. Thus Christ, being the Savior of the world, conversed with publicans and sinners. Thus Paul being the Apostle of the Gentiles, enters into Athens, and there beholds their devotions. It is God’s commandement that the believing wife, shall nor forsake her unbelieving husband, if he be willing or desirous to dwell with her. (1 Cor. 7:13) If it be alleged that Ezra constrained the Israelites to put away their Ammonitish and Moabitish, and the rest of their heathen, wives (Ezra 10:3): I answer that their marriages were indeed void and no marriages: First, because the nations with whom they married were people, according to God’s Law, civilly dead: in that God had commanded their destruction, unless when peace was offered, they accepted of it. (Dt. 20:10) Secondly, in that they were not only idolators, but also enticers to idolatry; God by express commandment did simply forbid the Jews to marry with them unless they did repent and changed their religion. And in regard of this commandment, the foresaid marriages were nullities, as incestuous marriages are no marriages by reason of the absolute prohibition of God. Touching the society forbidden us with idolators, it is the society of amity, that is, of familiarity and special love. Two examples, whereof we find in the Word of God. One is of contracts of marriage with idolators, which the Scripture precisely condemns as an abomination in lsrael and a profanation of the name of God, when Judah marries the daughter of a strange god, Mal. 2:11. Boaz indeed married Ruth, a Moabitess, but she was entered and received into the body of the Israelites by a former marriage: and she was one that believed in the God of Israel. ‘Thy people’ (says he to Naomi and Ruth) ‘shall be my people, and thy God, my God.’ Sampson likewise married a woman of the Philistines (Judg. 14:4), but that was by divine instinct and consequently by a special appointment of God. Again it is alleged that God by express law gave leave to the Israelites to marry heathenish women taken captives in war. (Dt. 21:10-11) Answer: That is a law only of toleration, without approbation, in which God, for the hardness of their hearts, permits the evil, which cannot by policy be quite taken away. And this appears by two things: First, before the marriage, the woman by God’s appointment must be deformed, by cutting off her hair, by the growing of her nails, by putting off the garments of her captivity, and by mourning for her father and mother for the space of a month: and the end of this was to cause a dislike in the Israelites of their intended marriages, or to signify a change of religion, at the least in pretense, in the parties espoused. The second example is of leagues, in mutual aid and protection, which may not be contracted between believers and idolaters. Jehoshaphat for making this kind of league with Ahab is thus reproved, 2 Chron. 19:2. ‘Wouldest thou help the wicked, and love them that hate the Lord? Therefore for this things the wrath of the Lord is upon thee.’ Again, that which we may not do, we may not covenant to do; now we may not mutually give and take aid and protection of idolators. This tends to the dishonor of God, because it makes idolators boast that the people of God cannot stand without their aid. It is further an occasion of idolatry and this league often enfolds the people of God in the same plagues and judgment with idolators. It has been the decay both of Greece and Hungary that they have heretofore entered into leagues of amity with the Turks. lt may be objected that Abraham made this covenant of protection with the Amorites, Aner, Eschol, Mamre: and that thereupon they aided him in rescuing of Lot, and in the slaughter of the kings. I answer: First, it may be they were believers, embracing the faith Abraham: nothing can be showed to the contrary. Secondly, if they were infidels, the covenant that was between them was of peace only and they aided Abraham, not by request made by him, but by secret special motion of God. Thirdly, the fathers did sundry actions upon bad custom, which God by law afterward redressed: and their examples may not be followed in all things. Lastly, I suppose that Abraham joined with them as against a common adversary: and therefore the protection they ministered to Abraham was as necessary for themselves as for him and his people. Here one exception must not be omitted. Put the case that the husband is an idolator and is content to dwell with his believing wife: she then is to live with him, not only in the society of peace, but also in the society of amity by doing all duties of Iove that concern a wife, so far as may stand with good conscience. For the precept of Paul’s, that marriage and marriage duties are to be preserved of the believing party with an infidel (1 Cor. 7:13-14), so be it the said infidel be content. It may be al!eged that thus the believer exposes himself to danger of idolatry. I answer: Not because God defends them that call upon Him who thrust not themselves into danger, but bear the danger and calamity into which they are fallen, attending upon their callings. Again, if the unbelieving party shall solicit the other and use all means, both fair and foul, to draw him or her to idolatry, the believing party in this case, may go aside for a time and omit the duty of marriage. For this is all one as if the idolatrous and unbelieving party should depart. For indeed, that party is said to depart in whom the cause of departing is, as in the Church he is a schismatic in whom the cause of the schism is, and not always he that separates. Secondly, it may be objected that a Christian may not become the member of a harlot, much less of an idolator; considering idolatry is a great sin. I answer: The reason is not like. For the fornicator consents to the fornication: and so does not the believing party, by doing duties that pertain to marriage, consent to the idolatry of the unbelieving party. And the fornicator willingly joins himself with an harlot; whereas the believing party desires he might be yoked with a believer and not with an infidel. Lastly, it may be objected: if for adultery, divorce may be made, why not for idolatry which is spiritual adultery? I answer: That not any sin by itself, as it is a sin, not breaking the troth and bond of marriage, is the proper cause of a divorce; and not any kind of idolatry, but the sin of adultery breakest his troth.</p></blockquote>

es%2C+Aner%2C+Eschol%2C+Mamre%3A+and+that+thereupon+they+aided+him+in+rescuing+of+Lot%2C+and+in+the+slaughter+of+the+kings.+I+answer%3A+First%2C+it+may+be+they+were+believers%2C+embracing+the+faith+Abraham%3A+nothing+can+be+showed+to+the+contrary.+Secondly%2C+if+they+were+infidels%2C+the+covenant+that+was+between+them+was+of+peace+only+and+they+aided+Abraham%2C+not+by+request+made+by+him%2C+but+by+secret+special+motion+of+God.+Thirdly%2C+the+fathers+did+sundry+actions+upon+bad+custom%2C+which+God+by+law+afterward+redressed%3A+and+their+examples+may+not+be+followed+in+all+things.+Lastly%2C+I+suppose+that+Abraham+joined+with+them+as+against+a+common+adversary%3A+and+therefore+the+protection+they+ministered+to+Abraham+was+as+necessary+for+themselves+as+for+him+and+his+people.+Here+one+exception+must+not+be+omitted.+Put+the+case+that+the+husband+is+an+idolator+and+is+content+to+dwell+with+his+believing+wife%3A+she+then+is+to+live+with+him%2C+not+only+in+the+society+of+peace%2C+but+also+in+the+society+of+amity+by+doing+all+duties+of+Iove+that+concern+a+wife%2C+so+far+as+may+stand+with+good+conscience.+For+the+precept+of+Paul%E2%80%99s%2C+that+marriage+and+marriage+duties+are+to+be+preserved+of+the+believing+party+with+an+infidel+%281+Cor.+7%3A13-14%29%2C+so+be+it+the+said+infidel+be+content.+It+may+be+al%21eged+that+thus+the+believer+exposes+himself+to+danger+of+idolatry.+I+answer%3A+Not+because+God+defends+them+that+call+upon+Him+who+thrust+not+themselves+into+danger%2C+but+bear+the+danger+and+calamity+into+which+they+are+fallen%2C+attending+upon+their+callings.+Again%2C+if+the+unbelieving+party+shall+solicit+the+other+and+use+all+means%2C+both+fair+and+foul%2C+to+draw+him+or+her+to+idolatry%2C+the+believing+party+in+this+case%2C+may+go+aside+for+a+time+and+omit+the+duty+of+marriage.+For+this+is+all+one+as+if+the+idolatrous+and+unbelieving+party+should+depart.+For+indeed%2C+that+party+is+said+to+depart+in+whom+the+cause+of+departing+is%2C+as+in+the+Church+he+is+a+schismatic+in+whom+the+cause+of+the+schism+is%2C+and+not+always+he+that+separates.+Secondly%2C+it+may+be+objected+that+a+Christian+may+not+become+the+member+of+a+harlot%2C+much+less+of+an+idolator%3B+considering+idolatry+is+a+great+sin.+I+answer%3A+The+reason+is+not+like.+For+the+fornicator+consents+to+the+fornication%3A+and+so+does+not+the+believing+party%2C+by+doing+duties+that+pertain+to+marriage%2C+consent+to+the+idolatry+of+the+unbelieving+party.+And+the+fornicator+willingly+joins+himself+with+an+harlot%3B+whereas+the+believing+party+desires+he+might+be+yoked+with+a+believer+and+not+with+an+infidel.+Lastly%2C+it+may+be+objected%3A+if+for+adultery%2C+divorce+may+be+made%2C+why+not+for+idolatry+which+is+spiritual+adultery%3F+I+answer%3A+That+not+any+sin+by+itself%2C+as+it+is+a+sin%2C+not+breaking+the+troth+and+bond+of+marriage%2C+is+the+proper+cause+of+a+divorce%3B+and+not+any+kind+of+idolatry%2C+but+the+sin+of+adultery+breakest+his+troth.%E2%80%9D%0A%0A%E2%80%94+William+Perkins%2C+%E2%80%98A+Warning+Against+the+Idolatry+of+the+Last+Times%2C+%26+an+Instruction+touching+Religious+or+Divine+Worship%E2%80%99+in+The+Works+%28d.+1602%3B+London%3A+Legatt%2C+1626%29%2C+vol.+1%2C+p.+692&amp;url=https%3A%2F%2F5solasquotes.github.io%2Fquote%2Ff52605aeb2.html&amp;via=5Solas" target="_blank" rel="noopener">Share on X</a><a class="perma" href="../quote/f52605aeb2.html">Permalink</a><a class="src" href="https://reformedbooksonline.com/on-idolatry/#:~:text=Touching%20civil%20society%20with%20them%2C%20two,sin%20of%20adultery%20breakest%20his%20troth&amp;text=Touching%20civil%20society%20with%20them%2C%20two%20points%20are&amp;text=but%20the%20sin%20of%20adultery%20breakest%20his%20troth" rel="noopener" target="_blank">Read it online · Reformed Books Online</a></div>

<blockquote><p>And what pitiful arguments have they to prove this charge of idolatry: ‘False worship of the true God is idolatry as well as worshipping a false God: But such is the [Anglican] Liturgy: therefore—’ This is all that these rash preachers must trouble the Church and seduce men into a hating factious zeal with. But what mean these men by ‘false worship’? Do they mean worship contrary to God’s Word? That is, which is sinful? And do they mean all such sinful worship or some only? If they mean all such sinful worship, then these words of theirs are idolatry: for they are part of their preaching, which is part of God’s worship, in their own sense: And it is false doctrine and tends to men’s perdition. And so they and all false teachers should be idolaters. By this they would turn all sins in worship into one: It is all idolatry. Is not every confused prayer sinful which has unmeet expressions and disordered, and has wandering thoughts and dull affections? Is there any of these love-killers that dare say they pray without sin? And must we not separate from them then as idolaters? Yea and every man from himself; that is, he must give over praying because it’s all idolatry? But perhaps they will say: ‘This sin is but in the manner and not in the matter.’ Answer: Very good; it seems then that sin in the manner of worship is not idolatry… Will you find some words which you can call false in the matter? Suppose it were so? When an Antinomian, an Anabaptist, a Separatist or anyone that errs does drop some of his errors in his prayers (as I think none will deny that they use to do), must we needs believe that his prayer is idolatry therefore, as being false worship? And is it unlawful to join with such? Then we shall have more separation than you yet plead for or practice yourselves. No two men in the world must join together if all sinful worship, or worship false sometime in the very matter does necessitate a separation… … But what text of Scripture is it that ever told these men that all false worship is idolatry? what text do they name but such as if they did it on purpose to show their boldness in adding to God’s Word? The Second Commandment is the chief which they insist on. But whatever expositions they may forge, there is no such word, nor sense in the Commandment. We all hold that as the gross, direct idolatry is the worshipping of a false God, against the First Commandment; so to make any such false representation of the true God, by words or deeds, as makes Him like an idol, and contradicts his nature, and so to worship Him, this is also a secondary kind of idolatry: Because God is none such as they represent Him, and therefore it is not God indeed but an idol which they worship. And because God is not like to anything corporeal in heaven or earth, therefore he that makes an image of any thing in heaven or earth as like to God, or to represent Him, he makes an idol of God by blasphemy. ‘To what will you liken Me, that I should be like unto it, saith the Holy One?’ This is the idolatry forbidden in the Second Commandment: It is not all false worship, but one sort of false worship, which is idolatry: what else that Commandment forbids is neither called idolatry, nor can so be proved. It is an odious sound, to hear an ignorant, rash, self-conceited person, especially a preacher, to cry out, ‘Idolatry, Idolatry,’ against his brethren’s prayers to God because they have something in them to be amended, while perhaps his own prayers have so much false doctrine in them or false fire of carnal passions and uncharitableness, as makes it a much harder question whether it be lawful to join with such as he is, while he abhors so much to join with others.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/richard-baxter.html">Richard Baxter</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Cure of Church Divisions</cite>, (London: Symmons, 1670), pt. 1 | Direction 33, p. 190-93</span></figcaption>

<div class="actions"><button class="copy" data-copy="“And what pitiful arguments have they to prove this charge of idolatry: ‘False worship of the true God is idolatry as well as worshipping a false God: But such is the [Anglican] Liturgy: therefore—’ This is all that these rash preachers must trouble the Church and seduce men into a hating factious zeal with. But what mean these men by ‘false worship’? Do they mean worship contrary to God’s Word? That is, which is sinful? And do they mean all such sinful worship or some only? If they mean all such sinful worship, then these words of theirs are idolatry: for they are part of their preaching, which is part of God’s worship, in their own sense: And it is false doctrine and tends to men’s perdition. And so they and all false teachers should be idolaters. By this they would turn all sins in worship into one: It is all idolatry. Is not every confused prayer sinful which has unmeet expressions and disordered, and has wandering thoughts and dull affections? Is there any of these love-killers that dare say they pray without sin? And must we not separate from them then as idolaters? Yea and every man from himself; that is, he must give over praying because it’s all idolatry? But perhaps they will say: ‘This sin is but in the manner and not in the matter.’ Answer: Very good; it seems then that sin in the manner of worship is not idolatry… Will you find some words which you can call false in the matter? Suppose it were so? When an Antinomian, an Anabaptist, a Separatist or anyone that errs does drop some of his errors in his prayers (as I think none will deny that they use to do), must we needs believe that his prayer is idolatry therefore, as being false worship? And is it unlawful to join with such? Then we shall have more separation than you yet plead for or practice yourselves. No two men in the world must join together if all sinful worship, or worship false sometime in the very matter does necessitate a separation… … But hem+or+false+fire+of+carnal+passions+and+uncharitableness%2C+as+makes+it+a+much+harder+question+whether+it+be+lawful+to+join+with+such+as+he+is%2C+while+he+abhors+so+much+to+join+with+others.%E2%80%9D%0A%0A%E2%80%94+Richard+Baxter%2C+The+Cure+of+Church+Divisions+%28London%3A+Symmons%2C+1670%29%2C+pt.+1+%7C+Direction+33%2C+p.+190-93&amp;url=https%3A%2F%2F5solasquotes.github.io%2Fquote%2Ffd793bc8c6.html&amp;via=5Solas" target="_blank" rel="noopener">Share on X</a><a class="perma" href="../quote/fd793bc8c6.html">Permalink</a><a class="src" href="https://reformedbooksonline.com/on-idolatry/#:~:text=And%20what%20pitiful%20arguments%20have%20they,so%20much%20to%20join%20with%20others&amp;text=And%20what%20pitiful%20arguments%20have%20they%20to%20prove&amp;text=he%20abhors%20so%20much%20to%20join%20with%20others" rel="noopener" target="_blank">Read it online · Reformed Books Online</a></div>

<blockquote><p>Here I shall only give you this caution, Take heed of taking your notions of God from sense, or merely from reason:

1. Not from sense: Spiritual beings fall under no cognisance of the external senses. None ever saw God’s shape; none ever saw his similitude; and here let me caution you, against any pictures of God, or any Person in the Godhead. We are ready in our minds to form ideas in our minds of any beings according to the representations which pictures and images make of them. It is impossible but all pictures, images or external representations of the Divine Being must be teachers of lies. It is impossible that a limner [painter] should draw the true representation of a man whom he never saw. How is it possible he should draw any representation of an invisible God, a Being which he neither ever saw nor can see? The fairest pretence is for the picture of our Saviour, who assumed our nature and was a man in all things. But all those pictures must be teachers of lies too: For Christ was God-Man, and the representation of a man is no representation of the Person of the Mediator. Does any say that upon the same argument there should be no pictures drawn, for a picture does but represent our fleshly part, the soul cannot be expressed. I answer there yet are these differences:

1. The picture of our friend is the representation of a being that we know is or was informed with a reasonable soul, so as the other essential part of the man is on course understood; but it is not so as to Christ. Though the picture of an human shape has this advantage, that we may understand under it a reasonable soul, of which every man is possessed, yet we cannot under any such shape understand the Divine Nature personally united to the human nature.

2. Again even the picture of a man, if it has no similitude of the man, is but a teacher of a lie and does but help our thoughts with false notions and conceptions. And what limner ever saw the Lord in his human shape, to draw a representation of Him? What need any pictures of Christ when every man we see is as true a representation of Him as any limner can make who never saw Him in the flesh, nor a true copy to draw Him by. I am apt to believe that this was one reason of God’s so severe prohibition of images and the likeness of anything to represent God, because He knew that those things would be of this pernicious use, to give us false notions and ideas of God: for you shall observe when you have seen the pretended picture or resemblance of a man, you will fancy him according to that representation, whether the picture be anything like the person for whom it is made, yea or no.

3. To which I might add that admitting a picture of a man or a friend be not like the person and give our fancies a false notion of him, yet in this there is no sin, no defilement, no guilt upon the soul by it; but to conceive amiss of God is a thing quite of another nature and of further danger to the soul. This has made me sometimes wonder that Luther, though he abhorred images, and showed as great a detestation of them as any other, as they are used in Popery, as they are means or objects of adoration; yet allowed the use and standing of them in Churches. Certainly it is a thing of very dangerous consequence, whether in Churches or our own private houses; for we shall find a great proneness in us to form out notions of God according to such representations; and if those representations be lies and false, such will our notions be: and if this be not a fair way to fill the soul with atheistical and blasphemous thoughts concerning God and Christ, I do not know what is.</p></blockquote>

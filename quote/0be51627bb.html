<main class="wrap"><figure class="quote" id="q-0be51627bb" data-kw="">
<blockquote><p>Besides, you mistake him [Tertullian] if you think he meant by the name of ‘tradition’ a tradition of the apostles. For whatsoever custom not written in the scripture was kept by the faithful, that, because it was delivered by some body from whom the use thereof was taken, he says it came in by tradition. In so much that he affirms it both of Jewish customs before the apostles, as that their women covered their faces with vails…</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/john-rainolds.html">John Rainolds</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Sum of the Conference between John Rainolds and John Hart</cite>, [a Romanist] touching the Head and the Faith of the Church (London, 1584), ch. 8, p. 581</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/worship/head-coverings-in-worship.html">Head Coverings in Worship</a></span></div>

</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-21e9bea9a2" data-kw="">
<blockquote><p>…an external ecclesiastical reformation and several canons [implemented by the apostles] concerning the reformation of external abuses and scandals in the Church: as for instance, that the churches should abstain from blood and things strangled; that two or three at most should prophesy in the Church at one meeting; that the men should pray with their heads uncovered, the women covered; that young widows should be no longer admitted to serve the Church in attending the sick [1 Tim. 5] and that such widows must be at least 60 years old, and the like.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/george-gillespie.html">George Gillespie</a></span><span class="wk"><span class="lbl">Work:</span> <cite>A Treatise of Miscellany Questions</cite>, … (Edinburgh, 1649), ch. 13, pp. 165-66</span></figcaption>

<blockquote><p>First then David’s piety appears in these two actions:…

2. By the manner of his going barefoot.

3. With his head covered [2 Sam. 15:30-32]. Which was the Jewish custom of mourners, as we see, v. 32, and ch. 13:19… 2. His piety appears in his prayer which he made to God, v. 31…</p></blockquote>

</figure><figure class="quote" id="q-15a6d09e85" data-kw="">
<blockquote><p>Part III will find the exact ‘covering’ prohibited to men while ‘praying or prophesying’ (11:4) is less certain [compared to the woman’s covering], though it seems Paul proscribed Corinthian men from wearing any dishonoring covering in the assemblies, namely which hung down from their heads, whether material, a hair–bun or long hair, yet not wreaths, helmets, hats or turbans.</p></blockquote>

</figure><figure class="quote" id="q-bfbcffb020" data-kw="">
<blockquote><p>We are accustomed to testify without hesitation that this reverence–even if it principally resides in the attitude of the heart of a person who, with a certain righteous dread, regards God as present with Him, a heavenly banquet as present, and the angels as present–nevertheless is also present in the external elements [signis]. I mean things like kneeling during common prayers, an uncovered head, and properly greeting those from whose hand we receive the mysteries–in a word, in our whole deportment and demeanor. And anyone who behaved differently would not leave without a severe rebuke.</p></blockquote>

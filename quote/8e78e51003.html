<main class="wrap"><figure class="quote" id="q-8e78e51003" data-kw="">
<blockquote><p>…in my judgment the usual solution of this appearing difficulty… in the discourse of St. James, ch. 2, v. 14 to the end, has not been in the least impeached, nor has had any new difficulty put upon it in some late discourses to that purpose… …It is taken for granted on all hands that there is no real repugnancy or contradiction between what is delivered by these two apostles… …It is taken also for granted on all other occasions that when there is an appearance of repugnancy or contradiction in any places of Scripture, if some or any of them do treat directly, designedly and largely about the matter concerning which there is a seeming repugnancy or contradiction, and others, or any other speak of the same things only obiter, occasionally, transiently, in order unto other ends, the truth is to be learned, stated and fixed from the former places… According unto this rule, it is unquestionable that the doctrine of justification before God is to be learned from the writings of the apostle Paul, and from them is light to be taken into all other places of Scripture where it is occasionally mentioned… For it must be acknowledged that he wrote of this subject of our justification before God on purpose to declare it for its own sake, and its use in the Church, and that he does it fully, largely and frequently in a constant harmony of expressions… As unto what is delivered by the apostle James, so far as our justification is included therein, things are quite otherwise. He does not undertake to declare the doctrine of our justification before God, but having another design in hand as we shall see…</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/john-owen.html">John Owen</a></span><span class="wk"><span class="lbl">Work:</span> <cite>ch. 20, ‘The Doctrine of the Apostle James concerning Faith &amp; Works, its Agreement with that of St. Paul’ in The Doctrine of Justification by Faith in Works (†1683; Johnstone &amp; Hunter, 1850), 5.384-400</cite>, pp. 384-86</span></figcaption>

<blockquote><p>18th Objection [by Osiander]: Christ has brought us eternal justice. This applied justice is not eternal: Therefore this is not our justice, but God Himself is our justice. Answer: The Lord is our justice, that is, our Justifier. But that our applied justice is eternal, has been showed before; because the imputation thereof is continued to all eternity. That justice also of the Law which is begun in us in this life, shall be continued, and perfected in the life to come. But that justice which is God Himself is not in us: because so God should be an accident to his creature, and become justice in man. For justice and virtue are things created in us, not the essence of God. Moreover Osiander, who obiects this, does not discern the cause from the effect. As we live not, or are wise by the essence of God (for this is all one, as to say, that we are as wise as God) so also we are not just by the essence of God. Wherefore nothing is more impious than to say that the essential justice of the Creator is the justice of the creatures: for thereof it would follow, that we have the justice of God, yea the very essence of God. The cause must be discerned from the effect, increate iustice from created justice.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/zacharias-ursinus.html">Zacharias Ursinus</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Sum of Christian Religion: Delivered… in his Lectures upon the Catechism… tr. Henrie Parrie (Oxford, 1587), ‘Of Justification’, 7. ‘Why Christ’s satisfaction is made ours by faith only’, ‘Objections against this Doctrine of Justification’</cite>, p. 691</span></figcaption>

<blockquote><p>We are today accepted in the Beloved, today absolved from sin, today acquitted at the bar of God… We are now pardoned; even now are our sins put away; even now we stand in the sight of God accepted, as though we had never been guilty. “There is therefore now no condemnation to them which are in Christ Jesus.” There is not a sin in the Book of God, even now, against one of His people. Who dares to lay anything to their charge? There is neither speck, nor spot, nor wrinkle, nor any such thing remaining upon any one believer in the matter of justification in the sight of the Judge of all the earth.</p></blockquote>

<blockquote><p>Objection: Faith is never without good works. Therefore, it cannot justify alone. Response. Faith may be said to justify without good works in two ways: either in such a way that we say the faith which justifies does not have good works joined with it, or in such a way that we say good works are not co-causes of justification. Faith indeed is never without good works; yet it does not follow from this that good works are a co-operating cause concurring with faith unto justification. Thus, the sun never gives light without heat, yet heat is not a co-operating cause which concurs with the sun unto illumination. So faith does not justify as separated from good works, nor yet for that reason are good works a co-operating cause of our justification.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/john-cameron.html">John Cameron</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Works… (Geneva: Chovet, 1658), Arguments Proposed in Disputation against the Preceding Theses, with Solutions, To Corollary V</cite>, p. 364, trans. ChatGPT-5</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/justification/nature-of-justification.html">Nature of Justification</a></span></div>
<div class="actions"><button class="copy" data-copy="“Objection: Faith is never without good works. Therefore, it cannot justify alone. Response. Faith may be said to justify without good works in two ways: either in such a way that we say the faith which justifies does not have good works joined with it, or in such a way that we say good works are not co-causes of justification. Faith indeed is never without good works; yet it does not follow from this that good works are a co-operating cause concurring with faith unto justification. Thus, the sun never gives light without heat, yet heat is not a co-operating cause which concurs with the sun unto illumination. So faith does not justify as separated from good works, nor yet for that reason are good works a co-operating cause of our justification.”

— John Cameron, Works… (Geneva: Chovet, 1658), Arguments Proposed in Disputation against the Preceding Theses, with Solutions, To Corollary V, p. 364, trans. ChatGPT-5">Copy</button><a class="share" href="https://x.com/intent/post?text=%E2%80%9CObjection%3A+Faith+is+never+without+good+works.+Therefore%2C+it+cannot+justify+alone.+Response.+Faith+may+be+said+to+justify+without+good+works+in+two+ways%3A+either+in+such+a+way+that+we+say+the+faith+which+justifies+does+not+have+good+works+joined+with+it%2C+or+in+such+a+way+that+we+say+good+works+are+not+co-causes+of+justification.+Faith+indeed+is+never+without+good+works%3B+yet+it+does+not+follow+from+this+that+good+works+are+a+co-operating+cause+concurring+with+faith+unto+justification.+Thus%2C+the+sun+never+gives+light+without+heat%2C+yet+heat+is+not+a+co-operating+cause+which+concurs+with+the+sun+unto+illumination.+So+faith+does+not+justify+as+separated+from+good+works%2C+nor+yet+for+that+reason+are+good+works+a+co-operating+cause+of+our+justification.%E2%80%9D%0A%0A%E2%80%94+John+Cameron%2C+Works%E2%80%A6+%28Geneva%3A+Chovet%2C+1658%29%2C+Arguments+Proposed+in+Disputation+against+the+Preceding+Theses%2C+with+Solutions%2C+To+Corollary+V%2C+p.+364%2C+trans.+ChatGPT-5&amp;url=https%3A%2F%2F5solasquotes.github.io%2Fquote%2Ff3c2b6d568.html&amp;via=5Solas" target="_blank" rel="noopener">Share on X</a><a class="perma" href="../quote/f3c2b6d568.html">Permalink</a><a class="src" href="https://reformedbooksonline.com/topics/justification#:~:text=Objection%3A%20Faith%20is%20never%20without%20good,a%20co%2Doperating%20cause%20of%20our%20justification&amp;text=Objection%3A%20Faith%20is%20never%20without%20good%20works.%20Therefore&amp;text=good%20works%20a%20co%2Doperating%20cause%20of%20our%20justification" rel="noopener" target="_blank">Read it online · Reformed Books Online</a></div>

<main class="wrap"><figure class="quote" id="q-19ad0b60b4" data-kw="">
<blockquote><p>Paphnutius the Confessor, when he observed Maximus, a godly and orthodox man, as Ruffinus reports, through too much simplicity, sit in the synod of Tyre, composed of such as were of the Arian side, the said Paphnutius went boldly in to the midst of the synod and said, ‘Te non patiar sedere, etc.’, i.e. O Maximus, I will not suffer thee to sit in a synod of malignants, nor to enter amongst the workers of iniquity.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/john-currie.html">John Currie</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Vindication of the Real Reformation Principles of the Church of Scotland concerning Separation, Contra the Seceders</cite>, 1740</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/the-church/schism-and-separation.html">Schism and Separation</a></span></div>

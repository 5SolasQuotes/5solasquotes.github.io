<main class="wrap"><figure class="quote" id="q-a56619ff23" data-kw="">
<blockquote><p>For 2. I add, it is by the satisfaction of Christ the Redeemer, wherein are contained both the matter and form of the justification of a sinner. The matter is Christ’s satisfaction, his obedience in his life, in his death; in fulfilling the law, and in suffering for our not fulfilling it; and the merit of all manifested in his resurrection and glorious ascension. The form is the imputing of that obedience whereby the righteousness of Christ does now become the believer’s as truly and really by imputation as it was Christ’s own in action.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/thomas-taylor.html">Thomas Taylor</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Commentary on Titus</cite>, (Cambridge: Greene, 1612), on chapter 3, v. 7, p. 666 Taylor (1576-1632) was partially conforming English puritan.</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/justification/active-and-passive-obedience-imputed.html">Active and Passive Obedience Imputed</a></span></div>

</figure><figure class="quote" id="q-e13818fd38" data-kw="">
<blockquote><p>13… And thus far there is the highest consensus among the Orthodox, although a certain dissensus intervenes in the explication of the material cause — some urging both the ἐνεργητική [energētikē, active] and the παθητική [pathētikē, passive] obedience, and conjoining satisfaction through obedience and through suffering; others seeking the material cause of our justification in satisfaction through suffering alone. 14. The foundation is safe among both parties. For both not only admit but also require the obedience of Christ perfectly rendered to the law for our justification; but they differ in the manner of explicating the matter. For some hold it to be the meritorious cause of our justification; others hold it to be the condition of the person and the causa sine qua non [indispensable cause] of meriting justification — namely, that it behoved us to have such a High Priest who was holy and undefiled, Heb. VII.26–27. Concerning which there is a certain dissensus of opinions, the unity of faith and charity being preserved, since both parties apprehend the whole Christ and Christ alone, and in Him whole and alone seek righteousness and life.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/friedrich-spanheim.html">Friedrich Spanheim</a></span><span class="wk"><span class="lbl">Work:</span> <cite>‘Disputation on the Justification of Man before God’ in Disputationum Theologicarum Miscellaneorum Pars Prima</cite>, (Geneva: Chouët, 1652), trans. AI by Roman Prestarri at Confessionally Reformed Theology Latin</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/justification/active-and-passive-obedience-imputed.html">Active and Passive Obedience Imputed</a></span></div>
<div class="actions"><button class="copy" data-copy="“13… And thus far there is the highest consensus among the Orthodox, although a certain dissensus intervenes in the explication of the material cause — some urging both the ἐνεργητική [energētikē, active] and the παθητική [pathētikē, passive] obedience, and conjoining satisfaction through obedience and through suffering; others seeking the material cause of our justification in satisfaction through suffering alone. 14. The foundation is safe among both parties. For both not only admit but also require the obedience of Christ perfectly rendered to the law for our justification; but they differ in the manner of explicating the matter. For some hold it to be the meritorious cause of our justification; others hold it to be the condition of the person and the causa sine qua non [indispensable cause] of meriting justification — namely, that it behoved us to have such a High Priest who was holy and undefiled, Heb. VII.26–27. Concerning which there is a certain dissensus of opinions, the unity of faith and charity being preserved, since both parties apprehend the whole Christ and Christ alone, and in Him whole and alone seek righteousness and life.”

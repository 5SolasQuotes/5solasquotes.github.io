</figure><figure class="quote" id="q-05d0dc780f" data-kw="">
<blockquote><p>…union has the advantage over division, because: 1. It is a commanded mean tending to edification, which division is not. 2. Division has no less nor fewer inconveniencies following it, nor [is] less destructive to the Church than union in the case supposed; yea, schism is one of the greatest hurts that can come to an orthodox Church, it being next to heresy in doctrine; and therefore no particular evil can be laid in the balance with it. 3. The ills of division are most inevitable, for the ills that follow union, through God’s blessing, may be prevented; it is not impossible, but in the way of division it is, because itself is out of God’s way.</p></blockquote>

<main class="wrap"><figure class="quote" id="q-df1a581a5d" data-kw="">
<blockquote><p>Incorporate thyself into the company of God’s people, by all engagements and obligations of a profitable, intimate, and comfortable fellowship in the gospel. There is a secret tie unto constancy in the communion of the saints. He is not likely to walk long that walketh alone, especially if he might enjoy good company. Shunning society with the godly is a plain sign of a temporary faith.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/robert-bolton.html">Robert Bolton</a></span><span class="wk"><span class="lbl">Work:</span> <cite>General Directions for a Comfortable Walking with God</cite>, (1626; Ligonier PA: Soli Deo Gloria, 1991), p. 11.</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/the-church.html">The Church</a></span></div>

</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-7bf1891e87" data-kw="">
<blockquote><p>All Christians are obliged to the uttermost of their power to quench the fire of heresy and schism; but above all other, we have a special obligation for this duty. We have lifted up our hands to the most high God, vowing to him, in the sight of all the neighbour-nations, our endeavours in the sincerity of our hearts, to extirpate heresy and schism, and whatsoever shall be found contrary to sound doctrine, without respect of persons.

If herein we should be negligent, would not God avenge our solemn perjury? If respect to any person should make us ever think of breaking that bond, and expressly contrary thereto to begin once to tamper about the toleration of errors contrary to sound doctrine, what might we and the posterity expect from the hand of the God of justice and truth?</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/robert-baillie.html">Robert Baillie</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Errors &amp; induration are the great sins &amp; the great judgments of the time. Preached in a sermon before the Right Honourable House of Peers, in the Abbey-Church at Westminster, July 30, 1645, the day of the Monthly Fast in Chris Coldwell (ed.), Sermons Preached before the English Houses of Parliament </cite></span></figcaption>
<div class="meta"><span class="t"><a href="../topics/the-church/schism-and-separation.html">Schism and Separation</a></span></div>

 Covenanter</a></div>
</figure><figure class="quote" id="q-24bf54aa64" data-kw="">
<blockquote><p>We deny that Papalism, or the faith of the Papists according to the Roman formula and the prescription of the Council of Trent, considered abstractly and in itself, is salutary (that is, that it is meritorious of salvation, or a cause, or a means, or a sine qua non condition, or the way through which it is obtained); but on the contrary, we say that it is damnable. For considered formally, it is composed of mere errors, heresies, idolatry, and superstitions.</p></blockquote>

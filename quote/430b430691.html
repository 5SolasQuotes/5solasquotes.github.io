<main class="wrap"><figure class="quote" id="q-430b430691" data-kw="">
<blockquote><p>Lyra appears to think otherwise. He places first ‘the evening’ as the completion of the day (artificial), and he places ‘the morning’ as the completion of the night (Lyra).</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/nicholas-of-lyra.html">Nicholas of Lyra</a></span><span class="wk"><span class="lbl">Work:</span> <cite>As quoted by Matthew Poole, Synopsis of Biblical Interpreters</cite>, (From Reformation to Reformation Translations, 2017), on Gen. 1:5, p. 89</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/worship/the-lords-day.html">The Lord&#x27;s Day</a></span></div>

</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-210141a3e0" data-kw="">
<blockquote><p>Therefore, if the activity is conducive to worship, then it is lawful. We cannot ignore the human conscience here either, since an activity that might be conducive for worship to one person may not be conducive to worship for someone else. To take one example, it is certainly wise to let small children let loose some of their excess energy on the Sabbath (contrary to Laura Ingalls Wilder’s Farmer Boy! [below]). Otherwise, they will not be able to sit still and pay attention in worship. One does not have to take the attitude of Almanzo Wilder’s father [in Farmer Boy] in order to have a Puritan view of what is acceptable on the Sabbath! It is certainly a work of necessity to do something about the energy of small children. We must avoid both extremes of legalism and antinomianism here, as well as everywhere in our treatment of the law.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/lane-keister.html">Lane Keister</a></span><span class="wk"><span class="lbl">Work:</span> <cite>‘The Sabbath Day &amp; Recreations on the Sabbath</cite>, …’ in Confessional Presbyterian, #5 (2009), p. 323</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/worship/the-lords-day.html">The Lord&#x27;s Day</a></span></div>

</figure><figure class="quote" id="q-1fbfb885bf" data-kw="">
<blockquote><p>How blind is superstition, that they [the Pharisees] could think that it was contrary to the will of God that his people should fit themselves for the service of the Sabbath by a moderate refreshment?… What a little thing do they carp at? Wherein was the sin, the plucking of a few ears of corn, and rubbing them, could hardly be called servile labor, especially not in the sense of the commandment, which restrained not necessary labour, but such labor as took them off from the duties of the Sabbath, but their tradition had made this unlawful…</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/matthew-poole.html">Matthew Poole</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Annotations upon the Holy Bible. Vol. II</cite>, … (London: Parkhurst, 1685), on Mt. 12, v. 2 margin note</span></figcaption>

</figure><figure class="quote" id="q-f5fc829787" data-kw="">
<blockquote><p>The precept of the Sabbath observance is moral in one respect, insofar as it commands man to give some time to the things of God, according to Ps. 45:11: ‘Be still and see that I am God.’ In this respect it is placed among the precepts of the decalogue: but not as to the fixing of the time, in which respect it is a ceremonial precept.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/thomas-aquinas.html">Thomas Aquinas</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Summa, pt. 1 of 2, quest. 100</cite>, article 3, reply to Objection 2</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/worship/the-lords-day.html">The Lord&#x27;s Day</a></span></div>

<blockquote><p>That is to say, that among the people of Israel there was, as it were, a twofold holiness of persons: the one common, according to which that whole nation was separated from all other nations so that they might be covenanted and consecrated to God—and for that reason they were called “a holy nation,” while the rest of the nations were “profane”; the other more special, and proper to those who, for the service of God in the tabernacle, were exempted from other employments—on which account they were with peculiar propriety called “holy,” as also, in the same manner, were all vessels made use of in the sacred service.

In fact, then, the apostle refers to the one or the other of these two kinds of holiness, with a view to show either that the children of believers are set apart by God, to the end that they may resemble certain vessels that under the old economy were specially dedicated to his own service, or that they are separated from the common condition of other infants so that they may participate in the covenanted people of God.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/moses-amyraut.html">Moses Amyraut</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Disputatio de Paedobaptismi</cite>, §XIV. Quoted in Herman Witsius, On the Efficacy and Utility of Baptism in the Case of Elect Infants whose Parents are under the Covenant (1693), trans. William Marshall, ed. J. Mark Beach in Mid-American Journal of Theology, 17 (2006), pp 128-29.</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/worship.html">Worship</a></span></div>

<blockquote><p>The sanctification of the Sabbath, since it is moral and perpetual and is turned into the Lord’s Day in the Christian church, is twofold, privative and positive or ascetic. It is privative, consisting in cessation from labours of ordinary vocation, that we may be freer to worship God. It is positive or ascetic, consisting in the solemn public and private worship of God, which is exercised at a stated time in the congregation of the church and at home. It cannot be gathered very pure other than from the moral worship of the Sabbath day, which sort, having been secluded even in the Old Testament, was typical compared with the worship of God in the New Testament.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/johann-heinrich-heidegger.html">Johann Heinrich Heidegger</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Concise Marrow of Christian Theology</cite>, trans. Casey Carmichael, Classic Reformed Theology, vol. 4 (1697; Grand Rapids MI: Reformation Heritage Books, 2019), XIV.XV, Kindle Locations 2315-2319.</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/worship.html">Worship</a></span></div>

<blockquote><p>The ceremonial law is the system of God’s positive precepts concerning the external worship in sacred things, prescribed to the ancient church, either for the sake of order or signification. … Ceremonies are external rites and sacred accidents of the worship of God. They are not of themselves the worship of God, but concomitant adjuncts and assistants by signification, exercise, exercise, work and decorum.</p></blockquote>

<blockquote><p>3. Mr. [Richard] Bernard, himself in this book makes prayer one thing, and the blessing pronounced upon the people, when they departed, another thing: as he also makes singing of psalms a third distinct thing from them both: as there is cause he should. For first, the apostle writing to the Corinthians of the diverse gifts, and administrations in the Church, speaketh thus: ‘I will pray with the spirit, but I will pray with the understanding also: I will sing with the spirit, but I will sing with the understanding also.’ Answerable unto which is that in James [5:13], ‘Is any among you afflicted? let him pray; is any merry? let him sing’: both the one, and other apostle making singing, and praying distinct exercises. And unto this, that whereas in praying we are to speak only unto God, it is otherwise in singing, where we are taught to ‘speak unto ourselves in psalms, and to teach, and admonish ourselves in psalms, and hymns, and spiritual songs.’ What greater difference? In prayers we speak only to God: in psalms to ourselves mutually, or one to another. Neither had Mr. Giffard any advantage in the words following, where we are taught to sing with a grace in our hearts to the Lord: for by singing with a grace is meant such singing as ministereth grace unto the hearers, contrary to that corrupt, or rotten communication, Eph. 4:29. And in this, as in all other things, we must propound the glory, and honor of God unto ourselves. 3. There are very many both of David’s, and others psalms, wherein there is no title of prayer: but they are merely to be sung for doctrine, instruction, and meditation, as Ps. 1:2, and many more. The Ministers write (pp. 192-3), that the most Psalms that David made were sung not only as meditations and doctrines, for the instructions of the Church, but as prayers to God: because they are said to be sung unto the Lord: for which purpose they instance in one only, which is Ps. 66:2-3. Well, not to fall to reckoning with them (wherein they and I should not agree: for I would except against their picked instance: Ps. 66:2-3, which all men may see was not sung for prayer, nor unto the Lord, as they mean, but for instruction, and provocation of the Church to praise God) if they consider it, they should have proved, not that some, but that all psalms are prayers; otherwise they may not be confounded and made one ordinance, as by them they are. But to come to that which is specially to be observed: even those psalms, whose matter is prayer, are not prayers: neither is the singing of them, the outward ordinance and exercise of praying. And this is the very state of the controversy. Which that it may be understood the better, it must be considered that the very same matter of prayer may be used diversely, and so formed into diverse external ordinances. It may be read, preached, heard, written, sung, or prayed. Now who is so simple as to say hereupon that reading, preaching, hearing, writing, singing, praying, are all one? If a man read David’s prayer, that the Lord would turn the counsel of Ahitophel into foolishness: or either read, or sing the 6th Psalm, where in his prayer he professeth that he causeth his bed every night to swim, and waters his couch with tears: or psalm 42, that he remembers God from the land of Jordan, etc. doth that man therefore pray to God, that he would turn into foolishness the counsel of Ahithophel? or doth he profess that he waters his couch with tears every night and remembers God from the land of Jordan? or is it not evident he reads, and sings those prayers only for instruction of himself and others? And so we read in the inscription of the last named psalm that it was committed to the sons of Korah (not to pray it, which they could not do without folly) but for instruction. And as truly may it be said, that the reading of Noah’s curse, or Shimei’s, is cursing (Gen. 9:25; 2 Sam. 16:5), as that the reading, or singing (for singing is but a reading in tune) of David’s prayers, is praying. But it will here be asked, is it not then lawful for a man in the singing of David’s psalms (consisting of prayer) to lift up his heart, and to have it affected accordingly, as he can apply the matter in them to his present state and occasions? Yes, certainly, it is both lawful and godly: but withal it must be remembered that the question here is not about the inward affection of the heart, but about the outward ordinance: and 2. that a man may so lift up his heart and have the affection of prayer and thanksgiving in preaching, hearing, writing, reading: and yet not perform the outward exercise and outward ordinance of prayer, of which our question is. Lastly, in psalms there is of necessity required a certain known form of words, that two or more may sing together: according to the nature of the ordinance, wherein many joining vocally, do make a concert or harmony. But who will say there is such simple necessity of a set form of words for prayer? wherein one is to utter a voice according to the suggestions of the spirit in his heart, and the rest to consent by silence, with saying ‘Amen’. By which it appeareth how unadvisedly these ministers and others, do thus again and again urge set forms of psalms to prove set forms of prayer.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/john-robinson.html">John Robinson</a></span><span class="wk"><span class="lbl">Work:</span> <cite>A Justification of Separation from the Church of England Against Mr. Richard Bernard his Invective, entitled, The Separatists Schism</cite>, (Amsterdam, 1610), pp. 467-69</span></figcaption>

instruction%2C+and+meditation%2C+as+Ps.+1%3A2%2C+and+many+more.+The+Ministers+write+%28pp.+192-3%29%2C+that+the+most+Psalms+that+David+made+were+sung+not+only+as+meditations+and+doctrines%2C+for+the+instructions+of+the+Church%2C+but+as+prayers+to+God%3A+because+they+are+said+to+be+sung+unto+the+Lord%3A+for+which+purpose+they+instance+in+one+only%2C+which+is+Ps.+66%3A2-3.+Well%2C+not+to+fall+to+reckoning+with+them+%28wherein+they+and+I+should+not+agree%3A+for+I+would+except+against+their+picked+instance%3A+Ps.+66%3A2-3%2C+which+all+men+may+see+was+not+sung+for+prayer%2C+nor+unto+the+Lord%2C+as+they+mean%2C+but+for+instruction%2C+and+provocation+of+the+Church+to+praise+God%29+if+they+consider+it%2C+they+should+have+proved%2C+not+that+some%2C+but+that+all+psalms+are+prayers%3B+otherwise+they+may+not+be+confounded+and+made+one+ordinance%2C+as+by+them+they+are.+But+to+come+to+that+which+is+specially+to+be+observed%3A+even+those+psalms%2C+whose+matter+is+prayer%2C+are+not+prayers%3A+neither+is+the+singing+of+them%2C+the+outward+ordinance+and+exercise+of+praying.+And+this+is+the+very+state+of+the+controversy.+Which+that+it+may+be+understood+the+better%2C+it+must+be+considered+that+the+very+same+matter+of+prayer+may+be+used+diversely%2C+and+so+formed+into+diverse+external+ordinances.+It+may+be+read%2C+preached%2C+heard%2C+written%2C+sung%2C+or+prayed.+Now+who+is+so+simple+as+to+say+hereupon+that+reading%2C+preaching%2C+hearing%2C+writing%2C+singing%2C+praying%2C+are+all+one%3F+If+a+man+read+David%E2%80%99s+prayer%2C+that+the+Lord+would+turn+the+counsel+of+Ahitophel+into+foolishness%3A+or+either+read%2C+or+sing+the+6th+Psalm%2C+where+in+his+prayer+he+professeth+that+he+causeth+his+bed+every+night+to+swim%2C+and+waters+his+couch+with+tears%3A+or+psalm+42%2C+that+he+remembers+God+from+the+land+of+Jordan%2C+etc.+doth+that+man+therefore+pray+to+God%2C+that+he+would+turn+into+foolishness+the+counsel+of+Ahithophel%3F+or+doth+he+profess+that+he+waters+his+couch+with+tears+every+night+and+remembers+God+from+the+land+of+Jordan%3F+or+is+it+not+evident+he+reads%2C+and+sings+those+prayers+only+for+instruction+of+himself+and+others%3F+And+so+we+read+in+the+inscription+of+the+last+named+psalm+that+it+was+committed+to+the+sons+of+Korah+%28not+to+pray+it%2C+which+they+could+not+do+without+folly%29+but+for+instruction.+And+as+truly+may+it+be+said%2C+that+the+reading+of+Noah%E2%80%99s+curse%2C+or+Shimei%E2%80%99s%2C+is+cursing+%28Gen.+9%3A25%3B+2+Sam.+16%3A5%29%2C+as+that+the+reading%2C+or+singing+%28for+singing+is+but+a+reading+in+tune%29+of+David%E2%80%99s+prayers%2C+is+praying.+But+it+will+here+be+asked%2C+is+it+not+then+lawful+for+a+man+in+the+singing+of+David%E2%80%99s+psalms+%28consisting+of+prayer%29+to+lift+up+his+heart%2C+and+to+have+it+affected+accordingly%2C+as+he+can+apply+the+matter+in+them+to+his+present+state+and+occasions%3F+Yes%2C+certainly%2C+it+is+both+lawful+and+godly%3A+but+withal+it+must+be+remembered+that+the+question+here+is+not+about+the+inward+affection+of+the+heart%2C+but+about+the+outward+ordinance%3A+and+2.+that+a+man+may+so+lift+up+his+heart+and+have+the+affection+of+prayer+and+thanksgiving+in+preaching%2C+hearing%2C+writing%2C+reading%3A+and+yet+not+perform+the+outward+exercise+and+outward+ordinance+of+prayer%2C+of+which+our+question+is.+Lastly%2C+in+psalms+there+is+of+necessity+required+a+certain+known+form+of+words%2C+that+two+or+more+may+sing+together%3A+according+to+the+nature+of+the+ordinance%2C+wherein+many+joining+vocally%2C+do+make+a+concert+or+harmony.+But+who+will+say+there+is+such+simple+necessity+of+a+set+form+of+words+for+prayer%3F+wherein+one+is+to+utter+a+voice+according+to+the+suggestions+of+the+spirit+in+his+heart%2C+and+the+rest+to+consent+by+silence%2C+with+saying+%E2%80%98Amen%E2%80%99.+By+which+it+appeareth+how+unadvisedly+these+ministers+and+others%2C+do+thus+again+and+again+urge+set+forms+of+psalms+to+prove+set+forms+of+prayer.%E2%80%9D%0A%0A%E2%80%94+John+Robinson%2C+A+Justification+of+Separation+from+the+Church+of+England+Against+Mr.+Richard+Bernard+his+Invective%2C+entitled%2C+The+Separatists+Schism%2C+%28Amsterdam%2C+1610%29%2C+pp.+467-69&amp;url=https%3A%2F%2F5solasquotes.github.io%2Fquote%2F0e7b89bf27.html&amp;via=5Solas" target="_blank" rel="noopener">Share on X</a><a class="perma" href="../quote/0e7b89bf27.html">Permalink</a><a class="src" href="https://reformedbooksonline.com/singing-of-praise#:~:text=3.%20Mr.%20%5BRichard%5D%20Bernard%2C%20himself%20in,to%20prove%20set%20forms%20of%20prayer&amp;text=3.%20Mr.%20%5BRichard%5D%20Bernard%2C%20himself%20in%20this%20book&amp;text=of%20psalms%20to%20prove%20set%20forms%20of%20prayer" rel="noopener" target="_blank">Read it online · Reformed Books Online</a></div>

<blockquote><p>…We are to be distinguished from the common people and others by doctrine, not by garment–by conversation, not by habit [in clothing, etc.]–by the purity of mind, not by attire; for if we study to innovation, we tread under foot the order which has been delivered unto us by our fathers, to make place to idle superstitions; wherefore we ought not to lead the minds of the faithful into such things, for they are rather to be instructed than played withal; neither are we to blind and beguile their eyes, but to infuse instructions into their minds.</p></blockquote>

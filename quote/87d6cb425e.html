<blockquote><p>‘to you it shall be for meat’: which is generally thought to be the food of the antediluvians, it not being proper, at least very soon, to kill any of the animals until they were multiplied and increased, lest their species should be destroyed, though here is no prohibition of eating flesh; nor is it said that this only should be for meat which is before mentioned; and by the early employment of some in keeping sheep, and by the sacrifice of creatures immediately after the Fall, part of which used to be eaten by the offerers; and by the distinction of clean and unclean creatures before the Flood, it looks probable that flesh might be eaten: and Bochart refers this clause to what goes before in the preceding verse, as well as to what is in this, and takes the sense to be that the fishes of the sea and fowls of the air, and every living creature man had dominion over, as well as herbs and fruits, were given him for his food: but the Jews are of opinion that the first man might not eat flesh, but it was granted to the sons of Noah.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/john-gill.html">John Gill</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Exposition of the Bible (d. 1771), on Gen. 1, v. 29</cite></span></figcaption>

<blockquote><p>III… Although this concept cannot be conveniently defined, since it is not a single entity by its nature but rather an aggregate of various diverse natures, and therefore defies categorization according to logical principles, it can be most conveniently described as the conformity of man, according to his measure, to the supreme perfection of God. As D. Ames presents it in Medulla Theologiae (Book 1, Chapter 8, Sections 9 and 68), it is helpful to analyze this further. It is called conformity because an image, as such, is a kind of likeness expressed from another; therefore, it must be described through similarity and conformity, not identity… The subject of this image, both directly and indirectly, is man. Here we note two points: first, that man can be considered in his fourfold state: as whole in creation, fallen in corruption, restored in regeneration, and glorified in glorification. For each of these states, a different aspect of the image is attributed to him by the Holy Scriptures in various ways… Secondly, we must note, following Genesis 1:26-28, that women are by no means excluded from this image… Furthermore, the phrase “according to his measure” is not without significance, for although this conformity is in itself most perfect, it varies according to the capacity of its subjects (since it applies differently to angels than to humans). Consequently, this image was also implanted in humans according to their measure—that is, perfectly (for nothing imperfect comes from God), yet in a way divinely adjusted to their capacity, as they were not endowed with supreme perfection. Lastly, the phrase “to the supreme perfection of God” alludes to the genuine archetype and original exemplar to which man, as a secondary type and copy, is said to conform. The reason for this conformity is explained in the prolegomena. I will add only this: that this communication should in no way be conceived as formal but only effective, by way of effect… IV… Therefore, we examine the parts or the substance from which it (as previously mentioned, it is composed of multiple elements) consists, in three aspects: first, those concerning the body; second, those concerning the soul, which are further divided into 1) essence, 2) faculties, and 3) habits; and third, those concerning the whole composite… although various parts constituting this image are enumerated here, it should be understood that not all contribute equally—some antecedently and presuppositionally, others formally and primarily, and still others consequentially and sequentially.</p></blockquote>

</figure><figure class="quote" id="q-b15a672f4d" data-kw="">
<blockquote><p>The intellect is that power by which we are able to entertain concepts, to affirm the truth or falsity of propositions, and to assess the cogency of arguments… Traditionally, the act of entertaining a concept is known as simple apprehension; the act of affirming or denying the truth of a proposition is known as judgment; and the act of inferring a proposition from other propositions is known as reasoning. Simple apprehension, judgment, and reasoning are the intellect’s basic operations. Being rational or capable of thought is essentially a matter of having the capacity for these operations of the intellect.</p></blockquote>

</figure><figure class="quote" id="q-a4cc6d4d11" data-kw="">
<blockquote><p>If by ‘thinking’ we mean the capacity for what Bermudez calls direct belief modification, goal-desires, simple seeing, dispositions to form beliefs about things of a general type, and so forth, then non-linguistic animals are capable of thinking. But all of this falls within the range of capacities made possible by what Aristotelians traditionally call the ‘internal senses’. It doesn’t follow that non-linguistic animals are capable of what Bermudez calls second-order cognition, higher-order desires, the attribution to others of propositional attitudes, reflective belief modification, a grasp of compound, modal, tensed and general propositions, situation-desires and epistemic seeing, and so forth… If that is the sort of thing we mean by ‘thinking,’ then there is good reason to conclude that non-linguistic animals are not capable of thinking… Karl Popper drew a distinction between four main functions of language. The first is the expressive function, which involves the outward expression of an inward state… The second is the signaling function, which adds to the expressive function the generation of a reaction in others. Popper compares it to the dange signals an animal might send out in order to alert other animals… The third is the descriptive function, which involves the expression of a proposition, something that can be either true or false… The fourth is the argumentative function, which involves the expression of an inference from one or more propositions to another in a manner that can be said to be either valid or invalid… While the most primitive animals may be incapable of behavior that performs even the first two of these functions, there are also obviously animals that can perform them, and in that sense they can be said to have language. But… [this] does not entail being capable of the descriptive and argumentative functions… Whether animals lacking that particular sort of language, can be said to think in the sense of entertaining concepts, propositions, and logical inferences… the answer must be in the negative.</p></blockquote>

k in the sense of entertaining concepts, propositions, and logical inferences… the answer must be in the negative.”

— Edward Feser, Immortal Souls: a Treatise on Human Nature (Editiones Scholasticae, 2024) | pt. 1, ‘What is Mind?’ | ‘Thought &amp; Language’, pp. 99-102, ch. 3 ‘The Intellect’">Copy</button><a class="share" href="https://x.com/intent/post?text=%E2%80%9CIf+by+%E2%80%98thinking%E2%80%99+we+mean+the+capacity+for+what+Bermudez+calls+direct+belief+modification%2C+goal-desires%2C+simple+seeing%2C+dispositions+to+form+beliefs+about+things+of+a+general+type%2C+and+so+forth%2C+then+non-linguistic+animals+are+capable+of+thinking.+But+all+of+this+falls+within+the+range+of+capacities+made+possible+by+what+Aristotelians+traditionally+call+the+%E2%80%98internal+senses%E2%80%99.+It+doesn%E2%80%99t+follow+that+non-linguistic+animals+are+capable+of+what+Bermudez+calls+second-order+cognition%2C+higher-order+desires%2C+the+attribution+to+others+of+propositional+attitudes%2C+reflective+belief+modification%2C+a+grasp+of+compound%2C+modal%2C+tensed+and+general+propositions%2C+situation-desires+and+epistemic+seeing%2C+and+so+forth%E2%80%A6+If+that+is+the+sort+of+thing+we+mean+by+%E2%80%98thinking%2C%E2%80%99+then+there+is+good+reason+to+conclude+that+non-linguistic+animals+are+not+capable+of+thinking%E2%80%A6+Karl+Popper+drew+a+distinction+between+four+main+functions+of+language.+The+first+is+the+expressive+function%2C+which+involves+the+outward+expression+of+an+inward+state%E2%80%A6+The+second+is+the+signaling+function%2C+which+adds+to+the+expressive+function+the+generation+of+a+reaction+in+others.+Popper+compares+it+to+the+dange+signals+an+animal+might+send+out+in+order+to+alert+other+animals%E2%80%A6+The+third+is+the+descriptive+function%2C+which+involves+the+expression+of+a+proposition%2C+something+that+can+be+either+true+or+false%E2%80%A6+The+fourth+is+the+argumentative+function%2C+which+involves+the+expression+of+an+inference+from+one+or+more+propositions+to+another+in+a+manner+that+can+be+said+to+be+either+valid+or+invalid%E2%80%A6+While+the+most+primitive+animals+may+be+incapable

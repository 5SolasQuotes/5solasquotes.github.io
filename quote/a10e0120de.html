<main class="wrap"><figure class="quote" id="q-a10e0120de" data-kw="">
<blockquote><p>Abstract reasoning is in many cases eminently serviceable in showing the thorough consistency of theological truth with philosophy and science truly so called. And the wise defenders of the faith will be forward to show that there is no incongruity, and indeed no want of mutual support, between theology, the Queen of Sciences, and her many handmaids in every department of solid thought and legitimate investigation.

And when a great ultimate scriptural truth is set forth in its own magnificent proportions, and on its own appropriate evidence, it is one of the worthiest exercises of the human intellect to show that it conflicts with nothing that the intellect of man has discovered or trustworthily accepted. This is to assign to theology its own proper sphere, and to leave theology in its own unaided majesty.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/hugh-martin.html">Hugh Martin</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Atonement: In its Relations to the Covenant, the Priesthood, the Intercession of our Lord</cite>, (London: James Nisbet &amp; Co., 1870), p. 3.</span></figcaption>

<blockquote><p>XIII… And a little later: “As the soul is in the body, so Christians are in the world.” The soul, although dispersed throughout all the members of the body, is nonetheless present in it; likewise, Christians, though they dwell in the world, are not of the world. The invisible soul is established as if in a garrison within the visible body; similarly, Christians are recognized while they sojourn in the world, but their divine worship is invisible. And a little later: Although the soul is enclosed in the body, it still preserves the body; likewise, although Christians are detained in the world as if in custody, they also preserve the world.</p></blockquote>

<blockquote><p>…those who founded sects committed to erroneous doctrines proceeded in a way that is opposite to this, The point is clear in the case of Muhammad. He seduced the people by promises of carnal pleasure to which the concupiscence of the flesh goads us. His teaching also contained precepts that were in conformity with his promises, and he gave free rein to carnal pleasure. In all this, as is not unexpected, he was obeyed by carnal men. As for proofs of the truth of his doctrine, he brought forward only such as could be grasped by the natural ability of anyone with a very modest wisdom. Indeed, the truths that he taught he mingled with many fables and with doctrines of the greatest falsity. He did not bring forth any signs produced in a supernatural way, which alone fittingly gives witness to divine inspiration; for a visible action that can be only divine reveals an invisibly inspired teacher of truth. On the contrary, Muhammad said that he was sent in the power of his arms—which are signs not lacking even to robbers and tyrants. What is more, no wise men, men trained in things divine and human, believed in him from the beginning, Those who believed in him were brutal men and desert wanderers, utterly ignorant of all divine teaching, through whose numbers Muhammad forced others to become his followers by the violence of his arms. Nor do divine pronouncements on the part of preceding prophets offer him any witness. On the contrary, he perverts almost all the testimonies of the Old and New Testaments by making them into fabrications of his own, as can be seen by anyone who examines his law. It was, therefore, a shrewd decision on his part to forbid his followers to read the Old and New Testaments, lest these books convict him of falsity. It is thus clear that those who place any faith in his words believe foolishly.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/thomas-aquinas.html">Thomas Aquinas</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Summa Contra Gentiles</cite>, I:6</span></figcaption>

</figure><figure class="quote" id="q-c99f9d01df" data-kw="">
<blockquote><p>ENGLISHMEN and Americans frequently use the word “sensualist” to describe one in whom the animal appetites are predominant. We shall see that it is a just charge against the Sensualistic philosophy, that it not seldom inclines its advocates to this dominion of beastly lusts. But it is not from this fact that we draw the phrase by which we name it.

The Sensualistic philosophy is that theory, which resolves all the powers of the human spirit into the functions of the five senses, and modifications thereof. It is the philosophy which finds all its rudiments in sensation. It not only denies to the spirit of man all innate ideas, but all innate powers of originating ideas, save those given us from our senses. It consequently attempts to account for every general and every abstract judgment, as an empirical result of our sensations, and consistently denies the validity of any à priori ideas. Such was the philosophy which was dominant in France at the close of the eighteenth century; and which, untaught by the frightful results it produced there, is now striving again to establish its dominion among us towards the close of the nineteenth age. …

Let it then be understood, that the philosophy which I maintain against the Sensualistic, or exclusively empirical, and which has just been described, shall be called the Rational. It holds that the human intelligence is not a bundle of organs, but a pure spirit; it asserts for man a Reason, and not merely senses and their modifications.

In the eighteenth century, the Sensualistic philosophy appeared under many phases; it does so again in the nineteenth. But it always has its characteristic traits, and carries its own dangers to truth, virtue, and happiness. One attempt of this criticism of it will be to show that it always involves tendencies to erroneous logic, vitiating even the physical sciences, which it is wont to claim as its peculiar clients; to universal scepticism; to idealism; to nihilism; to the obliterating of moral distinctions, and the destruction of moral responsibility; to materialism; to a denial of the supernatural; and thus, to atheism.

Let us be understood: we do not charge that every Sensualistic philosopher holds to all these results, or approves them; we charge that they are all latent in the system, and that one or another of them is continually making itself patent in the outgrowth of this philosophy. Of this, one of the most instructive proofs is the historical; for there “the tree is known by its fruits.” We shall, therefore, prepare the way for the stricter criticism, by a brief, but perspicuous review of the chief movements of Sensualism, especially in our own age.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/robert-l-dabney.html">Robert L. Dabney</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Sensualistic Philosophy of the Nineteenth Century, Considered</cite>, (New York: Anson D. F. Randolph &amp; Company, 1875), pp 1, 2-3.</span></figcaption>

+to+truth%2C+virtue%2C+and+happiness.+One+attempt+of+this+criticism+of+it+will+be+to+show+that+it+always+involves+tendencies+to+erroneous+logic%2C+vitiating+even+the+physical+sciences%2C+which+it+is+wont+to+claim+as+its+peculiar+clients%3B+to+universal+scepticism%3B+to+idealism%3B+to+nihilism%3B+to+the+obliterating+of+moral+distinctions%2C+and+the+destruction+of+moral+responsibility%3B+to+materialism%3B+to+a+denial+of+the+supernatural%3B+and+thus%2C+to+atheism.%0A%0ALet+us+be+understood%3A+we+do+not+charge+that+every+Sensualistic+philosopher+holds+to+all+these+results%2C+or+approves+them%3B+we+charge+that+they+are+all+latent+in+the+system%2C+and+that+one+or+another+of+them+is+continually+making+itself+patent+in+the+outgrowth+of+this+philosophy.+Of+this%2C+one+of+the+most+instructive+proofs+is+the+historical%3B+for+there+%E2%80%9Cthe+tree+is+known+by+its+fruits.%E2%80%9D+We+shall%2C+therefore%2C+prepare+the+way+for+the+stricter+criticism%2C+by+a+brief%2C+but+perspicuous+review+of+the+chief+movements+of+Sensualism%2C+especially+in+our+own+age.%E2%80%9D%0A%0A%E2%80%94+Robert+L.+Dabney%2C+The+Sensualistic+Philosophy+of+the+Nineteenth+Century%2C+Considered%2C+%28New+York%3A+Anson+D.+F.+Randolph+%26+Company%2C+1875%29%2C+pp+1%2C+2-3.&amp;url=https%3A%2F%2F5solasquotes.github.io%2Fquote%2Fc99f9d01df.html&amp;via=5Solas" target="_blank" rel="noopener">Share on X</a><a class="perma" href="../quote/c99f9d01df.html">Permalink</a><a class="src" href="https://reformedcovenanter.wordpress.com/2020/04/20/robert-lewis-dabney-sensualistic-philosophy-defined/" rel="noopener" target="_blank">Read it online · Reformed Covenanter</a></div>

<main class="wrap"><figure class="quote" id="q-bfb2c03381" data-kw="">
<blockquote><p>From all that has been said we can readily arrive at the following definition of faith: Faith is a heartfelt trust in Christ—and through Him in God—in order to be justified, sanctified, and glorified, leaning upon Christ&#x27;s voluntary offer of Himself and upon His promises that He will perform this to all who receive Him and rely upon Him to that end.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/wilhelmus-a-brakel.html">Wilhelmus à Brakel</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Christian’s Reasonable Service</cite>, vol. 2, ch. 32</span></figcaption>

</figure><figure class="quote" id="q-199882bcc3" data-kw="faith response to call">
<blockquote><p>For as God calls by his word and offers the promise of grace, thus man responds by faith and receives and applies to himself the offered promise. The Scriptures often introduce this colloquy: “I will say, It is my people; and they shall say, The Lord is my God” (Hos. 2:23; Zech. 13:9; cf. Ps. 27:8; Jer. 3:22; Rom. 8:15, 16).</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/francis-turretin.html">Francis Turretin</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Institutes of Elenctic Theology</cite>, 15.7.1</span></figcaption>

— Francis Turretin, Institutes of Elenctic Theology, 15.7.1">Copy</button><a class="share" href="https://x.com/intent/post?text=%E2%80%9CFor%20as%20God%20calls%20by%20his%20word%20and%20offers%20the%20promise%20of%20grace%2C%20thus%20man%20responds%20by%20faith%20and%20receives%20and%20applies%20to%20himself%20the%20offered%20promise.%20The%20Scriptures%20often%20introduce%20this%20colloquy%3A%20%E2%80%9CI%20will%20say%2C%20It%20is%20my%20people%3B%20and%20they%20shall%20say%2C%20The%20Lord%20is%20my%20God%E2%80%9D%20%28Hos.%202%3A23%3B%20Zech.%2013%3A9%3B%20cf.%20Ps.%2027%3A8%3B%20Jer.%203%3A22%3B%20Rom.%208%3A15%2C%2016%29.%E2%80%9D%0A%0A%E2%80%94%20Francis%20Turretin%2C%20Institutes%20of%20Elenctic%20Theology%2C%2015.7.1&amp;url=https%3A%2F%2F5solasquotes.github.io%2Fquote%2F199882bcc3.html&amp;via=5Solas" target="_blank" rel="noopener">Share on X</a><a class="perma" href="../quote/199882bcc3.html">Permalink</a><span class="src none">No free online copy linked</span></div>
</figure><figure class="quote" id="q-209fbb2df4" data-kw="">
<blockquote><p>To doubt the love, the wisdom, and the faithfulness of God; to doubt the perfection of the work of Christ; to doubt the operation of the Spirit on the heart, what can tend more to the weakening and decay of this precious and costly grace? Every time the soul sinks under the pressure of a doubt of its interest in Christ, the effect must be a weakening of the soul&#x27;s view of the glory, perfection, and all-sufficiency of Christ&#x27;s work. But imperfectly may the doubting Christian be aware what dishonor is done to Jesus, what reflection is cast upon his great work, by every unbelieving fear he cherishes.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/octavius-winslow.html">Octavius Winslow</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Personal Declension and Revival of Religion in the Soul</cite>, p. 74</span></figcaption>

<blockquote><p>27. Yet the Scripture is not so tied to those first tongues, but that it may and ought also to be translated into other tongues, for the common use of the Church.

28. But among interpreters, neither, those seventy, who turned it into Greek, nor Heirome [Jerome], nor any such like did perform the office of a Prophet, so that he should be free from errors in interpreting.

29. Hence no persons are absolutely authenticall, but so far forth only as they do express the fountains, by which also they are to be tried.

30. Neither is there any authority in Earth whereby any version may be made simply authenticall.

31. Hence the providence of GOD in preserving the Fountains, hath been always famous, and to be adored, not only that they did not wholly perish, but also that they should not be maimed by the loss of any book, or deformed by any grievous fault, when in the mean while there is no one of the ancient versions that remains whole.

32. Nevertheless, from those human versions there may be all those things perceived which are absolutely necessary, if so be they agree with the fountains in essential parts, as all those versions that are received in the Churches are wont to do, although they differ, and are defective in the smaller things not a few.

33. Neither therefore must we always rest in any version that is received: but we must most religiously provide, that the most pure and faultless interpretation be put upon the Church.</p></blockquote>

— Augustine of Hippo, A Work on the Proceedings of Pelagius, (417), 15 in NPNF1, 5: 189.">Copy</button><a class="share" href="https://x.com/intent/post?text=%E2%80%9CHe+therefore+does+injury+to+the+scripture+of+the+Old+Testament+with+heretical+impiety%2C+who+with+an+impious+and+sacrilegious+face+denies+that+it+was+inspired+by+the+good%2C+supreme%2C+and+very+good+God%2C+%E2%80%93+as+Marcion+does%2C+as+Manich%C3%A6us+does%2C+and+other+pests+of+similar+opinions.%E2%80%9D%0A%0A%E2%80%94+Augustine+of+Hippo%2C+A+Work+on+the+Proceedings+of+Pelagius%2C+%28417%29%2C+15+in+NPNF1%2C+5%3A+189.&amp;url=https%3A%2F%2F5solasquotes.github.io%2Fquote%2F621c28a4b2.html&amp;via=5Solas" target="_blank" rel="noopener">Share on X</a><a class="perma" href="../quote/621c28a4b2.html">Permalink</a><a class="src" href="https://reformedcovenanter.wordpress.com/2019/01/29/augustine-of-hippo-on-the-sacrilege-of-denying-the-inspiration-of-the-old-testament/" rel="noopener" target="_blank">Read it online · Reformed Covenanter</a></div>
</figure><figure class="quote" id="q-b298d6ffdd" data-kw="">
<blockquote><p>XXV. This proposition that God can deceive if he will (although he neither will nor can will it), by whatever interpretation softened, is deservedly rejected as crude and dangerous. Yea it is openly repugnant also to the truth delivered in Scripture concerning God. For if God can deceive, he can also lie and sin if he so willed (which is opposed to his most perfect truth and holiness). For a long time, this concept was condemned therefore as blasphemous among the Scholastics.

To deceive another by words, what else is it than to lie or to speak falsely? Therefore if God can deceive by words, he can also lie (which is expressly repugnant to Scripture [Tit. 1:2; Heb. 6:18] and to the nature of God, in which there can be neither ignorance nor error of judgment nor malice nor any such thing from which a lie could take its origin). Yea, if we could say this, I shudder to relate, we could also say that God could be made not God; if God can deceive, he can sin; if he can sin, he can become not God because he who sins (or can sin) is not God. …

Now no one but an atheist will deny that God cannot will to deceive. … If he can deceive, our faith in the Scriptures would always be wavering. If the Scriptures were given by a God who can deceive, how could we persuade an atheist that he had not deceived? To no purpose would you say that he did not will to deceive, for how could he be assured of this?

Not from Scripture (which expressly says this) because he could immediately reply, this was said by that God who can deceive, and how do we know that he has not here given the effect which he is said to be able to give? Not from the nature of God because it is not repugnant to God’s nature to give that effect which he has the power to give. In vain also would you say that it is repugnant to his nature to will to effect it because if it is not repugnant to his nature to be able to perform it, neither will it be repugnant to his nature to be able to will to perform it.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/francis-turretin.html">Francis Turretin</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Institutes of Elenctic Theology</cite>, trans. George M. Giger, ed. James T. Dennison (1679-85; 3 vols, Phillipsburg NJ: Presbyterian &amp; Reformed, 1992), 3.21.25.</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/holy-scripture.html">Holy Scripture</a></span></div>

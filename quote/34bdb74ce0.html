<blockquote><p>Hence although love considered affectively and on the part of the internal act is equal in God (because it does not admit of increase and diminution), yet regarded effectively (or on the part of the good which He wills to anyone) it is unequal because some effects of love are greater than others.</p></blockquote>

<blockquote><p>Inasmuch, moreover, as the divine affections are understood as descriptive of God’s movement or egress toward the finite order, they are not only to be understood as communicable attributes par excellence, they are also attributes defined primarily in their relationship to finite objects. It is by these affectiones or virtues that God sustains his relations with creatures–they are the preeminent example of the so-called communicabilia or relative attributes. (Mastricht, Theoretic-practica theologia, II.xv.19) In attempting to define the issue still more precisely, Owen distinguished between ‘attributes of Deity which, in order to their exercise, require no determined object antecedent to their agress’ and ‘attributes which can in no wise have an egress or be exercised without an object predetermined, and, as it were, by some circumstances prepared for them.’ (Owen, Dissertation of the Divine Justice, in Works, X, p. 508) The affections fall, clearly, into the latter category, the virtues into the former.</p></blockquote>

<blockquote><p>[4] Having proved that these relations have no real existence in God, and yet are predicated of Him, it follows that they are attributed to Him solely in accordance with our manner of understanding, from the fact that other things are referred to Him. For in understanding one thing to be referred to another, our intellect simultaneously grasps the relation of the latter to it, although sometimes that thing is not really related. [5] And so it is evident, also, that such relations are not said of God in the same way as other things predicated of Him. For all other things, such as wisdom and will, express His essence; the aforesaid relations by no means do so really, but only as regards our way of understanding. Nevertheless, our understanding is not fallacious. For, from the very fact that our intellect understands that the relations of the divine effects are terminated in God Himself, it predicates certain things of Him relatively; so also do we understand and express the knowable relatively, from the fact that knowledge is referred to it.</p></blockquote>

<blockquote><p>It is impossible for an effect to be stronger than its cause. Now every hatred arises from some love as its cause… Therefore it is impossible for hatred to be stronger than love absolutely. But furthermore, love must needs be, absolutely speaking, stronger than hatred. Because a thing is moved to the end more strongly than to the means.</p></blockquote>

</figure><figure class="quote" id="q-05df01efa5" data-kw="">
<blockquote><p>We may be reminded that the [Westminster] Confession declares God to be ‘without passions.’ So the theologians tell us that we must ascribe to Him no ‘passive powers’; for then He would not be immutable. He acts on everything, but is acted on by none. He is the source, but not the recipient of effects. This is indisputable. But we should not so overstrain the truth as to reject two other truths. One is, that while God has no passions, while He has no mere susceptibility such that his creature can cause an effect upon it irrespective to God’s own will and freedom, yet He has active principles. These are not passions, in the sense of fluctuations or agitations, but none the less are they affections of his will, actively distinguished from the cognitions in his intelligence. They are true optative functions of the divine Spirit. However anthropopathic may be the statements made concerning God’s repentings, wrath, pity, pleasure, love, jealousy, hatred, in the Scriptures, we should do violence to them if we denied that He here meant to ascribe to Himself active affections in some mode suitable to his nature. And it is impossible for us to suppose an agent without active principles, as well as cognitive, as we could not believe that the compass could move the ship without any motive power. The other truth is, that objective beings and events are the real occasions, though not efficient causes, of the action both of the divine affections and will. Are not many divines so much afraid of ascribing to God any ‘passive powers,’ or any phase of dependence on the creature, that they hesitate even to admit that scriptural fact? But why should they recoil from the simple statements of his Word on this point, unless they were confused or misled by the old sensualistic view, which regarded the objective impression as somehow the efficient, instead of the mere occasion, of the following activities of the percipient soul: “God is angry with the wicked every day” (Ps. 7:11); “But the thing that David had done displeased the Lord;” “My delight is in her” (Is. 62:4); “In these things I delight, saith the Lord” (Jer. 9:24). Is all this so anthropopathic as not even to mean that God’s active principles here have an objective? Why not let the Scriptures mean what they so plainly strive to declare? But some seem so afraid of recognizing in God any susceptibility of a passive nature that they virtually set Scripture aside, and paint a God whose whole activities of intelligence and will are so exclusively from Himself that even the relation of objective occasion to Him is made unreal, and no other is allowed than a species of coincidence or preëstablished harmony. They are chary of conceding (what the Bible seems so plainly to say) that God is angry because men sin; and would go no farther than to admit that somehow He is angry when men sin, yet, because absolutely independent, angry only of Himself.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/r-l-dabney.html">R. L. Dabney</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Discussions, vol 1, ‘God’s Indiscriminate Proposals of Mercy’</cite></span></figcaption>

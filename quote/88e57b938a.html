<main class="wrap"><figure class="quote" id="q-88e57b938a" data-kw="">
<blockquote><p>BEING minded, through the help of God, for mine own comfort and encouraging of others, to speak something of Death (at whose doors though I have stand a great while, yet never so near, to man’s judgement, as I do now) I think it most requisite to call &amp; cry for thy help, Oh blessed saviour Jesus Christ, which hast destroyed death by thy death, &amp; brought in place thereof, life and immortality, as by the gospel it appereath: grant to me true &amp; lively faith, wherethrough men pass from death to eternal life, that of practise and not of naked speculation, I may something write concerning death (which is dreadful out of thee &amp; in it self) to the glory of thy holy name, to mine own comfort in thee, and to the edifying of all them, to whom this writing shall come, to be read or heard. Amen.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/john-bradford.html">John Bradford</a></span><span class="wk"><span class="lbl">Work:</span> <cite>A fruitful treatise and full of heavenly consolation against the fear of death. Whereunto are annexed certain sweet meditations of the kingdom of Christ, of life everlasting, and of the blessed state &amp; felicity of the same</cite>, (London: William Powell, 1564), unpaginated.</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/prayer.html">Prayer</a></span></div>

</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-9ae95d3b37" data-kw="Mary Mediator Invocation of saints">
<blockquote><p>However, we cannot in any way acknowledge or accept what our opponents openly say, namely that Mary is to be invoked as a mediator between God and humans, or that she is our patron and advocate. We do not believe that this is either a tradition of Holy Scripture or a command from God. We believe that God, who alone grants all salvation for the present and future, is the one to be invoked alone. We believe that Christ alone [since He alone is true God and true man] is the true mediator between God and humans. We believe that He, who alone can satisfy all humans, is the patron and advocate with the Father.</p></blockquote>

</figure><figure class="quote" id="q-4aa74a5e2c" data-kw="Spirit of grace and of supplications">
<blockquote><p>The Spirit promised here is the Spirit of God, &#x27;the Holy Spirit,&#x27; with respect to the special end for which he is promised. And the manner of his administration, in the accomplishment of the promise, is expressed by, &#x27;I will pour out.&#x27; The same word is used for the same purpose in Eze 39.29, and Joel 2.28, as other words of the same importance are also, which we render &#x27;pouring out,&#x27; such as Pro 1.23; Isa 32.15, 44.3, 52.15. … What is intended in this, is a plentiful dispensation of him to the end for which he is promised, with respect to a singular and eminent degree in his operations. The apostle expresses this word, or the accomplishment of what is promised in it, by Tit 3.6, &#x27;he has richly&#x27; or abundantly &#x27;poured out his Spirit.&#x27; Therefore, what is intended is not a mere grant and communication of the Spirit, but a plentiful effusion of him; which must have some eminent effects as pledges and tokens of this.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/john-owen.html">John Owen</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Work of the Holy Spirit in Prayer</cite></span></figcaption>

</figure><figure class="quote" id="q-5e7af8bda4" data-kw="">
<blockquote><p>Fenner’s style is fervent and emphatic. Fittingly, repetition and parallel construction, which lend themselves well to this sort of address, are frequent and noticeable. In addition, Fenner makes abundant use of examples and illustrations to make certain complicated points clear and memorable for his audience. These illustrations, which derive from sources as diverse as (for example) Aesop’s tales, Scriptural narratives, the church fathers, and the natural world, are in addition to his main prose narrative exhortation. Further, he employs specific Scripture passages from which he draws his doctrine and practice, and makes frequent use of lists.” – Amy Gant ‘The Second Sermon of the Use &amp; Benefit of Divine Meditation’ (1665) Bridge, William ‘The Sweetness &amp; Profitableness of Divine Meditation Buy (1667) 19 pp. p. 124 of volume three of his works, a sermon on Ps. 104:34, “My meditation of him shall be sweet: I will be glad in the Lord</p></blockquote>

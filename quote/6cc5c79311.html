<main class="wrap"><figure class="quote" id="q-6cc5c79311" data-kw="">
<blockquote><p>XIV. The efficacy of this instrument, and its entire power in producing the effect, depends on the Holy Spirit and his interior operation in the soul (Acts 16:14). It gives to this vocation its formal character, by which it is distinguished from that general call which is common even to the reprobate, so much so that if the Spirit of God did nothing more here than there, it would not be efficacious, but would be vain for salvation (2 Pet. 1:3). XV. Just as, on the contrary, if He should operate here as He is accustomed to do in the conversion of the elect (for even in the reprobate He is often efficacious in some manner and degree) (Mt. 13:20), the effect would necessarily exist, and the man would necessarily be brought to obedience and to a new life in Christ (Jn. 6:44-45).</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/anthony-walaeus.html">Anthony Walaeus</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Theological Theses on the Efficacious Vocation of the Sinner to Salvation trans. AI (Leiden: Marcus, 1620)</cite>, pp. 3-4</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/effectual-calling/common-grace.html">Common Grace</a></span></div>

</figure><figure class="quote" id="q-710314ac0a" data-kw="">

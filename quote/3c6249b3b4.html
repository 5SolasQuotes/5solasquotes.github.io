<main class="wrap"><figure class="quote" id="q-3c6249b3b4" data-kw="">
<blockquote><p>If we more firmly believed that God, according to His covenant for His Son’s sake, has pardoned sin and will heal our souls of their distempers and will give grace sufficient and make us to grow and increase with the increases of God verily His promises would appear to be real, and according to our faith it would be to us. …

There are many reasons why the God whom believers pray to should answer them: 1.) They are His chosen ones. God pitched His love on them before the foundation of the world was laid. 2.) They are His Son’s purchase. He has brought them with a price, shed His blood for the remission of their sins, given His life for their ransom. 3.) They are in covenant with God. He has engaged to be their God, and surely He will be their guard also. 4.) They are vessels of mercy, in whom He deigns to glorify His grace and love for ever. Surely, then, He will heed these when they pray; He will give them the good they need, and save them from the evil which makes them fly to Him for shelter. I have done with the first doctrine, that a Christian’s security lies very much in praying always.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/nathanael-vincent.html">Nathanael Vincent</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Spirit of Prayer</cite>, (1677) in Don Kistler (ed.), The Puritans on Prayer (Morgan PA: Soli Deo Gloria, 1995), pp 142, 162.</span></figcaption>

<blockquote><p>The term “covenant” indeed, as a rendering for berith, is not entirely felicitous, and thus it is of vital importance that our usage of “covenantal” be informed by reflection on the Biblical point of view. Because of its usage in describing purely human relationships, as in the Wilsonian “open covenants of peace openly arrived at,” the term readily brings to mind the notion of a bilateral agreement, and perhaps even that of a contract between two independent parties. While there is, in truth, an element of mutuality in the theological berith in the sense that the covenantal relationship of personal fellowship between God and his people is conspicuously in view, it is necessary to insist that even more fundamentally the covenant between God and his people is primarily a unilateral arrangement initiated and effected by God himself. The Biblical perspective in this regard comes to accurate expression in Hebrews 8:6 in the reference to the enactment of a better covenant.

In the foreground, accordingly, is the fact of the sovereign action of God in establishing and bringing to concrete realization an arrangement or administration or “covenant” of grace. This accent upon sovereign grace comes to expression in the words which most simply sum up the approach of the God of the covenant: “I will be your God and ye shall be my people.” These same words, indeed, are unspeakably rich in their expression of the privilege of fellowship between God and his people. And they carry with them profound implications with regard to religious and ethical obligation on the part of the men who become members of the covenant. It remains true, nevertheless, that the emphasis falls first of all upon the action of sovereign, efficacious grace. In thus graciously drawing near unto man for his salvation God makes himself known to man, and thus the covenant of grace is at one and the same time redemptive and revelatory.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/ned-b-stonehouse.html">Ned B. Stonehouse</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Special Revelation as Scriptural in Carl F.H. Henry (ed.), Revelation and the Bible: Contemporary Evangelical Thought</cite></span></figcaption>
<div class="meta"><span class="t"><a href="../topics/the-covenant-of-grace.html">The Covenant of Grace</a></span></div>

<blockquote><p>It would bring to remembrance the horror of our crimes and set us a blushing before Him when we should consider the multitude of his benefits and our unworthy behavior that has not constrained Him, even against the inclination of his goodness to punish us.</p></blockquote>

</figure><figure class="quote" id="q-c333ab4adf" data-kw="">
<blockquote><p>This may be a sad meditation to us, to stand and look back to our former estate, and compare it with that into which we are fallen. That image we spoke of, is defaced and blotted out, which was the glory of the creation; and now there is nothing so monstrous, so deformed in the world as man. The corruption of the best things is always worst; the ruins of the most noble creature are most ruinous; the spot of the soul most abominable.

We are nothing but a mass of darkness, ignorance, error, inordinate lust; nothing but confusion, disorder, and distempers in the soul, and in the conversation of men; and, in sum, that blessed bond of friendship with God broken, discord and enmity entered upon our side and separated us from God, and so we can expect nothing from that first covenant but the curse and wrath threatened. “By one man’s disobedience” sin entered upon all, ‘and death by sin;’ because in that agreement Adam was a common person representing us, and thus are all men once subject to God’s judgment, and come short of the glory of God, fallen from life into a state of death, and, for any thing that could be expected, irrecoverably.

But it hath pleased the Lord, in his infinite mercy, to make a better covenant in Christ his Son, that, what was impossible to the law, by reason of our weakness and wickedness, his Son, sent in the flesh, condemned for sin, might accomplish, Rom. 8.3. There is some comfort yet after this; that covenant was not the last, and that sentence was not irrevocable. He makes a new transaction, lays the iniquity of his elect upon Christ, and puts the curse upon his shoulders which was due to them. Justice cannot admit the abrogation of the law, but mercy pleads for a temperament of it. And thus the Lord dispenses with personal satisfaction, which in rigour he might have craved; and finds out a ransom, admits another satisfaction in their name.

And in the name of that Cautioner and Redeemer is salvation preached upon better terms: Believe and thou shalt be saved, Rom. 10.9. Thou lost and undone sinner, whoever thou art, that findest thyself guilty before God, and that thou canst not stand in judgment by the former covenant,—thou who hast no personal righteousness, and trustest in none,—come here, embrace the righteousness of thy Cautioner,—receive him, and rest on him, and thou shalt be saved.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/hugh-binning.html">Hugh Binning</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Common Principles of the Christian Religion, Clearly Proved, and Singularly Improved. Or, A Practical Catechism</cite>, (1672) in The Works of Hugh Binning, ed. James Cochrane (3 vols, Edinburgh: William Whyte, 1839), i, 234-35.</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/the-covenant-of-grace.html">The Covenant of Grace</a></span></div>

<blockquote><p>XX. The will of sign which is set forth as extrinsic ought to correspond with some internal will in God that it may not be false and deceptive; but that internal will is not the decree concerning the gift of salvation to this or that one, but the decree concerning the command of faith and promise of salvation if the man does believe (which is founded both upon the connection established by God between faith and salvation and the internal disposition of God by which, as He loves Himself, He cannot but love his image wherever He sees it shining and is so much pleased with the faith and repentance of the creature as to grant it salvation).</p></blockquote>

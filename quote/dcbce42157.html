<main class="wrap"><figure class="quote" id="q-dcbce42157" data-kw="">
<blockquote><p>If Christ died for each and every person, then he even died for those who were already at that time in hell, as Esau, Saul, Ahitophel, and even for those also whom he certainly knew would be going there. But, [he did not die] for those who were already at that time in hell, because there is no liberation from hell (Luke 16); Nor also for those whom he certainly knew would be going there, seeing that all those to be damned will have the same condition (excepting the gradation of penalties, which is disparate). Therefore, Christ did not die for each and every person.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/johann-heinrich-alting.html">Johann Heinrich Alting</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Exegesis Logica et Theologica Augustanae Confessionis</cite>, (Amsterdam: Johannes Janssonius, 1652), pp 134-35. Quoted in Michael J. Lynch, John Davenant’s Hypothetical Universalism: A Defense of Catholic and Reformed Orthodoxy (New York: Oxford University Press, 2021), p. 111.</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/priestly-office-satisfaction-and-atonement/extent-of-the-atonement.html">Extent of the Atonement</a></span></div>

</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-fdbda0e0cc" data-kw="">
<blockquote><p>2. To die for all, and to be given for all, must in some places [in Scripture, such as 1 Tim. 2:4-6; 4:10; Heb. 2:9; 2 Cor. 5:14-15; Tit. 2:11] respect the sufficiency of the dignity in the death of Christ, but not always the efficacy of his death in the virtual extent of it, which none that I have read will maintain in this point of Christ’s dying for all.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/obadiah-sedgwick.html">Obadiah Sedgwick</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Bowels of Tender Mercy Sealed</cite>, ... (London: Motershed, 1661), pt. 1, ch. 7, The Covenant of Grace considered in Relation to Christ the Mediator, sect. 8, Whether Jesus Christ as Mediator died for all and every man?, p. 304</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/priestly-office-satisfaction-and-atonement/extent-of-the-atonement.html">Extent of the Atonement</a></span></div>
<div class="actions"><button class="copy" data-copy="“2. To die for all, and to be given for all, must in some places [in Scripture, such as 1 Tim. 2:4-6; 4:10; Heb. 2:9; 2 Cor. 5:14-15; Tit. 2:11] respect the sufficiency of the dignity in the death of Christ, but not always the efficacy of his death in the virtual extent of it, which none that I have read will maintain in this point of Christ’s dying for all.”

— Obadiah Sedgwick, The Bowels of Tender Mercy Sealed, ... (London: Motershed, 1661), pt. 1, ch. 7, The Covenant of Grace considered in Relation to Christ the Mediator, sect. 8, Whether Jesus Christ as Mediator died for all and every man?, p. 304">Copy</button><a class="share" href="https://x.com/intent/post?text=%E2%80%9C2.+To+die+for+all%2C+and+to+be+given+for+all%2C+must+in+some+places+%5Bin+Scripture%2C+such+as+1+Tim.+2%3A4-6%3B+4%3A10%3B+Heb.+2%3A9%3B+2+Cor.+5%3A14-15%3B+Tit.+2%3A11%5D+respect+the+sufficiency+of+the+dignity+in+the+death+of+Christ%2C+but+not+always+the+efficacy+of+his+death+in+the+virtual+extent+of+it%2C+which+none+that+I+have+read+will+maintain+in+this+point+of+Christ%E2%80%99s+dying+for+all.%E2%80%9D%0A%0A%E2%80%94+Obadiah+Sedgwick%2C+The+Bowels+of+Tender+Mercy+Sealed%2C+...+%28London%3A+Motershed%2C+1661%29%2C+pt.+1%2C+ch.+7%2C+The+Covenant+of+Grace+considered+in+Relation+to+Christ+the+Mediator%2C+sect.+8%2C+Whether+Jesus+Christ+as+Mediator+died+for+all+and+every+man%3F%2C+p.+304&amp;url=https%3A%2F%2F5solasquotes.github.io%2Fquote%2Ffdbda0e0cc.html&amp;via=5Solas" target="_blank" rel="noopener">Share on X</a><a class="perma" href="../quote/fdbda0e0cc.html">Permalink</a><a class="src" href="https://reformedbooksonline.com/on-the-sufficiency-of-the-atonement/#:~:text=2.%20To%20die%20for%20all%2C%20and,point%20of%20Christ%E2%80%99s%20dying%20for%20all&amp;text=2.%20To%20die%20for%20all%2C%20and%20to%20be&amp;text=in%20this%20point%20of%20Christ%E2%80%99s%20dying%20for%20all" rel="noopener" target="_blank">Read it online · Reformed Books Online</a></div>
</figure><figure class="quote" id="q-d3db059f0b" data-kw="">
<blockquote><p>The motive (so to speak) of God in sending his Son is not, as this theory assumes, general benevolence or that love of which all men are equally the objects, but that peculiar, mysterious, infinite love in which God, in giving his Son, gives Himself and all conceivable and possible good.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/charles-hodge.html">Charles Hodge</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Systematic Theology</cite>, vol. 2, pt. 3, ch. 1, “The Plan of Salvation,” § 4, “Hypothetical Redemption”</span></figcaption>

</figure><figure class="quote" id="q-2a4490c1ea" data-kw="">
<blockquote><p>It follows from this view that, as the atonement of Christ was, in itself, sufficient, had God so pleased, to ground the salvation of all men, it is sufficient to ground the universal offer of salvation. Men are invited to stand on a platform which is broad enough to hold them all, to rest upon a foundation which is strong enough to support them all, to partake of provisions which are abundant enough to supply them all. When, therefore, God invites all men to seek salvation in Christ, He is not insincere in offering them a platform too narrow to hold them, a foundation too weak to sustain them, provisions too meagre to supply them. Were they all to accept the invitation, they would all be saved. So much for the intrinsic sufficiency of the remedy for human sin and misery. So far the Calvinist is not chargeable with representing God as insincere in the matter of the gospel offer. It will be urged, however, that notwithstanding his admission of the absence of limitation, as to the intrinsic sufficiency of the atonement, the difficulty remains in view of his doctrine that there is limitation, as to its extrinsic design and application. It was not rendered for all, it is not intended to be effectually applied to all…</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/john-l-girardeau.html">John L. Girardeau</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Calvinism &amp; Evangelical Arminianism, pt. 1</cite>, Section 3, Objections [to Election and Reprobation] from the Moral Attributes of God Answered; 4. Objection from Divine Veracity, pp. 359-93</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/priestly-office-satisfaction-and-atonement/extent-of-the-atonement.html">Extent of the Atonement</a></span></div>

<blockquote><p>At the end of the 17th century, in the so-called Third Antinomian Controversy English and Dutch Reformed theologians discussed the concept of imputation in its interrelationship with forgiveness, punishment, and justice… these same themes had already been extensively discussed in the preceding century in the context of debates against Socinianism, the Antinomian Controversy is framed within an interconfessional and international context, highlighting the significance of Socinians and Hugo Grotius.</p></blockquote>

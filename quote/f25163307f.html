<main class="wrap"><figure class="quote" id="q-f25163307f" data-kw="">
<blockquote><p>Now he says not, because they received not the truth, but he says, because they received not the love of the truth There are many will seem to receive the truth, and who will take heed to the Gospel so diligently as they? And therefore the first thing that men should take heed to, is the heart, look if in the hart there be an unfeigned love of God and his truth. It is not thy ear in hearing of the word, nor thy mouth in speaking well of it that will make thee a good receiver of the truth, but it is the heart.

Look there be an unfeigned love to the truth, in it, and then hold up thy ear, and it will sink in so sweetly in thy soul that thou shalt feed on it so joyfully as no tongue neither of man nor Angel can tell. It is not the outward profession nor the outward receiving (if thou should sit a thousand years hearing) that will bring thee to life: First thou must have heart and soul disposed inwardly with an unfeigned love to God, to Jesus Christ and his Gospel, and then Heaven and earth shall got together ere thou perish.

An heart that loves Christ and this light shall never perish: on the other part, all the outward form of doing, the protestation, subscription and the rest of these outward things shall not save thee in the day of the Lord, if there be not a piece of this love in thy heart. And so I end with this word, accursed be he that loves not Jesus Christ and his truth. And by the contrary blessed are they that loves Jesus Christ and his truth, even this word preached by this bare ministry, and blessed shall they before ever. To this Christ with the Father and the holy Spirit be all praise for ever. AMEN.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/robert-rollock.html">Robert Rollock</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Lectures upon the first and second Epistles of Paul to the Thessalonians</cite>, (Edinburgh: Robert Charteris, 1606), Part II, p. 88.</span></figcaption>

</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-eac67bac82" data-kw="">
<blockquote><p>And here is the instrument which Christ makes use of for the drawing of his elect to Himself: the preaching, plain and simple preaching of the Gospel, seemingly a weak and unlikely instrument; thence called the foolishness of preaching (1 Cor. 1:21); Yet by this weak means does Christ effect this great work: Hereby drawing men out of darkness from under the power of Satan. Paul was sent to the gentiles (Acts 26:18) to turn them from darkness to light, and from the power of Satan to God: But how was he to do it? Why, by preaching of the Gospel, by bearing the name of Christ before them (Acts 9:15), hereby drawing them out of the world as fishes out of the sea; hereby drawing them out of themselves, convincing them of their insufficiency and Christs all sufficiency; and so drawing them to Himself; first as to a Savior to believe on Him, working faith in them by this means, ‘Faith comes by hearing, hearing the Word, the word of the Gospel (Rom. 10): Then as to a Lord, to be governed by Him, which is also wrought by the same instrument. (2 Cor. 12:4-5) Here is the outward means, but this often proves ineffectual. Many there are who hear the Word, and hear it powerfully dispensed, who yet are never the better for it; so says the apostle of the Jews: The Word preached did not profit them, not being mixed with faith in them that heard it, Heb. 4:2. And so ineffectual it often proves to many that sit under the sound of it: They are not thereby brought home to Christ. Even as many of the Jews saw Christ lift up, beheld Him crucified, who yet believed not on Him, nay thereby they were hardened-against Him. Even so it is now in the preaching of the Gospel: Many there are before whose eyes Christ is lift up, crucified in the Word and sacraments, who yet are not brought to believe on Him or submit unto Him. 2. To this therefore (in the second place) is joined the Spirit, the Spirit of Christ which He sends forth to accompany his Word and to make it effectual in the hearts of his elect; and by this means He draws men effectually;</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/john-brinsley.html">John Brinsley</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Mystical Brasen Serpent</cite>, ... (London: Maxey, 1653), ‘The Magnetic Virtue of the Cross of Jesus Christ’, pp. 174-75</span></figcaption>

<blockquote><p>God’s kingdom is two-fold; General, and Special. God’s general kingdom, is his absolute power and sovereignty, whereby he ruleth all things in heaven, in earth, and in hell, even the devils themselves: Psal. 103. 19. The Lord hath prepared his throne in heaven, his kingdom ruleth over all: and this we acknowledge in the end of this prayer, For thine is the kingdom. Now this we pray not for, because it is always every where, no creature can hinder it, no not all the devils in hell; for every creature is subject hereunto, and can do nothing but that which God either willeth or permitteth: according to his will he worketh in the army of heaven, and in the inhabitants of the earth; and none can stay his hand, nor say unto him, what doest thou?

God’s special kingdom, is that, whereby he ruleth his elect and chosen people, working his will not only by them, as he doth in his general kingdom, by the devils themselves; but in them also, by his holy spirit: and it is called special, because it is not exercised over all the world, but only over the elect, whom he hath ordained to eternal life.

This special kingdom of God is two-fold; either of Grace, or of Glory: The kingdom of grace, is a spiritual estate, wherein God makes men willingly subiect to his written word, by his spirit. I call the kingdom of grace, a spiritual estate, both because it is principally exercised in the conscience, and also because this regiment in the conscience, is by the spirit of God. Secondly, I shew wherein it consists; namely, in a voluntary subjection of the whole man in soul, and body, and spirit, to the will of God, revealed in the word: Psalm. 110. 3. Thy people shall come willingly in the day of assembling thine army, in holy beauty. And this subjection stands in three things; in Righteousness, Peace, and Joy in the holy Ghost, Rom. 14. 17, 18.

In Righteousness, that is, First, in Christ’s righteousness imputed; and secondly, in the righteousness of a good conscience, the ground whereof, is sanctification by the spirit, which Christ gives to them, whom he doth justify. In Peace, that is, peace of conscience towards God, and peace with Gods Church; yea, with all creatures, so far forth as is needful for them. Now under peace, we must comprehend love, and all duties of love; for as righteousness concerns the person in soul and body, so peace respects all duties and actions of the life: Righteousness is the root, from whence springeth this peace, with every action thereof; for when the heart is sanctified, the life is reformed.

Lastly, in joy in the holy Ghost: this is a fruit of both the former, respecting especially the state of affliction; for when a man is justified and sanctified, and hath peace towards God, then ariseth in his heart a spiritual delight in God, in all estates: yea, though great afflictions light upon him for God’s cause, yet he beareth them with inward joy and delight, knowing that the spirit of glory, &amp; of God, resteth upon him, and that he shall be glorified with Christ, if he suffer with Christ: which things, while he compareth together, he little esteemeth the afflictions of this life, in respect of the glory that shall be revealed; for the light affliction that is but for a moment, causeth unto us a far more excellent and eternal weight of glory. These are the branches of this spiritual subjection, which whosoever hath, is a good subject in the kingdom of grace; as the Apostle saith in the next verse, he that in these things serveth Christ, is acceptable unto God, and approved of men.

The kingdom of glory, is the blessed estate of God’s elect in heaven, whereby God in Christ becomes all things unto them immediately, 1. Cor. 15. 28. This estate of glory is a subjection also, but yet such a subjection, as is indeed a glorious regiment; for there we reign with Christ, in whom, and through whom, God himself becomes honour, peace, health, food, raiment, and all things needful to the perfection of felicity. Now these two being God’s kingdom, differ thus; The state of grace is the beginning and entrance to the state of glory; and the state of glory is the perfection of the state of grace. This state of glory is the city; and the state of grace, as it were, the suburbs of it. In this life, we live in the kingdom of grace; but the kingdom of glory, is reserved for the life to come: and this special kingdom of God in both these estates, doe we here pray for.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/william-perkins.html">William Perkins</a></span><span class="wk"><span class="lbl">Work:</span> <cite>A godly and learned exposition of Christ’s Sermon in the Mount</cite>, (Cambridge: University of Cambridge, 1608), pp 267-69.</span></figcaption>

— William Perkins, A godly and learned exposition of Christ’s Sermon in the Mount, (Cambridge: University of Cambridge, 1608), pp 267-69.">Copy</button><a class="share" href="https://x.com/intent/post?text=%E2%80%9CGod%E2%80%99s+kingdom+is+two-fold%3B+General%2C+and+Special.+God%E2%80%99s+general+kingdom%2C+is+his+absolute+power+and+sovereignty%2C+whereby+he+ruleth+all+things+in+heaven%2C+in+earth%2C+and+in+hell%2C+even+the+devils+themselves%3A+Psal.+103.+19.+The+Lord+hath+prepared+his+throne+in+heaven%2C+his+kingdom+ruleth+over+all%3A+and+this+we+acknowledge+in+the+end+of+this+prayer%2C+For+thine+is+the+kingdom.+Now+this+we+pray+not+for%2C+because+it+is+always+every+where%2C+no+creature+can+hinder+it%2C+no+not+all+the+devils+in+hell%3B+for+every+creature+is+subject+hereunto%2C+and+can+do+nothing+but+that+which+God+either+willeth+or+permitteth%3A+according+to+his+will+he+worketh+in+the+army+of+heaven%2C+and+in+the+inhabitants+of+the+earth%3B+and+none+can+stay+his+hand%2C+nor+say+unto+him%2C+what+doest+thou%3F%0A%0AGod%E2%80%99s+special+kingdom%2C+is+that%2C+whereby+he+ruleth+his+elect+and+chosen+people%2C+working+his+will+not+only+by+them%2C+as+he+doth+in+his+general+kingdom%2C+by+the+devils+themselves%3B+but+in+them+also%2C+by+his+holy+spirit%3A+and+it+is+called+special%2C+because+it+is+not+exercised+over+all+the+world%2C+but+only+over+the+elect%2C+whom+he+hath+ordained+to+eternal+life.%0A%0AThis+special+kingdom+of+God+is+two-fold%3B+either+of+Grace%2C+or+of+Glory%3A+The+kingdom+of+grace%2C+is+a+spiritual+estate%2C+wherein+God+makes+men+willingly+subiect+to+his+written+word%2C+by+his+spirit.+I+call+the+kingdom+of+grace%2C+a+spiritual+estate%2C+both+because+it+is+principally+exercised+in+the+conscience%2C+and+also+because+this+regiment+in+the+conscience%2C+is+by+the+spirit+of+God.+Secondly%2C+I+shew+wherein+it+consists%3B+namely%2C+in+a+voluntary+subjection+of+the+whole+man+in+soul%2C+and+body%2C+and+spirit%2C+to+the+will+of+God%2C+revealed+in+the+word%3A+Psalm.+110.+3.+Thy+people+shall+come+willingly+in+the+day+of+assembling+thine+army%2C+in+holy+beauty.+And+this+subjection+stands+in+three+things%3B+in+Righteousness%2C+Peace%2C+and+Joy+in+the+holy+Ghost%2C+Rom.+14.+17%2C+18.%0A%0AIn+Righteousness%2C+that+is%2C+First%2C+in+Christ%E2%80%99s+righteousness+imputed%3B+and+secondly%2C+in+the+righteousness+of+a+good+conscience%2C+the+ground+whereof%2C+is+sanctification+by+the+spirit%2C+which+Christ+gives+to+them%2C+whom+he+doth+justify.+In+Peace%2C+that+is%2C+peace+of+conscience+towards+God%2C+and+peace+with+Gods+Church%3B+yea%2C+with+all+creatures%2C+so+far+forth+as+is+needful+for+them.+Now+under+peace%2C+we+must+comprehend+love%2C+and+all+duties+of+love%3B+for+as+righteousness+concerns+the+person+in+soul+and+body%2C+so+peace+respects+all+duties+and+actions+of+the+life%3A+Righteousness+is+the+root%2C+from+whence+springeth+this+peace%2C+with+every+action+thereof%3B+for+when+the+heart+is+sanctified%2C+the+life+is+reformed.%0A%0ALastly%2C+in+joy+in+the+holy+Ghost%3A+this+is+a+fruit+of+both+the+former%2C+respecting+especially+the+state+of+affliction%3B+for+when+a+man+is+justified+and+sanctified%2C+and+hath+peace+towards+God%2C+then+ariseth+in+his+heart+a+spiritual+delight+in+God%2C+in+all+estates%3A+yea%2C+though+great+afflictions+light+upon+him+for+God%E2%80%99s+cause%2C+yet+he+beareth+them+with+inward+joy+and+delight%2C+knowing+that+the+spirit+of+glory%2C+%26+of+God%2C+resteth+upon+him%2C+and+that+he+shall+be+glorified+with+Christ%2C+if+he+suffer+with+Christ%3A+which+things%2C+while+he+compareth+together%2C+he+little+esteemeth+the+afflictions+of+this+life%2C+in+respect+of+the+glory+that+shall+be+revealed%3B+for+the+light+affliction+that+is+but+for+a+moment%2C+causeth+unto+us+a+far+more+excellent+and+eternal+weight+of+glory.+These+are+the+branches+of+this+spiritual+subjection%2C+which+whosoever+hath%2C+is+a+good+subject+in+the+kingdom+of+grace%3B+as+the+Apostle+saith+in+the+next+verse%2C+he+that+in+these+things+serveth+Christ%2C+is+acceptable+unto+God%2C+and+approved+of+men.%0A%0AThe+kingdom+of+glory%2C+is+the+blessed+estate+of+God%E2%80%99s+elect+in+heaven%2C+whereby+God+in+Christ+becomes+all+things+unto+them+immediately%2C+1.+Cor.+15.+28.+This+estate+of+glory+is+a+subjection+also%2C+but+yet+such+a+subjection%2C+as+is+indeed+a+glorious+regiment%3B+for+there+we+reign+with+Christ%2C+in+whom%2C+and+through+whom%2C+God+himself+becomes+honour%2C+peace%2C+health%2C+food%2C+raiment%2C+and+all+things+needful+to+the+perfection+of+felicity.+Now+these+two+being+God%E2%80%99s+kingdom%2C+differ+thus%3B+The+state+of+grace+is+the+beginning+and+entrance+to+the+state+of+glory%3B+and+the+state+of+glory+is+the+perfection+of+the+state+of+grace.+This+state+of+glory+is+the+city%3B+and+the+state+of+grace%2C+as+it+were%2C+the+suburbs+of+it.+In+this+life%2C+we+live+in+the+kingdom+of+grace%3B+but+the+kingdom+of+glory%2C+is+reserved+for+the+life+to+come%3A+and+this+special+kingdom+of+God+in+both+these+estates%2C+doe+we+here+pray+for.%E2%80%9D%0A%0A%E2%80%94+William+Perkins%2C+A+godly+and+learned+exposition+of+Christ%E2%80%99s+Sermon+in+the+Mount%2C+%28Cambridge%3A+University+of+Cambridge%2C+1608%29%2C+pp+267-69.&amp;url=https%3A%2F%2F5solasquotes.github.io%2Fquote%2F5a63130abc.html&amp;via=5Solas" target="_blank" rel="noopener">Share on X</a><a class="perma" href="../quote/5a63130abc.html">Permalink</a><a class="src" href="https://reformedcovenanter.wordpress.com/2020/07/01/william-perkins-on-gods-kingdom-of-grace-and-glory/" rel="noopener" target="_blank">Read it online · Reformed Covenanter</a></div>

<blockquote><p>20. ‘Behold, I stand at the door, and knock: if any man hear my voice, and open the door, I will come in to him, and will sup with him, and he with Me.’ 20. I have my time of offering mercy, and desiring you to entertain it: And if any man hear and obey this call, I will come in by my Spirit, and take habitual possession of him, and have spiritual communion with him, and he with Me. Note: Though it be not without the grace of Christ that we open to him when He knocks, and receive his offered special grace, yet, in this, He lays so much on man as to make our opening, that is, our accepting-faith, the condition of his entering for a fixed habitation by habitual love and holiness. On which account divines used to say that faith and repentance, wrought first in conversion, are the conditions or qualifications for consequent justification and sanctification.</p></blockquote>

<blockquote><p>He ‘comes in the name of the Lord to save us–to seek and to save that which was lost; and him that comes unto Him, He will in no wise cast out;’ all day long He stretches out his hands to invite and receive a disobedient and gainsaying people. Now the Master comes! knocks at the door of thy heart, and calls for you… ‘My son, my child, give me your heart.’ Open to Me, your God, your Savior; for my head has been ‘filled with the dew’ of divine wrath, ‘and my locks with the drops’ of fearful affronts ‘for thy sake:’…</p></blockquote>

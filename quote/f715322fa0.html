<main class="wrap"><figure class="quote" id="q-f715322fa0" data-kw="">
<blockquote><p>[T]hat God, for the better settling of piety and honesty among men, and the repressing of prophaneness [sic] and other vices, hath established two distinct powers upon earth: the one of the keys, committed to the Church; the other of the sword, committed to the civil magistrate. That of the keys is ordained to work upon the inner man; having immediate relation to the remitting of sins.That of the sword is appointed to work upon the outward man; yielding protection to the obedient, and inflicting external punishment upon the rebellious and disobedient.

By the former, the spiritual officers of the Church of Christ are enabled to “govern well,” to “speak and exhort” and “rebuke with all authority;” to “loose” such as are penitent, to commit others unto the Lord’s prison, until their amendment, or to bind them over unto the judgment of the great day, if they shall persist in their wilfulness and obstinacy. By the other, princes have an imperious power assigned by God unto them, for the defence of such as do well, and executing “revenge and wrath” upon such as do evil; whether “by death or banishment, or confiscation of goods, or imprisonment,” according to the quality of the offence.

When St Peter, that had the keys committed unto him, made bold to draw the sword, he was commanded to put it up; as a weapon that he had no authority to meddle withal. And on the other side, when Uzziah the king would venture upon the execution of the priest’s office, it was said unto him, “It pertaineth not unto thee Uzziah to burn incense unto the Lord; but to the priests the sons of Aaron, that are consecrated to burn incense.” Let this therefore be our second conclusion: that the powers of the sword and of the keys are two distinct ordinances of God; and that the prince hath no more authority to enter upon the execution of any part of the priest’s function, than the priest hath to intrude upon any part of the office of the prince.</p></blockquote>

</figure><figure class="quote" id="q-70a973b5f5" data-kw="">
<blockquote><p>But it is a question of more moment: How God promises a reward to these sons of Jonadab [who are Rechabites] for obeying the command of their [fore-]father [to dwell in tents and not drink wine], and whether they had sinned if they had not obeyed this command of Jonadab; which brings in another question: Whether parents have a power to oblige their children in matters which God has left at liberty? To which I answer:

1. God might reward these Rechabites for their reverence and obedience to Jonadab their father, though these were not strictly, by the Divine law, obliged thus far to have obeyed him; as He rewarded David for his thoughts in his heart to build him a house, though it was not God’s will that He should do it; so as God’s promise of the reward does not prove their obedience in this particular to have been their duty. Admit that it remained still a matter of liberty, yet the general honour and reverence they testified might be rewarded by God.

2. Unquestionably parents have not a power to determine children in all things as to which God has left them a liberty, for then they have a power to make their children slaves, and to take away all their natural liberty. To marry or not, and to this or that person, is [a] matter of liberty. Parents cannot in this case determine their children; Bethuel, Gen. 24:58, asks Rebekah if she would go with Abraham’s servant before he would send her.

3. In matters of civil concernment they have a far greater power than in matters of religion. All souls are God’s, and conscience can be under no other dominion than that of God.

4. In civil things parents have a great power, during the nonage of children, and after also in matters which concern their parents’ good, as to command them to assist them, to help to supply their necessities, etc.

5. Parents being set over children, and instead of God to them, as it is their duty to advise their children to the best of their ability for their good; so it is the duty of children to receive their advice, and not to depart from it, unless they see circumstances so mistaken by parents, or so altered by the providence of God, as they may reasonably judge their parents, had these known or foreseen it, would not have so advised. But that parents have an absolute power to determine children in all things as to which God has not forbidden them, and that children by the law of God are obliged to an obedience to all such commands, however they may see their parents mistaken, or God by his providence may have altered circumstances, I see no reason to conclude. Jonadab had prudently advised his sons as before mentioned; they were things they might do, and which by experience they found not hurtful to them, but of great profit and advantage, and that with reference to all the ends of man’s life: herein they yield obedience, and pay a reverence to their parent; this pleases God, He promises to reward them with the continuance of their family, according to what He had said, Ex. 20:12, in the Fifth Commandment, which the apostle calls the first commandment with promise.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/matthew-poole.html">Matthew Poole</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Commentary on Jeremiah</cite>, 35, v. 19</span></figcaption>

<blockquote><p>Since, therefore, the name of Father is a sacred one, and is transferred to men by the peculiar goodness of God, the dishonoring of parents redounds to the dishonor of God Himself, nor can any one despise his father without being guilty of an offense against God, (sacrilegium.) If any should object that there are many ungodly and wicked fathers whom their children cannot regard with honor without destroying the distinction between good and evil, the reply is easy, that the perpetual law of nature is not subverted by the sins of men; and therefore, however unworthy of honor a father may be, that he still retains, inasmuch as he is a father, his right over his children, provided it does not in anywise derogate from the judgment of God; for it is too absurd to think of absolving under any pretext the sins which are condemned by His Law; nay, it would be a base profanation to misuse the name of father for the covering of sins. In condemning, therefore, the vices of a father, a truly pious son will subscribe to God’s Law; and still, whatsoever he may be, will acknowledge that he is to be honored, as being the father given him by God. Paul is a faithful interpreter of this Commandment, where he bids “children obey their parents.” (&lt;490601&gt; Ephesians 6:1; &lt;510320&gt; Colossians 3:20.) Honor, therefore, comprises subjection; so that he who shakes off the yoke of his father, and does not allow himself to be governed by his authority, is justly said to despise his father; and it will more clearly appear from other passages, that those who are not obedient to their parents are deemed to despise them. Still, the power of a father is so limited as that God, on whom all relationships depend, should have the rule over fathers as well as children; for parents govern their children only under the supreme authority of God. Paul, therefore, does not simply exhort children to obey their parents, but adds the restriction, “in the Lord;” whereby he indicates that, if a father enjoins anything unrighteous, obedience is freely to be denied him. Immoderate strictness, moroseness, and even cruelty must be born, so long as a mortal man, by wickedly demanding what is not lawful, does not endeavor to rob God of His right. In a word, the Law so subjects children to their parents, as that God’s right may remain uninfringed. …The natural sense itself dictates to us that we should obey rulers. If servants obey not their masters, the society of the human race is subverted altogether. It is not, therefore, the least essential part of righteousness that the people should willingly submit themselves to the command of magistrates, and that servants should obey their masters; and, consequently, it would be very absurd if it were omitted in the Law of God. In this commandment, then, as in the others, God by synecdoche embraces, under a specific rule, a general principle, viz., that lawful commands should obtain due reverence from us. But that all things should not be distinctly expressed, first of all brevity itself readily accounts for; and, besides, another reason is to be noticed, i.e. that God designedly used a homely style in addressing a rude people, because He saw its expediency. If He had said generally, that all superiors were to be obeyed, since, pride is natural to all, it would not have been easy to incline the greater part of men to pay submission to a few. Nay, since subjection is naturally disagreeable, many would have kicked against it. God, therefore, propounds a specific kind of subjection, which it would have been gross barbarism to refuse, that thus, their ferocity being gradually subdued, He might accustom men to bear the yoke. Hence the exhortations are derived, that people should “honor the king;” that “every soul should be subject unto the higher powers;” that “servants should obey their masters, even the froward and morose.” (Proverbs 24:21; 1 Peter 2:13; Romans 13:1; Ephesians 6:5; 1 Peter 2:14, 18.) …It is a signal exaltation of magistrates, that God should not only count them in the place of parents, but present them to us dignified by His own name; whence also it clearly appears that they are not to be obeyed only from fear of punishment, “but also for conscience sake,” (Romans 13:5) and to be reverently honored, lest God should be despised in them. If any should object, that it would be wrong to praise the vices of those whom we perceive to abuse their power; the answer is easy, that although judges are to be borne with even if they be not the best, f13 still that the honor with which they are invested, is not a covering for vice. Nor does God command us to applaud their faults, but that the people should rather deplore them in silent sorrow, than raise disturbances in a licentious and seditious spirit, and so subvert political government.</p></blockquote>

<blockquote><p>3. The Headship of Christ, the Mediator, shall be universally acknowledged.

The central principle of the Divine administration is the supremacy of the Mediator. He has the right of universal sovereignty in virtue of the Father’s designation, and as the reward of his finished work. He has been set King upon Zion’s holy hill. For the suffering of death He has been crowned with dignity and honour; and set at the Father’s right hand, all things throughout the universe are put in subjection under Him. In virtue of his high exaltation, the ready homage and submission of men in all ranks and conditions are claimed for the Lord’s Anointed. To Him the appointment is given, “Rule in the midst of thine enemies;” and earth’s potentates, judges, and mighty ones are commanded, at their peril, to “Kiss the Son, lest He be angry, and they perish from the way, if his wrath is enkindled but for a little.” The Messiah is “Governor among the nations,” and from associated communities, as being under law to Him, He claims the recognition of his right to rule, and submission to his paramount authority. Upon his vesture and thigh He has a name written – “King of kings, and Lord of lords;” and on behalf of Christ and his Church, it is declared, “The nation and kingdom that will not serve Thee shall perish; yea, all these nations shall be utterly wasted.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/thomas-houston.html">Thomas Houston</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The judgment of the papacy: and the reign of righteousness</cite>, (1851) in Works doctrinal and practical of the Rev. Thomas Houston, D.D., Knockbracken (4 vols, Edinburgh, 1876), i, 328-9.</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/civil-government-and-society.html">Civil Government and Society</a></span></div>

</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-83fc8909db" data-kw="">
<blockquote><p>The world is soaked with mutual blood, and when individuals commit homicide, it is a crime; it is called a virtue when it is done in the name of the state. Impunity is acquired for crimes not by reason of innocence but by the magnitude of the cruelty.

Now if you turn your eyes and face toward the cities themselves, you will find a multitude sadder than any solitude. A gladitorial combat is being prepared that blood may delight the lust of cruel eyes. The body is filled up with stronger foods, and the robust mass of flesh grows fat with bulging muscles, so that fattened for punishment it may perish more dearly. Man is killed for the pleasure of man, and to be able to kill is a skill, is an employment, is an art. Crime is not only committed but is taught. What can be called more inhuman, what more repulsive? It is a training that one may be able to kill, and that he kills is a glory.

What is this, I ask you, of what nature is it, where those offer themselves to wild beasts, whom no one has condemned, in the prime of life, of a rather beautiful appearance, in costly garments? While still alive they adorn themselves for a voluntary death, wretched they even glory in their wicked deeds. They fight with beasts not because they are convicts but because they are mad. Fathers look upon their own sons; a brother is in the arena and his sister nearby, and, although the more elaborate preparation of the exhibition increases the price of the spectacle, oh shame! the mother also pays this price that she may be present at her own sorrows. And at such impious and terrible spectacles they do not realize that with their eyes they are parricides.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/cyprian-of-carthage.html">Cyprian of Carthage</a></span><span class="wk"><span class="lbl">Work:</span> <cite>To Donatus</cite>, (c. 246), 6, 7 in Saint Cyprian: Treatises, trans. and ed. Roy. J Deferrrari, The Fathers of the Church. A New Translation: Volume 36 (New York: Fathers of the Church, 1958), pp 12-13.</span></figcaption>

</figure><figure class="quote" id="q-cc95b40e74" data-kw="">
<blockquote><p>A second kind of abrogation of the Law, an outward one, is that the political laws of Moses do not apply to us at all. Therefore we should not restore them to the courthouse or chain ourselves to them in some superstitious way, as some men who were ignorant of this liberty did several years ago. Nevertheless, although the Gospel does not subject us to the civil laws of Moses, it does not completely set us free from obedience to all political laws; but in this bodily life it subjects us to the laws of the state in which we live, and it commands everyone to obey his magistrate and his laws, “not only to avoid God’s wrath but also for the sake of conscience” (1 Peter 2:13–14; Rom. 13:5). Nor would it be a sin if the emperor used some of the civil laws of Moses; in fact, it would be a good idea if he did. Therefore the sophists are in error when they imagine that after Christ the civil laws of Moses are fatal to us.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/martin-luther.html">Martin Luther</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Luther’s Works</cite>, Vol. 26: Lectures on Galatians, 1535, Chapters 1–4, ed. Jaroslav Jan Pelikan, Hilton C. Oswald, and Helmut T. Lehmann, vol. 26 (Saint Louis: Concordia Publishing House, 1999), 448.</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/civil-government-and-society.html">Civil Government and Society</a></span></div>

<blockquote><p>Here is Movens. The party longing desiring to depart; and that is Paul a chosen vessel, a faithful servant of God a living member of Christ. None can truly desire to be dissolved but he that is sure to be saved. No man willingly leaveth his present habitation, but he that is assured of a better dwelling. No wise man willingly to cast of his present garment, but he that hath another, a better to put on: No man can be upon right grounds willing to be dissolved, but only that man who is truly sanctified: he who is not thoroughly interested in Christ, cannot willingly leave all for Christ:

Eleazar Abraham’s servant, put a jewel upon Rebecca’s face, and bracelets upon her hands, and gave her jewels of silver and jewels of gold and raiment, and then she was willing to go with him, willing to leave all, and enjoy Isaac for her husband. That soul alone which Christ beautifieth with the saving gifts of his spirit, the love tokens of Christ, better gifts then jewels of silver, and gold. Is the soul, the only soul, that can forsake the dearest things of this life, that can readily leave its habitation in this mortal flesh, and take up its everlasting abode with Christ.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/alexander-grosse.html">Alexander Grosse</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Christ the Christian’s choice. Or A sermon preached at the funeral of Mr John Cavvs one of the magistrates of the famous corporation of Plymouth. March the 29. Anno Dom. 1645</cite>, (London: John Bartlet, 1645), p. 4.</span></figcaption>

221.html">Permalink</a><a class="src" href="https://reformedcovenanter.wordpress.com/2021/07/24/alexander-grosse-only-a-sanctified-soul-desires-to-be-with-christ/" rel="noopener" target="_blank">Read it online · Reformed Covenanter</a></div>
</figure><figure class="quote" id="q-a1b9e52002" data-kw="">
<blockquote><p>It is true, indeed, a prince should be loath to put out that life that God hath put in, and should beware, to judge rashly in capital crimes. It is no small matter to make a crime capital; but if the crime be capital and deadly, the prince hath no power to hold his hand aback from execution, and to forgive. Indeed, for weighty and great considerations, a prince may mitigate the punishment, but to say he may let the man go free, he hath no power. But yet they will insist further, and say, Is not this one of the judicial laws that was given to the Jews—then what have we to do with it? I answer, these laws, seeing the Jews, and their commonwealth, and laws politic, are abrogate, in so far as they concerned that people, we have nothing ado with them—they are abolished; but for as much as they are grounded upon nature, and natural law, we have ado with them. As for this law, it is natural. Ye know, that natural men, ethnics, who had never the law of the Jews, they executed the murderer.</p></blockquote>

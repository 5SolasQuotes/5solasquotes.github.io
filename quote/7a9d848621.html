<main class="wrap"><figure class="quote" id="q-7a9d848621" data-kw="">
<blockquote><p>Assertion 1. As a man comes into the world a member of a politic society, he is, by consequence, born subject to the laws of that society… Assertion 2. Slavery of servants to lords or masters, such as were of old amongst the Jews, is not natural, but against nature: 1. Because slavery is malum naturae, a penal evil and contrary to nature, and a punishment of sin. 2. Slavery should not have been in the world if man had never sinned, no more than there could have been buying and selling of men, which is a miserable consequent of sin and a sort of death, when men are put to the toiling pains of the hireling, who longs for the shadow, and [are] under iron harrows and saws, and to hew wood, and draw water continually. 3. The original of servitude was when men were taken in war, to eschew a greater evil, even death, the captives were willing to undergo a less evil, slavery, (S. Servitus, 1 de jure. Pers.) 4. A man being created according to God’s image, he is res sacra, ‘a sacred thing,’ and can no more, by nature’s law, be sold and bought than a religious and sacred thing dedicated to God. Servitus, 1. Instit. de inutil. scrupl. I. inter Stipulantem. S. Sacram. F. de verber. Obligat.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/samuel-rutherford.html">Samuel Rutherford</a></span><span class="wk"><span class="lbl">Work:</span> <cite>‘…and How it is True, ‘Every Man is Born Free’ &amp; how Servitude is Contrary to Nature’ in Lex Rex (1644), Question 13, Assertion 2, ff., pp. 51-53</cite>, p. 51</span></figcaption>

ink</a><a class="src" href="https://reformedbooksonline.com/topics/slavery/#:~:text=Assertion%201.%20As%20a%20man%20comes,S.%20Sacram.%20F.%20de%20verber.%20Obligat&amp;text=Assertion%201.%20As%20a%20man%20comes%20into%20the&amp;text=inter%20Stipulantem.%20S.%20Sacram.%20F.%20de%20verber.%20Obligat" rel="noopener" target="_blank">Read it online · Reformed Books Online</a></div>
</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-fc0918174f" data-kw="">
<blockquote><p>It is agreed on by divines that servitude is a penal fruit of sin, and against nature. Institutt. de jure personarum, Sect. 1, and F. de statu hominum. I. libertas; because all men are born by nature of equal condition. … But to be a master, and to have a masterly and lordly power over slaves and servants is to make use of servants for the owner’s bener fit, not for the good of the slave (I. 2, de leg, I. Servus de servit. expert. Dance polit. I. 1, Tolossan. de Rep. I. 1, c. 1, n. 15, 16), therefore are servants bought and sold as goods (jure belli. F, de statu hominum I. et servorum). 2… not to be under a master as slaves are, is a blessing, seeing freedom is a blessing of God (John 8:33; Ex. 21:2, 26-27; Dt. 15:12); so he that kills Goliath (1 Sam. 17:25), his father’s house shall be free in Israel (Jer. 34:9; Acts 22:28; 1 Cor. 9:19; Gal, 4:26, 31)… 3. Subjects are called the servants of the king (1 Sam. 15:2; 2 Chron. 13:7; 1 Kings 12:7; Ex. 10:1-2; Ex. 9:20) but they are not slaves, because (Dt. 17:20) they are his brethren: “That the king’s heart be not lifted up against his brethren;” and his sons; (Isa. 49:23) and the Lord gave his people a king as a blessing, (1 Kings 10:9; Hos. 1:11; Isa. 1:26; Jer. 17:25), “and brought them out of the house of bondage,” (Ex. 20:2) as out of a place of misery… 4. The master might in some cases sell the servant for money, yea for his own gain he might do it (Neh. 5:8; Eccl. 2:7; 1 Kings 2:32; Gen. 9:25; Gen. 26:14; 2 Kings 4:1; Gen. 20:14, and might give away his servants; and the servants were the proper goods and riches of the master (Eccl. 2:7; Gen. 30:43; Gen. 20:14; Job 1:3, 15); but the king may not sell his kingdom or subjects, or give them away for money…</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/samuel-rutherford.html">Samuel Rutherford</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Lex Rex... (1644; Edinburgh: Ogle, 1843), question 16</cite>, pp. 64-65</span></figcaption>

</figure><figure class="quote" id="q-31d5d00968" data-kw="">
<blockquote><p>Now that the prophet was ordered to offer them wine, and that they refused, a question here arises: Was their continency in this respect laudable? They seemed thus to prefer Jonadab [their forefather] to God, for they knew that Jeremiah, who offered them wine, was sent by God. But the Rechabites, no doubt, modestly excused themselves, when they said that it was not right for them to drink wine, because they had been forbidden by their father. It was not then their purpose to give more honor to their father than to God or to his prophet, but they simply answered for the sake of excusing themselves, that they had abstained from wine for three hundred years, that is, that the whole family had done so. This, then, is the solution of the question. But what the Papists do in bringing against us the Rechabites, first to support their tyrannical laws, and secondly, in order to torment miserable consciences at their pleasure, is frivolous in the extreme. As I have already said, the advice of Jonadab is not commended, as though he had rightly forbidden his sons to drink wine; but only his sons are spoken of as having reverently and humbly obeyed the command of their dead father. Then this passage gives no countenance to the Papists, as though the object of it was to bind the consciences of the faithful to their laws; for what is here spoken of is that the Rechabites proved by their obedience how base and wicked was the obduracy of the people, as they showed less reverence and honor to God than these did to a man that was dead. But the Papists, however, dwell much on another point, — that whatever has been handed down from the fathers ought to be observed; and thus they reason, “The authority of the whole Church is greater than that of a private man; now the Rechabites are commended for having followed the command of a private individual, much more then ought we to obey the laws of the Church.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/john-calvin.html">John Calvin</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Commentary on Jer. 35, v. 7, on the Rechabites</cite></span></figcaption>

<blockquote><p>Note, the rules of a strict discipline must not be made too strict, but so as to admit of a dispensation when the necessity of a case calls for it, which therefore, in making vows of that nature, it is wisdom to provide expressly for, that the way may be made the more clear, and we may not afterwards be forced to say, ‘It was an error,’ Eccl. 5:6. Commands of that nature are to be understood with such limitations. These Rechabites would have tempted God, and not trusted Him, if they had not used proper means for their own safety in a time of common calamity [which they did, Jer. 35:11], notwithstanding the law and custom of their family [Jer. 35:7-10].</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/matthew-henry.html">Matthew Henry</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Commentary on Jer. 35, vv. 1-11</cite></span></figcaption>

<div class="actions"><button class="copy" data-copy="“Note, the rules of a strict discipline must not be made too strict, but so as to admit of a dispensation when the necessity of a case calls for it, which therefore, in making vows of that nature, it is wisdom to provide expressly for, that the way may be made the more clear, and we may not afterwards be forced to say, ‘It was an error,’ Eccl. 5:6. Commands of that nature are to be understood with such limitations. These Rechabites would have tempted God, and not trusted Him, if they had not used proper means for their own safety in a time of common calamity [which they did, Jer. 35:11], notwithstanding the law and custom of their family [Jer. 35:7-10].”

<blockquote><p>The Prelate [John Maxwell] objects out of Spalato, Arnisaeus and Hugo Grotius… All government and superiority in rulers is not primely and only for the subjects’ good; for some are by God and nature appointed for the mutual and inseparable good of the superior and inferior, as in the government of husband and wife, or father and son; and in herili dominio, in the government of a lord and his servant, the good and benefit of the servant is but secondary and consecutively intended, it is not the principal end, but the external and adventitious [end], as the gain that comes to a physician is not the proper and internal end of his art, but follows only from his practice of medicine.</p></blockquote>

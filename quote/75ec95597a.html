<main class="wrap"><figure class="quote" id="q-75ec95597a" data-kw="">
<blockquote><p>For this law, the origin of death, passed on from the first pair to their posterity, as is seen in the labour with which all men toil in the earth, and the travail of women in the pains of childbirth. For these sufferings they merited by the sentence of God, when they were convicted of sin; and we see them fulfilled not only in them, but also in their descendants, in some more, in others less, but nevertheless in all.

Whereas, however, the primaeval righteousness of the first human beings consisted in obeying God, and not having in their members the law of their own concupiscence against the law of their mind; now, since their sin, in our sinful flesh which is born of them, it is obtained by those who obey God, as a great acquisition, that they do not obey the desires of this evil concupiscence, but crucify in themselves the flesh with its affections and lusts, in order that they may be Jesus Christ’s, who on His cross symbolized this, and who gave them power through His grace to become the sons of God.

For it is not to all men, but to as many as have received Him, that He has given to be born again to God of the Spirit, after they were born to the world by the flesh. Of these indeed it is written: “But as many as received Him, to them gave He power to become the sons of God; which were born, not of the flesh, nor of blood, nor of the will of man, nor of the will of the flesh, but of God.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/augustine-of-hippo.html">Augustine of Hippo</a></span><span class="wk"><span class="lbl">Work:</span> <cite>A Treatise on the Merits and Forgiveness of Sins. And on the Baptism of Infants</cite>, (412), 2.37 in Nicene and Post-Nicene Fathers 1, 5: 59.</span></figcaption>

7a.html&amp;via=5Solas" target="_blank" rel="noopener">Share on X</a><a class="perma" href="../quote/75ec95597a.html">Permalink</a><a class="src" href="https://reformedcovenanter.wordpress.com/2019/05/03/augustine-of-hippo-on-grace-delivering-us-from-evil-concupiscence/" rel="noopener" target="_blank">Read it online · Reformed Covenanter</a></div>

<blockquote><p>For no man is exempted from an obligation to obey God’s Law because of his own sinful and culpable ignorance, for we speak not now of invincible ignorance of these things which we are not obliged to know or believe. But if our sinful and erroneous conscience free us from actual obligation to be tied by a law, then our erroneous conscience frees us from sinning against a law, and so from punishment, for whatever frees a man from actual obligation, frees him also from actual sinning, for all sin is a doing against a Law-obligation, and if so, then are none to be led by any rule but their own conscience, the written Law and Gospel is not henceforth our rule any more.</p></blockquote>

<blockquote><p>But first of all, it is necessary to consider certain changes which took place in Christian thought on this subject during the preceding centuries. Be the origin of the doctrine in the attempt to smooth the rough places of law for the sake of the weak or tender conscience, or in the practical necessity for a guiding principle of division as a kind of ready reckoner for pastoral purposes, or in both these causes, a change of deep significance came about in its structure. At first, and up to the close of the patristic era, the key-note of the distinction was oþjectivity. The external act is the criterion, so that there is a regular tabula of sins, the commission of any of which involves the sinner in mortal sin. But by the time of the Schoolmen, and notably, of in the works of St. Thomas Aquinas, a tremendous ethical course, change in the idea has come about. There are still sins which are reckoned as mortal, suo genere [in its genera], but the governing factor is no longer the external act. It is the deliberateness with which the act is committed. In other words, intention or motive is receiving recognition as the determining element in assessing the gravity of sin. It was to Peter Abelard [c. 1079–1142)] that Aquinas and his fellows were indebted for this improved idea: In the Scito Te Ipsum [Know Yourself, by Abelard] the discussion of sin moves forward out of the realm of externals. Consequent on this stressing of deliberateness at the expense of drawing a clear line between what was mortal and what venial. This indeterminacy. inevitably paved the way for laxity in the computation of the guiltiness of certain sinful acts.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/henry-r-mcadoo.html">Henry R. McAdoo</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Other citations (work not named)</cite>, Ch. 4, ‘Mortal &amp; Venial Sin: the Reforming Strain’ in The Structure of Caroline Moral Theology (Longmans, Green, 1949), pp. 98-119</span></figcaption>

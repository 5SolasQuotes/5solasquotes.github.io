<main class="wrap"><figure class="quote" id="q-fbd76a5f92" data-kw="">
<blockquote><p>This Superiority which Gospel Ministers have, is not a lordly Dominion either over the Persons or Faith of their Flock. No, any Thing of this Sort that ever crept – into the Church,. had its Rife from the Subtilty of Satan, who envied its Peace, and is directly opposite to the Gospel, which forbids lordly Dominion, the Gospel Ministers Authority being given only for Edification and not for Destruction, as the Apostle has it 2 Cor. x. 8.

And it consists, 1. in an authoritative Publication of the Laws of Christ’s House. 2. In an authoritative Enforcement of them by a ministerial Offer of the Gospel Privileges as the Rewards of Obedience. And, 3. in a Power to inflict, according to Christ’s Appointment, the Gospel Punishments upon the Disobedient, the highest whereof is Excommunication, whereby the Disobedient are delivered over to Satan, for the Destruction of the Flesh, that the Spirit may be saved in the Day of the Lord Jesus, as the Apostle has it 1 Cor. v. 5.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/thomas-halyburton.html">Thomas Halyburton</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Great Concern of Salvation</cite>, (Edinburgh, 1721), p. 8.</span></figcaption>

</figure><figure class="quote" id="q-9871e7b968" data-kw="">
<blockquote><p>The question concerning the true frame of the Lord’s Tabernacle, the New Testament Church, in point of Government, hath been a Ball of dispute long tost in this Island; this Contest might have long since had its exit, and issued in sound and solid Peace, and union upon this head, had we all with a single heart and eye, looked to the Pattern shewed upon the Mount, and listened to the discoveries so often made to us, from the lovely Oracles of the Word, Ezek. chap. 43. v. 11. of the form of the House, and the fashion thereof, and the goings out thereof, and the comings in thereof, &amp; all the forms thereof, and all the Ordinances thereof, and all the forms thereof, and all the Laws thereof, that we might keep the whole form thereof, and all the Ordinances thereof, and do them.

Had we renounced the wisdom of the flesh, and got the penitent heart, and been ashamed for all we have done amiss; and, (as the Author of this Paper well expresses it in his Preface) preferred Religion to Interest, and the power of Godliness to that of Dominion. But restless Ambition, and love of Dominion over the House of God, and over their Brethren, and fellow servants, as they began in the Christian Churches Infancy, and had an early tincture in the Apostles (though our Lord nipt the first buds of this bitter Root, and crushed this Cockatrice in the shell, shewing them, that humble Ministerial Diligence was the apex of their greatness) so the fermentation of this distemper continuing in most men, and by the influence of Satan upon man’s wicked heart, diffusing it self in after Generations, hath been a spreading gangrene, still hindering the reception, and improvement of this Ordinance, of the Gospel Church-Government, whereof Scripture and Experience are irrefragable witnesses.

The Apostle Paul tells us: the mystery of iniquity was working in his time, and the Embryo of the Prelatical Hierarchy, and a Papistical, consequently, then formed; which we find after stirring in the counteractings, and contradiction of a Diotrophes, (that early aspiring Primate,) even unto the Apostle John. Hence the Apostle Peter in his exhortation to Pastors of the Church, doth so [anxiously] dehort them from those two grand &amp; Satanical enchantments, viz. Covetousness, and Lording over God’s Heritage; which no doubt had its influence for checking these evils for a considerable time. But the early-sown tears of the Evil one, did by piece-meal discover themselves, first, in the advance of Beza’s human Episcopacy, the fixt Moderator, or proestos, which was next, (by the influence of the restless temper) screwed up to the Satanical, as he calls it, viz. the Diocesion Prelacy, swallowing up, and enhancing all the decisive Authority and Power of Pastors in Government; then the ascension was made to the Arch-bishops, and Metropolitans’ Office, and Power, and by an inevitable necessity to the Culmen of the Papal Monarchy at last.

The Lord having in this evening of time, and the days of Reformation, by the light of the Gospel, discovered the mystery of iniquity, and of the Papal Hierarchy consequently; and caused his People to hear his call, to come out of Babylon, and be separated from that detestable Synagogue, the Reformed Churches has generally had so deep a sense of the connexion of Popery and Prelacy, that together with the one, they found themselves obliged to reject the other; and in their Confessions, and by the Writings of their most famous, burning and shining Lights, have witnessed against this corruption of Government, as well as against that Synagogue’s errors in point of Doctrine; …</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/thomas-forrester.html">Thomas Forrester</a></span><span class="wk"><span class="lbl">Work:</span> <cite>A counter-essay, or, A vindication and assertion of Calvin and Beza’s presbyterian judgment and principles; drawn from their writings</cite>, (Edinburgh: Andrew Anderson, 1692), preface.</span></figcaption>

e%2C+still+hindering+the+reception%2C+and+improvement+of+this+Ordinance%2C+of+the+Gospel+Church-Government%2C+whereof+Scripture+and+Experience+are+irrefragable+witnesses.%0A%0AThe+Apostle+Paul+tells+us%3A+the+mystery+of+iniquity+was+working+in+his+time%2C+and+the+Embryo+of+the+Prelatical+Hierarchy%2C+and+a+Papistical%2C+consequently%2C+then+formed%3B+which+we+find+after+stirring+in+the+counteractings%2C+and+contradiction+of+a+Diotrophes%2C+%28that+early+aspiring+Primate%2C%29+even+unto+the+Apostle+John.+Hence+the+Apostle+Peter+in+his+exhortation+to+Pastors+of+the+Church%2C+doth+so+%5Banxiously%5D+dehort+them+from+those+two+grand+%26+Satanical+enchantments%2C+viz.+Covetousness%2C+and+Lording+over+God%E2%80%99s+Heritage%3B+which+no+doubt+had+its+influence+for+checking+these+evils+for+a+considerable+time.+But+the+early-sown+tears+of+the+Evil+one%2C+did+by+piece-meal+discover+themselves%2C+first%2C+in+the+advance+of+Beza%E2%80%99s+human+Episcopacy%2C+the+fixt+Moderator%2C+or+proestos%2C+which+was+next%2C+%28by+the+influence+of+the+restless+temper%29+screwed+up+to+the+Satanical%2C+as+he+calls+it%2C+viz.+the+Diocesion+Prelacy%2C+swallowing+up%2C+and+enhancing+all+the+decisive+Authority+and+Power+of+Pastors+in+Government%3B+then+the+ascension+was+made+to+the+Arch-bishops%2C+and+Metropolitans%E2%80%99+Office%2C+and+Power%2C+and+by+an+inevitable+necessity+to+the+Culmen+of+the+Papal+Monarchy+at+last.%0A%0AThe+Lord+having+in+this+evening+of+time%2C+and+the+days+of+Reformation%2C+by+the+light+of+the+Gospel%2C+discovered+the+mystery+of+iniquity%2C+and+of+the+Papal+Hierarchy+consequently%3B+and+caused+his+People+to+hear+his+call%2C+to+come+out+of+Babylon%2C+and+be+separated+from+that+detestable+Synagogue%2C+the+Reformed+Churches+has+generally+had+so+deep+a+sense+of+the+connexion+of+Popery+and+Prelacy%2C+that+together+with+the+one%2C+they+found+themselves+obliged+to+reject+the+other%3B+and+in+their+Confessions%2C+and+by+the+Writings+of+their+most+famous%2C+burning+and+shining+Lights%2C+have+witnessed+against+this+corruption+of+Government%2C+as+well+as+against+that+Synagogue%E2%80%99s+errors+in+point+of+Doctrine%3B+%E2%80%A6%E2%80%9D%0A%0A%E2%80%94+Thomas+Forrester%2C+A+counter-essay%2C+or%2C+A+vindication+and+assertion+of+Calvin+and+Beza%E2%80%99s+presbyterian+judgment+and+principles%3B+drawn+from+their+writings%2C+%28Edinburgh%3A+Andrew+Anderson%2C+1692%29%2C+preface.&amp;url=https%3A%2F%2F5solasquotes.github.io%2Fquote%2F9871e7b968.html&amp;via=5Solas" target="_blank" rel="noopener">Share on X</a><a class="perma" href="../quote/9871e7b968.html">Permalink</a><a class="src" href="https://reformedcovenanter.wordpress.com/2022/07/25/thomas-forrester-on-the-corruption-of-church-government-and-the-mystery-of-iniquity/" rel="noopener" target="_blank">Read it online · Reformed Covenanter</a></div>

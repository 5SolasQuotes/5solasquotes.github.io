<blockquote><p>4. It is, therefore, a diabolical opinion, which has possessed the minds of almost all those who lay claim to gentility, that they cannot bear, even a reproachful word, without the loss of their honour and their reputation; but are under the necessity of seeking revenge in a duel, at the manifest peril of their own lives, and a plain attack upon the life of another.

This more than heathenish opinion can be refuted by many arguments:

1. We pull down the very foundation of what we are striving to build, by laying down this maxim. It is not a sign of a cowardly or ignoble mind, nor disgraceful or mean in a Christian, to bear injuries, but to inflict them. This was briefly proved above, when we were reasoning on meekness, patience, and their acts: we will now add, that this was even approved by the very heathens, especially the wiser among them.

Socrates, as we find in Plato (in his Gorgia) draws the conclusion, that every injury is dishonourable and infamous to the inflictor of it, not to him who suffers it; and that, as he says himself, for the strongest and most solid reasons … Aristotle follows the same opinion in his Ethics 5. cap. 11, giving this reason; To inflict an injury is the effect of dishonesty; and on that account dishonourable and infamous: but to suffer one with equanimity is the effect of virtue, and therefore glorious.

Seneca, in that book where he professedly considers whether an injury can affect a wise man, writes; We ought to despise injuries, and what I may call the shadow of injuries, contumely, whether they fall deservedly or undeservedly upon us. If deservedly, it is not contumely, but judgment given; if undeservedly, it is for him who did the injury, and not for me to be ashamed of it. That we may not accumulate more from profane authors, we have the opinion of Christ himself, Matt. v. 11, Blessed are ye when men shall revile you.

2. Should we grant that injury or contumely has been cast upon us, and that to do this is criminal; nevertheless it by no means follows, that it is lawful to repel it by means of a duel: and that for these reasons;

1. No one ought to be judge in his own cause; and, least of all, one who is disturbed with anger, violence, and the passion of revenge. Tertullian, De patient, says, What have I to do with a passion, which 1 cannot govern through impatience?

2. Individuals do injury to God and his vicarious representative, the magistrate, when they seek to revenge themselves by private means. Vengeance is mine, and I will repay, saith the Lord, Deut. xxxii. 35; and Rom. xiii. 14, Paul says of the magistrate, He beareth not the sword in vain. But he would bear it in vain, if it was allowed to an individual to draw the sword at his own pleasure.

3. Duellists would punish every injury with the same punishment, namely, death; which is not the judgment of a generous man, but of a madman. Now every punishment inflicted by one possessed of all his faculties, ought to be commensurate with the offence.

We shall conclude with the saying of Christ. Matt. xxvi. 52, All they that take the sword shall perish with the sword; that is, as Augustine interprets it, Every one who without legitimate authority granted to him, or enjoining him so to do, shall arm himself against the life of any man, shall perish either by the sword of man, or that of Divine vengeance. From all these reasons it appears clear, that they are absolutely madmen, who follow the opinions of the many, renouncing the doctrine of Christ: so that they may retain the name of Gentlemen, they do not fear the title of homicide; and, finally, so that they may avoid a suspicion of false infamy, they leap into the very pit of hell itself.</p></blockquote>

<blockquote><p>In the dispute which resulted in the schism of 1840 over the civil magistrate’s power circa sacra, it was alleged that Thomas Houston was arguing for the entire judicial law to be upheld by the Christian ruler. This was a complete straw-man, yet, in modern debates over Theonomy, we hear this very same straw-man repeated again and again. No matter how many times you tell people that this is not the case, they persist in spreading such misrepresentation. Instead, our position is that the judicial laws which are part of the moral law continue to oblige all nations; as Dr Houston puts it:

Again, the authors of the Declinature obviously represent Mr. Houston, as teaching that the whole Judicial Code is still obligatory on Christian civil rulers, whereas, even in the passages which they have quoted, the writer limits the laws, as do the eminent Divines, to those which guard the Decalogue, which are moral in their nature, and which are susceptible of application, to nations in different ages, and under every dispensation.</p></blockquote>

<blockquote><p>In the second place, let us refer to the right inherent in the Church of Christ to propagate the Gospel, and make disciples in every country and nation under heaven. This right, claimed by the Church, and belonging to her in consequence of the duty enjoined by her Head, is a right of such a nature, that it cannot properly consist with the neutrality of the civil magistrate, or be recognised by any state constituted on the principle that it has nothing to do with religion.

The full and free and unrestricted power to take possession of this world in the name of Christ, to the exclusion of any other form of faith and worship, is what Christianity demands: with less than this it cannot be satisfied. And yet it may well be doubted whether it be consistent with the principle and practice of absolute neutrality on the part of the state to concede this demand, or whether a toleration for the truth, founded on the theory of entire impartiality and indifference as regards truth and falsehood, is sufficient to protect the Church of Christ in its exclusive claims.

The Gospel of Christ is not, like the systems of polytheism among which it was introduced at first, compatible with every other system of falsehood. It is exclusive in its character and pretensions; and demands that it be received and owned and submitted to, to the abandonment and rejection of every other faith. Christ Himself tells us that He came to send on the earth, “not peace, but a sword,” not ease, but “a burning fire;” and, like a sword, His Gospel divides asunder the outward and formal union of human society, and, like a fire, it kindles strife and division in the world.

There is so much in the Gospel fitted to awaken the hostility of the human heart, and standing in direct opposition to the principles and practices of the world, that it cannot but act as a firebrand wherever it enters. To introduce and propagate it, therefore, in any community, tends not indirectly to excite the rage and outrage and violence of men. More than this: its first principle and first duty is that of aggression.

The ministers of the Gospel claim it as a right to go into every nation, however fenced around and guarded from intrusion, and to demand an entrance in the name of Him who sent them, even although the magistrate should bid them depart from his coasts. Further still, the messengers of the Cross arrogate to themselves the title to enter into every human dwelling where a sinner is to be found,-seeking admittance in the name of the Saviour of sinners, that they may negotiate with the inhabitant in behalf of their Master, however sternly the door may be closed against them by jealousy of their errand, or hatred to their cause.

It has been the eloquent boast of freedom in our country, that every man’s house is his castle; and that, be it but a strawbuilt shed, open to every breath of heaven, yet fenced about by the protection and the sanction of law, there even “the king cannot and dare not enter.” But where the king cannot enter, there the missionary of Christ claims to be admitted; and, with a higher warrant in his hand than that of human law, bids the gates be lifted up, that with the Gospel he may enter in. And can claims and pretensions so essentially exclusive and aggressive, which belong from its very nature to Christianity, be owned and conceded by a state constituted on the principle of entire and equal indifference to truth and falsehood?

Is it, in the nature of things, possible, in regard to such demands, to profess or carry out the theory of neutrality in civil legislation, granting a licence free and full to Christianity, intolerant as it is of every other religion? Ask the Roman magistrate within whose jurisdiction the Gospel was at first preached, or the magistrate of any country not Christian within whose rule Christianity is introduced at the present day. For the first three hundred years of its existence the religion of Christ was in almost perpetual collision with the state, just on the ground that it was essentially a missionary and an exclusive religion, that it would not, and could not, exist in peace alongside of any other faith, that its temples must stand alone, and its Deity find no place in the Pantheon. Nor has the essential character of Christianity altered since the days of Nero and Diocletian.

<blockquote><p>And now that so much as I have said is required, active Obedience to legal, civil Authority to all Magistrates in their legal commands in civil matters; or at least passive yielding to the penalty of the Laws, in case of not obeying actively; and neither further then to legal commands of legal Authority, appears by the Apostle’s reason in this 1. verse. For there is no power but of God; which he redoubles in a second phrase, The powers that be are ordained of God, or under God … Every soul must be under their order … because they all are ordered by God under him, his deputies and vicegerents in their order and degree, higher and highest.

This is true of all powers, and therefore to all must subjection be performed. And to none hath God ordered or ordained any Authority but legal. Which as none will deny (no not the Doctor himself) of other Governors besides the supreme: So can none with reason affirm, that any hath more authority then the Laws, whether special or general, written or unwritten, have allotted them. Which Laws God ratifies (being not against his) and so the Authority according to them.

And this our Doctor also confesses (in sense) in more places then one of his Book, for active Obedience, that no more is due, but according to the Laws of God, and the established laws of the Land. Only he argues for passive obedience beyond this, every where. 1. Because he argues against resistance even of Tyranny. But in a word to refute this from the Apostle’s reason in the first verse.

If I be bound to be subject to tyranny, (or to suffer violence of a tyrant) by virtue of the commandment here. Then tyranny is the Ordinance of God, or Magistrates have power ordained of God to use tyrannous violence (for thus the Apostle argues for subjection from God’s ordaining the power) But this is false. Ergo, so is that, that I should be bound to suffer tyrannous violence. …

But I say again, that by all the foregoing context, and the reason from God’s Ordinance in the second verse: The prohibition of blaming of resistance, goes no further, then, of legal commands of legal authority. The Doctor will not (doth not) say that the most peremptory, or obstinate refusing to obey actively tyrannous and illegal commands is resistance. By what authority then of the Text or context will he stretch the prohibition to refusing to suffer tyrannous violence?

Or how does any resist unlawfully (though by Arms) when unlawful violence is offered him? which God no where gave authority to use to him, nor ever commanded him to yield unto? In a word, till God’s Ordinance can be proved allowing tyranny (which can never be) or undeniably ordaining a man to suffer it, which is no where in his word (I mean the extremity of tyranny depriving of life, or so) though often it is so in his providence, when he affords no means of resistance: This Text of the Apostle will no way condemn the resisting by Arms tyrannous and illegal outrageous violences. Besides all that, the context following refuses this sense of the Doctor, as I have already shewed. …

Then besides all that hath been said on the Text and context, I only add this: That then every meanest Officer (if wicked) may ruin the whole neighbourhood, because he may not be resisted by Arms, who yet will bring Arms to act his villanies. And so the blessed Ordinance of God in Magistracy shall turn to the greatest curse to Mankind (the best and most conscientious of them) that can be imagined, in regard of outward sufferings, and general confusion.

It remains therefore that as the Apostle in the following verses, banishes tyranny out of the context, describing every where a righteous Magistrate, and not a tyrant: So tyranny is to be banished out of the interpretation of this Text, which allows him that is a tyrant, no security, that he shall be endured, and not resisted even with Arms. Though it doth (and that most justly and necessarily) secure a just ruling Prince or Magistrate from all resistance, even when he punishes most severely according to Law and justice, upon the heaviest guilt of being found resisters against God (that resist such a rule) and the heaviest penalty of damnation.</p></blockquote>

the+Apostle%E2%80%99s+reason+in+the+first+verse.%0A%0AIf+I+be+bound+to+be+subject+to+tyranny%2C+%28or+to+suffer+violence+of+a+tyrant%29+by+virtue+of+the+commandment+here.+Then+tyranny+is+the+Ordinance+of+God%2C+or+Magistrates+have+power+ordained+of+God+to+use+tyrannous+violence+%28for+thus+the+Apostle+argues+for+subjection+from+God%E2%80%99s+ordaining+the+power%29+But+this+is+false.+Ergo%2C+so+is+that%2C+that+I+should+be+bound+to+suffer+tyrannous+violence.+%E2%80%A6%0A%0ABut+I+say+again%2C+that+by+all+the+foregoing+context%2C+and+the+reason+from+God%E2%80%99s+Ordinance+in+the+second+verse%3A+The+prohibition+of+blaming+of+resistance%2C+goes+no+further%2C+then%2C+of+legal+commands+of+legal+authority.+The+Doctor+will+not+%28doth+not%29+say+that+the+most+peremptory%2C+or+obstinate+refusing+to+obey+actively+tyrannous+and+illegal+commands+is+resistance.+By+what+authority+then+of+the+Text+or+context+will+he+stretch+the+prohibition+to+refusing+to+suffer+tyrannous+violence%3F%0A%0AOr+how+does+any+resist+unlawfully+%28though+by+Arms%29+when+unlawful+violence+is+offered+him%3F+which+God+no+where+gave+authority+to+use+to+him%2C+nor+ever+commanded+him+to+yield+unto%3F+In+a+word%2C+till+God%E2%80%99s+Ordinance+can+be+proved+allowing+tyranny+%28which+can+never+be%29+or+undeniably+ordaining+a+man+to+suffer+it%2C+which+is+no+where+in+his+word+%28I+mean+the+extremity+of+tyranny+depriving+of+life%2C+or+so%29+though+often+it+is+so+in+his+providence%2C+when+he+affords+no+means+of+resistance%3A+This+Text+of+the+Apostle+will+no+way+condemn+the+resisting+by+Arms+tyrannous+and+illegal+outrageous+violences.+Besides+all+that%2C+the+context+following+refuses+this+sense+of+the+Doctor%2C+as+I+have+already+shewed.+%E2%80%A6%0A%0AThen+besides+all+that+hath+been+said+on+the+Text+and+context%2C+I+only+add+this%3A+That+then+every+meanest+Officer+%28if+wicked%29+may+ruin+the+whole+neighbourhood%2C+because+he+may+not+be+resisted+by+Arms%2C+who+yet+will+bring+Arms+to+act+his+villanies.+And+so+the+blessed+Ordinance+of+God+in+Magistracy+shall+turn+to+the+greatest+curse+to+Mankind+%28the+best+and+most+conscientious+of+them%29+that+can+be+imagined%2C+in+regard+of+outward+sufferings%2C+and+general+confusion.%0A%0AIt+remains+therefore+that+as+the+Apostle+in+the+following+verses%2C+banishes+tyranny+out+of+the+context%2C+describing+every+where+a+righteous+Magistrate%2C+and+not+a+tyrant%3A+So+tyranny+is+to+be+banished+out+of+the+interpretation+of+this+Text%2C+which+allows+him+that+is+a+tyrant%2C+no+security%2C+that+he+shall+be+endured%2C+and+not+resisted+even+with+Arms.+Though+it+doth+%28and+that+most+justly+and+necessarily%29+secure+a+just+ruling+Prince+or+Magistrate+from+all+resistance%2C+even+when+he+punishes+most+severely+according+to+Law+and+justice%2C+upon+the+heaviest+guilt+of+being+found+resisters+against+God+%28that+resist+such+a+rule%29+and+the+heaviest+penalty+of+damnation.%E2%80%9D%0A%0A%E2%80%94+Herbert+Palmer%2C+Scripture+and+reason+pleaded+for+defensive+arms%3A+or+The+whole+controversy+about+subjects+taking+up+arms+Wherein+besides+other+pamphlets%2C+an+answer+is+punctually+directed+to+Dr.+Ferne%E2%80%99s+book%2C+entitled%2C+Resolving+of+conscience%2C+%26c.+The+scriptures+alleged+are+fully+satisfied.+The+rational+discourses+ar%2C+%28London%3A+John+White%2C+1643%29%2C+pp+4%2C+5%2C+6.&amp;url=https%3A%2F%2F5solasquotes.github.io%2Fquote%2F2ae067612c.html&amp;via=5Solas" target="_blank" rel="noopener">Share on X</a><a class="perma" href="../quote/2ae067612c.html">Permalink</a><a class="src" href="https://reformedcovenanter.wordpress.com/2019/05/24/herbert-palmer-tyranny-is-not-the-ordinance-of-god/" rel="noopener" target="_blank">Read it online · Reformed Covenanter</a></div>

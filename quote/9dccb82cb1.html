<main class="wrap"><figure class="quote" id="q-9dccb82cb1" data-kw="">
<blockquote><p>Add unto this, that whereas in praying we are to speak only unto God, it is otherwise in singing, where we are taught to ‘speak unto ourselves in psalms’, and ‘to teach, and admonish ourselves in psalms, and hymns, and spiritual songs’ (Eph. 5:19; Col. 3:16). What greater difference? In prayers we speak only to God: in psalms to our selves mutually, or one to another…</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/john-robinson.html">John Robinson</a></span><span class="wk"><span class="lbl">Work:</span> <cite>A Justification of Separation from the Church of England Against Mr. Richard Bernard his Invective, entitled, The Separatists Schism (Amsterdam, 1610), p. 467. See through p. 469 where only psalms are mentioned, and that from the book of psalms.</cite></span></figcaption>
<div class="meta"><span class="t"><a href="../topics/worship/psalmody.html">Psalmody</a></span></div>

</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-cf628fee0b" data-kw="">
<blockquote><p>Teaching and admonishing one another in Psalms, and Hymns, and spiritual Songs] See Eph. 5:19. In both which places, as the Apostle exhorteh us to singing, so he instructs what the matter of our song should be,† viz. Psalms, Hymns, and spiritual Songs. Those three are the titles of the songs of David, as they are delivered to us by the Holy Ghost Himself; some of them are called Mizmorim, Psalms; some Tehillim, Hymns; some Shirim, Songs, Spiritual Songs. †Mr. Cotton of singing of Psalms, ch. 4, and on 1 Cant., Psalmus est in quo concinendo adhibetia musicum aliquod instrumentum praeter linguam. Hymnus propriè est laudis canticum, sive alta voce, sive aliter canatur. Oda non laudes tantum continet, sed paraeneses &amp; alia argumenta. Calvinus.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/edward-leigh.html">Edward Leigh</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Annotations upon all the New Testament (London: 1650) | on Col. ch. 3, verse 16</cite>, p. 306</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/worship/psalmody.html">Psalmody</a></span></div>

</figure><figure class="quote" id="q-5af298c280" data-kw="">
<blockquote><p>Our songs must be spiritual: 1. For matter, not profane. 2. They must proceed from God’s Spirit, as the Author of them (see v. 17 and Ps. 37:4). 3. Must be framed with honest and gracious words beseeming the Spirit…</p></blockquote>

</figure><figure class="quote" id="q-e2f1c48fa2" data-kw="">
<blockquote><p>Verse 30. ‘When they had sung a hymn,’ etc. A hymn is a verse sung for the praise of God. Their opinion doth not seem to be vain who think that the apostles at that time sung a great hymn which consists of six Psalms: 113, 114, 115, 116, 117, and 118. The Hebrews certainly sing this song in the night of the Passover after the lamb is eaten. Paulus Burgensis thinks that the Apostles rehearsed this hymn, according to the custom of the Jews, after the Passover, and that this place is to be understood of that, which is very probable, for since in other things it is manifest that Christ with his apostles observed the rite of the Jews in eating the Passover, it is not unlikely that He might follow them in this also. Grotius saith, learned men think that the hymns were sung by Christ which were wont to be sung at the Passover, as the 114, and those that follow, but he seems to be of another opinion.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/edward-leigh.html">Edward Leigh</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Annotations upon all the New Testament (London: 1650) | on Mt.</cite>, 26:30</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/worship/psalmody.html">Psalmody</a></span></div>

<blockquote><p>We all reject their error who make every circumstance of religion unlawful which has not a particular command in Scripture; as if reason might not regulate such by the general command; As if reason might not without express particular precept choose a text, method, words and notes for remembrance in preaching, or might not translate the Scriptures or turn the Psalms into meter and put tunes on each, and many such things.</p></blockquote>

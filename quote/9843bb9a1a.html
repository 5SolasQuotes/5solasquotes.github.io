<main class="wrap"><figure class="quote" id="q-9843bb9a1a" data-kw="">
<blockquote><p>VII. It [sin] is a deviation of human action (Mic. 6:8), whereas although their own law of nature is prescribed for brute beasts and inanimate objects (Jer. 8:7; Deut. 32:11; Isa. 1:3; Prov. 6:6), from which they can in some sense fall short, yet whenever this happens, there is not committed by them sin in the proper sense, as in the case when the earth does not produce its fruits, or when the digestion of the stomach or liver fails; yet because they do not have the moral law, and do not acknowledge their own natural law, nor can they order themselves to it, but rather are ordered and determined by another, properly speaking they neither deviate nor sin. Nor is it any hindrance to this that now and then they are said to be punished (Gen. 3:15; 9:5; Lev. 20:15–16; Ex. 21:28). For that penalty, pronounced thus catechrestically, in detestation of the material fact itself, through the body of that beast assails its owner. Nor also does their demise argue for sin, but for a fragile nature, enlarged by the occasion of human sin (Gen. 3:17; Rom. 8:20).</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/petrus-van-mastricht.html">Petrus van Mastricht</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Theoretical Practical Theology</cite>, (RHB), vol. 3, bk. 4, ch. 3, ‘Actual Sin’ | section 7, pp. 492-93</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/sin/nature-of-sin.html">Nature of Sin</a></span></div>

</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-7e8ead5587" data-kw="">
<blockquote><p>Question 5. What are we to judge of those actions which are done through concupiscence. 10th Answer. Concupiscence does not make an act cease to be voluntary, neither does it indeed diminish the voluntariness of it in respect of the act, but increases it rather. For he that does a thing out of concupiscence, has a will strongly inclined to that which it does, as is appears either delightful or profitable to him; if therefore the concupiscence be fixed, the sin’s the greater, as it was in Judas, who betrayed Christ out of covetousness of [money].</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/william-ames.html">William Ames</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Conscience with the Power &amp; Cases Thereof</cite>, (1639), bk. 3, ch. 19, ‘Of a Voluntary Act’, p. 93</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/sin/nature-of-sin.html">Nature of Sin</a></span></div>

</figure><figure class="quote" id="q-a84fb7eb54" data-kw="">
<blockquote><p>We must here observe, that not only are corrupt and disordered inclinations sins, but the thinking of evil, in as far as it is connected with an inclination and propensity to pursue it, or with a desire to practice it, is sin.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/zacharias-ursinus.html">Zacharias Ursinus</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Commentary on the Heidelberg Catechism</cite>, Q. 113</span></figcaption>

— Zacharias Ursinus, Commentary on the Heidelberg Catechism, Q. 113">Copy</button><a class="share" href="https://x.com/intent/post?text=%E2%80%9CWe+must+here+observe%2C+that+not+only+are+corrupt+and+disordered+inclinations+sins%2C+but+the+thinking+of+evil%2C+in+as+far+as+it+is+connected+with+an+inclination+and+propensity+to+pursue+it%2C+or+with+a+desire+to+practice+it%2C+is+sin.%E2%80%9D%0A%0A%E2%80%94+Zacharias+Ursinus%2C+Commentary+on+the+Heidelberg+Catechism%2C+Q.+113&amp;url=https%3A%2F%2F5solasquotes.github.io%2Fquote%2Fa84fb7eb54.html&amp;via=5Solas" target="_blank" rel="noopener">Share on X</a><a class="perma" href="../quote/a84fb7eb54.html">Permalink</a><a class="src" href="https://archive.org/details/commentaryofzach00ursiuoft" rel="noopener" target="_blank">Read it online · Internet Archive</a></div>
</figure><figure class="quote" id="q-c2ea72c458" data-kw="">
<blockquote><p>When we pursue worldly wealth or worldly reputation with more vehemence than the riches of grace or the favor of God; when we have a foolish imagination that our happiness consists in them, we prefer earth before heaven, broken cisterns that can hold no water before an ever-springing fountain of glory and bliss, and, as though there were a defect in God, cannot be content with him as our portion without an addition of something inferior to him; when we make it our hopes to say to the wedge, “You are my confidence,” and rejoice more because it is great and because our hand has gotten much than in the privilege of communion with God and the promise of an everlasting fruition of him (Job 31:24–25)—this is so gross that Job joins it with the idolatry of the sun and moon.… And the apostle, when he mentions covetousness or covetous men, passes it not over without the title of idolatry to the vice and idolater to the person (Col. 3:5), in that it is a preferring of clay and dirt as an end more desirable than the original of all goodness, in regard of affection and dependence.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/stephen-charnock.html">Stephen Charnock</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Existence and Attributes of God</cite>, Discourse 2, On Practical Atheism (covetousness as idolatry)</span></figcaption>

</figure><figure class="quote" id="q-b334fee3da" data-kw="">
<blockquote><p>Even when we choose evil, we choose for the good, albeit poorly. The choice of the sinner for evil in this sense is not a choice for an alternate, competing reality that is diametrically opposed to the order of goodness. It is a poor choice— an attempt at the good that fails in ways that are both person ally and socially destructive. Understood in this way, vice is not so much an equal alternative to virtue, but a corruption and weakening of the virtus of human nature, which by its natural form is ordered to the good.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/reginald-m-lynch.html">Reginald M. Lynch</a></span><span class="wk"><span class="lbl">Work:</span> <cite>“Divine Causality &amp; Human Freedom</cite>, “Divine Causality &amp; Human Freedom: Aquinas, Banez and Premotion after Descartes” in eds. Ballor, Gaetano &amp; Sytsma, Beyond Dordt &amp; De Auxiliis: the Dynamics of Protestant &amp; Catholic Soteriology in the Sixteenth &amp; Seventeenth Centuries (Brill, 2019), p. 230 Lynch is a Dominican and writes in the Thomist tradition.</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/sin/nature-of-sin.html">Nature of Sin</a></span></div>

<blockquote><p>do constantly affirm what I set forth in my Apology, as I remember, whether in my own or the late Queen’s time, that conscience and religion have been the cause of the last extremity of punishment. For however much a man may be addicted to his religion, however much he may openly and constantly profess it, no danger of death will hang over him unless he shall have actually offended against the foreign laws in any act; or shall have been seen to be the very summit of a conspiracy of counsels pernicious to the commonwealth: except only such as relate to sacrifices, and other parts of the Pontifical system, who in transmarine regions insinuate themselves into sacred orders: who have so many conspiracies, so many treasons by them in England, either conceived or instigated or applauded, that from our borders they are driven back under the penalty of destruction. And yet none of them remains in the same thing which you would wish to call holy: that by the single case, being mulcted, death should immediately follow.</p></blockquote>

<blockquote><p>Secondly it is asked whether Jews or pagans can be over Christians or not. And it seems that yes:

1. From the fact that the apostle says, 1 Tim. 6:1: Let all who are under the yoke of slavery deem their masters worthy of all honor. Gloss: ‘Under the yoke of infidels.’ Therefore the apostle does not deny that infidels were able to be over the faithful.

2. Likewise, Extra, Of Many: Because to be cultivated. Therefore Jews can be over Christians. They have clung more longly to their lands, as owing to a contract of the place, let them remain for the cultivation of fields, rendering the customary payments to the aforesaid Christian men.

3. Likewise, they are able to receive a price for Christian slaves that have been purchased; which would not be the case unless they were able in some way to be over them, as is found in dist. 54, Fraternitatem.

4. It also seems so from what Gelasius says, XVII, question 4, where it is said that diligently. From this it seems that your care should faithfully examine the truth of affairs, so that neither religion may seem violated, nor a slave lying by this objection, strive to decline the rights of the rightful master, whom it is not certain to be a Christian, from the dominion of his master is not to be exempted. But the contrary seems true: a. From what is said in the Decretals, Multorum, where it is said: To no Jew. And it says that it is lawful to retain a Christian slave in his dominion, but, if any are found among them, let their freedom be preserved for them. Gregory: Whatever Christian slaves a Jew is found to have purchased, bring them without ambiguity to freedom according to the precepts of the laws, lest, God forbid, the Christian religion, made subject to the Jews, be polluted. b. Likewise, in dist. 54: No public offices are to be imposed on Jews by which they may be granted the punishment of inflicting upon Christians; let Christians have Jews as masters. But this was done so that to the Jews c. Likewise, it is found in the Decretals, On the Jews, where it is prohibited, To these things for all Christians. And this same thing is found there, when they expose themselves for some wage to the service of the Jews, as is continually said: Jews or Saracens, etc. But what reason is there that, on account of the Christian faith, the right over a slave should be taken away from him, since servitude was introduced by divine law and approved also by canon law? But the Christian religion does no wrong to anyone. [Solution]: To this it must be said that a Christian is not permitted to serve a Jew, on account of avoiding damage to the Christian religion, as is found in the Decretals, On the Jews, To these things for all, where it is said: The customs of the Jews and ours in no way agree. For this same reason also, if some, because of continual conversation and assiduous familiarity, are easily able to incline the minds of the simple to their superstition and faithlessness, and they themselves should be their slaves, let them be freed from their service, sometimes at a price being given, sometimes at no price being given. For a slave of a Jew is either homeborn or purchased. If homeborn, if he is or wishes to become a Christian, he is immediately snatched away into freedom, with no price given, as is found in the Code, On bishops, and dist. 54, Fraternitatem. But if he is purchased, either he was a Christian when he was bought or a pagan. If a Christian, he becomes free, with no price given; as is found in dist. 54, Mancipia, trade in Christians is forbidden to Jews, both by the law of the land and by the law of the forum. But if he was a pagan, either he was bought for the sake of service or for the sake of commerce. If for the sake of service, and he wishes to become a Christian, he becomes free without price, dist. 54, Fraternitatem. But in the second case, if within three months afterward he has not put him up for sale if he wishes to become a Christian, he is freed without price, because it is presumed that he bought him in order to serve. But if he has put him up for sale within that term and he wishes to become a Christian then or afterward, provided that the fault did not rest with the master so that he did not sell him, he is freed, the price of twelve solidi being returned by some Christian, dist. 54, Frater, and nitatem. Decretals, In the present council: If, however, a Jew shall circumcise one wishing to become a Christian, or shall imprint the mark of another sect, he is freed without price for the injury of his own body, dist. 54, Nulla, where it is said that if certain Christians have been defiled by them in Jewish rite or even circumcised, without the price being returned let them return to freedom and the Christian religion, but human law inflicts a heavier punishment. But what has been said about the slaves of the Jews can be said about the slaves of the Saracens: for the same suspicion and the same danger can exist in both. [To the objections]:

1. To the objection, however, on the contrary it must be said that that of the apostle is understood for the state of the primitive Church and so that unbelieving masters might be enticed to the conversion of faith through the services of faithful slaves. Hence the Gloss says: Rather, unbelieving masters are converted through the services of faithful slaves. But there is added there in the text: Lest the name of the Lord and doctrine be blasphemed. The Gloss: ‘As though of one invading what is another’s.’ According to that reasoning, it will seem to someone, and Christian doctrine will seem as if unjust, that it is also now so to be done. But to this it must be answered that another reason restores the pact. For now they ought not to serve, lest the name of the Lord be blasphemed; for thus Jews and pagans are inclined to this, that they may draw the faithful into faithlessness or apostasy. On account of which cohabitation with Jews and pagans, unless for the sake of preaching, is forbidden, lest the name of the Lord be blasphemed. Nor ought Christian doctrine on this account to seem unjust, since the caution of faith must be preferred to all.

2. To the second, however, it must be said that, although Christians may cultivate the landed estates of Jews, they ought not nevertheless to serve Jews in their house, lest bad familiarity be contracted. And from this they are not said rightly to be over them as over slaves, because they cannot transfer them to another place or to another service, as is said in the Decretals, On the Jews. And this was done in favor of Christians, not of Jews, that they may cultivate the landed estates or lands bought from Jews, because they had formerly lived in those lands.

3. To the third, however, it must be said that, although they may receive the price of servitude, nevertheless not for Christians already existing, but for pagans who wish to become Christians. For by the law of the land Christian slaves are freed from the service of Jews, lest there be danger to the Christian faith. In favor also of the Christian faith, to certain men wishing to receive Christianity freedom is granted.

4. But that which is said in XVII, question 4, does not expressly give to understand that he was a Christian, but that he said that he had been a Christian from infancy, and that the mark of circumcision had been impressed on him by the aforesaid lord, he would be freed. But if he was not a Christian, he is not to be freed from servitude by the fact that he has fled to the church, unless he wishes to become a Christian, and this canon seems to say this. Hence it is not introduced for the dominion of Jews, but for the dominion of Christians: for some wished to defraud their master of his own right, fleeing to the enclosures of the Church.

5. To the last it must be said that the catholic Church intends to do injury to no one, but has ordered this so that no injury be done to God; but injury would be done to God if faith in something were endangered on account of the observance of temporal justice.</p></blockquote>

e+precepts+of+the+laws%2C+lest%2C+God+forbid%2C+the+Christian+religion%2C+made+subject+to+the+Jews%2C+be+polluted.+b.+Likewise%2C+in+dist.+54%3A+No+public+offices+are+to+be+imposed+on+Jews+by+which+they+may+be+granted+the+punishment+of+inflicting+upon+Christians%3B+let+Christians+have+Jews+as+masters.+But+this+was+done+so+that+to+the+Jews+c.+Likewise%2C+it+is+found+in+the+Decretals%2C+On+the+Jews%2C+where+it+is+prohibited%2C+To+these+things+for+all+Christians.+And+this+same+thing+is+found+there%2C+when+they+expose+themselves+for+some+wage+to+the+service+of+the+Jews%2C+as+is+continually+said%3A+Jews+or+Saracens%2C+etc.+But+what+reason+is+there+that%2C+on+account+of+the+Christian+faith%2C+the+right+over+a+slave+should+be+taken+away+from+him%2C+since+servitude+was+introduced+by+divine+law+and+approved+also+by+canon+law%3F+But+the+Christian+religion+does+no+wrong+to+anyone.+%5BSolution%5D%3A+To+this+it+must+be+said+that+a+Christian+is+not+permitted+to+serve+a+Jew%2C+on+account+of+avoiding+damage+to+the+Christian+religion%2C+as+is+found+in+the+Decretals%2C+On+the+Jews%2C+To+these+things+for+all%2C+where+it+is+said%3A+The+customs+of+the+Jews+and+ours+in+no+way+agree.+For+this+same+reason+also%2C+if+some%2C+because+of+continual+conversation+and+assiduous+familiarity%2C+are+easily+able+to+incline+the+minds+of+the+simple+to+their+superstition+and+faithlessness%2C+and+they+themselves+should+be+their+slaves%2C+let+them+be+freed+from+their+service%2C+sometimes+at+a+price+being+given%2C+sometimes+at+no+price+being+given.+For+a+slave+of+a+Jew+is+either+homeborn+or+purchased.+If+homeborn%2C+if+he+is+or+wishes+to+become+a+Christian%2C+he+is+immediately+snatched+away+into+freedom%2C+with+no+price+given%2C+as+is+found+in+the+Code%2C+On+bishops%2C+and+dist.+54%2C+Fraternitatem.+But+if+he+is+purchased%2C+either+he+was+a+Christian+when+he+was+bought+or+a+pagan.+If+a+Christian%2C+he+becomes+free%2C+with+no+price+given%3B+as+is+found+in+dist.+54%2C+Mancipia%2C+trade+in+Christians+is+forbidden+to+Jews%2C+both+by+the+law+of+the+land+and+by+the+law+of+the+forum.+But+if+he+was+a+pagan%2C+either+he+was+bought+for+the+sake+of+service+or+for+the+sake+of+commerce.+If+for+the+sake+of+service%2C+and+he+wishes+to+become+a+Christian%2C+he+becomes+free+without+price%2C+dist.+54%2C+Fraternitatem.+But+in+the+second+case%2C+if+within+three+months+afterward+he+has+not+put+him+up+for+sale+if+he+wishes+to+become+a+Christian%2C+he+is+freed+without+price%2C+because+it+is+presumed+that+he+bought+him+in+order+to+serve.+But+if+he+has+put+him+up+for+sale+within+that+term+and+he+wishes+to+become+a+Christian+then+or+afterward%2C+provided+that+the+fault+did+not+rest+with+the+master+so+that+he+did+not+sell+him%2C+he+is+freed%2C+the+price+of+twelve+solidi+being+returned+by+some+Christian%2C+dist.+54%2C+Frater%2C+and+nitatem.+Decretals%2C+In+the+present+council%3A+If%2C+however%2C+a+Jew+shall+circumcise+one+wishing+to+become+a+Christian%2C+or+shall+imprint+the+mark+of+another+sect%2C+he+is+freed+without+price+for+the+injury+of+his+own+body%2C+dist.+54%2C+Nulla%2C+where+it+is+said+that+if+certain+Christians+have+been+defiled+by+them+in+Jewish+rite+or+even+circumcised%2C+without+the+price+being+returned+let+them+return+to+freedom+and+the+Christian+religion%2C+but+human+law+inflicts+a+heavier+punishment.+But+what+has+been+said+about+the+slaves+of+the+Jews+can+be+said+about+the+slaves+of+the+Saracens%3A+for+the+same+suspicion+and+the+same+danger+can+exist+in+both.+%5BTo+the+objections%5D%3A+1.+To+the+objection%2C+however%2C+on+the+contrary+it+must+be+said+that+that+of+the+apostle+is+understood+for+the+state+of+the+primitive+Church+and+so+that+unbelieving+masters+might+be+enticed+to+the+conversion+of+faith+through+the+services+of+faithful+slaves.+Hence+the+Gloss+says%3A+Rather%2C+unbelieving+masters+are+converted+through+the+services+of+faithful+slaves.+But+there+is+added+there+in+the+text%3A+Lest+the+name+of+the+Lord+and+doctrine+be+blasphemed.+The+Gloss%3A+%E2%80%98As+though+of+one+invading+what+is+another%E2%80%99s.%E2%80%99+According+to+that+reasoning%2C+it+will+seem+to+someone%2C+and+Christian+doctrine+will+seem+as+if+unjust%2C+that+it+is+also+now+so+to+be+done.+But+to+this+it+must+be+answered+that+another+reason+restores+the+pact.+For+now+they+ought+not+to+serve%2C+lest+the+name+of+the+Lord+be+blasphemed%3B+for+thus+Jews+and+pagans+are+inclined+to+this%2C+that+they+may+draw+the+faithful+into+faithlessness+or+apostasy.+On+account+of+which+cohabitation+with+Jews+and+pagans%2C+unless+for+the+sake+of+preaching%2C+is+forbidden%2C+lest+the+name+of+the+Lord+be+blasphemed.+Nor+ought+Christian+doctrine+on+this+account+to+seem+unjust%2C+since+the+caution+of+faith+must+be+preferred+to+all.+2.+To+the+second%2C+however%2C+it+must+be+said+that%2C+although+Christians+may+cultivate+the+landed+estates+of+Jews%2C+they+ought+not+nevertheless+to+serve+Jews+in+their+house%2C+lest+bad+familiarity+be+contracted.+And+from+this+they+are+not+said+rightly+to+be+over+them+as+over+slaves%2C+because+they+cannot+transfer+them+to+another+place+or+to+another+service%2C+as+is+said+in+the+Decretals%2C+On+the+Jews.+And+this+was+done+in+favor+of+Christians%2C+not+of+Jews%2C+that+they+may+cultivate+the+landed+estates+or+lands+bought+from+Jews%2C+because+they+had+formerly+lived+in+those+lands.+3.+To+the+third%2C+however%2C+it+must+be+said+that%2C+although+they+may+receive+the+price+of+servitude%2C+nevertheless+not+for+Christians+already+existing%2C+but+for+pagans+who+wish+to+become+Christians.+For+by+the+law+of+the+land+Christian+slaves+are+freed+from+the+service+of+Jews%2C+lest+there+be+danger+to+the+Christian+faith.+In+favor+also+of+the+Christian+faith%2C+to+certain+men+wishing+to+receive+Christianity+freedom+is+granted.+4.+But+that+which+is+said+in+XVII%2C+question+4%2C+does+not+expressly+give+to+understand+that+he+was+a+Christian%2C+but+that+he+said+that+he+had+been+a+Christian+from+infancy%2C+and+that+the+mark+of+circumcision+had+been+impressed+on+him+by+the+aforesaid+lord%2C+he+would+be+freed.+But+if+he+was+not+a+Christian%2C+he+is+not+to+be+freed+from+servitude+by+the+fact+that+he+has+fled+to+the+church%2C+unless+he+wishes+to+become+a+Christian%2C+and+this+canon+seems+to+say+this.+Hence+it+is+not+introduced+for+the+dominion+of+Jews%2C+but+for+the+dominion+of+Christians%3A+for+some+wished+to+defraud+their+master+of+his+own+right%2C+fleeing+to+the+enclosures+of+the+Church.+5.+To+the+last+it+must+be+said+that+the+catholic+Church+intends+to+do+injury+to+no+one%2C+but+has+ordered+this+so+that+no+injury+be+done+to+God%3B+but+injury+would+be+done+to+God+if+faith+in+something+were+endangered+on+account+of+the+observance+of+temporal+justice.%E2%80%9D%0A%0A%E2%80%94+Alexander+of+Hales%2C+Sum+of+Universal+Theology%2C+%28Paris%2C+1230-1245%29%2C+pt.+2+of+2%2C+inq.+3%2C+tract+8%2C+sect.+1%2C+quest.+1%2C+title+2+%7C+member+2+%7C+ch.+2%2C+%E2%80%98Whether+Jews+or+Pagans+can+Preside+over+Christians%3F%E2%80%99&amp;url=https%3A%2F%2F5solasquotes.github.io%2Fquote%2Fd0aac9ca2b.html&amp;via=5Solas" target="_blank" rel="noopener">Share on X</a><a class="perma" href="../quote/d0aac9ca2b.html">Permalink</a><a class="src" href="https://reformedbooksonline.com/topics/judaism#:~:text=Secondly%20it%20is%20asked%20whether%20Jews,of%20the%20observance%20of%20temporal%20justice&amp;text=Secondly%20it%20is%20asked%20whether%20Jews%20or%20pagans&amp;text=on%20account%20of%20the%20observance%20of%20temporal%20justice" rel="noopener" target="_blank">Read it online · Reformed Books Online</a></div>

<blockquote><p>On occasion of this question it is asked whether those who come to the Faith from the Jews are to be received quickly or not, and similarly it can be asked concerning pagans. And it seems that not: a. from the fact that it is said in dist. 4, On Consecration, Jews, where it is said that for eight months they should enter within the catechumens of the church this threshold, and, if they are known to come with pure faith, only then should they merit the grace of baptism; the same is found there, Lest, which God forbid, where it is said that abstinence for forty days is enjoined. In both places therefore a great space of time is given for probation and for the work of penance to be carried out. But the contrary seems true:

1. From the fact that it is said, Acts 2:38, where Peter speaks to the Jews, saying: ‘Repent, and let each one of you be baptized.’ Since therefore they were baptized quickly, by his example it does not seem that reception into the Faith, or the sacrament of Faith, which is Baptism, should be deferred so long.

2. Likewise it is found, Acts 10:47-48, where it is said by Peter: ‘Can anyone forbid water, so that those who have received the Holy Spirit should not be baptized? And he commanded them to be baptized in the name of Jesus Christ.’ Acts 8:36-38. From these things therefore it seems that so great a delay is not fitting. [Solution]: To which it must be said that things were otherwise in the primitive Church in part and otherwise in the progress of the Church. For in the primitive Church there was the gift of the Holy Spirit, which was also shown in a visible sign in believers; there were also other signs manifesting faith in them; on account of which it was not necessary to defer the sacrament of Faith. But in the progress of the Church, where there were no such signs showing or powerfully proving faith, and hypocrisy of heart was hidden or could be hidden, a delay of time was necessary, so that there might be a testing of faith and catechesis, through which there would be enabling for baptism. And therefore according to the different times a different term was appointed according to earlier and later, so that it might be clear concerning the enabling for faith and that the ease of returning to vomit might be removed in the judgment of a discerning prelate, according as more or less it shall seem expedient. But such a term is left to the judgment of a discerning prelate, according as more or less it shall seem expedient.</p></blockquote>

<blockquote><p>“46. Now there remains to speak somewhat particularly of Jews and heretics: for this kind of men are suffered almost in all cities, provinces and kingdoms, and they dwell together with Christians. Why the Jews should be suffered, Augustine among others brings certain reasons. He, Of the City of God, bk. 4, ch. 18, as also upon the 58th psalm and in other places, writes that therefore they be suffered because they before other men had the promise of salvation; neither are they past all hope, seeing that some of them many times, although few in number, do return unto Christ. ‘Blindness’ (says Paul unto the Romans) ‘fell partly upon Israel’ (Rom. 11:25): as though he would say not upon all. And to this the same apostle adds, ‘When the fulness of the gentiles is come in, then all Israel shall be saved.’ (Rom. 11:25-26) And lest peradventure thou shouldest think that these words are spoken allegorically, Paul writes them as a mystery. And to prove his saying he brings the prophecy of Isaiah the prophet, to wit, that ‘the iniquity shall be then taken away from Jacob.’ Furthermore, they be now called ‘enemies unto God for our sakes, but friends in respect of their fathers.’ The same Augustine, in his Questions upon the Gospel, bk. 2 and question 33 (if those be Augustine’s books) when he interprets the parable of the prodigal son, he says that that son does betoken the gentiles. For it is written, that he departed into a far country (Lk. 15:11); because the ethnics were so far departed from God as they worshipped idols publicly and in open profession. But the elder son, under whom is shadowed the Hebrew people, went not so far off. And although he were not within his father’s house, which is the church, yet nevertheless he abode in the field. For the Jews are occupied in the holy scriptures, which they understand not rightly, nor with such spiritual sense as the church of Christ does know them; but take them in an earthly and carnal manner, whereby not unaptly they be said to have their abode in the field. This elder son does not at the beginning enter into his father’s house, but in the latter days he shall also be called and come.

47. The same father also for the proof of this doctrine brings that which is written in the 59th psalm, as he reads it, ‘Do not kill them, lest they forget thy law, but scatter them in thy power.’ (v. 12) The Son of God (says he) prays unto the Father that the same nation might not be destroyed, but that it might wander every where in the world. Other provinces, when they were overcome of the Romans, followed the laws and rites of the Romans, so that at length they became Romans: but the Hebrews, notwithstanding they were overcome by the Romans, yet would they never yield unto their laws, rites and ceremonies. They still observe their own as much as they may; and being dispersed, they wander abroad. Neither have they utterly forgotten the law of God; not that the godly apply themselves to observe it, but do only read it and keep certain rites and ceremonies, whereby they are discerned from other nations. Verily it seems that God has put a sign upon them as He did upon Cain for killing his brother Abel, namely, that every man should not kill them. (Gen. 4:15) Neither is this scattering of them abroad in the world unprofitable unto the Christians, because (as it is written to the Romans) they are showed unto us as broken boughs. (Rom. 11:17) And for so much as we were grafted in their place, when as we see that they were so miserably cut off, we acknowledge the grace of God towards us: and by beholding of them be taught to take heed that for our infidelity’s sake, for the which they were broken off, we also be not cut off in like manner. Moreover, there is another commodity which comes unto us by the dispersing of them. Because our books are saved by them; I mean the holy Bible, which they carry everywhere about them and read it. And although because they be blinded they believe not, yet they confess that those writings are most true. Indeed they be in heart our deadly enemies; but yet by these books, which they have and reverence, they are a testimony to our religion. Wherefore I cannot marvel sufficiently at those which do so much hate the Jewish tongue and Bibles in Hebrew, as they desire to have them destroyed and burnt, seeing Augustine, On Christian Doctrine, thinks, that wheresoever we doubt of the Greek or Latin translation, we must flee unto the truth of the Hebrew. And Jerome in many places writes the same.

48. But they say that the holy books were abused and corrupted by the Hebrews. To this Jerome upon Isaiah, the sixth chapter, towards the end, answers thus: Either they did this before the coming of Christ and the preaching of the apostles, or else afterward. If a man will say that it was done of them before, then, seeing Christ and his apostles reprehended the most grievous wicked acts of the Jews, I marvel why they would say nothing of that sacrilege and so detestable a wicked act. Undoubtedly they would have reproved them for marring and corrupting of the scriptures. But if thou wilt affirm that the faults were brought in by them afterward: then will I say that it had behooved them to corrupt those places chiefly which do testify of Christ and of his religion; and which were alleged by the Lord Himself and his apostles in the New Testament. But those places remain sound; and the very same sentences which they cited do remain still in the Hebrew Bibles: for they were not so greatly careful for the words, and it is not likely, that they in other places have corrupted the holy scriptures. Yea, if a man diligently read over their books, he shall find in them a great many more testimonies, and those more plain and manifest, than our common translation has. Do they not read in the second psalm, ‘Kiss the son’: which our men have translated, ‘Take ye hold of discipline?’ Which words undoubtedly are referred unto Christ. But I do not mean at this present to bring all such like testimonies: it is sufficient if I prove with Jerome that the books of holy scriptures are not corrupted by the Hebrews. The which surely, if they would have done, yet had they missed of their purpose. For many of the most ancient books are found, and that in written hand, which have been kept a very long time by the Christians, which never came in their hands to abuse.

49. But let us return to discourse of that commodity, which Augustine has declared; There be very many (says he) which would peradventure think that the things which we affirm to be done of the ancient people and of the prophets were but vain and imagined by us, unless they saw the Jews yet alive, who with their books maintain that which we profess, whether they will or no. For although the Hebrews be blinded in their heart, and be against us with as much power as they can, yet we have themselves, together with their books, most evident testimonies of our religion. And doubtless, among all testimonies, that testimony is of greatest account, which is testified by the enemies. And of this kind of witnesses God has provided great store for his Church: for we not only have the Hebrew books to make on our side, but also the verses of the Sibyls, which were born in sundry countries. Neither must it be thought, that those verses were invented by our forefathers themselves: for in the time of Lactantius, Eusebius of Caesaria and Augustine, which alleged those verses, the books of the Sibyls were rife in every man’s hand. So as, if they had added any counterfeit verses unto them, the ethnics, which were then many in number and were full of eloquence, and deadly enemies unto our religion, would have reproved them as vain and lying. What then remains but that God would wonderfully defend his Church even by the testimonies of his adversaries? Now then, the Jews are tolerated among the Christians, partly for the promise’s sake, which they have of salvation to be given to their kindred, and partly because of the commodities, which I have now recited out of Augustine. Wherefore they be not only borne withal, but they have also synagogues where they openly read the books of the holy scripture and one with another do call upon the God of their fathers. In which thing nevertheless, the diligence of magistrates and bishops is to be required, who ought to provide that they do nothing else there, and by all means to beware that in their public prayers, exhortations and sermons they do not curse nor rail upon Christ our God. And this, if our magistrates and bishops do not look unto, they cannot escape a just accusation. But it is not lawful to grant unto the Turks any religious assemblies, for that they have not any particular promise of their salvation: neither would they read there either the Old Testament or the New, but only their most detestable Al Koran. Over this, the Jews should be prohibited to exercise false bargaining and usury among Christians, thereby to vex and afflict the poor Christians before our face: the which cannot be done without great indignity. But our princes exact a good, great tribute of them; and of those gains which come by usury and naughty bargaining, they obtain great prey: so far are they from forbidding them these evil arts. Furthermore (a thing no less hurtful), they provide not to have them taught, when as they ought to compel them to come often to godly Christian sermons: otherwise, while they be so negligently left, they become daily worse and worse. Whereby, either naughty fruit or in a manner none at all can be looked for by the conversation which they have among Christians. It must also be looked diligently to that they corrupt not Christians in seducing them to their Jewish religion. By reason of neglecting hereof, the heresy of the Marrans has much increased, specially in Spain. Moreover, it is meet that they may by some apparel or certain token be known from Christians, lest any unwittingly should be familiar with them no less than with the Christians. And these things shall suffice concerning this sort of infidels.</p></blockquote>

+from+God+as+they+worshipped+idols+publicly+and+in+open+profession.+But+the+elder+son%2C+under+whom+is+shadowed+the+Hebrew+people%2C+went+not+so+far+off.+And+although+he+were+not+within+his+father%E2%80%99s+house%2C+which+is+the+church%2C+yet+nevertheless+he+abode+in+the+field.+For+the+Jews+are+occupied+in+the+holy+scriptures%2C+which+they+understand+not+rightly%2C+nor+with+such+spiritual+sense+as+the+church+of+Christ+does+know+them%3B+but+take+them+in+an+earthly+and+carnal+manner%2C+whereby+not+unaptly+they+be+said+to+have+their+abode+in+the+field.+This+elder+son+does+not+at+the+beginning+enter+into+his+father%E2%80%99s+house%2C+but+in+the+latter+days+he+shall+also+be+called+and+come.+47.+The+same+father+also+for+the+proof+of+this+doctrine+brings+that+which+is+written+in+the+59th+psalm%2C+as+he+reads+it%2C+%E2%80%98Do+not+kill+them%2C+lest+they+forget+thy+law%2C+but+scatter+them+in+thy+power.%E2%80%99+%28v.+12%29+The+Son+of+God+%28says+he%29+prays+unto+the+Father+that+the+same+nation+might+not+be+destroyed%2C+but+that+it+might+wander+every+where+in+the+world.+Other+provinces%2C+when+they+were+overcome+of+the+Romans%2C+followed+the+laws+and+rites+of+the+Romans%2C+so+that+at+length+they+became+Romans%3A+but+the+Hebrews%2C+notwithstanding+they+were+overcome+by+the+Romans%2C+yet+would+they+never+yield+unto+their+laws%2C+rites+and+ceremonies.+They+still+observe+their+own+as+much+as+they+may%3B+and+being+dispersed%2C+they+wander+abroad.+Neither+have+they+utterly+forgotten+the+law+of+God%3B+not+that+the+godly+apply+themselves+to+observe+it%2C+but+do+only+read+it+and+keep+certain+rites+and+ceremonies%2C+whereby+they+are+discerned+from+other+nations.+Verily+it+seems+that+God+has+put+a+sign+upon+them+as+He+did+upon+Cain+for+killing+his+brother+Abel%2C+namely%2C+that+every+man+should+not+kill+them.+%28Gen.+4%3A15%29+Neither+is+this+scattering+of+them+abroad+in+the+world+unprofitable+unto+the+Christians%2C+because+%28as+it+is+written+to+the+Romans%29+they+are+showed+unto+us+as Lord+Himself+and+his+apostles+in+the+New+Testament.+But+those+places+remain+sound%3B+and+the+very+same+sentences+which+they+cited+do+remain+still+in+the+Hebrew+Bibles%3A+for+they+were+not+so+greatly+careful+for+the+words%2C+and+it+is+not+likely%2C+that+they+in+other+places+have+corrupted+the+holy+scriptures.+Yea%2C+if+a+man+diligently+read+over+their+books%2C+he+shall+find+in+them+a+great+many+more+testimonies%2C+and+those+more+plain+and+manifest%2C+than+our+common+translation+has.+Do+they+not+read+in+the+second+psalm%2C+%E2%80%98Kiss+the+son%E2%80%99%3A+which+our+men+have+translated%2C+%E2%80%98Take+ye+hold+of+discipline%3F%E2%80%99+Which+words+undoubtedly+are+referred+unto+Christ.+But+I+do+not+mean+at+this+present+to+bring+all+such+like+testimonies%3A+it+is+sufficient+if+I+prove+with+Jerome+that+the+books+of+holy+scriptures+are+not+corrupted+by+the+Hebrews.+The+which+surely%2C+if+they+would+have+done%2C+yet+had+they+missed+of+their+purpose.+For+many+of+the+most+ancient+books+are+found%2C+and+that+in+written+hand%2C+which+have+been+kept+a+very+long+time+by+the+Christians%2C+which+never+came+in+their+hands+to+abuse.+49.+But+let+us+return+to+discourse+of+that+commodity%2C+which+Augustine+has+declared%3B+There+be+very+many+%28says+he%29+which+would+peradventure+think+that+the+things+which+we+affirm+to+be+done+of+the+ancient+people+and+of+the+prophets+were+but+vain+and+imagined+by+us%2C+unless+they+saw+the+Jews+yet+alive%2C+who+with+their+books+maintain+that+which+we+profess%2C+whether+they+will+or+no.+For+although+the+Hebrews+be+blinded+in+their+heart%2C+and+be+against+us+with+as+much+power+as+they+can%2C+yet+we+have+themselves%2C+together+with+their+books%2C+most+evident+testimonies+of+our+religion.+And+doubtless%2C+among+all+testimonies%2C+that+testimony+is+of+greatest+account%2C+which+is+testified+by+the+enemies.+And+of+this+kind+of+witnesses+God+has+provided+great+store+for+his+Church%3A+for+we+not+only+have+the+Hebrew+books+to+make+on+our+side%2C+but+also+the+verses+of+the+Sibyls%2C+which+were+born+in+sundry+countries.+Neither+must+it+be+thought%2C+that+those+verses+were+invented+by+our+forefathers+themselves%3A+for+in+the+time+of+Lactantius%2C+Eusebius+of+Caesaria+and+Augustine%2C+which+alleged+those+verses%2C+the+books+of+the+Sibyls+were+rife+in+every+man%E2%80%99s+hand.+So+as%2C+if+they+had+added+any+counterfeit+verses+unto+them%2C+the+ethnics%2C+which+were+then+many+in+number+and+were+full+of+eloquence%2C+and+deadly+enemies+unto+our+religion%2C+would+have+reproved+them+as+vain+and+lying.+What+then+remains+but+that+God+would+wonderfully+defend+his+Church+even+by+the+testimonies+of+his+adversaries%3F+Now+then%2C+the+Jews+are+tolerated+among+the+Christians%2C+partly+for+the+promise%E2%80%99s+sake%2C+which+they+have+of+salvation+to+be+given+to+their+kindred%2C+and+partly+because+of+the+commodities%2C+which+I+have+now+recited+out+of+Augustine.+Wherefore+they+be+not+only+borne+withal%2C+but+they+have+also+synagogues+where+they+openly+read+the+books+of+the+holy+scripture+and+one+with+another+do+call+upon+the+God+of+their+fathers.+In+which+thing+nevertheless%2C+the+diligence+of+magistrates+and+bishops+is+to+be+required%2C+who+ought+to+provide+that+they+do+nothing+else+there%2C+and+by+all+means+to+beware+that+in+their+public+prayers%2C+exhortations+and+sermons+they+do+not+curse+nor+rail+upon+Christ+our+God.+And+this%2C+if+our+magistrates+and+bishops+do+not+look+unto%2C+they+cannot+escape+a+just+accusation.+But+it+is+not+lawful+to+grant+unto+the+Turks+any+religious+assemblies%2C+for+that+they+have+not+any+particular+promise+of+their+salvation%3A+neither+would+they+read+there+either+the+Old+Testament+or+the+New%2C+but+only+their+most+detestable+Al+Koran.+Over+this%2C+the+Jews+should+be+prohibited+to+exercise+false+bargaining+and+usury+among+Christians%2C+thereby+to+vex+and+afflict+the+poor+Christians+before+our+face%3A+the+which+cannot+be+done+without+great+indignity.+But+our+princes+exact+a+good%2C+great+tribute+of+them%3B+and+of+those+gains+which+come+by+usury+and+naughty+bargaining%2C+they+obtain+great+prey%3A+so+far+are+they+from+forbidding+them+these+evil+arts.+Furthermore+%28a+thing+no+less+hurtful%29%2C+they+provide+not+to+have+them+taught%2C+when+as+they+ought+to+compel+them+to+come+often+to+godly+Christian+sermons%3A+otherwise%2C+while+they+be+so+negligently+left%2C+they+become+daily+worse+and+worse.+Whereby%2C+either+naughty+fruit+or+in+a+manner+none+at+all+can+be+looked+for+by+the+conversation+which+they+have+among+Christians.+It+must+also+be+looked+diligently+to+that+they+corrupt+not+Christians+in+seducing+them+to+their+Jewish+religion.+By+reason+of+neglecting+hereof%2C+the+heresy+of+the+Marrans+has+much+increased%2C+specially+in+Spain.+Moreover%2C+it+is+meet+that+they+may+by+some+apparel+or+certain+token+be+known+from+Christians%2C+lest+any+unwittingly+should+be+familiar+with+them+no+less+than+with+the+Christians.+And+these+things+shall+suffice+concerning+this+sort+of+infidels.%E2%80%9D%0A%0A%E2%80%94+Peter+Martyr+Vermigli%2C+Common+Places%2C+II.2.26%2C+%E2%80%A6+%28d.+1562%3B+London%3A+Henrie+Denham+et+al.%2C+1583%29%2C+pt.+2%2C+ch.+4%2C+%E2%80%98The+First+Precept%2C+where+is+entreated+of+Idolatry%2C+and+sundry+kinds+of+Idols%E2%80%99%2C+%E2%80%98Of+the+Suffering+of+Jews+%26+Heretics%E2%80%99%2C+pp.+328-30&amp;url=https%3A%2F%2F5solasquotes.github.io%2Fquote%2F9401c9b669.html&amp;via=5Solas" target="_blank" rel="noopener">Share on X</a><a class="perma" href="../quote/9401c9b669.html">Permalink</a><a class="src" href="https://reformedbooksonline.com/topics/judaism#:~:text=46.%20Now%20there%20remains%20to%20speak,suffice%20concerning%20this%20sort%20of%20infidels&amp;text=46.%20Now%20there%20remains%20to%20speak%20somewhat%20particularly&amp;text=things%20shall%20suffice%20concerning%20this%20sort%20of%20infidels" rel="noopener" target="_blank">Read it online · Reformed Books Online</a></div>

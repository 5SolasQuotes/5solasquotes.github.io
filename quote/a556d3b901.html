<main class="wrap"><figure class="quote" id="q-a556d3b901" data-kw="">
<blockquote><p>…they gloried in the mere knowledge of it: to obviate this mistake, he declares that the hearing of the law or any knowledge of it is of no such consequence, that any one should on that account lay claim to righteousness, but that works must be produced, according to this saying, “He who will do these shall live in them.” The import then of this verse is the following, — “That if righteousness be sought from the law, the law must be fulfilled; for the righteousness of the law consists in the perfection of works.” They who pervert this passage for the purpose of building up justification by works, deserve most fully to be laughed at even by children. It is therefore improper and beyond what is needful, to introduce here a long discussion on the subject, with the view of exposing so futile a sophistry: for the Apostle only urges here on the Jews what he had mentioned, the decision of the law, — That by the law they could not be justified, except they fulfilled the law, that if they transgressed it, a curse was instantly pronounced on them. Now we do not deny but that perfect righteousness is prescribed in the law: but as all are convicted of transgression, we say that another righteousness must be sought. Still more, we can prove from this passage that no one is justified by works; for if they alone are justified by the law who fulfill the law, it follows that no one is justified; for no one can be found who can boast of having fulfilled the law.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/john-calvin.html">John Calvin</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Commentary on Romans</cite>, (1540).</span></figcaption>

</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-c383488416" data-kw="">
<blockquote><p>He who errs in this doctrine errs to his eternal destruction. The devil is therefore continually engaged in denying, perverting, and obscuring the truth expressed in this chapter and, if he does not accomplish this, to prevent exercise concerning this truth. When new errors appear on the horizon, even when they initially do not pertain to justification at all, they in time will eventually culminate in affecting this doctrine. One must therefore be all the more earnest to properly understand, defend, and meditate upon this doctrine.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/wilhelmus-a-brakel.html">Wilhelmus à Brakel</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Christian’s Reasonable Service</cite>, (Grand Rapids: Reformation Heritage Books, repr. 2015), 2:341.</span></figcaption>

</figure><figure class="quote" id="q-ec8337d7c9" data-kw="">
<blockquote><p>We further say that good works justify us in St. James’s sense, Jm. 2:14. There is a double justification: 1. A justification of a man from sin in the sight of God. 2. Of a Christian from hypocrisy in the sight of both God and man; the first way a man is justified only by the blood of Christ; the second way by good works; for we must know a man’s conscience has two burdens. 1. My sins are great and liable to damnation; how shall I be acquit of that? From this our own works cannot justify us; it is done only by the blood of Christ. 2. I: But the blood of Christ cleanses only true Christians that are in Christ and have true grace; but you are an hypocrite; how shall I now be quit from the imputation of hypocrisy? In that I am justified by my works, let it appear to myself and others that I have lived in all uprightness, 2 Cor. 1:12; so that justification from hypocrisy before God and man is from the witness of my upright and unblameable life, so that I am justified from a double accusation: from the one by one way, from the other by another way. I am a sinner, that I cannot deny; my best works are sinful; therefore from that I am justified only by the blood of Christ. But Christ’s blood belongs not to you; you are an hypocrite; now how shall I know the sincerity of faith but from the fruits, which is an holy and righteous life, so that if I walk so, I justify myself from that imputation. How does Hezekiah help himself when God spake bitter things? ‘Remember how I have walked before Thee with an upright heart,’ 2 Jn. 3; Isa. 53:11. How do I know that I know Him? Why if I keep his commandments; therefore we say that an holy life is an evident sign of our fellowship with God: it glorifies God; it stops slanders and brings on others; and besides all this, a godly life will justify us from hypocrisy.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/john-cotton.html">John Cotton</a></span><span class="wk"><span class="lbl">Work:</span> <cite>A Practical Commentary, or an Exposition with Observations, Reasons, and uses upon the First Epistle General of John</cite>, … upon the First Epistle General of John (d. 1652; London: 1658), on 1 Jn. 1:7, “Doctrine: To walk in the light is a certain mark of true fellowship with God”, p. 31</span></figcaption>

</figure><figure class="quote" id="q-3024f40bc6" data-kw="">
<blockquote><p>From this, also, we infer, that we cannot be justified freely through faith alone without at the same time living holily. For these fruits of grace are connected together, as it were, by an indissoluble tie, so that he who attempts to sever them does in a manner tear Christ in pieces. Let therefore the man who seeks to be justified through Christ, by God&#x27;s unmerited goodness, consider that this cannot be attained without his taking him at the same time for sanctification, or, in other words, being renewed to innocence and purity of life.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/john-calvin.html">John Calvin</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Commentary on 1 &amp; 2 Corinthians</cite>, 1 Corinthians 1:30</span></figcaption>

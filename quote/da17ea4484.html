<main class="wrap"><figure class="quote" id="q-da17ea4484" data-kw="">
<blockquote><p>If it be said, The fathers may engage the posterity by an oath to surrender themselves as loyal subjects to the man who justly and deservedly made the fathers vassals by the title of the sword of justice, I answer: The fathers may indeed dispose of the inheritance of their children, because that inheritance belongs to the father as well as to the son; but because the liberty of the son being born with the son (all men being born free from all civil subjection), the father has no more power to resign the liberty of his children than their lives; and the father, as a father, has not power of the life of his child; as a magistrate he may have power, and, as something more than a father, he may have power of life and death. I hear not what Grotius says, ‘Those who are not born have no accidents, and so no rights, Non entis nulla sunt accidentia [There are no accidents of non-being]; then children not born have neither right nor liberty.” And so no injury (may some say) can be done to children not born, though the fathers should give away their liberty to the conquerors — those who are not capable of law are not capable of injury contrary to law. Answer: There is a virtual alienation of rights and lives of children not born unlawful, because the children are not born. To say that children not born are not capable of law and injuries virtual, which become real in time, might say, Adam did not any injury to his posterity by his first sin, which is contrary to God’s word; so those who vowed yearly to give seven innocent children to the Minotaur to be devoured, and to kill their children not born to bloody Molech, did no acts of bloody injury to their children; nor can any say, then, that fathers cannot tie themselves and their posterity to a king by succession. But I say, to be tied to a lawful king is no making away of liberty, but a resigning of a power to be justly governed, protected and awed from active and passive violence.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/samuel-rutherford.html">Samuel Rutherford</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Lex Rex</cite>, ... (1644; Edinburgh: Ogle, 1843), p. 49</span></figcaption>

<blockquote><p>2. Calvin thinks their vow not lawful. Bucanus, Polyander and Willet think it the lawful vow of the Nazarites, commanded [in] Num. 6. What then? if by God’s Law of the Nazarites, they abstained from wine and the Passover? God is above his own Law… 3. How prove ye, they abstained from the Passover? being so divine a law, might not their vow suffer an exception for a greater law in eating the Passover? I think it might, for in case of necessity they [the Rechabites] came and dwelt at Jerusalem for fear of the army of the Chaldeans, Jer. 35:11, and yet their vow was to dwell in tents.</p></blockquote>

<blockquote><p>The Prelate [John Maxwell] objects out of Spalato, Arnisaeus and Hugo Grotius… All government and superiority in rulers is not primely and only for the subjects’ good; for some are by God and nature appointed for the mutual and inseparable good of the superior and inferior, as in the government of husband and wife, or father and son; and in herili dominio, in the government of a lord and his servant, the good and benefit of the servant is but secondary and consecutively intended, it is not the principal end, but the external and adventitious [end], as the gain that comes to a physician is not the proper and internal end of his art, but follows only from his practice of medicine.</p></blockquote>

</figure><figure class="quote" id="q-c5c9d752b4" data-kw="">
<blockquote><p>If a people, trusting in the goodness of their prince, enslave themselves to him, and he shall after[ward] turn [a] tyrant, a rash and temerarious surrender obliges not, Et ignorantia facit factum quasi involuntarium. Ignorance makes the fact some way involuntary; for if the people had believed that a meek king would have turned a roaring lion, they should not have resigned their liberty into his hand; and, therefore, the surrender was tacitly conditional to the king as meek, or whom they believed to be meek, and not to a tyrannous lord; and, therefore, when the contract is made for the utility of the one party, the law says, their place is for after wits, that men may change their mind and resume their liberty, though, if they had given away their liberty for money, they cannot recall it; and if violence made the surrender of liberty, here is slavery; and slaves taken in war, so soon as they can escape and return to their own, they are free. (D. Sect. item, ea justit. de rerum divin. I. nihil. F. de rapt. I. 3). So the learned Ferdin. Vasquez (illust. bk. 2, ch. 82, n. 15) says, “The bird that was taken, and has escaped, is free.” Nature in a forced people, so soon as they can escape from a violent conqueror, makes them a free people; and si solo tempore (says Ferd. Vasquez, bk. 2, ch. 82, n. 6) justificatur subjectio, solo tempore facilius justificabitur liberatio.</p></blockquote>

<main class="wrap"><figure class="quote" id="q-3547270b20" data-kw="">
<blockquote><p>Edward Bagshaw, p. 18: ‘His own free-will has not the least power to receive the things of God. [1 Cor,. 2:14]’ Richard Baxter: 1. What not sanctified free-will? 2. What! not a receiving obediential power? A receiving power is a passive power (as it is strictly taken). Has a free-agent less power to receive grace than a marble to receive the engraving of the workman? Does no man ever receive grace? Or do they receive what they cannot receive? Has a man no more receptive power than a block or stone? I know it’s said ‘The natural man receiveth not, etc.’ [1 Cor,. 2:14], that is, understands not, believes not, and loves not in sensu composito [in a combined sense]: But its never said that, ‘Our free-will has not the least power to receive.’</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/richard-baxter.html">Richard Baxter</a></span><span class="wk"><span class="lbl">Work:</span> <cite>A Second Admonition to Mr. Edward Bagshaw… (London: Simmons, 1671), section 56</cite>, pp. 139-40</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/free-will-and-inability/liberty-and-necessity.html">Liberty and Necessity</a></span></div>

</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-a2c9fd1361" data-kw="">
<blockquote><p>Luther and his followers, who had at first made some very absolute and exaggerated statements in the way of denying free will altogether, came afterwards to attach much importance to a distinction between man’s freedom in things external, civil, and moral, and his freedom in things properly spiritual, and they embodied this distinction in the Confession of Augsburg (ch. 18).</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/william-cunningham.html">William Cunningham</a></span><span class="wk"><span class="lbl">Work:</span> <cite>‘Calvinism &amp; the Doctrine of Philosophical Necessity’ in The Reformers &amp; the Theology of the Reformation</cite></span></figcaption>
<div class="meta"><span class="t"><a href="../topics/free-will-and-inability/liberty-and-necessity.html">Liberty and Necessity</a></span></div>
<div class="actions"><button class="copy" data-copy="“Luther and his followers, who had at first made some very absolute and exaggerated statements in the way of denying free will altogether, came afterwards to attach much importance to a distinction between man’s freedom in things external, civil, and moral, and his freedom in things properly spiritual, and they embodied this distinction in the Confession of Augsburg (ch. 18).”

— William Cunningham, ‘Calvinism &amp; the Doctrine of Philosophical Necessity’ in The Reformers &amp; the Theology of the Reformation">Copy</button><a class="share" href="https://x.com/intent/post?text=%E2%80%9CLuther+and+his+followers%2C+who+had+at+first+made+some+very+absolute+and+exaggerated+statements+in+the+way+of+denying+free+will+altogether%2C+came+afterwards+to+attach+much+importance+to+a+distinction+between+man%E2%80%99s+freedom+in+things+external%2C+civil%2C+and+moral%2C+and+his+freedom+in+things+properly+spiritual%2C+and+they+embodied+this+distinction+in+the+Confession+of+Augsburg+%28ch.+18%29.%E2%80%9D%0A%0A%E2%80%94+William+Cunningham%2C+%E2%80%98Calvinism+%26+the+Doctrine+of+Philosophical+Necessity%E2%80%99+in+The+Reformers+%26+the+Theology+of+the+Reformation&amp;url=https%3A%2F%2F5solasquotes.github.io%2Fquote%2Fa2c9fd1361.html&amp;via=5Solas" target="_blank" rel="noopener">Share on X</a><a class="perma" href="../quote/a2c9fd1361.html">Permalink</a><a class="src" href="https://reformedbooksonline.com/the-reformed-freedom-of-the-will-vs-philosophical-necessity/#:~:text=Luther%20and%20his%20followers%2C%20who%20had,the%20Confession%20of%20Augsburg%20%28ch.%2018%29." rel="noopener" target="_blank">Read it online · Reformed Books Online</a></div>
</figure><figure class="quote" id="q-5b6fc015ca" data-kw="">
<blockquote><p>52. Because nothing is done without a sufficient Reason (sect. 1), also liberty in election cannot act without reason, we therefore define the same as that faculty of the mind to elect or choose out of more possible things what one pleases, agreeable to proposed reasons. Hence all coaction [coercion] by which man is compelled thorugh extrinsical violence is at a great distance from liberty; metaphysical necessity, where there is but one only object possible, and consequently election ceases, has nothing to do with liberty; also physical necessity (i.e. natural necessity), when there is no knowledge of the objects, is far distant from liberty (or is utterly inconsistent with the very nature of it); but there is only a moral necessity, which is no more than a certainty so that man is sweetly and willingly inclined or moved to this or that thing from these or other motives, namely because he sees what things are best. 53. Hence since liberty of indifference is repugnant to the principle of a sufficient reason, it is utterly impossible (i.e. there is no liberty of indifference); it is a chimera (or a groundless and vain imagination which has no foundation in reason or nature); it is nothing but the mere inaction of the will; besides let those who maintain an indifference of the equilibrium in liberty (or those who place the essence of liberty in the indifference of the will), let them answer us (let them reply to the following queries, viz.), Whether God, the (holy) angels and all the inhabitants of heaven are not most free, or act with the most perfect liberty? and whether they are indifferent about good and evil?</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/daniel-wyttenbach.html">Daniel Wyttenbach</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Theological Theses, containing the Chief Heads of the Christian Doctrine, Deduced from Axioms… (1747; NY: Samuel Brown, 1766)</cite>, pp. 24-25</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/free-will-and-inability/liberty-and-necessity.html">Liberty and Necessity</a></span></div>

</figure><figure class="quote" id="q-9b52c99742" data-kw="">
<blockquote><p>In his ‘Metaphysical investigations’ [appended to his Treatise on Providence, see the table of contents], Rutherford argues that God’s being is the first principle of all things… the law of non-contradiction cannot be the very first principle. The law of non-contradiction in complex, not simple… Possibilia are grounded in God’s omnipotence. God likewise becomes the ‘Lord of impossibilities, by creating the specific forms of things from which incompossibilities result.’ Accordingly, it is important to note that ‘all possibilia are possible because God is omnipotent; God is not, conversely omnnipotent because they are in themselves and intrinsically possible.’… Rutherford gives an affirmative answer to the question ‘whether God is the origin and cause of impossibilia and possibilia‘… Another question that Rutherford addresses is ‘whether possibilia are something real’. They are not, according to Rutherford, since they are just called ‘possible’ by a merely external reference to God’s omnipotence. Possibilia are, as their name suggests, merely ‘in potency’, not actually existing…</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/aza-goudriaan.html">Aza Goudriaan</a></span><span class="wk"><span class="lbl">Work:</span> <cite>‘Samuel Rutherford on the Divine Origin of Possibility’ being ch. 8 in ed. Denlinger, Reformed Orthodoxy in Scotland: Essays on Scottish Theology 1560-1775</cite>, pp. 142-3, 145</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/free-will-and-inability/liberty-and-necessity.html">Liberty and Necessity</a></span></div>

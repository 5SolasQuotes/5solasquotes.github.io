<main class="wrap"><figure class="quote" id="q-98f1528e12" data-kw="">
<blockquote><p>It has been claimed that confessions were originally a statement of faith but were modified by the Roman Catholic Church into statements of what is to be confessed. “We believe” (Nicea) became “we teach that this is to be confessed” (Chalcedon) and finally “whoever does not believe… is condemned” (Athanasian Creed). With the adoption of anti-heretical creeds, binding to such creeds by means of subscription was also introduced. According to Schaff, the signing of the Creed adopted by the Council of Nicea (AD 325) is “the first instance of such signing of a document in the Christian Church.” Also worth mentioning is the seventh canon of the council of Laodicea (AD 364) which states that heretics are “to have thoroughly learned the symbols of faith.” In 1273 or 1274 the deputies sent from the Eastern Church to the Council of Lyons II were obliged to subscribe the unchanged NiceneConstantinopolitan Creed. It would thus seem that the custom of subscribing credal formulas is as old as the oldest extant credal formula adopted by an ecumenical council. It would be wrong, however, to assume that subscription as a custom was identical in both the Western and Eastern Churches. In the Western Church it was commonly practised. However, though the Eastern or Orthodox Church considers the decisions of the seven ecumenical councils to have credal authority, it does not have a tradition of confessions and subscription like that found in the Catholic and Protestant traditions. An authority on Orthodoxy states it as follows: ‘At a true Ecumenical Council the bishops recognize what the truth is and proclaim it; this proclamation is then verified by the assent of the whole Christian people, an assent which is not, as a rule, expressed formally and explicitly, but lived.&#x27;</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/roelf-christiaan-janssen.html">Roelf Christiaan Janssen</a></span><span class="wk"><span class="lbl">Work:</span> <cite>‘The Credal Period’ in By this our Subscription: Confessional Subscription in the Dutch Reformed Tradition since 1816 PhD diss</cite>, (Theologische Universiteit, Gereformeerde Kerken, 2009), pp. 16-17</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/the-church/creeds-confessions-and-councils.html">Creeds, Confessions and Councils</a></span></div>

</figure><figure class="quote" id="q-4a00019d58" data-kw="">
<blockquote><p>1. It has been already declared (yea, adjudged) that, by that statute [the Act of Parliament in the 13th year of Elizabeth], there is no liberty for any man to subscribe the [39] Articles with any limitation, or explication, if any credit be given to Sir Edward Cook, who says (Institutes, 4.47, p. 324, ed. 1658), that he has heard Wray, chief Justice in the King’s Bench, Pasch. 23 Elizabeth (quoting Dier 23 Elizabeth, 377, bk. 6, fol. 69, Grene’s Case, Smith’s Case) report that where one Smith subscribed to the said 39 Articles of Religion with this addition, ‘so far forth as the same were agreeable to the Word of God,’ that it was resolved by him and all the judges of England that this subscription was not according to the Statute of 13th Elizabeth, because the statute required an absolute subscription, and this subscription made it conditional; and that this act was made for avoiding diversities of opinions, etc. And, by this addition the party might by his own private opinion take some of them to be against the Word of God: and by this means diversities of opinions should not be avoided, which was the scope of the statute; and the very act itself made touching subscription, hereby [be] of none effect. Thus, he.

2. This shows a necessity of repealing that branch of the act, so far as it concerns subscription, because: 1. If we may not subscribe with such an addition, ‘so far forth as the same Articles are agreeable to God’s Word,’ it must needs be granted that the composers of them are admitted to be infallible; and their Articles, of equal authority with canonical Scripture: or else that the statute intended to tyrannize over the consciences of men, which is not to be imagined.</p></blockquote>

<blockquote><p>§31. p. 356, etc. Rule 23. [The opponent said:] ‘Subscription to Articles and forms of Confession in any particular Church is wholly of political consideration.’ Subscription ought to be so intended that he who has subscribed may not perceive himself taken in a snare: but yet he that subscribes must do it to those purposes and in that sense and signification of things which the supreme power intends in commanding it; that is, at least that he that subscribes do actually approve the Articles overwritten: that he does at that time believe them to be such as it’s said they are; i.e. true, if they only say they are true; useful, if they pretend to usefulness; necessary, if it be affirmed that they are necessary. For if the subscriber believes not this, he by hypocrisy serves [only] the ends of public peace and his own preferment. When Articles are established without necessity [i.e. the establishment of non-necessary articles], subscription must be required without tyranny and imperiousness. That is, it must be left to the liberty of the subject to profess or not profess that doctrine. To bring evil on men that do not believe the Article and dare not profess to believe what they do not, is injustice and oppression; it is a law of iniquity, and therefore it is not obligatory to conscience, and no human authority is sufficient for the sanction and imposition. Question: Can it be lawful for any man to subscribe what he does not believe to be true, giving his hand to public peace and keeping his conscience for God? Answer: No, if subscription signify approbation; for in that case it is hypocrisy, etc. But if subscription were no more than the office of a clerk of the signet or council, who in form of law is to sign all the acts of the council, it were different. For it is not as an account of his own opinion, but as a formality of the court: all the world looks on it as none of his personal act. But in subscription to Articles of Confession every ecclesiastic that subscribes does it for himself, lubens et ex animo subscripsi [‘I have subscribed willingly and from the heart’], is our form in the Church of England. If the intention of our superior be to require our assent, he that subscribes does profess his assent; and whatever he thinks himself, it is the intention of the imposer that qualifies the subscription. No particular Church ought with rigor to require subscriptions to Articles not evidently true and necessary to be professed: because in the division of hearts that is in the world, it is certain that some good men may dissent, and then either they shall be afflicted or tempted to hypocrisy: of either of which if ecclesiastic laws be guilty, they are not for edification: they are neither just, nor pious, and therefore oblige not. §32. pp. 358-59, ‘At least let the Articles be made with as great latitude of sense as they can and so that subscriptions be made to the form of words; let the subscribers understand them in what sense they please which the truth of God will suffer and the words can be capable of.’ This is the last remedy; but it is the worst: It has in it something of craft, but very little of ingenuity; and if it can serve the ends of peace or of external charity, or of fantastic concord [a concord of the fantasy], yet it cannot serve the ends of truth and holiness, and Christian simplicity.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/richard-baxter.html">Richard Baxter</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Non-Conformists’ Plea for Peace, pt</cite>, 2</span></figcaption>

<div class="actions"><button class="copy" data-copy="“§31. p. 356, etc. Rule 23. [The opponent said:] ‘Subscription to Articles and forms of Confession in any particular Church is wholly of political consideration.’ Subscription ought to be so intended that he who has subscribed may not perceive himself taken in a snare: but yet he that subscribes must do it to those purposes and in that sense and signification of things which the supreme power intends in commanding it; that is, at least that he that subscribes do actually approve the Articles overwritten: that he does at that time believe them to be such as it’s said they are; i.e. true, if they only say they are true; useful, if they pretend to usefulness; necessary, if it be affirmed that they are necessary. For if the subscriber believes not this, he by hypocrisy serves [only] the ends of public peace and his own preferment. When Articles are established without necessity [i.e. the establishment of non-necessary articles], subscription must be required without tyranny and imperiousness. That is, it must be left to the liberty of the subject to profess or not profess that doctrine. To bring evil on men that do not believe the Article and dare not profess to believe what they do not, is injustice and oppression; it is a law of iniquity, and therefore it is not obligatory to conscience, and no human authority is sufficient for the sanction and imposition. Question: Can it be lawful for any man to subscribe what he does not believe to be true, giving his hand to public peace and keeping his conscience for God? Answer: No, if subscription signify approbation; for in that case it is hypocrisy, etc. But if subscription were no more than the office of a clerk of the signet or council, who in form of law is to sign all the acts of the council, it were different. For it is not as an account of his own opinion, but as a formality of the court: all the world looks on it as none of his personal act. But in subscription to Articles of Confession every ecclesiastic that subscribes does it for himself, lubens et ex animo subscripsi [‘I have subscribed willingly and from the heart’], is our form in the Church of England. If the intention of our superior be to require our assent, he that subscribes does profess his assent; and whatever he thinks himself, it is the intention of the imposer that qualifies the subscription. No particular Church ought with rigor to require subscriptions to Articles not evidently true and necessary to be professed: because in the division of hearts that is in the world, it is certain that some good men may dissent, and then either they shall be afflicted or tempted to hypocrisy: of either of which if ecclesiastic laws be guilty, they are not for edification: they are neither just, nor pious, and therefore oblige not. §32. pp. 358-59, ‘At least let the Articles be made with as great latitude of sense as they can and so that subscriptions be made to the form of words; let the subscribers understand them in what sense they please which the truth of God will suffer and the words can be capable of.’ This is the last remedy; but it is the worst: It has in it something of craft, but very little of ingenuity; and if it can serve the ends of peace or of external charity, or of fantastic concord [a concord of the fantasy], yet it cannot serve the ends of truth and holiness, and Christian simplicity.”

<main class="wrap"><figure class="quote" id="q-07987cab11" data-kw="">
<blockquote><p>We reject the opinion of certain Ubiquitarians, who connect the regenerating power of the Holy Spirit in such a way with the external water in baptism that either it must exist in the water itself or at least can inchoate regeneration only in the very act of baptism, for this opinion is at variance with all those passages of Scripture in which faith and repentance, and therefore both the root and seed of regeneration, are demanded as a prerequisite in those who are to be baptized. …

We therefore do not tie down the efficacy of baptism to the instant at which the body is washed with the external water, but in accordance with Scripture we require beforehand that persons to be baptized shall, in the judgment of charity at least, possess faith and repentance, and that no less in the case of covenant infants—in whom we contend the seed and spirit of faith and repentance must, through the influence of the divine blessing and the gospel covenant, be presumed to exist (statuendum esse)—than in the case of grown-up persons, &amp;c.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/anthony-walaeus.html">Antonius Walaeus</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Synopsis purioris theologiae, disputationibus quinquaginta duabus comprehensa ac conscripta per Johannem Polyandrum, Andream Rivetum, Antonium Walaeum, Antonium Thysium</cite>, (Leiden, 1625), XLIV, § 27, 29. Quoted in Herman Witsius, On the Efficacy and Utility of Baptism in the Case of Elect Infants whose Parents are under the Covenant (1693), trans. William Marshall, ed. J. Mark Beach in Mid-American Journal of Theology, 17 (2006), pp 167-68.</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/baptism.html">Baptism</a></span></div>

</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-189774c05f" data-kw="">
<blockquote><p>3d. Plea. I am come of Religious Parents, that improved, pleaded the Covenant for me, trained me up in the Fear of God.

Answ. John Baptist anticipates this Plea, Mat. 3.9. Think not to say in your Hearts, We have Abraham to our Father, Matth. 8.12. The Children of the Kingdom may be cast into utter Darkness. Alas Parental Privileges without Parents Principles, signify nothing: Let our Lord Christ, who will be Judge, answer this vain Plea, John 8.33-44. This may aggravate your Sin, never save your Souls, without Personal Piety.

4th. Plea. I have made a credible Profession of my Faith, am Baptized, am admitted to the Lord’s Supper, join with God’s People.

Answ. So did Simon Magus believe, professed his Faith, was Baptized, Acts 8.13.20-23, deceived the purest Church on Earth, for he proved a rotten Hypocrite; so did Judas, so did he that wanted the Wedding Garment, Matth. 22.12. And how easy it is to cast a Mist before the Eyes of fallible men, daily experience testifies: See an Instance of some that partake of extraordinary Privileges, Ordinances, yet rejected, 1 Cor. 10.5.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/oliver-heywood.html">Oliver Heywood</a></span><span class="wk"><span class="lbl">Work:</span> <cite>A new creature: or, A short discourse, opening the nature, properties, and necessity of the great work of the new creation upon the souls of men. Being some plain discourses on Galatians vi. 15</cite>, (London: Tho. Parkhurst, 1695), p. 75.</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/baptism.html">Baptism</a></span></div>

<blockquote><p>3. And they shall put off their clothes.

4. And they shall baptize the little children first. And if they can answer for themselves, let them answer. But if they cannot, let their parents or someone from their family answer for them.

5. And next they shall baptize the grown men; and last the women….</p></blockquote>

</figure><figure class="quote" id="q-2b3f2cfaf8" data-kw="">
<blockquote><p>But we do exclude from baptism the children of those who clearly are strangers to the covenant, such as the children of heathens, Muslims, Jews, and of similar people… And for this reason we should leave them–like foreigners–to the judgement of God… unless they happen through lawful adoption or through the just and properly-designated status of slaves to be enrolled and taken up into the families of believers as though belonging to them.† For in this case many Reformed churches do baptize those children, because they deem that God has adopted them into the fellowship of his covenant in this manner, that is to say by the covenant of Genesis 17:12-13, which in the early church was so far beyond debate that from it Augustine on several occasions deduced a powerful argument against the Pelagians for election by grace. [On the Grace of Christ &amp; on Original Sin 2.35 in NPNF1 5.249-50] † This is a remarkable position, given the fact that the Synod of Dort had decided negatively on the issue in response to a question from East-India if it was allowed to baptize a child from pagan parents adopted into a Christian family. At the synod, the professors and the delegates from Zeeland, Friesland and Utrecht did not object to baptism, together with the majority of foreign delegates, but the delegates from Holland and Gelderland objected because human adoption does not imply divine adoption. Adopted children first had to profess faith and only then could be baptized, though as infants they could be commended to God’s gracious care by the laying-on of hands. See Acta of the Synod of Dordt, eds. Donald Sinnema, Christian Moser, and Herman Selderhuis (Gottingen: Vandenhoeck &amp; Ruprecht), 30-32.</p></blockquote>

</figure><figure class="quote" id="q-045f424b42" data-kw="">
<blockquote><p>The Apostle makes but two Covenants, 1. of works, and 2. of grace, and this of grace twofold in the administration, viz. Old and New. Hebr. Chap. 8. Chap. 9. where the Apostle makes it his business to set down all the main differences between the old and new Testament-administration of the covenant of grace: but never mentions this of the Anabaptists; that children of believers were to be signed with the 1. sign of the old, in the old Testament, and not with that of the New, in the new Testament.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/nathanael-holmes.html">Nathanael Holmes</a></span><span class="wk"><span class="lbl">Work:</span> <cite>A vindication of baptizing believers infants.: In some animadversions upon Mr. Tombes his Exercitations about infant baptism; as also upon his Examen, as touching the antiquities and authors by him alleged or contradicted that concern the same. Humbly submitted to the judgement of all candid Christi</cite>, (London: M. Simmons, 1646), p. 2.</span></figcaption>

<blockquote><p>43. But as for the outward ceremony of the action — whether or not the believers take it in their hands, or divide it among themselves, or severally eat what has been given to each; whether they hand the cup back to the deacon or give it to the next person; whether the bread is leavened or unleavened; the wine red or white — it makes no difference. These things are indifferent, and left at the church’s discretion. However, it is certain that the practice of the ancient church was for all to take it in their hands. And Christ said, “Divide it among yourselves” [Luke 22:17, Vg.]. The histories narrate that common leavened bread was used before the time of the Roman Bishop Alexander, who was the first who delighted in unleavened bread. But I see no reason for this, unless to draw the eyes of the common people to wonderment by a new spectacle, rather than to instruct their minds in sound religion. I ask all who are in the least affected by a zeal for piety whether they do not clearly see both how much more brightly God’s glory shines here, and how much richer: sweetness of spiritual consolation comes to believers, than in these lifeless and theatrical trifles, which serve no other purpose than to deceive the sense of a people stupefied. They call this the holding of the people by religion when they lead them at will — dulled and befooled with superstition. If anyone should like to defend such inventions by appealing to antiquity, I also am not ignorant of how ancient the use of chrism and exsuffiation is in baptism; how soon after the apostolic age the Lord’s Supper was corrupted by rust. But this, indeed, is the stubborn boldness of men, which cannot restrain itself from always trifling and wantoning in God’s mysteries. Let us, however, remember that God so esteems obedience to his Word that he would have us judge both his angels and the whole world in its light [1 Corinthians 6:2-3; Galatians 1:8]. Now, to get rid of this great pile of ceremonies, the Supper could have been administered most becomingly if it were set before the church very often, and at least once a week. First, then, it should begin with public prayers. After this a sermon should be given. Then, when bread and wine have been placed on the Table, the minister should repeat the words of institution of the Supper. Next, he should recite the promises which were left to us in it; at the same time, he should excommunicate all who are debarred from it by the Lord’s prohibition. Afterward, he should pray that the Lord, with the kindness wherewith he has bestowed this sacred food upon us, also teach and form us to receive it with faith and thankfulness of heart, and, inasmuch as we are not so of ourselves, by his mercy make us worthy of such a feast. But here either psalms should be sung, or something be read, and in becoming order the believers should partake of the most holy banquet, the ministers breaking the bread and giving the cup. When the Supper is finished, there should be an exhortation to sincere faith and confession of faith, to love and behavior worthy of Christians. At the last, thanks should be given, and praises sung to God. When these things are ended, the church should be dismissed in peace. 44. …Luke relates in The Acts that this was the practice of the apostolic church, when he says that believers “…continued in the apostles’ teaching and fellowship, in the breaking of bread and in prayers” [Acts 2:42, cf. Vg.]. Thus it became the unvarying rule that no meeting of the church should take place without the Word, prayers, partaking of the Supper, and almsgiving. That this was the established order among the Corinthians also, we can safely infer from Paul [cf. 1 Corinthians 11:20]. And it remained in use for many centuries after.</p></blockquote>

<blockquote><p>In regard to the external form of the ordinance, whether or not believers are to take into their hands and divide among themselves, or each is to eat what is given to him; whether they are to return the cup to the deacon or hand it to their neighbor; whether the bread is to be leavened or unleavened, and the wine to be red or white, is of no consequence. These things are indifferent, and left free to the Church, though it is certain that it was the custom of the ancient Church for all to receive into their hand. And Christ said, “Take this, and divide it among yourselves” (Luk_12:17). History relates that leavened and ordinary bread was used before the time of Alexander the Bishop of Rome, who was the first that was delighted with unleavened bread: for what reason I see not, unless it was to draw the wondering eyes of the populace by the novelty of the spectacle, more than to train them in sound religion. I appeal to all who have the least zeal for piety, whether they do not evidently perceive both how much more brightly the glory of God is here displayed and how much more abundant spiritual consolation is felt by believers than in these frigid and histrionic [exaggerated dramatic behavior designed to attract attention] follies, which have no other use than to impose on the gazing populace. They call it restraining the people by religion, when, stupid and infatuated, they are drawn hither and thither by superstition. Should any one choose to defend such inventions by antiquity, I am not unaware how ancient is the use of Christ and exorcism in baptism, and how, not long after the age of the apostles, the Supper was tainted with adulteration; such, indeed, is the forwardness of human confidence, which cannot restrain itself, but is always sporting and wantoning in the mysteries of God. But let us remember that God sets so much value on obedience to his word, that, by it, He would have us to judge his angels and the whole world. All this mass of ceremonies being abandoned, the sacrament might be celebrated in the most becoming manner…</p></blockquote>

<blockquote><p>The elements of the sacrament are bread and wine. There is controversy between east and west on this point. The Greek Church says the bread must be leavened, the Latin unleavened, making this a point of serious importance. We believe that the bread used was paschal. But it was not Christ’s intention to give ritually a paschal character to the new sacrament; and bread is employed as the material element of nutrition, the one most familiar and universal. Hence, we regard all the disputes as to leaven, and the other minutiae made essential by the Romanist rubric (wheaten, mingled with proper water, not worm–eaten, etc.,) as non–essential.</p></blockquote>

<div class="actions"><button class="copy" data-copy="“The elements of the sacrament are bread and wine. There is controversy between east and west on this point. The Greek Church says the bread must be leavened, the Latin unleavened, making this a point of serious importance. We believe that the bread used was paschal. But it was not Christ’s intention to give ritually a paschal character to the new sacrament; and bread is employed as the material element of nutrition, the one most familiar and universal. Hence, we regard all the disputes as to leaven, and the other minutiae made essential by the Romanist rubric (wheaten, mingled with proper water, not worm–eaten, etc.,) as non–essential.”

— R. L. Dabney, 1898 | This quote was compiled by Andy Webb">Copy</button><a class="share" href="https://x.com/intent/post?text=%E2%80%9CThe+elements+of+the+sacrament+are+bread+and+wine.+There+is+controversy+between+east+and+west+on+this+point.+The+Greek+Church+says+the+bread+must+be+leavened%2C+the+Latin+unleavened%2C+making+this+a+point+of+serious+importance.+We+believe+that+the+bread+used+was+paschal.+But+it+was+not+Christ%E2%80%99s+intention+to+give+ritually+a+paschal+character+to+the+new+sacrament%3B+and+bread+is+employed+as+the+material+element+of+nutrition%2C+the+one+most+familiar+and+universal.+Hence%2C+we+regard+all+the+disputes+as+to+leaven%2C+and+the+other+minutiae+made+essential+by+the+Romanist+rubric+%28wheaten%2C+mingled+with+proper+water%2C+not+worm%E2%80%93eaten%2C+etc.%2C%29+as+non%E2%80%93essential.%E2%80%9D%0A%0A%E2%80%94+R.+L.+Dabney%2C+1898+%7C+This+quote+was+compiled+by+Andy+Webb&amp;url=https%3A%2F%2F5solasquotes.github.io%2Fquote%2F8f9025adaf.html&amp;via=5Solas" target="_blank" rel="noopener">Share on X</a><a class="perma" href="../quote/8f9025adaf.html">Permalink</a><a class="src" href="https://reformedbooksonline.com/topics/topics-by-subject/the-lords-supper/the-administration-of-the-lords-supper/quotes-on-common-bread-in-the-lords-supper/#:~:text=The%20elements%20of%20the%20sacrament%20are,water%2C%20not%20worm%E2%80%93eaten%2C%20etc.%2C%29%20as%20non%E2%80%93essential&amp;text=The%20elements%20of%20the%20sacrament%20are%20bread%20and&amp;text=with%20proper%20water%2C%20not%20worm%E2%80%93eaten%2C%20etc.%2C%29%20as%20non%E2%80%93essential" rel="noopener" target="_blank">Read it online · Reformed Books Online</a></div>

<blockquote><p>§2. The fourth position we draw from the same rule [of following the example of Christ] is, that it is not indifferent for a minister to omit the breaking of the bread at the Lord’s table after the consecration and in the distribution of it, because he ought to follow the example of Christ, who, after He had blessed the bread, and when He was distributing it to them who were at table, brake it, breaking into pieces in his hands the bread he had taken,¹ but had it not carved in small pieces before it was brought to the table. Hence, G. J. Vossius² does rightly condemn those who, though they break the bread in multas minutias [into many small pieces], yet they break it not in actu sacramentali [in the sacramental act]. Such a breaking as this (he says well) is not mystica [related to mystery], but coquinaria [related to cooking]. 1. Paræus in 1 Cor. 11:24. manibus comminuendo panem acceptum in partes. [Cf. Ad Corinthios priorem (1609), col. 743.] 2. De Symb. Cœnæ Dom., disp. 2, thes. 5. [Cf. Theses Theologicæ et Historicæ, 1658 ed., p. 275.]</p></blockquote>

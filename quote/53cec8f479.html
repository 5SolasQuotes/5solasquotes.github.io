<blockquote><p>[F]or it is obvious to every observation, that Families are the Seminaries of Towns, Churches, Countries, and Nations; and are as it were, the Hives, out of which do swarm the materials of greater assemblies; if therefore they be not well Principled therein all their Relations, the rest must needs miscarry. And here I observed, was the true Original of all our Miscarriages and mischiefs abroad; that when young people went out thence, to constitute new families, either as servant, or by marriage, they knew not the particular duties of their New Relations; as Husbands and Wives, as Parents and Children, as Masters and Servants: because for the most part, they were never taught them in the Families from whence they were transplanted. Remove a Crabstock from a barren to a fruitful soil, it will still be a Crabstock, without change of nature.

It is a certain Truth, a thousand times exemplified, That (without special converting grace) he or she shall never be good parents to their children, that were not good children to their parents: Nor they good Governors of servants that were not good servants to their Governors; nor they good Husband or Wife, in their own families that were not good in their former family Relations, as children or servants; Nor lastly, will those who are naughy in their Family Relations be good Neighbours in a Town, good Members of a Church, or good Subjects, or Magistrates in the State: A good man is the proper subject of the goodness of all other Relations: And he only is a good man, that is good in his first Relations; The Spring then of all Reformation, in Townes, Churches, Nations, (next to personal Reformation, where everyone mends one, that is himself) is that which is found in Families. If they were but either well constituted, or well-ordered and reformed, the whole work were done.</p></blockquote>

<blockquote><p>We have Paul’s general statement that in the churches all things are to be done decently and in order. Accordingly, civil observances, by which bonds, as it were, order and decorum are kept in the assembly of Christians, are by no means to be classed among human traditions, but are rather to be referred to that rule of the apostle, provided they are not believed to be necessary for salvation, or bind consciences by religion, or are related to the worship of God, or lodge piety in these things. But we are stoutly to resist those regulations which under the title of ‘spiritual laws’ are in force to bind consciences as if necessary for the worship of God…</p></blockquote>

</figure><figure class="quote" id="q-f925026ff3" data-kw="">
<blockquote><p>There are certain things which you cannot expect from such a true Christian Church. In the first place, you cannot expect from it any cooperation with non-Christian religion or with a non-Christian program of ethical culture. There are those who tell us that the Bible ought to be put into the public schools, and that the public schools should seek to build character by showing the children that honesty is the best policy and that good Americans do not lie nor steal. With such programs a true Christian Church will have nothing to do. The Bible, it will hold, is made to say the direct opposite of what it means if any hope is held out to mankind from its ethical portions apart from its great redemptive center and core; and character building on the basis of human experience may be character destruction; it is the very antithesis of that view of sin which is at the foundation of all Christian convictions and all Christian life. There is no such thing, a true Christian Church will insist, as a universally valid fund of religious principles upon which particular religions, including the Christian religion, may build; “religion” in that vague sense is not only inadequate but false; and a morality based upon human experience instead of upon the law of God is no true morality. Against such programs of religious education and character building, a true Christian Church will seek from the state liberty for all parents everywhere to bring up their children in accordance with the dictates of their conscience, will bring up its own children in accordance with the Word of God, and will try to persuade all other parents, becoming Christians, to bring up their children in that same Christian way. In the second place, you cannot expect from a true Christian Church any official pronouncements upon the political or social questions of the day, and you cannot expect cooperation with the state in anything involving the use of force. Important are the functions of the police, and members of the Church, either individually or in such special associations as they may choose to form, should aid the police in every lawful way in the exercise of those functions. But the function of the Church in its corporate capacity is of an entirely different kind. Its weapons against evil are spiritual, not carnal; and by becoming a political lobby, through the advocacy of political measures whether good or bad, the Church is turning aside from its proper mission, which is to bring to bear upon human hearts the solemn and imperious, yet also sweet and gracious, appeal of the gospel of Christ.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/j-gresham-machen.html">J. Gresham Machen</a></span><span class="wk"><span class="lbl">Work:</span> <cite>“The Responsibility of the Church in our New Age,” The Presbyterian Guardian 45</cite>, (February, 1976): 5, 13, 14.</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/civil-government-and-society.html">Civil Government and Society</a></span></div>

</figure><figure class="quote" id="q-1ebbe593af" data-kw="">
<blockquote><p>How can piety but promise to herself a zealous patron of your Highness, being the sole son and heir of so gracious and great a monarch, who is not only the defender of the faith by title, but also a defender of the faith in truth, as the Christian world hath taken notice, by his learned confuting of [Robert] Bellarmine’s overspreading heresies, and his suppressing in the blade of [Conrad] Vorstius’s Athean blasphemies? [1]

And how easy it is for your Highness to equal, if not exceed, all that were before you, in grace and greatness, if you do but set your heart to seek and to serve God, considering how religiously your Highness hath been educated by godly and virtuous governors and tutors; as also that you live in such a time, wherein God’s providence, and the King’s religious care, hath placed over this church, to the unspeakable comfort thereof, another venerable Jehoiada, that doth good in our Israel both towards God and towards his house; of whom your Highness at all times, in all doubts, may learn the sincerity of religion, for the salvation of your inward soul, and the wisest counsel for the direction of your outward state.

And to excite you the rather to the zealous practice of divine piety, often suppose with yourself, that your Highness hears your religious father James speaking unto you, as sometimes holy David spake to his son Solomon: and thou Charles my son know thou the God of thy father, and serve him with a perfect heart, and with a willing mind; for the Lord searcheth all hearts, and understandeth all the imaginations of the thoughts: if thou seek him, he will be found of thee; but if thou forsake him, he will cast thee off for ever.</p></blockquote>

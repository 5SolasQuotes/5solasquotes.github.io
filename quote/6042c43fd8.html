<main class="wrap"><figure class="quote" id="q-6042c43fd8" data-kw="">
<blockquote><p>The true catholic Church of Christ is the Mother of all reformed Daughters, and that argument that our [Independent] Brethren use to prove a particular church to be visible, because of external communion (not in one house, for that is accidental to visibility; one congregation may meet in three caves of the earth in time of persecution and yet remain one congregation) holds good in this catholic church…</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/samuel-rutherford.html">Samuel Rutherford</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Due Right of Presbyteries, ‘Acts 15, A Pattern of a Juridicial Synod’</cite>, ... (1644), pt. 1, p. 292</span></figcaption>

<blockquote><p>4. the king’s power is accumulative [Rom. 13:4], in giving to the Church, and aiding and helping; God has given to the king the Ten Commandments, and the Gospel, as a pupil is given to a tutor: The King holds his sword above the Law of God, to ward off the strokes of wicked men who do hurt the Law; but the king’s power is not privative, to take any privilege from the Law and the Church: so his power is as a tutor to keep, not as a father who may both give and take away from his son the inheritance; his power is defensive, not offensive.</p></blockquote>

<blockquote><p>Direction 6. Study before you go, what particular temptations you are like to meet with, and study well for particular preservatives against them all: As you will not go into a place infected with the plague, without an antidote. It is no small task to get a mind prepared for travel.</p></blockquote>

</figure><figure class="quote" id="q-ac520fbb30" data-kw="">
<blockquote><p>Some Citizens at Church prepar’d to pray; But (as they had been excommunicate) The good Church-wardens [lay grounds-keepers, regulated by Church and State] thrust them out the gate. Another country virtue I’ll repeat, The people’s charity was grown so great That whatsoever Londoner did die, In Church or Church-yard should not buried lie. Thus were they scorn’d, despised, banished, Excluded from the Church, alive, and dead, Alive, their bodies could no harbor have, And dead, not be allow’d a Christian grave: Thus was the Country’s kindness cold, and small, No house, no Church, no Christian burial. Oh Thou that on the winged winds dost sit And seest our misery, remedy it, Although we have deserv’d thy vengeance hot, Yet in thy jury (Lord) consume us not. But in thy mercies sheath thy slaying sword, Deliver us, according to thy word, Shut up thy quiver, stay thy angry rod That all the world may know Thou art our God, Oh open wide the gate of thy compassion Assure our souls that thou art our salvation. Then all our thoughts and words, and works, we’ll frame To magnify thy great and glorious Name, The ways of God, are intricate, no doubt Unsearchable, and pass man’s finding out, He at his pleasure worketh wond’rous things And in his hand doth hold the hearts of kings, And for the love, which to our king he bears, By sickness He our sinful Country clears, That he may be a Patron, and a guide Unto a people purg’d and purified.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/john-taylor.html">John Taylor</a></span><span class="wk"><span class="lbl">Work:</span> <cite>‘The Fearful Summer, or London’s Calamity, the Country’s Courtesy, and Both their Misery’</cite>, (Oxford, 1625) in All the Works of John Taylor, the Water-Poet Being Sixty and Three in number. Collected into one volume… (London, 1630), pp. 61-62</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/civil-government-and-society/plague-quarantine-and-public-health.html">Plague, Quarantine and Public Health</a></span></div>

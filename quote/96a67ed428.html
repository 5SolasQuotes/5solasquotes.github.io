<main class="wrap"><figure class="quote" id="q-96a67ed428" data-kw="">
<blockquote><p>Christ was subject to the law in two different senses. The first was the active sense, in that he perfectly fulfilled everything that was prescribed in the ceremonial or moral law. He was circumcised on the eighth day according to the law, being presented in the temple in order to fulfill the law of purification, to which, however, he was not himself subject. Likewise, he kept the feasts and rituals commanded in the law and fulfilled the moral law to such a degree that … he did not commit any sin, nor was any falsehood found in his mouth. He performed this perfect obedience to the law so that he could pass it on to us. The result is that his fulfilling of the law is imputed to us, who have not kept it perfectly, as if we had done so. He was also subject to the law in a passive sense, when he took on himself the punishment and offence of the law in order to deflect the wrath of the eternal Father from us.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/georg-major.html">Georg Major</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Commentarius in Divi Pauli Epistolam ad Ephesios</cite>, (Wittenberg, 1552), as quoted in Gerald L. Bray, Timothy F. George, Scott M. Manetsch (eds), Reformation Commentary on Scripture X: Galatians, Ephesians (IVP Academic, 2011), p. 135</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/justification/active-and-passive-obedience-imputed.html">Active and Passive Obedience Imputed</a></span></div>

</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-09cfb60301" data-kw="">
<blockquote><p>[You must distinguish:] 4. Betwixt a twofold righteousness of one and the same Covenant: 1. Of perfect obedience, or performance of the condition. 2. Of suffering, or satisfaction for disobedience or non-performance which makes the Law to have nothing against us, though we disobeyed. See [William] Pemble, Of Justification, p. 2. Our legal righteousness is of this last sort, and not of the first. Both these sorts of righteousness are not possible to be found in any one person, except Christ, who had the former righteousness as his own (incommunicable to us in that form). The second He had for us, as He was by imputation a sinner: And so we have it in, or by Him. Mark this. 5. Betwixt two kinds of righteousness, suitable to the two Covenants [of Works and of Grace] and their conditions: 1. Legal righteousness, which is our conformity, or satisfaction to the Law. 2. And evangelical righteousness, which is our conformity to the new Covenant. Note, that: 1. Every Christian must have both these. 2. That our legal righteousness is only that of satisfaction: but our evangelical is only that of obedience, or performance of the condition. 3. That our legal righteousness is all without us in Christ, the other in ourselves. 6. [Distinguish] Betwixt [1.] evangelical righteousness, improperly so called, viz. because the Gospel does reveal and offer it. This is our legal righteousness of Christ. 2. And evangelical righteousness properly so called viz. because the new Covenant is the rule to which it is conformed. This is our performance of the new Covenant’s conditions.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/richard-baxter.html">Richard Baxter</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Aphorisms of Justification</cite>, … (Hague, 1655) | Guide to the Reader Baxter here lays out his Neonomianism.</span></figcaption>

</figure><figure class="quote" id="q-e00e8196c8" data-kw="">
<blockquote><p>For what the law could not do, in that it was weak through the flesh, God sending his own Son, in the likeness of sinful flesh, and for sin, condemned sin in the flesh.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/william-bridge.html">William Bridge</a></span><span class="wk"><span class="lbl">Work:</span> <cite>‘The Doctrine of Justification by Faith, Opened &amp; Applied from Rom. 3:24-25</cite>, …’ in Works (London: Tegg, 1845), vol. 5, pp. 378-79 | By Christ’s redemption, the guilt of sin is taken away, and by his active obedience, the believing person is made completely righteous, in the sight of God; and although these always go together, yet are they to be distinguished one from the other: for as it is one thing to obey the command, and another to suffer the penalty, even so it is one thing to be fread from hell, by the merit of Christ’s death, and another thing to be entitled to heaven by the merit of his obedience, Rom. 8:3. Here we have the end and design of the Father’s sending of Christ asserted.</span></figcaption>

<blockquote><p>Q. 23. Is it correct to say that the righteousness of the Mediator is imputed to us in justification and infused in sanctification? …it is not the same righteousness of Christ that occurs in its two parts. When I speak of an imputed righteousness of the Mediator, then I mean that righteousness that He obtained by means of his suffering and dying and obedience in the state of humiliation–not, however, the righteousness of life of the human nature of Christ, that is, that Christ in his human nature now possesses. The latter is not imputed to me. And, conversely, the former cannot be infused into me; it can only be reckoned to me. Really, one cannot even say that the righteousness in which Christ now lives is infused into me. This always rests on a more or less unclear mystical conception. It is not the personal righteousness of Christ that is infused into the believer, for, as an inherent quality, righteousness cannot be detached from the person. Q. 24 Is then no ‘holiness’ of Christ imputed to us? Yes; by that term, if one wishes, one can designate his active obedience, imputed to us in justification. As our [Heidelberg] Catechism states in the answer to question 60, ‘How are you righteous before God?… God grants and imputes to me the perfect satisfaction, righteousness, and holiness of Christ,’ etc. In this sense, one may thus then say that Christ is not only our sanctification but also our holiness before God.</p></blockquote>

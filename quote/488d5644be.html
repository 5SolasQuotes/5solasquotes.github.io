<blockquote><p>IV. God created Man in his own Image, after his Likeness, in respect of Dominion. These are the express Words of Moses, God said, Let Us make Man in Our Image, after Our Likeness, and let them have DOMINION.

God is LORD of all! this is his Glory and unalienable Right, to reign and rule. He cannot deny Himself, and wo to his Creation should his Government and Providence cease. His is the Power and Kingdom; He is GOD over all; the Most High, Possessor of Heaven and Earth. Heaven is his Throne, and the Earth his Footstool. Angels, Authorities and Powers are all under his Feet. He is the One Lawgiver and Judge, the Lord of Hosts and King of Glory. Wisdom and Might are His: his Dominion is an Everlasting Dominion, and his Kingdom from Generation to Generation.

Intellectual and moral Creatures carry an Image of God’s Dominion in their Nature. They are made for Rule and Government in their Places. Angels are therefore called Dominions and Thrones, Principalities and Powers. And Man was in like manner made for Government here on Earth. The Fear of him was put upon the Creatures, and they herein are put under his Feet. God first said to him, Have thou Dominion, and then bro’t them to Adam to give them Names. So he gave him Possession of them all. This is celebrated in the Eighth Psalm; the Glory is given to God and all Pride is hidden from Man: “What is Man that Thou art mindful of him! Thou hast made him a little lower than the Angels, and hast crowned him with Glory and Honour.

Man is made for Dominion in his Place as Angels are in their. Rational and moral Powers are given to be sure to be used and applied, to great and good Ends and Purposes, respecting God, Self, and Fellow Creatures, in one World or other. The Application of these Powers must be in Subjection to God, the Government of our Selves, and a righteous Conduct toward others, below or above us, or on a Level with us.

But principally Man’s Glory is, that he is made for Self-Government, for Rule over himself, for a Possession of his own Soul, the Government of his own Mind and Will, Desires and Appetites, Thot’s, Words and Actions.

This was the Dominion he was principally designed for, and invested with. The Law of his God put within him, and given to him in Words as soon as he found himself in Being, sufficiently told him this. It spake indeed plainly his Subjection to-God, that he was made for Obedience and a reasonable Service; But it spake also his Pre-eminence above the Creatures put under him, in a distinguishing Power for the Rule of his own Actions, with Understanding and Choice, Liberty and Freedom, and from a Conscience of right and wrong.

Understanding and Wisdom, the Power of Tho’t and Consideration was given to Man for this End. “The Lord God put the Man into the Garden to dress and keep it, and He commanded the Man, saying &amp;c. Thus Man was made under the Law to God, a Law to himself, and was both able and inclined to do the Will of God, and to govern himself thereby. And this Power for Self-Government, by the Light and Law of God within him, and by the Will of God revealed to him, was the Image of his God upon him.

For the Divine Dominion and Government is in the Perfection of Wisdom and Righteousness. The Sceptre of his Kingdom is a right Sceptre. He does according to his Will in the Armies of Heaven, and among the Inhabitants of the Earth; but his Will is perfect, his Ways are Truth and Judgment, He is holy in all his Work, just and right is He.

Therefore the Subjection of Man to God is his governing Himself, in all his Thot’s Words &amp; Actions, in a wise, righteous and superior manner; as becomes a Creature in the Likeness of God, and made for Authority and Rule on Earth.</p></blockquote>

</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-bef93b245e" data-kw="">
<blockquote><p>The plant’s roots sinking into the ground is a movement that does arise from within the plant in a sense, since it results from the plant’s natural self-perfective powers qua plant. However, though the power and inclination are in the plant, the end toward which the power is inclined is in no sense present within the plant, nor even represented within it… Now, in a non-human animal, the ends toward which its powers are inclined are represented within it. For an animal can perceive a thing toward which it is naturally inclined, such as the food it eats… the food is in the animal qua perceived… …an animal has a kind of knowledge of the end it is pursuing. However, we still wouldn’t say that an animal knows what it is doing, and thus wouldn’t hold it morally responsible for what it does… For while the animal knows the end it pursues, it doesn’t know that it knows it. It doesn’t know the end as an end, for it does not have the concept of an end, nor indeed any concepts at all. Hence it also lacks the concept of being a means to an end… This lack of concepts entails a certain inflexibility in the animal’s behavior. Like a plant, an animal cannot do otherwise than whatever it in fact does… Because of this… Aquinas says that a non-human animal acts voluntarily only in an imperfect sense… Now, a rational substance is a substance with an intellect, and to have an intellect is precisely to have the capactiy to conceptualize what one knows. A human being qua rational animal not only knows the food that he tries to eat, but knows it as food of a certain kind (an apple, say) and as something that would be good for him to eat given his need for nutrition. He also knows that biting into it straightaway would be one possible means of eating it, and that this has certain advantages and disadvantages compared to other means… What all of this makes possible, as Aquinas emphasizes, is deliberation. Since a rational being posesses universal concepts, he can identify particular ends and means as instances of general kinds. He can make comparisons between these different possible ends and different possible means to the ends. He can arrive at judgments about which ends and means are best, and also make judgments about those judgments themselves. Hence, when he decides to eat the apple, he knows what he is doing in a way that… a non-human animal does not know what it is doing.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/edward-feser.html">Edward Feser</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Immortal Souls: a Treatise on Human Nature</cite>, (Editiones Scholasticae, 2024) | pt. 1, ‘What is Mind?’, ch. 4, ‘The Will’. ‘What is the Will?’, pp. 119-20</span></figcaption>

<blockquote><p>…the work of man’s redemption, being more excellent than the raising of Lazarus… the incarnation, death and satisfaction of Christ (for no act of God without Himself is comparable to the work of redemption, 1 Pet. 1:11-12; Col. 1:18-22) and God’s less excellent works, as his creating of beasts and worms…</p></blockquote>

<blockquote><p>Definition [of Ontological Goodness] Just as ontological truth states the relation of being to the cognitive faculty, so goodness involves a relation to the appetitive faculty or the will. Just as the former consists in the knowability of being, so the latter consists in being’s appetibility. Hence it is defined as the property of being whereby it is made appetible or willable or, more briefly, it is appetibility or willability. On other interpretations of ontological goodness see what I wrote elsewhere (Wolter, Transcendentals, p.199 ff.). On the Convertibility of Ontological Goodness Conclusion 29: Every being is good, or being and good convert. The appetite or will tends to its object either because the object is perfect for it, namely insofar as it has the being-ness and perfection due to it (love of benevolence), or because the object confers perfection on another (love of concupiscence). As far as God is concerned, it is plain that he is altogether perfect and so supremely appetible both to himself and to another. As far as creatures are concerned, one must say that they are truly loved or willed by God himself, otherwise they would not exist; therefore they are lovable or willable. Further, creatures are also good for other creatures; for example substance upholds accidents, accidents give further perfection to substance, etc.</p></blockquote>

<blockquote><p>II. God made Man in his own Image in respect of Intellect and Understanding, Knowledge and Wisdom.

God is the Only-wise perfect in Knowledge, and his Understanding is infinite. So his Word speaks of Him, and his Works declare it of Him. He that formeth the Eye, shall He not see? and He that teacheth Man Knowledge shall He not know? There is not a Soul so brutish as not to allow this.

Man, in his Soul and Body is the most eminent Display of the Knowledge and Wisdom of God here on Earth. The Mind and Eye of Man survey the Heavens, Earth, Seas and all the Creatures, and see how in Wisdom God hath made them all. Then we behold our Selves alone, among all the Creatures here on Earth, capable of this Understanding, and are led to say unto our Selves and unto God, Where is God my Maker! that teacheth me more than the Beasts of the Earth, and maketh me wiser than the Fowl of Heaven.

Man in his first State was happy and glorious in a Perfection of Knowledge and Wisdom, proper for an imbodied Spirit. He had not the Knowledge of Angels, for he was made lower than they; but he was wise as an Angel in Flesh should be. He was created with a due Knowledge of God his Maker, of Himself, and of the Creatures about him. God spake to our first Parents, and they to each other in an admirable manner, as is related by Moses. Their Minds were full of Light, the Law of God was in their Heart, and they were in the Possession of their own Souls and of Intellectual Happiness. They wanted no more Knowledge of Good at the Time, and to be sure needed no Knowledge of Evil.

This Understanding of Man was a Beam from the Light of the Knowledge and Glory of God upon him. God made him like Himself an Intellect, an Intelligence; the Inspiration of the Almighty gave him his Understanding. In his Light Man saw Light. And now Souls are renewed in Knowledge after the Image of God. They are renewed into the Likeness, in part, wherein they were first created. As they grow in holy Knowledge, they are changed more and more into the Divine Image from Glory to Glory.

The Devil tempted our Parents to aspire after more Knowledge, and so they fell. The Father of Light had given them as much of this perfect Gift as was good and fitting for them. This should have highly contented them, and filled ’em with Delight and Thankfulness. And so it did, until the false Fiend persuaded them to think, that GOD forbid ’em the Tree of Knowledge left it should make ’em wiser and better than they were.

Alas! they found nothing by it but the Knowledge of Sin and Misery, of which it was their Happiness to be ignorant; and they lost the Knowledge of all the Good which they before enjoyed. We remain miserable, and perish in our Ignorance of God, unless we are renewed after Him in Knowledge. True spiritual Wisdom is restored in the Regeneration of Souls. God gives the Light of the Knowledge of his Glory in the Face of JESUS CHRIST. They who were sometimes Darkness, are made Light in the Lord. They are full of Goodness, filled with all Knowledge.

That the Soul be without Knowledge, is not good. It is very evil to it to be so. What is a dark and blind Soul good for! the Light that is in it is Darkness. The Light of Life is from the Father of Glory, the Father of Christ, the Eyes of our Understanding being-enlightned, to know the Hope of his Calling. God gives the Spirit of Wisdom and Revelation in the Knowledge of his Son. This is the Image of the Father restored in his Elect. So they become again the Children of God; filled with the Knowledge of his Will, in all Wisdom and spiritual Understanding.

What a bright Account is this, given by the Holy Ghost, of the Image of God on the Soul of Man, in respect of Knowledge! Not only has Man an Understanding which reflects on its own Acquirements, and (as an excellent Divine of our own says) “reads its own Knowledge, and communicates it to others; but the true and high Glory of this created Intellect is,” that it is capable of knowing God unto Eternal Life; for this is Life Eternal to know Him the only true God and Jesus Christ whom be has sent. And if Souls regenerated by the Spirit of God receive from him a sanctified Mind, a spiritual Discerning of Things relating to their own Duty and Happiness; how much more must we suppose our first Parents in their state of Integrity and Perfection to be bless’d with a most holy Knowledge and spiritual Discerning?</p></blockquote>

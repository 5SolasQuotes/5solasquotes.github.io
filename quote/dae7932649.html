<main class="wrap"><figure class="quote" id="q-dae7932649" data-kw="Tradition Unwritten traditions">
<blockquote><p>If they were guided by the Spirit of truth unto all truth when they published their writings, what prevented them from embracing a full knowledge of the Gospel, and consigning it therein? … Every child knows that in the writings of the apostles, which these men represent as mutilated and incomplete, is contained the result of that revelation which the Lord then promised to them.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/john-calvin.html">John Calvin</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Institutes of the Christian Religion</cite>, 4.8.14</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/holy-scripture/sufficiency.html">Sufficiency</a> › <a href="../topics/holy-scripture/sufficiency/unwritten-traditions.html">Unwritten traditions</a></span><span class="t"><a href="../topics/holy-scripture/sufficiency.html">Sufficiency</a> › <a href="../topics/holy-scripture/sufficiency/apostolic-tradition.html">Apostolic tradition</a></span><span class="t"><a href="../topics/rome/the-rule-of-faith.html">Rome: The Rule of Faith</a> › <a href="../topics/rome/the-rule-of-faith/scripture-vs-tradition.html">Scripture vs tradition</a></span></div>

</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-d232debef1" data-kw="">

— Jerome Zanchi, On the Sufficiency of Scripture, Proposition 1">Copy</button><a class="share" href="https://x.com/intent/post?text=%E2%80%9CHoly+Scripture+contains+all+things+necessary+for+our+salvation%2C+and+that+clearly%3B+and+therefore+nothing+beyond+its+open+testimony+is+to+be+admitted+in+religion+as+necessary+either+to+believe+or+to+do.%E2%80%9D%0A%0A%E2%80%94+Jerome+Zanchi%2C+On+the+Sufficiency+of+Scripture%2C+Proposition+1&amp;url=https%3A%2F%2F5solasquotes.github.io%2Fquote%2Fd232debef1.html&amp;via=5Solas" target="_blank" rel="noopener">Share on X</a><a class="perma" href="../quote/d232debef1.html">Permalink</a><span class="src none">No free online copy linked</span></div>
</figure><figure class="quote" id="q-6b9349f83f" data-kw="sufficiency">
<blockquote><p>The question is not whether all those things are taught in Scripture word for word (autolexei), or immediately and expressly. We acknowledge that many things are to be deduced by legitimate inference and to be considered as the word of God. But the question is whether they are so contained in Scripture, be they expressly in it or derivable from it by legitimate inference, that there is no need of another and an unwritten (agraphō) rule of faith from which to derive matters of religion and salvation.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/francis-turretin.html">Francis Turretin</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Institutes of Elenctic Theology</cite>, 2.16.3</span></figcaption>

</figure><figure class="quote" id="q-6013b2a7fb" data-kw="">
<blockquote><p>Unless I am refuted and convicted by testimonies of the Scriptures or by clear arguments (since I believe neither the Pope nor the Councils alone; it being evident that they have often erred and contradicted themselves), I am conquered by the Holy Scriptures quoted by me, and my conscience is bound in the word of God: I can not and will not recant any thing, since it is unsafe and dangerous to do any thing against the conscience. … Here I stand. [I can not do otherwise.] God help me! Amen.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/martin-luther.html">Martin Luther</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Answer before the Diet of Worms</cite>, 18 April 1521</span></figcaption>

</figure><figure class="quote" id="q-1219b1eb93" data-kw="">
<blockquote><p>Pedagogically the church is prior to Scripture. But in the logical order Scripture is the sole foundation (principium unicum) of church and theology. In case of conflict between them, the possibility of which can never be denied on a Reformational view, church and confession must yield to Scripture. … Nothing may be put on a level with Scripture. Church, confession, tradition—all must be ordered and adjusted by it and submit themselves to it.</p></blockquote>

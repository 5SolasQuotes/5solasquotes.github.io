<blockquote><p>Now, while some of your ministers choose to leave their salaries unto the voluntary contributions of the people, there are others, who (sensible of what the Great Voettus writes, Hominum saepe tanta est injustitia, •allacia, lubricita, ac profanitas, ut expediat contractum intercedere) do make their contracts with their people for their stipends.</p></blockquote>

<blockquote><p>V. (3) From the salaries of the sacred ministers under the Old Testament (Num. 18:8-12), to whom were given ordinarily sacrifices, tithes, firstfruits, and other similar things, besides certain cities and suburban fields (Num. 35:1-8). Now although in the New Testament, we are not bound by those laws as to the special material from which and the manner in which the pay was given, still they remain as to kind and analogy, as is evident from the passage already quoted (1 Cor. 9:13).</p></blockquote>

<blockquote><p>…the rule in our way [amongst the Scottish covenanters], is as certain, though not so stinted, as that in yours [in the Anglican Church with their set forms], and that our ministers, appointed to be the people’s mouth in public prayer and worship, are not only tried in their utterance for preaching but also for prayer;</p></blockquote>

</figure><figure class="quote" id="q-950e8982db" data-kw="">
<blockquote><p>While they [the Jews] had the tenth of their goods consecrated, these [Christians] on the other hand who have received freedom [from the Mosaic Law] assign all that they have to the uses of the Lord, cheerfully and freely giving them, and not in lesser portions only, as becomes men professing the hope of greater things.’ . . Start Here: Articles &amp; Book Articles Smyth, Thomas – The Parsimony of Professing Christians being Note A to The Rule &amp; Measure of Christian Charity in Works, vol. 7 American, southern presbyterian. Parsimony means an extreme unwillingness to spend money. Peck, Thomas – Moral Obligation of the Tithe (1890) in Miscellanies, vol. 1, pp. 146-57 Peck was an American, southern presbyterian.. He argues that while natural and Biblical principles morally obligate us to return a portion of our income to the service of the Lord, this does not obligate an exact amount of, or at least, 10% in the New Testament era. While this article is very valuable, yet throughout it Peck argues for Voluntaryism, which is contrary to the Establishment Principle of the Reformation.. This aspect of Peck’s article is not recommended. Balfour, William – The Establishment Principle Defended, pp. 126-34 (1873) Balfour was a minister in the Free Church of Scotland.. He here defends from Scripture the Reformation’s view of the Establishment Principle with regards to tithing. Balfour is here arguing against the Voluntary position of the Scottish United Presbyterian Church, with which Church the Free Church was considering union with in his time. The teaching of Scripture is clear. . Book Croteau, David – A Biblical &amp; Theological Analysis of Tithing: Toward a Theology of Giving in the New Covenant Era PhD dissertation (2005) 339 pp. Croteau brings out numerous, enlightening Biblical insights.. His historical survey on pp. 6-68 is very helpful, especially in documenting the tithing renewal that occurred in America during the late-1800’s and following.. Indispensable for further digging into the subject, especially for his citations of literature on the subject. . . Dictionary &amp; Encyclopedia Articles on the Biblical tithes 1800’s Smith, William – ‘Tithe’ in Dr. William Smith’s Dictionary of the Bible, Comprising its Antiquities, Biography, Geography &amp; Natural History, vol. 4 ed. H.B. Hackett &amp; Ezra Abbot (1871) ** ed. McClintock &amp; Strong – ‘Tithe’ in Cyclopedia of Biblical, Theological and Ecclesiastical Literature (1880) Davis, John D. – ‘Tithe’ in A Dictionary of the Bible (1898) . 1900’s Jewish Encyclopedia – ‘Tithe’ (1901-1906) ed. Orr, James – ‘Tithe’ in International Standard Bible Encyclopedia (1915 / 1939) . . Articles Theological &amp; Political 1500’s Bullinger, Henry – Tenth Sermon, pp. 486-500 in the Fifth Decade of The Decades 1550’s Bullinger (1504–1575) was a Swiss reformer, the successor of Zwingli as the head of the Zurich Church. ** Ursinus, Zacharias – p. 570 (bottom) of ‘The Fourth Commandment’ in Commentary on the Heidelberg Catechism trans. Williard, 3rd American ed. (1851) Ursinus (1534–1583) was a prominent German Reformed theologian. ** Vermigli, Peter Martyr – Pt. 4, ch. 13, ‘Of a Magistrate, &amp; of the Difference between Civil &amp; Ecclesiastical Power’, section 18-32 in Common Places (1583), pp. 235-45 Quote: “First we must understand that tithes in the old time pertained unto ceremonies, and that as well in Melchisedek as in the Levites: Because in either priesthood they were referred unto Christ, and either priesthood was in very deed a figure of Christ… But what signified the tenths in either priesthood? Truly they signified nothing else but that it behoved the old fathers to acknowledge that whatsoever they had came from Christ. By that ceremony, the people worshipped Christ Himself… Boniface says: “We receive the tithes of all laymen.” Ye take them indeed, but now that Christ is come, the paying of tithes is no more a ceremony as it was before the coming of Christ when by tithes men worshipped Christ which was to come in the flesh, and confessed that they ought unto Him, both themselves, and all that they had. After the very which manner they paid the first fruits of all that they had. Nevertheless our men in these days receive tithes: but by what law? Truly not by the ceremonial law, but by a moral Law: since it is requisite that the minister should be sustained by the people: (Mt. 10:10) For the laborer is worthy of his reward: And he which serves the Gospel ought to live by it. So then, whether stipends be paid unto ministers out of lands or out of houses, either in ready money or in tithes, it makes no matter so that they be not maintained dishonestly, but honestly. Indeed these rewards in some places do retain the old manner of tithes. Howbeit in many places they are not called tithes, but stipends or wages. And doubtless they be rather rewards which are due to the labors of ministers than tithes.</p></blockquote>

stical+Power%E2%80%99%2C+section+18-32+in+Common+Places+%281583%29%2C+pp.+235-45+Quote%3A+%E2%80%9CFirst+we+must+understand+that+tithes+in+the+old+time+pertained+unto+ceremonies%2C+and+that+as+well+in+Melchisedek+as+in+the+Levites%3A+Because+in+either+priesthood+they+were+referred+unto+Christ%2C+and+either+priesthood+was+in+very+deed+a+figure+of+Christ%E2%80%A6+But+what+signified+the+tenths+in+either+priesthood%3F+Truly+they+signified+nothing+else+but+that+it+behoved+the+old+fathers+to+acknowledge+that+whatsoever+they+had+came+from+Christ.+By+that+ceremony%2C+the+people+worshipped+Christ+Himself%E2%80%A6+Boniface+says%3A+%E2%80%9CWe+receive+the+tithes+of+all+laymen.%E2%80%9D+Ye+take+them+indeed%2C+but+now+that+Christ+is+come%2C+the+paying+of+tithes+is+no+more+a+ceremony+as+it+was+before+the+coming+of+Christ+when+by+tithes+men+worshipped+Christ+which+was+to+come+in+the+flesh%2C+and+confessed+that+they+ought+unto+Him%2C+both+themselves%2C+and+all+that+they+had.+After+the+very+which+manner+they+paid+the+first+fruits+of+all+that+they+had.+Nevertheless+our+men+in+these+days+receive+tithes%3A+but+by+what+law%3F+Truly+not+by+the+ceremonial+law%2C+but+by+a+moral+Law%3A+since+it+is+requisite+that+the+minister+should+be+sustained+by+the+people%3A+%28Mt.+10%3A10%29+For+the+laborer+is+worthy+of+his+reward%3A+And+he+which+serves+the+Gospel+ought+to+live+by+it.+So+then%2C+whether+stipends+be+paid+unto+ministers+out+of+lands+or+out+of+houses%2C+either+in+ready+money+or+in+tithes%2C+it+makes+no+matter+so+that+they+be+not+maintained+dishonestly%2C+but+honestly.+Indeed+these+rewards+in+some+places+do+retain+the+old+manner+of+tithes.+Howbeit+in+many+places+they+are+not+called+tithes%2C+but+stipends+or+wages.+And+doubtless+they+be+rather+rewards+which+are+due+to+the+labors+of+ministers+than+tithes.%E2%80%9D%0A%0A%E2%80%94+Start+Here%2C+There+are+higher+rewards+in+the+promises+of+God+for+sacrificing+the+things+of+this+life+than+we+can+conceive+of+%28Mk.+10%3A29-30%29.+Lord+increase+our+ <blockquote><p>1. The word ‘church’ [say the Independents] signifies always a gathered together church, or such as may gather together, Acts 11:26, a whole year they assembled with the Church, Acts 20:7, the disciples came together to break bread; so Acts 1:10; 2:44,46; Acts 5:12; 15:25. [Rutherford’s] Answer: [1.] Our brother Mr. [George] Gillespie (Assertion of the Government of the Church of Scotland, pt. 2, ch. 3, p. 141-42) says many interpreters expound [in Greek], ‘they were together’, that is, of one accord in love and amity: and also [physical] churches not being builded, and they meeting in private houses, as in Mary’s house, Acts 12, school of Tyrranus, Acts 19:9, in an upper chamber, Acts 20:8, Paul’s lodging at Rome, Acts 28:13. What private houses (Acts 10:9) could ordinarily contain so many thousands? 2. The Scripture speaks so [as] to give us an example of the public meeting for public worship where it is not needful that all met in one place collectively; it is enough they meet all distributively. 3. Neither does the word ‘church’ always signify a meeting of one single congregation, as Acts 12:5; prayers were made [for Peter in jail] by the church, that is by all professors [throughout Jerusalem]. Herod vexed the church, Acts 8:3. Saul made havoc of the church; ‘I persecuted the Church.’ (1 Cor. 15:9) There is no necessity to expound these of people meeting ordinarily to worship God; for Herod and Saul persecuted all, whither apostles or professors in houses, not respecting their meeting in one place; Also [that] it shall follow that prayers were not made in private, but only in the church, that is, in the convened congregation for Peter, which is absurd: And that they were a visible-church is clear, else Herod and Saul could not persecute them.</p></blockquote>

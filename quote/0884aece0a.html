<main class="wrap"><figure class="quote" id="q-0884aece0a" data-kw="">
<blockquote><p>I next refer to the Spirit’s work in connection with Christ’s priestly oblation: “Who, through the eternal Spirit, offered Himself without spot to God” (Heb. 9.14). The expression: “the eternal Spirit,” can only mean the Holy Spirit according to the usual acceptation of the term — not the divine nature of Christ, as too many expositors have understood it. The meaning is, that the Son of God, moved and animated by the Holy Ghost, offered Himself without spot as an atoning sacrifice.

The Spirit rendered Him an unspotted sacrifice. The Spirit discovered to Him the inflexible claims of God as well as inflamed Him with such love to man and zeal for God as prompted Him to go forward in spite of every hindrance, pain, and difficulty, to effect the world’s redemption, and thus fitted Him as man for His work The Holy Spirit, in a word, filled His mind with the unflagging ardour, zeal, and love which led Him to complete the sacrifice.

To explain the text as if it described the divine nature as priest and the human nature as the sacrifice, is inadmissible. The WHOLE PERSON is priest and victim; for all done by either nature belongs to the Person: HE offered HIMSELF, says the apostle.

In this view of the matter, it would be a mere tautology — if the eternal Spirit is interpreted of the divine nature — to say He offered Himself through the divine nature. It would on that principle be but a repetition of the same thing. If we take it, however, as intimating the action of the Holy Spirit, it will vividly represent the holy fire by which the sacrifices were consumed. One does not find, except on this interpretation, anything in the sacrifice of Christ that could be adduced as the antitype of the holy fire employed in the sacrifice.

Nor are the objections to the view which we have propounded of any weight. When it is objected that the Holy Spirit was not the Priest who offered the sacrifice, the obvious answer is that Christ as Priest offered Himself a sacrifice possessed of infinite value and excellence in consideration of His divine Person, and of the additional fact that it was unspotted and offered through the Holy Spirit. Because the Spirit was in Him as a Spirit of faith and zeal and love — the Redeemer took upon Him with the utmost alacrity all that was to be performed and endured for man’s redemption.

The Holy Spirit, which framed the Redeemer’s mind as well as body, perpetually rested upon Him during all His earthly sojourn, imparting to Him the full consciousness of His Sonship in the highest sense, and prompting Him to execute the mediatorial work imposed on Him (Isa. 42.1-4). That our Saviour was also raised from the dead by the Holy Ghost, is clearly taught by Peter, when he affirms that He was put to death in the flesh, but quickened by the Spirit (1 Pet. 3.18).</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/george-smeaton.html">George Smeaton</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Doctrine of the Holy Spirit. The Ninth Series of the Cunningham Lectures, 1882</cite>, (Edinburgh: T. &amp; T. Clark, 1882), pp 132-33.</span></figcaption>

<blockquote><p>Prayer is to be made for things lawful… The reading of the Scriptures, preaching, and hearing the Word of God, singing of psalms; as also the administration of baptism and the Lord’s Supper, are all parts of religious worship of God, to be performed in obedience unto God with understanding, faith, reverence, and godly fear. Solemn humiliations, with fastings and thanksgivings upon special occasions, are in their several times and seasons to be used in a holy and religious manner.</p></blockquote>

<blockquote><p>And howsoever, some doubt whether Athanasius were the author of that Creed which bears his name, yet the greater number of the learned of latter ages entitle him to it; and though peradventure he framed it not himself, yet it is most agreeable to his doctrine, and seemeth to be drawn out of his works, and in that regard may be rightly termed his Creed. And for the third Creed, although I believe not, that either the Apostles jointly or severally dictated it: yet I subscribe to Calvin’s judgement, who saith, that it was a summary of the Christian Faith, extant in the Apostles’ days, and approved of by them. …

The exceptions against the matter or doctrine of the Creeds, either concern the first Article, God of God, or the Article about the descent into hell. For the first, there can be no doubt at all of it, for the Son is of the Father, and therefore the Father and Son being God, it must needs follow, that Christ is God of God, neither will it hence follow, that the Deity of the Son is of the Deity of the Father. For the argument holdeth not a concreto ad abstractum, verbi gratiâ, it will not follow, Deus passus est, ergo deitas passa est, God suffered, ergo the deity suffered: nor this, Maria est mater Dei, ergo est mater deitatis; Mary is the mother of God, ergo she is mother of the Deity.

Yea but Calvin saith, Christ is autotheos, God of himself; the answer is easy, Christ is God of himself, ratione essentiae; but God of God, ratione personae. And whereas it is objected, that if he be Deus de Deo, it must be either per productionem essentiae, or communicationem; by the production, or communication of the essence: though Beza, and other of our Divines stick not at the latter phrase, yet it followeth not; for it is sufficient to prove him God of God, that his person is generated of the Father, and it is safer to say that he hath communem essentiam cum patre, then communicatam, rather common then communicated.

For the latter, concerning descent into Hell, all the Christians in the world acknowledge, that CHRIST some way descended into hell, either locally, as many of the ancient fathers, [Hugh] Latimer the martyr, [Thomas] Bilson and [Lancelot] Andrews, and [Alexander] Noel in his catechism (commanded to be taught in all Schools, soon after the publishing the 39 Articles expound it) or virtually as Durand, or metaphorically as Calvin, or metonymically as [Daniel] Tilenus,[1] [William] Perkins, and this Assembly; and therefore no man need to make scruple of subscribing to the Article, as it stands in the creed, seeing it is capable of so many orthodoxal explications, and therein I desire that this Assembly in their aspersions would (after the example of the harmony of confessions) content themselves with branding only the popish exposition of this Article, which taketh hell for limbus patrum, or purgatory (Netherland regions, extra anni solisquevias) for any of the other four interpretations, they are so far from being Heretical, that it hath not been proved that any of them is erroneous.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/daniel-featley.html">Daniel Featley</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Sacra nemesis, The Levite’s scourge, or, Mercurius disciplined. Also diverse remarkable disputes and resolved in the Assembly of Divines related, episcopacy asserted, truth righted, innocency vindicated against detraction</cite>, (Oxford: Leonard Lichfield, 1644), pp 14, 15-16.</span></figcaption>

e+Deus+de+Deo%2C+it+must+be+either+per+productionem+essentiae%2C+or+communicationem%3B+by+the+production%2C+or+communication+of+the+essence%3A+though+Beza%2C+and+other+of+our+Divines+stick+not+at+the+latter+phrase%2C+yet+it+followeth+not%3B+for+it+is+sufficient+to+prove+him+God+of+God%2C+that+his+person+is+generated+of+the+Father%2C+and+it+is+safer+to+say+that+he+hath+communem+essentiam+cum+patre%2C+then+communicatam%2C+rather+common+then+communicated.%0A%0AFor+the+latter%2C+concerning+descent+into+Hell%2C+all+the+Christians+in+the+world+acknowledge%2C+that+CHRIST+some+way+descended+into+hell%2C+either+locally%2C+as+many+of+the+ancient+fathers%2C+%5BHugh%5D+Latimer+the+martyr%2C+%5BThomas%5D+Bilson+and+%5BLancelot%5D+Andrews%2C+and+%5BAlexander%5D+Noel+in+his+catechism+%28commanded+to+be+taught+in+all+Schools%2C+soon+after+the+publishing+the+39+Articles+expound+it%29+or+virtually+as+Durand%2C+or+metaphorically+as+Calvin%2C+or+metonymically+as+%5BDaniel%5D+Tilenus%2C%5B1%5D+%5BWilliam%5D+Perkins%2C+and+this+Assembly%3B+and+therefore+no+man+need+to+make+scruple+of+subscribing+to+the+Article%2C+as+it+stands+in+the+creed%2C+seeing+it+is+capable+of+so+many+orthodoxal+explications%2C+and+therein+I+desire+that+this+Assembly+in+their+aspersions+would+%28after+the+example+of+the+harmony+of+confessions%29+content+themselves+with+branding+only+the+popish+exposition+of+this+Article%2C+which+taketh+hell+for+limbus+patrum%2C+or+purgatory+%28Netherland+regions%2C+extra+anni+solisquevias%29+for+any+of+the+other+four+interpretations%2C+they+are+so+far+from+being+Heretical%2C+that+it+hath+not+been+proved+that+any+of+them+is+erroneous.%E2%80%9D%0A%0A%E2%80%94+Daniel+Featley%2C+Sacra+nemesis%2C+The+Levite%E2%80%99s+scourge%2C+or%2C+Mercurius+disciplined.+Also+diverse+remarkable+disputes+and+resolved+in+the+Assembly+of+Divines+related%2C+episcopacy+asserted%2C+truth+righted%2C+innocency+vindicated+against+detraction%2C+%28Oxford%3A+Leonard+Lichfield%2C+1644%29%2C+pp+14%2C+15-16.&amp;url

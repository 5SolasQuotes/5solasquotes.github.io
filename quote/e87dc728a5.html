<main class="wrap"><figure class="quote" id="q-e87dc728a5" data-kw="">
<blockquote><p>A minister who is called of God must not lay aside his office, or the exercise of his office and power, upon every man’s desire; but if he be exauctorated at all, it must be by such as have lawful authority for that effect, unto whom he is bound in conscience to subject himself: And so he shall have peace, though the sentence be passed clave errante unjustly.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/john-currie.html">John Currie</a></span><span class="wk"><span class="lbl">Work:</span> <cite>An Essay on Separation: or a Vindication of the Church of Scotland contra the Seceders</cite></span></figcaption>
<div class="meta"><span class="t"><a href="../topics/the-church/schism-and-separation.html">Schism and Separation</a></span></div>

</figure><figure class="quote" id="q-22541cf5ab" data-kw="">
<blockquote><p>A minority within the Societies, such as Hamilton and Earlstoun, would continue to reject William’s kingship, but the majority, including their ministerial leadership, either tacitly or openly accepted it. That split proved to be fundamental and led to the great schism in the Societies in 1690, when Hamilton and a minority of the Societies refused to accept the Revolution settlement of Church and State, and, ultimately, publicly rejected William’s authority in the Sanquhar Declaration of 1692. (Walker, BP, I, 126; Shields, FCD, 411-2, 418-9.)… The Societies also took steps to secure the Revolution by offering military support…</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/mark-jardine.html">Mark Jardine</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The United Societies: Militancy, Martyrdom &amp; the Presbyterian Movement in Late-Restoration Scotland</cite>, 1679 to 1688 PhD diss. (Univ. of Edinburgh, 2009), Conclusion, p. 240</span></figcaption>

<blockquote><p>If they [the Resolutioners] say that there is a difference upon the matter betwixt that which is done by them and done by the other [side]: take the matter simply and without respect to their numbers, and we believe the protesting Brethren will be content to stand or fall by it: and if it be the plurality of the number only, we cannot accompt [account] that, especially in a time of corruption, a sufficient plea either for condemning the one or justifying the other.</p></blockquote>

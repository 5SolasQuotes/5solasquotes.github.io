<main class="wrap"><figure class="quote" id="q-e67c526b51" data-kw="">
<blockquote><p>A number of proclamations issued in the relation of the visitation [of the plague in 1665] pertained to the concourse of the people. Under most circumstances the concourse of people was vehemently prohibited in political plague texts, upholding an understanding of material protection against the threat of contagion. However, the persistent belief in the moral dimension of illness manifested in proclamations that gestured to instances when gatherings could be justified, in the interest of providential salvation. On 6 July [1665], measures for designated fast days and the severity of the growing outbreak were proclaimed in a text entitled ‘By the King. A Proclamation for a Generall Fast Throughout the Realm of England’. Fast days during plague had been enacted first during an outbreak in 1563 under Elizabeth I, who, alongside her council and the church, scheduled prayer and fasting, with fasting on Wednesdays… The proclamation [in 1665] requested that citizens not only maintain the request, ‘And that the solemnization of these days may be with such Order and Decency as is requisite’… Meetings in churches continued through the outbreak, though the circumstances changed once many pulpits were left abandoned by their Anglican ministers. The flight of ministers meant nonconformist ministers took up the task of preaching at some of the vacant pulpits. Writing of the height of the epidemic, nonconformist Thomas Vincent described the scene at a church in God’s Terrible Voice in the City: ‘Now there is such a vast concourse of people in the Churches, where these ministers are to be found, that they cannot many times come near the Pulpit doors [in order to enter the pulpit to preach] for the press [of the people]’.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/civil-examples.html">Civil Examples</a></span><span class="wk"><span class="lbl">Work:</span> <cite>During the Great Plague of London 1665-66 | Miller, Kathleen, The Literary Culture of Plague in Early Modern England Pre (Palgrave, 2016)</cite>, p. 36</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/civil-government-and-society/plague-quarantine-and-public-health.html">Plague, Quarantine and Public Health</a></span></div>

<blockquote><p>It [the plague] appears to have been brought into Leith by a passenger from England, on 14th October, 1574, and several persons died of it there, before its existence was generally known; it entered Edinburgh on the 24th of the same month [A History of Epidemics in Britain, by Charles Creighton, M.D., I., p. 366], and five days later, viz., on 29th October, the town council of Glasgow prohibited all persons from Leith, Kirkcaldy, Dysart, Burntisland, and other places in which its existence was suspected, from coming to the city; inhabitants of Glasgow were also prohibited from going to these places. In Edinburgh the only place suspected is stated to have been Bell’s Wynd, and inhabitants of Glasgow were prohibited from going to that city without a testimonial, or from returning without a certificate from the magistrates that they had not associated with suspected persons there. Residenters in the town were prohibited from receiving strangers in their houses, except such as were licensed by the magistrates or their officers; and even residenters in houses outside of the ports were subjected to a similar restriction. Travellers from places unsuspected were also required, before being received within the city, to produce a testimonial from the magistrates of the burgh or the minister of the parish beyond a burgh. [Council Records, I., pp. 27–8] Two days later the privy council issued an order from Dalkeith to check the spreading of the plague landwards “through the departure of sick folk and foul persons;” it prohibited concealment of the existence of the malady, and commanded infected persons “to cloise thame selffis in.” [Privy Council Register, II., p. 415]</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/civil-examples.html">Civil Examples</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Scotland 1574 | Footnote 33 in ‘Historical preface: 1600-3’, in Charters and Documents Relating To the City of Glasgow 1175-1649 Part 1, ed. J D Marwick (Glasgow, 1897), pp. clxxxiv-cciv. British History Online</cite></span></figcaption>
<div class="meta"><span class="t"><a href="../topics/civil-government-and-society/plague-quarantine-and-public-health.html">Plague, Quarantine and Public Health</a></span></div>

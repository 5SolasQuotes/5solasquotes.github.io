<blockquote><p>And so much the rather should the Lord’s Sabbath be dear unto us, because the goodness and mercy of God appears no where more, than in giving us his Sabbaths; calling upon us thereby to rest from the world unto him (and God knows, a Christian soul finds no rest any where but in him) and to walk with him in holy meditation, as he is pleased to walk in the midst of us, as the Holy One of Israel: so to draw us away from worldly cares and pleasures, to the entertaining of heavenly and holy cares, to enrich our selves with the knowledge of God, and to recreate our souls in the Lord, as he solaceth himself in us, according to that, He took his solace in the compass of the earth, and his delight was in the children of men. On the Lord’s day it is, that in special sort we Christians take hold of that holy Communion, which God in great mercy in his Son Jesus Christ vouchsafeth unto us with himself, speaking unto us as from heaven in his holy Word, and giving us liberty to speak unto him.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/william-twisse.html">William Twisse</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Of the morality of the fourth commandment, as still in force to bind Christians. Delivered by way of answer to the translator of Doctor Prideaux his lecture, concerning the doctrine of the Sabbath</cite>, (London, 1641), the preface.</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/worship.html">Worship</a></span></div>

</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-5ac4f3b0a1" data-kw="">
<blockquote><p>The Scriptures Divine are the most ancient Records in the World; but it follows not, that because the Scriptures do not Record how the Patriarchs did observe the Sabbath, therefore they observed it not; but much rather, because, the Scriptures Record, that The Lord blessed the seventh Day, and sanctified it, therefore the Patriarchs did observe it.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/william-twisse.html">William Twisse</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Of the Morality of the Fourth Commandment, as still in force to bind Christians</cite>, (London, 1641), p. 57.</span></figcaption>

<blockquote><p>As Emmanuel, he honoured the Sabbath, and consecrated it anew. By his glorious resurrection, at the completion of his second creation, in view of which it may be said that the first had no glory, by “reason of the glory that excelleth,” he re-enacted the law of the Sabbath, and fortified it by the most sublime and overpowering sanctions. And thus it became his anew and afresh. “All things were given to him then in heaven and in earth,” and then did he acquire a right and a power to wield all things for his people’s good and his enemies’ destruction, more glorious than he ever had before. And most assuredly, among “the all things in heaven and in earth,” the Sabbath, which, as it were, descends from heaven and alights on earth, so partaking of the character of both, holds a most conspicuous place.

As Son of Man he acquired a lordship over the Sabbath; and while this enhances his people’s safety here and glory hereafter, it awfully provides for the condemnation of his impenitent foes. And how terribly, and we might say, how easily, will he draw from it this most awful consequent. “All authority will be given to him to execute judgment, because he is the Son of Man;” and he will not forget, as an instrument in his judgments, the very Sabbath over which, for this same reason also – namely, that he is the Son of Man – he obtained this mysterious lordship. He will draw it forth from the elements of a forgotten history. The Sabbath, at the command of Christ, and reverencing the lordship which the Son of Man claims over it, will stand forth as accuser of his enemies.

They may plead that “they were very much immersed in this world’s cares and labours; – in the sweat of their brow they had to earn their bread; – time was not found by them to examine and accord to him the claims which, while they were in the flesh, Christ put in for their love and service; – their daily wants engrossed the labour of their hands; – the claims of their children occupied their thoughts; – and the short span of three score years and ten ran on with rapid flight, and there was not time for God to be in all their thoughts.” Ah! But what have they to answer to the silent witness which stands ready to record his testimony against them – the holy Sabbath! The holy Sabbath regularly came to them – the day of rest, expressly made for man, gave him liberty and rest from all his worldly cares. Granted that the world’s bustle and continual din of business, and rapid flight of ever-changing scenes, hurried away men’s thoughts from God – the Sabbath, in its weekly visit, brought with it a peace and a freedom from them all.

The morning of the blessed Sabbath came always to them, with its stillness and its hushed silence, and by that very silence spoke more loudly than words of the God whom, for six busy days at least, they had entirely forgotten. They complained of labour; but the Sabbath proclaimed their freedom from it. They complained of noise and agitation; but the Sabbath brought its quiet and stillness. They complained of the distractions of the world; but the Sabbath protruded on them – forced on their attention the things of God. Ah! what shall the answer be? “Every mouth shall be stopped,” and the holy Sabbath, which was given as a means of their salvation, in very proportion to the glory to which it offered to advance them, will loudly proclaim and irretrievably seal their utter condemnation, and visibly represent Jesus as clear when he judgeth, and justified when he speaketh forth their doom.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/hugh-martin.html">Hugh Martin</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Sabbath made for Man: A Sermon Preached in the Free Church, Panbride, on February 2, 1845. In Accordance with the Recommendation of the General Assembly</cite>, (Dundee: McCosh, 1845), pp 11-12.</span></figcaption>

<blockquote><p>That they [Romanists] cry up a private, unproved, unwritten tradition of their own, as of equal authority with this safe and full rule, which is contained in this written Word of God. Their crime and fault may be considered, partly with respect to the object and matter; that these traditions are not indifferent customs, but essential points necessary to faith and christian practice. And so though a Christian be never so through and sound in his obedience to the Word of God, and true to the baptismal covenant, yet if he submits not to these unwritten traditions, he wants [lacks] some point necessary to faith and practice, and so to life eternal: which is contrary to Mark 16:16. “He that believes and is baptized, shall be saved; and he that believes not, shall be damned.” And John 17:3.” This is life eternal, to know you the only true God, and Jesus Christ whom you have sent.” Partly as to the subject, as they make their own faction to be the only keepers of these things; and that nothing is to be owned as apostolic tradition, but what is delivered as such by their authority; which is to leave the church to the tyranny and usurpation of a corrupt faction; to declare for apostolic tradition any thing which serves their end and interest, and for which no true historical evidence is produced. Now the unjust and fraudulent practices which they have used, to promote this usurpation over the churches of Christ, render them false men, most unfit to be trusted in this kind. Partly with respect to the manner, they will have these things to be received, pari reverentia et pietatis affectu, with the same reverence and pious affection with which we receive the Holy Scriptures; and so man’s post is set by God’s, and unproved traditions equaled with doctrines of faith. Their opinion is bad enough, but their practice is worse. For there they show they value these things more than the Scriptures. As superstition always abounds in its own things. Did ever any of their doctors [teachers] say the same things of traditions, which they take the boldness to say of Scripture? Did they ever call them pen and inkhorn, or parchment divinity, a nose of wax, a dumb rule, an obscure and ambiguous doctrine? These Blasphemies they vent boldly against the Scriptures: but did they ever speak these of traditions? And again, their common people are a thousand times better instructed in their traditions, than in the doctrine of salvation. They skill more of Lent, and Ember-weeks, etc. than they truly understand the doctrine of man’s misery and remedy. And call you this reverence and pious affection to the Scriptures and traditions? Partly because they would never give us a catalogue of unwritten traditions, necessary to be observed by all Christians; It may be lest they should amaze the people with the multitude of them, or else that the people may not know how many of their doctrines are destitute of Scripture proof, and so they plainly be discovered to be imposers on the belief of the Christian world.</p></blockquote>

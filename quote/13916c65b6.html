<main class="wrap"><figure class="quote" id="q-13916c65b6" data-kw="">
<blockquote><p>Objection 1: Isa. 5:3, ‘O Inhabitants of Jerusalem, and ye men of Judah, judge between Me and my vineyard: what could I have done any more unto my vineyard that I have not done unto it? Why have I looked that it should bring forth grapes, and it bringeth forth wild grapes?’ These Jews therefore had the help of God which was thoroughly sufficient unto conversion and the leading of a life acceptable to God. Answer: God speaks in this place of the sufficiency of outward means, that is, of the preaching of his Word, of his benefits, and chastisements whereby they were sufficiently invited and led unto salvation, but that they were of such peevish and perverse dispositions. God therefore did that to this wicked vineyard, which if He had done in a good vineyard, it would have brought forth the fruit of obedience. And here He speaks not of the sufficiency of inward grace, whereby an evil vineyard be changed into a good vineyard.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/william-perkins.html">William Perkins</a></span><span class="wk"><span class="lbl">Work:</span> <cite>pp. 162-84 in 4th Crimination in A Christian &amp; Plain Treatise of the Manner &amp; Order of Predestination &amp; of the Largeness of God’s Grace (d. 1602: London: Welby &amp; Clarke, 1606)</cite>, pp. 169-70</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/attributes-of-god/goodness-love-and-mercy.html">Goodness, Love and Mercy</a></span></div>
<div class="actions"><button class="copy" data-copy="“Objection 1: Isa. 5:3, ‘O Inhabitants of Jerusalem, and ye men of Judah, judge between Me and my vineyard: what could I have done any more unto my vineyard that I have not done unto it? Why have I looked that it should bring forth grapes, and it bringeth forth wild grapes?’ These Jews therefore had the help of God which was thoroughly sufficient unto conversion and the leading of a life acceptable to God. Answer: God speaks in this place of the sufficiency of outward means, that is, of the preaching of his Word, of his benefits, and chastisements whereby they were sufficiently invited and led unto salvation, but that they were of such peevish and perverse dispositions. God therefore did that to this wicked vineyard, which if He had done in a good vineyard, it would have brought forth the fruit of obedience. And here He speaks not of the sufficiency of inward grace, whereby an evil vineyard be changed into a good vineyard.”

</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-68ffc5dc33" data-kw="">

</figure><figure class="quote" id="q-ba0d123cd8" data-kw="Affliction Love">
<blockquote><p>Affliction is the expression of paternal love. It is from the deepest recess of the fountain of love that sorrow flows down to us. And love cannot wrong us. It blesses, but cannot curse. Its utterances and actions are all of peace and gladness. It wants a larger vessel into which to empty itself, and a deeper channel through which to flow. That is all. It seeks to make us more susceptible of kindness, and then to pour that kindness in. Yes, love is the true, the one origin of the sharpest stroke that ever fell upon a bleeding heart. The truth is, there is no other way of accounting for affliction but this. Anger will not account for it, forgetfulness will not account for it, chance will not account for it. No. It is simply impossible to trace it to any cause but love. Admit this as its spring, and all is harmonious, comely, perfect. Deny it, and all is confusion, cruelty, and darkness.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/horatius-bonar.html">Horatius Bonar</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Night of Weeping</cite>, ch. XIV, “The Consolation,”</span></figcaption>

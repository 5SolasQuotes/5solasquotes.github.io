<blockquote><p>There is no more ordinary cause of spiritual sleep, than conversing with spiritual sluggards, that count it a high point of wisdom not to be forward in religion. These formal, proud persons, as they are cold themselves, so they labour to cast water upon the heat of others. Nay, those that are otherwise good, if declining in their first love, will incline others to a fellowship in the same secure temper, lest they should be upbraided by the vigilancy of others. …

Men disposed to be asleep desire to be alone. Those likewise that are disposed to take a spiritual nap, will avoid company, especially of such as would awake them. They will hardly endure rousing means.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/richard-sibbes.html">Richard Sibbes</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Love of Christ</cite>, (1639; Edinburgh: Banner of Truth, 2011), p. 67.</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/the-church.html">The Church</a></span></div>

</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-19b268feb7" data-kw="">
<blockquote><p>The first is, how we may discern whether particular men and particular Churches holding errors, be found members of the Catholic church or no. For the answering of this, we must make a double distinction, one of errors, the other of persons that err. Of errors, some are destroyers of the faith, some only weakners of it.

A destroyer is that, which overturneth any fundamental point of religion; which is of that nature, that if it be denied, religion it self is overturned; as the denial of the death of Christ, and the immortality of the soul, justification by works, and such like: and the sum of these fundamental points is comprised in the Creed of the Apostles and the Decalogue. A weakening error is that, the holding whereof doth not overturn any point in the foundation of salvation; as the error of freewill, and sundry such like.

This distinction is made by the holy Ghost, who saith expressly that the doctrines of repentance, and faith, and baptisms, and laying on of hands, and the resurrection, and the last judgement, are the foundation, namely of religion: and again, that Christ is the foundation, and that other doctrines consonant to the word, are as gold and silver laid thereupon.

Secondly, persons erring, are of two sorts: some err of weakness, being carried away by others; or of simple ignorance, not yet being convicted and informed concerning the truth. Some again err of obstinacy, or affected ignorance, which having been admonished and convicted, still persevere in their forged opinions.

This being said, we now come to the point. If any man or Church, shall hold an error of the lighter kind, he still remains a member of the Church of God, and so must be reputed of us. As when a Lutheran shall hold, that images are still to be retained in the church; that there is an Universal Election of all men, &amp;c. for these and such like opinions may be maintained, the foundation of salvation unrased.

This which I say is flatly avouched by Paul. If any man (saith he) build on this foundation gold, silver, precious stones; timber, hay, or stubble, his work shall be made manifest by the fire, &amp;c. and if any man’s work burn, he shall lose, but yet he shall be safe himself. And therefore the hay and stubble of men’s errors that are beside the foundation, on which they are laid, do not debar them from being Christians or members of the church.

A man breaks down the windows of his house; the house stands: he breaks down the roof or the walls; the house yet stands, though deformed: he pulls up the foundation; the house it self falls and ceaseth to be an house. Now religion which we profess is like an house or building: and some points thereof are like windows, doors, walls, roofs, and some are the very foundation: and the former may be battered, the foundation standing.

Again, if the error be directly or by necessary consequent, even in common sense against the foundation, consideration must be had whether the Church or party erreth of weakness or malice: if of weakness, the party is to be esteemed as a member of the Catholic church. And thus Paul writes unto the church of Galatia, as to a church of God, though by false teachers it had been turned away to another Gospel, and embraced the fundamental error of justification by works.

But when any man or church shall hold fundamental errors in obstinacy or affected ignorance, we are not then bound to repute them any longer as churches or Christians, but as such to whom condemnation belongs, as Paul sheweth by the example of Jannes and Jambres. And as Jannes and Jambres, saith he, withstood Moses, so do these also resist the truth, men of corrupt minds, reprobate concerning the faith.

Yet withal, this caveat must ever be remembered, that we rather condemn the error then the person that erreth, because Gods mercy is like a bottomless sea, whereby he worketh what he will and when he will in the hearts of miserable sinners.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/william-perkins.html">William Perkins</a></span><span class="wk"><span class="lbl">Work:</span> <cite>An Exposition of the Symbol or Creed of the Apostles, According to the Tenor of Scripture</cite>, in The Work of William Perkins (Cambridge: John Legat, 1600), pp 493-94.</span></figcaption>

</figure><figure class="quote" id="q-78b2c4fb71" data-kw="">
<blockquote><p>The Cardinal is continually urging this proposition, that there is no salvation out of the Church; And that he has not God for his Father that has not the Church for his mother. It imports then to know in what sense, and how far that proposition is true. I say then, that if by the word ‘Church’, you understand the Church or Assembly of the elect, or predestinated unto salvation, it is clear and questionless that out of the Church so understood there is no salvation: For whosoever is none of the elect, is of necessity a reprobate. If by the ‘Church’, you understand some particular Church, as the Greek, the Roman, the English, it is certain that out of such a Church a man may be saved. For example, if the Roman Church were as pure in the faith as it is corrupt, yet a faithful man could be saved in any other particular Church of the like purity. But if by the ‘Church’, one understands the whole body of those that profess themselves to be Christians, or the whole body of the orthodox Churches united in communion; it is certain that out of the communion of the Church taken in that sense a man may be saved. For if one were unjustly excommunicated from that Church, and should die during that excommunication, he should not be therefore excluded from salvation. For God is not subject to men’s vices, nor obliged to comply with the unjust passions of pastors handling the keys unrighteously, or abusing them ignorantly. Such a man having the Church for his step-mother, shall nevertheless have God for his Father. It may also happen that a pagan or a Jew being prisoner, or living in a country where there is no Christians, will come by reading, or conference, or inspiration from God, to acknowledge the truth of Christian religion, and make a resolution to profess it at the next opportunity, and as soon as he shall have his freedom: if death prevent such a man before he can openly join with the communion of the Church, I make no doubt but that he may be saved, believing in Jesus Christ, though he never did aggregate himself to the communion of the Church. For our Savior’s words can never be false, ‘Whosoever believeth in Jesus Christ, hath eternal life,’ Jn. 6. The thief crucified with Jesus, and converted when he was near death, was a pagan before, or of no religion; we cannot tell that ever he was a member of the visible Church, yet he was saved. In this sense then that proposition may be true, That out of the visible Church there is no salvation. Who so by profaneness or error in the foundation of the faith does separate himself from the communion of the universal visible Church, and renounces the communion of the faithful, to live according to his fancy, and to be no more a member of the Church, that man cannot be saved. Of such men the apostle Jude speaks, verses 18-19, where he calls those mockers and sensual men that separate themselves; And the apostle to the Hebrews, ch. 10, v. 25, forbids us to forsake the assembling of ourselves together. In this sense Cyprian in his book of the Unity of the Church, says, ‘He hath not God for his Father, that has not the Church for his Mother.’ For he speaks of schismatics, who out of pride despise the communion of the orthodox Church, and are authors of disension and division in the Church.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/pierre-du-moulin.html">Pierre Du Moulin</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Novelty of Popery, Opposed to the Antiquity of True Christianity</cite>, … (London: White, 1662), ch. 7, How this Proposition must be understood: That out of the Church there is no Salvation, p. 13</span></figcaption>

ry+where+there+is+no+Christians%2C+will+come+by+reading%2C+or+conference%2C+or+inspiration+from+God%2C+to+acknowledge+the+truth+of+Christian+religion%2C+and+make+a+resolution+to+profess+it+at+the+next+opportunity%2C+and+as+soon+as+he+shall+have+his+freedom%3A+if+death+prevent+such+a+man+before+he+can+openly+join+with+the+communion+of+the+Church%2C+I+make+no+doubt+but+that+he+may+be+saved%2C+believing+in+Jesus+Christ%2C+though+he+never+did+aggregate+himself+to+the+communion+of+the+Church.+For+our+Savior%E2%80%99s+words+can+never+be+false%2C+%E2%80%98Whosoever+believeth+in+Jesus+Christ%2C+hath+eternal+life%2C%E2%80%99+Jn.+6.+The+thief+crucified+with+Jesus%2C+and+converted+when+he+was+near+death%2C+was+a+pagan+before%2C+or+of+no+religion%3B+we+cannot+tell+that+ever+he+was+a+member+of+the+visible+Church%2C+yet+he+was+saved.+In+this+sense+then+that+proposition+may+be+true%2C+That+out+of+the+visible+Church+there+is+no+salvation.+Who+so+by+profaneness+or+error+in+the+foundation+of+the+faith+does+separate+himself+from+the+communion+of+the+universal+visible+Church%2C+and+renounces+the+communion+of+the+faithful%2C+to+live+according+to+his+fancy%2C+and+to+be+no+more+a+member+of+the+Church%2C+that+man+cannot+be+saved.+Of+such+men+the+apostle+Jude+speaks%2C+verses+18-19%2C+where+he+calls+those+mockers+and+sensual+men+that+separate+themselves%3B+And+the+apostle+to+the+Hebrews%2C+ch.+10%2C+v.+25%2C+forbids+us+to+forsake+the+assembling+of+ourselves+together.+In+this+sense+Cyprian+in+his+book+of+the+Unity+of+the+Church%2C+says%2C+%E2%80%98He+hath+not+God+for+his+Father%2C+that+has+not+the+Church+for+his+Mother.%E2%80%99+For+he+speaks+of+schismatics%2C+who+out+of+pride+despise+the+communion+of+the+orthodox+Church%2C+and+are+authors+of+disension+and+division+in+the+Church.%E2%80%9D%0A%0A%E2%80%94+Pierre+Du+Moulin%2C+The+Novelty+of+Popery%2C+Opposed+to+the+Antiquity+of+True+Christianity%2C+%E2%80%A6+%28London%3A+White%2C+1662%29%2C+ch.+7%2C+How+this+Proposition+must+be+understood%3A+Th <blockquote><p>This is no separation from the Church of Scotland, either in her doctrine, worship, discipline or government, but only a departing, or going forth from her sins, backslidings and defections, as we are commanded by the Lord; and for a time only from some congregations, because of these. This is not a positive or active separation form the Church, casting at it as no Church, or defaming the ministry thereof, or gathering new distinct Churches; only a negative and passive separation, refusing to follow the declining part of the Church holding on in their new course, and choosing rather to stand still and cleave to that part, though smaller, endeavoring to retain and maintain the covenanted work of reformation against Popery, prelacy, Erastianism and sectarianism, schism and defection.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/john-currie.html">John Currie</a></span><span class="wk"><span class="lbl">Work:</span> <cite>An Essay on Separation</cite></span></figcaption>

</figure><figure class="quote" id="q-3051b669e2" data-kw="">
<blockquote><p>…the decision of a Convention of Estates, or Parliament, in June to levy a ‘cess’, or tax, for the express purpose of raising additional troops to suppress the field-meetings. To Hamilton in particular, opposition to this tax became a test of orthodoxy, on a par with opposition to the indulgence. There is considerable evidence that in the summer and autumn of 1678 both he and Kersland sought to influence the younger field-preachers to adopt an increasingly militant tone in their preaching, and to condemn both those who payed the ‘cess’ and the ministers who had accepted the Indulgence. It is also clear that during this period both Hamilton and Kersland became increasingly associated with Richard Cameron… Throughout the 1670’s it had been customary for the leading field-preachers, such as John Welsh, to be accompanied by armed bodyguards as they moved around the country. This was seen as a necessary precaution for their own safety… Having attached himself to Cameron, Hamilton concluded that Cameron too should enjoy the same protection. He therefore gathered a body of men… whom he engaged to accompany Cameron around the country… Hamilton himself assumed the command of this group. A show of military order was observed, though neither Hamilton himself, nor, it apprears, any of those whom he led, had any military experience. However, it satisfied Hamilton’s fondness for demonstration and for display, and it was, of course, fully consistent with the militant approach which he advocated.</p></blockquote>

<main class="wrap"><figure class="quote" id="q-2b9a7068cc" data-kw="">
<blockquote><p>19. That person does not deserve to be called a theologian who looks upon the invisible things of God as though they were clearly perceptible in those things which have actually happened (Rom. 1:20; cf. 1 Cor 1:21-25), 20. He deserves to be called a theologian, however, who comprehends the visible and manifest things of God seen through suffering and the cross. 21. A theology of glory calls evil good and good evil. A theology of the cross calls the thing what it actually is.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/martin-luther.html">Martin Luther</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Heidelberg Disputation</cite>, (1518)</span></figcaption>

<blockquote><p>16… This can be illustrated by the likeness of the soul. For the soul, which is whole in the whole body and whole in each part of the body, as to essence, is not more in the heart or brain than in the feet; for equally, as far as essence is concerned, it is in each part of the human body: yet it is said to be especially in the head, as to the effects which it produces more excellently and preeminently in the head than in the rest of the body. For indeed it diffuses the power of sensing throughout the whole body: but in the head, it effects the power of hearing, seeing, smelling, tasting: indeed, also of speaking, thinking, remembering, understanding, which powers it does not exert in other members.</p></blockquote>

</figure><figure class="quote" id="q-052496234b" data-kw="">
<blockquote><p>1. Revelation of God in the destitute state is one thing, subjective, which can be called impressed on conscience; objective another, and that either inscribed in Nature or inserted in Scripture.

2. Subjective revelation impressed on conscience is convictive, but not converting.

3. Objective revelation inscribed in nature proposes God the Creator, but by no means God the Redeemer.

4. Of this revelation there is neither other efficacy nor other outcome except ἀπολογησία [inexcusability].

5. Revelation inserted in Scripture is both the only adequate one and the only one that can be salutary.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/start-here.html">Reformed Books Online</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Miscellaneous Theological Disputations</cite>, ‘Miscellaneous Theological Disputation exhibiting a Theological Compendium’</span></figcaption>

</figure><figure class="quote" id="q-74cb50ad6f" data-kw="">
<blockquote><p>The means for the knowledge of God: The more general means XIX. Now, concerning the supports by which we arrive at the knowledge of God, they are observed to be of two kinds. In the first more general kind are enumerated three ways to arrive at the knowledge of God, namely: (1) the way of causality, whereby having moved through various second causes as if by Jacob’s ladder, we finally arrive at the highest step, where God is, according to the mode which we described above in §VI. And this knowledge is what the apostle seems to indicate in Romans 1:19. (2) The way of eminence, by which whatever there is of absolute perfection in creatures we attribute with the highest eminence to the Creator, because of the fact that no one can confer on another what he does not have either formally or eminently, nor can an effect be conceived such that it is on the whole more excellent than its own cause. The psalmist seems to use this way in Psalm 94:9. Indeed, it is fitting by this support to interpret all anthropopathic and metaphorical expressions. (3) The way of negation, by which we entirely remove from him any imperfection that occurs in the creatures, for example, corporality, mortality, finitude, and the like. Scripture seems to follow this way in Numbers 23:19 and Psalm 90:2–3. And indeed in this manner, we arrive by this threefold way at the knowledge of God, such that (1) the first way chiefly leads to his relative attributes, through which he is called Creator, preserver, governor, and mover; (2) the second way leads to his communicable and affirmative attributes, for example, wisdom, righteousness, and so forth, which we will discuss in their own place; and (3) the third leads to his incommunicable and negative attributes, such as infinity, immutability, and so forth.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/petrus-van-mastricht.html">Petrus van Mastricht</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Theoretical Practical Theology</cite>, (RHB), vol. 2, bk. 2, ch. 2, sect. 19, p. 56 The more specific means Mastricht lists as: (1) the divine names in Scripture, (2) the divine attributes in Scripture, (3) the works of God, (4) the Word of God.</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/theology/natural-theology.html">Natural Theology</a></span></div>

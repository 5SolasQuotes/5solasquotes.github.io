<main class="wrap"><figure class="quote" id="q-65a5b050d8" data-kw="">
<blockquote><p>The second thing I shall say to persuade your heart to take Christ, freely promised and offered onto you, shall be this— will ye consider that there is willingness in the heart of Christ to take you. I shall give you these six things that speak out Christ’s willingness to receive you: 1st, Does He not command you to come and receive Him?… 2dly, He does regret and deeply resent it that they will not come. I think Christ never wept so bitterly as on that day when He wept over Jerusalem, that they would not embrace Him. Luke 19:42— If thou hadst known, even thou, at least, in this thy day, the things that belong unto thy peace; and John 5:40, Ye will not come unto Me that ye may have life. O what think ye can be the rise of this, that Christ should sorrow, because ye will not give up your hearts unto Him? Does He increase his gain when ye give Him your hearts? No, certainly; but He cannot endure the madness in you that ye should forsake your only gain. 3dly, Would you do Christ a joyful turn and make his heart glad?—embrace Him: this is clear, Luke 15:5, that when He finds the sheep that is going astray, He returns rejoicing. 4thly, I shall say more unto you—would ye make all the persons of the blessed Trinity to rejoice? Would ye make all the angels of heaven to sing? Would ye make all the saints that are round about the throne to exult for joy? Then give your hearts up to Christ and close with Him in the covenant of promise, according to that word, Cant. 6, last verse, ‘Return, return, O Shunamite. Return, return, that we may look upon thee.’ Four times that command is repeated, ‘return:’ and the great argument with which He backs it is, that all the persons of the Trinity may rejoice, ‘that we may look upon thee.’ 5thly, Consider how He has condescended to give Himself at a very low rate… Yea, 6thly, does not this speak an admirable willingness to have you? He is to give you that look… Lastly, That speaks Christ’s willingness to receive and take you, that He does not take the first refusal. O Christians that are now in Christ! if Christ had taken a hundred refusals from you, ye should never have been in heaven; but He waits for an answer, and does not take us at our first word; according to that word, Song 5:2, ‘I am wet (says He) with the drops of the morning, and my locks with the dew of the night.’ He was long knocking at her heart, and staid a long time there patiently, suffering all the injuries He could meet with. And I would only pose you:—Think ye that if one of the richest of you were suiting a very poor woman, and she refused you so many times, would your proud heart submit to take her? And yet how oftentimes has the precious heart of Christ submitted to so many affronts and refusals that we have given Him? I think, if it were possible, Christians would wink when first they behold Christ upon the day of their espousals.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/andrew-gray.html">Andrew Gray</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Works</cite>, … (d. 1656; Aberdeen: King, 1839), pp. 142-43</span></figcaption>

<blockquote><p>…and therefore because they missed of the time, their misery was great on them… there is a time for a man to come in and take the offer that Christ makes, a time when He is kind and gentle, and ready to receive us; if we know not this time, and so overslip it, our misery will be great upon us. Now then it is very requisite to know and find out this time, because if we choose God’s time, God will join with us in the work, and so it will be done with ease… Now if you will open when Christ knocks at the door, hearken to the motions of the Spirit, and blow them and nourish them, and it will be done with much ease; but if you miss this time, your misery is great; you may desire, and cry, and pray, and never the better, Eccl. 9:12. For a man also knows not his time…</p></blockquote>

<blockquote><p>9. There must be a satisfaction with the terms of the gospel, and the heart must actually close with Christ, as He is offered in the gospel. The heart must open to Him, and take Him in, Rev. 3:20. The soul must embrace and receive Him, John 1:12. The man must take Him, as his Lord and Master King, Priest and Prophet; must give up himself to Him as his Leader and Commander, and resolve to follow Him in all things, and thus close a bargain with Him. … 8. That, as to them, all Christ’s entreaties, motives, allurements, patience and long suffering, his standing at the door and knocking, till his locks be wet with the dew, etc., are in vain: yea, they are contemptuously rejected, despised, slighted, and undervalued.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/john-brown-of-wamphray.html">John Brown of Wamphray</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Christ the Way the Truth &amp; the Life</cite>, (1677), ch. 6</span></figcaption>

</figure><figure class="quote" id="q-d966461caf" data-kw="">
<blockquote><p>It is the voice of my beloved that knocketh, saying, Open to me. This is another sudden apprehension, and sensible acknowledgement of the Church’s, to which she is quickened and excited by the strong and mighty calls and pulsations, by which Christ endeavors to awaken her; whose voice she cannot but know and confess, though she be not so dutiful as she ought to be in obeying it; and therefore she does here aggravate and bewail her fault, which is so much the greater because of his importunity, and tender vehemency for admission: For when Christ calls, and knocks, and begs at the door of our souls to enter, what vile ingratitude is it to shut Him out? When He solicits and entreats so many ways; by his Word and ministers; by his rods and corrections (which have their voice, Mic. 6:9) by his mercies and kindness, but chiefly by the constant admonitions, and provocations, and motions of his Spirit; what inexcusable, obstinate madness is it to deny and drive Him away? Is anything so worthy to be harbored there, as He is? And is it not an incomparable honor, that He will vouchsafe to come under our roof? Whosoever is shut out, sure he deserves an hospitable reception, who will come and sup with such as we are, and brings his feast along with him. Aperi Christo sed extraneis claude, seculo claude, etc. [‘Open to Christ, but to outsiders, shut, shut the world’], drive away and banish all things else, but give Him the best lodging. It is demanded, Can we open? Is it in our power? Has not He the keys Himself, and is not He the door Himself? Does not He shut and none can open? Yes, but when He bids you to open, He lends you a key; and when He infuses grace and says He enables you to open, it is his gift, but your grace; his inspiration, but your improvement: And oh! How blessed are they that are but his turn-keys, his door-keepers. Is there a greater honor, or happiness than to co-operate with God, in that which of all others is the most God-like work, the salvation of souls?</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/english-annotations.html">English Annotations</a></span><span class="wk"><span class="lbl">Work:</span> <cite>English Annotations (the Westminster Annotations)</cite>, 3rd ed. (1658), on Song 5:2</span></figcaption>

<div class="actions"><button class="copy" data-copy="“It is the voice of my beloved that knocketh, saying, Open to me. This is another sudden apprehension, and sensible acknowledgement of the Church’s, to which she is quickened and excited by the strong and mighty calls and pulsations, by which Christ endeavors to awaken her; whose voice she cannot but know and confess, though she be not so dutiful as she ought to be in obeying it; and therefore she does here aggravate and bewail her fault, which is so much the greater because of his importunity, and tender vehemency for admission: For when Christ calls, and knocks, and begs at the door of our souls to enter, what vile ingratitude is it to shut Him out? When He solicits and entreats so many ways; by his Word and ministers; by his rods and corrections (which have their voice, Mic. 6:9) by his mercies and kindness, but chiefly by the constant admonitions, and provocations, and motions of his Spirit; what inexcusable, obstinate madness is it to deny and drive Him away? Is anything so worthy to be harbored there, as He is? And is it not an incomparable honor, that He will vouchsafe to come under our roof? Whosoever is shut out, sure he deserves an hospitable reception, who will come and sup with such as we are, and brings his feast along with him. Aperi Christo sed extraneis claude, seculo claude, etc. [‘Open to Christ, but to outsiders, shut, shut the world’], drive away and banish all things else, but give Him the best lodging. It is demanded, Can we open? Is it in our power? Has not He the keys Himself, and is not He the door Himself? Does not He shut and none can open? Yes, but when He bids you to open, He lends you a key; and when He infuses grace and says He enables you to open, it is his gift, but your grace; his inspiration, but your improvement: And oh! How blessed are they that are but his turn-keys, his door-keepers. Is there a greater honor, or happiness than to co-operate with God, in that which of all others is the most God-like work, the salvation of souls?”

— Mr. Smallwood, The English Annotations, 3rd ed. (1658) As the end of the quote demonstrates, Smallwood is speaking of conversion. | Song 5:2 – “…it is the voice of my beloved that knocketh, saying, Open to me, my sister, my love, my dove, my undefiled: for my head is filled with dew, and my locks with the drops of the night.”">Copy</button><a class="share" href="https://x.com/intent/post?text=%E2%80%9CIt+is+the+voice+of+my+beloved+that+knocketh%2C+saying%2C+Open+to+me.+This+is+another+sudden+apprehension%2C+and+sensible+acknowledgement+of+the+Church%E2%80%99s%2C+to+which+she+is+quickened+and+excited+by+the+strong+and+mighty+calls+and+pulsations%2C+by+which+Christ+endeavors+to+awaken+her%3B+whose+voice+she+cannot+but+know+and+confess%2C+though+she+be+not+so+dutiful+as+she+ought+to+be+in+obeying+it%3B+and+therefore+she+does+here+aggravate+and+bewail+her+fault%2C+which+is+so+much+the+greater+because+of+his+importunity%2C+and+tender+vehemency+for+admission%3A+For+when+Christ+calls%2C+and+knocks%2C+and+begs+at+the+door+of+our+souls+to+enter%2C+what+vile+ingratitude+is+it+to+shut+Him+out%3F+When+He+solicits+and+entreats+so+many+ways%3B+by+his+Word+and+ministers%3B+by+his+rods+and+corrections+%28which+have+their+voice%2C+Mic.+6%3A9%29+by+his+mercies+and+kindness%2C+but+chiefly+by+the+constant+admonitions%2C+and+provocations%2C+and+motions+of+his+Spirit%3B+what+inexcusable%2C+obstinate+madness+is+it+to+deny+and+drive+Him+away%3F+Is+anything+so+worthy+to+be+harbored+there%2C+as+He+is%3F+And+is+it+not+an+incomparable+honor%2C+that+He+will+vouchsafe+to+come+under+our+roof%3F+Whosoever+is+shut+out%2C+sure+he+deserves+an+hospitable+reception%2C+who+will+come+and+sup+with+such+as+we+are%2C+and+brings+his+feast+along+with+him.+Aperi+Christo+sed+extraneis+claude%2C+seculo+claude%2C+etc.+%5B%E2%80%98Open+to+Christ%2C+but+to+outsiders%2C+shut%2C+shut+the+world%E2%80%99%5D%2C+drive+away+and+banish+all+things+else%2C+but+give+Him+the+best+lodging.+It+is+demanded%2C+Can+we+open%3F+Is+it+in+our+power%3F+Has+not+He+the+keys+Himself%2C+and+is+not+He+the+door+Himself%3F+Does+not+He+shut+and+none+can+open%3F+Yes%2C+but+when+He+bids+you+to+open%2C+He+lends+you+a+key%3B+and+when+He+infuses+grace+and+says+He+enables+you+to+open%2C+it+is+his+gift%2C+but+your+grace%3B+his+inspiration%2C+but+your+improvement%3A+And+oh%21+How+blessed+are+they+that+are+but+his+turn-keys%2C+his+door-keepers.+Is+there+a+greater+honor%2C+or+happiness+than+to+co-operate+with+God%2C+in+that+which+of+all+others+is+the+most+God-like+work%2C+the+salvation+of+souls%3F%E2%80%9D%0A%0A%E2%80%94+Mr.+Smallwood%2C+The+English+Annotations%2C+3rd+ed.+%281658%29+As+the+end+of+the+quote+demonstrates%2C+Smallwood+is+speaking+of+conversion.+%7C+Song+5%3A2+%E2%80%93+%E2%80%9C%E2%80%A6it+is+the+voice+of+my+beloved+that+knocketh%2C+saying%2C+Open+to+me%2C+my+sister%2C+my+love%2C+my+dove%2C+my+undefiled%3A+for+my+head+is+filled+with+dew%2C+and+my+locks+with+the+drops+of+the+night.%E2%80%9D&amp;url=https%3A%2F%2F5solasquotes.github.io%2Fquote%2Fd966461caf.html&amp;via=5Solas" target="_blank" rel="noopener">Share on X</a><a class="perma" href="../quote/d966461caf.html">Permalink</a><a class="src" href="https://reformedbooksonline.com/let-jesus-come-into-your-heart/#:~:text=It%20is%20the%20voice%20of%20my,God%2Dlike%20work%2C%20the%20salvation%20of%20souls&amp;text=It%20is%20the%20voice%20of%20my%20beloved%20that&amp;text=the%20most%20God%2Dlike%20work%2C%20the%20salvation%20of%20souls" rel="noopener" target="_blank">Read it online · Reformed Books Online</a></div>

<blockquote><p>(2) God has been importunate in entreaties of us. God offers not only truce, but a peace, and has been most active in urging a reconciliation. Can He manifest his willingness in clearer methods, than that of sending his Son to reconcile the world to Himself? Can He evidence more sincerity than by his repeated and reiterated pressing of our souls to the acceptance of Him? God knocks at our hearts, and we are deaf to Him; He thunders in our ears, and we regard Him not; He waits upon us for our acceptance of his love, and we grow more mad against Him; He beseeches us, and we ungratefully and proudly reject Him; He opens his bosom, and we turn our backs; He offers us his pearls, and we tread them under our feet; He would give us angels’ bread, and we feed on husks with swine. The wisdom of God shines upon us, and we account it foolishness. The infinite kindness of God courts us, and we refuse it, as if it were the greatest cruelty. Christ calls and begs, and we will not hear Him either commanding or entreating…</p></blockquote>

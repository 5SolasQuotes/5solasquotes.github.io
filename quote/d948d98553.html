<main class="wrap"><figure class="quote" id="q-d948d98553" data-kw="">
<blockquote><p>It is, that when God formed man, he implanted within him from the beginning a natural law. And what then was this natural law? He gave utterance to conscience within us; and made the knowledge of good things, and of those which are the contrary, to be self-taught. For we have no need to learn that fornication is an evil thing, and that chastity is a good thing, but we know this from the first.

And that you may learn that we know this from the first, the Lawgiver, when He afterwards gave laws, and said, “Thou shalt not kill,” did not add, “since murder is an evil thing,” but simply said, “Thou shall not kill;” for He merely prohibited the sin, without teaching. How was it then when He said, “Thou shalt not kill,” that He did not add, “because murder is a wicked thing.” The reason was, that conscience had taught this beforehand; and He speaks thus, as to those who know and understand the point. Wherefore when He speaks to us of another commandment, not known to us by the dictate of consciences He not only prohibits, but adds the reason.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/john-chrysostom.html">John Chrysostom</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Homilies Addressed to the People of Antioch, Concerning the Statutes</cite>, (387), 12.9 in Nicene and Post-Nicene Fathers 2, 9: 421.</span></figcaption>

</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-db8c407a25" data-kw="">
<blockquote><p>Omitting many other passages that might be cited from the New Testament, in favour of capital punishment, I shall notice only two. “But we know that the law is good, if a man use it lawfully.” 1 Tim. i. 8. The law to which the apostle refers, is evidently what we call the judicial law; for it was not made for a righteous man, but for the lawless and disobedient. But this is not true of either the moral or ceremonial law, for they were made for righteous men: the Lord Jesus Christ obeyed them both. Now when we call a law good, we mean that the penalty is just. When the law of England hung people for stealing we called it a bad law, because the penalty was too severe; we call the law which hangs men for murder a good law, because the penalty is exactly proportioned to the crime. We see, then, that those laws which our modern illuminati call bloody laws, Paul calls good laws. In Hebrews ii. 2, it is said, “If the word spoken by angels* was steadfast, and every transgression and disobedience received a just recompense of reward.” The penalty inflicted on criminals by the Mosaic law, is called a just recompense of reward: it was neither too light, nor too severe – just such as infinite wisdom and goodness saw fit to appoint.

* Angels, (Messengers,) including Moses and the prophets.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/covenanter.html">Covenanter</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Covenanter</cite>, Jan. 1847, p. 165</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/civil-government-and-society/natural-law-and-civil-law.html">Natural Law and Civil Law</a></span></div>

</figure><figure class="quote" id="q-8a6261ad06" data-kw="">
<blockquote><p>The Church’s power is one and the same in things indifferent and necessary in matters of doctrine, discipline, and order; for in both, the Church does not create goodness, but does by the light of the Word, or (which is a part of the Word) by nature’s light, find pre-existent goodness in doctrine, discipline, and matters of order. Therefore will of authority, as will, has no power to dispose of the least circumstance of time, place or person; but the Church’s power is ministerial, and determined to what is good, expedient, and convenient.</p></blockquote>

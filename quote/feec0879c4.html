<main class="wrap"><figure class="quote" id="q-feec0879c4" data-kw="">
<blockquote><p>If the things themselves are promised in the covenant, then all those with whom this covenant is made must be really and effectually made partakers of them. But this is not so; they are not all actually sanctified, pardoned, and saved, which are the things here promised.&#x27; Ans. The making of this covenant may be considered two ways: 1. As unto the preparation and proposition of its terms and conditions. 2. As unto the internal stipulation between God and the souls of men. In this sense alone God is properly said to make this covenant with any. The preparation and proposition of laws are not the making of the covenant. And therefore all with whom this covenant is made are effectually sanctified, justified, and saved.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/john-owen.html">John Owen</a></span><span class="wk"><span class="lbl">Work:</span> <cite>An Exposition of the Epistle to the Hebrews</cite>, 8:10; Works, vol. 22, p. 179</span></figcaption>

</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-14a3d7a9e6" data-kw="">
<blockquote><p>Hence alone it is that the promises of grace under the old testament are given unto the church under these names, because they were types of them who should really and effectually be made partakers of them.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/john-owen.html">John Owen</a></span><span class="wk"><span class="lbl">Work:</span> <cite>An Exposition of the Epistle to the Hebrews</cite>, 8:10; Works, vol. 22, p. 143</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/the-covenant-of-grace/children-in-the-covenant.html">Children in the Covenant</a> › <a href="../topics/the-covenant-of-grace/children-in-the-covenant/the-baptist-1689-understanding-of-the-covenant-of-grace.html">The Baptist (1689) understanding of the covenant of grace</a></span><span class="t"><a href="../topics/the-covenant-of-grace/administrations.html">Administrations</a> › <a href="../topics/the-covenant-of-grace/administrations/the-new-covenant.html">The New Covenant</a></span><span class="t"><a href="../topics/effectual-calling/efficacious-grace.html">Efficacious Grace</a></span></div>

</figure><figure class="quote" id="q-1a4f8877c3" data-kw="">
<blockquote><p>Obs. XXIX. The new covenant is made with them alone who effectually and eventually are made partakers of the grace of it. — “This is the covenant that I will make with them,..... I will be merciful unto their unrighteousness,” etc. Those with whom the old covenant was made were all of them actual partakers of the benefits of it; and if they are not so with whom the new is made, it comes short of the old in efficacy, and may be utterly frustrated. Neither doth the indefinite proposal of the terms of the covenant prove that the covenant is made with them, or any of them, who enjoy not the benefits of it. Indeed this is the excellency of this covenant, and so it is here declared, that it doth effectually communicate all the grace and mercy contained in it unto all and every one with whom it is made; whomsoever it is made withal, his sins are pardoned.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/john-owen.html">John Owen</a></span><span class="wk"><span class="lbl">Work:</span> <cite>An Exposition of the Epistle to the Hebrews</cite>, 8:12; Works, vol. 22, p. 207</span></figcaption>

<div class="actions"><button class="copy" data-copy="“Obs. XXIX. The new covenant is made with them alone who effectually and eventually are made partakers of the grace of it. — “This is the covenant that I will make with them,..... I will be merciful unto their unrighteousness,” etc. Those with whom the old covenant was made were all of them actual partakers of the benefits of it; and if they are not so with whom the new is made, it comes short of the old in efficacy, and may be utterly frustrated. Neither doth the indefinite proposal of the terms of the covenant prove that the covenant is made with them, or any of them, who enjoy not the benefits of it. Indeed this is the excellency of this covenant, and so it is here declared, that it doth effectually communicate all the grace and mercy contained in it unto all and every one with whom it is made; whomsoever it is made withal, his sins are pardoned.”

— John Owen, An Exposition of the Epistle to the Hebrews, 8:12; Works, vol. 22, p. 207">Copy</button><a class="share" href="https://x.com/intent/post?text=%E2%80%9CObs.%20XXIX.%20The%20new%20covenant%20is%20made%20with%20them%20alone%20who%20effectually%20and%20eventually%20are%20made%20partakers%20of%20the%20grace%20of%20it.%20%E2%80%94%20%E2%80%9CThis%20is%20the%20covenant%20that%20I%20will%20make%20with%20them%2C.....%20I%20will%20be%20merciful%20unto%20their%20unrighteousness%2C%E2%80%9D%20etc.%20Those%20with%20whom%20the%20old%20covenant%20was%20made%20were%20all%20of%20them%20actual%20partakers%20of%20the%20benefits%20of%20it%3B%20and%20if%20they%20are%20not%20so%20with%20whom%20the%20new%20is%20made%2C%20it%20comes%20short%20of%20the%20old%20in%20efficacy%2C%20and%20may%20be%20utterly%20frustrated.%20Neither%20doth%20the%20indefinite%20proposal%20of%20the%20terms%20of%20the%20covenant%20prove%20that%20the%20covenant%20is%20made%20with%20them%2C%20or%20any%20of%20them%2C%20who%20enjoy%20not%20the%20benefits%20of%20it.%20Indeed%20this%20is%20the%20excellency%20of%20this%20covenant%2C%20and%20so%20it%20is%20here%20declared%2C%20that%20it%20doth%20effectually%20communicate%20all%20the%20grace%20and%20mercy%20contained%20in%20it%20unto%20all%20and%20every%20one%20with%20whom%20it%20is%20made%3B%20whomsoever%20it%20is%20made%20withal%2C%20his%20sins%20are%20pardoned.%E2%80%9D%0A%0A%E2%80%94%20John%20Owen%2C%20An%20Exposition%20of%20the%20Epistle%20to%20the%20Hebrews%2C%208%3A12&amp;url=https%3A%2F%2F5solasquotes.github.io%2Fquote%2F1a4f8877c3.html&amp;via=5Solas" target="_blank" rel="noopener">Share on X</a><a class="perma" href="../quote/1a4f8877c3.html">Permalink</a><a class="src" href="https://archive.org/details/worksofjohnowend0023owen" rel="noopener" target="_blank">Read it online · Internet Archive (Goold)</a></div>
</figure><figure class="quote" id="q-4ddb9747d0" data-kw="covenant of grace">
<blockquote><p>Reply; How often have we shewed that this Text proves not that any Children, quatenus as such, should be baptized, nor, as such, that they are in the Covenant of Grace, or have the Promise made to them; the Promise runs to the Jews and to their Offspring, and not to them only, but to Gentiles also, who were said to be afar off: But pray observe, &#x27;tis to no more of the Jews and their Children or Offspring, and such who were afar off, than the Lord shall call or make Disciples by the Word and effectual Operations of the Holy Spirit. My Sons and Daughters are as much my Children when they are twenty or thirty Years old, as well as when Babes. Dr. Hammond also grants, Children in this Text doth not refer to Insants as such, but to the Posterity of the Jews, p. 490. Sect. 81. If ye be Christ&#x27;s, then you are Abraham&#x27;s Seed, and Heirs according to the Promise.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/benjamin-keach.html">Benjamin Keach</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Pedo-Baptism Disproved</cite></span></figcaption>

</figure><figure class="quote" id="q-711e7bc10b" data-kw="">
<blockquote><p>The proposition is universal, as to the modification of the subject, “all;” but in the word “of them,” it is restrained unto those alone with whom this covenant is made. […] But whereas it is the internal, effectual grace of the covenant, and not only the means, but the infallible event thereon, —not only that they shall be all taught to know, but that they shall all actually know the Lord, — all individuals are intended; that is, that whole church all whose children are to be taught of God, and so to learn as to come unto him by saving faith in Christ.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/john-owen.html">John Owen</a></span><span class="wk"><span class="lbl">Work:</span> <cite>An Exposition of the Epistle to the Hebrews</cite>, 8:11; Works, vol. 22, p. 202</span></figcaption>

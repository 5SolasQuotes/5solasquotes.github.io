<main class="wrap"><figure class="quote" id="q-e2f2ddb52d" data-kw="">
<blockquote><p>That we may attain unto a more clear understanding of the nature of this regeneration, so necessary to salvation: we must carefully observe with regard to the word, that both the Scriptures and also divines use it sometimes in a larger sense, to denote the whole operation of the Holy Ghost upon the souls of those who are to be saved, whereby they are brought into a state of grace, so that, besides the external call, it comprehends conversion, and even initial santification: in which sense practical divines lay down the marks, motives and means of regeneration. Sometimes the word regeneration is used in a more limited sense, as distinguished from the external call, from conversion and from sanctification: so that the external call signifies only the offer of redemption for our reception: Regeneration conveys that power into the soul, by which the person who is to be saved is enabled to receive the offer. Conversion puts forth the power received into actual exercise, so that the soul does actually receive the offered benefits. Sanctification brings forth the fruits of conversion, or of faith and repentance, in a carefulness to maintain good works, yet not so immediately but that a union with Christ and justification come between conversion and sanctification, at least in the order of nature, if not of time. It is in this stricted sense of the word we shall consider the doctrine of regeneration at present…</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/petrus-van-mastricht.html">Petrus van Mastricht</a></span><span class="wk"><span class="lbl">Work:</span> <cite>A Treatise on Regeneration</cite>, … (New Haven, 1770), | section 5, pp. 16-17</span></figcaption>

</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-0ef156bd79" data-kw="">
<blockquote><p>Every Christian man and woman are by faith mystically united unto Christ and made all members of one body, whereof Christ is the head. Now therefore as Christ by the power of his Godhead, when He was dead and buried, did overcome the grave and the power of death in his own Person, so by the very same power by means of this spiritual conjunction does He work in all his members a spiritual death and burial of sin and natural corruption… So let a man that is dead in sin be cast into the grave of Christ, that is, let him by faith but touch Christ dead and buried, it will come to pass by the virtue of Christ’s death and burial, that he shall be raised from the death and bondage of sin to become a new man.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/william-perkins.html">William Perkins</a></span><span class="wk"><span class="lbl">Work:</span> <cite>An Exposition of the Symbol or Creed of the Apostles</cite>, … (Cambridge: Legatt, 1595), pp. 295-96</span></figcaption>

</figure><figure class="quote" id="q-8d1426d071" data-kw="">
<blockquote><p>And from our own [reformed] writers [on regeneration]: the treatise of William Whately on regeneration; the sermon of Obadiah Sedgwick on Rev. 3:1-3; Nicolas Byfield’s Principia Fidei [Principles of Faith], ch. 25; the various opuscula [small works] of Paul Baynes; Thomas Hooker on the humiliation of the soul, on the preparation of the soul for Christ, on the union of the soul with Christ, etc.; and writers on the practice of repentance: Perkins, Stock, Daniel Dyke, Arthur Dent… They are to be read, however, with this judgment: that one aim at the distinctions hitherto brought by us, and consider that the concepts of the practical writers—if not all, at least most—are to be referred to the second moment of regeneration and to actual conversion, whether first or renewed.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/gisbertus-voetius.html">Gisbertus Voetius</a></span><span class="wk"><span class="lbl">Work:</span> <cite>XI. ‘Appendix concerning the Second Moment of Conversion’ in Disputation 30, ‘On Regeneration’, pt. 2</cite>, (1639) tr. AI by Roman Prestarri in Select Theological Disputations (1655), vol. 2, pp. 447ff. Latin at Confessionally Reformed Theology</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/regeneration/nature-of-regeneration.html">Nature of Regeneration</a></span></div>

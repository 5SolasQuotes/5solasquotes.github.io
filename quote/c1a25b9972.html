<blockquote><p>III. The question is not whether all infants are to be baptized or not; for, according to the will of God, some are not to be baptized, even such whose parents are strangers from the covenant. But hence it will follow that some are to be baptized, seeing an exception confirms both rule and right. IV. The question is only concerning the children or infant seed of professing believers who are themselves baptized. And,— First, They by whom this is denied can produce no testimony of Scripture wherein their negation is formally or in terms included, nor any one asserting what is inconsistent with the affirmative; for it is weak beneath consideration to suppose that the requiring of the baptism of believers is inconsistent with that of their seed. But this is to be required of them who oppose infant baptism, that they produce such a testimony. Secondly, No instance can be given from the Old or New Testament since the days of Abraham, none from the approved practice of the primitive church, of any person or persons born of professing, believing parents, who were themselves made partakers of the initial seal of the covenant, being then infancy and designed to be brought up in the knowledge of God, who were not made partakers with them of the same sign and seal of the covenant. Thirdly, A spiritual privilege once granted by God unto any cannot be changed, disannulled, or abrogated, without an especial divine revocation of it, or the substitution of a greater privilege and mercy in the room of it; for,— 1. Who shall disannul what God hath granted? What he hath put together who shall put asunder? To abolish or take away any grant of privilege made by him to the church, without his own express revocation of it, is to deny his sovereign authority. 2. To say a privilege so granted may be revoked, even by God himself, without the substitution of a greater privilege and mercy in the room of it, is contrary to the goodness of God, his love and care unto his church, [and] contrary to his constant course of proceeding with it from the foundation of the world, wherein he went on in the enlargement and increase of its privileges until the coming of Christ. And to suppose it under the gospel is contrary to all his promises, the honour of Christ, and a multitude of express testimonies of Scripture. Thus was it with the privileges of the temple and the worship of it granted to the Jews; they were not, they could not be, taken away without an express revocation, and the substitution of a more glorious spiritual temple and worship in their room. But now the spiritual privilege of a right unto and a participation of the initial seal of the covenant was granted by God unto the infant seed of Abraham, Gen. 17:10, 12. This grant, therefore, must stand firm for ever, unless men can prove or produce,— 1. An express revocation of it by God himself; which none can do either directly or indirectly, in terms or any pretence of consequence. 2. An instance of a greater privilege or mercy granted unto them in the room of it; which they do not once pretend unto, but leave the seed of believers, whilst in their infant state, in the same condition with those of pagans and infidels; expressly contrary to God’s covenant. All this contest, therefore, is to deprive the children of believers of a privilege once granted to them by God, never revoked, as to the substance of it, assigning nothing in its room; which is contrary to the goodness, love, and covenant of God, especially derogatory to the honour of Jesus Christ and the gospel. Fourthly, They that have the thing signified have right unto the sign of it, or those who are partakers of the grace of baptism have a right to the administration of it: so Acts 10:47. But the children of believers are all of them capable of the grace signified in baptism, and some of them are certainly partakers of it, namely, such as die in their infancy (which is all that can be said of professors): therefore they may and ought to be baptized. For,— 1. Infants are made for and are capable of eternal glory or misery, and must fall, dying infants, into one of these estates for ever. 2. All infants are born in a state of sin, wherein they are spiritually dead and under the curse. 3. Unless they are regenerated or born again, they must all perish inevitably, John 3:3. Their regeneration is the grace whereof baptism is a sign or token. Wherever this is, there baptism ought to be administered. Fifthly, God having appointed baptism as the sign and seal of regeneration, unto whom he denies it, he denies the grace signified by it. Why is it the will of God that unbelievers and impenitent sinners should not be baptized? It is because, not granting them the grace, he will not grant them the sign. If, therefore, God denies the sign unto the infant seed of believers, it must be because he denies them the grace of it; and then all the children of believing parents dying in their infancy must, without hope, be eternally damned. I do not say that all must be so who are not baptized, but all must be so whom God would have not baptized. But this is contrary to the goodness and law [love?] of God, the nature and promises of the covenant, the testimony of Christ reckoning them to the kingdom of God, the faith of godly parents, and the belief of the church in all ages. It follows hence unavoidably that infants who die in their infancy have the grace of regeneration, and consequently as good a right unto baptism as believers themselves. Sixthly, All children in their infancy are reckoned unto the covenant of their parents, by virtue of the law of their creation. For they are all made capable of eternal rewards and punishments, as hath been declared.</p></blockquote>

<blockquote><p>A question here ariseth about infants; Whether they are to be baptized, or not, seeing they cannot be taught or instructed about faith? I answer that the children, or infants of believers ought to be baptized, because while they are yet infants, as to the external privileges of the Covenant with God, they are accounted both persons and parties of, or belonging to their parents; and therefore they are of the family of Christ, or of the number of his disciples. For if the Covenant made with Abraham be the same for substance, by which we are saved, and belongeth as much to us and to our children as it did to Abraham and his posterity, then not only we, but our children also ought to be partakers of the seal of this Covenant. But the first is true, as appeareth by Rom. 4 and other places; and therefore the latter also is true.</p></blockquote>

<blockquote><p>Christ does not retain both members of the first proposition in that which stands in opposition to the promise; he merely says: “He that believeth not, shall be damned.” Christ makes this distinction, because there is not the same necessity for faith and baptism to salvation. Faith is absolutely necessary to salvation, so that no one can be saved without it: for “without faith it is impossible to please God.” (Heb. 11:6.) But the sacraments are necessary when they may be observed according to divine appointment. Contempt of the sacraments under such circumstances, is inconsistent with faith. This is the reason why Christ promises salvation to those that believe and are baptized, keeping in view the distinction which is here made. Yet he does not deny salvation to those who are deprived of this sacrament. … The word extends to all; the sacraments only to such as believe.</p></blockquote>

<div class="actions"><button class="copy" data-copy="“Christ does not retain both members of the first proposition in that which stands in opposition to the promise; he merely says: “He that believeth not, shall be damned.” Christ makes this distinction, because there is not the same necessity for faith and baptism to salvation. Faith is absolutely necessary to salvation, so that no one can be saved without it: for “without faith it is impossible to please God.” (Heb. 11:6.) But the sacraments are necessary when they may be observed according to divine appointment. Contempt of the sacraments under such circumstances, is inconsistent with faith. This is the reason why Christ promises salvation to those that believe and are baptized, keeping in view the distinction which is here made. Yet he does not deny salvation to those who are deprived of this sacrament. … The word extends to all; the sacraments only to such as believe.”

</figure><figure class="quote" id="q-674765a0e8" data-kw="">
<blockquote><p>But now, having run through these various arguments, to what conclusion do we come? Are they sufficient to set aside our reasoned conviction, derived from some such argument as Dr. Hodge’s, that infants are to be baptized? A thousand times no. So long as it remains true that Paul represents the Church of the Living God to be one, founded on one covenant (which the law could not set aside) from Abraham to to-day, so long it remains true that the promise is to us and our children and that the members of the visible Church consist of believers and their children—all of whom have a right to all the ordinances of the visible Church, each in its appointed season. The argument in a nutshell is simply this: God established His Church in the days of Abraham and put children into it. They must remain there until He puts them out. He has nowhere put them out. They are still then members of His Church and as such entitled to its ordinances. Among these ordinances is baptism, which standing in similar place in the New Dispensation to circumcision in the Old, is like it to be given to children.</p></blockquote>

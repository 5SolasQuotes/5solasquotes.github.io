<main class="wrap"><figure class="quote" id="q-b194faad89" data-kw="">
<blockquote><p>10th Problem, ‘Where from bishops or the magistrate certain new and [previously] unused ceremonies, but called ‘indifferent’, are obtruded, whether a Church or the ministers ought to receive them in order to avoid a greater evil, for instance persecution or a major change in doctrine, or schism, etc.? I respond: 1st Conclusion: If the reception may note approbation, it is denied. For none ought to exert force to bear on the conscience or the power of the Church and the cause of truth for this reason. 2. If indeed the reception may note ecclesiastical connivance or permission, or toleration: of the common members it is able to be distinguished…</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/gisbertus-voetius.html">Gisbertus Voetius</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Ecclesiastical Politics</cite>, (Amsterdam, 1663-1676), vol. 1, pt 1, bk. 2, ‘Of Ecclesiastical Things, or Acts &amp; Exercises’, Tract 1, ‘Of Formularies, or Liturgies &amp; Rituals’, ch. 7, ‘Questions Further Explained on the Nature, Causes &amp; Properties of the Ceremonies’, Section 2, “Problems surrounding the causes of the ceremonies are these”, p. 431</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/worship/impurities-in-worship.html">Impurities in Worship</a></span></div>
<div class="actions"><button class="copy" data-copy="“10th Problem, ‘Where from bishops or the magistrate certain new and [previously] unused ceremonies, but called ‘indifferent’, are obtruded, whether a Church or the ministers ought to receive them in order to avoid a greater evil, for instance persecution or a major change in doctrine, or schism, etc.? I respond: 1st Conclusion: If the reception may note approbation, it is denied. For none ought to exert force to bear on the conscience or the power of the Church and the cause of truth for this reason. 2. If indeed the reception may note ecclesiastical connivance or permission, or toleration: of the common members it is able to be distinguished…”

%20able%20to%20be%20distinguished&amp;text=10th%20Problem%2C%20%E2%80%98Where%20from%20bishops%20or%20the%20magistrate&amp;text=common%20members%20it%20is%20able%20to%20be%20distinguished" rel="noopener" target="_blank">Read it online · Reformed Books Online</a></div>
</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-4f192e6f26" data-kw="">
<blockquote><p>For there were many in the congregation that were not sanctified: therefore the Levites had the charge of the killing of the passovers for every one that was not clean, to sanctify them unto the Lord. For a multitude of the people, even many of Ephraim, and Manasseh, Issachar, and Zebulun, had not cleansed themselves, yet did they eat the passover otherwise than it was written. But Hezekiah prayed for them, saying, ‘The good Lord pardon every one that prepareth his heart to seek God, the Lord God of his fathers, though he be not cleansed according to the purification of the sanctuary.’ And the Lord hearkened to Hezekiah, and healed the people. And the children of Israel that were present at Jerusalem kept the feast of unleavened bread seven days with great gladness:</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/old-testament.html">The Bible</a></span><span class="wk"><span class="lbl">Work:</span> <cite>2 Chron., 30:17-21</cite></span></figcaption>
<div class="meta"><span class="t"><a href="../topics/worship/impurities-in-worship.html">Impurities in Worship</a></span></div>

</figure><figure class="quote" id="q-3820906d0c" data-kw="">
<blockquote><p>The doctrine hence arising is this, that so long as we labor to keep the substance of God’s worship, though we fail in some circumstances thereof, He will be merciful to us. If we embrace the substance thereof willingly, and fail in the circumstances unwillingly, God will never lay it to out charge. Examples will prove this more fully unto us: ‘Ye have heard of the patience of God’ (says the apostle James) ‘and ye know what end God made with him.’ (James 5:11; Job 3)… there was in him a great deal of passion and distemper: and that he held out but very weakly in a great part of the conflict… yet because he held out in the substance of godliness, in the midst of all his woes and miseries… and in the end acknowledged his fault and desired to lay his hand upon his mouth: because (I say) these good things were found in him, God passes by his infirmities and takes notice of his patience, with high commendation thereof… For the Lord in his wisdom considered that it was not through any stubbornness, or rebellious disposition that he brake out in that manner…</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/john-dod.html">John Dod</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Ten Sermons, Tending Chiefly to the Fitting of Men for the Worthy Receiving of the Lord’s Supper</cite>, (1634), The Fourth Sermon of the Lord’s Supper, on 2 Chron. 30:18-20, pp. 122-23</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/worship/impurities-in-worship.html">Impurities in Worship</a></span></div>
<div class="actions"><button class="copy" data-copy="“The doctrine hence arising is this, that so long as we labor to keep the substance of God’s worship, though we fail in some circumstances thereof, He will be merciful to us. If we embrace the substance thereof willingly, and fail in the circumstances unwillingly, God will never lay it to out charge. Examples will prove this more fully unto us: ‘Ye have heard of the patience of God’ (says the apostle James) ‘and ye know what end God made with him.’ (James 5:11; Job 3)… there was in him a great deal of passion and distemper: and that he held out but very weakly in a great part of the conflict… yet because he held out in the substance of godliness, in the midst of all his woes and miseries… and in the end acknowledged his fault and desired to lay his hand upon his mouth: because (I say) these good things were found in him, God passes by his infirmities and takes notice of his patience, with high commendation thereof… For the Lord in his wisdom considered that it was not through any stubbornness, or rebellious disposition that he brake out in that manner…”

ce%20arising%20is%20this,he%20brake%20out%20in%20that%20manner&amp;text=The%20doctrine%20hence%20arising%20is%20this%2C%20that%20so&amp;text=disposition%20that%20he%20brake%20out%20in%20that%20manner" rel="noopener" target="_blank">Read it online · Reformed Books Online</a></div>
</figure><figure class="quote" id="q-f85c9e6781" data-kw="">
<blockquote><p>But what is that good and honest heart which they are commended for? it is a heart that does fully purpose to do well, though it fail much in that which it performs: that resolves beforehand to avoid the evil that shall be reproved, and to do the good duties that shall be commanded, and to believe and rest upon the promises that shall be pronounced, as far as God shall give ability, etc. Now wheresoever there is such a ready inclination unto goodness, there will be a bringing forth of fruit; though not in all alike, yet every one will do somewhat: and God will acknowledge them for good ground, and honest-hearted Christians, that yield Him but a thirty-fold, as well as those that yield Him sixty-fold,or an hundred-fold: for a less measure of fruitfulness is an argument of truth, as well as a greater measure, and therefore shall be respected and rewarded.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/john-dod.html">John Dod</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Ten Sermons, Tending Chiefly to the Fitting of Men for the Worthy Receiving of the Lord’s Supper</cite>, (1634), The Fourth Sermon of the Lord’s Supper, on 2 Chron. 30:18-20, p. 119</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/worship/impurities-in-worship.html">Impurities in Worship</a></span></div>

</figure><figure class="quote" id="q-682ade5ace" data-kw="">
<blockquote><p>… for I think neither ancient nor modern divines will call them schismatics who cordially join with the Church where they live in all of her worship, except this [singing of a human-composed doxology]… It is false also that all the Churches abroad have human ceremonies so twisted with their solemn worship that presbyterians cannot join with them. We have often (and do when occasion serves) very cordially, and to our edification, joined with them, and yet partake in none of these: nor is so much of these among them as he [the episcopal opponent] would make us believe.</p></blockquote>

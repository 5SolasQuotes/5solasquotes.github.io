<main class="wrap"><figure class="quote" id="q-9a4f26d536" data-kw="">
<blockquote><p>As also there is a greater company of persons, called out of the world, to profess the name of Jesus and to worship Him outwardly, according to his Word, and to own Him for their King, by submitting to his laws, ordinances and officers by an outward profession. And this is that company, which is called the visible Church, because both their exercise, and their bond of union with this King, and with one another, is outward, and obvious to the eye; to wit, an open profession of the true religion and outward submission to and following of the ordinances and institutions of Christ: But as to this visible Church, in his [a Quaker’s] following words, he seems to take no notice thereof; for he describes to us the Church Invisible; and then tells us, that without this Church there is no salvation. But this is impertinently spoken; for that Church is made up only of the elect; And if we should speak of the Invisible Church, as now existing in this world, we could not say that any elect belonged to it, but such as were effectually called; for the rest were not yet called out of the world, or out of their state of nature; and he told us, that a church is a company of persons called out of the world. To say then that there is no salvation out of that company, that are already effectually called, is neither pertinent, nor truth; for there are many, who are not yet called, whom God, will in due time call and bring home; and these whom He has elected, He does bring into the visible Church where they may enjoy the ordinances, which God hath appointed for conversion: And therefore we say, that out of this visible Church there is ordinarily no salvation: But all this is said by him to make way for his Church, that will take in heathens, pagans, Turks and Tartars, that never heard, nor never shall hear a word of Jesus Christ; which Church, as he would delineate it to us, has not the least relation to Christ, as Head and King; nor any advantage of, or interest in the institutions of Jesus Christ.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/john-brown-of-wamphray.html">John Brown of Wamphray</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Quakerism the Pathway to Paganism... (Edinburgh: John Cairns, 1678), ch. 16</cite>, pp. 360-61</span></figcaption>

</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-955ba2332e" data-kw="marks word sacraments duty join true church">
<blockquote><p>Is the truth of doctrine which is held in any assembly, or its conformity with the word of God by the pure preaching and profession of the word, and the lawful administration and use of the sacraments, a mark of the true visible church? We affirm against the Romanists. After having treated of the nature, properties and adjuncts of the church, the order demands that we discuss its marks. This question pertains to its external state and is of the highest importance in religion. For since salvation cannot be obtained except in communion with the true church and many glory in this sacred name who are destitute of its truth, it is of great value to know its true marks that we may be able to distinguish the true fold of Christ from the dens of thieves and dens of robbers.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/francis-turretin.html">Francis Turretin</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Institutes of Elenctic Theology</cite>, 18.12.1</span></figcaption>

</figure><figure class="quote" id="q-bf4c3b0d77" data-kw="">
<blockquote><p>The seconde rule is, that there is no salvation out of the Church, and that therefore every one which is to be saved must become a member and a citizen of the catholic and apostolic Church: and such as remain forever out of the same perish eternally. Therefore St. John says, ‘They went out of us, they were not of us, for if they had been of us,’ they would have remained with us: but this comes to pass that it might appear that they are not all of us.’ And again, that such as be holy are in the city of God, but without, that is, forth of the Church are dogs, enchanters,whoremongers, adulterers, etc. And the ark out of which all perished, figured the Church, out of which all are condemned. And for this cause St. Luke says that ‘the Lord added to the Church from day to day such as should be saved.’ [Acts 2] And the reason hereof is plain: for without Christ there is no salvation, but out of the militant Church there is no Christ nor faith in Christ: and therefore no salvation. Again, forth of the militant Church there are no means of salvation, no preaching of the word, no invocation of God’s name, no sacraments, and therefore no salvation. For this cause every man must be admonished evermore to join himself to some particular Church† being a sound member of the catholic Church. † [A “particular Church”, as seen by many quotes on this webpage, often referred in that era to some national or regional Church, such as that of England, Germany, Constantinople, etc., not necessarily a local church, especially when the Anglican Church in that era (which Perkins was a part of) often did not have local sessions of elders with local church membership in any proper sense.] The third rule is that the Church which here we believe is only one, as Christ Himself speaks, ‘My dove is alone, and my undefiled is the only daughter of her mother.’ [Song 6:8] And as there is only one God and one Redeemer, one faith, one baptism and one way of salvation by Christ only, so there is but one Church alone.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/william-perkins.html">William Perkins</a></span><span class="wk"><span class="lbl">Work:</span> <cite>An Exposition of the Symbol or Creed of the Apostles... (Cambridge: Legatt, 1595), An Exposition of the Creed</cite>, pp. 486-87</span></figcaption>

<blockquote><p>…we must not imagine that there are many Churches in the world, neither is that body to be separated which can bear or suffer no kind of division. Writers call the Church catholic, which undoubtedly signifies universal, because it is but one, neither can there be any more… And particular or several churches are as towns or cities in a kingdom: the multitude of cities divides not a kingdom. Of particular churches† dispersed throughout all the world, as a body of many members, is gathered and compacted together the catholic and universal church, which is the fellowship of all the saints. Therefore most certain it is that there is but one only Church of God, not many, whereof the only monarch is Jesus Christ; to whom be glory. † [Bullinger likely has in mind national or regional Churches (as numerous on this webpage); see sermon 1, p. 10 (top) where he speaks “of all the particular churches throughout the whole world, and of all the visible parts and members thereof.” The “visible parts” of such particular churches, in distinction from members, likely referred to lower levels of the Church under national Churches. Bullinger also speaks in that place of discipline being brought on the obstinate, likely referring to excommunication (Bullinger, Questions of Religion Cast Abroad (1572), ch. 14, pp. 119-20), which for him likely would have been carried out regionally.] The unity and united society of this Church of God is so great that out of her fellowship is there no people found acceptable unto God, any true salvation or safety, any light or truth; for without the pale of God’s church are no wholesome pastures found, all are infected with poison. No religion pleases God out of the Church of God… Lactantius therefore most truly says: “It is only the catholic Church, which retains true religion. Here is the fountain of truth: this is the household of faith: this is the Temple of God; into which if one enter not, or out of which if any depart, he is excluded from the hope of salvation and life everlasting.” [Institutes, bk. 4, ch. 30 (Leiden, 1660), p. 450] For our Saviour first said, that out of the sheepfold life is not found.</p></blockquote>

<div class="actions"><button class="copy" data-copy="“…we must not imagine that there are many Churches in the world, neither is that body to be separated which can bear or suffer no kind of division. Writers call the Church catholic, which undoubtedly signifies universal, because it is but one, neither can there be any more… And particular or several churches are as towns or cities in a kingdom: the multitude of cities divides not a kingdom. Of particular churches† dispersed throughout all the world, as a body of many members, is gathered and compacted together the catholic and universal church, which is the fellowship of all the saints. Therefore most certain it is that there is but one only Church of God, not many, whereof the only monarch is Jesus Christ; to whom be glory. † [Bullinger likely has in mind national or regional Churches (as numerous on this webpage); see sermon 1, p. 10 (top) where he speaks “of all the particular churches throughout the whole world, and of all the visible parts and members thereof.” The “visible parts” of such particular churches, in distinction from members, likely referred to lower levels of the Church under national Churches. Bullinger also speaks in that place of discipline being brought on the obstinate, likely referring to excommunication (Bullinger, Questions of Religion Cast Abroad (1572), ch. 14, pp. 119-20), which for him likely would have been carried out regionally.] The unity and united society of this Church of God is so great that out of her fellowship is there no people found acceptable unto God, any true salvation or safety, any light or truth; for without the pale of God’s church are no wholesome pastures found, all are infected with poison. No religion pleases God out of the Church of God… Lactantius therefore most truly says: “It is only the catholic Church, which retains true religion. Here is the fountain of truth: this is the household of faith: this is the Temple of God; into which if one enter not, or out of which if any depart, he is excluded from the hope of salvation and life everlasting.” [Institutes, bk. 4, ch. 30 (Leiden, 1660), p. 450] For our Saviour first said, that out of the sheepfold life is not found.”

— Heinrich Bullinger, 2nd Sermon, ‘That there is One catholic Church; that without the Church there is no light or salvation; against schismatics; wherefore we depart from the upstart Church of Rome; that the Church of God is the house, vineyard and Kingdom of God; and the body, sheepfold and spouse of Christ; a mother and a virgin’ in The Decades ed. Thomas Harding (1549; Cambridge: Parker Society, 1850), vol. 4, 5th Decade, pp. 49-92, pp. 50-52">Copy</button><a class="share" href="https://x.com/intent/post?text=%E2%80%9C%E2%80%A6we+must+not+imagine+that+there+are+many+Churches+in+the+world%2C+neither+is+that+body+to+be+separated+which+can+bear+or+suffer+no+kind+of+division.+Writers+call+the+Church+catholic%2C+which+undoubtedly+signifies+universal%2C+because+it+is+but+one%2C+neither+can+there+be+any+more%E2%80%A6+And+particular+or+several+churches+are+as+towns+or+cities+in+a+kingdom%3A+the+multitude+of+cities+divides+not+a+kingdom.+Of+particular+churches%E2%80%A0+dispersed+throughout+all+the+world%2C+as+a+body+of+many+members%2C+is+gathered+and+compacted+together+the+catholic+and+universal+church%2C+which+is+the+fellowship+of+all+the+saints.+Therefore+most+certain+it+is+that+there+is+but+one+only+Church+of+God%2C+not+many%2C+whereof+the+only+monarch+is+Jesus+Christ%3B+to+whom+be+glory.+%E2%80%A0+%5BBullinger+likely+has+in+mind+national+or+regional+Churches+%28as+numerous+on+this+webpage%29%3B+see+sermon+1%2C+p.+10+%28top%29+where+he+speaks+%E2%80%9Cof+all+the+particular+churches+throughout+the+whole+world%2C+and+of+all+the+visible+parts+and+members+thereof.%E2%80%9D+The+%E2%80%9Cvisible+parts%E2%80%9D+of+such+particular+churches%2C+in+distinction+from+members%2C+likely+referred+to+lower+levels+of+the+Church+under+national+Churches.+Bullinger+also+speaks+in+that+place+of+discipline+being+brought+on+the+obstinate%2C+likely+referring+to+excommunication+%28Bullinger%2C+Questions+of+Religion+Cast+Abroad+%281572%29%2C+ch.+14%2C+pp.+119-20%29%2C+which+for+him+likely+would+have+been+carried+out+regionally.%5D+The+unity+and+united+society+of+this+Church+of+God+is+so+great+that+out+of+her+fellowship+is+there+no+people+found+acceptable+unto+God%2C+any+true+salvation+or+safety%2C+any+light+or+truth%3B+for+without+the+pale+of+God%E2%80%99s+church+are+no+wholesome+pastures+found%2C+all+are+infected+with+poison.+No+religion+pleases+God+out+of+the+Church+of+God%E2%80%A6+Lactantius+therefore+most+truly+says%3A+%E2%80%9CIt+is+only+the+catholic+Church%2C+which+retains+true+religion.+Here+is+the+fountain+of+truth%3A+this+is+the+household+of+faith%3A+this+is+the+Temple+of+God%3B+into+which+if+one+enter+not%2C+or+out+of+which+if+any+depart%2C+he+is+excluded+from+the+hope+of+salvation+and+life+everlasting.%E2%80%9D+%5BInstitutes%2C+bk.+4%2C+ch.+30+%28Leiden%2C+1660%29%2C+p.+450%5D+For+our+Saviour+first+said%2C+that+out+of+the+sheepfold+life+is+not+found.%E2%80%9D%0A%0A%E2%80%94+Heinrich+Bullinger%2C+2nd+Sermon%2C+%E2%80%98That+there+is+One+catholic+Church%3B+that+without+the+Church+there+is+no+light+or+salvation%3B+against+schismatics%3B+wherefore+we+depart+from+the+upstart+Church+of+Rome%3B+that+the+Church+of+God+is+the+house%2C+vineyard+and+Kingdom+of+God%3B+and+the+body%2C+sheepfold+and+spouse+of+Christ%3B+a+mother+and+a+virgin%E2%80%99+in+The+Decades+ed.+Thomas+Harding+%281549%3B+Cambridge%3A+Parker+Society%2C+1850%29%2C+vol.+4%2C+5th+Decade%2C+pp.+49-92%2C+pp.+50-52&amp;url=https%3A%2F%2F5solasquotes.github.io%2Fquote%2F2d2531e69e.html&amp;via=5Solas" target="_blank" rel="noopener">Share on X</a><a class="perma" href="../quote/2d2531e69e.html">Permalink</a><a class="src" href="https://reformedbooksonline.com/on-the-phrase-there-is-no-salvation-outside-the-church/#:~:text=%E2%80%A6we%20must%20not%20imagine%20that%20there,the%20sheepfold%20life%20is%20not%20found." rel="noopener" target="_blank">Read it online · Reformed Books Online</a></div>

<blockquote><p>§.23. Of the restraint of the benefit of Christ’s headship to them only that are of his body. That none but those who are of Christ’s body shall partake of the benefit of his office is clear by other like titles of restraint, as ‘his people’, and ‘his sheep’: but especially by denying to the world the benefit of his intercession, ‘I pray not for the world,’ says He. In this respect this position (out of the Church no salvation) is without exception true: for the body is the true, catholic, invisible Church: he that is not a member of this Church, but is out of it, has not Christ to be his head and Savior, whence then can he have salvation? The former point is not more comfortable to those that have assurance that they are members of this body, then this is terrible to those that give too great evidence they are no members thereof; as all they do that have not the spirit of Christ ruling in them, but rather rebel against Him: and bear no love to the saints, but rather hate them, and do them all the spight they can.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/william-gouge.html">William Gouge</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Of Domestical Duties… (London: Haviland, 1622), 1st Treatise, §23</cite></span></figcaption>

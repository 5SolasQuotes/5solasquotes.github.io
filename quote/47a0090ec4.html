<main class="wrap"><figure class="quote" id="q-47a0090ec4" data-kw="">
<blockquote><p>The word ‘worship’ in general signifies: 1. Anything done in honor to another; and so all our obedience to God is worship: It is to his glory that we must do all… 2. Any immediate act or expression of the honor and reverence of the heart… This worship, as within, is the secret act of the soul; as expressed, it is the act of the body.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/richard-baxter.html">Richard Baxter</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Schism Detected in both Extremes, or Two Sorts of Sinful Separation</cite>, … (London: 1684), pt. 2, pp. 2-3</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/worship/nature-of-worship.html">Nature of Worship</a></span></div>

</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-76b56e04c0" data-kw="">
<blockquote><p>There are three fundamental principles held by non-conformists (and those especially of them which are called presbyterians) wherein they differ from others: 1. That the Scriptures of the Old and New Testament are a perfect Rule for Christians, directing them not only what to believe in the things of God, but also what to do in all matters relating to the Worship of God, and the government of the Church; so as in these things they may not either believe or do what is not there expressly, or by immediate consequence revealed. In civil matters they believe the Scripture to be only a general rule, or rather as to them, to contain some general rules only, by which all men’s actions are to be directed; but in sacred things, they believe the Scriptures to be a particular rule… Thus they differ from Papists, who will not allow the Scriptures to be a perfect rule as to matters of faith; and from those, who although they allow them in matters of faith a perfect rule, yet deny them to be so in the matters of worship, or government of the Church; and as to the first, say that the Scriptures are only a perfect rule as to acts of worship, not as to means, and modes, or religious rites used in, and about the worship of God; but that these may be directed by superiours for spiritual edification; or who say, that the Scripture has only directed that the Church should be governed, but has left to superiours to determine by what officers, acts and rules that government should be exercised: So as the first and main question is, Whether the Scriptures be a perfect and sufficient rule for Christians in matters of worship, and Church government, as well as matters of faith? which those called presbyterians believe it is; because they find sufficient directions in it for the decent and orderly performance of all acts of worship, without any human supplements; and such Church-officers directed by it, such acts of jurisdiction and censures prescribed in it, as are sufficient to preserve the unity, peace and purity of the Church; which are the great ends of that government.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/english-presbyterians.html">English Presbyterians</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Anonymous, English Presbytery, or an Account of the Main Opinions of those ministers and people in England who go under the name of Presbyterians</cite>, … (London, 1680), pp. 1-2</span></figcaption>

</figure><figure class="quote" id="q-748db3f4cb" data-kw="">
<blockquote><p>And thus have we made good our argument that the lawfulnss of the ceremonies cannot be warranted by any ecclesiastical law. If we had no more against them, this were enough, that they are but human additions and want the warrant of the Word. When Nadab and Abihu offered strange fire before the Lord (Lev. 10:1), and when the Jews burnt their sons and their daughters in the valley of the son of Hinnon, howsoever manifold wickedness might have been challenged in that which they did, yet if any would dispute with God upon the matter, He stops their mouths with this one answer, ‘I commanded it not, neither came it into my heart.’ (Jer. 7:31)</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/george-gillespie.html">George Gillespie</a></span><span class="wk"><span class="lbl">Work:</span> <cite>English Popish Ceremonies</cite>, (1637), bk. 3, ch. 7, section 14, p. 122</span></figcaption>

</figure><figure class="quote" id="q-1224286efb" data-kw="">
<blockquote><p>Hence arises a manifold difference between the moral law and others [ceremonial and judicial] both in origin (because the moral is founded upon natural right and on this account is known by nature; but the others upon positive right and on this account are from free revelation) and in duration. The former is immutable and eternal; the latter mutable and temporary. In regard to object, the one is universal embracing all; the others particular applying only to the Jews… In regard to use, the moral is the end of the others, while the others are subservient to the moral.</p></blockquote>

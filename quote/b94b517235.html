<main class="wrap"><figure class="quote" id="q-b94b517235" data-kw="">
<blockquote><p>But let Christians never be unmindful of the awful as well as gracious character of the dispensation under which they live—a dispensation which teaches them to believe, not so much that they live continually under the eye and in the presence of God, as that God himself has come unto them and abides within them.

“Know ye not,” says the Apostle, addressing his Corinthian converts, “know ye not that ye are the temple of God, and that the Spirit of God dwelleth in you? If any man defile the temple of God, him shall God destroy; for the temple of God is holy, which temple ye are.” It is no doubt a solemn thing to think that the eye of that God who dwelleth in heaven is constantly open upon us, and that, go where we may, we cannot for a single instant escape from his sight; but it is unspeakably more solemn to believe, as the Christian is taught to do, not so much that God is looking upon him from the distant heaven, as that God has come to him, and has made his abode within him—that the everlasting Spirit of all truth is present to every movement of his inmost soul, and immediately in contact with his spirit; and that, think what he may, whether it be for good or for evil, the thought is formed and entertained, not only under the eye, but within the very secret residence of the Deity.

Let a Christian weigh well and it will constrain him more powerfully than any thing else to work out his own salvation with fear and trembling. To feel habitually that his soul is thus the temple of the Holy Ghost, and that a Divine and gracious power is constantly exerted upon his heart—to remember that every desire, and thought, and feeling that he cherishes is either in conformity with that power or in opposition to it, and that, consequently, at every moment he must be either led by the Spirit or given over of the Spirit—to live under an abiding sense of this will teach the believer effectually what manner of person he ought to be in all holy conversation and godliness. What ought to be the purity maintained within the sanctuary of that soul whose privilege it is to be constituted a residence and a temple for the Holy Ghost? and with what deep fear and trembling ought he to regard the possibility of sin entering into and defiling that abode which is consecrated by the presence of Him who cannot look on sin but with abhorrence?

It is impossible to imagine a more awful motive to vigilance and holy jealousy than that which is supplied to the believer in the reflection that the entrance of an evil thought, or feeling, or purpose, into his soul, is a profanation done to the dwelling-place of God, and a despite unto his Holy Spirit; that the cherishing of such iniquity in the heart may at length provoke the Divine Inhabitant to withdraw altogether from the polluted abode—to give it up to the defilement which it has chosen, and to abandon it for ever to the possession of sins wilfully indulged. The very thought of such a result will be enough to awaken every latent energy within the Christian’s heart; and the consciousness, therefore, that God dwelleth in him by his Spirit, and is continually working in him with a view to carry forward the moral advancement of his nature, will be the most effectual of all arguments to zeal, and diligence, and perseverance in the work of the Lord.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/james-bannerman.html">James Bannerman</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Indwelling of the Holy Ghost more Precious to Believers than the Visible Presence of Christ in The Free Church Pulpit; Consisting of Discourses by the Most Eminent divines of the Free Church of Scotland. Vol. I.</cite></span></figcaption>

</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-f011f07cf2" data-kw="">
<blockquote><p>I am fully aware that it has been said that the support of the gospel by the individual members of the church under the New Testament is as much a positive institution as any of the ordinances of the gospel, and the ninth chapter of the first epistle to the Corinthians is referred to as proof. If this were so, Paul must have acted a very unkind and sinful part towards the Corinthians, when he labored among them without receiving any support, as he tells us. [2 Corinthians 11:9] Had it been so, Paul had no right to deprive the Corinthians of such a positive privilege. But the truth is, that while Paul had the right as he says of living by his ministry among them; for reasons of Christian expediency he foregoes his claim, but he did them no injury, which otherwise he must have done on the principle of the objection.

This passage establishes the principle that the minister of the gospel should be rewarded for his spiritual labors, by receiving of carnal things necessary for his external wants, but leaves undetermined by whom this shall be given, whether by individuals or the state.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/david-scott.html">David Scott</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Distinctive principles of the Reformed Presbyterian Church</cite>, (Albany, 1841), pp 292-3.</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/worship.html">Worship</a></span></div>

</figure><figure class="quote" id="q-5d4a47d677" data-kw="">
<blockquote><p>This study addresses the issue of v. 15 in 1 Cor 11:2-16 from the perspective of a veiling custom. If veiling is in view (the position adopted here), then how does one confront the difficulty of reconciling the overall context with the exceptional statement in v. 15 that long hair for a woman is a glory. If, as the text argues, long hair is to be taken as a ‘glory,’ by what logic could a woman understand that she should place a veil upon her head? This article provides a way out of the dilemma by showing how a veil can serve the double function of reflecting the hair’s beauty while at the same time preserving a symbol of female modesty.” – Abstract ‘Veiling among Men in Roman Corinth: 1 Corinthians 11:4 &amp; the Potential Problem of East Meeting West’ Pre Journal of Biblical Literature, vol. 137, no. 2 (Summer, 2018), pp. 501-17 Brown (below) had previously argued against Massey and another scholar on whether the key greek syntax in 1 Cor. 11:4 could mean, or primarily does mean, that it was a shame for men to have long hair while praying (Brown), or that it was a shame for a man to pray with a material head-covering on (Massey). This article of Massey follows that of Brown but never appears to address Brown’s article directly. This work of Massey “is based on the foundational work of Oster, Gill, and Finney.</p></blockquote>

<blockquote><p>The third Impediment of the Churches restauration taken away by these great earth-quakes, is error, heresy, false worship, idolatry, &amp;c. You cannot preach, nor pray them down directly and immediately (though all other meanes depend upon these (and the Saints must own the thing) God is terrible out of his holy places, Psa. 68.35.) Well, that which the Word cannot do, the sword shall; that which the water cannot wash out, the fire will burn out. Unto this particular the Apostle applies this very text in part, namely concerning the shaking of the Heavens, Heb, 12.26, 27. Yet once more I shake not earth only, but also heaven, &amp;c.

An earth-quake (as we have heard) was appointed to shake down the ceremonial Ordinances; now if this were necessary for the abolition of that divine worship, which had sometimes been by God’s own holy institution, how much more shall that which hath been of human invention (yea, the very fumes and fogs of the bottomless pit) to God’s infinite displeasure and dishonour, be tumbled down with violence and vengeance to hell, from whence it came? And therefore as the heathenish idolatry fell with such a terrible earthquake as shook down both it and all its supporters both Emperors and Empire; even so shall antichristian idolatry and heresy with Babylon their Mother, the Beast their Father, and all their intoxicated and dementated defenders, be thrown like a Mill-stone into the bottom of the sea, Rev. 18.21.</p></blockquote>

<div class="actions"><button class="copy" data-copy="“The third Impediment of the Churches restauration taken away by these great earth-quakes, is error, heresy, false worship, idolatry, &amp;c. You cannot preach, nor pray them down directly and immediately (though all other meanes depend upon these (and the Saints must own the thing) God is terrible out of his holy places, Psa. 68.35.) Well, that which the Word cannot do, the sword shall; that which the water cannot wash out, the fire will burn out. Unto this particular the Apostle applies this very text in part, namely concerning the shaking of the Heavens, Heb, 12.26, 27. Yet once more I shake not earth only, but also heaven, &amp;c.

An earth-quake (as we have heard) was appointed to shake down the ceremonial Ordinances; now if this were necessary for the abolition of that divine worship, which had sometimes been by God’s own holy institution, how much more shall that which hath been of human invention (yea, the very fumes and fogs of the bottomless pit) to God’s infinite displeasure and dishonour, be tumbled down with violence and vengeance to hell, from whence it came? And therefore as the heathenish idolatry fell with such a terrible earthquake as shook down both it and all its supporters both Emperors and Empire; even so shall antichristian idolatry and heresy with Babylon their Mother, the Beast their Father, and all their intoxicated and dementated defenders, be thrown like a Mill-stone into the bottom of the sea, Rev. 18.21.”

— William Reyner, Babylon’s ruining-earthquake and the restoration of Zion delivered in a sermon before the honourable House of Commons at Margaret’s Westminster, at their public fast, August 28, 1644, (London: Samuel Enderby, 1644), pp 20-21.">Copy</button><a class="share" href="https://x.com/intent/post?text=%E2%80%9CThe+third+Impediment+of+the+Churches+restauration+taken+away+by+these+great+earth-quakes%2C+is+error%2C+heresy%2C+false+worship%2C+idolatry%2C+%26c.+You+cannot+preach%2C+nor+pray+them+down+directly+and+immediately+%28though+all+other+meanes+depend+upon+these+%28and+the+Saints+must+own+the+thing%29+God+is+terrible+out+of+his+holy+places%2C+Psa.+68.35.%29+Well%2C+that+which+the+Word+cannot+do%2C+the+sword+shall%3B+that+which+the+water+cannot+wash+out%2C+the+fire+will+burn+out.+Unto+this+particular+the+Apostle+applies+this+very+text+in+part%2C+namely+concerning+the+shaking+of+the+Heavens%2C+Heb%2C+12.26%2C+27.+Yet+once+more+I+shake+not+earth+only%2C+but+also+heaven%2C+%26c.%0A%0AAn+earth-quake+%28as+we+have+heard%29+was+appointed+to+shake+down+the+ceremonial+Ordinances%3B+now+if+this+were+necessary+for+the+abolition+of+that+divine+worship%2C+which+had+sometimes+been+by+God%E2%80%99s+own+holy+institution%2C+how+much+more+shall+that+which+hath+been+of+human+invention+%28yea%2C+the+very+fumes+and+fogs+of+the+bottomless+pit%29+to+God%E2%80%99s+infinite+displeasure+and+dishonour%2C+be+tumbled+down+with+violence+and+vengeance+to+hell%2C+from+whence+it+came%3F+And+therefore+as+the+heathenish+idolatry+fell+with+such+a+terrible+earthquake+as+shook+down+both+it+and+all+its+supporters+both+Emperors+and+Empire%3B+even+so+shall+antichristian+idolatry+and+heresy+with+Babylon+their+Mother%2C+the+Beast+their+Father%2C+and+all+their+intoxicated+and+dementated+defenders%2C+be+thrown+like+a+Mill-stone+into+the+bottom+of+the+sea%2C+Rev.+18.21.%E2%80%9D%0A%0A%E2%80%94+William+Reyner%2C+Babylon%E2%80%99s+ruining-earthquake+and+the+restoration+of+Zion+delivered+in+a+sermon+before+the+honourable+House+of+Commons+at+Margaret%E2%80%99s+Westminster%2C+at+their+public+fast%2C+August+28%2C+1644%2C+%28London%3A+Samuel+Enderby%2C+1644%29%2C+pp+20-21.&amp;url=https%3A%2F%2F5solasquotes.github.io%2Fquote%2F2e24929fd9.html&amp;via=5Solas" target="_blank" rel="noopener">Share on X</a><a class="perma" href="../quote/2e24929fd9.html">Permalink</a><a class="src" href="https://reformedcovenanter.wordpress.com/2021/02/06/william-reyner-god-uses-calamities-to-destroy-false-worship/" rel="noopener" target="_blank">Read it online · Reformed Covenanter</a></div>

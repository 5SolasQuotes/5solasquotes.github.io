<blockquote><p>4th Conclusion is this… Now if a church should be in a remote island, not consociate with other churches, and yet wanting guides [officers], our [congregationalist] brethren say in this case, the power of the keys should be seen to be in believers, and they might choose and ordain their own officers. I grant they have great [Romanist] schoolmen to say with them… But I say in this case necessity is an unbooked and naughty lawyer, and God extraordinarily should supply the want of ordination, as He can do the defect of second causes: so that if God send some pastors to a congregation that were unwilling to choose their own eldership, pastors might ordain themselves pastors in that case to these people, and God should supply their want of popular election…</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/samuel-rutherford.html">Samuel Rutherford</a></span><span class="wk"><span class="lbl">Work:</span> <cite>A Peaceable &amp; Temperate Plea for Paul’s Presbytery in Scotland</cite>, (1642), pp. 5-7</span></figcaption>

</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-479cbfa66b" data-kw="">
<blockquote><p>Ordination is the act of a presbytery.[t] The power of ordering the whole work of ordination is in the whole presbytery, which, when it is over more congregations than one, whether these congregations be fixed or not fixed, in regard of officers or members, it is indifferent as to the point of ordination.[v] [t] 1 Tim. 4:14. [v] 1 Tim. 4:14. It is very requisite, that no single congregation, that can conveniently associate, do assume to itself all and sole power in ordination:

1. Because there is no example in scripture that any single congregation, which might conveniently associate, did assume to itself all and sole power in ordination; neither is there any rule which may warrant such a practice.

2. Because there is in scripture example of an ordination in a presbytery over diverse congregations; as in the church of Jerusalem, where were many congregations: these many congregations were under one presbytery, and this presbytery did ordain. The preaching presbyters orderly associated, either in cities or neighboring villages, are those to whom the imposition of hands doth appertain, for those congregations within their bounds respectively.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/samuel-rutherford.html">Samuel Rutherford</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Westminster’s Form of Presbyterial Church Government 1645</cite>, Touching the Power of Ordination</span></figcaption>

</figure><figure class="quote" id="q-8647513db6" data-kw="">
<blockquote><p>2nd Conclusion. Thence may well be deduced that they are lawful pastors and need not a calling revealed, who, in cases of extraordinary necessity are only chosen by the people, and not ordained by pastors; and that pastors ordained by pastors, as such, are pastors of the same nature, as Matthias called by the Church and Paul immediately called from Heaven, had one and the same office by nature.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/samuel-rutherford.html">Samuel Rutherford</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Due Right of Presbyteries, ‘Acts 15, A Pattern of a Juridicial Synod’</cite>, (1644), pt. 1, p. 186</span></figcaption>

</figure><figure class="quote" id="q-546a5fc60b" data-kw="">
<blockquote><p>We grant in this Question:

1. That private Christians from the common duty of charity, making use of those spiritual gifts which they have received from God for men’s edification, do sometimes convert to the faith those souls which went astray; and bring those who live in the world, out of the Church, unto the body of the Church of Christ. See Jn. 4:29, etc. 1 Cor. 7:16.

2. We do not think that the office of him who preaches the Word, as sent of God and the Church, do confer any efficacy to the Word preached by him; or has any influence upon the soul of him that is converted. For the power of God only, and the Spirit which accompanies the Word preached, does give to the Word preached a virtue and saving efficacy for the conversion and salvation of souls, 1 Cor. 12:11 and 15:10. But we affirm that the Word preached by him who is ordained to an ecclesiastical office, and does by his ecclesiastical office authoritatively preach the Word, is the ordinary means to which God does by the efficacy of his Spirit give assistance for the conversion of those who live in sin out of Church-communion. So that pastors, as pastors, by virtue of their pastoral office are the ordinary means of the conversion of those men who live in the world. This assertion is proved:

1. Because faith is given and first attained by the Word preached, by those who by an ecclesiastical call are sent of God, to the pastoral Office, and by virtue of mission and function preach the Word, whereby faith is wrought in man. See Rom. 10:14-15; 1 Cor. 3:19; Gal. 3:2.

2. Because pastors of Churches by reason of the office they bear, are fathers, who do first beget their children to Christ in the Church; and by the spiritual seed of God, do give spirit and life to those that are dead in sins: See 1 Cor. 4:15; Gal. 4:19; 2 Cor. 2:16.

3. Pastors are enjoined, as an office peculiarly belonging to them, to preach the Word of God with all meekness, mildness, and patience, if perhaps God will give repentance to those who are held captives in the snares of the Devil, 2 Tim. 2:24-26, to open the eyes of those who sit in darkness, and to bring them to the light of the Gospel and of grace, Acts 26:18, to seek lost sheep for the Lord, Eze. 34:4-5, and to bring into captivity to the obedience of Christ those who with high minds exalt themselves against the Word of God, 2 Cor. 10:4-5. We reject therefore the opposite positions of those:

1. Who affirm that the conversion of wicked men is not an effect intended that it should be produced by virtue of the ecclesiastical ministry as a means appointed to that end; and therefore that never any are converted by the pastors of the Church by virtue of any ecclesiastical office but by accident, as they are gifted Christians: affirming that ordinarily the conversion of such as go astray is by such Christians endued with gifts of prophesy. But it is certain from the holy Scripture that the ecclesiastical ministry is appointed by God for this end, as the ordinary means whereby such as are strangers and enemies to God may be reconciled, 2 Cor. 5:20, and brought to Christ, 2 Cor. 11:2-4.

2. Of those who affirm that sincere conversion of men is a certain argument that those by whose preaching the Word they are converted are sent of God, according to that Rom. 10:14-15; Jer. 23:32. But we judge that the sending which the apostle speaks of, Rom. 10:14-15, is a sending to an office in a due order, whether extraordinary or ordinary, ecclesiastically performed; and that it consists not only in conferring gifts, whereby a man is made fit for the ministery, or prophecy, but in conferring authority and conveying ministerial authority; as the Protestants prove by manifest arguments against the Socinians. And although private Christians in the duty of charity, and by reason of gifts wherein they are subservient to God, do convert some from their sins; yet it follows not that they are thus sent, as that they have authority as the ambassadours of Christ in his Name to preach the Word of God authoritatively; because they want [lack] the authoritative mission by the Church of Christ, whereby that ministry in the Church is conferred wherein men as the ambassadors of Christ preach the Word of reconciliation, 1 Tim. 4:14; Tit. 1:5, 9-10; 2 Cor. 5:20. Hence also our Belgic Reformed Churches acknowledge that preaching of the Word by ministers ecclesiastically called, is the ordinary means of men’s repentance and first reconciliation to God: as appears by the ecclesiastical Form of establishing pastors in the ministry of the Church through the whole Netherlands.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/wilhelm-apollonius.html">Wilhelm Apollonius</a></span><span class="wk"><span class="lbl">Work:</span> <cite>A Consideration of Certain Controversies at this Time Agitated in the Kingdom of England concerning the Government of the Church of God</cite>, (London: G.M., 1645), ch. 5, ‘Of the Ecclesiastical Ministry, and the Exercise thereof’, pp. 67-70</span></figcaption>

+office+they+bear%2C+are+fathers%2C+who+do+first+beget+their+children+to+Christ+in+the+Church%3B+and+by+the+spiritual+seed+of+God%2C+do+give+spirit+and+life+to+those+that+are+dead+in+sins%3A+See+1+Cor.+4%3A15%3B+Gal.+4%3A19%3B+2+Cor.+2%3A16.+3.+Pastors+are+enjoined%2C+as+an+office+peculiarly+belonging+to+them%2C+to+preach+the+Word+of+God+with+all+meekness%2C+mildness%2C+and+patience%2C+if+perhaps+God+will+give+repentance+to+those+who+are+held+captives+in+the+snares+of+the+Devil%2C+2+Tim.+2%3A24-26%2C+to+open+the+eyes+of+those+who+sit+in+darkness%2C+and+to+bring+them+to+the+light+of+the+Gospel+and+of+grace%2C+Acts+26%3A18%2C+to+seek+lost+sheep+for+the+Lord%2C+Eze.+34%3A4-5%2C+and+to+bring+into+captivity+to+the+obedience+of+Christ+those+who+with+high+minds+exalt+themselves+against+the+Word+of+God%2C+2+Cor.+10%3A4-5.+We+reject+therefore+the+opposite+positions+of+those%3A+1.+Who+affirm+that+the+conversion+of+wicked+men+is+not+an+effect+intended+that+it+should+be+produced+by+virtue+of+the+ecclesiastical+ministry+as+a+means+appointed+to+that+end%3B+and+therefore+that+never+any+are+converted+by+the+pastors+of+the+Church+by+virtue+of+any+ecclesiastical+office+but+by+accident%2C+as+they+are+gifted+Christians%3A+affirming+that+ordinarily+the+conversion+of+such+as+go+astray+is+by+such+Christians+endued+with+gifts+of+prophesy.+But+it+is+certain+from+the+holy+Scripture+that+the+ecclesiastical+ministry+is+appointed+by+God+for+this+end%2C+as+the+ordinary+means+whereby+such+as+are+strangers+and+enemies+to+God+may+be+reconciled%2C+2+Cor.+5%3A20%2C+and+brought+to+Christ%2C+2+Cor.+11%3A2-4.+2.+Of+those+who+affirm+that+sincere+conversion+of+men+is+a+certain+argument+that+those+by+whose+preaching+the+Word+they+are+converted+are+sent+of+God%2C+according+to+that+Rom.+10%3A14-15%3B+Jer.+23%3A32.+But+we+judge+that+the+sending+which+the+apostle+speaks+of%2C+Rom.+10%3A14-15%2C+is+a+sending+to+an+office+in+a+due+order%2C+whether+extraordinary+or+ordinary%2C+ecclesiastically+performed%3B+and+that+it+consists+not+only+in+conferring+gifts%2C+whereby+a+man+is+made+fit+for+the+ministery%2C+or+prophecy%2C+but+in+conferring+authority+and+conveying+ministerial+authority%3B+as+the+Protestants+prove+by+manifest+arguments+against+the+Socinians.+And+although+private+Christians+in+the+duty+of+charity%2C+and+by+reason+of+gifts+wherein+they+are+subservient+to+God%2C+do+convert+some+from+their+sins%3B+yet+it+follows+not+that+they+are+thus+sent%2C+as+that+they+have+authority+as+the+ambassadours+of+Christ+in+his+Name+to+preach+the+Word+of+God+authoritatively%3B+because+they+want+%5Black%5D+the+authoritative+mission+by+the+Church+of+Christ%2C+whereby+that+ministry+in+the+Church+is+conferred+wherein+men+as+the+ambassadors+of+Christ+preach+the+Word+of+reconciliation%2C+1+Tim.+4%3A14%3B+Tit.+1%3A5%2C+9-10%3B+2+Cor.+5%3A20.+Hence+also+our+Belgic+Reformed+Churches+acknowledge+that+preaching+of+the+Word+by+ministers+ecclesiastically+called%2C+is+the+ordinary+means+of+men%E2%80%99s+repentance+and+first+reconciliation+to+God%3A+as+appears+by+the+ecclesiastical+Form+of+establishing+pastors+in+the+ministry+of+the+Church+through+the+whole+Netherlands.%E2%80%9D%0A%0A%E2%80%94+Wilhelm+Apollonius%2C+A+Consideration+of+Certain+Controversies+at+this+Time+Agitated+in+the+Kingdom+of+England+concerning+the+Government+of+the+Church+of+God%2C+%28London%3A+G.M.%2C+1645%29%2C+ch.+5%2C+%E2%80%98Of+the+Ecclesiastical+Ministry%2C+and+the+Exercise+thereof%E2%80%99%2C+pp.+67-70&amp;url=https%3A%2F%2F5solasquotes.github.io%2Fquote%2F546a5fc60b.html&amp;via=5Solas" target="_blank" rel="noopener">Share on X</a><a class="perma" href="../quote/546a5fc60b.html">Permalink</a><a class="src" href="https://reformedbooksonline.com/topics/pastors#:~:text=We%20grant%20in%20this%20Question%3A%201,the%20Church%20through%20the%20whole%20Netherlands&amp;text=We%20grant%20in%20this%20Question%3A%201.%20That%20private&amp;text=ministry%20of%20the%20Church%20through%20the%20whole%20Netherlands" rel="noopener" target="_blank">Read it online · Reformed Books Online</a></div>

<blockquote><p>8. All prophets are either ordinary or extraordinary, as is clear in God’s Word; extraordinary now are not in the Church, and the ordinary prophets now are not gifted to preach the Word, except as Timothy, from their youth they have been trained up in the Scriptures and have learning, sciences, knowledge of the tongues, if he would be a man able to teach others, 2 Tim. 2:3; 1 Tim. 3, he must meditate, read, and give himself wholly to these things, 1 Tim. 3:15-16, and so must leave his calling contrary to the apostle his commandment, 1 Cor. 7:20-22; 1 Thess. 4:11; Eph. 4:28, but if he have a gift for public preaching, he is to separate himself for it, seeing a gift is a token of Gods separation.</p></blockquote>

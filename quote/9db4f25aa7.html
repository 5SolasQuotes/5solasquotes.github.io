<blockquote><p>Third, by virtue of having a rational nature, a human person is also in part of an incorporeal nature. In particular, the rational powers of forming concepts, putting them together into propositions, reasoning logically from one proposition to another, and willing actions on the basis of what these intellectual capacities present as ends worth pursuing, do not directly involve any bodily organs.</p></blockquote>

<div class="meta"><span class="t"><a href="../topics/free-will-and-inability/liberty-and-necessity.html">Liberty and Necessity</a></span></div>

</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-f235079b36" data-kw="">
<blockquote><p>IV… Joined to these [the soul’s faculties, such as intellect and will] is free will, or, as others prefer, liberum arbitrium, which is to be considered strictly and generically, arising from the interaction of both faculties and acting according to a natural inclination and from an intrinsic principle, which alone is free in an uncoerced manner. This freedom applies not only to man but also to beasts and some inanimate objects that act uncoercedly, though not in a state of moral freedom as man does, where actions are performed both directly and by command, with premeditated consultation, deliberation, judgment, and from the will, which gives it liberty.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/andreas-essenius.html">Andreas Essenius</a></span><span class="wk"><span class="lbl">Work:</span> <cite>‘Theological Disputation on the Image of God in Man’ Download</cite>, tr. Jonathan Tomes (Utrecht: Johannes Waesberg, 1653) Latin</span></figcaption>

</figure><figure class="quote" id="q-d5b8c9281a" data-kw="">
<blockquote><p>No creature can do those things that are above nature as principal agent; however, it can cause a motion by uncreated power as instrumental agent: for as there is an obediential potency in creation, so that whatever the Creator has disposed happens in it, thus also so that it happens by means of it, which is the definition of an instrument.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/thomas-aquinas.html">Thomas Aquinas</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Commentary on the Sentences</cite>, distinction 8, quest. 2, art. 3, Reply to obj. 4, bk. 4</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/free-will-and-inability/liberty-and-necessity.html">Liberty and Necessity</a></span></div>

</figure><figure class="quote" id="q-5c96b5d161" data-kw="">
<blockquote><p>…yet this necessity of sinning, incident to all that are brought forth into the world, in massa peccati et perditionis, in the mass of original sin and perdition, is not such either in their, or our opinion, as whereby they cannot but sin; although they would abstain from it; though this be obtruded upon us as it was upon Remigius: whereupon he pleads for himself, and such as were of his mind in the doctrine of predestination after this manner, p 53: Nemo it a sentit aut dicit quod Dei praedestinatio aliquem invitum faciat peccare, ut jam non propriae voluntatis perversitate sed Divinae praedestinationis necessitate peccare videatur. ‘No man’ (says he) ‘does so think or speak as if God’s predestination made a man to sin against his will, in such sort as he should seeme to sin, not through the perverseness of his own will, but by the necessity of divine predestination.’ So say we; neither is this impotency of doing good, anywhere else, but in the corruption of the will, it being a moral impotency according to that of Saint Augustine, Libertas sine gratia non est libertas sed contumacia; ‘Liberty without grace, is not liberty, but wilfullness,’ and Remigius, Histor: Gottescal, p. 29, Ex quibus (says he) speaking of reprobates: Nemo potest salvari, non propter violentiam aliquam Divinae potestatis, sed propter indomabilem et perseverantem nequitiam suae iniquitatis. ‘Not one of them can be saved, not because of any violence of divine power, but by reason of the untameable and persevering naughtiness of their own iniquity.’ and p. 144: De reprobis nullum salvari ullatenus existimavi, non quia non possunt homines de bono ad malum commutari et de malis ac pravis boni ac recti fieri, sed quia in meliùs mutare noluerunt, et in pessimis operibus usque ad fiaē perseverare voluerunt. ‘None of the reprobates do we judge to be saved, not because they could not be changed from evil to good, and of evil and depraved become good and right, but because they would not be changed into better and would to the end persevere in wicked works.’ So then they could be changed but would not: But in what respect is it said they could be changed? was it in respect of the freedom of their wills without grace? Nothing less; see his own words, p. 34: Si dixisset generaliter, nemo hominum sine Dei gratia libero bene uti potest arbitrio, esset catholicus: ‘Had he said generally that no man can rightly use his free will, without the grace of God, he had been a catholic.’ But all the question is about the manner how this grace does work (to wit) whether God gives men grace to believe and repent if they will, and leaves to them to perform the act of faith and repentance; or whether God works the very act of faith and repentance, not to dispute of this point out of God’s Word, which clearly teaches that God works in us the will and the deed, according to his good pleasure, Phil. 3:13. And that he makes us perfect to every good work, working in us that which is pleasing in his sight through Jesus Christ. (Heb. 13:21) Let us take notice of the discourse between Hincmarus and Remigius on this argument that till the love of God comes, man is dead, his will is dead to that which is good. Now love is only given to the believers, posse charitatem habere naturae est hominum, charitatem autem habere gratiae est fidelium. (Of the Predestination of the Saints, ch. 5) For thus writes Hincmarus, p. 3.113: Bonum quod agimus et Dei est et nostrum, Dei per praevenientem gratiam, nostrum per subsequentē liberam voluntatem. ‘The good that we do is both God’s work and ours; of God by grace preventing, ours by free will following.’ To this Remigius answers and first he says Hincmarus discourses after such a manner as if a good work were partly God’s work and partly ours; and again as if the beginning of a good work were God’s, but the effect thereof of man’s free will; although as he (Hincmarus) does endeavor to temper this speech of his, by the addition of grace, not by the fulness of it; gratiae adjunctione non etiam plenitudine, ‘by the adjunction of grace, not also by the fulness of it.’ So he should have done, says Remigius, cum vere totum sit Dei; seeing indeed the whole is God’s work; As the truth itself says, ‘Without Me ye can do nothing,’ and the apostle, ‘What hast thou that that thou hast not received?’ Whence the blessed and glorious martyr Cyprian has so defined it, saying we must glory in nothing, seeing nothing is ours, and concludes thus: Bonum itaque nostrum totum Dei est, quia totum est ex Deo; et nihil boni nostri, nostrum est, quia nihil boni nostri est ex nobis. ‘Therefore our good works are wholly God’s, and no good of ours is ours, because it is not of us.’ And to reconcile this seeming contradiction, in calling it our good, yet denying it to be from us, he concludes thus: omne bonum nostrum, et totum Dei est, donando; et totum nostrum est, accipiendo. ‘Every good thing of ours is wholy God’s in as much as He gives it, and it becomes ours full and whole, for as much as we receive it.&#x27;</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/william-twisse.html">William Twisse</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Riches of God’s Love unto the Vessels of Mercy, consistent with his absolute Hatred or Reprobation of the Vessels of Wrath</cite>, … (d. 1646; Oxford, 1653) | Book 2, An Examination of Certain Passages inserted into Mr. Hord’s Discourse, Answer to the Additions, pp. 14-15</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/free-will-and-inability/liberty-and-necessity.html">Liberty and Necessity</a></span></div>

ch of his, by the addition of grace, not by the fulness of it; gratiae adjunctione non etiam plenitudine, ‘by the adjunction of grace, not also by the fulness of it.’ So he should have done, says Remigius, cum vere totum sit Dei; seeing indeed the whole is God’s work; As the truth itself says, ‘Without Me ye can do nothing,’ and the apostle, ‘What hast thou that that thou hast not received?’ Whence the blessed and glorious martyr Cyprian has so defined it, saying we must glory in nothing, seeing nothing is ours, and concludes thus: Bonum itaque nostrum totum Dei est, quia totum est ex Deo; et nihil boni nostri, nostrum est, quia nihil boni nostri est ex nobis. ‘Therefore our good works are wholly God’s, and no good of ours is ours, because it is not of us.’ And to reconcile this seeming contradiction, in calling it our good, yet denying it to be from us, he concludes thus: omne bonum nostrum, et totum Dei est, donando; et totum nostrum est, accipiendo. ‘Every good thing of ours is wholy God’s in as much as He gives it, and it becomes ours full and whole, for as much as we receive it.&#x27;”

3A+De+reprobis+nullum+salvari+ullatenus+existimavi%2C+non+quia+non+possunt+homines+de+bono+ad+malum+commutari+et+de+malis+ac+pravis+boni+ac+recti+fieri%2C+sed+quia+in+meli%C3%B9s+mutare+noluerunt%2C+et+in+pessimis+operibus+usque+ad+fiae%CC%84+perseverare+voluerunt.+%E2%80%98None+of+the+reprobates+do+we+judge+to+be+saved%2C+not+because+they+could+not+be+changed+from+evil+to+good%2C+and+of+evil+and+depraved+become+good+and+right%2C+but+because+they+would+not+be+changed+into+better+and+would+to+the+end+persevere+in+wicked+works.%E2%80%99+So+then+they+could+be+changed+but+would+not%3A+But+in+what+respect+is+it+said+they+could+be+changed%3F+was+it+in+respect+of+the+freedom+of+their+wills+without+grace%3F+Nothing+less%3B+see+his+own+words%2C+p.+34%3A+Si+dixisset+generaliter%2C+nemo+hominum+sine+Dei+gratia+libero+bene+uti+potest+arbitrio%2C+esset+catholicus%3A+%E2%80%98Had+he+said+generally+that+no+man+can+rightly+use+his+free+will%2C+without+the+grace+of+God%2C+he+had+been+a+catholic.%E2%80%99+But+all+the+question+is+about+the+manner+how+this+grace+does+work+%28to+wit%29+whether+God+gives+men+grace+to+believe+and+repent+if+they+will%2C+and+leaves+to+them+to+perform+the+act+of+faith+and+repentance%3B+or+whether+God+works+the+very+act+of+faith+and+repentance%2C+not+to+dispute+of+this+point+out+of+God%E2%80%99s+Word%2C+which+clearly+teaches+that+God+works+in+us+the+will+and+the+deed%2C+according+to+his+good+pleasure%2C+Phil.+3%3A13.+And+that+he+makes+us+perfect+to+every+good+work%2C+working+in+us+that+which+is+pleasing+in+his+sight+through+Jesus+Christ.+%28Heb.+13%3A21%29+Let+us+take+notice+of+the+discourse+between+Hincmarus+and+Remigius+on+this+argument+that+till+the+love+of+God+comes%2C+man+is+dead%2C+his+will+is+dead+to+that+which+is+good.+Now+love+is+only+given+to+the+believers%2C+posse+charitatem+habere+naturae+est+hominum%2C+charitatem+autem+habere+gratiae+est+fidelium.+%28Of+the+Predestination+of+the+Saints%2C+ch.+5%29+For+thus+writes+Hincmarus%2C+p.+3.113%3A+Bonum+quod+agimus+et+Dei+est+et+nostrum%2C+Dei+per+praevenientem+gratiam%2C+nostrum+per+subsequente%CC%84+liberam+voluntatem.+%E2%80%98The+good+that+we+do+is+both+God%E2%80%99s+work+and+ours%3B+of+God+by+grace+preventing%2C+ours+by+free+will+following.%E2%80%99+To+this+Remigius+answers+and+first+he+says+Hincmarus+discourses+after+such+a+manner+as+if+a+good+work+were+partly+God%E2%80%99s+work+and+partly+ours%3B+and+again+as+if+the+beginning+of+a+good+work+were+God%E2%80%99s%2C+but+the+effect+thereof+of+man%E2%80%99s+free+will%3B+although+as+he+%28Hincmarus%29+does+endeavor+to+temper+this+speech+of+his%2C+by+the+addition+of+grace%2C+not+by+the+fulness+of+it%3B+gratiae+adjunctione+non+etiam+plenitudine%2C+%E2%80%98by+the+adjunction+of+grace%2C+not+also+by+the+fulness+of+it.%E2%80%99+So+he+should+have+done%2C+says+Remigius%2C+cum+vere+totum+sit+Dei%3B+seeing+indeed+the+whole+is+God%E2%80%99s+work%3B+As+the+truth+itself+says%2C+%E2%80%98Without+Me+ye+can+do+nothing%2C%E2%80%99+and+the+apostle%2C+%E2%80%98What+hast+thou+that+that+thou+hast+not+received%3F%E2%80%99+Whence+the+blessed+and+glorious+martyr+Cyprian+has+so+defined+it%2C+saying+we+must+glory+in+nothing%2C+seeing+nothing+is+ours%2C+and+concludes+thus%3A+Bonum+itaque+nostrum+totum+Dei+est%2C+quia+totum+est+ex+Deo%3B+et+nihil+boni+nostri%2C+nostrum+est%2C+quia+nihil+boni+nostri+est+ex+nobis.+%E2%80%98Therefore+our+good+works+are+wholly+God%E2%80%99s%2C+and+no+good+of+ours+is+ours%2C+because+it+is+not+of+us.%E2%80%99+And+to+reconcile+this+seeming+contradiction%2C+in+calling+it+our+good%2C+yet+denying+it+to+be+from+us%2C+he+concludes+thus%3A+omne+bonum+nostrum%2C+et+totum+Dei+est%2C+donando%3B+et+totum+nostrum+est%2C+accipiendo.+%E2%80%98Every+good+thing+of+ours+is+wholy+God%E2%80%99s+in+as+much+as+He+gives+it%2C+and+it+becomes+ours+full+and+whole%2C+for+as+much+as+we+receive+it.%27%E2%80%9D%0A%0A%E2%80%94+William+Twisse%2C+The+Riches+of+God%E2%80%99s+Love+unto+the+Vessels+of+Mercy%E2%80%A6+%28d.+1646%3B+Oxford%2C+1653%29+%7 <blockquote><p>203. He therefore that is so far disposed to any good act, and whose indisposition, or disposition to the contrary, is but such, as that in his present state, without any more help than he has, he can move his own will to the said act, and the difficulty is not so great but that such power sometime does overcome it, is said to have a moral power. But he that wants [lacks] not natural force or power, but only a right disposition of his will, and so far wants it, as that none in his case do ever change their own acts to good, without more help and power than he has, is said to be morally unable or impotent: and not only to want the habit. 204… Unbelievers want not that natural power or faculty, which can believe and repent if duly suscitated and disposed: But through an ill disposition and contrary course of action, and want of due excitation, that power will not act, without God’s special grace. Which ‘will not’ signifies: 1. the undisposedness, 2. the non-agency. And in strictest speech, the former is best expressed by, ‘The will is undisposed and averse to believe, etc.’ and the latter by ‘The will does not consent.’ But the first may be expressed by, ‘It cannot’ because it will not come to pass, though it is no such ‘cannot’ as is distinct from ‘will not,’ but the very same. And as ‘power’ is distinct fom ‘will’ and a man is said to be able to do that which ‘he can do if he will,’ so no doubt but he that will believe and repent, can do it, so far as he is willing. And this is it that [which] Augustine so much pleads for, when he would have us distinguish ‘cannot’ and ‘will not,’ and when he says that Posse credere est omnium; Credere autem fidelium. [To be able to believe is common to all; but actually to believe is the mark of the faithful.] …

213. A man may be able mediately to do that which he is not able immediately to do: I mean he that can write with a pen, or move things with an engine, and so act but as a partial, though principal cause, may not be able to write without a pen, nor to do the same alone as a total cause.

214. And a man may have power to do that mediately and hypothetically hereafter, which he cannot do immediately, that is, at the present time. He can learn to write, and after can write, who cannot write till he hath learned. Thus infants have a remote power of speaking, and infidels of believing.</p></blockquote>

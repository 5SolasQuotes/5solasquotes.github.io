<blockquote><p>In our days we see that because there hath been much crying out against holy days, some also will not stick to cry out against the Sabbath. Well, if a papist in all other general points of doctrine should be truly converted unto Christ, and for want of instruction doubteth of the Sabbath, we are in love to deal with him, and for a season to support his weakness. How be it we must remember that the weak must not always be born with, as appeareth by the Apostle’s words chap 15:2. Let every man please his neighbour in that, that is good to edification.

So long then as the error is of weakness, and that it is but an infirmity in the man, from which by the knowledge of the truth he would be rid and be delivered, he must be born with. But if it proceed of illusion, obstinacy, and of a prefract [sic] judgment as deceived by the devil, then he must not be borne with, no not even now a days: nay, if we be herein faulty, the error is not so tolerable in us, as it was in them, in that they wanted the old and New Testament, both which are so abundantly opened unto us. But if one truly repenting him of his sins, and faithfully believing in Christ, shall through ignorance be afraid of the Sabbath, as of a servile ceremony, he is so far to be borne with, as he desireth to come to the truth, and if he come once to be obstinate, he is no longer to be borne with.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/richard-greenham.html">Richard Greenham</a></span><span class="wk"><span class="lbl">Work:</span> <cite>A Treatise of the Sabbath in The Works of Richard Greenham – Volume Two</cite></span></figcaption>

</figure><figure class="quote" id="q-9b5478b31f" data-kw="">
<blockquote><p>The Puritan doctrine generally opposed the extreme strictness which some accorded the Sabbath. Some [extreme persons] argued that: (1) Ex. 16:23 prohibited all baking and cooking on the Sabbath; (2) Ex. 16:29 forbade all walking on the Sabbath; (3) Ex. 20:10 prohibited all work of any kind on the Sabbath [even acts of necessity]; (4) Ex. 31:14-15; 35:3; Num. 15:35 forbade all work, even the gathering of sticks for a fire, on the Sabbath. (Cf. George Walker, The Doctrine of the Holy Weekly Sabbath (1641) pp. 117-19) The puritan answer to this excessive strictness was to direct attention to the context of each Biblical reference… Ex. 20:10 was never intended to forbid works of necessity and charity, as Christ Himself makes clear when He shows that it was lawful to pull a beast out of a pit on the Sabbath (Lk. 14:5), to lead a beast to water on the Sabbath (Lk. 13:15) and to circumcise a man on the Sabbath (Jn. 7:22-23). (Ibid., p. 121) Ex. 35:3 forbade the kindling of a fire on the Sabbath, but the context makes it clear that fires in general were not prohibited; rather fires for work on the Tabernacle were forbidden. (Ibid., p. 121) Ex. 31:14-15 and Num. 15:35 make work on the Sabbath punishable by death; however, Walker argues that it is work done presumptuously (cf. Num. 15:30-31), i.e. by contemptuously despising the commandment of God, which incurs the death penalty. (Ibid. p. 122)</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/james-dennison.html">James Dennison</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Market Day of the Soul</cite>, 1532-1700 (RHB, 2008), pp. 133-34</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/worship/the-lords-day.html">The Lord&#x27;s Day</a></span></div>

<blockquote><p>Here I shall only give you this caution, Take heed of taking your notions of God from sense, or merely from reason:

1. Not from sense: Spiritual beings fall under no cognisance of the external senses. None ever saw God’s shape; none ever saw his similitude; and here let me caution you, against any pictures of God, or any Person in the Godhead. We are ready in our minds to form ideas in our minds of any beings according to the representations which pictures and images make of them. It is impossible but all pictures, images or external representations of the Divine Being must be teachers of lies. It is impossible that a limner [painter] should draw the true representation of a man whom he never saw. How is it possible he should draw any representation of an invisible God, a Being which he neither ever saw nor can see? The fairest pretence is for the picture of our Saviour, who assumed our nature and was a man in all things. But all those pictures must be teachers of lies too: For Christ was God-Man, and the representation of a man is no representation of the Person of the Mediator. Does any say that upon the same argument there should be no pictures drawn, for a picture does but represent our fleshly part, the soul cannot be expressed. I answer there yet are these differences:

1. The picture of our friend is the representation of a being that we know is or was informed with a reasonable soul, so as the other essential part of the man is on course understood; but it is not so as to Christ. Though the picture of an human shape has this advantage, that we may understand under it a reasonable soul, of which every man is possessed, yet we cannot under any such shape understand the Divine Nature personally united to the human nature.

2. Again even the picture of a man, if it has no similitude of the man, is but a teacher of a lie and does but help our thoughts with false notions and conceptions. And what limner ever saw the Lord in his human shape, to draw a representation of Him? What need any pictures of Christ when every man we see is as true a representation of Him as any limner can make who never saw Him in the flesh, nor a true copy to draw Him by. I am apt to believe that this was one reason of God’s so severe prohibition of images and the likeness of anything to represent God, because He knew that those things would be of this pernicious use, to give us false notions and ideas of God: for you shall observe when you have seen the pretended picture or resemblance of a man, you will fancy him according to that representation, whether the picture be anything like the person for whom it is made, yea or no.

3. To which I might add that admitting a picture of a man or a friend be not like the person and give our fancies a false notion of him, yet in this there is no sin, no defilement, no guilt upon the soul by it; but to conceive amiss of God is a thing quite of another nature and of further danger to the soul. This has made me sometimes wonder that Luther, though he abhorred images, and showed as great a detestation of them as any other, as they are used in Popery, as they are means or objects of adoration; yet allowed the use and standing of them in Churches. Certainly it is a thing of very dangerous consequence, whether in Churches or our own private houses; for we shall find a great proneness in us to form out notions of God according to such representations; and if those representations be lies and false, such will our notions be: and if this be not a fair way to fill the soul with atheistical and blasphemous thoughts concerning God and Christ, I do not know what is.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/john-collinges.html">John Collinges</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Defensative Armour against Four of Satan’s most fiery Darts, viz. Temptations to atheistical and blasphemous impressions and thoughts, self-murder, despair and presumption</cite>, … (London: Alsop, 1680), Blasphemous Thoughts, ch. 5, pp. 41-44</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/worship/idolatry-and-images.html">Idolatry and Images</a></span></div>

— John Collinges, Defensative Armour against Four of Satan’s most fiery Darts, viz. Temptations to atheistical and blasphemous impressions and thoughts, self-murder, despair and presumption, … (London: Alsop, 1680), Blasphemous Thoughts, ch. 5, pp. 41-44">Copy</button><a class="share" href="https://x.com/intent/post?text=%E2%80%9CHere+I+shall+only+give+you+this+caution%2C+Take+heed+of+taking+your+notions+of+God+from+sense%2C+or+merely+from+reason%3A+1.+Not+from+sense%3A+Spiritual+beings+fall+under+no+cognisance+of+the+external+senses.+None+ever+saw+God%E2%80%99s+shape%3B+none+ever+saw+his+similitude%3B+and+here+let+me+caution+you%2C+against+any+pictures+of+God%2C+or+any+Person+in+the+Godhead.+We+are+ready+in+our+minds+to+form+ideas+in+our+minds+of+any+beings+according+to+the+representations+which+pictures+and+images+make+of+them.+It+is+impossible+but+all+pictures%2C+images+or+external+representations+of+the+Divine+Being+must+be+teachers+of+lies.+It+is+impossible+that+a+limner+%5Bpainter%5D+should+draw+the+true+representation+of+a+man+whom+he+never+saw.+How+is+it+possible+he+should+draw+any+representation+of+an+invisible+God%2C+a+Being+which+he+neither+ever+saw+nor+can+see%3F+The+fairest+pretence+is+for+the+picture+of+our+Saviour%2C+who+assumed+our+nature+and+was+a+man+in+all+things.+But+all+those+pictures+must+be+teachers+of+lies+too%3A+For+Christ+was+God-Man%2C+and+the+representation+of+a+man+is+no+representation+of+the+Person+of+the+Mediator.+Does+any+say+that+upon+the+same+argument+there+should+be+no+pictures+drawn%2C+for+a+picture+does+but+represent+our+fleshly+part%2C+the+soul+cannot+be+expressed.+I+answer+there+yet+are+these+differences%3A+1.+The+picture+of+our+friend+is+the+representation+of+a+being+that+we+know+is+or+was+informed+with+a+reasonable+soul%2C+so+as+the+other+essential+part+of+the+man+is+on+course+understood%3B+but+it+is+not+so+as+to+Christ.+Though+the+picture+of+an+human+shape+has+this+advantage%2C+that+we+may+understand+under+it+a+reasonable+soul%2C+of+which+every+man+is+possessed%2C+yet+we+cannot+under+any+such+shape+understand+the+Divine+Nature+personally+united+to+the+human+nature.+2.+Again+even+the+picture+of+a+man%2C+if+it+has+no+similitude+of+the+man%2C+is+but+a+teacher+of+a+lie+and+does+but+help+our+thoughts+with+false+notions+and+conceptions.+And+what+limner+ever+saw+the+Lord+in+his+human+shape%2C+to+draw+a+representation+of+Him%3F+What+need+any+pictures+of+Christ+when+every+man+we+see+is+as+true+a+representation+of+Him+as+any+limner+can+make+who+never+saw+Him+in+the+flesh%2C+nor+a+true+copy+to+draw+Him+by.+I+am+apt+to+believe+that+this+was+one+reason+of+God%E2%80%99s+so+severe+prohibition+of+images+and+the+likeness+of+anything+to+represent+God%2C+because+He+knew+that+those+things+would+be+of+this+pernicious+use%2C+to+give+us+false+notions+and+ideas+of+God%3A+for+you+shall+observe+when+you+have+seen+the+pretended+picture+or+resemblance+of+a+man%2C+you+will+fancy+him+according+to+that+representation%2C+whether+the+picture+be+anything+like+the+person+for+whom+it+is+made%2C+yea+or+no.+3.+To+which+I+might+add+that+admitting+a+picture+of+a+man+or+a+friend+be+not+like+the+person+and+give+our+fancies+a+false+notion+of+him%2C+yet+in+this+there+is+no+sin%2C+no+defilement%2C+no+guilt+upon+the+soul+by+it%3B+but+to+conceive+amiss+of+God+is+a+thing+quite+of+another+nature+and+of+further+danger+to+the+soul.+This+has+made+me+sometimes+wonder+that+Luther%2C+though+he+abhorred+images%2C+and+showed+as+great+a+detestation+of+them+as+any+other%2C+as+they+are+used+in+Popery%2C+as+they+are+means+or+objects+of+adoration%3B+yet+allowed+the+use+and+standing+of+them+in+Churches.+Certainly+it+is+a+thing+of+very+dangerous+consequence%2C+whether+in+Churches+or+our+own+private+houses%3B+for+we+shall+find+a+great+proneness+in+us+to+form+out+notions+of+God+according+to+such+representations%3B+and+if+those+representations+be+lies+and+false%2C+such+will+our+notions+be%3A+and+if+this+be+not+a+fair+way+to+fill+the+soul+with+atheistical+and+blasphemous+thoughts+concerning+God+and+Christ%2C+I+do+not+know+what+is.%E2%80%9D%0A%0A%E2%80%94+John+Collinges%2C+Defensative+Armour+against+Four+of+Satan%E2%80%99s+most+fiery+Darts%2C+viz.+Temptations+to+atheistical+and+blasphemous+impressions+and+thoughts%2C+self-murder%2C+despair+and+presumption%2C+%E2%80%A6+%28London%3A+Alsop%2C+1680%29%2C+Blasphemous+Thoughts%2C+ch.+5%2C+pp.+41-44&amp;url=https%3A%2F%2F5solasquotes.github.io%2Fquote%2F9757f66d0a.html&amp;via=5Solas" target="_blank" rel="noopener">Share on X</a><a class="perma" href="../quote/9757f66d0a.html">Permalink</a><a class="src" href="https://reformedbooksonline.com/topics/topics-by-subject/worship/images-of-christ/#:~:text=Here%20I%20shall%20only%20give%20you,I%20do%20not%20know%20what%20is&amp;text=Here%20I%20shall%20only%20give%20you%20this%20caution&amp;text=and%20Christ%2C%20I%20do%20not%20know%20what%20is" rel="noopener" target="_blank">Read it online · Reformed Books Online</a></div>
</figure><figure class="quote" id="q-087cf1b950" data-kw="">
<blockquote><p>Words signify by general custom, and have the same sense out of the worship of God as in it; and therefore the arguing from their lawfulness as signs of worship unto the lawfulness of instituted signs seems liable to exception. Nevertheless it may be said that instituted signs soon become customary and as well understood as words… With acknowledgment of my own weakness, I express my apprehensions of this matter. God has allowed words for signs expressive of divine worship, but I find not that He has allowed words only and forbidden gestures and actions for such an end. The dumb [who can’t speak] must express their internal worship by gestures and actions or they cannot externally worship God at all. If signs of devotion that are of customary signification be lawful, I see not why such as are of instituted signification should be unlawful, and especially when they become as customary, as those that have been without institution.</p></blockquote>

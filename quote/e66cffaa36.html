<blockquote><p>Whether the distinction of sin into mortal and venial is able to be tolerated? This distinction is inept. Indeed, all sins merit eternal death; and if it may happen to be remitted, the sins of all the regenerate are of the sort that that is not from the nature of the sin, but out of the grace of God whereby we are embraced in Christ.</p></blockquote>

</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-b1c7ddf7ac" data-kw="">
<blockquote><p>XII. Sin is divided in multiple ways. One kind is the sin of angels, in the heavens; another is the sin of men, on earth. 1 John 3:8 “He who commits sin is of the devil, for the devil has sinned from the beginning.” Of human sin, some is the first or originating from the first: this is either original sin or actual sin. Actual sin is either of omission or commission: the former is against affirmative precepts, which we neglect; the latter is against negative precepts and prohibitions, which by sinning we contravene and oppose. Hence those sins are distinguished by the nature of the precepts, not as different species of sin, but as singular modes. In the one case we do not perform what we ought; in the other, we commit what we ought not. The former is noted in Matthew 25:42 “I was hungry and you gave me no food” and verse 27 “You ought to have invested my money with the bankers.” 1 Samuel 3:13 “He did not rebuke them” – namely Eli did not rebuke his sons. But his sons were committing unspeakable acts of debauchery, chapter 2 verses 22-23. Thus some sinned by omission, and others by commission. XIII. Omission is either of the whole act that ought to have been performed, or of the proper mode in the action: as when you either completely omit a duty like prayer or the like; or do not pray in the way that is fitting. We commit this kind of sin everywhere, even in our best works, in which we never fail to fall short in the required mode of acting, according to Luther’s well-known and very true saying: “The righteous person sins in every good work” – not in the material of the work itself, but in its form; not in reality, but in the mode of acting, the mind, and the end – in which respects we always fall short of the perfection which the law demands from every aspect. XIV. By reason of the subject, sin is distinguished such that some takes place in the soul, while other sin also involves the body: for what is sinned with the body involves the soul too, but not vice versa; for one can sin solely with the soul, without outwardly manifesting anything with the body. “Let us cleanse ourselves from every defilement of body and spirit.” 2 Corinthians 7:1. Bodily sin is perfected through words or deeds. Hence sin is customarily distinguished into that of the heart, the mouth, and the deed; or what is lusted for, said, or done against the law. Matthew 15:19 “For out of the heart come evil thoughts, murder, adultery, fornication, theft, false witness, slander.”</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/johannes-hoornbeeck.html">Johannes Hoornbeeck</a></span><span class="wk"><span class="lbl">Work:</span> <cite>‘A Practical Theological Disputation on Sin, pt. 2’ tr. Onku with AI (Leiden: Johann Elsevir, 1660)</cite>, sect. 12-14 Latin</span></figcaption>

</figure><figure class="quote" id="q-bd3247d398" data-kw="">
<blockquote><p>For in every little transgression of the divinely commanded law, God’s authority is set aside… [S]ince God has explained his will in the Law, every thing contrary to the Law is displeasing to Him. Will they feign that the wrath of God is so disarmed that the punishment of death will not forthwith follow upon it? He has declared … “The soul that sinneth it shall die,” (Ezek. 18:20). Again, in the passage lately quoted, “The wages of sin is death.”… [L]et the children of God remember that all sin is mortal, because it is rebellion against the will of God, and necessarily provokes his anger; and because it is a violation of the Law, against every violation of which, without exception, the judgment of God has been pronounced. The faults of the saints are indeed venial, not, however, in their own nature, but because, through the mercy of God, they obtain pardon.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/john-calvin.html">John Calvin</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Institutes, II.8.59</cite></span></figcaption>

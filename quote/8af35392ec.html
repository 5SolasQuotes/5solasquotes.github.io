<main class="wrap"><figure class="quote" id="q-8af35392ec" data-kw="">
<blockquote><p>And here, that we may not be drawn aside by the prevalence of vulgar error, it should be understood that ceremonies are not, therefore, unlawful, because they are significant. For the holy kiss, respecting which mention is made in Rom. 16:16, was a sign by which they wished to signify the fraternal love and union of all Christians. And even the learned Peter Martyr, is so far from rejecting ceremonies because they are significant, that he says, ‘they are the more laudable, if, in the way of sermons, they admonish us of some duty.’ (on 1 Cor. 11)</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/john-davenant.html">John Davenant</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Determinations</cite>, tr. Josiah Allport (1634; 1846), Determination 20, ‘The English Church is fully competent to bind to the observance of ceremonies’, p. 331 bound at the end of John Davenant, A Treatise on Justification, or the Disputatio de Justitia... trans. Josiah Allport (1631; London, 1846), vol. 2</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/worship/ceremonies-and-things-indifferent.html">Ceremonies and Things Indifferent</a></span></div>

</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-4c57a2c187" data-kw="">
<blockquote><p>I must by the way tell you that I find not sackcloth therein commanded as a solemn significant ceremony; I say commanded as a solemn ceremony, for that you find it not only mentioned as the ordinary concomitant of more grievous mournings, nay by the prophets even literally commanded, as also baldness, sitting in the dust, howling and wallowing in ashes, the better to express that serious mourning, whereunto the Lord did call, is plainly obvious, and can only infer that therefore and after this manner it is the more capable to be still contained.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/robert-macward.html">Robert MacWard</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The True Non-Conformist</cite>, … (1671), 3rd Dialogue, pp. 112</span></figcaption>

</figure><figure class="quote" id="q-86a9083348" data-kw="">
<blockquote><p>1. The root of the difference between the Old Nonconformists and the Conformists was that one sort thought they should stick to the mere Scripture rule and simplicity, and go far from all additions which were found invented or abused by the Papists, in doctrine, worship and government; and the other side thought that they should show more reverence to the customs of the ancient Church, and retain that which was not forbidden in the Scripture, which was introduced before the ripeness of the Papacy, or before the year 600 at least, and which was found lawful in the Roman Church, and common to them with the Greek, that we might not seem singular, odd and humorous, or to go further from the Papists than reason and necessity drave us. And the laity seemed nowhere so sensible of the difference as between the way of ceremony and unceremonious simplicity, and the way of our many short liturgic prayers and offices and the way of free-praying from the present sense and habits of the speaker; while pacificators thought both seasonably good.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/richard-baxter.html">Richard Baxter</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Nonconformists’ Plea for Peace</cite>, … (London, 1679), Section 7, ‘Some Matters of Fact Preparatory…’, p. 120</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/worship/ceremonies-and-things-indifferent.html">Ceremonies and Things Indifferent</a></span></div>

</figure><figure class="quote" id="q-7447cdd86e" data-kw="">
<blockquote><p>Arguments of Peter Martyr disputing with Mr. Chadsey upon the first question: The analogy and resemblance between the sacrament and the thing signified must ever be kept in all sacraments. In the sacrament of the Lord’s body, this analogy or resemblance cannot be kept, if bread be transubstantiated: Ergo [therefore], the substance of bread must needs remain in the sacrament of the Lord’s body. The major [premise] of this argument is certain by St. Austen [Augustine] (Book on Catechizing in the Rudiments; Epistle to Dardan), where he says: Sacraments must needs bear a similitude of those things whereof they are sacraments, or else they can be no sacraments.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/peter-martyr-vermigli.html">Peter Martyr Vermigli</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Other citations (work not named)</cite>, in John Foxe, Acts &amp; Monuments… (London, 1583), ‘The Ninth Book Containing the Acts &amp; Things Done in the Reign of King Edward VI’, ‘Arguments of Peter Martyr…’, p. 1374</span></figcaption>

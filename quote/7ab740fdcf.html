<main class="wrap"><figure class="quote" id="q-7ab740fdcf" data-kw="">
<blockquote><p>Those that the Father gives in election, Christ redeems, and by redemption saves; for redemption, in regard of efficacy, is no larger than God’s election. … But to them that believe not, they have another use. They have this benefit by Christ’s death, that there is mercy offered them, and some gifts of the Spirit. God offers and stirs up good motions in them, but they rebel against them. There be many degrees and means of faith. They use not all the means they ought, neither take all the degrees, therefore they are without all excuse, because He gives more grace, not only the means, but He is ready to give more grace than they are willing to entertain. So it is their rebellion, which is the cause of their damnation. They are said to resist the Holy Ghost, such reprobates in the church, to quench the Spirit (Acts 7:51), which implies the Holy Ghost is ready to work more in them than they are willing to entertain. Is it not so by experience? There is a company of profane persons, that, out of the abundance of their wicked hearts, and the poison of their breeding, will not vouchsafe to hear at all; others that do come, though for some bye and carnal ends. Happily the Holy Ghost, in hearing, beats upon their consciences and awakes them. But what say their rebellious hearts? Shall I stoop to leave such and such courses that are pleasurable and gainful? Hereupon they resist the work of the Holy Ghost in the ministry, when their hearts tell them there is a readiness in the Holy Ghost, and that He is sent from Christ and the Father to work more effectually in them than they are willing to be wrought upon, and therefore it is they are damned. Thy perdition is of thyself, O Israel! (Hos. 13:9). Their own consciences will tell them thus much. So it is no matter what cavils they raise of Christ’s intention and God’s election. Look thou, man, to thine own heart. Doth not thy own heart tell thee thou art a rebel, and livest in profane wicked courses, in neglect of holy duties? Thou carriest thine own sentence and cause of damnation in thy breast. I appeal to the worst, who live in sins against conscience. Here is the ground of thy damnation. There be many ascents and degrees to saving faith. Thou withstandest the beginnings and the motions of the Spirit. If they come in and work upon thy heart any estrangement from sin, thy proud heart begins to rebel, and will not yield. It is the only true obedience which lays itself at the foot of Christ, and is willing to be led and persuaded in anything so far as frailty will permit, and allows itself in no evil course. This is that which brings sound comfort, which they not doing, therefore are without all excuse. … Therefore men must look unto what God commands. If their conscience tell them that they yield not that obedience which they ought and might, but rather resist the motions of God’s Spirit, hereupon comes their damnation to be just. They are commanded to believe.</p></blockquote>

<blockquote><p>The manner of conversion is to us unsearchable, both because we are ignorant of the nature of the immortal soul, and because much more are we ignorant of the manner of God’s working upon that immortal spirit. As for the resistibility or irresistibility of grace, we know that the power of God is almighty, and cannot be resisted by any created strength, if He please to exercise it to the full, or in some high measure: But if God give power to the creature, or work by that created power given, it may be resisted by a contrary created power: And so grace or the power of conversion, as a created thing in man, may be so given as to be resisted by the will of man. And both the understanding of man, will and does, either deny or doubt of divine truths represented to the soul; and the will will wrangle, oppose and reject or not sincerely affect and submit unto the divine commands, and promises. And hence, the many conflicts not only in conversion, but after we are converted. As for necessitation of the will in this work of divine calling, it’s certain and granted of all that the illumination of the understanding may be necessary so far as the soul in respect of the same is only passive, though in the apprehension and judgement concerning the truths represented by the Word it be active. Besides, God may give an active power to the will, and it may be passive in receiving of it, and also necessitated to an act of complacency in general, so that it necessarily may approve by a general approbation of the justice and equity of the command, and the excellency of the good promised… Yet notwithstanding this necessary and natural act of complacency, that act of the will, which Buridan calls acceptatio ad prosecutionem may be, and is free. I pass by the philosophical speculations concerning the nature of the will, which few know, concerning the natural and necessary acts thereof, and also concerning those that are free; and what the natural liberty of the will is, and in what acts, and in respect of what acts, it is free. Concerning the positive acts velle and nolle, and the negative, non velle, non nolle, and concerning the liberty of contradiction and specification; It’s far more profitable for all such as are so blessed as to live in the Church and enjoy the means of conversion diligently to use the means and exercise that power which God has given them, and also earnestly and constantly pray for the regenerating Spirit, which God has promised to them that seek Him in an orderly way. For upon this done, regeneration will follow; and by the divine and spiritual power given them, together with God’s special assistance, and concurrence, after all necessary preparations, they shall freely determine and the will shall wholly and most willingly submit to God-Redeemer, which is the ultimate product of divine vocation, the parts whereof are the outward Word, and the inward power of the Spirit which go together, according to the promise of the Gospel, and make up the essence of it… And we cannot find in Scripture that God denies his Spirit to such as hear his Word till they give God cause either by their neglect or perversness, or apostasy from that degree of grace they have received to withdraw the same. By all this we understand that Christ finds his subjects, to whom God has given Him a right, to be enemies, and He enlarges as He begins his Kingdom by a kind of spiritual conquest, dashing in pieces all such as will not submit, and are bound to submit, with his iron rod and irresistible strength, reducing the rest unto subjection, after some time of standing out… And this publication of his laws is accompanied with a wonderful power of his Spirit whereby together with the Word of the Kingdom, He pierces the minds of men and breaks their stony hearts in sunder, as an hammer does a rock: In this respect the Lord says, ‘Is not my Word like as a fire, and like an hammer that breaks the rock asunder, Jer. 23:29.</p></blockquote>

<blockquote><p>When God ‘foreordains’ a sinner ‘to everlasting death,’ He decides to leave him in the sin which deserves everlasting death and results in it. The non-elect sinner has experienced the operation of common grace. It is an error to say that God shows no kind or degree of mercy to the non-elect. But he has resisted and defeated it. God decides to proceed no further with him by the bestowment of that special grace which regenerates, and ‘makes willing in the day of God’s power.’ The elect sinner has also experienced, resisted, and defeated common grace. God decides to proceed further with him, by effectual calling and regeneration.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/william-g-t-shedd.html">William G.T. Shedd</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Calvinism: Pure &amp; Mixed</cite>, (NY: 1893), ch. 3, pp. 19-20</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/effectual-calling/efficacious-grace.html">Efficacious Grace</a></span></div>

</figure><figure class="quote" id="q-fccad8979c" data-kw="word and Spirit means">
<blockquote><p>Thus the Spirit is indeed rightly said not to work without the word, but not by the word only, but immediately and distinctly from the word. The movement of efficacious grace is properly to be called neither physical nor ethical, but supernatural and divine.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/francis-turretin.html">Francis Turretin</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Institutes of Elenctic Theology</cite>, 15.4.17–18</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/effectual-calling/means-of-calling.html">Means of Calling</a> › <a href="../topics/effectual-calling/means-of-calling/the-word-and-the-spirit.html">The Word and the Spirit</a></span><span class="t"><a href="../topics/effectual-calling/means-of-calling.html">Means of Calling</a> › <a href="../topics/effectual-calling/means-of-calling/the-preaching-of-the-gospel.html">The preaching of the gospel</a></span><span class="t"><a href="../topics/regeneration/means.html">Means</a> › <a href="../topics/regeneration/means/the-word-and-the-spirit.html">The Word and the Spirit</a></span><span class="t"><a href="../topics/effectual-calling/efficacious-grace.html">Efficacious Grace</a> › <a href="../topics/effectual-calling/efficacious-grace/operation-of-the-spirit.html">Operation of the Spirit</a></span></div>
<div class="actions"><button class="copy" data-copy="“Thus the Spirit is indeed rightly said not to work without the word, but not by the word only, but immediately and distinctly from the word. The movement of efficacious grace is properly to be called neither physical nor ethical, but supernatural and divine.”

— Francis Turretin, Institutes of Elenctic Theology, 15.4.17–18">Copy</button><a class="share" href="https://x.com/intent/post?text=%E2%80%9CThus+the+Spirit+is+indeed+rightly+said+not+to+work+without+the+word%2C+but+not+by+the+word+only%2C+but+immediately+and+distinctly+from+the+word.+The+movement+of+efficacious+grace+is+properly+to+be+called+neither+physical+nor+ethical%2C+but+supernatural+and+divine.%E2%80%9D%0A%0A%E2%80%94+Francis+Turretin%2C+Institutes+of+Elenctic+Theology%2C+15.4.17%E2%80%9318&amp;url=https%3A%2F%2F5solasquotes.github.io%2Fquote%2Ffccad8979c.html&amp;via=5Solas" target="_blank" rel="noopener">Share on X</a><a class="perma" href="../quote/fccad8979c.html">Permalink</a><span class="src none">No free online copy linked</span></div>
</figure><figure class="quote" id="q-c34d11c77b" data-kw="">
<blockquote><p>c. Special grace is irresistible. This does not mean that it is a deterministic force which compels man to believe against his will, but that by changing the heart it makes man perfectly willing to accept Jesus Christ unto salvation and to yield obedience to the will of God. Common grace is resistible, and as a matter of fact is always more or less resisted. Paul shows in Rom. 1 and 2 that neither the Gentiles nor the Jews were living up to the light which they had. Says [W.G.T.] Shedd: “In common grace the call to believe and repent is invariably ineffectual, because man is averse to faith and repentance and in bondage to sin.” [Calvinism Pure &amp; Mixed, p. 99.] It is ineffectual unto salvation because it leaves the heart unchanged. d. Special grace works in a spiritual and re-creative way, renewing the whole nature of man, and thus making man able and willing to accept the offer of salvation in Jesus Christ, and to produce spiritual fruits. Common grace, to the contrary, operates only in a rational and moral way by making man in a general way receptive for the truth, by presenting motives to the will, and by appealing to the natural desires of man. This is equivalent to saying that special (saving) grace is immediate and supernatural, since it is wrought directly in the soul by the immediate energy of the Holy Spirit, while common grace is mediate, since it is the product of the mediate operation of the Holy Spirit through the truth of general or special revelation and by moral persuasion.</p></blockquote>

<blockquote><p>The wisdom of God is truly infinite. He seeth “the end from the beginning, and from ancient times the things that are not yet done.” — (Isa. xlvi. 10.) He unerringly adapts all agencies, whether material or mental, to their work, and overrules them to the accomplishment of his eternal purposes at the time and in the way he had foreseen and appointed.

Consequently the means which he employs for attaining any proposed end can never fail. His dispensations always fulfil their mission. His institutions unfailingly effect the precise purposes for which they were established; though we may not be able in all cases to discern what these purposes were, nor how they have been accomplished. Nay more: divine ordinances do not merely fulfil their special and primary objects, but, while realizing these, they are designed and calculated to promote many other beneficial ends.

The highest effort of human wisdom is to devise means which may, with certainty, accomplish some single purpose; and all experience testifies how seldom this measure of success is attained. But such are the inexhaustible resources of divine wisdom, that His appointed means. His institutions, never fail to confer almost countless blessings on those who reverently observe them; so that, amid this multiplicity of attendant blessings, it is often difficult to distinguish between those which were primarily, and those which were indirectly, designed to be bestowed.

Thus it is with the Sabbath. Tried by this test, it approves itself to be truly a divine ordinance. It has not only answered the special purposes of heavenly wisdom and love to man in its appointment; it has at the same time been attended with so many other beneficent results, that one often feels at a loss to determine which of these are the special blessings its divine Founder intended it primarily to confer, and which are the supplementary ones that follow in their train.

How numerous, varied, and precious are the objects which the Sabbath, from the day of its institution, was designed to accomplish! Under the PATRIARCHAL dispensation it was a mute but eloquent witness for the existence of God, his unity, his creative power, his sovereignty over his creatures, and their responsibility to him. Under the MOSAIC economy, the Sabbath bore continued testimony not only to these truths, but also to the providential and moral government of God in its preservation and re-enactment, and his supreme light to the homage and worship of his people; it bore testimony to his beneficent regard for their temporal and eternal welfare; it taught them to look, through its hallowed use, for blessings on themselves and their nation; and it indicated a future period which would be pregnant with richer blessings and ennobled with a purer worship.

Under the Christian dispensation, while all these fundamental truths are still emphatically inculcated by the Sabbath, it has moreover become a memorial of redeeming love — a witness for the completion of that “better covenant” which was ratified by the resurrection of its Surety — a remembrance of Him “who died for our sins, and rose again for our justification” — an attestation to the deity of Him who had “power to lay down his life, and power to take it again” on this day — and a manifestation of His kingly prerogatives when he proclaimed himself to be the “Lord of the Sabbath.”

It has become a source of still more precious blessings to the people of God, refreshing, edifying, sanctifying them; a season for meditating on past sin and present infirmity, and for rejoicing in a finished salvation and a purchased inheritance. And it still continues to be a type of that heavenly “Sabbath that remaineth to the people of God,” and one of the most efficient means of preparing them for its enjoyment.

These are some of the primary and special ends which the Lord of the Sabbath had in view when he instituted it, and which it has never failed to answer. But, true to its divine origin, a long train of attendant blessings, corporeal and mental, intellectual and moral, personal and domestic, social and national, temporal and eternal, flow from its sanctified observance.</p></blockquote>

</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-17adf57d39" data-kw="">
<blockquote><p>And so much the rather should the Lord’s Sabbath be dear unto us, because the goodness and mercy of God appears no where more, than in giving us his Sabbaths; calling upon us thereby to rest from the world unto him (and God knows, a Christian soul finds no rest any where but in him) and to walk with him in holy meditation, as he is pleased to walk in the midst of us, as the Holy One of Israel: so to draw us away from worldly cares and pleasures, to the entertaining of heavenly and holy cares, to enrich our selves with the knowledge of God, and to recreate our souls in the Lord, as he solaceth himself in us, according to that, He took his solace in the compass of the earth, and his delight was in the children of men. On the Lord’s day it is, that in special sort we Christians take hold of that holy Communion, which God in great mercy in his Son Jesus Christ vouchsafeth unto us with himself, speaking unto us as from heaven in his holy Word, and giving us liberty to speak unto him.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/william-twisse.html">William Twisse</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Of the morality of the fourth commandment, as still in force to bind Christians. Delivered by way of answer to the translator of Doctor Prideaux his lecture, concerning the doctrine of the Sabbath</cite>, (London, 1641), the preface.</span></figcaption>

</figure><figure class="quote" id="q-56d954c30d" data-kw="">
<blockquote><p>Heaven-work and heart-work are the chiefest parts of Christian duty. Christ often gives us his summaries of the Law and inculcates his great Command; Jn. 13:35; Mt. 22:37-39; Lk. 10:27. And so does the apostle, Rom. 13:10; 1 Pet. 1:22; 1 Jn. 3:11, 14, 23 &amp; 4:7, 11-12, 20; 2 Jn. 5. And the fruits of the Spirit are manifest, Gal. 5:22-23. James says that pure religion and undefiled before God, even the Father, is this, to visit the fatherless and widows in adversity and to keep ourselves unspotted of the world, James 1:27. Paul says, 1 Tim. 1:5, ‘The end of the commandment is charity out of a pure heart, and of a good conscience and of faith unfeigned:’ And then adds, ‘From which some having swerved, have turned aside to vain janglings’— In a word: The effectual belief of pardon and eternal glory given through Christ, and the love of God and man, with the denial of ourselves, and fleshly desires, and contempt of all things in the world, which are competitors with God and our salvation, with a humble patient enduring of all which must be suffered for these ends, is the nature and sum of the Christian religion. Do nothing therefore as a duty which is a hinderance to any of this. Contentious preachings and factious sidings which weaken love are not of God. The servant of the Lord must not strive, but be gentle to all men, 2 Tim. 2:24… It is one of the most important things in the world for the resolving of a thousand cases of conscience and the directing of a Christian life to know which duties are the greater and which are the lesser, and so which is to be preferred in competition; For that which is a duty at another time is a sin when it is done instead of a greater! as Christ has resolved in the case of the Sabbath. If good must be loved as good, then the greatest good must be most loved and sought. Sacrifice instead of mercy is a sin: Our gift must be left at the altar while we go to be reconciled to our brother. Mt. 5. Never hearken to those men who would set up their controverted duties or any positives and lesser things against the duties of nature itself or the great substantial parts of godliness.</p></blockquote>

— Richard Baxter, The Cure of Church Divisions, … (London, 1670), pt. 1, Direction 39, ‘Know which are the great duties of a Christian life, and wherein the nature of true Religion does consist; and then pretend not any lesser duty against those greater, though the least when it is indeed a duty, is not to be denied or neglected’, pp. 209-10">Copy</button><a class="share" href="https://x.com/intent/post?text=%E2%80%9CHeaven-work+and+heart-work+are+the+chiefest+parts+of+Christian+duty.+Christ+often+gives+us+his+summaries+of+the+Law+and+inculcates+his+great+Command%3B+Jn.+13%3A35%3B+Mt.+22%3A37-39%3B+Lk.+10%3A27.+And+so+does+the+apostle%2C+Rom.+13%3A10%3B+1+Pet.+1%3A22%3B+1+Jn.+3%3A11%2C+14%2C+23+%26+4%3A7%2C+11-12%2C+20%3B+2+Jn.+5.+And+the+fruits+of+the+Spirit+are+manifest%2C+Gal.+5%3A22-23.+James+says+that+pure+religion+and+undefiled+before+God%2C+even+the+Father%2C+is+this%2C+to+visit+the+fatherless+and+widows+in+adversity+and+to+keep+ourselves+unspotted+of+the+world%2C+James+1%3A27.+Paul+says%2C+1+Tim.+1%3A5%2C+%E2%80%98The+end+of+the+commandment+is+charity+out+of+a+pure+heart%2C+and+of+a+good+conscience+and+of+faith+unfeigned%3A%E2%80%99+And+then+adds%2C+%E2%80%98From+which+some+having+swerved%2C+have+turned+aside+to+vain+janglings%E2%80%99%E2%80%94+In+a+word%3A+The+effectual+belief+of+pardon+and+eternal+glory+given+through+Christ%2C+and+the+love+of+God+and+man%2C+with+the+denial+of+ourselves%2C+and+fleshly+desires%2C+and+contempt+of+all+things+in+the+world%2C+which+are+competitors+with+God+and+our+salvation%2C+with+a+humble+patient+enduring+of+all+which+must+be+suffered+for+these+ends%2C+is+the+nature+and+sum+of+the+Christian+religion.+Do+nothing+therefore+as+a+duty+which+is+a+hinderance+to+any+of+this.+Contentious+preachings+and+factious+sidings+which+weaken+love+are+not+of+God.+The+servant+of+the+Lord+must+not+strive%2C+but+be+gentle+to+all+men%2C+2+Tim.+2%3A24%E2%80%A6+It+is+one+of+the+most+important+things+in+the+world+for+the+resolving+of+a+thousand+cases+of+conscience+and+the+directing+of+a+Christian+life+to+know+which+duties+are+the+greater+and+which+are+the+lesser%2C+and+so+which+is+to+be+preferred+in+competition%3B+For+that+which+is+a+duty+at+another+time+is+a+sin+when+it+is+done+instead+of+a+greater%21+as+Christ+has+resolved+in+the+case+of+the+Sabbath.+If+good+must+be+loved+as+good%2C+then+the+greatest+good+must+be+most+loved+and+sought.+Sacrifice+instead+of+mercy+is+a+sin%3A+Our+gift+must+be+left+at+the+altar+while+we+go+to+be+reconciled+to+our+brother.+Mt.+5.+Never+hearken+to+those+men+who+would+set+up+their+controverted+duties+or+any+positives+and+lesser+things+against+the+duties+of+nature+itself+or+the+great+substantial+parts+of+godliness.%E2%80%9D%0A%0A%E2%80%94+Richard+Baxter%2C+The+Cure+of+Church+Divisions%2C+%E2%80%A6+%28London%2C+1670%29%2C+pt.+1%2C+Direction+39%2C+%E2%80%98Know+which+are+the+great+duties+of+a+Christian+life%2C+and+wherein+the+nature+of+true+Religion+does+consist%3B+and+then+pretend+not+any+lesser+duty+against+those+greater%2C+though+the+least+when+it+is+indeed+a+duty%2C+is+not+to+be+denied+or+neglected%E2%80%99%2C+pp.+209-10&amp;url=https%3A%2F%2F5solasquotes.github.io%2Fquote%2F56d954c30d.html&amp;via=5Solas" target="_blank" rel="noopener">Share on X</a><a class="perma" href="../quote/56d954c30d.html">Permalink</a><a class="src" href="https://reformedbooksonline.com/topics/ethics#:~:text=Heaven%2Dwork%20and%20heart%2Dwork%20are%20the%20chiefest,the%20great%20substantial%20parts%20of%20godliness&amp;text=Heaven%2Dwork%20and%20heart%2Dwork%20are%20the%20chiefest%20parts%20of&amp;text=itself%20or%20the%20great%20substantial%20parts%20of%20godliness" rel="noopener" target="_blank">Read it online · Reformed Books Online</a></div>

<blockquote><p>XII. Indeed in the I Tim. 4. 10. God is called σωτηρ, the Saviour of all men. But the Apostle there speaketh of the preservation in this present life, and of the providence of God, which is extended to the preservation of all men: which care, David, Psal. 36 doth extend even to the beasts, for there God is called the preserver of men and beasts. The precedent words of the Apostle doth declare this: We hope in the living God; for he speaketh of God, as he doth give life to things created by him. A like place you have, Acts. 17.25.</p></blockquote>

<blockquote><p>§6. There is another sort of unity much regarded among the ancients, which though the breach of it had as bad influence on all or most Churches, and so on the catholic Church, yet it properly respected neighbour Churches, either, which were united by the bond of one government, a provincial, or lesser synod, being made up of them: or only living in the vicinity of one another, or having frequent occasion of correspondence; they who were not under any uniting bonds, but these commune to all the parts of the catholic Church, yet had an unity of kind correspondence, mutual assistance, as occasion offered; acquainting one another with their affairs, so far as it was of any advantage: admitting the members of other Churches to communion with them, on occasion, refusing communion with such members of other Churches as were by them excommunicated. And this unity was then broken when these acts of friendship were shunned or refused, especially when they who were cast out by one were received to another: or when occasional communion was either shunned by them who so joined in another Church, or denied to such sojourners if they desired it: or, when one Church showed rage, fury and bitterness against another because of what they differed about [though it was non-fundamental].</p></blockquote>

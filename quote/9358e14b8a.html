<blockquote><p>On the 30 April 1845, the Edinburgh Presbytery of the Reformed Presbyterian Church of Scotland (Covenanter) passed a number of resolutions against chattel slavery and fellowship with slaveholding churches. The eighth resolution contains the following condemnation of the practice of racial segregation in the churches of America:

8. That while this Court express these views in reference to American slavery and the duties of the Churches, they cannot refrain from expressing their sympathy, not only with the oppressed slaves, but with the people of colour generally in that land, who, under the influence of cruel prejudices and unjust laws, are subjected to all manner of hardships and indignities in the whole intercourse of life.

Nor can this Court refrain from condemning the conduct of many of the churches in the United States, in reference to this matter, inasmuch as they sanction and strengthen these cruel prejudices and unjust laws, by preventing persons of colour, recognised as members of the church, from sitting in the same pews, and from taking their seats at the Lord’s table in company with their white brethren; thus in their public assemblies having respect to persons committing sin, and being convinced of the law as transgressors; and it is the conviction of this Court, that churches acting in this cruel and sinful manner, render themselves unworthy of fellowship with Christians and Christian churches, who desire to adhere consistently to the laws of Christ, the alone King and Head of his Church, with whom there is neither Greek nor Jew, circumcision nor uncircumcision, barbarian, Scythian, bond nor free; but himself all, and in all.

Joseph Wilson, Moderator.

Wm. Anderson, Clerk.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/edinburgh-reformed-presbytery.html">Edinburgh Reformed Presbytery</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Deliverance of the Reformed Presbytery of Edinburgh on American slavery and church-fellowship with slave-holders (Edinburgh, 1845), p. 4.</cite></span></figcaption>
<div class="meta"><span class="t"><a href="../topics/the-church.html">The Church</a></span></div>

<blockquote><p>I am reflected upon, and that several times to my face, by all divided parties, especially Dissenters, and particularly by these of them commonly called M’Millanites, but quite wrong designed, who should be called Hamiltonians after Robert Hamilton [was 39-40 years old], who was the only man (as I shall afterwards instruct) that led them in these untroden, dangerous paths of positive disowning of the State, and separation from the Church, and [from] all others that dare not nor will not go their lengths in principles and practices, proclaiming the same to the world; but it is straight before me, and I firmly resolve, if the Lord will, to give a more distinct account of the rise, steps, and unheard-of heights of all the right-hand extremes that have been in Scotland these 49 years, past and present; and set them up as beacons to the following ages, to beware of splitting upon such dangerous rocks. … But it is plain that these formed, divided parties of Dissenters are so puffed up with a frothy conceit of themselves and their actings, that they speak and write with, as if religion, zeal and faithfulness, wit and sense, would live and die with them; and none [other are held] to know anything of the times, nor what Israel ought to do, disdaining, disesteeming, disregarding, rash and harsh constructing of all who differ from, or oppose, them or their way of managing of a testimony; the very reverse of a gospel spirit. And I am sadly confirmed, by the many, long, melancholly debates these 48 years, of the truth of this spiritual pride rampant amongst them.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/patrick-walker.html">Patrick Walker</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Six Saints of the Covenant in 2 vols</cite>, ed. David H. Fleming (London: Hodder &amp; Stoughton, 1901), vol. 1, Alexander Peden’s Life, Postscript, pp. 138-40</span></figcaption>

</figure><figure class="quote" id="q-208206c415" data-kw="">
<blockquote><p>News of the ordination of Cameron [by Robert M’Ward and John Brown of Wamphray in the Netherlands in late-July or early-August 1679] and [Thomas] Hog was swiftly carried back to Scotland, where it caused a predictable outburst of indignation amon the older nonconforming ministers. John Carstairs, one of the most senior among them, wrote bitterly to M’Ward on 20 August: ‘I somewhat wonder you have there ordained those two young men–not so very acceptable, to say no more, to the Church of Scotland. I fear it offends many; nor do I see, especially at this time, how it can be so well justified. Do you think that there is no ministerial church amongst the nonconforming ministers in Scotland to ordain whom they think fit to be ordained? And is it suitable to that Christian correspondence and deference that the churches of Christ ought to have with and to one another that a few ministers of the church in Holland should ordain ministers for the Church of Scotland without their desire, consent , allowance or knowledge?’ Carstairs’ view was certainly typical of many of the older and more influential of the ministers, and his letter clearly reflected their resentment at what they saw as a usurpation of their ministerial functions by M’Ward and Brown. It also gave an indication of the sort of reception Cameron could expect on his return to Scotland [in late-1679]. A further hint of the welcome that awaited him was given in a letter from John Dickson to M’Ward on 16 July: ‘As for Mr Cameron, the prejudice against him is screwed up so high that no vindication will allay the feverish spirits of some persons who are maddened against him.&#x27;</p></blockquote>

<blockquote><p>In this world the church, which is sometimes called the kingdom of God in Scripture, contains both godly and ungodly, good and bad, all mixed up together. Satan sows his weeds in the happy cornfields of the Lord, and both good and bad fish are got in the net of the gospel.

But on the last day, when Christ comes in judgment, there will be a separation when the godly will be called to inherit heavenly and eternal life and the ungodly will be consigned to eternal hellfire along with Satan, whom they serve.

No one should be deceived by the fact that for the time being God puts up with many things in the visible church that he does not accept as his will. In a great house there are many vessels, among which some are designed for ignoble use. God puts up with them for the sake of his elect, so that they may be revealed and so that the whole church will not be destroyed by a sudden ejection of the ungodly. But there will come a time when they will be thrown out without any problem.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/rudolf-gwalther.html">Rudolf Gwalther</a></span><span class="wk"><span class="lbl">Work:</span> <cite>In Divi Pauli Apostoli Epistolam ad Galatas Homiliae LXI</cite>, (Zurich, 1576). Quoted in Gerald L. Bray, Timothy F. George, Scott M. Manetsch (eds), Reformation Commentary on Scripture X: Galatians, Ephesians (Downers Grove IL: IVP Academic, 2011), p. 197.</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/the-church/nature-of-the-church.html">Nature of the Church</a></span></div>
<div class="actions"><button class="copy" data-copy="“In this world the church, which is sometimes called the kingdom of God in Scripture, contains both godly and ungodly, good and bad, all mixed up together. Satan sows his weeds in the happy cornfields of the Lord, and both good and bad fish are got in the net of the gospel.

But on the last day, when Christ comes in judgment, there will be a separation when the godly will be called to inherit heavenly and eternal life and the ungodly will be consigned to eternal hellfire along with Satan, whom they serve.

No one should be deceived by the fact that for the time being God puts up with many things in the visible church that he does not accept as his will. In a great house there are many vessels, among which some are designed for ignoble use. God puts up with them for the sake of his elect, so that they may be revealed and so that the whole church will not be destroyed by a sudden ejection of the ungodly. But there will come a time when they will be thrown out without any problem.”

— Rudolf Gwalther, In Divi Pauli Apostoli Epistolam ad Galatas Homiliae LXI, (Zurich, 1576). Quoted in Gerald L. Bray, Timothy F. George, Scott M. Manetsch (eds), Reformation Commentary on Scripture X: Galatians, Ephesians (Downers Grove IL: IVP Academic, 2011), p. 197.">Copy</button><a class="share" href="https://x.com/intent/post?text=%E2%80%9CIn+this+world+the+church%2C+which+is+sometimes+called+the+kingdom+of+God+in+Scripture%2C+contains+both+godly+and+ungodly%2C+good+and+bad%2C+all+mixed+up+together.+Satan+sows+his+weeds+in+the+happy+cornfields+of+the+Lord%2C+and+both+good+and+bad+fish+are+got+in+the+net+of+the+gospel.%0A%0ABut+on+the+last+day%2C+when+Christ+comes+in+judgment%2C+there+will+be+a+separation+when+the+godly+will+be+called+to+inherit+heavenly+and+eternal+life+and+the+ungodly+will+be+consigned+to+eternal+hellfire+along+with+Satan%2C+whom+they+serve.%0A%0ANo+one+should+be+deceived+by+the+fact+that+for+the+time+being+God+puts+up+with+many+things+in+the+visible+church+that+he+does+not+accept+as+his+will.+In+a+great+house+there+are+many+vessels%2C+among+which+some+are+designed+for+ignoble+use.+God+puts+up+with+them+for+the+sake+of+his+elect%2C+so+that+they+may+be+revealed+and+so+that+the+whole+church+will+not+be+destroyed+by+a+sudden+ejection+of+the+ungodly.+But+there+will+come+a+time+when+they+will+be+thrown+out+without+any+problem.%E2%80%9D%0A%0A%E2%80%94+Rudolf+Gwalther%2C+In+Divi+Pauli+Apostoli+Epistolam+ad+Galatas+Homiliae+LXI%2C+%28Zurich%2C+1576%29.+Quoted+in+Gerald+L.+Bray%2C+Timothy+F.+George%2C+Scott+M.+Manetsch+%28eds%29%2C+Reformation+Commentary+on+Scripture+X%3A+Galatians%2C+Ephesians+%28Downers+Grove+IL%3A+IVP+Academic%2C+2011%29%2C+p.+197.&amp;url=https%3A%2F%2F5solasquotes.github.io%2Fquote%2Fdecc2e47d3.html&amp;via=5Solas" target="_blank" rel="noopener">Share on X</a><a class="perma" href="../quote/decc2e47d3.html">Permalink</a><a class="src" href="https://reformedcovenanter.wordpress.com/2021/03/26/rudolf-gwalther-on-the-mixed-condition-of-the-visible-church/" rel="noopener" target="_blank">Read it online · Reformed Covenanter</a></div>

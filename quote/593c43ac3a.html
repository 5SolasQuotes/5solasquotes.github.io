<main class="wrap"><figure class="quote" id="q-593c43ac3a" data-kw="">
<blockquote><p>All those absolutely, and only those with whom God makes this covenant, are intended. Those whose sins are not pardoned do in no sense partake of this covenant; it is not made with them. For this is the covenant that God makes with them, that he will be merciful unto their sins; that is, unto them in the pardon of them. […] for they are all actually pardoned with whom this covenant is made. And the indefinite declaration of the nature and terms of the covenant, is not the making of a covenant with any.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/john-owen.html">John Owen</a></span><span class="wk"><span class="lbl">Work:</span> <cite>An Exposition of the Epistle to the Hebrews</cite>, 8:12; Works, vol. 22, p. 206</span></figcaption>

</figure><figure class="quote" id="q-711e7bc10b" data-kw="">
<blockquote><p>The proposition is universal, as to the modification of the subject, “all;” but in the word “of them,” it is restrained unto those alone with whom this covenant is made. […] But whereas it is the internal, effectual grace of the covenant, and not only the means, but the infallible event thereon, —not only that they shall be all taught to know, but that they shall all actually know the Lord, — all individuals are intended; that is, that whole church all whose children are to be taught of God, and so to learn as to come unto him by saving faith in Christ.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/john-owen.html">John Owen</a></span><span class="wk"><span class="lbl">Work:</span> <cite>An Exposition of the Epistle to the Hebrews</cite>, 8:11; Works, vol. 22, p. 202</span></figcaption>

</figure><figure class="quote" id="q-feec0879c4" data-kw="">
<blockquote><p>If the things themselves are promised in the covenant, then all those with whom this covenant is made must be really and effectually made partakers of them. But this is not so; they are not all actually sanctified, pardoned, and saved, which are the things here promised.&#x27; Ans. The making of this covenant may be considered two ways: 1. As unto the preparation and proposition of its terms and conditions. 2. As unto the internal stipulation between God and the souls of men. In this sense alone God is properly said to make this covenant with any. The preparation and proposition of laws are not the making of the covenant. And therefore all with whom this covenant is made are effectually sanctified, justified, and saved.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/john-owen.html">John Owen</a></span><span class="wk"><span class="lbl">Work:</span> <cite>An Exposition of the Epistle to the Hebrews</cite>, 8:10; Works, vol. 22, p. 179</span></figcaption>

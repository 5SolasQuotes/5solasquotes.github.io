<main class="wrap"><figure class="quote" id="q-0cfa6f347b" data-kw="">
<blockquote><p>2. What they affirm, that brothels are to be tolerated lest married women should be violated, is contrary to the Divine command, Deut. xxiii. 17, There shall be no whore of the daughters of Israel, &amp;c. It is contrary to Apostolic doctrine; which would have matrimony, not fornication, to be the remedy for lust. It is contrary to the received opinion of Theologians, who deny that a compensation of sins is to be admitted: Harlots, therefore, are not to be prostituted lest married women should be violated. Lastly, it is contrary to the duty of the Christian magistrate; who is bound, as much as in him lies, to take care that all may live piously, soberly, and righteously: Rom. xiii. He ought not, therefore, to suffer those who openly profess whoredom.

3. With respect to the remark of Augustine, Take away harlots from human society and you will disturb all things by lust; we answer, it is not of much weight: because he wrote those books De ordine, when he was a young man, and not then baptized, as is evident from the first of his Retractations. We also oppose to it the more serious of the Fathers. Lactantius, Instit. lib. 6, cap. 23, says, The devil set up brothels, and published the shame of unhappy women. Clemens, Paedag. 3. cap. 3, Brothels are trophies of public intemperance. Tertullian, de cultu faeminar. calls harlots the most unhappy victims of public lusts. But now how disgraceful to the Christian magistrate, if he defend the inventions of the devil, if he suffer that victims be publicly immolated to lust, if, in short, he do not demolish the trophies of intemperance. Besides, I say, that however diligently the magistrate may endeavour to repress fornication, yet he can never wholly remove from human society harlots or fornicators, no more than he can remove thieves or murderers. Therefore the Papists may dismiss this fear.

Lastly we must also add; that this remedy (the toleration of brothels) is worse than even the disease which is dreaded. For although adultery be in itself worse than fornication; yet it is worse for a whole city to be continually polluted by brothels, than if it should sometimes happen that certain wedded women be violated. But even this is by no means to be conceded; that the honour and chastity of married women can be better preserved by the permission of fornication than by the severe punishment of it. For by impunity, and the continued habit of sinning we become more daring; and if we have served an apprenticeship to lust among harlots, becoming anon veterans, we the more confidently assault wedded females.

This point acquires support from the fact, that we scarcely ever have either read or heard of married women having been defiled by any other than by those who were before accustomed to practices with harlots: so admirably does the toleration of brothels conduce to the protection of the chastity of married women! — And these remarks may suffice against those who either deny that fornication is to be accounted a sin, or say that it is to be tolerated for the sake of avoiding adultery. We have dwelt the longer in opposing fornication, because it has obtained its patrons.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/john-davenant.html">John Davenant</a></span><span class="wk"><span class="lbl">Work:</span> <cite>An Exposition of the Epistle of St. Paul to the Colossians</cite>, trans. Josiah Allport (1627; 2 vols, London: Hamilton, Adams, and Co., 1832), 2: 45-46.</span></figcaption>

ess.com/2019/06/07/john-davenant-on-the-duty-of-suppressing-brothels/" rel="noopener" target="_blank">Read it online · Reformed Covenanter</a></div>
</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-9341b243da" data-kw="">
<blockquote><p>Now it remains to address the Magistrate, whom I judge can be described as a person chosen and instituted by God to defend the divine laws in matters of external discipline, by inflicting bodily punishment upon transgressors and by supporting and encouraging the good. The divine plan selects many people who do not act as magistrates. The ministers of the Church are one example. They still defend God’s word and laws, but not only in matters of external instruction. It is the duty of ministers to reach into the depths and motions of souls by way of the divine word. The Holy Spirit acts here as well, joining His strength with that of orthodox preaching and of the sacraments distributed by the Church.

The magistrate works alone in edifying and punishing transgressors. The minister binds the guilty and the incorrigible in the name of God, and excludes them from the kingdom of Heaven unless they correct their ways. The magistrate inflicts external punishment, working through the use of the sword. Both ministers and magistrates act to nurture the pious, but in different ways. The magistrate increases them in works, honours and merits. The minister consoles them through the promises of God and the sacraments.

The magistrate assures that the laws are kept most carefully, the guilty are punished, and the good are both helped and nurtured. The law acts as a mute magistrate, while the magistrate represents the moving and speaking law. Certainly he is also a minister of God since, as Paul said, magistrates sing the praises of those who live justly [Romans 13:3]. The magistrate wields the sword against the wicked, acting as the avenger and champion of God, and looks to nothing else but the salvation of men.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/peter-martyr-vermigli.html">Peter Martyr Vermigli</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Of a magistrate, and the difference between civil and ecclesiastical power (1561) in W. J. T. Kirby (ed.), The Zürich Connection and Tudor Political Theology</cite></span></figcaption>

<blockquote><p>Question 8: May a guilty person plead not guilty, or deny the fact? Answer: Common use is the interpreter of words: If the common use of those words does make their public sense a lie, it may not be done. But if the forensic [legal] common use of the denial is taken to signify no more but this, ‘Let him that accuses me, prove it’ [then]: I am not bound to accuse my self, or, in foro [in court] I am not guilty till it be proved, then it is lawful to plead ‘not-guilty’ and deny the fact, except in cases wherein you are bound to an open confession, or in which the scandal will do more hurt than the denial will do good.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/richard-baxter.html">Richard Baxter</a></span><span class="wk"><span class="lbl">Work:</span> <cite>A Christian Directory, or a Sum of Practical Theology</cite>, … (London, 1673), pt 4, ch. 22, ‘Cases &amp; Directions Against Injurious Law-Suits, Witnessing &amp; Judgment’, p. 149</span></figcaption>

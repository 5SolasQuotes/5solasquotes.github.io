<main class="wrap"><figure class="quote" id="q-1181f8ced7" data-kw="">
<blockquote><p>It is the duly of government to provide for the moral training and culture of the community, especially of the young, by encouraging education, endowing schools and colleges, watching over their interests with parental solicitude, and taking care that the young shall be educated so as to make them good men and useful citizens. To attain this the reading of the scriptures must be made a prominent part of ordinary school education. To refuse the scriptures a place in common schools is directly to encourage and strengthen the growth of infidelity. Education can never be safely separated from Christian principle. For this reason a national provision for religion should embrace a provision for national education. The latter is an important part of the former. There is an inconsistency on the part of some who while they are friendly to a public provision for schools, are opposed to a public provision for the support of religion. The objection made against the latter may with equal propriety be made against the former, unless schools are so conducted as to have no reference to the Christian religion; and then it might be doubted whether they would he ultimately any advantage to a community.

The immediate end of civil government is the good of society; but this is most perfectly attained where the glory of God is kept in view as the ultimate end. The welfare of society can never be secured irrespective of this. The attainment of the ends of civil government require that provision should be made for Christian instruction and education. Immorality and crime will thus be most surely prevented, and to prevent is incomparably better than to punish crime. The prevalence of vice, and the general corruption of society necessarily and universally accompany mental debasement and religious ignorance. If it were the design of a government to encourage vice and ruin the happiness of a community, the object could not be gained more effectually than by discountenancing religious education and the regular ministration of divine truth from sabbath to sabbath. Let the places of Christian worship be shut, and the schools closed where the scriptures are read, and the race of infidels reared in such a state of things, would soon demonstrate the folly and wickedness of the policy pursued. Society would soon become a pandemonium. And as a national policy may tend to lessen the means of Christian instruction and education, the same ruinous effects will in part follow. The French revolution and the horrid scenes of blood which followed it, show that it is unwise and dangerous to separate religious principle from national policy. Such a course is as dangerous to the safety and stability of a government, as it is destructive of national happiness.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/david-scott.html">David Scott</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Distinctive principles of the Reformed Presbyterian Church</cite>, (Albany, 1841), pp 289-90.</span></figcaption>

</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-f2d5d7b1c4" data-kw="">
<blockquote><p>All the question is concerning the imperated [commanded] acts and these external, that is not touching opinions and acts of the mind, but that which is visible and audible in these opinions, to wit, the speaking, professed holding of them, publishing, teaching, printing, and known external persuading of others to be of our mind. So that the question will come to this, whether the Magistrate’s sword be to regulate our words that concerns our neighbor, as that we lie not, we forswear not, to the hurt of the life and credit of our neighbor, that we slander not, rail upon no man, far less against the prince and ruler of the people, but whether the words we utter or publish of God though never such blasphemies, and lies, because they come from the conscience (as is truths or words we speak for or against our neighbor did not flow from a conscience either good or ill) be above or beyond all swords or coercive power of men. It is clear the question must be thus stated, for all the laws of the Old Testament (which we hold in their moral equity to be perpetual) that are touching blasphemies, heresies, solicitation to worship false gods and the breach of which the godly magistrate was to punish, command or forbid only such things as may be proved by two or three witnesses, and which husband and wife are not to conceal, and from which all Israel must abstain for fear of the like punishment, Dt. 13:8-11; 17:5-6; Lev. 20:1-5. But opinions in the mind, acts of the understanding, can never be proved by witnesses and such as neither Magistrate nor Church can censure.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/samuel-rutherford.html">Samuel Rutherford</a></span><span class="wk"><span class="lbl">Work:</span> <cite>A Free Disputation Against Pretended Liberty of Conscience</cite>, (1649), ch. 4, pp. 46-47</span></figcaption>

<blockquote><p>But those [leading presbyterian and congregationalist ministers] that were called [to the Savoy Conference] by the king, and one another, 1660 and 1661, to treat of concord, and that assembled at Sion College, and elsewhere about it, did openly make known their minds: And I think they meddled not against any of these things following, by any accusation of them as sinful: … XI. They spake not against episcopacy, as it is a presidency among and over presbyters differing in degree, and not in office, called ‘order’, and that in a Church of the lowest species. …

XIII. They said nothing against metropolitans, patriarchs, lay-chancellors, commissaries, officials, surrogates, archdeacons, etc. as officers of the king, appointed to do nothing (besides the sacred ministry if they be clergymen) but what belongs to magistracy [according to circa sara].

XIV. They said nothing against any promise of obedience to them only in the capacities and in the exercise of the power forementioned.

XV. Much less did they ever oppose or question swearing to the king, according to the oaths of Allegiance and Supremacy: And I with diverse others also being (for some ends) entered as his chaplains in ordinary, took also that Oath of Fidelity which the king’s household servants take. XVI. We never were for any dishonoring of kings by public excommunications, much less by subjects or foreigners, whom kings never choose to be their pastors; but only in case of necessity, for such a denial of sacramental communion to them, as Bishop Andrewes in Tortura Torti and Bishop Bilson [The True Difference between Christian Subjection &amp; Unchristian Rebellion, pt. 3, pp. 376-77] plead for, which is but to forbear ourselves a sinful act. XVII. We never pleaded for any elders’ (or chancellors’) power of the keys, who are but laymen. XVIII. We never held that magistrates are bound to add their force by the sword to the censures of the Church as such, and to punish men more because the Church has by excommunication cast them out, or because they are not reconciled. XIX. We never thought that things indifferent do become unlawful to us because the magistrate commands them.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/richard-baxter.html">Richard Baxter</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The English Nonconformity as under King Charles II &amp; King James II Truly Stated &amp; Argued</cite>, (1683; London: Parkhurst, 1689) The preface is dated 1683., ch. 3, pp. 11-13</span></figcaption>

<blockquote><p>The second duty is obedience, to be performed by all persons, and in all things possible (the contrary whereof God commands not), though hard and unequal… and this obedience must be to all governors, to the king as superior, and to the rest appointed by him, and to these, whether Christian or heathen, good or bad, merciful or cruel, for there is no power but of God (Rom. 13:1). The third is piety, that subjects pray for their governors, yea though they were infidels, or wicked: Thus did Daniel, thus did the ancient Christians for the heathen emperors, for their long life and safety… … Use 2. Hence it appears that the Pope with his limbs are the great rebels of the world; for not only pulling their necks as ecclesiastical persons from the yoke of the emperor and their sons’ reigns, but especially for seeking to overrule, depose and destroy the kings and kingdoms of the earth. Use 3. Learn they duty. Thy calling is to be subject… Pay all subsidies, tares, customs, etc…. and surely, if we must willingly pay to a heathen, much more to a Christian, religious, merciful, and renowned king.</p></blockquote>

<main class="wrap"><figure class="quote" id="q-214740dbc7" data-kw="">
<blockquote><p>…we must conclude that the florilegium of the Council of 815 does not advance beyond the iconoclastic theology of the earlier period… its authors made no original contributions, and merely re-used materials or repeated arguments current among the iconoclasts of 754. The most that can be said is that the iconoclasts of 815 added 12 (or 28) patristic references to the florilegium of 754, none of which, however, can be regarded as constituting an innovation or substantial addition to the iconoclastic armory.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/milton-v-anastos.html">Milton V. Anastos</a></span><span class="wk"><span class="lbl">Work:</span> <cite>‘The Ethical Theory of Images Formulated by the Iconoclasts in 754 &amp; 815’ in Dumbarton Oaks Papers</cite>, vol. 8 (1954), pp. 153-60, p. 159</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/worship/idolatry-and-images.html">Idolatry and Images</a></span></div>

<blockquote><p>…when I consider the proper end for which churches are erected, it appears to me more unbecoming their sacredness than I well can tell, to admit any other images than those living symbols which the Lord has consecrated by His own word: I mean Baptism and the Lord’s Supper, with the other ceremonies. By these our eyes ought to be more steadily fixed, and more vividly impressed, than to require the aid of any images which the wit of man may devise. Such, then, is the incomparable blessing of images—a blessing, the want [lack] of which, if we believe the Papists, cannot possibly be compensated!</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/john-calvin.html">John Calvin</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Institutes of the Christian Religion</cite>, 1.11.13</span></figcaption>

</figure><figure class="quote" id="q-09ade8ee7b" data-kw="">
<blockquote><p>The Reformed, however openly they embrace the fact that it is lawul to have a concept of God, and even more, that it is most necessary–unless we want to be atheists!–nevertheless say that a concept of God under the form of a man, or of any corporeal entity at all, is altogether unlawful, because: (1) the Savior in John 4:24 commands us to have a concept of God that agrees with the nature of God, that defines God as a Spirit, and that therefore leads to the result that God is worshipped and adored in spirit, that is, spiritually, without any such forms, and in truth, meaning in thoughts that are true and that agree with the concept… Balduin [a Lutheran] objects: (1) that since whenever we have a concept of God, and we therefore conceive a certain image of God… I respond, Balduin presupposes that having a concept and conceiving an image are synonymous, when in fact they are worlds apart. For under what likeness or image will you conceive of a spirit as it exists in itself?</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/petrus-van-mastricht.html">Petrus van Mastricht</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Theoretical Practical Theology</cite>, trans. Rester &amp; Spangler (RHB, 2019), vol. 2, bk. 2, ch. 6, ‘The Spirituality &amp; Simplicity of God’ | section 12, ‘Is it permitted, while praying, to put God before us under the form of a man? [No]’, pp. 137-38</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/worship/idolatry-and-images.html">Idolatry and Images</a></span></div>

<blockquote><p>1st Conclusion. Monuments or instruments of idolatry are of two sorts, either: [1.] Such things as have no other use at all but to contribute sorne subservient influence in or unto idolatrous worship, and because these have all their warrant from a mere commandment of man, they are simply not necessary, as the graven image, the idols themselves, all positive observances in God’s worship destitute of any command of God; and the use of these in any case must be scandalous and so unlawful because… [2.] But there be other things that are instruments of idolatry and subservient thereunto, in a common and physical influence, as a temple builded to the honor of a saint and for the adoring of images, and for the reading and opening the Word of God in the New and Old Testament, though in a corrupt way; these are not properly monuments of idolatry. Now the house or Church, as such is no monument, nor useless instrument in worship, such as is a surplice, a human holy day, for it has, as such, being a thing of walls and timber, no other than that very same physical influence in worshipping either the true God or a saint, that it has in civil use, in our ordinary dwelling, to wit, to fence our bodies in religious, in natural, in civil actions from injuries of heaven, clouds, and sin. The adjuncts of the Church, as crucifixes, images, altars, ravels, mass-clothes and the like, are properly monuments and instruments of idolaty, because these are not necessary, as is the material house, nor have they any common and physical influence in the worship, as the temple has, yea all the necessity or influence that they have in the worship is only religious and human flowing from the will of men, without either necessity from our natural constitution of body, or any word of Scripture, and therefore they are to be removed upon this ground, because they are unnecessary snares to idolatry… …An house for the worship of God is amongst the things that are necessary by way of disjunction in specie, not in individuo; that is, a house is necessary, in its physical use, to fence off our bodies, the injuries of sun, air and heaven, but not this house, for another house may serve the turn as conveniently.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/rutherford-s-conclusion.html">Rutherford’s Conclusion</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Divine Right of Church Government</cite>, … (1646), Appendix, ‘An Introduction to Scandal’, Question 6, ‘A Further Consideration of Things Not Necessary &amp; How They be Scandalous Objects’, pp. 62-3</span></figcaption>

</figure><figure class="quote" id="q-3cf2afc866" data-kw="">
<blockquote><p>We have never disapproved of pictures or sculptures; they are of great use in representing histories as well as in civil affairs, especially in describing and depicting plants. So we do not disapprove those arts, but recommend them and affirm that they should be exercised as useful to the Republic.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/theodore-beza.html">Theodore Beza</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Lutheranism vs. Calvinism: The Classic Debate at the Colloquy of Montbeliard 1586</cite>, (Concordia Publishing House, 2017), ch. 4, pp. 468-69</span></figcaption>

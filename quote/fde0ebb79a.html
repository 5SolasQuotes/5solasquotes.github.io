<main class="wrap"><figure class="quote" id="q-fde0ebb79a" data-kw="">
<blockquote><p>Under the name of ‘worship’ are comprehended generally his whole service, and whatsoever He commands for the glorifying of his name, both public exercises of hearing the Word preached, partaking of the sacraments, etc. and private meditation of his Word and works, etc.</p></blockquote>

</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-1160723795" data-kw="">
<blockquote><p>Some worship God with their good meaning, some with their good dealing, some with the babbling of a few words, as namely, of the Apostles Creed, and Ten Commandments for prayers. This service of God is very common, but alas, it is poor service. For the rule of divine honor is not the will of him that honors, but the will of Him which is honored. Secondly, here we learn to detest the service and worship which is performed to God in the Church of Rome. For it contains many parts and points of will-worship, having no warrant from God, either by commandment or promise. . . . For these and many other practices, let them bring forth the Word of God, if they can. They plead for many things, that they have the word of traditions. I answer, that traditions ecclesiastical are no word of God, but the word of man. And traditions which are called apostolical, are either of no moment, or doubtful. For how shall we know certainly, that they were the traditions of the apostles, considering none has said so, but some of the Fathers, whose testimonies are not sufficient, because they are subject to error?</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/william-perkins.html">William Perkins</a></span><span class="wk"><span class="lbl">Work:</span> <cite>‘A Warning Against the Idolatry of the Last Times, &amp; an Instruction touching Religious or Divine Worship’ in The Works</cite>, (1626), vol. 1, p. 699.</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/worship/nature-of-worship.html">Nature of Worship</a></span></div>

</figure><figure class="quote" id="q-9bc4e2cbaa" data-kw="">
<blockquote><p>10. The true and the lawful inward service of God is especially contained in the First Commandment, which is nothing else but the worshipping of the true God according unto the prescript of his Law.

11. The end of the First Commandement… He enjoins Himself to be worshipped and adored of us in the true practice of godliness.

12. Furthermore, although that the duties which we owe unto God be innumerable, yet they may be not unproperly referred unto four heads: The first is the inward acknowledging, whereunto is joined as an addition, the spiritual obedience of the conscience: the second is an assured trust: the thrid is, invocation, or prayer. The fourth and last, is thanksgiving.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/theodore-beza.html">Theodore Beza</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Propositions &amp; Principles of Divinity Propounded and Disputed in the University of Geneva, by certain Students of Divinity there, under Mr. Theodore Beza and Mr. Anthony Faius</cite>, (London: 1591), ch. 29, pp. 67-68</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/worship/nature-of-worship.html">Nature of Worship</a></span></div>

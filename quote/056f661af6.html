</figure><figure class="quote" id="q-dab48019cf" data-kw="">
<blockquote><p>…while he [the opponent] says: ‘That all Scots-men were generally of one Communion, and that the presbyterians (except the Cameronians) had returned to the Episcopal Church, and were become hearers, and many communicaters with her: That there was no separate meetings kept, at least publicly, but very rarely.’ This, I say, is most false: For though never any of the presbyterians would, directly nor undirectly, own episcopal government, yet many of the more sober and intelligent among them did not think it unlawful to hear them occasionally, who had complied with episcopacy; yet they chose rather to hear their own lawful pastors, though driven into corners, than these unfaithful men: And not only so, but there were many thousands, beside Cameronians, who would never hear them: And that many (who when they had occasion to hear others, made use of that opportunity) did go to hear these men, when their liberty of hearing others was taken away, it is no wonder. Yet this practice was far less general than he says, and meetings of nonconformists were not so rare (for all the horrid persecution that they were under) as he would make us believe: Many, who were no Cameronians, kept up their meetings, though I confess it was no wonder that their meetings were not public [after about 1680], when they were by such barbarous persecutions driven into corners… §2. Another falshood is, that the party which was then treated severely, was only the Cameronians: Whereas, though they had their share of the persecution, yet other presbyterians were most cruelly dealt with; and it was observed, that, indeed, the spite of his [episcopal / royalist] party appeared most against the most sober of the presbyterians, as being the persons most capable to do them hurt. …It is also most false and calumnibus, ‘that all presbyterians in Scotland were of one principle, only the Cameronians were more ingenuous’: For the sober presbyterians did always condemn many, both principles and practices, of that party. Such as that magistrates and ministers fall, ipso facto, from their authority, respective, and stations, when they are guilty of mis-managements, and that private persons may treat them as such, without a ••••enee [decree?] of State or Church. That the rest of the presbyterians condemned the Cameronians for keeping up their meetings, is also an untruth, for they also kept up meetings; but they condemned them for the manner of their meeting, with such contempt of, and bidding defiance to the authority of the magistrate.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/gilbert-rule.html">Gilbert Rule</a></span><span class="wk"><span class="lbl">Work:</span> <cite>A Vindication of the Church of Scotland, being an Answer to Five Pamphlets</cite>, … (Edinburgh: Parkhurst, 1691) Rule (c. 1629 – 1701) was a divine right, resisting presbyterian who was a leader in the post-1690 Church of Scotland. | Answer to 2nd Letter, pp. 14-16</span></figcaption>

 rel="noopener" target="_blank">Read it online · Reformed Books Online</a></div>
</figure><figure class="quote" id="q-bcc51754c5" data-kw="">
<blockquote><p>It is evident that there may be union and communion with a Church where there are several corruptions neither confessed nor reformed. As for example, there may be difference of judgment about many things, and doctrinal determinations of disputable points exacted by synods, contrary to our sentiments; and yet there may be forbearance with protestations, if we be not constrained to subscribe or homologate the same. In worship there may be many defects and disorders. In discipline and government there may be many dissatisfactions with Church officers, unjust censures, unfit ordinations, erroneous decisions, wrong constitutions of judicatories, dissatisfactions with persons that have the main stroke in the administrations, occasioning jealousies and fears of misgovernment for the time to come, and the like.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/john-currie.html">John Currie</a></span><span class="wk"><span class="lbl">Work:</span> <cite>An Essay on Separation: or a Vindication of the Church of Scotland contra the Seceders</cite></span></figcaption>

</figure><figure class="quote" id="q-fe9e827b1c" data-kw="">
<blockquote><p>The short [of your inquiring letter] whereof is: The receiving without public repentance of those which come from the Churches of England [to separate assemblies in England]: where because in the outward profession, that the laws of the land do justify the dumb [non-preaching] ministry, there appear unto you no lawful assemblies of the Church of Christ; your fear is, lest in uniting yourselves with such [by allowing them into the good graces of the separate assemblies], you should be unequally yoked [with them], and made fellow members of some other than of that whereof Christ Jesus is the Head. First therefore, if it be showed that the ordinary assemblies of those that profess the Gospel in England be the Churches of Christ, it seems that the way will be paved and planed for mutual intercourse between us…</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/thomas-cartwright.html">Thomas Cartwright</a></span><span class="wk"><span class="lbl">Work:</span> <cite>‘A Letter of T. C. To Richard Harrison Concerning Separation’ 15</cite>, pp. (1584) in The Judgment of Mr. Cartwright &amp; Mr. Baxter Concerning Separation &amp; the Ceremonies (1673)</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/the-church/schism-and-separation.html">Schism and Separation</a></span></div>

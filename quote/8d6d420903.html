<main class="wrap"><figure class="quote" id="q-8d6d420903" data-kw="">
<blockquote><p>In worship, their paintings, crossings, crucifixes, bowings, cringings, altars, tapers, wafers, organs, anthems, litany, rails, images, copes, vestments,—what were they but Roman varnish, an Italian dress for our devotion, to draw on conformity with that enemy of the Lord Jesus? In doctrine, the divinity of Episcopacy, auricular confession, free-will, predestination on faith, yea, works foreseen, “limbus patrum,” justification by works, falling from grace, authority of a church, which none knew what it was, canonical obedience, holiness of churches, and the like innumerable,—what were they but helps to Sancta Clara, to make all our articles of religion speak good Roman Catholic? How did their old father of Rome refresh his spirit, to see such chariots as those provided to bring England again unto him! This closing with Popery was the sting in the errors of those days, which cause pining, if not death, in the episcopal pot.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/john-owen.html">John Owen</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Sermon I: A Vision of unchangeable, free mercy, in sending the means of grace to undeserving sinners, in The Works of John Owen</cite>, (Carlisle: The Banner of Truth Trust, repr. 2009), 8:28.</span></figcaption>

<blockquote><p>§45. 5. And for organs or other instruments of music in God’s worship, they being a help partly natural and partly artificial, to the exhilarating of the spirits for the praise of God, I know no argument to prove them simply unlawful, but what would prove a cup of wine unlawful, or the tune and meter, and melody of singing unlawful. But yet if any would abuse it, by turning God’s worship into carnal pomp, and levity, especially by such non-intelligible singing, or bleating as some of our choristers used, the common people would have very great reason to be weary of it as accidentally evil.</p></blockquote>

<blockquote><p>II. A Voluntate Dei, ‘from the will of God’. This is the other reason: ‘For the Father seeks such to worship Him.’ [Jn. 4:23] God requires such worship and worshippers. The foundation of this reason is this: The rule of worship is not mans fancy, but God’s will: Men’s fancies and wills are infinitely various, and therefore those that have gone that way, have been divided into a thousand varieties; they worship they know not what, as v. 22. Only God’s will is the stable rule: None knows the mind of God but the Spirit of God: Now this is the worship God requires in Gospel times. Argument Second: From the end [design] of worship. Look what the ends of worship are, such must the worship be: And that was the reason why the Jewish worship was so much typical, because the end of it was to represent Christ; And that end being now attained, and Christ exhibited [revealed], we must consider what were and are the further ends of worship. Now the ends are of two sorts. 1. In reference to God. 2. In reference to men. And both will show us that the worship must be spiritual. I. In relation to God; so it is double: 1. To please God: this is finis operis &amp; operantis too [‘the end of the work, and of working’], (if a man be sincere) Ps. 19:14, ‘Let the words of my mouth and the meditation of my heart be acceptable in thy sight.’ Now it is only spiritual worship that can please God: That man does but little consider the nature of God, that thinks God is pleased with the bowing of the knee to an altar, no, it is the bending of the heart that God respects. It is not an organ in a church, but the organ of a gracious heart, and melody in the heart that pleases God. 2. To exalt God amongst men, to render Him glorious in the eyes of the world: Now how is that done? Do you think that it makes God glorious, when men seek to honor Him with bodily and external services? No, you cannot dishonor God more than by giving Him such a worship as begets a carnal representation of God, etc. And when God would set Himself forth in his glory, He represents Himself in a spiritual manner, and He takes them off from all corporeal thoughts and fancies: ‘God is a Spirit.’ ‘To whom will you liken Me?’ ‘You saw no shape.’ ‘God dwells not in temples made with hands.’ II. In reference to men; so the ends of worship are purely spiritual: such as these (for I can but name them) the elevation of the soul to God, and its assimilation to Him, the union of man with his Creator, the supply of the soul’s spiritual necessities, and the conduct of a sinner to glory, and all these are spiritual works, and to be done by spiritual helps, and therefore evangelical worship must be spiritual worship.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/matthew-poole.html">Matthew Poole</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Evangelical Worship is Spiritual Worship as it was Discussed in a Sermon</cite>, (1660), pp. 13-14 Poole was an English puritan.</span></figcaption>

<blockquote><p>XVII. We introduce singing as part of divine worship in accordance with Holy Scripture as doctrine and encouragement (1 Cor. 14:26):12 teaching and exhorting one another with psalms, hymns, and spiritual songs (Eph. 5:19); Col 3:16). But let them be sung in a language that is understood, for by the testimony of the apostle those that teach and sing in the assembly without being understood act foolishly and do harm, [as] they that bawl in an unknown language in the presence of idiots and barbarians. The Apostles’ Creed, prayers, or angelic songs and antiphons can be sung in devout fashion. The musical instruments, however, adopted for the pantomime (saltatrici) Mass of Antichrist,2 together with images, we abhor. There is no use for them in the church, and indeed they are marks and occasions of idolatry.</p></blockquote>

<div class="meta"><span class="t"><a href="../topics/worship/musical-instruments-in-worship.html">Musical Instruments in Worship</a></span></div>
<div class="actions"><button class="copy" data-copy="“XVII. We introduce singing as part of divine worship in accordance with Holy Scripture as doctrine and encouragement (1 Cor. 14:26):12 teaching and exhorting one another with psalms, hymns, and spiritual songs (Eph. 5:19); Col 3:16). But let them be sung in a language that is understood, for by the testimony of the apostle those that teach and sing in the assembly without being understood act foolishly and do harm, [as] they that bawl in an unknown language in the presence of idiots and barbarians. The Apostles’ Creed, prayers, or angelic songs and antiphons can be sung in devout fashion. The musical instruments, however, adopted for the pantomime (saltatrici) Mass of Antichrist,2 together with images, we abhor. There is no use for them in the church, and indeed they are marks and occasions of idolatry.”

<main class="wrap"><figure class="quote" id="q-7e2eae3479" data-kw="">
<blockquote><p>Nor is it sufficient to say, in the third place, that the relation is that of suretyship and substitution. This undoubtedly is a great step in advance. Only let the ground thus taken up be secured. Let the inquiry be pressed to the uttermost; let it be exhausted.

All truly scientific investigation searches on and on, till it arrives at somewhat of which no further explanation can be given or is required. Theology as a science meets this canon, and then claims a right to rest. Let us then still inquire.

Christ undertakes the work of Calvary, the death of the cross, for His people, because He stands towards them in the relation of a surety — a surety on their behalf to the offended Lawgiver and Judge. Be it so: but what shall justify His occupying that relation? What renders it fit, proper, righteous, that He should be accepted as standing in that relation towards them, and in that relation suffering for them? To this also it is not difficult to reply. He is their surety, because He is their substitute. He acts on their behalf, because He stands in their room. One only question now remains; and there can be no possibility, as there should be no inducement, to evade it. The relation of a substitute justifies the suretyship; what shall justify the substitution?

It is to this at last that the question must really be narrowed. The exact hinge and whole stress of the inquiry is here. And we can attain no satisfaction on this point, no sufficient answer to this question, and therefore no satisfactory conclusion to our whole line of investigation, till the doctrine of the everlasting Covenant oneness comes into view. That is the great underlying relation. That is the grand primary conjunction between the Redeemer and the redeemed, which alone bears up, and justifies, and accounts for all else in respect of relation which can be predicated as true concerning them. “Both He that sanctifieth and they that are sanctified are All Of One: for Which cause He is not ashamed to call them brethren” (Heb. ii. 11).

His substitution is a good reason for His suretyship. Covenant oneness is, if possible, a still better reason for His substitution. For now is the vicariousness of His sacrifice not merely brought to light, but vindicated. It is not merely true that He suffers for us; it is also true that we suffer in Him. And the latter of these propositions justifies the truth and righteousness of the former. He is substituted for us, because He is one With us —identified with us, and we with Him.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/hugh-martin.html">Hugh Martin</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Atonement: In its Relations to the Covenant, the Priesthood, the Intercession of our Lord</cite>, (London: James Nisbet &amp; Co., 1870), pp 34-35.</span></figcaption>

</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-542d0dd86b" data-kw="">
<blockquote><p>As God is pleased to enter into Covenant with his people, so is he first in the Covenant. God requires no man to bind himself by Covenant to Him, till the Lord first strike a Covenant with his Soul. As we love him, because he loved us first; so we enter into Covenant with him, because he first entereth into Covenant with us. I will be their God, he is first bound, and seals first; and then, and not till then, it follows; they shall be my people. This is the constant tenor of the Covenant. And shall he begin, and we think much to follow?

Can there be a marriage consummated where only the man is first married to the woman, and the woman will not after, for her part, be married to the man? Now, God no way so much declares his willingness to be in Covenant, and to be first in it, as by deliverances … great reason therefore, men should then second him by mutual stipulation. It is an hard case, when men will not follow, where God leads.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/cornelius-burges.html">Cornelius Burges</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The first sermon, preached to the Honourable House of Commons now assembled in Parliament at their publique fast. Novemb. 17. 1640</cite>, (London: Philemon Stephens and Christopher Meredith, 1641), pp 32-33.</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/the-covenant-of-grace.html">The Covenant of Grace</a></span></div>

</figure><figure class="quote" id="q-5b81334c43" data-kw="">
<blockquote><p>But after the flood, on Noah’s offering a sacrifice that represented the sacrifice of Christ, God, in smelling a sweet savour, or accepting that sacrifice, as it was a representation of the true sacrifice of Christ, which is a sweet savour indeed to God, he gives Noah a new grant of the earth, founded on that sacrifice of Christ, of that covenant of grace which is by that sacrifice of Christ, with a promise annexed, that now the earth should no more be destroyed, till the consummation of all things; as you may see in Gen. viii. 20.21.22. and chapter ix. 1.2.3.7. The reason why such a promise, that God would no more destroy the earth, was added to this grant made to Noah, and not to that made to Adam, was because this was founded on the covenant of grace, of which Christ was the surety, and therefore could not be broken.

Therefore it comes to pass now, that though the wickedness of man has dreadfully raged, and the earth been filled with violence and wickedness thousands of times, and one age after another, and much more dreadful and aggravated wickedness than the world was full of before the flood, being against so much greater light and mercy; especially in these days of the gospel: yet God’s patience holds out; God does not destroy the earth; his mercy and forbearance abides according to his promise; and his grant established with Noah and his sons abides firm and good, being founded on the covenant of grace.

IV. On this God renews with Noah and his sons the covenant of grace, Gen. ix.9.10. “And I, behold, I establish my covenant with you, and with your seed after you, and with every living creature that is with you,” &amp;c.; which was the covenant of grace; which even the brute creation have this benefit of, that is shall never be destroyed again till the consummation of all things. When we have this expression in scripture, my covenant, it commonly is to be understood of the covenant of grace. The manner of expression, “I will establish my covenant with you, and with your seed after you,” shews plainly, that it was a covenant already in being, that had been made already, and that Noah would understand what covenant it was by that denomination, viz. the covenant of grace.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/jonathan-edwards.html">Jonathan Edwards</a></span><span class="wk"><span class="lbl">Work:</span> <cite>A history of the work of redemption. Containing the outlines of a body of divinity, in a method entirely new</cite>, ed. John Erskine (1774; Boston, 1782), pp 37-38.</span></figcaption>

</figure><figure class="quote" id="q-98ca1df46e" data-kw="">
<blockquote><p>We are astonished at the man who is wholly intent on the pursuit of gain, while he neglects the salvation of his soul, “a good all price beyond.” But are none of us treading in his steps? The heart is deceitful above all things, and a covetous heart, perhaps, the most deceitful of all. On no subject do men more frequently mistake their own character.

We often see those over whom this vice reigns with the most unlimited sway, apparently as unconscious of the fact, as if their souls were baptised with the purest charity. They may even become a proverb for their covetousness without suspecting that this disposition has ever found its way into their hearts. But how is it with us? Are we so far absorbed in the world as to have neither time nor inclination to attend to the great duties of religion? Do we plead the multiplicity of our worldly cares as an excuse for neglecting the great and solemn concerns of our souls?

Then are we covetous. We indulge an inordinate desire for the good things of this world, and we are not willing to cast our care on divine providence in the humble discharge of our duty. We are not willing to seek the kingdom of God and his righteousness first of all, leaving it to the Lord to supply us with whatever is needful, according to his good promise. We tread in the steps of the rich worldling, whose heart was supremely set upon the acquisition and enjoyment of the present life.

But suppose we do not neglect the duties of religion altogether — yet if we attend to them only as our worldly interest and convenience will admit — if we subordinate them to the pursuits and acquisitions of the world, we are among the covetous, whom the Lord abhorreth. I will go farther. Suppose we are scrupulously attentive to all the external duties of religion, yet if our souls are not in them, what will it avail? If our hearts are not in heaven but on earth, are we not earthly?

The Pharisees abounded in the rites and forms of religion, while they devoured widows’ houses and gave other signs of the most deep rooted covetousness. Whoever toils chiefly for the body, not for the soul, is like the man in the parable, who hid up treasure for himself, but was not rich towards God.</p></blockquote>

<div class="actions"><button class="copy" data-copy="“We are astonished at the man who is wholly intent on the pursuit of gain, while he neglects the salvation of his soul, “a good all price beyond.” But are none of us treading in his steps? The heart is deceitful above all things, and a covetous heart, perhaps, the most deceitful of all. On no subject do men more frequently mistake their own character.

We often see those over whom this vice reigns with the most unlimited sway, apparently as unconscious of the fact, as if their souls were baptised with the purest charity. They may even become a proverb for their covetousness without suspecting that this disposition has ever found its way into their hearts. But how is it with us? Are we so far absorbed in the world as to have neither time nor inclination to attend to the great duties of religion? Do we plead the multiplicity of our worldly cares as an excuse for neglecting the great and solemn concerns of our souls?

Then are we covetous. We indulge an inordinate desire for the good things of this world, and we are not willing to cast our care on divine providence in the humble discharge of our duty. We are not willing to seek the kingdom of God and his righteousness first of all, leaving it to the Lord to supply us with whatever is needful, according to his good promise. We tread in the steps of the rich worldling, whose heart was supremely set upon the acquisition and enjoyment of the present life.

</figure><figure class="quote" id="q-3131fb392c" data-kw="">
<blockquote><p>That man indeed saw little of the truth and glory of the everlasting covenant who said that “the work and death of Jesus would have been very glorious though no individual of the human race had ever come and reposed living faith in the surety.” How dishonouring to the work of Jesus! How dishonouring to the righteousness of God! To what straits are men reduced when at all hazards they will have it that the death of Jesus was accomplished alike for the saved and the lost!

For if he died for the lost, and yet his death did not secure them from being lost, it must be something else than his death that secured the saved unto salvation. So that if Jesus died for all alike, it is not his death that secures the salvation of any; it only secures, it seems, the possibility of salvation to all! That is the whole fruit of it—and it is this which has tempted to the terrible and blasphemous assertion that “his death would have been a glorious work though none had been saved by it at all.”

That is to say—though he had never earned the name of Jesus, who saves his people from their sins! We have not so learned the covenant or gospel of our salvation. And very clearly our blessed Lord did not so understand the case in which he himself has so glorious an interest. “If ye seek me, let these go their way, that the saying might be fulfilled, Of those whom thou hast given me I have lost none.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/hugh-martin.html">Hugh Martin</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Shadow of Calvary: Gethsemane – The Arrest – The Trial</cite>, (Edinburgh: Lyon &amp; Gemmell, 1875), pp 158-59.</span></figcaption>

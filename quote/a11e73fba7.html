<main class="wrap"><figure class="quote" id="q-a11e73fba7" data-kw="">
<blockquote><p>As a result, our faith and theology can be called completely rational, not in that it a priori demonstrates its truth necessarily with arguments in opposition to those who deny the basic assumptions of the Christian religion, but in that it demonstrates its conclusions from the authority of Scripture and with arguments derived from Scripture in opposition to those who accept something [aliquod] of the things that are revealed in a divine manner; and in that it at least refutes the arguments of those who accept nothing of it, namely those arguments by which they charge our faith with contradiction and absurdity, as Thomas [Aquinas] correctly distinguishes in his Summa theologiae, part I, quaestio 1, article 8 [‘Whether Sacred Doctrine is a Matter of Argument’]. Add to this that [reason], by directly attacking false theology, consequently and indirectly defends true theology, that is, by clearing away impediments and prejudices, and so paving the way to the truth. A similar defense of the fatih can be seen in Athenagoras, Justin Martyr, Clement of Alexandria, Origen, Tertullian, Arnobius, Lactantius, Augustine, Theodoret, Cyril of Alexandria, and so forth; in the medieval writers Thomas Against the Pagans and the other scholastics, if one with discretion and discernment takes the more solid excerpts; as well as Savonarola in The Triumph of the Cross; Raymond of Sabunde [d. 1436] in On Natural Theology; Cardinal Cusanus, Dionysius the Carthusian and others who wrote against the Muslims; and finally, more recent writers such as Louis Vives [d. 1540], Agostino Steuco [d. 1548], Charron [d. 1603], the scholastics who treat quaestiones and the commentators on Lombard and Thomas, but especially Du Plessis [Mornay] [1623] in his excellent treatise On the Truth of the Christian Religion. To this list we could add the adversaries of the Socinians whom we have already cited elsewhere [previously in the disputation].</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/gisbertus-voetius.html">Gisbertus Voetius</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Willem J. van Asselt, Introduction to Reformed Scholasticism</cite>, (RHB, 2011), Appendix 2, ‘The Use of Reason in Matters of Faith’, pp. 229-30</span></figcaption>

</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-3e300985bf" data-kw="">
<blockquote><p>A distinction after some work of the mind (distinction of reason, logical distinction, mental distinction) is a lack of identity that arises from an operation of the mind, whether with or without a foundation in the thing. Such a distinction flourishes between several concepts of one and the same reality and it is acquired insofar as the mind conceives the same thing according to diverse and distinct concepts each one of which represents the whole reality, but partially and not totally. The concepts are distinct and diverse but incomplete and inclusive. This distinction is either: A. with a foundation in the thing (a distinction of reasoned reason, intentional or virtual distinction), if from the real diversity of the effect that arises from one and the same formal cause the intellect has a reason or a foundation for distinguishing diverse respects in the cause itself. So in the light of the sun, for instance, there is a distinction between the powers of heating, illumining, and liquefying; in the human intellect there is a distinction between the faculties of conceiving, judging, and reasoning. B. without a foundation in the thing (distinction purely mental, distinction of reasoning reason) if the reason for distinguishing is not found in the thing but in some being of reason, for instance the distinction between man and humanity, or between ‘man’ and ‘man’s’.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/allan-b-wolter.html">Allan B. Wolter</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Little Summary of Metaphysics</cite>, (Milwaukee: Bruce Publishing Co., 1958), ch. 2, ‘On the Attributes in General &amp; on ‘One”, Article 4, ‘On Identity &amp; Distinction’, p. 31</span></figcaption>

<blockquote><p>But the errors of philosophers are not the dictates of philosophy, any more than the mistakes of artificers are to be imputed to the art itself. ‘Philosophy,’ says Clement of Alexandria, ‘is not to be called Stoic, nor Platonic, nor Epicurean, nor Aristotelian, but whatever has been properly spoken by these sects–this, gathered into one whole, is to be called philosophy’ (Stromata 1.7 [ANF 2:308; PG 8.731]).</p></blockquote>

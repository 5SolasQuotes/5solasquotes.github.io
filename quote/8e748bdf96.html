<main class="wrap"><figure class="quote" id="q-8e748bdf96" data-kw="">
<blockquote><p>The hurtful winds of Infidelity, or Deism, are blowing, which strike at the roots, and deny all supernatural revelation, or at least discard all the supernatural mysteries of the Christian religion, which depraved reason is not able to comprehend, such as the doctrine of the incarnation of the Son of God, and of his satisfaction to justice, of the necessity of regeneration, of justification by his imputed righteousness, of sanctification by his Spirit: these, and the like supernatural doctrines of our holy religion, I say, are exploded by many in our day, insomuch that through many places of Scotland, instead of the gospel of Christ, nothing is to be heard, but the dry sapless harangues of heathenish morality. And what must become of those poor souls that are daily entertained with such food? Why, Solomon answers the question, when he tell us, “Where no vision is, the people perish.” The hurtful wind of Arian heresy has been travelling through the land, and appeared before the bar of the Assembly without any becoming censure.

The doctrine of self-love also, whereby the creature is exalted above the glorious Creator. We have been long taught, that the chief end of man is, to glorify God, and that whether we eat or drink, or whatever we do, we ought to do all to the glory of God. And, to be sure, that which is the chief end of man, ought also to be the leading and chief motive of all his moral and religious actions. But now it is a doctrine sustained by the National Assembly, that our own delight, pleasure, and satisfaction in glorifying God, is the chief motive of all virtuous and religious actions; whereby the creature’s happiness is preferred unto the glory of God, who made all things for himself.

And I cannot shun to observe, that God, in a way of righteous judgment, is answering many according to this idol of jealousy set up in the temple of God, by letting them adopt, and embrace a religion that lies all in internal feelings, pleasure, and satisfaction to themselves; while the declarative glory of God, and the honour of the Redeemer’s crown and kingdom in the world, is none of their concern; yea, it torments them to hear of a testimony against the indignities done to him in the land wherein we live. I might here also insist on the injuries done to the doctrines of the grace of God, in the Acts of Assembly, 1720 and 1722, with relation to the Marrow of Modern Divinity whereby a bundle of precious truths are condemned, and lie under the rubbish ever since, which I hope shall yet be brought forth unto victory.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/ebenezer-erskine.html">Ebenezer Erskine</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The angel s seal set upon God’s faithful servants, when hurtful winds are blowing in the church militant. Being the substance of three sermons preached in the new church of Bristo, at Edinburgh, at, and after the celebration of the sacrament of the Lord’s Supper there, October 10, 11, and 17, 1742’ </cite></span></figcaption>

<blockquote><p>The mere absence of any express command in the New Testament to keep the Sabbath cannot, therefore, be regarded as any valid objection against its moral obligation. But if we are still bound to obey the Fourth Commandment, then why do we keep our Sabbath on the first, instead of the seventh day of the week?

There is nothing in the terms of the commandment itself, as we have already endeavoured to show, inconsistent with such a change; and, while holding its continued obligation, there is nothing to prevent us from maintaining that, “from the beginning of the world to the resurrection of Christ, God appointed the seventh day of the week to be the weekly Sabbath, and the first day of the week ever since, to continue to the end of the world, which is the Christian Sabbath.” [Westminster Confession 21.7]

To add a new reason for the observance of such a day, over and above that which was intimated at the time of its appointment, does not change the nature or obligation of the institution. This had been done before. Although the primary reason — God’s resting from all His works — could never be annulled or consigned to forgetfulness; yet that did not hinder the addition of another reason — God’s special kindness to His people in delivering them from their bondage in Egypt — as a further ground why they should keep that commandment, (Deut. v. 12—15.)

And when an event so transcendently important and glorious, as the Resurrection of the Redeemer from the grave — His resting from all His painful work, and completion of the great redemption — when that event took place, what more reasonable, more fitting than that this should not only be added to the former reasons for the observance, but should take the lead as foremost of the grounds for our grateful and reverential celebration.

When Jesus, therefore, appeared first to His assembled disciples on the first day of the week – the joyful day of His resurrection — and on that day week repeated His appearance, as if on purpose to set a peculiar honour on the day, and to mark it as His own, — and on a subsequent first day, the day of Pentecost, when they were all assembled for worship, poured out upon them His promised Spirit, — we are not surprised to find the primitive Christians, no doubt under His own impulse and direction, making the first rather than the seventh day of the week — during which he had lain in the grave — their day of sacred rest and social worship, on which they statedly met to praise Him, and to break bread, and to hear His word — the day of days, in their estimation, for it was “the Lord’s-day.”

If the evidence for the change of the day be chiefly inferential and indirect, it is not on that account the less conclusive. Not only is it an admitted principle that the practice of the first Christian churches, under the guidance of the apostles, as recorded in the New Testament, is equivalent in value and authority to direct precept, but there is a good reason for the absence of any explicit injunction, formally authorising the change. It is this, namely, — that the transition from the rites and ceremonies of the old economy, to the simpler institutions of the new, was not sudden and abrupt, but gradual and gentle. It was only slowly, and by degrees, that ancient observances — to which God’s people had been long habituated, and which they had been trained from infancy to revere — were broken off.

Our Lord, and His apostles following His example, dealt very considerately and tenderly with the Jewish converts. For some time after the fulfilment and abrogation of the Mosaic ritual, circumcision, and laws concerning meats, and such like regulations, continued to be observed by the Jewish portion of the Church. And it seems very probable — almost certain indeed — that the seventh-day Sabbath was for some time religiously kept by Christians of that class, as well as the Lord’s-day.

Christ, therefore, and His apostles after Him, avoiding all unnecessary giving of offence, sympathising with the weaknesses of their brethren, proceeded quietly in introducing the change, and by degrees so established it throughout the Church, that, in the records which remain to us of the first, second, and third centuries of her history, we find Christians constantly keeping the first day as the holy day.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/william-symington.html">William Symington</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Sabbath; The Grounds of its Obligation, and its Proper Place in Relation to Christian Life and Duty in Patrick Fairbairn et al., Divine Revelation Explained and Vindicated: A Course of Lectures for the Times, Delivered in Glasgow in the Spring of 1866</cite></span></figcaption>

<div class="actions"><button class="copy" data-copy="“The mere absence of any express command in the New Testament to keep the Sabbath cannot, therefore, be regarded as any valid objection against its moral obligation. But if we are still bound to obey the Fourth Commandment, then why do we keep our Sabbath on the first, instead of the seventh day of the week?

There is nothing in the terms of the commandment itself, as we have already endeavoured to show, inconsistent with such a change; and, while holding its continued obligation, there is nothing to prevent us from maintaining that, “from the beginning of the world to the resurrection of Christ, God appointed the seventh day of the week to be the weekly Sabbath, and the first day of the week ever since, to continue to the end of the world, which is the Christian Sabbath.” [Westminster Confession 21.7]

To add a new reason for the observance of such a day, over and above that which was intimated at the time of its appointment, does not change the nature or obligation of the institution. This had been done before. Although the primary reason — God’s resting from all His works — could never be annulled or consigned to forgetfulness; yet that did not hinder the addition of another reason — God’s special kindness to His people in delivering them from their bondage in Egypt — as a further ground why they should keep that commandment, (Deut. v. 12—15.)

And when an event so transcendently important and glorious, as the Resurrection of the Redeemer from the grave — His resting from all His painful work, and completion of the great redemption — when that event took place, what more reasonable, more fitting than that this should not only be added to the former reasons for the observance, but should take the lead as foremost of the grounds for our grateful and reverential celebration.

When Jesus, therefore, appeared first to His assembled disciples on the first day of the week – the joyful day of His resurrection — and on that day week repeated His appearance, as if on purpose to set a peculiar honour on the day, and to mark it as His own, — and on a subsequent first day, the day of Pentecost, when they were all assembled for worship, poured out upon them His promised Spirit, — we are not surprised to find the primitive Christians, no doubt under His own impulse and direction, making the first rather than the seventh day of the week — during which he had lain in the grave — their day of sacred rest and social worship, on which they statedly met to praise Him, and to break bread, and to hear His word — the day of days, in their estimation, for it was “the Lord’s-day.”

If the evidence for the change of the day be chiefly inferential and indirect, it is not on that account the less conclusive. Not only is it an admitted principle that the practice of the first Christian churches, under the guidance of the apostles, as recorded in the New Testament, is equivalent in value and authority to direct precept, but there is a good reason for the absence of any explicit injunction, formally authorising the change. It is this, namely, — that the transition from the rites and ceremonies of the old economy, to the simpler institutions of the new, was not sudden and abrupt, but gradual and gentle. It was only slowly, and by degrees, that ancient observances — to which God’s people had been long habituated, and which they had been trained from infancy to revere — were broken off.

Our Lord, and His apostles following His example, dealt very considerately and tenderly with the Jewish converts. For some time after the fulfilment and abrogation of the Mosaic ritual, circumcision, and laws concerning meats, and such like regulations, continued to be observed by the Jewish portion of the Church. And it seems very probable — almost certain indeed — that the seventh-day Sabbath was for some time religiously kept by Christians of that class, as well as the Lord’s-day.

Christ, therefore, and His apostles after Him, avoiding all unnecessary giving of offence, sympathising with the weaknesses of their brethren, proceeded quietly in introducing the change, and by degrees so established it throughout the Church, that, in the records which remain to us of the first, second, and third centuries of her history, we find Christians constantly keeping the first day as the holy day.”

— William Symington, The Sabbath; The Grounds of its Obligation, and its Proper Place in Relation to Christian Life and Duty in Patrick Fairbairn et al., Divine Revelation Explained and Vindicated: A Course of Lectures for the Times, Delivered in Glasgow in the Spring of 1866">Copy</button><a class="share" href="https://x.com/intent/post?text=%E2%80%9CThe+mere+absence+of+any+express+command+in+the+New+Testament+to+keep+the+Sabbath+cannot%2C+therefore%2C+be+regarded+as+any+valid+objection+against+its+moral+obligation.+But+if+we+are+still+bound+to+obey+the+Fourth+Commandment%2C+then+why+do+we+keep+our+Sabbath+on+the+first%2C+instead+of+the+seventh+day+of+the+week%3F%0A%0AThere+is+nothing+in+the+terms+of+the+commandment+itself%2C+as+we+have+already+endeavoured+to+show%2C+inconsistent+with+such+a+change%3B+and%2C+while+holding+its+continued+obligation%2C+there+is+nothing+to+prevent+us+from+maintaining+that%2C+%E2%80%9Cfrom+the+beginning+of+the+world+to+the+resurrection+of+Christ%2C+God+appointed+the+seventh+day+of+the+week+to+be+the+weekly+Sabbath%2C+and+the+first+day+of+the+week+ever+since%2C+to+continue+to+the+end+of+the+world%2C+which+is+the+Christian+Sabbath.%E2%80%9D+%5BWestminster+Confession+21.7%5D%0A%0ATo+add+a+new+reason+for+the+observance+of+such+a+day%2C+over+and+above+that+which+was+intimated+at+the+time+of+its+appointment%2C+does+not+change+the+nature+or+obligation+of+the+institution.+This+had+been+done+before.+Although+the+primary+reason+%E2%80%94+God%E2%80%99s+resting+from+all+His+works+%E2%80%94+could+never+be+annulled+or+consigned+to+forgetfulness%3B+yet+that+did+not+hinder+the+addition+of+another+reason+%E2%80%94+God%E2%80%99s+special+kindness+to+His+people+in+delivering+them+from+their+bondage+in+Egypt+%E2%80%94+as+a+further+ground+why+they+should+keep+that+commandment%2C+%28Deut.+v.+12%E2%80%9415.%29%0A%0AAnd+when+an+event+so+transcendently+important+and+glorious%2C+as+the+Resurrection+of+the+Redeemer+from+the+grave+%E2%80%94+His+resting+from+all+His+painful+work%2C+and+completion+of+the+great+redemption+%E2%80%94+when+that+event+took+place%2C+what+more+reasonable%2C+more+fitting+than+that+this+should+not+only+be+added+to+the+former+reasons+for+the+observance%2C+but+should+take+the+lead+as+foremost+of+the+grounds+for+our+grateful+and+reverential+celebration.%0A%0AWhen+Jesus%2C+therefore%2C+appeared+first+to+His+assembled+disciples+on+the+first+day+of+the+week+%E2%80%93+the+joyful+day+of+His+resurrection+%E2%80%94+and+on+that+day+week+repeated+His+appearance%2C+as+if+on+purpose+to+set+a+peculiar+honour+on+the+day%2C+and+to+mark+it+as+His+own%2C+%E2%80%94+and+on+a+subsequent+first+day%2C+the+day+of+Pentecost%2C+when+they+were+all+assembled+for+worship%2C+poured+out+upon+them+His+promised+Spirit%2C+%E2%80%94+we+are+not+surprised+to+find+the+primitive+Christians%2C+no+doubt+under+His+own+impulse+and+direction%2C+making+the+first+rather+than+the+seventh+day+of+the+week+%E2%80%94+during+which+he+had+lain+in+the+grave+%E2%80%94+their+day+of+sacred+rest+and+social+worship%2C+on+which+they+statedly+met+to+praise+Him%2C+and+to+break+bread%2C+and+to+hear+His+word+%E2%80%94+the+day+of+days%2C+in+their+estimation%2C+for+it+was+%E2%80%9Cthe+Lord%E2%80%99s-day.%E2%80%9D%0A%0AIf+the+evidence+for+the+change+of+the+day+be+chiefly+inferential+and+indirect%2C+it+is+not+on+that+account+the+less+conclusive.+Not+only+is+it+an+admitted+principle+that+the+practice+of+the+first+Christian+churches%2C+under+the+guidance+of+the+apostles%2C+as+recorded+in+the+New+Testament%2C+is+equivalent+in+value+and+authority+to+direct+precept%2C+but+there+is+a+good+reason+for+the+absence+of+any+explicit+injunction%2C+formally+authorising+the+change.+It+is+this%2C+namely%2C+%E2%80%94+that+the+transition+from+the+rites+and+ceremonies+of+the+old+economy%2C+to+the+simpler+institutions+of+the+new%2C+was+not+sudden+and+abrupt%2C+but+gradual+and+gentle.+It+was+only+slowly%2C+and+by+degrees%2C+that+ancient+observances+%E2%80%94+to+which+God%E2%80%99s+people+had+been+long+habituated%2C+and+which+they+had+been+trained+from+infancy+to+revere+%E2%80%94+were+broken+off.%0A%0AOur+Lord%2C+and+His+apostles+following+His+example%2C+dealt+very+considerately+and+tenderly+with+the+Jewish+converts.+For+some+time+after+the+fulfilment+and+abrogation+of+the+Mosaic+ritual%2C+circumcision%2C+and+laws+concerning+meats%2C+and+such+like+regulations%2C+continued+to+be+observed+by+the+Jewish+portion+of+the+Church.+And+it+seems+very+probable+%E2%80%94+almost+certain+indeed+%E2%80%94+that+the+seventh-day+Sabbath+was+for+some+time+religiously+kept+by+Christians+of+that+class%2C+as+well+as+the+Lord%E2%80%99s-day.%0A%0AChrist%2C+therefore%2C+and+His+apostles+after+Him%2C+avoiding+all+unnecessary+giving+of+offence%2C+sympathising+with+the+weaknesses+of+their+brethren%2C+proceeded+quietly+in+introducing+the+change%2C+and+by+degrees+so+established+it+throughout+the+Church%2C+that%2C+in+the+records+which+remain+to+us+of+the+first%2C+second%2C+and+third+centuries+of+her+history%2C+we+find+Christians+constantly+keeping+the+first+day+as+the+holy+day.%E2%80%9D%0A%0A%E2%80%94+William+Symington%2C+The+Sabbath%3B+The+Grounds+of+its+Obligation%2C+and+its+Proper+Place+in+Relation+to+Christian+Life+and+Duty+in+Patrick+Fairbairn+et+al.%2C+Divine+Revelation+Explained+and+Vindicated%3A+A+Course+of+Lectures+for+the+Times%2C+Delivered+in+Glasgow+in+the+Spring+of+1866&amp;url=https%3A%2F%2F5solasquotes.github.io%2Fquote%2F64cba746fa.html&amp;via=5Solas" target="_blank" rel="noopener">Share on X</a><a class="perma" href="../quote/64cba746fa.html">Permalink</a><a class="src" href="https://reformedcovenanter.wordpress.com/2020/01/26/william-symington-ii-on-the-lords-day-as-the-christian-sabbath/" rel="noopener" target="_blank">Read it online · Reformed Covenanter</a></div>

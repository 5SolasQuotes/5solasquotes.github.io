<blockquote><p>2. It is to be considered, how many ways Christ may be said to give Himself [Greek], a ransom for us, or in our place. … 2. Nor is it true that Christ’s dying for all and every one (which is a dream) makes salvation possible to all so that the Covenant is preachable to all upon condition of believing, Acts 10:43. ‘To Him’ (Jesus anointed, who went about doing good and so was man, v. 38) ‘to Him’ (who was slain in our nature, not for all and every man, v. 39, ‘to Him’) whom God raised up the third day, v. 40. To Him gave all the prophets witness (as it is, v. 43) that through his name, whoever believes in Him shall have remission of sins.</p></blockquote>

</figure><figure class="quote" id="q-39e34c7d9b" data-kw="">
<blockquote><p>This notion, as if the justification, righteousness, and life spoken of in Rom. v. implied the resurrection of damnation, is not only without ground from Scripture, but contrary to reason. For those are there spoken of as great benefits, by the grace and free gift of God: but this is the contrary, in the highest degree possible; the most consummate calamity. To obviate this, our author supposes the resurrection of all to be a great benefit in itself, though turned into a calamity by the sin and folly of obstinate sinners, who abuse God&#x27;s goodness. But the far greater part of mankind, since Adam, have never had opportunity to abuse this goodness, it having never been made known to them. Men cannot abuse a kindness, which they never had either in possession, promise, offer, or some intimation: but a resurrection is made known only by divine revelation which few comparatively have enjoyed. So that as to such wicked men as die in lands of darkness, if their resurrection comes at all by Christ, it comes from him, and to them, only is a curse, and not a blessing; for it never comes to them at all by any conveyance, grant, promise, or offer, or any thing by which they can claim it, or know any thing of it, till it comes as an infinite calamity, past all remedy.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/jonathan-edwards.html">Jonathan Edwards</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Great Christian Doctrine of Original Sin Defended</cite>, pt. 2, ch. 4, sec. 1 (on Rom. 5:12–21)</span></figcaption>

</figure><figure class="quote" id="q-53d9370573" data-kw="">
<blockquote><p>Here comes in that question, whether or not the power of the temporal magistrate (as such) be so derived from Christ, not only as God, but as Mediator, so that he is his deputy and vice-gerent. The negative may be made good by these following arguments:

1. The power of Christ’s deputies as Mediator is only ministerial, the power of servants or heralds (Lk. 22:25-26; Mt. 20:25-27): as Protestants prove against Papists in the controversy touching the supremacy of the Pope. But now the power of magistrates may be imperial and monarchical, and therefore it is not derived from Christ as He is Mediator unto his deputies.

2. All the deputies and vice-gerents of Christ as Mediator are obliged to promote the Kingdom and Gospel of Christ. But now heathenish magistrates that never heard, nor could hear of the name of Christ, are not bound to promote Christ’s Mediatory Kingdom and gospel: for they are invincibly ignorant thereof, and there can be no obligation without revelation (Jn. 15:22; Rom. 2:12). Therefore they are not the deputies and vice-gerents of Christ as Mediator, and therefore [they are] no magistrates as such: for, à quatenus ad de omni valet consequentia.

3. All the deputies and vice-gerents of Christ as Mediator have their commission from the Gospel; but now temporal magistrates have their commission at least from the secondary law of nature, the law of nations. But now the law of nature and nations dictates nothing of a Mediator, or anything relating unto Him as such. I should send the reader unto Mr. Gillespie in his Aaron’s Rod Blossoming, Book 2, chs. 6–7; to see farther of this subject, but because Mr. Baxter thinks Mr. Rutherford a more able disputant than Gillespie, I shall refer unto him, in his Lex &amp; Rex, Question 42, from pp. 422-433, as also his Divine Right of Church Government, [ch. 28] from pp. 600-42 where he prosecutes these and other arguments at large…</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/henry-jeanes.html">Henry Jeanes</a></span><span class="wk"><span class="lbl">Work:</span> <cite>A Mixture of Scholastical Divinity, with Practical, in Several Tractates</cite>, (Oxford, 1656), p. 43. Jeanes was an English presbyterian minister.</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/priestly-office-satisfaction-and-atonement/extent-of-the-atonement.html">Extent of the Atonement</a></span></div>

<blockquote><p>IV. Although then this most divine panace or catholic remedy is proposed to all in the Gospel, yet we believe that no efficacy of it can be transfused, except there be an applying of this by faith in the Son of God, even as there can be no efficacy in physic or medicaments, except the sick patient hearken to the physician, and apply his medicines; which metaphor the Holy Ghost uses in this case.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/david-pareus.html">David Pareus</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Other citations (work not named)</cite>, Article 2, ‘Of Christ’s Death &amp; Merit’ in Aphorisms of the Orthodox Doctrine of the Reformed Churches in Zachary Ursinus, The Sum of Christian Religion… (London: Young, 1645), pp. 694-98</span></figcaption>

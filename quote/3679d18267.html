<blockquote><p>To this Christ do all the prophets bear witness, that whosoever believeth in Him shall receive forgiveness of sins through his name. (Acts 10:43)</p></blockquote>

</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-9dbf374903" data-kw="">
<blockquote><p>‘Born again’. Being turned unto God by true faith and repentance: A metaphorical term. We are born again four ways: 1. Sacramentally, by Baptism. 2. Spiritually, by the Word. 3. Corporally, in the Resurrection. 4. Eternally, in our Glorification. Question: But why is our repentance likened to a new birth? Answer: [1] To distinguish true repentance, from that which is false and fained: for it imports five differences. … 2. That in true repentance there is a total change in the whole nature of man: He has grace in every part; a new mind and a new heart, a new memory, and a new conscience, a new language, and a new carriage both to God and man: for birth is the producing of all essential parts of man. 3. That in true repentance there is the pain of contrition, a broken spirit, the throws and pains of travail, there is true godly sorrow and grief in the birth of grace. 4. That there is in true repentance a daily hunger and thirst after the sincere milk of the Word, 1 Pet. 2:2. 5. That in the things of God’s Kingdom there is new life, and sense, and feeling, and motion. Secondly, to show the privilege of the penitent: for it signifies he gets more by his new birth than any child in nature can do by pleading his birthright: For if in repentance we be born unto God, then it shows: 1. That we have received power to be the sons of God, Jn. 1:2. 2. That with our adoption we enjoy the privileges of sons. 1. The favor of God, as a father. 2. The care of God to maintain us, Mt. 6:33. 3. The pardon of God in saving us from condemnation, Rom. 8:1. 4. The portion of God, even the inheritance which God gives as a Father, which is spoken of Rom. 8:17; Gal. 4:7. The use should be twofold: 1. That wee try ourselves carefully in the businesse of our repentance by the former signes:* 1.2 and secondly, that we comfort ourselves in the privileges of our new birth, rejoicing in our portion, and the favor of our heavenly Father. And thus of the reason of the phrase. Concerning the new birth, here we have occasion to consider of two things: 1. That it is needful often to be remembered of the doctrine of regeneration: the apostle having spoken of it before, falls upon it here again.</p></blockquote>

</figure><figure class="quote" id="q-230c02f678" data-kw="">
<blockquote><p>Rather let us settle and secure this, that we are indeed the sons of God and heirs of heaven, by passing through the narrow womb of repentance, that we may be born again and by getting an effectual faith;</p></blockquote>

</figure><figure class="quote" id="q-ffeffc9973" data-kw="">
<blockquote><p>In mentioning the Spirit’s indwelling and working… we make believers the subject: Because though faith itself be the gift of God, yet there is so much greater and more eminent grace given after faith, and on condition of believing, than the grace is which enables us to believe, that it is only the giving of that greater measure (and extraordinary gifts) which in the New Testament is usually called the ‘giving of the Spirit’: For (as Mr. Thomas Hooker and others express it) the Spirit in working faith does but, as it were, make his way into the soul, and then dwells and works there afterwards; as (says he) some birds first make their way into a hard tree by stocking a hole in it, and afterward make their nests and lay their young there.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/richard-baxter.html">Richard Baxter</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Christian Concord, or the Agreement of the Associated Pastors &amp; Churches of Worcestershire, with Richard Baxter’s Explication &amp; Defence of it, &amp; his Exhortation to Unity</cite>, (London: A.M., 1653), ‘A Brief Explication of some Passages in the Profession’, p. 24</span></figcaption>

</figure><figure class="quote" id="q-f4e6a838b4" data-kw="">
<blockquote><p>The heart in Scripture is that which thinks, feels, wills, and acts. It is the soul; the self. A new heart is, therefore, a new self, a new man. It implies a change of the whole character. It is a new nature. Out of the heart proceed all conscious, voluntary, moral exercises. A change of heart, therefore, is a change which precedes these exercises and determines their character. A new heart is to a man what goodness is to the tree in the parable of our Lord.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/charles-hodge.html">Charles Hodge</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Systematic Theology</cite>, vol. 3, pt. 3, ch. 15, “Regeneration,” “A New Heart”</span></figcaption>

<blockquote><p>It may press us to admire the grace of God to his children. He cannot satisfy himself in doing good to you, but he must do good to your children too. How should we entertain this with reverence! When God told Abraham, I am thy God, and the God of thy seed, ‘Abraham fell upon his face,’ as humbly adoring the goodness of God, Gen.17:3; so David, when God spake concerning his house and his children: 2 Sam. 7:18, 19, ‘What am I, O Lord, and what is my house, that thou hast brought me hitherto?’ And this was yet a small thing in thy sight, O Lord God; for thou hast spoken also of thy servant’s house for a great while to come;’ he stands wondering at this mercy of God.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/thomas-manton.html">Thomas Manton</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Complete Works of Thomas Manton vol. 14</cite>, (London: James Nisbet &amp; Co., 1973), 206–07.</span></figcaption>

<blockquote><p>The short answer is that the will is the power or capacity of a rational substance to pursue what the intellect judges to be good. (Not necessarily morally good, but at least good in the broad sense of being suitable or desirable in some way.) It is also traditionally known as the ‘rational appetite.’ It is an appetite insofar as it involves an inclination or tendency toward some object or end. It is a rational appetite insofar as the object is pursued as something conceptualized in a certain way, and thus as something about which we might reason and come to know true propositions. This distinguishes the will from the appetites that non-human animals possess, which involve inclinations toward non-conceptualized objects of sensory perception; and from the sorts of inclinations or tendencies that a plant or an inanimate substance might exhibit, which are not even conscious, let alone conceptualized… A human being, by contrast, can not only perceive and desrie water, but can know that it is water and desire it precisely as something conceptualized… To be able to do that sort of thing is just what it is to have a will. This is, in any even, the account fo the will famously associated with Aquinas…</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/edward-feser.html">Edward Feser</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Immortal Souls: a Treatise on Human Nature</cite>, (Editiones Scholasticae, 2024), pt. 1, ch. 4, ‘The Will’; p. 111</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/man/image-of-god.html">Image of God</a></span></div>

</figure><figure class="quote" id="q-d3bbb51ec1" data-kw="">
<blockquote><p>…For like every other natural phenomenon, practical reason has a natural end or goal toward which it is ordered, and that end or goal is just whatever it is the intellect perceives to be good or worth pursuing. Now given what has already been said, human beings, like everything else in nature, have various capacities and ends the fulfillment of which is good for them and the frustrating of which is bad, as a matter of objective fact. A rational intellect apprised of the facts will therefore perceive that it is good to realize these ends and bad to frustrate them. It follows, then, that a rational person will pursue the realization of these ends and avoid their frustration. In short, practical reason is directed by nature toward the pursuit of what the intellect perceives to be good; what is in fact good is the realization of the various ends inherent in human nature; and thus a rational and correctly informed person will perceive this and, accordingly, direct his actions towards the realization or fulfillment of those ends. In this sense, good action is just that which is “in accord with reason” (Summa Theologiae I-II.21.1; cf. Summa Theologiae I-II.90.1), and the moral skeptic’s question “Why should I do what is good?” has an obvious answer: Because to be rational just is (in part) to do what is good, to fulfill the ends set for us by nature. Natural law ethics as a body of substantive moral theory is the formulation of general moral principles on the basis of an analysis of the various human capacities and ends and the systematic working out of their implications. So, to take just one example, when we consider that human beings have intellects and that the natural end or function of the intellect is to grasp the truth about things, it follows that it is good for us—it fulfills our nature—to pursue truth and avoid error…</p></blockquote>

<blockquote><p>…non-rational animals pursue the good in its most practical and immediate aspect, according to their (non- rational) desires and motivations. Only the rational creature, however, can desire the good as abstracted from practical desires and circumstances, pursuing goodness in its universal form as an end in itself. It is the intellectual and volitional capacity within the human person that makes him the image of God, distinct from other creatures who reflect God’s goodness in lesser ways. It is in the human soul precisely as rational that the image of God reaches its pinnacle in the created order. By extension, there is a sense in which God’s causal intimacy with created causes also finds a kind of special intimacy in the case of human willing. Because of the volitional capacity of the rational soul, our participation in the similitude of divine goodness is far deeper than that of any other creature.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/reginald-m-lynch.html">Reginald M. Lynch</a></span><span class="wk"><span class="lbl">Work:</span> <cite>“Divine Causality &amp; Human Freedom</cite>, “Divine Causality &amp; Human Freedom: Aquinas, Banez and Premotion after Descartes” in eds. Ballor, Gaetano &amp; Sytsma, Beyond Dordt &amp; De Auxiliis: the Dynamics of Protestant &amp; Catholic Soteriology in the Sixteenth &amp; Seventeenth Centuries (Brill, 2019), p. 229 Lynch is a Dominican and writes in the Thomist tradition.</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/man/image-of-god.html">Image of God</a></span></div>
<div class="actions"><button class="copy" data-copy="“…non-rational animals pursue the good in its most practical and immediate aspect, according to their (non- rational) desires and motivations. Only the rational creature, however, can desire the good as abstracted from practical desires and circumstances, pursuing goodness in its universal form as an end in itself. It is the intellectual and volitional capacity within the human person that makes him the image of God, distinct from other creatures who reflect God’s goodness in lesser ways. It is in the human soul precisely as rational that the image of God reaches its pinnacle in the created order. By extension, there is a sense in which God’s causal intimacy with created causes also finds a kind of special intimacy in the case of human willing. Because of the volitional capacity of the rational soul, our participation in the similitude of divine goodness is far deeper than that of any other creature.”

— Reginald M. Lynch, “Divine Causality &amp; Human Freedom: Aquinas, Banez and Premotion after Descartes” in eds. Ballor, Gaetano &amp; Sytsma, Beyond Dordt &amp; De Auxiliis: the Dynamics of Protestant &amp; Catholic Soteriology in the Sixteenth &amp; Seventeenth Centuries (Brill, 2019), p. 229 Lynch is a Dominican and writes in the Thomist tradition.">Copy</button><a class="share" href="https://x.com/intent/post?text=%E2%80%9C%E2%80%A6non-rational+animals+pursue+the+good+in+its+most+practical+and+immediate+aspect%2C+according+to+their+%28non-+rational%29+desires+and+motivations.+Only+the+rational+creature%2C+however%2C+can+desire+the+good+as+abstracted+from+practical+desires+and+circumstances%2C+pursuing+goodness+in+its+universal+form+as+an+end+in+itself.+It+is+the+intellectual+and+volitional+capacity+within+the+human+person+that+makes+him+the+image+of+God%2C+distinct+from+other+creatures+who+reflect+God%E2%80%99s+goodness+in+lesser+ways.+It+is+in+the+human+soul+precisely+as+rational+that+the+image+of+God+reaches+its+pinnacle+in+the+created+order.+By+extension%2C+there+is+a+sense+in+which+God%E2%80%99s+causal+intimacy+with+created+causes+also+finds+a+kind+of+special+intimacy+in+the+case+of+human+willing.+Because+of+the+volitional+capacity+of+the+rational+soul%2C+our+participation+in+the+similitude+of+divine+goodness+is+far+deeper+than+that+of+any+other+creature.%E2%80%9D%0A%0A%E2%80%94+Reginald+M.+Lynch%2C+%E2%80%9CDivine+Causality+%26+Human+Freedom%3A+Aquinas%2C+Banez+and+Premotion+after+Descartes%E2%80%9D+in+eds.+Ballor%2C+Gaetano+%26+Sytsma%2C+Beyond+Dordt+%26+De+Auxiliis%3A+the+Dynamics+of+Protestant+%26+Catholic+Soteriology+in+the+Sixteenth+%26+Seventeenth+Centuries+%28Brill%2C+2019%29%2C+p.+229+Lynch+is+a+Dominican+and+writes+in+the+Thomist+tradition.&amp;url=https%3A%2F%2F5solasquotes.github.io%2Fquote%2F34e1ff4418.html&amp;via=5Solas" target="_blank" rel="noopener">Share on X</a><a class="perma" href="../quote/34e1ff4418.html">Permalink</a><a class="src" h

<blockquote><p>…all their arguments both from reason and Scripture are (as all arguments ever must be that are contrary to common sense) entirely fallacious and inconclusive, confounding the most distinct ideas with one another, as the abuse of a thing with the use of it, chiefly with only, dangerous with unlawful, etc…. They are likewise (as is usual upon these occasions) inconsistent with themselves, and run into manifest self-contradictions…</p></blockquote>

</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-bdc5ffc7c1" data-kw="">
<blockquote><p>LIkewise we refuse the opinion of Beda, that neither man nor beast did eat of any flesh, but only of the fruits of the earth before the Flood: neither do we allow the judgment of Thomas Aquinas, who thinks that the beasts which are now devourers of flesh, should have used that kind of food in the state of man’s innocency. [Summa] pt. 1, question 96, art.

1. The latter opinion we reject, because if man had not transgressed, there should have been no death in the world, Rom. 5:12, ‘Sin entred into the world by one man, and death by sin:’ if there should have beene no death in the world, because no sin, I see not how death should have entered upon other creatures, especially this violent death by slaughter: as the Apostle also says, Rom. 8:22, that every creature groans with us, and travails in pain together to this present: so that this bondage of pain and corruption, which makes man and beast groan together, was laid upon them together. Neither do I see how Basil’s opinion can stand, homily 11 on Genesis, that man in his innocency, though he should not have used the beasts for food, yet might have slain them, to take knowledge of their inward parts, and to help his experience that ways: or it should have been lawful unto him to kill them in hunting for his delight, as Pererius thinks, bk. 4 on Genesis, p. 663; for this slaughter and killing of beasts, upon what occasion soever, whether for food, for knowledge or pleasure, belongs unto the bondage of corruption, which by sin was brought into the world. The other opinion seems probable, especially because of these two places of Scripture: First, for that the beasts and fowls lived in the ark, not of flesh, but of other food than usual, as Noah is bidden to take of all meat that was eaten, Gen. 6:21, for there being only one couple of unclean beasts, and seven couple of clean preserved in the ark: out of these there could not be food of flesh sufficient for the rest: and after the cattle went out of the ark, there was no other food for them, all flesh being destroyed, but only by the fruits of the earth. Secondly, the first permission to eat flesh that we read of was after the flood, Gen. 9:3. Everything that moves and liveth shall be meat for you as the greene herb. But these objections may be easily answered. To the first we answer:

1. That the beasts which did devour flesh, did also feed of herbs: and so Noah might provide for them according to their eating: Though they did use altogether to live of flesh, yet I think that for that present time, and some while after, all beasts might return to the first food appointed in the creation, this being a second creation and renewing of the world; so that upon this extraordinary occasion and urgent necessity, it cannot be gathered what was the ordinary food of beasts before, no more than it can be inferred, that because beasts of contrary natures, as the lion and calf, bear and cow, wolf and lamb, leopard and kid, did lie together, Isa. 11:6, that there was no enmity between them before. To the second place: Our answer is that there that liberty is only renewed, as is the blessing to increase and multiply, verse 1, and the prohibition of shedding mans blood: verse 5, at the hands of a man’s brother will I require the life of man: for before the Flood, the blood of Abel was required at the hands of his brother Cain. Notwithstanding therefore these objections, I think it more probable that both man and beast after the transgression, before the Flood, did use indifferently both the fruits of the earth and the flesh of beasts for food: the grounds of this opinion are these:

1. That one beast did not raven upon another in the state of man’s innocency, two principal reasons may be given: one, because as yet no death was entered into the world; the other, for that man bearing perfect rule and dominion over the creatures, did keep them in order: but after man’s fall, both these causes were taken away; for not only death entred upon man, but the other creatures were brought into the same bondage, and were killed for sacrifice: as Abel offered of the fat of the sheep, Gen. 4:3; if it were lawfull then to slay beasts, why not to eat of their flesh? And againe, man having lost his soveraignty over the creatures, they then began one to rage upon another, as not standing now in the like awe and fear of man as before: this cause is touched by the prophet, Habakkuk 1:14, ‘Thou makest man as the fishes of the sea, and as the creeping things that have no rule over them:’ that is, which do one consume and devour another, because they have no governor: this rule the beasts, fishes and fowls had shaken off immediately upon man’s Fall, and not only after the Flood.

2. Seeing in the old world two great sins abounded, carnal lust, and concupiscence, Gen. 6:2, and tyranny and oppression: verse 4, there were giants or tyrants in the earth: and tyranny and oppression brought forth bloodshed; for which cause the prohibition of shedding of man’s blood is so straightly forbidden after the flood, that God will require it at the hands of every beast, and of a man’s brother, Gen. 9:5. How is it like, that they would abstain from killing of beasts, that spared not to spill the blood of men? or from eating of flesh, which is more apt to provoke unto lust than the simple fruits of the earth?

3. If the flesh of beasts was not eaten before the Flood, what then became of the increase of cattle? How was not the earth overrun with them? This reason was given, why the Lord would not at once but by little and little destroy the Canaanites before the Israelites, lest the beasts of the field should increase upon them, Dt. 7:22, because they both helped to destroy the cruel beasts, and did eat the unclean, as swine and such other, both which by their multitudes otherwise might have been an annoyance to the Israelites. But greater fear was there of overspreading the earth with increase of beasts before the Flood, if no such provision had been made to diminish their number.

4. But that place most of all confirms our opinion, Gen. 7:2, where mention is made of clean and unclean beasts: which difference was observed before the Flood, and continued by tradition; not in regard only of sacrifice, but also for their eating, as it may appear in the reviving of this law afterward, Lev. 11:47. That there may be difference between the unclean and clean, and between the beast that may be eaten, and the beast that may not be eaten: that then is said by the definition of the law to be a clean beast, that might be eaten, that unclean, that might not be eaten. So I conclude this question with the sentence of Ambrose, Quico•vivium adornat, etc. ‘He that prepares a feast, does kill his oxen and fat cattle before, and then bids his guests: so the Lord,’ ante homini caeterorum animalium praeparavit epulas, ‘before prepared the meats of other beasts, and then as his friend’ invitavit ad convivium, ‘bid him to the banquet,’ Epistle 37. His opinion is that the cattle were provided of God to be meat for man. Mercerus is of another judgement, that the eating of flesh was generally forborn before the Flood, which is also the opinion of the Hebrews: 1. both because it was necessary for the preservation of the kinds of cattle: 2. as also herbs being then of greater virtue and strength before the Flood and after, might suffice for man’s sustenance. Mercer, on Gen. 1:29. But these reasons conclude not.

1. Like as after the Flood, when liberty was granted to eat flesh, as the green herb, yet they did forbear for a time, till the breed of cattle was increased, upon the like reason before the Flood, immediately after the creation, they might abstain for a time from the eating of flesh, but not altogether.

2. The great virtue and strength of herbs concludes that the eating of flesh was not so general, or necessary, then as afterward, but the whole abstinence from all kind of eating of flesh, it concludes not. I rather prefer [Wolfgang] Musculus’s opinion, who upon the sacrificing of beasts and wearing of their skins, infers that beasts were killed before the Flood, and consequently their flesh eaten, in Gen. 1:29.</p></blockquote>

ture%3A+First%2C+for+that+the+beasts+and+fowls+lived+in+the+ark%2C+not+of+flesh%2C+but+of+other+food+than+usual%2C+as+Noah+is+bidden+to+take+of+all+meat+that+was+eaten%2C+Gen.+6%3A21%2C+for+there+being+only+one+couple+of+unclean+beasts%2C+and+seven+couple+of+clean+preserved+in+the+ark%3A+out+of+these+there+could+not+be+food+of+flesh+sufficient+for+the+rest%3A+and+after+the+cattle+went+out+of+the+ark%2C+there+was+no+other+food+for+them%2C+all+flesh+being+destroyed%2C+but+only+by+the+fruits+of+the+earth.+Secondly%2C+the+first+permission+to+eat+flesh+that+we+read+of+was+after+the+flood%2C+Gen.+9%3A3.+Everything+that+moves+and+liveth+shall+be+meat+for+you+as+the+greene+herb.+But+these+objections+may+be+easily+answered.+To+the+first+we+answer%3A+1.+That+the+beasts+which+did+devour+flesh%2C+did+also+feed+of+herbs%3A+and+so+Noah+might+provide+for+them+according+to+their+eating%3A+Though+they+did+use+altogether+to+live+of+flesh%2C+yet+I+think+that+for+that+present+time%2C+and+some+while+after%2C+all+beasts+might+return+to+the+first+food+appointed+in+the+creation%2C+this+being+a+second+creation+and+renewing+of+the+world%3B+so+that+upon+this+extraordinary+occasion+and+urgent+necessity%2C+it+cannot+be+gathered+what+was+the+ordinary+food+of+beasts+before%2C+no+more+than+it+can+be+inferred%2C+that+because+beasts+of+contrary+natures%2C+as+the+lion+and+calf%2C+bear+and+cow%2C+wolf+and+lamb%2C+leopard+and+kid%2C+did+lie+together%2C+Isa.+11%3A6%2C+that+there+was+no+enmity+between+them+before.+To+the+second+place%3A+Our+answer+is+that+there+that+liberty+is+only+renewed%2C+as+is+the+blessing+to+increase+and+multiply%2C+verse+1%2C+and+the+prohibition+of+shedding+mans+blood%3A+verse+5%2C+at+the+hands+of+a+man%E2%80%99s+brother+will+I+require+the+life+of+man%3A+for+before+the+Flood%2C+the+blood+of+Abel+was+required+at+the+hands+of+his+brother+Cain.+Notwithstanding+therefore+these+objections%2C+I+think+it+more+probable+that+both+man+and+beast+after+the+transgression%2C+before+the+Flood%2C+did+use+indifferently+both+the+fruits+of+the+earth+and+the+flesh+of+beasts+for+food%3A+the+grounds+of+this+opinion+are+these%3A+1.+That+one+beast+did+not+raven+upon+another+in+the+state+of+man%E2%80%99s+innocency%2C+two+principal+reasons+may+be+given%3A+one%2C+because+as+yet+no+death+was+entered+into+the+world%3B+the+other%2C+for+that+man+bearing+perfect+rule+and+dominion+over+the+creatures%2C+did+keep+them+in+order%3A+but+after+man%E2%80%99s+fall%2C+both+these+causes+were+taken+away%3B+for+not+only+death+entred+upon+man%2C+but+the+other+creatures+were+brought+into+the+same+bondage%2C+and+were+killed+for+sacrifice%3A+as+Abel+offered+of+the+fat+of+the+sheep%2C+Gen.+4%3A3%3B+if+it+were+lawfull+then+to+slay+beasts%2C+why+not+to+eat+of+their+flesh%3F+And+againe%2C+man+having+lost+his+soveraignty+over+the+creatures%2C+they+then+began+one+to+rage+upon+another%2C+as+not+standing+now+in+the+like+awe+and+fear+of+man+as+before%3A+this+cause+is+touched+by+the+prophet%2C+Habakkuk+1%3A14%2C+%E2%80%98Thou+makest+man+as+the+fishes+of+the+sea%2C+and+as+the+creeping+things+that+have+no+rule+over+them%3A%E2%80%99+that+is%2C+which+do+one+consume+and+devour+another%2C+because+they+have+no+governor%3A+this+rule+the+beasts%2C+fishes+and+fowls+had+shaken+off+immediately+upon+man%E2%80%99s+Fall%2C+and+not+only+after+the+Flood.+2.+Seeing+in+the+old+world+two+great+sins+abounded%2C+carnal+lust%2C+and+concupiscence%2C+Gen.+6%3A2%2C+and+tyranny+and+oppression%3A+verse+4%2C+there+were+giants+or+tyrants+in+the+earth%3A+and+tyranny+and+oppression+brought+forth+bloodshed%3B+for+which+cause+the+prohibition+of+shedding+of+man%E2%80%99s+blood+is+so+straightly+forbidden+after+the+flood%2C+that+God+will+require+it+at+the+hands+of+every+beast%2C+and+of+a+man%E2%80%99s+brother%2C+Gen.+9%3A5.+How+is+it+like%2C+that+they+would+abstain+from+killing+of+beasts%2C+that+spared+not+to+spill+the+blood+of+men%3F+or+from+eating+of+flesh%2C+which+is+more+apt+to+provoke+unto+lust+than+the+simple+fruits+of+the+earth%3F+3.+If+the+flesh+of+beasts+was+not+eaten+before+the+Flood%2C+what+then+became+of+the+increase+of+cattle%3F+How+was+not+the+earth+overrun+with+them%3F+This+reason+was+given%2C+why+the+Lord+would+not+at+once+but+by+little+and+little+destroy+the+Canaanites+before+the+Israelites%2C+lest+the+beasts+of+the+field+should+increase+upon+them%2C+Dt.+7%3A22%2C+because+they+both+helped+to+destroy+the+cruel+beasts%2C+and+did+eat+the+unclean%2C+as+swine+and+such+other%2C+both+which+by+their+multitudes+otherwise+might+have+been+an+annoyance+to+the+Israelites.+But+greater+fear+was+there+of+overspreading+the+earth+with+increase+of+beasts+before+the+Flood%2C+if+no+such+provision+had+been+made+to+diminish+their+number.+4.+But+that+place+most+of+all+confirms+our+opinion%2C+Gen.+7%3A2%2C+where+mention+is+made+of+clean+and+unclean+beasts%3A+which+difference+was+observed+before+the+Flood%2C+and+continued+by+tradition%3B+not+in+regard+only+of+sacrifice%2C+but+also+for+their+eating%2C+as+it+may+appear+in+the+reviving+of+this+law+afterward%2C+Lev.+11%3A47.+That+there+may+be+difference+between+the+unclean+and+clean%2C+and+between+the+beast+that+may+be+eaten%2C+and+the+beast+that+may+not+be+eaten%3A+that+then+is+said+by+the+definition+of+the+law+to+be+a+clean+beast%2C+that+might+be+eaten%2C+that+unclean%2C+that+might+not+be+eaten.+So+I+conclude+this+question+with+the+sentence+of+Ambrose%2C+Quico%E2%80%A2vivium+adornat%2C+etc.+%E2%80%98He+that+prepares+a+feast%2C+does+kill+his+oxen+and+fat+cattle+before%2C+and+then+bids+his+guests%3A+so+the+Lord%2C%E2%80%99+ante+homini+caeterorum+animalium+praeparavit+epulas%2C+%E2%80%98before+prepared+the+meats+of+other+beasts%2C+and+then+as+his+friend%E2%80%99+invitavit+ad+convivium%2C+%E2%80%98bid+him+to+the+banquet%2C%E2%80%99+Epistle+37.+His+opinion+is+that+the+cattle+were+provided+of+God+to+be+meat+for+man.+Mercerus+is+of+another+judgement%2C+that+the+eating+of+flesh+was+generally+forborn+before+the+Flood%2C+which+is+also+the+opinion+of+the+Hebrews%3A+1.+both+because+it+was+necessary+for+the+preservation+of+the+kinds+of+cattle%3A+2.+as+also+herbs+being+then+of+greater+virtue+and+strength+before+the+Flood+and+after%2C+might+suffice+for+man%E2%80%99s+sustenance.+Mercer%2C+on+Gen.+1%3A29.+But+these+reasons+conclude+not.+1.+Like+as+after+the+Flood%2C+when+liberty+was+granted+to+eat+flesh%2C+as+the+green+herb%2C+yet+they+did+forbear+for+a+time%2C+till+the+breed+of+cattle+was+increased%2C+upon+the+like+reason+before+the+Flood%2C+immediately+after+the+creation%2C+they+might+abstain+for+a+time+from+the+eating+of+flesh%2C+but+not+altogether.+2.+The+great+virtue+and+strength+of+herbs+concludes+that+the+eating+of+flesh+was+not+so+general%2C+or+necessary%2C+then+as+afterward%2C+but+the+whole+abstinence+from+all+kind+of+eating+of+flesh%2C+it+concludes+not.+I+rather+prefer+%5BWolfgang%5D+Musculus%E2%80%99s+opinion%2C+who+upon+the+sacrificing+of+beasts+and+wearing+of+their+skins%2C+infers+that+beasts+were+killed+before+the+Flood%2C+and+consequently+their+flesh+eaten%2C+in+Gen.+1%3A29.%E2%80%9D%0A%0A%E2%80%94+Andrew+Willet%2C+A+Sixfold+Commentary+upon+the+Two+first+Books+of+Moses%2C+being+Genesis%2C+%E2%80%A6+%28d.+1621%3B+1633%29%2C+ch.+1%2C+question+35%2C+%E2%80%98Whether+the+flesh+of+beasts+were+eaten+before+the+flood%E2%80%99%2C+pp.+14-15&amp;url=https%3A%2F%2F5solasquotes.github.io%2Fquote%2Fbdc5ffc7c1.html&amp;via=5Solas" target="_blank" rel="noopener">Share on X</a><a class="perma" href="../quote/bdc5ffc7c1.html">Permalink</a><a class="src" href="https://reformedbooksonline.com/on-mans-original-state-in-righteousness/#:~:text=LIkewise%20we%20refuse%20the%20opinion%20of,their%20flesh%20eaten%2C%20in%20Gen.%201%3A29&amp;text=LIkewise%20we%20refuse%20the%20opinion%20of%20Beda%2C%20that&amp;text=and%20consequently%20their%20flesh%20eaten%2C%20in%20Gen.%201%3A29" rel="noopener" target="_blank">Read it online · Reformed Books Online</a></div>

<blockquote><p>V… This naturally raises the question: Did the first man have the potential to believe in Christ? The answer, affirming against Socinians and Remonstrants, is yes. His mind was adorned with clarity, and his will with sanctity, which could have produced faith in Christ if Christ had been revealed to him as an object, which was possible. Even Adam’s faith in God did not differ essentially from ours but only in its special object; this difference does not alter the nature of faith but confirms it, much like certain precepts of the law aligned with the Gospel in their broader sense. An objection arises: Could Adam have believed in Christ at some point, which seems absurd? The response distinguishes between potential as cause and potential as effect. In the former, considered in a divided sense regarding the simultaneity of potentials, he could have; but in the latter, in a composed sense regarding the simultaneity of action (κρινόμενον), he could not have immediately believed that Christ’s righteousness would be imputed to him because his state and its economy (οἰκονομία) did not allow it. This follows no more than arguing from God’s absolute potential to its actual exercise under His decree. Thus, from these considerations, we conclude that faith in Christ could justly be demanded from us under the first covenant [i.e. of Works], even though we are utterly powerless. Furthermore, in his will, a second kind of soul’s life shone without blemish, more admirable than any star. The will could righteously bear whatever the divinely illuminated practical intellect had judged and approved, and thus we consider that the free will of that state must be regarded in the moral sense.</p></blockquote>

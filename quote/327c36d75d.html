<main class="wrap"><figure class="quote" id="q-327c36d75d" data-kw="">
<blockquote><p>Thesis 3. Many, being scrupulous, have erred with the term “predestination,” arguing it denotes election alone and is spoken just about good things—this despite the fact the Holy Spirit used the same term in speaking about evil things (Acts 4:23). This is because predestination of a thing is the determination of it to its end. But these people deny this is the sort of end that is the destruction of the reprobate (seeing that such is an evil thing) and further that the term “predestination” is applied wrongly to them. Answer. Though we concede it is indeed an evil thing with respect to those reprobate, still, with respect to God reprobating, which is their final destruction or end, he without doubt intends the declaration of his righteousness and power (Prov. 16:4; Rom. 9:17, 21–22). …

Thesis 8. The means tending to this end are effectual calling, justification, and sanctification, and the opposite for the reprobate: the privation of effectual grace, continuation in the state of condemnation, and just blinding and hardening, all which presuppose the Fall and condition of sin. We will deal with all this further in what follows.

Thesis 9. So, our adversaries charge us falsely that we establish predestination absolute in every way, because we say it is only absolute with respect to the impelling cause existing in man, or a cause differing from God’s good pleasure. This is because, if it were some impulsive cause that moved God toward this or that thing about to be done, thus God would be the cause who depends with respect to that cause by which he is moved. This is absurd. Furthermore, predestination is not absolutized from the end and means (as is clear in the preceding thoughts), because God, absolutely wise, wills nothing without an end. So he decreed to render sinners saved, so that he might manifest his grace in them with respect to his mercy, but to condemn the reprobate, so that he might manifest his glory in them under the concept of his justice. Nothing is without means. Thus, he decreed to save the faithful, but through and on account of Christ; and he decreed to condemn the reprobate, but on account of sins.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/johannes-maccovius.html">Johannes Maccovius</a></span><span class="wk"><span class="lbl">Work:</span> <cite>‘The Theological Disputation De Divina Hominum Praedestinatione</cite>, (1643), with Johannes Maccovius Presiding and Johannes Fridericus Herbst Responding’, trans. R. M. Hurd in Mid-America Journal of Theology, no. 30 (2019), pp 89, 90.</span></figcaption>

</figure><figure class="quote" id="q-06f4f04b52" data-kw="">
<blockquote><p>The Church of England believeth, that Predestination unto life is the eternal purpose of God, whereby before the foundations of the world were laid, he constantly decreed by his counsel unto us unknown to deliver from the curse &amp; destruction them whom he chose in Christ out of mankind, &amp; (as vessels made unto honour) through Christ to bring them to eternal salvation. Whereupon they who are endowed with so excellent benefit of God, are called according to his purpose, and that by his spirit working in a fit time.

But you Mai. [Richard] Hoo[ker]. seem to vs, to affirm contrary, when you say: If any man doubt how God should accept such prayers in case they be opposite to his will, or not grant them, if they be according to that him self willeth: Our answer is, that such suits God accepteth, in that they are conformable to his general inclination, which is that all men might be saved: yet always he granteth them not, for so much as there is in God a more private occasioned will, which determineth the contrary. Here we beg your aide to make manifest unto us, how God eternally predestinateth by a constant decree, them whom he calleth and saveth (as our Church professeth) and yet hath, as you say, a general inclination that all men might be saved:

Whether he foresaw not something that occasioned his will otherwise; so that he elected not all, but only them whom he calleth and saveth, or that of his general inclination he elected all men, but some more privately occasioned him in time to alter his will, and to refuse them; or that some men gave God occasion that he saveth them, though he never decreed it before the foundations of the world. What meant the blessed Apostle where he sayeth: Whom he predestinated them also he called: and whom he called them also he justified. &amp;c.

Is this to be understood of a constant decree, as we say, or of an inclination? He sayeth: God worketh all things after the counsel of his own will. Is this to be understood, that upon occasion sometimes he either altereth his counsel, or decreeth something which he had not thought upon before. Saint James saith, that in God there is no variableness nor shadow of turning. Is not this more then a variableness or shadow of turning to incline one way, and upon occasion to decree another.

Do not these words of yours give some place unto chance and fortune: Do they not make GOD as a man not of an all-sufficient knowledge, wisdom, and counsel, but inclinable some one way, till by occasion he find a more better way. Where is that God you speak of in your first book, of whom and through whom and for whom are all things. And where is that law by which he worketh, which you there call aeternall, and therefore can have no shew or colour of mutability.

Have we not cause to fear that the witty schoolmen have seduced you, and by their conceited distinctions made you forget, That you are neither able nor worthy to open and look into the book of God’s law, by which he guideth the world. And yet you will say, There is in God an occasioned will. Good Mai. Hoo[ker]. help us here, and shew us how we may think, that you incline not to the error of popery touching works foreseen, and that you favour our church’s belief.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/andrew-willet.html">Andrew Willet</a></span><span class="wk"><span class="lbl">Work:</span> <cite>A Christian letter of certain English protestants, unfained favourers of the present state of religion, authorised and professed in England: unto that reverend and learned man, Mr R. Hoo[ker] requiring resolution in certain matters of doctrine (which seem to overthrow the foundation of Christian rel</cite>, (Middelburg: Richard Schilders, 1599), pp 15-17.</span></figcaption>

ivately+occasioned+him+in+time+to+alter+his+will%2C+and+to+refuse+them%3B+or+that+some+men+gave+God+occasion+that+he+saveth+them%2C+though+he+never+decreed+it+before+the+foundations+of+the+world.+What+meant+the+blessed+Apostle+where+he+sayeth%3A+Whom+he+predestinated+them+also+he+called%3A+and+whom+he+called+them+also+he+justified.+%26c.%0A%0AIs+this+to+be+understood+of+a+constant+decree%2C+as+we+say%2C+or+of+an+inclination%3F+He+sayeth%3A+God+worketh+all+things+after+the+counsel+of+his+own+will.+Is+this+to+be+understood%2C+that+upon+occasion+sometimes+he+either+altereth+his+counsel%2C+or+decreeth+something+which+he+had+not+thought+upon+before.+Saint+James+saith%2C+that+in+God+there+is+no+variableness+nor+shadow+of+turning.+Is+not+this+more+then+a+variableness+or+shadow+of+turning+to+incline+one+way%2C+and+upon+occasion+to+decree+another.%0A%0ADo+not+these+words+of+yours+give+some+place+unto+chance+and+fortune%3A+Do+they+not+make+GOD+as+a+man+not+of+an+all-sufficient+knowledge%2C+wisdom%2C+and+counsel%2C+but+inclinable+some+one+way%2C+till+by+occasion+he+find+a+more+better+way.+Where+is+that+God+you+speak+of+in+your+first+book%2C+of+whom+and+through+whom+and+for+whom+are+all+things.+And+where+is+that+law+by+which+he+worketh%2C+which+you+there+call+aeternall%2C+and+therefore+can+have+no+shew+or+colour+of+mutability.%0A%0AHave+we+not+cause+to+fear+that+the+witty+schoolmen+have+seduced+you%2C+and+by+their+conceited+distinctions+made+you+forget%2C+That+you+are+neither+able+nor+worthy+to+open+and+look+into+the+book+of+God%E2%80%99s+law%2C+by+which+he+guideth+the+world.+And+yet+you+will+say%2C+There+is+in+God+an+occasioned+will.+Good+Mai.+Hoo%5Bker%5D.+help+us+here%2C+and+shew+us+how+we+may+think%2C+that+you+incline+not+to+the+error+of+popery+touching+works+foreseen%2C+and+that+you+favour+our+church%E2%80%99s+belief.%E2%80%9D%0A%0A%E2%80%94+Andrew+Willet%2C+A+Christian+letter+of+certain+English+protestants%2C+unfained+favourers+of+the+present+state+of+religion%2C+authorised+and+professed+in+England%3A+unto+that+reverend+and+learned+man%2C+Mr+R.+Hoo%5Bker%5D+requiring+resolution+in+certain+matters+of+doctrine+%28which+seem+to+overthrow+the+foundation+of+Christian+rel%2C+%28Middelburg%3A+Richard+Schilders%2C+1599%29%2C+pp+15-17.&amp;url=https%3A%2F%2F5solasquotes.github.io%2Fquote%2F06f4f04b52.html&amp;via=5Solas" target="_blank" rel="noopener">Share on X</a><a class="perma" href="../quote/06f4f04b52.html">Permalink</a><a class="src" href="https://reformedcovenanter.wordpress.com/2020/01/19/andrew-willet-on-the-incongruence-of-the-well-meant-offer-with-predestination/" rel="noopener" target="_blank">Read it online · Reformed Covenanter</a></div>

<blockquote><p>Lordship is God’s having absolute right and power to, and over all his creatures, and disposing thereof according to his will, 1 Sam. 3:18; 1 Tim. 6:13; Mt. 20:15; Dan. 4:25. Absolute Soveraignty is due unto God by four titles: Of Creation, Rom. 9:20; Of Conservation, Heb. 1:3; To give the creature to continue in being is more than merely to give it being: as the shadow depends upon the body, so the creature depends upon the Creator. Of Redemption, 1 Cor. 6:20; this exceeds both the former. Of the Last End, Prov. 16:4. The end of the creature is the manifestation of the glory of the Creator. Lordship is in God after the most eminent manner: He has subjects of Himself, authority of Himself, Legislative Power of Himself. He appoints the rule with recompence to the obedient, and punishment to the disobedient according to his mere good pleasure. He is his own rule, his will is the most absolute reason. He gives no account of his matters, Job 33:13. Every creature depends essentially and universally upon the Creator: that is, the creature cannot be, but it must be at the disposing of God. We do not acknowledge ourselves to be creatures, nor God to be Lord, if his pleasure be not acknowledged to be a sufficient and satisfactory reason, of whatsoever He does. The Lordship of God is of Himself, not by occupation, as a title of property arising from a thing found without an owner; nor by donation, succession, purchase or conquest, as created lordships are. All created jurisdiction descends from this absolute Lordship of God. The jurisdiction that Christ as man received from God is universal over all the creatures respectively, Mt. 28:18. The jurisdiction of other men is limited according to the several objects thereof: whether ecclesiastical, where their authority and office is immediately received from Christ though the designation of such persons to such offices be by the call of men. Or civil, whether natural, as parent, and child: Or voluntary, as magistrate and subject.</p></blockquote>

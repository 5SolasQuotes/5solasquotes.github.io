<blockquote><p>I hope hereafter I may (after Chamier and Maccovius) affirm that faith in Christ essentially contains love to Christ, and that love to Christ justifies, as faith does, without the terrible charge of asserting an almost Socinian faith and justification.</p></blockquote>

</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-744915c510" data-kw="">
<blockquote><p>But now comes a greater question: If by justification our sins be forgiven us, what sins are forgiven I pray? sins past, or sins to come? We are taught that in the instant of justification all our sins past and to come are remitted; which is in my mind an unsound doctrine: for if we look narrowly into it, we shall find that in propriety of speech, remission of sins has relation to that which is past; it’s said therefore, Rom. 3:25: ‘Whom God hath set forth to be a propitiation through faith in his blood, to declare his righteousness for the remission of sins that are past through the forbearance of God.’ And remission of sins has relation to those that are past, as appears by inevitable reason; for what is remission of sins, but sin covered? Now can a thing be covered before it be? ‘Blot out mine iniquities,’ etc. says David; can a thing be blotted out before it’s written? This is the thing [that] makes the Pope so ridiculous, that he will forgive sins for the time before they are committed; but what, do we get nothing for the time to come? Yes, yes, when the sin is past, by faith we have a new access unto God; and having risen by repentance, we get a new act, not of universal justification, but of a particular justification, from this and that particular sin. But if there be forgiveness of sins past already, and I know that I am justified, and my sins remitted: may I now pray for forgiveness of sins past? The Papists say it is active infidelity, and as absurd as to pray to God to create the world anew, or incarnate his Son again. But there is no conversion where there is no praying; and there is need of praying for the remission of sins past, and against sin for the time to come, as I shall show next time; as also consider whether there be any interruption of the act of justification by falling into great sins. There’s no man has a mind more against quirks and quillets than I; yet for the opening of these things, and staying and settling the mind, and clearing the understanding, give me leave the next time to clear these things unto you.</p></blockquote>

</figure><figure class="quote" id="q-ce0092075d" data-kw="">
<blockquote><p>Objection. In the same way as Abraham was justified, so also are we justified, as children of Abraham. But Abraham was not justified by faith alone, but also by works, as the apostle James testifies (Jm. 2:21). Response. A person is said to be justified either before himself and in his conscience, or before God. Abraham was not justified before himself and in his conscience by faith alone, but also by works—I grant it. He was not justified by faith alone before God—I deny it. I explain: a godly person sometimes doubts whether he is among those who are justified; that is, he acknowledges indeed that he must be justified by true faith, but doubts whether his faith is true. This, however, he discovers and recognizes from the warmth of faith, namely charity. James does not treat of that justification which is before the tribunal of God, but of that by which we are justified in our own conscience, when our righteousness is made evident to us. Therefore, we are justified—that is, our righteousness is made manifest to us—not only by faith but also by good works, insofar as they are evidences of sincere faith; but we are not thus justified before God, who regards faith alone.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/john-cameron.html">John Cameron</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Works</cite>, … (d. 1625; Geneva: Chovet, 1658), Arguments Proposed in Disputation against the Preceding Theses, with Solutions, To Corollary V, pp. 364-65, trans. ChatGPT-5</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/justification/nature-of-justification.html">Nature of Justification</a></span><span class="t"><a href="../topics/judgment-and-the-final-state/the-last-judgment.html">The Last Judgment</a></span></div>

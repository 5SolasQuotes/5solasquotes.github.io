<main class="wrap"><figure class="quote" id="q-b38788c2a6" data-kw="">
<blockquote><p>[M]odern pedagogy has emancipated us, whether we be in the pulpit or in the professor’s chair or in the pew, from anything so irksome as earnest labor in the acquisition of knowledge. It never seems to occur to many modern teachers that the primary business of the teacher is to study the subject that he is going to teach. Instead of studying the subject that he is going to teach, he studies “education”; a knowledge of the methodology of teaching takes the place of a knowledge of the particular branch of literature, history or science to which a man has devoted his life. This substitution of methodology for content in the preparation of the teacher is based upon a particular view of what education is. It is based upon the view that education consists primarily, not in the imparting of information, but in a training of the faculties of the child; that the business of the teacher is not to teach, but to develop in the child a faculty which will enable the child to learn.

This child-centred notion of education seems to involve emancipation from a vast amount of drudgery. It used to be thought necessary to do some hard work at school. When a textbook was given to a class, it was expected that the contents of the textbook should be mastered. But now all that has been changed. Storing up facts in the mind was a long and painful process, and it is indeed comforting to know that we can now do without it. Away with all drudgery and all hard work! Self-expression has taken their place, A great pedagogic discovery has been made the discovery that it is possible to think with a completely empty mind.

It cannot be said that the results of the discovery are impressive. This child-centred notion of education has resulted, particularly in America, where it has been most ruthlessly applied, in a boundless superficiality of which. we Americans certainly have little reason to be proud; but it has probably not been confined to America by any means. I wonder when the reaction will come. I wonder when we shall have that revival of learning which we so much need, and which I verily believe might be, in the providence of God, as was the Renaissance of the fifteenth century, the precursor of a Reformation in the Church.

When that revival of learning comes, we may be sure that it will sweep away the present absurd over-emphasis upon methodology in teaching at the expense of content. We shall never have a true revival of learning until teachers turn their attention away from the mere mental processes of the child out into the marvelous richness and variety of the universe and of human life. Not teachers who have studied the methodology of teaching, but teachers who are on fire with a love of the subjects that they are going to teach are the real torch-bearers of intellectual advance.</p></blockquote>

<blockquote><p>Q. 7. Are all the laws of God mentioned in scripture, of binding force now under the New Testament?

<blockquote><p>XIII. The glory of God, the good of souls, the happiness of Christian societies, are irresistible motives to quicken the magistrate to act (against such dangerous persons as we have described according to the law of judgement, and their different demerits) in Faith and Love:

      1. In Faith; for the Christian magistrate does not act like himself, if he does not perform acts of civil-justice in faith. And it is clear that if there be no moral equity in any of the judicial laws in the Old Testament (and there are none at all extant in the New) [then] the Christian magistrate cannot perform any act of Civil-justice in faith. But it is indeed too evident to be denied that all divine laws which concern the punishment of moral transgressions are of perpetual obligation, and therefore still remain in force according to their substance and general equity, abstracted from special circumstances, typical accessories and the old forms of Mosaical polity, for:

      1. These divine laws are not expired in their own nature.

      2. They are not repealed by God.

      3. The authority of the Lawgiver is the same under both administrations, old and new; the consciences of Christians as well as Jews are subject to his sovereign and perpetual jurisdiction.

      4. The matter of the laws is moral, and very agreeable to the dictates of nature, as does appear by the several laws and decrees of heathens: Dan. 3:29; Ezra. 7:23,25-27; Ezra 10:3,5,8 compared with Num. 15:30-31; Lev. 24:15-16; Deut. 13:8-9; Zech. 13:3,6. Seducing, poisoning, slaying of souls is by the law of Nature and Nations the worst of injuries.

      5. The reason of these divine laws is immutable, and that reason is sometimes expressed and declared: But it is not necessary that there should be any express ratification of every moral law in the New Testament which is plainly delivered in the Old.

      6. These divine laws are independent on the will of man, and therefore indispensable man’s authority.</p></blockquote>

<blockquote><p>For the words themselves, ‘Honor the King’, I have already spoken at large of the duty contained herein: Know we only, that by the King here, is meant Caesar, who was a heathen emperor, one that intruded himself, ruled tyrannously, and was an idolater… … Under this honor is understood, the inward reverence in heart to be declared outwardly by obedience to all their godly commandments, cheerfulness in payments, prayer and thanksgiving, etc. Now if all this be due to a wicked King, as here, and now to be performed of us, if we had a wicked king, what then is to be done of us to such a king as God has bestowed on us?</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/john-rogers.html">John Rogers</a></span><span class="wk"><span class="lbl">Work:</span> <cite>A Godly and Fruitful Exposition upon all the First Epistle of Peter</cite>, (d. 1636; 1650) | On 1 Tim., 2:17</span></figcaption>

<blockquote><p>About the middle of August [1665] I set myself to write a short exhortation to those who were shut up because of the plague, and just when I had finished it, heard the melancholy news of my father’s death, on the 16th; upon which I wrote a letter to comfort my mother, wherewith I much comforted myself; and on the 24th sent abroad my little exhortation to those who were shut up, beseeching God that it might do good to all. And on the 30th I thought of writing a little treatise of comfort in this sad time, which I finished and sent to my bookseller September the first, praying the blessing of Heaven might attend upon these my little labors for the good of souls.” – Autobiography Grosvenor, Benjamin – Preparation for Death, the Best Preservative Against the Plague, being the substance of 2 Sermons (London, 1721) Grosvenor (1676–1758) was originally an English, primitive baptist, but was excommunicated when he became a presbyterian. He then served as a dissenting presbyterian minister and was a ‘moderate Calvinist’. From 1720-22 there were plagues in France (the Great Plague of Marseille) and in New England. England prepared for it, but apparently never got it. Barnard, John – ‘2nd Sermon, The Fatal Consequence of a People’s Persisting in Sin: Preached… on a Public Fast in the Time of the Measles, Jan, 14, 1713/14’ in Two Sermons: The Christian’s Behavior under Severe and Repeated Bereavements, and The Fatal Consequence of a Peoples Persisting in Sin (Boston, 1714) Clarke, Samuel – Sermons 7-9 in XVII sermons on several occasions… (London, 1724) on Isa. 26:9; Lk. 13:2-3 &amp; Mt. 24:7 Clarke (1675-1729) was a latitudinarian, Anglican clergyman and English philosopher. He is considered the major British figure in philosophy between John Locke and George Berkeley. Emerson, Joseph – ‘A Word to those that are Afflicted very much; Mr. Emerson’s sermon on the mortal sickness at Malden; Essay to preserve the memory, and improve the affliction, of the late mortal sickness at Malden; a sermon preached at the lecture in Malden, October 20th 1738, on occasion of the repeated and multiplied deaths of children in many families in said town, by the throat distemper’ (Boston, 1738) . American Presbyterians Davies, Samuel – ‘This Very Year You Are Going to Die!’ (1761) A sermon on Jer. 28:16, “This year thou shalt die.</p></blockquote>

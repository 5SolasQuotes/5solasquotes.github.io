<blockquote><p>…and if Brownism be a bitter error and way, then the way of the Apologists [who are congregationalists] is not very sweet, their way being but Brown’s younger brother, agreeing with the Brownists in the nature and definition of the visible Church, in the independent power of a particular congregation, in the way of making officers, in the way of their ordinances, as prophesying, in the way of forms of prayer, in the sacraments, none to be admitted but church members, cum multis alijs [with many other things], and I desire the Apologists to give any material difference (however their grounds are different, and they do not go so far in consequences, nor are not so gross) between their churches and the Brownists:</p></blockquote>

<blockquote><p>And thirdly, see God making room for us [the New England colony from old England] by some lawful means. But how shall I know whether God has appointed me such a place, if I be well where I am, what may warrant my removal? There be four or five good things, for procurement of any of which I may remove. Secondly, there be some evil things, for avoiding of any of which we may transplant ourselves. Thirdly, if withal we find some special providence of God concurring in either of both concerning ourselves, and applying [in] general grounds of removal to our personal estate. First, we may remove for the gaining of knowledge. Our Saviour commends it in the queen of the South, that she came from the utmost parts of the earth to hear the wisdom of Salomon: Mt. 12:42. And surely with him she might have continued for the same end, if her personal calling had not recalled her home. Secondly, some remove and travail for merchandise and gain-sake; Daily bread may be sought from far, Prov. 31:14. Yea our Savior approves travail for merchants, Mt. 13:45-46, when He compares a Christian to a merchantman seeking pearls: For He never fetches a comparison from any unlawful thing to illustrate a thing lawful. The comparison from the unjust steward, and from the thiefe in the night is not taken from the injustice of the one, or the theft of the other; but from the wisdom of the one, and the suddenness of the other; which in themselves are not unlawful. Thirdly, to plant a colony, that is, a company that agree together to remove out of their own country, and settle a city or commonwealth elsewhere. Of such a colony we read in Acts 16:12 [of Philippi], which God blessed and prospered exceedingly and made it a glorious Church. Nature teaches bees to do so when as the hive is too full, they seek abroad for new dwellings: So when the hive of the commonwealth is so full that tradesmen cannot live one by another, but eat up one another, in this case it is lawful to remove. Fourthly, God allows a man to remove when he may employ his talents and gifts better elsewhere, especially when where he is, he is not bound by any special engagement. Thus God sent Joseph before to preserve the Church: Joseph’s wisdom and spirit was not fit for a shepherd, but for a counselor of state; and therefore God sent him into Egypt. To whom much is given, of him God will require the more: Lk. 12:48. Fifthly, for the liberty of the ordinances, 2 Chron. 11:13-15. When Jeroboam made a desertion from Judah, and set up golden calves to worship, all that were well affected, both priests and people, sold their possessions and came to Jerusalem for the ordinances’ sake. This case was of seasonable use to our fathers in the days of Queen [Bloody] Mary, who removed to France and Germany in the beginning of her reign, upon proclamation of [the] alteration of religion [to Romanism], before any persecution began. Secondly, there be evils to be avoided that may warrant removal: First, when some grievous sins overspread a country that threaten desolation, Mic. 2:6-11: When the people say to them that prophesy, ‘Prophesy not;’ then verse 10, ‘Arise then, this is not your rest.’ Which words though they be a threatening, not a commandment; yet as in a threatning a wise man foresees the plague, so in the threatening he sees a commandment, to hide himself from it. This case might have been of seasonable use unto them of the Palatinate, when they saw their orthodox ministers banished [by Lutherans], although themselves might for a while enjoy liberty of conscience. Secondly, if men be overburdened with debts and miseries, as David’s followers were, they may then retire out of the way (as they retired to David for safety) not to defraud their creditors (for God is an avenger of such things, 1 Thess: 4:6), but to gain further opportunity to discharge their debts and to satisfy their creditors, 1 Sam. 22:1-2. Thirdly, in case of persecution, so did the apostles in Acts 13:46-47. Thirdly, as these general cases, where any of them do fall out, do warrant removal in general: so there be some special providences or particular cases which may give warrant unto such or such a person to transplant himself, and which apply the former general grounds to particular persons. First, if sovereign authority command and encourage such plantations by giving way to subjects to transplant themselves and set up a new commonwealth. This is a lawful and expedient case for such particular persons as be designed and sent: Mt. 8:9, and for such as they, who are sent, have power to command. Secondly, when some special providence of God leads a man unto such a course. This may also single out particulars, Ps. 32:8, ‘I will instruct and guide thee with mine eye.’ As the child knows the pleasure of his father in his eye, so does the child of God see God’s pleasure in the eye of his heavenly Father’s providence. And this is done three ways: First, if God give a man an inclination to this or that course, for that is the spirit of man; and God is the Father of spirits: Heb. 12:9; Rom. 1:12; 1 Cor. 16:12. Paul discerned his calling to go to Rome by his [Greek], his ready inclination to that voyage; and Apollos his loathness to go to Corinth Paul accepted as a just reason of his refusal of a calling to go thither. And this holds, when in a man’s inclination to travail, his heart is set on no by-respects, as to see fashions, to deceive his creditors, to fight duels, or to live idly, these are vain inclinations; but if his heart be inclined upon right judgment to advance the Gospel, to maintain his family, to use his talents fruitfully, or the like good end, this inclination is from God. As the beams of the moon darting into the sea leades it to and fro, so does a secret inclination darted by God into our hearts lead and bow (as a bias) our whole course. Secondly, when God gives other men hearts to call us, as the men of Macedon did Paul, ‘Come to us into Macedonia, and help us.’ When we are invited by others who have a good calling to reside there, we may go with them, unless we be detained by weightier occasions. One member has interest in another, to call to it for help, when it is not diverted by greater employment. Thirdly, there is another providence of God concurring in both these, that is, when a man’s calling and person is free, and not tied by parents, or magistrates, or other people that have interest in him. Or when abroad he may do himself and others more good than he can do at home. Here is then an eye of God that opens a door there, and sets him loose here, inclines his heart that way, and outlooks all difficulties. When God makes room for us, no binding here, and an open way there, in such a case God tells them, He will appoint a place for them. Secondly, this may teach us in every place where God appoints us to sit down, to acknowledge Him as our Landlord. The earth is the Lord’s, and the fulnesse thereof; his are our countries, our towns, our houses; and therefore let us acknowledge Him in them all. The apostle makes this use of it amongst the Athenians, Acts 17:26-27. He has appointed the times and places of our habitation, that we might seek, and grope after the Lord. There is a threefold use that we are to make of it, as it appears there: [First] Let us seek after the Lord, why? Because if thou commest into an house, thou wilt ask for the owner of it: And so if thou come into a foreign land, and there find an house and land provided for thee, wilt thou not inquire, where is the landlord? Where is that God that gave me this house and land? He is missing, and therefore seek after Him. Secondly, thou must feel after Him, grope after Him by such sensible things, strive to attain the favor of your Landlord, and labour to be obedient to Him that has given you such a place. Thirdly, you must labour to find Him in his ordinances, in prayer and in Christian communion. These things I owe Him as my Landlord, and by these I find and enjoy Him. This use the very pagans were to make of their several plantations: And if you knew Him before, seek Him yet more, and feel after Him till you find Him in his ordinances and in your consciences. Thirdly, when you have found God making way and room for you, and carrying you by his providence unto any place, learn to walk thankfully before Him, defraud Him not of his rent, but offer yourselves unto his service: Serve that God and teach your children to serve Him that has appointed you and them the place of your habitation.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/john-cotton.html">John Cotton</a></span><span class="wk"><span class="lbl">Work:</span> <cite>God’s Promise to his Plantation, as it was delivered in a Sermon</cite>, (London, 1630), pp. 8-14</span></figcaption>

+debts+and+miseries%2C+as+David%E2%80%99s+followers+were%2C+they+may+then+retire+out+of+the+way+%28as+they+retired+to+David+for+safety%29+not+to+defraud+their+creditors+%28for+God+is+an+avenger+of+such+things%2C+1+Thess%3A+4%3A6%29%2C+but+to+gain+further+opportunity+to+discharge+their+debts+and+to+satisfy+their+creditors%2C+1+Sam.+22%3A1-2.+Thirdly%2C+in+case+of+persecution%2C+so+did+the+apostles+in+Acts+13%3A46-47.+Thirdly%2C+as+these+general+cases%2C+where+any+of+them+do+fall+out%2C+do+warrant+removal+in+general%3A+so+there+be+some+special+providences+or+particular+cases+which+may+give+warrant+unto+such+or+such+a+person+to+transplant+himself%2C+and+which+apply+the+former+general+grounds+to+particular+persons.+First%2C+if+sovereign+authority+command+and+encourage+such+plantations+by+giving+way+to+subjects+to+transplant+themselves+and+set+up+a+new+commonwealth.+This+is+a+lawful+and+expedient+case+for+such+particular+persons+as+be+designed+and+sent%3A+Mt.+8%3A9%2C+and+for+such+as+they%2C+who+are+sent%2C+have+power+to+command.+Secondly%2C+when+some+special+providence+of+God+leads+a+man+unto+such+a+course.+This+may+also+single+out+particulars%2C+Ps.+32%3A8%2C+%E2%80%98I+will+instruct+and+guide+thee+with+mine+eye.%E2%80%99+As+the+child+knows+the+pleasure+of+his+father+in+his+eye%2C+so+does+the+child+of+God+see+God%E2%80%99s+pleasure+in+the+eye+of+his+heavenly+Father%E2%80%99s+providence.+And+this+is+done+three+ways%3A+First%2C+if+God+give+a+man+an+inclination+to+this+or+that+course%2C+for+that+is+the+spirit+of+man%3B+and+God+is+the+Father+of+spirits%3A+Heb.+12%3A9%3B+Rom.+1%3A12%3B+1+Cor.+16%3A12.+Paul+discerned+his+calling+to+go+to+Rome+by+his+%5BGreek%5D%2C+his+ready+inclination+to+that+voyage%3B+and+Apollos+his+loathness+to+go+to+Corinth+Paul+accepted+as+a+just+reason+of+his+refusal+of+a+calling+to+go+thither.+And+this+holds%2C+when+in+a+man%E2%80%99s+inclination+to+travail%2C+his+heart+is+set+on+no+by-respects%2C+as+to+see+fashions%2C+to+deceive+his+creditors%2C+to+fight+duels%2C+or+to+live+idly%2C+these+are+vain+inclinations%3B+but+if+his+heart+be+inclined+upon+right+judgment+to+advance+the+Gospel%2C+to+maintain+his+family%2C+to+use+his+talents+fruitfully%2C+or+the+like+good+end%2C+this+inclination+is+from+God.+As+the+beams+of+the+moon+darting+into+the+sea+leades+it+to+and+fro%2C+so+does+a+secret+inclination+darted+by+God+into+our+hearts+lead+and+bow+%28as+a+bias%29+our+whole+course.+Secondly%2C+when+God+gives+other+men+hearts+to+call+us%2C+as+the+men+of+Macedon+did+Paul%2C+%E2%80%98Come+to+us+into+Macedonia%2C+and+help+us.%E2%80%99+When+we+are+invited+by+others+who+have+a+good+calling+to+reside+there%2C+we+may+go+with+them%2C+unless+we+be+detained+by+weightier+occasions.+One+member+has+interest+in+another%2C+to+call+to+it+for+help%2C+when+it+is+not+diverted+by+greater+employment.+Thirdly%2C+there+is+another+providence+of+God+concurring+in+both+these%2C+that+is%2C+when+a+man%E2%80%99s+calling+and+person+is+free%2C+and+not+tied+by+parents%2C+or+magistrates%2C+or+other+people+that+have+interest+in+him.+Or+when+abroad+he+may+do+himself+and+others+more+good+than+he+can+do+at+home.+Here+is+then+an+eye+of+God+that+opens+a+door+there%2C+and+sets+him+loose+here%2C+inclines+his+heart+that+way%2C+and+outlooks+all+difficulties.+When+God+makes+room+for+us%2C+no+binding+here%2C+and+an+open+way+there%2C+in+such+a+case+God+tells+them%2C+He+will+appoint+a+place+for+them.+Secondly%2C+this+may+teach+us+in+every+place+where+God+appoints+us+to+sit+down%2C+to+acknowledge+Him+as+our+Landlord.+The+earth+is+the+Lord%E2%80%99s%2C+and+the+fulnesse+thereof%3B+his+are+our+countries%2C+our+towns%2C+our+houses%3B+and+therefore+let+us+acknowledge+Him+in+them+all.+The+apostle+makes+this+use+of+it+amongst+the+Athenians%2C+Acts+17%3A26-27.+He+has+appointed+the+times+and+places+of+our+habitation%2C+that+we+might+seek%2C+and+grope+after+the+Lord.+There+is+a+threefold+use+that+we+are+to+make+of+it%2C+as+it+appears+there%3A+%5BFirst%5D+Let+us+seek+after+the+Lord%2C+why%3F+Because+if+thou+commest+into+an+house%2C+thou+wilt+ask+for+the+owner+of+it%3A+And+so+if+thou+come+into+a+foreign+land%2C+and+there+find+an+house+and+land+provided+for+thee%2C+wilt+thou+not+inquire%2C+where+is+the+landlord%3F+Where+is+that+God+that+gave+me+this+house+and+land%3F+He+is+missing%2C+and+therefore+seek+after+Him.+Secondly%2C+thou+must+feel+after+Him%2C+grope+after+Him+by+such+sensible+things%2C+strive+to+attain+the+favor+of+your+Landlord%2C+and+labour+to+be+obedient+to+Him+that+has+given+you+such+a+place.+Thirdly%2C+you+must+labour+to+find+Him+in+his+ordinances%2C+in+prayer+and+in+Christian+communion.+These+things+I+owe+Him+as+my+Landlord%2C+and+by+these+I+find+and+enjoy+Him.+This+use+the+very+pagans+were+to+make+of+their+several+plantations%3A+And+if+you+knew+Him+before%2C+seek+Him+yet+more%2C+and+feel+after+Him+till+you+find+Him+in+his+ordinances+and+in+your+consciences.+Thirdly%2C+when+you+have+found+God+making+way+and+room+for+you%2C+and+carrying+you+by+his+providence+unto+any+place%2C+learn+to+walk+thankfully+before+Him%2C+defraud+Him+not+of+his+rent%2C+but+offer+yourselves+unto+his+service%3A+Serve+that+God+and+teach+your+children+to+serve+Him+that+has+appointed+you+and+them+the+place+of+your+habitation.%E2%80%9D%0A%0A%E2%80%94+John+Cotton%2C+God%E2%80%99s+Promise+to+his+Plantation%2C+as+it+was+delivered+in+a+Sermon+%28London%2C+1630%29%2C+pp.+8-14&amp;url=https%3A%2F%2F5solasquotes.github.io%2Fquote%2F0eac3917de.html&amp;via=5Solas" target="_blank" rel="noopener">Share on X</a><a class="perma" href="../quote/0eac3917de.html">Permalink</a><a class="src" href="https://reformedbooksonline.com/on-leaving-a-congregation/#:~:text=And%20thirdly%2C%20see%20God%20making%20room,them%20the%20place%20of%20your%20habitation&amp;text=And%20thirdly%2C%20see%20God%20making%20room%20for%20us&amp;text=you%20and%20them%20the%20place%20of%20your%20habitation" rel="noopener" target="_blank">Read it online · Reformed Books Online</a></div>

<blockquote><p>1. Where persons are esteemed members of churches by external causes without their own consent, or by parochial cohabitation, they may remove from one church unto another by the removal of their habitation according unto their own discretion. For such cohabitation being the only formal cause of any relation to such a church in particular, upon the ceasing of that cause, the relation ceases of its own accord.

2. Where persons are members of churches by mutual confederation, or express personal consent, causeless departure from them is an evil liable unto many aggravations.

3. But whereas the principal end of all particular churches is edification, there may be many just and sufficient reasons why a person may remove himself from the constant communion of one church unto that of another. And of these reasons he himself is judge on whom it is incumbent to take care of his own edification above all other things. Nor ought the church to deny unto any such persons their liberty desired, peaceably and according unto order.</p></blockquote>

ener" target="_blank">Read it online · Reformed Books Online</a></div>

<blockquote><p>Mr. Hooker [a congregationalist]: ‘It’s a staple rule, no man by nature has an ecclesiastical power over another by constraint; one comes a Christian convert from China, to a country or city where many churches are, none of them can, by the rule of the Gospel, compel him to join with one more than another. He may freely choose what is most suitable to his heart, and may be most to promote his spiritual edification.’ [Rutherford’s] Answer: …The man comes from China acknowledging God in all his ways, as Abraham left his country (Gen. 12); if he be an idolater, they should not lodge him (2 Jn. 10); he comes not as indifferent to be married [the analogy used by congregationalists for joining] to this or this church, or to none at all; as a man sins not if he marry none at all (1 Cor. 7). But if he be a professor that joins to no Church, he lives scandalously; therefore the adequate cause of membership, or to this membership, is not mutual consent, as in marriage, but both parties are under a command to confess Christ before men; and its a selfish thing to make a man’s own heart the judge and determiner of his membership, and not the churches led by the rule of the Word: and so the Church is obliged to receive him, and he is obliged to join a member, according to Cant. 1:7-8; Mt. 10:32.</p></blockquote>

olasquotes.github.io%2Fquote%2F330a4ce05d.html&amp;via=5Solas" target="_blank" rel="noopener">Share on X</a><a class="perma" href="../quote/330a4ce05d.html">Permalink</a><a class="src" href="https://reformedbooksonline.com/topics/topics-by-subject/the-church/church-membership#:~:text=Mr.%20Hooker%20%5Ba%20congregationalist%5D%3A%20%E2%80%98It%E2%80%99s%20a,according%20to%20Cant.%201%3A7%2D8%3B%20Mt.%2010%3A32&amp;text=Mr.%20Hooker%20%5Ba%20congregationalist%5D%3A%20%E2%80%98It%E2%80%99s%20a%20staple%20rule&amp;text=a%20member%2C%20according%20to%20Cant.%201%3A7%2D8%3B%20Mt.%2010%3A32" rel="noopener" target="_blank">Read it online · Reformed Books Online</a></div>

<blockquote><p>2. We deny also that by such a church-covenant [of the Independents] that right is obtained which the members of a Church in ecclesiastical communion have to the sacraments of grace, the privileges of the ecclesiastical ministry and other benefits which Christ has given to his Churches. The reasons of our denial are these:

1. Because the apostles have not ordained any such church-covenant between the members and the pastors of a church; neither in the admission of members into the Church did require such a covenant as necessary: but by the sacrament of baptism they received such as professed the truth and holiness into the Church-visible, and joined in the same exercises of divine worship with those who were without any such covenant received into an ecclesiastical body with themselves. See Acts 2:42,47; 5:13; 8:12; 9:6 &amp; 18:8.

2. Under the Old Testament the particular churches in the synagogues entered not into any solemn church-covenant in the admission of members: but only on extraordinary occasions, when they had made defection from God, all the faithful of the whole national Church renewed their Covenant with God, for restoring the decayed worship of God; or when they were by some other necessity called upon for renewing such a covenant.

3. No man can enjoin anything upon the consciences of men (as absolutely necessary to enjoying the sacraments of divine grace and the benefits of the ministry of the Church) which God hath not enjoined; without damnable will-worship. But God has not enjoined such a Covenant on the consciences of men as absolutely necessary: for there is no law of God wherein He has enjoined a necessity of this covenant as the essential form of Church-communion, so as that without it no man can be [a] member of a visible Church, or have right to the seals of the Covenant: Therefore the necessity of this covenant is a will-worship and so to be rejected.

4. The means whereby the members of a Church-visible are associated and united into external ecclesiastical communion, are baptism under the New Testament, as circumcision was under the Old Testament, 1 Cor. 12:13, as Cornelius, Acts 10:47, Lydia, Acts 16:15 and others, were by baptism engrafted into the body of the Church visible: which in those of years is joined with an embracing and profession of sound doctrine and subjection to the ordinances of God; as appears in the believers, Acts 2:41, the Bereans, Acts 17:10, and by Christ’s commandment, Mt. 28:19. Hence say the Professors of Leiden, that beside the primary uses of the sacrament of baptism, there are other secondary uses of it: to wit, the external engrafting them into a particular visible Church, Acts 2:41, the uniting of Christs members amongst themselves and into one body: 1 Cor. 12:12, and consequently upon these, a signification of our profession; and a distinction and separation from all other assemblies of unbelievers. This Church-covenant therefore is not the formal reason of our ecclesiastical communion in the Church-visible. Hence also our churches of the Netherlands in admitting of pastors or Church members do not enter into any such Church-covenant: which yet are true visible Churches of God; whose members have all essential requisites necessary to Church communion in the visible-Church. … 3. We reject also the opinion of those who affirm that the sacraments of the Old and New Testament are signs and seals to confirm this Church-covenant, and so instituted by God for the ratifying of it; that they are to be administered to those only, who are by such a Church-covenant united amongst themselves; but to be denied to others, though known to be godly, who be not in such a Church-communion and strict fellowship. Whereas it does most clearly appear out of the holy Scriptures that the sacraments were instituted by God in his Church, chiefly and in the first place to be signs and seals of the Covenant of Grace, and of the benefits promised in the Covenant of Grace, and of salvation procured by Christ for us, as is manifest by the sacrament of circumcision, Gen. 17:7,10; Rom. 4:11, of the Passover, 1 Cor. 5, of Baptism, Mark 1:4; Acts 2:38-39 and 22:16; Rom. 6:3-4; Titus 3:5, and of the Lord’s Supper, Mt. 26:26-28; 1 Cor. 11:24-26. But in a secondary respect we acknowledge the Sacraments to be seals of our outward engrafting into the Church-visible, and our conjunction into one body of the Church, Acts 2:41; 1 Cor. 12:12-13, and that, as we conceive, of the catholic Church; so that he that is baptized is not baptized into the communion only of this or that particular, or parochial Church, but is joined into that one body of the Church catholic and universal: as the whole ministry of the Church is given by Christ to men, to bring them to the unity and conjunction of the Church catholic and universal, and to engraft them as members into it, Eph. 4:11-12; 1 Cor. 12:28; Rom. 12:5-7. And as by Excommunication duly performed the person excommunicate is not cast out of this or that particular Church only, but is bound all the world over, and shut out from the brotherly communion of the Church universal, Mt. 18:17-18, so the sacraments of baptism and the Lord’s Supper are seals to a man of ecclesiastical communion, not only in a particular Church, but in the Church universal. And therefore we hold that these sacraments are to be administered not to those only who by a Church Covenant have joined themselves to some particular Church, but to all the members of the Church catholic, who have duly prepared themselves for the partaking of them. Thus our Belgic churches deny not the seal of Baptism to the children of those parents, who have not by a confession of faith and submission to ecclesiastical discipline, joined themselves to any particular church; according to the practice of the Jewish Church, Josh. 5:4-6, as neither do we deny the participation of the Lord’s Supper to those who by reason of the necessity of their calling cannot join themselves to any particular Church, but are forced to travel through diverse parochial churches.</p></blockquote>

— Wilhelm Apollonius, A Consideration of Certain Controversies at this Time Agitated in the Kingdom of England, concerning the Government of the Church of God. Written at the Command and appointment of the, [Dutch] Walachrian Classis [Presbytery] (London, 1645), ch. 2, ‘Of a Church Covenant’, pp. 17-23">Copy</button><a class="share" href="https://x.com/intent/post?text=%E2%80%9C2.+We+deny+also+that+by+such+a+church-covenant+%5Bof+the+Independents%5D+that+right+is+obtained+which+the+members+of+a+Church+in+ecclesiastical+communion+have+to+the+sacraments+of+grace%2C+the+privileges+of+the+ecclesiastical+ministry+and+other+benefits+which+Christ+has+given+to+his+Churches.+The+reasons+of+our+denial+are+these%3A+1.+Because+the+apostles+have+not+ordained+any+such+church-covenant+between+the+members+and+the+pastors+of+a+church%3B+neither+in+the+admission+of+members+into+the+Church+did+require+such+a+covenant+as+necessary%3A+but+by+the+sacrament+of+baptism+they+received+such+as+professed+the+truth+and+holiness+into+the+Church-visible%2C+and+joined+in+the+same+exercises+of+divine+worship+with+those+who+were+without+any+such+covenant+received+into+an+ecclesiastical+body+with+themselves.+See+Acts+2%3A42%2C47%3B+5%3A13%3B+8%3A12%3B+9%3A6+%26+18%3A8.+2.+Under+the+Old+Testament+the+particular+churches+in+the+synagogues+entered+not+into+any+solemn+church-covenant+in+the+admission+of+members%3A+but+only+on+extraordinary+occasions%2C+when+they+had+made+defection+from+God%2C+all+the+faithful+of+the+whole+national+Church+renewed+their+Covenant+with+God%2C+for+restoring+the+decayed+worship+of+God%3B+or+when+they+were+by+some+other+necessity+called+upon+for+renewing+such+a+covenant.+3.+No+man+can+enjoin+anything+upon+the+consciences+of+men+%28as+absolutely+necessary+to+enjoying+the+sacraments+of+divine+grace+and+the+benefits+of+the+ministry+of+the+Church%29+which+God+hath+not+enjoined%3B+without+damnable+will-worship.+But+God+has+not+enjoined+such+a+Covenant+on+the+consciences+of+men+as+ab r+the+ratifying+of+it%3B+that+they+are+to+be+administered+to+those+only%2C+who+are+by+such+a+Church-covenant+united+amongst+themselves%3B+but+to+be+denied+to+others%2C+though+known+to+be+godly%2C+who+be+not+in+such+a+Church-communion+and+strict+fellowship.+Whereas+it+does+most+clearly+appear+out+of+the+holy+Scriptures+that+the+sacraments+were+instituted+by+God+in+his+Church%2C+chiefly+and+in+the+first+place+to+be+signs+and+seals+of+the+Covenant+of+Grace%2C+and+of+the+benefits+promised+in+the+Covenant+of+Grace%2C+and+of+salvation+procured+by+Christ+for+us%2C+as+is+manifest+by+the+sacrament+of+circumcision%2C+Gen.+17%3A7%2C10%3B+Rom.+4%3A11%2C+of+the+Passover%2C+1+Cor.+5%2C+of+Baptism%2C+Mark+1%3A4%3B+Acts+2%3A38-39+and+22%3A16%3B+Rom.+6%3A3-4%3B+Titus+3%3A5%2C+and+of+the+Lord%E2%80%99s+Supper%2C+Mt.+26%3A26-28%3B+1+Cor.+11%3A24-26.+But+in+a+secondary+respect+we+acknowledge+the+Sacraments+to+be+seals+of+our+outward+engrafting+into+the+Church-visible%2C+and+our+conjunction+into+one+body+of+the+Church%2C+Acts+2%3A41%3B+1+Cor.+12%3A12-13%2C+and+that%2C+as+we+conceive%2C+of+the+catholic+Church%3B+so+that+he+that+is+baptized+is+not+baptized+into+the+communion+only+of+this+or+that+particular%2C+or+parochial+Church%2C+but+is+joined+into+that+one+body+of+the+Church+catholic+and+universal%3A+as+the+whole+ministry+of+the+Church+is+given+by+Christ+to+men%2C+to+bring+them+to+the+unity+and+conjunction+of+the+Church+catholic+and+universal%2C+and+to+engraft+them+as+members+into+it%2C+Eph.+4%3A11-12%3B+1+Cor.+12%3A28%3B+Rom.+12%3A5-7.+And+as+by+Excommunication+duly+performed+the+person+excommunicate+is+not+cast+out+of+this+or+that+particular+Church+only%2C+but+is+bound+all+the+world+over%2C+and+shut+out+from+the+brotherly+communion+of+the+Church+universal%2C+Mt.+18%3A17-18%2C+so+the+sacraments+of+baptism+and+the+Lord%E2%80%99s+Supper+are+seals+to+a+man+of+ecclesiastical+communion%2C+not+only+in+a+particular+Church%2C+but+in+the+Church+universal.+And+therefore+we+hold+that+these+sacraments+are+to+be+administered+not+to+those+only+who+by+a+Church+Covenant+have+joined+themselves+to+some+particular+Church%2C+but+to+all+the+members+of+the+Church+catholic%2C+who+have+duly+prepared+themselves+for+the+partaking+of+them.+Thus+our+Belgic+churches+deny+not+the+seal+of+Baptism+to+the+children+of+those+parents%2C+who+have+not+by+a+confession+of+faith+and+submission+to+ecclesiastical+discipline%2C+joined+themselves+to+any+particular+church%3B+according+to+the+practice+of+the+Jewish+Church%2C+Josh.+5%3A4-6%2C+as+neither+do+we+deny+the+participation+of+the+Lord%E2%80%99s+Supper+to+those+who+by+reason+of+the+necessity+of+their+calling+cannot+join+themselves+to+any+particular+Church%2C+but+are+forced+to+travel+through+diverse+parochial+churches.%E2%80%9D%0A%0A%E2%80%94+Wilhelm+Apollonius%2C+A+Consideration+of+Certain+Controversies+at+this+Time+Agitated+in+the+Kingdom+of+England%2C+concerning+the+Government+of+the+Church+of+God.+Written+at+the+Command+and+appointment+of+the%2C+%5BDutch%5D+Walachrian+Classis+%5BPresbytery%5D+%28London%2C+1645%29%2C+ch.+2%2C+%E2%80%98Of+a+Church+Covenant%E2%80%99%2C+pp.+17-23&amp;url=https%3A%2F%2F5solasquotes.github.io%2Fquote%2F7cce06371c.html&amp;via=5Solas" target="_blank" rel="noopener">Share on X</a><a class="perma" href="../quote/7cce06371c.html">Permalink</a><a class="src" href="https://reformedbooksonline.com/local-church-membership-is-not-necessary-to-partake-of-the-sacraments/#:~:text=2.%20We%20deny%20also%20that%20by,to%20travel%20through%20diverse%20parochial%20churches&amp;text=2.%20We%20deny%20also%20that%20by%20such%20a&amp;text=are%20forced%20to%20travel%20through%20diverse%20parochial%20churches" rel="noopener" target="_blank">Read it online · Reformed Books Online</a></div>

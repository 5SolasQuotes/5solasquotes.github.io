<main class="wrap"><figure class="quote" id="q-3fd22aa2aa" data-kw="">
<blockquote><p>…the position which this gentleman undertakes to establish is, ‘that appeals and complaints cannot be constitutionally entertained in our church judicatories except in judicial cases;’… This doctrine, after all that he has said in its favour, we are more than ever persuaded is unconstitutional, mischievous, and in the highest degree unreasonable.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/samuel-miller.html">Samuel Miller</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Biblical Repertory &amp; Theological Review</cite>, no. 2 (April, 1835), article 3, ‘New Ecclesiastical Law, no. 2’, pp. 186-97</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/civil-government-and-society/natural-law-and-civil-law.html">Natural Law and Civil Law</a></span></div>

</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-a97faecc2b" data-kw="">
<blockquote><p>Rutherford’s position is that God by creating rational creatures… at once creates the common principles of the natural law. Since they are part of the very constitution of the rational creature these are unable to be effaced… However, taking up Menchaca’s own Ockhamist position, Rutherford agrees that it would have been quite possible for God to have created another species of rational creature distinct from man to whom he gave a diverse natural law… Rutherford’s position is that the love of God and the subjection of the creature to the Creator is an essential part of any kind of natural law. Rutherford therefore concurs with the prominent Dutch Reformed theologian Gisbertus Voetius that the dependency of the rational creature on its Creator in morality and in order to right reason is so necessary that its opposite implies a contradiction… this law… is immutable and antecedent to every act of the divine will [stemming from the divine nature], forming the cornerstone of the natural law. What is left open to the divine decree is simply to select whether a particular act or its omission should be considered as due subjection and obedience to God, or not. Thus while the divine will establishes the moral status of a complex act, it always does so against the backdrop of God’s own nature.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/simon-j-g-burton.html">Simon J.G. Burton</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Other citations (work not named)</cite>, ch. 7, ‘Samuel Rutherford’s Euthyphro Dilemma: A Reformed Perspective on the Scholastic Natural Law Tradition’ in d. Aaron C. Denlinger, Reformed Orthodoxy in Scotland: Essays on Scottish Theology, 1560-1775 (Bloomsbury, T&amp;T Clark, 2016), pt. 2, pp. 123-40, pp. 132-33</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/civil-government-and-society/natural-law-and-civil-law.html">Natural Law and Civil Law</a></span></div>
<div class="actions"><button class="copy" data-copy="“Rutherford’s position is that God by creating rational creatures… at once creates the common principles of the natural law. Since they are part of the very constitution of the rational creature these are unable to be effaced… However, taking up Menchaca’s own Ockhamist position, Rutherford agrees that it would have been quite possible for God to have created another species of rational creature distinct from man to whom he gave a diverse natural law… Rutherford’s position is that the love of God and the subjection of the creature to the Creator is an essential part of any kind of natural law. Rutherford therefore concurs with the prominent Dutch Reformed theologian Gisbertus Voetius that the dependency of the rational creature on its Creator in morality and in order to right reason is so necessary that its opposite implies a contradiction… this law… is immutable and antecedent to every act of the divine will [stemming from the divine nature], forming the cornerstone of the natural law. What is left open to the divine decree is simply to select whether a particular act or its omission should be considered as due subjection and obedience to God, or not. Thus while the divine will establishes the moral status of a complex act, it always does so against the backdrop of God’s own nature.”

— Simon J.G. Burton, ch. 7, ‘Samuel Rutherford’s Euthyphro Dilemma: A Reformed Perspective on the Scholastic Natural Law Tradition’ in d. Aaron C. Denlinger, Reformed Orthodoxy in Scotland: Essays on Scottish Theology, 1560-1775 (Bloomsbury, T&amp;T Clark, 2016), pt. 2, pp. 123-40, pp. 132-33">Copy</button><a class="share" href="https://x.com/intent/post?text=%E2%80%9CRutherford%E2%80%99s+position+is+that+God+by+creating+rational+creatures%E2%80%A6+at+once+creates+the+common+principles+of+the+natural+law.+Since+they+are+part+of+the+very+constitution+of+the+rational+creature+these+are+unable+to+be+effaced%E2%80%A6+However%2C+taking+up+Menchaca%E2%80%99s+own+Ockhamist+position%2C+Rutherford+agrees+that+it+would+have+been+quite+possible+for+God+to+have+created+another+species+of+rational+creature+distinct+from+man+to+whom+he+gave+a+diverse+natural+law%E2%80%A6+Rutherford%E2%80%99s+position+is+that+the+love+of+God+and+the+subjection+of+the+creature+to+the+Creator+is+an+essential+part+of+any+kind+of+natural+law.+Rutherford+therefore+concurs+with+the+prominent+Dutch+Reformed+theologian+Gisbertus+Voetius+that+the+dependency+of+the+rational+creature+on+its+Creator+in+morality+and+in+order+to+right+reason+is+so+necessary+that+its+opposite+implies+a+contradiction%E2%80%A6+this+law%E2%80%A6+is+immutable+and+antecedent+to+every+act+of+the+divine+will+%5Bstemming+from+the+divine+nature%5D%2C+forming+the+cornerstone+of+the+natural+law.+What+is+left+open+to+the+divine+decree+is+simply+to+select+whether+a+particular+act+or+its+omission+should+be+considered+as+due+subjection+and+obedience+to+God%2C+or+not.+Thus+while+the+divine+will+establishes+the+moral+status+of+a+complex+act%2C+it+always+does+so+against+the+backdrop+of+God%E2%80%99s+own+nature.%E2%80%9D%0A%0A%E2%80%94+Simon+J.G.+Burton%2C+ch.+7%2C+%E2%80%98Samuel+Rutherford%E2%80%99s+Euthyphro+Dilemma%3A+A+Reformed+Perspective+on+the+Scholastic+Natural+Law+Tradition%E2%80%99+in+d.+Aaron+C.+Denlinger%2C+Reformed+Orthodoxy+in+Scotl <blockquote><p>§24. Proposition 11. The commands of lawful governors about lawful ceremonies are ordinarily to be understood with exceptions, though there be none expressed, as that in certain cases it is not their will that such commands should bind us.</p></blockquote>

</figure><figure class="quote" id="q-9e19da6b07" data-kw="">
<blockquote><p>But there is nothing so small in either doctrinals or policy [of the moral platform of Church government in the Word] so as men may alter, omit and leave off these smallest positive things that God has commanded; for Christ says [that] paying of tithe of mint, ought not to be omitted… We urge the immutability of Christ’s Laws, as well in the smallest as greatest things, though the commandments of Christ be greater or less in regard of the intrinsical matter… Yet they are both alike great, in regard of the authority of Christ the commander, Mt. 28:18-19. And it’s too great boldness to alter any commandment of Christ, for the smallness of the matter, for it lies upon our conscience, not because it is a greater or a lesser thing, and has degrees of obligatory necessity lying in it for the matter; but it ties us for the authority of the Lawgiver…</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/samuel-rutherford.html">Samuel Rutherford</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Divine Right of Church Government</cite>, ... (1646), pp. 19-20</span></figcaption>

</figure><figure class="quote" id="q-27d5833933" data-kw="">
<blockquote><p>The disciplines of economics, ethics, and law cannot be detached from a historical background that was, it is increasingly acknowledged, religious in nature. Economists like Adam Smith and Leon Walras, as well as political theorists like John Neville Figgis and Otto von Gierke, drew on the work of sixteenth- and seventeenth-century theologians, jurists, and ethicists.</p></blockquote>

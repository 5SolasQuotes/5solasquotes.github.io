</figure><figure class="quote" id="q-9cdcbe8cb2" data-kw="">
<blockquote><p>Now all this being unquestionably true of the Jewish Sanhedrin: if we should suppose, that they had no supreme Sanhedrin but that which had the power of civil Magistracy, then I ask where is that Christian State, which was, or is, or ought to be molded according to this pattern. Must ministers have vote in parliament? Must they be civil lawyers? Must all criminal and capital judgments be according to the Judicial Law of Moses, and none otherwise? Must there be no civil punishment, without previous admonition of the offender? Must Parliaments sit, as it were in the Temple of God, and interpret Scripture, which sense is true, and which false, and determine controversies of faith and cases of conscience, and judge of all false doctrines? Yet all this must be if there be a parallel made with the Jewish Sanhedrin. I know some divines hold, that the Judicial Law of Moses, so far as concerns the punishments of sins against the moral Law, idolatry, blasphemy, Sabbath-breaking, adultery, theft, etc. ought to be a rule to the Christian Magistrate. and for my part, I wish more respect were had to it, and that it were more consulted with.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/george-gillespie.html">George Gillespie</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Please enjoy Aaron’s Rod</cite>, (reprint, Sprinkle) p. 2. Gillespie is arguing against an Erastian:</span></figcaption>

<blockquote><p>…Lewis Du Moulin… a son of the famous Molinaeus, who took so active a part in the Arminian controversy, and was long the leading divine in the Protestant Church of France. Lewis settled in England, and obtained a chair in Oxford during the Commonwealth. He adopted Independent, or Congregational, views on church government, chiefly, it would appear, because he thought them more favorable to Erastianism than Presbyterian principles, a notion for which he could plead the authority of Congregational divines of the highest eminence–namely, the five dissenting brethren, as they were called, in the Westminster Assembly. They, in their Apologetical Narration, had asserted that they gave as much, or, as they thought, more, power to the civil magistrate in religious matters than the principles of Presbyterians would allow them to do, a declaration which, whether it be regarded as made honestly or hypocritically, has been very galling to those who have succeeded them in the maintenance of Congregational principles.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/william-cunningham.html">William Cunningham</a></span><span class="wk"><span class="lbl">Work:</span> <cite>HT</cite></span></figcaption>

<blockquote><p>29. The church goods should not be wasted, but be bestowed on the maintenance of ministers, and other godly uses. And whereas many goods have in times past, and yet in some places are given to churches, by the liberality of princes and other godly persons: we judge that if any church have such goods, great care is to be had that the same be not wasted nor converted into profane uses, and much less into sacriligious uses, nor feigned to be so converted: but to be only bestowed upon that purpose whereto they were given, even to a godly intent.</p></blockquote>

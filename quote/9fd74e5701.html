<blockquote><p>III. Because the essence and attributes of the Deity are not immediately, adequately comprehended by the human mind, as they are in themselves, and so perfectly: but only through the way of negation, causality, eminence: for here the human mind conducts itself as the eyes of owls to the sun.</p></blockquote>

<blockquote><p>Conclusion 9: All the divine attributes, although they are really the same and can be predicated of each other in the identical sense, and also the proper effects and determinations of any one attributed to any other attribute, yet in the formal sense they are not predicated of each other without implication of contradiction. For example, the mercy of God formally is His anger or corrective and punitive justice, God hates sin, and condemns and afflicts the sinner with eternal punishments through mercy. But the reason for this implication is because the divine attributes are virtually distinguished, and insofar as they are distinguished they cannot formally be one and the same thing, because their formal effects, for example, to hate and to pity, to save Peter, and to punish Judas, are not formally the same.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/gisbertus-voetius.html">Gisbertus Voetius</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Select Theological Disputations</cite>, vol. 1 tr. AI by Onku (Utrecht: Johannes a Waesberg, 1648), pt. 1 Latin | On the Power of God, pt. 2, p. 372</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/attributes-of-god/simplicity.html">Simplicity</a></span></div>

</figure><figure class="quote" id="q-697e2aa704" data-kw="">
<blockquote><p>This thesis offers a constructive account of the doctrine of divine simplicity in Christian theology. In its methodology, the thesis aims to present this divine perfection as an implicate of the scriptural portrayal of God, to draw upon the insights and conceptual resources of Thomas Aquinas and various Reformed orthodox theologians, and to respond to some objections to divine simplicity…. The case for God’s simplicity is made by examining God’s singularity, aseity, immutability, infinity, and act of creation in Holy Scripture and then tracing the ways in which these descriptions of God imply that he is (negatively) not composed of parts. Rather, he is (positively) actus purus and really identical with his own essence, existence, and attributes, each of which is identical with the whole being of the triune God considered under some aspect. In light of the constructive work, this study then addresses the three most pressing objections to divine simplicity: (1) that it denigrates God’s revelation of his many attributes in the economy; (2) that it eliminates God’s freedom in creating the world and acting in history; and (3) that it does not cohere with the doctrine of the Trinity.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/steven-j-duby.html">Steven J. Duby</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Divine Simplicity: a Dogmatic Account PhD diss</cite>, (Univ. of St. Andrews, 2014) 325 pp. Here is the pubilshed version of this dissertation: Divine Simplicity: a Dogmatic Account in T&amp;T Clark Studies in Systematic Theology, vol. 30 (Bloomsbury, 2010) 260 pp.</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/attributes-of-god/simplicity.html">Simplicity</a></span></div>

<blockquote><p>Instance 1: If the persons are really the same as the essence, they are really the same among themselves; the reason is, because things which are the same with one third thing are the same among themselves. Response: This axiom must be limited: Things which are the same with one third singular incommunicable thing are the same among themselves. But the divine essence is communicable to the three persons. Thus Becanus, Scholastic Theology, treatise 2, ch. 2, quest. 3. Nothing prevents also adding the commonplace limitation to that axiom: They are the same among themselves with respect to that third thing. And thus the persons are the same among themselves with respect to the one and same essence.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/gisbertus-voetius.html">Gisbertus Voetius</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Select Theological Disputations</cite>, vol. 1 tr. AI by Onku (Utrecht: Johannes a Waesberg, 1648), pt. 1, On the One &amp; Most Simple Essence of God, p. 225 Latin</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/attributes-of-god/simplicity.html">Simplicity</a></span></div>

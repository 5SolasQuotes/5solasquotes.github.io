<main class="wrap"><figure class="quote" id="q-1e635490f6" data-kw="">
<blockquote><p>Now my petition, backed with the authority of a mother, to your honours is, that for the glory of Christ’s kingdom in this land, the adorning of his majesty’s crown, &amp; quietness of his loyal subjects, the endless praise of your selves, and flourishing of your honourable estate, and the particular comfort of the Ministers and congregations within this realm in this time of distress felt and feared. I may by your timeous intercession at his gracious majesties hands, and uttermost endeavours debt full to God from your place, obtain how soon occasion may be offered.

1 A sufficient and ready execution of former acts of Parliament made against the fearful blasphemy of God’s name, profaning of the Lord’s day, and contempt of his sanctuary, and service, so universally overflowing this land, not only in the persons of poor ignorants, in a manner tied to these horrible crimes by a cursed custom, &amp; beggarly necessity: but even in the more honourable sort, whose damnable example encourages their followers to sin without fear: with such additions as may repress and restrain these crying abominations in all, without respect of persons.

2 A safe liberty to enjoy the profession of our religion, as it is reformed in doctrine, sacraments and discipline, and hath been openly professed by Prince, Pastors, and people of all ranks, your predecessors of worthy memory, your selves &amp; us, all yet living, these threescore years by gone, and above.

3 A full deliverance from, and a sufficient defence against all novations and novelties in doctrine, sacraments, and discipline, and specially such, as by constitutions of the Kirk, confessions of faith, lovable laws of the country, and long continued practise hath been condemned, and casten out as idle rites, and Romish formalities, under what soever pretence they plead for re-entry.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/david-calderwood.html">David Calderwood</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The speech of the Kirk of Scotland to her beloved children</cite>, (Amsterdam, 1620), pp 69-71.</span></figcaption>

</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-1d1ebfccd9" data-kw="">
<blockquote><p>And to complete the dismal scene of our misery, we have had for a long time among us one of the most scandalous, pernicious and most unaccountable schisms that perhaps ever was in any age of the Church; a schism carried on by three weak men, supported by a poor people, and both are equally ignorant of the nature of union with, and separation from, a Church, and of what will justify the one or other; they cannot, in a consistency with their principles, hold communion with any Church this day on earth. We confess to our shame there are many things wrong with us, and that there are errors in the administration, against which we are, with the help of grace, still struggling and contending; and we resolve ever to plead against such corruptions: But no man of common understanding will think this national Church should be cast off, and that we should separate from her; we have a good constitution; we have a standard of doctrine without error; Westminster Confession of Faith, which we own as the confession of our faith; we have subscribed and preach the doctrine therein contained; our worship is pure, without men’s additions; our discipline and government, in their constitution, are agreeable unto, founded on, and appointed in the Word of God; and there are no sinful terms of communion imposed. As we cannot, and hope never shall, justify the measures some take, and for which they shall answer to God; so we will not despise the dust of Zion: What of the covenanted work of reformation is remaining among us, we must favor that dust, and look on it as precious, and pray and wrestle, by the help of grace, that our Lord would return to build his own House (for men have not courage to do it) and take a new infeftment[?] thereof by a cloud of his glory. There are a set of faithful ministers in this Church who are troubled for the many offenses that are given, and for laying so many stumbling blocks before the blind: And as they mourn for these in secret, so they give frequent testimony against them.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/john-currie.html">John Currie</a></span><span class="wk"><span class="lbl">Work:</span> <cite>An Essay on Separation</cite></span></figcaption>

</figure><figure class="quote" id="q-fe0b4d24e5" data-kw="">

</figure><figure class="quote" id="q-a81b70ef0b" data-kw="">
<blockquote><p>Here I might admonish them which separate themselves from our church [of England]. As Paul saith, ‘Examine whether you be in the faith,’ so examine whether you have the show of error. Hath it not the show of error to broach a religion which was never heard of before? Hath it not the show of error to retain an opinion which the author himself [Robert Browne] hath recanted, as though ye would suck up that which the dog hath vomited? Hath it not the show of error to affirm that those preachers may not be heard, which (by their own confessions) have converted them to the knowledge of God, and daily convert others? Hath it not the show of error to affirm that the Lord’s prayer may not be used for a prayer, which for anything that we or they can read, was so used from the beginning?

Hath it not the show of error to say that no man may use any set prayer, seeing there be many set prayers, and psalms, and blessings in the holy Scripture, which were used in the same form? Hath it not the show of error to affirm that we have no church, and yet to grant that our martyrs which died in popery were true members of the church? Hath it not the show of error to affirm that two or three may excommunicate all the rest without a minister, seeing the pastor is the mouth of the church?

Hath it not the show of error to affirm that the church of Christ was ever invisible before this age, and that it is such a small flock as their number is, and that it hath set foot nowhere but in England? Hath it not the show of error to hold that for good and sound religion which is altered every day, adding and detracting, as though a man should make a religion of his own invention, so fast as new conceits come into his brain: Let them think what Paul Saith unto them, ‘Be wise unto sobriety,’ Rom. xii. 3, and suspect that construction which yourselves devised; for Solomon saith, There is an error upon the right hand as well as upon the left, Prov. iv. 27; that is (as I may call it), the zealous error; and if this be not, I know none within this land.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/henry-smith.html">Henry Smith</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The True Trial of the Spirits</cite>, (1591) in The Works of Henry Smith; Including Sermons, Treatises, Prayers, and Poems, ed. Thomas Fuller (2 vols, Edinburgh: James Nichol, 1866), 1: 143.</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/the-church/schism-and-separation.html">Schism and Separation</a></span></div>
<div class="actions"><button class="copy" data-copy="“Here I might admonish them which separate themselves from our church [of England]. As Paul saith, ‘Examine whether you be in the faith,’ so examine whether you have the show of error. Hath it not the show of error to broach a religion which was never heard of before? Hath it not the show of error to retain an opinion which the author himself [Robert Browne] hath recanted, as though ye would suck up that which the dog hath vomited? Hath it not the show of error to affirm that those preachers may not be heard, which (by their own confessions) have converted them to the knowledge of God, and daily convert others? Hath it not the show of error to affirm that the Lord’s prayer may not be used for a prayer, which for anything that we or they can read, was so used from the beginning?

Hath it not the show of error to say that no man may use any set prayer, seeing there be many set prayers, and psalms, and blessings in the holy Scripture, which were used in the same form? Hath it not the show of error to affirm that we have no church, and yet to grant that our martyrs which died in popery were true members of the church? Hath it not the show of error to affirm that two or three may excommunicate all the rest without a minister, seeing the pastor is the mouth of the church?

Hath it not the show of error to affirm that the church of Christ was ever invisible before this age, and that it is such a small flock as their number is, and that it hath set foot nowhere but in England? Hath it not the show of error to hold that for good and sound religion which is altered every day, adding and detracting, as though a man should make a religion of his own invention, so fast as new conceits come into his brain: Let them think what Paul Saith unto them, ‘Be wise unto sobriety,’ Rom. xii. 3, and suspect that construction which yourselves devised; for Solomon saith, There is an error upon the right hand as well as upon the left, Prov. iv. 27; that is (as I may call it), the zealous error; and if this be not, I know none within this land.”

— Henry Smith, The True Trial of the Spirits, (1591) in The Works of Henry Smith; Including Sermons, Treatises, Prayers, and Poems, ed. Thomas Fuller (2 vols, Edinburgh: James Nichol, 1866), 1: 143.">Copy</button><a class="share" href="https://x.com/intent/post?text=%E2%80%9CHere+I+might+admonish+them+which+separate+themselves+from+our+church+%5Bof+England%5D.+As+Paul+saith%2C+%E2%80%98Examine+whether+you+be+in+the+faith%2C%E2%80%99+so+examine+whether+you+have+the+show+of+error.+Hath+it+not+the+show+of+error+to+broach+a+religion+which+was+never+heard+of+before%3F+Hath+it+not+the+show+of+error+to+retain+an+opinion+which+the+author+himself+%5BRobert+Browne%5D+hath+recanted%2C+as+though+ye+would+suck+up+that+which+the+dog+hath+vomited%3F+Hath+it+not+the+show+of+error+to+affirm+that+those+preachers+may+not+be+heard%2C+which+%28by+their+own+confessions%29+have+converted+them+to+the+knowledge+of+God%2C+and+daily+convert+others%3F+Hath+it+not+the+show+of+error+to+affirm+that+the+Lord%E2%80%99s+prayer+may+not+be+used+for+a+prayer%2C+which+for+anything+that+we+or+they+can+read%2C+was+so+used+from+the+beginning%3F%0A%0AHath+it+not+the+show+of+error+to+say+that+no+man+may+use+any+set+prayer%2C+seeing+there+be+many+set+prayers%2C+and+psalms%2C+and+blessings+in+the+holy+Scripture%2C+which+were+used+in+the+same+form%3F+Hath+it+not+the+show+of+error+to+affirm+that+we+have+no+church%2C+and+yet+to+grant+that+our+martyrs+which+died+in+popery+were+true+members+of+the+church%3F+Hath+it+not+the+show+of+error+to+affirm+that+two+or+three+may+excommunicate+all+the+rest+without+a+minister%2C+seeing+the+pastor+is+the+mouth+of+the+church%3F%0A%0AHath+it+not+the+show+of+error+to+affirm+that+the+church+of+Christ+was+ever+invisible+before+this+age%2C+and+that+it+is+such+a+small+flock+as+their+number+is%2C+and+that+it+hath+set+foot+nowhere+but+in+England%3F+Hath+it+not+the+show+of+error+to+hold+that+for+good+and+sound+religion+which+is+altered+every+day%2C+adding+and+detracting%2C+as+though+a+man+should+make+a+religion+of+his+own+invention%2C+so+fast+as+new+conceits+come+into+his+brain%3A+Let+them+think+what+Paul+Saith+unto+them%2C+%E2%80%98Be+wise+unto+sobriety%2C%E2%80%99+Rom.+xii.+3%2C+and+suspect+that+construction+which+yourselves+devised%3B+for+Solomon+saith%2C+There+is+an+error+upon+the+right+hand+as+well+as+upon+the+left%2C+Prov.+iv.+27%3B+that+is+%28as+I+may+call+it%29%2C+the+zealous+error%3B+and+if+this+be+not%2C+I+know+none+within+this+land.%E2%80%9D%0A%0A%E2%80%94+Henry+Smith%2C+The+True+Trial+of+the+Spirits%2C+%281591%29+in+The+Works+of+Henry+Smith%3B+Including+Sermons%2C+Treatises%2C+Prayers%2C+and+Poems%2C+ed.+Thomas+Fuller+%282+vols%2C+Edinburgh%3A+James+Nichol%2C+1866%29%2C+1%3A+143.&amp;url=https%3A%2F%2F5solasquotes.github.io%2Fquote%2Fa81b70ef0b.html&amp;via=5Solas" target="_blank" rel="noopener">Share on X</a><a class="perma" href="../quote/a81b70ef0b.html">Permalink</a><a class="src" href="https://reformedcovenanter.wordpress.com/2019/11/02/henry-smith-on-the-errors-of-the-separatists/" rel="noopener" target="_blank">Read it online · Reformed Covenanter</a></div>

<main class="wrap"><figure class="quote" id="q-ff35eaf9cf" data-kw="">
<blockquote><p>We must not view these ways of talking about the love of God as independent, compartmentalized, loves of God… as if each were hermetically sealed off from the other… If you absolutize any one of these ways in which the Bible speaks of the love of God, you will generate a false system that squeezes out other important things the Bible says, thus finally distorting your vision of God.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/d-a-carson.html">D.A. Carson</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Difficult Doctrine of the Love of God</cite>, (Crossway, 2000), pp. 23, 75, as quoted by Ian Murray, The Cross: the Pulpit of God’s Love (n.d.), p. 20</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/effectual-calling/common-grace.html">Common Grace</a></span></div>

</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-fc70d38fca" data-kw="">
<blockquote><p>VI. The Purpose and Extent of the Atonement 5. THE WIDER BEARING OF THE ATONEMENT. The question may be raised, whether the atonement wrought by Christ for the salvation of the elect, and of the elect only, has any wider bearing… Several Reformed theologians hold that, though Christ suffered and died only for the purpose of saving the elect, many benefits of the cross of Christ do actually — and that also according to the plan of God — accrue to the benefit of those who do not accept Christ by faith. They believe that the blessings of common grace also result from the atoning work of Christ. [Cf. Witsius, De Verbonden II, 9.4; Turretin, Loc. XIV, Q. 14, Sec. 11; Cunningham, Hist. Theol. II, p. 332; Hodge, The Atonement, 358 and elsewhere; Grosheide in the Evangelical Quarterly, April, 1940, p. 127. Cf. also Strong, Syst. Theol., p. 772.]</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/louis-berkhof.html">Louis Berkhof</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Systematic Theology</cite>, (1950)</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/effectual-calling/common-grace.html">Common Grace</a></span></div>

</figure><figure class="quote" id="q-710314ac0a" data-kw="">
<blockquote><p>Together with these external means, serving for drawing on the covenant and going on in it, the common operations of God do concur; common to all the called, both elect and reprobate, and gifts common to both, are bestowed, such as illumination, moral persuasion, historical, dogmatic and temporary faith, moral change of affections, and some sort of external amendment of their outward conversation, saving grace being the special gift of God to His own.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/david-dickson.html">David Dickson</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Therapeutica Sacra</cite>, Book 1, Chapter 6</span></figcaption>

</figure><figure class="quote" id="q-aef1bfff79" data-kw="">
<blockquote><p>Jehoahaz the son of Jehu began to reign over Israel in Samaria, and reigned seventeen years. And he did that which was evil in the sight of the Lord, and followed the sins of Jeroboam the son of Nebat, which made Israel to sin; he departed not therefrom… He delivered them into the hand of Hazael king of Syria, and into the hand of Benhadad the son of Hazael, all their days. And Jehoahaz besought the Lord, and the Lord hearkened unto him: for He saw the oppression of Israel, because the king of Syria oppressed them. And the Lord gave Israel a saviour, so that they went out from under the hand of the Syrians:</p></blockquote>

<main class="wrap"><figure class="quote" id="q-09bcba75a7" data-kw="">
<blockquote><p>But if you do evil, be afraid; for he does not bear the sword in vain; for he is God’s minister, an avenger to execute wrath on him who practices evil. (Romans 13:4)

1. The “terror” of rulers to evil-doers consists, first, in their steadfast and fearless administration of righteous and good laws – which of itself, from its own rectitude and majesty, creates fear in the conscience of even the most wicked.

2. In the infliction of positive pain or punishment, withdrawing from transgressors the benefits which they had previously conferred; or actually laying upon them the burden of sufferings corresponding with the nature of the offence, and the ordinations of just laws; or, in other words, corresponding with the eternal rules of justice and righteousness.

And, since the principles and infallible rules of justice ought not to be left to the ever-varying opinions, judgments, or customs of men, but should be sought for in the law given, in the rules observed, and in the examples set by the supreme lawgiver, it becomes the duty of Christians to ascertain and act upon what the divine Word declares on this important and difficult subject.

When we survey the justice of God, and the penalties for transgression he has prescribed in the Scriptures, we find the principle lying at the foundation of all to be, that an offender against law must either make compensation, by rendering an equivalent for his offence – that is, by replacing what his transgression has taken away, or restoring things to the state in which they were before he transgressed; or, if that be impossible, that he must forfeit all opportunity of offending in like manner, and be made to suffer the very thing which his conduct was intended to make the innocent suffer.

This principle seems to be the basis of all the punishments affixed to transgression by the Divine Being. It is set forth in the expression, “An eye for an eye, a tooth for a tooth.” (Exod. xxi. 23-25.) It is taking from the transgressor an equivalent for the injury he has done, and making him lose that of which he sought to deprive another.

In this way only can we identify punishment with justice, which is a “rendering to every man according to his works.” Thus, when one individual takes away the life of another, not by accident, but intention, he forfeits his own life to justice, which demands the forfeiture: “Whoso sheddeth man’s blood, by man shall his blood be shed.” Not to punish the murderer with death may be mercy, but it is not justice, either in the judgment of natural conscience, or in that of the law of God.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/robert-craig.html">Robert Craig</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Theocracy or the principles of the Jewish religion and polity adapted to all nations and times</cite>, (Edinburgh, 1848), pp 280-1.</span></figcaption>

<blockquote><p>First, that the setting up of Christ to be King is the greatest, the most desirable good that ever can betide any Nation.

</figure><figure class="quote" id="q-4c8f9f5b3c" data-kw="">
<blockquote><p>The law in general, is that part of God’s Word, which commands things just, honest, and godly, and being thus conceived, it is threefold: ceremonial, judicial, and moral. The ceremonial law, is that part of God’s Word, which prescribed to the Jews, ceremonies, rites, and orders, to be performed in the worship of God. This law is laid down in the books of Moses, especially in Leviticus. The judicial law, is that part of God’s Word, which prescribed ordinances for the government of the Jews’ commonwealth, and the civil punishment offenders. The ceremonial law concerned the Jews only. The judicial law did indeed principally concern them, but yet so far forth as it tends to the establishing of the moral law, having in it common equity,* it concerns all people, in all times and places. What the moral law is, I will describe in three points: first, it is that part of God’s Word, concerning righteousness and godliness, which was written in Adam’s mind by the gift of creation; and the remnants of it be in every man by the light of nature, in regard whereof, it binds all men. Secondly, it commands perfect obedience, both inward in thought and affection, and outward in speech and action. Thirdly, it binds to the curse and punishment everyone that fails in the least duty thereof, though but once, and that in thought only: ‘Cursed is every one that continueth not in all things that are written in the law to do them’ (Gal. 3:10). The sum of the moral law is propound in the Decalogue or Ten Commandments, which many can repeat, but few do understand. That we may further conceive aright the moral law, we must make a difference between it and the gospel, for the gospel is that part of the Word which promises righteousness and life everlasting to all that believe in Christ.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/william-perkins.html">William Perkins</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Works of William Perkins: vol. 2: Commentary on Galatians</cite>, (1:243–44).</span></figcaption>

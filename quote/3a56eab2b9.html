<blockquote><p>…the controversy of our ceremonies; the sparkles of which difference have grown unto great flames in this our [Anglican] Church. Where the fault is, as God knows, so the day will try and God will one day judge. But difference of apprehensions has brought forth difference of judgments, and difference of judgments has brought forth difference of practice and disagreement in affection. The difference of practice has moved [civil / Church] Authority to silence and suppress refusers of conformity: The disagreement in affection, has moved the ministers deprived to speak evil of persons in authority and of conformers: Whereby in the event, the course of the Gospel is interrupted, and [the course] of Popery enlarged; the friends of Sion are grieved, the enemies reioiced, the Devil gratified, and God not pleased. The Church is rent with schism, the truth scandalized by dissention, and the ministers undone by loss of living, and the unity of brethren living in the same house, professing the same Faith, and rejoicing in the same hope, is pulled in pieces: And this [is] like[ly] to continue God knows how long; but all men know: the longer the worse.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/john-sprint.html">John Sprint</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Cassander Anglicanus, showing the Necessity of Conformity to the Prescribed Ceremonies of our Church in Case of Deprivation</cite>, (London: Bill, 1623) | ‘To the Reader’ no page number</span></figcaption>

</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-a2bba13919" data-kw="">
<blockquote><p>Are we then heretics, condemned in ourselves? wherein overthrow we the foundation? What other God, Savior, Scriptures, justification, sacraments, Heaven do they teach beside us? Can all the masters of Seperation, yea can all the churches in Christendom set forth a more exquisite and worthy confession of Faith than is contained in the [39] Articles of the Church of England? Who can hold these and be heretical? Or, from which of these are we revolted? But to make this good they have taught you to say that every truth in Scripture is fundamental; so fruitful is error of absurdities, whereof still one breeds another more deformed than itself. That Trophimus was left at Miletum sick, that Paul’s cloak was left at Troas, that Gaius, Paul’s host, saluted the Romans, that Nabal was drunk; or that Thamar baked cakes [2 Sam. 13:8-10], and a thousand of this nature are fundamental: How large is the Separatists’ Creed, that has all these articles? If they say all Scripture is of the same Author, of the same authority: so say we, but not of the same use. Is it as necessary for a Christian to know that Peter hosted with one Simon, a tanner in Joppa, as that Jesus Christ the Son of God was born of the Virgin Mary? What a monster is this of an opinion, that all truths are equal? That this spiritual house should be all foundation, no walls, no roof? Can no man be saved but he that knows everything in Scripture?… You see then that both all truths must not of necessity be known, and some must: and these we justly call fundamental: which who so holds, all his hay and stubble (through the mercy of God) condemn him not: stil he has right to the church on earth, and hope in heaven: but whither every truth be fundamental, or necessary: Discipline (you say) is so: indeed necessary to the well-being of a church, no more: it may be true without it, not perfect. Christ compares his spouse to an army with banners: as order is to an army, so is discipline to the Church: if the troops be not well marshalled in their several ranks, and move not forward, according to the discipline of war, it is an army still: confusion may hinder their sucess, it cannot bereave them of their name: it is as beautiful proportion to the body, an hedge to a vineyard, a wall to a city, an hem to a garment, ceiling to an house. It may be a body, vineyard, city, garment, house, without them: it cannot be well and perfect. Yet which of our adversaries will say we have no discipline? Some they grant, but not the right: as if they said, Your city has a brick wall indeed, but it should have one of hewn stone; your vineyard is hedged, but it should be paled and ditched: while they cavil at what we want, we thank God for what we have; and so much we have, in spite of all detraction, as makes us both a true Church and a worthy one. But the main quarrel is against but ministry and form of worship: let these be examined; this is the circle of their censure: No Church, therefore no ministry; and no ministry, therefore no Church… What would they have? Have we not competent gifts from aboue, for so great a function? Are we all unlearned, insufficient? Not a man that knows to devide the word aright? As Paul to the Corinthins, is it so that there is not one wise man amongst us? No man will affirm it: some of them have censured our excess in some knowledge; none, our defect in all: What then? Have we not a true desire to do faithful service to God and his Church? No zeal for God’s glory?…</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/joseph-hall.html">Joseph Hall</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Epistles, the Second Volume</cite>, (London: 1608) | 6th Decade, Epistle 5… dissuading from Separation &amp; Shortly Oppugning the Grounds of that Error, pp. 50-55</span></figcaption>

<blockquote><p>And I make no doubt but some opinions as well as practices render men unmeet for Church-communion, Tit. 3:10; 2 Jn. 10. All opinions which overthrow doctrines necessary to be believed, which the apostle comprehends under the name of Faith; and all such opinions as are inconsistent with an holy life and te power of godliness, which the apostle comprehends under the name of a good conscience, 1 Tim. 1:19-20. Whosoever shall hold or maintain any such opinions as these, he is either to be kept out, if not admitted; or cast out, if he be in Church-fellowship. In receiving such you receive but spies and incendiaries among you. What a fire-brand did Arius prove, not only in the Church of Constantinople, but even to the whole world? Men of graceless hearts and erroneous heads will give a continual exercise to the patience of sober Christians… if they can be discerned before they be admitted, a little preventive care would be of singular and seasonable use to the tranquillity of Church-societies.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/john-flavel.html">John Flavel</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Planelogia, a Succinct &amp; Seasonable Discourse of the Occasions, Causes, Nature, Rise, Growth &amp; Remedies of Mental Errors</cite>, ... (London: Roberts, 1691), pp. 438-39, 446 Flavel was a presbyterian. | Direction 1</span></figcaption>

<blockquote><p>And indeed there is no possibility of making an actual agreement in those lesser points, because of the different capacities and degrees of faith: And God in the Scripture has not promised such an actual agreement to all the members of the Church in all lesser points of doctrine; for He has not promised a full and uniform discovery of them to all: Yea, it has been showed out of your own great Doctor Stapleton (Ex. pacif. ch. 3), by a Roman Catholic, that in the discovery of small points the Church is not infallibly directed… And thus may we come to a sight of the unity of faith in the Church; For in the explicits, that is, in fundamentals of absolute necessity which knit unto Christ the foundation, there is and ought to be an unity; and this substantial unity may cover the incurable differences in the lesser implicit points being held by infirmity, and not with contention, scandal, and schism: For unity in fundamentals does take away the damning censure of differences in lesser points when there is a will of believing right in these points, but a want of power to attain this belief. And so these differences in lesser points not being put upon account for the will of unity in them, and for the real unity in fundamentals, this real unity in fundamentals is accounted an entire, or at least a solid and saving unity: So that the unity is not to be reckoned from this, that all do actually agree in this belief of all lesser points (for in diverse of these points diverse do necessarily differ) but because their unity in fundamentals, and a will of unity in these lesser points wherein they differ (the imputation of smaller differences being thus taken away) are accounted to them for an entire, or at least for a sufficient unity. And this truth is in not much unlike terms to be seen in Tertullian (Of the Veiling of Virgins, ch. 1): Regula quidem fidei una omninò est, sola immobilis, et irreformabilis, credendi scilicet in unicum Deum, omnipotentem mundi conditorem, et Filium ejus Jesum Christum, etc. ‘The rule of faith is only unmoveable.’ And De Praes., ch. 12: Quaeramus ergò in nostro et à nostris et de nostro, id(que) duntaxat quod salva regula fidei potest in quaestionem devenire. ‘Let us inquire or dispute of that which may come into question without hurting the rule of faith.&#x27;</p></blockquote>

<blockquote><p>§5. But we find the ancient Fathers with a holy zeal, charging such as apostates from the Church and breakers of her peace, who held opinions contrary to the essential and fundamental, or any of the great articles of the Christian Faith, so that they placed the unity of the catholic Church in a harmonious consent to these great truths. Irenaeus ([Against Heresies] bk. 1, ch. 3, p. 53, edition Cologne, 1625), having given a short account of the chief articles of the true religion, has these words: hanc igitur praedicationem, et hanc ••dem adepta Ecclesia, quamvis dispersa in universo mundo, diligenter conservat, a• si in una eademque domo habitaret, ac similiter iis fidem habet, ac si unam animam unumque et idem cor haberet; atque un• consensu hoc praedicat, docet ac tradit, ac si uno ore praedita esset. Quamvis enim dissimilia sunt in mundo genera linguarum, una tamen et eadem est vis traditionis; nec quae constitutae sunt in Germania Ecclesiae aliter credunt; nec quae in Hispania, neque in Galliis; neque in Oriente, neque in Aegypto, neque in Lybia, aut in medio Orbis terrarum fundatae sunt, sed quemadmodum Sol Creatura Dei unus et idem est in universo Mundo; ita &amp; praedicatio veritatis ubiquae lucet, &amp; illuminat eos qui ad notionem veritatis venire volunt. Eusebius (Ecclesiastical History, bk. 4, ch. 27) cites Irenaeus condemning Tatianus, the author of the sect of the Encratitae, and saying of him, [Greek], he reckoned his opinions a falling from the Church, or a breaking her unity. The same Historian, bk. 4, ch. 24, gives account of Egesippus narrating, how long the Church remained a virgin, teaching and believing nothing but the Law and the prophets, and what the Lord Himself taught, and he mentions particularly the Churches of Corinth, Rome and Jerusalem; and then shows how heresies arose, whose authors he calls false Christs, false prophets and false apostles, and of them he says, [Greek],they divided the unity of the Church by their corrupt doctrines against God, and against his Christ. Several other citations might be brought to this purpose, but these may be sufficient. I do not question but that there might be other things which might be called schism, even with respect to the universal Church, as if any should bring in idolatrous, or superstitious worship, contrary to the rules of the Gospel, or should violate any of the necessary and laudable canons of General Councils, and should set up societies in opposition, not only to one or few, but to all the societies of Christians, or all the soundest of them… §6. There is another sort of unity much regarded among the ancients, which though the breach of it had as bad influence on all, or most Churches, and so on the catholic Church: yet it properly respected neighbor Churches, either which were united by the bond of one government, a provincial, or lesser synod, being made up of them: or only living in the vicinity of one another, or having frequent occasion of correspondence; they who were not under any uniting bonds, but these commune to all the parts of the catholic Church, yet had an unity of kind correspondence, mutual assistance, as occasion offered, acquainting one another with their affairs so far as it was of any advantage: admitting the members of other Churches to communion with them on occasion, refusing communion with such members of other Churches as were by them excommunicated: and this unity was then broken when these acts of friendship were shunned or refused, especially when they who were cast out by one were received to another: or when occasional communion was either shuned by them who so joined in another Church or denied to such sojourners if they desired it: or when one Church showed rage, fury and bitterness against another because of what they differed about.</p></blockquote>

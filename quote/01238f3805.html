<main class="wrap"><figure class="quote" id="q-01238f3805" data-kw="">
<blockquote><p>Unwarrantable [schism] either for the ground or manner… Where a ground and cause is pretended, but it is but a light cause… some lesser errors in doctrine, not fundamental, nor near the foundation; some corruptions in or about the worship of God, but those not destructive to the ordinances, being not in substance, but in ceremony; and those such as the person offended is not enforced to be active in…</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/john-brinsley.html">John Brinsley</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Arraignment of the Present Schism of New Separation in old England (London: Field, 1646)</cite>, pp. 24–25</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/the-church/church-unity-and-fundamentals.html">Church Unity and Fundamentals</a></span></div>

</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-536663c18e" data-kw="">
<blockquote><p>The Lutherans on the contrary, by defect, decline fraternal fellowship with the Reformed, who by no means differ from them in the foundation. The Reformed pursue a middle way: (1) they reject the Socinians’ Samaritanism, that is, fraternal fellowship with those who err in the foundation, and render it useless to us (1 Cor. 3:12 with Rom. 10:3–4; Gal. 5:4), being adduced: (1)… (c) by reasons, because the fellowship of the mystical body rests upon the unity of the fundamental faith (Eph. 4:4–5). (2) With churches that err concerning the foundation, that is, which teach such things whereby, through necessary consequence, the foundation is made to fail, they do not want to rashly break church fellowship, unless perhaps they exclude us (1 Cor. 3:12; Eph. 4:4–5; Col. 2:19), after the example of Paul, who due to errors of this sort, by no means separated from the churches of Corinth, Galatia, and Colossae.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/petrus-van-mastricht.html">Petrus van Mastricht</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Theoretical-Practical Theology, ed. Joel Beeke, tr. Todd Rester (Reformation Heritage Books), vol. 5, bk. 7, ch. 1, §35</cite></span></figcaption>
<div class="meta"><span class="t"><a href="../topics/the-church/church-unity-and-fundamentals.html">Church Unity and Fundamentals</a></span></div>

</figure><figure class="quote" id="q-7c2cd21a76" data-kw="">
<blockquote><p>First, that the blessed and long sought for union of Protestant Churches may be recommended unto the public prayers of the Church. And secondly, that either an Evangelical correspondency for mutual edification, for healing of breaches, for taking away of scandals and for the advancement of the Gospel of Jesus Christ amongst Protestants should henceforth be entertained with foreign Churches, by those to whom the care of so blessed a work may be with authority referred: Or that his Majesty, with your Honours’ advice and grave counsel, might be moved to call together a general synod of Protestants in due time, for the better setling of weighty matters in the Church, which now trouble not only the consciences of most men, but disturb the tranquility of publick states and divide the Churches one from another to the great hinderance of Christianity, and the dishonour of religion. All which evils by this means may be taken out of the way, and from hence a great blessing of God, and much honour amongst men will redound to this Church and nation…</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/articles-of.html">Articles of</a></span><span class="wk"><span class="lbl">Work:</span> <cite>John Dury, his Petition to the Honourable House of Commons in England, now Assembled in Parliament (London, 1641) 2 pp.</cite></span></figcaption>

hurch%20and%20nation" rel="noopener" target="_blank">Read it online · Reformed Books Online</a></div>
</figure><figure class="quote" id="q-3e7d7ae3dc" data-kw="">
<blockquote><p>Every secesion is not evil and schismatical, but only that which is made rashly and unjustly. Since this cannot be said of ours [from Rome] (which had the most weighty and highly necessary causes), schism cannot be charged upon us…</p></blockquote>

</figure><figure class="quote" id="q-6cd5f142fb" data-kw="">
<blockquote><p>Yea, and although difference in judgment about smaller matters ought not to cause that alienation of affection, and strangeness either among ministers or people, as with many it does; to the great hindrance of the growth of the Gospel; yet towards such as oppose themselves against the truth in main and fundamental articles thereof, Christians are bound to show themselves strange, to shun all voluntary and unnecessary familiarity with them, to show them no countenance. If we shall receive such into our houses, or bid them Godspeed, we make ourselves partakers of their sins, 2 Jn. 10-11.</p></blockquote>

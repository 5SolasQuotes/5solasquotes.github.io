<main class="wrap"><figure class="quote" id="q-db33a0351c" data-kw="">
<blockquote><p>The Sinai covenant-administration was no bargain for sinners, and I pity the poor Israelites who suffered under its administration, just as I understand perfectly well why seventy-three (nearly half) of their psalms were laments. I would have resisted this covenant also, had I been there, because such a legal covenant, whose conditions require strict obedience (and threaten severe curse-sanctions), is bound to fail if one of the parties to it is a sinful people.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/t-david-gordon.html">T. David Gordon</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Law is Not of Faith</cite>, (2009), p. 251</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/the-law-of-god/ceremonial-law.html">Ceremonial Law</a></span></div>

</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-faff82bb91" data-kw="ceremonial abrogation">
<blockquote><p>The ceremonial law can be viewed in two ways: either with regard to doctrine and signification; or with regard to obligation and observance. The question is not whether it was abrogated as to doctrine. We confess that it still remains and is useful in many ways among Christians; and that the mystical truth, hidden under this shell, is always the same and of perpetual necessity. Rather the question is whether it was abrogated as to obligation and obedience and whether believers are still in subjection to the ceremonial law. This was the opinion not only of the Jews of old, but also of the Judaizing false apostles in the time of the apostles. However we, with the apostles and the whole church, deny it.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/francis-turretin.html">Francis Turretin</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Institutes of Elenctic Theology</cite>, 11.25.1</span></figcaption>

</figure><figure class="quote" id="q-2699ea0f28" data-kw="">
<blockquote><p>Under this [Mosaic] Covenant, the natural seed of Abraham bore the face of the Church and state, and God had promised abundance of temporals, and of spiritual, a scantling; But all under the outward administration of the Covenant were not in like manner partakers of the blessings promised in Covenant. For some had their part in temporal blessings only, and the outward ordinances; others were partakers of the spiritual blessings promised. But whatever good thing any of them enjoyed either temporal or spiritual, it was conferred upon them freely according to the Covenant of Grace, and not for the dignity of their works. It is true, the promise is conditional, if they obey, they shall reap the good things of the Land: but obedience was not a causal condition, why they should inherit the Land… So that herein there appears no intexture of the Covenant of works with the Covenant of Grace, nor any moderation of the Law to the strength and power of nature for the obtaining of outward blessings. But rather that God out of his abundant goodness is pleased freely to confer outward blessings promised in the Covenant upon some that did not cleave to him unfeignedly [purely], that he might make good his promise unto the spiritual seed, which by word and oath he had confirmed unto the Fathers.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/start-here.html">Reformed Books Online</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Was the Israelites’ Inheriting the Land by Grace, or a Graciously Accommodated Merit?</cite>, John Ball, A Treatise of the Covenant of Grace (London: Miller, 1645), p.142 This work was very influential upon the Westminster Assembly.</span></figcaption>

</figure><figure class="quote" id="q-29bc292ded" data-kw="">
<blockquote><p>Canon XXIV: But this later Covenant of Grace according to the diversity of times has also different dispensations. For when the Apostle speaks of the dispensation of the fullness of times, that is, the administration of the last time (Eph 1:10), he very clearly indicates that there had been another dispensation and administration until the times which the Father appointed. Yet in the dispensation of the Covenant of Grace the elect have not been saved in any other way than by the Angel of his presence (Isa 63:9), the Lamb slain from the foundation of the world (Rev 13:8), Christ Jesus, through the knowledge of that just Servant and faith in him and in the Father and his Spirit. For Christ is the same yesterday, today, and forever (Heb 13:8). And by His grace we believe that we are saved in the same manner as the Fathers also were saved, and in both Testaments these statutes remain unchanged: “Blessed are all they that put their trust in Him,” (the Son) (Ps 2:12); “He that believes in Him is not condemned, but he that does not believe is condemned already” (John 3:18). “You believe in God,” even the Father, “believe also in me” (John 14:1). But if, moreover, the holy Fathers believed in Christ as their God, it follows that they also believed in the Holy Spirit, without whom no one can call Jesus Lord. Truly there are so many clearer exhibitions of this faith of the Fathers and of the necessity of such faith in either Covenant, that they can not escape any one unless one wills it. But though this saving knowledge of Christ and the Holy Trinity was necessarily derived, according to the dispensation of that time, both from thc promise and from shadows and figures and mysteries, with greater difficulty than in the NT. Yet it was a true knowledge, and, in proportion to the measure of divine Revelation, it was sufficient to procure salvation and peace of conscience for the elect, by the help of God’s grace. Canon XXV: We disapprove therefore of the doctrine of those who fabricate for us three Covenants, the Natural, the Legal, and the Gospel, different in their entire nature and essence, and in explaining these and assigning their differences, so intricately entangle themselves that they greatly obscure and even impair the nucleus of solid truth and piety. Nor do they hesitate at all, with regard to the necessity, under the OT dispensation, of knowledge of Christ and faith in him and his satisfaction and in the whole sacred Trinity, to speculate much too loosely and dangerously.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/stephen-marshall.html">Stephen Marshall</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Formula Consensus Helvetica</cite>, [The Swiss Form of Consensus] 1675 | trans. Martin I. Klauber, Trinity Journal 11 (1990): pp. 103-23 See Wikipedia for background.</span></figcaption>

</figure><figure class="quote" id="q-e0985778de" data-kw="">
<blockquote><p>The difference between us here is not: (1) Whether both these [the Covenant of Works with Adam and the Mosaic Covenant] be called covenants in Scripture? Nor (2) Whether there was no grace at all in both, or either of them; for we are agreed , it is grace in God to enter into covenant with man, whatever that covenant be. Nor (3) Whether the Sinai law be not a covenant of works to some men, by their own fault and occasion? Nor (4) Whether the Scriptures do not many times speak of it in that very sense and notion wherein carnal justiciaries apprehend and take it; and by rejecting Christ, make it so to themselves? Nor (5) Whether the very matter of the law of nature be not revived and represented in the Sinai law? These are not the points we contend about. But the question is: Whether the Sinai law do in its own nature, and according to God’s purpose and design in the promulgation of it, revive the law of nature, to the same ends and uses it served to in Adam’s covenant; and so be properly and truly a covenant of works? Or whether God had not gracious and evangelical ends and purposes, viz. by such a dreadful representation of the severe and impracticable terms of the first covenant, instead of obliging them to the personal and punctual observance observance of them for righteousness and life, He did not rather design to convince them of the impossibility of legal righteousness, humble proud nature, and show them the necessity of betaking themselves to Christ, now exhibited in the new covenant, as the only refuge to fallen sinners?</p></blockquote>

<div class="meta"><span class="t"><a href="../topics/the-law-of-god/ceremonial-law.html">Ceremonial Law</a></span></div>
<div class="actions"><button class="copy" data-copy="“The difference between us here is not: (1) Whether both these [the Covenant of Works with Adam and the Mosaic Covenant] be called covenants in Scripture? Nor (2) Whether there was no grace at all in both, or either of them; for we are agreed , it is grace in God to enter into covenant with man, whatever that covenant be. Nor (3) Whether the Sinai law be not a covenant of works to some men, by their own fault and occasion? Nor (4) Whether the Scriptures do not many times speak of it in that very sense and notion wherein carnal justiciaries apprehend and take it; and by rejecting Christ, make it so to themselves? Nor (5) Whether the very matter of the law of nature be not revived and represented in the Sinai law? These are not the points we contend about. But the question is: Whether the Sinai law do in its own nature, and according to God’s purpose and design in the promulgation of it, revive the law of nature, to the same ends and uses it served to in Adam’s covenant; and so be properly and truly a covenant of works? Or whether God had not gracious and evangelical ends and purposes, viz. by such a dreadful representation of the severe and impracticable terms of the first covenant, instead of obliging them to the personal and punctual observance observance of them for righteousness and life, He did not rather design to convince them of the impossibility of legal righteousness, humble proud nature, and show them the necessity of betaking themselves to Christ, now exhibited in the new covenant, as the only refuge to fallen sinners?”

— John Flavel, Vindiciae Legis et Foederis [Vindications of the Law and Covenant]: or a Reply to Mr. Philip Cary’s Solemn Call in Works, vol. 6, p. 323">Copy</button><a class="share" href="https://x.com/intent/post?text=%E2%80%9CThe+difference+between+us+here+is+not%3A+%281%29+Whether+both+these+%5Bthe+Covenant+of+Works+with+Adam+and+the+Mosaic+Covenant%5D+be+called+covenants+in+Scripture%3F+Nor+%282%29+Whether+there+was+no+grace+at+all+in+both%2C+or+either+of+them%3B+for+we+are+agreed+%2C+it+is+grace+in+God+to+enter+into+covenant+with+man%2C+whatever+that+covenant+be.+Nor+%283%29+Whether+the+Sinai+law+be+not+a+covenant+of+works+to+some+men%2C+by+their+own+fault+and+occasion%3F+Nor+%284%29+Whether+the+Scriptures+do+not+many+times+speak+of+it+in+that+very+sense+and+notion+wherein+carnal+justiciaries+apprehend+and+take+it%3B+and+by+rejecting+Christ%2C+make+it+so+to+themselves%3F+Nor+%285%29+Whether+the+very+matter+of+the+law+of+nature+be+not+revived+and+represented+in+the+Sinai+law%3F+These+are+not+the+points+we+contend+about.+But+the+question+is%3A+Whether+the+Sinai+law+do+in+its+own+nature%2C+and+according+to+God%E2%80%99s+purpose+and+design+in+the+promulgation+of+it%2C+revive+the+law+of+nature%2C+to+the+same+ends+and+uses+it+served+to+in+Adam%E2%80%99s+covenant%3B+and+so+be+properly+and+truly+a+covenant+of+works%3F+Or+whether+God+had+not+gracious+and+evangelical+ends+and+purposes%2C+viz.+by+such+a+dreadful+representation+of+the+severe+and+impracticable+terms+of+the+first+covenant%2C+instead+of+obliging+them+to+the+personal+and+punctual+observance+observance+of+them+for+righteousness+and+life%2C+He+did+not+rather+design+to+convince+them+of+the+impossibility+of+legal+righteousness%2C+humble+proud+nature%2C+and+show+them+the+necessity+of+betaking+themselves+to+Christ%2C+now+exhibited+in+the+new+covenant%2C+as+the+only+refuge+to+fallen+sinners%3F%E2%80%9D%0A%0A%E2%80%94+John+Flavel%2C+Vindiciae+Legis+et+Foederis+%5BVindications+of+the+Law+and+Covenant%5D%3A+or+a+Reply+

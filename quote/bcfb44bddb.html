<main class="wrap"><figure class="quote" id="q-bcfb44bddb" data-kw="">
<blockquote><p>A habit is a mere accident of worship; the person, John or Thomas, is also an accident; but if God command such an ephod as Aaron and the priests were to wear, this is not a mere circumstance… And therefore these circumstances, taken in common and their universal nature, are merely physical circumstances; but taken in their particular and determinate restrictions, as such circumstances, they may be merely moral circumstances, such as are the common adjunct of the time of worship, the place, and the Sabbath time and the temple for Jewish worship. The former are circumstances merely physical, the latter merely moral; I mean, as they are restricted other ways… … I did say that Christ Jesus has set down in the Word a perfect platform of Church-government in all morals; I say in all morals because the Word does not teach us anything of circumstances, physical as physical. Scriptura talia non ponit, sed supponit [Scripture does not put forth such things, but supposes them]: The Scripture says not that the worship of God must have a time, a place, when, and where its to be performed, a person, who is to perform it, a habit, or garments on the person that worships; the Scripture teaches none of these, but supposes that they are and must be; because nature teaches that without time, place, person, habit, gesture, its unpossible that these or any human actions can be; And therefore prelatical formalists do without all sense or reason require that we should prove by Scripture, the lawfulness of time, place, person, habit, gesture in God’s worship; for these are presupposed in all actions, natural, civil, religious, private, public, lawful, unlawful, in acts of arts, sciences, of moral conversing and all; yea, there is as good reason that they demand Scripture to prove he must be a living man, who has a reasonable soul and senses, and is born of a woman, who preaches and administrates sacraments, which is presupposed by nature.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/samuel-rutherford.html">Samuel Rutherford</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Divine Right of Church Government</cite>, ... (1646) | Introduction, pp. 4-5</span></figcaption>

</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-3256f8381d" data-kw="">
<blockquote><p>…here are rules of order for the outward fashion of praying and prophesying; these may be as variable as the other are constant, it is no more possible to fit all Churches and countries with one form than to fit all bodies with one suit, or all limbs with one size…. They, exercising these manly functions, presumed to take upon them manly fashions; whereas therefore bare-headedness was in Corinth, as also in all Greece and Rome a token of honor and superiority, and covering the head a token of subjection; these forward women usurp upon the fashions of their husbands, and will have their faces seen as well as their voices heard;</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/joseph-hall.html">Joseph Hall</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Shaking of the Olive Tree, the Remaining Works of that incomparable prelate Joseph Hall</cite>, … (d. 1656; 1660), ‘The Women’s Vail: or a Discourse concerning the Necessity or Expedience of the Close-Covering of the Heads of Women… upon 1 Cor. 11:10, Occasioned by an offence unjustly taken at a Modest Dress’, p. 237</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/worship/head-coverings-in-worship.html">Head Coverings in Worship</a></span></div>

0their%20voices%20heard" rel="noopener" target="_blank">Read it online · Reformed Books Online</a></div>
</figure><figure class="quote" id="q-0d68aa6d6c" data-kw="">
<blockquote><p>To those who, in a narrow spirit, insist on having divine prescription for the most insignificant details of religious life and public worship, this appeal to ‘nature itself,’ [v. 14] as a great guide in relation to the decencies of public worship, should read a wholesome lesson. Nature, though uniform in its essential features, varies in all that is subordinate in different regions and at different periods. In matters of feeling, taste, and decorum, as to the way in which the relation of the sexes should be expressed, eastern and western ideas notoriously and widely differ, and they should be allowed their natural and proper development.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/david-brown.html">David Brown</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Other citations (work not named)</cite>, 1 Cor. 11 in A Popular Commentary on the New Testament, ed. Philip Schaff, p. 203</span></figcaption>

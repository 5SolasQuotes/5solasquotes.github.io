</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-f0be9feb72" data-kw="">

<div class="actions"><button class="copy" data-copy="“I noted wherein they were schismatics… for separating themselves from true Churches, with condemnation for some corruptions, and holding themselves the only pure Churches:”

</figure><figure class="quote" id="q-0dc4279b47" data-kw="">
<blockquote><p>Behold then the inordinate dealing and arrogant presumption of you Brownists… professing to set up discipline, and glorying that you suffer for it, do break and utterly abolish the rules thereof given by Christ, by your utter forsaking and abandoning all the assemblies in England: for let it be confessed that the errors, the sins, the imperfections, the spots, and deformities of our Church be many, so that she is not in her general estate so fair as the fairest of her sisters: yet has she heretofore had, and now has, many noble children, richly adorned with heavenly jewels, and precious gifts of learning knowledge, faith, and godliness. And howsoever the Papists one way, and the Brownists another way, do aggravate her crimes with pestilent slanders, yet shall they never prove that either in doctrine or manners she is guilty of any fundamental crime which separates from Christ and destroys the life and being of a true Church.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/george-gifford.html">George Gifford</a></span><span class="wk"><span class="lbl">Work:</span> <cite>A Short Treatise Against the Donatists of England, whom we call Brownists</cite>, … (London, 1590), p. 6</span></figcaption>

</figure><figure class="quote" id="q-5db2709540" data-kw="">
<blockquote><p>How much the ministry of the Word and sacraments should weigh with us… so as to be a perpetual badge for distinguishing the Church, has been explained; for we have shown, first, that wherever it exists entire and unimpaired, no errors of conduct, no defects should prevent us from giving the name of Church; and, secondly, that trivial errors in this ministry ought not to make us regard it as illegitimate. Moreover, we have shown that the errors to which such pardon is due, are those by which the fundamental doctrine of religion is not injured, and by which those articles of religion, in which all believers should agree, are not suppressed, while, in regard to the sacraments, the defects are such as neither destroy nor impair the legitimate institution of their Author.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/john-calvin.html">John Calvin</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Institutes of the Christian Religion</cite>, tr. Beveridge (1559; Edinburgh: Calvin Translation Society, 1845), vol. 3, bk. 4, ch. 2, §1, p. 42</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/the-church/church-unity-and-fundamentals.html">Church Unity and Fundamentals</a></span></div>

</figure><figure class="quote" id="q-0db6e1c5f3" data-kw="">
<blockquote><p>The knowledge of points fundamental is necessary: 1. To obtain salvation. 2. To keep communion with a true Church; for we are to separate from a Church subverting the foundation and laying another foundation… [John] Davenant says better, That such are fundamental, the knowledge whereof is simply necessary to salvation, if ignorance whereof does condemn. Doctor [Christopher] Potter calls them prime and capital doctrines of our religion, or of that faith which essentially constitutes a true Church and a true Christian; which is good…</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/samuel-rutherford.html">Samuel Rutherford</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Due Right of Presbyteries, ‘Acts 15, A Pattern of a Juridicial Synod’</cite>, (London: Griffin, 1644), pt. 2, ch. 4, sect. 5, Question 3, In what cases it is lawful to separate from a Church?, p. 223</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/the-church/church-unity-and-fundamentals.html">Church Unity and Fundamentals</a></span></div>

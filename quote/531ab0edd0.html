<main class="wrap"><figure class="quote" id="q-531ab0edd0" data-kw="">
<blockquote><p>To proceed yet further, we are here to consider the particular remedies which they of the popish church have prescribed against the hurts that have come by witchcraft. And they are principally five. The first is the name of Jesus. We must grant that any Christian may lawfully call upon the name of Jesus in prayer, for the help and deliverance of those who are possessed and bewitched, but yet with the caveat and condition before specified, if it is the will of God, and if their recovery may make for His glory, the benefit of the church, and the good of the diseased parties. But the papist, by the use of this name, intends a further matter, to wit, that the very name uttered in so many letters and syllables is powerful to cast out devils and to help those who are bewitched. For when it is uttered, then (they say) the authority of Christ is present, that the work may be done. [This is] a flat untruth and a practice full of danger. For let this be well considered, whatsoever any man does in this case, he must do it by virtue of his calling, and have also his warrant for the doing thereof out of the Word. If he lacks this, and yet undertakes such a work, he may justly fear the like event that befell the vagabond Jews who were exorcists (Acts 19:13). Now the church of Christ has no warrant in the Word to use this name of Christ for any such purpose. Neither has any ordinary Christian a special calling from God so to do. Therefore, he may not do it.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/william-perkins.html">William Perkins</a></span><span class="wk"><span class="lbl">Work:</span> <cite>A Discourse of the Damned Art of Witchcraft… (Cambridge, 1610), ch. 7, ‘The application of the doctrine of witchcraft to our times’, section 3, question 3, ‘Whether a man may prevent the danger of witchcraft, and if he may, then what remedies he may lawfully and effectually use against it?’</cite>, pp. 239-40</span></figcaption>

</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-f727f3eb43" data-kw="">
<blockquote><p>A 1700’s treatise surfaced two centuries ago regarding the supernatural and scientific phenomenon that plagued Europe in an era when magic, witchcraft, demonology, instances of haunting and even cases of vampires were recorded in historical documentation. It was during the age of reason when a Black Monk from the Benedictine Order of the 18th century penned a work that would become one of the most influential and controversial works of his time. A plethora of cases regarding events in the supernatural had plagued mankind with fear and mystery throughout history, many inhabitants to the regions of Europe came under an epidemic of social hysteria which steamed from reports of corpses rising from their graves, killing and sucking the blood of victims inhabiting small villages or visitations and the haunting of ghosts, evil spirits and demons. The Black Monk, Abbot Don Augustin Calmet tasked himself with the study of these… historically documented reports for the purpose of providing the public with the rules to determine a claim’s legitimacy through philosophical reasoning and scientific examination that was approved by the King of France in 1746. This work provides an in depth look into the history of most superstitions, mythologies, the analysis of events depicted in ancient texts from various religions and historically renowned cases… Calmet lays out the rules for determining the fraudulent claims from the real while also providing a “how to” manual when dealing with or investigating occult matters in witchcraft, ghosts, vampires and demonic possessions. This work was written by an ordained abbot monk and was accepted by European society as scientific research in his time.</p></blockquote>

</figure><figure class="quote" id="q-369168cb1d" data-kw="">
<blockquote><p>When Rainer Decker was researching a sensational seventeenth-century German witchcraft trial, he discovered, much to his surprise, that in this case the papacy functioned as a force of skepticism and restraint. His curiosity piqued, he tried unsuccessfully to gain access to a secret Vatican archive housing the records of the Roman Inquisition that had been sealed to outsiders from its sixteenth-century beginnings. In 1996 Decker was one of the first of a small group of scholars allowed access… Witchcraft and the Papacy is based on these newly available materials and traces the role of the papacy in witchcraft prosecutions from medieval times to the eighteenth century. Decker found that although the medieval church did lay the foundation for witch hunts of the sixteenth to eighteenth centuries, the postmedieval papacy, and the Roman and Spanish Inquisitions, played the same kind of skeptical, restraining role during the height of the witch-hunting frenzy in Germany and elsewhere in Europe… Witchcraft and the Papacy overturns a large body of scholarship…</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/rainer-decker.html">Rainer Decker</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Witchcraft &amp; the Papacy: An Account Drawing on the Formerly Secret Records of the Roman Inquisition Ref (Univ. of Virginia Press, 2008) 262 pp.</cite></span></figcaption>

</figure><figure class="quote" id="q-ff68bebe16" data-kw="">
<blockquote><p>This is a highly original study of demon possession and the ritual of exorcism, both of which were rife in early modern times, and which reached epidemic proportions in France… The rite of exorcism… generated as many problems as it resolved. Possessed women endured frequently violent exorcisms, exorcists were suspected of conjuring devils, and possession itself came to be seen as a form of holiness, elevating several women to the status of living saints.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/sarah-ferber.html">Sarah Ferber</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Demonic Possession &amp; Exorcism In Early Modern France (Routledge, 2004)</cite></span></figcaption>

<blockquote><p>3. The ceremonies are proven to be superstitious by this reason: If there were no more, they have no necessary nor profitable use in the Church (as has been proved), which kind of things cannot be used without superstition. It was according to this rule, that the Waldenses and Albingenses taught that the exorcisms, breathings, crossings, salt, spittle, unction, chrism, etc. used by the Church of Rome in baptism, being neither necessary nor requisite in the administration of the same, did occasion error and superstition rather than edification to salvation. (History of the Waldenses, pt. 3, bk. 1, ch. 6)</p></blockquote>

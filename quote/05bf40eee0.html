<main class="wrap"><figure class="quote" id="q-05bf40eee0" data-kw="">
<blockquote><p>This is the old distinction between what is contrary to reason, and what is above it. It is evident that it is the height of absurdity for reason to object to an otherwise accredited revelation that its teaching is incomprehensible, or that it involves elements apparently irreconcilable with other truths.

Because; — (1.) This presumes that human reason is the highest form of intelligence, which is absurd. (2.) In no other department do men limit their faith by their ability to understand. What do men of science understand as to the ultimate nature of atoms, of inertia, of gravity, of force, of life? They are every moment forced to assume the truth of the impossible, and acknowledge the inexplicability of the certain.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/a-a-hodge.html">A. A. Hodge</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Outlines of Theology</cite>, (2nd edn, New York: Robert Carter and Brothers, 1879), p. 62.</span></figcaption>

oksonline.com/on-the-reception-of-scotus-in-church-history/#:~:text=The%20greatest%20of%20the%20philosophers%20was,a%20wider%20Franciscan%20reformation%20of%20method&amp;text=The%20greatest%20of%20the%20philosophers%20was%20John%20Duns&amp;text=connection%20to%20a%20wider%20Franciscan%20reformation%20of%20method" rel="noopener" target="_blank">Read it online · Reformed Books Online</a></div>

<blockquote><p>The relation of events, causal and successive, in the pre-millenarian eschatology, while a favourite with many, and to some minds a very fascinating one, is not that usually held among Protestant Christians. It is not the prevalent view among Presbyterians. It is not the view taught in the Catechisms or in the Confession of Faith of our church. On the other hand it is there expressly disavowed. Standard writers on systematic theology, who necessarily take the comprehensive view of God’s gracious plan, almost to a man discard this order as one which cannot be made, in its varied elements, to square with itself or with the most definite teachings of Scripture.

It assumes that the second advent will usher in the millennium, when our Lord will reign on the throne of Israel in Jerusalem as did King David. It foresees a brilliant reign whose splendours are to be sensuous and Jewish. It avoids those passages of Scripture which connect immediately the coming of Christ and the final judgment of all the world, and which affirms that this coming is a coming to judge. It holds to a separate resurrection of the righteous and the wicked, one at either end of the millennium, a doctrine that rests on one verse in the midst of a mysterious and symbolical passage, and on a construction of that verse that is not only not necessary but is in the highest degree improbable; since, in addition to being out of analogy with the rest of Scripture, it assumes without proof that the resurrection of the souls there spoken of is a resurrection of the body, and further, that it is a resurrection of all the righteous dead; a meaning not only not in the passage but expressly precluded by the fact that it is of certain martyrs who had been beheaded for the witness of Jesus that the evangelist in writing.

The theory of two resurrections, that apex upon which the whole millenarian scheme, as an inverted pyramid, rests, is not an affirmation of Scripture but an unwarranted inference. The closing verses of the twentieth chapter of Revelation describe a general judgment of all the dead, small and great, as they stand before God and the great white throne, and a general resurrection of all the dead, to the end that they appear before that august tribunal. Now, I cannot place these events nor can I know what is meant by the last ” great day,” if I postulate the theory of two resurrections as it is usually held.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/william-addison-alexander.html">William Addison Alexander</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Latter-Day Judaism in Presbyterian Quarterly</cite></span></figcaption>

<blockquote><p>If there is Anything, the Uncausable is Susbtance [see pp. 56-68 of the Summary] .

48. If something accidental exists, something substantial exists. Proof: An accident depends essentially on its substrate. This dependence is of the same order as that which is found between formal cause and material cause. For substance is as it were the matter of accidents. Hence for any accident that actually exists there is required the simultaneous existence of another being, namely that in which the accident is. If this other is not something substantial but on the contrary an accident, then some third being is required. But there cannot be a regress to infinity, both because there would be at the same time an infinite number and because dependence in any essential order ends in some independent being in the same order. Hence every effect demands an ultimate being that is not an effect; a thing in matter requires eventually a being not in matter, namely prime matter. Likewise a being in another or to which existing in another belongs, involves a being not in another, or to which existing in itself belongs. If you object that some accident, namely quantity, can exist in itself, that is, supernaturally, the objection is not valid; for even in this case God, as first efficient cause, would be making up for the natural, material, secondary causality of the substance. And so, even on this supposition, at least one substance would exist, namely God himself.

49. If there is anything, substance exists. If there is anything, it is either accident or substance. But if it is accident, substance too exists (from conclusion 48). Therefore in either case, if there is anything, there is substance.

50. Being is divided into substance and accident. The existence of accidents must be proved from experience. And on this point one must note that, on the evidence of experience, many things exist that are not only beings but beings in another, as color, shape etc. It does not matter whether these are formally objective or subjective, for in either case they are real modifications of something. One must say the same about our internal acts, as thoughts, affections, volitions; for we experience these beings as empirical modifications of the ‘ego’. — From the fact of actual accident follows the fact of actual substance (from conclusion 48). Thus both accident and substance exist; therefore being is divided into substance and accident. About knowledge of the formal idea of accident one must note that ‘in another’ or ‘in-anotherness’ is correlative, for it involves something in which it is. But to perceive some relation, there is need of knowledge of the terms of the relation in themselves. Our first knowledge of reality, therefore, seems to be knowledge of things as absolute objects and not in their relation to other beings. But when we say that accidents are immediately experienced as beings in another the sense is: this knowledge is not by way of reasoning out but, from phenomenological analysis of the givens of experience, we perceive through simple apprehension this relation of ‘in-anotherness’. Shape, for instance, is not only perceived in itself and as something absolute but also in its relation to extension and color, namely as the limit of a colored expanse. But in other cases it seems we do not immediately perceive the idea of ‘in-anotherness’, but rather we infer it by reasoning out. This happens, for example, with quantity. No wonder then that some, as Descartes, identified extension with material substance as such.

51. If something is altogether independent, it must be substance and not accident. Hence the uncausable, for instance, is substance. This conclusion is sufficiently clear from what was said above in proof of conclusion 48. … Proof of God … 11. God’s knowledge is really the same as the divine essence. Plain both from the physical simplicity of God and from the infinite perfection of the divine essence, which is perfectible neither accidentally nor substantially (conclusion 2). [A difference between the divine essence and its knowledge would be a difference between substance and accident.] … 15… Corollary: On a Personal God We show, against those who conceive God to be an impersonal cosmic force, that God is a rational being and hence personal. For a personal God is here understood as a rational supposit, that is, a singular substance simply complete, in its own right, and endowed with reason. God’s simply complete substantiality and singularity, and being in his own right, follow from our principal argument. In the present chapter God’s rationality is proved. Hence everything requisite for a personal being is verified of God. … 29. Every being is good, or being and good convert. … Further, creatures are also good for other creatures; for example, substance upholds accidents, accidents give further perfection to substance, etc.</p></blockquote>

48. If something accidental exists, something substantial exists. Proof: An accident depends essentially on its substrate. This dependence is of the same order as that which is found between formal cause and material cause. For substance is as it were the matter of accidents. Hence for any accident that actually exists there is required the simultaneous existence of another being, namely that in which the accident is. If this other is not something substantial but on the contrary an accident, then some third being is required. But there cannot be a regress to infinity, both because there would be at the same time an infinite number and because dependence in any essential order ends in some independent being in the same order. Hence every effect demands an ultimate being that is not an effect; a thing in matter requires eventually a being not in matter, namely prime matter. Likewise a being in another or to which existing in another belongs, involves a being not in another, or to which existing in itself belongs. If you object that some accident, namely quantity, can exist in itself, that is, supernaturally, the objection is not valid; for even in this case God, as first efficient cause, would be making up for the natural, material, secondary causality of the substance. And so, even on this supposition, at least one substance would exist, namely God himself.

<blockquote><p>Holy contentment maketh them truly rich, whom the oppressing world maketh very poor. Hereby our sweetest morsels shall be well seasoned, and our bitterest potions well sweetened. Had we learned to enjoy contentment in Jehovah, who is immutable and all-sufficient, this heavenly frame of spirit should never perish or change in the midst of the most amazing alterations in Church and State, with which his Majesty is pleased to exercise us; whereas because we live alone upon sublunaries, therefore we are apt with Nabal to die upon the nest through dejectedness, upon the approach of imagined dangers.

When God seeth cause to cut us short of many creature-accommodations, faith will moderate our desires after them, assuring the soul that nothing is withdrawn, or withheld, which might be really advantageous; and doubtless it is a great piece of happiness upon earth, not to long after that which the Lord is pleased to deny. Indeed men act rather like Heathens then Christians, when they fret upon some particular inferior disappointments, notwithstanding God’s liberality laid forth upon them in many other respects. As Alexander the Monarch of the world was discontented because Ivy would not grow in his gardens at Babylon.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/simeon-ashe.html">Simeon Ashe</a></span><span class="wk"><span class="lbl">Work:</span> <cite>To the Christian Reader in Thomas Watson, Autarkeia, or, The art of divine contentment</cite></span></figcaption>
<div class="meta"><span class="t"><a href="../topics/worship.html">Worship</a></span></div>

</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-25ed8c8b04" data-kw="">
<blockquote><p>Man, as a condemned sinner, can obtain nothing from God on his own account. He lies under the curse of a broken law; exposed to everlasting perdition. God can be to him only a consuming fire. There is an impassible barrier between such a man and God. There can be no communication between the holy and the unclean.

The prayers of the wicked are an abomination in the sight of God. He is surrounded with such an atmosphere of holiness, that the breathings of an impure spirit cannot reach him. There is only one channel of communication between the sinner and God, and that is Christ.

When God looks upon us, he can see nothing to approve. In his sight we are altogether as an unclean thing; even our righteousnesses are as filthy rags. Our holiest services are polluted in his sight. But there is a Day’s Man between us who is able to lay his hand upon both. Our prayers cannot come up before God with acceptance, but the angel of the everlasting covenant stands before the throne, with his golden vial, and He, the everlasting intercessor, pours from it the prayers of the saints, he perfumes them with the sacred incense of his own holiness, and they come up as a sweet savour before the Father. Thus it is that our prayers are all offered up for Christ’s sake, and it were well that we fully understood and deeply felt what is implied in the use of these most significant words.

There is reason to fear that many a prayer wafted heavenward remains unanswered, because the grand condition of all acceptable prayer is not fully felt as it ought to be! Men pray as if they had a right to ask, and a title to expect, favours from God, on their own independent footing. There is much trusting to his goodness and forbearance, and mercy, forgetful all the while, that God can only hear through the intercessor before the throne, and can only manifest his goodness through the one mediator, the man Christ Jesus.

When we ask of God, for Christ’s sake, the bestowment of any blessing, it were well that the truth were blazoned before the eye of our inner consciousness, that we cannot be accepted save in the beloved; that if God looks directly at us, we are condemned; that he can only be well pleased when he looks on us in the face of his anointed—when he beholds in the lamb that had been slain justice fully satisfied, and in the lamb now alive and living for ever more, the evidence of his own sealed and irrefragable covenant.

When we ask anything for Christ’s sake, we acknowledge that we are not worthy in ourselves to receive it—when we plead the name of Jesus, we acknowledge our own guilt, and proclaim him the sole ground of our hope —when we point to him, we entreat God not to look upon us—we renounce our own righteousness—we confess our own shame—we plead for a standing in Jesus—we claim an interest in his work—we profess to stand in his righteousness —to hope for mercy through his peace-speaking blood.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/william-wilson.html">William Wilson</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Believing Prayer Heard and Answered in The Free Church Pulpit; Consisting of Discourses by the Most Eminent divines of the Free Church of Scotland. Vol. I.</cite></span></figcaption>
<div class="meta"><span class="t"><a href="../topics/worship.html">Worship</a></span></div>

</figure><figure class="quote" id="q-3bc99e300d" data-kw="">
<blockquote><p>Because it is a relic of Paradise and type of Heaven. The first Sabbath dawned on the bowers of a sinless paradise. When Adam was created in the image of his Maker, he was put into the garden to dress it and to keep it. No doubt this called forth all his energies. To train the luxuriant vine, to gather the fruit of the fig-tree and palm, to conduct the water to the fruit-trees and flowers, required all his time and all his skill. Man was never made to be idle.

Still when the Sabbath-day came round, his rural implements were all laid aside; the garden no longer was his care. His calm, pure mind looked beyond things seen into the world of eternal realities. He walked with God in the garden, seeking deeper knowledge of Jehovah and His ways, his heart burning more and more with holy love, and his lips overflowing with seraphic praise. Even in Paradise man needed a Sabbath. Without it Eden itself would have been incomplete. How little they know the joys of Eden, the delight of a close and holy walk with God, who would wrest from Scotland this relic of a sinless world!

It is also the type of heaven. When a believer lays aside his pen or loom, brushes aside his worldly cares, leaving them behind him with his week-day clothes, and comes up to the and comes up to the house of God, it is like the morning of the resurrection, the day when we shall come out of great tribulation into the presence of God and the Lamb. When he sits under the preached word, and hears the voice of the shepherd leading and feeding his soul, it reminds him of the day when the Lamb that is in the midst of the throne shall feed him and lead him to living fountains of waters. When he joins in the psalm of praise, it reminds him of the day when his hands shall strike the harp of God. Where congregations ne’er break up, And Sabbaths have no end.

When he retires, and meets with God in secret in his closet, or, like Isaac, in some favourite spot near his dwelling, it reminds him of the day when “he shall be a pillar in the house of our God, and go no more out.” This is the reason why we love the Lord’s day. This is the reason why we “call the Sabbath a delight.” A well-spent Sabbath we feel to be a day of heaven upon earth. For this reason we wish our Sabbaths to he wholly given to God. We love to spend the whole time in the public and private exercises of God’s worship, except so much as is taken up in the works of necessity and mercy. We love to rise early on that morning, and to sit up late, that we may have a long day with God.

How many may know from this that they will never be in heaven! A straw on the surface can tell which way the stream is flowing. Do you abhor a holy Sabbath? Is it a kind of hell to you to be with those who are strict in keeping the Lord’s day? The writer of these lines once felt as you do. You are restless and uneasy. You say, “Behold what a weariness is it!” “When will the Sabbath be gone, that we may sell corn?” Ah! soon, very soon, and you will be in hell. Hell is the only place for you. Heaven is one long, never-ending, holy Sabbath-day. There are no Sabbaths in hell.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/robert-murray-m-cheyne.html">Robert Murray M’Cheyne</a></span><span class="wk"><span class="lbl">Work:</span> <cite>I Love the Lord’s Day</cite>, (1841) in Andrew A. Bonar (ed.), Memoir and Remains of Robert Murray McCheyne, Minister of St. Peter’s Free Church, Dundee (Edinburgh: Oliphant Anderson &amp; Ferrier, 1892), pp 596-97.</span></figcaption>

living+fountains+of+waters.+When+he+joins+in+the+psalm+of+praise%2C+it+reminds+him+of+the+day+when+his+hands+shall+strike+the+harp+of+God.+Where+congregations+ne%E2%80%99er+break+up%2C+And+Sabbaths+have+no+end.%0A%0AWhen+he+retires%2C+and+meets+with+God+in+secret+in+his+closet%2C+or%2C+like+Isaac%2C+in+some+favourite+spot+near+his+dwelling%2C+it+reminds+him+of+the+day+when+%E2%80%9Che+shall+be+a+pillar+in+the+house+of+our+God%2C+and+go+no+more+out.%E2%80%9D+This+is+the+reason+why+we+love+the+Lord%E2%80%99s+day.+This+is+the+reason+why+we+%E2%80%9Ccall+the+Sabbath+a+delight.%E2%80%9D+A+well-spent+Sabbath+we+feel+to+be+a+day+of+heaven+upon+earth.+For+this+reason+we+wish+our+Sabbaths+to+he+wholly+given+to+God.+We+love+to+spend+the+whole+time+in+the+public+and+private+exercises+of+God%E2%80%99s+worship%2C+except+so+much+as+is+taken+up+in+the+works+of+necessity+and+mercy.+We+love+to+rise+early+on+that+morning%2C+and+to+sit+up+late%2C+that+we+may+have+a+long+day+with+God.%0A%0AHow+many+may+know+from+this+that+they+will+never+be+in+heaven%21+A+straw+on+the+surface+can+tell+which+way+the+stream+is+flowing.+Do+you+abhor+a+holy+Sabbath%3F+Is+it+a+kind+of+hell+to+you+to+be+with+those+who+are+strict+in+keeping+the+Lord%E2%80%99s+day%3F+The+writer+of+these+lines+once+felt+as+you+do.+You+are+restless+and+uneasy.+You+say%2C+%E2%80%9CBehold+what+a+weariness+is+it%21%E2%80%9D+%E2%80%9CWhen+will+the+Sabbath+be+gone%2C+that+we+may+sell+corn%3F%E2%80%9D+Ah%21+soon%2C+very+soon%2C+and+you+will+be+in+hell.+Hell+is+the+only+place+for+you.+Heaven+is+one+long%2C+never-ending%2C+holy+Sabbath-day.+There+are+no+Sabbaths+in+hell.%E2%80%9D%0A%0A%E2%80%94+Robert+Murray+M%E2%80%99Cheyne%2C+I+Love+the+Lord%E2%80%99s+Day%2C+%281841%29+in+Andrew+A.+Bonar+%28ed.%29%2C+Memoir+and+Remains+of+Robert+Murray+McCheyne%2C+Minister+of+St.+Peter%E2%80%99s+Free+Church%2C+Dundee+%28Edinburgh%3A+Oliphant+Anderson+%26+Ferrier%2C+1892%29%2C+pp+596-97.&amp;url=https%3A%2F%2F5solasquotes.github.io%2Fquote%2F3bc99e300d.html&amp;via=5Solas" target="_blank" rel="noopener">Share on X</a><a class="perma" href="../quote/3bc99e300d.html">Permalink</a><a class="src" href="https://reformedcovenanter.wordpress.com/2020/09/06/robert-murray-mccheyne-on-the-sabbath-as-a-type-of-heaven/" rel="noopener" target="_blank">Read it online · Reformed Covenanter</a></div>

<blockquote><p>Objection 2. Ordination and conformity, and common-prayers and ceremonies are connected with preaching, as one entire service; by partaking therefore of the one we contract the pollution of the other. Answer 1: What God Himself in a moral way joins together, no man may separate, only God Himself: But what God in nature has joined together, He gives us leave to separate, as chaff from wheat, etc. And so likewise for what man joins together, especially in the service of God and such matters thereof as God has not required; A set liturgy or stinted form of prayer for matter and words to be used (much less to be inseparably joined with preaching) is not required by the Lord, nor indeed is there any such necessary dependance by our laws… Answer 2… Nor are they so inseparably joined by our laws: But if they were, it is sufficient to my conscience that God has not so joined them. Our actings, and the reasons or grounds of them, are not to be interpreted in Church-matters by human laws; If they were, it would be difficult to inhabit in some commonwealths with a good conscience. Our living within the precincts of such a parish, our laws interpret as being of the same particular church with them for all Church-ordinances: but this being man’s law only, we judge ourselves not so necessarily involved by our habitation. A Church according to Scripture is a spiritual body: The limits are part of the essence and constitution of such a body, and therefore ought to be spiritual and of the same nature, and not merely human, as is the division of parishes.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/philip-nye.html">Philip Nye</a></span><span class="wk"><span class="lbl">Work:</span> <cite>A Case of Great &amp; Present Use</cite>, [Solemn League &amp;] Covenant &amp; Some of them [are] Supposed to be Scandalous in their Lives, Considered &amp; Affirmatively Resolved (1672; 1677), Consideration 3, pp. 20-22</span></figcaption>

<blockquote><p>But we desire to see your commandment why for every particular act, that in a large sense is idolatrous, adjoined to the true worship of God, we should forbear our presence at the worship itself, or be said to communicate in the sin there committed? For then no man might present himself with good conscience at any public worship of God where anything is done amiss, for matter or manner, which is in effect to say, he cannot be present at any at all. 4. To communicate in the ordinances of God with the ministers of the Church of England is not to like, approve or reverence the institutions of men in the exercises of religion, nor to communicate with the teacher in his sin, nor in ought else that is amiss. For the worship is of God both for matter and manner. … To eat of meats sacrificed unto idols in the idol temple is to communicate with idolaters. These things are evident and freely granted. But the assembly met to call upon God, in the mediation of Jesus Christ alone, to hear the doctrine of salvation,soundly and purely preached, to receive the sacrament rightly administered, is not a false idolatrous assembly: they that repair unto it be not idolatrous or false worshippers. If you esteem of them as they show themselves by outward signs, you must esteem them to be of the true religion, and the true worshippers of God according to his will; the ministry in that assembly to be true, sound and faithful and of God for substance.</p></blockquote>

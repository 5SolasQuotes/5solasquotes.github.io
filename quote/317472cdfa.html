<blockquote><p>Not only does Blessed John proceed in a sublime manner, but he also leads to sublime things. Sublime things are eternal goods. For temporal goods are puny and momentary. For 2 Corinthians 4:17 states: “Our present light affliction, which is for the moment, prepares for us an eternal weight of glory that is beyond measure in sublimity.” The teaching of John’s Gospel leads to this “sublime weight of glory.” For John 20:31 says: “These things have been written, so that you may believe that Jesus is … the Son of God, and that believing you may have life in his name.” That life is eternal and sublime, which “eye has not seen nor ear heard nor has it entered into the human heart.”

Therefore, the teaching of this Gospel is sublime. Moreover, it is fitting that its author is said to be sublime, not only sublime, but even exceedingly sublime, in the superlative. For if the sacred scriptures are more excellent than other writings, and the Gospel than all the parts of sacred scripture, and the Gospel of John than all the Gospels, then it follows that this book in an extraordinary way is more excellent than all other books.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/bonaventure.html">Bonaventure</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Commentary on the Gospel of John</cite>, trans. Robert J. Karris, Bonaventure Texts in Translation Series, vol. 11 (c. 1256; Saint Bonaventure NY: Franciscan Institute Publications, 2007), Pro. 7, pp 41-42.</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/worship.html">Worship</a></span></div>

<blockquote><p>There is no end of books, and yet we seem to need more every day. There was such a darkness brought in by the fall, as will not thoroughly be dispelled till we come to heaven; where the sun shineth without either cloud or night. For the present, all should contribute their help according to the rate and measure of their abilities. Some can only hold up a candle, others a torch; but all are useful.

The press is an excellent means to scatter knowledge, were it not so often abused. All complain there is enough written, and think that now there should be a stop. Indeed, it were well if in this scribbling age there were some restraint. Useless pamphlets are grown almost as great a mischief as the erroneous and profane. Yet ’tis not good to shut the door upon industry and diligence. There is yet room left to discover more, above all that hath been said, of the wisdom of God and the riches of his grace in the gospel; yea, more of the stratagems of Satan and the deceitfulness of man’s heart.

Means need to be increased every day to weaken sin and strengthen trust, and quicken us to holiness. Fundamentals are the same in all ages, but the constant necessities of the church and private Christians, will continually enforce a further explication. As the arts and slights of besieging and battering increase, so doth skill in the foundation. If we have no other benefit by the multitude of books that are written, we shall have this benefit: an opportunity to observe the various workings of the same Spirit about the same truths, and indeed the speculation is neither idle nor unfruitful.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/thomas-manton.html">Thomas Manton</a></span><span class="wk"><span class="lbl">Work:</span> <cite>To the Reader in Richard Sibbes, A Learned Commentary or Exposition upon the First Chapter of the Second Epistle of S. Paul to the Corinthians</cite></span></figcaption>

</figure><figure class="quote" id="q-df6d836378" data-kw="">
<blockquote><p>And, first, we may advert to the fact, that not only is the Church a spiritual community, by spiritual means aiming at a spiritual end, and that the functions performed by its members, as members of the Church, are all of a spiritual character, but also, that the standing which any member occupies within the Church depends on spiritual gifts and qualifications alone. The privileges we enjoy as members of it are the result of profession and character, not of civil or worldly status. The rich and poor meet together in the house of God; and the grave itself is not a more complete leveller of all earthly distinctions than the Church.

Men get together for worship—they partake of the sacraments, they bear rule in God’s house, not because they are rich, or noble, or learned, but because they are creatures of the same God, because they have the like precious faith, because they have the graces of the Divine Spirit. It is unquestionable that this is, or ought to be, the condition and character of every true Church. No powers except those which have the express sanction of God ought to have place in it.

The temptation to break in upon this levelling process—to suffer the distinctions which the world established between the rich and the poor, the noble and the mean—to obtain a place in the Church, has but too often prevailed to the destruction of the Church’s usefulness, and to the staining of its purity. We are too apt to forget that, as members of the Church, we are all brethren, and that no kind of authority but that which Christ himself has expressly conferred is to be exercised, or ought to be retained, by any of the brethren in the same faith.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/william-wilson.html">William Wilson</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Statement of the Scriptural Argument Against Patronage</cite>, (Edinburgh: John Johnstone, 1842), p. 31.</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/worship.html">Worship</a></span></div>

</figure><figure class="quote" id="q-069d42cd38" data-kw="">
<blockquote><p>Such as deny the morality of the Christian Sabbath, and profane it with all manner of sports, because the ancient day is changed by virtue of Christ’s resurrection. All these and other like them turn the grace of God into lasciviousness; that is, into all kind of licentious living. An Apostle gives this verdict of them, They were of old ordained to condemnation.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/william-gouge.html">William Gouge</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The progress of divine providence, set out in a sermon preached in the Abbey Church of Westminster before the House of Peers, on the 24th of September, 1645. being the day of their monthly fast</cite>, (London: Joshua Kirton, 1645), pp 27-28.</span></figcaption>

</figure><figure class="quote" id="q-e4f17b278c" data-kw="">
<blockquote><p>Legislating upon, and even against, the Word of God, is the burning, yea, the damning spot on Britain’s escutcheon. A part of the daily wailings of Cassandra, as she roamed throughout her father’s halls, is given us by the poet, thus – “Cry, Trojans, cry, a Helen and a woe.” Cassandra-like, my wail is, cry, Britain, cry, legislation upon and against the Bible, and a woe; cry, Britain, cry, the national support given to Popery, Prelacy, and Erastianism, and a woe; cry, Britain, cry, shameful Sabbath desecration, and a woe; cry, Britain, cry, the yet unconfessed and unrepented of, act of national apostacy and perjury, when the Solemn League and National Covenant were publicly burned at Linlithgow, May 29 1661 (an act acquiesced in by every church in the Three Kingdoms with the exception of the R. P. Church), and a woe! “Hear, O earth: behold, I will bring evil upon this people, even the fruit of their thoughts, because they have not hearkened unto my words, nor to my law, but rejected it” (Jer. vi. 19).</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/samuel-simms.html">Samuel Simms</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Bible, the church, and terms of communion: together with the terms of communion of the Reformed Presbyterian Church in Ireland. To which is appended the Cameronian Dream</cite>, (Belfast, 1879), p. 16.</span></figcaption>

<div class="actions"><button class="copy" data-copy="“Legislating upon, and even against, the Word of God, is the burning, yea, the damning spot on Britain’s escutcheon. A part of the daily wailings of Cassandra, as she roamed throughout her father’s halls, is given us by the poet, thus – “Cry, Trojans, cry, a Helen and a woe.” Cassandra-like, my wail is, cry, Britain, cry, legislation upon and against the Bible, and a woe; cry, Britain, cry, the national support given to Popery, Prelacy, and Erastianism, and a woe; cry, Britain, cry, shameful Sabbath desecration, and a woe; cry, Britain, cry, the yet unconfessed and unrepented of, act of national apostacy and perjury, when the Solemn League and National Covenant were publicly burned at Linlithgow, May 29 1661 (an act acquiesced in by every church in the Three Kingdoms with the exception of the R. P. Church), and a woe! “Hear, O earth: behold, I will bring evil upon this people, even the fruit of their thoughts, because they have not hearkened unto my words, nor to my law, but rejected it” (Jer. vi. 19).”

— Samuel Simms, The Bible, the church, and terms of communion: together with the terms of communion of the Reformed Presbyterian Church in Ireland. To which is appended the Cameronian Dream, (Belfast, 1879), p. 16.">Copy</button><a class="share" href="https://x.com/intent/post?text=%E2%80%9CLegislating+upon%2C+and+even+against%2C+the+Word+of+God%2C+is+the+burning%2C+yea%2C+the+damning+spot+on+Britain%E2%80%99s+escutcheon.+A+part+of+the+daily+wailings+of+Cassandra%2C+as+she+roamed+throughout+her+father%E2%80%99s+halls%2C+is+given+us+by+the+poet%2C+thus+%E2%80%93+%E2%80%9CCry%2C+Trojans%2C+cry%2C+a+Helen+and+a+woe.%E2%80%9D+Cassandra-like%2C+my+wail+is%2C+cry%2C+Britain%2C+cry%2C+legislation+upon+and+against+the+Bible%2C+and+a+woe%3B+cry%2C+Britain%2C+cry%2C+the+national+support+given+to+Popery%2C+Prelacy%2C+and+Erastianism%2C+and+a+woe%3B+cry%2C+Britain%2C+cry%2C+shameful+Sabbath+desecration%2C+and+a+woe%3B+cry%2C+Britain%2C+cry%2C+the+yet+unconfessed+and+unrepented+of%2C+act+of+national+apostacy+and+perjury%2C+when+the+Solemn+League+and+National+Covenant+were+publicly+burned+at+Linlithgow%2C+May+29+1661+%28an+act+acquiesced+in+by+every+church+in+the+Three+Kingdoms+with+the+exception+of+the+R.+P.+Church%29%2C+and+a+woe%21+%E2%80%9CHear%2C+O+earth%3A+behold%2C+I+will+bring+evil+upon+this+people%2C+even+the+fruit+of+their+thoughts%2C+because+they+have+not+hearkened+unto+my+words%2C+nor+to+my+law%2C+but+rejected+it%E2%80%9D+%28Jer.+vi.+19%29.%E2%80%9D%0A%0A%E2%80%94+Samuel+Simms%2C+The+Bible%2C+the+church%2C+and+terms+of+communion%3A+together+with+the+terms+of+communion+of+the+Reformed+Presbyterian+Church+in+Ireland.+To+which+is+appended+the+Cameronian+Dream%2C+%28Belfast%2C+1879%29%2C+p.+16.&amp;url=https%3A%2F%2F5solasquotes.github.io%2Fquote%2Fe4f17b278c.html&amp;via=5Solas" target="_blank" rel="noopener">Share on X</a><a class="perma" href="../quote/e4f17b278c.html">Permalink</a><a class="src" href="https://reformedcovenanter.wordpress.com/2012/01/22/samuel-simms-on-britains-hatred-for-the-word-of-god/" rel="noopener" target="_blank">Read it online · Reformed Covenanter</a></div>

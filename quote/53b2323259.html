<main class="wrap"><figure class="quote" id="q-53b2323259" data-kw="">
<blockquote><p>The philosophers, among whom was Aristotle, because being devoid of revelation, they could not reach to the first man, thought of an infinite subordination of men, and at the same time, of the eternity of the world. Democritus is reported to have stated that men crawled forth from the earth like maggots. Epicurus said that man was a composite of the fortuitous confluence of atoms, and in addition that they arose from the earth like fungi, and are daily animated by the certain position of the stars. Paracelsus [d. 1541], besides the human posterity of Adam, numbered four other non-Adamic races of men, and assigned them to each of the elements…</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/petrus-van-mastricht.html">Petrus van Mastricht</a></span><span class="wk"><span class="lbl">Work:</span> <cite>‘Do All Men Owe their Origin to the One Adam?’ in Theoretical-Practical Theology (RHB), vol. 3, ch. 9, section 13</cite></span></figcaption>
<div class="meta"><span class="t"><a href="../topics/creation/the-six-days.html">The Six Days</a></span></div>

</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-07d6bf612a" data-kw="">
<blockquote><p>15. Argument 9 [of Rutherford against an Arminian conception of the antecedent will of God]: If such an antecedent will, by which He naturally wills good to the creature, belongs to God, then by the same reasoning God by an antecedent will willed the existence of the creature and from eternity willed the creation of the world by the impulse of nature. But then why did God for infinite ages before the creation of the world not satisfy that natural volition? What resisted God here? Not the world, not men, not a defect of matter. They will say that God’s absolute will resisted the natural will: But how absurd? Christians argue against Aristotle, Proclus and others that God created the world freely. Therefore He could have from eternity not have created, and such a will was in vain for eternity; and by equal reasoning God eternally wills the τὸ esse [being] of infinite worlds and of infinite men and angels… Indeed, because attributes in God are necessary and eternal, they never begin, they never cease; from eternity God naturally willed all men to be saved, and indeed naturally, and consequently by necessity of nature He created the world and could not have not created it.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/samuel-rutherford.html">Samuel Rutherford</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Apologetic Exercitations (Amsterdam: Laurentius, 1636), Exercise 2, ch. 4, ‘On the Antecedent &amp; Consequent Will of God’, pp. 323-63 tr. AI by The Faith Received Latin</cite></span></figcaption>
<div class="meta"><span class="t"><a href="../topics/creation/the-six-days.html">The Six Days</a></span></div>

</figure><figure class="quote" id="q-81ed76e0e9" data-kw="">
<blockquote><p>Some things were created in themselves, others in their causes, such as meteors; animals that arise from the commixture of species, like mules, leopards; and according to some, insects, which are thought, but falsely, to be made from putrefaction. Some things are co-created rather than created, such as accidents and adjuncts in their subjects; universals in their species and individuals; time and place or space, in which creatures are received.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/barthold-holtzfus.html">Barthold Holtzfus</a></span><span class="wk"><span class="lbl">Work:</span> <cite>‘Theological Dissertation on Creation’ (Frankfurt: Steppinus, 1706), trans. AI Latin</cite></span></figcaption>
<div class="meta"><span class="t"><a href="../topics/creation/the-six-days.html">The Six Days</a></span></div>

</figure><figure class="quote" id="q-7ca6866edf" data-kw="">
<blockquote><p>The judgments of God do not always follow crimes, as thunder does lightning, but sometimes the space of many ages coming between. When the sun has shined fair the space of six days upon their tabernacle, we know not what clouds the seventh may bring. And when their punishment does come, let them make their account, in the greatness of their sufferings to pay the interest of that respite which has been given them.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/richard-hooker.html">Richard Hooker</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Works of Mr. Richard Hooker… in Eight Books of Ecclesiastical Polity (d. 1600; London: Newcomb, 1666), A Remedy against Sorrow &amp; Fear, delivered in a Funeral Sermon, p. 546 Note Hooker’s use of the phrase here is not limited to natural days.</cite></span></figcaption>
<div class="meta"><span class="t"><a href="../topics/creation/the-six-days.html">The Six Days</a></span></div>

</figure><figure class="quote" id="q-1072d9342b" data-kw="">

<main class="wrap"><figure class="quote" id="q-434a2843e4" data-kw="">
<blockquote><p>[Rutherford’s Anglican opponents said:] ‘Notwithstanding, that crossing, kneeling, surplice, human holy days occasion the soul-murder of him for whom Christ died, yet we the Prelates command the practice of the foresaid ceremonies as good and expedient for edification, for our commandment makes the murdering of our brethren, to be obedience to the Fifth Commandment.’ [Rutherford responds:] But if Prelates may command that which would be otherwise, without, or before the Commandment [of God], [even] spiritual murdering and scandalizing of our brother, they may command also that which would be otherwise without or before their command: adultery against the Seventh, and theft against the Eighth, and Perjury and lying against the Ninth Commandment, and concupiscence against the Tenth; for the Fifth Commandment has the precedency before the Seventh, Eighth, Ninth and Tenth Commandments no less than before the Sixth, which forbids the killing of our brother’s soul.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/samuel-rutherford.html">Samuel Rutherford</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Divine Right of Church Government</cite>, … (1646), Question 4, ‘Whether the Precept of Obedience to Superiors, or the Precept of Eschewing Scandal be More Obligatory?’, p. 47</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/church-government-and-the-ministry/synods-and-assemblies.html">Synods and Assemblies</a></span></div>

<blockquote><p>13. For the Spirit dictates [by illumination] both unto the Church, as well what is profitable for avoiding of scandal, as also that those things which are commanded for avoiding of scandal, are neither the worship of God, nor yet necessary to be observed without the case of scandal and contumacy, as appears by those sayings (1 Cor. 7:6, 35): ‘I speake this by permission, not by commandement. This I speak for your own commodity, not to entangle you in a snare, but that you follow that which is honest, and that you may cleave fast unto the Lord without separation.&#x27;</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/gabriel-powel.html">Gabriel Powel</a></span><span class="wk"><span class="lbl">Work:</span> <cite>De adiaphoris, Theological &amp; Scholastical Positions concerning the Nature &amp; Use of Things Indifferent. Where also is Methodically &amp; Briefely Handled, of Civil &amp; Ecclesiastical Magistrates, of Human Laws, of Christian Liberty, of Scandal &amp; of the Worship of God</cite>, … (London, 1607), ch. 11, ‘A Solution of the Objections opposed by the Refractary Ministers’, pp. 73-74 Powel (baptised 1576–1611) was a Welsh Anglican minister.</span></figcaption>

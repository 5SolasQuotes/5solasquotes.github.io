<blockquote><p>For the first: the calling of God is either particular or general. The particular is to serve God in some set function of outward life, and so is the 〈…〉. The general calling is to the service of 〈…〉 with promise of eternal reward through the 〈…〉 Christ. This general calling is likewise of three sorts:

1. External.

2. Internal: or both 3. external and internal.

1. The external alone is called common and ineffectual: the 2nd and 3rd is called singular and effectual.

1. The outward calling is the work of God’s grace in his Word, offering Christ and calling upon all sorts of men to reform their ways and receive Christ, and yield obedience to God’s holy will to their salvation, if they will obey.

2. The inward calling is the work of God’s Spirit, effectually stirring up and persuading the elect to hear and obey, and receive Christ unto salvation.

3. The calling that is both inward and outward is the action of God both by his Word and Spirit, calling out his elect by name particularly and persuading them to separate from the world and receive the covenant of God’s grace in Christ, and to devote themselves to holiness of life;</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/nicholas-byfield.html">Nicholas Byfield</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Commentary on 1 &amp; 2 Peter</cite>, (London: Miles, 1637) | on 1 Pet. 1:15, pp. 119-20</span></figcaption>

<blockquote><p>1… And the first word ‘vocation’ is taken often for God’s act of calling when it has no success, and this is called uneffectual calling. So it is used, Prov. 1:24, ‘Because I called and ye refused, I have stretched forth my hands and no man regarded; But ye have set at nought all my counsel, and would none of my reproof.’ So Isa. 65:12; Jer. 7:13, ‘I called, but ye answered not,’ and many other places: Sometimes it is taken for the act of God when it is successful; as 1 Thess. 2:12 and many more places: 2. This success itself is termed our calling in a passive sense: and it is twofold:

1. Common; when men are brought but to outward profession and common gifts; and so the word is used often.

2. Special; when men are savingly converted to Christ; The former is common effectual calling; the latter is special effectual calling: and this last is the same with conversion:</p></blockquote>

</figure><figure class="quote" id="q-0f42ee50a7" data-kw="">
<blockquote><p>Doctrine 3. All those, and those alone, make their election sure that make their calling sure. These two God has joined together, as the apostle does in this place, so that no man ought or may disjoin them. Hence election and calling are taken sometimes in the Scriptures for one and the same, as 1 Cor. 1:26-27, that which is called ‘calling,’ verse 26, is called ‘election,’ verse 27. There is indeed an outward and ineffectual calling, which is many times separated from election, as when it is said, ‘Many are called, but few are chosen.’ But effectual and saving calling has always a sure connection with election, Rom. 8:3•[30?] and 11:28-29.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/william-ames.html">William Ames</a></span><span class="wk"><span class="lbl">Work:</span> <cite>An Analytical Exposition of both the Epistles of the Apostle Peter</cite>, ... (London: E.G., 1641), on 2 Pet. 1:10-11, p. 164</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/effectual-calling/external-and-internal-call.html">External and Internal Call</a></span></div>

<blockquote><p>2. Why this He does (say others in the second place) by offering Himself to all, offering grace and mercy, life and salvation to all upon the condition of believing. (Omnes vocat, et omnibus salutem offert. Ferus. Mt. 23) True, such an offer Christ makes unto all, all those whom He sends the Gospel to. And so He may be said to draw all men, calling, inviting them to come unto Him; so did He draw Jerusalem in the days of his flesh, ‘O Jerusalem, how often would I have gathered thee?’ And thus He draws all those that are within the pale of the Church, the sound of the Gospel. (Musculus at the location; Ferus at the location) I dare not say with some, Quantum in se est, trahit, that as much as in Him lies, He draws all men; no, I know that if Christ put forth his power, he can overpower the soul of the most obstinate and rebellious sinner, and cause Him to come in, and that willingly: Thy people shall be willing in the day of thy powers, Ps. 110:3. When Christ puts forth the arm of his power, accompanying his Word with his Spirit (for that is the day of Christ’s power) then shall his call be effectual, all that are so called shall come to Him, and that willingly. (Isa. 65:2, Pro omnibus in cruce pependit, et omnes quantum in se est, expansis ad se brachiis veluti trahit. Musculus on Mt. 28:19 &amp; Mk. 16:15) Thus Christ does not draw all men; yet outwardly He does, offering Himself alike to all. So He did upon the cross, where his arms were extended and spread abroad, as inviting all, willing and ready to receive and embrace all that should come to Him. There behold the Son of man lift up, and drawing all men unto Him; this He does more clearly in the preaching of the Gospel, which He requires to be published to all nations, to every creature under heaven. There He makes known Himself, offers himself to all that will receive Him, inviting, persuading them to come to Him to believe on Him. Thus He draws all in respect of an outward call; that this drawing proves ineffectual to some, to many, to the most, the fault is their own in that they do not hearken to this call, they will not follow him drawing, but draw back; ‘I would have gathered you, but ye would not,’ (Mt. 23:37) says our Savior to Jerusalem. In the mean time, Christ draws them outwardly. Thus He draws all; not that he intends to save all, but that by this means He may draw forth his elect out of all, and bring them home to Himself, even as the fisherman (the similitude illustrates it well) in drawing of his net, his drag, he draws all that comes within the compass of it, not only good fish, but weeds and stones, and mud; and wherefore does He this? why, it is for the good fishes’ sake; that what is good He may save. (Mt. 13:47) Even thus is it with Christ’s dragnet, the preaching of the Gospel; The Kingdome of Heaven is like unto a net (says our Savior): It draws all that come within the reach and compass of it, Christ offering grace and mercy alike to all. But wherefore this? why, it is for the elect’s sake: that Christ may save those which are his by that means singling and drawing them out of the world and bringing them effectually home to Himself. He draws all, that He may save some; draws all outwardly by his Word, that by his Spirit accompanying his Word, He may draw his elect out of all, making that his drawing effectual to them, to all of them. Thus Christ draws all men, a truth, but not the whole truth here intended. The drawing which our Savior here speaks of, I look upon it as an inward and effectual work, a drawing and bringing of men home unto Himself, to believe on Him.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/john-brinsley.html">John Brinsley</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Mystical Brasen Serpent</cite>, ... (London: Maxey, 1653), ‘The Magnetic Virtue of the Cross of Jesus Christ’, pp. 146-48</span></figcaption>

<div class="actions"><button class="copy" data-copy="“2. Why this He does (say others in the second place) by offering Himself to all, offering grace and mercy, life and salvation to all upon the condition of believing. (Omnes vocat, et omnibus salutem offert. Ferus. Mt. 23) True, such an offer Christ makes unto all, all those whom He sends the Gospel to. And so He may be said to draw all men, calling, inviting them to come unto Him; so did He draw Jerusalem in the days of his flesh, ‘O Jerusalem, how often would I have gathered thee?’ And thus He draws all those that are within the pale of the Church, the sound of the Gospel. (Musculus at the location; Ferus at the location) I dare not say with some, Quantum in se est, trahit, that as much as in Him lies, He draws all men; no, I know that if Christ put forth his power, he can overpower the soul of the most obstinate and rebellious sinner, and cause Him to come in, and that willingly: Thy people shall be willing in the day of thy powers, Ps. 110:3. When Christ puts forth the arm of his power, accompanying his Word with his Spirit (for that is the day of Christ’s power) then shall his call be effectual, all that are so called shall come to Him, and that willingly. (Isa. 65:2, Pro omnibus in cruce pependit, et omnes quantum in se est, expansis ad se brachiis veluti trahit. Musculus on Mt. 28:19 &amp; Mk. 16:15) Thus Christ does not draw all men; yet outwardly He does, offering Himself alike to all. So He did upon the cross, where his arms were extended and spread abroad, as inviting all, willing and ready to receive and embrace all that should come to Him. There behold the Son of man lift up, and drawing all men unto Him; this He does more clearly in the preaching of the Gospel, which He requires to be published to all nations, to every creature under heaven. There He makes known Himself, offers himself to all that will receive Him, inviting, persuading them to come to Him to believe on Him. Thus He draws all in respect of an outward call; that this drawing proves ineffectual to some, to many, to the most, the fault is their own in that they do not hearken to this call, they will not follow him drawing, but draw back; ‘I would have gathered you, but ye would not,’ (Mt. 23:37) says our Savior to Jerusalem. In the mean time, Christ draws them outwardly. Thus He draws all; not that he intends to save all, but that by this means He may draw forth his elect out of all, and bring them home to Himself, even as the fisherman (the similitude illustrates it well) in drawing of his net, his drag, he draws all that comes within the compass of it, not only good fish, but weeds and stones, and mud; and wherefore does He this? why, it is for the good fishes’ sake; that what is good He may save. (Mt. 13:47) Even thus is it with Christ’s dragnet, the preaching of the Gospel; The Kingdome of Heaven is like unto a net (says our Savior): It draws all that come within the reach and compass of it, Christ offering grace and mercy alike to all. But wherefore this? why, it is for the elect’s sake: that Christ may save those which are his by that means singling and drawing them out of the world and bringing them effectually home to Himself. He draws all, that He may save some; draws all outwardly by his Word, that by his Spirit accompanying his Word, He may draw his elect out of all, making that his drawing effectual to them, to all of them. Thus Christ draws all men, a truth, but not the whole truth here intended. The drawing which our Savior here speaks of, I look upon it as an inward and effectual work, a drawing and bringing of men home unto Himself, to believe on Him.”

— John Brinsley, The Mystical Brasen Serpent... (London: Maxey, 1653), ‘The Magnetic Virtue of the Cross of Jesus Christ’, pp. 146-48">Copy</button><a class="share" href="https://x.com/intent/post?text=%E2%80%9C2.+Why+this+He+does+%28say+others+in+the+second+place%29+by+offering+Himself+to+all%2C+offering+grace+and+mercy%2C+life+and+salvation+to+all+upon+the+condition+of+believing.+%28Omnes+vocat%2C+et+omnibus+salutem+offert.+Ferus.+Mt.+23%29+True%2C+such+an+offer+Christ+makes+unto+all%2C+all+those+whom+He+sends+the+Gospel+to.+And+so+He+may+be+said+to+draw+all+men%2C+calling%2C+inviting+them+to+come+unto+Him%3B+so+did+He+draw+Jerusalem+in+the+days+of+his+flesh%2C+%E2%80%98O+Jerusalem%2C+how+often+would+I+have+gathered+thee%3F%E2%80%99+And+thus+He+draws+all+those+that+are+within+the+pale+of+the+Church%2C+the+sound+of+the+Gospel.+%28Musculus+at+the+location%3B+Ferus+at+the+location%29+I+dare+not+say+with+some%2C+Quantum+in+se+est%2C+trahit%2C+that+as+much+as+in+Him+lies%2C+He+draws+all+men%3B+no%2C+I+know+that+if+Christ+put+forth+his+power%2C+he+can+overpower+the+soul+of+the+most+obstinate+and+rebellious+sinner%2C+and+cause+Him+to+come+in%2C+and+that+willingly%3A+Thy+people+shall+be+willing+in+the+day+of+thy+powers%2C+Ps.+110%3A3.+When+Christ+puts+forth+the+arm+of+his+power%2C+accompanying+his+Word+with+his+Spirit+%28for+that+is+the+day+of+Christ%E2%80%99s+power%29+then+shall+his+call+be+effectual%2C+all+that+are+so+called+shall+come+to+Him%2C+and+that+willingly.+%28Isa.+65%3A2%2C+Pro+omnibus+in+cruce+pependit%2C+et+omnes+quantum+in+se+est%2C+expansis+ad+se+brachiis+veluti+trahit.+Musculus+on+Mt.+28%3A19+%26+Mk.+16%3A15%29+Thus+Christ+does+not+draw+all+men%3B+yet+outwardly+He+does%2C+offering+Himself+alike+to+all.+So+He+did+upon+the+cross%2C+where+his+arms+were+extended+and+spread+abroad%2C+as+inviting+all%2C+willing+and+ready+to+receive+and+embrace+all+that+should+come+to+Him.+There+behold+the+Son+of+man+lift+up%2C+and+drawing+all+men+unto+Him%3B+this+He+does+more+clearly+in+the+preaching+of+the+Gospel%2C+which+He+requires+to+be+published+to+all+nations%2C+to+every+creature+under+heaven.+There+He+makes+known+Himself%2C+offers+himself+to+all+that+will+receive+Him%2C+inviting%2C+persuading+them+to+come+to+Him+to+believe+on+Him.+Thus+He+draws+all+in+respect+of+an+outward+call%3B+that+this+drawing+proves+ineffectual+to+some%2C+to+many%2C+to+the+most%2C+the+fault+is+their+own+in+that+they+do+not+hearken+to+this+call%2C+they+will+not+follow+him+drawing%2C+but+draw+back%3B+%E2%80%98I+would+have+gathered+you%2C+but+ye+would+not%2C%E2%80%99+%28Mt.+23%3A37%29+says+our+Savior+to+Jerusalem.+In+the+mean+time%2C+Christ+draws+them+outwardly.+Thus+He+draws+all%3B+not+that+he+intends+to+save+all%2C+but+that+by+this+means+He+may+draw+forth+his+elect+out+of+all%2C+and+bring+them+home+to+Himself%2C+even+as+the+fisherman+%28the+similitude+illustrates+it+well%29+in+drawing+of+his+net%2C+his+drag%2C+he+draws+all+that+comes+within+the+compass+of+it%2C+not+only+good+fish%2C+but+weeds+and+stones%2C+and+mud%3B+and+wherefore+does+He+this%3F+why%2C+it+is+for+the+good+fishes%E2%80%99+sake%3B+that+what+is+good+He+may+save.+%28Mt.+13%3A47%29+Even+thus+is+it+with+Christ%E2%80%99s+dragnet%2C+the+preaching+of+the+Gospel%3B+The+Kingdome+of+Heaven+is+like+unto+a+net+%28says+our+Savior%29%3A+It+draws+all+that+come+within+the+reach+and+compass+of+it%2C+Christ+offering+grace+and+mercy+alike+to+all.+But+wherefore+this%3F+why%2C+it+is+for+the+elect%E2%80%99s+sake%3A+that+Christ+may+save+those+which+are+his+by+that+means+singling+and+drawing+them+out+of+the+world+and+bringing+them+effectually+home+to+Himself.+He+draws+all%2C+that+He+may+save+some%3B+draws+all+outwardly+by+his+Word%2C+that+by+his+Spirit+accompanying+his+Word%2C+He+may+draw+his+elect+out+of+all%2C+making+that+his+drawing+effectual+to+them%2C+to+all+of+them.+Thus+Christ+draws+all+men%2C+a+truth%2C+but+not+the+whole+truth+here+intended.+The+drawing+which+our+Savior+here+speaks+of%2C+I+look+upon+it+as+an+inward+and+effectual+work%2C+a+drawing+and+bringing+of+men+home+unto+Himself%2C+to+believe+on+Him.%E2%80%9D%0A%0A%E2%80%94+John+Brinsley%2C+The+Mystical+Brasen+Serpent...+%28London%3A+Maxey%2C+1653%29%2C+%E2%80%98The+Magnetic+Virtue+of+the+Cross+of+Jesus+Christ%E2%80%99%2C+pp.+146-48&amp;url=https%3A%2F%2F5solasquotes.github.io%2Fquote%2F8fe40ba3a1.html&amp;via=5Solas" target="_blank" rel="noopener">Share on X</a><a class="perma" href="../quote/8fe40ba3a1.html">Permalink</a><a class="src" href="https://reformedbooksonline.com/on-ineffectual-calling/#:~:text=2.%20Why%20this%20He%20does%20%28say,unto%20Himself%2C%20to%20believe%20on%20Him&amp;text=2.%20Why%20this%20He%20does%20%28say%20others%20in&amp;text=men%20home%20unto%20Himself%2C%20to%20believe%20on%20Him" rel="noopener" target="_blank">Read it online · Reformed Books Online</a></div>

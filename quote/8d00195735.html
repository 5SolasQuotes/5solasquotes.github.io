<main class="wrap"><figure class="quote" id="q-8d00195735" data-kw="">
<blockquote><p>3. It is not impossible that one act should be so high and intense in its kind as to induce a habit into the subject, and so Adam’s nature be vitiated by it; and he begot a son in his own likeness. The devils upon one sin became obstinate in all the wickedness that their nature is capable of. (2.) This one act was a breach of covenant with God, upon the tenor and observation whereof depended the enjoyment of all that strength and rectitude with God wherewith, by the law of his creation, man was endued, (3.) All man’s covenant good, for that eternal end to which he was created, depended upon his conformity to God, his subjection to him, and dependence on him; all which, by that one sin, he wilfully cast away for himself and posterity (whose common, natural, and federal head he was), and righteously fell into that condition which we have described. (4.) The apostle is much of a different mind from our catechists, Rom. v. 15, 16, etc., as hath been declared.

4. What is credible concerning God and his goodness with these gentlemen I know not. To me, that is not only in itself credible which lie hath revealed concerning himself, but of necessity to be believed. That he gave man a law, threatening him, and all his posterity in him and with him, with eternal death upon the breach of it; that upon that sin he cast all mankind judicially out of covenant, imputing that sin unto them all unto the guilt of condemnation, seeing it is “his judgment that they who commit sin are worthy of death;” and that ” he is of purer eyes than to behold evil,” — is to us credible, yea, as was said, of necessity to be believed. But they will answer the proofs that are produced from Scripture in the asserting of this original sin.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/john-owen.html">John Owen</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Vindiciæ Evangelicæ; or, The Mystery of the Gospel Vindicated and Socinianism Examined</cite>, (Oxford, 1655) in William H. Goold (ed.), The Works of John Owen (1850-53; 16 vols, Edinburgh: Banner of Truth, 1966), xii, 165.</span></figcaption>

<blockquote><p>CHAP. XVI. Of the Covenant of Works. Righteousness thus set forth in his several parts and branches, has of God’s free goodness a reward belonging to it, (whereupon the same called the Law, or covenant of works;) as contrariwise a punishment in his Justice to those that sin against it: both more or less, as the righteousness or sin abounds. The reward is blessedness, which is the having of all things that make the creature happy, and stands in the fruition of God’s love, or, from thence coming, a conjunction and communion with him. Conjunction is the enjoying of his personal presence. Communion is a participation (in some sort) of his blessedness both kingdom power and glory.</p></blockquote>

</figure><figure class="quote" id="q-1c0bcdb3ca" data-kw="">
<blockquote><p>God graciously entered into a covenant with holy Adam, and with his posterity in him, to the effect, that if he obeyed the command not to eat of the forbidden fruit, he should receive as his reward indefectibility of holiness and blessedness.

This is proved by Gen. 2:17, “In the day thou eatest thereof thou shalt surely die;” which implies the converse, “If thou dost not eat thereof, thou shalt surely live.” The “life” here implied and promised is a good additional to what Adam already had; otherwise it would not be a reward.

Adam already had spiritual life, namely holiness and happiness; but it was mutable. The additional good, therefore, must have been immutable holiness and happiness. He was to have had spiritual life as indefectible. He was to have passed beyond all possibility of apostasy and misery.

The merit to be acquired under the covenant of works was pactional. Adam could claim the reward, in case he stood, only by virtue of the promise of God; not by virtue of the original relation of a creature to the creator. Upon the latter basis, he could claim nothing, as Christ teaches in Luke 17:10.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/william-g-t-shedd.html">William G.T. Shedd</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Dogmatic Theology</cite>, (Edinburgh: T &amp; T Clark, 1889), 2: 152-53.</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/the-covenant-of-works.html">The Covenant of Works</a></span></div>

</figure><figure class="quote" id="q-cfc49c921c" data-kw="">
<blockquote><p>True it is, that if man had persisted in the state of his created integrity, he might, after an improper manner, be said to have merited the glory which he was after to enjoy, inasmuch as he was to obtain it in the virtue of those legal operations, unto which he was, by the abilities of his own nature, without the special influence of a supernatural infused grace, fitted and disposed; though even this was not from the dignity and value of our work, but from the indulgence of Almighty God, who would set no higher price on that glory, which he proposed unto man for the object of his desires, and reward of his works.

For if we go exactly unto the first rule of justice unqualified with clemency and bounty, it could not possibly be, that God should be bound to requite our labours with eternal bliss; there being so vast a disproportion between the fruition of God, an infinite good, and any the most excellent, yet still limited operation of the creature. For as water in its own nature riseth no farther than the spring whence it first issueth; so the endeavours of nature could never have raised man, without a mixture of God’s mercy, unto a higher degree of happiness, than should have been proportionable to the quality of his work.

But now having in Adam utterly disabled ourselves to pay that small price, at which God was pleased to rate our glory; all those who are restored thereunto again, must acknowledge both it, and Christ the purchaser of it, as a free gift of Almighty God, by them so far undeserved, as he was, before the promise, unknown and unexpected. …

Even Adam in innocency could not be without an assent and firm belief, that the faithful God would perform the promise of life, made and annexed unto the covenant of works. But this faith could not be the merit of life, but the fruit and effect of merit, or rather obedience anteceding; for his performance of the law (in the right whereof he had interest unto glory) preceding, there should immediately from thence have issued, by faith, a prepossession (as it were) and pre-apprehension of that glory, which, by virtue of that legal obedience, he should have had interest unto.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/edward-reynolds.html">Edward Reynolds</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Meditations on the Holy Sacrament of the Lord’s Last Supper</cite>, (1638) in The Whole Works of the Right Rev. Edward Reynolds, D.D., ed. Alexander Chalmers (6 vols, London, 1826), iii, 59, 60.</span></figcaption>

— Edward Reynolds, Meditations on the Holy Sacrament of the Lord’s Last Supper, (1638) in The Whole Works of the Right Rev. Edward Reynolds, D.D., ed. Alexander Chalmers (6 vols, London, 1826), iii, 59, 60.">Copy</button><a class="share" href="https://x.com/intent/post?text=%E2%80%9CTrue+it+is%2C+that+if+man+had+persisted+in+the+state+of+his+created+integrity%2C+he+might%2C+after+an+improper+manner%2C+be+said+to+have+merited+the+glory+which+he+was+after+to+enjoy%2C+inasmuch+as+he+was+to+obtain+it+in+the+virtue+of+those+legal+operations%2C+unto+which+he+was%2C+by+the+abilities+of+his+own+nature%2C+without+the+special+influence+of+a+supernatural+infused+grace%2C+fitted+and+disposed%3B+though+even+this+was+not+from+the+dignity+and+value+of+our+work%2C+but+from+the+indulgence+of+Almighty+God%2C+who+would+set+no+higher+price+on+that+glory%2C+which+he+proposed+unto+man+for+the+object+of+his+desires%2C+and+reward+of+his+works.%0A%0AFor+if+we+go+exactly+unto+the+first+rule+of+justice+unqualified+with+clemency+and+bounty%2C+it+could+not+possibly+be%2C+that+God+should+be+bound+to+requite+our+labours+with+eternal+bliss%3B+there+being+so+vast+a+disproportion+between+the+fruition+of+God%2C+an+infinite+good%2C+and+any+the+most+excellent%2C+yet+still+limited+operation+of+the+creature.+For+as+water+in+its+own+nature+riseth+no+farther+than+the+spring+whence+it+first+issueth%3B+so+the+endeavours+of+nature+could+never+have+raised+man%2C+without+a+mixture+of+God%E2%80%99s+mercy%2C+unto+a+higher+degree+of+happiness%2C+than+should+have+been+proportionable+to+the+quality+of+his+work.%0A%0ABut+now+having+in+Adam+utterly+disabled+ourselves+to+pay+that+small+price%2C+at+which+God+was+pleased+to+rate+our+glory%3B+all+those+who+are+restored+thereunto+again%2C+must+acknowledge+both+it%2C+and+Christ+the+purchaser+of+it%2C+as+a+free+gift+of+Almighty+God%2C+by+them+so+far+undeserved%2C+as+he+was%2C+before+the+promise%2C+unknown+and+unexpected.+%E2%80%A6%0A%0AEven+Adam+in+innocency+could+not+be+without+an+assent+and+firm+belief%2C+that+the+faithful+God+would+perform+the+promise+of+life%2C+made+and+annexed+unto+the+covenant+of+works.+But+this+faith+could+not+be+the+merit+of+life%2C+but+the+fruit+and+effect+of+merit%2C+or+rather+obedience+anteceding%3B+for+his+performance+of+the+law+%28in+the+right+whereof+he+had+interest+unto+glory%29+preceding%2C+there+should+immediately+from+thence+have+issued%2C+by+faith%2C+a+prepossession+%28as+it+were%29+and+pre-apprehension+of+that+glory%2C+which%2C+by+virtue+of+that+legal+obedience%2C+he+should+have+had+interest+unto.%E2%80%9D%0A%0A%E2%80%94+Edward+Reynolds%2C+Meditations+on+the+Holy+Sacrament+of+the+Lord%E2%80%99s+Last+Supper%2C+%281638%29+in+The+Whole+Works+of+the+Right+Rev.+Edward+Reynolds%2C+D.D.%2C+ed.+Alexander+Chalmers+%286+vols%2C+London%2C+1826%29%2C+iii%2C+59%2C+60.&amp;url=https%3A%2F%2F5solasquotes.github.io%2Fquote%2Fcfc49c921c.html&amp;via=5Solas" target="_blank" rel="noopener">Share on X</a><a class="perma" href="../quote/cfc49c921c.html">Permalink</a><a class="src" href="https://reformedcovenanter.wordpress.com/2019/07/18/edward-reynolds-on-merit-and-divine-condescension-in-the-covenant-of-works/" rel="noopener" target="_blank">Read it online · Reformed Covenanter</a></div>

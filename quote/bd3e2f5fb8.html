<main class="wrap"><figure class="quote" id="q-bd3e2f5fb8" data-kw="">
<blockquote><p>Provided always, That the clause in the Directory, of the administration of the Lord’s Supper, which metions the communicants sitting about the table, or at it, be not interpreted as if, in the judgment of this kirk, it were indifferent, and free for any of the communicants not to come to, and receive at the table; or as if we did approve the distributing of the elements by the minister to each communicant, and not by the communicants among themselves…</p></blockquote>

<blockquote><p>A Lasco’s bimonthly Communion took a period of two weeks and even involved a special preparatory service the day before. Thus, an important contributing factor to the differing frequencies of the Lord’s Supper throughout the churches of the Reformation was the balance between the desire for frequent Communion, and the desire for thoroughgoing church discipline.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/mark-earngey.html">Mark Earngey</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Other citations (work not named)</cite>, ch. 2, ‘Soli Deo Gloria: The Reformation of Worship’ in Reformation Worship: Liturgies from the Past for the Present (New Growth, 2017), p. 40</span></figcaption>

</figure><figure class="quote" id="q-14ec447b49" data-kw="">
<blockquote><p>VI. Fifth, ‘the precepts of the first table take the preference of those of the second’ as to necessary internal and external acts, when they both cannot have place at the same time. Thus the love of our neighbor ought to be subjected to the love of God. We are bound to hate father and mother for Christ’s sake (Lk. 14:26), when the love of parents is incompatible (asystatos) with the love of Christ. Human commands are to be neglected when opposed to the commands of God (Mt. 10:37; Acts 4:19). But in turn ‘the ceremonial of the first table yields to the moral of the second because God desires mercy and not sacrifice’ (Hos. 6:6), i.e., moral worship principally and primarily as better and of itself necessary; the ceremonial, however, only secondarily on account of the moral. Hence we ought not to be so anxious about the former as about the latter. … VIII. Seventh, ‘the beginning and end of all the precepts is love.’… However as the object of love is twofold (God and our neighbor), so a twofold love is commanded: of God in the first table of the law; of our neighbor in the second. That is called ‘the first and great commandment’; this ‘the second like to it.’ The love of God is rightly called the ‘first’ commandment because as there is nothing before God, so his worship ought first to be attended to by us in order that all things may begin from and end in it. It is called ‘great’ (a) with regard to the object because conversant with the greatest and infinite object (viz., God)… The second is said to be ‘like’ unto it, not with regard to importance, but (1) with regard to quality because both in the love of God and of our neighbor sincerity and purity of heart are required; (2) with regard to authority because each is commanded by God and tends to his glory; (3) with regard to punishment because the violation of either table exposes to eternal death; (4) with regard to connection and dependence because they are so strictly connected with each other that neither can be fulfilled without the other (for as God cannot be loved without the love of God, who created him)…</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/francis-turretin.html">Francis Turretin</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Institutes of Elenctic Theology</cite>, vol. 2, 11th Topic, ‘The Law of God’, Question 6, ‘The Rules of Explanation and of Observance of the Decalogue’, Sections VI &amp; VIII, pp. 35-37</span></figcaption>

</figure><figure class="quote" id="q-4d8267c587" data-kw="">
<blockquote><p>These external signs conceal spiritual matters. Christ has instituted bread as a sign and symbol of his body, and the breaking of it as a sign of the breaking of his body by suffering and death. ‘This is my body which is given for you’ (Luke 22:19); ‘…this is my body, which is broken for you’ (1 Cor. 11:24).</p></blockquote>

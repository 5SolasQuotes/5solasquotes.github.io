<main class="wrap"><figure class="quote" id="q-cf7bd7b3ab" data-kw="">
<blockquote><p>5. In edifying the family with Psalms and melody to the Lord, as it is, Col. 3:16. In these daily duties doth the sanctification of a family consist… and where this worship of God is not set up in families, there is nothing but a conspiracy of atheists, and a wicked brood bringing God’s judgments on themselves…</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/thomas-taylor.html">Thomas Taylor</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Christ’s Combat &amp; Conquest: or, The Lion of the Tribe of Judah Vanquishing the Roaring Lion Assaulting Him, in Three Most Fierce &amp; Hellish Temptations, Expounded... ([Cambridge], 1618), on Mt. 4:5-6</cite>, p. 173-4</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/worship/family-and-private-worship.html">Family and Private Worship</a></span></div>
<div class="actions"><button class="copy" data-copy="“5. In edifying the family with Psalms and melody to the Lord, as it is, Col. 3:16. In these daily duties doth the sanctification of a family consist… and where this worship of God is not set up in families, there is nothing but a conspiracy of atheists, and a wicked brood bringing God’s judgments on themselves…”

</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-5e68c3262b" data-kw="">
<blockquote><p>Friday, Oct. 12. — Kept a family fast this day, that we might afflict ourselves before our God; to seek of Him a right way for us and for our little ones, and for all our substance: I trust it was such a fast as the Lord would choose: His divine presence was amongst us, and we had good reason to hope and believe, that the Lord was entreated of us, Oh that we may find more and more reason to say so, when we come on shore. I dread going into the world. But wherefore do I fear? Lord, I believe, O help my unbelief, that Thou wilt keep me unspotted from it.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/george-whitefield.html">George Whitefield</a></span><span class="wk"><span class="lbl">Work:</span> <cite>A Continuation of Whitefield’s Journal During the Time He was Detained in England, by the Embargo, vol. 2</cite></span></figcaption>
<div class="meta"><span class="t"><a href="../topics/worship/family-and-private-worship.html">Family and Private Worship</a></span></div>

</figure><figure class="quote" id="q-7ce15b3082" data-kw="">
<blockquote><p>Call in divine assistance; the first thing you do, stand up, and implore God’s blessing upon you in the present undertaking (except you find it convenient to begin with a psalm to call the family together) and desire the Lord to unite your hearts unto Him…</p></blockquote>

</figure><figure class="quote" id="q-2911409743" data-kw="">
<blockquote><p>If the king or a nobleman should promise you five pounds every time that you call your family together, read a chapter, sing a psalm, kneel down and pray to God, would you not strain hard to procure that money ? And will not a greater profit from Almighty God prevail with you to perform this exercise to obtain a reward?</p></blockquote>

</figure><figure class="quote" id="q-be46e0bfd4" data-kw="">
<blockquote><p>You go to bed and rise, one time after another, prayerless; you can keep them up late and call them up early to their work, but never say, ‘Come to prayer’; not a word of God all the day long, not a chapter read, not a psalm sung, not a prayer put up in the family from day to day;</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/oliver-heywood.html">Oliver Heywood</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Family Altar in Works, vol. 4</cite>, p. 345</span></figcaption>

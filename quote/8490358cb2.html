<main class="wrap"><figure class="quote" id="q-8490358cb2" data-kw="">
<blockquote><p>V. Next, we must examine those aspects that primarily and chiefly pertain here (πρώτως καὶ κυρίως, “primarily and chiefly”): namely, the infused and inherent habits (habitus infusi &amp; concreati), for considering only acquired habits, as the Socinians and Remonstrants do, is sheer nonsense. These habits perfected and adorned these faculties excellently, such as the clarity and rectitude of the mind, not only regarding that innate (ὑπάρχον) aspect of the divine (τὸ τοῦ θεοῦ), whether it is innate through common notions (κοιναὶ ἐννοίαι) and the subjective light of the mind, or acquired through the objective light of being, as Socinus vainly objects (Romans 1; Isaiah 40; Psalm 19; Acts 14; Romans 2). But as a supernatural good, spiritual and religious, man knew God, His revealed will, and found his supreme happiness therein with perfect accuracy… We do not, however, regard this Original Righteousness as something substantial, as Osiander does, nor do we consider it a supernatural addition extrinsically added to the first nature in its pure natural state, as the Roman Catholics do. Instead, we deem it natural or connatural; otherwise, God would have commanded man to fulfill His law by his own strength in vain. This is further confirmed by the fact that, as it was to be propagated because it was natural, so reciprocally it was to be propagated by divine grace (Genesis 1:28, 1 Corinthians 15:48). What pertains to the supernatural, as such, cannot be sought in vain. However, we can easily accept calling it supernatural insofar as it did not flow from the essential principles of human nature but was infused by the grace of God as a moral good.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/andreas-essenius.html">Andreas Essenius</a></span><span class="wk"><span class="lbl">Work:</span> <cite>‘Theological Disputation on the Image of God in Man’ Download tr. Jonathan Tomes (Utrecht: Johannes Waesberg, 1653) Latin</cite></span></figcaption>
<div class="meta"><span class="t"><a href="../topics/man/image-of-god.html">Image of God</a></span></div>

</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-34e1ff4418" data-kw="">
<blockquote><p>…non-rational animals pursue the good in its most practical and immediate aspect, according to their (non- rational) desires and motivations. Only the rational creature, however, can desire the good as abstracted from practical desires and circumstances, pursuing goodness in its universal form as an end in itself. It is the intellectual and volitional capacity within the human person that makes him the image of God, distinct from other creatures who reflect God’s goodness in lesser ways. It is in the human soul precisely as rational that the image of God reaches its pinnacle in the created order. By extension, there is a sense in which God’s causal intimacy with created causes also finds a kind of special intimacy in the case of human willing. Because of the volitional capacity of the rational soul, our participation in the similitude of divine goodness is far deeper than that of any other creature.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/reginald-m-lynch.html">Reginald M. Lynch</a></span><span class="wk"><span class="lbl">Work:</span> <cite>“Divine Causality &amp; Human Freedom: Aquinas, Banez and Premotion after Descartes” in eds. Ballor, Gaetano &amp; Sytsma, Beyond Dordt &amp; De Auxiliis: the Dynamics of Protestant &amp; Catholic Soteriology in the Sixteenth &amp; Seventeenth Centuries (Brill, 2019), p. 229 Lynch is a Dominican and writes in the Thomist tradition.</cite></span></figcaption>
<div class="meta"><span class="t"><a href="../topics/man/image-of-god.html">Image of God</a></span></div>

</figure><figure class="quote" id="q-0d4354917f" data-kw="">
<blockquote><p>Among these creatures theology deals especially with angels and human beings, since God has bestowed his image upon them. Propositions I. Although the entire universe is a mirror of the divine power, wisdom, and goodness, yet the image of God, properly speaking, is a quality only of angels and men. II. The image of God consists partly of natural gifts–the simple, invisible substance of angels and of human souls, life, intellect, will and immortality; and partly of supernatural ones–original blessedness, rectitude and majesty of intellect and will, and majesty and dominion over other creatures.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/johannes-wolleb.html">Johannes Wolleb</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Abridgment of Christian Divinity, bk. 1, ch. 5, ‘Creation’ (1626) in ed. John Beardslee, Reformed Dogmatics: J. Wollebius, G. Voetius &amp; F. Turretin (Oxford Univ. Press, 1965)</cite>, p. 56</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/man/image-of-god.html">Image of God</a></span></div>

</figure><figure class="quote" id="q-13f863c28d" data-kw="">
<blockquote><p>V… In conclusion, the image of God in the first man was fittingly analogous to a son reflecting his father, especially in that which the father considers his most distinguishing feature—the face. Similarly, man was to reflect what God Himself deems most important: His holiness (Leviticus 19:2, Hebrews 11:10), which God is frequently said to swear by.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/andreas-essenius.html">Andreas Essenius</a></span><span class="wk"><span class="lbl">Work:</span> <cite>‘Theological Disputation on the Image of God in Man’ Download tr. Jonathan Tomes (Utrecht: Johannes Waesberg, 1653) Latin</cite></span></figcaption>

<blockquote><p>Now, as medieval thinkers like Thomas Aquinas argued, anything with an intellect must also possess a will. For a substance with an intellect acts by virtue of being inclined toward what its intellect takes to be good, and the will just is (on this analysis) an inclination of that sort.</p></blockquote>

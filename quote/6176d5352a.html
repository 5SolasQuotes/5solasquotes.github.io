<main class="wrap"><figure class="quote" id="q-6176d5352a" data-kw="">
<blockquote><p>The happiness of God consists in the knowledge of himself, his own perfections, and delight in them. God is the object of his own happiness. The knowledge of God himself is the felicity of God. No being is really happy without reflection upon, and knowledge of, that happiness. If God should be happy by the knowledge of anything else but himself, that which he did contemplate and know would be greater and better than God, because his happiness would depend upon it. Felicity can never be in anything inferior. God hath nothing higher and better than himself to contemplate.

This gave him a satisfaction before the world was, and this would still be his blessedness, if all things should be reduced to the depths of nothing. Since, therefore, he created the world, to communicate himself and his own happiness to the rational creature, felicity cannot be attained by anything less than the knowledge of the supreme good according to the creature’s measures. The angels themselves are only blessed in the contemplation of him, and affection to him. In being encompassed with his bright rays, and having their affections inflamed by him. Mat. xviii. 10, ‘they behold the face of God.’ As God’s knowledge and fruition of himself makes up his felicity, so the knowledge and fruition of God composeth our happiness.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/stephen-charnock.html">Stephen Charnock</a></span><span class="wk"><span class="lbl">Work:</span> <cite>, A Discourse on the Knowledge of God</cite>, in The Complete Works of Stephen Charnock, B.D. (5 vols, Edinburgh: James Nichol, 1865), 4: 24.</span></figcaption>

</figure><figure class="quote" id="q-0a73e06176" data-kw="">
<blockquote><p>The bodies of the wicked shall rise at the last day, but it shall be to their everlasting shame, ruin and confusion. They shall be immortal, but they shall be immortal fuel to immortal flames. The bodies of the wicked shall come out of their graves as out of their prisons, and as so many malefactors to appear before an angry Judge.

They shall come out of their graves as the chief Baker did out of prison, to be hung in chains in hell for ever, where they shall endure all kind of extremities figured out unto us by the sad condition of Dives, who could not get a drop of water to cool his tongue.

The bodies of the wicked shall be as ugly, loathsome carcasses to look upon, and their faces shall gather blackness and darkness, Isa. 66. 24. They shall arise with great fear and trembling, and shall call to the hills and mountains to cover and hide them from the presence of the Lamb. Oh the horror and astonishment that shall be at that day, when the foul of a wicked man shall come out of hell, and be again united to the body: How will the body curse the soul, and the soul the body? How will they befool one another? Certainly this greeting will be very terrible; the Lord grant we may never come to have experience of it.</p></blockquote>

</figure><figure class="quote" id="q-3ba685ad66" data-kw="">
<blockquote><p>The fourth commandment corresponds to the transition from heaven to earth. That is, it enjoins sabbath observance as first of all a responsibility to God, and in this sense involves heavenly responsibility. But it also involves responsibilities downward to other human beings, sons, daughters, servants, aliens and even animals (Exodus 20:10). Because it involves observance of a periodic seven-day pattern, and because the pattern of day and night is controlled by the heavenly bodies (Genesis 1:14), it also reminds us of Israel’s relation to the visible heavens as the good creation of God. Thus it corresponds in some ways to the Holy Place, where the seven lamps correspond to the light of seven days of the week. It forms a transition between the invisible heavens of the Most Holy Place and the earthly space of the tabernacle courtyard.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/vern-s-poythress.html">Vern S. Poythress</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Shadow of Christ in the Law of Moses</cite>, (Phillipsburg NJ: P&amp;R, 1991), p. 91.</span></figcaption>

</figure><figure class="quote" id="q-3eddfe8052" data-kw="">
<blockquote><p>XL. Are good works therefore unnecessary for our justification? To become righteous from being guilty and liable to punishment—that is, to receive the abundance of grace and the gift of righteousness—they are not necessary as antecedents. But they are absolutely necessary as consequences. They are the fruits and ends of justification, from which justification ought not and cannot be separated. For in the New Covenant, God has first promised us the forgiveness of sins, and then sanctification. Christ has been made for us not only righteousness, but also sanctification. Faith embraces both promises, and draws both benefits from the fullness of Christ, into whom it inserts us. Thus, a faith that does not produce good works as its fruits reveals itself not to be true faith at all, but a rotten corpse of faith, which mimics the outward appearance of faith but has no power, movement, or activity. Therefore, in order that we may be declared righteous, and that it may be shown (whether in the court of our conscience or in the final judgment) that God has truly granted us forgiveness of sins, good works are necessary as posterior evidences, as they say. For faith is known by its works, just as a tree is known by its fruits. References: Heb. 10:16; 2 Cor. 1:30; Jm. 1:11.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/joshua-placeus.html">Joshua Placeus</a></span><span class="wk"><span class="lbl">Work:</span> <cite>‘Theological Theses on the Justification of Man before God’</cite>, trans. AI (1634), p. 9</span></figcaption>

<main class="wrap"><figure class="quote" id="q-3939b87e53" data-kw="">
<blockquote><p>You must be content and easy, and not ambitious and aspiring. Some make the word to signify animi demissio, the bringing of the mind down to the condition, when the condition will not in every thing be brought up to the mind. A sober mind is that which accommodates itself to every estate of life, and every event of providence, so that whatever changes happen, it preserves the possession and enjoyment of itself.

You that are young, must learn betimes to reconcile yourselves to your lot, and make the best of that which is, because it is the will of God it should be as it is, and what pleaseth him ought to please us; for he knows what is fit to be done, and fit for us to have, better than we do. Let this check all disquieting discontented thoughts. Should it be according to thy mind? Shalt thou who art but of yesterday control him, quarrel with him, or prescribe to him, whose counsels were of old from everlasting?

It is folly to take as much pleasure in converse with direct the divine disposals, but wisdom to acquiesce in them. He who determineth the times before appointed, and the bounds of men’s habitation, ordered what our rank and station should be in the world, – what parents we should be born of, – what lot we should be born to, – and what our make and capacity of mind and body should be.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/matthew-henry.html">Matthew Henry</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Sober-Mindedness Pressed upon Young People, in a Discourse on Titus II.6</cite>, (1712) in The Complete Works of the Rev. Matthew Henry; Being a Collection of all his Treatises, Sermons, and Tracts, as Published by Himself: And a Memoir of his Life (2 vols, Edinburgh: A. Fullarton and Co., 1853), 1: 68-69.</span></figcaption>

<blockquote><p>‘nature’ here some understand the law of nature, according to which it would have an intrinsic evil in it, which it is plain it has not; for then neither must the Nazarites have used it (as they did), neither would it be lawful for the sake of men’s health or life. Others understand by nature the law of nations; but neither is this true, for in many nations men wear hair at the utmost length. Others understand common sense, or the light and judgment of that natural reason which since the fall is left in man; but this must be the same in all men, and we know that all men do not judge this shameful. Others therefore by nature here understand a common custom, which (as they say) makes as it were a second nature; so the term is taken, Rom. 11:24; but it cannot so signify here; for there neither is, nor ever was, such a universal custom in any place, that none in it wore long hair. Others by nature here understand natural inclination; but neither can this be the sense, for there is in some men, as well as in women, a natural propension and inclination to wear their hair at excessive lengths. Others here by nature understand the difference of the sex, as they take this word to be used, Rom. 1:26; the distinction of the sexes teaches us this: and this seems to be the most probable sense of this text. The apostle arguing, that as the male and female sex are artificially distinguished by garments, and it was the will of God they should be so, so they should also be distinguished by the wearing of their hair; and it was no less shame for a man to wear his hair like a woman, than to wear garments like a woman.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/matthew-poole.html">Matthew Poole</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Annotations on 1 Cor. 11</cite>, v. 14</span></figcaption>

</figure><figure class="quote" id="q-9093877d1c" data-kw="">
<blockquote><p>There is a twofold opinion concerning the reformation of Churches: some hold that nothing at all should be added to apostolical simplicity, and by consequence are of mind that whatsoever the apostles did, they think they are to do it, but whatsoever the Church after the apostles did add to the first rites, they think them fit even all at once to be abolished. There are others on the other side which hold that certain ancient rites (besides the apostolical ordinances) are to be retained, partly as profitable and necessary: partly also albeit not necessary, yet to be tolerated for concord sake’s. For mine own part I doubt not but the apostolical doctrine to be most absolutely perfect without all exception, to the which it is not lawful to add or to detract any thing; howbeit, touching ceremonies my judgement is otherwise. For first, it is certain that even the apostles themselves could not determinately set down what they judged to be expedient for the Churches in their first beginning: and therefore necessarily they proceeded by little and little, as the institution of deacons does make evident, inasmuch as they suffered for a season many Jewish ceremonies, as appears in the story of their Acts: again, to whom can it be doubtful that the apostles had exceeding regard unto their times, places and persons in external rites. Inasmuch as it is not profitable that the same rites were observed everywhere, as appears in that excellent epistle of Irenaeus to Victor. Besides, necessity itself abolished certain of their ordinances, as their common feasts of love. Wherefore whatsoever was performed by the apostles in rites and ceremonies, I do not judge that presently, neither yet without some exception, to be followed as a rule. And indeed I wonder not that those ancient fathers, having respect unto their own times, did take away some things, some things add and somewhat alter. Only herein (with their good leave be it spoken) they seem to me to have often failed, that they neither held any measure in their rites, neither had that due regard to Christian simplicity and purity as was meet.</p></blockquote>

<blockquote><p>2. It is asked, Whether it be possible for a regenerated man always to retain this habitual intention of pleasing God in all things, although in the mean time he fails in many?

I answer; That not only is it possible, but necessary, if he wishes to retain faith and a good conscience: for these cannot consist, neither remain in the same heart with the design of sinning and of displeasing God. Therefore every believer constantly keeps in mind the purpose of pleasing God and of abstaining from sin, according to that saying of Paul, The good that I would I do not; but the evil which I would not, that I do. Now if I do that I would not, it is no more I that do it, but sin that dwelleth in me, Rom. vii. 19. He who chooseth good, and not evil, retains the design of pleasing God, although, being allured by evil concupiscence, he sometimes does that through infirmity which displeases God, he makes it his main business to please in all things, whilst he studies to avoid every single sin.

Lastly, it is asked. Whether a believer retaining this design of pleasing God, is always acceptable and pleasing to him, notwithstanding those his failures and infirmities?

I answer, first. That the person of a godly and faithful man is always pleasing and acceptable to God, because he is regarded by God not as he is in himself, but as a member under Christ the head; But there is no condemnation to them who are in Christ Jesus, Rom. viii. 1. Secondly, The good works of the faithful, although imperfect, are nevertheless pleasing to God, because they are regarded by him as by a loving Father, not as an austere judge; as covered and adorned with the most perfect obedience of Christ, not as naked and alone. Lastly, The failings and sins of the faithful are indeed hateful and displeasing to God, but out of a simple hatred, not redounding upon the person. And therefore God hates sin in the regenerate, and for that reason declares war against it, through the Spirit of grace; but the regenerate themselves, in the mean time, are acceptable to him, and on that account he favours and blesses them.</p></blockquote>

<main class="wrap"><figure class="quote" id="q-f87d74a27b" data-kw="">
<blockquote><p>4thly, Ye may not deny your covenant-engagements; ye may, by no means, deny the covenant you have solemnly sworn. For David gives it as a mark of the man that shall dwell on that high and holy hill; that he is a man that will not swear, nor forswear; he will not break his oath, though it should be to his hurt. So, ye must not deny your covenant, though it should be to your hurt; though it should be to the loss of houses, lands, goods, &amp;c.; yea, and your own life also. It is said, “They like Adam have transgressed the covenant.” Many a time the Lord charges this sin upon the people of Israel by the prophets. Now we must tell you in the name of the Lord this day, that ye should beware of breaking the covenant. In the name and by the authority of the Lord Jesus, we debar and excommunicate all such from the table of the Lord, as are not resolved to adhere to these covenants that the lands are under to the most high God.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/william-guthrie.html">William Guthrie</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Sermon XII in Sermons in Times of Persecution in Scotland, by Sufferers for the Royal Prerogatives of Jesus Christ</cite></span></figcaption>
<div class="meta"><span class="t"><a href="../topics/the-lords-supper.html">The Lord&#x27;s Supper</a></span></div>

</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-0fbb9ae289" data-kw="">
<blockquote><p>He took bread. The bread which Christ took was leavened bread, such as they ate at the feast of the Passover. This circumstance, however, does not properly belong to the Supper, any more than the evening at which time it was instituted; for the use of leavened bread at the institution was accidental. Hence we must not infer from this that there is any necessity for the use of such bread in the celebration of the Supper, or that Christ would lay down any particular way of baking or using it. Yet still the bread which is used in the celebration of the Lord’s supper differs from common bread, for whilst the latter is eaten for the nourishment of the body, the former is received for the nourishment of the soul, or for the confirmation of our faith, and union with Christ.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/zacharias-ursinus.html">Zacharias Ursinus</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Commentary on the Heidelberg Catechism</cite>, reprinted 1888, trans. G.W. Williard, 4th American ed,, Cincinnati, | Question 77, p. 384</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/the-lords-supper/elements-and-words.html">Elements and Words</a></span></div>

</figure><figure class="quote" id="q-517674f604" data-kw="">
<blockquote><p>Now indeed it would be most pleasing to us that the Supper be celebrated every month, provided that the more frequent use does not produce negligence. For while the greater part abstain from communion, the Church is in some measure scattered. Nevertheless, we would rather that the Church be invited monthly than only four times in the year, as is our custom. When I first came here [to Geneva], it was distributed only three times a year—and that so that between the Supper at Pentecost and that at the Nativity of Christ, seven whole months intervened. I preferred a monthly celebration; but since I could by no means persuade them, it seemed better to pardon the weakness of the people than to contend too stubbornly. Yet I took care that it should be entered in the public records that our custom was a faulty one, in order that a correction might be easier and freer for posterity.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/john-calvin.html">John Calvin</a></span><span class="wk"><span class="lbl">Work:</span> <cite>‘On the Question of some Ecclesiastical Rites’</cite>, (1561) in Opera, vol. 10, pt. 1, Consilia, col. 213 tr. ChatGPT-5</span></figcaption>

</figure><figure class="quote" id="q-9676dfb93d" data-kw="">
<blockquote><p>That the Distinctive Principles may be maintained without compromise, the Reformed Presbyterian Church believes in and practices Close Communion. Both reason and revelation are in accord with this stand. Apart from Close Communion the discipline of the Church cannot be maintained. Common sense teaches that it is a glaring inconsistency to testify against anti-Christian doctrines and practices and at the same time admit to the highest privileges of the Church those who adhere to said doctrines and practices. For example, if a member of a Reformed Presbyterian congregation were to join an oath-bound secret society, it would be the duty of the Session to discipline him, and if he refused to retract, to exclude him from the Lord’s Table. The Lord’s Supper is the highest and holiest privilege which the Church has to offer. Would it be consistent for the Church to permit a non-member who belonged to an oath-bound secret society to partake of the Communion while at the same time it prohibited one of its own members on the ground that he belonged to the same society? The Communion is of value to the Church only to the extent to which her members are bound together by the common faith and a common life with one another and with Christ.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/j-b-tweed.html">J. B. Tweed</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The communicants’ class</cite>, (2nd edn, Newton, 1960), p. 41.</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/the-lords-supper.html">The Lord&#x27;s Supper</a></span></div>

</figure><figure class="quote" id="q-62e72839c5" data-kw="">
<blockquote><p>…I shall desire you to consider the ground why such affirmative precepts, as command duties relating to others, do not bind to always. The duties that they command are principally to this end, that they do good to men for the curing of their evils, for the farthering of virtue in them. Wherefore when prudence shows that such actions will be fruitless in respect of the end, or contrariwise harmful, they are to be forborne.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/henry-jeanes.html">Henry Jeanes</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Want</cite>, [Lack] of Church-Government [is] No Warrant for a Total Omission of the Lord’s Supper. Or a Brief &amp; Scholastical Debate of that Question which has so Wonderfully Perplexed Many, Both Ministers &amp; People: Whether or No the Sacrament of the Lord’s Supper may (according to Presbyterial Principles) be Lawfully Administered [by a Minister] in an un-presbyterated church, that is, a church destitute of ruling elders. Wherein the affirmative is confirmed… (London, 1650) Jeanes was an English presbyterian., p. 17</span></figcaption>

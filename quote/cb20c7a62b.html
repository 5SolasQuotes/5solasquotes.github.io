<main class="wrap"><figure class="quote" id="q-cb20c7a62b" data-kw="">
<blockquote><p>…the terms ‘mortal’ and ‘venial’ are ambiguous and obscure. All sins are mortal in their own nature. The apostle John also calls the sin against the Holy Ghost mortal, or unto death.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/zacharias-ursinus.html">Zacharias Ursinus</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Commentary on the Heidelberg Catechism, following his commentary on Q&amp;A #7</cite></span></figcaption>
<div class="meta"><span class="t"><a href="../topics/sin/degrees-of-sin.html">Degrees of Sin</a></span></div>

</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-93c2c65903" data-kw="">
<blockquote><p>Hence, (7) it is said that those born of God cannot sin (1 John 3:9; 5:18), namely unto death (1 John 5:16), because by the grace of God, before death they are certainly restored (Ps. 37:24; Prov. 24:16).</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/petrus-van-mastricht.html">Petrus van Mastricht</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Theoretical Practical Theology</cite>, (RHB), vol. 5, bk. 6, ch. 9, sect. 18, p. 213</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/sin/degrees-of-sin.html">Degrees of Sin</a></span></div>
<div class="actions"><button class="copy" data-copy="“Hence, (7) it is said that those born of God cannot sin (1 John 3:9; 5:18), namely unto death (1 John 5:16), because by the grace of God, before death they are certainly restored (Ps. 37:24; Prov. 24:16).”

— Petrus van Mastricht, Theoretical-Practical Theology (RHB), vol. 5, bk. 6, ch. 9, sect. 18, p. 213">Copy</button><a class="share" href="https://x.com/intent/post?text=%E2%80%9CHence%2C+%287%29+it+is+said+that+those+born+of+God+cannot+sin+%281+John+3%3A9%3B+5%3A18%29%2C+namely+unto+death+%281+John+5%3A16%29%2C+because+by+the+grace+of+God%2C+before+death+they+are+certainly+restored+%28Ps.+37%3A24%3B+Prov.+24%3A16%29.%E2%80%9D%0A%0A%E2%80%94+Petrus+van+Mastricht%2C+Theoretical-Practical+Theology+%28RHB%29%2C+vol.+5%2C+bk.+6%2C+ch.+9%2C+sect.+18%2C+p.+213&amp;url=https%3A%2F%2F5solasquotes.github.io%2Fquote%2F93c2c65903.html&amp;via=5Solas" target="_blank" rel="noopener">Share on X</a><a class="perma" href="../quote/93c2c65903.html">Permalink</a><a class="src" href="https://reformedbooksonline.com/on-not-praying-for-the-one-who-has-sinned-unto-death-1-jn-516-17/#:~:text=Hence%2C%20%287%29%20it%20is%20said%20that,certainly%20restored%20%28Ps.%2037%3A24%3B%20Prov.%2024%3A16&amp;text=Hence%2C%20%287%29%20it%20is%20said%20that%20those%20born&amp;text=they%20are%20certainly%20restored%20%28Ps.%2037%3A24%3B%20Prov.%2024%3A16" rel="noopener" target="_blank">Read it online · Reformed Books Online</a></div>
</figure><figure class="quote" id="q-0a171f73ca" data-kw="">
<blockquote><p>If any man see his brother fall into and continue in such a sin as may be capable of forgiveness, let him earnestly sue unto God, for pardon of that offender; and God, who is great, and infinite in mercy, shall graciously incline his ear to his prayers, give remission and life to such an one. There is indeed a sin unto death, for which there is no forgiveness with God, because there is no capacity of repentance for it in the committer of it; I mean the sin against the Holy Ghost, when a man, having received the knowledge of the Gospel by the illumination of the Holy Spirit, and [has] professed the belief thereof, shall, in a devilish malice, wilfully blaspheme and persecute that known truth: I do not give you allowance to pray for the pardon of this sin.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/joseph-hall.html">Joseph Hall</a></span><span class="wk"><span class="lbl">Work:</span> <cite>A Plain &amp; Familiar Explication: by Way of Paraphrase, of All the Hard Texts of the Whole Divine Scriptures of the Old &amp; New Testaments</cite>, (d. 1656), vol. 2, on 1 Jn., 5:16</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/sin/degrees-of-sin.html">Degrees of Sin</a></span></div>
<div class="actions"><button class="copy" data-copy="“If any man see his brother fall into and continue in such a sin as may be capable of forgiveness, let him earnestly sue unto God, for pardon of that offender; and God, who is great, and infinite in mercy, shall graciously incline his ear to his prayers, give remission and life to such an one. There is indeed a sin unto death, for which there is no forgiveness with God, because there is no capacity of repentance for it in the committer of it; I mean the sin against the Holy Ghost, when a man, having received the knowledge of the Gospel by the illumination of the Holy Spirit, and [has] professed the belief thereof, shall, in a devilish malice, wilfully blaspheme and persecute that known truth: I do not give you allowance to pray for the pardon of this sin.”

</figure><figure class="quote" id="q-74a5a5fe85" data-kw="">
<blockquote><p>The recognition of this matter is twofold, one true and certain, by divine revelation given to the Prophets, as often was done in the beginning of the Apostolic Church, as it is evident from Acts; 1 Cor. 12; 1 Tim. 1:20; 2 Tim. 4:14, 15; the other likely and uncertain, through human experience, by a diligent observation of the words and deeds of the impious against Christ (Gomar), when the desperate impiety of some most clearly appears, etc. (Calvin), as formerly it was judged that the Emperor Julian† had sinned, etc. (Gomar). † The Emperor Julian reigned from 361 to 363. Although trained up in the Christian religion, he apostatized from the faith, and endeavored, if unsuccessfully, to restore Rome to its ancient paganism.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/matthew-poole.html">Matthew Poole</a></span><span class="wk"><span class="lbl">Work:</span> <cite>A Synopsis of Interpreters, both Critical &amp; Otherwise, of the Sacred Scripture in The Exegetical Labors of the Reverend Matthew Poole</cite>, vol. 79, 1, 2, and 3 John, Jude (VA: Master Poole Publishing, 2013), on 1 Jn. 5:16, pp. 173-74</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/sin/degrees-of-sin.html">Degrees of Sin</a></span></div>
<div class="actions"><button class="copy" data-copy="“The recognition of this matter is twofold, one true and certain, by divine revelation given to the Prophets, as often was done in the beginning of the Apostolic Church, as it is evident from Acts; 1 Cor. 12; 1 Tim. 1:20; 2 Tim. 4:14, 15; the other likely and uncertain, through human experience, by a diligent observation of the words and deeds of the impious against Christ (Gomar), when the desperate impiety of some most clearly appears, etc. (Calvin), as formerly it was judged that the Emperor Julian† had sinned, etc. (Gomar). † The Emperor Julian reigned from 361 to 363. Although trained up in the Christian religion, he apostatized from the faith, and endeavored, if unsuccessfully, to restore Rome to its ancient paganism.”

l="noopener" target="_blank">Read it online · Reformed Books Online</a></div>
</figure><figure class="quote" id="q-af97d5840f" data-kw="venial mortal">
<blockquote><p>It is well known that among the various divisions of sin, the papists press this beyond others, distributing sin into mortal and venial. Their design in this is not obscure (viz., to curry favor for the perfection of righteousness, supererogatory works, the merit of works and purgatory). The question therefore comes back to this—whether all sins per se and in their own nature are mortal (worthy of death and able justly to be so punished); whether some are mortal and some venial (not from the event and through grace, but in their own nature and according to the law). The latter our opponents hold; we maintain the former.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/francis-turretin.html">Francis Turretin</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Institutes of Elenctic Theology</cite>, 9.4.1,6</span></figcaption>

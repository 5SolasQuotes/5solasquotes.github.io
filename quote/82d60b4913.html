<main class="wrap"><figure class="quote" id="q-82d60b4913" data-kw="">
<blockquote><p>That God did spiritually and mystically represent unto Moses the incarnation and mediation of Christ, with the church of the elect which was to be gathered thereby, and its spiritual worship. And moreover, he let him know how the tabernacle and all that belonged thereunto, did represent him and them. For the tabernacle that Moses made was a sign and figure of the body of Christ. This we have proved in the exposition of the second verse of this chapter; and it is positively affirmed by the apostle, Col. 2:17. For therein would God dwell really and substantially: Col. 2:9, “In him dwelleth all the fulness of the Godhead bodily.” And the tabernacle was but to represent this inhabitation of God in Christ. Therefore did he dwell therein typically by sundry pledges of his presence, that he might represent the real substantial inhabitation of the Godhead in the body or human nature of Christ. This, therefore, was the ἀρχέτυπος, whereunto the tabernacle was to be framed; and this was that which was showed unto Moses on the top of the mount. These were the “heavenly things,” which they served unto the resemblance and shadow of. It is therefore most probable, and most agreeable unto the mystery of the wisdom of God in these things, that, before the building of the tabernacle below, God did show unto Moses what was to be signified and represented thereby, and what he would introduce when that was to be taken away. He first showed “the true tabernacle,” then appointed a figure of it, which was to abide and serve the worship of the church, until that true one was to be introduced, when this was to be taken down and removed out of the way: which is the substance of what the apostle designeth to prove.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/john-owen.html">John Owen</a></span><span class="wk"><span class="lbl">Work:</span> <cite>An Exposition of the Epistle to the Hebrews</cite>, ed. W. H. Goold, vol. 23, Works of John Owen (Edinburgh: Johnstone and Hunter, 1854), 46–47.</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/the-person-of-christ/union-of-the-two-natures.html">Union of the Two Natures</a></span></div>

</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-3193b12e9b" data-kw="">
<blockquote><p>Rissen (XI, 25): ‘By the aid of the Holy Spirit the Son assumed human nature from the blood of the Virgin Mary… Further, the Spirit’s attitude here is not material but efficient only, δημιουργικὸς not σπερματικος; so that He might be conceived by the Spirit’s power, not substance; not by generation but by benediction and consecration; so that the preposition ἐκ is the mark of efficient cause, as often elsewhere, Rom. 11:36 (‘of Him and through Him and to Him are all things’), since all things are said to be of God and 1 Jn. 3:9, the good are born ἐκ τοῦ θεοῦ. From this it is clear that the ἐκ in Mt. 1:18, 20 is used for ἀπό.’ (Cf. Alting, p. 996). In this sense must be answered the question raised by the Socinians, whether the Holy Spirit is to be described as the Father of Jesus Christ. ‘For since the title of father requires generation from the substance of him who generates and the generation of a nature like itself, and neither occurs here, it is evident that the Holy Spirit cannot be called the Father of Christ.’ — Wolleb 63. ‘The Holy Spirit is not the material but the efficient cause of the conception of Christ. He was conceived not of his substance but of his power, not by generation but by command and blessing.’ (Aug.)</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/heinrich-heppe.html">Heinrich Heppe</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Reformed Dogmatics rev. Ernst Bizer</cite>, ed. Ernst Bizer (1950; Wipf &amp; Stock, 2007), ch. 17 | sections 10 &amp; 11, pp. 421 &amp; 424</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/the-person-of-christ/union-of-the-two-natures.html">Union of the Two Natures</a></span></div>

<blockquote><p>On two occasions we are told that Jesus felt that occurrences which he witnessed were extraordinary and experienced the appropriate emotion of “wonder” regarding them (Mt. viii. l0; Lk. vii 9; Mk. vi. 6).¹ ¹ [Greek] Thaumazo: see Schmidt, Synonymik etc., iv. §165, pp. 184sq.: “it is perfectly generally ‘to wonder’ or ‘to admire’, and is distinguished from thambein precisely as the German sich wundern, or hewundern is from staunen: that is, what has seized on us in the case of thaumazein is the extraordinary nature of the thing while in the case of thambain it is the unexpectedness and suddenness of the occurrence.” Cf. Art. “Amazement” in Hasting’s DCG. I, pp. 47, 48.</p></blockquote>

<blockquote><p>Touching the first, the soul-trouble of Christ, we are to consider: 1st Position. This holy soul thus troubled, was like the earth before the Fall, out of which grew roses without thorns, or thistles, before it was cursed. Christ’s anger, his sorrow, were flowers that smelled of heaven, and not of sin: All his affections of fear, sorrow, sadness, hope, joy, love, desire, were like a fountain of liquid and melted silver; of which the banks, the head-spring, are all as clear from dross as pure crystal: such a fountain can cast out no clay, no mud, no dirt. When his affections did rise and swell in their acts, every drop of the fountain was sinless, perfumed and adorned with grace; so as the more you stir or trouble a well of rose-water, or some precious liquor, the more sweet a smell it casts out: Or, as when a summer soft wind blows on a field of sweet roses, it diffuses precious and delicious smells through the air. There is such mud and dregs in the bottom and banks of our affections, that when our anger, sorrow, sadness, fear, does arise in their acts, our fountain casts out sin. We cannot love, but we lust; nor fear, but we despair; nor rejoice, but we are wanton and vain and gaudy; nor believe… O that Christ would plant some of his flowers in our soul, and bless the soil, that they might grow kindly there, being warmed and nourished with his grace: If grace be within, in sad pressures it comes out… … 3rd Position. Undeniably, grace did so accompany nature, that he could not fear more than the object required. Had all the strength of men and angels been massed and contemperated in one, they should have been in a higher measure troubled than Christ was: So how much trouble was in Christ’s affections, as much there was of reason, perfumed and lustered with grace… So neither were his affections above banks; he saw the blackest and darkest hour that ever any saw; suppose all the sufferings of the damned, for eternity, were before them in one sight, or came on them at once, it should annihilate all that are now, or shall be in hell. Christ now saw, or foresaw as great sufferings, and yet: 1. believed, 2. prayed, 3. hoped, 4. was encouraged under it, 5. suffered them to the bottom with all patience, 6. rejoiced in hope, Ps. 16:9. Now our affections rise and swell before reason: 1. They are often imaginary, and are on horse-back and in arms at the stirring of a straw. 2. They want that clearness and serenity of grace that Christ had, through habituall grace following nature from the womb. 3. We can raise our affections, but cannot allay them: as some magicians can raise the Devil, but cannot conjure, or command him: or, some can make war, and cannot create peace… And this extremity of soul-trouble was most rational, coming from the infallible apprehension of the most pressing cause of soul-trouble, that ever living man was under.</p></blockquote>

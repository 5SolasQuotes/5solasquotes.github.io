<blockquote><p>France, in the age of her great moral, as well as political revolution, abolished the Sabbath, and with it abolished her religion, declared that there was no God but reason, and no hereafter except the grave. The same result will follow the same premises, wherever the experiment shall be made. The nation that disowns the Sabbath, is, necessarily, a nation of infidels and atheists. You may look where you will, either among individuals, families, or communities, and if the Sabbath is a desolation, there you will find a gradual and certain decay from true religion to infidelity and paganism.

Let the Sabbath be forgotten for half a century in our own favoured land, and in vain might you look for a single Christian temple throughout this western hemisphere. There are towns and villages on this continent, where, for half a century, the Sabbath has been neglected and despised; and, if you will visit them, you will see that you have no necessity of going to India, or the Southern Ocean, to find immortal beings who are ignorant of their immortality, and men who must soon appear before God in judgment, who have seldom heard of God and his Christ. There is just as much importance, therefore, attached to the observance of the Sabbath, as there is to the preservation of the true religion among men.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/gardiner-spring.html">Gardiner Spring</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Sabbath a Blessing to Mankind</cite>, in Tracts of the American Tract Society. General Series. Volume 1 (n.d.), no. 37, p. 12.</span></figcaption>

<blockquote><p>VIII. Did David, as the psalmist of Israel, write all the psalms?

No. He wrote probably more than one half of them. Yet they are called by his name (David, Heb. 4:7. Rom. 11:9) because he was employed more extensively than any other, in this part of the word of God, as the amanuensis of the Holy Ghost.

IX. What name was originally given to that part of the Holy Scriptures which is thus called David?

It was called “Tehillim,” that is, hymns or praises, because it was given as the matter of divine praise to the church of God in every future age. It is also called “Psalms,” because many of these “spiritual songs” were, at the temple worship, sung with the psaltery. Parts of the book have other names, as Mizmor, Shir (46, title), Tehillah (145, title), Tephilah (17,86,102, titles), Prayers, Shir-hammacholoth (120-134) – Odes of Ascension. They are also called, in the Septuagint, Psalmoi.

X. When were the Tehillim, or Psalms written and formed into a book?

They were written in a manner similar to the other parts of Scripture Heb. 1:1, during a period of nearly one thousand years, and were collected into one book, probably by “Ezra the priest, a scribe of the law of the God of heaven.” They stood in their present numerical order in the days of the apostles. Acts 13:33.

XI. Were other songs, beside those contained in the Book of Psalms, composed during that period?

Yes, many. Such as the Song of Deborah Judg. 5:12, the song of the well Num. 21:17, 18, the 1005 songs of Solomon, and others.

XII. Were not these then given as the matter of her praise, or are they not commanded to be sung by the church in all future ages?

No. As we read of different books in Scripture, such as the book of Gad, of Nathan, of Jehu, of Jasher, and the Epistle from Laodicea, which were not collected into the sacred canon, by the Holy Ghost, so we thus know, that by the same divine sovereignty, the songs thus noticed, or even recorded, were ephemeral as matter of praise; while the songs contained in the “Sepher Tehillim,” or Book of Psalms, and collected and placed in one book by the Spirit, are a part of “the word of God, which liveth and abideth forever,” selected by infinite wisdom, and given expressly as the matter of praise to the church until the end of time. The same principle applies to any isolated and occasional hymns or songs, which may be found in the New Testament.

XIII. Were any attempts made to add to the Book of Psalms, after it was completed?

Yes. The 151st psalm was fabricated, and attempted to be added to the then perfect book, nearly three hundred years before “the Christian era.” Septuagint, Psa. 151st.

XIV. Is such an attempt authorized by God?

No. It arises from the depravity of our nature, and the opposition of our wills to the divine will, and consequently forms a part of what the Holy Ghost calls “will worship,” which has a show of wisdom. Col. 2:23.

XV. Is, then, this book called the Book of Psalms, by the Holy Ghost?

It is so called, both by Jesus Christ and by the Spirit. Luke 20:42; Acts 1:20; Heb. 4:7.

XVI. Was it given to the Jewish church to be the matter of praise to God?

Yes. 1 Chron. 16:7; 25:1, 5; Psa. 81:1; . Neh. 12:8, 46; Psa. 137:3, 4; Ezra 3:10.

XVII. Was the Jewish church in reality different from the Christian?

No. They are the same church, under different dispensations. Acts 7:38; Heb. 4:2; Gal. 4:3, 4.

XVIII. When Christ came “to fulfil all righteousness,” and by his evangelists and apostles to complete the oracles of God, did he, or they, praise Jehovah by singing psalms?

Yes, both did. Matt. 26:30; Mark 14:26; Acts 16:25; Psa. 22:2; Heb. 2:13.

XIX. Did they deliver, by inspiration, any other “psalms, hymns, or spiritual songs,” than those contained “in David”? Heb. 4:7.

No. One such psalm or song would be a treasure for the edification of the saints, if “the Psalms” had been simply Jewish; and yet it would not afford a precedent or warrant for uninspired men to make human hymns, and sing them as praise to God. Isa. 1:12. Hos. 13:2.

XX. What is a human hymn, psalm, or spiritual song?

One, of which the arrangement and composition are made by uninspired men, and not by the authority and wisdom of God, even although the sentiment be taken from, and agree with, some portion of Scripture. It has “a show of wisdom;” yet it is only man’s opinion which will be opposed and contradicted by the opinion of some other man metrically expressed, in language, to his mind, equally scriptural. Consequently, “of making many ‘hymn’ books there is no end.” We have now more than one for each Sabbath in the year, all supplanting “the Lord’s song,” (songs), and in their turn supplanted by the poetical skill and caprice of other men. Such compositions, as matter of praise, are, moreover, purely “will worship.” Isa. 1:12.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/alexander-blaikie.html">Alexander Blaikie</a></span><span class="wk"><span class="lbl">Work:</span> <cite>A Catechism of Praise</cite>, (1849; Boston: S. K. Whipple and Co, 1854), pp 8-11.</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/worship/psalmody.html">Psalmody</a></span></div>

XX. What is a human hymn, psalm, or spiritual song?

One, of which the arrangement and composition are made by uninspired men, and not by the authority and wisdom of God, even although the sentiment be taken from, and agree with, some portion of Scripture. It has “a show of wisdom;” yet it is only man’s opinion which will be opposed and contradicted by the opinion of some other man metrically expressed, in language, to his mind, equally scriptural. Consequently, “of making many ‘hymn’ books there is no end.” We have now more than one for each Sabbath in the year, all supplanting “the Lord’s song,” (songs), and in their turn supplanted by the poetical skill and caprice of other men. Such compositions, as matter of praise, are, moreover, purely “will worship.” Isa. 1:12.”

— Alexander Blaikie, A Catechism of Praise, (1849; Boston: S. K. Whipple and Co, 1854), pp 8-11.">Copy</button><a class="share" href="https://x.com/intent/post?text=%E2%80%9CVIII.+Did+David%2C+as+the+psalmist+of+Israel%2C+write+all+the+psalms%3F%0A%0ANo.+He+wrote+probably+more+than+one+half+of+them.+Yet+they+are+called+by+his+name+%28David%2C+Heb.+4%3A7.+Rom.+11%3A9%29+because+he+was+employed+more+extensively+than+any+other%2C+in+this+part+of+the+word+of+God%2C+as+the+amanuensis+of+the+Holy+Ghost.%0A%0AIX.+What+name+was+originally+given+to+that+part+of+the+Holy+Scriptures+which+is+thus+called+David%3F%0A%0AIt+was+called+%E2%80%9CTehillim%2C%E2%80%9D+that+is%2C+hymns+or+praises%2C+because+it+was+given+as+the+matter+of+divine+praise+to+the+church+of+God+in+every+future+age.+It+is+also+called+%E2%80%9CPsalms%2C%E2%80%9D+because+many+of+these+%E2%80%9Cspiritual+songs%E2%80%9D+were%2C+at+the+temple+worship%2C+sung+with+the+psaltery.+Parts+of+the+book+have+other+names%2C+as+Mizmor%2C+Shir+%2846%2C+title%29%2C+Tehillah+%28145%2C+title%29%2C+Tephilah+%2817%2C86%2C102%2C+titles%29%2C+Prayers%2C+Shir-hammacholoth+%28120-134%29+%E2%80%93+Odes+of+Ascension.+They+are+also+called%2C+in+the+Septuagint%2C+Psalmoi.%0A%0AX.+When+were+the+Tehillim%2C+or+Psalms+written+and+formed+into+a+book%3F%0A%0AThey+were+written+in+a+manner+similar+to+the+other+parts+of+Scripture+Heb.+1%3A1%2C+during+a+period+of+nearly+one+thousand+years%2C+and+were+collected+into+one+book%2C+probably+by+%E2%80%9CEzra+the+priest%2C+a+scribe+of+the+law+of+the+God+of+heaven.%E2%80%9D+They+stood+in+their+present+numerical+order+in+the+days+of+the+apostles.+Acts+13%3A33.%0A%0AXI.+Were+other+songs%2C+beside+those+contained+in+the+Book+of+Psalms%2C+composed+during+that+period%3F%0A%0AYes%2C+many.+Such+as+the+Song+of+Deborah+Judg.+5%3A12%2C+the+song+of+the+well+Num.+21%3A17%2C+18%2C+the+1005+songs+of+Solomon%2C+and+others.%0A%0AXII.+Were+not+these+then+given+as+the+matter+of+her+praise%2C+or+are+they+not+commanded+to+be+sung+by+the+church+in+all+future+ages%3F%0A%0ANo.+As+we+read+of+different+books+in+Scripture%2C+such+as+the+book+of+Gad%2C+of+Nathan%2C+of+Jehu%2C+of+Jasher%2C+and+the+Epistle+from+Laodicea%2C+which+were+not+collected+into+the+sacred+canon%2C+by+the+Holy+Ghost%2C+so+we+thus+know%2C+that+by+the+same+divine+sovereignty%2C+the+songs+thus+noticed%2C+or+even+recorded%2C+were+ephemeral+as+matter+of+praise%3B+while+the+songs+contained+in+the+%E2%80%9CSepher+Tehillim%2C%E2%80%9D+or+Book+of+Psalms%2C+and+collected+and+placed+in+one+book+by+the+Spirit%2C+are+a+part+of+%E2%80%9Cthe+word+of+God%2C+which+liveth+and+abideth+forever%2C%E2%80%9D+selected+by+infinite+wisdom%2C+and+given+expressly+as+the+matter+of+praise+to+the+church+until+the+end+of+time.+The+same+principle+applies+to+any+isolated+and+occasional+hymns+or+songs%2C+which+may+be+found+in+the+New+Testament.%0A%0AXIII.+Were+any+attempts+made+to+add+to+the+Book+of+Psalms%2C+after+it+was+completed%3F%0A%0AYes.+The+151st+psalm+was+fabricated%2C+and+attempted+to+be+added+to+the+then+perfect+book%2C+nearly+three+hundred+years+before+%E2%80%9Cthe+Christian+era.%E2%80%9D+Septuagint%2C+Psa.+151st.%0A%0AXIV.+Is+such+an+attempt+authorized+by+God%3F%0A%0ANo.+It+arises+from+the+depravity+of+our+nature%2C+and+the+opposition+of+our+wills+to+the+divine+will%2C+and+consequently+forms+a+part+of+what+the+Holy+Ghost+calls+%E2%80%9Cwill+worship%2C%E2%80%9D+which+has+a+show+of+wisdom.+Col.+2%3A23.%0A%0AXV.+Is%2C+then%2C+this+book+called+the+Book+of+Psalms%2C+by+the+Holy+Ghost%3F%0A%0AIt+is+so+called%2C+both+by+Jesus+Christ+and+by+the+Spirit.+Luke+20%3A42%3B+Acts+1%3A20%3B+Heb.+4%3A7.%0A%0AXVI.+Was+it+given+to+the+Jewish+church+to+be+the+matter+of+praise+to+God%3F%0A%0AYes.+1+Chron.+16%3A7%3B+25%3A1%2C+5%3B+Psa.+81%3A1%3B+.+Neh.+12%3A8%2C+46%3B+Psa.+137%3A3%2C+4%3B+Ezra+3%3A10.%0A%0AXVII.+Was+the+Jewish+church+in+reality+different+from+the+Christian%3F%0A%0ANo.+They+are+the+same+church%2C+under+different+dispensations.+Acts+7%3A38%3B+Heb.+4%3A2%3B+Gal.+4%3A3%2C+4.%0A%0AXVIII.+When+Christ+came+%E2%80%9Cto+fulfil+all+righteousness%2C%E2%80%9D+and+by+his+evangelists+and+apostles+to+complete+the+oracles+of+God%2C+did+he%2C+or+they%2C+praise+Jehovah+by+singing+psalms%3F%0A%0AYes%2C+both+did.+Matt.+26%3A30%3B+Mark+14%3A26%3B+Acts+16%3A25%3B+Psa.+22%3A2%3B+Heb.+2%3A13.%0A%0AXIX.+Did+they+deliver%2C+by+inspiration%2C+any+other+%E2%80%9Cpsalms%2C+hymns%2C+or+spiritual+songs%2C%E2%80%9D+than+those+contained+%E2%80%9Cin+David%E2%80%9D%3F+Heb.+4%3A7.%0A%0ANo.+One+such+psalm+or+song+would+be+a+treasure+for+the+edification+of+the+saints%2C+if+%E2%80%9Cthe+Psalms%E2%80%9D+had+been+simply+Jewish%3B+and+yet+it+would+not+afford+a+precedent+or+warrant+for+uninspired+men+to+make+human+hymns%2C+and+sing+them+as+praise+to+God.+Isa.+1%3A12.+Hos.+13%3A2.%0A%0AXX.+What+is+a+human+hymn%2C+psalm%2C+or+spiritual+song%3F%0A%0AOne%2C+of+which+the+arrangement+and+composition+are+made+by+uninspired+men%2C+and+not+by+the+authority+and+wisdom+of+God%2C+even+although+the+sentiment+be+taken+from%2C+and+agree+with%2C+some+portion+of+Scripture.+It+has+%E2%80%9Ca+show+of+wisdom%3B%E2%80%9D+yet+it+is+only+man%E2%80%99s+opinion+which+will+be+opposed+and+contradicted+by+the+opinion+of+some+other+man+metrically+expressed%2C+in+language%2C+to+his+mind%2C+equally+scriptural.+Consequently%2C+%E2%80%9Cof+making+many+%E2%80%98hymn%E2%80%99+books+there+is+no+end.%E2%80%9D+We+have+now+more+than+one+for+each+Sabbath+in+the+year%2C+all+supplanting+%E2%80%9Cthe+Lord%E2%80%99s+song%2C%E2%80%9D+%28songs%29%2C+and+in+their+turn+supplanted+by+the+poetical+skill+and+caprice+of+other+men.+Such+compositions%2C+as+matter+of+praise%2C+are%2C+moreover%2C+purely+%E2%80%9Cwill+worship.%E2%80%9D+Isa.+1%3A12.%E2%80%9D%0A%0A%E2%80%94+Alexander+Blaikie%2C+A+Catechism+of+Praise%2C+%281849%3B+Boston%3A+S.+K.+Whipple+and+Co%2C+1854%29%2C+pp+8-11.&amp;url=https%3A%2F%2F5solasquotes.github.io%2Fquote%2F06eedf8df6.html&amp;via=5Solas" target="_blank" rel="noopener">Share on X

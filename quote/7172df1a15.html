<blockquote><p>§XXVII. With respect to Duration, the human soul is immortal, which Christian Religion teaches against the Sadducees, Epicureans, and Atheists, who think that souls are extinguished with their bodies. This is contradicted by: 1. Scripture, Eccl. 12:7, “The dust returns to its earth from whence it was, and the Spirit returns to God who gave it.” Mt. 10:28, “Fear not them which kill the body, but are not able to kill the soul: but rather fear him, which is able to destroy both soul and body in Hell.” Mt. 22:32, “I am the God of Abraham, and the God of Isaac, and the God of Jacob: God is not the God of the dead, but of the living.” Lk. 16:23, “The rich man in torments saw Abraham afar off, and Lazarus in his bosom,” etc. Lk. 23:43, Christ to the converted thief: “Today you will be with me in Paradise.” v. 46, Christ, expiring, cried out: “Father, into your hands I commend my Spirit.” 2 Cor. 5:8, Paul says: “We are willing rather to be absent from the body, and to be present with the Lord.” Phil. 1:23, “I have a desire to depart, and to be with Christ.” 1 Pet. 3:19, “By which also he went and preached unto the spirits in prison,” etc. add Ps. 49:15, “God will redeem my soul from the power of the grave: for He shall receive me.” 2 Sam. 12:23, “But now he is dead, wherefore should I fast? can I bring him back again? I shall go to him, but he shall not return to me.” 1 Kn. 17:21, “O Lord my God, I pray thee, let this child’s soul come into him again.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/barthold-holtzfus.html">Barthold Holtzfus</a></span><span class="wk"><span class="lbl">Work:</span> <cite>‘Theological Dissertation on Creation’</cite>, (Frankfurt: Steppinus, 1706), sect. 27, pp. 13-14 trans. AI Latin</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/man/image-of-god.html">Image of God</a></span></div>

</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-34e1ff4418" data-kw="">
<blockquote><p>…non-rational animals pursue the good in its most practical and immediate aspect, according to their (non- rational) desires and motivations. Only the rational creature, however, can desire the good as abstracted from practical desires and circumstances, pursuing goodness in its universal form as an end in itself. It is the intellectual and volitional capacity within the human person that makes him the image of God, distinct from other creatures who reflect God’s goodness in lesser ways. It is in the human soul precisely as rational that the image of God reaches its pinnacle in the created order. By extension, there is a sense in which God’s causal intimacy with created causes also finds a kind of special intimacy in the case of human willing. Because of the volitional capacity of the rational soul, our participation in the similitude of divine goodness is far deeper than that of any other creature.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/reginald-m-lynch.html">Reginald M. Lynch</a></span><span class="wk"><span class="lbl">Work:</span> <cite>“Divine Causality &amp; Human Freedom: Aquinas, Banez and Premotion after Descartes” in eds. Ballor, Gaetano &amp; Sytsma, Beyond Dordt &amp; De Auxiliis: the Dynamics of Protestant &amp; Catholic Soteriology in the Sixteenth &amp; Seventeenth Centuries</cite>, “Divine Causality &amp; Human Freedom: Aquinas, Banez and Premotion after Descartes” in eds. Ballor, Gaetano &amp; Sytsma, Beyond Dordt &amp; De Auxiliis: the Dynamics of Protestant &amp; Catholic Soteriology in the Sixteenth &amp; Seventeenth Centuries (Brill, 2019), p. 229 Lynch is a Dominican and writes in the Thomist tradition.</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/man/image-of-god.html">Image of God</a></span></div>

<blockquote><p>The correct judgment, I would argue, is that the conscious awareness characteristic of animal life is irreducible to the properties possessed either by inorganic substances or purely vegetative living substances, but that it is nevertheless an entirely physical or corporeal phenomenon.</p></blockquote>

</figure><figure class="quote" id="q-f28dcd04b0" data-kw="">
<blockquote><p>The nature of a thing: not how it is, but how it is meant to be… It is as though a physician who saw only broken arms assumed that if arms have no fractures there must be something wrong with them. How could we correct such a misguided physician? By calling his attention to the purpose or function of the arms, to their proper work. Broken arms cannot do their work as well as intact ones; therefore, brokenness is not their natural state. The nature of a thing is not determined by how something happens to be, but by what it is for — by what it is designed to do and to become, if everything goes well… What are men and women for? In one respect they are for the same thing: Being rational, they are for the knowledge of the truth, especially the truth about God. But there is a difference. A man is a rational being of that sex whose members are potentially fathers, and a woman is a rational being of that sex whose members are potentiality mothers. …potentiality is not the same thing as physical possibility. Consider a man who is infertile because of some disease. Although it is not physically possible for him to be a father, we should not say that he lacks the potentiality for fatherhood; as a man, he has the potentiality, but the disease has blocked its realization. It is just because he is a man, just because he is endowed with the potentiality for fatherhood, that the block to its physical realization is such an occasion for sorrow. Another reason why the expression ‘potentiality for fatherhood’ requires explanation is that although siring children is the most characteristic expression of fatherhood, it is far from its only expression… We can carry this line of reasoning still further. A potentiality is something like a calling. It wants, so to speak, to develop; it demands, so to speak, a response. It is like an arrow, notched in the string and aimed at the target, even if it never takes flight. It intimates an inbuilt meaning and expresses an inbuilt purpose, which cannot help but influence the mind and will of every person imbued with them… although not every woman is called to marry and bear physical children, ‘every woman, whether married or unmarried, is called upon to be a biological, psychological or spiritual mother.’ I am saying that for men, the reality is parallel. Not every man is called to marry and bear physical children, but every man, whether married or unmarried, is called upon to be a biological, psychological or spiritual father.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/j-budziszewski.html">J. Budziszewski</a></span><span class="wk"><span class="lbl">Work:</span> <cite>‘What makes Men Men?’, pt. 1</cite>, (2019)</span></figcaption>

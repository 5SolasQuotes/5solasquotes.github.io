<main class="wrap"><figure class="quote" id="q-6670386a33" data-kw="">
<blockquote><p>Our divines from Scripture make three degrees of excommunication: 1. A debarring from the Lord’s Supper, Mt. 5:24, but it is not indeed a delivering to Satan or excommunication: this is called the lesser excommunication. 2. A delivering to Satan, the greater excommunication, 1 Cor. 5:3-4, of this we speak here especially. 3. Maranatha in the Syriac, is an utter cursing till Christ’s Second Coming.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/samuel-rutherford.html">Samuel Rutherford</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Due Right of Presbyteries, ‘Acts 15, A Pattern of a Juridicial Synod’</cite>, (1644), pt. 1, Ch. 9, section 9, p. 283</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/church-discipline/excommunication.html">Excommunication</a></span></div>

</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-90684a6b60" data-kw="">
<blockquote><p>12. They [congregationalist puritans] hold that if any member of the congregation having committed a scandalous sin, shall of self forsake the worship of God and the spiritual communion with the Church, that the Church shall then send for the said person, and if he refuse to come they shall (after much seeking and long patience) openly declare that he has no part nor portion in the holy things of God among them; that then the ecclesiastical officers have no authority or jurisdiction over him, but only the civil magistrate, and those unto whom he owes civil subjection, as parents, masters, landlords, etc.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/william-ames.html">William Ames</a></span><span class="wk"><span class="lbl">Work:</span> <cite>English</cite>, [Congregationalist] Puritanism, containing the Main Opinions of the Rigidest Sort of Those that are Called Puritans [of the Congregational Variety] in the Realm of England (1641), pp. 18-19</span></figcaption>

</figure><figure class="quote" id="q-de92034391" data-kw="">
<blockquote><p>…for an excommunicate[d] person may remain externally without the Covenant to the visible Church, when baptism remains a seal, and may be a seal of a grace or privilege, which is interrupted or removed in act, but remains in habit: as to be the eldest son of a king may be a seal of the son’s heirship, and yet he may for a fault be disherited and cast out of his place. The Church and Church-membership are relata secundum esse [related according to being], not secundum dici [according to speaking] only, or relata [Greek]: but baptism and Church-membership are not so perfect relatives, but baptism does remain and the Church-membership may be dissolved: as the burgess ticket whereby a man has right to all the city privileges may remain, when the man for some crime committed against the city has lost all his city privileges and is not now a free citizen, in which case his burgess ticket seals nothing to him: So baptism seals not actual membership in case of excommunication, yet remains baptism valid in the acts of sealing other things [such as the invisible promises of God to the elect and regenerate, the forgiveness of sins, etc.].</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/samuel-rutherford.html">Samuel Rutherford</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Due Right of Presbyteries, ‘Acts 15, A Pattern of a Juridicial Synod’</cite>, … (London, 1644), pt. 2, ch. 4, section 5, p. 220</span></figcaption>

</figure><figure class="quote" id="q-ae3641a333" data-kw="">
<blockquote><p>And that otherwise, if the tares grow so rank that they cannot be pulled up, and if the same evil disease take hold of so very many that the consent of the Church cannot be had to the excommunication of a wicked person, then good men must grieve and groan, and endure what they cannot help. Therefore, that excommunication may fruitfully succeed, the consent of the people is necessary… Howbeit, even in such cases when the consent of the Church cannot be had to the execution of this discipline, faithful pastors and professors [laymen] must, every one for his own part, take heed that he have no fellowship with the unfruitful works of darkeness, but even reprove them; yea they ought, in sensu negativo, excommunicate those who should be (but are not) excommunicate positively: which negative excommunication is not an ecclesiastical censure, but either a bare punishment, or a cautel and animadversion; And so says the Archbishop of Spalato [Marco Antonio de Dominis, d. 1624] (De Republica Ecclesiastica, vol. 2, bk. 6, ch. 9, num. 8, pp. 735-36), not only one brother may refuse to communicate with another, but a people also may refuse to communicate with their pastor, which he confirms by certain examples.</p></blockquote>

<main class="wrap"><figure class="quote" id="q-1eea581c23" data-kw="">
<blockquote><p>…there are some things which, though appointed by God and of intrinsic importance, do not so belong to the essence of an ordinance that their absence renders it utterly invalid… Now in the sense indicated, instrumental music in worship is incidental, for we do not hold that its combination with vocal music renders the worship utterly void; yet we protest against its use as an unwarrantable element, and, on that account, a corruption of the worship.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/james-harper.html">James Harper</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Proceedings of the Convention of the United Presbyterians Opposed to Instrumental Music in the Worship of God</cite>, p. 105</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/worship/musical-instruments-in-worship.html">Musical Instruments in Worship</a></span></div>

</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-3e726a8c53" data-kw="">
<blockquote><p>It is somewhat remarkable that in our [Scottish] Reformation documents there is no reference to instrumental music. While many Roman practices are condemned in the first Book of Discipline and the Confession of Faith, nothing whatever is said against the use of organs or other instruments of music in the worship of God;</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/sean-p-m-mcdonald.html">Sean P.M. McDonald</a></span><span class="wk"><span class="lbl">Work:</span> <cite>”I will not hear the melody of thy viols’: Opposition to Instrumental Music in Historic Presbyterian &amp; Puritan Worship’ M.A. thesis (Liberty University, 2026) 138 pp. Covers Geneva, England, Scotland and the Netherlands, 1500’s to c. 1800, and touches upon Germany. | McDonald, from the second quote above, also appears to interpret silence in foundational Church documents as being against musical instruments. McMillan (p. 94), as quoted by McDonald (p. 33, fn. 74) relates:</cite></span></figcaption>

%20in%20the%20worship%20of%20God" rel="noopener" target="_blank">Read it online · Reformed Books Online</a></div>
</figure><figure class="quote" id="q-239084461a" data-kw="">
<blockquote><p>It was at Poietiers that the evangelisation of France began in a systematic way. The school which Calvin here gathered round him comprehended persons in all conditions of life… They discoursed about Divine mysteries as they walked together on the banks of the neighboring torrent, the Clain, or as they assembled in the garden of the Basses Treilles, where… they often held their re-unions… By-and-by it was thought prudent to discontinue these meetings in the Basses Treilles, and to seek some more remote and solitary place of re-union. A deep and narrow ravine… then known as the ‘Cave of Benedict,’ but which from that day to this has borne the name of “Calvin’s grotto,” was selected as the scene of the future gatherings of the converts. It was an hour’s walk from the town… In this grotto, so far as the light of history serves, was the Lord’s Supper celebrated for the first time in France after the Protestant fashion. On an appointed day the disciples met here, and Calvin, having expounded the Word and offered prayer, handed round the bread and cup, of which all partook… The place had none of the grandeurs of cathedral, but ‘the glory of God and the Lamb’ lent it beauty. No chant of priest, ‘no swell of organ accompanied the service, but the devotion of contrite hearts, in fellowship with Christ, was ascending from that rocky chamber, and coming up before the throne in heaven.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/france.html">France</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The First Protestant Administration of the Lord’s Supper, 1534 | J.A. Wylie, The History of Protestantism, vol. 2</cite>, p. 179</span></figcaption>

9084461a.html&amp;via=5Solas" target="_blank" rel="noopener">Share on X</a><a class="perma" href="../quote/239084461a.html">Permalink</a><a class="src" href="https://reformedbooksonline.com/topics/topics-by-subject/worship/musical-instruments/#:~:text=It%20was%20at%20Poietiers%20that%20the,up%20before%20the%20throne%20in%20heaven&amp;text=It%20was%20at%20Poietiers%20that%20the%20evangelisation%20of&amp;text=and%20coming%20up%20before%20the%20throne%20in%20heaven" rel="noopener" target="_blank">Read it online · Reformed Books Online</a></div>

<blockquote><p>§45. 5. And for organs or other instruments of music in God’s worship, they being a help partly natural and partly artificial, to the exhilarating of the spirits for the praise of God, I know no argument to prove them simply unlawful, but what would prove a cup of wine unlawful, or the tune and meter, and melody of singing unlawful. But yet if any would abuse it, by turning God’s worship into carnal pomp, and levity, especially by such non-intelligible singing, or bleating as some of our choristers used, the common people would have very great reason to be weary of it as accidentally evil.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/richard-baxter.html">Richard Baxter</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Five Disputations of Church-Government &amp; Worship (London: R.W., 1659), 5th Disputation, ch. 2</cite>, pp. 412</span></figcaption>

</figure><figure class="quote" id="q-267606c00b" data-kw="">
<blockquote><p>6. The Word is God’s mean to work supernatural effects, to convert the soul, Ps. 19:7, to work faith, Jn. 20:3, to edify, Acts 20:32, to save, Rom. 1:16. The obedience to God’s Word, brings peace, Ps. 119:165, comfort, v. 50; Gen. 49:18; Isa. 38:3. But ceremonies, being apt to stir up the dull mind, must be apt to remove natural dullness, which is a supernatural effect, and so to bring, peace, joy, comfort: Organs are now holden by the same right, that they were in Moses’ Law, then they must stir up supernatural joy: There must be peace and comfort in practicing them. Hear how this sounds: ‘This is my comfort, O Lord, in my affliction, that thy surplice, organs, and holy-days have quickened my dull heart.’ Now what comfort [is there], except comfort in the Scriptures? Rom. 15:4. Ceremonies be innocent of all Scriptures [have nothing of the Scriptures in them]. What joy (a proper fruit of the Kingdom of Heaven, Rom. 14:17) can be in sapless ceremonies? Yea, observe: 1. Who truly converted from Popery, who [is] inwardly humbled in soul, does not abhor ceremonies by the instinct of the new birth? 2. What slave of hell and profane person call not for ceremonies? 3. Who has peace in dying that ceremonies were their joy? 7. All lawful ordinances may by prayer be recommended to God for a blessed success as all the means of salvation, Ps. 119:18; Mt. 26:26; Acts 4:29-30. 2. We may thank God for a blessed success, which they have by the working of the spirit of Grace, 2 Cor. 2:24; 1 Cor. 1:4-5; 2 Thess. 1:2-3; Eph. 1:3. 3. We are to have heat of zeal against profaning of Word, sacraments, prayer, or other ordinances of God…</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/samuel-rutherford.html">Samuel Rutherford</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Divine Right of Church Government (1646), Question 3, ‘Whether Ceremonies Have any Divinity in Them’</cite>, p. 132</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/worship/musical-instruments-in-worship.html">Musical Instruments in Worship</a></span></div>

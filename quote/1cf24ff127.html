<main class="wrap"><figure class="quote" id="q-1cf24ff127" data-kw="">
<blockquote><p>Now God is creator alone, acknowledging no associates in this work, Isa. 44:24; Job 9:8. The reason for this is that creation is a work of infinite Divine power, Jer. 32:17, which, as He alone possesses, so He alone also can create—so that Jeremiah rightly pronounces, Jer. 10:10-12: ‘Those gods who have not made the heavens and the earth shall perish from the earth. But Jehovah is the true God, the living God, and everlasting King, who made the earth by His power,’ etc.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/johann-h-alting.html">Johann H. Alting</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Scriptural Theology of Heidelberg, vol. 1 (d. 1644; Amsterdam: Jansson, 1646), Locus 5, ‘On Creation’, trans. AI at Confessionally Reformed Theology</cite></span></figcaption>
<div class="meta"><span class="t"><a href="../topics/creation/the-six-days.html">The Six Days</a></span></div>

</figure><figure class="quote" id="q-d8f4358a5e" data-kw="">
<blockquote><p>As God is perfect in His works, He bestowed perfection on all of them according to their capacity: God’s works are perfect (Deut 32:4). He Himself is simply perfect by the fact that all things are pre-contained in Him, not as component parts, but as united in one simple whole, as Dionysius says (Div. Nom. v); in the same way as various effects pre-exist in their cause, according to its one virtue.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/thomas-aquinas.html">Thomas Aquinas</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Summa, pt. 1 | quest. 91, art. 1, I answer that</cite></span></figcaption>
<div class="meta"><span class="t"><a href="../topics/creation/the-six-days.html">The Six Days</a></span></div>

</figure><figure class="quote" id="q-7963400fc6" data-kw="">
<blockquote><p>As God did not make the whole fabric of the world at once, though it was not impossible to Him, being a God Almighty, but in the space of six days: So does God deal with his children, in creating in them a clean heart; first he suffers their hearts to be as a rude and massy lump, full of darkness, and then God sends his Holy Spirit into their hearts, and it does illuminate them; and drive away those black clouds of darkness and ignorance… 4… As the sun does now move with much celerity, so fast, that it does in the space of a day, run over many millions of miles.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/john-cotton.html">John Cotton</a></span><span class="wk"><span class="lbl">Work:</span> <cite>A Practical Commentary, or an Exposition with Observations, Reasons &amp; Uses upon the First Epistle General of John (d. 1652; 1658), on ch. 3, verse 2, doctrines 3-4</cite>, pp. 224-26</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/creation/the-six-days.html">The Six Days</a></span></div>

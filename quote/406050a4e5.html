<blockquote><p>In every generation, the doctrine of justification by faith alone comes under attack. As the heart of the gospel, the doctrine of justification is most fundamental to the definition of salvation and any adequate understanding of the atoning work of the Lord Jesus Christ. In our current cultural milieu where orthodox belief is despised and innovation is praised, many have ignored, maligned, or sought to redefine the biblical doctrine of justification by faith alone. Unfortunately, there are even those within more conservative theological domains whose definition of justification by faith falls short of the biblical and reformed doctrine of justification, particularly as defined in the Westminster Standards. To combat these harmful perversions, we here seek to define a clear, confessional polemic that might serve the church as a bulwark to “strengthen what remains.” …We deny that a man’s works, in any way, contribute to his justification, whether before or after believing on Christ in faith.[4] We deny that we are justified by “sanctifying fruit” in addition to faith in the perfection of Christ’s work. Furthermore, we deny that doing such works from a “justified position” qualifies those works to become somehow instrumental in obtaining one’s “final salvation”. …We deny that our deliverance requires the believer’s attainment of two statuses: namely initial justification and final salvation. While we still await the future enactment of our salvation, when the wrath of God against the nations is revealed and his children are brought into the kingdom fully, the ground of that future salvation is entirely present to the individual in the work of the Spirit at the moment of justification.[8] Furthermore, as God himself calls those whom he predestines, justifies those whom he calls, and glorifies those whom he justifies, we deny that any who are predestined, called, or justified may fail to partake of glorification in the end. Thus, we deny that our salvation from the final judgment is established or obtained through the works which proceed from that justification.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/general-synod-of-the-bible-presbyterian-church.html">General Synod of the Bible Presbyterian Church</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Resolution on the Doctrine of Justification</cite>, (August 2–6, 2018)</span></figcaption>

</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-cada49892a" data-kw="">
<blockquote><p>There are sundry cogent arguments which are taken from external considerations of the Scripture, that evince it on rational grounds to be from God. All these are motives of credibility, or effectual persuasives to account and esteem it to be the word of God. And although they neither are, nor is it possible they ever should be, the ground and reason whereon we believe it so to be with faith divine and supernateral; yet are they necessary unto the confirmation of our faith herein against temptations, oppositions, and objections. These arguments have been pleaded by many and that usefully, and therefore it is not needful for me to insist upon them. And they are the same for the substance of them in ancient and modern writers, however managed by some with more learning, dexterity, and force of reasoning than by others. …although we plead that no man can believe the Scriptures to be the word of God with faith divine, supernatural, and infallible, but upon its own internal divine evidence and efficacy, yet we allow and make use of all those external arguments of its sacred truth and divine original which are pleaded by others, ascribing unto them as much weight and cogency as they can do, acknowledging the persuasion which they beget and effect: to be as firm as they can pretend it to be: Only we do not judge them to contain the whole of the evidence which we have for faith to rest in, or to be resolved into; yea not that at all, which renders it divine, supernatural and infallible. The rational arguments we say which are, or may be used in this matter, with the human testimonies whereby they are corroborated, may and ought to be made use of and insisted on; and it is but vainly pretended that their use is superseded by our other assertions; as though where faith is required, all the subservient use of reason were absolutely discarded, and our faith thereby rendered irrational; and the assent unto the divine original and authority of the Scriptures, which the mind ought to give upon them, we grant to be of as high a nature as is pretended to be, namely, a moral certainty. Moreover, the conclusion which unprejudiced reason will make upon these arguments, is more firm, better grounded, and more pleadable, than that which is built merely on the sole authority of any church whatever…</p></blockquote>

</figure><figure class="quote" id="q-88caca9d13" data-kw="">
<blockquote><p>I tell you the truth, he who believes has everlasting life. John 6:47 One could preach a hundred thousand years about these words and emphasize them again and again. Yes, one can’t speak enough about these words. Here Christ explicitly promises eternal life to the believer. He doesn’t say that if we believe in him we will have eternal life. Rather, he says that as soon as we believe in him, we already have eternal life. He is speaking, not of future gifts, but of present ones. He is saying, “If you believe in me, you are saved. You already have eternal life.” This passage is the cornerstone of our justification. With it, we can settle the disputes we’re having about how we receive God’s approval. Good works don’t lead us to heaven or help us in the sight of God. Only faith can do this. Of course, we should do good works and live holy lives in obedience to God. But these efforts won’t help us earn salvation. We already have eternal life. If we don’t receive it while here on earth, we’ll never receive it after we leave. Eternal life must be attained and received in this body. Yet how do we acquire eternal life? God becomes our teacher, for he tells us about eternal life through those who preach his Word. He convinces us that we should accept his Word and believe in him. That is how it begins. Those same words that we hear and believe will lead us to none other than the person of Christ, born of the Virgin Mary. God will take us nowhere else. If we believe in Christ and cling to him, we are redeemed from both physical and spiritual death. We already have eternal life.</p></blockquote>

<blockquote><p>There are innumerable passages in Scripture in which forgiveness of sins is attributed to good works, proceeding from faith and the special aid of grace. to mot for the present that passage, St. James 2:24, where man is expressly said to be ‘justified by works, and not by faith only;’ to omit, I say, that passage, about the meaning of which there is such warm contention between the parties, and of which we will afterwards treat in its proper place, see Eze. 17:21, and 33:12, 14-16, 19; Mt. 6:14; 18:35; Lk. 6:37; James 5:19-20, etc. Nay, any one who attentively reads the Scriptures will find that there are perhaps more passages which exact the condition of good works for obtaining the pardon of sins and eternal life, than there are which require the condition of faith, simply so called (Apology for the Remonstrants’ Confession, ch. 22, p. 237 verso); although it [i.e. faith] is necessarily always understood (nay rather presupposed) in them all. Let whoever chooses consult the Collection of passages for good works taken from both Testaments by G. Wicelius (Coacervatio locorum utriusque Testamenti de absoluta necessitate bonorum operum), and others; but especially let him diligently, and without prejudice, read the Holy Scriptures themselves. Scripture also very frequently teaches that we are purged from sins by the participation of the sacraments. (Eph. 5:26; Acts 2:38; 22:16; Tit. 3:5-7; Mt. 26:27-28 and frequently others)</p></blockquote>

<div class="meta"><span class="t"><a href="../topics/justification/nature-of-justification.html">Nature of Justification</a></span></div>
<div class="actions"><button class="copy" data-copy="“There are innumerable passages in Scripture in which forgiveness of sins is attributed to good works, proceeding from faith and the special aid of grace. to mot for the present that passage, St. James 2:24, where man is expressly said to be ‘justified by works, and not by faith only;’ to omit, I say, that passage, about the meaning of which there is such warm contention between the parties, and of which we will afterwards treat in its proper place, see Eze. 17:21, and 33:12, 14-16, 19; Mt. 6:14; 18:35; Lk. 6:37; James 5:19-20, etc. Nay, any one who attentively reads the Scriptures will find that there are perhaps more passages which exact the condition of good works for obtaining the pardon of sins and eternal life, than there are which require the condition of faith, simply so called (Apology for the Remonstrants’ Confession, ch. 22, p. 237 verso); although it [i.e. faith] is necessarily always understood (nay rather presupposed) in them all. Let whoever chooses consult the Collection of passages for good works taken from both Testaments by G. Wicelius (Coacervatio locorum utriusque Testamenti de absoluta necessitate bonorum operum), and others; but especially let him diligently, and without prejudice, read the Holy Scriptures themselves. Scripture also very frequently teaches that we are purged from sins by the participation of the sacraments. (Eph. 5:26; Acts 2:38; 22:16; Tit. 3:5-7; Mt. 26:27-28 and frequently others)”

— William Forbes, Considerationes Modestae et Pacificae Controversiarum de Justificatione... 4th ed. (d. 1634; 1658; Oxford: Parker, 1850), vol. 1, bk. 1, ch. 3, pp. 39-41">Copy</button><a class="share" href="https://x.com/intent/post?text=%E2%80%9CThere+are+innumerable+passages+in+Scripture+in+which+forgiveness+of+sins+is+attributed+to+good+works%2C+proceeding+from+faith+and+the+special+aid+of+grace.+to+mot+for+the+present+that+passage%2C+St.+James+2%3A24%2C+where+man+is+expressly+said+to+be+%E2%80%98justified+by+works%2C+and+not+by+faith+only%3B%E2%80%99+to+omit%2C+I+say%2C+that+passage%2C+about+the+meaning+of+which+there+is+such+warm+contention+between+the+parties%2C+and+of+which+we+will+afterwards+treat+in+its+proper+place%2C+see+Eze.+17%3A21%2C+and+33%3A12%2C+14-16%2C+19%3B+Mt.+6%3A14%3B+18%3A35%3B+Lk.+6%3A37%3B+James+5%3A19-20%2C+etc.+Nay%2C+any+one+who+attentively+reads+the+Scriptures+will+find+that+there+are+perhaps+more+passages+which+exact+the+condition+of+good+works+for+obtaining+the+pardon+of+sins+and+eternal+life%2C+than+there+are+which+require+the+condition+of+faith%2C+simply+so+called+%28Apology+for+the+Remonstrants%E2%80%99+Confession%2C+ch.+22%2C+p.+237+verso%29%3B+although+it+%5Bi.e.+faith%5D+is+necessarily+always+understood+%28nay+rather+presupposed%29+in+them+all.+Let+whoever+chooses+consult+the+Collection+of+passages+for+good+works+taken+from+both+Testaments+by+G.+Wicelius+%28Coacervatio+locorum+utriusque+Testamenti+de+absoluta+necessitate+bonorum+operum%29%2C+and+others%3B+but+especially+let+him+diligently%2C+and+without+prejudice%2C+read+the+Holy+Scriptures+themselves.+Scripture+also+very+frequently+teaches+that+we+are+purged+from+sins+by+the+participation+of+the+sacraments.+%28Eph.+5%3A26%3B+Acts+2%3A38%3B+22%3A16%3B+Tit.+3%3A5-7%3B+Mt.+26%3A27-28+and+frequently+others%29%E2%80%9D%0A%0A%E2%80%94+William+Forbes%2C+Considerationes+Modestae+et+Pacificae+Controversiarum+de+Justificatione...+4th+ed.+%28d.+1634%3B+1658%3B+Oxford%3A+Parker%2C+1850%2

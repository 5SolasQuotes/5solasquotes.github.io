<blockquote><p>THESIS 1

Predestination is properly, according to the etymology of the word, a determination to an end, but in common usage, it is equivalent to the Greek word protagh and signifies the relation of the whole arrangement to the end, and thus we use it. …

THESIS 2

Predestination, therefore, is an act of the divine good-pleasure, by which God, from eternity, prepared the plenitude of His blessings, in Christ, for those, who should be heirs of salvation, to the praise of His glorious grace. …

THESIS 3

It is an act (for God is … simple energy) proceeding not from any external cause, but purely from Him who predestinates; otherwise it would not be, purely, predestination, preceding all things and causes. …

THESIS 4

Its cause is eujdokia good-pleasure, by which He was favourably disposed towards those, whom He pleased to adopt as sons, through Jesus Christ, according to the purpose of His election. …

THESIS 5

It is, therefore, God alone, who predestinates, the cause of His own predestination, and of that preparation which He proposed to Himself, according to that good pleasure of His will. …

THESIS 6

Therefore, this act is said to be from eternity, that is, before all things and causes, in things or of things, which He predestinated to exist.

THESIS 7

The material of predestination is twofold; divine things, and persons to be partakers of them. …

THESIS 8

The genus of the divine things, which are communicable through Predestination, is blessing, which the Apostle circumscribes within these modes; it is complete, not partial; spiritual, not carnal; “in heavenly places,” not natural, but surpassing all nature; finally, in Christ, that is, divine in its principle and foundation, that Christ may be the eternal head of the predestinate. …

THESIS 9

Of these blessings, the chief points are two, grace and glory; the former, acting on men in the present life, the latter to be consummated in them in the future life. …

THESIS 10

Human beings are creatures, in a condition of nature—which can effect nothing supernatural or divine—to be exalted above nature, and to be transferred to a participation of divine things by the supernatural energy of the Deity. …

THESIS 11

The form is adoption, as sons, through Jesus Christ, that is, that real relation and ordination, in which we are blessed of God, by the communication of “all spiritual blessings in heavenly places” in Christ. …

THESIS 12

The order of this form is placed in the preparation, of persons, by election, vocation, and “gathering together in Christ” (Ephes. i. 10); but of things, by a gracious beginning, progress, and glorious consummation of blessings, in a perfect union with Christ.

THESIS 13

The end is the praise of the glorious grace of God, by which He has freely made us acceptable unto Himself, in the Son of His love. …

THESIS 14

What is contrary to this predestination can not, with propriety, be expressed in a single term, since the relation of predestination is single, that of its contraries is various. For preterition is contrary to the preparation of grace, and reprobation or preparation of punishment is contrary to the preparation of glory. …

THESIS 15

Preterition is the act of the divine will, by which God, from eternity, determined to leave some of His creatures in their natural state, and not to communicate to them that supernatural grace, by which their nature might be preserved uncorrupt, or, having become corrupt, might be restored, to the declaration of the freedom of His own goodness. …

THESIS 16

This preterition is without blame: for God bestowed on man the perfection of human nature, He was not under obligation to bestow grace upon any one. It is grace; therefore, there is no obligation. …

THESIS 17

The preparation of punishment is the act of the divine pleasure, by which God, from eternity, determined, for the declaration of His own justice, to punish His creatures, who should not continue in their original state, but should depart from God, the author of their origin, by their own deed and depravity. …

THESIS 18

Therefore, in the predestinate, God does all things according to the good-pleasure of His own predestination. In those who are not predestinate, He uses preterition according to the pleasure of His will, and prepares punishment for His creatures who transgress against His order, and who must be reprobated, on account of their sins, from the necessity of His justice. …

THESIS 19

If reprobation is made the opposite of predestination, the statement is figurative, and synecdochical: wherefore, it either should not be made, because it is improper, dangerous, and liable to give offense, or it should be distinctly explained, as pious and learned men have done. …

THESIS 20

The presentation of this doctrine is especially necessary, if it is treated skilfully, soberly, and reverently, that is, that not any thing else be treated, not otherwise, not to another end than as the Holy Scriptures teach, both in explanation and in application, according to the advice of St. Paul: “not to think of himself more highly than he ought to think, but to think soberly.” Rom. xii. 3.</p></blockquote>

The presentation of this doctrine is especially necessary, if it is treated skilfully, soberly, and reverently, that is, that not any thing else be treated, not otherwise, not to another end than as the Holy Scriptures teach, both in explanation and in application, according to the advice of St. Paul: “not to think of himself more highly than he ought to think, but to think soberly.” Rom. xii. 3.”

— Francis Junius, Theses Concerning Divine Predestination, Composed, in these very words, by Himself, and Publicly Discussed, Under His Direction, By William Coddaeus, in The University Of Leyden, in the Year 1593, in The Works of James Arminius, D.D., Formerly Professor of Divinity in the University of Leyden, trans. James Nichols and W. R. Bagnall (3 vols, Auburn: Derby, and Miller, 1853), 3: 263-77.">Copy</button><a class="share" href="https://x.com/intent/post?text=%E2%80%9CTHESIS+1%0A%0APredestination+is+properly%2C+according+to+the+etymology+of+the+word%2C+a+determination+to+an+end%2C+but+in+common+usage%2C+it+is+equivalent+to+the+Greek+word+protagh+and+signifies+the+relation+of+the+whole+arrangement+to+the+end%2C+and+thus+we+use+it.+%E2%80%A6%0A%0ATHESIS+2%0A%0APredestination%2C+therefore%2C+is+an+act+of+the+divine+good-pleasure%2C+by+which+God%2C+from+eternity%2C+prepared+the+plenitude+of+His+blessings%2C+in+Christ%2C+for+those%2C+who+should+be+heirs+of+salvation%2C+to+the+praise+of+His+glorious+grace.+%E2%80%A6%0A%0ATHESIS+3%0A%0AIt+is+an+act+%28for+God+is+%E2%80%A6+simple+energy%29+proceeding+not+from+any+external+cause%2C+but+purely+from+Him+who+predestinates%3B+otherwise+it+would+not+be%2C+purely%2C+predestination%2C+preceding+all+things+and+causes.+%E2%80%A6%0A%0ATHESIS+4%0A%0AIts+cause+is+eujdokia+good-pleasure%2C+by+which+He+was+favourably+disposed+towards+those%2C+whom+He+pleased+to+adopt+as+sons%2C+through+Jesus+Christ%2C+according+to+the+purpose+of+His+election.+%E2%80%A6%0A%0ATHESIS+5%0A%0AIt+is%2C+therefore%2C+God+alone%2C+who+predestinates%2C+the+cause+of+His+own+predestination%2C+and+of+that+preparation+which+He+proposed+to+Himself%2C+according+to+that+good+pleasure+of+His+will.+%E2%80%A6%0A%0ATHESIS+6%0A%0ATherefore%2C+this+act+is+said+to+be+from+eternity%2C+that+is%2C+before+all+things+and+causes%2C+in+things+or+of+things%2C+which+He+predestinated+to+exist.%0A%0ATHESIS+7%0A%0AThe+material+of+predestination+is+twofold%3B+divine+things%2C+and+p <blockquote><p>More then this (Brethren) ye see the Thessalonians are elected: yet he prays for them, Making mention (sayeth he) of you in our prayers. And for this same cause; knowing that ye are elected. Mark this. The election of God, that sure ground and foundation of life and salvation, prejudges not prayer. Therefore, say not, I am elected, my salvation cannot fail, saved must I be therefore, what needs me to pray myself, or cause any other pray for me? No, by the contrary, say, I am elected, therefore, I will pray: ye are the elect, therefore, I will pray for you: that is Paul’s reason.

For, as salvation, and life is predestinate and appointed by God, so are the means of salvation appointed by God, which thou must use, if ever thou wouldst attain to life, notwithstanding of thy election. And among all the rest of the means, Prayer is one: thou who art chosen to life, prayers is a mean to thee, to be used before thou come to life: Pray must thou, and others must pray for thee, or else, thou was never chosen to life.

There was never man chosen to life from all eternity; but the Lord appointed that he should use prayer; also God ordained that he should live in holiness, and work good works, which is an other mean must be used. Ephes. 2. 10. For, if prayer be not used, if he live not holy, if he live without love, without charity and good works, if he continue so to the end, he shall find that he was never chosen.</p></blockquote>

tml&amp;via=5Solas" target="_blank" rel="noopener">Share on X</a><a class="perma" href="../quote/eb68425f54.html">Permalink</a><a class="src" href="https://reformedcovenanter.wordpress.com/2020/04/17/robert-rollock-on-election-and-prayer/" rel="noopener" target="_blank">Read it online · Reformed Covenanter</a></div>
</figure><figure class="quote" id="q-8062fcc4ca" data-kw="">
<blockquote><p>I have followed this method in the Theses on the secret of eternal Predestination, in which I considered primarily the efficient cause of Election and Reprobation with utmost diligence and faith. However, I could not escape the foul calumnies of detractors and some unreasonable people. For when I have shown from the Gospel of Jesus Christ that the decree of eternal election must be distinguished from our eternal salvation as a cause from its effect, and that the means leading us to that eternal salvation, among which are faith in Christ and His merit, are efficient causes of eternal salvation, but not the decree of election, some have dared, prompted by weakness or perhaps ignorance combined with a malicious intent, to affirm that I have taught that we are not saved by faith in Christ and that the merit of Christ is not the cause of our eternal salvation. But I give thanks to my God, who deigns to gradually make me conformed to the image of His Son, for enduring calumnies for the sake of heavenly truth; and I persuade myself that it is Christian to be ill-spoken of when you believe rightly and teach and do well.</p></blockquote>

</figure><figure class="quote" id="q-653a46e356" data-kw="">
<blockquote><p>In their awareness and assurance of this election, God’s children daily find greater cause to humble themselves before God, to adore the fathomless depth of God’s mercies, to cleanse themselves, and to give fervent love in return to the One who first so greatly loved them. This is far from saying that this teaching concerning election, and reflection upon it, make God’s children lax in observing his commandments or carnally self-assured. By God’s just judgment this does usually happen to those who casually take for granted the grace of election or engage in idle and brazen talk about it but are unwilling to walk in the ways of the chosen.</p></blockquote>

</figure><figure class="quote" id="q-9aa9e0dab1" data-kw="">
<blockquote><p>But if the law of God be diligently searched, this doubt shall easily be resolved. For it will witness that no less ought the murderer, the blasphemer, and such other, to suffer the death, then that the meek and the fearer of God should be defended. And also, that such as maintain and defend the one, are no less criminal before God then those that oppress the others. […] Now to you justifiers of Servetus: Servetus was an abominable blasphemer against God; and you are justifiers of Servetus: therefore ye are blasphemers before God, like abominable as he was. […] Ye will not easily admit that Servetus be convicted of blasphemy; for if he be, ye must be compelled to confess (except that ye will refuse God) that the sentence of death executed against him was not cruelty; neither yet that the judges who justly pronounced that sentence were murderers nor persecutors; but that this death was the execution of God’s judgement, and they the true faithful servants of God, who, when no other remedy was found, did take away iniquity from amongst them. That God hath appointed death by his law, without mercy, to be executed upon the blasphemers, is evident by that which is written, Leviticus 24.</p></blockquote>

<main class="wrap"><figure class="quote" id="q-4cc857019a" data-kw="">
<blockquote><p>It is the love of a Divine Person in human nature. The body which was prepared for him was animated, not by his divine nature, but by a human soul, and in this body he was to make his love effectual by means of all the inward affections, as well as external actions which were peculiar and proper to it. His human nature was furnished immeasurably with all grace, and especially with love, pity, and compassion to fallen and lost men.

There was a universal love, or benevolence, exerted in doing good to all within his reach, and in loving and forgiving his enemies, which was the soul of his obedience, and the fulfilling of the law. But there was also in his human soul a peculiar love to those who were given him by the Father, which exerted itself in strong, fervent, and irrepressible desires for their salvation, and which urged him on, and gave him no rest, until he had completed it by “giving himself an offering and a sacrifice of a sweet-smelling savour to God.” “I have a baptism to be baptized with, and how am I straitened till it be accomplished.” “With desire have I desired to eat this passover with you before I suffer.”

So strong did the manifestations of this desire become as the hour of its consummation approached, that the disciples, and especially those that were with him in the garden, might have said, in the language of Naomi, “The man will not be in rest, until he have finished the thing this day.” Now, in meditating on the love of Christ, we are not to confine our thoughts to the eternal actings of his divine nature (for all the acts of his love, as God, must be eternal), but are to take into view also its temporal acting in the human nature.

In undertaking our cause from everlasting, and in becoming man, the love of the divine nature only was displayed; but subsequently to the incarnation there was a concurrence of the two natures in the expression of love, and though the acts of love in these two natures were infinitely distinct, yet, in virtue of the hypostatical union, they were acts of one and the same person. If the bodily actions of Christ were the acts of his divine person, surely his mental acts were so also; if the act of laying down his life, so also the cheerfulness and delight with which he made the sacrifice, from regard to his Father’s glory, and from love to sinners. “God purchased the Church with his own blood.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/thomas-m-crie-sr.html">Thomas M’Crie Sr.</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Love of Christ in Sermons</cite></span></figcaption>

<blockquote><p>Although he took on him those infirmities which belong unto our human nature as such, and are inseparable from it until it be glorified, yet he took none of our particular infirmities which cleave unto our persons, occasioned either by the vice of our constitutions or irregularity in the use of our bodies. Those natural passions of our minds which are capable of being the moans of affliction and trouble, as grief, sorrow, and the like, he took upon him; as also those infirmities of nature which are troublesome to the body, as hunger, thirst, weariness, and pain,—yea, the purity of his holy constitution made him more highly sensible of these things than any of the children of men;—but as to our bodily diseases and distempers, which personally adhere unto us, upon the disorder and vice of our constitutions, he was absolutely free from them.</p></blockquote>

<blockquote><p>HUMAN NATURE in its FOURFOLD STATE, was the first production of my venerable Ancestor, introduced to the Public. It made its first appearance in the year 1720. Since that period, it has undergone at an average, One complete Edition every two years. Twenty thousand Copies of it have been exported to America, from one single City in Scotland, besides those that have been sent to the Continent from England and Ireland.

The rapid sale of the Book upon its first Publication, is a demonstrative proof of the esteem in which it was then held: and the uninterrupted demand for it still, shows that the Principles it inculcates, are yet held in repute. All that I need further to add, is, That the present Edition is printed from that one Revised and Corrected by the Author himself, and may therefore be esteemed correct.</p></blockquote>

<blockquote><p>Where Christ sitteth on the right hand of God.] This is that other inducement or spur to seek and affect lofty or celestial things: Christ sitteth at the right hand of God; therefore it behoves us to seek and to affect the things that are above. First we shall explain the meaning of these words; and then shew the force of the argument, or the consequence of the reason.

In the first place, then, it must be borne in mind, that this is spoken of Christ properly and especially as to his human nature, in which he rose, and ascended, and sits at the right hand of the Father, as it is stated in the Apostles’ Creed: and although as to the Divine nature, we must believe that he sat at the right hand of the Father from all eternity, i.e. as Damascenus [John of Damascus], Lib. 4. cap. 2, has expounded it, that he had an equality of Divine Majesty with God the Father: By the right hand of the Father we mean the glory and honour of the Godhead; in which the Son of God existed, before the world began, as God, and of one substance with the Father, but became incarnate in these last days, and sitteth there bodily, his flesh being also glorified. Therefore, passing by this Exposition of Damascenus, which respects the Divine nature of Christ and his eternal Majesty, let us inquire what is intimated under the words to sit at the right hand of God, when they are applied to the human nature of Christ and its exaltation effected in time.

This is the sum; Since God hath no bodily right hand, by this sitting is signified, that Christ as man, having accomplished the work of our redemption, is not only endowed with immortality and perfect blessedness, but is raised to heaven, placed above all creatures, Lord, Governor, and Judge of the whole world, and especially constituted the most glorious and powerful King and Patron of the Church. Augustine, De fide et symbolo, Tom. 3, says, to sit, is to possess judicial power; but to be at the right hand of God, is to be in the highest blessedness; as to be at the left hand is to be in the deepest misery. But what it is for the man Christ to sit at the right hand of the Father, is best explained by the Apostle in Ephes. i. 20, 21, and 22. It comprises, then, the exaltation of the human nature to a state of the completest happiness and glory of which it could be capable, and likewise exaltation and authority over all other creatures.

The error of certain moderns is therefore to be avoided, who, from this sitting of Christ at the right hand of God, endeavour to infer, that Divine Majesty, ubiquity, and all the properties of Deity are really communicated to the human nature of Christ. But they are easily refuted;

1. Because, if the Divine attributes be really communicated to the human nature, the human nature is really God: for the Divine attributes are nothing else than the Divine essence. We therefore acknowledge that Christ incarnate has an equality of glory and majesty with God the Father: but we deny that the flesh of Christ, or the human nature, has, or can have this; because it is not consubstantial with God, although it is hypostatically united to God.

2. They are refuted from the circumstance of time. For (as they will have it) a real communication of attributes to the human nature arises from its hypostatic union with the Divine: but this sitting of the man Christ at the right hand of God, of which the Apostle speaks, followed his passion and resurrection. This we learn from the order of the articles in the Apostles’ Creed: He rose again; he ascended into heaven; he sat down, &amp;c. This Christ himself teaches us, Luke xxiv. 26, Ought not Christ to have suffered, and to enter into his glory? And the Apostle, Heb. i. 3, After that he had purged our sins, he sat down at the right hand of the Majesty on high.

3. As to the ubiquity of Christ’s body; that is manifestly refuted, not established in this place. For the Apostle says, that the minds of Christians ought to be directed heavenward, not set upon earthly things, for this reason, that Christ is exalted at the right hand of God in the heavens, now no more to dwell with us upon earth in his bodily presence, although as to the presence of the Divine Majesty he is ever with us. Thus in Ephes. i. 20, He set Christ at his own right hand. Where? In the heavens; and Heb. i. 3, in the highest places.

Although, therefore, the right hand of God is every where, if thereby we understand the Divine Majesty and power; because God is every where: yet Christ, as far as regards his body, or his human nature, is set at the right hand of God, not as regards his ubiquity, but his presence in heaven. And thus ye see briefly in what sense Christ is set at the right hand of God: His Divine nature, or the person of the Word, sits in the equality of Majesty and glory, and of all the Divine attributes; the human nature sits above all created things, but yet beneath God, viz. endued with majesty, and the greatest glory adapted to it, and of which it can be capable.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/john-davenant.html">John Davenant</a></span><span class="wk"><span class="lbl">Work:</span> <cite>An Exposition of the Epistle of St. Paul to the Colossians</cite>, trans. Josiah Allport (1627; 2 vols, London: Hamilton, Adams, and Co., 1832), 2: 11-14.</span></figcaption>

The error of certain moderns is therefore to be avoided, who, from this sitting of Christ at the right hand of God, endeavour to infer, that Divine Majesty, ubiquity, and all the properties of Deity are really communicated to the human nature of Christ. But they are easily refuted;

1. Because, if the Divine attributes be really communicated to the human nature, the human nature is really God: for the Divine attributes are nothing else than the Divine essence. We therefore acknowledge that Christ incarnate has an equality of glory and majesty with God the Father: but we deny that the flesh of Christ, or the human nature, has, or can have this; because it is not consubstantial with God, although it is hypostatically united to God.

2. They are refuted from the circumstance of time. For (as they will have it) a real communication of attributes to the human nature arises from its hypostatic union with the Divine: but this sitting of the man Christ at the right hand of God, of which the Apostle speaks, followed his passion and resurrection. This we learn from the order of the articles in the Apostles’ Creed: He rose again; he ascended into heaven; he sat down, &amp;c. This Christ himself teaches us, Luke xxiv. 26, Ought not Christ to have suffered, and to enter into his glory? And the Apostle, Heb. i. 3, After that he had purged our sins, he sat down at the right hand of the Majesty on high.

3. As to the ubiquity of Christ’s body; that is manifestly refuted, not established in this place. For the Apostle says, that the minds of Christians ought to be directed heavenward, not set upon earthly things, for this reason, that Christ is exalted at the right hand of God in the heavens, now no more to dwell with us upon earth in his bodily presence, although as to the presence of the Divine Majesty he is ever with us. Thus in Ephes. i. 20, He set Christ at his own right hand. Where? In the heavens; and Heb. i. 3, in the highest places.

Although, therefore, the right hand of God is every where, if thereby we understand the Divine Majesty and power; because God is every where: yet Christ, as far as regards his body, or his human nature, is set at the right hand of God, not as regards his ubiquity, but his presence in heaven. And thus ye see briefly in what sense Christ is set at the right hand of God: His Divine nature, or the person of the Word, sits in the equality of Majesty and glory, and of all the Divine attributes; the human nature sits above all created things, but yet beneath God, viz. endued with majesty, and the greatest glory adapted to it, and of which it can be capable.”

— John Davenant, An Exposition of the Epistle of St. Paul to the Colossians, trans. Josiah Allport (1627; 2 vols, London: Hamilton, Adams, and Co., 1832), 2: 11-14.">Copy</button><a class="share" href="https://x.com/intent/post?text=%E2%80%9CWhere+Christ+sitteth+on+the+right+hand+of+God.%5D+This+is+that+other+inducement+or+spur+to+seek+and+affect+lofty+or+celestial+things%3A+Christ+sitteth+at+the+right+hand+of+God%3B+therefore+it+behoves+us+to+seek+and+to+affect+the+things+that+are+above.+First+we+shall+explain+the+meaning+of+these+words%3B+and+then+shew+the+force+of+the+argument%2C+or+the+consequence+of+the+reason.%0A%0AIn+the+first+place%2C+then%2C+it+must+be+borne+in+mind%2C+that+this+is+spoken+of+Christ+properly+and+especially+as+to+his+human+nature%2C+in+which+he+rose%2C+and+ascended%2C+and+sits+at+the+right+hand+of+the+Father%2C+as+it+is+stated+in+the+Apostles%E2%80%99+Creed%3A+and+although+as+to+the+Divine+nature%2C+we+must+believe+that+he+sat+at+the+right+hand+of+the+Father+from+all+eternity%2C+i.e.+as+Damascenus+%5BJohn+of+Damascus%5D%2C+Lib.+4.+cap.+2%2C+has+expounded+it%2C+that+he+had+an+equality+of+Divine+Majesty+with+God+the+Father%3A+By+the+right+hand+of+the+Father+we+mean+the+glory+and+honour+of+the+Godhead%3B+in+which+the+Son+of+God+existed%2C+before+the+world+began%2C+as+God%2C+and+of+one+substance+with+the+Father%2C+but+became+incarnate+in+these+last+days%2C+and+sitteth+there+bodily%2C+his+flesh+being+also+glorified.+Therefore%2C+passing+by+this+Exposition+of+Damascenus%2C+which+respects+the+Divine+nature+of+Christ+and+his+eternal+Majesty%2C+let+us+inquire+what+is+intimated+under+the+words+to+sit+at+the+right+hand+of+God%2C+when+they+are+applied+to+the+human+nature+of+Christ+and+its+exaltation+effected+in+time.%0A%0AThis+is+the+sum%3B+Since+God+hath+no+bodily+right+hand%2C+by+this+sitting+is+signified%2C+that+Christ+as+man%2C+having+accomplished+the+work+of+our+redemption%2C+is+not+only+endowed+with+immortality+and+perfect+blessedness%2C+but+is+raised+to+heaven%2C+placed+above+all+creatures%2C+Lord%2C+Governor%2C+and+Judge+of+the+whole+world%2C+and+especially+constituted+the+most+glorious+and+powerful+King+and+Patron+of+the+Church.+Augustine%2C+De+fide+et+symbolo%2C+Tom.+3%2C+says%2C+to+sit%2C+is+to+possess+judicial+power%3B+but+to+be+at+the+right+hand+of+God%2C+is+to+be+in+the+highest+blessedness%3B+as+to+be+at+the+left+hand+is+to+be+in+the+deepest+misery.+But+what+it+is+for+the+man+Christ+to+sit+at+the+right+hand+of+the+Father%2C+is+best+explained+by+the+Apostle+in+Ephes.+i.+20%2C+21%2C+and+22.+It+comprises%2C+then%2C+the+exaltation+of+the+human+nature+to+a+state+of+the+completest+happiness+and+glory+of+which+it+could+be+capable%2C+and+likewise+exaltation+and+authority+over+all+other+creatures.%0A%0AThe+error+of+certain+moderns+is+therefore+to+be+avoided%2C+who%2C+from+this+sitting+of+Christ+at+the+right+hand+of+God%2C+endeavour+to+infer%2C+that+Divine+Majesty%2C+ubiquity%2C+and+all+the+properties+of+Deity+are+really+communicated+to+the+human+nature+of+Christ.+But+they+are+easily+refuted%3B%0A%0A1.+Because%2C+if+the+Divine+attributes+be+really+communicated+to+the+human+nature%2C+the+human+nature+is+really+God%3A+for+the+Divine+attributes+are+nothing+else+than+the+Divine+essence.+We+therefore+acknowledge+that+Christ+incarnate+has+an+equality+of+glory+and+majesty+with+God+the+Father%3A+but+we+deny+that+the+flesh+of+Christ%2C+or+the+human+nature%2C+has%2C+or+can+have+this%3B+because+it+is+not+consubstantial+with+God%2C+although+it+is+hypostatically+united+to+God.%0A%0A2.+They+are+refuted+from+the+circumstance+of+time.+For+%28as+they+will+have+it%29+a+real+communication+of+attributes+to+the+human+nature+arises+from+its+hypostatic+union+with+the+Divine%3A+but+this+sitting+of+the+man+Christ+at+the+right+hand+of+God%2C+of+which+the+Apostle+speaks%2C+followed+his+passion+and+resurrection.+This+we+learn+from+the+order+of+the+articles+in+the+Apostles%E2%80%99+Creed%3A+He+rose+again%3B+he+ascended+into+heaven%3B+he+sat+down%2C+%26c.+This+Christ+himself+teaches+us%2C+Luke+xxiv.+26%2C+Ought+not+Christ+to+have+suffered%2C+and+to+enter+into+his+glory%3F+And+the+Apostle%2C+Heb.+i.+3%2C+After+that+he+had+purged+our+sins%2C+he+sat+down+at+the+right+hand+of+the+Majesty+on+high.%0A%0A3.+As+to+the+ubiquity+of+Christ%E2%80%99s+body%3B+that+is+manifestly+refuted%2C+not+established+in+this+place.+For+the+Apostle+says%2C+that+the+minds+of+Christians+ought+to+be+directed+heavenward%2C+not+set+upon+earthly+things%2C+for+this+reason%2C+that+Christ+is+exalted+at+the+right+hand+of+God+in+the+heavens%2C+now+no+more+to+dwell+with+us+upon+earth+in+his+bodily+presence%2C+although+as+to+the+presence+of+the+Divine+Majesty+he+is+ever+with+us.+Thus+in+Ephes.+i.+20%2C+He+set+Christ+at+his+own+right+hand.+Where%3F+In+the+heavens%3B+and+Heb.+i.+3%2C+in+the+highest+places.%0A%0AAlthough%2C+therefore%2C+the+right+hand+of+God+is+every+where%2C+if+thereby+we+understand+the+Divine+Majesty+and+power%3B+because+God+is+every+where%3A+yet+Christ%2C+as+far+as+regards+his+body%2C+or+his+human+nature%2C+is+set+at+the+right+hand+of+God%2C+not+as+regards+his+ubiquity%2C+but+his+presence+in+heaven.+And+thus+ye+see+briefly+in+what+sense+Christ+is+set+at+the+right+hand+of+God%3A+His+Divine+nature%2C+or+the+person+of+the+Word%2C+sits+in+the+equality+of+Majesty+and+glory%2C+and+of+all+the+Divine+attributes%3B+the+human+nature+sits+above+all+created+things%2C+but+yet+beneath+God%2C+viz.+endued+with+majesty%2C+and+the+greatest+glory+adapted+to+it%2C+and+of+which+it+can+be+capable.%E2%80%9D%0A%0A%E2%80%94+John+Davenant%2C+An+Exposition+of+the+Epistle+of+St.+Paul+to+the+Colossians%2C+trans.+Josiah+Allport+%281627%3B+2+vols%2C+London%3A+Hamilton%2C+Adams%2C+and+Co.%2C+1832%29%2C+2%3A+11-14.&amp;url=https%3A%2F%2F5solasquotes.github.io%2Fquote%2F47306e930b.html&amp;via=5Solas" target="_blank" rel="noopener">Share on X</a><a class="perma" href="../quote/47306e930b.html">Permalink</a><a class="src" href="https://reformedcovenanter.wor <blockquote><p>3. Nor does it hinder [the legitimacy of the atonement] that Christ, as subject to the divine law, also owed obedience, which seems to destroy all merit (Socinus ibid. ch. 5 and Praelections, ch. 18, §4). For he did not owe it by that title of justice by which he now offered it, namely for sins. And what else is merit with respect to God than if a rational person offers those formal acts which are in the pact? as Adam and the fallen angels would have merited salvation if they had rendered the obedience that was in the pact. Why therefore will we detract praise of merit from Christ, who most exactly satisfied the divine demands?</p></blockquote>

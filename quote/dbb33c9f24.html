<main class="wrap"><figure class="quote" id="q-dbb33c9f24" data-kw="">
<blockquote><p>§20. For private duties, both personal and domestic, they are either antecedent or consequent to the solemn public worship, as usually for time it is celebrated amongst us. These consisting in the known religious exercises of prayer, reading the Scripture, meditation, family instructions from the advantage of the public ordinances, they are to be recommended unto every one’s conscience, ability, and opportunity, as they shall find strength and assistance for them.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/john-owen.html">John Owen</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Exercitation XL, ‘The Practical Observance of the Lord’s Day’ in Commentary on Hebrews (d. 1683), vol. 1 (of 4)</cite>, p. 750</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/worship/the-lords-day.html">The Lord&#x27;s Day</a></span></div>

</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-129532c924" data-kw="">
<blockquote><p>‘Such things’ (says Aaron) ‘have befallen me, and if I had eaten the sin-offering to day, should it have been good in the eyes of the Lord?’ [Lev. 10:19] In these words Aaron excuses himself, by reason of his sorrow, which made him unfit and unworthy to eat of those holy things. Dt. 12:7 &amp; 26:14; Hos. 9:4. The [Romanist] Douay divines, somewhat to the same purpose: ‘Natural grief of mind made Aaron both unwilling to eat, and less apt to complete all the ceremonies: so without sin he omitted that pertained to his own commodity, offering it unto God.’ The Geneva notes, ‘Moses bare with his infirmity, considering his great sorrow, but does not leave an example to forgive them that maliciously transgress the commandment of God.’… The conclusions from this text of Scripture may be such as these, that oftentimes the letter of the Law gives place to great necessities…</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/john-ball.html">John Ball</a></span><span class="wk"><span class="lbl">Work:</span> <cite>An Answer to Two Treatises of Mr. John Can, the Leader of the English Brownists in Amsterdam… (London: R.B., 1642), ch. 1, section 4</cite>, p. 52</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/worship/the-lords-day.html">The Lord&#x27;s Day</a></span></div>

%20necessities" rel="noopener" target="_blank">Read it online · Reformed Books Online</a></div>
</figure><figure class="quote" id="q-1fbfb885bf" data-kw="">
<blockquote><p>How blind is superstition, that they [the Pharisees] could think that it was contrary to the will of God that his people should fit themselves for the service of the Sabbath by a moderate refreshment?… What a little thing do they carp at? Wherein was the sin, the plucking of a few ears of corn, and rubbing them, could hardly be called servile labor, especially not in the sense of the commandment, which restrained not necessary labour, but such labor as took them off from the duties of the Sabbath, but their tradition had made this unlawful…</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/matthew-poole.html">Matthew Poole</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Annotations upon the Holy Bible. Vol. II… (London: Parkhurst, 1685), on Mt. 12, v. 2 margin note</cite></span></figcaption>
<div class="meta"><span class="t"><a href="../topics/worship/the-lords-day.html">The Lord&#x27;s Day</a></span></div>

</figure><figure class="quote" id="q-4c3302b976" data-kw="">
<blockquote><p>When these things were finished, ‘the evening and the morning,’ Moses tells us, ‘were the first day.’ By ‘the evening’ here we understand not the beginning of the day according to the calculation which the Jews make during their festival seasons, but the close of the preceding day, and by the morning the beginning of the following day. Therefore Moses says ‘and the evening was,’ i.e., the darkness came on: just as he who labors during the day rests in the evening and on the following morning resumes his toils. Thus terminated the first day.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/herman-venema.html">Herman Venema</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Translation of Hermann Venema’s inedited Institutes of Theology tr. Alexander W. Brown (d. 1787; Edinburgh: T&amp;T Clark, 1850), ch. 19, Creation</cite>, p. 344</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/worship/the-lords-day.html">The Lord&#x27;s Day</a></span></div>

</figure><figure class="quote" id="q-db215012fe" data-kw="Lord&#x27;s day apostolic institution">
<blockquote><p>Others ascend to a divine ordination, so that either Christ himself may be said to have immediately and expressly instituted that day, which Junius holds and some others with him; or mediately only inasmuch as the apostles inspired of God sanctioned it in the Christian church by precept, example and their own practice. This is the more common opinion of the orthodox and to this we adhere.</p></blockquote>

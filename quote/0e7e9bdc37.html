<main class="wrap"><figure class="quote" id="q-0e7e9bdc37" data-kw="">
<blockquote><p>And in the first epistle of John, the fifth chapter; There be three, which bear witness in heaven, the Father, the Word, and the Spirit; and these three be one. Many write, that this testimony is not found in the Greek; against whom is Jerome in his preface of the canonical epistles, who saith that these words are in the Greek, but have been left out by the Latin translators. Yet Cyrillus herein agreeth not with Jerome: for he reciteth in the 14. book of his Thesaurus, all this whole place, and omitteth this particle. Among the Latins Augustine and Beda read not these words. But Erasmus in his notes upon this place sheweth, that there was found a Greek book in Britain, which had these words: also the Spanish edition hath them.

But admit that these words be not had in the Greek copies, the strength of the argument shall not be any thing diminished for that cause: for that which we affirm is proved by the other particle of the sentence, which is found extant as well among the Greeks, as among the Latins, namely; There be three things, which bear witness on the earth; blood, water, and the spirit. Augustine against Maximus the Arian bishop, in his third book, the 14. chapter useth this place; and he would, that the spirit should signify the Father, because God is a spirit; and the Father himself is the fountain and beginning of the whole divinity. Further, blood (as he saith) betokens the Son; because he took upon him the nature of man, and shed his blood for us. Finally water, in his judgment, doth manifestly declare the Holy Ghost.

Whereunto the Gospel doth very well agree. For whereas Jesus said; Rivers of lively water shall flow out of his belly, it is expounded that he spake this as touching the Spirit, which they should receive that believed in him. Wherefore insomuch as the three persons are represented in these three names, and that it is added withal, that these three be one; it is manifestly declared, that the three divine persons have one and the self-same substance. And Augustine treating upon this place, doth specially urge that particle; And they three be one. And he would have it to be a steadfast and firm thing in the scriptures, that when any things are said to be one, they differ not in substance. Even as when we read in the Gospel, that Christ said; I and the Father be one, there was meant to be one nature, both of the Father, and of the Son: so (saith he) we must now understand as touching these three, that they be one.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/peter-martyr-vermigli.html">Peter Martyr Vermigli</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Loci Communes:</cite>, The Common Places, trans. Anthony Marten (2nd edn, London, 1583), 1.12.10, p. 105.</span></figcaption>

</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-95da656997" data-kw="">
<blockquote><p>Bodily worship without soul-worship is nothing; but soul-worship may be accepted without bodily worship; therefore it is the soul that God does principally look at in holy duties: If you be not able to worship God in your bodies, you may worship Him in your souls, and God regards that bodily exercise in holy duties is little worth… but it is nothing in comparison: the great work is the work of the soul, for God is a Spirit and must be worshipped in spirit. And God is said to be a Spirit… it notes the simplicity of God… but in the simplicity of your hearts you must come to worship God, and thus you shall worship Him with such worship as is some way suitable to him as he is a Spirit.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/jeremiah-burroughs.html">Jeremiah Burroughs</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Gospel Worship</cite>, ... (London: 1647) | Sermon 6, pp. 93-94</span></figcaption>

</figure><figure class="quote" id="q-13dd471462" data-kw="">
<blockquote><p>By this reckoning, you will tell me, death is a thing to be wished for: and to pass from so much evil, to so much good, a man should (it seemeth) cast away his life. Surely, I fear not, that for any good we expect, we will hasten one step the faster: though the spirit aspire, [t]he body (it draws with it) withdraws it ever sufficiently towards the earth. Yet is it not that I conclude. We must seek to mortify our flesh in us, and to cast the World out of us: but to cast our selves out of the world is in no sort permitted us.

The Christian ought willingly to depart out of this life, but not cowardly to run away. The Christian is ordained by GOD to fight therein: and cannot leave his place without incurring reproach and infamy. But if it please the grand Captain to recall him, let him take the retreat in good part, and with good will obey it. For he is not borne for himself, but for God: of whom he holds his life at farm, as his tenant at will, to yield him the profits. It is in the Land-lord to take it from him, not in him to surrender it, when a conceit takes him.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/philip-mornay.html">Philippe de Mornay</a></span><span class="wk"><span class="lbl">Work:</span> <cite>A discourse of life and death</cite>, trans. Countess of Pembroke (1590; London: Mathew Lownes, 1608), unpaginated.</span></figcaption>

</figure><figure class="quote" id="q-78d109945c" data-kw="">
<blockquote><p>Crowded railroads and thronged steamboats proclaim on each returning Sabbath that a large population, pent up and overwrought during the week at the loom and the ledger, are not only eager for air and sunshine, for gaiety and recreation, but also that they will have these things even at the price of despising the commands of God. Christians, then, must no less loudly proclaim, that sunshine and recreation, however excellent, are purchased too dearly when they are sought in exchange for the blessings of the Sabbath.

The working population ought to have them and the Sabbath too. And as inconsiderate philanthropists are persuading numbers that a jovial jaunt is better than a visit to the house of prayer, and that the Sabbath is best spent when it is devoted to innocent recreation. Christian philanthropists ought to tell them that pleasure and prosperity follow duty, and that the healthiest, happiest, and most thriving families of the land, are not to be found generally among those who trample under foot God’s Sabbath law, but among those who most conscientiously respect its sacredness.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/baptist-w-noel.html">Baptist W. Noel</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Preface in The Christian Sabbath, Considered in its Various Aspects by Ministers of Different Denominations. With Preface by the Hon. and Rev. Baptist W. Noel</cite></span></figcaption>
<div class="meta"><span class="t"><a href="../topics/worship.html">Worship</a></span></div>

</figure><figure class="quote" id="q-a1bf871434" data-kw="">
<blockquote><p>It need not be told how closely the policy of European nations corresponds to the system of ancient Rome. The spirit of the Roman dominion is transfused into modern governments: might is frequently taken to constitute right, and the people are held in subjection by standing armies […]</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/thomas-houston.html">Thomas Houston</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The judgment of the papacy: and the reign of righteousness</cite>, (1851) in Works doctrinal and practical of the Rev. Thomas Houston, D.D., Knockbracken (4 vols, Edinburgh, 1876), i, 202.</span></figcaption>

<main class="wrap"><figure class="quote" id="q-c05a7c33ac" data-kw="">
<blockquote><p>And if the greater part be in error and so stiff that they would sooner persecute the better than reform, if it be not in matters fundamental or bordering thereupon, or noxious and pernicious to be concealed, I know not that either that innocent is allowed to separate from the exercises of religion for that cause, or bound to admonish them of their error. He that taught to suffer the tares rather than to pluck up the wheat with them, has showed a reason for this judgment (Mt. 13:29).</p></blockquote>

</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-09822e2260" data-kw="">
<blockquote><p>God gives kingdoms to whom He will. What then?… and He gives tyrannous conquests to whom He will: and it is Nebuchadnezzar to whom Daniel speaks that from the Lord [Dan. 5:21], and he had no just title to many kingdoms, especially to the kingdom of Judah, which yet God, the King of kings, gave to him because it was his good pleasure; and if God had not commanded them by the mouth of his prophet Jeremiah, might they not have risen, and, with the sword, have vindicated themselves and their own liberty, no less than they lawfully, by the sword, vindicated themselves from under Moab, (Judges 3) and from under Jabin, king of Canaan, who, twenty years, mightily oppressed the children of Israel, Judges 4. Now this Popish Prelate [John Maxwell], by all these instances, making heathen kings to be kings by as good a title as David and Hezekiah, [implicitly] condemns the people of God as rebels, if, being subdued and conquered by the Turk and Spanish king, they should, by the sword, recover their own liberty [such as happened the Reformation in the Netherlands]; and that Israel, and the saviours which God raised to them, had not warrant from the law of nature to vindicate themselves to liberty, which was taken from them violently and unjustly by the sword… for Nebuchadnezzar’s sovereignty over the people of God, and many other kingdoms also, was revenged of God as tyranny, Jer. 1:6-7; and therefore the vengeance of the Lord, and the vengeance of his temple, came upon him and his land, Jer. 1:16, etc. It is true the people of God were commanded of God to submit to the king of Babylon, to serve him, and to pray for him, and to do the contrary was rebellion; but this was not because the king of Babylon was their king, and because the king of Babylon had a command of God so to bring under his yoke the people of God. So Christ had a commandment to suffer the death of the cross (John 10:18) but had Herod and Pilate any warrant to crucify him? None at all.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/samuel-rutherford.html">Samuel Rutherford</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Lex Rex... (1644; Edinburgh: Ogle, 1843)</cite>, p. 16</span></figcaption>

</figure><figure class="quote" id="q-1c74c757a8" data-kw="">
<blockquote><p>I am ordained into this Church, resigning, we shall say, all other life prospects which I might be warranted to cherish and devoting to her service all my energies and interests, embarking on her prospects also all the temporal interests on my family. I am then ordained in terms of an Ordination Vow. This vow is not an instrument special in my case, not peculiar to me. It is the vow taken also by all my brothers who in this Church are exactly my peers. It has been already taken by all the brothers who in this transaction of exacting and accepting my vow represent to me and act the part towards me of the Church. Not to mention that they are thus bound by the self-same vow already, taking into account merely that they exact and I render this vow in my ordination, is it conceivable that speaking of this one ordination merely I alone became bound by it? Is this merely a pact on my side without being a compact between me and the Church? . . . Do I then come under obligation to the Church without the Church coming under obligation to me? Who would make an assertion so outrageous? The idea of a vow between creatures of God binding only one party in the transaction is a sheer paralogism [piece of illogical reasoning]. This vow entails very weighty obligations on my side and on the side of the Church the weight of obligation is as great. The obligation is manifestly reciprocal. That inheres in the idea of it. Laying out of view the contingency of my convictions as to the subject-matter of my vow coming to be changed and my leaving the Church accordingly, I am bound by it, aye, and until the Church shall release me. Is it conceivable that all this time the Church should have been silently reserving a right to release herself what time she may be able to outvote me? Is it possible that on what are actually called ‘general impressions’ and considerations of ‘good sense’ it is proposed to regulate anew our Church Communion and I am to be – by a dispensing power, we presume – set free from my ordination vow and the Church from her reciprocal and another is to be substituted in its stead? Has a majority power to do this? Yes, if I have power to change my vow and still continue in the Church. And yes, if the Church was not bound to me by prescribing and accepting my vow… A majority may prove treacherous to a vow, just as an individual may: nor is it in the power of the multiplication table to settle a question of morals. Our ordination vow taking us bound to our Confession settles that we have a Constitution, clearly enough defines it, renders us answerable to it and pledges the Church reciprocally as amenable to it also.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/hugh-martin.html">Hugh Martin</a></span><span class="wk"><span class="lbl">Work:</span> <cite>‘Are We to have No Constitution?’ The Watchword 6 (April 1, 1871), pp. 4-15 | From Martin’s article:</cite></span></figcaption>

<blockquote><p>They whose part it is to set up magistrates, may restrain them also from outrageous deeds, or pull them down; but all magistrates are set up either by parliament, or by electors, or by other magistrates; They therefore who exalted them, may lawfully degrade and punish them.</p></blockquote>

<blockquote><p>It is possible that I shall not be an eyewitness to it in the flesh, but I believe He cometh quickly who will remove our darkness, and shine gloriously in the Isle of Britain, as a crowned King, either in a formally sworn covenant, or in His own glorious way, which I leave to the determination of His infinite wisdom and goodness. And this is the hope and confidence of a dying man, who is longing and fainting for the salvation of God.</p></blockquote>

<main class="wrap"><figure class="quote" id="q-2b13774c16" data-kw="">
<blockquote><p>1. The first ground is the Lord’s disposition and nature of mercy and placableness towards a poor sinner, which gives him footing for his hope abundantly in any particular case, as: (1.) From his Name and attributes, whereby He has made Himself known to his people. God proclaims his Name to Moses to be ‘the Lord, the Lord God, the powerful, the mighty Jehovah’ (Ex. 34 [vv. 6-7]), which ministers comfort when annexed to his manifestation of Himself in this way of mercy. ‘Merciful,’ inclined to pity the sin and misery of his people, ready to relieve them in their distress and not only just to require the due service and punish the defaults; ‘Gracious,’ of an affable condescending descending nature, not standing upon the distance that He is in as a great King above all his creatures; He may be petitioned, sought unto and prevailed with by his poor suitors. ‘Long-suffering,’ that is, not hasty to use severity with the worst of sinners, usually taking all other ways first with them, willing that all men should repent and come to the knowledge of the truth (1 Tim. 2:4): Trying many that repent not with much goodness to draw them to it. Enduring with much patience the very vessels of wrath before He brings destruction on them (Rom. 9:22). In all cases He forgives iniquity, transgression and sin.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/henry-newcome.html">Henry Newcome</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Sinner’s Hope</cite>, ... (London: E.C., 1660 [1659]), ch. 4, pp. 25-27</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/the-covenant-of-grace/the-gospel-offer.html">The Gospel Offer</a></span></div>

<blockquote><p>No man was ever questioned by God for having too much grace; we may all complain of too little: More grace is the constant desire of every holy soul as there is a propensity in God to give it; ‘To him that has, more shall be given’: God loves to accumulate his favors, to load us with his benefits; he gives liberally that He may draw out our hope to follow Him for more and more still. ‘Let us then abound in hope, holding fast our confidence firm unto the end.&#x27;</p></blockquote>

</figure><figure class="quote" id="q-5592ef0e54" data-kw="">
<blockquote><p>I answer that, There is will in God, as there is intellect: since will follows upon intellect. For as natural things have actual existence by their form, so the intellect is actually intelligent by its intelligible form. Now everything has this aptitude towards its natural form, that when it has it not, it tends towards it; and when it has it, it is at rest therein. It is the same with every natural perfection, which is a natural good. This aptitude to good in things without knowledge is called natural appetite. Whence also intellectual natures have a like aptitude as apprehended through its intelligible form; so as to rest therein when possessed, and when not possessed to seek to possess it, both of which pertain to the will. Hence in every intellectual being there is will, just as in every sensible being there is animal appetite. And so there must be will in God, since there is intellect in Him. And as His intellect is His own existence, so is His will.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/thomas-aquinas.html">Thomas Aquinas</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Summa</cite>, pt. 1 | quest. 19 | art. 1, Whether there is will in God</span></figcaption>

</figure><figure class="quote" id="q-2c31393b0e" data-kw="">
<blockquote><p>‘For He abounds in pardoning.’ Now, because it is difficult to remove terror from trembling minds, Isaiah draws all argument from the nature of God, that He will be ready to pardon and to be reconciled. Thus the Holy Spirit dwells on this part of doctrine, because we always doubt whether or not God is willing to pardon us; for, although we entertain some thoughts of his mercy, yet we do not venture fully to believe that, it belongs to us. It is not without reason, therefore, that this clause is added, that we may not be hindered by uncertainty or doubt as to his infinite compassion toward us.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/john-calvin.html">John Calvin</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Commentary on Isaiah</cite>, 55:7</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/the-covenant-of-grace/the-gospel-offer.html">The Gospel Offer</a></span></div>

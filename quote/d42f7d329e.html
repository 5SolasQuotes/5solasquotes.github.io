<main class="wrap"><figure class="quote" id="q-d42f7d329e" data-kw="">
<blockquote><p>The reasons by which it appears that this restraint of kindling a fire [by the Israelites in the wilderness] on the Sabbath day [Ex. 35:3] was only temporary, are these: … Secondly, this seems to cross our Savior’s general rule, Mk. 2:27, that the Sabbath was made for man, and not man for the Sabbath; He means for man’s comfort and refreshing, for which kindling of fire and dressing of meat may be, and are in a sort necessary. Thirdly, our Savior allows the loosing of a beast from the stall, and leading of him to the water on the Sabbath day: now we know, the beast might be provided for by setting water in the stall overnight, which would refresh it sufficiently, and better than meat dressed overnight could comfort many men. Fourthly, we find our Savior present at a great feast, Lk. 14:1, where many, and it seems persons of quality, verses 7, 12, were bidden: now it is very unlikely that the provisions for that feast were dressed over night; and if it were dressed on that day, neither would the Pharisee have permitted, nor our Savior have countenanced the dinner with his presence, if dressing of meat, kindling of fires on the Sabbath day, had been forbidden by the law. Now why the dressing of manna, while the Israelites were in their peregrination in the wilderness was forbidden, though the dressing of other meats might be allowed afterwards, there may be some reason given. For manna it may be… as good and comfortable eaten cold as hot, and the preparing overnight, might be no inconvenience at all; howsoever it is out of question that in that unsettled condition of the Israelites wandering in the wilderness, when they were enforced to pick up fuel, where they could get it, baking and boiling must needs be more troublesome and laborious than it was afterwards in Canaan, where being settled in their dwellings, they had all things whereof they were to make use for such works provided and ready at hand.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/john-white.html">John White</a></span><span class="wk"><span class="lbl">Work:</span> <cite>A Way to the Tree of Life Discovered in Sundry Directions for the Profitable Reading of the Scriptures... (1647), A Digression concerning the Morality of the Fourth Commandement, Section III, ‘The Morality &amp; Perpetuity of the Sabbath Proved out of the Fourth Commandement’, pp. 294-95 White was a Westminster divine.</cite></span></figcaption>

<blockquote><p>…as [John] Cameron notes, it is ordinary to call that necessary which is very profitable and expedient. Beside this (I say), we further maintain that in the use of things indifferent, that which we deliberate upon to do is never lawful to be done except it be also necessary, though not necessitate absoluta seu consequentis [by an absolute necessity, of the consequence], yet necessitate consequentiae seu ex supposition [by a necessity of the consequent, or from the supposition]. Paul’s circumcising of Timothy was lawful only because it was necessary, for he behooved by this means to win the goodwill of the people of Lystra who had once stoned him, otherwise he could not safely have preached the Gospel among them. Therefore he had done wrong if he had not circumcised Timothy, since the circumcising of him was according to the rules of the Word, and it was expedient to circumcise him and unexpedient to do otherwise. And (because de paribus idem est judicium [from the parts, so is the judgment]) whensoever the use of any indifferent thing is according to the rules of the Word, that is, when it is profitable for God’s glory and man’s edification, and the doer is persuaded of so much, I say, putting this case, then (for so much as not only it may, but ought to be done) the use of it is not only lawful, but necessary: and (for so much as not only it needs not, but ought not to be omitted) the omission of it is not only unnecessary, but also unlawful.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/george-gillespie.html">George Gillespie</a></span><span class="wk"><span class="lbl">Work:</span> <cite>A Dispute Against the English Popish Ceremonies (1637) | pt. 4, ch. 3, ‘Whether there be anything indifferent in actu exercito [in the exercised act]’, p. 17 While Gillespie’s teaching here is not in the context of the Sabbath, it is very relevant.</cite></span></figcaption>
<div class="meta"><span class="t"><a href="../topics/worship/the-lords-day.html">The Lord&#x27;s Day</a></span></div>

<blockquote><p>…that we remember especially to put all things in practice which we have learned out of the Word, and that we begin upon that very day to do all duties of love unto men, and that we show mercy vnto them then especially. Whereunto that we might be made the more fit, the whole worship of God, and the Sabbath itself is ordained, in so much that the Lord would have every whit of it to cease even upon the Sabbath, rather than mercy should not be showed to the full, or any duty of it neglected to our brethren, when both of them cannot be done together, as we have seen it before more at large.</p></blockquote>

<blockquote><p>XXV. Here, nevertheless, are excepted [to the prohibition of servile work]: … (4) works of necessity, which are neither feigned nor designedly produced, but imposed upon us by providence (Lk. 14:5); not only absolute and simple, that may be called necessary only (which we can in no way be in want of), but modified and relative so that those things may be reckoned necessary not only which are required absolutely for the existence and support of life, but also those which conduce to our living better. Hence some great advantage and emolument accrues to us or our neighbor if they are done or some great disadvantage and loss if they are omitted. ‘The sabbath’ (as Christ testifies in Mk. 2:27) ‘was made for man and not man for the sabbath.’</p></blockquote>

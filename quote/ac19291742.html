<main class="wrap"><figure class="quote" id="q-ac19291742" data-kw="">
<blockquote><p>VI. A passive scandal, which is taken and not given, is not only faulty when it proceeds of malice, but also, when it proceeds of ignorance and infirmity: and scandalum pusillorum [a scandal of weak ones], may be scandalum acceptum, on the part of the offended faulty, as well as scandalum Pharisaeorum [the scandal of the Pharisees]. When weak ones are offended at me for the use of a lawful thing, before I know of their weakness and their taking of offence, the scandal is only passive, and so we see that weak ones may take offence where none is given, as well as the malicious. Now, their taking of offence, though it proceed of weakness, yet is sinful, for their weakness and ignorance is a fault, and does not excuse them.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/george-gillespie.html">George Gillespie</a></span><span class="wk"><span class="lbl">Work:</span> <cite>English Popish Ceremonies</cite>, (1637), pt. 2, ch. 8, p. 32</span></figcaption>

</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-f5f7f2e614" data-kw="">
<blockquote><p>4. But if we were malicious in offending at the ceremonies as things unlawful, and in urging of non-conformity as necessary, should they [the prelates] therefore contemn our being scandalized? Those that would have Titus circumcised, were they not malicious? [Gal. 2:3-5] Did they not urge circumcision as necessary? Held they it not unlawful, not to circumcise Titus? Yet did the apostle abstain, because they were to be scandalized, that is, made worse and more wicked calumniators by the circumcising of Titus, as I have showed (above, ch. 8, section 6); So that albeit we are not to care for the displeasing of men that malitiously and contumaciously urge (as necessary) abstaining from that which is lawful to be done, yet must we care for scandalizing them and making them worse: rather ere that be, we ought to abstain from the use of our liberty.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/george-gillespie.html">George Gillespie</a></span><span class="wk"><span class="lbl">Work:</span> <cite>English Popish Ceremonies</cite>, (1637), pt. 2, ch. 9, p. 45</span></figcaption>

</figure><figure class="quote" id="q-e786e8619a" data-kw="">
<blockquote><p>62. The duties of justice are prior and of more binding obligation than those of charity (or love). 63. Therefore, we have a greater obligation to pay our debts than to give away anything of our own. And he who offends another has a greater obligation to seek reconciliation than he who is offended.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/william-ames.html">William Ames</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Marrow of Theology 3rd</cite>, ed. John Eusden (Baker, 1997), bk. 2, ch. 16, ‘Justice &amp; Charity toward our Neighbor,’, p. 307</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/church-discipline/nature-and-purpose.html">Nature and Purpose</a></span></div>

</figure><figure class="quote" id="q-bb73bf2c7a" data-kw="">
<blockquote><p>We are not here to understand by scandal, a thing actually displeasing the party offended; nor is it always to be judged by the matter, seeing offense in lawful matter may be taken where it is not given, as in that eating and drinking mentioned, Rom. 14, or in taking wages for preaching the gospel, 1 Cor. 9. Neither is it the pleasing of men that does always edify them, nor the displeasing of them that does stumble or scandalize them; but scandal is something accompanying word or deed with such circumstances as makes that word or deed inductive to sin, or impeditive of the spiritual life, or comfort of others.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/walter-steuart-of-pardovan.html">Walter Steuart of Pardovan</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Collections &amp; Observations Concerning the Worship, Discipline &amp; Government of the Church of Scotland</cite>, … (1709), bk. 4, Title 1, ‘Of Scandals &amp; Church-Discipline in General…’, p. 197</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/church-discipline/nature-and-purpose.html">Nature and Purpose</a></span></div>

</figure><figure class="quote" id="q-bd1ff0c759" data-kw="">
<blockquote><p>Some infirmities discover more good than some seeming beautiful actions. Excess of passion in opposing evil, though not to be justified, yet shows a better spirit than a calm temper when there is just cause of being moved. It is better that the water should run somewhat muddily than not run at all. Job had more grace in his ill temper than his friends in their seemingly wise demeanour. Actions soiled with some weaknesses are more accetped than self-righteous performances.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/richard-sibbes.html">Richard Sibbes</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Bruised Reed &amp; Smoking Flax</cite>, … (1620; Philadelphia; Presbyterian Board of Publication, n.d.), ch. 11, p. 76</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/church-discipline/nature-and-purpose.html">Nature and Purpose</a></span></div>

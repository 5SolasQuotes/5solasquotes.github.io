<main class="wrap"><figure class="quote" id="q-f01cfd4d79" data-kw="">
<blockquote><p>Yet does he exhort the people that they should not only regard the outward building, and the outward rites and sacrifices: but that they should chiefly give their hearts unto Him that promised to dwell in the Temple. And this same doctrine does even now at this day declare the true use of the sacraments, and does much more appertain unto us, unto whom the truth is plainly revealed, all the shadows of the law being abolished, than it did to the old fathers.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/theodore-beza.html">Theodore Beza</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Psalms of David Truly Opened &amp; Explained by Paraphrasis</cite>, ... (London: Denham, 1581), on Ps. 24, p. 39</span></figcaption>

</figure><figure class="quote" id="q-d16b64007b" data-kw="">
<blockquote><p>The second way He presses it, verse 20, is, by a most instant and importunate pursuing of His offer, with a protestation of his being there, and of his making the same. This is done four ways;

1. By showing His work and posture, I stand at the door and knock. Hearts are naturally as castles shut and guarded by the Devil against Christ: When He comes with His ordinances, He does thereby, as it were, lay a siege at them, and by His word knock at the doors thereof to gain their consent; and the more pungently he presses by His ordinances, He is said to knock the more: And in this respect, Song 5:2, His voice is said to knock at the believer’s door in their sleepy condition. Here these two things are imported:

1. Christ’s continuing to deal with His Church, and to wait upon her in His ordinances, notwithstanding of her many former refusals. Thus, He is said to stand at the door: Whereby is holden forth their ingratitude to him, in keeping of Him out, and His patience that still waits on.

2. In this, by the other word, is imported His growing more instant in His dealing with them: Therefore He is said to knock. And indeed if the former sharp threatening and charge, and the sweet free offer be considered, it may well be said that now His knocks are doubled. 2. The second way He presses in this verse, is, by making His offer particular, as it were, bringing it to every man’s door, If any man hear My voice, and open the door, etc.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/james-durham.html">James Durham</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Commentary on Revelation</cite>, 3:20</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/effectual-calling/means-of-calling.html">Means of Calling</a></span></div>

</figure><figure class="quote" id="q-55ebc556c1" data-kw="">
<blockquote><p>He offers him grace and pardon for all that is past to turn him, yea He counsels him to turn, and entreats him, by his benefits seeks to lead him to repentance (Rom. 2:4), and which is more then all this, He knocks at the door of his heart by his Spirit (Rev. 3:20), and who can say then but that it is true, which is here said, He delights not in his dying?</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/john-mayer.html">John Mayer</a></span><span class="wk"><span class="lbl">Work:</span> <cite>A Commentary upon the Whole Old Testament</cite>, ... (London: 1653) | on Ezekiel, ch. 18, v. 23, p. 421</span></figcaption>

</figure><figure class="quote" id="q-c915a21c1a" data-kw="">
<blockquote><p>(5) This lamentation of Christ over impenitent Jerusalem teaches us also that man’s ruin is from himself? If after all Christ’s gracious invitations, all his unwearied forbearances, all his bitter and salt tears, Jerusalem will stil persist in her rebellious contempt of his gracious offers, how inexcusable is her sin, and inevitable her ruin? What will prevail upon her, if Christ’s tears and entreaties will not prevail? What can save her, if her Redemer’s grace and mercy save her not? What is it that keeps evangelic sinners from being saved? is it any defect in the object, or its revelation? is it mere simple ignorance, or impotence in the subject? No; but it is wilfull blindness and impotence: they shut their eyes and will not see; they bolt their hearts and will not open to Christ, who knocks at the door of the soul by many gracious invitations of his Gospel and Spirit. And do not such deservedly perish, who electively embrace their own ruin, and wilfully reject the things that belong to their peace, Mt. 23:37?</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/theophilus-gale.html">Theophilus Gale</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Christ’s Tears for Jerusalem’s Unbelief &amp; Ruin, Now Humbly Recommended to England’s Consideration in this Her Day of Trial &amp; Danger</cite>, (London: Widdowes, 1679), bk. 1, ch. 9, pp. 68-69</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/effectual-calling/means-of-calling.html">Means of Calling</a></span></div>

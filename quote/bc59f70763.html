<main class="wrap"><figure class="quote" id="q-bc59f70763" data-kw="">
<blockquote><p>See hence the true spring of reformation in a church or land, and the true spring also of defection and backsliding. Why, when the Spirit of the Lord erects the kingdom of God within, especially in the hearts of magistrates or ministers, men of power and influence; then reformation work goes on apace, men then put to their hands heartily to the building up of Zion; every one then is ready to lend a lift to help up with the Head-stone of the corner. But when the kingdom of God is not within, men lose heart and hand to the work of the Lord, and fall a-work to daub with carnal wisdom and policy, which quite spoils and mars the building, instead of furthering it. What was it that made parliaments, and assemblies, and people of all ranks go so clean to work about the year 1638, and the year that followed it, to advance a work of reformation, and to engage themselves by solemn covenant to maintain it? And what makes the work go on so slowly now? Why, if folk, especially men of influence and power, had the kingdom of God within them, which, alas is much wanting now-a-days, otherwise there would not be so much daubing with untempered mortar as there is. O Sirs, if ever ye would see the Lord’s work thrive again in the land, pray that the foundation of the work by setting up his kingdom in the heart of kings, nobles, gentry, ministers, elders, and all ranks of people in the land; and then the hearts of the children will be turned to their fathers, and we may expect to see the church of Christ in this land, “looking forth as the morning, fair as the moon, clear as the sun, and terrible as an army with banners,” Cant. vi. 10.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/ebenezer-erskine.html">Ebenezer Erskine</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Fourth sermon on Luke 17:21 in The works of Ebenezer Erskine</cite></span></figcaption>

</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-fdb18aed36" data-kw="Filioque from Son">
<blockquote><p>Although the Greeks ought not to have been charged with heresy on account of their opinion … still the opinion of the Latins may be properly retained as more agreeable to the words of Scripture and the truer. (1) The Holy Spirit is sent from the Son as well as from the Father (Jn. 16:7). He therefore ought to proceed from him because he cannot be sent by the Son unless he proceeds from him. (2) He is called the Spirit of the Son as well as the Father (Gal. 4:6).</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/francis-turretin.html">Francis Turretin</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Institutes of Elenctic Theology</cite>, 3.31.5</span></figcaption>

</figure><figure class="quote" id="q-fd31edefff" data-kw="fons deitatis Father">
<blockquote><p>The Son emanates from the Father alone, but the Holy Spirit from the Father and the Son together. … If the mode of subsisting is considered (according to which the Father is the fountain of deity from whom the Son emanates), not improperly in this sense is he said to proceed from the Father through the Son.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/francis-turretin.html">Francis Turretin</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Institutes of Elenctic Theology</cite>, 3.31.3, 8</span></figcaption>

</figure><figure class="quote" id="q-e039eac94b" data-kw="">
<blockquote><p>This righteousness then, which God communicates to man, and accepts alone, and owns as righteousness, has been revealed, he says, without the law, that is, without the aid of the law; and the law is to be understood as meaning works; for it is not proper to refer this to its teaching, which he immediately adduces as bearing witness to the gratuitous righteousness of faith. Some confine it to ceremonies; but this view I shall presently show to be unsound and frigid. We ought then to know, that the merits of works are excluded. We also see that he blends not works with the mercy of God; but having taken away and wholly removed all confidence in works, he sets up mercy alone. It is not unknown to me, that Augustine gives a different explanation; for he thinks that the righteousness of God is the grace of regeneration; and this grace he allows to be free, because God renews us, when unworthy, by his Spirit; and from this he excludes the works of the law, that is, those works, by which men of themselves endeavour, without renovation, to render God indebted to them. (Deum promereri—to oblige God.) I also well know, that some new speculators proudly adduce this sentiment, as though it were at this day revealed to them. But that the Apostle includes all works without exception, even those which the Lord produces in his own people, is evident from the context.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/john-calvin.html">John Calvin</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Commentary on Romans</cite>, trans. John Owen (Bellingham, WA: Logos Bible Software, 2010), 134.</span></figcaption>

elblog.net/2017/05/calvin-paul-excludes-all-works-even-those-wrought-by-the-spirit/" rel="noopener" target="_blank">Read it online · Heidelblog</a></div>

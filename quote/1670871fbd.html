<main class="wrap"><figure class="quote" id="q-1670871fbd" data-kw="">
<blockquote><p>Jonathan Edwards is often regarded as an epitome of Calvinism for his teaching on the freedom of will, though he was, in his own time and for a century after his death, a much-debated thinker whose views polarized Reformed circles. This lecture will concentrate on Edwards’s reception in Britain, which has received little attention despite its significance in the Reformed tradition. Concentrating on two historical contexts, Dr. Muller will consider the mixed reception of Edwards’ thought, note differences between Edwards and the older Reformed orthodoxy, and point to a parting of the ways in the Reformed tradition that took place largely in the eighteenth century.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/richard-muller.html">Richard Muller</a></span><span class="wk"><span class="lbl">Work:</span> <cite>“Jonathan Edwards &amp; the Absence of Free Choice: A Parting of Ways in the Reformed Tradition” 71 min., Sept. 29th</cite>, 2010, at Trinity Evangelical Divinity School, being the Inaugural Lecture for the Jonathan Edwards Center. This lecture is in article form above.</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/free-will-and-inability/liberty-and-necessity.html">Liberty and Necessity</a></span></div>
<div class="actions"><button class="copy" data-copy="“Jonathan Edwards is often regarded as an epitome of Calvinism for his teaching on the freedom of will, though he was, in his own time and for a century after his death, a much-debated thinker whose views polarized Reformed circles. This lecture will concentrate on Edwards’s reception in Britain, which has received little attention despite its significance in the Reformed tradition. Concentrating on two historical contexts, Dr. Muller will consider the mixed reception of Edwards’ thought, note differences between Edwards and the older Reformed orthodoxy, and point to a parting of the ways in the Reformed tradition that took place largely in the eighteenth century.”

</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-26209086ef" data-kw="">
<blockquote><p>a) The principle ‘whatever is moved is moved by another’ is not a per se nota [through known things themselves] proposition, nor does it seem to be universally valid (Scotus, Oxon. 1, d. 3, q. 7, 2 d. 2, q. 10, 2 d. 25, q. un, Questions on Metaphysics 9, q.14). [The principle ‘whatever is moved is moved by another,’ is Thomist, albeit articulated in a loose way, which could be shored up. Wolter is giving Scotist criticisms. He is saying this principle is presupposed and not demonstrated through known things. One proposed exception to it in the Scotist tradition, though perhaps there may be others, is the free will of created rational agents.] b) The argument that is founded on the impossibility of passing from potency to act save as by a being in act does not seem to be valid, because an agent, insofar as an agent has an active power, virtually contains its own action even before it actually acts. This is plain certainly about the will and probably about the intellect and other principles of motion.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/allan-b-wolter.html">Allan B. Wolter</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Little Summary of Metaphysics</cite>, (Milwaukee: Bruce Publishing Co., 1958), Wolter was a Scotist., p. 82</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/free-will-and-inability/liberty-and-necessity.html">Liberty and Necessity</a></span></div>

</figure><figure class="quote" id="q-212c3bb667" data-kw="">
<blockquote><p>5. Augustine professes, bk. 1, De Gen. contr. Manich., ch. 3, that all men may believe if they will, and justifies it in his Retractations. But if the will of man be corrupt, and averse from believing, we justly say such a man cannot believe, as our Savior says, ‘How can you believe that receive honor one of another, and seek not the honor that comes of God alone.’ Jn. 5:44 Yet this is an impotency moral only, which is to be distinguished from impotency natural. For notwithstanding this, it may be truly said that, All men may believe if they will, and herein consists the natural liberty of the will. The moral liberty consists, rather in a sanctified inclination unto that which is good, whereby it is freed from the power of sin and Satan; then in a power to do good if they will, and not otherwise. But I never find that Arminians do distinguish these.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/william-twisse.html">William Twisse</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Riches of God’s Love unto the Vessels of Mercy, consistent with his absolute Hatred or Reprobation of the Vessels of Wrath, or an answer unto a book entitled, God’s Love unto Mankind</cite>, … (d. 1646; Oxford, 1653), bk. 1, pt. 1, II. The Discourse Itself, p. 72</span></figcaption>

</figure><figure class="quote" id="q-4d9204281e" data-kw="">

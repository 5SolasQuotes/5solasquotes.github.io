<blockquote><p>VI…. Hence, God, the Word and the Spirit are joined by David in Ps. 33:6, “By the word of the Lord were the heavens made; and all the host of them by the breath of his mouth,” which the rule of the theologians confirms: “The outward works of the Godhead are undivided.</p></blockquote>

</figure><figure class="quote" id="q-ac26449f03" data-kw="six days creation">
<blockquote><p>Creation may be viewed either in general with regard to the production of the whole universe, or in particular with regard to the production of its various parts in the six days of creation. In the latter, their creation is first set forth, then their distinction and lastly their adornment. In all these, God demonstrates his power splendidly in the production of all things (great as well as small) ex nihilo by his word alone; his wisdom, in their variety, order and use; his goodness, in the communication of himself (by which he made all things very good).</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/francis-turretin.html">Francis Turretin</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Institutes of Elenctic Theology</cite>, 5.1</span></figcaption>

</figure><figure class="quote" id="q-0a819d3bca" data-kw="">
<blockquote><p>A simple survey of the world should of itself suffice to attest a Divine Providence. The heavens revolve daily, and, immense as is their fabric, and inconceivable the rapidity of their revolutions, we experience no concussion — no disturbance in the harmony of their motion. The sun, though varying its course every diurnal revolution, returns annually to the same point. The planets, in all their wanderings, maintain their respective positions. How could the earth hang suspended in the air were it not upheld by God’s hand? By what means could it maintain itself unmoved, while the heavens above are in constant rapid motion, did not its Divine Maker fix and establish it?</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/john-calvin.html">John Calvin</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Commentary on Psalms</cite>, 93:1</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/creation/the-six-days.html">The Six Days</a></span></div>

</figure><figure class="quote" id="q-a68262c412" data-kw="">
<blockquote><p>7. And lastly, in what time or how many days did God create all things, in six days says the Scripture, and every day some thing says this place, till the seventh day, wherein He rested. Non uno momento, sed sex dierum spatio, ‘not in one moment, but in six days’ space.’ If you happily think or meet with Syrach’s words [in Ecclesiasticus], who says, ‘He that lives made all things together, the Lord who only is iust,’ etc., you must consider that he speaks not of the time, but of the multitude of creatures, meaning that God made them all together before He rested, and gave over creating, but not meaning that He made them all in one moment of time or in one day, for we see both this place and others against it: the Lord’s own commandment written with his own finger gives testimony that in six days the whole was made.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/gervase-babington.html">Gervase Babington</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Certain Plain, Brief &amp; Comfortable Notes upon every Chapter of Genesis</cite>, (London: 1592), ch. 1, p. 6</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/creation/the-six-days.html">The Six Days</a></span></div>

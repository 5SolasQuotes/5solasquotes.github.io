<main class="wrap"><figure class="quote" id="q-bcdbb060e2" data-kw="Gehenna sheol">
<blockquote><p>Hell is called in Hebrew sheol, in Greek hades. Here we take it for the place of the damned, as it is taken in Lk. 16:23. Various synonyms of it occur in the Scriptures: perdition; Gehenna (Mt. 5:22, 29), a word derived from the valley of the children of Hinnom, in which the wicked Israelites were accustomed to practice horrible idolatries to Moloch.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/francis-turretin.html">Francis Turretin</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Institutes of Elenctic Theology</cite>, 20.7.2</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/judgment-and-the-final-state/hell.html">Hell</a> › <a href="../topics/judgment-and-the-final-state/hell/nature-of-the-punishment.html">Nature of the punishment</a></span><span class="t"><a href="../topics/judgment-and-the-final-state/hell.html">Hell</a> › <a href="../topics/judgment-and-the-final-state/hell/against-annihilationism-and-universalism.html">Against annihilationism and universalism</a></span></div>

</figure><figure class="quote" id="q-0579630e02" data-kw="conflagration renewal">
<blockquote><p>What will the destruction of the earth be like? Will it be annihilated by the final conflagration or will it be restored and renewed? It is not inquired whether it will occur by a conflagration of fire. For the Scriptures so expressly declare this that no Christian can or ought to doubt it: “The heavens and the earth are reserved unto fire” (2 Pet. 3:7); “The heavens shall pass away with a great noise, and the elements shall melt with fervent heat.”</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/francis-turretin.html">Francis Turretin</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Institutes of Elenctic Theology</cite>, 20.5.1–2</span></figcaption>

</figure><figure class="quote" id="q-7ec1f22716" data-kw="hell sense loss">
<blockquote><p>Is there a hell? And what are its punishments—whether only of loss or also of sense? We affirm the latter. The execution of the sentence of the Judge will follow its promulgation. This will be carried out with respect to the wicked by casting them down into hell, where they must be tormented for ever with the devils; but with respect to the pious, by their introduction into heaven, to the joys of eternal life.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/francis-turretin.html">Francis Turretin</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Institutes of Elenctic Theology</cite>, 20.7.1</span></figcaption>

</figure><figure class="quote" id="q-e12381ac27" data-kw="degrees of glory">
<blockquote><p>Will there be degrees of glory? And will the glory in heaven be equal or unequal and unlike? The Romanists assert the inequality of glory from the inequality of merits which they are accustomed to place under it as a foundation. Among the orthodox the question is problematic; yet the more common opinion asserts degrees of glory without founding them upon merit of works, but upon the free gift of God.</p></blockquote>

</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-b5b07bba5c" data-kw="">
<blockquote><p>God’s Will Complancential, Providential and Beneplaciti. 3. Aquinas and others distinguished God’s Will unto Complacential , Providential, and Beneplaciti. (1) God’s Complacential Will, is his simple complacence in all good actions, habits, and events of men; yea it extends not only to moral, but to natural goods, as Gen. 1:31. There is a perpetual necessary volition in God which takes pleasure in all good, whether created or increated. Such is the infinite bonitie and purity of the divine nature as that it cannot but take infinite complacence in all good. This they call God’s Love of simple complacence, of which see Ruiz, De Volunt. Dei, Disp. 6, §2, p. 38 and Disp. 19, p. 214.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/theophilus-gale.html">Theophilus Gale</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Court of the Gentiles (Maxwell &amp; Roberts, 1677), pt. 1, bk. 2</cite>, p. 357</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/attributes-of-god/will-of-god.html">Will of God</a></span></div>

</figure><figure class="quote" id="q-566fda3c78" data-kw="">
<blockquote><p>I. Although the will in God is only one and most simple, by which He comprehends all things by a single and most simple act that He sees and understands all things at one glance, yet because it is occupied differently about various objects, it thus happens that in our manner of conception, it may be apprehended as manifold (not in itself and intrinsically on the part of the act of willing, but extrinsically and objectively on the part of the things willed). … XVIII. There cannot be contrariety between these two wills because they do not will and nill the same thing in the same manner and respect… … XIX. Although God may be said to will the salvation of all by the will of sign and to nill it by the beneplacit will, yet there is no contradiction here….</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/francis-turretin.html">Francis Turretin</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Institutes of Elenctic Theology, ed. Dennison</cite>, pp. 220-26</span></figcaption>

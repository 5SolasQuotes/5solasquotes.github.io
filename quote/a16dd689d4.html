<main class="wrap"><figure class="quote" id="q-a16dd689d4" data-kw="">
<blockquote><p>If any good Christian visited with long sickness and known to the pastor, by reason of his present infirmity [be] unable to resort to the church for receiving of the holy Communion, or being sick shall declare to the pastor upon his conscience that he thinks his sickness to be deadly, and shall earnestly desire to receive the same in his house: The minister shall not deny to him so great a comfort, lawful warning being given to him upon the night before, and that there be three or four [persons] of good religion and conversation, free of lawful impediments, present with the sick person to communicate with him, who must also provide a convenient place in his house and all things necessary for the reverend administration thereof, according to the order prescribed in the Church.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/scottish-articles-of-perth.html">Scottish Articles of Perth</a></span><span class="wk"><span class="lbl">Work:</span> <cite>As given in David Lindsay, ‘The Acts concluded at Perth, touching Private Baptism &amp; Communion’ in A True Narration of All the Passages of the Proceedings in the General Assembly of the Church of Scotland</cite>, … 1618… together with a just defence of the Articles… against a Seditious Pamphlet [by Calderwood] (London, 1621)</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/the-sacraments-in-general/minister-and-intention.html">Minister and Intention</a></span></div>

istered-privately-or-with-only-several-christians/#:~:text=If%20any%20good%20Christian%20visited%20with,the%20order%20prescribed%20in%20the%20Church&amp;text=If%20any%20good%20Christian%20visited%20with%20long%20sickness&amp;text=according%20to%20the%20order%20prescribed%20in%20the%20Church" rel="noopener" target="_blank">Read it online · Reformed Books Online</a></div>
</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-d1233e8e1e" data-kw="">
<blockquote><p>Furthermore, did Christ deliver his Last Supper to all his disciples that were present? Did none stand by, and gaze on while other received? Then hereby fall to the ground the private communions of the popish Church, where all is devoured by the priest, nothing delivered to the people. For whereas the ordinance of Christ and ancient order of the church was for the minister and people to receive the sacrament together: among them the priest accompanied with his boy to make answer, receives the sacrament himself alone, without distribution made to others, yea although the whole congregation be present and look upon him, whereby God is dishonored, the communion is abolished, the people of God are there by deprived and robbed of all comfort. How is this a feast which the priest prepares for himself, not for others: receives by himself, not with his brethren: he speaks to himself, and not to the assembly: he uses a strange tongue, and no man knows what he means: the people is taught nothing, they understand nothing, they hear nothing, they receive nothing; and a few childish, apish, foolish, and unseemly gestures excepted, they see nothing: they taste nothing, they partake nothing, neither comfort of heart, nor memory of Christ, nor benefit of his passion. But Christ in his Last Supper, did not eat up all alone, but after the disciples had supped as Mathew sets it down, He took bread and blessed He brake and gave it to them, saying, ‘Take ye, eat ye:’ neither did He drink alone of the fruit of the vine, but taking the cup He gave thanks, and gave to them all, saying, ‘Drink ye all of this.’ So then, albeit a certain number of communicants are not limited and determined: yet Christ in these words appoints a company to be present, as appears by the number, ‘take ye, eat ye,’ ‘drink ye all,’ ‘divide ye it among yourselves,’ ‘do ye this in my remembrance,’ ‘ye set forth the Lord’s death,’ ‘when ye come together to eat,’ ‘tarry ye one for another,’ ‘as often as ye shall eat this bread.’ These words cannot be understood of one particular man, but necessarily import a greater number of men: nay, the Philosopher teaches that the word ‘all’ must be verified at the least of the number of three, which is the least and lowest number that would be admitted to this supper. Neither do we read that so soon as one was gained to the faith, that the apostles administered this sacrament to him, much less would they minister to themselves alone, when none were converted in a nation or city.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/william-attersoll.html">William Attersoll</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Badges of Christianity, or a Treatise of the Sacraments</cite>, … (London, 1606), bk. 3, ‘Of the Lord’s Supper’, pp. 276-77</span></figcaption>

</figure><figure class="quote" id="q-1709ebcbf5" data-kw="">
<blockquote><p>But since this sacrament [of baptism] is a solemn reception into the church of God, or rather a testimony of burghership in the heavenly city into which are enrolled all those whom God adopts for his children, above all things it is to be observed that it is not lawful to administer it except in the society of professed believers. Not that it is necessary to have a public temple, but assuredly it is indispensable that there should be a certain flock assembled, forming a body constituted as a church, and recognizing for its pastor, the person appointed to baptize. For should a child be baptized in private and without witnesses, the ceremony would in no wise correspond to the ordinance instituted by Jesus Christ, nor to the practice of the Apostles. It is then requisite that the child should be baptized in a society that keeps itself separate from the pollutions of Popery.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/john-calvin.html">John Calvin</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Letters of John Calvin</cite>, vol. 3 ed. Jules Bonnet trans. Marcus Gilchrist (Philadelphia: Presbyterian Board of Publication), Letter 368, ‘To John Paule’, p. 87</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/the-sacraments-in-general/minister-and-intention.html">Minister and Intention</a></span></div>

0of%20Popery" rel="noopener" target="_blank">Read it online · Reformed Books Online</a></div>
</figure><figure class="quote" id="q-2a35968f71" data-kw="">
<blockquote><p>Secondly, as this sacrament being a communion admonishes that we are all one in Christ: so it teaches that it is to be received of many together in the church, not of one alone, and therefore it overthrows the private masses of the church of Rome, where one partakes all and the rest of the Church nothing at all. There is a flat opposition between these two: so that the communion cannot be a private mass, and private mass cannot be a communion. That which is ordained and prepared for many, delivered unto many, and received of many, cannot stand with the mass, where the priest prepares for himself, not for the people: he speaks to himself, not to the church: he receives himself alone, not with his brethren: all which are directly contrary to the apostles rule, ‘Tarry one for another.’</p></blockquote>

<blockquote><p>…when I preached at court before the [English] Queen’s majesty, and was speaking about the antiquity of the popish religion, I remember that I said this among other things, that our enemies, when they accuse our cause of novelty, both wrong us and deceive the people; for that they approved new things as if they were old and condemned as new things of the greatest antiquity; that their private masses and their mutilated communions, and the natural and real presence and transubstantiation, etc. (in which things the whole of their religion is contained) have no certain and express testimony either of holy scripture or ancient councils, or fathers, or of anything that could be called antiquity.</p></blockquote>

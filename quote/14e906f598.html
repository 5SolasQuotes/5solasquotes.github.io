<main class="wrap"><figure class="quote" id="q-14e906f598" data-kw="">
<blockquote><p>There is also a certain logic of interrelation of attributes in the orthodox presentation of the voluntary love of God for the world–God’s propensity to love the finite order rests on the grounding of the finite order in the goodness of God: ‘From the goodness springs the love of God, by which God is inclined towards the creature, and delights to do it good, and as it were, to unite himself with it.’ (Pictet, Theol. chr., II.vii.4; cf. Mastricht, Theoretico-practica theol., II.xvii.8; Synopsis purioris theologiae, VI.xl.) The love of God, therefore, belongs to the category of affection, arising inwardly and extending outward, and is not to be understood as a passion, arising because of some outward good that it apprehends and desires. (Beza et al. Propositions and Principles, IX.viii.)</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/richard-muller.html">Richard Muller</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Post-Reformation Reformed Dogmatics (Baker Academic, 2003), vol. 3</cite>, p. 566</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/the-covenant-of-grace/the-gospel-offer.html">The Gospel Offer</a></span></div>

</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-93528f6b17" data-kw="">
<blockquote><p>Fifteenthly and lastly, It is clearly evident that the Lord Christ has a strong inclination to save sinners, by his giving out of Scripture in that way and manner as He has done; the Lord Christ has given out Scripture so as to answer the objections of men and women, to answer all the evils of their hearts, all the pleas of corruption, and of a guilty conscience, and of the Devil himself: The Lord has given out Scripture so as to answer all that might hinder their coming in unto Him… Is not here encouragement enough unto poor sinners: — So here in the next words, ‘Whosoever will let him come and drink of the water of life freely:’ It’s laid down so as to answer all your objections, and to take away all your pleas you have to stave you off from Christ. So then you see clear evidences that Christ is willing to save sinners.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/william-greenhill.html">William Greenhill</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Sermons of Christ, his Last Discovery of Himself... (London: R.I., 1656), Christ’s Willingness to Save Sinners, 2nd Sermon</cite>, pp. 168-69</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/the-covenant-of-grace/the-gospel-offer.html">The Gospel Offer</a></span></div>

</figure><figure class="quote" id="q-2d590d39b0" data-kw="">
<blockquote><p>But God (says Simon Magus) would not that Adam should have eaten of the forbidden fruit, who nevertheless did eat of that fruit; it follows therefore that he remained not as his Creator would have had him to have remained; how then can God be omnipotent, or his will always fulfilled? It were necessary, if we should fully satisfy this argument, to entreat more largely of the will of God than were convenient for this place: wherefore, that we may briefly answer this objection, we must presuppose with the school-divines a threefold distinction of the will of God, according to the diversity of their proper objects:¹ the first they call his efficient, effectual, or working will, by which God does so effectually intend anything that He performs it actually by some external operation and work, either actually produced or to be produced. ¹ Aquinas, [Summa] pt. 1, quest. 19; the same: Molina, Vasquez, Suarez, Sumel, Bannez and many others. The other kind of will which the divines distinguish in God, in regard of some objects which He does not really produce, is called inefficax voluntas, a kind of propension or inclination of his divine will to the effectuating of any good effect, which might redound to the felicity of man: yet for the attaining of the end, which out of his unsearchable wisdom He has prefixed, He oftentimes permits the contrary to this his divine inclination and will; the which therefore is called God’s permissive will. As for example, God would that all men should be saved, according to that of the apostle [1 Tim. 2:4], Deus vult omnes homines saluos fieri; to wit, in his universal grace, calling and inspirations and other general means, offered to all, so that out of his infinite goodness He wishes and wills in this sort all to be saved; and that He might the more manifest his infinite mercy by the efficacy of his working will, He actually saves some; even so, to manifest his justice by his other permissive decree, He permits others to work their own ruin and eternal damnation.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/john-salkeld.html">John Salkeld</a></span><span class="wk"><span class="lbl">Work:</span> <cite>A Treatise of Paradise… (London: Griffin, 1617), ch. 64, pp. 319-21 Salkeld (1576–1660) was born in England, studied with Jesuits in the university of Coimbra and in Portugal, but had become a protestant again living in England by the time of this work.</cite></span></figcaption>
<div class="meta"><span class="t"><a href="../topics/the-covenant-of-grace/the-gospel-offer.html">The Gospel Offer</a></span></div>

<blockquote><p>First, What is this love of God in Christ? Here I take it actively for the love wherewith He loves us. Love may be considered: First, as an attribute or a perfection in God; so it is said, 1 John 4:8, ‘God is love.’ Which notes his readiness, self-propension or inclination to do good. Secondly, as it relates and passes out to the creature; so there is a common love and a special love. His common love is set forth: Ps. 145:9, ‘The Lord is good to all, and his tender mercies are over all his works.’…</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/thomas-manton.html">Thomas Manton</a></span><span class="wk"><span class="lbl">Work:</span> <cite>“A Practical Exposition Upon the Fifty-Third Chapter of Isaiah: the First Verse” in The Complete Works of Thomas Manton (London: Nisbet &amp; Co., 1873), vol. 3</cite>, pp. 210–11</span></figcaption>

<div class="actions"><button class="copy" data-copy="“First, What is this love of God in Christ? Here I take it actively for the love wherewith He loves us. Love may be considered: First, as an attribute or a perfection in God; so it is said, 1 John 4:8, ‘God is love.’ Which notes his readiness, self-propension or inclination to do good. Secondly, as it relates and passes out to the creature; so there is a common love and a special love. His common love is set forth: Ps. 145:9, ‘The Lord is good to all, and his tender mercies are over all his works.’…”

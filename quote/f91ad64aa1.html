<main class="wrap"><figure class="quote" id="q-f91ad64aa1" data-kw="">
<blockquote><p>[F]alse theology will be (3) apart from Christ, that is, not teaching the words about Christ, for which reason heathenism, Judaism, and Islam fail, since they do not hold to the words about Christ. Or, it will be (4) insufficiently “according to godliness,” which is especially problematic for the schismatic theology of the Lutherans and Arminians, since they either excessively extol man and his will, his works, his perfection, and disparage God’s grace and mercy in Christ – which Arminianism does along with the Pelagians, papists, and Socinians – or they present an opportunity for despairing by setting up, in their teaching on absolute perfection and the total apostasy of the saints, perpetual doubts about salvation.

Even Lutheranism participates in this last error: along with what was just pointed out, at least regarding the total apostasy of the saints, they also give rein to carnal security either by a universal grace of God, a universal satisfaction of Christ – which they apply to all equally, for which reason, with the rest, the Lutheran faith is especially troubled – or by widening the path of salvation, which agrees little with either the justice or mercy of God. In this way, by setting mercy against justice, Lutheranism follows the Socinian path to its own ruin.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/petrus-van-mastricht.html">Petrus van Mastricht</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Theoretical-Practical Theology Volume 1: Prolegomena</cite>, trans. Todd M. Rester, ed. Joel R. Beeke (1699; Grand Rapids MI: Reformation Heritage Books, 2018), 1.1.1.XXVI, p. 87.</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/the-church/schism-and-separation.html">Schism and Separation</a></span></div>

<blockquote><p>Although some think that they can claim a historical link with the Second Reformation Church of Scotland without acknowledging the covenants of the seventeenth-century, this supposition is a-historical. This is because in 1640 the General Assembly of the Scottish Kirk made it an ex-communicable offence not to adhere to the National Covenant (which, incidentally, proves that the early Covenanters believed in close communion/confessional membership):

The Assembly ordains, that such as have subscribed the Covenant and speaks against the same, if he be a Minister, shall be deprived: And if he continue so, being deprived, shall be excommunicate: And if he be any other man, shall be dealt with as perjured, and satisfy publikely [sic] for his perjury.</p></blockquote>

<blockquote><p>That no minister shall, upon any occasion, testify from the pulpit against any act of Assembly, be it never so sinful; or against any of the proceedings of the judicatories, be they never so unwarrantable.” (See 1st Testimony, p. 82) For there was far more ground to make their inference from the act of Assembly 1638, than from the act of Assembly 1733; and so all our worthy ancestors from that day, and the Brethren themselves, according to their argument, have been living in a Church in which there was a very sinful term of communion required of them; and yet they never complained of it, nor have they given the least testimony against it. But further, the above Act 1733, relating to these Brethren, being materially rescinded, as was shown above, this objection, even as to them, falls to the ground. But then, as to the second alleged sinful term of communion, viz. “That no minister, or member of this Church shall protest against acts, sentences or decisions of the supreme judicatory, etc.</p></blockquote>

</figure><figure class="quote" id="q-2f7e6abfd9" data-kw="">
<blockquote><p>It may be noted here that the term ‘Cameronian’, often loosely applied to the adherents of Cameron and Cargill, was originally coined about 1678 or 1679 to describe, disparagingly, those who shared [Richard] Cameron’s views on the supremacy [of the English and Scottish king] and Indulgence (cf. The Nonconformist’s Vindication, 1700, p. 16; A True and Impartial Relation of Bothwell Bridge, 1797, p. 16 [1751, p. 20]). It did not, however, gain much currency until after the Revolution of 1688, when it was used to denote those elements of the United Societies which did not join the Revolution Settlement (cf. [Patrick Walker] Six Saints of the Covenant, vol. I. p. 251)¹ ¹ [Walker says previously in the volume: “I am reflected upon, and that several times to my face, by all divided parties, especially Dissenters, and particularly by these of them commonly called M’Millanites, but quite wrong designed, who should be called Hamiltonians after Robert Hamilton, who was the only man (as I shall afterwards instruct) that led them in these untroden, dangerous paths of positive disowning of the State, and separation from the Church, and [from] all others that dare not nor will not go their lengths in principles and practices, proclaiming the same to the world;” Ibid., pp. 138-39] The term was never owned by those to whom it was applied, and it is uniformly described in their literature as a ‘by-name’ or ‘nick-name’ (cf. A Short Memorial of Sufferings and Grievances, 1690, title page). To the same effect are some remarks by John M’Main (Earnest Contendings, 1723, p. 376) when in taking Wodrow severely to task for using the term in his History he asserts, ‘He calumniates and fixes upon these faithful witnesses of Jesus Christ that stigma, or name of reproach, wherewith their enemies had branded them, calling them after a man, and falsely alleging that they termed themselves so, and labours to make his readers, in this and future generations, believe the calumny thus confirmed, that they were not Presbyterians. But he cannot produce one instance among all the cloud of witnesses, whom he so reproaches, evincing that ever any of them did so term themselves.&#x27;</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/maurice-grant.html">Maurice Grant</a></span><span class="wk"><span class="lbl">Work:</span> <cite>No King but Christ: the Story of Donald Cargill</cite>, (Durham: Evangelical Press, 1988), p. 253, ch. 9, endnote 7</span></figcaption>

9+when+in+taking+Wodrow+severely+to+task+for+using+the+term+in+his+History+he+asserts%2C+%E2%80%98He+calumniates+and+fixes+upon+these+faithful+witnesses+of+Jesus+Christ+that+stigma%2C+or+name+of+reproach%2C+wherewith+their+enemies+had+branded+them%2C+calling+them+after+a+man%2C+and+falsely+alleging+that+they+termed+themselves+so%2C+and+labours+to+make+his+readers%2C+in+this+and+future+generations%2C+believe+the+calumny+thus+confirmed%2C+that+they+were+not+Presbyterians.+But+he+cannot+produce+one+instance+among+all+the+cloud+of+witnesses%2C+whom+he+so+reproaches%2C+evincing+that+ever+any+of+them+did+so+term+themselves.%27%E2%80%9D%0A%0A%E2%80%94+Maurice+Grant%2C+No+King+but+Christ%3A+the+Story+of+Donald+Cargill%2C+%28Durham%3A+Evangelical+Press%2C+1988%29%2C+p.+253%2C+ch.+9%2C+endnote+7&amp;url=https%3A%2F%2F5solasquotes.github.io%2Fquote%2F2f7e6abfd9.html&amp;via=5Solas" target="_blank" rel="noopener">Share on X</a><a class="perma" href="../quote/2f7e6abfd9.html">Permalink</a><a class="src" href="https://reformedbooksonline.com/on-cameronianism/#:~:text=It%20may%20be%20noted%20here%20that,of%20them%20did%20so%20term%20themselves&amp;text=It%20may%20be%20noted%20here%20that%20the%20term&amp;text=ever%20any%20of%20them%20did%20so%20term%20themselves" rel="noopener" target="_blank">Read it online · Reformed Books Online</a></div>

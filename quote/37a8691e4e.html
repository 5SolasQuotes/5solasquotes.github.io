<main class="wrap"><figure class="quote" id="q-37a8691e4e" data-kw="">
<blockquote><p>We see here, nor see only, but even taste and touch, how gracious the Lord is, in that he is pleased even to unrobe his graces of their natural lustre, to overshadow his promises; and, as it were, to obscure his glory, that they might be made proportioned to our dull and earthly senses; to lock up so rich mysteries, as lie hidden in the sacraments, in a bason of water, or a morsel of bread.

When he was invisible, by reason of that infinite distance between the divine nature and ours, he made himself to be seen in the flesh: and now that his very flesh is to us again invisible, by reason of that vast distance between his place and ours, he hath made even it, in a mystical sense, to be seen and tasted in the sacrament.

Oh then, since God doth thus far humble himself and his graces, even unto our senses, let not us, by an odious ingratitude, humble them yet lower, even under our feet. Let us not trample on the blood of the covenant, by taking it into a noisome sink, into a dirty and earthy heart. He that eats Christ in the sacrament with a foul mouth, and receives him into an uncleansed and sinful soul, doth all one as if he should sop the bread he eats, in dirt, or lay up his richest treasures in a sink.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/edward-reynolds.html">Edward Reynolds</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Meditations on the Holy Sacrament of the Lord’s Last Supper</cite>, (1638) in The Whole Works of the Right Rev. Edward Reynolds, D.D., ed. Alexander Chalmers (6 vols, London, 1826), iii, 10-11.</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/the-lords-supper.html">The Lord&#x27;s Supper</a></span></div>

</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-461853bbb1" data-kw="">
<blockquote><p>Thanks, be to God, we have a clean other opinion of the Eucharist. We hold it (as it is indeed) a very holy Sacrament of the body and blood of our Lord, to be one of the most precious instruments of his grace, which being lawfully and rightly celebrated, communicateth to us all the treasures of heaven, the flesh and blood of Christ, the pardon of our sins, the peace of our consciences, the sanctification of our souls, and the right to a blessed immortality.

Far be it from us to give it the profane and infamous name of an idol. We will not say, that it is simply and only bread: and if any of us do chance to speak so, in saying that ’tis bread, he means in regard of the substance of the thing, not in regard of its virtue or dignity; in regard of which we believe that it is quite another thing from bread.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/jean-daille.html">Jean Daillé</a></span><span class="wk"><span class="lbl">Work:</span> <cite>An apology for the Reformed churches wherein is shewed the necessity of their separation from the Church of Rome: against those who accuse them of making a schism in Christendom</cite>, trans. Thomas Smith (Cambridge: University of Cambridge, 1653), p. 38.</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/the-lords-supper/preparation-celebration-reflection.html">Preparation, Celebration, Reflection</a></span></div>

</figure><figure class="quote" id="q-14bed2b0c7" data-kw="">
<blockquote><p>This communion and fellowship of man with God, was first founded on a covenant of works made with Adam in paradise. If he did obey, and did not eat of the forbidden fruit, he should have life both for himself and his posterity; the which covenant, because God would not have forgotten, he afterward renewed in the delivery of the ten commandments, requiring from man obedience to them in his own person, exactly, at all times, perpetually: promising life on the obedience, and threatening death and cursing if he continued not in everything the law required to do. But this fellowship being placed in man’s own freedom, and having so weak a foundation, he lost both himself and it, so that now by the first covenant of works, Adam and all his posterity are under a curse; for we cannot fulfill the law that requires personal obedience, perfect obedience, and exact obedience. He that ‘continues not in all is cursed,’ Gal. 3:10. The law then finds us dead and kills us. It finds us dead before, and not only leaves us dead still, but makes us more dead.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/richard-sibbes.html">Richard Sibbes</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Complete Works of Richard Sibbes</cite>, ed. Alexander Balloch Grosart, vol. 6 (Edinburgh; London; Dublin: James Nichol; James Nisbet and Co.; W. Robertson, 1863), 3. [spelling modernized]</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/the-lords-supper.html">The Lord&#x27;s Supper</a></span></div>

</figure><figure class="quote" id="q-8414054909" data-kw="">

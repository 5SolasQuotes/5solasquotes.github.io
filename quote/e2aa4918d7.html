<main class="wrap"><figure class="quote" id="q-e2aa4918d7" data-kw="">
<blockquote><p>2. [About the word “righteousness“:] It cannot be denied but that in many places its used for that propensity in God whereby from his hatred to sin He punishes wicked men; and thus it must be here [in Ps. 11:7], as the context evidences. Thus it is evidently used 2 Chron. 12:6; Rom. 2:5. Therefore in the next place, righteousness attributed to God signifies in the general that rectitude and purity in God’s nature, whereby He is free from all sin and hates all iniquity. And then more particularly that attribute in God whereby He does punish ungodly men:</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/anthony-burgess.html">Anthony Burgess</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The True Doctrine of Justification Asserted &amp; Vindicated, from the Errours of Papists, Arminians, Socinians &amp; more especially Antinomians in 30 Lectures</cite>, … (London: Underhill, 1654) | sect. 1, Sermon 1, Demonstrations of God’s Righteousness; The Kinds of it, and in what sense its attributed unto God, p. 3</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/the-covenant-of-grace/the-gospel-offer.html">The Gospel Offer</a></span></div>

<blockquote><p>Christ weeps to us in the law, but we do not lament; and He pipes to us in the gospel, but we do not dance: He is willing to draw us with the cords of men and with the bands of love, and yet we will not have Him to reign over us… Christ has now given us the first and second summons, the day is approaching when the sad and woeful summons shall be sent against us, of departing from Him into these everlasting flames, out of which there is no redemption.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/andrew-gray.html">Andrew Gray</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Works</cite>, … (d. 1656; Aberdeen: King, 1839), p. 26</span></figcaption>

</figure><figure class="quote" id="q-256a69721d" data-kw="">
<blockquote><p>(Verse. 31) ‘He forsakes not forever.’… Moreover, this is most sure, that the nature of God is such as that He delights not in our afflictions, being Himself naturally good, gentle, slow to anger and of great compassion. Thus we see how God is described unto us throughout the whole volume of the scripture, namely, in the 34th chapter of Exodus, insomuch that whenas Isaiah in his 28th chapter says He punishes and afflicts us, it seems rather that He deals like a stranger, and not like Himself. And namely, in the midst of all our afflictions, He makes his singular goodness always appear in the moderating of our punishments, turning them all to our benefit and welfare. And according hereunto, most notably wrote Saint Augustine in his epistles to Felix and Rusticus, saying, What is it that our good God will not mercifully do unto man? And how can it be but that He will show him all the favor He can, considering that all the tribulations which He sends are more benefits…</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/daniel-tossanus.html">Daniel Tossanus</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Lamentations &amp; Holy Mournings of the Prophet Jeremiah</cite>, … (London: Windet, 1587), ch. 3, p. 131-32</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/the-covenant-of-grace/the-gospel-offer.html">The Gospel Offer</a></span></div>

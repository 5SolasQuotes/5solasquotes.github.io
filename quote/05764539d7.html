<main class="wrap"><figure class="quote" id="q-05764539d7" data-kw="">
<blockquote><p>In our Assemblies we were more to set up a state opposite to a state, more upon forms, citations, leading of witnesses, suspensions from benefices, than spiritually to persuade and work upon the conscience, with the meekness and gentleness of Christ; the glory and royalty of our princely Redeemer and King, was trampled on, as any might have seen in our Assemblies. What way the army and the sword, and the countenance of nobles and officers seemed to sway, that way were the censures carried: It had been better had there been more days of humiliation and fastings in Assemblies, synods, presbyteries, congregations, families, and far lass adjourning commissions, new peremptory summonses, and new drawn-up processes, and if the meekness and gentleness of our Master had got so much place in our hearts that we might have waited on gainsayers and parties contrary-minded, and we might have driven gently, as our Master Christ who loves not to overdrive, but carries the lambs in his bosom.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/john-currie.html">John Currie</a></span><span class="wk"><span class="lbl">Work:</span> <cite>An Essay on Separation: or a Vindication of the Church of Scotland contra the Seceders</cite></span></figcaption>
<div class="meta"><span class="t"><a href="../topics/the-church/schism-and-separation.html">Schism and Separation</a></span></div>

</figure><figure class="quote" id="q-a3500b3359" data-kw="">
<blockquote><p>We offer and we perform all obedience which God has commanded, and we deny neither toll, tribute nor fear to her nor officers: We only bridle her blind rage, in which she would erect and maintain idolatry, and would murder our brethren who refuse the same. Neither yet fear we in this present day, that against us she makes a malicious lie, where that she says that it is not religion we go about, but a plain usurpation of authority: God forbid that such impiety should enter into our hearts, that we should make his holy religion a cloak and cover of our iniquity. From the beginning of this controversy ’tis evidently known what have been our requests, which, if the rest of the nobility and commonality of Scotland will cause to be performed unto us, if then in us appear any sign of rebellion, let us be reputed and punished as traitors, etc.</p></blockquote>

</figure><figure class="quote" id="q-49c7f784b9" data-kw="">
<blockquote><p>This was the constant judgment of the old non-conformists, which I shall transcribe from a grave author. ‘Those,’ says he: ‘that for many years together, during the reign of the three last princes [Edward VI, James I, Charles I], denied to come up to a full conformity to this [Anglican] Church, had a low oinion of the discipline then exercised (of which they have left behind them large evidences), yet how tender were they of the Church’s honour to keep Christians in communion? How zealous were they against separation? as may appear in the labours of Mr. [Robert] Parker, Mr. [John] Paget, Mr. [John] Ball. Mr. [Thomas] Brightman laid us low enough, when he [in his Commentary on Revelation] did not only parallel us with luke-warm Laodicea, but made that Church the type, and we the antitype, by reason of our discipline; yet how zealous is he against separation from these assemblers, and breaks out in these words: ‘Therefore their error is wicked and blasphemous, who so forsake the Church, as if Christ were altogether banished thence.”</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/degrees-of-impurities.html">London Ministers</a></span><span class="wk"><span class="lbl">Work:</span> <cite>A Collection of Cases &amp; other Discourses lately written to recover Dissenters</cite>, London Ministers, A Collection of Cases &amp; other Discourses lately written to recover Dissenters to the communion of the Church of England by some Divines of the City of London (London, 1685), vol. 1, ‘The Non-Conformists Plea for Lay-Communion with the Church of England’, pp. 62-63</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/the-church/schism-and-separation.html">Schism and Separation</a></span></div>

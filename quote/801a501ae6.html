<blockquote><p>Here it may be demanded whether it be lawful for Christian men to go into the temples of idols. I answer: they may, if they have a calling so to do, and do not communicate with idolaters in their superstitions, or give any honor to idols: but on the contrary, do openly profess, either by word , or by their deeds, or both, that they abhor both the idols and their service. Thus was Elijah present with the priests of Baal. Thus were the three children present when the golden image was worshipped. Thus was the prophet of God present at the altar of Bethel, when Jeroboam stretched out his hand to offer incense to the idol. (1 Kings 13) Thus Paul was present in Athens, and in the places of idolatry, that he might behold their superstitions. (Acts 17; 27) The Protestant princes in the crowning of Maximilian at Frankfurt brought the Emperor to the Church and to the place whereas he was to sit: this done, they returned without doing any reverence at all, and thereby professed their mislike of popish idols, and their service. It may be objected that the prophet of the Lord prayed in the place where idolatry was exercised: because he prayed at the altar of Bethel, for the restoring of the King’s arm. (1 Kings 13:6) Answer: He did not amiss: For to the clean, all things indifferent are clean : and therefore the place, though polluted with idolatry of others , was clean to the clean prophet. And the Jews were commanded, when they were in the midst of idolatrous nations, to worship God towards the Temple at Jerusalem. (1 Kings 8:48; Dan. 6:10) And God heard his prayer, by miracle restoring the king’s arm: and therefore He approved it. And a prayer made in an idolatrous assembly is no approbation of idolatry, if there be an open profession of the mislike thereof: and the prayer be made upon some necessity, as this of the prophets was, that the king might be convinced of his impiety. It may be objected that the prophet, refusing to eat in the place (1 Kings 13:8), should also have refused to pray there. I answer: No, because God appointed abstinence from meat to be the sign of detestation of the idolatry committed in Bethel, and not abstinence from prayer. And this example of the prophet, does not warrant us to be present at idolatrous service, there to worship the true God, because he did not dissemble, but he openly professed the truth against idolaters. On the contrary, if men resolve not to profess their detestation of idolatrous worship, either by word of mouth, gesture, or some other way; but only desire upon curiosity, to see new fashions, and hereupon, enter into the temples of idols; I think they ought not to do it. For they themselves tempt God by so doing; they offend their weak brethren and draw them by their example to do the like. And lastly, by their presence they confirm the obstinate idolaters in their superstition. The like is to be said of them, that curiously without calling go out of the precincts of the Church into idolatrous countries for this end only to see and to be seen.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/william-perkins.html">William Perkins</a></span><span class="wk"><span class="lbl">Work:</span> <cite>‘A Warning Against the Idolatry of the Last Times, &amp; an Instruction touching Religious or Divine Worship’ in The Works</cite>, (London: Legatt, 1626), vol. 1, p. 692</span></figcaption>

<blockquote><p>Q. 11. Is all use of images unlawful? A. God did so much hate idolatry and the neighborhood of the idolaters made it so dangerous to the Israelites that He did not only forbid the worshipping of images, but all such making or using of them as might become a snare or temptation to any. So that though it be lawful to make images for civil uses, and when they are made, to fetch holy thoughts or meditation from them, as from all other creatures or things in the world, yet in any case when they become a snare or danger (being not necessary things, they become a sin to those that so use them as [a] snare to others or themselves. Ex. 34:13-15; Num. 33:52; Dt. 7:2; Kn. 11:18 &amp; 23; 14:24. Q. 12. Is it lawful to make any picture of God? A. No: for pictures are the signs of corporeal things, and it is blasphemy to think God like a bodily substance: But it is lawful to make such pictures (as of a glorious light) from which occasion may be taken of good thoughts concerning God. Ex. 25:18, 1•… 20; 1 Sam. 4:4; Ps. 18:1; Eze. 10:2. Q. 13. Is it lawful to make the picture of Christ as man, or as crucified? A. The doing it as such is not forbidden, nor the right use of it when done: But the abuse, i.e. the worshipping of it or of Christ by it, is forbidden and the making or using such when it tends to such abuse and has more of snare than profit.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/richard-baxter.html">Richard Baxter</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Catechizing of Families, a Teacher of Householders how to Teach their Households</cite>, (London: Parkhurst, 1683), ch. 35, ‘Of the Second Commandment’, pp. 256-57</span></figcaption>

7.html&amp;via=5Solas" target="_blank" rel="noopener">Share on X</a><a class="perma" href="../quote/53cb2189a7.html">Permalink</a><a class="src" href="https://reformedbooksonline.com/topics/topics-by-subject/worship/images-of-christ/#:~:text=Q.%2011.%20Is%20all%20use%20of,has%20more%20of%20snare%20than%20profit&amp;text=Q.%2011.%20Is%20all%20use%20of%20images%20unlawful&amp;text=abuse%20and%20has%20more%20of%20snare%20than%20profit" rel="noopener" target="_blank">Read it online · Reformed Books Online</a></div>

<blockquote><p>Your long labor in setting down the faults to be found in our Liturgy is to small purpose. The Nonconformists do except against many things appointed in the Book, as inconvenient at least, and such as should be taken away or reformed, as the reading of Apocryphal books under the title of holy Scripture, specially such parts as be corrupt for matter: The cross and surplice as idolothites by participation and signs of mystical signification: The corruptions in the translations: and some things in the forms of burial, matrimony, thanksgiving for women after child-bed, etc. But these they condemn not as idolatry, nor as that which makes the worship itself false and idolatrous. It is one thing to say such a rite is inconvenient, superstitious, scandalous borrowed from the Papists, not warranted by the Word of God, in the use will-worship, if the word be taken largely; another that the worship itself is false and idolatrous.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/john-ball.html">John Ball</a></span><span class="wk"><span class="lbl">Work:</span> <cite>An Answer to Two Treatises of Mr. John Can, the Leader of the English Brownists in Amsterdam</cite>, … (London: R.B., 1642), ch. 2, p. 29</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/worship/idolatry-and-images.html">Idolatry and Images</a></span></div>

<main class="wrap"><figure class="quote" id="q-3ea25c3096" data-kw="">
<blockquote><p>And of all sorts of brethren, none have reason to take greater heed unto this evil, than such as naturally are strangers one to another, and of divers nations, but are sworn brethren. If the fire of envy and hatred once begin to burn in their breasts, they want the affection of natural brethren to extinguish it. The best remedy for such, is a right embracing of one true religion, and religiously to remember their covenant, by which they are joined to Jesus Christ, and amongst themselves, which will make them forget they are of divers countries and kingdoms, and timely to resist all divisive motions […]</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/alexander-henderson.html">Alexander Henderson</a></span><span class="wk"><span class="lbl">Work:</span> <cite>A sermon preached before the Lords and Commons at Margaret s Church in Westminster, upon Thursday the 18th of July, 1644’ in Chris Coldwell (ed.), Sermons preached before the English Houses of Parliament by the Scottish Commissioners to the Westminster Assembly of divines 1643-1645</cite></span></figcaption>
<div class="meta"><span class="t"><a href="../topics/the-church/schism-and-separation.html">Schism and Separation</a></span></div>

</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-c01b0d097a" data-kw="">
<blockquote><p>Tis said [for conforming in church to what is less good:] ‘What we may do sometimes, we may and ought to do always.’ But we have hundreds of instances that we would be loth to do that always which we might do and have done sometimes. We have often eat bad and unwholesome meat, dwelt in inconvenient and bad houses, etc. but are we bound to do so always? So some have been forced and been glad to use such helps for their souls as they could get, but are they bound to use them always? If we have better means and helps, should we not use them rather? Reason speaks it, and Scripture also, and gives us some examples which look that way. St. Paul circumcised Timothy, but opposed it in others, and would not let Titus be circumcised. He also, to satisfy the believing Jews that were too zealous for the Law, and misinformed of him, took men, shaved his head, purified himself with them, entered into the Temple, etc. This he did once, but would he have done so always?</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/francis-tallents.html">Francis Tallents</a></span><span class="wk"><span class="lbl">Work:</span> <cite>A Short History of Schism</cite>, (London: Parkhurst, 1705), p. 110 Tallents (1619–1708) was a non-conforming English presbyterian minister.</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/the-church/schism-and-separation.html">Schism and Separation</a></span></div>

<main class="wrap"><figure class="quote" id="q-106c272b30" data-kw="">
<blockquote><p>In the Divine Essence we are to consider two things: First, The diverse manner of being therein; secondly, The attributes thereof.

The diverse manner of being therein, are called Persons (Heb. i. 3.)

A person is a distinct subsistence of the whole Godhead (John i. 1; v. 31, 37; xiv. 16; Col. ii. 9; John xiv. 9.)

There are Three Divine Persons, the Father, the Son, and the Holy Ghost (Gen. i. 26; iii. 22; xi. 7; Exod. xx. 2; Hos. i. 4, 7; Isa. lxiii. 9, 10; Zech. iii. 2; Hag. ii. 5, 6; 1 John v. 7; Matt. iii. 16, 17; xxviii. 19; John xiv. 26; 2 Cor. xiii. 13.) These three persons are not three several substances, but three distinct subsistences; or three diverse manner of beings, of one and the same substance and divine essence. So that a person in the Godhead is an individual Understanding and incommunicable subsistence, living of itself, and not sustained by another.

In the unity of the Godhead there is a plurality which is not accidental (Gen. i. 26; iii. 22; xi. 7; Isa. vi. 8), for God is a most pure act, and admits no accidents; nor essential, for God is one essence only—but personal.

The persons in this one essence are but three. In this mystery there is alius et alius, another and another; but not aliud et aliud, another thing and another thing. The Divine Essence in itself is neither divided nor distinguished, but the three Persons in the Divine Essence are distinguished amongst themselves three manner of ways: 1. By their Names. 2. By their Order. 3. By their Actions.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/lewis-bayly.html">Lewis Bayly</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Practice of Piety: Directing a Christian to walk, that he may please God</cite>, (1612; Grand Rapids MI: Soli Deo Gloria, 2019), pp 3-4.</span></figcaption>

<blockquote><p>XIX. The glory of his Person may be considered, partly in reference to the divine nature; partly, to the human. The former is nothing else than a most illustrious assertion, vindication, and display of the Divine majesty of Christ, reflected from the glory of the human nature. During his abode on the earth, the Son of God had so concealed his glory under the vail of his humbled flesh, that only a few faint rays, despised by the generality of spectators, appeared. But now, in his glorified humanity, he shines forth like the sun, having, by his bright and exalted lustre, dispelled the clouds of his obscure and debased condition; and declares, in a striking and glorious manner, that the Son of man is the Son of God, and truly God. This was the matter of his request in the following solemn prayer: “And now, O Father, glorify thou me with thine own self, with the glory which I had with thee, before the world was.” That is, “Gloriously declare that I am thine eternal and only-begotten Son:”—which the Father has done chiefly by setting him at his right hand, as the place of the highest dignity and glory.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/herman-witsius.html">Herman Witsius</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Sacred Dissertations, on What Is Commonly Called the Apostles’ Creed</cite>, trans. Donald Fraser, vol. 2 (London: Khull, Blackie &amp; Co., 1823), 252.</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/the-trinity.html">The Trinity</a></span></div>

</figure><figure class="quote" id="q-8c569efa4a" data-kw="">
<blockquote><p>Some at the first may possibly say, that this [the Trinity] cannot stand, because it is against all reason that one should be three, or three one. The answer is, that indeed if one and the same respect be kept it is not possible, but in divers [various] considerations and respects it may. And thus the Father, the Son, and the Holy Ghost are three, namely in person; and again, they three are one, not in person but in nature.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/william-perkins.html">William Perkins</a></span><span class="wk"><span class="lbl">Work:</span> <cite>An Exposition of the Symbol or Creed of the Apostles, According to the Tenor of Scripture</cite>, in The Work of William Perkins (Cambridge: John Legat, 1600), p. 201.</span></figcaption>

<blockquote><p>VII. The efficient cause of justification is God, considered both οὐσιωδῶς [ousiōdōs, essentially] and ὑπαρκτικῶς [hyparktikōs, subsistentially/personally]. Essentially, with respect to the whole complex — which, as a work ad extra [external work], is common to the three Persons of the Holy Trinity as to the ἀποτέλεσμα [apotelasma, effect] itself, yet remains distinct both in order and in mode of operation. Subsistentially, with respect to the parts of the complex: and thus to the Father is attributed the διακριτικός [diakritikos, distinguishing/decisive] act of justification, Rom. III.25; VIII.33; to the Son, the merit of justification, Isa. LIII.11; Matt. IX.6; and to the Holy Spirit, its application, 1 Cor. VI.11.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/friedrich-spanheim.html">Friedrich Spanheim</a></span><span class="wk"><span class="lbl">Work:</span> <cite>‘Disputation on Justification’ in Disputationum Theologicarum Miscellaneorum Pars Prima</cite>, (Geneva: Chovet, 1652), trans. AI by Roman Prestarri at Confessionally Reformed Theology</span></figcaption>

%20efficient%20cause%20of%20justification%20is%20God&amp;text=the%20Holy%20Spirit%2C%20its%20application%2C%201%20Cor.%20VI.11" rel="noopener" target="_blank">Read it online · Reformed Books Online</a></div>
</figure><figure class="quote" id="q-1b480310f1" data-kw="">
<blockquote><p>The catholic church sees nothing clearer in the divine books than that God, just as surely as he is the one and only God, is also three in number, and that the Father, Son and Holy Spirit are not only one essence, but are one God, and one only, and that man, having become an enemy of God, and hated on account of his sins, could not return to his holy and worthy communion with God, except through the bloody death of the Son, and that this death can save no one who is not gifted and filled with the breath of the Holy Spirit. But this goddess Reason is in no way willing or able to swallow and stomach. The mystery of the Father, the Son, and the Holy Spirit, and the mystery that rests on it, that of redemption, of Christ, she mocks as stupidity – to her it is a perpetual stumbling-block.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/henricus-pontanus.html">Henricus Pontanus</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Funeral Oration on the Death of Pieter van Mastricht, 24 February 1706 in Pieter van Mastricht, Theoretical-Practical Theology Volume 1: Prolegomena</cite></span></figcaption>

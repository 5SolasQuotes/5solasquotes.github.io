<blockquote><p>Controversy – Is God able not only to deprive an innocent creature of life but also to condemn them to the eternal tortures of hell? We deny against certain Scholastics. Arguments 1. All the ways of God should be mercy and truth to those who keep covenant (Ps. 25:10). 2. Anyone approaching God should believe that He will reward their obedience with a reward not condemn them (Heb. 11:6). 3. In an innocent creature there can be no consciousness of guilt or the just judgment of God, which is the meaning of punishment. 4. No glory to God could arise from this but rather the dishonor of a tyrannical lord. 5. The righteousness of God demands that He acquit the holy, but it does not permit him to condemn someone who has not merited it (Ps. 18:26-27, Gen. 18:25, Ps. 7:11). Objections 1. He can reduce the innocent to nothing. Reply. Then he only takes away what He gave, but punishment would be to do injury to someone while existing. 2. He acts this way with Christ. Reply. He was our surety, who took our debts on Himself. 3. God can impute to us the sin of Adam. Reply. That is imputed to be ours which is truly ours just as the children of slaves are slaves and the sons of citizens are citizens and are reputed to be such. 4. We are permitted to kill innocent creatures. Reply. 1. Not rational ones. 2. Irrational ones (bruta) for our use (2 Pet. 2:12). 3. It is one thing to kill, another to give to the living the highest punishment according to one’s pleasure.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/leonard-riissen.html">Leonard Riissen</a></span><span class="wk"><span class="lbl">Work:</span> <cite>A Complete Summary of Elenctic Theology &amp; of as Much Didactic Theology as is Necessary trans. J. Wesley White MTh thesis (Bern, 1676; GPTS, 2009), ch. 11, ‘Christ’</cite>, pp. 84-85, 112-13, 121-22</span></figcaption>

<blockquote><p>Concerning the Civil Magistrate … 2. For the due form of government, or power of governors in any nation, they believe God’s Word has fixed no universal rule, only confirming the just laws of kingdoms and polities, and they believe it their duty to be obedient to such governors in all places, as the laws in that place have established, and in the exercise of such power as those laws have given them. From the obedience to which no person upon the account of religion can pretend to an immunity; and in the exercise of which no magistrate ought by any to be resisted.</p></blockquote>

<blockquote><p>It is agreed on by all real Christians that man being made an intelligent, free agent, not under bruitish necessitating determination by objects, is governed by God by the moral way of law; that is by the signification of his Ruler’s will, making his duty, and not by mere natural or forcible motion: And it is agreed that God Himself is his only absolute Universal Ruler, and his laws given in nature and by revelation are the only universal laws, which no human power can abrogate or dispense with: And that kings and magistrates are his ministers for men’s good, and have no power but from Him, and none against Him or his laws; and that it is not man but God, by whom we must all be judged to everlasting reward or punishment: And therefore that all men must obey God before men, and must not fear them that can but kill the body, but Him who is able to cast both soul and body into Hell.</p></blockquote>

<div class="actions"><button class="copy" data-copy="“It is agreed on by all real Christians that man being made an intelligent, free agent, not under bruitish necessitating determination by objects, is governed by God by the moral way of law; that is by the signification of his Ruler’s will, making his duty, and not by mere natural or forcible motion: And it is agreed that God Himself is his only absolute Universal Ruler, and his laws given in nature and by revelation are the only universal laws, which no human power can abrogate or dispense with: And that kings and magistrates are his ministers for men’s good, and have no power but from Him, and none against Him or his laws; and that it is not man but God, by whom we must all be judged to everlasting reward or punishment: And therefore that all men must obey God before men, and must not fear them that can but kill the body, but Him who is able to cast both soul and body into Hell.”

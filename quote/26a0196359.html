<blockquote><p>[The saints] in heaven will behold an outward glory as they [behold] the human nature of Christ, which is united to the Godhead, as it is the body of that person that is God. And there will doubtless be appearances of a divine and inimitable glory and beauty in Christ’s glorified body, which it will indeed be a ravishing and blessed sight to see.

But the beauty of Christ’s body that will be beheld with bodily eyes will be ravishing and delighting chiefly as it will express his spiritual glories. The majesty that will appear in Christ’s body will express and show forth the spiritual greatness and majesty of the divine nature. The pureness and beauty of that light and glory will express the perfection of the divine holiness. The sweetness and ravishing mildness of his countenance will express his divine and spiritual love and grace.

Thus it was, when the three disciples beheld Christ at his transfiguration upon the mount. They beheld a wonderful, outward glory in Christ’s body, an inexpressible beauty in his countenance; but that outward glory and beauty delighted them principally as it was an expression or signification of the divine excellencies of his mind, as we may see by their manner of speaking of it.

It was the sweet mixture there was of majesty and grace in his countenance that ravished them; 2 Peter 1:16–18, “We were eyewitnesses of his majesty. For he received from God the Father honour and glory, when there came such a voice to him from the excellent glory, This is my beloved Son, in whom I am well pleased. And this voice we heard when we were with him in the holy mount.”

But especially by the account that John gives of it; John 1:14, “And the Word was made flesh and dwelt among us (and we beheld his glory, the glory as of the only begotten of the Father), full of grace and truth,” where John very probably had in his mind what he had seen in the mount at the Transfiguration. Grace and truth are not outward but spiritual glories.</p></blockquote>

</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-f1260cd789" data-kw="">
<blockquote><p>Another remarkable period is there meeting together at the bar of God’s great justice-court in heaven, within the vail, whither the forerunner hath for us entered, even Jesus, Heb. 6. last. When Christ was upon the cross, the vail of the temple was rent in twain from the top to the bottom, &amp; a way was made for entering into the holy of holies. And as the priests under the law were not only to offer the sacrifice without the camp, but after that were to enter the holiest of all, not without blood, but with the blood of the sacrifice, to sprinkle the mercy seat, Lev. 16.14, 15. Even so Christ, having offered himself a sacrifice, and suffered without the gate, Heb. 13.12. He is entered into the holy place by his own Blood, Heb. 9.12. there to appear as our high priest, in the power and virtue of his blood, to make a full atonement, and sprinkle the mercy-seat. Hence believers are said to be come to Jesus the mediator of the new covenant, and to the blood of sprinkling. And where is this? Even in heaven, as you see in the context, Heb. 12.23, 24.

Now, in this work, Christ carried the price of his blood into the very presence of God for us, Heb. 9.24. and paid it down before him; and, in this act, justice hath its satisfaction brought home; and, by this act, mercy and justice actually are met: For hereby Christ sprinkled the very mercy-seat with blood all over, both upon it, and before it, as the forecited Lev. 16. represents: For the mercy-seat of old stood so, that it could be seen but two ways, namely, upon it, and before it, as a table next to the wall; and so this points out, that whatever way we look to mercy by faith, we may see mercy and blood mixt, mercy and justice met together, and all sorts of mercy conveyed thro’ the blood of Christ, top-mercies, and side-mercies, upper-mercies of a spiritual nature, and lower mercies of a temporal nature; for the mercy-seat is sprinkled with the blood upon it, and before it, and whatever way you look to it.

The sacrifice was finished on the cross, and all sacrifices finished therein; but the blood of the sacrifice behoved also to be carried within the vail in order to the full atonement, that what was written in blood upon the cross, might be sealed in the presence of God at the heavenly bar: And we act not our faith far enough for redemption, unless we follow Christ from the cross to the bar of God’s justice-court in heaven, to see all sealed and secured there within the vail, where this blood is exposed, as it were, and pled at the bar; where mercy and justice meet together, and embrace each other.</p></blockquote>

<blockquote><p>How much of spiritual meaning and significance is revealed to the eye of faith, in that great truth “He inhabiteth eternity.” From eternity did God exist, and infinitely happy in his own glory. His being is underived, and never had a beginning; before angel and arch-angel were called into being to celebrate his praises, did our God exist in his own uncreated glory. The blessed spirits of heaven, who, as they receive their existence from the “high and lofty One,” derive also their happiness from the infinite happiness which resides in his perfections, and delight to magnify his glory, and to do his will. Their fervid praises ascend to him, who has given them all their powers of serving him, and their capacities of enjoying him. In the immediate dwelling place of God are the souls of the redeemed, who “have passed beyond tribulation, and who, clothed with white robes and palms in their hands,” cry with a loud voice, saying, “Salvation to our God which sitteth upon the throne, and unto the Lamb.”

Infinite happiness is in the immediate dwelling-place of him who inhabits eternity; unutterable glory is also around the God of our salvation. The Word of God elevates our faith, and calls upon us to entertain devout and adoring views of the glory of him, who is holy in his nature, and holy and righteous in all his ways. Yet, though thus glorious and exalted, though infinite in his own happiness, though inconceivably pure and holy in his essence, though requiring no services of any created beings that rejoices in the excellence of his will, to add to his internal and infinite happiness and complacency, yet, amazing truth of God’s own grace and condescension, he delights to come forth from the glory which he inhabits in eternity, and to dwell with them, who in the depths of humility and self-abasement, feel their own guilt and unworthiness in his holy and omniscient view, and in faith and love acknowledge him as their God in Christ.

What a precious revelation does the Prophet give of the grace of God! What a consolatory representation of his unsearchable condescension! While God dwells in the heavens, and praises of eternity — while he dwells in the “high and holy place” — a heavenly temple—the grandeur, the purity, the glory of which befit the blessed perfections of his nature — yet he dwells also with him who is of a contrite and humble spirit — God dwells with such for a blessed and gracious purpose — “to revive the spirit of the humble, and to revive the heart of the contrite ones.” In his wisdom and grace, he has devised a glorious plan of salvation, through which he can hold communion with those in whom these spiritual qualities reside.</p></blockquote>

nd+infinite+happiness+and+complacency%2C+yet%2C+amazing+truth+of+God%E2%80%99s+own+grace+and+condescension%2C+he+delights+to+come+forth+from+the+glory+which+he+inhabits+in+eternity%2C+and+to+dwell+with+them%2C+who+in+the+depths+of+humility+and+self-abasement%2C+feel+their+own+guilt+and+unworthiness+in+his+holy+and+omniscient+view%2C+and+in+faith+and+love+acknowledge+him+as+their+God+in+Christ.%0A%0AWhat+a+precious+revelation+does+the+Prophet+give+of+the+grace+of+God%21+What+a+consolatory+representation+of+his+unsearchable+condescension%21+While+God+dwells+in+the+heavens%2C+and+praises+of+eternity+%E2%80%94+while+he+dwells+in+the+%E2%80%9Chigh+and+holy+place%E2%80%9D+%E2%80%94+a+heavenly+temple%E2%80%94the+grandeur%2C+the+purity%2C+the+glory+of+which+befit+the+blessed+perfections+of+his+nature+%E2%80%94+yet+he+dwells+also+with+him+who+is+of+a+contrite+and+humble+spirit+%E2%80%94+God+dwells+with+such+for+a+blessed+and+gracious+purpose+%E2%80%94+%E2%80%9Cto+revive+the+spirit+of+the+humble%2C+and+to+revive+the+heart+of+the+contrite+ones.%E2%80%9D+In+his+wisdom+and+grace%2C+he+has+devised+a+glorious+plan+of+salvation%2C+through+which+he+can+hold+communion+with+those+in+whom+these+spiritual+qualities+reside.%E2%80%9D%0A%0A%E2%80%94+Mungo+Fairlie+Parker%2C+God+s+Dwelling+with+the+Humble+and+Contrite%2C+the+Source+of+their+Revival%E2%80%99+in+The+Free+Church+Pulpit%3B+Consisting+of+Discourses+by+the+Most+Eminent+divines+of+the+Free+Church+of+Scotland.+Vol.+I.&amp;url=https%3A%2F%2F5solasquotes.github.io%2Fquote%2Fc9829607ae.html&amp;via=5Solas" target="_blank" rel="noopener">Share on X</a><a class="perma" href="../quote/c9829607ae.html">Permalink</a><a class="src" href="https://reformedcovenanter.wordpress.com/2021/02/01/mungo-fairlie-parker-on-the-gracious-condescension-of-the-infinitely-exalted-god/" rel="noopener" target="_blank">Read it online · Reformed Covenanter</a></div>
</figure><figure class="quote" id="q-5052115699" data-kw="">
<blockquote><p>It is therefore a great practical doctrine—that Jesus is not simply a Redeemer from sin, but the Founder and Head of a Kingdom. He has not only taught men a system of opinions concerning God, but instituted also, and rules over, a community. He hath given not simply a precept to be obeyed—a rule for the government of life—an opinion to be held by each individual separately—the body of his followers, like those of Socrates or Plato, combining merely by accidental agreement in opinion: far beyond all this.

He hath constructed a Society; his followers are made members of a community with new social relations. To believe in Jesus is not merely the adoption of an opinion. The very act of faith whereby his followers receive his doctrine, unites them also to Him as members of his mystical body, and through Him to one another. They become a combination of men who are members of one spiritual body—brethren of one holy family. And this is the Kingdom of Heaven.</p></blockquote>

ner" target="_blank">Read it online · Reformed Covenanter</a></div>
</figure><figure class="quote" id="q-6d861ec537" data-kw="">
<blockquote><p>I come now to my third [point]: that it is lawful to do good works intuitu mercedis, ‘with an eye or respect to the recompense of reward’. It is plain that Nehemiah here did so: “Remember me, O my God, concerning this,” etc. [Neh. 13:14] So did Moses, of whom it is said that he chose rather to suffer affliction with the people of God than to enjoy the pleasures of sin for a season; esteeming the reproach of Christ greater riches than the treasures of Egypt(Heb. 11:25–26), for, says the text, [Greek] (aspiciebat or intuebatur) [Greek], he had respect unto the recompense of reward. And, I confess, it seems an unreasonable thing to me [1] that that which is made the end (though but in part) of the action should not be at all looked unto by the agent; whereas finis is principium actionis [‘the end is the principle of the action]; and [2] that that which God has promised unto us as an encouragement, to make us work with the more alacrity, should not be thought on nor looked to in our working. Do not they who would persuade this go the way to discourage men from good works, by removing out of their sight the encouragement which God has given them? But they object, the obedience of God’s children ought to be filial, that is, free, and not mercenary, as that of hirelings. I answer: obedience which is only for reward, without all respect or motive of love and duty, is the obedience of a hireling; not that which acknowledges the tie of obedience-absolute, and the reward no otherwise due than of his Father’s free love and bounty, as every true child of God does, and ought to do. They object again that of the apostle, 1 Cor. 13:5, “Charity seeks not her own.” Now, say they, the works of God’s children must proceed from love and charity. I answer: what though charity seeks not her own? May not yet a charitable man so much as look or hope for his own, or have an eye to what is promised him? But this place is altogether misapplied and abused: for that property of charity now mentioned (as some also of the rest in that chapter) concerns only our charity towards men, and not our charity towards God; the meaning thereof being that a charitable man will sooner lose his own than, by seeking or contending for it, break the bond of charity.</p></blockquote>

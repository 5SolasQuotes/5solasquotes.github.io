<blockquote><p>Section 7. Third part of liberty, viz., the free rise of things indifferent. The knowledge of this part necessary to remove despair and superstition. Superstition described… The third part of this liberty is that we are not bound before God to any observance of external things which are in themselves indifferent, (“adiafora”) but that we are now at full liberty either to use or omit them. The knowledge of this liberty is very necessary to us; where it is wanting our consciences will have no rest, there will be no end of superstition. In the present day many think us absurd in raising a question as to the free eating of flesh, the free use of dress and holidays, and similar frivolous trifles, as they think them; but they are of more importance than is commonly supposed. For when once the conscience is entangled in the net, it enters a long and inextricable labyrinth, from which it is afterwards most difficult to escape. When a man begins to doubt whether it is lawful for him to use linen for sheets, shirts, napkins, and handkerchiefs, he will not long be secure as to hemp, and will at last have doubts as to tow; for he will revolve in his mind whether he cannot sup without napkins, or dispense with handkerchiefs. Should he deem a daintier food unlawful, he will afterwards feel uneasy for using loafbread and common eatables, because he will think that his body might possibly be supported on a still meaner food. If he hesitates as to a more genial wine, he will scarcely drink the worst with a good conscience; at last he will not dare to touch water if more than usually sweet and pure. In fine, he will come to this, that he will deem it criminal to trample on a straw lying in his way. For it is no trivial dispute that is here commenced, the point in debate being, whether the use of this thing or that is in accordance with the divine will, which ought to take precedence of all our acts and counsels. Here some must by despair be hurried into an abyss, while others, despising God and casting off his fear, will not be able to make a way for themselves without ruin. When men are involved in such doubts whatever be the direction in which they turn, every thing they see must offend their conscience.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/john-calvin.html">John Calvin</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Institutes of the Christian Religion</cite>, 4.10.7</span></figcaption>

<blockquote><p>There was a certain Count of your [Reformed] confession who possessed common jurisdiction in a certain church with a certain Prince of our [Lutheran] religion. Therefore since the Associate was judging that he [the reformed Count] had more of right in that church, he made sure that the altar was destroyed and that a table be built [for the Lord’s Supper] in the temple [church building]. The Prince found out later about this, and ordered that the table be removed and an altar be constructed again. The Count in return took care a second time in return that the altar be destroyed, and the table restored. The Prince likewise a second time ordered that the table be taken away and the altar restored. I do not know whether this happened a third time. But the [reformed] Count later heeded the [Lutheran] Prince’s strictness, and left off from his course, such that the altar remained in the temple in place of the table.</p></blockquote>

<blockquote><p>§17. 11. He that has commanded us to express our minds in several cases about his worship (as in confession of our sins, in profession of our faith, in choosing of our pastors, in consenting to the casting out or taking in, or restoring of members, in renewing promises of obedience, and the like) has hereby made a profession necessary in general, and so has made it our duty to signify our consent in all these cases by some convenient sign: For man’s mind is not known to others but by signs. But He has not tied us absolutely to any particular sign. If a confession of faith be read, and we are called to signify our consent, or if we are called to signify our consent to be Church-members, or to be guided by our pastors, or submit to discipline; God has not tied us in such cases, whether we shall signify this consent by speaking, or by subscribing our names (Isa. 44:3-5) or by lifting up the hand, or by laying it on a Book (as in swearing) or by standing up, or such like. A sufficient signification or profession of our minds is necessary; but the special sign is left to our own, or our governor’s determination. Of which I shall speak more anon. §18. To this end, and on these terms was the sign of the cross used heretofore by Christians, and to this end they used standing in public worship every Lord’s Day (forbidding kneeling) and afterward standing up at the [saying of the Apostles’] Creed: as also adoring with their faces towards the east, etc. They used these only as significations of their own minds, instead of words; As the prophets of old were wont by other signs, as well as words to prophesy to the people… And I dare not condemn the cautelous [prudent, cautious] use of such professing signs as these: Though the tongue be the chief instrument, yet not the only instrument to express the mind; and though words be the ordinary sign, yet not the only sign. Dumb men must speak by other signs: And usually more silent signs are fitter for assemblies, to avoid disturbance: And sometimes more permanent signs (as subscription, or a stone or pillar of remembrance, as Josh. 24, etc.) are more desirable. And this is left to human prudence. §19. And therefore I durst not have reproved any of the ancient Christians that used the sign of the cross merely as a professing signal action, to show to the heathen and Jews about them that they believed in a crucified Christ, and were not ashamed of his cross. The occasional, indifferent use of this, when it is merely to this end, I durst not have condemned. Nor will I now condemn a man that, living among the enemies of a crucified Christ, shall wear a cross in his hat, or on his breast, or set it on his doors, or other convenient place, merely as a professing sign of his mind, to be but instead of so many words, q. d. [as to say] ‘I thus profess myself the servant of a crucified Christ, of whom I am not ashamed.’ Whether these things be fit or unfit, the time, place, occasion and other circumstances must show: but the lawfulness I dare not deny. … §40… I think neither magistrate nor synod should do any more than hinder undecency: But yet if they do more, and tie all to one habit [garment] (and suppose it were an undecent habit), yet this is but an imprudent use of power. It is a thing within the magistrate’s reach; He does not an alien work, but his own work amiss: and therefore the thing in itself being lawful, I would obey him and use that garment if I could not be dispensed with [it]. Yea though secondarily the whiteness be to signify purity, and so it be made a teaching sign, yet would I obey: For secondarily, we may lawfully and piously make teaching signs of our food and raiment, and everything we see. But if the magistrate had said that the primary reason or use of the surplice was to be an instituted sacramental sign, to work grace on my soul, and engage me to God, then I durst not have used it, though secondarily it had been commanded as a decent garment. New sacraments I durst not use, though a secondary use were lawful. … §57. That it [the minister making the sign of the cross in baptism] is ordained for this use, appears from the words (anon to be recited) in the use of it, and by those words prefixed before the Common Prayer Book, ‘of ceremonies; why some are abolished and some retained,’ where they say that they ‘be not dark and dumb ceremonies, but are so set forth that every man may understand what they do mean, and to what use they do serve,’ and ‘that they are such as are apt to stir up the dull mind of man, to the remembrance of his duty to God, by some notable and special signification, whereby he might be edified.’ So that this and such other (if there be more such) are appointed by their signification to teach the understanding, and stir up the dull mind of man to the remembrance of his duty to God: Which are good works, but to be done only by good means. [Baxter goes on to take exceptions to the use of the cross in baptism]</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/richard-baxter.html">Richard Baxter</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Five Disputations of Church-Government &amp; Worship</cite>, (London, 1659), 5th Disputation, ch. 2, pp. 403-5, 409-10, 419-20</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/worship/ceremonies-and-things-indifferent.html">Ceremonies and Things Indifferent</a></span></div>
<div class="actions"><button class="copy" data-copy="“§17. 11. He that has commanded us to express our minds in several cases about his worship (as in confession of our sins, in profession of our faith, in choosing of our pastors, in consenting to the casting out or taking in, or restoring of members, in renewing promises of obedience, and the like) has hereby made a profession necessary in general, and so has made it our duty to signify our consent in all these cases by some convenient sign: For man’s mind is not known to others but by signs. But He has not tied us absolutely to any particular sign. If a confession of faith be read, and we are called to signify our consent, or if we are called to signify our consent to be Church-members, or to be guided by our pastors, or submit to discipline; God has not tied us in such cases, whether we shall signify this consent by speaking, or by subscribing our names (Isa. 44:3-5) or by lifting up the hand, or by laying it on a Book (as in swearing) or by standing up, or such like. A sufficient signification or profession of our minds is necessary; but the special sign is left to our own, or our governor’s determination. Of which I shall speak more anon. §18. To this end, and on these terms was the sign of the cross used heretofore by Christians, and to this end they used standing in public worship every Lord’s Day (forbidding kneeling) and afterward standing up at the [saying of the Apostles’] Creed: as also adoring with their faces towards the east, etc. They used these only as significations of their own minds, instead of words; As the prophets of old were wont by other signs, as well as words to prophesy to the people… And I dare not condemn the cautelous [prudent, cautious] use of such professing signs as these: Though the tongue be the chief instrument, yet not the only instrument to express the mind; and though words be the ordinary sign, yet not the only sign. Dumb men must speak by other signs: And usually more silent signs are fitter for assemblies, to avoid disturbance: And sometimes more permanent signs (as subscription, or a stone or pillar of remembrance, as Josh. 24, etc.) are more desirable. And this is left to human prudence. §19. And therefore I durst not have reproved any of the ancient Christians that used the sign of the cross merely as a professing signal action, to show to the heathen and Jews about them that they believed in a crucified Christ, and were not ashamed of his cross. The occasional, indifferent use of this, when it is merely to this end, I durst not have condemned. Nor will I now condemn a man that, living among the enemies of a crucified Christ, shall wear a cross in his hat, or on his breast, or set it on his doors, or other convenient place, merely as a professing sign of his mind, to be but instead of so many words, q. d. [as to say] ‘I thus profess myself the servant of a crucified Christ, of whom I am not ashamed.’ Whether these things be fit or unfit, the time, place, occasion and other circumstances must show: but the lawfulness I dare not deny. … §40… I think neither magistrate nor synod should do any more than hinder undecency: But yet if they do more, and tie all to one habit [garment] (and suppose it were an undecent habit), yet this is but an imprudent use of power. It is a thing within the magistrate’s reach; He does not an alien work, but his own work amiss: and therefore the thing in itself being lawful, I would obey him and use that garment if I could not be dispensed with [it]. Yea though secondarily the whiteness be to signify purity, and so it be made a teaching sign, yet would I obey: For secondarily, we may lawfully and piously make teaching signs of our food and raiment, and everything we see. But if the magistrate had said that the primary reason or use of the surplice was to be an instituted sacramental sign, to work grace on my soul, and engage me to God, then I durst not have used it, though secondarily it had been commanded as a decent garment. New sacraments I durst not use, though a secondary use were lawful. … §57. That it [the minister making the sign of the cross in baptism] is ordained for this use, appears from the words (anon to be recited) in the use of it, and by those words prefixed before the Common Prayer Book, ‘of ceremonies; why some are abolished and some retained,’ where they say that they ‘be not dark and dumb ceremonies, but are so set forth that every man may understand what they do mean, and to what use they do serve,’ and ‘that they are such as are apt to stir up the dull mind of man, to the remembrance of his duty to God, by some notable and special signification, whereby he might be edified.’ So that this and such other (if there be more such) are appointed by their signification to teach the understanding, and stir up the dull mind of man to the remembrance of his duty to God: Which are good works, but to be done only by good means. [Baxter goes on to take exceptions to the use of the cross in baptism]”

— Richard Baxter, Five Disputations of Church-Government &amp; Worship (London, 1659), 5th Disputation, ch. 2, pp. 403-5, 409-10, 419-20">Copy</button><a class="share" href="https://x.com/intent/post?text=%E2%80%9C%C2%A717.+11.+He+that+has+commanded+us+to+express+our+minds+in+several+cases+about+his+worship+%28as+in+confession+of+our+sins%2C+in+profession+of+our+faith%2C+in+choosing+of+our+pastors%2C+in+consenting+to+the+casting+out+or+taking+in%2C+or+restoring+of+members%2C+in+renewing+promises+of+obedience%2C+and+the+like%29+has+hereby+made+a+profession+necessary+in+general%2C+and+so+has+made+it+our+duty+to+signify+our+consent+in+all+these+cases+by+some+convenient+sign%3A+For+man%E2%80%99s+mind+is+not+known+to+others+but+by+signs.+But+He+has+not+tied+us+absolutely+to+any+particular+sign.+If+a+confession+of+faith+be+read%2C+and+we+are+called+to+signify+our+consent%2C+or+if+we+are+called+to+signify+our+consent+to+be+Church-members%2C+or+to+be+guided+by+our+pastors%2C+or+submit+to+discipline%3B+God+has+not+tied+us+in+such+cases%2C+whether+we+shall+signify+this+consent+by+speaking%2C+or+by+subscribing+our+names+%28Isa.+44%3A3-5%29+or+by+lifting+up+the+hand%2C+or+by+laying+it+on+a+Book+%28as+in+swearing%29+or+by+standing+up%2C+or+such+like.+A+sufficient+signification+or+profession+of+our+minds+is+necessary%3B+but+the+special+sign+is+left+to+our+own%2C+or+our+governor%E2%80%99s+determination.+Of+which+I+shall+speak+more+anon.+%C2%A718.+To+this+end%2C+and+on+these+terms+was+the+sign+of+the+cross+used+heretofore+by+Christians%2C+and+to+this+end+they+used+standing+in+public+worship+every+Lord%E2%80%99s+Day+%28forbidding+kneeling%29+and+afterward+standing+up+at+the+%5Bsaying+of+the+Apostles%E2%80%99%5D+Creed%3A+as+also+adoring+with+their+faces+towards+the+east%2C+etc.+They+used+these+only+as+significations+of+their+own+minds%2C+instead+of+words%3B+As+the+prophets+of+old+were+wont+by+other+signs%2C+as+well+as+words+to+prophesy+to+the+people%E2%80%A6+And+I+dare+not+condemn+the+cautelous+%5Bprudent%2C+cautious%5D+use+of+such+professing+signs+as+these%3A+Though+the+tongue+be+the+chief+instrument%2C+yet+not+the+only+instrument+to+express+the+mind%3B+and+though+words+be+the+ordinary+sign%2C+yet+not+the+only+sign.+Dumb+men+must+speak+by+other+signs%3A+And+usually+more+silent+signs+are+fitter+for+assemblies%2C+to+avoid+disturbance%3A+And+sometimes+more+permanent+signs+%28as+subscription%2C+or+a+stone+or+pillar+of+remembrance%2C+as+Josh.+24%2C+etc.%29+are+more+desirable.+And+this+is+left+to+human+prudence.+%C2%A719.+And+therefore+I+durst+not+have+reproved+any+of+the+ancient+Christians+that+used+the+sign+of+the+cross+merely+as+a+professing+signal+action%2C+to+show+to+the+heathen+and+Jews+about+them+that+they+believed+in+a+crucified+Christ%2C+and+were+not+ashamed+of+his+cross.+The+occasional%2C+indifferent+use+of+this%2C+when+it+is+merely+to+this+end%2C+I+durst+not+have+condemned.+Nor+will+I+now+condemn+a+man+that%2C+living+among+the+enemies+of+a+crucified+Christ%2C+shall+wear+a+cross+in+his+hat%2C+or+on+his+breast%2C+or+set+it+on+his+doors%2C+or+other+convenient+place%2C+merely+as+a+professing+sign+of+his+mind%2C+to+be+but+instead+of+so+many+words%2C+q.+d.+%5Bas+to+say%5D+%E2%80%98I+thus+profess+myself+the+servant+of+a+crucified+Christ%2C+of+whom+I+am+not+ashamed.%E2%80%99+Whether+these+things+be+fit+or+unfit%2C+the+time%2C+place%2C+occasion+and+other+circumstances+must+show%3A+but+the+lawfulness+I+dare+not+deny.+%E2%80%A6+%C2%A740%E2%80%A6+I+think+neither+magistrate+nor+synod+should+do+any+more+than+hinder+undecency%3A+But+yet+if+they+do+more%2C+and+tie+all+to+one+habit+%5Bgarment%5D+%28and+suppose+it+were+an+undecent+habit%29%2C+yet+this+is+but+an+imprudent+use+of+power.+It+is+a+thing+within+the+magistrate%E2%80%99s+reach%3B+He+does+not+an+alien+work%2C+but+his+own+work+amiss%3A+and+therefore+the+thing+in+itself+being+lawful%2C+I+would+obey+him+and+use+that+garment+if+I+could+not+be+dispensed+with+%5Bit%5D.+Yea+though+secondarily+the+whiteness+be+to+signify+purity%2C+and+so+it+be+made+a+teaching+sign%2C+yet+would+I+obey%3A+For+secondarily%2C+we+may+lawfully+and+piously+make+teaching+signs+of+our+food+and+raiment%2C+and+everything+we+see.+But+if+the+magistrate+had+said+that+the+primary+reason+or+use+of+the+surplice+was+to+be+an+instituted+sacramental+sign%2C+to+work+grace+on+my+soul%2C+and+engage+me+to+God%2C+then+I+durst+not+have+used+it%2C+though+secondarily+it+had+been+commanded+as+a+decent+garment.+New+sacraments+I+durst+not+use%2C+though+a+secondary+use+were+lawful.+%E2%80%A6+%C2%A757.+That+it+%5Bthe+minister+making+the+sign+of+the+cross+in+baptism%5D+is+ordained+for+this+use%2C+appears+from+the+words+%28anon+to+be+recited%29+in+the+use+of+it%2C+and+by+those+words+prefixed+before+the+Common+Prayer+Book%2C+%E2%80%98of+ceremonies%3B+why+some+are+abolished+and+some+retained%2C%E2%80%99+where+they+say+that+they+%E2%80%98be+not+dark+and+dumb+ceremonies%2C+but+are+so+set+forth+that+every+man+may+understand+what+they+do+mean%2C+and+to+what+use+they+do+serve%2C%E2%80%99+and+%E2%80%98that+they+are+such+as+are+apt+to+stir+up+the+dull+mind+of+man%2C+to+the+remembrance+of+his+duty+to+God%2C+by+some+notable+and+special+signification%2C+whereby+he+might+be+edified.%E2%80%99+So+that+this+and+such+other+%28if+there+be+more+such%29+are+appointed+by+their+signification+to+teach+the+understanding%2C+and+stir+up+the+dull+mind+of+man+to+the+remembrance+of+his+duty+to+God%3A+Which+are+good+works%2C+but+to+be+done+only+by+good+means.+%5BBaxter+goes+on+to+take+exceptions+to+the+use+of+the+cross+in+baptism%5D%E2%80%9D%0A%0A%E2%80%94+Richard+Baxter%2C+Five+Disputations+of+Church-Government+%26+Worship+%28London%2C+1659%29%2C+5th+Disputation%2C+ch.+2%2C+pp.+403-5%2C+409-10%2C+419-20&amp;url=https%3A%2F%2F5solasquotes.github.io%2Fquote%2F2ee02e814e.html&amp;via=5Solas" target="_blank" rel="noopener">Share on X</a><a class="perma" href="../quote/2ee02e814e.html">Permalink</a><a class="src" href="https://reformedbooksonline.com/on-ceremonies/#:~:text=17.%2011.%20He%20that%20has%20commanded,use%20of%20the%20cross%20in%20baptism&amp;text=17.%2011.%20He%20that%20has%20commanded%20us%20to&amp;text=to%20the%20use%20of%20the%20cross%20in%20baptism" rel="noopener" target="_blank">Read it online · Reformed Books Online</a></div>

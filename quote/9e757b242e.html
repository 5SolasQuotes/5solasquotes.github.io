<blockquote><p>2. Yet we thought not meet to put these our principles down in our agreements [amidst ministers]: but retain them as our own private thoughts: because being no fundamentals, nor near the foundation, we can agree with those that differ from us in this point of judgment, so they agree in practice…</p></blockquote>

<blockquote><p>§10.

I. The subject or matter [of a minister] is a man:

II. The necessary Disposition is:…

      3. That he be a Christian.

      4. That he have necessary abilities for the essentials of the office-work. And those are:

      1. The understanding at least of the essentials of religion and ministry.

      2. A will to perform the work of the ministry.

      3. Ability of utterance to do it, and all the necessary executive power.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/richard-baxter.html">Richard Baxter</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The True &amp; only Way of Concord of all the Christian Churches, the Desirableness of it &amp; the Detection of False Dividing Terms</cite>, (London: Hancock, 1680), pt. 2, ch. 5, ‘What are the terms necessary to the office and exercise of the sacred ministry?’, p. 204</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/the-church/church-unity-and-fundamentals.html">Church Unity and Fundamentals</a></span></div>

</figure><figure class="quote" id="q-d73260422e" data-kw="">
<blockquote><p>As for schismatics, that is, those who separate themselves from true Christian churches for some slight cause, whether in doctrine or discipline, our theologians distinguish between the authors of the schism and the people deceived by them. As for the authors of the schism, since they break the bond of charity, they acknowledge that they cannot belong to the invisible Church, whose bond and communion consist in faith, hope, and charity. But concerning the deceived people or those born in schism, they are less rigid and believe that there can be good men among them, not alien to the body of Christ but joined to it by true faith and charity; nor do they entirely exclude schismatic churches from the visible Church if they retain the foundations of doctrine and discipline, since they reserve this honor only for those who deny and overthrow the fundamentals of faith and discipline.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/louis-le-blanc.html">Louis Le Blanc</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Elucidation of the Status of Controversies about the Church Militant</cite>, bk. 5, ch. 1, ‘On the Nature and Definition of the Church’ in Theological Theses Published at Various Times in the Academy of Sedan, 3rd ed., tr. by AI by Colloquia Scholastica (1675; London, 1683), p. 1,056</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/the-church/church-unity-and-fundamentals.html">Church Unity and Fundamentals</a></span></div>
<div class="actions"><button class="copy" data-copy="“As for schismatics, that is, those who separate themselves from true Christian churches for some slight cause, whether in doctrine or discipline, our theologians distinguish between the authors of the schism and the people deceived by them. As for the authors of the schism, since they break the bond of charity, they acknowledge that they cannot belong to the invisible Church, whose bond and communion consist in faith, hope, and charity. But concerning the deceived people or those born in schism, they are less rigid and believe that there can be good men among them, not alien to the body of Christ but joined to it by true faith and charity; nor do they entirely exclude schismatic churches from the visible Church if they retain the foundations of doctrine and discipline, since they reserve this honor only for those who deny and overthrow the fundamentals of faith and discipline.”

is%2C%20those,the%20fundamentals%20of%20faith%20and%20discipline&amp;text=As%20for%20schismatics%2C%20that%20is%2C%20those%20who%20separate&amp;text=and%20overthrow%20the%20fundamentals%20of%20faith%20and%20discipline" rel="noopener" target="_blank">Read it online · Reformed Books Online</a></div>
</figure><figure class="quote" id="q-62825d4144" data-kw="">
<blockquote><p>11th Objection: This Chuch [of Scotland] is erroneous in her doctrine, therefore ’tis sinful to keep communion with her. This is a heavy charge indeed; and, if it was true that her declared or professed doctrine is corrupt in fundamental points and we required to approve thereof, I should think it sufficient ground of separation:</p></blockquote>

</figure><figure class="quote" id="q-0a96c0c470" data-kw="">
<blockquote><p>the scribes and Pharisees, which were the doctors of that Church, erred in some fundamental points of doctrine, teaching justification by works: and withal they greatly corrupted the law of God, both by their doctrine and traditions… yet for all this, Christ did not separate from that Church, neither taught his disciples so to do, but was present at their sacrifices and assemblies, and kept his Passover with them: and so did his apostles, till they saw them of obstinacy and maliciousness refuse the grace of God, offered unto them in the ministry of the Gospel. Now their example must teach us that so long as our Church holds Christ, we must esteem it to be the Church of God, and not for some wants thereof depart from it.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/william-perkins.html">William Perkins</a></span><span class="wk"><span class="lbl">Work:</span> <cite>A Godly &amp; Learned Exposition of Christ’s Sermon in the Mount</cite>, (d. 1602; Cambridge: Brooke, 1608), on Mt. 5:29–30, p. 136 On Perkins, see also William Thomas below.</span></figcaption>

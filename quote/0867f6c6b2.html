<main class="wrap"><figure class="quote" id="q-0867f6c6b2" data-kw="">
<blockquote><p>…putting his own holiness and obedience in the room of Christ’s imputed obedience… But that the excluding of our holiness, good-works, and keeping of the commandments, from any part in this matter, militates nothing against the absolute necessity of holiness in its proper place, (without which, in men’s own persons, no man shall see the Lord) is a point too clear among sound Protestant divines, to be here insisted upon.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/thomas-boston.html">Thomas Boston</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Marrow of Modern Divinity</cite>, In The Marrow of Modern Divinity… with Notes by Rev. Thomas Boston (Philadelphia: Presbyterian Board of Publications, n.d.), p. 165</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/good-works/necessity-of-good-works.html">Necessity of Good Works</a></span></div>

</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-ea26cac1d4" data-kw="">
<blockquote><p>Neither does the renewed confidence of perseverance produce immorality or lack of concern for godliness in those put back on their feet after a fall, but it produces a much greater concern to observe carefully the ways which the Lord prepared in advance. They observe these ways in order that by walking in them they may maintain the assurance of their perseverance, lest, by their abuse of God’s fatherly goodness, the face of the gracious God (for the godly, looking upon that face is sweeter than life, but its withdrawal is bitterer than death) turn away from them again, with the result that they fall into greater anguish of spirit.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/synod-of-dort.html">Synod of Dort</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Canons of Dort</cite>, Head 5, Art. 13</span></figcaption>

<div class="actions"><button class="copy" data-copy="“Neither does the renewed confidence of perseverance produce immorality or lack of concern for godliness in those put back on their feet after a fall, but it produces a much greater concern to observe carefully the ways which the Lord prepared in advance. They observe these ways in order that by walking in them they may maintain the assurance of their perseverance, lest, by their abuse of God’s fatherly goodness, the face of the gracious God (for the godly, looking upon that face is sweeter than life, but its withdrawal is bitterer than death) turn away from them again, with the result that they fall into greater anguish of spirit.”

</figure><figure class="quote" id="q-de53499081" data-kw="">
<blockquote><p>In this, however, there is nothing to prevent the Lord from embracing works as inferior causes. But how so? In this way: Those whom in mercy he has destined for the inheritance of eternal life, he, in his ordinary administration, introduces to the possession of it by means of good works. What precedes in the order of administration is called the cause of what follows. For this reason, he sometimes makes eternal life a consequent of works; not because it is to be ascribed to them, but because those whom he has elected he justifies, that he may at length glorify (Rom. 8:30).</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/john-calvin.html">John Calvin</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Institutes of the Christian Religion</cite>, 3.14.21</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/justification/justification-and-good-works.html">Justification and Good Works</a> › <a href="../topics/justification/justification-and-good-works/good-works-fruit-not-ground.html">Good works: fruit, not ground</a></span><span class="t"><a href="../topics/good-works/necessity-of-good-works.html">Necessity of Good Works</a> › <a href="../topics/good-works/necessity-of-good-works/not-for-justification.html">Not for justification</a></span></div>

</figure><figure class="quote" id="q-b3d711adc6" data-kw="">
<blockquote><p>By setting aside the contrary supposition, he proves his statement, that by grace we are saved, — that we have no remaining works by which we can merit salvation; for all the good works which we possess are the fruit of regeneration. Hence it follows, that works themselves are a part of grace.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/john-calvin.html">John Calvin</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Commentary on Galatians and Ephesians</cite>, Ephesians 2:10</span></figcaption>

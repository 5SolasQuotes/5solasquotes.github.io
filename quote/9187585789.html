<main class="wrap"><figure class="quote" id="q-9187585789" data-kw="">
<blockquote><p>Things less than fully good, or impure, not inherently wrong, may in some circumstances, especially according to the degree of necessity, be personally, materially done, even in worship, public worship and Church government (though they occasion passive scandal in some), for the good in the things themselves and for attaining higher and weightier goods (in proportion to that degree), while seeking to avoid the greater hurt and scandal, without approving the impurities or what may be deficient in them.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/travis-fentiman.html">Travis Fentiman</a></span><span class="wk"><span class="lbl">Work:</span> <cite>“Editor’s Extended Introduction” in English Puritans, A Refutation of the Errors of Separatists</cite>, 2. “Principled Partial Conformity in Worship” in “Editor’s Extended Introduction” in English Puritans, A Refutation of the Errors of Separatists (1604; RBO, 2025), pp. 21-93, p. 48</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/worship/impurities-in-worship.html">Impurities in Worship</a></span></div>
<div class="actions"><button class="copy" data-copy="“Things less than fully good, or impure, not inherently wrong, may in some circumstances, especially according to the degree of necessity, be personally, materially done, even in worship, public worship and Church government (though they occasion passive scandal in some), for the good in the things themselves and for attaining higher and weightier goods (in proportion to that degree), while seeking to avoid the greater hurt and scandal, without approving the impurities or what may be deficient in them.”

— Travis Fentiman, 2. “Principled Partial Conformity in Worship” in “Editor’s Extended Introduction” in English Puritans, A Refutation of the Errors of Separatists (1604; RBO, 2025), pp. 21-93, p. 48">Copy</button><a class="share" href="https://x.com/intent/post?text=%E2%80%9CThings+less+than+fully+good%2C+or+impure%2C+not+inherently+wrong%2C+may+in+some+circumstances%2C+especially+according+to+the+degree+of+necessity%2C+be+personally%2C+materially+done%2C+even+in+worship%2C+public+worship+and+Church+government+%28though+they+occasion+passive+scandal+in+some%29%2C+for+the+good+in+the+things+themselves+and+for+attaining+higher+and+weightier+goods+%28in+proportion+to+that+degree%29%2C+while+seeking+to+avoid+the+greater+hurt+and+scandal%2C+without+approving+the+impurities+or+what+may+be+deficient+in+them.%E2%80%9D%0A%0A%E2%80%94+Travis+Fentiman%2C+2.+%E2%80%9CPrincipled+Partial+Conformity+in+Worship%E2%80%9D+in+%E2%80%9CEditor%E2%80%99s+Extended+Introduction%E2%80%9D+in+English+Puritans%2C+A+Refutation+of+the+Errors+of+Separatists+%281604%3B+RBO%2C+2025%29%2C+pp.+21-93%2C+p.+48&amp;url=https%3A%2F%2F5solasquotes.github.io%2Fquote%2F9187585789.html&amp;via=5Solas" target="_blank" rel="noopener">Share on X</a><a class="perma" href="../quote/9187585789.html">Permalink</a><a class="src" href="https://reformedbooksonline.com/on-impurities-in-worship/#:~:text=Things%20less%20than%20fully%20good%2C%20or,what%20may%20be%20deficient%20in%20them&amp;text=Things%20less%20than%20fully%20good%2C%20or%20impure%2C%20not&amp;text=impurities%20or%20what%20may%20be%20deficient%20in%20them" rel="noopener" target="_blank">Read it online · Reformed Books Online</a></div>
</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-e6b9a9fb6c" data-kw="">
<blockquote><p>The mockery which worships God with nought but external gestures and absurd human fictions, how could we, without sin, allow to pass unrebuked? We know how much He hates hypocrisy, and yet in that fictitious worship, which was everywhere in use, hypocrisy reigned. We hear how bitter the terms in which the Prophets inveigh against all worship fabricated by human rashness. But a good intention, i.e. an insane licence of daring whatever man pleased, was deemed the perfection of worship. For it is certain that in the whole body of worship which had been estabhshed, there was scarcely a single observance which had an authoritative sanction from the Word of God. We are not in this matter to stand either by our own or by other men’s judgments. We must listen to the voice of God, and hear in what estimation He holds that profanation of worship which is displayed when men, overleaping the boundaries of His Word, run riot in their own inventions. The reasons which he assigns for punishing the Israelites with blindness, after they had lost the pious and holy discipline of the Church, are two, viz., the prevalence of hypocrisy, and will-worship (ethelothreskeian), meaning thereby a form of worship contrived by man.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/john-calvin.html">John Calvin</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Necessity of Reforming the Church</cite>, (1544) in Tracts &amp; Letters relating to the Reformation, tr. &amp; ed. Henry Beveridge, 7 vols. (Edinburgh: Calvin Translation Society, 1844), 1.189</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/worship/impurities-in-worship.html">Impurities in Worship</a></span></div>
<div class="actions"><button class="copy" data-copy="“The mockery which worships God with nought but external gestures and absurd human fictions, how could we, without sin, allow to pass unrebuked? We know how much He hates hypocrisy, and yet in that fictitious worship, which was everywhere in use, hypocrisy reigned. We hear how bitter the terms in which the Prophets inveigh against all worship fabricated by human rashness. But a good intention, i.e. an insane licence of daring whatever man pleased, was deemed the perfection of worship. For it is certain that in the whole body of worship which had been estabhshed, there was scarcely a single observance which had an authoritative sanction from the Word of God. We are not in this matter to stand either by our own or by other men’s judgments. We must listen to the voice of God, and hear in what estimation He holds that profanation of worship which is displayed when men, overleaping the boundaries of His Word, run riot in their own inventions. The reasons which he assigns for punishing the Israelites with blindness, after they had lost the pious and holy discipline of the Church, are two, viz., the prevalence of hypocrisy, and will-worship (ethelothreskeian), meaning thereby a form of worship contrived by man.”

</figure><figure class="quote" id="q-14d289a024" data-kw="">
<blockquote><p>But know that the leaven of the external worship (except it evert the foundation) does not make the Church a falsely constituted Church.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/samuel-rutherford.html">Samuel Rutherford</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Due Right of Presbyteries, ‘Acts 15, A Pattern of a Juridicial Synod’</cite>, … (1644) | pt. 1, ch. 9, sect. 9, p. 265</span></figcaption>

</figure><figure class="quote" id="q-06015b364f" data-kw="">
<blockquote><p>The Church may be corrupted many ways, in doctrine, ordinances, worship, etc. And there are degrees of this corruption; the doctrine in some remote points, the worship in some rituals of man’s invention or custom. How many Churches do we find thus corrupted, and yet no separation of Christ from the Jewish Church, nor any commandment to the godly of Corinth, etc. to separate. I must in such a case avoid the corruption, hold the communion—But if corruptions invade the fundamentals, the foundation of doctrine is destroyed, the worship is become idolatrous; and what is above all, if the Church impose such laws of her communion as there is a necessity of doing or approving things unlawful, in that case, ‘Come out of Babylon.’ The Churches of Protestants so separated from Rome.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/richard-vines.html">Richard Vines</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Other citations (work not named)</cite>, On the Sacrament, p. 239 as quoted in A Collection of Cases &amp; other Discourses lately written to recover Dissenters to the communion of the Church of England by some Divines of the City of London (London, 1685), vol. 1, ‘The Non-Conformists Plea for Lay-Communion with the Church of England’, p. 21</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/the-church/schism-and-separation.html">Schism and Separation</a></span><span class="t"><a href="../topics/worship/impurities-in-worship.html">Impurities in Worship</a></span></div>

rch%20may%20be%20corrupted%20many%20ways%2C%20in&amp;text=The%20Churches%20of%20Protestants%20so%20separated%20from%20Rome" rel="noopener" target="_blank">Read it online · Reformed Books Online</a></div>
</figure><figure class="quote" id="q-2c61c9312a" data-kw="">
<blockquote><p>Another argument there is taken from them, that ‘they sought the Lord, etc.’ Which seeking of theirs is set out by the manner of it, that they prepared their whole heart to seek Him: Not as if their hearts were so free from sin, or so full of grace as they should have been; but that they were true and plain, and sincere: Not such as had no sin, for it is said, ‘they were not cleansed according to the purification of the sanctuary,’ but that did love no sin: Not such hearts as wanted no grace, or preparation for God’s ordinance: But such as were humbled for the want of grace and of that preparation that they should have made… For it is said, ‘He healed the people,’ that is, gave them that which God does offer unto his people in the sacrament: They received the seal of the Covenant, and He made good the Covenant unto them…</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/john-dod.html">John Dod</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Ten Sermons, Tending Chiefly to the Fitting of Men for the Worthy Receiving of the Lord’s Supper</cite>, (1634), The Fourth Sermon of the Lord’s Supper, on 2 Chron. 30:18-20, p. 112</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/worship/impurities-in-worship.html">Impurities in Worship</a></span></div>

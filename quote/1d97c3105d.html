<main class="wrap"><figure class="quote" id="q-1d97c3105d" data-kw="">
<blockquote><p>[An exception is] a dissent from, an objection to, or a mental reservation about any assertion contained in the [Westminster] Confession of Faith and Catechisms and is to be distinguished from an inconsequential objection to a proposition or from a quibble or from a reservation about terminology. However, such a distinction is to be made only by the judicatory, never by the individual. No officer or licentiate shall presume to have the right of making self-evaluation regarding this distinction. An exception to the confessional standards may be granted by a judicatory, for the sake of conscience, only if 1) it affects a peripheral and minor assertion in the standards, not a central and fundamental one, 2) it does not vacate the central teaching of any chapter in the Confession or overturn a complete answer to any question in the Catechisms, and 3) it does not undermine the system of truth in the Confession and Catechisms as a whole.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/orthodox-presbyterian-church.html">Orthodox Presbyterian Church</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Orthodox Presbyterian Church</cite>, 60th General Assembly, 1993</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/the-church/creeds-confessions-and-councils.html">Creeds, Confessions and Councils</a></span></div>

</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-d4f17aad69" data-kw="">
<blockquote><p>…these questions were proponed to him that was to be elected. … Question. ‘Believe ye not, that the doctrine of the prophets and apostles, contained in the books of the New and Old Testament, is the only true and most absolute foundation of the universal church of Christ Jesus, in so much, that in the same Scripture are contained all things necessary to be believed for the salvation of mankind?’ Answer. ‘I verily believe the same; and do abhor and utterly refuse all doctrine alleged necessary to salvation, that is not expressedly contained in the same.’ Question. ‘Is not Christ Jesus, man of man according to the flesh, to wit, the son of David, the seed of Abraham, conceived of the Holy Ghost, born of the Virgin Mary his mother, the only Head and Mediator of his church?’ Answer. ‘He is, and without him there is neither salvation to man, nor life to angel.’ Question. ‘Is not the same Lord Jesus the only true God, the eternal Son of the eternal Father, in whom all that shall be saved were elected before the foundation of the world was laid?’ Answer. ‘I acknowledge and confess Him in the unity of his Godhead to be God above all things, blessed forever.’ Question. ‘Shall not they whom God, in his eternal counsel, has elected, be called to the knowledge of his Son, our Lord Jesus; and shall not they who of purpose are called, in this life, be justified; and where justification and free remission of sins is obtained in this life by free grace, shall not the glory of the Son of God follow in the general resurrection, when the Son of God shall appear in his glorious majesty?’ Answer. ‘This I acknowledge to be the doctrine of the apostles, and the most singular comfort of God’s children.’ Question. ‘Will ye not then contain yourself in all doctrine within the bounds of this foundation? Will ye not study to promove the same, as welll by your life as by your doctrine? Will ye not, according to the graces and utterance that God shall grant unto you, profess, instruct, and maintain the purity of the doctrine contained in the sacred Word of God; and to the uttermost of your power will ye not gainstand, and convince the gainsayers, and the teachers of men’s inventions?’ Answer. ‘That do I promise in the presence of God, and of his congregation, here assembled.&#x27;</p></blockquote>

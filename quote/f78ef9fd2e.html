<main class="wrap"><figure class="quote" id="q-f78ef9fd2e" data-kw="">
<blockquote><p>A spiritual prayer is accompanied with the use of means… When Hezekiah was sick, he did not only pray for recovery, but he laid a lump of figs to the boil, Isa. 38:21. Thus it is in case of the soul, when we pray against sin, and avoid temptations; when we pray for grace, and improve opportunities, this is the laying a fig to the boil, which will make us recover: To pray for holiness, and neglect the means, is like winding up the clock, and pulling off the weights.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/thomas-watson.html">Thomas Watson</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Godly Man’s Picture Drawn with a Scripture Pencil</cite>, (London, 1666), p. 125</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/civil-government-and-society/plague-quarantine-and-public-health.html">Plague, Quarantine and Public Health</a></span></div>

</figure><figure class="quote" id="q-0f3186eb5d" data-kw="">
<blockquote><p>If any man before the time prescribed shall go out of his house without license and thrust himself into the company of others, he shall be bound to begin afresh the time of shutting in and be punished beside[s] with an arbitrary [appointed] punishment. But if the same part being infected before and yet scarce well recovered, or but meetly recovered, shall adventure to do the like, he is to be accused of great unthankfulness and to be deprived of all benefits usual to be done unto him, and besides [this] to be restrained with [a] longer keeping in. But if being now in very deed infected with the plague, he shall be found to have committed this heinous offence upon notorious and wicked boldness, as a murderer after the loss of his goods [being set to die and having nothing further to lose], if he be without children, let him be delivered over unto the hangman.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/johann-von-ewich.html">Johann von Ewich</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Duty of a Faithful and Wise Magistrate in Preserving and Delivering of the Commonwealth from Infection in the Time of the Plague or Pestilence, Two Books</cite>, (London, 1583)</span></figcaption>

r%20unto%20the%20hangman" rel="noopener" target="_blank">Read it online · Reformed Books Online</a></div>
</figure><figure class="quote" id="q-aca0dbf1a1" data-kw="">
<blockquote><p>Besides these three causes of unsatisfiableness, God Himself doth justly put that property and poison into all worldly things doted upon, and desired immoderately, that they shall plague the heart that pursues them; by filling it still with a furious and fresh supply of more greediness, longings, jealousies, and many miserable discontentments: So that they become unto it, as drink unto a drunkard, a man in a hydropicus, dropsy, or burning fever, serve only to inflame it with new heat, and fiery additions of insatiable thirst and inordinate lust.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/robert-bolton.html">Robert Bolton</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Some General Directions for a Comfortable Walking with God</cite>, … (London, 1626) 1625 was a plague year., pp. 226-27</span></figcaption>

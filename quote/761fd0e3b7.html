<blockquote><p>IV. Problem: Whether in all or in some to be converted there are preparatory dispositions which concur by some causality of their own to regeneration? Response: The Pelagianizers say affirmatively. See Cornelius à Lapide on Acts 10:2. Of the orthodox, some seem to concede something similar, but in a far different manner and scope. We say absolutely negatively, as we gather above from the explanation of the terminus a quo, and further from these reasons and distinctions: 1. Because man is destitute of all faculty, habit, disposition, and spiritual act, being indeed natural, not fit, dead, etc., 1 Corinthians 2:14; and 2 Corinthians 3 [3:5]; Ephesians 2 [2:1-5]; Colossians 2 [2:13]; John 14:18–19 [This should be 15:5]; sin reigns in him, Romans 6:12–14. 2. Because these absurdities would follow: that there is an intermediate state between regenerate and unregenerate; that man in the first moment conducts himself actively; that always the better are regenerated, that is, those making better use of natural gifts and aids and other ecclesiastical aids, and thus finally merit de congruo [of congruity]; that restraining or coercing grace is salvific and of itself ordained to salvation, indeed has an infallible connection with it—which is the same as if it were regenerating and converting grace, and consequently the unregenerate would be regenerate. 3. Because, briefly, from this discourse the truth of our assertion is evident, and at the same time the sources of solutions are indicated, by which objections can be met and very many things in the Practical writers can be explained and reconciled. That man who is said to be disposed before regeneration either is regenerate in infancy only, without any actual conversion; or moreover from infancy was educated in faith and repentance and thus gradually actually converted; or has persisted without any regeneration and actual conversion up to the point of his regeneration in advanced or at least adult age. If the first or second is posited, we already have one regenerate or first converted, and consequently whatever good he does is not a cause and preparation for first regeneration, but its effect. But if the third is posited, I now ask whether those acts and dispositions have an infallible connection with salvation or not. If the former is said: I now reply that they are acts and effects of salvific grace and of the regenerating Spirit—for example, grief for sins, salvific despair, desire for grace, salvific desire for the Word and its hearing, sighs, groans, aspirations, searchings for means, etc., Mt. 5:3–4, 6; Ps. 51:17 and 119:40, 67, compared with 2 Cor. 7:9–10; Acts 2:37; and 9:6, 9 (with 22:16); and 16:29–30. I say they are effects of the Spirit for a twofold reason: First, because He gave and impressed the new creature, from which as from a principle those acts are elicited. Then, by second grace He moved and excited the man now regenerate to those homogeneous acts. Therefore all those motions are effects and acts of regeneration, and thus pertain to its second moment or to the practice of repentance. But we here inquire concerning regeneration itself properly and strictly so called, which is the action of God alone, or concerning the first moment of conversion: namely, whether dispositions precede it. But that those motions of first actual conversion and repentance are called by some practical writers preparatory, initial, preliminary, by this very fact it is not denied that they are from special grace of the regenerating Spirit. As in natural things both preparatory dispositions and the introduced form itself are from the one generating. Then they are not called such as compared with the first moment of regeneration and its proper and formal terminus, namely, the new dispositions or habits then infused and impressed; but as compared with the second acts in the second moment of conversion. Third, indeed they are not even called dispositive in relation to all second acts or to the whole conversion in the second act (for nothing can simultaneously be cause and effect in the same respect); but they are specifically called such in relation to the direct act of faith by which Christ is apprehended and applied; indeed most specifically in relation to the reflexive act of faith, by which one evidently concludes and perceives that he is in a state of grace. Fourth, every preceding act in the whole practice of conversion is by its nature ordained to the following act as something preparatory, or as an elicited aid. Indeed, of each disposition or habit—for example, of repentance, hope, faith, etc.—the preceding, initial, incomplete, or unformed act (if one may so speak) prepares and disposes for a homogeneous following, complete, formed act. And thus the practice and theology of the practical writers is best reconciled with the dogmatics. But if the latter is said, I now reply that common restraining grace through natural aids is no more a preparatory disposition inhering in the man to be converted than genius, memory, or hearing granted to man. For nature in man is not grace, nor preparation for grace. External occasions presented, such as miracles, judgments of God, the setting forth of the Word, of themselves place no disposition or aptitude in man. V. Problem: Whether restraining grace through common ecclesiastical aids, if not in itself, at least with respect to the divine intention, is a disposition to regeneration? Response: Negative. It can be a simple antecedent occasion, and a cause (which they call) sine qua non [without which not], and that from the special intention of God; but that one thing is ordained to another as cause to effect, as active potency productive of regeneration, or as passive potency or disposition habilitating the subject to receive its impression, must by no means be conceded, Jn. 3:5–6; and 6:44–45; 14:17; 2 Cor. 3:5; Eph. 2:12–13. And it would follow that human nature, for example in David or Peter, or the rational intellect, could be called a preparatory disposition of their regeneration: because God, when He intended to create it as author of nature, at the same time intended to produce in that nature regeneration as author of grace. Nowhere has God revealed that grace is from and of nature as from a cause, and that He as author of nature is the author of grace, and that the terminus or formal effect of both operations is the same, or that the latter depends on the former as on a cause. VI. Problem: Whether the Word of God is heard savingly before conversion? Response: Negative, from Rom. 14 [v. 23]; Heb. 4:1–2; and 11:2, 6; Titus 1:15. Compare Catechism Question 8, and the particular Disputation of Dr. Maccovius on this question in his Collection of Disputations, pt. 4, Disputation 1, and in his Miscellaneous Disputations, vol. 2; and Vedelius in his treatise On the God of the Synagogue, pp. 40–41; and Stechman’s Photinianism, Disputation 28, Question 2. Ames seems to have dissented here, whom compare in his Cases, especially in the disputation appended at the end to his Rescription against Grevinckhovius, 12mo edition, pp. 49, 66. But it is objected: Objection 1. Therefore the Word is not to be heard by the unregenerate. Response: Negative. It is to be heard, and indeed duly. But if they omit that condition and manner, they do wrong. Furthermore, the Word is per se [in itself] good, as also the hearing of the Word; if per accidens [accidentally] it becomes evil to men by their own fault, they ought not hence to deliberate about omitting that which is per se good and commanded by God, but rather about omitting their own evil, by which per accidens that good is polluted and rendered evil to them. See that distinction of per se and per accidens inculcated, if not ἀντιλεκτικῶς [antilektikōs, contradistinctively], at least ἰσοδυναμούντως [isodynamountōs, equivalently], in Rom. 7:10–13. A similar objection could be raised concerning unbelievers, namely, Gentiles, Jews, etc., that they should not be stimulated and guided by our precepts, admonitions, and examples to ethical, economic, and political virtues, because their virtues are splendid sins, as Augustine speaks. Indeed, concerning the regenerate and faithful themselves, someone could thus argue sophistically that they should not be stimulated to good works: that no good works should be done because per accidens they are polluted by sins of the indwelling flesh, according to our Catechism, Question 62. Objection 2. Therefore the Word is not to be preached to them, because we do not know whether and who will hear it savingly and who will turn it to their own evil. Response: Negatively, from 2 Tim. 2:25–26 with 1 Cor. 3:6–7. Something similar Tilenus objected in a sacrilegious and satirical booklet published in French against the orthodox doctrine concerning grace, which we refuted in the vernacular language. This objection presupposes this false hypothesis: that the Gospel is to be preached by us to no one unless by the judgment of faith we are certain of the following conversion and salvific hearing. To the contrary, see the texts just cited, and Eze. 2; Ex. 7.</p></blockquote>

explained+and+reconciled.+That+man+who+is+said+to+be+disposed+before+regeneration+either+is+regenerate+in+infancy+only%2C+without+any+actual+conversion%3B+or+moreover+from+infancy+was+educated+in+faith+and+repentance+and+thus+gradually+actually+converted%3B+or+has+persisted+without+any+regeneration+and+actual+conversion+up+to+the+point+of+his+regeneration+in+advanced+or+at+least+adult+age.+If+the+first+or+second+is+posited%2C+we+already+have+one+regenerate+or+first+converted%2C+and+consequently+whatever+good+he+does+is+not+a+cause+and+preparation+for+first+regeneration%2C+but+its+effect.+But+if+the+third+is+posited%2C+I+now+ask+whether+those+acts+and+dispositions+have+an+infallible+connection+with+salvation+or+not.+If+the+former+is+said%3A+I+now+reply+that+they+are+acts+and+effects+of+salvific+grace+and+of+the+regenerating+Spirit%E2%80%94for+example%2C+grief+for+sins%2C+salvific+despair%2C+desire+for+grace%2C+salvific+desire+for+the+Word+and+its+hearing%2C+sighs%2C+groans%2C+aspirations%2C+searchings+for+means%2C+etc.%2C+Mt.+5%3A3%E2%80%934%2C+6%3B+Ps.+51%3A17+and+119%3A40%2C+67%2C+compared+with+2+Cor.+7%3A9%E2%80%9310%3B+Acts+2%3A37%3B+and+9%3A6%2C+9+%28with+22%3A16%29%3B+and+16%3A29%E2%80%9330.+I+say+they+are+effects+of+the+Spirit+for+a+twofold+reason%3A+First%2C+because+He+gave+and+impressed+the+new+creature%2C+from+which+as+from+a+principle+those+acts+are+elicited.+Then%2C+by+second+grace+He+moved+and+excited+the+man+now+regenerate+to+those+homogeneous+acts.+Therefore+all+those+motions+are+effects+and+acts+of+regeneration%2C+and+thus+pertain+to+its+second+moment+or+to+the+practice+of+repentance.+But+we+here+inquire+concerning+regeneration+itself+properly+and+strictly+so+called%2C+which+is+the+action+of+God+alone%2C+or+concerning+the+first+moment+of+conversion%3A+namely%2C+whether+dispositions+precede+it.+But+that+those+motions+of+first+actual+conversion+and+repentance+are+called+by+some+practical+writers+preparatory%2C+initial%2C+preliminary%2C+by+this+very+fact+it+is+not+denied+that+they+are+from+special+grace+of+the+regenerating+Spirit.+As+in+natural+things+both+preparatory+dispositions+and+the+introduced+form+itself+are+from+the+one+generating.+Then+they+are+not+called+such+as+compared+with+the+first+moment+of+regeneration+and+its+proper+and+formal+terminus%2C+namely%2C+the+new+dispositions+or+habits+then+infused+and+impressed%3B+but+as+compared+with+the+second+acts+in+the+second+moment+of+conversion.+Third%2C+indeed+they+are+not+even+called+dispositive+in+relation+to+all+second+acts+or+to+the+whole+conversion+in+the+second+act+%28for+nothing+can+simultaneously+be+cause+and+effect+in+the+same+respect%29%3B+but+they+are+specifically+called+such+in+relation+to+the+direct+act+of+faith+by+which+Christ+is+apprehended+and+applied%3B+indeed+most+specifically+in+relation+to+the+reflexive+act+of+faith%2C+by+which+one+evidently+concludes+and+perceives+that+he+is+in+a+state+of+grace.+Fourth%2C+every+preceding+act+in+the+whole+practice+of+conversion+is+by+its+nature+ordained+to+the+following+act+as+something+preparatory%2C+or+as+an+elicited+aid.+Indeed%2C+of+each+disposition+or+habit%E2%80%94for+example%2C+of+repentance%2C+hope%2C+faith%2C+etc.%E2%80%94the+preceding%2C+initial%2C+incomplete%2C+or+unformed+act+%28if+one+may+so+speak%29+prepares+and+disposes+for+a+homogeneous+following%2C+complete%2C+formed+act.+And+thus+the+practice+and+theology+of+the+practical+writers+is+best+reconciled+with+the+dogmatics.+But+if+the+latter+is+said%2C+I+now+reply+that+common+restraining+grace+through+natural+aids+is+no+more+a+preparatory+disposition+inhering+in+the+man+to+be+converted+than+genius%2C+memory%2C+or+hearing+granted+to+man.+For+nature+in+man+is+not+grace%2C+nor+preparation+for+grace.+External+occasions+presented%2C+such+as+miracles%2C+judgments+of+God%2C+the+setting+forth+of+the+Word%2C+of+themselves+place+no+disposition+or+aptitude+in+man.+V.+Problem%3A+Whether+restraining+grace+through+common+ecclesiastical+aids%2C+if+not+in+itself%2C+at+least+with+respect+to+the+divine+intention%2C+is+a+disposition+to+regeneration%3F+Response%3A+Negative.+It+can+be+a+simple+antecedent+occasion%2C+and+a+cause+%28which+they+call%29+sine+qua+non+%5Bwithout+which+not%5D%2C+and+that+from+the+special+intention+of+God%3B+but+that+one+thing+is+ordained+to+another+as+cause+to+effect%2C+as+active+potency+productive+of+regeneration%2C+or+as+passive+potency+or+disposition+habilitating+the+subject+to+receive+its+impression%2C+must+by+no+means+be+conceded%2C+Jn.+3%3A5%E2%80%936%3B+and+6%3A44%E2%80%9345%3B+14%3A17%3B+2+Cor.+3%3A5%3B+Eph.+2%3A12%E2%80%9313.+And+it+would+follow+that+human+nature%2C+for+example+in+David+or+Peter%2C+or+the+rational+intellect%2C+could+be+called+a+preparatory+disposition+of+their+regeneration%3A+because+God%2C+when+He+intended+to+create+it+as+author+of+nature%2C+at+the+same+time+intended+to+produce+in+that+nature+regeneration+as+author+of+grace.+Nowhere+has+God+revealed+that+grace+is+from+and+of+nature+as+from+a+cause%2C+and+that+He+as+author+of+nature+is+the+author+of+grace%2C+and+that+the+terminus+or+formal+effect+of+both+operations+is+the+same%2C+or+that+the+latter+depends+on+the+former+as+on+a+cause.+VI.+Problem%3A+Whether+the+Word+of+God+is+heard+savingly+before+conversion%3F+Response%3A+Negative%2C+from+Rom.+14+%5Bv.+23%5D%3B+Heb.+4%3A1%E2%80%932%3B+and+11%3A2%2C+6%3B+Titus+1%3A15.+Compare+Catechism+Question+8%2C+and+the+particular+Disputation+of+Dr.+Maccovius+on+this+question+in+his+Collection+of+Disputations%2C+pt.+4%2C+Disputation+1%2C+and+in+his+Miscellaneous+Disputations%2C+vol.+2%3B+and+Vedelius+in+his+treatise+On+the+God+of+the+Synagogue%2C+pp.+40%E2%80%9341%3B+and+Stechman%E2%80%99s+Photinianism%2C+Disputation+28%2C+Question+2.+Ames+seems+to+have+dissented+here%2C+whom+compare+in+his+Cases%2C+especially+in+the+disputation+appended+at+the+end+to+his+Rescription+against+Grevinckhovius%2C+12mo+edition%2C+pp.+49%2C+66.+But+it+is+objected%3A+Objection+1.+Therefore+the+Word+is+not+to+be+heard+by+the+unregenerate.+Response%3A+Negative.+It+is+to+be+heard%2C+and+indeed+duly.+But+if+they+omit+that+condition+and+manner%2C+they+do+wrong.+Furthermore%2C+the+Word+is+per+se+%5Bin+itself%5D+good%2C+as+also+the+hearing+of+the+Word%3B+if+per+accidens+%5Baccidentally%5D+it+becomes+evil+to+men+by+their+own+fault%2C+they+ought+not+hence+to+deliberate+about+omitting+that+which+is+per+se+good+and+commanded+by+God%2C+but+rather+about+omitting+their+own+evil%2C+by+which+per+accidens+that+good+is+polluted+and+rendered+evil+to+them.+See+that+distinction+of+per+se+and+per+accidens+inculcated%2C+if+not+%E1%BC%80%CE%BD%CF%84%CE%B9%CE%BB%CE%B5%CE%BA%CF%84%CE%B9%CE%BA%E1%BF%B6%CF%82+%5Bantilektik%C5%8Ds%2C+contradistinctively%5D%2C+at+least+%E1%BC%B0%CF%83%CE%BF%CE%B4%CF%85%CE%BD%CE%B1%CE%BC%CE%BF%CF%8D%CE%BD%CF%84%CF%89%CF%82+%5Bisodynamount%C5%8Ds%2C+equivalently%5D%2C+in+Rom.+7%3A10%E2%80%9313.+A+similar+objection+could+be+raised+concerning+unbelievers%2C+namely%2C+Gentiles%2C+Jews%2C+etc.%2C+that+they+should+not+be+stimulated+and+guided+by+our+precepts%2C+admonitions%2C+and+examples+to+ethical%2C+economic%2C+and+political+virtues%2C+because+their+virtues+are+splendid+sins%2C+as+Augustine+speaks.+Indeed%2C+concerning+the+regenerate+and+faithful+themselves%2C+someone+could+thus+argue+sophistically+that+they+should+not+be+stimulated+to+good+works%3A+that+no+good+works+should+be+done+because+per+accidens+they+are+polluted+by+sins+of+the+indwelling+flesh%2C+according+to+our+Catechism%2C+Question+62.+Objection+2.+Therefore+the+Word+is+not+to+be+preached+to+them%2C+because+we+do+not+know+whether+and+who+will+hear+it+savingly+and+who+will+turn+it+to+their+own+evil.+Response%3A+Negatively%2C+from+2+Tim.+2%3A25%E2%80%9326+with+1+Cor.+3%3A6%E2%80%937.+Something+similar+Tilenus+objected+in+a+sacrilegious+and+satirical+booklet+published+in+French+against+the+orthodox+doctrine+concerning+grace%2C+which+we+refuted+in+the+vernacular+language.+This+objection+presupposes+this+false+hypothesis%3A+that+the+Gospel+is+to+be+preached+by+us+to+no+one+unless+by+the+judgment+of+faith+we+are+certain+of+the+following+conversion+and+salvific+hearing.+To+the+contrary%2C+see+the+texts+just+cited%2C+and+Eze.+2%3B+Ex.+7.%E2%80%9D%0A%0A%E2%80%94+Gisbertus+Voetius%2C+Disputation+29%2C+%E2%80%98On+Regeneration%E2%80%99%2C+pt.+1+%281639%29+tr.+AI+by+Roman+Prestarri+in+Select+Theological+Disputations+%281655%29%2C+vol.+2%2C+pp.+432-65+Latin+at+Confessionally+Reformed+Theology&amp;url=https%3A%2F%2F5solasquotes.github.io%2Fquote%2F761fd0e3b7.html&amp;via=5Solas" target="_blank" rel="noopener">Share on X</a><a class="perma" href="../quote/761fd0e3b7.html">Permalink</a><a class="src" href="https://reformedbooksonline.com/on-preparation-unto-salvation/#:~:text=IV.%20Problem%3A%20Whether%20in%20all%20or,cited%2C%20and%20Eze.%202%3B%20Ex.%207&amp;text=IV.%20Problem%3A%20Whether%20in%20all%20or%20in%20some&amp;text=texts%20just%20cited%2C%20and%20Eze.%202%3B%20Ex.%207" rel="noopener" target="_blank">Read it online · Reformed Books Online</a></div>

<blockquote><p>…the acknowledging of sins does not of itself obtain grace or forgiveness of sins, even as the bare acknowledging of a disease is not the remedy for the same: for even damned men also do acknowledge their sins, and yet are not therefore healed. The acknowledging of sin is a certain preparative unto faith, as the acknowledging of a disease does minister occasion to think upon a remedy. To this at this present we add that not the very fear of God, how sincere soever it be, not the very sorrow conceived for our sins, how great soever it be, nor the very humiliation, how submiss soever it be, do of themselves make us acceptable to God: but rather that they prepare an entrance and make a way for us unto the knowledge of Christ, and so consequently do lead us to Christ Himself being incarnate and crucified for us and our redemption, and lay us upon Christ alone, by Him to be quickened and purely cleansed.</p></blockquote>

<blockquote><p>A. Repentance unto life is a saving grace,[h] wrought in the heart of a sinner by the Spirit[i] and word of God,[k] whereby, out of the sight and sense, not only of the danger,[l] but also of the filthiness and odiousness of his sins,[m] and upon the apprehension of God’s mercy in Christ to such as are penitent,[n] he so grieves for[o] and hates his sins,[p] as that he turns from them all to God,[q] purposing and endeavouring constantly to walk with him in all the ways of new obedience.[r] [h] 2 Tim. 2:25. [i] Zech. 12:10. [k] Acts 11:18,20,21. [l] Ezek. 18:28,30,32. Luke 15:17,18. Hos. 2:6,7. [m] Ezek. 36:31. Isa. 30:22. [n] Joel 2:12,13. [o] Jer. 31:18,19. [p] 2 Cor. 7:11. [q] Acts 26:18. Ezek. 14:6. 1 Kings 8:47,48. [r] Ps. 119:6,59,128. Luke 1:6. 2 Kings 23:25.</p></blockquote>

<blockquote><p>Therefore, good works do not entirely lose their salutary force by any grave sin. Let it be that they are mortified for a time. Let it be that their force and efficacy of leading to life is blunted, let it be that it is intercepted, let it be that it is suspended; yet it is not taken away, not extinguished, not abolished, not to die; but with the arrival of a new act of penitence and of trust in Christ our propitiator, they are finally revived, because the interposition of the grave sin is removed, they recover their former vigor and do not cease to exercise their force of leading to life, until all who are truly penitent are crowned, redeemed with a diadem of unfading glory.</p></blockquote>

<div class="actions"><button class="copy" data-copy="“Therefore, good works do not entirely lose their salutary force by any grave sin. Let it be that they are mortified for a time. Let it be that their force and efficacy of leading to life is blunted, let it be that it is intercepted, let it be that it is suspended; yet it is not taken away, not extinguished, not abolished, not to die; but with the arrival of a new act of penitence and of trust in Christ our propitiator, they are finally revived, because the interposition of the grave sin is removed, they recover their former vigor and do not cease to exercise their force of leading to life, until all who are truly penitent are crowned, redeemed with a diadem of unfading glory.”

— Samuel Ward, ‘Good Works Mortified by Sin are Revived by Penitence’ in Theological Determinations in Works of Samuel Ward… ed. Seth Ward (d. 1643; Gallibrand, 1658), pp. 189-94, p. 192">Copy</button><a class="share" href="https://x.com/intent/post?text=%E2%80%9CTherefore%2C+good+works+do+not+entirely+lose+their+salutary+force+by+any+grave+sin.+Let+it+be+that+they+are+mortified+for+a+time.+Let+it+be+that+their+force+and+efficacy+of+leading+to+life+is+blunted%2C+let+it+be+that+it+is+intercepted%2C+let+it+be+that+it+is+suspended%3B+yet+it+is+not+taken+away%2C+not+extinguished%2C+not+abolished%2C+not+to+die%3B+but+with+the+arrival+of+a+new+act+of+penitence+and+of+trust+in+Christ+our+propitiator%2C+they+are+finally+revived%2C+because+the+interposition+of+the+grave+sin+is+removed%2C+they+recover+their+former+vigor+and+do+not+cease+to+exercise+their+force+of+leading+to+life%2C+until+all+who+are+truly+penitent+are+crowned%2C+redeemed+with+a+diadem+of+unfading+glory.%E2%80%9D%0A%0A%E2%80%94+Samuel+Ward%2C+%E2%80%98Good+Works+Mortified+by+Sin+are+Revived+by+Penitence%E2%80%99+in+Theological+Determinations+in+Works+of+Samuel+Ward%E2%80%A6+ed.+Seth+Ward+%28d.+1643%3B+Gallibrand%2C+1658%29%2C+pp.+189-94%2C+p.+192&amp;url=https%3A%2F%2F5solasquotes.github.io%2Fquote%2F9f8dab1808.html&amp;via=5Solas" target="_blank" rel="noopener">Share on X</a><a class="perma" href="../quote/9f8dab1808.html">Permalink</a><a class="src" href="https://reformedbooksonline.com/topics/repentance#:~:text=Therefore%2C%20good%20works%20do%20not%20entirely,with%20a%20diadem%20of%20unfading%20glory&amp;text=Therefore%2C%20good%20works%20do%20not%20entirely%20lose%20their&amp;text=crowned%2C%20redeemed%20with%20a%20diadem%20of%20unfading%20glory" rel="noopener" target="_blank">Read it online · Reformed Books Online</a></div>

<blockquote><p>As to the term ‘regenerated’ or ‘born again’, I do not call one who is enlightened or breathed upon by any motion of the Holy Spirit, regenerated… I call him unregenerate who has not yet attained to this spiritual quickening, however he may have been affected by some preceding operations of the Holy Spirit. … We concede, then, to the Papists, that before the infusion of regenerating grace, many actions which lead the way to faith and contrition, are both required from men, and by them both can, and are wont [accustomed] to be done, through the sole assistance of awakening grace. Of this kind, are not only joining the Church and hearing the Word, but of thinking of God and divine things, considering their peculiar sins, being alarmed by the sense of them, desiring deliverance from this fear, and many other such like things, which are prerequisite to acts truly spiritual and saving. But we affirm, moreover, that the mind and disposition of the unregenerate is engaged in a natural way only with the aforesaid things; that the will is not elevated to produce an act truly spiritual, until regenerating or quickening efficacy shall have been added, besides, to the awakening and evidencing grace. (See Suarez, Opuscula, De Auxil.Div. Grat., bk. 3, chs. 1-2) Moreover, we grant that this regenerating grace is not infused into men remaining inactive and idling looking for some vague fervors or other; but to minds aroused, and brought under and disposed, in some measure, by the aforesaid actions, through the Word and Spirit of God; nevertheless, we deny that the free-will of an unregenerate man is assisted by these auxiliaries, in such was so to dispose itself that God should be bound to infuse quickening grace into any one from merit of congruity. Lastly, we confess that in the Church of God, where men are excited constantly by the Word and Spirit, this regenerating grace, which alone renders them capable of repenting and believing savingly, is denied to no adult of whom it cannot be truly said, that he willingly resists the Holy Spirit in those actions before-mentioned, and also perversely repulses the quickening operation of the same. (See Spalato, bk. 7, p. 239, &amp; Suarez, Opuscula, p. 222) Yet we deny that any mortal man can be found, who, in repelling the preparatory actions of the Spirit, does not incur, abundantly, this demerit; and, inasmuch as some, repelling God by this intervening, common demerit, are repelled of God and left to themselves; others, notwithstanding equal or greater demerit, are often, and more powerfully assailed by grace, and are at length quickened by the omnipotent operation of the Spirit. The mystery is to be referred to the gracious will of God, pitying or not pitying, and [is] not to be rashly enquired into by any human curiosity.</p></blockquote>

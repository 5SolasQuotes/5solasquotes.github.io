<blockquote><p>4. Although regeneration is the work of God, yet in this life it is imperfect while we are in the state of grace.

5. And so it admits degrees of further perfection.

6. But by no means the defect of a full and final falling away.

7. The concupiscence and stain which remain in the regenerate are properly called sin.

8. Because these are the inseparable companions of any wayfarer, hence falls the dream of Papist perfection in this life.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/johannes-hoornbeeck.html">Johannes Hoornbeeck</a></span><span class="wk"><span class="lbl">Work:</span> <cite>‘Theological Disputation on the Satisfaction of Christ’</cite>, (Leiden: Johann Elsevir, 1664), Corollaries Latin</span></figcaption>

<blockquote><p>10. What all the more rigid Protestants affirm for certain, that God, though not in time, yet in the order of nature, first justifies the sinner, or forgives his sins, and afterwards makes him just, or sanctifies him, let them look well to it, I pray, lest perchance they too audaciously and rashly define the order of the divine actions, which has not been manifestly revealed in the Scriptures. In the [Romanist] schools themselves there has been no small contention on this subject, nor is it yet decided: ‘Whether the infusion of grace,’ says [Thomas] Stapleton (Of Justification, bk. 5, ch. 8, sect. Rursum), ‘precedes the forgiveness of sins in the order of nature, as St. Thomas lays down… or whether the contrary be true, as others most strenuously maintain, is rather a scholastic question than one now-a-days controverted, and is one on which neither formerly nor now has the Church defined anything on either side.’ The moderation of Theodore Beza in this matter, in other respects sufficiently rigid, is much to be approved of. He thus writes (Demonstrations against Flacius Illyricus and his Apology, sect. 22, Rursum quaero, tome 2, p. 218 (or p. 171)): ‘If you take justification in a general sense, as it is sometimes used by the apostle, sanctification will not be an effect, but a part or species of it; but if merely for the gift of imputed justice, or the gratuitous forgiveness of sins, than sanctification will be another gift, which always follows that first gift, since whoever is justified gratis in Christ is also sanctified by His Spirit… Nor need we here contend much which of the two precedes in order, since in one and the same moment Christ… justifies us, and by his Spirit begins to sanctify us.’ and (p. 237, sect. 23, Praeterea quum (or p. 185)): ‘When I had said what is quite true, that, provided it is allowed that we must first of all be made partakers of Christ Himself, that in Him we may be justified and sanctified, we need not labor much to find which of these two precedes in order. lIllyricus brings forward against me Calvin, who says (Antidote to the Council of Trent, sess. 6, sect. Neque tamen interea, tome 8, p. 241) that, ‘as soon as any one is justified, renewal also necessarily follows.’ But Calvin here refuting the decisions of the Council of Trent, by which justification is confounded with the gift of sanctification, is not disputing about the order or series of these two, but of their connection; and therefore says, that ‘if anyone is justified renewal also follows, i.e., that it is necessarily concluded that, if any one be justified, he may also be said to be sanctified. But, I pray you, if I say, ‘If anyone lives, it follows that he is endowed with a soul,’ will it be rightly concluded from thence that I make the being endowed with a soul something posterior to life?’ and (p. 238 (or p. 186) around the end, sect. Ego vero inhabitationem) ‘I say that we are simultaneously justified and renewed in Christ, united and applied to us by faith; and I think that we need not trouble ourselves in anyway to determine whether this one or that precedes in order, since we never receive the one without the other, etc.’ Would that this moderation were religiously followed, not only by the more rigid Protestants, but also by very many other theologians of both parties, who now-a-days excite so many and so great disturbanees in the Church about the mode and order of the divine operations.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/william-forbes.html">William Forbes</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Considerationes Modestae</cite>, On Theodore Beza</span></figcaption>

<blockquote><p>God had been the same, perfect and blessed for ever, though the creature had never been… Infiniteness is God of universal, unlimited and incomprehensible perfection, Job 11:8-9; 1 Tim. 6:16… God therefore having all perfection in his own power, cannot deny any to Himself.</p></blockquote>

<blockquote><p>8. Likewise, every Christian should learn that this grace and this regeneration have not been given to us so that we might remain idle in that stage of our renewal which we at first obtained, but so that we may grow in everything into him who is the head. Therefore, the people must be taught to devote effort to this growth which indeed happens through good works, both internal and external, which are commanded and commended by God. To these works God has, in many passages from the Gospels, clearly and manifestly promised on account of Christ a reward – good things in this life, as much for the body as for the soul (as much as seems right to divine providence) and after this life in heaven. Therefore, although the inheritance of eternal life is due to the regenerate on account of the promise, as soon as they are reborn in Christ, nevertheless God also renders a reward to good works, not according to the substance of the works, nor because they come from us, but to the extent that they are performed in faith and proceed from the Holy Spirit, who dwells in us, free choice concurring as a partial agent.</p></blockquote>

<div class="actions"><button class="copy" data-copy="“8. Likewise, every Christian should learn that this grace and this regeneration have not been given to us so that we might remain idle in that stage of our renewal which we at first obtained, but so that we may grow in everything into him who is the head. Therefore, the people must be taught to devote effort to this growth which indeed happens through good works, both internal and external, which are commanded and commended by God. To these works God has, in many passages from the Gospels, clearly and manifestly promised on account of Christ a reward – good things in this life, as much for the body as for the soul (as much as seems right to divine providence) and after this life in heaven. Therefore, although the inheritance of eternal life is due to the regenerate on account of the promise, as soon as they are reborn in Christ, nevertheless God also renders a reward to good works, not according to the substance of the works, nor because they come from us, but to the extent that they are performed in faith and proceed from the Holy Spirit, who dwells in us, free choice concurring as a partial agent.”

.com/topics/topics-by-subject/sanctification#:~:text=8.%20Likewise%2C%20every%20Christian%20should%20learn,choice%20concurring%20as%20a%20partial%20agent&amp;text=8.%20Likewise%2C%20every%20Christian%20should%20learn%20that%20this&amp;text=us%2C%20free%20choice%20concurring%20as%20a%20partial%20agent" rel="noopener" target="_blank">Read it online · Reformed Books Online</a></div>

<blockquote><p>§I. Sacred Scripture, of both the Old and the New Testament, exhorts and obliges man under the Covenant of Grace to perfection. In the Old Testament, God Himself addresses Abraham: Gen. 17:1, ‘Walk before Me, and be perfect;’… §II. ‘In the New Testament, Christ commands in Mt. 5:48, ‘Be ye therefore perfect, τέλειοι, even as your Father which is in heaven is perfect.’ Paul in 1 Cor. 2:6 says, ‘we speak wisdom among them that are perfect, τελείοις. Phil. 3:15, the same apostle stimulates himself and other Christians to perfection, ‘Let us therefore, as many as be perfect, τέλειοι, be thus minded.’ Col. 1:28, he professes that he and the other apostles announce Christ, so that we may present every man perfect, τέλειον, in Christ Jesus. Col. 3:14, he calls charity σύνδεσμον τῆς τελειότητος, the bond or chain of perfection. Col. 4:12, it is said of Epaphras that he is always striving in prayers for the Colossians, that they may stand perfect, τέλειοι, and complete, πεπληρωμένοι, in all the will of God… Heb. 5:14, the apostle says that strong meat belongs to them that are of full age (perfect), τελείων. §III. Examples of perfect men also occur in the sacred writings… Concerning Noah, God Himself testifies that he was a just and perfect man before him in his generations, Gen. 6:9, and walked with God without ceasing. Concerning Job, God Himself, addressing Satan, gives this sentence in chap. 1 &amp; 2, ‘Hast thou considered my servant Job, that there is none like him in the earth, תםָּ שׁאיִ , a perfect and an upright man, one that feareth God, and escheweth evil.’… §IV. Therefore, the term for Christian ‘perfection’ exists, which we can use without suspicion of heterodoxy, even if others, namely the Novatians and Pelagians, have abused it… Certainly, in the age of Justin Martyr [2nd century A.D.], the name of the perfect was so customary that in his Dialogue with Trypho he himself interprets to become perfect as to become a Christian. … §VI… Perfection is twofold: Legal and Evangelical. Legal is either absolute, or in a certain respect… §VII. Evangelical perfection, on the contrary, consists in the recognition of our misery, both corporal and spiritual, and the necessity of fleeing to the grace of God in Jesus Christ our propitiator, and in a sincere and ἀνυπόκριτος, that is, undisguised and serious and constant endeavor to serve and obey God, through the grace of the Holy Spirit, to be obtained from Him for that purpose by ardent prayers, according to all the commands of the Law, and according to all the faculties of the soul and body, and to grow and advance daily more and more in faith, charity, hope, and other Christian virtues, and to implore pardon for errors and lapses for the sake of the Mediator. §VIII. The former [legal] perfection is rightly called one of degrees, full, and absolute and consummate in all its parts. The latter [evangelical] is called a perfection of parts, inchoate, and in one word, sincerity. And it is such, either absolutely without respect to others who are more imperfect; or comparatively with respect to others who are more imperfect and less mature.</p></blockquote>

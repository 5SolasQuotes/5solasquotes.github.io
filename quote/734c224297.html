<blockquote><p>For this Book passeth All Books that ever were or shall be, I mean, the Book of God’s holy Bible: which Book, saith Hierome, shall remain with us till we be as the Angels in Heaven. Go we forward, and consider how also to this Book he hath added Prophets, Apostles, Evangelists, Pastors, and Doctors in all times, to open and expound the same unto us, that by all means we might be induced with light, love light, live in light, and die in light.

Add again the appointing of the Sabaoth day, wherein men should rest from their labours, and hearken to this Book together with the many precepts given to hear, to read, to search, to know, and understand, &amp; not to be as children, perceiving nothing. Think with your self often, how the little Infant groweth to strength, able to go by it self: is it not by sucking and plucking his Mother’s breasts? even so doth the Childe of God grow to strength of grace, and from grace to grace, by hanging continually upon these two Breasts, the old and new Testament.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/gervase-babington.html">Gervase Babington</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Comfortable notes upon the books of Exodus and Leviticus, as before upon Genesis Gathered and laid down still in this plain manner, for the good of them that cannot use better helps, and yet are careful to read the Scriptures, and very desirous to find the comfort in them. … With a table of the prin</cite>, (London: Thomas Chard, 1604), p. 155.</span></figcaption>

4297.html&amp;via=5Solas" target="_blank" rel="noopener">Share on X</a><a class="perma" href="../quote/734c224297.html">Permalink</a><a class="src" href="https://reformedcovenanter.wordpress.com/2021/07/25/gervase-babington-on-the-bible-and-the-sabbath/" rel="noopener" target="_blank">Read it online · Reformed Covenanter</a></div>
</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-fa241f15f9" data-kw="">
<blockquote><p>Dr. [James H.] Snowden belongs to a denomination which has a Hymnal. At the back of this Hymnal there is a “Psalter.” This Psalter contains sixty selections, averaging twenty to thirty verses each. All are taken from the Old Testament Psalms; and they are intended for use in the public worship of Almighty God. We imagine that they are used regularly by most of the congregations of the Presbyterian Church to which Dr. Snowden belongs.

Yet according to Dr. Snowden the Psalms passed centuries ago “into the museum of fossilized religion and extinct theology.” A more grievous misrepresentation, it would be hard to find. “If a son shall ask bread of any of you that is a father, will he give him a stone?” Either the ministers of the Presbyterian Church in the U.S.A. are calling upon their congregations once or twice every Sunday to resurrect some of the “fossils” of an all but forgotten past, to feed on “stones,” or else Dr. Snowden has traduced and defamed some of the most precious possessions of the Christian believer of today.

The Old Testament Psalms are pre-eminently the book of devotion of the Christian Church. They are not “fossils”; they are not “dead and turned to stone.” They are full of living truth because they are the words of the living God. They have brought blessing and comfort and life to countless generations of believers. They were the solace of the persecuted saints on the desolate moors of Scotland and in the mountain fastnesses of the Waldenses. Martyrs went to the stake with psalms on their lips. They have been read and chanted and sung in every part of the Christian Church; and will continue to be so used while time shall last. “Fossils”! Every Christian who is loyal to God’s word will emphatically repudiate such an outrageous metaphor.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/oswald-thompson-allis.html">Oswald Thompson Allis</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Was Jesus a Modernist? in Princeton Theological Review</cite></span></figcaption>
<div class="meta"><span class="t"><a href="../topics/worship/psalmody.html">Psalmody</a></span></div>

</figure><figure class="quote" id="q-dc9d6f7f58" data-kw="">
<blockquote><p>St. Paul, the apostle of the gentiles, was eminent for occasional conformity. He exhorts the Christians to assert their freedom from the law of ceremonies (Gal. 5:1), lives himself after the manner of the gentiles (Gal. 2:14), and by consequence, in fellowship with them, yet occasionally purified himself in the Temple, according to the Law of Moses. (Acts 21:26) He was a dissenter from the ceremonies of the Law, and yet submits to them to avoid offense [Acts 16:3; 18:21]. He statedly communicated with the gentile Churches, but holds occasional communion with the national Jewish Church. He judged occasional communion lawful, but did not therefore conclude constant communion a duty, nay, it had been sinful to him and all other Christians; for then they must have separated from the fellowship of the Gospel [Acts 15:7-19; Gal. 2:9-21], and renounced Christianity…</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/james-owen.html">James Owen</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Moderation a Virtue</cite>, … (London: Baldwin, 1703), pp. 7-9 Owen (1654-1706) was an English, Independent puritan. By “occasional conformity,” Owen does not mean ever doing that which is sinful.</span></figcaption>

<blockquote><p>We are accustomed to testify without hesitation that this reverence–even if it principally resides in the attitude of the heart of a person who, with a certain righteous dread, regards God as present with Him, a heavenly banquet as present, and the angels as present–nevertheless is also present in the external elements [signis]. I mean things like kneeling during common prayers, an uncovered head, and properly greeting those from whose hand we receive the mysteries–in a word, in our whole deportment and demeanor. And anyone who behaved differently would not leave without a severe rebuke.</p></blockquote>

</figure><figure class="quote" id="q-9aed13649e" data-kw="">
<blockquote><p>What natural, or carnal affections may be excited by them [ceremonies], as men may inflame themselves with idols, Isa. 57:5, or what outward, outside devotion they may direct unto or excite, is uncertain; but that they are no means of stirring up the grace of God in the hearts of believers, or of the increase or strengthening of their faith, which things alone God accepts in Gospel worship, seeing they are not appointed by Him for any such purpose, is most certain: For to say that anything will effectually stir up devotion, that is, excite, strengthen or increase grace in the heart towards God, that is not of his own appointment, is on the one hand to reflect on his wisdom and care towards his Church, as if he had been wanting towards it in things so necessary, which He declares against, Isa. 5:4, ‘What,’ says He, ‘could have been done more to my vineyard, that I have not done in it?’; So on the other [hand], it extols the wisdom of men above what is meet to ascribe unto it. Shall men find out that which God would not, or could not, in matters of so great importance unto his glory and the souls of them that obey Him? yea, and it cannot be but that attendance unto them and their effects must needs divert the mind from those proper spiritual actings of faith and grace, which is its duty to attend unto. And this is evidently seen in them who indulging to themselves in their observation in multiplied instances, as in the Church of Rome, have changed the whole spiritual worship of the Church, into a theatrical pompeous show of carnal devotion.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/john-owen.html">John Owen</a></span><span class="wk"><span class="lbl">Work:</span> <cite>A Brief Instruction in the Worship of God</cite>, … (London: 1667), Question 14, ‘May not the Church find out and appoint to be observed such religious rites as being adjoined unto the celebration of God’s instituted worship, may farther the devotion of the worshippers, and render the worship itself in its performance more decent, beautiful and orderly…?’ pp. 57-58 This quote’s context does not specifically respect musical instruments.</span></figcaption>

<div class="actions"><button class="copy" data-copy="“What natural, or carnal affections may be excited by them [ceremonies], as men may inflame themselves with idols, Isa. 57:5, or what outward, outside devotion they may direct unto or excite, is uncertain; but that they are no means of stirring up the grace of God in the hearts of believers, or of the increase or strengthening of their faith, which things alone God accepts in Gospel worship, seeing they are not appointed by Him for any such purpose, is most certain: For to say that anything will effectually stir up devotion, that is, excite, strengthen or increase grace in the heart towards God, that is not of his own appointment, is on the one hand to reflect on his wisdom and care towards his Church, as if he had been wanting towards it in things so necessary, which He declares against, Isa. 5:4, ‘What,’ says He, ‘could have been done more to my vineyard, that I have not done in it?’; So on the other [hand], it extols the wisdom of men above what is meet to ascribe unto it. Shall men find out that which God would not, or could not, in matters of so great importance unto his glory and the souls of them that obey Him? yea, and it cannot be but that attendance unto them and their effects must needs divert the mind from those proper spiritual actings of faith and grace, which is its duty to attend unto. And this is evidently seen in them who indulging to themselves in their observation in multiplied instances, as in the Church of Rome, have changed the whole spiritual worship of the Church, into a theatrical pompeous show of carnal devotion.”

— John Owen, A Brief Instruction in the Worship of God, … (London: 1667), Question 14, ‘May not the Church find out and appoint to be observed such religious rites as being adjoined unto the celebration of God’s instituted worship, may farther the devotion of the worshippers, and render the worship itself in its performance more decent, beautiful and orderly…?’ pp. 57-58 This quote’s context does not specifically respect musical instruments.">Copy</button><a class="share" href="https://x.com/intent/post?text=%E2%80%9CWhat+natural%2C+or+carnal+affections+may+be+excited+by+them+%5Bceremonies%5D%2C+as+men+may+inflame+themselves+with+idols%2C+Isa.+57%3A5%2C+or+what+outward%2C+outside+devotion+they+may+direct+unto+or+excite%2C+is+uncertain%3B+but+that+they+are+no+means+of+stirring+up+the+grace+of+God+in+the+hearts+of+believers%2C+or+of+the+increase+or+strengthening+of+their+faith%2C+which+things+alone+God+accepts+in+Gospel+worship%2C+seeing+they+are+not+appointed+by+Him+for+any+such+purpose%2C+is+most+certain%3A+For+to+say+that+anything+will+effectually+stir+up+devotion%2C+that+is%2C+excite%2C+strengthen+or+increase+grace+in+the+heart+towards+God%2C+that+is+not+of+his+own+appointment%2C+is+on+the+one+hand+to+reflect+on+his+wisdom+and+care+towards+his+Church%2C+as+if+he+had+been+wanting+towards+it+in+things+so+necessary%2C+which+He+declares+against%2C+Isa.+5%3A4%2C+%E2%80%98What%2C%E2%80%99+says+He%2C+%E2%80%98could+have+been+done+more+to+my+vineyard%2C+that+I+have+not+done+in+it%3F%E2%80%99%3B+So+on+the+other+%5Bhand%5D%2C+it+extols+the+wisdom+of+men+above+what+is+meet+to+ascribe+unto+it.+Shall+men+find+out+that+which+God+would+not%2C+or+could+not%2C+in+matters+of+so+great+importance+unto+his+glory+and+the+souls+of+them+that+obey+Him%3F+yea%2C+and+it+cannot+be+but+that+attendance+unto+them+and+their+effects+must+needs+divert+the+mind+from+those+proper+spiritual+actings+of+faith+and+grace%2C+which+is+its+duty+to+attend+unto.+And+this+is+evidently+seen+in+them+who+indulging+to+themselves+in+their+observation+in+multiplied+instances%2C+as+in+the+Church+of+Rome%2C+have+changed+the+whole+spiritual+worship+of+the+Church%2C+into+a+theatrical+pompeous+show+of+carnal+devotion.%E2%80%9D%0A%0A%E2%80%94+John+Owen%2C+A+Brief+Instruction+in+the+Worship+of+God%2C+%E2%80%A6+%28London%3A+1667%29%2C+Question+14%2C+%E2%80%98May+not+the+Church+find+out+and+appoint+to+be+observed+such+religious+rites+as+being+adjoined+unto+the+celebration+of+God%E2%80%99s+instituted+worship%2C+may+farther+the+devotion+of+the+worshippers%2C+and+render+the+worship+itself+in+its+performance+more+decent%2C+beautiful+and+orderly%E2%80%A6%3F%E2%80%99+pp.+57-58+This+quote%E2%80%99s+context+does+not+specifically+respect+musical+instruments.&amp;url=https%3A%2F%2F5solasquotes.github.io%2Fquote%2F9aed13649e.html&amp;via=5Solas" target="_blank" rel="noopener">Share on X</a><a class="perma" href="../quote/9aed13649e.html">Permalink</a><a class="src" href="https://reformedbooksonline.com/topics/topics-by-subject/worship/musical-instruments/#:~:text=What%20natural%2C%20or%20carnal%20affections%20may,theatrical%20pompeous%20show%20of%20carnal%20devotion&amp;text=What%20natural%2C%20or%20carnal%20affections%20may%20be%20excited&amp;text=into%20a%20theatrical%20pompeous%20show%20of%20carnal%20devotion" rel="noopener" target="_blank">Read it online · Reformed Books Online</a></div>

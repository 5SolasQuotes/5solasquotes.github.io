<main class="wrap"><figure class="quote" id="q-766cef99fd" data-kw="" data-pol="">
<blockquote><p>In this way the formal cause of that remedy against these effects should belong to the same nature—that is, not something inhering in us but proceeding from a different direction and causing conditions opposed to the former conditions.</p></blockquote>
<figcaption>— <a href="../authors/theodore-beza.html">Theodore Beza</a>, <cite>A Defense of Justification through the Righteousness of Christ Alone</cite>, reply to the Anonymous Man’s Third Argument</figcaption>

</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-16ec124bdb" data-kw="" data-pol="">
<blockquote><p>The whole dispute is as to The Cause of Justification. The Fathers of Trent pretend that it is twofold, as if we were justified partly by forgiveness of sins and partly by spiritual regeneration; or, to express their view in other words, as if our righteousness were composed partly of imputation, partly of quality. I maintain that it is one, and simple, and is wholly included in the gratuitous acceptance of God. I besides hold that it is without us, because we are righteous in Christ only.</p></blockquote>
<figcaption>— <a href="../authors/john-calvin.html">John Calvin</a>, <cite>Acts of the Council of Trent with the Antidote</cite>, Antidote to the Sixth Session, on the decree (ch. 7, the causes of justification)</figcaption>
<div class="meta"><a class="tag" href="../topics/polemics/rome-justification.html">Rome: Justification</a><a class="tag" href="../topics/salvation/justification.html">Justification</a><a class="tag" href="../topics/salvation/imputation.html">Imputation</a></div>

<blockquote><p>And that is not the essential righteousness of God, as Andreas Osiander contended … And it is not partly composed of Christ’s righteousness and partly of ours, which the sophists invent, whom Calvin refutes in the same chapter. But it is only by the righteousness of Jesus Christ, our Mediator and Savior</p></blockquote>
<figcaption>— <a href="../authors/amandus-polanus.html">Amandus Polanus</a>, <cite>The Free Justification of Man the Sinner before God</cite>, section on the righteousness by which we are justified</figcaption>

</figure><figure class="quote" id="q-5e998e8dd1" data-kw="" data-pol="">
<blockquote><p>Between them and us there is this difference, that they persuade themselves that the movement comes from the man himself, whereas we maintain that faith is voluntary, because God draws our wills to himself. Add, that when we say a man is justified by faith alone, we do not fancy a faith devoid of charity, but we mean that faith alone is the cause of justification.</p></blockquote>
<figcaption>— <a href="../authors/john-calvin.html">John Calvin</a>, <cite>Acts of the Council of Trent with the Antidote</cite>, Antidote to the Sixth Session, on Canon 9</figcaption>
<div class="meta"><a class="tag" href="../topics/polemics/rome-justification.html">Rome: Justification</a><a class="tag" href="../topics/salvation/justification.html">Justification</a><a class="tag" href="../topics/salvation/faith.html">Faith</a></div>

</figure><figure class="quote" id="q-a046484a06" data-kw="" data-pol="">
<blockquote><p>And consequently he contends that justification consists of two parts, namely, reconciliation and the other new virtues. … Out of these effects, Andrada, in his subtlety, makes the cause and form of justification. We, indeed, do not deny these and other effects of justification, but we do not say that the effects are the causes.</p></blockquote>
<figcaption>— <a href="../authors/martin-chemnitz.html">Martin Chemnitz</a>, <cite>Examination of the Council of Trent</cite>, Part 1, Topic on Justification</figcaption>

<main class="wrap"><figure class="quote" id="q-09eadf03f7" data-kw="">
<blockquote><p>Therefore Paul separates the spiritual people of the new covenant from the Law when he says that this people is not the child of Hagar, who had a husband, but of Sarah, the free woman, who does not know the Law. In this way he sets the people of faith far above and beyond the Law. But if it is above and beyond the Law, then it is justified, not by the Law and works but solely by its spiritual birth, that is, by faith. For spiritual birth is nothing other than faith. Now just as the people of grace neither has the Law nor can have it, so the people of the Law neither has grace nor can have it; for it is impossible for Law and grace to exist together. Either we must be justified by faith and lose the righteousness of the Law, or we must be justified by the Law and lose grace and the righteousness of faith. It is a bitter and tragic loss when we keep the Law and lose grace. On the other hand, it is a fortunate and saving loss when we keep grace and lose the Law.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/martin-luther.html">Martin Luther</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Luther’s Works</cite>, Vol. 26: Lectures on Galatians, 1535, Chapters 1-4, ed. Jaroslav Jan Pelikan, Hilton C. Oswald, and Helmut T. Lehmann, vol. 26 (Saint Louis: Concordia Publishing House, 1999), 445.</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/the-law-of-god.html">The Law of God</a></span></div>

</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-e635632681" data-kw="">
<blockquote><p>Q. What does the LORD require in the first commandment? A. That for the sake of my very salvation I avoid and flee all idolatry, witchcraft, superstition, and prayer to saints or to other creatures. Further, that I rightly come to know the only true God, trust in him alone, submit to him with all humility and patience, expect all good from him only, and love, fear, and honour him with all my heart. In short, that I forsake all creatures rather than do the least thing against his will.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/zacharias-ursinus-caspar-olevianus.html">Zacharias Ursinus &amp; Caspar Olevianus</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Heidelberg Catechism</cite>, Q. 94</span></figcaption>

<blockquote><p>Observe the holiness and perfection of God&#x27;s law, which forbids the first motions and risings of sin in the heart. The laws of men take hold of actions; but the law of God goes further—it forbids not only sinful actions—but sinful desires.</p></blockquote>

</figure><figure class="quote" id="q-6410d65b06" data-kw="">
<blockquote><p>Certainly, the professors of it are not well purged from this latter idolatry: for, even among Protestants themselves, we shall find very many that are in this sense idolaters. For, [1] Whosoever chiefly and supremely loves any creature, is an idolater; because our chiefest love is due only unto God. Hence the covetous person is expressly called an idolater; and covetousness, idolatry: Col. 3:5. Mortify your earthly members; … uncleanness … evil concupiscence, and covetousness, which is idolatry. And the sensual epicure is likewise an idolater: Phil. 3:19 his belly, saith the Apostle, is his God. The proud person is an idolater: for he loves himself supremely; sets up himself for his own idol; and falls prostrate before that image, which he hath pourtrayed of his own perfections, in his own fancy and imagination. And, generally, all such, who love and admire anything above God, or esteem anything so, are idolaters.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/ezekiel-hopkins.html">Ezekiel Hopkins</a></span><span class="wk"><span class="lbl">Work:</span> <cite>An Exposition of the Ten Commandments</cite>, on the First Commandment (heart / creature idolatry)</span></figcaption>

</figure><figure class="quote" id="q-f93211a861" data-kw="">
<blockquote><p>If life and justice come not by the law, the law then is in vain. And this objection is expressed by way of interrogation, ‘Wherefore then serves the law?’ The answer is in the next words, ‘It is added for transgressions,’ that is, for the revealing of sin and the punishment thereof, and for the convincing of men touching their sins (Rom 3:19–20; HT: Inwoo Lee).</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/william-perkins.html">William Perkins</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Commentary on Galatians</cite>, 2:194 (On Galatians 3:19).</span></figcaption>

<blockquote><p>712. It has also been said that God invites the sinner to the possession of these goods under the condition of faith which we described in chapter 14. This is the proposition of the covenant of grace. 713. But we have warned that God does not weigh this condition as being brought about by the sinner’s own power. Indeed, the sinner is a slave to sin, and inept to any spiritual good on his own.</p></blockquote>

</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-a6876fd9dd" data-kw="">
<blockquote><p>It follows not that they [good works] are con-causes, or joint-causes with Christ, but only conditions; just as a man’s journeying on foot or horse, to a city, or a kingdom to inherit it, is the way, condition, of his entering the city; But it is not his charter, or law-title, or right to enjoy the crown, as his inheritance; any effective influence to the title of the crown of Heaven, I dare not ascribe to any works in us, or to any but to Christ; but undeniably, good works are not so much as conditions of justification, they follow a man justified, but go not before justification; no more than the apple goes before the tree, or the cistern before the fountain; nor are they the conditions of the Covenant of Grace: they are the conditions of covenanted ones, not of the Covenant.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/samuel-rutherford.html">Samuel Rutherford</a></span><span class="wk"><span class="lbl">Work:</span> <cite>A Survey of the Spiritual Antichrist, Opening the Secrets of Familism &amp; Antinomianism (London, 1648), pt. 2, ch. 48, ‘Antinomians hold that the believer cannot sin against God…’, p. 63</cite>, pp. 62-63</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/the-covenant-of-grace/conditions-of-the-covenant.html">Conditions of the Covenant</a></span></div>

"_blank">Read it online · Reformed Books Online</a></div>
</figure><figure class="quote" id="q-468e894502" data-kw="">
<blockquote><p>The papists prefer good works as meritorious causes, as do the Socinians, but as good works required by grace. There are those who prefer faith and repentance taken jointly, and there are several who are pleased with repentance, faith, and obedience. Most of the orthodox, with the Scriptures, most accurately admit here faith alone… Most broadly understood it [a condition] includes anything that is required in any way for the covenant of grace, whether: (1) antecedently, and as it were in a preparatory fashion, in which sense the hearing of the promulgated covenant, a general assent given to the divine Word, a conviction of the necessity of the covenant of grace, an effectual call to faith (prior to faith, if not in time, at least in nature), an acknowledgement and sense of one’s misery, a godly desperation about oneself and all things outside the Mediator, and so forth, can be called a condition. Or, (2) concomitantly, in which manner self-denial (Lk. 9:23; Phil. 3:4–12), the exercise of repentance (Mk. 1:15; Acts 2:38–39), and so forth, can be taken as a condition. Or, (3) consequently, as covenantal duties, in which sense evangelical obedience (cf. Gen. 12:1–3; 15:18; 17:1–2; 9:1–15) and renewal of repentance (Dt. 30:1–9 with 29:24 to the end) can be admitted as a condition. More strictly and most properly understood, a condition denotes that by which, when it is given in man, from the divine promise, the covenant of grace is entered into. In this sense faith alone supplies the condition of the covenant of grace, for by this: (1) it is distinguished from the covenant of works (Rom. 3:27; 10:5–14); (2) it is denominated the law of faith (Rom. 3:27); and (3) its righteousness, the righteousness of faith (Rom. 10:6; Phil. 3:9; Heb. 11:7); (4) its covenanted parties are called οἱ ἐκ πίστεως, those who are of faith (Gal. 3:9).</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/petrus-van-mastricht.html">Petrus van Mastricht</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Theoretical Practical Theology (2nd ed. 1698; RHB), vol. 4, pt. 1, bk. 5, ch. 1, ‘The Covenant of Grace’ | XIX. The agreement of God 22 XX. The covenant of grace is conditioned 23 XXI. Because it is accomplished by a mutual promise 24 XXII. What the condition of the covenant of grace is 24 XXIII. The covenant of grace is not offered and conferred upon each and every person 25</cite>, pp. 24-25</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/the-covenant-of-grace/conditions-of-the-covenant.html">Conditions of the Covenant</a></span></div>

<blockquote><p>And this is clear by all covenants in the Word of God: even the covenant between God and man is in like manner mutual — “I will be your God, and ye shall be my people.” The covenant is so mutual, that if the people break the covenant, God is loosed from his part of the covenant, Zech. 11:10. The covenant gives to the believer ‘a sort of action of law,’ and jus quoddam, to plead with God in respect of his fidelity to stand to that covenant that binds him by reason of his fidelity, Isa. 43:26; 63:16; Dan. 9:4-5;</p></blockquote>

<blockquote><p>Here we come to the issue of psalms versus hymns. Our fathers ruled that, with a few exceptions, only the singing of psalms was permitted in the assembly of believers. When hymns were introduced in 1807 (by unlawful ecclesiastical might) many people objected to them and refused to sing them when announced from the pulpit. At the time of the restoration of the church in the Secession and Doleantie [Sorrowing], the position was reaffirmed that only psalms were to be sung.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/abraham-kuyper.html">Abraham Kuyper</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Our Worship</cite>, trans. Harry Boonstra (Grand Rapids: William B. Eerdmans Publishing Co., 2009), 37</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/worship.html">Worship</a></span></div>

</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-20b1752885" data-kw="">
<blockquote><p>And I dare say, whosoever shall peruse with a judicious and unpartial eye most of those pamphlets, that in this daring age have been thrust into the world against… (…things of lesser regard and usefulness and more open to acception [exception] and abuse, yet so far as I can understand, unjustly condemned as things utterly unlawful, such as are lusorious lots, dancing, stage plays and some other things of like nature), when he shall have drained out the bitter invectives, unmannerly jeers, petulant guirding at those that are in authority, impertinent digressions, but above all those most bold and perverse wrestings of holy Scripture, wherewith such books are infinitely stuffed, he shall find that little poor remainder that is left behind to contain nothing but vain words and empty arguments. For when these great undertakers have snatched up the bucklers, as if they would make it good against all comers, that such and such things are utterly unlawful, and therefore ought in all reason and conscience to bring such proofs as will come up to that conclusion: Quid dignum tanto? very seldom shall you hear from them any other arguments than such as will conclude but an inexpediency at the most, as that they are apt to give scandal, that they carry with them an appearance of evil, that they are often occasions of sin, that they are not command[ed] in the Word, and such like. Which objections, even where they are just, are not of force (no not taken altogether, much less any of them singly) to prove a thing to be utterly unlawful. And yet are they glad many times, rather than sit out, to play very small game and to make use of arguments yet weaker than these and such as will not reach so far as to prove a bare inexpediency, as that they were invented by heathens, that they have been abused in Popery and other such like. Which to my understanding is a very strong presumption that they have taken a very weak cause in hand and such as is wholly destitute of sound proof.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/robert-sanderson.html">Robert Sanderson</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Bishop Sanderson his Judgment in One View for the Settlement of the Church in Reason &amp; Judgement, or, Special Remarks of the Life of the Renowned Dr. Sanderson</cite>, … (London: Marsh, 1663), pp. 75-77 Sanderson (1587–1663) was an Anglican bishop, theologian and casuist.</span></figcaption>

<blockquote><p>But the sun has the highest, best and most burningly glorious characteristics of all.” But there are a whole lotta good things it can’t do, which others can; the moon is more elegant, the stars sparkling, the cool wind refreshing and waddling baby skunks are really cute. When there’s no Christian liberty judgmentalism is the norm. Hypocrisies become glaring; straining at gnats is glorified while camels get swallowed. One can’t use the sacred lingo except in approving ways (otherwise it hurts the group’s ideals, image and cause, which is tantamount to sacrilege). With a bit of time the ideals of the leader are basically the ideals of the group. The very epitomy of the most desirable balance of this best spiritual life is the leader; his godly characteristics are not just a pattern in the church, but the mold. If the leaders don’t see it this way, most of the people do. He doesn’t seem to have any faults; he never mentions any (except for petty faults hardly considered sins). Any other balance than his is seen as less godly or good. The reason why the expectations never end is because he (or they) are trying to mold you to be like him, or them. The rising leaders are replicas of him, or try to be; you notice similar lingo, mannerisms, choices, imaging, etc. He is pleased they are following the best way (his). The elders always support his ideas. He has persuaded his closer colleagues of his same principles (distinctives). They are either his adoring fans or the same indistinguishable front with him. If you’re not fully on board with all these choices you probably feel like a bit of a second class citizen, passed over, inferior or a sandbag. What do you make of the Holy Spirit’s words in Eccl. 7:16: “Be not righteous over much; neither make thyself over wise: why shouldest thou destroy thyself?” They have only ever referenced this verse in a diminuitive way. . Pressure to do what You’re Not Comfortable with Manipulation is a near-universal characteristic of cultic groups, but it’s not most basic. Why do persons manipulate? To get you to do something you’re not comfortable with. You see all the fronted reasons they put forth, but they don’t add up. Why all the pressure? They won’t reveal their real reasons, but why not? If you knew them, you wouldn’t do it. They don’t see natural boundaries (Lk. 11:5-7) themselves and their view of you doesn’t take natural boundaries or your conscience into account (otherwise known as ‘respect’), because they are blinded by their principles. Hence they don’t believe you have a right to these boundaries. That is why the teeth of the bear-trap only dig deeper and further in. The only justification you need is, “I’m not comfortable with that.” You are not to do things apart from your faith that it’s right and with a sure conscience before the Lord: “Whatsoever is not of faith is sin,” (Rom. 14:23). For them to pressure you, or counsel, instruct or command you to do it anyway, without satisfying your reasons and conscience to your satisfaction, is to pressure you to sin, which is sinful of them. If you give your reasons and they minimize or dismiss them without satisfying them, and still pressure you, whatever they want you to do (especially if it means stepping into what may be a bear-trap), do not do it. If this is a pattern of their behavior, you are talking to a cultic person or cult leaders. If they won’t listen to you but give you the most spiritual reasons for doing what you’re not comfortable with, quoting Scriptures, citing Church authority, the elders’ great wisdom, etc. etc. you are being brainwashed and now know how and why most people around you can go along with this. The likely reason they won’t give you straight-forward satisfying reasons is because they are keeping from you not only the real reasons, but what will occur if you comply (which you can be sure you will not be comfortable with). They may speak softly, humbly and seek your agreement beforehand; if you backout, you had agreed to it, and their proceedings are legitimized. Don’t trust people that won’t tell you what they’re doing (especially when they won’t send you ahead of time an outline of what is to be “discussed” at the meeting). If they can have witnesses, but you can’t (“We just want to visit with you alone;” “Sorry but that’s not how we do things;” “There’s no need for that”), you already have years of psychological friendship with abusers, and your default inclination is to stay with them. If they are always asking you to accommodate and compromise with them, but they never accomodate you, you are already cooperating with and on the path of “equity rescuing” (see the Intro above). If you provide terms upon which you can safely communicate and interact with them, and they dismiss this, still claiming you are obliged to do something you are not comfortable with, they are telling you expressly: “We are a cult.</p></blockquote>

t+righteous+over+much%3B+neither+make+thyself+over+wise%3A+why+shouldest+thou+destroy+thyself%3F%E2%80%9D+They+have+only+ever+referenced+this+verse+in+a+diminuitive+way.+.+Pressure+to+do+what+You%E2%80%99re+Not+Comfortable+with+Manipulation+is+a+near-universal+characteristic+of+cultic+groups%2C+but+it%E2%80%99s+not+most+basic.+Why+do+persons+manipulate%3F+To+get+you+to+do+something+you%E2%80%99re+not+comfortable+with.+You+see+all+the+fronted+reasons+they+put+forth%2C+but+they+don%E2%80%99t+add+up.+Why+all+the+pressure%3F+They+won%E2%80%99t+reveal+their+real+reasons%2C+but+why+not%3F+If+you+knew+them%2C+you+wouldn%E2%80%99t+do+it.+They+don%E2%80%99t+see+natural+boundaries+%28Lk.+11%3A5-7%29+themselves+and+their+view+of+you+doesn%E2%80%99t+take+natural+boundaries+or+your+conscience+into+account+%28otherwise+known+as+%E2%80%98respect%E2%80%99%29%2C+because+they+are+blinded+by+their+principles.+Hence+they+don%E2%80%99t+believe+you+have+a+right+to+these+boundaries.+That+is+why+the+teeth+of+the+bear-trap+only+dig+deeper+and+further+in.+The+only+justification+you+need+is%2C+%E2%80%9CI%E2%80%99m+not+comfortable+with+that.%E2%80%9D+You+are+not+to+do+things+apart+from+your+faith+that+it%E2%80%99s+right+and+with+a+sure+conscience+before+the+Lord%3A+%E2%80%9CWhatsoever+is+not+of+faith+is+sin%2C%E2%80%9D+%28Rom.+14%3A23%29.+For+them+to+pressure+you%2C+or+counsel%2C+instruct+or+command+you+to+do+it+anyway%2C+without+satisfying+your+reasons+and+conscience+to+your+satisfaction%2C+is+to+pressure+you+to+sin%2C+which+is+sinful+of+them.+If+you+give+your+reasons+and+they+minimize+or+dismiss+them+without+satisfying+them%2C+and+still+pressure+you%2C+whatever+they+want+you+to+do+%28especially+if+it+means+stepping+into+what+may+be+a+bear-trap%29%2C+do+not+do+it.+If+this+is+a+pattern+of+their+behavior%2C+you+are+talking+to+a+cultic+person+or+cult+leaders.+If+they+won%E2%80%99t+listen+to+you+but+give+you+the+most+spiritual+reasons+for+doing+what+you%E2%80%99re+not+comfortable+with%2C+quoting+Scriptures%2C+citing+Church+authority%2C+the+elders%E2%80%99+great+wisdom%2C+etc.+etc.+you+are+being+brainwashed+and+now+know+how+and+why+most+people+around+you+can+go+along+with+this.+The+likely+reason+they+won%E2%80%99t+give+you+straight-forward+satisfying+reasons+is+because+they+are+keeping+from+you+not+only+the+real+reasons%2C+but+what+will+occur+if+you+comply+%28which+you+can+be+sure+you+will+not+be+comfortable+with%29.+They+may+speak+softly%2C+humbly+and+seek+your+agreement+beforehand%3B+if+you+backout%2C+you+had+agreed+to+it%2C+and+their+proceedings+are+legitimized.+Don%E2%80%99t+trust+people+that+won%E2%80%99t+tell+you+what+they%E2%80%99re+doing+%28especially+when+they+won%E2%80%99t+send+you+ahead+of+time+an+outline+of+what+is+to+be+%E2%80%9Cdiscussed%E2%80%9D+at+the+meeting%29.+If+they+can+have+witnesses%2C+but+you+can%E2%80%99t+%28%E2%80%9CWe+just+want+to+visit+with+you+alone%3B%E2%80%9D+%E2%80%9CSorry+but+that%E2%80%99s+not+how+we+do+things%3B%E2%80%9D+%E2%80%9CThere%E2%80%99s+no+need+for+that%E2%80%9D%29%2C+you+already+have+years+of+psychological+friendship+with+abusers%2C+and+your+default+inclination+is+to+stay+with+them.+If+they+are+always+asking+you+to+accommodate+and+compromise+with+them%2C+but+they+never+accomodate+you%2C+you+are+already+cooperating+with+and+on+the+path+of+%E2%80%9Cequity+rescuing%E2%80%9D+%28see+the+Intro+above%29.+If+you+provide+terms+upon+which+you+can+safely+communicate+and+interact+with+them%2C+and+they+dismiss+this%2C+still+claiming+you+are+obliged+to+do+something+you+are+not+comfortable+with%2C+they+are+telling+you+expressly%3A+%E2%80%9CWe+are+a+cult.%E2%80%9D%0A%0A%E2%80%94+Cultic+Characteristics%2C+Spiritual+Legalism&amp;url=https%3A%2F%2F5solasquotes.github.io%2Fquote%2F815a30f56e.html&amp;via=5Solas" target="_blank" rel="noopener">Share on X</a><a class="perma" href="../quote/815a30f56e.html">Permalink</a><a class="src" href="https://reformedbooksonline.com/on-cults/#:~:text=But%20the%20sun%20has%20the%20highest,you%20expressly%3A%20%E2%80%9CWe%20are%20a%20cult&amp;text=But%20the%20sun%20has%20the%20highest%2C%20best%20and&amp;text=are%20telling%20you%20expressly%3A%20%E2%80%9CWe%20are%20a%20cult" rel="noopener" target="_blank">Read it online · Reformed Books Online</a></div>

<blockquote><p>Although a thing may have its origin in Scripture, if it is to be indifferent, it is nevertheless required that there be no positive precept by which it is ordered, nor any negative one by which it is prohibited, but that it be left to us as something free, to use or not to use, as shall seem useful… Indifferent things must have a manifest and open usefulness, known in the Church, lest they may seem to be received for no purpose, or to be forced into the Church by treachery and deceit… power is given to edification and not to destruction (1 Cor. 14)… …the writings of the apostles and evangelists, which place before us most clearly the annulment of the rituals of Aaron, his ceremonies, priesthood, images, and peculiar figures, and the institution of the new and perfect priesthood of Christ. They must demonstrate to us from these books the grounds and occasion when some peculiar and special vestments should be worn in the ministry, for the adornment of the ministry itself, or for the preferring of its decorum, or for some distinctive mark, by which the minister can be distinguished from the people, as once was ordained by the Lord in the ministry of Aaron’s priesthood. But the statutes, canons and decrees of the apostles and evangelists make no mention of this matter… …What is prohibited by God can in no way be indifferent, as we have given warning above. For this is the doctrine of Paul in Gal. 2, that whatever re-establishes things that have been annulled in Christ, transgresses the will of God… Neither is it without its mystery that our Saviour Jesus Christ hung naked from the Cross. For Aaron’s priests used vestments in their own ministry because the reality of their priesthood, Christ Himself, had not yet come. But when Christ Himself was to be sacrificed, stripped of all clothing, displaying in this way his own priesthood, which since He was Reality itself, now had no further need of veils or semblances…</p></blockquote>

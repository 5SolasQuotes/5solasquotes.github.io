<main class="wrap"><figure class="quote" id="q-09f2b7e88a" data-kw="">
<blockquote><p>A truly broken spirit is also a believing spirit. Faith and repentance are inseparable twins, bred together in one and the same sanctified womb of the converted Soul. Faith first is in us in order of nature at least, but actual Repentance is apt first to appear: as sap and life are first in the root, yet buds leaves and fruit first discover themselves in the branches.

They shall look upon me whom they have pierced: there’s faith, for with what other eye can they behold Christ crucified? And they shall mourn for him, &amp;c. there’s brokenness of spirit resulting from it, Zech. 12. 10.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/francis-roberts.html">Francis Roberts</a></span><span class="wk"><span class="lbl">Work:</span> <cite>A Broken Spirit, God’s Sacrifices. Or, The Gratefulness of a Broken Spirit unto God. Represented in a Sermon, before the right Honourable House of Peers, in K. Henry the Seventh’s chapel in the Abbey Westminster, upon Wednesday Decemb. 9. 1646. Being a day of public humiliation for removing of the g</cite>, (London: George Calvert, 1647), p. 16.</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/repentance-and-conversion/nature-of-repentance.html">Nature of Repentance</a></span></div>

</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-5b7bdd323b" data-kw="">
<blockquote><p>Position 3. To repent, to mortify sin, is not to condemn all our works (as Mr. Town says) righteousness and judgment, and our best things in us, and then by faith to fly to grace; nor is it to distrust our own righteousness and embrace Christ’s in the promise:

1. Because this is faith; and the Scripture says we are justified by faith.

2. We receive Christ by faith, Jn. 1:12.

3. We receive and embrace the promise by faith, Heb. 11:11, and were persuaded of them.

4. We are to believe without staggering, Rom. 4.19.

5. We have peace of conscience through faith, Rom. 5:1.

6. By faith we have access into this grace wherein we stand, Rom. 5:2. And boldness to enter into the holy of holiest, and draw near to our High Priest, with full assurance of faith, Heb. 10:19-22. Now we are not justified by repentance and mortification; we neither receive Christ, nor embrace the promises by repentance. The apostle requires in repentance, sorrow, carefulness to eschew sin, clearing, indignation, fear, zeal, desire, revenge, 2 Cor. 7:10-11, but nowhere does the Scripture require this as an ingredient of repentance, that we have boldness and access, and full assurance: nor do Antinomians admit that by repentance we have peace or pardon, but this they ascribe to faith.</p></blockquote>

<blockquote><p>1st Problem: Whether natural man can use the light of nature (which some call the remnants of the divine image, good disposition, common or universal grace, first and preventing grace) so rightly that by that good use he can obtain greater grace, namely, evangelical and salvific grace? Response: So indeed the ancient and more recent Pelagians would have it, whose recooked error see in Johann Arnold Corvinus’s treatise against Tilenus, ch. 6. But we deny it, from Mt. 11:23 [11:25-27]; Ps. 147:19–20; Acts 14:16; and 10:6–7[?]; Eph. 2:12–13 with Titus 3:3.</p></blockquote>

</figure><figure class="quote" id="q-17afc6fb4a" data-kw="">
<blockquote><p>Repentance is a detestation of wicked life, and a turn to the better. Whence the parts of repentance are two: withdrawal from evil, and approach to the good, Psalm 34:14, depart from evil, and do good. It is evident that this repentance, insofar as it is saving conversion to God, that is, Sanctification begun or continued, pertains to the Gospel: (1.) Because it is an effect of evangelical doctrine. (2.) Because the baptism of repentance, which John preached, Mk. 1:4, is not a sacrament of the Law, but of the Gospel. (3.) Because the Gospel alone works that sorrow that is according to God, 2 Cor. 7:10. But the Law works wrath, Rom. 4:15. (4.) Because it immediately flows from the remission of sins, insofar as the Gospel is the preaching of the remission of sins and of repentance, Mk. 6:12.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/marcus-friedrich-wendelin.html">Marcus Friedrich Wendelin</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Christian Theology 3rd</cite>, ed. (1634). ‘Gospel-Offer &amp; Covenant of Grace’ Wendelin (1584-1652)</span></figcaption>

</figure><figure class="quote" id="q-4c22411c3f" data-kw="">
<blockquote><p>Not to trust in repentance, but after all thy humiliations still to depend only upon Christ. Though Christ died, and was crucified, yet he did not lose his strength and efficacy. This was represented in that passage of God’s providence, That a bone of his was a broken; Rely therefore upon Christ wounded for sin, not upon thy own heart that is wounded, use this, but trust only in Christ.

Dependence upon Evangelical graces doth evacuate Christ, as well as confidence in the Law. A man may not only preach the Law, and the duties thereof to the prejudice of Christ’s glory; but also the duties and graces of the Gospel. If a man relieth upon his repentance and believing, he maketh Justification and Salvation to be of works, though it be of faith; for he makes his faith a work, and gives that glory which belongs to Christ, to his own repentance.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/anthony-burgess.html">Anthony Burgess</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The true doctrine of justification asserted and vindicated, from the errors of Papists, Arminians, Socinians, and more especially Antinomians in XXX lectures preached at Lawrence-Jury, London</cite>, (2nd edn, London: Tho. Underhill, 1651), p. 164.</span></figcaption>

<main class="wrap"><figure class="quote" id="q-de6de7e4fa" data-kw="">
<blockquote><p>Repent ye, therefore, and be converted, that your sins may be blotted out.” (Acts 2:38; 3:19) Here, however, it is to be observed, that repentance is not made a condition in such a sense as to be a foundation for meriting pardon; nay, it rather indicates the end at which they must aim if they would obtain favor, God having resolved to take pity on men for the express purpose of leading them to repent.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/john-calvin.html">John Calvin</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Institutes of the Christian Religion</cite>, trans. Henry Beveridge (1559; Edinburgh: Calvin Translation Society, 1845), vol. 2, bk. 3, ch. 3, sect. 20, pp. 173-74</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/repentance-and-conversion/repentance-and-faith.html">Repentance and Faith</a></span></div>

<blockquote><p>It is asked further: But since through faith the righteousness of Christ belongs to him who has been effectually called, cannot one be at least denominated righteous according to that righteousness which belongs to him through faith? I would not, indeed, completely deny that one who has been effectually called is already righteous through faith. But I would not admit that he can be called and named righteous, because the Judge’s sentence—which sentence evidently arises from some further grace—has not yet been delivered and pronounced concerning him. For it is entirely of grace that God pronounces righteous those who are already (in accordance with effectual calling) righteous through faith, and imputes to them another’s righteousness as if it were their own.</p></blockquote>

</figure><figure class="quote" id="q-9aa4368dc7" data-kw="">
<blockquote><p>And therefore, lastly, in answer to diverse places of the ancients which are produced to confirm the modern sense of justification by faith alone, I answer in a word: That it is true, their words seem to attest so much, but their meaning was plainly no more than this: That faith many times does justify without works, that is, any outward manifestation of their faith, by such fruits: but never without inward acts of repentance and charity distinct from this special faith: nor without such a devotion to good works, which wants nothing but opportunity to exert them; which is by an extraordinary clemency and grace of God, accepted for the thing itself. This appears by the example by them given, to manifest their meaning, of the thief on the cross; who was so justified and saved by faith alone, without good works answerable thereunto, because his sudden faith was prevented by sudden death. Nevertheless, that his faith was so much alone as to exclude repentance, and such graces as were compatible to one in his condition, from a proportionable concurrence to that effect, is nowhere said, nor intended by any of the fathers whose judgment is of account in the Church of God.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/matthew-scrivener.html">Matthew Scrivener</a></span><span class="wk"><span class="lbl">Work:</span> <cite>A Course of Divinity</cite>, ... (London: Roycroft, 1674), pt. 1, bk. 1, ch. 20, p. 76</span></figcaption>

<blockquote><p>II. As soon as a principle of new life is infused into the adult person by the Spirit of Grace, immediately spiritual acting of every kind springs up from that principle, actions so pervading and exciting one another, and so mingled in their exercise that they can scarcely be distinguished in practice; and as difficult is it to determine which is first in time, which last. Surely it is not possible but that the soul, quickened by the Spirit, should in that supernatural light wherewith it is illuminated, both see itself defiled and undone with innumerable sins, and see Christ full of grace, truth and salvation. Such a view cannot but cause both, that with shame and sorrow it be displeased with itself, and with ardent desire be carried out unto Christ. Hence arises the receiving and accepting of Christ, that it may be delivered from the fiithiness and guilt of its sins. Now it cannot receive Him for justification except at the same time it receive him for sanctification: nor receive Him as a Priest to expiate sin, unless it also receive him as a King to whom it may submit in order to obedience. Hence it follows that that act of faith whereby we receive Christ for righteousness cannot be exercised without either a previous, or at least a concomitant repentance, and a purpose of a new life. If therefore faith go before justification, as we have lately asserted; the same must be said of repentance, springing up together with it from the same principle of spiritual life.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/herman-witsius.html">Herman Witsius</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Conciliatory or Irenical Animadversions on the Controversies Agitated in Britain: under the Unhappy Names of Antinomians &amp; Neonomians</cite>, (1696; Glasgow, 1807), ch. 11, ‘Whether repentance precedes the remission of sins? [Yes]’, pp. 119-20</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/repentance-and-conversion/repentance-and-faith.html">Repentance and Faith</a></span></div>

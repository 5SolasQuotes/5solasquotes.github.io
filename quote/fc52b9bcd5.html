<blockquote><p>II. By the state of innocence, we mean the first condition of man created after the image of God internal goodness and external happiness. As it abounded in all goods (of the body as well as of the soul) necessary for obtaining true happiness in that state, so it experienced the most holy and agreeable government of God. Hence it consists principally of two parts: the happy condition of man and the federal government of God around him. His happiness arose from the image of God in which he was created. It consisted especially in original righteousness and the immortality and dominion consequent upon it (of which we have spoken before in the Topic on Creation). To it also belonged his liberty, the subject of this question.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/francis-turretin.html">Francis Turretin</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Institutes of Elenctic Theology</cite>, ed. James T. Dennison Jr., trans. George Musgrave Giger, vol. 1 (Phillipsburg, NJ: P&amp;R Publishing, 1992–97), 8.1.2 (p. 569).</span></figcaption>

<blockquote><p>§XVII. There is disagreement today whether the essence of the soul is to be constituted in actual thought itself [by Cartesians], or otherwise. Theologians and philosophers hitherto have stated: The soul is a spiritual substance endowed with the faculty of thinking; and thinking always in the first act [in its existence and power], but not always in the second [in that power’s exercise]. But certain more recent thinkers [Cartesians] wish that the very essence and substance of the rational soul is thought, or that the mind is constituted by actual thought itself. We approve the former opinion with the following arguments: (1) Because Scripture distinguishes the essence of the soul from its action or operation, i.e., thought, Prov. 19:21, “Many are the thoughts in a man’s heart,” where the heart or mind is manifestly distinguished from the thoughts. Thus in Prov. 16:9 it is said: “The heart of man plans his way.” Mt. 1519, “out of the heart proceed evil thoughts.” Paul in Rom. 9:11 says of Esau and Jacob: “when they had not yet been born, or had done any good or evil etc.” from which it appears that these twins, at least in their mother’s womb, had not yet thought. In Dan. 4:29-30, Nebuchadnezzar for seven periods lacked the use of reason and the exercise of thoughts, unless we wish to assert that Nebuchadnezzar was changed in substance into another species, and therefore was utterly deprived of all humanity and mind, from which it would follow: One Nebuchadnezzar sinned, another bore the punishment for his pride. (2) From reason: No substance, at least no created one, is constituted by its own action. Since, therefore, thought is an action of our mind, it is clear that the soul is not constituted by thought, which [Renee] Descartes does not deny in his Reply to the 3rd Objection, Obj. 2 to the 2nd Meditation, p. 82. (3) No attribute is constitutive of its substance, but is consequent to it; nor does it make the substance, but presupposes it. Thought is an attribute which is predicated of the soul, and follows it. Therefore, thought does not constitute or make its substance or subject. (4) Thoughts are multiple and numerous; therefore, for the multiplication of thoughts, the soul would have to be multiplied; for their variation, it would have to be varied; for the production of thoughts, it would have to be produced. (5) The soul can lack thoughts in the second act, for example, when a person sleeps, and in a swoon, apoplexy, and epilepsy; at which time, according to the other hypothesis, the person would lack a mind. (6) Because the learned think more than the rustic and stupid, it would follow that there is more soul in a learned person than in a rustic and stupid one. (7) According to this opinion, the simplicity of God, by which He is believed to be pure act, would not remain proper to God, but would be communicated to men. (8) This opinion is repugnant to the fathers, scholastics, theologians, and even Protestant philosophers up to these times. See Leidecker, Fac. Verit., Locus 7, Controversy 6.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/barthold-holtzfus.html">Barthold Holtzfus</a></span><span class="wk"><span class="lbl">Work:</span> <cite>‘Theological Dissertation on Creation’</cite>, (Frankfurt: Schwartz, 1712), trans. AI</span></figcaption>

07%2C%20Controversy%206&amp;text=XVII.%20There%20is%20disagreement%20today%20whether%20the%20essence&amp;text=See%20Leidecker%2C%20Fac.%20Verit.%2C%20Locus%207%2C%20Controversy%206" rel="noopener" target="_blank">Read it online · Reformed Books Online</a></div>

<blockquote><p>The nature of a thing: not how it is, but how it is meant to be… It is as though a physician who saw only broken arms assumed that if arms have no fractures there must be something wrong with them. How could we correct such a misguided physician? By calling his attention to the purpose or function of the arms, to their proper work. Broken arms cannot do their work as well as intact ones; therefore, brokenness is not their natural state. The nature of a thing is not determined by how something happens to be, but by what it is for — by what it is designed to do and to become, if everything goes well… What are men and women for? In one respect they are for the same thing: Being rational, they are for the knowledge of the truth, especially the truth about God. But there is a difference. A man is a rational being of that sex whose members are potentially fathers, and a woman is a rational being of that sex whose members are potentiality mothers. …potentiality is not the same thing as physical possibility. Consider a man who is infertile because of some disease. Although it is not physically possible for him to be a father, we should not say that he lacks the potentiality for fatherhood; as a man, he has the potentiality, but the disease has blocked its realization. It is just because he is a man, just because he is endowed with the potentiality for fatherhood, that the block to its physical realization is such an occasion for sorrow. Another reason why the expression ‘potentiality for fatherhood’ requires explanation is that although siring children is the most characteristic expression of fatherhood, it is far from its only expression… We can carry this line of reasoning still further. A potentiality is something like a calling. It wants, so to speak, to develop; it demands, so to speak, a response. It is like an arrow, notched in the string and aimed at the target, even if it never takes flight. It intimates an inbuilt meaning and expresses an inbuilt purpose, which cannot help but influence the mind and will of every person imbued with them… although not every woman is called to marry and bear physical children, ‘every woman, whether married or unmarried, is called upon to be a biological, psychological or spiritual mother.’ I am saying that for men, the reality is parallel. Not every man is called to marry and bear physical children, but every man, whether married or unmarried, is called upon to be a biological, psychological or spiritual father.</p></blockquote>

<blockquote><p>…in the case of a rational substance, an end toward which it is directed can be known intellectually, and that the will or rational appetite just is that power by virtue of which such a subtance can aim at an end qua grasped by the intellect.ª ª We can, of course, also aim at ends that are not grasped by the intellect. For example, any human being aims at the end of circulating blood through his body, just by virtue of having a heart and blood vessels, and does so even if he is completely unaware of the existence of this circulatory system. It is precisely because we can iam at such ends without the intellect being cognizent of them that their pursuit is not the subject of the will. A will that was not of its nature directed toward what the intellect takes to be good would be like an acorn that was not of its nature directed toward becoming an oak. The latter just wouldn’t really be an acorn, and the former just wouldn’t really be a will.¹ ¹ For further discussion and defense of the thesis that the will always aims at what the intellect takes to be good, see Edward Feser, ‘Being, the Good, and the Guise of the Good,’ in Daniel D. Novotny and Lukas Novak, eds., Neo-Aristotelian Perspectives in Metaphysics (London: Routledge, 2012). …A tree that did not aim at getting its branches toward the sun would not be a freer tree, but just a defective tree. And a will that did not aim at the good would not be a freer will, but just a defective will.</p></blockquote>

hub.io%2Fquote%2F24bbbd78f5.html&amp;via=5Solas" target="_blank" rel="noopener">Share on X</a><a class="perma" href="../quote/24bbbd78f5.html">Permalink</a><a class="src" href="https://reformedbooksonline.com/on-the-human-soul/#:~:text=in%20the%20case%20of%20a%20rational,will%2C%20but%20just%20a%20defective%20will&amp;text=in%20the%20case%20of%20a%20rational%20substance%2C%20an&amp;text=a%20freer%20will%2C%20but%20just%20a%20defective%20will" rel="noopener" target="_blank">Read it online · Reformed Books Online</a></div>

<blockquote><p>V. Next, we must examine those aspects that primarily and chiefly pertain here (πρώτως καὶ κυρίως, “primarily and chiefly”) [in man as unfallen]: namely, the infused and inherent habits (habitus infusi &amp; concreati), for considering only acquired habits, as the Socinians and Remonstrants do, is sheer nonsense. These habits perfected and adorned these faculties excellently, such as the clarity and rectitude of the mind, not only regarding that innate (ὑπάρχον) aspect of the divine (τὸ τοῦ θεοῦ), whether it is innate through common notions (κοιναὶ ἐννοίαι) and the subjective light of the mind, or acquired through the objective light of being, as Socinus vainly objects (Romans 1; Isaiah 40; Psalm 19; Acts 14; Romans 2).</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/andreas-essenius.html">Andreas Essenius</a></span><span class="wk"><span class="lbl">Work:</span> <cite>‘Theological Disputation on the Image of God in Man’ Download</cite>, tr. Jonathan Tomes (Utrecht: Johannes Waesberg, 1653) Latin</span></figcaption>

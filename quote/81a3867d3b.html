<main class="wrap"><figure class="quote" id="q-81a3867d3b" data-kw="">
<blockquote><p>11. This [church] covenant (thus distinguished from the Covenant of Grace) they hold to be that covenant which is sealed by the sacraments, and for the sealing and ratifying of which the sacraments were principally ordained of God, and therefore to be administered only to such as are first entered into this covenant, as seals thereof. Apology, p. 15, 19, 31; Answer to 9; pos. pp. 63 &amp; 66. And therefore, that such persons as (by their condition) cannot join in church covenant, nor live in church fellowship with a set society, are not bound to partake in sacraments. Apology, pp. 39 &amp; 41. See [John] Robinson, Justification, pp. 80 &amp; 110, though I do not find the Brownists so solicitously to distinguish between the church covenant and the Covenant of Grace as these our [Independent and congregationalist] brethren do.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/william-rathband.html">William Rathband</a></span><span class="wk"><span class="lbl">Work:</span> <cite>A Brief Narration of Some Church Courses held in Opinion &amp; Practice in the Churches lately Erected in New England… (London, 1644), ch. 4</cite>, pp. 19-20</span></figcaption>

</figure><figure class="quote" id="q-48825f517e" data-kw="">
<blockquote><p>In New England at the erection of a new [congregationalist] Church, they are content with the presence both of the magistrate and ministers of the neighbor churches, but they declare that neither is necessary, and that the presence of either gives no authority to the action, and the absence of both detracts no authority from it. That the whole power to gather a congregation and to erect a church is alone in the covenanting persons.</p></blockquote>

</figure><figure class="quote" id="q-08da34f00d" data-kw="">

<main class="wrap"><figure class="quote" id="q-7126c0e937" data-kw="">
<blockquote><p>On the other hand, we must labour for humility, prudence, gentleness, meekness. A man may be very zealous and resolute, and yet very meek and merciful: Jesus Christ was a Lion and yet a Lamb also; in one place, He telleth them He cometh to send “fire on the earth:” and, in another place, rebuketh His disciples “for their fiery spirits.” There was the composition in Moses, and in Paul; and it is of great use, especially in this work of reformation.

I have not observed any disputes carried on with more bitterness in men’s writings, and with a more unsanctified heat of spirit, yea, and by godly men too, than in controversies about discipline, church government, ceremonies, and the like. Surely, to argue about government with such ungoverned passions, to argue for reformation with a spirit so unreformed, is very uncomely.

Let us be zealous, as Christ was, to cast out all, to extirpate and root out every plant His heavenly Father hath not planted; and yet let us do it in an orderly way, and with the Spirit of Christ, whose servants we are. “The servant of the Lord must not strive, but be gentle to all men, apt to teach, patient, in meekness instructing those that oppose.” We solemnly engage this day our utmost endeavours for reformation; let us remember this, that too much heat, as well as too much coldness, may harden men in their ways, and hinder reformation.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/philip-nye.html">Philip Nye</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Solemn League and Covenant. Exhortation at Westminster (1643) in James Kerr (ed.), The Covenants and the Covenanters: Covenants, Sermons, and Documents of the Covenanted Reformation</cite></span></figcaption>

<blockquote><p>By which meanes it shall moreover come to pass (which is the other caution to be given) that not every pastor (no not with the elders of his congregation) shall be permitted to have full liberty of binding and loosing, but shall in those matters receive counsell and advice from other pastors. Howbeit for this latter purpose, the Church of Scotland has profitably provided another remedy also, namely, that in certain chief places, all the pastors in the adjacent bounds, shall at set and ordinary times assemble themselves (which assemblies in this nation we call Presbyteries) that so the Churches may be governed Communi Presbyterorum consilio [by the common counsel of presbyters], as Hierome speaks of the primitive times of the Church. 3. Though the execution of the discipline of excommunication and absolution pertain to the consistory [local session] of the pastor and elders in every Church, yet this discipline is to be by them executed in name of the whole Church (Zanchi, in 4 Praec., col. 756; D. Fulke on 1 Cor. 5:4).</p></blockquote>

</figure><figure class="quote" id="q-61eea66ae6" data-kw="">
<blockquote><p>Therefore there is no binding men’s faith to that the Scripture avers not. The Papists do bind to things:

1. Citra fundamentum, besides the foundation; as traditions, untempered mortar daubed on the walls of truth to hide it.

2. Circa fundamentum, to things about the foundation, such as endanger it: as denial of Scripture to laymen. This is a wretched sin, to obtrude for matter of faith, that it is not lawful to read the Scriptures which are the rule of faith.

3. Contra fundamentum, to things against the foundation; as the sacrifice of the mass, distinction of mortal and venial sins, justification by works, etc. What is against that which is necessarily to be believed to salvation, is against the foundation. But it is necessary to trust in Christ’s blood and merits only, because there is no other name given under heaven whereby we may be saved. (Acts 4:12) Therefore to trust in others, to let angels or men share part of our faiths, is against the foundation. Indeed they boast that they only hold the foundation: but ‘I Paul say unto you, that if ye be circumcised, Christ shall profit you nothing.’ (Gal. 5:2) If you join your own merits with Christ’s merits, he shall profit you nothing.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/thomas-adams.html">Thomas Adams</a></span><span class="wk"><span class="lbl">Work:</span> <cite>A Commentary or Exposition upon the divine Second Epistle General, written by the blessed Apostle St. Peter</cite>, (London: Badger, 1633), on ch. 1, verse 5, p. 110</span></figcaption>

<blockquote><p>§5. But we find the ancient Fathers with a holy zeal, charging such as apostates from the Church and breakers of her peace, who held opinions contrary to the essential and fundamental, or any of the great articles of the Christian Faith, so that they placed the unity of the catholic Church in a harmonious consent to these great truths. Irenaeus ([Against Heresies] bk. 1, ch. 3, p. 53, edition Cologne, 1625), having given a short account of the chief articles of the true religion, has these words: hanc igitur praedicationem, et hanc ••dem adepta Ecclesia, quamvis dispersa in universo mundo, diligenter conservat, a• si in una eademque domo habitaret, ac similiter iis fidem habet, ac si unam animam unumque et idem cor haberet; atque un• consensu hoc praedicat, docet ac tradit, ac si uno ore praedita esset. Quamvis enim dissimilia sunt in mundo genera linguarum, una tamen et eadem est vis traditionis; nec quae constitutae sunt in Germania Ecclesiae aliter credunt; nec quae in Hispania, neque in Galliis; neque in Oriente, neque in Aegypto, neque in Lybia, aut in medio Orbis terrarum fundatae sunt, sed quemadmodum Sol Creatura Dei unus et idem est in universo Mundo; ita &amp; praedicatio veritatis ubiquae lucet, &amp; illuminat eos qui ad notionem veritatis venire volunt. Eusebius (Ecclesiastical History, bk. 4, ch. 27) cites Irenaeus condemning Tatianus, the author of the sect of the Encratitae, and saying of him, [Greek], he reckoned his opinions a falling from the Church, or a breaking her unity. The same Historian, bk. 4, ch. 24, gives account of Egesippus narrating, how long the Church remained a virgin, teaching and believing nothing but the Law and the prophets, and what the Lord Himself taught, and he mentions particularly the Churches of Corinth, Rome and Jerusalem; and then shows how heresies arose, whose authors he calls false Christs, false prophets and false apostles, and of them he says, [Greek],they divided the unity of the Church by their corrupt doctrines against God, and against his Christ. Several other citations might be brought to this purpose, but these may be sufficient. I do not question but that there might be other things which might be called schism, even with respect to the universal Church, as if any should bring in idolatrous, or superstitious worship, contrary to the rules of the Gospel, or should violate any of the necessary and laudable canons of General Councils, and should set up societies in opposition, not only to one or few, but to all the societies of Christians, or all the soundest of them… §6. There is another sort of unity much regarded among the ancients, which though the breach of it had as bad influence on all, or most Churches, and so on the catholic Church: yet it properly respected neighbor Churches, either which were united by the bond of one government, a provincial, or lesser synod, being made up of them: or only living in the vicinity of one another, or having frequent occasion of correspondence; they who were not under any uniting bonds, but these commune to all the parts of the catholic Church, yet had an unity of kind correspondence, mutual assistance, as occasion offered, acquainting one another with their affairs so far as it was of any advantage: admitting the members of other Churches to communion with them on occasion, refusing communion with such members of other Churches as were by them excommunicated: and this unity was then broken when these acts of friendship were shunned or refused, especially when they who were cast out by one were received to another: or when occasional communion was either shuned by them who so joined in another Church or denied to such sojourners if they desired it: or when one Church showed rage, fury and bitterness against another because of what they differed about.</p></blockquote>

<div class="meta"><span class="t"><a href="../topics/the-church/church-unity-and-fundamentals.html">Church Unity and Fundamentals</a></span></div>
<div class="actions"><button class="copy" data-copy="“§5. But we find the ancient Fathers with a holy zeal, charging such as apostates from the Church and breakers of her peace, who held opinions contrary to the essential and fundamental, or any of the great articles of the Christian Faith, so that they placed the unity of the catholic Church in a harmonious consent to these great truths. Irenaeus ([Against Heresies] bk. 1, ch. 3, p. 53, edition Cologne, 1625), having given a short account of the chief articles of the true religion, has these words: hanc igitur praedicationem, et hanc ••dem adepta Ecclesia, quamvis dispersa in universo mundo, diligenter conservat, a• si in una eademque domo habitaret, ac similiter iis fidem habet, ac si unam animam unumque et idem cor haberet; atque un• consensu hoc praedicat, docet ac tradit, ac si uno ore praedita esset. Quamvis enim dissimilia sunt in mundo genera linguarum, una tamen et eadem est vis traditionis; nec quae constitutae sunt in Germania Ecclesiae aliter credunt; nec quae in Hispania, neque in Galliis; neque in Oriente, neque in Aegypto, neque in Lybia, aut in medio Orbis terrarum fundatae sunt, sed quemadmodum Sol Creatura Dei unus et idem est in universo Mundo; ita &amp; praedicatio veritatis ubiquae lucet, &amp; illuminat eos qui ad notionem veritatis venire volunt. Eusebius (Ecclesiastical History, bk. 4, ch. 27) cites Irenaeus condemning Tatianus, the author of the sect of the Encratitae, and saying of him, [Greek], he reckoned his opinions a falling from the Church, or a breaking her unity. The same Historian, bk. 4, ch. 24, gives account of Egesippus narrating, how long the Church remained a virgin, teaching and believing nothing but the Law and the prophets, and what the Lord Himself taught, and he mentions particularly the Churches of Corinth, Rome and Jerusalem; and then shows how heresies arose, whose authors he calls false Christs, false prophets and false apostles, and of them he says, [Greek],they divided the unity of the Church by their corrupt doctrines against God, and against his Christ. Several other citations might be brought to this purpose, but these may be sufficient. I do not question but that there might be other things which might be called schism, even with respect to the universal Church, as if any should bring in idolatrous, or superstitious worship, contrary to the rules of the Gospel, or should violate any of the necessary and laudable canons of General Councils, and should set up societies in opposition, not only to one or few, but to all the societies of Christians, or all the soundest of them… §6. There is another sort of unity much regarded among the ancients, which though the breach of it had as bad influence on all, or most Churches, and so on the catholic Church: yet it properly respected neighbor Churches, either which were united by the bond of one government, a provincial, or lesser synod, being made up of them: or only living in the vicinity of one another, or having frequent occasion of correspondence; they who were not under any uniting bonds, but these commune to all the parts of the catholic Church, yet had an unity of kind correspondence, mutual assistance, as occasion offered, acquainting one another with their affairs so far as it was of any advantage: admitting the members of other Churches to communion with them on occasion, refusing communion with such members of other Churches as were by them excommunicated: and this unity was then broken when these acts of friendship were shunned or refused, especially when they who were cast out by one were received to another: or when occasional communion was either shuned by them who so joined in another Church or denied to such sojourners if they desired it: or when one Church showed rage, fury and bitterness against another because of what they differed about.”

— Gilbert Rule, The Good Old Way Defended, (Edinburgh: Anderson, 1697), sect. 10, ‘Of Schism’ Rule was a Scottish, divine-right presbyterian minister., pp. 250-52">Copy</button><a class="share" href="https://x.com/intent/post?text=%E2%80%9C%C2%A75.+But+we+find+the+ancient+Fathers+with+a+holy+zeal%2C+charging+such+as+apostates+from+the+Church+and+breakers+of+her+peace%2C+who+held+opinions+contrary+to+the+essential+and+fundamental%2C+or+any+of+the+great+articles+of+the+Christian+Faith%2C+so+that+they+placed+the+unity+of+the+catholic+Church+in+a+harmonious+consent+to+these+great+truths.+Irenaeus+%28%5BAgainst+Heresies%5D+bk.+1%2C+ch.+3%2C+p.+53%2C+edition+Cologne%2C+1625%29%2C+having+given+a+short+account+of+the+chief+articles+of+the+true+religion%2C+has+these+words%3A+hanc+igitur+praedicationem%2C+et+hanc+%E2%80%A2%E2%80%A2dem+adepta+Ecclesia%2C+quamvis+dispersa+in+universo+mundo%2C+diligenter+conservat%2C+a%E2%80%A2+si+in+una+eademque+domo+habitaret%2C+ac+similiter+iis+fidem+habet%2C+ac+si+unam+animam+unumque+et+idem+cor+haberet%3B+atque+un%E2%80%A2+consensu+hoc+praedicat%2C+docet+ac+tradit%2C+ac+si+uno+ore+praedita+esset.+Quamvis+enim+dissimilia+sunt+in+mundo+genera+linguarum%2C+una+tamen+et+eadem+est+vis+traditionis%3B+nec+quae+constitutae+sunt+in+Germania+Ecclesiae+aliter+credunt%3B+nec+quae+in+Hispania%2C+neque+in+Galliis%3B+neque+in+Oriente%2C+neque+in+Aegypto%2C+neque+in+Lybia%2C+aut+in+medio+Orbis+terrarum+fundatae+sunt%2C+sed+quemadmodum+Sol+Creatura+Dei+unus+et+idem+est+in+universo+Mundo%3B+ita+%26+praedicatio+veritatis+ubiquae+lucet%2C+%26+illuminat+eos+qui+ad+notionem+veritatis+venire+volunt.+Eusebius+%28Ecclesiastical+History%2C+bk.+4%2C+ch.+27%29+cites+Irenaeus+condemning+Tatianus%2C+the+author+of+the+sect+of+the+Encratitae%2C+and+saying+of+him%2C+%5BGreek%5D%2C+he+reckoned+his+opinions+a+falling+from+the+Church%2C+or+a+breaking+her+unity.+The+same+Historian%2C+bk.+4%2C+ch.+24%2C+gives+account+of+Egesippus+narrating%2C+how+long+the+Church+remained+a+virgin%2C+teaching+and+believing+nothing+but+the+Law+and+the+prophets%2C+and+what+the+Lord+Himself+taught%2C+and+he+mentions+particularly+the+Churches+of+Corinth%2C+Rome+and+Jerusalem%3B+and+then+shows+how+heresies+arose%2C+whose+authors+he+calls+false+Christs%2C+false+prophets+and+false+apostles%2C+and+of+them+he+says%2C+%5BGreek%5D%2Cthey+divided+the+unity+of+the+Church+by+their+corrupt+doctrines+against+God%2C+and+against+his+Christ.+Several+other+citations+might+be+brought+to+this+purpose%2C+but+these+may+be+sufficient.+I+do+not+question+but+that+there+might+be+other+things+which+might+be+called+schism%2C+even+with+respect+to+the+universal+Church%2C+as+if+any+should+bring+in+idolatrous%2C+or+superstitious+worship%2C+contrary+to+the+rules+of+the+Gospel%2C+or+should+violate+any+of+the+necessary+and+laudable+canons+of+General+Councils%2C+and+should+set+up+societies+in+opposition%2C+not+only+to+one+or+few%2C+but+to+all+the+societies+of+Christians%2C+or+all+the+soundest+of+them%E2%80%A6+%C2%A76.+There+is+another+sort+of+unity+much+regarded+among+the+ancients%2C+which+though+the+breach+of+it+had+as+bad+influence+on+all%2C+or+most+Churches%2C+and+so+on+the+catholic+Church%3A+yet+it+properly+respected+neighbor+Churches%2C+either+which+were+united+by+the+bond+of+one+government%2C+a+provincial%2C+or+lesser+synod%2C+being+made+up+of+them%3A+or+only+living+in+the+vicinity+of+one+another%2C+or+having+frequent+occasion+of+correspondence%3B+they+who+were+not+under+any+uniting+bonds%2C+but+these+commune+to+all+the+parts+of+the+catholic+Church%2C+yet+had+an+unity+of+kind+correspondence%2C+mutual+assistance%2C+as+occasion+offered%2C+acquainting+one+another+with+their+affairs+so+far+as+it+was+of+any+advantage%3A+admitting+the+members+of+other+Churches+to+communion+with+them+on+occasion%2C+refusing+communion+with+such+members+of+other+Churches+as+were+by+them+excommunicated%3A+and+this+unity+was+then+broken+when+these+acts+of+friendship+were+shunned+or+refused%2C+especially+when+they+who+were+cast+out+by+one+were+received+to+another%3A+or+when+occasional+communion+was+either+shuned+by+them+who+so+joined+in+another+Church+or+denied+to+such+sojourners+if+they+desired+it%3A+or+when+one+Church+showed+rage%2C+fury+and+bitterness+against+another+because+of+what+they+differed+about.%E2%80%9D%0A%0A%E2%80%94+Gilbert+Rule%2C+The+Good+Old+Way+Defended%2C+%28Edinburgh%3A+Anderson%2C+1697%29%2C+sect.+10%2C+%E2%80%98Of+Schism%E2%80%99+Rule+was+a+Scottish%2C+divine-right+presbyterian+minister.%2C+pp.+250-52&amp;url=https%3A%2F%2F5solasquotes.github.io%2Fquote%2Ffb1b6b0eac.html&amp;via=5Solas" target="_blank" rel="noopener">Share on X</a><a class="perma" href="../quote/fb1b6b0eac.html">Permalink</a><a class="src" href="https://reformedbooksonline.com/that-union-in-at-least-christianitys-fundamentals-is-obliging/#:~:text=5.%20But%20we%20find%20the%20ancient,because%20of%20what%20they%20differed%20about&amp;text=5.%20But%20we%20find%20the%20ancient%20Fathers%20with&amp;text=against%20another%20because%20of%20what%20they%20differed%20about" rel="noopener" target="_blank">Read it online · Reformed Books Online</a></div>

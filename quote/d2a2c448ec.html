<main class="wrap"><figure class="quote" id="q-d2a2c448ec" data-kw="">
<blockquote><p>Repentance is an inward sorrowing, and continual mourning of the heart and conscience for sin joined with faith and both inward, and outward amendment: Inward I say in changing the thoughts and affections of the heart: and outward in changing the words, and works from evil to good. This repentance no doubt was in David, who when he was covertly reproved by the prophet Nathan, and his sins laid before his eyes, did not stubbornly defend them, and so justle against God: nor yet secretly excuse them, and daube them over, but cried out in the bitterness of his heart: I have sinned, and thereupon made the 51. Psalm.

A Psalm indeed full of dolour and heaviness: Wherein the Prophet bewaileth his falls, lamenteth his sins, and prayeth even for a new heart, and a new spirit, new thoughts, new affections, new purposes of amendment of life. So that in David we may see an inward sorrowing, a lasting grief (as the book of Psalms doth every where declare, which layeth him out as it were in an Anatomy) yea, and great reformation, both in inward, &amp; outward sins. Here therefore behold what is Repentance.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/arthur-dent.html">Arthur Dent</a></span><span class="wk"><span class="lbl">Work:</span> <cite>A sermon of repentance. A very godly and profitable Sermon, preached at Lee in Essex, by Arthur Dent, Minister of God’s word. And published at the request of sundry Godly and well disposed persons. 1581. the 7. of March</cite>, (London: John Harison, 1582), unpaginated.</span></figcaption>

</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-dfd0847676" data-kw="">
<blockquote><p>There are many today who are tired of singing the Bible Psalms in the worship of God. This has various reasons, no doubt. Some are tired of singing the Psalms because they are not willing to bear the cross of being different from the big, popular churches. The other churches sing popular hymns, and the Psalms seem to be not only different but peculiar and old-fashioned. Some object to the Psalms because they do not like theology of the Psalms, with its emphasis on the righteousness and justice of God, and His destruction of His enemies. Some object to the Psalms because they do not like the Jewish flavor and coloring of the Psalms—the names of people and places, the references to the history of the children of Israel, the Hebrew flavor of the language. …Those who object to the Psalms do not want to dwell in the tents of Shem.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/johannes-g-vos.html">Johannes G. Vos</a></span><span class="wk"><span class="lbl">Work:</span> <cite>“Singing The Whole Of the Psalter, Wholeheartedly. Ashamed of the Tents of Shem?</cite></span></figcaption>
<div class="meta"><span class="t"><a href="../topics/worship/psalmody.html">Psalmody</a></span></div>

<blockquote><p>43. Vocal prayer is either in prose, or in meter.

44. In meter singing is joined, and therefore there must be more care of the speech and tone, then in prose.

45. But the melody of singing is ordained for a certain spiritual delight, whereby the mind is detained in the meditation of the thing that is sung. … 48. But because this religious melody has the respect of prayers: therefore it is not so fit, that the Decalogue, and other such like which do not partake the nature of prayer, be turned into meter and be sung instead of psalms.</p></blockquote>

</figure><figure class="quote" id="q-ff57609447" data-kw="">
<blockquote><p>Though the “Book of Praises” was gathered during the OT era and used in the Temple’s worship, its full intent as a canon of praise could not be fully grasped until Christ came. Its intent was to reveal and praise the Savior-King who would fulfill all the promises of God’s covenant with Israel. Jesus Christ must therefore be understood as the Sovereign of the Psalter, but also as the source of and the purpose for the development of the canon of the Psalter.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/rpcna-synodical-study-committee-on-worship.html">RPCNA Synodical Study Committee on Worship</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Psalms in the Worship of the Church</cite>, “The Psalms in the Worship of the Church.” Submitted to the Synod of the RPCNA, June 2004</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/worship/psalmody.html">Psalmody</a></span></div>

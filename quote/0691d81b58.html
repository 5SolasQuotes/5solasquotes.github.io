<blockquote><p>Objection 3: If kings be governors in all causes over all persons, then may they dissolve churches and their government, and mold and order them as they will. Answer: So far as Church constitution, government and ordering is by Christ’s appointment, or such example which has the force of an institution of Christ, it may not be altered by a king; But in such things as are left to human prudence, and there is a concernment of the weal-public, kings have authority to order them so, as that they tend to the real good and advantage of the churches of Christ and the glory of God, which is the highest and ultimate end of all. Objection 4: This will make the use of synods and assemblies of pastors to determine things of religion and to order government unnecessary, since the determination of all will lie in the king’s breast. Answer: Though statute-laws require the king’s assent, and the government is to be exercised in his name, by his commission, yet are not debates in parliament and passing bills by both Houses, nor consultations with judges, nor their decisions of cases unnecessary [but assumed in the oath]: The like is to be said of the use of synods and assemblies of Pastors and learned men, though the calling of them, and validity of their canons, that is rules, in respect of the imposing them on others with civil penalties, require the king’s concurrence. Objection 5. This has occasioned great evils in so much that persecution has been raised against godly persons as heretiques and schismatics, when princes have been misled so as to burn, banish, imprison and otherwise to afflict persons judged by prelates and others to be such. Answer: ‘Tis true this has fallen out when princes ignorant of the true religion, corrupted in their education, perverted by seducers and ungodly guides in their judgments have yielded too much to the misinformation of others, and so have been unhappy in the abuse of their government to the great hurt in life, liberty and estate of innocent persons: And the like has been in mal-administration of civil affairs through the like causes: yet the power and authority in neither is to be denied for some abuse: for that would introduce a worse evil of anarchy and mischievous confusions. On the other side when princes have been good, and have used such good counselors, as Jehoiada was to Joash, their government in religion has been of great advantage to the Church of Christ. And as things have stood in England, it was the means under God whereby Popery was expelled and the protestant Reformation was established. … Objection 8: The acknowledgement of this supremacy of the king has been opposed by sundry godly protestants who have in their writings excepted against it, as Calvin and the Century writers of Magdeburg. Answer: Tis true they excepted against the title of Head of the Church given to King Henry VIII, as Stephen Gardiner [a Papist] and such like persons misreported it, as if it gave to the king an uncontrollable authentic power, to determine of faith and worship of God: but when those learned protestants better understood what was meant by it, they withdrew their exceptions, as doctor Rainold shows in his Conference with Hart in the Tower [1584], ch. 10 [pp. 673-74]. Objection 9: Many godly persons are offended with the taking and defending the lawfulness of the taking of this oath as fearing it many tend to the taking away those liberties of their consciences in religion, which are dearer to them then their lives: and being jealous of those who take it, lest they betray those liberties. Answer: It is to be considered by those conscientious persons who make this objection that the takers, and defenders of the taking of this oath do apprehend that the imposing this oath was for the excluding the Pope’s jurisdiction and other foreign power, as the admonition of Queen Elizabeth here prefixed shows… But they that have taken it, or conceive they may take it if imposed, do it, as being satisfied in their consciences by the foregoing arguments or such like that they do but what they may do lawfully without offence, and hope that it will fall out as it did in the business of the altar of Ed, Josh. 22, that a right intelligence of their fact will prevent any breach between them and others and unite them more closely.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/john-tombes.html">John Tombes</a></span><span class="wk"><span class="lbl">Work:</span> <cite>A Serious Consideration of the Oath of the King’s Supremacy</cite>, … (London: Hills, 1660) 27 pp., pp. 22-23</span></figcaption>

<blockquote><p>But what then is the part of the Prince after that the Church has given judgement? Surely, whensoever need is, he ought by the private judgement of Christian discretion to try and examine whether this [ecclesiastical] discipline be rightly executed or not. If he find the execution thereof to be unreproveable and that yet the sinner goes on in his contumacy, then by his civil power he ought further to punish him in his person, or wordly estate, that he may either reform or repress such a one as has not been terrified by the Church’s censures (Calvin, Book of Epistles, col. 169; Gratian., Caus. 11, q. 1, ch. 20). But if after trial, he understand that the sentence given forth is unjust and erroneous, either through the ignorance or the malice of the ecclesiastical and regular judges, then he ought to interpone his authority, and cause a due proceeding [in ecclesiastical courts], for in such extraordinary cases of the failing of ecclesiastical persons, Princes may do much in things and causes Spiritual which ordinarily they cannot.</p></blockquote>

<blockquote><p>The second duty is obedience, to be performed by all persons, and in all things possible (the contrary whereof God commands not), though hard and unequal… and this obedience must be to all governors, to the king as superior, and to the rest appointed by him, and to these, whether Christian or heathen, good or bad, merciful or cruel, for there is no power but of God (Rom. 13:1). The third is piety, that subjects pray for their governors, yea though they were infidels, or wicked: Thus did Daniel, thus did the ancient Christians for the heathen emperors, for their long life and safety… … Use 2. Hence it appears that the Pope with his limbs are the great rebels of the world; for not only pulling their necks as ecclesiastical persons from the yoke of the emperor and their sons’ reigns, but especially for seeking to overrule, depose and destroy the kings and kingdoms of the earth. Use 3. Learn they duty. Thy calling is to be subject… Pay all subsidies, tares, customs, etc…. and surely, if we must willingly pay to a heathen, much more to a Christian, religious, merciful, and renowned king.</p></blockquote>

— Elnathan Parr, The Grounds of Divinity Plainly Discovering the Mysteries of Christian Religion… (London, 1615), pp. 361-4. Parr (d. 1632?) was a reformed Anglican.">Copy</button><a class="share" href="https://x.com/intent/post?text=%E2%80%9CThe+second+duty+is+obedience%2C+to+be+performed+by+all+persons%2C+and+in+all+things+possible+%28the+contrary+whereof+God+commands+not%29%2C+though+hard+and+unequal%E2%80%A6+and+this+obedience+must+be+to+all+governors%2C+to+the+king+as+superior%2C+and+to+the+rest+appointed+by+him%2C+and+to+these%2C+whether+Christian+or+heathen%2C+good+or+bad%2C+merciful+or+cruel%2C+for+there+is+no+power+but+of+God+%28Rom.+13%3A1%29.+The+third+is+piety%2C+that+subjects+pray+for+their+governors%2C+yea+though+they+were+infidels%2C+or+wicked%3A+Thus+did+Daniel%2C+thus+did+the+ancient+Christians+for+the+heathen+emperors%2C+for+their+long+life+and+safety%E2%80%A6+%E2%80%A6+Use+2.+Hence+it+appears+that+the+Pope+with+his+limbs+are+the+great+rebels+of+the+world%3B+for+not+only+pulling+their+necks+as+ecclesiastical+persons+from+the+yoke+of+the+emperor+and+their+sons%E2%80%99+reigns%2C+but+especially+for+seeking+to+overrule%2C+depose+and+destroy+the+kings+and+kingdoms+of+the+earth.+Use+3.+Learn+they+duty.+Thy+calling+is+to+be+subject%E2%80%A6+Pay+all+subsidies%2C+tares%2C+customs%2C+etc%E2%80%A6.+and+surely%2C+if+we+must+willingly+pay+to+a+heathen%2C+much+more+to+a+Christian%2C+religious%2C+merciful%2C+and+renowned+king.%E2%80%9D%0A%0A%E2%80%94+Elnathan+Parr%2C+The+Grounds+of+Divinity+Plainly+Discovering+the+Mysteries+of+Christian+Religion%E2%80%A6+%28London%2C+1615%29%2C+pp.+361-4.+Parr+%28d.+1632%3F%29+was+a+reformed+Anglican.&amp;url=https%3A%2F%2F5solasquotes.github.io%2Fquote%2F26dcc05369.html&amp;via=5Solas" target="_blank" rel="noopener">Share on X</a><a class="perma" href="../quote/26dcc05369.html">Permalink</a><a class="src" href="https://reformedbooksonline.com/difference-of-religion-does-not-make-void-the-magistrates-authority/#:~:text=The%20second%20duty%20is%20obedience%2C%20to,Christian%2C%20religious%2C%20merciful%2C%20and%20renowned%20king&amp;text=The%20second%20duty%20is%20obedience%2C%20to%20be%20performed&amp;text=to%20a%20Christian%2C%20religious%2C%20merciful%2C%20and%20renowned%20king" rel="noopener" target="_blank">Read it online · Reformed Books Online</a></div>

<blockquote><p>Forasmuch as it has pleased the Almighty God by the wise disposition of his divine providence so to Order and dispose of things that we… are now cohabiting and dwelling in and upon the River of Conectecotte… And well knowing where a people are gathered together the word of God requires that to maintain the peace and union of such a people there should be an orderly and decent Government established according to God… do therefore… enter into Combination and Confederation together, to maintain and preserve the liberty and purity of the gospel of our Lord Jesus which we now profess, as also the discipline of the Churches, which according to the truth of the said gospel is now practiced amongst us… 1. It is Ordered, sentenced and decreed that there shall be yearly two general Assemblies or Courts… wherein shall be yearly chosen form time to time so many magistrates and other public officers… Whereof one to be chosen Governor… which… shall have power to administer justice according to the Laws here established, and for want thereof according to the rule of the word of God… … The Oath of the Governor, for the [Present] I N. W…. do swear by the great and dreadful name of the everliving God, to promote the public good and peace of the same… and will further the execution of Justice according to the rule of God’s word; so help me God, in the name of the Lord Jesus Christ.</p></blockquote>

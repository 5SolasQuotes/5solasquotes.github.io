</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-675aaeb028" data-kw="">
<blockquote><p>She who bare (really) bare; and although she was a virgin when she conceived, she was a wife when she brought forth her son. Now, as a wife, she was under the very law of opening the womb, wherein it was quite immaterial whether the birth of the male was by virtue of a husband’s co-operation or not; it was the same sex that opened her womb. Indeed, hers is the womb on account of which it is written of others also: ‘Every male that opens the womb shall be called holy to the Lord.&#x27;</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/tertullian.html">Tertullian</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Other citations (work not named)</cite>, On the Flesh of Christ, 23</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/rome/mary-and-the-saints.html">Rome: Mary and the Saints</a></span></div>

</figure><figure class="quote" id="q-5d0cbfd433" data-kw="">
<blockquote><p>Whether she was a virgin before birth, during birth and after birth? It is affirmed. Whether she remained for the whole of life in that state of virginity? It is denied. It is permitted to be investigated.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/gisbertus-voetius.html">Gisbertus Voetius</a></span><span class="wk"><span class="lbl">Work:</span> <cite>A Syllabus of Theological Problems, which, for the Needed Thing to be Proposed or Pressed, are Accustomed to be Used in Private &amp; Public Exercises of Disputations, Examinations, Gatherings &amp; Consultations</cite>, … (Utrecht, 1643), Part 1, 2nd Section, ‘Of Redemption’, Tract 2, ‘Of the Person, Offices &amp; States of Christ the Mediator’, I. ‘Of the Person of Christ the Mediator’, 1. ‘Of the Assumption &amp; Union of the Human Nature’, ‘Of Mary the Mother of Christ’, no page number. In Voet’s explanations of the Latin abbreviations, he explains “Disq” by saying that it can also mean ‘It is investigated’ as long as neither side is said to be determined. And it is probably able to be investigated and [publicly] disputed on either side.</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/rome/mary-and-the-saints.html">Rome: Mary and the Saints</a></span></div>

</figure><figure class="quote" id="q-b26669486a" data-kw="Mary">
<blockquote><p>As at other times, he put a comparative neglect upon his mother, which seemed purposely designed to obviate the extravagant respect which men in aftertimes would be apt to pay her. Our respect ought to be guided and governed by Christ&#x27;s; now the virgin Mary, or Christ&#x27;s mother, is not equalled with, but postponed to, ordinary believers, on whom Christ here puts a superlative honour.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/matthew-henry.html">Matthew Henry</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Commentary on the Whole Bible</cite>, Mark 3:31-35</span></figcaption>

</figure><figure class="quote" id="q-b48112252c" data-kw="Mary Queen of Heaven Mediator">

<main class="wrap"><figure class="quote" id="q-fdea1702b8" data-kw="">
<blockquote><p>Your next exception against the presbytery is for their expectants, these be the sons of the prophers, who in their preparations for the ministry, at their first exercises for assay and trial are heard in the presbytery; with this practise no reasonable man can find fault; it is naturally impossible for any, without a miracle, to attain the habit of preaching but by diverse initial and preparatory actions; where can these be so fitly performed as in the classes [presbyteries]? The expectants are present in the classes for their training, not as members, for they do not voice in any matters of discipline. The true mystery of this controversy is that the expectants [in Anglicanism] are permitted to preach before the holy hands of a bishop have conferred upon them the order of a deacon, and so [have] power to preach and baptize: The Church of Scotland did always reject this corruption as clearly contrary to Scripture.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/robert-baillie.html">Robert Baillie</a></span><span class="wk"><span class="lbl">Work:</span> <cite>An Historical Vindication of the Government of the Church of Scotland</cite>, … (1646), ‘The Unloading of Issachar’s Burden’, p. 22</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/church-government-and-the-ministry/the-call-to-ministry.html">The Call to Ministry</a></span></div>

d it online · Reformed Books Online</a></div>

<blockquote><p>4th Conclusion is this… Now if a church should be in a remote island, not consociate with other churches, and yet wanting guides [officers], our [congregationalist] brethren say in this case, the power of the keys should be seen to be in believers, and they might choose and ordain their own officers. I grant they have great [Romanist] schoolmen to say with them… But I say in this case necessity is an unbooked and naughty lawyer, and God extraordinarily should supply the want of ordination, as He can do the defect of second causes: so that if God send some pastors to a congregation that were unwilling to choose their own eldership, pastors might ordain themselves pastors in that case to these people, and God should supply their want of popular election…</p></blockquote>

<blockquote><p>XXV. As every escape, error, or act of unfaithfulness (even known and continued in) whether in a minister’s entry to the ministry, or in his doctrine or deportment, does not non-minister him, nor give sufficient ground to withdraw from, or reject him as a minister of Christ: So neither does every enormity, mis-demeanure or act of tyranny, injustice, perfidy or profanity etc. in the civil magistrate, whether as to his way of entry to that office or in the execution of it, or in his private and personal behavior, denominate him a tyrant or an usurper, or give sufficient ground to divest him of his magistratical power, and reject him as the lawful magistrate.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/robert-mcward.html">Robert McWard</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Banders Disbanded</cite>, (1681), p. 47 McWard was a protege of Rutherford and leader of the Scottish covenanters.</span></figcaption>

</figure><figure class="quote" id="q-537ce0a611" data-kw="">
<blockquote><p>Where such sins are made the condition of ministration by men in power, as that all the whole ministry of a kingdom are bound in conscience to deny consent and conformity thereto [such as in 1662 in England], it is the duty of all the ministry in primo instante [‘in the first instance’], to forbear their ministerial office or [for] none [of them to do so]; for the reason is the same to all. For example: If ten or twenty untrue or unrighteous forbidden things must be subscribed, declared, covenanted or sworn, or as many sins practiced, yea were it but one, no doubt but the whole ministry is bound to deny conformity to any one such thing.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/richard-baxter.html">Richard Baxter</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Nonconformists’ Plea for Peace, or an Account of their Judgment in Certain Things in which they are Misunderstood</cite>, … (London, 1679), sect. 6, p, 114</span></figcaption>

</figure><figure class="quote" id="q-df48ea1b24" data-kw="">
<blockquote><p>But they differ, in that the pastor labors in the word of exhortation, that is, by the gift of wisdom applies the word to the manners of his flock, and that in season and out of season, as he knows their particular cases to require. The doctor labors in the word of doctrine, that is, without such applications as the pastor uses; by simple teaching he preserves the truth and sound interpretation of the Scriptures, against all heresy and error. The ruling elder doth neither of these, but labors in the government and policy of the church only. The Apostle has distinguished these three sorts of elders, 1 Tim. 5.17, “Let elders that rule well be counted worthy of double honor, especially they who labor in the word and doctrine.” Where, as [Theodore] Beza notes, he distinguished the word, which is the pastor’s part, from doctrine, which is the doctor’s part. Even as Rom. 12:7,8, he distinguishes teaching from exhortation; and 1 Cor. 12:8, puts “the word of wisdom,” and “the word of knowledge,” for two different things. Now, besides those elders which labor in the word, and those which labor in doctrine, Paul speaks to Timothy of a third sort of elders, which labor neither in the word nor doctrine, but in ruling well. Hence it appears how truly the Book of Policy, ch. 2, says, That there are four ordinary, perpetual, and necessary offices in the church, the office of the pastor, the doctor, the elder, and the deacon; and that no other office, which is not one of these four, ought to be received, or suffered in the church.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/george-gillespie.html">George Gillespie</a></span><span class="wk"><span class="lbl">Work:</span> <cite>An Assertion of the Government of the Church of Scotland in the points of Ruling-Elders and of the Authority of Presbyteries and Synods</cite>, ch. 2:</span></figcaption>

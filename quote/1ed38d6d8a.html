<main class="wrap"><figure class="quote" id="q-1ed38d6d8a" data-kw="">
<blockquote><p>Of joining with the congregation in hearing the Word, even read as well as preached. See what a reverend respect God’s people shewed even to the Word read, Nehem 8, 3. The ears of all the people were attentive unto the book of the Law; and ver. 5. When Ezra opened the book (to read it) all the people stood up.

Make conscience to join with the congregation in those prayers that are read as well as in those that are conceived. For those that are read are holy, &amp; good prayers, and all the congregation should make their prayers and supplications with one accord, as they did, Act. 1. 14. Hold thy self bound to join with the congregation in singing of Psalms also. See how well God shewed himself to be pleased with this duty, 2 Chron. 20. 22. When they began to sing, and to praise; the Lord set ambushments against the children of Ammon, &amp;c.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/arthur-hildersham.html">Arthur Hildersham</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The doctrine of fasting and prayer, and humiliation for sin. Delivered in sundry sermons at the fast appointed by publique authority, in the year 1625</cite>, (London: Edward Brewster, 1633), p. 65.</span></figcaption>

<blockquote><p>43. Vocal prayer is either in prose, or in meter.

44. In meter singing is joined, and therefore there must be more care of the speech and tone, then in prose.

45. But the melody of singing is ordained for a certain spiritual delight, whereby the mind is detained in the meditation of the thing that is sung. … 48. But because this religious melody has the respect of prayers: therefore it is not so fit, that the Decalogue, and other such like which do not partake the nature of prayer, be turned into meter and be sung instead of psalms.</p></blockquote>

<blockquote><p>St. Paul giving a rule how men should sing, first says, “I will sing in voice, and I will sing with understanding.” And in another place, showing what songs should be song, exhorts the Ephesians to “edify one another with psalms, songs of praise, and such as are spiritual, singing in their hearts to the Lord with thanks giving.” As if the Holy Ghost would say, that the song did inflame the heart to call upon God, and praise him with a more fervent and lively zeal. And as music or singing is natural unto us, and therefore every man delights therein; so our merciful God sets before our eyes, how we may rejoice and singe to the glory of his name, recreation of our spirits, and profit of ourselves. But as there is no gift of God so precious or excellent, that Satan has not after a sort drawn to himself and corrupt, so has he most impudently abused this notable gift of singing, chiefly by the Papists his ministers, in disfiguring it, partly by strange language, that cannot edify, and partly by a curious wanton sort, hiring men to tickle the ears and flatter the fantasies, not esteeming it as a gift approved by the Word of God, profitable for the Church, and confirmed by all antiquity. As, besides other places, is most manifest by the words of Pliny, called the younger, who, when he was depute in Asia unto the Emperor Trajan, and had received charge to inquire out the Christians to put them to death, writ among other things, touching the Christians, “That their manners were to sing verses or psalms early in the morning to Christ their God.” If any, perhaps, would doubt, when, or by whom these churches or assemblies were institute, it is likewise evident, that St. John the Apostle, who, although in Domitian’s time he was banished in the Isle Patmos; yet when Nerva his successor, and next before Trajan reigned, returned to Ephesus, and so planted the churches, as the stories report. Seeing therefore God’s Word does approve it, antiquity bears witness thereof, and best reformed Churches have received the same, no man can reprove it, except he will condemn God’s Word, despise antiquity, and utterly condemn the godly reformed Churches. And there are no songs more appropriate than the Psalms of the Prophet David, which the Holy Ghost has framed to the same use, and commended to the Church, as containing the effect of the whole Scriptures, that hereby our hearts might be more lively touched, as appears by Moses, Hezekiah, Judith, Debora, Mary, Zechariah, and others, who by songs and metre, rather than in their common speech and prose, gave thanks to God for such comfort as He sent them. Here it were to long to entreat of the metre; but for as much as the learned doubt not thereof, and it is plainly proven that the Psalms are not only metre, and contain just pauses, but also have grace and majesty in the verse more than any other places of the Scriptures, we need not to enter into any probation. For they that are skillful in the Hebrew tongue, [Read Moses Chabib, in his books called, מרפא לשון דרכי נרעם] by comparing the Psalms with the rest of the Scriptures, easily may perceive the metre. And to whom is it not known, how the Holy Ghost by all means sought to help our memory, when he fashioned many Psalms according to the letters of the alphabet; so that every verse begins with the letters thereof in order. Sometimes ‘A’ begins the half verse, and ‘B’ the other half; and in another place, three verses, yea and eight verses with one letter, even the Psalm throughout; as if all men should be inflamed with the love thereof, both for variety of matter, and also briefness, easiness, and delectation. Now, to make you privy also why we altered the rhyme in certain places of him, whom for the gifts that God had given him, we esteemed and reverenced, this may suffice: that in this enterprise, we did only set God before our eyes, and therefore weighed the words and sense of the Prophet, rather considering the meaning thereof than what any man had write. And chiefly being in this place, whereas most perfect and godly judgment did assure us, and exhortations to the same encourage us, we thought it better to frame the rhyme to the Hebrew sense, than to bind that sense to the English meter: and so either altered for the better, in such places as he had not attained unto, or else where he had escaped part of the verse, or sometimes the whole, we added the same, not as men desirous to find faults, but only as such which covet to hide them, as the learned can judge.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/william-whittingham.html">William Whittingham</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Prefatory Letter to The Form of Prayers and Ministration of the Sacraments, etc., used</cite>, (Edinburgh, 1562)</span></figcaption>

nsidering the meaning thereof than what any man had write. And chiefly being in this place, whereas most perfect and godly judgment did assure us, and exhortations to the same encourage us, we thought it better to frame the rhyme to the Hebrew sense, than to bind that sense to the English meter: and so either altered for the better, in such places as he had not attained unto, or else where he had escaped part of the verse, or sometimes the whole, we added the same, not as men desirous to find faults, but only as such which covet to hide them, as the learned can judge.”

— William Whittingham, Prefatory Letter to The Form of Prayers and Ministration of the Sacraments, etc., used, (Edinburgh, 1562)">Copy</button><a class="share" href="https://x.com/intent/post?text=%E2%80%9CSt.+Paul+giving+a+rule+how+men+should+sing%2C+first+says%2C+%E2%80%9CI+will+sing+in+voice%2C+and+I+will+sing+with+understanding.%E2%80%9D+And+in+another+place%2C+showing+what+songs+should+be+song%2C+exhorts+the+Ephesians+to+%E2%80%9Cedify+one+another+with+psalms%2C+songs+of+praise%2C+and+such+as+are+spiritual%2C+singing+in+their+hearts+to+the+Lord+with+thanks+giving.%E2%80%9D+As+if+the+Holy+Ghost+would+say%2C+that+the+song+did+inflame+the+heart+to+call+upon+God%2C+and+praise+him+with+a+more+fervent+and+lively+zeal.+And+as+music+or+singing+is+natural+unto+us%2C+and+therefore+every+man+delights+therein%3B+so+our+merciful+God+sets+before+our+eyes%2C+how+we+may+rejoice+and+singe+to+the+glory+of+his+name%2C+recreation+of+our+spirits%2C+and+profit+of+ourselves.+But+as+there+is+no+gift+of+God+so+precious+or+excellent%2C+that+Satan+has+not+after+a+sort+drawn+to+himself+and+corrupt%2C+so+has+he+most+impudently+abused+this+notable+gift+of+singing%2C+chiefly+by+the+Papists+his+ministers%2C+in+disfiguring+it%2C+partly+by+strange+language%2C+that+cannot+edify%2C+and+partly+by+a+curious+wanton+sort%2C+hiring+men+to+tickle+the+ears+and+flatter+the+fantasies%2C+not+esteeming+it+as+a+gift+approved+by+the+Word+of+God%2C+profitable+for+the+Church%2C+and+confirmed+by+all+antiquity.+As%2C+besides+other+places%2C+is+most+manifest+by+the+words+of+Pliny%2C+called+the+younger%2C+who%2C+when+he+was+depute+in+Asia+unto+the+Emperor+Trajan%2C+and+had+received+charge+to+inquire+out+the+Christians+to+put+them+to+death%2C+writ+among+other+things%2C+touching+the+Christians%2C+%E2%80%9CThat+their+manners+were+to+sing+verses+or+psalms+early+in+the+morning+to+Christ+their+God.%E2%80%9D+If+any%2C+perhaps%2C+would+doubt%2C+when%2C+or+by+whom+these+churches+or+assemblies+were+institute%2C+it+is+likewise+evident%2C+that+St.+John+the+Apostle%2C+who%2C+although+in+Domitian%E2%80%99s+time+he+was+banished+in+the+Isle+Patmos%3B+yet+when+Nerva+his+successor%2C+and+next+before+Trajan+reigned%2C+returned+to+Ephesus%2C+and+so+planted+the+churches%2C+as+the+stories+report.+Seeing+therefore+God%E2%80%99s+Word+does+approve+it%2C+antiquity+bears+witness+thereof%2C+and+best+reformed+Churches+have+received+the+same%2C+no+man+can+reprove+it%2C+except+he+will+condemn+God%E2%80%99s+Word%2C+despise+antiquity%2C+and+utterly+condemn+the+godly+reformed+Churches.+And+there+are+no+songs+more+appropriate+than+the+Psalms+of+the+Prophet+David%2C+which+the+Holy+Ghost+has+framed+to+the+same+use%2C+and+commended+to+the+Church%2C+as+containing+the+effect+of+the+whole+Scriptures%2C+that+hereby+our+hearts+might+be+more+lively+touched%2C+as+appears+by+Moses%2C+Hezekiah%2C+Judith%2C+Debora%2C+Mary%2C+Zechariah%2C+and+others%2C+who+by+songs+and+metre%2C+rather+than+in+their+common+speech+and+prose%2C+gave+thanks+to+God+for+such+comfort+as+He+sent+them.+Here+it+were+to+long+to+entreat+of+the+metre%3B+but+for+as+much+as+the+learned+doubt+not+thereof%2C+and+it+is+plainly+proven+that+the+Psalms+are+not+only+metre%2C+and+contain+just+pauses%2C+but+also+have+grace+and+majesty+in+the+verse+more+than+any+other+places+of+the+Scriptures%2C+we+need+not+to+enter+into+any+probation.+For+they+that+are+skillful+in+the+Hebrew+tongue%2C+%5BRead+Moses+Chabib%2C+in+his+books+called%2C+%D7%9E%D7%A8%D7%A4%D7%90+%D7%9C%D7%A9%D7%95%D7%9F+%D7%93%D7%A8%D7%9B%D7%99+%D7%A0%D7%A8%D7%A2%D7%9D%5D+by+comparing+the+Psalms+with+the+rest+of+the+Scriptures%2C+easily+may+perceive+the+metre.+And+to+whom+is+it+not+known%2C+how+the+Holy+Ghost+by+all+means+sought+to+help+our+memory%2C+when+he+fashioned+many+Psalms+according+to+the+letters+of+the+alphabet%3B+so+that+every+verse+begins+with+the+letters+thereof+in+order.+Sometimes+%E2%80%98A%E2%80%99+begins+the+half+verse%2C+and+%E2%80%98B%E2%80%99+the+other+half%3B+and+in+another+place%2C+three+verses%2C+yea+and+eight+verses+with+one+letter%2C+even+the+Psalm+throughout%3B+as+if+all+men+should+be+inflamed+with+the+love+thereof%2C+both+for+variety+of+matter%2C+and+also+briefness%2C+easiness%2C+and+delectation.+Now%2C+to+make+you+privy+also+why+we+altered+the+rhyme+in+certain+places+of+him%2C+whom+for+the+gifts+that+God+had+given+him%2C+we+esteemed+and+reverenced%2C+this+may+suffice%3A+that+in+this+enterprise%2C+we+did+only+set+God+before+our+eyes%2C+and+therefore+weighed+the+words+and+sense+of+the+Prophet%2C+rather+considering+the+meaning+thereof+than+what+any+man+had+write.+And+chiefly+being+in+this+place%2C+whereas+most+perfect+and+godly+judgment+did+assure+us%2C+and+exhortations+to+the+same+encourage+us%2C+we+thought+it+better+to+frame+the+rhyme+to+the+Hebrew+sense%2C+than+to+bind+that+sense+to+the+English+meter%3A+and+so+either+altered+for+the+better%2C+in+such+places+as+he+had+not+attained+unto%2C+or+else+where+he+had+escaped+part+of+the+verse%2C+or+sometimes+the+whole%2C+we+added+the+same%2C+not+as+men+desirous+to+find+faults%2C+but+only+as+such+which+covet+to+hide+them%2C+as+the+learned+can+judge.%E2%80%9D%0A%0A%E2%80%94+William+Whittingham%2C+Prefatory+Letter+to+The+Form+of+Prayers+and+Ministration+of+the+Sacraments%2C+etc.%2C+used%2C+%28Edinburgh%2C+1562%29&amp;url=https%3A%2F%2F5solasquotes.github.io%2Fquote%2Faa6a5b1feb.html&amp;via=5Solas" target="_blank" rel="noopener">Share on X</a><a class="perma" href="../quote/aa6a5b1feb.html">Permalink</a><a class="src" href="https://reformedbooksonline.com/singing-of-praise#:~:text=St.%20Paul%20giving%20a%20rule%20how,them%2C%20as%20the%20learned%20can%20judge&amp;text=St.%20Paul%20giving%20a%20rule%20how%20men%20should&amp;text=to%20hide%20them%2C%20as%20the%20learned%20can%20judge" rel="noopener" target="_blank">Read it online · Reformed Books Online</a></div>

<blockquote><p>There is felt to be something incomplete in the character of one with whom everything has gone smoothly, and who has never known sorrow or anxiety. That jovial high-spirited man may be a pleasant companion in our lighter hours, but is it to him we would turn for advice in our own anxiety, or for sympathy in our own affliction.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/george-salmon.html">George Salmon</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Cathedral and University Sermons</cite>, (2nd edn, London: John Murray, 1901), pp 176-77.</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/trials-the-cross-and-comfort/suffering-and-the-cross.html">Suffering and the Cross</a></span></div>

</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-c3d5ad474f" data-kw="">
<blockquote><p>In early youth, we cannot avoid hearing much on the subject of affliction. As we are making our way forward to mature life, we perceive countenances sad, and we are often told, though it affects us little, that the time is coming when we shall be taught, as all others have been, that this is a suffering world. And whether we look into our Bibles, or read the records of those who have taken note of the history of our race, our attention is drawn to the fact, that none are exempt from the common lot. The child has been accustomed to look upon the countenance of maternal love, and, strange to tell, without any evidence of sickness or of bodily suffering, it bears the marks of anguish, and the big tear is stealing down that cheek which, till now, has been gladdened with a smile. …

It is but too true, that many are chastened, or visited with affliction, who either do not know the source of it, or do not take heed whence it comes. They smart under their affliction, whether approaching them in the form of poverty reverses, or death; nay, some are much cast down by them; but they do not connect them with the Supreme Disposer of events. Mistake me not. I do not speak of avowed unbelievers — of such as, if questioned, would say, that they are persuaded that the Supreme Being takes no cognizance of the petty affairs of men. It is of those who would warmly and heartily repudiate such a statement as irrational, and opposed, not only to their judgments, but their feelings too. But those now adverted to are such as practically receive their trials, as indeed they do their comforts and mercies, without connecting them with God as the source.

Affliction does indeed produce an impression of a stronger kind upon them than prosperity. It stuns them, and we are willing to admit that, for the moment, there may be a reflection of something like a Divine cause being the author. But this reflection (reflection is too strong a term — it is a mere passing shadow of a thought) — this reflection goes off, and is succeeded by a sort of feeling of fatalism — a conclusion that it is our lot — we have suffered loss — we have been deprived of what we loved — we have been bereaved — and, under these circumstances, we must bear as men what we cannot help, and continue the labours of life, which have for a time been interrupted. The path of life is resumed. New occupations, new pleasures, new cares, come in, and the remembrance of the affliction is avoided is what tends to do nothing else than to introduce painful and gloomy ideas. It stands forth, in the record of memory, an event by itself, having no relation to any cause, and leaving no effect of a moral kind behind to prove that it has occurred.

Such is the manner in which many receive affliction; and this, we need scarcely say, is not the way in which it should be received, or indeed is received, by the people of God. So far from this, their language — the language of their hearts — is. Thou hast chastised me — thou hast afflicted me — the Lord hath done it — it was no chance that visited me — no concurrence of events without the direction of Jehovah — it was thine arm which launched the dart that reached my heart — Jehovah hath done this — it was Thou that didst cast down the accumulations which I had raised by honest industry — it was Thou that didst take Rachel from my bosom — it was Thou that wouldst have my Isaac — the Lord gave, and the Lord hath taken away.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/joseph-thorburn.html">Joseph Thorburn</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Sanctified Affliction (November 1844) in The Free Church Pulpit; Consisting of Discourses by the Most Eminent divines of the Free Church of Scotland. Vol. I.</cite></span></figcaption>

<blockquote><p>In this discussion I labour under several disadvantages, and among other things unfavourable to a fair hearing, I have the unpopular side of this controversy. No proof, however, that I am not on the right side. The world will wonder after my antagonist, and swallow his arguments with avidity, while, with many persons, mine will nauseate at sight — will stir up prejudice and passion, and awaken that mortal antipathy which is very generally cherished against the exclusive use of David’s Psalms in the praise of God.

The subject of Psalmody seems to be exciting a good deal of attention at the present time, in different sections of our country, and recently to some extent, in the Emerald Isle. God is about to have a controversy with the churches on this subject, and blessed will he be, who will be found on God’s side. If, as some suppose, there is a time of distress and calamity coming on the Church, and on the world, of an unprecedented character, then there is a time coming when no Psalms and Hymns will suit the Church and people of God, but the Psalms of David.

Away with all human hymns, human promises, and contrivances, while we draw nigh to God in the hour of adversity. In such an hour it is only the Word of God that can sustain the soul. And when the “battle of that great day of God Almighty” commences, which from the “signs of the times” appears to be approximating, God’s people will fly to him for succour and for safety, and they will find nothing more consoling than the simple, energetic language of the “sweet Psalmist of Israel,”

“Yea in the shadow of thy wings,

My refuge I will place,

Until these sad calamities

Do wholly overpass.”

Many of these divine songs are admirably adapted to the state of the Church while in distress, and from the history of the Church we learn that her condition, as a general thing, has been one of suffering and sorrow, from some cause or other, ever since her subjection to the galling yoke of Egyptian bondage.

We have still to pass through much tribulation in order to reach the heavenly kingdom; and where shall we find a collection of sacred songs prepared for, and adapted to the state of the Church in this “vale of tears?” Where? In the Psalms of David, and no where else. How sweet to the believer were these heavenly hymns, while they were pursued over the hills and dales of Scotland by the blood thirsty Claverhouse? And when the Church, in the middle ages, fled into the wilderness from the face of the Dragon, and found a resting place in the vallies of Piedmont, how did the solemn sound of these songs of the Lord rise, and swell, and roll along the vale, cheering the hearts of the pious and persecuted Waldenses, and rising as sweet incense up to the throne of God!

They have ever been found adapted to the condition of holy martyrs in the dungeon and at the stake; and Christ himself, “the man of sorrows,” while in this world, found the language of the Psalmist applicable to his distressed condition, and expired repeating a portion of the 31st Psalm—”into thy hands I commit my spirit.” Shall we cast aside these sacred songs, so well adapted to God’s people, not only in affliction, but also in prosperity? Have those Christian denominations acted properly who have entirely excluded these Divine songs from the praise of God?</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/william-ramsey-hemphill.html">William Ramsey Hemphill</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Psalmody in Evangelical Guardian</cite></span></figcaption>

f+these+divine+songs+are+admirably+adapted+to+the+state+of+the+Church+while+in+distress%2C+and+from+the+history+of+the+Church+we+learn+that+her+condition%2C+as+a+general+thing%2C+has+been+one+of+suffering+and+sorrow%2C+from+some+cause+or+other%2C+ever+since+her+subjection+to+the+galling+yoke+of+Egyptian+bondage.%0A%0AWe+have+still+to+pass+through+much+tribulation+in+order+to+reach+the+heavenly+kingdom%3B+and+where+shall+we+find+a+collection+of+sacred+songs+prepared+for%2C+and+adapted+to+the+state+of+the+Church+in+this+%E2%80%9Cvale+of+tears%3F%E2%80%9D+Where%3F+In+the+Psalms+of+David%2C+and+no+where+else.+How+sweet+to+the+believer+were+these+heavenly+hymns%2C+while+they+were+pursued+over+the+hills+and+dales+of+Scotland+by+the+blood+thirsty+Claverhouse%3F+And+when+the+Church%2C+in+the+middle+ages%2C+fled+into+the+wilderness+from+the+face+of+the+Dragon%2C+and+found+a+resting+place+in+the+vallies+of+Piedmont%2C+how+did+the+solemn+sound+of+these+songs+of+the+Lord+rise%2C+and+swell%2C+and+roll+along+the+vale%2C+cheering+the+hearts+of+the+pious+and+persecuted+Waldenses%2C+and+rising+as+sweet+incense+up+to+the+throne+of+God%21%0A%0AThey+have+ever+been+found+adapted+to+the+condition+of+holy+martyrs+in+the+dungeon+and+at+the+stake%3B+and+Christ+himself%2C+%E2%80%9Cthe+man+of+sorrows%2C%E2%80%9D+while+in+this+world%2C+found+the+language+of+the+Psalmist+applicable+to+his+distressed+condition%2C+and+expired+repeating+a+portion+of+the+31st+Psalm%E2%80%94%E2%80%9Dinto+thy+hands+I+commit+my+spirit.%E2%80%9D+Shall+we+cast+aside+these+sacred+songs%2C+so+well+adapted+to+God%E2%80%99s+people%2C+not+only+in+affliction%2C+but+also+in+prosperity%3F+Have+those+Christian+denominations+acted+properly+who+have+entirely+excluded+these+Divine+songs+from+the+praise+of+God%3F%E2%80%9D%0A%0A%E2%80%94+William+Ramsey+Hemphill%2C+Psalmody+in+Evangelical+Guardian&amp;url=https%3A%2F%2F5solasquotes.github.io%2Fquote%2F4947444170.html&amp;via=5Solas" target="_blank" rel="noopener">Share on X</a><a clas </figure><figure class="quote" id="q-b219a92395" data-kw="">
<blockquote><p>Jesus willingly suffered to save us from eternal suffering. He warns us, however, that as long as we are in this fallen world we will undergo temporal suffering, especially at the hands of the wicked. Self-denial and a willingness to suffer is, therefore, key to following Christ.</p></blockquote>

<div class="meta"><span class="t"><a href="../topics/trials-the-cross-and-comfort/suffering-and-the-cross.html">Suffering and the Cross</a></span></div>

</figure><figure class="quote" id="q-f6e19a7a29" data-kw="">
<blockquote><p>But we see that the godly are visited with sore anguish and very heavy afflictions beyond others; for in this manner God wishes to try their faith, that, after having laid aside their desires and forsaken the world, they may serve him. Since, therefore, the Lord has a peculiar care of them, he must chastise them, while he permits wicked men to indulge in unbounded licentiousness.

Here we are also reminded that we must endure not merely one or another calamity, and must not imagine that, when we have endured some afflictions, there are none in reserve for us; for we ought always to be prepared to endure new ones. When God begins to chastise his people, he does not immediately cease. We shall “bring forth wind” when we think that the birth is at hand; other calamities will break out, and we shall be continually attacked by additional sorrows. We must therefore maintain this warfare so long as it shall please God to employ us in it.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/john-calvin.html">John Calvin</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Commentary on the Book of the Prophet Isaiah: Volume Second</cite>, trans. William Pringle (Geneva, 1551) in Calvin’s Commentaries (22 vols, Grand Rapids: Baker, 1993), 7: 235.</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/trials-the-cross-and-comfort/suffering-and-the-cross.html">Suffering and the Cross</a></span></div>

<main class="wrap"><figure class="quote" id="q-c3b7b7471c" data-kw="">
<blockquote><p>The kind of feelings, by which Christ was tempted, is also worthy of notice. Matthew says that he was affected by grief and sorrow (or anxiety); Luke says that he was seized with anguish; and Mark adds that he trembled. And whence came to Him both sorrow and anxiety and fear, except because He felt in death something sadder and more horrible than the separation of the soul and body? And certainly He underwent death, not merely that He might move from earth to heaven, but rather that He might take on Himself the curse to which we were liable, and deliver us from it. His horror was not, then, at death simpliciter, as a passage out of the world, but because He had before his eyes the dreadful tribunal of God, and the Judge Himself armed with inconceivable vengeance; it was our sins, the burden of which He had assumed, that pressed Him down with their enormous mass. It is, then, not at all strange if the dreadful abyss of destruction tormented Him grievously with fear and anguish.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/john-calvin.html">John Calvin</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Commentary, Harmony of the Evangelists, on Mt. 26 | v. 37</cite></span></figcaption>
<div class="meta"><span class="t"><a href="../topics/the-person-of-christ/union-of-the-two-natures.html">Union of the Two Natures</a></span></div>

</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-e11ddfc3ee" data-kw="">
<blockquote><p>Matthew and Mark almost exhaust the resources of language to convey to us some conception of our Lord’s “agony”¹ as an early interpolator of Luke (Lk.xxii. 44) calls it, in this dreadful experience. The anguish of reluctance which constituted this “agony” is in part described by them both—they alone of the Evangelists enter into our Lord’s feelings here—by a term the primary idea of which is loathing, aversion, perhaps not unmixed with despondency.² ¹ [Greek] agonia: see G. Heine, Synonymik etc., 1898, p. 189: “Contest, quaking, agitation (and anxiety of the issue?) Lk. xxii. 44; Luther, ‘he grappled with death’, Weizsacker, ‘he struggled’, Bengel; ‘supreme grief and anguish. It properly denotes the anguish and passion of the mind, when it enters upon a conflict and arduous labor, even when there is no doubt of a good issue’.” Plummer in loc.: “Field contends that fear is the radical notion of the word. The passages in which it occurs in LXX confirm this view… It is therefore an agony of fear that is apparently to be understood.” It would be better to say consternation, appalled reluctance.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/b-b-warfield.html">B. B. Warfield</a></span><span class="wk"><span class="lbl">Work:</span> <cite>‘On the Emotional Life of our Lord’ (1912)</cite>, pp. 74-76</span></figcaption>

<blockquote><p>The union personalis in Christ was made adiairetos, indivisibly, in respect of place, so that the human nature is nowhere unsupported by the Logos, the Logos nowhere fails to support the human nature, nor is it outside the Logos or the Logos apart from it: akoristos, inseparably in respect of time, because this union is never dissolved but is perpetual, which was also seen in the death and burial…</p></blockquote>

</figure><figure class="quote" id="q-04da18c64a" data-kw="">
<blockquote><p>Certainly from one perspective, as a creature and as man, it seems that He [Christ] cannot be exempted from the moral government of God, nor otherwise could He as a man have merited anything for Himself. From another perspective, if He were in Adam under the covenant of nature, then it would seem that in and with Adam who sinned, He violated that same covenant, which is beyond absurd. Therefore it seems most safe to state: although as a rational creature He cannot be exempted from moral government with respect to his natural duties, yet He could have been withdrawn by God from the same moral governance in the positive duties, such as the commandment not to eat of the forbidden fruit (upon the transgression of which the sin of the human race hangs).</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/petrus-van-mastricht.html">Petrus van Mastricht</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Theoretical Practical Theology (RHB), vol. 3, bk. 3, ch. 12, section 9, ‘Was it [the CoW] also entered into with the second Adam?’</cite></span></figcaption>

</figure><figure class="quote" id="q-0dd2b3f86c" data-kw="">
<blockquote><p>Fifthly, the union of the two natures in Christ is an inseparable union. So that from the first moment thereof, there never was, nor to eternity shall be, any separation of them. If you ask how the union remained betwixt them when Christ’s human soul and body were separated from each other upon the cross? Is not death the dissolution of union betwixt soul and body? True, the natural union betwixt his soul and body was dissolved by death for a time, but this hypostatical union remained even then as entire and firm as ever. For though his soul and body were divided from each other, yet neither of them from the divine nature. Divines assist our conception of this mystery by an apt illustration. A man that holds in his hand a sword sheathed, when he pleases, draws forth the sword, but still holds that in one hand and the sheath in the other, and then sheaths it again, still holding it in his hand; so when Christ died his soul and body retained their union with the divine nature, though not (during that space) one with another.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/john-flavel.html">John Flavel</a></span><span class="wk"><span class="lbl">Work:</span> <cite>‘5th Sermon’ on Jn. 1:14 in The Fountain of Life Opened… (London, 1673)</cite>, pp. 56-7</span></figcaption>

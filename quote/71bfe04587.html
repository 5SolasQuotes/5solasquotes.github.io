<main class="wrap"><figure class="quote" id="q-71bfe04587" data-kw="">
<blockquote><p>But some one will ask, How is it then, that certain excellent persons, and of position in the Church, are often permitted by God to preach novel doctrines to Catholics? A proper question, certainly, and one which ought to be very carefully and fully dealt with, but answered at the same time, not in reliance upon one’s own ability, but by the authority of the divine Law, and by appeal to the Church’s determination.

Let us listen, then, to Holy Moses, and let him teach us why learned men, and such as because of their knowledge are even called Prophets by the apostle, are sometimes permitted to put forth novel doctrines, which the Old Testament is wont, by way of allegory, to call “strange gods,” forasmuch as heretics pay the same sort of reverence to their notions that the Gentiles do to their gods.

Blessed Moses, then, writes thus in Deuteronomy: “If there arise among you a prophet or a dreamer of dreams,” that is, one holding office as a Doctor in the Church, who is believed by his disciples or auditors to teach by revelation: well,—what follows? “and giveth thee a sign or a wonder, and the sign or the wonder come to pass whereof he spake,”—he is pointing to some eminent doctor, whose learning is such that his followers believe him not only to know things human, but, moreover, to foreknow things superhuman, such as, their disciples commonly boast, were Valentinus, Donatus, Photinus, Apollinaris, and the rest of that sort!

What next? “And shall say to thee, Let us go after other gods, whom thou knowest not, and serve them.” What are those other gods but strange errors which thou knowest not, that is, new and such as were never heard of before? “And let us serve them;” that is, “Let us believe them, follow them.” What last? “Thou shalt not hearken to the words of that prophet or dreamer of dreams.” And why, I pray thee, does not God forbid to be taught what God forbids to be heard? “For the Lord, your God, trieth you, to know whether you love Him with all your heart and with all your soul.”

The reason is clearer than day why Divine Providence sometimes permits certain doctors of the Churches to preach new doctrines—“That the Lord your God may try you;” he says. And assuredly it is a great trial when one whom thou believest to be a prophet, a disciple of prophets, a doctor and defender of the truth, whom thou hast folded to thy breast with the utmost veneration and love, when such a one of a sudden secretly and furtively brings in noxious errors, which thou canst neither quickly detect, being held by the prestige of former authority, nor lightly think it right to condemn, being prevented by affection for thine old master.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/vincent-of-lerins.html">Vincent of Lérins</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Commonitory for the Antiquity and Universality of the Catholic Faith Against the Profane Novelties of all Heresies</cite>, (434), 10.27-28 in Nicene and Post-Nicene Fathers 2, 11: 137-38.</span></figcaption>

</figure><figure class="quote" id="q-a054699443" data-kw="">
<blockquote><p>Although the editor of this blog is not opposed to home-schooling (indeed, it is often the only way for parents in our current circumstances to ensure their children get a Christian education), we reject the extremist notion that it is the only scriptural (or even the best) way to educate children. Our Reformed forebears did not believe this to be the case; you will even notice that Samuel Rutherford applies a favourite home-schooling “proof-text” to those who teach children in schools. This, moreover, also demonstrates that the Covenanters did not believe in Kuyperian notions of sphere-sovereignty. Since magistrates and school-teachers are also “fathers”, texts like Ephesians 6:4 could also be applied to them and not just to literal fathers. Hence they rejected the idea that education belonged to the “sphere” of the nuclear family alone :

There are with us Doctors of Divinity who teach in Schools and Universities, men tried to be holy and learned, and then put in office, as 1 Tim. 3. 10. under whose instruction are students aiming at the holy ministry called expectants, as in the Jewish Church in their Colleges, were young Prophets, or sons of the Prophets, as 1 Sam. 10. 5. 2 Kin. 4. 1. 1 King. 20. 35. These Doctors and also the teachers of human literature, who train up children in the nurture and admonition of the Lord, Pro. 22. 6. Ephes. 6.4. if they aim at the Ministry, prophesy in our presbyterial meetings, 1 Cor. 14.29.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/samuel-rutherford.html">Samuel Rutherford</a></span><span class="wk"><span class="lbl">Work:</span> <cite>A peaceable and temperate plea for Paul’s Presbytery in</cite>, Scotland (London, 1642), p. 319.</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/church-government-and-the-ministry/the-call-to-ministry.html">The Call to Ministry</a></span></div>

<blockquote><p>Here we must distinguish succession: one is personal and local, as to persons and places; another is doctrinal, as to faith. We do not deny that the latter is a mark and thus it coincides with ours. But the former (of which we treat here) cannot be a mark. (a) It is merely contingent and aside from the nature of the church, unless it is founded on unity of sound doctrine and true faith (Eph. 4:4, 5, 11, 12). … For the church is not to be sought in walls and temples, but in doctrines. The church is where true faith is. “They do not have the inheritance of Peter, who have not the faith of Peter” (Ambrose).</p></blockquote>

<div class="actions"><button class="copy" data-copy="“Here we must distinguish succession: one is personal and local, as to persons and places; another is doctrinal, as to faith. We do not deny that the latter is a mark and thus it coincides with ours. But the former (of which we treat here) cannot be a mark. (a) It is merely contingent and aside from the nature of the church, unless it is founded on unity of sound doctrine and true faith (Eph. 4:4, 5, 11, 12). … For the church is not to be sought in walls and temples, but in doctrines. The church is where true faith is. “They do not have the inheritance of Peter, who have not the faith of Peter” (Ambrose).”

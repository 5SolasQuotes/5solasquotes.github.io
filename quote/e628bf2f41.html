</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-ac344361c5" data-kw="">
<blockquote><p>III. On the statement of the question take notice: (1) acts of divine worship are twofold, some which do not differ form the worship itself (to wit, from piety and holiness, in which worship essentially consists); others ordinated to worship as helps or instruments to perform that worship suitably and declare it abroad. The former kind of acts can be instituted and commanded by God alone, who is the sole chief and legislator, who has dominion over the conscience; nor does any right belong to the Church of adding, taking away or changing anything. The latter, again, are either necessary and so also instituted by God, at least as to being (to on)–for example that assemblies should be held, the word preached, the sacraments administered; others are contingent and free as to quality (to poion), the reason of which depends upon the honesty and fitness of particular churches (to wit, that assemblies should be held in this or that time and place and the sacraments administered). The former, as being necessary, depend upon God alone and the Church has no control or power over them; the latter God has thus far left to the will of the Church as means and indifferent, so that a regard be always paid to divine truth, Christian simplicity and public edification.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/francis-turretin.html">Francis Turretin</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Institutes of Elenctic Theology</cite>, vol. 3, 18th Topic, Question 31, section III, p. 286</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/worship/nature-of-worship.html">Nature of Worship</a></span></div>

<blockquote><p>Divine worship is any action or service that is immediately and directly performed unto God Himself, whether the true God or a false, whether commanded by divine authority, imposed by human, or assumed upon our own heads and pleasures. For in this latitude of sense is divine worship to be conceived, that it may comprehend under it both true and false worship.</p></blockquote>

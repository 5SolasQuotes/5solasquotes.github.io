<blockquote><p>XXIV. It is asked, fifth, whether infants before all use of reason are subject to actual sin… The Cartesian theologians, because they state that the rational soul is nothing except actual thought, such as is either agreeable or repugnant to the divine law, are also compelled to state that actual sin occurs also in infants… The Reformed, although they acknowledge that original corruption is actually present in infants, from which by nature they are prone to all actual sins, and moreover bear in themselves the seeds of the same, nonetheless deny that they are properly subject to any actual sin, because: (1) Scripture teaches that they do not sin according to the similitude of Adam, that is, actually. Also because (2) Scripture calls them innocent (Ps. 106:38). For since this could not be said with regard to original sin, from which they are pronounced unclean (1 Cor. 7:14), nothing remains except that they are called innocent with regard to actual sin, inasmuch as they do not discern between their right hand and their left hand ( Jonah 4:11). (3) They are said to have done neither good nor evil (Rom. 9:11). (4) To infants as such, there is no law prescribed against which they would commit that which is against the law; they recognize no law, and thus also cannot compose themselves to any law, nor deviate from any. Nevertheless they object: (1) that the imagination of man’s heart is called evil from his youth (Gen. 8:21 with 6:5). I respond, יצר in this passage means that the shape and disposition of the heart in infants is, not from actual sins, but from original corruption, only evil, from their very infancy (Prov. 22:15). (2) That the human mind consists in actual thought, which can not only be congruent with divine law, but also repugnant to it. I respond: (1) That the human mind is a thinking substance which, with organs adequately disposed, can think, we do not doubt, just as it is a reasoning substance, not because it is always reasoning in actuality, but because it can reason, with necessary things put in place. (b) If we grant that the mind in the infant thinks in actuality, yet it does not follow from this that he actually sins, because, as we have said, the infant before all use of reason does not have prescribed to him a law which could be transgressed. Nor is it valid to say that his actual thought can be not conformable, in fact repugnant, to the law, since even a goring ox’s killing of a man is materially repugnant to the law, and yet from this that ox is not properly a murderer, and does not sin by slaying him, because there is not prescribed to it a law which would be transgressed.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/petrus-van-mastricht.html">Petrus van Mastricht</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Theoretical-Practical Theology (RHB), vol. 3, bk. 4, ch. 3, ‘Actual Sin’ | section 24</cite>, p. 511-12</span></figcaption>

</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-0d13a27ddd" data-kw="">
<blockquote><p>It is impossible for the sins of the nearer ancestors, or even any other but the first sin of our first parent to be transmitted by way of origin. The reason is that a man begets his like in species but not in individual. Consequently those things that pertain directly to the individual, such as personal actions and matters affecting them, are not transmitted by parents to their children: for a grammarian does not transmit to his son the knowledge of grammar that he has acquired by his own studies. On the other hand, those things that concern the nature of the species, are transmitted by parents to their children, unless there be a defect of nature: thus a man with eyes begets a son having eyes, unless nature fails. And if nature be strong, even certain accidents of the individual pertaining to natural disposition, are transmitted to the children, e.g. fleetness of body, acuteness of intellect… Other actual sins, however, whether of the first parent or of others, do not corrupt the nature as nature, but only as the nature of that person, i.e. in respect of the proneness to sin: and consequently other sins are not transmitted. According to Augustine in his letter to Avitus [Ep. ad Auxilium ccl.], children are never inflicted with spiritual punishment on account of their parents, unless they share in their guilt, either in their origin, or by imitation, because every soul is God’s immediate property, as stated in Ezekiel 18:4. A man can more easily transmit that which he has of himself, provided it be transmissible. But the actual sins of our nearer ancestors are not transmissible, because they are purely personal, as stated above.</p></blockquote>

<blockquote><p>However, from the fact that the apostle assigns death to consummated sin, the Romanists wrongly infer that non-consummated sin is not worthy of death, but only of temporal punishments, that is, so that they may hold to venial sin, and from that, their purgatory. They attend too little to the fact that the apostle does not say that only sin consummated by the full consent of the will gives birth to death, since elsewhere Paul assigns death to concupiscence (Rom. 7:5), namely that concupiscence which he did not know was sin (v. 7). Accordingly, he intends only that consummated sin gives birth preeminently to death, insofar as it includes two degrees of sin, internal as well as external.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/petrus-van-mastricht.html">Petrus van Mastricht</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Theoretical-Practical Theology (RHB), vol. 3, bk. 4, ch. 3, ‘Actual Sin’ | section 2</cite>, pp. 490-91</span></figcaption>

<blockquote><p>Whatever is anomon (“lawless” in the abstract) or anomia (“lawlessness”) is really sin, but not forthwith what is called “lawless” (anomon) in the concrete because it has sin in itself. In this sense, human nature is called “lawless” (anomos); not that it is sin itself, but because having sin in itself it is well called “sinful.”</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/francis-turretin.html">Francis Turretin</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Institutes of Elenctic Theology</cite>, 9.11</span></figcaption>

</figure><figure class="quote" id="q-b334fee3da" data-kw="">
<blockquote><p>Even when we choose evil, we choose for the good, albeit poorly. The choice of the sinner for evil in this sense is not a choice for an alternate, competing reality that is diametrically opposed to the order of goodness. It is a poor choice— an attempt at the good that fails in ways that are both person ally and socially destructive. Understood in this way, vice is not so much an equal alternative to virtue, but a corruption and weakening of the virtus of human nature, which by its natural form is ordered to the good.</p></blockquote>

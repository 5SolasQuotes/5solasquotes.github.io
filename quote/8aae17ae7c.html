<main class="wrap"><figure class="quote" id="q-8aae17ae7c" data-kw="">
<blockquote><p>The ceremonies associated with these signs are of express significance, and therefore are to be implemented as Christ has exemplified in the institution of it. Christ broke the bread, thereby signifying the breaking of his body, that is, his death. The apostle passes on to the congregation the ceremony of breaking; he refers to it as ‘the breaking of bread,’ and ‘the bread which we break’ (1 Cor. 10:16). The apostolic church did likewise, ‘…breaking bread’ (Acts 2:46); ‘…when the disciples came together to break bread’ (Acts 20:7). Therefore today the minister also must break the bread and give it as such to the communicants. The Papists and the Lutherans do this in an entirely different manner by giving a wafer to everyone without breaking it.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/wilhelmus-a-brakel.html">Wilhelmus à Brakel</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Christian’s Reasonable Service (RHB), vol. 2, pp. 474, 529 &amp; 532</cite></span></figcaption>
<div class="meta"><span class="t"><a href="../topics/the-lords-supper/preparation-celebration-reflection.html">Preparation, Celebration, Reflection</a></span></div>

</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-8186843c7c" data-kw="">
<blockquote><p>3. By forgetting the difference between their private familiarity, where they are choosers of their company themselves, and their Church-communion, where the pastors are the rulers and judges of the fitness of the members. Or else not understanding that this use of the keys, and judging of the fitness of the members, is indeed the pastor’s office and not theirs. 4. By not considering that nothing must be done by discipline upon offenders but in a course of Church-justice, upon due accusations, summons, audience, proof and patient admonition: And not by casting out any irregularly upon the expectation of every one that will say that they are ungodly and scandalous. … 8. By forgetting that God has not left the Church at arbitrary liberty to judge any godly or ungodly at their pleasure; But has given us a set test or rule to judge them by, which is their sober profession of consent to the baptismal Covenant, upon which the adult and their infants have right to baptism; and being baptized have right to Church-communion in all the acts which their age and understanding makes them capable of: And it is Church-tyranny to refuse such as show this title, till they are openly proved to forfeit it, by impenitency in gross sin after public admonition and due means. This is the truth, and the method of Christ’s discipline, and the rule of our communion.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/richard-baxter.html">Richard Baxter</a></span><span class="wk"><span class="lbl">Work:</span> <cite>A Second Admonition to Mr. Edward Bagshaw (London: Simmons, 1671), ‘To those Readers…’</cite>, p. 3</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/the-lords-supper/preparation-celebration-reflection.html">Preparation, Celebration, Reflection</a></span></div>

</figure><figure class="quote" id="q-30a86616dc" data-kw="">
<blockquote><p>…yet in formal terms, they [the congregationalists] do deny the most gracious of their brethren to live beside them in New-England in the presbyterial way of the old non-conformists: yea, in print they avow that whoever refuses their tenet of Independency, were they otherwise never so orthodox and pious, they ought not to be admitted to the sacraments, nor enjoy any church privileges: as people who cannot be wholly, but at most are in part only converted: Yea, as such who must be taken for antichristian spirits, for enemies to Christ and his kingdom: Neither have I heard that any of them now for many years have either celebrated to others or received themselves the sacraments in any English church.</p></blockquote>

</figure><figure class="quote" id="q-e52a38d586" data-kw="">
<blockquote><p>Humbly offer this: two sorts of signs: sacramental, these are from institution, sitting is not of this kind. 2. There are other sorts of signs, you may call it natural. This gesture belongs to it as it is cena [a supper], and convivium [a meal in company], though not as a sacrament. We can hardly part from it, nay, I may add, we may not posibly part from it.</p></blockquote>

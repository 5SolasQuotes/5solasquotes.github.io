<main class="wrap"><figure class="quote" id="q-5f508fedcc" data-kw="">
<blockquote><p>1. It is not absolutely unlawful to personate another man, nor does the Second Commandment forbid such living Images in this extent. I pass by the instance of the woman of Tekoah, 2 Sam. 14, because the bare history proves not the lawfulness. But Paul’s speaking as of himself and Apollos the things which concerned others, was approvable: And as Christ frequently taught by parables, so his parables were a description of good and evil, by the way of feigned history, as if such and such things had been done by such persons as never were. And this fiction is no falsehood; For the hearer knows that it is not meant as an historical narrative, but a parable; And it is but an image in words, or a painted doctrine. And if a person and action may be feigned by words, I know not where it is forbidden to feign them by personal representation. Therefore to personate another is not simply a sin. 2. To personate good men in good actions is not simply unlawful: because: 1. It is not unlawful as it is personating, as is showed: 2. Nor as lying: Because it is not an asserting, but a representing; nor so taken. 3. To personate a bad man in a bad action, is more dubious; but seems not to be in all cases unlawful. To pass by David’s feigning himself mad (as of uncertain quality) it is common with preachers to speak oft the words of wicked men, as in their names or persons, to disgrace them: And Prov. 5:11-12, etc. comes near it. And whether Job be a history, or a dialogue personating such speakers, is doubted by the most learned expositors.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/richard-baxter.html">Richard Baxter</a></span><span class="wk"><span class="lbl">Work:</span> <cite>A Christian Directory… (London: White, 1673), pt. 3, ‘Christian Ecclesiastics’, Question 114, ‘Whether Stage-Plays where the Virtuous &amp; Vicious are Personated, be Lawful?’ [Yes]</cite>, p. 877</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/worship/ceremonies-and-things-indifferent.html">Ceremonies and Things Indifferent</a></span></div>

</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-7b6f423734" data-kw="">
<blockquote><p>In all religious commands there must appear to the person that obeys some reason from a divine command; either particularly or generally requiring the thing. The mere will and authority of an another in these things is not reason enough to justify our obedience. In matters of that nature we must be very wary of idle and superfluous actions. To be of no use and insignificant is enough in worship to make a gesture or action sinful, yea, and an appropriated habit [garment] too. There lies no necessity upon the superior to command any such things, nay, to do it will be a sin unto him, as Gideon’s ephod was a snare to his house, Judg. 8:27.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/john-collinges.html">John Collinges</a></span><span class="wk"><span class="lbl">Work:</span> <cite>A Reasonable Account why some Pious, Nonconforming Ministers in England Judge it Sinful for them to perform their ministerial acts, in public, solemn prayer by the Prescribed Forms of Others… (London: 1679), ch. 4</cite>, p. 89</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/worship/ceremonies-and-things-indifferent.html">Ceremonies and Things Indifferent</a></span></div>

</figure><figure class="quote" id="q-9aec2c78b0" data-kw="">
<blockquote><p>[Col. 2] verse. 17, What should we do with the shadow, when we have the body? another, verse 20, Why should we be subject to human ordinances, since through Christ we are dead to them, and have nothing ado with them?… …whereas it might bee thought, that the apostle does not condemn all holy-days, because both he permits others to observe days, Rom. 14:5, and he himself also did observe one of the Jewish feasts, Acts 18:21. It is easily answered that our holy-days have no warrant from these places… …that which the apostle either said or did hereanent, is to be expounded and understood of bearing with the weak Jews, whom he permitted to esteeme one day above another, and for whose cause he did in his own practice, thus far apply himself to their infirmity at [???] time, when they could not possibly be as yet fully and throughly instructed concerning Christian liberty and the abrogation of the Ceremonial Law, because the Gospel was as yet not fully propagated: and when the Mosaical rites were like a dead man not yet buried, as Augustine’s simile runs. So that all this can make nothing for holy-days after the full promulgation of the Gospel, and after that the Jewish ceremonies are not only dead, but also buried, and so deadly to be used by us. Hence it is, that the apostle will not bear with the observation days in Christian Churches, who have known God as he speaks.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/george-gillespie.html">George Gillespie</a></span><span class="wk"><span class="lbl">Work:</span> <cite>English Popish Ceremonies (1637), pt. 1, ch. 8, ‘That Festival Days take away our Christian Liberty, proved out of the Gospel’</cite>, pp. 25-26</span></figcaption>

<blockquote><p>When you feel doubts about being God’s child because you have not shown God that obedience that you owe to him, know that the devil is very near you. He will attempt to falsify the gospel by convincing you that you must be saved by your works. Or he will attempt to seduce you to blaspheme the Lord Jesus by causing you to think that you can be or deserve to be your own savior, at least in part. Respond to this temptation by saying that you are a poor sinner, that Jesus Christ has come to save sinners, and that there is salvation only in him.</p></blockquote>

<blockquote><p>appetitus: appetite, desire; specifically, the appetitive faculty or capacity of a being, which seeks out or inclines toward a good. In all spiritual beings, including God, the exercise of will implies appetite. By extension, the propensities of inanimate objects, and even of matter, can be described as appetite… Scholastic theology and philosophy focus in particular upon the appetites of finite spiritual beings, which by nature seek out their own good. Since the fall has caused a deprivation and distortion of desire, a distinction must be made between appetitus rectus, right desire, and appetitus perversus or inordinatus, perverse or inordinate desire. It is characteristic of the desire of sinful beings that it misidentifies the good, particularly ultimate good, and perversely, or inordinately, desires finite things as ends in themselves (see frui). Thus appetitus perversus and appetitus inordinatus (q.v.) are synonyms for sin (peccatum, q.v.). Appetite can be distinguished further into natural appetite (appetitus naturalis), rational or voluntary appetite (appetitus rationalis sive voluntarius), and animal or sensual or sensitive appetite (appetitus animalis sive sensualis; appetitus sensitivus). Natural appetite is simply the nature of any existent thing to be what it is and to perform its proper acts or operations; e.g., human beings have a natural appetite for breathing! The rational or voluntary appetite, also called appetitus intellectualis, intellectual appetite, is the will (voluntas, q.v.). Whereas it is the intellect (intellectus, q.v.) that perceives and knows objects, it is the will that chooses. Since choice belongs to the will, the will must be exercised in the choice of even purely intellectual objects—thus appetitus intellectualis. In addition, since the will and the intellect are not really distinct, but only formally or rationally distinct (see distinctio), the appetitive function of will is also rational (rationalis). Thus the will desires the goodness, truth, and justice known by the intellect… The appetitus animalis sive sensualis or appetitus sensitivus is thus emotion or passion (affectus, passio), and it may be described in terms of the six concupiscible (concupiscibilis, q.v.) passions: love and hate, joy and sadness, desire and aversion; and of the five irascible (irascibilis, q.v.) passions: courage and fear, hope, despair, and anger. This appetite, because of its relation to the body, is usually described as being situated “below” the will in the hierarchy of human faculties.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/richard-muller.html">Richard Muller</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Dictionary of Latin &amp; Greek Theological Terms: Drawn Principally from Protestant Scholastic Theology 1st</cite>, ed. (Baker Academic, 2017), pp. 41-42</span></figcaption>

<blockquote><p>We shall now be prepared to understand how the recognition, that the two worlds exist and have existed side by side from the beginning, enables the author of Hebrews to solve the chief problem of the history of redemption and revelation. For it is in Hebrews that the first age and the first world are identified with the first covenant. When, therefore, the question is raised, how the Old Covenant can be identical in substance with the New, what is the common essence, that notwithstanding the great progress from one to the other, makes them two coherent stages in the expression and conveyance of the same spiritual reality, the answer is immediately forthcoming: the same world of heavenly spiritual realities, which has now come to light in the Person and work of Christ, already existed during the course of the Old Covenant, and in a provisional typical way through revelation reflected itself in and through redemption projected itself into the religious experience of the ancient people of God, so that they in their own partial manner and measure had access to and communion with and enjoyment of the higher world, which has now been let down and thrown open to our full knowledge and possession. In other words, the bond that links the Old and the New Covenant together is not a purely evolutionary one, inasmuch as the one has grown out of the other; it is, if we may so call it, a transcendental bond: the New Covenant in its preexistent, heavenly state reaches back and stretches its eternal wings over the Old, and the Old Testament people of God were one with us in religious dignity and privilege; they were, to speak in a Pauline figure, sons of the Jerusalem above, which is the mother of all. This is a profounder solution than is offered in the well-known formula of Augustine: “The New Testament is latent in the Old, the Old Testament lies open in the New.” More profound because, together with the statement of the fact, it gives the reason for the fact. The latent existence of the verities and potencies of the Christian religion in the old dispensation are due to no other cause than that the Christian religion lived even at that time as redemptive truth and redemptive power in the heavenly world and from there created for itself an embryonic form of existence in the life of Israel. The writer of Hebrews would have subscribed to the belief that Christianity is as old as Abraham and as old as Moses, nay as old as Paradise, because it is heaven-born and not the child of earth.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/geerhardus-vos.html">Geerhardus Vos</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Redemptive History and Biblical Interpretation: The Shorter Writings of Geerhardus Vos</cite>, ed. Richard B. Gaffin Jr. (Phillipsburg, NJ: P&amp;R Publishing, 2001), 199–200.</span></figcaption>

<blockquote><p>XV. In Scripture, we find two covenants of God with man: the Covenant of Works, otherwise called, the Covenant of Nature, or the Legal and the Covenant of Grace. The apostle teacheth us this distinction, Rom. 3:27, where he mentions the law of works, and the law of faith by the law of works, understanding that doctrine which points out the way in which, by means of works, salvation is obtained; and by the law of faith, that doctrine which directs by faith to obtain salvation. The form of the covenant of works is, “The man that doth these things shall live by them,” Rom. 10:5. That of the covenant of grace is, “Whosoever believeth in him shall not be ashamed,” Rom. 10:11. These covenants of mercy agree, 1st. That, in both, the contracting parties are the same, God and man. 2dly. In both, the same promise of eternal life, consisting in the immediate fruition of God. 3dly. The condition of both is the same, viz., perfect obedience to the law. Nor would it have been worthy of God to admit man to a blessed communication with him, but in the way of unspotted holiness. 4thly. In both, the same end, the glory of the most unspotted goodness of God. But in these following particulars they differ: 1st. The character or relation of God and man, in the covenant of works, is different from what it is in the covenant of grace. In the former, God treats as the Supreme Lawgiver, and the Chief Good, rejoicing to make his innocent creature a partaker of his happiness. In the latter, as infinitely merciful, adjudging life to the elect sinner consistently with his wisdom and justice. 2dly. In the covenant of works there was no mediator. In that of grace, there is the mediator, Christ Jesus. 3dly. In the covenant of works, the condition of perfect obedience was required to be performed by man himself, who had consented to it. In that of grace, the same condition is proposed, as to be, or as already performed, by a mediator. And in this substitution of the person consists the principal and essential difference of the covenants. 4thly. In the covenant of works, man is considered as working, and the reward to be given as of debt; and therefore, man’s glorying is not excluded, but he may glory, as a faithful servant may do, upon the right discharge of his duty, and may claim the reward promised to his working. In the covenant of grace, man, in himself ungodly, is considered in the covenant as believing; and eternal life is considered as the merit of the mediator, and as given to man out of free grace, which excludes all boasting, besides the glorying of the believing sinner in God, as his merciful Saviour. 5thly. In the covenant of works, something is required of man, as a condition which, performed, entitles him to the reward. The covenant of grace, with respect to us, consists of the absolute promises of God, in which the mediator, the life to be obtained by him, the faith by which we may be made partakers of him, the benefits purchased by him, and the perseverance in that faith, in a word, the whole of salvation, and all the requisites to it, are absolutely promised. 6thly. The special end of the covenant of works was, the manifestation of the holiness, goodness, and justice of God, conspicuous in the most perfect law, most liberal promise, and in that recompense of reward, to be given to those who seek him with their whole heart. The special end of the covenant of grace is, “the praise of the glory of his grace,” Eph. 1:6, and the revelation of his unsearchable and manifold wisdom: which divine perfections shine forth with lustre in the gift of a mediator, by whom the sinner is admitted to complete salvation, without any dishonour to the holiness, justice, and truth of God. There is also a demonstration of the all-sufficiency of God, by which not only man, but even a sinner, which is more surprising, may be restored to union and communion with God.</p></blockquote>

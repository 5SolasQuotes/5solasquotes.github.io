<main class="wrap"><figure class="quote" id="q-470d3b2b82" data-kw="">
<blockquote><p>Think not that you shall enjoy the pleasures of this world, if you be the faithful servants of Christ. Christ shed his blood for thee, that thou shouldest not refuse to give thy blood for him. Drink the cup of bitter gall, whereof Christ began to thee, and carry thy cross, that thou mayest follow him. If thou be ashamed of the cross, thou art ashamed of Christ; if thou be ashamed of Christ, he will be ashamed of thee before his Father in heaven. The cross cannot hurt thee, for Christ hath sanctified it in his blood.

Behold not the sword which striketh thee, but think on the crown of glory, which thou shalt receive. Gold is clearer after it hath been put into the fire: be thou gold, and the fiery persecution shall not hurt thee. Let not the fear of death put out thy faith. Trust in the Lord: be strong, and he shall establish thy heart. Be rooted and built in Christ, and stablished in the faith. Then shall thy heart rejoice, and no man shall take thy joy from thee.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/john-jewel.html">John Jewel</a></span><span class="wk"><span class="lbl">Work:</span> <cite>An Exposition upon the Two Epistles of the Apostle St. Paul to the Thessalonians</cite>, (1584; London: John Hatchard, 1811), pp 67-68.</span></figcaption>

</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-beb6032e0f" data-kw="">
<blockquote><p>There are many things that are very discouraging like; but there is comfort, Jesus Christ is a King, and seeing He is a King, He will have subjects; yea, He will reign till He put all his enemies under his feet. Shall not the pleasure of the Lord prosper in his hand? “He will see of the travail of his soul, and be satisfied.” And may not our souls feed upon the ravishing thoughts of the pureness of that Church that He will have in Scotland? What shall be the end of all these things? shall they not all tend to the purging of Jacob from his sin? […]

A sight of the preciousness that is in Him will cause us to go through fire and water with Him and for Him. Will not the consolations of his Spirit bear up the soul in all its difficulties? especially when it is aye made to see in the end, that it could not want one dram-weight of its cup?</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/james-renwick.html">James Renwick</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Letter to Robert Hamilton, 6 Feb. 1683 in Thomas Houston (ed.), Spiritual support and consolation in difficult times: the letters of the Rev. James Renwick, the last of Scotland’s covenanted martyrs, with and introduction, containing a historical sketch of Renwick’s life, labours, and martyrdom, and</cite></span></figcaption>
<div class="meta"><span class="t"><a href="../topics/civil-government-and-society.html">Civil Government and Society</a></span></div>

</figure><figure class="quote" id="q-1282dc278f" data-kw="">
<blockquote><p>III. Problem: Whether [a man may be generated] from a man and a brute? I would scarcely dare to concede it. Some examples are adduced by the historians Castanheda the Portuguese, Saxo Grammaticus, Olaus Magnus, João de Barros, Juan Eusebio Nieremberg, bk. 5 chs. 6-7, and that well-known one in Belgium in Delrio, bk. 2, question 14. But to confess the truth, I would prefer not to be so liberal in believing… …Fortunio Liceti [d. 1657] in book 2 of his work On Monsters [1616], chs. 68-73… His second reason is: That the uterus, for example of a [living] cow, can be a suitable place in which a human fetus can be conserved, cherished, and all the functions necessary for its formation and perfection can be performed no less than in a human uterus, as he says is clear from what he wrote in his book, On the Perfect Constitution of Man in the Uterus [1616], chs. 23-24.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/gisbertus-voetius.html">Gisbertus Voetius</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Select Theological Disputations</cite>, vol. 1, pt. 2 tr. by AI by Onku (Utrecht: Johannes a Waesberg, 1648), ‘On Creation’, pt. 10 Latin, pp. 298-99</span></figcaption>

<blockquote><p>Earth’s Rulers must be told that Christ shall cut off the spirit of princes, and that He shall be terrible to the stubborn and rebellious kings of the earth (Ps. lxxvi. 12); they must be taught that Christ shall strike through kings in the day of His wrath (Ps. cx. 5); yea, they must be plainly reminded of that throne of inquity-shaking passage – “For the nation and kingdom that will not serve Thee shall perish; yea, those nations shall be utterly wasted” (Is. lx. 12).</p></blockquote>

<main class="wrap"><figure class="quote" id="q-afef6b2e6f" data-kw="">
<blockquote><p>M. First, this is want to be demanded, what is the form of this world, and specially of this body, within the compass whereof all these things are contained: for that some will have it to be spherical or round, as Aristotle: othersome of the fashion and likeness of the figure Icosaidron round compassing with a great many of Angles or Corners here and there in the top, as Plato: Others, plain and flat, like a skin stretched forth abroad, as S. Basil: others give it other forms, and those also diverse, as the Greek writer Cleomides reporteth in his title of the contemplation of circles.

S. Is there any of those opinions true?

M. God he knoweth. We, who in no place of his word doe read these matters plainly determined (unless perhaps some man will allege that which is written in Job the 22. Chapter, and 14. verse: and there is mention also made of the sphere of the earth in Isay the 40. chapter and 22. verse: and in S. James the 3. chapter and 6. verse, to the end he might prove that this world, and also the outmost heaven, are round like a circle or a wheel) do oftentimes fall &amp; are drawn into contrary opinions.

Verily, that the world is round, it seemeth unto me much the more probable, by that which is written, as I have said in Job the 20. chapter, and 14. verse: and in Eccles. the 24. chapter, and 8. verse: both for that it is the most beautiful and widest form of all other, by which it was needful that a compass which should contain in the bosom thereof so many things, should be framed: also for that the principal, and as it were the parts of the whole in respect of this world as are heaven, water, &amp; earth, are by our senses themselves perceived to be spherical and round, unto which it is credible that the compass of the whole world is semblable.

How be it, I can affirm nothing certainly thereof, since although we admit that this part which is nearest unto us, &amp; the lowermost of the circumference of the high heaven which we behold, and which environeth all thing, be bending, hollow, &amp; round notwithstanding it may be imagined that the farthermost and higher most part of the same circumference is of some other form: and I know there be some that have said that the uttermost and farthermost part of heaven is shaped like a bell.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/lambert-daneau.html">Lambert Daneau</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The wonderful workmanship of the world wherein is contained an excellent discourse of Christian natural philosophy, concerning the form, knowledge, and use of all things created: specially gathered out of the fountains of holy Scripture</cite>, trans. Thomas Twyne (London: Andrew Maunsell, 1578), p. 28.</span></figcaption>

<blockquote><p>The things set down under the former head as forbidden are such new ordinances of worship as are coordinate with the divine ordinances and are in a proper sense additions, pretending or in themselves expressing the same nature, reason, end and use that the divine ordinances have and consequently importing an insufficiency in them. But there are such institutions of men in subordination to the divine institutions as serve for the more convenient modifying and ordering of the same; and they are not proper additions because they are not of the same nature and use: and these are unlawful. All such modes of a duty as are necessary in genere, and not determined in specie (as when there must be a practice one way or other, but whether this way or that way, is not determined of God) are left free to human determination. This human determination must be regulated by the general rules of God’s Word, of which there be these two chief: First, that all determinations be made for edification and not for destruction. Secondly, that all things be done decently and in order. These two rules we find expressly in Scripture, and they are also of the law of nature. These things are neither the essential nor integral parts of divine worship; but if any of them be called “parts” thereof, as being direct expressions of honor to God, they are but accidental parts, as the putting off the hat in divine worship is a worshipping of God so far as it is an expression of honor to God. … Whatsoever nature or custom has so made decent or reverent that the negation of it is indecent or irreverent, is doubtless commanded of God in his worship, though not by any particular, yet by general laws. And the institution and observation of such things is no addition to God’s Law, but merely an application of the general Law in particular cases, as the Law itself does warrant. All these are such mutable things as are not fit to be in particular the matter of a universal law because they are fit in one place and at one time, and not another. Note that things not determined of God and left to the determination of men must be such as are necessary in genere, and not things idle and superfluous.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/john-corbet.html">John Corbet</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Remains of</cite>, Of Divine Worship… in The Remains of the Reverend and Learned Mr. John Corbet, Late of Chichester Printed from his own Manuscripts (London: Thomas Parkhurst, 1684), pt. 3 | sect. 5, What things of or belonging to Divine Worship may be Devised or Instituted by Man</span></figcaption>

<blockquote><p>The light of nature sheweth that there is a God, who hath lordship and sovereignty over all; is good, and doeth good unto all; and is therefore to be feared, loved, praised, called upon, trusted in, and served, with all the heart, and with all the soul, and with all the might.[a] But the acceptable way of worshipping the true God is instituted by himself, and so limited by his own revealed will, that he may not be worshipped according to the imaginations and devices of men, or the suggestions of Satan, under any visible representation, or any other way not prescribed in the holy Scripture.[b] [a] Rom. 1:20. Acts 17:24. Ps. 119:68. Jer. 10:7. Ps. 31:23. Ps. 18:3. Rom. 10:12. Ps. 62:8. Josh. 24:14. Mark 12:33. [b] Deut. 12:32. Matt. 15:9. Acts 17:25. Matt. 4:9,10. Deut. 4:15-20. Exod. 20:4-6. Col. 2:23.</p></blockquote>

<blockquote><p>The pious taste is outraged by the monopolizing of sacred time, and the indecent thrusting aside of God’s holy worship to make room for “solos,” which are unfit in composition, and still more so in execution, where the accompaniment is so hopelessly out of relation to the voice that if the one had the small-pox (as apparently it often has St. Vitus’ dance) the other would be in no danger of catching the disease, and the words, probably senseless at best, are so mouthed as to convey no more ideas to the hearers than the noise of Chinese tom-toms. Worshippers of true taste and intelligence, who know what the finest music in Europe really is, are so wearied by these impertinences that they almost shiver at the thought of the infliction. The holy places of our God are practically turned into fifth-rate Sunday theatres.</p></blockquote>

<blockquote><p>6. The question concerning particular works, or permitted recreations, is wholly useless and trifling: for quod lege prohibitoriâ vetitum non est, permissum intelligitur, says the law: all that is permitted which in the negative precept is not forbidden: But as for some persons to give themselves great liberties of sport on that day is neither pious nor prudent; so to deny some to others is neither just nor charitable. The plowman sits still in the Church and the Priest labours; and the wearied man is permitted to his refreshment, and others not permitted because they need it not (Ordinary Gloss on Mt. 28); and there is no violation of any commandement of God, even when there is a profanation of the day indulged upon pious and worthy considerations.</p></blockquote>

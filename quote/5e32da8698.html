<main class="wrap"><figure class="quote" id="q-5e32da8698" data-kw="">
<blockquote><p>We know no other public redress; for Christ has left it there, and so may we also: Neither can it be instructed from Scripture that Christ has appointed separation to be the next step of a private person’s duty for removing of offenses.” And there he shows, “A private person must either acquiesce, as being exonered, when he has followed the action before the Church, or he shall have no ground of peace anywhere till he be out of the world, or out of all visible Churches: And so also there can be no other way of keeping public order and ordinances, and of eviting scandal and confusion. This truth is fully made out,” says he, “by these three worthy and pious divines of New England, [John] Cotton, [Thomas] Hooker and [John] Norton.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/john-currie.html">John Currie</a></span><span class="wk"><span class="lbl">Work:</span> <cite>An Essay on Separation: or a Vindication of the Church of Scotland contra the Seceders</cite></span></figcaption>
<div class="meta"><span class="t"><a href="../topics/the-church/schism-and-separation.html">Schism and Separation</a></span></div>

</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-ad9c349332" data-kw="">
<blockquote><p>What cannot warrant a breach where there is union, that cannot warrantably be the ground to keep up a division; Now there are many miscarriages or defects, which are really gross, and yet will not warrant a schism, as all that write thereon do clear, and is obvious to all. The reason of the consequence is, because making up of a breach is no less a duty than preventing thereof; and further, if it began upon such a ground, then the continuing thereof upon the same ground is but the continuing in the same sin; and it cannot be thought that any party by dividing upon an unjust ground can afterward be justified upon the same ground; It remains therefore, that if the ground was not sufficient at first to warrant a separation or division, it cannot be sufficient afterward to continue the same.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/james-durham.html">James Durham</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Dying Man’s Testament to the Church of Scotland, or a Treatise concerning Scandal</cite>, ... (Edinburgh: Higgins, 1659), pt. 4, ch. 7, p. 320</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/the-church/schism-and-separation.html">Schism and Separation</a></span></div>

</figure><figure class="quote" id="q-fce6c1b418" data-kw="">
<blockquote><p>This is no separation from the Church of Scotland, either in her doctrine, worship, discipline or government, but only a departing, or going forth from her sins, backslidings and defections, as we are commanded by the Lord; and for a time only from some congregations, because of these. This is not a positive or active separation form the Church, casting at it as no Church, or defaming the ministry thereof, or gathering new distinct Churches; only a negative and passive separation, refusing to follow the declining part of the Church holding on in their new course, and choosing rather to stand still and cleave to that part, though smaller, endeavoring to retain and maintain the covenanted work of reformation against Popery, prelacy, Erastianism and sectarianism, schism and defection.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/john-currie.html">John Currie</a></span><span class="wk"><span class="lbl">Work:</span> <cite>An Essay on Separation: or a Vindication of the Church of Scotland contra the Seceders</cite></span></figcaption>

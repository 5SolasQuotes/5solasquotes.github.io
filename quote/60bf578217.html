<main class="wrap"><figure class="quote" id="q-60bf578217" data-kw="">
<blockquote><p>Then, as the customs of regions often express diverse interests and discernments, so persons born in these regions hold diverse patterns in their customs. Accordingly, they are unable to come together at the same time without some antipathy toward each other, which when once aroused tends to stir up sedition, subversion, and damage to the life of the commonwealth. …

The magistrate should know the nature and attitude of his own people, of neighbouring peoples, and of people in general. The nature, condition, and attitude of his own people, or the people subject to him, ought to be perceived, explored, and learned by him in order that he may know in what things and by what means he may lead, motivate, offend, and rule his people, and what sort of laws and manner of governing are consequently most appropriate. …

It is necessary that he know the nature, character, and propensities of neighbouring peoples because treaties, commercial arrangements, wars, and other transactions often develop with them, or because he has need of their services in social life. … Bad neighbours are inflicted by God upon some realm or other in order to reprimand and correct its vices, or to constrain it within its duties. …</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/johannes-althusius.html">Johannes Althusius</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Politica</cite>, ed. and trans. Frederick S. Carney (1614; Indianapolis IN: Liberty Fund, 1995), 23.14-17.</span></figcaption>

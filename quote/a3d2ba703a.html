<main class="wrap"><figure class="quote" id="q-a3d2ba703a" data-kw="">
<blockquote><p>We are especially to meditate upon and celebrate the work of redemption. We are especially joyfully to remember the resurrection of Christ, because that was Christ finishing the work of redemption; that was the day wherein he rested and was refreshed after he had endured those extreme labours that he underwent for our perishing souls. This was the day of the gladness of Christ’s heart. It was the day of his deliverance from the chains of death, and of our deliverance; for we are delivered in him who is our head. He, as it were, rose with his elect; he is the “firstfruits”; those that are Christ’s will follow [1 Corinthians 15:20, 1 Corinthians 15:23]. Christ, when he rose, was justified as a public person, and we are justified in him. This is the day of our deliverance out of Egypt.

We should therefore meditate on this with joy. We should have a sympathy with Christ in his joy. He was refreshed on this day; we should be refreshed, as those whose hearts are united with his. When Christ rejoices, it becomes all his church everywhere to rejoice. We are to say of this day, “this is the day that the Lord hath made” [Psalms 118:24].

But we are not only to commemorate the resurrection, but the whole work of redemption, of which this was the finishing. We keep the day on which the work [was] finished, because ’tis in remembrance of the whole work. We should on this day contemplate the wonderful love and {work of redemption}, and our remembrance of these things should be accompanied with suitable exercises of soul with respect to them. When we call to mind Christ’s love, it should be with the exercise of mutual love. When we commemorate this work, it should be with faith in the Savior. And we should praise God and the Lamb for this work, for his glory and his love manifested in it, in our private and public prayers, in talking of God’s wondrous works and singing divine songs.

Hence ’tis proper that Christ’s disciples should choose this day to come together to break bread, to celebrate the ordinance [of the] Lord’s Supper (Acts 20:7), because ’tis an ordinance instituted in remembrance of the work of redemption.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/jonathan-edwards.html">Jonathan Edwards</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Perpetuity and Change of the Sabbath</cite>, (1730-31) in Sermons and Discourses, 1730-1733: The Works of Jonathan Edwards Volume 17, ed. Mark Valeri (New Haven CN: Yale University Press, 2000), pp 249-50.</span></figcaption>

</figure><figure class="quote" id="q-af4b2061c2" data-kw="">
<blockquote><p>The instances he gives from the church of the Jews, or that may be given, are either civil observances, as the feast of purim; or moral conveniencies directed by general rules, as the building of synagogues; or customary signs suited to the nature of things, as wearing of sackcloth; or such as have no proof their being approved, as the feast of dedication, and some monthly fasts taken up in the captivity;—from none of which any objection can be taken against the position before laid down. Those from the church of the New Testament had either a perpetual binding institution from the authority of Christ, as the Lord’s-day Sabbath; or contain only a direction to use civil customs and observances in a holy and sanctified manner, as the love feasts and kiss of charity; or such as were never heard of in the New Testament at all, as the observation of Lent and Easter. He that out of these instances can draw a warranty for the power of the civil magistrate over religion and the consciences of men, to institute new duties in religion when he pleaseth, so these “do not countenance vice nor disgrace the Deity,” which all his Christian subjects shall be bound in conscience to observe, or otherwise make good any of those particular conclusions, that therefore Christ is not the only lawgiver to his church, or that divine revelation is not the adequate rule of divine worship, or that men may add any thing to the worship of God, to be observed in it constantly and indispensably by the whole church, will manifest himself to have an excellency in argumentation beyond what I have ever yet met withal.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/john-owen.html">John Owen</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Truth and Innocence Vindicated in A Survey of a Discourse Concerning Ecclesiastical Polity, and the Authority of the Civil Magistrate Over the Consciences of Subjects in Matters of Religion in The Works of John Owen</cite>, ed. William H. Goold, vol. 13 (Edinburgh: T&amp;T Clark, n.d.), 479.</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/worship.html">Worship</a></span></div>

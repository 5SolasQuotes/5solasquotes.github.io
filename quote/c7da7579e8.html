<main class="wrap"><figure class="quote" id="q-c7da7579e8" data-kw="">
<blockquote><p>The whole counsel of God concerning all things necessary for His own glory, man’s salvation, faith and life, is either expressly set down in Scripture, or by good and necessary consequence may be deduced from Scripture: unto which nothing at any time is to be added, whether by new revelations of the Spirit, or traditions of men. (Westminster Confession 1.6)

Many have been perplexed by the Confession’s emphasis upon the validity of “good and necessary consequence” deductions from scripture, as they assume that this adds to the Bible as the rule of faith. On the contrary, as Fisher’s Catechism explains, the Bible demands that we make valid logical deductions from its own teaching:

Q. 42. Are plain and necessary consequences to be admitted as a part of the rule, as well as the express scriptures?

A. Yes; as is evident from the instance of our Lord, in proving the doctrine of the resurrection against the Sadducees, Matt. 22:31, 32 – “As touching the resurrection of the dead, have ye not read that which was spoken unto you by God, saying, I am the God of Abraham, the God of Isaac, and the God of Jacob? God is not the God of the dead, but of the living.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/james-fisher-and-ebenezer-erskine.html">James Fisher and Ebenezer Erskine</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Assembly’s Shorter Catechism Explained, by way of Question and Answer. In Two Parts</cite>, (1765; Stoke-on-Trent: Tentmaker, 1998), p. 24.</span></figcaption>

</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-0864231799" data-kw="">
<blockquote><p>Our fourteenth argument is as follows: If the scriptures do not interpret themselves or judge controversies, this is because they are either obscure or imperfect. But they are neither obscure nor imperfect, as we have already proved. Therefore they both interpret themselves and judge controversies.</p></blockquote>

</figure><figure class="quote" id="q-6d07731405" data-kw="">
<blockquote><p>1. Where the authority of God evidences itself … and confirmed to the mind, believers have a stable and sure foundation for their faith, whether they use translations or the originals, though it must be allowed, where persons are capable of it, the originals are most satisfying.

And this is plainly the case, as all real Christians from certain experience know, as to all the truths of the greatest importance, and whereon our faith or obedience are more immediately or directly concerned: so that as to these there is no room left for this objection.

2. The wisdom of God has so carefully provided for the security and stability of our faith, as to particular truths of any considerable importance, against pretences of this, or of a like nature, that our faith rests not upon the evidence of one single testimony, but such truths upon a variety of occasions are often repeated, and our faith leans upon them, not only as thus frequently repeated, but cleared and confirmed by their connection to other truths, which infer them and the whole analogy of faith, or current of the Scriptures, with respect to that which is the principal design of God. So that we are in no hazard of being deprived of any one truth, of any considerable influence, in faith or practice by pretended corruptions, or wrong translations.

The famous Dr. [John] Owen, who had considered the whole various readings, and well knew the failures of particular translations, observes, that were all the various readings added to the worst and most faulty translation, the church of God would not sustain by it the loss of one important truth.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/thomas-halyburton.html">Thomas Halyburton</a></span><span class="wk"><span class="lbl">Work:</span> <cite>An Essay Concerning the Nature of Faith; or, The Ground upon which Faith Assents to the Scriptures</cite>, (1714) in Faith and Justification (Gwynedd: James Begg Society, 2000), pp 70-71.</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/holy-scripture.html">Holy Scripture</a></span></div>

</figure><figure class="quote" id="q-5ecf662f44" data-kw="">
<blockquote><p>THE BIBLE has received from man a treatment different from all other books, whether esteemed sacred or profane. Some have received and regarded it as the oracles of God, the only guide to heaven. Others have regarded it as an imposition of designing knaves. Some have delighted to exhibit the evidence of its divine origin, with all its overwhelming conviction. Others have sophisticated with, full ingenuity to cloud its evidences, and bewilder the human mind in the mazes of error &amp; falsehood.

The adversary, being driven from the field of argument again and again, and convinced by triumphs of the doctrines of the cross, so rapid and so extensive, that open and their opposition was in vain, has resorted to two artful stratagems: 1st. To admit that the Bible was the word of God; but that it was dangerous to the souls of men to suffer it to be in the hands of the laity. 2d. To admit the Bible had a divine origin; but that the Alcoran [Koran] was still a more perfect revelation, and God’s last testament to man.

These artifices completed the eastern and western apostasies. The consequence was, the Bible was soon banished almost from the abodes of men. The dogmas of arrogance, and the fooleries of superstition and ignorance, were imposed on the credulous people as the religion of Jesus of Nazareth.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/isaac-l-anderson.html">Isaac L. Anderson</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Millennium. A sermon, delivered at the organization of the Blount County Bible Society, November 21, 1827 in The Calvinistic Magazine</cite></span></figcaption>

</figure><figure class="quote" id="q-03ccf1e39a" data-kw="">
<blockquote><p>There are four heads: First, they ordain that in doctrine we are not to stand on Scripture alone, but also on things handed down by tradition. … These four things being established, who can deny that the war is ended? … for whatever they produce, if supported by no authority of Scripture, will be classed among traditions, which they insist should have the same authority as the Law and the Prophets. What, then, will it be permitted to disapprove? for there is no gross old wife&#x27;s dream which this pretext will not enable them to defend.</p></blockquote>

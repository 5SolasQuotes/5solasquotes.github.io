<main class="wrap"><figure class="quote" id="q-77b22dc82a" data-kw="">
<blockquote><p>Oh shameful and unsufferable wickedness! It is not so with any Religion as it is with ours. In any Religion of Jews, Turks, Papists, the more strict and exact, the more Honoured and esteemed: Only in the Protestant Religion, the stricter and preciser, the more scorned and despised. It was a very noble act, that of Nebuchadnezzar, Dan. 3. 29. I make a decree, that every people, nation and language which speak any thing amiss against the God of Shadrach, Meschach, and Abednego, shall be cut in pieces, and their houses shall be made a dunghill, &amp;c. I could wish, that our Law-makers, would provide a Statute, that it might be lawful for no man, with impunity, to deride and scorn Religion, or the strict profession of it.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/daniel-cawdrey.html">Daniel Cawdrey</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The good man a public good. A sermon preached to the honourable House of Commons, at the late solemn fast:</cite>, January 31, 1643 (London, 1643), p. 14.</span></figcaption>

</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-81dff26696" data-kw="">
<blockquote><p>This Prediction [in 1 Samuel 8] then of such punishment to them by their Kings oppressing of them, cannot be a Law or punishment intended to other Nations being under a King, who have not provoked God in seeking a King as Israel had God threatened and imposed on the Jews and other Nations in Nebuchadnezzar’s time their putting their neck under his yoke, though he was not their hereditary Prince, but an invading enemy. From whence no man will gather (I hope) that any Nation are bound to yield to a foreign Enemy invading them.

Also God threatened that the Jews should be carried captives into other Countries, and there they should serve other gods, wood and stone, &amp;c. where he would not shew them any favour; I am sure no man will argue from hence, that this is a law for other captives to submit to (or was any excuse to them, much less a law) but a mere punishment to them, and warning to other, least in them also sin be punished with sin, which is the forest punishment of all.</p></blockquote>

ener">Share on X</a><a class="perma" href="../quote/81dff26696.html">Permalink</a><a class="src" href="https://reformedcovenanter.wordpress.com/2019/09/02/herbert-palmer-on-the-right-to-resist-foreign-invaders-and-captors/" rel="noopener" target="_blank">Read it online · Reformed Covenanter</a></div>
</figure><figure class="quote" id="q-beb6032e0f" data-kw="">
<blockquote><p>There are many things that are very discouraging like; but there is comfort, Jesus Christ is a King, and seeing He is a King, He will have subjects; yea, He will reign till He put all his enemies under his feet. Shall not the pleasure of the Lord prosper in his hand? “He will see of the travail of his soul, and be satisfied.” And may not our souls feed upon the ravishing thoughts of the pureness of that Church that He will have in Scotland? What shall be the end of all these things? shall they not all tend to the purging of Jacob from his sin? […]

A sight of the preciousness that is in Him will cause us to go through fire and water with Him and for Him. Will not the consolations of his Spirit bear up the soul in all its difficulties? especially when it is aye made to see in the end, that it could not want one dram-weight of its cup?</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/james-renwick.html">James Renwick</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Letter to Robert Hamilton, 6 Feb. 1683 in Thomas Houston (ed.), Spiritual support and consolation in difficult times: the letters of the Rev. James Renwick, the last of Scotland’s covenanted martyrs, with and introduction, containing a historical sketch of Renwick’s life, labours, and martyrdom, and</cite></span></figcaption>

el="noopener" target="_blank">Read it online · Reformed Covenanter</a></div>
</figure><figure class="quote" id="q-387567a70d" data-kw="">
<blockquote><p>And as the Prince hath no more power then what is communicated from the community; so the people or community cannot give away from themselves the power of self-preservation. Because the same Commandment that faith, Thou shalt not kill: doth also say, Thou shalt preserve.

Precepts that forbid evil, do command the contrary good. Now the moral natural Law of God forbids a man to kill himself, and therefore commands him to preserve himself: and as by a positive act men cannot make a Law to kill themselves, no more can they not to preserve themselves; the one being as strongly commanded by the moral Law, and as deeply seated in Nature as the other. Secondly, because if the community should give away the power of self-preservation, the state should not be in a better but in a worser condition then before.

The King and Prince is taken into Office for the good of the people, therefore called Pater patriae, &amp; Pastor gregis: not because he may arbitrarily rule in the Common wealth as a Father doth in his family; but because of his tender care that he is to have over his people; and that the people might live more secure and peaceably in all godliness and honesty: But if the community should give such a trust to any one that they might not at all defend themselves beyond his actual appointment, they should be infinitely in a worser condition then before, because before such trust they should be freemen; but after the trust they should be slaves, unless it pleases the King through his own gracious condescension to let them be free still: for what is a slave but such a one who is so absolutely at the power of another’s command, that he may be spoiled, or sold, or put under the Galleys, and there beaten daily, having no power to make any resistance or self-defence.

Thirdly, it is agreeable to the Law of Nations and Reason, that no inferior Court can undo what a superior Court hath done, As where an estate is settled upon children by Act of Parliament, no inferior Court of Justice can cut off the intayle. Now self-preservation is enacted in the Court of Nature, as he that hath read but Magirus unbound, I mean common natural principles, will grant, and therefore no act of a community can cut off this intayle from their posterity, or make such a deed of Conveyance whereby themselves and their children should be spoiled of self-preservation.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/william-bridge.html">William Bridge</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The truth of the times vindicated whereby the lawfulness of Parliamentary proceedings in taking up of arms, is justified, Doctor Ferne’s reply answered, and the case in question more fully resolved</cite>, (London: Ben. Allen, 1643), p. 14.</span></figcaption>

</figure><figure class="quote" id="q-c6852c840c" data-kw="">
<blockquote><p>The truth is, the times were very sad, and nothing but lamentation and bemoanings heard in the streets. Those that had wealth retired into the country, but those that were needy were, if not taken away by death, almost starved, and so consequently ready to mutiny against their superiors for relief. All the gates of colleges and halls were constantly kept shut day and night, a few persons being left in them to keep possession. The shops of the town were closed, none but the attendants on the sick or the collectors for them were to be seen stirring abroad, the churches were seldom or never open for divine service.</p></blockquote>

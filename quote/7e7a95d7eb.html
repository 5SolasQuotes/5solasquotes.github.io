<blockquote><p>Neither can the names of Jesus and Christ prove that what is said there [in Prov. 8:15-16, 22-30] must needs be meant of Him as Mediator. Mark how well-grounded Mr. Hussey’s arguments are. Jesus sat at meat in Simon the Pharisee’s house, Luke 7:37; Jesus wept for Lazarus, because He loved him, John 11:35-36. Must we needs therefore say that, as Mediator, He sat at meat in the Pharisee’s house, and, as Mediator, He wept for Lazarus? Christ is the Son of David, Matt. 22:42. Must we therefore say that, as Mediator, He is the Son of David? Christ is “God over all, blessed forever,” Rom. 9:5. Must we therefore say that this is meant of Christ only as Mediator? What is more ordinary than to use the names of Jesus and Christ when the thing which is said is meant in reference to one of the natures?</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/george-gillespie.html">George Gillespie</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Aaron’s Rod Blossoming</cite>, … (1646), pt. 2, ch. 6, p. 98, lt col</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/the-mediator-prophet-and-king/kingly-office.html">Kingly Office</a></span></div>

<blockquote><p>4. The intrinsical acts of God which do connote some habitude and respect to some thing that is out of the Godhead, are the will of God, or the essence of God considered after the manner of an act of his will, ‘essentia ex se actuosa’ (as the Schools speak) ‘concepta per modum actus volendi.’ If this act be considered in itself, it is nothing else but the will or essence of God, because it is an intrinsical and vital act. But now if this act be considered as relative, and as related to some thing that is out of God, we say this act is not necessary, but free in respect of all those things which God decrees to produce or permit in the world; for God does arbitrarily decree to permit or produce this, and not that, according to the counsel of his own will, it being as truly and fully in his power to permit or produce that, as this: both were alike possible, but this is made future, and will in the fullness of time be present in act by virtue of the free decree of God; for all creatures are produced and do exist by the will of God. It is most evident that the will of God is the same whether it act upon Himself or something that is out of the Godhead.

5. The relation which is between the will of God, and the creature, whether in futurition, or existence, is extrinsical.

6. The denominations grounded upon the termination, or relation of the will of God towards the creatures, is extrinsecal also.

7. These actions of God which are said to be rather from God, than in God, as to create, govern, redeem or the like, are called extrinsical, and therefore the denomination of God from them must needs be extrinsical.

8. We have no ground to conceive that the essence of God is compounded with extrinsical terminations, relations, or denominations.

9. Though the objects which God does will are very different, and their production is successive, yet the will of God is the self same, and is one single and pure act: the Power of willing and the act of willing are not distinct in God; nay God does will his own happiness necessarily, and the happiness of men and angels freely by the same will; necessity and liberty do not make distinct powers or wills in God.

10. There is no potentia executiva in God, and therefore all those conceits of Vorstius [an Arminian] concerning any change or composition in God by several acts or decrees are but mere dreams, and vain conceits, though they be now published to the world, not with less blasphemy than impudence in this licentious age. It is evident by what has been said that the eminent virtue of God (notwithstanding its several objects, egresses, terminations, relations, denominations and effects) is one single and infinite perfection. This will be the constant result and conclusion of all sober debates, and Christian discussions.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/francis-cheynell.html">Francis Cheynell</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Divine Trinunity of the Father, Son &amp; Holy Spirit</cite>, … (London, 1650), pp. 129-32</span></figcaption>

ine</a></div>
</figure><figure class="quote" id="q-08b16872f6" data-kw="">
<blockquote><p>But we may well enough grant the proposition true, that Christ, as Mediator, is to be adored with divine worship, because as He is Mediator, He must necessarily be God, and so therein is included the ratio formalis sub quà [the formal reason which is under] of all religious worship: So that to be worshipped as Mediator, and as God, are not opposite, but one is necessarily included in the other.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/anthony-burgess.html">Anthony Burgess</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Sermon 137, ‘How Christ</cite>, (as Mediator) had his Glory given Him, although as God He could not properly have any thing given Him, except by way of Manifestation: Against the Socinians’ in 145 Expository Sermons upon John 17 (1656) See especially, p. 667 | Burgess (d. 1664) was a Westminster divine. Burgess’ key statement is:</span></figcaption>

<blockquote><p>Of these natures, the necessity, and verity whereof hath been declared, there are divers operations; for there are two natures in Christ, as it were two inward, and effectual beginnings; out of which formally, Actions, and their manners, are deduced: wherefore, as all things in Christ, (his subsisting only excepted,) are two-fold, (or of two sorts) to wit, his Nature, Properties, Will, Knowledge: so are there two-fold operations; some divine, some humane, distinguished by their beginnings, manners of doing, and the particular Actions of each of them. By their beginnings: because, look how many Natures there are; so many formal beginnings of actions there are. By the manners of doing: for every beginning works according to it own manner, and condition: the God-head, after a supernatural, and divine manner: the man-hood after a Natural and Human manner. By particular Actions; for the Word works that, which is of the Word, and the Flesh, that, which is of the Flesh, without any confusion of Natures, in the unity of Person.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/lucas-trelcatius.html">Lucas Trelcatius</a></span><span class="wk"><span class="lbl">Work:</span> <cite>A Brief Institution of the Common Places of Sacred Divinity</cite>, … (London, 1610), ‘Of the Person of Christ’, Part Confirmative, ch. 6, pp. 152-3</span></figcaption>

<main class="wrap"><figure class="quote" id="q-67fd21c102" data-kw="">
<blockquote><p>Men are not justified for what they are or for what they do, but for what Christ has done for them. God has set Him forth as a propitiation for sin, in order that He might be just and yet the justifier of them that believe.</p></blockquote>

</figure><figure class="quote" id="q-94faf9202e" data-kw="">
<blockquote><p>Justification by faith is an answer to the greatest personal question ever asked by a human soul: “How shall I be right with God? How do I stand in God’s sight? With what favor does he look upon me?” There are those, I admit, who never raise that question. There are those who are concerned with the question of their standing before men but never with the question of their standing before God. There are those who are interested in what “people say” but not in the question of what God says. Such men, however, are not those who move the world. They are apt to go with the current. They are apt to do as others do. They are not the heroes who change the destinies of the race. The beginning of true nobility comes when a man ceases to be interested in the judgment of men and becomes interested in the judgment of God.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/j-gresham-machen.html">J. Gresham Machen</a></span><span class="wk"><span class="lbl">Work:</span> <cite>God Transcendent</cite></span></figcaption>
<div class="meta"><span class="t"><a href="../topics/justification/nature-of-justification.html">Nature of Justification</a></span></div>

</figure><figure class="quote" id="q-a8d5e74bd6" data-kw="">
<blockquote><p>However, our inherent righteousness, which is begun in the renewal through the Holy Spirit, is not such on account of the adhering imperfection and impurity of the flesh. Therefore a different righteousness is necessary, by which, when it enters in and intercedes, we may be justified before God to life eternal. This indeed is the satisfaction and obedience, that is, the righteousness of Christ, the Mediator, which is offered through the ministry of the Word and of the sacraments, is apprehended by faith, and is imputed by God to the believers, so that we can interpose it between the judgment of God and our sins, so that we are protected under it as under a shield from the divine wrath which we have deserved, so that “covered by it we may now boldly and securely stand before the divine tribunal and thus be pronounced righteous to life eternal.”</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/martin-chemnitz.html">Martin Chemnitz</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Examination of the Council of Trent</cite>, Part 1, Topic on Justification</span></figcaption>

</figure><figure class="quote" id="q-ceb0ea4a92" data-kw="">
<blockquote><p>This most divine doctrine concerning the gratuitous justification of sinful man before God&#x27;s tribunal through Christ, apprehended by true faith, is the citadel of the entire Christian Religion, and the bond by which all members of the body of Christian doctrine are held together, which being broken, all remaining articles are dislocated and dissolved.</p></blockquote>

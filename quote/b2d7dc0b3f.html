<main class="wrap"><figure class="quote" id="q-b2d7dc0b3f" data-kw="">
<blockquote><p>Carl Trueman’s study of the thought of John Owen both analyzes Owen’s own change of position and sets Owen’s doctrinal argumentation into the context of a centuries-long doctrinal conversation and debate over the necessity of the atonement, noting the position of Aquinas [holding to consequent necessity], the shift in argumentation brought about by Scotus’ voluntarism, and the apparent reflection of the Scotist view in Calvin’s own thought. Owen’s earlier approach followed out this more or less Scotistic approach and found confirming echoes in the thought of William Twisse and Samuel Rutherford. In his later approach, Owen saw the primary threat to orthodoxy as arising not from the Arminians but from the Socinians and, accordingly refocused his argument from a more intellectualist perspective and rooted the necessity of the atonement in God’s vindicatory justice. This shift in Owen’s formulation and the fact that it involved significant debate with and departure from the views of such significant Reformed thinkers as Calvin, Musculus, Twisse, and Rutherford and actually, as Trueman notes, put Owen into the company of Pareus, Piscator, Lubbertus, Cameron, and Maccovius, very clearly illustrates the diversity of the Reformed tradition, the presence of significant debates within the confessional tradition… Owen’s mature views placed him, on this particular issue, consciously in the camp of Piscator, Cameron, and Amyraut.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/richard-muller.html">Richard Muller</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Other citations (work not named)</cite>, ch. 1, “Diversity in the Reformed Tradition: a Historiographical Introduction” in eds. Haykin &amp; Jones, Drawn into Controversie: Reformed Theological Diversity &amp; Debates within Seventeenth-Century British Puritanism (V&amp;R, 2011), pp.. 26-27</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/priestly-office-satisfaction-and-atonement/necessity-of-satisfaction.html">Necessity of Satisfaction</a></span></div>
<div class="actions"><button class="copy" data-copy="“Carl Trueman’s study of the thought of John Owen both analyzes Owen’s own change of position and sets Owen’s doctrinal argumentation into the context of a centuries-long doctrinal conversation and debate over the necessity of the atonement, noting the position of Aquinas [holding to consequent necessity], the shift in argumentation brought about by Scotus’ voluntarism, and the apparent reflection of the Scotist view in Calvin’s own thought. Owen’s earlier approach followed out this more or less Scotistic approach and found confirming echoes in the thought of William Twisse and Samuel Rutherford. In his later approach, Owen saw the primary threat to orthodoxy as arising not from the Arminians but from the Socinians and, accordingly refocused his argument from a more intellectualist perspective and rooted the necessity of the atonement in God’s vindicatory justice. This shift in Owen’s formulation and the fact that it involved significant debate with and departure from the views of such significant Reformed thinkers as Calvin, Musculus, Twisse, and Rutherford and actually, as Trueman notes, put Owen into the company of Pareus, Piscator, Lubbertus, Cameron, and Maccovius, very clearly illustrates the diversity of the Reformed tradition, the presence of significant debates within the confessional tradition… Owen’s mature views placed him, on this particular issue, consciously in the camp of Piscator, Cameron, and Amyraut.”

</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-3dea9d2390" data-kw="">
<blockquote><p>Whether there were any flat necessity of man’s suffering after the Fall is doubted by many and denied by Socinus. Whether this necessity arises from God’s natural justice, or his ordinate, viz. his decree, and the verity of the threatening, is also with many of our own divines a great dispute: Whether God might have pardoned sin if He had not said, ‘The sinner shall die,’ may be doubted of (though I believe the affirmative, yet I judge it a frivolous presumptuous question. But the word of his threatening being once past, methinks it should be past question that He cannot absolutely pardon without the apparent violation of his truth, or wisdom. Some think that it proceeds from his wisdom rather than his justice, that man must suffer: see Mr. John Goodwin, Of Justification, pt. 2, p. 34), but why should we separate what God has conjoined? However, whether wisdom, or justice, or truth (or rather all these) were the ground of it, yet certain it is that a necessity there was that the penalty should be inflicted: or else the Son of God should not have made satisfaction, nor sinners bear so much themselves.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/richard-baxter.html">Richard Baxter</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Aphorisms of Justification</cite>, … (Hague, 1655), thesis 5, pp. 12-13</span></figcaption>

h%20themselves" rel="noopener" target="_blank">Read it online · Reformed Books Online</a></div>
</figure><figure class="quote" id="q-1d54e976df" data-kw="against Socinian denial">
<blockquote><p>Concerning the necessity of a satisfaction, there are three principal opinions of theologians. The first of those simply denying it (as the Socinians, who not only deny that Christ made a real satisfaction, but that there was any need of it). The satisfaction here discussed is taken strictly for the payment of a debt, with which is paid what another owes and with which he satisfies the creditor or judge who requires the debt or punishment. Was it necessary for Christ to make satisfaction to divine justice for us? We affirm against the Socinians.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/francis-turretin.html">Francis Turretin</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Institutes of Elenctic Theology</cite>, 14.10.3–4</span></figcaption>

</figure><figure class="quote" id="q-7a002a9e32" data-kw="">
<blockquote><p>Regarding the first , the Arminians think that the death of Christ was not necessary for procuring salvation for men, and they believe that God could have pardoned sins without any satisfaction. The Orthodox [Reformed], indeed, believe that that way of saving the human race was the most fitting of all, since God was pleased to use it; yet most of them readily concede to the Arminians that it was not absolutely necessary, and they do not contend that God’s justice was to that extent inexorable. Amyraut believes that God’s justice is so inflexible, and the majesty of his laws so holy and inviolable, that it could not suffer sins to be pardoned without satisfaction. In this matter, he has surrounded the orthodox doctrine with a defense by which it is stripped by many others. He has, moreover, proved his opinion on this matter with arguments in his Theses on the Necessity of Satisfaction for Grace.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/moses-amyraut.html">Moses Amyraut</a></span><span class="wk"><span class="lbl">Work:</span> <cite>A Declaration of the Faith of Moses Amyraut concerning the Errors of the Arminians</cite>, trans. AI by Onku (Salmur: Lesnerius, 1646), p. 5 Latin</span></figcaption>

<main class="wrap"><figure class="quote" id="q-4f63c5d071" data-kw="">
<blockquote><p>So the apostle in these two verses is shewing what that knowledge of God was which the Heathens had, and how they came by it. God’s eternal power and Godhead, which are in themselves invisible, was a thing the knowledge whereof was attainable by the light of nature. They had common principles of knowledge given them of God, whereby, looking upon the works of creation, they might safely and solidly gather, what a God he was and what was his due; so that they were rendered inexcusable in abusing this light; and their mouths were stopped, so that they had nothing to say for themselves, why they lived in ungodliness and unrighteousness. …

However the Lord Jehovah be it himself unsearchable, yet hath he left at much light in folks, that were they desirous, by the very principles of natural knowledge, they might see as much of God as might convince them that he only is to be worshipped, loved, and feared for it pleased the Lord that as much as might be sufficient for this end, should remain attainable by sand-blind nature; that is it that might be known.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/john-brown-of-wamphray.html">John Brown of Wamphray</a></span><span class="wk"><span class="lbl">Work:</span> <cite>An Exposition of the Epistle of Paul the Apostle to the Romans, with Large Practical Observations; Delivered in Several Lectures</cite>, (Edinburgh: David Paterson, 1766), p. 34.</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/theology/natural-theology.html">Natural Theology</a></span></div>

ormed Covenanter</a></div>
</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-a11a0e697c" data-kw="">
<blockquote><p>The infinite God cannot be fully known by any of His creatures, but that there is a knowledge of Him within the reach of His creatures of mankind, is apparent from the very constitution of their nature, as well as from the relation in which they stand to Him.

That knowledge reveals to them His spirituality and His glory, as well as His providential care, that “they may seek Him, if haply they may feel after Him and find Him, though He is not far from every one of us.”

This view of the divine nature is furnished by observation of the works of God, and is also the dictate of our own consciousness, which tells us that we are not self-made and selfsustained, but that we are the children of a divine Father and the subjects of His supreme rule.

The Atheist denies the truth that there is a God; and the Pantheist affirms that there is nothing else but God. Both of these errors are renounced by enlightened reason. It refuses to be blind to the great fact of the divine existence. It also rejects the notion that this God is merely an infinite substance — a vague immensity. There is one living and true God, but in Him all being is not absorbed. He is in all; but everything is not God.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/alexander-macewan.html">Alexander MacEwan</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Revelation Embodied in Scripture Supernatural, as Contradistinguished from the Productions of merely Human Thought and Genius in Patrick Fairbairn et al., Divine Revelation Explained and Vindicated: A Course of Lectures for the Times, Delivered in Glasgow in the Spring of 1866</cite></span></figcaption>
<div class="meta"><span class="t"><a href="../topics/theology/natural-theology.html">Natural Theology</a></span></div>

quotes.github.io%2Fquote%2Fa11a0e697c.html&amp;via=5Solas" target="_blank" rel="noopener">Share on X</a><a class="perma" href="../quote/a11a0e697c.html">Permalink</a><a class="src" href="https://reformedcovenanter.wordpress.com/2019/11/19/alexander-macewan-on-the-natural-knowledge-of-god/" rel="noopener" target="_blank">Read it online · Reformed Covenanter</a></div>
</figure><figure class="quote" id="q-46901590d5" data-kw="">
<blockquote><p>Now, am I insinuating that to abandon the Aristotelian-Scholastic philosophy of nature, and in particular the theory of act and potency, would be to… threaten to open the door to pantheism, deism, or even atheism? That is exactly what I am insinuating. And here’s one reason to think that I am right: These dire consequences are exactly what followed when the Aristotelian-Scholastic tradition lost its hegemony in Western thought.</p></blockquote>

<blockquote><p>Michael Sudduth examines three prominent objections to natural theology that have emerged in the Reformed streams of the Protestant theological tradition: objections from the immediacy of our knowledge of God, the noetic effects of sin, and the logic of theistic arguments. Distinguishing between the project of natural theology and particular models of natural theology, Sudduth argues that none of the main Reformed objections is successful as an objection to the project of natural theology itself.</p></blockquote>

<main class="wrap"><figure class="quote" id="q-cbbf7dbd3f" data-kw="">
<blockquote><p>Now, we lay it down as part of Divine truth, that all men are by nature dead in sin, and utterly impotent to spiritual good; and we lay it down as equally part of revealed truth, that Christ has a people—that he died for their redemption—and that their being brought out of their state of sin and misery into a state of salvation, is the direct fruit of his suffering in their room and stead.

If these things be so, if all men are dead in trespasses and sins, and yet all men are called—if Christ died for his people, to redeem them to God, and yet salvation is offered to all—it follows necessarily that an obligation to spiritual duty is not inconsistent with total spiritual inability, and that a universal offer neither rests upon nor implies a universal atonement.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/john-bonar.html">John Bonar</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Universal Calls and Invitations of the Gospel Consistent with the Total Depravity of Man, and Particular Redemption in The Free Church Pulpit; Consisting of Discourses by the Most Eminent divines of the Free Church of Scotland. Vol. I.</cite></span></figcaption>

<blockquote><p>But here arises a doubt: Are we not to pray for wicked men, yea, the impenitent, the persecutors of the Church, contemners of the Word? I answer: … 3… 1 Jn. 5:16: ‘If any man see his brother sin a sin which is not unto death, he shall ask, and he shall give him life for them that sin not unto death. There is a sin unto death; I do not say that he shall pray for it.’ It is a tempting of God to intercede for that sin, seeing He has declared his will; the irremissible sin, is that sin, though it be hard to be found out. Therefore it is good to keep to the conditional form when a man, after the profession of religion, falls to an utter revolt and deadly hatred of it: it is a shrewd presumption they have committed that sin.</p></blockquote>

</figure><figure class="quote" id="q-c8505ebdcc" data-kw="">
<blockquote><p>The progress in sin is therefore such… First, from the tinder comes a certain motion of titillation in the flesh toward lust, that is toward carnal concupiscence, which the sense existing in the flesh apprehends. [Second,] Through whose apprehension first the sensitive appetite conjoined to the sense is moved by a motion of pleasure about that to which the flesh tingles. Thirdly it is moved by a motion of desire to pursue that into action, which motion in the sensitive appetite mediated by the sense is apprehended by the reason of simple intelligence. Through which apprehension fourthly the will is moved by a motion of delight in delighting in the sensitive appetite; and in the fifth way by a motion into delight; and sixth by surreptitious desire for consent to pursue that into action, and here is the boundary and term of venial sin. Seventh is interpretative consent in delight, and it is the first and lowest grade of mortal sin, which is called mortal from morose delight. Eighth is true consent in delight. Ninth is consent in deed and according to Augustine in On the Sermon of the Lord on the Mount, “full sin known to God in our heart, and now if by deed it does not become known to men”. And then tenth, if the opportunity is present, follows the execution of the deed. Eleventh, from frequent execution, custom; and twelfth from custom, despair; and thirteenth, from despair, obstinacy, says Augustine in the sermon on Pharaoh’s hardening: “From a multitude of sins despair is born, and from despair hardness is generated according to that which is written: ‘The sinner, when he has come into the depths of sins, despises&#x27;”. And then fourteenth and last follows final impenitence, of which says Augustine in the sermon on blasphemy against the Holy Spirit: “Impenitence, as long as one lives in this flesh, cannot be judged as we understand persistent hardness of heart”. … First indeed in this way undoubtedly first motions are sins, both in the regenerate and in the unregenerate, because they have deformity in themselves against the rules of prudence and right reason, which deformity has the rule of vice, just as its contrary information has the rule of virtue. In this way also the said obliquity in the rule has the rule of vice, and similarly the tinder in the flesh, and this according to the manner in which virtues and vices are granted to be in the sensitive powers not by essence, but by a certain participation, as we determined in a preceding Quolibet… Secondly… And this mortal, if mortal sin be called that to which is due eternal punishment, because with sin as it is sin, eternal punishment is due… And this sin in the unregenerate should be called not original sin, but actual, and this because it is perpetrated not by an act of its own will, but by an act proper to its own flesh. … To the second that “first motions are not voluntary”, it must be said that, although not voluntary as regards the will of him in whom they are… they are however voluntary as regards the will of the first parent, as determines Augustine, bk. 3, ‘On Free Choice’, from whose will proceeded his own proper actual sin and henceforth all other original sins of others, either medially or immediately, and from them first motions, from whose will they have that they are sins both as regards blemish and as regards guilt…</p></blockquote>

ebdcc.html&amp;via=5Solas" target="_blank" rel="noopener">Share on X</a><a class="perma" href="../quote/c8505ebdcc.html">Permalink</a><a class="src" href="https://reformedbooksonline.com/concupiscence-or-desires-of-pre-motions-to-sin-are-sinful/#:~:text=The%20progress%20in%20sin%20is%20therefore,regards%20blemish%20and%20as%20regards%20guilt&amp;text=The%20progress%20in%20sin%20is%20therefore%20such&amp;text=both%20as%20regards%20blemish%20and%20as%20regards%20guilt" rel="noopener" target="_blank">Read it online · Reformed Books Online</a></div>
</figure><figure class="quote" id="q-18f91d18eb" data-kw="">
<blockquote><p>Let every man consider his own sins, which he himself is guilty of. Have we not broken the holy, and righteous Commandments of God a thousand times, and shall not this break our hearts? Have we not broken our vows and covenants which we have often made with God, and will not the meditation of this break our hearts? God in Scripture is said to have a bag and a bottle. A bag to put our sins in, and a bottle to put our tears in. Have we not filled God’s bag with our sins, and shall we not now fill Gods bottle with our tears?

Doth it not grieve us, that we have so often grieved the Holy Spirit of God? Are we not heavy laden with those sins, with which God himself is pressed as a Cart with sheaves? Is not God himself broken with our whorish hearts, and will not this break our hard hearts? Have we not had years of sinning? Oh let us have one Day of mourning! Have we not trampled the blood of Christ under our feet, and shall not the blood of this Scapegoat melt our adamantine hearts?

It is an excellent saying, That in all the sins we commit, we must not so much consider the sin that is committed, as the God against whom it is committed. And this will provoke us to great Humiliation for little sins, as well as great sins. For there is no sin simply little. [1] There is no little God to sin against. The lest minimum spiritual, the least offence is committed against an infinite God; and therefore deserves [2] infinite punishment. There was no little price paid for little sins; the least sin cost the shedding of the blood of the eternal God. [3] There is no little disobedience in a little sin. For as there is the same rotundity in a little round Ball, as in a great one: So there is the same disobedience against God, in a little sin, [4] as well as in a great one. To disobey God in a little, is no little disobedience. There is no little unthankfulness in a little sin. For the lesser the thing is, in which we offend God, the greater is the unthankfulness, that we will sin against God, for so little a matter. There is no little [5] pollution and defilement, in a little sin. A little puddle may dirty a man, as well as a great one. A little Bodkin may wound a Caesar to death. [6] There is no little punishment, for little sins; For the wages of sin is death. The wages of sin as sin, and therefore of every sin. A quatenus ad omne valet consequentia. Non est distinguendum ubilex non distinguit.

And therefore let us I beseech you, mourn with a great lamentation, for our little oaths, our idle words, our omissions of good duties, and defects in good duties, &amp;c. Can we mourn for the loss of our estates, for the death of our Children? And shall we not mourn that we have lost God, and the peace of a good conscience by our sins; and that our hearts are so dead and dull to goodness?

Can we cry for the stone in the bladder, and not for a stony heart? The stone in the bladder can but kill the body; but a stony heart will cast body and soul into Hell. Weep for those diseases that will destroy soul and body for ever. We have been often in the valley of Hinnon, sacrificing our sons and daughters unto Devils, by their wicked educations; improving our parts and mercies, to the service of the Devil. Oh, let us this day descend into the Valley of Bacah, and let us make this Church a Bochim, a place of weeping. We have many Church-sins, Sermon sins, Sacrament-sins. Let us have Church-tears for our Church-sins.</p></blockquote>

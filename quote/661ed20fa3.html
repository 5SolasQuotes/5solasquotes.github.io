<main class="wrap"><figure class="quote" id="q-661ed20fa3" data-kw="">
<blockquote><p>No matter how many times the Neo-Confederate myth that the opponents of slavery were all Unitarians and Jacobins is debunked, the proponents of this viewpoint seem incapable of seeing the obvious. The Revd Dr Henry Cooke was the leading opponent of Unitarianism in Ulster during the late 1820s and early 1830s, so he can hardly be accused of being a Unitarian sympathiser. However, this is what he had to say concerning abolitionism, ‘I feel most anxious for the total and perpetual abolition of Slavery’.[1] For once and for all, this comment should put an end to the myth that all abolitionists were Unitarians. Try telling Henry Montgomery that Henry Cooke was a Unitarian!</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/guardian-and-constitutional-advocate.html">Guardian and Constitutional Advocate</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Guardian and Constitutional Advocate</cite>, 20 Nov. 1832</span></figcaption>

</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-e6b9a9fb6c" data-kw="">
<blockquote><p>The mockery which worships God with nought but external gestures and absurd human fictions, how could we, without sin, allow to pass unrebuked? We know how much He hates hypocrisy, and yet in that fictitious worship, which was everywhere in use, hypocrisy reigned. We hear how bitter the terms in which the Prophets inveigh against all worship fabricated by human rashness. But a good intention, i.e. an insane licence of daring whatever man pleased, was deemed the perfection of worship. For it is certain that in the whole body of worship which had been estabhshed, there was scarcely a single observance which had an authoritative sanction from the Word of God. We are not in this matter to stand either by our own or by other men’s judgments. We must listen to the voice of God, and hear in what estimation He holds that profanation of worship which is displayed when men, overleaping the boundaries of His Word, run riot in their own inventions. The reasons which he assigns for punishing the Israelites with blindness, after they had lost the pious and holy discipline of the Church, are two, viz., the prevalence of hypocrisy, and will-worship (ethelothreskeian), meaning thereby a form of worship contrived by man.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/john-calvin.html">John Calvin</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Necessity of Reforming the Church</cite>, (1544) in Tracts &amp; Letters relating to the Reformation, tr. &amp; ed. Henry Beveridge, 7 vols. (Edinburgh: Calvin Translation Society, 1844), 1.189</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/worship/impurities-in-worship.html">Impurities in Worship</a></span></div>

lass="src" href="https://reformedbooksonline.com/on-impurities-in-worship/#:~:text=The%20mockery%20which%20worships%20God%20with,form%20of%20worship%20contrived%20by%20man&amp;text=The%20mockery%20which%20worships%20God%20with%20nought%20but&amp;text=thereby%20a%20form%20of%20worship%20contrived%20by%20man" rel="noopener" target="_blank">Read it online · Reformed Books Online</a></div>
</figure><figure class="quote" id="q-629d1dd748" data-kw="">
<blockquote><p>Those virtues which more immediately respect God, appeared in Christ in the work that he did for our redemption. There appeared in him an holy fear and reverence towards God the Father. Christ had a greater trial of his virtue in this respect than any other had, from the honourableness of his person. This was the temptation of the angels that fell, to cast off their worship of God, and reverence of his majesty, that they were beings of such exalted dignity and worthiness themselves.

But Christ was infinitely more worthy and honourable than they; for he was the eternal Son of God, and his person was equal to the person of God the Father: and yet, as he had taken on him the office of mediator, and the nature of man, he was full of reverence towards God. He adored him in the most reverential manner time after time. So he manifested a wonderful love towards God.

The angels give great testimonies of their love towards God, in their constancy and agility in doing the will of God; and many saints have given great testimonies of their love, who, from love to God, have endured great labours and sufferings, but none ever gave such testimonies of love to God as Christ has given; none ever performed such a labour of love as he, and suffered so much from love to God. So he manifested the most wonderful submission to the will of God. Never was any one’s submission so tried as his was. So he manifested the most wonderful spirit of obedience that ever was manifested.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/jonathan-edwards.html">Jonathan Edwards</a></span><span class="wk"><span class="lbl">Work:</span> <cite>A history of the work of redemption. Containing the outlines of a body of divinity, in a method entirely new</cite>, ed. John Erskine (1774; Boston, 1782), p. 154.</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/worship.html">Worship</a></span></div>

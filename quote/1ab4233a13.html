<main class="wrap"><figure class="quote" id="q-1ab4233a13" data-kw="">
<blockquote><p>What though the Church-worship be pure, yet if the worshippers be impure, God will not accept of the worship? And if families be not reformed, how will your worshippers be pure?</p></blockquote>

</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-b4b7c5b1a8" data-kw="">
<blockquote><p>Even after Joseph had died, they observed circumcision (as seems must be gathered from Ex. 4:25), and were also intent upon prayers (Ex. 2:23); they certainly desired sacrifices, but did not sacrifice, being deterred by fear of the Egyptians (Ex. 8:26), yet at the same time when about to flee they sacrificed the Passover in Egypt (Ex. 12). Besides those points, hardly anything is mentioned about their divine worship.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/petrus-van-mastricht.html">Petrus van Mastricht</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Theoretical-Practical Theology (RHB), bk. 8, ch. 2, sect. 25</cite></span></figcaption>
<div class="meta"><span class="t"><a href="../topics/worship/impurities-in-worship.html">Impurities in Worship</a></span></div>

</figure><figure class="quote" id="q-025c2fa808" data-kw="">
<blockquote><p>It amazes me to hear wise and godly men say, ‘It is Popery that is coming in upon us;¹ therefore, let us all forsake the parish-churches, quasi die [as by the day]. The enemy will take the city within these few years; therefore, let us all go out of it today. Like him that killed himself for fear of dying some years hence. Dementation goes before perdition. Who knows not that the religion of the parish churches is likely to be the national religion? And shall we persuade protestants to leave them all?</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/richard-baxter.html">Richard Baxter</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Reformation &amp; Conformity | Catholic Communion Doubly Defended by Dr. Owen’s Vindicator &amp; Richard Baxter… (London: Parkhurst, 1684), section 5, ‘A comparison of the use of a faulty translation of the Scripture and a faulty liturgy’ | Scarecrows for Extremism</cite></span></figcaption>
<div class="meta"><span class="t"><a href="../topics/worship/impurities-in-worship.html">Impurities in Worship</a></span></div>
<div class="actions"><button class="copy" data-copy="“It amazes me to hear wise and godly men say, ‘It is Popery that is coming in upon us;¹ therefore, let us all forsake the parish-churches, quasi die [as by the day]. The enemy will take the city within these few years; therefore, let us all go out of it today. Like him that killed himself for fear of dying some years hence. Dementation goes before perdition. Who knows not that the religion of the parish churches is likely to be the national religion? And shall we persuade protestants to leave them all?”

— Richard Baxter, Reformation &amp; Conformity | Catholic Communion Doubly Defended by Dr. Owen’s Vindicator &amp; Richard Baxter… (London: Parkhurst, 1684), section 5, ‘A comparison of the use of a faulty translation of the Scripture and a faulty liturgy’ | Scarecrows for Extremism">Copy</button><a class="share" href="https://x.com/intent/post?text=%E2%80%9CIt+amazes+me+to+hear+wise+and+godly+men+say%2C+%E2%80%98It+is+Popery+that+is+coming+in+upon+us%3B%C2%B9+therefore%2C+let+us+all+forsake+the+parish-churches%2C+quasi+die+%5Bas+by+the+day%5D.+The+enemy+will+take+the+city+within+these+few+years%3B+therefore%2C+let+us+all+go+out+of+it+today.+Like+him+that+killed+himself+for+fear+of+dying+some+years+hence.+Dementation+goes+before+perdition.+Who+knows+not+that+the+religion+of+the+parish+churches+is+likely+to+be+the+national+religion%3F+And+shall+we+persuade+protestants+to+leave+them+all%3F%E2%80%9D%0A%0A%E2%80%94+Richard+Baxter%2C+Reformation+%26+Conformity+%7C+Catholic+Communion+Doubly+Defended+by+Dr.+Owen%E2%80%99s+Vindicator+%26+Richard+Baxter%E2%80%A6+%28London%3A+Parkhurst%2C+1684%29%2C+section+5%2C+%E2%80%98A+comparison+of+the+use+of+a+faulty+translation+of+the+Scripture+and+a+faulty+liturgy%E2%80%99+%7C+Scarecrows+for+Extremism&amp;url=https%3A%2F%2F5solasquotes.github.io%2Fquote%2F025c2fa808.html&amp;via=5Solas" target="_blank" rel="noopener">Share on X</a><a class="perma" href="../quote/025c2fa808.html">Permalink</a><a class="src" href="https://reformedbooksonline.com/on-impurities-in-worship/#:~:text=It%20amazes%20me%20to%20hear%20wise,persuade%20protestants%20to%20leave%20them%20all&amp;text=It%20amazes%20me%20to%20hear%20wise%20and%20godly&amp;text=shall%20we%20persuade%20protestants%20to%20leave%20them%20all" rel="noopener" target="_blank">Read it online · Reformed Books Online</a></div>
</figure><figure class="quote" id="q-fda464187d" data-kw="">
<blockquote><p>This makes for the confutation of their error: 1. That think they have no calling to come to the sacrament because they see more and greater faults in themselves than they can espy, or than, indeed, there are in many other Christians… They find so much hypocrisy, so much pride, so much vain-glory and self-love… that they… begin to fear that God will in no sort accept of them if they should come unto the table of his Son… and therefore [these things] should by no means keep them from the holy sacrament… Further, [2.] those that by reason of their infirmities will forgoe that ordinance, do greatly dishonor God, and lay an hard imputation upon Him; as who should say that He were such an extreme and rigorous Judge as will accept of none but of those that have attained to a great measure of perfection. Besides, [3.]… they have a calling to partake of the sacrament, as appears in this text… all such as prepared their whole hearts (that is, did their best endeavor with a true and sincere heart) to seek the Lord.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/john-dod.html">John Dod</a></span><span class="wk"><span class="lbl">Work:</span> <cite>(London, 1610), 4th Sermon</cite>, pp. 125-28</span></figcaption>

</figure><figure class="quote" id="q-2e0d54db80" data-kw="">
<blockquote><p>And that David might not think this motion of building God an house displeasing unto Him, although he was not permitted so to do, it is said, 1 King: 8:18, ‘Whereas it was in thy mind to build Me an house, thou didst well,’ which is here omitted, the Lord approved it expressly as a pious intention in David. And lastly because he bent his mind to the building of an house for God, the Lord promises to requite him with the like, and to build him an house, as it is said He did for the midwives of Egypt, He built them houses…</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/john-mayer.html">John Mayer</a></span><span class="wk"><span class="lbl">Work:</span> <cite>A Commentary upon the Whole Old Testament... (London: 1653), on 2 Samuel, ch. 7</cite>, p. 390</span></figcaption>

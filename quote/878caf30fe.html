</figure><figure class="quote" id="q-6c67a959d7" data-kw="">
<blockquote><p>Another fault is that all the people are appointed in diverse places to say after the minister, whereby not only the time is unprofitably wasted and a confused voice of the people, one speaking after another, caused but an opinion bred in their heads that those only be their prayers which they say and pronounce with their own mouths, which causes them to give the less heed to the rest of the prayers which they rehearse not after the minister, which, notwithstanding are as well their prayers as those which they pronounce after the minister otherwise than the order which is left unto the church of God does bear. For God has ordained the minister to this end, that, as in public meetings he only is the mouth of the Lord from Him to the people, even so he ought to be the only mouth of the people from them unto the Lord, and that all the people should attend to that which is said by the minister, and in the end both declare their consent to that which is said, and their hope that it should so be and come to pass which is prayed, by the word “Amen;” as St. Paul declares in the epistle to the Corinthians [1 Cor. 14:6], and Justin Martyr shows to have been the custom of the churches in his time. Although these blots in the Common Prayer be such as may easily enough appear unto any which is not wedded to a prejudicate opinion and that there is no great difficulty in this matter, yet I know that this treatise of prayer will be subject to many reprehensions and that there will not be wanting some probable colors also whereby these things may be defended if men will set themselves to strive and to contend: yet (for the desire that I have that these things should be amended and for the instruction of the simpler which are studious of the truth) I have been bold to utter that which I think, not doubting also but that the light of the truth shall be able to scatter all those mists of reasons which shall go about to darken the clearness thereof.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/thomas-cartwright.html">Thomas Cartwright</a></span><span class="wk"><span class="lbl">Work:</span> <cite>A Reply to an Answer made of M. Doctor Whitgift Against the Admonition to the Parliament ([Hempstead] 1573), ‘To the next section contained in the 77th, 78th and a piece of the 79th page’</cite>, pp. 138-39</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/worship/public-worship.html">Public Worship</a></span></div>

</figure><figure class="quote" id="q-040ca6aa00" data-kw="">
<blockquote><p>5. Hearing of the Word is a worshiping of God. Therefore, the Church-hearing of the Word must be Church-worship. For all professing by their visible communion in hearing the Word, one Faith, one Lord, one Hope of glory, and that as one visible body, must thereby testify they be all joint-worshippers of Christ and of one God, whose covenant they preach and hear.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/samuel-rutherford.html">Samuel Rutherford</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Due Right of Presbyteries (1644), pt. 1</cite>, p. 271</span></figcaption>

</figure><figure class="quote" id="q-904755a747" data-kw="">
<blockquote><p>Objection 17: But the particulars of your [Westminster] Directory of worship are not in Scripture, how then can the magistrate punish for not following the Directory? Answer: That there should be prayers, preaching, reading, praising of God, sacraments in the public worship, is evident by the Scripture, but for the ordering of these worships secundum prius &amp; posterius [according to what is first and that which follows] the words of prayer (so they be according to the pattern of sound doctrine) the Preface of the Directory is clear, that no man is therein to be compelled, though to transgress the Holy Ghost’s express order in the celebration of the Lord’s Supper and to break bread and eat first, and that before any of the words of institution be mentioned, or any blessing of the elements, must be a manifest breach of the directory of Jesus Christ which sure holds forth to us a twofold ordering of acts of worship, one divine, which we must peremptorily follow, another prudential and human in circumstances which concern both the worship of God and civil assemblies, as time, place, persons, etc. and in the latter we are no further to be commanded in point of uniformity than the general rules of the Word lead us; and compulsion, where God has no compelling commandment going before in an exact uniformity, we utterly disclaim, nor can men, or Church, or all the assemblies on earth make laws in matters of God’s worship where the Supreme Lawgiver has made none, and the Preface of the Directory is so clear in this that we trust we shall quickly agree with the godly and sound in judgment in this.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/samuel-rutherford.html">Samuel Rutherford</a></span><span class="wk"><span class="lbl">Work:</span> <cite>A Free Disputation Against Pretended Liberty of Conscience… (London, 1649)</cite>, pp. 372-3</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/worship/public-worship.html">Public Worship</a></span></div>

<main class="wrap"><figure class="quote" id="q-e483399691" data-kw="">
<blockquote><p>Objection 2: Mt. 23:37, ‘How often would I have gathered thy children together, and thou wouldst not. How did Christ will, and so will that He complains of those who would not, if He had not through his help made them able [to] will, whom He knew could not will? Answer. Christ is here said to have willed to gather them together, not by the will of his good pleasure, which may never be resisted, but by his signifying or revealed will. For He is said to will to gather all unto Himself, because by the preaching of the Word He calls all in common unto salvation, and prefixes to Himself this end of preaching, that they should commit themselves to his protection and fidelity. By this will therefore He may will to gather the Jews together, though in the meantime He do not help them, that they themselves may be able to will.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/william-perkins.html">William Perkins</a></span><span class="wk"><span class="lbl">Work:</span> <cite>A Christian &amp; Plain Treatise of the Manner &amp; Order of Predestination &amp; of the Largeness of God’s Grace</cite>, (d. 1602: London: Welby &amp; Clarke, 1606), 4th Crimination, pp. 170-72</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/attributes-of-god/will-of-god.html">Will of God</a></span></div>
<div class="actions"><button class="copy" data-copy="“Objection 2: Mt. 23:37, ‘How often would I have gathered thy children together, and thou wouldst not. How did Christ will, and so will that He complains of those who would not, if He had not through his help made them able [to] will, whom He knew could not will? Answer. Christ is here said to have willed to gather them together, not by the will of his good pleasure, which may never be resisted, but by his signifying or revealed will. For He is said to will to gather all unto Himself, because by the preaching of the Word He calls all in common unto salvation, and prefixes to Himself this end of preaching, that they should commit themselves to his protection and fidelity. By this will therefore He may will to gather the Jews together, though in the meantime He do not help them, that they themselves may be able to will.”

— William Perkins, A Christian &amp; Plain Treatise of the Manner &amp; Order of Predestination &amp; of the Largeness of God’s Grace (d. 1602: London: Welby &amp; Clarke, 1606), 4th Crimination, pp. 170-72">Copy</button><a class="share" href="https://x.com/intent/post?text=%E2%80%9CObjection+2%3A+Mt.+23%3A37%2C+%E2%80%98How+often+would+I+have+gathered+thy+children+together%2C+and+thou+wouldst+not.+How+did+Christ+will%2C+and+so+will+that+He+complains+of+those+who+would+not%2C+if+He+had+not+through+his+help+made+them+able+%5Bto%5D+will%2C+whom+He+knew+could+not+will%3F+Answer.+Christ+is+here+said+to+have+willed+to+gather+them+together%2C+not+by+the+will+of+his+good+pleasure%2C+which+may+never+be+resisted%2C+but+by+his+signifying+or+revealed+will.+For+He+is+said+to+will+to+gather+all+unto+Himself%2C+because+by+the+preaching+of+the+Word+He+calls+all+in+common+unto+salvation%2C+and+prefixes+to+Himself+this+end+of+preaching%2C+that+they+should+commit+themselves+to+his+protection+and+fidelity.+By+this+will+therefore+He+may+will+to+gather+the+Jews+together%2C+though+in+the+meantime+He+do+not+help+them%2C+that+they+themselves+may+be+able+to+will.%E2%80%9D%0A%0A%E2%80%94+William+Perkins%2C+A+Christian+%26+Plain+Treatise+of+the+Manner+%26+Order+of+Predestination+%26+of+the+Largeness+of+God%E2%80%99s+Grace+%28d.+1602%3A+London%3A+Welby+%26+Clarke%2C+1606%29%2C+4th+Crimination%2C+pp.+170-72&amp;url=https%3A%2F%2F5solasquotes.github.io%2Fquote%2Fe483399691.html&amp;via=5Solas" target="_blank" rel="noopener">Share on X</a><a class="perma" href="../quote/e483399691.html">Permalink</a><a class="src" href="https://reformedbooksonline.com/on-gods-revealed-will/#:~:text=Objection%202%3A%20Mt.%2023%3A37%2C%20%E2%80%98How%20often,themselves%20may%20be%20able%20to%20will&amp;text=Objection%202%3A%20Mt.%2023%3A37%2C%20%E2%80%98How%20often%20would%20I&amp;text=that%20they%20themselves%20may%20be%20able%20to%20will" rel="noopener" target="_blank">Read it online · Reformed Books Online</a></ </figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-a319b77b06" data-kw="">
<blockquote><p>3. Again, by an antecedent will God wills all men to be saved: if, therefore, He reprobates anyone, this is by a consequent will, for He creates no one of Himself for punishment; but the consequent will is a concession for our cause; but it is not for any other cause than merit: therefore, etc.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/bonaventure.html">Bonaventure</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Commentary on the Sentences</cite>, (d. 1274), bk. 1 | dist. 41, Treatment of the Questions</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/attributes-of-god/will-of-god.html">Will of God</a></span></div>

— Bonaventure, Commentary on the Sentences (d. 1274), bk. 1 | dist. 41, Treatment of the Questions">Copy</button><a class="share" href="https://x.com/intent/post?text=%E2%80%9C3.+Again%2C+by+an+antecedent+will+God+wills+all+men+to+be+saved%3A+if%2C+therefore%2C+He+reprobates+anyone%2C+this+is+by+a+consequent+will%2C+for+He+creates+no+one+of+Himself+for+punishment%3B+but+the+consequent+will+is+a+concession+for+our+cause%3B+but+it+is+not+for+any+other+cause+than+merit%3A+therefore%2C+etc.%E2%80%9D%0A%0A%E2%80%94+Bonaventure%2C+Commentary+on+the+Sentences+%28d.+1274%29%2C+bk.+1+%7C+dist.+41%2C+Treatment+of+the+Questions&amp;url=https%3A%2F%2F5solasquotes.github.io%2Fquote%2Fa319b77b06.html&amp;via=5Solas" target="_blank" rel="noopener">Share on X</a><a class="perma" href="../quote/a319b77b06.html">Permalink</a><a class="src" href="https://reformedbooksonline.com/on-antecedent-consequent-aspects-of-gods-willing/#:~:text=3.%20Again%2C%20by%20an%20antecedent%20will,other%20cause%20than%20merit%3A%20therefore%2C%20etc&amp;text=3.%20Again%2C%20by%20an%20antecedent%20will%20God%20wills&amp;text=for%20any%20other%20cause%20than%20merit%3A%20therefore%2C%20etc" rel="noopener" target="_blank">Read it online · Reformed Books Online</a></div>
</figure><figure class="quote" id="q-08c83610d1" data-kw="">
<blockquote><p>1. Voluntas essentialis and voluntas personalis. This is an admittedly rare distinction, given the Reformed orthodox unwillingness to speculate into the doctrine of the Trinity in a manner like that of the medieval doctors. This distinction parallels, of course, the basic distinction of properties of the Godhead into proprietates essentiales and proprietates personales. Thus, the voluntas essentialis is simply the will of God, understood as an essential property or as a faculty of the divine life. The ‘essential’ will of God can also be termed the voluntas realis, namely, will by which God discerns all things existent or nonexistent. The voluntas personalis, then, can only relate to the inward begetting and proceeding of the persons of the Trinity, understood as somehow belonging to the divine willing–as such, this language relates also to the concept of a necessary divine will, the voluntas necessaria. Thus, God the Father necessarily wills to beget God the Son.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/richard-muller.html">Richard Muller</a></span><span class="wk"><span class="lbl">Work:</span> <cite>PRRD 2nd</cite>, ed. (Baker Academic, 2003), vol. 3, p. 453</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/attributes-of-god/will-of-god.html">Will of God</a></span></div>

</figure><figure class="quote" id="q-cd32f57039" data-kw="">
<blockquote><p>As in the previous controversies, the rectitude of the distinction depends upon its definition: ‘it is possible to allow a voluntas conditionata [conditional will]’ in God ‘but not in an a priori and antecedent sense, as if dependent on a condition, rather in an a posteriori and consequent sense, given that some condition in the creature intervenes between the will and its execution’; and then ‘only to the extent that the condition does not belong to the internal divine act (a parte actus interni) or volition (volitionis), but to the external object (a parte obiecti externi) or thing willed (rei volitae).’ In this sense, the distinction can legitimately be applied to the promises associated with God’s covenants… the covenants of law and gospel, where God’s promises are extended conditionally to sinners… In other words, the conditional will remains an immutable will, willed eternally by God, but it is understood as being directed toward a contingent or conditional event: the condition, strictly understood, obtains, not in the divine will, but in the temporal event.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/richard-muller.html">Richard Muller</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Post-Reformation Reformed Dogmatics</cite>, 5. ‘Voluntas absoluta and voluntas conditionata’ in Post-Reformation Reformed Dogmatics: the Rise &amp; Development of Reformed Theology, ca. 1520 – ca. 1725 2nd ed. (Baker Books, 2003), vol. 3, ch. 5.4, E. The Ad Intra–Ad Extra Distinctions, pp. 463-65, p. 464</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/attributes-of-god/will-of-god.html">Will of God</a></span></div>

<main class="wrap"><figure class="quote" id="q-3af8ab438a" data-kw="">
<blockquote><p>If ye exclude all non-converts from the visible city of God (in which, daily, multitudes in Scotland, in all the four quarters of the land, above whatever our fathers saw, throng into Christ), shall they not be left to the lions and wild beasts of the forest, even to Jesuits, seminary-priests and other seducers? For the magistrate has no power to compel them to hear the Gospel, nor have ye any church-power over them, as ye teach; and they bring not love to the Gospel and to Christ out of the womb with them; and so they must be left to embrace what religion is most suitable to corrupt nature. Nor can it be a way approven by the Lord in Scripture to excommunicate from the visible church (which is the office-house of the free grace of Christ, and His draw-net) all the multitudes of non-converts, baptized and visibly within the Covenant of Grace which are in Great Britain and all the reformed Churches; and so to shut the gates of the Lord’s gracious calling upon all these (because they are not, in your judgment, chosen to salvation), when once you are within [salvation or the Church] yourselves. For how can the Lord call Egypt his people, and Assyria the work of his hands, and all the gentiles (who for numbers are as the flocks of Kedar, and the abundance of the sea) the kingdoms of our Lord and of His Christ, if you number infants (as many do) and all such as your charity cannot judge converts (as others do) among heathens and pagans, who have not a visible claim and interest in Christ? The candlestick is not yours, nor the House; but Christ fixes and removes the one and builds or casts down the other, according to his sovereignty. We in humility judge ourselves, though the chief of sinners, the sons of Zion and of the seed of Christ; if ye remove from us, and carry from hence the candlestick, let our Father be judge, and show us why the Lord has bidden you come out from among us. We look upon this visible church, though black and spotted, as the hospital and guest-house of sick, halt, maimed, and withered, over which Christ is Lord, Physician and Master: and we would wait upon those that are not yet in Christ, as our Lord waited upon us and you both. We, therefore, your brethren, children of one Father, cannot but with tears and exceeding sorrow of heart earnestly entreat, beseech, and obtest you, by the love of our Lord Jesus Christ, by His sufferings and precious ransom which He paid for us both, by the consolations of His Spirit, by your appearance before the dreadful tribunal of our Lord Jesus, yea, and charge you before God and the same Lord Jesus, “who shall judge the quick and the dead, at His appearing, and His kingdom,” break not the spirits and hearts of those to whom ye are dear as their own soul. Forsake not the assemblies of the people of God; let us not divide.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/samuel-rutherford.html">Samuel Rutherford</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Letters of Samuel Rutherford</cite>, (Edinburgh: Anderson &amp; Ferrier, 1894), Letter 364, to brethren in Aberdeen, pp. 706-7</span></figcaption>

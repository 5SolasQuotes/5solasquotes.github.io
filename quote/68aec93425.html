<main class="wrap"><figure class="quote" id="q-68aec93425" data-kw="">
<blockquote><p>This Son of God, a distinct Person, but the same in substance with the Father, being the middle person betwixt the Father and the Spirit, undertakes to be Mediator betwixt God and man; by him the world was made, and by him therefore it was fitting it should be redeemed; which notwithstanding, could not have been done by him, unless he became the Son of man in time, as well as he had been the Son of God from eternity. Hereupon he took man’s nature; he that had the nature of God communicated to him, hath the nature of man assumed by him.

Not as if the Divine nature was converted into or confounded with the human, but only the human nature is assumed into the Divine, so as to become perfectly man like unto us in all things, our sinful infirmities only excepted, in time, as he had been perfectly God, like to the Father in all things, his personal properties only excepted, from eternity. And therefore man having two essential constitutive parts, a soul and a body, Christ in his assuming of the human nature was invested with both, yea, and the natural infirmities of both too; he had a soul as well as we, he had a body as well as we, and he had his soul and body united together as well as we, and so was hungry and thirsty and weary and sorrowful, as we are.</p></blockquote>

<blockquote><p>Will, whether it be in God or Man, belongs to the essence or nature of both. The nature therefore of God being one, there are not in God diverse wills, although the Godhead be in diverse Persons, because the power of willing is a natural, not a personal propriety. Contrariwise, the Person of our Savior Christ being but one, there are in Him two wills, because two natures, the nature of God and the nature of man, which both do imply this faculty and power. So that in Christ there is a divine and there is a human will, otherwise He were not both God and Man. Hereupon the Church has of old condemned Monothelites as hereticks for holding that Christ had but one will. The works and operations of our Savior’s human will were all subject to the will of God and framed according to his Law, ‘I desire to do thy will, O God, and thy Law is within mine heart.’ [Ps. 40] Now as man’s will, so the will of Christ has two several kinds of operation: the one natural or necessary, whereby it desires simply whatsoever is good in itself and shuns as generally all things which hurt; the other deliberate, when we therefore embrace things as good because the eye of understanding judges them good to that end which we simply desire. Thus in itself we desire health, physic, only for health’s sake. And in this sort, special reason oftentimes causes the will by choice to prefer one good thing before another, to leave one for another’s sake, to forgo meaner for the attainment of higher desires, which our Savior likewise did. These different inclinations of the will considered, the reason is easy how in Christ there might grow desires seeming, but being not indeed opposite, either the one of them unto the other, or either of them to the will of God. For let the manner of his speech be weighed: ‘My soul is now troubled, and what should I say? Father, save Me out of this hour? But yet for this very cause I am come into this hour.’ His purpose herein was most effectually to propose to the view of the whole world two contrary objects, the like whereunto in force and efficacy were never presented in that manner to any but only to the soul of Christ. There was presented before his eyes in that fearful hour on the one side God’s heavy indignation and wrath towards mankind as yet unappeased, death as yet in full strength, Hell as yet never mastered by any that came within the confines and bounds thereof, somewhat also peradventure more than is either possible or needful for the wit of man to find out; finally, Himself flesh and blood left alone to enter into conflict with all these. On the other side: a world to be saved by One, a pacification of wrath through the dignity of that sacrifice which should be offered, a conquest over death through the power of that Deity which would not suffer the tabernacle thereof to see corruption, and an utter disappointment of all the forces of infernal powers through the purity of that soul which they should have in their hands and not be able to touch. Let no man marvel that in this case the soul of Christ was much troubled. For what could such apprehensions breed, but (as their nature is) inexplicable passions of mind, desires abhorring what they embrace and embracing what they abhor? In which agony, how should the tongue go about to express what the soul endured? When the griefs of Job were exceeding great, his words accordingly to open them were many; howbeit, still unto his seeming they were undiscovered: ‘Though my talk’ (says Job) ‘be this day in bitterness, yet my plague is greater than my groaning.’ But here to what purpose should words serve, when nature has more to declare than groans and strong cries, more than streams of bloody sweats, more than his doubled and tripled prayers can express, who thrice putting forth his hand to receive that cup, besides which, there was no other cause of his coming into the world, He thrice pulls it back again and as often even with tears of blood craves, ‘If it be possible, O Father, or if not, even what thine own good pleasure is;’ for whose sake the passion that has in it a bitter and a bloody conflict, even with wrath and death, and Hell, is most welcome. Whereas therefore we find in God a will resolved that Christ shall suffer; and in the human will of Christ two actual desires, the one avoiding and the other accepting death: Is that desire which first declares itself by prayer against that wherewith He concludes prayer, or either of them, against his mind to whom prayer in this case seeks? We may judge of these diversities in the will by the like in the understanding. For as the intellectual part does not cross itself by conceiving man to be just and unjust, when it means not the same man, nor by imagining the same man learned and unlearned, if learned in one skill and in another kind of learning unskilful, because the parts of every true opposition do always both concern the same subject and have reference to the same thing, since otherwise they are but in show opposite and not in truth: So the will about one and the same thing may in contrary respects have contrary inclinations and that without contrariety. The minister of justice may, for public example to others, virtuously will the execution of that party whose pardon another for consanguinity’s sake as virtuously may desire. Consider death in itself and nature teaches Christ to shun it. Consider death as a mean to procure the salvation of the world and mercy works in Christ all willingness of mind towards it. Therefore in these two desires there can be no repugnant opposition. Again, compare them with the will of God, and if any opposition be, it must be only between his appointment of Christ’s death and the former desire which wishes deliverance from death. But neither is this desire opposite to the will of God. The will of God was that Christ should suffer the pains of death. Not so his will, as if the torment of innocency did in itself please and delight God; but such was his will in regard of the end whereunto it was necessary that Christ should suffer. The death of Christ in itself therefore, God wills not, which to the end we might thereby obtain life, He both allows and appoints. In like manner, the Son of Man endures willingly to that purpose those grievous pains which simply not to have shunned had been against nature, and by consequent against God. I take it therefore to be an error that Christ either knew not what Himself was to suffer, or else had forgotten the things He knew. The root of which error was an over-restrained consideration of prayer, as though it had no other lawful use but only to serve for a chosen mean whereby the will resolves to seek that which the understanding certainly knows it shall obtain: Whereas prayers, in truth, both unto are, and his were, as well sometime a presentation of mere desires as a mean of procuring desired effects at the hands of God. We are therefore taught by his example that the presence of dolorous and dreadful objects, even in minds most perfect, may as clouds overcast all sensible joy; that no assurance touching future victories can make present conflicts so sweet and easy, but nature will shun and shrink from them; nature will desire ease and deliverance from oppressive burdens that the contrary determination of God is oftentimes against the effect of this desire, yet not against the affection itself, because it is naturally in us; that in such case our prayers cannot serve us as means to obtain the thing we desire; that notwithstanding, they are unto God most acceptable sacrifices because they testify we desire nothing but at his hands, and our desires we submit with contentment to be overruled by his will; and in general they are not repugnant unto the natural will of God which wishes to the works of his own hands, in that they are his own handiwork, all happiness, although perhaps for some special cause in our own particular, a contrary determination have seemed more convenient. Finally, that thus to propose our desires which cannot take such effects as we specify shall notwithstanding otherwise procure us his heavenly grace, even as this very prayer of Christ obtained angels to be sent Him as comforters in his agony. And according to this example, we are not afraid to present unto God our prayers for those things, which that He will perform unto us, we have no sure, nor certain knowledge… Such prayers of the Church to be delivered from all adversity are no more repugnant to any reasonable disposition of men’s minds towards death, much less to that blessed patience and meek contentment which saints by heavenly inspiration have to endure (what cross or calamity soever it pleases God to lay upon them) than our Lord and Savior’s own prayer before his passion was repugnant unto his most gracious resolution to die for the sins of the whole world. 49. In praying for deliverance from all adversity we seek that which nature does wish to itself; but by entreating for mercy towards all we declare that affection wherewith Christian charity thirsts after the good of the whole world: we discharge that duty which the apostle himself does impose on the Church of Christ as a commendable office, a sacrifice acceptable in God’s sight, a service according to his heart whose desire is to have all men saved: a work most suitable with his purpose who gave Himself to be the price of redemption for all and a forcible mean to procure the conversion of all such as are not yet acquainted with the mysteries of that truth which must save their souls. Against it there is but the bare show of this one impediment: that all men’s salvation and many men’s eternal condemnation or death are things the one repugnant to the other: that both cannot be brought to pass: that we know there are vessels of wrath to whom God will never extend mercy and therefore that wittingly we ask an impossible thing to be had. The truth is, that as life and death, mercy and wrath are matters of mere understanding or knowledge, all men’s salvation and some men’s endless perdition are things so opposite that whosoever does affirm the one must necessarily deny the other. God Himself cannot effect both or determine that both shall be. There is in the knowledge both of God and man this certainty, that life and death have divided between them the whole body of mankind. What portion either of the two has, God Himself knows; for us He has left no sufficient means to comprehend, and for that cause neither given any leave to search in particular who are infallibly the heirs of the Kingdom of God, who cast-aways. Howbeit, concerning the state of all men with whom we live (for only of them our prayers are meant), we may till the world’s end, for the present, always presume that as far as in us there is power to discern what others are, and as far as any duty of ours depends upon the notice of their condition in respect of God, the safest axioms for charity to rest itself upon are these: He which believes already is, and he which believes not as yet, may be the child of God. It becomes not us during life altogether to condemn any man, seeing that (for anything we know) there is hope of every man’s forgiveness, the possibility of whose repentance is not yet cut off by death. And therefore charity which hopes all things, prays also for all men. Wherefore to let go personal knowledge touching vessels of wrath and mercy, what they are inwardly in the sight of God, it skills not; for us there is cause sufficient in all men whereupon to ground our prayers unto God in their behalf. For whatsoever the mind of man apprehends as good, the will of charity and love is to have it enlarged in the very uttermost extent, that all may enjoy it to whom it can any way add perfection. Because therefore the farther a good thing does reach, the nobler and worthier we reckon it, our prayers for all men’s good, no less than for our own, the apostle with very fit terms commends as being [Greek], a work commendable for the largeness of the affection from whence it springs, even as theirs which have requested at God’s hands the salvation of many, with the loss of their own souls drowning as it were and overwhelming themselves in the abundance of their love towards others, is proposed as being in regard of the rareness of such affections [Greek], more than excellent. But this extraordinary height of desire after other men’s salvation is no common mark. The other is a duty which belongs unto all and prevails with God daily. For as it is in itself good, so God accepts and takes it in very good part at the hands of faithful men. Our prayers for all men do include both them that shall find mercy and them also that shall find none. For them that shall, no man will doubt but our prayers are both accepted and granted. Touching them for whom we crave that mercy which is not to be obtained, let us not think that our Savior did mis-instruct his disciples, willing them to pray for the peace even of such as should be incapable of so great a blessing, or that the prayers of the prophet Jeremiah offended God because the answer of God was a resolute denial of favor to them for whom supplication was made. And if any man doubt how God should accept such prayers in case they be opposite to his will, or not grant them, if they be according unto that which Himself wills, our answer is that such suits God accepts in that they are conformable unto his general inclination, which is that all men might be saved; yet always He grants them not for as much as there is in God sometimes a more private occasioned will which determines the contrary. So that the other being the rule of our actions, and not this, our requests for things opposite to this will of God are not therefore the less gracious in his sight. There is no doubt but we ought in all things to frame our wills to the will of God and that otherwise in whatsoever we do, we sin. For of ourselves, being so apt to err, the only way which we have to straighten our paths is by following the rule of his will whose footsteps naturally are right. If the eye, the hand or the foot do that which the will commands, though they serve as instruments to sin, yet is sin the commander’s fault and not theirs, because nature has absolutely and without exception made them subjects to the will of man, which is lord over them. As the body is subject to the will of man, so man’s will to the will of God; for so it behoves that the better should guide and command the worse. But because the subjection of the body to the will is by natural necessity, the subjection of the will unto God voluntary, we therefore stand in need of direction, after what sort our wills and desires may be rightly conformed to his. Which is not done by willing always the self-same thing that God intends. For it may chance that his purpose is sometime the speedy death of them whose long continuance in life, if we should not wish, we were unnatural. When the object or matter therefore of our desires is (as in this case) a thing both good of it self and not forbidden of God, when the end for which we desire it is virtuous and apparently most holy, when the root from which our affection towards it proceeds is charity, piety, that which we do in declaring our desire by prayer, yea, over and besides all this, since we know that to pray for all men living is but to show the same affection which towards every of them our Lord Jesus Christ has borne, who knowing only as God who are his, did as man taste death for the good of all men: surely to that will of God which ought to be and is the known rule of all our actions, we do not herein oppose ourselves, although his secret determination haply be against us; which if we did understand, as we do not, yet to rest contented with that which God will have done is as much as He requires at the hands of men. And concerning ourselves, what we earnestly crave in this case, the same, as all things else that are of like condition, we meekly submit unto his most gracious will and pleasure. Finally, as we have cause sufficient why to think the practice of our [Anglican] Church [in the Book of Common Prayer] allowable in this behalf, so neither is ours the first which has been of that mind. For to end with the words of Prosper [d. c. 455]: ‘This law of supplication for all men’ (says he): ‘the devout zeal of all priests and of all faithful men does hold with such full agreement that there is not any part of all the world where Christian people do not use to pray in the same manner. The Church everywhere makes prayers unto God, not only for saints, and such as already in Christ are regenerate, but for all infidels and enemies of the cross of Jesus Christ, for all idolaters, for all that persecute Christ in his followers, for Jews to whose blindness the light of the Gospel does not yet shine, for heretics and schismatics, who from the unity of Faith and charity are estranged. And for such, what does the Church ask of God but this, that leaving their errors they may be converted unto Him, that faith and charity may be given them and that out of the darkness of ignorance they may come to the knowledge of his truth? Which because they cannot themselves do in their own behalf, as long as the sway of evil custom ever-bears them and the chains of Satan detain them bound, neither are they able to break through those errors wherein they are so determinately settled that they pay unto falsity, the whole sum of whatsoever love is owing unto God’s truth. Our Lord merciful and just requires to have all men prayed for; that when we behold innumerable multitudes drawn up from the depth of so bottomless evils, we may not doubt but (in part) God has done the thing we requested, nor despair, but that being thankful for them, towards whom already He has showed mercy, the rest which are not as yet enlightened shall before they pass out of life be made partakers of the like grace. Or if the grace of Him which saves [for so we set is falls out] overpass some, so that the prayer of the Church for them be not received, this we may leave to the hidden judgments of God’s righteousness and acknowledge that in this secret there is a gulf, which, while we live we shall never sound.’ (Of the Calling of the Gentiles, bk. 1, ch. 4, amongst Ambrose’s Works)</p></blockquote>

 tears of blood craves, ‘If it be possible, O Father, or if not, even what thine own good pleasure is;’ for whose sake the passion that has in it a bitter and a bloody conflict, even with wrath and death, and Hell, is most welcome. Whereas therefore we find in God a will resolved that Christ shall suffer; and in the human will of Christ two actual desires, the one avoiding and the other accepting death: Is that desire which first declares itself by prayer against that wherewith He concludes prayer, or either of them, against his mind to whom prayer in this case seeks? We may judge of these diversities in the will by the like in the understanding. For as the intellectual part does not cross itself by conceiving man to be just and unjust, when it means not the same man, nor by imagining the same man learned and unlearned, if learned in one skill and in another kind of learning unskilful, because the parts of every true opposition do always both concern the same subject and have reference to the same thing, since otherwise they are but in show opposite and not in truth: So the will about one and the same thing may in contrary respects have contrary inclinations and that without contrariety. The minister of justice may, for public example to others, virtuously will the execution of that party whose pardon another for consanguinity’s sake as virtuously may desire. Consider death in itself and nature teaches Christ to shun it. Consider death as a mean to procure the salvation of the world and mercy works in Christ all willingness of mind towards it. Therefore in these two desires there can be no repugnant opposition. Again, compare them with the will of God, and if any opposition be, it must be only between his appointment of Christ’s death and the former desire which wishes deliverance from death. But neither is this desire opposite to the will of God. The will of God was that Christ should suffer the pains of death. Not so his will, as if the torment of innocency did in itself please and delight God; but such was his will in regard of the end whereunto it was necessary that Christ should suffer. The death of Christ in itself therefore, God wills not, which to the end we might thereby obtain life, He both allows and appoints. In like manner, the Son of Man endures willingly to that purpose those grievous pains which simply not to have shunned had been against nature, and by consequent against God. I take it therefore to be an error that Christ either knew not what Himself was to suffer, or else had forgotten the things He knew. The root of which error was an over-restrained consideration of prayer, as though it had no other lawful use but only to serve for a chosen mean whereby the will resolves to seek that which the understanding certainly knows it shall obtain: Whereas prayers, in truth, both unto are, and his were, as well sometime a presentation of mere desires as a mean of procuring desired effects at the hands of God. We are therefore taught by his example that the presence of dolorous and dreadful objects, even in minds most perfect, may as clouds overcast all sensible joy; that no assurance touching future victories can make present conflicts so sweet and easy, but nature will shun and shrink from them; nature will desire ease and deliverance from oppressive burdens that the contrary determination of God is oftentimes against the effect of this desire, yet not against the affection itself, because it is naturally in us; that in such case our prayers cannot serve us as means to obtain the thing we desire; that notwithstanding, they are unto God most acceptable sacrifices because they testify we desire nothing but at his hands, and our desires we submit with contentment to be overruled by his will; and in general they are not repugnant unto the natural will of God which wishes to the works of his own hands, in that they are his own handiwork, all happiness, although perhaps for some special cause in our own particular, a contrary determination have seemed more convenient. Finally, that thus to propose our desires which cannot take such effects as we specify shall notwithstanding otherwise procure us his heavenly grace, even as this very prayer of Christ obtained angels to be sent Him as comforters in his agony. And according to this example, we are not afraid to present unto God our prayers for those things, which that He will perform unto us, we have no sure, nor certain knowledge… Such prayers of the Church to be delivered from all adversity are no more repugnant to any reasonable disposition of men’s minds towards death, much less to that blessed patience and meek contentment which saints by heavenly inspiration have to endure (what cross or calamity soever it pleases God to lay upon them) than our Lord and Savior’s own prayer before his passion was repugnant unto his most gracious resolution to die for the sins of the whole world. 49. In praying for deliverance from all adversity we seek that which nature does wish to itself; but by entreating for mercy towards all we declare that affection wherewith Christian charity thirsts after the good of the whole world: we discharge that duty which the apostle himself does impose on the Church of Christ as a commendable office, a sacrifice acceptable in God’s sight, a service according to his heart whose desire is to have all men saved: a work most suitable with his purpose who gave Himself to be the price of redemption for all and a forcible mean to procure the conversion of all such as are not yet acquainted with the mysteries of that truth which must save their souls. Against it there is but the bare show of this one impediment: that all men’s salvation and many men’s eternal condemnation or death are things the one repugnant to the other: that both cannot be brought to pass: that we know there are vessels of wrath to whom God will never extend mercy and therefore that wittingly we ask an impossible thing to be had. The truth is, that as life and death, mercy and wrath are matters of mere understanding or knowledge, all men’s salvation and some men’s endless perdition are things so opposite that whosoever does affirm the one must necessarily deny the other. God Himself cannot effect both or determine that both shall be. There is in the knowledge both of God and man this certainty, that life and death have divided between them the whole body of mankind. What portion either of the two has, God Himself knows; for us He has left no sufficient means to comprehend, and for that cause neither given any leave to search in particular who are infallibly the heirs of the Kingdom of God, who cast-aways. Howbeit, concerning the state of all men with whom we live (for only of them our prayers are meant), we may till the world’s end, for the present, always presume that as far as in us there is power to discern what others are, and as far as any duty of ours depends upon the notice of their condition in respect of God, the safest axioms for charity to rest itself upon are these: He which believes already is, and he which believes not as yet, may be the child of God. It becomes not us during life altogether to condemn any man, seeing that (for anything we know) there is hope of every man’s forgiveness, the possibility of whose repentance is not yet cut off by death. And therefore charity which hopes all things, prays also for all men. Wherefore to let go personal knowledge touching vessels of wrath and mercy, what they are inwardly in the sight of God, it skills not; for us there is cause sufficient in all men whereupon to ground our prayers unto God in their behalf. For whatsoever the mind of man apprehends as good, the will of charity and love is to have it enlarged in the very uttermost extent, that all may enjoy it to whom it can any way add perfection. Because therefore the farther a good thing does reach, the nobler and worthier we reckon it, our prayers for all men’s good, no less than for our own, the apostle with very fit terms commends as being [Greek], a work commendable for the largeness of the affection from whence it springs, even as theirs which have requested at God’s hands the salvation of many, with the loss of their own souls drowning as it were and overwhelming themselves in the abundance of their love towards others, is proposed as being in regard of the rareness of such affections [Greek], more than excellent. But this extraordinary height of desire after other men’s salvation is no common mark. The other is a duty which belongs unto all and prevails with God daily. For as it is in itself good, so God accepts and takes it in very good part at the hands of faithful men. Our prayers for all men do include both them that shall find mercy and them also that shall find none. For them that shall, no man will doubt but our prayers are both accepted and granted. Touching them for whom we crave that mercy which is not to be obtained, let us not think that our Savior did mis-instruct his disciples, willing them to pray for the peace even of such as should be incapable of so great a blessing, or that the prayers of the prophet Jeremiah offended God because the answer of God was a resolute denial of favor to them for whom supplication was made. And if any man doubt how God should accept such prayers in case they be opposite to his will, or not grant them, if they be according unto that which Himself wills, our answer is that such suits God accepts in that they are conformable unto his general inclination, which is that all men might be saved; yet always He grants them not for as much as there is in God sometimes a more private occasioned will which determines the contrary. So that the other being the rule of our actions, and not this, our requests for things opposite to this will of God are not therefore the less gracious in his sight. There is no doubt but we ought in all things to frame our wills to the will of God and that otherwise in whatsoever we do, we sin. For of ourselves, being so apt to err, the only way which we have to straighten our paths is by following the rule of his will whose footsteps naturally are right. If the eye, the hand or the foot do that which the will commands, though they serve as instruments to sin, yet is sin the commander’s fault and not theirs, because nature has absolutely and without exception made them subjects to the will of man, which is lord over them. As the body is subject to the will of man, so man’s will to the will of God; for so it behoves that the better should guide and command the worse. But because the subjection of the body to the will is by natural necessity, the subjection of the will unto God voluntary, we therefore stand in need of direction, after what sort our wills and desires may be rightly conformed to his. Which is not done by willing always the self-same thing that God intends. For it may chance that his purpose is sometime the speedy death of them whose long continuance in life, if we should not wish, we were unnatural. When the object or matter therefore of our desires is (as in this case) a thing both good of it self and not forbidden of God, when the end for which we desire it is virtuous and apparently most holy, when the root from which our affection towards it proceeds is charity, piety, that which we do in declaring our desire by prayer, yea, over and besides all this, since we know that to pray for all men living is but to show the same affection which towards every of them our Lord Jesus Christ has borne, who knowing only as God who are his, did as man taste death for the good of all men: surely to that will of God which ought to be and is the known rule of all our actions, we do not herein oppose ourselves, although his secret determination haply be against us; which if we did understand, as we do not, yet to rest contented with that which God will have done is as much as He requires at the hands of men. And concerning ourselves, what we earnestly crave in this case, the same, as all things else that are of like condition, we meekly submit unto his most gracious will and pleasure. Finally, as we have cause sufficient why to think the practice of our [Anglican] Church [in the Book of Common Prayer] allowable in this behalf, so neither is ours the first which has been of that mind. For to end with the words of Prosper [d. c. 455]: ‘This law of supplication for all men’ (says he): ‘the devout zeal of all priests and of all faithful men does hold with such full agreement that there is not any part of all the world where Christian people do not use to pray in the same manner. The Church everywhere makes prayers unto God, not only for saints, and such as already in Christ are regenerate, but for all infidels and enemies of the cross of Jesus Christ, for all idolaters, for all that persecute Christ in his followers, for Jews to whose blindness the light of the Gospel does not yet shine, for heretics and schismatics, who from the unity of Faith and charity are estranged. And for such, what does the Church ask of God but this, that leaving their errors they may be converted unto Him, that faith and charity may be given them and that out of the darkness of ignorance they may come to the knowledge of his truth? Which because they cannot themselves do in their own behalf, as long as the sway of evil custom ever-bears them and the chains of Satan detain them bound, neither are they able to break through those errors wherein they are so determinately settled that they pay unto falsity, the whole sum of whatsoever love is owing unto God’s truth. Our Lord merciful and just requires to have all men prayed for; that when we behold innumerable multitudes drawn up from the depth of so bottomless evils, we may not doubt but (in part) God has done the thing we requested, nor despair, but that being thankful for them, towards whom already He has showed mercy, the rest which are not as yet enlightened shall before they pass out of life be made partakers of the like grace. Or if the grace of Him which saves [for so we set is falls out] overpass some, so that the prayer of the Church for them be not received, this we may leave to the hidden judgments of God’s righteousness and acknowledge that in this secret there is a gulf, which, while we live we shall never sound.’ (Of the Calling of the Gentiles, bk. 1, ch. 4, amongst Ambrose’s Works)”

— Richard Hooker, The Works of Mr. Richard Hooker, … in Eight Books of Ecclesiastical Polity… (London: Newcomb, 1666), bk. 5, pp. 202-6">Copy</button><a class="share" href="https://x.com/intent/post?text=%E2%80%9CWill%2C+whether+it+be+in+God+or+Man%2C+belongs+to+the+essence+or+nature+of+both.+The+nature+therefore+of+God+being+one%2C+there+are+not+in+God+diverse+wills%2C+although+the+Godhead+be+in+diverse+Persons%2C+because+the+power+of+willing+is+a+natural%2C+not+a+personal+propriety.+Contrariwise%2C+the+Person+of+our+Savior+Christ+being+but+one%2C+there+are+in+Him+two+wills%2C+because+two+natures%2C+the+nature+of+God+and+the+nature+of+man%2C+which+both+do+imply+this+faculty+and+power.+So+that+in+Christ+there+is+a+divine+and+there+is+a+human+will%2C+otherwise+He+were+not+both+God+and+Man.+Hereupon+the+Church+has+of+old+condemned+Monothelites+as+hereticks+for+holding+that+Christ+had+but+one+will.+The+works+and+operations+of+our+Savior%E2%80%99s+human+will+were+all+subject+to+the+will+of+God+and+framed+according+to+his+Law%2C+%E2%80%98I+desire+to+do+thy+will%2C+O+God%2C+and+thy+Law+is+within+mine+heart.%E2%80%99+%5BPs.+40%5D+Now+as+man%E2%80%99s+will%2C+so+the+will+of+Christ+has+two+several+kinds+of+operation%3A+the+one+natural+or+necessary%2C+whereby+it+desires+simply+whatsoever+is+good+in+itself+and+shuns+as+generally+all+things+which+hurt%3B+the+other+deliberate%2C+when+we+therefore+embrace+things+as+good+because+the+eye+of+understanding+judges+them+good+to+that+end+which+we+simply+desire.+Thus+in+itself+we+desire+health%2C+physic%2C+only+for+health%E2%80%99s+sake.+And+in+this+sort%2C+special+reason+oftentimes+causes+the+will+by+choice+to+prefer+one+good+thing+before+another%2C+to+leave+one+for+another%E2%80%99s+sake%2C+to+forgo+meaner+for+the+attainment+of+higher+desires%2C+which+our+Savior+likewise+did.+These+different+inclinations+of+the+will+considered%2C+the+reason+is+easy+how+in+Christ+there+might+grow+desires+seeming%2C+but+being+not+indeed+opposite%2C+either+the+one+of+them+unto+the+other%2C+or+either+of+them+to+the+will+of+God.+For+let+the+manner+of+his+speech+be+weighed%3A+%E2%80%98My+soul+is+now+troubled%2C+and+what+should+I+say%3F+Father%2C+save+Me+out+of+this+hour%3F+But+yet+for+this+very+cause+I+am+come+into+this+hour.%E2%80%99+His+purpose+herein+was+most+effectually+to+propose+to+the+view+of+the+whole+world+two+contrary+objects%2C+the+like+whereunto+in+force+and+efficacy+were+never+presented+in+that+manner+to+any+but+only+to+the+soul+of+Christ.+There+was+presented+before+his+eyes+in+that+fearful+hour+on+the+one+side+God%E2%80%99s+heavy+indignation+and+wrath+towards+mankind+as+yet+unappeased%2C+death+as+yet+in+full+strength%2C+Hell+as+yet+never+mastered+by+any+that+came+within+the+confines+and+bounds+thereof%2C+somewhat+also+peradventure+more+than+is+either+possible+or+needful+for+the+wit+of+man+to+find+out%3B+finally%2C+Himself+flesh+and+blood+left+alone+to+enter+into+conflict+with+all+these.+On+the+other+side%3A+a+world+to+be+saved+by+One%2C+a+pacification+of+wrath+through+the+dignity+of+that+sacrifice+which+should+be+offered%2C+a+conquest+over+death+through+the+power+of+that+Deity+which+would+not+suffer+the+tabernacle+thereof+to+see+corruption%2C+and+an+utter+disappointment+of+all+the+forces+of+infernal+powers+through+the+purity+of+that+soul+which+they+should+have+in+their+hands+and+not+be+able+to+touch.+Let+no+man+marvel+that+in+this+case+the+soul+of+Christ+was+much+troubled.+For+what+could+such+apprehensions+breed%2C+but+%28as+their+nature+is%29+inexplicable+passions+of+mind%2C+desires+abhorring+what+they+embrace+and+embracing+what+they+abhor%3F+In+which+agony%2C+how+should+the+tongue+go+about+to+express+what+the+soul+endured%3F+When+the+griefs+of+Job+were+exceeding+great%2C+his+words+accordingly+to+open+them+were+many%3B+howbeit%2C+still+unto+his+seeming+they+were+undiscovered%3A+%E2%80%98Though+my+talk%E2%80%99+%28says+Job%29+%E2%80%98be+this+day+in+bitterness%2C+yet+my+plague+is+greater+than+my+groaning.%E2%80%99+But+here+to+what+purpose+should+words+serve%2C+when+nature+has+more+to+declare+than+groans+and+strong+cries%2C+more+than+streams+of+bloody+sweats%2C+more+than+his+doubled+and+tripled+prayers+can+express%2C+who+thrice+putting+forth+his+hand+to+receive+that+cup%2C+besides+which%2C+there+was+no+other+cause+of+his+coming+into+the+world%2C+He+thrice+pulls+it+back+again+and+as+often+even+with+tears+of+blood+craves%2C+%E2%80%98If+it+be+possible%2C+O+Father%2C+or+if+not%2C+even+what+thine+own+good+pleasure+is%3B%E2%80%99+for+whose+sake+the+passion+that+has+in+it+a+bitter+and+a+bloody+conflict%2C+even+with+wrath+and+death%2C+and+Hell%2C+is+most+welcome.+Whereas+therefore+we+find+in+God+a+will+resolved+that+Christ+shall+suffer%3B+and+in+the+human+will+of+Christ+two+actual+desires%2C+the+one+avoiding+and+the+other+accepting+death%3A+Is+that+desire+which+first+declares+itself+by+prayer+against+that+wherewith+He+concludes+prayer%2C+or+either+of+them%2C+against+his+mind+to+whom+prayer+in+this+case+seeks%3F+We+may+judge+of+these+diversities+in+the+will+by+the+like+in+the+understanding.+For+as+the+intellectual+part+does+not+cross+itself+by+conceiving+man+to+be+just+and+unjust%2C+when+it+means+not+the+same+man%2C+nor+by+imagining+the+same+man+learned+and+unlearned%2C+if+learned+in+one+skill+and+in+another+kind+of+learning+unskilful%2C+because+the+parts+of+every+true+opposition+do+always+both+concern+the+same+subject+and+have+reference+to+the+same+thing%2C+since+otherwise+they+are+but+in+show+opposite+and+not+in+truth%3A+So+the+will+about+one+and+the+same+thing+may+in+contrary+respects+have+contrary+inclinations+and+that+without+contrariety.+The+minister+of+justice+may%2C+for+public+example+to+others%2C+virtuously+will+the+execution+of+that+party+whose+pardon+another+for+consanguinity%E2%80%99s+sake+as+virtuously+may+desire.+Consider+death+in+itself+and+nature+teaches+Christ+to+shun+it.+Consider+death+as+a+mean+to+procure+the+salvation+of+the+world+and+mercy+works+in+Christ+all+willingness+of+mind+towards+it.+Therefore+in+these+two+desires+there+can+be+no+repugnant+opposition.+Again%2C+compare+them+with+the+will+of+God%2C+and+if+any+opposition+be%2C+it+must+be+only+between+his+appointment+of+Christ%E2%80%99s+death+and+the+former+desire+which+wishes+deliverance+from+death.+But+neither+is+this+desire+opposite+to+the+will+of+God.+The+will+of+God+was+that+Christ+should+suffer+the+pains+of+death.+Not+so+his+will%2C+as+if+the+torment+of+innocency+did+in+itself+please+and+delight+God%3B+but+such+was+his+will+in+regard+of+the+end+whereunto+it+was+necessary+that+Christ+should+suffer.+The+death+of+Christ+in+itself+therefore%2C+God+wills+not%2C+which+to+the+end+we+might+thereby+obtain+life%2C+He+both+allows+and+appoints.+In+like+manner%2C+the+Son+of+Man+endures+willingly+to+that+purpose+those+grievous+pains+which+simply+not+to+have+shunned+had+been+against+nature%2C+and+by+consequent+against+God.+I+take+it+therefore+to+be+an+error+that+Christ+either+knew+not+what+Himself+was+to+suffer%2C+or+else+had+forgotten+the+things+He+knew.+The+root+of+which+error+was+an+over-restrained+consideration+of+prayer%2C+as+though+it+had+no+other+lawful+use+but+only+to+serve+for+a+chosen+mean+whereby+the+will+resolves+to+seek+that+which+the+understanding+certainly+knows+it+shall+obtain%3A+Whereas+prayers%2C+in+truth%2C+both+unto+are%2C+and+his+were%2C+as+well+sometime+a+presentation+of+mere+desires+as+a+mean+of+procuring+desired+effects+at+the+hands+of+God.+We+are+therefore+taught+by+his+example+that+the+presence+of+dolorous+and+dreadful+objects%2C+even+in+minds+most+perfect%2C+may+as+clouds+overcast+all+sensible+joy%3B+that+no+assurance+touching+future+victories+can+make+present+conflicts+so+sweet+and+easy%2C+but+nature+will+shun+and+shrink+from+them%3B+nature+will+desire+ease+and+deliverance+from+oppressive+burdens+that+the+contrary+determination+of+God+is+oftentimes+against+the+effect+of+this+desire%2C+yet+not+against+the+affection+itself%2C+because+it+is+naturally+in+us%3B+that+in+such+case+our+prayers+cannot+serve+us+as+means+to+obtain+the+thing+we+desire%3B+that+notwithstanding%2C+they+are+unto+God+most+acceptable+sacrifices+because+they+testify+we+desire+nothing+but+at+his+hands%2C+and+our+desires+we+submit+with+contentment+to+be+overruled+by+his+will%3B+and+in+general+they+are+not+repugnant+unto+the+natural+will+of+God+which+wishes+to+the+works+of+his+own+hands%2C+in+that+they+are+his+own+handiwork%2C+all+happiness%2C+although+perhaps+for+some+special+cause+in+our+own+particular%2C+a+contrary+determination+have+seemed+more+convenient.+Finally%2C+that+thus+to+propose+our+desires+which+cannot+take+such+effects+as+we+specify+shall+notwithstanding+otherwise+procure+us+his+heavenly+grace%2C+even+as+this+very+prayer+of+Christ+obtained+angels+to+be+sent+Him+as+comforters+in+his+agony.+And+according+to+this+example%2C+we+are+not+afraid+to+present+unto+God+our+prayers+for+those+things%2C+which+that+He+will+perform+unto+us%2C+we+have+no+sure%2C+nor+certain+knowledge%E2%80%A6+Such+prayers+of+the+Church+to+be+delivered+from+all+adversity+are+no+more+repugnant+to+any+reasonable+disposition+of+men%E2%80%99s+minds+towards+death%2C+much+less+to+that+blessed+patience+and+meek+contentment+which+saints+by+heavenly+inspiration+have+to+endure+%28what+cross+or+calamity+soever+it+pleases+God+to+lay+upon+them%29+than+our+Lord+and+Savior%E2%80%99s+own+prayer+before+his+passion+was+repugnant+unto+his+most+gracious+resolution+to+die+for+the+sins+of+the+whole+world.+49.+In+praying+for+deliverance+from+all+adversity+we+seek+that+which+nature+does+wish+to+itself%3B+but+by+entreating+for+mercy+towards+all+we+declare+that+affection+wherewith+Christian+charity+thirsts+after+the+good+of+the+whole+world%3A+we+discharge+that+duty+which+the+apostle+himself+does+impose+on+the+Church+of+Christ+as+a+commendable+office%2C+a+sacrifice+acceptable+in+God%E2%80%99s+sight%2C+a+service+according+to+his+heart+whose+desire+is+to+have+all+men+saved%3A+a+work+most+suitable+with+his+purpose+who+gave+Himself+to+be+the+price+of+redemption+for+all+and+a+forcible+mean+to+procure+the+conversion+of+all+such+as+are+not+yet+acquainted+with+the+mysteries+of+that+truth+which+must+save+their+souls.+Against+it+there+is+but+the+bare+show+of+this+one+impediment%3A+that+all+men%E2%80%99s+salvation+and+many+men%E2%80%99s+eternal+condemnation+or+death+are+things+the+one+repugnant+to+the+other%3A+that+both+cannot+be+brought+to+pass%3A+that+we+know+there+are+vessels+of+wrath+to+whom+God+will+never+extend+mercy+and+therefore+that+wittingly+we+ask+an+impossible+thing+to+be+had.+The+truth+is%2C+that+as+life+and+death%2C+mercy+and+wrath+are+matters+of+mere+understanding+or+knowledge%2C+all+men%E2%80%99s+salvation+and+some+men%E2%80%99s+endless+perdition+are+things+so+opposite+that+whosoever+does+affirm+the+one+must+necessarily+deny+the+other.+God+Himself+cannot+effect+both+or+determine+that+both+shall+be.+There+is+in+the+knowledge+both+of+God+and+man+this+certainty%2C+that+life+and+death+have+divided+between+them+the+whole+body+of+mankind.+What+portion+either+of+the+two+has%2C+God+Himself+knows%3B+for+us+He+has+left+no+sufficient+means+to+comprehend%2C+and+for+that+cause+neither+given+any+leave+to+search+in+particular+who+are+infallibly+the+heirs+of+the+Kingdom+of+God%2C+who+cast-aways.+Howbeit%2C+concerning+the+state+of+all+men+with+whom+we+live+%28for+only+of+them+our+prayers+are+meant%29%2C+we+may+till+the+world%E2%80%99s+end%2C+for+the+present%2C+always+presume+that+as+far+as+in+us+there+is+power+to+discern+what+others+are%2C+and+as+far+as+any+duty+of+ours+depends+upon+the+notice+of+their+condition+in+respect+of+God%2C+the+safest+axioms+for+charity+to+rest+itself+upon+are+these%3A+He+which+believes+already+is%2C+and+he+which+believes+not+as+yet%2C+may+be+the+child+of+God.+It+becomes+not+us+during+life+altogether+to+condemn+any+man%2C+seeing+that+%28for+anything+we+know%29+there+is+hope+of+every+man%E2%80%99s+forgiveness%2C+the+possibility+of+whose+repentance+is+not+yet+cut+off+by+death.+And+therefore+charity+which+hopes+all+things%2C+prays+also+for+all+men.+Wherefore+to+let+go+personal+knowledge+touching+vessels+of+wrath+and+mercy%2C+what+they+are+inwardly+in+the+sight+of+God%2C+it+skills+not%3B+for+us+there+is+cause+sufficient+in+all+men+whereupon+to+ground+our+prayers+unto+God+in+their+behalf.+For+whatsoever+the+mind+of+man+apprehends+as+good%2C+the+will+of+charity+and+love+is+to+have+it+enlarged+in+the+very+uttermost+extent%2C+that+all+may+enjoy+it+to+whom+it+can+any+way+add+perfection.+Because+therefore+the+farther+a+good+thing+does+reach%2C+the+nobler+and+worthier+we+reckon+it%2C+our+prayers+for+all+men%E2%80%99s+good%2C+no+less+than+for+our+own%2C+the+apostle+with+very+fit+terms+commends+as+being+%5BGreek%5D%2C+a+work+commendable+for+the+largeness+of+the+affection+from+whence+it+springs%2C+even+as+theirs+which+have+requested+at+God%E2%80%99s+hands+the+salvation+of+many%2C+with+the+loss+of+their+own+souls+drowning+as+it+were+and+overwhelming+themselves+in+the+abundance+of+their+love+towards+others%2C+is+proposed+as+being+in+regard+of+the+rareness+of+such+affections+%5BGreek%5D%2C+more+than+excellent.+But+this+extraordinary+height+of+desire+after+other+men%E2%80%99s+salvation+is+no+common+mark.+The+other+is+a+duty+which+belongs+unto+all+and+prevails+with+God+daily.+For+as+it+is+in+itself+good%2C+so+God+accepts+and+takes+it+in+very+good+part+at+the+hands+of+faithful+men.+Our+prayers+for+all+men+do+include+both+them+that+shall+find+mercy+and+them+also+that+shall+find+none.+For+them+that+shall%2C+no+man+will+doubt+but+our+prayers+are+both+accepted+and+granted.+Touching+them+for+whom+we+crave+that+mercy+which+is+not+to+be+obtained%2C+let+us+not+think+that+our+Savior+did+mis-instruct+his+disciples%2C+willing+them+to+pray+for+the+peace+even+of+such+as+should+be+incapable+of+so+great+a+blessing%2C+or+that+the+prayers+of+the+prophet+Jeremiah+offended+God+because+the+answer+of+God+was+a+resolute+denial+of+favor+to+them+for+whom+supplication+was+made.+And+if+any+man+doubt+how+God+should+accept+such+prayers+in+case+they+be+opposite+to+his+will%2C+or+not+grant+them%2C+if+they+be+according+unto+that+which+Himself+wills%2C+our+answer+is+that+such+suits+God+accepts+in+that+they+are+conformable+unto+his+general+inclination%2C+which+is+that+all+men+might+be+saved%3B+yet+always+He+grants+them+not+for+as+much+as+there+is+in+God+sometimes+a+more+private+occasioned+will+which+determines+the+contrary.+So+that+the+other+being+the+rule+of+our+actions%2C+and+not+this%2C+our+requests+for+things+opposite+to+this+will+of+God+are+not+therefore+the+less+gracious+in+his+sight.+There+is+no+doubt+but+we+ought+in+all+things+to+frame+our+wills+to+the+will+of+God+and+that+otherwise+in+whatsoever+we+do%2C+we+sin.+For+of+ourselves%2C+being+so+apt+to+err%2C+the+only+way+which+we+have+to+straighten+our+paths+is+by+following+the+rule+of+his+will+whose+footsteps+naturally+are+right.+If+the+eye%2C+the+hand+or+the+foot+do+that+which+the+will+commands%2C+though+they+serve+as+instruments+to+sin%2C+yet+is+sin+the+commander%E2%80%99s+fault+and+not+theirs%2C+because+nature+has+absolutely+and+without+exception+made+them+subjects+to+the+will+of+man%2C+which+is+lord+over+them.+As+the+body+is+subject+to+the+will+of+man%2C+so+man%E2%80%99s+will+to+the+will+of+God%3B+for+so+it+behoves+that+the+better+should+guide+and+command+the+worse.+But+because+the+subjection+of+the+body+to+the+will+is+by+natural+necessity%2C+the+subjection+of+the+will+unto+God+voluntary%2C+we+therefore+stand+in+need+of+direction%2C+after+what+sort+our+wills+and+desires+may+be+rightly+conformed+to+his.+Which+is+not+done+by+willing+always+the+self-same+thing+that+God+intends.+For+it+may+chance+that+his+purpose+is+sometime+the+speedy+death+of+them+whose+long+continuance+in+life%2C+if+we+should+not+wish%2C+we+were+unnatural.+When+the+object+or+matter+therefore+of+our+desires+is+%28as+in+this+case%29+a+thing+both+good+of+it+self+and+not+forbidden+of+God%2C+when+the+end+for+which+we+desire+it+is+virtuous+and+apparently+most+holy%2C+when+the+root+from+which+our+affection+towards+it+proceeds+is+charity%2C+piety%2C+that+which+we+do+in+declaring+our+desire+by+prayer%2C+yea%2C+over+and+besides+all+this%2C+since+we+know+that+to+pray+for+all+men+living+is+but+to+show+the+same+affection+which+towards+every+of+them+our+Lord+Jesus+Christ+has+borne%2C+who+knowing+only+as+God+who+are+his%2C+did+as+man+taste+death+for+the+good+of+all+men%3A+surely+to+that+will+of+God+which+ought+to+be+and+is+the+known+rule+of+all+our+actions%2C+we+do+not+herein+oppose+ourselves%2C+although+his+secret+determination+haply+be+against+us%3B+which+if+we+did+understand%2C+as+we+do+not%2C+yet+to+rest+contented+with+that+which+God+will+have+done+is+as+much+as+He+requires+at+the+hands+of+men.+And+concerning+ourselves%2C+what+we+earnestly+crave+in+this+case%2C+the+same%2C+as+all+things+else+that+are+of+like+condition%2C+we+meekly+submit+unto+his+most+gracious+will+and+pleasure.+Finally%2C+as+we+have+cause+sufficient+why+to+think+the+practice+of+our+%5BAnglican%5D+Church+%5Bin+the+Book+of+Common+Prayer%5D+allowable+in+this+behalf%2C+so+neither+is+ours+the+first+which+has+been+of+that+mind.+For+to+end+with+the+words+of+Prosper+%5Bd.+c.+455%5D%3A+%E2%80%98This+law+of+supplication+for+all+men%E2%80%99+%28says+he%29%3A+%E2%80%98the+devout+zeal+of+all+priests+and+of+all+faithful+men+does+hold+with+such+full+agreement+that+there+is+not+any+part+of+all+the+world+where+Christian+people+do+not+use+to+pray+in+the+same+manner.+The+Church+everywhere+makes+prayers+unto+God%2C+not+only+for+saints%2C+and+such+as+already+in+Christ+are+regenerate%2C+but+for+all+infidels+and+enemies+of+the+cross+of+Jesus+Christ%2C+for+all+idolaters%2C+for+all+that+persecute+Christ+in+his+followers%2C+for+Jews+to+whose+blindness+the+light+of+the+Gospel+does+not+yet+shine%2C+for+heretics+and+schismatics%2C+who+from+the+unity+of+Faith+and+charity+are+estranged.+And+for+such%2C+what+does+the+Church+ask+of+God+but+this%2C+that+leaving+their+errors+they+may+be+converted+unto+Him%2C+that+faith+and+charity+may+be+given+them+and+that+out+of+the+darkness+of+ignorance+they+may+come+to+the+knowledge+of+his+truth%3F+Which+because+they+cannot+themselves+do+in+their+own+behalf%2C+as+long+as+the+sway+of+evil+custom+ever-bears+them+and+the+chains+of+Satan+detain+them+bound%2C+neither+are+they+able+to+break+through+those+errors+wherein+they+are+so+determinately+settled+that+they+pay+unto+falsity%2C+the+whole+sum+of+whatsoever+love+is+owing+unto+God%E2%80%99s+truth.+Our+Lord+merciful+and+just+requires+to+have+all+men+prayed+for%3B+that+when+we+behold+innumerable+multitudes+drawn+up+from+the+depth+of+so+bottomless+evils%2C+we+may+not+doubt+but+%28in+part%29+God+has+done+the+thing+we+requested%2C+nor+despair%2C+but+that+being+thankful+for+them%2C+towards+whom+already+He+has+showed+mercy%2C+the+rest+which+are+not+as+yet+enlightened+shall+before+they+pass+out+of+life+be+made+partakers+of+the+like+grace.+Or+if+the+grace+of+Him+which+saves+%5Bfor+so+we+set+is+falls+out%5D+overpass+some%2C+so+that+the+prayer+of+the+Church+for+them+be+not+received%2C+this+we+may+leave+to+the+hidden+judgments+of+God%E2%80%99s+righteousness+and+acknowledge+that+in+this+secret+there+is+a+gulf%2C+which%2C+while+we+live+we+shall+never+sound.%E2%80%99+%28Of+the+Calling+of+the+Gentiles%2C+bk.+1%2C+ch.+4%2C+amongst+Ambrose%E2%80%99s+Works%29%E2%80%9D%0A%0A%E2%80%94+Richard+Hooker%2C+The+Works+of+Mr.+Richard+Hooker%2C+%E2%80%A6+in+Eight+Books+of+Ecclesiastical+Polity%E2%80%A6+%28London%3A+Newcomb%2C+1666%29%2C+bk.+5%2C+pp.+202-6&amp;url=https%3A%2F%2F5solasquotes.github.io%2Fquote%2F121d5720ad.html&amp;via=5Solas" target="_blank" rel="noopener">Share on X</a><a class="perma" href="../quote/121d5720ad.html">Permalink</a><a class="src" href="https://reformedbooksonline.com/topics/prayer#:~:text=Will%2C%20whether%20it%20be%20in%20God,1%2C%20ch.%204%2C%20amongst%20Ambrose%E2%80%99s%20Works&amp;text=Will%2C% <blockquote><p>His profound feeling of dependence on God, for example, is illustrated in every conceivable way, not least strikingly in the constant habit of prayer which the Evangelists ascribe to him. But we are never directly told that he felt this dependence on God or “feared God”, or felt the emotions “of reverence and awe in the divine presence…¹ The narrative brings Jesus before us as acting under the impulse of all the religious emotions; but it does not stop to comment upon the emotions themselves. ¹ Cf. Heb. v. 7: “having been heard for his godly fear ([Greek] Eulabeia)”, i.e. for his reverent and submissive awe,” that religious fear of God and anxiety not to offend Him which manifests itself in voluntary and humble submission to his will” (Delitzsch in loc.). Davidson in loc: “The clause throws emphasis on the Son’s reverent submission.” Humanitarian writers debate whether “fear” of God is to be attributed to Jesus. Wellhausen (Israel, und jud. Geschichte, p. 383, expanded in Skizzen und Vorarbeiten, i. 1884, p. 98) represents him as passing his life in fear of the judge of all: “He feels the reality of God dominating life, he breathes in the fear of the Judge who demands account of every idle word and has power to destroy body and soul in hell.” Similarly Bousset (Jesus, 1904, pp. 54, 99, E. T. pp. 112, 203) speaks of him as learning by his own experience” that God is terrible (furchtbar) and that an awful darkness and dread encircles him even for those who stand nearest to him,” and as “sharing to the bottom of his soul” “the fear of that almighty God who has power to damn body and soul together,” which he “has stamped upon the hearts of his disciples with such marvellous energy.</p></blockquote>

<blockquote><p>1. There is and ever was one only person of Christ. For there is but one only begotten Son of God and one and the same Christ.

2. This person, being from all eternity by the natural begetting of the Father, is proper unto the Word; but in time was made common to the human nature taken to it by virtue of the personal union. For in the Word the essence, which it hath common, yea, the very same with the Father and the Holy ghost is to be distinguished from the proper manner of subsisting, whereby it comes to pass that it is a certain hypostasis or person, distinct from the Father and the Holy ghost; and therefore is and is called the hypostasis or person proper to the Son or to the Word.

But this eternal hypostasis, proper by nature unto the Word, is by this union made common, as we said, with the divine nature and the human taken unto it; namely, that the Word doth no less subsist really in this human form then it doth in that divine form and in that respect is no less true and perfect man then true and perfect God; yet the natures, properties and actions remaining safe and distinct.

3. Therefore into the unity of that immeasurable, most pure and most perfect person was taken the human nature, that is that lump consisting of the reasonable soul and flesh of man, finite, compounded and needing many things.

But how? Not so as that (for example) it contained that infinite person within the bounds or limits of it own finite or determinate substance, or that it spread it self, as it were, stretched out into the largeness of it. And that, which we say of this property, the same is to be thought and believed of all the rest, because they all remain unchangeable and unmixed.

How then was the human nature taken? Surely it was so taken into unity of the same person, that yet it is not made the very person, but rather existeth in the person, is borne and sustained of the person and ever dependeth wholly upon the same. For this union of the natures according to the hypostasis, or uniting of the hypostasis, is made without alteration, confusion or division.</p></blockquote>

<blockquote><p>Pantachus [a Lutheran]: As you say, the Word of God is certainly impassible and immutable, but because of the hypostatic union the Word [logos], so to speak, was affected in the same way as if it had suffered and died. Orothetes [reformed]: Except for your interjection ‘so to speak,’ I would reject your statement as unacceptable. For the Word of God is not affected since He is in no way changed. You have a case of why the Scriptures and the Fathers sometimes use such terminology in that they are mainly concerned with the Person. Neither was it possible, because of the unity of the two natures, for the divine hypostasis not to be present at the passion and death. But as Irenaeus said most wisely, ‘The Word was present and remained and acquiesced [consented and allowed], but He Himself did not die or suffer. Likewise our soul is present to man at death, that is, to the flesh, but the soul itself does not die. Hence let us confess that Christ suffered and died, but in the flesh, as Peter says [1 Pet. 4:1], or as regards the man.’ (For Irenaeus as quoted by Theodoret, see PG 83:284) Cyril was somewhat more forceful in the struggle against Nestorius, who pulled apart the natures and acknowledged no union of the divine nature with the human other than one based on merit… Cyril urged this union so hard that at first his teaching was rejected. For he spoke as if he believed that the Word of God Himself had literally suffered and died. But when he later explained his terminology, he was accepted as a faithful and sound teacher. Besides, when Eutyches was later condemned by the Council of Chalcedon for imagining that Christ had only one nature and maintaining that the Word of God was turned into flesh and had really and truly suffered, been crucified, and died in his own nature, more caution was observed in the sermons, statements, and terminology… Hence when we regard as verbal the communication of idioms [properties] what is impossible for either the human or the divine nature, it is verbal in this way: it has the hypostatic union as a solid root and firm foundation. Hence it does not follow that we say that Christ is God only verbally. We confess that He really is God and consubstantial with the Father regarding the divine nature, although his human nature is not divine. But you Pantachus, with considerable contempt have gathered from our statements the conclusion that for us Christ is God nominally. Who could plausibly think that about us, who testify in most explicit terms that there never existed in Christ a human nature without its adhering to the divine person?… I beg you, tell us whether according to your [Lutheran] ubiquity [of the human nature], if I understand with my mind and not my body and I hunger with my body and not my mind, do I therefore hunger or understand only verbally? Similarly when we say that Christ truly and suffered and died insofar as He was a man, you cannot rightly construe this as if He suffered and died only verbally… …although I deny that the Word of God really suffered and died, still I do not claim that the passion and death did not involve it at all, for the Word was present at the passion and death, as has been said, because of the hypostatic union, although in a quiescent way. It was not affected by any suffering or by a new quality. Hence it is not empty words that the Son of God suffered and died since that nature and flesh which He made his own and to which He was present by a union of Person, really and truly suffered and died. But I would never say, as you are used to asserting, that the Word [logon] Himself really and truly both suffered and died. … …I see your [Pantachus’s] explanation as admitting two interpretations. The first is that you understand the Son of God to have suffered and died in the sense that the passion and death sprang from the human nature but nonetheless so that they reached to the Word itself and reached in a way that the Word truly suffered and died. Some expressions of Cyril back at the Council of Ephesus conveyed that sense, which seriously offended many people. Surely it should be beyond dispute that the Word is impassible and immutable. Therefore I will not agree with such a statement. Neither do I retreat from the interpretation given by Cyril himself… The second sense is that which we usually express when we say that Christ suffered and died not from the nature of the Godhead but from the nature of the humanity, namely that the passion and death proceeded from the humanity and were terminated in it since they did not pass through nor penetrate the Word itself because it could neither die nor suffer. But if they Word is said to die and suffer, that means that the nature which it made its own through the incarnation died and suffered. Cyril expressed clearly this point in the passage you quoted when he writes: ‘The Word calls its own things which are proper to the flesh,’ and so forth. (PG 75:1405) It was not speaking falsely in calling them its own since they belong to that flesh that it assumed in the hypostatic union.</p></blockquote>

ntaining+that+the+Word+of+God+was+turned+into+flesh+and+had+really+and+truly+suffered%2C+been+crucified%2C+and+died+in+his+own+nature%2C+more+caution+was+observed+in+the+sermons%2C+statements%2C+and+terminology%E2%80%A6+Hence+when+we+regard+as+verbal+the+communication+of+idioms+%5Bproperties%5D+what+is+impossible+for+either+the+human+or+the+divine+nature%2C+it+is+verbal+in+this+way%3A+it+has+the+hypostatic+union+as+a+solid+root+and+firm+foundation.+Hence+it+does+not+follow+that+we+say+that+Christ+is+God+only+verbally.+We+confess+that+He+really+is+God+and+consubstantial+with+the+Father+regarding+the+divine+nature%2C+although+his+human+nature+is+not+divine.+But+you+Pantachus%2C+with+considerable+contempt+have+gathered+from+our+statements+the+conclusion+that+for+us+Christ+is+God+nominally.+Who+could+plausibly+think+that+about+us%2C+who+testify+in+most+explicit+terms+that+there+never+existed+in+Christ+a+human+nature+without+its+adhering+to+the+divine+person%3F%E2%80%A6+I+beg+you%2C+tell+us+whether+according+to+your+%5BLutheran%5D+ubiquity+%5Bof+the+human+nature%5D%2C+if+I+understand+with+my+mind+and+not+my+body+and+I+hunger+with+my+body+and+not+my+mind%2C+do+I+therefore+hunger+or+understand+only+verbally%3F+Similarly+when+we+say+that+Christ+truly+and+suffered+and+died+insofar+as+He+was+a+man%2C+you+cannot+rightly+construe+this+as+if+He+suffered+and+died+only+verbally%E2%80%A6+%E2%80%A6although+I+deny+that+the+Word+of+God+really+suffered+and+died%2C+still+I+do+not+claim+that+the+passion+and+death+did+not+involve+it+at+all%2C+for+the+Word+was+present+at+the+passion+and+death%2C+as+has+been+said%2C+because+of+the+hypostatic+union%2C+although+in+a+quiescent+way.+It+was+not+affected+by+any+suffering+or+by+a+new+quality.+Hence+it+is+not+empty+words+that+the+Son+of+God+suffered+and+died+since+that+nature+and+flesh+which+He+made+his+own+and+to+which+He+was+present+by+a+union+of+Person%2C+really+and+truly+suffered+and+died.+But+I+would+never+say%2C+as+you+are+used+to+asserting%2C+that+the+Word+%5Blogon%5D+Himself+really+and+truly+both+suffered+and+died.+%E2%80%A6+%E2%80%A6I+see+your+%5BPantachus%E2%80%99s%5D+explanation+as+admitting+two+interpretations.+The+first+is+that+you+understand+the+Son+of+God+to+have+suffered+and+died+in+the+sense+that+the+passion+and+death+sprang+from+the+human+nature+but+nonetheless+so+that+they+reached+to+the+Word+itself+and+reached+in+a+way+that+the+Word+truly+suffered+and+died.+Some+expressions+of+Cyril+back+at+the+Council+of+Ephesus+conveyed+that+sense%2C+which+seriously+offended+many+people.+Surely+it+should+be+beyond+dispute+that+the+Word+is+impassible+and+immutable.+Therefore+I+will+not+agree+with+such+a+statement.+Neither+do+I+retreat+from+the+interpretation+given+by+Cyril+himself%E2%80%A6+The+second+sense+is+that+which+we+usually+express+when+we+say+that+Christ+suffered+and+died+not+from+the+nature+of+the+Godhead+but+from+the+nature+of+the+humanity%2C+namely+that+the+passion+and+death+proceeded+from+the+humanity+and+were+terminated+in+it+since+they+did+not+pass+through+nor+penetrate+the+Word+itself+because+it+could+neither+die+nor+suffer.+But+if+they+Word+is+said+to+die+and+suffer%2C+that+means+that+the+nature+which+it+made+its+own+through+the+incarnation+died+and+suffered.+Cyril+expressed+clearly+this+point+in+the+passage+you+quoted+when+he+writes%3A+%E2%80%98The+Word+calls+its+own+things+which+are+proper+to+the+flesh%2C%E2%80%99+and+so+forth.+%28PG+75%3A1405%29+It+was+not+speaking+falsely+in+calling+them+its+own+since+they+belong+to+that+flesh+that+it+assumed+in+the+hypostatic+union.%E2%80%9D%0A%0A%E2%80%94+Peter+Martyr+Vermigli%2C+A+Dialogue+on+the+Two+Natures+in+Christ%2C+ed.+%26+trans.+John+Donnelly+in+The+Peter+Martyr+Library%2C+vol.+2%2C+pp.+59-62&amp;url=https%3A%2F%2F5solasquotes.github.io%2Fquote%2F78af632c0e.html&amp;via=5Solas" target="_blank" rel="noopener">Share on X</a><a class="perma" href="../quote/78af632c0e.html">Permalink</a><a class="src" href="https://reformedbooksonline.com/topics/

<blockquote><p>…and so [these examples brought forward by the Protesters] do not at all touch our case of joint acting in arms for just and necessary defence of subjects of one nation, habitually and antecedently incorporated, and now in common hazard. And for these alleged [verses] from the New Testament, they are such as are alleged by Separatists for separation from Churches for the the sin of fellow-members (as that 2 Cor. 6:14-15, etc.), which yet we believe judicious Separatists themselves will judge to be impertinently applied to a separation in the case [of civil, military defense] now in hand.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/james-sharp.html">James Sharp</a></span><span class="wk"><span class="lbl">Work:</span> <cite>A True Representation of the Rise, Progress &amp; State of the Present Divisions of the Church of Scotland</cite>, (London, 1657), p. 22</span></figcaption>

<blockquote><p>I will not say but sometimes it may be meet to discover the least error, and it may be by circumstances so aggreged that it may be needful judicially to take notice of it, as when it’s involved with offence and ready to breed schism or scandal, or in such like cases (in which respect there are some things mentioned in the decree, Acts 15, which are not very material in themselves, as the eating of things strangled) yet, we say, it is not simply and always necessary for ministers to press at the convincing of all who maintain something different from truth, or which is supposed to be so by them, if it be of things extra-fundamental, or, which have not direct or palpable influence upon the violating of faith, or corrupting of manners, much less to censure for the maintaining of it. For, it is not of such that these epistles speak: and we see, Rom. 14, and in the epistles to the Corinthians, in the debate about meats and eating of things sacrificed to idols, and such like, wherein though there was still a right side and a wrong, yet does he rather press the forbearing of these debates, than the dipping into them, not astricting men always to follow this or that, providing it be done without breach of unity and charity. Hence it is that although there be somethings he will give no forbearance unto, but authoritatively and ministerially he decides in them, yet in the same epistles there is something amongst the saints that he seeks rather to heal, and to obtain mutual forbearance in, than peremptorily to decide. See Rom. 14:1; Cor. 8:2-3, etc.; Phil. 2:3. … …there may be somethings truly errors that may and should be forborne [tolerated] in themselves, yet their consequents ought not to be forborne, and this also may be at one time, and in one Church more necessary to be adverted to than in another, because consequents of schism, faction, division, etc. may sometimes follow on the meanest [the least] errors. And seeing these are always enemies to edification, even when they arise from the least ground, they are never absolutely to be foreborne; for to say, I am of Paul, and I am of Apollos, and for one to think such a man a better preacher than another, seems to be no great matter; yet when it begins to rent [tear] them, and to make factions in Corinth, it is not to be forborne, but to be reproved: And in the former difference of meats, the apostle condemns always the offence and schism that followed on it, although he did not peremptorily decide anything as to men’s practices, or censure for the opinion itself… Thus the differences and errors concerning Church-government by bishops, and in the Congregational way, may, we conceive, in themselves be forborne in persons where they are not vented to the shaking and drawing away of others; but if pressed in practice, to the renting of a Church, and preferred or equalled to the true government that is established by the Word, in that case they are not to be foreborn, because then truth is to be vindicated, and obstructions to edification in the renting or distracting of a Church to be removed, and at one time more than at another, as such an offence does waken a schism, and disturb order and union in one Church or at one time more than another: hence we see, Acts 15, some things are put in that decree in reference to that time, only for preventing of schism and scandal…</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/james-durham.html">James Durham</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Treatise on Scandal</cite>, (1659), ch. 8, ‘When Some Errors are to be Foreborn’, pp. 202-3 &amp; 205-206</span></figcaption>

33.html&amp;via=5Solas" target="_blank" rel="noopener">Share on X</a><a class="perma" href="../quote/55acd10433.html">Permalink</a><a class="src" href="https://reformedbooksonline.com/on-fundamental-secondary-tertiary-teachings-of-christianity/#:~:text=I%20will%20not%20say%20but%20sometimes,for%20preventing%20of%20schism%20and%20scandal&amp;text=I%20will%20not%20say%20but%20sometimes%20it%20may&amp;text=time%2C%20only%20for%20preventing%20of%20schism%20and%20scandal" rel="noopener" target="_blank">Read it online · Reformed Books Online</a></div>

<blockquote><p>Beware also of spending your time and spirits in debates and vain janglings one with another, to be temptations one to another, raising your own and others passions and corruptions instead of holy conference that might minister grace to the hearers. Mind well the apostle’s caveats in 1 Tim. 1:4-7; 5:13; 6:3-5; 2 Tim. 2:16-17; 1 Thess. 4:11. Is it not observable that the greatest sticklers in differences, the greatest disputers and contenders are usually the most distempered and barren hearted? like the mountains of Gilboa, high and hot indeed, but dry and unfruitful; warm, but withered; the unkindly, foolish, heat of division and debate, eating out the life, sap and native heat of real religion, which evanishes then into airy notions and litigious strivings, whereof no edification comes. O let not religion fly up from your hearts to your heads and evaporate into airy foams and forms and turn vapid and insipid. Be sure by questions and disputes as well the power of religion is enervated as the majesty of it infringed. The many disputes about religion commonly overthrows the practice of it, which consists not in discourses, but in doing. It is easy for a formal, moth-eaten Christian to hold up in the one, while he cannot bear up in the other, as Seneca observed anent moral virtue, Omnes disputare malunt, quam vivere, more prone are people to debate about the things of God, than to practice what is uncontroverted. If heaven could be obtained, and God pleased with jangling and debates, a profane sophister should sooner have the one and do the other than a holy Christian who knows that it is not talking of, but walking in the ways of God’s commandments that is most acceptable in his sight. But to say no more, listen to the apostle’s oracle in 1 Cor. 11:16, ‘If any man seem to be contentious, we have no such custom, nor the Churches of God.’ Love perverse disputings who will (which ever corrupts the mind), flee ye them as death, 1 Tim. 6:5.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/john-bairdie.html">John Bairdie</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Balm from Gilead</cite>, (1674; London, 1681), pp. 165-66</span></figcaption>

<div class="actions"><button class="copy" data-copy="“Beware also of spending your time and spirits in debates and vain janglings one with another, to be temptations one to another, raising your own and others passions and corruptions instead of holy conference that might minister grace to the hearers. Mind well the apostle’s caveats in 1 Tim. 1:4-7; 5:13; 6:3-5; 2 Tim. 2:16-17; 1 Thess. 4:11. Is it not observable that the greatest sticklers in differences, the greatest disputers and contenders are usually the most distempered and barren hearted? like the mountains of Gilboa, high and hot indeed, but dry and unfruitful; warm, but withered; the unkindly, foolish, heat of division and debate, eating out the life, sap and native heat of real religion, which evanishes then into airy notions and litigious strivings, whereof no edification comes. O let not religion fly up from your hearts to your heads and evaporate into airy foams and forms and turn vapid and insipid. Be sure by questions and disputes as well the power of religion is enervated as the majesty of it infringed. The many disputes about religion commonly overthrows the practice of it, which consists not in discourses, but in doing. It is easy for a formal, moth-eaten Christian to hold up in the one, while he cannot bear up in the other, as Seneca observed anent moral virtue, Omnes disputare malunt, quam vivere, more prone are people to debate about the things of God, than to practice what is uncontroverted. If heaven could be obtained, and God pleased with jangling and debates, a profane sophister should sooner have the one and do the other than a holy Christian who knows that it is not talking of, but walking in the ways of God’s commandments that is most acceptable in his sight. But to say no more, listen to the apostle’s oracle in 1 Cor. 11:16, ‘If any man seem to be contentious, we have no such custom, nor the Churches of God.’ Love perverse disputings who will (which ever corrupts the mind), flee ye them — John Bairdie, Balm from Gilead, or the Differences about the Indulgence Stated &amp; Impleaded in a Sober &amp; Serious Letter to Ministers &amp; Christians in Scotland (1674; London, 1681), pp. 165-66">Copy</button><a class="share" href="https://x.com/intent/post?text=%E2%80%9CBeware+also+of+spending+your+time+and+spirits+in+debates+and+vain+janglings+one+with+another%2C+to+be+temptations+one+to+another%2C+raising+your+own+and+others+passions+and+corruptions+instead+of+holy+conference+that+might+minister+grace+to+the+hearers.+Mind+well+the+apostle%E2%80%99s+caveats+in+1+Tim.+1%3A4-7%3B+5%3A13%3B+6%3A3-5%3B+2+Tim.+2%3A16-17%3B+1+Thess.+4%3A11.+Is+it+not+observable+that+the+greatest+sticklers+in+differences%2C+the+greatest+disputers+and+contenders+are+usually+the+most+distempered+and+barren+hearted%3F+like+the+mountains+of+Gilboa%2C+high+and+hot+indeed%2C+but+dry+and+unfruitful%3B+warm%2C+but+withered%3B+the+unkindly%2C+foolish%2C+heat+of+division+and+debate%2C+eating+out+the+life%2C+sap+and+native+heat+of+real+religion%2C+which+evanishes+then+into+airy+notions+and+litigious+strivings%2C+whereof+no+edification+comes.+O+let+not+religion+fly+up+from+your+hearts+to+your+heads+and+evaporate+into+airy+foams+and+forms+and+turn+vapid+and+insipid.+Be+sure+by+questions+and+disputes+as+well+the+power+of+religion+is+enervated+as+the+majesty+of+it+infringed.+The+many+disputes+about+religion+commonly+overthrows+the+practice+of+it%2C+which+consists+not+in+discourses%2C+but+in+doing.+It+is+easy+for+a+formal%2C+moth-eaten+Christian+to+hold+up+in+the+one%2C+while+he+cannot+bear+up+in+the+other%2C+as+Seneca+observed+anent+moral+virtue%2C+Omnes+disputare+malunt%2C+quam+vivere%2C+more+prone+are+people+to+debate+about+the+things+of+God%2C+than+to+practice+what+is+uncontroverted.+If+heaven+could+be+obtained%2C+and+God+pleased+with+jangling+and+debates%2C+a+profane+sophister+should+sooner+have+the+one+and+do+the+other+than+a+holy+Christian+who+knows+that+it+is+not+talking+of%2C+but+walking+in+the+ways+of+God%E2%80%99s+commandments+that+is+most+acceptable+in+his+sight.+But+to+say+no+more%2C+listen+to+the+apostle%E2%80%99s+oracle+in+1+Cor.+11%3A16%2C+%E2%80%98If+any+man+seem+to+be+contentious%2C+we+have+no+such+custom%2C+nor+the+Churches+of+God.%E2%80%99+Love+perverse+disputings+who+will+%28which+ever+corrupts+the+mind%29%2C+flee+ye+them+as+death%2C+1+Tim.+6%3A5.%E2%80%9D%0A%0A%E2%80%94+John+Bairdie%2C+Balm+from+Gilead%2C+or+the+Differences+about+the+Indulgence+Stated+%26+Impleaded+in+a+Sober+%26+Serious+Letter+to+Ministers+%26+Christians+in+Scotland+%281674%3B+London%2C+1681%29%2C+pp.+165-66&amp;url=https%3A%2F%2F5solasquotes.github.io%2Fquote%2F97f57827ec.html&amp;via=5Solas" target="_blank" rel="noopener">Share on X</a><a class="perma" href="../quote/97f57827ec.html">Permalink</a><a class="src" href="https://reformedbooksonline.com/on-controversies/#:~:text=Beware%20also%20of%20spending%20your%20time,them%20as%20death%2C%201%20Tim.%206%3A5&amp;text=Beware%20also%20of%20spending%20your%20time%20and%20spirits&amp;text=flee%20ye%20them%20as%20death%2C%201%20Tim.%206%3A5" rel="noopener" target="_blank">Read it online · Reformed Books Online</a></div>

<main class="wrap"><figure class="quote" id="q-5b92934789" data-kw="">
<blockquote><p>Although we allow to individual believers the judgment of private discretion (because &quot;he that is spiritual judgeth all things&quot; [1 Cor. 2:15], and the apostle commands us to &quot;prove all things&quot; [1 Thess. 5:21]), we do not therefore assert in opposition to Peter (2 Pet. 1:20*) that the Scriptures are of private interpretation (idia epilysis). For epilysis here does not mean the interpretation of the Scriptures so much as the origin of the prophetic oracles.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/francis-turretin.html">Francis Turretin</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Institutes of Elenctic Theology</cite>, 2.20.33</span></figcaption>

</figure><figure class="quote" id="q-c5ca3bfdd2" data-kw="">
<blockquote><p>The question does not concern the perspicuity which does not exclude the means necessary for interpretation (i.e., the internal light of the Spirit, attention of mind, the voice and ministry of the church, sermons and commentaries, prayer and watchfulness). For we hold these means not only to be useful, but also necessary ordinarily.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/francis-turretin.html">Francis Turretin</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Institutes of Elenctic Theology</cite>, 2.17.6</span></figcaption>

<div class="actions"><button class="copy" data-copy="“The question does not concern the perspicuity which does not exclude the means necessary for interpretation (i.e., the internal light of the Spirit, attention of mind, the voice and ministry of the church, sermons and commentaries, prayer and watchfulness). For we hold these means not only to be useful, but also necessary ordinarily.”

— Francis Turretin, Institutes of Elenctic Theology, 2.17.6">Copy</button><a class="share" href="https://x.com/intent/post?text=%E2%80%9CThe%20question%20does%20not%20concern%20the%20perspicuity%20which%20does%20not%20exclude%20the%20means%20necessary%20for%20interpretation%20%28i.e.%2C%20the%20internal%20light%20of%20the%20Spirit%2C%20attention%20of%20mind%2C%20the%20voice%20and%20ministry%20of%20the%20church%2C%20sermons%20and%20commentaries%2C%20prayer%20and%20watchfulness%29.%20For%20we%20hold%20these%20means%20not%20only%20to%20be%20useful%2C%20but%20also%20necessary%20ordinarily.%E2%80%9D%0A%0A%E2%80%94%20Francis%20Turretin%2C%20Institutes%20of%20Elenctic%20Theology%2C%202.17.6&amp;url=https%3A%2F%2F5solasquotes.github.io%2Fquote%2Fc5ca3bfdd2.html&amp;via=5Solas" target="_blank" rel="noopener">Share on X</a><a class="perma" href="../quote/c5ca3bfdd2.html">Permalink</a><span class="src none">No free online copy linked</span></div>
</figure><figure class="quote" id="q-7469950696" data-kw="">
<blockquote><p>Now we determine that the supreme right, authority, and judgment of interpreting the scriptures, is lodged with the Holy Ghost and the scripture itself: for these two are not mutually repugnant. We say that the Holy Spirit is the supreme interpreter of scripture, because we must be illuminated by the Holy Spirit to be certainly persuaded of the true sense of scripture; otherwise, although we use all means, we can never attain to that full assurance which resides in the minds of the faithful. … As to external persuasion, we say that scripture itself is its own interpreter.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/william-whitaker.html">William Whitaker</a></span><span class="wk"><span class="lbl">Work:</span> <cite>A Disputation on Holy Scripture</cite>, Controversy 1, Q. 5, ch. 3 (p. 415)</span></figcaption>

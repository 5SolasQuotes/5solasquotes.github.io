<main class="wrap"><figure class="quote" id="q-0444e8a231" data-kw="">
<blockquote><p>For what synods determine, being the undeniable Word of God, is intrinsically infallible, and can never become fallible, though fallible and sinful men that are obnoxious [liable] to error and mistakes do hold it forth ministerially to others: and it is false that we are to believe that what synods determine according to the Word of God, we are to believe it is fallible and liable to error, and may [be] an untruth because they so determine; for then, when a synod determines [that] ‘there is but one true God,’ this principle of faith is believed to be subject to retraction and falsehood, because a synod has determined it to be a truth. But the truth is, we are to believe truths, determined by synods, to be infallible, and never again liable to retraction or discussion, because they are, and were in themselves and without any synodical determination, infallible, but not for this formal medium, because so says the synod, but because so says the Lord.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/samuel-rutherford.html">Samuel Rutherford</a></span><span class="wk"><span class="lbl">Work:</span> <cite>A Free Disputation Against Pretended Liberty of Conscience</cite>, … (1649), ch. 2, p. 36</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/worship/public-worship.html">Public Worship</a></span></div>

</figure><figure class="quote" id="q-fe4aa0bdd8" data-kw="">
<blockquote><p>Virtually all of the orthodox systems cite a wide variety of texts–dicta probantia [proving texts]–which are intended for use, not crassly as proof texts for citation without exegesis, but as points of reference to the long-established results of the church’s exegetical tradition. The dicta probantia or proving texts serve not to circumvent study of the text but to indicate received interpretation leading from exegesis to doctrine.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/richard-muller.html">Richard Muller</a></span><span class="wk"><span class="lbl">Work:</span> <cite>PRRD</cite>, (2003) 1.426</span></figcaption>

</figure><figure class="quote" id="q-539838700a" data-kw="">
<blockquote><p>III. Let us consider the concluding word, Amen. It imports two things. (1.) Our desire to be heard, q.d. so be it, Rev. 22:20. ‘Amen. Even so come, Lord Jesus.’ And the believer uses this word properly as a testimony of his desire, when by faith he is enabled and emboldened to plead with God, that He would fulfill his requests, 2 Chron. 20:6,11. (2.) Our Confidence and assurance that we shall be heard; q.d. so certainly it shall be, Rev. 1:7. ‘Even so Amen.’ And the sincere Christian uses the word with great propriety in the conclusion of his prayers, in testimony of his assurance to be heard, when he is by faith emboldened quietly to rest upon the Lord, that He will fulfill the desires of his heart, 2 Chron. 14:11. I conclude all with a very few inferences. … 4. Lastly, Use not Amen superficially at the end of your prayers, but with earnestness and faith. As for those who think it superstition to say Amen, they are ignorant of the word of God; and I would recommend to them to consult their Bible and Catechism, in order to cure them of that senseless conceit.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/thomas-boston.html">Thomas Boston</a></span><span class="wk"><span class="lbl">Work:</span> <cite>An Illustration of the Doctrines of the Christian Religion, ‘The Conclusion of the Lord’s Prayer’, in his Works</cite>, vol. 2, pp. 642-3</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/worship/public-worship.html">Public Worship</a></span></div>

<main class="wrap"><figure class="quote" id="q-25f536cbde" data-kw="">
<blockquote><p>The pecuniary embarrassments of men whom the world expects to be more prompt than all other men in the payment of accounts; the unappreciated sacrifices of men who are wearing out their lives in incessant and unremitting toil for others; the intolerance of sound doctrine; the insubordination to all discipline; these things are enough to try the patience, depress the spirits, discourage the efforts of any but the most veritable Greatheart. Let us not wonder that men writhe and grow restless under the unhappy conditions in the midst of which they are called to labour.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/thomas-dwight-witherspoon.html">Thomas Dwight Witherspoon</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Ministerial Restlessness in Presbyterian Quarterly</cite></span></figcaption>
<div class="meta"><span class="t"><a href="../topics/the-church.html">The Church</a></span></div>

</figure><figure class="quote" id="q-0b44dcca6e" data-kw="">
<blockquote><p>I answer, recommendatory letters can never give a Church-right to the Church-privileges of the seals of the Covenant: they do but only notify, manifest and declare the Church-right which the man had before. Therefore, either he cannot in any sort be capable of the seals of the Covenant in another congregation than his own whereof he is an inchurched member [as upon a congregationalist view], which destroys all communion of sister Churches, or if he be capable of the seals in another congregation [which be the case], he was capable and had a Church-right in himself before he received recommendatory letters: yea, these whom we recommend by letters as fit to partake of the sacraments in another congregation, we presuppose they have Church-right to the seals in another congregation-visible than in their own whereof they are members, except our testimony be false. Therefore, before our recommendatory letters, the person of approved piety was a member of all the visible Churches about, hoc ipso, and ‘by that same reason,’ that he is a member of one visible congregation: Yea Peter clearly insinuates that all who have received the Holy Ghost, are to be baptized, Acts 8:47, as Philip, Acts 8:37, and that if the Eunuch believed, he might be baptized. So that faith, to speak properly, does give us right to the seals, and to speak accurately, a visible profession of faith does not give a man right to the seals of grace, but only it does notify and declare to the Church that the man has right to the seals because he believes, and that the Church may lawfully give to him the seals, and that profession is a condition required in the right receivers of the seals in an ecclesiastical way; But faith gives the right to these seals, and because the faith of the believer goes with the believer when he goes to another visible congregation than his own, that faith gives him right to the seals in all places and in all congregations: for faith gives right to receive Christ sacramentally, not in one congregation only, but in all, and a visible profession does as a condition notify this faith and Church-right in all congregations.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/samuel-rutherford.html">Samuel Rutherford</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Due Right of Presbyteries, ‘Acts 15, A Pattern of a Juridicial Synod’</cite>, … (London, 1644), pt. 2, ch. 4, section 5, pp. 195-96 Rutherford (c. 1600–1661) was a Scottish presbyterian Westminster divine.</span></figcaption>

</figure><figure class="quote" id="q-871af72684" data-kw="">
<blockquote><p>2. Be it granted: That there is no salvation to any that are out of the communion (i.e.) internal of the Church (For certainly none are saved that are not the members of Christ, the Head; and then tis impossible that any should be one of the members of Christ and not have those of the church for his fellow-members, unless Christ have two distinct bodies). Of this St. Augustine, Against the Donatists, Of the Unity of the Church, ch. 2, speaks very fully: ‘Quaestio certe inter nos versatur, ubi sit Ecclesia; utrum apud nos, an apud illos? Quae utique una est; quam majores nostri Catholicam nominarunt. Haec autem Ecclesia corpus Christi est. Unde utique manifestum est, eum, qui non est in membris Christi, Christianam salutem habere non posse. Membra vero Christi per unitatis charitatem sibi copulantur, et per eandem capiti suo cohaerent, quod est Jesus Christus.’ He continues afterward, ch. 4: ‘Quicunque de ipso Capite Scripturis sanctis consentiunt [i.e. are never so orthodox in their belief] et unitati Ecclesiae non communicant, non sunt in Ecclesia; quia de Christi corpore (quod est Ecclesia) dissentiunt ab ipsius Christi testificatione [i.e. that she is toto orbe diffusa, and shall never perish, etc.] et apertissimis ac notissimis Scripturarum testimoniis contradicunt.’ Again: ‘Quicunque credunt quod Christus Jesus in carne vener it etc. sed tamen ab ejus corpore, quod est Ecclesia, ita dissentiunt, ut eorum communio non sit cum toto quacunque diffunditur, sed in aliqua parte separata inveniatur; manifestum est eos non esse in Ecclesia Catholica. In aliqua parte separata, for the reason given by him above; because they want charity: Membra vero Christi per unitatis charitatem sibi copulantur, et capiti suo; and because notissimis Scripturis contradicunt.’

3. But, all this being granted, yet 3rdly, if any happen to be extra Ecclesiam [outside the Church], out of the Church’s external communion, or also in parte separata [in a part separated]; so he be not guilty of that fault which makes such separation damnable, but still retains the necessary bond of charity; such a one (once joined unto it by baptism), though amongst other separatists, seems to remain himself still unseparated (though not from the external, yet) from the internal communion of the Church. And if any be so strict, as, besides this internal (effected by the same Spirit of Christ in all the faithful, and always seen to God) always to exact an external also, such assertion will in many instances prove false, even in St. Augustine’s Confessions; who freely acknowledges both many that are in the external communion of the Church, no true members thereof; and many to be true members of the Church who are out of the external communion thereof. See Of the Unity of the Church, ch. 20: ‘Multi tales sunt in Sacramentorum communione cum Ecclesia, et tamen jam non sunt in Ecclesia: Alioquin et tunc quisque praeciditur, cum excommunicatur. Consequens erit, ut tunc rursus inseratur, cum visibiliter communioni restituitur. Quid si ergo sictus accedat, atque adversus veritatem et Ecclesiam •or inimicissimum gerat? Quamvis peragatur in eo illa solemnitas, nunquid reconciliatur? nunquid inseritur? absit. Sicut ergo, jam denuo communicans nondum insertus est; sic et antequam visibiliter excommunicatur, quisquis contra veritatem, qua convincitur et arguitur, inimicum gest at animum, jam praecisus est.’ Again; Of Baptism, bk. 1, ch. 17: ‘Semper ab illius Ecclesiae, quae sine macula et ruga est, unitate divisus est, etiam qui, in carnali obduratione, congregationi Sanctorum miscetur.—Spirituales autem sive ad hoc ipsum pro studio proficientes, non eunt for as [i.e. when they are excommunicated]: quia et quum aliqua vel perversitate, vel necessitate hominum, videntur expelli; ibi magis probantur quam si intus permaneant; cum adversus Ecclesiam nullatenus eriguntur, sed in solida unitatis petra fortissimo charitatis robore radicantur.’ Add to this the place quoted below, §13, and that discourse of his Of the Unity of the Church, ch. 20, of the several degrees of their culpableness who may live in a schismatical communion, set down §7: Where the father affirms, God has some good corn amongst those tares: ubi radice viva herbae vigor atteritur, etc. Several instances therefore there may be given wherein such assertion will prove false. For example: It is granted to be false in those who are unjustly excommunicated (as some, tis by all conceded, may be); and in penitents, after a just excommunication, who are not yet actually reconciled, of whom Bellarmine, De Ecclesia, bk. 3, ch. 6, says: ‘Tales esse in Ecclesia animo sive desiderio, quod sufficit illis ad salutem:’ bringing in St. Augustine’s saying, Of the True Religion, ch. 6, of such like; Hos coronat in occulto Pater in occulto videns. (See below §) Again: false, at least, in those dying after baptism, before the use of reason, in a schismatical Church. Again, false in catechumeni [catechumens] that die before they receive baptism, or are entered into the Church… I add that some of the catechumeni were such, as, for secular reasons, etc, deferred baptism long after they might have been admitted to, and received, it: and amongst such, I suppose was Valentinian; who dying before baptism received, after baptism willingly deferred, yet St. Ambrose doubted not of his salvation… But we must put some difference between the committing of a fault (in the want [lack] thereof), and the incurring of certain damnation… I say therefore, in such cases, the position above, being meant of external communion, is false: and then why may it not also be so in some other cases? As namely in one, whose ill hap it is to be born in a schismatical communion, yet where he partakes the true sacraments; when it is supposed, that such a one may be guiltless of that crime, for which the schismatical are damned.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/obadiah-walker.html">Obadiah Walker</a></span><span class="wk"><span class="lbl">Work:</span> <cite>‘Of the Danger of Schism’</cite>, pp. 4-7 in Of Faith Necessary to Salvation &amp; of the Necessary Ground of Faith Salvifical whether this, alway, in every man, must be infallibility… (Oxford, 1688), Concerning Salvation possible to be had in a Schismatical Communion and Concerning the danger of living in, and the necessity of departing from, a Known-Schismatical Communion</span></figcaption>

<div class="actions"><button class="copy" data-copy="“2. Be it granted: That there is no salvation to any that are out of the communion (i.e.) internal of the Church (For certainly none are saved that are not the members of Christ, the Head; and then tis impossible that any should be one of the members of Christ and not have those of the church for his fellow-members, unless Christ have two distinct bodies). Of this St. Augustine, Against the Donatists, Of the Unity of the Church, ch. 2, speaks very fully: ‘Quaestio certe inter nos versatur, ubi sit Ecclesia; utrum apud nos, an apud illos? Quae utique una est; quam majores nostri Catholicam nominarunt. Haec autem Ecclesia corpus Christi est. Unde utique manifestum est, eum, qui non est in membris Christi, Christianam salutem habere non posse. Membra vero Christi per unitatis charitatem sibi copulantur, et per eandem capiti suo cohaerent, quod est Jesus Christus.’ He continues afterward, ch. 4: ‘Quicunque de ipso Capite Scripturis sanctis consentiunt [i.e. are never so orthodox in their belief] et unitati Ecclesiae non communicant, non sunt in Ecclesia; quia de Christi corpore (quod est Ecclesia) dissentiunt ab ipsius Christi testificatione [i.e. that she is toto orbe diffusa, and shall never perish, etc.] et apertissimis ac notissimis Scripturarum testimoniis contradicunt.’ Again: ‘Quicunque credunt quod Christus Jesus in carne vener it etc. sed tamen ab ejus corpore, quod est Ecclesia, ita dissentiunt, ut eorum communio non sit cum toto quacunque diffunditur, sed in aliqua parte separata inveniatur; manifestum est eos non esse in Ecclesia Catholica. In aliqua parte separata, for the reason given by him above; because they want charity: Membra vero Christi per unitatis charitatem sibi copulantur, et capiti suo; and because notissimis Scripturis contradicunt.’

3. But, all this being granted, yet 3rdly, if any happen to be extra Ecclesiam [outside the Church], out of the Church’s external communion, or also in parte separata [in a part separated]; so he be not guilty of that fault which makes such separation damnable, but still retains the necessary bond of charity; such a one (once joined unto it by baptism), though amongst other separatists, seems to remain himself still unseparated (though not from the external, yet) from the internal communion of the Church. And if any be so strict, as, besides this internal (effected by the same Spirit of Christ in all the faithful, and always seen to God) always to exact an external also, such assertion will in many instances prove false, even in St. Augustine’s Confessions; who freely acknowledges both many that are in the external communion of the Church, no true members thereof; and many to be true members of the Church who are out of the external communion thereof. See Of the Unity of the Church, ch. 20: ‘Multi tales sunt in Sacramentorum communione cum Ecclesia, et tamen jam non sunt in Ecclesia: Alioquin et tunc quisque praeciditur, cum excommunicatur. Consequens erit, ut tunc rursus inseratur, cum visibiliter communioni restituitur. Quid si ergo sictus accedat, atque adversus veritatem et Ecclesiam •or inimicissimum gerat? Quamvis peragatur in eo illa solemnitas, nunquid reconciliatur? nunquid inseritur? absit. Sicut ergo, jam denuo communicans nondum insertus est; sic et antequam visibiliter excommunicatur, quisquis contra veritatem, qua convincitur et arguitur, inimicum gest at animum, jam praecisus est.’ Again; Of Baptism, bk. 1, ch. 17: ‘Semper ab illius Ecclesiae, quae sine macula et ruga est, unitate divisus est, etiam qui, in carnali obduratione, congregationi Sanctorum miscetur.—Spirituales autem sive ad hoc ipsum pro studio proficientes, non eunt for as [i.e. when they are excommunicated]: quia et quum aliqua vel perversitate, vel necessitate hominum, videntur expelli; ibi magis probantur quam si intus permaneant; cum adversus Ecclesiam nullatenus eriguntur, sed in solida unitatis petra fortissimo charitatis robore radicantur.’ Add to this the place quoted below, §13, and that discourse of his Of the Unity of the Church, ch. 20, of the several degrees of their culpableness who may live in a schismatical communion, set down §7: Where the father affirms, God has some good corn amongst those tares: ubi radice viva herbae vigor atteritur, etc. Several instances therefore there may be given wherein such assertion will prove false. For example: It is granted to be false in those who are unjustly excommunicated (as some, tis by all conceded, may be); and in penitents, after a just excommunication, who are not yet actually reconciled, of whom Bellarmine, De Ecclesia, bk. 3, ch. 6, says: ‘Tales esse in Ecclesia animo sive desiderio, quod sufficit illis ad salutem:’ bringing in St. Augustine’s saying, Of the True Religion, ch. 6, of such like; Hos coronat in occulto Pater in occulto videns. (See below §) Again: false, at least, in those dying after baptism, before the use of reason, in a schismatical Church. Again, false in catechumeni [catechumens] that die before they receive baptism, or are entered into the Church… I add that some of the catechumeni were such, as, for secular reasons, etc, deferred baptism long after they might have been admitted to, and received, it: and amongst such, I suppose was Valentinian; who dying before baptism received, after baptism willingly deferred, yet St. Ambrose doubted not of his salvation… But we must put some difference between the committing of a fault (in the want [lack] thereof), and the incurring of certain damnation… I say therefore, in such cases, the position above, being meant of external communion, is false: and then why may it not also be so in some other cases? As namely in one, whose ill hap it is to be born in a schismatical communion, yet where he partakes the true sacraments; when it is supposed, that such a one may be guiltless of that crime, for which the schismatical are damned.”

— Obadiah Walker, ‘Of the Danger of Schism’, pp. 4-7 in Of Faith Necessary to Salvation &amp; of the Necessary Ground of Faith Salvifical whether this, alway, in every man, must be infallibility… (Oxford, 1688), Concerning Salvation possible to be had in a Schismatical Communion and Concerning the danger of living in, and the necessity of departing from, a Known-Schismatical Communion">Copy</button><a class="share" href="https://x.com/intent/post?text=%E2%80%9C2.+Be+it+granted%3A+That+there+is+no+salvation+to+any+that+are+out+of+the+communion+%28i.e.%29+internal+of+the+Church+%28For+certainly+none+are+saved+that+are+not+the+members+of+Christ%2C+the+Head%3B+and+then+tis+impossible+that+any+should+be+one+of+the+members+of+Christ+and+not+have+those+of+the+church+for+his+fellow-members%2C+unless+Christ+have+two+distinct+bodies%29.+Of+this+St.+Augustine%2C+Against+the+Donatists%2C+Of+the+Unity+of+the+Church%2C+ch.+2%2C+speaks+very+fully%3A+%E2%80%98Quaestio+certe+inter+nos+versatur%2C+ubi+sit+Ecclesia%3B+utrum+apud+nos%2C+an+apud+illos%3F+Quae+utique+una+est%3B+quam+majores+nostri+Catholicam+nominarunt.+Haec+autem+Ecclesia+corpus+Christi+est.+Unde+utique+manifestum+est%2C+eum%2C+qui+non+est+in+membris+Christi%2C+Christianam+salutem+habere+non+posse.+Membra+vero+Christi+per+unitatis+charitatem+sibi+copulantur%2C+et+per+eandem+capiti+suo+cohaerent%2C+quod+est+Jesus+Christus.%E2%80%99+He+continues+afterward%2C+ch.+4%3A+%E2%80%98Quicunque+de+ipso+Capite+Scripturis+sanctis+consentiunt+%5Bi.e.+are+never+so+orthodox+in+their+belief%5D+et+unitati+Ecclesiae+non+communicant%2C+non+sunt+in+Ecclesia%3B+quia+de+Christi+corpore+%28quod+est+Ecclesia%29+dissentiunt+ab+ipsius+Christi+testificatione+%5Bi.e.+that+she+is+toto+orbe+diffusa%2C+and+shall+never+perish%2C+etc.%5D+et+apertissimis+ac+notissimis+Scripturarum+testimoniis+contradicunt.%E2%80%99+Again%3A+%E2%80%98Quicunque+credunt+quod+Christus+Jesus+in+carne+vener+it+etc.+sed+tamen+ab+ejus+corpore%2C+quod+est+Ecclesia%2C+ita+dissentiunt%2C+ut+eorum+communio+non+sit+cum+toto+quacunque+diffunditur%2C+sed+in+aliqua+parte+separata+inveniatur%3B+manifestum+est+eos+non+esse+in+Ecclesia+Catholica.+In+aliqua+parte+separata%2C+for+the+reason+given+by+him+above%3B+because+they+want+charity%3A+Membra+vero+Christi+per+unitatis+charitatem+sibi+copulantur%2C+et+capiti+suo%3B+and+because+notissimis+Scripturis+contradicunt.%E2%80%99+3.+But%2C+all+this+being+granted%2C+yet+3rdly%2C+if+any+happen+to+be+extra+Ecclesiam+%5Boutside+the+Church%5D%2C+out+of+the+Church%E2%80%99s+external+communion%2C+or+also+in+parte+separata+%5Bin+a+part+separated%5D%3B+so+he+be+not+guilty+of+that+fault+which+makes+such+separation+damnable%2C+but+still+retains+the+necessary+bond+of+charity%3B+such+a+one+%28once+joined+unto+it+by+baptism%29%2C+though+amongst+other+separatists%2C+seems+to+remain+himself+still+unseparated+%28though+not+from+the+external%2C+yet%29+from+the+internal+communion+of+the+Church.+And+if+any+be+so+strict%2C+as%2C+besides+this+internal+%28effected+by+the+same+Spirit+of+Christ+in+all+the+faithful%2C+and+always+seen+to+God%29+always+to+exact+an+external+also%2C+such+assertion+will+in+many+instances+prove+false%2C+even+in+St.+Augustine%E2%80%99s+Confessions%3B+who+freely+acknowledges+both+many+that+are+in+the+external+communion+of+the+Church%2C+no+true+members+thereof%3B+and+many+to+be+true+members+of+the+Church+who+are+out+of+the+external+communion+thereof.+See+Of+the+Unity+of+the+Church%2C+ch.+20%3A+%E2%80%98Multi+tales+sunt+in+Sacramentorum+communione+cum+Ecclesia%2C+et+tamen+jam+non+sunt+in+Ecclesia%3A+Alioquin+et+tunc+quisque+praeciditur%2C+cum+excommunicatur.+Consequens+erit%2C+ut+tunc+rursus+inseratur%2C+cum+visibiliter+communioni+restituitur.+Quid+si+ergo+sictus+accedat%2C+atque+adversus+veritatem+et+Ecclesiam+%E2%80%A2or+inimicissimum+gerat%3F+Quamvis+peragatur+in+eo+illa+solemnitas%2C+nunquid+reconciliatur%3F+nunquid+inseritur%3F+absit.+Sicut+ergo%2C+jam+denuo+communicans+nondum+insertus+est%3B+sic+et+antequam+visibiliter+excommunicatur%2C+quisquis+contra+veritatem%2C+qua+convincitur+et+arguitur%2C+inimicum+gest+at+animum%2C+jam+praecisus+est.%E2%80%99+Again%3B+Of+Baptism%2C+bk.+1%2C+ch.+17%3A+%E2%80%98Semper+ab+illius+Ecclesiae%2C+quae+sine+macula+et+ruga+est%2C+unitate+divisus+est%2C+etiam+qui%2C+in+carnali+obduratione%2C+congregationi+Sanctorum+miscetur.%E2%80%94Spirituales+autem+sive+ad+hoc+ipsum+pro+studio+proficientes%2C+non+eunt+for+as+%5Bi.e.+when+they+are+excommunicated%5D%3A+quia+et+quum+aliqua+vel+perversitate%2C+vel+necessitate+hominum%2C+videntur+expelli%3B+ibi+magis+probantur+quam+si+intus+permaneant%3B+cum+adversus+Ecclesiam+nullatenus+eriguntur%2C+sed+in+solida+unitatis+petra+fortissimo+charitatis+robore+radicantur.%E2%80%99+Add+to+this+the+place+quoted+below%2C+%C2%A713%2C+and+that+discourse+of+his+Of+the+Unity+of+the+Church%2C+ch.+20%2C+of+the+several+degrees+of+their+culpableness+who+may+live+in+a+schismatical+communion%2C+set+down+%C2%A77%3A+Where+the+father+affirms%2C+God+has+some+good+corn+amongst+those+tares%3A+ubi+radice+viva+herbae+vigor+atteritur%2C+etc.+Several+instances+therefore+there+may+be+given+wherein+such+assertion+will+prove+false.+For+example%3A+It+is+granted+to+be+false+in+those+who+are+unjustly+excommunicated+%28as+some%2C+tis+by+all+conceded%2C+may+be%29%3B+and+in+penitents%2C+after+a+just+excommunication%2C+who+are+not+yet+actually+reconciled%2C+of+whom+Bellarmine%2C+De+Ecclesia%2C+bk.+3%2C+ch.+6%2C+says%3A+%E2%80%98Tales+esse+in+Ecclesia+animo+sive+desiderio%2C+quod+sufficit+illis+ad+salutem%3A%E2%80%99+bringing+in+St.+Augustine%E2%80%99s+saying%2C+Of+the+True+Religion%2C+ch.+6%2C+of+such+like%3B+Hos+coronat+in+occulto+Pater+in+occulto+videns.+%28See+below+%C2%A7%29+Again%3A+false%2C+at+least%2C+in+those+dying+after+baptism%2C+before+the+use+of+reason%2C+in+a+schismatical+Church.+Again%2C+false+in+catechumeni+%5Bcatechumens%5D+that+die+before+they+receive+baptism%2C+or+are+entered+into+the+Church%E2%80%A6+I+add+that+some+of+the+catechumeni+were+such%2C+as%2C+for+secular+reasons%2C+etc%2C+deferred+baptism+long+after+they+might+have+been+admitted+to%2C+and+received%2C+it%3A+and+amongst+such%2C+I+suppose+was+Valentinian%3B+who+dying+before+baptism+received%2C+after+baptism+willingly+deferred%2C+yet+St.+Ambrose+doubted+not+of+his+salvation%E2%80%A6+But+we+must+put+some+difference+between+the+committing+of+a+fault+%28in+the+want+%5Black%5D+thereof%29%2C+and+the+incurring+of+certain+damnation%E2%80%A6+I+say+therefore%2C+in+such+cases%2C+the+position+above%2C+being+meant+of+external+communion%2C+is+false%3A+and+then+why+may+it+not+also+be+so+in+some+other+cases%3F+As+namely+in+one%2C+whose+ill+hap+it+is+to+be+born+in+a+schismatical+communion%2C+yet+where+he+partakes+the+true+sacraments%3B+when+it+is+supposed%2C+that+such+a+one+may+be+guiltless+of+that+crime%2C+for+which+the+schismatical+are+damned.%E2%80%9D%0A%0A%E2%80%94+Obadiah+Walker%2C+%E2%80%98Of+the+Danger+of+Schism%E2%80%99%2C+pp.+4-7+in+Of+Faith+Necessary+to+Salvation+%26+of+the+Necessary+Ground+of+Faith+Salvifical+whether+this%2C+alway%2C+in+every+man%2C+must+be+infallibility%E2%80%A6+%28Oxford%2C+1688%29%2C+Concerning+Salvation+possible+to+be+had+in+a+Schismatical+Communion+and+Concerning+the+danger+of+living+in%2C+and+the+necessity+of+departing+from%2C+a+Known-Schismatical+Communion&amp;url=https%3A%2F%2F5solasquotes.github.io%2Fquote%2F871af72684.html&amp;via=5Solas" target="_blank" rel="noopener">Share on X</a><a class="perma" href="../quote/871af72684.html">Permalink</a><a class="src" href="https://reformedbooksonline.com/on-the-phrase-there-is-no-salvation-outside-the-church/#:~:text=2.%20Be%20it%20granted%3A%20That%20there,for%20which%20the%20schismatical%20are%20damned&amp;text=2.%20Be%20it%20granted%3A%20That%20there%20is%20no&amp;text=that%20crime%2C%20for%20which%20the%20schismatical%20are%20damned" rel="noopener" target="_blank">Read it online · Reformed Books Online</a></div>

<blockquote><p>Some more zealous than knowing and considerate did aggravate the acceptance of the indulgence to a great height, and ground of separation, and so wrought their enemies’ work for them better than they could do it for themselves: And so that division proved fatal at Bothwell, where they had a fair game, and opportunity to have defeated all their enemies, and brought prelacy down to the dust. It is observable there was this difference in the two appearances: Pentland had love, harmony and sympathy, wanting nothing but men and arms; Bothwell had both, and wanted harmony, but plagued with division.</p></blockquote>

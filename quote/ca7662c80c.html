<main class="wrap"><figure class="quote" id="q-ca7662c80c" data-kw="">
<blockquote><p>WE cannot justly pretend to the Glory of Angels, unless we imitate their Purity. To follow the pleasures of the Flesh, hunt after its Allurements, and cherish its filthy Delusions, is to walk in the Path of Damnation.

CAN we be convinced of these Truths, without being in love with Chastity; without avoiding all dangerous occasions, as enticing Company and guilty Sloth, and without arming our selves against the Flesh, by Fasting and Mortification?

LET us make a Covenant with our Eyes, that they never open a Door to any unclean Thoughts; and if at any time they break this Covenant, let our Heart, being animated by the Cross of JESUS, stifle all those Thoughts in their Birth, which might lead us to Sin.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/pierre-allix.html">Pierre Allix</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Epictetus Christianus; or, Maxims of True Christianity</cite>, trans. Paul Lorrain (London: Brab. Aylmer, 1688), p. 94.</span></figcaption>

<blockquote><p>…there is a twofold necessity; one absolute, the other conditional. Absolute, that is, when one thing is so necessarily required to another, as that it cannot be without it. Secondly, there is a necessity that is not absolute, but conditional; that is, when one thing is so necessary to another as that it cannot well be without it: of this latter sort, the necessity of this government in the Church of God is: for the Church may be without it in some kind of being, but it cannot have her well-being except this concur.</p></blockquote>

</figure><figure class="quote" id="q-e8163bee18" data-kw="">
<blockquote><p>The Gospel, however taken, has conditional promises. The Papists here assent to us, but not without calumny. For they feign that we make the Gospel promises to be absolute. Proposition 2: The Gospel most largely taken has the promise of eternal life, on condition either of faith only [for justification], or faith and new obedience together [for final salvation], or of fulfilling the perfect Law by our own strength (as rehearsing the Law of works): and so it makes mention not only of the evangelical condition and righteousness, but of the legal too. Proposition 3: The Gospel largely taken, has the promise of eternal life on condition of faith and new obedience [for final salvation]. Of the condition of faith there is no doubt: nor of the condition of new obedience conjunct with faith, Rom. 8:13; Heb. 12:14.</p></blockquote>

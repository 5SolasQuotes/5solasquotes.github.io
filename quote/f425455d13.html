<main class="wrap"><figure class="quote" id="q-f425455d13" data-kw="">
<blockquote><p>1. God is the alone Object of Divine Worship; and there is no Object thereof but God: because there is none who hath these infinite Attributes and Excellencies, which are requisite in the Object of Divine Worship, but God, such as Omniscience, Omnipotence, Infiniteness, supreme Majesty, Glory, &amp;c. from which (to speak so) results Adorability, an essential Attribute of the Majesty of God, as Immutability and Eternity are; He being adorable, because Infinite, Immense, Omniscient, &amp;c. And therefore it cannot be communicate to any other, more than these incommunicable properties can be; and yet none can be worshipped who is not (so to speak) adorable.

2. There is but one kind of Divine Worship, to wit, that which is Supreme, and becoming this infinite Majesty of God: and, in a word, that which is required in the first Table of the Law, as that which is competent to this glorious excellent God: and this follows on the former: for, if there be but one Object, there can be but one manner of Worship. Therefore, in Scripture, to Worship God, is alway opposed to the worshipping of any other, and to the admitting of any Worship, which is not competent to God, as Revel. 19.9, 10, and 22.9.

3. Although there be Three Persons of the glorious Godhead, and all are to be worshipped; yet, there are not three Objects of Worship, but one; nor three kinds of Worship: Not three Objects, because these Three Persons are the same One infinite God, who is the Object of Worship. For, first, Though the Three Persons, be really distinct each from other; yet, none of them is really distinct from the essence of the Godhead:

Therefore, the Father, is that same Object of Worship with the Son, because that same God. And, secondly, Though the Father be infinite, and the Son infinite, &amp;c. yet, there are not two infiniteness, but the same infiniteness and immenseness, that which is the Fathers is the Sons also; because these are essential properties, and so common to all the Persons: and therefore, though their personal properties be distinct; yet, their essential Attributes being common, they are not distinct Objects, but the same one Object; seeing, still, in Worship, respect must be had to their essential Attributes; and so to the Godhead, which is common to All: and therefore consequently to Them, as They are one Object, it being the Deity (which is One) that is the formal Object of Worship: And, though sometimes these Three Persons be named together, as here; yet, that is not to propose them as distinct Objects, but to shew, who this one Object God is, to wit, the Father, Son and Spirit, Three Persons of the same One indivisible Godhead. Hence, the unity of the Godhead, is inculcated, for this end; The Lord thy God, O Israel, is One Lord.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/james-durham.html">James Durham</a></span><span class="wk"><span class="lbl">Work:</span> <cite>A commentary upon the book of the Revelation. Wherein the text is explained, the series of the several prophecies contained in that book, deduced according to their order and dependence on each other; the periods and succession of times, at, or about which, these prophecies, that are already fulfill</cite>, (Edinburgh: Christopher Higgins, 1658), pp 11-12.</span></figcaption>

<blockquote><p>‘It’s not always easy to identify a cult,’ Jenkinson says, explaining that there isn’t one type of person that joins a cult, they don’t dress a certain way and they can operate from ‘ordinary’ houses. The Family Survival Trust… defines a cult as a system controlled by a charismatic and authoritarian leadership that is ‘rigidly bounded’ and supported by a fixed set of beliefs. It involves brainwashing designed to isolate, control and exploit followers. Cults do not have to be religious. Linguist Amanda Montell, author of Cultish: The Language of Fanaticism, explains people can ‘erect a cult around anything, as long as you can inject it with fear and an ‘us-versus-them’ mentality’. … While cults can be hard to spot, Jenkinson and Montell note some ‘red flags’ people can look for: – One possible indicator Jenkinson highlights is ‘love bombing,’ a manipulation tactic that sees abusers use affection and declarations of love as a way of gaining power and control. – Another common theme is promising ‘answers to life’s very complex problems’… – Montell says the combination of mantras, buzzwords and nicknames for insiders and outsiders of the group, as well as language that elicits a strong reaction while encouraging us not to ask further questions, can be indicators. – The linguist adds that certain texts being ‘off-limits’ in the group can also be a warning sign. – The most ‘extreme’ trait of a cult for Montell is a ‘high barrier to exit’, meaning group members being made to feel they might lose their identity or friendships, or fear retaliation, if they leave the group.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/shola-lee.html">Shola Lee</a></span><span class="wk"><span class="lbl">Work:</span> <cite>”You’re sold a lie’: How do you spot a cult’</cite>, (2025) at BBC.com</span></figcaption>

<blockquote><p>He certainly did not suspect the Corinthians of such a degree of ignorance or carelessness as to think that they worshipped idols in their heart. But as they made no scruple of frequenting the assemblies of the wicked, and observing along with them certain rites instituted in honor of idols, he condemns this liberty taken by them, as being a very bad example. It is certain, then, that when he here makes mention of idolatry, he, speaks of what is outward, or, if you prefer it, of the profession of idolatry. For as God is said to be worshipped by the bending of the knee, and other tokens of reverence, while the principal and genuine worship of Him is inward, so is it also as to idols, for the case holds the same in things opposite. It is to no purpose that very many in the present day endeavor to excuse outward actions on this pretext, that the heart is not in them, while Paul convicts of idolatry those very acts, and assuredly with good reason. For, as we owe to God not merely the secret affection of the heart, but also outward adoration, the man who offers to an idol an appearance of adoration takes away so much of the honor due to God. Let him allege as he may that his heart is quite away from it. The action itself is to be seen, in which the honor that is due to God is transferred to an idol.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/john-calvin.html">John Calvin</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Commentary on 1 Corinthians</cite>, 10, verse 14</span></figcaption>

<main class="wrap"><figure class="quote" id="q-3a9422ff09" data-kw="">
<blockquote><p>If you ask of whom born? I answer, as God is Father, so the Church is the Mother of every child of God: to this purpose saith the Apostle, Jerusalem which is above is free, which is the mother of us all, Gal. 4.26. what is Jerusalem but the Church? what is Jerusalem but the Church? for as that City was the seat of David, Psal. 122.5. so is this Church the throne of Christ, figured by the kingdom of David, Revel. 3.7. and therefore of both these God thus proclaims, Here shall be my rest for ever, here will I dwell, for I have a delight herein, Psal. 132.14. And rightly is the Church called our mother, first because she is the spouse of our Father, betrothed, Hosea 2.19. coupled and made one, Cant. 6.3. I am my we beloved’s, and my well-beloved is mine; and secondly, because we are children born of her; this teacheth us to honour our mother, and like little children to hang at her breasts for our sustenance; Suck, and be satisfied with the breasts of her consolations, milk out, and be delighted with the abundance of her glory.

It is the Church that brings forth children to God by the ministry of his word, and if we are children of this mother, we must feed on that milk which flows from her two breasts, the Old and New Testament; As new born babes (saith the Apostle) desire the sincere milk of the Word, that ye may grow thereby, 1 Pet. 2.2. In a word, out of the Church there is no salvation: who have not the Church their mother, cannot have God their Father, was the saying of old; and good reason, for out of the Church there is no means of Salvation, no word to teach, no sacraments to confirm, but all these, and all other means are in the womb of the Church: it is here, and here only, where the spirit of immortal seed begets grace in the heart, and so a man is born again.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/isaac-ambrose.html">Isaac Ambrose</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Prima, the first things, in reference to the middle and last things: or, the doctrine of regeneration, the new birth, the very beginning of a godly life</cite>, (London: Nathanael Webb and William Grantham, 1640), pp 24-25.</span></figcaption>

<blockquote><p>When one asked him concerning marriage, whether it were good to marry; seeing sometimes, when concupiscence pricked him, he was moved to it, and some other time when he felt no such thing, he thought he might abstain from it: He answered, many come hastily into that calling, not vying the means of trying their estate thoroughly before; as namely, whether they by prayer, fasting, and avoiding all occasions of concupiscence, have the gift of chastity or no? Many use some of the means, and not all: many use all the means, but a small time: therefore it is good to use first the means, not part of them, but all of them: not for a while, but long. If so be that all these things will not prevail, attend upon the Lord’s ordinance, and wait when the Lord shall give just occasion of using that estate, to his glory and our comfort.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/richard-greenham.html">Richard Greenham</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Works</cite></span></figcaption>

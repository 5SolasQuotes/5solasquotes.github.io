<blockquote><p>135. Should I proceed to explain to you all or half of the questions about which the sharpest-witted Schoolmen merely dream concerning the knowledge and decrees of God, I would tire myself and the reader to little purpose; such as, An scientia actualis aliorum sit de Essentia Dei? (Is the actual knowledge of other things part of God’s essence?), An Essentia Dei sit Motivum adaequatum ejus scientiae? (Is God’s essence the adequate motive for His knowledge?), An Deus cognoscat creaturas ex seipso, aut ex alio per discursum? (Does God know creatures from Himself, or from something else through reasoning?), An &amp; quomodo scientia Dei possit dividi in plures? (If and how can God’s knowledge be divided into multiple parts?), An &amp; quomodo Deus cognoscat Mala? (If and how does God know evil?), An &amp; quomodo Deus cognoscat negationes &amp; privationes? (If and how does God know negations and privations?), An Deus cognoscat Entia rationis? (Does God know beings of reason?), An habeat in se Entia Rationis? (Does He have beings of reason within Himself?), De scientia Media (On middle knowledge), An scientia Visionis sit causa futurorum? (Is the knowledge of vision the cause of future things?), An futura causa scientiae? (Are future things the cause of knowledge?), An scientia simplicis intelligentiae sit causa futurorum &amp; practica? (Is the knowledge of simple intelligence the cause of future things and practical?), An Deus cognoscat futura compenendo &amp; dividendo? (Does God know the future by composing and dividing?), An Deus cognoscat praesentia eadem indivisibili cognitione, qua ipsa praenovit futura? (Does God know present things with the same indivisible cognition with which He foresaw the future?), An Deus noverit Infinita scientia simplicis intelligentiae? (Does God know infinite things with the knowledge of simple intelligence?), An eadem cognitione se &amp; creaturas cognoscat? (Does He know Himself and creatures with the same cognition?), An existente objecto pro solo imperio Voluntatis Divinae possit non esse in Deo aliquis actus scientiae divino intellectui possibilis? (If an object exists solely by the empire of the Divine Will, is it possible that there is no act of knowledge in God, possible to the Divine intellect?), etc., with a multitude of lesser questions that arise from dealing with these; and with as many more about predestination, God’s decrees or volitions, predetermination, etc. I think your patience has already been sufficiently tested. 136. If you say that by reciting these difficulties, I am only confusing people’s understanding rather than clarifying the matters at hand, I answer: If you get lost in them, I achieve my goal, which is to make you aware of how inappropriate it is that the peace of the Church and the concord and communion among brethren should be based on such a multitude of difficult and unsearchable things—some of which are vain, and others beyond human understanding. Should we call one another by sect names and reproach our brethren as if it were for God’s truth and glory until all these controversies are cleared up for everyone? I, who admit that they are beyond my reach and acknowledge my ignorance of many of them, am still censured by my brethren for being too scholastically curious for merely mentioning or engaging with them; yes, even for deciding cases that can and must be decided. And of all our present ministers, I am confident that not one in fifty (if even one in a hundred) has thoroughly studied them or ever will. Now, if the Church is to have love and concord, how will it be achieved? Of those few (one in a hundred who studied them thoroughly), six men will likely hold three different opinions. And what will the other ninety-nine do who have never studied them? Either they must know what they have never studied and be right where they do not understand what they are saying, or else they must unite by implicit faith. And in whom should that be? In the Church? Which Church is it? Are not many churches of many minds? If in the Papal Church, it has more sense than to decide such controversies, so that their doctors are still almost sectarian, divided to this day. 137. And if anyone dreams that the controversies between Calvinists and Lutherans (or Arminians) and between Dominicans and Jesuits can be resolved for either side without engaging with these questions, that person is too ignorant to be fit to speak confidently on the matter. Let them try to engage in a dispute with any capable adversary, and they will be led to these issues whether they want to or not. 138. But if it is someone so confident in either position that they believe their side or opinions are so great and clear that the contrary positions are unworthy of our tolerance and communion, I must be frank enough to say that they exhibit such ignorance and pride as to make their own fitness for communion much more questionable. For is it not the most odious ignorance for a person not to recognize their own ignorance of so many mysteries that no mortals know? And is it not loathsome pride for people to be so confident in these false notions and arrogate to themselves a knowledge that human existence is incapable of attaining? 139. And I am filled with shame to see that, although there has been some recent turmoil against the Jansenists, all these sects (Dominicans, Jesuits, Scotists, Nominals, etc.) manage to live in communion despite their differences, while Protestants have pursued the same differences with all the bitterness you can find in German historians and theologians (such as Schlusselburgius, Calovius, and many others), in the sad history of the Low Countries, and in Heylin’s Life of Archbishop Laud. You can still hear it in all parties today, in their ignorant censures of one another, using the names of Calvinists and Arminians. And yet, we rightly condemn the Church of Rome for its uncharitable cruelty against dissenters, while in doing so, we condemn ourselves.</p></blockquote>

<blockquote><p>16. God’s providence extensively is occupied concerning all both entities and acts of entities, and intensively is partly effective, partly permissive, partly directive. 17. Works of grace are either preparatory of it [i.e. decrees] or applicatory. 18. Secondary preparatory works of grace [such as infra decrees] can be given; primary ones [such as supra decrees] cannot be given. 19. Secondary preparatory works of grace are the eternal destination of the Mediator, and his temporal mission, and the obedience of the one sent, consisting both in his appearance and in the execution of the threefold office undertaken by him. … 24. Applicatory works of grace are either external or internal. 25. External ones are both calling through the Word partly of law, partly of gospel, and the sealing of those called through sacraments.</p></blockquote>

— Spanheim, Sr., Friedrich, Disputationum Theologicarum Miscellaneorum Pars Prima (d. 1649; Geneva: Chouët, 1652), ‘Miscellaneous Theological Disputation’, trans. AI by Roman Prestarri at Confessionally Reformed Theology Latin">Copy</button><a class="share" href="https://x.com/intent/post?text=%E2%80%9C16.+God%E2%80%99s+providence+extensively+is+occupied+concerning+all+both+entities+and+acts+of+entities%2C+and+intensively+is+partly+effective%2C+partly+permissive%2C+partly+directive.+17.+Works+of+grace+are+either+preparatory+of+it+%5Bi.e.+decrees%5D+or+applicatory.+18.+Secondary+preparatory+works+of+grace+%5Bsuch+as+infra+decrees%5D+can+be+given%3B+primary+ones+%5Bsuch+as+supra+decrees%5D+cannot+be+given.+19.+Secondary+preparatory+works+of+grace+are+the+eternal+destination+of+the+Mediator%2C+and+his+temporal+mission%2C+and+the+obedience+of+the+one+sent%2C+consisting+both+in+his+appearance+and+in+the+execution+of+the+threefold+office+undertaken+by+him.+%E2%80%A6+24.+Applicatory+works+of+grace+are+either+external+or+internal.+25.+External+ones+are+both+calling+through+the+Word+partly+of+law%2C+partly+of+gospel%2C+and+the+sealing+of+those+called+through+sacraments.%E2%80%9D%0A%0A%E2%80%94+Spanheim%2C+Sr.%2C+Friedrich%2C+Disputationum+Theologicarum+Miscellaneorum+Pars+Prima+%28d.+1649%3B+Geneva%3A+Chou%C3%ABt%2C+1652%29%2C+%E2%80%98Miscellaneous+Theological+Disputation%E2%80%99%2C+trans.+AI+by+Roman+Prestarri+at+Confessionally+Reformed+Theology+Latin&amp;url=https%3A%2F%2F5solasquotes.github.io%2Fquote%2Fd88e89822c.html&amp;via=5Solas" target="_blank" rel="noopener">Share on X</a><a class="perma" href="../quote/d88e89822c.html">Permalink</a><a class="src" href="https://reformedbooksonline.com/infralapsarianism-supralapsarianism/#:~:text=16.%20God%E2%80%99s%20providence%20extensively%20is%20occupied,sealing%20of%20those%20called%20through%20sacraments&amp;text=16.%20God%E2%80%99s%20providence%20extensively%20is%20occupied%20concerning%20all&amp;text=and%20the%20sealing%20 </figure><figure class="quote" id="q-a0bf0ad744" data-kw="supralapsarian">

</figure><figure class="quote" id="q-408011b53a" data-kw="">
<blockquote><p>But instead of attending to the true state of the controversy, and instead of referring the decision of it to the divine oracles, tradition and corruption has carried them into the way which this writer pursues, of representing our doctrine to be, that God decrees some men to misery in the same manner that he does others to happiness; yea this slanderer, in imitation of those who have gone before him, sets reprobation foremost, and would have people believe that we hold, God’s first design to be the damnation of multitudes, and then secondly, the irresistible salvation of a number!</p></blockquote>

<main class="wrap"><figure class="quote" id="q-02908a3ee6" data-kw="">
<blockquote><p>First by ‘day’ we are here [in Gen. 1:14, ‘to separate the day from the night’] to understand not the space of the sun, moon, and stars compassing the earth, which is the space of 24 hours; for that ‘day’ consists of an evening and a morning, and comprehends in it one night; and some call it a natural, and some a civil, and some an astronomical day: but here by ‘day’ we are to understand the time while the sun, the greatest light, shines and gives light upon the face of the earth: And by ‘night’ the time while the moon and stars do only appear and give their dim light upon the earth, which some call an artificial and civil day and night, but others do more properly call it a natural day, and a natural night.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/george-walker.html">George Walker</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The History of the Creation as it is Written by Moses in the First &amp; Second Chapters of Genesis: Plainly Opened &amp; Expounded in Several Sermons… (London: Barlet, 1641), Of the Creation of the World</cite>, ch. 9, pp. 138-39</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/creation/the-six-days.html">The Six Days</a></span></div>
<div class="actions"><button class="copy" data-copy="“First by ‘day’ we are here [in Gen. 1:14, ‘to separate the day from the night’] to understand not the space of the sun, moon, and stars compassing the earth, which is the space of 24 hours; for that ‘day’ consists of an evening and a morning, and comprehends in it one night; and some call it a natural, and some a civil, and some an astronomical day: but here by ‘day’ we are to understand the time while the sun, the greatest light, shines and gives light upon the face of the earth: And by ‘night’ the time while the moon and stars do only appear and give their dim light upon the earth, which some call an artificial and civil day and night, but others do more properly call it a natural day, and a natural night.”

— George Walker, The History of the Creation as it is Written by Moses in the First &amp; Second Chapters of Genesis: Plainly Opened &amp; Expounded in Several Sermons… (London: Barlet, 1641), Of the Creation of the World, ch. 9, pp. 138-39">Copy</button><a class="share" href="https://x.com/intent/post?text=%E2%80%9CFirst+by+%E2%80%98day%E2%80%99+we+are+here+%5Bin+Gen.+1%3A14%2C+%E2%80%98to+separate+the+day+from+the+night%E2%80%99%5D+to+understand+not+the+space+of+the+sun%2C+moon%2C+and+stars+compassing+the+earth%2C+which+is+the+space+of+24+hours%3B+for+that+%E2%80%98day%E2%80%99+consists+of+an+evening+and+a+morning%2C+and+comprehends+in+it+one+night%3B+and+some+call+it+a+natural%2C+and+some+a+civil%2C+and+some+an+astronomical+day%3A+but+here+by+%E2%80%98day%E2%80%99+we+are+to+understand+the+time+while+the+sun%2C+the+greatest+light%2C+shines+and+gives+light+upon+the+face+of+the+earth%3A+And+by+%E2%80%98night%E2%80%99+the+time+while+the+moon+and+stars+do+only+appear+and+give+their+dim+light+upon+the+earth%2C+which+some+call+an+artificial+and+civil+day+and+night%2C+but+others+do+more+properly+call+it+a+natural+day%2C+and+a+natural+night.%E2%80%9D%0A%0A%E2%80%94+George+Walker%2C+The+History+of+the+Creation+as+it+is+Written+by+Moses+in+the+First+%26+Second+Chapters+of+Genesis%3A+Plainly+Opened+%26+Expounded+in+Several+Sermons%E2%80%A6+%28London%3A+Barlet%2C+1641%29%2C+Of+the+Creation+of+the+World%2C+ch.+9%2C+pp.+138-39&amp;url=https%3A%2F%2F5solasquotes.github.io%2Fquote%2F02908a3ee6.html&amp;via=5Solas" target="_blank" rel="noopener">Share on X</a><a class="perma" href="../quote/02908a3ee6.html">Permalink</a><a class="src" href="https://reformedbooksonline.com/topics/topics-by-subject/creation/on-westminsters-in-the-space-of-six-days/#:~:text=First%20by%20%E2%80%98day%E2%80%99%20we%20are%20here,natural%20day%2C%20and%20a%20natural%20night&amp;text=First%20by%20%E2%80%98day%E2%80%99%20we%20are%20here%20%5Bin%20Gen&amp;text=it%20a%20natural%20day%2C%20and%20a%20natural%2 </figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-476c984bce" data-kw="">

</figure><figure class="quote" id="q-81ed76e0e9" data-kw="">
<blockquote><p>Some things were created in themselves, others in their causes, such as meteors; animals that arise from the commixture of species, like mules, leopards; and according to some, insects, which are thought, but falsely, to be made from putrefaction. Some things are co-created rather than created, such as accidents and adjuncts in their subjects; universals in their species and individuals; time and place or space, in which creatures are received.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/barthold-holtzfus.html">Barthold Holtzfus</a></span><span class="wk"><span class="lbl">Work:</span> <cite>‘Theological Dissertation on Creation’ (Frankfurt: Steppinus, 1706), trans. AI Latin</cite></span></figcaption>

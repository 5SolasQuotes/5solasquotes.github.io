<main class="wrap"><figure class="quote" id="q-8abe56886e" data-kw="">
<blockquote><p>When we defend precision and the perfect assurance of faith, in spite of every doubt, the papists sarcastically reply that we speak boastfully of our perfect assurance, never of our doubts; the Reformed reply that there is a difference between the legitimacy or usefulness of this assurance and the actual possession of it; that assurance must be distinguished as objective and subjective, and as evident or inherent; that it is one thing that this knowledge be rightfully ours in part, and in desire … and another that it be complete.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/gisbertus-voetius.html">Gisbertus Voetius</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Selectae Disputationes Theologicae</cite>, (1648-69) in Reformed Dogmatics, ed. and trans. John W. Beardslee III (New York: Oxford University Press, 1965), p. 333.</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/assurance-peace-and-joy.html">Assurance, Peace and Joy</a></span></div>

</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-7f1d8ad101" data-kw="">

</figure><figure class="quote" id="q-600f2829ab" data-kw="">
<blockquote><p>Faith and assurance are then still found as it pertains to the root, the ground, the state, and the possession of it, as well as to some of the activities that flow from that possession, but not as it pertains to the outflow and influence of the manifestation and assurance, the emotions, the consolation, the joy and serenity, as it was experienced earlier. …

[T]his assurance of faith is not always present. For it can happen and often does, either as a consequence of impaired judgment or of various temptations and disturbances of the mind, that the one who truly believes and is justified before God by faith nevertheless thinks for a time – in keeping with what he feels – that he does not truly believe and is not reconciled with God.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/gisbertus-voetius-and-johannes-hoornbeeck.html">Gisbertus Voetius and Johannes Hoornbeeck</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Spiritual Desertion</cite>, trans. John Vriend and Harry Boonstra, ed. M. Eugene Osterhaven (1659; Grand Rapids MI: Reformation Heritage Books, 2003), p. 37.</span></figcaption>

</figure><figure class="quote" id="q-a155569413" data-kw="">
<blockquote><p>When we are sure that we are forgiven, then we abhor iniquity; and I suppose that when faith grows into full assurance, so that we are certain beyond a doubt that the blood of Jesus has washed us whiter than snow, it is then that repentance reaches to its greatest height. Repentance grows as faith grows.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/charles-h-spurgeon.html">Charles H. Spurgeon</a></span><span class="wk"><span class="lbl">Work:</span> <cite>All of Grace</cite>, pp. 70–71</span></figcaption>

</figure><figure class="quote" id="q-f773a7b874" data-kw="">
<blockquote><p>Since we have been delivered from our misery by grace alone through Christ, without any merit of our own, why must we yet do good works? Because Christ, having redeemed us by his blood, also renews us by his Holy Spirit to be his image, so that with our whole life we may show ourselves thankful to God for his benefits, and he may be praised by us. Further, that we ourselves may be assured of our faith by its fruits, and that by our godly walk of life we may win our neighbours for Christ.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/zacharias-ursinus-caspar-olevianus.html">Zacharias Ursinus &amp; Caspar Olevianus</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Heidelberg Catechism</cite>, Q&amp;A 86</span></figcaption>

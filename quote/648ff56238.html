<main class="wrap"><figure class="quote" id="q-648ff56238" data-kw="">
<blockquote><p>And whence, I pray you, cometh shame in men after an offence committed? Or why should men, by natural instinct, put a difference between virtue and vice, good and evil, if there were not a God, who, because he loved the one, and hated the other, hath written that difference in every man’s heart?

Therefore conclude, that every man’s knowledge, conscience, and feeling, is instead of a thousand witnesses to convince him, whosoever he be, that there is a God which is to be feared, which hateth iniquity and wicked ways, and which in time of trouble and deep distress is to be sought unto for refuge and relief, as the acts of the very heathen themselves do plainly demonstrate.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/henry-smith.html">Henry Smith</a></span><span class="wk"><span class="lbl">Work:</span> <cite>God’s Arrow Against Atheism and Irreligion</cite>, (1593) in The Works of Henry Smith; Including Sermons, Treatises, Prayers, and Poems, ed. Thomas Fuller (2 vols, Edinburgh: James Nichol, 1866), 2: 368.</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/worship.html">Worship</a></span></div>

<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/gilbert-rule.html">Gilbert Rule</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Good Old Way Defended</cite>, … (Edinburgh: 1697), sect. 10 Rule was a Scottish, divine-right presbyterian., pp. 258-59</span></figcaption>

</figure><figure class="quote" id="q-c920bd6d5a" data-kw="">
<blockquote><p>…the spiritual worship of the inward man, and [that is] the very ground and foundation of all true worship of God: for God is a spirit and therfore must be worshipped in spirit [Jn. 4:24], that is, in the the mind, conscience, will, and affections. Indeed all the worship of God is spiritual, even that which we call outward; yet not of itself, but by virtue of the inward, from which it proceeds. The heads of inward worship are two: adoration of God and cleaving to God… The second virtue of adoration is inward obedience of the hidden man of the heart. The Lord prefers this obedience before all sacrifice, 1 Sam. 15:22… Now we cleave unto God by four things: by faith, hope, love and inward invocation… we are to lift up our hearts unto God, upon every occasion, that by inward and holy motions and affections they may be (as it were) knit unto Him. Now to conclude this point touching inward worship, we must remember that it alone is properly, simply, and of itself the worship of God; and the outward is not simply the worship of God, but only so far forth as it is quickened by the inward, and grounded upon it. For God is a Spirit, and therefore the true worship that is done unto Him must be performed in spirit and truth, Jn. 4:24.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/william-perkins.html">William Perkins</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Whole Treatise of the Cases of Conscience</cite>, … (Cambridge: Legat, 1606), bk. 2, ch. 5, question 2, “How God is to be Worshipped &amp; Served?”, pp. 256-57, 259-60, 262</span></figcaption>

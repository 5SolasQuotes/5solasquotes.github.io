<main class="wrap"><figure class="quote" id="q-77a05bc9a3" data-kw="">
<blockquote><p>Fifthly, we do not with Helvidius oppugne the perpetual virginity of the blessed Virgin, nor in all respects equal marriage with virginity; nor was he to be condemned, if in regard of merit of eternal life, he equaled marriage with virginity.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/matthew-sutcliffe.html">Matthew Sutcliffe</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Subversion of Robert Parson’s</cite>, [a Romanist] his Confused and Worthless Work… (London, 1606), ch. 11, p. 88. Sutcliffe (1550? – 1629) was a reformed, Anglican clergyman, academic and lawyer.</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/rome/mary-and-the-saints.html">Rome: Mary and the Saints</a></span></div>

</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-3e46fbc951" data-kw="">
<blockquote><p>The first trial of the faith of the new converts was the definition of the dogma of the Immaculate Conception, in 1852, when a doctrine was declared to be the universal ancient tradition of the Church, on which eminent divines had notoriously held different opinions, so much so, that this diversity had been accounted for by Bishop Milner and other controversialists by the assertion that neither Scripture nor tradition contained anything on the subject.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/george-salmon.html">George Salmon</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Infallibility of the Church</cite>, Lecture II</span></figcaption>

</figure><figure class="quote" id="q-df4a33cf85" data-kw="">
<blockquote><p>CHRIST IS TRUE MAN, HAVING REAL FLESH. We also believe and teach that the eternal Son of the eternal God was made the Son of man, from the seed of Abraham and David, not from the coitus [union] of a man, as the Ebionites [a sect from the Early Church] said, but was most chastely conceived by the Holy Spirit and born of the ever virgin Mary, as the evangelical history carefully explains to us (Matt., ch. 1). And Paul says: “he took not on him the nature of angels, but of the seed of Abraham.” Also the apostle John says that whoever does not believe that Jesus Christ has come in the flesh, is not of God. Therefore, the flesh of Christ was neither imaginary nor brought from heaven, as Valentinus and Marcion wrongly imagined.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/affirmation-of.html">Second Helvetic Confession</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Second Helvetic Confession</cite>, (1562-66) &amp; the Church of Scotland (1566) | Ch. 11, ‘Of Jesus Christ, True God and Man, the Only Savior of the World’</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/rome/mary-and-the-saints.html">Rome: Mary and the Saints</a></span></div>

</figure><figure class="quote" id="q-a94e564bfc" data-kw="Mary Queen of Heaven King">
<blockquote><p>We acknowledge the Blessed virgin to be the most excellent member of this spouse; and that, in this sense, she reigns with Christ, and with all the faithful. But that Christ administers his kingdom through her, as through the Queen of heaven, or that he has constituted her to have Dominion over all creatures with Royal power, since this is not proved from scripture; but is only fashioned by the most audacious men, she will never receive it; … nor can we defer it to her.</p></blockquote>

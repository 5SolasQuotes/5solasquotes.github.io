<main class="wrap"><figure class="quote" id="q-a41aa0d3bf" data-kw="">
<blockquote><p>Rusticus the prefect said, ‘What kind of doctrines do you profess?’ Justin said, ‘I have endeavoured to learn all doctrines; but I have acquiesced at last in the true doctrines, those namely of the Christians, even though they do not please those who hold false opinions.’ Rusticus the prefect said, ‘Are those the doctrines that please you, you utterly wretched man?’ Justin said, ‘Yes, since I adhere to them with right dogma.’ Rusticus the prefect said, ‘What is the dogma?’ Justin said: ‘That according to which we worship the God of the Christians, whom we reckon to be one from the beginning, the maker and fashioner of the whole creation, visible and invisible; and the Lord Jesus Christ, the Son of God, who had also been preached beforehand by the prophets as about to be present with the race of men, the herald of salvation and teacher of good disciples.&#x27;</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/justin-martyr.html">Justin Martyr</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Martyrdom of the Holy Martyrs</cite>, ch. 1 in ANF 1.305</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/the-church/creeds-confessions-and-councils.html">Creeds, Confessions and Councils</a></span></div>

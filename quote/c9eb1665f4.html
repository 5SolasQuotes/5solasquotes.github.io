<blockquote><p>This opinion is the way to Arminian liberty of conscience, that men in a Christian commonwealth may be of any religion, and the magistrate is to behold men as an indifferent spectator, not caring what religion they be of, whether they be Papists, Jews, Pagans, Anabaptists, Socinians, Macedonians, etc. which should infer that the magistrate were no nurse-father of the true Church, nor yet a preserver of religion, if men might be of any religion…</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/samuel-rutherford.html">Samuel Rutherford</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Due Right of Presbyteries, ‘Acts 15, A Pattern of a Juridicial Synod’</cite>, (1644), pt. 2 | Appendix, p. 355</span></figcaption>

</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-18fd5445ae" data-kw="">
<blockquote><p>Must so many efforts be used to force from us [French protestants] that French heart that God and birth has given us? What have we done to merit so many misfortunes and such severe punishments? We are hunted, we are drove up and down as if we were the plagues of the Republic; We are treated as the enemies of the Christian name. In places where the Jews are tolerated, they have all manner of liberty, they exercise arts and merchandise; they are physicians, they are consulted, the health and life of Christians is put into their hands: And as for us, as if we were infected, we are forbidden to approach children that come into the world, we are banished from the bars and faculties, we are removed from the king’s person, we are banished from societies, our charges are taken from us, we are forbidden the use of all means that might secure us from being famished; we are abandoned to the hatred of the people, we are deprived of that precious liberty that we had purchased by so many services; our children are taken from us, who are a part of ourselves; we are made to lead a languishing life, in lowness, in poverty, and often in dark prisons. Formerly, when declarations were made against us, they were at most contented with registering them in the rolls. They are at present fixed up, they are cried about the streets as if they were gazettes, to inspire the people with a spirit of fury against us. And they have been so successful that in the great cities of France we expect to have our throats cut, one time or another, by a popular sedition; so that we are very near the Inquisition. Can it be said that there is liberty of conscience in a kingdom where the people are banished, lose their honor, and their goods are confiscated for religion’s sake? There needs nothing more than fire; and that terrible tribunal of the Inquisition, which France has been hitherto so much afraid of, will be established there. Are we Turks, are we infidels? We believe in Jesus Christ, we believe him the eternal Son of God, we invoke him solely; and we have no idols. We have a sovereign respect for the sacred Scriptures, we believe there is a Heaven and a Hell, the maxims of our morality are of so great a purity, that they dare not contradict them. We have a respect for kings, we are good subjects, good citizens, faithful in commerce: Let us be tried according to law, and it will appear if we have been engaged in any conspiracy against the State, and if we have any ways failed in our duty. Thanks be to God, nothing can stagger our fidelity, and the stock of love we have for our prince is not to be drained: if it depended on our enemies, we should be enemies of the State we make a part of; they design to push us on to crimes, that the king may have a just occasion of ruining us; but they have hitherto missed their aim, and are like to do so still; the king may see it, whilst that they so successfully turn the effects of his goodness from us, there is not one of us but who is ready to lose his life for his sake; we are Frenchmen as well as we are Reformed Christians; we would shed to the very last drop of the blood of our veins to serve our king, and for the preserving our religion, even to death.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/pierre-jurieu.html">Pierre Jurieu</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Policy of the Clergy of France, to destroy the Protestants of that Kingdom</cite>, ... (London: Bentley, 1681), 2nd Conference, pp. 100-103</span></figcaption>

<blockquote><p>In the religion of the Mahumetans I find much good, viz. a confession of one only God, and most of the natural parts of religion; a vehement opposition to all idolatry; a testimony to the veracity of Moses, and of Christ; that Christ is the Word of God, and a great prophet, and the writings of the apostles true: All this therefore where Christianity is approved, must be embraced. And there is no doubt but God has made use of Mahumet as a great scourge to the idolaters of the world; as well as to the Christians who had abused their sacred privileges and blessings: Wherever his religion does prevail, he casts down images, and fills men’s minds with a hatred of idols, and all conceit of multitude of Gods, and brings men to worship one God alone, and does that by the sword in this, which the preaching of the Gospel had not done in many obstinate nations of idolaters.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/richard-baxter.html">Richard Baxter</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Reasons of the Christian Religion</cite>, pp. 202-3</span></figcaption>

<blockquote><p>earthly votes commend the divine faith, and Christ, destitute of his own virtue, is argued against, while ambition is reconciled to his name. The Church terrifies by exiles and prisons, and forces belief in itself, which was believed by exiles and prisons: it depends on the dignity of those who communicate, by which it is consecrated by the terror of those who persecute; it puts to flight priests, by which it was propagated by the priests who were put to flight: it loves itself, it boasts of the world (let the Jesuit note this and remember the argument of the first chapter of his famous pamphlet) by which Christ could not be, unless the world had hated him.</p></blockquote>

<blockquote><p>“46. Now there remains to speak somewhat particularly of Jews and heretics: for this kind of men are suffered almost in all cities, provinces and kingdoms, and they dwell together with Christians. Why the Jews should be suffered, Augustine among others brings certain reasons. He, Of the City of God, bk. 4, ch. 18, as also upon the 58th psalm and in other places, writes that therefore they be suffered because they before other men had the promise of salvation; neither are they past all hope, seeing that some of them many times, although few in number, do return unto Christ. ‘Blindness’ (says Paul unto the Romans) ‘fell partly upon Israel’ (Rom. 11:25): as though he would say not upon all. And to this the same apostle adds, ‘When the fulness of the gentiles is come in, then all Israel shall be saved.’ (Rom. 11:25-26) And lest peradventure thou shouldest think that these words are spoken allegorically, Paul writes them as a mystery. And to prove his saying he brings the prophecy of Isaiah the prophet, to wit, that ‘the iniquity shall be then taken away from Jacob.’ Furthermore, they be now called ‘enemies unto God for our sakes, but friends in respect of their fathers.’ The same Augustine, in his Questions upon the Gospel, bk. 2 and question 33 (if those be Augustine’s books) when he interprets the parable of the prodigal son, he says that that son does betoken the gentiles. For it is written, that he departed into a far country (Lk. 15:11); because the ethnics were so far departed from God as they worshipped idols publicly and in open profession. But the elder son, under whom is shadowed the Hebrew people, went not so far off. And although he were not within his father’s house, which is the church, yet nevertheless he abode in the field. For the Jews are occupied in the holy scriptures, which they understand not rightly, nor with such spiritual sense as the church of Christ does know them; but take them in an earthly and carnal manner, whereby not unaptly they be said to have their abode in the field. This elder son does not at the beginning enter into his father’s house, but in the latter days he shall also be called and come.

47. The same father also for the proof of this doctrine brings that which is written in the 59th psalm, as he reads it, ‘Do not kill them, lest they forget thy law, but scatter them in thy power.’ (v. 12) The Son of God (says he) prays unto the Father that the same nation might not be destroyed, but that it might wander every where in the world. Other provinces, when they were overcome of the Romans, followed the laws and rites of the Romans, so that at length they became Romans: but the Hebrews, notwithstanding they were overcome by the Romans, yet would they never yield unto their laws, rites and ceremonies. They still observe their own as much as they may; and being dispersed, they wander abroad. Neither have they utterly forgotten the law of God; not that the godly apply themselves to observe it, but do only read it and keep certain rites and ceremonies, whereby they are discerned from other nations. Verily it seems that God has put a sign upon them as He did upon Cain for killing his brother Abel, namely, that every man should not kill them. (Gen. 4:15) Neither is this scattering of them abroad in the world unprofitable unto the Christians, because (as it is written to the Romans) they are showed unto us as broken boughs. (Rom. 11:17) And for so much as we were grafted in their place, when as we see that they were so miserably cut off, we acknowledge the grace of God towards us: and by beholding of them be taught to take heed that for our infidelity’s sake, for the which they were broken off, we also be not cut off in like manner. Moreover, there is another commodity which comes unto us by the dispersing of them. Because our books are saved by them; I mean the holy Bible, which they carry everywhere about them and read it. And although because they be blinded they believe not, yet they confess that those writings are most true. Indeed they be in heart our deadly enemies; but yet by these books, which they have and reverence, they are a testimony to our religion. Wherefore I cannot marvel sufficiently at those which do so much hate the Jewish tongue and Bibles in Hebrew, as they desire to have them destroyed and burnt, seeing Augustine, On Christian Doctrine, thinks, that wheresoever we doubt of the Greek or Latin translation, we must flee unto the truth of the Hebrew. And Jerome in many places writes the same.

48. But they say that the holy books were abused and corrupted by the Hebrews. To this Jerome upon Isaiah, the sixth chapter, towards the end, answers thus: Either they did this before the coming of Christ and the preaching of the apostles, or else afterward. If a man will say that it was done of them before, then, seeing Christ and his apostles reprehended the most grievous wicked acts of the Jews, I marvel why they would say nothing of that sacrilege and so detestable a wicked act. Undoubtedly they would have reproved them for marring and corrupting of the scriptures. But if thou wilt affirm that the faults were brought in by them afterward: then will I say that it had behooved them to corrupt those places chiefly which do testify of Christ and of his religion; and which were alleged by the Lord Himself and his apostles in the New Testament. But those places remain sound; and the very same sentences which they cited do remain still in the Hebrew Bibles: for they were not so greatly careful for the words, and it is not likely, that they in other places have corrupted the holy scriptures. Yea, if a man diligently read over their books, he shall find in them a great many more testimonies, and those more plain and manifest, than our common translation has. Do they not read in the second psalm, ‘Kiss the son’: which our men have translated, ‘Take ye hold of discipline?’ Which words undoubtedly are referred unto Christ. But I do not mean at this present to bring all such like testimonies: it is sufficient if I prove with Jerome that the books of holy scriptures are not corrupted by the Hebrews. The which surely, if they would have done, yet had they missed of their purpose. For many of the most ancient books are found, and that in written hand, which have been kept a very long time by the Christians, which never came in their hands to abuse.

49. But let us return to discourse of that commodity, which Augustine has declared; There be very many (says he) which would peradventure think that the things which we affirm to be done of the ancient people and of the prophets were but vain and imagined by us, unless they saw the Jews yet alive, who with their books maintain that which we profess, whether they will or no. For although the Hebrews be blinded in their heart, and be against us with as much power as they can, yet we have themselves, together with their books, most evident testimonies of our religion. And doubtless, among all testimonies, that testimony is of greatest account, which is testified by the enemies. And of this kind of witnesses God has provided great store for his Church: for we not only have the Hebrew books to make on our side, but also the verses of the Sibyls, which were born in sundry countries. Neither must it be thought, that those verses were invented by our forefathers themselves: for in the time of Lactantius, Eusebius of Caesaria and Augustine, which alleged those verses, the books of the Sibyls were rife in every man’s hand. So as, if they had added any counterfeit verses unto them, the ethnics, which were then many in number and were full of eloquence, and deadly enemies unto our religion, would have reproved them as vain and lying. What then remains but that God would wonderfully defend his Church even by the testimonies of his adversaries? Now then, the Jews are tolerated among the Christians, partly for the promise’s sake, which they have of salvation to be given to their kindred, and partly because of the commodities, which I have now recited out of Augustine. Wherefore they be not only borne withal, but they have also synagogues where they openly read the books of the holy scripture and one with another do call upon the God of their fathers. In which thing nevertheless, the diligence of magistrates and bishops is to be required, who ought to provide that they do nothing else there, and by all means to beware that in their public prayers, exhortations and sermons they do not curse nor rail upon Christ our God. And this, if our magistrates and bishops do not look unto, they cannot escape a just accusation. But it is not lawful to grant unto the Turks any religious assemblies, for that they have not any particular promise of their salvation: neither would they read there either the Old Testament or the New, but only their most detestable Al Koran. Over this, the Jews should be prohibited to exercise false bargaining and usury among Christians, thereby to vex and afflict the poor Christians before our face: the which cannot be done without great indignity. But our princes exact a good, great tribute of them; and of those gains which come by usury and naughty bargaining, they obtain great prey: so far are they from forbidding them these evil arts. Furthermore (a thing no less hurtful), they provide not to have them taught, when as they ought to compel them to come often to godly Christian sermons: otherwise, while they be so negligently left, they become daily worse and worse. Whereby, either naughty fruit or in a manner none at all can be looked for by the conversation which they have among Christians. It must also be looked diligently to that they corrupt not Christians in seducing them to their Jewish religion. By reason of neglecting hereof, the heresy of the Marrans has much increased, specially in Spain. Moreover, it is meet that they may by some apparel or certain token be known from Christians, lest any unwittingly should be familiar with them no less than with the Christians. And these things shall suffice concerning this sort of infidels.</p></blockquote>

+from+God+as+they+worshipped+idols+publicly+and+in+open+profession.+But+the+elder+son%2C+under+whom+is+shadowed+the+Hebrew+people%2C+went+not+so+far+off.+And+although+he+were+not+within+his+father%E2%80%99s+house%2C+which+is+the+church%2C+yet+nevertheless+he+abode+in+the+field.+For+the+Jews+are+occupied+in+the+holy+scriptures%2C+which+they+understand+not+rightly%2C+nor+with+such+spiritual+sense+as+the+church+of+Christ+does+know+them%3B+but+take+them+in+an+earthly+and+carnal+manner%2C+whereby+not+unaptly+they+be+said+to+have+their+abode+in+the+field.+This+elder+son+does+not+at+the+beginning+enter+into+his+father%E2%80%99s+house%2C+but+in+the+latter+days+he+shall+also+be+called+and+come.+47.+The+same+father+also+for+the+proof+of+this+doctrine+brings+that+which+is+written+in+the+59th+psalm%2C+as+he+reads+it%2C+%E2%80%98Do+not+kill+them%2C+lest+they+forget+thy+law%2C+but+scatter+them+in+thy+power.%E2%80%99+%28v.+12%29+The+Son+of+God+%28says+he%29+prays+unto+the+Father+that+the+same+nation+might+not+be+destroyed%2C+but+that+it+might+wander+every+where+in+the+world.+Other+provinces%2C+when+they+were+overcome+of+the+Romans%2C+followed+the+laws+and+rites+of+the+Romans%2C+so+that+at+length+they+became+Romans%3A+but+the+Hebrews%2C+notwithstanding+they+were+overcome+by+the+Romans%2C+yet+would+they+never+yield+unto+their+laws%2C+rites+and+ceremonies.+They+still+observe+their+own+as+much+as+they+may%3B+and+being+dispersed%2C+they+wander+abroad.+Neither+have+they+utterly+forgotten+the+law+of+God%3B+not+that+the+godly+apply+themselves+to+observe+it%2C+but+do+only+read+it+and+keep+certain+rites+and+ceremonies%2C+whereby+they+are+discerned+from+other+nations.+Verily+it+seems+that+God+has+put+a+sign+upon+them+as+He+did+upon+Cain+for+killing+his+brother+Abel%2C+namely%2C+that+every+man+should+not+kill+them.+%28Gen.+4%3A15%29+Neither+is+this+scattering+of+them+abroad+in+the+world+unprofitable+unto+the+Christians%2C+because+%28as+it+is+written+to+the+Romans%29+they+are+showed+unto+us+as Lord+Himself+and+his+apostles+in+the+New+Testament.+But+those+places+remain+sound%3B+and+the+very+same+sentences+which+they+cited+do+remain+still+in+the+Hebrew+Bibles%3A+for+they+were+not+so+greatly+careful+for+the+words%2C+and+it+is+not+likely%2C+that+they+in+other+places+have+corrupted+the+holy+scriptures.+Yea%2C+if+a+man+diligently+read+over+their+books%2C+he+shall+find+in+them+a+great+many+more+testimonies%2C+and+those+more+plain+and+manifest%2C+than+our+common+translation+has.+Do+they+not+read+in+the+second+psalm%2C+%E2%80%98Kiss+the+son%E2%80%99%3A+which+our+men+have+translated%2C+%E2%80%98Take+ye+hold+of+discipline%3F%E2%80%99+Which+words+undoubtedly+are+referred+unto+Christ.+But+I+do+not+mean+at+this+present+to+bring+all+such+like+testimonies%3A+it+is+sufficient+if+I+prove+with+Jerome+that+the+books+of+holy+scriptures+are+not+corrupted+by+the+Hebrews.+The+which+surely%2C+if+they+would+have+done%2C+yet+had+they+missed+of+their+purpose.+For+many+of+the+most+ancient+books+are+found%2C+and+that+in+written+hand%2C+which+have+been+kept+a+very+long+time+by+the+Christians%2C+which+never+came+in+their+hands+to+abuse.+49.+But+let+us+return+to+discourse+of+that+commodity%2C+which+Augustine+has+declared%3B+There+be+very+many+%28says+he%29+which+would+peradventure+think+that+the+things+which+we+affirm+to+be+done+of+the+ancient+people+and+of+the+prophets+were+but+vain+and+imagined+by+us%2C+unless+they+saw+the+Jews+yet+alive%2C+who+with+their+books+maintain+that+which+we+profess%2C+whether+they+will+or+no.+For+although+the+Hebrews+be+blinded+in+their+heart%2C+and+be+against+us+with+as+much+power+as+they+can%2C+yet+we+have+themselves%2C+together+with+their+books%2C+most+evident+testimonies+of+our+religion.+And+doubtless%2C+among+all+testimonies%2C+that+testimony+is+of+greatest+account%2C+which+is+testified+by+the+enemies.+And+of+this+kind+of+witnesses+God+has+provided+great+store+for+his+Church%3A+for+we+not+only+have+the+Hebrew+books+to+make+on+our+side%2C+but+also+the+verses+of+the+Sibyls%2C+which+were+born+in+sundry+countries.+Neither+must+it+be+thought%2C+that+those+verses+were+invented+by+our+forefathers+themselves%3A+for+in+the+time+of+Lactantius%2C+Eusebius+of+Caesaria+and+Augustine%2C+which+alleged+those+verses%2C+the+books+of+the+Sibyls+were+rife+in+every+man%E2%80%99s+hand.+So+as%2C+if+they+had+added+any+counterfeit+verses+unto+them%2C+the+ethnics%2C+which+were+then+many+in+number+and+were+full+of+eloquence%2C+and+deadly+enemies+unto+our+religion%2C+would+have+reproved+them+as+vain+and+lying.+What+then+remains+but+that+God+would+wonderfully+defend+his+Church+even+by+the+testimonies+of+his+adversaries%3F+Now+then%2C+the+Jews+are+tolerated+among+the+Christians%2C+partly+for+the+promise%E2%80%99s+sake%2C+which+they+have+of+salvation+to+be+given+to+their+kindred%2C+and+partly+because+of+the+commodities%2C+which+I+have+now+recited+out+of+Augustine.+Wherefore+they+be+not+only+borne+withal%2C+but+they+have+also+synagogues+where+they+openly+read+the+books+of+the+holy+scripture+and+one+with+another+do+call+upon+the+God+of+their+fathers.+In+which+thing+nevertheless%2C+the+diligence+of+magistrates+and+bishops+is+to+be+required%2C+who+ought+to+provide+that+they+do+nothing+else+there%2C+and+by+all+means+to+beware+that+in+their+public+prayers%2C+exhortations+and+sermons+they+do+not+curse+nor+rail+upon+Christ+our+God.+And+this%2C+if+our+magistrates+and+bishops+do+not+look+unto%2C+they+cannot+escape+a+just+accusation.+But+it+is+not+lawful+to+grant+unto+the+Turks+any+religious+assemblies%2C+for+that+they+have+not+any+particular+promise+of+their+salvation%3A+neither+would+they+read+there+either+the+Old+Testament+or+the+New%2C+but+only+their+most+detestable+Al+Koran.+Over+this%2C+the+Jews+should+be+prohibited+to+exercise+false+bargaining+and+usury+among+Christians%2C+thereby+to+vex+and+afflict+the+poor+Christians+before+our+face%3A+the+which+cannot+be+done+without+great+indignity.+But+our+princes+exact+a+good%2C+great+tribute+of+them%3B+and+of+those+gains+which+come+by+usury+and+naughty+bargaining%2C+they+obtain+great+prey%3A+so+far+are+they+from+forbidding+them+these+evil+arts.+Furthermore+%28a+thing+no+less+hurtful%29%2C+they+provide+not+to+have+them+taught%2C+when+as+they+ought+to+compel+them+to+come+often+to+godly+Christian+sermons%3A+otherwise%2C+while+they+be+so+negligently+left%2C+they+become+daily+worse+and+worse.+Whereby%2C+either+naughty+fruit+or+in+a+manner+none+at+all+can+be+looked+for+by+the+conversation+which+they+have+among+Christians.+It+must+also+be+looked+diligently+to+that+they+corrupt+not+Christians+in+seducing+them+to+their+Jewish+religion.+By+reason+of+neglecting+hereof%2C+the+heresy+of+the+Marrans+has+much+increased%2C+specially+in+Spain.+Moreover%2C+it+is+meet+that+they+may+by+some+apparel+or+certain+token+be+known+from+Christians%2C+lest+any+unwittingly+should+be+familiar+with+them+no+less+than+with+the+Christians.+And+these+things+shall+suffice+concerning+this+sort+of+infidels.%E2%80%9D%0A%0A%E2%80%94+Peter+Martyr+Vermigli%2C+Common+Places%2C+II.2.26%2C+%E2%80%A6+%28d.+1562%3B+London%3A+Henrie+Denham+et+al.%2C+1583%29%2C+pt.+2%2C+ch.+4%2C+%E2%80%98The+First+Precept%2C+where+is+entreated+of+Idolatry%2C+and+sundry+kinds+of+Idols%E2%80%99%2C+%E2%80%98Of+the+Suffering+of+Jews+%26+Heretics%E2%80%99%2C+pp.+328-30&amp;url=https%3A%2F%2F5solasquotes.github.io%2Fquote%2F9401c9b669.html&amp;via=5Solas" target="_blank" rel="noopener">Share on X</a><a class="perma" href="../quote/9401c9b669.html">Permalink</a><a class="src" href="https://reformedbooksonline.com/topics/judaism#:~:text=46.%20Now%20there%20remains%20to%20speak,suffice%20concerning%20this%20sort%20of%20infidels&amp;text=46.%20Now%20there%20remains%20to%20speak%20somewhat%20particularly&amp;text=things%20shall%20suffice%20concerning%20this%20sort%20of%20infidels" rel="noopener" target="_blank">Read it online · Reformed Books Online</a></div>

<blockquote><p>Concerning your determination about the effect of baptism (unless there were great necessity of defending yourself), I would not advise you to set that foot controversy on foot. Though it be the opinion of Antiquity, and to me appears more probable than the contrary, yet at this time when the Arminians draw so close one to another, it is not convenient to be at open controversies amonst ourselves.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/john-davenant.html">John Davenant</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Letter to Samuel Ward in Morris Fuller, The Life, Letters &amp; Writings of John Davenant</cite>, ... (London, 1897), p. 329</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/baptism/subjects-of-baptism.html">Subjects of Baptism</a></span></div>

</figure><figure class="quote" id="q-0d115b7eac" data-kw="">
<blockquote><p>The third [sort of Anabaptists, after the two from the Early Church] broached theirs in the year 1525, which was this, (3) that baptism ought to be administred to none, but such as can give a good account of their faith; and in case any have been baptized in their infancy, that they ought to be re-baptized after they come to years of discretion, before they are to be admitted to the church of Christ. … For the third sort of Anabaptists, they have sunk deeper in the former quagmire… For they not only nullify all baptism administered either by Romish priests, or orthodox Protestants, but condemn [the] baptizing of children simply, which neither the first nor the second sort of Anabaptists [in the Early Church] did; for both the Novatians and Donatists, yea, and Pelagians too, though they denied original sin, yet they all allowed and practised the baptism of infants. The author of this third and worst sect of Anabaptists, was, as some say Muncerus; as others, Balthasar Pacimontanus, against whom Zwingli wrote; as others, Carolstadius; but I subscribe to Melancthou, who lived in those times… And he affirms, as I said before, that Nicholas Stock was the first that broached Anabaptism in Germany. This Stock affirmed, that God spake to him by an angel, and revealed his will to him in dreams, promising him the place of the angel Gabriel: in this man’s school was Thomas Muncer bred…</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/daniel-featley.html">Daniel Featley</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Dippers Dipped, or, the Anabaptists Ducked &amp; Plunged</cite>, … (London, 1645), pp. 25 &amp; 27</span></figcaption>

</figure><figure class="quote" id="q-6a7a05c505" data-kw="">
<blockquote><p>The most probable explanation [of 1 Cor. 15:29] is, that the apostle here refers to the Levitical rule of Numbers 19:14-19. Were there no resurrection, a corpse would be like any other clod; and there would be no reason for treating it as a symbol of moral defilement, or for bestowing on it so religiously the rites of sepulture.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/robert-l-dabney.html">Robert L. Dabney</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Systematic Theology</cite>, p. 760</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/baptism/subjects-of-baptism.html">Subjects of Baptism</a></span></div>

</figure><figure class="quote" id="q-47557be10b" data-kw="">
<blockquote><p>15. But when and in what sort and degree Christ gives the actual operations of the Spirit to all covenanted infants, it is wonderful hard for us to know. But this much seems clear:

1. That Christ may when he please work on the soul of an infant to change its disposition, before he come to the use of reason.

2. That Christ and his Spirit as in Covenant with infants, are ready to give all necessary assistance to infants for their inherent sanctification in the use of those means, and on those further conditions, on which we must wait for it and expect it. For the Holy Ghost is not so engaged to us in our Covenant or baptism, as to be obliged presently to give us all the grace that we want; but only to give it us on certain further conditions, and in the use of certain means. … In that also they are by Covenant and their parents promise, engaged to use those means which Christ has appointed for sanctification.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/richard-baxter.html">Richard Baxter</a></span><span class="wk"><span class="lbl">Work:</span> <cite>A Christian Directory, or a Sum of Practical Theology</cite>, ... (London: 1673) | Question 42, ‘But the great question is, How the Holy Ghost is given to infants in baptism?…’, p. 819</span></figcaption>

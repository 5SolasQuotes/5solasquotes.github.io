<main class="wrap"><figure class="quote" id="q-b5fa971209" data-kw="">
<blockquote><p>How many ways is the name of God taken in the Scriptures?

Two ways: properly for the substance, essence, and nature: and improperly. Now it is taken properly, or for the essence, when it is taken without the distinction of any one of the persons, as Joh. 4.24. God is a spirit, where God is taken for the whole essence of the Deity, as is also the name Jehovah.

Or else, personally, when there is joined unto the name of God the name of the person: as God the Father, God the Son, God the holy Ghost. Or when the Father is opposed to the Son, who is very God, and the second Person in the Trinity, as Rom. 7.25. I thank God by Jesus Christ. So Rom. 8.3 the Father is called God, the word Father being used personally, because the Person sending is opposed to the Person sent.

Improperly, when it is attributed to Angels or men: and truly, either in regard of their office, or else in respect of the revealing of the will of God, and of their reverence: falsely, either by error; or else by usurpation and custom, as 1. Cor. 8.5. or else by worshipping them. 2. Cor. 4.4. Phil. 3.19.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/guillaume-bucanus.html">Guillaume Bucanus</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Institutions of Christian religion framed out of God’s word, and the writings of the best divines, methodically handled by questions and answers, fit for all such as desire to know, or practise the will of God</cite>, trans. Robert Hill (London: George Snowdon and Leonell Snowdon, 1606), p. 5.</span></figcaption>

<blockquote><p>2. If this pure and vital act be considered with reference to God’s own essence, they cannot be distinguished, because God’s essence is a pure act. The self-same divine essence is both the act, and object in these immanent actions, which do not pass out of God towards, and therefore have no relation at all to, or denomination from, any external object. God does know and will all things within Himself naturally, and necessarily; it’s his nature to love Himself; here is no distinction imaginable.</p></blockquote>

</figure><figure class="quote" id="q-d3c4cc2eb6" data-kw="">
<blockquote><p>By the Godhead is meant the divine nature. A person in the Godhead, is the Godhead distinguished by personal properties. The Godhead is one only in number: But the persons in the Godhead are three; and they are the Father, the Son, and the Holy Ghost … Jesus Christ is the second of these persons, namely, the Son. And the Father is true God: the Son is true God: and the Holy Ghost is true God. Yet they are not three Gods, but one God …

Howbeit, the Godhead neither is, nor can be divided into parts: but each of the three persons hath the one whole indivisible Godhead. They are not then of a like substance only, but the very same in substance. But they are distinguished by their personal properties. And it is the personal property of the Father, to beget the Son … And it is the personal property of the Son, to be begotten of the Father … And it is the personal property of the Holy Ghost, to proceed from the Father and the Son … The Son and the Holy Ghost are not below the Father, but equal with him: They are all equally powerful and glorious. So the personal properties make no inequality among them; forasmuch as these properties are not temporary and accidental, but eternal and necessary, and could not but be: and every one of the three persons, is the eternal, the supreme, the most high God.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/thomas-boston.html">Thomas Boston</a></span><span class="wk"><span class="lbl">Work:</span> <cite>A Brief Explication of the First Part of the Assembly’s Shorter Catechism</cite>, (1727) in The Works of Thomas Boston, ed. Samuel McMillan (12 vols, London, 1853), vii, 15-16.</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/the-trinity.html">The Trinity</a></span></div>

</figure><figure class="quote" id="q-059b4916c5" data-kw="essence persons">
<blockquote><p>We assert that the essence is one in the three persons, not as a whole in parts, since each person possesses the entire essence. Nor is it like a genus in species, as the persons are not species but individuals. Nor is it like a species in individuals, as the essence itself is singular in number and cannot be divided into multiple essences. Rather, the whole essence is present in each person in a peculiar manner that we cannot fully express with words or comprehend with thought.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/pierre-du-moulin.html">Pierre Du Moulin</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Other citations (work not named)</cite>, On the Trinity, Thesis XII</span></figcaption>

<main class="wrap"><figure class="quote" id="q-e0097125d6" data-kw="">
<blockquote><p>For if the inheritance be of the law, it is no more of promise: but God gave it to Abraham by promise.’ If it was ‘by Promise,’ then it was ‘by faith,’ for faith only receives the Promise; if it was by the Law, then it was by works, for works only fulfil the Law. True, the Law was afterwards added to the Promise, but not to disannul or to supersede it; on the contrary, it was itself a dispensation of the covenant of grace, for it was proclaimed in the name of the ‘God of Abraham, and Isaac, and Jacob;’ and if it republished in all their rigour the original terms of the covenant of works, it was only ‘because of transgressions, till the seed should come to whom the Promise was made.’ It was for conviction of sin, for ‘the Law worketh wrath,’ and is a ‘ministration of death;’ but, as such, it was ‘our schoolmaster to bring us unto Christ, that we might be justified by faith.’</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/james-buchanan.html">James Buchanan</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Doctrine of Justification: An Outline of Its History in the Church and of Its Exposition from Scripture</cite>, (Edinburgh: T&amp;T Clark, 1867), 52–53.</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/the-law-of-god.html">The Law of God</a></span></div>

<blockquote><p>Hieronymus Zanchius (Operum, Tom. iv. lib. i. c. 11), Maintains at large, and by several arguments, that we Christians have nothing to do with the moral precepts, as they were given to the Israelites by Moses; but only in so far as they agree with the law of nature, common to all nations, and confirmed by Christ, whom we acknowledge to be our king.</p></blockquote>

</figure><figure class="quote" id="q-1e5b3da6f1" data-kw="">
<blockquote><p>At Sinai the covenant became a truly national covenant. The civil life of Israel was linked up with the covenant in such a say that the two could not be separated. In a large measure Church and Sate became one. To be in the Church was to be in the nation, and vice versa; and to leave the Chuch was to leave the nation. There was no spiritual excommunication; the ban meant cutting off by death. The Sinaitic covenant included a service that contained a positive reminder of the strict demands of the covenant of works. The law was placed very much in the foreground, giving prominence once more to the earlier legal element. But the covenant of Sinai was not a renewal of the covenant of works; in it the law was made subservient to the covenant of grace. This is indicated already in the introduction to the ten commandments, Ex. 20:2; Deut. 5:6, and further in Rom. 3:20; Gal. 3:24. It is true that at Sinai a conditional element was added to the covenant, but it was not the salvation of the Israelite but his theocratic standing in the nation, and the enjoyment of external blessings that was made dependent on the keeping of the law, Deut. 28:1-14. The law served a twofold purpose in connection with the covenant of grace: (1) to increase the consciousness of sin, Rom. 3:20; 4:15; Gal. 3:19; and (2) to be a tutor unto Christ, Gal. 3:24.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/louis-berkhof.html">Louis Berkhof</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Systematic Theology</cite>, 4th edn, 298 (emphasis added).</span></figcaption>

<blockquote><p>It is asked, eighth, whether the covenant of grace was promulgated in the Decalogue. The famous Cameron, because he did not distinguish carefully enough between the use of the Decalogue and its nature, stated that the Decalogue was neither the covenant of works nor the covenant of grace, but a certain subservient covenant, insofar as like a pedagogue, it drove the elect to seek Christ (Gal. 3:24; Rom. 10:4–5). The celebrated Cocceius with his followers, since he stated that by its violation the covenant of works was plainly abolished, nor did anything remain except the eternal and universal testament of grace until the Israelites’ making of the calf, after which the Decalogue, with the adding of the twofold formula, “Do this and you will live,” and “Cursed be the one who will not remain in all things which are written in the book of the law,” accepted not indeed the essence of the covenant of works, but yet the appearance of it, stated that the Decalogue is the pure, unadulterated covenant of grace. On the contrary, the rest of the Reformed state that in the Decalogue there is no promulgation of the covenant of grace, but only the renewal of the covenant of works, although that renewal, at least in relation to the elect, had an evangelical use, that it would drive them to embrace Christ. This is so because: (1) the Decalogue has nothing of Christ, nothing of faith in Christ. (2) Even if it did set forth Christ and faith in Christ, which yet we do not grant, yet it still has in addition all moral good works; accordingly we would not be justified by faith alone, because without any doubt we are justified by the observance of the covenant of grace. (3) The Decalogue has all those things (with only the positive commandment excepted, concerning not eating the forbidden fruit) which God stipulated from our first parents in the covenant of works. (4) It is also sanctioned with threats and promises, in the same way as the covenant of works. Therefore nothing prohibits saying that it properly presents the covenant of works again, although in relation to the elect, for an evangelical end and use. Nor is it any hindrance that in it mention is made of that formula which pertains to the covenant of grace, “I am your God,” because entirely nothing is repugnant to urging obedience to the covenant of works by arguments and motives taken from the benefits of the covenant of grace. But we will set aside this argument for its proper place, concerning the dispensation of the covenant of grace under Moses (bk. 8, ch. 2).</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/peter-van-mastricht.html">Peter van Mastricht</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Theoretical-Practical Theology: Redemption in Christ</cite>, vol. 4, trans. Todd Rester (Reformation Heritage Books, 2023), 45–46.</span></figcaption>

<blockquote><p>5. The moral law doth forever bind all, as well justified persons as others, to the obedience thereof; and that, not only in regard of the matter contained in it, but also in respect of the authority of God the Creator, who gave it. Neither doth Christ, in the gospel, any way dissolve, but much strengthen this obligation. 6. Although true believers be not under the law, as a covenant of works, to be thereby justified, or condemned; yet is it of great use to them, as well as to others; in that, as a rule of life informing them of the will of God, and their duty, it directs and binds them to walk accordingly; discovering also the sinful pollutions of their nature, hearts, and lives; so as, examining themselves thereby, they may come to further conviction of, humiliation for, and hatred against sin, together with a clearer sight of the need they have of Christ, and the perfection of his obedience. It is likewise of use to the regenerate, to restrain their corruptions, in that it forbids sin: and the threatenings of it serve to show what even their sins deserve; and what afflictions, in this life, they may expect for them, although freed from the curse thereof threatened in the law. The promises of it, in like manner, show them God’s approbation of obedience, and what blessings they may expect upon the performance thereof: although not as due to them by the law as a covenant of works. So as, a man’s doing good, and refraining from evil, because the law encourageth to the one, and deterreth from the other, is no evidence of his being under the law; and, not under grace. 7. Neither are the forementioned uses of the law contrary to the grace of the gospel, but do sweetly comply with it; the Spirit of Christ subduing and enabling the will of man to do that freely, and cheerfully, which the will of God, revealed in the law, requireth to be done.</p></blockquote>

<div class="actions"><button class="copy" data-copy="“5. The moral law doth forever bind all, as well justified persons as others, to the obedience thereof; and that, not only in regard of the matter contained in it, but also in respect of the authority of God the Creator, who gave it. Neither doth Christ, in the gospel, any way dissolve, but much strengthen this obligation. 6. Although true believers be not under the law, as a covenant of works, to be thereby justified, or condemned; yet is it of great use to them, as well as to others; in that, as a rule of life informing them of the will of God, and their duty, it directs and binds them to walk accordingly; discovering also the sinful pollutions of their nature, hearts, and lives; so as, examining themselves thereby, they may come to further conviction of, humiliation for, and hatred against sin, together with a clearer sight of the need they have of Christ, and the perfection of his obedience. It is likewise of use to the regenerate, to restrain their corruptions, in that it forbids sin: and the threatenings of it serve to show what even their sins deserve; and what afflictions, in this life, they may expect for them, although freed from the curse thereof threatened in the law. The promises of it, in like manner, show them God’s approbation of obedience, and what blessings they may expect upon the performance thereof: although not as due to them by the law as a covenant of works. So as, a man’s doing good, and refraining from evil, because the law encourageth to the one, and deterreth from the other, is no evidence of his being under the law; and, not under grace. 7. Neither are the forementioned uses of the law contrary to the grace of the gospel, but do sweetly comply with it; the Spirit of Christ subduing and enabling the will of man to do that freely, and cheerfully, which the will of God, revealed in the law, requireth to be done.”

— Westminster Confession of Faith, 19.5–7.">Copy</button><a class="share" href="https://x.com/intent/post?text=%E2%80%9C5.+The+moral+law+doth+forever+bind+all%2C+as+well+justified+persons+as+others%2C+to+the+obedience+thereof%3B+and+that%2C+not+only+in+regard+of+the+matter+contained+in+it%2C+but+also+in+respect+of+the+authority+of+God+the+Creator%2C+who+gave+it.+Neither+doth+Christ%2C+in+the+gospel%2C+any+way+dissolve%2C+but+much+strengthen+this+obligation.+6.+Although+true+believers+be+not+under+the+law%2C+as+a+covenant+of+works%2C+to+be+thereby+justified%2C+or+condemned%3B+yet+is+it+of+great+use+to+them%2C+as+well+as+to+others%3B+in+that%2C+as+a+rule+of+life+informing+them+of+the+will+of+God%2C+and+their+duty%2C+it+directs+and+binds+them+to+walk+accordingly%3B+discovering+also+the+sinful+pollutions+of+their+nature%2C+hearts%2C+and+lives%3B+so+as%2C+examining+themselves+thereby%2C+they+may+come+to+further+conviction+of%2C+humiliation+for%2C+and+hatred+against+sin%2C+together+with+a+clearer+sight+of+the+need+they+have+of+Christ%2C+and+the+perfection+of+his+obedience.+It+is+likewise+of+use+to+the+regenerate%2C+to+restrain+their+corruptions%2C+in+that+it+forbids+sin%3A+and+the+threatenings+of+it+serve+to+show+what+even+their+sins+deserve%3B+and+what+afflictions%2C+in+this+life%2C+they+may+expect+for+them%2C+although+freed+from+the+curse+thereof+threatened+in+the+law.+The+promises+of+it%2C+in+like+manner%2C+show+them+God%E2%80%99s+approbation+of+obedience%2C+and+what+blessings+they+may+expect+upon+the+performance+thereof%3A+although+not+as+due+to+them+by+the+law+as+a+covenant+of+works.+So+as%2C+a+man%E2%80%99s+doing+good%2C+and+refraining+from+evil%2C+because+the+law+encourageth+to+the+one%2C+and+deterreth+from+the+other%2C+is+no+evidence+of+his+being+under+the+law%3B+and%2C+not+under+grace.+7.+Neither+are+the+forementioned+uses+of+the+law+contrary+to+the+grace+of+the+gospel%2C+but+do+sweetly+comply+with+it%3B+the+Spirit+of+Christ+subduing+and+enabling+the+will+of+man+

<blockquote><p>That man indeed saw little of the truth and glory of the everlasting covenant who said that “the work and death of Jesus would have been very glorious though no individual of the human race had ever come and reposed living faith in the surety.” How dishonouring to the work of Jesus! How dishonouring to the righteousness of God! To what straits are men reduced when at all hazards they will have it that the death of Jesus was accomplished alike for the saved and the lost!

For if he died for the lost, and yet his death did not secure them from being lost, it must be something else than his death that secured the saved unto salvation. So that if Jesus died for all alike, it is not his death that secures the salvation of any; it only secures, it seems, the possibility of salvation to all! That is the whole fruit of it—and it is this which has tempted to the terrible and blasphemous assertion that “his death would have been a glorious work though none had been saved by it at all.”

That is to say—though he had never earned the name of Jesus, who saves his people from their sins! We have not so learned the covenant or gospel of our salvation. And very clearly our blessed Lord did not so understand the case in which he himself has so glorious an interest. “If ye seek me, let these go their way, that the saying might be fulfilled, Of those whom thou hast given me I have lost none.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/hugh-martin.html">Hugh Martin</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Shadow of Calvary: Gethsemane – The Arrest – The Trial</cite>, (Edinburgh: Lyon &amp; Gemmell, 1875), pp 158-59.</span></figcaption>

<blockquote><p>(4.) In the fourth place, that it is not enough to consider this oneness [between Christ and the elect] as decreed; we must consider it as specially and expressly covenanted: not merely as decreed by the sovereign authority of the Godhead, but covenanted between the eternal Father and the eternal Son.

To trace the oneness between Christ and His people to a Divine decree may honour the Godhead: but does it honour the Trinity in Godhead? On the contrary, it refuses recognition of the Trinity, precisely in that grand manifestation in which the doctrine of the Trinity — the truth of the distinct personalities of the Divine persons — is most especially to be recognised. There is no revelation of the Trinity in Godhead comparable to that which is afforded by the Covenant of Grace.

To “us men, and” in “our salvation,” the doctrine of the Trinity is commended, as at once revealed and precious, as placed in clearest evidence in the distinct actings of the persons of the Godhead in that Divine compact which is the spring and fountainhead of our eternal hopes. And even “to the principalities and powers in heavenly places,” it is probable, “there is made known by the Church” and her covenanted salvation, in the most eminent possible demonstration, the subsistence of three persons in the one Divine Being.

To be satisfied, therefore, with regarding Christ’s oneness with His people as simply decreed and not covenanted, would be a very grave mistake; a mistake for which indeed there can be no excuse, as there can surely be no intelligible temptation. Moreover, it were to pretermit the due recognition of the voluntariness of Christ’s susception and entire accomplishment of the work given Him to do. And still further, it were to overlook the splendid evidence of love as the great originating principle and motive of His redemption. There is a certain aspect of coldness about a mere decree. Practically, in the mind’s view, it comes too closely to be identified, in point of impression, with the idea of cold, dead, impersonal fate. Unitarianism is ever doomed to have this practical outgoing.

It is in Trinity that provision is seen for the vivid warmth of personality and personal love; and especially in the covenant of Trinity for man’s redemption. There are distinct personal actings of the Father, and of the Son, and of the Spirit, in the Covenant. There are distinct actings of the will of the Father, and of the will of the Son in that oneness that is constituted between Christ and His people, and which justifies and bears up all that is achieved for their salvation. And these actings of will are actings of love.

Hear the overflowings of love from Christ’s heart, as His achievements for His people are by Himself referred back upon the loving deed by which the Father made them over to Him to be His own:— “O righteous Father, Thine they were, and Thou gavest them Me, and I have kept them.” He means to say: Therefore, for that reason, have I kept them; even as I would keep that love-gift of Thine, which I did so willingly and lovingly receive.

Identified, by loving covenant between Himself and the Father, with the people given unto Him; truly representing them, because identified in covenanted oneness with them; He becomes their competent and acceptable substitute and surety,—His substitution in every light most justifiable in the eye of law most stringent and of righteousness inexpugnable. And the vindication of His vicarious sacrifice of Himself for their salvation, is set on high in the intelligent and joyful convictions of the poor and needy, beyond the possibility of any sinister and false philosophy endangering it.

While the Divine Head of the Church has, in His great goodness, long kept these views before men’s minds in Scotland, we cannot but cherish a deep sympathy — we would say pity, but that the word might be considered invidious, while no such feeling is in our heart — towards many earnest and noble minds in Germany, evidently inquiring with the greatest ardour after the truth as it is in Jesus Christ, but baffled because the covenant oneness between Redeemer and redeemed has not yet come into their field of vision. It is the doctrine of the Covenant that they need.

No wonder that, in ignorance of this great guiding principle, to a beautiful and so love-worthy spirit as that of [Karl] Ullmann, “substitution” should seem an arbitrary and capricious thing; and that to many others “imputation” should be obnoxious, as a mere make-believe and legal fiction, with which they cannot accredit the God of truth. Moral instinct, the dictates of pious feeling, and Holy Scripture all combine to convince them that “the judgment of God must be according to truth.” That moral axiom — that sacred spiritual postulate — they feel they must at all hazards conserve. And they are right. Any doctrine of Atonement or of justification that should impugn it, is thereby necessarily demonstrated to be false.

But let Christ and His people be federally one, by the sovereign authority and love of the Father, and by the voluntary covenanted acceptation of the Son. In that case, legal fiction, make-believe, arbitrariness and caprice, are at the furthest possible remove from the Divine Covenant transaction of our redemption, — alike from the basis of it, and from all the fruits of it. “Christ bears the sins of many,” because, in His covenanted identification with these “many,” their sins are sinlessly and truly His sins. And unto the same ” many sons and daughters” of the Covenant, the Father imputes the righteousness of the Son, because, in their covenant oneness with the Son, His righteousness is undeservedly but truly their own righteousness. And all throughout, “the judgment of God is according to truth.</p></blockquote>

%2C+and+from+all+the+fruits+of+it.+%E2%80%9CChrist+bears+the+sins+of+many%2C%E2%80%9D+because%2C+in+His+covenanted+identification+with+these+%E2%80%9Cmany%2C%E2%80%9D+their+sins+are+sinlessly+and+truly+His+sins.+And+unto+the+same+%E2%80%9D+many+sons+and+daughters%E2%80%9D+of+the+Covenant%2C+the+Father+imputes+the+righteousness+of+the+Son%2C+because%2C+in+their+covenant+oneness+with+the+Son%2C+His+righteousness+is+undeservedly+but+truly+their+own+righteousness.+And+all+throughout%2C+%E2%80%9Cthe+judgment+of+God+is+according+to+truth.%E2%80%9D%0A%0A%E2%80%94+Hugh+Martin%2C+The+Atonement%3A+In+its+Relations+to+the+Covenant%2C+the+Priesthood%2C+the+Intercession+of+our+Lord%2C+%28London%3A+James+Nisbet+%26+Co.%2C+1870%29%2C+pp+35-39.&amp;url=https%3A%2F%2F5solasquotes.github.io%2Fquote%2F5b7335c993.html&amp;via=5Solas" target="_blank" rel="noopener">Share on X</a><a class="perma" href="../quote/5b7335c993.html">Permalink</a><a class="src" href="https://reformedcovenanter.wordpress.com/2019/05/14/hugh-martin-on-the-trinity-and-the-covenant-of-grace-for-mans-redemption/" rel="noopener" target="_blank">Read it online · Reformed Covenanter</a></div>

<blockquote><p>The first, that it is not the will of God that all men should be saved. …

Of the first S. Augustine disputeth in this manner, That God will not have all men to be saved, it is manifest, forasmuch as our Saviour wrought many works in the unthankful cities, Corazin, Bethsaida, &amp; Capernaum, which he knew would not repent, but he refrained from shewing any such examples in Tire and Sidon, and Gomorrah and Sodom, which if he had done there, Tire and Sidon had repented in sackcloth &amp; ashes, &amp; Sodom had remained until this day. Moreover, saith he, I give thee thanks, o father, lord of heaven &amp; earth, because thou hast hid these things (meaning the mysteries of salvation) from̄ the wise &amp; understanding, &amp; hast opened them to babes, it is so, o father, because thy good will was such. But how then, saith he, shall we answer the objection of S. Paul? …

If God will have all men to be saved, as the apostle writeth, how is it that the greatest part are damned? … his power is greater thē his will, and his will extendeth not it self so far as his power: his will is not to do all that he can, but he can do whatsoever is his will, as the prophet speaketh. Our god is in heaven, and he doth what he listeth. If it be his will to save all, and his power is omnipotent to do what he will, why then are but a remnant saved? Some, saith August. do answer, that the cause is in themselves, as if God will, but they will not, as it is in the gospel, Jerusalem, Jerusalem, which killest the prophets, and stonest thē which are sent to thee, how often would I have gathered thy children together, as the hen gathereth her chickens, but thou wouldst not? … As though the will of God could be crossed by the will of men, and the almighty could be hindered of his purpose by the weakest vessels. how thē was he omnipotent, if he were willing to gather the children of Jerusalem, but did it not?

That text being not understood, would at the first sight seem to import so much, as if the will of God were made frustrate, and of none effect by the will of men, where then were his omnipotency? … Nay, rather Jerusalem in deed, forasmuch as lay in her, would not have her children gathered together, but his will was not frustrate, for as much as he against her will gathered together as many of them as seemed good to his own will and pleasure. And in another place he doeth answer it more fully, where he saith. … For their parts, &amp; as much in as them lay, they did that which God would not have to be done, but if ye consider the omnipotency of God, they could not doo otherways then was his will.

For, in as much as they did contrary to the will of God, in them so doing was fulfilled the will of God. And it is a wonderful mystery to see, that which is against his will, is not otherwise then he hath willed; for but by his sufferance it could not be, neither doth he suffer it against his will, but with his will: neither would God which is good suffer any thing to be done which is evil, unless his omnipotency were such that he could make good of that which is evil. Finally, to this objection out of Saint Paul, (having first disputed antagonisticò) he maketh his own answer dogmatic, and that two manner of ways.

The first is this: … Where it is written, that God willeth all men to be saved, and yet the greatest part of men are not saved, it is so to be understood. God willeth all men to be saved, that is, no man is saved against his will, but whosoever is saved, it is by his will, not as though there were none whom he would not have saved, but that none are saved, unless he will, and they only whom he will, and therefore he is to be prayed unto that he would, because it cannot otherwise be, but they shall be saved if he will, for the Apostle allegeth this as an argument, that we should pray to him for the salvation of all men, because it is by his will that they are saved. … Not as if he would have every one in particular, of all sorts of people to be saved, but of all sorts some to be saved.</p></blockquote>

+be+saved%2C+and+yet+the+greatest+part+of+men+are+not+saved%2C+it+is+so+to+be+understood.+God+willeth+all+men+to+be+saved%2C+that+is%2C+no+man+is+saved+against+his+will%2C+but+whosoever+is+saved%2C+it+is+by+his+will%2C+not+as+though+there+were+none+whom+he+would+not+have+saved%2C+but+that+none+are+saved%2C+unless+he+will%2C+and+they+only+whom+he+will%2C+and+therefore+he+is+to+be+prayed+unto+that+he+would%2C+because+it+cannot+otherwise+be%2C+but+they+shall+be+saved+if+he+will%2C+for+the+Apostle+allegeth+this+as+an+argument%2C+that+we+should+pray+to+him+for+the+salvation+of+all+men%2C+because+it+is+by+his+will+that+they+are+saved.+%E2%80%A6+Not+as+if+he+would+have+every+one+in+particular%2C+of+all+sorts+of+people+to+be+saved%2C+but+of+all+sorts+some+to+be+saved.%E2%80%9D%0A%0A%E2%80%94+John+Dove%2C+A+sermon+preached+at+Paul%E2%80%99s+Cross%2C+the+sixth+of+February.+1596+In+which+are+discussed+these+three+conclusions.+1+It+is+not+the+will+of+God+that+all+men+should+be+saved.+2+The+absolute+will+of+God%2C+and+his+secret+decree+from+all+eternity+is+the+cause+why+some+are+predestined+to+salvation%2C+others+to+d%2C+%28London%3A+R.+Dexter%2C+1597%29%2C+pp+14-19.&amp;url=https%3A%2F%2F5solasquotes.github.io%2Fquote%2F28b166fb3c.html&amp;via=5Solas" target="_blank" rel="noopener">Share on X</a><a class="perma" href="../quote/28b166fb3c.html">Permalink</a><a class="src" href="https://reformedcovenanter.wordpress.com/2019/03/02/john-dove-god-does-not-desire-the-salvation-of-each-and-every-man/" rel="noopener" target="_blank">Read it online · Reformed Covenanter</a></div>

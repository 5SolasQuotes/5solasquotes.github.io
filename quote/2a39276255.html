<main class="wrap"><figure class="quote" id="q-2a39276255" data-kw="">
<blockquote><p>Therefore just as Isaac has the inheritance from his father solely on the basis of the promise and of his birth, without the Law or works, so we are born as heirs by Sarah, the free woman, that is, by the church. She teaches, cherishes, and carries us in her womb, her bosom, and her arms; she shapes and perfects us to the form of Christ, until we grow into perfect manhood (Eph. 4:13). Thus everything happens through the ministry of the Word. It is the duty of a free woman to go on giving birth to children endlessly, that is, to sons who know that they are justified by faith, not by the Law.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/martin-luther.html">Martin Luther</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Luther’s Works</cite>, Vol. 26: Lectures on Galatians, 1535, Chapters 1-4, ed. Jaroslav Jan Pelikan, Hilton C. Oswald, and Helmut T. Lehmann, vol. 26 (Saint Louis: Concordia Publishing House, 1999), 441–42.</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/civil-government-and-society.html">Civil Government and Society</a></span></div>

</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-4626195077" data-kw="">
<blockquote><p>Therefore, in order that none of us may stumble on that stone, let us first consider that there is a twofold government in man (duplex esse in homine regimen): one aspect is spiritual, whereby the conscience is instructed in piety and in reverencing God; the second is political, whereby man is educated for the duties of humanity and citizenship that must be maintained among men. These are usually called the “spiritual” and the “temporal” jurisdiction (not improper terms) by which is meant that the former sort of government pertains to the life of the soul, while the latter has to do with the concerns of the present life—not only with food and clothing but with laying down laws whereby a man may live his life among other men holily, honorably, and temperately. For the former resides in the inner mind, while the latter regulates only outward behavior. The one we may call the spiritual kingdom, the other, the political kingdom. Now these two, as we have divided them, must always be examined separately; and while one is being considered, we must call away and turn aside the mind from thinking about the other. There are in man, so to speak, two worlds, over which different kings and different laws have authority.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/john-calvin.html">John Calvin</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Institutes of the Christian Religion</cite>, (1559 edition), 3.19.15 (Battles edition).</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/civil-government-and-society.html">Civil Government and Society</a></span></div>

</figure><figure class="quote" id="q-e661f7cd8d" data-kw="">
<blockquote><p>2. This [God’s injunction to obey civil magistrates] condemns the clergy of Rome, that exempt themselves from all princes’ authority, whereas God has said, ‘Let every soul be subject to the higher powers’ [Rom. 13:1]: If they have souls they must be subject. But how do they exempt themselves? … 2. By the Donation of Constantine; but its not in the power of princes so to do: They [princes] may exempt them [clergy] from tribute [taxes], if they will, as Pharoah took not the priests’ lands to gage for Corn; but to exempt them from subjection: they cannot. This were to make themselves wiser then God, who has put them under their authority, yea, the too much indulgence and favor of emperors, has been the bane of the Church, and helped up the Pope into his stirrup; Therefore its wisdom in them to hold their authority which God has given them.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/john-rogers.html">John Rogers</a></span><span class="wk"><span class="lbl">Work:</span> <cite>A Godly and Fruitful Exposition upon all the First Epistle of Peter</cite>, (d. 1636; 1650) | On 1 Pet. 2:13, pp. 318-19</span></figcaption>

<blockquote><p>…and the soul of Christ, from the first moment of its infusion, was a subject capable of a fulness of grace, as unto its habitual residence and in-being, though the actual exercise of it was suspended for a while, until the organs of the body were fitted for it. This, therefore, it received by this first unction of the Spirit. Hence, from his conception, he was “holy,” as well as “harmless” and “undefiled,” Heb. 7:26; a “holy thing,” Luke 1:35; radically filled with a perfection of grace and wisdom, inasmuch as the Father “gave Him not the Spirit by measure,” John 3:34.</p></blockquote>

<blockquote><p>Sept, 17, 1585 Lyttis of the deacons [servants] elected. Henry Nesbet and William Nesbet, bailies, Nicoll Uddert, Dean of Guild, James Ros, Thesaurer [Treasurer], William Littill, Androw Sclater, George Smyth, Tailor [Jailor?], of the Council, and Jhonn Stevinsoun, deykin [deacon/servant?] of the weavers, remembering that since the beginning of this present pestilence they have remained within this burgh constantly, sustained the burdening of the offices laid upon them unto this hour, with the loss and death for the most part of diverse of their children, servants, and family, and not without the extreme danger of their own lives, most eminently known unto all men, the rest of their brethren of the council and deykins [deacons/servants], which were no less astricted, oblist [obliged], and sworn to assist and take care of this commonwealth, having deserted their places and forsaken their offices, contrary to their oaths and allegiance made and given, and yet continuing has not repaired to this burgh at this most necessary time, approached and appointed to convene and surrogate others in their room, whereby the whole estate of this burgh is appearing to fall in confusion; Therefore…</p></blockquote>

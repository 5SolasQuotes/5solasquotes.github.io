<blockquote><p>1. Separation from the true Church, and Christian society of the faithful, is a remarkable evil.

2. The schism or apostasy of others should not weaken us in following any good mean of edification, but rather stir us up unto more diligence, lest by negligence we fall piece and piece back after their example.</p></blockquote>

<blockquote><p>22. The heretic is not to be confused with the schismatic: nor is every schismatic to be counted among the number of heretics. For although heretics often become schismatics, and conversely schismatics often become heretics, nevertheless the heretic and the schismatic differ. For first, heretics, corrupting the sincerity of faith with false doctrines, do not always separate themselves from the Church: but schismatics, sometimes even retaining the purity of faith without the stain of heresy, break the bond of brotherly society out of ambition for honor or some function in which they do not want another to be preferred over them, or out of hatred and impatience of divine order and ecclesiastical discipline, or under the pretext of scandals which are committed everywhere.

23. Heretics properly strike against the truth of the doctrines of faith, as heretics: but schismatics against charity, as schismatics:

24. Those who at the same time stumble in the truth of faith and charity, and obstinately defending the error of faith separate themselves from the Church of God, they are at the same time heretics and schismatics.

25. Very often it happens in practice that some orthodox individuals think differently from others, without strife or schism: as Jerome and Augustine.

26. Schismatics either separate themselves entirely from the Church, or in part also from this or that Church in the name of particular offenses.</p></blockquote>

="../quote/ba65bcb55a.html">Permalink</a><a class="src" href="https://reformedbooksonline.com/that-union-in-at-least-christianitys-fundamentals-is-obliging/#:~:text=22.%20The%20heretic%20is%20not%20to,in%20the%20name%20of%20particular%20offenses&amp;text=22.%20The%20heretic%20is%20not%20to%20be%20confused&amp;text=that%20Church%20in%20the%20name%20of%20particular%20offenses" rel="noopener" target="_blank">Read it online · Reformed Books Online</a></div>
</figure><figure class="quote" id="q-f9a52d7cf2" data-kw="">
<blockquote><p>Were we all bound together by a confession or subscription of the true fundamentals, and those other points that are next to fundamentals only, and there took up our Christianity and unity, yielding each other a freedom of differing in smaller or more difficult points, or in expressing ourselves in different terms, and so did live peaceably and lovingly together, notwithstanding such differences, as men that all knew the mysteriousness of Divinity, and the imperfection of their own understandings, and that here we know but in part [1 Cor. 13], and therefore shall most certainly err and differ in part: what a world of mischiefs might this course prevent?</p></blockquote>

</figure><figure class="quote" id="q-8bce28ac69" data-kw="">
<blockquote><p>§7. Differing opinions or practices about things indifferent, no nor about the mere integrals of religion [those things which complete religion and make it whole], which are not essentials, do not make men of different religions or Churches (universally considered). (Rom. 14 &amp; 15; Gal. 2:13-15; Phil. 3:16-17) §8. Nothing will warrant us to separate from a church as no church, but the want [lack] of something essential to a church. §9. The essential or constitutive parts of the Church-catholic (or universal) are Christ the Head and all Christians as the members. (Eph. 1:22 &amp; 4:15; Col. 1:18 &amp; 2:19; 1 Cor. 12:27; Eph. 4:12 &amp; 5:23; Mt. 28:19; 1 Cor. 5) … §13. He that does not nullify or unchurch a church, may lawfully remove from one church to another, and make choice of the best and purest, or that which is most suited to his own edification, if he be a free-man. §14. But in case of such choice or personal removal, the interest of the whole Church, or of religion in common, must be first taken into consideration by him that would rightly judge of the lawfulness of the fact. (Rom. 9:3; 1 Cor. 12:25-26) §15. If a Church which in all other respects is purest and best, will impose any sin upon all that will have local communion with it, though we must not separate from that Church as no Church, yet must we not commit that sin, but patiently suffer them to exclude us from their communion. (Rom. 3:8) §16. True heresy (that is, an error contradictory to an essential article of the Christian Faith) if it be seriously and really held, so that the contrary truth is not held seriously and really, does nullify the Christianity of him that holds it, and the Church-state of that congregation which so professes it. But so does not that fundamental error which is held but in words through ignorance, thinking it may consist with the contrary truth, while that truth is not denied, but held majore fide [with greater faith]; so that we have reason to believe that if they did discern the contradiction, they would rather forsake the error than the truth. (Tit. 3:10; 2 Jn. 10; Heb. 5:11-12; 1 Cor. 15:1-2, etc. Lk. 18:34; Jn. 12:16; Gal. 5:2 &amp; 1:7-9 &amp; 3:1-2; In isto factiosissimo soeculo, vix quisquam eximie doctus haereseos suspicione carebat. [In that most partisan age, scarcely anyone who was exceptionally learned was free from suspicion of heresy.] Erasmus in The Life of Jerome. Et profecto ita est, ut id habendum sit antiquissimum et Deo proximum, quod sit optimum. [And indeed it is so: that which is best must be regarded as both the most ancient and the closest to God.] Cicero, Of Laws, bk. 2, p. 244)</p></blockquote>

ianity+of+him+that+holds+it%2C+and+the+Church-state+of+that+congregation+which+so+professes+it.+But+so+does+not+that+fundamental+error+which+is+held+but+in+words+through+ignorance%2C+thinking+it+may+consist+with+the+contrary+truth%2C+while+that+truth+is+not+denied%2C+but+held+majore+fide+%5Bwith+greater+faith%5D%3B+so+that+we+have+reason+to+believe+that+if+they+did+discern+the+contradiction%2C+they+would+rather+forsake+the+error+than+the+truth.+%28Tit.+3%3A10%3B+2+Jn.+10%3B+Heb.+5%3A11-12%3B+1+Cor.+15%3A1-2%2C+etc.+Lk.+18%3A34%3B+Jn.+12%3A16%3B+Gal.+5%3A2+%26+1%3A7-9+%26+3%3A1-2%3B+In+isto+factiosissimo+soeculo%2C+vix+quisquam+eximie+doctus+haereseos+suspicione+carebat.+%5BIn+that+most+partisan+age%2C+scarcely+anyone+who+was+exceptionally+learned+was+free+from+suspicion+of+heresy.%5D+Erasmus+in+The+Life+of+Jerome.+Et+profecto+ita+est%2C+ut+id+habendum+sit+antiquissimum+et+Deo+proximum%2C+quod+sit+optimum.+%5BAnd+indeed+it+is+so%3A+that+which+is+best+must+be+regarded+as+both+the+most+ancient+and+the+closest+to+God.%5D+Cicero%2C+Of+Laws%2C+bk.+2%2C+p.+244%29%E2%80%9D%0A%0A%E2%80%94+Richard+Baxter%2C+The+Reasons+of+the+Christian+Religion%2C+the+First+Part...+%28London%3A+White%2C+1667%29%2C+pt.+2%2C+ch.+13%2C+pp.+465-66&amp;url=https%3A%2F%2F5solasquotes.github.io%2Fquote%2F8bce28ac69.html&amp;via=5Solas" target="_blank" rel="noopener">Share on X</a><a class="perma" href="../quote/8bce28ac69.html">Permalink</a><a class="src" href="https://reformedbooksonline.com/that-union-in-at-least-christianitys-fundamentals-is-obliging/#:~:text=7.%20Differing%20opinions%20or%20practices%20about,Of%20Laws%2C%20bk.%202%2C%20p.%20244&amp;text=7.%20Differing%20opinions%20or%20practices%20about%20things%20indifferent&amp;text=God.%5D%20Cicero%2C%20Of%20Laws%2C%20bk.%202%2C%20p.%20244" rel="noopener" target="_blank">Read it online · Reformed Books Online</a></div>

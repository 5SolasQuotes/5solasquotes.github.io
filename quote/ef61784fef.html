<main class="wrap"><figure class="quote" id="q-ef61784fef" data-kw="">
<blockquote><p>Yea to kill a man is physically indifferent, for that is physically, yea morally, without relation to any law indifferent, which is capable of lawfulness or unlawfulness, according as it shall be commanded of, or forbidden by God. But for a man to kill his son, is of itself such, certain, if God command a judge to kill his son, it is lawful for the father to kill his son, if the Lord forbid Abraham to kill his son, it is unlawful for Abraham to kill his son.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/samuel-rutherford.html">Samuel Rutherford</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Divine Right of Church Government… (1646), Appendix</cite>, p. 86</span></figcaption>

</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-dd7252cd57" data-kw="">
<blockquote><p>XVI. Second, the necessity of the case makes many things lawful which otherwise would not be lawful, in domestic affairs as well as in politics. If the doorkeeper of a house is overcome by a lethargy or by apoplexy, he cannot prevent the entrance of thieves, even though it is lawful for any servant to take the keys and to close the gates against them. If he to whom the care of supporting a family is committed denies bread to his children, who would say that it is not lawful for anyone of the domestics to supply them with bread if he can so that they may not perish with hunger? If the father himself rages for the destruction of his children, should not his arms be wrested from him, his children removed and entrusted to a guardian, not waiting for the judgment of a magistrate? Nay, a friend and neighbor can take this upon himself until the public authority has made some provision for them. When a fire is raging, who doubts that it is the duty of all to bring water to extinguish it, especially when they cease to whom this care pertained? Thus in a republic, if the rulers and prefects snore while the enemy approaches; if the gatekeepers open the gates to him; will it not be lawful for any citizen to snatch the keys from the hand of the betrayer in order to shut the gates against the enemy and to call to arms?… When the thing itself calls, what need is there to seek an external call? Nay, if they should cease form a regard to obedience, unmindful of the oath given to their prince, they would be deservedly convicted of perfidy and treachery because here the consciousness of wickedness alone pollutes, from which no one purges himself, unless according to his ability he resists the inrushing evil.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/francis-turretin.html">Francis Turretin</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Institutes ed. Dennison, Jr. (P&amp;R), vol. 3, 18th Topic, Question 23</cite>, p. 220</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/civil-government-and-society/natural-law-and-civil-law.html">Natural Law and Civil Law</a></span></div>

</figure><figure class="quote" id="q-36cd623f61" data-kw="">
<blockquote><p>It has been lately announced that the Synod of Philadelphia… adopted, and proceeded at once to enforce, a doctrine in reference to ecclesiastical proceedings, which appears to some altogether novel, and truly extraordinary. The doctrine is this,—’That no complaint, appeal, or protest, can be admitted by any judicatory, except in judicial cases.’… It never occurred to us, however, as possible, that it [the new doctrine] should receive countenance from gentlemen of experience and reflection… It is of more practical importance to show that the doctrine here assumed, cannot in our opinion, stand the test of a moment’s examination… In the Presbyterian Church in the United States, it is manifest that appeals, complaints and protests, have ever been allowed in all sorts of cases. Whenever a judicatory has decided any question which came before it by a vote, —whether the question were legislative, declarative, executive or strictly judicial—in any and every such case, both theory and practice allow of appeal, complaint and protest, at the pleasure of the party wishing to offer either. …more than thirty years before that time [1821], when the General Assembly was first organized, the following article appears in the system of Rules adopted for the government of that body: ‘Any member who may think himself aggrieved by a decision of the General Assembly, shall have his dissent or protest, with his reasons, entered on the records of the Assembly, or filed among their papers, if given in before the rising of the Assembly.’ … We have been in the constant habit of attending on the judicatories of the church, in all their grades, for more than forty years; and we never knew or heard of an in- dividual who doubted the right of appeal, complaint, and protest, in all sorts of cases… many a time, and on a great variety of occasions, we have participated in protests, etc. in all sorts of cases, without dreaming that any one ever thought of confining the privilege to cases of process only… The archives of the church are better than cursory assertions. Litera scripta manet. Let us, therefore, appeal to public records, which cannot lead us astray. In the year 1826, the General Assembly… determined, by a vote, to postpone fixing the location [of Western Theological Seminary] for another year. Against this decision the Reverend Joshua L. Wilson, of Cincinnati, entered his solemn protest, accompanied with five reasons, which still remain on permanent record. In the very same General Assembly, (of 1826)… Against this decision to receive Mr. B, forty-two members of the Assembly entered their solemn protest, supported by three reasons… In the General Assembly of 1828… In opposition to this act a solemn protest was presented and read, by a minority of the Assembly… Again, in the General Assembly of 1831… Against this decision a formal protest was entered by sixty-seven of the minority. And it is worthy of notice, that among the subscribers to this protest, the following names are found… the Reverend Robert J. Breckinridge… Alexander Boyd, Ashbel Green… At the same General Assembly, (1831)… Against this expression of opinion, a protest was offered, accepted, and recorded, signed by thirty members of the minority… Let us now attend–Secondly, to the dictates of reason on this subject…</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/samuel-miller.html">Samuel Miller</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Biblical Repertory &amp; Theological Review | no. 1, vol. 7 (Jan. 1835), article 5, ‘New Ecclesiastical Law’</cite>, pp. 89-97</span></figcaption>

</figure><figure class="quote" id="q-0dca06a717" data-kw="">
<blockquote><p>Perhaps the very best discussion of the subject now before us…</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/richard-hooker.html">Richard Hooker</a></span><span class="wk"><span class="lbl">Work:</span> <cite>ch. 10, ‘That Neither God’s being the Author of Laws, nor the Committing them to Scripture, nor the Continuance of the End for which they were Instituted, is any Reason Sufficient that they are Unchangeable’ in bk 3 of Ecclesiastical Polity in The Works of that Learned &amp; Judicious Divine, Mr. Richard Hooker (1594; Oxford University Press, 1845), vol. 1, pp. 384-91 | Hooker (1554-1600) was the most foundational and important writer on law and polity for the Anglican Church. His writing needs to be read with discernment as he is an Erastian and is largely arguing that the ecclesiastical form of government in Scripture is not of perpetual rule (contrary to Thomas Cartwright and the puritans). However, he also discusses the positive (non-moral) aspects of the Mosaic civil law, for which the point of his chapter stands. The Free Church of Scotland professor John MacPherson said of Hooker’s chapter, that, on the topic of the expiring of the ceremonial and judicial laws, it was:</cite></span></figcaption>

<div class="actions"><button class="copy" data-copy="“Perhaps the very best discussion of the subject now before us…”

<blockquote><p>Lastly, as ’tis the greatest sin, so it makes men obnoxious to the saddest judgements of God, and severest punishments of the magistrate, when a man shall directly and purposely speak reproachfully of God, denying him in his attributes, or attributing that to Him which is inconsistent with his nature; this is called direct and immediate blasphemy, and if it be acted not out of infirmity of nature, the person not being distempered with sickness, melancholy, or madness; but out of malice, deliberation, and obstinacy; then the party is to die without mercy (Lev. 24:13-16). This was no judicial Law, peculiar only to the Jews, but it being of the Law of Nature, is an Universal Law for all Nations. He, whoever he be that shall directly and obstinately blaspheme the Name of the Lord; shall surely die. Hence wicked Jesabel, that she might stone Naboth to death, proclaims him a blasphemer (1 Kings 21:11, 14). This stoning endured till Christ’s time, as appears by their stoning of Steven (Acts 7). Now if every direct and obstinate blasphemers should be stoned to death in England, what showers of stones would there be in all parts of the land? And if Nebuchadnezzar, a heathen, by the light of Nature could make a decree, that who ever blasphemed the God of Heaven, or spake any thing amiss concerning Him, should be cut in pieces, and his house be made a Dung-hill (Dan. 3:29), how much more ought Christian Magistrates to make severe laws for the punishing of such high offenders; lest as their light and charge is greater, so they suffer double punishment. We see how careful magistrates are to punish thieves and murderers of men; and shall spiritual thieves, who rob God of his honor, deny his being, and since they cannot kill Him yet will smite Him with their tongue, be suffered to go unpunished? We see how tender great men are of their own names, honors, privileges, and lives; if any oppose them, he must die for it, and shall he that abuses and blasphemes the King of Kings, not die the death? Surely, as this is the greatest sin, so it should be punished with some eminent and remarkable punishment. This hellish sin defiles the land, and cannot be purged away, but by the death of the blasphemers. Impunity breeds blasphemy, and all manner of sin (Eccl. 8:11).</p></blockquote>

<main class="wrap"><figure class="quote" id="q-5304def06a" data-kw="">
<blockquote><p>That condition is faith. It is the clearly pronounced doctrine of the Lutheran Church that baptism is altogether useless or void of any saving effect, unless the recipient be a believer. And by faith is not meant mere speculative assent, such as Simon Magus had, but true, living, and saving faith.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/charles-hodge.html">Charles Hodge</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Systematic Theology</cite>, vol. 3, “Condition on which the Efficacy of Baptism is suspended”</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/baptism/efficacy.html">Baptism: Efficacy</a> › <a href="../topics/baptism/efficacy/baptismal-regeneration-vs-baptism-as-sign-and-seal.html">Baptismal regeneration vs baptism as sign and seal</a></span></div>

</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-305c2b20cb" data-kw="">
<blockquote><p>Christ does not retain both members of the first proposition in that which stands in opposition to the promise; he merely says: “He that believeth not, shall be damned.” Christ makes this distinction, because there is not the same necessity for faith and baptism to salvation. Faith is absolutely necessary to salvation, so that no one can be saved without it: for “without faith it is impossible to please God.” (Heb. 11:6.) But the sacraments are necessary when they may be observed according to divine appointment. Contempt of the sacraments under such circumstances, is inconsistent with faith. This is the reason why Christ promises salvation to those that believe and are baptized, keeping in view the distinction which is here made. Yet he does not deny salvation to those who are deprived of this sacrament. … The word extends to all; the sacraments only to such as believe.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/zacharias-ursinus.html">Zacharias Ursinus</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Commentary on the Heidelberg Catechism</cite>, on Mark 16:16 (the necessity of baptism)</span></figcaption>

</figure><figure class="quote" id="q-485a9633bd" data-kw="">
<blockquote><p>Do the sacraments of the New Testament work grace so physically that they effect and contain it ex opere operato, whether faith and devotion are present or not? Or are they rather efficacious signs and seals of grace? The former we deny; the latter we affirm against the Romanists.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/francis-turretin.html">Francis Turretin</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Institutes of Elenctic Theology</cite>, Topic 19, Q. 8, §§ 1–6</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/the-sacraments-in-general/efficacy.html">The Sacraments in General: Efficacy</a> › <a href="../topics/the-sacraments-in-general/efficacy/ex-opere-operato-vs-faith-and-the-spirit.html">Ex opere operato vs faith and the Spirit</a></span><span class="t"><a href="../topics/rome/sacraments.html">Rome: Sacraments</a> › <a href="../topics/rome/sacraments/ex-opere-operato.html">Ex opere operato</a></span></div>

— Francis Turretin, Institutes of Elenctic Theology, Topic 19, Q. 8, §§ 1–6">Copy</button><a class="share" href="https://x.com/intent/post?text=%E2%80%9CDo+the+sacraments+of+the+New+Testament+work+grace+so+physically+that+they+effect+and+contain+it+ex+opere+operato%2C+whether+faith+and+devotion+are+present+or+not%3F+Or+are+they+rather+efficacious+signs+and+seals+of+grace%3F+The+former+we+deny%3B+the+latter+we+affirm+against+the+Romanists.%E2%80%9D%0A%0A%E2%80%94+Francis+Turretin%2C+Institutes+of+Elenctic+Theology%2C+Topic+19%2C+Q.+8%2C+%C2%A7%C2%A7+1%E2%80%936&amp;url=https%3A%2F%2F5solasquotes.github.io%2Fquote%2F485a9633bd.html&amp;via=5Solas" target="_blank" rel="noopener">Share on X</a><a class="perma" href="../quote/485a9633bd.html">Permalink</a><span class="src none">No free online copy linked</span></div>
</figure><figure class="quote" id="q-c75cdbc07a" data-kw="">
<blockquote><p>The grace which is exhibited in or by the sacraments rightly used, is not conferred by any power in them; neither doth the efficacy of a sacrament depend upon the piety or intention of him that doth administer it: but upon the work of the Spirit, and the word of institution, which contains, together with a precept authorizing the use thereof, a promise of benefit to worthy receivers. … Although it be a great sin to contemn or neglect this ordinance, yet grace and salvation are not so inseparably annexed unto it, as that no person can be regenerated, or saved, without it; or, that all that are baptized are undoubtedly regenerated.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/westminster-assembly.html">Westminster Assembly</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Westminster Confession of Faith</cite>, 27.3; 28.5</span></figcaption>

</figure><figure class="quote" id="q-c7037dede4" data-kw="">
<blockquote><p>We have a proof of this in Cornelius the centurion, who, after he had been previously endued with the graces of the Holy Spirit, was baptised for the remission of sins, not seeking a fuller forgiveness from baptism, but a surer exercise of faith; nay, an argument for assurance from a pledge. It will, perhaps, be objected, Why did Ananias say to Paul that he washed away his sins by baptism (Acts 22:16), if sins are not washed away by the power of baptism? I answer, we are said to receive, procure, and obtain, whatever according to the perception of our faith is exhibited to us by the Lord, whether he then attests it for the first time, or gives additional confirmation to what he had previously attested. All then that Ananias meant to say was, Be baptised, Paul, that you may be assured that your sins are forgiven you. In baptism, the Lord promises forgiveness of sins: receive it, and be secure. I have no intention, however, to detract from the power of baptism. I would only add to the sign the substance and reality, inasmuch as God works by external means. …</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/john-calvin.html">John Calvin</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Institutes of the Christian Religion</cite>, 4.15.15</span></figcaption>

<blockquote><p>13. Our indulgence ought to extend much farther in tolerating imperfection of conduct. Here there is great danger of falling, and Satan employs all his machinations to ensnare us. For there always have been persons who, imbued with a false persuasion of absolute holiness, as if they had already become a kind of aerial spirits, spurn the society of all in whom they see that something human still remains. Such of old were the Cathari and the Donatists, who were similarly infatuated Such in the present day are some of the Anabaptists, who would be thought to have made superior progress. Others, again, sin this respect, not so much from that insane pride as from inconsiderate zeal. Seeing that among those to whom the gospel is preached, the fruit produced is not in accordance with the doctrine, they forthwith conclude that there no church exists.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/john-calvin.html">John Calvin</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Institutes of the Christian Religion</cite>, 4.1.13</span></figcaption>

<blockquote><p>VI. It is asked, must theology be taught according to a certain method? As an example of excess, the [medieval] Scholastics, according to their philosophical theology, loved the philosophical method of Aristotle – whether it was his analytic or synthetic method – to the point of distraction.

As an example of deficiency, the Anabaptists, enthusiasts, and fanactics, due to ignorance and hatred of philosophy, reckon that all method should be eliminated from theological matters. One after another of our Reformed theologians, in proving their own points, opposed such persons.

The Reformed, against the Anabaptists and enthusiasts, demand a method, but not, precisely speaking, a philosophical one. They demand a natural method, that is, a method that is suitable for theological matters, and for assisting the judgment and strengthening the memory – however much that method might otherwise depend on the discretion of the writer.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/petrus-van-mastricht.html">Petrus van Mastricht</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Theoretical-Practical Theology Volume 1: Prolegomena</cite>, trans. Todd M. Rester, ed. Joel R. Beeke (1699; Grand Rapids MI: Reformation Heritage Books, 2018), 1.1.1.VI, p. 70.</span></figcaption>

</figure><figure class="quote" id="q-b7c21b431b" data-kw="">
<blockquote><p>But this place hath need of a sound exposition, because of fantastical [fanatical] spirits, which do feign a commonalty or participation together of goods, whereby all policy or civil government is taken away; as in this age the Anabaptists have raged, because they thought there was no Church unless all men’s goods were put and gathered together, as it were, in one heap, that they might all one with another take thereof.

Wherefore, we must in this point beware of two extremes. For many, under colour of policy, do keep close and conceal whatsoever they have; they defraud the poor, and they think that they are twice righteous, so they take away no other men’s goods. Other some are carried into the contrary error, because they would have all things confused. But what doth Luke? Surely he noteth another order, when he saith that there was choice made in the distribution. If any man object that no man had anything which was his own, seeing all things were common, we may easily answer.

For this community or participation together must be restrained unto the circumstance which ensueth immediately; to wit, that the poor might be relieved as every man had need. We know the old proverb, “All things are common amongst friends.” When as the scholars of Pythagoras said thus, they did not deny but that every man might govern his own house privately, neither did they intend to make their own wives common; so this having of things common, whereof Luke speaketh, and which he commendeth, doth not take away household government; which thing shall better appear by the fourth chapter, whereas he nameth two alone which sold their possessions of so many thousands. Whence we gather that which I said even now, that they brought forth and made common their goods in no other respect, save only that they might relieve the present necessity.

And the impudency of the monks was ridiculous, who did profess that they did observe the apostles’ rule, because they call nothing their own; and yet, nevertheless, they neither sell anything, neither yet do they pass for any man’s poverty; but they stuff their idle bellies with the blood of the poor, neither do they regard any other thing in their having of things common, save only that they may be well filled and daintily, although all the whole world be hungry. Wherein, then, are they like to the first disciples, with whom they will be thought to be able to compare?</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/john-calvin.html">John Calvin</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Commentary on the Acts of the Apostles</cite>, ed. Henry Beveridge, trans. Christopher Fetherstone (1560; London, 1585) in Calvin’s Commentaries (22 vols, Grand Rapids: Baker, 1993), 18a: 130-31.</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/anabaptists/infant-baptism.html">Anabaptists: Infant Baptism</a></span></div>

</figure><figure class="quote" id="q-a5062932b0" data-kw="">
<blockquote><p>If some admirer of the sky and the stars – and what can one think of that is more beautiful than these bodies? – wanted to remove water from the nature of things, because it is no match for the brightness of the stars, would we not say that he is mad? If someone, out of admiration for the teachings of religion, ordered us to remove from our lives all laws and precepts of the state and all links of domestic life, would not all sane men judge it necessary for him to be suppressed by force and by the use of weapons?

And in these recent years we have seen some who were practising theology in an unholy way, madmen with fanatical opinions, punished for their errors. For you will remember Müntzer and the Anabaptists and other monsters of that kind. Consider those mad in the same way, who disturb the chorus and the harmony of the arts by neglect of, and contempt for, the lower arts. Therefore, just as when you think of the elements of writing you believe that the entire alphabet is necessary for discourse, so you will consider all the disciplines that are taught in the schools necessary for life.

For only he can have the right feelings about the arts, who, when he has noticed their order, understands that each art has been devised because of its certain usefulness. I have said this to remind young men of it, many of whom we see rushing unrestrainedly towards the higher disciplines, not only to their own detriment, but also to that of the state. For your studies do not concern only you, but also the state.

And you ought to keep in view the purpose of your studies, and decide that they are provided for giving of advice for the state, for teaching in the churches and for upholding the doctrine of religion. You will not be able to excel in any of those without perfect doctrine, and perfect doctrine is not granted to anyone without the lower disciplines.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/caspar-cruciger.html">Caspar Cruciger</a></span><span class="wk"><span class="lbl">Work:</span> <cite>On the Order of Learning (1531) in Orations on Philosophy and Education</cite></span></figcaption>

For only he can have the right feelings about the arts, who, when he has noticed their order, understands that each art has been devised because of its certain usefulness. I have said this to remind young men of it, many of whom we see rushing unrestrainedly towards the higher disciplines, not only to their own detriment, but also to that of the state. For your studies do not concern only you, but also the state.

And you ought to keep in view the purpose of your studies, and decide that they are provided for giving of advice for the state, for teaching in the churches and for upholding the doctrine of religion. You will not be able to excel in any of those without perfect doctrine, and perfect doctrine is not granted to anyone without the lower disciplines.”

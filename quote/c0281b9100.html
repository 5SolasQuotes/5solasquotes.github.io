<main class="wrap"><figure class="quote" id="q-c0281b9100" data-kw="">
<blockquote><p>[E]very good man, and especially a Minister should flee all occasion of vain glory: Yea, Christian modesty, and soberness require, that every man though they were endued with the greatest graces in the world, yet they should speak and think of themselves soberly: the more they have, the greater graces that God hath given them, the less they should account of themselves: yea, suppose they be something in the sight of God, yet looking to the naughtiness that abideth in this cankered nature, they should say of themselves (I am nothing) for the Apostle saith, 1. Cor. 8. 2 &amp; Gal. 6. 3. He that thinketh himself something, he is nothing &amp; Phil. 2. 3. Let every man account another man better than himself.

If a man will meditate on his own estate, either by night or by day, let him think of his infirmities, his sins and naughtiness: will he rejoice of himself in his own mind? look to Paul what he saith. 2. Corin. 12. 9. I will rejoice in mine infirmities, that the power of Jesus may dwell in me. The power of God never dwelt in a proud nor ambitious heart, but in an humble heart: God resisteth the proud, &amp; giveth grace to the humble,1. Pet. 5. 5. So Paul, when he was musing of himself, albeit hee had seen great visions, 2. Cor. 12. he complaineth of his infirmity to the Lord: the Lord answereth, My grace is sufficient for thee, my power is made perfect through weakness. Then thou that wouldst be strong in God, be weak in thy self: think night and day of thine infirmity &amp; misery by sin.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/robert-rollock.html">Robert Rollock</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Certain sermons, upon several texts of Scripture</cite>, eds Henry Charteris and William Arthur (Edinburgh: Andro Hart, 1616), pp 66-67.</span></figcaption>

<blockquote><p>Divine Apostolical Institutions (that we may draw to our purpose) were again of two sorts: First, variable, or temporary, which were such injunctions as were prescribed, either for some special ends, as that law for abstaining from blood, and things strangled, Acts 15:1, for avoiding offence to the Jews, or to some special nations, or persons, as agreeable to the customs of those places and times, as that of women being vailed in the congregations, and some other the like. Secondly, invariable and perpetual: such as concerned the whole Church: This distinction we received from that learned and Professor [John Prideaux, d. 1650];</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/westminster-assembly.html">Westminster Assembly</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Daniel Cawdrey &amp; Herbert Palmer</cite>, Sabbatum Redivivum: or, The Christian Sabbath Vindicated (London, 1645), fourth part, ch. 1, ‘The Lord’s Day is of Divine Institution’, p. 463 Irregular page numbering Westminster divines</span></figcaption>

</figure><figure class="quote" id="q-08bff57bc3" data-kw="">
<blockquote><p>…they [the apostolic Church] practiced all the ordinances directed, though they had no written directory¹ in a formal contexture or frame: for prayers, preaching, praising, sacraments and censures never Church wanted [lacked] in some one order or other, though we cannot say that the apostolic Church had this same very order and form: But a liturgy which is a commanded, imposed, stinted form, in such words and no other, is another thing than a directory, as an unlawful thing is different from a lawful: [¹ While Rutherford is speaking of directories in general, yet this section may have some reference to Westminster’s Directory for the Public Worship of God, as the Church of Scotland had adopted it in 1645, a year before this book of Rutherford’s was published.] 2. There be some things positive-human, as the ordering of some parts, or worship, or prayer, the form of words or phrases, and some things of the circumstantials of the sacrament, as what cups, wood or metal, in these the directory lays a tie upon no man, nor can the Church in this make a directory to be a Church-compulsory to strain men: And this way the directory is not ordered and commanded in the frame and contexture, as was the [Anglican] Service-Book; and the pastor or people in these are not properly moral agents, nor do we press that Scripture should regulate men in these.</p></blockquote>

<blockquote><p>1st Conclusion. To communicate with the Church ordinarily and of set purpose is an act of external Church communion: 1. Because if the preacher in preaching edify the Church convened for that effect to receive edification, and if he convince the infidel by preaching and cause him fall down and worship God, and report that God is in that meeting, then to communicate with the Church in hearing and preaching is an act of external Church communion. Because an act of worship terminated and bounded upon the Church is a Church-act.</p></blockquote>

</figure><figure class="quote" id="q-d3a95cec76" data-kw="">
<blockquote><p>As to the first table, man hath some confused knowledge that there is a God, who is to be worshipped, to be spoken of with reverence and observance; that there is some time to be set apart for his worship. Now what this God is, what is his worship, what time is to be set apart for it, and how it is to be spent, there reason faileth. We have some ways that seem right to us for that; and we are guided either by our own reason, or prescript of time, or education, or example, or custom.

It is our own ways that we turn to, and therefore do not give God the glory that is due to his name: Rom. 1:21, ‘Because that when they knew God, they glorified him not as God, neither were thankful, but became vain in their imaginations, and their foolish heart was darkened.’ They do not glorify him as God. We paint out worship by our own lazy thoughts, or overdo it by some fancies of our own: this is our own way.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/thomas-manton.html">Thomas Manton</a></span><span class="wk"><span class="lbl">Work:</span> <cite>A Practical Exposition upon the Fifty-Third Chapter of Isaiah</cite>, (1703) in The Complete Works of Thomas Manton, D.D. (22 vols, London: James Nisbet &amp; Co., 1871), 3: 310.</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/worship.html">Worship</a></span></div>
<div class="actions"><button class="copy" data-copy="“As to the first table, man hath some confused knowledge that there is a God, who is to be worshipped, to be spoken of with reverence and observance; that there is some time to be set apart for his worship. Now what this God is, what is his worship, what time is to be set apart for it, and how it is to be spent, there reason faileth. We have some ways that seem right to us for that; and we are guided either by our own reason, or prescript of time, or education, or example, or custom.

It is our own ways that we turn to, and therefore do not give God the glory that is due to his name: Rom. 1:21, ‘Because that when they knew God, they glorified him not as God, neither were thankful, but became vain in their imaginations, and their foolish heart was darkened.’ They do not glorify him as God. We paint out worship by our own lazy thoughts, or overdo it by some fancies of our own: this is our own way.”

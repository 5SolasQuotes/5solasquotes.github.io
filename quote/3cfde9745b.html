<blockquote><p>2. If this pure and vital act be considered with reference to God’s own essence, they cannot be distinguished, because God’s essence is a pure act. The self-same divine essence is both the act, and object in these immanent actions, which do not pass out of God towards, and therefore have no relation at all to, or denomination from, any external object. God does know and will all things within Himself naturally, and necessarily; it’s his nature to love Himself; here is no distinction imaginable.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/francis-cheynell.html">Francis Cheynell</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Divine Trinunity of the Father, Son &amp; Holy Spirit</cite>, … (London, 1650), pp. 128-9</span></figcaption>

</figure><figure class="quote" id="q-f824daeec8" data-kw="">
<blockquote><p>The will of God as to the peculiar actings on the Father in this matter [the eternal Trinitarian covenant] is the will of the Father, and the will of God with regard unto the peculiar acts of the Son is the will of the Son; not by a distinction of sundry wills, but by the distinct application of the same will unto its distinct acts in the persons of the Father and the Son. And in this respect the covenant whereof we treat differs from a pure decree; for from these distinct actions of the will of God in the Father and the Son there does arise a new habitude or relation which is not natural or necessary unto them, but freely taken on them.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/john-owen.html">John Owen</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Commentary on Hebrews</cite></span></figcaption>

</figure><figure class="quote" id="q-2b0abe45b9" data-kw="">
<blockquote><p>Every cause is a principle of some sort. So one must first explain the notion of principle so that the notion of cause may be understood. A principle is defined as that from which something in some way proceeds. That which proceeds is called the ‘principiate’, or what has been ‘principled’. Between principle and principled there must be some connection. If this connection is merely external and without any inflowing of the principle to the principled, the principle is better referred to as a ‘beginning’. If, on the other hand, the connection is internal and consists in a positive inflowing of one to the other, the first is properly called a principle. Dawn is the principle of a day in the sense of beginning, and likewise the point in respect of a line. Parents with respect to their children, on the contrary, are properly called principles. The positive inflowing between principle and principled can be either logical or real. An inflowing is logical if the principle is the reason that the principled is known. In this way the premises of a syllogism are principles with respect to the conclusion (of science). The inflowing is real or ontological if the principle gives being to the principled.¹ ¹ Among philosophers an ontological principle is the same as a cause. Theologians however distinguish between a principle that is a cause and one that is not a cause. A principle that is not a cause communicates its own proper being such that the nature of the giver and of the receiver is numerically the same. Thus in the Sacred Trinity the Father is the principle of the Son but is not the cause of the Son. A principle is called a cause only if it communicates an existence or being-ness that is numerically distinct from itself. A cause is defined as a principle that, by its positive inflowing, determines the existence of something else…</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/allan-b-wolter.html">Allan B. Wolter</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Little Summary of Metaphysics</cite>, (Milwaukee: Bruce Publishing Co., 1958), ch. 4, p. 38</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/the-trinity/the-persons.html">The Persons</a></span></div>

<blockquote><p>Among all the works of God those things rightly hold the first place, which concern the glory of His creation. For neither is it permitted, that we should consider concerning those works which are of the Father toward the Son, of the Son toward the Father, of both toward the Holy Spirit, of the Holy Spirit toward both, which are neither scrutable, nor necessary to be known: but it is abundantly sufficient, if the creature should acknowledge, look up unto and glorify the work of its creator as creator, propagator, conservator, reparator, governor and consummator.</p></blockquote>

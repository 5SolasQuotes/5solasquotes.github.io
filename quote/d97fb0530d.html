<blockquote><p>Whoever commits even the smallest sins is guilty of all; and whoever commits some other greater and more vituperative, is also guilty of all. One is to a greater extent and the other to a lesser extent; but both are guilty of all, so that in the diversity of sins one need only ask about the more and the less.</p></blockquote>

<blockquote><p>…original sin consists in this, that it opposes the same law as to the inclination or habitude. Consequently this inbred propensity or habit of inordinate concupiscence, which makes man prone to transgress the law of God, is Original Sin. …he who has within him a defect, habit, or propensity contrary to the law of original creation is infected by Original Sin… …we must understand that the word concupiscence sometimes denotes the mere faculty of desire… we grant that it is a good creature of God. Sometimes it denotes the contagion or unruly tendency, which has infected the faculty itself; and this disorder, we say, is formally repugnant to that rectitude which God has impressed upon the same faculty…. …the corrupt disposition, which inclines internally to actual sin, is most properly Original Sin. …so although the faculty of desire itself is not sin, yet the inclination and propensity of it to evil is sin; even in one asleep, when it does not at all actually incline to sin.</p></blockquote>

</figure><figure class="quote" id="q-a84fb7eb54" data-kw="">
<blockquote><p>We must here observe, that not only are corrupt and disordered inclinations sins, but the thinking of evil, in as far as it is connected with an inclination and propensity to pursue it, or with a desire to practice it, is sin.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/zacharias-ursinus.html">Zacharias Ursinus</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Commentary on the Heidelberg Catechism</cite>, Q. 113</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/sin/concupiscence.html">Concupiscence</a> › <a href="../topics/sin/concupiscence/concupiscence-is-truly-sin.html">Concupiscence is truly sin</a></span><span class="t"><a href="../topics/sin/nature-of-sin.html">Nature of Sin</a></span></div>
<div class="actions"><button class="copy" data-copy="“We must here observe, that not only are corrupt and disordered inclinations sins, but the thinking of evil, in as far as it is connected with an inclination and propensity to pursue it, or with a desire to practice it, is sin.”

— Zacharias Ursinus, Commentary on the Heidelberg Catechism, Q. 113">Copy</button><a class="share" href="https://x.com/intent/post?text=%E2%80%9CWe+must+here+observe%2C+that+not+only+are+corrupt+and+disordered+inclinations+sins%2C+but+the+thinking+of+evil%2C+in+as+far+as+it+is+connected+with+an+inclination+and+propensity+to+pursue+it%2C+or+with+a+desire+to+practice+it%2C+is+sin.%E2%80%9D%0A%0A%E2%80%94+Zacharias+Ursinus%2C+Commentary+on+the+Heidelberg+Catechism%2C+Q.+113&amp;url=https%3A%2F%2F5solasquotes.github.io%2Fquote%2Fa84fb7eb54.html&amp;via=5Solas" target="_blank" rel="noopener">Share on X</a><a class="perma" href="../quote/a84fb7eb54.html">Permalink</a><a class="src" href="https://archive.org/details/commentaryofzach00ursiuoft" rel="noopener" target="_blank">Read it online · Internet Archive</a></div>
</figure><figure class="quote" id="q-ae370cdc90" data-kw="">
<blockquote><p>What concupiscence is, it is better known of itself than that it need any declaration. It is a desire and an affection of the mind which the Greeks do rightly call epithumian, by which we endeavor to draw unto our use by any means that which does like us. And the strength of this desire is so great that unless we do obtain the things which we do desire, we do judge ourself to be here utterly unhappy. The contrary of concupiscence is the withdrawing of the mind, whereby we do turn and flee with a certain horror and abomination from those things which do mislike us, as the contrary of love is hate and the contrary of joy is sorrow. The nature of it is to extend itself unto those things which we have not. Else (as Paul says) how shall a man hope for that which he has already; so likewise is here to be said: Those things which a man has already, why shall he hope for them? Wherefore those things truly be in the reach of our concupiscence which by no right pertain unto us, but be in the power of others. . 2. How many sorts of concupiscences there be Before the sin of our first parents, the concupiscence in our nature was simple, natural, orderly (and necessary, like as other affections were, so that it was subject unto no malice: such as that which is in us yet, as when we be hungry we be desire meat; when we thirst, drink; when we be a cold, we desire warmth; when we be too hot, we desire to be cooled; when we be in prison, we desire liberty; when we be sick, we desire health etc. and this we do by the only course of nature, without any matter of sin. But after that our first parents had drunk of the poison of the Serpent, this strength of concupiscence is depraved in our hearts, and thereby it came that (passing the limits of nature and necessity) it extends itself unto those things which it is not lawful to desire: for that it is not lawful to take things away which pertain to others. Therefore the affections of concupiscence are of two sorts, natural and corrupt. The natural be set in us by God, and so much not unlawful, but that they be also necessary. Wherefore they do very unadvisedly teach us which do refer the crying of infants when they be hungry and desire meat unto the forbidden concupiscence and do ascribe them unto original sin. The corrupt affections of concupiscence be they when the limits of necessity are exceeded and men follow pleasures, curiosity, glory, ambition and other vices, and that contrary unto the law of charity and the purity of holiness. This corruption of our concupiscence is gotten of the old serpent, not grafted in our flesh of God. Wherefore we must beware that we do not ascribe our whole concupiscence neither to God, neither to Satan. The strength of desiring is given us from God, the strength of evil desiring from Satan: like as we do take it of God that we do live, and that we live evil we take it of Satan, the beginner of our malice. By this distinction we do foresee that we do not deny the work of God in us for the work of Satan, nor attribute the work of Satan unto God. It is the part of a wise man to consider diligently in himself the work of Satan and the work of God. I call it the work of God whatsoever is naturally given us. We take of God not only this outward body and soul whereby we do live, and the mind whereby discoursing we do understand and judge, but also the affections of the heart, such as desire is, the power to withstand, love, hate, hope, fear, joy, sorrow, anger, favor and mercy, etc. And these affections be to great use: and there is great cause why they be grafted in our nature. He made us in such sort that we do not receive those things that be necessary simply at his hand without any perseverance of necessity going before, or affection of desire, like stocks and stones, but moved by the perseverance of our necessity we do desire it even as the dry ground does most gladly receive and drink up the moisture that comes by the dews poured from heaven. The reason of this is that first when we do covet things necessary for us, we must turn to our Creator, the fountain of all goodness and the preserver of all things that be made: and ask of Him such things as we have need of. Secondly, that the gifts of God be so much the more welcome unto us after we have received them the more that we desired and besought them. God grafted in us also a sense of rejoicing, which we feel in the use of his gifts, and an effect of joy which rises in our hearts as oft as we do obtain our purpose. The cause of them is, that rejoicing and pleasantly using the gifts of God, we may be carried up in our minds to God the giver of them and give thanks unto his goodness with all our heart. He gave us also the strength of hope. The use of it is that we must trust and tarry for those things which we do desire and ask of God when they are not given by and by, and that we do travail with earnest endeavoring, devising and working in those things which are to be achieved by our own industry and labor. So these be trimly linked together: to have need, to desire, to ask of god, to hope in faith, to receive with joy, to use with liking, to give thanks to the giver of all good things, heartly to commend his goodness and with affection of love to be ravished unto Him. All these things would be utterly decayed if you take away the desire from them. Thus far forth desire and concupiscence is good, the rather necessary, and put into our nature by God. Take away all desire and concupiscence and the knot of wedlock shall decay, the desire of issue [children], the multiplication of our kind, the commodity of eating and drinking, the conservation of life, the study of wisdom, justice, humanity, goodness, mercy, the fellowship and company of man’s life, and all things shall be half dead in man. If it cannot be that we may lack all things, and that nothing that we do, see or hear should like us while we be in this flesh, then it cannot be that we may desire nothing. Therefore to desire nothing pertains not to the living, but to the dead. When we do consider these things, let us weigh withal how great the wickedness of Satan was that he came at the beginning in our first parents with the poison of his malice, corrupted and depraved a thing so necessary, and sticking fast in the very bowels of our life.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/wolfgang-musculus.html">Wolfgang Musculus</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Common Places of the Christian Religion</cite>, (1560; London, 1563), The Tenth Precept, fol. 103.a – 104.a</span></figcaption>

not be that we may desire nothing. Therefore to desire nothing pertains not to the living, but to the dead. When we do consider these things, let us weigh withal how great the wickedness of Satan was that he came at the beginning in our first parents with the poison of his malice, corrupted and depraved a thing so necessary, and sticking fast in the very bowels of our life.”

— Wolfgang Musculus, Common Places of the Christian Religion (1560; London, 1563), The Tenth Precept, fol. 103.a – 104.a">Copy</button><a class="share" href="https://x.com/intent/post?text=%E2%80%9CWhat+concupiscence+is%2C+it+is+better+known+of+itself+than+that+it+need+any+declaration.+It+is+a+desire+and+an+affection+of+the+mind+which+the+Greeks+do+rightly+call+epithumian%2C+by+which+we+endeavor+to+draw+unto+our+use+by+any+means+that+which+does+like+us.+And+the+strength+of+this+desire+is+so+great+that+unless+we+do+obtain+the+things+which+we+do+desire%2C+we+do+judge+ourself+to+be+here+utterly+unhappy.+The+contrary+of+concupiscence+is+the+withdrawing+of+the+mind%2C+whereby+we+do+turn+and+flee+with+a+certain+horror+and+abomination+from+those+things+which+do+mislike+us%2C+as+the+contrary+of+love+is+hate+and+the+contrary+of+joy+is+sorrow.+The+nature+of+it+is+to+extend+itself+unto+those+things+which+we+have+not.+Else+%28as+Paul+says%29+how+shall+a+man+hope+for+that+which+he+has+already%3B+so+likewise+is+here+to+be+said%3A+Those+things+which+a+man+has+already%2C+why+shall+he+hope+for+them%3F+Wherefore+those+things+truly+be+in+the+reach+of+our+concupiscence+which+by+no+right+pertain+unto+us%2C+but+be+in+the+power+of+others.+.+2.+How+many+sorts+of+concupiscences+there+be+Before+the+sin+of+our+first+parents%2C+the+concupiscence+in+our+nature+was+simple%2C+natural%2C+orderly+%28and+necessary%2C+like+as+other+affections+were%2C+so+that+it+was+subject+unto+no+malice%3A+such+as+that+which+is+in+us+yet%2C+as+when+we+be+hungry+we+be+desire+meat%3B+when+we+thirst%2C+drink%3B+when+we+be+a+cold%2C+we+desire+warmth%3B+when+we+be+too+hot%2C+we+desire+to+be+cooled%3B+when+we+be+in+prison%2C+we+desire+liberty%3B+when+we+be+sick%2C+we+desire+health+etc.+and+this+we+do+by+the+only+course+of+nature%2C+without+any+matter+of+sin.+But+after+that+our+first+parents+had+drunk+of+the+poison+of+the+Serpent%2C+this+strength+of+concupiscence+is+depraved+in+our+hearts%2C+and+thereby+it+came+that+%28passing+the+limits+of+nature+and+necessity%29+it+extends+itself+unto+those+things+which+it+is+not+lawful+to+desire%3A+for+that+it+is+not+lawful+to+take+things+away+which+pertain+to+others.+Therefore+the+affections+of+concupiscence+are+of+two+sorts%2C+natural+and+corrupt.+The+natural+be+set+in+us+by+God%2C+and+so+much+not+unlawful%2C+but+that+they+be+also+necessary.+Wherefore+they+do+very+unadvisedly+teach+us+which+do+refer+the+crying+of+infants+when+they+be+hungry+and+desire+meat+unto+the+forbidden+concupiscence+and+do+ascribe+them+unto+original+sin.+The+corrupt+affections+of+concupiscence+be+they+when+the+limits+of+necessity+are+exceeded+and+men+follow+pleasures%2C+curiosity%2C+glory%2C+ambition+and+other+vices%2C+and+that+contrary+unto+the+law+of+charity+and+the+purity+of+holiness.+This+corruption+of+our+concupiscence+is+gotten+of+the+old+serpent%2C+not+grafted+in+our+flesh+of+God.+Wherefore+we+must+beware+that+we+do+not+ascribe+our+whole+concupiscence+neither+to+God%2C+neither+to+Satan.+The+strength+of+desiring+is+given+us+from+God%2C+the+strength+of+evil+desiring+from+Satan%3A+like+as+we+do+take+it+of+God+that+we+do+live%2C+and+that+we+live+evil+we+take+it+of+Satan%2C+the+beginner+of+our+malice.+By+this+distinction+we+do+foresee+that+we+do+not+deny+the+work+of+God+in+us+for+the+work+of+Satan%2C+nor+attribute+the+work+of+Satan+unto+God.+It+is+the+part+of+a+wise+man+to+consider+diligently+in+himself+the+work+of+Satan+and+the+work+of+God.+I+call+it+the+work+of+God+whatsoever+is+naturally+given+us.+We+take+of+God+not+only+this+outward+body+and+soul+whereby+we+do+live%2C+and+the+mind+whereby+discoursing+we+do+understand+and+judge%2C+but+also+the+affections+of+the+heart%2C+such+as+desire+is%2C+the+power+to+withstand%2C+love%2C+hate%2C+hope%2C+fear%2C+joy%2C+sorrow%2C+anger%2C+favor+and+mercy%2C+etc.+And+these+affections+be+to+great+use%3A+and+there+is+great+cause+why+they+be+grafted+in+our+nature.+He+made+us+in+such+sort+that+we+do+not+receive+those+things+that+be+necessary+simply+at+his+hand+without+any+perseverance+of+necessity+going+before%2C+or+affection+of+desire%2C+like+stocks+and+stones%2C+but+moved+by+the+perseverance+of+our+necessity+we+do+desire+it+even+as+the+dry+ground+does+most+gladly+receive+and+drink+up+the+moisture+that+comes+by+the+dews+poured+from+heaven.+The+reason+of+this+is+that+first+when+we+do+covet+things+necessary+for+us%2C+we+must+turn+to+our+Creator%2C+the+fountain+of+all+goodness+and+the+preserver+of+all+things+that+be+made%3A+and+ask+of+Him+such+things+as+we+have+need+of.+Secondly%2C+that+the+gifts+of+God+be+so+much+the+more+welcome+unto+us+after+we+have+received+them+the+more+that+we+desired+and+besought+them.+God+grafted+in+us+also+a+sense+of+rejoicing%2C+which+we+feel+in+the+use+of+his+gifts%2C+and+an+effect+of+joy+which+rises+in+our+hearts+as+oft+as+we+do+obtain+our+purpose.+The+cause+of+them+is%2C+that+rejoicing+and+pleasantly+using+the+gifts+of+God%2C+we+may+be+carried+up+in+our+minds+to+God+the+giver+of+them+and+give+thanks+unto+his+goodness+with+all+our+heart.+He+gave+us+also+the+strength+of+hope.+The+use+of+it+is+that+we+must+trust+and+tarry+for+those+things+which+we+do+desire+and+ask+of+God+when+they+are+not+given+by+and+by%2C+and+that+we+do+travail+with+earnest+endeavoring%2C+devising+and+working+in+those+things+which+are+to+be+achieved+by+our+own+industry+and+labor.+So+these+be+trimly+linked+together%3A+to+have+need%2C+to+desire%2C+to+ask+of+god%2C+to+hope+in+faith%2C+to+receive+with+joy%2C+to+use+with+liking%2C+to+give+thanks+to+the+giver+of+all+good+things%2C+heartly+to+commend+his+goodness+and+with+affection+of+love+to+be+ravished+unto+Him.+All+these+things+would+be+utterly+decayed+if+you+take+away+the+desire+from+them.+Thus+far+forth+desire+and+concupiscence+is+good%2C+the+rather+necessary%2C+and+put+into+our+nature+by+God.+Take+away+all+desire+and+concupiscence+and+the+knot+of+wedlock+shall+decay%2C+the+desire+of+issue+%5Bchildren%5D%2C+the+multiplication+of+our+kind%2C+the+commodity+of+eating+and+drinking%2C+the+conservation+of+life%2C+the+study+of+wisdom%2C+justice%2C+humanity%2C+goodness%2C+mercy%2C+the+fellowship+and+company+of+man%E2%80%99s+life%2C+and+all+things+shall+be+half+dead+in+man.+If+it+cannot+be+that+we+may+lack+all+things%2C+and+that+nothing+that+we+do%2C+see+or+hear+should+like+us+while+we+be+in+this+flesh%2C+then+it+cannot+be+that+we+may+desire+nothing.+Therefore+to+desire+nothing+pertains+not+to+the+living%2C+but+to+the+dead.+When+we+do+consider+these+things%2C+let+us+weigh+withal+how+great+the+wickedness+of+Satan+was+that+he+came+at+the+beginning+in+our+first+parents+with+the+poison+of+his+malice%2C+corrupted+and+depraved+a+thing+so+necessary%2C+and+sticking+fast+in+the+very+bowels+of+our+life.%E2%80%9D%0A%0A%E2%80%94+Wolfgang+Musculus%2C+Common+Places+of+the+Christian+Religion+%281560%3B+London%2C+1563%29%2C+The+Tenth+Precept%2C+fol.+103.a+%E2%80%93+104.a&amp;url=https%3A%2F%2F5solasquotes.github.io%2Fquote%2Fae370cdc90.html&amp;via=5Solas" target="_blank" rel="noopener">Share on X</a><a class="perma" href="../quote/ae370cdc90.html">Permalink</a><a class="src" href="https://reformedbooksonline.com/concupiscence-or-desires-of-pre-motions-to-sin-are-sinful/#:~:text=What%20concupiscence%20is%2C%20it%20is%20better,the%20very%20bowels%20of%20our%20life&amp;text=What%20concupiscence%20is%2C%20it%20is%20better%20known%20of&amp;text=fast%20in%20the%20very%20bowels%20of%20our%20life" rel="noopener" target="_blank">Read it online · Reformed Books Online</a></div>

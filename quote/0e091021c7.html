<blockquote><p>First problem: Are Reformed theologians concerned over practical theology, and do they discuss it, or is their theology purely speculative?

Our reply: Affirmative to the first, and negative to the second, against the calumnies of the Remonstrants and the papists. The Remonstrants in their Apologia brand our theology as pure speculation. …

The very light of the facts is enough to destroy this calumny, since the sermons of the more distinguished of our preachers and an almost infinite number of writings of the Reformers (some of which we have described in our Bibliotheca Theologica) breathe pure practice, so that our theologians, like Socrates, may be said to have brought theology from heaven down to earth, or, better to have raised it to heaven from the earth and scholastic dust. On this point the English writers … [such as William] Perkins (from whom, “as from a perennial spring,” etc.) are conspicuous. …

Where, among all the books with which the Remonstrants have flooded Holland, do any practical writings appear? any moral theology? any exposition of cases of conscience? any worthwhile commentaries on the decalogue? any exercises for piety, even in shadow or name? any aids to the spiritual life?</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/gisbertus-voetius.html">Gisbertus Voetius</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Selectae Disputationes Theologicae</cite>, (1648-69) in Reformed Dogmatics, ed. and trans. John W. Beardslee III (New York: Oxford University Press, 1965), pp 268-69.</span></figcaption>

</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-177272d502" data-kw="">
<blockquote><p>In general, Wittich tried to refute Spinoza’s monism by mobilizing Cartesian principles, which is particularly perspicuous in his discussion of God’s being. However, once he turned to the issue of the divine will, he openly contradicted Descartes’ teaching and approached Spinoza’s necessitarianism. He chose to do so to remain orthodox, evading the accusation of Socinian heresy, which the conservative theologian Petrus van Mastricht had made against his Theologia pacifica (1671). This paper concludes that the widespread fear concerning Socinianism deeply conditioned the way theologians reacted to the Cartesian philosophy in the Netherlands in the late seventeenth century.” – Abstract Sangiacomo, Andrea – ‘Divine Action &amp; God’s Immutability: a Historical Case Study on how to Resist Occasionalism’ European Journal of Philosophy of Religion, 7/4 (Summer 2015), pp. 115-135 Sangiacomo is an associate professor at the faculty of philosophy at the University of Groningen (NL). Abstract: “Today’s debates present ‘occasionalism’ as the position that any satisfying account of divine action must avoid. In this paper I discuss how a leading [French] Cartesian author of the end of the seventeenth century, Pierre-Sylvain Régis [1632–1707], attempted to avoid occasionalism. Régis’s case is illuminating because it stresses both the difficulties connected with the traditional alternatives to occasionalism (so-called ‘concurrentism’ and ‘mere-conservationism’) and also those aspects embedded in the occasionalist position that should be taken into due account. The paper focuses on Régis’s own account of secondary causation in order to show how the challenge of avoiding occasionalism can lead to the development of new accounts of divine action.</p></blockquote>

<blockquote><p>…it’s possible to articulate Christian doctrine without formally invoking concepts like “essence,” “substance” and so on. Instead of saying, for example, that in the incarnation there is one hypostasis subsisting in two distinct natures, one can say that there is just Jesus and not someone else and that Jesus always remains both truly God and truly human. However, the fact that the use of the metaphysical language is not absolutely necessary does not mean that the metaphysical resources in question are detached from reality. It does not mean that what they offer us is just a set of coherent rules for saying things – rules that we might either take or leave. On the contrary, the classical metaphysical tradition developed by Christian thinkers like John of Damascus, Thomas Aquinas or the early Reformed theologians and philosophers involves a knowledge of how things are. Indeed, it is fundamentally an exposition of things human beings know to be true prior to engaging in any formal academic work. For example, things do have natures by virtue of which they are similar to other things. There really are substances in which accidents inhere… As we seek ways to express what God is like according to scriptural teaching, we should look to this philosophical tradition, not Kant or Hegel, because it sheds light on reality.</p></blockquote>

<blockquote><p>Christ in respect of his soul was comprehensor [one comprehending the highest blessedness], though viator [a pilgrim] in respect of his body. See Aquinas, part 3, q. 9, art. 2.” (System of Divinity, p. 873) . Suffering &amp; Death of Christ Agreement Agonies on the Cross Rivet: “Aquinas grants that Christ’s soul experienced everything that causes grief… and He took upon Himself every sorrow, the greatest gried in absolute quantity, and all the way to the point of death He not only bore in Himself the slanderings, tauntings, scourings, and shameful humiliations, but with patience, humility, and while enduring his harshest chastisement, He also appeased the wrath and anger of God that burned against mankind.” (Synopsis, Disp. 27, §6) . The Divine Second Person Remained United to his Soul &amp; Corpse through Death Thomas teaches this in Compendium, ch. 229; Mastricht teaches it in TPT, vol. 4, ch. 13, §13, pp. 466-68. See also, ‘On the Hypostatic Union in Christ’s Death’. . Disagreements Christ Suffered in the Higher Parts of his Soul on the Cross Thomas: “He suffered indeed as to all His lower powers… But Christ’s higher reason did not suffer thereby on the part of its object, which is God, who was the cause, not of grief, but rather of delight and joy, to the soul of Christ.” (Summa, pt. 3, q. 46, art. 7-8) Turretin: ‘Did Christ suffer only corporeal punishments for us in the body or in the soul, but only as to its lower and sensitive part? Or did He in truth also bear the spiritual and infernal punishments of sin themselves (in the superior as well as in the inferior part) properly in Himself and from a sense of God’s wrath? We deny the former and affirm the latter against the papists.’ (2.352) . Christ Remained truly a Man in his Death Mastricht relates that Thomas denied that Christ was in his death, with body and soul separated, a man, in the true and proper sense of that term, though Thomas confessed Christ was then a dead man (Compendium, ch. 22

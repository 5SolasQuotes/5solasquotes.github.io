<blockquote><p>It is the Scriptures of truth, and not our impressions, which are to be the standard of duty; ‘To the Law and to the Testimony, etc.’ And we are to try the spirits, lest Satan” (as certainly he is) be the author of these impressions; who not rarely transforms himself into an angel of light, by which means he presents duty to the soul attired with the ugly dress of sin and impiety, while, at the same he busks up sin with all the baits and enticing allurements of an apparent zeal for God, and a seeming regard to his glory.</p></blockquote>

<blockquote><p>They that would know more of these sectaries [Brownists], let them read these books following: First, a book called, A Discovery of Brownism, or a briefe Declaration of the errors and 〈◊〉 dayly practised and increased among the English company of the Separation, remaining at this present at Amsterdam in Holland, by Mr. White. A book called, The Raising of the Foundation of Brownism, by S.B., printed by Henr. Windet, 1588. A Plain Declaration that our Brownists be full Donatists, by comparing them together from point to point, out of the writings of St. Augustine, by George Gifford, minister of God’s Word at Malden. An Apology of the Church of England against the Brownists, written by Doctor [Joseph] Hall, now Lord Bishop of Norwich. Master [Ricahrd] Bernard’s Separatists’ Schism. The Prophane Schism of the Brownists or Separatists, with the impiety, dissensions, lewd and abominable vices of that impure sect, discovered by Christopher Lawne, John Fowler, Clement Sanders and Robert Bulward. Item, a book called, The Shield of Defence: written against Master de le Cluse, in defence of Mr. Brightman, printed 1612.</p></blockquote>

<blockquote><p>7. To wave a little that which concerns private and particular persons, we offer it to consideration whether inferior Kirk-judicatories are subordinate to the greater and superior simply and absolutely, because they are greater and superior, or, because the inferior have no intrinsical power given them by Jesus Christ, but in, and with subordination to the greater, because greater. If so, it would seem that all the inferior Judicatories of the Kirk, Congregational-Elderships, Presbyteries, and Provincial Synods must be fenced and act in the name, and by virtue of the authority derived from the General Assembly, as all those Civil Courts that have no intrinsic power in themselves, but in, and with subordination to the supreme Civil Magistrate are fenced in his name and act by virtue of his authority. Inferior Kirk-judicatories, being ordinances of Jesus Christ, have the promise made to them when they meet in His Name and do adhere to His Truth, Mt. 18:18-19. And if so, shall the sentence of the superior Judicatory, when wrong upon the matter, oblige them to submission? If a Presbytery, or a Synod with the consent of the Presbytery, do in an orderly way of procedure, cast out an heterodox and scandalous minister, must they, because the Synod or General Assembly does sustain his unjust appeal, be obliged in conscience again to receive him as a member of the Presbytery or Synod, and acknowledge him for a lawful minister of the Gospel; or, if they have in an orderly way of procedure, admitted an able orthodox godly man to the Ministry: Must they, because the superior Judicatory commands them so to do, cease to acknowledge him or own him for one of their number, or as a Minister of the Gospel? If so, it seems to be an ill-grounded truth that is commonly delivered by some divines writing of synods, that the power of synods is not corruptive, privative, or destructive to the power of classical presbyteries or single congregations, but perfective, acumulative, and conservative thereunto. 8. What is denied jure to ecomenic councils, and so lawfully called prophets and ministers of the Gospel, to Nathan, to David, to Paul, to an angel from heaven, Gal. 1:8, cannot warrantably be given to General Assemblies. If ecomenic councils, lawfully called ministers, if Nathan, if Samuel, if Paul, if an Angel teach or decree but according to the Word of the Lord, we are to counteract, and to contradict, Gal. 1:8. “But though we or an angel from heaven, preach to you, beside what we have preached, let him be accursed,” Gal. 1:8. Therefore, etc.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/james-guthrie.html">James Guthrie</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Protesters no Subverters, and presbyterie no papacie; or, A vindication of the protesting brethren, and of the government of the kirk of Scotland from the aspersions unjustly cast upon them</cite>, … (1658), pp. 107-108</span></figcaption>

<blockquote><p>There is so great a difference of men and cases that it’s gross sottishness to think that their duties and sins are the same in mutable circumstances: It’s a sin to preach or pray when we should be quenching a fire, saving men’s lives. Christians, as well as Pharisees, are yet to learn what that means, “I will have mercy and not sacrifice, and therefore accuse the guiltless.” [Mt. 12:7] Some men have no possibility of any other church-worship but in the parish-churches. Some have no other possibility but what is worse. Some may have abler teachers, but at the cost of imprisonment and ruin. It is not lawful to lie in prison merely for refusing to hear a weak nonconformist when you might hear an abler: and so it is in the case of conformists, else all were bound to a few men. Some have liberty to hear fitter men, or at the least, more agreeable to them, without greater hurt than good (as the Dutch and French here have). Some are commanded by husbands, parents and masters to one church, and some to another. Some have more able and godly ministers in the parish-churches, and some have such as I would never own or encourage in the ministry by seeming to own them. Some can remove their dwelling and some cannot. Some had liberty the last year that cannot have it this year without more hurt than their benefit will compensate. In these cases where God has not at all tied us to a [Service-]book, or no book, to this church or to that, he that can truly tell which way he shall do and get most good or hurt, may by that better know his duty than by these arguments or men’s censures.</p></blockquote>

<blockquote><p>Some more zealous than knowing and considerate did aggravate the acceptance of the indulgence to a great height, and ground of separation, and so wrought their enemies’ work for them better than they could do it for themselves: And so that division proved fatal at Bothwell, where they had a fair game, and opportunity to have defeated all their enemies, and brought prelacy down to the dust. It is observable there was this difference in the two appearances: Pentland had love, harmony and sympathy, wanting nothing but men and arms; Bothwell had both, and wanted harmony, but plagued with division.</p></blockquote>

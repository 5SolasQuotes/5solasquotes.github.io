<blockquote><p>But that which maketh men most afraid for their Anabaptism, is their open deserting all the Reformed Churches, and the Brownists themselves, in three grounds.

First, they deny the federal holiness of Christian children; against this Tho[mas]. Goodwin did preach, and deny openly that common distinction of Protestants of real and federal holiness, – requiring in every Infant to be baptized a real and inherent sanctity. If this ground be maintained, I see not how Anabaptism, or else Arminianism, will be avoided; for if this real holiness above federal, be the great ground of Baptism, and this cannot be asserted in the judgement of verity of any Infant; for whatever we say of the judgement of charity, yet in the judgement of truth, and with the certainty of faith wherewith we must assent to every Scripture, who can say that any particular Infant is holy, and so that any Infant should be baptized? or if we can say in the judgement of truth, that every baptized Infant is really sanctified, as it seems Mr Robinson hath taught Mr Goodwin, if Mr Rathband understand right the 309 p. of Rob. justification, the Arminians have won the field; for no man doubts but many baptized Infants, even in their way, do fall away totally and finally from whatsoever holiness can be supposed to be in them. If these inextricable difficulties did move Mr Goodwin to stop the Press that it went not on with his Sermons against the Anabaptists, himself doth know.

Secondly, they esteem not baptized Infants to be members of their Church before they have entered into their Covenant; till then they hold them from the Lord’s Table and all the acts of Discipline, as people without the Church and not members of it: If it be so, their Baptism was of so small use that well they might have wanted it to the time of their admission to be members.

Thirdly, they account Anabaptism a very tolerable error; so far as ever we heard to this day, they did never so much as rebuke any of their members for it, much contrary to the practice of the Brownists, and of their Brethren in New England, who ever have removed the Anabaptists from their Churches, as Sectaries of a special evil note. We have long observed the great affection of Independents here towards them who professed opposition to Paedo-Baptism, but did never expect to have heard them declare any thing towards the Arminian errors of the Anabaptists.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/robert-baillie.html">Robert Baillie</a></span><span class="wk"><span class="lbl">Work:</span> <cite>A Dissuasive from the Errors of the Time</cite>, (London, 1645), pp 119-20.</span></figcaption>

</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-105ec53399" data-kw="">
<blockquote><p>Every faithful Christian who has been baptized may have this benefit from baptism as long as he lives: that as by his engrafting into Christ he is one with Him and therefore sees that while Christ lives he must and will live also, so thus having perpetual union and fellowship with Christ, the believer draws strength from the vine, so that he may live the Christian life.

If Christ then has the power of renewing him – which is signified and sealed by baptism (namely, the power of Christ’s death mortifying sin and the virtue of His resurrection in raising him up to a new life) – is not baptism throughout his life, as often as he seriously considers it, a powerful means to help him forward in a Christian life?</p></blockquote>

<blockquote><p>XXIII. But with regard to the place of regeneration there is greater difficulty. On this part of the subject, I find four distinct opinions among theologians. Some think that regeneration takes place at different periods of time—it may be before, it may be at, or it may be after baptism. Others place it uniformly before baptism. Others teach that infants are baptized unto future regeneration, being incapable of it at the time. Indeed, many contend that God usually confers regeneration upon infants in the very act and moment of baptism. Let us look at the arguments of each class, and subject them to an impartial examination. XXIV. That in the dispensation of his saving grace God is restricted to no particular period of time will be admitted by every person who entertains a becoming reverence for his supreme and almighty dominion. The sole question is: What he may have prescribed to himself in the exercise of his unlimited freedom, or may have revealed in his Word, or made manifest by experience?</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/herman-witsius.html">Herman Witsius</a></span><span class="wk"><span class="lbl">Work:</span> <cite>‘On the Efficacy &amp; Utility of Baptism</cite>, (Utrecht, 1693) in MJT 17 (2006), pp. 121-90, Includes an introduction by Mark Beach. Originally an appendix in William Marshall, Popery in The Full Corn, the Ear &amp; the Blade; or, The Doctrine of Baptism in the Popish, Episcopalian &amp; Congregational Churches; with a Defence of the Calvinistic or Presbyterian View (Edinburgh: Paton and Ritchie, 1852), p. 142</span></figcaption>

</figure><figure class="quote" id="q-674765a0e8" data-kw="">
<blockquote><p>But now, having run through these various arguments, to what conclusion do we come? Are they sufficient to set aside our reasoned conviction, derived from some such argument as Dr. Hodge’s, that infants are to be baptized? A thousand times no. So long as it remains true that Paul represents the Church of the Living God to be one, founded on one covenant (which the law could not set aside) from Abraham to to-day, so long it remains true that the promise is to us and our children and that the members of the visible Church consist of believers and their children—all of whom have a right to all the ordinances of the visible Church, each in its appointed season. The argument in a nutshell is simply this: God established His Church in the days of Abraham and put children into it. They must remain there until He puts them out. He has nowhere put them out. They are still then members of His Church and as such entitled to its ordinances. Among these ordinances is baptism, which standing in similar place in the New Dispensation to circumcision in the Old, is like it to be given to children.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/benjamin-b-warfield.html">Benjamin B. Warfield</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Works of Benjamin B. Warfield</cite>, vol. 9 (Bellingham, WA: Logos Bible Software, 2008), 408.</span></figcaption>

<div class="actions"><button class="copy" data-copy="“But now, having run through these various arguments, to what conclusion do we come? Are they sufficient to set aside our reasoned conviction, derived from some such argument as Dr. Hodge’s, that infants are to be baptized? A thousand times no. So long as it remains true that Paul represents the Church of the Living God to be one, founded on one covenant (which the law could not set aside) from Abraham to to-day, so long it remains true that the promise is to us and our children and that the members of the visible Church consist of believers and their children—all of whom have a right to all the ordinances of the visible Church, each in its appointed season. The argument in a nutshell is simply this: God established His Church in the days of Abraham and put children into it. They must remain there until He puts them out. He has nowhere put them out. They are still then members of His Church and as such entitled to its ordinances. Among these ordinances is baptism, which standing in similar place in the New Dispensation to circumcision in the Old, is like it to be given to children.”

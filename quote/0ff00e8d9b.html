<main class="wrap"><figure class="quote" id="q-0ff00e8d9b" data-kw="twofold state humiliation exaltation">
<blockquote><p>This is commonly held to be twofold: the one of emptying and humiliation; the other of exaltation and majesty; of suffering and of glory; of battle and of triumph; of the way and of the goal; of death and of life. The following demonstrate the verity of both. (1) The oracles of the Old Testament in which he is foretold. In Ps. 8 mention is made of his being made a little lower than the angels (which is the emptying) and of his being crowned with glory and honor (which is the exaltation). In Ps. 110:7, it is said of the Messiah, “He shall drink of the brook in the way; therefore shall he lift up the head.”</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/francis-turretin.html">Francis Turretin</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Institutes of Elenctic Theology</cite>, 13.9.1–2</span></figcaption>

</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-0076ce0f8b" data-kw="sufferings soul wrath">
<blockquote><p>As the suffering of Christ is the principal part of the ransom paid for us by him and the special foundation of our confidence and consolation, it should also be the primary object of our faith and the theme of meditation, that with Paul we may count all things for loss but the knowledge of the crucified Jesus. Did Christ suffer only corporeal punishments for us in the body or in the soul, but only as to its lower and sensitive part? Or did he in truth also bear the spiritual and infernal punishments of sin themselves (in the superior as well as in the inferior part) properly in himself and from a sense of God’s wrath? We deny the former and affirm the latter against the papists.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/francis-turretin.html">Francis Turretin</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Institutes of Elenctic Theology</cite>, 13.14.1</span></figcaption>

</figure><figure class="quote" id="q-a3dfdd8439" data-kw="">
<blockquote><p>That the eternal word, for the salvation of sinners, should come down from heaven and be made flesh, is an act of such condescension, a discovery of such love, that can never to the full be found out.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/john-bunyan.html">John Bunyan</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Saints’ Knowledge of Christ’s Love</cite></span></figcaption>

</figure><figure class="quote" id="q-9bef223640" data-kw="">
<blockquote><p>A person so great, so high, so glorious, as this Jesus Christ was, should have love for us, that passes knowledge. It is common for equals to love, and for superiors to be beloved; but for the King of princes, for the Son of God, for Jesus Christ to love man thus: this is amazing, and that so much the more, for that man the object of this love, is so low, so mean, so vile, so undeserving, and so inconsiderable, as by the scriptures, everywhere he is described to be.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/john-bunyan.html">John Bunyan</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Saints’ Knowledge of Christ’s Love</cite></span></figcaption>

</figure><figure class="quote" id="q-c28bff1c27" data-kw="">
<blockquote><p>Consider therefore, his infinite condescension, grace, and love herein. Why all this towards you? Does he stand in need of you? Have you deserved it at his hands? Did you love him first? Cannot he be happy and blessed without you? Has he any design upon you, that he is so earnest in calling you unto him? Alas! it is nothing but the overflowing of mercy, compassion, and grace, that moves and acts him herein.</p></blockquote>

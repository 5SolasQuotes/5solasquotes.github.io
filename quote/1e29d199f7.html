<blockquote><p>As generation (gennēsis) is ascribed to the Son, so procession (ekporeusis) is ascribed to the Holy Spirit—taking the word not only widely (as denoting “to have origin from some one”; for thus it can also be applied to the Son, to whom exodos and exeleusis is attributed, since he is said to have come forth from the Father [Jn. 16:28] and to have eternal goings-forth [Mic.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/francis-turretin.html">Francis Turretin</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Institutes of Elenctic Theology</cite>, 3.31</span></figcaption>

</figure><figure class="quote" id="q-fd31edefff" data-kw="fons deitatis Father">
<blockquote><p>The Son emanates from the Father alone, but the Holy Spirit from the Father and the Son together. … If the mode of subsisting is considered (according to which the Father is the fountain of deity from whom the Son emanates), not improperly in this sense is he said to proceed from the Father through the Son.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/francis-turretin.html">Francis Turretin</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Institutes of Elenctic Theology</cite>, 3.31.3, 8</span></figcaption>

</figure><figure class="quote" id="q-b0d6ffec2e" data-kw="Word Wisdom Spirit">
<blockquote><p>The Son is the Word and Wisdom of the Father, begotten from eternity and without beginning in time, and the Holy Spirit is the divine power proceeding from the Father and the Son. In this matter, we must tread cautiously and with suspended judgment. This doctrine must be approached soberly and reverently, as it surpasses human comprehension.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/pierre-du-moulin.html">Pierre Du Moulin</a></span><span class="wk"><span class="lbl">Work:</span> <cite>On the Trinity</cite>, Thesis VIII–IX</span></figcaption>

<div class="actions"><button class="copy" data-copy="“The Son is the Word and Wisdom of the Father, begotten from eternity and without beginning in time, and the Holy Spirit is the divine power proceeding from the Father and the Son. In this matter, we must tread cautiously and with suspended judgment. This doctrine must be approached soberly and reverently, as it surpasses human comprehension.”

</figure><figure class="quote" id="q-d8a938995a" data-kw="Spirit proceeds Filioque deity">
<blockquote><p>The Holy Spirit proceeds from the Father and the Son, and the reason is that He is called the Spirit of the Son in Galatians 4:6 and Romans 8. He who is called the Spirit of God is the same who is also called the Spirit of Christ. The second reason is that He is so the Spirit of the Son that He is sent by the Son (John 16:7, 14). But if one is sent, he is sent either by authority, or by counsel, or by natural production. He is not sent by authority, since He is God; nor by counsel, since He is also God—for one who is such is instructed by one wiser than himself. Therefore He is sent by natural procession.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/johannes-maccovius.html">Johannes Maccovius</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Theological Disputations on the Holy Spirit</cite>, II</span></figcaption>

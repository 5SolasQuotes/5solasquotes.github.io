<main class="wrap"><figure class="quote" id="q-1dd83f8116" data-kw="">
<blockquote><p>(b) For the act of &quot;flying to and reception of&quot; Christ by which the believer (recognizing the truth and goodness of the promises) betakes himself to Christ, receives and embraces him and rests solely upon his merit. … In the first and second signification, trust is of the essence of faith and is well called by theologians its form. As will afterwards be proved against the Romanists, it is a fiducial apprehension of Christ offered with all his blessings in the word of the gospel.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/francis-turretin.html">Francis Turretin</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Institutes of Elenctic Theology</cite>, 15.10.3</span></figcaption>

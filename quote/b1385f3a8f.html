<main class="wrap"><figure class="quote" id="q-b1385f3a8f" data-kw="">
<blockquote><p>Not that to drink wine is shameful. God forbid! For such precepts belong to heretics … The passage before us is useful also against heretics, who speak evil of God’s creatures; for if it had been among the number of things forbidden, Paul would not have permitted it, nor would have said it was to be used.

And not only against the heretics, but against the simple ones among our brethren, who when they see any persons disgracing themselves from drunkenness, instead of reproving such, blame the fruit given them by God, and say, “Let there be no wine.” We should say then in answer to such, “Let there be no drunkenness; for wine is the work of God, but drunkenness is the work of the devil. Wine maketh not drunkenness; but intemperance produceth it. Do not accuse that which is the workmanship of God, but accuse the madness of a fellow mortal. But thou, while omitting to reprove and correct the sinner, treatest thy Benefactor with contempt!”

… When, therefore, we hear men saying such things, we should stop their mouths; for it is not the use of wine, but the want of moderation which produces drunkenness, Drunkenness! that root of all evils. Wine was given to restore the body’s weakness, not to overturn the soul’s strength; to remove the sickness of the flesh, not to destroy the health of the spirit.

Do not then, by using the gift of God immoderately, afford a handle to the foolish and the impudent. For what is a more wretched thing than drunkenness! The drunken man is a living corpse. Drunkenness is a demon self-chosen, a disease without excuse, an overthrow that admits of no apology; a common shame to our kind. The drunken man is not only useless in our assemblies; not only in public and private affairs; but the bare sight of him is the most disgusting of all things, his breath being stench.

The belchings, and gapings, and speech of the intoxicated, are at once unpleasant and offensive, and are utterly abhorrent to those who see and converse with them; and the crown of these evils is, that this disease makes heaven inaccessible to drunkards, and does not suffer them to win eternal blessedness: for besides the shame attending those who labour under this disease here, a grievous punishment is also awaiting them there!</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/john-chrysostom.html">John Chrysostom</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Homilies Addressed to the People of Antioch, Concerning the Statutes</cite>, (387), 1.7, 11-12 in Nicene and Post-Nicene Fathers 2, 9: 333, 335.</span></figcaption>

</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-a2b42ca68b" data-kw="">
<blockquote><p>Whom, when Priscilla. By this it appeareth how far Priscilla and Aquila were from the love of themselves, and from envying another man’s virtue, in that they deliver those things familiarly and privately to an eloquent man, which he may afterward utter publicly. They excelled not in the same grace wherein he did excel, and, peradventure, they might have been despised in the congregation. Moreover, they most diligently help him, whom they see better furnished as well with eloquence as the use of the Scripture; so that they keep silence, and he alone is heard.

Again, this was no small modesty which was in Apollos, in that he doth suffer himself to be taught and instructed not only in [by] an handy-craftsman, but also by a woman. He was mighty in the Scripture, and did surpass them; but as touching the accomplishment of the kingdom of Christ, those do polish and trim him who might seem to be scarce fit ministers.

Also, we see that at that time women were not so ignorant of the word of God as the Papists will have them; forasmuch as we see that one of. the chief teachers of the Church was instructed by a woman. Notwithstanding, we must remember that Priscilla did execute this function of teaching at home in her own house, that she might not overthrow the order prescribed by God and nature.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/john-calvin.html">John Calvin</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Commentary on the Acts of the Apostles</cite>, ed. Henry Beveridge, trans. Christopher Fetherstone (1560; London, 1585) in Calvin’s Commentaries (22 vols, Grand Rapids: Baker, 1993), 19a: 202-03.</span></figcaption>

<blockquote><p>There is a lot of psychological distress involved in even talking about it. I don’t care for the overuse of words like ‘trauma,’ but it really has felt traumatic, and we weren’t suffering the worst of it by any means. Our family has been shunned by the pastor because he didn’t believe we voted for him to be installed [as the pastor], although we did; you don’t realize how much damage it does to have your spiritual leader refuse to even speak to you, because it starts to seem normal. I was also reprimanded when one of the elders found out that I asked a question about the church’s unconventional sacramental practices to someone outside the church. There have been sustained, vicious attacks on family members by the session [of elders]. There is consistent abuse of Matthew 18 to stifle any publicly voiced criticisms of actions by the session. There is a lack of transparency: for example, the session refuses to release a comprehensive budget to the congregation, and makes major purchases without a congregational vote. Church discipline has no established procedure, and excommunication is done behind closed doors, without a public trial or public testimony by witnesses. Excommunications are also based on manufactured sins; the current excommunication, for example, is based on the charge of “living in darkness.” The pastor has literally pronounced eternal damnation over people who have criticized him in public. The session has even gone after people who left the church and are no longer members, going so far as to contact people’s ex-spouses to attempt to find incriminating information about them to convey to the non-member’s new pastor. They also routinely spread around information that was given in confidence for counseling purposes. Everyone we’ve told who is not in the church is appalled; in retrospect we wonder why it took so long for us to leave, but it really is painful. It was hard to leave for a number of reasons. First, we had a lot of specific doctrinal agreements with that church, that most other churches don’t share. Along with that came like-minded friends who we really did not want to give up. Things got incrementally worse over a long time, and quite often the leadership had semi-plausible explanations for their actions which were not easy to disprove. The worst of it was not targeted at us, and we thought we could just keep our heads down and avoid interacting with the session. We wished we could more vocally confront them, but the people being abused asked that we not get involved, so we didn’t feel that we could. Over time the cognitive dissonance grew worse, and it seemed to us the Holy Spirit had entirely withdrawn from the church. The church moving to a new building that was much farther away gave us a ready excuse to go elsewhere that couldn’t be argued with. Then the final decision was made for us when the pastor purported to damn our relative; that’s a bell that can’t really be unrung, and we couldn’t commune in good faith after that. We are members of the congregation. We are hoping the elders will just leave us alone, but they have harassed people who have left before, so we are trying to get under the shelter of another church quickly. We did a complete communication blackout. We blocked all of the communication outlets from all of the elders, so we won’t have to even see anything they might send which could tempt us to reply. Articles on spiritual abuse do capture very well the experience of being in the situation, the damage it does and the psychological consequences of getting out.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/cultish.html">Anonymous</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Testimony of a Lawyer, with family</cite>, Pennsylvania, USA</span></figcaption>

ence+for+counseling+purposes.+Everyone+we%E2%80%99ve+told+who+is+not+in+the+church+is+appalled%3B+in+retrospect+we+wonder+why+it+took+so+long+for+us+to+leave%2C+but+it+really+is+painful.+It+was+hard+to+leave+for+a+number+of+reasons.+First%2C+we+had+a+lot+of+specific+doctrinal+agreements+with+that+church%2C+that+most+other+churches+don%E2%80%99t+share.+Along+with+that+came+like-minded+friends+who+we+really+did+not+want+to+give+up.+Things+got+incrementally+worse+over+a+long+time%2C+and+quite+often+the+leadership+had+semi-plausible+explanations+for+their+actions+which+were+not+easy+to+disprove.+The+worst+of+it+was+not+targeted+at+us%2C+and+we+thought+we+could+just+keep+our+heads+down+and+avoid+interacting+with+the+session.+We+wished+we+could+more+vocally+confront+them%2C+but+the+people+being+abused+asked+that+we+not+get+involved%2C+so+we+didn%E2%80%99t+feel+that+we+could.+Over+time+the+cognitive+dissonance+grew+worse%2C+and+it+seemed+to+us+the+Holy+Spirit+had+entirely+withdrawn+from+the+church.+The+church+moving+to+a+new+building+that+was+much+farther+away+gave+us+a+ready+excuse+to+go+elsewhere+that+couldn%E2%80%99t+be+argued+with.+Then+the+final+decision+was+made+for+us+when+the+pastor+purported+to+damn+our+relative%3B+that%E2%80%99s+a+bell+that+can%E2%80%99t+really+be+unrung%2C+and+we+couldn%E2%80%99t+commune+in+good+faith+after+that.+We+are+members+of+the+congregation.+We+are+hoping+the+elders+will+just+leave+us+alone%2C+but+they+have+harassed+people+who+have+left+before%2C+so+we+are+trying+to+get+under+the+shelter+of+another+church+quickly.+We+did+a+complete+communication+blackout.+We+blocked+all+of+the+communication+outlets+from+all+of+the+elders%2C+so+we+won%E2%80%99t+have+to+even+see+anything+they+might+send+which+could+tempt+us+to+reply.+Articles+on+spiritual+abuse+do+capture+very+well+the+experience+of+being+in+the+situation%2C+the+damage+it+does+and+the+psychological+consequences+of+getting+out.%E2%80%9D%0A%0A%E2%80%94+Anonymous%2C+Testimony+of+a+Lawyer%2C+wi <blockquote><p>Our Opposites here tell us of two things necessary to the making up of idolatry, neither of which is found in their kneeling. First, they say except there be an intention in the worshipper to adore the creature which is before his eyes, his kneeling before it is no idolatry… Answer. …Nay then the three children should not have been idolaters if they had kneeled before Nebuchadnezzar’s image, intending their worship to God only, and not to the image. Our Opposites here take the Nicodemites by the hand. But what says Calvin? ‘Si isti boni sapientesque Sophistae, ibi tum fuissent, simplicitatem illorum trium servorum Dei irrisissent. Nam hujusmodi credo cos verbis objurgassent: miseri homines istud quidem*non est adorare, quum vos in rebus nullam fidem adhibetis: nulla est Idololatria nisi ubi est devotio, hoc est quaedam animi ad idola colenda venerandasque adjunctio atque applicatio, &amp;c.’ (De fugiend. idololat., homily 1) If Paybody had been in Calvin’s place he could not have called the [protestant] Nicodemites idolaters, forasmuch as they have no intention to worship the Popish images when they kneel and worship before them. Nay, the grossest idolaters that ever were, shall by this doctrine be no idolaters, and Paul shall be censured for teaching that the Gentiles did worship devils, since they did not intend to worship devils. ‘Idololatrae nec olim in Paganismo intendebant, nec hodie in Papatu intendunt, Daemonibus offerre. Quid tum? Apostolus contrarium pronuntiat, quicquid illi intendant,’ says Pareus (Com. in illum locum, sect. 11).</p></blockquote>

</figure><figure class="quote" id="q-739cd44fcb" data-kw="">
<blockquote><p>1. The word ‘church’ [say the Independents] signifies always a gathered together church, or such as may gather together, Acts 11:26, a whole year they assembled with the Church, Acts 20:7, the disciples came together to break bread; so Acts 1:10; 2:44,46; Acts 5:12; 15:25. [Rutherford’s] Answer: [1.] Our brother Mr. [George] Gillespie (Assertion of the Government of the Church of Scotland, pt. 2, ch. 3, p. 141-42) says many interpreters expound [in Greek], ‘they were together’, that is, of one accord in love and amity: and also [physical] churches not being builded, and they meeting in private houses, as in Mary’s house, Acts 12, school of Tyrranus, Acts 19:9, in an upper chamber, Acts 20:8, Paul’s lodging at Rome, Acts 28:13. What private houses (Acts 10:9) could ordinarily contain so many thousands?

2. The Scripture speaks so [as] to give us an example of the public meeting for public worship where it is not needful that all met in one place collectively; it is enough they meet all distributively.

3. Neither does the word ‘church’ always signify a meeting of one single congregation, as Acts 12:5; prayers were made [for Peter in jail] by the church, that is by all professors [throughout Jerusalem]. Herod vexed the church, Acts 8:3. Saul made havoc of the church; ‘I persecuted the Church.’ (1 Cor. 15:9) There is no necessity to expound these of people meeting ordinarily to worship God; for Herod and Saul persecuted all, whither apostles or professors in houses, not respecting their meeting in one place; Also [that] it shall follow that prayers were not made in private, but only in the church, that is, in the convened congregation for Peter, which is absurd: And that they were a visible-church is clear, else Herod and Saul could not persecute them.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/samuel-rutherford.html">Samuel Rutherford</a></span><span class="wk"><span class="lbl">Work:</span> <cite>A Peaceable &amp; Temperate Plea for Paul’s Presbytery in Scotland</cite>, … (1642), ch. 7, ‘If there be No True Visible Church in the New Testament, but Only a Congregation Meeting in One Place, &amp; No Presbyterial or Representative Church (as They Call it) at All’, p. 81 Rutherford is arguing against the novel Independent Church government. See also the chapter at large.</span></figcaption>

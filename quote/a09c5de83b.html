<blockquote><p>9. There must be a satisfaction with the terms of the gospel, and the heart must actually close with Christ, as He is offered in the gospel. The heart must open to Him, and take Him in, Rev. 3:20. The soul must embrace and receive Him, John 1:12. The man must take Him, as his Lord and Master King, Priest and Prophet; must give up himself to Him as his Leader and Commander, and resolve to follow Him in all things, and thus close a bargain with Him. … 8. That, as to them, all Christ’s entreaties, motives, allurements, patience and long suffering, his standing at the door and knocking, till his locks be wet with the dew, etc., are in vain: yea, they are contemptuously rejected, despised, slighted, and undervalued.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/john-brown-of-wamphray.html">John Brown of Wamphray</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Christ the Way the Truth &amp; the Life</cite>, (1677), ch. 6</span></figcaption>

</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-588c25032e" data-kw="">
<blockquote><p>The Galatians were truly regenerated, and had received Christ into their hearts: yet their graces were so choked and quenched, that He was as it were without fashion or form: so that the apostle did as it were travail again until Christ was fashioned anew in them (Gal. 4:19). David also upon the committing of his sin was brought unto that case, that he prayed God to create in him a new spirit (Ps. 51). What, was the Spirit quite gone? No, for by and by after he prays that God would not take his Holy Spirit from him: but the graces thereof were wonderfully decayed, and therefore he desires that they might be renewed. But that none may abuse this doctrine, let us consider what punishments do follow upon the quenching of the Spirit in this sort.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/john-dod.html">John Dod</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Seven Godly &amp; Fruitful Sermons</cite>, … (London: Kyngston, 1614), ‘Of extinguishing the graces of the Spirit’, pp. 202-3</span></figcaption>

</figure><figure class="quote" id="q-59cc75453c" data-kw="">
<blockquote><p>By the name of ‘door‘ [in Rev. 3:20], he means man’s heart. That does the Lord knock at by the preaching of his Word, crying out and bearing witness of the force and effectualness of it to our spirit. And the same preaching is never fruitless. For the godly receive comfort by it, and the ungodly are condemned by it.</p></blockquote>

<blockquote><p>‘Behold I stand at the door and knock, etc.’ Here is yet further kindness declared: the Lord stands at the door knocking to be let in. He is the Good Shepherd, He seeks up that which goes astray, He stands knocking at the door of man’s heart to enter and to make it his temple to dwell in. Mark here diverse things: As first that the Lord does not only knock and call at the door of man’s heart, but continues the same: for He stands at the door, and has stood at the door, as the word imports. This is much that He must wait upon us, moving us to receive Him: but the truth is, we never have any mind of Him but when He does stand knocking at the door of our heart. Then further behold how difficult a thing it is for the heart of man to receive Christ and to be turned to God… we are so fast asleep that He may knock and knock again, we regard Him not. But let us take heed, for albeit his kindness is marvellous, yet He will not always offer Himself, nor always be found… Be not therefore too bold with Him: if He have by his Word and by the motions of his Spirit, stood daily knocking at the door of thy heart, showing thy sins and moving thee to repentance, and thou hast made light thereof, take heed lest those knockings of his cease and thine heart be more hardened, so that there is no feeling of any godly sorrow unto repentance. Make much of this knocking, make much of these motions of the Spirit, for many that have had great remorse and beginnings for to repent, are now hardened and boldened in sin. Most miserable are they which despise his knocking and drive Him away. On the contrary part, they be a thousand times blessed which open unto Him, and so receive Him. For mark what He says, ‘If any do hear my voice, and open the door, I will come in to him, and will sup with him, and he with Me.’ What more happy guest can be received in? what good thing can be wanting where He is? If Christ dwell in the heart by faith, if the graces and power of Christ be received in, all evil and misery is driven out, and all goodness and felicity do succeed. Darkness is driven out, the Devil is expelled, sin is destroyed and horror of the dreadful judgment does vanish away. There is light, there is God, there is righteousness, and peace and joy of the Holy Ghost. Full notably does the prophet David set forth this, Ps. 24, when he says: ‘Lift up your heads ye gates, and be ye lift up ye everlasting doors, and the king of glory shall come in. Who is the king of glory? The Lord strong and mighty, the Lord mighty in battle.’ …He sets it forth that we shall receive all good things by Him, in these words, that ‘if any open the door, He will come in and sup with him, etc.’ He brings all the dainties with Him, and compares it unto a supper, for we shall be fed with them: we shall be even filled abundantly with all sweet joys: this supper shall never be ended. … If any man will say then, how are those former speeches to be construed? Thus you must understand: First, that God works upon the hearts of men, not as men work upon blocks or stones, which have no sense nor understanding: for man has understanding, he has a will, he has affections. Then secondly, that free is opposed to bond, and free is opposed to compelled. In respect of the [latter] one, man has free will, in respect of the other he has not. Man naturally loves and delights in evil, his will not forced or compelled, does choose the same: man despises and rejects the Gospel of his own will. In this respect his will is free unto all evil, that is, he wills evil not compelled, but carried thereunto with pleasure. …The mark what Christ says, ‘No man comes unto Me, unless the Father that sent Me draw him, John 6. This drawing is not by force, but God reforms the will and the affections, so that a man joyfully receives Christ and therefore is said to open the doors of his heart.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/george-gifford.html">George Gifford</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Sermons upon the Whole Book of the Revelation</cite>, (London: Field, 1599), Sermon 10, pp. 109-11 Gifford (1547-1600) was a partially-conforming puritan.</span></figcaption>

im%2C+and+so+receive+Him.+For+mark+what+He+says%2C+%E2%80%98If+any+do+hear+my+voice%2C+and+open+the+door%2C+I+will+come+in+to+him%2C+and+will+sup+with+him%2C+and+he+with+Me.%E2%80%99+What+more+happy+guest+can+be+received+in%3F+what+good+thing+can+be+wanting+where+He+is%3F+If+Christ+dwell+in+the+heart+by+faith%2C+if+the+graces+and+power+of+Christ+be+received+in%2C+all+evil+and+misery+is+driven+out%2C+and+all+goodness+and+felicity+do+succeed.+Darkness+is+driven+out%2C+the+Devil+is+expelled%2C+sin+is+destroyed+and+horror+of+the+dreadful+judgment+does+vanish+away.+There+is+light%2C+there+is+God%2C+there+is+righteousness%2C+and+peace+and+joy+of+the+Holy+Ghost.+Full+notably+does+the+prophet+David+set+forth+this%2C+Ps.+24%2C+when+he+says%3A+%E2%80%98Lift+up+your+heads+ye+gates%2C+and+be+ye+lift+up+ye+everlasting+doors%2C+and+the+king+of+glory+shall+come+in.+Who+is+the+king+of+glory%3F+The+Lord+strong+and+mighty%2C+the+Lord+mighty+in+battle.%E2%80%99+%E2%80%A6He+sets+it+forth+that+we+shall+receive+all+good+things+by+Him%2C+in+these+words%2C+that+%E2%80%98if+any+open+the+door%2C+He+will+come+in+and+sup+with+him%2C+etc.%E2%80%99+He+brings+all+the+dainties+with+Him%2C+and+compares+it+unto+a+supper%2C+for+we+shall+be+fed+with+them%3A+we+shall+be+even+filled+abundantly+with+all+sweet+joys%3A+this+supper+shall+never+be+ended.+%E2%80%A6+If+any+man+will+say+then%2C+how+are+those+former+speeches+to+be+construed%3F+Thus+you+must+understand%3A+First%2C+that+God+works+upon+the+hearts+of+men%2C+not+as+men+work+upon+blocks+or+stones%2C+which+have+no+sense+nor+understanding%3A+for+man+has+understanding%2C+he+has+a+will%2C+he+has+affections.+Then+secondly%2C+that+free+is+opposed+to+bond%2C+and+free+is+opposed+to+compelled.+In+respect+of+the+%5Blatter%5D+one%2C+man+has+free+will%2C+in+respect+of+the+other+he+has+not.+Man+naturally+loves+and+delights+in+evil%2C+his+will+not+forced+or+compelled%2C+does+choose+the+same%3A+man+despises+and+rejects+the+Gospel+of+his+own+will.+In+this+respect+his+will+is+free+unto+all+evil%2C+that+is%2C+he+wills+evil+not+compelled%2C+but+carried+thereunto+with+pleasure.+%E2%80%A6The+mark+what+Christ+says%2C+%E2%80%98No+man+comes+unto+Me%2C+unless+the+Father+that+sent+Me+draw+him%2C+John+6.+This+drawing+is+not+by+force%2C+but+God+reforms+the+will+and+the+affections%2C+so+that+a+man+joyfully+receives+Christ+and+therefore+is+said+to+open+the+doors+of+his+heart.%E2%80%9D%0A%0A%E2%80%94+George+Gifford%2C+Sermons+upon+the+Whole+Book+of+the+Revelation+%28London%3A+Field%2C+1599%29%2C+Sermon+10%2C+pp.+109-11+Gifford+%281547-1600%29+was+a+partially-conforming+puritan.&amp;url=https%3A%2F%2F5solasquotes.github.io%2Fquote%2F6f6e4a9720.html&amp;via=5Solas" target="_blank" rel="noopener">Share on X</a><a class="perma" href="../quote/6f6e4a9720.html">Permalink</a><a class="src" href="https://reformedbooksonline.com/let-jesus-come-into-your-heart/#:~:text=Behold%20I%20stand%20at%20the%20door,open%20the%20doors%20of%20his%20heart&amp;text=Behold%20I%20stand%20at%20the%20door%20and%20knock&amp;text=said%20to%20open%20the%20doors%20of%20his%20heart" rel="noopener" target="_blank">Read it online · Reformed Books Online</a></div>

<blockquote><p>3. You must open your hearts and give entertainment unto Christ, if you ever expect to have the gate of Heaven opened unto you, and to be entertained by Christ in his Kingdom. Such as shut the door of their hearts against Christ when they are young, will find (if Christ does not withdraw, and leave knocking) that the door will be faster bolted and barred within against Him; the longer you hold it out, the more will Satan strengthen the fort against Christ, and more easily beat off whatever assaults are made upon you by the Word and Spirit. Christ will come in most willingly to them that open to Him presently; and the match will quickly be made up, if in youth you hearken to the motion. Let me beseech you, therefore, my dearly beloved young ones, to open the door to Christ without any further delay; by me He stands now and knocks for entertainment; what answer shall I return, that you have harbored lusts there, where his lodging should be, and would not part with them? that you put me off till a further day, until you had a little longer tasted the sweets of sin: O take heed of such carriage of heart towards Christ, Qui non est hodie, cras minus aptus erit, if you be not willing to open to Christ now, you will be more unwilling tomorrow: do it then presently; may I be instrumental to join the Lord Jesus Christ and you together in marriage; receive Him into your hearts, and accept of Him, to love, honor, and obey Him, and do it heartily and resolvedly, and He is yours.</p></blockquote>

<blockquote><p>The intended scope of it [Ps. 24] may be considered literally and mystically: … 2. Mystically, according to the spiritual mystery and truth intended, it is; To set out the kingdom of Christ, generally over the whole world, but peculiarly over his Church and saints, described by their properties, and dignified with great privileges; and to incite all to open the gates of their hearts, with up-lifted joy, to entertain this King.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/francis-roberts.html">Francis Roberts</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Clavis Bibliorum, or ‘The Key of the Bible’</cite>, … (1648; London: J.R., 1675), on Ps. 24, p. 873</span></figcaption>

</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-3845f27f7c" data-kw="">
<blockquote><p>‘Behold, I stand at the door’ of your heart and ‘knock: Open to Me, my sister, my love, my undefiled; for my head is filled with the dew, and my locks with the drops of the night.’… ‘When He waits to be gracious, and exalts Himself to show mercy.’ why tire out his patience till He ‘shut up all his tender mercies in his wrath?’ ‘Is it a small thing for you to weary men,’ weary parents, and ministers? ‘But will ye weary my God also?‘</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/john-brown-of-haddington.html">John Brown of Haddington</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Addresses to Children Concerning Salvation</cite>, (Torwood Press, 2013) | “An Address to the Young Readers of this Catechism” (1781), p. 31</span></figcaption>

</figure><figure class="quote" id="q-8255fdcb02" data-kw="">
<blockquote><p>But perchance thou wilt ask: If the opening of the eyes be from God alone, to what purpose shall advice be given to thee, in a matter that lies not in thee, and which is not effected by advice, but by supernatural operation? To this I answer that although the power that must enlighten thee does descend from above, yet usually it does communicate itself unto us by the service of certain means, left with us here below. Again, when grace does first breath upon us, it works by degrees, which degrees being by some neglected, or misconstrued, it has bred unto them a greater difficulty and hardness of travail in the new birth; but being perceived and duly entertained, they turn into testimonials unto us, yea to encouragements unto farther degrees of grace.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/francis-rouse.html">Francis Rous</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Art of Happiness</cite>, ... (London: Stansby, 1619), pt. 3 Rous was a Westminster divine. | 2. ‘How a man may get this faculty which unites man to God’, pp. 228-30</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/effectual-calling/means-of-calling.html">Means of Calling</a></span></div>

</figure><figure class="quote" id="q-819f2324f3" data-kw="">
<blockquote><p>Lastly, justifying faith is such a faith whereby we embrace, entertain, receive, admit Christ, not into our houses, but into our hearts; and whereby conseqently we are united unto Christ, so as that He is said to be in us, and we in Him. ‘To as many as received Him,’ says He, ‘He gave this priviledge to become the sons of God, even to those that beleive in his name.’ Where to ‘receive Him,’ is to give Him entertainment, not so much in their houses, which Matthew, Zacheus, and others of them also did, as in their hearts: according to that of the apostle, ‘that Christ may dwell in your hearts by faith,’ Eph. 3:17. Whence it is that they that are in the faith, are said to have Christ in them. ‘Examine yourselves,’ says the apostle, ‘whether ye be in the Faith: do you not know that Christ is in you?’ 2 Cor. 13:5, thereby implying that if they be in the faith, then Christ is in them… we cannot with any good ground rely on Him or trust Him for the discharge of us from the guilt of our sins, unless we be content to receive, and do willingly embrace Him, on such terms as God offers Him, and as He offers Himself unto us, and on no other terms than these is He offered unto any. But a man may believe that Christ is the Savior of the world, yea that he cannot be saved but by Christ, and yet for all that may refuse to receive Him and yield himself up unto Him, because he mislikes the conditions on which He is tendered unto Him, or delay to do it at present, in hope that he may timely enough do it hereafter. As when a company of rebels are up in arms against their leige lord, and a proclamation of pardon and impunity is published by him unto all such of them as will lay down their arms, put themselves upon his mercy, acknowledge their offence and by solemn oath engage themselves to due allegiance and constant obedience for the future; albeit that they all know him to be their lawful sovereign, and believe that he will be as good as his word to all that so accept of it, nor know which way to escape, but that first or last they shal be surprised, if they do stand out, and have execution done upon them; yet there may be diverse among them that will choose rather to persist in their rebellious courses, or refuse at least to yield themselves up to him and to accept of his gracious offer, either out of a stoutness of stomach and a stifness of self-will, or out of an extreme malice and inveterate hatred against the person of their prince, or out of a strong affection to some adverse party, or out of a fond conceit that they may keep for some good space of time out of the way, undiscovered and unsurprised, or that when they perceive themselves near to be attached, they may then by a tender of themselves attain the benefit of the offer, there being no limitation of time mentioned in it. In the same manner: although a man do beleive that Jesus is the Savior of mankind, and that there is no way for him to attain salvation but by Christ, yet for all that may he refuse to receive Christ for his Lord and Savior or to accept of salvation by Christ, because he mislikes the conditions upon and under which Christ and salvation by Christ is offered and tendred unto him, and without which it cannot be had. But what are those terms, that are so necessarily reqired, and with so much difficulty received? Why these are: ‘If any man will come after me, says our Savior, [Greek], let him utterly deny himself,’ Mt. 16:24… he must not be his own man anymore, but he must in resolution at least be Christ’s alone, wholly at his command, will and disposal… This word or saying, that Christ came to save sinners, it is a sure saying, such as we may write and rest upon it, we may with good ground afford credit unto it, yea and it is withal a very acceptable saying, a saying worthy of all acceptance, 1 Tim. 1:15, and indeed who would not accept of such a gracious offer? would not willingly and gladly entertain such tidings, the glad tidings of salvation, and of salvation not temporal, but eternal? See Isa. 52:7; Nah. 1:15; Rom. 10:15, yea but what is the reason then that this so acceptable message finds so little acceptance in the world, that so few do accept of it? that when this Savior came unto his own, He found so sorry welcome among them, his own refused to receive Him? Jn. 1:11. It is not in the thing offered; that no damned wretch in Hell would refuse to accept; but it is in the terms whereupon the offer is made and tendred, which mans corrupt nature will in no wise condescend unto… The stoutness, or hautiness of the flesh, of man’s carnal heart or mind (and there is an emphasis also in the word ‘flesh’, which of itself has an intimation of infirmity and weakness, Gen. 6:3; Heb. 5:7, yea sometime of a pliable and yeilding disposition, apt to receive any but slight impression, Eze. 36:26; 2 Cor. 3:3, that such a sorry peice of flesh as man’s heart is, should be so stiff, and so stubborn) is enmity against God; not averse to him, but enmity itself against him; stands out in such defiance against Him, and whatsoever He wills and enjoins, that it neither does submit itself, nor can be subjected unto his law…</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/thomas-gataker.html">Thomas Gataker</a></span><span class="wk"><span class="lbl">Work:</span> <cite>An Antidote Against Error Concerning Justification</cite>, … (d.1654; London: Brome, 1670), pp. 50-54</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/effectual-calling/means-of-calling.html">Means of Calling</a></span></div>

nity+is+published+by+him+unto+all+such+of+them+as+will+lay+down+their+arms%2C+put+themselves+upon+his+mercy%2C+acknowledge+their+offence+and+by+solemn+oath+engage+themselves+to+due+allegiance+and+constant+obedience+for+the+future%3B+albeit+that+they+all+know+him+to+be+their+lawful+sovereign%2C+and+believe+that+he+will+be+as+good+as+his+word+to+all+that+so+accept+of+it%2C+nor+know+which+way+to+escape%2C+but+that+first+or+last+they+shal+be+surprised%2C+if+they+do+stand+out%2C+and+have+execution+done+upon+them%3B+yet+there+may+be+diverse+among+them+that+will+choose+rather+to+persist+in+their+rebellious+courses%2C+or+refuse+at+least+to+yield+themselves+up+to+him+and+to+accept+of+his+gracious+offer%2C+either+out+of+a+stoutness+of+stomach+and+a+stifness+of+self-will%2C+or+out+of+an+extreme+malice+and+inveterate+hatred+against+the+person+of+their+prince%2C+or+out+of+a+strong+affection+to+some+adverse+party%2C+or+out+of+a+fond+conceit+that+they+may+keep+for+some+good+space+of+time+out+of+the+way%2C+undiscovered+and+unsurprised%2C+or+that+when+they+perceive+themselves+near+to+be+attached%2C+they+may+then+by+a+tender+of+themselves+attain+the+benefit+of+the+offer%2C+there+being+no+limitation+of+time+mentioned+in+it.+In+the+same+manner%3A+although+a+man+do+beleive+that+Jesus+is+the+Savior+of+mankind%2C+and+that+there+is+no+way+for+him+to+attain+salvation+but+by+Christ%2C+yet+for+all+that+may+he+refuse+to+receive+Christ+for+his+Lord+and+Savior+or+to+accept+of+salvation+by+Christ%2C+because+he+mislikes+the+conditions+upon+and+under+which+Christ+and+salvation+by+Christ+is+offered+and+tendred+unto+him%2C+and+without+which+it+cannot+be+had.+But+what+are+those+terms%2C+that+are+so+necessarily+reqired%2C+and+with+so+much+difficulty+received%3F+Why+these+are%3A+%E2%80%98If+any+man+will+come+after+me%2C+says+our+Savior%2C+%5BGreek%5D%2C+let+him+utterly+deny+himself%2C%E2%80%99+Mt.+16%3A24%E2%80%A6+he+must+not+be+his+own+man+anymore%2C+but+he+must+in+resolution+at+least+be+Christ%E2%80%99s+alone%2C+wholly+at+his+command%2C+will+and+disposal%E2%80%A6+This+word+or+saying%2C+that+Christ+came+to+save+sinners%2C+it+is+a+sure+saying%2C+such+as+we+may+write+and+rest+upon+it%2C+we+may+with+good+ground+afford+credit+unto+it%2C+yea+and+it+is+withal+a+very+acceptable+saying%2C+a+saying+worthy+of+all+acceptance%2C+1+Tim.+1%3A15%2C+and+indeed+who+would+not+accept+of+such+a+gracious+offer%3F+would+not+willingly+and+gladly+entertain+such+tidings%2C+the+glad+tidings+of+salvation%2C+and+of+salvation+not+temporal%2C+but+eternal%3F+See+Isa.+52%3A7%3B+Nah.+1%3A15%3B+Rom.+10%3A15%2C+yea+but+what+is+the+reason+then+that+this+so+acceptable+message+finds+so+little+acceptance+in+the+world%2C+that+so+few+do+accept+of+it%3F+that+when+this+Savior+came+unto+his+own%2C+He+found+so+sorry+welcome+among+them%2C+his+own+refused+to+receive+Him%3F+Jn.+1%3A11.+It+is+not+in+the+thing+offered%3B+that+no+damned+wretch+in+Hell+would+refuse+to+accept%3B+but+it+is+in+the+terms+whereupon+the+offer+is+made+and+tendred%2C+which+mans+corrupt+nature+will+in+no+wise+condescend+unto%E2%80%A6+The+stoutness%2C+or+hautiness+of+the+flesh%2C+of+man%E2%80%99s+carnal+heart+or+mind+%28and+there+is+an+emphasis+also+in+the+word+%E2%80%98flesh%E2%80%99%2C+which+of+itself+has+an+intimation+of+infirmity+and+weakness%2C+Gen.+6%3A3%3B+Heb.+5%3A7%2C+yea+sometime+of+a+pliable+and+yeilding+disposition%2C+apt+to+receive+any+but+slight+impression%2C+Eze.+36%3A26%3B+2+Cor.+3%3A3%2C+that+such+a+sorry+peice+of+flesh+as+man%E2%80%99s+heart+is%2C+should+be+so+stiff%2C+and+so+stubborn%29+is+enmity+against+God%3B+not+averse+to+him%2C+but+enmity+itself+against+him%3B+stands+out+in+such+defiance+against+Him%2C+and+whatsoever+He+wills+and+enjoins%2C+that+it+neither+does+submit+itself%2C+nor+can+be+subjected+unto+his+law%E2%80%A6%E2%80%9D%0A%0A%E2%80%94+Thomas+Gataker%2C+An+Antidote+Against+Error+Concerning+Justification%E2%80%A6+%28d.1654%3B+London%3A+Brome%2C+1670%29%2C+pp.+50-54&amp;url=https%3A%2F%2F5solasquotes.github.io%2 <blockquote><p>‘That knocketh.’ moving my heart by secret inspirations, to give full admittance and entrance to his grace and virtues, Rev. 3:20. ‘Open to me.’ receive Me in thine heart, by a lively act of faith, for it is mine only place of refuge and abode upon earth, out of which I find nothing but annoyance and displeasure in the world.</p></blockquote>

<main class="wrap"><figure class="quote" id="q-a8b60674fd" data-kw="">
<blockquote><p>For in proportion as God is harder to trace out than man, so is the heavenly Generation harder to comprehend than your own. But if you assert that because you cannot comprehend it, therefore He cannot have been begotten, it will be time for you to strike out many existing things which you cannot comprehend; and first of all God Himself. … The Begetting of God must be honoured by silence. It is a great thing for you to learn that He was begotten. But the manner of His generation we will not admit that even Angels can conceive, much less you.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/gregory-of-nazianzus.html">Gregory of Nazianzus</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Five Theological Orations</cite>, (379), 3.8 in Nicene and Post-Nicene Fathers 2, 7: 303.</span></figcaption>

</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-8f063fc02f" data-kw="">
<blockquote><p>For the letter (i.e. the law) killeth, but the spirit (i.e. the gospel) giveth life. This is the reason why God hath made Paul the minister of the spirit. ‘God had made us able ministers not of the law but of the gospel, for the law kills, but the gospel gives life.’ This passage and the following context present two important questions. First, in what sense does the law kill? And second, How is it that the apostle attributes to the Mosaic system this purely legal character, when he elsewhere so plainly teaches that the gospel was witnessed or taught both in the law and the prophets? As to the former of these questions, the answer furnished by the Scriptures is plain. The law demands perfect obedience. It says, “Do this and live,” Rom. 10:5; Gal. 3:12, and “Cursed is every one who continueth not in all things written in the book of the law to do them,” Gal. 3:10. As no man renders this perfect obedience, the law condemns him. It pronounces on him the sentence of death. This is one way in which it kills. In the second place, it produces the knowledge or consciousness of sin, and of course of guilt, that is, of just exposure to the wrath of God. Thus again it slays. And thirdly, by presenting the perfect standard of duty, which cannot be seen without awakening the sense of obligation to be conformed to it, while it imparts no disposition or power to obey, it exasperates the soul and thus again it brings forth fruit unto death. All these effects of the law are systematically presented by the apostle in the 6th and 7th chapters of his epistle to the Romans, and in the 3d chapter of the epistle to the Galatians.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/charles-hodge.html">Charles Hodge</a></span><span class="wk"><span class="lbl">Work:</span> <cite>An Exposition of the Second Epistle to the Corinthians</cite>, (New York: A. C. Armstrong &amp; Son, 1891), 56.</span></figcaption>

</figure><figure class="quote" id="q-976d44672a" data-kw="">
<blockquote><p>The eternal Sonship of Christ, or that he is the Son of God by eternal generation, or that he was the Son of God before he was the son of Mary, even from all eternity, which is denied by the Socinians, and others akin to them, was known by the saints under the Old Testament; by David (Ps. 2:7, 12); by Solomon (Prov. 8:22, 30), by the prophet Micah, chapter 5, verse 2.

His Sonship was known by Daniel, from whom it is probable Nebuchadnezzar had it (Dan. 3:25), from which it appears he was, and was known to be, the Son of God before he was born of the virgin, or before his incarnation, and therefore not called so on that account. This truth is written as with a sun-beam in the New Testament …</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/john-gill.html">John Gill</a></span><span class="wk"><span class="lbl">Work:</span> <cite>A Dissertation</cite>, Concerning the Eternal Sonship of Christ; Shewing by whom it has been denied and opposed, and by whom asserted and defended, in all ages of Christianity in A Collection of Sermons and Tracts: In Two Volumes (2 vols, London: George Keith, 1773), 2: 534.</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/the-trinity.html">The Trinity</a></span></div>

</figure><figure class="quote" id="q-b5fa971209" data-kw="">
<blockquote><p>How many ways is the name of God taken in the Scriptures?

Two ways: properly for the substance, essence, and nature: and improperly. Now it is taken properly, or for the essence, when it is taken without the distinction of any one of the persons, as Joh. 4.24. God is a spirit, where God is taken for the whole essence of the Deity, as is also the name Jehovah.

Or else, personally, when there is joined unto the name of God the name of the person: as God the Father, God the Son, God the holy Ghost. Or when the Father is opposed to the Son, who is very God, and the second Person in the Trinity, as Rom. 7.25. I thank God by Jesus Christ. So Rom. 8.3 the Father is called God, the word Father being used personally, because the Person sending is opposed to the Person sent.

Improperly, when it is attributed to Angels or men: and truly, either in regard of their office, or else in respect of the revealing of the will of God, and of their reverence: falsely, either by error; or else by usurpation and custom, as 1. Cor. 8.5. or else by worshipping them. 2. Cor. 4.4. Phil. 3.19.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/guillaume-bucanus.html">Guillaume Bucanus</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Institutions of Christian religion framed out of God’s word, and the writings of the best divines, methodically handled by questions and answers, fit for all such as desire to know, or practise the will of God</cite>, trans. Robert Hill (London: George Snowdon and Leonell Snowdon, 1606), p. 5.</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/the-trinity.html">The Trinity</a></span></div>

</figure><figure class="quote" id="q-8823651c54" data-kw="">
<blockquote><p>This union [of the person of the Son with the human nature in the inarnation] can be viewed either in respect of the principle or in respect of the terminus. In the former sense, it is attributed to the whole Trinity, by the power of which such union is made (to wit, by a transient action of God by which he united in the person of the Logos, the humanity of Christ). In the latter, it belongs to the Logos alone because it is terminated on him. Although the person of the Logos may well be said to have been incarnate, yet the Trinity itself may not because the incarnation is not terminated on the divine nature absolutely, but on the person of the Logos relatively.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/francis-turretin.html">Francis Turretin</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Institutes of Elenctic Theology</cite>, (P&amp;R), vol. 2, 13th Topic, Question 6, section 4, p. 311</span></figcaption>

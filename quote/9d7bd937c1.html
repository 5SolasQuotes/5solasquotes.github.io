<main class="wrap"><figure class="quote" id="q-9d7bd937c1" data-kw="">
<blockquote><p>Predestination &amp; Reprobation Contrasted 1. The [Westminster] Confession does not teach or imply a double predestination. In an attempt to distinguish between election and reprobation we should use predestination for the elect and foreordination for the reprobate [as the Confession does]. 2. Election and reprobation rest on different grounds: election on the redeeming love of God that undertakes the salvation of the lost; reprobation on the moral necessity to manifest to the universe the nature and consequences of sin in moral personality. 3. Means are used of God to fulfil the purpose of election, but God uses no means to fulfil His purpose of reprobation. It is left to sin to run its course and receive its wages. 4. The fruits of election are attributable to divine grace, the fruits of reprobation to personal sin. This means that while there is grace to some, there is injustice to none. 5. While God finds pleasure in the salvation of the elect, He has sworn by Himself that He has no pleasure in the death of the wicked. God does not need sin or its retribution for His self-manifestation, but its reality in the universe can serve that end. 6. That the elect will constitute a recreation of the race under a new Head is evident, while the reprobate are but the branches cut off from the tree of humanity. Christ will be revealed as the Savior of the world, though many are lost in the process.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/r-a-finlayson.html">R.A. Finlayson</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Reformed Theological Writings of R.A. Finlayson</cite>, p. 265. Finlayson was a Free Church of Scotland professor during the mid-1900’s.</span></figcaption>

<blockquote><p>Whether, according to our manner of conceiving, we distinguish that decree into several [acts], or whether we say that it is one [act], it is not much to be concerned about. For it is certain among all, that God willed all things and each individual thing by one most simple act of His will. For His will, and the operation of His will, is the same as his simple and undivided essence. If someone were to contend that even according to our manner of understanding, there is one single most simple act of the will, I would not be concerned.</p></blockquote>

<blockquote><p>Sovereignty is a comprehensive term. It contains several elements. First it denotes supremacy. A sovereign ruler is supreme in his dominions. All other rulers are under him. Secondly, sovereignty denotes independence. Says Woolsey, ‘In the intercourse of nations certain states have a position of entire independence of others. They have the power of self-government, that is, of independence of all other states as far as their own territory and citizens are concerned. This power of independent action in external and internal relations constitutes complete sovereignty.’ (Political Science, i., 204) Thirdly, sovereignty denotes optional power; that is, the power to act or not in a given instance. It is more particularly with reference to this latter characteristic of free alternative decision, that ‘the sovereignty of God in election’ is spoken of. In his election of a sinner to salvation, God as supreme, independent, and sovereign, acts with entire liberty of decision, and not as obliged and shut up to one course of action. This is the common understanding and definition of sovereignty as applied to decisions and acts. Says Blackstone [one of the most influential writers on English law]: ‘By the sovereign power is meant the power of making laws; for wherever that power resides all other powers must conform to, and be directed by it, whatever appearance the outward form and administration of the government may put on. For it is at any time in the option of the legislature to alter that form and administration by a new edict or rule, and put the execution of the law into whatever hands it pleases, by constituting one, or a few, or many executive magistrates.’ (Introduction, 2) Blackstone gives the same definition of sovereignty, when it is vested in a king (Book II., ch. vii.). The king has no superior to oblige or compel him to one course of action. He has independent and optional power.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/william-g-t-shedd.html">William G.T. Shedd</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Calvinism: Pure &amp; Mixed</cite>, (1893; Banner of Truth, 1993), pp. 70-71</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/election/nature-of-election.html">Nature of Election</a></span></div>

</figure><figure class="quote" id="q-5f317cf4ce" data-kw="">
<blockquote><p>Of what sort of men is election? Of such as are uncleane and ungodly in the sight of God. “For He has chosen us that we might be holy and without blame,” Eph. 1:4. But whereas He chose us before the world was made, it is effected that God set before his eyes all men that ever should be, and for as much as they would be ungodly and accursed, He likewise so considered them and so chose some out of the common lump and filth of men, and those freely according to the good pleasure of his will, leaving others in their sin and curse.</p></blockquote>

<blockquote><p>2. That the only moving and efficient cause of election and predestination unto life is the mere good pleasure and grace of God, not the consideration of any foreseen faith, perseverance, good works, good will, good endeavors, or any other quality or condition whatsoever in the persons elected. 3. That though sin be the only cause of damnation, yet the sole and primary cause of reprobation or non-election (that is, why God does pass by this man rather than another, why He rejected Esau, when He elected Jacob) is the mere freewill and pleasure of God: not the confideration or foresight of any actual sin, infidelity, or final impenitency in the persons rejected.</p></blockquote>

<main class="wrap"><figure class="quote" id="q-ca2ec41da4" data-kw="">
<blockquote><p>If it be demanded how the worship of God should be a sin in any man, considering it is so commanded, I answer sins be of two sorts: The first is when something is done that is flat contrary to the commandment of God; the second is when that is done which God commands, but not in that manner God commands.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/william-perkins.html">William Perkins</a></span><span class="wk"><span class="lbl">Work:</span> <cite>“A Warning Against the Idolatry of the Last Times, &amp; an Instruction touching Religious or Divine Worship’ in The Works (d. 1602; London: Legatt, 1626), vol. 1</cite>, p. 700</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/worship/impurities-in-worship.html">Impurities in Worship</a></span></div>

</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-e20ef78ad3" data-kw="">
<blockquote><p>He [Owen] intimates that it is not in our power to close with some and not withal. This is his first error. Though man give us no such power, God does: as it is in my power to believe all that one speaks truly and well, and not that which he speaks amiss. I am not bound to own all that any preacher or priest shall say in the church. God put it in the disciples’ power to beware of the leaven of the Pharisees [Mt. 16:6], and yet to hear them [Mt. 23:1-3]. Proving all things [1 Thess. 5:21] is not approving all things.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/richard-baxter.html">Richard Baxter</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Richard Baxter on Worship &amp; Catholicity against Separatism &amp; John Owen (1684; RBO, 2024)</cite>, p. 25</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/worship/impurities-in-worship.html">Impurities in Worship</a></span></div>

</figure><figure class="quote" id="q-dd7b17c97f" data-kw="">
<blockquote><p>Verse 17… ‘Why did ye not eat?’ They ought to eat this he-goat, Lev. 6:16, which, when they were not able on account of grief, they supposed was to be burned ([Cornelius] Lapide). … Verse 19… ‘How was I able to eat, etc.?’… that is to say, I was not, therefore, worthy or fit, who should eat. See Dt. 12:7; 26:14; Hos. 9:4 ([Henry] Ainsworth). Therefore, it was to be burned, as was done with the rest (Bonfrerius)… Some maintain that Aaron justifies himself (thus Lyra, Bonfrerius). This does not satisfy; for Moses blames this. It was rather a mitigation of the crime, than a just defense ([Andrew] Willet)… Verse 20: ‘And when Moses heard that, he was content’; ‘He received satisfaction’ Hebrew: ‘it was good, etc.’ Moses received the excuse as just (Menochius, Lapide, Ainsworth). For often the letter of the Law yields to necessities: 2 Chron. 30:18, etc.; Mt. 12:3, 4 (Ainsworth). [Others deny this:] Rather in human compassion he tolerates the infirmities of Aaron (Willet out of [Martin Cellarius] Borrhaus [d. 1564]). Because Aaron had recognized the defect, and because he was unwilling to add affliction to the afflicted (Lyra); and he discerned that the evil was lesser (Willet out of Calvin).</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/matthew-poole.html">Matthew Poole</a></span><span class="wk"><span class="lbl">Work:</span> <cite>A Synopsis of Interpreters, on Lev. 10 in The Exegetical Labors of the Reverend Matthew Poole, vol. 6 (VA: Master Poole Publishing, 2011)</cite>, pp. 152-54</span></figcaption>

<blockquote><p>XL. We are not for preaching when we are forbidden, where there is not a real and evident need of our labors.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/richard-baxter.html">Richard Baxter</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Detailed | The English Nonconformity as under King Charles II &amp; King James II Truly Stated &amp; Argued (London, 1689), ch. 2, pp. 11-16 | We Labor where there is Real Need, which Justifies It</cite></span></figcaption>

</figure><figure class="quote" id="q-50e9332d21" data-kw="">
<blockquote><p>My partaking in any divine worship which is holy and good for the matter, and allowable or passable for the mode in the main, does not involve me in the blame of some sinful defects therein, to which I consent not, and which I cannot redress. 2. I do not acquiesce in this form of worship only, nor do I by my example induce others so to do, seeing in other congregations I both dispense and attend upon the Word and prayer in another form, and judge it necessary for me so to do. 3. It is to me indubitable that this form is so far profitable and edifying, as that merely for the defects found therein, there is no cause of renouncing it or the communion of the Churches for its sake, especially while other prayer and the preaching of the Word is not there by excluded. … I would give no occasion to any of disowning or reproaching a form of divine worship which is sound in the substance thereof, and accepted of God from the sincere, though it be less perfect in diverse material points and less convenient for the mode.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/john-corbet.html">John Corbet</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Nonconformist’s Plea for Lay-Communion with the Church of England, together with a Modest Defense of Ministerial Nonconformity... (London: 1683), The Nonconformists Plea for Lay-Communion with the Church of England</cite>, pp. 6-7, 10</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/worship/impurities-in-worship.html">Impurities in Worship</a></span></div>

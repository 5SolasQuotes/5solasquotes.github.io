<main class="wrap"><figure class="quote" id="q-c796423fd6" data-kw="">
<blockquote><p>The historical source from which the main streams of Perfectionist doctrine that have invaded modern Protestanism take their origin, is the teaching of John Wesley. But John Wesley did not first introduce Perfectionism into Protestantism, nor can all the Perfectionist tendencies which have shown themselves in Protestantism since his day be traced to him. Such tendencies appear constantly along the courses of two fundamental streams of thought. Wherever Mysticism intrudes, it carries a tendency to Perfectionism with it.

On Mystical ground—as for example among the Quakers—a Perfectionism has been developed to which that taught by Wesley shows such similarity, even in details and modes of expression, that a mistaken attempt has been made to discover an immediate genetic connection between them. Wherever again men lapse into an essentially Pelagian mode of thinking concerning the endowments of human nature and the conditions of human action, a Perfectionism similar to that taught by Pelagius himself tends to repeat itself. That is to say, history verifies the correlation of Perfectionism and Libertarianism, and wherever Libertarianism rules the thoughts of men. Perfectionism persistently makes its appearance.

It is to this stream of influence that Wesleyan Perfectionism owes its own origin. Its roots are set historically in the Semi-Pelagian Perfectionism of the Dutch Remonstrants, although its rise was not unaffected by influences of a very similar character and ultimate source which came to it through the channels of Anglo-Catholicism. Its particular differentiation is determined by the supernaturalization which it shares with the whole body of modifications introduced by Wesley into his fundamental Arminianism, from which Wesleyanism, in distinction from the underlying Remonstrantism, has acquired its Evangelical character.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/benjamin-b-warfield.html">Benjamin B. Warfield</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Albrecht Ritschl and his Doctrine of Christian Perfection in Princeton Theological Review</cite></span></figcaption>
<div class="meta"><span class="t"><a href="../topics/sanctification/nature-of-sanctification.html">Nature of Sanctification</a></span></div>

</figure><figure class="quote" id="q-9ffc6d69ce" data-kw="">
<blockquote><p>4. The word ‘sanctification‘ also signifies the same thing for the main as conversion does, only with these small differences following:

1. The word is more comprehensive, for it signifies our whole state of dedication or devotedness to God, which comprehends in it these four things:

1. The change of a man’s qualities, whereby he is made fit for the service of God; having his heart bent towards Him, and set upon Him.

2. The actual dedication or devoting of a man’s self to God by faith and a holy covenant, especially in baptism, by solemn vow or engagement.

3. The relation of a person so dedicated or devoted to God; as he is one set apart to Him for holy uses; and it is from this relation especially that the word ‘sanctification’ is used.

4. The holiness of life that follows hereupon; in the actual living to God, to whom we are devoted. Sanctification comprehends all this, and so comprehends in it vocation and somewhat more.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/richard-baxter.html">Richard Baxter</a></span><span class="wk"><span class="lbl">Work:</span> <cite>A Treatise of Conversion</cite>, … (London: R.W., 1657), ch. 1, sect. 3, p. 9</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/sanctification/nature-of-sanctification.html">Nature of Sanctification</a></span></div>

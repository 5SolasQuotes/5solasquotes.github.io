<blockquote><p>And, first, as to the Nature of this solemn Part of religious Worship, it is to be observed, in the first Place, that we are not to put our personal Covenanting, or National Covenants, in the Room of the Covenant of Grace: Personal Covenanting and national Covenanting are of the same Nature and Kind, and differ only, as the one is transacted by Persons singly and separately considered, and the other by man Persons jointly in a Body: But many mismanage personal Covenanting, and likeways national Covenanting; for too many apprehend, that God, in the Word, declares himself willing to be our God upon certain Terms or Conditions to be performed by us, different from believing the free Promise of the Gospel with Application to ourselves; and therefore they do accordingly make a Covenant with God, taking him for their God upon those Terms to be by them performed in the Strength of Grace, promising and vowing that, if God will be their God, pardon their Sins, and save their Souls, they will, for their Part, be his People, faithfully serve him all the Days of their Lives, watching against all known Sin, and performing every known Duty.

There are some Mistakes here we are to beware of. In the first Place, this is to confound and mingle the Covenant of Grace and our Covenant of Duty together, as if they were the same: The Covenant of Grace was made from Eternity between the Father and the Son: Our Covenant of Duty is to be made when we have taken hold of God’s Covenant of Grace, and never till then are we suitably prepared for this solemn Work.

(2.) This is to bring in ourselves as Parties transacting in the Covenant of Grace. Whereas Christ alone, as the second Adam, was the Party-Contractor in that Covenant upon Man’s Side, as appears from the 89 Psalm throughout. God never did, nor ever will transact with any Sinner of Adam’s Family. There is nothing we can perform, nothing we can implement in this Matter: And how then can we be Transactors in the Covenant of Grace? His Holiness will not permit, his Justice will not allow, his infinite Wisdom will not admit of a Transaction with any Sinner at first Hand.

But (3.) this would be to bring in ourselves, our Doings, or what we are helped to do by Grace, into the conditionary Part of the Covenant of Grace, and so to overthrow the Doctrine of free Grace, to take Christ’s Work our of his Hand, to subvert the only Foundation of the Faith and Hope of perishing Souls, and to disparage the Righteousness of Christ the Second Adam, which is the only proper and real Condition of the Covenant of Grace.</p></blockquote>

<blockquote><p>The number of varying interpretations which have been offered of this passage might well deter one from presenting another. By evincing the fact that its meaning has not been settled, however, it rather acts as an incitement. We do not hope to settle it now; but we wish to contribute our mite. The meaning of the words themselves is simple. That they express primarily the simple thought, “But a mediator is not [in the nature of the case, a mediator] of one [person or party], but God is one,” most men have quickly seen and frankly expressed. That the εἷς must be taken in the same numerical sense as the ἑνὸς seems also plain. But, having got this translation, what does it mean? The following explanation of the contextual flow of argumentation will supply, it is thought, a natural and—may it be hoped?—probably the true account of the matter.

The apostle is arguing that the introduction of the law did not set aside the promise to Abraham. He states that the transaction with Abraham was of the nature of a covenant (v. 17). Now, when men once make a covenant, that covenant is fixed and not liable to alteration or destruction save on consent of both parties (v. 15). The covenant of the promises was made so long ago as Abraham’s day (v. 16), and, as it is incidentally stated, with two parties of the second part, Abraham himself, and his seed, who is explained to be Christ.

It follows, then, that since made with Abraham at that time, it was not liable to be summarily set aside (by the introduction of a law) by God alone four hundred and fifty years after, in the absence of both the parties of the second part, Abraham being dead and his seed not yet come. That a legal method of salvation would make void the promise is evident (v. 17). For, if the inheritance was given to Abraham by promise, as it certainly was, then, to make it to be of law by a new enactment would be to set aside the promise (v. 18).

But, if the law did not set aside the promise, and if the ἐπήγγελται was never meant to be by law—why, it may well be asked, was the law given at all? Verse 19 answers this question. The children of Abraham, provided for in the covenant, had ever since its institution been breaking their covenant engagement—by sinning. Yet, as the covenant could not be disannulled until the coming of the σπέρμα, who was one of its original parties, God could not cast off those children of Abraham. Therefore, on account of these transgressions, — to bring out and make evident their true character as transgressions,—the law was added—a document temporarily (ἄχρις) put forth by one of the parties to declare what was infringement of the covenant engagements, and therefore to stand as witness or norm of action on the other side until the coming of the σπέρμα.

The temporariness of the document was a matter of course; if the σπέρμα on his coming fulfilled the terms of the covenant, this would be full satisfaction for all infringements, and the protest (as it were), necessarily disappeared. Now, the apostle adds that this law was given ἐν χειρὶ μεσίτου. And, notice:—a mediator is not and cannot be a mediator of one party—there must be two concerned in it; yet God is only one party. Therefore, in giving the law by the hand of a mediator God makes an express admission that there were two parties involved, and a consequently implied acknowledgment that a law published only by one of them—so long, therefore, as the seed had not come—could not set aside the promissory covenant. The conclusion is, that the law in the nature of the case and by the direct implication of the method chosen for its publication, could not do away with the promise. It was not an ἐπιδιατάσσομαι, therefore not inconsistent with v. 15; but a simple declaratory document set forth by one party as an exhibit of his covenant rights.

Looking back on the whole argument the apostle asks, v. 21, if the law could, then, be against the promises, and answers, μὴ γένοιτο. No law had ever been given, meant to set aside the promise and offer salvation on other conditions. The law included in the Scriptures was designed, rather, to shut up all under sin—to define and make plain what was a violation of the covenant—and thus to bring all to Christ, the σπέρμα to come, to be according to promise justified through faith in Him. Thus, the law, so far from being κατὰ τῶν ἐπαγγελιῶν (v. 21), is seen to be rather παιδαγωγὸς εἰς Χριστόν (v. 24). And its service is over when the σπέρμα has come (v. 25).</p></blockquote>

wo+parties+involved%2C+and+a+consequently+implied+acknowledgment+that+a+law+published+only+by+one+of+them%E2%80%94so+long%2C+therefore%2C+as+the+seed+had+not+come%E2%80%94could+not+set+aside+the+promissory+covenant.+The+conclusion+is%2C+that+the+law+in+the+nature+of+the+case+and+by+the+direct+implication+of+the+method+chosen+for+its+publication%2C+could+not+do+away+with+the+promise.+It+was+not+an+%E1%BC%90%CF%80%CE%B9%CE%B4%CE%B9%CE%B1%CF%84%CE%AC%CF%83%CF%83%CE%BF%CE%BC%CE%B1%CE%B9%2C+therefore+not+inconsistent+with+v.+15%3B+but+a+simple+declaratory+document+set+forth+by+one+party+as+an+exhibit+of+his+covenant+rights.%0A%0ALooking+back+on+the+whole+argument+the+apostle+asks%2C+v.+21%2C+if+the+law+could%2C+then%2C+be+against+the+promises%2C+and+answers%2C+%CE%BC%E1%BD%B4+%CE%B3%CE%AD%CE%BD%CE%BF%CE%B9%CF%84%CE%BF.+No+law+had+ever+been+given%2C+meant+to+set+aside+the+promise+and+offer+salvation+on+other+conditions.+The+law+included+in+the+Scriptures+was+designed%2C+rather%2C+to+shut+up+all+under+sin%E2%80%94to+define+and+make+plain+what+was+a+violation+of+the+covenant%E2%80%94and+thus+to+bring+all+to+Christ%2C+the+%CF%83%CF%80%CE%AD%CF%81%CE%BC%CE%B1+to+come%2C+to+be+according+to+promise+justified+through+faith+in+Him.+Thus%2C+the+law%2C+so+far+from+being+%CE%BA%CE%B1%CF%84%E1%BD%B0+%CF%84%E1%BF%B6%CE%BD+%E1%BC%90%CF%80%CE%B1%CE%B3%CE%B3%CE%B5%CE%BB%CE%B9%E1%BF%B6%CE%BD+%28v.+21%29%2C+is+seen+to+be+rather+%CF%80%CE%B1%CE%B9%CE%B4%CE%B1%CE%B3%CF%89%CE%B3%E1%BD%B8%CF%82+%CE%B5%E1%BC%B0%CF%82+%CE%A7%CF%81%CE%B9%CF%83%CF%84%CF%8C%CE%BD+%28v.+24%29.+And+its+service+is+over+when+the+%CF%83%CF%80%CE%AD%CF%81%CE%BC%CE%B1+has+come+%28v.+25%29.%E2%80%9D%0A%0A%E2%80%94+Benjamin+B.+Warfield%2C+Galatians+III.+20+in+Presbyterian+Review&amp;url=https%3A%2F%2F5solasquotes.github.io%2Fquote%2F4fc6e228d1.html&amp;via=5Solas" target="_blank" rel="noopener">Share on X</a><a class="perma" href="../quote/4fc6e228d1.html">Permalink</a><a class="src" href="https://reformedcovenanter.wordpress.com/2021/11/07/b-b-warfield-on-galatians-320/" rel="noopener" target="_blank">Read it online · Reformed Covenanter</a></div>
</figure><figure class="quote" id="q-acc30bbf0b" data-kw="">
<blockquote><p>I find that the covenant of God is of two sorts. One is general, an other is special and everlasting. The general covenant is that which he hade with his whole frame of the earth and all that dwelleth therein, as well beasts as men, with the day also and the night, winter and summer, cold and heat, seed time and harvest …

The special and everlasting covenant, is the same which he hath vouchsafed to make with his elect and believing.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/wolfgang-musculus.html">Wolfgang Musculus</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Common Places of Christian Religion</cite>, trans. John Man (London: Henry Bynneman, 1578), ff. 284, 285.</span></figcaption>

</figure><figure class="quote" id="q-8d12b48f1a" data-kw="">
<blockquote><p>For the promise is to you and to your children (Acts 2:39)

Have infants now under Christ no privilege nor covenant grace external by their birth and descent from believing parents? Answer: Sure they have. For Acts 2:39, the promise is to you and to your children. Either to all children or to some, the text makes no exception. If it be said to all conditionally, if they believe, not absolutely?

Answer: That must be an internal covenanting proper to the elect, and the promise is not made to the aged but conditionally, so they [Anabaptists] believe. And yet the promise shall be made to infants and children, but not while they come to age. To be cut off and cast out of the covenant is a dreadful judgment, Zechariah 11:9; Hosea 2:3-5; Romans 11:20, well, because of unbelief they are broken off. Then because the Jews believe in Christ already come, all their children, for no fault, but for the belief of their parents, must be cut off. Whereas Paul makes it a misery that the Ephesians, Ephesians 2:12, were strangers from the covenants of promise, saving no hope and without God, without Christ.

And Peter, that the Gentiles were no people, 1 Peter 2, then that misery lies upon the infants of Christians and all within the visible church, until they be converted and baptized, and the Gospel is no favour to them, that they are within the net, and in the office house of Grace the visible church where the word preached to children, who are to be taught, Genesis 18:19; Deuteronomy 6:7; Exodus 12:26, 27; Psalm 78:1-7; 2 Timothy 3:15, and the Lord reckons it among the favours, that he bestows not on every nation but only on his own covenanted Israel, that the Word of the Gospel to gather them and their children, Matthew 23:37; 2 Timothy 3:15; Psalm 78:1-5, and his statutes and judgments are declared and preached to them, Romans 3:1, 2; Romans 9:4, the promises and the giving of the Law, and the covenants and the service of God. And this is a special blessing in the New Testament to old and young is clear from Acts 13 when Paul turns from the blaspheming Jews to the Gentiles. Acts 13:47, I have set thee to be a light to the Gentiles, that thou shouldest be for salvation to the end of the earth. Now this covenant salvation is, Isaiah 49:6, 8-9, I will give thee to restore the preserved of Israel, I will give thee for a covenant to the people to establish the earth. That thou mayest say to the prisoners go forth, etc.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/samuel-rutherford.html">Samuel Rutherford</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The covenant of life opened; or, a treatise of the covenant of grace</cite>, ed. C. M. McMahon (1654; New Lennox IL, 2005), pp 133-4.</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/the-covenant-of-grace.html">The Covenant of Grace</a></span></div>

</figure><figure class="quote" id="q-6431a663f2" data-kw="">
<blockquote><p>Now such a Surety every way did Christ become unto God for us, both to pay the debt, by undergoing death in our stead, and so to satisfy God; and then as the Heir, to execute his will and testament.

He became Surety of the whole covenant, and every condition in it, take it in the largest sense; and this of all, both on God’s part, and on ours. For us he undertook to God to work all our works, and undergo all our punishments; to pay our debts for us, and to work in us all that God required should be done by us, in the covenant of grace.</p></blockquote>

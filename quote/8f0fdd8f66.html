<blockquote><p>But if we attend to the four kinds of causes which philosophers bring under our view in regard to effects, we shall find that not one of them is applicable to works as a cause of salvation. The efficient cause of our eternal salvation the Scripture uniformly proclaims to be the mercy and free love of the heavenly Father towards us; the material cause to be Christ, with the obedience by which he purchased righteousness for us; and what can the formal or instrumental cause be but faith?</p></blockquote>

</figure><figure class="quote" id="q-f9fcbf0eda" data-kw="">
<blockquote><p>13. But the doers of the Law will be justified. This passage is interpreted in a twofold way by blessed Augustine in chapter 26 of On the Spirit and the Letter. First in this way:The doers of the Law will be justified means that through justification they will become, will be made, what they were not before, doers. Second, and in a better way, will be justified means that they will be looked upon and thought of as righteous, as stated in the gloss. It is sufficiently clear from the preceding (the period 13), “for not the hearers of the Law are righteous before God,” that, if you should ask who else is righteous before God except the hearers, the answer would be: “The doers will be righteous, that is, they will be justified and looked upon as righteous.” Thus Ps. 143:2 says, “for no man living is righteous before Thee,” that is, he is not looked upon as righteous. And below, in Rom. 3:20, we read: “No human being will be justified in his sight by works of the law.” And again Luke 10:29: “And he, desiring to justify himself” (that is, he wanted to declare or to state that he was righteous, and he wanted to absolve himself of sin, as though he did not know who was his neighbor whom he was commanded to love), and similarly in many other places.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/martin-luther.html">Martin Luther</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Luther’s Works</cite>, 25.184–85.</span></figcaption>

<blockquote><p>We are not iustified by two righteousnesses existing in two diuers subiects. But if wee be iustified by the worke of Faith: we shall be iustified partly by that righteousnesse which is in vs, (viz.) of Faith: partly by the righteousnesse of Christ without vs.</p></blockquote>

</figure><figure class="quote" id="q-b304bdf8c2" data-kw="">
<blockquote><p>As this is a great error [to mingle law and gospel], so it is a very dangerous error. If a man attempts to add any works of his own to the consummate righteousness of Jesus Christ as the ground of his justification before God, Christ profits him nothing. The obedience and death of Christ have “become of no effect” to him. “Behold, I Paul say unto you, that if ye be circumcised, Christ shall profit you nothing. For I testify again to every man that is circumcised, that he is a debtor to do the whole law. Christ is become of no effect unto you, whosoever of you are justified by the law; ye are fallen from grace” (Gal. 5:2–4). If a man tries to connect his own performances with the righteousness of Jesus Christ for the pardon of his sins and the acceptance of his person as righteous in the sight of God, he deprives himself of all benefit from that perfect righteousness. If he relies on his own works of obedience for even the smallest part of his title to eternal life, “he is a debtor to do the whole law” in its covenant form, and he fixes himself under the dreadful curse of it. Christ will profit him nothing unless he relies on His infinitely glorious righteousness only for all his title to justification and eternal life. A sinner depends on the righteousness of Christ for justification to no good purpose if he does not rely on it only, and neither in whole nor in part on his own obedience.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/john-colquhoun.html">John Colquhoun</a></span><span class="wk"><span class="lbl">Work:</span> <cite>A Treatise on the Law and Gospel</cite>, (Grand Rapids: Reformation Heritage Books), 128. Emphasis Added.</span></figcaption>

<main class="wrap"><figure class="quote" id="q-743e53a7ea" data-kw="">
<blockquote><p>Objection 6. That is not the true religion nor a safe way to Heaven, which men can have no infallible certainty of. But the Protestant religion is such: For they all profess their Church to be fallible. Answer: [1.] We must distinguish between a man that may be deceived, and a man that is deceived: and between infallibility in the object, and in the subject or intellect. And between infallibility in the absolutely necessary points, and in some inferior smaller matters.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/richard-baxter.html">Richard Baxter</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Safe Religion, or Three Disputations for the Reformed catholic religion against Popery proving that Popery is against the Holy Scriptures, the unity of the catholic Church, the consent of the ancient doctors, the plainest reason and common judgment of sense itself</cite>, The Safe Religion, or Three Disputations for the Reformed catholic religion against Popery proving that Popery is against the Holy Scriptures, the unity of the catholic Church, the consent of the ancient doctors, the plainest reason and common judgment of sense itself (London: Miller, 1657) | Query: ‘Whether the Reformed Catholic Christian religion, commonly called Protestant, be a safe way to salvation?’, pp. 43-44</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/church-government-and-the-ministry/papacy.html">Papacy</a></span></div>

ext=necessary%20points%2C%20and%20in%20some%20inferior%20smaller%20matters" rel="noopener" target="_blank">Read it online · Reformed Books Online</a></div>
</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-669e01d933" data-kw="">
<blockquote><p>Your see, however, which is called the Court of Rome, and which neither you nor any man can deny to be more corrupt than any Babylon or Sodom, and quite, as I believe, of a lost, desperate, and hopeless impiety, this I have verily abominated, and have felt indignant that the people of Christ should be cheated under your name and the pretext of the Church of Rome; and so I have resisted, and will resist, as long as the spirit of faith shall live in me.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/martin-luther.html">Martin Luther</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Letter to Pope Leo X</cite>, p. 2</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/church-government-and-the-ministry/papacy.html">Papacy</a></span><span class="t"><a href="../topics/rome/the-papacy.html">Rome: The Papacy</a></span></div>

— Martin Luther, Letter to Pope Leo X, p. 2">Copy</button><a class="share" href="https://x.com/intent/post?text=%E2%80%9CYour+see%2C+however%2C+which+is+called+the+Court+of+Rome%2C+and+which+neither+you+nor+any+man+can+deny+to+be+more+corrupt+than+any+Babylon+or+Sodom%2C+and+quite%2C+as+I+believe%2C+of+a+lost%2C+desperate%2C+and+hopeless+impiety%2C+this+I+have+verily+abominated%2C+and+have+felt+indignant+that+the+people+of+Christ+should+be+cheated+under+your+name+and+the+pretext+of+the+Church+of+Rome%3B+and+so+I+have+resisted%2C+and+will+resist%2C+as+long+as+the+spirit+of+faith+shall+live+in+me.%E2%80%9D%0A%0A%E2%80%94+Martin+Luther%2C+Letter+to+Pope+Leo+X%2C+p.+2&amp;url=https%3A%2F%2F5solasquotes.github.io%2Fquote%2F669e01d933.html&amp;via=5Solas" target="_blank" rel="noopener">Share on X</a><a class="perma" href="../quote/669e01d933.html">Permalink</a><span class="src none">No free online copy linked</span></div>
</figure><figure class="quote" id="q-a4040f858a" data-kw="">
<blockquote><p>We are constrained by the care of government which we have undertaken to extend vigilantly the solicitude of our office, and to instruct the minds of our brethren by addresses of admonition, that no wrongful presumption may avail to deceive the ignorant, nor any dissimulation to excuse those who know, lie it known then to your Fraternity that John, formerly bishop of the city of Constantinople, against God, against the peace of the Church, to the contempt and injury of all priests, exceeded the bounds of modesty and of his own measure, and unlawfully usurped in synod the proud and pestiferous title of oecumenical, that is to say, universal. When our predecessor Pelagius of blessed memory became aware of this, he annulled by a fully valid censure all the proceedings of that same synod, except what had therein been done in the cause of Gregory, bishop of Antioch, of venerable memory; taking him to task with most severe rebuke, and warning him to abstain from that new and temerarious name of superstition; even so as to forbid his deacon to go in procession with him, unless he should amend so great a wickedness… we once and again addressed the same most holy John by letter, bidding him relinquish that name of pride, and incline the elation of his heart to the humility which our Master and Lord has taught us. And having found that he paid no regard, we have not desisted, in our desire of concord, from addressing the like admonitions to our most blessed brother and fellow-priest Cyriacus, his successor. But since it is the case, as we see, now that the end of this world is near at hand, that the enemy of the human race has already appeared in his harbingers, so as to have as his precursors, through this title of pride, the very priests who ought to have opposed him by living well and humbly, I exhort and entreat that not one of you ever accept this name, that not one consent to it, that not one write it, that not one admit it wherever it may have been written, or add his subscription to it; but, as becomes ministers of Almighty God, that each keep himself from this kind of poisoned infection, and give no place to the cunning lier-in-wait, since this thing is being done to the injury and rendering asunder of the whole Church, and, as we have said, to the contemning of all of you. For if one, as he supposes, is universal bishop, it remains that you are not bishops.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/gregory-the-great.html">Gregory the Great</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Epistles of</cite>, bk. 9, letter 68 in NPNF2 13.18-19</span></figcaption>

</figure><figure class="quote" id="q-3be6d89447" data-kw="">
<blockquote><p>The pope makes everything right. Where the pope is, there is the true church, pure doctrine, and apostolic succession. The truth is, there is not a word in Scripture about such an apostolic succession. Even as such it is no more a guarantee of purity of doctrine than the hereditary high-priestly office of Caiaphas validated the justice of his pronouncements and actions. For that reason Protestants were right in saying that not “the succession of places and persons” (successio locorum et personarum) but “the succession of doctrine” (successio doctrinae) is a distinguishing feature of the true church. If the latter is missing, the former can make no church into a true church; and if it is present, the former is of very minor significance.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/herman-bavinck.html">Herman Bavinck</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Reformed Dogmatics: God and Creation</cite>, vol. 4, §496</span></figcaption>

</figure><figure class="quote" id="q-36d770f0fc" data-kw="Succession of Peter">
<blockquote><p>No one succeeded the apostles in personal apostolic preeminence (hyperochē). Therefore neither did anyone succeed Peter. For the same principle ought to apply to all. Nor ought the privilege of Peter as to ecclesiastical monarchy to be opposed, because this is the capital falsehood (prōton pseudos), which has been refuted before.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/francis-turretin.html">Francis Turretin</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Institutes of Elenctic Theology</cite>, 18.19.4</span></figcaption>

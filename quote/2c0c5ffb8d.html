<main class="wrap"><figure class="quote" id="q-2c0c5ffb8d" data-kw="">
<blockquote><p>The disagreement is whether that subordination and dependence of secondary causes upon the first involves determination of the secondary cause by the first; and if it does, through what it is exercised. Father Suárez… and with him the Jesuit Fathers commonly, deny that the first cause determines the secondary cause in its free acts… They add that the first cause does nothing antecedently — neither in the secondary cause nor in its action in second act — but coacts simultaneously with the same concurrence, in such a way that from both causes simultaneously and concomitantly concurring, the action comes about; and therefore God cannot predefine or foresee what the created will is going to do before its foreseen determination. Hence they have recourse to conditional knowledge, by which God knows what the free secondary cause will do if placed in such or such circumstances; and according to what He sees it will do if thus placed, it determines what God wills to be for that time from that cause.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/francisco-macedo.html">Francisco Macedo</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Collations of the Teachings of St. Thomas &amp; Scotus</cite>, … vol. 2 tr. AI by Vertias (Padua: Frambotti, 1671), , bk. 2, Collation 9, pp. 361-429 | Contra Molinism &amp; Suarez, pp. 373-74</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/providence/concurrence.html">Concurrence</a></span></div>

</figure><figure class="quote" id="q-3278cb9fbd" data-kw="">
<blockquote><p>31. VI. God’s causal relations to his creatures are in general those named by St. Paul, Romans 11:36: “Of him, and through him, and to him, are all things.” And he is: 1. The first efficient, 2. The supreme dirigent, 3. The ultimate final cause of all things.

32. God’s efficiency is terminated:

1. On the things in their being, 2. In their action and operation.

1. And in the first respect he is the cause:

1. Of their existing essence, 2. Of their order, 3. Of their goodness or perfection. And so he is, 1. The Creator and conserver, 2. The ordinator, 3. The benefactor of all the world. And in the second respect (as to action) he is:

1. The actor or motor of all things (by his active power);

2. The governor of all (according to their several natures) (by his wisdom);

3. The perfecter of all things in their attaining or fruition of their proper end (by his goodness).

33. VII. As to man in special, God is now fundamentally related to him as his Creator, his Redeemer, and his Regenerator or Sanctifier, eminently ascribed distinctly to the Father, Son, and Holy Spirit. From this flows natura, medela, salus [nature, healing, salvation], or nature, redeeming grace, and renewing grace (holiness and glory), that is, love begun here and perfected in heaven.

34. VIII. From creation there results a threefold moral right and relation of God to man:

1. He is our absolute owner or Lord to dispose of us and act us by his power.

2. He is our supreme rector, morally to rule us as intellectual free agents, eminently by his wisdom.

3. He is our lover and ultimate end, as he is goodness and love itself. To love him and be loved by him perfectly forever, being amantissimus et amabilissimus [most loving and most lovable] in his goodness.

35. He that leaves out any one of these relations of God to man (to be our owner, ruler, and lover and end) leaves out that which is essential to our God, as the word is relatively used in the precepts and promises of Holy Scripture.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/richard-baxter.html">Richard Baxter</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Catholic Theology Plain, Pure, Peaceable</cite>, (London: White, 1675), sect. 3, ‘The several inadequate conceptions which in order make up our knowledge of God’, p. 5</span></figcaption>

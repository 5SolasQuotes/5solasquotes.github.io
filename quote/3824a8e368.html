<blockquote><p>Now, brethren, concerning the coming of our Lord Jesus Christ and our gathering together to Him, we ask you, not to be soon shaken in mind or troubled, either by spirit or by word or by letter, as if from us, as though the day of Christ had come. 2 Thessalonians 2:1-2.

The opposite to this [doctrinal stability] is levity and inconstancy of mind, that soon quitteth truth without difficulty, or without much hesitancy and resistance yields to the temptation. The scripture often taketh notice of this sudden embracing of error: Gal. i. 6, ‘I marvel that ye are so soon removed from him that called you into the grace of Christ unto another gospel;’ and in the text, ‘soon shaken in mind.’ Credulity is a lightness in believing, when we are like reeds shaken with every wind, Mat. xi. 7, and have a faulty easiness, ready to be carried away with every doctrine which pretendeth to truth: ‘The simple believeth every word,’ Prov. xiv. 15. There is a readiness of mind which is good, but it goeth on sufficient evidence; so ‘the wisdom that is from above is gentle, and easy to be entreated,’ James iii. 17; and the Bereans were πρόθυμοι: Acts xvii. 11, ‘They received the word with all readiness of mind, and searched the scriptures, whether these things were so or no.’ But a readiness of mind differs from a weakness of mind, or a lightness in believing upon slender and insufficient grounds: they never receive the truth with thorough efficacy, and are prone to error.

4. The causes of this instability and inconstancy of mind are these:—

[1.] Lack of solid rooting in the truth; they receive it hand-over-head, as the stony ground forthwith sprang up: Mat. xiii. 5, 20, ‘Anon they receive it with joy;’ they do not so soon receive the word, but they as soon quit it.

[2.] Lack of mortification: 2 Tim. iv. 10, ‘Demas hath forsaken us, having loved this present world.’ Lusts are uncertain; fear of men, favour of men, carnal hopes will easily prevail.

[3.] A certain readiness of mind which disposeth men to conform and comply with their company, as the looking-glass representeth every face that looketh on it; so they are very changeable, and unstable as water; as Zedekiah, Jer. xxxviii. 5, ‘The king is not he that can say you nay;’ soon turned this way and that way.

[4.] Want of a thorough inclination to God, so that they are right for a while, or in some things, yet they are not universally true to his interest: 1 Kings ii. 28, ‘Joab turned after Adonijah, though he turned not after Absolom;’ Hosea vii. 8, ‘Ephraim is a cake not turned.’

[5.] Want of holiness and living up to the truths we know: 1 Tim. iii. 9, ‘Holding the mystery of faith in a pure conscience.’ Choice liquors are best kept in a clean vessel; men provoke God to desert them and leave them to a giddy spirit.

[6.] Libertinism. Men think they may run from one sect of Christians to another, as the wind of interest bloweth. If they were to turn to Ethnicism, Turcism, or Judaism, they would die rather than change their religion; but they think the differences among Christians are not of such moment as to venture anything upon that account. Every truth is precious, and must be owned in its season, and it is damnable in itself to do anything against conscience, and he that giveth way to a small temptation will entertain a greater; as a man that hangeth over a precipice, when he lets go his hold, will sink further and further till he come to the bottom; therefore, it is good to be faithful in a little.</p></blockquote>

<blockquote><p>And in all deceivableness of unrighteousness, among them that perish, because they received not the love of the truth, that they might be saved (2 Thessalonians 2:10 Geneva Bible)

It is not enough to receive the truth in the light of it, but we must also receive it in the love of it, or it will do us no good. To make the truth operative:—(1.) Knowledge is necessary, and also faith, and then love. Knowledge, for ‘without knowledge the heart is not good,’ Prov. xix. 2. Nothing can come to the heart but by the mind; the will is ὄρεξις μετὰ λόγον—a choice or desire, guided by reason, and the gospel doth not work as a charm, whether it be or be not understood. No; the purport or drift of it must be known, or how can it have any effect upon us?

Next to knowledge, to make it work, there must be faith. When we apprehend a thing, we must judge of it, whether it be true or false; how else can it make any challenge, or lay claim to our respect? 1 Thes. ii. 13, ‘Ye received it not as the word of men, but (as it is in truth) the word of God, which worketh effectually in you, as it doth in all them that believe.’ Faith doth enliven our actions about religion; to hear of God, and Christ, and heaven, doth not stir us unless we believe these things.

Well, next to faith there must be love, for apprehension and dijudication [sic] are acts of the understanding only, but love belongeth to the will, and we must believe with all the heart, Acts viii. 37. There may be knowledge without faith, as an heathen may understand the Christian religion, though he believe it not, profess it not. And there may be faith without love, for there is a ‘dead faith,’ James ii. 20, which rests in cold opinions, without any affection to the truth believed.

Love pierceth deeper into the truth, and maketh it pierce deeper into us. As a red-hot iron, though never so blunt, will run farther into an inch board than a cold tool, though never so sharp. And love maketh it more operative; there is notitia per visum, et notitia per gustum — a knowledge by sight, and a knowledge by taste. A man may guess at the goodness of wine by the colour, but more by the taste; that is a more refreshing apprehension; and Augustine prayeth, Fac me, Domine, gustare per amorem quod gusto per cognitionem — Lord, make me taste that by love which I taste by knowledge.

Surely we are never sound in Christianity till all the light that we receive be turned into love. These great things are revealed and represented to our faith, not to please our minds by knowing them, but to quicken our love. Faith alone is but as sight, and faith with love is as taste. Now, it is more easy to dispute a man out of his belief that only seeth, than it is him that tasteth, and knoweth the grace of God in truth.

This is the true reason of the steadfastness of weak and unlearned Christians; though they have not such distinct conceptions and reasonings as many learned men have, yet their faith is turned into love, and a man is better held by the heart than by the head. And though they cannot dispute for Christ (as one of the martyrs said), they can die for Christ. But alas! many receive the truth in the light thereof, but few receive it in the love of it, and so lie open to deceit.</p></blockquote>

t%2C+and+so+lie+open+to+deceit.%E2%80%9D%0A%0A%E2%80%94+Thomas+Manton%2C+Eighteen+sermons+on+the+second+chapter+of+the+second+epistle+to+the+Thessalonians%2C+containing+the+description%2C+rise%2C+growth%2C+and+fall+of+antichrist%2C+with+divers+cautions+and+arguments+to+establish+Christians+against+the+apostasy+of+the+Church+of+Rome%2C+%281679%29+in+The+complete+works+of+Thomas+Manton%2C+D.D.+%2822+vols%2C+London%2C+1871%29%2C+3%3A+80-81.&amp;url=https%3A%2F%2F5solasquotes.github.io%2Fquote%2F3311577869.html&amp;via=5Solas" target="_blank" rel="noopener">Share on X</a><a class="perma" href="../quote/3311577869.html">Permalink</a><a class="src" href="https://reformedcovenanter.wordpress.com/2019/09/09/thomas-manton-on-receiving-the-love-of-the-truth/" rel="noopener" target="_blank">Read it online · Reformed Covenanter</a></div>
</figure><figure class="quote" id="q-ba1a071221" data-kw="">
<blockquote><p>The third consolation which Moses here describes is gladness at beauty bestowed — ‘Let the beauty of the Lord our God be upon us.’ Sorrow mars the countenance and clothes the body with sackcloth; but if the Lord will come to us and adorn us with his beauty, then the stains of mourning will speedily disappear. Brethren, what a beauty is this which the Lord giveth— ‘the beauty of the Lord our God!’ This comeliness is the beauty of his grace; for our covenant God is the God of all grace. If the Lord makes us to know that we are his our faces shine. If He fills us with his life and love, then brightness flashes from the eyes, and there is a grace about every movement. This ‘beauty’ means holiness; for holiness is the beauty of God. If the Holy Spirit works in you the beauty of holiness, you will rise superior to your afflictions. If this church shall be made the holier by its bereavements, we shall gain much by our losses. This beauty of the Lord must surely mean his presence with us. As the sun beautifies all things, so does God’s presence. When we know that Jesus is with us, when we feel that he is our helper, when we bask in his love, when he abides with us in power, this is the beauty of the saints. If we have Christ in us, Christ with us, we can bear any amount of trouble. ‘I can do all things, or can bear All suffering if my Lord be there.’ This beauty gives to the believer an attractiveness in the eyes of men: they perceive that we have been with Jesus, and they behold our faces shining like the faces of angels. It is a great thing when a Christian is so happy, so holy, and so heavenly that he attracts others to Christ, and people seek his company because they perceive that he has been in the company of the blessed Lord. God give you this, and if you have it, dear friend, you may forget your sorrows: they are transfigured into joy.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/charles-h-spurgeon.html">Charles H. Spurgeon</a></span><span class="wk"><span class="lbl">Work:</span> <cite>‘Gladness for Sadness’ on Ps. 90:15-17</cite>, (Jan. 14, 1883) in Metropolitan Tabernacle Pulpit, vol. 29</span></figcaption>

</figure><figure class="quote" id="q-69f6a5ed1e" data-kw="">
<blockquote><p>But people evaluate things also according to the standard of beauty and ugliness… But the beautiful is nevertheless essentially distinct from the pleasant. People do not argue about what is pleasant. One person finds this food and that drink enjoyable, but another does not. People are comfortable with this and do not argue about these differences. However, in connection with what is beautiful, people tend not to be satisfied with the notion that something attracts one person but not another; people attempt to account for beauty to themselves and others and attempt, as it were, to demonstrate why something is attractive. People proceed from the notion that what is genuinely beautiful should be attractive to everyone, given sufficient enlightenment and education.</p></blockquote>

<blockquote><p>Whiggism is not circumscribed and confined to any one or two of the Religions now professed in the World, but diffuses it self among all. We have known Jews, Turks, nay, some Papists, (which I own to be a great Rarity) very great Lovers of the Constitution and Liberty; and were there rational Grounds to expect, that any Numbers of them could be so, I should be against using Severities and Distinctions upon Account of Religion.

For a Papist is not dangerous, nor ought to be ill used by any body, because he prays to Saints, believes Purgatory, or the real Presence in the Eucharist, and pays Divine Worship to an Image or Picture (which are the common Topics of our Writers of Controversy against the Papists;) but because Popery sets up a foreign Jurisdiction paramount to our Laws.

So that a real Papist can neither be a true Governor of a Protestant Country, nor a true Subject, and besides, is the most Priest-Ridden Creature in the World: and (when uppermost) can bear with no body that differs from him in Opinion; little considering, that whosoever is against Liberty of Mind, is, in effect, against Liberty of Body too.</p></blockquote>

</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-5477c0d736" data-kw="">
<blockquote><p>That as the Jews were wont to shut up the solemnity of the Passover by singing some of David’s Psalms; so our Saviour, after the celebration of the Sacrament of his body and blood, went out with his disciples to the mount of Olives, […] having sung the Hymn, which Hymn (say the best expositors) was the same that the Jews did ordinarily sing after the Passover, and is called by them the great Hallel, which, as Paulus Brugensis says, consisted of six Psalms, from Ps. 113 to Ps. 118, and he adds (verisimile est hos à Domino decantatos) it is most like that these were sung by our Saviour. And Drusius says, hunc hymnum hodieque canunt in nocte Paschatis; The Jews sing this Hymn in the evening of the Passover to this day. The learned Scaliger having largely described the forms and rites of celebrating the Passover, concludes thus; This was the true rite of celebrating the Passover in the times of the Messiah…</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/thomas-long.html">Thomas Long</a></span><span class="wk"><span class="lbl">Work:</span> <cite>An Exercitation Concerning the Frequent Use of our Lord’s Prayer in the public Worship of God and a view of what hath been said by Mr. [John] Owen concerning that subject (London, 1658)</cite>, pp. 14-15</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/worship/psalmody.html">Psalmody</a></span></div>
<div class="actions"><button class="copy" data-copy="“That as the Jews were wont to shut up the solemnity of the Passover by singing some of David’s Psalms; so our Saviour, after the celebration of the Sacrament of his body and blood, went out with his disciples to the mount of Olives, […] having sung the Hymn, which Hymn (say the best expositors) was the same that the Jews did ordinarily sing after the Passover, and is called by them the great Hallel, which, as Paulus Brugensis says, consisted of six Psalms, from Ps. 113 to Ps. 118, and he adds (verisimile est hos à Domino decantatos) it is most like that these were sung by our Saviour. And Drusius says, hunc hymnum hodieque canunt in nocte Paschatis; The Jews sing this Hymn in the evening of the Passover to this day. The learned Scaliger having largely described the forms and rites of celebrating the Passover, concludes thus; This was the true rite of celebrating the Passover in the times of the Messiah…”

</figure><figure class="quote" id="q-afcb3af2fb" data-kw="">
<blockquote><p>Moreover, who can deny ye there is much &amp; great virtue in David’s Harp… Again must not David’s songs be of great excellency, seeing that ye Son of God came down from the glorious throne of his heavenly Father to accomplish and fulfill them? Doth not Paul also say, ‘Be ye filled with the Spirit, speaking among yourselves in Psalms, Hymns, &amp; spiritual songs, singing and making melody in your hearts to ye Lord, ever giving thanks for all things in the name of our Lord Jesus Christ?’ Certes [assuredly] the psalmody of David may well be called ye treasure house of the holy Scripture. For it contain the whatsoever is necessary for a christian to know: There is nothing in the law, no thing in the Prophets, nothing in ye preaching of Christ and of his apostles, yt this noble minstrel, King &amp; Prophet doth not decantate and sing with most goodly &amp; manifest words. He singeth all the works and wonderous miracles of God from the beginning of the world, until the redemption of mankind by Christ. He singeth Christ’s incarnation, preaching, working of miracles, passion, death, resurrection, ascension, glory, the blessing of all nations, the conversion of the Gentiles with all other mysteries that pertain to our health… To be short, he singeth whatsoever is expedient for a Christian’s knowledge. So that even this one book alone of David’s songs had been sufficient truly to instruct a man in the righteousness of God… O the wonderful and marvelous strength of David’s harp. O the great and exceeding virtue of David’s songs… Would God that all men of honor would nourish such minstrels in their houses, as David’s, and that might sing unto them both at dinner and supper, yea and at all other times these most sweet and delectable songs of David… Would God also that all fathers and mothers, all masters and mastresses, would bring up their children and servants in the singing of these most godly songs.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/thomas-becon.html">Thomas Becon</a></span><span class="wk"><span class="lbl">Work:</span> <cite>David’s harp full of most delectable armony, newly stringed and set in tune by Theodore Basille (London, 1542), ‘To the right honorable Sir. George Broke, Lord Cobham’, no page numbers. Theodore Basille was a pseudonym for Thomas Becon (1512-1567), the English reformer.</cite></span></figcaption>

</figure><figure class="quote" id="q-31538388e4" data-kw="">
<blockquote><p>If it [psalm singing] be an ordinary part of worship, why perform they it not, but quarrel with us, who… do content ourselves with joint harmonious singing of the Psalms of holy scripture, to the instruction and comfort of our hearts, and praise of our God.</p></blockquote>

— Henry Ainsworth, A Defence of the Holy Scriptures, Worship, and Ministry used in the Christian Churches separated from Antichrist, Against the Challenges, cavils and contradiction of Mr. Smyth in his book entitled, The Differences of the Churches of the Separation… (Amsterdam, 1609), p. 22">Copy</button><a class="share" href="https://x.com/intent/post?text=%E2%80%9CIf+it+%5Bpsalm+singing%5D+be+an+ordinary+part+of+worship%2C+why+perform+they+it+not%2C+but+quarrel+with+us%2C+who%E2%80%A6+do+content+ourselves+with+joint+harmonious+singing+of+the+Psalms+of+holy+scripture%2C+to+the+instruction+and+comfort+of+our+hearts%2C+and+praise+of+our+God.%E2%80%9D%0A%0A%E2%80%94+Henry+Ainsworth%2C+A+Defence+of+the+Holy+Scriptures%2C+Worship%2C+and+Ministry+used+in+the+Christian+Churches+separated+from+Antichrist%2C+Against+the+Challenges%2C+cavils+and+contradiction+of+Mr.+Smyth+in+his+book+entitled%2C+The+Differences+of+the+Churches+of+the+Separation%E2%80%A6+%28Amsterdam%2C+1609%29%2C+p.+22&amp;url=https%3A%2F%2F5solasquotes.github.io%2Fquote%2F31538388e4.html&amp;via=5Solas" target="_blank" rel="noopener">Share on X</a><a class="perma" href="../quote/31538388e4.html">Permalink</a><a class="src" href="https://reformedbooksonline.com/the-puritans-on-psalms-hymns-and-spiritual-songs-eph-519-col-316/#:~:text=If%20it%20%5Bpsalm%20singing%5D%20be%20an,hearts%2C%20and%20praise%20of%20our%20God&amp;text=If%20it%20%5Bpsalm%20singing%5D%20be%20an%20ordinary%20part&amp;text=of%20our%20hearts%2C%20and%20praise%20of%20our%20God" rel="noopener" target="_blank">Read it online · Reformed Books Online</a></div>
</figure><figure class="quote" id="q-1a602939db" data-kw="">
<blockquote><p>Teaching and admonishing one another. This is one way wherein we are to be the means of each others’ instruction and one means whereby the Word of God, particularly that part of the Word that consists in psalms &amp; hymns and spiritual songs is to dwell in us richly in all wisdom. Singing of Psalms is a Great help to a spiritual understanding of the Psalms. The mind of the Holy Ghost in the Psalms is often times conveyed while the Psalm is a singing, and as it is a means of a spiritual understanding of that excellent part of the Word of God… What should be sung, viz. Psalms. What seems to be here intended, at least chiefly, is the Psalms and spiritual songs that are contained in the Word of God, for the apostle is speaking of the Word of God. Let the Word of God, says he, dwell in you richly in all wisdom, and then he mentions singing as a means, but then it must be singing some part of the Word of God.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/jonathan-edwards.html">Jonathan Edwards</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Sermon Notes on Col. 3:16 in Sermons, Series II, 1736 (WJE Online Vol. 51)</cite></span></figcaption>

<div class="actions"><button class="copy" data-copy="“Teaching and admonishing one another. This is one way wherein we are to be the means of each others’ instruction and one means whereby the Word of God, particularly that part of the Word that consists in psalms &amp; hymns and spiritual songs is to dwell in us richly in all wisdom. Singing of Psalms is a Great help to a spiritual understanding of the Psalms. The mind of the Holy Ghost in the Psalms is often times conveyed while the Psalm is a singing, and as it is a means of a spiritual understanding of that excellent part of the Word of God… What should be sung, viz. Psalms. What seems to be here intended, at least chiefly, is the Psalms and spiritual songs that are contained in the Word of God, for the apostle is speaking of the Word of God. Let the Word of God, says he, dwell in you richly in all wisdom, and then he mentions singing as a means, but then it must be singing some part of the Word of God.”

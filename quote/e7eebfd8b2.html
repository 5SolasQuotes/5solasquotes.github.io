<main class="wrap"><figure class="quote" id="q-e7eebfd8b2" data-kw="">
<blockquote><p>1st Conclusion. An adjoining to a visible Church either formally to be a member thereof, or materially, confessing the Faith of the true visible Church, God offering occasion, is necessary to all: 1. Because we are to be ready to give a confession of the hope that is in us, to every one who asks, 1 Pet. 3:15. 2 Because he who denies Christ before men, him also will Christ deny before the Father and before the holy angels, Mt. 10:33.

3. Yet if some die without the Church, having faith in Christ, and want opportunity to confess Him before men, as repenting in the hour of death, their salvation is sure, and they are within the invisible Church: so is that to be taken, extra Ecclesiam nulla salus, none can be saved who are every way without the Church, both visible and invisible; as all perished who were not in Noah’s Ark. 2nd Conclusion. When God offers opportunity, all are obliged to join themselves to a true visible Church:

1. Because God has promised his presence to the Churches as his Son walks in the midst of the golden candlesticks, Rev. 2:2.

2. Because faith comes by hearing a sent preacher, Rom. 10:4.

3. Separation from the true visible Church is condemned, Heb. 10:24; Jude v. 19; 1 Jn. 2:19.

4. Good men esteem it a rich favour of God to lay hold on the skirt of a Jew, Zech. 8:23, and to have any communion, even as a door keeper in God’s House, and have desired it exceedingly and complained of the want thereof, Ps. 84:10. v. 1-2; Ps. 27:4; Ps. 42:1-4; Ps. 63:1-2.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/samuel-rutherford.html">Samuel Rutherford</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Due Right of Presbyteries, ‘Acts 15, A Pattern of a Juridicial Synod’</cite>, ... (London: 1644), pt. 1, p. 79</span></figcaption>

<blockquote><p>There are many cases in which local separation may be lawful: First, as if our callings justly remove us to another place or country. Secondly, if our spiritual advantage bind us to remove to a better minister and more suitable society when we are free. Thirdly, if our lawful pastors be turned out of the place, and we follow them, and turn away but from usurpers. Fourthly, if the pastors turn heretics or wolves. Fifthly, if the public good of the churches require my removal. Sixthly, if any sin be imposed on me, and I be refused by the Church unless I will commit it. In these and some other such cases a remove is lawful.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/richard-baxter.html">Richard Baxter</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Cure of Church Divisions</cite>, … (London, 1670), pt. 1 | Direction 59, p. 238</span></figcaption>

<blockquote><p>2. A second way of your communion of [congregationalist] churches, is, ‘By way of recommendation, as Paul in the behalf of Phoebe, etc.’ But this is so far from being any part of the power of the keys that it is a duty which a church or party owe to any Christian that is godly, not by virtue of any particular church-membership, but by the common interest of Christianity, yea, by the common right of humanity, even to an honest heathen, according to the Ninth Commandment, which requires us to bear true witness to our brother if we be thereto required. The letters are only declarative, of the good behaviour of the party, occasioned to remove to such a place. Was this (think you) a part of the power of the keys delivered to Peter and the rest of the apostles? Besides, if there be any virtue in these letters, to admit a member into communion, is there not a like virtue in them to excommunicate one ungodly? And if these letters dimissory have power to admit a member of one church to be a member of another, without any new covenanting, have they not the like power to admit the pastor of one church, to be a pastor of another Church, without any new ordination? which yet, I believe, you do not practice.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/daniel-cawdrey.html">Daniel Cawdrey</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Vindiciæ Clavium</cite>, … (1645), ch. 4, ‘Of the Subject of Church-Liberty’, p. 41 Cawdrey (1588–1664) was a presbyterian Westminster divine.</span></figcaption>

<blockquote><p>3. We grant that there may be an express and solemn covenant, in the presence of God and the Church, upon extraordinary occasions, entered into, by all the members of the visible Church of one nation or kingdom: when the Church in that kingdome or nation has made defection from God and his worship, or some other necessity call for it; for the preserving, or propagating, or restoring of the decayed worship of God. By which covenant notwithstanding there does not acrue to the Church of that kingdom any new right, but that right which before they had to enjoy the ordinances of God, which by reason of their defection, or some other cause, was hindered and as it were suspended, they may now freely and purely again reduce to practise. Thus did the Church of God under the Old Testament often in the time of defection, or extraordinary necessity, enter into a solemn covenant in the presence of God.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/wilhelm-apollonius.html">Wilhelm Apollonius</a></span><span class="wk"><span class="lbl">Work:</span> <cite>A Consideration of Certain Controversies at this Time Agitated</cite>, (1645), ch. 2, ‘Of a Church-Covenant’ Apollonius was a Dutch presbyterian., pp. 15-16</span></figcaption>

n%20covenant%20in%20the%20presence%20of%20God" rel="noopener" target="_blank">Read it online · Reformed Books Online</a></div>

<blockquote><p>Sixthly, the ministers are primarily ministers of the Church catholic; secondarily, of this or that particular flock or congregation: and therefore the catholic is the prime Church. And this appears by this demonstration: That Church to the which the donation of the ministry was first made, is the first subject thereof, but that was the Church catholic, therefore. For proof hereof see 1 Cor. 12:28-29, ‘God hath set some in the Church, first apostles, secondarily prophets, thirdly teachers.’ Now this Church was the Church catholic, and not any particular congregation, for it is the Church to which the Lord gave apostles. Note also from hence, that the same Church to which God gave apostles, and prophets, to the same He gave teachers also. Bishop and pastor may seem to be in respect to the particular relation to some particular place, wherein by the polity of the Church a particular minister is set, but presbyter, minister, and teacher, more general, extending to the whole Church catholic. Paul an apostle calls himself a teacher and preacher, 2 Tim. 1:11. Peter also and John the apostles call themselves presbyters, 1 Pet. 5:1-2; Ep. John 1; 3 John 1, we find also that ministers are in Scripture spoken of under a general notion. They are called ministers of the Word, Luke 1:2, and ministers of God, 2 Cor. 6:4, and ministers of Christ, 1 Cor. 4:1, and ministers of the New Testament, 2 Cor. 3:6, and ministers of the Gospel, 1 Thess. 3:2, and ministers of the Lord, Eph. 6:21, where the ministerial office is noted by the reference thereof to the author that employs them, and the subject about which they are employed, and not by the object to whom they preached; They are not called ministers of the people, but their teachers, rulers, pastors, overseers, or ministers for them, Col. 1:7. And if a minister of this or that congregation were not a minister of the Church catholic visible, then he were no minister out of his own congregation, and therefore could not preach, or administer any sacrament, as a minister, out of his own congregation.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/samuel-hudson.html">Samuel Hudson</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Essence &amp; Unity of the Church, catholic, visible</cite>, (London, 1645), pp. 32-33</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/the-church/church-membership.html">Church Membership</a></span></div>
<div class="actions"><button class="copy" data-copy="“Sixthly, the ministers are primarily ministers of the Church catholic; secondarily, of this or that particular flock or congregation: and therefore the catholic is the prime Church. And this appears by this demonstration: That Church to the which the donation of the ministry was first made, is the first subject thereof, but that was the Church catholic, therefore. For proof hereof see 1 Cor. 12:28-29, ‘God hath set some in the Church, first apostles, secondarily prophets, thirdly teachers.’ Now this Church was the Church catholic, and not any particular congregation, for it is the Church to which the Lord gave apostles. Note also from hence, that the same Church to which God gave apostles, and prophets, to the same He gave teachers also. Bishop and pastor may seem to be in respect to the particular relation to some particular place, wherein by the polity of the Church a particular minister is set, but presbyter, minister, and teacher, more general, extending to the whole Church catholic. Paul an apostle calls himself a teacher and preacher, 2 Tim. 1:11. Peter also and John the apostles call themselves presbyters, 1 Pet. 5:1-2; Ep. John 1; 3 John 1, we find also that ministers are in Scripture spoken of under a general notion. They are called ministers of the Word, Luke 1:2, and ministers of God, 2 Cor. 6:4, and ministers of Christ, 1 Cor. 4:1, and ministers of the New Testament, 2 Cor. 3:6, and ministers of the Gospel, 1 Thess. 3:2, and ministers of the Lord, Eph. 6:21, where the ministerial office is noted by the reference thereof to the author that employs them, and the subject about which they are employed, and not by the object to whom they preached; They are not called ministers of the people, but their teachers, rulers, pastors, overseers, or ministers for them, Col. 1:7. And if a minister of this or that congregation were not a minister of the Church catholic visible, then he were no minister out of his own congregation, and therefore could not preach, or administer any sacrament, as a minister, out of his own congregation.”

— Samuel Hudson, The Essence &amp; Unity of the Church, catholic, visible: and the Priority thereof in regard of Particular Churches Discussed (London, 1645), pp. 32-33">Copy</button><a class="share" href="https://x.com/intent/post?text=%E2%80%9CSixthly%2C+the+ministers+are+primarily+ministers+of+the+Church+catholic%3B+secondarily%2C+of+this+or+that+particular+flock+or+congregation%3A+and+therefore+the+catholic+is+the+prime+Church.+And+this+appears+by+this+demonstration%3A+That+Church+to+the+which+the+donation+of+the+ministry+was+first+made%2C+is+the+first+subject+thereof%2C+but+that+was+the+Church+catholic%2C+therefore.+For+proof+hereof+see+1+Cor.+12%3A28-29%2C+%E2%80%98God+hath+set+some+in+the+Church%2C+first+apostles%2C+secondarily+prophets%2C+thirdly+teachers.%E2%80%99+Now+this+Church+was+the+Church+catholic%2C+and+not+any+particular+congregation%2C+for+it+is+the+Church+to+which+the+Lord+gave+apostles.+Note+also+from+hence%2C+that+the+same+Church+to+which+God+gave+apostles%2C+and+prophets%2C+to+the+same+He+gave+teachers+also.+Bishop+and+pastor+may+seem+to+be+in+respect+to+the+particular+relation+to+some+particular+place%2C+wherein+by+the+polity+of+the+Church+a+particular+minister+is+set%2C+but+presbyter%2C+minister%2C+and+teacher%2C+more+general%2C+extending+to+the+whole+Church+catholic.+Paul+an+apostle+calls+himself+a+teacher+and+preacher%2C+2+Tim.+1%3A11.+Peter+also+and+John+the+apostles+call+themselves+presbyters%2C+1+Pet.+5%3A1-2%3B+Ep.+John+1%3B+3+John+1%2C+we+find+also+that+ministers+are+in+Scripture+spoken+of+under+a+general+notion.+They+are+called+ministers+of+the+Word%2C+Luke+1%3A2%2C+and+ministers+of+God%2C+2+Cor.+6%3A4%2C+and+ministers+of+Christ%2C+1+Cor.+4%3A1%2C+and+ministers+of+the+New+Testament%2C+2+Cor.+3%3A6%2C+and+ministers+of+the+Gospel%2C+1+Thess.+3%3A2%2C+and+ministers+of+the+Lord%2C+Eph.+6%3A21%2C+where+the+ministerial+office+is+noted+by+the+reference+thereof+to+the+author+that+employs+them%2C+and+the+subject+about+which+they+are+employed%2C+and+not+by+the+object+to+whom+they+preached%3B+They+are+not+called+ministers+of+the+people%2C+but+their+teachers%2C+rulers%2C+pastors%2C+overseers%2C+or+ministers+for+them%2C+Col.+1%3A7.+And+if+a+minister+of+this+or+that+congregation+were+not+a+minister+of+the+Church+catholic+visible%2C+then+he+were+no+minister+out+of+his+own+congregation%2C+and+therefore+could+not+preach%2C+or+administer+any+sacrament%2C+as+a+minister%2C+out+of+his+own+congregation.%E2%80%9D%0A%0A%E2%80%94+Samuel+Hudson%2C+The+Essence+%26+Unity+of+the+Church%2C+catholic%2C+visible%3A+and+the+Priority+thereof+in+regard+of+Particular+Churches+Discussed+%28London%2C+1645%29%2C+pp.+32-33&amp;url=https%3A%2F%2F5solasquotes.github.io%2Fquote%2F71c04a633c.html&amp;via=5Solas" target="_blank" rel="noopener">Share on X</a><a class="perma" href="../quote/71c04a633c.html">Permalink</a><a class="src" href="https://reformedbooksonline.com/local-church-membership-is-not-necessary-to-partake-of-the-sacraments/#:~:text=Sixthly%2C%20the%20ministers%20are%20primarily%20ministers,minister%2C%20out%20of%20his%20own%20congregation&amp;text=Sixthly%2C%20the%20ministers%20are%20primarily%20ministers%20of%20the&amp;text=as%20a%20minister%2C%20out%20of%20his%20own%20congregation" rel="noopener" target="_blank">Read it online · Reformed Books Online</a></div>

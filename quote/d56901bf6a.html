<blockquote><p>That any who should receive either licence or ordination from any of the late prelates, or any others not allowed by the authority of this Church, should be incapable of ministerial communion for the space of three years simpliciter, and even after that time, aye and while the presbytery to which he should apply was satisfied concerning his repentance.</p></blockquote>

<main class="wrap"><figure class="quote" id="q-14e1689bee" data-kw="">
<blockquote><p>By the gospel-lamp there is a discovery made of a new and better covenant established in Christ as a second Adam, than that which was made with the first Adam, even a covenant of grace and promise; which being confirmed by the death of Christ, is now set out in its last and best edition, viz., as a testamentary deed. Everything in and about this covenant is wonderful and mysterious. The Trinity transacted in it with Christ as a second Adam from eternity: “I have made a covenant with my chosen; I have sworn unto David my servant,” Psalm Ixxxix. 3.

The gradual manifestation of this covenant unto us, and the variety of dispensations that it has undergone under the Old and New Testament, and yet still the same covenant. The absolute freedom of this covenant unto us, no conditions or qualifications required on our part to interest us in it, the proper condition of it being already fulfilled in the obedience and death of Christ, it comes out to us absolutely free, “I will be their God. I will sprinkle them with clean water, and they shall be clean. I will take away the heart of stone,” &amp;c.

The way how a sinner is brought within the bonds of this covenant is only owing to the gospel-lamp or light, namely, by faith, not of the operation of man, but of the operation of God in a day of power. He just makes the sinner willing to be saved without money and without price, upon the footing of free grace reigning in and through an imputed righteousness, &amp;c.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/ebenezer-erskine.html">Ebenezer Erskine</a></span><span class="wk"><span class="lbl">Work:</span> <cite>A Lamp Ordained for God s Anointed. Being the Substance of Two Sermons. The First Preached at the Admission of the Rev. James Fisher, late Minister of the Gospel at Kinclaven, to be Minister of the Dissenting Associate Congregation in and about Glasgow, October 8, 1741; the other preached at Stirlin</cite></span></figcaption>

</figure><figure class="quote" id="q-38cceed04f" data-kw="">
<blockquote><p>Is it not a point worth our learning to know the constancy of God’s love, with whom we are in a gracious covenant? And then again, we learn much wisdom how to manage our life hereby, even in the intercourse of our changes, to be now rich, now poor, now high, now low in estate. Wisdom is gotten by experience in variety of estates. He that is carried on in one condition, ho hath no wisdom to judge of another’s estate, or to carry himself to a Christian in another condition, because he was never abased himself. He looks very big at him. He knows not how to tender another, that hath not been in another’s condition. And therefore to furnish us, that we may carry our selves as Christians, meekly, lovingly, and tenderly to others, God will have us go to heaven in variety, not in one uniform condition in regard of outward things.

Use. Learn hence not to quarrel with God’s government; for though he alters our conditions, yet he never alters his love. A Christian is unmoveable in regard of the favour of God to him, and in regard of sanctifying grace. …

[W]e must learn the doctrine of the covenant of grace, that God in Christ is become a Father to us, and carries a fatherly mind to us. In what condition soever we are, he is a father still, and intends us well, and will provide for us in the hardest condition. Having took the relation of a father upon him, do you think that he will fail in the carriage of a father towards us? He is pitiful to us, he respects us in the basest condition. He that knows God to be his father, cast him into what condition you will, knows he hath a good portion. …

What a blessed thing is it to be in the covenant of grace, to have God to be our father, to be in Christ, that let our condition outwardly be what it will be, we shall have grace to carry ourselves in it, God will go along with us by his Holy Spirit!</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/richard-sibbes.html">Richard Sibbes</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Art of Contentment</cite>, (London, 1637) in Alexander B. Grossart (ed.), The Works of Richard Sibbes (1862-64; 7 vols, Edinburgh: Banner of Truth, 1977), 5: 179, 180, 181.</span></figcaption>

</figure><figure class="quote" id="q-8512b1e2d9" data-kw="">
<blockquote><p>Moreover, the chief point of all Scripture is that we should not doubt but hope, trust, and believe for a certainty that God is merciful, kind, and patient, that He does not lie and deceive but is faithful and true. He keeps His promises and has now accomplished what He had promised, handing over His only Son into death for our sins, so that everyone who believes in the Son should not perish but have eternal life (John 3:16). Here there can surely be no doubt whether God has been reconciled and is favorably disposed toward us, whether the hate and wrath of God have been removed; for He permits His own Son to die for us sinners.</p></blockquote>

</figure><figure class="quote" id="q-f89e222b04" data-kw="">
<blockquote><p>The grounds and sources of holy consolation, are especially the following: God in Christ, with all his glorious perfections, as a God of love, grace, and mercy, and as the God and portion of the saints; Christ, in his glorious Person, righteousness, fullness, offices, and relations, or Christ living in them, and living for them; the Holy Spirit, as inhabiting, quickening, sanctifying, and sealing them, and as the earnest of their eternal inheritance; the covenant of grace, as well ordered in all things and sure, according to which, Jehovah, Father, Son, and. Holy Ghost, is their God, and they are his people, his peculiar people; the infinite atonement, the continual intercession, the supreme dominion, the inviolable faithfulness, and the gracious presence, of the Lord Jesus, who is given for a covenant of the people; and the ordinances, doctrines, promises, and offers, of his gospel, with the peremptory commandment, given to sinners in common, to believe on him: these are the leading, and the immediate grounds, upon which, the saints do by faith, build their comfort; and they are, at the same time, the sources, from which, by the exercise of faith, they derive their consolation.

Besides these, their faith and sense of the pardon of their sins, of the acceptance of their persons as righteous, of their adoption, of their sanctification, and of the witnessing of the blessed Spirit, are matter of consolation to them; and so is the lively exercise of all the graces of the Holy Spirit, especially of faith, hope, and love. The comfort of justification, because it is founded upon a righteousness which is perfect, and always the same, is more stable and permanent, than that of sanctification. The great things, which believers have in possession, and the greater, which they have in hope, are the sustenance of their consolation.

The suitableness of those inestimable blessings to their hearts, together with their sense of personal interest in them, affords them unspeakable joy. As to their experiences and evidences of grace, these are, strictly speaking, not grounds, upon which they build their comfort; but they are proofs, of their saving interest in those grounds of consolation, above mentioned, as well as, encouragements to build their comfort upon them; and so, they are matter of consolation to their souls. The most comfortable of the saints; are they who, trusting at all times in the second Adam. as given for a covenant to them, can think of all dispensations, of all conditions, and of all duties, with comfort. They who have the love of Christ displayed in the covenant of grace, most constantly in their view, and most frequently warm on their heart; are of all believers, the most free from perplexing doubts and fears.</p></blockquote>

<div class="meta"><span class="t"><a href="../topics/the-covenant-of-grace.html">The Covenant of Grace</a></span></div>
<div class="actions"><button class="copy" data-copy="“The grounds and sources of holy consolation, are especially the following: God in Christ, with all his glorious perfections, as a God of love, grace, and mercy, and as the God and portion of the saints; Christ, in his glorious Person, righteousness, fullness, offices, and relations, or Christ living in them, and living for them; the Holy Spirit, as inhabiting, quickening, sanctifying, and sealing them, and as the earnest of their eternal inheritance; the covenant of grace, as well ordered in all things and sure, according to which, Jehovah, Father, Son, and. Holy Ghost, is their God, and they are his people, his peculiar people; the infinite atonement, the continual intercession, the supreme dominion, the inviolable faithfulness, and the gracious presence, of the Lord Jesus, who is given for a covenant of the people; and the ordinances, doctrines, promises, and offers, of his gospel, with the peremptory commandment, given to sinners in common, to believe on him: these are the leading, and the immediate grounds, upon which, the saints do by faith, build their comfort; and they are, at the same time, the sources, from which, by the exercise of faith, they derive their consolation.

Besides these, their faith and sense of the pardon of their sins, of the acceptance of their persons as righteous, of their adoption, of their sanctification, and of the witnessing of the blessed Spirit, are matter of consolation to them; and so is the lively exercise of all the graces of the Holy Spirit, especially of faith, hope, and love. The comfort of justification, because it is founded upon a righteousness which is perfect, and always the same, is more stable and permanent, than that of sanctification. The great things, which believers have in possession, and the greater, which they have in hope, are the sustenance of their consolation.

The suitableness of those inestimable blessings to their hearts, together with their sense of personal interest in them, affords them unspeakable joy. As to their experiences and evidences of grace, these are, strictly speaking, not grounds, upon which they build their comfort; but they are proofs, of their saving interest in those grounds of consolation, above mentioned, as well as, encouragements to build their comfort upon them; and so, they are matter of consolation to their souls. The most comfortable of the saints; are they who, trusting at all times in the second Adam. as given for a covenant to them, can think of all dispensations, of all conditions, and of all duties, with comfort. They who have the love of Christ displayed in the covenant of grace, most constantly in their view, and most frequently warm on their heart; are of all believers, the most free from perplexing doubts and fears.”

— John Colquhoun, A Treatise of Spiritual Comfort, (2nd edn, Edinburgh, 1814), pp 19-20.">Copy</button><a class="share" href="https://x.com/intent/post?text=%E2%80%9CThe+grounds+and+sources+of+holy+consolation%2C+are+especially+the+following%3A+God+in+Christ%2C+with+all+his+glorious+perfections%2C+as+a+God+of+love%2C+grace%2C+and+mercy%2C+and+as+the+God+and+portion+of+the+saints%3B+Christ%2C+in+his+glorious+Person%2C+righteousness%2C+fullness%2C+offices%2C+and+relations%2C+or+Christ+living+in+them%2C+and+living+for+them%3B+the+Holy+Spirit%2C+as+inhabiting%2C+quickening%2C+sanctifying%2C+and+sealing+them%2C+and+as+the+earnest+of+their+eternal+inheritance%3B+the+covenant+of+grace%2C+as+well+ordered+in+all+things+and+sure%2C+according+to+which%2C+Jehovah%2C+Father%2C+Son%2C+and.+Holy+Ghost%2C+is+their+God%2C+and+they+are+his+people%2C+his+peculiar+people%3B+the+infinite+atonement%2C+the+continual+intercession%2C+the+supreme+dominion%2C+the+inviolable+faithfulness%2C+and+the+gracious+presence%2C+of+the+Lord+Jesus%2C+who+is+given+for+a+covenant+of+the+people%3B+and+the+ordinances%2C+doctrines%2C+promises%2C+and+offers%2C+of+his+gospel%2C+with+the+peremptory+commandment%2C+given+to+sinners+in+common%2C+to+believe+on+him%3A+these+are+the+leading%2C+and+the+immediate+grounds%2C+upon+which%2C+the+saints+do+by+faith%2C+build+their+comfort%3B+and+they+are%2C+at+the+same+time%2C+the+sources%2C+from+which%2C+by+the+exercise+of+faith%2C+they+derive+their+consolation.%0A%0ABesides+these%2C+their+faith+and+sense+of+the+pardon+of+their+sins%2C+of+the+acceptance+of+their+persons+as+righteous%2C+of+their+adoption%2C+of+their+sanctification%2C+and+of+the+witnessing+of+the+blessed+Spirit%2C+are+matter+of+consolation+to+them%3B+and+so+is+the+lively+exercise+of+all+the+graces+of+the+Holy+Spirit%2C+especially+of+faith%2C+hope%2C+and+love.+The+comfort+of+justification%2C+because+it+is+founded+upon+a+righteousness+which+is+perfect%2C+and+always+the+same%2C+is+more+stable+and+permanent%2C+than+that+of+sanctification.+The+great+things%2C+which+believers+have+in+possession%2C+and+the+greater%2C+which+they+have+in+hope%2C+are+the+sustenance+of+their+consolation.%0A%0AThe+suitableness+of+those+inestimable+blessings+to+their+hearts%2C+together+with+their+sense+of+personal+interest+in+them%2C+affords+them+unspeakable+joy.+As+to+their+experiences+and+evidences+of+grace%2C+these+are%2C+strictly+speaking%2C+not+grounds%2C+upon+which+they+build+their+comfort%3B+but+they+are+proofs%2C+of+their+saving+interest+in+those+grounds+of+consolation%2C+above+mentioned%2C+as+well+as%2C+encouragements+to+build+their+comfort+upon+them%3B+and+so%2C+they+are+matter+of+consolation+to+their+souls.+The+most+comfortable+of+the+saints%3B+are+they+who%2C+trusting+at+all+times+in+the+second+Adam.+as+given+for+a+covenant+to+them%2C+can+think+of+all+dispensations%2C+of+all+conditions%2C+and+of+all+duties%2C+with+comfort.+They+who+have+the+love+of+Christ+displayed+in+the+covenant+of+grace%2C+most+constantly+in+their+view%2C+and+most+frequently+warm+on+their+heart%3B+are+of+all+believers%2C+the+most+free+from+perplexing+doubts+and+fears.%E2%80%9D%0A%0A%E2%80%94+John+Colquhoun%2C+A+Treatise+of+Spiritual+Comfort%2C+%282nd+edn%2C+Edinburgh%2C+1814%29%2C+pp+19-20.&amp;url=https%3A%2F%2F5solasquotes.github.io%2Fquote%2Ff89e222b04.html&amp;via=5Solas" target="_blank" rel="noopener">Share on X</a><a class="perma" href="../quote/f89e222b04.html">Permalink</a><a class="src" href="https://reformedcovenanter.wordpress.com/2019/01/10/john-colquhoun-on-spiritual-consolation-and-the-covenant-of-grace/" rel="noopener" target="_blank">Read it online · Reformed Covenanter</a></div>

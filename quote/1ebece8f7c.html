<main class="wrap"><figure class="quote" id="q-1ebece8f7c" data-kw="">
<blockquote><p>THE occasion of these words [Luke 13:5] of our Lord and Saviour Jesus Christ, was because there were certain that shewed him of the Galileans, whose blood Pilate had mingled with their own Sacrifices: That is, murdered them as they were sacrificing: and so their blood was mingled with the blood of the beasts which were sacrificed. Those men therefore, though that these Galileans were greater sinners then all other Galileans, because they had suffered such things. And that those xviii. also, upon whom the Tower in Siloam fell and slew them, were sinners above all men, that dwelt in Jerusalem. Wherein they did utter a secret corruption naturally engendered in all men, that is very sharply to see into the sins of others, &amp; severely to censure them: but in the meane while to flatter themselves, &amp; to be blindfold in seeing their own sins.

For these men thought, because the like judgments did not fall upon them, therefore they were safe enough, they were not so great sinners but rather highly in the favour of GOD. According as many do falsely suppose, that those are always the worst sort of people whom God doth most strike, and press with his punishing hand, having forgotten that God doth not keep an ordinary rate here below, to punish every man as he is worst, or to favour and cocker him as he is best, but only taketh some examples as he thinketh good, for the instruction and advertisement of all others, and to be as it were looking glasses, wherein every man may see his own face, yea, and his own cause handled, &amp; that God is a severe revenger of sin, that all men may learn by the example of some, to tremble &amp; beware, least peradventure they be worthily constrained to keep their own turns, and to know what they have deserved.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/arthur-dent.html">Arthur Dent</a></span><span class="wk"><span class="lbl">Work:</span> <cite>A sermon of repentance. A very godly and profitable Sermon, preached at Lee in Essex, by Arthur Dent, Minister of God’s word. And published at the request of sundry Godly and well disposed persons. 1581. the 7. of March</cite>, (London: John Harison, 1582), unpaginated.</span></figcaption>

<blockquote><p>Dr. Begg’s ministry in Paisley began under most trying circumstances, as much so as any with which a young minister ever had to contend. In 1832 there was a fearful outbreak of cholera, which visited many parts of the country, carried off many of all classes, and produced terror in the hearts of multitudes who escaped its actual attack. Probably on account of overcrowding and the want of sanitary arrangements, Paisley was one of the places which suffered most severely. The greater portion of the victims were of the destitute, enfeebled, and dissipated classes. But not all. The mansions of the higher classes were not exempt from the visitation. The strong and the fair were among the victims. The virtuous and the pious did not escape. In all faces were traces of deepest sorrow, mingled with the expression of anxiety and alarm. And there was more than simple sorrow, comfortless weeping for the dead because they were not. A strange madness took hold of the minds of the most ignorant portion of the people, and in some cases extended even to some of whom better things might have been expected. The medical men, who battled with the fell disease with all the courage and energy which are nobly characteristic of their profession, were regarded as its abettors. Every case which baffled their skill was regarded as a murder perpetrated by them. This strange and wicked delusion was, unhappily, not confined to Paisley, but it seems to have found there a peculiarly congenial soil.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/james-a-begg.html">James A. Begg</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The following historical events are related</cite></span></figcaption>

<blockquote><p>But it may be asked again, are synodical decrees to be received as infallible? Certainly not. A synod being constituted of men, however wise and grave, yet of like passions with others, may greatly err, and therefore all their decrees are to be examined by the Law and Testimony. But when as in the Synod at Jerusalem, they examine a question by the light of Scripture, and in the decree which they enact, hear and obey the voice of Christ, speaking in his word, then should that decree be felt binding on the consciences of those over whom the court rules, inasmuch as Christ has said, whatever they thus bind on earth, He will bind in heaven.

That power which church courts exercise, be it remembered, is not self-assumed — not self-created. It is derived immediately from Christ. He only has a right to make laws and appoint officers in His church; and the authority which they exert is therefore only ministerial. That is, as His servants they declare and carry into execution those laws, and those only which are agreeable to the expressed will of their Master. Like judges on the bench, they have no power either to make new laws, or change the laws already laid down. The Bible is their great code, and whenever they depart from that, they have no claim on your obedience.

The force which they employ is not carnal, but moral and spiritual; a force which exerts itself, not in controlling the persons of men, not in inflicting bodily penalties, not in taking possession of their properties, not in giving them over to the civil power, that by its mighty arm they may be crushed; but in warning them of their danger, in rebuking them for their folly, in censuring them for sin, and when they belie their profession, in excluding them from the fellowship of the church. Nor can they exercise even this power over any but those who have voluntarily joined the church, and have in doing so, pledged themselves to submit to its laws.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/james-denham.html">James Denham</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Discourse III in Presbyterianism Defended, and the Arguments of Modern of Prelacy Examined and Refuted, in Four Discourses, by Ministers of the Synod of Ulster</cite></span></figcaption>

That power which church courts exercise, be it remembered, is not self-assumed — not self-created. It is derived immediately from Christ. He only has a right to make laws and appoint officers in His church; and the authority which they exert is therefore only ministerial. That is, as His servants they declare and carry into execution those laws, and those only which are agreeable to the expressed will of their Master. Like judges on the bench, they have no power either to make new laws, or change the laws already laid down. The Bible is their great code, and whenever they depart from that, they have no claim on your obedience.

The force which they employ is not carnal, but moral and spiritual; a force which exerts itself, not in controlling the persons of men, not in inflicting bodily penalties, not in taking possession of their properties, not in giving them over to the civil power, that by its mighty arm they may be crushed; but in warning them of their danger, in rebuking them for their folly, in censuring them for sin, and when they belie their profession, in excluding them from the fellowship of the church. Nor can they exercise even this power over any but those who have voluntarily joined the church, and have in doing so, pledged themselves to submit to its laws.”

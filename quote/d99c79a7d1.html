<main class="wrap"><figure class="quote" id="q-d99c79a7d1" data-kw="">
<blockquote><p>To an unselfish mind personal security is not always perfect felicity. Suppose that a man has found refuge in a fortress, on the alarm of a sudden invasion, but has not succeeded in carrying all his kindred with him; the first emotion, as he looks over the parapet and realises the commanding position of the castle, will likely be assurance, exultation, gratitude. He looks proudly from the towering precipice, which no ladder will ever scale, and rejoices in those walls of living rock which will shake the bullets harmless from their granite ribs, and is thankful that he has found such a refuge.

But, alas I out on the open plain he descries a brother who has thus far escaped, but who, by some infatuation, is running past the castle gate; and though he shouts and makes signals, and at last catches his eye, and points him to the proper entrance, there is some illusion in the case; for the poor fellow shakes his head, and, leaving the gate behind him, passes round in quest of some other inlet. In such a case, the brother saved, because he knew the impregnable security of the stronghold, and knew so well the narrow gate by which himself got in, would only eye with the more lacerating anguish the wilfulness of that dear brother, who, as the foe drew nearer, was fleeing farther and farther from the door of safety.

This was the Apostle’s situation [in Romans 10:1ff]. He had found the refuge. He was looking over the ramparts of salvation—looking down from the rock of Immanuel’s righteousness, a saved, and, so far, a happy man. Satan, a guilty conscience, a broken law, were all beneath him, and for himself he had now no fear. But there—out upon the plains of wrath—in the open field of danger—were his brethren, his kinsmen according to the flesh. And though many of them were anxious for salvation, and fleeing from the wrath to come, some blindness had happened to them, for scarcely one of them made for the door of hope; and though, in the fulness of his fraternal affection, he had lifted up his voice, and, with loud cries and many tears, directed them to the open door, scarce one believed his report.

This was the reason for his trepidation. He himself was safe; but, to see his personal friends, and his beloved countrymen, one by one borne down by their great destroyer, when all his urgency was to them the drivel of one who dreamed, this pierced him to the heart—this made him, on the high places of an absolute assurance, still a man of sorrows. “I am persuaded that nothing can separate me from the love of God; but oh! this great heaviness and continual heart- sorrow for Israel—my brethren, my kinsmen!</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/james-hamilton.html">James Hamilton</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Reasons why men reject the Righteousness of God in The Free Church Pulpit; Consisting of Discourses by the Most Eminent divines of the Free Church of Scotland. Vol. I.</cite></span></figcaption>

</figure><figure class="quote" id="q-6a77021b0e" data-kw="">
<blockquote><p>I despise the idea of receiving any doctrine merely because our fathers believed it; but I would require very strong evidence indeed to convince me, that the whole number of those judicious, and learned, and holy men, who lived during the space of a hundred and fifty years from the time of the Reformation, had all agreed in believing, teaching, publishing, and embodying in the confessions of their respective Churches, a doctrine [the establishment principle] utterly and obviously opposite to the Word of God, and subversive of the whole character, and prosperity of the Church. I would require stronger evidence by far than I will ever obtain, to convince me that there is any ecclesiastical body in our country — how much soever it may arrogate to itself the merit of new discoveries in religious truth — whose judgment will bear even for a moment to be compared with that of the venerable Assembly of Westminster.

The truth is, we live in an age distinguished for its boasting respecting its own illumination. The profound humility that graced the master minds of former days has departed with them; and now it is no unusual thing for the youth whose studies in theology have scarcely passed beyond the surface of its doctrines, to declare most promptly that, even on such subjects as the one before us, he has more knowledge than all his fathers, or the most learned divines of former days. For my own part, such veneration do I feel for the immense theological erudition displayed in the writings of many of those men who adorned the sixteenth and seventeenth centuries, that, although I would not adopt any of their sentiments simply because they were theirs, I am compelled to regard them as worthy of the profoundest deference and the most serious consideration.</p></blockquote>

<blockquote><p>L… The indispensible Law of Nature obliges every man according to his place and calling, his ability, and his opportunities, to do his best to propagate Christ’s gospel and to save mens souls, as much and more than to feed men’s bodies and save their lives… And we did not receive this calling to be altered or forborn at the will of man, but to be performed according to the Word of God: Men being not the makers of the office, nor of God’s Law under which we execute it, nor the donors or limiters of the power, but only… the governors of us in the exercise of it, according to God’s laws, by which they may punish us for mal-administration, but cannot dissolve the Law’s obligation to those that are indeed commanded by it.</p></blockquote>

<blockquote><p>An incident which took place at this time between Hamilton and [Donald] Cargill provides another example of Cargill’s spirit of Christian chairty and his desire to avoid division. The Rotterdam Church, though generally favorable to the exiles, decided to debar [David] Hackston from the communion, presumably because of his involvement in the death of the archbishop [James Sharp, on May 3, 1679]. Cargill was due to officiate at the communion service the following day, 22 October [1679], and Hamilton, on hearing of the church’s decision, immediately went to tell Cargill of it, apparently expecting that he would refuse to take part. ‘But’, says Hamilton, ‘he, with other friends, though resolving to resent it, yet could not determine on such a sudden to withdraw from the church, this being the first step of their ever appearing against us.’ The next day, Cargill gave the communion as planned… an unfortunate disagreement which broke out in the Rotterdam congregation and which split the loyalties of the exiles into two camps. The dispute centered around Robert Fleming, an old fellow-student of Cargill’s at St. Andrews, who was now minister of the Rotterdam Church. Fleming, previously minister of Cambuslang, had been deprived of his charge because of his refusal to conform to the new ecclesiastical order in Scotland, and he was settled in Rotterdam in December, 1677. On revisiting Scotland in 1679 he was arrested and imprisoned in the Edinburgh Tolbooth. Some time after Bothwell [1679], however, he was set at liberty and in October of the same year, shortly after the other exiles arrived, he returned to his charge in Holland. Fleming, a man of judgement and moderation, could not bring himself to condemn those ministers who complied with the Indulgence, though remaining firmly opposed to it himself, and he pleaded with his congregation that such ministers should not be debarred from fellowship. Several of the newly arrived exiles, Robert Hamilton in particular, were highly critical of Fleming’s attitude and refused to countenance his ministry. [Robert] M’Ward, though equally resolute against Fleming’s position, continued to hear him and, instead of condemning him outright, tried by friendly argument to persuade him to change his views. As a result, M’Ward too was ostracized by Hamilton and by some others who sided with him. The disagreement caused M’Ward much distress and mauy well have hastened his end.¹ ¹ In a letter to the church at home [in Scotland] in late 1679 or early 1680 M’Ward wrote, ‘I was so confounded with these cause-destroying excesses… if the principle whereby they defend their practice owned, it would not only infer the dissolution of the united visible church, but also of all Christian society.’… it is clear that the reference is to Hamilton, who himself admits, in a letter dated 15 August 1682, that his fellowship with M’Ward, which had previously been close, ended with the arrival of Fleming. Says Hamilton, ‘Mr M’Ward continued extraordinarily kind until Mr Fleming came over, and then we differing in judgment he became greatly against me, to the making of me so far as possible odious in the whole provinces’…</p></blockquote>

<main class="wrap"><figure class="quote" id="q-f023310025" data-kw="">
<blockquote><p>This whole law is generally distributed into three parts; — first, the moral; secondly, the ceremonial; thirdly, the judicial part of it. And, indeed, there is no precept but may conveniently be referred unto one or other of these heads, as they are usually explained.

That which is commonly called the moral law, the Scripture terms הַדְּבָרִֽים׃ עֲשֶׂ֖רֶת הַבְּרִ֔ית דִּבְרֵ֣י, Exodus 34:28, “The words of the covenant, the ten words,” from whence is the Greek δεκαλογος, or the law of ten words or precepts; all which in their substance are moral, and universally obligatory to all the sons of men.

That part of the law which the Scripture calls הַמִּשְׁפָּטִ֔ים, “judgments,” Exodus 21:1, determining of rights between man and man, and of punishments upon transgressors, with especial reference unto the interest of the people in the land of Canaan, is by us usually termed the judicial law;and the institutions of ceremonial worship are most commonly expressed by the name of חקים, the whole system whereof is termed the law ceremonial.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/john-owen.html">John Owen</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Exercitations on the Epistle to the Hebrews</cite>, (1668), Ex. 20, § 2 in An Exposition of the Epistle to the Hebrews. With Preliminary Exercitations, ed. W. H. Goold (1667; 7 vols, Edinburgh: Johnston and Hunter, 1854), 1: 480-81.</span></figcaption>

</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-38c11b3b1a" data-kw="">
<blockquote><p>By abstaining from all worldly concerns. This is the reason, as we have showed, why it is needful and proper that certain stated parts of time should be set apart to be devoted to religious exercises, because the state of mankind is such in this world that they are necessitated to exercise their minds and employ their thoughts about secular matters.

‘Tis therefore convenient that there should be stated times wherein all should be obliged to throw by all other concerns, that their minds might the more freely and with less entanglement be engaged in religious and spiritual exercises. We are therefore to do thus, or else we frustrate the very design of the institution of a sabbath. We are strictly to abstain from being outwardly engaged in any worldly thing, either in our actions in worldly business, or recreations; we are told to rest in remembrance [of the Lord Jesus Christ and his redemption].

We should be careful that we don’t encroach upon the sabbath at its beginning by busying ourselves about the world after the sabbath is begun. We should avoid talking about worldly matters and thinking about them. For whether we are outwardly concerning ourselves with the world or no, yet if our minds are upon it, we frustrate the end of the sabbath. The design of its separation from other days was that our minds might be disengaged from worldly things, and we are to avoid being outwardly concerned with the world only for this reason, because that can’t be without taking up our minds.

We ought therefore to give the world no place in our thoughts on the sabbath, but to abstract ourselves from all worldly concernment and maintain a watch over ourselves that the world does not encroach, as it is very apt to do; Isaiah 58:13, “if thou turn away thy foot from the sabbath, from doing thy pleasure on my holy day; and call the sabbath a delight, the holy of the Lord, honourable; and shalt honour him, not doing thine own ways, nor finding thine own pleasure, nor speaking thine own words.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/jonathan-edwards.html">Jonathan Edwards</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Perpetuity and Change of the Sabbath</cite>, (1730-31) in Mark Valeri (ed.), Sermons and Discourses, 1730-1733: The Works of Jonathan Edwards Volume 17 (New Haven CN: Yale University Press, 2000), p. 248.</span></figcaption>

<blockquote><p>But, good friend, if really Christ and Scripture be your guide, I desire no more; tell me, and lay by partiality: Did not Christ and his apostles use both in the synagogues, Church, meetings and writings a faulty translation of the Old Testament, and as bad as ours. Deny it if you can for shame. Though sometimes they varied, they mostly used the Septuagint, according to which our faulty translation of the Old Testament is made, as it differs from the Hebrew. Is this no confutation of you? [(1)] Yea, Christ and the apostles used it the rather because it was in common use… I would add a similitude [It was actually a real and common scenario in that era]: Supposing that we had just possession of the public church-places and tithes, and they are taken from us, and we can blame them that did it and say over and over, ‘We had possession;’ and therefore it is unlawful to meet in worse rooms, for God must have the best: will this hold when you cannot keep possession? Will you rather worship nowhere? This is no better than if you would tell all men they should die rather than eat brown bread, if force take all other [food] from them, because it is unjustly done and they had possession of better. Good friends, keep your possession for me, but I own not the famishing of all that are dispossessed. If you do, I do not… How much the Septuagint differs from the Hebrew, how many verses it leaves out, how many additions and alterations it makes, is commonly known. Christ’s and the apostles’ use of this was no approbation of its faults, much less their presence in the synagogues when others read Moses and the prophets in them. And the Psalms in the Septuagint translation were part of their liturgy. For man to speak faultily is no wonder: It has a more plausible pretence for separation to say that men corrupt the Word of God. And yet when it is but such an effect of human imperfection, it is no just pretence.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/richard-baxter.html">Richard Baxter</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Catholic Communion Doubly Defended by Dr. Owen’s Vindicator &amp; Richard Baxter</cite>, … (London: Parkhurst, 1684) | section 5, ‘A comparison of the use of a faulty translation of the Scripture and a faulty liturgy’ See also the whole of this article.</span></figcaption>

<blockquote><p>The third kind of plays are mixed, which stand partly of hazard, and partly of wit, and in which hazard begins the game, and skill gets the victory: and that which defective by reason of hazard, is corrected by wit. To this kind are referred some games at the cards and tables. Now the common opinion of learned Divines is, that as they are not to be commended, so they are not simply to be condemned, and if they be used, they must be used very sparingly. Yet there be others that hold these mixed games to be unlawful, and judge the very dealing of the cards to be a lot, because it is a mere casual action. But (as I take it) the bare dealing of the cards is no more a lot, than the dealing of an alms, when the Prince’s almner puts his hand into his pocket, and gives, for example, to one man six pence, to another twelve pence, to another two pence, what comes forth without any choice. Now this casual distribution is not a lot, but only a casual action. And in a lot there must be two things. The first is, a casual act: the second, the applying of the foresaid act, to the determination of some particular and uncertain event. Now the dealing of the cards is a casual act; but the determination of the uncertain victory is not from the dealing of the cards in mixed games, but from the wit and skill, at least from the will of the players. But in things that are of the nature of a lot, the wit and will and a man has no stroke at all. Nevertheless, though the dealing of the cards and mixed games be no lots; yet it is far safer and better to abstain from them, than to use them, and where they are abolished, they are not to be restored again, because in common experience, many abuses and inconveniences attend upon them: and things unnecessary, when they are much abused, because they are abused, they must not be used, but rather removed, as the brazen serpent was, 2 Kings 18:4.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/william-perkins.html">William Perkins</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Whole Treatise of the Cases of Conscience</cite>, … (Cambridge, 1606), bk. 3, ch. 4, section 4, Question 2, ‘What kinds of recreations and sports are lawful and convenient, and what be unlawful and inconvenient?’, pp. 591-92 Perkins (1558–1602) was a leading English puritan.</span></figcaption>

<blockquote><p>We believe that the ceremonies and figures of the law ceased at the coming of Christ, and that all the shadows are accomplished are accomplished; so that the use of them must be abolished among Christians: yet the truth and substance of them remain with us in Jesus Christ, in whom they have their completion. In the mean time we still use the testimonies taken out of the law and the prophets, to confirm us in the doctrine of the gospel, and to regulate our life in all honesty to the glory of God, according to his will.</p></blockquote>

<main class="wrap"><figure class="quote" id="q-33ef06b375" data-kw="">
<blockquote><p>I. The question concerning fundamental articles is difficult and important. It has been discussed by many who have erred both in defect and in excess. The Socinians err in defect who admit very few fundamentals (and those only practical, theoretical being almost entirely set aside) so that they may teach that the settling of the differences in religion is easy since they relate more to theological conclusions and to the dogmas of the schools than to fundamental articles of faith (which are both few in number and held substantially by both sides). Under this pretext they take away from fundamentals the principal doctrines of faith: as the doctrine concerning the Holy Spirit, the Trinity, the person of Christ, the satisfaction, etc. To this class the Arminians evidently belong who reduce fundamentals to those heads which are placed beyond dispute among almost all Christians and are contained in these three: faith in the divine promises, obedience to the divine precepts and a due reverence for the Scriptures. II. Those who err in excess are both the papists who are impudent enough often to declare as fundamental their own hay and stubble and whatever the Romish church teaches; and the more strict Lutherans who (to render a union with us more difficult) extend fundamentals more widely than is just, turn almost every error into a heresy and make necessary those things which are indifferent so as more easily to prove that we differ on fundamentals. III. The orthodox hold the mean between both. As they necessarily build upon some fundamentals, so they neither restrict them too closely, nor extend them too far. IV. As in a house that is the foundation which has such a position that the house can neither be erected nor stand without it, so in religion that is the foundation upon which the whole of religion depends and it standing, religion stands; removed, religion falls. It is used in two senses: either simply and personally (applied to Christ the foundation of all salvation upon which the church and religion are built as upon a firm and immovable rock, Mt. 16:18; 1 Pet. 2:6, 7; 1 Cor. 3:11—“for other foundation can no man lay than that is laid, which is Jesus Christ”); or comprehensively and naturally for the fundamental truth which all are required to believe and which is therefore called the foundation of faith. But this may be either widely extended to the first rudiments of the Christian religion (which were taught the catechumens for initiation and are called by the apostle the foundation [themeliou], or the principles [archēs]): such as repentance from dead works, faith toward God, the doctrine of baptisms, the laying on of hands, the resurrection of the dead and eternal judgment (Heb. 6:1, 2). These principles however have not an equal degree of necessity, some being necessary primarily and by themselves and others secondarily only and by reason of some other thing. In this sense, fundamental articles of religion belong to the decalogue, the Apostles’ Creed, the Lord’s Prayer, the sacraments and the power of the keys because they contain the doctrine of salvation as necessary and fundamental without which we cannot receive the rest. Or strictly, it denotes the essential doctrines of Christianity of which theory (theōria) and practice is necessary simply as to the thing itself; or which are simply and absolutely necessary to be believed by all Christians and cannot be unknown or denied without peril to salvation. In this sense, we now speak of fundamental articles. V. Although all the truths revealed in Scripture are necessary to be believed as divine and infallible, yet they are not all equally necessary and the amplitude and extension of faith must be accurately distinguished here from its necessity. Not everything which belongs to the amplitude of faith must therefore belong to its necessity. All truths are not of the same weight. Some have a greater, others a lesser degree of necessity. For example, some are necessary by the necessity of means; others only by the necessity of precept. Some relate to doctrines strictly so called, others only to rites and ceremonies. One relates to some article or doctrine as to substance (for instance that Christ suffered and died); another to the same considered only with reference to circumstances (for instance, that Christ suffered under Pontius Pilate and was crucified between two thieves). For we might be ignorant of the latter without peril to our salvation.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/francis-turretin.html">Francis Turretin</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Institutes of Elenctic Theology</cite>, ed. James T. Dennison Jr., trans. George Musgrave Giger, vol. 1 (Phillipsburg, NJ: P&amp;R Publishing, 1992–97), 1.14.1–5 (p. 48–49).</span></figcaption>

<blockquote><p>That principle, whereby they maintain the lawfulness of gathering churches out of Churches, acknowledged by themselves to be true Churches. A most dividing principle, insofar as it gives way for every man to separate from his own, and to join himself with another church supposed purer, with contempt of the former congregation. To gather churches out of Churches, is the way to destroy, but not to heal diseased Churches; It is to destroy many churches for making up of one, as if one going about the cure of a natural body should cut off and take out all the sound members and leave the rotten and diseased members either to cure one another or to perish. A strange and desperate way of cure.</p></blockquote>

<blockquote><p>Reason 2. They that consenting with others in the doctrine of salvation by Christ, do nevertheless separate themselves from them as touching spiritual communion, are schismatics (1 Cor. 1:10-11; Jud. 19)… They that without just cause, renounce all spiritual communion in public with a true Church, are schismatics… The Church of England is a true Church of God… The Gospel of our saluation is the word of truth. The Church of England upholds as a pillar, the Gospel of our salvation. Therefore it upholds the word of truth, and by consequence it is a true Church. Let them not here stand to show a difference between the Church of England and Ephesus. There may be a difference between true Churches: notwithstanding they are all true that maintain the word of truth, the Gospel. … If they are to be accounted true teachers, who keep this foundation (Christ is come in the flesh) and build not upon it any doctrine overthrowing the same, then a Church, as that now of England, is to be held for a true Church, which retains this foundation of the Christian Faith and builds not upon it any doctrines overthrowing the same.</p></blockquote>

<blockquote><p>[Robert] Browne, the Father of the Brownists, was the first of note that did separate himself from the Church of England and said that we had not a Church; he meant a true Church. But after he went into France, and being at Geneva, he saw the Sabbath much prophaned, and the wafer-cake given in the sacrament instead of bread, whereupon he began to think better of the Church of England… The Church of Rome was a true Church, the Reformed Churches separated from it becoming a false Church.</p></blockquote>

<blockquote><p>The Reformed orthodox generally also note… three kinds of doctrinal error: 1. errors against a fundamental article… 2. errors around a fundamental or in indirect contradiction to it… 3. errors beyond a fundamental article (praeter fundamentum)… The third category of error does not address fundamental articles directly or indirectly but rather involves faith in problematic and curious questions… that do not arise out of the revealed Word–hay and stubble!–and that, because of their curiosity and vanity, constitute diversions from and impediments to salvation. (Rijssen, Summa, I.xiii; cf. Turretin, Inst. theol., I.xiv.9)” – Muller, PRRD (2003) 1.422-23 Hottinger, Johann Heinrich – The 8th Theological Disputation of the Gymnasium: Of the Use &amp; Abuse of the Distinction of [Theological] Places into Fundamental &amp; Non-Fundamental (Zurich, 1664) Cocceius, Johannes – ch. 7. ‘Of that which is Fundamental’ in A Sum of Theology Rehearsed out of the Scriptures (Geneva, 1665), pp. 90-97 Velthuysen, Lambert – 3. ‘Of Principles from the First Rising, or Fundamental Articles &amp; Errors’ in Theology (Fribourg, 1666), pp. 8-11 Velthuysen (1623-1685) Burman, Francis – Ch. 3. ‘Of the Foundation &amp; Fundamental Articles’ in A Synopsis of Theology… (Utrecht, 1671), vol. 2, Locus 41, ‘Of Revelation &amp; the Word under the Economy of the New Covenant’, pp. 308-317 Burman (1628-79) Pauli, Reinhold – A Compendium of Theological Disputations… Ch. 1, On the Fundamental of the Faith (Marburg 1672) Pauli (1638-1682) was a German reformed professor of theology at Marburg. Heidegger, Johann Heinrich – A Dissertation on the Foundation of Salvation, whereby the Whole Subject of Fundamental &amp; Non-Fundamental Articles &amp; Errors is Struck (Zurich, 1676) Rissen, Leonard – Locus 1, ‘Of Theology’, Controversy 3, sections 12-13, pp. 13-14 in A Sum of Didactic &amp; Elenctic Theology, out of Our Theologians, especially out of Francis Turretin’s Institutes of Theology... (Bern, 1676; 1690) Here is an introduction to the life of Rissen (1636-1700). Amongst other things, Rissen notes that Socinians and Arminians err in fundamentals by defect, and Papists and Lutherans err in excess. “We maintain the middle.</p></blockquote>

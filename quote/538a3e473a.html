<main class="wrap"><figure class="quote" id="q-538a3e473a" data-kw="">
<blockquote><p>In another way, they can be distinguished thus: The divine will, as will be clear below, wills something simply, and wills something conditionally or as much as is in itself; and in both ways it happens that it is signified. Therefore, the absolute will can be compared to something either by way of complacency or by way of displeasure. If by way of displeasure, that in no way happens: and thus it does not happen that this is signified or known by any exterior sign. If by way of complacency, either because that which happens pleases, and thus fulfillment; or because something from that pleases, and thus permission; and thus we have two signs. Again, the divine will can be signified as antecedent or conditional, and this in two ways: either by way of complacency, such that the opposite does not please, and thus command; or by way of displeasure, and thus prohibition; or by way of complacency, such that the opposite does not displease, and thus counsel. By way of displeasure, however, such that the opposite does not please, it is impossible to find [this]. And according to this, the number and sufficiency and the solution to the objections are clear.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/bonaventure.html">Bonaventure</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Commentary on the Sentences</cite>, (d. 1274), bk. 1 | dist. 45, art. 3, quest. 2, On the number and sufficiency of the signs of the divine will</span></figcaption>

0to%20the%20objections%20are%20clear&amp;text=In%20another%20way%2C%20they%20can%20be%20distinguished%20thus&amp;text=and%20the%20solution%20to%20the%20objections%20are%20clear" rel="noopener" target="_blank">Read it online · Reformed Books Online</a></div>
</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-0db55133c7" data-kw="">
<blockquote><p>The will of God is God by one simple act, absolutely willing the being of whatsoever He pleases. That distinction of the absolute and conditional will, as also that of the antecedent and consequent will of God, are both unsound. God wills it to be a truth that whosoever believes shall be saved: He likewise wills it to be the duty of Judas to believe: Hence follows (in case) a will of approbation concerning things in their own nature possible, which yet never shall be: as namely, the acceptation of the obedience of the reprobates; but it does not follow that God has conditionally willed the acceptation of the obedience of the reprobates. God decrees the coexistence of two extremes conditionally cohering, as the faith and salvation of Judas, the sight of such miracles and repentance in the Tyrians: the being of which extremes themselves He has not decreed. Though the things willed be conditioned, yet the volition or willing of God concerning those things is absolute. The authors and approvers of the second distinction, understand by the antecedent will of God (John Damascene, Of the Orthodox Faith, bk. 2, ch. 29), his will concerning the creature looking at it as in itself, without any consideration of after-circumstances: so they say God wills all men, even the reprobate to be saved: this they call his first will, and it is, say they, uncertain. By the consequent will of God, they understand his will concerning the creature looked at, not only as in itself, but together with after-adjuncts and circumstances, as sin, etc. This they call his second will, and it is, say they, certain. As a judge looking upon such a person as in himself, accounts it best that he should live; but looking upon him in second respects, as a murderer, etc. he accounts it best that he should die. The vanity of both these distinctions appears in that they are repugnant to the simplicity, perfection and independence of the first cause. The will of God in the decree, and the revealing of part thereof in the command, do not infer diverse wills in God: The command shows what is the duty of man; the decree contains God’s purpose concerning our doing or not doing our duty. To will such a thing ought to be and not to will that it shall be, yea to will the not being thereof, are not opposite. But both may and do proceed from the same will.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/john-norton.html">John Norton</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Orthodox Evangelist</cite>, … (London: Macock, 1654), ch. 1, ‘Of the Divine Essence’, pp. 17-18</span></figcaption>

</figure><figure class="quote" id="q-923e9c979d" data-kw="">
<blockquote><p>…there is a two-fold will of God; one that is revealed in Scripture, or the Law of Nature, and that is the Moral good that God approves and enjoins to us, rather than the will of God; this the Familists call the exterior or accidental will of God, because God’s will, as his essence, should have been entire and self-sufficient, though God had never revealed any such will to men or angels, yea though He had never made the world, or men, or angel.</p></blockquote>

<blockquote><p>4. The prosperity of sinners usually renders the means of grace ineffectual, that should reclaim and reform them, and consequently their destruction is remediless. The means of grace are internal or external: Internal, the motions of the Holy Spirit and the convictions and excitations of conscience: External, the ministry of the Word and the counsels of faithful friends; all which are usually made frustrated and inefficacious by the vices and lusts of the prosperous.</p></blockquote>

<main class="wrap"><figure class="quote" id="q-fb7cd482f8" data-kw="">
<blockquote><p>. . . we must here observe the opposition between the law and the free promise of God in the justification of a sinner. “For if life come by the law, it comes not by the promise,” says Paul. And, “If they which are of the law are heirs, the promise is of none effect” (Rom. 4:14). By this we see the Church of Rome overturns and abrogates the free promise of God. For they of that church teach that the first justification is by mere mercy. And that the second is by the works of the law. But the law and the promise cannot be mixed together, more than fire and water. The law joined with the free promise disannuls the said promise.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/william-perkins.html">William Perkins</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Works of William Perkins, ed. Paul M. Smalley, Joel R. Beeke, and Derek W. H. Thomas, vol. 2 (Grand Rapids, MI: Reformation Heritage Books, 2015), 193.</cite></span></figcaption>
<div class="meta"><span class="t"><a href="../topics/justification.html">Justification</a></span></div>

</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-5b6a5eb2a1" data-kw="">
<blockquote><p>Proposition 3: Many of our learned [Romish] adversaries destroy that which is principal and most essential in remission of sinnes, to wit, condonation. Vasques the Jesuit says [denying condonation]… The said author confirms his opinion by these two arguments especially: … Argument 2: If a condonation be admitted for the merit of Christ, then the merit of Christ imputed is the formal cause of that condonation: and granting this, the justification of a sinner must have two forms: one of remission of sins; the other of inward cleansing and sanctification. But this is contrary to the Trident Council affirming that justification has but one form. (Bellarmine, On Justification, bk. 2, ch. 2; Concil of Trent, sess. 6, ch. 7) And it differs very little from the doctrine of the Protestants. For in the principal, it is one with it, to wit, in that it holds that a justified person does next and immediatly receive the remission of sins for the merit of Christ imputed. And the smaller difference between the sides, to wit, whether inherent justice may be admitted a part of justification, might be qualified by some such modification as Vega propounds to Calvin (For the Council of Trent, bk. 15, ch. 5), saying, ‘If at all times when one is iustified, he is also sanctified, what offence is it to allow one common word (namely ‘justification’ [citing Beza on Tit. 3:7 &amp; Rom. 8:30]) to express and contain both these parts?’ I am not ignorant that many other Papists admit condonation; but Vasquez charges that opinion with having affinity with ours, and affirms and proves that it is repugnant to the Trident Councel.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/francis-white.html">Francis White</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Orthodox Faith &amp; Way to the Church Explaned &amp; Justified in Answer to a Popish Treatise... (London: Field, 1617), pt. 1, ch. 1, Observation 1, ‘Touching remission of sins in justification’, pp. 18-19 White (c. 1564 – 1638) was an Anglican bishop.</cite></span></figcaption>
<div class="meta"><span class="t"><a href="../topics/justification/twofold-justification.html">Twofold Justification and Its Increase</a></span></div>

<blockquote><p>Despite its many weaknesses, this earlier work remains a landmark of scholarship in the field… At that time, the only serious attempt to document this development was Ritschl’s Die christliche Lehre von der Rechtfertigung und Versohnung (1870). The value of that work was rather reduced by the moralist assumptions Ritschl brought to his task, and by his decision to limit his analysis from the eleventh to the nineteenth century, focusing particularly on German-language Protestant contributions to the discussion. The vast scholarly undertakings which have given the modern period the magnificent critical editions denied to Ritschl (such as the Weimar Luther edition) have also cast new light on the theology of the medieval period, calling into question many of Ritschl’s conclusions. One of the more troubling aspects of my investigation was the realisation that most of Ritschl’s conclusions, particularly his very unsatisfactory account of Luther’s theological formation, could no longer be sustained.” – McGrath, Iustitia Dei, 3rd ed., Preface, vii, ix-x McGrath, Alister – Iustitia Dei: A History of the Christian Doctrine of Justification 3rd ed. rev. (Cambridge Univ. Press, 2005) 2nd ed.: ToC 1, 2 Kang, Paul C. – Justification: the Imputation of Christ’s Righteousness from Reformation Theology to the American Great Awakening &amp; the Korean Revivals Pre (2006) 160 pp. ToC . On the Early &amp; Medieval Church Book Estrada, Erik – Faith Alone: Debates About Justification Before the Reformation Pre (Fortress Press, 2026) 466 pp. ToC Blurb: “…contrary to the historical outlook of a good number of Catholic and Protestant historians and theologians, there were indeed conflicts within the Great Church (ca. 100-700 CE) over the question ‘After baptism, is faith alone enough to save the orthodox Christian?&#x27;</p></blockquote>

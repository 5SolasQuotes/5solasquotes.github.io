<main class="wrap"><figure class="quote" id="q-b04d219569" data-kw="">
<blockquote><p>Judas was a great Statesman in the Devil’s Commonwealth; for he bore four main offices: either he begged them shamefully, or he bought them bribingly, or else Beelzebub saw desert in him, and gave him them gratis, for his good parts; for Judas was his white boy. He was 1. an hypocrite. 2. a thief. 3. a traitor. 4. a murderer. Yet the Pope shall vie offices with him, and win the game too for plurality.

The Pope sits in the holy chair, yet a Devil: perjury, Sodomy, sorcery, homicide, parricide, patricide, treason, murder, &amp;c. are many and essential things to the Pope. He is not content to bee Steward, but he must be Vicar, nay indeed, Lord himself: for what can Christ do, and the Pope cannot do? Judas was no body to him. He hath stolen Truth’s garment, and put it on Error’s back, turning poor Truth naked out of doors.

He hath altered the primitive institutions, and adulterated God’s sacred laws; maintaining vagas libidines: he steals the hearts of subjects from their Sovereigns, by stealing fidelity from the hearts of Subjects: and would steal the crown from the king’s head, and all under the shadow of religion. This is a thief; a notable, a notorious thief, but let him go: I hope he is known well enough, and every true man will bless himself out of his way.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/thomas-adams.html">Thomas Adams</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The white devil, or The hypocrite uncased: In a sermon preached at Paul’s Cross, March 7. 1612</cite>, (London: Melchisedech Bradwood, 1613), pp 39-40.</span></figcaption>

</figure><figure class="quote" id="q-8edd371a20" data-kw="">
<blockquote><p>Lo, before ever there was father or mother or son in the world, God has appointed that the bonds betwixt husband and wife shall be more strait and indissoluble than betwixt the parent and child; and can any man be so unreasonable as to defend it lawful upon some unkind usages or thwartness of disposition, for a parent to abandon and forsake his child; or the son to cast off his parent? Much less therefore may it be thus betwixt an husband and wife: They two are one flesh. Behold here an union of God’s making: A man’s body is not more his own than his wife’s body is his: And will a man be content to part easily with a piece of himself? Or can we think that God will endure an union made by Himself to be slightly dissolved? Or how is this bodily matrimony a lively image of the spiritual marriage betwixt Christ and his Church (who has said, ‘I will betroth thee unto me forever; Yea I will betroth thee unto me in righteousness and in judgment, and in loving kindness, and in mercies,’ Hos. 2:19), if upon small occasions it may be subject to utter dissolution? Yea, what speak I of divinity? Even modest heathens would hiss this Libertinism off the stage…</p></blockquote>

</figure><figure class="quote" id="q-6dd88f4c74" data-kw="">
<blockquote><p>7th Conclusion. When the representative Church is universally apostatical, then may the prince use the help of the Church-essential of found believers, for a reformation; and if they also be apostatic (which cannot be, except the Lord utterly have removed his candlestick) we see not what he can do but hear witness against them, but if there be any secret seeker of God in whose persons the essence of a true Church is conserved. The king by a royal power, and the law of charity is obliged to reform the land, as the godly kings with a blessed success have hitherto done, Asa, Josiah, Jehoshaphat, in which case the power of reformation and of performing many acts, of due belonging to the Church officers, are warrantably performed by the king, as in a diseased body, in an extraordinary manner power recurs from the members to the politic head and Christian prince, who both, as a King, in an authoritative way is obliged to do more then ordinary, and as a Christian member of the Church, in a charitative and common way, is to care for the whole body.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/samuel-rutherford.html">Samuel Rutherford</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Due Right of Presbyteries, ‘Acts 15, A Pattern of a Juridicial Synod’</cite>, (1644), p. 419</span></figcaption>

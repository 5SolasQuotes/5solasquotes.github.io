<main class="wrap"><figure class="quote" id="q-aac5bc0451" data-kw="">
<blockquote><p>For they [Suarezians] place it [the will] in every state always in a certain citadel of integral power, constituted in an equilibrium with full capacity for either side, deflected by no inclination — altogether its own master and arbiter, as it were giving laws to causes and circumstances as they present themselves, commanding them to comply with its nod and to await its direction. Yet the matter is very different. For our will in this state of fallen nature, in which it exists, has greatly weakened and declined from that first state of integrity and innocence, as the Second Council of Orange and the Council of Trent teach us. Moreover, it depends greatly upon the knowledge and presentation of objects and follows the intellect leading it, accommodating itself to it rather than the intellect to it. In addition, it is disturbed by concupiscence — both irascible and concupiscible — by which it is often displaced from its position and dislodged from its right station. It is marvelously and variously affected by movements and perturbations of the soul; sometimes it is pressed and driven by appetite, and sometimes enticed and drawn by pleasure it serves lust. On another side, it is shaken from the movement of appetite and terror, and in its own station it wavers and scarcely maintains its integral liberty. And again — how often is it seized by ignorance and blindness of the mind, and deviates from the straight path of reason? How often, burning with the heat of lust and without a bridle, does it run headlong and is immersed in the mire of pleasures, from which not without sorrow and groaning does it drag itself out defiled? Not rarely do inveterate habits so incline it that it resists them with difficulty. Even the domestic familiarity of custom makes it live with custom as if at home, and causes it to neglect new things, however excellent, as though foreign. Indeed, I have seen nothing more volatile than the will when it is free from affection, nothing more constant when occupied with affection. Nor is it so powerful and mistress of itself as is imagined; since in its first primary acts it is desired and wholly occupied, and suffers involuntarily the assaults of those acts and their concomitant effects. It is bent by counsels, warnings, prayers, threats, loves, terrors, simulations, flatteries, titillations, jests, laughter, applause — by these it is led and drawn, so that it seems to do nothing other than what those authors call the mistress — namely, to serve everyone. And yet even then, when it is affected in so many ways, shaken, changed, drawn, and bent, it preserves its liberty… The will, inclined toward lust, can enjoy a woman and be led by that pleasure and remain free. Will it not be able to remain free when inclined and premoved by God?</p></blockquote>

<blockquote><p>In the contrary extreme are the Thomists, who, in their zeal to preserve the subordination and dependence of the secondary cause upon the first, posit a certain prior motion determining the secondary cause on God’s part — which is a complement of power in first act bringing with it second act antecedently. They teach this to be a physical quality, or something after the manner of a quality, which is the ground of applying and determining the secondary cause to a certain action, which in free causes could not otherwise be determined, since they are by their nature indifferent. And thus the efficacy of the divine decree is made consistent, the dependence of creatures upon it, and the infallible certainty of divine knowledge concerning future free acts… so Alvarez is the illustrious author of this position… and before him Medina… and Báñez… Conrad…</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/francisco-macedo.html">Francisco Macedo</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Collations of the Teachings of St. Thomas &amp; Scotus, with the Differences between the Two: with the Texts of Both Faithfully Presented, and the Sentences Subtly Examined, with the Commentaries of the Interpreters</cite>, … vol. 2 tr. AI by Vertias (Padua: Frambotti, 1671), , bk. 2, Collation 9, pp. 361-429 | Position of Later Thomists, p. 375</span></figcaption>

<blockquote><p>…the opposite case of the right and meritorious act, toward which God concurs by producing everything in the act — both the moral and the physical — because He decreed both from eternity and foresaw them by intending, predefining, and indeed commanding them. And so He concurs in time by placing the cause in the first act through the auxiliaries of grace, so that it would be in the proximate power toward right acting in the second act; then by determining it through the concurrence of assisting grace toward eliciting the right and meritorious act. This is the proper and connate concurrence owed by the first cause to the secondary cause that is going to operate — just as the determination as to the individual is also connected inseparably with exercise…</p></blockquote>

<div class="actions"><button class="copy" data-copy="“…the opposite case of the right and meritorious act, toward which God concurs by producing everything in the act — both the moral and the physical — because He decreed both from eternity and foresaw them by intending, predefining, and indeed commanding them. And so He concurs in time by placing the cause in the first act through the auxiliaries of grace, so that it would be in the proximate power toward right acting in the second act; then by determining it through the concurrence of assisting grace toward eliciting the right and meritorious act. This is the proper and connate concurrence owed by the first cause to the secondary cause that is going to operate — just as the determination as to the individual is also connected inseparably with exercise…”

— Francisco Macedo, Collations of the Teachings of St. Thomas &amp; Scotus, with the Differences between the Two: with the Texts of Both Faithfully Presented, and the Sentences Subtly Examined, with the Commentaries of the Interpreters… vol. 2 tr. AI by Vertias (Padua: Frambotti, 1671), , bk. 2, Collation 9, pp. 361-429 | Concurrence with Evil Actions | Good Acts">Copy</button><a class="share" href="https://x.com/intent/post?text=%E2%80%9C%E2%80%A6the+opposite+case+of+the+right+and+meritorious+act%2C+toward+which+God+concurs+by+producing+everything+in+the+act+%E2%80%94+both+the+moral+and+the+physical+%E2%80%94+because+He+decreed+both+from+eternity+and+foresaw+them+by+intending%2C+predefining%2C+and+indeed+commanding+them.+And+so+He+concurs+in+time+by+placing+the+cause+in+the+first+act+through+the+auxiliaries+of+grace%2C+so+that+it+would+be+in+the+proximate+power+toward+right+acting+in+the+second+act%3B+then+by+determining+it+through+the+concurrence+of+assisting+grace+toward+eliciting+the+right+and+meritorious+act.+This+is+the+proper+and+connate+concurrence+owed+by+the+first+cause+to+the+secondary+cause+that+is+going+to+operate+%E2%80%94+just+as+the+determination+as+to+the+individual+is+also+connected+inseparably+with+exercise%E2%80%A6%E2%80%9D%0A%0A%E2%80%94+Francisco+Macedo%2C+Collations+of+the+Teachings+of+St.+Thomas+%26+Scotus%2C+with+the+Differences+between+the+Two%3A+with+the+Texts+of+Both+Faithfully+Presented%2C+and+the+Sentences+Subtly+Examined%2C+with+the+Commentaries+of+the+Interpreters%E2%80%A6+vol.+2+tr.+AI+by+Vertias+%28Padua%3A+Frambotti%2C+1671%29%2C+%2C+bk.+2%2C+Collation+9%2C+pp.+361-429+%7C+Concurrence+with+Evil+Actions+%7C+Good+Acts&amp;url=https%3A%2F%2F5solasquotes.github.io%2Fquote%2F963508f7c6.html&amp;via=5Solas" target="_blank" rel="noopener">Share on X</a><a class="perma" href="../quote/963508f7c6.html">Permalink</a><a class="src" href="https://reformedbooksonline.com/on-concurrence-secondary-causation-occasionalism/#:~:text=the%20opposite%2

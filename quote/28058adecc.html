<main class="wrap"><figure class="quote" id="q-28058adecc" data-kw="">
<blockquote><p>Set wide open your hearts, those everlasting-doors to the King of Glory, and only to the King of Glory, and the King of Glory in much glory will come in; a glorious throne will He erect in your souls.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/nicholas-lockyer.html">Nicholas Lockyer</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Balm for Bleeding England &amp; Ireland</cite>, … (London: Rothwell, 1643), p. 117 Lockyer (1611–1685) was an English clergyman and Independent minister who took the Solemn League and Covenant. He was a close supporter of Oliver Cromwell and later an ejected minister and nonconformist.</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/effectual-calling/means-of-calling.html">Means of Calling</a></span></div>

</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-18fe4aaffb" data-kw="">
<blockquote><p>…do it obedientially, hearken to the commands, that thy peace may be as a river flowing in the joys of faith: If thus thou wilt hear and open to Christ, who stands and knocks at the door of thy heart, He will come in to thee, and sup with thee, and thou with Him, Rev. 3:20. He will come in to thee in intimate communion, and sup with thee in the acceptance of thy graces, and thou shalt sup with him at a banquet of love: Thou mayst experimentally say that the Gospel is come to thee in power and in the Holy Ghost, and in much assurance, as the apostle speaks, 1 Thess. 1:5. In power in, the first work of conversion; in the Holy Ghost, in the gracious indwelling of it after faith; and in much assurance, in the sealings of truth and love upon the heart.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/edward-polhill.html">Edward Polhill</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Precious Faith considered in its Nature, Working &amp; Growth</cite>, (London: Cockerill, 1675), ch. 14, p. 444-45</span></figcaption>

</figure><figure class="quote" id="q-6abde360a1" data-kw="">
<blockquote><p>And he ran before, and climbed up into a sycomore tree to see him: for he was to pass that way. And when Jesus came to the place, he looked up, and saw him, and said unto him, ‘Zacchaeus, make haste, and come down; for to day I must abide at thy house.’ And he made haste, and came down, and received Him joyfully. And when they saw it, they all murmured, saying, That he was gone to be guest with a man that is a sinner. And Zacchaeus stood, and said unto the Lord: Behold, Lord, the half of my goods I give to the poor; and if I have taken any thing from any man by false accusation, I restore him fourfold. And Jesus said unto him, ‘This day is salvation come to this house, forsomuch as he also is a son of Abraham. For the Son of man is come to seek and to save that which was lost.&#x27;</p></blockquote>

<blockquote><p>He offers him grace and pardon for all that is past to turn him, yea He counsels him to turn, and entreats him, by his benefits seeks to lead him to repentance (Rom. 2:4), and which is more then all this, He knocks at the door of his heart by his Spirit (Rev. 3:20), and who can say then but that it is true, which is here said, He delights not in his dying?</p></blockquote>

</figure><figure class="quote" id="q-6d8c6769f4" data-kw="">
<blockquote><p>Yet it is a good observation of [an]other [Aquinas and Rupertus], that John [the Baptist] is not crier, but the voice of the crier: for it is Christ who cries in preachers; He speaks by the mouth of all his holy prophets: He cries, ‘O ye foolish, how long will ye love foolishness?’ He cries, ‘Repent for the kingdom of God is at hand.’ He cries, ‘Come unto Me all ye that are wearied and laden, and I will refresh you.’ To day then if ye will hear his voice, harden not your hearts, but suffer the words of exhortation and doctrine: be moved at his cry, lest He despise your call. As He says in the first of the Proverbs (v. 23): Because I have called, and ye have refused, I have stretched out mine hand, and none would regard: therefore they shall call upon Me, but I will not answer: they shall seek Me early, but they shall not find Me. Think on this all ye that forget God, ye that suffer Christ to stand and knock, and cry at the door of your hearts, and yet you will not let Him in.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/john-boys.html">John Boys</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Exposition of the Dominical</cite>, [Lordly] Epistles &amp; Gospels used in our English Liturgy... (d. 1625; 1638) | 4th Sunday in Advent, p. 109</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/effectual-calling/means-of-calling.html">Means of Calling</a></span></div>

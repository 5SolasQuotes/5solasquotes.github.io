</figure><figure class="quote" id="q-1a4f8877c3" data-kw="">
<blockquote><p>Obs. XXIX. The new covenant is made with them alone who effectually and eventually are made partakers of the grace of it. — “This is the covenant that I will make with them,..... I will be merciful unto their unrighteousness,” etc. Those with whom the old covenant was made were all of them actual partakers of the benefits of it; and if they are not so with whom the new is made, it comes short of the old in efficacy, and may be utterly frustrated. Neither doth the indefinite proposal of the terms of the covenant prove that the covenant is made with them, or any of them, who enjoy not the benefits of it. Indeed this is the excellency of this covenant, and so it is here declared, that it doth effectually communicate all the grace and mercy contained in it unto all and every one with whom it is made; whomsoever it is made withal, his sins are pardoned.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/john-owen.html">John Owen</a></span><span class="wk"><span class="lbl">Work:</span> <cite>An Exposition of the Epistle to the Hebrews</cite>, 8:12; Works, vol. 22, p. 207</span></figcaption>

</figure><figure class="quote" id="q-feec0879c4" data-kw="">
<blockquote><p>If the things themselves are promised in the covenant, then all those with whom this covenant is made must be really and effectually made partakers of them. But this is not so; they are not all actually sanctified, pardoned, and saved, which are the things here promised.&#x27; Ans. The making of this covenant may be considered two ways: 1. As unto the preparation and proposition of its terms and conditions. 2. As unto the internal stipulation between God and the souls of men. In this sense alone God is properly said to make this covenant with any. The preparation and proposition of laws are not the making of the covenant. And therefore all with whom this covenant is made are effectually sanctified, justified, and saved.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/john-owen.html">John Owen</a></span><span class="wk"><span class="lbl">Work:</span> <cite>An Exposition of the Epistle to the Hebrews</cite>, 8:10; Works, vol. 22, p. 179</span></figcaption>

</figure><figure class="quote" id="q-05dd0db63e" data-kw="admin">
<blockquote><p>The nature of the things, for since they were still future and prophecies before their fulfillment are wont to be somewhat obscure (at least as to the manner of fulfillment), it is not to be wondered at that at first they were set forth more obscurely and then more clearly, the nearer the time of fulfillment approached. Thus the light increased more and more. There was a progress in revelation: prophet handed on to prophet, and he received the lamp of the gospel by which the church might be illuminated, adding a new measure of light. The same promises are repeated and illustrated. The more the time of fulfillment presses on, the clearer and fuller they become. Before the law given by Moses, the promise was somewhat obscure; from the giving of the law until the times of the prophets less obscure; from the times of the prophets until John the Baptist, clearer; after the preaching of John clear; after the coming of Christ most clear. Thus from the beginning, the Messiah was promised only as the seed of the woman (Gen. 3:15); afterwards as the son of Abraham (Gen. 12:2); to spring from Judah (Gen. 49:10); and in the tribe of Judah from the family of David (2 S. 7:13, 14).</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/francis-turretin.html">Francis Turretin</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Institutes of Elenctic Theology</cite>, 12.7.V</span></figcaption>

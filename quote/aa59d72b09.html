<blockquote><p>The following series of resolutions on the subject of National Education were submitted by Mr. Anderson, and unanimously adopted:-

1. That there is a loud call for the establishment in Scotland of a national system of education, based on Scriptural principles, thoroughly imbued with the spirit of the Gospel, and adequate to provide the whole land with sound literary and religious instruction.

2. That it is the duty of the Government and Legislature to establish such a system without delay.

3. That there are remarkable facilities for the accomplishment of this most desirable object, inasmuch as, notwithstanding of existing differences in regard to matters of religion, and even in regard to the duties of Government respecting education, there is an almost universal desire among all classes in Scotland that the Bible and the Shorter Catechism of the Westminster Assembly should be read in every school.

4. That in the Act of the Legislature establishing such a system, there ought to be a distinct recognition of the Word of God, and of the principles of true religion founded on that infallible record; and that provision should be made for teaching in every school the Holy Scriptures, and the doctrines and duties inculcated in the Divine Word, as these are summarily set forth in the Shorter Catechism; that the schools should be open to such well qualified teachers, and to those only, of whatever name or denomination, as give evidence of good moral and religious character, and of cordially believing the Word of God, and holding its precious truths, as these are exhibited in the Shorter Catechism, which it would be their duty to teach; and that local boards should be established everywhere through the land for the election of teachers, and for carrying out the system according to these principles.

5. That, in conviction of this Synod, such a system, if once established and carried into vigorous operation, would be cordially received and practically adopted by Christian men of every denomination, and could not fail, by the blessing of God, to confer incalculable benefits in the advancement throughout Scotland of knowledge, religion, and morality.

6. That the Rev. William Anderson, the Rev. Dr. Goold, and Mr. Matthew Tait, be appointed a committee to take charge of these resolutions – to convey them to the Government of the country, and to Scottish Members of Parliament, and to hold such correspondence with other parties as may appear desirable.</p></blockquote>

<blockquote><p>The late patrons of Anabaptism among us would make the world believe that this Sect had for its Author the famous Berengarius, and for its fomenters four hundred years ago, the old prede­cessors of Protestants, commonly called Albi­genses: but who will be pleased to consult the fountain of this allegation shall find Berengarius absolved from this crime by that very mouth whence alone the slander did proceed. Bishop Guitmund lays on the back of Deacon Beren­garius the load of so many contumelies as he is able to invent, only for his boldness to oppose the common Doctrine of that time, the corporal presence of Christs body in the bread of the Sacrament: among other things he challenges him for the deny­ing baptism to infants, but if any should require a proof this heavy charge, Guitmund professes that none can be given, avow­ing that Berengarius did never bring any such Doctrine in pub­lic, knowing that no Scripture could be alleged for it, and that no creature would take such an absurdity from his hand (A); Ju­stice therefore does require that Berengarius be freed of that crime, since his very adversary confesses that it was never made appear by any known profession; for crimes that appear not are reputed by just men as not existing (M. Tombes, Ex­amin. p. 20, 21). Concerning the Albigenses, the man that lays the slander of Anabaptism upon them is Petrus Cluniacensis, but how unjustly I offer to be considered not only from this general very true and confessed ground, that the Popish Writers of that time do charge these honest and pious men of Albi with many both errors and crimes, whereof all equitable men believe them to have been most innocent; but also from three particular observations: First, they are not challenged by Cluniacensis as direct and express deniers of paedobaptism, but for their affirming the impossibi­lity of infants believing, and of their impossible salvation with­out faith, he alleges upon them by way of consequence, that they did also maintain the Baptism of infants to be unprofitable and null (B). The learned know how much uses to be said against the burdening of men with all the consequents of their tenets, espe­cially when the party rejects them, and the things themselves have no necessary dependence. Secondly, the antecedent where­upon this consequent is builded, we much doubt if ever it came in the thoughts of the Albigenses. That these gracious and ortho­dox men should have been so absurd as to damn absolutely all infants dying in their infancy, which never any of the grossest heretics to this day did affirm; we must be pardoned to deny our belief to ten witnesses of much better faith then the Abbot of Cluny. Thirdly, that which Cassander avows in that same place helps to evidence the slander of Cluniacensis: the Waldenses were the children and immediate successors of the Albigenses, many of their writs yet extant shew how rigid and punctual observers the children were of their Fathers ways: now it is Cassander’s remark verified by the writs and known practice to this day of all the Waldenses that they have been constant paedo­baptists (C). He must therefore be a man of greater authority then any Friar or Monk of these dark times, who shall be able to persuade that their Fathers the Albigenses were against infants baptism. Wherefore notwithstanding of all which is misalleged from Cassander we may safely with all Protestant Writers affirm that the first known Fathers of Anabaptism were Nicholas Stock and Thomas Muntzer, who in the year 1522 began to sow the tares of that sect in Saxony with too great success. Neither Me­lancthon nor Ca­rolostadius did ever favor an­tipaedobaptism. What some allege of Melancthon and Carolostadius their favor towards these men, of Melancthon it is most false as many of his writs declare (D), unless it be understood of his good and extraordinary meek na­ture, whereby he was ever inclined to pity the worst of men so long as there was any hope by loving dealing to do them good. Carolostadius indeed was a rash hot headed man, and at the beginning did give too much countenance to the Anabaptists, albeit not in the point of Antipaedobaptism (E), so far as we can find; but wherein soever he favored these fanatic men, he did quick­ly repent and made his public retractions to the satisfaction of Luther’ss own mind (F). M. Tombs by all his diligence to search for ancient and renow­ned friends to his Clients the Anabaptists, does but raise dust to darken the air about himself: all who will be at the pains to consider these very testimonies which he alleges, shall find that no Divine of good fame did ever join with that sect: for the spirit that did reign therein was so evidently malignant, that a small measure of discretion did ever serve to discover and avoid him.</p></blockquote>

t+the+first+known+Fathers+of+Anabaptism+were+Nicholas+Stock+and+Thomas+Muntzer%2C+who+in+the+year+1522+began+to+sow+the+tares+of+that+sect+in+Saxony+with+too+great+success.+Neither+Me%C2%ADlancthon+nor+Ca%C2%ADrolostadius+did+ever+favor+an%C2%ADtipaedobaptism.+What+some+allege+of+Melancthon+and+Carolostadius+their+favor+towards+these+men%2C+of+Melancthon+it+is+most+false+as+many+of+his+writs+declare+%28D%29%2C+unless+it+be+understood+of+his+good+and+extraordinary+meek+na%C2%ADture%2C+whereby+he+was+ever+inclined+to+pity+the+worst+of+men+so+long+as+there+was+any+hope+by+loving+dealing+to+do+them+good.+Carolostadius+indeed+was+a+rash+hot+headed+man%2C+and+at+the+beginning+did+give+too+much+countenance+to+the+Anabaptists%2C+albeit+not+in+the+point+of+Antipaedobaptism+%28E%29%2C+so+far+as+we+can+find%3B+but+wherein+soever+he+favored+these+fanatic+men%2C+he+did+quick%C2%ADly+repent+and+made+his+public+retractions+to+the+satisfaction+of+Luther%E2%80%99ss+own+mind+%28F%29.+M.+Tombs+by+all+his+diligence+to+search+for+ancient+and+renow%C2%ADned+friends+to+his+Clients+the+Anabaptists%2C+does+but+raise+dust+to+darken+the+air+about+himself%3A+all+who+will+be+at+the+pains+to+consider+these+very+testimonies+which+he+alleges%2C+shall+find+that+no+Divine+of+good+fame+did+ever+join+with+that+sect%3A+for+the+spirit+that+did+reign+therein+was+so+evidently+malignant%2C+that+a+small+measure+of+discretion+did+ever+serve+to+discover+and+avoid+him.%E2%80%9D%0A%0A%E2%80%94+Robert+Baillie%2C+Anabaptism%2C+The+True+Fountain+of+Independency%2C+Brownisme%2C+Antinomy%2C+Familism%2C+and+the+most+of+the+other+Errors+Which+For+The+Time+Do+Trouble+the+Church+of+England%2C+Unsealed%2C+%28London%2C+1647%29%2C+2%E2%80%933.+NB%3A+For+ease+of+reading+and+because+archaic+spelling+tend+to+make+older+writers+seem+unintelligent+archaic&amp;url=https%3A%2F%2F5solasquotes.github.io%2Fquote%2F3ff4b5e5eb.html&amp;via=5Solas" target="_blank" rel="noopener">Share on X</a><a class="perma" href="../quote/3ff4b5e5eb. <blockquote><p>4th Distinction. A calling may be expressly and formally corrupt in respect of the particular intention of the ordainers and of the particular Church, ex intentione ordinaris et operantis [out of the intention of the ordainers and of the one working]. Thus Luther’s calling to be a monk was a corrupt calling, and eatenus, and ‘in that respect’ he could not give a calling to others. But that some calling may be implicitly and virtually good and lawful in respect of the intention of the Catholic Church and ex intentione operis &amp; ipsius ordinationis [out of the intention of the work and the ordination itself], he was called to preach the Word of God. …

7. A calling to the ministry is either such: [1.] as wants the essentials, as gifts in any messenger and the Church’s consent, or these who occupy the room of the Church, the Church consenting: such a minister is to be reputed for no minister; or 2. an entry to a calling, or a calling where diverse of the apostles’ requisites are wanting, may be a valid calling, as if one enter as Caiphas, who entered by favor and money and contrary to the Law, was High-Priest but for a year: yet was a true High-Priest and prophesied as the High-priest [Jn. 11:49-51].

8. If the Church approve by silence, or countenance the ministry of a man who opened the Church door to himself by a silver key, having given the prelate a bud. The ordinance of God is conferred upon him, and his calling ceases not to be God’s calling because of the sins of the instruments both taking and giving. … 11. The question, if such a pastor be called lawfully, is a question of fact, not a question of law; [it is] as this [case]: if such an one be baptized and there be an invincible ignorance in a question of fact which excuses. And therefore we may hear a gifted pastor taken and supposed by the Church to have the Church’s calling, though indeed he received no calling from the Church at his entry. … 3. We are nowhere forbidden in God’s Word to hear teachers sent and called, but only wolves in sheep skins, void of all calling, and intruders: for pastors may be antichristian in the manner of the entry, as Caiaphas… 3. Yea, and brook an antichristian calling, as prelates do and have done in Britain, and yet their ministry be valid. For that the calling of a minister be valid and his ministerial acts not null, it is sufficient that the governing Church give him a calling, either by themselves, their express call, their silence, or tacit consent, or their approbation communicating with him in his ministry, or by these to whom the Church resigned her power, or by these who stand in place of the Church, though prelates invade the place of the Church: yet: [1.] because first they themselves be pastors and have power to teach and baptize as pastors called of Christ. Mt. 18:19. 2. Because they stand for the Church, the Church approving or someway by silence consenting (as in the case of Caiaphas’s entry to the priesthood) thereunto. These who are baptized of them are not rebaptized, and these who are ordained pastors by them are not reordained, but have a calling to the ministry and do validly confer a calling upon others. Yea, many of great learning think that at the beginning of Reformation thousands being under popery baptized by midwives and private persons, were never rebaptized, not that they think such baptism valid, but where the sacrament is wanting, ex invincibili ignorantia facti, ‘out of an invincible ignorance of a fact’, such that way [the] baptized do indeed want the Lord’s seal; but we cannot for that say that they are no better than infidels and unbaptized Turks and Jews, because:

1. Their being born in the visible Church gives a federal holiness, as all of Jewish parents had a federal right to circumcision and were, eatenus, ‘insofar’, separated from the womb.

2. Because their profession of that Covenant whereof baptism is a seal, separates them sufficiently from infidels, though they want the seal external. But our divines esteem, and that justly, baptism administrated by women or such as have no calling, to be no baptism at all; for which let the reader see Calvin, Institutes, bk. 4, ch. 15, sect. 20; Epistle 326; Beza, Libel., Questione de Baptism; the learned Rivet, in Cathol. Orthod., tome 2, tract 2, q. 7. We stand not for what Bellarmine, Maldonatus, Gretserus and other papists say on the contrary.</p></blockquote>

— Samuel Rutherford, The Due Right of Presbyteries, ‘Acts 15, A Pattern of a Juridicial Synod’, … (London, 1644), pt. 1, pp. 204-8, 229, 235 irregular numbering">Copy</button><a class="share" href="https://x.com/intent/post?text=%E2%80%9C4th+Distinction.+A+calling+may+be+expressly+and+formally+corrupt+in+respect+of+the+particular+intention+of+the+ordainers+and+of+the+particular+Church%2C+ex+intentione+ordinaris+et+operantis+%5Bout+of+the+intention+of+the+ordainers+and+of+the+one+working%5D.+Thus+Luther%E2%80%99s+calling+to+be+a+monk+was+a+corrupt+calling%2C+and+eatenus%2C+and+%E2%80%98in+that+respect%E2%80%99+he+could+not+give+a+calling+to+others.+But+that+some+calling+may+be+implicitly+and+virtually+good+and+lawful+in+respect+of+the+intention+of+the+Catholic+Church+and+ex+intentione+operis+%26+ipsius+ordinationis+%5Bout+of+the+intention+of+the+work+and+the+ordination+itself%5D%2C+he+was+called+to+preach+the+Word+of+God.+%E2%80%A6+7.+A+calling+to+the+ministry+is+either+such%3A+%5B1.%5D+as+wants+the+essentials%2C+as+gifts+in+any+messenger+and+the+Church%E2%80%99s+consent%2C+or+these+who+occupy+the+room+of+the+Church%2C+the+Church+consenting%3A+such+a+minister+is+to+be+reputed+for+no+minister%3B+or+2.+an+entry+to+a+calling%2C+or+a+calling+where+diverse+of+the+apostles%E2%80%99+requisites+are+wanting%2C+may+be+a+valid+calling%2C+as+if+one+enter+as+Caiphas%2C+who+entered+by+favor+and+money+and+contrary+to+the+Law%2C+was+High-Priest+but+for+a+year%3A+yet+was+a+true+High-Priest+and+prophesied+as+the+High-priest+%5BJn.+11%3A49-51%5D.+8.+If+the+Church+approve+by+silence%2C+or+countenance+the+ministry+of+a+man+who+opened+the+Church+door+to+himself+by+a+silver+key%2C+having+given+the+prelate+a+bud.+The+ordinance+of+God+is+conferred+upon+him%2C+and+his+calling+ceases+not+to+be+God%E2%80%99s+calling+because+of+the+sins+of+the+instruments+both+taking+and+giving.+%E2%80%A6+11.+The+question%2C+if+such+a+pastor+be+called+lawfully%2C+is+a+question+of+fact%2C+not+a+question+of+law%3B t+way+%5Bthe%5D+baptized+do+indeed+want+the+Lord%E2%80%99s+seal%3B+but+we+cannot+for+that+say+that+they+are+no+better+than+infidels+and+unbaptized+Turks+and+Jews%2C+because%3A+1.+Their+being+born+in+the+visible+Church+gives+a+federal+holiness%2C+as+all+of+Jewish+parents+had+a+federal+right+to+circumcision+and+were%2C+eatenus%2C+%E2%80%98insofar%E2%80%99%2C+separated+from+the+womb.+2.+Because+their+profession+of+that+Covenant+whereof+baptism+is+a+seal%2C+separates+them+sufficiently+from+infidels%2C+though+they+want+the+seal+external.+But+our+divines+esteem%2C+and+that+justly%2C+baptism+administrated+by+women+or+such+as+have+no+calling%2C+to+be+no+baptism+at+all%3B+for+which+let+the+reader+see+Calvin%2C+Institutes%2C+bk.+4%2C+ch.+15%2C+sect.+20%3B+Epistle+326%3B+Beza%2C+Libel.%2C+Questione+de+Baptism%3B+the+learned+Rivet%2C+in+Cathol.+Orthod.%2C+tome+2%2C+tract+2%2C+q.+7.+We+stand+not+for+what+Bellarmine%2C+Maldonatus%2C+Gretserus+and+other+papists+say+on+the+contrary.%E2%80%9D%0A%0A%E2%80%94+Samuel+Rutherford%2C+The+Due+Right+of+Presbyteries%2C+%E2%80%98Acts+15%2C+A+Pattern+of+a+Juridicial+Synod%E2%80%99%2C+%E2%80%A6+%28London%2C+1644%29%2C+pt.+1%2C+pp.+204-8%2C+229%2C+235+irregular+numbering&amp;url=https%3A%2F%2F5solasquotes.github.io%2Fquote%2Fce6f22c7a1.html&amp;via=5Solas" target="_blank" rel="noopener">Share on X</a><a class="perma" href="../quote/ce6f22c7a1.html">Permalink</a><a class="src" href="https://reformedbooksonline.com/topics/topics-by-subject/church-government/prelacy#:~:text=4th%20Distinction.%20A%20calling%20may%20be,other%20papists%20say%20on%20the%20contrary&amp;text=4th%20Distinction.%20A%20calling%20may%20be%20expressly%20and&amp;text=Gretserus%20and%20other%20papists%20say%20on%20the%20contrary" rel="noopener" target="_blank">Read it online · Reformed Books Online</a></div>

<blockquote><p>XX. Although the authority of these constitutions is great in the church, we deny that it is absolute, but limited; or that it is equal with the divine laws; or that it is as great a sin to transgress the former as the latter. We deny that they can change the nature of things, so that what are in themselves indifferent can be made necessary and of perpetual right; or that any part of Christian righteousness is in them, much less any merit with God; or that they can extend themselves beyond ecclesiastical polity or good order (eutaxian), which by themselves are not of piety, but only on account of another thing and by accident. Again, we say that they are not to be measured by themselves, but by divine laws, that they may not in anyway obstruct, but may rather subserve the latter.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/francis-turretin.html">Francis Turretin</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Institutes of Elenctic Theology</cite>, pp. 290-1 of Question 31, ‘Does a legislative power properly so called, of enacting laws binding the conscience, belong to the church? Or only an ordaining (diataktike) power, of sanctioning constitutions and canons for the sake of good order (eutaxian)? The former we deny; the latter we affirm against the Romanists.’ under ‘Ecclesiastical Power’ in the 18th topic, ‘The Church’ in Institutes, vol. 3</span></figcaption>

<blockquote><p>By Baptism… we are received solemnly into the visible Church; and Baptism is a seal of our entry into Christ’s visible Body, as swearing to the colors enters a soldier a member to the army; and, we teach not that Baptism constitutes the Church-visible simply, as the Church: its a seal of a visible profession.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/samuel-rutherford.html">Samuel Rutherford</a></span><span class="wk"><span class="lbl">Work:</span> <cite>A Survey of the Survey of that Sum of Church-Discipline Penned by Mr. Thomas Hooker</cite>, Book 1, ch. 21, ‘Whether Baptism gives formality, or makes a Member of a visible Church?’ in A Survey of the Survey of that Sum of Church-Discipline Penned by Mr. Thomas Hooker (1658), pp. 115-122 | Hooker, a congregationalist, had misunderstood Rutherford, thinking that Rutherford had said that baptism was the formal principle that made someone a member of the visible Church. However, what Rutherford actually said, and what he defends here, distinguishing, is only that:</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/baptism/subjects-of-baptism.html">Subjects of Baptism</a></span></div>

</figure><figure class="quote" id="q-58fc9571c7" data-kw="">
<blockquote><p>The matter is often spoken of as if the Church of England must of necessity have laid down, and had in fact laid down, a certain definite precise view upon this subject, and peremptorily enjoined it upon all her ministers for their acceptance and belief. In my humble apprehension such a notion is entirely opposed to fact… …all which our Church has done upon this question is, to lay down certain limits on both sides, within which the views of her ministers are to be confined.</p></blockquote>

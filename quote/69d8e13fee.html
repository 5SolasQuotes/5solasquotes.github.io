<main class="wrap"><figure class="quote" id="q-69d8e13fee" data-kw="">
<blockquote><p>But if it be inquired what it is whereby we immediately concur in a way of duty unto the continuation of our justified estate, — that is, the pardon of our sins and acceptance with God, — we say it is faith alone; for “The just shall live by faith,” Rom. i. 17.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/john-owen.html">John Owen</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Doctrine of Justification by Faith</cite>, ch. 5</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/justification/justification-and-perseverance.html">Justification and Perseverance</a></span><span class="t"><a href="../topics/justification/faith-alone.html">Instrumental Cause: Faith Alone</a> › <a href="../topics/justification/faith-alone/sola-fide.html">Sola fide</a></span></div>

</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-eae9c4d386" data-kw="">
<blockquote><p>Nor have the best of our duties any other respect unto the continuation of our justification, but only as in them we are preserved from those things which are contrary unto it, and destructive of it. But the sole question is, upon what the continuation of our justification does depend, not concerning what duties are required of us in the way of our obedience.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/john-owen.html">John Owen</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Doctrine of Justification by Faith</cite>, ch. 5</span></figcaption>

</figure><figure class="quote" id="q-7143ae7aa4" data-kw="">
<blockquote><p>A very few words will also free our inquiry from any concernment in that which is called sentential justification, at the day of judgement; for of what nature soever it be, the person concerning whom that sentence is pronounced was, — (1.) Actually and completely justified before God in this world; (2.) Made partaker of all the benefits of that justification, even unto a blessed resurrection in glory: “It is raised in glory,” 1 Cor. xv. 43. (3.) The souls of the most will long before have enjoyed a blessed rest with God, absolutely discharged and acquitted from all their labours and all their sins; there remains nothing but an actual admission of the whole person into eternal glory. Wherefore this judgement can be no more but declaratory, unto the glory of God, and the everlasting refreshment of them that have believed.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/john-owen.html">John Owen</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Doctrine of Justification by Faith</cite>, ch. 6</span></figcaption>

</figure><figure class="quote" id="q-78f2548b78" data-kw="">
<blockquote><p>Wherefore I say then, that on supposition that a man lives in this world, perseverance unto the end is a necessary condition of his justification. And if so, no man can be justified whilst he is in this world; for a condition does suspend that whereof it is a condition from existence until it be accomplished. It is, then, to no purpose to dispute any longer about justification, if indeed no man is, nor can be, justified in this life. But how contrary this is to Scripture and experience is known.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/john-owen.html">John Owen</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Doctrine of Justification by Faith</cite>, ch. 2</span></figcaption>

</figure><figure class="quote" id="q-a52597727f" data-kw="">
<blockquote><p>For my part I cannot understand that the continuation of our justification has any other dependencies than has our justification itself. As faith alone is required unto the one, so faith alone is required unto the other, although its operations and effects in the discharge of its duty and office in justification, and the continuation of it, are diverse; nor can it otherwise be.</p></blockquote>

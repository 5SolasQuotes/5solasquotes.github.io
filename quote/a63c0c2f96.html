<blockquote><p>Q. 154. What are the outward means whereby Christ communicates to us the benefits of his mediation? A. The outward and ordinary means whereby Christ communicates to his church the benefits of his mediation, are all his ordinances; especially the word, sacraments, and prayer; all which are made effectual to the elect for their salvation.[l] [l] Matt. 28:19,20. Acts 2:42,46,47. Q. 155. How is the word made effectual to salvation? A. The Spirit of God maketh the reading, but especially the preaching of the word, an effectual means of enlightening,[m] convincing, and humbling sinners;[n] of driving them out of themselves, and drawing them unto Christ;[o] of conforming them to his image,[p] and subduing them to his will;[q] of strengthening them against temptations and corruptions;[r] of building them up in grace,[s] and establishing their hearts in holiness and comfort through faith unto salvation.[t] [m] Neh. 8:8. Acts 26:18. Ps. 19:8. [n] 1 Cor. 14:24,25. 2 Chron. 34:18,19,26-28. [o] Acts 2:37,41. Acts 8:27-39. [p] 2 Cor. 3:18. [q] 2 Cor. 10:4-6. Rom. 6:17. [r] Matt. 4:4,7,10. Eph. 6:16,17. Ps. 19:11. 1 Cor. 10:11. [s] Acts 20:32. 2 Tim. 3:15-17. [t] Rom. 16:25. 1 Thess. 3:2,10,11,13. Rom. 15:4. Rom. 10:13-17. Rom. 1:16.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/westminster-assembly.html">Westminster Assembly</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Larger Catechism</cite></span></figcaption>
<div class="meta"><span class="t"><a href="../topics/worship/impurities-in-worship.html">Impurities in Worship</a></span></div>

<blockquote><p>…and their fear toward me is taught by the precept of men: therefore, behold, I will proceed to do a marvellous work among the people, even a marvellous work and a wonder; for the wisdom of their wise men shall perish, and the understanding of their prudent men shall be hid” (Isa. 29:13-14). And in another place, “But in vain do they worship Me, teaching for doctrines the commandments of men” (Mt. 15:9)… pious princes are repeatedly praised (2 Kings 22:1, etc.) for acting according to all his precepts, and not declining either to the right hand or the left. I go further: although there be no open manifestation of impiety in fictitious worship, it is strictly condemned by the Spirit, inasmuch as it is a departure from the command of God… And the more clearly the will of God has been manifested to us, the less excusable is our petulance in attempting anything.</p></blockquote>

<blockquote><p>37th Question, Why Nadab &amp; Abihu were Judged Only, and Not Eleazar and Ithamar, who also were in Error. …

2. Therefore the reason may be that these two had aliquam excusationem, ‘some excuse’ of their sin, because they were in grief, but their brethren which were slain had no such excuse.

3. And beside the Lord would not extinguere pontificiam dignitatem, at once ‘extinguish the pontifical dignity’ granted to Aaron and his posterity.

4. But chiefly the cause was the mercy of God, which He always tempers with his judgments: He was contented with this example of severity, as the Lord said to the angel that smote Israel after David had numbered the people: ‘It is sufficient, hold now thine hand.’

5. Yet this is the best resolution, after we have scanned what we can, that the true cause was the good pleasure of God, whereof no reason is to be yielded, sure we are,Quamvis occulta sint Dei iduicia, non ideo iniqua esse, ‘although God’s judgments be secret, yet they are not unjust.&#x27;</p></blockquote>

<blockquote><p>XL. We are not for preaching when we are forbidden, where there is not a real and evident need of our labors.</p></blockquote>

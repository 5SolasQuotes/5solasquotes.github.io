<main class="wrap"><figure class="quote" id="q-21d7debf01" data-kw="">
<blockquote><p>Besides, arguments drawn from scandal in things neither unlawful nor (setting the reason of scandal aside) inexpedient, as they are subject to sundry frailties otherwise, so they are manifestly of no weight at all when they are counterpoised with the apparent danger of evil consequents on the other side. For in such cases there is commonly equal danger (if not rather something more) of scandal to be taken from the example the quite contrary way.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/robert-sanderson.html">Robert Sanderson</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Bishop Sanderson’s Judgment concerning Submission to Usurpers</cite>, (d. 1663; London, 1678), pp. 26-27</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/the-christian-life/ethics-and-virtue.html">Ethics and Virtue</a></span></div>
<div class="actions"><button class="copy" data-copy="“Besides, arguments drawn from scandal in things neither unlawful nor (setting the reason of scandal aside) inexpedient, as they are subject to sundry frailties otherwise, so they are manifestly of no weight at all when they are counterpoised with the apparent danger of evil consequents on the other side. For in such cases there is commonly equal danger (if not rather something more) of scandal to be taken from the example the quite contrary way.”

</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-97113abe63" data-kw="">
<blockquote><p>But if a governor so mis-determine but a mode or circumstance as will overthrow the substance and ends of the worship, I would not obey, except some greater evil were likely to follow my not obeying at that particular season than the frustrating of the duty itself would come to… An unhandsome vesture I would use in obedience to a lawful governor and to avoid a greater evil: but not so ridiculous a vesture as would set all the people on laughing so as to frustrate the work that we assemble for.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/richard-baxter.html">Richard Baxter</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Five Disputations of Church-Government &amp; Worship</cite>, (London, 1659), 5th Disputation, ch. 12,; p. 463</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/the-christian-life/ethics-and-virtue.html">Ethics and Virtue</a></span></div>

</figure><figure class="quote" id="q-d516705aa9" data-kw="">
<blockquote><p>But the translation we read from is the best we have, or in cases where it is not, we are helpless to publicly change it when our authorities so impose it according to their office and (erroneous) discretion. If these acts are sinful, we would have to not read God’s Word at all and forfeit his worship ordinance of public Scripture reading, despite his command to maintain such (1 Tim. 4:13). Yet it is better to worship approximately, though defectively, yet in real participation (though only by a certain degree) with God’s ordinance, than not at all, and it is necessary for the higher good of our well-being and salvation to do these inconvenient, impure and scandalous actions and ceremonies under necessity as a requisite for the good that cannot be brought about without them.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/travis-fentiman.html">Travis Fentiman</a></span><span class="wk"><span class="lbl">Work:</span> <cite>“Editor’s Extended Introduction” in English Puritans, A Refutation of the Errors of Separatists</cite>, (1604; RBO, 2025) | …An easy way to see the truth of it is to consider the following example (which [George] Gillespie practiced): To read a Bible translation as the Word of God from the pulpit which has wrong readings, bad translations and mistranslations in it (and hence to call those things God’s Word and for people to believe they are God’s Word when they are not) is inconvenient, impure and scandalous. Yet the KJV, NKJV, ESV, NASB, NRSV, ASV and the Bible version your church uses, and you use personally, all have wrong readings, bad translations and mistranslations in them. One might respond:, pp. 48-49</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/the-christian-life/ethics-and-virtue.html">Ethics and Virtue</a></span></div>

</figure><figure class="quote" id="q-4223bd30c4" data-kw="">
<blockquote><p>And thus I have showed you what materials our brethren will afford us to this building [of Church government], which I could for my own part rather be content to sit down withal, than by raising it higher, but heighten our confusion, run the mischief of division among ourselves, than which no penal evil can be sadder and more uncomfortable. I wish we might all remember the apostle’s rule, Phil. 3:15-16…</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/samuel-bolton.html">Samuel Bolton</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Arraignment of Error</cite>, … (London: Miller, 1646), p. 311</span></figcaption>

</figure><figure class="quote" id="q-bbd710f39d" data-kw="">
<blockquote><p>…yea there can be no sin eligible [chosen] by such and such a case [of necessary circumstance], as Lot sinned in exposing his daughters to the lust of men, to redeem abstinence from sodomy. Hence it is clear: we may not do a less, nor counsel another to commit a less sin, to eschew a greater, as the Jesuits wickedly teach. So Tannerus, so Turrianus and others who make a scandalum permissum, a scandal that a Christian may hinder another to fall in, and yet he permits him to fall in it. But God has a prerogative to permit sinful scandals, men have no such power, when they are obliged to hinder it. The divinity of others seems better to me, who deny that the least venial [sin] should be committed to eschew a greater sin.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/samuel-rutherford.html">Samuel Rutherford</a></span><span class="wk"><span class="lbl">Work:</span> <cite>A Dispute Touching Scandal &amp; Christian Liberty</cite>, p. 83 in The Divine Right of Church Government (1646)</span></figcaption>

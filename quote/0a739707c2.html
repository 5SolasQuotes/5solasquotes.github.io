<blockquote><p>This monkish and hermetic life is first of all contrary to the nature of man when the same was uncorrupt, for whom it was not judged good to be alone, but contrariwise thought convenient that he should have one of the same nature to keep him company, not only in marriage for creations’ sake, but for other helpful and comfortable society. Now therefore that he is fallen from that sufficiency whereby he was passingly more able to live by himself than now he is, it is evident to uphold himself in any commendable estate agreeing with his creation, it is needful that he lean upon the company of his like. Wherefore Solomon says: ‘Two are better than one, for that they have a good reward of their labor: For if the one fall the other may raise up his fellow: but woe to him that is alone, for if he fall, there is no second to lift him up. Likewise if two sleep together, they get warmth, but how should one alone come to any thread that is not soon broken.’ (Eccl. 4:9, etc.) The philosophers, which saw as far as the natural eye was able to pierce, esteemed a man naturally companionable, and him that naturally without constraint of banishment and such like severed himself from the society of men, they deemed either to be a god or else esteemed to be a wild beast; they would have said a devil if they had as much knowledge of him as of God. Secondly, as this solitary life is an enemy to mankind, so is it to the communion of saints in the Church of God: for if they have any singular gifts that take their flight into the wilderness, the sentence of our savior Christ pulls their wings: That no man lights a candle to put it under a bushel, but rather sets it in the candlestick of some society, where it may give light to all that are round about (Mt. 5:15): whether also is referred that such personages are called the salt of others, which has need to approach and be applied to that flesh which it must season and deliver from putrefaction. And if he be void of such gifts, or have not in any great measure, then also is it meet that he should join himself to their company, by whom he may have supply of his wants, that by daily conversation with the wise he may learn wisdom? And if neither any man should have need of him, nor he need of any, yet the desire of being in the congregation of God’s people, to see the beauty of the house of God, in the participation of the Word and sacraments would call him, would so inflame him as to cause him to speed himself as fast from the forsaken wilderness to the place of the assembly of God’s people, as the hart pursued of the dogs, makes footmanship to the soil. (Prov. 13:20, Ps. 42 &amp; 43). For David, being many years a hermit according to your description, that is, one that lived in erema, or wilderness, did notwithstanding the Lord’s calling into that place, feel the horror of the wilderness, through desire he had to go with the rest of the people unto the house of God (Ps. 84). If therefore it be a pleasant paradise unto you which was unto him a horrible and desolate waste: if you voluntarily fly from that which he did so thirstily pursue, and if you greedily seek thither from whence he so desirously departed, it is easy for all men to see that your hermits and monks are of another spirit than David was. But the example of the primitive church conducted by the hands of the apostles is very pregnant against these wild asses whose habitations are in the wilderness: for Luke bears witness that as many as believed were together in one place (Acts 2:44), and that they communicated not only in spiritual things, but nourished love by society in their bodily repasts [meals]. Whereupon it may be easily perceived that as amongst birds they are the uncleanest and most hateful that covet the desolate places, so amongst men they are most to be detested that forsake the mutual society of their brethren. Against this, and for foundation of hermits and monks, is alleged: First, that John was in the wilderness. Whereunto our men answering that it was no such wilderness but that there were towns in it, are charged with shameless perverting of the place. Howbeit take that away which you have falsely surmised of us, that we expound a wilderness which is full of towns, and the shame of your ignorance will return upon yourselves. For if you had not been inured or unready in the Word, you should have known out of the prophet, who wills the wilderness with their cities to lift up their voice. Those places which in comparison of others [are] more peopled are called wildernesses, are not so naked of their inhabitants, but that they may have diverse towns and villages planted in them. Hereupon the self-same quarter of the wilderness of Jordan where John was, there was the town of Bethabara builded upon the bank of the river. Here therefore it is manifest that the entrance into his ministry was not in such a wilderness as the Jesuits imagine, but in a plain inhabited of men. The reason whereof is that, as the first captivity and stroke of God’s judgment began about those parts of Jordan, so to them also first should be offered the saving health, which was able to comfort them over all their desolations. There are two other places, and but two (as far as I remember) famous by John’s ministry, and those are: 1. The waters of Salem. 2. The waters of Enon, which are so called of the two towns Salem and Enon, set upon the brink of those waters. So that John’s whole ministry, so far as may appear, was executed in habitable places, where the cause assigned by the Holy Ghost why John haunted those places is to be observed, namely: for the abundance of waters that were there fit for his ministry in the holy sacrament of baptism, whereby it is evident that John came not to those places for that they were not so much peopled as others, but rather for seeking the commodity of water. Now therefore, if it be enough to make a hermit or a monk to remain in such a wilderness as John did, I can direct you to fitter fathers and founders of your kind of hermits. You have therefore Nabal the churl which dwelt in the wilderness of Maon; you have also the Ziphims, which dwelt in the wilderness of Zyph, that would have betrayed David into the hands of Saul: these are more like birds of your feather. Or if these you like not, you have the heathen men which are called Iaponici, who live after the same sort that your monks do, and in like laws. Now for the closing up of John’s ministry, it appears to have been in the court of Herod, whether a man would think that it should be hard for you to prove that he repaired to the end that he might live in a wilderness. And if it were granted you which you would have, yet considering that whatsoever was done here was to fulfill the prophecy of Isaiah, and by calling of the Lord, it can give no warrant unto you which undertake this of your own head, without commandment or instruction out of the Word. The same reason is there of his authority in diet and apparel, which is frankly confessed on our part to have been after a base and homely sort: howbeit such it was notwithstanding as the country (for abundance of camels and plenty of locusts and wild honey which was there) did afford. For this special diet and apparel, whereby Saint John, declining from a more liberal entertainment, which has priestly estate did yield him, conformed himself to the baser and poorer sort of people, was not a fancy of his own, but that wherein he had the light of the Word to go before him: 1. First, that he might more lively represent the ministry of Elijah, whereunto he was diversely like, especially in the restoring of the true worship of God. 2. Secondly, by commandment which being expressed in his drink, was wisely both of John, and of his parents, by proportion and convenience, translated unto his meat and clothing: considering that it would have been as an old piece in a new garment, if his drink being by God’s prescription thin and common, his meat and apparel should have been exquisite and picked. Further, seeing that John’s ministry has no succession, neither in respect of his calling which was immediately from God, nor of his office, which was to prepare the way for the former coming of our savior Christ, it is manifest that the office being at an end, the things that were annexed unto it cannot continue. After this, Chrysostom is brought for the confirmation of these orders, wherein occasion is given to note how their orders of hermits and monks crept first into the church. In time of persecution, good men were glad to make the wilderness, as it were, the cities of their refuge from the face of tyrants that pursued them. This the apostle to the Hebrews does plainly set forth, where diverse amongst sufferings for the truth, he adds that some wandered in the wilderness, in mountains, and hid themselves in dens and holes of the earth, clad in badgers’ and goats’ skins (Heb. 11:38), in which number it is apparent that Elijah, upon whom you would also father this profession, is contained. He adds that therefore they were in the wilderness, because the world (that dwelt in cities and villages) were not worthy of them. If therefore you now forsake the people by example of these hermits, it is evident that you condemn your popish towns and cities as profane and utterly unworthy of your company. And that which the epistle to the Hebrews witnesses of diverse times of the Law, the same do the ecclesiastical writers of diverse alike times under the Gospel, as appears by the example of Paulus of Thebes, supposed most commonly to be the prince of the monks and hermits, which took the wilderness only as a remedy in persecution raised against him. Further, the apostle in the said epistle, and St. John witnesses of the whole estate of the church, that it should be in this respect a hermit, wherefore the cause of this hermetic life, being through peace of the church taken away, the kind of life ought to have gone withal. But as the churches, by an unadvised imitation drew the interrogatories ministered in the primitive church, to those which were of years to profess their faith in baptism, unto young children: even so with like unadvisedness, the state of the hermits, which properly agreed unto the persecuting times, was translated unto the peaceable times of the church. It was no marvel therefore, although Chrysostom and others did fall sometimes into the commendation of the monkish and hermetic life. But their hermits and monks are so unlike the pope’s creatures, that it is a marvel that they would fetch meat at the father’s hands to nourish this cattle with, of whom they could not well be ignorant but that they should receive more stripes than their meat is worth. 1. For first, they were not within any degree of church ministry, whereby they were, by so much the freer to live unto themselves. 2. Secondly, they were not as caged as yours as, but it was left free unto them, whether they would repair to the company of other monks or not. 3. Thirdly, they were bound to wash the guests’ feet. 4. Fourthly, there was permitted unto them care of wives, of family, and private possession, so that the same were moderate and not against the care of the soul: contrary to your laws, which thrust upon them the vow of wilful poverty. 5. Fifthly, their diet throughout was very sparing, whereas your monks feed so fat, that their fatness and great bellies are grown into a proverb. 6. Sixthly, the ancient monks got their living with the labor of their hands, whereof also they were bound to give an account unto their father; yours are idle bellies, which live off the labors of others only. 7. Seventhly, they were not too notorious by singular weed, or kind of apparel, least men passing by should stand gazing upon them, or point them out with the finger? Yours are. Hither also is to be referred that they had no rasure [shaving] command, only it was provided that they should have their hair long, as women have, where yours are crown shaven. Likewise, in the virgins at that time, it was sharply reproved if they did cut off their hair, whereas you commend it highly, as a virtue in your nuns that they clip their hair. 8. Eighthly, many of the monks in the elder times remaining monks, retained their wives, which to you is an abomination, who thrust upon them the vow of continual continency. Last of all, these were obedient unto their bishop or pastor, as well as other of the body of the church: yours are exempted from his obedience. So that in vowing obedience of your own invention, you disavow the obedience which the Lord has commanded unto you. Now touching your testimonies, Chrysostom has not that John [the Baptist] was Prince of the Hermits, as you would untruly insinuate: but of the monks, without mention of the hermits. Which also, if they have no manner of ground out of the Evangelist, have we not cause to be offended with Chrysostom? And we would think the Jesuits themselves should not be altogether pleased with him; saying that they like well that the truth be always spoken against, so that it be by a friend of the truth, under whom they may cover their deadly hate against it. Otherwise how will they digest that he says, The soul of the monks is without grief or passion and their bodies be as Adam’s before the fall. Jerome, speaking of anchorites and monks, reckons up the opinions of others, how some esteem Elijah the author of them: other some John Baptist; which opinions Jerome does apparently nip in the head, affirming Elijah more than a monk, and John a prophet from his birth: and therefore none that made choice of any special vocation. But that the most part, one Paulus of Thebes, the prince of that sect: where it is to be observed that this monkish and hermetic birth is so obscure that the father of it is unknown. Secondly, the nearest guess that can be had of the parentage of it, leaves it altogether in the filth of man’s invention. Last of all, that all our monks and hermits and bastard and degenerate children from their father Paulus of Thebes, the likelist prince of their profession, whom Jerome affirms to have taken the wilderness, not of his voluntary will, but persecuted even of his nearest friends. Touching Isidorus, if all speak truth that are learned: he (for his time wherein he lived) should be worthy of credit. He flourished about Pope Gregory’s days the great, when this kind of cattle was not dainty. And therefore if the stream of common error carried him to the liking and praising of such a seat, there is no learning nor wisdom in the world (without a special grace from God) which was able to resist such a forcible drift. Howbeit Isidorus was not so wedded to the monks as the Jesuits, who of six kinds of monks rejects three as very bad: where there is not with the Jesuits no order of monks which are not sacred; who, wheresoever they do but find the name of a monk, by and by they think that it is ground good enough to plant monkery upon. In Bernard, your purveyor has deceived you, for we find no such treatise as you give the title of. In a sermon of John’s nativity, he greatly commends him: but with no mark either of monk or hermit. Neither has he any other thing that makes for your purpose.</p></blockquote>

— Thomas Cartwright, Confutation of the Rhemists’ Notes, Glosses &amp; Annotations on the New Testament… (d. 1603; [Leiden] 1618), on Mt. 3:1, pp. 9-11">Copy</button><a class="share" href="https://x.com/intent/post?text=%E2%80%9CThis+monkish+and+hermetic+life+is+first+of+all+contrary+to+the+nature+of+man+when+the+same+was+uncorrupt%2C+for+whom+it+was+not+judged+good+to+be+alone%2C+but+contrariwise+thought+convenient+that+he+should+have+one+of+the+same+nature+to+keep+him+company%2C+not+only+in+marriage+for+creations%E2%80%99+sake%2C+but+for+other+helpful+and+comfortable+society.+Now+therefore+that+he+is+fallen+from+that+sufficiency+whereby+he+was+passingly+more+able+to+live+by+himself+than+now+he+is%2C+it+is+evident+to+uphold+himself+in+any+commendable+estate+agreeing+with+his+creation%2C+it+is+needful+that+he+lean+upon+the+company+of+his+like.+Wherefore+Solomon+says%3A+%E2%80%98Two+are+better+than+one%2C+for+that+they+have+a+good+reward+of+their+labor%3A+For+if+the+one+fall+the+other+may+raise+up+his+fellow%3A+but+woe+to+him+that+is+alone%2C+for+if+he+fall%2C+there+is+no+second+to+lift+him+up.+Likewise+if+two+sleep+together%2C+they+get+warmth%2C+but+how+should+one+alone+come+to+any+thread+that+is+not+soon+broken.%E2%80%99+%28Eccl.+4%3A9%2C+etc.%29+The+philosophers%2C+which+saw+as+far+as+the+natural+eye+was+able+to+pierce%2C+esteemed+a+man+naturally+companionable%2C+and+him+that+naturally+without+constraint+of+banishment+and+such+like+severed+himself+from+the+society+of+men%2C+they+deemed+either+to+be+a+god+or+else+esteemed+to+be+a+wild+beast%3B+they+would+have+said+a+devil+if+they+had+as+much+knowledge+of+him+as+of+God.+Secondly%2C+as+this+solitary+life+is+an+enemy+to+mankind%2C+so+is+it+to+the+communion+of+saints+in+the+Church+of+God%3A+for+if+they+have+any+singular+gifts+that+take+their+flight+into+the+wilderness%2C+the+sentence+of+our+savior+Christ+pulls+their+wings%3A+That+no+man+lights+a+candle+to+put+it+under+a+bushel%2C+but+rather+sets+it+in+the+candlestick+of+some+society%2C+where+it+may+give+light+to+all+that+are+round+about+%28Mt.+5%3A15%29%3A+whether+also+is+referred+that+such+personages+are+called+the+salt+of+others%2C+which+has+need+to+approach+and+be+applied+to+that+flesh+which+it+must+season+and+deliver+from+putrefaction.+And+if+he+be+void+of+such+gifts%2C+or+have+not+in+any+great+measure%2C+then+also+is+it+meet+that+he+should+join+himself+to+their+company%2C+by+whom+he+may+have+supply+of+his+wants%2C+that+by+daily+conversation+with+the+wise+he+may+learn+wisdom%3F+And+if+neither+any+man+should+have+need+of+him%2C+nor+he+need+of+any%2C+yet+the+desire+of+being+in+the+congregation+of+God%E2%80%99s+people%2C+to+see+the+beauty+of+the+house+of+God%2C+in+the+participation+of+the+Word+and+sacraments+would+call+him%2C+would+so+inflame+him+as+to+cause+him+to+speed+himself+as+fast+from+the+forsaken+wilderness+to+the+place+of+the+assembly+of+God%E2%80%99s+people%2C+as+the+hart+pursued+of+the+dogs%2C+makes+footmanship+to+the+soil.+%28Prov.+13%3A20%2C+Ps.+42+%26+43%29.+For+David%2C+being+many+years+a+hermit+according+to+your+description%2C+that+is%2C+one+that+lived+in+erema%2C+or+wilderness%2C+did+notwithstanding+the+Lord%E2%80%99s+calling+into+that+place%2C+feel+the+horror+of+the+wilderness%2C+through+desire+he+had+to+go+with+the+rest+of+the+people+unto+the+house+of+God+%28Ps.+84%29.+If+therefore+it+be+a+pleasant+paradise+unto+you+which+was+unto+him+a+horrible+and+desolate+waste%3A+if+you+voluntarily+fly+from+that+which+he+did+so+thirstily+pursue%2C+and+if+you+greedily+seek+thither+from+whence+he+so+desirously+departed%2C+it+is+easy+for+all+men+to+see+that+your+hermits+and+monks+are+of+another+spirit+than+David+was.+But+the+example+of+the+primitive+church+conducted+by+the+hands+of+the+apostles+is+very+pregnant+against+these+wild+asses+whose+habitations+are+in+the+wilderness%3A+for+Luke+bears+witness+that+as+many+as+believed+were+together+in+one+place+%28Acts+2%3A44%29%2C+and+that+they+communicated+not+only+in+spiritual+things%2C+but+nourished+love+by+society+in+their+bodily+repasts+%5Bmeals%5D.+Whereupon+it+may+be+easily+perceived+that+as+amongst+birds+they+are+the+uncleanest+and+most+hateful+that+covet+the+desolate+places%2C+so+amongst+men+they+are+most+to+be+detested+that+forsake+the+mutual+society+of+their+brethren.+Against+this%2C+and+for+foundation+of+hermits+and+monks%2C+is+alleged%3A+First%2C+that+John+was+in+the+wilderness.+Whereunto+our+men+answering+that+it+was+no+such+wilderness+but+that+there+were+towns+in+it%2C+are+charged+with+shameless+perverting+of+the+place.+Howbeit+take+that+away+which+you+have+falsely+surmised+of+us%2C+that+we+expound+a+wilderness+which+is+full+of+towns%2C+and+the+shame+of+your+ignorance+will+return+upon+yourselves.+For+if+you+had+not+been+inured+or+unready+in+the+Word%2C+you+should+have+known+out+of+the+prophet%2C+who+wills+the+wilderness+with+their+cities+to+lift+up+their+voice.+Those+places+which+in+comparison+of+others+%5Bare%5D+more+peopled+are+called+wildernesses%2C+are+not+so+naked+of+their+inhabitants%2C+but+that+they+may+have+diverse+towns+and+villages+planted+in+them.+Hereupon+the+self-same+quarter+of+the+wilderness+of+Jordan+where+John+was%2C+there+was+the+town+of+Bethabara+builded+upon+the+bank+of+the+river.+Here+therefore+it+is+manifest+that+the+entrance+into+his+ministry+was+not+in+such+a+wilderness+as+the+Jesuits+imagine%2C+but+in+a+plain+inhabited+of+men.+The+reason+whereof+is+that%2C+as+the+first+captivity+and+stroke+of+God%E2%80%99s+judgment+began+about+those+parts+of+Jordan%2C+so+to+them+also+first+should+be+offered+the+saving+health%2C+which+was+able+to+comfort+them+over+all+their+desolations.+There+are+two+other+places%2C+and+but+two+%28as+far+as+I+remember%29+famous+by+John%E2%80%99s+ministry%2C+and+those+are%3A+1.+The+waters+of+Salem.+2.+The+waters+of+Enon%2C+which+are+so+called+of+the+two+towns+Salem+and+Enon%2C+set+upon+the+brink+of+those+waters.+So+that+John%E2%80%99s+whole+ministry%2C+so+far+as+may+appear%2C+was+executed+in+habitable+places%2C+where+the+cause+assigned+by+the+Holy+Ghost+why+John+haunted+those+places+is+to+be+observed%2C+namely%3A+for+the+abundance+of+waters+that+were+there+fit+for+his+ministry+in+the+holy+sacrament+of+baptism%2C+whereby+it+is+evident+that+John+came+not+to+those+places+for+that+they+were+not+so+much+peopled+as+others%2C+but+rather+for+seeking+the+commodity+of+water.+Now+therefore%2C+if+it+be+enough+to+make+a+hermit+or+a+monk+to+remain+in+such+a+wilderness+as+John+did%2C+I+can+direct+you+to+fitter+fathers+and+founders+of+your+kind+of+hermits.+You+have+therefore+Nabal+the+churl+which+dwelt+in+the+wilderness+of+Maon%3B+you+have+also+the+Ziphims%2C+which+dwelt+in+the+wilderness+of+Zyph%2C+that+would+have+betrayed+David+into+the+hands+of+Saul%3A+these+are+more+like+birds+of+your+feather.+Or+if+these+you+like+not%2C+you+have+the+heathen+men+which+are+called+Iaponici%2C+who+live+after+the+same+sort+that+your+monks+do%2C+and+in+like+laws.+Now+for+the+closing+up+of+John%E2%80%99s+ministry%2C+it+appears+to+have+been+in+the+court+of+Herod%2C+whether+a+man+would+think+that+it+should+be+hard+for+you+to+prove+that+he+repaired+to+the+end+that+he+might+live+in+a+wilderness.+And+if+it+were+granted+you+which+you+would+have%2C+yet+considering+that+whatsoever+was+done+here+was+to+fulfill+the+prophecy+of+Isaiah%2C+and+by+calling+of+the+Lord%2C+it+can+give+no+warrant+unto+you+which+undertake+this+of+your+own+head%2C+without+commandment+or+instruction+out+of+the+Word.+The+same+reason+is+there+of+his+authority+in+diet+and+apparel%2C+which+is+frankly+confessed+on+our+part+to+have+been+after+a+base+and+homely+sort%3A+howbeit+such+it+was+notwithstanding+as+the+country+%28for+abundance+of+camels+and+plenty+of+locusts+and+wild+honey+which+was+there%29+did+afford.+For+this+special+diet+and+apparel%2C+whereby+Saint+John%2C+declining+from+a+more+liberal+entertainment%2C+which+has+priestly+estate+did+yield+him%2C+conformed+himself+to+the+baser+and+poorer+sort+of+people%2C+was+not+a+fancy+of+his+own%2C+but+that+wherein+he+had+the+light+of+the+Word+to+go+before+him%3A+1.+First%2C+that+he+might+more+lively+represent+the+ministry+of+Elijah%2C+whereunto+he+was+diversely+like%2C+especially+in+the+restoring+of+the+true+worship+of+God.+2.+Secondly%2C+by+commandment+which+being+expressed+in+his+drink%2C+was+wisely+both+of+John%2C+and+of+his+parents%2C+by+proportion+and+convenience%2C+translated+unto+his+meat+and+clothing%3A+considering+that+it+would+have+been+as+an+old+piece+in+a+new+garment%2C+if+his+drink+being+by+God%E2%80%99s+prescription+thin+and+common%2C+his+meat+and+apparel+should+have+been+exquisite+and+picked.+Further%2C+seeing+that+John%E2%80%99s+ministry+has+no+succession%2C+neither+in+respect+of+his+calling+which+was+immediately+from+God%2C+nor+of+his+office%2C+which+was+to+prepare+the+way+for+the+former+coming+of+our+savior+Christ%2C+it+is+manifest+that+the+office+being+at+an+end%2C+the+things+that+were+annexed+unto+it+cannot+continue.+After+this%2C+Chrysostom+is+brought+for+the+confirmation+of+these+orders%2C+wherein+occasion+is+given+to+note+how+their+orders+of+hermits+and+monks+crept+first+into+the+church.+In+time+of+persecution%2C+good+men+were+glad+to+make+the+wilderness%2C+as+it+were%2C+the+cities+of+their+refuge+from+the+face+of+tyrants+that+pursued+them.+This+the+apostle+to+the+Hebrews+does+plainly+set+forth%2C+where+diverse+amongst+sufferings+for+the+truth%2C+he+adds+that+some+wandered+in+the+wilderness%2C+in+mountains%2C+and+hid+themselves+in+dens+and+holes+of+the+earth%2C+clad+in+badgers%E2%80%99+and+goats%E2%80%99+skins+%28Heb.+11%3A38%29%2C+in+which+number+it+is+apparent+that+Elijah%2C+upon+whom+you+would+also+father+this+profession%2C+is+contained.+He+adds+that+therefore+they+were+in+the+wilderness%2C+because+the+world+%28that+dwelt+in+cities+and+villages%29+were+not+worthy+of+them.+If+therefore+you+now+forsake+the+people+by+example+of+these+hermits%2C+it+is+evident+that+you+condemn+your+popish+towns+and+cities+as+profane+and+utterly+unworthy+of+your+company.+And+that+which+the+epistle+to+the+Hebrews+witnesses+of+diverse+times+of+the+Law%2C+the+same+do+the+ecclesiastical+writers+of+diverse+alike+times+under+the+Gospel%2C+as+appears+by+the+example+of+Paulus+of+Thebes%2C+supposed+most+commonly+to+be+the+prince+of+the+monks+and+hermits%2C+which+took+the+wilderness+only+as+a+remedy+in+persecution+raised+against+him.+Further%2C+the+apostle+in+the+said+epistle%2C+and+St.+John+witnesses+of+the+whole+estate+of+the+church%2C+that+it+should+be+in+this+respect+a+hermit%2C+wherefore+the+cause+of+this+hermetic+life%2C+being+through+peace+of+the+church+taken+away%2C+the+kind+of+life+ought+to+have+gone+withal.+But+as+the+churches%2C+by+an+unadvised+imitation+drew+the+interrogatories+ministered+in+the+primitive+church%2C+to+those+which+were+of+years+to+profess+their+faith+in+baptism%2C+unto+young+children%3A+even+so+with+like+unadvisedness%2C+the+state+of+the+hermits%2C+which+properly+agreed+unto+the+persecuting+times%2C+was+translated+unto+the+peaceable+times+of+the+church.+It+was+no+marvel+therefore%2C+although+Chrysostom+and+others+did+fall+sometimes+into+the+commendation+of+the+monkish+and+hermetic+life.+But+their+hermits+and+monks+are+so+unlike+the+pope%E2%80%99s+creatures%2C+that+it+is+a+marvel+that+they+would+fetch+meat+at+the+father%E2%80%99s+hands+to+nourish+this+cattle+with%2C+of+whom+they+could+not+well+be+ignorant+but+that+they+should+receive+more+stripes+than+their+meat+is+worth.+1.+For+first%2C+they+were+not+within+any+degree+of+church+ministry%2C+whereby+they+were%2C+by+so+much+the+freer+to+live+unto+themselves.+2.+Secondly%2C+they+were+not+as+caged+as+yours+as%2C+but+it+was+left+free+unto+them%2C+whether+they+would+repair+to+the+company+of+other+monks+or+not.+3.+Thirdly%2C+they+were+bound+to+wash+the+guests%E2%80%99+feet.+4.+Fourthly%2C+there+was+permitted+unto+them+care+of+wives%2C+of+family%2C+and+private+possession%2C+so+that+the+same+were+moderate+and+not+against+the+care+of+the+soul%3A+contrary+to+your+laws%2C+which+thrust+upon+them+the+vow+of+wilful+poverty.+5.+Fifthly%2C+their+diet+throughout+was+very+sparing%2C+whereas+your+monks+feed+so+fat%2C+that+their+fatness+and+great+bellies+are+grown+into+a+proverb.+6.+Sixthly%2C+the+ancient+monks+got+their+living+with+the+labor+of+their+hands%2C+whereof+also+they+were+bound+to+give+an+account+unto+their+father%3B+yours+are+idle+bellies%2C+which+live+off+the+labors+of+others+only.+7.+Seventhly%2C+they+were+not+too+notorious+by+singular+weed%2C+or+kind+of+apparel%2C+least+men+passing+by+should+stand+gazing+upon+them%2C+or+point+them+out+with+the+finger%3F+Yours+are.+Hither+also+is+to+be+referred+that+they+had+no+rasure+%5Bshaving%5D+command%2C+only+it+was+provided+that+they+should+have+their+hair+long%2C+as+women+have%2C+where+yours+are+crown+shaven.+Likewise%2C+in+the+virgins+at+that+time%2C+it+was+sharply+reproved+if+they+did+cut+off+their+hair%2C+whereas+you+commend+it+highly%2C+as+a+virtue+in+your+nuns+that+they+clip+their+hair.+8.+Eighthly%2C+many+of+the+monks+in+the+elder+times+remaining+monks%2C+retained+their+wives%2C+which+to+you+is+an+abomination%2C+who+thrust+upon+them+the+vow+of+continual+continency.+Last+of+all%2C+these+were+obedient+unto+their+bishop+or+pastor%2C+as+well+as+other+of+the+body+of+the+church%3A+yours+are+exempted+from+his+obedience.+So+that+in+vowing+obedience+of+your+own+invention%2C+you+disavow+the+obedience+which+the+Lord+has+commanded+unto+you.+Now+touching+your+testimonies%2C+Chrysostom+has+not+that+John+%5Bthe+Baptist%5D+was+Prince+of+the+Hermits%2C+as+you+would+untruly+insinuate%3A+but+of+the+monks%2C+without+mention+of+the+hermits.+Which+also%2C+if+they+have+no+manner+of+ground+out+of+the+Evangelist%2C+have+we+not+cause+to+be+offended+with+Chrysostom%3F+And+we+would+think+the+Jesuits+themselves+should+not+be+altogether+pleased+with+him%3B+saying+that+they+like+well+that+the+truth+be+always+spoken+against%2C+so+that+it+be+by+a+friend+of+the+truth%2C+under+whom+they+may+cover+their+deadly+hate+against+it.+Otherwise+how+will+they+digest+that+he+says%2C+The+soul+of+the+monks+is+without+grief+or+passion+and+their+bodies+be+as+Adam%E2%80%99s+before+the+fall.+Jerome%2C+speaking+of+anchorites+and+monks%2C+reckons+up+the+opinions+of+others%2C+how+some+esteem+Elijah+the+author+of+them%3A+other+some+John+Baptist%3B+which+opinions+Jerome+does+apparently+nip+in+the+head%2C+affirming+Elijah+more+than+a+monk%2C+and+John+a+prophet+from+his+birth%3A+and+therefore+none+that+made+choice+of+any+special+vocation.+But+that+the+most+part%2C+one+Paulus+of+Thebes%2C+the+prince+of+that+sect%3A+where+it+is+to+be+observed+that+this+monkish+and+hermetic+birth+is+so+obscure+that+the+father+of+it+is+unknown.+Secondly%2C+the+nearest+guess+that+can+be+had+of+the+parentage+of+it%2C+leaves+it+altogether+in+the+filth+of+man%E2%80%99s+invention.+Last+of+all%2C+that+all+our+monks+and+hermits+and+bastard+and+degenerate+children+from+their+father+Paulus+of+Thebes%2C+the+likelist+prince+of+their+profession%2C+whom+Jerome+affirms+to+have+taken+the+wilderness%2C+not+of+his+voluntary+will%2C+but+persecuted+even+of+his+nearest+friends.+Touching+Isidorus%2C+if+all+speak+truth+that+are+learned%3A+he+%28for+his+time+wherein+he+lived%29+should+be+worthy+of+credit.+He+flourished+about+Pope+Gregory%E2%80%99s+days+the+great%2C+when+this+kind+of+cattle+was+not+dainty.+And+therefore+if+the+stream+of+common+error+carried+him+to+the+liking+and+praising+of+such+a+seat%2C+there+is+no+learning+nor+wisdom+in+the+world+%28without+a+special+grace+from+God%29+which+was+able+to+resist+such+a+forcible+drift.+Howbeit+Isidorus+was+not+so+wedded+to+the+monks+as+the+Jesuits%2C+who+of+six+kinds+of+monks+rejects+three+as+very+bad%3A+where+there+is+not+with+the+Jesuits+no+order+of+monks+which+are+not+sacred%3B+who%2C+wheresoever+they+do+but+find+the+name+of+a+monk%2C+by+and+by+they+think+that+it+is+ground+good+enough+to+plant+monkery+upon.+In+Bernard%2C+your+purveyor+has+deceived+you%2C+for+we+find <blockquote><p>…Chapter 5 argued that Baxter’s treatment of clerical celibacy in the Christian Directory was a product of the three principles that he believed were vital to the Christian life. A life of godliness depended on maintaining a heartfelt love for God, continually meditating on the future life, and ordering one’s life to prioritize doing the greatest good. All intimate relationships, whether familial or bosom friends, posed a common potential threat to his three principles for Christian living. Intimate relationships frequently led one to the sin of disproportionately concentrating affections and time on a select few; this imbalance hindered Christians’ affections for God, focus on the future life, and devotion to doing the greatest good. Therefore, while the godly life was not impossible in marriage, celibacy usually proved to be the most advantageous state of life for Christians and especially pastors. Since Christians were obliged to choose the most profitable state of life, they should only marry if they had a very definite call from God that wedlock would hold more benefits than hindrances to their spiritual welfare and capacity to serve God. The necessity of choosing the most expedient state of life applied even more to pastors, since the hindrances of marriage would be even more detrimental to them in light of the requirements of their sacred calling. Chapter 6 concluded that Baxter’s decision to marry did not signify a capitulation of his argument for clerical celibacy but rather testified to its continuance. Furthermore, in choosing to marry Margaret, Baxter acted consistently with his teaching on what should motivate Christians to marry. Baxter’s account of his wife’s early life described her spiritual transformation from a worldly maiden into one of his most pious and devoted parisioners. Margaret’s affection for Baxter grew out of the influential role he had played in her life as a dear friend, father figure, and pastor of her soul. Baxter’s appreciation of her stemmed from the support, encouragement, and counsel she gave him during his failed attempts to achieve a moderate church settlement after the Restoration. This period was one of the lowest points in Baxter’s life, and Margaret proved to be a great help to his distressed soul. Nevertheless, he remained firmly committed to clerical celibacy and only decided to marry once he had been silenced and ejected from the Kidderminster with no hope of ever having a parish ministry again. Baxter still considered himself a minister of the gospel. However, he would never have a specific pastoral charge that would require him, according to his specific pastoral model, to personally oversee the spiritual state of every parishioner. Since his argument for clerical celibacy no longer applied to his situation, he now felt at liberty to marry and called to marry Margaret. Chapter 7 argued that the problems Baxter experienced in adjusting to married life help explain his continued support for clerical celibacy, despite the great benefit Margaret was to him. Though without a parish ministry, he still devoted himself to serving the universal church and training pastors, primarily through his writings. He persisted in his dedication to redeeming the time by prioritizing matters of necessity, especially choosing his public duties to the church over his private duties to Margaret. When time was scarce, which often proved true because of his chronic illness, his sense of pastoral urgency compelled him to put his ministerial responsibilities before Margaret. Hence, he experienced the same agonizing conflict of loyalties between ministry and marriage that he had always warned pastors to avoid. The benefits afforded by a godly wife, even one as extraordinary as Margaret, seemed to fail to make up for the loss of time and singular devotion which marriage inevitably compromised. Moreover, Baxter viewed Margaret’s exceptional godliness and helpfulness as an exception to what he had always believed men could usually expect from wives. Though scholars have puzzled over why he continued to argue for clerical celibacy, the answer lies in the fact that Baxter was still Baxter, a man driven by a single-minded focus on his public ministry. This study of Baxter’s argument for clerical celibacy has… shown that English Protestants were less monolithic in their praise of marriage over celibacy than previously thought. Celibacy actually experienced a revival of interest among English Protestants during the course of the seventeenth century, and not just among radical sects but also some members of the Church of England. Furthermore, there was considerable disagreement over whether Christians were obligated to remain single, if they could remain chaste, since Paul had said that celibacy was better than marriage. While most stressed that marriage was a lawful and honorable state for all people, a significant minority believed that Christians should only marry once they discovered they lacked the gift of chastity… Second, nearly all scholars have failed to realize that Baxter’s argument for clerical celibacy was key to fulfilling the rigorous ministerial expectations he proscribed in The Reformed Pastor. Baxter presented a model that expected pastors to personally catechize, admonish, and discipline each one of their hundreds or perhaps thousands of parisioners. The ideal pastor was not only defined by his assiduous labor to care for the soul of each parishioner, but also by the fact that he had been freed to do so by foregoing marriage for the sake of the sacred ministry. Only celibacy allowed for the maximal implementation of Baxter’s pastoral model for church reform. …Experience was an influential teacher to Baxter, and he often exhorted all Christians to imitate what he found to be successful in his own life and ministry. His argument for clerical celibacy provided a prime example, for he was simply commending the practice that had been crucial to his pastoral triumph at Kidderminster. Fourth, the uniqueness of Baxter’s argument for clerical celibacy forces one to reexamine the nature of the Christian Directory in terms of the book’s purpose and overarching principles. Scholars have presented the Christian Directory as a summa of the very best of Puritan practical divinity, but such a depiction is difficult to square with Baxter’s argument for clerical celibacy. The conundrum is resolved by understanding that the book was a record of Baxter’s pastoral instruction and practice at Kidderminster, which he intended to help represent his model of ministry for young and inexperienced ministers. He was presenting to them his own convictions about clerical marriage and hoping that many pastors would heed his advice and avoid marrying unless God clearly called them to it…</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/seth-d-osborne.html">Seth D. Osborne</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Reformed &amp; Celibate Pastor Richard Baxter’s Argument for Clerical Celibacy PhD diss</cite>, (Southern Baptist Theological Seminary, 2018) 445 pp., pp. 380-83</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/rome/the-church.html">Rome: The Church</a></span></div>

e practice that had been crucial to his pastoral triumph at Kidderminster. Fourth, the uniqueness of Baxter’s argument for clerical celibacy forces one to reexamine the nature of the Christian Directory in terms of the book’s purpose and overarching principles. Scholars have presented the Christian Directory as a summa of the very best of Puritan practical divinity, but such a depiction is difficult to square with Baxter’s argument for clerical celibacy. The conundrum is resolved by understanding that the book was a record of Baxter’s pastoral instruction and practice at Kidderminster, which he intended to help represent his model of ministry for young and inexperienced ministers. He was presenting to them his own convictions about clerical marriage and hoping that many pastors would heed his advice and avoid marrying unless God clearly called them to it…”

E2%80%99s+account+of+his+wife%E2%80%99s+early+life+described+her+spiritual+transformation+from+a+worldly+maiden+into+one+of+his+most+pious+and+devoted+parisioners.+Margaret%E2%80%99s+affection+for+Baxter+grew+out+of+the+influential+role+he+had+played+in+her+life+as+a+dear+friend%2C+father+figure%2C+and+pastor+of+her+soul.+Baxter%E2%80%99s+appreciation+of+her+stemmed+from+the+support%2C+encouragement%2C+and+counsel+she+gave+him+during+his+failed+attempts+to+achieve+a+moderate+church+settlement+after+the+Restoration.+This+period+was+one+of+the+lowest+points+in+Baxter%E2%80%99s+life%2C+and+Margaret+proved+to+be+a+great+help+to+his+distressed+soul.+Nevertheless%2C+he+remained+firmly+committed+to+clerical+celibacy+and+only+decided+to+marry+once+he+had+been+silenced+and+ejected+from+the+Kidderminster+with+no+hope+of+ever+having+a+parish+ministry+again.+Baxter+still+considered+himself+a+minister+of+the+gospel.+However%2C+he+would+never+have+a+specific+pastoral+charge+that+would+require+him%2C+according+to+his+specific+pastoral+model%2C+to+personally+oversee+the+spiritual+state+of+every+parishioner.+Since+his+argument+for+clerical+celibacy+no+longer+applied+to+his+situation%2C+he+now+felt+at+liberty+to+marry+and+called+to+marry+Margaret.+Chapter+7+argued+that+the+problems+Baxter+experienced+in+adjusting+to+married+life+help+explain+his+continued+support+for+clerical+celibacy%2C+despite+the+great+benefit+Margaret+was+to+him.+Though+without+a+parish+ministry%2C+he+still+devoted+himself+to+serving+the+universal+church+and+training+pastors%2C+primarily+through+his+writings.+He+persisted+in+his+dedication+to+redeeming+the+time+by+prioritizing+matters+of+necessity%2C+especially+choosing+his+public+duties+to+the+church+over+his+private+duties+to+Margaret.+When+time+was+scarce%2C+which+often+proved+true+because+of+his+chronic+illness%2C+his+sense+of+pastoral+urgency+compelled+him+to+put+his+ministerial+responsibilities+before+Margaret.+Hence%2C+he+experienced+the+same+agonizing+conflict+of+loyalties+between+ministry+and+marriage+that+he+had+always+warned+pastors+to+avoid.+The+benefits+afforded+by+a+godly+wife%2C+even+one+as+extraordinary+as+Margaret%2C+seemed+to+fail+to+make+up+for+the+loss+of+time+and+singular+devotion+which+marriage+inevitably+compromised.+Moreover%2C+Baxter+viewed+Margaret%E2%80%99s+exceptional+godliness+and+helpfulness+as+an+exception+to+what+he+had+always+believed+men+could+usually+expect+from+wives.+Though+scholars+have+puzzled+over+why+he+continued+to+argue+for+clerical+celibacy%2C+the+answer+lies+in+the+fact+that+Baxter+was+still+Baxter%2C+a+man+driven+by+a+single-minded+focus+on+his+public+ministry.+This+study+of+Baxter%E2%80%99s+argument+for+clerical+celibacy+has%E2%80%A6+shown+that+English+Protestants+were+less+monolithic+in+their+praise+of+marriage+over+celibacy+than+previously+thought.+Celibacy+actually+experienced+a+revival+of+interest+among+English+Protestants+during+the+course+of+the+seventeenth+century%2C+and+not+just+among+radical+sects+but+also+some+members+of+the+Church+of+England.+Furthermore%2C+there+was+considerable+disagreement+over+whether+Christians+were+obligated+to+remain+single%2C+if+they+could+remain+chaste%2C+since+Paul+had+said+that+celibacy+was+better+than+marriage.+While+most+stressed+that+marriage+was+a+lawful+and+honorable+state+for+all+people%2C+a+significant+minority+believed+that+Christians+should+only+marry+once+they+discovered+they+lacked+the+gift+of+chastity%E2%80%A6+Second%2C+nearly+all+scholars+have+failed+to+realize+that+Baxter%E2%80%99s+argument+for+clerical+celibacy+was+key+to+fulfilling+the+rigorous+ministerial+expectations+he+proscribed+in+The+Reformed+Pastor.+Baxter+presented+a+model+that+expected+pastors+to+personally+catechize%2C+admonish%2C+and+discipline+each+one+of+their+hundreds+or+perhaps+thousands+of+parisioners.+The+ideal+pastor+was+not+only+defined+by+his+assiduous+labor+to+care+for+the+soul+of+each+parishioner%2C+but+also+by+the+fact+that+he+had+been+freed+to+do+so+by+foregoing+marriage+for+the+sake+of+the+sacred+ministry.+Only+celibacy+allowed+for+the+maximal+implementation+of+Baxter%E2%80%99s+pastoral+model+for+church+reform.+%E2%80%A6Experience+was+an+influential+teacher+to+Baxter%2C+and+he+often+exhorted+all+Christians+to+imitate+what+he+found+to+be+successful+in+his+own+life+and+ministry.+His+argument+for+clerical+celibacy+provided+a+prime+example%2C+for+he+was+simply+commending+the+practice+that+had+been+crucial+to+his+pastoral+triumph+at+Kidderminster.+Fourth%2C+the+uniqueness+of+Baxter%E2%80%99s+argument+for+clerical+celibacy+forces+one+to+reexamine+the+nature+of+the+Christian+Directory+in+terms+of+the+book%E2%80%99s+purpose+and+overarching+principles.+Scholars+have+presented+the+Christian+Directory+as+a+summa+of+the+very+best+of+Puritan+practical+divinity%2C+but+such+a+depiction+is+difficult+to+square+with+Baxter%E2%80%99s+argument+for+clerical+celibacy.+The+conundrum+is+resolved+by+understanding+that+the+book+was+a+record+of+Baxter%E2%80%99s+pastoral+instruction+and+practice+at+Kidderminster%2C+which+he+intended+to+help+represent+his+model+of+ministry+for+young+and+inexperienced+ministers.+He+was+presenting+to+them+his+own+convictions+about+clerical+marriage+and+hoping+that+many+pastors+would+heed+his+advice+and+avoid+marrying+unless+God+clearly+called+them+to+it%E2%80%A6%E2%80%9D%0A%0A%E2%80%94+Seth+D.+Osborne%2C+The+Reformed+%26+Celibate+Pastor+Richard+Baxter%E2%80%99s+Argument+for+Clerical+Celibacy+PhD+diss.+%28Southern+Baptist+Theological+Seminary%2C+2018%29+445+pp.%2C+pp.+380-83&amp;url=https%3A%2F%2F5solasquotes.github.io%2Fquote%2F6f7d12c970.html&amp;via=5Solas" target="_blank" rel="noopener">Share on X</a><a class="perma" href="../quote/6f7d12c970.html">Permalink</a><a class="src" href="https://reformedbooksonline.com/on-perpetual-celibacy/#:~:text=Chapter%205%20argued%20that%20Baxter%E2%80%99s%20treatment,God%20clearly%20called%20them%20to%20it&amp;text=Chapter%205%20argued%20that%20Baxter%E2%80%99s%20treatm

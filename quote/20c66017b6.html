<blockquote><p>We must carefully remember this, for there are two extremes to which men are subject. Either they will fall into superstition or they will be irreverent and pay no attention to the worship of God. There are many today who think that baptism and the Lord’s Supper are nothing, and that they could easily bypass them, as though they were angels. […] While recognising the first extreme, let us be careful on the other hand not to fall into superstition, which we are too included to do by nature. We see how those who want to be devout always go too far: some have, for instance, attached the salvation of men to baptism, and have thought that the blood of Christ was now nothing, so to speak. They say that without the water of baptism, nothing happens, and have even added charism, spittle, and all these empty rites. By their foolish fantasies, men have invented this and that in order to avoid the firm and solid determination to hold to the will of God declared to us in his Word.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/john-calvin.html">John Calvin</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Sermons on 2 Samuel: chapters 1-13</cite>, trans. D. F. Kelly (Edinburgh, 1992), pp 271-2.</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/baptism.html">Baptism</a></span></div>

<blockquote><p>7. Again, it is a strong argument in favour of infant baptism, that we find the principle of family baptism again and again adopted in the apostolic age.

We are told, by men learned in Jewish antiquities, that, under the Old Testament economy, it was customary, when proselytes to Judaism were gained from the surrounding nations, that all the children of a family were invariably admitted to membership in the church with their parents; and on the faith of their parents; that all the males, children and adults, were circumcised, and the whole family, male and female, baptized, and incorporated with the community of God’s covenanted people.

Accordingly, when we examine the New Testament history, we find that under the ministry of the apostles, who were all native Jews, and had, of course, been long accustomed to this practice, the same principle of receiving and baptizing families on the faith of the parents, was most evidently adopted and acted upon in a very striking manner. When “the heart of Lydia was opened, so that she attended to the things which were spoken by Paul,” we are told that “she was baptized and her household” (Acts 16:14-15). When the jailor at Philippi believed, he was baptized, “he and all his, straightway” (Acts 16:33). Thus also we read of “the household of Stephanas” being baptized (1 Cor. 1:16).

Now, though we are not certain that there were young children in any of these families, it is highly probable there were. At any rate, the great principle of family baptism of receiving all the younger members of households on the faith of their domestic head, seems to be plainly and decisively established. This furnishes ground on which the advocate of infant baptism may stand with unwavering confidence.

And here let me ask, was it ever known that a case of family baptism occurred under the direction of a Baptist minister? Was it ever known to be recorded, or to have happened, that when, under the influence of Baptist ministrations, the parents of large families were hopefully converted, they were baptized, they and all theirs straightway? There is no risk in asserting that such a case was never heard of. And why? Evidently, because our Baptist brethren do not act in this matter upon the principles laid down in the New Testament, and which regulated the primitive Christians.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/samuel-miller.html">Samuel Miller</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Infant Baptism Scriptural and Reasonable: And Baptism by Sprinkling or Affusion the Most Suitable and Edifying Mode: In Four Discourses</cite>, (Philadelphia: Joseph Whetman, 1835), pp 23-25.</span></figcaption>

</figure><figure class="quote" id="q-96dceccc32" data-kw="">
<blockquote><p>Paul, Rom. 4. stands much upon this to prove that justification by faith is not conferred by the sacraments. And from the circumstance of time he gathers that Abraham was first justified and afterward received circumcision, the sign and the seal of his righteousness. Now we know that the general condition of all sacraments is one and the same and that baptism succeeded circumcision. And what can be more plain then the example of Cornelius (Acts 10). who before Peter came to him had the commendation of the fear of God and was indued with the spirit of prayer. And afterward when Peter by preaching opened more fully the way of the Lord, he and the rest received the holy Ghost? And after all this they were baptized. Now if they received the holy Ghost before baptism, then they received remission of sins, and were justified before baptism.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/william-perkins.html">William Perkins</a></span><span class="wk"><span class="lbl">Work:</span> <cite>A Reformed Catholic, The Eleventh Point</cite>, 611.</span></figcaption>

<blockquote><p>Our Lord’s welcome to children, pronounced in the days of his flesh, implies their membership, “Suffer the little children to come unto me, … for of such is the kingdom of God.” [Mark 10:14] The “kingdom of God” here evidently means the visible Church; and the Saviour expressly declares that infants belong to the Church, and are numbered with his disciples. When it is said “of such,” &amp;c., it cannot merely mean that persons of a childlike disposition compose the kingdom of God, for this would assign no proper reason why infants should be brought to Christ, nor for our Lord’s being displeased with the disciples for seeking to hinder their approach.

If infants are thus declared by our Lord to belong to his Church, then there is certainly no proper reason why they may not be formally and solemnly declared such by baptism. Besides, it cannot be affirmed that they may not have been baptized on this occasion. Our Lord baptized not, but his disciples; and by laying his hands on them, and blessing them, He as solemnly received them as they could have been by the external rite which denotes the conveyance of spiritual blessings. In his discourse to Nicodemus, our Lord declares that none enter his kingdom but such as are born of water, &amp;c.; and the expression being generally understood to contain an allusion to baptism by water, they are excluded from the kingdom of God. Devoid of membership in the Church here, they are cut off from the hopes of eternal salvation – a conclusion this from which, although avowed by some Baptist writers, the pious mind recoils.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/thomas-houston.html">Thomas Houston</a></span><span class="wk"><span class="lbl">Work:</span> <cite>A practical treatise on Christian baptism</cite>, (1853) in Works: doctrinal and practical of the Rev. Thomas Houston, D.D., Knockbracken (4 vols, Edinburgh, 1876), iii, 73-4.</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/baptism.html">Baptism</a></span></div>

<blockquote><p>V. Moreover, this federal sanctity suffices as a warrant for parents to bring their infants to the sacred bath of baptism. It is also a sufficient warrant for the office-bearers of the church to wash the children so brought in the waters of the mystical font. For charity requires that children so distinguished be regarded as children beloved of God and reckoned of the family of God until they manifest the reverse by an evil disposition and a wicked course of life.

Indeed, the height and depth of eternal predestination forbids us to pry into its hidden things with more than a lawful curiosity. Yet, judging soberly, there can be nothing to prevent us from conferring the sign and seal of the covenant upon those whom it is proper to acknowledge as the covenanted people of God; meanwhile the secret things of predestination have been left to God according to his freedom.</p></blockquote>

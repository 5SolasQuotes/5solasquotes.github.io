<main class="wrap"><figure class="quote" id="q-720043aa18" data-kw="">
<blockquote><p>V. There are two principal characteristics of free will in which its formal nature consists: (1) the choice, so that what is done is done by a previous judgment of reason; (2) the willingness, so that what is done is done voluntarily and without compulsion. The former belongs to the intellect; the latter belongs to the will. Two species of necessity also contend [are in opposition] with it. The first is physical and brute necessity; the other the necessity of coaction. The former takes away the choice; the latter, however, the willingness. For the things done from a physical necessity by natural agents determined to one thing by nature and without reason, cannot be done freely, i.e. with the previous light of reason. And the things done by force and compulsion cannot be done voluntarily. There is no controversy about these between us and our opponents.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/francis-turretin.html">Francis Turretin</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Institutes of Elenctic Theology</cite>, Institutes, Tenth Topic, ‘The Free Will of Man in a State of Sin’, Question 2. The reader is encouraged to see Turretin’s numerous discussions relating to the related issues throughout his Institutes, as he has a lot more to say., p. 662</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/free-will-and-inability/liberty-and-necessity.html">Liberty and Necessity</a></span></div>

<blockquote><p>74. From this is plain how there is freedom in the will. For I am said ‘to see freely’ because I can freely use the visual power for seeing; so in the matter at hand, however much any cause be natural and always uniformly acting (as far as is on its own part), yet because it does not determine nor necessitate the will to willing, but the will of its own liberty can concur with it for willing or not willing and so can freely use it, therefore is it said that ‘to will and to refuse freely’ is in our power.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/john-duns-scotus.html">John Duns Scotus</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Other citations (work not named)</cite>, 25th Distinction, Question: ‘Whether an act of will is caused in the will by the object moving it, or by the will moving itself’ in Ordinatio, bk. 2, dist. 15-25 tr. Peter Simpson (2025), pp. 58-71, p. 67</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/free-will-and-inability/liberty-and-necessity.html">Liberty and Necessity</a></span></div>

<blockquote><p>Moreover, what the orthodox fathers and the scholastics who followed their steps handed down very well was commonly known: namely that the natural gifts have been corrupted and the supernatural ones lost. So from this statement we establish that supernatural theology, which by the sin of man had been, as it were, rejected and most undeservedly spurned, retreated from here to the heavens; and natural theology, as all the other things which arise from nature, was corrupted. For how could it have remained uncorrupted in a subject that was corrupted in every part?</p></blockquote>

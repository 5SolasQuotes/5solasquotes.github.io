<main class="wrap"><figure class="quote" id="q-979a88a1b4" data-kw="">
<blockquote><p>There is some authority in the bishops derived from the king which may be acknowledged [as] lawful. Such is this of giving license, liberty and civil authority for men to do good. The civil magistrate may do it himself, or appoint others to do it, 2 Chron. 17:7. The abuse of this authority does not make it unlawful.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/william-ames.html">William Ames</a></span><span class="wk"><span class="lbl">Work:</span> <cite>A Second Manuduction for Mr. [John] Robinson. Or a Confirmation of the Former in an Answer to his Manumission (Amsterdam, 1615)</cite>, pp. 6-7</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/civil-government-and-society/church-and-state.html">Civil Government and Society: Church and State</a></span></div>

</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-87f1be735e" data-kw="">
<blockquote><p>This is clear in all the governments and commonwealths that the Lord did immediately model Himself, magistrates had this for a special part of their task, to keep His ordinances pure, and to restrain the corrupters of them: This is expressed in the Moral Law, where Masters are no less to oversee their servants, that they work not on the Sabbath, from respect to the Lord, than to direct their work all the week from respect to themselves [Ex. 20:8-11]; and by the rules of interpreting of these commands, what belongs to a master to be done by him as a master, in reference to these over whom he has power according to his station, that does belong to all magistrates in reference to these under their charge, according to their stations. Also, where one instance is named, all of that kind are comprehended. And therefore as this ordinance of sanctifying the Sabbath is to be overseen by superiors, so also are all others: yea, it is acknowledged also, that what is expressed in one command, in respect of the extent thereof, is to be understood in all. And therefore this obligation lies on superiors, to make inferiors observant of God’s ordinances in reference to all the commands; this is not doubted of the duties in the Second Table: yet there is no expression in it inferring the same so express as is in the First; and this is a common assertion, magistrates have both Tables of the Law committed to their keeping. This is fully made out by many godly and learned men, and we need not to insist upon it…</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/james-durham.html">James Durham</a></span><span class="wk"><span class="lbl">Work:</span> <cite>On how Circa Sacra flows out of the 4th Commandment: | The Dying Man’s Testament to the Church of Scotland, or, A Treatise Concerning Scandal… (1659), pt. 3, ch. 13</cite>, pp. 241-2</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/civil-government-and-society/church-and-state.html">Civil Government and Society: Church and State</a></span></div>

</figure><figure class="quote" id="q-dca7c69c7e" data-kw="">
<blockquote><p>I am sure, the Reformed Churches and all our writers argue that as many as have souls, Popes, prelates and Roman clergy ought to be subject by this text [Rom. 13:1] to the good laws of the Christian emperors, and that all men, none excepted, neither clergy (as they call them) nor others, but are obliged by this Scripture and 1 Pet. 2 and Titus 3, to give obedience and subjection to all lawful magistrates, heathen and Christian, and to their laws, and to pay tribute and to be judged by them, whereas papists plead exemption to Churchmen…</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/samuel-rutherford.html">Samuel Rutherford</a></span><span class="wk"><span class="lbl">Work:</span> <cite>A Free Disputation... (London, 1649), ch. 17, argument 11</cite>, pp. 227-8</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/civil-government-and-society/church-and-state.html">Civil Government and Society: Church and State</a></span></div>

</figure><figure class="quote" id="q-af834b5bd2" data-kw="">
<blockquote><p>Hence it ought to be observed that something remarkable is here demanded from princes, besides an ordinary profession of faith; for the Lord has bestowed on them authority and power to defend the Church and to promote the glory of God. This is indeed the duty of all; but kings, in proportion as their power is greater, ought to devote themselves to it more earnestly, and to labor in it more diligently.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/john-calvin.html">John Calvin</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Commentary on Isaiah (1550)</cite></span></figcaption>

</figure><figure class="quote" id="q-3193acaa56" data-kw="">
<blockquote><p>What was used in the days of Henry VIII and Edward VI appears by the book of acts and monuments and statutes in their days, to wit, the rejecting the Pope’s jurisdiction, appointing visitors, judging and deposing some bishops, commands to take down images, causing divine service to be in the English tongue, the Bible in the English tongue to be in churches, with many other things of the like kind. The promise to defend them is ‘to our power’ whether by opposing the bringers in of a foreign power, especially the Pope’s or by aiding the king in the right use of this authority, neither is the power granted which may not be lawfully used or exercised, nor is the abuse of it required to be defended.</p></blockquote>

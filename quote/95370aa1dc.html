<blockquote><p>St. James meant of justification in another sense, when he said, ‘A man is justified by works, and not by faith only.’ For he spake of such a justification which is a declaration, continuation and increase of that justification which St. Paul spake of before.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/thomas-cranmer.html">Thomas Cranmer</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Works of Thomas Cranmer Parker Society</cite>, (d. 1556; Cambridge Univ. Press, 1844), ‘Notes on Justification’, p. 208 See also the patristic quotes Cranmer provides, which confirm this reading of his.</span></figcaption>

</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-f6b0d135b8" data-kw="">
<blockquote><p>So in treating of our restoration, Paul intimates in close connection issuing from our very justification before God–provided conviction of it is ours–the immediate presence in believers of the Spirit, the fashioner of all the righteousness we are to display in our lives. Hence he never uses the word ‘justify’ in this way without appearing to speak no less of this imparting of true righteousness than of the round and head of our entire salvation, the forgiveness of sins. In chapter 3 (verse 25) [of Romans] after saying that righteousness is revealed in the era of the unveiling of the gospel, that is to say, is so clearly manifested in the lives of believers that the world now acknowledges these alone to be capable of true righteousness, and after saying secondly, that Christ came to introduce to the world an endeixis, a demonstration of divine righteousness unmistakable to all, he then added, ‘that God himself might be righteous, and the justifier of him who has faith in Jesus Christ’. Here without a doubt he includes at the same time in the word ‘justify’ that righteousness which God produces by his Spirit in those who believe in Christ, and which he intends to be his attestation to the effect that he has now forgiven their sins and counts them among those he resolved to justify, that is, to count among the righteous not only by pardoning their sin but also by conforming them to the image of his Son. The apostle always speaks about our justification in this fashion, never failing to comprehend the summit of our salvation, for which he prayed for the Philippians as follows: ‘It is my prayer that your love may abound more and more in knowledge and all aesthesis (that is, a quality of discernment) whereby you may be able to approve with certainty what is excellent, and to this end, that you may be pure and give offence to no one, thus being equipped for the day of Christ, and filled with the fruits of righteousness which are produced through Jesus Christ to the glory and praise of God.’ [1:9-11] Consequently, since Paul is accustomed to speaking in this way, denoting by the word ‘justification’ first of course the remission of sins, yet at the same time always indicating in addition that imparting of righteousness which God proceeds to work in us by the Spirit, the same Spirit by whom he grants us assurance of the pardon of our sins and of his goodwill towards us, and whom he has established the seal (sphragis) of that pardon–because, I say, Paul customarily speaks in these terms, the majority of the holy Fathers, bearing in mind no doubt the more visible aspect of justification, have taken dikaiousthai, ‘to be justified’, in the sense of ‘to be made righteous… It goes without saying that however great a degree of righteousness the Spirit of Christ might effect in us when we believe, it will nonetheless [not?] be sufficient to merit our being regarded as righteous in God’s sight, for we remain unprofitable servants even when we have fulfilled all his bidding. It was with this in mind that Philip Melanchthon in his highly erudite and devout Commentary on this Epistle rightly condemns those who want to make, “We are justified by faith,’ mean, “Faith is the source or cause that produces other virtues for whose sake we are pronounced righteous,’ or ‘Faith itself is in us a virtue, deserving of God’s approval.’ And he subjoins these godly words: ‘“We are justified by faith,” should be transposed in[to] this sentence: “We are reckoned righteous by mercy.” Similarly, “we are justified by faith alone” means, “We are pronounced righteous by trusting in mercy alone”–so it is only for us to add, ‘as we are given the assurance that we are so pronounced, and thus know by experience this merciful favour of God.’ Surely no godly soul can doubt for a moment that it is through God’s mercy alone and for the sake of Christ’s merit alone that we are justified, pronounced righteous before God, and not because of anything in us at all, however many works of holiness, however genuine our fruits of the Spirit. For who is ignorant of the Scripture, ‘Enter not into judgment with thy servant, for no man living will be justified before thee’? [Ps. 143:2] And in Isaiah, ‘In the Lord shall all the seed of Israel be justified and praised’. [Isa. 45:25]</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/martin-bucer.html">Martin Bucer</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Common Places of Martin Bucer</cite>, pp. 162–64 in Steven Wedgeworth, ‘Bucer on Double Justification’ (2008) at Wedgewords</span></figcaption>

<blockquote><p>These are the two parts of justification; the first is grace revealed by Christ, in that by Him we have God appeased, so that sin can no longer accuse us, but our conscience is, through trust in the mercy of God, brought back to security: the other is the gift of the Holy Ghost, with his gifts, who illuminates us against the defilements of the flesh and the spirit.</p></blockquote>

<blockquote><p>…those [who err] who imagine that a faithful and regenerate man, by committing any crime or grievous sin, does for a sin loose his faith and justification. And of this first assertion there seem also to be two degrees. For when they say that a faithful man by committing a grievous sin does loose his faith, they mean either the act of faith only or the habit [the abiding principle of it] also. If the act only, which is [for the person] to believe [the] remission of [his] sin, and namely of that crime which he has committed, and whereof he has not as yet repented, we acknowledge that that act of faith when a man is fallen into a great sin is interrupted, until he rise again by repentance. But here is their error in that they think, because the act of faith is interrupted, that therefore there is an intercession of justification and reconciliation with God, and a falling from the state of grace and salvation, into the fearful state of damnation. Unless for the qualifying of their opinion they shall say that they speak not of justification in foro caelesti, ‘in the court of heaven,’ but in foro conscientiae, ‘in the court of their conscience,’ and of falling for a time from the assurance of salvation into the guilt of damnation, which if they shall avouch, there shall not need to be any controversy betwixt us. For we do confess that a man cannot be assured of the remission of any crime whilst he continues in it without repentance: and that howsoever there is no condemnation to them that are in Christ Jesus; yet a faithful man by committing any crime incurs the anger of God and provokes his judgments and not only deserves damnation, and is in himself guilty, or contracts the guilt of death, but many times also by the terror and trouble of his own conscience, aggravated partly by afflictions, partly by spiritual desertions and partly by the temptation of Satan, is, in his own opinion, in the state of damnation. But if we will speak properly, justification is to be considered an act of God, for it is God that justifies, and such an act as depends upon his eternal counsel and proceed[s] from his grace given unto us in Christ before all secular times [before the foundation of the world]. For whom He elects, them He calls, and whom He calls according to his purpose, them and no other He justifies, and whom He justifies, them and all them He glorifies. This act of God, which from our effectual vocation is continued to our glorification, is not interrupted, though the act of faith, which is the apprehension of it, be interrupted.</p></blockquote>

<div class="actions"><button class="copy" data-copy="“…those [who err] who imagine that a faithful and regenerate man, by committing any crime or grievous sin, does for a sin loose his faith and justification. And of this first assertion there seem also to be two degrees. For when they say that a faithful man by committing a grievous sin does loose his faith, they mean either the act of faith only or the habit [the abiding principle of it] also. If the act only, which is [for the person] to believe [the] remission of [his] sin, and namely of that crime which he has committed, and whereof he has not as yet repented, we acknowledge that that act of faith when a man is fallen into a great sin is interrupted, until he rise again by repentance. But here is their error in that they think, because the act of faith is interrupted, that therefore there is an intercession of justification and reconciliation with God, and a falling from the state of grace and salvation, into the fearful state of damnation. Unless for the qualifying of their opinion they shall say that they speak not of justification in foro caelesti, ‘in the court of heaven,’ but in foro conscientiae, ‘in the court of their conscience,’ and of falling for a time from the assurance of salvation into the guilt of damnation, which if they shall avouch, there shall not need to be any controversy betwixt us. For we do confess that a man cannot be assured of the remission of any crime whilst he continues in it without repentance: and that howsoever there is no condemnation to them that are in Christ Jesus; yet a faithful man by committing any crime incurs the anger of God and provokes his judgments and not only deserves damnation, and is in himself guilty, or contracts the guilt of death, but many times also by the terror and trouble of his own conscience, aggravated partly by afflictions, partly by spiritual desertions and partly by the temptation of Satan, is, in his own opinion, in the state of damnation. But if we will speak properly, justification is to be considered an act of God, for it is God that justifies, and such an act as depends upon his eternal counsel and proceed[s] from his grace given unto us in Christ before all secular times [before the foundation of the world]. For whom He elects, them He calls, and whom He calls according to his purpose, them and no other He justifies, and whom He justifies, them and all them He glorifies. This act of God, which from our effectual vocation is continued to our glorification, is not interrupted, though the act of faith, which is the apprehension of it, be interrupted.”

ath%2C+but+many+times+also+by+the+terror+and+trouble+of+his+own+conscience%2C+aggravated+partly+by+afflictions%2C+partly+by+spiritual+desertions+and+partly+by+the+temptation+of+Satan%2C+is%2C+in+his+own+opinion%2C+in+the+state+of+damnation.+But+if+we+will+speak+properly%2C+justification+is+to+be+considered+an+act+of+God%2C+for+it+is+God+that+justifies%2C+and+such+an+act+as+depends+upon+his+eternal+counsel+and+proceed%5Bs%5D+from+his+grace+given+unto+us+in+Christ+before+all+secular+times+%5Bbefore+the+foundation+of+the+world%5D.+For+whom+He+elects%2C+them+He+calls%2C+and+whom+He+calls+according+to+his+purpose%2C+them+and+no+other+He+justifies%2C+and+whom+He+justifies%2C+them+and+all+them+He+glorifies.+This+act+of+God%2C+which+from+our+effectual+vocation+is+continued+to+our+glorification%2C+is+not+interrupted%2C+though+the+act+of+faith%2C+which+is+the+apprehension+of+it%2C+be+interrupted.%E2%80%9D%0A%0A%E2%80%94+George+Downame%2C+The+Covenant+of+Grace+or+an+Exposition+upon+Luke+1%3A73-75+%28Dublin%2C+1631%29%2C+ch.+5%2C+pp.+290-91&amp;url=https%3A%2F%2F5solasquotes.github.io%2Fquote%2F4687edc845.html&amp;via=5Solas" target="_blank" rel="noopener">Share on X</a><a class="perma" href="../quote/4687edc845.html">Permalink</a><a class="src" href="https://reformedbooksonline.com/on-the-continuation-of-justification/#:~:text=those%20%5Bwho%20err%5D%20who%20imagine%20that,the%20apprehension%20of%20it%2C%20be%20interrupted&amp;text=those%20%5Bwho%20err%5D%20who%20imagine%20that%20a%20faithful&amp;text=which%20is%20the%20apprehension%20of%20it%2C%20be%20interrupted" rel="noopener" target="_blank">Read it online · Reformed Books Online</a></div>

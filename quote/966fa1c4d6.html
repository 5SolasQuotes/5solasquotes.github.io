<blockquote><p>[N]o sinner is saved without special and Almighty grace; for his depravity is total, and his heart wholly averse from God; so that if God has not provided, in His eternal plan, resources of gracious power, adequate to subdue unto Himself, and to sustain in grace every sinner He attempts to save, I see no probability that any will be saved at all.</p></blockquote>

</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-376e0c9c24" data-kw="">
<blockquote><p>These, whatsoever the Papists say to the contrary, as soon as ever they do but begin to heave and stir in our breasts, are truly sins; and do, in their measure, pollute and defile the soul: for the soul of man is like a clear mirror, upon which if you only breathe, you sully it, and leave a dimness upon it; so, truly, the very first breathings of an evil thought and desire in our souls, do sully their beauty, and dim their lustre, and render the image of God less conspicuous in them than it was before.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/ezekiel-hopkins.html">Ezekiel Hopkins</a></span><span class="wk"><span class="lbl">Work:</span> <cite>An Exposition of the Ten Commandments</cite>, The Tenth Commandment</span></figcaption>

</figure><figure class="quote" id="q-a84fb7eb54" data-kw="">
<blockquote><p>We must here observe, that not only are corrupt and disordered inclinations sins, but the thinking of evil, in as far as it is connected with an inclination and propensity to pursue it, or with a desire to practice it, is sin.</p></blockquote>

</figure><figure class="quote" id="q-ccdb759494" data-kw="">
<blockquote><p>But first of all, it is necessary to consider certain changes which took place in Christian thought on this subject during the preceding centuries. Be the origin of the doctrine in the attempt to smooth the rough places of law for the sake of the weak or tender conscience, or in the practical necessity for a guiding principle of division as a kind of ready reckoner for pastoral purposes, or in both these causes, a change of deep significance came about in its structure. At first, and up to the close of the patristic era, the key-note of the distinction was oþjectivity. The external act is the criterion, so that there is a regular tabula of sins, the commission of any of which involves the sinner in mortal sin. But by the time of the Schoolmen, and notably, of in the works of St. Thomas Aquinas, a tremendous ethical course, change in the idea has come about. There are still sins which are reckoned as mortal, suo genere [in its genera], but the governing factor is no longer the external act. It is the deliberateness with which the act is committed. In other words, intention or motive is receiving recognition as the determining element in assessing the gravity of sin. It was to Peter Abelard [c. 1079–1142)] that Aquinas and his fellows were indebted for this improved idea: In the Scito Te Ipsum [Know Yourself, by Abelard] the discussion of sin moves forward out of the realm of externals. Consequent on this stressing of deliberateness at the expense of drawing a clear line between what was mortal and what venial. This indeterminacy. inevitably paved the way for laxity in the computation of the guiltiness of certain sinful acts.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/henry-r-mcadoo.html">Henry R. McAdoo</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Other citations (work not named)</cite>, Ch. 4, ‘Mortal &amp; Venial Sin: the Reforming Strain’ in The Structure of Caroline Moral Theology (Longmans, Green, 1949), pp. 98-119</span></figcaption>

</figure><figure class="quote" id="q-47a1623368" data-kw="">
<blockquote><p>14. The inward offer is a spiritual enlightening, whereby those promises are propounded to the hearts of men, as it were by an inward word. John 6:45, Whosoever has heard of the Father and has learned, comes to me. Eph. 1:17. That He might give unto you the spirit of wisdom and revelation, the eyes of your mind being enlightened, that ye may know what is that hope of your calling.

15. This also is sometime, and in a certain manner granted to those that are not elected. Hebrews 6:4 &amp; 10:29; Mat. 13:20.

16. If anyone oppose himself out of malice to this illumination, he commits a sin against the Holy Ghost, which is called unpardonable, or unto death. Heb.6:6 &amp; 10:29; 1 John 5:16; Matt 12:32.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/william-ames.html">William Ames</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Conscience with the Power &amp; Cases Thereof</cite>, (d. 1633), bk 1, ch. 26</span></figcaption>

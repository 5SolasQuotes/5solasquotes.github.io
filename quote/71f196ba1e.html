<main class="wrap"><figure class="quote" id="q-71f196ba1e" data-kw="">
<blockquote><p>[I]t is impossible for lapsed men, so far as they are left to themselves, and have no other guide to follow but their reason, to find out what they are to believe of God, and how to serve him, and save themselves. The Fathers and Philosophers too conclude that we can learn from none but God, what we must understand of God; who must be known only as he himself is pleased to reveal himself. His worship also, how he will be served, and what observances he does require, or will admit, since it depends on his own good pleasure, therefore without his directions ’tis in vain to hope to please him with our Religious service whatever it be, and by consequence impossible without his guidance and assistance to acquire the end of all our Service and Religion, the salvation of our souls.

So that how wise soever he be who does propose this blessed end to himself, if yet withal he be not some way from the Lord instructed by what means he must pursue that end, and do not make choice of, and use those means, it is impossible he can be wise unto salvation. Now for this St. Paul assures us most expressly, here we may be furnished: For he says, The Holy Scriptures are able to make us wise unto salvation, through faith which is in Christ Jesus.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/richard-allestree.html">Richard Allestree</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The divine authority and usefulness of the Holy Scripture asserted in a sermon on the 2 Timothy 3. 15</cite>, (Oxford, 1673), pp 5-6.</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/worship.html">Worship</a></span></div>

</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-f85c9e6781" data-kw="">
<blockquote><p>But what is that good and honest heart which they are commended for? it is a heart that does fully purpose to do well, though it fail much in that which it performs: that resolves beforehand to avoid the evil that shall be reproved, and to do the good duties that shall be commanded, and to believe and rest upon the promises that shall be pronounced, as far as God shall give ability, etc. Now wheresoever there is such a ready inclination unto goodness, there will be a bringing forth of fruit; though not in all alike, yet every one will do somewhat: and God will acknowledge them for good ground, and honest-hearted Christians, that yield Him but a thirty-fold, as well as those that yield Him sixty-fold,or an hundred-fold: for a less measure of fruitfulness is an argument of truth, as well as a greater measure, and therefore shall be respected and rewarded.</p></blockquote>

</figure><figure class="quote" id="q-777c869934" data-kw="">
<blockquote><p>1. Indifferent Things are far below the scale of divine institutions, though these institutions are but positive, and not of eternal goodness and righteousness. All the appointments of God and Christ are lifted up into that state the divine appointment designs them to; and shall, if used according to those appointments, be made efficacious to those ends for which they are appointed, according to the effectual working of that power and grace from which they received their original: So that they do make us better, they do commend us to God, if we observe the will and law of God concerning them; and we are the worse in the sinful neglect of them, according to the degree of neglect.

2. They are not of the scale of those things, wherein that order, of which God, by the very laws of rational nature is the author, stands; and not of confusion; so that though this order runs, or ought to run along, and conduct all human actions, and so is not in itself a point of religion; yet when it is applied to religious services and actions, does indeed commend our religious actions and services to God, and the contrary is an evil.

3. Of the same account is that euschemonia, or decency of religious actions, required by God before Himself, and before the holy angels, of which the apostle discourses; ‘Every man praying with his Head uncovered, dishonoureth his head;’ every Woman praying so, ‘ought to have a covering on her head, because of the angels;’ such a distinction of sexes being founded in nature; and in what is beyond nature, the grave customs of ages and places, carry a great weight of determination.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/thomas-beverley.html">Thomas Beverley</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Principles of Protestant Truth &amp; Peace in Four Treatises</cite>, … (London, 1683), pp. 39-40</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/worship/head-coverings-in-worship.html">Head Coverings in Worship</a></span></div>

</figure><figure class="quote" id="q-bd16fb82c0" data-kw="">
<blockquote><p>We act against God, when we act against his Covenant; a Covenant is a serious thing. Suppose the matter of it Civil, (though ours is more) the making of it is Divine. We read of a Covenant made with an Heathen King, which being broken, saith God, shall he prosper, shall he escape that doth such things? what, when lo he had given his hand, ver. 18. He shall not escape; let us look upon our solemn League and Covenant, I tremble when I read it; we covenanted not only against Prelacy, but Popery; not only Hierarchy, but Heresy; not only Sin, but Schism; and have we not gone against the letter of it? how is the Covenant slighted, as an Almanack out of date?

Those that did once lift up their hand to it, do now lift up their heal against it. Indeed at first the Covenant was looked upon as sacred; the drunkard would be sober that day, the unclean person chaste; but within a while it is laid aside; we begin to play fast and loose with God, and for a trifle will venture the curse of the Covenant; But they like men have transgressed the Covenant, or as in Hebrew, They like Adam, how is that? for a poor apple; so for a trifle, a Penny in the shop, or the bushel, men will set their Covenant and their conscience to sale. God sees this, and hear what he saith, I will bring a sword, which shall avenge the quarrel of my Covenant: Covenant violation is an high affronting sin, and an affront will make God draw his sword; to set our hand and seal to the Covenant, and then to tear off the Seal, if the Covenant will not hold us, God hath Chains that will.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/thomas-watson.html">Thomas Watson</a></span><span class="wk"><span class="lbl">Work:</span> <cite>God’s anatomy upon man’s heart. Or, A sermon preached by order of the Honourable House of Commons, at Margaret’s Westminster, Decemb. 27. Being a day of publick humiliation</cite>, (London: Ralph Smith, 1654), pp 25-27.</span></figcaption>

<div class="actions"><button class="copy" data-copy="“We act against God, when we act against his Covenant; a Covenant is a serious thing. Suppose the matter of it Civil, (though ours is more) the making of it is Divine. We read of a Covenant made with an Heathen King, which being broken, saith God, shall he prosper, shall he escape that doth such things? what, when lo he had given his hand, ver. 18. He shall not escape; let us look upon our solemn League and Covenant, I tremble when I read it; we covenanted not only against Prelacy, but Popery; not only Hierarchy, but Heresy; not only Sin, but Schism; and have we not gone against the letter of it? how is the Covenant slighted, as an Almanack out of date?

— Thomas Watson, God’s anatomy upon man’s heart. Or, A sermon preached by order of the Honourable House of Commons, at Margaret’s Westminster, Decemb. 27. Being a day of publick humiliation, (London: Ralph Smith, 1654), pp 25-27.">Copy</button><a class="share" href="https://x.com/intent/post?text=%E2%80%9CWe+act+against+God%2C+when+we+act+against+his+Covenant%3B+a+Covenant+is+a+serious+thing.+Suppose+the+matter+of+it+Civil%2C+%28though+ours+is+more%29+the+making+of+it+is+Divine.+We+read+of+a+Covenant+made+with+an+Heathen+King%2C+which+being+broken%2C+saith+God%2C+shall+he+prosper%2C+shall+he+escape+that+doth+such+things%3F+what%2C+when+lo+he+had+given+his+hand%2C+ver.+18.+He+shall+not+escape%3B+let+us+look+upon+our+solemn+League+and+Covenant%2C+I+tremble+when+I+read+it%3B+we+covenanted+not+only+against+Prelacy%2C+but+Popery%3B+not+only+Hierarchy%2C+but+Heresy%3B+not+only+Sin%2C+but+Schism%3B+and+have+we+not+gone+against+the+letter+of+it%3F+how+is+the+Covenant+slighted%2C+as+an+Almanack+out+of+date%3F%0A%0AThose+that+did+once+lift+up+their+hand+to+it%2C+do+now+lift+up+their+heal+against+it.+Indeed+at+first+the+Covenant+was+looked+upon+as+sacred%3B+the+drunkard+would+be+sober+that+day%2C+the+unclean+person+chaste%3B+but+within+a+while+it+is+laid+aside%3B+we+begin+to+play+fast+and+loose+with+God%2C+and+for+a+trifle+will+venture+the+curse+of+the+Covenant%3B+But+they+like+men+have+transgressed+the+Covenant%2C+or+as+in+Hebrew%2C+They+like+Adam%2C+how+is+that%3F+for+a+poor+apple%3B+so+for+a+trifle%2C+a+Penny+in+the+shop%2C+or+the+bushel%2C+men+will+set+their+Covenant+and+their+conscience+to+sale.+God+sees+this%2C+and+hear+what+he+saith%2C+I+will+bring+a+sword%2C+which+shall+avenge+the+quarrel+of+my+Covenant%3A+Covenant+violation+is+an+high+affronting+sin%2C+and+an+affront+will+make+God+draw+his+sword%3B+to+set+our+hand+and+seal+to+the+Covenant%2C+and+then+to+tear+off+the+Seal%2C+if+the+Covenant+will+not+hold+us%2C+God+hath+Chains+that+will.%E2%80%9D%0A%0A%E2%80%94+Thomas+Watson%2C+God%E2%80%99s+anatomy+upon+man%E2%80%99s+heart.+Or%2C+A+sermon+preached+by+order+of+the+Honourable+House+of+Commons%2C+at+Margaret%E2%80%99s+Westminster%2C+Decemb.+27.+Being+a+day+of+publick+humiliation%2C+%28London%3A+Ralph+Smith%2C+1654%29%2C+pp+25-27.&amp;url=https%3A%2F%2F5solasquotes.github.io%2Fquote%2Fbd16fb82c0.html&amp;via=5Solas" target="_blank" rel="noopener">Share on X</a><a class="perma" href="../quote/bd16fb82c0.html">Permalink</a><a class="src" href="https://reformedcovenanter.wordpress.com/2019/10/03/thomas-watson-on-the-violation-of-the-solemn-league-and-covenant/" rel="noopener" target="_blank">Read it online · Reformed Covenanter</a></div>

<main class="wrap"><figure class="quote" id="q-edbc3687c1" data-kw="">
<blockquote><p>I respond that it was a part of the obedience to the divinely given ceremonial laws until the death of Christ, and a fulfilling of the time of correction (Col. 2; Heb. 9). But by the death of Christ, it being one with the other ceremonials, became defunct as to observing it in conscience, yet not however until it had an honest funeral, but from reason of the scandal of the weak from amongst the circumcision, some of them were to observe them in parts till the Jews may be fully and plainly convicted of the cessation of the ceremonial law.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/gisbertus-voetius.html">Gisbertus Voetius</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Ecclesiastical Politics</cite>, (Amsterdam, 1663-1676) | vol. 1, pt 1, bk. 2, ‘Of Ecclesiastical Things, or Acts &amp; Exercises’, Tract 1, ‘Of Formularies, or Liturgies &amp; Rituals’ | ch. 8. ‘Questions on Some Rituals in Particular: on the Laying on of Hands, the [Holy] Kiss, Abstinence from Things Strangled &amp; Blood, the Marriage Rite, Anointing, Shaking the Feet of Dust, Love Feasts, the Rite of Covenanting &amp; of the Washing of Feet.’, pp. 460-81 3 sections | Section 3 | Problem 3, ‘What ought to be made of abstinence from suffocated things and blood (Acts 15)?, p. 471</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/worship/ceremonies-and-things-indifferent.html">Ceremonies and Things Indifferent</a></span></div>

uotes.github.io%2Fquote%2Fedbc3687c1.html&amp;via=5Solas" target="_blank" rel="noopener">Share on X</a><a class="perma" href="../quote/edbc3687c1.html">Permalink</a><a class="src" href="https://reformedbooksonline.com/on-ceremonies/#:~:text=I%20respond%20that%20it%20was%20a,the%20cessation%20of%20the%20ceremonial%20law&amp;text=I%20respond%20that%20it%20was%20a%20part%20of&amp;text=convicted%20of%20the%20cessation%20of%20the%20ceremonial%20law" rel="noopener" target="_blank">Read it online · Reformed Books Online</a></div>
</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-598737ce3b" data-kw="">
<blockquote><p>…still I deny that they have been set over believers as legislators to prescribe a rule of life at their own hands, or bind the people committed to them to their decrees. When I say this, I mean that they are not at all entitled to insist that whatever they devise without authority from the Word of God shall be observed by the Church as matter of necessity. Since such power was unknown to the apostles, and was so often denied to the ministers of the Church by our Lord himself, I wonder how any have dared to usurp, and dare in the present day to defend it, without any precedent from the apostles, and against the manifest prohibition of God.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/john-calvin.html">John Calvin</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Institutes of the Christian Religion</cite>, bk. 4, ch. 10, section</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/worship/ceremonies-and-things-indifferent.html">Ceremonies and Things Indifferent</a></span></div>

</figure><figure class="quote" id="q-1db11d6637" data-kw="">
<blockquote><p>It is without all warrant to expound Christian Liberty of a power of devising a mutable Church-policy, and laws not warranted in God’s Word, seeing Christian Liberty expressly exempts us altogether from obedience to men’s laws not warranted by Christ’s Word, Gal. 5:1; Col. 2:20, etc.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/samuel-rutherford.html">Samuel Rutherford</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Divine Right of Church Government</cite>, … (1646), p. 30</span></figcaption>

</figure><figure class="quote" id="q-832f706667" data-kw="">
<blockquote><p>The Catalogue of the Errors, Heresies, Blasphemies, is as follows: … 140. This has been lately practiced in London among some of the Sectaries, that love-feasts, or feasts of love (with which the Lord’s Supper is to be administered also) is a perpetual ordinance of Christ, at which only Church-members are to be present, and to partake.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/thomas-edwards.html">Thomas Edwards</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The First &amp; Second Part of Gangræna, or a Catalogue &amp; Discovery of Many of the Errors, Heresies, Blasphemies &amp; Pernicious Practices of the Sectaries of this Time, Vented &amp; Acted in England in these Four Last Years</cite>, (London, 1646), pp. 15, 27</span></figcaption>

</figure><figure class="quote" id="q-36bca76b8d" data-kw="">
<blockquote><p>We require not of necessity an artificial table of timber: a bull-hide or a plot of ground may serve in time of necessity, and answers analogically to a standing table, as the plot of ground did whereabout the multitude sat in rows by fifties and fifties, Mark 6. Neither do we stand upon the fashion, whether it be long or round; but we require that the communicants always sit table-ways [like at a table], so that they may observe the form of a feast or banquet: For in that this holy action is called a ‘supper’, it is imported that it was celebrated in the form of a feast or banquet, as [Johannes] Piscator observes in his observations upon Mt. 26. We do not require all the forms used at common feasts, but these which Christ the institutor, and Master of the feast thought sufficient.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/david-calderwood.html">David Calderwood</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Re-Examination of Two of the Articles Abridged: to wit, of the Communicants’ Gesture in the Act of Receiving, Eating &amp; Drinking</cite>, … ([Holland?] 1636), ‘Of the Communicants’ Gesture in the Act of Receiving’, p. 14 Calderwood was an arch-Scottish presbyterian minister and theologian, who was the major mouthpiece for them between 1618-1637.</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/worship/ceremonies-and-things-indifferent.html">Ceremonies and Things Indifferent</a></span></div>

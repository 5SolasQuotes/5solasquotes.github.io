<main class="wrap"><figure class="quote" id="q-ea53d8095e" data-kw="">
<blockquote><p>3. Though we must not conceive of God as of a human or corporeal shape, yet we cannot think of God without some reflection upon our own being. We cannot conceive Him to be an intelligent being, but we must make some comparison between him and our own understanding nature, to come to a knowledge of him. Since we are enclosed in bodies, we apprehend nothing but what comes in by sense, and what we in some sort measure by sensible objects. And in the consideration of those things, which we desire to abstract from sense, we are fain to make use of the assistances of sense and visible things: And therefore when we frame the highest notion, there will be some similitude of some corporeal thing in our fancy; and though we would spiritualize our thoughts, and aim at a more abstracted and raised understanding, yet there will be some dregs of matter sticking to our conceptions; yet we still judge by argument and reasoning, what the thing is we think of under those material images. A corporeal image will follow us, as the shadow does the body: While we are in the body, and surrounded with fleshly matter, we cannot think of things without some help from corporeal representations: Something of sense will interpose itself in our purest conceptions of spiritual things; for the faculties which serve for contemplation, are either corporeal, as the sense and fancy, or so allied to them that nothing passes into them but by the organs of the body; so that there is a natural inclination to figure nothing but under a corporeal notion, till by an attentive application of the mind and reason to the object thought upon, we separate that which is bodily from that which is spiritual, and by degrees ascend to that true notion of that we think upon, and would have a due conception of in our mind. Therefore God tempers the declaration of Himself to our weakness, and the condition of our natures. He condescends to our littleness and narrowness, when he declares himself by the similitude of bodily members. As the light of the sun is tempered, and diffuses itself to our sense through the air and vapors, that our weak eyes may not be too much dazzled with it: Without it we could not know or judge of the sun, because we could have no use of our sense, which we must have before we can judge of it in our understanding: So we are not able to conceive of spiritual beings in the purity of their own nature, without such a temperament, and such shadows to usher them into our minds. And therefore we find the Spirit of God accommodates himself to our contracted and teddered capacities, and uses such expressions of God, as are suited to us in this state of flesh wherein we are: And therefore because we cannot apprehend God in the simplicity of his own Being, and his undivided essence, he draws the representations of Himself from several Creatures and several actions of those creatures: As sometimes he is said to be angry, to walk, to sit, to fly; not that we should rest in such conceptions of Him, but take our rise from this foundation, and such perfections in the creatures, to mount up to a knowledge of God’s nature by those several steps, and conceive of him by those divided excellencies, because we cannot conceive of him in the purity of his own essence. We cannot possibly think or speak of God, unless we transfer the names of created perfections to Him; yet we are to conceive of them in a higher manner when we apply them to the Divine Nature, than when we consider them in the several creatures formally, exceeding those perfections and excellencies which are in the creature, and in a more excellent manner: as one says, “Though we cannot comprehend God without the help of such resemblances, yet we may without making an image of Him; so that inability of ours excuses those apprehensions of Him from any way offending against his Divine Nature.” These are not notions so much suited to the nature of God as the weakness of man: They are helps to our meditations, but ought not to be formal conceptions of Him. We may assist ourselves in our apprehensions of Him, by considering the subtilty and spirituality of air; and considering the members of a body, without thinking him to be air, or to have any corporeal member. Our reason tells us, that whatsoever is a body, is limited and bounded; and the notion of infiniteness and bodiliness, cannot agree and consist together: And therefore what is offered by our fancy should be purified by our reason.</p></blockquote>

<blockquote><p>3. How it can stand with the wisdom, justice and holiness of God to justify a sinner? ‘Tis a great crime to take the unrighteous to be righteous; and to pronounce the wicked justified, seems to be against the Word of God, Prov. 24:24, ‘He that saith unto the wicked, ‘Thou art righteous,’ him shall the people curse; nations shall abhor him.’ Prov. 17:15, ‘He that justifieth the wicked, and he that condemneth the just, even they both are an abomination unto the Lord.’ Now what is an abomination unto the Lord is surely contrary to his nature, Ex. 34:7, ‘He will by no means clear the guilty.’ Answer: … 3. Effectual calling, or the conversion of man, reconciles it with his holiness; for a sinner, as a sinner, is not justified, but a penitent believer [is]: ’tis true ’tis said, ‘God justifieth the ungodly,’ Rom. 4:5: those that were once so, but not those that continue so; certainly He sanctifies before he justifies, Acts 26:18: ‘To open their eyes, and turn them from darkness to light, and from the power of Satan to God, that they may receive forgiveness of sins, and inheritance among them that are sanctified, by faith that is in Me;’ and in many other places. No man is freed from the guilt of sin, which renders us obnoxious to God’s wrath, who is not freed from the filth of sin, which taints our faculties; for Christ is made to us both righteousness and sanctification, 1 Cor. 1:30. By losing God’s image, we lost his favor; and in the order wherein we lost it, we recover it. God regenerates that He may pardon and justify, and restores first our holiness and then our happiness: ’tis not consistent with God’s holiness to give us pardon and let us alone in our sins. A man would not put a toad in his bosom. But more fully to give you a prospect into this matter, let us take notice of the several things which are mentioned in Scripture, as belonging to our justification: as for instance: Sometimes we are said to be justified by grace, as Rom. 3:24, ‘Being justified freely by his grace’: sometimes by the blood of Christ, as Rom. 5:9, ‘Being justified by his blood, we shall be saved from wrath through Him’: sometimes by faith, as Rom. 5:1, ‘Being justified by faith, we have peace with God through our Lord Jesus Christ’: sometimes by works, James 2:24, ‘Ye see then how that by works a man is justified, and not by faith only.’ All these things concur to our justification and do not contradict, but imply one another: The first moving cause of all is grace; the meritorious cause, is Christs blood: the means of applying, or the condition on our part upon which we are capable at first of receiving so great a privilege, is faith: and the means of continuing in our justified estate, is by good works, or new obedience. I say, our first actual pardon, justification, and right to life, is given upon condition of our first faith and repentance; but this estate is continued to us both by faith, Rom. 1:17 and new obedience; these fairly accord. The grace of God will do nothing without the intervention of Christ’s merits; and Christ’s merits do not profit us ’till it be applied by faith; and sound believers will live in a course of new obedience.</p></blockquote>

<div class="actions"><button class="copy" data-copy="“3. How it can stand with the wisdom, justice and holiness of God to justify a sinner? ‘Tis a great crime to take the unrighteous to be righteous; and to pronounce the wicked justified, seems to be against the Word of God, Prov. 24:24, ‘He that saith unto the wicked, ‘Thou art righteous,’ him shall the people curse; nations shall abhor him.’ Prov. 17:15, ‘He that justifieth the wicked, and he that condemneth the just, even they both are an abomination unto the Lord.’ Now what is an abomination unto the Lord is surely contrary to his nature, Ex. 34:7, ‘He will by no means clear the guilty.’ Answer: … 3. Effectual calling, or the conversion of man, reconciles it with his holiness; for a sinner, as a sinner, is not justified, but a penitent believer [is]: ’tis true ’tis said, ‘God justifieth the ungodly,’ Rom. 4:5: those that were once so, but not those that continue so; certainly He sanctifies before he justifies, Acts 26:18: ‘To open their eyes, and turn them from darkness to light, and from the power of Satan to God, that they may receive forgiveness of sins, and inheritance among them that are sanctified, by faith that is in Me;’ and in many other places. No man is freed from the guilt of sin, which renders us obnoxious to God’s wrath, who is not freed from the filth of sin, which taints our faculties; for Christ is made to us both righteousness and sanctification, 1 Cor. 1:30. By losing God’s image, we lost his favor; and in the order wherein we lost it, we recover it. God regenerates that He may pardon and justify, and restores first our holiness and then our happiness: ’tis not consistent with God’s holiness to give us pardon and let us alone in our sins. A man would not put a toad in his bosom. But more fully to give you a prospect into this matter, let us take notice of the several things which are mentioned in Scripture, as belonging to our justification: as for instance: Sometimes we are said to be justified by grace, as Rom. 3:24, ‘Being justified freely by his grace’: sometimes by the blood of Christ, as Rom. 5:9, ‘Being justified by his blood, we shall be saved from wrath through Him’: sometimes by faith, as Rom. 5:1, ‘Being justified by faith, we have peace with God through our Lord Jesus Christ’: sometimes by works, James 2:24, ‘Ye see then how that by works a man is justified, and not by faith only.’ All these things concur to our justification and do not contradict, but imply one another: The first moving cause of all is grace; the meritorious cause, is Christs blood: the means of applying, or the condition on our part upon which we are capable at first of receiving so great a privilege, is faith: and the means of continuing in our justified estate, is by good works, or new obedience. I say, our first actual pardon, justification, and right to life, is given upon condition of our first faith and repentance; but this estate is continued to us both by faith, Rom. 1:17 and new obedience; these fairly accord. The grace of God will do nothing without the intervention of Christ’s merits; and Christ’s merits do not profit us ’till it be applied by faith; and sound believers will live in a course of new obedience.”

tores+first+our+holiness+and+then+our+happiness%3A+%E2%80%99tis+not+consistent+with+God%E2%80%99s+holiness+to+give+us+pardon+and+let+us+alone+in+our+sins.+A+man+would+not+put+a+toad+in+his+bosom.+But+more+fully+to+give+you+a+prospect+into+this+matter%2C+let+us+take+notice+of+the+several+things+which+are+mentioned+in+Scripture%2C+as+belonging+to+our+justification%3A+as+for+instance%3A+Sometimes+we+are+said+to+be+justified+by+grace%2C+as+Rom.+3%3A24%2C+%E2%80%98Being+justified+freely+by+his+grace%E2%80%99%3A+sometimes+by+the+blood+of+Christ%2C+as+Rom.+5%3A9%2C+%E2%80%98Being+justified+by+his+blood%2C+we+shall+be+saved+from+wrath+through+Him%E2%80%99%3A+sometimes+by+faith%2C+as+Rom.+5%3A1%2C+%E2%80%98Being+justified+by+faith%2C+we+have+peace+with+God+through+our+Lord+Jesus+Christ%E2%80%99%3A+sometimes+by+works%2C+James+2%3A24%2C+%E2%80%98Ye+see+then+how+that+by+works+a+man+is+justified%2C+and+not+by+faith+only.%E2%80%99+All+these+things+concur+to+our+justification+and+do+not+contradict%2C+but+imply+one+another%3A+The+first+moving+cause+of+all+is+grace%3B+the+meritorious+cause%2C+is+Christs+blood%3A+the+means+of+applying%2C+or+the+condition+on+our+part+upon+which+we+are+capable+at+first+of+receiving+so+great+a+privilege%2C+is+faith%3A+and+the+means+of+continuing+in+our+justified+estate%2C+is+by+good+works%2C+or+new+obedience.+I+say%2C+our+first+actual+pardon%2C+justification%2C+and+right+to+life%2C+is+given+upon+condition+of+our+first+faith+and+repentance%3B+but+this+estate+is+continued+to+us+both+by+faith%2C+Rom.+1%3A17+and+new+obedience%3B+these+fairly+accord.+The+grace+of+God+will+do+nothing+without+the+intervention+of+Christ%E2%80%99s+merits%3B+and+Christ%E2%80%99s+merits+do+not+profit+us+%E2%80%99till+it+be+applied+by+faith%3B+and+sound+believers+will+live+in+a+course+of+new+obedience.%E2%80%9D%0A%0A%E2%80%94+Thomas+Manton%2C+A+Second+Volume+of+Sermons%E2%80%A6+%28London%3A+Astwood%2C+1684%29%2C+Sermons+on+Rom.+8%2C+Sermon+43%2C+on+Rom.+8%3A33%2C+pp.+334-35&amp;url <blockquote><p>§I. Sacred Scripture, of both the Old and the New Testament, exhorts and obliges man under the Covenant of Grace to perfection. In the Old Testament, God Himself addresses Abraham: Gen. 17:1, ‘Walk before Me, and be perfect;’… §II. ‘In the New Testament, Christ commands in Mt. 5:48, ‘Be ye therefore perfect, τέλειοι, even as your Father which is in heaven is perfect.’ Paul in 1 Cor. 2:6 says, ‘we speak wisdom among them that are perfect, τελείοις. Phil. 3:15, the same apostle stimulates himself and other Christians to perfection, ‘Let us therefore, as many as be perfect, τέλειοι, be thus minded.’ Col. 1:28, he professes that he and the other apostles announce Christ, so that we may present every man perfect, τέλειον, in Christ Jesus. Col. 3:14, he calls charity σύνδεσμον τῆς τελειότητος, the bond or chain of perfection. Col. 4:12, it is said of Epaphras that he is always striving in prayers for the Colossians, that they may stand perfect, τέλειοι, and complete, πεπληρωμένοι, in all the will of God… Heb. 5:14, the apostle says that strong meat belongs to them that are of full age (perfect), τελείων. §III. Examples of perfect men also occur in the sacred writings… Concerning Noah, God Himself testifies that he was a just and perfect man before him in his generations, Gen. 6:9, and walked with God without ceasing. Concerning Job, God Himself, addressing Satan, gives this sentence in chap. 1 &amp; 2, ‘Hast thou considered my servant Job, that there is none like him in the earth, תםָּ שׁאיִ , a perfect and an upright man, one that feareth God, and escheweth evil.’… §IV. Therefore, the term for Christian ‘perfection’ exists, which we can use without suspicion of heterodoxy, even if others, namely the Novatians and Pelagians, have abused it… Certainly, in the age of Justin Martyr [2nd century A.D.], the name of the perfect was so customary that in his Dialogue with Trypho he himself interprets to become perfect as to become a Christian. … §VI… Perfection is twofold: Legal and Evangelical. Legal is either absolute, or in a certain respect… §VII. Evangelical perfection, on the contrary, consists in the recognition of our misery, both corporal and spiritual, and the necessity of fleeing to the grace of God in Jesus Christ our propitiator, and in a sincere and ἀνυπόκριτος, that is, undisguised and serious and constant endeavor to serve and obey God, through the grace of the Holy Spirit, to be obtained from Him for that purpose by ardent prayers, according to all the commands of the Law, and according to all the faculties of the soul and body, and to grow and advance daily more and more in faith, charity, hope, and other Christian virtues, and to implore pardon for errors and lapses for the sake of the Mediator. §VIII. The former [legal] perfection is rightly called one of degrees, full, and absolute and consummate in all its parts. The latter [evangelical] is called a perfection of parts, inchoate, and in one word, sincerity. And it is such, either absolutely without respect to others who are more imperfect; or comparatively with respect to others who are more imperfect and less mature.</p></blockquote>

fies+that+he+was+a+just+and+perfect+man+before+him+in+his+generations%2C+Gen.+6%3A9%2C+and+walked+with+God+without+ceasing.+Concerning+Job%2C+God+Himself%2C+addressing+Satan%2C+gives+this+sentence+in+chap.+1+%26+2%2C+%E2%80%98Hast+thou+considered+my+servant+Job%2C+that+there+is+none+like+him+in+the+earth%2C+%D7%AA%D7%9D%D6%B8%D6%BC+%D7%A9%D7%81%D7%90%D7%99%D6%B4+%2C+a+perfect+and+an+upright+man%2C+one+that+feareth+God%2C+and+escheweth+evil.%E2%80%99%E2%80%A6+%C2%A7IV.+Therefore%2C+the+term+for+Christian+%E2%80%98perfection%E2%80%99+exists%2C+which+we+can+use+without+suspicion+of+heterodoxy%2C+even+if+others%2C+namely+the+Novatians+and+Pelagians%2C+have+abused+it%E2%80%A6+Certainly%2C+in+the+age+of+Justin+Martyr+%5B2nd+century+A.D.%5D%2C+the+name+of+the+perfect+was+so+customary+that+in+his+Dialogue+with+Trypho+he+himself+interprets+to+become+perfect+as+to+become+a+Christian.+%E2%80%A6+%C2%A7VI%E2%80%A6+Perfection+is+twofold%3A+Legal+and+Evangelical.+Legal+is+either+absolute%2C+or+in+a+certain+respect%E2%80%A6+%C2%A7VII.+Evangelical+perfection%2C+on+the+contrary%2C+consists+in+the+recognition+of+our+misery%2C+both+corporal+and+spiritual%2C+and+the+necessity+of+fleeing+to+the+grace+of+God+in+Jesus+Christ+our+propitiator%2C+and+in+a+sincere+and+%E1%BC%80%CE%BD%CF%85%CF%80%CF%8C%CE%BA%CF%81%CE%B9%CF%84%CE%BF%CF%82%2C+that+is%2C+undisguised+and+serious+and+constant+endeavor+to+serve+and+obey+God%2C+through+the+grace+of+the+Holy+Spirit%2C+to+be+obtained+from+Him+for+that+purpose+by+ardent+prayers%2C+according+to+all+the+commands+of+the+Law%2C+and+according+to+all+the+faculties+of+the+soul+and+body%2C+and+to+grow+and+advance+daily+more+and+more+in+faith%2C+charity%2C+hope%2C+and+other+Christian+virtues%2C+and+to+implore+pardon+for+errors+and+lapses+for+the+sake+of+the+Mediator.+%C2%A7VIII.+The+former+%5Blegal%5D+perfection+is+rightly+called+one+of+degrees%2C+full%2C+and+absolute+and+consummate+in+all+its+parts.+The+latter+%5Bevangelical%5D+is+called+a+perfection+of+parts%2C

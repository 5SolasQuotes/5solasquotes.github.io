<main class="wrap"><figure class="quote" id="q-1898021635" data-kw="" data-pol="">
<blockquote><p>Our faith is built upon no worse a bottom than the infinite veracity of Him who is the truth itself, revealing himself to us in the Scripture of truth, and not on the sandy foundation of any human testimony:-- it leans upon God, not upon men; upon &quot;Thus saith the Lord,&quot; not, &quot;Thus saith the church.&quot;</p></blockquote>
<figcaption>— <a href="../authors/john-owen.html">John Owen</a>, <cite>Sermon 14: The testimony of the church is not the only nor the chief reason of our believing (Works, ed. Goold)</cite></figcaption>

</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-1219b1eb93" data-kw="" data-pol="">
<blockquote><p>Pedagogically the church is prior to Scripture. But in the logical order Scripture is the sole foundation (principium unicum) of church and theology. In case of conflict between them, the possibility of which can never be denied on a Reformational view, church and confession must yield to Scripture. … Nothing may be put on a level with Scripture. Church, confession, tradition—all must be ordered and adjusted by it and submit themselves to it.</p></blockquote>
<figcaption>— <a href="../authors/herman-bavinck.html">Herman Bavinck</a>, <cite>Reformed Dogmatics</cite>, vol. 1: Prolegomena, ch. 2</figcaption>
<div class="meta"><a class="tag" href="../topics/polemics/rome-tradition.html">Rome: Tradition</a><a class="tag" href="../topics/scripture/authority.html">Authority</a></div>

</figure><figure class="quote" id="q-a9307165a8" data-kw="" data-pol="">
<blockquote><p>The Scripture is the best interpreter of Scripture, or the Spirit of God therein; nor are the church or its pastors, nor councils and popes, the infallible interpreters thereof; there is a private interpretation of Scripture, which every Christian may make, according to his ability and light; and there is a public one, by the preacher of the word but both are subject to, and to be determined by the Scripture itself, which is the only certain and infallible rule of faith and practice.</p></blockquote>
<figcaption>— <a href="../authors/john-gill.html">John Gill</a>, <cite>A Body of Doctrinal Divinity</cite>, Book I, ch. 2, p. 51</figcaption>

</figure><figure class="quote" id="q-8fd989b3de" data-kw="" data-pol="">
<blockquote><p>By contrast, the Reformation asserted that a church, however venerable, can still err. … Even the most simple believer can and may if necessary, Bible in hand, stand up to an entire church, as Luther did to Rome. Only thus the freedom of the Christian, and simultaneously the sovereignty of God, is maintained. There is no higher appeal from Scripture. It is the supreme court of appeal. No power or pronouncement stands above it.</p></blockquote>
<figcaption>— <a href="../authors/herman-bavinck.html">Herman Bavinck</a>, <cite>Reformed Dogmatics</cite>, vol. 1: Prolegomena, ch. 14</figcaption>
<div class="meta"><a class="tag" href="../topics/polemics/rome-tradition.html">Rome: Tradition</a><a class="tag" href="../topics/scripture/authority.html">Authority</a></div>

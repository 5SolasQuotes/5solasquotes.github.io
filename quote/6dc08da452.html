<blockquote><p>CANON 22. Concerning those things that belong to man. No man has anything of his own but untruth and sin. But if a man has any truth or righteousness, it from that fountain for which we must thirst in this desert, so that we may be refreshed from it as by drops of water and not faint on the way. CANON 23. Concerning the will of God and of man. Men do their own will and not the will of God when they do what displeases him; but when they follow their own will and comply with the will of God, however willingly they do so, yet it is his will by which what they will is both prepared and instructed.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/second-council-of-orange.html">Second Council of Orange</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Canons And Decrees Of The Second Council Of Orange</cite>, (AD 529)</span></figcaption>

</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-a47b51708f" data-kw="">
<blockquote><p>But to answer more clearly to the point in hand: We must first consider that mere or purely conditional decrees, or conditional volitions, agree not with the perfection of the divine nature. Volitiones pure conditionales sunt alienae a sapientia et prudentia Dei. (Ruiz, De Voluntate, disp. 20, §1) [Volitions that are purely conditional are incompatible with the wisdom and prudence of God.] Voluntas Dei conditionata dici potest, non quia actu feratur in objectum sub conditione, sed quia ex illa voluntate quae praesens est alia oriretur si conditio in objecto poneretur. (Vasqez, in 1st part, disp. 83, p. 511) [The will of God may be called conditional, not because it is actually directed toward its object under a condition, but because from that will which is presently existing another would arise if the condition were to be posited in the object.] The speeches therefore above-cited out of Scripture do not imply a conditional will in God suspended for any moment of time, and then post purificatam conditionem [after the condition has been fulfilled], becoming an absolute and effectual will (see Ruiz, De Scientia, disp. 71, §7), as the like conditional propositions do in us, who have neither knowledge whether the condition will be certainly performed or no, nor yet power in ourselves to work the condition whereupon the future act of our will was suspended. (Ruiz, De Voluntate, disp. 8, §7) But in God, who knows eternally what every man will do or not do, and who in Himself has an absolute power and freedom to make men do any good whereunto He makes promise of reward, and to leave them to their own defective freewill in doing those things for which He has threatened desertion and destruction, these conditional decrees or volitions must be far otherwise conceived: namely, not purely but mixedly conditionalia [conditionals], that is, grounded in some absolute revealed decree of God to the performance whereof He has tied Himself. For example; It is an absolute decree of the divine will published in the gospel that whosoever repents, believes, perseveres, shall be saved: From hence is derived that mixed conditional decree: If Cain, if Judas, if any other repent and believe, they shall be saved. Now such mixed conditional decrees carry no contradiction to the absolute decrees of election and non-election or reprobation. For who sees not that these two propositions may well stand together: I will that if Judas repent and believe he shall have remission and salvation; I will not give unto Judas the gift of repentance, of faith, and of eternal life? The former conditional proposition contains all which this author [Davenant is writing against] can truly collect from the testimonies alleged; and the latter does as truly infer that absolute reprobation for which we contend. For the absolute decree of God resolving not to give faith, repentance and eternal life unto Judas, is that which we understand by the word ‘reprobation’: and this is never abrogated by any conditional promise founded in any universal absolute decree of God.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/john-davenant.html">John Davenant</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Animadversions upon a Treatise entitled, God’s Love to Mankind</cite>, ... (Cambridge: Daniel, 1641), ‘Answer to his Five Reasons against Absolute Reprobation’, pp. 225-27</span></figcaption>

</figure><figure class="quote" id="q-1e2820c86a" data-kw="">
<blockquote><p>The term voluntas signi, literally, the will of the sign, is closely related to the term signum voluntatis, the sign of the will or purpose. It indicates an overt sign or indication that someone wills something and can therefore be understood as a revealed will or, specifically, as a revealed precept or ‘preceptive will’–thus, what is literally called the ‘signified will’ is a will that God makes known and in effect ‘signifies’ what is commanded… The voluntas signi, therefore, is not a ‘mere sign’ but one that corresponds with something that is truly in God.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/richard-muller.html">Richard Muller</a></span><span class="wk"><span class="lbl">Work:</span> <cite>PRRD</cite>, vol. 3 (Baker, 2003), Part 2, ch. 5.4, E., ‘The Ad Intra–Ad Extra Distinctions’, sections 1, p. 458</span></figcaption>

<blockquote><p>In light of such problems, Leigh, Maccovius, and Twisse (very much following the tradition) indicate that the voluntas propositi or beneplaciti [proposed will or of good pleasure, i.e. the will of decree] alone is properly called the will of God, ‘which none can resist, Rom. 9:19,’ whereas the voluntas signi or commandment is only ‘improperly’ called God’s will… Baxter does agree with Twisse, however, that the commandments or signs of God are only improperly designated as the divine will.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/richard-muller.html">Richard Muller</a></span><span class="wk"><span class="lbl">Work:</span> <cite>PRRD</cite>, 3.459</span></figcaption>

<blockquote><p>But though He wills all creatures as means and for his own sake, He wills some more than others to the degree they are more direct and suitable means for his glorification. God is a Father to all his creatures, but He is that especially to his children. His affection for everything He created is not as deep as his affection for his church, and that in turn is not as great as his love for Christ, the Son of his good pleasure. We speak of a general, a special, and a very special providence; in the same way we make as many distinctions in the will of God (as it relates to his creatures) as there are creatures. For the free will of God is as richly variegated as that whole world is. Hence, it must not be conceived as an indifferent power, a blind force, but as a rich and powerful divine energy, the wellspring of the abundant life that creation spreads out before our eyes. In that world, however, there is one thing that creates a special difficulty for the doctrine of the will of God, and that is the fact of evil, both evil as guilt and evil as punishment, in an ethical as well as a physical sense. Though evil is ever so much under God’s control, it cannot in the same sense and in the same way be the object of his will as the good. Hence, with a view to these two very different, in fact diametrically opposed, objects we must again make a distinction in that will of God, as Scripture itself shows. There is a big difference between the will of God that prescribes what we must do (Matt. 7:21; 12:50; John 4:34; 7:17; Rom. 12:2), and the will of God that tells us what He does and will do (Ps. 115:3; Dan. 4:17, 25,32,35; Rom. 9:18-19; Eph. 1:5,9,11; Rev. 4:11). The petition that God’s will may be done (Matt. 6:10) is very different in tenor from the childlike and resigned prayer: “Your will be done” (Matt. 26:42; Acts 21:14). Over and over in history we see the will of God assert itself in two ways. God commands Abraham to sacrifice his son, yet he does not let it happen (Gen. 22). He wants Pharaoh to let his people Israel go, yet hardens his heart so that he does not do it (Exod. 4:21). He has the prophet tell Hezekiah that he will die; still He adds fifteen years to his life (Isa. 38:1,5). He prohibits us from condemning the innocent, yet Jesus is delivered up according to the definite plan and foreknowledge of God (Acts 2:23; 3:18; 4:28). God does not will sin; He is far from iniquity. He forbids it and punishes it severely, yet it exists and is subject to his rule (Ex. 4:21; Josh. 11:20; 1 Sam. 2:25; 2 Sam. 16:10; Acts 2:23; 4:28; Rom. 1:24,26; 2 Thess. 2:11; etc.). He wills the salvation of all (Eze. 18:23,32; 33:11; 1 Tim. 2:4; 2 Pet. 3:9), yet has mercy on whom He wills and hardens whom He wills (Rom. 9:18).</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/herman-bavinck.html">Herman Bavinck</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Reformed Dogmatics: God and Creation</cite>, (Backer Academic, 2004), 2:241</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/attributes-of-god/will-of-god.html">Will of God</a></span></div>
<div class="actions"><button class="copy" data-copy="“But though He wills all creatures as means and for his own sake, He wills some more than others to the degree they are more direct and suitable means for his glorification. God is a Father to all his creatures, but He is that especially to his children. His affection for everything He created is not as deep as his affection for his church, and that in turn is not as great as his love for Christ, the Son of his good pleasure. We speak of a general, a special, and a very special providence; in the same way we make as many distinctions in the will of God (as it relates to his creatures) as there are creatures. For the free will of God is as richly variegated as that whole world is. Hence, it must not be conceived as an indifferent power, a blind force, but as a rich and powerful divine energy, the wellspring of the abundant life that creation spreads out before our eyes. In that world, however, there is one thing that creates a special difficulty for the doctrine of the will of God, and that is the fact of evil, both evil as guilt and evil as punishment, in an ethical as well as a physical sense. Though evil is ever so much under God’s control, it cannot in the same sense and in the same way be the object of his will as the good. Hence, with a view to these two very different, in fact diametrically opposed, objects we must again make a distinction in that will of God, as Scripture itself shows. There is a big difference between the will of God that prescribes what we must do (Matt. 7:21; 12:50; John 4:34; 7:17; Rom. 12:2), and the will of God that tells us what He does and will do (Ps. 115:3; Dan. 4:17, 25,32,35; Rom. 9:18-19; Eph. 1:5,9,11; Rev. 4:11). The petition that God’s will may be done (Matt. 6:10) is very different in tenor from the childlike and resigned prayer: “Your will be done” (Matt. 26:42; Acts 21:14). Over and over in history we see the will of God assert itself in two ways. God commands Abraham to sacrifice his son, yet he does not let it happen (Gen. 22). He wants Pharaoh to let his people Israel go, yet hardens his heart so that he does not do it (Exod. 4:21). He has the prophet tell Hezekiah that he will die; still He adds fifteen years to his life (Isa. 38:1,5). He prohibits us from condemning the innocent, yet Jesus is delivered up according to the definite plan and foreknowledge of God (Acts 2:23; 3:18; 4:28). God does not will sin; He is far from iniquity. He forbids it and punishes it severely, yet it exists and is subject to his rule (Ex. 4:21; Josh. 11:20; 1 Sam. 2:25; 2 Sam. 16:10; Acts 2:23; 4:28; Rom. 1:24,26; 2 Thess. 2:11; etc.). He wills the salvation of all (Eze. 18:23,32; 33:11; 1 Tim. 2:4; 2 Pet. 3:9), yet has mercy on whom He wills and hardens whom He wills (Rom. 9:18).”

— Herman Bavinck, Reformed Dogmatics (Backer Academic, 2004), 2:241">Copy</button><a class="share" href="https://x.com/intent/post?text=%E2%80%9CBut+though+He+wills+all+creatures+as+means+and+for+his+own+sake%2C+He+wills+some+more+than+others+to+the+degree+they+are+more+direct+and+suitable+means+for+his+glorification.+God+is+a+Father+to+all+his+creatures%2C+but+He+is+that+especially+to+his+children.+His+affection+for+everything+He+created+is+not+as+deep+as+his+affection+for+his+church%2C+and+that+in+turn+is+not+as+great+as+his+love+for+Christ%2C+the+Son+of+his+good+pleasure.+We+speak+of+a+general%2C+a+special%2C+and+a+very+special+providence%3B+in+the+same+way+we+make+as+many+distinctions+in+the+will+of+God+%28as+it+relates+to+his+creatures%29+as+there+are+creatures.+For+the+free+will+of+God+is+as+richly+variegated+as+that+whole+world+is.+Hence%2C+it+must+not+be+conceived+as+an+indifferent+power%2C+a+blind+force%2C+but+as+a+rich+and+powerful+divine+energy%2C+the+wellspring+of+the+abundant+life+that+creation+spreads+out+before+our+eyes.+In+that+world%2C+however%2C+there+is+one+thing+that+creates+a+special+difficulty+for+the+doctrine+of+the+will+of+God%2C+and+that+is+the+fact+of+evil%2C+both+evil+as+guilt+and+evil+as+punishment%2C+in+an+ethical+as+well+as+a+physical+sense.+Though+evil+is+ever+so+much+under+God%E2%80%99s+control%2C+it+cannot+in+the+same+sense+and+in+the+same+way+be+the+object+of+his+will+as+the+good.+Hence%2C+with+a+view+to+these+two+very+different%2C+in+fact+diametrically+opposed%2C+objects+we+must+again+make+a+distinction+in+that+will+of+God%2C+as+Scripture+itself+shows.+There+is+a+big+difference+between+the+will+of+God+that+prescribes+what+we+must+do+%28Matt.+7%3A21%3B+12%3A50%3B+John+4%3A34%3B+7%3A17%3B+Rom.+12%3A2%29%2C+and+the+will+of+God+that+tells+us+what+He+does+and+will+do+%28Ps.+115%3A3%3B+Dan.+4%3A17%2C+25%2C32%2C35%3B+Rom.+9%3A18-19%3B+Eph.+1%3A5%2C9%2C11%3B+Rev.+4%3A11%29.+The+petition+that+God%E2%80%99s+will+may+be+done+%28Matt.+6%3A10%29+is+very+different+in+tenor+from+the+childlike+and+resigned+prayer%3A+%E2%80%9CYour+will+be+done%E2%80%9D+%28Matt.+26%3A42%3B+Acts+21%3A14%29.+Over+and+over+in+history+we+see+the+will+of+God+assert+itself+in+two+ways.+God+commands+Abraham+to+sacrifice+his+son%2C+yet+he+does+not+let+it+happen+%28Gen.+22%29.+He+wants+Pharaoh+to+let+his+people+Israel+go%2C+yet+hardens+his+heart+so+that+he+does+not+do+it+%28Exod.+4%3A21%29.+He+has+the+prophet+tell+Hezekiah+that+he+will+die%3B+still+He+adds+fifteen+years+to+his+life+%28Isa.+38%3A1%2C5%29.+He+prohibits+us+from+condemning+the+innocent%2C+yet+Jesus+is+delivered+up+according+to+the+definite+plan+and+foreknowledge+of+God+%28Acts+2%3A23%3B+3%3A18%3B+4%3A28%29.+God+does+not+will+sin%3B+He+is+far+from+iniquity.+He+forbids+it+and+punishes+it+severely%2C+yet+it+exists+and+is+subject+to+his+rule+%28Ex.+4%3A21%3B+Josh.+11%3A20%3B+1+Sam.+2%3A25%3B+2+Sam.+16%3A10%3B+Acts+2%3A23%3B+4%3A28%3B+Rom.+1%3A24%2C26%3B+2+Thess.+2%3A11%3B+etc.%29.+He+wills+the+salvation+of+all+%28Eze.+18%3A23%2C32%3B+33%3A11%3B+1+Tim.+2%3A4%3B+2+Pet.+3%3A9%29%2C+yet+has+mercy+on+whom+He+wills+and+hardens+whom+He+wills+%28Rom.+9%3A18%29.%E2%80%9D%0A%0A%E2%80%94+Herman+Bavinck%2C+Reformed+Dogmatics+%28Backer+Academic%2C+2004%29%2C+2%3A241&amp;url=https%3A%2F%2F5solasquotes.github.io%2Fquote%2F617cfcd054.html&amp;via=5Solas" target="_blank" rel="noopener">Share on X</a><a class="perma" href="../quote/617cfcd054.html">Permalink</a><a class="src" href="https://reformedbooksonline.com/topics/topics-by-subject/the-sincere-free-offer-of-the-gospel/quotes-on-the-distinction-between-gods-revealed-will-and-his-will-of-decree/#:~:text=But%20though%20He%20wills%20all%20creatures,hardens%20whom%20He%20wills%20%28Rom.%209%3A18&amp;text=But%20though%20He%20wills%20all%20creatures%20as%20means&amp;text=wills%20and%20hardens%20whom%20He%20wills%20%28Rom.%209%3A18" rel="noopener" target="_blank">Read it online · Reformed Books Online</a></div>

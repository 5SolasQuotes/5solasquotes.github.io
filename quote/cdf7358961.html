<blockquote><p>Only we observe that the Independents here go farther from the Reformed Churches, both in the strictness and in the loosness of their satisfactions. The Brownists [separatists] are satisfied with the signs of personal grace, but the Independents require more: they proceed to a trial by a long conversation of the sociable and complying disposition of the person to be admitted with the spirits of the whole Church whereof he is to be a member; without this suitableness of spirit they will reject them whom otherwise they find to be saints. But their chief excess here is in looseness. The Brownists will not dispense with known errors and sins in the members; they will not admit of Anabaptists, of proud, luxurious, contentious people. If they find any such to have crept in among them, they profess their judgement is for their casting out by censures. But the Independents will here be more wise for the increase of their party: and however they will have nothing to do with presbyterians, nor with such people who can live in their confused congregations, yet they make it their rule to hold out none for any error that is not fundamental, nor for any sin that is not continued in against conscience; walking according to this rule they swallow down without trouble the small gnats of Anabaptism and all other sects, who err not fundamentally and obstinately, and against conscience: How many sectaries are thus far guilty, who can determine? The little spot of luxury in apparel, in diet, and many fleshly delights, of strife, of disdainful railing, and such other faults (as are too common in their members) are of easy digestion.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/robert-baillie.html">Robert Baillie</a></span><span class="wk"><span class="lbl">Work:</span> <cite>A Dissuasive from the Errors of the Time, wherein the Tenets of the Principal Sects, Especially of the Independents, are Drawn Together in One Map</cite>, (1645), p. 106</span></figcaption>

<blockquote><p>11. This [church] covenant (thus distinguished from the Covenant of Grace) they hold to be that covenant which is sealed by the sacraments, and for the sealing and ratifying of which the sacraments were principally ordained of God, and therefore to be administered only to such as are first entered into this covenant, as seals thereof. Apology, p. 15, 19, 31; Answer to 9; pos. pp. 63 &amp; 66. And therefore, that such persons as (by their condition) cannot join in church covenant, nor live in church fellowship with a set society, are not bound to partake in sacraments. Apology, pp. 39 &amp; 41. See [John] Robinson, Justification, pp. 80 &amp; 110, though I do not find the Brownists so solicitously to distinguish between the church covenant and the Covenant of Grace as these our [Independent and congregationalist] brethren do.</p></blockquote>

">Read it online · Reformed Books Online</a></div>
</figure><figure class="quote" id="q-ee28a452b6" data-kw="">
<blockquote><p>‘But’ (says he [John Robinson, a Separatist]) ‘the bare profession of fundamentals makes not a Church; they must be a company of faithful people, and if they must not be truly faithful, then they must be falsely faithful; for God requires true and ready obedience in his word, according to which we must define Churches, and not according to casual things.’ [Rutherford’s] Answer: This is a special ground that deceives the Separatists, their ignorance (I mean) of the visible Church, for the visible Church consists essentially neither of such as be truly faithful, nor of such as must be falsely faithful; for the ignorant man sees not that the visible Church includes neither faith, nor unbelief in its essence or definition. It is true, to the end that professors may be members of the invisible Church, they must be believers, and must believe, except they would be condemned eternally; but to make them members of the visible Church, neither believing nor unbelieving is essential, but only a profession ecclesiastically intear[?], that is not scandalous &amp; visibly &amp; apparently lewd and flagitious, such as was the profession of Simon Magus when he was baptized with the rest of the visible Church, Acts 8. And God indeed requires of us true worship and ready obedience, as he says, but not that a visible Church should be defined by true and sincere obedience: for essentials only are taken in a definition, and casual corruptions are only accidental to Churches and fall out through men’s faults, and therefore should not be in the definition either of a visible or an invisible Church; nor should ready and sincere obedience which is a thing invisible to men’s eyes be put in the definition of a visible Church, for it is accidental to a visible Church, and nothing invisible can be essential to that which essentially is visible; the visible Church is essentially visible.</p></blockquote>

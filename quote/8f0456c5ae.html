<main class="wrap"><figure class="quote" id="q-8f0456c5ae" data-kw="">
<blockquote><p>As in the former case (Mt. 16:19) He did not intend to confirm indiscriminately every kind of doctrine, but only that which had proceeded out of his mouth, so neither does He say in this place that every kind of decision will be approved and ratified, but only that in which He presides, and that too not only by his Spirit, but by his Word… For, though Christ alone is the Judge of the world, yet He chooses to have ministers to proclaim his Word. Besides, He wishes that his own decision should be pronounced by the Church; and thus He takes nothing from his own authority by employing the ministry of men, but it is Himself alone that looses and binds. But here a question arises. Since the Church endures many hypocrites, and likewise absolves (or looses) many whose professions of repentance are hypocritical, does it follow that such persons will be absolved (or loosed) in heaven? I reply, the discourse is addressed to those only who are truly and sincerely reconciled to the Church… Hence, too, we may see how absurdly the Papists torture this passage to cloak every species of tyranny… they endeavor even to prove from this passage that we must bear all the burdens which they shall impose… since Christ speaks only about correcting offenders, those who by their laws ensnare souls are chargeable with not less folly than wickedness in abusing this passage.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/john-calvin.html">John Calvin</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Commentary on Matthew</cite>, 18, verse 18</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/church-government-and-the-ministry/synods-and-assemblies.html">Synods and Assemblies</a></span></div>

</figure><figure class="quote" id="q-cbecbbb5dc" data-kw="">
<blockquote><p>Fourth, there is yet another concession which it is necessary to make in regard to this matter, and which it is of some importance to note; and it is this, that the mere resistance to authority as authority alone, ought not to be made a ground for Church censure or punishment, when there is no moral or spiritual offence connected with the resistance. Of course resistance to authority, even when that authority is put forth, as it sometimes may and must be, in enforcing a thing indifferent, may yet be associated with moral guilt on the part of those who indulge in it. Such resistance may arise out of feelings of hatred to all restraint, or opposition of a malignant kind to all authority; it may become contumacy, and as such involve moral blame. But until resistance to authority becomes in one way or other morally wrong, when the consent of the members to the act or deed of the rulers is withheld from no cause in itself sinful, such want of consent or concurrence ought to be dealt with on the principle of forbearance in things indifferent, and not be visited with censure or penalty of an ecclesiastical kind.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/james-bannerman.html">James Bannerman</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Church of Christ: A Treatise on the Nature, Powers, Ordinances, Discipline, and Government of the Christian Church</cite>, vol. 1, Edinburgh, 1868, p. 243</span></figcaption>

<blockquote><p>…for rulers in making laws, and creating by their sole pleasure goodness-moral, in particular matters without the Word of God, are not God’s servants, nor is human authority as human, the nearest cause of obligation of conscience, instamped in these laws, nor is it the cause at all, and therefore to resist them, is not to resist God. They be God’s instruments and ministers in: 1. Propounding and expounding God’s laws. 2. In executing them and defending them from the violence of men. 3. In making positive and directory civil laws for civil government that are laws improperly so called, which bind the conscience as above is said, insofar as they have dependence upon God’s Law; For James says, ‘There is but one Lawgiver’ [James 4:12]. As for Church-canons, all, except physical circumstances in them, are to be warranted by the Word.</p></blockquote>

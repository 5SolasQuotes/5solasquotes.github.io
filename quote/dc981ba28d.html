<main class="wrap"><figure class="quote" id="q-dc981ba28d" data-kw="">
<blockquote><p>We deny that the pope was or can be said to be the successor of Peter, as they pretend. The reasons are: first, if he is his successor, this will be either with respect to the common and ordinary ministry of preaching the word, administering the sacraments and exercising discipline; or with respect to the special and extraordinary work of the apostleship. And yet in the former sense, succession does not belong to anyone in particular, but to all true ministers of Christ and pastors of the church in general, who on this account are everywhere called by the fathers “successors of the divine apostles” (diadochoi tōn theiōn apostolōn). While in the latter sense, no one could succeed the apostles because their office was temporary and extraordinary (to lay the foundations of the Christian church) and therefore did not admit of successors in the same office.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/francis-turretin.html">Francis Turretin</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Institutes of Elenctic Theology</cite>, 18.19.3</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/church-government-and-the-ministry/papacy.html">Papacy</a> › <a href="../topics/church-government-and-the-ministry/papacy/apostolic-succession.html">Apostolic succession</a></span><span class="t"><a href="../topics/the-church/marks-of-the-true-church.html">Marks of the True Church</a> › <a href="../topics/the-church/marks-of-the-true-church/unity-holiness-catholicity-apostolicity.html">Unity, holiness, catholicity, apostolicity</a></span><span class="t"><a href="../topics/rome/the-papacy.html">Rome: The Papacy</a> › <a href="../topics/rome/the-papacy/papal-supremacy.html">Papal supremacy</a></span><span class="t"><a href="../topics/rome/the-papacy.html">Rome: The Papacy</a> › <a href="../topics/rome/the-papacy/primacy-of-peter.html">Primacy of Peter</a></span></div>

</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-b65840e1fc" data-kw="">
<blockquote><p>For they hold the places, but you the Apostolic Faith. They are, it is true, in the places, but outside of the true Faith; while you are outside the places indeed, but the Faith, within you. Let us consider whether is the greater, the place or the Faith. Clearly the true Faith. Who then has lost more, or who possesses more? He who holds the place, or he who holds the Faith? Good indeed is the place, when the Apostolic Faith is preached there, holy is it if the Holy One dwell there.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/athanasius-of-alexandria.html">Athanasius of Alexandria</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Festal Letters</cite>, fragment, letter to his children</span></figcaption>

</figure><figure class="quote" id="q-5dd7f1a21d" data-kw="Papacy Papal supremacy">
<blockquote><p>The question, then, may be thus stated, Is it necessary for the true order of the hierarchy (as they term it), or of ecclesiastical order, that one See should surpass the others in dignity and power, so as to be the head of the whole body? We subject the Church to unjust laws if we lay this necessity upon her without sanction from the word of God. … Every one knows that the high priest was a type of Christ; now, the priesthood being transferred, that right must also be transferred.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/john-calvin.html">John Calvin</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Institutes of the Christian Religion</cite>, 4.6.2</span></figcaption>

</figure><figure class="quote" id="q-7f4a9b7ead" data-kw="Succession">
<blockquote><p>Thirdly, I say that this appertains as much to all bishops and ministers as to the pope of Rome himself; because they all succeed Peter in this matter, that is, in the preaching of the word, and should imitate his diligence in feeding the sheep of Christ.</p></blockquote>

</figure><figure class="quote" id="q-49003e754d" data-kw="">
<blockquote><p>Certain it is that many popes have been notorious heretics, as Liberius and Felix, who were Arians; Honorius, a Monothelite; and John XXIII, who denied the immortality of the soul. In the papal see, several schisms have been, and divers times many popes together, excommunicating one another and reciprocally calling one another Antichrist; and of those Antichrists, the worst commonly overcame. So according to the very canons of the Roman Church, factions and corruptions in the creation of the popes have several times made their election void and therefore have broken the thread of that succession.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/pierre-du-moulin.html">Pierre Du Moulin</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Novelty of Popery</cite>, bk. 1, ch. 32</span></figcaption>

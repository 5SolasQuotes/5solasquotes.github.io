<blockquote><p>Nor is it any sinful separation or disorder for the members of one church to communicate occasionally with other churches of Christ, seeing our relation to the universal Church is more strict and inviolable than to any particular church as such.</p></blockquote>

</figure><figure class="quote" id="q-cdf7358961" data-kw="">
<blockquote><p>Only we observe that the Independents here go farther from the Reformed Churches, both in the strictness and in the loosness of their satisfactions. The Brownists [separatists] are satisfied with the signs of personal grace, but the Independents require more: they proceed to a trial by a long conversation of the sociable and complying disposition of the person to be admitted with the spirits of the whole Church whereof he is to be a member; without this suitableness of spirit they will reject them whom otherwise they find to be saints. But their chief excess here is in looseness. The Brownists will not dispense with known errors and sins in the members; they will not admit of Anabaptists, of proud, luxurious, contentious people. If they find any such to have crept in among them, they profess their judgement is for their casting out by censures. But the Independents will here be more wise for the increase of their party: and however they will have nothing to do with presbyterians, nor with such people who can live in their confused congregations, yet they make it their rule to hold out none for any error that is not fundamental, nor for any sin that is not continued in against conscience; walking according to this rule they swallow down without trouble the small gnats of Anabaptism and all other sects, who err not fundamentally and obstinately, and against conscience: How many sectaries are thus far guilty, who can determine? The little spot of luxury in apparel, in diet, and many fleshly delights, of strife, of disdainful railing, and such other faults (as are too common in their members) are of easy digestion.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/robert-baillie.html">Robert Baillie</a></span><span class="wk"><span class="lbl">Work:</span> <cite>A Dissuasive from the Errors of the Time, wherein the Tenets of the Principal Sects, Especially of the Independents, are Drawn Together in One Map</cite>, (1645), p. 106</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/the-church/church-membership.html">Church Membership</a></span></div>

uasive+from+the+Errors+of+the+Time%2C+wherein+the+Tenets+of+the+Principal+Sects%2C+Especially+of+the+Independents%2C+are+Drawn+Together+in+One+Map+%281645%29%2C+p.+106&amp;url=https%3A%2F%2F5solasquotes.github.io%2Fquote%2Fcdf7358961.html&amp;via=5Solas" target="_blank" rel="noopener">Share on X</a><a class="perma" href="../quote/cdf7358961.html">Permalink</a><a class="src" href="https://reformedbooksonline.com/topics/topics-by-subject/the-church/church-membership#:~:text=Only%20we%20observe%20that%20the%20Independents,their%20members%29%20are%20of%20easy%20digestion&amp;text=Only%20we%20observe%20that%20the%20Independents%20here%20go&amp;text=common%20in%20their%20members%29%20are%20of%20easy%20digestion" rel="noopener" target="_blank">Read it online · Reformed Books Online</a></div>
</figure><figure class="quote" id="q-39a12a85b5" data-kw="">
<blockquote><p>We see not how letters of recommendation, most lawful as we judge, and necessary, can resign ministerial power, a liberty bought with Christ’s blood (as you say) to any other church, for we think all the visible Churches are one catholic visible Church and should have a visible communion, and so that there is no resignation of ministerial power in these letters, but they are declaratory of the Christian behavior of the dismissed Christian. We ask if dimissory letters be authoritative and done by the church as the church, and how can a church usurp authority (by your way) over a sister church to recommend a sojourner to a church-state and church liberties and seals of the Covenant? one church has no authority over another. If these letters be merely private and merely declaratory, to manifest and declare the sojourner’s Christian behavior, only then he had power and right without these letters or any act of resignation, or giving away ministerial power, to be a Church-member of the visible Church to the which he goes. Therefore, he was a member of the visible Church to which he goes before the dimissory letters were written; and the letters do resign no right but only notify and declare the sojourner’s preexistent right, and so there is a visible Church and a visible communion of all congregations on earth, and must be an external power and authority in all for synods. Let our [congregationalist] brethren see to this. [Margin note:] It is true, none should remove from one congregation to another without God go before them, nor can they change countries without God’s warranting direction, Gen 12:1; 46:4, but that such removal is a matter of Church-discipline, and must be done by a ministerial power, is unwarranted by any word of God. 3. [In congregationalism] The person to remove must be dismissed and loosed by the consent of the whole congregation (if conveniency permit) else he is not exonered of his church-oath made to that congregation; What if conveniency do not permit? then is he loosed from an oath without consent of the Church, which did by oath receive him. I thinkejusdem potestatis est(as the law says) ligare et solvere, ‘that’ Church ‘power which binds must loose.’ 4. If the [man-drawn-up] church-covenant be an everlasting covenant, as Jer. 50:5 [which the congregationalists proof-texted], tying the man to the membership of that particular congregation forever, I see not how the church can use [letters of transfer like] indulgences and Pope-like dispensations against the oath of God, to break it upon light and frivolous reasons [such as moving, etc.]; for if God punish covenant breaking, so also should the church, and can by no indulgence be accessory to the breach of God’s oath; there is too great a smell of Popery, Arminianism, and Socinianism in this way in my weak judgement. But if the man be not sworn a member of that particular church by his oath, he is sworn a member of the visible Church universal, which our brethren cannot well say. Neither is any covenant called an everlasting covenant in the Scripture but the Covenant of Grace, Jer. 31:33; 32:40; Isa. 54:9-10, and that is made with the invisible catholic Church of believers, as is the Covenant [in] Jer. 50:5, and not a Covenant with one visible congregation; and what warrant has the Church to dispense with the breach of such an everlasting Covenant? 5. The testimony of other churches, if it be a warrant to you, in faith, to receive into the church such a one as a saint and a temple of the Holy Spirit, how should it not also be a warrant to you to cast out and excommunicate also? 6. The person coming from another Church, if of approven piety, is received, by lifting up of the hands, or silence of the church, as you say: 1. Have we a warrant from God’s Word for such a new inchurching? 2. Why is he not received by a church oath? as a minister transplanted to another church must have ordination and election of new [according to congregationalists], for to you there is alike reason. 3. If there be no need of a new church oath to make him a member of that visible congregation, seeing now he is loosed from the former, you insinuate his former church-oath did make him a member of a visible church, and so he that is a visible member in a church, is a visible member of all, and so there must be a visible Church-catholic, if there be a catholic visible membership in any one member, and so you destroy what you build.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/samuel-rutherford.html">Samuel Rutherford</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Due Right of Presbyteries, ‘Acts 15, A Pattern of a Juridicial Synod’</cite>, … (London, 1644), pt. 2, ch. 6, section 1, pp. 328-30</span></figcaption>

+power%2C+is+unwarranted+by+any+word+of+God.+3.+%5BIn+congregationalism%5D+The+person+to+remove+must+be+dismissed+and+loosed+by+the+consent+of+the+whole+congregation+%28if+conveniency+permit%29+else+he+is+not+exonered+of+his+church-oath+made+to+that+congregation%3B+What+if+conveniency+do+not+permit%3F+then+is+he+loosed+from+an+oath+without+consent+of+the+Church%2C+which+did+by+oath+receive+him.+I+thinkejusdem+potestatis+est%28as+the+law+says%29+ligare+et+solvere%2C+%E2%80%98that%E2%80%99+Church+%E2%80%98power+which+binds+must+loose.%E2%80%99+4.+If+the+%5Bman-drawn-up%5D+church-covenant+be+an+everlasting+covenant%2C+as+Jer.+50%3A5+%5Bwhich+the+congregationalists+proof-texted%5D%2C+tying+the+man+to+the+membership+of+that+particular+congregation+forever%2C+I+see+not+how+the+church+can+use+%5Bletters+of+transfer+like%5D+indulgences+and+Pope-like+dispensations+against+the+oath+of+God%2C+to+break+it+upon+light+and+frivolous+reasons+%5Bsuch+as+moving%2C+etc.%5D%3B+for+if+God+punish+covenant+breaking%2C+so+also+should+the+church%2C+and+can+by+no+indulgence+be+accessory+to+the+breach+of+God%E2%80%99s+oath%3B+there+is+too+great+a+smell+of+Popery%2C+Arminianism%2C+and+Socinianism+in+this+way+in+my+weak+judgement.+But+if+the+man+be+not+sworn+a+member+of+that+particular+church+by+his+oath%2C+he+is+sworn+a+member+of+the+visible+Church+universal%2C+which+our+brethren+cannot+well+say.+Neither+is+any+covenant+called+an+everlasting+covenant+in+the+Scripture+but+the+Covenant+of+Grace%2C+Jer.+31%3A33%3B+32%3A40%3B+Isa.+54%3A9-10%2C+and+that+is+made+with+the+invisible+catholic+Church+of+believers%2C+as+is+the+Covenant+%5Bin%5D+Jer.+50%3A5%2C+and+not+a+Covenant+with+one+visible+congregation%3B+and+what+warrant+has+the+Church+to+dispense+with+the+breach+of+such+an+everlasting+Covenant%3F+5.+The+testimony+of+other+churches%2C+if+it+be+a+warrant+to+you%2C+in+faith%2C+to+receive+into+the+church+such+a+one+as+a+saint+and+a+temple+of+the+Holy+Spirit%2C+how+should+it+not+also+be+a+warrant+to+you+to+cast+out+and+excommunicate+also%3F+6.+The+person+coming+from+another+Church%2C+if+of+approven+piety%2C+is+received%2C+by+lifting+up+of+the+hands%2C+or+silence+of+the+church%2C+as+you+say%3A+1.+Have+we+a+warrant+from+God%E2%80%99s+Word+for+such+a+new+inchurching%3F+2.+Why+is+he+not+received+by+a+church+oath%3F+as+a+minister+transplanted+to+another+church+must+have+ordination+and+election+of+new+%5Baccording+to+congregationalists%5D%2C+for+to+you+there+is+alike+reason.+3.+If+there+be+no+need+of+a+new+church+oath+to+make+him+a+member+of+that+visible+congregation%2C+seeing+now+he+is+loosed+from+the+former%2C+you+insinuate+his+former+church-oath+did+make+him+a+member+of+a+visible+church%2C+and+so+he+that+is+a+visible+member+in+a+church%2C+is+a+visible+member+of+all%2C+and+so+there+must+be+a+visible+Church-catholic%2C+if+there+be+a+catholic+visible+membership+in+any+one+member%2C+and+so+you+destroy+what+you+build.%E2%80%9D%0A%0A%E2%80%94+Samuel+Rutherford%2C+The+Due+Right+of+Presbyteries%E2%80%A6+%28London%2C+1644%29%2C+pt.+2%2C+ch.+6%2C+section+1%2C+pp.+328-30&amp;url=https%3A%2F%2F5solasquotes.github.io%2Fquote%2F39a12a85b5.html&amp;via=5Solas" target="_blank" rel="noopener">Share on X</a><a class="perma" href="../quote/39a12a85b5.html">Permalink</a><a class="src" href="https://reformedbooksonline.com/on-leaving-a-congregation/#:~:text=We%20see%20not%20how%20letters%20of,so%20you%20destroy%20what%20you%20build&amp;text=We%20see%20not%20how%20letters%20of%20recommendation%2C%20most&amp;text=member%2C%20and%20so%20you%20destroy%20what%20you%20build" rel="noopener" target="_blank">Read it online · Reformed Books Online</a></div>

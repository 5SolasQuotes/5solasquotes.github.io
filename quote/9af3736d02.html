<main class="wrap"><figure class="quote" id="q-9af3736d02" data-kw="">
<blockquote><p>Let no one deceive you by any means; for that Day will not come unless the falling away comes first, and the man of sin is revealed, the son of perdition (2 Thessalonians 2:3)

5. This apostasy from our Lord’s authority and the interests of his kingdom is some notable and discernible apostasy, and the head patron thereof is Antichrist. The defection is not of one, or a few, or many in divers churches; there have always been backsliders from the faith: 1 John ii. 19, ‘They went out from us, but they were not of us;’ and the spirit of Antichrist wrought in the apostles’ days: 1 John ii. 18, ‘As you have heard that Antichrist shall come, even now there are many Antichrists;’ and again, 1 John iv. 3, we are told of the spirit of Antichrist: ‘And this is that spirit of Antichrist, whereof you have heard that it should come, and even now already is it in the world;’ then described to be afterwards (ver. 5) a worldly spirit: ‘They are of the world, and speak of the world, and the world heareth them.’

Though they profess Christianity, carnal, worldly hypocrites, which never conquered the fleshly mind and interest, have the spirit of Antichrist; these obscure the light, and obstruct the life and love of the gospel — they that wholly affect a life of pomp and ease in the church. Now, this hath always been in all the ages. The false Christians forget their hopes are built upon a crucified Christ, and are to be derived to them from a glorified Christ in the other world — crucified in this world and glorified in the next, — which indeed are the two considerations that keep Christianity pure and lively; that all was purchased by a crucified Christ, and all is dispensed by a glorified Christ; and I wish you would oftener think of it.

But the great apostasy is eminently found in some external visible church, where these corruptions are generally received and defended. For the head of that church is Antichrist, where doctrine is corrupted, and the worship mingled with idolatry, and the government a usurpation, and bent against the holy seed that desire to worship God in spirit and in truth; there is this manifest revolt from and rebellion against God and Christ, though they push with the horns of the lamb.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/thomas-manton.html">Thomas Manton</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Eighteen sermons on the second chapter of the second epistle to the Thessalonians, containing the description, rise, growth, and fall of antichrist, with divers cautions and arguments to establish Christians against the apostasy of the Church of Rome</cite>, (1679) in The Complete Works of Thomas Manton, D.D. (22 vols, London, 1871), 3: 28-9.</span></figcaption>

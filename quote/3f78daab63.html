<main class="wrap"><figure class="quote" id="q-3f78daab63" data-kw="">
<blockquote><p>…all corruptions in God’s Church and worship are displeasing to God and distastful to his people embracing the simplicity of the Gospel; but all corruptions are not alike in operation, quality and extent, nor of a like influence on God’s Church and worship: Consider therefore, some corruptions are substantial and intrinsical, vitiating the very subject, and so universally spread through the worship of God, that it cannot be used without sin; others are circumstantial and extrinsical to the same, vain, needless appendants, superadded by man’s will, but which notwithstanding God’s ordinances remain entire and exactly his, and may be used without participation in the affixed corruption.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/zachary-crofton.html">Zachary Crofton</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Reformation, Not Separation, or, Mr. Crofton’s Plea for Communion with the Church… in a Letter, written July 20, 1661… (1662), p. 16 Crofton (1626-1672) was a presbyterian and puritan born and raised in Ireland.</cite></span></figcaption>
<div class="meta"><span class="t"><a href="../topics/worship/impurities-in-worship.html">Impurities in Worship</a></span></div>
<div class="actions"><button class="copy" data-copy="“…all corruptions in God’s Church and worship are displeasing to God and distastful to his people embracing the simplicity of the Gospel; but all corruptions are not alike in operation, quality and extent, nor of a like influence on God’s Church and worship: Consider therefore, some corruptions are substantial and intrinsical, vitiating the very subject, and so universally spread through the worship of God, that it cannot be used without sin; others are circumstantial and extrinsical to the same, vain, needless appendants, superadded by man’s will, but which notwithstanding God’s ordinances remain entire and exactly his, and may be used without participation in the affixed corruption.”

— Zachary Crofton, Reformation, Not Separation, or, Mr. Crofton’s Plea for Communion with the Church… in a Letter, written July 20, 1661… (1662), p. 16 Crofton (1626-1672) was a presbyterian and puritan born and raised in Ireland.">Copy</button><a class="share" href="https://x.com/intent/post?text=%E2%80%9C%E2%80%A6all+corruptions+in+God%E2%80%99s+Church+and+worship+are+displeasing+to+God+and+distastful+to+his+people+embracing+the+simplicity+of+the+Gospel%3B+but+all+corruptions+are+not+alike+in+operation%2C+quality+and+extent%2C+nor+of+a+like+influence+on+God%E2%80%99s+Church+and+worship%3A+Consider+therefore%2C+some+corruptions+are+substantial+and+intrinsical%2C+vitiating+the+very+subject%2C+and+so+universally+spread+through+the+worship+of+God%2C+that+it+cannot+be+used+without+sin%3B+others+are+circumstantial+and+extrinsical+to+the+same%2C+vain%2C+needless+appendants%2C+superadded+by+man%E2%80%99s+will%2C+but+which+notwithstanding+God%E2%80%99s+ordinances+remain+entire+and+exactly+his%2C+and+may+be+used+without+participation+in+the+affixed+corruption.%E2%80%9D%0A%0A%E2%80%94+Zachary+Crofton%2C+Reformation%2C+Not+Separation%2C+or%2C+Mr.+Crofton%E2%80%99s+Plea+for+Communion+with+the+Church%E2%80%A6+in+a+Letter%2C+written+July+20%2C+1661%E2%80%A6+%281662%29%2C+p.+16+Crofton+%281626-1672%29+was+a+presbyterian+and+puritan+born+and+raised+in+Ireland.&amp;url=https%3A%2F%2F5solasquotes.github.io%2Fquote%2F3f78daab63.html&amp;via=5Solas" target="_blank" rel="noopener">Share on X</a><a class="perma" href="../quote/3f78daab63.html">Permalink</a><a class="src" href="https://reformedbooksonline.com/on-impurities-in-worship/#:~:text=all%20corruptions%20in%20God%E2%80%99s%20Church%20and,without%20participation%20in%20the%20affixed%20corruption&amp;text=all%20corruptions%20in%20God%E2%80%99s%20Church%20and%20worship%20are&amp;text=be%20used%20without%20participation%20in%20the%20affixed%20corruption" rel="noopener" target="_blank">Read it online · Reformed Books Online</a></div>

</figure><figure class="quote" id="q-1ecbd54048" data-kw="">
<blockquote><p>But we desire to see your commandment why for every particular act, that in a large sense is idolatrous, adjoined to the true worship of God, we should forbear our presence at the worship itself, or be said to communicate in the sin there committed? For then no man might present himself with good conscience at any public worship of God where anything is done amiss, for matter or manner, which is in effect to say, he cannot be present at any at all. 4. To communicate in the ordinances of God with the ministers of the Church of England is not to like, approve or reverence the institutions of men in the exercises of religion, nor to communicate with the teacher in his sin, nor in ought else that is amiss. For the worship is of God both for matter and manner. … To eat of meats sacrificed unto idols in the idol temple is to communicate with idolaters. These things are evident and freely granted. But the assembly met to call upon God, in the mediation of Jesus Christ alone, to hear the doctrine of salvation,soundly and purely preached, to receive the sacrament rightly administered, is not a false idolatrous assembly: they that repair unto it be not idolatrous or false worshippers. If you esteem of them as they show themselves by outward signs, you must esteem them to be of the true religion, and the true worshippers of God according to his will; the ministry in that assembly to be true, sound and faithful and of God for substance.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/john-ball.html">John Ball</a></span><span class="wk"><span class="lbl">Work:</span> <cite>An Answer to Two Treatises of Mr. John Can, the Leader of the English Brownists in Amsterdam (1642)</cite>, pp. 105-6</span></figcaption>

<main class="wrap"><figure class="quote" id="q-5c87d81f26" data-kw="">
<blockquote><p>The catholic or universal visible Church is the assembly of all those which make profession of the Gospel of Jesus Christ throughout the whole world, distinguished (as we have said) into many particular Churches, all which do make but one body. Of all these particular, as members and parts of one and the self-same body, some are pure, other some are impure, some more, and some less sound, and some at this day are sick even unto death… Those that are of the purer and sounder Churches, we call them sound and true Churches, consenting to the true doctrine, which is the name, that for the most part, the ancient fathers have given them. The others we call the erring, heretical or schismatical Churches, according as they err, either in faith or in charity, against the square and right rule of Christ, or against the rule of his Church, either in the one or in the other, notwithstanding every one in his degree.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/philip-mornay.html">Philippe de Mornay</a></span><span class="wk"><span class="lbl">Work:</span> <cite>A Notable Treatise of the Church in which are handled all the Principal Questions that have been moved in our Time concerning that matter</cite>, [in controversy with Romanism] (London: Barker, 1579), ch. 2, n.p.</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/the-church/church-unity-and-fundamentals.html">Church Unity and Fundamentals</a></span></div>

</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-b8961fb64f" data-kw="">
<blockquote><p>Before the rise of Luther, the Albigenses and others acted rightly in making a negative separation (for they did not communicate with the idolatry of the Papists), although before condemnation, persecution, and expulsion, they did not make a positive separation by forming another new visible Church. Where there are some fundamental errors in the Church, it is not immediately permissible to make a positive separation. Christ commanded to hear those who sit in Moses’ seat [Mt. 23:1-3], although they taught some things that overturned the foundation and rejected Christ. Nor does separation from an Orthodox Church due to some errors within it separate from Christ; for only separation from Orthodox faith separates from Christ, which opposes internal communion with Christ and the Church. But external separation alone is not internal separation; indeed, he who is thus separated retains internal communion with the Church in Orthodox faith, and therefore with Christ. We deem weak and feeble the argument of the Remonstrants [Arminians], who refuse to separate from Arians, Socinians, Anti-Trinitarians, Anabaptists, for they do not dare to consign all such to hell or ban them from heaven; as though it were not the Word of God, but our judgment concerning the salvation and damnation of men, that is the rule of our communion with the Church! If, however, we are compelled, in external communion, to communicate with errors,¹ even non-fundamental ones, in a Church not erring in fundamentals, then it is permissible to make a partial separation, not a total one; a negative, not a positive one.² The reason is that it is never lawful to communicate with the unfruitful works of darkness: Eph. 5:11. ¹ [Note this phrase is ambiguous. It may mean being present amidst secondary errors, or being compelled to personally sin.] ² [Yet denominationalism, “by forming another new visible Church,” is a positive separation.] … the Papists do not possess true faith; they err in the fundamental truths. They do not have the Holy Scripture with us as the sufficient canon of faith and morals… They nullify the mediatorial office of Christ by adding other mediators and saviors to Him. They deny the satisfaction of Christ, provided by His bloody death and the obedience rendered on our behalf, as they attempt to satisfy God for sins by themselves and others… Thus, there can be no union in faith with them, for they subvert that faith.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/samuel-rutherford.html">Samuel Rutherford</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Examination of Arminianism</cite>, tr. by AI (1639-1642; 1668; Monergism, 2024), ch. 1, ‘Of the Holy Scripture’, pp. 83-85</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/the-church/church-unity-and-fundamentals.html">Church Unity and Fundamentals</a></span></div>

</figure><figure class="quote" id="q-3a56eab2b9" data-kw="">
<blockquote><p>…the controversy of our ceremonies; the sparkles of which difference have grown unto great flames in this our [Anglican] Church. Where the fault is, as God knows, so the day will try and God will one day judge. But difference of apprehensions has brought forth difference of judgments, and difference of judgments has brought forth difference of practice and disagreement in affection. The difference of practice has moved [civil / Church] Authority to silence and suppress refusers of conformity: The disagreement in affection, has moved the ministers deprived to speak evil of persons in authority and of conformers: Whereby in the event, the course of the Gospel is interrupted, and [the course] of Popery enlarged; the friends of Sion are grieved, the enemies reioiced, the Devil gratified, and God not pleased. The Church is rent with schism, the truth scandalized by dissention, and the ministers undone by loss of living, and the unity of brethren living in the same house, professing the same Faith, and rejoicing in the same hope, is pulled in pieces: And this [is] like[ly] to continue God knows how long; but all men know: the longer the worse.</p></blockquote>

<blockquote><p>But you will say: ‘England is not a true Church, and therefore you separate; adhere to the true Church.’ I answer: Our Church is easily proved to be a true Church of Christ: First, because it has all the essentials necessary to the constitution of a true Church: as sound preaching of the gospel, right dispensation of the sacraments, prayer religiously performed, and evil persons justly punished (though not in that measure as some criminals and malefactors deserve); and therefore a true Church. … But I hear you reply: ‘Our Church is corrupted with ceremonies and pestered with profane persons. What then?’ Must we therefore separate for ceremonies, which many think may be lawfully used? But admit they be evils, must we make a rent in the Church for ceremonious rites, for circumstantial evils? That were a remedy worse than the disease. Besides, had not all the true Churches of Christ their blemishes and deformities, as you may see in the seven Asian Churches (Rev. 2–3)? And though you may find some Churches beyond sea free from ceremonies, yet notwithstanding they are more corrupt in preachers (which is the main), as in profanation of the Lord’s Day, etc.</p></blockquote>

<div class="actions"><button class="copy" data-copy="“But you will say: ‘England is not a true Church, and therefore you separate; adhere to the true Church.’ I answer: Our Church is easily proved to be a true Church of Christ: First, because it has all the essentials necessary to the constitution of a true Church: as sound preaching of the gospel, right dispensation of the sacraments, prayer religiously performed, and evil persons justly punished (though not in that measure as some criminals and malefactors deserve); and therefore a true Church. … But I hear you reply: ‘Our Church is corrupted with ceremonies and pestered with profane persons. What then?’ Must we therefore separate for ceremonies, which many think may be lawfully used? But admit they be evils, must we make a rent in the Church for ceremonious rites, for circumstantial evils? That were a remedy worse than the disease. Besides, had not all the true Churches of Christ their blemishes and deformities, as you may see in the seven Asian Churches (Rev. 2–3)? And though you may find some Churches beyond sea free from ceremonies, yet notwithstanding they are more corrupt in preachers (which is the main), as in profanation of the Lord’s Day, etc.”

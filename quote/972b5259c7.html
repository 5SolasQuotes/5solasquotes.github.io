<main class="wrap"><figure class="quote" id="q-972b5259c7" data-kw="Mary|Queen of Heaven|Submission">
<blockquote><p>This phrase, Behold the handmaid of the Lord, doth not speak her the lady and queen of heaven, (as the papists style her), but it speaketh her humility and readiness to give up herself to the Lord&#x27;s pleasure, her assent and consent unto God.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/matthew-poole.html">Matthew Poole</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Annotations upon the Holy Bible</cite>, Luke 1:38</span></figcaption>

— Matthew Poole, Annotations upon the Holy Bible, Luke 1:38">Copy</button><a class="share" href="https://x.com/intent/post?text=%E2%80%9CThis+phrase%2C+Behold+the+handmaid+of+the+Lord%2C+doth+not+speak+her+the+lady+and+queen+of+heaven%2C+%28as+the+papists+style+her%29%2C+but+it+speaketh+her+humility+and+readiness+to+give+up+herself+to+the+Lord%27s+pleasure%2C+her+assent+and+consent+unto+God.%E2%80%9D%0A%0A%E2%80%94+Matthew+Poole%2C+Annotations+upon+the+Holy+Bible%2C+Luke+1%3A38&amp;url=https%3A%2F%2F5solasquotes.github.io%2Fquote%2F972b5259c7.html&amp;via=5Solas" target="_blank" rel="noopener">Share on X</a><a class="perma" href="../quote/972b5259c7.html">Permalink</a><a class="src" href="https://archive.org/search?query=title%3A%28annotations+upon+the+holy+bible%29+AND+creator%3A%28poole%29" rel="noopener" target="_blank">Read it online · Internet Archive (early editions)</a></div>
</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-2cfa4393d8" data-kw="Mary|Queen of Heaven|Satan|Grace">
<blockquote><p>Hence we see how widely the Papists differ from her, who idly adorn her with their empty devices, and reckon almost as nothing the benefits which she received from God. They heap up an abundance of magnificent and very presumptuous titles, such as, &quot;Queen of Heaven, Star of Salvation, Gate of Life, Sweetness, Hope, and Salvation.&quot; Nay more, to such a pitch of insolence and fury have they been hurried by Satan, that they give her authority over Christ; for this is their pretty song, &quot;Beseech the Father, Order the Son.&quot; None of these modes of expression, it is evident, proceeded from the Lord. All are disclaimed by the holy virgin in a single word, when she makes her whole glory to consist in acts of the divine kindness. If it was her duty to praise the name of God alone, who had done to her wonderful things, no room is left for the pretended titles, which come from another quarter.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/john-calvin.html">John Calvin</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Commentary on a Harmony of the Evangelists</cite>, Luke 1:48-49</span></figcaption>

</figure><figure class="quote" id="q-e3bb62268e" data-kw="Mary|Queen of Heaven">
<blockquote><p>She was called the Queen of heaven, Queen of queens, said to be exalted above all principalities and powers; to be seated at the right hand of Christ, to share with Him in the universal and absolute power committed to his hands. All the blessings of salvation were sought at her hands, as well as protection from all enemies, and deliverance from all evils.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/charles-hodge.html">Charles Hodge</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Systematic Theology</cite>, vol. 3 (Mariolatry)</span></figcaption>

</figure><figure class="quote" id="q-5b36801b03" data-kw="Mary Queen of Heaven">
<blockquote><p>And in fact it contradicts the nature of deceased saints that they should be present in and care for diverse and widely scattered places at one and the same time, as when the [papal teachers] want to put one and the same saint in charge of diverse and widely scattered places. Think of Saint James for the Spanish, who dwell in Europe, India, and America. Or Saints Dominic and Francis, etc., for all their monasteries spread across the whole globe. Or even the blessed Virgin, whom they call Queen of Heaven, Mistress of the Earth, and Star of the Sea (Stella Maris)—even though this is a wrong rendering of Drop of the Sea (Stilla maris)—since it is fitting only for God to “look down from the heavens and behold all the sons of men, and from his dwelling-place to look forth upon all the inhabitants of the earth” (Psalm 33:13–14).</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/antonius-walaeus.html">Antonius Walaeus</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Synopsis of a Purer Theology</cite>, Disp. 40, On the Church (vol. 2)</span></figcaption>

</figure><figure class="quote" id="q-6efcea5a25" data-kw="Mary|Queen of Heaven|Idolatry|Paganism">

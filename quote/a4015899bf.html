<main class="wrap"><figure class="quote" id="q-a4015899bf" data-kw="">
<blockquote><p>61. And because regeneration in this life is imperfect, it cannot perfectly and completely fulfill God’s Law (Rom. 7). So much for the powers of human choice in this life; what remains concerns its powers after this life.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/amandus-polanus.html">Amandus Polanus</a></span><span class="wk"><span class="lbl">Work:</span> <cite>‘Theological Theses on the Choice of Man’, pt. 2</cite>, (Basel: Waldkirchius, 1597) trans. at Obedientia Mortis Christi Latin</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/regeneration/nature-of-regeneration.html">Nature of Regeneration</a></span></div>

</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-dc72ea4a29" data-kw="">
<blockquote><p>2. Faith makes us children, as it is the vital principle. Hab. 2:4, ‘The just shall live by faith.’ All God’s children are living, none of them are still-born; now by faith we live. As the heart is the primum vivens, the fountain of life in the body, so faith is the fountain of life in the soul.

3. Faith makes us children, as it is the uniting grace; it knits us to Christ; the other graces cannot do this; by faith we are one with Christ, and so we are akin to God; being united to the Natural Son, we become adopted sons: The kindred comes in by faith: God is the Father of Christ; faith makes us Christ’s brethren (Heb. 2:11), and so God comes to be our Father.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/thomas-watson.html">Thomas Watson</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Beatitudes</cite>, … (London: Smith, 1660), ch. 19, sect. 3, p. 298</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/regeneration/nature-of-regeneration.html">Nature of Regeneration</a></span></div>
<div class="actions"><button class="copy" data-copy="“2. Faith makes us children, as it is the vital principle. Hab. 2:4, ‘The just shall live by faith.’ All God’s children are living, none of them are still-born; now by faith we live. As the heart is the primum vivens, the fountain of life in the body, so faith is the fountain of life in the soul.

3. Faith makes us children, as it is the uniting grace; it knits us to Christ; the other graces cannot do this; by faith we are one with Christ, and so we are akin to God; being united to the Natural Son, we become adopted sons: The kindred comes in by faith: God is the Father of Christ; faith makes us Christ’s brethren (Heb. 2:11), and so God comes to be our Father.”

</figure><figure class="quote" id="q-38df08e676" data-kw="">
<blockquote><p>III. Problem: Whether man’s intellect and will concur to regeneration? Response: Negatively, if you understand active concourse as of a cause, so that synergy is attributed to them; but if you understand concourse as of a subject, it is granted: for it conducts itself purely passively in the first moment.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/gisbertus-voetius.html">Gisbertus Voetius</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Disputation 29, ‘On Regeneration’, pt. 1</cite>, (1639) tr. AI by Roman Prestarri in Select Theological Disputations (1655), vol. 2, pp. 432-65 Latin at Confessionally Reformed Theology</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/regeneration/nature-of-regeneration.html">Nature of Regeneration</a></span></div>

</figure><figure class="quote" id="q-e5fd1f2691" data-kw="">
<blockquote><p>§IV. It [sanctification] is distinguished from regeneration. For regeneration, strictly taken, signifies the beginning of the spiritual life; but sanctification, the progress and continuation of the spiritual life, made through the habits of the spiritual virtues, by which the faithful are gradually led to perfection, although many take regeneration in a broader sense as a synonym for sanctification.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/barthold-holtzfus.html">Barthold Holtzfus</a></span><span class="wk"><span class="lbl">Work:</span> <cite>‘Theological Dissertation on Creation’</cite>, trans. AI (Frankfurt: Zeitler, 1709), p. 2 Holtzfus (1659-1717) was a German, reformed professor of philosophy and theology at Frankfurt.</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/regeneration/nature-of-regeneration.html">Nature of Regeneration</a></span></div>

<main class="wrap"><figure class="quote" id="q-71b3abd7f2" data-kw="">
<blockquote><p>…the Scholastic view (which… committed as it is to an Aristotelian understanding of causation on which the connection between the mind and the world is not especially problematic)… Thus was invented [by the mechanical philosophy in the mid-1600’s with Descartes and others] the famous ‘mind-body problem&#x27;” It seems that mind cannot possibly be reduced to matter; and yet it also seems that the mind could not possibly interact with the material world in the way it does if it was not itself material. How to resolve the paradox? That’s the problem. It has appeared to some philosophers to be unsolvable; and it is unsolvable if one clings pathologically (as contemporary philosophers do) to the mechanistic assumptions that created the problem in the first place. The only way to solve it is to return to the Aristotelian-Thomistic conception of the soul as the form of the body, having certain immaterial operations but nevertheless ‘interacting’ with the material world as a formal rather than an efficient cause.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/edward-feser.html">Edward Feser</a></span><span class="wk"><span class="lbl">Work:</span> <cite>‘Inventing the Mind-Body Problem’ in The Last Superstition: a Refutation of the New Atheism</cite>, (South Bend, Indiana: St. Augustine’s Press, 2008), pp. 184-99, pp. 198-99</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/theology/faith-and-reason.html">Faith and Reason</a></span></div>

</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-badf2ca8b8" data-kw="">
<blockquote><p>Spiritual substance is distinguished from matter by the characteristic of self-motion, or motion ab intra [from inside]. Matter must be moved from without, by another material substance impinging upon it. But mind moves from within. Its motion is not from external impact, but is self-motion. Adam was created a spirit. The instant, therefore, that he was created, he had all the characteristics that distinguish spirit from matter. One of these, and one of the most important, is self-motion. But self-motion is self-determination, and self-determination is inclination. The Scripture asserts that Adam was created a ‘living soul.’ Life implies motion; and the motion in this case was not mechanical or material, but the motion of mind. Thus in creating a rational spirit, God creates a self-moving essence, and this is a self-determining will.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/william-g-t-shedd.html">William G.T. Shedd</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Dogmatic Theology</cite>, (NY: Charles Scribner’s Sons, 1888), vol. 2, ch. 2, ‘Man’s Primitive State’, p. 100</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/theology/faith-and-reason.html">Faith and Reason</a></span></div>

</figure><figure class="quote" id="q-5075e29480" data-kw="">
<blockquote><p>‘But’ says he [Hussey, an Erastian], ‘may they not worship Christ as Mediator? Yes, doubtless they may.’ [Gillespie’s response:] No doubt He that is Mediator must be worshipped, because He is God; Christ God-man is the object of divine adoration, and his God-head is the cause of that adoration; but whether He is to be worshipped because He is Mediator, or under this formal consideration as Mediator; and whether the Mediator ought to be therefore adored with divine adoration, because He is Mediator, is res altioris indaginis [a thing for deeper investigation]. If Mr. Hussey please to read and consider what diverse Schoolmen have said upon that point, as: Aquinas, [Summa] third part, quest. 25, art. 1 &amp; 2; Alex. Alensis, Sum. Theol., part 3, quest. 30, member 2; Suarez in the third part of Thomas, disp. 53, sect. 1; Valentia, Comment on Thomas, tome 4, disp. 1, quest. 24, point 1; Tannerus, Scholastic Theology, tome 4, disp. 1, quest. 7, doubt 7. But much more if he please to read Disputatio de adoratione Christi, habita inter Faustum Socinum &amp; Christianum Francken: and above all Dr. Voetius, Select Disputations, pt. 2, disp. 14, Whether Christ is to be Adored as Mediator? Then I believe he will be more wary and cautious what he holds concerning that question.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/george-gillespie.html">George Gillespie</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Aaron’s Rod Blossoming</cite>, … (London: 1646), bk. 2, ch. 6, p. 230</span></figcaption>

</figure><figure class="quote" id="q-50f44e86d0" data-kw="">
<blockquote><p>But for what reason, then, is eternal punishment due to it? You respond, by the condition of man, who is found without grace; and that this is the doctrine of St. Thomas (Stapleton, Of Original Sin, bk. 1, ch. 1, disp. 1, q. 5). Whatever this may be, it is surely most absurd: that man is punished not because he is stained by original sin, but because he lacks the grace which ought to have been present. Is it thus graver and more repugnant to original justice to lack grace than to be stained with a fault? But this very lack of justice, if it could be separated from stains, would be much lighter than to be stained with sins; for it could happen that someone is held to be unjust, as Pighius thought, on account of a plainly alien offense, of which he himself was never an associate. Then, a stain brings a deformity worthy of hatred and punishment; to lack justice indeed removes a habit, but does not posit the contrary. But Scripture, on the contrary, teaches that nothing but uncleanness and abomination delays entry into heaven (Apoc. 21:27). But from these things it is now sufficiently clear how this error about the punishment of original sin is not undeservedly or falsely imposed upon you. For first you teach that no punishment of sense, neither exterior nor interior, is due to this sin (Thomas, in 2, dist. 33, q. 2, art. 2). For there is a certain eternal punishment, if we believe you, without the sense of pain, and with this original sin, if it is alone, is punished: a mild punishment, I believe, which inflicts no pain either without or within. What is this other than to take away all punishment?</p></blockquote>

<blockquote><p>A distinction is real (simply real) if it exists between thing and thing, for example between body and soul, between the members of the body, between cause and effect, between a faculty and its operation, between substance and accidents. A thing, at least according to Scotists, is whatever exists or can exist per se (i.e. through its own existence), and hence, if it is created, it can be directly and immediately produced by physical causality. The sign of a real distinction is separability or actual separation. Thomists, on the contrary, deny that separability is required for having a real distinction. So they say, for example, that faculties are really distinct from the soul though they cannot be separated from it. One must say the like of their real distinction between essence and existence.</p></blockquote>

<div class="meta"><span class="t"><a href="../topics/theology/faith-and-reason.html">Faith and Reason</a></span></div>
<div class="actions"><button class="copy" data-copy="“A distinction is real (simply real) if it exists between thing and thing, for example between body and soul, between the members of the body, between cause and effect, between a faculty and its operation, between substance and accidents. A thing, at least according to Scotists, is whatever exists or can exist per se (i.e. through its own existence), and hence, if it is created, it can be directly and immediately produced by physical causality. The sign of a real distinction is separability or actual separation. Thomists, on the contrary, deny that separability is required for having a real distinction. So they say, for example, that faculties are really distinct from the soul though they cannot be separated from it. One must say the like of their real distinction between essence and existence.”

— Alan B. Wolter, Little Summary of Metaphysics (Milwaukee: Bruce Publishing Co., 1958), ch. 2, On the Attributes in General &amp; on ‘One”, Article 4, ‘On Identity &amp; Distinction’, p. 30">Copy</button><a class="share" href="https://x.com/intent/post?text=%E2%80%9CA+distinction+is+real+%28simply+real%29+if+it+exists+between+thing+and+thing%2C+for+example+between+body+and+soul%2C+between+the+members+of+the+body%2C+between+cause+and+effect%2C+between+a+faculty+and+its+operation%2C+between+substance+and+accidents.+A+thing%2C+at+least+according+to+Scotists%2C+is+whatever+exists+or+can+exist+per+se+%28i.e.+through+its+own+existence%29%2C+and+hence%2C+if+it+is+created%2C+it+can+be+directly+and+immediately+produced+by+physical+causality.+The+sign+of+a+real+distinction+is+separability+or+actual+separation.+Thomists%2C+on+the+contrary%2C+deny+that+separability+is+required+for+having+a+real+distinction.+So+they+say%2C+for+example%2C+that+faculties+are+really+distinct+from+the+soul+though+they+cannot+be+separated+from+it.+One+must+say+the+like+of+their+real+distinction+between+essence+and+existence.%E2%80%9D%0A%0A%E2%80%94+Alan+B.+Wolter%2C+Little+Summary+of+Metaphysics+%28Milwaukee%3A+Bruce+Publishing+Co.%2C+1958%29%2C+ch.+2%2C+On+the+Attributes+in+General+%26+on+%E2%80%98One%E2%80%9D%2C+Article+4%2C+%E2%80%98On+Identity+%26+Distinction%E2%80%99%2C+p.+30&amp;url=https%3A%2F%2F5solasquotes.github.io%2Fquote%2Fdc78cdef29.html&amp;via=5Solas" target="_blank" rel="noopener">Share on X</a><a class="perma" href="../quote/dc78cdef29.html">Permalink</a><a class="src" href="https://reformedbooksonline.com/on-particular-metaphysical-issues/#:~:text=A%20distinction%20is%20real%20%28simply%20real,real%20distinction%20between%20essence%20and%20existence&amp;text=A%20distinction%20is%20real%20%28simply%20real%29%20if%20it&amp;text=of%20their%20real%20distinction%20between%20essence%20and%20existence" rel="noopener" target="_blank">Read it online · Reformed Books Online</a></div>

<main class="wrap"><figure class="quote" id="q-f79dd39548" data-kw="">
<blockquote><p>The moral law is the declaration of the will of God to mankind, directing and binding every one to personal, perfect, and perpetual conformity and obedience thereunto, in the frame and disposition of the whole man, soul and body, and in performance of all those duties of holiness and righteousness which he oweth to God and man…</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/westminster-directory-of-public-worship.html">Westminster Directory of Public Worship</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The principle in the Directory for taking ‘all means’ for rightly observing the Supper is Scriptural and puritan. Whatever God commands, we ought to do it personally, fully and spiritually, with all of our heart, soul and strength</cite>, The principle in the Directory for taking ‘all means’ for rightly observing the Supper is Scriptural and puritan. Whatever God commands, we ought to do it personally, fully and spiritually, with all of our heart, soul and strength (as Jesus said, Mk. 12:30. Or, as the Larger Catechism states it in #93:</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/the-lords-supper/preparation-celebration-reflection.html">Preparation, Celebration, Reflection</a></span></div>
<div class="actions"><button class="copy" data-copy="“The moral law is the declaration of the will of God to mankind, directing and binding every one to personal, perfect, and perpetual conformity and obedience thereunto, in the frame and disposition of the whole man, soul and body, and in performance of all those duties of holiness and righteousness which he oweth to God and man…”

</figure><figure class="quote" id="q-0aad91c5a6" data-kw="">
<blockquote><p>For the manner of their [Independents’] celebration, they who have seen it profess it to be in a very dead and comfortless way: it is not as in New England, once in the month, but as at Amsterdam, once every Lord’s Day, which makes the action much less solemn than in any other of the Reformed Churches, and in this too much like the daily masses of the Church of Rome. They have no preparation of their flock before: they are so happy as to have all their members prepared always sufficiently for the Lord’s Table, from their first entrance into their Church to their dying day; for all this time there is no catechizing among them; this exercise is below their condition and altogether needless in any of their congregations. They will have no sermon in the week before, nor so much as any warning [fore-notice] of the Communion. This practice of New England, to give warning the Sabbath before, is disliked now at London: nor must there be any sermon of thanksgiving after that sacrament: They use not so much as a little application of the doctrine in the sermon before it to that occasion. When they come to the action, there is no more but one little discourse and one short prayer of the minister; all the time of the participation, there is nothing in the congregation but a dumb silence: no reading, no exhortation, no psalms; their people need no such means to furnish them in their sacramental meditations;</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/robert-baillie.html">Robert Baillie</a></span><span class="wk"><span class="lbl">Work:</span> <cite>A Dissuasive from the Errors of the Time, wherein the Tenets of the Principal Sects, Especially of the Independents, are Drawn Together in One Map</cite>, (1645), ch. 6, p. 121</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/the-lords-supper/preparation-celebration-reflection.html">Preparation, Celebration, Reflection</a></span></div>

</figure><figure class="quote" id="q-820b3cb529" data-kw="">
<blockquote><p>Do they [our divines] not teach… That the negative precepts of the Law do bind, not only at all times, but likewise to all times, (whereupon it follows that we may never do that which is inconvenient or scandalous), and that the affirmative precepts though they bind at all times, yet not to all times, but only quando expedit [when it is expedient] (whereupon it follows that we are never bound to the practice of any duty commanded in the Law of God except only when it is expedient to be done)? …forasmuch as to abstain from things scandalous and inconvenient is one of the negative precepts of the Law of God… it follows that the use and practice of the same is altogether unlawful unto us.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/george-gillespie.html">George Gillespie</a></span><span class="wk"><span class="lbl">Work:</span> <cite>English Popish Ceremonies</cite>, pt. 2, ch. 1, ‘Against Some of our Opposites who aknowledge the inconveniency of the Ceremonies &amp; yet would have us yield to them’ in English Popish Ceremonies (1637), pp. 1-13, p. 9</span></figcaption>

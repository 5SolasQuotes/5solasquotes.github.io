<main class="wrap"><figure class="quote" id="q-843a56be0d" data-kw="">
<blockquote><p>The great, primary, responsible leader of all worship in the Church is our blessed Lord Himself – the minister of the true sanctuary which the Lord pitched, and not man. In this capacity He is pleased to say in the 22nd Psalm – and it is quoted in the New Testament too – “I will declare thy name unto my brethren; in the midst of the church will I sing praise unto thee.” On this verse Calvin has this beautiful comment:– “It thus appears that our Lord is the leader of our songs and chief composer of our hymns.” Are they uninspired hymns which Christ composes, and leads us in singing in the great congregation? He is spiritually present with His people in their worship in the sanctuary.

But were He bodily present, as in the synagogue of Nazareth, when there was given to Him the book of the prophet Isaiah, would you give Him any other book of song than the book of the Psalms of David, or other inspired songs of Scripture? Would you give Him other than His own Psalms to lead you in singing? – His own Psalms, in that they are composed by Himself; and His own Psalms, in that His soul sang them, with grace in His heart unto the Lord, in the days of His flesh. You maintain communion with Him, and He with you, when, in the praises of the sanctuary, you sing His Psalms.

You may think your hymns are in accordance with His Word, but the Psalms are His very Word itself. You can sing them in faith untainted with doubt, in the full assurance of faith, unshackled from the spirit of criticism which man’s word continually provokes, yea, demands – in that faith which cometh by hearing, when the hearing is the hearing of the Word of God, and which goeth forth in songs of faith, when the songs are the songs of the Spirit of God.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/hugh-martin.html">Hugh Martin</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Psalms and Uninspired Hymns. Extracts from Speech by Dr. Hugh Martin, in the General Assembly of the Free Church, 3rd June, 1872 in Free Presbyterian Magazine</cite></span></figcaption>

</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-f9c7f70eeb" data-kw="">
<blockquote><p>They [older non-conformists] argue that there is no necessity for [total] Separation for the sake of such corruptions, because a person may communicate in the worship without partaking in those corruptions…

1. This separation of the good from the bad in divine worship they grant possible. So Mr. [John] Ball: ‘If some things human be mixed with divine, a sound Christian must separate the one from the other, and not cast away what is of God as a nullity, fruitless, unprofitable, defiled, because somewhat of men is annexed unto them. In the body we can distinguish betwixt the substance and the sickness which cleaves unto it; betwixt the substance of a part or member, and some bunch or swelling, which is a deformity, but destroys not the nature of that part or member, etc.’ (Trial of the Grounds, etc., [ch. 13,] p. 308) …

2. They grant that what is faulty and a sin in worship, is no sin to us when we do not consent to it. So Mr. [John] Corbet: ‘My partaking in any divine worship, which is holy and good for the matter and allowable or passable in the mode for the main, does not involve me in the blame of some sinful defects therein, to which I consent not and which I cannot redress.’ (Non-Conformists Plea, etc., p. 6) So another [John Barret], in his Farewell Sermon: ‘While all necessary fundamental truth is publicly professed and maintained in a Church, is taught and held forth in public assemblies and the corruptions there (though great, yet) are not such as make the worship cease to be God’s worship, nor of necessity to be swallowed down if one would communicate in that worship, while any Christian (that is watchful over his own heart and carriage, as all ought ever to be) may partake in the one, without being active in, or approving the other; there God is yet present, there he may be spiritually worshipped, served acceptably, and really enjoyed.’ (England‘s Remembrancer, sermon 4, p. 94)</p></blockquote>

</figure><figure class="quote" id="q-a95583f4ab" data-kw="">
<blockquote><p>A very little reflection may suffice to convince us of the advantages accruing to revelation from being cast in such a form — though at present we can do little more than glance at them. First of all, it humanises (if we may so speak) the communications of God to men — does to some extent for the revelations generally of His mind and will what was specially and pre-eminently done by the Incarnation. The divine word spoken from the invisible heights, from the secret place of Godhead, and the same word uttered from the midst of earthly transactions, linked to the susceptibilities and experience of human bosoms — though they might perfectly coincide in substance — yet in form how necessarily different! and in the one how much more than in the other fitted to touch the sympathies of men, and sound the depths of their hearts!

It is at bottom, a recognising and acting on the great truth, that man was made in the image of God, and that only by laying hold of what remains of this image, and sanctifying it for higher uses, can the Spirit of God effectually disclose divine things, and win for them a place in the soul; the rays of the eternal sun must reach it, not by direct effulgence, but “through the luminous atmosphere of created minds.” Then, think how well this plan accords with, and secures that fullness and variety which is necessary to Scripture as the book, which from its very design, was to provide the seed-corn of spiritual thought and instruction for all times — a book for the sanctification of humanity, and the developing in the soul of a higher life than that of nature.

An end like this could never have been served by some general announcements from Heaven, or even by the most orderly systematic exhibition of divine truth — though written as with a sunbeam from the Upper Sanctuary. No; there was needed just what we find in Scripture — from its partaking so largely of the historical element — a rich and various treasury of knowledge, ample materials for meditation and inquiry, resembling more the freedom and fullness of nature, than the formality and precision of art.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/patrick-fairbairn.html">Patrick Fairbairn</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Historical Character of Revelation, Particular in Method and Form, but Universal in Design and Application in Patrick Fairbairn et al., Divine Revelation Explained and Vindicated: A Course of Lectures for the Times, Delivered in Glasgow in the Spring of 1866</cite></span></figcaption>

<blockquote><p>There be so many other things that are a pouring out of the soul in prayer, as groaning, sighing, looking up to heaven, breathing, weeping, that it cannot be imagined how far short printed and read prayers comes of vehement praying; for you cannot put sighs, groans, tears, breathing, and such heart messengers down in a printed book, nor can paper and ink lay your heart in all its sweet affections out before God; the Service-book then must be toothless and spirit-less talk.</p></blockquote>

<blockquote><p>But he is not satisfied that in the Christian Assemblies, in the apostles’ times there were no manner of forms. Who says there were not? There was a form of sound doctrine (which the apostle tells us of), there were Psalms, Hymns, and spiritual Songs in forms, they are the three titles of David’s Psalms; we have nothing to do with any thing but forms of prayer, made by some particular ministers, or Church officers, to be used by all other ministers.</p></blockquote>

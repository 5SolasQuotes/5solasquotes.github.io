<blockquote><p>Objection II. Believers are governed by God’s Spirit, and therefore outward government by magistrates is needless. Answer. In the visible church, hypocrites are mingled with true believers, and they are not governed by God’s Spirit, but by the spirit of the devil. And therefore in respect of them, civil authority is requisite. Again, true believers are but in part governed by the Spirit for the time of this life. And for this cause, civil government is requisite for the ordering of the outward man and for the protection of the church.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/william-perkins.html">William Perkins</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Works of William Perkins: vol. 2: Commentary on Galatians</cite>, ed. Paul M. Smalley, Joel R. Beeke, and Derek W. H. Thomas, vol. 2 (Grand Rapids, MI: Reformation Heritage Books, 2015), 237.</span></figcaption>

<blockquote><p>§98. If you ask what did the ministers all this while, I answer: they preached and prayed against disloyalty. They drew up a writing to the Lord General declaring their abhorrence of all violence against the person of the king [Charles I], and urging him and his army to take heed of such an unlawful act. They present it to the General when they saw the king in danger: But Pride prevailed against their counsels. §99. The king being thus taken out of the way, Cromwell takes on him to be for a commonwealth (but all in order to the security of the good people) till he had removed the other impediments which were yet to be removed: so that the Rump [Parliament] presently drew up a form of Engagement, to be put upon all men, viz. ‘I do promise to be true and faithful to the commonwealth as it is now established without a king or House of Lords.’ So we must take the Rump for an established commonwealth and promise fidelity to them. This the sectarian party [of Independents and sects] swallowed easily, and so did the king’s old cavaliers, so far as I was acquainted with them or could hear of them (not heartily, no doubt, but there were very few of them sick of the disease called tenderness of conscience or scrupulosity: But the presbyterians and the moderate episcopal men refused it (and I believe so did the prelatical divines of the king’s party for the most part; though the gentlemen had greater necessities [to preserve by the Engagement]). Without this Engagement no man must have the benefit of suing another at law (which kept men a little from contention and would have marred the lawyers’ trade); nor must they have any masterships in the universities, nor travel above so many miles from their houses, and more such penalties, which I remember not (so short lived a commonwealth deserved no long remembrance): Mr. [Richard] Vines and Dr. Rainbow and many more were hereupon put out of their headships in the universities, and Mr. Sidrach Sympson, and Mr. John Sadler and such others put in; yea, such a man as Mr. Dell, the chaplain of the army, who, I think, neither understood himself nor was understood by others any farther than to be one who took reason, sound doctrine, order and concord to be the intolerable maladies of Church and State, because they were the greatest strangers to his mind. But poor Dr. Edward Reynolds had the hardest measure; for when he refused to take the Engagement, his place was forfeited; and afterwards they drew him to take it, in hopes to keep his place (which was no less than the deanery of Christ’s-Church) and then turned him out of all, and offered his place to Mr. Joseph Caryl; but he refusing it, it was conferred on Dr. [John] Owen, to whom it was continued from year to year. And because the presbyterians still urged the [Solemn League and] Covenant against killing the king, and pulling down the parliament, and setting up a commonwealth, and taking the Engagement, some of the Independent brethren maintained that its obligation ceased, because it was a league, and the occasion of it ceased: And some of the Rump said it was like an almanac out of date; and some of the soldiers said they never took it; and others of them railed at it as a Scottish snare: So that when their interest would not suffer them to keep so solemn a vow, their wills would not suffer their judgments to confess it to be obligatory, at least as to the part which they must violate. §100. For my own part, though I kept the town and parish of Kidderminster from taking the Covenant (and seeing how it might become a snare to their consciences) yea, and most of Worcestershire besides, by keeping the ministers from offering it in any of the congregations to the people (except in Worcester City, where I had no great interest and know not what they did); yet I could not judge it seemly for him that believed there is a God to play fast and loose with a dreadful oath, as if the bonds of national and personal vows were as easily shaked off as Sampson‘s cords. Therefore I spake and preached against the Engagement and dissuaded men from taking it. The first hour that I heard of it, being in company with some gentlemen of Worcestershire, I presently wrote down above twenty queries against it, intending as many more almost against the obligation as those were about the sense and circumstances. And one that was present got the copy of them, and shortly after I met with them verbatim in a book of Mr. Henry Hall‘s as his own (one that was long imprisoned for writing against Cromwell). Some episcopal divines that were not so scrupulous it seems as we, did write for it (private manuscripts which I have seen) and plead the irresistibility of the imposers, and they found starting holes in the terms, viz. that by “the commonwealth” they will mean the present commonwealth in genere, and by “established” they will mean only de facto and not de jure, and by “without a king, etc.” they mean not quatenus [as far as] but etsi [although], and that only de facto pro tempore [in point of fact for the time], quasi dicat [“as if to say”]: ‘I will be true to the government of England, though at the present the king and House of Lords are put out of the exercise of their power.’ These were the expositions of many episcopal men, and others that took it: But I endeavored to evince that this is mere juggling and jesting with matters too great to be jested with: And that as they might easily know that the imposers had another sense, so as easily might they know that the words in their own obvious usual sense among men must be taken as the promise or engagement of a subject as such to a form of government now pretended to be established: And that the subjects’ allegiance or fidelity to his rulers can be acknowledged and given in no plainer words: And that by such interpretations and stretchings of conscience, any treasonable oath or promise may be taken, and no bonds of society can signify much with such interpreters.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/richard-baxter.html">Richard Baxter</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Reliquiæ Baxterianæ: or, Mr. Richard Baxter’s Narrative of the most Memorable Passages of his Life &amp; Times</cite>, (London: Parkhurst, 1696), pp. 64-65</span></figcaption>

esides%2C+by+keeping+the+ministers+from+offering+it+in+any+of+the+congregations+to+the+people+%28except+in+Worcester+City%2C+where+I+had+no+great+interest+and+know+not+what+they+did%29%3B+yet+I+could+not+judge+it+seemly+for+him+that+believed+there+is+a+God+to+play+fast+and+loose+with+a+dreadful+oath%2C+as+if+the+bonds+of+national+and+personal+vows+were+as+easily+shaked+off+as+Sampson%E2%80%98s+cords.+Therefore+I+spake+and+preached+against+the+Engagement+and+dissuaded+men+from+taking+it.+The+first+hour+that+I+heard+of+it%2C+being+in+company+with+some+gentlemen+of+Worcestershire%2C+I+presently+wrote+down+above+twenty+queries+against+it%2C+intending+as+many+more+almost+against+the+obligation+as+those+were+about+the+sense+and+circumstances.+And+one+that+was+present+got+the+copy+of+them%2C+and+shortly+after+I+met+with+them+verbatim+in+a+book+of+Mr.+Henry+Hall%E2%80%98s+as+his+own+%28one+that+was+long+imprisoned+for+writing+against+Cromwell%29.+Some+episcopal+divines+that+were+not+so+scrupulous+it+seems+as+we%2C+did+write+for+it+%28private+manuscripts+which+I+have+seen%29+and+plead+the+irresistibility+of+the+imposers%2C+and+they+found+starting+holes+in+the+terms%2C+viz.+that+by+%E2%80%9Cthe+commonwealth%E2%80%9D+they+will+mean+the+present+commonwealth+in+genere%2C+and+by+%E2%80%9Cestablished%E2%80%9D+they+will+mean+only+de+facto+and+not+de+jure%2C+and+by+%E2%80%9Cwithout+a+king%2C+etc.%E2%80%9D+they+mean+not+quatenus+%5Bas+far+as%5D+but+etsi+%5Balthough%5D%2C+and+that+only+de+facto+pro+tempore+%5Bin+point+of+fact+for+the+time%5D%2C+quasi+dicat+%5B%E2%80%9Cas+if+to+say%E2%80%9D%5D%3A+%E2%80%98I+will+be+true+to+the+government+of+England%2C+though+at+the+present+the+king+and+House+of+Lords+are+put+out+of+the+exercise+of+their+power.%E2%80%99+These+were+the+expositions+of+many+episcopal+men%2C+and+others+that+took+it%3A+But+I+endeavored+to+evince+that+this+is+mere+juggling+and+jesting+with+matters+too+great+to+be+jested+with%3A+And+that+as+they+might+easily+know+that+the+imposers+had+another+sense%2C+so+as+easily+might+they+know+that+the+words+in+their+own+obvious+usual+sense+among+men+must+be+taken+as+the+promise+or+engagement+of+a+subject+as+such+to+a+form+of+government+now+pretended+to+be+established%3A+And+that+the+subjects%E2%80%99+allegiance+or+fidelity+to+his+rulers+can+be+acknowledged+and+given+in+no+plainer+words%3A+And+that+by+such+interpretations+and+stretchings+of+conscience%2C+any+treasonable+oath+or+promise+may+be+taken%2C+and+no+bonds+of+society+can+signify+much+with+such+interpreters.%E2%80%9D%0A%0A%E2%80%94+Richard+Baxter%2C+Reliqui%C3%A6+Baxterian%C3%A6+%28London%3A+Parkhurst%2C+1696%29%2C+pp.+64-65&amp;url=https%3A%2F%2F5solasquotes.github.io%2Fquote%2Fc7d4c7a910.html&amp;via=5Solas" target="_blank" rel="noopener">Share on X</a><a class="perma" href="../quote/c7d4c7a910.html">Permalink</a><a class="src" href="https://reformedbooksonline.com/on-the-ethics-of-usurped-powers/#:~:text=98.%20If%20you%20ask%20what%20did,can%20signify%20much%20with%20such%20interpreters&amp;text=98.%20If%20you%20ask%20what%20did%20the%20ministers&amp;text=of%20society%20can%20signify%20much%20with%20such%20interpreters" rel="noopener" target="_blank">Read it online · Reformed Books Online</a></div>

<blockquote><p>1st Conclusion: Fire and sword, or war, or the coactive power of a magistrate is not God’s way of planting the Gospel in a heathen nation which never heard of the gospel before: 1. Because the apostles were commanded by teaching the gospel to all nations, Mt. 28:19-20; Mk. 16:15; Acts 7:8; and not by war to spread the gospel; 2. Because Christ’s Kingdom is not of this world, for then his servants would fight for Him (Jn. 18:36), nor are the weapons of our warfare carnal (2 Cor. 10:4), nor is Christ’s sword any other thing than the Word of God (Rev. 19:15; Gal. 6:17). And in this meaning, and with relation to the internal acts of sound believing, have the learned taught us that, religio suaderi potest, cogi non potest [‘Religion can be persuaded; it cannot be forced.’]. If these be the Constitutions of Clement, let it go for a truth in this sense, that: ‘God has given liberty of will to men, not punishing them with temporal death, but calls them to give an account of their doings in the life to come.’ …and Athanasius meant with us, when he cites that, ‘If any will come after me, let him take up his cross,’ to prove that the will cannot be compelled; and that of Lactantius is approved by all: Defendenda tamen religio est, non occidendo, sed moriendo, non saevitia, sed sapientia, non scelere, sed fide; illa enim malorum sunt, haec bonorum; et necesse est bonum in religione versari, non malum: Nam si sanguine, si tormentis, si malo religionem defendere velis, jam non defendetur illa, sed polluetur, et violabitur. Nihil est tam voluntarium quam religio, in qua si animus sacrificantis est eversus, jam sublata, jam nulla est. (Institutes, bk. 5, ch. 19) [“Religion, however, must be defended not by killing but by dying, not by cruelty but by wisdom, not by crime but by faith; for the former belong to the wicked, the latter to the good. And it is necessary that good, not evil, should be found in religion. For if you wish to defend religion by blood, by tortures, or by evil, it will no longer be defended but polluted and profaned. Nothing is so voluntary as religion; for if the heart of the worshiper is overturned, it is already destroyed—it no longer exists.”] All which tends to this, that religion is like free-will, and free-will like a virgin which cannot be ravished. Let that of Tertullian stand, Lex nostra non se vindicat ultore gladio [‘Our Law does not avenge itself with the avenging sword.’]. Procopius says that Justinian was blamed, because he compelled the Samaritans to embrace the Christian faith. (Procopius, in Arca. Histor.)</p></blockquote>

<blockquote><p>But then (say they) this makes things arbitrary and indifferent to become necessary. This is true: but you must conceive that a thing may be said to be necessary two ways: necessary in itself, and necessary in the outward submission to the use of it. In itself, a thing indifferent cannot be made necessary. It is always as it is by nature, and conscience informed must so judge it; yet in the outward use, for the peace of the Church, it may upon command become necessary. After the death of Christ, till the destruction of the temple, abstaining from things strangled and blood, circumcision, legal vows and purifyings were indifferent in themselves, (for else the apostles would not have used them so): yet for the peace of some churches they were judged necessary to be yielded in love; and so may it be in other things: yet the indifferent nature of things is not taken away, but the necessary use prescribed for the peace of the church, upon better grounds than that we should suffer ourselves to be unsettled from royal power [as in his day with the civil government instituting ceremonies].</p></blockquote>

<main class="wrap"><figure class="quote" id="q-58884cf76a" data-kw="">
<blockquote><p>Now these things carry a show of humility, and so those thousands of superstitious ceremonies and ways of worship that have been brought into the Church, they come under the name of zeal and devotion; but observe the Scripture, you shall see: Baptism, the Lord’s Supper, when purely administered although in a grave and holy way, yet in such simplicity and plainness, that there is not the least mention of the least ceremony or traditional worship that afterwards was introduced; and this the apostle meant when he said [that] he was afraid lest the Serpent should beguile them from the simplicity of the Gospel of Christ, 2 Cor. 11:3, [‘But I fear, lest by any means, as the serpent beguiled Eve through his subtilty, so your minds should be corrupted from the simplicity that is in Christ.’]. Oh that is a worthy place! There is a simplicity in the doctrine, worship, and life of the Gospel, and your minds are easily corrupted from this.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/anthony-burgess.html">Anthony Burgess</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Scripture Directory for Church-Officers &amp; People</cite>, … (London, 1659), on verse 4, p. 55</span></figcaption>

rmed Books Online</a></div>
</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-b66e4f80a0" data-kw="">
<blockquote><p>The moral grandeur of the death of Jesus is not a little enhanced when it is apprehended in its distinctive character as an act of worship. If we consider it exclusively in the light of a judicial sentence, and detach from the Saviour those active sentiments of piety and religion which make Him a doer rather than a sufferer, we may understand the principles of moral government which underlie the atonement, but we shall fail to appreciate the dignity and glory of Jesus. It is not right to consider Him as the helpless victim of inexorable wrath; and all the imputations upon the goodness and clemency of God, which the malice of the human heart has made His vicarious punishment the pretext of suggesting, are at once dispelled when we enter into His own mind, and see the spirit of devotion in which He presented His soul as an offering for sin… We dare not entertain the thought, even for an instance, that the Father is harsh or vindictive, or that a cloud obscures the benevolence of His nature, when the very circumstances which are most revolting in the tragedy of Calvary are elements of a worship which the Son delighted to render, and felt that the Father was glorious in accepting. Considered as an act of worship, there is a majestic awe, a moral sublimity thrown around the death of Jesus, which fails to be impressed when attention is exclusively confined to the legal principles which made it indispensable to the pardon of the guilty. It is invested with a sacredness which makes us pause and adore. Never was there such a doxology as when Jesus died, and the whole work of redemption is a grand litany which has no parallel in the history of the universe. There can be no wonder that the Father should love the Son. Such worshippers are not to be dismissed from the sanctuary, nor such homage lightly esteemed. Never, never was there displayed before, and never, never will there be displayed again, such piety as that which burned in the bosom of Jesus when He laid down His life of Himself.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/james-henley-thornwell.html">James Henley Thornwell</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Collected Writings</cite>, vol. 2, ‘The Sacrifice of Christ: the Type &amp; Model of Missionary Effort’, pp. 418-19</span></figcaption>

</figure><figure class="quote" id="q-9527c70aca" data-kw="">
<blockquote><p>…the Rejoinder [of an apponent] brings abundance of instances [for human ceremonies idolatrously abused] out of his old store: 1. Kneeling, bowing, prostrating, lifting up of the eyes, and of the hands, shouting, and dancing for joy. But these we absolutely deny to be human inventions. The Rejoinder knew this and therefore by prevention replies: to say these are not human inventions because they partly spring out of natural light is as much as to say they are not because they are human inventions: for what are human inventions, but such as spring out of natural light? What? the cross and surplice; the cornered-cap and tippet; the bishop’s rochet and cope, with a thousand such like; which whoesoever will equal, or (in regard of naturalness and willfull invention) liken unto lifting up of eyes and hands, etc. in prayer, must for that time lay aside right natural invention and judgment… I think it would trouble all the graduates in England to find out that natural light from whence bachelors of art, maisters of art, bachelors and doctors of divinity received their several kinds of hoods, even as much as to find out light of nature for all the several habits of monks. But (says the Rejoynder) all came from natural light, better or worse, more or less agitated, just as men’s long hair and women’s short, which nature itself teaches to be uncomely (according to the apostle’s light [1 Cor. 11:14]) came from the light of nature. It is natural to a child, for to suck the dug and after to put the hand to the mouth; and after to creep or go: Is it like natural to sound a certain distinct sound upon a trumpet? to dance a certain round, or galliard after every fiddle? It is natural for a child to signify his discerning of those that it is used to by some such sound as dad and mam, but not to make verses in a certain number.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/william-ames.html">William Ames</a></span><span class="wk"><span class="lbl">Work:</span> <cite>A Fresh Suit Against Human Ceremonies in God’s Worship, ‘An Addition of the two last reasons of the former reply’</cite>, … (1633), pp. 495-96</span></figcaption>

</figure><figure class="quote" id="q-1224286efb" data-kw="">
<blockquote><p>Hence arises a manifold difference between the moral law and others [ceremonial and judicial] both in origin (because the moral is founded upon natural right and on this account is known by nature; but the others upon positive right and on this account are from free revelation) and in duration. The former is immutable and eternal; the latter mutable and temporary. In regard to object, the one is universal embracing all; the others particular applying only to the Jews… In regard to use, the moral is the end of the others, while the others are subservient to the moral.</p></blockquote>

<main class="wrap"><figure class="quote" id="q-3b47021f5c" data-kw="">
<blockquote><p>As to the political law of the Jews, that has been abolished in two respects; first, as it served to distinguish the Jewish commonwealth from all others, and as it was a type of the Redeemer’s kingdom. Now there is no longer any difference between Jews and Gentiles in Christ, (Gal. iii. 28,) and the Messiah having appeared, there is no need for his kingdom to be typified.

Secondly, it is abrogated in those things which are of particular obligation, and which were only applicable to the Jews; as the law concerning the marriage of a brother’s wife, the law of divorce, the jubilee, the first-born, the sowing of fields with different seeds, &amp;c. &amp;c.

But it is not abrogated in those things which are of universal obligation, being founded on the law of nature; which serve for the explanation of the Decalogue, and are found in the New Testament. The Jewish nation may be considered in two characters, as a people, and as the Jewish people; whatever applies to them simply as a nation, can be applicable to others; but whatever applies to them as the Jewish nation, is of no more obligation upon us, than the laws of the ancient Assyrians, Persians, Greeks, and Romans, or the municipal laws of any foreign nation.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/benedict-pictet.html">Benedict Pictet</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Christian Theology</cite>, trans. Frederick Reyroux (1696; London, 1834), 6.18, p. 333.</span></figcaption>

</figure><figure class="quote" id="q-21077c0d55" data-kw="">
<blockquote><p>Some judicial precepts are Juris communis, of common equity, such as are agreeable to the instinct and law of nature, common to all men; and these for substance bind all persons, both Jews and Gentiles; as being Moral, and so agreeing with the Moral Law. These judicial precepts which were Juris particularis, of particular equity, such as pertained especially to the Jews’ commonwealth, and were fitted for them and their time, are now abolished, e.g., that a man should marry with none but his own stock; that the brother should raise up seed to his brother, and that a thief should restore fourfold, this was peculiar to the Jewish commonwealth and not to ours…. So then those judicial and civil precepts which are agreeable to the Moral Law, and do confirm and uphold it, they bind for ever. For example, ’tis a judicial Law that adulterers and adulteresses should die the death; now this being agreeable to common equity, and to the Law of Nature, as appears (Gen. 38:24) where Judah (before this judicial Law was publish by Moses) appoints Tamar his daughter-in-Law to be burnt for this sin, and Nebuchadnezzar burnt Ahab and Zedekiah for it (Jer. 29:21-23), so this judicial Law of putting witches to death by the magistrate, is agreeable to common equity, it helps to preserve all the Moral precepts which are broken by the idolatry, murder, and malice, of witches.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/thomas-hall.html">Thomas Hall</a></span><span class="wk"><span class="lbl">Work:</span> <cite>A Practical &amp; Polemical Commentary, Or Exposition upon 2 Tim. 3-4</cite>, (1658), pp. 227-28</span></figcaption>

<blockquote><p>M.—It is not, then, your opinion, that a king should in all matters be invested with arbitrary power?

B.—By no means; for I recollect that he is not only a king, but also a man erring much through ignorance, offending much through inclination, and much almost against his will; as he is an animal readily yielding to every breath of favour or hatred. This imperfection of nature too is generally increased by the possession of office; so that here, if anywhere, I recognize the force of the sentiment in the comedy, when it says, that “by unrestrained authority we all become worse.” For this reason legislative sages supplied their king with law, either to instruct his ignorance or to rectify his mistakes. From these remarks you may, I presume, conceive, as in a typical representation, what my idea is of a genuine king’s duty.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/george-buchanan.html">George Buchanan</a></span><span class="wk"><span class="lbl">Work:</span> <cite>De Jure Regni Apud Scotos; A Dialogue Concerning the Rights of the Crown in Scotland</cite>, trans. Robert MacFarlan (1579; Colorado Springs: Portage Publications, 2016), pp 14-15.</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/civil-government-and-society/natural-law-and-civil-law.html">Natural Law and Civil Law</a></span></div>

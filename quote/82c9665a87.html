<main class="wrap"><figure class="quote" id="q-82c9665a87" data-kw="">
<blockquote><p>Though (according to the judgement of Tertullian) it be much better for a man to be less knowing, then to know that which is worse, and to err, then deceive, it being the Characteristic of that Charity, which is recommended by St. Paul, as the greatest of the Virtues, to believe, and hope all things; so far as concurrence and compliance with reason may permit; yet ought not the credulity, which accompanies Charity, nor its hope (what latitude soever we may imagine to allow it) as it were out of a design to be enslaved to impostures and circumventions, put out its eyes, for fear lest it should be in a condition to discover and elude them.

And if it be requisite, it should be free from all servile stupidity, since it is the principal effect of the holy Spirit, who calls and conducts us, by the liberty of his Grace to that of Glory, it may with much more reason be expected it should be far from being subject to blindness, because it presupposes the conduct of Faith, which is in some sort the eye of the regenerate soul, in whom the simplicity of the Dove, which is, of it self, inclined candidly to interpret what there might be some difficulty to exempt from the censures of persons not easily satisfied, is ever attended by the prudence of the Serpent, whose vigilancy is employed to foresee and prevent surprises.

The same profession of piety, which encourages sincere souls to walk in an innocent confidence, is also their perpetual remembrancer that Truth persuades by teaching, whereas, on the contrary, Impostors, who are loth to communicate themselves, even to their own Disciples, till such time as they have gained them, artificially endeavour to persuade, before they instruct: and, discovering, that they make it their main business to conceal what they preach, if so it may be said of those who smother what they would have the world acquainted with, that they preach it, make it appear, that they are therein diametrically opposite to the Truth, which blushes at nothing so much as the regret she conceives at her being undiscovered.

Hence comes it to pass, that the just and virtuous, having their breasts open, and void of all dissimulation, are, according to the saying of the same Tertullian, likened to the Dove, which is the Figure of the holy Spirit, and loves the East, the Figure of Christ, and are willing to leave to Impostors the shameful imitation of the Serpent, who arrogates to himself the image of God, the beast which shuns the light, hides himself as much as may be, that smothers all the prudence it hath in obscure places, that lurks in blind holes, that eludes those who would see it, by deceitful contractions of its own length, and goes in folds and wrinkles, and is never at once wholly seen.

For (after the manner of Serpents) those who think it a glory to deceive, are never reduced to any compliance with truth, but by force, and can hardly avoid being at difference even with themselves, nor will express themselves to others; the malice, which they are ever guilty of who are engaged in a design to surprize others (to make the event of their attempts the more certain) putting on all manner of masks, and leaving no ways unsought, to prepossess the minds of the good, who thinking there cannot be a greater subtilty, then to live without subtilty, imagine it somewhat unreasonable, to conceive, at the first sight, any suspicion of those by whom they had not as yet been over-reached. And thence it comes to pass, that the best men have this misfortune, upon no other ground then that they are the best, to be the more credulous, and inclining rather to security, then diffidence, easily give advantage to those, who, by their craft and insinuations, make it their design to triumph over their simplicity.</p></blockquote>

<blockquote><p>[F]or it is unbelief and nought else, and the novelty of impious inventions and the subversion of the divine and sacred preachings which have proclaimed One Lord Jesus Christ, the Son of God, the Word that is out of God the Father made man and incarnate, so that the Same is God alike and man; and to One belongs all, the God-befitting and moreover the human. For He being and existing ever in that He is God underwent the birth after the flesh from out a woman.

To One therefore and the Same pertaining both that He Eternally is and existeth and that He in the last times is born after the flesh, Who, by Nature Holy as GOD, was hallowed with us in that He became man to whom it befitteth to be hallowed; Who, both in rank of Lord and, having as His own bondman’s form, did call the Father His God; Life and Life-giving as God, is said to be quickened by the Father in that He became Man.

All things therefore are His, and He does not dishonour the economy which the Father Himself too praised, if it be true which is said by Paul’s voice: for in one place he said, Him who knew not sin He made sin for our sakes in order that WE might be made God’s righteousness in Him, in another. Who verily spared not His own Son but delivered Him up for all us in order that with Him also He might bestow on us all things. Does not therefore our discourse go after the scope of the sacred Scriptures?</p></blockquote>

</figure><figure class="quote" id="q-dcd0422f7c" data-kw="">
<blockquote><p>I may say as Augustine did, though a good conscience be sufficient for myself, yet a good name is necessary for others; a good name is as precious ointment, yet there will not be wanting many flying reports to corrupt it; many are the obloquies and reproaches which by the sons of slander are cast upon me, they would fain have my name to be buried and rot above ground, before my friends can bury my body under it, yet herein is my comfort: there will be a resurrection of names as well as of bodies at the Last Day; I am assured that God will not only wipe off all tears from mine eyes, but all reproaches from my name also; I am, as says the apostle, counted a deceiver, yet true; as an apostate, yet firm to my first principles.</p></blockquote>

</figure><figure class="quote" id="q-e8a82d4739" data-kw="">
<blockquote><p>But what can be the reason, may some man say, why the Scripture has not itself determined these kinds of assemblies [synods, general assemblies, etc.] particularly? I answer, three reasons may begiven for it:

1. Because it was not necessary, the general rules of the word, together with nature’s light, which directeth commonwealths in things of the same kind, being sufficient to direct the church therein.

2. As seasons and times for the meeting of assemblies , so the just bounds thereof in so many different places of the world are things of that kind which were not determinable in Scripture, unless the world had been filled with volumes thereof; for, individua sunt infinita.

3. Because this constitution of synods, provincial and national, is not universal for all times and places; for example, there may bein a remote island ten or twelve Christian congregations, which, beside their particular elderships, have a common presbytery, but are not capable of synods, either provincial or national. Again, let there be an island containing forty or fifty Christian congregations, there shall be therein, beside presbyteries, one kind of a synod, but not two kinds. Besides, the reformed congregations within a great nation may haply [by chance] be either so few, or so dispersed and distant, or so persecuted, that they can neither have provincial nor national assemblies.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/george-gillespie.html">George Gillespie</a></span><span class="wk"><span class="lbl">Work:</span> <cite>An Assertion of the Government of the Church of Scotland</cite>, (1641), p. 53</span></figcaption>

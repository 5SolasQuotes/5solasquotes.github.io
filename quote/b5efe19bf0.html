<main class="wrap"><figure class="quote" id="q-b5efe19bf0" data-kw="">
<blockquote><p>The recognition that there may be true Christians within the bounds of the Church of Rome is something that most Reformed theologians have granted. The Scottish Covenanter, Samuel Rutherford, for example, refused to countenance the dogmatic notion that there were no Christians within the Romish communion:

[F]or even the whole Romish Church in all its members deserveth not excommunication, in respect we are sure God hath thousands in the bosom of that Church, who believe in Christ, and do not defend popery with obstinacie …</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/samuel-rutherford.html">Samuel Rutherford</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Due Right of Presbyteries. Or, A Peaceable Plea, for the Government of the Church of Scotland</cite>, (London: E. Griffin, 1644), p. 417.</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/the-church.html">The Church</a></span></div>

</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-9c67a990d8" data-kw="">
<blockquote><p>The requiring subscription to the 39 Articles is a great imposition: I believe them all myself, but as there are some which might be expressed more unexceptionably, so I think it a better way to let such matters continue to be still the standard of doctrine and to censure those who teach any contrary tenets, than to oblige all who serve in the Church to subscribe them. The greater part subscribe without ever examining them, and others do it because they must do it, though they can hardly satisfy their consciences about some things in them. Churches and societies are much better secured by laws than by subscriptions: it is a more reasonable as well as a more easy mode of government.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/gilbert-burnet.html">Gilbert Burnet</a></span><span class="wk"><span class="lbl">Work:</span> <cite>History of his own Time</cite>, … new ed. (London: Orr, 1850), vol. 2, Conclusion, p. 904 Burnet (1643–1715) was a Scottish philosopher and historian, and Bishop of Salisbury.</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/the-church/creeds-confessions-and-councils.html">Creeds, Confessions and Councils</a></span></div>

</figure><figure class="quote" id="q-7304caa200" data-kw="">
<blockquote><p>7. When any member of any of the churches of their own way go from one church to another only as travelers or sojourners for the time, they are admitted to sacraments, only bringing with them letters of recommendation from their own church. Ans. to 32. q., p. 29. But when any such member comes from one of their churches to another to be admitted as a fixed member there, then he is not admitted (notwithstanding any letters of recommendation or any other testimonial or evidence whatsoever) without such a new examination as aforesaid, and as if he had never been examined nor admitted into church-society before. Ans. to 32. q. pp. 29-30; Ans. to 9. Pos., p. 62; Apology, p. 2, 7, 9, 35.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/william-rathband.html">William Rathband</a></span><span class="wk"><span class="lbl">Work:</span> <cite>A Brief Narration of Some Church Courses Held in Opinion &amp; Practice</cite>, … (London, 1644) Rathband was a Westminster divine., Ch. 3; p. 10</span></figcaption>

<blockquote><p>Ver. 9. Think not to say. We have Abraham to our Father.]

The foolish heart is still leaning to this fancy of external relations and privileges. Beware; rest not on these, — the reformed religion, pure ordinances, or a place of esteem possibly amongst the strictest sort of reformed professors.

And do not think you put an obligation on religion, and that it is indebted to you; but pray take heed. God can leave you, and deliver you up to these vain thoughts, and provide Himself without you. He can draw the remotest and unlikeliest to Himself, and let you go.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/robert-leighton.html">Robert Leighton</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Lectures on the First Nine Chapters of St. Matthew’s Gospel</cite>, in The Whole Works of the Most Reverend Father in God, Robert Leighton, D.D., Archbishop of Glasgow (2 vols, London: James Duncan, 1828), 2: 16.</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/the-church.html">The Church</a></span></div>

<main class="wrap"><figure class="quote" id="q-eecc418b4b" data-kw="">
<blockquote><p>None may preach the word with us but pastors, the sons of the prophets, and such of their sort who aim at the holy ministry. And that ecclesiastical authority must warrant them is clear by our law and practice, as it was in the Jewish Church (1 Sam.10:5; 2 Kings 2:7; 2 Kings 4:1; 1 Kings 20:35).</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/samuel-rutherford.html">Samuel Rutherford</a></span><span class="wk"><span class="lbl">Work:</span> <cite>A Peaceable &amp; Temperate Plea for Paul’s Presbytery in Scotland</cite>, ... (1642), ch. 20, 13th Article, ‘Private Worship’</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/church-government-and-the-ministry/the-call-to-ministry.html">The Call to Ministry</a></span></div>

</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-bdf86fef4e" data-kw="">
<blockquote><p>1… And the first word ‘vocation’ is taken often for God’s act of calling when it has no success, and this is called uneffectual calling. So it is used, Prov. 1:24, ‘Because I called and ye refused, I have stretched forth my hands and no man regarded; But ye have set at nought all my counsel, and would none of my reproof.’ So Isa. 65:12; Jer. 7:13, ‘I called, but ye answered not,’ and many other places: Sometimes it is taken for the act of God when it is successful; as 1 Thess. 2:12 and many more places: 2. This success itself is termed our calling in a passive sense: and it is twofold:

1. Common; when men are brought but to outward profession and common gifts; and so the word is used often.

2. Special; when men are savingly converted to Christ; The former is common effectual calling; the latter is special effectual calling: and this last is the same with conversion:</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/richard-baxter.html">Richard Baxter</a></span><span class="wk"><span class="lbl">Work:</span> <cite>A Treatise of Conversion</cite>, … (London: R.W., 1657), ch. 1, sect. 3, pp. 6-7</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/church-government-and-the-ministry/the-call-to-ministry.html">The Call to Ministry</a></span><span class="t"><a href="../topics/effectual-calling/external-and-internal-call.html">External and Internal Call</a></span></div>

</figure><figure class="quote" id="q-ce33b11915" data-kw="">
<blockquote><p>Therefore, though it is to be wished and endeavored that all elders may have due qualifications for all these things and though special care is to be taken everywhere to choose the most qualified, yet in particular congregations men may be chosen elders who have not such a measure of all these qualifications, they being otherwise men of a blameless and Christian conversation and having such a measure of knowledge and prudence as is fit for governing that congregation and judging of the things that are handled in the session thereof, which for the most part are matters of scandal and trying and admitting of penitents; but if there be any who are not of a blameless and Christian conversation and have not some measure of these qualifications required by the Word of God in a ruling elder, no congregation ought to choose any such, nor any session or presbytery to admit them to the charge…</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/james-guthrie.html">James Guthrie</a></span><span class="wk"><span class="lbl">Work:</span> <cite>A Treatise of Ruling Elders &amp; Deacons</cite>, … (d. 1661; Edinburgh: Anderson, 1690), ch. 7, pp. 60-61</span></figcaption>

</figure><figure class="quote" id="q-bda0dba676" data-kw="">
<blockquote><p>If [as Thomas Hooker says,] ‘the laying on of hands be no specificating act of an office, because it is used in other performances, as in the sending of Paul and Barnabas to preach to the Gentiles, Acts 13,’ then shall water not be essential to baptism, nor drinking to the Lord’s Supper, nor blessing sacramental in that Supper, because in Levitical washings, in the feasts-sacred, in the Passover, in praying for a blessing to the Word preached, all these were used. It’s loose logic, a genere ad speciem [a genus to the species]; the question is not of laying on of hands in general, but of a certain kind and species of laying on of hands by way of prayer and designation. Mr. Rutherford knows there be diverse kinds of laying on of hands. 2. Nor do I say that the rite is essential to ordination, but of the necessity of before.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/samuel-rutherford.html">Samuel Rutherford</a></span><span class="wk"><span class="lbl">Work:</span> <cite>A Survey of the Survey of that Sum of Church-Discipline Penned by Mr. Thomas Hooker</cite>, (1658), pp. 428-9</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/church-government-and-the-ministry/the-call-to-ministry.html">The Call to Ministry</a></span></div>

</figure><figure class="quote" id="q-825ea3772a" data-kw="">
<blockquote><p>X. …What is essential to the ministry cannot be changed without making another ministry. But the essence remaining untouched, it does not cease to be the same ministry, although a varied and manifold change as to the accidents may have taken place. The essence of the ministry is placed in this–that all saving truth pertaining to the conservation of faith and piety be retained and taught; that the true sacraments instituted by Christ may be administered; and that the people may be held under a legitimate government. The accidents make its state good or bad. The good is when the preaching of the Word is pure and entire without any mixture of error or superstition; when the sacraments are rightly celebrated according to the institution of Christ without addition, or detraction, or alteration; and the Christian people are governed in a holy manner according to the Word of God and not in a tyrannical manner. The bad on the other hand is when the truth preached is mixed with errors and superstitions; the sacraments are in different way altered and corrupted; and the government is either confused or unjust and tyrannical… But still it must not be thought that the ministry ought at once to cease and be extinguished on account of any corruption whatsoever and depraved state; as life is not at once extinguished, but can subsist in the midst of weakness and disease.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/francis-turretin.html">Francis Turretin</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Institutes of Elenctic Theology</cite>, … (P&amp;R), vol. 3, Question 23, p. 218</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/church-government-and-the-ministry/the-call-to-ministry.html">The Call to Ministry</a></span></div>

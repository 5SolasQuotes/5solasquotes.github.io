<blockquote><p>But as in recognizing the authority of revelation, so in investigating the sense of it, and settling controversies, we must perpetually have recourse to natural theology. Nor can we possibly give our assent to any thing, as a divine revelation which contradicts the light of nature. Wherefore if any doctrine is attempted to be imposed on us as a revealed truth, which is inconsistent with natural theology, we are on that very account to be absolutely certain that it is an imposture, or at least to try if the passages which seem to contain such a doctrine will bear a construction which will remove the inconsistence, for it is impossible that God can contradict Himself. Thus when the Anthropomorphite asserts that the Deity is possessed of a human form, because the Scripture speaks of his face, his eyes, his ears and arms; natural theology at once convinces us of the delusion, teaching us that God is a being absolutely perfect, and therefore must of consequence be immaterial.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/jean-alphonse-turretin.html">Jean-Alphonse Turretin</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Dissertations on Natural Theology tr. William Crawford (d. 1737; Belfast: Magee, 1777), Theses concerning Natural Theology in General</cite>, p. 13</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/existence-and-knowledge-of-god/essence-and-attributes-in-general.html">Essence and Attributes in General</a></span></div>

target="_blank">Read it online · Reformed Books Online</a></div>

<blockquote><p>2. [Hebrew] ‘Holy’: God’s holiness is the same with his universal justice, or righteousness. And as in other things, so much more in God (by Whom all other things are sanctified or made holy) it imports a separation, as of that which is pure and excellent from that which is either unclean and vile, or at the best common and vulgar. Hence God’s holiness and his glory are near akin; and hallowing God’s name is all one with glorifying it, Eze. 36:20 etc. &amp; 38:23 &amp; 28:22; Lev. 10:3; Isa. 6:3 &amp; Ex. 29:43, “it shall be sanctified by my glory.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/richard-sterne.html">Richard Sterne</a></span><span class="wk"><span class="lbl">Work:</span> <cite>A Brief Commentary upon the 103rd Psalm… (London, 1649)</cite>, pp. 7-8</span></figcaption>

</figure><figure class="quote" id="q-da8941acdb" data-kw="">
<blockquote><p>Objection: God might have willed or not willed the being of the creature, else He were not free. He that may both will and not will is mutable. The sum is: the liberty and immutability of God seems not to consist together. Answer: That immutability and liberty consist together is evident from the nature of God, who wills his own being freely. (see Smising, [Tract on the One God?] tract 2, disp. 3, quest. 1, num. 23) If He were subject to co-action and mutability, He were not God. If by reason of our weakness we are less able so distinctly to discern the liberty of God, as concerning the creature in the act of God willing, yet it is clearly to be seen in the object willed, viz. the creature: because nothing is more manifest than that there is no necessary connection between the being of God and the being thereof. God had been the same, perfect and blessed for ever, though the creature had never been.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/john-norton.html">John Norton</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Orthodox Evangelist… (London: Macock, 1654), ch. 1, ‘Of the Divine Essence’</cite>, p. 9</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/existence-and-knowledge-of-god/essence-and-attributes-in-general.html">Essence and Attributes in General</a></span></div>

</figure><figure class="quote" id="q-26ebf9e579" data-kw="">
<blockquote><p>Liberty is God willing Himself freely and necessarily, but whatever is besides Himself not necessarily, but freely: that is, not of any necessity of nature, but of his mere good pleasure,† Ps. 115:3; Isa. 49:3; Dan. 4:5. † Scotus, bk. 1, dist. 39: Libera terminatio divinae voluntatis in creaturum potuit adesse vel abesse sine ulla mutabilitate subjectiva in Deo [The free determination of the divine will toward creatures could be present or absent without any subjective change in God.]. [Francis] Smising [Tract on the One God?], tract 2, disp. 3, quest. 1, num. 23. Though nothing be more manifest than that God wills freely and not necessarily whatsoever is besides Himself: yet the manner of his willing thereof exceeds our capacities. Created acts of liberty being limited and bounded by their objects, cannot tend unto diverse objects, without tending to diverse acts: but increated liberty, being infinite, is illimited by its objects and tends unto diverse objects by one and the same act. Increated liberty is not to be looked at as consisting in an indifferency to diverse acts of willing or nilling: For that would argue imperfection in God: but it is clearly seen in respect of its diverse created objects, which, as they have their being from God’s good pleasure, so had He so pleased, they had never been, but continued forever in their nothing, Himself notwithstanding eternal, all blessed and all glorious. Omnipotency is God able to do whatsoever his wisdom does conceive, Gen. 18:14; Mt. 19:26; Isa. 46:10. All contradictions, impossibilities and repugnancies unto the revealed Will of God are excluded in this proposition…</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/john-norton.html">John Norton</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Orthodox Evangelist… (London: Macock, 1654), ch. 1, ‘Of the Divine Essence’</cite>, pp. 18-19</span></figcaption>

</figure><figure class="quote" id="q-3e53347a13" data-kw="">
<blockquote><p>… Whether God is imaginable? It is denied. … Whether we know God immediately, whether in this life or in the future? It is denied. Whether we may know him through intelligible species? It is affirmed. Whether through proper species or indeed through species of creatures? It is distinguished. From whence are those species? It is explained. Whether the created intellect is able clearly and intuitively to see the essence of God? It is denied. Whether the created intellect is able to comprehend the essence of God? It is denied. Whether the essence of God is seen by any created intellect according to any created species? It is denied. … Whether the created intellect needs an intelligible species to see God? It is affirmed. Whether the created intellect needs the light of glory to see God? It is distinguished. Whether God is able to supply the activity of the light of glory? A curious question Whether above natural cognition in the present life another cognition of God may hold through grace? It is affirmed. Whether all beatific visions are equally perfect essentially? It is affirmed. Whether all beatific visions are equally perfect accidentally? It is denied. Whether it may prove that one vision is more perfect than another? It is explained and the question is curious. …</p></blockquote>

<div class="actions"><button class="copy" data-copy="“… Whether God is imaginable? It is denied. … Whether we know God immediately, whether in this life or in the future? It is denied. Whether we may know him through intelligible species? It is affirmed. Whether through proper species or indeed through species of creatures? It is distinguished. From whence are those species? It is explained. Whether the created intellect is able clearly and intuitively to see the essence of God? It is denied. Whether the created intellect is able to comprehend the essence of God? It is denied. Whether the essence of God is seen by any created intellect according to any created species? It is denied. … Whether the created intellect needs an intelligible species to see God? It is affirmed. Whether the created intellect needs the light of glory to see God? It is distinguished. Whether God is able to supply the activity of the light of glory? A curious question Whether above natural cognition in the present life another cognition of God may hold through grace? It is affirmed. Whether all beatific visions are equally perfect essentially? It is affirmed. Whether all beatific visions are equally perfect accidentally? It is denied. Whether it may prove that one vision is more perfect than another? It is explained and the question is curious. …”

— Gisbertus Voetius, (8) ‘Invisibility &amp; Incomprehensibility’ in Syllabus of Theological Problems (Utrecht, 1643), pt. 1, section 1, tract 2, I. ‘Of God’, 4. Attributes of God in Specific, 1st Kind Abbr.">Copy</button><a class="share" href="https://x.com/intent/post?text=%E2%80%9C%E2%80%A6+Whether+God+is+imaginable%3F+It+is+denied.+%E2%80%A6+Whether+we+know+God+immediately%2C+whether+in+this+life+or+in+the+future%3F+It+is+denied.+Whether+we+may+know+him+through+intelligible+species%3F+It+is+affirmed.+Whether+through+proper+species+or+indeed+through+species+of+creatures%3F+It+is+distinguished.+From+whence+are+those+species%3F+It+is+explained.+Whether+the+created+intellect+is+able+clearly+and+intuitively+to+see+the+essence+of+God%3F+It+is+denied.+Whether+the+created+intellect+is+able+to+comprehend+the+essence+of+God%3F+It+is+denied.+Whether+the+essence+of+God+is+seen+by+any+created+intellect+according+to+any+created+species%3F+It+is+denied.+%E2%80%A6+Whether+the+created+intellect+needs+an+intelligible+species+to+see+God%3F+It+is+affirmed.+Whether+the+created+intellect+needs+the+light+of+glory+to+see+God%3F+It+is+distinguished.+Whether+God+is+able+to+supply+the+activity+of+the+light+of+glory%3F+A+curious+question+Whether+above+natural+cognition+in+the+present+life+another+cognition+of+God+may+hold+through+grace%3F+It+is+affirmed.+Whether+all+beatific+visions+are+equally+perfect+essentially%3F+It+is+affirmed.+Whether+all+beatific+visions+are+equally+perfect+accidentally%3F+It+is+denied.+Whether+it+may+prove+that+one+vision+is+more+perfect+than+another%3F+It+is+explained+and+the+question+is+curious.+%E2%80%A6%E2%80%9D%0A%0A%E2%80%94+Gisbertus+Voetius%2C+%288%29+%E2%80%98Invisibility+%26+Incomprehensibility%E2%80%99+in+Syllabus+of+Theological+Problems+%28Utrecht%2C+1643%29%2C+pt.+1%2C+section+1%2C+tract+2%2C+I.+%E2%80%98Of+God%E2%80%99%2C+4.+Attributes+of+God+in+Specific%2C+1st+Kind+Abbr.&amp;url=https%3A%2F%2F5solasquotes.github.io%2Fquote%2F3e53347a13.html&amp;via=5

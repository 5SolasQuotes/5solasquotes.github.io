<main class="wrap"><figure class="quote" id="q-a3129fa969" data-kw="">
<blockquote><p>Yea and the injunctions and statutes do permit and give leave to speak against all abuses in all things (but with these exceptions), that we speak not reproachfully, willfully and obstinately, but in humility as we ought, and as being under correction and judgment of magistrates if we speak amiss; read the statute and you shall find such like words; yea and experience will teach you that of late and also long ago both at Paul’s Cross and in the Court some preachers have boldly condemned abuses in the state, and speaking under correction of the magistrate, have not only been suffered but commended of the Queen Majesty herself.</p></blockquote>

</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-5d19d4cfd0" data-kw="">

</figure><figure class="quote" id="q-c96b30e0f7" data-kw="">
<blockquote><p>The truth of history, however, requires that we should state here some of the steps taken by that party of the Presbyterians usually called Society People or Cameronians. [In 1680] One Henry Hall of Haughhead, in Teviotdale, a gentleman who was intimate with Mr. [Donald] Cargill, and had suffered great persecution, was apprehended at Queensferry with a paper in his possession disowning the government, and containing some very strong and exceptionable sentiments. This paper, it appears, was merely a scroll drawn up by Hall and Cargill, and more like a manifesto for a general rising of the people, than fitted for a suffering and subdued handful. It was never sanctioned by any meeting [of the Cameronians]; but having fallen into the hands of the governors, it was held as indicating the sentiments and designs of all the Presbyterians. The Queensferry Paper, as it was called, was thenceforth quoted and used against all suspected of Presbyterianism. Shortly after this Cameron and Cargill, with some others, having broken off from the rest of the Presbyterian ministers, published [in 1680] a declaration at Sanquhar, differing a little from, but in the same strain with, the Queensferry Paper. The Sanquhar Declaration openly declared war against Charles as a tyrant and usurper. This was followed up by one of the most singular scenes, perhaps, recorded in the history of the times — the Torwood excommunication. In a meeting held at Torwood, in Stirlingshire, in September, 1680, Mr. Cargill, after divine service, pronounced, with all solemnity and formality, the highest sentence of excommunication against King Charles, the Duke of York, the Dukes of Monmouth, Lauderdale, and Rothes, General Dalziel, and the advocate, Sir George Mackenzie; in the name of the Lord Jesus Christ casting them out of the church, and delivering them up unto Satan. These proceedings, we may well believe, irritated the ruling powers more than ever; and though unshared in and unapproved of by the rest of the Presbyterian ministers, they were eagerly laid hold of as pretexts for still greater severities against the whole of them. The furnace was “heated one seven times more than it was wont to be heated.” Into the history of the persecutions which followed we cannot minutely enter.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/thomas-m-crie-jr.html">Thomas M’Crie Jr.</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Story of the Scottish Church</cite>, (London: Blackie &amp; Son, 1875), p. 347</span></figcaption>

<blockquote><p>In public prayers they recommend to God all princes in general, and the magistrates of this our native realm in particular: In open audience they declare the authority of princes and magistrates to be of God; and therefore they affirm, That they ought to be honored, feared and obeyed, even for conscience sake, provided that they command nor require nothing expressly repugning to God’s Commandment and plain will revealed in his holy Word.</p></blockquote>

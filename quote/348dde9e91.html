<blockquote><p>19. Because of this receiving, calling is termed conversion, Acts 26:20. All who obey the call of God are completely turned from sin to grace and from the world to follow God in Christ. It is also called regeneration or the very beginning of a new life, a new creation, a new creature–and it is often described in the Scriptures, Jn. 1:13; 3:6; 1 Jn. 3:9; 1 Pet. 1:23 and 2:2… 20. As for man, receiving is either passive or active. Phil. 3:12, ‘I apprehend, because I have been apprehended.’ 21. The passive receiving of Christ is the process by which a spiritual principle of grace is generated in the will of man. Eph. 2:5, ‘He has quickened.’ … 30. Repentance has the same causes and principles as faith, for they are both free gifts of God. Eph. 2:8, ‘Faith is the gift of God;’ 2 Tim. 2:25, ‘Whether God may at some time give them repentance.’ They have the same subject; both have their seat in the heart or will of man. Rom. 10:9; 1 Kn. 8:48, ‘With the heart man believes.’ ‘They shall come back with all their heart.’ They are also begotten at the same time. But, first, they have diverse objects, for faith is properly directed to Christ and through Christ to God, but repentance is directed to God Himself who has been offended by the sin. Acts 20:21, ‘Turning towards God and faith in our Lord Jesus Christ.’ Second, they have diverse ends, for faith properly seeks reconciliation with God but repentance compliance with the will of God. Rom. 3:25, ‘A reconciliation through faith in his blood;’ Acts 26:20, ‘That they should… turn to God doing works fit for repentance.’ 31. Repentance, so far as it comprises the care, anxiety, and terror connected with the law, precedes faith in order of nature, as a preparing and disposing cause, and is even found in the unregenerate; but insofar as it turns man away effectively and genuinely from sin, by which God is offended, it follows faith and depends upon it as an effect upon its cause and so belongs to those who have faith. … 34. Repentance is likely to be known before faith, because a sinner cannot easily persuade himself that he is reconciled to God in Christ before he feels himself to have left those sins which separated him from God.</p></blockquote>

<blockquote><p>3. Likewise, it is quite clear that adults do not obtain these blessings of Christ, except by the prevenient movement of the Holy Spirit, by which their mind and will are moved to hate sin. For, as St. Augustine says, it is impossible to begin a new life if we do not repent of the former one. Likewise, in the last chapter of Luke [24:47], Christ commands that repentance and forgiveness of sin should be preached in his name. Also, John the Baptist, sent to prepare the way of the Lord, preached repentance, saying [Matt. 3:2]: ‘Repent [Poenitentiam agite], for the kingdom of heaven is drawing near.’ Next, man’s mind is moved toward God by the Holy Spirit through Christ and this movement is through faith. Through this man’s mind believes with certainty all that God has transmitted [tradita], and also with full certainty and without doubt assents to the promises made to us by God who, as stated in the psalm [144:13], is faithful in all his words. From there he acquires confidence [fiduciam] on account of God’s promise, by which he has pledged that he will remit sins freely and that he will adopt as children those who believe in Christ, those I say who repent of their former life. By this faith, he is lifted up to God by the Holy Spirit and so he receives the Holy Spirit, remission of sins, imputation of righteousness and countless other gifts. 4. So it is a reliable and sound doctrine that the sinner is justified by living and efficacious faith, for through it we are pleasing and acceptable to God on account of Christ. And living faith is what we call the movement of the Holy Spirit, by which those who truly repent of their old life are lifted up to God and truly appropriate the mercy promised in Christ, so that they now truly recognize that they have received the remission of sins and reconciliation on account of the merits of Christ, through the free [gratuita] goodness of God, and cry out to God: Abba Father’. But this happens to no one unless also at the same time love is infused [infundatur] which heals the will so that the healed will may begin to fulfil the law, just as Saint Augustine said [Of the Spirit &amp; Letter, ch. 9,15]. So living faith is that which both appropriates mercy in Christ, believing that the righteousness which is in Christ is freely imputed to it, and at the same time receives the promise of the Holy Spirit and love. Therefore the faith that truly justifies is that faith which is effectual through love [Gal. 5:6]. Nevertheless it remains true that it is by this faith that we are justified (i.e. accepted and reconciled to God) inasmuch as it appropriates the mercy and righteousness which is imputed to us on account of Christ and his merit, not on account of the worthiness or perfection of the righteousness imparted [communicatae] to us in Christ. 5. Although the one who is justified receives righteousness and through Christ also has inherent [righteousness], as the apostle says [1 Cor. 6:11]: ‘you are washed, you are sanctified, you are justified, etc.’ (which is why the holy fathers made use of [the term] ‘to be justified’ even to mean ‘to receive inherent righteousness’), nevertheless, the faithful soul depends not on this, but only on the righteousness of Christ given to us as a gift, without which there is and can be no righteousness at all. And so by faith in Christ we are justified or reckoned to be righteous, that is we are accepted through his merits and not on account of our own worthiness or works. And on account of the righteousness inherent in us we are said to be righteous, because the works which we perform are righteous, according to the saying of John [1 John 3:7]: ‘whoever who does what is right is righteous’. … 10. Now those who say that we are justified by faith alone should at the same time teach the doctrine of repentance, of the fear of God, of the judgement of God and of good works, so that all the chief points of the preaching may remain firm, as Christ said: ‘preaching repentance and the remission of sins in my name’ [Luke 24:47]. And that is to prevent this way of speaking [i.e. sola fide] from being understood other than has been previously mentioned.</p></blockquote>

— Regensburg Agreement of, Article 5">Copy</button><a class="share" href="https://x.com/intent/post?text=%E2%80%9C3.+Likewise%2C+it+is+quite+clear+that+adults+do+not+obtain+these+blessings+of+Christ%2C+except+by+the+prevenient+movement+of+the+Holy+Spirit%2C+by+which+their+mind+and+will+are+moved+to+hate+sin.+For%2C+as+St.+Augustine+says%2C+it+is+impossible+to+begin+a+new+life+if+we+do+not+repent+of+the+former+one.+Likewise%2C+in+the+last+chapter+of+Luke+%5B24%3A47%5D%2C+Christ+commands+that+repentance+and+forgiveness+of+sin+should+be+preached+in+his+name.+Also%2C+John+the+Baptist%2C+sent+to+prepare+the+way+of+the+Lord%2C+preached+repentance%2C+saying+%5BMatt.+3%3A2%5D%3A+%E2%80%98Repent+%5BPoenitentiam+agite%5D%2C+for+the+kingdom+of+heaven+is+drawing+near.%E2%80%99+Next%2C+man%E2%80%99s+mind+is+moved+toward+God+by+the+Holy+Spirit+through+Christ+and+this+movement+is+through+faith.+Through+this+man%E2%80%99s+mind+believes+with+certainty+all+that+God+has+transmitted+%5Btradita%5D%2C+and+also+with+full+certainty+and+without+doubt+assents+to+the+promises+made+to+us+by+God+who%2C+as+stated+in+the+psalm+%5B144%3A13%5D%2C+is+faithful+in+all+his+words.+From+there+he+acquires+confidence+%5Bfiduciam%5D+on+account+of+God%E2%80%99s+promise%2C+by+which+he+has+pledged+that+he+will+remit+sins+freely+and+that+he+will+adopt+as+children+those+who+believe+in+Christ%2C+those+I+say+who+repent+of+their+former+life.+By+this+faith%2C+he+is+lifted+up+to+God+by+the+Holy+Spirit+and+so+he+receives+the+Holy+Spirit%2C+remission+of+sins%2C+imputation+of+righteousness+and+countless+other+gifts.+4.+So+it+is+a+reliable+and+sound+doctrine+that+the+sinner+is+justified+by+living+and+efficacious+faith%2C+for+through+it+we+are+pleasing+and+acceptable+to+God+on+account+of+Christ.+And+living+faith+is+what+we+call+the+movement+of+the+Holy+Spirit%2C+by+which+those+who+truly+repent+of+their+old+life+are+lifted+up+to+God+and+truly+appropriate+the+mercy+promised+in+Christ%2C+so+that+they+now+truly+recognize+that+they+have+received+the+remission+of+sins+and+reconciliation+on+account+of+the+merits+of+Christ%2C+through+the+free+%5Bgratuita%5D+goodness+of+God%2C+and+cry+out+to+God%3A+Abba+Father%E2%80%99.+But+this+happens+to+no+one+unless+also+at+the+same+time+love+is+infused+%5Binfundatur%5D+which+heals+the+will+so+that+the+healed+will+may+begin+to+fulfil+the+law%2C+just+as+Saint+Augustine+said+%5BOf+the+Spirit+%26+Letter%2C+ch.+9%2C15%5D.+So+living+faith+is+that+which+both+appropriates+mercy+in+Christ%2C+believing+that+the+righteousness+which+is+in+Christ+is+freely+imputed+to+it%2C+and+at+the+same+time+receives+the+promise+of+the+Holy+Spirit+and+love.+Therefore+the+faith+that+truly+justifies+is+that+faith+which+is+effectual+through+love+%5BGal.+5%3A6%5D.+Nevertheless+it+remains+true+that+it+is+by+this+faith+that+we+are+justified+%28i.e.+accepted+and+reconciled+to+God%29+inasmuch+as+it+appropriates+the+mercy+and+righteousness+which+is+imputed+to+us+on+account+of+Christ+and+his+merit%2C+not+on+account+of+the+worthiness+or+perfection+of+the+righteousness+imparted+%5Bcommunicatae%5D+to+us+in+Christ.+5.+Although+the+one+who+is+justified+receives+righteousness+and+through+Christ+also+has+inherent+%5Brighteousness%5D%2C+as+the+apostle+says+%5B1+Cor.+6%3A11%5D%3A+%E2%80%98you+are+washed%2C+you+are+sanctified%2C+you+are+justified%2C+etc.%E2%80%99+%28which+is+why+the+holy+fathers+made+use+of+%5Bthe+term%5D+%E2%80%98to+be+justified%E2%80%99+even+to+mean+%E2%80%98to+receive+inherent+righteousness%E2%80%99%29%2C+nevertheless%2C+the+faithful+soul+depends+not+on+this%2C+but+only+on+the+righteousness+of+Christ+given+to+us+as+a+gift%2C+without+which+there+is+and+can+be+no+righteousness+at+all.+And+so+by+faith+in+Christ+we+are+justified+or+reckoned+to+be+righteous%2C+that+is+we+are+accepted+through+his+merits+and+not+on+account+of+our+own+worthiness+or+works.+And+on+account+of+the+righteousness+inherent+in+us+we+are+said+to+be+righteous%2C+because+the+works+which+we+perform+are+righteous%2C+according+to+the+saying+of+John+%5B1+John+3%3A7%5D%3A+%E2%80%98whoever+who+does+what+is+right+is+righteous%E2%80%99.+%E2%80%A6+10.+Now+those+who+say+that+we+are+justified+by+faith+alone+should+at+the+same+time+teach+the+doctrine+of+repentance%2C+of+the+fear+of+God%2C+of+the+judgement+of+God+and+of+good+works%2C+so+that+all+the+chief+points+of+the+preaching+may+remain+firm%2C+as+Christ+said%3A+%E2%80%98preaching+repentance+and+the+remission+of+sins+in+my+name%E2%80%99+%5BLuke+24%3A47%5D.+And+that+is+to+prevent+this+way+of+speaking+%5Bi.e.+sola+fide%5D+from+being+understood+other+than+has+been+previously+mentioned.%E2%80%9D%0A%0A%E2%80%94+Regensburg+Agreement+of%2C+Article+5&amp;url=https%3A%2F%2F5solasquotes.github.io%2Fquote%2F3e250a42f4.html&amp;via=5Solas" target="_blank" rel="noopener">Share on X</a><a class="perma" href="../quote/3e250a42f4.html">Permalink</a><a class="src" href="https://reformedbooksonline.com/topics/justification#:~:text=3.%20Likewise%2C%20it%20is%20quite%20clear,other%20than%20has%20been%20previously%20mentioned." rel="noopener" target="_blank">Read it online · Reformed Books Online</a></div>

<blockquote><p>I will not stand in argument, whether faith be a part of repentance, or does by any other means depend upon it. It seems to me a notable point of folly to go about to tie matters of divinity to precepts of logic: for we learn not that of the Lord’s apostles.</p></blockquote>

</figure><figure class="quote" id="q-dfc07c88cd" data-kw="">
<blockquote><p>I answer: though the Lord give us no particular promise in his Word, yet He gives us that which is equally effectual, and of like force; namely his general promise without any limitation, exception or condition, but the condition of faith and repentance, with a commaundment to apply the same. And because naturally we are unable in ourselves to perform this, therefore He has ordained the ministry of the Word, and the use of the sacraments, which He makes effectual by the inward operation of his Spirit, for the begetting and confirming of our faith, and stirring us up to repentance; which being wrought in us, we may as certainly be persuaded that the general promises belong unto us, as if they were made unto us particularly and by name.</p></blockquote>

<main class="wrap"><figure class="quote" id="q-62d6ab6209" data-kw="">
<blockquote><p>With the same characteristic reticence Calvin skirts the issue of the exact nature of the days of creation in the 1559 edition of his Institutes… Perkins’ paraphrasing of ‘six distinct days’ with ‘six distinct spaces of time’ appears to be an acknowledgment that the nature of at least the first three days [before the sun was made] may not be clear… it will not do to claim for the six 24-hour day view those who merely refer to the six days of creation. This is to beg the very question of the nature of the six days spoken of in Genesis 1.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/william-s-barker.html">William S. Barker</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Other citations (work not named)</cite>, ch. 13, ‘The Westminster Assembly on the Days of Creation: a Reply to David W. Hall’ in Word to the World (Ross-shire, UK: Christian Focus Publications, 2005), pp. 259-70, pp. 263, 265-66</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/creation/the-six-days.html">The Six Days</a></span></div>

</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-879510ff62" data-kw="">
<blockquote><p>In God, however, it is otherwise. For it was shown above (Q. 4, A. 2) that whatever perfection exists in any creature, wholly pre-exists and is contained in God in an excelling manner. Now not only what is common to creatures—viz., being—belongs to their perfection, but also what makes them distinguished from each other; as living and understanding, and the like, whereby living beings are distinguished from the non-living, and the intelligent from the non-intelligent. Likewise every form whereby each thing is constituted in its own species, is a perfection; and thus all things pre-exist in God, not only as regards what is common to all, but also as regards what distinguishes one thing from another. And therefore as God contains all perfections in Himself, the essence of God is compared to all other essences of things, not as the common to the proper, as unity is to numbers, or as the center (of a circle) to the (radiating) lines; but as perfect acts to imperfect; as if I were to compare man to animal; or six, a perfect number, to the imperfect numbers contained under it. Now it is manifest that by a perfect act, imperfect acts can be known not only in general, but also by proper knowledge; thus, for example, whoever knows a man, knows an animal by proper knowledge; and whoever knows the number six, knows the number three also by proper knowledge. As therefore the essence of God contains in itself all the perfection contained in the essence of any other being, and far more, God can know in Himself all of them with proper knowledge. For the nature proper to each thing consists in some degree of participation in the divine perfection. Now God could not be said to know Himself perfectly unless He knew all the ways in which His own perfection can be shared by others. Neither could He know the very nature of being perfectly, unless He knew all modes of being. Hence it is manifest that God knows all things with proper knowledge, in their distinction from each other.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/thomas-aquinas.html">Thomas Aquinas</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Summa, pt. 1</cite>, quest. 14, art. 6, I answer that</span></figcaption>

</figure><figure class="quote" id="q-7963400fc6" data-kw="">
<blockquote><p>As God did not make the whole fabric of the world at once, though it was not impossible to Him, being a God Almighty, but in the space of six days: So does God deal with his children, in creating in them a clean heart; first he suffers their hearts to be as a rude and massy lump, full of darkness, and then God sends his Holy Spirit into their hearts, and it does illuminate them; and drive away those black clouds of darkness and ignorance… 4… As the sun does now move with much celerity, so fast, that it does in the space of a day, run over many millions of miles.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/john-cotton.html">John Cotton</a></span><span class="wk"><span class="lbl">Work:</span> <cite>A Practical Commentary</cite>, (d. 1652; 1658), on ch. 3, verse 2, doctrines 3-4, pp. 224-26</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/creation/the-six-days.html">The Six Days</a></span></div>

<blockquote><p>As it is of the law of nature that, in general, a due proportion of time be set apart for the worship of God; so, in his Word, by a positive, moral, and perpetual commandment, binding all men in all ages, he hath particularly appointed one day in seven for a Sabbath, to be kept holy unto him:a which, from the beginning of the world to the resurrection of Christ, was the last day of the week; and, from the resurrection of Christ, was changed into the first day of the week,b which in Scripture is called the Lord’s day,c and is to be continued to the end of the world, as the Christian Sabbath.d a. Exod 20:8, 10-11; Isa 56:2, 4, 6-7. • b. Gen 2:2-3; Acts 20:7; 1 Cor 16:1-2. • c. Rev 1:10. • d. Exod 20:8, 10 with Mat 5:17-18.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/westminster-assembly.html">Westminster Assembly</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Confession of Faith</cite>, ch. 21.7</span></figcaption>

<blockquote><p>Q. Did the Lord make the world in an instant? A. No, but by parts, in the space of six days, described at large by Moses, Gen. 1. … Q. What is the first degree of Christ’s exaltation? A. His resurrection the third day, whereby his soul and body by the power of the Godhead, were brought together again, and so rose again from death, appearing to his disciples for the space of forty days, 1 Cor. 15:4; Jn. 2:19; Acts 1:3.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/thomas-shepard.html">Thomas Shepard</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The First Principles of the Oracles of God</cite>, … (d. 1649; London: Rothwel, 1655), pp. 6 &amp; 10</span></figcaption>

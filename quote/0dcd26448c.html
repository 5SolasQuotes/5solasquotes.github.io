<blockquote><p>From whence we take the freedom to entreat you for God’s sake, strictly to inspect into vocations and employments, that they be not mixed nor confounded to the detriment both of the one and other. The ministerial function is expressly limited by the Word of God as to its laws, ends, means and actings, it being altogether different from, yea and totally contrary to the secular government; And we conceive that there is no such difficulty in the matter, but that ministers may be kept within the inviolable bounds of their most holy calling, and yet be useful unto the public without glorying in those little arts of subtilties and surprisals, which abutt at no other mark than temporal and carnal profit. Besides that ’tis a very rare thing to find a man capable both of the one and other calling, there is this grand mischief in it, that flesh and blood seeing in the holy ministry nothing but what is mean and humble, despicable, and painful, difficult and dangerous, and contrariwise meeting in the management of secular affairs with food and fuel enough for pride, ambition and covetousness (the ground of all envies and jealousies), and with the means and helps to carry on designs of self-advancement and domination, as tricks, craft and dissimulation; It will be almost impossible to hinder the spreading of this contagion, which creeps insensibly into the greatest wits, and seizes upon them at unawares, and not as an affected and approved vice. We know very well, that necessity, the law of the present day, is pleaded and urged on behalf of this practice, too too much in use among you to vindicate and justify it. But for God’s sake, most dear brethren, we beseech you to consider, whether it were not better that your temporal affair should suffer some inconveniencies, than your spiritual ones to be contaminated; And whether the great risk you run in ruining and depraving your pastors should be preferred unto your temporal interests. And whether it were not better to have a reserve among you of some pure and savory salt against the general corruption, rather than to hazard all in this universal overthrow by the world, upon which theater we see the most valiant champions to be foiled. If the necessity be absolute, peremptory and indispensable, then let them go about such secular political affairs with regret and grief, troubled at their enforced distraction from their heavenly calling, lamenting as the spouse in the Canticles that they have made me the keeper of the vineyard, but mine own vineyard have I not kept. Let them go, but then only, when your businesses are in extreme danger, as it were at the last gasp, when you need the greatest circumspection, a most immovable fidelity, and unchangeable integrity, and without any affectation or introduction of ambition, or hidden, disguised interests. No man going to war entangles himself with the world, that so he may the better please his Captain that has listed him. That commination is very dreadful, the priest shall be as the people, and that lamentation exceeding doleful, All this evil and mischief is from the prophets, and the stones of the sanctuary are lying at the four corners of the streets. Let us, most dear and honored brethren, give up and resign ourselves to the conduct of true wisdom, speaking to us from the Word of God, which is, to forsake our own. This also, most honored brethren should be endeavored, that all persons whatsoever in the ministry, when called forth unto those secondary employments of the Church, do retain in their deportments and conversations the marks and characters of their first and most sacred vocation. Let their devotion, piety, gravity, self-denial, and sequestration from worldly pleasures, used with too great a liberty by many Christian statesmen serve to maintain the sweet odor and reputation of our Church government, and to keep up inviolably the authority of their most holy ministry, and to bind the souls and consciences of men by religious humility to an everlasting dependance on the majesty of their great Lord, whose holiness and sovereign wisdom shines forth most resplendently in the order of his service, as the Queen of Sheba saw and admired it in the Court of Solomon. Impiety and impudence are too much in vogue everywhere. But let the sanctuary, the Church of God be at least the receptacle and habitation of true and unfeigned piety, where it may act and breath freely at in the open air, with an uplifted countenance, in a courageous demonstration of the Spirit, and evidence of Truth, convincing and condemning the unfruitful works of darkness, and awakening with its bright shining flambeau the drowzy consciences of a perverse generation, it may encourage the faithful unto perseverance, and preserve the remnant of Jacob in this day of dispersions and desolations.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/french-reformed.html">French Reformed Churches</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Synodicon in Gallia Reformata (John Quick, London, 1692)</cite>, ed. John Quick,Synodicon in Gallia reformata, or, The Acts, Decisions, Decrees &amp; Canons of those Famous National Councils of the Reformed Churches in France (London: Parkhurst, 1692), Synod 21, of Tonneins, 1614, ch. 19, A Letter from the Church of Geneva. To the National Synod of the Reformed Churches of France assembled at Tonneins, pp. 441-42</span></figcaption>

<blockquote><p>…an official goodness, or a magistratical prudence, justice, and goodness; this is required of all magistrates, as such, to judge the people: so the acts of a heathen magistrate done according to common natural equity, by Nebuchadnezzar, Pilate, Caesar, Felix, Festus, are to be acknowledged as acts of a lawful magistrate, valid and no less essentially magistratical than if performed by King David; and of this goodness the Scriptures speak not as essential to a magistrate as a magistrate. [That is, a magistrate not doing these ennumerated things is still a valid magistrate.] For kings as kings intend justice, peace, godliness, materially considered, both ex conditione operis [from the nature of the magisterial work], and operantium [from the nature of the persons working by the office]. But for justice and righteous judgment in a spiritual and an evangelic way, that belongs not to the essence of a magistrate, nec ex conditione seu ex intentione operis, nec ex conditione operantis [neither from the nature or the intention of the work of magistracy, nor from the nature of the magistrate working]…</p></blockquote>

<blockquote><p>…the Magistrate indeed forbids speaking of blasphemy and teaching of lies in the name of the Lord, but he forbids not teaching of lies, or abstinence from blaspheming, in a spiritual, but in a carnal, co-active, by force of the sword and external way, because he cannot punish the spiritual and internal ways and manner of external obedience, and therefore he cannot under pain of bodily censure command and forbid these ways of obedience; so the Magistrate forbids murder, but God, not the Magistrate, forbids murder, or commands abstinence from killing, out of mercy and love to our neighbor; for the Magistrate cannot punish heart-hatred of our neighbor, or rash anger, but insofar as it comes out to his senses, in striking, maiming, or opprobrious speeches; and these he can forbid and censure and punish. So we say [that] the Magistrate is but a piece, or a bit of an ordinance (though both lawful and necessary, Rom. 13, for our good [v. 4]) to reform the outside and to work outward reformation; and when he commands the outward man and says, ‘Swear not, blaspheme not, speak not lies in the name of the Lord, kill not, steal not under the pain of feeling the stroke of the sword’: he commands not sinning. For though he forbid only external abstinence from sins that troubles the outward man, without any spiritual and internal right way of abstaining, he commands not sin and hypocrisy, per se, and kindly [in its kind], and properly.

1. Because the Magistrate, as the Magistrate, should and ought, as the Minister of God, give commandments to the outward man under pain of corporal punishment, not to the soul or to the inward man.

2. Because that external obedience, not to kill, not to steal, not to speak lies, is good, lawful external obedience, to man, and profitable in the State for the end that God has appointed it, which is the peaceable conversing one with another; that same abstinence from killing in an unrenewed man, who abstains not from killing for fear of God and love to his brethren, is a sinful abstinence and carnal repentance, by accident, and in relation to the Law of God; but the Magistrate neither commands abstinence from killing from an inward spiritual principle, nor forbids he the contrary: he commands not abstinence from false doctrine out of the love that the messenger owes to him who purchased the flock with his blood, nor forbids he such abstinence, but only he commands abstinence from speaking lies to the people of God.

3. If we distinguish obedience, there is first a necessary and good and lawful obedience. 2. There is an obedience complete and entire, and full, and sincere. Outward obedience, which the Magistrate commands, is good and lawful and [is] necessary obedience, and is, in the kind of external and necessary obedience (I mean) necessary for its end, [namely] the safety of the society, not hypocritical, unlawful or sinful. In this notion only it is commanded by the Magistrate, and the omission of it [is] unlawful and punishable by the sword of the deputy and Minister of God. But if we speak of an obedience complete, full and sincere, which is required from the whole man in order to the Law of God, then the outward obedience that the Magistrate demands is not complete, entire, nor sincere, but in relation to the Law of God, which requires entire obedience from the whole man, soul and body, it is not full, not entire, not sincere obedience, but an outside of obedience; but in this sense the Magistrate does not demand obedience to the Law of God, for he has to do with the outward man only and as a Magistrate has nothing to do with the soul and conscience: so then, though the Magistrate command to preach sound doctrine, forbid to preach lies in the name of the Lord, yet he commands not hypocrisy and sin; for this argument may as well prove [that] the Magistrate should neither forbid nor punish murder, nor command abstinence from murder to an unrenewed man, for an unrenewed man cannot but abstain from murder in a sinful way, and his abstinence from murder, in order to the spiritual Law of God, is no better ‘than the oblation of swine’s blood, and the cutting off of a dog’s head to God,’ Isa. 66. 1:2, as is all external obedience of either Tables of the Law, First or Second, without faith and spiritual, inward, moral principles and heart-obedience; and Mr. Williams cannot answer this argument but by the principles of Anabaptists, Familists and Enthusiasts, who say [that] all outward ordinances, ministry, preaching, sacraments, yea preachers and magistrates who command outward obedience to God are unlawful now under the New Testament.</p></blockquote>

<blockquote><p>Next to fidelity towards God, study to adorn your cause with loyalty to your king, in the Lord, Rom. 13:1, 5; Prov. 24:21; 1 Pet. 2:13. ‘Give unto God the things which are God’s, and unto Ceasar the things which are Cesar’s,” that hereby ye may stop the mouths of them that falsely speak evil of the presbyterian interest and party as inimical to king’s crowns, 1 Pet. 2:15. Did he not in the Usurper’s [Cromwell’s] time find you the most faithful party to him of any? And albeit ye be but ill requat, yet discourage not to follow your duty for the Lord’s sake. We are apt to believe, if any other party in the nation had been so crushed and harassed by his power as ye, none would have born it better. Let him still find that no discouragement will fret or tempt you from your duty and that for conscience-sake, without by-ends; yea, bear due allegiance to him so far as may stand with your allegiance to the King of kings and Lord of lords. And who knows what a conviction this may produce in end? 1 Sam. 24:17-18, testifying to him and all men your cause is of God, which leads you to be so conscientious toward man; and that you are the only fast and faithful friends to authority, who will cleave to it in a stormy day out of the fear of God when all its self-seeking friends will desert it when their interest parts with it; and that it is not humor, but conscience which keeps you off from complying with his will in the matters of your God wherein ye differ from him.</p></blockquote>

<blockquote><p>Though the children of Ammon did a high injury to David, yet no injury can be recompensed in justice with the pressure of the constrained subjection of loyalty to a violent lord. If David had not had an higher warrant from God than an injury done to his messengers, he could not have conquered them. But the Ammonites were the declared enemies of the church of God, and raised forces against David when they themselves were the injurers and offenders. And if David’s conquest will prove a lawful title by the sword to all conquerors, then may all conquerors lawfully do to the conquered people as David did; that is, they may ‘put them under saws, and under harrows of iron, and under axes of iron, and cause them pass through the brick-kilne.’ But, I beseech you, will royalists say, that conquerors, who make themselves kings by their sword, and so make themselves fathers, heads, defenders, and feeders of the people, may use the most extreme tyranny in the world, such as David used against the children of Ammon, which he could not have done by the naked title of sword-conquest, if God had not laid a commandment of an higher nature on him to serve God’s enemies so? I shall then say, if a conquering king be a lawful king, because a conqueror, then has God made such a lawful king both a father, because a king, and a tyrant, and cruel and lionhearted oppressor of those whom he has conquered; for God has given him royal power by this example (2 Sam. 12:30-31) to put these, to whom he is a father and defender by office, to torment, and also to be a torturer of them by office, by bringing their backs under such instruments of cruelty as ‘saws, and harrows of iron, and axes of iron.&#x27;</p></blockquote>

<div class="actions"><button class="copy" data-copy="“Though the children of Ammon did a high injury to David, yet no injury can be recompensed in justice with the pressure of the constrained subjection of loyalty to a violent lord. If David had not had an higher warrant from God than an injury done to his messengers, he could not have conquered them. But the Ammonites were the declared enemies of the church of God, and raised forces against David when they themselves were the injurers and offenders. And if David’s conquest will prove a lawful title by the sword to all conquerors, then may all conquerors lawfully do to the conquered people as David did; that is, they may ‘put them under saws, and under harrows of iron, and under axes of iron, and cause them pass through the brick-kilne.’ But, I beseech you, will royalists say, that conquerors, who make themselves kings by their sword, and so make themselves fathers, heads, defenders, and feeders of the people, may use the most extreme tyranny in the world, such as David used against the children of Ammon, which he could not have done by the naked title of sword-conquest, if God had not laid a commandment of an higher nature on him to serve God’s enemies so? I shall then say, if a conquering king be a lawful king, because a conqueror, then has God made such a lawful king both a father, because a king, and a tyrant, and cruel and lionhearted oppressor of those whom he has conquered; for God has given him royal power by this example (2 Sam. 12:30-31) to put these, to whom he is a father and defender by office, to torment, and also to be a torturer of them by office, by bringing their backs under such instruments of cruelty as ‘saws, and harrows of iron, and axes of iron.&#x27;”

— Samuel Rutherford, Lex Rex... (1644; Edinburgh: Ogle, 1843), p. 50">Copy</button><a class="share" href="https://x.com/intent/post?text=%E2%80%9CThough+the+children+of+Ammon+did+a+high+injury+to+David%2C+yet+no+injury+can+be+recompensed+in+justice+with+the+pressure+of+the+constrained+subjection+of+loyalty+to+a+violent+lord.+If+David+had+not+had+an+higher+warrant+from+God+than+an+injury+done+to+his+messengers%2C+he+could+not+have+conquered+them.+But+the+Ammonites+were+the+declared+enemies+of+the+church+of+God%2C+and+raised+forces+against+David+when+they+themselves+were+the+injurers+and+offenders.+And+if+David%E2%80%99s+conquest+will+prove+a+lawful+title+by+the+sword+to+all+conquerors%2C+then+may+all+conquerors+lawfully+do+to+the+conquered+people+as+David+did%3B+that+is%2C+they+may+%E2%80%98put+them+under+saws%2C+and+under+harrows+of+iron%2C+and+under+axes+of+iron%2C+and+cause+them+pass+through+the+brick-kilne.%E2%80%99+But%2C+I+beseech+you%2C+will+royalists+say%2C+that+conquerors%2C+who+make+themselves+kings+by+their+sword%2C+and+so+make+themselves+fathers%2C+heads%2C+defenders%2C+and+feeders+of+the+people%2C+may+use+the+most+extreme+tyranny+in+the+world%2C+such+as+David+used+against+the+children+of+Ammon%2C+which+he+could+not+have+done+by+the+naked+title+of+sword-conquest%2C+if+God+had+not+laid+a+commandment+of+an+higher+nature+on+him+to+serve+God%E2%80%99s+enemies+so%3F+I+shall+then+say%2C+if+a+conquering+king+be+a+lawful+king%2C+because+a+conqueror%2C+then+has+God+made+such+a+lawful+king+both+a+father%2C+because+a+king%2C+and+a+tyrant%2C+and+cruel+and+lionhearted+oppressor+of+those+whom+he+has+conquered%3B+for+God+has+given+him+royal+power+by+this+example+%282+Sam.+12%3A30-31%29+to+put+these%2C+to+whom+he+is+a+father+and+defender+by+office%2C+to+torment%2C+and+also+to+be+a+torturer+of+them+by+office%2C+by+bringing+their+backs+under+such+instruments+of+cruelty+as+%E2%80%98saws%2C+and+harrows+of+iron%2C+and+axes+of+iron.%27%E2%80%9D%0A%0A%E2%80%94+Samuel+Rutherford

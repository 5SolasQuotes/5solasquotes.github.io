<main class="wrap"><figure class="quote" id="q-d67f6bea8b" data-kw="">
<blockquote><p>A MERE speculative knowledge of Christ, and of the great doctrines of the gospel, however laboriously acquired and extensive it may be, is of small importance in itself, and quite vain and ineffectual, if it be not sanctified, and issue in experimental knowledge of Christ, and a real feeling of the beauty and excellency, and efficacy of divine truth on the heart. A man may have a competent, nay, a very extensive acquaintance with the whole doctrines of the Christian religion … yet if you have not the experimental knowledge of Christ, all your knowledge is in vain as to the salvation of your souls.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/thomas-boston.html">Thomas Boston</a></span><span class="wk"><span class="lbl">Work:</span> <cite>A Discourse of the Experimental Knowledge of Christ</cite>, in The Whole Works of the Late Reverend Thomas Boston of Ettrick, ed. Samuel McMillan (12 vols, Aberdeen: George and Robert King, 1848-52), 2: 645.</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/the-christian-life/spiritual-duties.html">Spiritual Duties</a></span></div>

</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-3b863572e3" data-kw="">
<blockquote><p>We know so much of divine truth, my reader, as we have in a measure a personal experience of it in our souls. The mere speculatist and notionalist in religion is as unsatisfactory and unprofitable as the mere theorist and declaimer in science. For all practical purposes both are but ciphers. The character and the degree of our spiritual knowledge begins and terminates in our knowledge of Christ. Christ is the test of its reality, the measure of its depth, and the source of its growth. If you are advancing in an experimental, sanctifying acquaintance with the Lord Jesus, you are advancing in that knowledge which Paul thus estimates: “I count all things but loss for the excellency of the knowledge of Christ Jesus, my Lord.”

Dear reader, let the chief object of your study be to know the Lord Jesus. It may be in the region of your sinfulness, emptiness, weakness, and foolishness that you learn Him — nevertheless, however humiliating the school, slow the progress, and limited the attainment, count every fresh step you make in a personal acquaintance with the Lord Jesus as a nobler triumph, and as bringing you into the possession of more real wealth than were the whole chests of human knowledge and science mastered, and its untold treasures poured at your feet.

When adversity comes — when death approaches — when eternity unveils — oh! — how indescribably valuable, how inconceivably precious will then be one faith’s touch, one faith’s glimpse of a crucified and risen Saviour! All other attainments then vanish, and the only knowledge that abides, soothes, and comforts, is a heartfelt acquaintance with the sublimest fact of the Gospel, that “Christ Jesus came into the world to save sinners.” Oh! Whatever other studies may engage your thoughts, forget not, as you value your eternal destiny, to study the Lord Jesus Christ.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/octavius-winslow.html">Octavius Winslow</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Go and Tell Jesus</cite>, (75th edn, New York: A. D. F. Randolph &amp; Co., 1869), pp 8-10.</span></figcaption>

<blockquote><p>6th Distinction. Gifted Christians may occasionally admonish, warn, rebuke and exhort one another: 1. privately; 2. without any pastoral care of souls as they are a Church, but only as they occasionally converse with them; 3. ex communi officio charitatis [out of the common office and charity], by the Law of nature, charity tying one member to help another;

4. Not authoritatively by special office; but all authority here is from the Word occasionally spoken. The pastor is to preach, 1. publicly; 2. to the Church as the Church. 3. with a pastoral obligation to all alike, whether he converse daily with them or not. 4. not only by the tie of common charity, but by a virtue of a special office.

5. With authority both objective from the Word and official from his charge. 6. and is obliged to separate himself for this charge allanerly [singly, especially or wholly], as a watchman who must give an account in a special manner to Jesus Christ.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/samuel-rutherford.html">Samuel Rutherford</a></span><span class="wk"><span class="lbl">Work:</span> <cite>A Peaceable &amp; Temperate Plea for Paul’s Presbytery in Scotland</cite>, The Due Right of Presbyteries (1644), Ch. 5, sections 1-2 in Part 2, pp. 272-3</span></figcaption>

<blockquote><p>Grace breeds delight in God, and delight breeds Meditation. A duty wherein consists the essentials of Religion, and which nourisheth the very life blood of it; and that the Psalmist may shew how much the godly man is habituated and inured to this blessed work of Meditation, he subjoins, in his Law doth he meditate day and night; not but that there may be sometimes intermission; God allows time for our calling, he grants some relaxation, but when it is said, the godly man meditates day and night, the meaning is, frequently; he is much conversant in the duty.

‘Tis a command of God to pray without ceasing, 1 These. 5.17. The meaning is, not that we should be always praying (as the Euchites held) but that we should every day set some time apart for prayer; so Drusius and others interpret it. We read in the old Law it was called the continual sacrifice; not that the people of Israel did nothing else but sacrifice, but because they had their stated hours every morning and evening they offered, therefore it was called the continual sacrifice; thus the godly man is said to meditate day and night, that is, he is often at this work, he is no stranger to meditation. …

That a good Christian is a meditating Christian, Psalm 119.15. I will meditate in thy precepts, 1 Tim. 4.15. Meditate upon these things. Meditation is the chewing upon the truths we have heard; The beasts in the old Law that did not chew the cud were unclean; the Christian that doth not by meditation chew the cud, is to be accounted unclean. Meditation is like the watering of the seed, it makes the fruits of grace flourish.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/thomas-watson.html">Thomas Watson</a></span><span class="wk"><span class="lbl">Work:</span> <cite>A Christian on the mount: or, A treatise concerning meditation. Wherein the necessity, useful</cite>, ness, excellency of Meditation is at large discussed (London: Ralph Smith, 1657), pp 58-60.</span></figcaption>

<blockquote><p>The principal design of preaching the Gospel is, that men may be reconciled to God, and this is accomplished by the unconditional pardon of sins; as Paul also informs us, when he calls the Gospel, on this account, the ministry of reconciliation, (2 Cor. 5:18.) Many other things, undoubtedly, are contained in the Gospel, but the principal object which God intends to accomplish by it is, to receive men into favour by not imputing their sins. If, therefore, we wish to show that we are faithful ministers of the Gospel, we must give our most earnest attention to this subject; for the chief point of difference between the Gospel and heathen philosophy lies in this, that the Gospel makes the salvation of men to consist in the forgiveness of sins through free grace. This is the source of the other blessings which God bestows, such as, that God enlightens and regenerates us by his Spirit, that he forms us anew to his image, that he arms us with unshaken firmness against the world and Satan. Thus the whole doctrine of godliness, and the spiritual building of the Church, rests on this foundation, that God, having acquitted us from all sins, adopts us to be his children by free grace.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/john-calvin.html">John Calvin</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Commentary on John</cite>, trans. William Pringle (Bellingham, WA: Logos Bible Software, 2010), 2.271.</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/the-christian-life/spiritual-duties.html">Spiritual Duties</a></span></div>
<div class="actions"><button class="copy" data-copy="“The principal design of preaching the Gospel is, that men may be reconciled to God, and this is accomplished by the unconditional pardon of sins; as Paul also informs us, when he calls the Gospel, on this account, the ministry of reconciliation, (2 Cor. 5:18.) Many other things, undoubtedly, are contained in the Gospel, but the principal object which God intends to accomplish by it is, to receive men into favour by not imputing their sins. If, therefore, we wish to show that we are faithful ministers of the Gospel, we must give our most earnest attention to this subject; for the chief point of difference between the Gospel and heathen philosophy lies in this, that the Gospel makes the salvation of men to consist in the forgiveness of sins through free grace. This is the source of the other blessings which God bestows, such as, that God enlightens and regenerates us by his Spirit, that he forms us anew to his image, that he arms us with unshaken firmness against the world and Satan. Thus the whole doctrine of godliness, and the spiritual building of the Church, rests on this foundation, that God, having acquitted us from all sins, adopts us to be his children by free grace.”

— John Calvin, Commentary on John, trans. William Pringle (Bellingham, WA: Logos Bible Software, 2010), 2.271.">Copy</button><a class="share" href="https://x.com/intent/post?text=%E2%80%9CThe+principal+design+of+preaching+the+Gospel+is%2C+that+men+may+be+reconciled+to+God%2C+and+this+is+accomplished+by+the+unconditional+pardon+of+sins%3B+as+Paul+also+informs+us%2C+when+he+calls+the+Gospel%2C+on+this+account%2C+the+ministry+of+reconciliation%2C+%282+Cor.+5%3A18.%29+Many+other+things%2C+undoubtedly%2C+are+contained+in+the+Gospel%2C+but+the+principal+object+which+God+intends+to+accomplish+by+it+is%2C+to+receive+men+into+favour+by+not+imputing+their+sins.+If%2C+therefore%2C+we+wish+to+show+that+we+are+faithful+ministers+of+the+Gospel%2C+we+must+give+our+most+earnest+attention+to+this+subject%3B+for+the+chief+point+of+difference+between+the+Gospel+and+heathen+philosophy+lies+in+this%2C+that+the+Gospel+makes+the+salvation+of+men+to+consist+in+the+forgiveness+of+sins+through+free+grace.+This+is+the+source+of+the+other+blessings+which+God+bestows%2C+such+as%2C+that+God+enlightens+and+regenerates+us+by+his+Spirit%2C+that+he+forms+us+anew+to+his+image%2C+that+he+arms+us+with+unshaken+firmness+against+the+world+and+Satan.+Thus+the+whole+doctrine+of+godliness%2C+and+the+spiritual+building+of+the+Church%2C+rests+on+this+foundation%2C+that+God%2C+having+acquitted+us+from+all+sins%2C+adopts+us+to+be+his+children+by+free+grace.%E2%80%9D%0A%0A%E2%80%94+John+Calvin%2C+Commentary+on+John%2C+trans.+William+Pringle+%28Bellingham%2C+WA%3A+Logos+Bible+Software%2C+2010%29%2C+2.271.&amp;url=https%3A%2F%2F5solasquotes.github.io%2Fquote%2F2451e0e4fa.html&amp;via=5Solas" target="_blank" rel="noopener">Share on X</a><a class="perma" href="../quote/2451e0e4fa.html">Permalink</a><a class="src" href="https://heidelblog.net/2021/04/calvin-the-whole-doctrine-of-godliness-rests-upon-the-doctrine-of-salvation-through-free-grace/" rel="noopener" target="_blank">Read it online · Heidelblog</a></div>

<blockquote><p>The materials of worship, as linen, clothes, habits, gestures may be in their physical consideration indifferent, but as applied by formalists, they cannot be indifferent, for in their use, kneeling appropriated to sacramental bread, linen appropriated to the body of a priest, while he officiates, cannot be but religious or profane.</p></blockquote>

</figure><figure class="quote" id="q-7eca285d24" data-kw="">
<blockquote><p>All adult women would have had long hair, the only exceptions being women who habitually wore wigs, slaves who had had their own hair cut off to provide the hair for such wigs and possibly some priestesses, as well as women who had been ill… Women would not have appeared in public with short hair from choice. The hair was always worn pinned up, unless the woman wanted to show distress by not taking care of her appearance, such as at funerals.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/alexandra-t-croom.html">Alexandra T. Croom</a></span><span class="wk"><span class="lbl">Work:</span> <cite>‘Hairstyles &amp; Hats’ &amp; ‘Hairnets &amp; Coverings’ in Roman Clothing &amp; Fashion Pre</cite>, (Stroud: Tempus, 2000), pp. 139-55, p. 141</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/worship/head-coverings-in-worship.html">Head Coverings in Worship</a></span></div>
<div class="actions"><button class="copy" data-copy="“All adult women would have had long hair, the only exceptions being women who habitually wore wigs, slaves who had had their own hair cut off to provide the hair for such wigs and possibly some priestesses, as well as women who had been ill… Women would not have appeared in public with short hair from choice. The hair was always worn pinned up, unless the woman wanted to show distress by not taking care of her appearance, such as at funerals.”

— Alexandra T. Croom, ‘Hairstyles &amp; Hats’ &amp; ‘Hairnets &amp; Coverings’ in Roman Clothing &amp; Fashion Pre (Stroud: Tempus, 2000), pp. 139-55, p. 141">Copy</button><a class="share" href="https://x.com/intent/post?text=%E2%80%9CAll+adult+women+would+have+had+long+hair%2C+the+only+exceptions+being+women+who+habitually+wore+wigs%2C+slaves+who+had+had+their+own+hair+cut+off+to+provide+the+hair+for+such+wigs+and+possibly+some+priestesses%2C+as+well+as+women+who+had+been+ill%E2%80%A6+Women+would+not+have+appeared+in+public+with+short+hair+from+choice.+The+hair+was+always+worn+pinned+up%2C+unless+the+woman+wanted+to+show+distress+by+not+taking+care+of+her+appearance%2C+such+as+at+funerals.%E2%80%9D%0A%0A%E2%80%94+Alexandra+T.+Croom%2C+%E2%80%98Hairstyles+%26+Hats%E2%80%99+%26+%E2%80%98Hairnets+%26+Coverings%E2%80%99+in+Roman+Clothing+%26+Fashion+Pre+%28Stroud%3A+Tempus%2C+2000%29%2C+pp.+139-55%2C+p.+141&amp;url=https%3A%2F%2F5solasquotes.github.io%2Fquote%2F7eca285d24.html&amp;via=5Solas" target="_blank" rel="noopener">Share on X</a><a class="perma" href="../quote/7eca285d24.html">Permalink</a><a class="src" href="https://reformedbooksonline.com/the-history-of-head-coverings/#:~:text=All%20adult%20women%20would%20have%20had,her%20appearance%2C%20such%20as%20at%20funerals&amp;text=All%20adult%20women%20would%20have%20had%20long%20hair&amp;text=care%20of%20her%20appearance%2C%20such%20as%20at%20funerals" rel="noopener" target="_blank">Read it online · Reformed Books Online</a></div>
</figure><figure class="quote" id="q-19b394d362" data-kw="">
<blockquote><p>Hereof he gathers that if men do either pray or preach in public assemblies having their heads covered (which was then a sign of subjection)…</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/theodore-beza.html">Theodore Beza</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The New Testament of our Lord Jesus Christ: translated out of Greek by Theodore Beza</cite>, translated out of Greek by Beza, with Brief Summaries &amp; Expositions upon the Hard Places... (1599), on 1 Cor. 11 | v. 4</span></figcaption>

<div class="actions"><button class="copy" data-copy="“Hereof he gathers that if men do either pray or preach in public assemblies having their heads covered (which was then a sign of subjection)…”

— Theodore Beza, The New Testament of our Lord Jesus Christ, translated out of Greek by Beza, with Brief Summaries &amp; Expositions upon the Hard Places... (1599), on 1 Cor. 11 | v. 4">Copy</button><a class="share" href="https://x.com/intent/post?text=%E2%80%9CHereof+he+gathers+that+if+men+do+either+pray+or+preach+in+public+assemblies+having+their+heads+covered+%28which+was+then+a+sign+of+subjection%29%E2%80%A6%E2%80%9D%0A%0A%E2%80%94+Theodore+Beza%2C+The+New+Testament+of+our+Lord+Jesus+Christ%2C+translated+out+of+Greek+by+Beza%2C+with+Brief+Summaries+%26+Expositions+upon+the+Hard+Places...+%281599%29%2C+on+1+Cor.+11+%7C+v.+4&amp;url=https%3A%2F%2F5solasquotes.github.io%2Fquote%2F19b394d362.html&amp;via=5Solas" target="_blank" rel="noopener">Share on X</a><a class="perma" href="../quote/19b394d362.html">Permalink</a><a class="src" href="https://reformedbooksonline.com/the-history-of-head-coverings/head-coverings-in-the-post-reformation-era/#:~:text=Hereof%20he%20gathers%20that%20if%20men,was%20then%20a%20sign%20of%20subjection&amp;text=Hereof%20he%20gathers%20that%20if%20men%20do%20either&amp;text=covered%20%28which%20was%20then%20a%20sign%20of%20subjection" rel="noopener" target="_blank">Read it online · Reformed Books Online</a></div>
</figure><figure class="quote" id="q-6b695031cf" data-kw="">
<blockquote><p>First, their head [of the idolaters in Ahab’s time]; they prayed before their idols with their heads covered, because the people of the East worshipped their great men with their heads covered; therefore they prayed after the same manner, and honored their idols standing before them with their heads covered. Maimonides says that religious outward worship should be given after the same manner as they worshipped great men, and he adds, nisi forte sit mos illius loci, ut quis stet coram magnatibus aperto capite, that is, ‘unless it be the manner of men in that place to stand bare-headed, when they do reverence to great men’; where we see that the gesture and the manner of praying is to be accommodated to the custom of the place where one lives, and they should testifie their outward reverence by such signs as men testify their reverence to great men. This manner of worship varies in sundry parts. Maimonides wrote his Mishna in Egypt, and amongst the Mahometans who uncover not their heads before great men, but bow only their head before them; and therefore when they pray they uncover not their head: So the Jews both the priests and people uncover not the head in time of divine service. The priests had such bonnets upon their heads which could not easily be taken off and put on as ours, and when they came abroad they never uncovered their heads; but when they made great lamentation they uncovered their heads, and cast ashes upon them: But the Christians in the West, when they do reverence to their superiors, they always uncover their heads; and therefore it is the fittest gesture for us to uncover our heads when we pray. The Jews who live here in Europe, when they are in their synagogues, they never uncover their heads, which is altogether contrary to the custom of Europe: They salute great men here uncovering their heads, and so should they pray according to the canon of Maimonides; but they do this in despite of the Christians: The apostle, 1 Cor. 11, wills men to be uncovered, and women to be covered, when they pray, because that was the usual form amongst the Grecians, for the men did uncover their heads, when they did any reverence to their superiours; and the women had vails which covered their heads and faces when they came abroad: therefore he would not have them uncovered in time of prayer.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/john-weemes.html">John Weemes</a></span><span class="wk"><span class="lbl">Work:</span> <cite>A Treatise of the Four Degenerate Sons</cite>, … wherein are handled many… sundry places of Scripture, cleared out of the original tongues. Being the fourth volume, of the Works… (London, 1636), On the 3rd Degenenerate Son, the Idolater, section 6, pp. 264-65</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/worship/head-coverings-in-worship.html">Head Coverings in Worship</a></span></div>
<div class="actions"><button class="copy" data-copy="“First, their head [of the idolaters in Ahab’s time]; they prayed before their idols with their heads covered, because the people of the East worshipped their great men with their heads covered; therefore they prayed after the same manner, and honored their idols standing before them with their heads covered. Maimonides says that religious outward worship should be given after the same manner as they worshipped great men, and he adds, nisi forte sit mos illius loci, ut quis stet coram magnatibus aperto capite, that is, ‘unless it be the manner of men in that place to stand bare-headed, when they do reverence to great men’; where we see that the gesture and the manner of praying is to be accommodated to the custom of the place where one lives, and they should testifie their outward reverence by such signs as men testify their reverence to great men. This manner of worship varies in sundry parts. Maimonides wrote his Mishna in Egypt, and amongst the Mahometans who uncover not their heads before great men, but bow only their head before them; and therefore when they pray they uncover not their head: So the Jews both the priests and people uncover not the head in time of divine service. The priests had such bonnets upon their heads which could not easily be taken off and put on as ours, and when they came abroad they never uncovered their heads; but when they made great lamentation they uncovered their heads, and cast ashes upon them: But the Christians in the West, when they do reverence to their superiors, they always uncover their heads; and therefore it is the fittest gesture for us to uncover our heads when we pray. The Jews who live here in Europe, when they are in their synagogues, they never uncover their heads, which is altogether contrary to the custom of Europe: They salute great men here uncovering their heads, and so should they pray according to the canon of Maimonides; but they do this in despite of the Christians: The apostle, 1 Cor. 11, wills men to be uncovered, and women to be covered, when they pray, because that was the usual form amongst the Grecians, for the men did uncover their heads, when they did any reverence to their superiours; and the women had vails which covered their heads and faces when they came abroad: therefore he would not have them uncovered in time of prayer.”

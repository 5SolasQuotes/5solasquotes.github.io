<main class="wrap"><figure class="quote" id="q-3b88a5fd30" data-kw="">
<blockquote><p>Some writers, as has been already observed, have allowed that sinners are the subjects of an inability which arises from the depravity; but they still contend that this is not all, but that they are both naturally and morally unable to believe in Christ; and this they think agreeable to the Scriptures, which represent them as both unable and unwilling to come to Him for life. But these two kinds of inability cannot consist with each other, so as both to exist in the same subject and towards the same thing. A moral inability supposes a natural ability. He who never, in any state, was possessed of the power of seeing, cannot be said to shut his eyes against the light. If the Jews had not been possessed of natural powers equal to the knowledge of Christ’s doctrine, there had been no justice in that cutting question and answer, “Why do ye not understand my speech? Because ye cannot hear my word.” [Jn. 8:41] A total physical inability must, of necessity, supersede a moral one. To suppose, therefore, that the phrase, “No man can come to Me,” [Jn. 6:44] is meant to describe the former; and, “Ye will not come to Me that ye may have life,” [Jn. 5:40] the latter; is to suppose that our Savior taught what is self contradictory. Some have supposed that, in attributing physical or natural power to men, we deny their natural depravity. Through the poverty of language, words are obliged to be used in different senses. When we speak of men as by nature depraved, we do not mean to convey the idea of sin being an essential part of human nature, or of the constitution of man: our meaning is that it is not a mere effect of education and example; but is, from his very birth, so interwoven through all his powers, so ingrained, as it were, in his very soul, as to grow up with him, and become natural to him. On the other hand, when the term natural is used as opposed to moral, and applied to the powers of the soul, it is designed to express those faculties which are strictly a part of our nature as men, and which are necessary to our being accountable creatures. By confounding these ideas we may be always disputing, and bring nothing to an issue. … Some have alleged that ‘natural power is only sufficient to perform natural things, and that spiritual power is required to the performance of spiritual things.’ But this statement is far from accurate. Natural power is as necessary to the performance of spiritual as of natural things; we must possess the powers of men in order to perform the duties of good men. And as to spiritual power, or, which is the same thing, a right state of mind, it is not properly a faculty of the soul, but a quality which it possesses; and which, though it be essential to the actual performance of spiritual obedience, yet is not necessary to our being under obligation to perform it.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/andrew-fuller.html">Andrew Fuller</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Gospel Worthy of All Acceptation</cite>, ‘On the Inability of Sinners to Believe in Christ &amp; do Things Spiritually Good’ (1781), pt. 3, ‘Objections Answered’, in Works, pp. 172-73</span></figcaption>

</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-687b8e6168" data-kw="">
<blockquote><p>Moreover, what the orthodox fathers and the scholastics who followed their steps handed down very well was commonly known: namely that the natural gifts have been corrupted and the supernatural ones lost. So from this statement we establish that supernatural theology, which by the sin of man had been, as it were, rejected and most undeservedly spurned, retreated from here to the heavens; and natural theology, as all the other things which arise from nature, was corrupted. For how could it have remained uncorrupted in a subject that was corrupted in every part?</p></blockquote>

<blockquote><p>VIII. Third, as to moral necessity arising from habits. For as the will can be called “free” if it is devoid of habit, so it can rightly be called “slavish” if by habit it has been determined to a certain manner of acting. Still this servitude by no means overthrows the true and essential nature of liberty. Otherwise it would follow that habits destroy the will (which they rather perfect and facilitate to operation). Hence moral habits are twofold: good and evil. A twofold servitude also is thence born: the one of righteousness in good; the other of sin in evil and misery. This belongs to man in a state of sin, of which John says, “Whosoever committeth sin is the servant of sin” (8:34); and “Ye were the servants of sin” (Rom. 6:17)…

IX. Hence it is evident that the adversaries falsely charge our men with saying the will is a slave in the state of sin, as if its liberty were destroyed by that very thing. Scripture beforehand so calls it and indeed with a twofold limitation: (1) that “servant” should be understood not absolutely and physically, but relatively, after the fall in a state of sin; (2) not simply about every natural, civil, or externally moral object, but especially about a spiritual object good per se (in which manner inability to good is more strongly asserted, but the essence of liberty is not destroyed). Although the sinner is so enslaved by evil that he cannot but sin, still he does not cease to sin most freely and with the highest liberty.</p></blockquote>

E2%80%9D%0A%0A%E2%80%94+Francis+Turretin%2C+Institutes+of+Elenctic+Theology%2C+Institutes%2C+Tenth+Topic%2C+%E2%80%98The+Free+Will+of+Man+in+a+State+of+Sin%E2%80%99%2C+Question+2.+The+reader+is+encouraged+to+see+Turretin%E2%80%99s+numerous+discussions+relating+to+the+related+issues+throughout+his+Institutes%2C+as+he+has+a+lot+more+to+say.%2C+p.+663&amp;url=https%3A%2F%2F5solasquotes.github.io%2Fquote%2F916507e2d1.html&amp;via=5Solas" target="_blank" rel="noopener">Share on X</a><a class="perma" href="../quote/916507e2d1.html">Permalink</a><a class="src" href="https://reformedbooksonline.com/topics/topics-by-subject/calvinism/total-depravity/natural-vs-moral-inability/#:~:text=VIII.%20Third%2C%20as%20to%20moral%20necessity,freely%20and%20with%20the%20highest%20liberty&amp;text=VIII.%20Third%2C%20as%20to%20moral%20necessity%20arising%20from&amp;text=sin%20most%20freely%20and%20with%20the%20highest%20liberty" rel="noopener" target="_blank">Read it online · Reformed Books Online</a></div>

<blockquote><p>XIII. The matter from which, of the first creation, there was none, but the omnipotent Creator produced all things from nothing, either negative, which signifies a pure negation and absence of pre-existing matter; or privative, which denotes a privation or indisposition, and therefore matter indeed, but indisposed, unsuitable, and by its nature inept for the production of the term, in which only an obediential potentiality, or non-repugnance in order to the first cause, acting with infinite power, is given. And the first, or immediate, creation [Gen. 1:1] was from negative nothing; but the second, or mediate, creation of the following days [from that which was without form and void, Gen. 1:2] was from privative nothing.</p></blockquote>

<blockquote><p>And let me add this admonition in passing: It is the nature and the result of sound doctrine that when it is taught and learned well, it unites the minds of men in supreme harmony. But where men neglect the faithful doctrine and embrace errors, that harmony of mind is disrupted. As soon as brethren or pupils are deceived by fanatical spirits and fall away from the doctrine of justification, they immediately begin to persecute the pious with bitter hatred, even though previously they loved them dearly. … Therefore I often wonder greatly how such a bitter and vicious hatred could have come so suddenly into the hearts of those who had embraced us with such love. For we did not offend them even in the slightest way; nor did we give them a reason for persecuting us with such hatred. In fact, they are obliged to admit that our principal aim was to illumine the blessing and the glory of Christ and to teach the truth of the Gospel purely, now that God has revealed it through us to an ungrateful world in these last days. Then why do they hate us so bitterly? There is no other reason than that they have been listening to new teachers. Infected by their poison, they are so inflamed against us that they fume and rage with an implacable hatred.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/martin-luther.html">Martin Luther</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Luther’s Works</cite>, Vol. 26: Lectures on Galatians, 1535, Chapters 1–4, ed. Jaroslav Jan Pelikan, Hilton C. Oswald, and Helmut T. Lehmann, vol. 26 (Saint Louis: Concordia Publishing House, 1999), 413–14.</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/the-church.html">The Church</a></span></div>

</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-b9aa2973f1" data-kw="">
<blockquote><p>But the chief thing is, that Christ, the Sun of Righteousness, has so irradiated your mind with the light of his Gospel, that you understand that the true way of governing the Church is no other than what is to be derived from him, and that you at the same time know the difference between that genuine form of religion which he has instituted, and that fictious and degenerate form which was afterwards introduced; for you wholly understand that God’s worship has been corrupted and deformed, as innumerable superstitions have crept in, that the grace of Christ has been unworthily involved in great darkness, that the virtue of his death has been annihilated, that he himself has been almost lacerated and torn in pieces, that assurance of salvation has been plucked up by the roots, that consciences have been miserably and even horribly vexed and tormented, that wretched men have been led away from the sincere and right worship of God into various and perplexed labyrinths, that the Church has been cruelly and tyrannically oppressed; and, in short, that no real Christianity has been left.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/john-calvin.html">John Calvin</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Commentary on Hebrews</cite>, trans. John Owen (Bellingham, WA: Logos Bible Software, 2010), xxii.</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/the-church.html">The Church</a></span></div>

<blockquote><p>No sooner was it known that the [Scottish, civil] convention of estates [at Dundee] was to meet in March, 1689 [during the Glorious Revolution], than the Covenanters of the west resolved on repairing in a body to Edinburgh, to aid in protecting the meeting from the apprehended attack of the Jacobites [those for the previous king, James II]. Their assistance was far from being unnecessary… The sudden rising of Dundee having led to measures for the defence of the country, those of the Covenanters known by the name of Cameronians, chiefly in the neighbourhood of Douglas, raised a regiment of eight hundred men, without beat of drum or expense of levy, under the command of the Earl of Angus… Such was the origin of the Cameronian regiment… Discussions ensued, of a kind similar to those which had divided the counsels of the Covenanters at Bothwell. It was keenly debated among them whether it was not a “sinful association” to enlist under the same banner with other regiments, composed of those who had been malignants and abettors of tyranny, or who had not cleared themselves from the scandal of unlawful engagements. Owing to their pertinacity in these unreasonable scruples [longtime covenanter] Colonel Cleland, on whom the command of the regiment was devolved, very nearly lost temper, and he refused to accede to their demands, as subversive of all military discipline. But the matter was finally compromised by their agreeing on a brief general declaration, drawn up by Sir Patrick Hume of Polwart, and explained by Mr. Alexander Shields… It was to the effect that they “appeared in his majesty’s service in defence of the nation, recovery and preservation of the Protestant religion, and, in particular, the work of reformation in Scotland, in opposition to Popery, Prelacy, and arbitrary power, in all its branches and steps, until the government of church and state be brought back to their lustre and integrity, established in the best and purest times.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/thomas-m-crie-jr.html">Thomas M’Crie Jr.</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Story of the Scottish Church: from the Reformation to the Disruption</cite>, (London: Blackie &amp; Son, 1875), pp. 398-99</span></figcaption>

<blockquote><p>In the New Testament, Agabus the Prophet by the breath of God’s spirit, foretold of an universal famine over the whole world. Acts. 11.28. which fell out true in the reign of Claudius Caesar. These things it pleased God to reveal to his faithful servants, that in due time they might provide for themselves, least afterward to the disgrace of the name of Christians, they should be forced to seek for sustenance from the Paganish infidel. True it is that we read of some Astrologers, which have foretold both of plenty, and scarcity to come: among the rest Thales, as Diogenes Laettius recordeth, was accused that through giving himself wholly to the study of Philosophy, he neglected his family and private gain, whereupon having by natural causes foreseen that there should be the next year following a great scarcity of oil, he engrossed into his hands for that present year all the Olive Gardens, so that in the dearth he sold Oil at what price he list himself.

Whereby he shewed that Philosophy will serve for the enriching of a man, if he will so employ it. Notwithstanding this, and the like predictions of star-gazing diviners, howsoever they argue a possibility, yet no necessity of truth, having oft times been taken tardy. For God is not bound to these second causes, but eftsoons [sic] bringeth to pass many things besides, and contrary to the course of nature, so that there is much difference between the foretelling of the holy Prophets, and the conjectures of these Welkin Wizards, whose Prognostications of every year’s wars, diseases, heat, cold, drought, moisture, grounded upon no certainty, prove either manifest untruths, or conjectural guesses, most uncertain conclusions, most certain collusions. (So that one of their own late Prophets, as being guilty of their mockeries, hath very fitly prefixed before his yearly false oracles, I would say Almanacs, that speech of David, for the front verse of his calculations: Let God be true, and every man a liar.)

No doubt there is otherwise good use of the Ephemerides or Almanacs, by them to know the motion of the Moon, with set feasts, and other things of like kind: as for the rest of the contents, they are like unto them that make them, always certain in their uncertainty. Husbandmen also have their kind of observations, foretelling of tempests, &amp; winds through the whole year, the assurance whereof is (as we commonly speak) but Hit I miss I: sometimes true, very often false. For God being the Lord of nature, ruleth as himself pleaseth, without, yea, and against the rules of nature. To which power Salomon respecting, requesteth of God, that if in time of Famine, the people being assembled, should pray for plenty, it would please him so to cross or order those second causes, that the present plague might be removed. Which, if it should come rather by casual accidents, then by divine ordinance, should not need the use of prayers, were it never so extreme.

And what else meant God himself, Levit. 23.10. commanding his people of Israel, that the day after the Inning of the corn, they should bring a cease for an offering to the Lord, and shake it before him, and after that, it was lawful for them to eat bread of new wheat? And again in the feast of Pentecost, two loaves of their new corn, for a first fruits unto the Lord. vers. 17. In the Autumn also, the like use in the feast of Tabernacles: verse 39. then by all these ceremonies to teach them, that plenty ariseth not by man’s labour, sweat, or industry, but of God’s blessing only, and therefore he alone to be thanked, both for Harvest, and Vintage, and alone to be prayed unto, to preserve the corn, both on the ground, and in the barn, and withal to know how to use those blessings to Gods glory, and their own good. For this is the right use, saith Saint Paul, 1. Tim. 4.4. of God’s creatures, to sanctify them by prayer and thanksgiving.</p></blockquote>

<blockquote><p>On the other hand, it says that ‘David and Israel sang a hymn to God, that is with instruments’ and music (2 Sam. 6:5). David assembled such a multitude that all might worship God with one accord. He well knew that God had not made himself known to him alone, but had established the whole family of Abraham. Thus, David wanted everyone to imitate him, and showed the way for there to be mutual accord, that small and great might demonstrate that they wanted to serve God. Here we see the true use of hymns: we are to encourage one another to celebrate and magnify the name of God in our hymns (Eph. 5:19-20).

It would be enough for each one to pray to God in his heart, and for each one to give him thanks. This is the true worship of God: ‘Call upon me in the day of your trouble’ (Psa. 50:15), says the Lord, ‘and then praise me when you know that I have answered’. We can surely do that from the heart, but our mouth must state ever more clearly the very concerns which cause us to pray to God. Even though everyone can still privately invoke God by themselves, we have this privilege of assembling in public in order to testify to our faith, and then to encourage others by our example. When we pray to God here in the church, and sing the psalms, it is not to show ourselves off, as hypocrites do, but to declare that we seek nothing but that God may be glorified among us.

Our assembling in his name also should certainly serve as a thorn to prick us because of our laziness. That is how we are to encourage one another (Heb. 3:13), and that is why people were not to sing hymns of praise to God for only a temporary period of time, but until the end of the world. Since we are surrounded with flesh and blood, we need means such as these (to lift our spirit up to God), and thus the obligation to sing hymns of praise is common both to us and to the ancients.

There is a difference, however, concerning the instruments of music. It would be nothing but mimicry if we followed David today in singing with cymbals, flutes, tambourines and psalteries. In fact, the papists were seriously deceived in their desire to worship God with their pompous inclusion of organs, trumpets, oboes and similar instruments. That has only served to amuse the people in their vanity, and to turn them away from the true institution which God has ordained. We must, at the same time, be aware of all the privileges which we have in common with the fathers who have lived under the Law and, on the other hand, be aware of the things wherein they are separated from us.

All those things which we have in common with them are lasting, and must be maintained until the end of the world. But we are not to keep observing these things which were only for the time of the Law, unless we want to make a confused mixture which confounds heaven with earth. In a word, the musical instruments were in the same class as sacrifices, candelabra, lamps and similar things. There is nothing that the papists have not turned to some use. Because there was the chandelier with the lamps (in the Old Testament), thus there had to be candles (in the church); because there was perfume then, there had to be incense now. There were ritual washings then, so there had to be holy water now. The papists, in brief, have shown themselves in every possible way to be apes without any discretion!

As I have said, we must notice that what God had instituted for the time of symbols (before the coming of our Lord Jesus Christ) must be put aside and not enforced today. It is true that God ought to be heartily praised, both by musical instruments and by mouth. But it is another matter when we conduct the worship of God in church. If we want to sing praises in the name of God, we would do much better to have psalms instead of common dissolute songs. We sing in order to give him thanks – and not in order to produce a solemn ceremony as a meritorious work that we do for God.

Those who take this approach are reverting to a sort of Jewishism, as if they wanted to mingle the Law and the Gospel, and thus bury our Lord Jesus Christ. When we are told that David sang with a musical instrument, let us carefully remember that we are not to make a rule out of it. Rather, we are to recognise today that we must sing the praises of God in simplicity, since the shadows of the Law are past, and since in our Lord Jesus Christ we have the truth and embodiment of all these things which were given to the ancient fathers in the time of their ignorance or smallness of faith. They did not have such revelation as we have today in the Gospel.

In sum, we see how God was adored both in truth and in type. He was adored in truth because, in giving him praises, people magnified his name and recognised that all came from him. Nevertheless, there were types joined with the reality, insofar as they were necessary at that time. Today, we certainly have some pure worship of God is called heavenly, in that it is not enclosed amid these shadows, and with a half-effect. This is the meaning of the account of their moving the ark.</p></blockquote>

<blockquote><p>When the Heretick willeth me to prove from Scripture that Christ is very man; it is a vain thing he should demand of me beside to prove by Scripture, that Christ is such a one also as can laugh, weep, admire, sing, sigh, &amp;c. for these are presupposed to follow man’s nature; and if Scripture prove Christ to be a true man, it presupposeth by nature’s light, that he can laugh, he can weep, and that in some time, some place, in some habit, in some gesture, so he be a man; for that is presupposed by the light of nature, and known by the most Barbarous who never heard of Scripture …</p></blockquote>

<blockquote><p>By the one same act man both serves and worships God, for worship regards the excellence of God, to Whom reverence is due: while service regards the subjection of man who, by his condition, is under an obligation of showing reverence to God. To these two belong all acts ascribed to religion, because, by them all, man bears witness to the Divine excellence and to his own subjection to God, either by offering something to God, or by assuming something Divine.</p></blockquote>

</figure><figure class="quote" id="q-25402d0eb6" data-kw="">
<blockquote><p>The most important branches of your previous studies, in so far as concerns their immediate use and bearing upon the prosecution of the study of theology, are a knowledge of the Greek and Latin languages, and an acquaintance with mental philosophy, as, including the powers and faculties, the capacities and susceptibilities of the mind, the principles and laws bearing upon the right use and application of these powers and susceptibilities upon investigating truth, judging of evidence, and establishing duty.

No man can be regarded as having any pretensions to the character of a well-educated and accomplished theologian who has not read a considerable number of works which exist only in the Latin language; and hence the importance—we might almost say the necessity in the prosecution of theological study—of being so familiar with Latin as to be able to read ordinary theological Latin works, without finding much more difficulty, or requiring to spend much more time in the perusal of them, than you would on works in your own tongue.

This is the sort of measure of the familiarity which you ought to possess with Latin; and such a degree of acquaintance with it you will find a most important advantage in the prosecution of your studies. In regard to Greek, there are fewer books in this language than in Latin which it is necessary for you to read for the mere sake of the information they contain; but the language, as a language, it is still more indispensable that you should thoroughly understand, because it is that in which the most important part of the inspired Scriptures were composed.

A man’s real theological knowledge may be said practically and substantially to be measured by his real knowledge of the Greek Testament; and in order to understand aright the Greek Testament, it is of course indispensable that he be familiar with the Greek language. And this leads us to advert to the general subject of the necessity of an acquaintance with the original languages in which the word of God has been given us by its authors. The Old Testament, you are aware, is written in the Hebrew language, with the exception of two or three short passages in Chaldee; and the New Testament in Greek.

The Hebrew Old Testament and the Greek New Testament constitute the word of God given by the inspiration of his Spirit, and forming the only authoritative rule of faith and practice. The will of God is to be learned authentically only from an examination of books written in these languages; and hence it follows at once that every one who is really desirous to know the will of God, and to know it thoroughly and authentically, and especially every one who aspires to be a religious instructor of others, is bound to acquire such a knowledge of Hebrew and Greek as may qualify him to derive his knowledge of God’s will at once from the fountain-head, or at least to be able to test all the views that may be pressed upon him, by a reference to the only infallible standard, and to be qualified to defend, if necessary, his convictions upon religious subjects from the same sources.

A translation of the Scriptures into any other language merely shews the interpretation put upon them by those who have executed the translation; and though most translations of the Scriptures into modern languages give a sufficiently clear and correct exposition of the mind and will of God in his word to serve all the infinitely important purposes of general practical instruction, yet no one will be contented with a translation who desires to be thoroughly versant in divine revelation, and who is called upon to be prepared to give a reason of his faith, and to defend God’s truth against the assaults of error.

It is true that many, very many, have been guided by God’s Spirit into all truth; have been led to embrace Christ, and to become meet for heaven; have attained that knowledge of God and Jesus Christ, which is eternal life; who know God’s will only through the medium of a translation. Nay, more, it is certain that God has honoured with singular usefulness as ministers of the gospel men whom he himself had called to labour in his vineyard, although they knew nothing of Hebrew or Greek.

But it is true in this as well as in other matters, that God’s doings are not the rule of our duty, and that there rests an imperative obligation upon all who desire the office of a bishop to acquire, if they have the means and the opportunity, a knowledge of God’s revelation as it came from himself, and of course in the original languages. This is plainly comprehended in the more general obligation undoubtedly attaching to them to acquire as full and accurate a knowledge of God’s revelation as their circumstances admit of, before they venture to engage in the instruction of others.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/william-cunningham.html">William Cunningham</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Theological Lectures on Subjects Connected with Natural Theology, Evidences of Christianity, the Canon and Inspiration of Scripture</cite>, (New York: Robert Carter and Brothers, 1878), Lecture VI, pp 83-85.</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/worship.html">Worship</a></span></div>

— William Cunningham, Theological Lectures on Subjects Connected with Natural Theology, Evidences of Christianity, the Canon and Inspiration of Scripture, (New York: Robert Carter and Brothers, 1878), Lecture VI, pp 83-85.">Copy</button><a class="share" href="https://x.com/intent/post?text=%E2%80%9CThe+most+important+branches+of+your+previous+studies%2C+in+so+far+as+concerns+their+immediate+use+and+bearing+upon+the+prosecution+of+the+study+of+theology%2C+are+a+knowledge+of+the+Greek+and+Latin+languages%2C+and+an+acquaintance+with+mental+philosophy%2C+as%2C+including+the+powers+and+faculties%2C+the+capacities+and+susceptibilities+of+the+mind%2C+the+principles+and+laws+bearing+upon+the+right+use+and+application+of+these+powers+and+susceptibilities+upon+investigating+truth%2C+judging+of+evidence%2C+and+establishing+duty.%0A%0ANo+man+can+be+regarded+as+having+any+pretensions+to+the+character+of+a+well-educated+and+accomplished+theologian+who+has+not+read+a+considerable+number+of+works+which+exist+only+in+the+Latin+language%3B+and+hence+the+importance%E2%80%94we+might+almost+say+the+necessity+in+the+prosecution+of+theological+study%E2%80%94of+being+so+familiar+with+Latin+as+to+be+able+to+read+ordinary+theological+Latin+works%2C+without+finding+much+more+difficulty%2C+or+requiring+to+spend+much+more+time+in+the+perusal+of+them%2C+than+you+would+on+works+in+your+own+tongue.%0A%0AThis+is+the+sort+of+measure+of+the+familiarity+which+you+ought+to+possess+with+Latin%3B+and+such+a+degree+of+acquaintance+with+it+you+will+find+a+most+important+advantage+in+the+prosecution+of+your+studies.+In+regard+to+Greek%2C+there+are+fewer+books+in+this+language+than+in+Latin+which+it+is+necessary+for+you+to+read+for+the+mere+sake+of+the+information+they+contain%3B+but+the+language%2C+as+a+language%2C+it+is+still+more+indispensable+that+you+should+thoroughly+understand%2C+because+it+is+that+in+which+the+most+important+part+of+the+inspired+Scriptures+were+composed.%0A%0AA+man%E2%80%99s+real+theological+knowledge+may+be+said+practically+and+substantially+to+be+measured+by+his+real+knowledge+of+the+Greek+Testament%3B+and+in+order+to+understand+aright+the+Greek+Testament%2C+it+is+of+course+indispensable+that+he+be+familiar+with+the+Greek+language.+And+this+leads+us+to+advert+to+the+general+subject+of+the+necessity+of+an+acquaintance+with+the+original+languages+in+which+the+word+of+God+has+been+given+us+by+its+authors.+The+Old+Testament%2C+you+are+aware%2C+is+written+in+the+Hebrew+language%2C+with+the+exception+of+two+or+three+short+passages+in+Chaldee%3B+and+the+New+Testament+in+Greek.%0A%0AThe+Hebrew+Old+Testament+and+the+Greek+New+Testament+constitute+the+word+of+God+given+by+the+inspiration+of+his+Spirit%2C+and+forming+the+only+authoritative+rule+of+faith+and+practice.+The+will+of+God+is+to+be+learned+authentically+only+from+an+examination+of+books+written+in+these+languages%3B+and+hence+it+follows+at+once+that+every+one+who+is+really+desirous+to+know+the+will+of+God%2C+and+to+know+it+thoroughly+and+authentically%2C+and+especially+every+one+who+aspires+to+be+a+religious+instructor+of+others%2C+is+bound+to+acquire+such+a+knowledge+of+Hebrew+and+Greek+as+may+qualify+him+to+derive+his+knowledge+of+God%E2%80%99s+will+at+once+from+the+fountain-head%2C+or+at+least+to+be+able+to+test+all+the+views+that+may+be+pressed+upon+him%2C+by+a+reference+to+the+only+infallible+standard%2C+and+to+be+qualified+to+defend%2C+if+necessary%2C+his+convictions+upon+religious+subjects+from+the+same+sources.%0A%0AA+translation+of+the+Scriptures+into+any+other+language+merely+shews+the+interpretation+put+upon+them+by+those+who+have+executed+the+translation%3B+and+though+most+translations+of+the+Scriptures+into+modern+languages+give+a+sufficiently+clear+and+correct+exposition+of+the+mind+and+will+of+God+in+his+word+to+serve+all+the+infinitely+important+purposes+of+general+practical+instruction%2C+yet+no+one+will+be+contented+with+a+translation+who+desires+to+be+thoroughly+versant+in+divine+revelation%2C+and+who+is+called+upon+to+be+prepared+to+give+a+reason+of+his+faith%2C+and+to+defend+God%E2%80%99s+truth+against+the+assaults+of+error.%0A%0AIt+is+true+that+many%2C+very+many%2C+have+been+guided+by+God%E2%80%99s+Spirit+into+all+truth%3B+have+been+led+to+embrace+Christ%2C+and+to+become+meet+for+heaven%3B+have+attained+that+knowledge+of+God+and+Jesus+Christ%2C+which+is+eternal+life%3B+who+know+God%E2%80%99s+will+only+through+the+medium+of+a+translation.+Nay%2C+more%2C+it+is+certain+that+God+has+honoured+with+singular+usefulness+as+ministers+of+the+gospel+men+whom+he+himself+had+called+to+labour+in+his+vineyard%2C+although+they+knew+nothing+of+Hebrew+or+Greek.%0A%0ABut+it+is+true+in+this+as+well+as+in+other+matters%2C+that+God%E2%80%99s+doings+are+not+the+rule+of+our+duty%2C+and+that+there+rests+an+imperative+obligation+upon+all+who+desire+the+office+of+a+bishop+to+acquire%2C+if+they+have+the+means+and+the+opportunity%2C+a+knowledge+of+God%E2%80%99s+revelation+as+it+came+from+himself%2C+and+of+course+in+the+original+languages.+This+is+plainly+comprehended+in+the+more+general+obligation+undoubtedly+attaching+to+them+to+acquire+as+full+and+accurate+a+knowledge+of+God%E2%80%99s+revelation+as+their+circumstances+admit+of%2C+before+they+venture+to+engage+in+the+instruction+of+others.%E2%80%9D%0A%0A%E2%80%94+William+Cunningham%2C+Theological+Lectures+on+Subjects+Connected+with+Natural+Theology%2C+Evidences+of+Christianity%2C+the+Canon+and+Inspiration+of+Scripture%2C+%28New+York%3A+Robert+Carter+and+Brothers%2C+1878%29%2C+Lecture+VI%2C+pp+83-85.&amp;url=https%3A%2F%2F5solasquotes.github.io%2Fquote%2F25402d0eb6.html&amp;via=5Solas" target="_blank" rel="noopener">Share on X</a><a class="perma" href="../quote/25402d0eb6.html">Permalink</a><a class="src" href="https://reformedcovenanter.wordpress.com/2022/05/06/william-cunningham-on-the-need-for-ministers-to-learn-hebrew-greek-and-latin/" rel="noopener" target="_blank">Read it online · Reformed Covenanter</a><

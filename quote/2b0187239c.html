<main class="wrap"><figure class="quote" id="q-2b0187239c" data-kw="">
<blockquote><p>Thus Mt. 19:28, the Last Day is also called the day of regeneration unto the people of God; yet in this life they partake of that grace, but because then is the full perfection and manifestation of it, therefore the Scripture calls it the day of regeneration. Even as the apostle, Acts 13:33, applies that passage of the psalm to Christ’s resurrection, ‘This day have I begotten thee,’ because then was such a solemn and public declaration that he was the Son of God. No marvel then, if the Scripture do also call the day of judgment a time when sins shall be blotted out [Acts 3:19], because then is the public absolution of the godly; and according to philosophy motions receive their names from the term to which they tend.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/anthony-burgess.html">Anthony Burgess</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The True Doctrine of Justification Asserted &amp; Vindicated, from the Errours of Papists, Arminians, Socinians &amp; more especially Antinomians in 30 Lectures</cite>, (London: Miller, 1651), Lecture 29, on Acts 3:19, pp. 256-58</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/regeneration/nature-of-regeneration.html">Nature of Regeneration</a></span></div>

</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-e2b293669f" data-kw="">
<blockquote><p>(1) The natural life supposes generation; so does the spiritual, which is therefore expressed by ‘regeneration’, or by ‘being born again’, Jn. 3:3 and 1 Jn. 2:27. Now look, as in natural generation we are first begotten, and then born, so here there is an act qua regeneramur, ‘by which we are begotten again’, and qua renascimur, ‘by which we are born again’. There is an act of God, by which we are begotten again, viz. by the powerful influence of grace upon our hearts, accompanying in the Word, Jm. 1:18; and there is an act of God, by which we are born again, viz. when the new creature is formed in us, and begins to discover itself (“being born again, not of corruptible seed, but of incorruptible”). Effectual calling and sanctification are these two [respective] acts: by the one we are begotten, by the other born; the one may be called our passive, the other our active regeneration.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/thomas-manton.html">Thomas Manton</a></span><span class="wk"><span class="lbl">Work:</span> <cite>A Second Volume of Sermons preached by the late reverend and learned Thomas Manton in two parts: the first containing 27 Sermons on the Twenty-Fifth chapter of St. Matthew</cite>, … (d. 1677; London: Astwood, 1684), Sermons on 2 Cor. 5, Sermon 30, on 2 Cor. 5:15, p. 190</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/sanctification/nature-of-sanctification.html">Nature of Sanctification</a></span><span class="t"><a href="../topics/regeneration/nature-of-regeneration.html">Nature of Regeneration</a></span></div>

="noopener" target="_blank">Read it online · Reformed Books Online</a></div>
</figure><figure class="quote" id="q-dd631f1209" data-kw="">
<blockquote><p>This will I briefly show, when that I have spoken of justification, the which precedes regeneration, from whom we may discern it, but not divide it, no more than heat from the fire. Justification in Scripture is taken for the forgiveness of our sins, and consists in the forgiveness of our sins. This is only God’s work, and we nothing else but patients and not agents. After this work, in respect of us and our sense, comes regeneration, which altogether is God’s work also: for, as to our first birth we bring nothing (bring, quoth I? yes, we bring to let [prevent] it many things, but to further it nothing at all)…</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/john-bradford.html">John Bradford</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Writings of John Bradford</cite>, … Parker Society (d. 1555; Cambridge Univ. Press, 1848-1853), “Election &amp; Free-Will”, vol. 1, p. 217 Bradford (1510–1555).</span></figcaption>

</figure><figure class="quote" id="q-819fdb1e4d" data-kw="">
<blockquote><p>Further I say that the force and efficacy of this most pure holiness which is in the flesh of Christ, flows even into us by the working of the Holy Ghost in us, so as we be hallowed in ourselves, that is to say, we be segregated from the defilings of this world, and serve God both in spirit and body. Which benefit is everywhere in the Scriptures called sanctification, or holiness, regeneration, or newbirth, illumination or enlightening, the new man, the new creature, and the Spirit or Spiritualness.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/theodore-beza.html">Theodore Beza</a></span><span class="wk"><span class="lbl">Work:</span> <cite>A Book of Christian Questions &amp; Answers</cite>, … (London: How, 1574), p. 45</span></figcaption>

<blockquote><p>§IV. It [sanctification] is distinguished from regeneration. For regeneration, strictly taken, signifies the beginning of the spiritual life; but sanctification, the progress and continuation of the spiritual life, made through the habits of the spiritual virtues, by which the faithful are gradually led to perfection, although many take regeneration in a broader sense as a synonym for sanctification.</p></blockquote>

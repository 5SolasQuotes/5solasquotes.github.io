<main class="wrap"><figure class="quote" id="q-9db79a3fbd" data-kw="">
<blockquote><p>To praying aright is required light and warmth, a light of the mind, and warmth of affections; the former for the matter, the latter for the manner. And it is a false light and warmth that makes some natural men think that sometimes they pray aright, Isa. lxiii. 2. But all genuine light, and vital warmth comes from the Spirit, Eph. i. 17, 18; 2 Tim. i. 7.

Hence the emblem of the virtue of the Holy Spirit was “cloven tongues, like as of fire,” Acts ii. 3, 4. And the effect thereof is someway compared with that of drunkenness (which excuses it no more than Christ’s being compared to a thief excuses stealing, Rev. xvi. 15); for as the liquor being received to excess, influences the man, so that things come in his head which otherwise would not, and the affections and passions are wrought up by it, Prov. xxiii. 33, so the Spirit indwelling and influencing, presents to the mind matter of prayer, and works up the affections suitable thereto, Eph. v. 18, 19, Cant. vii. 9.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/thomas-boston.html">Thomas Boston</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Discourses on Prayer</cite>, (1727) in The Whole Works of the Late Reverend Thomas Boston of Ettrick, ed. Samuel McMillan (12 vols, Aberdeen: George and Robert King, 1852), 11: 58.</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/prayer.html">Prayer</a></span></div>

</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-d15a6d0bf8" data-kw="">
<blockquote><p>It is very odd how difficult it seems for some persons to understand just what Calvinism is. And yet the matter itself presents no difficulty whatever. It is capable of being put into a single sentence; and that, one level to every religious man’s comprehension. For Calvinism is just religion in its purity. We have only, therefore, to conceive of religion in its purity, and that is Calvinism.

In what attitude of mind and heart does religion come most fully to its rights? Is it not in the attitude of prayer? When we kneels before God, not with the body merely, but with the mind and heart, we have assumed the attitude which above all others deserves the name of religious. And this religious attitude by way of eminence is obviously just the attitude of utter dependence and humble trust. He who comes to God in prayer, comes not in a spirit of self-assertion, but in a spirit of trustful dependence. No one ever addressed God in prayer thus: “O God, thou knowest that I am the architect of my own fortunes and the determiner of my own destiny. Thou mayest indeed do something to help me in the securing of my purposes after I have determined upon them. But my heart is my own, and thou canst not bend it. When I wish thy aid, I will call on thee for it. Meanwhile, thou must await my pleasure.” Men may reason somewhat like this; but that is not the way they pray. […]

The Calvinist is the man who is determined to preserve the attitude he takes in prayer in all his thinking, in all his feeling, in all his doing. That is to say, he is the man who is determined that religion in its purity shall come to its full rights in his thinking, and feeling, and living. This is the ground of his special mode of thought, by reason of which he is called a Calvinist; and as well of his special mode of acting in the world, by reason of which he has become the greatest regenerating force in the world. Other men are Calvinists on their knees; the Calvinist is the man who is determined that his intellect and heart, and will shall remain on their knees continually, and only from this attitude think, and feel, and act. Calvinism is, therefore, that type of thought in which there comes to its rights the truly religious attitude of utter dependence on God and humble trust in his mercy alone for salvation.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/benjamin-b-warfield.html">Benjamin B. Warfield</a></span><span class="wk"><span class="lbl">Work:</span> <cite>What is Calvinism? in Selected shorter writings of Benjamin B. Warfield</cite></span></figcaption>

</figure><figure class="quote" id="q-21dd2b3f57" data-kw="daily bread">
<blockquote><p>By this petition we ask of God all things in general that our bodies have need to use under the elements of this world [Gal. 4:3], not only for food and clothing but also for everything God perceives to be beneficial to us, that we may eat our daily bread in peace. Briefly, by this we give ourselves over to his care, and entrust ourselves to his providence, that he may feed, nourish, and preserve us. For our most gracious Father does not disdain to take even our bodies under his safekeeping and guardianship in order to exercise our faith in these small matters, while we expect everything from him, even to a crumb of bread and a drop of water.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/john-calvin.html">John Calvin</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Institutes of the Christian Religion</cite>, 3.20.44</span></figcaption>

<blockquote><p>Chrysostom addeth also this reason why we should pray: That by often calling upon God we may become familiar with him. Again, that we may more highly esteem, and more reverently use that which God bestoweth upon us when we ask and knock.

These things are carefully to be thought upon concerning the necessity and benefit of prayer, least that being otherwise too cold and backward unto prayer by these conceits, that God is forward to help us of his own accord, we do suffer our selves to be withdrawn from the exercise of prayer.

Neither let us abuse that most sweet sentence of the ready good-will of God toward us, which ought rather to be an incitation and a motive to excite and confirm our diligence &amp; confidence in prayer. There be some which reason thus, or at least do trouble themselves with those conceits: seeing God unasked, and before we pray doth know, yea beforehand hath set down &amp; appointed what he will do and what he will give: we do therefore either ask in vain, that which otherwise should come to pass; or else do wickedly in praying, as though we hoped by our prayer to turn God from his firm decree and purpose, and so make him changeable and constant [inconstant?].

To this objection some answer thus. If that which we ask be ordained beforehand to be done, then we pray upon good and sure confidence. If it be not, yet we go not about to hinder or stop the course of God’s predestination; because we pray that God’s will may be done. But Luther’s exposition is more plain &amp; safe; to wit, that we are not commanded to busy our selves about the hidden foreknowledge of God, or to search into his secret counsels: but we must dispose our selves according to his will revealed unto us in his word, where he teacheth that by repentance and prayer, God’s wrath is appeased, many dangers and evils are avoided, and many benefits obtained. Jer. 18. v. 8. Ezek. 33. v. 11.1. King. 8. v. 56. And therefore he hath straitly charged us to pray: yea he is angry when no man sets himself by prayer between the Lord and the land lest it be destroyed, Ezek. 22. v. 30. Both these therefore do warn us to pray, first that God of his own accord is ready to help, and knoweth what we want, &amp; what himself will do.

Secondly, that it is his will and commandment we should pray. Neither must we from the secret foreknowledge of god, frame or admit exceptions against those things which are plainly revealed and commanded in the word. If thou canst not reconcile them, leave unto God the hidden reasons of his secret foreknowledge, and doe thou those things which are commanded and appointed to thee in the revealed word; to wit, that thou mayest pray and that continually. These things I have noted by occasion of that saying: Your heavenly father knoweth whereof ye have need, even before ye ask, Math. 6. v. 8.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/martin-chemnitz.html">Martin Chemnitz</a></span><span class="wk"><span class="lbl">Work:</span> <cite>A substantial and Godly exposition of the prayer commonly called the Lord’s Prayer</cite>, (Cambridge: John Legate, 1598), pp 5-7.</span></figcaption>

<blockquote><p>God will punish our original and actual sins both temporally and eternally. God punishes sin temporally with all manner of general and specific maladies of both soul and body, pouring out His just wrath upon sinners. God’s Word, and sooner or later our experience, yields thousands upon thousands of examples of what God does; and when we consider this rightly and reflect upon it, we clearly observe God’s hatred and wrath toward sin.

The nature of sinful men, however, is that their dreadful hardness of heart and perseverance in sin is such that they neither acknowledge nor feel God’s manifold punishments and judgments. As Scripture teaches, the more they are stricken, the more they revolt (Isa. 1:5).

However, due to His holiness and spotless righteousness, God will not only punish sin temporally, but also eternally. He is an eternally living and unchangeable God, and thus if the sinner is not converted during this life, he will eternally and unchangeably remain God’s enemy and will continue to sin against Him.

God must therefore of necessity continue to punish the sinner as being His enemy eternally, doing so with the most severe punishments and judgments in soul and body. The Holy Scriptures teach this very clearly and abundantly, describing for us the punishments of the damned and ungodly as an “eternal fire” (Matt. 25:46) “where their worm dieth not” (Mark 9:44) and as a smoke of torment that ascends forever and ever (Rev. 14:11).</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/theodorus-vandergroe.html">Theodorus VanderGroe</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Christian’s Only Comfort in Life and Death: An Exposition of the Heidelberg Catechism</cite>, trans. Bartel Elshout, ed. Joel R. Beeke (1838-44; 2 vols, Grand Rapids MI: Reformation Heritage Books, 2016), 1: 52.</span></figcaption>

</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-cddc80d1d5" data-kw="">
<blockquote><p>Who is there amongst you, honourable brethren, who would not lament with me because of the sad state of our churches today, or rather about this frightening transformation itself, about which the entire Calvinistic Christendom is dismayed; about which heaven and earth are startled; about which the angels descending daily unto us from heaven are extremely sorrowful; about which finally the pulpits and the pews of the churches and academics shudder and become very devastated?

Who is there amongst you to be sent to the people of Zion as ministers of this prophecy of Isaiah of peace and salvation, which Paul says must be understood to be the preachers of the New Testament (Rom. 10)? Who, considering this prophecy with me, does not burst out in this lament: Where, O Isaiah, is your promise of the very glad coming of the shepherds who preach peace, good, salvation, and the kingdom of God? Where are their lovely, sincere, and beautiful feet, radiating before God and His people through the rays of the truth, through clear manifestation of a lawful calling, and through the clarity of a guiltless association.

Is it not so on the other hand that very many black, crooked, deformed feet are seen, those which are not sent of God, but have entered into the sheepfold of Christ from somewhere other than through the true door, and, contaminated with evil morals, much rather introduce their good thoughts than Christ’s gospel, much prefer their corrupt disputes than the beneficial peace of Christ?

I exhort you that you no longer permit, through more delay, the weeds of errors, strifes, and disagreements to be spread along with the serving of the good seed of the gospel in our Netherlands, through the secret and crafty practices of the devil, but, earnestly paying attention to a capable remedy for the healing of the wounds of our churches, that you labour in every possible way to that end, that you, with me, satisfy the great expectations, commands, and desires of all pious hearts who confess the same religion with us. We must rescue the healthy doctrine of our old Reformed churches. Let us take away the rising differences amongst us, not according to our own intelligence, but according to the mind of the Holy Spirit, revealed to us in His Holy Word.

The synod must chase away these three armourbearers sent from hell by the prince of darkness, namely, false human tradition, discord, and the freedom of all to teach and to present God’s Word as everyone sees fit, by which they have disturbed and almost overthrown the churches up until now. When you will return home from this synod, the whole multitude of these consistories and of the citizens of Dordrecht and your fellow citizens and brothers in Christ will call you together and congratulate you, to have finished so weighty and great a matter. All will say, “How lovely are the feet of those who have now restored again to the Dutch churches peace, salvation, and the wholesome rest of the kingdom of Jesus Christ.</p></blockquote>

</figure><figure class="quote" id="q-ed34e8b466" data-kw="">
<blockquote><p>Properly speaking, Christ&#x27;s Resurrection is not the meritorious cause, but the efficient and exemplar cause of our resurrection.... And since, as was stated above (Reply to Objection 2), the primary cause of human resurrection is the Divine justice, from which Christ has &quot;the power of passing judgment, because He is the Son of Man&quot; (John 5:27); the efficient power of His Resurrection extends to the good and wicked alike, who are subject to His judgment.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/thomas-aquinas.html">Thomas Aquinas</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Summa Theologiae, pt. 1</cite>, III, q. 56, a. 1, ad 3</span></figcaption>

</figure><figure class="quote" id="q-233498c302" data-kw="">
<blockquote><p>We must not say that the heavenly Jerusalem, which is the mother of all the faithful, consists only of those who belong to the new covenant, who believed in the gospel of the kingdom of God after the coming of Christ the Savior and who believe nowadays.

All those who were chosen in the Old Testament are also included, whether they lived under the law or before it was given. The earthly Jerusalem with its system of government began to be the mother of the physical people of God in the time of David, but that is no reason why its heavenly equivalent should be reduced to those dimensions and interpreted as having begun only with the New Testament.

Far from it! The church of the firstborn and elect is universal. It consists of all the children of God who were chosen from the foundation of the world, and is their mother. Paul includes all these people when he says, “who is the mother of us all,” and speaks of himself as being one of them.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/wolfgang-musculus.html">Wolfgang Musculus</a></span><span class="wk"><span class="lbl">Work:</span> <cite>In Epistolas Apostoli Pauli ad Galatas et Ephesios Commentarii</cite>, (Basel, 1561). Quoted in Gerald L. Bray, Timothy F. George, Scott M. Manetsch (eds), Reformation Commentary on Scripture X: Galatians, Ephesians (Downers Grove IL: IVP Academic, 2011), pp 162-63.</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/judgment-and-the-final-state/heaven-and-eternal-glory.html">Heaven and Eternal Glory</a></span></div>

All those who were chosen in the Old Testament are also included, whether they lived under the law or before it was given. The earthly Jerusalem with its system of government began to be the mother of the physical people of God in the time of David, but that is no reason why its heavenly equivalent should be reduced to those dimensions and interpreted as having begun only with the New Testament.

Far from it! The church of the firstborn and elect is universal. It consists of all the children of God who were chosen from the foundation of the world, and is their mother. Paul includes all these people when he says, “who is the mother of us all,” and speaks of himself as being one of them.”

— Wolfgang Musculus, In Epistolas Apostoli Pauli ad Galatas et Ephesios Commentarii, (Basel, 1561). Quoted in Gerald L. Bray, Timothy F. George, Scott M. Manetsch (eds), Reformation Commentary on Scripture X: Galatians, Ephesians (Downers Grove IL: IVP Academic, 2011), pp 162-63.">Copy</button><a class="share" href="https://x.com/intent/post?text=%E2%80%9CWe+must+not+say+that+the+heavenly+Jerusalem%2C+which+is+the+mother+of+all+the+faithful%2C+consists+only+of+those+who+belong+to+the+new+covenant%2C+who+believed+in+the+gospel+of+the+kingdom+of+God+after+the+coming+of+Christ+the+Savior+and+who+believe+nowadays.%0A%0AAll+those+who+were+chosen+in+the+Old+Testament+are+also+included%2C+whether+they+lived+under+the+law+or+before+it+was+given.+The+earthly+Jerusalem+with+its+system+of+government+began+to+be+the+mother+of+the+physical+people+of+God+in+the+time+of+David%2C+but+that+is+no+reason+why+its+heavenly+equivalent+should+be+reduced+to+those+dimensions+and+interpreted+as+having+begun+only+with+the+New+Testament.%0A%0AFar+from+it%21+The+church+of+the+firstborn+and+elect+is+universal.+It+consists+of+all+the+children+of+God+who+were+chosen+from+the+foundation+of+the+world%2C+and+is+their+mother.+Paul+includes+all+these+people+when+he+says%2C+%E2%80%9Cwho+is+the+mother+of+us+all%2C%E2%80%9D+and+speaks+of+himself+as+being+one+of+them.%E2%80%9D%0A%0A%E2%80%94+Wolfgang+Musculus%2C+In+Epistolas+Apostoli+Pauli+ad+Galatas+et+Ephesios+Commentarii%2C+%28Basel%2C+1561%29.+Quoted+in+Gerald+L.+Bray%2C+Timothy+F.+George%2C+Scott+M.+Manetsch+%28eds%29%2C+Reformation+Commentary+on+Scripture+X%3A+Galatians%2C+Ephesians+%28Downers+Grove+IL%3A+IVP+Academic%2C+2011%29%2C+pp+162-63.&amp;url=https%3A%2F%2F5solasquotes.github.io%2Fquote%2F233498c302.html&amp;via=5Solas" target="_blank" rel="noopener">Share on X</a><a class="perma" href="../quote/233498c302.html">Permalink</a><a class="src" href="https://reformedcovenanter.wordpress.com/2024/03/15/wolfgang-musculus-on-the-old-testament-saints- <blockquote><p>What will the destruction of the earth be like? Will it be annihilated by the final conflagration or will it be restored and renewed? It is not inquired whether it will occur by a conflagration of fire. For the Scriptures so expressly declare this that no Christian can or ought to doubt it: “The heavens and the earth are reserved unto fire” (2 Pet. 3:7); “The heavens shall pass away with a great noise, and the elements shall melt with fervent heat.”</p></blockquote>

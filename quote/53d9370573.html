<main class="wrap"><figure class="quote" id="q-53d9370573" data-kw="">
<blockquote><p>Here comes in that question, whether or not the power of the temporal magistrate (as such) be so derived from Christ, not only as God, but as Mediator, so that he is his deputy and vice-gerent. The negative may be made good by these following arguments:

1. The power of Christ’s deputies as Mediator is only ministerial, the power of servants or heralds (Lk. 22:25-26; Mt. 20:25-27): as Protestants prove against Papists in the controversy touching the supremacy of the Pope. But now the power of magistrates may be imperial and monarchical, and therefore it is not derived from Christ as He is Mediator unto his deputies.

2. All the deputies and vice-gerents of Christ as Mediator are obliged to promote the Kingdom and Gospel of Christ. But now heathenish magistrates that never heard, nor could hear of the name of Christ, are not bound to promote Christ’s Mediatory Kingdom and gospel: for they are invincibly ignorant thereof, and there can be no obligation without revelation (Jn. 15:22; Rom. 2:12). Therefore they are not the deputies and vice-gerents of Christ as Mediator, and therefore [they are] no magistrates as such: for, à quatenus ad de omni valet consequentia.

3. All the deputies and vice-gerents of Christ as Mediator have their commission from the Gospel; but now temporal magistrates have their commission at least from the secondary law of nature, the law of nations. But now the law of nature and nations dictates nothing of a Mediator, or anything relating unto Him as such. I should send the reader unto Mr. Gillespie in his Aaron’s Rod Blossoming, Book 2, chs. 6–7; to see farther of this subject, but because Mr. Baxter thinks Mr. Rutherford a more able disputant than Gillespie, I shall refer unto him, in his Lex &amp; Rex, Question 42, from pp. 422-433, as also his Divine Right of Church Government, [ch. 28] from pp. 600-42 where he prosecutes these and other arguments at large…</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/henry-jeanes.html">Henry Jeanes</a></span><span class="wk"><span class="lbl">Work:</span> <cite>A Mixture of Scholastical Divinity, with Practical, in Several Tractates</cite>, (Oxford, 1656), p. 43. Jeanes was an English presbyterian minister.</span></figcaption>

</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-b5af0f9625" data-kw="">
<blockquote><p>It is true that Calvin has intimated more than once his con- viction, that the position laid down by some of the schoolmen, viz. that Christ died ” sufficienter pro omnibus, efficaciter pro electis,” is sound and orthodox in some sense. But then he has never, so far as we remember or have seen proved, explained precisely in what sense he held it, and there is a sense in which the advocates of particular redemption can consistently admit and adopt it.† † When the subject of the extent of the atonement came to be more fully and exactly discussed, orthodox Calvinists generally objected to adopt this scholastic position, on the ground that it seemed to imply an ascription to Christ of a, purpose or intention of dying in some sense for all men. For this reason they usually declined to adopt it as it stood, or they proposed to alter it into this form, — Christ’s death was sufficient for all, efficacious for the elect. By this change in the position, the question was made to turn, not on what Christ did, but on what His death was; and thus the appearance of ascribing to Him personally a purpose or intention of dying, in some sense, for all men, was removed.</p></blockquote>

</figure><figure class="quote" id="q-ed9d4ca90e" data-kw="">
<blockquote><p>Answer: You are neither to lay such a supposition down that either you are excluded from the number of those that Christ died for or included in that number: neither of the two are revealed to you, and secret things belong to the Lord. It is enough to you that: 1. you are not excluded, for anything that is revealed to you.

2. That thou have need of Christ, and are a guilty sinner.

3. That thou art commanded to believe: As for Christ’s not shedding of his blood for thee; say it were so: it’s no more absurd that you are obliged to believe on Christ as an all sufficient Redeemer for remission of sins (though remission be not purchased to you in Christ’s blood)…</p></blockquote>

</figure><figure class="quote" id="q-bb7c5b46b9" data-kw="">
<blockquote><p>Is not Christ the Redeemer of all men? No: for He is a Redeemer neither to Pharaoh, nor Judas, neither unto Ciaphas, nor Herod, neither unto Julian, not in brief to all those that are damned or without hope, for whom they neither He died. Did Christ die for all men? His death was sufficient for all, say the Schoolmen, but effectual only for the Elect and them that are faithful. If we respect the virtue and force of Christ’s blood, it is sufficient for the redemption of all: but if we look upon the purpose and eternal counsel of God, and the goodwill of the Mediator, he died for the elect only. John 10:15, I lay down my life for my sheep, says Christ, and 17:9, I pray not for the world, but I pray for them whom thou have given me. Therefore He neither offered sacrifice for it, neither did He redeem it. And verse 19, For their sakes who believe, and whom the Father has given Me, I sanctify Myself. And Matt 26:28, My blood which is shed for many for the remission of sins.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/william-bucanus.html">William Bucanus</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Institutions of Christian Religion Framed out of God’s Word, &amp; the Writings of the Best Divines</cite>, (London, 1606), pp. 433-34</span></figcaption>

<div class="actions"><button class="copy" data-copy="“Is not Christ the Redeemer of all men? No: for He is a Redeemer neither to Pharaoh, nor Judas, neither unto Ciaphas, nor Herod, neither unto Julian, not in brief to all those that are damned or without hope, for whom they neither He died. Did Christ die for all men? His death was sufficient for all, say the Schoolmen, but effectual only for the Elect and them that are faithful. If we respect the virtue and force of Christ’s blood, it is sufficient for the redemption of all: but if we look upon the purpose and eternal counsel of God, and the goodwill of the Mediator, he died for the elect only. John 10:15, I lay down my life for my sheep, says Christ, and 17:9, I pray not for the world, but I pray for them whom thou have given me. Therefore He neither offered sacrifice for it, neither did He redeem it. And verse 19, For their sakes who believe, and whom the Father has given Me, I sanctify Myself. And Matt 26:28, My blood which is shed for many for the remission of sins.”

<main class="wrap"><figure class="quote" id="q-e35882e0b2" data-kw="">
<blockquote><p>Thirdly, another cause of eternal reprobation is the act and working of distinguishing love, and everlasting grace: God has universal love, and particular love; general love, and distinguishing love; and so accordingly does decree, purpose, and determine: from general love, the extension of general grace and mercy; but from that love that is distinguishing, peculiar grace and mercy: Was not Esau Jacob’s Brother? Yet I loved Jacob, says the Lord, that is, with a better love, or a love that is more distinguishing: As he further makes appear in his answer to our Father Abraham, when he prayed to God for Ishmael: As for Ishmael, says He, I have heard thee; behold, I have blessed him, and will also make him fruitful: but my Covenant will I establish with Isaac, whom Sarah shall bear unto thee. Touching which words, there are these things observable: Mal. 1:2; Gen. 17:18,19, etc. 1. That God had better Love for Isaac, than he had for his Brother Ishmael. Yet, 2. Not because Isaac had done more worthy and goodly deeds, for Isaac was yet unborn.

3. This choice Blessing could not be denied to Ishmael because he had disinherited himself by sin; for this Blessing was entailed to Isaac, before Ishmael had a being also. Rom. 4:16-19; Gen. 15:4-5; Gen. 16.

4. These things therefore must needs fall out through the working of distinguishing love and mercy, which had so cast the business, that the purpose of God according to Election might stand. Further, Should not God decree to show distinguishing love and mercy, as well as that which is general and common, He must not discover his best love at all to the sons of men. Again, if He should reveal and extend his best love to all the World in general, then there would not be such a thing as Love that does distinguish; for distinguishing love appears in separating between Isaac and Ishmael, Jacob and Esau, the many called, and the few chosen. Thus by virtue of distinguishing love, some must be reprobate: For distinguishing love must leave some, both of the angels in Heaven, and the inhabitants of the Earth; wherefore the decree also that does establish it, must needs leave some.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/john-bunyan.html">John Bunyan</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Reprobation Asserted</cite>, ch. 4, ‘Of the Causes of Reprobation’</span></figcaption>

</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-f3d1a654ef" data-kw="">
<blockquote><p>4…. but the conscience is more dull in apprehending that spiritual vengeance follows such spiritual sins as unbelief, because until there be some supernatural revelation, we are dead to the Gospel truths, and Gospel sins, but when a common grace heightens the soul to a supernatural assent, that Christ is a Teacher sent of God (Jn. 7:28; Jn. 3:2), the conviction is more strong: But because it is more supernatural, and in stead of kindly affection of love which it wants [lacks], it is mixed with hatred and anger and so degenerates into fiery indignation against the Holy Ghost, as Jn. 15:24 compared with Mt.12:15; 26:31 clears.</p></blockquote>

<blockquote><p>VII. (2) The question [at hand to be discussed] is not whether God is born by a general love and philanthropy (philanthropia) towards men as his creatures, and also bestows upon them various temporal benefits pertaining to the things of this life (ta biotika). We do not deny that God has never left Himself without witness (amartyron) with regard to this (Acts 14:17). And we readily grant that there is no one who does not owe some gratitude to God and who, whatever he is or can do, is not bound to give thanks to his Creator. But the question concerns the special and saving love which tends to spiritual benefits, and by which God willed to have mercy upon them to salvation. We think this is particular to the elect alone, not universal and common to all.</p></blockquote>

<blockquote><p>VI. The negative act includes two: both preterition, by which in the election of some to glory as well as to grace, he neglected and slighted others (which is evident from the event of election); and negative desertion, by which he left them in the corrupt mass and in their misery. However this is so to be understood: (that the are not excepted from the laws of common providence, but remain subject to them; nor are they immediately deprived of all God’s favor [Latin: gratia, or grace], but only of the saving and a vivifying (which is the fruit of election)</p></blockquote>

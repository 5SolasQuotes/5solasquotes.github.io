<main class="wrap"><figure class="quote" id="q-eaafafeacf" data-kw="">
<blockquote><p>Nebuchadnezzar made a Law, that if any did blaspheme the God of Sidrach, Misach, and Abednego, he should be slain, and his house made a dunghill. Moses made a law, that every blasphemer should be stoned to death. Seeing God and Princes have made such straight Laws against such lewd railers, good Rulers should see some correction done, and not with silence to suffer ill men to talk their pleasure on God’s City, Religion and ministry …</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/james-durham.html">James Durham</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Parliament’s commission: delivered in a sermon, upon Nehemiah chap. 2 vers. 19, 20</cite>, (London: R. Austin, 1643), p. 5.</span></figcaption>

</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-b5413bcc5f" data-kw="">
<blockquote><p>Questions about babies who have died in their mother’s womb, about miscarried fetuses, the malformed and similarly abnormal babies can be duly resolved once the hypothesis is laid concerning the infusion of the soul (anima). For either the bodies truly were animate with a human soul, or they were not animate. If the former, then the resurrection applies to them, too, If not, then conequently excluded from the resurrection are such bodies to which the definition of human being does not apply.</p></blockquote>

</figure><figure class="quote" id="q-b8491921ea" data-kw="">
<blockquote><p>Now it was seen, and made plain to the World, that the suffering People in Scotland acted upon on Principles of Enthusiasm, blind Zeal or religious Frenzy, as their Enemies suggested; that they were no Enemies to Monarchy, Civil Government, order of Society, and the like, as had been scandalously said; but that they kept strictly to the Rule of God’s Word, adhered to an honest Cause, and acted upon just Principles: And when such Kings were called to the Throne, as desired to Rule for God, and the Good of the People, who made the Laws of God and Man the Rule of their Government, and the Prosperity of Religion, and of their Subjects the End of it; they knew how to obey, serve and defend such Princes with the Blood and Treasure, as well as they had Courage to resist and reject those, who, with the Breach of Faith, Honour or Constitution, became Tyrants and Persecutors, Enemies to God, and Destroyers of Men, as their former Princes had been.

This is evident by their Practice, at the Revolution; in that no sooner was the Prince of Orange Landed in England, and the Enemies of our Constitution began to stagger, but these People immediately took Arms, and successfully chased the bloody Party, out of their Country. But when this was done, what Measures did they take? Did they set up KING JESUS as a Temporal Prince, and the fifth Monarchy in his Name? Did they Preach the Doctrine of Dominion founded on Grace, or form Schemes of Republican Government? Did they erect themselves as Tyrants in the Room of those they pulled down, so making the People change their Masters, not their Yoke?

NO, NO, they adhered to the Legal Constitution of their Country, they submitted cheerfully to the Return of Magistracy, and the free Course of the Laws of their Country, they armed themselves, and came up to Edinburgh at their own Charge, formed themselves into Companies; indeed, they were able to have formed a considerable Army, and offered themselves to March to any Part of the Nation against the Popish and Jacobite Party; and especially they offered, and were accepted, and admitted to Guard the Convention of Estates, against the Attempt of the Duke of Gordon, who at that Time commanded a Popish Garrison in the Castle of Edinburgh; and against all, of any Denomination that should attempt to Disturb them; and to the eternal Honour of the wild Antimonarchical, Enthusiastic, Lunatic Cameronians, for so their Enemies had called them; they were the first Men in Scotland, that addressed or petitioned the Convention of Estates, to Place the Crown of Scotland on the Head of their Delivered King WILLIAM, which was done accordingly; to the restoring of Religion, healing the Breaches of Scotland, and the utter Confusion of their Persecutors …</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/daniel-defoe.html">Daniel Defoe</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Memoirs of the Church of Scotland, In Four Periods</cite>, (London: Eman. Matthews, 1717), pp 300-02.</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/civil-government-and-society.html">Civil Government and Society</a></span></div>

</figure><figure class="quote" id="q-bb107e019b" data-kw="">
<blockquote><p>VI. Magistrates should not think they have sufficiently discharged their duty, when they have promoted the civil good of the subjects, by keeping them in peace, by ruling them according to the laws of the land; but they should also see to their spiritual good, and labour for the advancement of religion and piety within their dominions, by encouraging the faithful servants of God, and such as are truly pious; by restraining vice and impiety, and punishing such as are heretics and erroneous seducers of the people; for they are the ministers of God for good, among whom heretics and seducers are to be ranked, Phil. iii. 2. 2 John 10. 11. as being such as should be shunned, 2 Cor. vii. 11. Tit. iii. 10. 2 Tim. iii. 5. 6. Rom. xvi. 17. 18. See Gen. xxxv 2. 3. 4. 18. 2 Chron. xxxiii. 15.16. 34. and xix. 4. Ezra vi. 11. and vii. 26. Dan. iii. and vi. Exod. xxxii. 26. 27. 28. Deut. xiii. and xvii. 2. Zech. xiii. 1 to 7. For the apostle is here speaking of the magistrate as he ought to be, be he Heathen or Christian; He beareth not the sword in vain, but is to execute wrath upon such as do evil.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/john-brown.html">John Brown</a></span><span class="wk"><span class="lbl">Work:</span> <cite>An Exposition of the Epistle of Paul the Apostle to the Romans, with Large Practical Observations; Delivered in Several Lectures</cite>, (Edinburgh: David Paterson, 1746), pp 506-07.</span></figcaption>

Reformed Covenanter</a></div>
</figure><figure class="quote" id="q-888559a1bd" data-kw="">
<blockquote><p>It’s now high time that every crime be brought to punishment: Wrath long contained, and oft refrained, at last must have a vent. Justice severe cannot forbear to plague sin any longer; But must inflict with hand most strict mischief upon the wronger. … Eternal smart is the desert ev’n of the least offence; Then wonder not if I allot to you this recompence: But wonder more that, since so sore and lasting plagues are due To every sin, you liv’d therein, who well the danger knew. .. Die feign they would, if die they could but death will not be had; God’s direful wrath their bodies hath for ev’r immortal made. They live to lie in misery. and bear eternal woe: And live they must whil’st God is just, that He may plague them so. … O love the Lord, all ye his saints, who hath Redeemed you from everlasting wrath: Who hath by dying made your souls to live, And what He dearly bought doth freely give. Give up your selves to walk in all his ways, And study how to live unto his praise. The time is short you have to serve Him here: The day of your deliverance draweth near. Lift up your heads, ye upright ones in heart, Who in Christ’s Purchase have obtain’d a part; Behold! He rides upon a shining cloud, With angel’s voice, and trumpet sounding loud. He comes to save his folk from all their foes, And plague the men that holiness oppose. So come, Lord Jesus, quickly come we pray, Yea come and hasten our Redemption Day.</p></blockquote>

<div class="actions"><button class="copy" data-copy="“It’s now high time that every crime be brought to punishment: Wrath long contained, and oft refrained, at last must have a vent. Justice severe cannot forbear to plague sin any longer; But must inflict with hand most strict mischief upon the wronger. … Eternal smart is the desert ev’n of the least offence; Then wonder not if I allot to you this recompence: But wonder more that, since so sore and lasting plagues are due To every sin, you liv’d therein, who well the danger knew. .. Die feign they would, if die they could but death will not be had; God’s direful wrath their bodies hath for ev’r immortal made. They live to lie in misery. and bear eternal woe: And live they must whil’st God is just, that He may plague them so. … O love the Lord, all ye his saints, who hath Redeemed you from everlasting wrath: Who hath by dying made your souls to live, And what He dearly bought doth freely give. Give up your selves to walk in all his ways, And study how to live unto his praise. The time is short you have to serve Him here: The day of your deliverance draweth near. Lift up your heads, ye upright ones in heart, Who in Christ’s Purchase have obtain’d a part; Behold! He rides upon a shining cloud, With angel’s voice, and trumpet sounding loud. He comes to save his folk from all their foes, And plague the men that holiness oppose. So come, Lord Jesus, quickly come we pray, Yea come and hasten our Redemption Day.”

<main class="wrap"><figure class="quote" id="q-56ca4a6008" data-kw="">
<blockquote><p>Although he took on him those infirmities which belong unto our human nature as such, and are inseparable from it until it be glorified, yet he took none of our particular infirmities which cleave unto our persons, occasioned either by the vice of our constitutions or irregularity in the use of our bodies. Those natural passions of our minds which are capable of being the moans of affliction and trouble, as grief, sorrow, and the like, he took upon him; as also those infirmities of nature which are troublesome to the body, as hunger, thirst, weariness, and pain,—yea, the purity of his holy constitution made him more highly sensible of these things than any of the children of men;—but as to our bodily diseases and distempers, which personally adhere unto us, upon the disorder and vice of our constitutions, he was absolutely free from them.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/john-owen.html">John Owen</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Works</cite>, vol. 3, Pneumatologia, or a Discourse Concerning the Holy Spirit, bk. 2, ch. 3, p. 167</span></figcaption>

<blockquote><p>Pantachus [a Lutheran]: As you say, the Word of God is certainly impassible and immutable, but because of the hypostatic union the Word [logos], so to speak, was affected in the same way as if it had suffered and died. Orothetes [reformed]: Except for your interjection ‘so to speak,’ I would reject your statement as unacceptable. For the Word of God is not affected since He is in no way changed. You have a case of why the Scriptures and the Fathers sometimes use such terminology in that they are mainly concerned with the Person. Neither was it possible, because of the unity of the two natures, for the divine hypostasis not to be present at the passion and death. But as Irenaeus said most wisely, ‘The Word was present and remained and acquiesced [consented and allowed], but He Himself did not die or suffer. Likewise our soul is present to man at death, that is, to the flesh, but the soul itself does not die. Hence let us confess that Christ suffered and died, but in the flesh, as Peter says [1 Pet. 4:1], or as regards the man.’ (For Irenaeus as quoted by Theodoret, see PG 83:284) Cyril was somewhat more forceful in the struggle against Nestorius, who pulled apart the natures and acknowledged no union of the divine nature with the human other than one based on merit… Cyril urged this union so hard that at first his teaching was rejected. For he spoke as if he believed that the Word of God Himself had literally suffered and died. But when he later explained his terminology, he was accepted as a faithful and sound teacher. Besides, when Eutyches was later condemned by the Council of Chalcedon for imagining that Christ had only one nature and maintaining that the Word of God was turned into flesh and had really and truly suffered, been crucified, and died in his own nature, more caution was observed in the sermons, statements, and terminology… Hence when we regard as verbal the communication of idioms [properties] what is impossible for either the human or the divine nature, it is verbal in this way: it has the hypostatic union as a solid root and firm foundation. Hence it does not follow that we say that Christ is God only verbally. We confess that He really is God and consubstantial with the Father regarding the divine nature, although his human nature is not divine. But you Pantachus, with considerable contempt have gathered from our statements the conclusion that for us Christ is God nominally. Who could plausibly think that about us, who testify in most explicit terms that there never existed in Christ a human nature without its adhering to the divine person?… I beg you, tell us whether according to your [Lutheran] ubiquity [of the human nature], if I understand with my mind and not my body and I hunger with my body and not my mind, do I therefore hunger or understand only verbally? Similarly when we say that Christ truly and suffered and died insofar as He was a man, you cannot rightly construe this as if He suffered and died only verbally… …although I deny that the Word of God really suffered and died, still I do not claim that the passion and death did not involve it at all, for the Word was present at the passion and death, as has been said, because of the hypostatic union, although in a quiescent way. It was not affected by any suffering or by a new quality. Hence it is not empty words that the Son of God suffered and died since that nature and flesh which He made his own and to which He was present by a union of Person, really and truly suffered and died. But I would never say, as you are used to asserting, that the Word [logon] Himself really and truly both suffered and died. … …I see your [Pantachus’s] explanation as admitting two interpretations. The first is that you understand the Son of God to have suffered and died in the sense that the passion and death sprang from the human nature but nonetheless so that they reached to the Word itself and reached in a way that the Word truly suffered and died. Some expressions of Cyril back at the Council of Ephesus conveyed that sense, which seriously offended many people. Surely it should be beyond dispute that the Word is impassible and immutable. Therefore I will not agree with such a statement. Neither do I retreat from the interpretation given by Cyril himself… The second sense is that which we usually express when we say that Christ suffered and died not from the nature of the Godhead but from the nature of the humanity, namely that the passion and death proceeded from the humanity and were terminated in it since they did not pass through nor penetrate the Word itself because it could neither die nor suffer. But if they Word is said to die and suffer, that means that the nature which it made its own through the incarnation died and suffered. Cyril expressed clearly this point in the passage you quoted when he writes: ‘The Word calls its own things which are proper to the flesh,’ and so forth. (PG 75:1405) It was not speaking falsely in calling them its own since they belong to that flesh that it assumed in the hypostatic union.</p></blockquote>

cs-by-subject/christ/the-human-and-divine-natures-of-christ/#:~:text=Pantachus%20%5Ba%20Lutheran%5D%3A%20As%20you%20say,it%20assumed%20in%20the%20hypostatic%20union&amp;text=Pantachus%20%5Ba%20Lutheran%5D%3A%20As%20you%20say%2C%20the%20Word&amp;text=flesh%20that%20it%20assumed%20in%20the%20hypostatic%20union" rel="noopener" target="_blank">Read it online · Reformed Books Online</a></div>

<blockquote><p>Theodoret does rightly and truly tell us that even the common people are hardly accustomed to speak any otherwise [about Christ’s person and his natures]: for if Peter speak, who would not rather say that Peter speaks, than say that Peter’s body or tongue speaks? and yet notwithstanding, neither does Peter’s mind, nor his foot nor any other member speak, but his tongue or mouth. But because these things have even personally grown up (as it were) together [in the Logos’s assumption of human nature], and are come into one subsistence or being, that is truly in the concrete attributed to, and spoken of the whole, which if it were uttered of the parts of the whole considered severally and by themselves, should be falsely spoken. What more? By reason of this personal union [between a person and his nature], though now it be dissolved through death, Peter shall be said to have died and sat [buried] at Rome, whose soul yet notwithstanding, neither is dead, neither anywhere placed upon the earth. So when I say [that] the eternal Son of God died, I consider and mean Him as He is whole-Christ, although I denominate Him after one of his natures, to wit, his mortal or human nature. So again I say [that] this man forgives sins, and yet not as He is man of Himself (for it belongs only to God to forgive sins), but because He is God and man in one person together.</p></blockquote>

<div class="actions"><button class="copy" data-copy="“Theodoret does rightly and truly tell us that even the common people are hardly accustomed to speak any otherwise [about Christ’s person and his natures]: for if Peter speak, who would not rather say that Peter speaks, than say that Peter’s body or tongue speaks? and yet notwithstanding, neither does Peter’s mind, nor his foot nor any other member speak, but his tongue or mouth. But because these things have even personally grown up (as it were) together [in the Logos’s assumption of human nature], and are come into one subsistence or being, that is truly in the concrete attributed to, and spoken of the whole, which if it were uttered of the parts of the whole considered severally and by themselves, should be falsely spoken. What more? By reason of this personal union [between a person and his nature], though now it be dissolved through death, Peter shall be said to have died and sat [buried] at Rome, whose soul yet notwithstanding, neither is dead, neither anywhere placed upon the earth. So when I say [that] the eternal Son of God died, I consider and mean Him as He is whole-Christ, although I denominate Him after one of his natures, to wit, his mortal or human nature. So again I say [that] this man forgives sins, and yet not as He is man of Himself (for it belongs only to God to forgive sins), but because He is God and man in one person together.”

— Theodore Beza, Two Very Learned Sermons of Mr. Beza, together with a Short Sum of the Sacrament of the Lord’s Supper… (London, 1588), ‘The First Homily… 1574’, pp. 38-9">Copy</button><a class="share" href="https://x.com/intent/post?text=%E2%80%9CTheodoret+does+rightly+and+truly+tell+us+that+even+the+common+people+are+hardly+accustomed+to+speak+any+otherwise+%5Babout+Christ%E2%80%99s+person+and+his+natures%5D%3A+for+if+Peter+speak%2C+who+would+not+rather+say+that+Peter+speaks%2C+than+say+that+Peter%E2%80%99s+body+or+tongue+speaks%3F+and+yet+notwithstanding%2C+neither+does+Peter%E2%80%99s+mind%2C+nor+his+foot+nor+any+other+member+speak%2C+but+his+tongue+or+mouth.+But+because+these+things+have+even+personally+grown+up+%28as+it+were%29+together+%5Bin+the+Logos%E2%80%99s+assumption+of+human+nature%5D%2C+and+are+come+into+one+subsistence+or+being%2C+that+is+truly+in+the+concrete+attributed+to%2C+and+spoken+of+the+whole%2C+which+if+it+were+uttered+of+the+parts+of+the+whole+considered+severally+and+by+themselves%2C+should+be+falsely+spoken.+What+more%3F+By+reason+of+this+personal+union+%5Bbetween+a+person+and+his+nature%5D%2C+though+now+it+be+dissolved+through+death%2C+Peter+shall+be+said+to+have+died+and+sat+%5Bburied%5D+at+Rome%2C+whose+soul+yet+notwithstanding%2C+neither+is+dead%2C+neither+anywhere+placed+upon+the+earth.+So+when+I+say+%5Bthat%5D+the+eternal+Son+of+God+died%2C+I+consider+and+mean+Him+as+He+is+whole-Christ%2C+although+I+denominate+Him+after+one+of+his+natures%2C+to+wit%2C+his+mortal+or+human+nature.+So+again+I+say+%5Bthat%5D+this+man+forgives+sins%2C+and+yet+not+as+He+is+man+of+Himself+%28for+it+belongs+only+to+God+to+forgive+sins%29%2C+but+because+He+is+God+and+man+in+one+person+together.%E2%80%9D%0A%0A%E2%80%94+Theodore+Beza%2C+Two+Very+Learned+Sermons+of+Mr.+Beza%2C+together+with+a+Short+Sum+of+the+Sacrament+of+the+Lord%E2%80%99s+Supper%E2%80%A6+%28London%2C+1588%29%2C+%E2%80%98The+First+Homily%E2%80%A6+1574%E2%80%99%2C+pp.+38-9&amp;url=https%3A%2F%2F <blockquote><p>The kind of feelings, by which Christ was tempted, is also worthy of notice. Matthew says that he was affected by grief and sorrow (or anxiety); Luke says that he was seized with anguish; and Mark adds that he trembled. And whence came to Him both sorrow and anxiety and fear, except because He felt in death something sadder and more horrible than the separation of the soul and body? And certainly He underwent death, not merely that He might move from earth to heaven, but rather that He might take on Himself the curse to which we were liable, and deliver us from it. His horror was not, then, at death simpliciter, as a passage out of the world, but because He had before his eyes the dreadful tribunal of God, and the Judge Himself armed with inconceivable vengeance; it was our sins, the burden of which He had assumed, that pressed Him down with their enormous mass. It is, then, not at all strange if the dreadful abyss of destruction tormented Him grievously with fear and anguish.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/john-calvin.html">John Calvin</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Commentary on Matthew</cite>, 26 | v. 37</span></figcaption>

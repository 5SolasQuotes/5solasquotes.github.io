<main class="wrap"><figure class="quote" id="q-e80cc9a422" data-kw="">
<blockquote><p>3. The kingdom of the Son of God is twofold: universal and singular. 4. The universal kingdom of the Son of God is the kingdom that, by nature, God Himself truly possesses in common with the Father and the Holy Spirit throughout the universe, from eternity to eternity, and this by nature or by natural right, as the Only Begotten Son of God the Father. Hence, it is also called the divine kingdom by Athanasius in his work De Incarnatione Verbi Contra Arianos (On the Incarnation of the Word Against the Arians), Volume 1, Page 476. This same natural kingdom of His is accustomed to be called. 5. He has never relinquished nor will He ever relinquish this kingdom. 6. The singular kingdom of the Son of God is His special possession within the Church, which is His mystical body. It is often called the kingdom of gift and acquisition. 7. It encompasses both grace and glory. 8. The kingdom of grace is the governance of the Church in this life, in which Christ exhibits His grace to His elect for the attainment of their eternal salvation. This kingdom is called “human” by Athanasius in the aforementioned passage because it is administered by the Son of God in His capacity as the Word made flesh, voluntarily and graciously undertaking the role of Mediator. Hence, it is also appropriately called the “Economical” or “Mediatorial” kingdom, as it pertains specifically to us humans. 9. Christ will deliver this kingdom to God the Father, as stated in 1 Corinthians 15:24. As Athanasius noted in the previously mentioned passage, the Lord of heaven assumed the likeness of our humanity and took upon Himself the human throne of David, who is His Father according to the flesh, in order to rebuild and restore it. Through this restoration, we all reign in Him, and He will deliver the restored human kingdom to His Father. … 13. That God may be all in all [1 Cor. 15:28], that is, that God the Father may reign through the Son, through His own Word, after He has reigned here through Him as the Savior, as the same Athanasius piously declares. 14. The kingdom of glory is the governance of the Son of God, which will accompany the universal resurrection of all the dead. When the restoration and glorification of God’s elect are completed, they will contemplate the glory of God the Father in the Only Begotten Son through the Holy Spirit for eternity, and they will be blessed without end in the present vision of God and will reign gloriously with Christ.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/amandus-polanus.html">Amandus Polanus</a></span><span class="wk"><span class="lbl">Work:</span> <cite>‘Analytical Theses on Colossians, containing the Exordium of the Epistle’, pt. 1</cite>, tr. Jonathan Tomes (Basel: Johannes Schroeter, 1601) | section XIV, Consequences</span></figcaption>

</figure><figure class="quote" id="q-947bf1611f" data-kw="">
<blockquote><p>Thirdly, howsoever an absolution shall be completed at the Day of Judgment, yet our justification shall not abide in such a way as it is in this life. Now our justification is by pardon of sin, and a righteousness without us imputed to us, which is instrumentally applied by faith; but this way shall then cease, for having perfect righteousness inherent in ourselves, we shall need no covering. It is true, the glory and honour of all this will redound upon Christ, and He shall not be the less glorified because He has then brought us to the full end of all his sufferings. I know some may doubt whether any righteousness but that which is infinite can please God, and therefore, as some think, the angels were accepted of God through Christ, though perfect; so it may be of the saints in heaven. But I see no ground for this. This seems to be undoubted, that the way of justification by faith in Christ arises because of our imperfection and sinfulness remaining in us, and therefore is justificatio viae, not patriae—’a justification’ of us ‘in our way,’ not when we come to ‘our home’.</p></blockquote>

<blockquote><p>2. Nor does the deity of Christ stand in the way, which, since it itself demands satisfaction, does not seem able to receive it from itself, for justice is toward another (Socinus part 3, ch. 5). For I deny that a real diversity must always intervene between the one who makes satisfaction and the one to whom it is made (which is sufficiently refuted from civil affairs: the treasurer general, when his stipend is owed to him, is the same one who ought to pay and to whom it ought to be paid). A moral and virtual distinction suffices here, that is, a diversity of status and mode of subsistence. And thus in Christ, the formal principle of Christ’s actions as Mediator is different from the formal principle as God, whence Christ considered κατ᾽ οἰκονομίαν [according to the economy] made satisfaction to the second person of the divinity considered οὐσιωδῶς [essentially].</p></blockquote>

<blockquote><p>The second sort of divines (Contra-Remonstrants) [those against the Arminians] distinguish the sufficiency and efficiency of Christ’s death. In respect of the worth and greatness of the price, He died for all men: because it was sufficient for the redemption of every man in the world if they did repent and believe; and God might, without impeachment of justice, have offered salvation to every man in the world had it been his pleasure. In the efficiency, as every man or any man has fruit by the death of Christ, so Christ died for him. But this is not of one kind: some fruit is common to every man; for as Christ is lord of all things in heaven and earth, even the earthly blessings which infidels enjoy may be termed fruits of Christ’s death. Others proper to the members of the visible Church, and common to them, as to be called by the word, enjoy the ordinances of grace, live under the covenant, partake of some graces that come from Christ, which, through their fault, be not saving; and in this sense Christ died for all that be under the covenant. But other fruits of Christ’s death, according to the will of God and intention of Christ as Mediator, be peculiar to the sheep of Christ, his brethren, them that be given unto him of the Father, as faith unfeigned, regeneration, pardon of sin, adoption, etc.; and so they hold Christ died efficiently for his people only, in this sense,–namely, so as to bring them effectually to faith, grace, and glory.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/john-ball.html">John Ball</a></span><span class="wk"><span class="lbl">Work:</span> <cite>A Treatise of the Covenant of Grace</cite>, (1645), pp. 205-6, According to Mitchell and Struthers, who compiled the 1800’s edition of the Notes to the Westminster Assembly, Ball’s work “was held in high esteem by the Puritans, and [was] recommended by Reynolds, as well as Calamy and several other members of the Westminster Assembly.”</span></figcaption>

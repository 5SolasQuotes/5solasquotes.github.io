<main class="wrap"><figure class="quote" id="q-4211d83ec0" data-kw="">
<blockquote><p>5. God calls upon sinners to turn to Him by the internal voice and motions of His Spirit… There is a twofold call of the Spirit: more common and more special.

1. More common, and so many are called which never are thoroughly converted. It was the common work of the Spirit which made Felix tremble, which brought Agrippa within a step of Christianity and caused Herod to do many things. Multitudes of unregenerate ones have felt the waters stirred, the Holy Ghost moving them to conversion, and have readily proffered His aid and assistance, and perhaps, for awhile, they have been led by Him. But then they have refused to let go of some lust or vanity which He has bid them abandon. They would not turn their spiritual sloth into serious diligence about the concerns of their immortal souls, and so by disregarding His motions, and by slighting His help, they have made the Spirit to go away in grief who came in love to work upon them.

2. There is a call of the Spirit which is more special and efficacious…</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/thomas-vincent.html">Thomas Vincent</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Conversion of a Sinner, Explained and Applied, a sermon on Eze. 33:11</cite>, 1669, in The Puritans on Conversion (Soli Deo Gloria, 1990), pp. 105-7</span></figcaption>

</figure><figure class="quote" id="q-ed4087ec9b" data-kw="">
<blockquote><p>Dr. Preston answered that Christ was in himself sufficient to save all; and might be said to be provided for that end and use; as a medicine is to cure infected poison, though it cures none actually but those that drink it. “Habet in se quod omnibus prosit, sed, si non bibitur, non,” as in 1 John 5:11-12. But many did not thus apply Christ, because they had him not so offered and exhibited as others had, Matt 11:21; Luke 10:13, for God gave some faith and repentance, as I have showed. The serpent (Moses was commanded to make), was in itself sufficient to cure those that were bitten, Num. 21:8-9, yet cured none but only those who looked on it. “So, as Moses lifted up the Serpent in the wilderness, shall the Son of Man be lifted up, that whosoever believed in Him should not perish but have everlasting life,” John 3:14-15.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/john-preston.html">John Preston</a></span><span class="wk"><span class="lbl">Work:</span> <cite>This is John Ball’s</cite>, (1590-1659) narrative of Preston’s debate with the Arminian Francis White (1564-1638). From Ball’s, The Life of the Renowned Doctor Preston, ed. by E. W. Harcourt (London: Parker &amp; Co., 1885), p. 135. This quote was compiled by Tony Byrne.</span></figcaption>

<blockquote><p>[407] Although vicarious atonement as the acquisition of salvation in its totality cannot therefore be expanded to include all persons individually, this is not to say that it has no significance for those who are lost. Between the church and the world there is, at this point, not just separation and contrast. It is not the case that Christ has acquired everything for the former and nothing for the latter. … And also his work has value for all, even for those who have not believed and will never believe in Him. For though it is true that Christ did not, strictly speaking, acquire the natural life by his suffering and death, yet the human race was spared on account of the fact that Christ would come to save it. Christ is not the head of all human beings, not the prophet, priest, and king of everyone, for He is the head of the church and has been anointed king over Zion. Yet all human beings owe a great deal to Christ. The light shines in the darkness and illumines every person coming into the world. The world was made through him and remains so, though it did not recognize him. Also as the Christ, He gives to unbelievers many benefits: the call of the gospel, the warning to repent, historical faith, a virtuous life, a variety of gifts and powers, offices and ministries within the church, such as, for example, even the office of an apostle in the case of Judas. “Without Jesus Christ the world would not exist, for it would necessarily either be destroyed or be a hell” (Pascal). Even hanging from the cross, He still prays for forgiveness for the appalling sin being committed by the Jews at that very moment.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/herman-bavinck.html">Herman Bavinck</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Reformed Dogmatics: God and Creation</cite>, 3:470-75</span></figcaption>

<blockquote><p>Now if we loudly preach all this, and testify to all this, namely that Christ is the power of God and the wisdom of God, always changeless, always imperishable, though He comes in the changeable and the perishable; never stained Himself, but making clean that which is stained; what is the crime that we commit, and wherefore are we hated? And what means this opposing array4 of new Altars? Do we announce another Jesus? Do we hint at another? Do we produce other scriptures? Have any of ourselves dared to say “Mother of Man” of the Holy Virgin, the Mother of God5: which is what we hear that some of them say without restraint? Do we romance about three Resurrections6? Do we promise the gluttony of the Millennium? Do we declare that the Jewish animal-sacrifices shall be restored? Do we lower men’s hopes again to the Jerusalem below, Imagining its rebuilding with stones of a more brilliant material? What charge like these can be brought against us, that our company should be reckoned a thing to be avoided, and that in some places another altar should be erected in opposition to us, as if we should defile their sanctuaries?</p></blockquote>

<blockquote><p>[The Objection of Quakers:] But our Psalms are not the same in meter, nor the same tunes which the Jews had. [Answer:] That seeing the singing of Psalms is a duty commanded, and amongst others, those of David, and has hid from us the Hebrew tunes, wherewith the Psalms of David were wont to be sung, it must needs follow that the Lord has left it to the liberty of the Church to sing them in such plain, grave tunes as may fit the solemnity of God’s worship, and that because that tunes are but circumstantial and not the substance; and the Church now in the days of the Gospel is not in her minority or young age, but in her man-age, or full grown age, as the apostle speaketh (Gal. 4:1-6), and therefore fitter to appoint circumstantial things in God’s worship than the Jews, being in their non-age.</p></blockquote>

e" rel="noopener" target="_blank">Read it online · Reformed Books Online</a></div>

<blockquote><p>With regard to public worship, the Presbyterian system is characterized by great simplicity and plainness. Many have censured the Presbyterian mode of worship as too plain–as not availing itself enough of those external means which tend to excite reverential emotion. But in this point, also, it took for its rule the simplicity of the Scriptures. The great idea presented in the Gospel is spiritual worship, free alike from multitudinous forms that cumber memory and distract the mind, and from a gorgeous apparatus that dazzles and beguiles the senses. Its object is to direct the eye of faith to the Savior alone, and to fill the mind with nothing but sacred truth. Such is scriptural simplicity in worship and in instruction; and this perfect example the Presbyterian Church strove closely to follow. Praise, prayer, and preaching, all simple, all direct, all spiritual, all from the heart, all for God’s glory and man’s salvation, were the sole elements and aim of Presbyterian worship. This was its idea of what public worship ought to be; because this was all for which the Gospel record gave authority. And the Scottish Reformers firmly held that will-worship was sinful and pernicious; that God alone could prescribe what mode of worship would be acceptable in his sight; and that it was equally dangerous to add to, or to take from, whatsoever God had commanded. They had seen too much of the ignorance, folly, and crime prevalent among those who were addicted to the sensuous and emotional worship of Rome, to attach much value to mere forma and show in matters of religion. And when they turned to the pure and simple worship of the New Testament, they beheld in it the majestic simplicity of the clear blue heavens in their cloudless glory. They felt, therefore, that they were rendering homage to the God of heaven best, when they were worshipping Him after the example of the Lord Jesus Christ and his apostles. No other defense for the plainness and simplicity of their mode of worship would they have offered; and no other defense does any true Presbyterian think it can require–perhaps it were more correct to say, in this very simplicity and plainness, so directly scriptural, consists its greatest merit. And it may be safely said, that in no other system has there been produced a greater amount of religious knowledge, strong faith, and practical piety throughout the entire body of worshippers.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/william-hetherington.html">William Hetherington</a></span><span class="wk"><span class="lbl">Work:</span> <cite>History of the Church of Scotland</cite>, … vol. 1 (1848), ‘Introductory Essay on the Principles &amp; Constitution of the Church of Scotland’, pp. xxix-xxx</span></figcaption>

<blockquote><p>By the Diataktic [Teaching] power [of the Church,] a synod may institute, restore or change, according to the condition and exigence of the Church, the external circumstances in the worship of God and ecclesiastical discipline: I mean those circumstances which are common both to civil and sacred societies, the conveniency whereof is determinable by the light of Nature, always observing the general rules of the Word, which commands that all be done to the glory of God, that all be done to edifying, that all be done in order and decency, that we give none offence, that we support the weak, that we give no place to the enemies of the truth, nor symbolize with idolaters, etc. Now for avoiding disorder and disconformity in a nation professing one religion [such as Scotland], it is fit that national synods give certain directions and rules even concerning these rites and circumstances, not having therein an arbitrary or autocratoric power, but being always tied to follow the rules foresaid.</p></blockquote>

<blockquote><p>Bishop Andrewes will have the feast of Easter drawn from that place 1 Cor. 5:8, where he says there is not only a warrant, but an order for the keeping of it, and he will have it out of doubt that this feast is of apostolical institution, because after the times of the apostles, when there was a contention about the manner of keeping Easter, it was agreed upon by all that it should be kept, and when the one side alleged for them St. John [for keeping it on Passover], and the other St. Peter [for keeping it on the Lord’s Day], it was acknowledged by both that the feast was apostolical. I answer, the testimony of Socrates [a church historian in the early Church] deserves more credit than the Bishop’s naked conclusion. ‘I am of opinion,’ says Socrates (bk. 5, ch. 22), ‘that as many other things crept in of custom in sundry places, so the feast of Easter to have prevailed among all people, of a certain private custom and observation.’ But whereas B. Lindsay in defense of B. Andrewes, replies that Socrates propounds this for his own opinion only, I answer that Socrates in that chapter proves his opinion from the very same ground, which B. Andrewes wrests, to prove that this Feast is Apostolical. For while as in that hot controversy about the keeping of Easter, they of the East alleged John the apostle for their author, and they of the west alleged Peter and Paul for themselves; Yet (says Socrates), there is none that can show in writing any testimony of theirs, for confirmation and proof of their custom. And hereby I do gather that the celebration of the Feast of Easter came up more of custom than by any law or canon.</p></blockquote>

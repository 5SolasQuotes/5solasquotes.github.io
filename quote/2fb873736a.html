<main class="wrap"><figure class="quote" id="q-2fb873736a" data-kw="">
<blockquote><p>It is not denied that the Scriptures contain many things hard to be understood; that they require diligent study; that all men need the guidance of the Holy Spirit in order to right knowledge and true faith. But it is maintained that in all things necessary to salvation they are sufficiently plain to be understood even by the unlearned.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/charles-hodge.html">Charles Hodge</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Systematic Theology</cite>, vol. 1, Introduction, ch. 6, §5</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/holy-scripture/perspicuity.html">Perspicuity</a> › <a href="../topics/holy-scripture/perspicuity/clarity.html">Clarity</a></span></div>

</figure><figure class="quote" id="q-4bd5742617" data-kw="">
<blockquote><p>Besides that, we are all priests, as I have said, and have all one faith, one Gospel, one Sacrament; how then should we not have the power of discerning and judging what is right or wrong in matters of faith? What becomes of St. Paul&#x27;s words, &quot;But he that is spiritual judgeth all things, yet he himself is judged of no man&quot; (1 Cor. ii. 15), and also, &quot;we having the same spirit of faith&quot;? (2 Cor. iv. 13). Why then should we not perceive as well as an unbelieving pope what agrees or disagrees with our faith?</p></blockquote>

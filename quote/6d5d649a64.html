<main class="wrap"><figure class="quote" id="q-6d5d649a64" data-kw="">
<blockquote><p>When God is said to desire something which does not occur, such as when He states, “O that there were such a heart in them, that they would fear Me, … that it might be well with them, and with their children for ever!” (Deuteronomy 5:29), or, “O that thou hadst hearkened to My commandments! then had thy peace been as a river” (Isaiah 48:18), He is speaking in the manner of men. Strictly speaking, such can never be said concerning the omniscient, omnipotent, immutable, and most perfect God. Rather, it indicates God‟s displeasure toward sin and how He delights in holiness. It indicates that sin is the reason why those blessings are withheld from them — blessings which they, according to His promise, would have received as a reward upon godliness.

The promises are made upon condition of obedience which is granted to the elect according to God‟s immutable purpose. When God says, “Have I any pleasure at all that the wicked should die? saith the Lord God: and not that He should return from His ways, and live?” (Ezekiel 18:23), this does not suggest that God‟s will is impotent. Rather, it indicates that God has no pleasure in the destruction of men, inasmuch as they are His creatures. He has pleasure in the exercise of righteousness and godliness, and in blessing the godly.</p></blockquote>

<blockquote><p>Besides, creation is the only first discovery of his dominion. Before the world was framed there was nothing but God Himself, and, properly, nothing is said to have dominion over itself; this is a relative attribute, reflecting on the works of God; He had a right of dominion in his nature from eternity, but before creation He was actually Lord only of a nullity; where there is nothing it can have no relation; nothing is not the subject of possession nor of dominion. There could be no exercise of this dominion without creation: what exercise can a sovereign have without subjects? Sovereignty speaks a relation to subjects, and none is properly a sovereign without subjects. To conclude: from hence does result God’s universal dominion; for being Maker of all, He is the ruler of all, and his perpetual dominion; for as long as God continues in the relation of Creator, the right of his sovereignty as Creator cannot be abolished.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/stephen-charnock.html">Stephen Charnock</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Discourses upon the Existence &amp; Attributes of God 2 vols</cite>, (NY: 1853), vol. 2 | Discourse 13, ‘On God’s Dominion’, p. 370</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/attributes-of-god/affections-and-passions-in-god.html">Affections and Passions in God</a></span></div>

oks Online</a></div>

<blockquote><p>Inasmuch, moreover, as the divine affections are understood as descriptive of God’s movement or egress toward the finite order, they are not only to be understood as communicable attributes par excellence, they are also attributes defined primarily in their relationship to finite objects. It is by these affectiones or virtues that God sustains his relations with creatures–they are the preeminent example of the so-called communicabilia or relative attributes. (Mastricht, Theoretic-practica theologia, II.xv.19) In attempting to define the issue still more precisely, Owen distinguished between ‘attributes of Deity which, in order to their exercise, require no determined object antecedent to their agress’ and ‘attributes which can in no wise have an egress or be exercised without an object predetermined, and, as it were, by some circumstances prepared for them.’ (Owen, Dissertation of the Divine Justice, in Works, X, p. 508) The affections fall, clearly, into the latter category, the virtues into the former.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/richard-muller.html">Richard Muller</a></span><span class="wk"><span class="lbl">Work:</span> <cite>PRRD</cite>, (Baker, 2003), pt. 2, ch. 6.3, 3. ‘Doctrinal Conclusions’, pp. 559-60</span></figcaption>

<blockquote><p>Again, it is asked about what is said, “And God is called angry; but there is no anger in Him.” For He seems to speak wrongly, because in God there is a rational and a concupiscible power: therefore by equal reason an irascible power must be posited in God: therefore just as the act of cognition and love is truly in Him, so properly is the act of fury. I answer: It must be said that the irascible [power] in some way sounds of imperfection by the definition of its name; and therefore some say that it is in no way received in God, not even transumptively. However, since the acts of this power in us are to glory and to dominate, and these are in God; why not similarly this power? And it must be said therefore that in God there is truly this power of glorying and dominating, which is the divine substance itself. However, because anger has a passion conjoined to it by the definition of its name, therefore neither the irascible [power] nor anger is received in God, except transumptively and in tropical speech. And it is to be noted that God has signs of anger, not which signify anger in Him, but which signify anger in us and truly, when they are in us.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/bonaventure.html">Bonaventure</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Commentary on the Sentences</cite>, (d. 1274), bk. 1, dist. 45, Doubt 10 tr. AI by The Faith Received</span></figcaption>

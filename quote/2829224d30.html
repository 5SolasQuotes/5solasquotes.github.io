<main class="wrap"><figure class="quote" id="q-2829224d30" data-kw="saints memory not worship">
<blockquote><p>At the outset, we oppose the calumnies of the papists who slander us as despisers and enemies of the saints because we repudiate the worship of them (as if disgrace were thrown upon the saints when what belongs to God and Christ alone is not attributed to them). Now although their memory is very sacred to us, still we think that care should be diligently taken that they be not worshipped to the injury of God.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/francis-turretin.html">Francis Turretin</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Institutes of Elenctic Theology</cite>, 11.9</span></figcaption>

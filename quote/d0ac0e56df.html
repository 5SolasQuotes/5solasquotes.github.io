</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-c8c44b1c87" data-kw="">
<blockquote><p>Secondly: neither is there any contradiction in these words, of themselves: for to know which are the canonical books may be held to be a substantial point and belonging to the faith, and yet not simply necessary to salvation: he knows little if he cannot distinguish between a simple and absolute necessity, and a necessity not absolute: as some things are absolutely necessary to salvation without the which a man cannot be saved: as Heb. 10:36… But in another sense the apostles write, Acts 15:28, “It seemed good, etc. to lay no more burden upon you than these necessary things”: yet was it not simply necessary to abstain from blood and things strangled, but convenient and profitable for that time because of offence: so to know which books are canonical, though it be not simply necessary to salvation, if a man hold the foundation: yet is it necessary, as a profitable mean for the increase of faith: and though it be not so substantial as the foundation of faith, yet is it substantial, as many necessary parts in an house are beside the foundation.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/andrew-willet.html">Andrew Willet</a></span><span class="wk"><span class="lbl">Work:</span> <cite>A Retection, or Discovery of a False Detection Containing a True Defence of Two Books, entitled, Synopsis Papismi, and Tetrastylon Papisticum</cite>, (1603), pp. 70-71</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/civil-government-and-society/marriage-and-family.html">Marriage and Family</a></span></div>

<blockquote><p>Epiphanius writes (Heresies, 61), ‘There were a sect, a branch of the old Cathari [12th-14th centuries, southern Europe], or Puritans, (as he says) which called themselves Apostolici, propter exactum disciplinae studium, etc., for an extraordinary desire they had above other men to have discipline and all things to the exact pattern of the apostles’ days;’ which is itself an imagination. For, it were cacozelia, an apish imitation, to retain all in use then, seeing diverse things even then were but temporaria. For beside their canon in matters of knowledge (Gal. 6:16), they had their dogmata or decreta, not of equal importance; as was that of eating ‘things strangled, and blood’ (Acts 15:20), which no man now thinks himself bound to abstain from. And besides their epitaxes, commandments in matter of practice (1 Cor. 7:10), they had their diataxes, injunctions, not of equal regard with the former. Such were their agapae, love-feasts after the sacrament (Jude 12): and their celebrating the sacrament after supper (1 Cor. 11:20-12) [in the evening, as the word in Greek for ‘supper’, δεῖπνον, in the Lord’s ‘Supper’, intimates]; which no Church at this day does imitate. Therefore, to press all that was in that time is an imagination. And, as to press all so of these things that remain, to press all alike, or think an equal necessity of them, which was a parcel of the imagination of the Donatists. For, some things the apostles peremptorily commanded (1 Cor. 7:10); Some things they had no commandment for, but only gave counsel (1 Cor. 7:25); Some things they commanded and taught (1 Tim. 4:11); somethings they taught and exhorted (1 Tim. 6:2); whereof each was to be esteemed in his own value and worthiness; Neither to dispense with the commandment, nor to make a matter of necessity of the counsel. Both which have not a little harmed the Church. Lastly, to these matters of counsel, which for the most part are things indifferent, they also fall upon two imaginations. 1. Some say: omnia mihi licent [‘all is lawful to me’] (1 Cor. 10:23), and so [if] it be not condemned as unlawful, make no bones of it, which tends to all profaneness. [2.] Others say, ‘Touch not, taste not, handle not’ (Col. 2:21), which speak of things indifferent as merely unlawful, which imagination ends in superstition. A mean [middle] way would be holden between them both, that neither ‘a snare be cast’ (1 Cor. 7:35) on men’s consciences by turning non expedit [not expedient] into non licet [not permitted], nor our ‘liberty’ in Christ (Gal. 5:13) [to] be made an occasion to the flesh by casting non expedit out of doors. For the Spirit of Christ is the spirit of ingenuity, which will freely submit itself to that which is expedient, even in things of their own nature lawful. The not observing whereof, with good heed and discretion, has in old time filled the world with many a superstitious imagination and in our days has healed the imagination and superstition and hypocrisy with another of riot and licentious liberty as bad as the former, yea a great deal worse.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/lancelot-andrewes.html">Lancelot Andrewes</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Other citations (work not named)</cite>, 96 Sermons, One of the Sermons upon the 2nd Commandment, on Acts 2:42, pp. 29-30 Andrewes was a reformed Anglican.</span></figcaption>

<blockquote><p>If it be asked, whether the consent of parents be essential to marriage? the common sentence will resolve it, Multa impediunt matrimonium contrahendum, quae non dirimunt contractum, so that consent is necessary, necessitate praecepti, sed non necessitate medii [by the necessity of precept, but not by a necessity of means]; though by human constitution such marriages may be disallowed, and the issue repute as unlawful, but the marriage cannot be annulled, l. 11. de stat. hom. l. 13 §. 6. de Adult, by which laws, not only the Issue of such marriages are excluded from succession, but the marriage itself insinuate to be null, which human constitutions cannot reach, though the magistrate or minister, celebrator of the marriage, may refuse to proceed without consent of the parents; as by the law and custom of Holland, Art. 3. Ord. Pol. It is statute that… where the parties are minor, they be not married without consent of their parents; and where they are both major, intimation must be made to the parents, and if they appear not, their consent is presumed; and if they do appear and dissent, they must condescend upon the reasons, that it may be cognosced whether they be sufficient or not: And if the marriage do otherways proceed, they account it null… neither do the civil constitutions of princes annul or dissolve marriage, whatever they may work as to the interest of the married persons… Yea, between Jews and Christians, for diversity of religion cannot annul it.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/james-dalrymple.html">James Dalrymple</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Title 4, ‘Conjugal Obligations’ in The Institutions of the Law of Scotland Deduced from its Originals</cite>, … (Edinburgh: Anderson, 1681), pp. 28-44, p. 32</span></figcaption>

<div class="actions"><button class="copy" data-copy="“If it be asked, whether the consent of parents be essential to marriage? the common sentence will resolve it, Multa impediunt matrimonium contrahendum, quae non dirimunt contractum, so that consent is necessary, necessitate praecepti, sed non necessitate medii [by the necessity of precept, but not by a necessity of means]; though by human constitution such marriages may be disallowed, and the issue repute as unlawful, but the marriage cannot be annulled, l. 11. de stat. hom. l. 13 §. 6. de Adult, by which laws, not only the Issue of such marriages are excluded from succession, but the marriage itself insinuate to be null, which human constitutions cannot reach, though the magistrate or minister, celebrator of the marriage, may refuse to proceed without consent of the parents; as by the law and custom of Holland, Art. 3. Ord. Pol. It is statute that… where the parties are minor, they be not married without consent of their parents; and where they are both major, intimation must be made to the parents, and if they appear not, their consent is presumed; and if they do appear and dissent, they must condescend upon the reasons, that it may be cognosced whether they be sufficient or not: And if the marriage do otherways proceed, they account it null… neither do the civil constitutions of princes annul or dissolve marriage, whatever they may work as to the interest of the married persons… Yea, between Jews and Christians, for diversity of religion cannot annul it.”

— James Dalrymple, Title 4, ‘Conjugal Obligations’ in The Institutions of the Law of Scotland Deduced from its Originals… (Edinburgh: Anderson, 1681), pp. 28-44, p. 32">Copy</button><a class="share" href="https://x.com/intent/post?text=%E2%80%9CIf+it+be+asked%2C+whether+the+consent+of+parents+be+essential+to+marriage%3F+the+common+sentence+will+resolve+it%2C+Multa+impediunt+matrimonium+contrahendum%2C+quae+non+dirimunt+contractum%2C+so+that+consent+is+necessary%2C+necessitate+praecepti%2C+sed+non+necessitate+medii+%5Bby+the+necessity+of+precept%2C+but+not+by+a+necessity+of+means%5D%3B+though+by+human+constitution+such+marriages+may+be+disallowed%2C+and+the+issue+repute+as+unlawful%2C+but+the+marriage+cannot+be+annulled%2C+l.+11.+de+stat.+hom.+l.+13+%C2%A7.+6.+de+Adult%2C+by+which+laws%2C+not+only+the+Issue+of+such+marriages+are+excluded+from+succession%2C+but+the+marriage+itself+insinuate+to+be+null%2C+which+human+constitutions+cannot+reach%2C+though+the+magistrate+or+minister%2C+celebrator+of+the+marriage%2C+may+refuse+to+proceed+without+consent+of+the+parents%3B+as+by+the+law+and+custom+of+Holland%2C+Art.+3.+Ord.+Pol.+It+is+statute+that%E2%80%A6+where+the+parties+are+minor%2C+they+be+not+married+without+consent+of+their+parents%3B+and+where+they+are+both+major%2C+intimation+must+be+made+to+the+parents%2C+and+if+they+appear+not%2C+their+consent+is+presumed%3B+and+if+they+do+appear+and+dissent%2C+they+must+condescend+upon+the+reasons%2C+that+it+may+be+cognosced+whether+they+be+sufficient+or+not%3A+And+if+the+marriage+do+otherways+proceed%2C+they+account+it+null%E2%80%A6+neither+do+the+civil+constitutions+of+princes+annul+or+dissolve+marriage%2C+whatever+they+may+work+as+to+the+interest+of+the+married+persons%E2%80%A6+Yea%2C+between+Jews+and+Christians%2C+for+diversity+of+religion+cannot+annul+it.%E2%80%9D%0A%0A%E2%80%94+James+Dalrymple%2C+Title+4%2C+%E2%80%98Conjugal+Obligations%E2%80%99+in+The+Institutions+of+the+Law+of+Scotland+Deduced+from+its+Originals%E2%80%A6+%28Edinburgh%3A+Anderson%2C+1681%29%2C+pp.+28-44%2C+p.+32&amp;url=https%3A%2F%2F5solasquotes.github.io%2Fquote%2Fa45f6ee05b.html&amp;via=5Solas" target="_blank" rel="noopener">Share on X</a><a class="perma" href="../quote/a45f6ee05b.html">Permalink</a><a class="src" href="https://reformedbooksonline.com/topics/topics-by-subject/family/marriage/#:~:text=If%20it%20be%20asked%2C%20whether%20the,diversity%20of%20religion%20cannot%20annul%20it&amp;text=If%20it%20be%20asked%2C%20whether%20the%20consent%20of&amp;text=Christians%2C%20for%20diversity%20of%20religion%20cannot%20annul%20it" rel="noopener" target="_blank">Read it online · Reformed Books Online</a></div>

<blockquote><p>The laws then which the Church in proper speech is said to make, are decrees concerning outward order and comeliness in the administration of the Word and sacraments, in the meetings of the congregation, etc. and such laws made according to the general rules of God’s Word (which require that all things be done to edification, in comeliness, for the avoiding of offence) are necessary to be observed, and the Word of God binds all men to them so far forth as the keeping of them maintains decent order, and prevents open offence. Yet if a law concerning some external rite or thing indifferent, be at some time upon some occasion omitted no offence given, not contempt showed to ecclesiastical authority, there is no breach made in the conscience: and that appears by the example before handled. The apostles guided by the Holy Ghost made a decree for the avoiding of offence necessary to be observed, namely that the Gentiles should abstain from strangled [animals] and blood and idolythites, and yet Paul out of the case of scandal and contempt, permits the Corinthians to do otherwise, 1 Cor. 8 &amp; 9, which he would not have done, if to do otherwise out of the case of scandal and contempt had been sin</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/william-perkins.html">William Perkins</a></span><span class="wk"><span class="lbl">Work:</span> <cite>A Discourse of Conscience wherein is set Down the Nature, Properties and Differences thereof: as also the way to get and keep good conscience</cite>, (1596), pp. 67-68</span></figcaption>

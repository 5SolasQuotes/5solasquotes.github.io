<blockquote><p>If it be said (as I know it is) that this manner of speaking is only in compliance with the Speech and Notion of the Vulgar, I grant indeed that the Scripture speaks so very often, (as I have elsewhere shewed from several Instances both in the Old and New Testament): yea even when it makes mention of some of the Heavenly Bodies, the Expressions are according to the Capacity and common Apprehension of Men, and not according to the Accuracy of the Thing.

So that I do not think that a Body of Natural Philosophy, or a System of Astronomy, is to be composed out of the Bible; this being designed for a far greater and higher Purpose: Yet this I say that whenever the Scripture speaks after the foresaid manner, concerning these things and several others, it doth it in that manner that we may plainly see that the Words are not to be taken strictly and properly, but only in a popular way, as might be showed in abundant Instances.</p></blockquote>

b1405.html">Permalink</a><a class="src" href="https://reformedcovenanter.wordpress.com/2020/11/28/john-edwards-on-the-bible-and-natural-philosophy/" rel="noopener" target="_blank">Read it online · Reformed Covenanter</a></div>
</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-ed5bc88946" data-kw="">
<blockquote><p>For, since the principle of all the knowledge which the reason acquires about a thing is the understanding of that thing’s essence—because, according to the Philosopher’s teaching (2 Posterior Analytics 3, 9) the principle of a demonstration is what a thing is—it follows that our knowledge about a thing will be in proportion to our understanding of its essence. Therefore, if the human intellect comprehends the essence of a particular thing, such as a stone or a triangle, no truth about that thing will surpass the capability of human reason. But this does not happen to us in relation to God, because the human intellect is incapable by its natural power of attaining to the comprehension of his essence. For our intellect’s knowledge, according to the mode of the present life, originates from the senses: and thus things which are not objects of sense cannot be comprehended by the human intellect except insofar as knowledge of them is gathered from sensibles. Now sensibles cannot lead our intellect to see in them what God is, because they are effects unequal to the power of their cause. And yet our intellect is led by sensibles to the divine knowledge so as to know about God that he is, and other such truths which need to be ascribed to the first principle. Accordingly, some divine truths are attainable by human reason, while others altogether surpass the power of human reason. … Furthermore, the same is made abundantly clear by the deficiency which we experience every day in our knowledge of things. For we are ignorant of many of the properties of sensible things, and in many cases we are unable to discover the nature of those properties which we perceive by our senses. Much less, therefore, is human reason capable of investigating all the truths about that most sublime [divine] essence. This agrees with the saying of the Philosopher, where he says that our intellect is like the eye of a bat in relation to the sun in relation to those primary things which are most evident in nature (1a Metaphysics 1, 2).</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/thomas-aquinas.html">Thomas Aquinas</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Summa Contra Gentiles</cite>, bk. 1, ch. 3</span></figcaption>

<blockquote><p>Potential Being to Something is Pure Act [see pp. 50-55 of the Summary]

40. Act and potency¹ divide being and every kind of being. This Scholastic axiom must be understood of act and potency as disjunctive attributes of being, where its truth is sufficiently plain. The sense is: everything of which the definition of being holds (namely, what existence is not repugnant to) either actually exists or does not actually exist. This disjunctive is valid not only of being as a transcendental but also of categorical being, so that everything of which the definition of substance or any of the accidents is true, either actually exists or is in objective potency to existing.

41. Potency involves some imperfection if it is understood in the sense of subjective or objective potency (potential being) [see pp. 51-52] or of passive or obediential potency¹ [see pp. 52-53]; but not if it is understood as: the possible is opposed to the impossible. ¹ [See also ‘On Obediential Potency’.] The point is plain from the definitions of these potencies; for all these potencies adduced before agree in that they express the capacity of receiving some real perfection, and so that which is said to be in this sort of potency is in itself perfectible and hence in some way imperfect. Actual being on the contrary does not involve imperfection. The same must be said of the logically possible and of active potency¹ [that these do not involve imperfection]. ¹ [The importance here is because the First Cause (i.e. God) has no passive potency, or capability to be acted upon or effected, but has all active potency, that is, to act upon others. This is not special pleading for God, but is plainly necessary for what a First Cause must be. See ‘On the Distinction Between Passive Power (Denied) &amp; Active Power (Affirmed) About God’.]

42. Act and potency as constitutive principles involve imperfection insofar as they are mutually perfectible in themselves; for only the imperfect is perfectible.

43. Potential being considered in itself is not simply real, that is, does not really exist, save virtually in its causes. But it differs conceptually from the absolutely nothing and from being of reason [that which only exists in a mind]; for the idea of a possible quiddity [what-ness or essence] involves the relation of non-repugnance to existence, while the others do not.

44. Therefore that which is a potential being cannot have the reason for its existence in itself but in its cause; so the potential is the causable.

45. If something is a potential being, something else is actual. Potential being does not in fact exist; therefore if it can in fact exist, some being is required that can effect it; therefore (from conclusions 24 and 26) something actually exists, namely at least the first ineffectible efficient cause.

46. If something is in subjective, passive, objective, or obediential potency it is causable. The point is plain from the definitions, at least as concerns the real perfection to which something is in potency.

47. Therefore if something is uncausable, it is not in this sort of potency,¹ but is pure act (from negation of the previous conclusion). ¹ [The importance again, is that the First Cause (i.e. God) can have no passive potency to be acted on (which would be an imperfection), but, in the words of Wolter, has all logical potency, or active potency to cause others (which is no imperfection, but the height of perfection).] … 59. Every composite consists of act and potency. For parts have in their formal concept the idea of mutual perfectibility, and so are in potency to the whole.</p></blockquote>

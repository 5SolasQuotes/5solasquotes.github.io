<main class="wrap"><figure class="quote" id="q-a998d1ddc8" data-kw="">
<blockquote><p>LVIII. 3. The will of God is also distinguished into that by which He wills to do or to prevent something, and which is called “the will of his good pleasure,” or rather “of his pleasure” (Ps. 115:3), and into that by which He wills something to be done, or to be omitted, by creatures endued with understanding, and which is called “the will [signi] which is signified.” The latter is revealed; the former is partly revealed, and partly hidden. (Mk. 3:35; 1 Thess. 4:3; Dt. 29:29; 1 Cor. 2:11-12) The former is efficacious, for it uses power, either [tanta] so much as cannot be resisted, or [tali] such a kind as He certainly knows nothing will withstand: (Ps. 33:9; Rom. 9::19) The latter is called “inefficacious,” and resistance is frequently made to it; yet so that, when the creature [excedit ordinem] transgresses the order of this revealed Will, the creature by it may be reduced to order, and that the Will of God may be done [de] on those by whom his Will has not been performed. (2 Sam. 17:14; Isa. 5:4-5; Mt. 21:39-41; Acts 5:4; 1 Cor. 7:28) To this twofold Will is opposed the remission of the Will, which is called “Permission,” and which is also two-fold. The one, which permits something to the power of a rational creature, by not circumscribing its act with a law; and this is opposed to “the revealed Will.” The other is that by which God permits something [potentiae] to the capability and will of the creature, by not interposing an efficacious hindrance; and this is opposed to “the Will of God’s pleasure” that is efficacious. (Acts 14:16; Ps. 81:13)</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/james-arminius.html">James Arminius</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Works of James Arminius, tr. James Nichols (Auburn: Derby, Miller, Orton, 1853), vol. 1, Public Disputations, Disputation 4, ‘On the Nature of God’, pp. 453-54 Arminius was a theological professor at Leiden. He tended not to go into controversial things in his Public Disputations.</cite></span></figcaption>
<div class="meta"><span class="t"><a href="../topics/effectual-calling/efficacious-grace.html">Efficacious Grace</a></span></div>

</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-c302743b9f" data-kw="">
<blockquote><p>We cannot but acknowledge in [“the blessings and means which God has afforded to the angels, to Adam, and which he continually affordeth unto wicked men”] an antecedent and gracious will [in God] to do them good.”</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/john-davenant.html">John Davenant</a></span><span class="wk"><span class="lbl">Work:</span> <cite>On John Davenant &amp; Aquinas | Michael Lynch, John Davenant’s Hypothetical Universalism: a Defense of Catholic &amp; Reformed Orthodoxy (Oxford Univ. Press, 2021) | According to Davenant, these gifts can be either external or internal, with respect to human beings. One such external gift of God’s providence is the death of Christ, which has been ordained as a universal remedy for the sins of all human beings. Moreover, Davenant argues that within the scope of the church community, God has provided many graces (including the preaching of the word, and even internal graces such as knowledge of one’s own sin and the fear of punishment); these graces, although they all are generally ordered to the salvation of those to whom such graces come, do not infallibly obtain that end. In order to avoid confusion, Davenant emphasizes that when one speaks of “the end of such an action of God or of such a gift of God,” we are not to understand such an end as that which causes the divine volition but rather that God gave to such actions and gifts a “fitness or aptnesse to produce such an end.” All such gifts reveal to us, according to Davenant, an antecedent and conditional will or decree in God for the good of all human beings:</cite>, pp. 152-53</span></figcaption>

</figure><figure class="quote" id="q-562e876894" data-kw="">
<blockquote><p>What is added in the last place, concerning the general intention of God, by which He wills that all men individually should be saved through the death of his Son, needs explanation. It must be observed, therefore, that according to the custom of the Scriptures, the Divine will or intention sometimes denotes merely the appointment of means to an end, although there is no determinate will in God of producing that end by those means. And the Schoolmen refer this intention or will of God to the common order of providence. In this sense He willed and intended the obedience and salvation of the angels who apostatized, inasmuch as He furnished them with gifts, fit in themselves and suitable, to perform obedience and obtain salvation. And in this sense God, with a general intention, wills life to all men, inasmuch as he willed the death of Christ to be the fountain and cause of life to all men individually, according to the tenor of the evangelical covenant.¹ ¹ [Davenant calls the gospel offer, that whosoever believes in Christ will be saved (Jn. 3:16), established with all men as men, a “covenant,” and the “evangelical covenant”. While this call and offer does not reach all persons, yet, according to some, it potentially could save all persons if it were not for the sin of persons after Adam and Eve not continuing in their responsibility and for persons not obeying the command to preach the gospel to every creature. This potential power of providential means, designed unto the end of salvation, however varied or inaccessible through human history, yet reflects, for some theologians, God’s gracious will of providence in some way for the life and salvation of every human individual, especially in contrast to the demons which receive no such favors.] But we must observe, that the Scriptures mention another will or intention of God, and that properly so called, which never fails in producing the good intended, and which the Schoolmen refer to the order of special predestination… But if by this general intention they mean nothing more than a general aptitude and sufficiency in the death of Christ to effect the salvation of all men individually in the mode of an universal cause, or a general appointment of God concerning the salvation of all men individually, who, through the grace of God, duly apply to themselves this universal cause, then there is no need to reject this form of speaking.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/john-davenant.html">John Davenant</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Tract on the Gallican Controversy, pt. 1, pp. 564-65 appended to Davenant, An Exposition of Colossians, vol. 2 ed. Josiah Allport (London, 1832)</cite></span></figcaption>

or+the+life+and+salvation+of+every+human+individual%2C+especially+in+contrast+to+the+demons+which+receive+no+such+favors.%5D+But+we+must+observe%2C+that+the+Scriptures+mention+another+will+or+intention+of+God%2C+and+that+properly+so+called%2C+which+never+fails+in+producing+the+good+intended%2C+and+which+the+Schoolmen+refer+to+the+order+of+special+predestination%E2%80%A6+But+if+by+this+general+intention+they+mean+nothing+more+than+a+general+aptitude+and+sufficiency+in+the+death+of+Christ+to+effect+the+salvation+of+all+men+individually+in+the+mode+of+an+universal+cause%2C+or+a+general+appointment+of+God+concerning+the+salvation+of+all+men+individually%2C+who%2C+through+the+grace+of+God%2C+duly+apply+to+themselves+this+universal+cause%2C+then+there+is+no+need+to+reject+this+form+of+speaking.%E2%80%9D%0A%0A%E2%80%94+John+Davenant%2C+Tract+on+the+Gallican+Controversy%2C+pt.+1%2C+pp.+564-65+appended+to+Davenant%2C+An+Exposition+of+Colossians%2C+vol.+2+ed.+Josiah+Allport+%28London%2C+1832%29&amp;url=https%3A%2F%2F5solasquotes.github.io%2Fquote%2F562e876894.html&amp;via=5Solas" target="_blank" rel="noopener">Share on X</a><a class="perma" href="../quote/562e876894.html">Permalink</a><a class="src" href="https://reformedbooksonline.com/the-common-operations-of-the-spirit/on-the-compatibility-of-irresistible-and-resistible-grace/#:~:text=What%20is%20added%20in%20the%20last,to%20reject%20this%20form%20of%20speaking&amp;text=What%20is%20added%20in%20the%20last%20place%2C%20concerning&amp;text=no%20need%20to%20reject%20this%20form%20of%20speaking" rel="noopener" target="_blank">Read it online · Reformed Books Online</a></div>

<blockquote><p>True, God makes us willing of unwilling, and so we resist not. But how does He make us willing? Whether by an irresistible manner of working in us, or not, this, say the opponents, is the main question. Surely so, as that, to use Aquinas his word, the will is impelled, though not compelled; so as that, though there is in the nature of the will a freedom and capacity of agreeing or dissenting, in respect of itself, yet as it is for the present moved and actuated by the effectual inclination of the Almighty, now it so sways one way as if it had for the time put off the power of refusing. What need we then trouble ourselves with these upstart terms of ‘resistible’ and ‘irresistible’? Let it content us that the gracious in-operation of God effectually draws the heart of man to will, to receive, to entertain the happy motions of his good Spirit to our renovation. If we yield not this to God, we yield nothing; and if we give Him this, He will not quarrel us for more. But what place soever these differences have found in foreign schools and pulpits, ours have reason to be free, if we shall listen to that wise and moderate voice of our [Anglican] Church, which our forecited reverend author [Bishop Overall] commends unto us, who, after the relation of the two extreme opinions, rests in this, medio tutissimus: that men are so stirred and moved by grace that they may, if they attend thereunto, obey the grace which calls and moves them; and that they may, by their free will, also resist it. But withal, that God, when He will, and to whom He will, gives such an abundant, such powerful, such congruous, otherwise effectual grace, that although the will may, in respect of the liberty thereof, resist, yet it resists not, but does certainly and infallibly obey; and that thus God deals with those whom He has chosen in Christ so far as shall be necessary to their salvation. Who so cannot sit down quietly in this decision, methinks, should be no friend to peace.</p></blockquote>

<main class="wrap"><figure class="quote" id="q-300c8b4d54" data-kw="">
<blockquote><p>Behold, I have used all means for thy conversion: I have patiently expected it, and earnestly importuned it, and still I continue so doing; and if any man hear the voice of my Word, and open the door of his heart to Me, yielding to those my vehement solicitations, I will impart Myself to the soul of that man, and will have mutual fellowship with him, and he with Me.</p></blockquote>

</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-d454a43305" data-kw="">
<blockquote><p>Therefore the evangelist John makes this the first work of the Spirit, that it shall convince the world of sin (Jn. 16:8): which is so needful, that without it Christ Jesus can never enter into the heart: for He promises to dwell only with them that are humble in spirit and contrite in heart (Isa. 57:15), through the sight of their iniquities, and of God’s displeasure justly deserved for the same: and calls those alone unto Him that are weary and heavy laden (Mt. 11), groaning and sighing under the burden of their sins.</p></blockquote>

</figure><figure class="quote" id="q-f966c5e672" data-kw="">
<blockquote><p>Secondly, Those who have not as yet received Christ to dwell in them are to be moved, as they desire Heaven’s glory hereafter and the comfortable hopes of it here upon earth, to give entertainment unto Jesus Chist. Zacchaeus upon a hint given of Christ’s willingness to come into his house, comes down out of the sycamore tree quickly, and receives him joyfully (Lk. 19:4). Now do you with seriousness consider with what 1. importunity, 2. patience, 3. and promises the Lord Jesus calls upon you for entertainment. ‘Behold, I stand at the door and knock, if any man hear my voice, and open the door, I will come in to him, and will sup with him, and he with Me.’ (Rev. 3:20)</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/simeon-ashe.html">Simeon Ashe</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Christ the Riches of the Gospel &amp; the Hope of Christians, a Sermon… (London, A.M., 1654)</cite>, p. 32</span></figcaption>

</figure><figure class="quote" id="q-492d7d067f" data-kw="">
<blockquote><p>God speaks with sinners through his messengers. They come for God’s purpose, and their words, counsels, exhortations, and reproofs are his. When sinners reject the words which God’s ministers bring in his name, they are actually striving with the Spirit. They are wrestling with Christ as if He were present. When God comes to reckon with sinners, it will prove just so. God will remind them of his striving and their unkind resistance. The Spirit strives with the consciences of men, debating in their own hearts the case against them, and shows man his sin in all its ugly colors. He does this so well that the creature can sometimes smell the very fire and brimstone about him, and makes him feel at present in a temporary hell. At other times, he parleys and works with them, and makes gracious overtures and offers of the gospel to them. He opens a door of hope and woos and beseeches them to throw down their rebellious arms and come to Christ for life. He reveals how Christ is in a present disposition to embrace their first motion towards mercy. The Spirit follows the sinner from place to place, and from time to time suggesting such encouragements. Many, however, cast off the Spirit’s hands in resistance. This carries such malignity in it, that some have felt the horror of the unpardonable sin, even though their condition is not final. Take heed, however, sinners, how you respond to the Spirit when He comes knocking at the door of your hearts. Open at this knock, and He will be your guest; you will have his sweet company. Repulse Him, and you have not a promise He will knock again. If once He stops striving with you, unhappy man, you are lost forever.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/william-gurnall.html">William Gurnall</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Christian in Complete Armor (†1679)</cite>, 1:116-17</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/effectual-calling/means-of-calling.html">Means of Calling</a></span></div>

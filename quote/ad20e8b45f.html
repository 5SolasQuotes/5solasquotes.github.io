<blockquote><p>First then for the Grace it self, What is Zeal?

It is a holy Ardour kindled by the holy Spirit of God in the affections, improving a man to the utmost for God’s glory, and the Churches good; Zelus est intensus gradus purae affectionis: It is not so much any one affection, as the intended degree of all. Affections are the motions of the Will, as carried out to the prosecution of good, or avoiding of evil: They are, as the Philosopher speaks, exitus animae, the out-goings of the soul. What the Wheels are to the Cart, the Sinews to the Body, Wings to the Bird, the Wind to the Sails spread, such are the Affections to the Soule, implanted by God to carry it hither and thither as the objects do more or less affect. Man lies like a log, the soul moves not, but as the Affections stir.

For their order they are so placed in the soul, as that they are subservient one to another; the irascible to the concupiscible. When the desiring faculties flag, grow remiss by intervenient impediments, then comes in the irascible faculties, as removens impedimenta, as taking away the impediments; and is not this that which is properly called Anger? This made Luther to say, Ira suo loco est optimum Dei donum.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/oliver-bowles.html">Oliver Bowles</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Zeal for God’s house quickened: or, A sermon preached before the assembly of Lords, Commons, and Divines, at their solemn fast July 7. 1643. In the Abbey Church at Westminster. Expressing the eminency of zeal requisite in church reformers</cite>, (London: Samuel Gellibrand, 1643), pp 5-6.</span></figcaption>

<blockquote><p>What attitude should we adopt in view of the present popularity of pictures of Jesus Christ? The following considerations may be suggested as hearing on this question: (a) The Bible presents no information whatever about the personal appearance of Jesus Christ, but it does teach that we are not to think of him as he may have appeared “in the days of his flesh” but as he is today in heavenly glory, in his estate of exaltation (2 Cor. 5:16). (b) Inasmuch as the Bible presents no data about the personal appearance of our Saviour, all artists’ pictures of him are wholly imaginary and constitute only the artists’ ideas of his character and appearance.

(c) Unquestionably pictures of the Saviour have been very greatly influenced by the theological viewpoint of the artist. The typical modern picture of Jesus is the product of nineteenth century “Liberalism” and presents a “gentle Jesus” who emphasized only the love and Fatherhood of God and said little or nothing about sin, judgment, and eternal punishment. (d) Perhaps more people living today have derived their ideas of Jesus Christ from these typically “liberal” pictures of Jesus than have derived their ideas of Jesus from the Bible itself. Such people inevitably think of Jesus as a human person, rather than thinking of him according to the biblical teaching as a divine person with a human nature. The inevitable effect of the popular acceptance of pictures of Jesus is to overemphasize his humanity and to forget or neglect his deity (which of course no picture can portray).

(e) In dealing with an evil so widespread and almost universally accepted, we should bear a clear testimony against what we believe to be wrong, but we should not expect any sudden change in Christian sentiment on this question. It will require many years of education in scriptural principles before the churches and their members can be brought back to the high position of the Westminster Assembly on this question. Patience will be required.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/johannes-g-vos.html">Johannes G. Vos</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Westminster Larger Catechism: A Commentary</cite>, ed. G. I. Williamson (Phillipsburg NJ: P&amp;R, 2002), p. 292.</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/the-christian-life/obedience-and-profession.html">Obedience and Profession</a></span></div>

</figure><figure class="quote" id="q-68c87a6049" data-kw="">
<blockquote><p>I am afraid of a controversy on this subject [instrumental music], or of its issue, so far as the merits of the question are concerned. I believe that it is a question which touches some of the highest and deepest points of Christian theology. Is the Temple destroyed? Is the Temple worship wholly superseded? Have we, or have we not, priests and sacrifices among us now? Is the Temple or the Synagogue the model on which the Church of the New Testament is formed?

Does the Old Testament itself point to anything but “the fruit of the lips” as the peace-offering or thank-offering of Gospel times? Is there a trace in the New Testament of any other mode of praise? For my part, I am persuaded that if the Organ be admitted, there is no barrier, in principle, against the sacerdotal system in all its fulness,—against the substitution again, in our whole religion, of the formal for the spiritual, the symbolical for the real.

I do not judge others. The case is very different with those who never reached our measure of reformation from what it is with us. A Church which, stopping short in the process of its emancipation from a false system, retains certain of the usages of that false system, is in a very different position from a Church which, having advanced farther in the direction of purity and simplicity, voluntarily retrogrades and returns to these usages.

To the one they may be comparatively harmless, while to the other they may prove deeply hazardous. In the former instance, the continuance of them indicates no new leaning towards ritualism, no decline from what is more pure and spiritual. In the latter instance, the adoption of them may have a significancy, and may exert an influence, of a very serious character indeed. A landing-place which is tolerable for those who are going forward, may be the reverse of tolerable for those who are retreating.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/robert-candlish.html">Robert Candlish</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Introductory Notice in The Organ Question: Statements by Dr Ritchie, and Dr Porteous, for and against the use of the organ in public worship, in the proceedings of the Presbytery of Glasgow, 1807-8. With an introductory notice, by Robert S. Candlish, D.D., Edinburgh</cite></span></figcaption>
<div class="meta"><span class="t"><a href="../topics/the-christian-life/obedience-and-profession.html">Obedience and Profession</a></span></div>

— Robert Candlish, Introductory Notice in The Organ Question: Statements by Dr Ritchie, and Dr Porteous, for and against the use of the organ in public worship, in the proceedings of the Presbytery of Glasgow, 1807-8. With an introductory notice, by Robert S. Candlish, D.D., Edinburgh">Copy</button><a class="share" href="https://x.com/intent/post?text=%E2%80%9CI+am+afraid+of+a+controversy+on+this+subject+%5Binstrumental+music%5D%2C+or+of+its+issue%2C+so+far+as+the+merits+of+the+question+are+concerned.+I+believe+that+it+is+a+question+which+touches+some+of+the+highest+and+deepest+points+of+Christian+theology.+Is+the+Temple+destroyed%3F+Is+the+Temple+worship+wholly+superseded%3F+Have+we%2C+or+have+we+not%2C+priests+and+sacrifices+among+us+now%3F+Is+the+Temple+or+the+Synagogue+the+model+on+which+the+Church+of+the+New+Testament+is+formed%3F%0A%0ADoes+the+Old+Testament+itself+point+to+anything+but+%E2%80%9Cthe+fruit+of+the+lips%E2%80%9D+as+the+peace-offering+or+thank-offering+of+Gospel+times%3F+Is+there+a+trace+in+the+New+Testament+of+any+other+mode+of+praise%3F+For+my+part%2C+I+am+persuaded+that+if+the+Organ+be+admitted%2C+there+is+no+barrier%2C+in+principle%2C+against+the+sacerdotal+system+in+all+its+fulness%2C%E2%80%94against+the+substitution+again%2C+in+our+whole+religion%2C+of+the+formal+for+the+spiritual%2C+the+symbolical+for+the+real.%0A%0AI+do+not+judge+others.+The+case+is+very+different+with+those+who+never+reached+our+measure+of+reformation+from+what+it+is+with+us.+A+Church+which%2C+stopping+short+in+the+process+of+its+emancipation+from+a+false+system%2C+retains+certain+of+the+usages+of+that+false+system%2C+is+in+a+very+different+position+from+a+Church+which%2C+having+advanced+farther+in+the+direction+of+purity+and+simplicity%2C+voluntarily+retrogrades+and+returns+to+these+usages.%0A%0ATo+the+one+they+may+be+comparatively+harmless%2C+while+to+the+other+they+may+prove+deeply+hazardous.+In+the+former+instance%2C+the+continuance+of+them+indicates+no+new+leaning+tow

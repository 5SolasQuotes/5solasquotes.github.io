<main class="wrap"><figure class="quote" id="q-040ca6aa00" data-kw="">
<blockquote><p>5. Hearing of the Word is a worshiping of God. Therefore, the Church-hearing of the Word must be Church-worship. For all professing by their visible communion in hearing the Word, one Faith, one Lord, one Hope of glory, and that as one visible body, must thereby testify they be all joint-worshippers of Christ and of one God, whose covenant they preach and hear.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/samuel-rutherford.html">Samuel Rutherford</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Due Right of Presbyteries, ‘Acts 15, A Pattern of a Juridicial Synod’</cite>, (1644), pt. 1, p. 271</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/worship/public-worship.html">Public Worship</a></span></div>

</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-b9bcfdcde3" data-kw="">
<blockquote><p>242. Of the use of Amen being added to a Speech … 1. Three duties especially are required of him that utters the speech whereunto ‘Amen’ is added. … 2. To speak audibly, so as they which are to say Amen, may hear what is said. The Levites under the Law were expressly enjoined to speak to the people with a loud voice. Accordingly the Levites that were the mouth of the people to God, and prayed in their presence, cried with a loud voice unto the Lord their God. Be a prayer made as intelligibly as may be, if it be not heard of them that are present, they cannot with assent, desire, and say Amen.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/william-gouge.html">William Gouge</a></span><span class="wk"><span class="lbl">Work:</span> <cite>A Guide to Go to God: or, an Explanation of the Perfect Pattern of Prayer, the Lord’s Prayer</cite>, ... (1626; RHB, 2011) See the whole of the larger section, pp. 330-40.</span></figcaption>

</figure><figure class="quote" id="q-2d6dcbbc1b" data-kw="">
<blockquote><p>We reject therefore these opposite opinions following… 2. That a particular visible Church is by the Word of God limited to such bounds as that of necessity, [that] they may be ordinarily contained and ought to meet in one place for performing the public worship of God with mutual edification. For as we have showed that the consitution of such a church, as by reason of their multitude or some other cause, cannot ordinarily meet in one place, does well agree with the Word of God and apostolical institution. For the essence and lawful constitution of a church depends not on the outward circumstance of place, but on a due profession of faith, and bond of holy communion. For as [William] Ames says, ‘that same in profession does constitute a Church-visible, which in reality and its internal nature constitutes the Church-mystical, that is, faith.’ Marrow of Theology, bk. 1, ch. 32, thesis 7.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/willhelm-apollonius.html">Willhelm Apollonius</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Other citations (work not named)</cite>, pp. 41-42 of ch. 3, ‘Of an Institute Visible Church’ in A Consideration of Certaine Controversies at this Time Agitated in the Kingdome of England, Concerning the Government of the Church of God (1645) Apollonius was a Dutch presbyterian, who is arguing against the English Independents.</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/worship/public-worship.html">Public Worship</a></span></div>

ance-though-technology-on-using-satellite-campuses-under-necessity-for-edification/#:~:text=We%20reject%20therefore%20these%20opposite%20opinions,bk.%201%2C%20ch.%2032%2C%20thesis%207&amp;text=We%20reject%20therefore%20these%20opposite%20opinions%20following&amp;text=of%20Theology%2C%20bk.%201%2C%20ch.%2032%2C%20thesis%207" rel="noopener" target="_blank">Read it online · Reformed Books Online</a></div>
</figure><figure class="quote" id="q-660cf0cf31" data-kw="">

</figure><figure class="quote" id="q-a031546264" data-kw="">
<blockquote><p>7. Unto the pastor only appertains the administration of the sacraments, in like manner as the administration of the word; for both are appointed by God as means to teach us, the one by the ear, and the other by the eyes and other senses, that by both knowledge may be transferred to the mind. 8. It appertains, **by the same reason**, to the pastor to pray for the people, and namely for the flock committed to his charge; **and to bless them in the name of the Lord,** who will not suffer the blessings of his faithful servants to be frustrated.</p></blockquote>

<main class="wrap"><figure class="quote" id="q-c383488416" data-kw="">
<blockquote><p>He who errs in this doctrine errs to his eternal destruction. The devil is therefore continually engaged in denying, perverting, and obscuring the truth expressed in this chapter and, if he does not accomplish this, to prevent exercise concerning this truth. When new errors appear on the horizon, even when they initially do not pertain to justification at all, they in time will eventually culminate in affecting this doctrine. One must therefore be all the more earnest to properly understand, defend, and meditate upon this doctrine.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/wilhelmus-a-brakel.html">Wilhelmus à Brakel</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Christian’s Reasonable Service</cite>, (Grand Rapids: Reformation Heritage Books, repr. 2015), 2:341.</span></figcaption>

</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-15738e125c" data-kw="">
<blockquote><p>So that it is evident that to be justified has a threefold signification. For first it imports as much as to be absolved from sin, that is, to be freed from the woeful consequents of that disfavor and dislike, that unrighteousness and sin subjects us unto. Secondly, to be accepted and respected so as righteous men are wont to be: And thirdly to be framed to the love and desire of doing righteously.</p></blockquote>

</figure><figure class="quote" id="q-e54e001d1d" data-kw="">
<blockquote><p>The Popish Prelate [John Maxwell] (ch. 7, p. 87) objects against us… 2. The maxim of the law is, Surrogatus gaudet privilegus ejus cui surrogatur, et qui succedit in locum, succedit in jus. The person surrogated has all the privileges that he has in whose place he succeeds; he who succeeds to the place succeeds to the rights; the adopted son, or the bastard who is legitimated and comes in the place of the lawful born son, comes also in the privileges of the lawful born son. … Answer: 1. He that is surrogated in the place of another, due to him by a positive law of man, he has law to all the privileges that he has in whose place he is surrrogated, that is true. He who comes in the place of a mayor of a city, of a captain in an army, of a pilot in a ship, or of a pope, has all the privileges and rights that his predecessors had by law. Jus succedit juri, persona jure predita personce jure preditce. So the law, so far as my reading can reach, who profess myself a divine; but that he who succeeds to the place of a father by nature, should enjoy all the natural rights and privileges of the person to whom he succeeds, I believe the law never dreamed it; for then the adopted son, coming in place of the natural son, has right to the natural affection of the father. If any should adopt Maxwell the prelate, should he love him as the pursuivant of Crail (Maxwell’s father) loved him, I conceive not. Has the adopted son his life, his being, the figure bodily, the manners of the son in whose place he is adopted; or doth he naturally resemble the father as the natural son does? The Prelate did not read this law in any approved jurist… A natural son is not made a son by the consent of parents, but he is a son by generation…</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/samuel-rutherford.html">Samuel Rutherford</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Lex Rex</cite>, ... (1644; Edinburgh: Ogle, 1843), pp. 63-64</span></figcaption>

</figure><figure class="quote" id="q-eda66c05c6" data-kw="">
<blockquote><p>The Reformed churches have ever considered Christ and justification by faith in his merits, as the great centre of the Christian system. The Oxford Tract writers make the church the main point; the church as an ordinance for conveying life to all its members by means of the sacraments. The church, with them, is the great mediator between God and man, the only authorized channel of divine communication.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/charles-hodge.html">Charles Hodge</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Review of Tracts For The Times</cite>, (1838)</span></figcaption>

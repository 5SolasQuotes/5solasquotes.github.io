<blockquote><p>During the Westminster Assembly’s debates on the subject of hypothetical universalism (see Edmund Calamy’s argument in the same debate), Samuel Rutherford argued against a universalist interpretation of John 3:16 and other related passages:

Mr. Rutherford – For the two scriptures alleged yesterday desire when I give a reason of the denial of a proposition … For that of iii. Joh. 16, three grounds of an argument taken from this place: 1. From the word loved; a general love to elect and reprobate. 2. From the word world, generally taken, be[cause] distributive afterwards. 3. Grounded upon God’s intention upon condition of faith. … For the first Christ speaks of a particular special love. … This all one with those places. … This love is parallel with that expressed in those three places. … The love of one giving his life for his friends … the love that moved Him to send His only-begotten Son. …

If the love in the iii. of John be the same with those, as in those places is meant the special particular love of God commensurable with election … not one scripture in all the New Testament where it can be expounded for the general … 2. The love in the iii. of John 16 is restricted to the Church; v. Eph. 21, restricted to a Church … so ii. Gal. 20: loved; the apost[le] who lives the life of God by faith, … v. Rom. 8, the sinners and ungoldly are set down to be the justified by faith. … Such a love as moved the husband Christ to give His life for His spouse, such as moved … such as God commends, for the highest love is a restricted special love. … 3. It is an actual saving love, and therefore not a general love.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/alexander-f-mitchell-and-john-struthers.html">Alexander F. Mitchell and John Struthers</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Minutes of the Sessions of the Westminster Assembly of Divines</cite>, (Edinburgh: William Blackwood and Sons, 1874), Sess. 523, 23 Oct. 1645, p. 158.</span></figcaption>

<blockquote><p>Hypothetical universalism reduces the propitiation of the Son of God to a potentiality. The cross actually achieves nothing, it only makes sinners potentially salvable. Definite atonement, or better simply ‘atonement,’ truly glories in the ‘finished work’ of Christ.</p></blockquote>

</figure><figure class="quote" id="q-4e8d3153f7" data-kw="">
<blockquote><p>The interest of the debate to us lies in the revelation which it gives us of the presence in the Assembly of an influential and able, but apparently small, body of men whose convictions lay in the direction of the modified Calvinism which had been lately promulgated by Cameron and Amyraut for the express purpose of finding a place for a universal redemption in the Calvinistic system. For the origin of this party Dr. Mitchell would point us to English sources: but Baillie especially mentions Amyraut in this connection; and it would seem that it was Amyraut and Cameron—both of whom Gillespie mentions in this debate—whom men had especially in mind during the discussion; and it would seem further to be clear that while the adherents of this universalistic view of the atonement in the Assembly held it with British moderation, and were not prepared to go all lengths with the French Divines who had lately promulgated it with such force, they yet looked upon them as of their school and sought support from them. The result of the debate was a refusal to modify the Calvinistic statement in this direction—or perhaps we should rather say the definitive rejection of the Amyraldian views and the adoption of language which was precisely framed to exclude them. Dr. Mitchell, reviving an old contention, suggests indeed that unless the clause of the Confession in question be read disjunctively rather than, as it is actually phrased, conjunctively, it will not operate for the exclusion of Amyraldians. It is not clearly obvious, however, that the word “and” here binds the several items of the enumeration so closely together as to make it appear that all that is affirmed is only that the whole of this process takes place in the case of the elect only: the natural sense of the clause is clearly that no one of the transactions here brought together is to be affirmed of the non-elect. And this impression is increased by the broader context, not to speak of the parallel passages in viii. 3 and 5. It might seem somewhat more to the point, possibly, to recall that in this section the language is so ordered as to seem to deal with the actual ordo salutis rather than directly with the ordo decretorum. It is asserted that the ordo salutis is the result of the decreeing of the means by which the elect are brought to glory. But what is subsequently asserted is that none but the elect are (actually) redeemed by Christ, effectually called, etc.—the mind being abstracted for the moment from the intention to the performance. The Westminster Amyraldians—if we may venture so to call them—had, of course, freely admitted the distinction between the elect and non-elect in the application: it was only in the impetration that they disputed it: and it might perhaps seem to them possible to confess that though Christ had died for all, the merits of His death had actually been applied only to some, and to contend that only this is actually expressed by saying that none but the elect “are redeemed by Christ.” Even this, however, appears more subtle than satisfactory; and in any event it would seem quite obvious that the Assembly intended to state in this clause with adequate clearness their reasoned and deliberate conviction that the decree of election lies behind the decree of the gift of Christ for redemption, and that the latter is to be classed as one of the means for the execution of the decree of election. This is the definite exclusion of the Amyraldian view, and anything that can be made really consistent with this conception of the ordo decretorum will be found to differ fundamentally from Amyraldism.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/benjamin-b-warfield.html">Benjamin B. Warfield</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Works of Benjamin B. Warfield</cite>, vol. 6 (Bellingham, WA: Logos Bible Software, 2008), 142–44.</span></figcaption>

<blockquote><p>“There are others, who, rejecting that first absolute decree, and rightly so, make the conditional decree so common to all men that they assert that the counsel of God the Father in delivering the Son to death and of the Son in undergoing the same, and their intention and scope, was to acquire, impetrate and merit for all and every sinful man by that most precious death and passion, that, if they repent, when they are capable of doctrine and believe in Christ, they might be able to be reconciled with God and receive the remission of sins. They deny, however, that actual reconciliation with God or the remission of sins or eternal life was actually acquired or impetrated for those who remain in impenitence. 11. Since these deny that Christ died equally for the impious and the pious, and affirm that only the pious may glory in the satisfaction of Christ, because the principal fruit and efficacy of the satisfaction comes to them, they agree in sense with all other Orthodox on that point, even if they differ in their mode of speaking; especially since they acknowledge a certain special decree, according to which He died specially for the elect alone, by which they are brought not only to the common, but also to the singular benefits, namely the grace of regeneration and of efficacious calling, of justification and of glorification; and to the merit of Christ’s death they assign the true and efficacious communion, bestowal and application of saving grace, and the donation of faith itself, by which the application is made.</p></blockquote>

<div class="actions"><button class="copy" data-copy="““There are others, who, rejecting that first absolute decree, and rightly so, make the conditional decree so common to all men that they assert that the counsel of God the Father in delivering the Son to death and of the Son in undergoing the same, and their intention and scope, was to acquire, impetrate and merit for all and every sinful man by that most precious death and passion, that, if they repent, when they are capable of doctrine and believe in Christ, they might be able to be reconciled with God and receive the remission of sins. They deny, however, that actual reconciliation with God or the remission of sins or eternal life was actually acquired or impetrated for those who remain in impenitence. 11. Since these deny that Christ died equally for the impious and the pious, and affirm that only the pious may glory in the satisfaction of Christ, because the principal fruit and efficacy of the satisfaction comes to them, they agree in sense with all other Orthodox on that point, even if they differ in their mode of speaking; especially since they acknowledge a certain special decree, according to which He died specially for the elect alone, by which they are brought not only to the common, but also to the singular benefits, namely the grace of regeneration and of efficacious calling, of justification and of glorification; and to the merit of Christ’s death they assign the true and efficacious communion, bestowal and application of saving grace, and the donation of faith itself, by which the application is made.”

— André Rivet, Works, (d. 1651), vol. 2, Thirteen Disputations on the Just &amp; Gracious Dispensation of God concerning the Salvation of the Human Race, Disputation 6, Theses 9-11 in Barthold Holtzfus, Theological Treatise on Predestination, Election &amp; Reprobation of Men 3rd ed. tr. by AI by Nosferatu (Leiden, 1705), p. 121 Latin">Copy</button><a class="share" href="https://x.com/intent/post?text=%E2%80%9C%E2%80%9CThere+are+others%2C+who%2C+rejecting+that+first+absolute+decree%2C+and+rightly+so%2C+make+the+conditional+decree+so+common+to+all+men+that+they+assert+that+the+counsel+of+God+the+Father+in+delivering+the+Son+to+death+and+of+the+Son+in+undergoing+the+same%2C+and+their+intention+and+scope%2C+was+to+acquire%2C+impetrate+and+merit+for+all+and+every+sinful+man+by+that+most+precious+death+and+passion%2C+that%2C+if+they+repent%2C+when+they+are+capable+of+doctrine+and+believe+in+Christ%2C+they+might+be+able+to+be+reconciled+with+God+and+receive+the+remission+of+sins.+They+deny%2C+however%2C+that+actual+reconciliation+with+God+or+the+remission+of+sins+or+eternal+life+was+actually+acquired+or+impetrated+for+those+who+remain+in+impenitence.+11.+Since+these+deny+that+Christ+died+equally+for+the+impious+and+the+pious%2C+and+affirm+that+only+the+pious+may+glory+in+the+satisfaction+of+Christ%2C+because+the+principal+fruit+and+efficacy+of+the+satisfaction+comes+to+them%2C+they+agree+in+sense+with+all+other+Orthodox+on+that+point%2C+even+if+they+differ+in+their+mode+of+speaking%3B+especially+since+they+acknowledge+a+certain+special+decree%2C+according+to+which+He+died+specially+for+the+elect+alone%2C+by+which+they+are+brought+not+only+to+the+common%2C+but+also+to+the+singular+benefits%2C+namely+the+grace+of+regeneration+and+of+efficacious+calling%2C+of+justification+and+of+glorification%3B+and+to+the+merit+of+Christ%E2%80%99s+death+they+assign+the+true+and+efficacious+communion%2C+bestowal+and+application+of+saving+grace%2C+and+the+donation+of+faith+itself%2C+by+which+the+application+is+made.%E2%80%9D%0A%0A%E2%80%94+Andr%C3%A9+Rivet%2C+Works%2C+%28d.+1651%29%2C+vol.+2%2C+Thirteen+Disputations+on+the+Just+%26+Gracious+Dispensation+of+God+concerning+the+Salvation+of+the+Human+Race%2C+Disputation+6%2C+Theses+9-11+in+Barthold+Holtzfus%2C+Theological+Treatise+on+Predestination%2C+Election+%26+Reprobation+of+Men+3rd+ed.+tr.+by+AI+by+Nosferatu+%28Leiden%2C+1705%29%2C+p.+121+Latin&amp;url=https%3A%2F%2F5solasquotes.github.io%2Fquote%2F2c726bebc9.html&amp;via=5Solas" target="_blank" rel="noopener">Share on X</a><a class="perma" href="../quote/2c726bebc9.html">Permalink</a><a class="src" href="https://reformedbooksonline.com/on-hypothetical-universalism/#:~:text=There%20are%20others%2C%20who%2C%20rejecting%20that,by%20which%20the%20application%20is%20made&amp;text=There%20are%20others%2C%20who%2C%20rejecting%20that%20first%20absolute&amp;text=faith%20itself%2C%20by%20which%20the%20application%20is%20made" rel="noopener" target="_blank">Read it online · Reformed Books Online</a></div>

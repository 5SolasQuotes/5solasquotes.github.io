<main class="wrap"><figure class="quote" id="q-2d4610d0fa" data-kw="">
<blockquote><p>‘But’ says [John] Robinson [the Separatist], ‘How can England forsake the Church of Rome and forsake the ministry, which is in the Church as in the subject, especially seeing you teach that a true ministry makes essentially a true Church?’ I answer, England may well separate from Rome everting the fundamental parts of faith, and not separate from Rome’s baptism, or ministry, insofar as they be essentially the ordinances of Christ: and I retort this argument: How can Separatists separate from both us and Rome, and yet retain the baptism in both our Church and Rome? 2. A ministry true in the essence may make a Church true [in Greek], insofar; but because of many other substantial corruptions in Rome, it is a Church which we ought to forsake.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/samuel-rutherford.html">Samuel Rutherford</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Due Right of Presbyteries (1644), pt. 1</cite>, p. 240</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/the-church/true-and-false-church.html">True and False Church</a></span></div>

<blockquote><p>3rd Distinction. It is one thing to receive ordination from a Prelate lawfully and another thing to receive lawful ordination. The former we deny; ministers sin who receive ordination from a prelate, as they sin who receive baptism from the Romish Church; yet is the ordination lawful and valid, because prelacy, though different in nature from the office of a true pastor, is consistent in the same subject with the pastor’s office.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/samuel-rutherford.html">Samuel Rutherford</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Due Right of Presbyteries (1644), pt. 1</cite>, p. 186</span></figcaption>

</figure><figure class="quote" id="q-3548a0cd40" data-kw="">
<blockquote><p>Concerning the substance of Christian religion we confess that it is also amongst them [Romanists], but not pure, nor separated not only from chaff and straw, that is, from tolerable abuses, but neither from the venom and poison of false doctrine… It is true that the Church of Rome teaches that there is one God, Father, Son, and Holy Ghost, that for the redemption of mankind, the Son has taken to Himself the nature of man, and in it has expiated our sins by his death, that He was buried, raised from the dead, taken up into heaven, sitting at the right hand of God Almighty: That the Holy Ghost sanctifies us, that there is a Church, a communion of saints, a remission of sins, a resurrection of the flesh, and a life everlasting, that by faith we must rely upon the mercy of God, that by hope we must expect the accomplishment of his promises, by charity love Him. This is indeed the substance of Christian religion which continues so far as the doctrine and outward profession of it [is] in the Church of Rome, in this respect we have not forsaken her, but these considerations make us leave her the title of a Church, to which so far we will always be joined. But what is it that has not been added to corrupt this truth? what strange doctrines have been invented to obscure it? What heresies? what idolatry? what gross sacrilege vent they under the protection of this truth which they profess. These are the causes of our separation from them, if amongst them we could haue enioyed the substance of true religion, without defiling us with their superstition, we had tarried with them still. … …so before the Lord had sounded us a loud summons with his trumpet, ‘Come out of Babylon my people,’ He sustained and supported his people in the midst of Babylon; it was not at that time a sin, but a captivity to abide in it. But for any to abide, or linger in it after the publishing of this summons, it is a sure testimony, that they live not in it unwillingly, but with delight, and that, at least outwardly, they partake of her sins, and so may justly partake of her plagues.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/john-cameron.html">John Cameron</a></span><span class="wk"><span class="lbl">Work:</span> <cite>An Examination of those Plausible Appearances which seem most to commend the Romish Church, and to Prejudice the Reformed… (Oxford, 1626), ch. 37, ‘In what sense we yield that the Church of Rome has the substance of true religion, and how she ceases not for all that to be a false Chuch’</cite>, pp. 147-50</span></figcaption>

</figure><figure class="quote" id="q-57473cca20" data-kw="">
<blockquote><p>3. The most judicious and best approved amongst us do hold that as baptism, so ordination even in Rome is so far forth valid, that upon separation from them, and joining with us, there needs neither new baptism nor a new ordination… The more rigid of them [Brownists], who deny that which he grants, as [John] Robinson and [Henry] Ainsworth, yet acknowledge that in Rome there are some true ordinances, as baptism for instance: And in granting the administration of baptism with those of Rome to be valid, and yet denying the Church to be true, they must needs reject your consequence.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/lazarus-seaman.html">Lazarus Seaman</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Diatribe Proved to be Paradiatribe, or a Vindication of the Judgment of the Reformed Churches, and Protestant Divines, from misrepresentations concerning ordination and laying on of hands... (London: T.R., 1647), ‘Answer to the Tract bearing title, The Judgment of the Reformed Churches’, p. 51 Seaman (d. 1675) was a Westminster divine.</cite></span></figcaption>

0consequence" rel="noopener" target="_blank">Read it online · Reformed Books Online</a></div>
</figure><figure class="quote" id="q-c39fb5cf7c" data-kw="Apostolic succession">
<blockquote><p>Here, then, is the value of succession when not conjoined with imitation and corresponding conduct: posterity, as soon as they are convicted of having revolted from their origin, are deprived of all honour; unless, indeed, we are prepared to say, that because Caiaphas succeeded many pious priests (nay, the series from Aaron to him was continuous), that accursed assembly deserved the name of Church. … That in the government of the Church especially, nothing is more absurd than to disregard doctrine, and place succession in persons.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/john-calvin.html">John Calvin</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Institutes of the Christian Religion</cite>, 4.2.3</span></figcaption>

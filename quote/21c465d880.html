<main class="wrap"><figure class="quote" id="q-21c465d880" data-kw="">
<blockquote><p>Q. What are you by Adam’s fall? A. I am wholly corrupted with sin, and continually subject to the curse and wrath of God.

Proofs.

• 1 That man’s nature is wholly corrupted with sin, Gen. 6.5. God saw that every imagination of the thoughts of man’s heart was only evil continually Rom. 5.12, 14. • 2 That every natural man is subject to God’s curse, Gal. 3.10. Cursed is every one, that continueth not in all things, which are written in the book of the Law to do them.

Q. What are your sins? A. A guiltiness in Adam’s first offence, and a disposition of my heart to every thing that is against the Law of God, with innumerable fruits thereof in thought, speech, and action.

Proofs.

• 1 That we are guilty of and in Adam’s first offence, Rom. 5.12. By the offence of one judgement came upon all men to condemnation. • 2 That our hearts are inclined to go against God’s Law, Rom. 7.23. I see another Law in my members, rebelling and warring against the Law of my mind, and leading me captive to the Law of sin, &amp;c. • 3 That we are thus corrupted from the beginning of our nature, Psal. 51.5. David saith, Behold, I was shapen in iniquity, and in sin did my mother conceive me, Job 14.4. • 4 That our actual sins are innumerable. Psal. 40.12. &amp; Ezra. 9, 6. Our iniquities are increased over our heads, and our trespasses are grown up to heaven.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/thomas-gouge.html">Thomas Gouge</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The principles of Christian religion. Proved by scripture, propounded by questions and answers: short for memory, plain for the meanest capacity, and profitable for all</cite>, (London: Samuel Man, 1645), p. 3.</span></figcaption>

<blockquote><p>It is not very just to chastise men for the offenses of their natural ancestors, but to take the fiction of ancestry in a corporate succession as a ground for punishing men who have no relation to guilty acts, except in names and general descriptions, is a sort of refinement in injustice belonging to the philosophy of this enlightened age… [they punish] men, many, if not most, of whom abhor the violent conduct of… former times as much as their present persecutors can do, and who would be as loud and as strong in the expression of that sense, if they were not well aware of the purposes for which all this declamation is employed.</p></blockquote>

<blockquote><p>The doctrine of the equality of sins, however, the Stoics alone dared to maintain in opposition to the unanimous sentiments of mankind: an absurd tenet, which in writing against Jovinianus you have most clearly refuted from the Holy Scriptures. In that most delightful and noble dissertation you have made it abundantly plain that it has not been the doctrine of our authors, or rather of the Truth Himself, who has spoken through them, that all sins are equal.</p></blockquote>

</figure><figure class="quote" id="q-4bfa275b68" data-kw="splendid vices">
<blockquote><p>That sin is rightly called the punishment of sin is proved: (1) Scripture expressly establishes this—the incest of Absalom is put forward as a punishment of David sent by God: “Thus saith the Lord, Behold, I will raise up evil against thee out of thine own house, and I will take thy wives before thine eyes, and give them unto thy neighbor, and he shall lie with thy wives in the sight of this sun. For thou didst it secretly: but I will do this thing before all Israel, and before the sun” (2 S. 12:11, 12). Nor can it be objected that “there was nothing penal here, only a bare permission and that the incest itself was not punishment formally.” We answer that the punishment of David ought to be a public disgrace and loss inflicted upon him before the sun and all Israel, and it was a pollution of David’s bed. Now the divine permission was neither formally a detriment to David, nor made publicly before the sun, but secretly in the impure heart of Absalom.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/francis-turretin.html">Francis Turretin</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Institutes of Elenctic Theology</cite>, 9.15</span></figcaption>

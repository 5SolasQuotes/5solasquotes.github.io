<main class="wrap"><figure class="quote" id="q-c00c712793" data-kw="">
<blockquote><p>Since, not only the complete finishing of this Treatise under my hand, which is now about 5 Months ago, but also the Printing of some Part of it, the Two Dissertations of Dr Davenant, of the Death of Christ, and of Predestination and Reprobation were set forth: in both which, especially the former, there are sundry Assertions, Positions, and Thesis, differing from what is delivered in the ensuing Treatise, and as I suppose repugnant unto Truth itself: The whole of that Persuasion, I confess, which he endeavoureth in them to maintain, is suited to the Expressions of sundry Learned men, as Austin, Hillary, Fulgentius, Prosper, who in their Generations deserved exceeding well or the Church of God:

But that it is free from Opposition to the Scripture, or indeed self-Contradiction, is not so apparent. Yea, through the Patience and Goodness of God, I undertake to demonstrate, That the main Foundation of his whole Dissertation about the Death of Christ, with many Inferences from thence, are neither found in, nor founded on the Word, but that the several Parts thereof, are mutually Conflicting and destructive of each other, to the great prejudice of the Truth therein contained.

It is a thing of the saddest Consideration possible, That Wise and Learned men, should once suppose, by tempering the Truths of God, so that they may be suited to the self-Indulgency of unsubdued Carnal Affections, to give any Lustre to them, or in the least to remove that Scandal and Offence, which the fleshly minded doth take continually at those Ways of God, which are far above out of its sight. That this is the grand design of such undertakings, as that of the Learned Bishop now mentioned, even to force the Mysteries of the Gospel, to a Condescension and suitableness unto the unpurged Relics of the Wisdom of Nature, when all our thoughts ought to be captivated to the obedience thereof, is to me most apparent.

Whence else should it proceed, that so many unscriptural Distinctions, of the various Intentions of God in the business of Redemption, with the holding out for the Confirmation of one part of their Opinion, viz. That Christ died for all, and every one, in such a sense, those very Arguments, which the most that own the Truth of their Inferences, do employ merely against the latter part of their Opinion, viz In some sense he died only for the Elect, with sundry inextricable Intanglements, should fill up both the Pages of their Discourses.

It is no way clear to me, what Glory redoundeth to the Grace of God, what Exaltation is given to the Death of Christ, what Encouragement to sinners in the things of God, by maintaining, That our Saviour in the Intention, and from the Designment of his Father, died for the Redemption of Millions, for whom he purchased not one dram of saving Grace, and concerning whom, it was the Purpose of God from Eternity, not to make out unto them effectually, any of those means for a participation in the fruits of his Death, without which it is impossible but it should be useless and unprofitable unto them: and yet this is the main Design of that Dissertation concerning the Death of Christ: What in that, and the ensuing Discourse, is argued and contended for, according to the mind of God, we thankfully accept: and had it not been condited with the unsavoury salt of human wisdom, it had been exceeding acceptable, especially at this time.

For, 2, That there are some more than ordinary Endeavours for the Supportment and Re-enforcing of the almost conclamated Cause of Arminianism, ready to be handed unto public view, is commonly reported and believed: concerning which also many swelling words (of which there lies great abundance on every side) are daily vented, as of some unparalleled product of Truth and Industry, as though, Nil oriturum alias, nil ortum tale, for the most part, by such as are utterly ignorant, how far these Controversies have been sifted, and to what Issue they have been driven long ago.</p></blockquote>

</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-2c726bebc9" data-kw="">
<blockquote><p>“There are others, who, rejecting that first absolute decree, and rightly so, make the conditional decree so common to all men that they assert that the counsel of God the Father in delivering the Son to death and of the Son in undergoing the same, and their intention and scope, was to acquire, impetrate and merit for all and every sinful man by that most precious death and passion, that, if they repent, when they are capable of doctrine and believe in Christ, they might be able to be reconciled with God and receive the remission of sins. They deny, however, that actual reconciliation with God or the remission of sins or eternal life was actually acquired or impetrated for those who remain in impenitence. 11. Since these deny that Christ died equally for the impious and the pious, and affirm that only the pious may glory in the satisfaction of Christ, because the principal fruit and efficacy of the satisfaction comes to them, they agree in sense with all other Orthodox on that point, even if they differ in their mode of speaking; especially since they acknowledge a certain special decree, according to which He died specially for the elect alone, by which they are brought not only to the common, but also to the singular benefits, namely the grace of regeneration and of efficacious calling, of justification and of glorification; and to the merit of Christ’s death they assign the true and efficacious communion, bestowal and application of saving grace, and the donation of faith itself, by which the application is made.</p></blockquote>

<blockquote><p>The first contains the preparation of the remedy necessary for man’s salvation; the second brings with it an application of the same. And consequently the one may well appertain to the common nature, which the Son assumed, when the other is a special privilege vouchsafed to such particular persons only, as the Father has given Him. And therefore we may safely conclude out of all these premises, that ‘the Lamb of God, offering Himself a sacrifice for the sins of the whole world,’ intended by giving sufficient satisfaction to God’s justice, to make the nature of man, which He assumed, a fit subject for mercy and to prepare a medicine for the sins of the whole world, which should be denied to none that intended to take the benefit of it: howsoever He intended not by applying this all-sufficient remedy unto every person in particular to make it effectual unto the salvation of all, or to procure thereby actual pardon for the sins of the whole world. So, in one respect He may be said to have died for all; yet so as in respect of his mercy He may be counted a kind of universal cause of the restoring of our nature, as Adam was of the depraving of it…</p></blockquote>

<div class="actions"><button class="copy" data-copy="“The first contains the preparation of the remedy necessary for man’s salvation; the second brings with it an application of the same. And consequently the one may well appertain to the common nature, which the Son assumed, when the other is a special privilege vouchsafed to such particular persons only, as the Father has given Him. And therefore we may safely conclude out of all these premises, that ‘the Lamb of God, offering Himself a sacrifice for the sins of the whole world,’ intended by giving sufficient satisfaction to God’s justice, to make the nature of man, which He assumed, a fit subject for mercy and to prepare a medicine for the sins of the whole world, which should be denied to none that intended to take the benefit of it: howsoever He intended not by applying this all-sufficient remedy unto every person in particular to make it effectual unto the salvation of all, or to procure thereby actual pardon for the sins of the whole world. So, in one respect He may be said to have died for all; yet so as in respect of his mercy He may be counted a kind of universal cause of the restoring of our nature, as Adam was of the depraving of it…”

— James Ussher, The Whole Works of the Most Rev. James Ussher, … 17 vols. (Dublin: Hodges &amp; Smith, 1864), vol. 12 | ‘Of the True Intent &amp; Extent of Christ’s Death &amp; Satisfaction upon the Cross’ (1617), pp. 552-60, p. 559">Copy</button><a class="share" href="https://x.com/intent/post?text=%E2%80%9CThe+first+contains+the+preparation+of+the+remedy+necessary+for+man%E2%80%99s+salvation%3B+the+second+brings+with+it+an+application+of+the+same.+And+consequently+the+one+may+well+appertain+to+the+common+nature%2C+which+the+Son+assumed%2C+when+the+other+is+a+special+privilege+vouchsafed+to+such+particular+persons+only%2C+as+the+Father+has+given+Him.+And+therefore+we+may+safely+conclude+out+of+all+these+premises%2C+that+%E2%80%98the+Lamb+of+God%2C+offering+Himself+a+sacrifice+for+the+sins+of+the+whole+world%2C%E2%80%99+intended+by+giving+sufficient+satisfaction+to+God%E2%80%99s+justice%2C+to+make+the+nature+of+man%2C+which+He+assumed%2C+a+fit+subject+for+mercy+and+to+prepare+a+medicine+for+the+sins+of+the+whole+world%2C+which+should+be+denied+to+none+that+intended+to+take+the+benefit+of+it%3A+howsoever+He+intended+not+by+applying+this+all-sufficient+remedy+unto+every+person+in+particular+to+make+it+effectual+unto+the+salvation+of+all%2C+or+to+procure+thereby+actual+pardon+for+the+sins+of+the+whole+world.+So%2C+in+one+respect+He+may+be+said+to+have+died+for+all%3B+yet+so+as+in+respect+of+his+mercy+He+may+be+counted+a+kind+of+universal+cause+of+the+restoring+of+our+nature%2C+as+Adam+was+of+the+depraving+of+it%E2%80%A6%E2%80%9D%0A%0A%E2%80%94+James+Ussher%2C+The+Whole+Works+of+the+Most+Rev.+James+Ussher%2C+%E2%80%A6+17+vols.+%28Dublin%3A+Hodges+%26+Smith%2C+1864%29%2C+vol.+12+%7C+%E2%80%98Of+the+True+Intent+%26+Extent+of+Christ%E2%80%99s+Death+%26+Satisfaction+upon+the+Cross%E2%80%99+%281617%29%2C+pp.+552-60%2C+p.+559&amp;url=https%3A%2F%2F5solasquotes.github.io%2Fquote%2F755e0e1434.html&amp;via=5Solas" target="_blank" rel="noopener">Share on X</a><a class="perma" hre <blockquote><p>VIII. We do very much differ from this opinion [of Arminians]: We acknowledge that Christ died for all; but we deny that by his death salvation and forgiveness of sin is obtained for all men: or that reconciliation is made for Cain, Pharaoh, Saul, Judas, etc. Neither do we think that remission of sins is obtained for anyone whose sins are not remitted, or that salvation was purchased for him, whom God from eternity has decreed to condem: For this were a vaine purchase. We deny that election is after the death of Christ, as for many other causes, so also because Christ in the very agony of death gave a notable proof of election in the thief, whose heart He affected, and enlightned his mind after an unutterable manner; the other thief being left and neglected. And seeing Christ does everywhere say that He died for his sheep, and for those whom his Father gave Him, He does sufficiently declare that He died for the elect.

IX. And when we say that Christ died for all, we take it thus, to wit, that the death of Christ is sufficient to save whosoever do believe, yea, and that it is sufficient to save all men, if all men in the whole world did believe in Him: And that the cause why all men are not saved, is not in the insufficiency of the death of Christ, but in the wickedness and incredulity of man. Finally Christ may be said to reconcile all men to God by his death after the same manner that we say that the sun does enlighten the eyes of all men, although many are blind, many sleep, and many are hid in darkeness: Because if all and several men had their eyes and were awake, and were in the midst of the light, the light of the sun were sufficient to enlighten them. Neither is it any doubt but that it may be said, not only that Christ died for all men, but also that all men are saved by Christ, because among men, there is none saved but by Christ: After the same manner that the apostle says, 1 Cor. 15:20, that all men are made alive by Christ, because no man is made alive but by Him.</p></blockquote>

<blockquote><p>Objection 4. The fathers which believed aright do affirm that Christ redeemed all and the whole world. Answer: Whereas they write that Christ redeemed all men and the world, their meaning is that He did it according unto sufficiency and the common cause and common nature of all, which Christ did take upon Him: and not effectually on God’s part. This very thing does Prosper (Resp. ad object. vin. 1, obj.) make plain: ‘All men’ (says he): ‘are rightly said to be redeemed in respect of the one nature of all and the one cause of all, which our Lord did truly take upon Him: and yet all are not delivered from captivity: The propriety of redemption without doubt belongs unto them for whom the prince of the world is sent abroad:—whose death was not so bestowed for mankind as that it should also pertain unto the redemption of them who were not to be regenerated.’ And again he says (Ad Capit. Gall., ch. 9): ‘Our Savior may fitly be said to be crucified for the redemption of all the world, both in respect that He truly took upon Him the nature of man, and also in respect of the common or general perdition in the first man: and yet He may be said to be crucified only for those unto whom his death was available.’ Moreover the fathers speak of the universality and of the world of believers. So says he that is the author of The Calling of the Gentiles: ‘The people of God’ (says he, bk. 1) ‘have their fulness?&#x27;</p></blockquote>

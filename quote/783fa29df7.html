<main class="wrap"><figure class="quote" id="q-783fa29df7" data-kw="">
<blockquote><p>THE OBSERVANCE OF THE SUPPER WITH BOTH BREAD AND WINE. We think that rite, manner, or form of the Supper to be the most simple and excellent which comes nearest to the first institution of the Lord and to the apostles’ doctrine. It consists in proclaiming the Word of God, in godly prayers, in the action of the Lord himself, and its repetition, in the eating of the Lord’s body and drinking of this blood; in a fitting remembrance of the Lord’s death, and a faithful thanksgiving; and in a holy fellowship in the union of the body of the Church. We therefore disapprove of those who have taken from the faithful one species of the sacrament, namely, the Lord’s cup. For these seriously offend against the institution of the Lord who says: “Drink ye all of this”; which he did not so expressly say of the bread.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/heinrich-bullinger.html">Heinrich Bullinger</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Second Helvetic Confession(1566)</cite>, 21</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/the-lords-supper.html">The Lord&#x27;s Supper</a></span></div>

</figure><figure class="quote" id="q-820b3cb529" data-kw="">
<blockquote><p>Do they [our divines] not teach… That the negative precepts of the Law do bind, not only at all times, but likewise to all times, (whereupon it follows that we may never do that which is inconvenient or scandalous), and that the affirmative precepts though they bind at all times, yet not to all times, but only quando expedit [when it is expedient] (whereupon it follows that we are never bound to the practice of any duty commanded in the Law of God except only when it is expedient to be done)? …forasmuch as to abstain from things scandalous and inconvenient is one of the negative precepts of the Law of God… it follows that the use and practice of the same is altogether unlawful unto us.</p></blockquote>

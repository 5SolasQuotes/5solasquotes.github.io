<blockquote><p>10. Q. What duties are done by the Minister?

A. 1 Reading the word. Act. 13.27. Col. 4.16.

2 Preaching it. Luk. 4.20, 21. Act. 13.15.

3 Praying and praising God. I Cor. 14. 15, 16. Neh. 8.6 &amp; 9.5, 6.

4 Administring Sacraments. Mat. 28.19 &amp; 26.26. Act. 20.11.

5. Blessing the people. Num. 6.23.

In performing the two first (reading and preaching the word) and the two last (administering Sacraments, and blessing the people) the Minister stands in God’s room, and is his mouth: but in the middlemost duty (praying to God and praising him) he is the people’s mouth to God.</p></blockquote>

<blockquote><p>…these were to be offered continually as a burnt offering upon the altar, which law was not to take place until they came into the [Promised] Land, as we heard before in the like case, [Num.] ch. 15:2, because in the desert they wanted many things necessary, Dt. 12:8, which was a sufficient dispensation for the omitting of them: For when God does require anything, He gives means to perform it; and did never impute it as a sin unto them when an inevitable necessity did hinder them, and the desire to obey is no less accepted than obedience itself.</p></blockquote>

<blockquote><p>The woman said to Him, “Sir, I perceive that You are a prophet. Our fathers worshipped on this mountain, and you Jews say that in Jerusalem is the place where one ought to worship.” John 4:19-20

Commenting on this passage, John Calvin warns us about the danger of human autonomy in the worship of God:

Our fathers. It is a mistaken opinion which some hold, that the woman, finding the reproof [of her sexual immorality] to be disagreeable and hateful, cunningly changes the subject. On the contrary, she passes from what is particular to what is general, and, having been informed of her sin, wishes to be generally instructed concerning the pure worship of God. She takes a proper and regular course, when she consults a Prophet, that she may not fall into a mistake in the worship of God. It is as if she inquired at God himself in what manner he chooses to be worshipped; for nothing is more wicked than to contrive various modes of worship without the authority of the word of God.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/john-calvin.html">John Calvin</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Commentary on the gospel according to John</cite>, trans. William Pringle (Geneva, 1553) in Calvin’s commentaries (22 vols, Grand Rapids, 1993), xvii, 154.</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/worship.html">Worship</a></span></div>

</figure><figure class="quote" id="q-2cfa4393d8" data-kw="Mary Queen of Heaven Satan Grace">
<blockquote><p>Hence we see how widely the Papists differ from her, who idly adorn her with their empty devices, and reckon almost as nothing the benefits which she received from God. They heap up an abundance of magnificent and very presumptuous titles, such as, &quot;Queen of Heaven, Star of Salvation, Gate of Life, Sweetness, Hope, and Salvation.&quot; Nay more, to such a pitch of insolence and fury have they been hurried by Satan, that they give her authority over Christ; for this is their pretty song, &quot;Beseech the Father, Order the Son.&quot; None of these modes of expression, it is evident, proceeded from the Lord. All are disclaimed by the holy virgin in a single word, when she makes her whole glory to consist in acts of the divine kindness. If it was her duty to praise the name of God alone, who had done to her wonderful things, no room is left for the pretended titles, which come from another quarter.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/john-calvin.html">John Calvin</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Commentary on a Harmony of the Evangelists</cite>, Luke 1:48-49</span></figcaption>

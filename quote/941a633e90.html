<main class="wrap"><figure class="quote" id="q-941a633e90" data-kw="">
<blockquote><p>These verses show us how little the Jews of our Lord’s time understood the right use of the Sabbath day. We read that some of the Pharisees found fault because a blind man was miraculously healed on the Sabbath. They said, “This man is not of God, because He keepeth not the Sabbath day.” A good work had manifestly been done to a helpless fellow-creature. A heavy bodily infirmity had been removed. A mighty act of mercy had been performed. But the blind-hearted enemies of Christ could see no beauty in the act. They called it a breach of the Fourth Commandment!

These would-be wise men completely mistook the intention of the Sabbath. They did not see that it was “made for man,” and meant for the good of man’s body, mind, and soul. It was a day to be set apart from others, no doubt, and to be carefully sanctified and kept holy. But its sanctification was never intended to prevent works of necessity and acts of mercy. To heal a sick man was no breach of the Sabbath day. In finding fault with our Lord for so doing, the Jews only exposed their ignorance of their own law. They had forgotten that it is as great a sin to add to a commandment, as to take it away.

Here, as in other places, we must take care that we do not put a wrong meaning on our Lord’s conduct. We must not for a moment suppose that the Sabbath is no longer binding on Christians, and that they have nothing to do with the Fourth Commandment. This is a great mistake, and the root of great evil. Not one of the ten commandments has ever been repealed or put aside. Our Lord never meant the Sabbath to become a day of pleasure, or a day of business, or a day of traveling and idle dissipation. He meant it to be “kept holy” as long as the world stands.

It is one thing to employ the Sabbath in works of mercy, in ministering to the sick, and doing good to the distressed. It is quite another thing to spend the day in visiting, feasting, and self-indulgence. Whatever men may please to say, the way in which we use the Sabbath a sure test of the state of our religion. By the Sabbath may be found out whether we love communion with God. By the Sabbath may be found out whether we are in tune for heaven. By the Sabbath, in short, the secrets of many hearts are revealed. There are only too many of whom we may say with sorrow, “These men are not of God, because they keep not the Sabbath day.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/j-c-ryle.html">J. C. Ryle</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Expository Thoughts on John: Volume 2</cite>, (1869; Edinburgh: Banner of Truth, 1987), pp 166-68.</span></figcaption>

<blockquote><p>That it is an ancient and excellent ordinance of God, that in his worship and service we should sing psalms, even David’s Psalms, and that we should sing them in that manner as may be most unto edification. Observe the proof of this doctrine, as I shall propound it unto you distinctly in three points: … Thirdly, the Psalms that God’s people did use to sing in the worship of God were most usually David’s Psalms, and those that are accounted among his: and that even at such times when there were prophets in the Church that had extraordinary gifts, and were inspired by the Holy Ghost, yet the Church did not usually sing any other than David’s Psalms: This we shall see in the days of Hezekiah, 2 Chron. 29:30. Hezekiah the King, and the princes commanded the Levites to sing praise to the Lord, with the words of David, and of Asaph the Seer. The like we may see in Ezra’s time, Ezra 3:10. They set the priests in their apparel with trumpets; and the Levites the sons of Asaph with cymbals to praise the Lord with those songs (as Tremelius rendreth it) that David the King of Israel did deliver; and the Psalm they sung was, Ps. 136, as appeareth by the 11th verse. And this may also further appear by that which we read, Neh. 12:46. To which purpose it is worthy the observing that though there were many of God’s holy servants that made songs, and psalms beside David, as Deborah, Jud. 5:1, and Anna, the mother of Samuel, 1 Sam. 2:1, and Solomon, Cant. 1:1, and Mary the blessed Virgin, Lk. 1:46, such as might be used, yet were none of them committed to the musicians to be publicly sung in the temple, but these of David only. In which respect he (by an excellency) is called the sweet Psalmist of Israel, 2 Sam. 3:1.</p></blockquote>

<blockquote><p>These are public duties. The private are some with reference to the public to prepare for it, and make use of it before and after, fitting our hearts to hear by prayer and meditation, and the like, and by praying and meditation applying that to our selves which we have heard, as the Bereans examined the Doctrine of Paul; some again without such reference, as all holy exercises of singing of Psalms, prayer, meditation, reading, together with actions of mercy, in laying aside as God hath blessed us for the use of the poor, and in visiting and relieving the sick, comfortless, needy, and the like; all which are acts as well of holiness toward God, as of mercy toward men. Especially we must know that it is our duty to meditate upon the great works of our Creation and Redemption, and our eternal rest in heaven, seeing the Sabbath is given us as a memorial of the two former, and an assurance of the later, that being the excellent rest, our entering into which this holy rest doth point at and help unto.

We must not only keep the Sabbath in the Church-meetings and solemn Assemblies (though it be specially appointed for the public worship) but at home in our houses, Levit. 23. 3. We must awake with God in the morning, begin with him, rise early, spend not much time in dressing of our selves that day, it is the Sabbath of the Lord, have holy thoughts while we are dressing our selves, pray to the Lord to pardon all our sins, and to put us into a holy frame, and yet finish all this so soon that we may be with the first in the public Assembly.

We may after the first Sermon eat and drink, but for spiritual ends and purposes, that our bodies being refreshed we may be the fitter to serve God, but must take heed of spending too much time, or feeding too liberally, which may cause drowsiness. We must then season all with heavenly discourse, Luke 4. from v. 1. to 25. We must not speak our own words. After the public worship is ended we must call our Families together and repeat what we have heard, and catechize them in the principles of Religion, Heb. 2. 1, 3. the fourth Commandment, sing Psalms and pray. At night we should bless God for the mercies of the day, lie down with a great deal of soul-refreshment, sleeping in the bosom of Jesus Christ.

And this is the matter of the duties to be performed, the manner is to consecrate the same as a delight unto God, with comfort and joy serving him on that day, as we do with comfort and cheerfulness follow our common business on the week days, as the Prophet Isaiah chap. 58. 13. expressly requireth. And call the Sabbath a delight] Call, that is, make or count, an Hebrew phrase often used in Isaiah: Sabbath; Some by it understand the extraordinary Sabbath or day of Fast, because in the beginning of the Chapter there is an expostulation about it, Levit. 16. 31. but the Lord is now speaking of an entire reformation; My holy day, the Sabbath, agree not so properly to an arbitrary Sabbath: A delight] LXX thy delicate things, i. one of the choicest privileges God hath given thee.</p></blockquote>

And this is the matter of the duties to be performed, the manner is to consecrate the same as a delight unto God, with comfort and joy serving him on that day, as we do with comfort and cheerfulness follow our common business on the week days, as the Prophet Isaiah chap. 58. 13. expressly requireth. And call the Sabbath a delight] Call, that is, make or count, an Hebrew phrase often used in Isaiah: Sabbath; Some by it understand the extraordinary Sabbath or day of Fast, because in the beginning of the Chapter there is an expostulation about it, Levit. 16. 31. but the Lord is now speaking of an entire reformation; My holy day, the Sabbath, agree not so properly to an arbitrary Sabbath: A delight] LXX thy delicate things, i. one of the choicest privileges God hath given thee.”

— Edward Leigh, A system or body of divinity consisting of ten books: wherein the fundamentals and main grounds of religion are opened, the contrary errors refuted, most of the controversies between us, the papists, Arminians, and Socinians discussed and handled, several Scriptures explained and vindicated from cor, (London: William Lee, 1654), IX.V, pp 819-20.">Copy</button><a class="share" href="https://x.com/intent/post?text=%E2%80%9CThese+are+public+duties.+The+private+are+some+with+reference+to+the+public+to+prepare+for+it%2C+and+make+use+of+it+before+and+after%2C+fitting+our+hearts+to+hear+by+prayer+and+meditation%2C+and+the+like%2C+and+by+praying+and+meditation+applying+that+to+our+selves+which+we+have+heard%2C+as+the+Bereans+examined+the+Doctrine+of+Paul%3B+some+again+without+such+reference%2C+as+all+holy+exercises+of+singing+of+Psalms%2C+prayer%2C+meditation%2C+reading%2C+together+with+actions+of+mercy%2C+in+laying+aside+as+God+hath+blessed+us+for+the+use+of+the+poor%2C+and+in+visiting+and+relieving+the+sick%2C+comfortless%2C+needy%2C+and+the+like%3B+all+which+are+acts+as+well+of+holiness+toward+God%2C+as+of+mercy+toward+men.+Especially+we+must+know+that+it+is+our+duty+to+meditate+upon+the+great+works+of+our+Creation+and+Redemption%2C+and+our+eternal+rest+in+heaven%2C+seeing+the+Sabbath+is+given+us+as+a+memorial+of+the+two+former%2C+and+an+assurance+of+the+later%2C+that+being+the+excellent+rest%2C+our+entering+into+which+this+holy+rest+doth+point+at+and+help+unto.%0A%0AWe+must+not+only+keep+the+Sabbath+in+the+Church-meetings+and+solemn+Assemblies+%28though+it+be+specially+appointed+for+the+public+worship%29+but+at+home+in+our+houses%2C+Levit.+23.+3.+We+must+awake+with+God+in+the+morning%2C+begin+with+him%2C+rise+early%2C+spend+not+much+time+in+dressing+of+our+selves+that+day%2C+it+is+the+Sabbath+of+the+Lord%2C+have+holy+thoughts+while+we+are+dressing+our+selves%2C+pray+to+the+Lord+to+pardon+all+our+sins%2C+and+to+put+us+into+a+holy+frame%2C+and+yet+finish+all+this+so+soon+that+we+may+be+with+the+first+in+the+public+Assembly.%0A%0AWe+may+after+the+first+Sermon+eat+and+drink%2C+but+for+spiritual+ends+and+purposes%2C+that+our+bodies+being+refreshed+we+may+be+the+fitter+to+serve+God%2C+but+must+take+heed+of+spending+too+much+time%2C+or+feeding+too+liberally%2C+which+may+cause+drowsiness.+We+must+then+season+all+with+heavenly+discourse%2C+Luke+4.+from+v.+1.+to+25.+We+must+not+speak+our+own+words.+After+the+public+worship+is+ended+we+must+call+our+Families+together+and+repeat+what+we+have+heard%2C+and+catechize+them+in+the+principles+of+Religion%2C+Heb.+2.+1%2C+3.+the+fourth+Commandment%2C+sing+Psalms+and+pray.+At+night+we+should+bless+God+for+the+mercies+of+the+day%2C+lie+down+with+a+great+deal+of+soul-refreshment%2C+sleeping+in+the+bosom+of+Jesus+Christ.%0A%0AAnd+this+is+the+matter+of+the+duties+to+be+performed%2C+the+manner+is+to+consecrate+the+same+as+a+delight+unto+God%2C+with+comfort+and+joy+serving+him+on+that+day%2C+as+we+do+with+comfort+and+cheerfulness+follow+our+common+business+on+the+week+days%2C+as+the+Prophet+Isaiah+chap.+58.+13.+expressly+requireth.+And+call+the+Sabbath+a+delight%5D+Call%2C+that+is%2C+make+or+count%2C+an+Hebrew+phrase+often+used+in+Isaiah%3A+Sabbath%3B+Some+by+it+understand+the+extraordinary+Sabbath+or+day+of+Fast%2C+because+in+the+beginning+of+the+Chapter+there+is+an+expostulation+about+it%2C+Levit.+16.+31.+but+the+Lord+is+now+speaking+of+an+entire+reformation%3B+My+holy+day%2C+the+Sabbath%2C+agree+not+so+properly+to+an+arbitrary+Sabbath%3A+A+delight%5D+LXX+thy+delicate+things%2C+i.+one+of+the+choicest+privileges+God+hath+given+thee.%E2%80%9D%0A%0A%E2%80%94+Edward+Leigh%2C+A+system+or+body+of+divinity+consisting+of+ten+books%3A+wherein+the+fundamentals+and+main+grounds+of+religion+are+opened%2C+the+contrary+errors+refuted%2C+most+of+the+controversies+between+us%2C+the+papists%2C+Arminians%2C+and+Socinians+discussed+and+handled%2C+several+Scriptures+explained+and+vindicated+from+cor%2C+%28Lon </figure><figure class="quote" id="q-d0eb2eaa06" data-kw="">
<blockquote><p>It seemeth his care was to keep up those Universities, which others would ruin: which made Grotius pronounce many Christians to be worse than the Philistines; for they 1 Sam. 10. 5. would let the company of Prophets alone, even where they kept Garrison: it hath been not from the good will of these men, but from the favour of God, and our Governors, that in the midst of wars we have enjoyed the like safety and protection. However, seeing the Philosophers of old were wont to dispute in the Temple of Peace, till it was demolished, and Intellectus being in quiet. Such a Temple is a Student’s best sanctuary. Pray we for the Peace of the State, for in it we shall have peace, and not be given up to the fury of those whose little Learning serveth them only to the declaim against what they want [lack] …</p></blockquote>

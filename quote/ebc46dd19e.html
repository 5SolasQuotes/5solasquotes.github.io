</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-a19e0e1f64" data-kw="">
<blockquote><p>…yet has there been too much mischief done by these acts, to wit… the barring of hopeful young-men from trials, in order to public preaching, and of able and godly expectants from being called and tried, in order to their entrance in the ministry, because they had no freedom in their consciences to take upon them the bonds required, which we have already set down: for, this act, as it has kept sundry congregations from calling expectants of that judgment, because there was no probable way how they could be tried or admitted to the ministry; So have sundry expectants, being called, been thereby barred from proceeding to their trials…; and sundry hopeful young-men have been necessitated to remove from the presbyteries and provinces wherein they do live, before they could be admitted to give any proof of their gifts for preaching…</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/james-guthrie.html">James Guthrie</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Protesters no Subverters, and presbyterie no papacie; or, A vindication of the protesting brethren, and of the government of the kirk of Scotland from the aspersions unjustly cast upon them… (1658)</cite>, pp. 77-78</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/the-church/schism-and-separation.html">Schism and Separation</a></span></div>

</figure><figure class="quote" id="q-89397af287" data-kw="">
<blockquote><p>Whatever have been the effects and fruit of meetings of persons of diverse families in times of corruption or trouble (in which cases many things are commendable which otherwise are not tolerable) yet, when God has blessed us with peace and purity of the Gospel, such meetings of persons of diverse families (except in cases mentioned in these Directions)¹ are to be disapproved, as tending to the hindrance of the religious exercise of each family by itself, to the prejudice of the public ministry, to the renting of the families of particular congregations, and (in process of time) of the whole Kirk, besides many offenses which might come thereby, to the hardening ofthe hearts of carnal men, and grief of the godly.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/john-currie.html">John Currie</a></span><span class="wk"><span class="lbl">Work:</span> <cite>An Essay on Separation: or a Vindication of the Church of Scotland contra the Seceders</cite></span></figcaption>

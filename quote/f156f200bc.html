<main class="wrap"><figure class="quote" id="q-f156f200bc" data-kw="">
<blockquote><p>I think all will-worship is not idolatry: Our Lord, who accused the Pharisees of will-worship, did not accuse them of idolatry… his accusing ministers of idolatry, for using a Service-book in the main right in respect of the worship, and a gesture [kneeling in receiving the Supper] avowed to be only to the true God, in a Church, holding in the main, the right Faith, under a prince that professes the same Faith and worship, and to be a defender of it. As for such relics of pagan customs, or Popish, as yet remain, though it were to be wished they were quite left [off], since they are not used in any honor to the pagan idols, but the original and reason of them at first [such as honor and decency], being almost if not quite forgotten by those that use them, and are become but as civil customs that have no state in [or condition of being] religious worship, experience shows that they are more easily reformed by neglect than by earnest declamations against them. Nor do I think the course this author takes, of seeking reformation by invectives and separations, likely to promote it, but to exasperate rulers and make opposites more violent in their way.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/john-tombes.html">John Tombes</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Theodulia, or a Just Defence of Hearing the Sermons &amp; other teaching of the present Ministers of England… (London: E. Cotes, 1667) | Sect. 16. The Crimination of the Ministers, as Idolaters, is not excusable</cite>, Ch. 7; pp. 263-64</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/worship/idolatry-and-images.html">Idolatry and Images</a></span></div>

</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-5b36801b03" data-kw="Mary Queen of Heaven">
<blockquote><p>In fact it contradicts the nature of deceased saints that they should be present in and care for diverse and widely scattered places at one and the same time, as when the [papal teachers] want to put one and the same saint in charge of diverse and widely scattered places. Think of Saint James for the Spanish, who dwell in Europe, India, and America. Or Saints Dominic and Francis, etc., for all their monasteries spread across the whole globe. Or even the blessed Virgin, whom they call Queen of Heaven, Mistress of the Earth, and Star of the Sea (Stella Maris)—even though this is a wrong rendering of Drop of the Sea (Stilla maris)—since it is fitting only for God to “look down from the heavens and behold all the sons of men, and from his dwelling-place to look forth upon all the inhabitants of the earth” (Psalm 33:13–14).</p></blockquote>

</figure><figure class="quote" id="q-8994f6114d" data-kw="">
<blockquote><p>As the religious homage done to an image, or even to elements, is in itself an external act of idolatry, insofar as the act is concerned, although the intention of such homage may be directed to God the Great First Cause, —so the act of kneeling to a piece of bread, seeing that, according to the ordinance, the whole man, internal and external, ought to be engaged in the elementary signs, is a relative act of worship and an adoration of the bread itself. The reason is: an intention to worship a material object is not of the essence of external adoration, as appears in a religious act of homage. Thus, the bending of the knee before the Babylonish image is an external act of worship, even though the three youths had no intention to worship any but the true God; and in like manner, those who, from fear or the hope of reward or vain-glory, bend the knee to Jeroboam’s golden calf (which the text clearly enough proclaims to have been done by the king himself, from no religious motive but the mere desire to rule), do pay ad- oration to the calf by the external act, although, no doubt, they may suppose the calf a mere created object and unworthy of honor,—because the act of homage, whether we mean it or not, is, from the ordinance of God and nature, a symbol of worship. Therefore, as the bread [in the Lord’s Supper] denotes the body of Christ (even though that idea be not present to the mind), so in like manner, kneeling, when used as a religious service, is the external adoration of that bread, in presence of which we bow as before the delegated representative of God, be our intention what it may.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/samuel-rutherford.html">Samuel Rutherford</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Letters (Edinburgh, 1894), pp. 193-94 Also reprinted by Banner of Truth. Rutherford is here quoting from some other public document, possibly from the Latin of David Calderwood’s Altar of Damascus, p. 595. | Letter 91, to Robert Gordon of Knockbrex</cite></span></figcaption>

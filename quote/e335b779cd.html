<blockquote><p>4. More might, and ought, to have been done [in regard to the dimensions of the Temple] by David and Solomon, if it had been a moral ground to build a house to be a witness of Almightiness; 3. And God appointed sacrifices and sacraments in both Testaments as testimonies of the great Lord Jesus; yet in base and obvious creatures; we may not devise symbols or witnessing images of the Almightiness of that God whom we serve, at our pleasure;</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/samuel-rutherford.html">Samuel Rutherford</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Divine Right of Church Government</cite>, … (1646), p. 92</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/worship/ceremonies-and-things-indifferent.html">Ceremonies and Things Indifferent</a></span></div>

</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-046661d6e9" data-kw="">
<blockquote><p>2. How does [Richard] Hooker prove that the vessels made for Baal are in their own nature more incurable than the sign of the cross? You may remove the superstitious intention and idolatrous use of any vessel and turn it to a good use; yet Josiah burnt them to ashes. The like may be said of the groves which he stamped to powder and cast in the brook Kidron, and of the chariots five of the sun which he burnt with fire, and of the bones of dead men, not any of these being of their own nature more indifferent and innocent creatures of God, [nor] were of their own nature more scandalous and more incurable than the sign of the cross. The like may be said of altars…</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/samuel-rutherford.html">Samuel Rutherford</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Divine Right of Church Government</cite>, (London, 1646), A Dispute Touching Scandal &amp; Christian Liberty, pp. 91-92</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/worship/ceremonies-and-things-indifferent.html">Ceremonies and Things Indifferent</a></span><span class="t"><a href="../topics/worship/idolatry-and-images.html">Idolatry and Images</a></span></div>

</figure><figure class="quote" id="q-c1d30d17d5" data-kw="">
<blockquote><p>Q. 26. Are our forefathers to be blamed for pulling down altars, images, and other monuments of idolatry, from places of public worship at the Reformation? No; they had Scripture precept and warrant for what they did, Num. 33:52, and Deut. 7:5 — “Ye shall destroy their altars, and break down their images, and cut down their groves, and burn their graven images with fire.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/james-fisher.html">James Fisher</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Assembly’s Shorter Catechism Explained</cite>, (1753)</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/worship/ceremonies-and-things-indifferent.html">Ceremonies and Things Indifferent</a></span></div>
<div class="actions"><button class="copy" data-copy="“Q. 26. Are our forefathers to be blamed for pulling down altars, images, and other monuments of idolatry, from places of public worship at the Reformation? No; they had Scripture precept and warrant for what they did, Num. 33:52, and Deut. 7:5 — “Ye shall destroy their altars, and break down their images, and cut down their groves, and burn their graven images with fire.”

— James Fisher, The Assembly’s Shorter Catechism Explained (1753)">Copy</button><a class="share" href="https://x.com/intent/post?text=%E2%80%9CQ.+26.+Are+our+forefathers+to+be+blamed+for+pulling+down+altars%2C+images%2C+and+other+monuments+of+idolatry%2C+from+places+of+public+worship+at+the+Reformation%3F+No%3B+they+had+Scripture+precept+and+warrant+for+what+they+did%2C+Num.+33%3A52%2C+and+Deut.+7%3A5+%E2%80%94+%E2%80%9CYe+shall+destroy+their+altars%2C+and+break+down+their+images%2C+and+cut+down+their+groves%2C+and+burn+their+graven+images+with+fire.%E2%80%9D%0A%0A%E2%80%94+James+Fisher%2C+The+Assembly%E2%80%99s+Shorter+Catechism+Explained+%281753%29&amp;url=https%3A%2F%2F5solasquotes.github.io%2Fquote%2Fc1d30d17d5.html&amp;via=5Solas" target="_blank" rel="noopener">Share on X</a><a class="perma" href="../quote/c1d30d17d5.html">Permalink</a><a class="src" href="https://reformedbooksonline.com/on-ceremonies/#:~:text=Q.%2026.%20Are%20our%20forefathers%20to,burn%20their%20graven%20images%20with%20fire&amp;text=Q.%2026.%20Are%20our%20forefathers%20to%20be%20blamed&amp;text=groves%2C%20and%20burn%20their%20graven%20images%20with%20fire" rel="noopener" target="_blank">Read it online · Reformed Books Online</a></div>
</figure><figure class="quote" id="q-c3e59fbef6" data-kw="">
<blockquote><p>All these upon my own knowledge were the true causes why so great a number of those persons who were counted most religious, fell in with the parliament in England; insomuch that the generality of the stricter diligent sort of preachers joined with them, though not in meddling with arms, yet in judgment, and in flying to their garrisons; and almost all those afterwards called presbyterians were before conformists: Very few of all that learned and pious synod at Westminster were nonconformists before, and yet were for the parliament, supposing that the interest of religion lay on that side. Yet did they still keep up an honorable esteem of all that they thought religious on the other side, such as Bishop Davenant, Bishop Hall, Bishop Morton, Archbishop Ussher, etc.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/richard-baxter.html">Richard Baxter</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Reliquiæ Baxterianæ: or, Mr. Richard Baxter’s Narrative of the most Memorable Passages of his Life &amp; Times</cite>, (London: Parkhurst, 1696), bk. 1, pt. 1, p. 33</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/worship/ceremonies-and-things-indifferent.html">Ceremonies and Things Indifferent</a></span></div>

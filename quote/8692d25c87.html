<blockquote><p>A Sinner made righteous before God by the Righteousness of Christ, is, as Renowned Luther used to say, Articulus stantis, aut cadentis Ecclesiae, The Crisis of a Churches standing or falling: For when the Galatians adulterated this Doctrine, they were reputed by the Apostle, as removed to another Gospel, Gal. 2.6.

And on this point Luther himself pitched the field against the Pope, and Roman Church; divers of whose grand Advocates, though they strongly opposed this Doctrine in their lives, yet owned it for the best divinity at their death: and before, Bellarmine was not alone in his Tutissimum est, ‘Tis the safest way to rest upon the mercy of God in Christ alone for salvation.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/obadiah-grew.html">Obadiah Grew</a></span><span class="wk"><span class="lbl">Work:</span> <cite>To the Serious Readers in The Lord Jesus Christ, the Lord our Righteousness, or, Christ the Righteousness of a Sinner before God delivered in Several Sermons</cite></span></figcaption>

<blockquote><p>Externally this covenant is made with every member of the Church, even with the parents and their children, so many as hear and embrace the promises of salvation, and give and dedicate their children unto God according to his direction; for the sacraments—what are they but seals of the covenant? But savingly, effectually, and in a special manner it is made only with them who are partakers of the benefits promised. And as the covenant is made outwardly or effectually, so some are the people of God externally, others internally and in truth. For they are the people of God with whom God has contracted a covenant, and who in like manner have sworn to the words of the covenant, God stipulating and the people receiving the condition; which is done two ways: [1] for either the covenant is made extrinsically, God by some sensible token gathering the people, and the people embracing the condition in the same manner, and so an external consociation of God and the people is made; [2] or the covenant is entered after an invisible manner, by the intervention of the Spirit, and that with so great efficacy that the condition of the covenant is received after an invisible manner, and so an internal consociation of God and the people is made up.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/john-ball.html">John Ball</a></span><span class="wk"><span class="lbl">Work:</span> <cite>A Treatise of the Covenant of Grace</cite>, … (London: 1645), ch. 3, ‘Of the Covenant of Grace in General’, p. 24</span></figcaption>

<blockquote><p>The applying work of Christ’s merit is that solemn part of his mediation, for the sake whereof He forsook the earth, and was exalted… and sits at the right hand of God his Father, that by his intercession always made for his Church, He might apply to all the members the power of this satisfaction, that it might work faith in those that want it, and confirm it in those that have it. Therefore He is called advocate, that the Church may enjoy the fruit of his death continually. And as the ends hereof are many, to wit… keep them in his love, to cover their daily offences, and continue their justification and acceptance…</p></blockquote>

<blockquote><p>13… And thus far there is the highest consensus among the Orthodox, although a certain dissensus intervenes in the explication of the material cause — some urging both the ἐνεργητική [energētikē, active] and the παθητική [pathētikē, passive] obedience, and conjoining satisfaction through obedience and through suffering; others seeking the material cause of our justification in satisfaction through suffering alone. 14. The foundation is safe among both parties. For both not only admit but also require the obedience of Christ perfectly rendered to the law for our justification; but they differ in the manner of explicating the matter. For some hold it to be the meritorious cause of our justification; others hold it to be the condition of the person and the causa sine qua non [indispensable cause] of meriting justification — namely, that it behoved us to have such a High Priest who was holy and undefiled, Heb. VII.26–27. Concerning which there is a certain dissensus of opinions, the unity of faith and charity being preserved, since both parties apprehend the whole Christ and Christ alone, and in Him whole and alone seek righteousness and life.</p></blockquote>

<blockquote><p>Neither have we departed from the doctrine of the Church, in that we teach that faith only justifies. For many of the ancient have used this form of words [though they also affirmed justification involves an inherent righteousness], as: Origen on Rom. 3: Dicit apostolus sufficere solius fidei justificationem, ita ut credens quis tantummodo justificetur, etiamsi nihil ab eo operis fuerit expletum. [The apostle says that the justification of faith alone is sufficient, so that a man is justified by believing alone, even if no work has been performed by him.] Hilary, can. 8. in Matthew: Fides sola justificat. [Faith alone justifies.] Basil, Homily on Humility: Haec est perfecta &amp; integra gloriatio in Deo, quando neque ob justitiam suam quis se iactat, sed novit quidem seipsum verae justitiae indigum, solâ autem fide in Christum justificatum. [This is perfect and complete boasting in God: when a person does not boast on account of his own righteousness, but knows himself indeed to be lacking true righteousness, and is justified by faith alone in Christ.] Ambrose on Rom. 3: Iustificati sunt gratis, quia nihil operantes, neque vicem reddentes, sola fide justificati sunt dono Dei. [They are justified freely, because, doing nothing and rendering nothing in return, they are justified by faith alone, by the gift of God.] Chrysostom, Homily on Faith and the Law of Nature: Eum qui operatur opera iustitiae sine fide non potes probare vivum esse, fidem absque operibus possum monstrare, et vixisse, et regnum coelorum assecutam, nullus sine fide vitam habuit, latro autem credidit tantum, et iustificatus est. [You cannot prove that one who performs works of righteousness without faith is alive; but I can show that faith without works has both lived and attained the kingdom of Heaven. No one has had life without faith; but the thief believed only, and was justified.] Augustine bk. 1, Contra the Two Epistles of Pelagius, ch. 21 Quantaelibet fuisse virtutis antiquos praedices justos, non eos salvos fecit nisi fides mediatoris. [However great you may proclaim the virtue of the righteous of old to have been, it did not save them except the faith of the Mediator.] 83 Questions, q. 76 Si quis cum crediderit mox de hac vita decesserit, iustificatio fidei manet cum illo: nec praecedentibus bonis operibus, quia non merito ad illam, sed gratia pervenit, nec consequentibus, quia in hac vita esse non sinitur. [If anyone, after he has believed, immediately departs from this life, the justification of faith remains with him: not by preceding good works, because he attained to it not by merit but by grace; nor by subsequent works, because he is not permitted to remain in this life.] Theophylact, on Gal. 3: Nunc plane ostendit apostolus, fidem vel solam, iustificandi habere in se virtutem. [Now the apostle plainly shows that faith alone has within itself the power of justifying.] Bernard Sermon 22 on Canticles: Quisquis pro peccatis compunctus, esurit et sitit iustitiam, credat in te qui iustificas impium, at solam iustificatus per fidem, pacem habebitad te. [Whoever, pierced with sorrow for sins, hungers and thirsts for righteousness, let him believe in you who justifies the ungodly; and thus, justified by faith alone, he will have peace with you.] Epistle 77: Qui crediderit et baptizatus fuerit salvus erit. Caute, inquit, non repetiit, qui vero baptizatus non fuerit, condenabitur, sed tantum qui vero non crediderit, innuens nimirum solam fidem interdum sufficere ad salutem, et sine illa sufficere nihil. [He who has believed and has been baptized shall be saved. He carefully did not repeat, ‘but he who has not been baptized shall be condemned,’ but only, ‘he who has not believed,’ clearly indicating that faith alone sometimes suffices for salvation, and that without it nothing suffices.] Sometimes by these phrases of speech they exclude: [1] All that may be without supernatural knowledge, all that may be without a true profession. [2] Sometimes the necessity of good works in act or external good works.

3. The power of nature without illumination and grace.

4. The power of the Law.

5. The sufficiency of anything found in us to make us stand in judgment, to abide the trial, and not to fear condemnation. And in this sense faith only is said to justify, that is, the only mercy of God and merit of Christ apprehended by faith: and then the meaning of their speech is that only the persuasion and assured trust that they have, to be accepted of God for Christ’s sake, is that that makes them stand in judgment, without fear of condemnation. And in this sense all the divines formerly alleged for proof of the insufficiency of all our inherent righteousness, and the trust which we should have in the only mercy of God, and merit of Christ, do teach as we do, that faith only justifies. For neither they nor we exclude from the work of justification, [1] the action of God as the supreme and highest cause of our justification: for it is He that remits sin, and receives us to grace: [2] nor the merit of Christ, as that for which God inclines to show mercy to us, and to respect us: [3] nor the remission of sins, gracious acceptation, and grant of the gift of righteousness, as that by which we are formally justified: [4] nor those works of preventing grace, whereby out of the general apprehension of faith, God works in us dislike of our former condition, desire to be reconciled to God, to have remission of that [which] is past, and grace hereafter to decline the like evils, and to do contrary good things. For by these we are prepared, disposed and fitted for justification; without these none are justified. And in this sense, and to imply a necessity of these to be found in us, sometimes the Fathers and others say that we are not justified by faith only. And we all agree, that it is not our conversion to God, nor the change we find in ourselves, that can any way make us stand in judgment without fear, and look for any good from God, otherwise than in that we find ourselves so disposed and fitted, as is necessary for justification, whence we assure ourselves God will in mercy accept us for Christ’s sake.</p></blockquote>

ved.+He+carefully+did+not+repeat%2C+%E2%80%98but+he+who+has+not+been+baptized+shall+be+condemned%2C%E2%80%99+but+only%2C+%E2%80%98he+who+has+not+believed%2C%E2%80%99+clearly+indicating+that+faith+alone+sometimes+suffices+for+salvation%2C+and+that+without+it+nothing+suffices.%5D+Sometimes+by+these+phrases+of+speech+they+exclude%3A+%5B1%5D+All+that+may+be+without+supernatural+knowledge%2C+all+that+may+be+without+a+true+profession.+%5B2%5D+Sometimes+the+necessity+of+good+works+in+act+or+external+good+works.+3.+The+power+of+nature+without+illumination+and+grace.+4.+The+power+of+the+Law.+5.+The+sufficiency+of+anything+found+in+us+to+make+us+stand+in+judgment%2C+to+abide+the+trial%2C+and+not+to+fear+condemnation.+And+in+this+sense+faith+only+is+said+to+justify%2C+that+is%2C+the+only+mercy+of+God+and+merit+of+Christ+apprehended+by+faith%3A+and+then+the+meaning+of+their+speech+is+that+only+the+persuasion+and+assured+trust+that+they+have%2C+to+be+accepted+of+God+for+Christ%E2%80%99s+sake%2C+is+that+that+makes+them+stand+in+judgment%2C+without+fear+of+condemnation.+And+in+this+sense+all+the+divines+formerly+alleged+for+proof+of+the+insufficiency+of+all+our+inherent+righteousness%2C+and+the+trust+which+we+should+have+in+the+only+mercy+of+God%2C+and+merit+of+Christ%2C+do+teach+as+we+do%2C+that+faith+only+justifies.+For+neither+they+nor+we+exclude+from+the+work+of+justification%2C+%5B1%5D+the+action+of+God+as+the+supreme+and+highest+cause+of+our+justification%3A+for+it+is+He+that+remits+sin%2C+and+receives+us+to+grace%3A+%5B2%5D+nor+the+merit+of+Christ%2C+as+that+for+which+God+inclines+to+show+mercy+to+us%2C+and+to+respect+us%3A+%5B3%5D+nor+the+remission+of+sins%2C+gracious+acceptation%2C+and+grant+of+the+gift+of+righteousness%2C+as+that+by+which+we+are+formally+justified%3A+%5B4%5D+nor+those+works+of+preventing+grace%2C+whereby+out+of+the+general+apprehension+of+faith%2C+God+works+in+us+dislike+of+our+former+condition%2C+desire+to+be+reconciled+to+God%2C+to+have+remission+of+that+%5Bwhich%5D+is+past%2C+and+grace+hereafter+to+decline+the+like+evils%2C+and+to+do+contrary+good+things.+For+by+these+we+are+prepared%2C+disposed+and+fitted+for+justification%3B+without+these+none+are+justified.+And+in+this+sense%2C+and+to+imply+a+necessity+of+these+to+be+found+in+us%2C+sometimes+the+Fathers+and+others+say+that+we+are+not+justified+by+faith+only.+And+we+all+agree%2C+that+it+is+not+our+conversion+to+God%2C+nor+the+change+we+find+in+ourselves%2C+that+can+any+way+make+us+stand+in+judgment+without+fear%2C+and+look+for+any+good+from+God%2C+otherwise+than+in+that+we+find+ourselves+so+disposed+and+fitted%2C+as+is+necessary+for+justification%2C+whence+we+assure+ourselves+God+will+in+mercy+accept+us+for+Christ%E2%80%99s+sake.%E2%80%9D%0A%0A%E2%80%94+Richard+Field%2C+Other+citations+%28work+not+named%29%2C+Of+the+Church...+%28Oxford%3A+Turner%2C+1628%29%2C+bk.+3%2C+appendix%2C+ch.+11%2C+pp.+323-24&amp;url=https%3A%2F%2F5solasquotes.github.io%2Fquote%2F16a6aa85d0.html&amp;via=5Solas" target="_blank" rel="noopener">Share on X</a><a class="perma" href="../quote/16a6aa85d0.html">Permalink</a><a class="src" href="https://reformedbooksonline.com/on-a-twofold-justification/#:~:text=Neither%20have%20we%20departed%20from%20the,mercy%20accept%20us%20for%20Christ%E2%80%99s%20sake&amp;text=Neither%20have%20we%20departed%20from%20the%20doctrine%20of&amp;text=will%20in%20mercy%20accept%20us%20for%20Christ%E2%80%99s%20sake" rel="noopener" target="_blank">Read it online · Reformed Books Online</a></div>

<main class="wrap"><figure class="quote" id="q-cfcf386ef9" data-kw="">
<blockquote><p>[D]ear brethren, if you look for a life to come, of necessity it is that you exercise yourselves in the book of the Lord your God. Let no day slip or want some comfort received from the mouth of God. Open your ears, and He will speak even pleasant things to your heart. Close not your eyes, but diligently let them behold what portion of substance is left to you within your Father’s testament. Let your tongues learn to praise the gracious goodness of him, whose mere mercy has called you from darkness to life. Neither yet may you do this so quietly that you admit no witness. No, brethren, you are ordained of God to rule your own houses in his true fear, and according to his word. Within your houses, I say, in some cases, you are bishops and kings; your wife, children, servants, and family are your bishopric and charge. Of you it shall be required how carefully and diligently you have instructed them in God’s true knowledge, how you have studied to plant virtue in them, and [to] repress vice. And therefore I say, you must make them partakers in reading, exhorting, and in making common prayers, which I would in every house were used once a day at least. But above all things, dear brethren, study to practice in life that which the Lord commands, and then be you assured that you shall never hear nor read the same without fruit. And this much for the exercises within your homes.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/john-knox.html">John Knox</a></span><span class="wk"><span class="lbl">Work:</span> <cite>‘A most wholesome counsel how to behave ourselves in the midst of this wicked generation, touching on the daily exercise of God’s most holy and sacred word’, a letter, in Selected Writings of John Knox</cite>, 1577</span></figcaption>

<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/oliver-heywood.html">Oliver Heywood</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Family Altar in Works</cite>, vol. 4, p. 364</span></figcaption>

<blockquote><p>You go to bed and rise, one time after another, prayerless; you can keep them up late and call them up early to their work, but never say, ‘Come to prayer’; not a word of God all the day long, not a chapter read, not a psalm sung, not a prayer put up in the family from day to day;</p></blockquote>

</figure><figure class="quote" id="q-5e68c3262b" data-kw="">
<blockquote><p>Friday, Oct. 12. — Kept a family fast this day, that we might afflict ourselves before our God; to seek of Him a right way for us and for our little ones, and for all our substance: I trust it was such a fast as the Lord would choose: His divine presence was amongst us, and we had good reason to hope and believe, that the Lord was entreated of us, Oh that we may find more and more reason to say so, when we come on shore. I dread going into the world. But wherefore do I fear? Lord, I believe, O help my unbelief, that Thou wilt keep me unspotted from it.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/george-whitefield.html">George Whitefield</a></span><span class="wk"><span class="lbl">Work:</span> <cite>A Continuation of Whitefield’s Journal During the Time He was Detained in England, by the Embargo</cite>, vol. 2</span></figcaption>

</figure><figure class="quote" id="q-89bde2451f" data-kw="">
<blockquote><p>Mind it, families in their domestic capacity, as well as in a personal, or national capacity may be alienated from God, and may have a root that beareth gall and wormwood, then see what follows: this is that which makes evil families, when instead of praying, reading scriptures, singing psalms, there is cursing, swearing, mocking at serious godliness, vain or profane talk, at least only worldly discourse.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/oliver-heywood.html">Oliver Heywood</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Family Altar in Works</cite>, vol. 4, p. 319</span></figcaption>

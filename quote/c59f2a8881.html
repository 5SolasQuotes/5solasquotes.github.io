<main class="wrap"><figure class="quote" id="q-c59f2a8881" data-kw="">
<blockquote><p>Angels have limits both to their essence and to their operation, or, as it is termed, a sphere of activity. But it is difficult for us to understand… It is at least certain that they are not in a place strictly or locally so as to be extended or diffused in it; for they are not bodies, which alone are extended in space of their own and commensurate with it… Thomas [Quodlibet 1, q. 3, art. 1] is more correct [than Duns Scotus] in denying that they are in a place without operating, because they are everywhere and operate by knowledge and will, even ad extra, by glorifying God, and serving Him among men and all other creatures. So that they may be said to be in a place not because they are bounded by a place, but because they themselves rather bound the place by their operation, as Thomas rightly says… Therefore angels whom no medium resists must move very swiftly… Nor does it follow from this that angels move in a moment or by deserting their localization acquire a new one in a moment… as well as the distance between the termini, which involves some measure of delay.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/johann-heinrich-heidegger.html">Johann Heinrich Heidegger</a></span><span class="wk"><span class="lbl">Work:</span> <cite>as in Heinrich Heppe, Reformed Dogmatics</cite>, ch. 10, §§21-22, p. 209</span></figcaption>

</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-0cfc9f568c" data-kw="">
<blockquote><p>God only is properly and absolutely eternal: Angels and men’s souls are said to be eternal, à posteriori, or à parte post, God à priori et à posteriori, ex parte ante et post, since He has neither beginning, succession, nor end.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/edward-leigh.html">Edward Leigh</a></span><span class="wk"><span class="lbl">Work:</span> <cite>A System or Body of Divinity</cite>, (London: A.M., 1654), bk. 2, ch. 4, That God is infinite, omnipresent, eternal, p. 147</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/angels-and-demons/good-angels.html">Good Angels</a></span></div>
<div class="actions"><button class="copy" data-copy="“God only is properly and absolutely eternal: Angels and men’s souls are said to be eternal, à posteriori, or à parte post, God à priori et à posteriori, ex parte ante et post, since He has neither beginning, succession, nor end.”

— Edward Leigh, A System or Body of Divinity (London: A.M., 1654), bk. 2, ch. 4, That God is infinite, omnipresent, eternal, p. 147">Copy</button><a class="share" href="https://x.com/intent/post?text=%E2%80%9CGod+only+is+properly+and+absolutely+eternal%3A+Angels+and+men%E2%80%99s+souls+are+said+to+be+eternal%2C+%C3%A0+posteriori%2C+or+%C3%A0+parte+post%2C+God+%C3%A0+priori+et+%C3%A0+posteriori%2C+ex+parte+ante+et+post%2C+since+He+has+neither+beginning%2C+succession%2C+nor+end.%E2%80%9D%0A%0A%E2%80%94+Edward+Leigh%2C+A+System+or+Body+of+Divinity+%28London%3A+A.M.%2C+1654%29%2C+bk.+2%2C+ch.+4%2C+That+God+is+infinite%2C+omnipresent%2C+eternal%2C+p.+147&amp;url=https%3A%2F%2F5solasquotes.github.io%2Fquote%2F0cfc9f568c.html&amp;via=5Solas" target="_blank" rel="noopener">Share on X</a><a class="perma" href="../quote/0cfc9f568c.html">Permalink</a><a class="src" href="https://reformedbooksonline.com/on-angels/#:~:text=God%20only%20is%20properly%20and%20absolutely,has%20neither%20beginning%2C%20succession%2C%20nor%20end&amp;text=God%20only%20is%20properly%20and%20absolutely%20eternal%3A%20Angels&amp;text=since%20He%20has%20neither%20beginning%2C%20succession%2C%20nor%20end" rel="noopener" target="_blank">Read it online · Reformed Books Online</a></div>
</figure><figure class="quote" id="q-cdea257cab" data-kw="">
<blockquote><p>XL. Our [Reformed] theologians also inquire whether angels are part of the Church. Tilenus, Polanus and others who want the Church to be taken broadly enough to include even the angels affirm this. However, the illustrious Amyraldus, in his Theses on the Parts of the Church, denies it along with many others. I think briefly that there is great communion between angels and pious and faithful men, and that Christ’s death reconciled angels to men and closely united them, making angels protectors and guardians of the faithful and promoting their salvation. But pious men form a certain society among themselves to which angels do not belong. The name ‘Church’ in Scripture is only attributed to the society of men and never includes angels.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/louis-le-blanc.html">Louis Le Blanc</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Theological Theses Published at Various Times</cite>, vol. 2 3rd ed. tr. by AI by Colloquia Scholastica at Discord (1675; London, 1683), Nature &amp; Definition of the Church, p. 429 Latin</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/angels-and-demons/good-angels.html">Good Angels</a></span></div>
<div class="actions"><button class="copy" data-copy="“XL. Our [Reformed] theologians also inquire whether angels are part of the Church. Tilenus, Polanus and others who want the Church to be taken broadly enough to include even the angels affirm this. However, the illustrious Amyraldus, in his Theses on the Parts of the Church, denies it along with many others. I think briefly that there is great communion between angels and pious and faithful men, and that Christ’s death reconciled angels to men and closely united them, making angels protectors and guardians of the faithful and promoting their salvation. But pious men form a certain society among themselves to which angels do not belong. The name ‘Church’ in Scripture is only attributed to the society of men and never includes angels.”

</figure><figure class="quote" id="q-089a20e32e" data-kw="">
<blockquote><p>Each creature is limited by place, though spirits do not fill up a place† by commensuration of parts, yet they have a certain compass (as I may call it) beyond which their essence extends not: they are so here that they are not there; so in heaven, that they are not the same time on earth. † The angels are in an ubi [where] though not in a place properly; in English we cannot so well distinguish these words: they are limited and confined to some space; an angel cannot be at the same time in heaven and earth. But God is altogether above place, he is omnipresent, not by any material extension, but after an incomprehensible and unexpressible manner. He is quite above all place, wholly without and within all and every place, and that without all local motion or mutation of place. He is every where totally and equally…</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/edward-leigh.html">Edward Leigh</a></span><span class="wk"><span class="lbl">Work:</span> <cite>A System or Body of Divinity</cite>, (London: A.M., 1654), bk. 2, ch. 4, That God is infinite, omnipresent, eternal, p. 145</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/angels-and-demons/good-angels.html">Good Angels</a></span></div>

</figure><figure class="quote" id="q-75e6fff963" data-kw="">
<blockquote><p>Divine worship directed to such images or representations as to a mediate object, is idolatry. The ark and the cherubims, and the temple, were not made the object of worship. A learned man writes that incurvation in way of religion towards any symbolical presence, as to an object, is flat idolatry; if it be in worship of saints, angels, and demons, it is double idolatry; if in the worship of the true God, single [idolatry].</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/john-corbet.html">John Corbet</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Remains of</cite>, … John Corbet… (London: Parkhurst, 1684), Of Divine Worship, 2nd Part, section 18, p. 205</span></figcaption>

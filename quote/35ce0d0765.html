<main class="wrap"><figure class="quote" id="q-35ce0d0765" data-kw="">
<blockquote><p>Moreover, if you mean by this word expressed that which in scripture is clearly showed out, and appears evidently to every reader or hearer that has but a mean understanding, so do I affirm that there are some things which a man ought to believe, although they be not of him expressly understand [understood]: As I have ever believed that the virgin Mary was and is a perpetual virgin, and that the same might be gathered by the Scripture.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/john-lambert.html">John Lambert</a></span><span class="wk"><span class="lbl">Work:</span> <cite>in Foxe, John, Acts and Monuments of Matters Most Special and Memorable... (London, 1583), The 8th Book, ‘The Answer of John Lambert to the First Article’, p. 1,107. Lambert (d. 1538) was an English protestant martyr who was burned to death. He was a friend of William Tyndale and a member of the humanist theologians which met at White Horse Tavern.</cite></span></figcaption>
<div class="meta"><span class="t"><a href="../topics/rome/mary-and-the-saints.html">Rome: Mary and the Saints</a></span></div>

</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-2cfa4393d8" data-kw="Mary Queen of Heaven Satan Grace">
<blockquote><p>Hence we see how widely the Papists differ from her, who idly adorn her with their empty devices, and reckon almost as nothing the benefits which she received from God. They heap up an abundance of magnificent and very presumptuous titles, such as, &quot;Queen of Heaven, Star of Salvation, Gate of Life, Sweetness, Hope, and Salvation.&quot; Nay more, to such a pitch of insolence and fury have they been hurried by Satan, that they give her authority over Christ; for this is their pretty song, &quot;Beseech the Father, Order the Son.&quot; None of these modes of expression, it is evident, proceeded from the Lord. All are disclaimed by the holy virgin in a single word, when she makes her whole glory to consist in acts of the divine kindness. If it was her duty to praise the name of God alone, who had done to her wonderful things, no room is left for the pretended titles, which come from another quarter.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/john-calvin.html">John Calvin</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Commentary on a Harmony of the Evangelists</cite>, Luke 1:48-49</span></figcaption>

</figure><figure class="quote" id="q-6241a7b957" data-kw="Mary Saviour">
<blockquote><p>She knew herself to be a sinner who needed a Saviour, and that she could no otherwise rejoice in God than as interested in his salvation through the promised Messiah.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/matthew-henry.html">Matthew Henry</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Concise Commentary</cite>, Luke 1:39-56</span></figcaption>

</figure><figure class="quote" id="q-5d0cbfd433" data-kw="">
<blockquote><p>Whether she was a virgin before birth, during birth and after birth? It is affirmed. Whether she remained for the whole of life in that state of virginity? It is denied. It is permitted to be investigated.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/gisbertus-voetius.html">Gisbertus Voetius</a></span><span class="wk"><span class="lbl">Work:</span> <cite>A Syllabus of Theological Problems… (Utrecht, 1643), Part 1, 2nd Section, ‘Of Redemption’, Tract 2, ‘Of the Person, Offices &amp; States of Christ the Mediator’, I. ‘Of the Person of Christ the Mediator’, 1. ‘Of the Assumption &amp; Union of the Human Nature’, ‘Of Mary the Mother of Christ’, no page number. In Voet’s explanations of the Latin abbreviations, he explains “Disq” by saying that it can also mean ‘It is investigated’ as long as neither side is said to be determined. And it is probably able to be investigated and [publicly] disputed on either side.</cite></span></figcaption>
<div class="meta"><span class="t"><a href="../topics/rome/mary-and-the-saints.html">Rome: Mary and the Saints</a></span></div>

0be%20investigated&amp;text=Whether%20she%20was%20a%20virgin%20before%20birth%2C%20during&amp;text=is%20denied.%20It%20is%20permitted%20to%20be%20investigated" rel="noopener" target="_blank">Read it online · Reformed Books Online</a></div>
</figure><figure class="quote" id="q-8f7a236548" data-kw="">
<blockquote><p>This thing [that the Word of God is the object of faith] our [papist] adversaries can by no means abide; for they contend that there be certain things (I know not what) to be believed, which are not contained in the holy Scriptures. But we say that faith is an assent that is given to the holy Scripture and unto those things which are necessarily and evidently concluded of it. Among other things, they are wont to object unto us the perpetual virginity of the mother of Christ, which they say must be believed although it be not mentioned in the holy Scriptures…. 3. As touching the first, it is sufficient for us that we are taught by the holy Scriptures (Mt. 1 &amp; Lk. 1) that Christ was conceived and born of a virgin. And above that, to affirm that the blessed Virgin was joined with man in fellowship of the flesh, it were rash and presumptuous; for seeing there is nothing spoken thereof in the holy Scriptures, nor yet is the same likely; why (in God’s name) should we either believe it or affirm it? And contrariwise, that she abode perpetually a virgin; forsomuch as the holy Scriptures do not by express words avouch the same, it is not to be admitted among those things which must of necessity be believed such as are the things expressly contained in the holy Scriptures. Jerome against Helvidius wrote of this matter; for he was worthily to be condemned because he did rashly affirm that she was not perpetually a virgin. And Augustine very well admonishes us that when we come to such places where the sense of the Scripture cannot certainly be gathered, we should not rashly set our opinion on the one part or the other.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/peter-martyr-vermigli.html">Peter Martyr Vermigli</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Common Places… (d. 1562; 1583), Pt. 3, ch. 3, ‘Of Faith &amp; the Certainty Thereof’, section 7, p. 62. While Vermigli’s agnosticism on the question appears to be strong, nonetheless he uses language that appears to default to belief in perpetual virginity.</cite></span></figcaption>
<div class="meta"><span class="t"><a href="../topics/rome/mary-and-the-saints.html">Rome: Mary and the Saints</a></span></div>

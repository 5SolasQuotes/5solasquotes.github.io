<main class="wrap"><figure class="quote" id="q-f8649d5762" data-kw="">
<blockquote><p>Because all the reasons of this commandment are moral and perpetual; and God has bound us to the obedience of this commandment with more forcible reasons than to any of the rest — First, because he foresaw that irreligious men would either more carelessly neglect, or more boldly break this commandment than any other; secondly, because that in the practice of this commandment the keeping of all the other consists; which makes God so often complain that all his worship is neglected or overthrown, when the Sabbath is either neglected or transgressed (Jer. xv. 22; Ezek. xx. 19, 20, 21, 24; xxiii. 38; Neh. ix. 4.) “It would make a man amazed,” saith Mr. Calvin, “to consider how oft, and with what zeal and protestation God requireth all, that will be his people, to sanctify the seventh day; yea, how the God of mercy mercilessly punisheth the breach of this commandment with cruel death, as though it were the sum of his whole honour and service.”

And it is certain, that he who makes no conscience to break the Sabbath, will not, to serve his turn, make any conscience to break any of the other commandments, so he may do it without discredit of his reputation or danger of man’s law. Therefore God placed this commandment in the midst of the two tables, because the keeping of it is the best help to the keeping of all the rest. The conscionable keeping of the Sabbath is the mother of all religion and good discipline in the church. Take away the Sabbath, and let every man serve God when he listeth; and what will shortly become of religion, and that peace and order (1 Cor. xiv. 33, 40) which God will have to be kept in his church?

The Sabbath-day is God’s market-day, for the week’s provision; wherein He will have us to come to him, and buy of him without silver or money (Isa. lv. 1, 2), the bread of angels, and water of life, the wine of the sacrament, and milk of the word to feed our souls; tried gold to enrich our faith (Rev. iii. 18;) precious eye-salve, to heal our spiritual blindness; and the white raiment of Christ’s righteousness, to cover our filthy nakedness.

He is not far from true piety, who makes conscience to keep the Sabbath-day; but he who can dispense with his conscience to break the Sabbath for his own profit or pleasure, his heart never yet felt what either the fear of God or true religion means; for, of this commandment may that speech of St. James be verified, “He that faileth in one, is guilty of all.” (James ii. 10.) Seeing, therefore, that God has fenced this commandment with so many moral reasons, it is evident that the commandment itself is moral.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/lewis-bayly.html">Lewis Bayly</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Practice of Piety: Directing a Christian to walk, that he may please God</cite>, (1612; Grand Rapids MI: Soli Deo Gloria, 2019), pp 169-71.</span></figcaption>

<blockquote><p>Beloved! the salvation of souls is that which should be first and most in a minister’s eye, and that which should always lie closest and warmest upon a minister’s heart. O sirs! our dear Lord Jesus was infinitely tender of the souls of men.

He left his Father’s bosom for souls he trode the wine-press of his Father’s wrath for souls; he prayed for souls; he paid for souls; he sweated for souls; he bled out his heart’s blood for souls; and he made himself an offering for souls: and oh, what an encouragement should this be to all his faithful messengers to woo for souls, to mourn for souls, to pray for souls, to study for souls, and in preaching to spend and to be spent for the salvation of souls! Ah, friends, there is no work nor wisdom on earth to that of winning souls, Prov, xi. 30, and ‘he that winneth souls is wise.’</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/thomas-brooks.html">Thomas Brooks</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Crown and Glory of Christianity; or Holiness, the only way to Happiness. Discovered in LVIII Sermons from Heb. 12. 14</cite>, (1662) in The Works of Thomas Brooks, ed. Alexander B. Grossart (6 vols, Edinburgh: James Nichol, 1861-67), 4: 35.</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/worship.html">Worship</a></span></div>

<blockquote><p>There is a lot of psychological distress involved in even talking about it. I don’t care for the overuse of words like ‘trauma,’ but it really has felt traumatic, and we weren’t suffering the worst of it by any means. Our family has been shunned by the pastor because he didn’t believe we voted for him to be installed [as the pastor], although we did; you don’t realize how much damage it does to have your spiritual leader refuse to even speak to you, because it starts to seem normal. I was also reprimanded when one of the elders found out that I asked a question about the church’s unconventional sacramental practices to someone outside the church. There have been sustained, vicious attacks on family members by the session [of elders]. There is consistent abuse of Matthew 18 to stifle any publicly voiced criticisms of actions by the session. There is a lack of transparency: for example, the session refuses to release a comprehensive budget to the congregation, and makes major purchases without a congregational vote. Church discipline has no established procedure, and excommunication is done behind closed doors, without a public trial or public testimony by witnesses. Excommunications are also based on manufactured sins; the current excommunication, for example, is based on the charge of “living in darkness.” The pastor has literally pronounced eternal damnation over people who have criticized him in public. The session has even gone after people who left the church and are no longer members, going so far as to contact people’s ex-spouses to attempt to find incriminating information about them to convey to the non-member’s new pastor. They also routinely spread around information that was given in confidence for counseling purposes. Everyone we’ve told who is not in the church is appalled; in retrospect we wonder why it took so long for us to leave, but it really is painful. It was hard to leave for a number of reasons. First, we had a lot of specific doctrinal agreements with that church, that most other churches don’t share. Along with that came like-minded friends who we really did not want to give up. Things got incrementally worse over a long time, and quite often the leadership had semi-plausible explanations for their actions which were not easy to disprove. The worst of it was not targeted at us, and we thought we could just keep our heads down and avoid interacting with the session. We wished we could more vocally confront them, but the people being abused asked that we not get involved, so we didn’t feel that we could. Over time the cognitive dissonance grew worse, and it seemed to us the Holy Spirit had entirely withdrawn from the church. The church moving to a new building that was much farther away gave us a ready excuse to go elsewhere that couldn’t be argued with. Then the final decision was made for us when the pastor purported to damn our relative; that’s a bell that can’t really be unrung, and we couldn’t commune in good faith after that. We are members of the congregation. We are hoping the elders will just leave us alone, but they have harassed people who have left before, so we are trying to get under the shelter of another church quickly. We did a complete communication blackout. We blocked all of the communication outlets from all of the elders, so we won’t have to even see anything they might send which could tempt us to reply. Articles on spiritual abuse do capture very well the experience of being in the situation, the damage it does and the psychological consequences of getting out.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/cultish.html">Anonymous</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Testimony of a Lawyer, with family</cite>, Pennsylvania, USA</span></figcaption>

<blockquote><p>It is false also that all the Churches abroad have human ceremonies so twisted with their solemn worship that presbyterians cannot join with them. We have often (and do when occasion serves) very cordially and to our edification joined with them, and yet partake in none of these: nor is [there] so much of these [human ceremonies] among them as he would make us believe.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/gilbert-rule.html">Gilbert Rule</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Good Old Way Defended</cite>, … (Edinburgh: 1697), sect. 10 Rule was a Scottish, divine-right presbyterian., pp. 258-59</span></figcaption>

<blockquote><p>Arminians: ‘The Word of God is sufficient for the deciding of controversies, its clear; what need is there of decision, if men acquiesce to the decision of God as it lies in Scripture?— if the word of God express the sense of God, or if it have need of interpretation, why is there not a free interpretation left to every man? Do we think our words are clearer than the word of God; we do a mighty injury to the word of God, if we believe that. How much better were it, if we would nourish peace and concord leaving interpretations free to every man? It is most sure to contain ourselves within the speaking of holy scripture, and the form of words of the Holy Ghost, and that no man be troubled who shows himself willing to contain himself within these.’ [Rutherford’s] Answer: …for in principles of faith, that Christ is God and man, and died for sinners, the Scripture is most plain, and what need then [is there] of our interpretation [if the Arminians be correct]? Then let Arians and Socinians believe him to be God-man and to die for sinners in their sense, the Familists in a contrary sense, the Georgians [after David George, d. 1556] in another contrary sense, the Papists in a third, the Protestants a fourth, and so as many heads, as many faiths, every sect and man must have some sense, else his faith is nonsense; and if he err from the sense of the Holy Ghost, the scripture is no scripture, if it be believed in a sense contrary to the scripture… and so his faith is no faith, but a vain night-fancy; and seeing the word of God gives us but one faith [Eph. 4:5], and one truth, and one Gospel; if interpretations be left free to every man, these Libertines gives us millions of faiths with millions of senses, and so no faith at all. Secondly, they give us two decisions: one made by God, and another by the Church contrary to God’s: that has no rule but every man’s private judgment and free fancy… Fourthly, That ‘no confessions ought to be but in express words of Scripture’, shall free all men and consequently all Churches from obedience to that which Peter commands, 1 Pet. 3:15, ‘Be ready always to give an answer to every man that asketh you a reason of the hope that is in you, with meekness and fear.’ When Stephen, Acts 7, and Paul, Acts 26, were accused of heresy and speaking against Moses and the temple, they made a confession of their faith not in words of Scripture, but in deductions and necessary consequences drawn from Scripture and applied to themselves; and those in Nehemiah’s time who wrote and sealed or subscribed a Covenant, did not write and seal the express Decalogue and Ten Commandments… Neh. 10:29-34 ff., compared with Neh. 9:38, which words are not a confession nor Covenant in express Scripture… …should by some confession and Covenant ‘give an account of their faith and hope with meekness and fear.’ And what particular persons are obliged to do, that Churches, when they are slandered as unsound in the faith, are obliged to do: and so I look at a form or confession of faith as a necessary apology for clearing of the good name of a Church defamed with heresies, and new sects… …Now that it is not sufficient that they be put to subscribe a confession of faith in only scripture words is clear: 1. Because the Jews will swear and seal the Old Testament in their own sense, but their sense makes the Old Testament to be the word of man, not the Word of God. The Sadducees acknowledged the five books of Moses to be the Word of God, yet because they denied the resurrection of the dead, Christ argues them, Mt. 22:45, ignorant both of the power of God asserted in the books of Moses and of the scriptures… Yet would the Sadducees have sworn and subscribed all the book of Exodus as the undoubted Word of God… but when they denied the resurrection, sure these words ‘I am the God of Abraham’ etc… making the Covenant of Grace to die when Abraham died, and Abraham to have perished in soul and body as they expounded it, was not the Word of God; And Papists will subscribe the Old and New Testament and the three creeds, the Nicene Creed, the Creed of Athanasius, and that which commonly is called the Apostles’ Creed. Yet as they expound the Word and these Creeds, we say they transform the Word of God into the doctrine of devils [1 Tim. 4:1-4] and most abominable idolatry; The greatest heretics that were, Arius, Nestorius, Appollinaris, Macedonius [who denied the divinity of the Holy Spirit], the Treithite [a Tritheist] acknowledge the scripture to be the Word of God, and will swear and subscribe the word of God and contain themselves intra sacre scripture lecutiones, ‘within the words of scripture’. But their faith is not the faith of the scripture, and this makes ten thousand and millions of faiths, whereas the Word says there is but one faith [Eph. 4:5]. For Arius has one faith, Apollinaris another, Nestorius another, and every heretic a faith according to the sense that he falsely puts on the scripture, and all may swear one confession of faith in scripture words.</p></blockquote>

— Samuel Rutherford, A Free Disputation Against Pretended Liberty of Conscience, … (1649), ch. 2, pp. 28-32">Copy</button><a class="share" href="https://x.com/intent/post?text=%E2%80%9CArminians%3A+%E2%80%98The+Word+of+God+is+sufficient+for+the+deciding+of+controversies%2C+its+clear%3B+what+need+is+there+of+decision%2C+if+men+acquiesce+to+the+decision+of+God+as+it+lies+in+Scripture%3F%E2%80%94+if+the+word+of+God+express+the+sense+of+God%2C+or+if+it+have+need+of+interpretation%2C+why+is+there+not+a+free+interpretation+left+to+every+man%3F+Do+we+think+our+words+are+clearer+than+the+word+of+God%3B+we+do+a+mighty+injury+to+the+word+of+God%2C+if+we+believe+that.+How+much+better+were+it%2C+if+we+would+nourish+peace+and+concord+leaving+interpretations+free+to+every+man%3F+It+is+most+sure+to+contain+ourselves+within+the+speaking+of+holy+scripture%2C+and+the+form+of+words+of+the+Holy+Ghost%2C+and+that+no+man+be+troubled+who+shows+himself+willing+to+contain+himself+within+these.%E2%80%99+%5BRutherford%E2%80%99s%5D+Answer%3A+%E2%80%A6for+in+principles+of+faith%2C+that+Christ+is+God+and+man%2C+and+died+for+sinners%2C+the+Scripture+is+most+plain%2C+and+what+need+then+%5Bis+there%5D+of+our+interpretation+%5Bif+the+Arminians+be+correct%5D%3F+Then+let+Arians+and+Socinians+believe+him+to+be+God-man+and+to+die+for+sinners+in+their+sense%2C+the+Familists+in+a+contrary+sense%2C+the+Georgians+%5Bafter+David+George%2C+d.+1556%5D+in+another+contrary+sense%2C+the+Papists+in+a+third%2C+the+Protestants+a+fourth%2C+and+so+as+many+heads%2C+as+many+faiths%2C+every+sect+and+man+must+have+some+sense%2C+else+his+faith+is+nonsense%3B+and+if+he+err+from+the+sense+of+the+Holy+Ghost%2C+the+scripture+is+no+scripture%2C+if+it+be+believed+in+a+sense+contrary+to+the+scripture%E2%80%A6+and+so+his+faith+is+no+faith%2C+but+a+vain+night-fancy%3B+and+seeing+the+word+of+God+gives+us+but+one+faith+%5BEph.+4%3A5%5D%2C+and+one+truth%2C+and+one+Gospel%3B+if+interpretations+be+left+free+to+every+man%2C+these+Libertines+gives+us+millions+of+faiths+with+millions+of+senses%2C+and+so+no+faith+at+all.+Secondly%2C+they+give+us+two+decisions%3A+one+made+by+God%2C+and+another+by+the+Church+contrary+to+God%E2%80%99s%3A+that+has+no+rule+but+every+man%E2%80%99s+private+judgment+and+free+fancy%E2%80%A6+Fourthly%2C+That+%E2%80%98no+confessions+ought+to+be+but+in+express+words+of+Scripture%E2%80%99%2C+shall+free+all+men+and+consequently+all+Churches+from+obedience+to+that+which+Peter+commands%2C+1+Pet.+3%3A15%2C+%E2%80%98Be+ready+always+to+give+an+answer+to+every+man+that+asketh+you+a+reason+of+the+hope+that+is+in+you%2C+with+meekness+and+fear.%E2%80%99+When+Stephen%2C+Acts+7%2C+and+Paul%2C+Acts+26%2C+were+accused+of+heresy+and+speaking+against+Moses+and+the+temple%2C+they+made+a+confession+of+their+faith+not+in+words+of+Scripture%2C+but+in+deductions+and+necessary+consequences+drawn+from+Scripture+and+applied+to+themselves%3B+and+those+in+Nehemiah%E2%80%99s+time+who+wrote+and+sealed+or+subscribed+a+Covenant%2C+did+not+write+and+seal+the+express+Decalogue+and+Ten+Commandments%E2%80%A6+Neh.+10%3A29-34+ff.%2C+compared+with+Neh.+9%3A38%2C+which+words+are+not+a+confession+nor+Covenant+in+express+Scripture%E2%80%A6+%E2%80%A6should+by+some+confession+and+Covenant+%E2%80%98give+an+account+of+their+faith+and+hope+with+meekness+and+fear.%E2%80%99+And+what+particular+persons+are+obliged+to+do%2C+that+Churches%2C+when+they+are+slandered+as+unsound+in+the+faith%2C+are+obliged+to+do%3A+and+so+I+look+at+a+form+or+confession+of+faith+as+a+necessary+apology+for+clearing+of+the+good+name+of+a+Church+defamed+with+heresies%2C+and+new+sects%E2%80%A6+%E2%80%A6Now+that+it+is+not+sufficient+that+they+be+put+to+subscribe+a+confession+of+faith+in+only+scripture+words+is+clear%3A+1.+Because+the+Jews+will+swear+and+seal+the+Old+Testament+in+their+own+sense%2C+but+their+sense+makes+the+Old+Testament+to+be+the+word+of+man%2C+not+the+Word+of+God.+The+Sadducees+acknowledged+the+five+books+of+Moses+to+be+the+Word+of+God%2C+yet+because+they+denied+the+resurrection+of+the+dead%2C+Christ+argues+them%2C+Mt.+22%3A45%2C+ignorant+both+of+the+power+of+God+asserted+in+the+books+of+Moses+and+of+the+scriptures%E2%80%A6+Yet+would+the+Sadducees+have+sworn+and+subscribed+all+the+book+of+Exodus+as+the+undoubted+Word+of+God%E2%80%A6+but+when+they+denied+the+resurrection%2C+sure+these+words+%E2%80%98I+am+the+God+of+Abraham%E2%80%99+etc%E2%80%A6+making+the+Covenant+of+Grace+to+die+when+Abraham+died%2C+and+Abraham+to+have+perished+in+soul+and+body+as+they+expounded+it%2C+was+not+the+Word+of+God%3B+And+Papists+will+subscribe+the+Old+and+New+Testament+and+the+three+creeds%2C+the+Nicene+Creed%2C+the+Creed+of+Athanasius%2C+and+that+which+commonly+is+called+the+Apostles%E2%80%99+Creed.+Yet+as+they+expound+the+Word+and+these+Creeds%2C+we+say+they+transform+the+Word+of+God+into+the+doctrine+of+devils+%5B1+Tim.+4%3A1-4%5D+and+most+abominable+idolatry%3B+The+greatest+heretics+that+were%2C+Arius%2C+Nestorius%2C+Appollinaris%2C+Macedonius+%5Bwho+denied+the+divinity+of+the+Holy+Spirit%5D%2C+the+Treithite+%5Ba+Tritheist%5D+acknowledge+the+scripture+to+be+the+Word+of+God%2C+and+will+swear+and+subscribe+the+word+of+God+and+contain+themselves+intra+sacre+scripture+lecutiones%2C+%E2%80%98within+the+words+of+scripture%E2%80%99.+But+their+faith+is+not+the+faith+of+the+scripture%2C+and+this+makes+ten+thousand+and+millions+of+faiths%2C+whereas+the+Word+says+there+is+but+one+faith+%5BEph.+4%3A5%5D.+For+Arius+has+one+faith%2C+Apollinaris+another%2C+Nestorius+another%2C+and+every+heretic+a+faith+according+to+the+sense+that+he+falsely+puts+on+the+scripture%2C+and+all+may+swear+one+confession+of+faith+in+scripture+words.%E2%80%9D%0A%0A%E2%80%94+Samuel+Rutherford%2C+A+Free+Disputation+Against+Pretended+Liberty+of+Conscience%2C+%E2%80%A6+%281649%29%2C+ch.+2%2C+pp.+28-32&amp;url=https%3A%2F%2F5solasquotes.github.io%2Fquote%2Fc33eb3a156.html&amp;via=5Solas" target="_blank" rel="noopener">Share on X</a><a class="perma" href="../quote/c33eb3a156.html">Permalink</a><a class="src" href="https://reformedbooksonline.com/topics/subscription-to-creeds#:~:text=Arminians%3A%20%E2%80%98The%20Word%20of%20God%20is,confession%20of%20faith%20in%20scripture%20words&amp;text=Arminians%3A%20%E2%80%98The%20Word%20of%20God%20is%20sufficient%20for&amp;text=swear%20one%20confession%20of%20faith%20in%20scripture%20words" rel="noopener" target="_blank">Read it online · Reformed Books Online</a></div>

<blockquote><p>9. The object of this wrath was not Christ as such. It was connected only with that punishment which He underwent as our surety.</p></blockquote>

</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-c6bf230a07" data-kw="">
<blockquote><p>VII. When the Scripture then says that Christ died for all, that He gave Himself a ransom for all, that He died for all, that He is a propitiation for the sins of the whole world: this is necessarily understood, either of the greatness of the price, or of the sufficiency of his merit for all men, or of the effectual redemption of all Jews and Gentiles that embrace by faith the benefits of his death: For in these, says Ambrose, a certain kind of universality is conceived [see footnote]. And this is no more repugnant [as the adversaries claim it is] to the doctrine of the Gospel than if some [adversaries] should say that Christ by his death did indifferently redeem and reconcile to God faithful Christians, and faithless Turks, heathens, Epicures, hypocrites, etc. although they receive not the merit of Christ by faith: which [latter] opinion [of the adversaries] is both impious, and repugnant to God’s Word.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/david-pareus.html">David Pareus</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Other citations (work not named)</cite>, Article 2, ‘Of Christ’s Death &amp; Merit’ in Aphorisms of the Orthodox Doctrine of the Reformed Churches in Zachary Ursinus, The Sum of Christian Religion… (London: Young, 1645), pp. 694-98</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/priestly-office-satisfaction-and-atonement/extent-of-the-atonement.html">Extent of the Atonement</a></span></div>

&amp;text=is%20both%20impious%2C%20and%20repugnant%20to%20God%E2%80%99s%20Word" rel="noopener" target="_blank">Read it online · Reformed Books Online</a></div>
</figure><figure class="quote" id="q-799cf93f69" data-kw="">
<blockquote><p>If He had made intercession and sacrifice for reprobates too, then clearly, their sins having been paid for by the sacrifice of the Son of God, the justice of God would not allow Him to require a debt already paid by the Son, nor would the justice of God be able to punish them with eternal death for their sins inasmuch as satisfaction has been made by Him.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/caspar-olevianus.html">Caspar Olevianus</a></span><span class="wk"><span class="lbl">Work:</span> <cite>De substantia foederis gratuiti inter deum et electos</cite>, (Geneva, 1585), pp. 67-72 as translated in G. Michael Thomas, The Extent of the Atonement… (Paternoster/Wipf &amp; Stock, 1997), p. 114</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/priestly-office-satisfaction-and-atonement/extent-of-the-atonement.html">Extent of the Atonement</a></span></div>
<div class="actions"><button class="copy" data-copy="“If He had made intercession and sacrifice for reprobates too, then clearly, their sins having been paid for by the sacrifice of the Son of God, the justice of God would not allow Him to require a debt already paid by the Son, nor would the justice of God be able to punish them with eternal death for their sins inasmuch as satisfaction has been made by Him.”

— Caspar Olevianus, De Substantia Foederis Gratuiti inter Deum et Electos (Geneva, 1585), pp. 67-72 as translated in G. Michael Thomas, The Extent of the Atonement… (Paternoster/Wipf &amp; Stock, 1997), p. 114">Copy</button><a class="share" href="https://x.com/intent/post?text=%E2%80%9CIf+He+had+made+intercession+and+sacrifice+for+reprobates+too%2C+then+clearly%2C+their+sins+having+been+paid+for+by+the+sacrifice+of+the+Son+of+God%2C+the+justice+of+God+would+not+allow+Him+to+require+a+debt+already+paid+by+the+Son%2C+nor+would+the+justice+of+God+be+able+to+punish+them+with+eternal+death+for+their+sins+inasmuch+as+satisfaction+has+been+made+by+Him.%E2%80%9D%0A%0A%E2%80%94+Caspar+Olevianus%2C+De+Substantia+Foederis+Gratuiti+inter+Deum+et+Electos+%28Geneva%2C+1585%29%2C+pp.+67-72+as+translated+in+G.+Michael+Thomas%2C+The+Extent+of+the+Atonement%E2%80%A6+%28Paternoster%2FWipf+%26+Stock%2C+1997%29%2C+p.+114&amp;url=https%3A%2F%2F5solasquotes.github.io%2Fquote%2F799cf93f69.html&amp;via=5Solas" target="_blank" rel="noopener">Share on X</a><a class="perma" href="../quote/799cf93f69.html">Permalink</a><a class="src" href="https://reformedbooksonline.com/limited-atonement/#:~:text=If%20He%20had%20made%20intercession%20and,satisfaction%20has%20been%20made%20by%20Him&amp;text=If%20He%20had%20made%20intercession%20and%20sacrifice%20for&amp;text=inasmuch%20as%20satisfaction%20has%20been%20made%20by%20Him" rel="noopener" target="_blank">Read it online · Reformed Books Online</a></div>
</figure><figure class="quote" id="q-57b9d0e0cb" data-kw="">
<blockquote><p>Mr. Reynolds–The Synod [of Dort] intended no more than to declare the sufficiency of the death of Christ; it is pretium in se [valuable in itself], of sufficient value to all, nay, ten thousand worlds. There are two Adams, one a fountain of misery, and the other of mercy… To be salvable is a benefit, and therefore belongs only to them that have interest in Christ.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/edward-reynolds.html">Edward Reynolds</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Other citations (work not named)</cite>, eds. Alexander Mitchell &amp; John Struthers, Minutes of the Sessions of the Westminster Assembly of Divines (London: Blackwood &amp; Sons, 1874), pp. 153-54</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/priestly-office-satisfaction-and-atonement/extent-of-the-atonement.html">Extent of the Atonement</a></span></div>
<div class="actions"><button class="copy" data-copy="“Mr. Reynolds–The Synod [of Dort] intended no more than to declare the sufficiency of the death of Christ; it is pretium in se [valuable in itself], of sufficient value to all, nay, ten thousand worlds. There are two Adams, one a fountain of misery, and the other of mercy… To be salvable is a benefit, and therefore belongs only to them that have interest in Christ.”

— Edward Reynolds, eds. Alexander Mitchell &amp; John Struthers, Minutes of the Sessions of the Westminster Assembly of Divines (London: Blackwood &amp; Sons, 1874), pp. 153-54">Copy</button><a class="share" href="https://x.com/intent/post?text=%E2%80%9CMr.+Reynolds%E2%80%93The+Synod+%5Bof+Dort%5D+intended+no+more+than+to+declare+the+sufficiency+of+the+death+of+Christ%3B+it+is+pretium+in+se+%5Bvaluable+in+itself%5D%2C+of+sufficient+value+to+all%2C+nay%2C+ten+thousand+worlds.+There+are+two+Adams%2C+one+a+fountain+of+misery%2C+and+the+other+of+mercy%E2%80%A6+To+be+salvable+is+a+benefit%2C+and+therefore+belongs+only+to+them+that+have+interest+in+Christ.%E2%80%9D%0A%0A%E2%80%94+Edward+Reynolds%2C+eds.+Alexander+Mitchell+%26+John+Struthers%2C+Minutes+of+the+Sessions+of+the+Westminster+Assembly+of+Divines+%28London%3A+Blackwood+%26+Sons%2C+1874%29%2C+pp.+153-54&amp;url=https%3A%2F%2F5solasquotes.github.io%2Fquote%2F57b9d0e0cb.html&amp;via=5Solas" target="_blank" rel="noopener">Share on X</a><a class="perma" href="../quote/57b9d0e0cb.html">Permalink</a><a class="src" href="https://reformedbooksonline.com/limited-atonement/#:~:text=Mr.%20Reynolds%E2%80%93The%20Synod%20%5Bof%20Dort%5D%20intended,them%20that%20have%20interest%20in%20Christ&amp;text=Mr.%20Reynolds%E2%80%93The%20Synod%20%5Bof%20Dort%5D%20intended%20no%20more&amp;text=only%20to%20them%20that%20have%20interest%20in%20Christ" rel="noopener" target="_blank">Read it online · Reformed Books Online</a></div>
</figure><figure class="quote" id="q-656fe32bd6" data-kw="">
<blockquote><p>Concerning the story and benefit of our Lord’s resurrection… directing our course as it were by the loadstar of scripture we pronounce by virtue and authority thereof that so precious and inestimable a benefit belongs unto all the faithful, and to them alone; and we exclude the wicked and unbelievers, as long as they remain such, from having any interest therein… The answer hereunto is twofold, either of which is true and sound. First, as often as the Gospel extends the fruit of Christ’s merits and benefits unto all, it must be understood (as says Saint Ambrose) of the whole number of the faithful and elect. For this is the usual and common voice found everywhere throughout the whole course of the gospel… Howbeit there is another answer no less true, wherewith we may satisfy the most contentious wranglers; that Christ died for all men absolutely and without exception to wit, if you respect the sufficiency of the merit, and the price which He paid. It is out of all doubt and controversy that the death of the Son of God is of such weight and worth that it may serve to purge and cleanse the sins not of one world only, but thousands of worlds; if at least all men would apprehend by faith this salve of sin. But the question concerns the efficacy and participation itself of the fruits which we mainly deny to be common to the believing, and unbelieving, or to be generally promised or given in the〈…〉; and we hold it no sound doctrine to 〈…〉 in this respect Christ died alike for all ???? and reprobate… For what slander is there, if this be none. When we distinguish the worth of the merue from the efficacy and participating of the benefits, and restrain according to Scripture and the judgement of the soundest Fathers this participation to the whole number of the faithful alone gathered from amongst the Jews and Gentiles; do we then deny that Christ died for all?… They [opponents] run on still, and say He died for all and every of these not only in respect of the sufficiency of his sacrifice and satisfaction, but also in regard of the efficacy of the same. What means this new device I pray? That forsooth Christ by his death and bloodshedding has truly and effectually delivered from death, purged from sin, sanctified, reconciled unto God, and restored unto his grace and favor by his death and bloodshedding all and every single man, yea even those who are not saved, but have been ever since Caine, etc. are at this day, and shall be hereafter damned… they neither perished, nay perish, nor shall perish, for their sins (whereas they are washed away by the blood of Christ Jesus) but for unbelief alone.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/zacharias-ursinus.html">Zacharias Ursinus</a></span><span class="wk"><span class="lbl">Work:</span> <cite>A Preface of an Oration</cite>, … by a certain student of divinity in the famous University of Heidelberg…: To whom the benefit of the Death &amp; Resurrection of Christ appertains: and how Christ died for all men [by way of sufficiency] in A Collection of Certain Learned Discourses… (Oxford, 1600), pp. 132 &amp; 134, 142</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/priestly-office-satisfaction-and-atonement/extent-of-the-atonement.html">Extent of the Atonement</a></span></div>

— Zachary Ursinus, A Preface of an Oration… by a certain student of divinity in the famous University of Heidelberg…: To whom the benefit of the Death &amp; Resurrection of Christ appertains: and how Christ died for all men [by way of sufficiency] in A Collection of Certain Learned Discourses… (Oxford, 1600), pp. 132 &amp; 134, 142">Copy</button><a class="share" href="https://x.com/intent/post?text=%E2%80%9CConcerning+the+story+and+benefit+of+our+Lord%E2%80%99s+resurrection%E2%80%A6+directing+our+course+as+it+were+by+the+loadstar+of+scripture+we+pronounce+by+virtue+and+authority+thereof+that+so+precious+and+inestimable+a+benefit+belongs+unto+all+the+faithful%2C+and+to+them+alone%3B+and+we+exclude+the+wicked+and+unbelievers%2C+as+long+as+they+remain+such%2C+from+having+any+interest+therein%E2%80%A6+The+answer+hereunto+is+twofold%2C+either+of+which+is+true+and+sound.+First%2C+as+often+as+the+Gospel+extends+the+fruit+of+Christ%E2%80%99s+merits+and+benefits+unto+all%2C+it+must+be+understood+%28as+says+Saint+Ambrose%29+of+the+whole+number+of+the+faithful+and+elect.+For+this+is+the+usual+and+common+voice+found+everywhere+throughout+the+whole+course+of+the+gospel%E2%80%A6+Howbeit+there+is+another+answer+no+less+true%2C+wherewith+we+may+satisfy+the+most+contentious+wranglers%3B+that+Christ+died+for+all+men+absolutely+and+without+exception+to+wit%2C+if+you+respect+the+sufficiency+of+the+merit%2C+and+the+price+which+He+paid.+It+is+out+of+all+doubt+and+controversy+that+the+death+of+the+Son+of+God+is+of+such+weight+and+worth+that+it+may+serve+to+purge+and+cleanse+the+sins+not+of+one+world+only%2C+but+thousands+of+worlds%3B+if+at+least+all+men+would+apprehend+by+faith+this+salve+of+sin.+But+the+question+concerns+the+efficacy+and+participation+itself+of+the+fruits+which+we+mainly+deny+to+be+common+to+the+believing%2C+and+unbelieving%2C+or+to+be+generally+promised+or+given+in+the%E3%80%88%E2%80%A6%E3%80%89%3B+and+we+hold+it+no+sound+doctrine+to+%E3%80%88%E2%80%A6%E3%80%89+in+this+respect+Christ+died+alike+for+all+%3F%3F%3F%3F+and+reprobate%E2%80%A6+For+what+slander+is+there%2C+if+this+be+none.+When+we+distinguish+the+worth+of+the+merue+from+the+efficacy+and+participating+of+the+benefits%2C+and+restrain+according+to+Scripture+and+the+judgement+of+the+soundest+Fathers+this+participation+to+the+whole+number+of+the+faithful+alone+gathered+from+amongst+the+Jews+and+Gentiles%3B+do+we+then+deny+that+Christ+died+for+all%3F%E2%80%A6+They+%5Bopponents%5D+run+on+still%2C+and+say+He+died+for+all+and+every+of+these+not+only+in+respect+of+the+sufficiency+of+his+sacrifice+and+satisfaction%2C+but+also+in+regard+of+the+efficacy+of+the+same.+What+means+this+new+device+I+pray%3F+That+forsooth+Christ+by+his+death+and+bloodshedding+has+truly+and+effectually+delivered+from+death%2C+purged+from+sin%2C+sanctified%2C+reconciled+unto+God%2C+and+restored+unto+his+grace+and+favor+by+his+death+and+bloodshedding+all+and+every+single+man%2C+yea+even+those+who+are+not+saved%2C+but+have+been+ever+since+Caine%2C+etc.+are+at+this+day%2C+and+shall+be+hereafter+damned%E2%80%A6+they+neither+perished%2C+nay+perish%2C+nor+shall+perish%2C+for+their+sins+%28whereas+they+are+washed+away+by+the+blood+of+Christ+Jesus%29+but+for+unbelief+alone.%E2%80%9D%0A%0A%E2%80%94+Zachary+Ursinus%2C+A+Preface+of+an+Oration%E2%80%A6+by+a+certain+student+of+divinity+in+the+famous+University+of+Heidelberg%E2%80%A6%3A+To+whom+the+benefit+of+the+Death+%26+Resurrection+of+Christ+appertains%3A+and+how+Christ+died+for+all+men+%5Bby+way+of+sufficiency%5D+in+A+Collection+of+Certain+Learned+Discourses%E2%80%A6+%28Oxford%2C+1600%29%2C+pp.+132+%26+134%2C+142&amp;url=https%3A%2F%2F5solasquotes.github.io%2Fquote%2F656fe32bd6.html&amp;via=5Solas" target="_blank" rel="noopener">Share on X</a><a class="perma" href="../quote/656fe32bd6.html">Permalink</a><a class="src" href="https://reformedbooksonline.com/topics/atonement#:~:text=Concerning%20the%20story%20and%20benefit%20of,Christ%20Jesus%29%20but%20for%20unbelief%20alone&amp;text=Concerning%20the%20story%20and%20benefit%20of%20our%20Lord%E2%80%99s&amp;text=blood%20of%20Christ%20Jesus%29%20but%20for%20unbelief%20alone" rel="noopener" target="_blank">Read it online · Reformed Books Online</a></div>

<main class="wrap"><figure class="quote" id="q-4e717cf62d" data-kw="">
<blockquote><p>Others may claim a liberty to dispute whether civil coercion and restraint of gross heretics, idolaters and blasphemers, be an exercise of civil authority sanctioned by Scripture:- but to those who have received the Standards of the church as scriptural, and are resolved to maintain them, there is no room left for discussion on this article. These Standards do most plainly and unequivocally teach the doctrine of magistratical coercion, and the proofs which they exhibit from sacred Scripture show that they regard this principle as authorised by the real word of truth.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/thomas-houston.html">Thomas Houston</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Covenanter’s narrative and plea: exhibiting the error, schism, radicalism, and slander of Dr. Paul, and other separatists from the Reformed Presbyterian Church</cite>, (Belfast, 1841), p. 19.</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/holy-scripture.html">Holy Scripture</a></span></div>

</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-df8d087d30" data-kw="">
<blockquote><p>That which can make the man of God perfect, and thoroughly furnish him to all good works, that is, make him perfect in all the duties of their callings: that same word is sufficient to salvation. But Scripture serves for all these uses: and therefore it is sufficient: and unwritten traditions are superfluous.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/william-perkins.html">William Perkins</a></span><span class="wk"><span class="lbl">Work:</span> <cite>A Reformed Catholic, The Eleventh Point</cite>, Of Traditions</span></figcaption>

</figure><figure class="quote" id="q-f63f745505" data-kw="">
<blockquote><p>Misapprehension, also, it must evidently be, that has given rise to any serious difficulty in reference to translations of Scripture. The difficulty is sometimes put in this way: “What is the use of insisting on any special doctrine of inspiration, when you know it cannot apply to our English version? The original Hebrew and Greek may have been inspired, but you do not surely claim inspiration for a mere translation?”

It would thus appear that inspiration is conceived of as some spiritual dye or colour or flavour which is washed out or evaporates in the course of translation, and that however good and satisfactory the translation may be. For it is not any hypothetical insufficiency, erroneousness, or general badness of the translation to which this melancholy result is supposed to be assignable, but to translation generally.

But this is just a misapprehension, or a refusal to accept in its plain and simple meaning the great truth that the Scriptures are the Word of God,—God’s Word committed to writing by Himself. For just try the idea in relation to any other book and its authorship. Here, we shall say, is Newton’s Principia. It was originally written in Latin, This, let us say, is an English version. Is it not Newton’s Principia? Is the authorship of it gone in the process of translation? That is the point. Is the written Word of God no longer God’s written Word, because it has been translated into English?

Holy men of old, as they were moved and guarded by the inspiration of the Holy Ghost, wrote each of them respectively, what God decreed they should write as their contributions to a volume which He intended to be His own,—His own written Word and published works,—His wondrous gift to the sons of men. The good Spirit of God is too abounding in His goodness to have written on His volume, churlishly, the formula, “Rights of translation reserved.” And the same all-wise Spirit of God is too abundant in wisdom and too sparing of miracle to have undertaken its translation into all languages (or any) Himself.

But a great part of His Scripture being non-miraculously translated ere the volume was completed, the Spirit of the Lord, infinitely far from the character alike of churl and of pedant, and not despising the translation because not divinely perfect, — stamping with His approbation for ever the principle that the translated Word of God is still the Word of God when translated, and takes rank with vet untranslated Scripture,—scrupled not freely to quote, and to wield as still possessing divine character and authority, what the Seventy of Alexandria had written in Greek translation of the Hebrew Scriptures. And if He,—being, in His graciousness, not ill to please, but pleased with reverential honest effort,— counts translated Scripture God’s Scripture still, we, surely, may be content</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/hugh-martin.html">Hugh Martin</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Westminster Doctrine of the Inspiration of Scripture (With a Prefatory Note on the Free Church College Committee’s Report, and with Remarks on Dr Marcus Dods’s Recent Sermon)</cite>, (1877; 4th edn, London: J. Nisbet, 1890), pp 6-7.</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/holy-scripture.html">Holy Scripture</a></span></div>

n-of-the-word-of-god-is-the-word-of-god/" rel="noopener" target="_blank">Read it online · Reformed Covenanter</a></div>
</figure><figure class="quote" id="q-64ef925976" data-kw="infallibility of the church">
<blockquote><p>Man cannot be the infallible interpreter of the Scriptures and judge of controversies because he is liable to error. Our faith cannot be placed in him, but upon God alone from whom depends the sense and meaning of the Scriptures and who is the best interpreter of his own words. … If the rulers of the church are influenced by the Holy Spirit, they do not cease to be men and therefore fallible.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/francis-turretin.html">Francis Turretin</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Institutes of Elenctic Theology</cite>, vol. 1, Second Topic, Q. 20, §XI</span></figcaption>

</figure><figure class="quote" id="q-440ee1eb8f" data-kw="">
<blockquote><p>It is written. I where? Ans. Nowhere in express words, but it is gathered out of the 16 Chap. and 21 Chap. of Genesis: as if he had said, by conference of Scripture, it may be gathered. Whence ariseth this observation: That the sense and collection of the Scripture, is rightly called Scripture; although the sense is not in express &amp; entire terms, anywhere: and this is oft used in the Epistle to the Hebrews: This is to be noted against Arius Sabellius and such Heretics, who when they did impugn the Divinity of CHRIST, and the distinction of Persons in the unity of Essence in the blessed Trinity, they did condemn the names and words of Essence, Consubstantial, Subsistence, Unity, Trinity, which were used of the ancient Fathers; to open these mysteries, they I say, accused them of Novelty and falsehood; because not found expressly in the Scripture. But by this place of Paul we learn that there is no need that every word and syllable be found in the Scripture, so that if the reason thereof be manifest out of the true sense of the Scripture, it is all one; as if it had been written:

Secondly, hence we learn, what we are to judge of the Sermons of Ministers. It must needs be, that in Preaching, while they open the Doctrine and exhort, that they utter many words and sentences, which in every syllable are not found in Scripture; yet while they speak out of the true sense of Scripture, all their words are the words of God: Neither is there hereby any way made for the Papists, to establish their smoky and reasty traditions, who when they hear those terms of Consubstantial, Coessential, &amp;c. Think that they may by the like right, obtrude upon us their foolish Superstitions as authorized by Scripture; for herein as in all other things, they err fondly; for though is be lawful to devise new words, the ground and meaning whereof is manifest out of the Scripture, yet to coin names repugnant to Piety, or such as through their ambiguity may bring the same in danger, is wicked and not to be attempted.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/thomas-brightman.html">Thomas Brightman</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Brightman redivivus: or The post-humian of-spring of Mr. Thomas Brightman, in IIII. sermons. Viz. 1. Of the two covenants. 2. The danger of scandals. 3. God’s commission to Christ to preach the Gospel. 4. The saint’s security</cite>, (London: John Rothwell, 1647), pp 3-4.</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/holy-scripture.html">Holy Scripture</a></span></div>
<div class="actions"><button class="copy" data-copy="“It is written. I where? Ans. Nowhere in express words, but it is gathered out of the 16 Chap. and 21 Chap. of Genesis: as if he had said, by conference of Scripture, it may be gathered. Whence ariseth this observation: That the sense and collection of the Scripture, is rightly called Scripture; although the sense is not in express &amp; entire terms, anywhere: and this is oft used in the Epistle to the Hebrews: This is to be noted against Arius Sabellius and such Heretics, who when they did impugn the Divinity of CHRIST, and the distinction of Persons in the unity of Essence in the blessed Trinity, they did condemn the names and words of Essence, Consubstantial, Subsistence, Unity, Trinity, which were used of the ancient Fathers; to open these mysteries, they I say, accused them of Novelty and falsehood; because not found expressly in the Scripture. But by this place of Paul we learn that there is no need that every word and syllable be found in the Scripture, so that if the reason thereof be manifest out of the true sense of the Scripture, it is all one; as if it had been written:

Secondly, hence we learn, what we are to judge of the Sermons of Ministers. It must needs be, that in Preaching, while they open the Doctrine and exhort, that they utter many words and sentences, which in every syllable are not found in Scripture; yet while they speak out of the true sense of Scripture, all their words are the words of God: Neither is there hereby any way made for the Papists, to establish their smoky and reasty traditions, who when they hear those terms of Consubstantial, Coessential, &amp;c. Think that they may by the like right, obtrude upon us their foolish Superstitions as authorized by Scripture; for herein as in all other things, they err fondly; for though is be lawful to devise new words, the ground and meaning whereof is manifest out of the Scripture, yet to coin names repugnant to Piety, or such as through their ambiguity may bring the same in danger, is wicked and not to be attempted.”

— Thomas Brightman, Brightman redivivus: or The post-humian of-spring of Mr. Thomas Brightman, in IIII. sermons. Viz. 1. Of the two covenants. 2. The danger of scandals. 3. God’s commission to Christ to preach the Gospel. 4. The saint’s security, (London: John Rothwell, 1647), pp 3-4.">Copy</button><a class="share" href="https://x.com/intent/post?text=%E2%80%9CIt+is+written.+I+where%3F+Ans.+Nowhere+in+express+words%2C+but+it+is+gathered+out+of+the+16+Chap.+and+21+Chap.+of+Genesis%3A+as+if+he+had+said%2C+by+conference+of+Scripture%2C+it+may+be+gathered.+Whence+ariseth+this+observation%3A+That+the+sense+and+collection+of+the+Scripture%2C+is+rightly+called+Scripture%3B+although+the+sense+is+not+in+express+%26+entire+terms%2C+anywhere%3A+and+this+is+oft+used+in+the+Epistle+to+the+Hebrews%3A+This+is+to+be+noted+against+Arius+Sabellius+and+such+Heretics%2C+who+when+they+did+impugn+the+Divinity+of+CHRIST%2C+and+the+distinction+of+Persons+in+the+unity+of+Essence+in+the+blessed+Trinity%2C+they+did+condemn+the+names+and+words+of+Essence%2C+Consubstantial%2C+Subsistence%2C+Unity%2C+Trinity%2C+which+were+used+of+the+ancient+Fathers%3B+to+open+these+mysteries%2C+they+I+say%2C+accused+them+of+Novelty+and+falsehood%3B+because+not+found+expressly+in+the+Scripture.+But+by+this+place+of+Paul+we+learn+that+there+is+no+need+that+every+word+and+syllable+be+found+in+the+Scripture%2C+so+that+if+the+reason+thereof+be+manifest+out+of+the+true+sense+of+the+Scripture%2C+it+is+all+one%3B+as+if+it+had+been+written%3A%0A%0ASecondly%2C+hence+we+learn%2C+what+we+are+to+judge+of+the+Sermons+of+Ministers.+It+must+needs+be%2C+that+in+Preaching%2C+while+they+open+the+Doctrine+and+exhort%2C+that+they+utter+many+words+and+sentences%2C+which+in+every+syllable+are+not+found+in+Scripture%3B+yet+while+they+speak+out+of+the+true+sense+of+Scripture%2C+all+their+words+are+the+words+of+God%3A+Neither+is+there+hereby+any+way+made+for+the+Papists%2C+to+establish+their+smoky+and+reasty+traditions%2C+who+when+they+hear+those+terms+of+Consubstantial%2C+Coessential%2C+%26c.+Think+that+they+may+by+the+like+right%2C+obtrude+upon+us+their+foolish+Superstitions+as+authorized+by+Scripture%3B+for+herein+as+in+all+other+things%2C+they+err+fondly%3B+for+though+is+be+lawful+to+devise+new+words%2C+the+ground+and+meaning+whereof+is+manifest+out+of+the+Scripture%2C+yet+to+coin+names+repugnant+to+Piety%2C+or+such+as+through+their+ambiguity+may+bring+the+same+in+danger%2C+is+wicked+and+not+to+be+attempted.%E2%80%9D%0A%0A%E2%80%94+Thomas+Brightman%2C+Brightman+redivivus%3A+or+The+post-humian+of-spring+of+Mr.+Thomas+Brightman%2C+in+IIII.+sermons.+Viz.+1.+Of+the+two+covenants.+2.+The+danger+of+scandals.+3.+God%E2%80%99s+commission+to+Christ+to+preach+the+Gospel.+4.+The+saint%E2%80%99s+security%2C+%28London%3A+John+Rothwell%2C+1647%29%2C+pp+3-4.&amp;url=https%3A%2F%2F5solasquotes.github.io%2Fquote%2F440ee1eb8f.html&amp;via=5Solas" target="_blank" rel="noopener">Share on X</a><a class="perma" href="../quote/440ee1eb8f.html">Permalink</a><a class="src" href="https://reformedcovenanter.wordpress.com/2022/11/04/thomas-brightman-the-sense-of-scripture-is-of-equal-authority-with-explicit-statements/" rel="noopener" target="_blank">Read it online · Reformed Covenanter</a></div>

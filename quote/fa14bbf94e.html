<main class="wrap"><figure class="quote" id="q-fa14bbf94e" data-kw="">
<blockquote><p>Redemption is that whereby God gave his Son; and Jesus Christ God-man gave Himself, and accordingly in due time became a ransom for the elect: whence it comes to pass that justice is no hinderance to the application of mercy, Jn. 3:16; Gal. 2:20; Rom. 3:26. … Though God by his absolute power might have saved man without redemption wrought by Christ, yet having constituted that rule of relative justice, ‘In the day that thou eatest thereof, thou shalt surely die,’ Gen. 2:17. He could not in respect of his power now limited to proceed by this rule, so that man having sinned, man must die and satisfy the Law that man may live. Justice requires the surety should die, that the debtor may live: That He might be just and the justifier of Him which believes in Jesus, Rom. 3:26. Justice is, God willing, to render unto the reasonable creature what is due thereunto according to his Word: whether by way of grace or punishment, Dt. 32:4; Dan. 9:16; 1 Jn. 1:9; Ps. 62:11-12. Justice in God is either essential, of the absolute nature of God; whence it is that God can do no wrong. To be in God essentially is to be in God by necessity of nature: that is, it is of the necessary Being of God, so as: if God is, that is; and if that were not, God were not. Or Relative: viz. the justice of God in respect of the creature: that is in God necessarily; this is in Him freely and is nothing else but God’s constant will to give unto the creature what is its due. The will of God is the rule of justice. That which God’s Law is unto man, that is God’s will unto Himself. Justice, consisting in rendering to every one their due; and God’s will being the rule of justice, it follows that and only that to be due unto man which God has willed concerning Him. The Moral Law itself, the Rule of Manners, the recompence contained in the promise in case of obedience, the punishment contained in the curse in case of disobedience: are all the effects of God’s free pleasure. It being a truth that God’s will is the rule of justice between Him and the creature: and consequently, that the desert and punishment of sin determined by Him is therefore just, because He has so determined. It follows that in case God had appointed a greater punishment, it had been just the damned should have suffered more: And in case He had appointed a lesser punishment, it had been just they should have suffered less. Though the rule of relative justice be a free constitution, yet God having constituted this rule, has freely obliged Himself to the observation thereof; and can now no more fail to execute justice according to this rule than He can be unjust.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/john-norton.html">John Norton</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Orthodox Evangelist… (London: Macock, 1654), ch. 1, ‘Of the Divine Essence’</cite>, pp. 14-15</span></figcaption>

</figure><figure class="quote" id="q-3dea9d2390" data-kw="">
<blockquote><p>Whether there were any flat necessity of man’s suffering after the Fall is doubted by many and denied by Socinus. Whether this necessity arises from God’s natural justice, or his ordinate, viz. his decree, and the verity of the threatening, is also with many of our own divines a great dispute: Whether God might have pardoned sin if He had not said, ‘The sinner shall die,’ may be doubted of (though I believe the affirmative, yet I judge it a frivolous presumptuous question. But the word of his threatening being once past, methinks it should be past question that He cannot absolutely pardon without the apparent violation of his truth, or wisdom. Some think that it proceeds from his wisdom rather than his justice, that man must suffer: see Mr. John Goodwin, Of Justification, pt. 2, p. 34), but why should we separate what God has conjoined? However, whether wisdom, or justice, or truth (or rather all these) were the ground of it, yet certain it is that a necessity there was that the penalty should be inflicted: or else the Son of God should not have made satisfaction, nor sinners bear so much themselves.</p></blockquote>

h%20themselves" rel="noopener" target="_blank">Read it online · Reformed Books Online</a></div>

<blockquote><p>In the past, God had left sins unpunished. He could conceivably be accused of overlooking sin since He had not required punishment for it. Now, however, He has put forth Jesus. This proves that God is just (His wrath required the sacrifice) and that He is the justifier of those who have faith in Jesus (His love provided the sacrifice for them).</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/millard-erickson.html">Millard Erickson</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Christian Theology</cite>, p. 828</span></figcaption>

<blockquote><p>LIII. But though nothing from without be the cause of God’s volition, yet, since He wills that there should be order in things (which order is placed principally in this, that [iliae] some things be the causes of others) just so far as God’s volition is borne towards those objects, it is as if it were the cause of itself as it is borne towards others: (Hos. 2:21-22) Thus the cause why He wills the condemnation of anyone, is this, because He wills the order of his justice to be observed throughout the universe. (Jn 6:40; Dt. 7:8)… … LVI. 1. The Divine Will is borne towards its object, either according to the mode of Nature, or according to the mode of Liberty. According to the mode of Nature, it tends towards a primary and proper object, one that is suitable and adequate to its nature. According to the mode of Liberty, it tends towards all other things. Thus, God by a natural necessity wills Himself; but He wills freely all other things; (2 Tim. 2:13; Rev. 4:11) though the act which is posterior in order may be bound by a free act which is prior in order. This may be called “hypothetical necessity,” having its origin partly from the free volition and act of God, partly from the immutability of his nature. “For God is not unrighteous,” says the apostle,” to forget the work and labor of love” of the pious; because He has promised them a remuneration, and the immutability of his nature does not suffer Him to rescind his promises. (Heb. 6:10, 18) … LVIII… when the creature [excedit ordinem] transgresses the order of this revealed Will, the creature by it may be reduced to order, and that the Will of God may be done [de] on those by whom his Will has not been performed. (2 Sam. 17:14; Isa. 5:4-5; Mt. 21:39-41; Acts 5:4; 1 Cor. 7:28)… … LXIII. 8. Lastly. God wills some things per se or [per accidens] accidentally. He wills per se, those things which are simply and relatively good; (2 Pet. 3:9; accidentally, those which are in some respect evil, but which have such good tbings united with them as He wills in preference to be respective good things which are opposed to those evil ones: thus, He wills the evils of punisbnient, because He would rather have the order of justice preserved in punishment, than suffer an offending creature to go unpunished. (Jer. 9:9; Ps. 50:21; Jer. 15:6) … LXVII. Love is an affection of union in God, the objects of which are God Himself and the good of justice or righteousness, the creature and its felicity. (Prov. 16:4; Ps. 11:7; Jn. 3:16; Wisdom 11:24-26) Hatred is an affection of separation in God, the object of which are the unrighteusness and misery of the creature. (Ps. 5:5; Eze. 25:11; Dt. 25:15-16, etc.; Isa. 1:24) But since God primarily loves Himself and the good of justice, and at the same moment hates iniquity; and since He loves the creature and its happiness only secondarily, and at the same moment [odio habet] dislikes the misery of the creature; (Ps. 11:5; Dt. 28:63) hence it comes to pass, that He hates a creature that pertinaciously perseveres in unrighteousness, and He loves its misery. (Isa. 66:4) LXVIII. Goodness in God is an affection of communicating his own good. (Rev. 4:11; Gen. 1:31) Its first object [ad extra] outwards is nothing; and thus necessarily the first, that, [illo sublato] on its removal, there can be no [ad extra] outward communication. The first [progressus] advance of this goodness is towards the creature as it is a creature; the second is towards the creature as it performs its duty, to communicate good to it beyond the remuneration promised. Both these procedures of the Divine goodness may appropriately receive the appellation of “Benignity.” The third advance is towards a creature that has sinned, and that has by such transgression rendered itself liable to misery. This advance is called Mercy, that is, an affection for affording succor to a person in misery, sin itself presenting no obstacle to its exercise. (Rom. 5:8; Eze. 16:6). … LXXV. Righteousness or Justice in God, is an eternal and constant will to render to every one his own: (Ps. 11:7) To God Himself that which is his, and to the creature what belongs to it. We consider this righteousness in its Words and in its Acts. In all its Words are found veracity and constancy; and in its Promises, fidelity. (2 Tim. 2:13; Num. 23:19; Rom. 3:4; 1 Thess. 5:24) With regard to its Acts, it is twofold, Disposing and Remunerative. The former is that according to which God disposes all the things in his actions through his own wisdom, according to the rule of equity which has either been prescribed or pointed out by his wisdom. The latter, [remunerative righteousness] is that by which God renders to his creatures that which belongs to it, according to his work through an agreement into which He has entered with it. (Heb. 6:10, 17-18; Ps. 145:17; 2 Thess. 1:6; Rev. 2:23)</p></blockquote>

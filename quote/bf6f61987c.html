</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-f87d7ae16e" data-kw="Permission Author of sin">
<blockquote><p>As to the pravity or sin that is in actions, as God decreed the futurition of sin, or permitted it to take place, and did not hinder it; so all the sin or vitiosity that is in actions proceeds entirely from the creature, and the evil lusts and passions that are in his heart. Thus a man&#x27;s taking up a stone, and throwing it, is a natural action, which the providence of God enables him to perform; but his throwing it at another man with an intention to kill him, is permitted by God, otherwise it could not take place.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/thomas-boston.html">Thomas Boston</a></span><span class="wk"><span class="lbl">Work:</span> <cite>An Illustration of the Doctrines of the Christian Religion</cite>, on providence</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/providence/concurrence.html">Concurrence</a> › <a href="../topics/providence/concurrence/concurrence-and-sin.html">Concurrence and sin</a></span><span class="t"><a href="../topics/the-decrees-of-god/decree-and-sin.html">Decree and Sin</a> › <a href="../topics/the-decrees-of-god/decree-and-sin/permission-of-sin.html">Permission of sin</a></span></div>

</figure><figure class="quote" id="q-cbaf7db3bb" data-kw="">
<blockquote><p>In the contrary extreme are the Thomists, who, in their zeal to preserve the subordination and dependence of the secondary cause upon the first, posit a certain prior motion determining the secondary cause on God’s part — which is a complement of power in first act bringing with it second act antecedently. They teach this to be a physical quality, or something after the manner of a quality, which is the ground of applying and determining the secondary cause to a certain action, which in free causes could not otherwise be determined, since they are by their nature indifferent. And thus the efficacy of the divine decree is made consistent, the dependence of creatures upon it, and the infallible certainty of divine knowledge concerning future free acts… so Alvarez is the illustrious author of this position… and before him Medina… and Báñez… Conrad…</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/francisco-macedo.html">Francisco Macedo</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Collations of the Teachings of St. Thomas &amp; Scotus, with the Differences between the Two: with the Texts of Both Faithfully Presented, and the Sentences Subtly Examined, with the Commentaries of the Interpreters</cite>, … vol. 2 tr. AI by Vertias (Padua: Frambotti, 1671), , bk. 2, Collation 9, pp. 361-429 | Position of Later Thomists, p. 375</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/providence/concurrence.html">Concurrence</a></span></div>
<div class="actions"><button class="copy" data-copy="“In the contrary extreme are the Thomists, who, in their zeal to preserve the subordination and dependence of the secondary cause upon the first, posit a certain prior motion determining the secondary cause on God’s part — which is a complement of power in first act bringing with it second act antecedently. They teach this to be a physical quality, or something after the manner of a quality, which is the ground of applying and determining the secondary cause to a certain action, which in free causes could not otherwise be determined, since they are by their nature indifferent. And thus the efficacy of the divine decree is made consistent, the dependence of creatures upon it, and the infallible certainty of divine knowledge concerning future free acts… so Alvarez is the illustrious author of this position… and before him Medina… and Báñez… Conrad…”

</figure><figure class="quote" id="q-842e0d5fe6" data-kw="">
<blockquote><p>However the will depends on God, and whatever God works in it, it always retains the liberty which we said consists in immunity from the threefold necessity of coercion, determination by matter, and determination by sense.</p></blockquote>

</figure><figure class="quote" id="q-c4dca8c0f8" data-kw="">

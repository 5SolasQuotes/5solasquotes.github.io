<main class="wrap"><figure class="quote" id="q-1aaeedfdf5" data-kw="infants original sin">
<blockquote><p>From Ps. 51:5—“Behold, I was shapen in iniquity, and in sin did my mother conceive me.” David, by ascending from the consideration of actual sin committed by him to the first taint of evil, confesses before God that he was corrupt even from the womb and inclined to sin. Hence an invincible argument flows for original sin. One conceived in iniquity and nourished in sin cannot be without original sin.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/francis-turretin.html">Francis Turretin</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Institutes of Elenctic Theology</cite>, 9.10.10</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/sin/original-sin.html">Original Sin</a> › <a href="../topics/sin/original-sin/original-sin-in-infants.html">Original sin in infants</a></span><span class="t"><a href="../topics/sin/original-sin.html">Original Sin</a> › <a href="../topics/sin/original-sin/imputation-of-adams-sin.html">Imputation of Adam&#x27;s sin</a></span></div>

</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-7c2b4a999d" data-kw="Original Sin Depravity Author of sin">
<blockquote><p>In order to account for a sinful corruption of nature, yea, a total native depravity of the heart of man, there is not the least need of supposing any evil quality, infused, implanted, or wrought into the nature of man, by any positive cause, or influence whatsoever, either from God, or the creature; or of supposing, that man is conceived and born with a fountain of evil in his heart, such as is any thing properly positive.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/jonathan-edwards.html">Jonathan Edwards</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Great Christian Doctrine of Original Sin Defended</cite>, pt. 4, ch. 2</span></figcaption>

</figure><figure class="quote" id="q-4c53765dbf" data-kw="pelagius">
<blockquote><p>The ancient Pelagians, following their master, the British Pelagius, denied original sin as to all its parts, maintaining that Adam’s sin hurt no one but himself; or if it may be said to have hurt others, it does so only as to example and imitation, not as to propagation. Therefore, the question between us and our opponents is whether there is any inherent depravity (called original sin) propagated from Adam to all his posterity springing from him by natural generation. They deny; we affirm.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/francis-turretin.html">Francis Turretin</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Institutes of Elenctic Theology</cite>, 9.10.5-6</span></figcaption>

</figure><figure class="quote" id="q-429a546bdb" data-kw="Original Sin Mortification Forgiveness">
<blockquote><p>The corruption of nature, during this life, does remain in those that are regenerated (Rom. 7:18, 23; Eccl. 7:20; 1 John 1:8); and although it be through Christ pardoned and mortified, yet both itself, and the first motions thereof, are truly and properly sin (Rom. 7:23–25; Gal. 5:17).</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/particular-baptists.html">Particular Baptists</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Second London Baptist Confession of Faith</cite>, 1689, 6.5</span></figcaption>

</figure><figure class="quote" id="q-ac2cd3cfb9" data-kw="Original Sin Author of sin Holiness Justice">
<blockquote><p>However, this is certain, that God doth not infuse it. Souls receive neither purity nor impurity from him, but only their naked essence, and the natural powers and properties flowing therefrom. He doth not infuse any impurity into men; for he cannot be the author of sin, who is the revenger of it. … As a pure and holy God, he cannot infuse any impurity into the souls of men; and as a just and righteous God, he may and doth withhold from, or create them void and destitute of, that holiness and righteousness which was once their happiness and glory.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/thomas-boston.html">Thomas Boston</a></span><span class="wk"><span class="lbl">Work:</span> <cite>An Illustration of the Doctrines of the Christian Religion</cite>, on original sin</span></figcaption>

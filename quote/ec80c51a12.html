<main class="wrap"><figure class="quote" id="q-ec80c51a12" data-kw="">
<blockquote><p>Thus your first accusation, that we worship the true God after a false manner, is with false slander and furious outrage of speech, crying out of idolatry, blasphemies and abominations when as ye can show no one ground of the holy religion and worship of God which is not holden sound and entire among us, only ye rip up corruptions and spots in ceremonies, orders and circumstances, which touch not the foundation, but are such as men may err in and yet be God’s dear children and true worshippers.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/george-gifford.html">George Gifford</a></span><span class="wk"><span class="lbl">Work:</span> <cite>A Short Treatise Against the Donatists of England, whom we call Brownists... (London, 1590), ‘Brownist Position’, pp. 17 Gifford (c. 1548–1600 or 1620?) was a non-conformist, English, puritan preacher.</cite></span></figcaption>
<div class="meta"><span class="t"><a href="../topics/worship/impurities-in-worship.html">Impurities in Worship</a></span></div>

</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-e0f0a5b7e4" data-kw="">
<blockquote><p>40. I have before proved how faulty the priests’ calling was in Christ’s time, and the Temple and synagogue worship, and the Pharisees’ long liturgies, on pretence whereof they devoured widows’ houses, and their corrupt doctrine, and how great the faults were in the Churches of Corinth, Galatia, Ephesus, Sardis, Laodicea, Thyatira, Pergamos [Rev. 2-3], and those that James wrote to, from which none were commanded to depart;¹ And to condemn Christ or his apostles as favoring or using sinful communion is worse in Christians than it was in the Pharisees.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/richard-baxter.html">Richard Baxter</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Detailed | Catholic Communion Doubly Defended by Dr. Owen’s Vindicator &amp; Richard Baxter… (London: Parkhurst, 1684), section 2, pp. 9-14 | No Command to Depart; Don’t Censure Christ</cite></span></figcaption>
<div class="meta"><span class="t"><a href="../topics/worship/impurities-in-worship.html">Impurities in Worship</a></span></div>

</figure><figure class="quote" id="q-8fcc09bb8f" data-kw="">
<blockquote><p>‘Go and tell my servant David.’ The Lord speaks very honorably and respectfully of him, owns him to be his servant in other things though he did not choose to employ him in this; and though he was not the person, nor this the time, to build the house of the Lord, yet, as he showed a good will towards it, so far it was acceptable to God:</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/john-gill.html">John Gill</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Exposition of Whole Bible, on 2 Samuel, ch. 7, v. 5</cite></span></figcaption>
<div class="meta"><span class="t"><a href="../topics/worship/impurities-in-worship.html">Impurities in Worship</a></span></div>
<div class="actions"><button class="copy" data-copy="“‘Go and tell my servant David.’ The Lord speaks very honorably and respectfully of him, owns him to be his servant in other things though he did not choose to employ him in this; and though he was not the person, nor this the time, to build the house of the Lord, yet, as he showed a good will towards it, so far it was acceptable to God:”

— John Gill, Exposition of Whole Bible, on 2 Samuel, ch. 7, v. 5">Copy</button><a class="share" href="https://x.com/intent/post?text=%E2%80%9C%E2%80%98Go+and+tell+my+servant+David.%E2%80%99+The+Lord+speaks+very+honorably+and+respectfully+of+him%2C+owns+him+to+be+his+servant+in+other+things+though+he+did+not+choose+to+employ+him+in+this%3B+and+though+he+was+not+the+person%2C+nor+this+the+time%2C+to+build+the+house+of+the+Lord%2C+yet%2C+as+he+showed+a+good+will+towards+it%2C+so+far+it+was+acceptable+to+God%3A%E2%80%9D%0A%0A%E2%80%94+John+Gill%2C+Exposition+of+Whole+Bible%2C+on+2+Samuel%2C+ch.+7%2C+v.+5&amp;url=https%3A%2F%2F5solasquotes.github.io%2Fquote%2F8fcc09bb8f.html&amp;via=5Solas" target="_blank" rel="noopener">Share on X</a><a class="perma" href="../quote/8fcc09bb8f.html">Permalink</a><a class="src" href="https://reformedbooksonline.com/on-impurities-in-worship/#:~:text=%E2%80%98Go%20and%20tell%20my%20servant%20David.%E2%80%99,far%20it%20was%20acceptable%20to%20God%3A" rel="noopener" target="_blank">Read it online · Reformed Books Online</a></div>
</figure><figure class="quote" id="q-e6b9a9fb6c" data-kw="">
<blockquote><p>The mockery which worships God with nought but external gestures and absurd human fictions, how could we, without sin, allow to pass unrebuked? We know how much He hates hypocrisy, and yet in that fictitious worship, which was everywhere in use, hypocrisy reigned. We hear how bitter the terms in which the Prophets inveigh against all worship fabricated by human rashness. But a good intention, i.e. an insane licence of daring whatever man pleased, was deemed the perfection of worship. For it is certain that in the whole body of worship which had been estabhshed, there was scarcely a single observance which had an authoritative sanction from the Word of God. We are not in this matter to stand either by our own or by other men’s judgments. We must listen to the voice of God, and hear in what estimation He holds that profanation of worship which is displayed when men, overleaping the boundaries of His Word, run riot in their own inventions. The reasons which he assigns for punishing the Israelites with blindness, after they had lost the pious and holy discipline of the Church, are two, viz., the prevalence of hypocrisy, and will-worship (ethelothreskeian), meaning thereby a form of worship contrived by man.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/john-calvin.html">John Calvin</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Necessity of Reforming the Church, Presented to the Imperial Diet at Spires, A.D. 1544, in the name of all who want Christ to Reign (1544) in Tracts &amp; Letters relating to the Reformation, tr. &amp; ed. Henry Beveridge, 7 vols. (Edinburgh: Calvin Translation Society, 1844), 1.189</cite></span></figcaption>
<div class="meta"><span class="t"><a href="../topics/worship/impurities-in-worship.html">Impurities in Worship</a></span></div>

amp;url=https%3A%2F%2F5solasquotes.github.io%2Fquote%2Fe6b9a9fb6c.html&amp;via=5Solas" target="_blank" rel="noopener">Share on X</a><a class="perma" href="../quote/e6b9a9fb6c.html">Permalink</a><a class="src" href="https://reformedbooksonline.com/on-impurities-in-worship/#:~:text=The%20mockery%20which%20worships%20God%20with,form%20of%20worship%20contrived%20by%20man." rel="noopener" target="_blank">Read it online · Reformed Books Online</a></div>
</figure><figure class="quote" id="q-6e7dc48603" data-kw="">
<blockquote><p>That which is lawful for them to do… that is lawful for others to join with them in: for that which is no sin in the principal is none in the accessory, ceteris paribus [other things being equal]. And it cannot be simply unlawful to join in any action that is lawful, quatenus talis [so far as it is such].</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/william-ames.html">William Ames</a></span><span class="wk"><span class="lbl">Work:</span> <cite>‘Letter to John Robinson’ (1611) in The Works of John Robinson (London: Snow, 1851), 3.86</cite></span></figcaption>

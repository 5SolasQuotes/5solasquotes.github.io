<main class="wrap"><figure class="quote" id="q-0d04c95409" data-kw="">
<blockquote><p>And the Word became flesh and dwelt among us, and we beheld His glory, the glory as of the only begotten of the Father, full of grace and truth. (John 1:14)

The plain meaning therefore is, that the Speech begotten by God before all ages, and who always dwelt with the Father, was made man. On this article there are two things chiefly to be observed. The first is, that two natures were so united in one Person in Christ, that one and the same Christ is true God and true man. The second is, that the unity of person does not hinder the two natures from remaining distinct, so that his Divinity retains all that is peculiar to itself, and his humanity holds separately whatever belongs to it. And, therefore, as Satan has made a variety of foolish attempts to overturn sound doctrine by heretics, he has always brought forward one or another of these two errors; either that he was the Son of God and the Son of man in so confused a manner, that neither his Divinity remained entire, nor did he wear the true nature of man; or that he was clothed with flesh, so as to be as it were double, and to have two separate persons.

Thus Nestorius expressly acknowledged both natures, but imagined two Christs, one who was God, and another who was man. Eutyches, on the other hand, while he acknowledged that the one Christ is the Son of God and the Son of man, left him neither of the two natures, but imagined that they were mingled together. And in the present day, Servetus and the Anabaptists invent a Christ who is confusedly compounded of two natures, as if he were a Divine man. In words, indeed, he acknowledges that Christ is God; but if you admit his raving imaginations, the Divinity is at one time changed into human nature, and at another time, the nature of man is swallowed up by the Divinity.

The Evangelist says what is well adapted to refute both of these blasphemies. When he tells us that the Speech was made flesh, we clearly infer from this the unity of his Person; for it is impossible that he who is now a man could be any other than he who was always the true God, since it is said that God was made man. On the other hand, since he distinctly gives to the man Christ the name of the Speech, it follows that Christ, when he became man, did not cease to be what he formerly was, and that no change took place in that eternal essence of God which was clothed with flesh. In short, the Son of God began to be man in such a manner that he still continues to be that eternal Speech who had no beginning of time.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/john-calvin.html">John Calvin</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Commentary on the Gospel According to John</cite>, trans. William Pringle (Geneva, 1553) in Calvin’s Commentaries (22 vols, Grand Rapids MI: Baker, 1993), 17: 46.</span></figcaption>

</figure><figure class="quote" id="q-9ae95d3b37" data-kw="Mary Mediator Invocation of saints">
<blockquote><p>However, we cannot in any way acknowledge or accept what our opponents openly say, namely that Mary is to be invoked as a mediator between God and humans, or that she is our patron and advocate. We do not believe that this is either a tradition of Holy Scripture or a command from God. We believe that God, who alone grants all salvation for the present and future, is the one to be invoked alone. We believe that Christ alone [since He alone is true God and true man] is the true mediator between God and humans. We believe that He, who alone can satisfy all humans, is the patron and advocate with the Father.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/heinrich-bullinger.html">Heinrich Bullinger</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Sermon on the Blessed Virgin Mary, the Mother of Our Lord Jesus Christ</cite>, 1558</span></figcaption>

<blockquote><p>First of all, therefore, our position must be explained briefly, which is emphatically this: That the whole Christ is indeed to be worshipped and called upon by us lest we divide the person of Christ (which is unique, consisting of both natures), or separate it. But worship ought not to be directed to the whole of Christ, lest we confuse the natures which remain in the Person unconfused, or regard the human as equal to the divine. Both our worship and invocation are in fact not rendered or directed properly and of themselves to the flesh of Christ itself, that is, to the human nature,¹ but rather to the Deity of Christ itself, nor indeed as it subsists by itself and separate, outside of the assumed human nature (as Nestorius understood, and Cyril refuted in his Anathemas), but instead as it is ever joined together with the same assumed nature in one Person, and remains united. ¹ [Daneau uses strong language below about not directing worship to Christ’s human nature. However, in light of this sentence, and other evidence below, it is clear Daneau is not denying that worship may be materially directed to Christ’s human nature, but only that worship is not to be formally directed to Christ’s human nature.] For in the same way when we praise anyone (for example Apollo, the fellow-worker [Greek] of Paul) as blessed [Greek] and endowed with the greatest faculty of reasoning and understanding, we indeed praise the whole man himself, who consists of body and soul, and we celebrate and proclaim him. Nevertheless the praise and proclamation of that person’s reason and intelligence pertains only to his mind, which nevertheless remains not separately and in itself, but rather conjoined together with its own body. In such a way do we offer our adoration and invocation indeed to the whole Christ (who is God and man) but nevertheless the praise in and of itself, and the invocation and worship, we offer not to the whole of Christ, but rather to his deity, and this we regard, even though it does not subsist piecemeal [Greek], that is, not having a hypostasis of its own, by itself, outside of the human nature. In summary therefore, while we worship Christ, and call upon Him (though here we are talking about religious worship and adoration, but not civil adoration and invocation, a point on which we agree with Chemnitz), neither our invocation nor adoration is directed at, in and of itself, or looks toward, the flesh of Christ itself, even though it remains in union of the Person. And these are some of the many reasons for our opinion.

1. First. The man is cursed (says the prophet, speaking as the very person of God) who puts his trust in man, and makes fleshhis arm (Jeremiah 17:5). Now the flesh of Christ is true flesh, and the man Christ is true man. But the one who adores or calls upon any man in religious worship puts his trust in him whom he thus calls upon and worships. Therefore he who directs his worship to the flesh of Christ itself has been cursed by the mouth of God Himself.

2. Second. They are true idolaters who serve, that is adore or call upon those, who by nature are not Gods (Galatians 4[:8]). Now Christ’s flesh is not by nature God, even though it is hypostatically united to the true God. Therefore those who direct their invocation particularly to it are true idolaters. Butthis word ‘nature’ is of such great significance in this passage of Paul, that even if Chemnitz’s construct of the real communication of the essential properties of deity into the assumed human nature were true, nevertheless the result would not be that on this account Christ’s flesh was an object of worship, which it would [then] be God by grace and [yet] not by nature.

3. Third. Those who adore or call upon their own fellow-slaves who are from among their brothers in religious worship are chastised by the Holy Spirit Himself through his angel and condemned (Revelation 19:10; 22:8). And Christ, as man, is fellow-slave and one of our brothers, even if He is the firstborn. Therefore as man, Christ should not be adored or called upon.

4. Fourth. Only God should be adored (Revelation 19:10). But Christ’s flesh is not God. Therefore.

5. Fifth. He who calls upon a creature or adores one with religious worship, is a blasphemer against God (Deuteronomy 4:6; 10:17; Matthew 4:10). Christ’s flesh remains a creature, even though it is glorified and in the union of the Person of Christ (Augustine on John, sermon 58), therefore he who directs his worship to it blasphemes God.

6. Paul, though he says Christ should be adored, explains that it is to be attributed to Him by reason of his nature, calling Him God (Romans 9:5). Therefore Christ, as God, and not as man, should be adored.

7. The Lord says (Isaiah 43[42:8]), I will not give my glory to another. Therefore the glory of God should not be given to him [that]. And this is the glory of God: religious worship.

8. This was once the error of Nestorius: he taught that Christ, as He is man, should be worshipped together with the Word. Therefore he is a Nestorian who teaches and stresses the same thing today.

9. All the orthodox fathers teach that our invocation and adoration should not be directed to the flesh of Christ itself, even as it remains in the hypostasis of the Son of God, but rather to the very deity of the Son. Therefore he contradicts the orthodox fathers and the pious and learned ancient practice of the Church who desires and thinks and says, when Christ is adored or called upon, that the flesh of Christ itself is also an object of this sort of adoration and invocation. And a little later [in Chemnitz], But I ask, how can it happen that, if Christ’s human nature, just as the divine also, should be worshipped and adored, that it would itself not also be divine, that is, God? And would it follow logically that the distinction between the natures still remain preserved? And a little later, Chemnitz first of all works partly from the very solid and unvanquished foundation by which it is said that no creature ought to be worshipped, and partly by the making sport of the very true and suitable analogy of the crown by which the king is adorned, and which is greeted along with the king himself. Therefore (says Chemnitz), Christ’s flesh should not be adored apart from the union. But whoever said this or thought this? Much to the contrary, the fathers themselves, whose testimonies I have offered, deny, and clearly so, that Christ’s flesh, even as it remains in the union, ought to have our adoration directed to it. Therefore Chemnitz seeks precedence, and perverts the fathers, while he wishes to twist their opinions to his own, though they teach so clearly that not even united to the Word [logos] is the flesh in Christ an object of our worship. And the reason is, since the flesh of Christ, even in the union, is true flesh, and truly creature. And so it is never to be adored with religious worship.</p></blockquote>

<div class="actions"><button class="copy" data-copy="“First of all, therefore, our position must be explained briefly, which is emphatically this: That the whole Christ is indeed to be worshipped and called upon by us lest we divide the person of Christ (which is unique, consisting of both natures), or separate it. But worship ought not to be directed to the whole of Christ, lest we confuse the natures which remain in the Person unconfused, or regard the human as equal to the divine. Both our worship and invocation are in fact not rendered or directed properly and of themselves to the flesh of Christ itself, that is, to the human nature,¹ but rather to the Deity of Christ itself, nor indeed as it subsists by itself and separate, outside of the assumed human nature (as Nestorius understood, and Cyril refuted in his Anathemas), but instead as it is ever joined together with the same assumed nature in one Person, and remains united. ¹ [Daneau uses strong language below about not directing worship to Christ’s human nature. However, in light of this sentence, and other evidence below, it is clear Daneau is not denying that worship may be materially directed to Christ’s human nature, but only that worship is not to be formally directed to Christ’s human nature.] For in the same way when we praise anyone (for example Apollo, the fellow-worker [Greek] of Paul) as blessed [Greek] and endowed with the greatest faculty of reasoning and understanding, we indeed praise the whole man himself, who consists of body and soul, and we celebrate and proclaim him. Nevertheless the praise and proclamation of that person’s reason and intelligence pertains only to his mind, which nevertheless remains not separately and in itself, but rather conjoined together with its own body. In such a way do we offer our adoration and invocation indeed to the whole Christ (who is God and man) but nevertheless the praise in and of itself, and the invocation and worship, we offer not to the whole of Christ, but rather to his deity, and this we regard, even though it does not subsist piecemeal [Greek], that is, not having a hypostasis of its own, by itself, outside of the human nature. In summary therefore, while we worship Christ, and call upon Him (though here we are talking about religious worship and adoration, but not civil adoration and invocation, a point on which we agree with Chemnitz), neither our invocation nor adoration is directed at, in and of itself, or looks toward, the flesh of Christ itself, even though it remains in union of the Person. And these are some of the many reasons for our opinion.

1. First. The man is cursed (says the prophet, speaking as the very person of God) who puts his trust in man, and makes fleshhis arm (Jeremiah 17:5). Now the flesh of Christ is true flesh, and the man Christ is true man. But the one who adores or calls upon any man in religious worship puts his trust in him whom he thus calls upon and worships. Therefore he who directs his worship to the flesh of Christ itself has been cursed by the mouth of God Himself.

2. Second. They are true idolaters who serve, that is adore or call upon those, who by nature are not Gods (Galatians 4[:8]). Now Christ’s flesh is not by nature God, even though it is hypostatically united to the true God. Therefore those who direct their invocation particularly to it are true idolaters. Butthis word ‘nature’ is of such great significance in this passage of Paul, that even if Chemnitz’s construct of the real communication of the essential properties of deity into the assumed human nature were true, nevertheless the result would not be that on this account Christ’s flesh was an object of worship, which it would [then] be God by grace and [yet] not by nature.

3. Third. Those who adore or call upon their own fellow-slaves who are from among their brothers in religious worship are chastised by the Holy Spirit Himself through his angel and condemned (Revelation 19:10; 22:8). And Christ, as man, is fellow-slave and one of our brothers, even if He is the firstborn. Therefore as man, Christ should not be adored or called upon.

4. Fourth. Only God should be adored (Revelation 19:10). But Christ’s flesh is not God. Therefore.

5. Fifth. He who calls upon a creature or adores one with religious worship, is a blasphemer against God (Deuteronomy 4:6; 10:17; Matthew 4:10). Christ’s flesh remains a creature, even though it is glorified and in the union of the Person of Christ (Augustine on John, sermon 58), therefore he who directs his worship to it blasphemes God.

6. Paul, though he says Christ should be adored, explains that it is to be attributed to Him by reason of his nature, calling Him God (Romans 9:5). Therefore Christ, as God, and not as man, should be adored.

7. The Lord says (Isaiah 43[42:8]), I will not give my glory to another. Therefore the glory of God should not be given to him [that]. And this is the glory of God: religious worship.

8. This was once the error of Nestorius: he taught that Christ, as He is man, should be worshipped together with the Word. Therefore he is a Nestorian who teaches and stresses the same thing today.

9. All the orthodox fathers teach that our invocation and adoration should not be directed to the flesh of Christ itself, even as it remains in the hypostasis of the Son of God, but rather to the very deity of the Son. Therefore he contradicts the orthodox fathers and the pious and learned ancient practice of the Church who desires and thinks and says, when Christ is adored or called upon, that the flesh of Christ itself is also an object of this sort of adoration and invocation. And a little later [in Chemnitz], But I ask, how can it happen that, if Christ’s human nature, just as the divine also, should be worshipped and adored, that it would itself not also be divine, that is, God? And would it follow logically that the distinction between the natures still remain preserved? And a little later, Chemnitz first of all works partly from the very solid and unvanquished foundation by which it is said that no creature ought to be worshipped, and partly by the making sport of the very true and suitable analogy of the crown by which the king is adorned, and which is greeted along with the king himself. Therefore (says Chemnitz), Christ’s flesh should not be adored apart from the union. But whoever said this or thought this? Much to the contrary, the fathers themselves, whose testimonies I have offered, deny, and clearly so, that Christ’s flesh, even as it remains in the union, ought to have our adoration directed to it. Therefore Chemnitz seeks precedence, and perverts the fathers, while he wishes to twist their opinions to his own, though they teach so clearly that not even united to the Word [logos] is the flesh in Christ an object of our worship. And the reason is, since the flesh of Christ, even in the union, is true flesh, and truly creature. And so it is never to be adored with religious worship.”

— Lambert Daneau, Examination of the Book of Dr. Chemnitz regarding the Two Natures in Christ, (1581) as quoted and translated in Jakob Andreae &amp; Theodore Beza, Lutheranism vs. Calvinism: the Classic Debate at the Colloquy of Montbeliard 1586 ed. Jeffrey Mallinson tr. Clinton J. Armstrong (Concordia Publishing House, 2017), pp. 404-8">Copy</button><a class="share" href="https://x.com/intent/post?text=%E2%80%9CFirst+of+all%2C+therefore%2C+our+position+must+be+explained+briefly%2C+which+is+emphatically+this%3A+That+the+whole+Christ+is+indeed+to+be+worshipped+and+called+upon+by+us+lest+we+divide+the+person+of+Christ+%28which+is+unique%2C+consisting+of+both+natures%29%2C+or+separate+it.+But+worship+ought+not+to+be+directed+to+the+whole+of+Christ%2C+lest+we+confuse+the+natures+which+remain+in+the+Person+unconfused%2C+or+regard+the+human+as+equal+to+the+divine.+Both+our+worship+and+invocation+are+in+fact+not+rendered+or+directed+properly+and+of+themselves+to+the+flesh+of+Christ+itself%2C+that+is%2C+to+the+human+nature%2C%C2%B9+but+rather+to+the+Deity+of+Christ+itself%2C+nor+indeed+as+it+subsists+by+itself+and+separate%2C+outside+of+the+assumed+human+nature+%28as+Nestorius+understood%2C+and+Cyril+refuted+in+his+Anathemas%29%2C+but+instead+as+it+is+ever+joined+together+with+the+same+assumed+nature+in+one+Person%2C+and+remains+united.+%C2%B9+%5BDaneau+uses+strong+language+below+about+not+directing+worship+to+Christ%E2%80%99s+human+nature.+However%2C+in+light+of+this+sentence%2C+and+other+evidence+below%2C+it+is+clear+Daneau+is+not+denying+that+worship+may+be+materially+directed+to+Christ%E2%80%99s+human+nature%2C+but+only+that+worship+is+not+to+be+formally+directed+to+Christ%E2%80%99s+human+nature.%5D+For+in+the+same+way+when+we+praise+anyone+%28for+example+Apollo%2C+the+fellow-worker+%5BGreek%5D+of+Paul%29+as+blessed+%5BGreek%5D+and+endowed+with+the+greatest+faculty+of+reasoning+and+understanding%2C+we+indeed+praise+the+whole+man+himself%2C+who+consists+of+body+and+soul%2C+and+we+celebrate+and+proclaim+him.+Nevertheless+the+praise+and+proclamation+of+that+person%E2%80%99s+reason+and+intelligence+pertains+only+to+his+mind%2C+which+nevertheless+remains+not+separately+and+in+itself%2C+but+rather+conjoined+together+with+its+own+body.+In+such+a+way+do+we+offer+our+adoration+and+invocation+indeed+to+the+whole+Christ+%28who+is+God+and+man%29+but+nevertheless+the+praise+in+and+of+itself%2C+and+the+invocation+and+worship%2C+we+offer+not+to+the+whole+of+Christ%2C+but+rather+to+his+deity%2C+and+this+we+regard%2C+even+though+it+does+not+subsist+piecemeal+%5BGreek%5D%2C+that+is%2C+not+having+a+hypostasis+of+its+own%2C+by+itself%2C+outside+of+the+human+nature.+In+summary+therefore%2C+while+we+worship+Christ%2C+and+call+upon+Him+%28though+here+we+are+talking+about+religious+worship+and+adoration%2C+but+not+civil+adoration+and+invocation%2C+a+point+on+which+we+agree+with+Chemnitz%29%2C+neither+our+invocation+nor+adoration+is+directed+at%2C+in+and+of+itself%2C+or+looks+toward%2C+the+flesh+of+Christ+itself%2C+even+though+it+remains+in+union+of+the+Person.+And+these+are+some+of+the+many+reasons+for+our+opinion.+1.+First.+The+man+is+cursed+%28says+the+prophet%2C+speaking+as+the+very+person+of+God%29+who+puts+his+trust+in+man%2C+and+makes+fleshhis+arm+%28Jeremiah+17%3A5%29.+Now+the+flesh+of+Christ+is+true+flesh%2C+and+the+man+Christ+is+true+man.+But+the+one+who+adores+or+calls+upon+any+man+in+religious+worship+puts+his+trust+in+him+whom+he+thus+calls+upon+and+worships.+Therefore+he+who+directs+his+worship+to+the+flesh+of+Christ+itself+has+been+cursed+by+the+mouth+of+God+Himself.+2.+Second.+They+are+true+idolaters+who+serve%2C+that+is+adore+or+call+upon+those%2C+who+by+nature+are+not+Gods+%28Galatians+4%5B%3A8%5D%29.+Now+Christ%E2%80%99s+flesh+is+not+by+nature+God%2C+even+though+it+is+hypostatically+united+to+the+true+God.+Therefore+those+who+direct+their+invocation+particularly+to+it+are+true+idolaters.+Butthis+word+%E2%80%98nature%E2%80%99+is+of+such+great+significance+in+this+passage+of+Paul%2C+that+even+if+Chemnitz%E2%80%99s+construct+of+the+real+communication+of+the+essential+properties+of+deity+into+the+assumed+human+nature+were+true%2C+nevertheless+the+result+would+not+be+that+on+this+account+Christ%E2%80%99s+flesh+was+an+object+of+worship%2C+which+it+would+%5Bthen%5D+be+God+by+grace+and+%5Byet%5D+not+by+nature.+3.+Third.+Those+who+adore+or+call+upon+their+own+fellow-slaves+who+are+from+among+their+brothers+in+religious+worship+are+chastised+by+the+Holy+Spirit+Himself+through+his+angel+and+condemned+%28Revelation+19%3A10%3B+22%3A8%29.+And+Christ%2C+as+man%2C+is+fellow-slave+and+one+of+our+brothers%2C+even+if+He+is+the+firstborn.+Therefore+as+man%2C+Christ+should+not+be+adored+or+called+upon.+4.+Fourth.+Only+God+should+be+adored+%28Revelation+19%3A10%29.+But+Christ%E2%80%99s+flesh+is+not+God.+Therefore.+5.+Fifth.+He+who+calls+upon+a+creature+or+adores+one+with+religious+worship%2C+is+a+blasphemer+against+God+%28Deuteronomy+4%3A6%3B+10%3A17%3B+Matthew+4%3A10%29.+Christ%E2%80%99s+flesh+remains+a+creature%2C+even+though+it+is+glorified+and+in+the+union+of+the+Person+of+Christ+%28Augustine+on+John%2C+sermon+58%29%2C+therefore+he+who+directs+his+worship+to+it+blasphemes+God.+6.+Paul%2C+though+he+says+Christ+should+be+adored%2C+explains+that+it+is+to+be+attributed+to+Him+by+reason+of+his+nature%2C+calling+Him+God+%28Romans+9%3A5%29.+Therefore+Christ%2C+as+God%2C+and+not+as+man%2C+should+be+adored.+7.+The+Lord+says+%28Isaiah+43%5B42%3A8%5D%29%2C+I+will+not+give+my+glory+to+another.+Therefore+the+glory+of+God+should+not+be+given+to+him+%5Bthat%5D.+And+this+is+the+glory+of+God%3A+religious+worship.+8.+This+was+once+the+error+of+Nestorius%3A+he+taught+that+Christ%2C+as+He+is+man%2C+should+be+worshipped+together+with+the+Word.+Therefore+he+is+a+Nestorian+who+teaches+and+stresses+the+same+thing+today.+9.+All+the+orthodox+fathers+teach+that+our+invocation+and+adoration+should+not+be+directed+to+the+flesh+of+Christ+itself%2C+even+as+it+remains+in+the+hypostasis+of+the+Son+of+God%2C+but+rather+to+the+very+deity+of+the+Son.+Therefore+he+contradicts+the+orthodox+fathers+and+the+pious+and+learned+ancient+practice+of+the+Church+who+desires+and+thinks+and+says%2C+when+Christ+is+adored+or+called+upon%2C+that+the+flesh+of+Christ+itself+is+also+an+object+of+this+sort+of+adoration+and+invocation.+And+a+little+later+%5Bin+Chemnitz%5D%2C+But+I+ask%2C+how+can+it+happen+that%2C+if+Christ%E2%80%99s+human+nature%2C+just+as+the+divine+also%2C+should+be+worshipped+and+adored%2C+that+it+would+itself+not+also+be+divine%2C+that+is%2C+God%3F+And+would+it+follow+logically+that+the+distinction+between+the+natures+still+remain+preserved%3F+And+a+little+later%2C+Chemnitz+first+of+all+works+partly+from+the+very+solid+and+unvanquished+foundation+by+which+it+is+said+that+no+creature+ought+to+be+worshipped%2C+and+partly+by+the+making+sport+of+the+very+true+and+suitable+analogy+of+the+crown+by+which+the+king+is+adorned%2C+and+which+is+greeted+along+with+the+king+himself.+Therefore+%28says+Chemnitz%29%2C+Christ%E2%80%99s+flesh+should+not+be+adored+apart+from+the+union.+But+whoever+said+this+or+thought+this%3F+Much+to+the+contrary%2C+the+fathers+themselves%2C+whose+testimonies+I+have+offered%2C+deny%2C+and+clearly+so%2C+that+Christ%E2%80%99s+flesh%2C+even+as+it+remains+in+the+union%2C+ought+to+have+our+adoration+directed+to+it.+Therefore+Chemnitz+seeks+precedence%2C+and+perverts+the+fathers%2C+while+he+wishes+to+twist+their+opinions+to+his+own%2C+though+they+teach+so+clearly+that+not+even+united+to+the+Word+%5Blogos%5D+is+the+flesh+in+Christ+an+object+of+our+worship.+And+the+reason+is%2C+since+the+flesh+of+Christ%2C+even+in+the+union%2C+is+true+flesh%2C+and+truly+creature.+And+so+it+is+never+to+be+adored+with+religious+worship.%E2%80%9D%0A%0A%E2%80%94+Lambert+Daneau%2C+Examination+of+the+Book+of+Dr.+Chemnitz+regarding+the+Two+Natures+in+Christ%2C+%281581%29+as+quoted+and+translated+in+Jakob+Andreae+%26+Theodore+Beza%2C+Lutheranism+vs.+Calvinism%3A+the+Classic+Debate+at+the+Colloquy+of+Montbeliard+1586+ed.+Jeffrey+Mallinson+tr.+Clinton+J.+Armstrong+%28Concordia+Publishing+House%2C+2017%29%2C+pp.+404-8&amp;url=https%3A%2F%2F5solasquotes.github.io%2Fquote%2Fe1619c7d1a.html&amp;via=5Solas" target="_blank" rel="noopener">Share on X</a><a class="perma" href="../quote/e1619c7d1a.html">Permalink</a><a class="src" href="https://reformedbooksonline.com/the-grounds-of-christ-the-mediator-receiving-divine-worship/#:~:text=First%20of%20all%2C%20therefore%2C%20our%20position,to%20be%20adored%20with%20religious%20worship&amp;text=First%20of%20all%2C%20therefore%2C%20our%20position%20must%20be&amp;text=is%20never%20to%20be%20adored%20with%20religious%20worship" rel="noopener" target="_blank">Read it online · Reformed Books Online</a></div>

<blockquote><p>Therefore, we maintain that the blessed Virgin is not to be worshiped, not to be invoked as a mediator or mother of graces; we do not want to place our trust in her, offer sacrifices in her name, celebrate festivals in her honor, erect images of her, or honor her through any such cult!</p></blockquote>

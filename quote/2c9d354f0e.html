<main class="wrap"><figure class="quote" id="q-2c9d354f0e" data-kw="">
<blockquote><p>Through the knowledge of faith it is Christ the Prophet who works on us by teaching and explains Himself in His mediatorial work. Through the assent of faith it is Christ as King who rules over our souls so that we give ourselves captive to His truth. Through the assurance of faith, which we call trust, it is Christ who as Priest ministers reconciliation to us and grants us peace with God or places upon us the blessing of God.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/geerhardus-vos.html">Geerhardus Vos</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Reformed Dogmatics</cite>, trans. and ed. Richard B. Gaffin (1910; 5 vols, Bellingham WA: Lexham Press, 2014-16), 3: 86.</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/faith/nature-of-saving-faith.html">Nature of Saving Faith</a></span></div>

</figure><figure class="quote" id="q-19f01e32d5" data-kw="">
<blockquote><p>Faith comprehends the knowledge of the mystery of God, and of Christ in the light of grace, the truth of which mystery the believer acknowledges with full assent of mind, on the authority of the testimony of God. And not only so, but he is also in love with that truth, exults therein and glorifies God; he likewise ardently desires communion with Christ … wherefore, when Christ is offered to him by the word and Spirit, he receives him with the greatest complacency of soul, leans and rests upon him, and gives and surrenders himself to him.</p></blockquote>

<blockquote><p>Faith consists not in ignorance, but in knowledge--knowledge not of God merely, but of the divine will. We do not obtain salvation either because we are prepared to embrace every dictate of the Church as true, or leave to the Church the province of inquiring and determining; but when we recognize God as a propitious Father through the reconciliation made by Christ, and Christ as given to us for righteousness, sanctification, and life.</p></blockquote>

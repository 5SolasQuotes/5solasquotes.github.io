<main class="wrap"><figure class="quote" id="q-08d7fc83ec" data-kw="">
<blockquote><p>Evan. Surely, neighbour Nomologista, you do not truly know yourself, for I am confident, that any man who truly knows himself, sees such secret corruptions of heart in every duty he performs, as causes him unfeignedly to confess, that whatever good action he does, it is but a polluted stream of a more corrupt fountain. And whatsoever you or any man else do conceive of yourselves, it is most certain, that whatsoever sin is forbidden in the word, or has been practised in the world, that sin every man carries in his bosom, for all have equally sinned in Adam, and therefore original lust is equally in all.

Nom. Sir, I can hardly be persuaded to this.

Evan. Well, neighbour Nomologista, I cannot so well tell how it is with you, but for mine own part, I tell you truly, I find my knowledge corrupted and defiled with ignorance and blindness, and my faith corrupted and defiled with doubting and distrust, and my love to God very much corrupted and defiled with sinful self-love and love to the world; and my joy in God much corrupted and defiled with carnal joy; and my godly sorrow very much corrupted and defiled with worldly sorrow.

And I find my prayers, my hearing, my reading, my receiving the sacrament, and such like duties, very much corrupted and defiled with dullness, drowsiness, sleepiness, wandering, and worldly thoughts, and the like.

And I find my sanctifying of the Lord’s name very much corrupted and defiled, by thinking and speaking lightly and irreverently of his titles; and by thinking, if not by speaking, grudgingly against some acts of his providence.

And I find my sanctifying of the Lord’s day very much corrupted and defiled, by sleeping too long in the morning, and by worldly thoughts and words, if not by worldly works.

And I find that all the duties that I have performed, either towards my superiors or inferiors, have been corrupted and defiled, either with too much indulgence, or with too much severity, or with base fears, or base hopes, or some self-end and by-respect.

And I find that all my duties that I have performed, either for the preservation of mine own or other’s life, chastity, goods, or good name, have been very much corrupted and defiled, either with a desire of mine own praise, own profit here, or to escape hell, and to obtain heaven hereafter; so that I see no good action which I have ever done free from having some corruption mixed with it.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/edward-fisher.html">Edward Fisher</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Marrow of Modern Divinity</cite>, (1646) in The Works of Thomas Boston, ed. Samuel McMillan (12 vols, London, 1853), vii, 444.</span></figcaption>

<blockquote><p>We conclude that Holy Scripture does not speak of a reward such as is owed, by a right of hire, on account of worthiness corresponding to the reward; but rather of that which is conferred not upon the idle but upon those who labor, by virtue of covenant and of a gratuitous promise. Hence it is elsewhere also called an inheritance. Nor ought the name “inheritance” to be thought to prevent its being called a “reward”; for even to an adopted son, who has diligently obeyed his adopter and endured many things for his sake, the inheritance comes by filial right, and yet, in respect of the works he has performed and the afflictions he has undergone, it may be called a reward.</p></blockquote>

<blockquote><p>Q155 What if someone is not endowed with faith until the very moment of death itself. For this seems to have happened to the thief hanging on the cross. What kind of good works will someone of this type have brought forth?

A155 No, the faith of that thief was in that brief time unspeakably active, for he rebuked the blasphemes and wickedness of the other thief, he detested his own crimes, and with a plain and marvelous faith he acknowledged Christ as the eternal king while he was in the very disgrace of the cross; as all the disciples kept silent, he invoked him as his Saviour, and finally he openly reproved the cruelties and ungodly voices of the Jews.

Moreover, the acknowledgement of sin, the invocation of God the Father in Christ, and thanksgiving, are the most excellent works of the first Table, which cannot be separated from faith in any man. Yet someone who is prevented by death is not able to demonstrate any of the works of the second table. Nevertheless, faith is not to be considered idle in him, since although it does not have charity joined in deed, it has it joined in potentiality.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/theodore-beza.html">Theodore Beza</a></span><span class="wk"><span class="lbl">Work:</span> <cite>A Little Book of Christian Questions and Responses. In which the Principal Headings of the Christian Religion are briefly set forth</cite>, trans. Kirk M. Summers, ed. Dikran Y. Hadidian (1570; Eugene OR: Pickwick Publications, 1986), p. 61.</span></figcaption>

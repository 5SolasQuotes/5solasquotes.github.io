<main class="wrap"><figure class="quote" id="q-9ab7020e99" data-kw="">
<blockquote><p>Christ is directly intended and pointed out by the law. If ye consider the whole administration of Moses, that is, the law and covenant of works, though it was preached after the fall, yet it was never preached alone without the gospel, and so consider the whole administration of God’s mind and ordinances, Christ is principally aimed at; for, I. The doctrine Moses delivered in mount Sinai contained a covenant of grace. If you look to the preface of the ten commandments, it is even the chief gospel-promise, and article of the covenant.

For, how could God come in terms with men after sin, but in terms of grace; and in no other terms can man stand before God, nor God be his God. And likewise, seeing the gospel was preached in paradise, and afterwards to Abraham, God could not be false in his promise made to Abraham, neither could the promulgation of the law that followed make that null which went before. Gal. iii. 17. What meant all the ceremonial law? It shadowed out Jesus Christ the only sacrifice and propitiation. And this is the sum of the gospel-salvation to penitents believing in Christ, and looking through the sacrifices unto him, and thus David’s righteousness was the imputation of righteousness, and not inherent holiness, Psal. xxxii. 1, 2; Rom. iv. 5.

But, 2. It uses to be a question, whether the law delivered upon mount Sinai was a covenant of works or not; some say that the law which was delivered upon mount Sinai was indeed a covenant of works, though they confess it was preached with the covenant of grace, and not delivered to them to stand by it, or of intention to get righteousness by it, but to be subservient to the covenant of grace. Others speak absolutely, that the law upon mount Sinai was a covenant of grace.

We conceive this is but a contention about words; the matter is clear in itself, (1.) That neither is now the gospel preached without the law, as ye may see in Christ’s sermon upon the mount, and his sermon to the young man, Matt. v. vi. vii.; Mark x. 17; nor yet was then the law preached without the gospel, as ye may see in Exod. xx.; the preface to the commandments, and the second commandment, contain much of the gospel in them, — Deut. xxx. 6, 7, &amp;c., compared with Rom. x. 6, &amp;c., where Paul notes both the righteousness of faith and of the works of the law.

(1.) Those who say the law on mount Sinai was a covenant of works, do not assert that God gave it to be a covenant of works, out of intention that men should seek salvation thereby; but they make it only a schoolmaster to lead us unto Christ and to discover our sinful condition: and those who say it was a covenant of grace, consider it in relation to God’s end of sending it, and as it takes in all the administration and doctrine of Moses.

So there needs be no difficulty here. The matter seems clear, that the covenant of works was preached by Moses, and so it was by Paul, Rom. x., Gal. iii.; and that neither Paul nor Moses preached the covenant of works, but as a broken covenant; not as such that men could stand unto, or be saved by. No man can preach the gospel, unless he preach the covenant of works, not because both concur to the justification of a sinner, but because the knowledge of a man’s own lost condition under the one presses him to flee to the other.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/hugh-binning.html">Hugh Binning</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Several Sermons upon the Most Important Subjects of Practical Religion</cite>, (1760) in The Works of Hugh Binning, ed. James Cochrane (3 vols, Edinburgh: William Whyte, 1839), 3: 282-83.</span></figcaption>

<blockquote><p>God’s covenant is a bargain which God hath made with men, in which God promiseth to men some good, &amp; requireth of them again, that they perform those things which he commandeth. And that covenant is either eternal or temporal. The eternal covenant is a covenant in which God promiseth men eternal life. And that is two fold, the covenant of works, or the covenant of grace.

The covenant of works, is a bargain of God made with men concerning eternal life, to which is both a condition of perfect obedience adjoined, to be performed by man, &amp; also a threatening of eternal death if he shall not perform perfect obedience. Gen. 2.17.

The repetition of the covenant of works is made by God, Exod. 19.5. Deut. 5.2. 1. King. 8.21. Heb. 8.9. and that chiefly for four causes.</p></blockquote>

<blockquote><p>In the case of men and angels, God has been pleased to promise this transcendent benefit upon certain conditions; which conditional promise is called a covenant. There can be no doubt that this amazing gift of God’s personal love and life-giving society had been offered to angels, and at the beginning was offered to the first human pair, upon conditions. Some object that the conditional promise made to Adam in the garden is not explicitly called a covenant, and that it does not possess all the essential elements of a covenant, since it was a constitution sovereignly ordained by the Creator without consulting the will of the creature.

It is a sufficient answer to these objections, – (1) That although Adam’s will was not consulted, yet his will was unquestionably cordially consenting to this divine constitution and all the terms thereof, and hence the transaction did embrace all the elements of a covenant. (2) That instances of analogous transactions between God and men are expressly styled covenants in the Bible. If God’s transactions with Noah (Gen. 9:11,12) and with Abraham (Gen. 17:1-21) were covenants, then was his transaction with Adam in the garden a covenant.

The analysis of a covenant always gives the following elements: (a) Its parties. (b) Its promise. (c) Its conditions. (d) Its penalty. As to its parties, our Standards teach –

In the first covenant that concerned mankind God dealt with Adam as the representative of all his descendants. The parties, therefore, are God and Adam, the latter representing the human race. That Adam did so act as the representative of his descendants, in such a sense that they were equally interested with himself in all the merit or the demerit, the reward or the penalty, attaching to his action during the period of probation, has already been proved to be the doctrine both of our Standards and of Scripture. (Ch. 6., ss. 3, 4.) As to the further nature of this covenant, our Standards teach – The promise of it was life, the condition of it perfect obedience, and the penalty of it death. (L. Cat., q. 20; S. Cat., q. 12.)

This covenant is variously styled, from one or other of these several elements. Thus, it is called the “covenant of works,” because perfect obedience was its condition, and to distinguish it from the covenant of grace, which rests our salvation on a different basis altogether. It is also called the “covenant of life,” because life was promised on condition of the obedience. It is also called a “legal covenant,” because it demanded the literal fulfilment of the claims of the moral law as the condition of God’s favour. This covenant was also in its essence a covenant of grace, in that it graciously promised life in the society of God as the freely-granted reward of an obedience already unconditionally due. Nevertheless it was a covenant of works and of law with respect to its demands and conditions.

(1) That the promise of the covenant was life is proved – (a) From the nature of the penalty, which is recorded in terms. If disobedience was linked to death, obedience must have been linked to life. (b) It is taught expressly in many passages of Scripture. Paul says, Rom. 10:5, “Moses describes the righteousness which is of the law, That the man which does those things shall live by them.” (Matt. 19:16,17; Gal. 3:12; Lev. 18:5; Neh. 9:29.)

That the life promised was not mere continuance of existence is plain – (a) From the fact that the death threatened was not the mere extinction of existence. Adam experienced that death the very day he ate the forbidden fruit. The death threatened was exclusion from the communion of God. The life promised, therefore, must consist in the divine fellowship and the excellence and happiness thence resulting. (b) From the fact that mere existence was not in jeopardy. It is the character, not the fact, of continued existence which God suspended upon obedience. (c) Because the terms “life” and “death” are used in the Scriptures constantly to define two opposite spiritual conditions, which depend upon the relation of the soul to God. (John 5:24; 6:4; Rom. 6:23; 11:15; Eph. 2:1-3; 5:14; Rev. 3:1.)

(2) That the condition of the covenant was perfect obedience is plain from the fact – (a) That the divine law can demand no less. It is of the essence of all that is right that it is obligatory. James says, that “whosoever shall keep the whole law, and yet offend in one point, he is guilty of all.” James 2:10; Gal. 3:10; Deut. 27:26. (b) That the command not to eat of the fruit of the tree of the knowledge of good and evil, relating to a thing indifferent in itself, was plainly designed to be a naked test of obedience, absolute and without limit.

(3) That the penalty of this covenant was death is distinctly stated: “In the day thou eatest thereof, dying thou shalt die.” Gen. 3:17. This denoted a most lamentable state of existence, physical and moral, and not the cessation of existence or the dissolution of the union between soul and body, because-(a) It took effect in our first parents hundreds of years before the dissolution of that union. (b) Because the Scriptures constantly describe the moral and spiritual condition into which their descendants are born, and from which they are delivered by Christ, as a state of death. (Rev. 3:1; Eph. 2:1-5; 5:14; John 5:24.) This death is a condition of increasing sin and misery, resulting from excision from the only source of life. It involves the entire person, soul and body, and continues as long as the cause continues.</p></blockquote>

<div class="meta"><span class="t"><a href="../topics/the-covenant-of-works.html">The Covenant of Works</a></span></div>
<div class="actions"><button class="copy" data-copy="“In the case of men and angels, God has been pleased to promise this transcendent benefit upon certain conditions; which conditional promise is called a covenant. There can be no doubt that this amazing gift of God’s personal love and life-giving society had been offered to angels, and at the beginning was offered to the first human pair, upon conditions. Some object that the conditional promise made to Adam in the garden is not explicitly called a covenant, and that it does not possess all the essential elements of a covenant, since it was a constitution sovereignly ordained by the Creator without consulting the will of the creature.

It is a sufficient answer to these objections, – (1) That although Adam’s will was not consulted, yet his will was unquestionably cordially consenting to this divine constitution and all the terms thereof, and hence the transaction did embrace all the elements of a covenant. (2) That instances of analogous transactions between God and men are expressly styled covenants in the Bible. If God’s transactions with Noah (Gen. 9:11,12) and with Abraham (Gen. 17:1-21) were covenants, then was his transaction with Adam in the garden a covenant.

The analysis of a covenant always gives the following elements: (a) Its parties. (b) Its promise. (c) Its conditions. (d) Its penalty. As to its parties, our Standards teach –

In the first covenant that concerned mankind God dealt with Adam as the representative of all his descendants. The parties, therefore, are God and Adam, the latter representing the human race. That Adam did so act as the representative of his descendants, in such a sense that they were equally interested with himself in all the merit or the demerit, the reward or the penalty, attaching to his action during the period of probation, has already been proved to be the doctrine both of our Standards and of Scripture. (Ch. 6., ss. 3, 4.) As to the further nature of this covenant, our Standards teach – The promise of it was life, the condition of it perfect obedience, and the penalty of it death. (L. Cat., q. 20; S. Cat., q. 12.)

This covenant is variously styled, from one or other of these several elements. Thus, it is called the “covenant of works,” because perfect obedience was its condition, and to distinguish it from the covenant of grace, which rests our salvation on a different basis altogether. It is also called the “covenant of life,” because life was promised on condition of the obedience. It is also called a “legal covenant,” because it demanded the literal fulfilment of the claims of the moral law as the condition of God’s favour. This covenant was also in its essence a covenant of grace, in that it graciously promised life in the society of God as the freely-granted reward of an obedience already unconditionally due. Nevertheless it was a covenant of works and of law with respect to its demands and conditions.

(1) That the promise of the covenant was life is proved – (a) From the nature of the penalty, which is recorded in terms. If disobedience was linked to death, obedience must have been linked to life. (b) It is taught expressly in many passages of Scripture. Paul says, Rom. 10:5, “Moses describes the righteousness which is of the law, That the man which does those things shall live by them.” (Matt. 19:16,17; Gal. 3:12; Lev. 18:5; Neh. 9:29.)

That the life promised was not mere continuance of existence is plain – (a) From the fact that the death threatened was not the mere extinction of existence. Adam experienced that death the very day he ate the forbidden fruit. The death threatened was exclusion from the communion of God. The life promised, therefore, must consist in the divine fellowship and the excellence and happiness thence resulting. (b) From the fact that mere existence was not in jeopardy. It is the character, not the fact, of continued existence which God suspended upon obedience. (c) Because the terms “life” and “death” are used in the Scriptures constantly to define two opposite spiritual conditions, which depend upon the relation of the soul to God. (John 5:24; 6:4; Rom. 6:23; 11:15; Eph. 2:1-3; 5:14; Rev. 3:1.)

(2) That the condition of the covenant was perfect obedience is plain from the fact – (a) That the divine law can demand no less. It is of the essence of all that is right that it is obligatory. James says, that “whosoever shall keep the whole law, and yet offend in one point, he is guilty of all.” James 2:10; Gal. 3:10; Deut. 27:26. (b) That the command not to eat of the fruit of the tree of the knowledge of good and evil, relating to a thing indifferent in itself, was plainly designed to be a naked test of obedience, absolute and without limit.

(3) That the penalty of this covenant was death is distinctly stated: “In the day thou eatest thereof, dying thou shalt die.” Gen. 3:17. This denoted a most lamentable state of existence, physical and moral, and not the cessation of existence or the dissolution of the union between soul and body, because-(a) It took effect in our first parents hundreds of years before the dissolution of that union. (b) Because the Scriptures constantly describe the moral and spiritual condition into which their descendants are born, and from which they are delivered by Christ, as a state of death. (Rev. 3:1; Eph. 2:1-5; 5:14; John 5:24.) This death is a condition of increasing sin and misery, resulting from excision from the only source of life. It involves the entire person, soul and body, and continues as long as the cause continues.”

— Archibald Alexander Hodge, A Commentary on the Confession of Faith, ed. William H. Goold (British edn, London: T. Nelson and Sons, 1870), pp 121-24.">Copy</button><a class="share" href="https://x.com/intent/post?text=%E2%80%9CIn+the+case+of+men+and+angels%2C+God+has+been+pleased+to+promise+this+transcendent+benefit+upon+certain+conditions%3B+which+conditional+promise+is+called+a+covenant.+There+can+be+no+doubt+that+this+amazing+gift+of+God%E2%80%99s+personal+love+and+life-giving+society+had+been+offered+to+angels%2C+and+at+the+beginning+was+offered+to+the+first+human+pair%2C+upon+conditions.+Some+object+that+the+conditional+promise+made+to+Adam+in+the+garden+is+not+explicitly+called+a+covenant%2C+and+that+it+does+not+possess+all+the+essential+elements+of+a+covenant%2C+since+it+was+a+constitution+sovereignly+ordained+by+the+Creator+without+consulting+the+will+of+the+creature.%0A%0AIt+is+a+sufficient+answer+to+these+objections%2C+%E2%80%93+%281%29+That+although+Adam%E2%80%99s+will+was+not+consulted%2C+yet+his+will+was+unquestionably+cordially+consenting+to+this+divine+constitution+and+all+the+terms+thereof%2C+and+hence+the+transaction+did+embrace+all+the+elements+of+a+covenant.+%282%29+That+instances+of+analogous+transactions+between+God+and+men+are+expressly+styled+covenants+in+the+Bible.+If+God%E2%80%99s+transactions+with+Noah+%28Gen.+9%3A11%2C12%29+and+with+Abraham+%28Gen.+17%3A1-21%29+were+covenants%2C+then+was+his+transaction+with+Adam+in+the+garden+a+covenant.%0A%0AThe+analysis+of+a+covenant+always+gives+the+following+elements%3A+%28a%29+Its+parties.+%28b%29+Its+promise.+%28c%29+Its+conditions.+%28d%29+Its+penalty.+As+to+its+parties%2C+our+Standards+teach+%E2%80%93%0A%0AIn+the+first+covenant+that+concerned+mankind+God+dealt+with+Adam+as+the+representative+of+all+his+descendants.+The+parties%2C+therefore%2C+are+God+and+Adam%2C+the+latter+representing+the+human+race.+That+Adam+did+so+act+as+the+representative+of+his+descendants%2C+in+such+a+sense+that+they+were+equally+interested+with+himself+in+all+the+merit+or+the+demerit%2C+the+reward+or+the+penalty%2C+attaching+to+his+action+during+the+period+of+probation%2C+has+already+been+proved+to+be+the+doctrine+both+of+our+Standards+and+of+Scripture.+%28Ch.+6.%2C+ss.+3%2C+4.%29+As+to+the+further+nature+of+this+covenant%2C+our+Standards+teach+%E2%80%93+The+promise+of+it+was+life%2C+the+condition+of+it+perfect+obedience%2C+and+the+penalty+of+it+death.+%28L.+Cat.%2C+q.+20%3B+S.+Cat.%2C+q.+12.%29%0A%0AThis+covenant+is+variously+styled%2C+from+one+or+other+of+these+several+elements.+Thus%2C+it+is+called+the+%E2%80%9Ccovenant+of+works%2C%E2%80%9D+because+perfect+obedience+was+its+condition%2C+and+to+distinguish+it+from+the+covenant+of+grace%2C+which+rests+our+salvation+on+a+different+basis+altogether.+It+is+also+called+the+%E2%80%9Ccovenant+of+life%2C%E2%80%9D+because+life+was+promised+on+condition+of+the+obedience.+It+is+also+called+a+%E2%80%9Clegal+covenant%2C%E2%80%9D+because+it+demanded+the+literal+fulfilment+of+the+claims+of+the+moral+law+as+the+condition+of+God%E2%80%99s+favour.+This+covenant+was+also+in+its+essence+a+covenant+of+grace%2C+in+that+it+graciously+promised+life+in+the+society+of+God+as+the+freely-granted+reward+of+an+obedience+already+unconditionally+due.+Nevertheless+it+was+a+covenant+of+works+and+of+law+with+respect+to+its+demands+and+conditions.%0A%0A%281%29+That+the+promise+of+the+covenant+was+life+is+proved+%E2%80%93+%28a%29+From+the+nature+of+the+penalty%2C+which+is+recorded+in+terms.+If+disobedience+was+linked+to+death%2C+obedience+must+have+been+linked+to+life.+%28b%29+It+is+taught+expressly+in+many+passages+of+Scripture.+Paul+says%2C+Rom.+10%3A5%2C+%E2%80%9CMoses+describes+the+righteousness+which+is+of+the+law%2C+That+the+man+which+does+those+things+shall+live+by+them.%E2%80%9D+%28Matt.+19%3A16%2C17%3B+Gal.+3%3A12%3B+Lev.+18%3A5%3B+Neh.+9%3A29.%29%0A%0AThat+the+life+promised+was+not+mere+continuance+of+existence+is+plain+%E2%80%93+%28a%29+From+the+fact+that+the+death+threatened+was+not+the+mere+extinction+of+existence.+Adam+experienced+that+death+the+very+day+he+ate+the+forbidden+fruit.+The+death+threatened+was+exclusion+from+the+communion+of+God.+The+life+promised%2C+therefore%2C+must+consist+in+the+divine+fellowship+and+the+excellence+and+happiness+thence+resulting.+%28b%29+From+the+fact+that+mere+existence+was+not+in+jeopardy.+It+is+the+character%2C+not+the+fact%2C+of+continued+existence+which+God+suspended+upon+obedience.+%28c%29+Because+the+terms+%E2%80%9Clife%E2%80%9D+and+%E2%80%9Cdeath%E2%80%9D+are+used+in+the+Scriptures+constantly+to+define+two+opposite+spiritual+conditions%2C+which+depend+upon+the+relation+of+the+soul+to+God.+%28John+5%3A24%3B+6%3A4%3B+Rom.+6%3A23%3B+11%3A15%3B+Eph.+2%3A1-3%3B+5%3A14%3B+Rev.+3%3A1.%29%0A%0A%282%29+That+the+condition+of+the+covenant+was+perfect+obedience+is+plain+from+the+fact+%E2%80%93+%28a%29+That+the+divine+law+can+demand+no+less.+It+is+of+the+essence+of+all+that+is+right+that+it+is+obligatory.+James+says%2C+that+%E2%80%9Cwhosoever+shall+keep+the+whole+law%2C+and+yet+offend+in+one+point%2C+he+is+guilty+of+all.%E2%80%9D+James+2%3A10%3B+Gal.+3%3A10%3B+Deut.+27%3A26.+%28b%29+That+the+command+not+to+eat+of+the+fruit+of+the+tree+of+the+knowledge+of+good+and+evil%2C+relating+to+a+thing+indifferent+in+itself%2C+was+plainly+designed+to+be+a+naked+test+of+obedience%2C+absolute+and+without+limit.%0A%0A%283%29+That+the+penalty+of+this+covenant+was+death+is+distinctly+stated%3A+%E2%80%9CIn+the+day+thou+eatest+thereof%2C+dying+thou+shalt+die.%E2%80%9D+Gen.+3%3A17.+This+denoted+a+most+lamentable+state+of+existence%2C+physical+and+moral%2C+and+not+the+cessation+of+existence+or+the+dissolution+of+the+union+between+soul+and+body%2C+because-%28a%29+It+took+effect+in+our+first+parents+hundreds+of+years+before+the+dissolution+of+that+union.+%28b%29+Because+the+Scriptures+constantly+describe+the+moral+and+spiritual+condition+into+which+their+descendants+are+born%2C+and+from+which+they+are+delivered+by+Christ%2C+as+a+state+of+death.+%28Rev.+3%3A1%3B+Eph.+2%3A1-5%3B+5%3A14%3B+John+5%3A24.%29+This+death+is+a+condition+of+increasing+sin+and+misery%2C+resulting+from+excision+from+the+only+source+of+life.+It+involves+the+entire+person%2C+soul+and+body%2C+and+continues+as+long+as+the+cause+continues.%E2%80%9D%0A%0A%E2%80%94+Archibald+Alexander+Hodge%2C+A+Commentary+on+the+Confession+of+Faith%2C+ed.+William+H.+Goold+%28British+edn%2C+London%3A+T.+Nelson+and+Sons%2C+1870%29%2C+pp+121-24.&amp;url=https%3A%2F%2F5solasquotes.github.io%2Fquote%2Fc9c57b7ed7.html&amp;via=5Solas" target="_blank" rel="noopener">Share on X</a><a class="perma" href="../quote/c9c57b7ed7.html">Permalink</a><a class="src" href="https://reformedcovenanter.wordpress.com/2022/08/13/a-a-hodge-on-the-westminster-doctrine-of-the-covenant-of-works/" rel="noopener" target="_blank">Read it online · Reformed Covenanter</a></div>

<blockquote><p>Everyone will have to agree that for Adam, perfect keeping of the law for a fixed period of time was the means to acquire eternal beatitude that cannot be lost. When the covenant of works was broken, God could have rescinded this promise. He was no longer bound to honor it. Nevertheless, He allowed the promise and the condition to stand and repeatedly be published anew, especially by the proclamation of the Sinaitic law (Lev 18:5, “The one who does them will live by them”; cf. Rom 10:5, “For Moses describes the righteousness that is by the law,” etc.; Gal 3:12). Fulfillment of this condition from man’s side was no longer conceivable; thus the repetition must have had a different significance. This significance can only be that after the fall God gave His covenant of grace, in which the same demand and promise are fulfilled in the Mediator.</p></blockquote>

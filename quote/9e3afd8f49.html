<main class="wrap"><figure class="quote" id="q-9e3afd8f49" data-kw="">
<blockquote><p>Obj. 9. That is not to be taught in the church which increases sin. The law increases sin. (Rom. 7:8.) Therefore, it is not to be taught. Ans. There is here a fallacy of accident in the minor proposition. The law increases sin by an accident, or on account of the corruption of man, and that in two ways. First, because the nature of man is so depraved and alienated from God, that men do not perform what they know to be pleasing to God; and, on the other hand, what they know to be prohibited by God, that they desire, and do with the greatest willingness. Secondly, because it works wrath, when men fret and murmur against God, hate and turn away from him, and rush into despair according as the law reveals to them a knowledge of their sins, and the punishment which they deserve in consequence thereof. The law in itself produces righteousness, conformity with God, love to God, etc. The law also in itself increases sin, if we understand the word increase in a different sense, viz., that it shows unto us, and brings it to pass that we acknowledge the greatness and magnitude of our sins; but not that it so increases sin as that which in itself is small is made greater and more aggravated. There are, therefore, four terms in this syllogism, in consequence of the ambiguity of the word increase in the minor proposition.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/zacharias-ursinus.html">Zacharias Ursinus</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Commentary of Dr. Zacharias Ursinus on the Heidelberg Catechism</cite>, trans. George W. Williard (Cincinnati: Elm Street Printing Company, 1888), 616–18.</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/the-law-of-god.html">The Law of God</a></span></div>

<blockquote><p>Do you see how he makes this the distinction between law and gospel: that the former attributes righteousness to works, the latter bestows free righteousness apart from the help of works? This is an important passage, and one that can extricate us from many difficulties if we understand that righteousness which is given us through the gospel has been freed of all conditions of the law. (Calvin commenting on Romans 10:9)</p></blockquote>

<blockquote><p>Whether there is a natural law, and how it differs from the moral law. The former we affirm; the latter we distinguish. The moral law remains perpetual; the ceremonial is abrogated in Christ as to obligation, having served as types; the judicial binds as to general equity. From the law comes knowledge of sin, and justification by the law is impossible to fallen man.</p></blockquote>

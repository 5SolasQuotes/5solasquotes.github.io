<main class="wrap"><figure class="quote" id="q-40ee2b704f" data-kw="">
<blockquote><p>From this miraculous creation of the body of Christ, by the immediate power of the Holy Ghost, did it become a meet habitation for his holy soul, every way ready and complying with all actings of grace and virtue… But the body of Christ being formed pure and exact by the Holy Ghost, there was no disposition or tendency in his constitution to the least deviation from perfect holiness in any kind.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/john-owen.html">John Owen</a></span><span class="wk"><span class="lbl">Work:</span> <cite>A Discourse concerning the Holy Spirit, bk. 2 in Works (Philadelphia: Protestant Episcopal Book Soceity, 1862), vol. 3</cite>, p. 167</span></figcaption>

</figure><figure class="quote" id="q-4069efb0be" data-kw="">
<blockquote><p>I might trace a little the time of faith’s first infusion and first operation in the heart, which is undoubtedly at the new birth, when ever it is. But how to prescribe, and when precisely to determine that, in the soul of a believer is more difficult than to state the quickening or animation of an embryo in the womb of her that is with child, or for any naturallist so set the moment of the first separation of night from day at the initiating crepusculum or ascent of the first atom of the morning rays of the sun’s body, or the primogenial fermentation of the vegetative soul in the seed-corn in the earth… It’s much more difficult to set down the first punctual workings of the Spirit in our hearts.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/samuel-lee.html">Samuel Lee</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Joy of Faith, or, a Treatise Opening the True Nature of Faith… (Boston, 1687), pt. 2, ch. 1, section 6, p. 93 Lee, M. A. (d. 1691) was “sometime Fellow of Wadham, Colledge, Oxford”.</cite></span></figcaption>
<div class="meta"><span class="t"><a href="../topics/civil-government-and-society/life-birth-and-medical-ethics.html">Life, Birth and Medical Ethics</a></span></div>

</figure><figure class="quote" id="q-0da453f67b" data-kw="">
<blockquote><p>what do we make of Christ’s statement that ‘there are eunuchs who have made themselves eunuchs for the kingdom of heaven’s sake…’ (Mt. 19:12)?… To say that it is a sin to turn down an opportunity to receive the blessing of children is cherry picking Scriptures… If trying to get every blessing of children that we possibly can is a mandate, then shouldn’t we be marrying our girls as soon as puberty hits? Why hold off?</p></blockquote>

<blockquote><p>1. That the government of the Church is not Monarchical, no Monarch save Christ alone is Head and King of the Church, though every Monarch that’s truly Christian be a King in the Church; For it is one thing to be a King in the Church, and another to be King over the Church.

2. Every King as a member of the Church, is in an Ecclesiastical sense subject to the discipline of the Church; for such a kind of subjection will well consist with his Civil Sovereignty, because it is not a Civil Subjection. Judicious [John] Camero[n] was a man very tender of pitching upon any conclusion which might be prejudicial unto Kingly power, and he useth an excellent similitude to illustrate this point: As it is in the cure of the body, so is it in the cure of the Soul; now a King for the Cure of his body, must patiently yield himself to his College of Physicians, for though he rule over them as a King, yet he must be ruled by them as a patient. In like manner a wise King will (and every King ought to) be persuaded by the College Ecclesiastical in point of discipline to obey the Rules and orders of Jesus Christ; for the King in this point doth not obey the College, but Christ himself.

3. It is well known that Kings and Emperors have been subjected to Episcopal, and too often enslaved by Prelatical power. Who knows not that the Bishop [Ambrose] of Milan would not admit the Emperor to the Communion till he had repented of that outrage, and bloodshed at Thessalonica, which was occasioned by the Emperor’s passionate Command? It is generally confessed, that Ambrose did well in rejecting the Emperor from the Communion, and that the Emperor was no less an Emperor, and a far better man by submitting to a Minister of the Gospel, preaching, and administering some part of the discipline of Jesus Christ.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/francis-cheynell.html">Francis Cheynell</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Sion’s memento, and Gods alarum. In a sermon at Westminster, before the Honourable House of Commons, on the 31. of May 1643. the solemn day of their monthly fast</cite>, (London: Samuel Gellibrand, 1643), pp 30-31.</span></figcaption>

<blockquote><p>1st Conclusion: Fire and sword, or war, or the coactive power of a magistrate is not God’s way of planting the Gospel in a heathen nation which never heard of the gospel before:

1. Because the apostles were commanded by teaching the gospel to all nations, Mt. 28:19-20; Mk. 16:15; Acts 7:8; and not by war to spread the gospel;

2. Because Christ’s Kingdom is not of this world, for then his servants would fight for Him (Jn. 18:36), nor are the weapons of our warfare carnal (2 Cor. 10:4), nor is Christ’s sword any other thing than the Word of God (Rev. 19:15; Gal. 6:17). And in this meaning, and with relation to the internal acts of sound believing, have the learned taught us that, religio suaderi potest, cogi non potest [‘Religion can be persuaded; it cannot be forced.’]. If these be the Constitutions of Clement, let it go for a truth in this sense, that: ‘God has given liberty of will to men, not punishing them with temporal death, but calls them to give an account of their doings in the life to come.’ …and Athanasius meant with us, when he cites that, ‘If any will come after me, let him take up his cross,’ to prove that the will cannot be compelled; and that of Lactantius is approved by all: Defendenda tamen religio est, non occidendo, sed moriendo, non saevitia, sed sapientia, non scelere, sed fide; illa enim malorum sunt, haec bonorum; et necesse est bonum in religione versari, non malum: Nam si sanguine, si tormentis, si malo religionem defendere velis, jam non defendetur illa, sed polluetur, et violabitur. Nihil est tam voluntarium quam religio, in qua si animus sacrificantis est eversus, jam sublata, jam nulla est. (Institutes, bk. 5, ch. 19) [“Religion, however, must be defended not by killing but by dying, not by cruelty but by wisdom, not by crime but by faith; for the former belong to the wicked, the latter to the good. And it is necessary that good, not evil, should be found in religion. For if you wish to defend religion by blood, by tortures, or by evil, it will no longer be defended but polluted and profaned. Nothing is so voluntary as religion; for if the heart of the worshiper is overturned, it is already destroyed—it no longer exists.”] All which tends to this, that religion is like free-will, and free-will like a virgin which cannot be ravished. Let that of Tertullian stand, Lex nostra non se vindicat ultore gladio [‘Our Law does not avenge itself with the avenging sword.’]. Procopius says that Justinian was blamed, because he compelled the Samaritans to embrace the Christian faith. (Procopius, in Arca. Histor.)</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/samuel-rutherford.html">Samuel Rutherford</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Due Right of Presbyteries, ‘Acts 15, A Pattern of a Juridicial Synod’</cite>, (London: 1644), pt. 2, ch. 6, p. 353</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/civil-government-and-society/church-and-state.html">Civil Government and Society: Church and State</a></span></div>

<blockquote><p>How absurd it would be to grasp at money and throw away health; and to be lavish of the cleansing of the body, but economical over the cleansing of the soul; and to seek for freedom from earthly slavery, but not to care about heavenly freedom; and to make every effort to be splendidly housed and dressed, but to have never a thought how you yourself may become really very precious; and to be zealous to do good to others, without any desire to do good to yourself. And if good could be bought, you would spare no money; but if mercy is freely at your feet, you despise it for its cheapness.</p></blockquote>

<blockquote><p>1. Liberty is that natural power which man has of his own person, whence a free man is said to be suae potestatis, ‘in his own power’, and it is defined in the law to be a natural faculty to do that which every man pleases, unless he be hindered by law or force. … 5. Though liberty be the most precious right, yet it is not absolute, but limited; First, by the Will of God, and our obediential obligations to Him, and to men by his ordinance; and so though man has power of his own person, yet has he no power of his own life, or his members, to dispose of them at his pleasure, either by taking away of his life or amputation, or hurting of any member by himself, or by giving power to any other so to do, unless it be necessary for preserving the whole, but he is naturally obliged to God to maintain his life: So likewise men may be restrained, or constrained by others, without encroachment upon the law of liberty, in the pursuance of other obediential obligations; as a husband has power to restrain his wife, from her liberty of going where she will, and may keep her within the bounds of conjugal society; so may parents restrain their children, and also constrain them to the performance of moral duties, and that without any engagement or law; we may also without any injury, restrain a furious person, or one who is inferring violence to himself, in his life or limbs, because this is not against any act of his lawful liberty, and is done as a duty in us of love and mercy: But in matters of utility and profit, where the natural liberty is not hemmed in with an obligation, there, unless by his own delinquence or consent, man cannot justly be restrained, much less constrained upon pretense of his utility or profit; for liberty, as far preferable to profit, and in the matter of utility, every man is left to his own choice, and cannot without injury to God and Man, be hindered to do what he pleases, or be compelled to do what he pleases not, in things wherein he is free, 6. Liberty may be diminished or taken away by our delinquence in the way of punishment, for seeing it is a right in our own power; as goods and debts may be forfaulted by our delinquence, so may our liberty, in whole or in part. 7. Thirdly, our engagements do commonly import a diminution of our personal liberty, but much more, of that natural liberty of things without us; whence it is that the law allows personal execution or restraint, and incarceration of the debitor’s person, until he do all the deeds that are in his power for the satisfaction of his Creditor. …

9. Fifthly, liberty is wholly taken off by bondage, slavery or servitude, which is diametrically opposite to liberty; for as liberty is that power by which men are sui juris [in his own power], so by servitude they became alieni juris, ‘in the power of another’…

10. Bondage was introduced by the law of nations, and it is among the positive laws of nations, settled by common consuetude [custom], and it took first place in these who were taken in war, who being under the power of their enemies’ sword, did lose their liberty in lieu [in place] of their life [instead of being killed]; such also were these who sold their liberty and gave it up, and were content to be perpetual slaves, as were the Jewish bondmen, whose ears were pierced with an aul [Ex. 21], as the solemnity of their perpetual and willing servitude, the offspring of servants remained in their servile condition…

11. Bondage, though contrair to the nature of liberty, yet it is lawful; liberty being a right alienable, and in our disposal, so that the natural law constitutes us free, but puts no necessity on us, so to continue; and therefore servitude is both approven in the Old Testament; and in the New, it is cleared against that obvious objection, that being made free by Christ, we should not become the servants of men, to which the Apostle answers, ‘Art thou called, being a servant (or slave)? continue so, for nevertheless thou art Christ’s freeman’ [1 Cor. 7]: But yet Christian lenity and mercy, has almost taken away bondage, except amongst the Spaniards, Portugals [who were Romanist] and other Christian nations bordering upon the Turks [Muslims], where, because the Turks do extremely exercise slavery, especially upon Christians, their neighbors do the like, that they may have slaves to exchange with slaves: little of slavery remains elsewhere among Christians, except the ascriptitii [naturalized foreigners], who are not absolutely slaves… but in Scotland there is no such thing.</p></blockquote>

<blockquote><p>From the Council Registers we see that the plague made its appearance at Geneva in 1542, and that during several years it made great ravages in the town and throughout the whole territory of Savoy. The number of sick was immense. It was almost certain death to visit them. Three ministers offered spontaneously to discharge that duty: Calvin, Sebastian Castalio, and Blanchet. Castalio, who was the first person designated by lot, appears to have declined that perilous honour. Banchet generously made the sacrifice of his life; and the urgent solicitations of the Seigneury of Geneva, who were afraid to expose the valuable life of the Reformer, could alone determine Calvin to desist from undertaking the charge which he bad himself solicited.</p></blockquote>

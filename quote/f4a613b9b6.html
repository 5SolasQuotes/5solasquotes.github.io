<main class="wrap"><figure class="quote" id="q-f4a613b9b6" data-kw="">
<blockquote><p>Thus good works please God, and are not without fruit to their authors, since, by way of recompense, they obtain more ample blessings from God, not because they so deserve, but because the divine benignity is pleased of itself to set this value upon them. Such, however is our malignity, that not contented with this liberality on the part of God, which bestows rewards on works that do not at all deserve them, we with profane ambition maintain that that which is entirely due to the divine munificence is paid to the merit of works.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/john-calvin.html">John Calvin</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Institutes of the Christian Religion</cite>, 3.15.3</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/good-works/merit-and-reward.html">Merit and Reward</a> › <a href="../topics/good-works/merit-and-reward/reward-of-grace-against-rome.html">Reward of grace (against Rome)</a></span><span class="t"><a href="../topics/good-works/merit-and-reward.html">Merit and Reward</a></span></div>

</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-fb00224ded" data-kw="">
<blockquote><p>No one can merit the initial grace which is at the origin of conversion. Moved by the Holy Spirit, we can merit for ourselves and for others all the graces needed to attain eternal life, as well as necessary temporal goods.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/catholic-church.html">Catholic Church</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Catechism of the Catholic Church</cite>, §2027</span></figcaption>

</figure><figure class="quote" id="q-9713d497d0" data-kw="">
<blockquote><p>Nor ought it to be doubted that condign merit can vary in these three ways. For if some work were much inferior to the reward promised by agreement—as if the lord of a vineyard hired laborers and promised as wages, not a denarius a day, but a hundred gold pieces—such merit would be ex condigno by reason of the pact, not by reason of the work. Conversely, if the work were really equal to the reward, or perhaps even greater, but no agreement had intervened, then if such merit ought to be called ex condigno, it would have to be called ex condigno by reason of the work, not by reason of the pact. … Finally, if a pact both intervenes and the work is truly equal to the reward, as when laborers are hired for the vineyard for a denarius a day according to the Gospel, that merit will be ex condigno by reason of the work and by reason of the pact.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/robert-bellarmine.html">Robert Bellarmine</a></span><span class="wk"><span class="lbl">Work:</span> <cite>De Justificatione</cite>, 5.17 (translated from the Latin)</span></figcaption>

</figure><figure class="quote" id="q-a702a69ba8" data-kw="">
<blockquote><p>Since the initiative belongs to God in the order of grace, no one can merit the initial grace of forgiveness and justification, at the beginning of conversion. Moved by the Holy Spirit and by charity, we can then merit for ourselves and for others the graces needed for our sanctification, for the increase of grace and charity, and for the attainment of eternal life. Even temporal goods like health and friendship can be merited in accordance with God&#x27;s wisdom.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/catholic-church.html">Catholic Church</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Catechism of the Catholic Church</cite>, §2010</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/good-works/merit-and-reward.html">Merit and Reward</a></span><span class="t"><a href="../topics/good-works/merit-and-reward.html">Merit and Reward</a> › <a href="../topics/good-works/merit-and-reward/merit-of-condignity-and-congruity.html">Merit of condignity and congruity</a></span><span class="t"><a href="../topics/rome/justification.html">Rome: Justification</a> › <a href="../topics/rome/justification/merit.html">Merit</a></span></div>

</figure><figure class="quote" id="q-52317ab2c8" data-kw="">
<blockquote><p>It is true that it is a doctrine which well deserves to be embraced, that God cannot be a righteous Judge to save us, unless he have been previously declared to be in the highest degree a merciful Father; that there will be no righteousness in us but that which he has placed there; and that he cannot reward us but by crowning his gifts.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/john-calvin.html">John Calvin</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Sermons on 2 Timothy</cite>, Sermon on 2 Timothy 4:8</span></figcaption>

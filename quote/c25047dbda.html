</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-4b7c17ab77" data-kw="merit">
<blockquote><p>The natural covenant is not so called because it conferred nothing above nature and condition (which man had from creation), but because it depended on the powers of nature and the obedience which according to them he ought to render. Nor, if a proportion is not granted between the prescribed duty and the blessing of heavenly life, does it follow that such a promise cannot have a place. It is gratuitously and falsely supposed that the promises of God are regulated according to the proportion of our merit. On the contrary, they depend upon God’s will and goodness.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/francis-turretin.html">Francis Turretin</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Institutes of Elenctic Theology</cite>, 8.6.10</span></figcaption>

</figure><figure class="quote" id="q-94da56e813" data-kw="abrogation">
<blockquote><p>When God expelled man from paradise “lest man put forth his hand, and take also of the tree of life, and eat, and live for ever” (Gen. 3:22), these words denote the cause of his ejection from paradise on account of sin (by which, as by his own fault, he had cut himself off from that life, which was the thing signified). Thus he ought no longer to have any right to its sacrament. The covenant of works being broken by man’s disobedience, its promissory and sacramental seals no longer belonged to him as a way of life.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/francis-turretin.html">Francis Turretin</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Institutes of Elenctic Theology</cite>, 8.5.5</span></figcaption>

</figure><figure class="quote" id="q-5ce83c846f" data-kw="federal head">
<blockquote><p>Man must be viewed under a double relation—either as just or as the first. In the former respect, he had the power to perform the prescribed duty. In the latter, Adam in a certain manner included the whole human race, which was to spring from him, both as the root and the seminal principle from whom the whole human race was to descend; and as a public person and representative head, because he represented all men who were to spring naturally from him. Hence that covenant pertained not only to Adam, but to all his posterity in him.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/francis-turretin.html">Francis Turretin</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Institutes of Elenctic Theology</cite>, 8.3.11</span></figcaption>

</figure><figure class="quote" id="q-242b7b10a2" data-kw="natural symbolic law">
<blockquote><p>The duty was partly general, partly special (according to the twofold law given to him: the moral or natural and the symbolic). The general was the knowledge and worship of God, justice towards his neighbor and every kind of holiness; the special was abstinence from the forbidden fruit (in which obedience to the whole law was contained as in a compendium and specimen). The former was founded on the law of nature not written in a book, but engraven and stamped upon the heart of man; the latter upon a symbolic and positive law, added to the natural for the trial of his obedience.</p></blockquote>

<main class="wrap"><figure class="quote" id="q-c25047dbda" data-kw="sabbath">
<blockquote><p>From the state of integrity, we proceed to the state of sin into which man (by his voluntary defection from the highest good) precipitated himself and became, at the same time, wicked and miserable.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/francis-turretin.html">Francis Turretin</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Institutes of Elenctic Theology</cite>, 9.1</span></figcaption>

</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-7d52868f27" data-kw="">
<blockquote><p>Every sin invades the rights of God and strips him of one or other of his perfections. It is such a vilifying of God as if he were not God; as if he were not the supreme Creator and benefactor of the world; as if we had not our being from him; as if the air we breathed in, the food we lived by were our own by right of supremacy, not of donation.… That affection that excites a man to break his law would excite him to annihilate his being if it were in his power. A man in every sin aims to set up his own will as his rule and his own glory as the end of his actions, against the will and glory of God; and could a sinner attain his end, God would be destroyed: God cannot outlive his will and his glory.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/stephen-charnock.html">Stephen Charnock</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Existence and Attributes of God</cite>, Discourse 2, On Practical Atheism (every sin invades God’s rights)</span></figcaption>

</figure><figure class="quote" id="q-df0586260e" data-kw="">
<blockquote><p>This very thing cannot be conceived, how something by way of an internal habit could be the cause of sin and not be sin. An internal cause inclining to act well is good.</p></blockquote>

</figure><figure class="quote" id="q-7b7ba306fb" data-kw="">
<blockquote><p>This is one part of atheism and self-idolatry, to magnify ourselves, with the forgetfulness and to the injury of our Creator.… In ascribing the glory of what we do or have to ourselves, to our own wisdom, power, virtue, etc.… He regards Babylon as his heaven and himself as his idol, as if he were all and God nothing.… So much as we sacrifice to our own credit, to the dexterity of our hands, or the sagacity of our wit, we detract from God.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/stephen-charnock.html">Stephen Charnock</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Existence and Attributes of God</cite>, Discourse 2, On Practical Atheism (self-idolatry)</span></figcaption>

</figure><figure class="quote" id="q-8831222c6d" data-kw="">

<main class="wrap"><figure class="quote" id="q-24eb1ab06b" data-kw="">
<blockquote><p>THE Elders or Presbyters in Office, Elders of the Church that Rule well, or discharge their Presidency for Rule in due manner, are worthy, or ought to be reputed worthy of double honour; especially those of them who labour, or are engaged in the great labour and travail of the Word and Doctrine.

AND some things may be observed in general concerning these words.

1. THIS Testimony relates directly unto the Rules and Principles before laid down, directing unto the practice of them. According to the Analogy of these Principles, these Words are to be interpreted. And unless they are overthrown, it is to no purpose to put in exceptions against the sense of this or that Word; the Interpretation of them is to be suited unto the Analogy of the things which they relate unto. If we consider not what is spoken here in consent with other Scriptures treating of the same matter, we depart from all sober Rules of Interpretation.

2. ON this supposition, the Words of the Text have a plain and obvious signification, which at first view presents it self unto the common sense and understanding of all Men. And where there is nothing contrary unto any other Divine Testimony, or Evident Reason, such a sense is constantly to be embraced. There is nothing here of any Spiritual Mystery; but only a direction concerning outward Order in the Church. In such, cases the literal sense of the Words rationally apprehended, is all that we are concerned in. But on the first Proposal of this Text, That the Elders that Rule well, are worthy of double honour, especially those who labour in the Word and Doctrine; a rational Man who is unprejudiced, who never heard of the Controversy about Ruling Elders, can hardly avoid an Apprehension that there are two sort of Elders, some that labour in the Word and Doctrine, and some who do not so do.

The Truth is, it was Interest and Prejudice that first caused some learned Men to strain their wits to find out evasions from the evidence of this Testimony: Being so found out, some others of meaner Abilities have been entangled by them. For there is not one new Argument advanced in this cause, not one exception given in unto the sense of the place which we plead for, but what was long since coined by Papists and Prelatists, and managed with better Colours than some now are able to lay on them, who pretend unto the same judgment.

3. THIS is the substance of the Truth in the Text. There are Elders in the Church; there are or ought to be so in every Church. With these Elders the whole Rule of the Church is intrusted; all these, and only they, do Rule in it. Of these Elders there are two sorts, for a description is given of one sort distinctive from the other, and comparative with it. The First sort doth Rule, and also labour in the Word and Doctrine. That these Works are distinct and different was before declared. Yet, as distinct Works, they are not incompatible, but are committed unto the same Person.

They are so unto them, who are not Elders only, but moreover Pastors or Teachers. Unto Pastors and Teachers, as such, there belongs no Rule; although, by the institution of Christ, the Right of Rule be inseparable from their Office. For all that are rightfully called thereunto are Elders also, which gives them an Interest in Rule. They are Elders with the Addition of Pastoral or Teaching Authority. But there are Elders which are not Pastors or Teachers. For there are some who Rule well, but labour not in the Word and Doctrine; that is, who are not Pastors or Teachers.

ELDERS that Rule well, but labour not in the Word and Doctrine, are Ruling Elders only; and such are in the Text.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/john-owen.html">John Owen</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The true nature of a gospel church and its government</cite>, (London: William Marshall, 1689), pp 142-43.</span></figcaption>

<blockquote><p>VIII. Once a month we have a meeting of the magistrates, ministers, deacons and above twenty persons chosen annually by the church, as their trustees or deputies: Here the offenders must be accused, and heard, and dealt with before the case be opened in the church. And any that are justly offended with any member, may have church-justice: the magistrates’ presence being only ad melius esse [to the better well-being] and the chosen trustees or deputies being no ecclesiastical officers, nor pretending to divine institution as such: but only the fittest of the people chosen to do those things which belong to the people (who cannot all so frequently meet) and having no authoritative ruling votes.</p></blockquote>

<blockquote><p>7. That the same Lord, who has commanded us not to despise prophesying, 1 Thess. 5:19, has also commanded us to prove all things, and to hold fast that which is good, ver. 20. And no[t] to believe every spirit, but to try the spirits, whether they be of God, because many false prophets are gone forth into the world, 1 Jn. 4:1. And that whatsoever is not of faith is sin, Rom. 14:15. And that we ought not to be the servants of men, 1 Cor. 7:23. That is to do things (especially in the matters of God) for which we have no other warrant, but the mere pleasure and will of men, which the apostle Peter calls living to the lusts of men, and not to the will of God, 1 Pet. 4:2.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/james-guthrie.html">James Guthrie</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Protesters no Subverters, and presbyterie no papacie</cite>, … (1658), pp. 96-7</span></figcaption>

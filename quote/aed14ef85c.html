<main class="wrap"><figure class="quote" id="q-aed14ef85c" data-kw="">
<blockquote><p>For as with these corporal meats and drinks the body is nourished: so in Christ, thorough the believing of the Gospel, our soul is refreshed, &amp; perfectly fed unto everlasting life. Christ is the fresh fountain, whereof who so drinketh shall never thirst. Christ is that bread, which descended from heaven. He that eateth that bread, which is his flesh, shall live forever.

Christ is that wine, which maketh merry the heart of man, and quieteth the troubled conscience. Christ is that milk, which nourisheth, and feedeth us, that we may grow to a perfect man. Milk is fit for infants; water is convenient for young men; wine agreeth with old age. So in the Scriptures there is food, both for such as are simple, and weak; and also for such as are learned and strong.</p></blockquote>

</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-e1f8f9620b" data-kw="">
<blockquote><p>Thy teeth shall not do him violence, neither thy stomach contain his glorious body. Thy faith must reach up into heaven. By faith he is seen, by faith he is touched, by faith he is digested. Spiritually by faith we feed upon Christ, when we steadfastly believe that his body was broken, and his blood shed for us upon the cross; by which sacrifice, offered once for all, as sufficient for all, our sins were freely remitted, blotted out, and washed away.

This is our heavenly bread, our spiritual food. This doth strengthen our souls, and cheer our hearts. Sweeter it is unto us than honey, when we are certified by this outward sacrament of the inward grace given unto us through his death; when in him we are assured of remission of sins, and eternal life. Better food than this thy soul can never feed upon. This is the bread of everlasting life. They which truly eat it shall live by it.</p></blockquote>

<blockquote><p>Q. Doth this consecration change the bread and wine into the body and blood of Christ?

A. No: but they still continue in nature and substance bread and wine still, and are but only types and seals of Christ’s body and blood.

Q. But doth not our Saviour say of the bread, This is my body; and of the wine, This is my blood?

A. Though he do; yet it thence no more followeth, that the bread is his very real body, and the wine his blood, then that he is a material door, or vine, because he saith, I am the door, I am the vine.

Q. How is our Saviour then to be understood?

A. To speak by an usual figure, where the name of the thing signified, is given to the sign. After the same manner that in the old Testament, Circumcision is called the Covenant, and the Lamb, the Passover, because they were signs of those things.

Q. What special reasons have you against the change of these elements into the very body and blood of Christ, commonly called Transubstantiation?

A. First, then at the first institution, there must needs be two Christs, one that giveth, another that is given.

Secondly, If the bread be the very body of Christ, &amp;c. then there is no true and proportionable sign to represent the thing signified, and consequently no Sacrament.

Thirdly, the same individual body must then of necessity be in more places then one at once, which is not only against the nature of a true human body, but of a body in general also.

Fourthly, the Apostles, and Evangelists call it bread and wine after the consecration. 1. Cor. 10. 16. 26. 27. 28. Matth. 26. 29.

Fifthly, if there were any such change, it were the greatest miracle in the world, but all other miracles are such, as have been apparent to sense.

Sixthly, then the wicked as well as the godly, should receive Christ Jesus and his quickening spirit, which is never separated from him. Yea (which is horrible to consider) mice and rats may eat the true body of Christ, and drink his blood.

Q. But it is not likely, that at this time, and in this place, our Saviour would use a figurative speech, and speak obscurely, whereas he might have spoken plainly?

A. First, it is plain, that at the same time he used as figurative a speech as this. Secondly, in this institution also we must of necessity acknowledge, that he useth a figure when he saith, that the cup is the new Testament. Thirdly, there is often more light and plainness in a figure, then in a proper speech.

Q. But what may be noted out of this form of speech?

A. The near and sure conjunction of the sign, with the thing signified, which it hath in them that shall receive it worthily; in so much as they which partake of the one, receive the other also.

Q. Then it seems, that though upon the consecration, the bread and wine be not changed into the real body and blood of Christ, that yet they are present, in, with, or under the bread and wine?

A. Not corporally, substantially, or locally; for then, first, the body of Christ should be every where; which doth as much destroy the nature of a human body, as to be in many places at once. Secondly, then as in transubstantiation, the body and blood of Christ should not be a spiritual food of the soul, but bodily, such as the wicked eat of as well as the godly. Thirdly, then also (as in transubstantiation) Christ should be eaten as the Capernaites fancied, really, &amp; with the body, which our Saviour denieth. Fourthly, it should not then be true, which is said, Act. 3. 21. That the heavens shall contain him, till the time that all things be restored. Fifthly, it is the nature of that faith by which we lay hold on, and receive Christ, to seek him, and behold him, in heaven, and to feed upon him there.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/thomas-cartwright.html">Thomas Cartwright</a></span><span class="wk"><span class="lbl">Work:</span> <cite>A treatise of Christian religion. Or, the whole body and substance of divinity</cite>, (2nd edn, London: Thomas Man, 1616), pp 227-29.</span></figcaption>

<blockquote><p>23. In the words just recited, observe these four assertions of Cyril of Alexandria:

1. The flesh of Christ in the participants of the Eucharist is life-giving. (For those who approach unworthily do not partake of the flesh of Christ.)

2. This occurs not by the virtue of the flesh, as it is flesh, but by the virtue of the Deity with which this flesh is united in hypostasis. And the preservation of us and the wondrous effects related to the flesh are to be attributed to the glory of the Deity.

3. For the accomplishment of these things, the bodily presence of the flesh is neither required nor desired.

4. Christ, by the power of His Deity, accomplishes these things, being present with us through His ineffable Deity even though He has departed from us in the flesh.

24. Indeed, the power of Deity accomplishes that we can hold onto Him even when absent, by imitating faith in heaven. We partake of Him when absent by believing, as Augustine teaches. And even when absent in the flesh, He spiritually nourishes us with that same flesh, and His flesh becomes for us life-giving bread, as Cyril teaches here. For this spiritual nourishment is the operation of Deity and is not the least part of that preservation and those miraculous works, which Cyril says should be attributed not to the bodily presence of the flesh but to the glory of the Deity. Therefore, elsewhere, Cyril says the same: just as (he says) the root sends its quality to the branches, so the only-begotten Son of God, by giving the Spirit, bestows the affinity of the Father and His own nature (so to speak) on the saints connected to Him by faith and sanctity, nourishing them with piety and all kinds of virtue. He calls the Father the Farmer so that this might not seem to be the work of the Son alone, but rather a marvelous work of the entire Trinity. Therefore, He nourishes us with piety and faith through the Son in the Spirit, and the Farmer does the work, looking after and nurturing, and reducing everything to virtue, also through the Son in the Spirit. In my judgment, we understand this more correctly. Nor is this from the Father, nor that from the Son, nor both separated from the Spirit. For all things are from the Father through the Son in the Spirit. Neither will the Father be separated from cultivating us, nor will the Son be estranged from His care. Therefore, Christ holds the place of the vine, and we, hanging from it, draw the power and grace of the Spirit for our nourishment and spiritual fruit. This is what Cyril says in book 10 of the Gospel of John, chapter 13. Namely, as the Lord speaks in John, chapter 6, ‘It is the Spirit that gives life; the flesh is of no avail.’ The flesh of Christ is not life-giving from itself but by the power of the Deity dwelling corporeally within it. It is substantially life, and from itself, it gives life. He gave to the body in which He dwells the power of giving life, not by the confusion of the two natures in Christ or the operation of natural properties but by the hypostatic union of natures. So that the flesh of the Word becomes life-giving, for it is the flesh of God; and being spiritually united to this flesh, we are connected to God, and thus, being already connected to Him, we are infallibly given life: as Cyril teaches in book 4 of his Commentary on the Gospel of John, chapter 14, and the following chapters until the end of chapter 25, and in book 1, chapter 21. And the operation of Deity is so powerful that it unites us to His flesh by its consenting will, nourishes us, and allows us to draw from His fullness. Therefore, for the salutary eating of the flesh of Christ, the bodily presence of the flesh is not required with the one partaking, as we explained a little earlier from the same Cyril.

25. However, ignorantly or dishonestly, Bellarmine (in Book 2, On the Eucharist, chapter 25) abuses certain words of Cyril, attributing to them a meaning entirely alien to Cyril’s own mind, as if they favored transubstantiation and the bodily eating of the flesh of Christ. He first cites certain words from a letter of Cyril to Nestorius, intending to convey that Cyril meant nothing other than that the flesh of Christ, of which we are participants in the mysteries, is not common flesh, the mere flesh of a man or a sanctified man (as Nestorius deliriously claimed), but the proper flesh of the Word Himself. Read that letter of Cyril that contains twelve anathemas, and you will find nothing else there, not even in those very words that Bellarmine excerpts. Having discussed this at length, he promises us clearer passages from Cyril and adduces some from Cyril’s books on the Gospel of John, from which he draws three arguments.</p></blockquote>

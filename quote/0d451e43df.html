<main class="wrap"><figure class="quote" id="q-0d451e43df" data-kw="infused acquired knowledge">
<blockquote><p>Therefore we acknowledge a twofold knowledge of Christ’s human nature while on earth—infused and acquired or experimental. He received the infused by the grace of the Holy Spirit sanctifying his gifts (referred to in Is. 11:1, 2). The acquired is the actual knowledge which Christ gained both by ratiocination, by drawing conclusions from the principles of infused knowledge, and by his own experience (Heb. 4:15; 5:8).</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/francis-turretin.html">Francis Turretin</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Institutes of Elenctic Theology</cite>, 13.13.1</span></figcaption>

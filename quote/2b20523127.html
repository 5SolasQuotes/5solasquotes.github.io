<main class="wrap"><figure class="quote" id="q-2b20523127" data-kw="">
<blockquote><p>The threefold judge must be accurately distinguished here. First is the supreme and autocratic (autokratorikos), which judges by legislative and absolute authority after the manner of the highest prince, which enacts laws and from which there is no appeal. Second is the subordinate (hypēretikos) or ministerial, which interprets the laws after the manner of a public minister. Third is an idiomatic (idiōtikos) or private, which both from the laws and from their interpretation judges in the way of private discretion.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/francis-turretin.html">Francis Turretin</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Institutes of Elenctic Theology</cite>, 2.20.3</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/holy-scripture/interpretation.html">Interpretation</a> › <a href="../topics/holy-scripture/interpretation/the-interpreter-and-judge-of-controversies.html">The interpreter and judge of controversies</a></span><span class="t"><a href="../topics/holy-scripture/interpretation.html">Interpretation</a></span></div>

</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-694d9cd5ae" data-kw="">
<blockquote><p>Further, he took upon him power, rule, and authority over the Christian church, and over the Holy Scriptures, the Word of God; … They who, against God&#x27;s Word, boast of the church&#x27;s authority, are mere idiots. The pope attributes more power to the church, which is begotten and born, than to the Word, which has begotten, conceived, and borne the church.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/martin-luther.html">Martin Luther</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Table Talk</cite>, Of the Pope, CCCCLIII, p. 269</span></figcaption>

</figure><figure class="quote" id="q-d69ee4f244" data-kw="">
<blockquote><p>That the obligations to faith and obedience are personal. Every man is responsible for his religious faith and his moral conduct. He cannot transfer that responsibility to others; nor can others assume it in his stead. He must answer for himself; and if he must answer for himself, he must judge for himself. It will not avail him in the day of judgment to say that his parents or his Church taught him wrong. He should have listened to God, and obeyed Him rather than men.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/charles-hodge.html">Charles Hodge</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Systematic Theology</cite>, vol. 1, Introduction, ch. 6, §5</span></figcaption>

</figure><figure class="quote" id="q-c7614cee12" data-kw="">
<blockquote><p>There is a twofold trial of doctrine, private and public. The private trial is that by which every one settles his own faith, when he wholly acquiesces in that doctrine which he knows has come from God. … Public trial refers to the common consent and polity of the Church; for as there is danger lest fanatics should rise up, who may presumptuously boast that they are endued with the Spirit of God, it is a necessary remedy, that the faithful meet together and seek a way by which they may agree in a holy and godly manner.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/john-calvin.html">John Calvin</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Commentaries on the Catholic Epistles</cite>, 1 John 4:1</span></figcaption>

</figure><figure class="quote" id="q-4bd5742617" data-kw="">
<blockquote><p>Besides that, we are all priests, as I have said, and have all one faith, one Gospel, one Sacrament; how then should we not have the power of discerning and judging what is right or wrong in matters of faith? What becomes of St. Paul&#x27;s words, &quot;But he that is spiritual judgeth all things, yet he himself is judged of no man&quot; (1 Cor. ii. 15), and also, &quot;we having the same spirit of faith&quot;? (2 Cor. iv. 13). Why then should we not perceive as well as an unbelieving pope what agrees or disagrees with our faith?</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/martin-luther.html">Martin Luther</a></span><span class="wk"><span class="lbl">Work:</span> <cite>To the Christian Nobility of the German Nation</cite>, The Second Wall</span></figcaption>

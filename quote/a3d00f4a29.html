<main class="wrap"><figure class="quote" id="q-a3d00f4a29" data-kw="">
<blockquote><p>voluntas Dei, ‘the will of God’ … The Reformed further argue the distinction of the voluntas decreti vel beneplaciti [will of decree or good-pleasure] or voluntas decernens [decreeing will] into the categories of voluntas efficiens, effecting will, and voluntas permittens, permitting will. Under the former category, God is viewed as directly or indirectly through instrumental causes effecting his positive will, whereas under the latter category God is understood as permitting both contingent events and acts of free will even when such events and acts go against his revealed will.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/richard-muller.html">Richard Muller</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Dictionary of Latin &amp; Greek Theological Terms: Drawn Principally from Protestant Scholastic Theology 1st</cite>, ed. 1</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/attributes-of-god/will-of-god.html">Will of God</a></span></div>

<blockquote><p>[Margin note:] How far the will of sign may be a will Question 33, Whether the will of sign may improperly and metonymically be the will of God? Response: The will of sign, according as it designates what is the pleasing and acceptable revealed will of God to us, that which is of our duty, so it is called the approving will, contradistinguished from the will of good-pleasure [of decree], and refers to two things: 1. To that which we ought to believe or do, inasmuch as that is obliging of consciences, since we ought to will to please God and will the reward of obedience following. 2. It refers to obedience, and this so far as God displays that to us by an act, either through special grace or a common concursus. The first will is of complacency and is properly called will, whose object is the duty of the rational creature. In this way God sincerely [serio] approves and wills obedience, and is pleased in this moral good as a rule and norm, and it is not less a will than that which is called of good-pleasure [or the will of decree]. But the latter way is not an executing will as the will of good-pleasure is, nor does God will, intend or decree through grace or concursus, to work in the creatures that which He commands or prohibits, because He commands or prohibits it. And in this way the will of sign is so far improperly called ‘the will of sign’; indeed, the punishment is called the wrath of God, because assuredly God punishes that which is done, as men are accustomed to do such being angry and in the passion of wrath, being aroused and agitated, although nonetheless, passions do not occur in God.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/samuel-rutherford.html">Samuel Rutherford</a></span><span class="wk"><span class="lbl">Work:</span> <cite>A Scholastic Disputation on Divine Providence, chs. 1-10</cite>, (Edinburgh, 1649), Metaphysical Inquiries, p. 605 Trans. T. Fentiman. A ‘metonymy’ is something that is indirectly named by something closely related to it. Rutherford here delineates the eternal foundation of the will of sign, namely what Rollock had elucidated, the will of approval in God, which wills the goodness of things in and of themselves.</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/attributes-of-god/will-of-god.html">Will of God</a></span></div>

</figure><figure class="quote" id="q-354cd715bd" data-kw="">
<blockquote><p>…He says by this will to Judas the traitor, ‘I command and will your final obedience,’ that is, I approve, and hold it morally pleasing and acceptable, whether that obedience actually exists, or not, as the law of an earthly prince is not made to this end, that men should simply cultivate society, but on the hypothesis of society being cultivated, that they should order their life civilly and according to the rule and norm of good laws; so the formal use of the Word of God revealing to us the will of sign is to illuminate, lead, direct what may be the pleasing good acceptable will of God, and how our acts, on the hypothesis that they are elicited and exist, can be instituted according to the Word of God, so that they may be pleasing and acceptable to God, and worthy of reward in Christ.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/samuel-rutherford.html">Samuel Rutherford</a></span><span class="wk"><span class="lbl">Work:</span> <cite>A Scholastic Disputation on Divine Providence, chs. 1-10</cite>, tr. by AI by Onku (Edinburgh, 1649), ch. 2. ‘What is the nature of the permissive will of God, and of the will of good pleasure and sign. The Remonstrants, Arminians are called to the discussion’ Latin, p. 14</span></figcaption>

=to%20God%2C%20and%20worthy%20of%20reward%20in%20Christ" rel="noopener" target="_blank">Read it online · Reformed Books Online</a></div>
</figure><figure class="quote" id="q-eeec6c6550" data-kw="">
<blockquote><p>XL. Holy obedience is to walk in a manner worthy of the Lord, to please Him in all respects, bearing fruit in every good work and increasing in the knowledge of God. XLI. This life is like a journey that we must walk, always mindful that we are here as travelers, far from the Lord, and striving toward our homeland. XLII. Those who walk in a manner worthy of the Lord are those who, throughout the course of their lives, follow the will and guidance of God, denying their own desires and the dictates of the flesh, as befits children of the heavenly Father and imitators of God.</p></blockquote>

</figure><figure class="quote" id="q-b26fb3dc36" data-kw="">
<blockquote><p>From this, these things we posit, saying: 1. God seriously wills, that is, He loves, approves and by an act of complacency He lifts up for the obedience of reprobates, insofar as it is a good and holy thing, whether the obedience may come forth by the act, or not… … 5. For God to intend and decree the death of a sinner, and for God not to delight in the death of a sinner, as He swears in Eze. 33:11, are in no way contradictions.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/samuel-rutherford.html">Samuel Rutherford</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Exercise 2, ‘Of Notions of the Divine Will’</cite>, ch. 1, ‘Of God’s Revealed Will [Signi] and His Will of Good-pleasure’ in Apologetic Exercises for Divine Grace (Amsterdam, 1636; 1651), pp. 213-238, p. 232-233</span></figcaption>

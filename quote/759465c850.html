<blockquote><p>Other affections which are given to God metaphorically, and by an anthropopathy are 1. Anger, and its contrary, complacency or gentleness, which are improperly in God, for He is neither pleased nor displeased; neither can a sudden either pertubation or tranquillity agree to God; but by these the actions of God are declared, which are such as those of offended and pleased men are wont to be; viz. God by an eternal and constant act of his will approves obedience, and the purity of the creature, and witnessses that by some sign of his favor, but abhors the iniquity and sin of the same creature and shows the same, by inflicting a punishment, not less severe, but far more just than men are wont to do when they are hot with anger, Ex. 32:10, ‘Now therefore, let Me alone, that my wrath may wax hot against them, and that I may consume them…&#x27;</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/edward-leigh.html">Edward Leigh</a></span><span class="wk"><span class="lbl">Work:</span> <cite>A System or Body of Divinity</cite>, … (London, 1654), 2nd Book, ‘Of God’ | ch. 9, ‘Of the Affections of Anger &amp; Clemency, Given to God Metaphorically’</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/attributes-of-god/affections-and-passions-in-god.html">Affections and Passions in God</a></span></div>

</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-067bfa5580" data-kw="">
<blockquote><p>‘And it repented the Lord that He had made man on the earth, and it grieved Him at his heart’ ([Genesis] 6:6). This, of course, is anthropomorphic language; it speaks of God as if He were a man. Actually, God does not repent (1 Sam. 15:29); God does not change His mind; He has a single, consistent purpose that He follows from eternity to eternity. When the Bible speaks of God as ‘repenting’ or changing His mind, this means that He changed His attitude toward some of His creatures. The change of attitude itself was part of the original purpose of God and was planned from eternity. So, in the present passage, the truth is expressed that God changed His attitude toward the human race. Human sin had developed to such an extreme degree that the purpose for which man had been created could no longer be accomplished. A new beginning had to be made with the godly remnant of the race, while the mass of the wicked had to be destroyed. This, of course, was known and planned by God from eternity; the change was in God’s attitude toward man, not in God’s own intentions and purposes.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/johannes-g-vos.html">Johannes G. Vos</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Genesis</cite>, (Pittsburgh, PA: Crown &amp; Covenant, 2006), p. 124</span></figcaption>

</figure><figure class="quote" id="q-9997402f31" data-kw="">
<blockquote><p>The properties of God are either absolute or relative. The absolute properties of God are such as may be considered without the supposition of any thing else whatever, towards which their energy and efficacy should be exerted. His relative are such as, in their egress and exercise, respect some things in the creatures, though they naturally and eternally reside in God. Of the first sort is God’s immensity ; it is an absolute property of his nature and being. For God to be immense, infinite, unbounded, unlimited, is as necessary to him as to be God ; that is, it is of his essential perfection so to be. The ubiquity of God, or his presence to all things and persons, is a relative property of God ; for to say that God is present in and to all things supposes those things to be. Indeed, the ubiquity of God is the habitude of his immensity to the creation. Supposing the creatures, the world that is, God is by reason of his immensity indistant to them all;</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/john-owen.html">John Owen</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Vindiciae Evangelicae; Or the Mystery of the Gospel Vindicated &amp; Socinianism Examined</cite>, ch. 2, ‘Of the Nature of God’, p. 93 in Works, vol. 12</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/attributes-of-god/affections-and-passions-in-god.html">Affections and Passions in God</a></span></div>

nline · Reformed Books Online</a></div>
</figure><figure class="quote" id="q-51e13b3efd" data-kw="">
<blockquote><p>To the love of God belong what may be called his desires or wishes, etc. Now it is the absence of good which excites desire; but since God enjoys all good, it is plain that desire cannot properly apply to Him; yet it is frequently attributed to Him in scripture, and to this may be referred all those passages in which God is introduced speaking to this effect: “O that my people had hearkened unto me.” (Ps. 81:14; Isa. 48:14; Lk. 19:42) Therefore this desire in God denotes, that man’s obedience is highly pleasing to him, and that He will not pass it by unrewarded; at the same time it points out man’s duty, and his great wickedness in not discharging this duty. To this desire is opposed aversion, by which God is said to loathe sin, and to have no pleasure in the destruction of the creature. From what has been said, we clearly see what ideas we ought to have of the hope of God, of his joy, sorrow, jealousy, etc. Hope or expectation in God, intimates that the thing is due to Him. Thus when He said that He “looked that his vineyard should bring forth grapes,” (Isa. 5:2) He meant that the vineyard owed him fruit, and could not be fruitless without sin. God is said to rejoice when anything is pleasing to Him; and also when He performs anything which displays his glory, as when He does good to his people, or when He punishes the rebellious and ungodly. (Deut. 28:63; 30:9)</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/benedict-pictet.html">Benedict Pictet</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Christian Theology</cite>, (d. 1724), bk. 2, ch. 5, p. 87</span></figcaption>

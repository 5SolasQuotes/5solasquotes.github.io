<main class="wrap"><figure class="quote" id="q-fb6aafc4ef" data-kw="">
<blockquote><p>But inasmuch as we cannot conceive an act of the will to the performance of which no inducement existed, we naturally inquire whether the inspired account of the first sin meets this difficulty. It does. There were inducements to the commission of it; but they were not motives which sprung from the moral nature of our first parents. Their moral spontaneity, so far from furnishing the motives to the perpetration of the sin, would, if it had been consulted, have urged them to its resistance. They were, as Bishop Butler intimates, blind impulses, in themselves innocent and legitimate because implanted by God Himself in the very make of man. The bodily appetite for food, and the intellectual desire for knowledge, were, in Eve’s case, precisely the inducements [Gen. 3:6] upon which the great master of temptation put his finger. In the case of Adam, in contradistinction to that of Eve, it is more than a probable inference–it is one necessitated by the narrative [Gen. 3:12,17]–that the natural impulse of affection for his wife and sympathy with her operated as an inducement to the commission of his first sin. It must be admitted, that while we may accept Butler’s theory as in all probability correct, that Eve fell through the lack of vigilance mainly, we cannot account for Adam’s sin in the same way. The Scriptures inform us that he was not deceived as was Eve [1 Tim. 2:14]. His eye was directed to both alternatives. He saw clearly the issues involved, and deliberately resolved to break with his God, and ruin his race. But we cannot avoid the conclusion that, as his moral dispositions and tendencies were all in the direction of holiness, the intrinsically legitimate blind impulses of his constitution started the train of inducements, inflamed the desire which enticed the will in the direction of sin. Here were motives brought to bear upon the will; but it is obvious that, in their first presentation, they were in the control of the will. It had the power to resist them, or to comply with them. The instant it freely consented to entertain them directed to the forbidden object, that instant the fall began. Here then we have a reason why the will acted in a specific direction–used its power to choose between opposing possibilities–and we see that it had the power to act or not to act in accordance with it. There was motive, but the will was, at first, master of the motive, not the motive of it. The innocent impulses of man’s constitution, when directed to a forbidden object and approved by the will, traversed the dispositions to holiness and dashed down the moral spontaneity. But, although, in the first instance, the will was not necessitated to action by these impulses, but had the control of them so that it could have resisted them, yet when it did freely consent to tolerate them, it surrendered that control, and was thenceforward mastered by them [John 8:34].</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/john-l-girardeau.html">John L. Girardeau</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Will in its Theological Relations</cite>, John L. Girardeau, The Will in its Theological Relations, (1891), pp. 87-89</span></figcaption>

</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-552e96d443" data-kw="">
<blockquote><p>So that upon supposition of God’s will to permit Adam to fall, it was necessary that Adam should fall; necessary, I say, that he should fall: But how? Not necessarily, but contingently, and freely: and no other necessity is at this day found in man for the performing of any particular sinful act, but such as is joined with liberty; and that in such sort, as that the necessity is only Secundum quid [that which follows]; the liberty is Simpliciter [essential]: so called, I say, in respect of any particular act.</p></blockquote>

<blockquote><p>The moderate Calvinists–who have seen the prominence which the Scriptures everywhere give to human agency, especially in the matter of sin; who have felt in their own souls that there were thoughts, words and deeds, states and affections of the soul, which were truly theirs, which began in the will as the immediate cause–have been compelled to admit that there is a sphere in which God leaves personal agents to themselves, and in which they are permitted to act as real efficient causes. So in innocence Adam was left to the freedom of his will.</p></blockquote>

<blockquote><p>God did not foreknow the actions of man, as necessary, but as free… Man has a power to do otherwise than that which God foreknows he will do: Adam was not determined by any inward necessity to Fall, not any man by inward necessity to commit this or that particular sin; but God foresaw that he would fall, and Fall freely… and how that Free-Will of man will comply with this, or refuse that; he changes not the manner of the Creatures operation, whatsoever it be.</p></blockquote>

</figure><figure class="quote" id="q-78181b61e5" data-kw="">
<blockquote><p>XVI. Seventh, the will of God is universally effective. For whatever he wills, and just as he wills, he brings into effect in its own time and in its own way. Nor is there anything, if he wills it, that does not occur, or that does not occur as he wills it. “For our God is in the heavens; he does whatever he wills.” And Revelation 4:2 says, “By your will they exist and were created.” But (what must be noted) it always occurs just as he wills: if he wills the outcome of a thing, it always occurs; if he wills that it only be our duty, that we should will it ourselves, then it is so. But one must also distinguish between his effecting will and his effective will. The effecting will is only toward things that are good, both physically and morally. The effective will also concerns moral evils, insofar as first, in the eternal decree he determined their futurity, although he did not will to effect the evil itself to come to pass as such, and second, he also wills the substrate of sin, although he does not will its lawlessness and defect.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/petrus-van-mastricht.html">Petrus van Mastricht</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Theoretical Practical Theology</cite>, (RHB), vol. 2, bk. 2, ch. 15, section 16</span></figcaption>

<div class="actions"><button class="copy" data-copy="“XVI. Seventh, the will of God is universally effective. For whatever he wills, and just as he wills, he brings into effect in its own time and in its own way. Nor is there anything, if he wills it, that does not occur, or that does not occur as he wills it. “For our God is in the heavens; he does whatever he wills.” And Revelation 4:2 says, “By your will they exist and were created.” But (what must be noted) it always occurs just as he wills: if he wills the outcome of a thing, it always occurs; if he wills that it only be our duty, that we should will it ourselves, then it is so. But one must also distinguish between his effecting will and his effective will. The effecting will is only toward things that are good, both physically and morally. The effective will also concerns moral evils, insofar as first, in the eternal decree he determined their futurity, although he did not will to effect the evil itself to come to pass as such, and second, he also wills the substrate of sin, although he does not will its lawlessness and defect.”

— Petrus van Mastricht, Theoretical Practical Theology (RHB), vol. 2, bk. 2, ch. 15, section 16">Copy</button><a class="share" href="https://x.com/intent/post?text=%E2%80%9CXVI.+Seventh%2C+the+will+of+God+is+universally+effective.+For+whatever+he+wills%2C+and+just+as+he+wills%2C+he+brings+into+effect+in+its+own+time+and+in+its+own+way.+Nor+is+there+anything%2C+if+he+wills+it%2C+that+does+not+occur%2C+or+that+does+not+occur+as+he+wills+it.+%E2%80%9CFor+our+God+is+in+the+heavens%3B+he+does+whatever+he+wills.%E2%80%9D+And+Revelation+4%3A2+says%2C+%E2%80%9CBy+your+will+they+exist+and+were+created.%E2%80%9D+But+%28what+must+be+noted%29+it+always+occurs+just+as+he+wills%3A+if+he+wills+the+outcome+of+a+thing%2C+it+always+occurs%3B+if+he+wills+that+it+only+be+our+duty%2C+that+we+should+will+it+ourselves%2C+then+it+is+so.+But+one+must+also+distinguish+between+his+effecting+will+and+his+effective+will.+The+effecting+will+is+only+toward+things+that+are+good%2C+both+physically+and+morally.+The+effective+will+also+concerns+moral+evils%2C+insofar+as+first%2C+in+the+eternal+decree+he+determined+their+futurity%2C+although+he+did+not+will+to+effect+the+evil+itself+to+come+to+pass+as+such%2C+and+second%2C+he+also+wills+the+substrate+of+sin%2C+although+he+does+not+will+its+lawlessness+and+defect.%E2%80%9D%0A%0A%E2%80%94+Petrus+van+Mastricht%2C+Theoretical+Practical+Theology+%28RHB%29%2C+vol.+2%2C+bk.+2%2C+ch.+15%2C+section+16&amp;url=https%3A%2F%2F5solasquotes.github.io%2Fquote%2F78181b61e5.html&amp;via=5Solas" target="_blank" rel="noopener">Share on X</a><a class="perma" href="../quote/78181b61e5.html">Permalink</a><a class="src" href="https://reformedbooksonline.com/how-did-the-first-human-sin-happen/#:~:text=XVI.%20Seventh%2C%20the%20will%20of%20God,not%20will%20its%20lawlessness%20and%20defect&amp;text=XVI.%20Seventh%2C%20the%20will%20of%20God%20is%20universally&amp;text=he%20does%20not%20will%20its%20lawlessness%20and%20defect" rel="noopener" target="_blank">Read it online · Refo

<blockquote><p>The infinitely glorious plan of man’s redemption, projected from everlasting, in the secret counsel of the adorable Trinity, is a manifold mystery; a mystery, the complicated plies of which, we are infinitely far from being able, fully to unfold. In the view of Jehovah, however, if I may so say, it is all one piece: for, to Him who inhabiteth eternity, all things appear together and at once: one object is not before, nor another after, as with us, who are only creatures, and creatures of time. Now it was, according to that stupendous plan of redeeming love, that the covenant of grace, was entered into, between the contracting Parties.

According to our finite manner of conceiving spiritual objects, we have to think of that covenant, as made of old, in a period which is long since elapsed; which has passed away, long, infinitely long, before the world began. But to the eternal, the glorious, Parties themselves, the making of it is ever new, and ever-present. Nothing to them can be either past or future.

The fulfilling of the conditions of that eternal covenant, was to man, when it was at first revealed to him, a matter of futurity, and that for so long as four thousand years; but to Jehovah who inhabiteth eternity, it was always present: so that, in saving sinners, under the Patriarchal and Jewish economy, he proceeded upon them, as conditions, in a manner, already fulfilled: and though it was a matter of futurity likewise, to Christ as man, previous to his finishing of his work, on the cross and in the grave; yet to him as God, it was neither past, nor future, but was ever-present. Accordingly, speaking of himself as God-man, he said to the Jews, “Before Abraham was, (not, I was, but) — I AM.” All that is past to us, as well as all that is future, is necessarily, and invariably present to him.

But although that wonderful covenant was, in the eternal and mysterious counsel of the ever-blessed Trinity, and by one eternal act of the Divine will, made all at once; yet since we, because of the narrowness and darkness of our understanding, cannot form any apprehensions of it, but as it were in parcels; we are allowed, to conceive a certain order in the making of it, and to consider, first, one part, and then, another.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/john-colquhoun.html">John Colquhoun</a></span><span class="wk"><span class="lbl">Work:</span> <cite>A Treatise of the Covenant of Grace</cite>, (Edinburgh: Ogle, Allardice and Thomson, 1818), pp 61-62.</span></figcaption>

<blockquote><p>While all duties are commanded in the law, all privileges and blessings are offered in the gospel. While the former are required of all, the latter are presented to all. Christ and all the blessings of His great salvation are in the gospel offered freely, fully, presently, and particularly, and that to sinners of mankind in common; and as they are offered, so must they be received by sinners. The ministers of the gospel are authorized by the Lord Jesus to “preach the gospel to every creature” (Mark 16:15)—that is, to publish the full and free offer of Himself and of His righteousness and salvation to every rational creature, every son and daughter of Adam to whom they may have access to speak. And it is, indeed, good tidings of great joy which shall be to all people that “unto us” sinners of the human race this “child is born,” this “son is given” (Isa. 9:6). The receiving of Christ by faith supposes a previous offering or giving of Him to hearers of the gospel in order to afford them a warrant to receive Him. As the raining of the manna about the camp of Israel in the wilderness is called a giving of it prior to their eating of it, so the gospel offer of Christ is styled a giving of Him previous to a sinner’s reception of Him by faith (John 6:31–32). Indeed, it is as necessary a part of the glorious plan of salvation by Jesus Christ that He be given in offer before believing as that He be given in possession in and after believing.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/john-colquhoun.html">John Colquhoun</a></span><span class="wk"><span class="lbl">Work:</span> <cite>A Treatise on the Law and Gospel</cite>, (Grand Rapids: Reformation Heritage Books), 97-98.</span></figcaption>

<blockquote><p>The affections are, therefore [after quoting Venema and Ames], either inward and inalterable dispositions of the divine will or figurative attributions based on ad extra manifestations. Furthermore, what makes the attribution of an affection to God figurative or metaphorical is its apparent variation, temporality, or alterability. Significantly, this figurative or metaphorical understanding of some of the divine affections as inward, permanent dispositions and others as ad extra manifestations of permanent dispositions in no way lessened the Reformed interest in the topic–nor did it in any way undermine the discussion of the divine affections in the works of popular piety written during the era of orthodoxy. It is even possible to argue the opposite, that the Reformed orthodox reading of the biblical language of divine affections as not indicating alterations of the divine essence but, nonetheless, as descriptive of genuine patterns of relationship between God and his creation, enhanced the interest of theologians, pastors, and authors of treatises of popular piety in the divine affections… …Nor, indeed, has the basic doctrinal assumption shifted: like the Reformers, the orthodox assume that God has affectiones that characterize his relationship to the world and that some analogy can be drawn between these ‘divine affections’ and the affections that belong to human willing–with the major qualification that, unlike human affections, the divine affections do not indicate essential change in God and that they are permanent rather than transient dispositions. Because of the difficulties inherent in the term ‘affection,’ some of the Reformed prefer to speak of the divine ‘virtues.’ (Thus, Leigh, Treatise, II.x (pp. 78-79); Mastricht, Theoretico-practica theologia, II.xv.18-19.) The question of the ‘affections’ (affectiones or adfectiones) and ‘passions’ (passiones) of the divine will arises rather naturally as a result of the definition and discussion of the voluntas Dei, granting the context of traditional, Christian Aristotelianism and scholastic faculty psychology within which Protestant discussions of mind and will took place, both in the time of the Reformation and afterward. (See Muller, Unaccommodated Calvin, pp. 159-173; and idem, God, Creation, and Providence, pp. 143-149, 167-169, 191-207.) The terminology is itself interesting: the language of affections and passions is typically a language indicating the changeableness of a living being, specifically of the soul, in its sentiments or dispositions. Strictly, an affection or passion is an acquired quality. (Francois Bremondy, “Affection,” in Encyclopedie philosophique universelle, II/1, p. 49.) An affection is usually favorable or positive, whereas a passion is usually negative. Thus, an affection is a disposition of nature or an inclination of will toward an object and, as such, it can indicate either a transient disposition (in contrast to a habitus) that is caused by an external object or a permanent disposition or virtue. (Cf. Heidanus, Corpus theol., II (p. 172); Venema, Inst. theol., viii (p. 180).) It is the latter sense of the term, as a permanent disposition or virtue, that the orthodox accept. A passion, most strictly, is a form of suffering and would not have the connotation of a permanent disposition and certainly not of a disposition positively directed toward an object. Passions, moreover, indicate a declension from an original or natural condition that is at variance with the fundamental inclination of the individual–and, therefore, a loss of power or self-control. (Venema, Inst. theol., viii (p. 181).) A virtue is, quite simply, a moral perfection–in the case of God, the perfection of his understanding and/or will.¹ ¹ (Ames, Marrow, I.iv.63; note that this understanding of affections and passions reflects the standard categories of predication, in which action and passion denote respectively, the act of a subject and the subject being acted upon: thus, the point of the theological argument is that God act[s] but is not acted upon.)</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/richard-muller.html">Richard Muller</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Post-Reformation Reformed Dogmatics</cite>, (Baker Academic, 2003), vol. 3, pp. 552-53</span></figcaption>

 a subject and the subject being acted upon: thus, the point of the theological argument is that God act[s] but is not acted upon.)”

<blockquote><p>Paul considered it as involved in what he had already said, and especially in the predictions of the ancient prophets, that it was the will of God that all men should call upon him. This being the case, he argues to prove that it was his will that the gospel should be preached to all. As invocation implies faith, as faith implies knowledge, knowledge instruction, and instruction an instructor, so it is plain that if God would have all men to call upon him, he designed preachers to be sent to all, whose proclamation of mercy being heard, might be believed, and being believed, might lead men to call on him and be saved. This is agreeable to the prediction of Isaiah, who foretold that the advent of the preachers of the gospel should be hailed with great and universal joy. According to this, which is the common and most natural view of the passage, it is an argument founded on the principle, that if God wills the end, he wills also the means; if he would have the Gentiles saved, according to the predictions of his prophets, he would have the gospel preached to them.</p></blockquote>

<blockquote><p>[Rutherford arguing against an opponent:] David, if he was formally king [when he had not yet been elected by the people, which he was not], deserted his calling in flying to the Philistines; for a king should not forsake his calling upon any hazard, even of his life, no more than a pilot should give over the helm in an extreme storm…</p></blockquote>

</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-e46c98e15d" data-kw="">
<blockquote><p>Can there be any more willing to help us than Christ? whose whole head was sick, and whose heart was heavy for our sakes? yea, in whose body, from the sole of the foot to the crown of the head, was nothing but wounds and swellings, and sores? but alas this was nothing to that He suffered for our sakes. He was compassed about with fears and horrors, till his sweat was drops of blood, and his bones bruised in the flesh: he was whipped, and scourged, and chastised with sorrows, till He cried out in the bitterness of his soul: ‘O Lord, if it be possible let this cup pass from Me.’ The heavy hand of God was so grievous upon Him, that it bruised his very bones and rent his reigns asunder: he could find no health in his flesh, but was wounded, yea, wounded to the death, even the most bitter death upon the cross. His tender fingers were nailed to the cross, his face was wrinkled with weeping and wailing, his sides embrued and gored with his own blood. spurting and gushing fresh from his ribs, the shadow of death was upon his eyes. O what grief could be like to this, or what condemnation could be so heavy, since there was no wickedness in his hands? since He was the brightness of his father’s glory, and the son of righteousness that shined in the world: as to see his days at an end, to see such throbing, sighs, and careful thoughts (without cause of his) so deeply engraven in the tables of his breast. But was this all? No my brethren, since his excellency was such above all creatures, that the world was not worthy to give Him breath, it was a greater grief unto Him, to see Himself made a worm and not a man, a shame of men, and contempt of the people; to see his life shut up in shame and reproaches, how could it but shake his bones out of joint, and make his heart melt in midst of his bowels: who was ever so full of woe? and whoever been brought so low into the dust of death? upon whom did the malice of Satan ever get so great a conquest? This though it were exceeding, yet it was not all, no, it was but a taste of grief in comparison of the rest: behold therefore (if your watery eyes will suffer ye to behold) the depth of all miseries yet behind: the sin that he hated he must take upon his own body, and bear the wrath of his Father poured out against it. This is the fullness of all pains that compassed Him round about, which no tongue is able to utter, nor heart conceive: the anger of the father burneth in Him, even to the bottom of hell, and deep sink of confusion: it wrapped Him in the chains of eternal death: it crucified Him, and threw Him down into the bottomless pit of calamity, and made his soul by weeping and wailing to melt into these bitter tears trickling from his eyes: “O God my God, why hast Thou forsaken Me?</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/henry-smith.html">Henry Smith</a></span><span class="wk"><span class="lbl">Work:</span> <cite>‘The Sinful Man’s Search’</cite>, (London, 1592) on Job, 8:5-7</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/civil-government-and-society/plague-quarantine-and-public-health.html">Plague, Quarantine and Public Health</a></span></div>

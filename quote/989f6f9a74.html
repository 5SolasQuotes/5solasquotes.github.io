<blockquote><p>But they like men have transgressed the covenant: there have they dealt treacherously against me.” (Hosea 6:7)

I told them by my prophets what I required of them by covenant, but I could not obtain it, they regarded not what I said. Like men; or, like Adam: some take it for a proper name, and so refer it unto the first man, and his breaking covenant; and, for aught I see, it may well enough refer to him, who forgot or slighted the threat, who judged of what he did by what it appeared, as a small matter; and so these forget and slight my threats, and judge of the place where, and the persons by whom, and the times when, sacrifices are to be offered as no material circumstances, and therefore do choose what places they please, and appoint what priest liketh them best to offer; or else transgress the covenant, as if it were the covenant of a man like themselves.

The covenant; the law of their God, which directed and encouraged their obedience, and which threatened their disobedience, and cursed it. There; in that very place, the good land, which by covenant I gave them, they have broken my covenant; or in the things in which they thought they kept covenant, in their sacrifices, and observing of feasts, in these things they transgress the covenant. Dealt treacherously against me; very frowardly, and with wilful resolutions perverted my law; their transgressing was a designed perfidiousness. I told them, Obedience, not sacrifice; they reply, Sacrifice, and stop there; they give no obedience, though they offer many sacrifices.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/matthew-poole.html">Matthew Poole</a></span><span class="wk"><span class="lbl">Work:</span> <cite>A Commentary on the Holy Bible</cite>, (1685; 3 vols, London: Banner of Truth, 1962), 2: 865.</span></figcaption>

<blockquote><p>43. There are, however, exceptions. First, all those works are permitted which are part of honorable conduct. At all times we ought to live and act honestly and decently, and especially on the day dedicated to divine worship. All things which look simply to this are clearly allowed. Second, those things are permitted which are imposed upon us by special necessity, Matt. 12:11. We should eliminate all those things which men make or pretend to make necessary. But there are still those which in the providence of God are unexpected, necessary, and unavoidable, e.g., when a necessity allowed by the Scripture is present as a sufficient cause for doing ordinary work. Third, all work is permitted which directly affects the worship and glory of God, Matt. 12:5; John 5:8,9. For such work which of its own nature is servile passes into the nature of a holy work and is not properly our work but God’s.</p></blockquote>

<blockquote><p>I beseech you therefore, brethren, by the mercies of God, that ye present your bodies a living sacrifice, holy, acceptable unto God, which is your reasonable service. (Romans 12:1)

Hitherto the apostle hath discoursed of matters of faith; in this and the following chapters he sets down precepts of holy life. By the mercies of God: he useth the word in the plural number, to amplify and set forth the manifold mercies of God, in election, justification, adoption, &amp;c.: … Seeing you Gentiles have received so many and so great mercies from God; seeing he hath preferred you to his ancient people the Jews, and hath chosen and called you, when he hath rejected them; as you value these mercies, let the consideration of them engage you to all manner of holiness and new obedience.

That ye present; that you give, dedicate, and offer up, as spiritual priests. Your bodies; yourselves, or, your whole man; a part is put for the whole; the body is named, because it is the soul’s instrument in the service of God. A living sacrifice; the sacrifices of old were presented alive to God, and their blood was shed at the feet of the altar: a beast that died of itself, or was torn by wild beasts, was not so much as to be eaten, Exodus 22:31 Leviticus 22:8. Conformable hereunto, God will have us offer up ourselves a living sacrifice; i.e. we must be quickened and alive to God, and not dead in sins and trespasses. Holy; as the sacrifices under the law were to be without blemish or defect, Exodus 12:5 Leviticus 1:10 Deut. 15:21. Acceptable unto God; or, well pleasing unto God. So were the appointed sacrifices under the law, Leviticus 1:9; so was the sacrifice of Christ the Lamb of God, Ephesians 5:2; and so are all spiritual sacrifices under the gospel, Philippians 4:18 Hebrews 13:16.

Which is your reasonable service; or, which is agreeable to reason; nothing is more reasonable, than that you should devote yourselves to God in this manner. Some think this is added, to show a difference between the sacrifice here required, and that of the Jews, which was of unreasonable beasts. Others, by reasonable service, understand spiritual service, and expound this place by 1 Peter 2:5, where you read of spiritual sacrifices acceptable to God by Jesus Christ. Others think, that by reasonable you must understand such service as is according to the word of God; and this suits best with the Greek phrase in the text, λογικὴν λατρείαν. The same word is used, 1 Peter 2:2, and there it is rendered the milk of the word, and not reasonable milk. And so the service or worship here spoken of is opposed to that will worship, of which you read in Colossians 2:23.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/matthew-poole.html">Matthew Poole</a></span><span class="wk"><span class="lbl">Work:</span> <cite>A Commentary on the Holy Bible</cite>, (1685; London: Banner of Truth, 1963), 3: 521.</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/worship.html">Worship</a></span></div>

That ye present; that you give, dedicate, and offer up, as spiritual priests. Your bodies; yourselves, or, your whole man; a part is put for the whole; the body is named, because it is the soul’s instrument in the service of God. A living sacrifice; the sacrifices of old were presented alive to God, and their blood was shed at the feet of the altar: a beast that died of itself, or was torn by wild beasts, was not so much as to be eaten, Exodus 22:31 Leviticus 22:8. Conformable hereunto, God will have us offer up ourselves a living sacrifice; i.e. we must be quickened and alive to God, and not dead in sins and trespasses. Holy; as the sacrifices under the law were to be without blemish or defect, Exodus 12:5 Leviticus 1:10 Deut. 15:21. Acceptable unto God; or, well pleasing unto God. So were the appointed sacrifices under the law, Leviticus 1:9; so was the sacrifice of Christ the Lamb of God, Ephesians 5:2; and so are all spiritual sacrifices under the gospel, Philippians 4:18 Hebrews 13:16.

<main class="wrap"><figure class="quote" id="q-9e2bfe81dd" data-kw="">
<blockquote><p>We indeed know that repudiation [divorce], properly speaking, had never been allowed by God; for though it was not punished under the [Mosaic] Law, yet it was not permitted. It was the same as with a magistrate, who is constrained to bear many things which he does not approve; for we cannot so deal with mankind as to restrain all vices. It is indeed desirable, that no vice should be tolerated; but we must have a regard to what is possible. Hence Moses has specified no punishment, according to the heinousness of the crime, if one repudiated his wife; and yet it was never permitted.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/john-calvin.html">John Calvin</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Commentary on Mal.</cite>, 2:16</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/civil-government-and-society/natural-law-and-civil-law.html">Natural Law and Civil Law</a></span></div>

</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-7a7bfa6eef" data-kw="">
<blockquote><p>In reality there are two, and only two, foundations of law; and they are both of them conditions without which nothing can give it any force; I mean equity and utility. With respect to the former, it grows out of the great rule of equality, which is grounded upon our common nature, and which Philo, with propriety and beauty, calls the mother of justice. All human laws are, properly speaking, only declaratory; they may alter the mode and application, but have no power over the substance of original justice. The other foundation of law, which is utility, connected in the same manner with, and derived directly from, our rational nature; for any other utility may be the utility of a robber, but cannot be that of a citizen; the interest of the domestic enemy, and not that of a member of the commonwealth. This present equality can never be the foundation of statues which create an artificial difference between men, as the laws before us [under consideration in his time] do, in order to induce a consequential inequality in the distribution of justice. Law is a mode of human action respecting society, and must be governed by the same rules of equity which govern every private action; and so Tully [Cicero?] considers it in his Offices as the only utility [being a utility to all commonly] agreeable to that [common] nature…</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/edmund-burke.html">Edmund Burke</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Works &amp; Correspondence of the Right Honourable Edmund Burke. A New Edition, in 8 Volumes, vol. 6 (d. 1797; London, 1852), p. 17. See also the larger context from pp. 14-18, which includes helpful Latin quotes from Suarez. Burke is opposing certain laws contrary to Romanists in Ireland.</cite></span></figcaption>
<div class="meta"><span class="t"><a href="../topics/civil-government-and-society/natural-law-and-civil-law.html">Natural Law and Civil Law</a></span></div>

</figure><figure class="quote" id="q-e0eaeea21a" data-kw="">
<blockquote><p>The Puritan objection to the oath ex officio loomed large in the controversy of the time, and lawyers as well as divines vigorously denounced its use as illegal.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/thomas-cartwright.html">Thomas Cartwright</a></span><span class="wk"><span class="lbl">Work:</span> <cite>eds. Peel &amp; Carlson, Cartwrightiana (London: Halley Stewart, 1951) | 3. ‘The Imprisoned Ministers and the Oath Ex Officio [out of duty]’, pp. 28-30 Cartwright authored this with eight other English presbyterian ministers.</cite>, p. 28</span></figcaption>

</figure><figure class="quote" id="q-dc71cf0a24" data-kw="">
<blockquote><p>§24. Proposition 11. The commands of lawful governors about lawful ceremonies are ordinarily to be understood with exceptions, though there be none expressed, as that in certain cases it is not their will that such commands should bind us.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/richard-baxter.html">Richard Baxter</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Five Disputations of Church-Government &amp; Worship (London: R.W., 1659), 5th Disputation, ch. 1</cite>, p. 398</span></figcaption>

</figure><figure class="quote" id="q-a97faecc2b" data-kw="">
<blockquote><p>Rutherford’s position is that God by creating rational creatures… at once creates the common principles of the natural law. Since they are part of the very constitution of the rational creature these are unable to be effaced… However, taking up Menchaca’s own Ockhamist position, Rutherford agrees that it would have been quite possible for God to have created another species of rational creature distinct from man to whom he gave a diverse natural law… Rutherford’s position is that the love of God and the subjection of the creature to the Creator is an essential part of any kind of natural law. Rutherford therefore concurs with the prominent Dutch Reformed theologian Gisbertus Voetius that the dependency of the rational creature on its Creator in morality and in order to right reason is so necessary that its opposite implies a contradiction… this law… is immutable and antecedent to every act of the divine will [stemming from the divine nature], forming the cornerstone of the natural law. What is left open to the divine decree is simply to select whether a particular act or its omission should be considered as due subjection and obedience to God, or not. Thus while the divine will establishes the moral status of a complex act, it always does so against the backdrop of God’s own nature.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/simon-j-g-burton.html">Simon J.G. Burton</a></span><span class="wk"><span class="lbl">Work:</span> <cite>ch. 7, ‘Samuel Rutherford’s Euthyphro Dilemma: A Reformed Perspective on the Scholastic Natural Law Tradition’ in d. Aaron C. Denlinger, Reformed Orthodoxy in Scotland: Essays on Scottish Theology, 1560-1775 (Bloomsbury, T&amp;T Clark, 2016), pt. 2, pp. 123-40</cite>, pp. 132-33</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/civil-government-and-society/natural-law-and-civil-law.html">Natural Law and Civil Law</a></span></div>
<div class="actions"><button class="copy" data-copy="“Rutherford’s position is that God by creating rational creatures… at once creates the common principles of the natural law. Since they are part of the very constitution of the rational creature these are unable to be effaced… However, taking up Menchaca’s own Ockhamist position, Rutherford agrees that it would have been quite possible for God to have created another species of rational creature distinct from man to whom he gave a diverse natural law… Rutherford’s position is that the love of God and the subjection of the creature to the Creator is an essential part of any kind of natural law. Rutherford therefore concurs with the prominent Dutch Reformed theologian Gisbertus Voetius that the dependency of the rational creature on its Creator in morality and in order to right reason is so necessary that its opposite implies a contradiction… this law… is immutable and antecedent to every act of the divine will [stemming from the divine nature], forming the cornerstone of the natural law. What is left open to the divine decree is simply to select whether a particular act or its omission should be considered as due subjection and obedience to God, or not. Thus while the divine will establishes the moral status of a complex act, it always does so against the backdrop of God’s own nature.”

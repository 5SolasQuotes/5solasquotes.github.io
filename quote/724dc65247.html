<main class="wrap"><figure class="quote" id="q-724dc65247" data-kw="">
<blockquote><p>Let none please himself with his commentaries, because they contain something new and unknown by our predecessors. Let him who thinks he has found out something preferable to the received opinion, offer it to the public with modesty, without vilifying the brethren; nor asserting or determining rashly, but submitting his thoughts to the censure of the learned, and the judgment of the church; not forcing them on the common people to the distraction of their minds; nor hastily offering them to incautious youth, who are improper judges of such weighty matters.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/herman-witsius.html">Herman Witsius</a></span><span class="wk"><span class="lbl">Work:</span> <cite>A Pacific Address. To the very reverend, learned, and celebrated Professors of Divinity in the Universities of the United Provinces of Holland, Pastors of the Reformed Churches, and zealous Defenders of the Faith once delivered to the Saints in The Economy of the Covenants Between God and Man: Compr</cite></span></figcaption>
<div class="meta"><span class="t"><a href="../topics/the-church/schism-and-separation.html">Schism and Separation</a></span></div>

</figure><figure class="quote" id="q-a787f58d8f" data-kw="">
<blockquote><p>But yet let me freely tell you, that there is one step in Mr. Erskine’s conduct that I am not able to justify; it is, When the synod of Perth and Stirling resolved to give him a modest rebuke, he did not silently receive it. I should never have advised my worthy brother Mr. Erskine to have made any confession of a fault even in his expressions, when his conscience justified him in the same; but I cannot think that his silence at the time that either the synod or General Assembly rebuked him, when they resolved thereby to finish the process, would be construed an acknowledgment of a fault: I am sure that the history of our blessed Lord’s sufferings bears expressly, that, when He was accused of many things before Pilate, He answered nothing; and when he was urged by the self-condemned heathen judge, He still continued silent; and I am persuaded that no good Christian can allege that his silence did import any confession of a fault, yea, it was a fulfilling of the Scripture, Isa. 53:7.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/john-currie.html">John Currie</a></span><span class="wk"><span class="lbl">Work:</span> <cite>An Essay on Separation</cite></span></figcaption>

</figure><figure class="quote" id="q-7cf0da91e1" data-kw="">
<blockquote><p>The Scripture gives us no precedent for testifying against a Church, whose received and enacted standards as to doctrine and discipline are pure, by separating from it, and setting up another Church within its bosom and in opposition to it: Nor were these the footsteps of the flock in other Churches, or in our own, until these last and perilous days.</p></blockquote>

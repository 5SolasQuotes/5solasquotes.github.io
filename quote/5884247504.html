<main class="wrap"><figure class="quote" id="q-5884247504" data-kw="">
<blockquote><p>Because our solemn League and Covenant binds us under an oath, To endeavour the extirpation of Popery, Prelacy, Superstition, Heresy, Schism, Profaneness and whatsoever shall be found to be contrary to sound doctrine and the power of Godliness, least we partake in other men’s sins, &amp;c. And sure I am the observation of these Heathenish, Popish holy days, comes under some of these heads, and so under our Covenant to reform.</p></blockquote>

<blockquote><p>Magistrates certainly have a power to appoint public days, yea, annual days of thanksgivings, for mercies never to be forgotten. Indeed they cannot make a day holy, so as it shall be a sin against God to labor in it, or to use any pleasures (as in the case of the sabbath); but they may command the public worship of God to be performed on particular days, and men ought to attend it when with convenience they can; only they ought to take care that such days be not spent in luxury and profaneness, and that they be for signal providences, and not so multiplied, and frequently renewing, as that the service of them degenerate into mere matter of form. Whether Christ went up in order to the feast [of dedication], or because of the great concourse of people he knew would be there at that time, cannot be determined.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/matthew-poole.html">Matthew Poole</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Annotations on 1 Cor. 11</cite>, v. 22</span></figcaption>

</figure><figure class="quote" id="q-c5e1a1141e" data-kw="">
<blockquote><p>When speaking before the Westminster Assembly, Samuel Rutherford rejected the notion that there are holy places and holy days (other than the Lord’s Day) in the New Testament age:

This is acknowledged by all divines. No holiness in time of gospel in any place. They say that the holiness of the Old Testament was all typical holiness. In New Testament there is no more holiness of place than of time, except the Lord’s day. The time may be called holy, be[cause] the action performed in it is holy, and this will not bring any denomination of holiness … Synagogues only called God’s houses because God was worshipped there, and the burning of them was a profanation of worship secundario, in respect that they are set apart for order’s sake to the worship of God.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/alexander-f-mitchell-and-john-struthers.html">Alexander F. Mitchell and John Struthers</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Minutes of the Sessions of the Westminster Assembly of Divines</cite>, (Edinburgh: William Blackwood and Sons, 1874), Sess. 338, 10 Dec. 1644, pp 17-18.</span></figcaption>

</figure><figure class="quote" id="q-f0a8b9fe31" data-kw="">
<blockquote><p>The liberty and edification of Christ’s people, the grand aim and end of Church power, are inconsistent with that exercise of it which ordains ecclesiastical holidays.

In drawing near to God in holy things, as emphatically as in other matters, “whatsoever is not of faith is sin.” It is of the very essence of acceptable worship, that men “be fully persuaded in their own minds,” and that the conscience, out of a sense of duty, lend its free and willing consent to the acts of worship, as authorized and required by that God who has a right to bind the conscience, and to lay upon it the sense of obligation.

The appointment of ecclesiastical holidays, as parts of worship addressed to God, is inconsistent with the right exercise of conscience in the matter; and that whether the conscience is offended and grieved by the introduction of human and uncommanded ordinances in Divine service, or whether the conscience, deluded and ignorant as to the sin, has no sense of the injury and wrong done to it.

In the one case,—if the conscience is hurt and aggrieved by the imposition, in a matter so nearly concerning it as God’s worship, of unwarranted and uncommanded rites, and is forced, although wounded and offended, to submit against its felt conviction, it is plain that here there can be no liberty left to it at all, but that its Christian rights and freedom in the very matter of approaching to God are trampled under foot.

The oppression upon the conscience in such a case is both great and painfully felt. But even in the other case,— when the conscience is not forced to stifle its own convictions, because no convictions of the wrong done to it are felt,—when, knowing them to be no more than human or ecclesiastical ordinances, they are yet made use of in God’s worship at the bidding of the Church, without any feeling of being offended by the unlawful imposition, still Christian liberty is taken away not the less, and the conscience is enthralled as much, or rather all the more, because it is unconscious of the thraldom.

That the conscience should be taught and trained, in a matter of conscience, to yield a passive and unconscious submission,—that in the very worship of God the conscience should be instructed to own the obligation, not of God’s authority, but of man’s,—that the act of religious service should be a homage, done, not to Christ, but to the Church,—this is to destroy true and intelligent liberty of conscience; and the deed is all the worse, and not the better, because the conscience is made to feel no wrong, but rather to love the yoke that binds it.

It matters not whether, in the appointment and observance of human and uncommanded days, as part of God’s worship, by ecclesiastical authority, the conscience of those on whom they are enforced feels the chain or not. In either case, the imposition is inconsistent with the true liberty wherewith Christ has made His people free.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/james-bannerman.html">James Bannerman</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Church of Christ: A Treatise on the Nature, Powers, Ordinances, Discipline, and Government of the Christian Church</cite>, ed. D. Douglas Bannerman (2 vols, Edinburgh: T &amp; T Clark, 1868), 1: 417-18.</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/worship/holy-days-and-church-calendar.html">Holy Days and Church Calendar</a></span></div>

<blockquote><p>§46. 6. And as for holy days, there is great difference between them: Those are liable to most question that are obtruded on the Church with the greatest confidence. As for such days as are appointed upon some emergent occasions that arose since Scripture was indited, and are not common to all times and places of the Church, there is no more question whether the magistrate may command them, or the pastors agree upon them, than whether a lecture-day, or fast-day, or thanksgiving-day may be commanded or agreed on: some time for God’s worship besides the Lord’s Day must be appointed: And God having not told us which, the magistrate may, on fit occasions. And this is no derogation from the sufficiency of Scripture: For the occasion of the day was not existent when the Scripture was written: such occasions are various according to the various state of the Church in several ages and countries. And therefore to keep an anniversary day of thanksgiving, such as we keep on the fifth of November for our deliverance from the Papists’ powder plot, is no more questionable than to keep a lecture.</p></blockquote>

<div class="actions"><button class="copy" data-copy="“§46. 6. And as for holy days, there is great difference between them: Those are liable to most question that are obtruded on the Church with the greatest confidence. As for such days as are appointed upon some emergent occasions that arose since Scripture was indited, and are not common to all times and places of the Church, there is no more question whether the magistrate may command them, or the pastors agree upon them, than whether a lecture-day, or fast-day, or thanksgiving-day may be commanded or agreed on: some time for God’s worship besides the Lord’s Day must be appointed: And God having not told us which, the magistrate may, on fit occasions. And this is no derogation from the sufficiency of Scripture: For the occasion of the day was not existent when the Scripture was written: such occasions are various according to the various state of the Church in several ages and countries. And therefore to keep an anniversary day of thanksgiving, such as we keep on the fifth of November for our deliverance from the Papists’ powder plot, is no more questionable than to keep a lecture.”

— Richard Baxter, Five Disputations of Church-Government &amp; Worship, (London: R.W., 1659), 5th Disputation, ch. 2, p. 412">Copy</button><a class="share" href="https://x.com/intent/post?text=%E2%80%9C%C2%A746.+6.+And+as+for+holy+days%2C+there+is+great+difference+between+them%3A+Those+are+liable+to+most+question+that+are+obtruded+on+the+Church+with+the+greatest+confidence.+As+for+such+days+as+are+appointed+upon+some+emergent+occasions+that+arose+since+Scripture+was+indited%2C+and+are+not+common+to+all+times+and+places+of+the+Church%2C+there+is+no+more+question+whether+the+magistrate+may+command+them%2C+or+the+pastors+agree+upon+them%2C+than+whether+a+lecture-day%2C+or+fast-day%2C+or+thanksgiving-day+may+be+commanded+or+agreed+on%3A+some+time+for+God%E2%80%99s+worship+besides+the+Lord%E2%80%99s+Day+must+be+appointed%3A+And+God+having+not+told+us+which%2C+the+magistrate+may%2C+on+fit+occasions.+And+this+is+no+derogation+from+the+sufficiency+of+Scripture%3A+For+the+occasion+of+the+day+was+not+existent+when+the+Scripture+was+written%3A+such+occasions+are+various+according+to+the+various+state+of+the+Church+in+several+ages+and+countries.+And+therefore+to+keep+an+anniversary+day+of+thanksgiving%2C+such+as+we+keep+on+the+fifth+of+November+for+our+deliverance+from+the+Papists%E2%80%99+powder+plot%2C+is+no+more+questionable+than+to+keep+a+lecture.%E2%80%9D%0A%0A%E2%80%94+Richard+Baxter%2C+Five+Disputations+of+Church-Government+%26+Worship%2C+%28London%3A+R.W.%2C+1659%29%2C+5th+Disputation%2C+ch.+2%2C+p.+412&amp;url=https%3A%2F%2F5solasquotes.github.io%2Fquote%2F916ec5d38f.html&amp;via=5Solas" target="_blank" rel="noopener">Share on X</a><a class="perma" href="../quote/916ec5d38f.html">Permalink</a><a class="src" href="https://reformedbooksonline.com/topics/topics-by-subject/christian-living/religious-holidays/#:~:text=46.%206.%20And%20as%20for%20holy,questionable%20than%20to%20keep%20a%20lecture&amp;text=46.%206.%20And%20as%20for%20holy%20days%2C%20there&amp;text=no%20more%

<main class="wrap"><figure class="quote" id="q-42023b3dec" data-kw="" data-pol="">
<blockquote><p>It were a greater work to illustrate these great mysteries as they deserve, and I am unwilling to meddle with their obscene impurities, which are daily before the eyes and faces of all, that it may be understood that the mass, taken in the most choice form in which it can be exhibited, without any appendages, teems from head to foot with all kinds of impiety, blasphemy, idolatry, and sacrilege.</p></blockquote>
<figcaption>— <a href="../authors/john-calvin.html">John Calvin</a>, <cite>Institutes of the Christian Religion</cite>, 4.18.18</figcaption>
<div class="meta"><a class="tag" href="../topics/polemics/rome-mass.html">Rome: The Mass</a><a class="tag" href="../topics/church/lords-supper.html">The Lord&#x27;s Supper</a></div>

</figure><figure class="quote" id="q-c204f63b4a" data-kw="" data-pol="">
<blockquote><p>The Papists restrict or bind the worship of Christ to a thing, to which Christ has not restricted it by any express command; and in this way they declare themselves idolaters, no less than if they were to worship Christ at a wall, or if they were to adore him falling down before a pillar. From what has now been said, it is evident that the mass is an idol, formed by Anti-Christ out of various accursed errors and blasphemies, and substituted in the place of the Lord&#x27;s supper, which, for his reason, is properly and necessarily abolished.</p></blockquote>
<figcaption>— <a href="../authors/zacharias-ursinus.html">Zacharias Ursinus</a>, <cite>Commentary on the Heidelberg Catechism</cite>, On the Lord&#x27;s Supper (the Mass)</figcaption>

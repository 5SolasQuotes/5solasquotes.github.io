<main class="wrap"><figure class="quote" id="q-a85264f608" data-kw="against angel worship">
<blockquote><p>Are angels our intercessors with God, and is any religious worship due to them? We deny against the Romanists. Mediation and intercession by which they would carry our prayers up to God and by their patronage render us acceptable to him do not pertain to their ministry; nor is any religious worship due to them, for God alone is to be worshipped.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/francis-turretin.html">Francis Turretin</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Institutes of Elenctic Theology</cite>, 7.9.1–2</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/angels-and-demons/worship-of-angels.html">Worship of Angels</a> › <a href="../topics/angels-and-demons/worship-of-angels/against-angel-worship.html">Against angel worship</a></span></div>

</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-5569676ec3" data-kw="ministry angels heirs">
<blockquote><p>No one can doubt that God uses the ministry of angels, since they are called “ministering spirits” (Heb. 1:14), “ministers of God” (Ps. 104:4), who continually stand before him and minister unto him (Dan. 7:10) and do his will (Ps. 103:21). He uses their help not from necessity and indigence, but from indulgence and love—for the good of the angels themselves and for the good of the heirs of salvation.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/francis-turretin.html">Francis Turretin</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Institutes of Elenctic Theology</cite>, 7.8.1–2</span></figcaption>

<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/john-knox.html">John Knox</a></span><span class="wk"><span class="lbl">Work:</span> <cite>On Predestination</cite>, p. 30</span></figcaption>

</figure><figure class="quote" id="q-84f6615a61" data-kw="angel power limits">
<blockquote><p>Whatever the power of the angels (the greatest of all created power) may be, still it is finite and circumscribed by certain limits, so that although they can do many things, still they cannot do all things (since this power to do all things belongs to the omnipotent God alone). Scripture calls them excelling in strength (Ps. 103:20) and mighty angels (2 Thess. 1:7), yet their power is created and limited.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/francis-turretin.html">Francis Turretin</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Institutes of Elenctic Theology</cite>, 7.5.2</span></figcaption>

<div class="actions"><button class="copy" data-copy="“Whatever the power of the angels (the greatest of all created power) may be, still it is finite and circumscribed by certain limits, so that although they can do many things, still they cannot do all things (since this power to do all things belongs to the omnipotent God alone). Scripture calls them excelling in strength (Ps. 103:20) and mighty angels (2 Thess. 1:7), yet their power is created and limited.”

</figure><figure class="quote" id="q-bbd51f384d" data-kw="fall of angels">
<blockquote><p>What was the sin of the angels by which they are said to have rebelled against God? Sin in particular is distinguished with regard to the subjects in which it inheres: the sin of the angels, who became devils by it; and the sin of men. To no purpose is it inquired how angels could sin. It is evident from Scripture that they did sin and reason persuades us that they could fall into sin since they were created capable of falling.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/francis-turretin.html">Francis Turretin</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Institutes of Elenctic Theology</cite>, 9.5.1–2</span></figcaption>

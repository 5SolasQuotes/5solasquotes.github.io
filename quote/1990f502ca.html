<blockquote><p>Thirdly, so far as in you lieth give all diligence, that the foresaid Kirks, now freed of the Episcopal yoke, and purged from all the rites and dregs of Antichrist, be not drawn back to the same bondage, neither by fraud nor force. The Lord of his infinite goodness hath bestowed this favour on you, and hath put it in the heart of the King’s most excellent Majesty, that he will not have your necks pressed any longer with the yoke, or rather intolerable tyranny of Episcopal government, (we heartily congratulate with you in this your happiness.) But withal it is our desire, that ye lay your accompt, that if the neighbouring Kirks be drawn back to that yoke of bondage, (which God of his mercy avert) your liberty will not be long sure: for the enemies of the truth being strengthened by a new addition of forces, and increase of power, they will incessantly pursue you, that at last ye will yield, and of your own accord take on that iron yoke, which, though by a slow, yet by a sure pace, leadeth to utter destruction.

Ye ought therefore to strengthen and support the Kirks of England by your whole power, and to exhort them, that they come never again under that tyrannical yoke; but rather that they may stand courageously for the maintenance of their liberty (yet so, that they fall not on the other extreme, Anarchy, a more dangerous evil) yea, that they have not the least fellowship with any idolatrous rites or ceremonies. The Christian tabernacle no less then the Jewish ought to be built according to that pattern shewed in the Mount of the Scripture, so that there be not in the curtains thereof so much as a loop or a tach, but according to the prescript of God the only Law-giver.

Long experience hath taught us, that there is in such rites a secret and wonderful power to defile, if but the smallest part thereof be admitted, it will not long continue so, but speedily, like a gangrene, it will begin to spread, whilst at last it corrupt the whole worship, having lost the simplicity and purity of Christ’s institution. What? were she not a foolish and mad woman, who would adorn her self with ornaments borrowed from some vile harlot, supposing thereby the better to please her husband? What filthier harlot is there then the Romish strumpet, most accomplished in all sorts of spiritual villainies, surpassing all the bounds of impudency?

Let us never therefore be so demented, as to accompt the worship of God, most pure by Christ’s institution, to be more pleasing unto God, when it is performed with ornaments borrowed from the Romish Bordel [brothel]. Let us think that the Lord cannot but be highly offended, take away his holy Spirit, and depart far with the light of his grace, so soon as men begin to be so mad; then he suffereth them from day to day to sink deeper in the dunghill of superstitious rites, wherein they delight, while at last they be suffocated therein as it came to pass in the Papacy.

We confess indeed, that for things indifferent we like not to be contentious, neither left we the Romish Kirk for these or such like things; but for the denying of that only sacrifice of Christ in their Mass; for their adoration of a breaden god and of Saints, for their exalting the Pope above God, and for his tyranny; for their contempt &amp; prohibition of the use of Scripture; for justification by works, and hundreds more of that kind. If the Romish Kirk had been tainted only with some smaller blemishes, or had been defiled only with some indifferent rites; if for these we had departed from her we might have been justly taxed as Schismatics, yea, a generation of vipers, which bursting through the mother’s bowels, is not brought forth but by patricide.

But first having once departed for their accursed idolatry, and the Kirk being purged, to return back again unto Popish rites, once cast out, appeareth evidently to be extremely dangerous, by reason of the subtilty and restlessness of Satan.

2. Whosoever ceaseth not eagerly to press and to introduce these rites, though they perceive all things to be turned upside down thereby, they make manifest, that it is not for these ceremonies alone they stir up such troubles, but that they do secretly project some other thing

3. As for such ceremonies and rites as have their origin all from minds arrogant, and not contented with divine institution, &amp; to which an opinion of necessity is added, as if without these, holy things could not be decently gone about, and the worship but coldly performed; truly we cannot see how such ceremonies can be called indifferent.

Suffer never therefore (much honoured brethren) so far as is in you, that the English Kirks be forced to receive such ceremonies; but rather use all means that they and ye in Kirk-government may be brought to as near agreement as may be. Hence shall redound manifold and great utility.</p></blockquote>

<blockquote><p>Furthermore, we are members of the Reformed Church of England. We cannot forget the past. We protest for the pure unadulterated truth of primitive Catholic Christianity. We protest with our Articles and Homilies against the corruptions of Rome. A very large number of us believe the Church of Rome to be the Babylon of the Apocalypse. But at all events we protest with all our heart against any concordat or league with that fallen Church. We are Protestants, and we are not ashamed of the name.</p></blockquote>

<blockquote><p>That “the Revolution Settlement,” by which the liberties of the Church were secured, under the reign of William and Mary, was in all respects satisfactory, has never been maintained by this Church. On the contrary, various circumstances may be pointed out as hindering the Church from realizing fully the attainments that had been reached during the Second Reformation. Not only were the three kingdoms of England, Scotland, and Ireland, unprepared for prosecuting the work of “reformation and uniformity in religion” to which they had pledged themselves; but even in Scotland itself the reluctant concessions of statesmen were limited to what a people, worn out by long and heavy tribulation, were barely willing to accept as a relief; – and did not thoroughly undo the mischief of an age of misrule.

Thus, for instance, in the civil sanction then given to Presbytery, the Parliament of 1690, overlooking altogether the higher attainments of the Second Reformation, went back at once to the Act 1592, and based its legislation upon that Act alone, as being the original charter of the Presbyterian Establishment. Accordingly, it left unrepealed the infamous “Act Rescissory” of King Charles, by which all that the Church had done, and all that the State had done for her, in the interval between 1638 and the Restoration, had been stigmatized as treasonable and rebellious. Thus the Revolution Settlement failed in adequately acknowledging the Lord’s work done formerly in the land.

And it was, besides, in several matters of practical legislation, very generally considered by our fathers at the time to be defective and unsatisfactory. Some, and these not the least worthy, even went so far as to refuse all submission to it. But for the most part, our fathers, smarting from the fresh wounds of anti-Christian oppression, weary of strife, and anxious for rest and peace, either thankfully accepted, or at least acquiesced in it; in the hope of being able practically to effect under it the great ends which the Church had all along, in all her former contendings, regarded as indispensable.

For it would be in a high degree ungrateful to overlook the signal and seasonable benefits which the Revolution Settlement really did confer upon the Church, as well as upon the nation. Not only did it put an end to the cruel persecution by which the best blood of Scotland had been shed in the field, on the hill-side, and on the scaffold; not only did it reinstate in their several parishes the pastors who had been unrighteously cast out in the reign of the second Charles, and set up again the platform of the Presbyterian government; but by reviving and re-enacting the Statute of 1592, – the original charter and foundation of Presbytery, it recognised as an inalienable part of the constitution of this country the establishment of the Presbyterian Church.

It secured also effectually, as was then universally believed, the exclusive spiritual jurisdiction of the Church, and her independence in spiritual matters of all civil control. And by the arrangements which it sanctioned for the filling up of vacant charges, it abolished those rights of patronage which had been reserved in 1592, [Act 7th June 1690] and made provision for enforcing the fundamental principle of this Church, that “no pastor shall be intruded into a congregation contrary to the will of the people.” On all these grounds the Church was well entitled to rejoice in the deliverance wrought out for her in 1688 and 1690; to thank God for it, and take courage; and to cherish the warm and sanguine expectation of reaping now the fruit of her struggles and her trials, in a career of undisturbed, united and successful exertion, for the glory of her great Head, the good of the land, and the saving of many souls.</p></blockquote>

<div class="actions"><button class="copy" data-copy="“That “the Revolution Settlement,” by which the liberties of the Church were secured, under the reign of William and Mary, was in all respects satisfactory, has never been maintained by this Church. On the contrary, various circumstances may be pointed out as hindering the Church from realizing fully the attainments that had been reached during the Second Reformation. Not only were the three kingdoms of England, Scotland, and Ireland, unprepared for prosecuting the work of “reformation and uniformity in religion” to which they had pledged themselves; but even in Scotland itself the reluctant concessions of statesmen were limited to what a people, worn out by long and heavy tribulation, were barely willing to accept as a relief; – and did not thoroughly undo the mischief of an age of misrule.

Thus, for instance, in the civil sanction then given to Presbytery, the Parliament of 1690, overlooking altogether the higher attainments of the Second Reformation, went back at once to the Act 1592, and based its legislation upon that Act alone, as being the original charter of the Presbyterian Establishment. Accordingly, it left unrepealed the infamous “Act Rescissory” of King Charles, by which all that the Church had done, and all that the State had done for her, in the interval between 1638 and the Restoration, had been stigmatized as treasonable and rebellious. Thus the Revolution Settlement failed in adequately acknowledging the Lord’s work done formerly in the land.

And it was, besides, in several matters of practical legislation, very generally considered by our fathers at the time to be defective and unsatisfactory. Some, and these not the least worthy, even went so far as to refuse all submission to it. But for the most part, our fathers, smarting from the fresh wounds of anti-Christian oppression, weary of strife, and anxious for rest and peace, either thankfully accepted, or at least acquiesced in it; in the hope of being able practically to effect under it the great ends which the Church had all along, in all her former contendings, regarded as indispensable.

For it would be in a high degree ungrateful to overlook the signal and seasonable benefits which the Revolution Settlement really did confer upon the Church, as well as upon the nation. Not only did it put an end to the cruel persecution by which the best blood of Scotland had been shed in the field, on the hill-side, and on the scaffold; not only did it reinstate in their several parishes the pastors who had been unrighteously cast out in the reign of the second Charles, and set up again the platform of the Presbyterian government; but by reviving and re-enacting the Statute of 1592, – the original charter and foundation of Presbytery, it recognised as an inalienable part of the constitution of this country the establishment of the Presbyterian Church.

It secured also effectually, as was then universally believed, the exclusive spiritual jurisdiction of the Church, and her independence in spiritual matters of all civil control. And by the arrangements which it sanctioned for the filling up of vacant charges, it abolished those rights of patronage which had been reserved in 1592, [Act 7th June 1690] and made provision for enforcing the fundamental principle of this Church, that “no pastor shall be intruded into a congregation contrary to the will of the people.” On all these grounds the Church was well entitled to rejoice in the deliverance wrought out for her in 1688 and 1690; to thank God for it, and take courage; and to cherish the warm and sanguine expectation of reaping now the fruit of her struggles and her trials, in a career of undisturbed, united and successful exertion, for the glory of her great Head, the good of the land, and the saving of many souls.”

— General Assembly of the Free Church of Scotland, ‘Act and Declaration anent the Publication of the Subordinate Standards, and other Authoritative Documents of this Church. Edinburgh, 31 May 1851, Sess. 19’ in Acts of the General Assembly of the Free Church of Scotland, 1848-1852, (Edinburgh: John Greig, 1852), pp 303-04.">Copy</button><a class="share" href="https://x.com/intent/post?text=%E2%80%9CThat+%E2%80%9Cthe+Revolution+Settlement%2C%E2%80%9D+by+which+the+liberties+of+the+Church+were+secured%2C+under+the+reign+of+William+and+Mary%2C+was+in+all+respects+satisfactory%2C+has+never+been+maintained+by+this+Church.+On+the+contrary%2C+various+circumstances+may+be+pointed+out+as+hindering+the+Church+from+realizing+fully+the+attainments+that+had+been+reached+during+the+Second+Reformation.+Not+only+were+the+three+kingdoms+of+England%2C+Scotland%2C+and+Ireland%2C+unprepared+for+prosecuting+the+work+of+%E2%80%9Creformation+and+uniformity+in+religion%E2%80%9D+to+which+they+had+pledged+themselves%3B+but+even+in+Scotland+itself+the+reluctant+concessions+of+statesmen+were+limited+to+what+a+people%2C+worn+out+by+long+and+heavy+tribulation%2C+were+barely+willing+to+accept+as+a+relief%3B+%E2%80%93+and+did+not+thoroughly+undo+the+mischief+of+an+age+of+misrule.%0A%0AThus%2C+for+instance%2C+in+the+civil+sanction+then+given+to+Presbytery%2C+the+Parliament+of+1690%2C+overlooking+altogether+the+higher+attainments+of+the+Second+Reformation%2C+went+back+at+once+to+the+Act+1592%2C+and+based+its+legislation+upon+that+Act+alone%2C+as+being+the+original+charter+of+the+Presbyterian+Establishment.+Accordingly%2C+it+left+unrepealed+the+infamous+%E2%80%9CAct+Rescissory%E2%80%9D+of+King+Charles%2C+by+which+all+that+the+Church+had+done%2C+and+all+that+the+State+had+done+for+her%2C+in+the+interval+between+1638+and+the+Restoration%2C+had+been+stigmatized+as+treasonable+and+rebellious.+Thus+the+Revolution+Settlement+failed+in+adequately+acknowledging+the+Lord%E2%80%99s+work+done+formerly+in+the+land.%0A%0AAnd+it+was%2C+besides%2C+in+several+matters+of+practical+legislation%2C+very+generally+considered+by+our+fathers+at+the+time+to+be+defective+and+unsatisfactory.+Some%2C+and+these+not+the+least+worthy%2C+even+went+so+far+as+to+refuse+all+submission+to+it.+But+for+the+most+part%2C+our+fathers%2C+smarting+from+the+fresh+wounds+of+anti-Christian+oppression%2C+weary+of+strife%2C+and+anxious+for+rest+and+peace%2C+either+thankfully+accepted%2C+or+at+least+acquiesced+in+it%3B+in+the+hope+of+being+able+practically+to+effect+under+it+the+great+ends+which+the+Church+had+all+along%2C+in+all+her+former+contendings%2C+regarded+as+indispensable.%0A%0AFor+it+would+be+in+a+high+degree+ungrateful+to+overlook+the+signal+and+seasonable+benefits+which+the+Revolution+Settlement+really+did+confer+upon+the+Church%2C+as+well+as+upon+the+nation.+Not+only+did+it+put+an+end+to+the+cruel+persecution+by+which+the+best+blood+of+Scotland+had+been+shed+in+the+field%2C+on+the+hill-side%2C+and+on+the+scaffold%3B+not+only+did+it+reinstate+in+their+several+parishes+the+pastors+who+had+been+unrighteously+cast+out+in+the+reign+of+the+second+Charles%2C+and+set+up+again+the+platform+of+the+Presbyterian+government%3B+but+by+reviving+and+re-enacting+the+Statute+of+1592%2C+%E2%80%93+the+original+charter+and+foundation+of+Presbytery%2C+it+recognised+as+an+inalienable+part+of+the+constitution+of+this+country+the+establishment+of+the+Presbyterian+Church.%0A%0AIt+secured+also+effectually%2C+as+was+then+universally+believed%2C+the+exclusive+spiritual+jurisdiction+of+the+Church%2C+and+her+independence+in+spiritual+matters+of+all+civil+control.+And+by+the+arrangements+which+it+sanctioned+for+the+filling+up+of+vacant+charges%2C+it+abolished+those+rights+of+patronage+which+had+been+reserved+in+1592%2C+%5BAct+7th+June+1690%5D+and+made+provision+for+enforcing+the+fundamental+principle+of+this+Church%2C+that+%E2%80%9Cno+pastor+shall+be+intruded+into+a+congregation+contrary+to+the+will+of+the+people.%E2%80%9D+On+all+these+grounds+the+Church+was+well+entitled+to+rejoice+in+the+deliverance+wrought+out+for+her+in+1688+and+1690%3B+to+thank+God+for+it%2C+and+take+courage%3B+and+to+cherish+the+warm+and+sanguine+expectation+of+reaping+now+the+fruit+of+her+struggles+and+her+trials%2C+in+a+career+of+undisturbed%2C+united+and+successful+exertion%2C+for+the+glory+of+her+great+Head%2C+the+good+of+the+land%2C+and+the+saving+of+many+souls.%E2%80%9D%0A%0A%E2%80%94+General+Assembly+of+the+Free+Church+of+Scotland%2C+%E2%80%98Act+and+Declaration+anent+the+Publication+of+the+Subordinate+Standards%2C+and+other+Authoritative+Documents+of+this+Church.+Edinburgh%2C+31+May+1851%2C+Sess.+19%E2%80%99+in+Acts+of+the+General+Assembly+of+the+Free+Church+of+Scotland%2C+1848-1852%2C+%28Edinburgh%3A+John+Greig%2C+1852%29%2C+pp+303-04.&amp;url=https%3A%2F%2F5solasquotes.github.io%2Fquote%2F2269b34d3b.html&amp;via=5Solas" target="_blank" rel="noopener">Share on X</a><a class="perma" href="../quote/2269b34d3b.html">Permalink</a><a class="src" href="https://reformedcovenanter.wordpress.com/2019/10/09/the-general-assembly-of-the-free-church-of-scotland-1851-and-the-revolution-settlement/" rel="noopener" target="_blank">Read it online · Reformed Covenanter</a></div>

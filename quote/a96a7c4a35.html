<main class="wrap"><figure class="quote" id="q-a96a7c4a35" data-kw="will necessary free">
<blockquote><p>Does God will some things necessarily and others freely? We affirm. Because good is either uncreated and infinite or finite and created, a twofold object can be assigned to the will: a primary (viz., God) as the infinite good; but the secondary (all created things out of God). Himself, indeed, necessarily by complacency, but all other things freely by decree.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/francis-turretin.html">Francis Turretin</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Institutes of Elenctic Theology</cite>, 3.14.1</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/attributes-of-god/will-of-god.html">Will of God</a> › <a href="../topics/attributes-of-god/will-of-god/free-and-necessary-will.html">Free and necessary will</a></span></div>

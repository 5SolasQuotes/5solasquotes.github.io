<main class="wrap"><figure class="quote" id="q-e1e520d100" data-kw="">
<blockquote><p>The Jewish way under the law of praising the Lord was upon the timbrel, the harp, psaltery, and ten-stringed instruments, and other instruments of music that belonged to the ceremonial worship that is now abolished. Christ, who is the end of the law, has torn or taken away the ceremonies of the law, and there is no warrant now to make use of the organs, as they do in the Popish Church, and the Prelatic Church of England, and even among them that are more reformed, those over in Holland. Oh, but we have a great advantage in being free of these!</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/richard-cameron.html">Richard Cameron</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Sermon on Psalm 92 (undated) in Sermons in times of persecution in Scotland, by sufferers for the royal prerogatives of Jesus Christ</cite></span></figcaption>

</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-b0c7e74abf" data-kw="">
<blockquote><p>Also whatever is a profession in fact, of a false religion by ceremonies indifferent, and yet proper to a false religion, is a denying of the true religion; but the using of these ceremonies, used by Papists and Jews is such; Therefore… The proposition [above] is Scripture, Gal. 2:14, Peter lived after the manner of the Jews in using the religious materials of the Jews, though he had no Jewish intention or opinion; yea, Acts 10, he disputes against that: So circumcision, Gal. 6:14-15, is put for the Jewish Church. Now altars, organs, Jewish ephods, or surplice, Mass-clothes, and Romish crossing, bowing to altars, images, are badges of Jewish and Popish religion:</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/samuel-rutherford.html">Samuel Rutherford</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Divine Right of Church Government</cite>, (1646), Question 3, ‘Whether Ceremonies Have any Divinity in Them’, pp. 142-143</span></figcaption>

</figure><figure class="quote" id="q-e5c71266e4" data-kw="">
<blockquote><p>But there is another intention not religious: if a child read a chapter of the Bible that he may learn to read and spell, that is an action of art, not of worship; because the object of the child’s reading is not Scripture as Scripture, but only the printed characters as they are, signa rerum ut rerum, non ut rerum sacrarum, ‘signs of things, not of holy things’; And here the object, not being religious, the intrinsic operation cannot raise up any religious intention of the child. Upon this ground it is easy to determine whether or no[t] an intention of worship be essential to worship or not. The former intention, which is intrinsic, and intentio operis [the intention of the operation], may be essential, it resulting from the object; but the latter intention of the worker, is so far extraneous to worship, as whether it be or be not the nature of worship, [that it] is not impaired, nor violated.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/samuel-rutherford.html">Samuel Rutherford</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Divine Right of Church Government</cite>, ... (1646), Intro, section 6, p. 89. Rutherford uses a different example, which applies to the question.</span></figcaption>

r" target="_blank">Read it online · Reformed Books Online</a></div>
</figure><figure class="quote" id="q-4843d0e5f4" data-kw="">
<blockquote><p>A second characteristic of Puritan worship was its utter simplicity and sincerity. This unostentatious and modest form of worship found its appropriate domestic setting in meeting-houses… The Puritans refused to let the pealing organ blow To the full-voiced quire below In service high and anthems clear… in favour of the pedestrian metres of the Psalms so that all could memorize them and sing them in unison… their sense of holiness in approaching God was so strong that they could do without any theatrical or adventitious aids which would make tawdry the splendour of the Creator’s covenant mercies to his own.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/horton-davies.html">Horton Davies</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Worship &amp; Theology in England, from Cranmer to Baxter and Fox</cite>, 1534-1690, pp. 530-31</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/worship/musical-instruments-in-worship.html">Musical Instruments in Worship</a></span></div>

</figure><figure class="quote" id="q-08dc83f3c9" data-kw="">
<blockquote><p>The use of instruments in worship was admittedly part of the Temple service. It had no place in the Tabernacle before David’s day, beyond the use of two silver trumpets made by Moses, in the hands of the priests. There is not a particle of evidence to show that it entered into the ordinary worship of the family or the synagogue. We are now prepared to take a step further, and note that, in the Temple service, it was uniformly and most closely associated with sacrifice and the burning of incense. …[T]he playing on instruments was confined to those bands of Levites whom David was training in anticipation of the building of the temple—these acting in this for and as representing the whole people. …1 Chron xxiii.26–32. It is very plain from this passage that the service of praise as conducted by the Levitical choirs with musical accompaniment, was associated with the regular morning and evening sacrifice, and with other sacrifices.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/robert-nevin.html">Robert Nevin</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Instrumental Music in Christian Worship</cite>, 2nd edition, rev. (Londonderry: Bible and Colportage Society, 1873), 29, 30.</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/worship/musical-instruments-in-worship.html">Musical Instruments in Worship</a></span></div>

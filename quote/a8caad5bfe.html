<main class="wrap"><figure class="quote" id="q-a8caad5bfe" data-kw="">
<blockquote><p>Therefore submit yourselves to every ordinance of man for the Lord’s sake, whether to the king as supreme, or to governors, as to those who are sent by him for the punishment of evildoers and for the praise of those who do good. (1 Peter 2:13-14)

Quest. Why is the Magistracy called an ordinance of man v. 13. seeing all powers are ordained of God, and every power is the ordinance of God, Rom. 13. 1. 2.

Answ. The superiority of power, or government it self is simply and absolutely commanded by God, and in that respect is called the ordinance of God; but this or that special manner of power or government is not determined by God, but by men; and is therefore called an ordinance of man, which as touching the nature of it, may also be called an ordinance of God: And this is the difference betwixt an Ecclesiastical and a civil office. An Ecclesiastical office is not legitimate, if it be not directly determined by God himself, and consequently cannot be changed by men: but this or that civil office may be made &amp; changed by men. And the reason of the difference is this, because God and Christ alone hath dominion and power in spiritual matters; but in civil matters men are also [g]ods, though not absolute.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/william-ames.html">William Ames</a></span><span class="wk"><span class="lbl">Work:</span> <cite>An analytical exposition of both epistles of the apostle Peter, illustrated by doctrines out of every text. And applied by their uses, for a further progress in holiness</cite>, (London, 1641), p. 58.</span></figcaption>

</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-de0aa54e5c" data-kw="">
<blockquote><p>So to draw the ox out of the ditch, and to lead cattle to watering, I take it to be a work of mercy, as tending to the preservation of life in a dumb creature. In like sort the dressing [preparing] of meat for the health of man’s body, I take to be a work of mercy. So that the performing of these in reference to the end whereto they tend, I take to be of necessary duty (as here they are called works of necessity) and consequently not permitted only, but commanded also in the general, though not in this [fourth] commandment; but in the Second Commandment of the Second Table only…</p></blockquote>

</figure><figure class="quote" id="q-9db19e5262" data-kw="">
<blockquote><p>As to [John Brown of Wamphray’s charge of the partially conforming Scottish ministers] being robbed of the key of discipline, Wamphray, exaggerating, means partially so, so far as the presbyteries were restricted in certain ways by the bishops, and that externally, whereas much of the spiritual discipline of Christ could still be fulfilled through the pastors’ ministries (as our [English puritan] authors below will profoundly show) and presbyteries. All Church order and discipline, be reminded, as to being performed in specific circumstances, is a matter of decency, order and edification, and is limited thereto (1 Cor. 14:26, 40).¹ ¹ See ‘How All Church Governing May be Practically Done unto Edification’ and ‘On How Church Discipline is Limited to Edification in its Time &amp; Place, etc.’ at ‘On the Ordinances, Order &amp; Policy of the Church’ (RBO) In a passage the puritans often commented on to our purpose, Dt. 12:8–11, God’s people were to put off their enjoined, stated worship ordinances while they were in the wilderness (in that broken and declining Church-state) till they came “to the rest and to the inheritance,” when God would give “you rest from all your enemies round about, so that ye dwell in safety. Then… shall ye bring all that I command you, your burnt offering, and your sacrifices…” One key factor, the passage says, for legitimately omitting whole swaths of public discipline and worship is ‘that ye dwell in safety.’… … Heb. 3:2 says, in a comparison with Christ, “Moses was faithful in all his house.” Yet Moses and the Israelites in Ex. 8:25–26 (in that broken and declining Church-state) were not sacrificing to God in Egypt so as not to scandalize the Egyptians and for their physical safety, for “will they not stone us?” Thus Moses (the prophetic mouthpiece here before Pharoah) reasoned regarding sacrificing animals before their enemies: “It is not meet so to do.” Yet God heard the Israelites’ prayers and accepted their moral obedience unto Him (Ex. 1:21; 2:24; 3:7; 4:31; 6:5; 9:20; 14:13, 31), which they did not transgress even when in danger of their lives (Ex. 1:17), in contrast to omitting public worship ordinances.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/travis-fentiman.html">Travis Fentiman</a></span><span class="wk"><span class="lbl">Work:</span> <cite>“Editor’s Extended Introduction” in English Puritans, A Refutation of the Errors of Separatists</cite>, (1604; RBO, 2025), pp. 155-56</span></figcaption>

<blockquote><p>23rd Question. After the ministry of the Word and the seals thereof, how is the collection for the saints to be administered? Answer. The collection for the saints was by the apostles’ ordinance, to be made: for the time, every Lord’s Day; for the measure, as God has prospered every man; for the manner, not of constraint, but freely and willingly, brought by the givers as an offering to the Lord, and laid down, as at first before the apostles, so afterwards by their appointment before the deacons of the Church as into a common treasury, by them to be distributed to the supply of the ministry, and of the poor saints, according to their need, and of outward service of the Church.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/john-cotton.html">John Cotton</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Doctrine of the Church</cite>, … (London, 1644), p. 8</span></figcaption>

<div class="actions"><button class="copy" data-copy="“23rd Question. After the ministry of the Word and the seals thereof, how is the collection for the saints to be administered? Answer. The collection for the saints was by the apostles’ ordinance, to be made: for the time, every Lord’s Day; for the measure, as God has prospered every man; for the manner, not of constraint, but freely and willingly, brought by the givers as an offering to the Lord, and laid down, as at first before the apostles, so afterwards by their appointment before the deacons of the Church as into a common treasury, by them to be distributed to the supply of the ministry, and of the poor saints, according to their need, and of outward service of the Church.”

<main class="wrap"><figure class="quote" id="q-97d15e8c3b" data-kw="">
<blockquote><p>Thus, dear sir, I have traced your separating project through diverse periods of the Church under the Old and New Testament: And, having given you touches at the good old way of our Lord Himself, the prophets and apostles, I have pondered these matters again and again, and have had the occasion to know the thoughts of the brightest lights of this and other reformed Churches, who all are of the same sentiments on this weighty head, and do jointly express their high detestation of schisms, which yet never came up the length of your new project. Pardon me to say it, I love to live and die with the cloud of witnesses, and especially with such great and eminent worthies; and have often been put to say it solemnly before the Lord, Let not my soul enter into the secret of your schismatical courses.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/john-currie.html">John Currie</a></span><span class="wk"><span class="lbl">Work:</span> <cite>An Essay on Separation: or a Vindication of the Church of Scotland contra the Seceders</cite></span></figcaption>
<div class="meta"><span class="t"><a href="../topics/the-church/schism-and-separation.html">Schism and Separation</a></span></div>

<blockquote><p>2. The second assembly is a classis [presbytery] of many pastors and elders from sundry congregations who have power of excommunication, (1) in respect [case] that the person excommunicated does keep company with many consociated [associated] churches and so as a leaven may infect many (1 Cor. 5:4; Matt 26:59; John 11:47; Acts 20:17,18); (2) and for this cause, one pastor of a single congregation, is not able to ordain a pastor (because it wants example in the Word of God). Therefore a college of presbyters, or a presbytery of pastors and elders, who have power larger than a session, even to excommunicate and ordain pastors, is necessary in the church, which ordains Timothy to be a pastor, and so may deprive and excommunicate him (1 Tim. 4:14, Acts 20:17,18,28,29). … In church censures we proceed thus: In private faults if a brother offend a brother, he is admonished alone by the offended. If that gain him not, he is admonished before two or three; if that prevail not, the matter is brought before the church, which has power of the keys; if he obey not the church, he is excommunicated (Matt 18:15-20). … 3. Our third censure is the greater excommunication, which is done by the whole congregation, as all other censures, but in diverse ways: (1) by the presbytery or eldership judicially and authoritatively, (2) by Paul his pastoral spirit (1 Cor. 5:4), the minister in the church’s name pronouncing the sentence (1 Tim. 1:20), (3) and by the people…</p></blockquote>

<blockquote><p>Whatever have been the effects and fruit of meetings of persons of diverse families in times of corruption or trouble (in which cases many things are commendable which otherwise are not tolerable) yet, when God has blessed us with peace and purity of the Gospel, such meetings of persons of diverse families (except in cases mentioned in these Directions)¹ are to be disapproved, as tending to the hindrance of the religious exercise of each family by itself, to the prejudice of the public ministry, to the renting of the families of particular congregations, and (in process of time) of the whole Kirk, besides many offenses which might come thereby, to the hardening ofthe hearts of carnal men, and grief of the godly.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/john-currie.html">John Currie</a></span><span class="wk"><span class="lbl">Work:</span> <cite>An Essay on Separation: or a Vindication of the Church of Scotland contra the Seceders</cite></span></figcaption>

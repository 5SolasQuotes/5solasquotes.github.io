<main class="wrap"><figure class="quote" id="q-4bcf8b609c" data-kw="">
<blockquote><p>If further inquiring into the characteristics of the aionion, still keeping its formal aspect rather than its substantial content in view, the first feature obtruding itself is that of the imperishableness, including the unchangeableness, of the things pertaining to it. Paul declares, almost after the manner of an axiomatic truth: “the things which are seen are temporal; but the things which are not seen are eternal,” 2 Cor. 4:17. At first this reads like a differentiating appraisal of the visible and the invisible, something reminding of the antithesis between the two worlds of the ideal and the sense-things with Plato. A closer examination of the words in their context will soon convince that this exegesis would convey only part of the meaning, and for the other part produce a wrong perspective. The emphasis does not rest on the seen versus the unseen, but on the fact that the former, under the present circumstances happens to consist of perishable things, whereas the other under the same circumstances possesses the nature of the eternal, of what from its very nature cannot perish, because it carries the principle of eternity in itself. A permissable paraphrase would be: the things that in this lower, preliminary, state engage our interest are transitory and corruptible; the things which in the present dispensation the believer cannot yet lay hold of by vision are the eternal, incorruptible realities. It goes without saying, that the distinction thus interpreted partakes not of the nature of a cool, disinterested diagnosis of metaphysical difference; there is a degree of pathos in the declaration, occurring s it does in a highly emotional context. Paul is conscious of σκοπευν “looking at,” that is contemplating with interest the makeup of the invisible world. Only,this mode of contemplation is with the Apostle not induced by the invisibleness of the things in question; in the abstract he practices no cult of the invisible as partaking per se of a superior complexion; that would be a Hellenic thought; but he has learned to recognize in the things unseen to the present aion the enduring things of the world to come, a world already in principle present, the contemplation of which can consequently render solace and support in the affliction of the moment. That thus and thus only the stress is rightly divided will be perceived from the closely following word: “for we pilgrimage through a land of faith, not of sight,” 2 Cor. 5:7. Here the unseen things of th either passage are precisely the things of future sight, deriving their spreme value from this prospective visibleness, whilst the walking through a region of faith is felt precisely as a matter of relative lack of importance.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/geerhardus-vos.html">Geerhardus Vos</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Pauline Eschatology</cite>, 191–92.</span></figcaption>

</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-d1540f6e1e" data-kw="">
<blockquote><p>Fifthly, it is not superstition to do the same material thing which another does superstitiously; if we have not the same superstitious conceit of it as he has. If a Papist should anoint the sick as a sacrament, and a protestant do it as a medicine, the former is superstition and not the latter. And so in other things. Sixthly, whether that indifferent thing remain indifferent to our use which others use to superstition is a case which a judicious collation of circumstances must determine. His superstitious use does not make it simply a sin in any other who has none of his false conceits and ends (else some superstitious persons so abusing meat and drink and clothes and all things in the world might make all things become unlawful to us: or at least deprive us of all our liberty in things indifferent). Seventhly, if we avoid another’s superstition as to the form or intention which makes it superstition, and this as a sin, we do well: If we avoid the matter itself which he uses superstitiously, because it is by him made scandalous, we do our duty, when it is scandalous indeed, and no contrary greater accident maketh it our duty. But if we take it to be simply superstition or sin to do materially the same action which a superstitious person does, we are superstitious in avoiding his superstitious act.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/richard-baxter.html">Richard Baxter</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Direction 58, ‘Take heed of Superstition, and observe well the circular course of zealous superstition</cite>, …’ in The Cure of Church Divisions… (London, 1670), pt. 1, pp. 278-95, pp. 285-86</span></figcaption>

<blockquote><p>We may… try to conceive the landscape, and the parish features generally, as the new incumbent [John Macmillan of Balmaghie] saw them in 1701… The dress of the people was on a par with their homes and fare. A Galloway man wore constantly, even in church, his broad blue bonnet, made in Kilmarnock… Young girls at home wore no head-covering, but snooded their locks with a piece of string or ribbon. At fair or church, they wore white linen mutches [linen caps], slightly plaited above the brow. The farmers’ wives covered their heads with coarse white linen toys [linen or wool headdresses that hang down over the shoulders] when they went a-visiting.¹ ¹ For all the above, I have drawn on Nicholson’s History, II. 332-339.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/henry-m-reid.html">Henry M. Reid</a></span><span class="wk"><span class="lbl">Work:</span> <cite>A Cameronian Apostle: being Some Account of John Macmillan of Balmaghie</cite>, (London: Gardner, 1896), pp. 50, 52</span></figcaption>

<blockquote><p>And in the seventh chapter [Jn. 7:23], He defends this fact of his, saying, ‘If a man upon the Sabbath receive circumcision, that the law of Moses should not be broken; be ye angry with Me, because I haue made a man every whit whole on the Sabbath day?’ If the law of circumcision do bind men to minister and receive it upon the Sabbath, then much more does the law of love bind men to show mercy upon the Sabbath, seeing that it is appointed of God, not to hinder us from, but to further us in all his works, among which the relieving of them that be in necessity, is one of the chief and principal. And as the Lord Jesus Christ came not to destroy the law, but to fulfill it, so He observed it very carefully in this point, and being most full of compassion, did declare it abundantly, by taking all oportunity to succour them that were in misery, even upon the Sabbath, as the fittest time for it.</p></blockquote>

<blockquote><p>5. It is observed, that David’s psalms were sung formerly with musical instruments, as the harp, timbrel, and cymbal, and organs; and why not with these now? If these are to be disused, why not singing itself? I answer, these are not essential to singing, and so may be laid aside, and that continue; it was usual to burn incense at the time of prayer, typical of Christ’s mediation, and of the acceptance of prayer through it; that is now disused; but prayer being a moral duty, still remains: the above instruments were used only when the church was in its infant-state, and what is showy, gaudy, and pompous, are pleasing to children; and as an ancient writer observes, “these were fit for babes, but in the churches (under the gospel-dispensation, which is more manly) the use of these, fit for babes, is taken away, and bare or plain singing is left.” As for organs… were first introduced by a pope of Rome, Vitalianus, and that in the seventh century, and not before.</p></blockquote>

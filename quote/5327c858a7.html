<main class="wrap"><figure class="quote" id="q-5327c858a7" data-kw="">
<blockquote><p>Amongst all the attempts of distinguishing the Acts of God’s Will in reference unto Christ, and Sinners, whatever I considered, I never found any more slight Atheological, and discrepant from the Truth, then this of Grotius.

To measure the Almighty by the Standard of a man, and to frame in the mind a mutable Idol, instead of the Eternal, Unchangeable God, is a Thing that the fleshly Reasonings of dark understandings are prone unto. Feigns the Lord in one Instant Angry, afterwards promising to cease to be so, then in another instant laying down his Anger, and taking up a contrary affection, and you seem to me, to do no less.

What it may be esteemed in Law, which was that Author’s faculty, I know not: but suppose in Divinity, that (notwithstanding the manifold Attempts of some …) the ascribing unto the most holy, things alien, and opposite unto his glorious nature, is by common consent, accounted no less then blasphemy: whither this be here don, or no, may easily appear. I hope then without the offence of any, I may be allowed to call those Dictates of Grotius to the Rule, and Measure of Truth.

1 Before the fore-sight of the Death of Christ (saith he) God is angry with Sinners, but not wholly averse from all ways of laying aside that Anger.

Answ. 1 That God should be conceived angry after the manner of men, or with any such kind of Passion, is gross Anthropomorphism; as bad, if not worse, then the assigning of him a bodily shape. The Anger of God is a pure Act of his Will, whereby he will effects and inflict the Effects of Anger. Now what is before the fore-sight of the Death of Christ, is certainly from Eternity. God’s Anger must respect either the purpose of God, or the Effects of it. The latter it cannot be, for they are undoubtedly all temporal. It must be then his purpose from Eternity to inflict punishment, that is the Effect of Anger.

This then is the First thing in the business of Redemption assigned by Grotius, unto the Lord. viz. He purposed from Eternity, to inflict punishment on Sinners: and on what sinners? even those, for whom he gives Christ to die, and afterwards receives into favour, as he expresseth himself. Behold here a Mystery of Vorstian Theology: God changing his eternal purposes. This Arminius at first could not down withal, inferring from hence, That the Will of God differed not from his Essence, that every act thereof, is, 1 Most Simple: 2 Infinite: 3 Eternal: 4 Immutable: 5 Holy. Reason itself would fain speak in this Cause, but that the Scriptures do so abound, many places are noted in the Margin. Ja. 1. 17. 2 Tim. 2. 19. Ps. 33. 9, 10, 11. Acts. 15. 18. &amp;c. may be added. A mutable god, is of the dunghill.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/john-owen.html">John Owen</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Of the death of Christ, the price he paid, and the purchase he made. Or, the satisfaction, and merit of the death of Christ cleared, the universality of redemption thereby oppugned: and the doctrine concerning these things formerly delivered in a treatise against universal redemption vindicated from</cite>, (London: Peter Cole, 1650), pp 36-38.</span></figcaption>

</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-816ed4b644" data-kw="">
<blockquote><p>5. We know the Tabernacle and Temple were corporal things made with hands and that they are things different from the spiritual things that they signify, as the sign and the thing signified; as therefore the Lord is express in the elements and rites of the Supper of the Lord, because all of them, bread, wine, taking, eating, breaking, pouring out the wine, drinking, are teaching and edifying signs; and our Lord never left it to the wisdom of men to devise signes to teach themselves: So in like manner, should the Lord expressly specify all the teaching and signifying signs in the Old Testament; and as Moses might devise none of his own, but was tied to follow the pattern which the Lord Himself showed to him in the mount: So are we now under the New Testament tied to the pattern of that same will revealed in the Word; and it is laid on us not to be wise above that which was written; and it is of perpetual equity: The supreme Lawgiver never left it to the wisdom of angels, or men, or prophet, apostle or Church, to serve and worship God as they thought good: But He Himself particularly prescribed the way, signs, and means: And because God has not been pleased in the New Testament to specify types of Christ incarnate, and come in the flesh already; therefore are we obliged in conscience to believe, and practise no more, either in doctrinals, or teaching types, or positives of Church-policy, than our pattern in the mount, the Scripture has warranted to us, to be the will of God…</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/samuel-rutherford.html">Samuel Rutherford</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Divine Right of Church Government</cite>, (1646), pp. 49-50</span></figcaption>

</figure><figure class="quote" id="q-8eb3be1fc7" data-kw="">
<blockquote><p>This sacrament, therefore, consists in the rite and the promise annexed to it, or in the signs and the things signified. The rite, or signs are the bread which is broken and eaten, and the wine which is poured out, and drunk. The things signified are the broken body, and shed blood of Christ, which are eaten and drunk, or our union with Christ by faith, by which we are made partakers of Christ and all his benefits, so that we derive from him everlasting life, as the branches draw their life from the vine.</p></blockquote>

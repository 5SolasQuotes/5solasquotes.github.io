</figure><figure class="quote" id="q-3acdf84736" data-kw="">
<blockquote><p>The second note whereby we may discern a judicial law to be moral for his equity, is this: If it follow necessarily and immediately from the light, principles and conclusions of nature. For example, Dt. 22:5, ‘The man shall not put on the things that appertain to the woman, nor the woman the things that appertain to the man.’ This law is more than judicial: for it is a rule of common honesty: practiced in those countries, by the light of nature, where the written law was never known…. This I speak… to show how far judicial laws have morality in them and stand in force.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/william-perkins.html">William Perkins</a></span><span class="wk"><span class="lbl">Work:</span> <cite>A Commentary or Exposition, upon the Five First Chapters of the Epistle to the Galatians</cite>, (Cambridge, 1604), p. 234</span></figcaption>

</figure><figure class="quote" id="q-1d9b9fecdf" data-kw="">
<blockquote><p>Let us not own the way of God by halves, but wholly, fully, and in all things. And particularly, he is against our noble and faithful declaration, published at Sanquhar, whereby that wretched tyrant, Charles Stuart, and all his accomplices, were cast off by us, as we ought; which alas! was too long a doing: and by this he buries the blood, and condemns the faithful testimonies of so many worthies who have died upon that head, and therein have been eminently owned and assisted of the Lord. Indeed, herein he will run this subterfuge, and say, he acknowledges he ought to be rejected and deposed; yea, he may possibly grant that he deserveth death, both by the laws of God and the just laws of man; yet he cannot see how that can be done without another magistrate or magistrates. But we would answer, if he sees no other ways than those, he is but blind, and that is deceitful and double dealing; for magistrates have no power but what is derivative from the people; and magistrates have nothing actually, but what the people have virtually; yea, and more than virtually, for they may actually confer it upon whom they think most fit, for the power of government is natural and radical to them, being unitedly in the whole, and singularly in every one. So whatever magistrates may do, the people may do the same, either when they want magistrates, or when the magistrates fail and refuse to do their duty.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/james-renwick.html">James Renwick</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Letter to Henry Jenkinson, 3 Oct. 1682 in Thomas Houston (ed.), Spiritual support and consolation in difficult times: the letters of the Rev. James Renwick, the last of Scotland’s covenanted martyrs, with and introduction, containing a historical sketch of Renwick’s life, labours, and martyrdom, and</cite></span></figcaption>
<div class="meta"><span class="t"><a href="../topics/civil-government-and-society.html">Civil Government and Society</a></span></div>
<div class="actions"><button class="copy" data-copy="“Let us not own the way of God by halves, but wholly, fully, and in all things. And particularly, he is against our noble and faithful declaration, published at Sanquhar, whereby that wretched tyrant, Charles Stuart, and all his accomplices, were cast off by us, as we ought; which alas! was too long a doing: and by this he buries the blood, and condemns the faithful testimonies of so many worthies who have died upon that head, and therein have been eminently owned and assisted of the Lord. Indeed, herein he will run this subterfuge, and say, he acknowledges he ought to be rejected and deposed; yea, he may possibly grant that he deserveth death, both by the laws of God and the just laws of man; yet he cannot see how that can be done without another magistrate or magistrates. But we would answer, if he sees no other ways than those, he is but blind, and that is deceitful and double dealing; for magistrates have no power but what is derivative from the people; and magistrates have nothing actually, but what the people have virtually; yea, and more than virtually, for they may actually confer it upon whom they think most fit, for the power of government is natural and radical to them, being unitedly in the whole, and singularly in every one. So whatever magistrates may do, the people may do the same, either when they want magistrates, or when the magistrates fail and refuse to do their duty.”

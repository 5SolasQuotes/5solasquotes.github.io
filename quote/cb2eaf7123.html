<main class="wrap"><figure class="quote" id="q-cb2eaf7123" data-kw="">
<blockquote><p>When we demand the use of reason and logic, we no more turn them into the foundations, principles, and rules of faith than we do our eyes, ears, and tongues without which we can neither learn nor teach our religion, nor defend it against opponents. For us they are, therefore, means and requirements without which there is no faith or theological knowledge, but they are certainly not principles, norms, rules, and foundations.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/gisbertus-voetius.html">Gisbertus Voetius</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Appendix 2, ‘The Use of Reason In Matters of Faith’ in Introduction to Reformed Scholasticism</cite>, ed. Joel R. Beeke &amp; Jay T. Collier, trans. Albert Gootjes (Reformation Heritage Books, 2011), p. 12</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/theology/faith-and-reason.html">Faith and Reason</a></span></div>

</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-22c305050e" data-kw="">
<blockquote><p>Althought God is not manifest to the senses comprehensively as he is in himself, yet he can be perceived apprehensively as shining in his works, appearing in signs, heard in the word and manifested in the fabric of the whole universe. (2) It is a false assumption that there is nothing in the intellect which was not before in some sense. For universals are in the intellect and never were in any sense. A mind is known as also an angel, yet they are never pereceived or seen except from their effects. Why therefore may not God be most certainly known in the mind from his works and a posteriori, although we cannot perceive Him with our eyes or any of the other bodily senses.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/francis-turretin.html">Francis Turretin</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Institutes of Elenctic Theology</cite>, (P&amp;R), vol. 1, 3rd topic, question 1, “Can the existence of God be irrefutably demonstrated against atheists? We affirm”, sect. 22, p. 177</span></figcaption>

</figure><figure class="quote" id="q-e4ffb2adec" data-kw="">
<blockquote><p>6. Some theological writers dispute whether theology is to be called speculative (speculativa), affective (affectiva), or practical (practica)—as if one were to ask whether fire is motive (motivus), illuminative (illuminativus), or warming (calefactivus), or whether the human soul is vitally active (vitaliter activa), intellective (intellectiva), or volitive (volitiva). But just as this virtue is one in the three essential characters of the soul (animæ), so also true theology is essentially science-affective-practical (scientia-affectiva-practica), adapted to the perfection of the intellect (intellectus), of the will (voluntatis), and of practice (praxeos); although equivocally its purely speculative part, as such, could be called theology.

7. Theology therefore is not fully defined as the doctrine (doctrina) — or science (scientia) — of God; nor as the doctrine of living unto God, nor as the doctrine of glorifying God and saving men, etc. As it is here to be defined, it is the salutary doctrine, science-affective-practical, of the Kingdom of God over men (de Regno Dei super hominibus). By the Kingdom of God we always intend to include dominion and love — (or paternity, paternitatem). Moreover, the Kingdom of God is a paternal kingdom with most absolute dominion: on account of the poverty of a single name and to avoid prolixity, with the rest understood, I most often name it simply the Kingdom of God; but if this name pleases less, it may not ineptly be called the family of God, or the Theocracy (theocratiam).</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/richard-baxter.html">Richard Baxter</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Method of Christian Theology</cite>, (London: White &amp; Snowden, 1681), pt. 1, ch. 1, pp. 31-32 tr. AI Stiven Peter Latin</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/theology/faith-and-reason.html">Faith and Reason</a></span></div>

<main class="wrap"><figure class="quote" id="q-17a98c4e84" data-kw="">
<blockquote><p>For though Christ the Lord at the last supper instituted and delivered to the Apostles this venerable sacrament under the forms of bread and wine, yet that institution and administration do signify that all the faithful are by an enactment of the Lord to receive under both forms (Chapter 1) It declares furthermore, that in the dispensation of the sacraments…the Church may, according to circumstances, times and places, determine or change whatever she may judge most expedient for the benefit of those receiving them or for the veneration of the sacraments; and this power has always been hers” (Chapter 2). …Wherefore from the beginning of the Christian religion the use of both forms has not been infrequent, yet since that custom has already very widely changed, holy mother Church, cognizant of her authority in the administration of the sacraments, has induced by just and weighty reasons, approved this custom of communicating under either species and has decreed that it be considered the law, which may not be repudiated for changed at pleasure with the authority of the Church. (Chapter 2) …If anyone says that each and all the faithful of Christ are by a precept of God or by the necessity of salvation bound to receive both species of the most holy sacrament of the Eucharist, let him be anathema (Canon 1).</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/the-council-of-trent.html">The Council of Trent</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Session 21, (16 July 1562)</cite></span></figcaption>
<div class="meta"><span class="t"><a href="../topics/the-lords-supper.html">The Lord&#x27;s Supper</a></span></div>

</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-5fae02486d" data-kw="unworthy">
<blockquote><p>The reasons are: (1) from the institution and the example of Christ. Christ broke the bread and all the evangelists, and Paul, who individually relate this, agree that he did. Now who would affirm that the Son of God in so sacred an action did anything superfluous, or that all the apostles would have related this with so great carefulness, if the thing was merely indifferent and free? Who, on the other hand, does not see that Christ wished to prescribe the sacramental rites and ceremonies by his example and command when he ordered his disciples “to do this” (i.e., with respect to those administering, to take the bread, to bless, to break and give it to the communicants)? Again, there ought to be the same reason for the breaking as the giving of thanks and for the distribution because it is placed between them. Now no one denies that these latter ceremonies are necessary, belonging to the instituted rite and not merely indifferent.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/francis-turretin.html">Francis Turretin</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Institutes of Elenctic Theology</cite>, 19.24</span></figcaption>

</figure><figure class="quote" id="q-e844ecfaff" data-kw="">
<blockquote><p>It is evident, however, from the apostolic history, that the Apostles used whatever kind of bread was at hand. There is no significance either in the kind of bread or in the form of the loaf. It is enough that it is bread. This makes it the proper emblem of Him who declared himself to be the true bread which came down from heaven.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/morton-h-smith.html">Morton H. Smith</a></span><span class="wk"><span class="lbl">Work:</span> <cite>See wiki for a bio. This quote was compiled by Andy Webb | “1. The first element that Jesus took from the table was the bread. This being the Jewish Passover, this bread had to be unleavened bread, since that was the only bread allowed at this feast. (See Exodus 12:15 ). It may be questioned whether there was any requirement that the bread be unleavened in the New Testament practice. This question is legitimate, if we understand that the Lord’s Supper was observed in connection with regular meals. Hodge says:</cite></span></figcaption>

m%20heaven&amp;text=It%20is%20evident%2C%20however%2C%20from%20the%20apostolic%20history&amp;text=the%20true%20bread%20which%20came%20down%20from%20heaven" rel="noopener" target="_blank">Read it online · Reformed Books Online</a></div>
</figure><figure class="quote" id="q-6286596b73" data-kw="">
<blockquote><p>Were it that we had no precept of Christ to [‘Do this’] but only the example of his doing it in the first institution, this should be a rule for us to observe it punctually, excepting in such circumstances which only occasionally and accidentally happened therein… Which doctrine we are now to try by the judgement of antiquity… In the days of Pope Julius, anno 337, there arose many giddy spirits which violated the holy institution of Christ in this sacrament when as some consecrated milk instead of wine, others sopped the bread in the cup, a third sort squeezed grapes there-into. These, and the like, that holy Pope did condemn, but how? By pretense of custom only? No, but by the obligation of Christ, his example, and institution of this sacrament, in these words following: Because these are contrary (says he) to evangelical and apostolical doctrine and ecclesiastical custom, as is easily proved from the fountain of truth, from whence the sacraments had their first ordinance; for when our Master of Truth commended this to his disciples, He gave to none milk, but bread only, and the cup. Nor does the Gospel mention the sopping of bread, but of giving bread apart, and the cup also apart, etc. So Pope Julius [see the original latin]. Long after this, the Council of Braccara (about the year of our Lord, 675) [footnote] withstood the complemental custom of receiving both kinds [of bread and wine] in dipped sops, but wot [know] you why? Hearken, even because it is not revealed in the Gospel of Christ’s institution. Ponder the Testimony in the margin [of the book] and you shall find it point-blank contradictory to your opinion and practice. Which reasoning of the bishops of that council had been very loose and lavish, except they had believed that the form of institution of Christ, concerning the participation of both kinds, was as commandatory as well for the people as the priest.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/thomas-reformed-anglican-morton.html">Thomas Reformed Anglican Morton</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Lords Supper or, A Vindication of the Sacrament (1656)</cite>, pp. 62-3</span></figcaption>

</figure><figure class="quote" id="q-9438919582" data-kw="">
<blockquote><p>This toleration of drunkards and swearers in the Lord’s Church and at his Table infects and is apt to leaven all with their evil conversation, but does not leaven the worship to the fellow-worshippers, nor is the sin of private persons, yea nor of our ministers, who have not power to help it (but it is the fault of the Church), except you make no separation from a Church where a scandalous person is tolerated (for suffering more or fewer does not vary the species) to be a sin publicly to be repented, before any can be members of your Church, which is prodigious to us.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/samuel-rutherford.html">Samuel Rutherford</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Due Right of Presbyteries... (1644), pt. 2, ch. 4, section 5</cite>, pp. 193-94</span></figcaption>

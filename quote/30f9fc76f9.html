<main class="wrap"><figure class="quote" id="q-30f9fc76f9" data-kw="">
<blockquote><p>It may be asked, how could this be found out, for the election of God is hid, and cannot be known without the special revelation of the Spirit; and as every one is made sure of his own election by the testimony of the Spirit, so he can know nothing certain of others. To this I answer, that we are not curiously to inquire about the election of our brethren, but ought on the contrary to regard their calling, so that all who are admitted by faith into the church, are to be counted as the elect; for God thus separates them from the world, which is a sign of election. It is no objection to say that many fall away, having nothing but the semblance; for it is the judgment of charity and not of faith, when we deem all those elect in whom appears the mark of God’s adoption. And that he does not fetch their election from the hidden counsel of God, but gathers it from the effect, is evident from the context; for afterwards he connects it with the sanctification of the Spirit. As far then as they proved that they were regenerated by the Spirit of God, so far did he deem them to be the elect of God, for God does not sanctify any but those whom he has previously elected.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/john-calvin.html">John Calvin</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Commentary on the Catholic Epistles</cite>, on 1 Peter 1:1–2, trans. John Owen (Logos Bible Software, 2010), 24.</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/effectual-calling.html">Effectual Calling</a></span></div>

</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-aadbe6f3cc" data-kw="">
<blockquote><p>Then Christianity, its chief residence, its royal-sent, is in the spirit of a man, and so He is one after the spirit. ‘Be ye renewed in the spirit of your minds,’ Eph. 4:23. As it is of a high descent, so it must have the highest and most honorable lodging in all the creation, that is, the spirit of a man, without this there is no room else fit for it, and suitable to it, in this lower world; ‘My son give me thine heart,’ says wisdom, Prov. 23:26. It cares for nothing besides, if it get not the heart, the inmost cabinet of the imperial city of this isle of man, for ‘out of it are the issues of life,’ that flow into all the members. Do not think that grace will lodge one night in your outward man, that you can put on Christianity upon your countenance or conversation without; except you admit it into your souls, it can have no suitable entertainment there alone, it’s of a spiritual nature, and it must have a spirit to abide in. Everything is best preserved and entertained by things suitable to its nature; such do incorporate together, and inbosom one with another, whereas things keep a greater distance with things different in nature; a flame will die out among cold stones, without oily matter. This heavenly fire that is descended into the world can have nothing earthly to feed upon; it must die out except it get into the immortal spirit, and then furnish (to speak so) perpetual nourishment to it, till at length all the spirit be set on flame and changed, as it were, into that heavenly substance, to mount up above from whence it came. Do not think, my beloved, to superinduce true religion upon your outside, and within to be as rotten sepulchers: You must either open your hearts to Christ or else He will not abide with you; such a noble guest will not stay in the suburbs of the city if you take Him not into the palace; and truly the palace of our hearts is too unworthy for such a worthy guest, it has been so defiled by sin; how vile is it? but if you would let him enter, He would wash it and cleanse it for Himself.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/hugh-binning.html">Hugh Binning</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Sinner’s Sanctuary</cite>, … (d. 1653; Edinburgh: Swintown, 1670) | sermon 16, on Rom. 8:4-5, p. 124</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/effectual-calling/means-of-calling.html">Means of Calling</a></span></div>

</figure><figure class="quote" id="q-5a473ccb61" data-kw="">

</figure><figure class="quote" id="q-d1ee3d3ea9" data-kw="against moral suasion">
<blockquote><p>Hence of two to whom the same grace is offered, if one is converted while the other remains unbelieving, the reason is not to be found (according to them) in the grace (which is the same), but in the disposition of the subject or man, because the one draws the bolt, the other does not (i.e., one rejects the grace which the other admits). Thus what they seem to give largely with one hand (preaching that the beginning, progress and complement of all our good is from grace), they secretly steal away with the other, maintaining that the mode of that operation is such that man can always resist it.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/francis-turretin.html">Francis Turretin</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Institutes of Elenctic Theology</cite>, 15.6.3</span></figcaption>

<main class="wrap"><figure class="quote" id="q-d097d6f387" data-kw="">
<blockquote><p>There is a difference between blasted trees and barren trees [Jude 12, 19]. And yet St. Jude condemns not nature utterly, as though there were no goodness in it, for many excellent things are done by the light and instinct of nature, though not available to salvation:</p></blockquote>

</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-e33149f1c9" data-kw="">
<blockquote><p>Again it is alleged that God by express law gave leave to the Israelites to marry heathenish women taken captives in war. (Dt. 21:10-11) Answer: That is a law only of toleration, without approbation, in which God, for the hardness of their hearts, permits the evil, which cannot by policy be quite taken away. And this appears by two things: First, before the marriage, the woman by God’s appointment must be deformed, by cutting off her hair, by the growing of her nails, by putting off the garments of her captivity, and by mourning for her father and mother for the space of a month: and the end of this was to cause a dislike in the Israelites of their intended marriages, or to signify a change of religion, at the least in pretense, in the parties espoused…</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/william-perkins.html">William Perkins</a></span><span class="wk"><span class="lbl">Work:</span> <cite>‘A Warning Against the Idolatry of the Last Times, &amp; an Instruction touching Religious or Divine Worship’ in The Works (London: Legatt, 1626), vol. 1</cite>, p. 692</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/civil-government-and-society/natural-law-and-civil-law.html">Natural Law and Civil Law</a></span></div>

</figure><figure class="quote" id="q-5a2e4d1aaa" data-kw="">
<blockquote><p>XII. Tenth, we must always distinguish between the state of the church constituted and the state of the church to be constituted; the tranquil and well-ordered state and the same perturbed and corrupted. Many things are lawful in a disturbed condition of the state which would not be lawful in a peaceful and well-composed condition, where all things are rightly ordered and done according to the laws. For then necessity (which knows no law) does many lawful things which (if the necessity was removed) would have to be blamed.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/francis-turretin.html">Francis Turretin</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Institutes ed. Dennison, Jr. (P&amp;R), vol. 3, 18th Topic, Question 23</cite>, p. 219</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/civil-government-and-society/natural-law-and-civil-law.html">Natural Law and Civil Law</a></span></div>

<blockquote><p>This text is a translation of Wolfgang Musculus’ commentary on Psalm 15 and his related appendices on the topics of oaths and usury. In these selections from his expansive exegetical work, Musculus presents a theological exposition of the psalm and gives guidance in matters of enduring relevance for Christian living—particularly how to preserve truth and honesty in one’s relationships, speech, and economic practices.</p></blockquote>

</figure><figure class="quote" id="q-70b13233de" data-kw="">
<blockquote><p>Hence it [polygamy] might be lawful in the court of earth (so as to obtain immunity from civil and ecclesiastical punishments among men), but not in the court of heaven before God. … XXIX. As to divorce, God neither simply commanded nor permitted it, but only wished to restrain by fixed laws the facility of divorces which prevailed among the Jews against the natural law of marriage, so as to regulate the mode of an unlawful thing, not however to make it lawful. Hence Christ says that God ‘permitted’ or ‘tolerated’ it ‘because of the hardness of heart of the Jews’ (Mt. 19:8).</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/francis-turretin.html">Francis Turretin</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Institutes, vol. 2, 11th Topic, 2nd Question, ‘The Nature of the Moral Law’, section 26 &amp; 29</cite>, pp. 15-16</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/civil-government-and-society/natural-law-and-civil-law.html">Natural Law and Civil Law</a></span></div>

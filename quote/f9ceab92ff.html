<main class="wrap"><figure class="quote" id="q-f9ceab92ff" data-kw="">
<blockquote><p>He prescribes not a rule necessary every where to be observed; but accommodates himself unto the custom then observed among the Corinthians. It is admirably expounded by Alting… Almost all Christians have observed the canon of the apostle. Not because the uncovering of the head is counted a token of reverence; for with a very great part of the world it is not so to this day. But as my [Herman] Witsius thinks, Videtur potius perinere ad libertatem Novi Testamenti [This seems to more pertain to the liberty of the New Testament].</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/cotton-mather.html">Cotton Mather</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Biblica Americana, America’s First Bible Commentary, vol. 9 (†1652; Tubingen: Siebeck, 2018)</cite>, p. 265 on 1 Cor. 11:4</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/worship/head-coverings-in-worship.html">Head Coverings in Worship</a></span></div>

</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-d6eadf723f" data-kw="">
<blockquote><p>Let us, however, bear in mind, that in this matter the error is merely in so far as decorum is violated, and the distinction of rank which God has established, is broken in upon. For we must not be so scrupulous as to look upon it as a criminal thing for a teacher to have a cap on his head, when addressing the people from the pulpit. Paul means nothing more than this — that it should appear that the man has authority, and that the woman is under subjection, and this is secured when the man uncovers his head in the view of the Church, though he should afterwards put on his cap again from fear of catching cold. In fine, the one rule to be observed here is το πρέπον — decorum If that is secured, Paul requires nothing farther.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/john-calvin.html">John Calvin</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Commentary on 1 Cor. 11, | v. 4</cite></span></figcaption>

</figure><figure class="quote" id="q-6e8ed5adda" data-kw="">
<blockquote><p>The very attire which nature and custom of all times and places have taught women to put on, confirms the same: as long hair, vails, and other coverings over the head: this and the former argument does the Apostle himself use to this very purpose, 1 Cor. 11:7, etc.</p></blockquote>

</figure><figure class="quote" id="q-f6d80689e0" data-kw="">
<blockquote><p>Uncovering of the head: Though this last be not adoration, but a national sign of reverence, and is not every where adoration; yet Abulensis says, the Jews did pray and sacrifice with covered heads: So says Virgil, and Lod. Vives: Therefore the Corinthians had this from the Grecians as a civil sign of gravity, which should not be banished from God’s worship.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/samuel-rutherford.html">Samuel Rutherford</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Divine Right of Church Government... (1646)</cite>, ch. 1, p. 144</span></figcaption>

— Samuel Rutherford, The Divine Right of Church Government... (1646), ch. 1, p. 144">Copy</button><a class="share" href="https://x.com/intent/post?text=%E2%80%9CUncovering+of+the+head%3A+Though+this+last+be+not+adoration%2C+but+a+national+sign+of+reverence%2C+and+is+not+every+where+adoration%3B+yet+Abulensis+says%2C+the+Jews+did+pray+and+sacrifice+with+covered+heads%3A+So+says+Virgil%2C+and+Lod.+Vives%3A+Therefore+the+Corinthians+had+this+from+the+Grecians+as+a+civil+sign+of+gravity%2C+which+should+not+be+banished+from+God%E2%80%99s+worship.%E2%80%9D%0A%0A%E2%80%94+Samuel+Rutherford%2C+The+Divine+Right+of+Church+Government...+%281646%29%2C+ch.+1%2C+p.+144&amp;url=https%3A%2F%2F5solasquotes.github.io%2Fquote%2Ff6d80689e0.html&amp;via=5Solas" target="_blank" rel="noopener">Share on X</a><a class="perma" href="../quote/f6d80689e0.html">Permalink</a><a class="src" href="https://reformedbooksonline.com/topics/topics-by-subject/worship/head-coverings-in-public-worship/gillespie-rutherford-on-headcoverings-in-public-worship/#:~:text=Uncovering%20of%20the%20head%3A%20Though%20this,not%20be%20banished%20from%20God%E2%80%99s%20worship." rel="noopener" target="_blank">Read it online · Reformed Books Online</a></div>
</figure><figure class="quote" id="q-eb9354003c" data-kw="">
<blockquote><p>Chrysostom shows that it was the manner of the heathen Grecians to come to prayer covered thus, and Beza alleges Plutarch speaking of the Romans, that they worshipped their gods being covered and bowing their heads. Wherefore it was necessary for the apostle to admonish them hereof, there being some doubtless, who notwithstanding the order before settled at Corinth, did cleave to this their superstitious manner still… Here is no ground then for being bareheaded in the congregation, as some imagine, nor yet for the preachers being bareheaded, but that he may wear a little cap to defend him from the cold, as Calvin allows, or a hat, where the order of the Church is such in token of authority, as Beza contends, and is the manner of the French Church, because howsoever it was then, now it is a sign of authority amongst men to be covered, and of subjection to be uncovered. The only thing to be gathered hence is that all should be held with such reverence of the public place, as that they should do nothing unseemly there, of what sex or condition soever they be.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/john-mayer.html">John Mayer</a></span><span class="wk"><span class="lbl">Work:</span> <cite>A Commentary upon All the Epistles of the Apostle Saint Paul... (London, 1631), on 1 Cor. 11 Mayer (1583–1664) was an English clergyman, who, it appears, conformed at 1662. | Question 2</cite></span></figcaption>
<div class="meta"><span class="t"><a href="../topics/worship/head-coverings-in-worship.html">Head Coverings in Worship</a></span></div>

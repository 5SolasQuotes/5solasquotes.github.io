<main class="wrap"><figure class="quote" id="q-785a7f3e2d" data-kw="">
<blockquote><p>Neither do we herein at all make way for that cursed doctrine of Socinianism, than which a more venomous was never sucked from so sweet and saving a truth, That because salvation is a free gift, Christ therefore did not suffer for the satisfaction of God’s wrath, nor pay any legal price for the salvation of the world, nor lay down himself in our room, as the ransomer of us, and purchaser of life for us, but became incarnate in the flesh, made under the law, obedient unto death, only for an example of patience and humility unto us, not for a propitiation to his Father, and reconcilement of the world unto God.

A price was paid, and that so precious, as that the confluence of all created wealth into one sum, cannot carry the estimate of one farthing in comparison of it; and indeed it ought to be a price more valuable than the whole world, which was to ransom so many souls, the loss of the least whereof cannot, by the purchase of the whole world, be countervailed. A price it was, valuable only by him that paid and received it, by us to be enjoyed and adored, by God only to be measured.

Neither could it stand with the truth and constancy of God’s law, with the sacredness and majesty of his justice, to suffer violation and not revenge it; and when all his attributes are in him one and the same thing, to magnify his mercy, not by the satisfaction, but the destruction of his justice, and so to set his own unity at variance with itself.

Mercy and truth, righteousness and peace, they were, in man’s redemption, to kiss, and not to quarrel with each other: God did not disunite his attributes, when he did reunite his church unto himself. A price then was paid unto God’s justice, and eternal life is a purchase by Christ bought, but still unto us a gift, not by any pains or satisfaction of ours attained unto, but only by him who was himself given unto us, that together with himself he might give us all things.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/edward-reynolds.html">Edward Reynolds</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Meditations on the Holy Sacrament of the Lord’s Last Supper</cite>, (1638) in The Whole Works of the Right Rev. Edward Reynolds, D.D., ed. Alexander Chalmers (6 vols, London, 1826), iii, 61-62.</span></figcaption>

<blockquote><p>Christ as Redeemer executes the offices of prophet, priest; and king. These offices are essentially distinct, each has its own peculiar province, but they are necessarily and inseparably connected one with another, and all of them are indispensable to the accomplishment of his work as Mediator. As a prophet, he proclaims the will of God; as a priest, he makes satisfaction for sin, and pleads the efficacy of his atoning sacrifice; as a king, he applies the redemption he has purchased, so as to secure the full and eternal blessedness of those for whom it was designed.

Were he not a prophet, the plan of salvation would have remained unknown; were he not a priest, there would have been no glad tidings to publish to a fallen world; were he not a king, his instructions would have been without efficacy, and his sacrifice would have proved altogether unavailing to the salvation of those for whom he died. It is his office as a king which gives perfection and efficacy to his offices as a priest and as a prophet, and secures the great ends for which he taught and suffered — for which his blood was shed on Calvary, and carried within the vail. Were he not a king, he would not be a Saviour.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/james-ewing.html">James Ewing</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Christ, King of Zion in The Free Church Pulpit; Consisting of Discourses by the Most Eminent divines of the Free Church of Scotland. Vol. I.</cite></span></figcaption>
<div class="meta"><span class="t"><a href="../topics/priestly-office-satisfaction-and-atonement.html">Priestly Office: Satisfaction and Atonement</a></span></div>

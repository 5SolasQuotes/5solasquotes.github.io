<main class="wrap"><figure class="quote" id="q-9faa36859e" data-kw="">
<blockquote><p>3rd Doctrine. Temporary obedience does often turn aside a temporary punishment. Verse 26. ‘So He departed from him, etc.’ Zipporah here not of any devotion, but of necessity, circumcised her son, yet it pleased God so to accept of this forced obedience that he spared Moses: So many times a temporary and external obedience does turn away a temporal punishment: as Ahab’s sackcloth put off the punishment threatened, that it came not in his days. So the Samaritans’ corrupt worship of God delivered them from the lions, 2 Kings 17 (vv. 24-33). [So Josias] Simler. [Johannes] Piscator. If God be so pleased sometime with outward service, accepting the small beginnings of those that are coming unto Him: how much more acceptable unto Him is the true spiritual worship?</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/andrew-willet.html">Andrew Willet</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Hexapla in Genesin &amp; Exodum: that is, A Sixfold Commentary</cite>, … (d. 1621; London: 1633) | on Ex. 4, 4. Places of Doctrine</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/worship/impurities-in-worship.html">Impurities in Worship</a></span></div>

</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-33a1038d43" data-kw="">

</figure><figure class="quote" id="q-a03a02f258" data-kw="">
<blockquote><p>I confess their Common-Prayer is my burden, by reason of its defects and disorder, and the rudeness of the ministerial method. I stand convinced it ought to be altered; yea, abolished… yet I must confess I find in it no matter to which (on a charitable interpretation) a sober serious Christian may not say, nay, can deny his ‘Amen’. And though I distaste the ministerial method, I cannot disown in it the essential form of prayer, (viz.) A calling upon God in the Name of Christ… nor do I see on what ground I can deny, or refuse my ‘Amen’ to what is prayed for… because they are rudely and unfittingly expressed, whilst the irregularity of that common order is no bar to God’s acceptance of my more regular ‘Amen’ thereunto given.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/zachary-crofton.html">Zachary Crofton</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Reformation, Not Separation, or, Mr. Crofton’s Plea for Communion with the Church</cite>, … in a Letter, written July 20, 1661… (1662), p. 25 Crofton (1626-1672) was a presbyterian and puritan born and raised in Ireland.</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/worship/impurities-in-worship.html">Impurities in Worship</a></span></div>

20given" rel="noopener" target="_blank">Read it online · Reformed Books Online</a></div>
</figure><figure class="quote" id="q-c2d3663182" data-kw="">
<blockquote><p>I now come to that which you yourself also acknowledge, that all human inventions are not at once to be condemned. For it was clearly a human invention that we communicate [in the Lord’s Supper] in the morning, rather than after dinner: and it was a human invention that the prices of things that were sold in the primitive Church were laid at the apostles’ feet… I pass over that they who defend these things will be able to put forward some honest and just meaning not alien from the Scripture… But, if by this there is given occasion of error to the weak, let them be advised to regard these things as indifferent; let them be taught by sermons, not to judge the worship of God as placed in these things… Neither do I think that tyranny is instantly brought in if any indifferent thing be appointed to be done in the Church and be constantly performed by many. At this day we so administer the Eucharist in the morning time, that after dinner we will not have the communion in the sacred assembly [In the New Testament the Eucharist was always administered in the evening]. But who will say, that this, which we all do with the like will and consent is tyrannical? To myself truly, as I have now often mentioned, it would be more agreeable that we should only do what Christ did and delivered to his apostles. But, if any indifferent things have been added, I would not now sharply strive on this account; especially when we see that they by whom the light of the Gospel has been greatly promoted in England, and can be yet more promoted, oppose themselves to us. I acknowledge indeed with you that ‘whatsoever is not of faith is sin.’ (Rom. 14:23). But what the apostle wrote to Titus seems, above all things, to promote our having a quiet conscience in our actions: ‘Unto the pure all things are pure;” and to Timothy, “Every creature of God is good.” But it is not necessarily required that we should show express mention in holy Scripture of the particular things which we use: this is enough to know by faith, on the whole— that indifferent things cannot defile those who live with a pure and sincere mind and conscience… but I yet thought that the use of these differences was not in itself or its own nature ungodly or of fatal consequence, provided other things which are prescribed to us by the Word of God remain sound.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/peter-martyr-vermigli.html">Peter Martyr Vermigli</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Gorham, Gleanings of a few scattered ears during the period of the Reformation in England</cite>, (London, 1857), Letter 53, ‘Martyr to Bishop [John] Hooper’, Nov. 4, 1550, pp. 189-90, 92, 94-96</span></figcaption>

</figure><figure class="quote" id="q-a0de9be550" data-kw="">
<blockquote><p>…the first administration of the Lord’s Supper by our Savior, which was a pattern of all after-administrations, and therefore most exact and perfect in point of essentials. It wanted [lacked] nothing essentially belonging unto the administration of the Lord’s Supper… But now it was by Christ administred unto a Church which was not presbyterated (if we understand the term in regard of ruling elders). And therefore to have ruling elders in a church is not essential, but accidental unto the administration of the Lord’s Supper. And therefore the mere absence or want of them (especially when it is by the default of others only) is no sufficient bar against administration of the Lord’s Supper… as because Christ gave the Lord’s Supper only unto men; therefore it follows that it is lawful to administer the Lord’s Supper unto a congregation made up only of men, which is a thing usual in ships at sea and amongst merchants trading in remote parts: even so because Christ gave the Lord’s Supper unto a Church destitute of ruling elders; therefore the administration of it unto a Church that now is destitute of ruling elders is lawful, as being agreeable unto the practice of Christ in the first administration thereof.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/henry-jeanes.html">Henry Jeanes</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Want</cite>, [Lack] of Church-Government [is] No Warrant for a Total Omission of the Lord’s Supper… (London, 1650) Jeanes (1611–1662) was a presbyterian minister in London., p. 20</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/worship/impurities-in-worship.html">Impurities in Worship</a></span></div>
<div class="actions"><button class="copy" data-copy="“…the first administration of the Lord’s Supper by our Savior, which was a pattern of all after-administrations, and therefore most exact and perfect in point of essentials. It wanted [lacked] nothing essentially belonging unto the administration of the Lord’s Supper… But now it was by Christ administred unto a Church which was not presbyterated (if we understand the term in regard of ruling elders). And therefore to have ruling elders in a church is not essential, but accidental unto the administration of the Lord’s Supper. And therefore the mere absence or want of them (especially when it is by the default of others only) is no sufficient bar against administration of the Lord’s Supper… as because Christ gave the Lord’s Supper only unto men; therefore it follows that it is lawful to administer the Lord’s Supper unto a congregation made up only of men, which is a thing usual in ships at sea and amongst merchants trading in remote parts: even so because Christ gave the Lord’s Supper unto a Church destitute of ruling elders; therefore the administration of it unto a Church that now is destitute of ruling elders is lawful, as being agreeable unto the practice of Christ in the first administration thereof.”

<main class="wrap"><figure class="quote" id="q-86e5c042d6" data-kw="">
<blockquote><p>These good works, done in obedience to God’s commandments, are the fruits and evidences of a true and lively faith: and by them believers manifest their thankfulness, strengthen their assurance, edify their brethren, adorn the profession of the gospel, stop the mouths of the adversaries, and glorify God, whose workmanship they are, created in Christ Jesus thereunto, that, having their fruit unto holiness, they may have the end, eternal life.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/westminster-assembly.html">Westminster Assembly</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Westminster Confession of Faith</cite>, 16.2</span></figcaption>

<blockquote><p>His grace, therefore, necessarily brings along with it &quot;newness of life,&quot; (Rom 6:4,) because they who still are the slaves of sin make void the blessing of redemption; but now we are released from the bondage of sin, in order that we may serve the righteousness of God.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/john-calvin.html">John Calvin</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Commentaries on the Epistles to Timothy, Titus, and Philemon</cite>, Titus 2:14</span></figcaption>

</figure><figure class="quote" id="q-4edd2b580c" data-kw="">
<blockquote><p>Yet he is not so careful about good works as to despise the root — that is, faith — while he is gathering the fruits. He takes account of both parts, and, as is highly proper, assigns the first rank to faith; for he enjoins those &quot;who believed in God&quot; to be zealous of &quot;good works;&quot; by which he means that faith must go before in such a manner that good works may follow.</p></blockquote>

</figure><figure class="quote" id="q-d0b90c6748" data-kw="">
<blockquote><p>This infallible assurance doth not so belong to the essence of faith, but that a true believer may wait long, and conflict with many difficulties before he be partaker of it: yet, being enabled by the Spirit to know the things which are freely given him of God, he may, without extraordinary revelation, in the right use of ordinary means, attain thereunto. And therefore it is the duty of everyone to give all diligence to make his calling and election sure, that thereby his heart may be enlarged in peace and joy in the Holy Ghost, in love and thankfulness to God, and in strength and cheerfulness in the duties of obedience, the proper fruits of this assurance; so far is it from inclining men to looseness.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/westminster-assembly.html">Westminster Assembly</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Westminster Confession of Faith</cite>, 18.3</span></figcaption>

</figure><figure class="quote" id="q-c699849847" data-kw="">
<blockquote><p>Faith, therefore, without works, is dead. We are saved by faith. But salvation includes deliverance from sin. If, therefore, our faith does not deliver us from sin, it does not save us. Antinomianism involves a contradiction in terms.</p></blockquote>

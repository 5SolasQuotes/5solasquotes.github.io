<main class="wrap"><figure class="quote" id="q-90b837260d" data-kw="">
<blockquote><p>1st Conclusion. Monuments or instruments of idolatry are of two sorts, either: [1.] Such things as have no other use at all but to contribute sorne subservient influence in or unto idolatrous worship, and because these have all their warrant from a mere commandment of man, they are simply not necessary, as the graven image, the idols themselves, all positive observances in God’s worship destitute of any command of God; and the use of these in any case must be scandalous and so unlawful because… [2.] But there be other things that are instruments of idolatry and subservient thereunto, in a common and physical influence, as a temple builded to the honor of a saint and for the adoring of images, and for the reading and opening the Word of God in the New and Old Testament, though in a corrupt way; these are not properly monuments of idolatry. Now the house or Church, as such is no monument, nor useless instrument in worship, such as is a surplice, a human holy day, for it has, as such, being a thing of walls and timber, no other than that very same physical influence in worshipping either the true God or a saint, that it has in civil use, in our ordinary dwelling, to wit, to fence our bodies in religious, in natural, in civil actions from injuries of heaven, clouds, and sin. The adjuncts of the Church, as crucifixes, images, altars, ravels, mass-clothes and the like, are properly monuments and instruments of idolaty, because these are not necessary, as is the material house, nor have they any common and physical influence in the worship, as the temple has, yea all the necessity or influence that they have in the worship is only religious and human flowing from the will of men, without either necessity from our natural constitution of body, or any word of Scripture, and therefore they are to be removed upon this ground, because they are unnecessary snares to idolatry… …An house for the worship of God is amongst the things that are necessary by way of disjunction in specie, not in individuo; that is, a house is necessary, in its physical use, to fence off our bodies, the injuries of sun, air and heaven, but not this house, for another house may serve the turn as conveniently.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/rutherford-s-conclusion.html">Rutherford’s Conclusion</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Divine Right of Church Government</cite>, … (1646), Appendix, ‘An Introduction to Scandal’, Question 6, ‘A Further Consideration of Things Not Necessary &amp; How They be Scandalous Objects’, pp. 62-3</span></figcaption>

</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-6f3b8e10fc" data-kw="">
<blockquote><p>And if it be said man’s soul cannot be painted, but his body may, and yet that picture represents a man; I answer, it does so, because he has but one nature, and what represents that represents the person; but it is not so with Christ: his Godhead is not a distinct part of the human nature, as the soul of man is (which is necessarily supposed in every living man), but a distinct nature, only united with the manhood in that one person, Christ, who has no fellow; therefore what represents Him must not represent a man only, but must represent Christ, Immanuel, God-man, otherwise it is not his image. Beside, there is no warrant for representing Him in his manhood; nor any colorable possibility of it, but as men fancy; and shall that be called Christ’s portraiture? would that be called any other man’s portraiture which were drawn at men’s pleasure, without regard to the pattern? Again, there is no use of it; for either that image behoved to have but common estimation with other images, and that would wrong Christ, or a peculiar respect and reverence, and so it sins against this commandment that forbids all religious reverence to images, but He being God and so the object of worship, we must either divide his natures, or say, that image or picture represents not Christ.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/james-durham.html">James Durham</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Law Unsealed: or a Practical Exposition of the Ten Commandments</cite>, … (Edinburgh: D. Schaw, 1802), p. 68</span></figcaption>

</figure><figure class="quote" id="q-51cebe7f05" data-kw="">
<blockquote><p>Concerning the humanity of our blessed Savior, that being a creature he might be depicted, I mean it was naturally capable of it: it was the great instrument of many actions, it conversed with mankind above thirty years together, it was the subject of great changes, and the matter of a long story, and the conduit of many excellent instructions, and therefore might without all question be described as well as Caesar’s or Meletius, Marc Anthony or the kings of the gentiles. It might be done: and the question being here only of the making or having of it, abstractedly from all other appendages or collateral considerations, I need say no more of it under this title; but that it is neither impious nor unreasonable of itself to have or to make the picture or image of Christ’s humanity, or rather of his human body. For against this there is neither reason nor religion; and if it be made accidentally unlawful, that is not of present consideration.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/jeremy-taylor.html">Jeremy Taylor</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Ductor dubitantium, or, The Rule of Conscience in all her General Measures serving as a great instrument for the determination of cases of conscience</cite>, … (London, 1660), vol. 1, Of the Rule of Conscience, ch. 2, Rule 6, ‘Every thing in the Decalogue is not obligatory to Christians, is not a portion of the Moral or Natural law’ Taylor (1613–1667) was a cleric in the Church of England who achieved fame as an author during the Protectorate of Oliver Cromwell. He was Arminian in outlook., p. 334</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/worship/idolatry-and-images.html">Idolatry and Images</a></span></div>

<blockquote><p>Do we not see with our eyes that in the Roman Church the people is denied the Communion of the cup? Do we not see pictures of the Trinity, and the people bowing the knee before images? Do we not hear public service and prayers in an unknown tongue? And if these things be formally prohibited in the holy Scripture, are they not unto us sensible marks of a false and erroneous Church?</p></blockquote>

</figure><figure class="quote" id="q-af00fdcfb0" data-kw="">
<blockquote><p>It is true, likewise, that God directed his people under the Law to bend and bow themselves toward the ark and the temple, wherein the ark was, and the mountain whereon the temple was situate: partly lest that rude people should turn their worship another way, partly because of his promise to hear them when they should pray toward the temple or the ark; partly because of his singular manner of presence in the ark: He was said to dwell between the cherubims, the ark is called his ‘foot-stool,’ and sometime the ‘face of God,’ ‘the glory of the Lord.’ It is reason, where God is present after an extraordinary manner, as when He spake out of the bush and the cloud, that adoration be directed to the place of his extraordinary presence. The altars, the offerings and other holy things wanted [lacked] the like presence and the like promise. The ark and the cherubims upon the ark were not seen [being in the Holy of Holies]: and therefore could not be readily abused to idolatry.</p></blockquote>

<blockquote><p>‘United to God’ is an ambiguous word: no creature is united to Him perfectly so as to be thereby what He is, God, in the created nature. Only Christ is united to Him hypostatically in his created nature. All are so far united to Him in natural being as that in Him they live and move and have their being: and the Nature of man is one sort of his image: All things are united to Him as effects to their constant efficient.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/richard-baxter.html">Richard Baxter</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Schism Detected in both Extremes, or Two Sorts of Sinful Separation</cite>, ... (London: 1684), pt. 1, ch. 1, p. 1</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/creation/the-six-days.html">The Six Days</a></span></div>

</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-57a97c89f5" data-kw="">
<blockquote><p>Secondly, that which is the only foundation of a scruple in this case, is a principle most unreasonable in itself, that we are to embrace nothing for truth, though divinely revealed, but what our reason is able to comprehend, as to the nature of the thing, and the manner of its existence; on which account the doctrine of the Trinity, Incarnation, Satisfaction, and consequently the whole mystery of the Gospel of Christ must be rejected as incredible, and that on this bare pretense, because although many expressions in Scripture seem to import all these things, yet we are bound to interpret them to another sense, because this is incongruous to our reason. But although Christianity be a religion which comes in the highest way of credibility to the minds of men, although we are not bound to believe anything but what we have sufficient reason to make it appear that it is revealed by God, yet that anything should be questioned whether it be of divine revelation, merely because our reason is to seek, as to the full and adaequate conception of it, is a most absurd and unreasonable pretence: And the assertors of it must run themselves on these unavoidable absurdities: First, of believing nothing either in nature or religion to be true, but what they can give a full and satisfactory account of, as to every mode and circumstance of it. Therefore let such persons first try themselves in all the appearances of nature: And then we may suppose they will not believe that the sun shines, till they have by demonstrative arguments proved the undoubted truth of the Ptolomaic or Copernican hypothesis, that they will never give credit to the flux and reflux of the Sea, till they clearly resolve the doubts which attend the several opinions of it. That there is no such thing as matter in the world, till they can satisfactorily tell us how the parts of it are united; nor that there are any material beings, till they have resolved all the perplexing difficulties about the several affections of them; and that themselves have not so much as a rational soul, till they are bound to satisfy us of the manner of the union of the soul and body together. And if they can expedite all these, and many more difficulties about the most obvious things…</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/edward-stillingfleet.html">Edward Stillingfleet</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Origines Sacræ, or, A Rational Account of the Grounds of Christian Faith</cite>, ... (London, 1662), bk. 2, ch. 8, pp. 233-34</span></figcaption>

</figure><figure class="quote" id="q-02908a3ee6" data-kw="">
<blockquote><p>First by ‘day’ we are here [in Gen. 1:14, ‘to separate the day from the night’] to understand not the space of the sun, moon, and stars compassing the earth, which is the space of 24 hours; for that ‘day’ consists of an evening and a morning, and comprehends in it one night; and some call it a natural, and some a civil, and some an astronomical day: but here by ‘day’ we are to understand the time while the sun, the greatest light, shines and gives light upon the face of the earth: And by ‘night’ the time while the moon and stars do only appear and give their dim light upon the earth, which some call an artificial and civil day and night, but others do more properly call it a natural day, and a natural night.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/george-walker.html">George Walker</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The History of the Creation as it is Written by Moses in the First &amp; Second Chapters of Genesis: Plainly Opened &amp; Expounded in Several Sermons</cite>, … (London: Barlet, 1641), Of the Creation of the World, ch. 9, pp. 138-39</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/creation/the-six-days.html">The Six Days</a></span></div>

0night" rel="noopener" target="_blank">Read it online · Reformed Books Online</a></div>

<blockquote><p>…in taking up the language of ‘the space of six days,’ the Westminster Assembly declared that it stood with previous theologians in affirming a literal six-day creation. The expression of has its roots in at least four previous theologians whom the Westminster divines knew. As we have seen, the words ‘in the space of six days’ appear in the writings of Bonaventure, Calvin, Zanchi, and Ussher.² ² Bonaventure, Commentaries on the Four Books of Sentences, book 2, distinction 12, art. 1, question 2; Calvin, Commentaries on Genesis, 1:78; Zanchius, Confession of Christian Religion, 21 [5.1]; De Operibus Dei intra Spacium Sex Dierum Creatis; Ussher, Works, 11:183.</p></blockquote>

<blockquote><p>In like sort we may imagine time before the world; for who doubts but that it was possible that time should have been sooner than it was and wh•s it is now about six thousand years since the world began; so if it had pleased God, it might have been 10 thousand. But do not you infer here hence that we do imagine infinite time preceding the world; for that is not held to be possible as finite time is.</p></blockquote>

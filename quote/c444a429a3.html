<main class="wrap"><figure class="quote" id="q-c444a429a3" data-kw="">
<blockquote><p>Upon the first day of the week let every one of you lay by him in store, as God hath prospered him, that there be no gatherings when I come. (1 Corinthians 16:2)

From hence both divers of the ancients, and very many late divines, argue for the change of the sabbath from the seventh day of the week to the first. It is plain from hence, that the gospel churches were wont to assemble upon that day; nor do we read in Scripture of any assembly of Christians for religious worship on any other day. On this day the apostle orders collections for the poor saints to be made, accordingly as God had prospered any in their employments; he directeth that they should every one lay by him something, not doing what he did with any ostentation, but having it ready when it should be called for: this he calls a treasuring (so it is in the Greek); monies laid by for charitable uses are treasures, both with respect to those for whom they are laid up, and also for ourselves; for he that giveth to the poor, layeth up for himself treasures in heaven. He would have no gatherings when he came, either to avoid the scandal of his being chargeable to them, or that he would have no delay, but when he came it might be in a readiness to be presently sent away.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/matthew-poole.html">Matthew Poole</a></span><span class="wk"><span class="lbl">Work:</span> <cite>A Commentary on the Holy Bible</cite>, (1685; London: Banner of Truth, 1963), 3: 599.</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/worship.html">Worship</a></span></div>

</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-f0aa3c32a4" data-kw="">
<blockquote><p>The Jews in their time provoked justly the vengeance of God, for that partly they abused his holy temple with the detestable idolatry of the heathen, and superstitious vanities of their own inventions, contrary to God’s commandment; partly they resorted unto it as hypocrites, spotted, imbrued, and foully defiled with all kind of wickedness and sinful life; partly many of them passed little upon the holy temple, and forced not whether they came thither or no.

And have not the Christians of late days, and even in our days also, in like manner provoked the displeasure and indignation of Almighty God, partly, because they have profaned and defiled their churches with heathenish and Jewish abuses, with images and idols, with numbers of altars too superstitiously and intolerably abused, with gross abusing and filthy corrupting of the Lord’s holy Supper, the blessed Sacrament of his Body and Blood, with an infinite number of toys and trifles of their own devices, to make a goodly outward shew, and to deface the homely, simple, and sincere religion of Christ Jesus? Partly, they resort to the church like hypocrites, full of all iniquity and sinful life, having a vain and a dangerous fancy and persuasion, that if they come to the church, besprinkle them with holy water, hear a mass, and be blessed with the chalice, though they understand not one word of the whole service, nor feel one motion of repentance in their hearts, all is well, all is sure.

Fie upon such mocking and blaspheming of God’s holy ordinance. Churches were made for another purpose, that is, to resort thither and to serve God truly, there to learn his blessed will, there to call upon his mighty Name, there to use the holy Sacraments, there to travail how to be in charity with thy neighbour, there to have thy poor and needy neighbour in remembrance, from thence to depart better and more godly than thou earnest thither.

Finally, God’s vengeance hath been and is daily provoked, because much wicked people pass nothing to resort to the church, either for that they are so sore blinded, that they understand nothing of God and godliness, and care not with devilish example to offend their neighbours; or else for that they see the church altogether scoured of such gay gazing sights as their gross fantasy was greatly delighted with, because they see the false religion abandoned and the true restored, which seemeth an unsavoury thing to their unsavoury taste; as may appear by this, that a woman said to her neighbour, Alas, gossip, what shall we now do at church, since all the saints are taken away, since all the goodly sights we were wont to have are gone, since we cannot hear the like piping, singing, chanting, and playing upon the organs, that we could before?

But, dearly beloved, we ought greatly to rejoice and give God thanks, that our churches are delivered of all those things which displeased God so sore, and filthily defiled his holy house and his place of prayer; for the which he hath justly destroyed many nations; according to the saying of St. Paul, If any man defile the temple of God, God will him destroy. And this ought we greatly to praise God for, that such superstitious and idolatrous manners as were utterly naught and defaced God’s glory are utterly abolished, as they most justly deserved, and yet those things that either God was honoured with or his people edified are decently retained, and in our churches comely practised.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/john-jewell.html">John Jewell</a></span><span class="wk"><span class="lbl">Work:</span> <cite>An Homily on the Place and Time of Prayer. Second Part in Thomas Cranmer and John Jewell, The Two Books of Homilies Appointed to be Read in Churches</cite></span></figcaption>

<blockquote><p>[I]n the Pagan Feasts it was expressly forbidden to labour, and those that wrought were punished. But it was permitted to play, to dance, and to commit all sorts of insolencies. This is the true Image of the Popish Feasts: For a poor man that worketh in his shop to relieve his languishing family is sure to be severely punished, though the Law of God say, six days shalt thou labour. But they enter unpunished into Taverns brothels and other shameless places.

They believe not that the Feast day of a Saint is well celebrated, unless they make good cheer. It is then that the Priests &amp; people make merry; and that they commit the greatest excess of gluttony and drunkenness. There is not a man so miserable that will not spare somewhat to feast his friends on the feast day of his parish. Polydor Virgil acknowledgeth that this custom is come from the ancient Romans, de rerum inuent. lib. 5. c. 1.</p></blockquote>

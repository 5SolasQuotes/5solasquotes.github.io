<main class="wrap"><figure class="quote" id="q-0f54c46fb4" data-kw="">
<blockquote><p>6. State the Cosmological Argument.

It may be stated in the form of a syllogism, thus —

Major Premise. — Every new existence or change in any thing previously existing must have had a cause pre-existing and adequate.

Minor Premise. — The universe as a whole and in all its parts is a system of changes.

Conclusion. — Hence the universe must have a cause exterior to itself, and the ultimate or absolute cause must be eternal, uncaused, and unchangeable.

1st. As to the major premise; the causal judgment is intuitive and absolutely universal and necessary. It has been denied theoretically by some speculators, as Hume and Mill, but it is always used by them and all others in all their reasoning as to the origin of the world, as well as of all things it contains. The judgment is unavoidable; the opposite is unthinkable. Something exists now, therefore something must have existed from eternity, and that which has existed from eternity is the cause of that which exists now.

It has been claimed that the causal judgment leads to an infinite regressive series of causes and effects. But this is absurd. (1.) The judgment is not that every thing must have a cause, but that every new thing or change must have been caused. But that which is eternal and immutable needs no cause. (2.) An infinite series of causes and effects is absurd, for that is only a series of changes, which is precisely that which demands a cause, and all the more imperatively in proportion to its length. A real cause, on the other hand, — that in which the causal judgment can alone absolutely rest, — must be neither a change nor a series of changes, but something uncaused, eternal and immutable.

As a matter of fact all philosophers and men of science without exception assume the principles asserted. They all postulate an eternal, self-existent, unchangeable cause of the universe, whether a personal spirit, or material atoms, or a substance of which both matter and spirit are modes, or an unconscious intelligent world-soul in union with matter.

2d. As to the minor premise. The fact that the universe as a whole and in all its parts is a system of changes is emphasized by every principle and lesson of modern science. Every discovery in the fields of geology and astronomy, and all speculation — as the nebular hypothesis and the hypothesis of evolution — embody this principle as their very essence.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/a-a-hodge.html">A. A. Hodge</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Outlines of Theology</cite>, (2nd edn, New York: Robert Carter and Brothers, 1879), p. 33.</span></figcaption>

<blockquote><p>God thus created man at first singularly pre-eminent among the animal tribes, both in regard to his bodily frame and his mental faculties, the noblest and wisest among living creatures on this earth. But his very pre-eminence- seemed to place him at a disadvantage, in comparison with the inferior creatures.

There was not found among them a help meet for him, and he stood far apart from them all. He found himself alone, without any suitable companion—without the solace of society, or the intercourse of friendship. “The Lord God said, It is not good that man should be alone; I will make him an help meet for him.”

To prevent merely the evil of being alone, it might have seemed a natural thing to have created another man, in every respect alike, as a perfect companion; and this it was, indeed, easy for the Lord to have done, and to have produced one man after another, or multitudes of them together, at successive periods of time, to aid one another, and to inhabit the earth.

“It is not good that the man should be alone,” would, therefore, seem to import something more than merely being without any other human being like himself; for even another human being like himself was not the help meet, that was provided for him—not another man, but woman; one, indeed, so like to himself, and so near to himself, as to be justly called “bone of his bones, and flesh of his flesh,”—”a creature manlike, but a different sex;” differing in various qualities both of body and mind; yet, by these very dissimilarities, each supplying what the other required for mutual aid, comfort, and improvement. “Male and female created he them;” and that not merely for the increase of their race, but for the enlargement of their happiness, and the improvement of their nature.

Man alone, or men by themselves, removed from the influence of woman, or refusing to admit such influence, seem always to approach the fierceness of the brutal tribes, and to become a rude and iron race; but when placed within the reach of the qualities peculiar to the female character, “their graceful acts and thousand decencies,” become softened and refined, wiser and better, than, with all their superior powers, they could otherwise have been. The formation of woman thus farther manifests the wisdom and goodness of the gracious Creator; and, by the exercise of her peculiar powers, she is capable of proving the source of the greatest good in the life of man.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/james-brewster.html">James Brewster</a></span><span class="wk"><span class="lbl">Work:</span> <cite>On the Creation of Man in Christian Miscellany</cite></span></figcaption>

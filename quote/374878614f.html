<main class="wrap"><figure class="quote" id="q-374878614f" data-kw="">
<blockquote><p>About receiving the Lord’s Supper with inconvenient ceremonies and persons in differing doctrine: Peter Martyr, when he came into England first, and the opinion of the corporal presence of Christ in the Lord’s Supper was in force, and when the ministers, albeit differing from him in judgment, yet did not refuse to admit him with open confession of [the] contrary judgment, he joined with them and received the Lord’s Supper, Non obstantibus illorum ceremonijs sibilicet ipsi molestis, ‘notwithstanding the ceremonies, though very much troubling him.’ This counsel did P. Martyr give to [Zachary] Ursinus and to other Christians in Germany; Ursinus, Exercitat., lib 2, fol. 840.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/john-sprint.html">John Sprint</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Cassander Anglicanus, showing the Necessity of Conformity to the Prescribed Ceremonies of our Church in Case of Deprivation</cite>, (London: Bill, 1623) | ‘Reformed Practices’, p. 162</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/worship/impurities-in-worship.html">Impurities in Worship</a></span></div>

</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-7f048ab8cd" data-kw="">
<blockquote><p>Objection [of Separatists]: They [wicked people] mix with us in our [congregational] singing; mixed worship we cannot join in. Answer: I cannot conceive what harm this can do to you; is the mixing of your own corruption in your service less prejudicial to the acceptance of it with God, than the presence of wicked men joining in the service?</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/giles-firmin.html">Giles Firmin</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Separation Examined: or, a Treatise wherein the Grounds for Separation from the Ministry &amp; Churches of England are Weighed &amp; Found too Light</cite>, … (London: 1652), pp.</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/worship/impurities-in-worship.html">Impurities in Worship</a></span></div>

</figure><figure class="quote" id="q-7dec54371f" data-kw="">
<blockquote><p>v. 16, ‘And Moses diligently sought the goat of the sin-offering;’… in such serious matters Moses had not spared labor and care, whereas the sons of Aaron, as if they had neither heard nor seen anything of the sort, pervert the whole order of them, although they had been just before reminded that they had been appointed to keep the charge of God. Perhaps they were impelled to this error by the trouble arising from their grief… Further from the anger of Moses, which is mentioned in his praise, we may infer that the transgression was no light one, although it was not so severely punished as the presumption of Nadab and Abihu… But the reason why God was more merciful to them than to their brethren is only known to Himself. Conjectures may, indeed, be advanced; but at last we must come to this, that because God’s judgments are hidden, they are not therefore unjust; but that we must humbly adore their depth into which the minds of men cannot penetrate. v. 19, ‘And Aaron said unto Moses, Behold, this day;’ Aaron replies that it arose from pious fear that they had not feasted before God, because they would in a manner have defiled the sanctuary by their tears and melancholy… but it was not a just defense; for he ought rather to have striven against the feelings of the flesh so that his domestic calamity should not withhold him from the service of God. But, inasmuch as in his perplexity his fear was deserving of pity, Moses forgives him; and it is said that he was appeased, because he finds less of evil than he supposed.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/john-calvin.html">John Calvin</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Commentary on Leviticus</cite>, 10</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/worship/impurities-in-worship.html">Impurities in Worship</a></span></div>

ote/7dec54371f.html">Permalink</a><a class="src" href="https://reformedbooksonline.com/on-impurities-in-worship/#:~:text=v.%2016%2C%20%E2%80%98And%20Moses%20diligently%20sought,less%20of%20evil%20than%20he%20supposed&amp;text=v.%2016%2C%20%E2%80%98And%20Moses%20diligently%20sought%20the%20goat&amp;text=he%20finds%20less%20of%20evil%20than%20he%20supposed" rel="noopener" target="_blank">Read it online · Reformed Books Online</a></div>
</figure><figure class="quote" id="q-e0f0a5b7e4" data-kw="">
<blockquote><p>40. I have before proved how faulty the priests’ calling was in Christ’s time, and the Temple and synagogue worship, and the Pharisees’ long liturgies, on pretence whereof they devoured widows’ houses, and their corrupt doctrine, and how great the faults were in the Churches of Corinth, Galatia, Ephesus, Sardis, Laodicea, Thyatira, Pergamos [Rev. 2-3], and those that James wrote to, from which none were commanded to depart;¹ And to condemn Christ or his apostles as favoring or using sinful communion is worse in Christians than it was in the Pharisees.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/richard-baxter.html">Richard Baxter</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Catholic Communion Doubly Defended by Dr. Owen’s Vindicator &amp; Richard Baxter</cite>, Detailed | Catholic Communion Doubly Defended by Dr. Owen’s Vindicator &amp; Richard Baxter… (London: Parkhurst, 1684), section 2, pp. 9-14 | No Command to Depart; Don’t Censure Christ</span></figcaption>

</figure><figure class="quote" id="q-ec80c51a12" data-kw="">
<blockquote><p>Thus your first accusation, that we worship the true God after a false manner, is with false slander and furious outrage of speech, crying out of idolatry, blasphemies and abominations when as ye can show no one ground of the holy religion and worship of God which is not holden sound and entire among us, only ye rip up corruptions and spots in ceremonies, orders and circumstances, which touch not the foundation, but are such as men may err in and yet be God’s dear children and true worshippers.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/george-gifford.html">George Gifford</a></span><span class="wk"><span class="lbl">Work:</span> <cite>A Short Treatise Against the Donatists of England, whom we call Brownists</cite>, ... (London, 1590), ‘Brownist Position’, pp. 17 Gifford (c. 1548–1600 or 1620?) was a non-conformist, English, puritan preacher.</span></figcaption>

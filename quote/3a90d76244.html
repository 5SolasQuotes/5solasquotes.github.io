<main class="wrap"><figure class="quote" id="q-3a90d76244" data-kw="">
<blockquote><p>…good works are causes of the favors of God and of eternal salvation, and that this cannot be denied, since God witnesses it everywhere in the Scripture, but that they are not the primary causes, nor are they causes in themselves, but the secondary causes and that too only from the spontaneous benevolence of God…</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/martin-bucer.html">Martin Bucer</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Disputata Ratisbonae, in altero colloqui, Anno XLVI. Et Collocutorum Augustanae Confessionis Responsa … De Justificatione, et locis doctrinae Euangelicae omnibus, quos doctrina de Iustificatione complectitur… (1548) as translated in Forbes, Justification, p. 311. Rutherford quotes from this work of Bucer to the same effect as below approvingly in his Examination, pp. 531-531.</cite>, p. 99, also 100-101 ff.</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/good-works/necessity-of-good-works.html">Necessity of Good Works</a></span></div>
<div class="actions"><button class="copy" data-copy="“…good works are causes of the favors of God and of eternal salvation, and that this cannot be denied, since God witnesses it everywhere in the Scripture, but that they are not the primary causes, nor are they causes in themselves, but the secondary causes and that too only from the spontaneous benevolence of God…”

</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-868d1869e5" data-kw="">
<blockquote><p>When the doctrine of the Reformers began to be abused by the Antinomians, the Puritans were raised up, in the good providence of God, to give the same prominence to Sanctification as Luther had given to Justification; to insist as as strenuously on the the work of the Spirit in applying salvation as he had done on the work of Christ in procuring it: for though both doctrines were taught at an earlier period… it was reserved for their successors, when controversy arose, to expound them more fully in their necessary connection and mutual relations. Such writers as Owen, and Goodwin, and Charnock, and Howe, and Trail adhered firmly to the doctrine of Justification as proclaimed by Luther and Calvin, while they checked every tendency to Antinomian licence by the firm assertion of the indispensable necessity of personal holiness as one of the essential parts of the great salvation… Considered as fruits of our sanctification, and as evidences of our ‘MEETNESS for the inheritance of the saints in light,’ they cannot be too highly commended; but considered as the ground of our Justification, or as forming any part of our TITLE to that inheritance, they are to be utterly rejected, and treated as ‘dung’ and ‘filthy rags’ with reference to that end.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/james-buchanan.html">James Buchanan</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Doctrine of Justification (Grand Rapids: Baker, 1955)</cite>, pp. 363-64</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/good-works/necessity-of-good-works.html">Necessity of Good Works</a></span></div>

at%20end&amp;text=When%20the%20doctrine%20of%20the%20Reformers%20began%20to&amp;text=and%20%E2%80%98filthy%20rags%E2%80%99%20with%20reference%20to%20that%20end" rel="noopener" target="_blank">Read it online · Reformed Books Online</a></div>
</figure><figure class="quote" id="q-f945debfa5" data-kw="">
<blockquote><p>5. They are a condition, without which a man cannot be saved. So that although a man cannot by the presence of them gather a cause of his salvation; yet by the absence of them he may conclude his damnation: so that it is an inexcusable speech of the Antinomian, Good works do not profit us, nor bad hinder us; thus Islebius. Now the Scripture, how full is it to the contrary? Rom. 8:13, ‘If ye live after the flesh, ye shall die.’ So, ‘Except ye repent, ye shall all likewise perish.’ Such places are so frequent, that it’s a wonder an Antinomian can pass them all over, and always speak of those places which declare God’s grace to us, but not our duty to Him. Without holiness no man can see God: now, by the Antinomians’ argument, as a man may be justified while he is wicked, and does abide so; so also he may be glorified and saved: for this is their principle, that, Christ has purchased justification, glory, and salvation for us, even though sinners and enemies.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/anthony-burgess.html">Anthony Burgess</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Lectures 3 &amp; 4, on 1 Tim. 8-9 of Vindiciae Legis, or, A vindication of the moral law and the covenants, from the errors of Papists, Arminians, Socinians, and more especially, Antinomians in 30 Lectures (London, 1647)</cite>, pp. 42-43</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/good-works/necessity-of-good-works.html">Necessity of Good Works</a></span></div>
<div class="actions"><button class="copy" data-copy="“5. They are a condition, without which a man cannot be saved. So that although a man cannot by the presence of them gather a cause of his salvation; yet by the absence of them he may conclude his damnation: so that it is an inexcusable speech of the Antinomian, Good works do not profit us, nor bad hinder us; thus Islebius. Now the Scripture, how full is it to the contrary? Rom. 8:13, ‘If ye live after the flesh, ye shall die.’ So, ‘Except ye repent, ye shall all likewise perish.’ Such places are so frequent, that it’s a wonder an Antinomian can pass them all over, and always speak of those places which declare God’s grace to us, but not our duty to Him. Without holiness no man can see God: now, by the Antinomians’ argument, as a man may be justified while he is wicked, and does abide so; so also he may be glorified and saved: for this is their principle, that, Christ has purchased justification, glory, and salvation for us, even though sinners and enemies.”

</figure><figure class="quote" id="q-126564ab71" data-kw="">
<blockquote><p>We respond: Our corollary in the disputation of 1634 set forth that this holds: Good works from the use of Scripture are in some way able to be called the cause of life eternal (2 Cor. 4:17; Phil. 2:12) and nonetheless they are certainly not hence an appearance or a shade of argument for the merit of papists.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/gisbertus-voetius.html">Gisbertus Voetius</a></span><span class="wk"><span class="lbl">Work:</span> <cite>43rd Categorical, ‘Of Good Works being Causes of Life Eternal’ in Of Some Select Problems, Part 10 in Select Theological Disputations (Utrecht, 1669), vol. 5, pp. 675-86</cite>, pp. 675-76</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/good-works/necessity-of-good-works.html">Necessity of Good Works</a></span></div>
<div class="actions"><button class="copy" data-copy="“We respond: Our corollary in the disputation of 1634 set forth that this holds: Good works from the use of Scripture are in some way able to be called the cause of life eternal (2 Cor. 4:17; Phil. 2:12) and nonetheless they are certainly not hence an appearance or a shade of argument for the merit of papists.”

</figure><figure class="quote" id="q-c699849847" data-kw="">
<blockquote><p>Faith, therefore, without works, is dead. We are saved by faith. But salvation includes deliverance from sin. If, therefore, our faith does not deliver us from sin, it does not save us. Antinomianism involves a contradiction in terms.</p></blockquote>

<blockquote><p>17. It is mercy that there is a possibility of happiness, and that upon our pain’s taking, we may have a Kingdom; by our Fall in Adam we forfeited Heaven; why might not God have dealt with us as with the lapsed angels? they had no sooner sinned but were expelled Heaven never to come thither more; we may say as the apostle, Rom. 11:22, ‘Behold the goodness and severity of God.’ To the apostate angels behold the severity of God that He should throw them down to Hell forever; to us behold the goodness of God, that He has put us into a possibility of mercy, and if we do but take pains, there is a Kingdom stands ready for us; how may this whet and sharpen our industry, that we are in a capacity of salvation; and if we do but what we are able, we shall receive an eternal weight of glory.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/thomas-watson.html">Thomas Watson</a></span><span class="wk"><span class="lbl">Work:</span> <cite>A Body of Practical Divinity</cite>, (d. 1686; London: Parkhurst, 1692), The Lord’s Prayer, ‘Thy Kingdom Come’, p. 507</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/election/nature-of-election.html">Nature of Election</a></span></div>

<blockquote><p>Of what sort of men is election? Of such as are uncleane and ungodly in the sight of God. “For He has chosen us that we might be holy and without blame,” Eph. 1:4. But whereas He chose us before the world was made, it is effected that God set before his eyes all men that ever should be, and for as much as they would be ungodly and accursed, He likewise so considered them and so chose some out of the common lump and filth of men, and those freely according to the good pleasure of his will, leaving others in their sin and curse.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/william-bucanus.html">William Bucanus</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Institutions of Christian Religion Framed out of God’s Word, &amp; the Writings of the Best Divines</cite>, (London: 1606), Place 36, ‘Of Predestination’, p. 433</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/election/nature-of-election.html">Nature of Election</a></span></div>

</figure><figure class="quote" id="q-1d55c97862" data-kw="">
<blockquote><p>Faith is man’s response to God’s elective purpose. God’s choice of men is election; men’s choice of God is faith. In election God gives His promises, and by faith men receive them.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/john-macarthur.html">John MacArthur</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Ephesians</cite>, p. 33</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/election/nature-of-election.html">Nature of Election</a></span><span class="t"><a href="../topics/faith/nature-of-saving-faith.html">Nature of Saving Faith</a></span></div>
<div class="actions"><button class="copy" data-copy="“Faith is man’s response to God’s elective purpose. God’s choice of men is election; men’s choice of God is faith. In election God gives His promises, and by faith men receive them.”

— John MacArthur, Ephesians, p. 33">Copy</button><a class="share" href="https://x.com/intent/post?text=%E2%80%9CFaith+is+man%E2%80%99s+response+to+God%E2%80%99s+elective+purpose.+God%E2%80%99s+choice+of+men+is+election%3B+men%E2%80%99s+choice+of+God+is+faith.+In+election+God+gives+His+promises%2C+and+by+faith+men+receive+them.%E2%80%9D%0A%0A%E2%80%94+John+MacArthur%2C+Ephesians%2C+p.+33&amp;url=https%3A%2F%2F5solasquotes.github.io%2Fquote%2F1d55c97862.html&amp;via=5Solas" target="_blank" rel="noopener">Share on X</a><a class="perma" href="../quote/1d55c97862.html">Permalink</a><span class="src none">No free online copy linked</span></div>
</figure><figure class="quote" id="q-e733164a3e" data-kw="">
<blockquote><p>It should be noted that both [Robert] Rollock and [Robert] Howie confined the effectual application of the covenant and its benefits to ‘God’s elect’. The doctrine of election permeated their writings and sermons, but, more specifically, both wrote treatises which presented strong predestinarian views advocating double and supralapsarian predestination. At Basel Academy on February 25, 1591, Howie defended a paper entitled De Aeterna Dei Praedestinatione Aphorismi Theologici [Theological Aphorisms on the Eternal Predestination of God].. He chose to glorify his mercy and love in the salvation of the elect, and to glorify his justice in the damnation of the reprobate. Man’s primal condition, his fall, and his corruption through sin were all included in this decree. (Howie, De Aeterna, 8-10)… There is one chapter in Rollock’s De Vocatione [Of Effectual Calling], entitled ‘Concerning the Free Grace of God,’ [ch. 38] which has a reference to predestination capable of an infralapsarian interpretation. Here he placed the decree to glorify Christ before the decree concerning the creation of man [which is a supra-viewpoint]. (Rollock, Select Works, 1:266-267; see Letham, ‘Saving Faith’, 1:270) But Rollock went on to say that in the execution of the decree ‘the decree of God concerning man hath the first place… Then after the fall of man, followed the restitution of man… in and by his Son Christ… Therefore the execution of the decree concerning Christ the Son of God, which was first, falls now as it were in the midst of the repairing of mankind, or of the execution of the decree concerning man’s redemption.’ (Select Works, 1:267-8) This passage in no way detracts from the overwhelming supralapsarian character of Rollock’s predestinarianism…</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/supralapsarians.html">Supralapsarians</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Other citations (work not named)</cite>, On Robert Rollock &amp; Robert Boyd in Scotland | Andrew Woolsey, Unity &amp; Continuity in Covenantal Thought, pp. 531, 534</span></figcaption>

</figure><figure class="quote" id="q-3e2f114643" data-kw="">
<blockquote><p>III. The third article [of difference between the Reformed and Lutherans] is that concerning predestination, which began to be controverted after Luther’s time, perhaps on the occasion of certain theologians who, asserting gratuitous predestination, sought out the mode and order of the signs of reason and of the divine acts perhaps more deeply than sacred Scripture, and than was fitting; and they use harsher forms of speaking. I plainly think that it can be explained in that mode and order according to the Scriptures, Augustine, and the article of our [Anglican] Church, as the late most reverend [John] Overall [d. 1619] explained it, so that I may easily hope that the more moderate Lutherans can be brought to our opinion, especially if they will not refuse to stand by Luther’s tenets in his book On the Bondage of the Will against Erasmus, and in his Annotations on the 9th chapter of Romans. From what has been said, it can be somewhat established that the Reformed Churches [including Lutherans] do not dissent in the fundamentals of faith.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/samuel-ward.html">Samuel Ward</a></span><span class="wk"><span class="lbl">Work:</span> <cite>‘The Reformed Churches do not Dissent in the Fundamentals of Faith’ in Theological Determinations in Works of Samuel Ward</cite>, … ed. Seth Ward trans. AI (d. 1643; Gallibrand, 1658), pp. 152-53</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/election/nature-of-election.html">Nature of Election</a></span></div>

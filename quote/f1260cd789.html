<blockquote><p>Another remarkable period is there meeting together at the bar of God’s great justice-court in heaven, within the vail, whither the forerunner hath for us entered, even Jesus, Heb. 6. last. When Christ was upon the cross, the vail of the temple was rent in twain from the top to the bottom, &amp; a way was made for entering into the holy of holies. And as the priests under the law were not only to offer the sacrifice without the camp, but after that were to enter the holiest of all, not without blood, but with the blood of the sacrifice, to sprinkle the mercy seat, Lev. 16.14, 15. Even so Christ, having offered himself a sacrifice, and suffered without the gate, Heb. 13.12. He is entered into the holy place by his own Blood, Heb. 9.12. there to appear as our high priest, in the power and virtue of his blood, to make a full atonement, and sprinkle the mercy-seat. Hence believers are said to be come to Jesus the mediator of the new covenant, and to the blood of sprinkling. And where is this? Even in heaven, as you see in the context, Heb. 12.23, 24.

Now, in this work, Christ carried the price of his blood into the very presence of God for us, Heb. 9.24. and paid it down before him; and, in this act, justice hath its satisfaction brought home; and, by this act, mercy and justice actually are met: For hereby Christ sprinkled the very mercy-seat with blood all over, both upon it, and before it, as the forecited Lev. 16. represents: For the mercy-seat of old stood so, that it could be seen but two ways, namely, upon it, and before it, as a table next to the wall; and so this points out, that whatever way we look to mercy by faith, we may see mercy and blood mixt, mercy and justice met together, and all sorts of mercy conveyed thro’ the blood of Christ, top-mercies, and side-mercies, upper-mercies of a spiritual nature, and lower mercies of a temporal nature; for the mercy-seat is sprinkled with the blood upon it, and before it, and whatever way you look to it.

The sacrifice was finished on the cross, and all sacrifices finished therein; but the blood of the sacrifice behoved also to be carried within the vail in order to the full atonement, that what was written in blood upon the cross, might be sealed in the presence of God at the heavenly bar: And we act not our faith far enough for redemption, unless we follow Christ from the cross to the bar of God’s justice-court in heaven, to see all sealed and secured there within the vail, where this blood is exposed, as it were, and pled at the bar; where mercy and justice meet together, and embrace each other.</p></blockquote>

<blockquote><p>Life Eternal is the life of glory, wherein the soul, joined to our body, enjoys God forever, being advanced to the highest top and height of her felicity. The Cause of this life is God, to wit, the Father the efficient, the Son the meritorious, and the Holy Ghost the sealing and applying cause. The Matter, which has the respect of the subject, are those good things, which neither eye has seen, nor ear heard, nor can the mind of man comprehend. That which is of the Object, are all the blessed and elect. The Form is the most perfect knowledge, vision, and fruition of God Himself, and the exceeding felicity &amp; blessedness of man, which accompanies the same, which also consists both in the separation, and absence of all evil things, and in the participation, and presence of all good things; both are both perfect and eternal. The End is the glory of God’s grace, and the glorifying of the elect.</p></blockquote>

<blockquote><p>This blissful sight of God, being quite above our present capacities, we must needs be much in the dark about it. But it seems to be something else, than the fight of that glory, which we will see with our bodily eyes, in the saints and in the man Christ, or any other splendour or refulgence from the Godhead whatsoever; for no created thing can be our chief good and happiness, nor fully satisfy our souls; and it is plain, that these things are somewhat different from God himself. Therefore I conceive, that the souls of the saints shall see God himself: so the scriptures teach us, that we shall see face to face, and know even as we are known, 1 Cor xiii 12. And that we shall see him as he is, 1 John iii. 12.

Howbeit the saints can never have an adequate conception of God; they cannot comprehend that which is infinite. They may touch the mountain, but cannot grasp it in their arms They cannot with one glance of their eye, behold what grows on every side: but the divine perfections will be an unbounded field, in which the glorified shall walk eternally, seeing more and more of God: since they can never come to the end of that which is infinite. They may bring their vessels to this ocean every moment, and fill them with new waters.

What a ravishing sight would it be, to see all the perfections, and lovely qualities, that are scattered here and there among the creatures, gathered together into one! but even such a sight would be infinitely below this blissful sight the saints shall have in heaven. For they shall see God, in whom all these perfections shall eminently appear, with infinitely more; whereof there is no vestige to be found in the creature. In him shall they see every thing desirable, and nothing but what is desirable.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/thomas-boston.html">Thomas Boston</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Human nature in its fourfold state, of primitive integrity, subsisting in the parents of Mankind in paradise. Entire depravation, subsisting in the unregenerate. Begun recovery, subsisting in the regenerate. And consummate happiness or misery, subsisting in all mankind in the future state. In severa</cite>, ed. Michael Boston (1784; United States: The Booksellers, 1787), p. 309.</span></figcaption>

<blockquote><p>Against claims that John Calvin repudiated the beatific vision and teleological virtue ethics, this article demonstrates the importance of the visio Dei by examining sections of Calvin’s exegesis and several important sermons. To explicate how such a teleology impacts the Christian’s relation to ‘lower goods’, it then explores Augustine’s theology of created being. Together these conversations contribute to an explanation of Calvin’s view of Christian moral life now through growth in virtue and in relation to the hope of seeing or contemplating God.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/alden-c-mccray.html">Alden C. McCray</a></span><span class="wk"><span class="lbl">Work:</span> <cite>‘Defending ‘Avertive’ Religion</cite>, vol. 82, no. 1 (April 2023), pp. 25-47</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/judgment-and-the-final-state/heaven-and-eternal-glory.html">Heaven and Eternal Glory</a></span></div>
<div class="actions"><button class="copy" data-copy="“Against claims that John Calvin repudiated the beatific vision and teleological virtue ethics, this article demonstrates the importance of the visio Dei by examining sections of Calvin’s exegesis and several important sermons. To explicate how such a teleology impacts the Christian’s relation to ‘lower goods’, it then explores Augustine’s theology of created being. Together these conversations contribute to an explanation of Calvin’s view of Christian moral life now through growth in virtue and in relation to the hope of seeing or contemplating God.”

<blockquote><p>Finally, neither the Majesty of God, nor a regard to his glory, would allow him to permit men to continue in a state of ignorance, with respect to him, and to suffer the mean workmanship of his hands to receive the tribute of religious homage due unto himself. For, among all the nations destitute of revelation, scarcely any traces could be perceived of their believing in the government of God. They were, as the scriptures speak, “the empire of darkness” they were the empire of Satan and of death – The Deity, for a time, permitted this to happen, for reasons justified by his wisdom.

But, at last, it became him to resume the government snatched the influence of his authority, and, through the various nations of the world, to recall mankind to the acknowledgement of their sovereign and to the obedience of his laws. Hence the Psalmist, “Jehovah reigns, let the earth be glad.” Ps. xcvii. And, the kingdom of God, “or, the kingdom of heaven” is perceived to be established by the preaching of Christ.</p></blockquote>

<blockquote><p>2. The united to Christ have new bodies, and two bodies, 1 Cor. 6:19. She knew not how Jesus could be united to our fleshly bodies.

3. Those who have union with Christ shall not rise with these fleshly bodies. 1 Cor. 15:44.

4. The Resurrection, 1 Cor. 15 and John 5:28, is not of the body but of our union with Christ in this life; so said Hymeneus, Phyletus, the Libertines, the Georgians, Henry Nicholas and his. … 8. No Scripture warrants Christ’s manhood to be now in Heaven, but the body of Christ is his Church; so Saltmarsh, Sparkles of Glory, as before observed.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/samuel-rutherford.html">Samuel Rutherford</a></span><span class="wk"><span class="lbl">Work:</span> <cite>A Survey of the Spiritual Antichrist, Opening the Secrets of Familism &amp; Antinomianism</cite>, ... (London, 1648) | pt. 1 | ch. 16, ‘Of the First Sowers of the Tares of Antinomianism &amp; Familism in New England’</span></figcaption>

</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-20c8220a8a" data-kw="">
<blockquote><p>There is no more ground for such a ministration in this life [of the Spirit without Church ordinances] than there is for no death, no crying, no sorrow, no pain in this life, Rev. 21:4, no sun, nor moon, v. 23, no unclean thing, no sin, v. 27 and no more warrant for delivering up the Kingdom, in this life, 1 Cor. 15, than for the Resurrection of the Dead, 23:37, and the blowing of the Last Trumpet, [v.] 52, and the swallowing up of death in victory, 55-57, as if all these should come to pass in this life agreeable to this, says H. Nicholas, Evangel. ch. 35. sec. 9. In which Resurrection of the Dead, God shows unto us that the time is now fulfilled, that his dead, or the dead which are fallen asleep in the Lord, rise up in this day of his judgement and appear unto us in godly glory, which shall also henceforth live in us everlastingly with Christ, and reign upon the earth, wherein the Scripture comes to be fulfilled in this present day. And Saltmarsh wills these that are as spiritual as himself and his Familists, to believe this and receive it, that is, except, we make shipwreck of faith and say the Resurrection is past in this life, as did Hymeneus and Philetus, we are all legal, literal men and void of the Spirit.

2. Saltmarsh is unwilling to contradict the truth of God, 1 Cor. 15:24, too openly, to wit, that in the end the Kingdom shall be delivered up: Now whether this be meant of Christ’s reigning no more in his Church in this life by ordidinances, or as Chrysostom does expound the place, it be the rendering up to the Father his conquished and purchased people, as it is most agreeable to Eph. 5:27, I dispute not now, but Saltmarsh says faintly, This is not only done on the whole body of Christ at the last, but also here. He dares not say this rendering up is not only at the Last Day, but also in this life; yet the apostle is clear, he thought of no rendering up of the Kingdome in this life, as Saltmarsh by this new spirit supposes, for the text is clear, v. 22-23, every man shall rise again from the dead, Christ first and then his members [Greek], ‘Then is the end when He shall deliver up the Kingdom to the Father.’ Then: [1.] there is no rendering up till the dead in Christ be raised, vv. 23-24, but the dead in Christ in their bodies (of which undoubtedly the apostle speaks, 1 Cor. 15:1-4, etc. do not rise in this life.

2. This rendering up is not till the end, then shall the end be.

3. It is when all rule and authority shall be put down, v. 27; this is not in this life.

4. It is when the last enemy shall be subdued, v. 26.

5. When God shall be all in all, v. 28. These are not in this life, therefore Saltmarsh dreams.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/samuel-rutherford.html">Samuel Rutherford</a></span><span class="wk"><span class="lbl">Work:</span> <cite>A Survey of the Spiritual Antichrist, Opening the Secrets of Familism &amp; Antinomianism</cite>, ... (London, 1648) | pt. 1 | ch. 34, ‘A taste of the wild allegoric interpretations of Scripture that are in this piece of Saltmarsh, which he fathers upon the pure immediate actings of the Spirit beyond Law and Gospel’, pp. 287-88</span></figcaption>

</figure><figure class="quote" id="q-dc91030cbf" data-kw="">
<blockquote><p>We do not profess to teach anything new. We consider the teaching of the Westminster Confession of Faith and other standards of the Reformed Churches to be absolutely true and sufficient, as they set forth the gracious operations of the Holy Spirit in redemption. We do hope, however, to set up and maintain the traditional view as taught in them, by treating the subject from a different point of view, and in refutation of heresies that were not prominently before the minds of those who formulated these standards. … Our aim is to ascertain and classify all the works of the Holy Spirit in all ages and dispensations, and to differentiate them one from the other by accurate definition; and also to determine, from the Scriptures, which have been permanent and universal and will be till the end of time, and which were limited and temporary. So far as we know, this ground has not been traversed, nor indeed has its importance been appreciated. Having accomplished this, as we hope and believe, we then bring the more popular claims of Modern Mysticism to the test of ascertained principles, and then consider their special pleas based on the Scriptures. … The thoughtful reader may perhaps find it profitable to read ‘Summary I’ at the close before reading the discussion.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/john-shearer.html">John Shearer</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Modern Mysticism</cite>, (Richmond, 1905) ToC</span></figcaption>

%20before%20reading%20the%20discussion&amp;text=We%20do%20not%20profess%20to%20teach%20anything%20new&amp;text=I%E2%80%99%20at%20the%20close%20before%20reading%20the%20discussion" rel="noopener" target="_blank">Read it online · Reformed Books Online</a></div>

<blockquote><p>Now Libertines turn all our faith in a topic and conjectural opinion, so most of them are turned sceptics and affirm that we know nothing with any certainty; yea the more supernatural and sublime that fundamentals of salvation are, the more indulgence and latitude of liberty is to be yielded to the consciences of all men, because the higher the subject is, the ranker is our propension to err, God having given a thinner and more scarce measure of knowledge in supernaturall things, that do so far transcend the sphere and orb of natural reason, than of knowledge in natural things, our minds being in their own element, and in a capacity to reach their connatural and proper object when they are among natural things knowable by the light of nature; Hence that opinion now so prevailing that all and every religion is to be tolerated, and an indulgence yielding to all in superstructures in fundamentals, though a man should deny that Christ is the Saviour of the world; therefore Saltmarsh takes on him (Sparkles of Glory as pp. 185-188) to reckon out the articles of our faith, especially concerning the first Adam’s sin, sin-original, of Christ born of the virgin Mary, made under the Law, bearing our sins, dead, buried, ascended into Heaven, siting at the right hand etc. and speaks of the highest attaintments of the protestants generally in the mystery of salvation. but speaks not one word of the general resurrection of our bodies, of Christ coming to judge all men, of a Heaven and Hell after this life, as if these were none of the highest attaintments of the protestants generally in the mystery of salvation. And Saltmarsh, as I conceive with Hymeneus and Philetus and other Libertines in the [English] army, doubt of or deny these…</p></blockquote>

<div class="actions"><button class="copy" data-copy="“Now Libertines turn all our faith in a topic and conjectural opinion, so most of them are turned sceptics and affirm that we know nothing with any certainty; yea the more supernatural and sublime that fundamentals of salvation are, the more indulgence and latitude of liberty is to be yielded to the consciences of all men, because the higher the subject is, the ranker is our propension to err, God having given a thinner and more scarce measure of knowledge in supernaturall things, that do so far transcend the sphere and orb of natural reason, than of knowledge in natural things, our minds being in their own element, and in a capacity to reach their connatural and proper object when they are among natural things knowable by the light of nature; Hence that opinion now so prevailing that all and every religion is to be tolerated, and an indulgence yielding to all in superstructures in fundamentals, though a man should deny that Christ is the Saviour of the world; therefore Saltmarsh takes on him (Sparkles of Glory as pp. 185-188) to reckon out the articles of our faith, especially concerning the first Adam’s sin, sin-original, of Christ born of the virgin Mary, made under the Law, bearing our sins, dead, buried, ascended into Heaven, siting at the right hand etc. and speaks of the highest attaintments of the protestants generally in the mystery of salvation. but speaks not one word of the general resurrection of our bodies, of Christ coming to judge all men, of a Heaven and Hell after this life, as if these were none of the highest attaintments of the protestants generally in the mystery of salvation. And Saltmarsh, as I conceive with Hymeneus and Philetus and other Libertines in the [English] army, doubt of or deny these…”

— Samuel Rutherford, A Survey of the Spiritual Antichrist... (London, 1648) | pt. 1 | ch. 32, ‘What Certainty of Faith the Saints may Attain to Beyond the Familists’ Fluctuation of Faith: of Heresie &amp; Schism’, pp. 274-5">Copy</button><a class="share" href="https://x.com/intent/post?text=%E2%80%9CNow+Libertines+turn+all+our+faith+in+a+topic+and+conjectural+opinion%2C+so+most+of+them+are+turned+sceptics+and+affirm+that+we+know+nothing+with+any+certainty%3B+yea+the+more+supernatural+and+sublime+that+fundamentals+of+salvation+are%2C+the+more+indulgence+and+latitude+of+liberty+is+to+be+yielded+to+the+consciences+of+all+men%2C+because+the+higher+the+subject+is%2C+the+ranker+is+our+propension+to+err%2C+God+having+given+a+thinner+and+more+scarce+measure+of+knowledge+in+supernaturall+things%2C+that+do+so+far+transcend+the+sphere+and+orb+of+natural+reason%2C+than+of+knowledge+in+natural+things%2C+our+minds+being+in+their+own+element%2C+and+in+a+capacity+to+reach+their+connatural+and+proper+object+when+they+are+among+natural+things+knowable+by+the+light+of+nature%3B+Hence+that+opinion+now+so+prevailing+that+all+and+every+religion+is+to+be+tolerated%2C+and+an+indulgence+yielding+to+all+in+superstructures+in+fundamentals%2C+though+a+man+should+deny+that+Christ+is+the+Saviour+of+the+world%3B+therefore+Saltmarsh+takes+on+him+%28Sparkles+of+Glory+as+pp.+185-188%29+to+reckon+out+the+articles+of+our+faith%2C+especially+concerning+the+first+Adam%E2%80%99s+sin%2C+sin-original%2C+of+Christ+born+of+the+virgin+Mary%2C+made+under+the+Law%2C+bearing+our+sins%2C+dead%2C+buried%2C+ascended+into+Heaven%2C+siting+at+the+right+hand+etc.+and+speaks+of+the+highest+attaintments+of+the+protestants+generally+in+the+mystery+of+salvation.+but+speaks+not+one+word+of+the+general+resurrection+of+our+bodies%2C+of+Christ+coming+to+judge+all+men%2C+of+a+Heaven+and+Hell+after+this+life%2C+as+if+these+were+none+of+the+highest+attaintments+of+the+protestants+generally+in+the+mystery+of+salvation.+And+Saltma <blockquote><p>The Catalogue of the Errors, Heresies, Blasphemies, is as follows: …

144. That there are revelations and visions in these times, yea to some they are more ordinary, and shall be to the people of God, generally within a while.

145. That the gift of miracles is not ceased in these times, but that some of the sectaries have wrought miracles, and miracles have accompanied them in their baptism, etc. and the people of God shall have power of miracles shortly.

146. That anointing the sick with oil by the Elders praying over them, with laying on of hands [James 5], is a Church-ordinance for Church-members that are sick, for their recovery.

147. ‘Tis ordinary for Christians now in these days, with Paul to be rapt up to the third Heavens, and to hear words unutterable, and they cannot well have assurance of being Christians, that have not found and had experience of this.</p></blockquote>

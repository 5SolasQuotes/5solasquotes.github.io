<blockquote><p>We are to do our duties as we have opportunity. We should always be in a right state of mind and heart to do what is required, if the occasion offers.</p></blockquote>

<div class="actions"><button class="copy" data-copy="“We are to do our duties as we have opportunity. We should always be in a right state of mind and heart to do what is required, if the occasion offers.”

</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-18ab2a95ec" data-kw="">
<blockquote><p>The gestures or the external manner of administration of this sacrament must be such as most closely resembles the first Lord’s Supper administered by Christ, as well as the administration of the Lord’s Supper by the apostles and the apostolic churches as recorded in the Holy Scriptures. Then the Lord’s Supper was administered while seated at a table. Since it is a meal, it is therefore proper that it be administered in such a manner as one would serve either common or special meals. To come, one by one, to that which one calls an altar, to there receive the bread out of the hand of the celebrant—who time and again takes it from the altar and gives it to the communicant—to there receive it while kneeling, and to let it be put into his mouth, is superstitious and gives occasion for superstition. To use the sacrament standing and while passing the table is not as edifying. It also does not agree as fully with the first administration as does sitting at the table—be it that the minister gives the bread and the cup to each person one by one, or be it that he breaks the bread and puts it upon dishes which he passes on to those guests who are partaking, subsequently giving the cup to be passed on from hand to hand.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/wilhelmus-a-brakel.html">Wilhelmus à Brakel</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Christian’s Reasonable Service, vol. 2</cite>, pp. 566-67</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/the-lords-supper/preparation-celebration-reflection.html">Preparation, Celebration, Reflection</a></span><span class="t"><a href="../topics/worship/ceremonies-and-things-indifferent.html">Ceremonies and Things Indifferent</a></span></div>

">Read it online · Reformed Books Online</a></div>
</figure><figure class="quote" id="q-22d038a2e3" data-kw="">
<blockquote><p>Problem: Whether the Lord’s Supper can be said directly and proximately to seal the grace of regeneration? Response: It seals the continuation and excitation of it, or of its terminus, namely, faith (as it is an organ) primarily, and new obedience secondarily. But the grace of regeneration which is the cause of faith it designates consequently and mediately, as something presupposed.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/gisbertus-voetius.html">Gisbertus Voetius</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Disputation 30, ‘On Regeneration’, pt. 2 (1639) tr. AI by Roman Prestarri in Select Theological Disputations (1655), vol. 2, pp. 447ff. Latin at Confessionally Reformed Theology</cite></span></figcaption>
<div class="meta"><span class="t"><a href="../topics/the-lords-supper/preparation-celebration-reflection.html">Preparation, Celebration, Reflection</a></span></div>
<div class="actions"><button class="copy" data-copy="“Problem: Whether the Lord’s Supper can be said directly and proximately to seal the grace of regeneration? Response: It seals the continuation and excitation of it, or of its terminus, namely, faith (as it is an organ) primarily, and new obedience secondarily. But the grace of regeneration which is the cause of faith it designates consequently and mediately, as something presupposed.”

</figure><figure class="quote" id="q-77a50f70cb" data-kw="">
<blockquote><p>II. Who Should be Admitted to the Lord’s Table? Second Conclusion: These only are to be admitted to the Supper of the Lord, whom in charity we judge, can and do try and examine themselves, rightly discern the Lord’s body, and who in faith can enunciate the Lord’s death unto his second coming again. And therefore children, infants, ignorants, scandalously flagitious persons, and mad [mentally insane] persons are to be debarred.</p></blockquote>

</figure><figure class="quote" id="q-7e015e2e86" data-kw="">
<blockquote><p>As for the rest of the testimonies Dr. Burgess produces out of the Fathers for kneeling, I need not insist upon them for either they speak of the inward adoration of the heart, which we ought to direct unto Christ when we receive the Sacrament (and this none of us denies), or else they speak of adoring the sacrament: where by the word ‘adoration’ we may not understand any divine worship, inward or outward, but a reverence of another nature, called veneration. That this (which we deny not neither) and no more is meant by the Fathers when they speak of the adoration of the sacrament, Antonius de Dominis shows more copiously (Rep. Eccl., bk. 5, ch. 6).</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/george-gillespie.html">George Gillespie</a></span><span class="wk"><span class="lbl">Work:</span> <cite>English Popish Ceremonies (1637), 3rd Part, ‘Against the Lawfulness of the Ceremonies’, ch. 4, ‘That the Ceremonies are Idols among Formalists themselves; &amp; that kneeling in the Lord’s Supper before the Bread &amp; Wine in the act of receiving them is formally Idolatry’</cite>, p. 79</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/the-lords-supper/preparation-celebration-reflection.html">Preparation, Celebration, Reflection</a></span></div>
<div class="actions"><button class="copy" data-copy="“As for the rest of the testimonies Dr. Burgess produces out of the Fathers for kneeling, I need not insist upon them for either they speak of the inward adoration of the heart, which we ought to direct unto Christ when we receive the Sacrament (and this none of us denies), or else they speak of adoring the sacrament: where by the word ‘adoration’ we may not understand any divine worship, inward or outward, but a reverence of another nature, called veneration. That this (which we deny not neither) and no more is meant by the Fathers when they speak of the adoration of the sacrament, Antonius de Dominis shows more copiously (Rep. Eccl., bk. 5, ch. 6).”

— George Gillespie, English Popish Ceremonies (1637), 3rd Part, ‘Against the Lawfulness of the Ceremonies’, ch. 4, ‘That the Ceremonies are Idols among Formalists themselves; &amp; that kneeling in the Lord’s Supper before the Bread &amp; Wine in the act of receiving them is formally Idolatry’, p. 79">Copy</button><a class="share" href="https://x.com/intent/post?text=%E2%80%9CAs+for+the+rest+of+the+testimonies+Dr.+Burgess+produces+out+of+the+Fathers+for+kneeling%2C+I+need+not+insist+upon+them+for+either+they+speak+of+the+inward+adoration+of+the+heart%2C+which+we+ought+to+direct+unto+Christ+when+we+receive+the+Sacrament+%28and+this+none+of+us+denies%29%2C+or+else+they+speak+of+adoring+the+sacrament%3A+where+by+the+word+%E2%80%98adoration%E2%80%99+we+may+not+understand+any+divine+worship%2C+inward+or+outward%2C+but+a+reverence+of+another+nature%2C+called+veneration.+That+this+%28which+we+deny+not+neither%29+and+no+more+is+meant+by+the+Fathers+when+they+speak+of+the+adoration+of+the+sacrament%2C+Antonius+de+Dominis+shows+more+copiously+%28Rep.+Eccl.%2C+bk.+5%2C+ch.+6%29.%E2%80%9D%0A%0A%E2%80%94+George+Gillespie%2C+English+Popish+Ceremonies+%281637%29%2C+3rd+Part%2C+%E2%80%98Against+the+Lawfulness+of+the+Ceremonies%E2%80%99%2C+ch.+4%2C+%E2%80%98That+the+Ceremonies+are+Idols+among+Formalists+themselves%3B+%26+that+kneeling+in+the+Lord%E2%80%99s+Supper+before+the+Bread+%26+Wine+in+the+act+of+receiving+them+is+formally+Idolatry%E2%80%99%2C+p.+79&amp;url=https%3A%2F%2F5solasquotes.github.io%2Fquote%2F7e015e2e86.html&amp;via=5Solas" target="_blank" rel="noopener">Share on X</a><a class="perma" href="../quote/7e015e2e86.html">Permalink</a><a class="src" href="https://reformedbooksonline.com/topics/the-lords-supper#:~:text=As%20for%20the%20rest%20of%20the,%28Rep.%20Eccl.%2C%20bk.%205%2C%20ch.%206%29." rel="noopener" target="_blank">Read it online · Reformed Books Online</a></div>

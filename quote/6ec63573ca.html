<main class="wrap"><figure class="quote" id="q-6ec63573ca" data-kw="">
<blockquote><p>(2) In this Sinai-Covenant Jesus Christ is frequently tendered unto Israel, and that in variety of notions and considerations as has been abundantly manifested: The Tabernacle, the veil, the ark, the mercy-seat over the ark, the high priest with his consecration, garments, office, etc. the sacrifices of all sorts, the altar of incense, the altar of burnt-offering, etc. they all typed out and tendered Christ to Israel. Consequently true faith in Christ must herein be necessarily implied and required of Israel for discerning Christ in these mysteries, for apprehending and applying Him unto themselves for righteousness and salvation accordingly. For without such faith to apprehend and apply Christ, all these manifestations of Christ to Israel had been vain, useless and ineffectual.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/francis-roberts.html">Francis Roberts</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Mysterium &amp; Medulla Bibliorum: the Mystery &amp; Marrow of the Bible, viz. God’s Covenant with Man</cite>, … (London: R.W., 1657), bk. 3, ch. 4, p. 865</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/attributes-of-god/will-of-god.html">Will of God</a></span></div>

</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-cd32f57039" data-kw="">
<blockquote><p>As in the previous controversies, the rectitude of the distinction depends upon its definition: ‘it is possible to allow a voluntas conditionata [conditional will]’ in God ‘but not in an a priori and antecedent sense, as if dependent on a condition, rather in an a posteriori and consequent sense, given that some condition in the creature intervenes between the will and its execution’; and then ‘only to the extent that the condition does not belong to the internal divine act (a parte actus interni) or volition (volitionis), but to the external object (a parte obiecti externi) or thing willed (rei volitae).’ In this sense, the distinction can legitimately be applied to the promises associated with God’s covenants… the covenants of law and gospel, where God’s promises are extended conditionally to sinners… In other words, the conditional will remains an immutable will, willed eternally by God, but it is understood as being directed toward a contingent or conditional event: the condition, strictly understood, obtains, not in the divine will, but in the temporal event.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/richard-muller.html">Richard Muller</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Post-Reformation Reformed Dogmatics: the Rise &amp; Development of Reformed Theology, ca. 1520 – ca. 1725 2nd</cite>, 5. ‘Voluntas absoluta and voluntas conditionata’ in Post-Reformation Reformed Dogmatics: the Rise &amp; Development of Reformed Theology, ca. 1520 – ca. 1725 2nd ed. (Baker Books, 2003), vol. 3, ch. 5.4, E. The Ad Intra–Ad Extra Distinctions, pp. 463-65, p. 464</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/attributes-of-god/will-of-god.html">Will of God</a></span></div>

— Richard Muller, 5. ‘Voluntas absoluta and voluntas conditionata’ in Post-Reformation Reformed Dogmatics: the Rise &amp; Development of Reformed Theology, ca. 1520 – ca. 1725 2nd ed. (Baker Books, 2003), vol. 3, ch. 5.4, E. The Ad Intra–Ad Extra Distinctions, pp. 463-65, p. 464">Copy</button><a class="share" href="https://x.com/intent/post?text=%E2%80%9CAs+in+the+previous+controversies%2C+the+rectitude+of+the+distinction+depends+upon+its+definition%3A+%E2%80%98it+is+possible+to+allow+a+voluntas+conditionata+%5Bconditional+will%5D%E2%80%99+in+God+%E2%80%98but+not+in+an+a+priori+and+antecedent+sense%2C+as+if+dependent+on+a+condition%2C+rather+in+an+a+posteriori+and+consequent+sense%2C+given+that+some+condition+in+the+creature+intervenes+between+the+will+and+its+execution%E2%80%99%3B+and+then+%E2%80%98only+to+the+extent+that+the+condition+does+not+belong+to+the+internal+divine+act+%28a+parte+actus+interni%29+or+volition+%28volitionis%29%2C+but+to+the+external+object+%28a+parte+obiecti+externi%29+or+thing+willed+%28rei+volitae%29.%E2%80%99+In+this+sense%2C+the+distinction+can+legitimately+be+applied+to+the+promises+associated+with+God%E2%80%99s+covenants%E2%80%A6+the+covenants+of+law+and+gospel%2C+where+God%E2%80%99s+promises+are+extended+conditionally+to+sinners%E2%80%A6+In+other+words%2C+the+conditional+will+remains+an+immutable+will%2C+willed+eternally+by+God%2C+but+it+is+understood+as+being+directed+toward+a+contingent+or+conditional+event%3A+the+condition%2C+strictly+understood%2C+obtains%2C+not+in+the+divine+will%2C+but+in+the+temporal+event.%E2%80%9D%0A%0A%E2%80%94+Richard+Muller%2C+5.+%E2%80%98Voluntas+absoluta+and+voluntas+conditionata%E2%80%99+in+Post-Reformation+Reformed+Dogmatics%3A+the+Rise+%26+Development+of+Reformed+Theology%2C+ca.+1520+%E2%80%93+ca.+1725+2nd+ed.+%28Baker+Books%2C+2003%29%2C+vol.+3%2C+ch.+5.4%2C+E.+The+Ad+Intra%E2%80%93Ad+Extra+Distinctions%2C+pp.+463-65%2C+p.+464&amp;url=https%3A%2F%2F5solasquotes.github.io%2Fquote%2Fcd32f57039.html&amp </figure><figure class="quote" id="q-7c7ba2b842" data-kw="">
<blockquote><p>The revealed will of sign, as such, teaches, illuminates, directs and obligates men to the regulation of acts, whether those regulated acts actually exist and happen, or not.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/samuel-rutherford.html">Samuel Rutherford</a></span><span class="wk"><span class="lbl">Work:</span> <cite>A Scholastic Disputation on Divine Providence, chs. 1-10</cite>, tr. by AI by Onku (Edinburgh, 1649), ch. 2. ‘What is the nature of the permissive will of God, and of the will of good pleasure and sign. The Remonstrants, Arminians are called to the discussion’, p. 16</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/attributes-of-god/will-of-god.html">Will of God</a></span></div>
<div class="actions"><button class="copy" data-copy="“The revealed will of sign, as such, teaches, illuminates, directs and obligates men to the regulation of acts, whether those regulated acts actually exist and happen, or not.”

</figure><figure class="quote" id="q-e33d02e0fa" data-kw="">
<blockquote><p>For God properly intends no end of his volitions or actions but Himself, unto whose glory all things have naturam mediorum [the nature of means], not intenti finis [the intention of an end]. The intention therefore of means by God unto any lower or inferior end [such as salvation in the gospel call] is nothing else but the fitness of such means considered in themselves (and not abused) for the producing of that end: And this intention is not altered by the decree of reprobation; for that decree as it is immanent and eternal in voluntate divina, nihil ponit in reprobato [in the divine will, puts nothing in the reprobate]: And when the temporal execution comes, it puts no malice into his will; it puts no necessitation unto wicked actions upon his will; it only puts in God an absolute will of not-giving effectual grace, and of not-working in him salutiferous actions, whereupon follows perditio tua exte [your destruction is out of yourself, Hos. 13:9].</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/john-davenant.html">John Davenant</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Animadversions upon a Treatise entitled, God’s Love to Mankind</cite>, ... (Cambridge: Daniel, 1641), ‘Answer: Whether the decree of absolute Reprobation is contrary unto the use and end of God’s gifts bestowed upon men,’, pp. 398-99</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/attributes-of-god/will-of-god.html">Will of God</a></span></div>

.%2013%3A9&amp;text=For%20God%20properly%20intends%20no%20end%20of%20his&amp;text=your%20destruction%20is%20out%20of%20yourself%2C%20Hos.%2013%3A9" rel="noopener" target="_blank">Read it online · Reformed Books Online</a></div>
</figure><figure class="quote" id="q-ef4bec73dc" data-kw="will irresistible precept">
<blockquote><p>The decretive will relates to the futurition and the event of things and is the rule of God’s external acts; the preceptive is concerned with precepts and promises and is the rule of our action. The former cannot be resisted and is always fulfilled: “Who hath resisted his will?” (Rom. 9:19). The latter is often violated by men: “How often would I have gathered you together, and ye would not” (Mt. 23:37).</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/francis-turretin.html">Francis Turretin</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Institutes of Elenctic Theology</cite>, 3.15.2</span></figcaption>

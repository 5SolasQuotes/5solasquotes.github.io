<main class="wrap"><figure class="quote" id="q-c2d545bb95" data-kw="">
<blockquote><p>God is the first cause of all love in us. Hence he has this perfection either formally or virtually. If you concede that the love is better than not to love, God cannot have love only virtually, because the more imperfect does not include the more perfect virtually. Therefore God has love formally.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/alan-b-wolter.html">Alan B. Wolter</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Little Summary of Metaphysics (Milwaukee: Bruce Publishing Co., 1958)</cite>, pp. 93-95; p. 101</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/creation/the-six-days.html">The Six Days</a></span></div>

— Alan B. Wolter, Little Summary of Metaphysics (Milwaukee: Bruce Publishing Co., 1958), pp. 93-95; p. 101">Copy</button><a class="share" href="https://x.com/intent/post?text=%E2%80%9CGod+is+the+first+cause+of+all+love+in+us.+Hence+he+has+this+perfection+either+formally+or+virtually.+If+you+concede+that+the+love+is+better+than+not+to+love%2C+God+cannot+have+love+only+virtually%2C+because+the+more+imperfect+does+not+include+the+more+perfect+virtually.+Therefore+God+has+love+formally.%E2%80%9D%0A%0A%E2%80%94+Alan+B.+Wolter%2C+Little+Summary+of+Metaphysics+%28Milwaukee%3A+Bruce+Publishing+Co.%2C+1958%29%2C+pp.+93-95%3B+p.+101&amp;url=https%3A%2F%2F5solasquotes.github.io%2Fquote%2Fc2d545bb95.html&amp;via=5Solas" target="_blank" rel="noopener">Share on X</a><a class="perma" href="../quote/c2d545bb95.html">Permalink</a><a class="src" href="https://reformedbooksonline.com/topics/creation#:~:text=God%20is%20the%20first%20cause%20of,virtually.%20Therefore%20God%20has%20love%20formally." rel="noopener" target="_blank">Read it online · Reformed Books Online</a></div>
</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-879510ff62" data-kw="">
<blockquote><p>In God, however, it is otherwise. For it was shown above (Q. 4, A. 2) that whatever perfection exists in any creature, wholly pre-exists and is contained in God in an excelling manner. Now not only what is common to creatures—viz., being—belongs to their perfection, but also what makes them distinguished from each other; as living and understanding, and the like, whereby living beings are distinguished from the non-living, and the intelligent from the non-intelligent. Likewise every form whereby each thing is constituted in its own species, is a perfection; and thus all things pre-exist in God, not only as regards what is common to all, but also as regards what distinguishes one thing from another. And therefore as God contains all perfections in Himself, the essence of God is compared to all other essences of things, not as the common to the proper, as unity is to numbers, or as the center (of a circle) to the (radiating) lines; but as perfect acts to imperfect; as if I were to compare man to animal; or six, a perfect number, to the imperfect numbers contained under it. Now it is manifest that by a perfect act, imperfect acts can be known not only in general, but also by proper knowledge; thus, for example, whoever knows a man, knows an animal by proper knowledge; and whoever knows the number six, knows the number three also by proper knowledge. As therefore the essence of God contains in itself all the perfection contained in the essence of any other being, and far more, God can know in Himself all of them with proper knowledge. For the nature proper to each thing consists in some degree of participation in the divine perfection. Now God could not be said to know Himself perfectly unless He knew all the ways in which His own perfection can be shared by others. Neither could He know the very nature of being perfectly, unless He knew all modes of being. Hence it is manifest that God knows all things with proper knowledge, in their distinction from each other.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/thomas-aquinas.html">Thomas Aquinas</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Summa, pt. 1 | quest. 14, art. 6, I answer that</cite></span></figcaption>
<div class="meta"><span class="t"><a href="../topics/creation/the-six-days.html">The Six Days</a></span></div>

</figure><figure class="quote" id="q-4f8dce999b" data-kw="">
<blockquote><p>As to the second part of my reflections, wherein I doubt concerning the earth’s moving about its axis, it may be I differ from you [John Woodward, a professor of physics, to whom the work is dedicated], and from the generality of Virtuosos [New Philosophers] at this day. But truly I am not so much a [Brahe] Tychonian as to forswear the Copernican Hypothesis: But the truth of the matter is this, when I was treating of the most substantial points of divinity, that is, when I was asserting and vindicating the being and providence of God, I was unwilling to found these or anything belonging to them upon an infirm and unstable basis, upon a dubious and disputable doctrine, and which had not long prevailed in the learned world. Such I take the opinion of the circumgyration of the earth to be: and therefore till I could be absolutely satisfied about the reality of it, I thought it was safest to aquiesce at present in the other doctrine, and the rather because it is suitable to the mundane system which Moses presents us with, whose literal sense of the account of it is not to be slighted by Christian philosophers.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/john-edwards.html">John Edwards</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Brief Remarks upon Mr. [William] Whiston’s New Theory of the Earth &amp; upon an other Gentleman’s Objections Against Some Passages in a Discourse of the Existence &amp; Providence of God, Relating to the Copernican Hypothesis (London, 1697)</cite></span></figcaption>
<div class="meta"><span class="t"><a href="../topics/creation/the-six-days.html">The Six Days</a></span></div>

</figure><figure class="quote" id="q-36fc3bfe73" data-kw="">
<blockquote><p>Q. 4. In what time did God create all things? A. God created all things in the space of six days. He could have created all things together in a moment, but he took six days’ time to work in, and rested on the seventh day, that we might the better apprehend the order of the creation, and that we might imitate Him in working but six days of the week, and in resting on the seventh.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/thomas-vincent.html">Thomas Vincent</a></span><span class="wk"><span class="lbl">Work:</span> <cite>An Explicatory Catechism; or, An Explanation of the Assembly’s Shorter Catechism (1673; NY: Deare, 1806), Question 9, ‘What is the work of creation?’</cite>, p. 44</span></figcaption>

</figure><figure class="quote" id="q-f14b20fcab" data-kw="">
<blockquote><p>‘My Father worketh hitherto, etc.’ God having finished that work of Creation in the space of six days, rested from that work on the seventh day; but from the work of his providence, and governing the things He has made, He never rested one day from the Creation of the world. In six days the Creation of the world was finished, but the government thereof is perpetual, and God continually works in preserving and maintaining the order thereof, even as the apostle says…</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/william-gearing.html">William Gearing</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Eye &amp; Wheel of Providence, or a Treatise Proving that there is a Divine Providence (London: Tyton, 1662), ch. 1</cite>, pp. 5-6</span></figcaption>

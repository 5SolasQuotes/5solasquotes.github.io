<main class="wrap"><figure class="quote" id="q-af5b4d5876" data-kw="">
<blockquote><p>For I count it a special instance of God’s gracious providence to me, not only that I was born of a parent eminent for learning and piety… but also in this, that I was well acquainted with his doctrine, and particularly in this head concerning justification, which he had discussed with a piercing reason, and explicated with a happy perspicuity; not leaning to his own understanding, but after an examination of an innumerable variety of writers on this argument, making the language of Scripture in the common sense of the words the rule of his judgment and speaking, that he might speak as the oracles of God. (1 Pet. 4:11) By this religious observing the form of wholesome words, he did disentangle the truth from many thorny controversies, which have been raised impertinently, but agitated with much heat, to the injury of truth and peace.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/thomas-gataker.html">Thomas Gataker</a></span><span class="wk"><span class="lbl">Work:</span> <cite>An Antidote Against Error Concerning Justification</cite>, … (d. 1654; London: Brome, 1670), Preface</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/the-church/church-unity-and-fundamentals.html">Church Unity and Fundamentals</a></span></div>

</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-13cadfdfe6" data-kw="">
<blockquote><p>To conclude this, separation from Churches, from which Christ does not separate, is schismatical; now it’s clear in the Scripture that Christ owns churches where faith is sound for the substance, and their worship, Gospel-worship, though there be many defects and sinful mixtures among them. And what I have said concerning the schismaticalness of separation because of the sinful mixtures of those who are wicked in practice, is as true concerning separation from them who are erroneous in judgment; if the errors of those from whom the separation is made, be not fundamental, and hinder communion with Christ the head. And much more clear (if clearer can be) is the schismaticalness of those who separate from and renounce all communion with those churches which are not of their own manner of constitution and modelled according to the platform of their own particular church-order. To refrain fellowship and communion with such Churches who profess Christ their Lord, whose faith is sound, whose worship is Gospel-worship, whose lives are holy, because they come not into that particular way of church-order which we have pitched upon, is a schismatical rending of the Church of Christ to pieces… Herein likewise those separatists among ourselves are heinously faulty who censure and condemn all other churches, though their faith, worship and conversation be never so scriptural, merely because they are not gathered into church order according to their own patterns. In Scripture, Churches are commended and dignified, according as their fundamental faith was sound and their lives holy; not according to the regularity of their first manner of gathering.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/william-jenkyn.html">William Jenkyn</a></span><span class="wk"><span class="lbl">Work:</span> <cite>An Exposition of the Epistle of Jude</cite>, ... (London: Maxey, 1654), on verse 19, Observations, p. 593</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/the-church/church-unity-and-fundamentals.html">Church Unity and Fundamentals</a></span></div>

</figure><figure class="quote" id="q-38d5a0ab65" data-kw="">
<blockquote><p>2. It is not a bare union of men that makes a Church a true Church, but that union must have truth for its foundation; else you know thieves and robbers and highway-men and pirates, and buccaneers, because they agree among themselves, might lay claim to this title, and the most perverse heretics, because they agree in certain points, might say they are the true Church… … And indeed, that which justifies the Protestant Churches’ separation from her [Rome], or breaking peace and communion with her is:

1. Because she would impose that upon the consciences of men which Christ and his apostles never imposed.

2. Because she has turned the spiritual worship of the Gospel into carnal and mechanical devotion and introduced innumerable superstitions… … 5. Because rejecting the supreme authority of the Scriptures, which are the sole rule of Faith, she has made her pretended head, and such councils as he shall call or approve of, the sole dictators and expositors of the doctrine of Christ, requiring blind obedience to their decisions… The divisions among Protestant Churches are to be deplored so much the more because the points they differ in are inconsiderable and might easily be composed if men had but peaceable tempers and were resolved to lay aside interest and carnal respects, and punctilios of honor and credit, etc. for they all agree in fundamentals, all are satisfied that the Church of Rome has notoriously deviated from the simplicity of the Gospel; and the matters in difference, are things in which salvation is not concerned. And upon that account their labours deserve great commendations, who heretofore and very lately have endeavored to reconcile the Protestant Churches into a perfect union: A blessed work. Blessed are the peacemakers, that endeavor to make peace among the jarring members of Christ’s Body; and though they may fail of success, yet they shall not lose their reward. In the meanwhile those who widen or heighten these differences, and incite the respective parties to hatred, and wrath, and animosities one against another, to be sure are no children of the God of peace, and had need at least before they die make public satisfaction for the dreadful effects their heats and passions do produce. But as this peace among Protestant Churches is very much to be wished and prayed for…</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/anthony-horneck.html">Anthony Horneck</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Blessed Advantages of Peace &amp; Peacemakers In a Sermon preached at the Savoy in London upon the Fifth of St. Matthew</cite>, verse 9, ‘Blessed are the Peace-makers…’ (London: Aylmer, 1697), pp. 29-34</span></figcaption>

<blockquote><p>The French national synods of Gap (1603) and La Rochelle (1607) were prime examples of this. Philippe du Plessis-Mornay (1549-1623), the advisor to Henry of Navarre, used fundamental articles in his Traite de I’Eglise (1578) as a basis for suggesting an accord with the Church of England. James I responded to the French Reformed initiative by sending a letter to the Synod of Toniens (1614) expressing his own desire for union. The Synod went on to adopt a series of procedures designed to set up an international synod which would formulate procedures for establishing a common Reformed-Anglican-Lutheran statement of faith based on the fundamental articles… Mornay also used fundamental articles in his description of the true church. Philippe du Plessis-Mornay, Traite de l’Eglise, 2d ed. (La Rochelle, 1599), pp. 75-77; 172-75.” – Martin Klauber, “Drive toward Protestant Union,” Church History, 61.3 (1992), p. 338 fn. 16 Beza, Theodore – Traicté des vrayes essencielles et visibles marques de la vraye Eglise catholique (1592) 108 pp. Martin Klauber: “Beza placed his discussion of fundamental articles within the framework of his treatise on the true marks of the Church. In his Traicte des vrayes essencielles et visibles marques de la vraye Eglise Catholique (1592), Beza defined the fundamental articles as being summarized in the Ten Commandments, the Apostles Creed, and the Lord’s Prayer. He argued further that such fundamental articles such as the Trinity and the two natures of Christ are essential marks of the true Church.” “Drive toward Protestant Union,” Church History, 61.3 (1992), p. 336, fn. 7 Junius, Francis – Le paisible chrestien ou de la paix de l’Eglise catholique… sur les Pseaumes 122 et 133 (Leiden: 1593) 392 pp. no ToC . 1600’s Jurieu, Pierre The Authentic System of the Church &amp; a True Analysis of the Faith… (Dort, 1686) ToC Jurieu (1637-1713) was a French reformed minister and prolific author. Wikipedia: “The most famous of the controversies on this subject was that between [the Romanist, Jacques-Bénigne] Bossuet [1627-1704] and the Calvinist Jurieu. Jurieu’s book… ‘Le Vray Systeme’ was an attempt to demonstrate the right of the French Protestants to rank as members of the Church Universal… According to him all sects without exception are members of Body of Christ. For this nothing is necessary but “to belong to a general confederation, to confess Jesus Christ as Son of God, as Saviour of the world, and as Messias; and to receive the Old and New Testaments as the rule and Law of Christians”, (Système, p. 53). Yet among the various portions of the Church we must, he tells us, distinguish four classes:

1. Sects that have retained all the truths taught in the Scriptures;

2. Sects that, while retaining the more important truths, have mingled with them superstitions and errors;

3. Sects that have retained the fundamental truths, but have added doctrines incompatible with them;

4. Sects that have set the fundamental verities aside altogether. This last class are dead members of the mystical body (ibid., p. 52). Those who have retained the fundamental articles of the faith are, one and all, living parts of the Church. When he comes to define precisely which doctrines are, and which are not, fundamental, Jurieu bids us fall back on the rule of Vincent of Lérins [d. c. 445]: Quod semper, quod ubique, quod ab omnibus [that which is always, everywhere and from all]. Wherever all bodies of Christians still exist and possess some importance in the world, and agree in accepting a dogma, we have, in that agreement, a criterion that may be considered infallible. Among truths so guaranteed are the doctrine of the Trinity, the Divinity of Jesus Christ, the Redemption, the satisfaction, original sin, creation, grace, the immortality of the soul, the eternity of punishment (ibid, 236-237). This work was followed, in 1688, by another entitled “Traité de l’unité de l’Eglise et des articles fondamentaux”, written in reply to Nicole’s criticisms. In the same year appeared Bossuet’s “Histoire des Variations des Eglises protestantes”… In regard to the relation of the fundamental doctrines to salvation, Jurieu is in agreement with the English divines already quoted. “By fundamental points”, he says, “we understand certain general principles of the Christian religion, a distinct faith and belief in which are necessary to salvation” (Traité, p. 495).</p></blockquote>

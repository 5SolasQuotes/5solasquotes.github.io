<main class="wrap"><figure class="quote" id="q-5854e4d29d" data-kw="">
<blockquote><p>Autopistia offers a historical survey and a theological evaluation of the self-convincing character of Scripture in Reformed theology. Calvin adopted the term autopistos from ancient Greek philosophy and used it to express that faith does not rest on the human authority of the church but on Scripture as the living voice of God. After discussing the meaning of the term in Reformed Orthodoxy and analyzing the theological position of Benjamin B. Warfield and Herman Bavinck on this issue… Van den Belt draws his theological conclusions in this study, advocating a revitalization of the autopistia of Scripture…</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/hendrik-van-den-belt.html">Hendrik van den Belt</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Autopistia: the Self-Convincing Authority of Scripture in Reformed Theology PhD diss</cite>, (Leiden Univ., 2006) 345, pp. ToC</span></figcaption>

</figure><figure class="quote" id="q-44c5e69a32" data-kw="">
<blockquote><p>Thesis VIII: In the meantime, we do not agree with Nominalists who think that universals are purely nominal. For not only do we admit that things exist before the operation of the mind, which are called universals, as they also concede, but we also admit that there is in things the foundation of universality without the operation of the mind, namely, that exact similarity of many individuals of the same species in formal unity, which they do not concede. In this, we also differ from Scotus, who wants that exact similarity of many individuals in formal unity to be true unity, and thus, universal unity itself. However, we assert that, as singular individuals are per se one thing, and this not only by numerical unity but also by formal unity, we genuinely deny that the natures of many individuals without the operation of the mind are one nature. We acknowledge some similarity and agreement but not unity.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/franco-burgersdijk.html">Franco Burgersdijk</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Institutionum Metaphysicarum</cite>, ch. 13, “On Universal Unity” tr. T.J. Floyd</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/theology/faith-and-reason.html">Faith and Reason</a></span></div>

</figure><figure class="quote" id="q-81fb419190" data-kw="">
<blockquote><p>We should not immediately reject a doctrine, or even doubt it, just for the sake of mental exercise… Problem 1. In order to do theology freely and skillfully, should we clear our minds of all preconceptions to the point that we doubt everything we have learned through diligent study, meditation, and the teaching of our instructors, and treat it all as false (even if it is not), until the truth is inscribed anew on our minds like a blank slate, after proper and methodical inquiry and demonstration based on certain principles? Answer: No. The Remonstrants wanted the National Synod to revise the Confession and Catechism, and they wanted the Synod members to be released from affirming the Belgic Catechism and Confession in the meantime, supposedly so they would not be hindered by any preconceptions in perceiving and judging the truth. Therefore, should we have temporarily suspended our agreement with, belief in, and profession of the truths attested by our affirmation (e.g., in articles 1 and 2 of the Confession)? Therefore, should the Reformed Synod have re-examined and investigated the article or thesis ‘That there is a God?’ I ask the same about the truths and theses of natural theology or philosophy concerning God, his attributes and works, providence, the distinction between moral good and evil, the honorable and the base, etc. I ask the same about the basic catechetical elements instilled and proven from God’s word in infancy, childhood, and adolescence, before someone devoted himself to theological studies in an academic program.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/gisbertus-voetius.html">Gisbertus Voetius</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Disputation on the Ways of Knowing God, pt. 1</cite>, tr. Michael Lynch (1665; 2024) at Translationes Lyncei</span></figcaption>

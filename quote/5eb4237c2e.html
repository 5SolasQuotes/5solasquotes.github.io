<main class="wrap"><figure class="quote" id="q-5eb4237c2e" data-kw="">
<blockquote><p>VII. (2) The question [at hand to be discussed] is not whether God is born by a general love and philanthropy (philanthropia) towards men as his creatures, and also bestows upon them various temporal benefits pertaining to the things of this life (ta biotika). We do not deny that God has never left Himself without witness (amartyron) with regard to this (Acts 14:17). And we readily grant that there is no one who does not owe some gratitude to God and who, whatever he is or can do, is not bound to give thanks to his Creator. But the question concerns the special and saving love which tends to spiritual benefits, and by which God willed to have mercy upon them to salvation. We think this is particular to the elect alone, not universal and common to all.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/francis-turretin.html">Francis Turretin</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Institutes of Elenctic Theology</cite>, vol. 1, 17th Question, VII, pp. 396-97</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/effectual-calling/common-grace.html">Common Grace</a></span></div>

</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-519ad3ac82" data-kw="">
<blockquote><p>Secondly, It is not denied by the advocates of particular redemption, or of a limited atonement, that mankind in general, even those who ultimately perish, do derive some advantages or benefits from Christ’s death; and no position they hold requires them to deny this. They believe that important benefits have accrued to the whole human race from the death of Christ, and that in these benefits those who are finally impenitent and unbelieving partake… Many blessings flow to mankind at large from the death of Christ, collaterally and incidentally, in consequence of the relation in which men, viewed collectively, stand to each other. All these benefits were of course forseen by God, when He resolved to send His Son into the world; they were contemplated or designed by Him, as what men should receive and enjoy. They are to be regarded and received as bestowed by Him, and as thus unfolding His glory, indicating His character, and actually accomplishing His purposes; and they are to be viewed as coming to men through the channel of Christ’s mediation, of His sufferings and death. [There is a footnote to Witsius, Economy of the Covenants, Book 2, Ch. 9, Section 4] The truth of this position has been considered as affording some warrant for saying, in a vague and indefinite sense, that Christ died for all men; and in this sense, and on this account, some Calvinists have scrupled about meeting the position that Christ died for all men with a direct negative, as if they might thus be understood as denying that there was any sense in which all men derived benefit, and in which God intended that they should derive benefit from Christ’s death… The advocates of universal atonement, then, have no right to charge us with teaching that none derive any benefit from Christ’s death except those who are pardoned and saved; we do not teach this, and we are not bound in consistency to teach it. We teach the opposite of this; and we are not deterred from doing so by the fear lest we should thereby afford to those who are opposed to us…</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/william-cunningham.html">William Cunningham</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Historical Theology</cite>, (1863), vol. 2 | ‘Extent of Atonement &amp; Gospel Offer’, p. 332-334, 343-348</span></figcaption>

</figure><figure class="quote" id="q-4f42522e02" data-kw="">
<blockquote><p>Now the book of life in this place must not be so strictly taken as if it included those only that were elect of God to eternal life, but must be understood of that book wherein are recorded the rules and bounds of visible church-communion; and so all those that, through the gifts and operations of special or common grace, do fall within the compass of those rules and bounds. Thus it was in the type at the return out of captivity, none were to be admitted entrance into the church but those that could show their privileges by genealogy and the records of the church; and to others it was said that they had neither portion, nor lot, nor memorial, in Jerusalem (Ezr. 2:62,63; Neh. 7:64,65; 2:20).</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/john-bunyan.html">John Bunyan</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Works</cite>, vol., 3:449</span></figcaption>

</figure><figure class="quote" id="q-47a3120ee1" data-kw="">
<blockquote><p>Shortly after that the people of Israel, I mean the tribes of Juda, Benjamin, and Levi, were, by the miraculous work of God, after the bondage of seventy years, set at liberty and brought again to Jerusalem; in which they did re-edify the temple, repair the walls, and begin to multiply, and so to grow to some strength within the city and land; they fall to their old nature, I mean to be ungrate and unthankful unto God. The people were slothful; and the priests, who should have provoked the people to the remembrance of those great benefits, were become even like to the rest. The Lord therefore did raise up his Prophet Malachi (who was the last before Christ) sharply to rebuke, and plainly to convict this horrible ingratitude of that unthankful nation, who so shamefully had forgotten those so great benefits recently bestowed upon them. And thus begins he his Prophecy: “I have loved you, sayeth the Lord,” in which words he speaks not of a common love, which in preserving and feeding all creatures is common to the reprobate, but of that love by the which he had sanctified and separated them from the rest of nations, to have his glory manifested. But because they (as all ungrate persons do) did not consider wherein this his love towards them more then towards others did stand, he brings them to the fountain, demanding this question: “Was not Esau brother to Jacob? saith the Lord, and nevertheless Jacob have I loved, and Esau I have hated.” And this he proves, not only by the diversity of the two countries which were given to their posterities, but also by that, that God continually showed himself loving to Jacob and to his posterity [which group of people included reprobates], reducing them again after long captivity; declaring himself, as it were, enemy to Edom, whose desolation he would never restore, but would destroy that which they should go about to build.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/john-knox.html">John Knox</a></span><span class="wk"><span class="lbl">Work:</span> <cite>“On Predestination” in The Works of John Knox</cite>, ed. David Laing (Edinburgh: J. Thin, 1895), 5:150-51</span></figcaption>

</figure><figure class="quote" id="q-f7b5874a2c" data-kw="">
<blockquote><p>the entire history of the human race, from the apostasy to the final judgment, is a dispensation of forbearance in respect to the reprobate, in which many blessings, physical and moral, affecting their characters and destinies forever, accrue even to the heathen, and many more to the educated and refined citizens of Christian communities. These come to them through the mediation of Christ, and coming to them now, must have been designed for them from the beginning.</p></blockquote>

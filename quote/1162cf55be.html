<main class="wrap"><figure class="quote" id="q-1162cf55be" data-kw="">
<blockquote><p>For now the case is all one, as if the choice or agreement, Covenant, of consent were originally made but yesterday. And then consider it. We are a multitude of Free-men, and whereas we might have agreed on an Aristocracy, We agreed on a King on such and such Covenants or Conditions, without mention that we will resist if he break them. But simply promise Obedience on those Conditions, and he on those accepts the Crown. But next day breaks all, and shews he is bent to subvert all Religion, Lawes, and Liberties.

How now in Reason (for of Scripture we spake enough before) can it be supposed, that such a choice or agreement, hath turned us into such Slaves, as we must only suffer, and not at all resist, (or rather is not all reason plain, that I have given away no more of my natural freedom (which is to resist all violence and wrong) then I meant and expressed to give away.

I say then, that unless a Nation have covenanted not to resist in such and such cases, they have power to resist, because it is a natural right each hath against all (except Parents) so far is it from my being bound not to resist, unless I have expressly covenanted that I may. Though withal I do not say, that I may covenant at all to resist in no case, as I shall have occasion to shew anon.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/herbert-palmer.html">Herbert Palmer</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Scripture and reason pleaded for defensive arms: or The whole controversy about subjects taking up arms Wherein besides other pamphlets, an answer is punctually directed to Dr. Ferne’s book, entitled, Resolving of conscience, &amp;c. The scriptures alleged are fully satisfied. The rational discourses ar</cite>, (London: John White, 1643), p. 40.</span></figcaption>

</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-bb1b33fbe2" data-kw="">
<blockquote><p>The magistrates sinfully required Christ to pay an Erastian, tribute tax upon the Church (Mt. 17:24–27). Christ, speaking of his example as a precedent for all his disciples for all history, chose the lesser material evil (or rather fulfilled the highest good attainable), submitted to this bondage, here declined the exercise of his (and our) Christian liberty and publicly gave that bond while verbally testifying privately (not publicly) that He was not so subject (Mt. 17:24–27).¹ ¹ See ‘On the Ethics of Paying Specific Taxes designated to a Corrupt Purpose or Imposed by a Usurped Authority or Usurper’ and ‘On the Ethics of Paying the Scottish Cess Near &amp; During the Killing Times’ at ‘On Paying Taxes’ (RBO). Is this a protestatio contraria facto, “a protestation contrary to fact,” as the non-indulged [Scottish ministers] censured the indulged with?² Did Jesus compromise his authority or the exercise of his ministry? ² Wodrow, History, 2.179 &amp; 492. Was the protest God told Samuel to make against the people’s desires having their own human king contrary to the fact when Samuel, per God’s direction, facilitated, anointed and enthroned king Saul for them? (1 Sam. 8:9)</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/travis-fentiman.html">Travis Fentiman</a></span><span class="wk"><span class="lbl">Work:</span> <cite>“Editor’s Extended Introduction” in English Puritans, A Refutation of the Errors of Separatists</cite>, p. 151 in English Puritans, A Refutation of the Errors of Separatists (1604; 1644; RBO, 2025)</span></figcaption>

</figure><figure class="quote" id="q-080fdcf6c5" data-kw="">
<blockquote><p>It was framed and concluded by the representatives of kingdoms in concurrence with those of the Church; it was sworn by them in their public capacity; at their call and by their authority, it was afterwards sworn by the body of all the people in their different ranks and orders; and finally it was ratified and pronounced valid by laws both civil and ecclesiastical. The public faith was thus plighted by all the organs through which a nation is accustomed to express its mind and will. Nothing was wanting to complete the national tie, and to render it permanent; unless it should be maintained that absolute unanimity is necessary, and that a society cannot contract lawful engagements to God or man, as long as there are individuals who oppose and are dissentient. Sanctions less sacred, and pledges less numerous would have given another nation, or even an individual, a perfect right to demand from Britain the fulfillment of any treaty or contract; and shall not God – who was not only a witness, but a principal party, and whose honor and interests were immediately concerned in this transaction – have a like claim? Or shall we “break the covenant and escape? [Ezekiel 17:15]</p></blockquote>

<blockquote><p>I might trace a little the time of faith’s first infusion and first operation in the heart, which is undoubtedly at the new birth, when ever it is. But how to prescribe, and when precisely to determine that, in the soul of a believer is more difficult than to state the quickening or animation of an embryo in the womb of her that is with child, or for any naturallist so set the moment of the first separation of night from day at the initiating crepusculum or ascent of the first atom of the morning rays of the sun’s body, or the primogenial fermentation of the vegetative soul in the seed-corn in the earth… It’s much more difficult to set down the first punctual workings of the Spirit in our hearts.</p></blockquote>

<blockquote><p>In times past, when Saul was king over us, it was you who led out and brought in Israel. And the Lord said to you, ‘You shall be shepherd of my people Israel, and you shall be prince over Israel.’” (2 Samuel 5:2)

And moreover, under this word ‘pastor’, the office of a good king is expressed to us in this reign of David; namely, that he must care for his subjects as a shepherd for his flock. Now two things are required of a shepherd. The first is that he provide his animals with good pasture, and then that he keep them safe from all thieves and wolves and trouble. Now that (I say) is what princes must do. If they think that they will render an account to God for the charge that is committed to them, they must see to it that their subjects live in peace and that they are maintained; and then, in the second place, that they defend them against all troubles. How far from that are those who call themselves pastors but who ask for nothing but the wool – and are not even content with that. They must fleece their poor subjects; they cut their throats to suck up their blood.

One sees today that princes have neither regard nor consideration for their duty, which is to keep their subjects in good pasture. They are supposed to care for them but, on the contrary, they are like lions. Puffed up with pride, they think the world is created for them alone, and hence they have no scruples about swallowing up and eating the substance of poor people. And after they have thus consumed their poor subjects, ambition also pushes them to wage war. It does not matter to them that people burn and kill, and that the earth is full of orphans and widows. And why? Because they are princes, they say, and have power to do this. Indeed, but as the psalmist says, ‘God is seated in the midst of them and has ordained them with this charge for which they must give account’ (Psa. 47:8-9). And they will be judged like the very smallest. For ‘this world will pass’ with its ‘fashion’ (1 Cor. 7:31). But those who hold a slightly higher rank and dominion over the people must carefully note this – that they are pastors. That was known even by the pagans, for when they spoke of kings and princes, they by the pagans, for when they spoke of kings and princes, they called them pastors, as their writings demonstrate. And who taught them such language? God, who imprinted it in their hearts, so as to render inexcusable those who employ tyranny.</p></blockquote>

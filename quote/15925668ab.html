<main class="wrap"><figure class="quote" id="q-15925668ab" data-kw="">
<blockquote><p>And if St. Paul in the choice of the widow to attend upon the sick of the church, which was the lowest office in the church, requires not only such a one as is at the time of the choice honest and holy, but such a one as has led her whole life in all good works and with commendation, how much more is that to be observed in the minister or bishop of the church…</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/thomas-cartwright.html">Thomas Cartwright</a></span><span class="wk"><span class="lbl">Work:</span> <cite>A Reply to an Answer made of Mr. Doctor Whitgift Against the</cite>, [Presbyterian] Admonition to the Parliament (1573) | ‘To the next section beginning in the 38th page,’, p. 41</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/church-government-and-the-ministry/offices.html">Offices</a></span></div>

</figure><figure class="quote" id="q-0d368330bf" data-kw="">
<blockquote><p>In the churches, we know that there were many ἐπισκοποι (Acts 20:17, 28; Phil. 1:1), and this work of overseeing was specifically charged to the πρεσβυτεροι (Acts 20:17, 28; 1 Tim. 3:1–7; 5:17; Titus 1:5, 7; 1 Pet. 5:1–3). In line with this, Peter also calls himself an elder (πρεσβυτερος, 1 Pet. 5:1). Of a special institution of the episcopate alongside the presbyterate, accordingly, the New Testament knows nothing.</p></blockquote>

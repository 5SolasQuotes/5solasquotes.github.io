<blockquote><p>…but then comes forgiveness when Jesus comes by faith into the heart, and takes possession there.</p></blockquote>

</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-f0bd9502b8" data-kw="">
<blockquote><p>‘Behold, I stand at the door and knock, If any man will open…’ (Rev. 3:20). Alas, we cannot open the door, it is so locked and barred and bolted that it is impossible for us to open it. True, it is so, but yet there is a way to open, and that is to be opening when God would help us to open. When God offers to help you to open the door, then set upon opening the door, and whatever the bolts, bars and locks are, you shall be sure to have it open. Ah, but when does God offer to help us to open it? Then when His Spirit knocks, when in the motions of it He solicits us to open, then God offers His help to help us to open. Take that time and then set on the work and the door shall be opened. But if that time is neglected we may strive to open but cannot open, because then that power is gone that would have helped us to open. See Eccl. 9:12, ‘For man also knoweth not his time.&#x27;</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/jeremiah-dyke.html">Jeremiah Dyke</a></span><span class="wk"><span class="lbl">Work:</span> <cite>‘Of Quenching &amp; Not Quenching of the Spirit’</cite>, (d. 1620; 1640; RBO, 2018), p. 47</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/effectual-calling/means-of-calling.html">Means of Calling</a></span></div>

</figure><figure class="quote" id="q-4f3926db77" data-kw="">
<blockquote><p>Saint Augustine makes it plain again, Non ideo non habet homo Deus non dat, sed quia homo non acipit [A man does not lack it because God does not give, but because the man does not receive]: men become hardened, and want the spirit of grace, why? Not because God does not offer it unto them, but because they receive it not, when it is offered. For example: One of us being sick and like[ly] to die, the physician knowing our case, he takes with him some preservative to comfort us, and comes to the door and knocks; if we will not or be not able to let him in, we perish and die, and the cause is not in the physician, but in ourselves that let him not in. Amartema nosema, ‘Sin is a disease’, whereof we are all sick, for we have all sinned: Rom. 6:12. Christ is the Physician of our souls: Venit de cœlo magnus medicus, quia per totum ubique iacebit agrotus [A great physician came from heaven, because everywhere the sick man lay throughout the whole world]. Christ the great Physician came down from heaven, because all mankind was generally infected. He comes to the door of our hearts and knocks, Rev. 3:20, “Behold, I stand at the door and knock.” He brings with Him arton tes zoes, ‘the bread of life’ [Jn. 6:35], his eternal Word to comfort us, if we let Him in, if we open the door of our hearts, He will come in and sup with us, as He did with Mary [Lk. 10], and forgive us all our sins; but if we will not, or through long contagion of our sin be not able to let Christ in, we die in our sins and the case is evident, not because Christ does not offer grace, and comfort unto us, but because we receive it not when it is offered, Merito perit agrotus qui non medicum vocat, sed ultre venientem respuit, ‘worthily does that sick patient perish, who will neither send for the physician himself, nor accept of his help when it is offered.&#x27;</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/anthony-maxey.html">Anthony Maxey</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Golden Chain of Man’s Salvation</cite>, (London: T.E., 1607), 2nd Sermon, ‘God hardens not’, pp. 72-75 Maxey (d. 1618) was the dean of Windsor.</span></figcaption>

</figure><figure class="quote" id="q-daba0d7595" data-kw="">
<blockquote><p>He knocks, to awaken us to come and let Him in, knocks by his Word and Spirit, knocks by afflictions and by our own consciences; though this is not expressly quoted, yet probably it is referred to (Rev. 3:20), ‘Behold, I stand at the door, and knock.’ He calls sinners into covenant with Him and saints into communion with Him… …

III. The excuse she made to put off her compliance with this call (Song 5:3): ‘I have put off my coat; how shall I put it on again?’ She is half asleep; she knows the voice of her beloved; she knows his knock, but cannot find in her heart to open to Him… Making excuses (Lk. 14:18) is interpreted making light of Christ (Mt. 22:5), and so it is. Those put a great contempt upon Christ that cannot find in their hearts to bear a cold blast for him, or get out of a warm bed.

IV. The powerful influences of divine grace, by which she was made willing to rise and open to her beloved. When He could not prevail with her by persuasion He put in his hand by the hole in the door, to unbolt it, as one weary of waiting, Song 5:4. This intimates a work of the Spirit upon her soul, by which she was unwilling made willing, Ps. 110:3. The conversion of Lydia is represented by the opening of her heart (Acts 16:14) and Christ is said to open his disciples’ understandings, Lk. 24:45. He that formed the spirit of man within him knows all the avenues to it, and which way to enter into it; he can find the hole of the door at which to put in his hand for the conquering of prejudices and the introducing of his own doctrine and law. He has the key of David (Rev. 3:7), with which He opens the door of the heart in such a way as is suited to it, as the key is fitted to the wards of the lock, in such a way as not to put a force upon its nature, but only upon its ill nature.

V. Her compliance with these methods of divine grace at last: ‘My bowels were moved for Him.’ The will was gained by a good work wrought upon the affections: My bowels were moved for Him, as those of the two disciples were when Christ made their hearts to burn within them. She was moved with compassion to her beloved, because his head was wet with dew. Note, Tenderness of spirit, and a heart of flesh, prepare the soul for the reception of Christ into it… Note, When we apply ourselves to our duty, in the lively exercises of faith, under the influence of divine grace, we shall find it will go on much more readily and sweetly than we expected. If we will but rise up, to open to Christ, we shall find the difficulty we apprehended in it strangely overcome, and shall say with Daniel, ‘Now let my Lord speak, for thou hast strengthened me,’ Dan. 10:19… Those that open the doors of their hearts to Christ, those everlasting doors, must meet Him with the lively exercises of faith and other graces, and with these must anoint Him. … 1. She did not open to Him at his first knock, and now she came too late, when afterwards she would have inherited this blessing. Christ will be sought while He may be found; if we slip our time, we may lose our passage.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/matthew-henry.html">Matthew Henry</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Commentary on the Whole Bible</cite>, On Song 5, verses 2-8</span></figcaption>

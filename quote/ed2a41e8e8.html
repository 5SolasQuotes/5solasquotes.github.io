<main class="wrap"><figure class="quote" id="q-ed2a41e8e8" data-kw="">
<blockquote><p>THE first edition of the following work was published at Oxford in 1661. After a reference to theology in general, the author discusses the natural theology of the first man, with its corruption on the fall, and afterwards theology in all its subsequent phases; as Adamic or antediluvian, Noachic or postdiluvian, Abrahamic, Mosaic, and Evangelical. Numerous digressions are inserted, on universal grace, the origin of the sciences, the notes of the Romish church, the origin of letters, the ancient Hebrew letters, the Hebrew points, the versions of Scripture, the religious rites of the Jews, and on the admixture of philosophy with theology. …

The treatise is simply a historical dissertation on the origin and progress of theology, in a spirit thoroughly evangelical, and in a style somewhat remarkable for the power and compass of its Latinity. At times, in the strokes of the author directed against Popish error, there are specimens of the same quiet and effective sarcasm which marks his replies to Vincent Cane. While many of the views broached on the collateral topics considered in the various digressions with which the work abounds are obsolete, and superseded by modern investigation, the work, as a whole, is full of scriptural truth and pious sentiment. The last book is especially valuable, as conveying to us the ripe experience of England’s greatest theologian in regard to the best method of prosecuting sacred studies.

Mr Ryland of Northampton describes the work as entitled to rank in theological literature on a level with the Principia of Newton in science, — as “an incomparable work, perhaps the very greatest of the kind ever written by a British divine.” We doubt if most readers would acquiesce in this very fervent eulogy, while there can be little hesitation in acceding to the more cautious and studied language of Mr Orme, who affirms that “the work discovers a vast extent of reading, and a profound acquaintance with the whole compass of profane and sacred learning.”

Indeed, no work of Dr Owen in his native tongue leaves such an impression of the extent and variety of his erudition; and, to judge from it, no contemporary name bears away the palm of decided superiority to our author, either in respect of spiritual wisdom or general learning. The compression requisite to overtake the vast field before him obliges him occasionally to condense within narrow limits an amazing extent of truth; so that no diffuseness appears in his narrative, and the attention of his readers seldom flags under the prolix heaviness which too often mars the effect of his other productions.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/william-h-goold.html">William H. Goold</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Prefatory Note to John Owen, THEOLOGOMENA PANTODAPA: Sive, De Natura, Ortu, Progressu, Et Studio, Ver</cite></span></figcaption>

<blockquote><p>For even if images can be retained [in churches] without offense to God, in which are represented sacred matters and histories, and which are extant throughout holy Scripture, and call to mind for the illiterate the stories of the deeds… Luther in fact, of pious memory, cleansed Churches in those locations by means of the Word of the Lord alone from the beginning, and through this one instrument of the Holy Spirit dragged away all idols from the hearts of his hearers… before he ever removed even the smallest ones from their eyes. For an idol in the world is nothing, as the apostle testifies, 1 Corinthians 8[:4], but instead they reside in the hearts of people… Thus Luther for many years [after the Reformation] wore the monastic hood or habit [clothing]… We experienced the same thing in the Dukedom of Wurttemberg, where in the first year after the light of the Gospel was introduced and lit, and Papal idolatry abrogated, images were removed throughout all the temples before the imagination of their worship was pulled away from the minds of men. This is why it has come about that very many people were so offended by this unseasonable reformation undertaken with a two-edged sword… that neither listened to evangelical assemblies nor approached their sacraments any longer, but rather clung to their Papist idolatry till their final breath, despising the teaching of the Gospel and the true use of the sacraments. This was the fruit of the unseasonable reformation in which everything was destroyed with no regard given to the weak in faith… But there is less danger when pure and genuine doctrine is heard, by which all people are called away from idolatry to the true worship of God in daily meetings, should they be retained, than if they should be abolished rashly and unthoughtfully. Because of this, we think that the magistrate of each place sins less, and takes counsel to the advantage of the salvation of souls far better, if they have endured them longer than if they have unseasonably abrogated them… If in fact they are matters of indifference [adiaphora], as is the consensus between us… Beza: This whole business can best be described as resting on two points, namely, the prudence of pastors and the consideration of circumstances… The custom was observed in certain places that images of this kind were retained for four years after reformation. But I do not want to fight with anyone about these things or reprove the deeds of other people; let us just be on guard against all opportunities for idolatry, as much as possible.</p></blockquote>

<blockquote><p>40. I have before proved how faulty the priests’ calling was in Christ’s time, and the Temple and synagogue worship, and the Pharisees’ long liturgies, on pretence whereof they devoured widows’ houses, and their corrupt doctrine, and how great the faults were in the Churches of Corinth, Galatia, Ephesus, Sardis, Laodicea, Thyatira, Pergamos [Rev. 2-3], and those that James wrote to, from which none were commanded to depart;¹ And to condemn Christ or his apostles as favoring or using sinful communion is worse in Christians than it was in the Pharisees.</p></blockquote>

</figure><figure class="quote" id="q-5b36801b03" data-kw="Mary Queen of Heaven">
<blockquote><p>In fact it contradicts the nature of deceased saints that they should be present in and care for diverse and widely scattered places at one and the same time, as when the [papal teachers] want to put one and the same saint in charge of diverse and widely scattered places. Think of Saint James for the Spanish, who dwell in Europe, India, and America. Or Saints Dominic and Francis, etc., for all their monasteries spread across the whole globe. Or even the blessed Virgin, whom they call Queen of Heaven, Mistress of the Earth, and Star of the Sea (Stella Maris)—even though this is a wrong rendering of Drop of the Sea (Stilla maris)—since it is fitting only for God to “look down from the heavens and behold all the sons of men, and from his dwelling-place to look forth upon all the inhabitants of the earth” (Psalm 33:13–14).</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/anthony-walaeus.html">Antonius Walaeus</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Synopsis of a Purer Theology</cite>, Disp. 40, On the Church (vol. 2)</span></figcaption>

</figure><figure class="quote" id="q-605c180a05" data-kw="">
<blockquote><p>What need is there, then, for adding to God’s book of praise a hymn-book of our own making? And what is gained when the addition is made? Nothing is gained in the way of spirituality, or beauty, or power. Nothing is gained but spiritual loss. Nor is a hymn ever used without loss; for the best hymn that ever was written by man on a Scriptural subject is excelled by a psalm, or perhaps by many psalms on the same subject. For example, the pretty hymn written by the papist Cardinal Newman, beginning

Lead kindly light amid the encircling gloom,

is infinitely inferior to the 5th, and 25th, and 27th, and 36th, and 86th, and 119th, and 143d, and many other psalms on the same subject. Yet this hymn appears in the hymn-books of the Established, the United Presbyterian, and the Free Churches. Every time the papist’s hymn is sung by any of their congregations, it is preferred for the time being and for the purpose in hand to a divine hymn, which is of course as much superior as God’s Word is to man’s. It is nowhere said in Scripture that the entrance of John Henry Newman’s words gives light, yet “cultured” congregations use them in preference to the perfect Word on which the blessing depends, and while they are but pleasing themselves they think they are doing God service and receiving his blessing.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/james-dick.html">James Dick</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Hymns and hymn-books in Original Covenanter</cite></span></figcaption>

<main class="wrap"><figure class="quote" id="q-1a30bef579" data-kw="">
<blockquote><p>In addition, the king had, in 1816, without a semblance of right or of necessity, forced upon the Dutch Reformed Church an organization and a government which were utterly at variance with the Presbyterian system. Complaints and protestations of grievance were not lacking; but not until 1834 was courage mustered for action.

Being debarred from speaking and acting according to the Word of God and the Confession of the Church, many believers, in agreement with Article xxix of the Belgic Confession of Faith, separated themselves from the Dutch Reformed Church, as from a false Church, thus giving birth to the present “Christian Reformed Church.” Though this separation was very influential at the beginning and became so to an ever-increasing extent afterwards, still the number of those who joined it was small; the greater part remained within the pale of the old Church.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/herman-bavinck.html">Herman Bavinck</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Recent Dogmatic Thought in the Netherlands , trans. Geerhardus Vos in Presbyterian and Reformed Review</cite></span></figcaption>

</figure><figure class="quote" id="q-0b1f617f85" data-kw="">
<blockquote><p>Up to this time [1573], the prevailing practice was that only ministers signed the Belgic Confession. In 1574, however, the provincial Synod of Dordrecht decided that ‘it would be useful that the elders and deacons also subscribe to the Netherlands Confession, and to the articles of the [Emden] Synod.’ For this purpose, it was considered advisable that a copy of the confession and of the articles of the Emden Synod be kept by all consistories [sessions] or at least by all classes [presbyteries]. For the first time, schoolteachers were also required to sign the confession and to submit to the ‘discipline’ or articles of the Emden Synod. The idea of elders’ and deacons’ subscribing was not immediately accepted in all the churches. For example, at Delft the elders and deacons refused to sign the confession, while at Middelburg they did. Gaspar van der Heyden, pastor at Middelburg and president of the recent Dordrecht Synod, on 16 November 1574 wrote to Delft pastor Arent Cornelisz: ‘Our elders and deacons have signed the Confession of Faith and the articles of the [Emden] synod; I certainly wish that yours had done the same. How would they who now refuse to sign the Confession with ink seal it with their own blood?&#x27;</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/netherlands.html">Donald Sinnema</a></span><span class="wk"><span class="lbl">Work:</span> <cite>“The Origin of the Form of Subscription</cite></span></figcaption>

<main class="wrap"><figure class="quote" id="q-927239c2c7" data-kw="">
<blockquote><p>The third is the danger and mischief of force and violence; The taking away of the wicked from before the King, is a means to establish his Throne in Righteousness, because of the violence, and the force that a King is in danger of; when the wicked are about the Throne, his person is in danger to be mastered by their force, and power, and strength. 2 Sam. 3.38. See it in David. Malignants may be too hard for a King by force, and violence, as well as by flattery and Counsel. The King said to his servants, Know ye not that a Prince, and a great man is fallen in Israel? I this day am weak though anointed King, and these men the sons of Zerviah are too hard for me.

This was the case, Joab had killed Abner treacherously, David was King, Joab was the General of his Army and his kins-man, David was Uncle to Joab and his brother, they were his nephews; Joab had slain Abner basely, it was a murder, and a treacherous murder, and David was King and should have done justice, and he had protested it, yet these were too hard for him, not in point of seducing by flattery, or of evil Counsel, but by force and violence.

David could not make his party good against Joab, because he was Governor of the Army, and he was afraid that Joab might make more force then he, and so he mastered the King, and kept him from doing of justice, though he were a just King, and had vowed to do justice, and blood called upon him: Yet these sons of Zerviah (for there were three of them, but one was slain) these grand Cavaliers, when they had gotten the sword in their hand, though their pretence were to help David, yet afterward they over-mastered him, and would kill and slay, and David could not check them for it.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/john-bond.html">John Bond</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The state’s stability a sermon preached in Exon. Before the deputy-lieutenants, captains, and other military officers and soldiers of the county of Devon</cite>, (London, 1643), pp 21-22.</span></figcaption>

<blockquote><p>We may only advert farther on this head, to the wonder that the friends of truth and reformation should be so divided in sentiment and communion.

Considering that these are so feeble in point of numbers, and that the force of their public testimony depends so much on their united exertions, it is truly surprising that so little of a spirit of enlightened and scriptural union should exist among them; and that so generally they should be on the watch to increase their own little parties, by fishing in disturbed waters, and picking up treasures from the wreck of ruined establishments.</p></blockquote>

<blockquote><p>Almost all our contentions and divisions are caused by the ignorance and injudiciousness of Christians, especially the most self-conceited. They are for the most as children, that yet need to be taught the very principles of the divine oracles, and to be fed with milk when they think themselves fit to be teachers of others, Heb. 5:11-12, and therefore [are] as children they are tossed to and fro and caried about with every wind of doctrine, Eph. 4:14. And when they have many years together been crying up an opinion and vilifying dissenters, at last they turn to some other opinion and confess that they did all this upon mistake. And was it not a pitiful life that they lived that while? and a pitiful zeal which did set them on? and a pitiful kind of worship which they thus offered to God? Alas to hear a man pray and preach up Antinomianism one year, and Arminianism the next, and Socinianism the next! To hear a man make Separation and Anabaptistry a great part of his business to men in preaching and to God in prayer for seven and seven years together; and at last confess that all this was his error and his sin (or if he confess it not, it is so much the worse). Is it not sad that ignorance and hasty rashness should so much injure the Church and men’s souls that so many well-meaning people should put evil for good and good for evil, darkness for light and light for darkness, Isa. 5:20.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/richard-baxter.html">Richard Baxter</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Cure of Church Divisions</cite>, … (London, 1670), pt. 1, Direction 40, ‘Labour for a sound judgment to know good from evil, lest you trouble yourselves and others by mistakes: And till you grow so judicious, forsake not the guidance of a judicious teacher, nor the company of the agreeing generality of the Godly’, pp. 212-13</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/the-christian-life/obedience-and-profession.html">Obedience and Profession</a></span></div>

<blockquote><p>I answer that, Anger, as stated above (Article 1), is properly the name of a passion. A passion of the sensitive appetite is good in so far as it is regulated by reason, whereas it is evil if it set the order of reason aside. Now the order of reason, in regard to anger, may be considered in relation to two things. First, in relation to the appetible object to which anger tends, and that is revenge. Wherefore if one desire revenge to be taken in accordance with the order of reason, the desire of anger is praiseworthy, and is called “zealous anger” [Cf. Gregory, Moral. v, 45. On the other hand, if one desire the taking of vengeance in any way whatever contrary to the order of reason, for instance if he desire the punishment of one who has not deserved it, or beyond his deserts, or again contrary to the order prescribed by law, or not for the due end, namely the maintaining of justice and the correction of defaults, then the desire of anger will be sinful, and this is called sinful anger. Secondly, the order of reason in regard to anger may be considered in relation to the mode of being angry, namely that the movement of anger should not be immoderately fierce, neither internally nor externally; and if this condition be disregarded, anger will not lack sin, even though just vengeance be desired.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/thomas-aquinas.html">Thomas Aquinas</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Other citations (work not named)</cite>, question 158, ‘Anger’ in Summa, 2nd pt. of 2nd pt.</span></figcaption>

<div class="actions"><button class="copy" data-copy="“I answer that, Anger, as stated above (Article 1), is properly the name of a passion. A passion of the sensitive appetite is good in so far as it is regulated by reason, whereas it is evil if it set the order of reason aside. Now the order of reason, in regard to anger, may be considered in relation to two things. First, in relation to the appetible object to which anger tends, and that is revenge. Wherefore if one desire revenge to be taken in accordance with the order of reason, the desire of anger is praiseworthy, and is called “zealous anger” [Cf. Gregory, Moral. v, 45. On the other hand, if one desire the taking of vengeance in any way whatever contrary to the order of reason, for instance if he desire the punishment of one who has not deserved it, or beyond his deserts, or again contrary to the order prescribed by law, or not for the due end, namely the maintaining of justice and the correction of defaults, then the desire of anger will be sinful, and this is called sinful anger. Secondly, the order of reason in regard to anger may be considered in relation to the mode of being angry, namely that the movement of anger should not be immoderately fierce, neither internally nor externally; and if this condition be disregarded, anger will not lack sin, even though just vengeance be desired.”

— Thomas Aquinas, Other citations (work not named), question 158, ‘Anger’ in Summa, 2nd pt. of 2nd pt.">Copy</button><a class="share" href="https://x.com/intent/post?text=%E2%80%9CI+answer+that%2C+Anger%2C+as+stated+above+%28Article+1%29%2C+is+properly+the+name+of+a+passion.+A+passion+of+the+sensitive+appetite+is+good+in+so+far+as+it+is+regulated+by+reason%2C+whereas+it+is+evil+if+it+set+the+order+of+reason+aside.+Now+the+order+of+reason%2C+in+regard+to+anger%2C+may+be+considered+in+relation+to+two+things.+First%2C+in+relation+to+the+appetible+object+to+which+anger+tends%2C+and+that+is+revenge.+Wherefore+if+one+desire+revenge+to+be+taken+in+accordance+with+the+order+of+reason%2C+the+desire+of+anger+is+praiseworthy%2C+and+is+called+%E2%80%9Czealous+anger%E2%80%9D+%5BCf.+Gregory%2C+Moral.+v%2C+45.+On+the+other+hand%2C+if+one+desire+the+taking+of+vengeance+in+any+way+whatever+contrary+to+the+order+of+reason%2C+for+instance+if+he+desire+the+punishment+of+one+who+has+not+deserved+it%2C+or+beyond+his+deserts%2C+or+again+contrary+to+the+order+prescribed+by+law%2C+or+not+for+the+due+end%2C+namely+the+maintaining+of+justice+and+the+correction+of+defaults%2C+then+the+desire+of+anger+will+be+sinful%2C+and+this+is+called+sinful+anger.+Secondly%2C+the+order+of+reason+in+regard+to+anger+may+be+considered+in+relation+to+the+mode+of+being+angry%2C+namely+that+the+movement+of+anger+should+not+be+immoderately+fierce%2C+neither+internally+nor+externally%3B+and+if+this+condition+be+disregarded%2C+anger+will+not+lack+sin%2C+even+though+just+vengeance+be+desired.%E2%80%9D%0A%0A%E2%80%94+Thomas+Aquinas%2C+Other+citations+%28work+not+named%29%2C+question+158%2C+%E2%80%98Anger%E2%80%99+in+Summa%2C+2nd+pt.+of+2nd+pt.&amp;url=https%3A%2F%2F5solasquotes.github.io%2Fquote%2Fc945ac4a0f.html&amp;via=5Solas" target="_blank" rel="noopener">Share on X</a><a class="perma" href="../quote/c945ac4a0f.html">Permalink</a><a class="src" href="https://reformedbooksonline.com/on-anger/#:~:text=I%20answer%20t

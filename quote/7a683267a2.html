<main class="wrap"><figure class="quote" id="q-7a683267a2" data-kw="">
<blockquote><p>There is in Isaiah 58:13, a passage which embraces in a few words, a summary exposition of that part of the law, which requires abstinence from the ordinary employments of the week. It consists in “not doing thine own ways, nor finding thine own pleasure, nor speaking thine own words.” Six days are ours in distinction from the seventh, which God calls his own, because on those days we are permitted to give our attention to what is necessary for our temporal well-being and comfort. Our “own ways,” therefore, are not those which are at all times sinful, but those lawful ways which we pursue by God’s authority six days of the week. These are to be suspended on the Sabbath, that we may devote ourselves to those ways which are God’s distinctively from our own.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/john-holmes-agnew.html">John Holmes Agnew</a></span><span class="wk"><span class="lbl">Work:</span> <cite>A Manual on the Christian Sabbath</cite>, (Philadelphia PA: Presbyterian Board of Publication, 1852), p. 142.</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/worship.html">Worship</a></span></div>

</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-a15b770ca8" data-kw="">
<blockquote><p>Secondly, whereas there goes but two things to the reformation of the Church, they are both in the word glory.

First, there must be all the ordinances; thus the Ark was called glory, and the Ark signified both the word and Sacraments; here are communicants in these, and they are such as are cleansed and undefiled, vers. 3. here is thirdly, government; 2 Pet. 2.10. it is said of some they do despise and not respect dominions, or glories, as the word is; and the glory that is there spoken is not evil but ecclesiastical, for it is such a kind of despising, as Corah and Dathan were guilty of against Moses, Jude 8.11. Now they opposed Moses, not as a Magistrate, but as a Minister and Law-giver unto the Church, and therefore they said, Are not all the people of the Lord holy? and not wise, or valorous, or true hearted? which art the virtues of a Magistrate. Besides, false teachers are for the most part flatterers of Princes, not Despisers, as Zedekiah was, and Simon Magus who adored Nero.

When you have the ordinances, then the Second thing required to a Reformation, is to have them pure, and after God’s prescript, without human addition or alteration: take this for a rule, the more plain God’s ordinances are, the more powerful; the more there is of man, the less there is of God in them, Ezek. 44.7. God tells them they had polluted his Sanctuary, that is, made it common, the sacramental bread did them no more good than their own ordinary bread, and the company of the Saints no more then the company and society of men. You have this in the text too, for here is beauty joined with glory in vers. 2. and beauty is a native complexion; here is glory joined with purging, the spirit of judgement, and of burning, in the verse before my text; here is holiness written on every Soul, vers. 3. and to be holy is all one with being set apart to a holy use and being prepared, and fitted for it.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/sidrach-simpson.html">Sidrach Simpson</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Reformation’s preservation opened in a sermon preached at Westminster before the honourable House of Commons, at the late solemne fast, July 26, 1643</cite>, (London: Benjamin Allen, 1643), pp 4-5.</span></figcaption>

</figure><figure class="quote" id="q-0c167cbccd" data-kw="">
<blockquote><p>Truth is opposed to a ceremony and shadow. The ceremonies of old were shadows, or the external body of religion, in which the soul and spirit of godliness should have been enclosed, but the Lord did always urge more earnestly the substance and truth than the ceremony, the weightier matters of the Law, piety, equity, and sobriety, than these lighter external ceremonies: He sets an higher account upon mercy than sacrifice, and upon obedience than ceremonies; But this people turned just contrary; they summed up all their religion in some ceremonial performance, and separated those things God had so nearly conjoined; they would be devout men in offering sacrifices in their washings in their rites, and yet made no conscience of heart and soul-piety toward God, and upright just dealing with men: Therefore the Lord so often quarrels them and rejects all their service as being a device and invention of their own which never entered in his heart, Isa. 1, from 10 to 16; Jer. 7 throughout; Isa. 66 to 6; Isa. 28. Now if you will examine it impartially it is even just so with us, there are some external things in religion which in comparison with the weightier things of faith, and obedience are but ceremonial; in these you place the most part, if not all your religion, and think yourselves good Christians if you be baptized and hear the Word, and partake of the Lord’s table and such like, though in the mean time you be not given to secret prayer and reading, and do not inwardly judge and examine yourselves, that you may flee unto a Mediator, though your conversation be unjust and scandalous among men; I say unto such souls, as the Lord to the Jews, Who hath required this at your hands? who commanded you to hear the Word, to be baptized, to wait on publick ordinances? Away with all this, it is abomination to his Majesty; though it please you never so well, the more it displeases Him; If you say, why commands He us to hear? etc. I say the Lord never commanded these external ordinances for the sum of true religion; that was not the great thing which was in his heart that He had most pleasure unto, but the weightier matters of the Law, piety, equity and sobriety, a holy and godly conversation adorning the Gospel: ‘What hath the Lord required of thee, but this, O man, To do justly, and walk humbly with thy God?’ So then thou dost not worship him in truth, but in shadow; the truth is holiness and righteousness; that external profession is but a ceremony; while you separate these external ordinances from these weighty duties of piety and justice, that they are but as dead body without a soul. If the Lord required truth of old, much more now, when He has abolished the multitude of ceremonies that the great things of his Law may be more seen and loved.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/hugh-binning.html">Hugh Binning</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Common Principles of Christian Religion</cite>, … ([Glasgow] 1666 / 1667), 2nd Sermon on Jn. 4:24, pp. 134-35</span></figcaption>

<blockquote><p>All these acts are not able to be exercised at the same time: yet they ought not to be separated from each other in True Religion, since God requires both the one and the other: although the elicited and internal acts are primary, and the interal acts alone are generally able to be exercised at any time, even in a time of persecution…</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/bernard-de-moor.html">Bernardinus de Moor</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Didactic-Elenctic Theology</cite>, (Reformation to Reformation Translations, 2018), ch. 3, ‘Concerning Religion’, section 5, ‘The Acts of Religion’, p. 55</span></figcaption>

<div class="actions"><button class="copy" data-copy="“All these acts are not able to be exercised at the same time: yet they ought not to be separated from each other in True Religion, since God requires both the one and the other: although the elicited and internal acts are primary, and the interal acts alone are generally able to be exercised at any time, even in a time of persecution…”

<blockquote><p>In the second part of this first testimony is declared further: — 1. What Christ will moreover do: He will “sing praises unto God;” and, 2. Where he will do it: “In the midst of the congregation.” The expression of both these is accommodated unto the declaration of God’s name and of praising him in the temple.

1. The singing of hymns of praise unto God in the great congregation was then a principal part of his worship. And in the first expression two things are observable: —

(1.) What Christ undertakes to do; and that is, to praise God. Now this is only exegetical of what went before. He would praise God by declaring his name. There is no way whereby the praise of God may be celebrated like that of declaring his grace, goodness, and love unto men; whereby they may be won to believe and trust in him, whence glory redounds unto him. (2.) The cheerfulness and alacrity of the spirit of Christ in this work. He would do it as with joy and singing, with such a frame of heart as was required in them who were to sing the praises of God in the great assemblies in the temple.

2. Where would he do this? קָהָ֣ל בְּת֖וֹךְ, “in the midst of the congregation,” — “the great congregation,” as he calls it, verse 23; that is, the great assembly of the people in the temple. And this was a type of the whole church of the elect under the new testament. The Lord Christ, in his own person, by his Spirit in his apostles, by his word, and by all his messengers unto the end of the world, setting forth the love, grace, goodness, and mercy of God in him the mediator, sets forth the praise of God in the midst of the congregation.

I shall only add, that whereas singing of hymns unto God was an especial part of the instituted worship under the old testament, to whose use these expressions are accommodated, it is evident that the Lord Christ hath eminently set forth this praise of God in his institution of worship under the new testament, wherein God will ever be glorified and praised. This was that which the Lord Christ engaged to do upon the issue of his sufferings; and we may propose it unto our example and instruction …</p></blockquote>

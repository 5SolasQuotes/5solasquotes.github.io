<main class="wrap"><figure class="quote" id="q-9b16df32c0" data-kw="Imputation" data-pol="">
<blockquote><p>When they demand, How can we be justified by the righteousness of another? Can I be rich with another man&#x27;s money, or preferred by another man&#x27;s honours? Our answer is, yes, if that other be my surety or husband. Indeed Peter can not be justified by the righteousness of Paul; but both may be justified by the righteousness of Christ imputed to them; they being members, jointly knit to one common Head. Principal and surety are one in obligations and constructions of law. Head and members are one body, branch and stock are one tree; and it is no strange thing to see a graff live by the sap of another stock, when once it is ingrafted into it.</p></blockquote>
<figcaption>— <a href="../authors/john-flavel.html">John Flavel</a>, <cite>The Method of Grace</cite>, Sermon 2 (John 17:23), reality of the union, 2nd proof</figcaption>
<div class="meta"><a class="tag" href="../topics/salvation/union-with-christ.html">Union with Christ</a><a class="tag" href="../topics/salvation/justification.html">Justification</a><a class="tag" href="../topics/salvation/imputation.html">Imputation</a></div>

</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-76fc53ecbc" data-kw="Regeneration|Sanctification" data-pol="">
<blockquote><p>Union with Christ is the foundation of all spiritual blessings, so that if there had been no connection with Him, there could be no regeneration, no justification, no sanctification, no glorification. It is so in the natural world—adumbrating the spiritual: sever one of the members from my physical body, and it is dead; only by its union with my person does it partake of life.</p></blockquote>
<figcaption>— <a href="../authors/arthur-w-pink.html">Arthur W. Pink</a>, <cite>Spiritual Union and Communion</cite>, Introduction</figcaption>

</figure><figure class="quote" id="q-13755d1246" data-kw="Comfort|Justice|Assurance" data-pol="">
<blockquote><p>Let us oft think of this nearness between Christ and us, if we have once given our names to him, and not be discouraged for any sin or unworthiness in us. Who sues a wife for debt, when she is married? Uxori lis non intenditur. Therefore answer all accusations thus:—&#x27;Go to Christ.&#x27; If you have anything to say to me, go to my husband. God is just, but he will not have his justice twice satisfied, seeing whatsoever is due thereunto is satisfied by Christ our husband. What a comfort is this to a distressed conscience! If sin cannot dismay us, which is the ill of ills and cause of all evil, what other ill can dismay us?</p></blockquote>
<figcaption>— <a href="../authors/richard-sibbes.html">Richard Sibbes</a>, <cite>Union with Christ (Bowels Opened)</cite>, Sermon II (Song 5:1)</figcaption>

<blockquote><p>It is an INDISSOLUBLE union. Once in Christ, ever in him. Having taken up his habitation in the heart, he never leaves. None can untie this happy knot.</p></blockquote>

</figure><figure class="quote" id="q-a469aee8d1" data-kw="Faith" data-pol="">
<blockquote><p>It is a REAL union. Such is our weakness in our present state, so much are we sunk in sin, that in our mind, we are prone to suspect spiritual realities to be only a fiction. But nothing is more real than what is spiritual: as approaching nearest to the nature of him who is the fountain of all reality, namely, God himself. We do not see with our eyes the union between our own soul and body; neither can we represent it to ourselves truly, by imagination, as we do sensible things: yet the reality of it is not to be doubted. Faith is no fancy—but &quot;the substance of things hoped for,&quot; Heb. 11:1. Neither is the union thereby made between Christ and believers imaginary—but most real: &quot;For we are members of his body, of his flesh, and of his bones,&quot; Eph. 5:30.</p></blockquote>
<figcaption>— <a href="../authors/thomas-boston.html">Thomas Boston</a>, <cite>Human Nature in Its Fourfold State</cite>, State III, Head 2 “Mystical Union,” general observations (2)</figcaption>

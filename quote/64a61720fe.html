<main class="wrap"><figure class="quote" id="q-64a61720fe" data-kw="">
<blockquote><p>Although indeed we have shown that, by the punishment of Christ, God was satisfied, yet we would not deny that the power of satisfaction was also in the acting of Christ…</p></blockquote>

</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-05ca7b0d67" data-kw="">
<blockquote><p>Therefore, we always hold fast this foundation, ascribing all the glory to God, humbling ourselves before Him, and acknowledging ourselves to be such as we really are, without presuming to trust in any thing in ourselves, or in any merit of ours, relying and resting upon the obedience of Christ crucified alone, which becomes ours when we believe in Him. This is sufficient to cover all our iniquities, and to give us confidence in approaching to God; freeing the conscience of fear, terror, and dread, without following the example of our first father, Adam, who, trembling, attempted to cover himself with fig leaves.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/guido-de-bres.html">Guido de Brès</a></span><span class="wk"><span class="lbl">Work:</span> <cite>“Belgic Confession Art. 34”</cite>, Art. 23</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/justification/active-and-passive-obedience-imputed.html">Active and Passive Obedience Imputed</a></span><span class="t"><a href="../topics/assurance-peace-and-joy/doubts-and-fears.html">Doubts and Fears</a></span></div>

</figure><figure class="quote" id="q-fe280a08e1" data-kw="">
<blockquote><p>14. No man is saved or justified but by the proper merit of Christ’s perfect obedience; yea, and his habitual holiness and satisfactory sufferings, advanced in dignity by his divine perfection. 15. This merit, as related to us, supposes that Christ, as a sponsor, was the Second Adam, the Root of the justified, the reconciling Mediator, who obeyed perfectly with that intent that by his obedience we might be justified; and who suffered for our sins, in our room and stead; and so was in tantum [to that extent] our Vicarius poenae, as some phrase it, or substitute; and was made a curse for us, that we might be healed by his stripes; as He was obedient, that his righteousness might be the reason as a meritorious cause of our justification: which supposes the relation of an undertaking Redeemer, in our nature doing this, and in our stead so far forth, as that therefore perfect obedience should not be necessary to be performed by ourselves: And righteousness therefore is imputed to us, that is, we are truly reputed righteous, because we, as believing members of Christ, have right to impunity and life, as merited by his righteousness, and freely given to all penitent believers. And Christ’s own righteousness may be said so far to be imputed to us, as to be reckoned or reputed the meritorious cause of our right or justification, as aforesaid.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/richard-baxter.html">Richard Baxter</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Richard Baxter’s Catholic Theology, Plain, Pure, Peaceable</cite>, ... (London: White, 1675), ‘An Appendix to this Premonition,’ n.p.</span></figcaption>

/a><a class="perma" href="../quote/fe280a08e1.html">Permalink</a><a class="src" href="https://reformedbooksonline.com/the-active-obedience-of-christ#:~:text=14.%20No%20man%20is%20saved%20or,our%20right%20or%20justification%2C%20as%20aforesaid&amp;text=14.%20No%20man%20is%20saved%20or%20justified%20but&amp;text=cause%20of%20our%20right%20or%20justification%2C%20as%20aforesaid" rel="noopener" target="_blank">Read it online · Reformed Books Online</a></div>
</figure><figure class="quote" id="q-f6cbf50387" data-kw="Justification">
<blockquote><p>Those whom God effectually calls, he also freely justifies, not by infusing righteousness into them, but by pardoning their sins, and by accounting and accepting their persons as righteous; not for anything wrought in them, or done by them, but for Christ&#x27;s sake alone; not by imputing faith itself, the act of believing, or any other evangelical obedience to them, as their righteousness; but by imputing Christ&#x27;s active obedience unto the whole law, and passive obedience in his death for their whole and sole righteousness by faith, which faith they have not of themselves; it is the gift of God.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/particular-baptists.html">Particular Baptists</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Second London Baptist Confession of Faith</cite>, 1689, 11.1</span></figcaption>

</figure><figure class="quote" id="q-ed27b9bc75" data-kw="">
<blockquote><p>For what is vainer than regarding someone as righteous who has not kept the law? Yet the law not only forbids that anything be done which it condemns (to which is attached a threatening with death) but also prescribes the outcome of what it enjoins (to which is attached the promise of life). Thus, whoever in Christ is judged to be ‘no sinner’ has indeed evaded death; but on the grounds of what other right would anyone demand life, other than that he has in Christ fulfilled all the righteousness of the law?</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/theodore-beza.html">Theodore Beza</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Epistolae theologicae: liber unus</cite>, (Geneva: Vignon, 1573), Epistle 35, to Olevianus (1560), p. 200 as trans. G.A. van den Brink, The Transfer of Sin… (Brill, 2024), p. 219 cf. Epistle 45, p. 228</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/justification/active-and-passive-obedience-imputed.html">Active and Passive Obedience Imputed</a></span></div>
<div class="actions"><button class="copy" data-copy="“For what is vainer than regarding someone as righteous who has not kept the law? Yet the law not only forbids that anything be done which it condemns (to which is attached a threatening with death) but also prescribes the outcome of what it enjoins (to which is attached the promise of life). Thus, whoever in Christ is judged to be ‘no sinner’ has indeed evaded death; but on the grounds of what other right would anyone demand life, other than that he has in Christ fulfilled all the righteousness of the law?”

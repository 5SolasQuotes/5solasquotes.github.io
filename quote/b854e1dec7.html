<blockquote><p>It is clear the question must be thus stated, for all the laws of the old Testament (which we hold in their moral equity to be perpetual) that are touching blasphemies, heresies, solicitation to worship false Gods and the breach of which the Godly Magistrate was to punish, command or forbid only such things as may be proved by two or three witnesses, and which husband and wife are not to conceal, and from which all Israel must abstain for fear of the like punishment. Deut. 13.8, 9, 10, 11. Deut. 17. 5, 6. Levit. 20. 1, 2, 3, 4, 5. But opinions in the Mind, acts of the understanding, can never be proved by witnesses and such as neither Magistrate nor Church can censure.</p></blockquote>

<blockquote><p>Concerning the Law of God, you know there were some of them

1. Ceremonial, which consisted in Rites, and Ordinances, and Shadows, typifying Jesus Christ in his sufferings, unto which there was a full period put by the death of Christ.

2. Judicial, which respecteth the Jews as a peculiar Nation and Common-wealth, being made and fitted for them, as in such a particular polity: And all those Judicial Laws (especially these de jure particulari) are ceased by the cessation of that Nation and polity.

3. Moral; which are these set down in the Decalogue, and are called the ten words (or Commandments) which God spake and delivered.</p></blockquote>

</figure><figure class="quote" id="q-70c58eeba7" data-kw="">
<blockquote><p>§2. But first I will lay together some propositions for decision of the controversy: How far we are bound to obey men’s precepts about religion, especially in case we doubt of the lawfulness of obeying them, and so cannot obey them in faith? §3. Briefly:

1. We must obey both magistrates and pastors in all things lawful which belong to their offices to command.

2. It belongs not to their office to make God a new worship; but to command the mode and circumstances of worship belongs to their office. For guiding them wherein, God has given them general rules.

3. We must not take the lawful commands of our governors to be unlawful.

4. If we do through weakness or perverseness take lawful things to be unlawful, that will not excuse us in our disobedience. Our error is our sin, and one sin will not excuse another sin. Even as on the other side, if we judge things unlawful to be lawful, that will not excuse us for our disobedience to God in obeying men.

5. As I have before showed, many things that are miscommanded must be obeyed.

6. As an erroneous judgment will not excuse us from obedience to our governors, so much less will a doubtfulness excuse us.

7. As such a doubting, erring judgment cannot obey in (plenary) faith, so much less can he disobey in faith. For it is a known command of God, that we obey them that have the rule over us: but they have no Word of God against the act of obedience now in question. It is their own erring judgment that entangles them in a necessity of sinning (till it be changed).

7. In doubtful cases, it is our duty to use God’s means for our information: and one means is to consult with our teachers and hear their words with teachableness and meekness.

8. If upon advising with them we remain in doubt about the lawfulness of some circumstance of order, if it be such as may be dispensed with, they should dispense with us: if it may not be dispensed with without a greater injury to the Church or cause of God than our dispensation will countervail, then is it our duty to obey our teachers notwithstanding such doubts: For it being their office to teach us, it must be our duty to believe them with a human faith, in cases where we have no evidences to the contrary: And the duty of obeying them being certain, and the sinfulness of the thing commanded being uncertain and unknown, and only suspected, we must go on the surer side.

9. Yet must we in great and doubtful cases, not take up with the suspected judgment of a single pastor, but apply ourselves to the unanimous pastors of other Churches.

10. Christians should not be over-busy in prying into the work of their governors, not too forward to suspect their determinations: But when they know that it is their ruler’s work to guide them by determining of due circumstances of worship, they should without causeless scruples readily obey, till they see just reason to stop them in their obedience; They must not go out of their own places to search into the actions of another man’s office to trouble themselves without any cause.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/richard-baxter.html">Richard Baxter</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Five Disputations of Church-Government &amp; Worship</cite>, (London, 1659) | ch. 15, ‘Reasons for Obedience in Lawfull things’, pp. 483-85</span></figcaption>

<blockquote><p>XVII. Certain judicial laws have the character of common right, as to the substance and form of that eternal reason which is in God, or from God in nature and Scripture; but certain are of particular right, with respect to singular determinations, according to the reason of circumstances, things, and persons which are subject to them. In the former respect these laws retain their immutable part; but in the latter they are changed from time to time. … XX… Finally, the judicial law has been abolished as to form and external constitution, posited in the determination of particular circumstances, things, and facts: but not as to its substance and equity, both natural and divine. XXI. And this abrogation argues neither any defect in the laws, nor imprudence or change in their Author; but rather the most prudent counsel of the supreme and eternal Legislator, varying those things according to the convenience of persons, things, and circumstances, which were enacted for the common and particular good of the same, and abolishing what He had given only for a time (which Paul calls a time of reformation, Heb. 9:10). Indeed, with the distinction of the nation removed and the prefigured truth exhibited, those things had to be changed and cease which both distinguished the Jewish nation from others and shadowed forth the truth to come in the Messiah.</p></blockquote>

<div class="actions"><button class="copy" data-copy="“XVII. Certain judicial laws have the character of common right, as to the substance and form of that eternal reason which is in God, or from God in nature and Scripture; but certain are of particular right, with respect to singular determinations, according to the reason of circumstances, things, and persons which are subject to them. In the former respect these laws retain their immutable part; but in the latter they are changed from time to time. … XX… Finally, the judicial law has been abolished as to form and external constitution, posited in the determination of particular circumstances, things, and facts: but not as to its substance and equity, both natural and divine. XXI. And this abrogation argues neither any defect in the laws, nor imprudence or change in their Author; but rather the most prudent counsel of the supreme and eternal Legislator, varying those things according to the convenience of persons, things, and circumstances, which were enacted for the common and particular good of the same, and abolishing what He had given only for a time (which Paul calls a time of reformation, Heb. 9:10). Indeed, with the distinction of the nation removed and the prefigured truth exhibited, those things had to be changed and cease which both distinguished the Jewish nation from others and shadowed forth the truth to come in the Messiah.”

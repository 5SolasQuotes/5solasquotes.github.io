<main class="wrap"><figure class="quote" id="q-4530eb6855" data-kw="">
<blockquote><p>In the law-court of God, then, the justification of man as sinner is the judgment of God whereby He pronounces righteous the person who is unholy and of himself a sinner subject to God’s wrath. He does so out of his own mere grace and mercy, for the sake of the perfect obedience and righteousness of Christ that was offered on our behalf and that is received by faith. That is, He pardons the sinner from sin and the curse, and imputes to him the righteousness of his Son and so awards to him life eternal, for the salvation of the believing person and the glory of the merciful and just God. Nearly every part of this definition is included by the apostle in Romans 3:24–26.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/jacobus-arnoldi-ditsius.html">Jacobus Arnoldi Ditsius</a></span><span class="wk"><span class="lbl">Work:</span> <cite>(1599–1662) in Synopsis of a Purer Theology: Latin Text and English Translation</cite>, 2.307</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/justification.html">Justification</a></span></div>

</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-b6cd4f8948" data-kw="">
<blockquote><p>Justification in Scripture is described by terms otherwise pertaining to the court. Therefore, it is taken in a forensic sense.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/friedemann-bechmann.html">Friedemann Bechmann</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Other citations (work not named)</cite>, On Justification, Q. I</span></figcaption>

<div class="actions"><button class="copy" data-copy="“Justification in Scripture is described by terms otherwise pertaining to the court. Therefore, it is taken in a forensic sense.”

— Friedemann Bechmann, On Justification, Q. I">Copy</button><a class="share" href="https://x.com/intent/post?text=%E2%80%9CJustification+in+Scripture+is+described+by+terms+otherwise+pertaining+to+the+court.+Therefore%2C+it+is+taken+in+a+forensic+sense.%E2%80%9D%0A%0A%E2%80%94+Friedemann+Bechmann%2C+On+Justification%2C+Q.+I&amp;url=https%3A%2F%2F5solasquotes.github.io%2Fquote%2Fb6cd4f8948.html&amp;via=5Solas" target="_blank" rel="noopener">Share on X</a><a class="perma" href="../quote/b6cd4f8948.html">Permalink</a><span class="src none">No free online copy linked</span></div>
</figure><figure class="quote" id="q-3dcf2df3aa" data-kw="">
<blockquote><p>For because Paul had taught, that a man is justified by faith without works, hence some inferred, that in whatever manner a man live, it, equally suffices, that he persuade himself that Christ is his Saviour. Which they could have inferred with no plausibility, if that had been evident which the very learned man will have to be so, viz. That Paul, by faith understood evangelical godliness. But because Paul’s words evidently bore that sense, that faith was a thing distinct from all the works of holiness, as in reality it is, hence arose the pretext of calumny. I say, of calumny: for though Paul taught, that works contribute nothing to justification, or to procure a man’s title to salvation; yet he always taught, that they were not only useful, but also necessary to salvation, and that it is impossible, that sanctification should be separated from justification. James treads in the same path, and teaches that it is necessary that he who is justified by faith, should also be justified by works: that is, perform these works which are the evidences and effects of righteousness, and by which it is demonstrated not only before men, but also before God, that he is righteous: according to that of John, “He who doeth righteousness is righteous,” 1 John 3:7. Indeed there is a double justification: one of a man sinful in himself, whereby he is absolved from sin, and declared to have a title to eternal life, on account of Christ’s righteousness apprehended by faith, which Paul inculcated: another of a man, righteous already, sanctified by the Spirit of Christ, and who is declared to be such, by his words and actions. James teaches, that this is so necessary, and so connected with the former, that he is deceived who boasts of that and is destitue of this.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/herman-witsius.html">Herman Witsius</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Conciliatory or Irenical Animadversions on the Controversies Agitated in Britain</cite>, trans. Thomas Bell (Glasgow: W. Lang, 1807), 97–99.</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/justification.html">Justification</a></span></div>

</figure><figure class="quote" id="q-240f71f392" data-kw="">
<blockquote><p>The deformity of soul which came upon us in the loss of the image of God, wherein beauty and harmony of all our faculties, in all their actings in order unto their utmost end, did consist; that enmity unto God, even in the mind, which ensued therein; that darkness which our understandings were clouded, yea, blinded withal, —the spiritual death which passed on the whole soul, and total alienation from the life of God; that impotency unto good, that inclination unto evil, that deceitfulness of sin, that power and efficacy of corrupt lusts, which the Scriptures and experience so fully charge on the state of lost nature, are rejected as empty notions or fables. No wonder if such persons look upon imputed righteousness as the shadow of a dream, who esteem those things which evidence its necessity to be but fond imaginations. And small hope is there to bring such men to value the righteousness of Christ as imputed to them, who are so unacquainted with their own unrighteousness inherent in them. Until men know themselves better, they will care very little to know Christ at all.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/john-owen.html">John Owen</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Doctrine of Justification by Faith in The Works of John Owen</cite>, 5:21</span></figcaption>

</figure><figure class="quote" id="q-5d48a72dfc" data-kw="">
<blockquote><p>A living faith justifies, not in its active state, but in its act of apprehending and laying hold upon Christ. On the other hand, faith’s second notable act is to purify and cleanse the heart and stir up other graces. In this sense, some learned individuals argue that good works are necessary to preserve a person in the state of justification, though they do not immediately contribute to that act.</p></blockquote>

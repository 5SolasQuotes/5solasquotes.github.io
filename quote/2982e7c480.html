<main class="wrap"><figure class="quote" id="q-2982e7c480" data-kw="">
<blockquote><p>(2) If they allege that we read often in the Old Testament that God appeared to men, I respond, He appeared either without any human form, manifesting his extraordinary presence only by some extraordinary sign, or, if He was present in some form, it was not his own but one that He had assumed. He appeared not in his own form but in a vision, the way Jesus appeared to Stephen, standing at the right hand of God (Acts 7:56), and to Paul (Acts 9:10, 12), the same way that Peter saw a vessel descending from heaven filled with animals (Acts 10:11-12; 11:5-6).</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/petrus-van-mastricht.html">Petrus van Mastricht</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Theoretical Practical Theology</cite>, trans. Rester &amp; Spangler (RHB, 2019), vol. 2, bk. 2, ch. 6, ‘The Spirituality &amp; Simplicity of God’ | section 9, pp. 135-36</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/worship/idolatry-and-images.html">Idolatry and Images</a></span></div>

</figure><figure class="quote" id="q-a14e2c7a2f" data-kw="">
<blockquote><p>…will I join a most godly ancient bishop, whose Greek epistle being sent to John, bishop of Jerusalem, Jerome did translate into Latin; his name is Epiphanius. The words of the epistle are these: ‘…Wherein we do learn all these godly lessons: First, that no place ought to be given in the church of Christ to those things that are against the authority of the holy Scriptures. Secondly, that to give place in the church of Christ unto images, it is against the authority of the holy Scriptures, that is, of that law, which says: Thou shalt not make to thyself any graven image. Thirdly that not only graven and molten images, and such as be set up on high, upon or over the altars, but also the painted images ought to be cast out of the churches. Fourthly that the image of Christ Himself ought in no wise to stand in the church, because that of all other it is most perilous and breeds the greatest idolatry. Fifthly that the images ought to be caste out of the church of Christ, not only by sedulity and diligence of doctrine, but also by very fact and deed. Sixthly, that they ought not coldly, but with a fervent and earnest zeal of the true religion be put done, defaced, and broken all to pieces, as we do see this holy man of God Epiphanius to have rent and torn in pieces the vail that had the image of Christ painted, which he did being moved with the zeal of God. Seventhly, that it is the part and duty of bishops, to see that images be not set up in the church of Christ. Last of all, that it is a mere scrupulosity and superstition, unseemly for the church and the faithful people of God to have images.’ Here may we see that this godly ancient bishop did much differ in judgment from those fond persons that think it to be a profitable thing for the people of God to have images standing in the churches. Let them weigh these things that have always the fathers in their mouths, and so let them learn that it is more honesty for us to be called iconoclastae, that is, image breakers, than to be called iconoplastae, that is, image makers, and that we do approach nearer to the example of the old ancient church than they do, although they brag and boast themselves to be catholic and apostolic.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/john-veron.html">John Veron</a></span><span class="wk"><span class="lbl">Work:</span> <cite>A Strong Battery against the Idolatrous Invocation of the Dead Saints, and Against the having or setting up of Images in the House of Prayer or in any other place where there is any peril of iIolatry</cite>, … (London: Sutton, 1562), pp. 92-93</span></figcaption>

</figure><figure class="quote" id="q-51cebe7f05" data-kw="">
<blockquote><p>Concerning the humanity of our blessed Savior, that being a creature he might be depicted, I mean it was naturally capable of it: it was the great instrument of many actions, it conversed with mankind above thirty years together, it was the subject of great changes, and the matter of a long story, and the conduit of many excellent instructions, and therefore might without all question be described as well as Caesar’s or Meletius, Marc Anthony or the kings of the gentiles. It might be done: and the question being here only of the making or having of it, abstractedly from all other appendages or collateral considerations, I need say no more of it under this title; but that it is neither impious nor unreasonable of itself to have or to make the picture or image of Christ’s humanity, or rather of his human body. For against this there is neither reason nor religion; and if it be made accidentally unlawful, that is not of present consideration.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/jeremy-taylor.html">Jeremy Taylor</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Ductor dubitantium, or, The Rule of Conscience in all her General Measures serving as a great instrument for the determination of cases of conscience</cite>, … (London, 1660), vol. 1, Of the Rule of Conscience, ch. 2, Rule 6, ‘Every thing in the Decalogue is not obligatory to Christians, is not a portion of the Moral or Natural law’ Taylor (1613–1667) was a cleric in the Church of England who achieved fame as an author during the Protectorate of Oliver Cromwell. He was Arminian in outlook., p. 334</span></figcaption>

<blockquote><p>Rather the question is whether they are to be reverenced with religious worship properly so called. This our opponents wish; we deny. At the outset, we oppose the calumnies of the papists who slander us as despisers and enemies of the saints because we repudiate the worship of them (as if disgrace were thrown upon the saints when what belongs to God and Christ alone is not attributed to them). Now although their memory is very sacred to us, still we think that care should be diligently taken that they be not worshipped to the injury of God.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/francis-turretin.html">Francis Turretin</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Institutes of Elenctic Theology</cite>, 11.9.2b</span></figcaption>

<main class="wrap"><figure class="quote" id="q-582244f370" data-kw="">
<blockquote><p>The Greek word translated Synagogue, signifies, simply, an assembly, without any reference to the character or motives of the individuals assembled. The Septuagint translators use the word in this sense; they apply it not only to the people of Israel legally convened, but also to the rebellious company that followed Korah, Dathan, and Abiram.

The word translated Church, (ECCLESIA,) on Meaning of the contrary, always conveys some idea of the church, nature of the assembly; it answers to the Hebrew word KAHAL, which denotes an assembly legally convened. Thus the Jewish people, when assembled as a body politic to receive the law, are called KAHAL; and St. Stephen, referring to this assembly, styles it ECCLESIA; nay, more, the turbulent crowd in the temple of Diana at Ephesus, is also called ECCLESIA, because it was a legal assembly.

In the New Testament, the word ECCLESIA is used in an extended, and also in a limited sense; it signifies the whole Christian community, the entire body of believers, — governed by one Spirit, united by one faith, with one supreme head, Jesus Christ, in heaven; it is also applied to the Christian community in one city, or even to the congregation accustomed to assemble in one house; but still, in every case, a legal bond of union, enters into the idea conveyed by the word.

The followers of Christ may be so dispersed, so scattered throughout the world, as to have no opportunity of meeting together; they then cease to be a congregation (SUNAGOGE), but they do not cease to be a Church (ECCLESIA); they have still their legal bond of union, they have still the same Head, they are united by the same faith, supported by the same hope.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/campegius-vitringa.html">Campegius Vitringa</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Synagogue and the Church, being an attempt to show, that the Government, Ministers, and Services of the Church, were derived from those of the Synagogue</cite>, trans. and ed. Joshua L. Bernard (1685; London: B. Fellowes, 1842), pp 1-2.</span></figcaption>

<blockquote><p>Hymns of human composition are used so commonly now in public worship by Presbyterian churches that it is difficult to believe that the practice is not a hundred years old, and that in some of the churches it is of very recent date. On the supposition that it is good and dutiful and wise to sing such hymns in worship, it is equally difficult to account for the neglect of the churches at the time of the Reformation, and for generations afterwards. What could have so blinded the reformers as to make them reject hymns and sing the Psalms alone? How could the Westminster Divines, in framing their Confession of Faith and Directory for Worship, have been so unanimous in the blunder that the service of praise is to consist of the “Singing of Psalms?” And apart from the aspect of duty, how could the Presbyterian churches, for about a hundred and fifty or two hundred years after the Westminster Assembly, have been so insensible to the power of hymns as an attractive addition to their public services? We cannot by any means understand how it was that, if it was dutiful to use hymns in worship, the reformers did not discover the Scriptural warrant for the duty, especially as hymns had been used for centuries by the Church of Rome. Nor can we understand how they rejected the hymns and used the Psalms alone, unless on the supposition that they believed the use of hymns to be part of the will-worship of Rome.

If they were wrong on this point, then Rome and our modern Presbyterian churches are right. In that case, the Puritans and Covenanters were fanatics, and Romanists were truly enlightened. And most of our Presbyterian churches of the present day were fanatical too, and did not become truly enlightened and liberal till they got hack to the Romish practice! The Free Church of Scotland, for example, which existed for nearly forty years without an authorized hymn-book must have been so far an heir to Puritanic and Covenanting fanaticism till the year of grace 1882, when it went back beyond the time of the Presbyterian Reformation to find a nobler inheritance in the Romish practice of singing uninspired hymns in worship.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/james-dick.html">James Dick</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Hymns and hymn-books in Original Covenanter</cite></span></figcaption>

</figure><figure class="quote" id="q-a7061ec4b5" data-kw="">
<blockquote><p>Does not the importance of the Sabbath, in a civil view, invest it with an undeniable claim to the protection of public law? The laws of all Christian States have, to a greater or less extent, given their authority and protection to the Sabbath. Men of wisdom, honour, and virtue, have ever felt that it ought to be among the earliest objects of their solicitude to perpetuate the blessings of this holy day.

And does not the importance of the Sabbath plead irresistibly for this paternal interposition? Is the Sabbath the great means of perpetuating in the earth the knowledge of the true religion? Is it the great means of intellectual advancement? Does it lie at the foundation of all sound morality? Is it not less a distinguished means of temporal prosperity, than of holiness and eternal life? Then is there no institution around which a more impenetrable barrier of wholesome restrictions ought to be erected.

The Sabbath is the noblest and firmest pillar of a well-regulated society. It is the corner-stone of that noble edifice of morals, liberty, and public weal, which is the pride and exultation of every prosperous community. If our political institutions cannot be preserved unless the laws and usages of the land are formed on the basis of sound morality; if morality cannot be maintained without the active impression of religious principle; and if neither can exist long, where the Sabbath exerts none of its heaven-born influence; then is it not the truest policy of a State to enforce the observance of this day?</p></blockquote>

</figure><figure class="quote" id="q-b832562738" data-kw="">
<blockquote><p>What holy invectives does Paul in his epistles make against superstitious worship? Yet how few are the men that mind the pure instituted worship of God, that would have the fountains of Israel without the mixture of any mud in them? Outward oppressions in Popery were nothing so heavy upon the godly as the corrupt mixtures in God’s worship; but if you observe the general disposition of men, they are wholly carried out to some sensible superstitious ways of worship. They love not the simplicity and purity of God’s worship. It is great proficiency in Christianity not to have our minds corrupted herein. As children delight in babies, so do men [delight] in some worships of their own that they have made. What is Popery but a mere stage-play in the worship of God? And if you ask of hundreds of ceremonies they have: ‘Whose image and superscription is upon them?’ You shall find none of God’s imprinted on them. There were the statutes of the heathens (Lev. 20) and these the people must not go in (Eze. 20). There are statutes of our fathers we must not walk in: Oh there is too much of this superstition still in men! Men by false worship manifest they have not spiritual hearts.</p></blockquote>

<blockquote><p>The king under whom Isaiah has hitherto prophesied is dead ([6] v. 1), and, in all likelihood, he is cast down by that event. In this frame he repairs to “the temple” (v. 1), that he may pour out his laden soul, and takes his place (v. 6) hard by “the altar.” But the temple is Christ — the altar Christ — the blood Christ — the very ashes are Christ; and as Christ thus meets his view, in all his sufferings and in all his love, peace would visit the afflicted saint again. O there is no relief for an anxious soul, no balm for a wounded soul, no light for a sad and gloomy soul, but Jesus!</p></blockquote>

<blockquote><p>Section 7. Third part of liberty, viz., the free rise of things indifferent. The knowledge of this part necessary to remove despair and superstition. Superstition described… The third part of this liberty is that we are not bound before God to any observance of external things which are in themselves indifferent, (“adiafora”) but that we are now at full liberty either to use or omit them. The knowledge of this liberty is very necessary to us; where it is wanting our consciences will have no rest, there will be no end of superstition. In the present day many think us absurd in raising a question as to the free eating of flesh, the free use of dress and holidays, and similar frivolous trifles, as they think them; but they are of more importance than is commonly supposed. For when once the conscience is entangled in the net, it enters a long and inextricable labyrinth, from which it is afterwards most difficult to escape. When a man begins to doubt whether it is lawful for him to use linen for sheets, shirts, napkins, and handkerchiefs, he will not long be secure as to hemp, and will at last have doubts as to tow; for he will revolve in his mind whether he cannot sup without napkins, or dispense with handkerchiefs. Should he deem a daintier food unlawful, he will afterwards feel uneasy for using loafbread and common eatables, because he will think that his body might possibly be supported on a still meaner food. If he hesitates as to a more genial wine, he will scarcely drink the worst with a good conscience; at last he will not dare to touch water if more than usually sweet and pure. In fine, he will come to this, that he will deem it criminal to trample on a straw lying in his way. For it is no trivial dispute that is here commenced, the point in debate being, whether the use of this thing or that is in accordance with the divine will, which ought to take precedence of all our acts and counsels. Here some must by despair be hurried into an abyss, while others, despising God and casting off his fear, will not be able to make a way for themselves without ruin. When men are involved in such doubts whatever be the direction in which they turn, every thing they see must offend their conscience.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/john-calvin.html">John Calvin</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Institutes of the Christian Religion</cite>, 4.10.7</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/worship/ceremonies-and-things-indifferent.html">Ceremonies and Things Indifferent</a></span></div>

<blockquote><p>…you [Gilbert Burnet] boldly attempt to make even the very sacraments arbitrary by asking why we use not washing of feet, since there is no sacrament set down more punctually in Scripture? And when your non-conformist [in your book] retorts that you are under the same obligation (which retortion may be pertinently made to most of your objections), you tell him that you have a clear answer, that in these externals God intended no perpetual obligation, and therefore in them you follow the practice of the catholic Church… As for this your lax acceptation of a professed indifferency in externals, what part of the Christian religion or worship may it not corrupt or subvert? And seing it does tolerate and allow the not practising of the washing of feet to you, as well founded In Scripture as either of the sacraments, would it not in a just parity of reason dispense with and forego these also? This is indeed doctrine so damnable, that I hope it shall never need an antidote; and therefore I return to examine your third or eight sacrament (I know not which, for all are but external) of washing of feet. And you say that it has in Scripture of element, water, the action, washing the feet, the institution, ‘as I have done so do ye’ and ‘ye ought to wash one another’s feet’, and the spiritual use of it, humility: Whence you conclude: ‘Why do ye not therefore use this rite?’ To which last point, it is, that waving any further discourse about the nature and requisites of a sacrament, whereof, notwithstanding your parrallel description of this washing, yet I perceive you are loathe to apply the name, I shall direct my answere, viz.: That this washing is not to be used, because though our Lord did practice this lowly act of condescendence as eminently expressive of that humility whereunto He would have his disciples instructed, yet neither is it in itself of the nature of a sacramental sign, whereof all the significancie is from the institution, and virtue in the exhibition of the thing signified, which you cunningly omit to mention; Nor does Christ perform it by way of institution, for repetition, but by way of example, for imitation, as is manifest from the text, John 13:4, etc. where we find that our Lord does first wash his disciples’ feet before He told them what He was a doing; and then having done the act, not simply significant by his appointment, but of itself as the effect expressing the greatest humility as its cause, He teaches them not a […]o […]emne reiteration, but the use in these words, ‘If I your Lord and Master have washed your feet, ye also ought to wash on another’s feet’: ‘If I have been among you as He that serves, so ought ye to serve one another, for I have given you an example that ye should do as I have done to you.’ I have not showed you humility in a figure to be repeated for your remembrance, but by a solid practice taught you the like performance: so that to turn this pattern unto a rite is in effect as far from our Lord’s purpose as the instruction of plain examples is preferable to that of mystic representations: Which exposition is so true and sound, that as this fancy of yours was never owned by the Church of Christ, so, it is most certain, that where it has been followed (I mean by the Pope) and this action has been used as a rite, it has only been made a color to the most prodigious and superlative pride that ever the sun beheld: and thus I hope all men may see that the not using of this washing, never again used for anything we read, by way of sacrament or ceremony, either by our Lord or his apostles and Churches, is neither a deformity in us from the Scripture, nor an argument for your irreligious laxness in things you call externals.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/robert-macward.html">Robert MacWard</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The True Non-Conformist</cite>, … (1671), 3rd Dialogue, pp. 117-19</span></figcaption>

<blockquote><p>Gregory says in a homily (vi in Evang.): ‘An idle word is one that lacks either the usefulness of rectitude or the motive of just necessity or pious utility.’ But an idle word is an evil, because ‘men… shall render an account of it in the day of judgment’ (Mt. 12:36): while if it does not lack the motive of just necessity or pious utility, it is good. Therefore every word is either good or bad. For the same reason every other action is either good or bad. Therefore no individual action is indifferent. …It sometimes happens that an action is indifferent in its species, but considered in the individual it is good or evil. And the reason of this is because a moral action… derives its goodness not only from its object, whence it takes its species; but also from the circumstances, which are its accidents, as it were; just as something belongs to a man by reason of his individual accidents, which does not belong to him by reason of his species. And every individual action must needs have some circumstance that makes it good or bad, at least in respect of the intention of the end. For since it belongs to the reason to direct; if an action that proceeds from deliberate reason be not directed to the due end, it is, by that fact alone, repugnant to reason, and has the character of evil. But if it be directed to a due end, it is in accord with reason; wherefore it has the character of good. Now it must needs be either directed or not directed to a due end. Consequently every human action that proceeds from deliberate reason, if it be considered in the individual, must be good or bad.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/thomas-aquinas.html">Thomas Aquinas</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Other citations (work not named)</cite>, pt. 2, pt. 1, question 18, ‘Of the Good &amp; Evil of Human Acts in General’ in Summa | 9. ‘Whether an individual action can be indifferent?’ [No]</span></figcaption>

<blockquote><p>These [circumstances] are such close adjuncts of religious worship that in a secondary sense they partake of the meaning and nature of it. Observance of them promotes not only the honor of God which is found in both the natural and the instituted worship of God, but also a certain special honor to Him in that their observance is connected with natural and instituted worship by his command and in a direct and immediate way.</p></blockquote>

<main class="wrap"><figure class="quote" id="q-45221490ee" data-kw="">
<blockquote><p>OBJECTION. If any shall say, “By ‘first and old covenant’ was meant God’s covenant with Israel, and not with Adam; and so, by ‘covenant of works’ the same is meant; namely, that which the Lord made at Mount Sinai:” (Heb. 8:7–9:) ANSWER. Hereunto I answer, There is a repetition of the covenant of works with Adam in the law of Moses; as in that of the apostle to the Galatians: “The law is not of faith: but, The man that doeth” these things “shall live in them.” (Gal. 3:12.) So likewise to the Romans: “Moses describeth the righteousness which is of the law, That the man who doeth those things shall live by them.” (Rom. 10:5.) Thus it was with Adam principally and properly: therefore he was under a covenant of works, when God gave him that command in my text.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/william-cooper.html">William Cooper</a></span><span class="wk"><span class="lbl">Work:</span> <cite>“Sermon VI: The Covenant of Works” in James Nichols</cite>, ed. Puritan Sermons (Wheaton, IL: Richard Owen Roberts, Publishers, 1981), 5.97.</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/the-covenant-of-works.html">The Covenant of Works</a></span></div>

</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-d30289b10e" data-kw="">
<blockquote><p>The Covenant of Works, wherein God covenanted with man to give him eternal life upon condition of perfect obedience in his own person. The Covenant of Grace, which God made with man promising eternal life upon condition of believing…This Covenant [of works] God made with man without a Mediator for there needed no no middle person to bring man into favor and friendship with God, because man did bear the image of God, and had not offended: nor to procure acceptance to man’s service because it was pure and spotless. God did love man being made after his Image and promised to accept of his obedience performed freely, willingly, entirely, according to his Commandment.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/john-ball.html">John Ball</a></span><span class="wk"><span class="lbl">Work:</span> <cite>A Treatise of the Covenant of Grace</cite>, (London, 1645), 8, 9.</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/the-covenant-of-works.html">The Covenant of Works</a></span></div>

</figure><figure class="quote" id="q-07fc90e93b" data-kw="">
<blockquote><p>God’s covenant is a bargain which God hath made with men, in which God promises to men some good, and requires of them again, that they perform those things which he commands. And that covenant is either eternal or temporal. The eternal covenant is a covenant in which God promises men eternal life. And that is twofold: the covenant of works or the covenant of grace. The covenant of works, is a bargain of God made with men concerning eternal life, to which is both a condition of perfect obedience adjoined, to be performed by man, and also a threatening of eternal death if he shall not perform perfect obedience. Gen. 2. 17. The repetition of the covenant of works is made by God, Exod. 19. 5. Deut. 5. 2. 1. King. 8. 21. Heb. 8. 9. and that chiefly for four causes. That God by all means might stir up men to perform obedience. That every mouth might be stopped, and all the world might be made subject to the condemnation of God for not performing perfect obedience. Rom. 3. 19. That he might manifest mans sin, and naughtiness. Rom. 3. 19. 20. and 7. 7. 8. 9. 10. 11. That he might thrust us forward to seek to be restored in the covenant of grace. Gal. 3. 22. and 5. 23.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/amandus-polanus.html">Amandus Polanus</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Substance of Christian Religion Soundly set forth in Two Books, by Definitions &amp; Partitions</cite>, trans. E. W. (London, 1595), 87–88. [Spelling modernized]</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/the-covenant-of-works.html">The Covenant of Works</a></span></div>

</figure><figure class="quote" id="q-83baa068be" data-kw="">
<blockquote><p>VII. Second, a law was imposed upon Adam, which necessarily implies a federal agreement and contract. For he who receives it, binds himself officially to obedience under the punishment denounced through the same; he who gives it (for the very reason that he exacts obedience) is bound to furnish indemnity and security to the one obeying. Although Moses sets forth only one part of that federal sanction (referring to punishment, Gen. 2:17), still he proves that the former concerning the promise should not be excluded, both from the sacrament of the tree of life (by which it was sealed) and from the threatening of death (which by reason of contraries had the implied promise of life and from the various passages of Scripture which express more clearly the nature and sanction of the law, as Lev. 18:5—“If a man do these, he shall live in them,” cf. Dt. 27:26; Ezk. 20:11; Mt. 19:17; Gal. 3:12)</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/francis-turretin.html">Francis Turretin</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Institutes of Elenctic Theology</cite>, ed. James T. Dennison Jr., trans. George Musgrave Giger, vol. 1 (Phillipsburg, NJ: P&amp;R Publishing, 1992–97), 8.3.7 [pp. 575–76].</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/the-covenant-of-works.html">The Covenant of Works</a></span></div>

</figure><figure class="quote" id="q-d06d978e9d" data-kw="">
<blockquote><p>It revived the promise of that covenant, —that of eternal life upon perfect obedience. So the apostle tells us that Moses thus describeth the righteousness of the law, “That the man which doeth those things shall live by them,” Romans 10:5; as he doth, Leviticus 18:5. Now this is no other but the covenant of works revived. Nor had this covenant of Sinai any promise of eternal life annexed unto it, as such, but only the promise inseparable from the covenant of works which it revived, saying, “Do this, and live.”</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/john-owen.html">John Owen</a></span><span class="wk"><span class="lbl">Work:</span> <cite>An Exposition of the Epistle to the Hebrews</cite>, 8:6; Works, vol. 22, p. 94</span></figcaption>

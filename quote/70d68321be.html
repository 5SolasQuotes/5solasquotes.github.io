<blockquote><p>There is a cause at work in this, which we are apt to overlook, we mean the correspondence between intensity of religion at home, and zeal for the extension of religion abroad. The nations of Europe were as remiss respecting the conversion of the heathen, as they were concerning the purifying power of the gospel at home, and the same cause accounted for both—the want of divine power.

The attention of the Christian world has been to some extent engaged with foreign missions, and these have in our own country grown up into national importance; and it is altogether a relevant proof of zeal for the one leading to care for the other, that during the last forty years, certain great questions of righteousness and morality have very strongly laid hold of the public mind.

The question of Colonial slavery, and other less prominent, but more decisive of principles, might be cited. And, guided by these indications of an operative principle, we are permitted, even on the score of appearances, to look forward to a condition of the world more in accordance with the delineations of prophecy picturing millennial glory.</p></blockquote>

</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-d8eea88569" data-kw="">
<blockquote><p>3. When Christ commands his disciples to bless them that curse them and persecute them, He gives not therein a rule to public officers, whether in Church or commonweal, to suffer notorious sinners, either in life or doctrine, to pass away with a blessing: But to private Christians to suffer persecution patiently, yea and to pray for their persecutors. Again, it is true, Christ would have his disciples to be far from persecuting (for that is a sinful oppression of men for righteousness sake) but that hinders not but that He would have them execute upon all disobedience the judgement and vengeance required in the Word, 2 Cor. 10:6; Rom. 13:4.

4. Though it be true that wicked persons now may by the grace of God become true disciples and converts, yet we may not do evil that good may come thereof: And evil it would be to tolerate notorious evil-doers, whether seducing teachers or scandalous livers. Christ had something against the angel of the Church of Pergamus for tolerating them that held the doctrine of Balaam, and against the Church of Thiatira for tolerating Jezabel to teach and seduce, Rev. 2:14, 20.</p></blockquote>

<blockquote><p>Moreover, youth is a season of inexperience; and this constitutes another source of danger. Every one knows that our most valuable knowledge is derived from experience; that it is far more accurate, more deep, more practical than any other. But of this the young, from the nature of the case, cannot, in a great degree, avail themselves; as it is the exclusive prerogative of riper years. They have had but little experience of their own hearts; but little opportunity of tracing out the sources of human conduct, of becoming acquainted with the evil principles which lurk within them — the treachery, perverseness, rebellion, which constitute the elements of man’s depraved nature.

They have had but limited experience of the world, and are very inadequate judges of its true character. They have ordinarily seen only its bright side; have not often been pierced by its ingratitude, or betrayed by its faithlessness, or stung by its neglect. Of its temptations, too, of the stratagems of the wicked, of the serpentine influence of worldly pleasures, they know comparatively little. How manifestly does this want of experience give the world which they are entering a powerful advantage over them.

With but a slight knowledge of themselves, they are liable to misjudge in respect to the circumstances in which they shall be safe, and to put character and happiness in jeopardy, from a wrong estimate of their strength to resist temptation. With but a slight knowledge of the world, they are in danger of trusting it where it intends to betray; and of being carried headlong by its influence into the vortex of pleasure and vice, while yet they have scarcely suspected that they were beyond the limits of virtue and safety. Many a youth has gone into the haunts of sin, and finally into the world of wo, because, at the commencement of his course, he did not suspect the danger.</p></blockquote>

<blockquote><p>And in all deceivableness of unrighteousness, among them that perish, because they received not the love of the truth, that they might be saved (2 Thessalonians 2:10 Geneva Bible)

It is not enough to receive the truth in the light of it, but we must also receive it in the love of it, or it will do us no good. To make the truth operative:—(1.) Knowledge is necessary, and also faith, and then love. Knowledge, for ‘without knowledge the heart is not good,’ Prov. xix. 2. Nothing can come to the heart but by the mind; the will is ὄρεξις μετὰ λόγον—a choice or desire, guided by reason, and the gospel doth not work as a charm, whether it be or be not understood. No; the purport or drift of it must be known, or how can it have any effect upon us?

Next to knowledge, to make it work, there must be faith. When we apprehend a thing, we must judge of it, whether it be true or false; how else can it make any challenge, or lay claim to our respect? 1 Thes. ii. 13, ‘Ye received it not as the word of men, but (as it is in truth) the word of God, which worketh effectually in you, as it doth in all them that believe.’ Faith doth enliven our actions about religion; to hear of God, and Christ, and heaven, doth not stir us unless we believe these things.

Well, next to faith there must be love, for apprehension and dijudication [sic] are acts of the understanding only, but love belongeth to the will, and we must believe with all the heart, Acts viii. 37. There may be knowledge without faith, as an heathen may understand the Christian religion, though he believe it not, profess it not. And there may be faith without love, for there is a ‘dead faith,’ James ii. 20, which rests in cold opinions, without any affection to the truth believed.

Love pierceth deeper into the truth, and maketh it pierce deeper into us. As a red-hot iron, though never so blunt, will run farther into an inch board than a cold tool, though never so sharp. And love maketh it more operative; there is notitia per visum, et notitia per gustum — a knowledge by sight, and a knowledge by taste. A man may guess at the goodness of wine by the colour, but more by the taste; that is a more refreshing apprehension; and Augustine prayeth, Fac me, Domine, gustare per amorem quod gusto per cognitionem — Lord, make me taste that by love which I taste by knowledge.

Surely we are never sound in Christianity till all the light that we receive be turned into love. These great things are revealed and represented to our faith, not to please our minds by knowing them, but to quicken our love. Faith alone is but as sight, and faith with love is as taste. Now, it is more easy to dispute a man out of his belief that only seeth, than it is him that tasteth, and knoweth the grace of God in truth.

This is the true reason of the steadfastness of weak and unlearned Christians; though they have not such distinct conceptions and reasonings as many learned men have, yet their faith is turned into love, and a man is better held by the heart than by the head. And though they cannot dispute for Christ (as one of the martyrs said), they can die for Christ. But alas! many receive the truth in the light thereof, but few receive it in the love of it, and so lie open to deceit.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/thomas-manton.html">Thomas Manton</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Eighteen sermons on the second chapter of the second epistle to the Thessalonians, containing the description, rise, growth, and fall of antichrist, with divers cautions and arguments to establish Christians against the apostasy of the Church of Rome</cite>, (1679) in The complete works of Thomas Manton, D.D. (22 vols, London, 1871), 3: 80-81.</span></figcaption>

It is not enough to receive the truth in the light of it, but we must also receive it in the love of it, or it will do us no good. To make the truth operative:—(1.) Knowledge is necessary, and also faith, and then love. Knowledge, for ‘without knowledge the heart is not good,’ Prov. xix. 2. Nothing can come to the heart but by the mind; the will is ὄρεξις μετὰ λόγον—a choice or desire, guided by reason, and the gospel doth not work as a charm, whether it be or be not understood. No; the purport or drift of it must be known, or how can it have any effect upon us?

Next to knowledge, to make it work, there must be faith. When we apprehend a thing, we must judge of it, whether it be true or false; how else can it make any challenge, or lay claim to our respect? 1 Thes. ii. 13, ‘Ye received it not as the word of men, but (as it is in truth) the word of God, which worketh effectually in you, as it doth in all them that believe.’ Faith doth enliven our actions about religion; to hear of God, and Christ, and heaven, doth not stir us unless we believe these things.

Well, next to faith there must be love, for apprehension and dijudication [sic] are acts of the understanding only, but love belongeth to the will, and we must believe with all the heart, Acts viii. 37. There may be knowledge without faith, as an heathen may understand the Christian religion, though he believe it not, profess it not. And there may be faith without love, for there is a ‘dead faith,’ James ii. 20, which rests in cold opinions, without any affection to the truth believed.

Love pierceth deeper into the truth, and maketh it pierce deeper into us. As a red-hot iron, though never so blunt, will run farther into an inch board than a cold tool, though never so sharp. And love maketh it more operative; there is notitia per visum, et notitia per gustum — a knowledge by sight, and a knowledge by taste. A man may guess at the goodness of wine by the colour, but more by the taste; that is a more refreshing apprehension; and Augustine prayeth, Fac me, Domine, gustare per amorem quod gusto per cognitionem — Lord, make me taste that by love which I taste by knowledge.

Surely we are never sound in Christianity till all the light that we receive be turned into love. These great things are revealed and represented to our faith, not to please our minds by knowing them, but to quicken our love. Faith alone is but as sight, and faith with love is as taste. Now, it is more easy to dispute a man out of his belief that only seeth, than it is him that tasteth, and knoweth the grace of God in truth.

This is the true reason of the steadfastness of weak and unlearned Christians; though they have not such distinct conceptions and reasonings as many learned men have, yet their faith is turned into love, and a man is better held by the heart than by the head. And though they cannot dispute for Christ (as one of the martyrs said), they can die for Christ. But alas! many receive the truth in the light thereof, but few receive it in the love of it, and so lie open to deceit.”

— Thomas Manton, Eighteen sermons on the second chapter of the second epistle to the Thessalonians, containing the description, rise, growth, and fall of antichrist, with divers cautions and arguments to establish Christians against the apostasy of the Church of Rome, (1679) in The complete works of Thomas Manton, D.D. (22 vols, London, 1871), 3: 80-81.">Copy</button><a class="share" href="https://x.com/intent/post?text=%E2%80%9CAnd+in+all+deceivableness+of+unrighteousness%2C+among+them+that+perish%2C+because+they+received+not+the+love+of+the+truth%2C+that+they+might+be+saved+%282+Thessalonians+2%3A10+Geneva+Bible%29%0A%0AIt+is+not+enough+to+receive+the+truth+in+the+light+of+it%2C+but+we+must+also+receive+it+in+the+love+of+it%2C+or+it+will+do+us+no+good.+To+make+the+truth+operative%3A%E2%80%94%281.%29+Knowledge+is+necessary%2C+and+also+faith%2C+and+then+love.+Knowledge%2C+for+%E2%80%98without+knowledge+the+heart+is+not+good%2C%E2%80%99+Prov.+xix.+2.+Nothing+can+come+to+the+heart+but+by+the+mind%3B+the+will+is+%E1%BD%84%CF%81%CE%B5%CE%BE%CE%B9%CF%82+%CE%BC%CE%B5%CF%84%E1%BD%B0+%CE%BB%CF%8C%CE%B3%CE%BF%CE%BD%E2%80%94a+choice+or+desire%2C+guided+by+reason%2C+and+the+gospel+doth+not+work+as+a+charm%2C+whether+it+be+or+be+not+understood.+No%3B+the+purport+or+drift+of+it+must+be+known%2C+or+how+can+it+have+any+effect+upon+us%3F%0A%0ANext+to+knowledge%2C+to+make+it+work%2C+there+must+be+faith.+When+we+apprehend+a+thing%2C+we+must+judge+of+it%2C+whether+it+be+true+or+false%3B+how+else+can+it+make+any+challenge%2C+or+lay+claim+to+our+respect%3F+1+Thes.+ii.+13%2C+%E2%80%98Ye+received+it+not+as+the+word+of+men%2C+but+%28as+it+is+in+truth%29+the+word+of+God%2C+which+worketh+effectually+in+you%2C+as+it+doth+in+all+them+that+believe.%E2%80%99+Faith+doth+enliven+our+actions+about+religion%3B+to+hear+of+God%2C+and+Christ%2C+and+heaven%2C+doth+not+stir+us+unless+we+believe+these+things.%0A%0AWell%2C+next+to+faith+there+must+be+love%2C+for+apprehension+and+dijudication+%5Bsic%5D+are+

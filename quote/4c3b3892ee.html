<blockquote><p>In regard of the essence of God, nothing can be separated from him, he being immense and filling all things: but yet in regard of his voluntary communication and dispensing of himself unto the creature, the manner of his special presence doth much vary. Unto this special union of the creature to God (in virtue whereof, the creature is quickened, and doth in some sort live the life of God), there is necessarily pre-supposed some sinew or ligament, which may be therefore called the medium and instrument of life.

This knot in the estate of man’s creation, was the obedience of the law, or the covenant of works, which, while man did maintain firm and unshaken, he had an evident communion with God in all those vital influences, which his mercy was pleased to shed down upon him: but once untying this knot, and cutting asunder that bond, there did immediately ensue a separation between God and man, and, by an infallible consequence, death likewise.

But God, being rich in mercy, and not willing to plunge his creature into eternal misery, found a new means to communicate himself unto him, by appointing a more easy covenant, which should be the second knot of our union unto him, only to believe in Christ incarnate, who had done that for us which we ourselves had formerly undone. And this new covenant is the covenant of ‘faith, by which the just do live.’</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/edward-reynolds.html">Edward Reynolds</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Meditations on the Holy Sacrament of the Lord’s Last Supper</cite>, (1638) in The Whole Works of the Right Rev. Edward Reynolds, D.D., ed. Alexander Chalmers (6 vols, London, 1826), 3: 156.</span></figcaption>

<blockquote><p>21 Thesis.

… The foundation and the Mediator of the Covenant of Grace is our Lord Jesus Christ; but either as one to be incarnate, to be crucified, and to be raised from the dead; or as one being incarnate, being crucified and being truly raised from the dead, for never any had his sins remitted, but in him alone, who is yesterday, and to day and for ever, Jesus Christ, true God and true man. Therefore although he was God only before his incarnation, notwithstanding hitherto he was no other wise a Mediator, then as God about to take upon him our flesh, and if it to perform the whole mystery of our Redemption; and hence it is, he is called the Lamb of God, slain from before the foundations of the world; and the Fathers were saved by his Grace, even as we our selves are.

22 Thesis.

But although the Son of God, before he manifested himself in the flesh, was on God’s account (to whom future things are present) therefore a Mediator because to come, and therefore truly through him were sins remitted; By his Spirit did men both teach, and were taught; the Church by him was rightly governed; howbeit, the way and manner of his mediation was propounded at the first more darkly; afterwards the force and efficacy of it became yet less: and lastly, it redounded but to a very few.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/john-cameron.html">John Cameron</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Certain Theses, or, Positions Concerning the Three-Fold Covenant of God with Man</cite>, in Samuel Bolton, The True Bounds of Christian Freedom (London, 1656), pp 366-67.</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/the-covenant-of-grace.html">The Covenant of Grace</a></span></div>

<blockquote><p>Although the Church existed from the beginning, it was, before the calling of Abraham, for the most part in a state of dispersion. Too little is recorded of it, prior to that event, to give us definite knowledge of its nature and requirements. Our written constitution, so to speak, dates from the father of the faithful. God made a covenant with Abraham. By covenant is meant, a contract between two or more parties, in which there are mutual stipulations and promises. The transaction with Abraham was of this kind. God promised certain blessings to the patriarch, and he promised faith and obedience to God. Not only, therefore, in the Old Testament is this transaction called a covenant, but in the New Testament the same designation is applied to it. And, further than this, the New Testament writers, referring to the transaction with Abraham, not only call it a covenant, but they argue from its nature as such, to show that its original stipulations can be neither annulled nor altered. Rom. 4:13, 14; Gal. 3:15–18. “The covenant,” says the apostle, “that was confirmed before (to Abraham) of God in Christ, the law, which was four hundred and thirty years after, cannot disannul.” It is of importance, therefore, that this word should be retained, not only because it is scriptural, but because the idea which it expresses is essential to a proper understanding of the case. Many modern theological writers discard the word entirely, and stigmatize the system of the Reformers as the federal theology. In discarding the word, the truth which it was intended to convey is almost always discarded with it. If we would retain the truth, we must retain the forms in which God has seen fit to reveal it. God then formed a covenant with Abraham. The question is, What was that covenant, and who were the parties to it? We answer, in common with all Christendom, The covenant was the covenant of grace, and the parties were Abraham and those whom Abraham represented. Of course this does not mean that the covenant of grace originated in this transaction, or that none are included in it but Abraham and those whom Abraham represented. Nor does it mean that all represented by Abraham were savingly interested in its benefits. It only means that the covenant in question was a reënactment or renewed revelation of the covenant of grace in relation to Abraham, and that those represented by him were to be regarded and treated as included in it. By the covenant of grace is meant the plan of salvation, in which God promises to give to believers all the benefits of redemption, and they promise faith and obedience. If, therefore, in the covenant with Abraham, God promised to him the benefits of redemption on the condition of faith, that covenant was the covenant of grace. In other words, it was the gospel; for the gospel is nothing else than the proclamation of salvation through faith in Christ. That such was the nature of the covenant made with Abraham, is too clearly revealed to admit of doubt. When God promised that in his seed all the nations of the earth should be blessed, he promised to send Christ to be the Redeemer of men. It is the fulfilment of this promise and the exposition of it in the New Testament, which authoritatively determines its meaning. Our Lord himself said, “Abraham saw my day and was glad.” This can only mean that Abraham foresaw the advent of Christ, and rejoiced in the accomplishment of the work which Christ came to perform. The apostle therefore says, “God preached before the gospel unto Abraham.” The gospel, in the New Testament sense of the term, is the glad news of salvation through Jesus Christ. This therefore was, according to the apostle, what was preached to Abraham, when it was said, “In thee shall all nations be blessed.” The apostle Peter also, after he had healed the lame man, told the astonished multitude that Christ, in whose name the miracle had been performed, had been promised to Abraham, and predicted by the prophets. “Ye,” he added, “are the children of the prophets, and of the covenant which God made with our fathers, saying unto Abraham, And in thy seed shall all the kindreds of the earth be blessed. Unto you first, God having raised up his Son Jesus, sent him to bless you, in turning away every one of you from his iniquities.” Acts 3:25, 26. It is here clearly taught that the Abrahamic covenant, of which the Jews were the children, had reference to Christ; that the promise, “In thy seed shall all the kindreds of the earth be blessed,” was fulfilled in the advent of the Son of God; and that the blessedness promised, was turning men from their iniquities. To the same effect Paul said in the synagogue at Antioch, in Pisidia, “We declare unto you glad tidings, how that the promise made unto the fathers, God hath fulfilled the same unto us their children, in that he hath raised up Jesus.” Acts 13:32, 33. When arraigned before Agrippa he said, “Now I stand and am judged for the hope of the promise made unto our fathers: unto which promise the twelve tribes, instantly serving God day and night, hope to come: for which hope’s sake, king Agrippa, I am accused of the Jews.” Acts 26:6, 7. The great promise made to Abraham and to the other fathers, according to this passage, was the promise of Christ, on whose behalf Paul was a prisoner; and this was the promise toward which the eyes of all who served God were constantly fixed. Paul said to the Romans, “Jesus Christ was a minister of the circumcision, for the truth of God, to confirm the promises made unto the fathers.” Rom. 15:9. That is, Jesus Christ came and exercised his ministry among the Jews, to set forth the truth or veracity of God, in fulfilling the promises made to the fathers. In all these passages, “the promises made to the fathers,” means the promise of Christ thrice made to Abraham, Gen. 12:3, 18:18, 22:18, repeated to Isaac and Jacob, Gen. 26:4, 28:14, and which thenceforth became the burden of prophecy, renewed to every generation, constantly unfolded in its inexhaustible contents until the fulfilment came. Nothing, therefore, can be plainer than that the covenant made with Abraham was the covenant of grace, i.e. the promise of redemption through faith in the Messiah. This, however, is not a doctrine which rests on such general allusions or declarations merely, it is taught in the most explicit terms by the apostles. The design of the epistle to the Galatians was to convince them of the folly of apostatizing to Judaism. To do this the apostle raises them above the Mosaic period, and sets them back into communion with the great Abrahamic covenant, to which the law of Moses was not only posterior but subordinate. The special purpose of the third chapter of that epistle is to prove that justification is by faith, and not by the law. His first argument is from the fact that the Holy Ghost, in his manifold miraculous and sanctifying influences, had been given in confirmation of the doctrine of justification by faith. His second argument is from the case of Abraham. He was justified by faith, and therefore those who share his inheritance, i.e. who inherit the blessing of redemption promised him, are believers. Know therefore, he says, that believers are the sons (i.e. heirs) of Abraham. The third argument is from the impossibility of rendering the perfect obedience which the law demands. The fourth, from the explicit declaration of the Scriptures, that those who are just by faith shall live. The fifth, from the fact that Christ has redeemed us from the curse of the law in order that the blessing of Abraham, (i.e. the blessing promised to Abraham,) might come upon the gentiles. The only blessing, however, promised to Abraham, which comes upon the gentiles, is redemption. And finally, Paul argues from the nature of the covenant made with Abraham. He reminds his readers that even a human covenant cannot, when once ratified, be either annulled or altered, much less can a divine covenant be changed, either in its promises or conditions. In the covenant with Abraham in reference to Christ, the inheritance, (that inheritance in which the gentiles share,) was suspended upon faith in the promise. The law, therefore, which was long subsequent, could not alter this covenant, or make the inheritance to depend upon works. Here everything is taught, first, the Abrahamic covenant had reference to Christ; second, the thing promised was that inheritance of which Christ is the author, and all nations (not the Jews only) the heirs; third, the condition on which a participation in this inheritance is suspended, is faith and not works.</p></blockquote>

ame the burden of prophecy, renewed to every generation, constantly unfolded in its inexhaustible contents until the fulfilment came. Nothing, therefore, can be plainer than that the covenant made with Abraham was the covenant of grace, i.e. the promise of redemption through faith in the Messiah. This, however, is not a doctrine which rests on such general allusions or declarations merely, it is taught in the most explicit terms by the apostles. The design of the epistle to the Galatians was to convince them of the folly of apostatizing to Judaism. To do this the apostle raises them above the Mosaic period, and sets them back into communion with the great Abrahamic covenant, to which the law of Moses was not only posterior but subordinate. The special purpose of the third chapter of that epistle is to prove that justification is by faith, and not by the law. His first argument is from the fact that the Holy Ghost, in his manifold miraculous and sanctifying influences, had been given in confirmation of the doctrine of justification by faith. His second argument is from the case of Abraham. He was justified by faith, and therefore those who share his inheritance, i.e. who inherit the blessing of redemption promised him, are believers. Know therefore, he says, that believers are the sons (i.e. heirs) of Abraham. The third argument is from the impossibility of rendering the perfect obedience which the law demands. The fourth, from the explicit declaration of the Scriptures, that those who are just by faith shall live. The fifth, from the fact that Christ has redeemed us from the curse of the law in order that the blessing of Abraham, (i.e. the blessing promised to Abraham,) might come upon the gentiles. The only blessing, however, promised to Abraham, which comes upon the gentiles, is redemption. And finally, Paul argues from the nature of the covenant made with Abraham. He reminds his readers that even a human covenant cannot, when once ratified, be either annulled or altered, much less can a divine covenant be changed, either in its promises or conditions. In the covenant with Abraham in reference to Christ, the inheritance, (that inheritance in which the gentiles share,) was suspended upon faith in the promise. The law, therefore, which was long subsequent, could not alter this covenant, or make the inheritance to depend upon works. Here everything is taught, first, the Abrahamic covenant had reference to Christ; second, the thing promised was that inheritance of which Christ is the author, and all nations (not the Jews only) the heirs; third, the condition on which a participation in this inheritance is suspended, is faith and not works.”

— Charles Hodge, “Review of The Tecnobaptist, “Review of The Tecnobaptist: A Discourse, Wherein an Honest Baptist, by a Course of Argument to Which No Honest Baptist Can Object, Is Convinced That Infant Christians Are Proper Subjects Of Baptism by R. B. Mayes,” in The Book Reviews of Charles Hodge (repr. Bellingham, WA: Logos Bible Software, 20">Copy</button><a class="share" href="https://x.com/intent/post?text=%E2%80%9CAlthough+the+Church+existed+from+the+beginning%2C+it+was%2C+before+the+calling+of+Abraham%2C+for+the+most+part+in+a+state+of+dispersion.+Too+little+is+recorded+of+it%2C+prior+to+that+event%2C+to+give+us+definite+knowledge+of+its+nature+and+requirements.+Our+written+constitution%2C+so+to+speak%2C+dates+from+the+father+of+the+faithful.+God+made+a+covenant+with+Abraham.+By+covenant+is+meant%2C+a+contract+between+two+or+more+parties%2C+in+which+there+are+mutual+stipulations+and+promises.+The+transaction+with+Abraham+was+of+this+kind.+God+promised+certain+blessings+to+the+patriarch%2C+and+he+promised+faith+and+obedience+to+God.+Not+only%2C+therefore%2C+in+the+Old+Testament+is+this+transaction+called+a+covenant%2C+but+in+the+New+Testament+the+same+designation+is+applied+to+it.+And%2C+further+than+this%2C+the+New+Testament+writers%2C+referring+to+the+transaction+with+Abraham%2C+not+only+call+it+a+covenant%2C+but+they+argue+from+its+nature+as+such%2C+to+show+that+its+original+stipulations+can+be+neither+annulled+nor+altered.+Rom.+4%3A13%2C+14%3B+Gal.+3%3A15%E2%80%9318.+%E2%80%9CThe+covenant%2C%E2%80%9D+says+the+apostle%2C+%E2%80%9Cthat+was+confirmed+before+%28to+Abraham%29+of+God+in+Christ%2C+the+law%2C+which+was+four+hundred+and+thirty+years+after%2C+cannot+disannul.%E2%80%9D+It+is+of+importance%2C+therefore%2C+that+this+word+should+be+retained%2C+not+only+because+it+is+scriptural%2C+but+because+the+idea+which+it+expresses+is+essential+to+a+proper+understanding+of+the+case.+Many+modern+theological+writers+discard+the+word+entirely%2C+and+stigmatize+the+system+of+the+Reformers+as+the+federal+theology.+In+discarding+the+word%2C+the+truth+which+it+was+intended+to+convey+is+almost+always+discarded+with+it.+If+we+would+retain+the+truth%2C+we+must+retain+the+forms+in+which+God+has+seen+fit+to+reveal+it.+God+then+formed+a+covenant+with+Abraham.+The+question+is%2C+What+was+that+covenant%2C+and+who+were+the+parties+to+it%3F+We+answer%2C+in+common+with+all+Christendom%2C+The+covenant+was+the+covenant+of+grace%2C+and+the+parties+were+Abraham+and+those+whom+Abraham+represented.+Of+course+this+does+not+mean+that+the+covenant+of+grace+originated+in+this+transaction%2C+or+that+none+are+included+in+it+but+Abraham+and+those+whom+Abraham+represented.+Nor+does+it+mean+that+all+represented+by+Abraham+were+savingly+interested+in+its+benefits.+It+only+means+that+the+covenant+in+question+was+a+re%C3%ABnactment+or+renewed+revelation+of+the+covenant+of+grace+in+relation+to+Abraham%2C+and+that+those+represented+by+him+were+to+be+regarded+and+treated+as+included+in+it.+By+the+covenant+of+grace+is+meant+the+plan+of+salvation%2C+in+which+God+promises+to+give+to+believers+all+the+benefits+of+redemption%2C+and+they+promise+faith+and+obedience.+If%2C+therefore%2C+in+the+covenant+with+Abraham%2C+God+promised+to+him+the+benefits+of+redemption+on+the+condition+of+faith%2C+that+covenant+was+the+covenant+of+grace.+In+other+words%2C+it+was+the+gospel%3B+for+the+gospel+is+nothing+else+than+the+proclamation+of+salvation+through+faith+in+Christ.+That+such+was+the+nature+of+the+covenant+made+with+Abraham%2C+is+too+clearly+revealed+to+admit+of+doubt.+When+God+promised+that+in+his+seed+all+the+nations+of+the+earth+should+be+blessed%2C+he+promised+to+send+Christ+to+be+the+Redeemer+of+men.+It+is+the+fulfilment+of+this+promise+and+the+exposition+of+it+in+the+New+Testament%2C+which+authoritatively+determines+its+meaning.+Our+Lord+himself+said%2C+%E2%80%9CAbraham+saw+my+day+and+was+glad.%E2%80%9D+This+can+only+mean+that+Abraham+foresaw+the+advent+of+Christ%2C+and+rejoiced+in+the+accomplishment+of+the+work+which+Christ+came+to+perform.+The+apostle+therefore+says%2C+%E2%80%9CGod+preached+before+the+gospel+unto+Abraham.%E2%80%9D+The+gospel%2C+in+the+New+Testament+sense+of+the+term%2C+is+the+glad+news+of+salvation+through+Jesus+Christ.+This+therefore+was%2C+according+to+the+apostle%2C+what+was+preached+to+Abraham%2C+when+it+was+said%2C+%E2%80%9CIn+thee+shall+all+nations+be+blessed.%E2%80%9D+The+apostle+Peter+also%2C+after+he+had+healed+the+lame+man%2C+told+the+astonished+multitude+that+Christ%2C+in+whose+name+the+miracle+had+been+performed%2C+had+been+promised+to+Abraham%2C+and+predicted+by+the+prophets.+%E2%80%9CYe%2C%E2%80%9D+he+added%2C+%E2%80%9Care+the+children+of+the+prophets%2C+and+of+the+covenant+which+God+made+with+our+fathers%2C+saying+unto+Abraham%2C+And+in+thy+seed+shall+all+the+kindreds+of+the+earth+be+blessed.+Unto+you+first%2C+God+having+raised+up+his+Son+Jesus%2C+sent+him+to+bless+you%2C+in+turning+away+every+one+of+you+from+his+iniquities.%E2%80%9D+Acts+3%3A25%2C+26.+It+is+here+clearly+taught+that+the+Abrahamic+covenant%2C+of+which+the+Jews+were+the+children%2C+had+reference+to+Christ%3B+that+the+promise%2C+%E2%80%9CIn+thy+seed+shall+all+the+kindreds+of+the+earth+be+blessed%2C%E2%80%9D+was+fulfilled+in+the+advent+of+the+Son+of+God%3B+and+that+the+blessedness+promised%2C+was+turning+men+from+their+iniquities.+To+the+same+effect+Paul+said+in+the+synagogue+at+Antioch%2C+in+Pisidia%2C+%E2%80%9CWe+declare+unto+you+glad+tidings%2C+how+that+the+promise+made+unto+the+fathers%2C+God+hath+fulfilled+the+same+unto+us+their+children%2C+in+that+he+hath+raised+up+Jesus.%E2%80%9D+Acts+13%3A32%2C+33.+When+arraigned+before+Agrippa+he+said%2C+%E2%80%9CNow+I+stand+and+am+judged+for+the+hope+of+the+promise+made+unto+our+fathers%3A+unto+which+promise+the+twelve+tribes%2C+instantly+serving+God+day+and+night%2C+hope+to+come%3A+for+which+hope%E2%80%99s+sake%2C+king+Agrippa%2C+I+am+accused+of+the+Jews.%E2%80%9D+Acts+26%3A6%2C+7.+The+great+promise+made+to+Abraham+and+to+the+other+fathers%2C+according+to+this+passage%2C+was+the+promise+of+Christ%2C+on+whose+behalf+Paul+was+a+prisoner%3B+and+this+was+the+promise+toward+which+the+eyes+of+all+who+served+God+were+constantly+fixed.+Paul+said+to+the+Romans%2C+%E2%80%9CJesus+Christ+was+a+minister+of+the+circumcision%2C+for+the+truth+of+God%2C+to+confirm+the+promises+made+unto+the+fathers.%E2%80%9D+Rom.+15%3A9.+That+is%2C+Jesus+Christ+came+and+exercised+his+ministry+among+the+Jews%2C+to+set+forth+the+truth+or+veracity+of+God%2C+in+fulfilling+the+promises+made+to+the+fathers.+In+all+these+passages%2C+%E2%80%9Cthe+promises+made+to+the+fathers%2C%E2%80%9D+means+the+promise+of+Christ+thrice+made+to+Abraham%2C+Gen.+12%3A3%2C+18%3A18%2C+22%3A18%2C+repeated+to+Isaac+and+Jacob%2C+Gen.+26%3A4%2C+28%3A14%2C+and+which+thenceforth+became+the+burden+of+prophecy%2C+renewed+to+every+generation%2C+constantly+unfolded+in+its+inexhaustible+contents+until+the+fulfilment+came.+Nothing%2C+therefore%2C+can+be+plainer+than+that+the+covenant+made+with+Abraham+was+the+covenant+of+grace%2C+i.e.+the+promise+of+redemption+through+faith+in+the+Messiah.+This%2C+however%2C+is+not+a+doctrine+which+rests+on+such+general+allusions+or+declarations+merely%2C+it+is+taught+in+the+most+explicit+terms+by+the+apostles.+The+design+of+the+epistle+to+the+Galatians+was+to+convince+them+of+the+folly+of+apostatizing+to+Judaism.+To+do+this+the+apostle+raises+them+above+the+Mosaic+period%2C+and+sets+them+back+into+communion+with+the+great+Abrahamic+covenant%2C+to+which+the+law+of+Moses+was+not+only+posterior+but+subordinate.+The+special+purpose+of+the+third+chapter+of+that+epistle+is+to+prove+that+justification+is+by+faith%2C+and+not+by+the+law.+His+first+argument+is+from+the+fact+that+the+Holy+Ghost%2C+in+his+manifold+miraculous+and+sanctifying+influences%2C+had+been+given+in+confirmation+of+the+doctrine+of+justification+by+faith.+His+second+argument+is+from+the+case+of+Abraham.+He+was+justified+by+faith%2C+and+therefore+those+who+share+his+inheritance%2C+i.e.+who+inherit+the+blessing+of+redemption+promised+him%2C+are+believers.+Know+therefore%2C+he+says%2C+that+believers+are+the+sons+%28i.e.+heirs%29+of+Abraham.+The+third+argument+is+from+the+impossibility+of+rendering+the+perfect+obedience+which+the+law+demands.+The+fourth%2C+from+the+explicit+declaration+of+the+Scriptures%2C+that+those+who+are+just+by+faith+shall+live.+The+fifth%2C+from+the+fact+that+Christ+has+redeemed+us+from+the+curse+of+the+law+in+order+that+the+blessing+of+Abraham%2C+%28i.e.+the+blessing+promised+to+Abraham%2C%29+might+come+upon+the+gentiles.+The+only+blessing%2C+however%2C+promised+to+Abraham%2C+which+comes+upon+the+gentiles%2C+is+redemption.+And+finally%2C+Paul+argues+from+the+nature+of+the+covenant+made+with+Abraham.+He+reminds+his+readers+that+even+a+human+covenant+cannot%2C+when+once+ratified%2C+be+either+annulled+or+altered%2C+much+less+can+a+divine+covenant+be+changed%2C+either+in+its+promises+or+conditions.+In+the+covenant+with+Abraham+in+reference+to+Christ%2C+the+inheritance%2C+%28that+inheritance+in+which+the+gentiles+share%2C%29+was+suspended+upon+faith+in+the+promise.+The+law%2C+therefore%2C+which+was+long+subsequent%2C+could+not+alter+this+covenant%2C+or+make+the+inheritance+to+depend+upon+works.+Here+everything+is+taught%2C+first%2C+the+Abrahamic+covenant+had+reference+to+Christ%3B+second%2C+the+thing+promised+was+that+inheritance+of+which+Christ+is+the+author%2C+and+all+nations+%28not+the+Jews+only%29+the+heirs%3B+third%2C+the+condition+on+which+a+participation+in+this+inheritance+is+suspended%2C+is+faith+and+not+works.%E2%80%9D%0A%0A%E2%80%94+Charles+Hodge%2C+%E2%80%9CReview+of+The+Tecnobaptist%2C+%E2%80%9CReview+of+The+Tecnobaptist%3A+A+Discourse%2C+Wherein+an+Honest+Baptist%2C+by+a+Course+of+Argument+to+Which+No+Honest+Baptist+Can+Object%2C+Is+Convinced+That+Infant+Christians+Are+Proper+Subjects+Of+Baptism+by+R.+B.+Mayes%2C%E2%80%9D+in+The+Book+Reviews+of+Charles+Hodge+%28repr.+Bellingham%2C+WA%3A+Logos+Bible+Software%2C+20&amp;url=https%3A%2F%2F5solasquotes.github.io%2Fquote%2F62298a5a2e.html&amp;via=5Solas" target="_blank" rel="noopener">Share on X</a><a class="perma" href="../quote/62298a5a2e.html">Permalink</a><a class="src" href="https://heidelblog.net/2016/10/hodge-abraham-was-in-a-spiritual-gracious-covenant/" rel="noopener" target="_blank">Read it online · Heidelblog</a></div>

<blockquote><p>yes: Baxter holds that Christ died for all men; but I cannot say that I am quite at one with what some of our friends have written on the subject of the atonement. I do not, for example, entirely agree with what Mr. Haldane says on that subject. I think that the word world, as applied in Scripture to the sacrifice of Christ, has been unnecessarily restricted; the common way of explaining it is that it simply includes Gentiles as well as Jews. [John 3:16] I do not like that explanation, and I think that there is one text that puts that interpretation entirely aside. The text to which I allude is, that “God commandeth all men, everywhere to repent. [Acts 17:30]”</p></blockquote>

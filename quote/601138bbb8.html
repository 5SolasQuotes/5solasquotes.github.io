<main class="wrap"><figure class="quote" id="q-601138bbb8" data-kw="">
<blockquote><p>Referring to the proposition contained in the so-called “Auchterarder Creed” (condemned by the General Assembly in 1717) that subsequently gave rise to the Marrow controversy in the Church of Scotland, the younger Thomas McCrie made the following remarks:

The Presbytery of Auchterarder had refused Mr William Craig, a preacher, an extract of his licence, because, on being interrogated, he refused to subscribe the following article: — “I believe that it is not sound and orthodox to teach that we must forsake sin in order to our coming to Christ, and instating us in covenant with God.”

The article was no doubt unhappily worded. Every sinner ought surely to be taught to forsake sin, and no sinner can come to Christ but in the way of forsaking it. But the meaning of the good men of Auchterarder Presbytery was very apparent; they meant to guard against that legal strain of preaching which insists on repentance as an indispensable condition to qualify the sinner for coming to Christ. The real truth is beyond all contravention.

Repentance, which is first in the call of the gospel, is last in the obedience of the sinner; and though God begins by inviting ” the wicked to forsake his way, and the unrighteous man his thoughts,” well does he know that not one of them will move a step till the words that follow ring in his ears, and meet the response of faith, “For he will have mercy, and will abundantly pardon.” To lead the sinner directly to the Saviour, to Him who alone can “give repentance and remission of sins,” must be obviously the ultimate aim of the gospel minister, even when he calls upon him to forsake his sins.

In this lay the germ of the whole controversy that followed. We suspect this Mr William Craig must have been a mere tool in the hands of others, and an incipient legalist withal, who would soon grow up into a full-blown Arminian. Be this as it may, the Assembly, on hearing the case, held up their hands in absolute horror, and ” declared their abhorrence of the foresaid proposition as unsound and most detestable.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/thomas-m-crie-jr.html">Thomas M’Crie Jr.</a></span><span class="wk"><span class="lbl">Work:</span> <cite>“The Marrow Controversy: with Notices of the State of Scottish Theology in the beginning of the last century’, British and Foreign Evangelical Review</cite></span></figcaption>
<div class="meta"><span class="t"><a href="../topics/repentance-and-conversion/nature-of-repentance.html">Nature of Repentance</a></span></div>

<blockquote><p>V. Restoration or restitution, in the case of a lapse, or of prolonged custom in some sin, or of spiritual relapse—which can be called a kind of second regeneration and specifically a renovation (Galatians 4:19; 2 Corinthians 2:7–8). Problem I. Whether in such a case the habits were diminished, or rather only the acts impeded? Eighteen years ago we inclined to the affirmative of the latter, and we wiped away the cavils of the Remonstrant darkener against this our assertion in the Thersites Heautontimorumenos [Thersites the Self-Tormentor]. Nor did any of the most distinguished theologians who attested in letters sent to me that they had read that writing see anything heterodox in it. Problem II. Whether the habit is restored through infusion or apposition of a degree or augmentation, which happens at once and simultaneously through the practice of renewed faith and repentance; or rather gradually and successively through frequent and repeated actions? [No answer is given in the English]</p></blockquote>

</figure><figure class="quote" id="q-09f2b7e88a" data-kw="">
<blockquote><p>A truly broken spirit is also a believing spirit. Faith and repentance are inseparable twins, bred together in one and the same sanctified womb of the converted Soul. Faith first is in us in order of nature at least, but actual Repentance is apt first to appear: as sap and life are first in the root, yet buds leaves and fruit first discover themselves in the branches.

They shall look upon me whom they have pierced: there’s faith, for with what other eye can they behold Christ crucified? And they shall mourn for him, &amp;c. there’s brokenness of spirit resulting from it, Zech. 12. 10.</p></blockquote>

</figure><figure class="quote" id="q-750827620a" data-kw="">
<blockquote><p>As to the term ‘regenerated’ or ‘born again’, I do not call one who is enlightened or breathed upon by any motion of the Holy Spirit, regenerated… I call him unregenerate who has not yet attained to this spiritual quickening, however he may have been affected by some preceding operations of the Holy Spirit. … We concede, then, to the Papists, that before the infusion of regenerating grace, many actions which lead the way to faith and contrition, are both required from men, and by them both can, and are wont [accustomed] to be done, through the sole assistance of awakening grace. Of this kind, are not only joining the Church and hearing the Word, but of thinking of God and divine things, considering their peculiar sins, being alarmed by the sense of them, desiring deliverance from this fear, and many other such like things, which are prerequisite to acts truly spiritual and saving. But we affirm, moreover, that the mind and disposition of the unregenerate is engaged in a natural way only with the aforesaid things; that the will is not elevated to produce an act truly spiritual, until regenerating or quickening efficacy shall have been added, besides, to the awakening and evidencing grace. (See Suarez, Opuscula, De Auxil.Div. Grat., bk. 3, chs. 1-2) Moreover, we grant that this regenerating grace is not infused into men remaining inactive and idling looking for some vague fervors or other; but to minds aroused, and brought under and disposed, in some measure, by the aforesaid actions, through the Word and Spirit of God; nevertheless, we deny that the free-will of an unregenerate man is assisted by these auxiliaries, in such was so to dispose itself that God should be bound to infuse quickening grace into any one from merit of congruity. Lastly, we confess that in the Church of God, where men are excited constantly by the Word and Spirit, this regenerating grace, which alone renders them capable of repenting and believing savingly, is denied to no adult of whom it cannot be truly said, that he willingly resists the Holy Spirit in those actions before-mentioned, and also perversely repulses the quickening operation of the same. (See Spalato, bk. 7, p. 239, &amp; Suarez, Opuscula, p. 222) Yet we deny that any mortal man can be found, who, in repelling the preparatory actions of the Spirit, does not incur, abundantly, this demerit; and, inasmuch as some, repelling God by this intervening, common demerit, are repelled of God and left to themselves; others, notwithstanding equal or greater demerit, are often, and more powerfully assailed by grace, and are at length quickened by the omnipotent operation of the Spirit. The mystery is to be referred to the gracious will of God, pitying or not pitying, and [is] not to be rashly enquired into by any human curiosity.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/john-davenant.html">John Davenant</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Determinations</cite>, Question 9, ‘Free-Will is Not Granted unto the Unregenerate for their Spiritual Good’ in The Determinations, or Resolutions of Certain Theological Questions, Publicly Discussed in the University of Cambridge trans. Josiah Allport (1634; 1846), pp. 265-66 bound at the end of John Davenant, A Treatise on Justification, or the Disputatio de Justitia... trans. Josiah Allport (1631; London, 1846), vol. 2</span></figcaption>

<div class="actions"><button class="copy" data-copy="“As to the term ‘regenerated’ or ‘born again’, I do not call one who is enlightened or breathed upon by any motion of the Holy Spirit, regenerated… I call him unregenerate who has not yet attained to this spiritual quickening, however he may have been affected by some preceding operations of the Holy Spirit. … We concede, then, to the Papists, that before the infusion of regenerating grace, many actions which lead the way to faith and contrition, are both required from men, and by them both can, and are wont [accustomed] to be done, through the sole assistance of awakening grace. Of this kind, are not only joining the Church and hearing the Word, but of thinking of God and divine things, considering their peculiar sins, being alarmed by the sense of them, desiring deliverance from this fear, and many other such like things, which are prerequisite to acts truly spiritual and saving. But we affirm, moreover, that the mind and disposition of the unregenerate is engaged in a natural way only with the aforesaid things; that the will is not elevated to produce an act truly spiritual, until regenerating or quickening efficacy shall have been added, besides, to the awakening and evidencing grace. (See Suarez, Opuscula, De Auxil.Div. Grat., bk. 3, chs. 1-2) Moreover, we grant that this regenerating grace is not infused into men remaining inactive and idling looking for some vague fervors or other; but to minds aroused, and brought under and disposed, in some measure, by the aforesaid actions, through the Word and Spirit of God; nevertheless, we deny that the free-will of an unregenerate man is assisted by these auxiliaries, in such was so to dispose itself that God should be bound to infuse quickening grace into any one from merit of congruity. Lastly, we confess that in the Church of God, where men are excited constantly by the Word and Spirit, this regenerating grace, which alone renders them capable of repenting and believing savingly, is denied to no adult of whom it cannot be truly said, that he willingly resists the Holy Spirit in those actions before-mentioned, and also perversely repulses the quickening operation of the same. (See Spalato, bk. 7, p. 239, &amp; Suarez, Opuscula, p. 222) Yet we deny that any mortal man can be found, who, in repelling the preparatory actions of the Spirit, does not incur, abundantly, this demerit; and, inasmuch as some, repelling God by this intervening, common demerit, are repelled of God and left to themselves; others, notwithstanding equal or greater demerit, are often, and more powerfully assailed by grace, and are at length quickened by the omnipotent operation of the Spirit. The mystery is to be referred to the gracious will of God, pitying or not pitying, and [is] not to be rashly enquired into by any human curiosity.”

— John Davenant, The Determinations, Question 9, ‘Free-Will is Not Granted unto the Unregenerate for their Spiritual Good’ in The Determinations, or Resolutions of Certain Theological Questions, Publicly Discussed in the University of Cambridge trans. Josiah Allport (1634; 1846), pp. 265-66 bound at the end of John Davenant, A Treatise on Justification, or the Disputatio de Justitia... trans. Josiah Allport (1631; London, 1846), vol. 2">Copy</button><a class="share" href="https://x.com/intent/post?text=%E2%80%9CAs+to+the+term+%E2%80%98regenerated%E2%80%99+or+%E2%80%98born+again%E2%80%99%2C+I+do+not+call+one+who+is+enlightened+or+breathed+upon+by+any+motion+of+the+Holy+Spirit%2C+regenerated%E2%80%A6+I+call+him+unregenerate+who+has+not+yet+attained+to+this+spiritual+quickening%2C+however+he+may+have+been+affected+by+some+preceding+operations+of+the+Holy+Spirit.+%E2%80%A6+We+concede%2C+then%2C+to+the+Papists%2C+that+before+the+infusion+of+regenerating+grace%2C+many+actions+which+lead+the+way+to+faith+and+contrition%2C+are+both+required+from+men%2C+and+by+them+both+can%2C+and+are+wont+%5Baccustomed%5D+to+be+done%2C+through+the+sole+assistance+of+awakening+grace.+Of+this+kind%2C+are+not+only+joining+the+Church+and+hearing+the+Word%2C+but+of+thinking+of+God+and+divine+things%2C+considering+their+peculiar+sins%2C+being+alarmed+by+the+sense+of+them%2C+desiring+deliverance+from+this+fear%2C+and+many+other+such+like+things%2C+which+are+prerequisite+to+acts+truly+spiritual+and+saving.+But+we+affirm%2C+moreover%2C+that+the+mind+and+disposition+of+the+unregenerate+is+engaged+in+a+natural+way+only+with+the+aforesaid+things%3B+that+the+will+is+not+elevated+to+produce+an+act+truly+spiritual%2C+until+regenerating+or+quickening+efficacy+shall+have+been+added%2C+besides%2C+to+the+awakening+and+evidencing+grace.+%28See+Suarez%2C+Opuscula%2C+De+Auxil.Div.+Grat.%2C+bk.+3%2C+chs.+1-2%29+Moreover%2C+we+grant+that+this+regenerating+grace+is+not+infused+into+men+remaining+inactive+and+idling+looking+for+some+vague+fervors+or+other%3B+but+to+minds+aroused%2C+and+brought+under+and+disposed%2C+in+some+measure%2C+by+the+aforesaid+actions%2C+through+the+Word+and+Spirit+of+God%3B+nevertheless%2C+we+deny+that+the+free-will+of+an+unregenerate+man+is+assisted+by+these+auxiliaries%2C+in+such+was+so+to+dispose+itself+that+God+should+be+bound+to+infuse+quickening+grace+into+any+one+from+merit+of+congruity.+Lastly%2C+we+confess+that+in+the+Church+of+God%2C+where+men+are+excited+constantly+by+the+Word+and+Spirit%2C+this+regenerating+grace%2C+which+alone+renders+them+capable+of+repenting+and+believing+savingly%2C+is+denied+to+no+adult+of+whom+it+cannot+be+truly+said%2C+that+he+willingly+resists+the+Holy+Spirit+in+those+actions+before-mentioned%2C+and+also+perversely+repulses+the+quickening+operation+of+the+same.+%28See+Spalato%2C+bk.+7%2C+p.+239%2C+%26+Suarez%2C+Opuscula%2C+p.+222%29+Yet+we+deny+that+any+mortal+man+can+be+found%2C+who%2C+in+repelling+the+preparatory+actions+of+the+Spirit%2C+does+not+incur%2C+abundantly%2C+this+demerit%3B+and%2C+inasmuch+as+some%2C+repelling+God+by+this+intervening%2C+common+demerit%2C+are+repelled+of+God+and+left+to+themselves%3B+others%2C+notwithstanding+equal+or+greater+demerit%2C+are+often%2C+and+more+powerfully+assailed+by+grace%2C+and+are+at+length+quickened+by+the+omnipotent+operation+of+the+Spirit.+The+mystery+is+to+be+referred+to+the+gracious+will+of+God%2C+pitying+or+not+pitying%2C+and+%5Bis%5D+not+to+be+rashly+enquired+into+by+any+human+curiosity.%E2%80%9D%0A%0A%E2%80%94+John+Davenant%2C+The+Determinations%2C+Question+9%2C+%E2%80%98Free-Will+is+Not+Granted+unto+the+Unregenerate+for+their+Spiritual+Good%E2%80%99+in+The+Determinations%2C+or+Resolutions+of+Certain+Theological+Questions%2C+Publicly+Discussed+in+the+University+of+Cambridge+trans.+Josiah+Allport+%281634%3B+1846%29%2C+pp.+265-66+bound+at+the+end+of+John+Davenant%2C+A+Treatise+on+Justification%2C+or+the+Disputatio+de+Justitia...+trans.+Josiah+Allport+%281631%3B+London%2C+1846%29%2C+vol.+2&amp;url=https%3A%2F%2F5solasquotes.github.io%2Fquote%2F750827620a.html&amp;via=5Solas" target="_blank" rel="noopener">Share on X</a><a class="perma" href="../quote/750827620a.html">Permalink</a><a class="src" href="https://reformedbooksonline.com/on-preparation-unto-salvation/#:~:text=As%20to%20the%20term%20%E2%80%98regenerated%E2%80%99%20or,enquired%20into%20by%20any%20human%20curiosity&amp;text=As%20to%20the%20term%20%E2%80%98regenerated%E2%80%99%20or%20%E2%80%98born%20again&amp;text=be%20rashly%20enquired%20into%20by%20any%20human%20curiosity" rel="noopener" target="_blank">Read it online · Reformed Books Online</a></div>
</figure><figure class="quote" id="q-4c22411c3f" data-kw="">
<blockquote><p>Not to trust in repentance, but after all thy humiliations still to depend only upon Christ. Though Christ died, and was crucified, yet he did not lose his strength and efficacy. This was represented in that passage of God’s providence, That a bone of his was a broken; Rely therefore upon Christ wounded for sin, not upon thy own heart that is wounded, use this, but trust only in Christ.

Dependence upon Evangelical graces doth evacuate Christ, as well as confidence in the Law. A man may not only preach the Law, and the duties thereof to the prejudice of Christ’s glory; but also the duties and graces of the Gospel. If a man relieth upon his repentance and believing, he maketh Justification and Salvation to be of works, though it be of faith; for he makes his faith a work, and gives that glory which belongs to Christ, to his own repentance.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/anthony-burgess.html">Anthony Burgess</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The true doctrine of justification asserted and vindicated, from the errors of Papists, Arminians, Socinians, and more especially Antinomians in XXX lectures preached at Lawrence-Jury, London</cite>, (2nd edn, London: Tho. Underhill, 1651), p. 164.</span></figcaption>

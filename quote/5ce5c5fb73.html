<main class="wrap"><figure class="quote" id="q-5ce5c5fb73" data-kw="">
<blockquote><p>True philosophy, although it also differs very much from the doctrine of the church, yet, it does not array itself against it nor is it a wicked fabrication and device of Satan, as is true of the false doctrines of the sects, but it contains truth and is, as it were, a certain ray of the wisdom of God, impressed upon the mind of man in his creation. It is a doctrine that has respect to God and his creatures and many other things that are good and profitable to mankind and has been drawn out from the light of nature and from principles, in themselves clear and evident, and reduced to a system by wise and earnest men. It follows, therefore, that it is not only lawful but also profitable for Christians to devote themselves to the study of philosophy.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/zacharias-ursinus.html">Zacharias Ursinus</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Corpus Doctrinae, Prolegomena III.4</cite></span></figcaption>

</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-47d596d2bb" data-kw="">
<blockquote><p>Medieval theology received from the church fathers a great body of highly detailed doctrine, but virtually nothing that could be called a system [of] theology and, certainly, no theological prolegomena. The received body of patristic teaching was clarified and systematized… to the point that, toward the close of the twelfth century… [they] were able to draw doctrine together into collections of theological statements and definitions, the sententiae.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/richard-muller.html">Richard Muller</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Post-Reformation Reformed Dogmatics</cite>, Ch. 2, sections 1-2, pp. 85-96 of Post-Reformation Reformed Dogmatics, vol. 1, 2nd ed. (Baker, 2003), p. 85</span></figcaption>

</figure><figure class="quote" id="q-24896b3886" data-kw="">
<blockquote><p>The controversy over Aristotelianism hardly ended with Aquinas’s work, much less with his death. In 1270, while Aquinas was still alive, Stephen Tempier, the bishop of Paris, had condemned several propositions associated with Averroism, though these did not include any defended by Aquinas. But after Aquinas’s death, in 1277, Tempier went on to condemn 219 propositions, some of which were clearly to be found in Aquinas. This led Albert the Great to come to Paris to defend his former student, and other Dominicans also threw themselves into the task of upholding the doctrine of their fellow friar. Indeed, the study of Aquinas was to become mandatory within the order. This Dominican defense and consolidation of Aquinas’s teaching beginning just after his death is sometimes taken by historians to constitute the beginning of the first of three periods in the history of Thomism. That it was successful is evidenced by the facts that Aquinas was declared a saint by Pope John XXII in 1323, and that two years later, in 1325, Tempier’s condemnations of 1277 were revoked by his successor. Just as Dominicans had generally defended Aquinas, members of the Franciscan order had been among his fiercest critics. The rivalry between the two orders would only become more bitter as a result of the influence of the Franciscan thinkers John Duns Scotus (c. 1266-1308) and William of Ockham (c. 1287-1347). Scotus and Ockham tended toward voluntarism, which emphasizes God’s will over his intellect and thus makes his actions more impenetrable to our rational understanding than they are on Aquinas’s account. Ockham is famously associated with nominalism, which denies the existence of universals. From the Thomistic point of view, these doctrines threaten to undermine the intelligibility of the world and the rational foundations of ethics and of our knowledge of God. Aquinas’s positions were ably defended against them by the likes of John Capreolus (1380-1444), who became known as princeps Thomistarum or ‘foremost Thomist.’ A second period in the history of Thomism is sometimes dated roughly from the period of the Protestant Reformation and the Council of Trent (1545-63)…</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/edward-feser.html">Edward Feser</a></span><span class="wk"><span class="lbl">Work:</span> <cite>‘The Thomistic tradition, Part I’</cite>, (2009)</span></figcaption>

</figure><figure class="quote" id="q-2c44db3fe2" data-kw="">
<blockquote><p>And this distinction [between actuality and potentiality] is metaphysical, not scientific (in the modern sense of “scientific’”). That is to say, it is a description of reality that is more general and basic than any scientific theory, resting as it does on facts (about change) that science itself takes for granted. Hence it is valid whatever the empirical scientific facts turn out to be; and (to repeat what was said earlier) while that doesn’t mean that it cannot be subjected to rational evaluation or criticism, such criticism can only come from some alternative metaphysical theory, not from empirical science… Aristotelian metaphysical ideas are, as I keep saying and as will be established by the end of the next chapter, unavoidable, whether the early modern philosophers thought so or not… the distinction I am making, between metaphysical ideas and scientific ones, is just an obvious one to make. As noted before, empirical science must take many things for granted, such as the existence of patterns of cause and effect. Thus, while it might be able to establish whether some particular causal relationship exists, it cannot possibly establish whether causation as such is real or not, given that its method presupposes its existence. Nor, at the most general level and for the same reasons, can it tell us what causation per se is or what kinds of causation exist. And so on for notions like actuality, potentiality, substance, attribute, form, and so on. Empirical science of its very nature cannot give us the full story about these matters; but metaphysics just is the rational investigation of them. Hence metaphysics is obviously different from empirical science.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/edward-feser.html">Edward Feser</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Last Superstition: a Refutation of the New Atheism</cite>, (St. Augustine’s Press, 2008), ch. 5, pp. 172-73</span></figcaption>

<blockquote><p>…focuses on the relationship of theology and philosophy as formulated in the thought of three key Dutch Reformed theologians… All three were at the forefront of the philosophical debates that swirled in the Dutch Republic in the seventeenth and eighteenth centuries, especially instigated by the arrival of Renee Descartes (1596–1650) in the Netherlands in 1628… By studying these three theologians, Goudriaan “seeks to understand better how Dutch Reformed theology integrated and responded to philosophical views in the period from 1625 through 1750. Voetius, professor of theology at the University of Utrecht, was initially the premier defender against the Cartesian encroachment upon the Dutch Reformed Church that sought to undermine both her theology and piety. This mantle would be taken up by his successor at the university, Petrus van Mastricht. As might be expected, Goudriaan demonstrates that Voetius and Mastricht were in essential agreement with one another in their theology and polemic against Cartesianism as they engaged it from distinctly Reformed premises and commitments. Goudriaan deals successively with specific loci where the relationship between theology and philosophy was acutely tried and tested, including: reason and revelation; creation and the physical world; the providential rule of God over the world; anthropological issues of the relationship between the soul and the body; and divine and natural law. He notes that both Voetius and Mastricht had aligned themselves with the older Aristotelian philosophy against the newer Enlightenment philosophy, yet the debate was not waged over whose philosophical system was correct. This in itself would have been a losing concession, for it was precisely their aim that Reformed theology not be corrupted by alien philosophical concepts or categories that ultimately undermined Scriptural authority and teaching. Philosophy was instead viewed by them as an instrument or servant of the most basic Reformed principle, namely, the authority of Scripture as their principium cognoscendi. For them Scripture was not subordinated to philosophy, but philosophy to Scripture. This starting point alone accounted for the full-orbed nature of creation with its rich diversity, including spirits and bodies, heaven and earth, which Cartesian dualism could not account for or bring into any real, dynamic relation. Because of this common commitment to the Reformed principle of Scripture’s authority, Goudriaan observes, “the theological development from Voetius to Driessen supports the broader claim that biblical Christianity outlives the philosophical and conceptual apparatus with whose help it is explained.” To put it another way, philosophy was not the indispensable lord of theology, but its disposable handmaiden—it would, therefore, continue even when philosophies changed or failed.” – Daniel Ragusa Ariew, Roger – Descartes Among the Scholastics in History of Science &amp; Medicine Library, vol. 20 Pre (Brill, 2011) Schlebusch, J.A. – Cartesianism &amp; Reformed Scholastic Theology: A Comparative Study of the Controversy a Master’s thesis (Univ. of the Free State, South Africa, 2013) 160 pp. Includes a translation of two chapters of Christopher Wittich’s Two Dissertations in ch. 3, and of two chapters of Peter van Mastricht’s Vindication of the Truth, which reply to Wittich, in ch. 4. . . Cartesianism in Scotland in the Post-Reformation Articles Raffe, Alasdair – ‘Intellectual Change Before the Enlightenment: Scotland, the Netherlands &amp; the Reception of Cartesian Thought, 1650-1700’ The Scottish Historical Review, vol. 94; no. 238, pt. 1 (April 2015), pp. 24-47 Gellera, Giovanni ‘Descartes in Scotland &amp; Pre-Enlightenment Scottish Philosophy’ ‘The Scottish Faculties of Arts &amp; Cartesianism (1650-1700)’ History of Universities XXIX (2), pp. 166-187 ‘English Philosophers &amp; Scottish Academic Philosophy (1660–1700)’ (2017) ‘Robertson’s Philosophical Theses (1596): between Late Renaissance &amp; Early Modern Scholasticism’ eds. Alexander Broadie &amp; J.S. Reid, Philosophical Discourse in Seventeenth-Century Scotland: Key Texts (Scottish History Society) ‘The Philosophy of Robert Forbes: A Scottish Scholastic Response to Cartesianism’ Journal of Scottish Philosophy 11(2) (Sept., 2013), pp. 191-211 Abstract: “In the second half of the seventeenth century, philosophy teaching in the Scottish universities gradually moved from scholasticism to Cartesianism. Robert Forbes, regent at Marischal College and King’s College, Aberdeen, was a strenuous opponent of Descartes. The analysis of the philosophy of Forbes and of his teacher Patrick Gordon sheds light on the relationship between Scottish Reformed scholasticism and the reception of Descartes in Scotland.</p></blockquote>

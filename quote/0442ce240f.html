<main class="wrap"><figure class="quote" id="q-0442ce240f" data-kw="">
<blockquote><p>Our faithful Lord is our God, who hath fully, simply, and absolutely set down in his word his true religion and lawful kind of worship, which he hath taught all men to keep alone and for evermore: let all men therefore cleave fast unto it, and let them die in defence thereof, that mean to live eternally. They are punished from above, whosoever do add to, or take away anything from, the religion and kind of worship first ordained and appointed of God. Mark this, ye great men and princes of authority. For the keeping or not keeping of true religion is the root from whence abundant fruit of felicity, or else utter unhappiness, doth spring and bud out.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/heinrich-bullinger.html">Heinrich Bullinger</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Fifty godly and learned sermons divided into the five decades containing the chief and principal points of Christian religion</cite>, ed. Thomas Harding (1849-52 Parker edn; 4 vols, Grand Rapids, 2004), i, 337.</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/worship.html">Worship</a></span></div>

<blockquote><p>We have also the holy scriptures which declare unto us the wonderful works of God, by which things we may be lead to the knowledge of God without painted or carved images. Now peradventure some will say that Christ has a body, and likewise have saints, and therefore of them we may have images although of God there can be made no image. And further they wil say that the cause why images were forbid was peril of idolatry, and worshipping of them. So that where there is no such peril, we may have images. Yet as I will not utterly deny but they may be had, so I think it more convenient for Christ’s religion that they should be taken out of Christian men’s churches than that they should be placed in the temple [church building] of God. And of this my opinion I will show you certain good grounds, to the intent that whan you be demanded why we English men have no images in our churches, you may be able to make thereunto a reasonable answer, and that also in time to come you may declare to your children what abuses have crept into the church by the occasion of images…</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/thomas-cranmer.html">Thomas Cranmer</a></span><span class="wk"><span class="lbl">Work:</span> <cite>A Short Instruction into Christian Religion</cite>, (London: 1548), A Short Instruction Concerning the Ten Commandments, First Sermon, no page numbers</span></figcaption>

</figure><figure class="quote" id="q-4e1d6a9df0" data-kw="">
<blockquote><p>1 Cor. 11:16, ‘We have no such custom, nor the churches of Christ’… the apostle is there speaking of things wherein custom is indeed the rule, as having the head bare, or covered, wearing long or short hair: it does not thence follow (if the apostle did there make it the rule) that it must also be the rule in other things… he [the episcopalian opponent] pretends to convince us further, that Augustine distinguished the custom of the universal Church from the custom of particular places, and he makes the one mutable, the other not so. He needed not be at pains to convince us of that distinction. I know nobody that doubts of it, nor that reject the customs that are truly universal, unless they clash with Scripture.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/gilbert-rule.html">Gilbert Rule</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Good Old Way Defended</cite>, … wherein the Divine Right of the Government of the Church by Presbyters acting in Parity, is Asserted… (Edinburgh, 1697) Rule was a leading father of the Revolution Church of Scotland who wrote numerous works at that time for the divine right of presbyterianism. | section 6, p. 87</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/worship/head-coverings-in-worship.html">Head Coverings in Worship</a></span></div>

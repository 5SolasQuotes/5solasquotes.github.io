<main class="wrap"><figure class="quote" id="q-37a473f396" data-kw="">
<blockquote><p>For what purpose, then, does the Reformed Presbyterian Church exist? And what is the advantage of having a Theological Hall in connection with our Church? If we wish only to be Christian in our profession and position as a Church, why not join, or allow ourselves to be absorbed by, some of the Christian Churches around us? Our reply is, We occupy a separate position as a church because we desire, we trust sincerely, to realise a fully Christian ideal of universal subjection to Christ our King on our part, and to extend the knowledge and appreciation of that ideal among the churches around us. We could not join any one of these churches without doing that which would be, from our point of view, equivalent to disobeying some of the Commandments of Christ, or opposing or disregarding some part of His authoritative revelation, and so coming short of the Christian ideal. Not that we charge any of the churches with deliberate or conscious disobedience; but that we find, in point of fact, that some of the most important principles of Christ’s truth – notably the principle of His rightful dominion as Mediator over the Church and over the nation – are allowed to fall into abeyance or into oblivion, at least in all the larger Evangelical Churches.

Passing, in the meantime, the principle of Christ’s absolute authority in His Church – a principle which is being constantly violated by the introduction of audacious inventions of man into Divine worship, and by the pushing of Christ’s own authoritative institutions into a corner – and looking at the principle of His Headship over the nation, we may conclude, without any tedious process of reasoning, that the church which sees Christ’s law set aside by the nation, and His authority rejected, and His Kingly rights trampled in the mire with disdain by every petty enemy, the church that admits and even argues for the principle that enemies of Christ have a right to be constituent members in that society in which God has declared that Christ has a right to be the Head, and in which therefore the will of Christ is the supreme and ultimate authority – the church that sees this monstrous wrong done to Christ, and stands by for generations without uttering one word of fearless denunciation, and without doing one single deed the object of which is to bring the nation back to the throne of Christ in dutiful allegiance, has not, in this respect at least, a broad or intelligent or conscientious conception of Christian duty.

We need, therefore, to maintain our denominational position that we may continue to utter a clear and faithful testimony for Christ the King, and to utter it all the more clearly and faithfully as others continue to become more careless about the fearful rebellion of the nation against Him, or to become more impatient of the restraints of our testimony against their criminal neglect. And as our Church must continue to exist, our Theological Hall must exist, not only that the doctrines of Evangelical Christianity generally may be taught and embraced, but also that the candidates for the ministry on leaving the Hall may go forth under the solemn and joyful conviction that Christ is “King of kings and Lord of lords,” and that minister is the King’s ambassador to be guided by the King’s will, and to labour for the world-wide acknowledgment of the King’s reign.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/james-dick.html">James Dick</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The authority of Christ over the individual, the church, and the</cite>, nation (Belfast, 1893), pp 4-5.</span></figcaption>

</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-3cc1a9a6a4" data-kw="">
<blockquote><p>In 1837 the American Covenanter Reformed Presbyterian periodical, edited by Moses Roney, published an article by a man called Dr Humphrey on ‘Education in Scotland’. This article helpfully points out that the universal diffusion of education was one of the leading principles of the Scottish Reformation. How sad it is that men who claim to stand in the tradition of the Scottish Reformers would decry this system were it upheld today (this includes those who think public education is inherently wrong and that home-schooling is the only biblical form of education):

The parochial schools of Scotland have been the admiration of enlightened men in all countries, for two hundred and fifty years. Like civil and religious liberty and all the noble institutions of that country, they are the offspring of the Reformation. Before John Knox rolled back the thunders of the Vatican upon the Pope and his Cardinals, and blew that mighty blast which shook down the walls of spiritual Babylon in North Britain, the people were as deeply sunk in ignorance, as they were in the superstition and idolatry of the great anti-christian apostacy. Very few, except the nobility, could read, and almost none could write. But as soon as Scotland had thrown off the Romish yoke, or rather, while she was struggling for life with ‘the man of sin,’ and the faggots were scarcely quenched in the grass market of Edinburgh, the Reformers were busily employed in maturing a plan for the universal diffusion of letters throughout the country. They rightly judged, that to eradicate the errors of Popery, and instil the faith of the gospel into the hearts of the rising generation, the establishment of schools under pious teachers was essential. How anxious they were to see a school-house planted by the side of every kirk, and to make sound learning the hand-maid of pure religion, is strikingly manifest in […] the ‘First Book of Discipline,’ drawn up by Knox and his immortal compeers, and presented to the nobility in 1560 – almost three centuries ago.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/reformed-presbyterian.html">Reformed Presbyterian</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Reformed Presbyterian</cite>, Dec. 1837, p. 304</span></figcaption>

<blockquote><p>All, therefore, to whom the office of teaching was committed, they called presbyters, and in each city these presbyters selected one of their number to whom they gave the special title of bishop, lest, as usually happens, from equality dissension should arise. The bishop, however, was not so superior in honour and dignity as to have dominion over his colleagues, but as it belongs to a president in an assembly to bring matters before them, collect their opinions, take precedence of others in consulting, advising, exhorting, guide the whole procedure by his authority, and execute what is decreed by common consent, a bishop held the same office in a meeting of presbyters. And the ancients themselves confess that this practice was introduced by human arrangement, according to the exigency of the times.</p></blockquote>

</figure><figure class="quote" id="q-898d6eb1b3" data-kw="">
<blockquote><p>I very much question whether the whole history of human improvement can furnish the outline of an educational system, at once so comprehensive, so simple, and so much in advance of the age in which it was drawn up; and certainly, there is nothing which more strikingly shows what a heaven-wide difference there is between the genius of Protestantism and Popery. That men, who had themselves been taught to consider ‘ignorance as the mother of devotion,’ should all at once have such enlargement of views, in regard to education, as soon as the light of reformation dawned upon their minds, and that they should find time to mature so wise a plan, while they were obliged to dispute every inch of ground with the enemy, and while, as yet, the conflict between light and darkness hung in such awful suspense,—is truly wonderful. It would almost seem as if there must have been something supernatural in the illumination which guided them; for they could have derived but little assistance from the most enlightened nations, whether ancient or modern; and to this very day, no material improvement has been made upon their system. If we did not know that our Puritan forefathers brought it along with them to New-England, the similarity is so striking, that no one could doubt the Scottish origin, and the Prussian system of popular education, the most perfect and efficient, probably, which the world ever saw, is manifestly indebted to the same source for all its essential elements.</p></blockquote>

<div class="actions"><button class="copy" data-copy="“I very much question whether the whole history of human improvement can furnish the outline of an educational system, at once so comprehensive, so simple, and so much in advance of the age in which it was drawn up; and certainly, there is nothing which more strikingly shows what a heaven-wide difference there is between the genius of Protestantism and Popery. That men, who had themselves been taught to consider ‘ignorance as the mother of devotion,’ should all at once have such enlargement of views, in regard to education, as soon as the light of reformation dawned upon their minds, and that they should find time to mature so wise a plan, while they were obliged to dispute every inch of ground with the enemy, and while, as yet, the conflict between light and darkness hung in such awful suspense,—is truly wonderful. It would almost seem as if there must have been something supernatural in the illumination which guided them; for they could have derived but little assistance from the most enlightened nations, whether ancient or modern; and to this very day, no material improvement has been made upon their system. If we did not know that our Puritan forefathers brought it along with them to New-England, the similarity is so striking, that no one could doubt the Scottish origin, and the Prussian system of popular education, the most perfect and efficient, probably, which the world ever saw, is manifestly indebted to the same source for all its essential elements.”

<main class="wrap"><figure class="quote" id="q-4665637326" data-kw="">
<blockquote><p>The standard by which saints and sinners are judged will evidently be the revealed will of God. This is not the same for all. Some have been privileged above others, and this naturally adds to their responsibility, Matt 11:21–24; Rom. 2:12–16. This does not mean that there will be different conditions of salvation for different classes of people. For all those who appear in judgment entrance into, or exclusion from heaven, will depend on the question, whether they are clothed with the righteousness of Jesus Christ. But there will be different degrees, both of the bliss of heaven and of the punishment of hell. And these degrees will be determined by what is done in the flesh, Matt. 11:22, 24; Luke 12:47,48; 20:47; Dan. 12:3; II Cor. 9:6. The Gentiles will be judged by the law of nature, inscribed in their hearts, the Israelites of the old dispensation by the Old Testament revelation and by that only, and those who have enjoyed, besides the light of nature and the revelation of the Old Testament, the light of the gospel, will be judged according to the greater light which they have received. God will give to every man his due.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/louis-berkhof.html">Louis Berkhof</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Systematic Theology</cite>, (originally Reformed Dogmatics), 733–34.</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/judgment-and-the-final-state.html">Judgment and the Final State</a></span></div>

</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-0579630e02" data-kw="conflagration renewal">
<blockquote><p>What will the destruction of the earth be like? Will it be annihilated by the final conflagration or will it be restored and renewed? It is not inquired whether it will occur by a conflagration of fire. For the Scriptures so expressly declare this that no Christian can or ought to doubt it: “The heavens and the earth are reserved unto fire” (2 Pet. 3:7); “The heavens shall pass away with a great noise, and the elements shall melt with fervent heat.”</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/francis-turretin.html">Francis Turretin</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Institutes of Elenctic Theology</cite>, 20.5.1–2</span></figcaption>

</figure><figure class="quote" id="q-971cc0d92f" data-kw="">
<blockquote><p>Does it belong to the perfection of the soul that we comprehend God’s essence? Response: certainly this does not appear to be the case, and the reason is that what is incomprehensible cannot be comprehended. But, they say, even if what is infinite cannot be comprehended distinctly, nevertheless, it can be comprehended confusedly, and they called this ‘comprehension.’ Thus, that famous phrase: ‘All God is known, but not totally.’ [totum sed non totaliter; this phrase summarizes Thomas, Summa, pt. 1, q. 12, art. 7, replies to objections 2-3] And they bring up the example of an eye, which contemplates the whole man; namely, confusedly, but not totally. Response: There is no comparison between things which come within reach of eyesight and the divine nature… the divine nature is most simple; certainly the soul cannot confusedly comprehend those things which are most simple, let alone the senses, unless it comprehends them in another way than by essence; that is, by laying hold of their very essence. And thus, if God is known by us by essence, it is necessary for him to be known by us distinctly; and if he is known by us distinctly, he is indeed comprehended, which those who state that God will be seen by essence in the life to come do not wish to concede. the axiom common in the schools, “All that is received is received according to the manner of the recipient.” Now, if God’s essence will be seen, it will be seen in a finite way, for the recipient is finite: and thus, the infinite will be seen by essence in a finite way, which implies a contradiction. For finite knowledge is an image of a thing in the mind, and thus, if knowledge is finite, but the thing comprehended is infinite, on the other hand, it follows that the thing is known and not known.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/johannes-maccovius.html">Johannes Maccovius</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Other citations (work not named)</cite>, in Johannes Hoornbeek, ch. 13, §§19-20 of Institutes of Theology, tr. Charles Johnson</span></figcaption>

<blockquote><p>4. In the first operation of this light of glory, believers shall so behold the glory of Christ, and the glory of God in Him, as that therewith and thereby they shall be immediately and universally changed into his likeness. They shall be as He is, when they shall see Him as He is. There is no growth in glory, as to parts— there may be as to degrees. Additions may be outwardly made unto what is at first received as by the resurrection of the body; but the internal light of glory and its transforming efficacy is capable of no degrees, though new revelations may be made unto it unto eternity. For the infinite fountain of life and light, and goodness, can never be fathomed, much less exhausted. And what God spake on the entrance of sin, by the way of contempt and reproach, ‘Behold, the man is become like one of us!’ upbraiding him with what he had foolishly designed—on the accomplishment of the work of his grace, He says in love and infinite goodness, “Man is become like one of us, in the perfect restoration of our image in him.’ This is the first effect of the light of glory. … 4. …For, as it is expressly assigned thereunto in the Scripture, so whereas it contains the perfect operation of our minds and souls in a perfect state, on the most perfect object, it is the only mea.ns of our blessedness. And this is the true cause whence there neither is nor can be any satiety or weariness in heaven, in the eternal contemplation of the same glory. For not only the object of our sight is absolutely infinite, which can never be searched unto the bottom, yea, is perpetually new unto a finite understanding; but our subjective blessedness consisting in continual fresh communications from the infinite fulness of the divine nature, derived unto us through vision, is always new, and always will be so to eternity. Herein shall all the saints of God drink of the rivers of pleasure that are at his right hand, be satisfied with his likeness, and refresh themselves in the eternal springs of life, light, and joy for evermore.</p></blockquote>

keness, and refresh themselves in the eternal springs of life, light, and joy for evermore.”

— John Owen, Meditations &amp; Discourses on the Glory of Christ, ch. 14, ‘Other Differences…’ in Works, vol. 1, pp. 412-14">Copy</button><a class="share" href="https://x.com/intent/post?text=%E2%80%9C4.+In+the+first+operation+of+this+light+of+glory%2C+believers+shall+so+behold+the+glory+of+Christ%2C+and+the+glory+of+God+in+Him%2C+as+that+therewith+and+thereby+they+shall+be+immediately+and+universally+changed+into+his+likeness.+They+shall+be+as+He+is%2C+when+they+shall+see+Him+as+He+is.+There+is+no+growth+in+glory%2C+as+to+parts%E2%80%94+there+may+be+as+to+degrees.+Additions+may+be+outwardly+made+unto+what+is+at+first+received+as+by+the+resurrection+of+the+body%3B+but+the+internal+light+of+glory+and+its+transforming+efficacy+is+capable+of+no+degrees%2C+though+new+revelations+may+be+made+unto+it+unto+eternity.+For+the+infinite+fountain+of+life+and+light%2C+and+goodness%2C+can+never+be+fathomed%2C+much+less+exhausted.+And+what+God+spake+on+the+entrance+of+sin%2C+by+the+way+of+contempt+and+reproach%2C+%E2%80%98Behold%2C+the+man+is+become+like+one+of+us%21%E2%80%99+upbraiding+him+with+what+he+had+foolishly+designed%E2%80%94on+the+accomplishment+of+the+work+of+his+grace%2C+He+says+in+love+and+infinite+goodness%2C+%E2%80%9CMan+is+become+like+one+of+us%2C+in+the+perfect+restoration+of+our+image+in+him.%E2%80%99+This+is+the+first+effect+of+the+light+of+glory.+%E2%80%A6+4.+%E2%80%A6For%2C+as+it+is+expressly+assigned+thereunto+in+the+Scripture%2C+so+whereas+it+contains+the+perfect+operation+of+our+minds+and+souls+in+a+perfect+state%2C+on+the+most+perfect+object%2C+it+is+the+only+mea.ns+of+our+blessedness.+And+this+is+the+true+cause+whence+there+neither+is+nor+can+be+any+satiety+or+weariness+in+heaven%2C+in+the+eternal+contemplation+of+the+same+glory.+For+not+only+the+object+of+our+sight+is+absolutely+infinite%2C+which+can+never+be+searched+unto+the+bottom%2C+yea%2C+is+perpetually+new+unto+a+finite+understanding%3B+but+our+subjective+blessedness+consisting+in+continual+fresh+communications+from+the+infinite+fulness+of+the+divine+nature%2C+derived+unto+us+through+vision%2C+is+always+new%2C+and+always+will+be+so+to+eternity.+Herein+shall+all+the+saints+of+God+drink+of+the+rivers+of+pleasure+that+are+at+his+right+hand%2C+be+satisfied+with+his+likeness%2C+and+refresh+themselves+in+the+eternal+springs+of+life%2C+light%2C+and+joy+for+evermore.%E2%80%9D%0A%0A%E2%80%94+John+Owen%2C+Meditations+%26+Discourses+on+the+Glory+of+Christ%2C+ch.+14%2C+%E2%80%98Other+Differences%E2%80%A6%E2%80%99+in+Works%2C+vol.+1%2C+pp.+412-14&amp;url=https%3A%2F%2F5solasquotes.github.io%2Fquote%2F1f924395fc.html&amp;via=5Solas" target="_blank" rel="noopener">Share on X</a><a class="perma" href="../quote/1f924395fc.html">Permalink</a><a class="src" href="https://reformedbooksonline.com/on-the-beatific-vision/#:~:text=4.%20In%20the%20first%20operation%20of,life%2C%20light%2C%20and%20joy%20for%20evermore&amp;text=4.%20In%20the%20first%20operation%20of%20this%20light&amp;text=springs%20of%20life%2C%20light%2C%20and%20joy%20for%20evermore" rel="noopener" target="_blank">Read it online · Reformed Books Online</a></div>

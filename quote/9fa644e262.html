<main class="wrap"><figure class="quote" id="q-9fa644e262" data-kw="">
<blockquote><p>…a minister of the gospel may often preach the law to his hearers and yet not deserve to be called a legal preacher. He cannot preach the gospel faithfully and successfully unless he preaches the law in subservience to it. If he is a faithful and able minister of the New Testament, he will preach the law as a covenant of works and will press it on the consciences of secure sinners and self-righteous formalists. He will denounce the tremendous curse of it on those who continue under it and who rely securely on their own works for a title to eternal life in order to tear away every pillow of carnal security on which they repose themselves and to show them the vanity of every lying refuge. In proportion also as he is faithful, he will preach the law as a rule of life to them who believe. He will press on them the spiritual performance of every duty and a holy abhorrence of every sin. He will exhort them to perform all their duties from evangelical principles in a holy manner and to holy ends. Now if he preach the law in that manner, no man will be disposed to fix the odious character of a legal preacher on him but one who either is grossly ignorant or is an enemy both of the law and of the gospel.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/john-colquhoun.html">John Colquhoun</a></span><span class="wk"><span class="lbl">Work:</span> <cite>A Treatise on the Law and Gospel</cite>, (Grand Rapids: Reformation Heritage Books), 121–22.</span></figcaption>

</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-fa11f2ee2f" data-kw="">
<blockquote><p>Christ has given to all his members such gifts as are suitable to their places… And the place of a master of a family requires the gift of catechizing and instructing the family? And they are as truly obliged to use their gifts… And yet who doubts but it is lawful for parents to teach and catechize their children by such books and forms of catechisms as are composed by the gifts of abler men?</p></blockquote>

</figure><figure class="quote" id="q-9be10c6f93" data-kw="">
<blockquote><p>In matter of hearing, it is not so hard to discern who are to be accounted to speak without God’s commission: because ordinarily, such have either no warrantable call at all (no not in the outward form; and so cannot be accounted but to run unsent) or, by palpable defection from the truth, and commission given them in that call, they have forfeited their commission, and so no more are to be accounted ambassadors to Christ, or watchmen of His flock, than a watchman of the city, is to be accounted an observer thereof, when he has publicly made defection to the enemy, and taken on with him. For we are here to rest in the external call, and not to dispute that which is inward: because it passes our reach; and Christ has furnished his House with external ordinances, for the warranting of his people’s peace in reference to these things: there is therefore great difference to be placed here between one that is called, and one whom we think not worthy to be called: it’s the first that warrants hearing…</p></blockquote>

nts%20hearing" rel="noopener" target="_blank">Read it online · Reformed Books Online</a></div>
</figure><figure class="quote" id="q-a4bac88a81" data-kw="">
<blockquote><p>Article 13, Private Worship None may preach the Word with us but pastors and the sons of the prophets, and such of their sort who aim at the holy ministry, and that authority Ecclesiastical must warrant them is clear by our Law and practice, as it was in the Jewish Church, 1 Sam. 10:5; 2 Kings 2:7; 2 Kings 4:1; 1 Kings 20:35. … Our Assembly also commands godly conference at all occasional meetings, or as God’s providence shall dispose, as the Word of God commands, Heb. 3:13; 1 Thess. 5:11,12; Lev. 19:17; Zech. 8:21; Mal. 3:16; Col. 3:16, providing none invade the pastor’s office to preach the word who are not called thereunto by God and his Church, Heb. 5:4,5; Rom. 10:14-15; 1 Cor. 12:28,29.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/samuel-rutherford.html">Samuel Rutherford</a></span><span class="wk"><span class="lbl">Work:</span> <cite>A Peaceable &amp; Temperate Plea for Paul’s Presbytery in Scotland</cite>, … (London, 1642), ch. 20, Whether or not the government of the Church of Scotland can be proved by God’s Word to be lawful?</span></figcaption>

<main class="wrap"><figure class="quote" id="q-4d6b6e7b50" data-kw="">
<blockquote><p>That this covenant between God and us is free and undeserved, and leaneth upon no condition of our worthiness or merits, but standeth by faith alone, hence it may easily appear. For in respect of God he properly maketh the covenant with us, and he sealeth in our hearts by his holy spirit, that same promise of underserved reconciliation offered unto us in the Gospel. Titus 3. ver. 5, 6, 7. 2 Tim. I. ver. 9. Gal. 3. ver. 6. 28, 29. In respect of us this covenant is received only by faith, while that freely and underservedly the holy Ghost is given unto us, who bringeth to pass that both we will and are able to believe the free promise of reconciliation through Christ. Eph. I. Joel 2. Esay. 59.

If you respect the mediator, verily our heavenly father hath received of him the price of reconciliation, and we have satisfied in him: notwithstanding because the mediator is freely given unto us, and imputeth also freely this merit unto us, even by this reason also the covenant is free. And so the covenant is free. And so this whole covenant is merely free, and consisteth in faith alone: the oblation of promise of grace in Christ, and also the giving of Christ himself in respect of God is freely receiving on our part is also free, because it is the work of God in us, whereby he sealeth his promise in our hearts, that being drawn we should work, that is to say, that being made believers by him we might believe. Ephe. 2. ver. 1, 5, 6, 7, 8, 9, 10.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/caspar-olevianus.html">Caspar Olevianus</a></span><span class="wk"><span class="lbl">Work:</span> <cite>An Exposition of the Symbol of the Apostles</cite>, trans. John Field (London: Thomas Man, 1581), pp 54-55.</span></figcaption>

 on X</a><a class="perma" href="../quote/4d6b6e7b50.html">Permalink</a><a class="src" href="https://reformedcovenanter.wordpress.com/2019/04/17/casper-olevianus-on-the-covenant-of-free-grace/" rel="noopener" target="_blank">Read it online · Reformed Covenanter</a></div>
</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-6ff7788dc1" data-kw="">
<blockquote><p>And then further, Let the consideration of this be of comfort to thee (when thou hast committed sin against God, if thou be’st such a one as hath been spoken of) in remembering the Covenant that God hath made with thee, and bless God for the Covenant that he hath made with thee in Christ, and the difference that God hath made between thee and others in this thing; magnify his free grace in the Covenant of grace, for from thence is it that thy spot shall not be a deadly spot; and God will not deal with thee as with the wicked: certainly this is not from the nature of thy sin, for that may be as heinous as the sins of the other, but that that makes the difference is the free-grace of God in Christ.

O blessed be God for the Covenant of grace that hath made the difference. I remember I have read of Luther, he indeed saith when he was a Monk, though he were Conscientious then, yet then whensoever he committed any sin against God, his Conscience did so fly in his face, that he thought he was rejected utterly of God, till God made him know that Covenant of his grace in Christ; and then he thought he heard such a voice speaking to him, Oh Martin, do not despair, for thou shalt, as long as thou livest here in the flesh, sin against God; only do thou lustily oppose thy sin, and resist thy sin, and then know, that thou art not under the Law, but under grace: It is from hence that there is this difference, therefore bless God that ever he reveal’d this Covenant of grace to thy soul.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/jeremiah-burroughs.html">Jeremiah Burroughs</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The difference between the spots of the godly and of the wicked preached by Mr. Jeremiah Burroughs at Cripple Gate</cite>, (London, 1668), pp 107-08.</span></figcaption>

</figure><figure class="quote" id="q-d728e80f6a" data-kw="abraham">
<blockquote><p>The reasons are: First, in general, the Scriptures teach that the covenant of grace (which God contracted with us in the New Testament) is the same with the covenant previously made with Abraham. Hence Zachariah says in his song, “God visited and redeemed his people, as he spake by the mouth of his holy prophets, which have been since the world began: to perform the mercy promised to our fathers, and to remember his holy covenant; the oath which he sware to our father Abraham” (Lk. 1:68, 70, 72, 73). And Peter addressing the Jews concerning the days of Christ (which had been predicted by all the prophets) says, “Ye are the children of the prophets, and of the covenant which God made with our fathers, saying unto Abraham, And in thy seed shall all the kindreds of the earth be blessed” (Acts 3:25). Paul mentions by name the promise of the gospel: “The Scripture, foreseeing that God would justify the heathen through faith, preached before the gospel unto Abraham, saying, In thee shall all nations be blessed” (Gal. 3:8).</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/francis-turretin.html">Francis Turretin</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Institutes of Elenctic Theology</cite>, 12.5.7</span></figcaption>

<main class="wrap"><figure class="quote" id="q-cb64ce6484" data-kw="">
<blockquote><p>Objection: But this case is unlike to that of liturgies. Answer: The Scripture is God’s own Word: A mistranslation makes that to be his Word that is not; which sure is a tenderer matter than in what words we speak our own minds to God. Sure [it is that] a depravation of Scripture is more [of a depravavation] than [that of] a ceremony: Were liturgies such an alteration of God’s own words, you would more plausibly accuse them. One that said, ‘God said this’ or that, which He said not, was worse than one that spake his own words indecently to God. To say, ‘This is God’s Word,’ which is not, is indeed adding to it [Prov. 30:6]; but so it is not to speak words as our own. How much the Septuagint differs from the Hebrew, how many verses it leaves out, how many additions and alterations it makes, is commonly known. Christ’s and the apostles’ use of this was no approbation of its faults, much less their presence in the synagogues when others read Moses and the prophets in them. And the Psalms in the Septuagint translation were part of their liturgy. For man to speak faultily is no wonder: It has a more plausible pretence for separation to say that men corrupt the Word of God. And yet when it is but such an effect of human imperfection, it is no just pretence. But yet a word more: Question 1: Do you think that the Pharisees and scribes had so much of the gift of extemporary prayer that they could, and did use to make long prayers, as if it were by the spirit-extempore? Say so and you will disgrace the doctors’ arguments that lay so much on this manner of praying [by forms]. No doubt but it was forms and liturgies that they used; yet when Christ condemns them for praying in the streets to be seen and using long prayer for a pretence to devour widows’ houses: 2. Did Christ speak one word against them as forms or liturgies? Did He want [lack] zeal or knowledge? 3. Had they not been good in themselves, what cloak could they have made for so great evil? 4. Did Christ or his apostles ever forbear [abstain from] the synagogues for the sake of these long liturgies?</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/richard-baxter.html">Richard Baxter</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Reformation &amp; Conformity</cite>, Catholic Communion Doubly Defended by Dr. Owen’s Vindicator &amp; Richard Baxter… (London: Parkhurst, 1684), section 5, ‘A comparison of the use of a faulty translation of the Scripture and a faulty liturgy’ | Bad Translation &amp; Bad Liturgy</span></figcaption>

<blockquote><p>42nd Question, How Moses was contented with Aaron’s Answer. 1. He did not absolutely approve of his reason, as though he had done it intuita divino, by divine direction, as Cajetan: for Moses was better acquainted with God’s mind than Aaron, and there was a direct commandment, which should not have been omitted. 2. But Moses rather in human commiseration bears with Aaron’s infirmity: 1. because he saw him forced by a kind of necessity… 2. and afflication was not to be added to affliction, Osiander: and Moses found it to be of less fault than he supposed, Calvin: he did it not willingly, but of human frailty and of perplexity through grief, and therefore was to be pitied. 3. And it may be Moses deferred his further admonishing of Aaron till another time because he saw now he was in grief…</p></blockquote>

<blockquote><p>For even if images can be retained [in churches] without offense to God, in which are represented sacred matters and histories, and which are extant throughout holy Scripture, and call to mind for the illiterate the stories of the deeds… Luther in fact, of pious memory, cleansed Churches in those locations by means of the Word of the Lord alone from the beginning, and through this one instrument of the Holy Spirit dragged away all idols from the hearts of his hearers… before he ever removed even the smallest ones from their eyes. For an idol in the world is nothing, as the apostle testifies, 1 Corinthians 8[:4], but instead they reside in the hearts of people… Thus Luther for many years [after the Reformation] wore the monastic hood or habit [clothing]… We experienced the same thing in the Dukedom of Wurttemberg, where in the first year after the light of the Gospel was introduced and lit, and Papal idolatry abrogated, images were removed throughout all the temples before the imagination of their worship was pulled away from the minds of men. This is why it has come about that very many people were so offended by this unseasonable reformation undertaken with a two-edged sword… that neither listened to evangelical assemblies nor approached their sacraments any longer, but rather clung to their Papist idolatry till their final breath, despising the teaching of the Gospel and the true use of the sacraments. This was the fruit of the unseasonable reformation in which everything was destroyed with no regard given to the weak in faith… But there is less danger when pure and genuine doctrine is heard, by which all people are called away from idolatry to the true worship of God in daily meetings, should they be retained, than if they should be abolished rashly and unthoughtfully. Because of this, we think that the magistrate of each place sins less, and takes counsel to the advantage of the salvation of souls far better, if they have endured them longer than if they have unseasonably abrogated them… If in fact they are matters of indifference [adiaphora], as is the consensus between us… Beza: This whole business can best be described as resting on two points, namely, the prudence of pastors and the consideration of circumstances… The custom was observed in certain places that images of this kind were retained for four years after reformation. But I do not want to fight with anyone about these things or reprove the deeds of other people; let us just be on guard against all opportunities for idolatry, as much as possible.</p></blockquote>

— Jacob Andreae, Lutheranism vs. Calvinism: The Classic Debate at the Colloquy of Montbeliard 1586 (Concordia Publishing House, 2017), ch. 4, ‘On the Reformation of Temples, Images &amp; Organs’ Andreae (1528–1590) was a leading Lutheran theologian debating Theodore Beza. | Andreae:, pp. 472-75">Copy</button><a class="share" href="https://x.com/intent/post?text=%E2%80%9CFor+even+if+images+can+be+retained+%5Bin+churches%5D+without+offense+to+God%2C+in+which+are+represented+sacred+matters+and+histories%2C+and+which+are+extant+throughout+holy+Scripture%2C+and+call+to+mind+for+the+illiterate+the+stories+of+the+deeds%E2%80%A6+Luther+in+fact%2C+of+pious+memory%2C+cleansed+Churches+in+those+locations+by+means+of+the+Word+of+the+Lord+alone+from+the+beginning%2C+and+through+this+one+instrument+of+the+Holy+Spirit+dragged+away+all+idols+from+the+hearts+of+his+hearers%E2%80%A6+before+he+ever+removed+even+the+smallest+ones+from+their+eyes.+For+an+idol+in+the+world+is+nothing%2C+as+the+apostle+testifies%2C+1+Corinthians+8%5B%3A4%5D%2C+but+instead+they+reside+in+the+hearts+of+people%E2%80%A6+Thus+Luther+for+many+years+%5Bafter+the+Reformation%5D+wore+the+monastic+hood+or+habit+%5Bclothing%5D%E2%80%A6+We+experienced+the+same+thing+in+the+Dukedom+of+Wurttemberg%2C+where+in+the+first+year+after+the+light+of+the+Gospel+was+introduced+and+lit%2C+and+Papal+idolatry+abrogated%2C+images+were+removed+throughout+all+the+temples+before+the+imagination+of+their+worship+was+pulled+away+from+the+minds+of+men.+This+is+why+it+has+come+about+that+very+many+people+were+so+offended+by+this+unseasonable+reformation+undertaken+with+a+two-edged+sword%E2%80%A6+that+neither+listened+to+evangelical+assemblies+nor+approached+their+sacraments+any+longer%2C+but+rather+clung+to+their+Papist+idolatry+till+their+final+breath%2C+despising+the+teaching+of+the+Gospel+and+the+true+use+of+the+sacraments.+This+was+the+fruit+of+the+unseasonable+reformation+in+which+everything+was+destroyed+with+no+regard+given+to+the+weak+in+faith%E2%80%A6+But+there+is+less+danger+when+pure+and+genuine+doctrine+is+heard%2C+by+which+all+people+are+called+away+from+idolatry+to+the+true+worship+of+God+in+daily+meetings%2C+should+they+be+retained%2C+than+if+they+should+be+abolished+rashly+and+unthoughtfully.+Because+of+this%2C+we+think+that+the+magistrate+of+each+place+sins+less%2C+and+takes+counsel+to+the+advantage+of+the+salvation+of+souls+far+better%2C+if+they+have+endured+them+longer+than+if+they+have+unseasonably+abrogated+them%E2%80%A6+If+in+fact+they+are+matters+of+indifference+%5Badiaphora%5D%2C+as+is+the+consensus+between+us%E2%80%A6+Beza%3A+This+whole+business+can+best+be+described+as+resting+on+two+points%2C+namely%2C+the+prudence+of+pastors+and+the+consideration+of+circumstances%E2%80%A6+The+custom+was+observed+in+certain+places+that+images+of+this+kind+were+retained+for+four+years+after+reformation.+But+I+do+not+want+to+fight+with+anyone+about+these+things+or+reprove+the+deeds+of+other+people%3B+let+us+just+be+on+guard+against+all+opportunities+for+idolatry%2C+as+much+as+possible.%E2%80%9D%0A%0A%E2%80%94+Jacob+Andreae%2C+Lutheranism+vs.+Calvinism%3A+The+Classic+Debate+at+the+Colloquy+of+Montbeliard+1586+%28Concordia+Publishing+House%2C+2017%29%2C+ch.+4%2C+%E2%80%98On+the+Reformation+of+Temples%2C+Images+%26+Organs%E2%80%99+Andreae+%281528%E2%80%931590%29+was+a+leading+Lutheran+theologian+debating+Theodore+Beza.+%7C+Andreae%3A%2C+pp.+472-75&amp;url=https%3A%2F%2F5solasquotes.github.io%2Fquote%2F1066704188.html&amp;via=5Solas" target="_blank" rel="noopener">Share on X</a><a class="perma" href="../quote/1066704188.html">Permalink</a><a class="src" href="https://reformedbooksonline.com/on-impurities-in-worship/#:~:text=For%20even%20if%20images%20can%20be,for%20idolatry%2C%20as%20much%20as%20possible&amp;text=For%20even%20if%20images%20can%20be%20retained%20%5Bin&amp;text=all%20opportunities%20for%20idolatry%2C%20as%20much%20as%20possible" rel="noopener" target="_blank">Read it online · Refo

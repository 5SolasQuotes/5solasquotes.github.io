<main class="wrap"><figure class="quote" id="q-7d69275a1e" data-kw="">
<blockquote><p>What all men are taught by the works of creation themselves, their order, harmony, and mutual respect to each other, with reference unto their duty towards God and among themselves, is of the law of nature, although there be not an absolute distinct notion of it inbred in the mind discoverable. It is enough that the mind of man is so disposed as to be ready and fit to receive the discovery and revelation of it.

For the very creation itself is a law unto us, and speaks out that duty that God requireth of us towards himself; for he hath not only so ordered all the works of it that they should be meet to instruct us, or contain an instructive power towards rational creatures, made in that state and condition wherein man was created, which was before described, which hath in it the first notion of a law; but it was the will of God that we should learn our duty thereby, which gives it its complement as a law obliging unto obedience. And it is not only thus in general, with respect unto the whole work of creation in itself, but the ordering and disposal of the parts of it is alike directive and instructive to the nature of man, and hath the force of a law morally and everlastingly obligatory.

Thus, the pre-eminence of the man above the woman, which is moral, ensues upon the order of the creation, in that the man was first made, and “the woman for the man,” as the apostle argues, 1 Cor. xi, 8, 9, 1 Tim. ii. 12, 13. And all nations ought to be obliged hereby, though many of them, through their apostasy from natural light, knew not that either man or woman was created, but, it may be, supposed them to have grown out of the earth like mushrooms; and yet an effect of the secret original impression hereof influenced their minds and practices. So the creation of one man and one woman gave the natural law of marriage, whence polygamy and fornication became transgressions of the law of nature.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/john-owen.html">John Owen</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Exercitations Concerning the Name, Original, Nature, Use, and Continuance of a Day of Sacred Rest</cite>, Ex. 3, § 30 in An Exposition of the Epistle to the Hebrews. With Preliminary Exercitations, ed. W. H. Goold (1671; 7 vols, Edinburgh: Johnston and Hunter, 1854), 2: 353-54.</span></figcaption>

<blockquote><p>4. Distinguish between the Moral, and Ceremonial, and Judicial Law: [1.] The first concerns manners, and the right ordering of a godly conversation; and because these things are of perpetual equity and rectitude, the obligation of this Law as to that is perpetual; and therefore in the expounding of it, these two terms, Moral, and of Perpetual Authority, are all one, and to be taken so.

2. The Judical Law is for regulating outward society, and for government, and does generally (excepting what was peculiar to the people of Israel) agree with the Moral Law; this as given to them is not perpetual, their policy being at an end.

3. The Ceremonial Law is in ceremonies, types, and shadows, pointing at a Savior to come; this is also abrogate[d], the substance being come; but there is this difference, that the Judicial Law is but mortua, ‘dead’; and may, where ’tis thought fit, with the foregoing caution, be used under the New Testament; but the Ceremonial Law is mortifera, ‘deadly’, and cannot without falling from grace, Gal. 5:2,4, be revived.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/james-durham.html">James Durham</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Law Unsealed</cite>, (1676), Preface, pp. 4-5</span></figcaption>

be%20revived" rel="noopener" target="_blank">Read it online · Reformed Books Online</a></div>
</figure><figure class="quote" id="q-62df1170c2" data-kw="">
<blockquote><p>Human life owes almost all its security, and the greater part of its happiness, to the fact that, whether by nature or by choice, by the ties of common family, common country, or voluntary association, different individuals are bound together into one body. And the law of such bodies is not only that if one member be honoured the others rejoice with it, but that if one member suffer the others must suffer with it.

For as in the natural body the nerves, along which in health thrill so many sensations of pleasure, at times rack the frame with cruel achings, so those ties of union which in various ways bind us in one body with our fellowmen do at times bring us pain instead of happiness, pain which we are content to accept on account of the vastly greater happiness which has come through the same channels.

We owe so much, for instance, to our country and its laws, which give us security for property, and life, and family comfort, that it is justly accounted the grossest ingratitude if we do not love our fatherland, or if we hesitate to give our substance or our life for it should its needs require.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/george-salmon.html">George Salmon</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Gnosticism and Agnosticism and Other Sermons</cite>, (London: MacMillan and Co., 1887), p. 35.</span></figcaption>

<blockquote><p>The two Demurrers…: ‘Except[ion] against this our present obedience, because the present power is yet new: neither is there a total cessation of all hopes of recovery.’ Philosophers hold that the definition of a man belongs to an infant as well as to one of many years, because after the organization of the parts, he is informed with the same principle of life and reason as a grown man is; and having the same form, is the same thing. Even so the present power has possessed all the parts of this kingdom, gives them life in the administration of public justice and protection, which are the soul of a State, and the power which preceded this, what did it infuse more vital than this? And now that that is taken away, if this other did not presently enter into its place, the commonwealth were dead and each man were left in his naturals to subsist of himself and to cast how he could in such a state of war, defend himself from all the rest of the world, every man in this State having an equal right to everything.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/anthony-ascham.html">Anthony Ascham</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Bounds &amp; Bonds of Public Obedience</cite>, … (London, 1649) This was mor than likely written by Ascham despite it being attributed to Rouse., p. 27</span></figcaption>

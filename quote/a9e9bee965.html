<main class="wrap"><figure class="quote" id="q-a9e9bee965" data-kw="">
<blockquote><p>2. There is no such moral necessity of the sacraments as there is of the ministry of the Word, and consequently of some use of the keys where a scandalous person may infect the Lord’s flock. For where vision ceases the people perish, but it is never said, where baptism ceases the people perish; and therefore uncalled ministers in case of necessity, without ordination or calling from a presbytery, may preach and take on them the holy ministry and exercise power of jurisdiction, because the necessity of the souls of a congregation in a remote island requires so, but I hope no necessity in any [of] the most extraordinary case requires that a midwife may baptize, or that a private man remaining a private man may celebrate the Lord’s Supper to the Church without any calling from the Church.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/samuel-rutherford.html">Samuel Rutherford</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Due Right of Presbyteries, ‘Acts 15, A Pattern of a Juridicial Synod’</cite>, (1644), pt. 1, pp. 454-455</span></figcaption>

</figure><figure class="quote" id="q-dac9265f56" data-kw="">
<blockquote><p>Controversy 3 – Can the sacraments, especially baptism, be administered by anyone, including women? We deny against the Papists, Socinians, Arminians, and Anabaptists. Arguments:

1. Christ gave the power of administering the sacraments only to the apostles and ministers of the Church (Mt. 28:19).

2. And these alone are stewards and dispensers of the mysteries of God (1 Cor. 4:1).

3. The administration of the sacraments is joined with the preaching of the Word; thus, whoever cannot do one, cannot do the other 4. Calling is required (Jn. 1:33, 1 Cor. 1:17). 5. It is forbidden for women to speak in the Church or to do any ecclesiastical duty (1 Cor. 14:34-35). Objections 1. Zippora circumcised her son (Ex. 4:25). Reply: Their relation to circumcision is one thing and their relation to baptism another, and the fact that it was done by a woman is not approved.

2. Philip the deacon baptized (Acts 8:38). Reply: First, he was a deacon. Later, he was an evangelist (Acts 21:8).

3. So did Ananias (Acts 9:18). Reply: He had a special command (v. 10), nor is there proof that he was not a minister.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/leonard-riissen.html">Leonard Riissen</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Other citations (work not named)</cite>, ch. 17, ‘The Sacraments’, pp. 224-5 in Wesley White, A Translation with Introduction to A Summary of Elenctic Theology by Leonard Rijssen a Masters thesis (GPTS, 2009)</span></figcaption>

</figure><figure class="quote" id="q-e2fe3ccfb3" data-kw="">
<blockquote><p>The fifth argument taken of the end [design] of baptism, to wit, because that they which are baptized, are baptized for dead, that is to say, that they may have a remedy against death because that baptism is a token of regeneration. They that are baptized [are baptized] to this end and purpose, that death may be put out in them, or, to rise again from the death, whereof baptism is a seal.</p></blockquote>

<main class="wrap"><figure class="quote" id="q-9c8dfb72d9" data-kw="">
<blockquote><p>Again, the unchanged confession may gradually bring about a false state of mind in relation to detailed doctrines. Take, for instance, the strict doctrine of exclusively particular redemption as against the Amyraldian doctrine of general redemption. I have no doubt that exclusively particular redemption is set forth in the Confession, and that with clear consciousness on the part of its authors.

But from the recently published Minutes of the Westminster Assembly, it plainly appears that some of the Westminster divines personally held the wider view which had been set forth by the English delegates at the Synod of Dordt. They allowed the stricter view to go into the Confession; and no doubt the mass of its authors, when tabulating this view, would feel that it could not be pressed, as a doctrinal term of office, with the same rigour as if it had been one of the universally-received fundamentals of Catholic Christianity.

But we, inheriting their statement, and not having as churches gone through their previous process of ascertainment, are very apt to forget this, and to think and act as if the statement had been emitted unanimously and without hesitation—a result undesirable, were it only on this account, that in every generation of Calvinists there will be some who have such hesitation about exclusively particular redemption as was experienced by some Westminster divines, and that we ought to regard them with intelligent sympathy.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/james-macgregor.html">James MacGregor</a></span><span class="wk"><span class="lbl">Work:</span> <cite>On Revision of the Westminster Confession in British and Foreign Evangelical Review</cite></span></figcaption>
<div class="meta"><span class="t"><a href="../topics/the-church/creeds-confessions-and-councils.html">Creeds, Confessions and Councils</a></span></div>

</figure><figure class="quote" id="q-8e0bf6110d" data-kw="">
<blockquote><p>In 1720, the [Presbyterian] Synod [of Ulster] adopted the so-called ‘Pacific Act,’ which in the same breath professed adherence to the Westminster Confession, extended the Act of 1705 to all intrants to the ministry, though licensed and ordained elsewhere; and ‘legalized the practice of receiving explanations of objectionable phrases.’ In 1721 a motion was made and carried that all the members of Synod who are willing to subscribe the Westminster Confession of Faith, according to the terms of the Pacific Act, be allowed by this Synod to do it. Charitable declarations were made by both parties in the Synod and approved by Synod. The great majority of the members of Synod signed the following formula: ‘Reserving to ourselves the benefit of the Pacific Act, we believe the Westminster Confession of Faith to be founded on the Word of God, and therefore as such, by this our subscription, we do own the said Confession as the confession of our faith.&#x27;</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/james-cooper.html">James Cooper</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Confessions of Faith &amp; Formulas of Subscription</cite>, … (Glasgow: MacLehose &amp; Sons, 1907), pp. 19-22</span></figcaption>

<main class="wrap"><figure class="quote" id="q-41d0c5ea1b" data-kw="">
<blockquote><p>At the Synod of Dort, the foreign delegates spoke as broadly as possible about the worth and sufficiency of Christ’s sacrifice. The English theologians even stated that Christ, in a sense, had died for all: “Christ so died for all that all people and individuals, with faith mediating, can gain remission of sins and eternal life in virtue of this ransom (ἀντιλυτρον).”117 In England, over against the rigorously Reformed school of Twisse, Rutherford, Gillespie, Goodwin, and others, there was a moderate group represented by Davenant, Calamy, Arrowsmith, Seaman, and others and especially by Richard Baxter.118 Their view completely agreed in substance with that of the French theologians Cameron, Testard, Amyraut, and others. There was an antecedent decree by which Christ had conditionally satisfied for all, on condition of faith, and another subsequent particular decree by which he had so made satisfaction for the elect that he would in time also grant them faith and infallibly lead them to salvation.”119 117 Acta, National Synod of Dort (1620), Judicia, 79. 118 Richard Baxter (1615–91) published his Universal Redemption of Mankind by the Lord Jesus Christ and thereby contributed substantially to the introduction of Amyraldism in England. His contemporary, Isaac Barrow (1630–77), author of The Doctrine of Universal Redemption Asserted and Explained, had committed to Arminianism (see W. Cunningham, Hist. Theol., II, 328). Against their hypothetical universalism it was objected that if Christ died for all on condition of faith, he cannot have died for the children who can never actually believe. Cf. B. B. Warfield, “The Making of the Westminster Confession, and Especially of Its Chapter on the Decree of God,” Presbyterian and Reformed Review 12 (1901): 226–83. 119 Cf. H. Bavinck, Reformed Dogmatics, II, 368–72; C. Vitringa, Doctr. christ., VI, 138ff.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/herman-bavinck.html">Herman Bavinck</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Reformed Dogmatics: Sin and Salvation in Christ</cite>, trans. John Bolt and John Vriend (Baker Academic, 2006), 3:460–61.</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/amyraldians/hypothetical-universalism.html">Amyraldians: Hypothetical Universalism</a></span></div>

</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-87bc282954" data-kw="">
<blockquote><p>But if to believe that Christ died for oneself is the same thing as to believe that the death of Christ is sufficient of itself to expiate one’s sins, we do not deny that reprobates are also bound to believe this: which is perfectly true, whether they believe it, or not. For, the value of Christ’s death is such, that it is of itself sufficient for the altogether complete expiation of the sins of all men, even if they should be ten thousand times more: even if God did not determine it for the expiation of the sins of all. So indeed in this controversy it is customary among many to make a distinction, that they say, that Christ died sufficiently for all, even reprobates; but efficiently only for the elect: which words, suitably explained, and applied to amplify the value of the merit of Christ, we readily admit: even if we have not made use of this distinction from the beginning: because the impropriety in the words appears to be overly harsh. For to [have] died for someone, if we speak properly, is to die for the favor of someone, or in the place of someone, so that he might be delivered from death: and if a voluntary death is met for another, it presupposes the greatest possible love, as Christ testifies, Jn. 15:13. Now, if you should add, ‘sufficiently only, not efficiently’, this not very suitable sense will emerge: Christ, impelled by the greatest possible charity, died in the place of reprobates, so that they might be delivered from death, sufficiently indeed, but not efficiently, that is, they are never actually delivered. Those that say, that Christ dies also for reprobates, not indeed so that they might actually be delivered, but so that they might be able to be delivered, tacitly suppose (or they really do not say anything relevant), that it is in the power and ability of reprobates to apprehend Christ’s offered merit by faith: since without faith they are not even able to be delivered. Likewise (which I wish properly to be observed), that God decreed from eternity to save all men and each through Christ, under this condition, that they believe upon Christ, the Redeemer of all men and each. Which no Orthodox theologian would admit, as Pelagian or Semi-pelagian dogma. I leave unmentioned, that God foreknew from eternity, that a great many were not going to believe, and that He decreed that He was not going to give faith to them, which is not able to be had, except with Him freely giving. Why then would He have decree salvation, and have determined means of salvation, that is, the death of His Son, under a condition, which He foreknew that He was not going to fulfill, and the ability of the fulfilling of which He denied in His eternal decree. Not even man plans so imprudently. But let us dismiss these things. Nevertheless, we think that it is more rightly and plainly said, that the death of Christ is sufficient in itself for the expiation of all the sins of men, than, Christ died sufficiently for all, even reprobates.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/marcus-friedrich-wendelin.html">Marcus Friedrich Wendelin</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Christian Theology 3rd</cite>, ed. (1634), Species of the Office of Christ, pt. 3 Wendelin admits that Christ died for the world to make a sufficient atonement for all, yet Christ dying for someone properly means to deliver them; hence he does not like the language of Christ dying for all sufficiently. He then argues against hypothetical universalism.</span></figcaption>

<blockquote><p>Now when God says expressly (as if He would make it impossible for any mortal to misconceive Him) that Christ is the Savior, the propitiation, the taster of death, not only for all men, but for every man, not only for the world, but for the whole world, and to prove He speaks of an intention to save them all without exception (if by the wickedness of their wills they do not frustrate his intention, as the greater part of men do, by not accepting his offer and not performing the conditions on which his offer is made), He professes He is not willing that any should perish, but [on the contrary] that all should come to repentance, 2 Pet. 3:9.</p></blockquote>

<blockquote><p>The doctrine of hypothetical universalism acted as a corrosive factor in the French Reformed Church. Tolerated at first because it was felt that an outright condemnation would lead to schism, it slowly undermined respect for the confessional standards and disrupted internal unity and cohesion… it did provide a bridge toward Arminianism and perhaps toward the Semi-Pelagian tendencies of the Church of Rome. The advantages that Amyraut had envisioned failed to materialize, and the dangers against which his opponents had warned did in fact eventuate.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/roger-r-nicole.html">Roger R. Nicole</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Standing Forth: Collected Writings of Roger Nicole</cite>, (Mentor, 2018), p. 326</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/amyraldians/hypothetical-universalism.html">Amyraldians: Hypothetical Universalism</a></span></div>
<div class="actions"><button class="copy" data-copy="“The doctrine of hypothetical universalism acted as a corrosive factor in the French Reformed Church. Tolerated at first because it was felt that an outright condemnation would lead to schism, it slowly undermined respect for the confessional standards and disrupted internal unity and cohesion… it did provide a bridge toward Arminianism and perhaps toward the Semi-Pelagian tendencies of the Church of Rome. The advantages that Amyraut had envisioned failed to materialize, and the dangers against which his opponents had warned did in fact eventuate.”

<blockquote><p>The Compromise of the School of Saumur. The School of Saumur represents an attempt to tone down the rigorous Calvinism of the Synod of Dort, and to avoid at the same time the error of Arminianism. This is seen especially in the work of Amyraldus, who boldly taught a hypothetical universalism, which was really a species of universal atonement. God willed by an antecedent decree that all men should be saved on condition of repentance and faith in Jesus Christ. He therefore sent Christ into the world to die for all men. But seeing that, left to themselves, none would repent and believe, He by a subsequent decree elected some as the objects of the saving operation of His grace. These and these only are actually saved. The outcome proved this to be an untenable position. Of the followers of this school some emphasized the first decree and the universal offer of salvation based on it, with the result that they landed in the Arminian camp; and others stressed the second decree and the necessity of effectual grace, and thus returned to the Calvinistic position. The views of the School of Saumur were practically shared by Davenant, Calamy, and especially Richard Baxter, in England. Its peculiar opinions gave occasion for the construction of the Formula Consensus Helvetica by Turretin and Heidegger, in which these views are combatted.</p></blockquote>

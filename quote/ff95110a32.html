<blockquote><p>At the outset, here is THE BELIEVER’S VIEW OF HIS AFFLICTIONS. “The Lord has chastened me sore.”

On the surface of the words we see the good man’s clear observation that his afflictions came from God. It is true he perceived the secondary hand, for he says, “You have thrust sore at me that I might fall.” There was one at work who aimed to make him fall. His afflictions were the work of a cruel enemy. Yes, but that enemy’s assaults were being overruled by the Lord and were made to work for his good, so David, in the present verse, corrects himself by saying, “The Lord has chastened me sore. My enemy struck at me that he might make me fall, but in very truth my gracious God was using him to chasten me that I might not fall. The enemy was moved by malice, but God was working by him in love to my soul. The second agent sought my ruin, but the Great First Cause worked my education and establishment.”

It is well to have grace enough to see that tribulation comes from God—He fills the bitter cup as well as the sweet goblet. Troubles do not spring out of the dust, neither does affliction grow up from the ground like hemlock from the furrows of the field, but the Lord Himself kindles the fiery furnace and sits as a refiner at the door. Let us not dwell too much upon the part played by the devil, as though he were a coordinate power with God. He is a fallen creature and his very existence depends upon the will and permission of the Most High. His power is borrowed and can only be used as the infinite omnipotence of God permits. His wickedness is his own, but his existence is not self-derived. Blame the devil and blame all of his servants as much as you will, but still believe in the mysterious and consoling truth that, in the truest sense, the Lord sends trials upon His saints.

“Explain this statement,” you say. Oh, no—I am not called upon to explain it, but to believe it. A great many things, when they are said to be explained by modern thinkers, are merely explained away—and I have not yet begun to learn that wretched art. Remember how Peter told the Jews that He whom God, by His determinate counsel and foreknowledge decreed to die, even His Son, Jesus Christ, was nevertheless taken by them with wicked hands when they had crucified and slain Him? The death of Christ was predetermined in the counsel of God and yet it was nonetheless an atrocious crime on the part of ungodly men. The omnipotence and providence of God are to be believed, but man’s responsibility is not, therefore to be questioned. Our afflictions may come distinctly from man, as the result of persecution or malice, and yet they may come with even greater certainty from the Lord and may be the necessary outcome of His special love to us.

For this reason we may wisely moderate our anger against second causes. If you strike a dog with a stick, he will bite the stick. If he were more intelligent, he would snap at the person using the stick, and if that intelligence were governed by the spirit of obedience, he would yield to the blow and learn a lesson from it. Thus, when Shimei reviled David and Abishai, the son of Zeruiah, said unto the king, “Why should this dead dog curse my lord the king? Let me go over, I pray you, and take off his head,” David meekly replied, “So let him curse, because the Lord has said unto him, Curse David. Who shall then say, Why have you done so?” A sight of God’s hand in a trial is the end of rebellion against it in the case of every good man. He says, “It is the Lord: let Him do what seems good to Him.” We may lie at His feet and cry, “Show me why You contend with me,” but if the reason does not appear, we must bow in reverent submission and say with one of old, “I was dumb, I opened not my mouth; because You did it.”

Job saw the Lord in his many tribulations and therefore praised Him, saying, “The Lord gave, and the Lord has taken away; blessed be the name of the Lord.” Surely there is nothing better for a man of God than to perceive that his smarts and sorrows come from his Father’s hand, for then he will say, “The will of the Lord be done.” This is the great point in the believer’s view of his afflictions—“He makes sore and binds up: He wounds and His hands make whole.</p></blockquote>

<blockquote><p>II. Secondly, there is a conviction of conscience that brings with it some overpowering, some more, some less, some for one end, some for another. I say, some overpowering. In that dispute about the resistibility or irresistibility of grace, as far as I can see into the dispute, this distinction might be useful and advantageous toward the determining of it, viz. to consider what the Spirit of God does to the heart by way of trying it, and what it does with intent and resolution to overpower it. The former part of the distinction you have in Ex. 20:20, ‘Fear not, for the Lord is come to prove,’ or try, ‘you.’ The latter in Isa. 26:11, ‘They will not see, but they shall see and be ashamed.’ The former in Rev. 3:17, Christ stands at the door and knocks, to try whether He shall be entertained. The latter in Eze. 22:14, ‘How can thy heart endure and thy hands be strong in the day that I shall deal with thee, when I break in resolved to overpower thee?’ As in that blasted conviction I spake of before, there was a trying but no overpowering, so there is some overpowering conviction also, that is but for trial…. So that was a very overpowering conviction upon the conscience of Herod, that made him reverence John Baptist, and to hear him gladly and to do many things according to his doctrine; but it was far from attaining the utmost end of conviction: it was only by way of trial, whether he would come up to the utmost end or no. This conviction neither they in the text, nor Herod could resist, for conviction brake in, whether they would or no; but the ultimate operation of conviction they resisted; because in this conviction the Spirit of God did only try them, not resolved to overpower them to the utmost fruit and effect of conviction… For the first, it is well known how God tried the hearts and consciences of Pharaoh and the Egyptians, by Moses’ words and miracles, and how again and again He in some degree did overpower them; but still they resisted and came not up to the proper and ultimate effect of conviction, to own and to do their duty.</p></blockquote>

<blockquote><p>If you look into 1 Peter 3:19-20, you there find that Christ “went and preached unto the spirits in prison; which sometime were disobedient, when once the long-suffering of God waited in the days of Noah.” The meaning of which is, that in the days before the flood, Christ by his Spirit strove [Gen. 6:3] with the disobedient and rebellious sinners in the ministry of Noah, who then were living men and women as we are, but now are “spirits in prison,” that is, damned souls in hell, for their disobedience…</p></blockquote>

<blockquote><p>§.10. Otherwise the will of God is distinguished into the will of sign [voluntas signi] and the will of good pleasure [voluntas beneplaciti]. The latter is, and is conceived as, the very complacency of God decreeing concerning the futurition of things, and approving Himself and whatever is in some manner similar to Himself. The former, which is called of sign, is indicated through some sign, and is made manifest among men: of which the will of precept is also a part. For those signs are referred to the number of five, and were formerly comprehended in this verse: He foretells, forbids, permits, commands, fulfils [Prædicit, prohibet, permittit, præcipit, implet]. §.11. Here it is inquired whether the will of precept and the will of decree do not very often conflict with one another: because what He wills by the will of precept, we often see not to come to pass, and thus it is evident from the event that God in His decree willed it not to be done. But we easily reconcile these by observing that the will of the mandate says nothing other than that God wills the obligation of the rational creature: but the will of decree, that He wills to permit a particular man not to answer to his obligation; or sometimes, if the mandate be positive, that He wills the obligation to endure for a time, until He Himself dissolves it. §.12. Those who distinguish the will of God into efficacious and inefficacious, absolute and conditional, antecedent and consequent, etc., in order to free the liberty of the will [libertas arbitrii] from all necessity of the event, labor in vain and ascribe many imperfections to God. Wherefore we acknowledge no will of decree which is not efficacious, absolute, and antecedent, as in the chapter on the decree of God we shall see that no other is to be admitted.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/salomon-van-til.html">Salomon Van Til</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Compendium of Both Theologies, even Natural &amp; Revealed… (1703; 1719), 1. Nature of God, subsection 4, ‘On the Will of God’ tr. AI by Roman Prestarri Latin</cite></span></figcaption>

</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-a8df8cd63a" data-kw="">
<blockquote><p>In light of such problems, Leigh, Maccovius, and Twisse (very much following the tradition) indicate that the voluntas propositi or beneplaciti [proposed will or of good pleasure, i.e. the will of decree] alone is properly called the will of God, ‘which none can resist, Rom. 9:19,’ whereas the voluntas signi or commandment is only ‘improperly’ called God’s will… Baxter does agree with Twisse, however, that the commandments or signs of God are only improperly designated as the divine will.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/richard-muller.html">Richard Muller</a></span><span class="wk"><span class="lbl">Work:</span> <cite>PRRD 3.459</cite></span></figcaption>

</figure><figure class="quote" id="q-c77fc470bc" data-kw="">
<blockquote><p>XXIV. All these [previous] things are not therefore spoken that we should reject this distinction of the will of God into his antecedent and consequent will: For we know that among the decrees of God, some are before and some are after in order. But we deny that there are two decrees of God, between which man’s will steps in, as if man’s will came between the decree of creating man and the decree of condemning certain men. But we deny that the will of man does so come between the two decrees of God that the first, or antecedent decree, is broken off by the will of man and that God is compelled to absist from that end which He had propounded to Himselfe and which He did seriously intend: We deny also in the work of our election, the precise will of God to depend on the foreseeing of any power or action of man’s free-will, or the consequent will of God to be suspended on man’s will.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/pierre-du-moulin.html">Pierre Du Moulin</a></span><span class="wk"><span class="lbl">Work:</span> <cite>ch. 5, ‘Of the Antecedent &amp; Consequent Will of God’ in The Anatomy of Arminianism… (London: Snodham, 1620), pp. 27-41</cite>, pp. 40-41</span></figcaption>

</figure><figure class="quote" id="q-57b3a16f4e" data-kw="">
<blockquote><p>4. This turning the grace of God into lasciviousness argues the grossest folly; it is a forsaking of our own mercy, a receiving the grace of God in vain. What is, if this be not to neglect great salvation; to be prodigal of blessedness; to ravel out and to wanton away the offers of Christ Himself? Who would not heartily chide himself that by toying, trifling, or unnecessary lingering in the way to the exchange, misses of a bargain by which he might have gained a thousand pounds?… 4. Grace turned into lasciviousness is the top of all ingratitude. What greater unkindness than to be evil because God is good?… To be lascivious because God is gracious is to fight against God with his own weapons, to wound God with that arm which He has cured (Hos. 7:15), to kill and crucify Him who has freed us from death: In a word, to make that a pillow for presumption which God appointed for an antidote against despair.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/william-jenkyn.html">William Jenkyn</a></span><span class="wk"><span class="lbl">Work:</span> <cite>An Exposition of the Epistle of Jude… (London: Maxey, 1652), on v. 4</cite>, pp. 333-34</span></figcaption>

<main class="wrap"><figure class="quote" id="q-876cff415d" data-kw="">
<blockquote><p>The time when Christ was buried was the evening, wherein the Sabbath was to begin according to the manner of the Jews, which began their days at sun setting from evening to evening according to that in Genesis: the evening and the morning was the first day.

Now Joseph cometh a little before evening and beggeth the body of Christ and burieth it: where note, that howsoever we are not bound to keep the sabbath so strictly as the Jews were, yet when we have any business or work to be done of our ordinary calling, we must not take a part of the Lord’s sabbath to do it in, but prevent the time, and doe it either before as Joseph did, or rather after the sabbath.

This is little practised in the world. Men think if they go to Church before and after noon to hear Gods word, then all the day after they may do what they list, and spend the rest of the time at their own pleasure: but the whole day is the Lord’s, and therefore must be spent wholly in his service both by public hearing of the word, and also by private reading and meditation on the same.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/william-perkins.html">William Perkins</a></span><span class="wk"><span class="lbl">Work:</span> <cite>An Exposition of the Symbol or Creed of the Apostles, According to the Tenor of Scripture</cite>, in The Work of William Perkins (Cambridge: John Legat, 1600), p. 371.</span></figcaption>

</figure><figure class="quote" id="q-d3e9518ad8" data-kw="">
<blockquote><p>This is what they are doing here: for they do not mention what seemed good, that is, the restoration of the blind man’s sight, but stress what they can against Christ, that is, his breaking of the Sabbath. Thus some of the Pharisees said, that is, those who were malicious and corrupt, this man is not from God, who does not keep the Sabbath. But Christ did keep the Sabbath, for when the Lord forbade work on the Sabbath he had in mind servile work, which is a sin: whoever commits sin is the slave of sin (John 8:34). Therefore, he who performs works of sin on the Sabbath, breaks the Sabbath. So Christ, who was without sin, rather than they, kept the Sabbath.</p></blockquote>

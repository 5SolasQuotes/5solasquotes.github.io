<main class="wrap"><figure class="quote" id="q-c9ef8b927d" data-kw="">
<blockquote><p>That the Birth and Baptism of our Blessed Saviour Jesus Christ should be at this time of the Feast of Tabernacles, is as Considerable, as that his Passion should be about the time of the Jewish Passover. He was Sacrificed for us at that time, when by God’s appointment the Pascal Lamb was to be offered as his Type: And at the Feast of Tabernacles he came to pitch his Tent in our nature, to tabernacle in our Flesh, and dwell among us.

The Sceptre was so far gone from Judah that the Jews were compelled by a foreign Power, instead of observing the feast of the Tabernacles at Jerusalem, every one to repair to his own City to be taxed, as the Emperor Augustus had commanded, (and ’tis not very likely he would appoint that in the depth of Winter, the time of our Christmas) and now was the Season for Shilo to appear.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/john-shower.html">John Shower</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Serious reflections on time and eternity with some other subjects, moral and divine. To which is prefixed an introduction concerning the first day of the year, how observed by the Jews, and may best be employed by a serious Christian</cite>, (London: Joseph Watts, 1689), p. 4.</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/civil-government-and-society.html">Civil Government and Society</a></span></div>

</figure><figure class="quote" id="q-e7d02b7932" data-kw="">
<blockquote><p>…an official goodness, or a magistratical prudence, justice, and goodness; this is required of all magistrates, as such, to judge the people: so the acts of a heathen magistrate done according to common natural equity, by Nebuchadnezzar, Pilate, Caesar, Felix, Festus, are to be acknowledged as acts of a lawful magistrate, valid and no less essentially magistratical than if performed by King David; and of this goodness the Scriptures speak not as essential to a magistrate as a magistrate. [That is, a magistrate not doing these ennumerated things is still a valid magistrate.] For kings as kings intend justice, peace, godliness, materially considered, both ex conditione operis [from the nature of the magisterial work], and operantium [from the nature of the persons working by the office]. But for justice and righteous judgment in a spiritual and an evangelic way, that belongs not to the essence of a magistrate, nec ex conditione seu ex intentione operis, nec ex conditione operantis [neither from the nature or the intention of the work of magistracy, nor from the nature of the magistrate working]…</p></blockquote>

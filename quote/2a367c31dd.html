<main class="wrap"><figure class="quote" id="q-2a367c31dd" data-kw="">
<blockquote><p>But those writers are wrong who assign to the Roman pontiff the power of deposing kings and emperors.¹ ¹ See Petrus Gregorius, De republica, XXVI, 5-7; Marsilius of Padua, The Defender of the Peace; Lupold of Bebenberg, De jure regni et imperii. [Gregorius affirms, while Marsilius and Lupold deny, a papal power of deposing rulers.]</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/johannes-althusius.html">Johannes Althusius</a></span><span class="wk"><span class="lbl">Work:</span> <cite>p. 194 of ch. 38, ‘Tyranny and its Remedies’ of ed. Frederick Carney, Politica (1603/14, rep. Liberty Fund, 1995)</cite></span></figcaption>

</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-dca7c69c7e" data-kw="">
<blockquote><p>I am sure, the Reformed Churches and all our writers argue that as many as have souls, Popes, prelates and Roman clergy ought to be subject by this text [Rom. 13:1] to the good laws of the Christian emperors, and that all men, none excepted, neither clergy (as they call them) nor others, but are obliged by this Scripture and 1 Pet. 2 and Titus 3, to give obedience and subjection to all lawful magistrates, heathen and Christian, and to their laws, and to pay tribute and to be judged by them, whereas papists plead exemption to Churchmen…</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/samuel-rutherford.html">Samuel Rutherford</a></span><span class="wk"><span class="lbl">Work:</span> <cite>A Free Disputation... (London, 1649), ch. 17, argument 11</cite>, pp. 227-8</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/civil-government-and-society/church-and-state.html">Civil Government and Society: Church and State</a></span></div>

</figure><figure class="quote" id="q-e18ee878f1" data-kw="">
<blockquote><p>…the pope… can excommunicate a ruler and thereby dissolve all obligations his subjects have to support and obey him, thus overthrowing governments at will. Thomas [of Aquinas] wrote: …if someone commits the sin of unbelief he can be deprived of his right to rule by judicial sentence, just as for other failings… Therefore, as soon as someone falls under a sentence of excommunication for apostasy from the faith, his subjects are ipso facto absolved from his rule and from the oath of fealty by which they were bound to him. (Summa Theologiae, ii-ii, Question 12, in Basic Writings of Thomas Aquinas, Anton C. Pegis, editor. New York: Random House, 1945.)</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/john-robbins.html">John Robbins</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Ecclesiastical Megalomania (Trinity Foundation, 1995)</cite>, pp. 130-31</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/civil-government-and-society/church-and-state.html">Civil Government and Society: Church and State</a></span></div>

</figure><figure class="quote" id="q-e3236da1c4" data-kw="">
<blockquote><p>A class of subjects same to be discussed in the latter part of the sixteenth century which had not engaged so much of the attention of the earlier Reformers–especially the Erastian and the Prelatic controversies–and in the discussion of these matters Beza bore his part nobly as an able and faithful champion of the truth. The Erastian controversy, indeed, as conducted between Erastus and Beza, turned mainly upon the particular subject of the excommunication of church members; and it was not till the following century, that the whole of the principles usually regarded by Presbyterian divines as comprehended in the Erastian controversy, were subjected to a full and thorough discussion. Still, even at that early stage, the quested was mooted, on which the entire progress of the subsequent discussion, down even to our own day, has made it more and more manifest that the whole controversy hinges–viz. whether or not Christ has appointed in His church a government, distinct from, independent of, and in its own province not subordinate to, civil magistracy. And on this great question, as well as on the particular topic of excommunication comprehended under it, Erastus took the side which has always been supported by politicians, sycophants [obedient flatterers], and worldlings, while Beza ably defended that which has been adhered to by all intelligent and conscientious Presbyterians.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/william-cunningham.html">William Cunningham</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Reformers &amp; the Theology of the Reformation, ch. 7, ‘Calvin &amp; Beza’</cite>, pp. 350-51</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/civil-government-and-society/church-and-state.html">Civil Government and Society: Church and State</a></span></div>

ink</a><a class="src" href="https://reformedbooksonline.com/topics/topics-by-subject/civil-government/church-state-relations/erastianism/#:~:text=A%20class%20of%20subjects%20same%20to,by%20all%20intelligent%20and%20conscientious%20Presbyterians." rel="noopener" target="_blank">Read it online · Reformed Books Online</a></div>

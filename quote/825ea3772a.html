<main class="wrap"><figure class="quote" id="q-825ea3772a" data-kw="">
<blockquote><p>X. …What is essential to the ministry cannot be changed without making another ministry. But the essence remaining untouched, it does not cease to be the same ministry, although a varied and manifold change as to the accidents may have taken place. The essence of the ministry is placed in this–that all saving truth pertaining to the conservation of faith and piety be retained and taught; that the true sacraments instituted by Christ may be administered; and that the people may be held under a legitimate government. The accidents make its state good or bad. The good is when the preaching of the Word is pure and entire without any mixture of error or superstition; when the sacraments are rightly celebrated according to the institution of Christ without addition, or detraction, or alteration; and the Christian people are governed in a holy manner according to the Word of God and not in a tyrannical manner. The bad on the other hand is when the truth preached is mixed with errors and superstitions; the sacraments are in different way altered and corrupted; and the government is either confused or unjust and tyrannical… But still it must not be thought that the ministry ought at once to cease and be extinguished on account of any corruption whatsoever and depraved state; as life is not at once extinguished, but can subsist in the midst of weakness and disease.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/francis-turretin.html">Francis Turretin</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Institutes of Elenctic Theology</cite>, … (P&amp;R), vol. 3, Question 23, p. 218</span></figcaption>

</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-69dd01d77c" data-kw="">
<blockquote><p>Nor do I know any one of our [Reformed] divines who would pronounce that the regeneration which exists in the creation of qualities (which we call sanctification—the Papal writer’s formal justification) is produced at the very moment of baptism. Nay, they all refer this regeneration or spiritual nativity to the period of adult age, in which true and living faith is implanted in the heart of a baptized person from the immortal seed of the Word, and by the operation of the Spirit. … Since, therefore, neither Arminians, nor Papists, nor Protestants acknowledge that infants, by the mere reception of Baptism itself, become partakers of those habitual endowments or spiritual qualities which are properly supposed to constitute a man just and inherently holy, no one can prove the loss of their faith or righteousness, or the apostasy of the saints by any argument derived from the case of infants.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/john-davenant.html">John Davenant</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Baptismal Regeneration &amp; the Final Perseverance of the Saints. A letter of</cite>, … Davenant… to Dr. Samuel Ward… tr. J. Allport (d. 1641; London: Macintosh, 1864), p. 10</span></figcaption>

</figure><figure class="quote" id="q-bea6e2c2af" data-kw="">
<blockquote><p>Nor will it follow that it is intrinsically unlawful for a synod of New England [who were congregationalists] to send 24 gracious youths understanding in the language, ordain them pastors by laying on of hands of the elders, and by fasting and praying, instruct them to go and act as pastors among the savages, preaching and baptizing; and their warrant is Acts 13; and here are pastors without certain flocks [contra congregationalism]. If any (Acts 13) say [that] the Spirit gives a special command there, and names Saul and Barnabas, but its not so here: I answer, there is without question something extraordinary in Acts 13, nor are we with Seekers (too much fortified in their way by our [congregationalist] Brethren’s doctrine) to wait for the Lord’s naming from heaven John, Thomas, to be preachers in such a place. But to me: 1. The nearness to the savages, 2. The knowledge of their language (as I suppose), 3. Their weak desire, or the professed not hating of the Gospel [by the savages], were equivalent to a command from heaven, ‘Go preach to the Americans’, and that in the capacity as proper pastors.</p></blockquote>

<main class="wrap"><figure class="quote" id="q-2977c12ab8" data-kw="">
<blockquote><p>Now that infants may and ought to be baptized, is proved from Matt, xxviii. 17, where Christ commands all to be baptized, and therefore infants; nor does it matter, that in this passage instruction is made to precede baptism, for instruction applies only to adults, who were the persons our Lord had in view, since the first churches were to be composed of adults. The parents were, therefore, first to be taught, but when they had been baptized, their children were to be baptized also.

Besides, the covenant of God, and the seals thereof, belong to infants, (Gen. xvii, 7,) and “the promise” is made unto them. (Acts ii. 39.) To infants also belong remission of sins, and regeneration; in short, “the kingdom of heaven;” therefore the signs of these blessings may be bestowed upon them. Moreover, the necessity of baptism is the same as that of circumcision, for the former succeeded into the place of the latter, and both are sacraments of initiation; now the Jews were in the habit of baptizing proselytes together with their children.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/benedict-pictet.html">Benedict Pictet</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Christian Theology</cite>, trans. Frederick Reyroux (1696; London, 1834), 11.4, p. 487.</span></figcaption>

</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-9d306f79c2" data-kw="">
<blockquote><p>What Mr. [Thomas] Bedford [d. 1653] has produced for the efficacy of baptism has been answered by Mr. [Richard] Baxter in his Appendix to his Plain Scripture, etc. [1651-1656]… Dr. [Cornelius] Burges, his Treatise of Baptismal Regeneration [1629], has been freely censured by many… And therefore I deny baptism to be the remedy of original sin, or the cause of regeneration, or that Christ intended to assign the use to baptism to heal original sin, or to testify the freedom from it without actual [sin]. These things have been delivered by Augustine and taught by the Romanists and Lutherans, but by many other Protestants disclaimed and refuted; and therefore Mr. Stephens, Mr. [James?] Cranford [d. 1657], Mr. Bedford, etc. in using this argument do but symbolize with the Papists, and revive what many Protestants of best note have exploded. ([Errata, p. 341:] What Dr. [Samuel] Ward and Dr. [John] Davenant have said for regeneration and justification of infants by baptism has been accurately examined and enervated by Mr. Gataker in Latin.)</p></blockquote>

<blockquote><p>Peter also says that “baptism also doth now save us” (1 Peter 3:21). For he did not mean to intimate that our ablution and salvation are perfected by water, or that water possesses in itself the virtue of purifying, regenerating, and renewing; nor does he mean that it is the cause of salvation, but only that the knowledge and certainty of such gifts are perceived in this sacrament. This the words themselves evidently show. For Paul connects together the word of life and baptism of water, as if he had said, by the gospel the message of our ablution and sanctification is announced; by baptism this message is sealed. And Peter immediately subjoins, that that baptism is “not the putting away of the filth of the flesh, but the answer of a good conscience toward God, which is of faith.” Nay, the only purification which baptism promises is by means of the sprinkling of the blood of Christ, who is figured by water from the resemblance to cleansing and washing. Who, then, can say that we are cleansed by that water which certainly attests that the blood of Christ is our true and only laver?</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/john-calvin.html">John Calvin</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Institutes of the Christian Religion</cite>, 4.15.2</span></figcaption>

<blockquote><p>2. The justification, regeneration, and adoption, which we grant to be the privilege of baptised infants, is not exactly the same with that justification, regeneration, and adoption, which in the question about the perseverance of the saints, we contend, can never be lost.</p></blockquote>

</figure><figure class="quote" id="q-fa92b1aae8" data-kw="">
<blockquote><p>2. But in respect of the case of the infants, which you say ought not to be baptized within the second or third day after their birth, and that the law of ancient circumcision should be regarded, so that you think that one who is just born should not be baptized and sanctified within the eighth day, we all thought very differently in our council. For in this course which you thought was to be taken, no one agreed; but we all rather judge that the mercy and grace of God is not to be refused to any one born of man. For as the Lord says in His Gospel, “The Son of man is not come to destroy men’s lives, but to save them,” as far as we can, we must strive that, if possible, no soul be lost. For what is wanting to him who has once been formed in the womb by the hand of God? To us, indeed, and to our eyes, according to the worldly course of days, they who are born appear to receive an increase. But whatever things are made by God, are completed by the majesty and work of God their Maker.</p></blockquote>

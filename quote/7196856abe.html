<main class="wrap"><figure class="quote" id="q-7196856abe" data-kw="">
<blockquote><p>All the officers of the New Testament both ordinary and extraordinary are designed and distinguished by their names, or compellations, as apostles, evangelists, presbyters, deacons. The extraordinary and superior have upon good reason the names of the ordinary and inferior common unto them, as the apostles are called ‘elders’ (1 Pet. 5:1). But this is not reciprocal, for the ordinary and inferior are never called by the names of the extraordinary and superior: the deacon is not called an ‘elder,’ nor the pastor by the name of the ‘apostle’ or ‘evangelist’. It is true that Barnabas is called an ‘apostle’ (Acts 14:4, 14) because he was an apostle [messenger] of Christ as Paul was. Titus and others and Epaphroditus are only called ‘apostles’ or messengers of the Church (2 Cor. 8:23; Phil. 2:25). Whence it must follow that the office of a bishop is not an office superior to the office of a pastor, since the name ‘bishop’ is common to the pastor; and that the office of a bishop and the office of a pastor are not different, but one and the same office, since the names are altogether common in all the places of the New Testament (Acts 20:28; Phil 1:1; 1 Tim. 3:2; 1 Pet. 5:1), and the Syriac Interpreter has translated the one by the other (Tit. 1:7). What reason can there be, while the officers are distinguished by their names and the names of ‘bishop’ and ‘pastor’ are common, but that the office of the bishop and elder is one and the same office; the one name signifying, sapientiae maturitatem [a maturity of wisdom], and the other Industriam curae Pastoralis [the industry of the pastoral oversight], says Beda.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/alexander-henderson.html">Alexander Henderson</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Unlawfulness and danger of Limited Prelacy, or Perpetual Presidency in the Church, Briefly Discovered</cite>, (1641), pp. 3-4</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/church-government-and-the-ministry/offices.html">Offices</a></span></div>

</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-66b7d80cb8" data-kw="">

</figure><figure class="quote" id="q-4855f5d7d2" data-kw="">
<blockquote><p>For if we be bound to hold out our left cheek to strangers which will smite us on the right cheek: how much more ought we to suffer an extreme and unkind husband? But yet I mean not that a man should beat his wife; God forbid that, for that is the greatest shame that can be, not so much to her that is beaten, as to him that does the deed. But if by such fortune thou chancest upon such an husband, take it not too heavily, but suppose thou, that thereby is laid up no small reward hereafter, and in this lifetime no small commendation to thee, if thou canst be quiet. But yet to you that be men, thus I speak: Let there be none so grievous fault to compel you to beat your wives. But what say I, your wives? no, it is not to be born with that an honest man should lay hands on his maid servant to beat her. Wherefore if it be a great shame for a man to beat his bondservant, much more [of a] rebuke it is to lay violent hands upon his freewoman. And this thing may be well understood by the laws which the Panims have made, which does discharge her any longer to dwell with such an husband, as unworthy to have any further company with her that does smite her. For it is an extreme point, thus so vilely to entreat her like a slave, that is fellow to thee of thy life, and so joined unto thee before time in the necessary matters of thy living. And therefore a man may well liken such a man (if he may be called a man, rather then a wild beast) to a killer of his father or his mother. And whereas we be commanded to forsake our father and mother, for our wife’s sake, and yet thereby do work them none injury, but do fulfill the Law of God… Who can worthily express the inconvenience that is to see what weepings and walings be made in the open streets when neighbors run together to the house of so unruly an husband, as to a Bedlem man, who goes about to overturn all that he has at home? Who would not think that it were better for such a man to wish the ground to open, and swallow him in, than once ever after to be seen in the market?… Understand that God has given thee children with her, and art made a father, and by such reason appease thyself. Doest thou not see the husbandmen what diligence they use to till that ground which once they have taken to farm, though it be never so full of faults? As for an example, though it be dry, though it brings forth weeds, though the soil cannot bear too much wet, yet he tills it, and so wins fruit thereof… But thou peradventure wilt say that she is a wrathful woman, a drunkard, and beastly, without wit and reason. For this cause bewail her the more. Chase not in anger, but pray unto Almighty God. Let her be admonished and helped with good counsel, and do thou thy best endevor, that she may be delivered of all these affections. But if thou shouldest beat her, thou shalt increase her evil affections: For frowardness and sharpness is not amended with frowardness, but with softness and gentleness. Furthermore, consider what reward thou shalt have at God’s hand: For where thou mightest beat her, and yet, for the respect of the fear of God, thou wilt abstain and bear patiently her great offences, the rather in respect of that Law which forbids that a man should cast out his wife what fault soever she be made the combred with, thou shalt have a very great reward, and before the receit of that reward, thou shalt feel many commodities. For by this meanes she shall bee more obedient, and thou for her sake shalt be made the more meek.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/church-of-england.html">Church of England</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Second Book of Homilies</cite>, 18. ‘An Homily of the State of Matrimony’</span></figcaption>

ss+the+inconvenience+that+is+to+see+what+weepings+and+walings+be+made+in+the+open+streets+when+neighbors+run+together+to+the+house+of+so+unruly+an+husband%2C+as+to+a+Bedlem+man%2C+who+goes+about+to+overturn+all+that+he+has+at+home%3F+Who+would+not+think+that+it+were+better+for+such+a+man+to+wish+the+ground+to+open%2C+and+swallow+him+in%2C+than+once+ever+after+to+be+seen+in+the+market%3F%E2%80%A6+Understand+that+God+has+given+thee+children+with+her%2C+and+art+made+a+father%2C+and+by+such+reason+appease+thyself.+Doest+thou+not+see+the+husbandmen+what+diligence+they+use+to+till+that+ground+which+once+they+have+taken+to+farm%2C+though+it+be+never+so+full+of+faults%3F+As+for+an+example%2C+though+it+be+dry%2C+though+it+brings+forth+weeds%2C+though+the+soil+cannot+bear+too+much+wet%2C+yet+he+tills+it%2C+and+so+wins+fruit+thereof%E2%80%A6+But+thou+peradventure+wilt+say+that+she+is+a+wrathful+woman%2C+a+drunkard%2C+and+beastly%2C+without+wit+and+reason.+For+this+cause+bewail+her+the+more.+Chase+not+in+anger%2C+but+pray+unto+Almighty+God.+Let+her+be+admonished+and+helped+with+good+counsel%2C+and+do+thou+thy+best+endevor%2C+that+she+may+be+delivered+of+all+these+affections.+But+if+thou+shouldest+beat+her%2C+thou+shalt+increase+her+evil+affections%3A+For+frowardness+and+sharpness+is+not+amended+with+frowardness%2C+but+with+softness+and+gentleness.+Furthermore%2C+consider+what+reward+thou+shalt+have+at+God%E2%80%99s+hand%3A+For+where+thou+mightest+beat+her%2C+and+yet%2C+for+the+respect+of+the+fear+of+God%2C+thou+wilt+abstain+and+bear+patiently+her+great+offences%2C+the+rather+in+respect+of+that+Law+which+forbids+that+a+man+should+cast+out+his+wife+what+fault+soever+she+be+made+the+combred+with%2C+thou+shalt+have+a+very+great+reward%2C+and+before+the+receit+of+that+reward%2C+thou+shalt+feel+many+commodities.+For+by+this+meanes+she+shall+bee+more+obedient%2C+and+thou+for+her+sake+shalt+be+made+the+more+meek.%E2%80%9D%0A%0A%E2%80%94+No%2C+Anglican+Church+%7C+Second+Book+of+Homilies <blockquote><p>It is to be carefully observed, that Paul, though an apostle, does not himself, as an individual, excommunicate according to his own pleasure [in 1 Cor. 5], but consults with the Church, that the matter may be transacted by common authority. He, it is true, takes the lead, and shows the way, but, in taking others as his associates, he intimates with sufficient plainness, that this authority does not belong to any one individual. As, however, a multitude never accomplishes anything with moderation or seriousness, if not governed by counsel, there was appointed in the ancient Church a presbytery, that is, an assembly of elders, who, by the consent of all, had the power of first judging in the case. From them the matter was brought before the people, but it was as a thing already judged of. Whatever the matter may be, it is quite contrary to the appointment of Christ and his apostles — to the order of the Church, and even to equity itself, that this right should be put into the hands of any one man, of excommunicating at his pleasure any that he may choose. Let us take notice, then, that in excommunicating this limitation be observed — that this part of discipline be exercised by the common counsel of the elders, and with the consent of the people, and that this is a remedy in opposition to tyranny. For nothing is more at variance with the discipline of Christ than tyranny, for which you open a wide door, if you give one man the entire power.</p></blockquote>

<main class="wrap"><figure class="quote" id="q-5dd5cce50b" data-kw="">
<blockquote><p>Reformed moral philosophers in the period of early orthodoxy (ca. 1550–ca. 1650) continue a medieval tradition of engaging moral questions in conversation with Aristotle’s Nicomachean Ethics, and they often address the moral status of self-love in connection with the virtue of friendship. There is broad agreement among these authors that self-love is not only not necessarily sinful, but that some kinds of self-love are morally good and that self-love is the source and rule for love of one’s neighbor. Lambert Daneau’s Ethices Christianae, however, stands in a more complex relationship to this consensus.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/andrew-mcginnis.html">Andrew McGinnis</a></span><span class="wk"><span class="lbl">Work:</span> <cite>‘The Moral Status of Self-Love in Early Reformed Ethics’ in Journal of Early Modern Christianity Ref</cite>, (2023)</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/the-christian-life/obedience-and-profession.html">Obedience and Profession</a></span></div>

</figure><figure class="quote" id="q-1ec541e6ce" data-kw="">
<blockquote><p>Now from gymnastic art those sports will have to be proposed to youth which, besides what they contribute to the health and preservation of the body and the production of graceful movements, also render men fit and ready for military service and the advantageous use of arms. Young men should therefore exercise themselves in running, jumping, wrestling, horseback riding, the handling of all arms and weapons which are used for open and hand-to-hand combat, the arrangement of battle formations, the positioning of camp, and mock battle (Plato, Laws, VII, 803c, 813d-e). To these, nobles may add the exercise of hunting. These exercises which pertain to military science ought to be so constituted and conducted in such a serious manner that they approximate as much as possible the actual operations of war, as Plato has said (Plato, Laws VII, 824 a-c)… according to the words of the psalm: ‘It is God who girds me with strength for war and prepares my path’ (Ps. 18:32). In charge of these sports, as of the kind previously mentioned, there should always be men singularly experienced in the field involved, men of universal wisdom most zealous for all piety and virtue, who are admired and therefore have the authority and power to relate and to adapt all youthful sport to a zeal for and practice of the virtues, which is the one goal of all sports among Christians; for we have been created for the praise of God…</p></blockquote>

<blockquote><p>…where both [both things to be preserved] cannot be jointly put out of danger: but all this amounts not to a disobligement from the endeavor of preserving them all; nor to a liberty upon any emergency of active, direct and purposed making away or removing of any of them, though under pretense of securing the other. I have read of one Alcon, who finding his son fast on sleep upon the grass, and a serpent creeping upon his breast, he not apprehending how otherwise it was possible to save his son, took his bow and shot at the serpent upon the boys breast, which (though to the manifest endangering of his life) yet he chose rather to take that course than by suffering the serpent to leave his life to a more certain destruction; And either his art or good hap was such as that he prevented and slew the serpent and preserved his son: those whom we are bound and most solicitous to preserve, we may upon an extreme exigence put in some hazard that we may preserve them…</p></blockquote>

<blockquote><p>§1. Question 1: Must I always do as I would be done by? Or has this rule any exceptions? Answer: The rule intends no more but that your just self-denial and love to others be duly exercised in your dealings with all. And:

1. It supposes that your own will or desires be honest and just, and that God’s Law be their rule. For a sinful will may not be made the rule of your own actions or of other men’s. He that would have another make him drunk, may not therefore make another drunk: And he that would abuse another man’s wife, may not therefore desire that another man would lust after or abuse his wife. He that would not be instructed, reproved or reformed, may not therefore forbear the instructing or reproving others. And he that would kill himself, may not therefore kill another. But he that would have no hurt done to himself injuriously should do none to others: And he that would have others do him good, should be as willing to do good to them.

2. It supposes that the matter be to be varied according to your various conditions. A parent that justly desires his child to obey him, is not bound therefore to obey his child; nor the prince to obey his subjects; nor the master to do all the work for his servants, which he would have his servants do for him. But you must deal by another as you would (regularly) have them deal by you, if you were in their case, and they in yours. And on these terms it is a rule of righteousness.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/richard-baxter.html">Richard Baxter</a></span><span class="wk"><span class="lbl">Work:</span> <cite>A Christian Directory, or a Sum of Practical Theology</cite>, (London, 1673), pt. 4, ch. 19, title 2, p. 114</span></figcaption>

<blockquote><p>Our God being love, even love itself, 1 John iv. 16, ‘And we have known and believed the love God hath to us. God is love; and he that dwelleth in love dwelleth in God, and God in him.’ Our God loving, where he sets his love, with an infinite love as himself is, which love of all things else in him he loves to shew the utmost of, and of all works, works of love have the most delight in them, therefore mercy is called his delight, his darling: Micah vii. 18, ‘Who is a God like unto thee, that pardoneth iniquity, and passeth by the transgression of the remnant of his heritage? He retaineth not his anger for ever, because he delighteth in mercy.’

Our God being thus love, and mercy his delight, he would gladly shew how well he could love creatures, he was most glad of the greatest opportunity to shew it; therefore he resolves upon this course, to reconcile enemies, whatsoever it should cost. And the more they should cost him, the gladder should they be. The making of a thousand new friends could not have expressed so much love as the reconciling one enemy. To love and delight in friends, who had never wronged him, was too narrow, shallow, and slight a way. He had heights, depths, breadth of love: Eph. iii. 18, ‘May be able to comprehend with all saints what is the breadth, and length, and depth, and height.’ Which heights and depth of love he would make known, and which nothing but the depths of our misery could have drawn out.

And that this is the reason, see Rom. v. 8, 10, ‘But God commendeth his love towards us, in that, while we were yet sinners, Christ died for us.’ Ver. 10, ‘For if, when we were enemies, we were reconciled to God by the death of his Son, much more, being reconciled, we shall be saved by his life.’ God commends his love towards us, that whilst we were yet enemies, he gave his Son for us, not to be born only, but to die. Both our being sinners, and his giving his Son, commends or sets out his love; and that he might commend it, he pitcheth on this course.

And that this love should be pitched upon men, not the angels that fell, it yet further commends his love. There were but two sorts of sinners whose sins could be taken away; and of the twain, who would not have thought but the fallen angels should have been propounded first, and have passed more easily? They were fairer and better creatures than we; and if he regarded service, one of them was able to do him more than a thousand of us. When he had bought us, he must be at a great deal of more trouble to preserve and tend us, than we were able ever to requite in service and attendance upon him. He must allow us much of our time to sleep, and eat, and to be idle in; to refresh our bodies, and tend us as you would tend a child; rock us asleep every night, and make our beds in sickness; Ps. xli. 3, ‘The Lord will strengthen him upon the bed of languishing: thou wilt make all his bed in his sickness;’ and feed us himself in due season. Whereas the angels, they could stand in his presence day and night, and not be weary. And, besides, the nature of the angels had been a fitter match a great deal for his Son. They are spirits, and so in a nearer assimilation to him.

Whoever thought he should close to match so low as with us? All this makes for us still the more love, for it was the more free. And the more unlikely it is that he could love such as we, the more his love is commended. The less we could do for him or for ourselves, the more it would appear he did for us. He is honoured more in our dependence than our service. He hath regard to the lowness of his spouse and handmaids, and lets the mighty go, principalities and powers; he loves still to prefer the younger, and make the elder serve them. Rom. ix. The angels are ministering spirits for their good. Among men he culls out still the poor, the foolish, not many wise or noble; and he makes as unlikely a choice amongst his creatures.</p></blockquote>

<blockquote><p>(4.) In the fourth place, that it is not enough to consider this oneness [between Christ and the elect] as decreed; we must consider it as specially and expressly covenanted: not merely as decreed by the sovereign authority of the Godhead, but covenanted between the eternal Father and the eternal Son.

To trace the oneness between Christ and His people to a Divine decree may honour the Godhead: but does it honour the Trinity in Godhead? On the contrary, it refuses recognition of the Trinity, precisely in that grand manifestation in which the doctrine of the Trinity — the truth of the distinct personalities of the Divine persons — is most especially to be recognised. There is no revelation of the Trinity in Godhead comparable to that which is afforded by the Covenant of Grace.

To “us men, and” in “our salvation,” the doctrine of the Trinity is commended, as at once revealed and precious, as placed in clearest evidence in the distinct actings of the persons of the Godhead in that Divine compact which is the spring and fountainhead of our eternal hopes. And even “to the principalities and powers in heavenly places,” it is probable, “there is made known by the Church” and her covenanted salvation, in the most eminent possible demonstration, the subsistence of three persons in the one Divine Being.

To be satisfied, therefore, with regarding Christ’s oneness with His people as simply decreed and not covenanted, would be a very grave mistake; a mistake for which indeed there can be no excuse, as there can surely be no intelligible temptation. Moreover, it were to pretermit the due recognition of the voluntariness of Christ’s susception and entire accomplishment of the work given Him to do. And still further, it were to overlook the splendid evidence of love as the great originating principle and motive of His redemption. There is a certain aspect of coldness about a mere decree. Practically, in the mind’s view, it comes too closely to be identified, in point of impression, with the idea of cold, dead, impersonal fate. Unitarianism is ever doomed to have this practical outgoing.

It is in Trinity that provision is seen for the vivid warmth of personality and personal love; and especially in the covenant of Trinity for man’s redemption. There are distinct personal actings of the Father, and of the Son, and of the Spirit, in the Covenant. There are distinct actings of the will of the Father, and of the will of the Son in that oneness that is constituted between Christ and His people, and which justifies and bears up all that is achieved for their salvation. And these actings of will are actings of love.

Hear the overflowings of love from Christ’s heart, as His achievements for His people are by Himself referred back upon the loving deed by which the Father made them over to Him to be His own:— “O righteous Father, Thine they were, and Thou gavest them Me, and I have kept them.” He means to say: Therefore, for that reason, have I kept them; even as I would keep that love-gift of Thine, which I did so willingly and lovingly receive.

Identified, by loving covenant between Himself and the Father, with the people given unto Him; truly representing them, because identified in covenanted oneness with them; He becomes their competent and acceptable substitute and surety,—His substitution in every light most justifiable in the eye of law most stringent and of righteousness inexpugnable. And the vindication of His vicarious sacrifice of Himself for their salvation, is set on high in the intelligent and joyful convictions of the poor and needy, beyond the possibility of any sinister and false philosophy endangering it.

While the Divine Head of the Church has, in His great goodness, long kept these views before men’s minds in Scotland, we cannot but cherish a deep sympathy — we would say pity, but that the word might be considered invidious, while no such feeling is in our heart — towards many earnest and noble minds in Germany, evidently inquiring with the greatest ardour after the truth as it is in Jesus Christ, but baffled because the covenant oneness between Redeemer and redeemed has not yet come into their field of vision. It is the doctrine of the Covenant that they need.

No wonder that, in ignorance of this great guiding principle, to a beautiful and so love-worthy spirit as that of [Karl] Ullmann, “substitution” should seem an arbitrary and capricious thing; and that to many others “imputation” should be obnoxious, as a mere make-believe and legal fiction, with which they cannot accredit the God of truth. Moral instinct, the dictates of pious feeling, and Holy Scripture all combine to convince them that “the judgment of God must be according to truth.” That moral axiom — that sacred spiritual postulate — they feel they must at all hazards conserve. And they are right. Any doctrine of Atonement or of justification that should impugn it, is thereby necessarily demonstrated to be false.

But let Christ and His people be federally one, by the sovereign authority and love of the Father, and by the voluntary covenanted acceptation of the Son. In that case, legal fiction, make-believe, arbitrariness and caprice, are at the furthest possible remove from the Divine Covenant transaction of our redemption, — alike from the basis of it, and from all the fruits of it. “Christ bears the sins of many,” because, in His covenanted identification with these “many,” their sins are sinlessly and truly His sins. And unto the same ” many sons and daughters” of the Covenant, the Father imputes the righteousness of the Son, because, in their covenant oneness with the Son, His righteousness is undeservedly but truly their own righteousness. And all throughout, “the judgment of God is according to truth.</p></blockquote>

ion+of+the+voluntariness+of+Christ%E2%80%99s+susception+and+entire+accomplishment+of+the+work+given+Him+to+do.+And+still+further%2C+it+were+to+overlook+the+splendid+evidence+of+love+as+the+great+originating+principle+and+motive+of+His+redemption.+There+is+a+certain+aspect+of+coldness+about+a+mere+decree.+Practically%2C+in+the+mind%E2%80%99s+view%2C+it+comes+too+closely+to+be+identified%2C+in+point+of+impression%2C+with+the+idea+of+cold%2C+dead%2C+impersonal+fate.+Unitarianism+is+ever+doomed+to+have+this+practical+outgoing.%0A%0AIt+is+in+Trinity+that+provision+is+seen+for+the+vivid+warmth+of+personality+and+personal+love%3B+and+especially+in+the+covenant+of+Trinity+for+man%E2%80%99s+redemption.+There+are+distinct+personal+actings+of+the+Father%2C+and+of+the+Son%2C+and+of+the+Spirit%2C+in+the+Covenant.+There+are+distinct+actings+of+the+will+of+the+Father%2C+and+of+the+will+of+the+Son+in+that+oneness+that+is+constituted+between+Christ+and+His+people%2C+and+which+justifies+and+bears+up+all+that+is+achieved+for+their+salvation.+And+these+actings+of+will+are+actings+of+love.%0A%0AHear+the+overflowings+of+love+from+Christ%E2%80%99s+heart%2C+as+His+achievements+for+His+people+are+by+Himself+referred+back+upon+the+loving+deed+by+which+the+Father+made+them+over+to+Him+to+be+His+own%3A%E2%80%94+%E2%80%9CO+righteous+Father%2C+Thine+they+were%2C+and+Thou+gavest+them+Me%2C+and+I+have+kept+them.%E2%80%9D+He+means+to+say%3A+Therefore%2C+for+that+reason%2C+have+I+kept+them%3B+even+as+I+would+keep+that+love-gift+of+Thine%2C+which+I+did+so+willingly+and+lovingly+receive.%0A%0AIdentified%2C+by+loving+covenant+between+Himself+and+the+Father%2C+with+the+people+given+unto+Him%3B+truly+representing+them%2C+because+identified+in+covenanted+oneness+with+them%3B+He+becomes+their+competent+and+acceptable+substitute+and+surety%2C%E2%80%94His+substitution+in+every+light+most+justifiable+in+the+eye+of+law+most+stringent+and+of+righteousness+inexpugnable.+And+the+vindication+of+His+vicarious+sacrifice+of+Himself+for+their+salvation%2C+is+set+on+high+in+the+intelligent+and+joyful+convictions+of+the+poor+and+needy%2C+beyond+the+possibility+of+any+sinister+and+false+philosophy+endangering+it.%0A%0AWhile+the+Divine+Head+of+the+Church+has%2C+in+His+great+goodness%2C+long+kept+these+views+before+men%E2%80%99s+minds+in+Scotland%2C+we+cannot+but+cherish+a+deep+sympathy+%E2%80%94+we+would+say+pity%2C+but+that+the+word+might+be+considered+invidious%2C+while+no+such+feeling+is+in+our+heart+%E2%80%94+towards+many+earnest+and+noble+minds+in+Germany%2C+evidently+inquiring+with+the+greatest+ardour+after+the+truth+as+it+is+in+Jesus+Christ%2C+but+baffled+because+the+covenant+oneness+between+Redeemer+and+redeemed+has+not+yet+come+into+their+field+of+vision.+It+is+the+doctrine+of+the+Covenant+that+they+need.%0A%0ANo+wonder+that%2C+in+ignorance+of+this+great+guiding+principle%2C+to+a+beautiful+and+so+love-worthy+spirit+as+that+of+%5BKarl%5D+Ullmann%2C+%E2%80%9Csubstitution%E2%80%9D+should+seem+an+arbitrary+and+capricious+thing%3B+and+that+to+many+others+%E2%80%9Cimputation%E2%80%9D+should+be+obnoxious%2C+as+a+mere+make-believe+and+legal+fiction%2C+with+which+they+cannot+accredit+the+God+of+truth.+Moral+instinct%2C+the+dictates+of+pious+feeling%2C+and+Holy+Scripture+all+combine+to+convince+them+that+%E2%80%9Cthe+judgment+of+God+must+be+according+to+truth.%E2%80%9D+That+moral+axiom+%E2%80%94+that+sacred+spiritual+postulate+%E2%80%94+they+feel+they+must+at+all+hazards+conserve.+And+they+are+right.+Any+doctrine+of+Atonement+or+of+justification+that+should+impugn+it%2C+is+thereby+necessarily+demonstrated+to+be+false.%0A%0ABut+let+Christ+and+His+people+be+federally+one%2C+by+the+sovereign+authority+and+love+of+the+Father%2C+and+by+the+voluntary+covenanted+acceptation+of+the+Son.+In+that+case%2C+legal+fiction%2C+make-believe%2C+arbitrariness+and+caprice%2C+are+at+the+furthest+possible+remove+from+the+Divine+Covenant+transaction+of+our+redemption%2C+%E2%80%94+alike+from+the+basis+of+it%2C+and+from+all+the+fruits+of+it.+%E2%80%9CChrist+bears+the+sins+of+many%2C%E2%80%9D+because%2C+in+His+covenanted+identification+with+these+%E2%80%9Cmany%2C%E2%80%9D+their+sins+are+sinlessly+and+truly+His+sins.+And+unto+the+same+%E2%80%9D+many+sons+and+daughters%E2%80%9D+of+the+Covenant%2C+the+Father+imputes+the+righteousness+of+the+Son%2C+because%2C+in+their+covenant+oneness+with+the+Son%2C+His+righteousness+is+undeservedly+but+truly+their+own+righteousness.+And+all+throughout%2C+%E2%80%9Cthe+judgment+of+God+is+according+to+truth.%E2%80%9D%0A%0A%E2%80%94+Hugh+Martin%2C+The+Atonement%3A+In+its+Relations+to+the+Covenant%2C+the+Priesthood%2C+the+Intercession+of+our+Lord%2C+%28London%3A+James+Nisbet+%26+Co.%2C+1870%29%2C+pp+35-39.&amp;url=https%3A%2F%2F5solasquotes.github.io%2Fquote%2F5b7335c993.html&amp;via=5Solas" target="_blank" rel="noopener">Share on X</a><a class="perma" href="../quote/5b7335c993.html">Permalink</a><a class="src" href="https://reformedcovenanter.wordpress.com/2019/05/14/hugh-martin-on-the-trinity-and-the-covenant-of-grace-for-mans-redemption/" rel="noopener" target="_blank">Read it online · Reformed Covenanter</a></div>

<blockquote><p>All they which are the sons of the promise are the seed of Abraham or the sons of God: but Isaac is a son of promise and not Ismael: therefore Isaac is the seed of Abraham and heir of the blessing, and not Ismael. The proposition is in the 8. Verse [of Romans 9], the assumption in the 9. vers. the conclusion in the 7. verse. Here mark, I. how he makes a double seed, one according to the flesh, the other spiritual: and two kind of sons, one of the flesh, the other son of the promise or the son of God: for he puts the one for the other. II. that the distinction between Isaac and Ismael, whereby one is in the covenant of grace, the other not; stands not in their foreseen saith and unbelief, and the fruits of them: but in the purpose and will of God itself.

For Isaac is called the child of promise, because by the virtue of it he was born, and believed, and was adopted the child of God, and made heir of the covenant given to Abraham: and therefore consequently the right of adoption befell him by the mere good pleasure of God, which is the first cause of our salvation, without respect of any thing in the person of Isaac. For what God by his promise brings to pass in time, that he most freely decreed before all times.

Now considering the Jews might say that Ismael was rejected, because he was borne of the hand-maid Hagar, whereas they, for their parts descend of Abraham and Sarai; by Isaac the lawful son, Paul adds a third example of the distinction between man and man out of the family of Isaac, in which Jacob was a true son and heir of the promise, and Esau was not. Now the distinction of these two persons is propounded in the 10. vers. and confirmed verse 11, 12, 13. in which are set down three things: I. the time of this distinction, yer the children were borne, and therefore when they had neither done good nor evil. And this circumstance is noted, to show, that God was not moved by any persuasion or preconsideration of Jacob’s godliness and Esau’s profaneness to prefer the one before the other.

II. the end why the distinction was made at this time and not afterward when they were born is, that the purpose of God which is according to his election might remain sure, not of works but by him that calleth: that is, that by this means it might appear, that when God receives any man into the covenant of eternal life, it proceeds not of any dignity in the man whom God calleth, but from his mercy and alone good pleasure, that his decree of saving the elect might remain firm and sure forever.

Hence it is manifest that there is an unchangeable decree of election of some men (for he that takes all and accepts none can not be said to choose) to salvation, depending upon the alone will of God; and therefore necessarily by the law of contraries, there is an opposite decree of reprobation: for in that God ordaineth some to eternal salvation, he testifies thereby, that his purpose is to pass by some without shewing of mercy.</p></blockquote>

<blockquote><p>This passage [Galatians 2:6] reminds us that we should not condemn or reject people on the basis of their former life. Just as the apostles were no better than Paul merely because they had known Christ personally during his earthly life, so he was no worse or inferior to them merely because he had lived his life from childhood according to the whims of the Pharisees and had been a persecutor of the church.

The radiance of God’s grace could not have shone more brightly in him and (as he writes about himself) his only boast was Jesus Christ. He wanted to show that all mercy was found in him and be an example to those who would in the future believe in eternal life. God does not look on people as they once were but only as they now are.…

Again, and on the other end of the spectrum, God does not spare anyone merely because of his former virtues and achievements if they take a turn for the worse, abandon the station in which God has placed them and move over to the devil’s camp. Their condition is worse and their ingratitude detestable, because they have ignominiously trampled on the free gifts of God.</p></blockquote>

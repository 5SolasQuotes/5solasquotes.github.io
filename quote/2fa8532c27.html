<blockquote><p>They [congregationalists] count it necessary that all the church officers should live upon the charge of the congregation, the ruling elders and deacons as well as the pastors and doctors; but all they will have them to receive, is a mere alms, a voluntary contribution, laid down as an offering at the deacons’ feet every Lords Day, and by him distributed to all the officers and the poor of the congregation according as they have need. This is their doctrine, but it seems they are weary long ago of its practice.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/robert-baillie.html">Robert Baillie</a></span><span class="wk"><span class="lbl">Work:</span> <cite>A Dissuasive from the Errors of the Time, wherein the Tenets of the Principal Sects, Especially of the Independents, are Drawn Together in One Map (1645), ch. 6, p. 117 Baillie was a Scottish presbyterian.</cite></span></figcaption>

</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-035d8f0bf3" data-kw="">
<blockquote><p>Here it may be considered whether every adjunct of worship instituted of God does by that institution become a matter or part of worship, which otherwise it would not be. Some say that in the old Law the least ceremony prescribed of God was a part of worship, which assertion I do not now so far examine as to declare my assent or dissent. But if it were so, I think it was not merely as prescribed of God, but upon some further reason. For I do not see that God cannot prescribe a mere adjunct of worship, but it must thereby lose its formal state, or become formally another thing, viz. a matter of worship, but think it may remain in its own state, a mere adjunct still. Nevertheless, the observation of that divinely prescribed adjunct may be an act of worship so far as every act of obedience to God as such may be so called. But here we speak of worship, not in so large, but in the stricter sense.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/john-corbet.html">John Corbet</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Remains of the Reverend &amp; Learned Mr. John Corbet (London, 1684), Of Divine Worship, pt. 1, §16. ‘Of Time &amp; Place considered as Adjuncts, or as Matter of Worship’</cite>, pp. 184-85.</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/worship/ceremonies-and-things-indifferent.html">Ceremonies and Things Indifferent</a></span></div>

<blockquote><p>His [Knewstubs’s] objection against the cross consisted of three interrogatories: 1. Whether the Church had power to institute an external significant sign? To which was replied: First, that he did mistake the use of the cross with us, which was not used in baptism any otherwise than only as a ceremony. Secondly, by their own example, who make imposition of hands in their ordination of pastors to be a sign significant. Thirdly, in prayer, says the Bishop of Winton, the kneeling on the ground, the lifting up of our hands, the knocking of our breasts are ceremonies significant: the first, of our humility coming before the mighty God, the second, of our confidence and hope, the other of our sorrow and detestation of our sins, and these are, and may lawfully be used. Lastly, M. Deane of the chapel, remembered the practice of the Jews, who unto the institution of the Passeover, prescribed unto them by Moses, had as the rabbins witness added both signs and words, eating sour herbs and drinking wine, with these words to both, ‘Take, and eat these in remembrance, etc. Drink this in remembrance, etc.’ Upon which addition and tradition of theirs, our Sauiour instituted the sacrament of his Last Supper, in celebrating it with the same words and after the same manner; thereby approving that fact of theirs in particular; and generally, that a Church may institute and retain a sign significant: which satisfied his Maiesty exceeding well. And here the king desired, to have himself made acquainted about the antiquity of the use of the cross. Which Doctor [John] Reynolds confessed to have been ever since the apostles times, but this was the difficulty, to prove it of that ancient use in baptism… it fell from one, I think it was my Lord of Winchester, obiter, to say, that, in Constantine’s time it was used in baptism. What, quoth the King, and is it now come to that pass that we shall appeach Constantine of Popery and superstition; if then it were used, says his Majesty, I see no reason but that still we may continue it. Mr. Knewstubs’s second question was that, put [the] case [that] the Church had such power to add significant signs, whether it might there add them where Christ had already ordained one; which he said, was no less derogatory to Christ’s institution, as he thought, than if any potentate of this land should presume to add his seal unto the great seal of England. To which his Majesty answered that the case was not alike, for that no sign or thing was added to the sacrament, which was fully and perfectly finished, before any mention of the cross is made; for confirmation whereof, he willed the place to be read [in the Book of Common Prayer]. Lastly, if the Church had that power also, yet the greatest scruple to their conscience was, how far such an ordinance of the Church was to bind them, without impeaching their Christian liberty? Whereat the king, as it seemed, was much moved, and tolde him he would not argue that point with him, but answer therein as kings are wont to speak in Parliament, Le Roy J’auisera: adding withall, that it smelled very rankly of Anabaptism: comparing it unto the usage of a beardless boy (one Mr. John Black) who the last Conference his Majesty had with the ministers in Scotland (in December, 1602) told him that he would hold conformity with his Majesty’s ordinances for matters of doctrine: but for matters of ceremony, they were to be left in Christian liberty unto every man as he received more and more light from the illumination of God’s Spirit; even till they go mad, quoth the king, with their own light: but I will none of that, I will have one doctrine and one discipline, one religion in substance, and in ceremony: and therefore I charge you, never speak more to that point (how far you are bound to obey?) when the Church has ordained it. And so asked them again, if they had anything else to say? Dr. Reynolds objected the example of the brasen serpent, demolished and stamped to powder by Ezekiel, because the people abused it to idolatry: wishing, that, in like sort, the cross should be abandoned, because in the time of Popery it had been superstitiously abused. Whereunto the King’s Majesty answered diverse ways. First, quoth he, though I be sufficiently persuaded of the cross in baptism, and the commendable use thereof in the Church so long: yet, if there were nothing else to move me, this very argument were an inducement to me for the retaining of it, as it is now by order established: For, inasmuch, as it was abused, so you say, to superstition in time of popery, it does plainly imply, that it was well used before Popery. I will tell you, I haue lived among this [dissenting] sort of men (speaking to the lords and bishops) ever since I was ten years old, but I may say of myself as Christ did of Himself: Though I lived amongst them, yet since I had ability to judge, I was never of them; neither did anything make me more to condemn and detest their courses than that they did so peremptorily disallow of all things which at all had been used in Popery. For my part, I know not how to answer the objection of the Papists, when they charge us with novelties: but truly to tell them that their abuses are new, but the things which they abused we retain in their primitive use, and forsake only the novel corruption. By this argument we might renounce the Trinity and all that is holy, because it was abused in Popery (and speaking to Doctor Reynolds merely) they used to wear hose and shoes in Popery, therefore, you shall, now, go barefoot. Secondly, quoth his Majesty, what resemblance is there between the brazen serpent, a material visible thing, and the sign of the cross made in the air? Thirdly, I am given to understand by the bishops, and I find it true, that the Papists themselves did never ascribe any power or spiritual grace to the sign of the cross in baptism. Fourthly, you see, that the material crosses, which in time of Popery were made, for men to fall down before them, as they passed by them, to worship them (as the idolatrous Jews did the brazen serpent) are demolished, as you desire.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/king-james-i.html">King James I</a></span><span class="wk"><span class="lbl">Work:</span> <cite>ed. William Barlow, The Sum &amp; Substance of the Conference which it pleased his excellent Majesty to have with the Lords, Bishops &amp; other of his Clergy… at Hampton Court, January 14, 1603 (London: Windet, 1604), 2nd Day</cite>, pp. 67-74</span></figcaption>

BJohn%5D+Reynolds+confessed+to+have+been+ever+since+the+apostles+times%2C+but+this+was+the+difficulty%2C+to+prove+it+of+that+ancient+use+in+baptism%E2%80%A6+it+fell+from+one%2C+I+think+it+was+my+Lord+of+Winchester%2C+obiter%2C+to+say%2C+that%2C+in+Constantine%E2%80%99s+time+it+was+used+in+baptism.+What%2C+quoth+the+King%2C+and+is+it+now+come+to+that+pass+that+we+shall+appeach+Constantine+of+Popery+and+superstition%3B+if+then+it+were+used%2C+says+his+Majesty%2C+I+see+no+reason+but+that+still+we+may+continue+it.+Mr.+Knewstubs%E2%80%99s+second+question+was+that%2C+put+%5Bthe%5D+case+%5Bthat%5D+the+Church+had+such+power+to+add+significant+signs%2C+whether+it+might+there+add+them+where+Christ+had+already+ordained+one%3B+which+he+said%2C+was+no+less+derogatory+to+Christ%E2%80%99s+institution%2C+as+he+thought%2C+than+if+any+potentate+of+this+land+should+presume+to+add+his+seal+unto+the+great+seal+of+England.+To+which+his+Majesty+answered+that+the+case+was+not+alike%2C+for+that+no+sign+or+thing+was+added+to+the+sacrament%2C+which+was+fully+and+perfectly+finished%2C+before+any+mention+of+the+cross+is+made%3B+for+confirmation+whereof%2C+he+willed+the+place+to+be+read+%5Bin+the+Book+of+Common+Prayer%5D.+Lastly%2C+if+the+Church+had+that+power+also%2C+yet+the+greatest+scruple+to+their+conscience+was%2C+how+far+such+an+ordinance+of+the+Church+was+to+bind+them%2C+without+impeaching+their+Christian+liberty%3F+Whereat+the+king%2C+as+it+seemed%2C+was+much+moved%2C+and+tolde+him+he+would+not+argue+that+point+with+him%2C+but+answer+therein+as+kings+are+wont+to+speak+in+Parliament%2C+Le+Roy+J%E2%80%99auisera%3A+adding+withall%2C+that+it+smelled+very+rankly+of+Anabaptism%3A+comparing+it+unto+the+usage+of+a+beardless+boy+%28one+Mr.+John+Black%29+who+the+last+Conference+his+Majesty+had+with+the+ministers+in+Scotland+%28in+December%2C+1602%29+told+him+that+he+would+hold+conformity+with+his+Majesty%E2%80%99s+ordinances+for+matters+of+doctrine%3A+but+for+matters+of+ceremony%2C+they+were+to+be+left+in+Christian+liberty+unto+every+man+as+he+received+more+and+more+light+from+the+illumination+of+God%E2%80%99s+Spirit%3B+even+till+they+go+mad%2C+quoth+the+king%2C+with+their+own+light%3A+but+I+will+none+of+that%2C+I+will+have+one+doctrine+and+one+discipline%2C+one+religion+in+substance%2C+and+in+ceremony%3A+and+therefore+I+charge+you%2C+never+speak+more+to+that+point+%28how+far+you+are+bound+to+obey%3F%29+when+the+Church+has+ordained+it.+And+so+asked+them+again%2C+if+they+had+anything+else+to+say%3F+Dr.+Reynolds+objected+the+example+of+the+brasen+serpent%2C+demolished+and+stamped+to+powder+by+Ezekiel%2C+because+the+people+abused+it+to+idolatry%3A+wishing%2C+that%2C+in+like+sort%2C+the+cross+should+be+abandoned%2C+because+in+the+time+of+Popery+it+had+been+superstitiously+abused.+Whereunto+the+King%E2%80%99s+Majesty+answered+diverse+ways.+First%2C+quoth+he%2C+though+I+be+sufficiently+persuaded+of+the+cross+in+baptism%2C+and+the+commendable+use+thereof+in+the+Church+so+long%3A+yet%2C+if+there+were+nothing+else+to+move+me%2C+this+very+argument+were+an+inducement+to+me+for+the+retaining+of+it%2C+as+it+is+now+by+order+established%3A+For%2C+inasmuch%2C+as+it+was+abused%2C+so+you+say%2C+to+superstition+in+time+of+popery%2C+it+does+plainly+imply%2C+that+it+was+well+used+before+Popery.+I+will+tell+you%2C+I+haue+lived+among+this+%5Bdissenting%5D+sort+of+men+%28speaking+to+the+lords+and+bishops%29+ever+since+I+was+ten+years+old%2C+but+I+may+say+of+myself+as+Christ+did+of+Himself%3A+Though+I+lived+amongst+them%2C+yet+since+I+had+ability+to+judge%2C+I+was+never+of+them%3B+neither+did+anything+make+me+more+to+condemn+and+detest+their+courses+than+that+they+did+so+peremptorily+disallow+of+all+things+which+at+all+had+been+used+in+Popery.+For+my+part%2C+I+know+not+how+to+answer+the+objection+of+the+Papists%2C+when+they+charge+us+with+novelties%3A+but+truly+to+tell+them+that+their+abuses+are+new%2C+but+the+things+which+they+abused+we+retain+in+their+primitive+use%2C+and+forsake+only+the+novel+corruption.+By+this+argument+we+might+renounce+the+Trinity+and+all+that+is+holy%2C+because+it+was+abused+in+Popery+%28and+speaking+to+Doctor+Reynolds+merely%29+they+used+to+wear+hose+and+shoes+in+Popery%2C+therefore%2C+you+shall%2C+now%2C+go+barefoot.+Secondly%2C+quoth+his+Majesty%2C+what+resemblance+is+there+between+the+brazen+serpent%2C+a+material+visible+thing%2C+and+the+sign+of+the+cross+made+in+the+air%3F+Thirdly%2C+I+am+given+to+understand+by+the+bishops%2C+and+I+find+it+true%2C+that+the+Papists+themselves+did+never+ascribe+any+power+or+spiritual+grace+to+the+sign+of+the+cross+in+baptism.+Fourthly%2C+you+see%2C+that+the+material+crosses%2C+which+in+time+of+Popery+were+made%2C+for+men+to+fall+down+before+them%2C+as+they+passed+by+them%2C+to+worship+them+%28as+the+idolatrous+Jews+did+the+brazen+serpent%29+are+demolished%2C+as+you+desire.%E2%80%9D%0A%0A%E2%80%94+King+James+I%2C+ed.+William+Barlow%2C+The+Sum+%26+Substance+of+the+Conference+which+it+pleased+his+excellent+Majesty+to+have+with+the+Lords%2C+Bishops+%26+other+of+his+Clergy%E2%80%A6+at+Hampton+Court%2C+January+14%2C+1603+%28London%3A+Windet%2C+1604%29%2C+2nd+Day%2C+pp.+67-74&amp;url=https%3A%2F%2F5solasquotes.github.io%2Fquote%2Ff2aa09de7d.html&amp;via=5Solas" target="_blank" rel="noopener">Share on X</a><a class="perma" href="../quote/f2aa09de7d.html">Permalink</a><a class="src" href="https://reformedbooksonline.com/on-ceremonies/#:~:text=His%20%5BKnewstubs%E2%80%99s%5D%20objection%20against%20the%20cross,serpent%29%20are%20demolished%2C%20as%20you%20desire." rel="noopener" target="_blank">Read it online · Reformed Books Online</a></div>
</figure><figure class="quote" id="q-65efbc49b5" data-kw="">
<blockquote><p>As for the veils wherewith the apostle would have women covered whileas they were praying (that is in their hearts following the public and common prayer) or prophesying (that is singing, 1 Sam. 10:10; 1 Chron. 25:1) they are worthy to be covered with shame as with a garment, who allege this example for sacred significant ceremonies of human institution. This covering was a moral sign, for that comely and orderly distinction of men and women which civil decency required in all their meetings: wherefore, that distinction of habits [garments], which they used for decency and comliness in their common behavior and conversation, the apostle will have them, for the same decency and comeliness still to retain in their holy assemblies. And further the apostle shows, that it is also a natural sign, and that nature itself teaches it: therefore he urges it both by the inferiority or subjection of the woman vv. 3. 8-9 (For covering was then a sign of subjection) and by the long hair which nature gives to a woman v. 15. Where he would have the artificial covering, to be fashioned in imitation of the natural. What need we anymore? Let us see nature’s institution, or the apostles’ recommendation for the controverted ceremonies (as we have seen them for women’s veils) and we yield the argument. Last of all, the sign of imposition of hands, helps not the cause of our Opposites, because it the example of Christ, and the apostles, and their disciples, which our ceremonies have not: yet we think not imposition of hands to be any sacred or mystical sign, but only a moral, for designation of a person: let them who think more highly or honorably of it, look to their warrants.</p></blockquote>

<blockquote><p>I shall therefore a little further explain this distinction and then show you the soundness of it, and then the exceeding usefulness and necessity of it, both in this and many other controversies: 1. For the title I choose rather to denominate it from the object than the act, because the diversity is in the object, but none in the species of the act naturally considered: Debitum and natural being are two distinct things; but ‘to will’ one and ‘to will’ the other is all one as to the nature of willing. God does as properly will duty as He wills natural beings. Yet if I must denominate it from the acts, I would distinguish between God’s Directive Will and his Legislative. For to call it voluntas praecepti is too narrow a term, for the precept is but one part of God’s Law and determines only of one sort of right, that is, of the dueness of obediential actions or forbearance of forbidden actions. But there is also a debitum praemii et beneficii–pure vel absolute–dati, et debitum poenae [debt of reward and benefit, whether purely or absolutely given, and a debt of punishment], which the rest of the Law, Testament or Covenant of God determines of, which must all be here included as well as the former. In sum, the Law determines: 1. What shall be due from us; 2. and what shall be due to us, and on what terms. I call it therefore, The will of God de eventu, et de debito [of event, and of debt], as such. I say ‘as such,’ for else they are coincident: For God’s will de rerum natura, vel existentia determines de debito quatenus evenit esse debitum [determines the nature or existence of things, and debt so far as debt comes about], but not qua debitum [as debt]. And his will de debito determines of the dueness of some events, not as eventual [as to the event], but as due. Or to avoid all ambiguity: call it God’s will de ente mere naturali [concerning merely natural being] and his will de debito morali [concerning moral debt], or Legislative or Governing. 2. And for the nature of the distinction, understand further that there are two acts which I call God’s will de debito: The first is that immanent act of his will by which He strictly and properly wills what shall be due. This also is twofold: 1. Productive, or instituting dueness; 2. and approbative, or taking complacency in duty. The former of these I principally intend, but exclude not the latter. God does eternally will every due, but it is not therefore eternally or from eternity due. For He wills from eternity (to speak vulgarly) only that this shall be due at such a time and by such a means. I say by such means: For though God’s will produce all dueness, yet only by means does He produce it. That means is the revelation of his will. 2. This revelation of God’s will de debito we call his Law. This therefore is the second thing which I call God’s will de debito, or his Legislative will, that is, the Law as it is signum voluntatis divinae [a sign of the divine will], that is, formally as a law. This I call God’s will de debito, only metonymically, as it is the sign of his will before expressed. If the proper will of God were separated from this, it would then be no producer of dueness or right at all, for it would be no law, no signum; it would lose its nature as abrogated laws do.</p></blockquote>

<div class="actions"><button class="copy" data-copy="“I shall therefore a little further explain this distinction and then show you the soundness of it, and then the exceeding usefulness and necessity of it, both in this and many other controversies: 1. For the title I choose rather to denominate it from the object than the act, because the diversity is in the object, but none in the species of the act naturally considered: Debitum and natural being are two distinct things; but ‘to will’ one and ‘to will’ the other is all one as to the nature of willing. God does as properly will duty as He wills natural beings. Yet if I must denominate it from the acts, I would distinguish between God’s Directive Will and his Legislative. For to call it voluntas praecepti is too narrow a term, for the precept is but one part of God’s Law and determines only of one sort of right, that is, of the dueness of obediential actions or forbearance of forbidden actions. But there is also a debitum praemii et beneficii–pure vel absolute–dati, et debitum poenae [debt of reward and benefit, whether purely or absolutely given, and a debt of punishment], which the rest of the Law, Testament or Covenant of God determines of, which must all be here included as well as the former. In sum, the Law determines: 1. What shall be due from us; 2. and what shall be due to us, and on what terms. I call it therefore, The will of God de eventu, et de debito [of event, and of debt], as such. I say ‘as such,’ for else they are coincident: For God’s will de rerum natura, vel existentia determines de debito quatenus evenit esse debitum [determines the nature or existence of things, and debt so far as debt comes about], but not qua debitum [as debt]. And his will de debito determines of the dueness of some events, not as eventual [as to the event], but as due. Or to avoid all ambiguity: call it God’s will de ente mere naturali [concerning merely natural being] and his will de debito morali [concerning moral debt], or Legislative or Governing. 2. And for the nature of the distinction, understand further that there are two acts which I call God’s will de debito: The first is that immanent act of his will by which He strictly and properly wills what shall be due. This also is twofold: 1. Productive, or instituting dueness; 2. and approbative, or taking complacency in duty. The former of these I principally intend, but exclude not the latter. God does eternally will every due, but it is not therefore eternally or from eternity due. For He wills from eternity (to speak vulgarly) only that this shall be due at such a time and by such a means. I say by such means: For though God’s will produce all dueness, yet only by means does He produce it. That means is the revelation of his will. 2. This revelation of God’s will de debito we call his Law. This therefore is the second thing which I call God’s will de debito, or his Legislative will, that is, the Law as it is signum voluntatis divinae [a sign of the divine will], that is, formally as a law. This I call God’s will de debito, only metonymically, as it is the sign of his will before expressed. If the proper will of God were separated from this, it would then be no producer of dueness or right at all, for it would be no law, no signum; it would lose its nature as abrogated laws do.”

— Richard Baxter, Universal Redemption of Mankind by the Lord Jesus Christ Stated &amp; Cleared… (London: Salusbury, 1694), ch. 2, pp. 28-32">Copy</button><a class="share" href="https://x.com/intent/post?text=%E2%80%9CI+shall+therefore+a+little+further+explain+this+distinction+and+then+show+you+the+soundness+of+it%2C+and+then+the+exceeding+usefulness+and+necessity+of+it%2C+both+in+this+and+many+other+controversies%3A+1.+For+the+title+I+choose+rather+to+denominate+it+from+the+object+than+the+act%2C+because+the+diversity+is+in+the+object%2C+but+none+in+the+species+of+the+act+naturally+considered%3A+Debitum+and+natural+being+are+two+distinct+things%3B+but+%E2%80%98to+will%E2%80%99+one+and+%E2%80%98to+will%E2%80%99+the+other+is+all+one+as+to+the+nature+of+willing.+God+does+as+properly+will+duty+as+He+wills+natural+beings.+Yet+if+I+must+denominate+it+from+the+acts%2C+I+would+distinguish+between+God%E2%80%99s+Directive+Will+and+his+Legislative.+For+to+call+it+voluntas+praecepti+is+too+narrow+a+term%2C+for+the+precept+is+but+one+part+of+God%E2%80%99s+Law+and+determines+only+of+one+sort+of+right%2C+that+is%2C+of+the+dueness+of+obediential+actions+or+forbearance+of+forbidden+actions.+But+there+is+also+a+debitum+praemii+et+beneficii%E2%80%93pure+vel+absolute%E2%80%93dati%2C+et+debitum+poenae+%5Bdebt+of+reward+and+benefit%2C+whether+purely+or+absolutely+given%2C+and+a+debt+of+punishment%5D%2C+which+the+rest+of+the+Law%2C+Testament+or+Covenant+of+God+determines+of%2C+which+must+all+be+here+included+as+well+as+the+former.+In+sum%2C+the+Law+determines%3A+1.+What+shall+be+due+from+us%3B+2.+and+what+shall+be+due+to+us%2C+and+on+what+terms.+I+call+it+therefore%2C+The+will+of+God+de+eventu%2C+et+de+debito+%5Bof+event%2C+and+of+debt%5D%2C+as+such.+I+say+%E2%80%98as+such%2C%E2%80%99+for+else+they+are+coincident%3A+For+God%E2%80%99s+will+de+rerum+natura%2C+vel+existentia+determines+de+debito+quatenus+evenit+esse+debitum+%5Bdetermines+the+nature+or+existence+of+things%2C+and+debt+so+far+as+debt+comes+about%5D%2C+but+not+qua+debitum+%5Bas+debt%5D.+And+his+will+de+debito+determines+of+the+dueness+of+some+events%2C+not+as+eventual+%5Bas+to+the+event%5D%2C+but+as+due.+Or+to+avoid+all+ambiguity%3A+call+it+God%E2%80%99s+will+de+ente+mere+naturali+%5Bconcerning+merely+natural+being%5D+and+his+will+de+debito+morali+%5Bconcerning+moral+debt%5D%2C+or+Legislative+or+Governing.+2.+And+for+the+nature+of+the+distinction%2C+understand+further+that+there+are+two+acts+which+I+call+God%E2%80%99s+will+de+debito%3A+The+first+is+that+immanent+act+of+his+will+by+which+He+strictly+and+properly+wills+what+shall+be+due.+This+also+is+twofold%3A+1.+Productive%2C+or+instituting+dueness%3B+2.+and+approbative%2C+or+taking+complacency+in+duty.+The+former+of+these+I+principally+intend%2C+but+exclude+not+the+latter.+God+does+eternally+will+every+due%2C+but+it+is+not+therefore+eternally+or+from+eternity+due.+For+He+wills+from+eternity+%28to+speak+vulgarly%29+only+that+this+shall+be+due+at+such+a+time+and+by+such+a+means.+I+say+by+such+means%3A+For+though+God%E2%80%99s+will+produce+all+dueness%2C+yet+only+by+means+does+He+produce+it.+That+means+is+the+revelation+of+his+will.+2.+This+revelation+of+God%E2%80%99s+will+de+debito+we+call+his+Law.+This+therefore+is+the+second+thing+which+I+call+God%E2%80%99s+will+de+debito%2C+or+his+Legislative+will%2C+that+is%2C+the+Law+as+it+is+signum+voluntatis+divinae+%5Ba+sign+of+the+divine+will%5D%2C+that+is%2C+formally+as+a+law.+This+I+call+God%E2%80%99s+will+de+debito%2C+only+metonymically%2C+as+it+is+the+sign+of+his+will+before+expressed.+If+the+proper+will+of+God+were+separated+from+this%2C+it+would+then+be+no+producer+of+dueness+or+right+at+all%2C+for+it+would+be+no+law%2C+no+signum%3B+it+would+lose+its+nature+as+abrogated+laws+do.%E2%80%9D%0A%0A%E2%80%94+Richard+Baxter%2C+Universal+Redemption+of+Mankind+by+the+Lord+Jesus+Christ+Stated+%26+Cleared%E2%80%A6+%28London%3A+Salusbury%2C+1694%29%2C+ch.+2%2C+pp.+28-32&amp;url=https%3A%2F%2F5solasquotes.github.io%2Fquote%2Fdcbe19221d.html&amp;via=5Solas" target="_blank" rel="noopener">Share on X</a><a class="perma" href="../quote/dcbe19221d.html">Permalink</a><a class="src" href="https://reformedbooksonline.com/topics/topics-by-subject/covenant-of-grace/the-mosaic-covenant/the-ceremonial-law/#:~:text=I%20shall%20therefore%20a%20little%20further,its%20nature%20as%20abrogated%20laws%20do." rel="noopener" target="_blank">Read it online · Reformed Books Online</a></div>

<main class="wrap"><figure class="quote" id="q-40b5bfce1f" data-kw="">
<blockquote><p>Wherefore we must grant two distinct covenants, rather than a twofold administration of the same covenant merely, to be intended. We must, I say, do so, provided always that the way of reconciliation and salvation was the same under both. But it will be said, —and with great pretense of reason, for it is that which is the sole foundation they all build upon who allow only a twofold administration of the same covenant, —&#x27;That this being the principal end of a divine covenant, if the way of reconciliation and salvation be the same under both, then indeed are they for the substance of them but one.&#x27; And I grant that this would inevitably follow, if it were so equally by virtue of them both. If reconciliation and salvation by Christ were to be obtained not only under the old covenant, but by virtue thereof, then it must be the same for substance with the new. But this is not so; for no reconciliation with God nor salvation could be obtained by virtue of the old covenant, or the administration of it, as our apostle disputes at large, though all believers were reconciled, justified, and saved, by virtue of the promise, whilst they were under the covenant.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/john-owen.html">John Owen</a></span><span class="wk"><span class="lbl">Work:</span> <cite>An Exposition of the Epistle to the Hebrews</cite>, 8:6; Works, vol. 22, p. 92</span></figcaption>

</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-ed7e8b1e1e" data-kw="">
<blockquote><p>On this consideration it is said, that the two covenants mentioned, the new and the old, were not indeed two distinct covenants, as unto their essence and substance, but only different administrations of the same covenant, called two covenants from some different outward solemnities and duties of worship attending of them.  […] But on the other hand, there is such express mention made, not only in this, but in sundry other places of the Scripture also, of two distinct covenants, or testaments, and such different natures, properties, and effects, ascribed unto them, as seem to constitute two distinct covenants.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/john-owen.html">John Owen</a></span><span class="wk"><span class="lbl">Work:</span> <cite>An Exposition of the Epistle to the Hebrews</cite>, 8:6; Works, vol. 22, p. 85</span></figcaption>

</figure><figure class="quote" id="q-18c1fcd7c3" data-kw="">
<blockquote><p>First, therefore, the apostle doth evidently in this place dispute concerning two covenants, or two testaments, comparing the one with the other, and declaring the disannulling of the one by the introduction and establishment of the other. What are these two covenants in general we have declared, — namely, that made with the church of Israel at mount Sinai, and that made with us in the gospel; not as absolutely the covenant of grace, but as actually established in the death of Christ, with all the worship that belongs unto it.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/john-owen.html">John Owen</a></span><span class="wk"><span class="lbl">Work:</span> <cite>An Exposition of the Epistle to the Hebrews</cite>, 8:6; Works, vol. 22, p. 84</span></figcaption>

</figure><figure class="quote" id="q-762c870450" data-kw="">

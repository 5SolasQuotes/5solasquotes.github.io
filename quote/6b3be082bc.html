<main class="wrap"><figure class="quote" id="q-6b3be082bc" data-kw="">
<blockquote><p>Now it is easy to everyone to know that when marriage is according to nature and God’s designation, when a woman is married to an husband she receives him as a guide, as a protector, a safeguard and defense, a shelter from harms and dangers, a reliever from distresses, a comforter in afflictions, a support in discouragements. God has so designed it, and therefore has made man of a more robust [nature], and strong in body and mind, with more wisdom strength and courage, fit to protect and defend; but he has made woman weaker, more soft and tender, more fearful, and more affectionate, as a fit object of generous protection and defense.

Hence it is, that it is natural in women to look most at valour and fortitude, wisdom, generosity and greatness of soul: these virtues do—or at least ought, according to nature—move most upon the affections of the woman. Hence also it is, that man naturally looks most at a soft and tender disposition of mind, and those virtues and affections which spring from it, such as humility, modesty, purity, chastity. And the affections which he most naturally looks at in her are a sweet and entire confidence and trust, submission and resignation; for when he receives a woman as wife, he receives her as an object of his guardianship and protection, and therefore looks at those qualifications and dispositions which exert themselves in trust and confidence.

Thus it’s against nature for a man to love a woman as wife that is rugged, daring and presumptuous, and trusts to herself, and thinks she is able to protect herself and needs none of her husband’s defense or guidance. And it is impossible a woman should love a man as an husband, except she can confide in him, and sweetly rest in him as a safeguard.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/jonathan-edwards.html">Jonathan Edwards</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Jonathan Edwards</cite>, 37. Faith in The “Miscellanies”: (Entry Nos. a-z, aa-zz, 1-500)</span></figcaption>

<blockquote><p>O Cyaraxe, tò te genos Epainô, kai tén paida, kai dôra; boulomai de, ephê sun tê toû patros gnómê, kai tes metros tanta sunainesai,” (Xenoph., Cyrop., book 8) which is englished in this manner: “Uncle Cyaraxis, I commend the stock and the maid, and the portion; howbeit” (saith he) “by the counsel of my father and mother I will assent unto you:” as if he had said, without their advice I can do nothing. All histories, philosophers and poets in a manner, are full of the practice of this duty (Terent in phormion). And no marvel, for this is agreeable to the common principle in nature, “Whatsoeuer ye would that other men should do unto you, do ye even so to them,” Mt. 7:12. Sampson saw a maid in Timnah that liked him well, notwithstanding he spake not one word to her, but came back to his parents, and desired them to make the marriage for him. They were the first whom he acquainted with his purpose: not as in our days, wherein commonly the parents are the last. Judg. 14:2, “Get her to me, for she pleaseth me well.</p></blockquote>

<blockquote><p>[1.] We do not speak of parents that are so far deprived of judgment, that they are not fit to determine this matter; nor, [2.] Such as have divested themselves of the natural affection of parents, and entertaining an ungrounded prejudice against some of their children, are endeavoring to expose them to ruin, that they may show more kindness to others. These forfeit that right, which is otherwise founded in nature. [3.] If parents, by refusing to comply with the desire of their children, plainly, in the judgment of the wisest of men, obstruct their happiness, and the glory of God herein. Or, if they have no reason for their not complying, or the reason given is contrary to the laws of God, or the common sense of all impartial judges; especially if the affair took its first rise from them, and afterwards they changed their mind, without sufficient ground. This, without doubt, lessens, or it may be so circumstanced, that it wholly takes away the charge of sin in the child, in acting contrary to the will of his parents, and fastens the guilt on them. [4.] The case is vastly different, when applied to children who are so far from being dependent on their parents, that they depend on them. Nevertheless, in this case, some deference and respect ought to be paid to them; and as it is the children’s duty, it may be their interest so to do; since we can hardly suppose, that parents, who depend on their children, would oppose their happiness, in an affair that is apparently contrary to their own interest, if they did not think that they had sufficient reason for it; which ought to be duly weighed, that it may be known, whether their advice is expedient to be complied with, or no. And if in this, or any other instance, children are obliged to act contrary to the will of their parents; they ought to satisfy them, that it is not out of contempt to their authority, but a conscientious regard to the glory of God; and that it is conducive to their happiness, in the opinion of the wisest and best of men.</p></blockquote>

<div class="actions"><button class="copy" data-copy="“[1.] We do not speak of parents that are so far deprived of judgment, that they are not fit to determine this matter; nor, [2.] Such as have divested themselves of the natural affection of parents, and entertaining an ungrounded prejudice against some of their children, are endeavoring to expose them to ruin, that they may show more kindness to others. These forfeit that right, which is otherwise founded in nature. [3.] If parents, by refusing to comply with the desire of their children, plainly, in the judgment of the wisest of men, obstruct their happiness, and the glory of God herein. Or, if they have no reason for their not complying, or the reason given is contrary to the laws of God, or the common sense of all impartial judges; especially if the affair took its first rise from them, and afterwards they changed their mind, without sufficient ground. This, without doubt, lessens, or it may be so circumstanced, that it wholly takes away the charge of sin in the child, in acting contrary to the will of his parents, and fastens the guilt on them. [4.] The case is vastly different, when applied to children who are so far from being dependent on their parents, that they depend on them. Nevertheless, in this case, some deference and respect ought to be paid to them; and as it is the children’s duty, it may be their interest so to do; since we can hardly suppose, that parents, who depend on their children, would oppose their happiness, in an affair that is apparently contrary to their own interest, if they did not think that they had sufficient reason for it; which ought to be duly weighed, that it may be known, whether their advice is expedient to be complied with, or no. And if in this, or any other instance, children are obliged to act contrary to the will of their parents; they ought to satisfy them, that it is not out of contempt to their authority, but a conscientious regard to the glory of God; and that it is conducive to their happiness, in the opinion of the wisest and best of men.”

— Thomas Ridgley, A Body of Divinity, (1731; 1814), vol. 3, pp. 522-23, commenting on Westminster’s Larger Catechism">Copy</button><a class="share" href="https://x.com/intent/post?text=%E2%80%9C%5B1.%5D+We+do+not+speak+of+parents+that+are+so+far+deprived+of+judgment%2C+that+they+are+not+fit+to+determine+this+matter%3B+nor%2C+%5B2.%5D+Such+as+have+divested+themselves+of+the+natural+affection+of+parents%2C+and+entertaining+an+ungrounded+prejudice+against+some+of+their+children%2C+are+endeavoring+to+expose+them+to+ruin%2C+that+they+may+show+more+kindness+to+others.+These+forfeit+that+right%2C+which+is+otherwise+founded+in+nature.+%5B3.%5D+If+parents%2C+by+refusing+to+comply+with+the+desire+of+their+children%2C+plainly%2C+in+the+judgment+of+the+wisest+of+men%2C+obstruct+their+happiness%2C+and+the+glory+of+God+herein.+Or%2C+if+they+have+no+reason+for+their+not+complying%2C+or+the+reason+given+is+contrary+to+the+laws+of+God%2C+or+the+common+sense+of+all+impartial+judges%3B+especially+if+the+affair+took+its+first+rise+from+them%2C+and+afterwards+they+changed+their+mind%2C+without+sufficient+ground.+This%2C+without+doubt%2C+lessens%2C+or+it+may+be+so+circumstanced%2C+that+it+wholly+takes+away+the+charge+of+sin+in+the+child%2C+in+acting+contrary+to+the+will+of+his+parents%2C+and+fastens+the+guilt+on+them.+%5B4.%5D+The+case+is+vastly+different%2C+when+applied+to+children+who+are+so+far+from+being+dependent+on+their+parents%2C+that+they+depend+on+them.+Nevertheless%2C+in+this+case%2C+some+deference+and+respect+ought+to+be+paid+to+them%3B+and+as+it+is+the+children%E2%80%99s+duty%2C+it+may+be+their+interest+so+to+do%3B+since+we+can+hardly+suppose%2C+that+parents%2C+who+depend+on+their+children%2C+would+oppose+their+happiness%2C+in+an+affair+that+is+apparently+contrary+to+their+own+interest%2C+if+they+did+not+think+that+they+had+sufficient+reason+for+it%3B+which+ought+to+be+duly+weighed%2C+that+it+may+be+known%2C+whether+their+advice+is+expedient+to+be+complied+with%2C+or+no.+And+if+in+this%2C+or+any+other+instance%2C+children+are+obliged+to+act+contrary+to+the+will+of+their+parents%3B+they+ought+to+satisfy+them%2C+that+it+is+not+out+of+contempt+to+their+authority%2C+but+a+conscientious+regard+to+the+glory+of+God%3B+and+that+it+is+conducive+to+their+happiness%2C+in+the+opinion+of+the+wisest+and+best+of+men.%E2%80%9D%0A%0A%E2%80%94+Thomas+Ridgley%2C+A+Body+of+Divinity%2C+%281731%3B+1814%29%2C+vol.+3%2C+pp.+522-23%2C+commenting+on+Westminster%E2%80%99s+Larger+Catechism&amp;url=https%3A%2F%2F5solasquotes.github.io%2Fquote%2F1106e0da0a.html&amp;via=5Solas" target="_blank" rel="noopener">Share on X</a><a class="perma" href="../quote/1106e0da0a.html">Permalink</a><a class="src" href="https://reformedbooksonline.com/topics/topics-by-subject/family/quotes-on-the-authority-of-fathers-in-giving-away-their-daughters-in-marriage/#:~:text=1.%5D%20We%20do%20not%20speak%20of,the%20wisest%20and%20best%20of%20men&amp;text=1.%5D%20We%20do%20not%20speak%20of%20parents%20that&amp;text=opinion%20of%20the%20wisest%20and%20best%20of%20men" rel="noopener" target="_blank">Read it online · Reformed Books Online</a></div>

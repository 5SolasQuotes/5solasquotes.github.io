<blockquote><p>13. The points upon which the Lutheran Churches disagree with us are of two kinds. There are some upon which it is easier to reach agreement: such are the ceremonies of the Lutheran Churches, which may be excused and tolerated, because they concern decorum rather than necessity. Of the same sort also are certain opinions respecting the point of Predestination, upon which, I judge, one might easily draw up an article of the common confession that all would approve without difficulty, provided that curiosity be avoided—which, I believe, has already been done by the Confession of Augsburg [1530], which speaks of it soberly and expressly declines that question. There is also some difference concerning the necessity of baptism, which may rightly and reasonably be affirmed to be necessary to salvation — that is to say, that it is necessary for each person not to despise it — without pressing the question of necessity any further.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/pierre-du-moulin.html">Pierre Du Moulin</a></span><span class="wk"><span class="lbl">Work:</span> <cite>‘Overture for Working toward the Union of the Christian Churches which have Shaken off the Yoke of the Papacy, and for Appeasing the Differences that have Already Arisen, or may Arise Hereafter’ in David Blondel, Authentic Accounts of the Reformed Churches of France, Germany &amp; Great Britain, concerning the Peace &amp; Brotherly Charity which all the Servants of God should Maintain among Protestants</cite>, (1615) in David Blondel, Authentic Accounts of the Reformed Churches of France, Germany &amp; Great Britain, concerning the Peace &amp; Brotherly Charity which all the Servants of God should Maintain among Protestants (Amsterdam: Blaeu, 1655), p. 74 trans. ChatGPT-5</span></figcaption>

<blockquote><p>2. How does [Richard] Hooker prove that the vessels made for Baal are in their own nature more incurable than the sign of the cross? You may remove the superstitious intention and idolatrous use of any vessel and turn it to a good use; yet Josiah burnt them to ashes. The like may be said of the groves which he stamped to powder and cast in the brook Kidron, and of the chariots five of the sun which he burnt with fire, and of the bones of dead men, not any of these being of their own nature more indifferent and innocent creatures of God, [nor] were of their own nature more scandalous and more incurable than the sign of the cross. The like may be said of altars…</p></blockquote>

</figure><figure class="quote" id="q-55ed48034e" data-kw="">
<blockquote><p>For I conceive my self, though by many degrees inferior to Timothy, yet in some measure to lie under St. Paul’s double charge to him (1 tim. 6:20), first [Greek], to keep the precious truth committed to my trust, and then what I have been sufficiently taught and assured of, to commit the same unto faithful men, who shall be able to teach others also (2 Tim. 2). Thus far I allow tradition of the faith once delivered to the saints, though it be not infallible, unchangeable and incorruptible, either by the course of nature or by the promise of grace to any particular race or succession of men, yet to be a duty required of ministers, and a means to propagate the truth; whether that delivery be transacted by word of mouth, which is transient, or by writing, which is permanent, as now I transmit, what I have received.</p></blockquote>

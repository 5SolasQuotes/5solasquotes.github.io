<main class="wrap"><figure class="quote" id="q-be619dae70" data-kw="">
<blockquote><p>§X. Impotence is wont to be distinguished into physical or natural, and moral: The former arises from a defect of the natural faculty required for doing something; e.g., in the deaf for hearing; in the blind for seeing; in a wall for speaking. The latter has its origin from a voluntary evil disposition of the soul and a perverse custom, such as is in a drunken man, a gambler, and a thief; of whom the first cannot abstain from drink, the second from gaming, the third from theft. If these things are applied to the present theological matter; the impotence which is congenital to man after the Fall, and is in him from his very birth, can be called natural, not because it is a destruction of the will and of the natural liberty of the will, but because, having arisen from the first sin of Adam, it has degenerated as it were into nature and is transmitted to posterity: as if leprosy, a stone, epilepsy, or another kind of disease is propagated from parents to children by the contagion of nature through natural generation.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/barthold-holtzfus.html">Barthold Holtzfus</a></span><span class="wk"><span class="lbl">Work:</span> <cite>‘Theological Dissertation on the Free Will of Man’ trans. AI by Nosferatu (Frankfurt: Zeitler, 1707)</cite>, p. 24 Latin</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/free-will-and-inability/liberty-and-necessity.html">Liberty and Necessity</a></span></div>

gion%20of%20nature%20through%20natural%20generation" rel="noopener" target="_blank">Read it online · Reformed Books Online</a></div>
</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-5acd7519ef" data-kw="">
<blockquote><p>§XIII. The special subject, as to man, is either of denomination or the subject which, and this is the whole man; or of inhesion or the subject by which, and this, the remote and mediate, is the soul of man; the proximate and immediate is formally the will; but the intellect, according to Thomas, is so radically; according to Scotus, better, antecedently: because with Scotus and Henricus Gandavensis as authorities, the name of root signifies a true cause, but the intellect is not the true cause of the liberty of the will; but only the antecedent and the condition without which there would not be liberty in the will. … §XVIII. The object of free will is τὰ πρακτὰ, agibilia (doable things), proposed and shown to the will by the intellect. For the will is not borne toward the unknown: nor is anything willed, unless it is first known. Whence that trite saying: Of the unknown there is no desire. Therefore the intellect is not indeed properly the root of liberty, since root signifies a true cause, but causality cannot be attributed to the intellect with respect to liberty; but it is the antecedent and the condition without which the will would not choose freely; whence the will is called the rational appetite, since on the contrary the appetite in brutes is not free, because it is not rational. Nor yet is it always necessary for desiring an object that the intellect should practically judge that the proposed object is to be chosen, but sometimes a simple apprehension of the object as good suffices; which has its place before all others in the movements of the will which they call the very first, and which happen without deliberation.</p></blockquote>

</figure><figure class="quote" id="q-a39047bf6c" data-kw="">
<blockquote><p>The case of human freedom, as a species of contingency, is quite different: it references a genuine alternativity in human choice that is ontically [the order of being, not just in the order of knowledge] grounded in the divine decree, maintained in the providential concursus, and rooted in the potencies belonging to the will and the free determinations of the intellect.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/richard-muller.html">Richard Muller</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Divine Will &amp; Human Choice: Freedom, Contingency &amp; Necessity in Early Modern Reformed Thought Excerpt</cite>, p. 316</span></figcaption>

</figure><figure class="quote" id="q-fe31d700a8" data-kw="">
<blockquote><p>First therefore they say, If so be we are not able to do any thing towards our salvation, this is to turn men into stocks and stones, or beasts, and so [there is] no difference between them and us. But we say, Although those similitudes the Scripture holds forth do prove our inability for that which is good, yet they must not be made alike in all things. It’s true, to convert men, is to make children unto Abraham out of stones; yet we must not think that is therefore an universal likeness between men and stones: For first, consider this vast dissimilitude; In stones and beasts there is no passive capacity of grace, but in man there is. We say, there is a power for grace in a man’s nature; and the Papists say, there is a power: only they say it’s an active power, though remote; we say, only a passive. There is a power to be converted to God, which is not in stones or beasts: they say, there is a power to convert or turn to God; here is a great difference. Besides, we may consider these degrees in the creatures: 1. There is an inclination to such an act, as in the fire to burn. 2. A spontaneous inclination to some acts accompanied with sense, and sensible apprehensions, as in beasts. 3. A willing inclination accompanied with reason or judgment, and this is in man: Now, because man is thus affected, therefore God in converting, though He does it by a potent work, yet by arguments, which we never use to horses, or brute beasts: and although man has lost that rectitude in his will and mind, yet he has not lost the faculties themselves; therefore though he be theologically dead, yet he is ethically alive, being to be wrought upon by arguments. Hence is that saying, ‘To will is of nature, to will well of grace; to will ill of corrupt nature.’ Hence we may grant those objections, that if a man had not this free-will (if you do not extend it to good things) there could be no conversion or obedience; for grace does not destroy, but perfect nature.</p></blockquote>

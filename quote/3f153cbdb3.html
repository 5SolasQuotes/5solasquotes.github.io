<main class="wrap"><figure class="quote" id="q-3f153cbdb3" data-kw="">
<blockquote><p>Sola Scriptura (&quot;by Scripture alone&quot;). The Holy Scriptures are our supreme and only rule of faith and life; they, not human tradition and reasoning, determine our faith and command our obedience. … Our minds are servants to receive the Word, not to judge it.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/joel-r-beeke-paul-m-smalley.html">Joel R. Beeke &amp; Paul M. Smalley</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Reformed Systematic Theology</cite>, vol. 1, ch. 4</span></figcaption>

</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-57765b3c9f" data-kw="">
<blockquote><p>The sufficiency of the Bible means its sole sufficiency. It is sufficient to achieve the purposes of redemptive revelation without supplementation by new revelations (claimed by some Anabaptists and others) or traditions of men (like those extra-biblical traditions claimed by the Roman Catholic church). It is this and no other view of the sufficiency of the Scriptures which must now be demonstrated.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/samuel-e-waldron.html">Samuel E. Waldron</a></span><span class="wk"><span class="lbl">Work:</span> <cite>A Modern Exposition of the 1689 Baptist Confession of Faith</cite>, ch. 1, p. 53</span></figcaption>

<div class="actions"><button class="copy" data-copy="“The sufficiency of the Bible means its sole sufficiency. It is sufficient to achieve the purposes of redemptive revelation without supplementation by new revelations (claimed by some Anabaptists and others) or traditions of men (like those extra-biblical traditions claimed by the Roman Catholic church). It is this and no other view of the sufficiency of the Scriptures which must now be demonstrated.”

</figure><figure class="quote" id="q-6013b2a7fb" data-kw="">
<blockquote><p>Unless I am refuted and convicted by testimonies of the Scriptures or by clear arguments (since I believe neither the Pope nor the Councils alone; it being evident that they have often erred and contradicted themselves), I am conquered by the Holy Scriptures quoted by me, and my conscience is bound in the word of God: I can not and will not recant any thing, since it is unsafe and dangerous to do any thing against the conscience. … Here I stand. [I can not do otherwise.] God help me! Amen.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/martin-luther.html">Martin Luther</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Answer before the Diet of Worms</cite>, 18 April 1521</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/holy-scripture/sufficiency.html">Sufficiency</a> › <a href="../topics/holy-scripture/sufficiency/scripture-alone.html">Scripture alone</a></span><span class="t"><a href="../topics/the-christian-life/christian-liberty-and-conscience.html">Christian Liberty and Conscience</a> › <a href="../topics/the-christian-life/christian-liberty-and-conscience/liberty-of-conscience.html">Liberty of conscience</a></span><span class="t"><a href="../topics/rome/the-rule-of-faith.html">Rome: The Rule of Faith</a> › <a href="../topics/rome/the-rule-of-faith/scripture-vs-tradition.html">Scripture vs tradition</a></span></div>
<div class="actions"><button class="copy" data-copy="“Unless I am refuted and convicted by testimonies of the Scriptures or by clear arguments (since I believe neither the Pope nor the Councils alone; it being evident that they have often erred and contradicted themselves), I am conquered by the Holy Scriptures quoted by me, and my conscience is bound in the word of God: I can not and will not recant any thing, since it is unsafe and dangerous to do any thing against the conscience. … Here I stand. [I can not do otherwise.] God help me! Amen.”

</figure><figure class="quote" id="q-265ad77090" data-kw="">
<blockquote><p>Our opinion is, that the supreme decision and authority in the interpretation of scripture should not be ascribed to the church, but to the scripture itself, and to the Holy Spirit, as well speaking plainly in the scriptures as also secretly confirming the same in our hearts.</p></blockquote>

</figure><figure class="quote" id="q-8fd989b3de" data-kw="">
<blockquote><p>By contrast, the Reformation asserted that a church, however venerable, can still err. … Even the most simple believer can and may if necessary, Bible in hand, stand up to an entire church, as Luther did to Rome. Only thus the freedom of the Christian, and simultaneously the sovereignty of God, is maintained. There is no higher appeal from Scripture. It is the supreme court of appeal. No power or pronouncement stands above it.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/herman-bavinck.html">Herman Bavinck</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Reformed Dogmatics</cite>, vol. 1: Prolegomena, ch. 14</span></figcaption>

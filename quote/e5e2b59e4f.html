<main class="wrap"><figure class="quote" id="q-e5e2b59e4f" data-kw="">
<blockquote><p>Melchior Adamus, both in the life of Carolostadius and in the life of Luther, observes the great evil which grew out of Luther’s dislike of Carolostadius, his strictness, zeal, and forwardness, in abolishing auricular confession, and difference of meats and casting out images out of churches, at which things Luther was the more offended, because done by Carolostadius in Wittenbreg during Luthers absence and without his knowledge and counsel. Luther did also allege that Carolostadius, his strictness and zeal in these lesser things, hindered and retarded the Reformation in more substantial points of doctrine. However the story notes that hence was the first rise of that deplorable Sacramentarian controversy [about the Lord’s Supper between the Lutherans and Reformed], which has ever since made so great a rupture in Germany.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/george-gillespie.html">George Gillespie</a></span><span class="wk"><span class="lbl">Work:</span> <cite>A Treatise of Miscellany Questions</cite>, (Edinburgh, 1649), ch. 10, pp. 129-30</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/the-church/schism-and-heresy.html">Schism and Heresy</a></span></div>

</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-39efa5d0a2" data-kw="">
<blockquote><p>21… But the most of our acquaintance [being parish ministers in England in the 1650’s, under Cromwell] were peaceable, moderate men that thought several parties [of various views of Church government] had somewhat of the right, and that the points of difference were so few and small that they might well live in peace and love, and that none of the parties was so right as that in all things they should be followed, and others trod down to set them up: And many of these were young men that, being at the schools, had not been engaged in the first quarrels [in the 1640’s and before], and desired not to side with any dividing parties, and modestly professed that they had not maturity enough to study themselves to any great confidence in the controversies [about Church government]. 22. This last sort of men beginning in Worcestshire set on foot a work of reconciling [an] Association, in which the Episcopal, Presbyterians and Independants agreed to practise so much of Church government and ministration as they were all agreed in, with mutual love and assisting concord, and to forbear one another in the rest, till God should bring us nearer (and after[wards] they added another agreement, to catechize every person in their parishes old and young that would come to them, or receive them thereto, and personally to instruct and exhort them about the practicals of religion, and preparation for death and the life to come). This example was presently followed by the ministers in Cumberland and Westmorland, Wiltshire, Dorsetshire, Essex, and going on in other counties, till the confusions [of] 1659 interrupted it [when Cromwell died], and the return of the prelacy [in 1662] ended it and many such endeavors.</p></blockquote>

<blockquote><p>[Johannes G.] Vos says taking the [Scottish, civil] indulgence [in 1669-1688] involved ‘becoming Episcopalians’ and was ‘a compromise with an unscriptural form of Church government…’ Such ‘must be regarded as a sacrifice of principle… they compromised with prelacy.’ This is to confound material actions with their formal ends. The indulged ministers did not necessarily sacrifice or compromise any principle or become anything but presbyterians acting under limitations of a partially unscriptural form of external Church government. If Vos’s slurs were true, that anyone who materially accommodates and cooperates with rulers acting under erroneous principles, sinfully sacrifices principles and becomes as their rulers: would not the old Jewish Church of God, with intrinsic, divine-right Church government, ruled by their Erastian Babylonian rulers in their captivity (in a broken and declining state), have been in sin for so accepting that Erastian supremacy, at the very command of God (Jer. 27:12–13; 29:4–7)? The Erastian, absolutist, civil rulers over the Jews in Christ’s time dictated and changed who was the Jewish, episcopal high priest at their will, contrary to God’s ordinance (Lev. 16:32; Num. 20:25–28; 35:25). Yet they allowed Christ and the apostles to otherwise exercise their ministry freely while practicing presbyterianism (Lk. 7:3; Mt. 18:15–20), alongside the overseeing priests, or bishops (Mt. 26:3, 57; Mk. 11:27; Lk. 20:1). Though Christ and the apostles suffered greatly under these bishops (Mt. 16:21; 27:1; Mk. 8:31), yet without fleeing (Mt. 26:47–57; Jn. 18:4–8; Acts 16:25–30; 21:13), they appeared at their courts (Mt. 21:23; 26:59; Acts 21:13; 25:11) in that broken and declining state of the Church. Question: On Vos’s premise, were not Christ, the apostles and the whole Jewish Church in sin for cooperating under these restrictions? Would not churches today which cooperate under American rulers acting under erroneous principles be guilty of all their rulers’ errors? Say if churches limit (or do not exercise) their own liberty in some ways to comply with over-reaching government restrictions about a spreading disease, so churches may prevent worse things (such as being shut down, or scandalizing unbelievers they are seeking to win to the Gospel), are they therefore guilty of their rulers’ errors? Perhaps some will affirm this, as many have. When you accommodate your boss’s unnecessary restrictions at work for the greater good, are you sacrificing God’s divine-right of governance over you and you are guilty of your boss’s errors? Are you divinely obliged to suffer the consequences of getting fired and hazarding your family’s survival every time your company wants you to do something not fully in accord with God-prescribed, right reason?</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/travis-fentiman.html">Travis Fentiman</a></span><span class="wk"><span class="lbl">Work:</span> <cite>“Editor’s Extended Introduction” in English Puritans, A Refutation of the Errors of Separatists</cite>, (1604; RBO, 2025), pp. 133-34</span></figcaption>

nder erroneous principles be guilty of all their rulers’ errors? Say if churches limit (or do not exercise) their own liberty in some ways to comply with over-reaching government restrictions about a spreading disease, so churches may prevent worse things (such as being shut down, or scandalizing unbelievers they are seeking to win to the Gospel), are they therefore guilty of their rulers’ errors? Perhaps some will affirm this, as many have. When you accommodate your boss’s unnecessary restrictions at work for the greater good, are you sacrificing God’s divine-right of governance over you and you are guilty of your boss’s errors? Are you divinely obliged to suffer the consequences of getting fired and hazarding your family’s survival every time your company wants you to do something not fully in accord with God-prescribed, right reason?”

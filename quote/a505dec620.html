<blockquote><p>1. An unrighteous judge does condemn the cause of God Himself: For every righteous cause is his. 2. …It is a damnable sin not to relieve the innocent and imprisoned in their distress, when we have power…

3. It is a turning of the remedy into a double misery; and taking away the only help of oppressed innocency. What other defense has innocency, but Law and Justice? And when their refuge itself does fall upon them and oppress them, whither shall the righteous fly?

4. It subverts laws and government, and abuses it to destroy the ends which it is appointed for.

5. Thereby it turns human society into a state of misery, like the depredations of hostility.

6. It is a deliberate resolved sin, and not done in a passion by surprise: It is committed in that place, and in that form, as acts of greatest deliberation should be done: As if he should say, upon full disquisition, evidence and deliberation, I condemn this person, and his cause.

7. All this is done as in the Name of God, and by his own commission, by one that pretends to be his officer or minister, Rom. 3:3- 6. For the judgement is the Lord’s; 2 Chron. 19:8-10 &amp; 19:5-7. And how great a wickedness is it thus to blaspheme, and to represent Him as Satan, an enemy to truth and righteousness, to his servants and Himself?…

8. It is sin against the fullest and frequentest prohibitions of God. Read over Ex. 23:1-3, etc.; Lev. 10:15; Dt. 1:16-17 &amp; 16:18; Isa. 1:17, 20, 23; Dt. 24:17 &amp; 27:19, ‘Cursed be he that perverts the judgement of the stranger, the fatherless and widow, and all the people shall say Amen’; Ezra 7:26; Ps. 33:5 &amp; 37:28 &amp; 72:2 &amp; 94:15 &amp; 106:3,30; Prov. 17:27 &amp; 19:28 &amp; 20:8 &amp; 29:4 &amp; 31:5; Eccl. 5:8; Isa. 5:7 &amp; 10:2 &amp; 56:1-2 &amp; 59:14-15; Jer. 5:1 &amp; 7:5 &amp; 9:24; Eze. 18:8 &amp; 45:9; Hos. 12:6; Amos 5:7,15,24 &amp; 6:12; Mic. 3:9; Zech. 7:9 &amp; 8:16; Gen. 18:19; Prov. 21:3,7,15. I cite not the words to avoid prolixity…

9. False judges cause the poor to appeal to God against them, and the cries of the afflicted shall not be forgotten, Lk. 18:5-8.

10. They call for God’s judgement upon themselves, and devolve the work into his hands… Ps. 9:7-9, ‘The Lord hath prepared his throne for judgement, and he shall judge the world in righteousness, he shall minister judgement to the people in uprightness; he will be a refuge for the oppressed;’ Ps. 37:6, ‘He will bring forth righteousness as the light, and thy judgement as the noon day;’ Ps. 89:14, ‘Justice and judgement are the habitation of his throne;’ Ps. 103:6, ‘The Lord executeth righteousness and judgement for all that are oppressed;’ Ps. 146:7. In a word, the sentence of an unjust Judge is passed against his own soul, and he calls to God to condemn him righteously, who unrighteously condemned others. Of all men, he cannot stand in judgement, nor abide the righteous doom of Christ.</p></blockquote>

</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-7a7bfa6eef" data-kw="">
<blockquote><p>In reality there are two, and only two, foundations of law; and they are both of them conditions without which nothing can give it any force; I mean equity and utility. With respect to the former, it grows out of the great rule of equality, which is grounded upon our common nature, and which Philo, with propriety and beauty, calls the mother of justice. All human laws are, properly speaking, only declaratory; they may alter the mode and application, but have no power over the substance of original justice. The other foundation of law, which is utility, connected in the same manner with, and derived directly from, our rational nature; for any other utility may be the utility of a robber, but cannot be that of a citizen; the interest of the domestic enemy, and not that of a member of the commonwealth. This present equality can never be the foundation of statues which create an artificial difference between men, as the laws before us [under consideration in his time] do, in order to induce a consequential inequality in the distribution of justice. Law is a mode of human action respecting society, and must be governed by the same rules of equity which govern every private action; and so Tully [Cicero?] considers it in his Offices as the only utility [being a utility to all commonly] agreeable to that [common] nature…</p></blockquote>

<blockquote><p>§6. The reasons of this are obvious and clear. Even because it is the office of the governors to determine of such circumstances: It is the pastor’s office to guide and oversee the flock. And so the determining of time and place of worship (that’s undetermined) belongs to his office: and the choice of the subject on which he shall preach, the leading them in prayer and praise, and choice of versions, translations and other ordinary helps in his work. And therefore when he determines these, he is but in his own way and does but his own work: and therefore he is therein the judge, if the case be controvertible. If none shall obey a magistrate or pastor in the works of their own office, as long as they think he did them not the best way, all government then would be presently overthrown, and obedience denied. We are sure that God has commanded us to obey them that are over us in the Lord (1 Thess. 5:12; Heb. 13:7, 17, etc.), and therefore a certain duty may not be forborn upon uncertain conjectures, or upon every miscarriage in them that we owe it to. This would unchurch all Churches (as they are political societies). For if pastors be taken down, and the work of pastors, the Church is taken down; and if government and obedience be taken down, then pastors and their work is taken down, which will be the fruit of this disorder.</p></blockquote>

— Richard Baxter, Five Disputations on Church Government &amp; Worship (London, 1659) | ch. 12, ‘It may be very sinful to command some ceremonies, when yet it may be the subjects’ duty to use them when they are commanded’, pp. 461-62">Copy</button><a class="share" href="https://x.com/intent/post?text=%E2%80%9C%C2%A76.+The+reasons+of+this+are+obvious+and+clear.+Even+because+it+is+the+office+of+the+governors+to+determine+of+such+circumstances%3A+It+is+the+pastor%E2%80%99s+office+to+guide+and+oversee+the+flock.+And+so+the+determining+of+time+and+place+of+worship+%28that%E2%80%99s+undetermined%29+belongs+to+his+office%3A+and+the+choice+of+the+subject+on+which+he+shall+preach%2C+the+leading+them+in+prayer+and+praise%2C+and+choice+of+versions%2C+translations+and+other+ordinary+helps+in+his+work.+And+therefore+when+he+determines+these%2C+he+is+but+in+his+own+way+and+does+but+his+own+work%3A+and+therefore+he+is+therein+the+judge%2C+if+the+case+be+controvertible.+If+none+shall+obey+a+magistrate+or+pastor+in+the+works+of+their+own+office%2C+as+long+as+they+think+he+did+them+not+the+best+way%2C+all+government+then+would+be+presently+overthrown%2C+and+obedience+denied.+We+are+sure+that+God+has+commanded+us+to+obey+them+that+are+over+us+in+the+Lord+%281+Thess.+5%3A12%3B+Heb.+13%3A7%2C+17%2C+etc.%29%2C+and+therefore+a+certain+duty+may+not+be+forborn+upon+uncertain+conjectures%2C+or+upon+every+miscarriage+in+them+that+we+owe+it+to.+This+would+unchurch+all+Churches+%28as+they+are+political+societies%29.+For+if+pastors+be+taken+down%2C+and+the+work+of+pastors%2C+the+Church+is+taken+down%3B+and+if+government+and+obedience+be+taken+down%2C+then+pastors+and+their+work+is+taken+down%2C+which+will+be+the+fruit+of+this+disorder.%E2%80%9D%0A%0A%E2%80%94+Richard+Baxter%2C+Five+Disputations+on+Church+Government+%26+Worship+%28London%2C+1659%29+%7C+ch.+12%2C+%E2%80%98It+may+be+very+sinful+to+command+some+ceremonies%2C+when+yet+it+may+be+the+subjects%E2%80%99+duty+to+use+them+when+they+are+com <blockquote><p>If any say that I derogate much from the authority of the Church when I do nothing which she prescribes except I see it lawful and expedient, because I should do this much for the exhortation and admonition of a brother. Answer:

1. I give far more reverence to the direction of the Church than to the admonition of a brother, because that is ministerial, this fraternal: that comes from authority, this only from charity: that is public, this private: that is given by many, this by one: And finally, the Church has a calling to direct me in some things wherein a brother has not.

2. If it be still instanced that in the point of obedience, I do no more for the Church than for any brother because I am bound to do that which is made evident to be lawful and expedient, though a private Christian do but exhort me to it, or, whether I be exhorted to it or not. For answer to this I say that I will obey the directions of the Church in many things rather than the directions of a brother; for in two things which are in themselves indifferent, and none of them inexpedient, I will do that which the Church requires, though my brother should exhort me to the contrary. But always I hold me at this sure ground, that I am never bound in conscience to obey the ordinances of the Church except they be evidently lawful and expedient. This is that, sine quo non obligant [without which they do not bind], and also that which does chiefly bind, though it be not the only thing which binds. Now for making the matter more plain we must consider that the constitutions of the Church are either lawful or unlawful: if unlawful, they bind not at all: if lawful, they are either concerning things necessary as Acts 15:28, and then the necessity of the things do bind, whether the Church ordain them or not; or else concerning things indifferent, as when: the Church ordains that in great towns there shall be sermon on such a day of the week and public prayers every day at such an hour, here it is not the bare authority of the Church that binds, without respect to the lawfulness or expediency of the thing itself which is ordained (else we were bound to do everything which the Church ordains, were it never so unlawful, for quod competit alicui qua tali, competit omni tali. We behold the authority of the Church making laws, as well in unlawful ordinances as in lawful, not yet is it the lawfulness or expediency of the thing itself without respect to the ordinance of the Church (for possibly other times and diets were as lawful and expedient too for such exercises, as those ordained by the Church), but it is the authority of the Church prescribing a thing lawful or expedient. In such a case then neither does the authority of the Church bind except the thing be lawful and expedient, not does the lawfulness and expediency of the thing bind except the Church ordain it, but both these jointly do bind.</p></blockquote>

<blockquote><p>God, to whom belongs the world and the fulness thereof, disponed to Abraham and his seed the land of Canaan for their inheritance and ordained that they should use their bow and their sword for the actual possession thereof; and the like divine right had David to the Edomites and Ammonites, though the occasion of David’s taking possession of these kingdoms by his sword did arise from particular and occasional exigencies and injuries; but it follows in no sort that, therefore, kings now wanting any word of promise, and so of divine right to any lands, may ascend to the thrones of other kingdoms than their own by no other title than the bloody sword. That God’s will was the chief patent here is clear, in that God forbade his people to conquer Edom, or Esau’s possession, when as He gave them command to conquer the Amorites. I doubt not to say, if Joshua and David had no better title than their bloody sword, though provoked by injuries, they could have had no right to any kingly power over these kingdoms; and if only success by the sword be a right of providence, it is no right of precept.</p></blockquote>

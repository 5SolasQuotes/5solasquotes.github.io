<main class="wrap"><figure class="quote" id="q-cc923e9d4f" data-kw="">
<blockquote><p>Definition [of Ontological Goodness] Just as ontological truth states the relation of being to the cognitive faculty, so goodness involves a relation to the appetitive faculty or the will. Just as the former consists in the knowability of being, so the latter consists in being’s appetibility. Hence it is defined as the property of being whereby it is made appetible or willable or, more briefly, it is appetibility or willability. On other interpretations of ontological goodness see what I wrote elsewhere (Wolter, Transcendentals, p.199 ff.). On the Convertibility of Ontological Goodness Conclusion 29: Every being is good, or being and good convert. The appetite or will tends to its object either because the object is perfect for it, namely insofar as it has the being-ness and perfection due to it (love of benevolence), or because the object confers perfection on another (love of concupiscence). As far as God is concerned, it is plain that he is altogether perfect and so supremely appetible both to himself and to another. As far as creatures are concerned, one must say that they are truly loved or willed by God himself, otherwise they would not exist; therefore they are lovable or willable. Further, creatures are also good for other creatures; for example substance upholds accidents, accidents give further perfection to substance, etc.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/allan-b-wolter.html">Allan B. Wolter</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Little Summary of Metaphysics</cite>, (Milwaukee: Bruce Publishing Co., 1958), p. 108 Wolter (1913-2006) was an American, Franciscan, John Duns Scotus (d. 1308) scholar and professor of philosophy.</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/man/image-of-god.html">Image of God</a></span></div>

</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-f28dcd04b0" data-kw="">
<blockquote><p>The nature of a thing: not how it is, but how it is meant to be… It is as though a physician who saw only broken arms assumed that if arms have no fractures there must be something wrong with them. How could we correct such a misguided physician? By calling his attention to the purpose or function of the arms, to their proper work. Broken arms cannot do their work as well as intact ones; therefore, brokenness is not their natural state. The nature of a thing is not determined by how something happens to be, but by what it is for — by what it is designed to do and to become, if everything goes well… What are men and women for? In one respect they are for the same thing: Being rational, they are for the knowledge of the truth, especially the truth about God. But there is a difference. A man is a rational being of that sex whose members are potentially fathers, and a woman is a rational being of that sex whose members are potentiality mothers. …potentiality is not the same thing as physical possibility. Consider a man who is infertile because of some disease. Although it is not physically possible for him to be a father, we should not say that he lacks the potentiality for fatherhood; as a man, he has the potentiality, but the disease has blocked its realization. It is just because he is a man, just because he is endowed with the potentiality for fatherhood, that the block to its physical realization is such an occasion for sorrow. Another reason why the expression ‘potentiality for fatherhood’ requires explanation is that although siring children is the most characteristic expression of fatherhood, it is far from its only expression… We can carry this line of reasoning still further. A potentiality is something like a calling. It wants, so to speak, to develop; it demands, so to speak, a response. It is like an arrow, notched in the string and aimed at the target, even if it never takes flight. It intimates an inbuilt meaning and expresses an inbuilt purpose, which cannot help but influence the mind and will of every person imbued with them… although not every woman is called to marry and bear physical children, ‘every woman, whether married or unmarried, is called upon to be a biological, psychological or spiritual mother.’ I am saying that for men, the reality is parallel. Not every man is called to marry and bear physical children, but every man, whether married or unmarried, is called upon to be a biological, psychological or spiritual father.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/j-budziszewski.html">J. Budziszewski</a></span><span class="wk"><span class="lbl">Work:</span> <cite>‘What makes Men Men?’, pt. 1</cite>, (2019)</span></figcaption>

<blockquote><p>It ought to be well understood in approaching this topic that the delineated distinctions, and further ones that will be made, are not magic solutions to ethical predicaments. Rather they are (very useful) tools that will go a long way towards working to what is righteous and pleasing before God. As with all tools, they may be used well, or irresponsibly. If through the multiplying of distinctions and terms (or the opposite, the lack of using such), a conclusion is reached that seems off or suspect, sophistry is likely being committed. Ethical conclusions reached should go with, and support an informed common sense in line with Scripture, not go against it. The purpose is to clearly understand and ground the reasons for right action, and to clear away all the mist, leaps and gymnastics of those who advocate error and manipulate truth as a wax-nose.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/travis-fentiman.html">Travis Fentiman</a></span><span class="wk"><span class="lbl">Work:</span> <cite>‘On the Ethics of Material Cooperation with, &amp; Associations with Evil’, ‘Extended Intro’, ‘The Beginnings of Answers: Distinctions’</cite></span></figcaption>

</figure><figure class="quote" id="q-6ea1dd5eff" data-kw="">
<blockquote><p>Therefore choice, arbitrium (an excessively proud term, in Greek αὐτεξούσιον), naturally considered, is the faculty of intellect and will by which we do what we want, by preceding counsel and judgment, such that we are not determined by any other created cause. It pertains to the intellect and will in such a way that the intellect judges and shows what should be done, but the will commands what is shown and judged, and thus at root it has reference to the intellect, but formally it has reference to the will. This certainly implies some indifference, in a divided sense, as they say, by which, with the consideration of the divine decree and predetermination set aside, man is indifferent at least by nature to acting or not acting; yet he is not indifferent in a composite sense, with regard to the divine decree and its predetermining providence, but is already determined virtually to one or the other; much less does choice consist in indifference itself. For in this way neither God, nor angel, nor any man, regenerate or unregenerate, would possess free choice, and consequently free choice would be a non-entity. For God is determined to good… And so arbitrium, choice, is more correctly said to consist in the power of acting from counsel and προαίρεσις, free choosing, or what is the same thing, in rational complacency.</p></blockquote>

<div class="actions"><button class="copy" data-copy="“Therefore choice, arbitrium (an excessively proud term, in Greek αὐτεξούσιον), naturally considered, is the faculty of intellect and will by which we do what we want, by preceding counsel and judgment, such that we are not determined by any other created cause. It pertains to the intellect and will in such a way that the intellect judges and shows what should be done, but the will commands what is shown and judged, and thus at root it has reference to the intellect, but formally it has reference to the will. This certainly implies some indifference, in a divided sense, as they say, by which, with the consideration of the divine decree and predetermination set aside, man is indifferent at least by nature to acting or not acting; yet he is not indifferent in a composite sense, with regard to the divine decree and its predetermining providence, but is already determined virtually to one or the other; much less does choice consist in indifference itself. For in this way neither God, nor angel, nor any man, regenerate or unregenerate, would possess free choice, and consequently free choice would be a non-entity. For God is determined to good… And so arbitrium, choice, is more correctly said to consist in the power of acting from counsel and προαίρεσις, free choosing, or what is the same thing, in rational complacency.”

— Petrus van Mastricht, Theoretical Practical Theology (RHB), vol. 3, bk. 4, ch. 4, ‘The Penalty &amp; State of Sin’, section 10, p. 526">Copy</button><a class="share" href="https://x.com/intent/post?text=%E2%80%9CTherefore+choice%2C+arbitrium+%28an+excessively+proud+term%2C+in+Greek+%CE%B1%E1%BD%90%CF%84%CE%B5%CE%BE%CE%BF%CF%8D%CF%83%CE%B9%CE%BF%CE%BD%29%2C+naturally+considered%2C+is+the+faculty+of+intellect+and+will+by+which+we+do+what+we+want%2C+by+preceding+counsel+and+judgment%2C+such+that+we+are+not+determined+by+any+other+created+cause.+It+pertains+to+the+intellect+and+will+in+such+a+way+that+the+intellect+judges+and+shows+what+should+be+done%2C+but+the+will+commands+what+is+shown+and+judged%2C+and+thus+at+root+it+has+reference+to+the+intellect%2C+but+formally+it+has+reference+to+the+will.+This+certainly+implies+some+indifference%2C+in+a+divided+sense%2C+as+they+say%2C+by+which%2C+with+the+consideration+of+the+divine+decree+and+predetermination+set+aside%2C+man+is+indifferent+at+least+by+nature+to+acting+or+not+acting%3B+yet+he+is+not+indifferent+in+a+composite+sense%2C+with+regard+to+the+divine+decree+and+its+predetermining+providence%2C+but+is+already+determined+virtually+to+one+or+the+other%3B+much+less+does+choice+consist+in+indifference+itself.+For+in+this+way+neither+God%2C+nor+angel%2C+nor+any+man%2C+regenerate+or+unregenerate%2C+would+possess+free+choice%2C+and+consequently+free+choice+would+be+a+non-entity.+For+God+is+determined+to+good%E2%80%A6+And+so+arbitrium%2C+choice%2C+is+more+correctly+said+to+consist+in+the+power+of+acting+from+counsel+and+%CF%80%CF%81%CE%BF%CE%B1%CE%AF%CF%81%CE%B5%CF%83%CE%B9%CF%82%2C+free+choosing%2C+or+what+is+the+same+thing%2C+in+rational+complacency.%E2%80%9D%0A%0A%E2%80%94+Petrus+van+Mastricht%2C+Theoretical+Practical+Theology+%28RHB%29%2C+vol.+3%2C+bk.+4%2C+ch.+4%2C+%E2%80%98The+Penalty+%26+State+of+Sin%E2%80%99%2C+section+10%2C+p.+526&amp;url=https%3A%2F%2F5solasquotes.github.io%2Fquote%2F6ea1dd5eff.html&amp;via=5Sola

</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-5f37dfa1ce" data-kw="">
<blockquote><p>6. If matters in their expediency be questionable and probable on both sides, the Church’s determination should end the controversy (say the [prelate] Doctors), this is the doctrine of the Jesuits, Suarez, Thomas Sanches and Gregory de Valentia, as I show[ed] before… …when a thing is probable and I be resolved in conscience against neither of the sides, and fear the one side be [a] murdering him for whom Christ died, which is against God’s commandment, and know that human authority commands the contrary and am persuaded it is indifferent and a positive commandment of men: if the Church’s determination be here to sway my conscience to practice, is to me blind obedience for human authority, as it is such, gives no light. Ergo [therefore], it [the Church’s judgment] cannot remove my doubting and beget faith…

7. Our [Prelatist] Doctors say [that] our way is against the peace of the Church: But I answer [that] their way is Popish and against the truth of God in commanding our consciences to rest upon the wicked will of men.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/samuel-rutherford.html">Samuel Rutherford</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Divine Right of Church Government</cite>, … (1646) | Appendix, ‘An Introduction to the Doctrine of Scandal’ | Question 4, p. 43</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/church-government-and-the-ministry/synods-and-assemblies.html">Synods and Assemblies</a></span></div>

ng-without-a-naturally-mo/#:~:text=6.%20If%20matters%20in%20their%20expediency,upon%20the%20wicked%20will%20of%20men&amp;text=6.%20If%20matters%20in%20their%20expediency%20be%20questionable&amp;text=to%20rest%20upon%20the%20wicked%20will%20of%20men" rel="noopener" target="_blank">Read it online · Reformed Books Online</a></div>

<blockquote><p>2. As concerning actions of Church-policy that cannot be warranted by the light of nature, and yet have intrinsical conveniency and aptitude to edify and decently to accommodate the worship of God. I conceive these may be done, but not because the Church so commands, as if their commandment were the formal reason of our obedience, but because partly the light of the Law of reason, partly scripture does warrant them… … Question. But does not the Church determine things that of themselves are indifferent, as whether [the] sermon should begin at nine of clock or ten in the morning; and after the Church has past a determination for the diet of ten a clock, the indifferency of either nine or ten is removed and the practice, without any warrant of Scripture, [is] restricted to one, for order and peace sake; and why may not the like be done in positives of Church-government? Answer. The truth is [that] the Church by her will puts no determination on the time, but only ministerially declares that which God’s providence accommodating itself to the season, climate, the conveniency of the congregation as they lie in distance from the place of meeting, has determined already…</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/samuel-rutherford.html">Samuel Rutherford</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Divine Right of Church Government</cite>, ... (1646) | Intro, section 5, ‘Moral Obedience Resolved Ultimately in Scripture’, pp. 80-82</span></figcaption>

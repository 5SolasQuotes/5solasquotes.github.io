<main class="wrap"><figure class="quote" id="q-28d8468efa" data-kw="">
<blockquote><p>The idea has always proved hard to bear that there should ever have been a stretch of existence in which our persons were indifferent to God … In the unlimitable round of his timeless existence we have never been absent from nor uncared for by Him. … The best proof that He will never cease to love us lies in that He never began. What we are for Him and what He is for us belongs to the realm of eternal values. Without this we are nothing, in it we have all.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/geerhardus-vos.html">Geerhardus Vos</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Jeremiah s Plaint and its Answer’, Princeton Theological Review</cite></span></figcaption>
<div class="meta"><span class="t"><a href="../topics/worship.html">Worship</a></span></div>

</figure><figure class="quote" id="q-abd2c30dd3" data-kw="">
<blockquote><p>To shorten something of this labour, if the books which you read are your own, mark with a pen, or pencil, the most considerable things in them which you desire to remember. Thus you may read that book the second time over with half the trouble, by your eye running over the paragraphs which your pencil has noted.

It is but a very weak objection against this practice to say, I shall spoil my book; for I persuade myself, that you did not buy it as a bookseller, to sell it again for gain, but as a scholar to improve your mind by it; and if the mind be improved, your advantage is abundant, though your book yield less money to your executors.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/isaac-watts.html">Isaac Watts</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Logic; or, The Right Use of Reason, in the Inquiry After Truth. With a Variety of Rules to Guard Against Error, in the Affairs of Religion and Human Life, as well as in the Sciences</cite>, (1722; Halifax: Milner and Sowerby, 1866), p. 74.</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/worship.html">Worship</a></span></div>

<blockquote><p>Though these [circumstances of worship] also, when they have a religious respect put on them, are made essential, and come under the things our Saviour here refers to [Mat. 15:9]. But a thing may then be said to be made a part of worship, when it hath such an holiness put upon it, as to be reputed a medium of our communion with God. And this is not to be judged of by what men say of it, but by the necessary consequence of the usage of it.</p></blockquote>

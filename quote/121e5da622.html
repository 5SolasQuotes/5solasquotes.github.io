<main class="wrap"><figure class="quote" id="q-121e5da622" data-kw="">
<blockquote><p>Indeed, God is the idea of all things, both created and to be created, as He manifests His simple and perfect essence in them, though not equally or in the same degree. Just as this essence shines more brightly in animate beings than in inanimate ones, so it is most perfectly reflected in man. While other creatures were given only a trace or shadow of His being, in which His eternal power and divine nature can be read (ἥ τε ἀΐδιος αὐτοῦ δύναμις καὶ θειότης), as Romans 1:20 states, man was endowed with His image, reflecting His most perfect nature, and with faculties and qualities that are somewhat shared with God but not with other creatures. This is why, concerning man’s creation, it is said that not merely a general notion of God was involved, but a deliberate consultation and agreement of the entire Holy Trinity, as Genesis 1:27 indicates. I. …the phrases “man created in the image of God” and “the image of God in man” essentially mean the same thing. The former suggests that the Divine Essence, which knows the nature of man as a species that can be expressed or imitated, serves as the model or objective image. The latter indicates something consequent to that model, which will be called the subjective image, in which the Creator willed His glory to be seen as in a mirror, as Calvin states in his Institutes (Book 2, Chapter 12, Sections 5-6).</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/andreas-essenius.html">Andreas Essenius</a></span><span class="wk"><span class="lbl">Work:</span> <cite>‘Theological Disputation on the Image of God in Man’ Download</cite>, tr. Jonathan Tomes (Utrecht: Johannes Waesberg, 1653)</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/attributes-of-god/knowledge-and-wisdom.html">Knowledge and Wisdom</a></span></div>

</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-1ef7d39e09" data-kw="">
<blockquote><p>Are there ideas? It is affirmed. Whether by necessity there are posited ideas in God? It is affirmed. Whether they are in God, or rather outside God? The prior is affirmed. Whether they are things themselves produced by God, so far by the divine intellect, is objected, that is, whether they have the rule of an object, in which, as it were, they are things known in the imagination by a creature? It is denied. Whether they are the effective causes of things, and indeed are first things and principles simply in their genus? It is affirmed. Whether every knowing or cognition of God indicates an idea? It is denied. Whether ideas are rightly divided into speculative and practical? It is denied. Whether ideas pertain to the speculative or rather to practical knowledge? The latter is affirmed. Whether the distinction of ideas into act and potential rightly explained is possible? It is affirmed. Whether all ideas in God are one and really the same with God? It is affirmed. Whether they are really the same amongst themselves or are really and intrinsically one idea? Affirm with a distinction. Whether ideas in God and in themselves are able and ought to be understood or investigated by us? It is denied. Whether ideas which are in the divine mind, through the first thing respect, so far, the singular nature, or the nature of the species? The latter is affirmed. Whether ideas are all which are known by God? It is denied. Whether evil may maintain an idea in God? It is denied with a distinction. [The reason is because evil is not a thing, or the form, species or genus of a thing, but a deficiency therefrom.] Whether impossibilities have ideas in God? It is denied. Whether prime matter [matter without form] has an idea in God? It is affirmed. Whether in God may be the idea of things which neither are, nor were, nor will be? It is affirmed. Whether accidents have an idea in God? It is distinguished. Whether singulars have an idea in God? It is affirmed.</p></blockquote>

<blockquote><p>But this negative will in God is nothing other than that act of the will by which, most perfectly willing himself, he is averse to everything adverse to him and to his glory, which is the only end of all things… He does this so thoroughly, that by most perfectly willing his own goodness, he is also most perfectly averse to whatever is adverse to him… Thus, God’s negative will is occupied with what is evil in its own nature, not only because it is adverse to the norm of acting set before it by God, but also [insofar as it has not been decreed] because it could not be directed by the power of the creatures to a truly good end… Even if an evil does not exist, or never will, God is still adverse to it, as it is inimical to his nature, since he would abolish and destroy it if it existed, just as he loves a good that will never exist, because, as it is congruent to his own goodness, if it existed he would conserve it, cherish it, and so forth.</p></blockquote>

<blockquote><p>1) A thing is possible because God is able to produce it. It is not, conversely, because it is possible that God is able to produce it. This is proved by God’s priority and independence. 2) Intrinsic possibility is not prior in nature to extrinsic possibility, nor is it the cause of the latter. On the contrary, since a thing can possibly be made by the truly and infinitely powerful God Himself, the source of all being, for that reason [the thing] is also intrinsically possible because the essence of God is the root and rule of all truth.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/melchior-leydekker.html">Melchior Leydekker</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Fax veritatis seu exercitationes ad nonnullas controversias quae hodie in Blegio</cite>, … (Leiden: Gaesbeeck &amp; Lopex, 1677), pp. 242-46 tr. Aza Goudriaan, ch. 8, ‘Samuel Rutherford on the Divine Origin of Possibility’ in ed. Aaron C. Denlinger – Reformed Orthodoxy in Scotland: Essays on Scottish Theology, 1560-1775 (Bloomsbury, T&amp;T Clark, 2016), pt. 2, p. 154 Leydekker followed Rutherford on the subject.</span></figcaption>

<div class="actions"><button class="copy" data-copy="“1) A thing is possible because God is able to produce it. It is not, conversely, because it is possible that God is able to produce it. This is proved by God’s priority and independence. 2) Intrinsic possibility is not prior in nature to extrinsic possibility, nor is it the cause of the latter. On the contrary, since a thing can possibly be made by the truly and infinitely powerful God Himself, the source of all being, for that reason [the thing] is also intrinsically possible because the essence of God is the root and rule of all truth.”

— Melchior Leydekker, Fax veritatis seu exercitationes ad nonnullas controversias quae hodie in Blegio… (Leiden: Gaesbeeck &amp; Lopex, 1677), pp. 242-46 tr. Aza Goudriaan, ch. 8, ‘Samuel Rutherford on the Divine Origin of Possibility’ in ed. Aaron C. Denlinger – Reformed Orthodoxy in Scotland: Essays on Scottish Theology, 1560-1775 (Bloomsbury, T&amp;T Clark, 2016), pt. 2, p. 154 Leydekker followed Rutherford on the subject.">Copy</button><a class="share" href="https://x.com/intent/post?text=%E2%80%9C1%29+A+thing+is+possible+because+God+is+able+to+produce+it.+It+is+not%2C+conversely%2C+because+it+is+possible+that+God+is+able+to+produce+it.+This+is+proved+by+God%E2%80%99s+priority+and+independence.+2%29+Intrinsic+possibility+is+not+prior+in+nature+to+extrinsic+possibility%2C+nor+is+it+the+cause+of+the+latter.+On+the+contrary%2C+since+a+thing+can+possibly+be+made+by+the+truly+and+infinitely+powerful+God+Himself%2C+the+source+of+all+being%2C+for+that+reason+%5Bthe+thing%5D+is+also+intrinsically+possible+because+the+essence+of+God+is+the+root+and+rule+of+all+truth.%E2%80%9D%0A%0A%E2%80%94+Melchior+Leydekker%2C+Fax+veritatis+seu+exercitationes+ad+nonnullas+controversias+quae+hodie+in+Blegio%E2%80%A6+%28Leiden%3A+Gaesbeeck+%26+Lopex%2C+1677%29%2C+pp.+242-46+tr.+Aza+Goudriaan%2C+ch.+8%2C+%E2%80%98Samuel+Rutherford+on+the+Divine+Origin+of+Possibility%E2%80%99+in+ed.+Aaron+C.+Denlinger+%E2%80%93+Reformed+Orthodoxy+in+Scotland%3A+Essays+on+Scottish+Theology%2C+1560-1775+%28Bloomsbury%2C+T%26T+Clark%2C+2016%29%2C+pt.+2%2C+p.+154+Leydekker+followed+Rutherford+on+the+subject.&amp;url=https%3A%2F%2F5solasquotes.github.io%2Fquote%2F6df0d8e330.html&amp;via=5Solas" target="_blank" rel="noopener">Share on X</a><a class="perma" href="../quote/6df0d8e330.html">Permalink</a><a class="src" href="https://reformedbooksonline.com/on-possibilities-hypotheticals/#:~:text=1%29%20A%20thing%20is%20possible%20because,root%20and%20rule%20of%20all%20truth&amp;text=1%29%20A%20thing%20is%20possible%

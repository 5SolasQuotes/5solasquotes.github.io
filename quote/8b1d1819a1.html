<main class="wrap"><figure class="quote" id="q-8b1d1819a1" data-kw="">
<blockquote><p>…in the Ten Commandments, in which one of seven is a Sabbath to the Lord, it will be found that many positives Moral are in the Covenant of Works… But man being considered as endued with the Image of God, so the Holy God made with him a Covenant of life, with Commandments, though positive and moral, yet not deduced from the Law of Nature, in the strictest sense, as to observe such a Sabbath, the seventh from the Creation…</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/samuel-rutherford.html">Samuel Rutherford</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Covenant of Life Opened or A Treatise of the Covenant of Grace</cite>, … (Edinburgh, 1655), p. 19</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/worship/the-lords-day.html">The Lord&#x27;s Day</a></span></div>

</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-e683408370" data-kw="">
<blockquote><p>…generally concerning this matter, what things soever the time present does necessarily require to be done for our own furtherance, the commodity of our brethren, or the benefit or preservation of any of the creatures, which cannot be deferred unto another day without loss or hinderance, neither could any ways be provided for before: (For the occasion was but new offered) though they do no ways belong to any part of God’s service immediately: Nay I will say more, and but the truth: though they do keep us from it, or call us away when we be at it, yet they are permitted unto us, and we may lawfully do them, though they be never so painful and full of labor, without any offence against the law of the Sabbath, wherein notwithstanding bodily rest is so straitly required, as we have learned. And therefore it is truly said, Opus corporale, a corporal labor pertaining to the preservation of a man’s own body, life or health, when it is necessary, breaks not the Sabbath… And this is that which is spoken in this chapter,*That if the sheep be now in the ditch, it must be presently holpen out, lest it miscarry. . pp. 110-11 …Even so here, the Spirit of God by sacrifice (as by one kind), meaning generally the whole worship of God, He would have us to offer it unto Him, as that in the mean season we neglect no occasion of showing mercy unto any of his creatures, which He offered unto us; but rather first of all to show mercy, and then to offer sacrifice. As He says in another place, “First be reconciled to they brother, and then come and offer thy gift (Matt. 5:22). For seeing that the whole service of God is ordained for this cause among many others, that we might be made more fit to help our brethren, and to show all duties of mercy unto them, all others must give place unto this, when necessity so requires. According to that which Master Gualter says: Omnia externa: “All outward things must gives place unto love, lest we lay a snare upon them”–quos necssitas inevitabilis alio vocat–“whom inevitably necessity calls another way:” or at whose hands the present necessity, that cannot be avoided, requires another thing. (Gualter, Mark 2, hom. 22…) And that this is the true meaning of the law of resting, appears more clearly by that which Christ Jesus speaks of it in the gospel after [by] St. Mark: “The Sabbath was made for man, and not man for the Sabbath (Mark 2:27). That is, the day of rest was appointed for the benefit of man; and not only of him, but of all other creatures. And therefore it must be so observed as may be most beneficial unto them; and the rest in it must give place to them, and not they to it. So that it were against the meaning of the Lawgiver to abuse the rest unto the hurt of them; and that men should under the pretence of resting, withdraw all their labor from them, who by present necessity did call for it, and require it at our hands. But even as the king, because he is the greatest, when he comes in presence, all do give way unto him; so because to help others is greater than rest, and mercy greater than sacrifice, therefore these latter must always give place to the former. So that it need be we must not rest, but labor upon the Sabbath, to do good unto men, or to the cattle.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/nicholas-bownd.html">Nicholas Bownd</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Doctrine of the Sabbath Plainly Laid forth</cite>, … (London, 1595), | pt. 1, pp. 106-7</span></figcaption>

</figure><figure class="quote" id="q-f5fc829787" data-kw="">
<blockquote><p>The precept of the Sabbath observance is moral in one respect, insofar as it commands man to give some time to the things of God, according to Ps. 45:11: ‘Be still and see that I am God.’ In this respect it is placed among the precepts of the decalogue: but not as to the fixing of the time, in which respect it is a ceremonial precept.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/thomas-aquinas.html">Thomas Aquinas</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Summa, pt. 1 of 2, quest. 100</cite>, article 3, reply to Objection 2</span></figcaption>

<blockquote><p>2. As to the question on which you wish my opinion, whether it is lawful to fast on the seventh day of the week, I answer, that if it were wholly unlawful, neither Moses nor Elijah, nor our Lord Himself, would have fasted for forty successive days. But by the same argument it is proved that even on the Lord’s day fasting is not unlawful.</p></blockquote>

</figure><figure class="quote" id="q-6fc8db84bc" data-kw="">
<blockquote><p>XXV. Here, nevertheless, are excepted [to the prohibition of servile work]: … (3) the works of common honesty, because as always, so on this day above others, we ought to carry ourselves and to act honestly and decorously; (4) works of necessity, which are neither feigned nor designedly produced, but imposed upon us by providence (Lk. 14:5); not only absolute and simple, that may be called necessary only (which we can in no way be in want of), but modified and relative so that those things may be reckoned necessary not only which are required absolutely for the existence and support of life, but also those which conduce to our living better. Hence some great advantage and emolument accrues to us or our neighbor if they are done or some great disadvantage and loss if they are omitted. ‘The sabbath’ (as Christ testifies in Mk. 2:27) ‘was made for man and not man for the sabbath.’ XXVI. Therefore, we do not think that in this cessation believers are bound to Judaical precision which some (more scrupulous than is just) maintain was not revoked, so that it is lawful neither to kindle a fire, nor to cook food, nor to take up arms against an enemy, nor to prosecute a journey begun by land or sea, nor to refresh themselves with innocent relaxation of the mind and body, provided they are done out of the hours for divine worship, nor to have any diversion, however slight, to any things belonging to the advantages or emoluments of this life. For although this opinion bears on its face a beautiful appearance of piety (and undoubtedly with good intention is proposed by pious men to procure the better sanctification of this day, usually so basely profaned), still it labors under grievous disadvantages; nor can it be retained without in this way bringing back into the church and imposing anew upon the shoulders of Christians an unbearable yoke (abastakton), repugnant to Christian liberty and the gentleness of Christ and opposed to the sweetness of the covenant of grace by agitating and tormenting the consciences of men through infinite scruples and inextricable difficulties (nearly driving to desperation).</p></blockquote>

<div class="meta"><span class="t"><a href="../topics/worship/the-lords-day.html">The Lord&#x27;s Day</a></span></div>
<div class="actions"><button class="copy" data-copy="“XXV. Here, nevertheless, are excepted [to the prohibition of servile work]: … (3) the works of common honesty, because as always, so on this day above others, we ought to carry ourselves and to act honestly and decorously; (4) works of necessity, which are neither feigned nor designedly produced, but imposed upon us by providence (Lk. 14:5); not only absolute and simple, that may be called necessary only (which we can in no way be in want of), but modified and relative so that those things may be reckoned necessary not only which are required absolutely for the existence and support of life, but also those which conduce to our living better. Hence some great advantage and emolument accrues to us or our neighbor if they are done or some great disadvantage and loss if they are omitted. ‘The sabbath’ (as Christ testifies in Mk. 2:27) ‘was made for man and not man for the sabbath.’ XXVI. Therefore, we do not think that in this cessation believers are bound to Judaical precision which some (more scrupulous than is just) maintain was not revoked, so that it is lawful neither to kindle a fire, nor to cook food, nor to take up arms against an enemy, nor to prosecute a journey begun by land or sea, nor to refresh themselves with innocent relaxation of the mind and body, provided they are done out of the hours for divine worship, nor to have any diversion, however slight, to any things belonging to the advantages or emoluments of this life. For although this opinion bears on its face a beautiful appearance of piety (and undoubtedly with good intention is proposed by pious men to procure the better sanctification of this day, usually so basely profaned), still it labors under grievous disadvantages; nor can it be retained without in this way bringing back into the church and imposing anew upon the shoulders of Christians an unbearable yoke (abastakton), repugnant to Christian liberty and the gentleness of Christ and opposed to the sweetness of the covenant of grace by agitating and tormenting the consciences of men through infinite scruples and inextricable difficulties (nearly driving to desperation).”

— Francis Turretin, Institutes (P&amp;R), vol. 2, 11th Topic, Q. 14, ‘The Lord’s Day…’, p. 98">Copy</button><a class="share" href="https://x.com/intent/post?text=%E2%80%9CXXV.+Here%2C+nevertheless%2C+are+excepted+%5Bto+the+prohibition+of+servile+work%5D%3A+%E2%80%A6+%283%29+the+works+of+common+honesty%2C+because+as+always%2C+so+on+this+day+above+others%2C+we+ought+to+carry+ourselves+and+to+act+honestly+and+decorously%3B+%284%29+works+of+necessity%2C+which+are+neither+feigned+nor+designedly+produced%2C+but+imposed+upon+us+by+providence+%28Lk.+14%3A5%29%3B+not+only+absolute+and+simple%2C+that+may+be+called+necessary+only+%28which+we+can+in+no+way+be+in+want+of%29%2C+but+modified+and+relative+so+that+those+things+may+be+reckoned+necessary+not+only+which+are+required+absolutely+for+the+existence+and+support+of+life%2C+but+also+those+which+conduce+to+our+living+better.+Hence+some+great+advantage+and+emolument+accrues+to+us+or+our+neighbor+if+they+are+done+or+some+great+disadvantage+and+loss+if+they+are+omitted.+%E2%80%98The+sabbath%E2%80%99+%28as+Christ+testifies+in+Mk.+2%3A27%29+%E2%80%98was+made+for+man+and+not+man+for+the+sabbath.%E2%80%99+XXVI.+Therefore%2C+we+do+not+think+that+in+this+cessation+believers+are+bound+to+Judaical+precision+which+some+%28more+scrupulous+than+is+just%29+maintain+was+not+revoked%2C+so+that+it+is+lawful+neither+to+kindle+a+fire%2C+nor+to+cook+food%2C+nor+to+take+up+arms+against+an+enemy%2C+nor+to+prosecute+a+journey+begun+by+land+or+sea%2C+nor+to+refresh+themselves+with+innocent+relaxation+of+the+mind+and+body%2C+provided+they+are+done+out+of+the+hours+for+divine+worship%2C+nor+to+have+any+diversion%2C+however+slight%2C+to+any+things+belonging+to+the+advantages+or+emoluments+of+this+life.+For+although+this+opinion+bears+on+its+face+a+beautiful+appearance+of+piety+%28and+undoubtedly+with+good+intention+is+proposed+by+pious+men+to+procure+the+better+sanctification+of+this+day%2C+usually+so+basely+profaned%29%2C+still+it+labors+under+grievous+disadvantages%3B+nor+can+it+be+retained+without+in+this+way+bringing+back+into+the+church+and+imposing+anew+upon+the+shoulders+of+Christians+an+unbearable+yoke+%28abastakton%29%2C+repugnant+to+Christian+liberty+and+the+gentleness+of+Christ+and+opposed+to+the+sweetness+of+the+covenant+of+grace+by+agitating+and+tormenting+the+consciences+of+men+through+infinite+scruples+and+inextricable+difficulties+%28nearly+driving+to+desperation%29.%E2%80%9D%0A%0A%E2%80%94+Francis+Turretin%2C+Institutes+%28P%26R%29%2C+vol.+2%2C+11th+Topic%2C+Q.+14%2C+%E2%80%98The+Lord%E2%80%99s+Day%E2%80%A6%E2%80%99%2C+p.+98&amp;url=https%3A%2F%2F5solasquotes.github.io%2Fquote%2F6fc8db84bc.html&amp;via=5Solas" target="_blank" rel="noopener">Share on X</a><a class="perma" href="../quote/6fc8db84bc.html">Permalink</a><a class="src" href="https://reformedbooksonline.com/on-works-of-necessity-mercy-on-the-sabbath/#:~:text=XXV.%20Here%2C%20nevertheless%2C%20are%20excepted%20%5Bto,inextricable%20difficulties%20%28nearly%20driving%20to%20desperation&amp;text=XXV.%20Here%2C%20nevertheless%2C%20are%20excepted%20%5Bto%20the%20prohibition&amp;text=scruples%20and%20inextricable%20difficulties%20%28nearly%20driving%20to%20desperation" rel="noopener" target="_blank">Read it online · Reformed Books Online</a></div>

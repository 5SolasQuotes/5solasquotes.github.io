<main class="wrap"><figure class="quote" id="q-82b9f9c792" data-kw="">
<blockquote><p>The Book of Psalms was penned by David, Asaph, Moses and others, and in several ages and states of the church, and were appointed to be sung then, for the present state of the church in those days. It may therefore be demanded: Why then do we sing them now in our churches? The answer is: the church in all ages consists of a number of believers, and the faith is always one, and makes all that apprehend God’s promises to be alike to one another in grace, in meditations, in dispositions, in affections, in desires, in spiritual wants, in the feeling and use of afflictions, in course and conversation of life, and in performance of duties to God and man. And therefore the same psalms, prayers and meditations, are now as fit for the church in these days, and are said and sung with the same use and profit, as in the church in those days when they were first made.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/william-perkins.html">William Perkins</a></span><span class="wk"><span class="lbl">Work:</span> <cite>A Cloud of Faithful Witnesses, Leading to the Heavenly Canaan: Or, A Commentary upon the 11th Chapter to the Hebrews</cite>, (1609) in The Works of William Perkins: Volume 3, eds Randall J. Pederson and Ryan M. Hurd (Grand Rapids: Reformation Heritage Books, 2017), pp 154-55.</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/the-church/church-unity-and-fundamentals.html">Church Unity and Fundamentals</a></span></div>

</figure><figure class="quote" id="q-454f9c5b4b" data-kw="">
<blockquote><p>3rd Argument. If Paul do not only not command separation in the Church of Corinth, but also command and approve their meeting together in Church-communion, 1 Cor. 5:4; 11:18, 20-22; 14:23; 16:2, where there was: Schisms and contentious, 1 Cor. 1:12-13, envying and strife, 1 Cor. 3:3, incest, and incest tolerated, such as is not named amongst the gentiles, 1 Cor. 5:1, going to law with their brethren for gain before infidels, 1 Cor. 6, harlotry, vv. 15-16, eating at the idols’ table, 1 Cor. 8, keeping fellowship with devils, 1 Cor. 10:20-22, coming to the Lord’s Table drunken, 1 Cor. 11:21, eating and drinking damnation, vv. 29-30. A denying of a fundamental point of faith, the resurrection of the dead, and that with scoffing at it, 1 Cor. 15:35, murdering of weak souls, whom Christ had died for, 1 Cor. 8:12-13, Paul’s name despitefully traduced, 2 Cor. 10:8-9, etc. Then it is unlawful to separate from the pure worship of God, because a Church is not constituted of visible saints and a people all taught of God.</p></blockquote>

<div class="meta"><span class="t"><a href="../topics/the-church/church-unity-and-fundamentals.html">Church Unity and Fundamentals</a></span></div>

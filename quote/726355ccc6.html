<main class="wrap"><figure class="quote" id="q-726355ccc6" data-kw="">
<blockquote><p>I read, Gal. iii. 19, for what end God published the law 430 years after the promise was made to Abraham, and find it was added because of transgression, it was put to, not set up by itself alone as a distinct covenant, but added as an appendix to the covenant of grace; whence it is plain, that God added the Sinai law to the promise, with evangelical ends and purposes. […] The law was added because of transgression, that is, to restrain sin in the world, and to convince sinners under guilt, of the necessity of another righteousness than their own, even that of Christ, and for the same ends God added it to the promise. […]

It is plain to me, that in the publication of the law on Sinai, God did not in the least intend to give them so much as a direction how to obtain justification by their most punctual obedience to its precepts, that being to fallen man utterly impossible; and beside, had he promulgated the law to that end and purpose, he had not added it, but directly opposed it to the promise; which it is manifested he did not; Gal. iii. 21. “Is the law then against the promise of God? God forbid.” And verse 18 makes it appear, that had it been set up to that end and purpose, it had utterly disannulled the promise; for if the inheritance be of the law, it is no more by promise.

What then can be clearer, than that the law at Sinai was published with gracious gospel-ends and purposes, to lead men to Christ, which Adam’s covenant had no respect or reference to? And therefore it can never be a pure Adam’s covenant, as you falsely call it, neither is it capable of becoming a pure covenant of works to any man, but by his own fault, in rejecting the righteousness of Christ, and seeking justification by the works of the law, as the mistaken carnal Jews did, Rom. x. 3. and other legal justiciaries now do. And upon this account it is that Paul, who so highly praises the law in its subserviency to Christ, thunders so dreadfully against it, as it is thus set by ignorant mistaken souls in direct opposition to Christ.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/john-flavel.html">John Flavel</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Vindiciae Legis et Faederis: or, A Reply to Mr Philip Cary’s Solemn Call</cite>, in The Works of John Flavel (6 vols, Edinburgh, 1968), vi, 335-36.</span></figcaption>

</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-6eb3a4874c" data-kw="">
<blockquote><p>The first sort of persons who are slighters of this great salvation, are those persons who go about to establish their own righteousness, and will not submit to the righteousness of Christ; (in a word) it is that sort of persons who think they may win to heaven by a Covenant of Works, and will not take the Gospels way of travelling to heaven in the Covenant of Grace. And surely there is not a person here who hath not that cursed inclination to be as little obliged to Christ (for his salvation) as he can; we would go to heaven without the way, which is Christ. And (believe me) there are many in this Congregation who go thus about to establish their own righteousness. And I shall propose six sorts of persons who fall under this first rank.

The first sort are those who trust on their own civility, and think that will carry them to heaven; those are the persons who go about to establish their own righteousness. Say they, I defy the world to say any thing to me, I was overmore an honest man and I trust therefore that I shall go to heaven; but I say to thee, (O Atheist that thou art) thou shalt never win to heaven by those means, till thou come to Christ with this, All my righteousness is like filthy rags.

The second sort are those who build their confidence upon their denial of their good Works, but yet come never this length to make use of Jesus Christ.

The third sort are those who build their confidence upon their duties; they think they will come to heaven by their good prayers, by their reading, and by their fasting, (like unto that Pharisee, Luke 18. 11.) I thank God I am not like other men; for I fast twice in the week, I pay tithes of all that I possess: But I say unto thee, thy duties will never bring thee to heaven if Christ he not the end of all thy duties, nor can you perform a duty without him.

The fourth sort of Persons who fall under this first rank of slighters of the great salvation, are those who trust on their convictions; if they have once been convinced of their sin and miserable estate, they think there is no more to do, Christ will never reject them, so they sit down and build their hope upon those convictions.

The fifth sort of persons are those who build their confidence upon their resolutions; say they, oftentimes I have resolved to be a better man than I am, therefore I think (which is the fearful delusion of many) that God will accept the will for the deed; but it had been good for many such a word had not been in the Bible; or that their cursed eyes had never read it. But know this that though thou hadst as strong resolutions as Peter, or as good wishes as Balaam’s had, if thou never labour to bring them to practice, God shall say to thee, Depart from me, I know you not: Any of you who build upon your resolutions, you will build upon a sandy foundation, these being many times a goodness but like the morning dew,

And the sixth sort of persons who fall under this first rank of slighters of the great salvation (and wherein the evil is most subtle) are those who build their salvation upon their graces; these also go about to establish their own righteousness; but I say to such, Their graces cannot be the foundation of their hope, though they may be as evidences to strengthen their hope. Now are there none here who fall under this first rank of slighters of the great salvation? or are there none here who will confess that they have gone about to establish their own righteousness?

I say to thee who wilt confess, put a rope about thy neck, and come to Christ; for he is a merciful King: I say to thee, Come to Christ with this, All my righteousness is like filthy rags; and if thou wilt come with this in sincerity, he shall say, Bring forth the white robe and put upon him. If thou canst be brought to speak that in sincerity to Christ, there shall be no more betwixt Christ and thee, but Come and clothe him with the whole robe.</p></blockquote>

</figure><figure class="quote" id="q-82915f59a4" data-kw="">
<blockquote><p>God’s covenant is a bargain which God hath made with men, in which God promiseth to men some good, &amp; requireth of them again, that they perform those things which he commandeth. And that covenant is either eternal or temporal. The eternal covenant is a covenant in which God promiseth men eternal life. And that is two fold, the covenant of works, or the covenant of grace.

The covenant of works, is a bargain of God made with men concerning eternal life, to which is both a condition of perfect obedience adjoined, to be performed by man, &amp; also a threatening of eternal death if he shall not perform perfect obedience. Gen. 2.17.

The repetition of the covenant of works is made by God, Exod. 19.5. Deut. 5.2. 1. King. 8.21. Heb. 8.9. and that chiefly for four causes.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/amandus-polanus.html">Amandus Polanus</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The substance of Christian religion soundly set forth in two books, by definitions and partitions, framed according to the rules of a natural method, by Amandus Polanus professor of divinity. The first book concerneth faith. The second concerneth good works. The principal points whereof are containe</cite>, trans. Elijahu Wilcocks (London: John Oxenbridge, 1595), pp 87-88.</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/the-covenant-of-works.html">The Covenant of Works</a></span></div>
<div class="actions"><button class="copy" data-copy="“God’s covenant is a bargain which God hath made with men, in which God promiseth to men some good, &amp; requireth of them again, that they perform those things which he commandeth. And that covenant is either eternal or temporal. The eternal covenant is a covenant in which God promiseth men eternal life. And that is two fold, the covenant of works, or the covenant of grace.

The covenant of works, is a bargain of God made with men concerning eternal life, to which is both a condition of perfect obedience adjoined, to be performed by man, &amp; also a threatening of eternal death if he shall not perform perfect obedience. Gen. 2.17.

The repetition of the covenant of works is made by God, Exod. 19.5. Deut. 5.2. 1. King. 8.21. Heb. 8.9. and that chiefly for four causes.”

enant-of-works-and-its-republication/" rel="noopener" target="_blank">Read it online · Reformed Covenanter</a></div>
</figure><figure class="quote" id="q-944fc81d80" data-kw="">
<blockquote><p>Besides this evangelical character which unquestionably belongs to the Mosaic covenant, it is presented in two other aspects in the Word of God. First, it was a national covenant with the Hebrew people. In this view the parties were God and the people of Israel; the promise was national security and prosperity; the condition was the obedience of the people as a nation to the Mosaic law; and the mediator was Moses. In this aspect it was a legal covenant. It said, “Do this and live.” Secondly, it contained, as does also the New Testament, a renewed proclamation of the original covenant of works. It is as true now as in the days of Adam, it always has been and always must be true, that rational creatures who perfectly obey the law of God are blessed in the enjoyment of his favour; and that those who sin are subject to his wrath and curse. Our Lord assured the young man who came to Him for instruction that if he kept the commandments he should live (emphasis added).</p></blockquote>

</figure><figure class="quote" id="q-8de89ac022" data-kw="">
<blockquote><p>1. This contract between God and the first Adam, is in sacred writ, expressly styled a covenant. “These are the two covenants; the one from the mount Sinai, which gendereth to bondage, which is Agar.” Here are two covenants mentioned, the one of which, genders to bondage, and the other, to liberty or freedom. The covenant of grace, or “The law of the Spirit of life in Christ Jesus,” is the one which genders to liberty, or which makes free from the law of sin and death. The one, therefore, which genders to bondage, must be that law or covenant of works, which was republished to the Israelites, from mount Sinai; which required perfect obedience to the ten commandments, on pain of death, and contained a promise of life, to the man who should do, or perform such obedience.</p></blockquote>

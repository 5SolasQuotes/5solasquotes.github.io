<blockquote><p>Now the Son of the ever blessed God tenders Himself to you with many entreaties, goes after you up and down, night and day, knocking at the door of your heart, with all his graces, comforts, and fruits of his death, by the ministry of his word, the motions of his Spirit, multitudes of temporal and spiritual mercies; but you, unworthy wretch, slights both Him and his precious attendants, and esteems your shop and stock, your corn and carnal comforts, far before Him…</p></blockquote>

</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-588c25032e" data-kw="">
<blockquote><p>The Galatians were truly regenerated, and had received Christ into their hearts: yet their graces were so choked and quenched, that He was as it were without fashion or form: so that the apostle did as it were travail again until Christ was fashioned anew in them (Gal. 4:19). David also upon the committing of his sin was brought unto that case, that he prayed God to create in him a new spirit (Ps. 51). What, was the Spirit quite gone? No, for by and by after he prays that God would not take his Holy Spirit from him: but the graces thereof were wonderfully decayed, and therefore he desires that they might be renewed. But that none may abuse this doctrine, let us consider what punishments do follow upon the quenching of the Spirit in this sort.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/john-dod.html">John Dod</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Seven Godly &amp; Fruitful Sermons</cite>, … (London: Kyngston, 1614), ‘Of extinguishing the graces of the Spirit’, pp. 202-3</span></figcaption>

<blockquote><p>‘Behold, I stand at the door’ of your heart and ‘knock: Open to Me, my sister, my love, my undefiled; for my head is filled with the dew, and my locks with the drops of the night.’… ‘When He waits to be gracious, and exalts Himself to show mercy.’ why tire out his patience till He ‘shut up all his tender mercies in his wrath?’ ‘Is it a small thing for you to weary men,’ weary parents, and ministers? ‘But will ye weary my God also?‘</p></blockquote>

</figure><figure class="quote" id="q-e19224ab05" data-kw="">
<blockquote><p>It will be seen, then, that the doctrine of the irresistibility, or insuperability, of divine grace in conversion is a necessary consequence of scriptural views of man’s entire depravity, and his inability by nature to will anything spiritually good; and that all that Calvinists intend to set forth in maintaining this doctrine, is declared when they assert that it is necessary that men’s will be renewed, and that, in the commencement of the process by which this renovation is effected, they are wholly passive,—incapable of co-operating with divine grace, or with the Holy Spirit operating upon them, until He has, by His own almighty power, effected an important change upon them. This change is sometimes called regeneration, when that word is taken in its most limited sense, as distinguished from conversion [the exercise of faith in Christ and repentance]; and, in that case, regeneration means the first implantation of spiritual life,—the process of vivification, or making alive,—while conversion describes the process by which men, now quickened and renewed,—no longer passive, but active,—do willingly turn to God, and embrace Jesus Christ as all their salvation and all their desire; and the whole is comprehended under the designation of effectual calling, which includes the whole work of the Spirit, in applying to men the blessings which Christ purchased, and in effecting that important change in their condition and character which is, in every instance, indispensable to salvation. An essential part of this process is the renovation of the will, or the giving it a new capacity or tendency,—a power of willing what is spiritually good,—whereas before it could will only what was spiritually evil. And it is important to have our attention directed to this feature in the process, as it is that right views of which most directly oppose and exclude Arminian errors upon this subject. In the description of effectual calling, given in the [Westminster] Shorter Catechism, it is said to be “a work of God’s Spirit, whereby, convincing us of sin and misery, enlightening our minds in the knowledge of Christ, and renewing our wills, He does persuade and enable us to embrace Jesus Christ freely offered to us in the gospel.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/william-cunningham.html">William Cunningham</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Historical Theology</cite>, vol. 2, 1862, reprinted Banner of Truth, 1994, Ch. 25, The Arminian Controversy, Section 6, Efficacious &amp; Irresistible Grace, pp. 411-12</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/effectual-calling/means-of-calling.html">Means of Calling</a></span></div>

ency%2C%E2%80%94a+power+of+willing+what+is+spiritually+good%2C%E2%80%94whereas+before+it+could+will+only+what+was+spiritually+evil.+And+it+is+important+to+have+our+attention+directed+to+this+feature+in+the+process%2C+as+it+is+that+right+views+of+which+most+directly+oppose+and+exclude+Arminian+errors+upon+this+subject.+In+the+description+of+effectual+calling%2C+given+in+the+%5BWestminster%5D+Shorter+Catechism%2C+it+is+said+to+be+%E2%80%9Ca+work+of+God%E2%80%99s+Spirit%2C+whereby%2C+convincing+us+of+sin+and+misery%2C+enlightening+our+minds+in+the+knowledge+of+Christ%2C+and+renewing+our+wills%2C+He+does+persuade+and+enable+us+to+embrace+Jesus+Christ+freely+offered+to+us+in+the+gospel.%E2%80%9D%0A%0A%E2%80%94+William+Cunningham%2C+Historical+Theology%2C+vol.+2%2C+1862%2C+reprinted+Banner+of+Truth%2C+1994%2C+Ch.+25%2C+The+Arminian+Controversy%2C+Section+6%2C+Efficacious+%26+Irresistible+Grace%2C+pp.+411-12&amp;url=https%3A%2F%2F5solasquotes.github.io%2Fquote%2Fe19224ab05.html&amp;via=5Solas" target="_blank" rel="noopener">Share on X</a><a class="perma" href="../quote/e19224ab05.html">Permalink</a><a class="src" href="https://reformedbooksonline.com/topics/topics-by-subject/the-sincere-free-offer-of-the-gospel/quotes-on-the-sincere-free-offer-of-the-gospel/you-must-choose-christ-to-be-saved/#:~:text=It%20will%20be%20seen%2C%20then%2C%20that,offered%20to%20us%20in%20the%20gospel&amp;text=It%20will%20be%20seen%2C%20then%2C%20that%20the%20doctrine&amp;text=Christ%20freely%20offered%20to%20us%20in%20the%20gospel" rel="noopener" target="_blank">Read it online · Reformed Books Online</a></div>

<blockquote><p>3. You must open your hearts and give entertainment unto Christ, if you ever expect to have the gate of Heaven opened unto you, and to be entertained by Christ in his Kingdom. Such as shut the door of their hearts against Christ when they are young, will find (if Christ does not withdraw, and leave knocking) that the door will be faster bolted and barred within against Him; the longer you hold it out, the more will Satan strengthen the fort against Christ, and more easily beat off whatever assaults are made upon you by the Word and Spirit. Christ will come in most willingly to them that open to Him presently; and the match will quickly be made up, if in youth you hearken to the motion. Let me beseech you, therefore, my dearly beloved young ones, to open the door to Christ without any further delay; by me He stands now and knocks for entertainment; what answer shall I return, that you have harbored lusts there, where his lodging should be, and would not part with them? that you put me off till a further day, until you had a little longer tasted the sweets of sin: O take heed of such carriage of heart towards Christ, Qui non est hodie, cras minus aptus erit, if you be not willing to open to Christ now, you will be more unwilling tomorrow: do it then presently; may I be instrumental to join the Lord Jesus Christ and you together in marriage; receive Him into your hearts, and accept of Him, to love, honor, and obey Him, and do it heartily and resolvedly, and He is yours.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/thomas-vincent.html">Thomas Vincent</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Words of Advice to Young Men delivered in Two Sermons</cite>, … (London: Parkhurst, 1668), sermon 1, sect. 5, pp. 25-26</span></figcaption>

<div class="actions"><button class="copy" data-copy="“3. You must open your hearts and give entertainment unto Christ, if you ever expect to have the gate of Heaven opened unto you, and to be entertained by Christ in his Kingdom. Such as shut the door of their hearts against Christ when they are young, will find (if Christ does not withdraw, and leave knocking) that the door will be faster bolted and barred within against Him; the longer you hold it out, the more will Satan strengthen the fort against Christ, and more easily beat off whatever assaults are made upon you by the Word and Spirit. Christ will come in most willingly to them that open to Him presently; and the match will quickly be made up, if in youth you hearken to the motion. Let me beseech you, therefore, my dearly beloved young ones, to open the door to Christ without any further delay; by me He stands now and knocks for entertainment; what answer shall I return, that you have harbored lusts there, where his lodging should be, and would not part with them? that you put me off till a further day, until you had a little longer tasted the sweets of sin: O take heed of such carriage of heart towards Christ, Qui non est hodie, cras minus aptus erit, if you be not willing to open to Christ now, you will be more unwilling tomorrow: do it then presently; may I be instrumental to join the Lord Jesus Christ and you together in marriage; receive Him into your hearts, and accept of Him, to love, honor, and obey Him, and do it heartily and resolvedly, and He is yours.”

— Thomas Vincent, Words of Advice to Young Men delivered in Two Sermons… (London: Parkhurst, 1668), sermon 1, sect. 5, pp. 25-26">Copy</button><a class="share" href="https://x.com/intent/post?text=%E2%80%9C3.+You+must+open+your+hearts+and+give+entertainment+unto+Christ%2C+if+you+ever+expect+to+have+the+gate+of+Heaven+opened+unto+you%2C+and+to+be+entertained+by+Christ+in+his+Kingdom.+Such+as+shut+the+door+of+their+hearts+against+Christ+when+they+are+young%2C+will+find+%28if+Christ+does+not+withdraw%2C+and+leave+knocking%29+that+the+door+will+be+faster+bolted+and+barred+within+against+Him%3B+the+longer+you+hold+it+out%2C+the+more+will+Satan+strengthen+the+fort+against+Christ%2C+and+more+easily+beat+off+whatever+assaults+are+made+upon+you+by+the+Word+and+Spirit.+Christ+will+come+in+most+willingly+to+them+that+open+to+Him+presently%3B+and+the+match+will+quickly+be+made+up%2C+if+in+youth+you+hearken+to+the+motion.+Let+me+beseech+you%2C+therefore%2C+my+dearly+beloved+young+ones%2C+to+open+the+door+to+Christ+without+any+further+delay%3B+by+me+He+stands+now+and+knocks+for+entertainment%3B+what+answer+shall+I+return%2C+that+you+have+harbored+lusts+there%2C+where+his+lodging+should+be%2C+and+would+not+part+with+them%3F+that+you+put+me+off+till+a+further+day%2C+until+you+had+a+little+longer+tasted+the+sweets+of+sin%3A+O+take+heed+of+such+carriage+of+heart+towards+Christ%2C+Qui+non+est+hodie%2C+cras+minus+aptus+erit%2C+if+you+be+not+willing+to+open+to+Christ+now%2C+you+will+be+more+unwilling+tomorrow%3A+do+it+then+presently%3B+may+I+be+instrumental+to+join+the+Lord+Jesus+Christ+and+you+together+in+marriage%3B+receive+Him+into+your+hearts%2C+and+accept+of+Him%2C+to+love%2C+honor%2C+and+obey+Him%2C+and+do+it+heartily+and+resolvedly%2C+and+He+is+yours.%E2%80%9D%0A%0A%E2%80%94+Thomas+Vincent%2C+Words+of+Advice+to+Young+Men+delivered+in+Two+Sermons%E2%80%A6+%28London%3A+Parkhurst%2C+1668%29%2C+sermon+1%2C+sect.+5%2C+pp.+25-26&amp;url=https%3A%2F%2F5solasquotes.github.io%2Fquote%2Ff0

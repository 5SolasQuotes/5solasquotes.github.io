<main class="wrap"><figure class="quote" id="q-688db4ad07" data-kw="">
<blockquote><p>Thesis XII: The impulsive efficient [cause], that is, that because of which we have been chosen, is the benevolent disposition of the will of God, or the εὐδοκία, or good pleasure, of the divine will. Explanation: I. It is a question among us, the Lutherans, and the Papists: What moved or impelled God (it is permitted to us to make use of these words, which rather agree with the decrees of men, and are accommodated to our capacity: for properly speaking no impulsive cause of the divine will is granted, as we saw above) to decree to grant eternal life to certain men? We respond: That God was moved by no other thing to determine eternal life for certain ones, than by the benevolent disposition of His will, or His own good pleasure. There are principally two foundations of our opinion: (1.) Because the Scripture names this alone as the cause of election. Ephesians 1:5, He predestinated us, whom He would adopt as Sons through Jesus Christ unto Himself, according to the benevolent disposition of His own will…</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/marcus-f-wendelin.html">Marcus F. Wendelin</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Christian Theology 3rd</cite>, ed. (1634), ‘Doctrine of Election’, pt. 1 Wendelin (1584-1652)</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/the-covenant-of-grace/the-gospel-offer.html">The Gospel Offer</a></span></div>

</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-533414df6f" data-kw="">
<blockquote><p>God shows here, by his prophet, that He was constrained by urgent necessity to deal sharply and roughly with the people. Nothing, we know, is more pleasing to God than to treat us kindly; for there is not found a father in the world who cherishes his children as tenderly: but we, being perverse, suffer Him not to follow the inclination of his nature. He is therefore constrained to put on, as it were, a new character, and to chide us severely, according to the way in which He here says, He had treated the Israelites; ‘I have cut them,’ He says, ‘by my prophets, and killed them by the words of my mouth.&#x27;</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/john-calvin.html">John Calvin</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Commentary on Hosea</cite>, 6:5</span></figcaption>

</figure><figure class="quote" id="q-0c0f228bdf" data-kw="">
<blockquote><p>3. If God has so laid the design to save a sinner freely, then how great, how just is the condemnation of guilty sinners that will not hasten in unto it: How could the Lord have laid it more freely then He has? Oh that any sinner, forever condemned to Hell without it, should withstand it! Why sinner? Shall the Blessed God, that might have much glory in condemning thee to all eternity, be willing to save thee freely; and wilt thou not come and bow unto Him and accept of it? All the contempt of God in all his holy commands is not like this, to turn the back upon free-mercy, free-salvation: This will be the worm that never dies to any of your souls that shall not come into and rightly accept of gospel-salvation, that you might have been saved freely, have had grace, remission of sins, Jesus Christ, the Spirit, eternal life freely, and yet turned your backs upon it?</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/anthony-palmer.html">Anthony Palmer</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Gospel New-Creature</cite>, (London: Brewster, 1658), pp. 115–16</span></figcaption>

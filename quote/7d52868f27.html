<main class="wrap"><figure class="quote" id="q-7d52868f27" data-kw="">
<blockquote><p>Every sin invades the rights of God and strips him of one or other of his perfections. It is such a vilifying of God as if he were not God; as if he were not the supreme Creator and benefactor of the world; as if we had not our being from him; as if the air we breathed in, the food we lived by were our own by right of supremacy, not of donation.… That affection that excites a man to break his law would excite him to annihilate his being if it were in his power. A man in every sin aims to set up his own will as his rule and his own glory as the end of his actions, against the will and glory of God; and could a sinner attain his end, God would be destroyed: God cannot outlive his will and his glory.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/stephen-charnock.html">Stephen Charnock</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Existence and Attributes of God</cite>, Discourse 2, On Practical Atheism (every sin invades God’s rights)</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/sin/nature-of-sin.html">Nature of Sin</a> › <a href="../topics/sin/nature-of-sin/sin-as-rebellion.html">Sin as rebellion</a></span></div>

</figure><figure class="quote" id="q-d7537e3755" data-kw="Original Sin">
<blockquote><p>Nor does original sin cease to be sin because it was committed by us neither voluntarily nor knowingly; for it is enough that τὸ ἄνομον [to anomon, the lawless thing] is in our nature, however much [deliberate choice] may be absent.</p></blockquote>

<div class="actions"><button class="copy" data-copy="“Nor does original sin cease to be sin because it was committed by us neither voluntarily nor knowingly; for it is enough that τὸ ἄνομον [to anomon, the lawless thing] is in our nature, however much [deliberate choice] may be absent.”

— Johannes Wollebius, Compendium of Christian Theology, 1.10">Copy</button><a class="share" href="https://x.com/intent/post?text=%E2%80%9CNor+does+original+sin+cease+to+be+sin+because+it+was+committed+by+us+neither+voluntarily+nor+knowingly%3B+for+it+is+enough+that+%CF%84%E1%BD%B8+%E1%BC%84%CE%BD%CE%BF%CE%BC%CE%BF%CE%BD+%5Bto+anomon%2C+the+lawless+thing%5D+is+in+our+nature%2C+however+much+%5Bdeliberate+choice%5D+may+be+absent.%E2%80%9D%0A%0A%E2%80%94+Johannes+Wollebius%2C+Compendium+of+Christian+Theology%2C+1.10&amp;url=https%3A%2F%2F5solasquotes.github.io%2Fquote%2Fd7537e3755.html&amp;via=5Solas" target="_blank" rel="noopener">Share on X</a><a class="perma" href="../quote/d7537e3755.html">Permalink</a><span class="src none">No free online copy linked</span></div>
</figure><figure class="quote" id="q-c2ea72c458" data-kw="">
<blockquote><p>When we pursue worldly wealth or worldly reputation with more vehemence than the riches of grace or the favor of God; when we have a foolish imagination that our happiness consists in them, we prefer earth before heaven, broken cisterns that can hold no water before an ever-springing fountain of glory and bliss, and, as though there were a defect in God, cannot be content with him as our portion without an addition of something inferior to him; when we make it our hopes to say to the wedge, “You are my confidence,” and rejoice more because it is great and because our hand has gotten much than in the privilege of communion with God and the promise of an everlasting fruition of him (Job 31:24–25)—this is so gross that Job joins it with the idolatry of the sun and moon.… And the apostle, when he mentions covetousness or covetous men, passes it not over without the title of idolatry to the vice and idolater to the person (Col. 3:5), in that it is a preferring of clay and dirt as an end more desirable than the original of all goodness, in regard of affection and dependence.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/stephen-charnock.html">Stephen Charnock</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Existence and Attributes of God</cite>, Discourse 2, On Practical Atheism (covetousness as idolatry)</span></figcaption>

</figure><figure class="quote" id="q-19470c5e06" data-kw="Author of sin">
<blockquote><p>Yet we are able to reconcile them easily enough, if we distinguish within sin its material element, namely, the habit or act that is the substrate of the wickedness, with which, inasmuch as it is physically good, God is not able not to concur as the efficient cause, without casting aside his own independence (Acts 17:28; Rom. 11:36), and its formal element, lawlessness (1 John 3:4), through which the act or habit is sin, whose author he cannot be, because the one set above all law cannot transgress the law.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/petrus-van-mastricht.html">Petrus van Mastricht</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Theoretical-Practical Theology</cite>, Vol. 3, bk. 3, ch. 10 (Providence), §18</span></figcaption>

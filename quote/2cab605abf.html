<main class="wrap"><figure class="quote" id="q-2cab605abf" data-kw="">
<blockquote><p>All the epistles written by the apostles are a breathing out of love to their flock, not caring to be spent upon them for their good, that they might get them brought forward and present them as chaste virgins to their bridegroom. Therefore, they style their people ‘dearly beloved,’ not using words of office or flattery, but of truth and affection. The hireling will flee, but the true shepherd will lay down his life for the sheep [John 10:11,15]. And if the pest [plague] were in the congregation, he would not leave them, but would go as near them as the Lord’s law, or preservation of his own life, would permit.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/david-dickson.html">David Dickson</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Sermon 10 of Sermons on Jeremiah’s Lamentations (RHB &amp; Naphtali Press) Probably from 1628, around the siege and final fall of La Rochelle, France.</cite></span></figcaption>
<div class="meta"><span class="t"><a href="../topics/civil-government-and-society/plague-quarantine-and-public-health.html">Plague, Quarantine and Public Health</a></span></div>

</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-c6852c840c" data-kw="">
<blockquote><p>The truth is, the times were very sad, and nothing but lamentation and bemoanings heard in the streets. Those that had wealth retired into the country, but those that were needy were, if not taken away by death, almost starved, and so consequently ready to mutiny against their superiors for relief. All the gates of colleges and halls were constantly kept shut day and night, a few persons being left in them to keep possession. The shops of the town were closed, none but the attendants on the sick or the collectors for them were to be seen stirring abroad, the churches were seldom or never open for divine service.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/london.html">London</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Charles Creighton, A History of Epidemics in Britain, from A.D. 664 to the Extinction of the Plague [1666] (Cambridge, 1891)</cite>, p. 497</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/civil-government-and-society/plague-quarantine-and-public-health.html">Plague, Quarantine and Public Health</a></span></div>

</figure><figure class="quote" id="q-22776c76f8" data-kw="">
<blockquote><p>…[Magistrates, during a time of plague] must follow the example of David in this place who humbled himself before the Lord, who prayed for himself and for the people, and built an altar and offered up sacrifice; that is, they must maintain God’s truth to the uttermost of their power; they must set forward the preaching of the Word; they must with good Hezekiah and Josiah remove all idolatry and superstition (2 Kings 18:4; 23:4); they must also with David labor to find out the cause of God’s punishment, and remove it as he did when famine was in his land (2 Sam. 21:1,9)…</p></blockquote>

<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/samuel-rutherford.html">Samuel Rutherford</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Divine Right of Church Government (1646), pp. 481-2 | “If there be no formed Church endued with knowledge and discretion to choose their own elders, if there be godly men fit to be chosen, they are to convene and choose from amongst them elders, the godly magistrate is to join his vote and power, because there is a Church not yet constitute[d], it is now Perturbatus aut corruptus Ecclesiae status [the state of the Church is disturbed or corrupted], and I ever judged it a golden saying of that great divine Francis Junius:</cite></span></figcaption>

</figure><figure class="quote" id="q-139d516bd3" data-kw="">
<blockquote><p>Whereas some object that the care both of temporal good and spiritual good belongs to the magistrate, therefore he must have a power to make Church laws. See [David] Pareus. For his care cannot be supreme, if he must rule at the nod and beck of Church-men. I Answer, the connection is weak: he who has the care of both the temporal and spiritual good of the people, he has a nomothetic [law-making] power to procure both these two goods: it follows [in] no way, for then might he have a power in his own person to preach, and administrate the sacraments; this power [of the magistrate] procures the spiritual good, but such as is the care, such is the power: the care is politic and civil; Therefore the power to procure the spiritual good, must bee politic and civil [circa sacra, not in sacra].</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/samuel-rutherford.html">Samuel Rutherford</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Due Right of Presbyteries (1644), Appendix</cite>, pp. 442-3</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/civil-government-and-society/plague-quarantine-and-public-health.html">Plague, Quarantine and Public Health</a></span></div>

<main class="wrap"><figure class="quote" id="q-79ac24fe26" data-kw="">
<blockquote><p>The Papists have often endeavoured to overthrow the Reformation by secret plots and conspiracies. So there were many plots against the life of Luther. The Papists were engaged in contriving to dispatch him, and to put him out of their way; and he, as he was a very bold man, often very much exposed himself in the cause of Christ: but yet they were wonderfully prevented from hurting him, and he at last died in his bed in peace.

And so there have been from time to time innumerable schemes secretly laid for the overthrow of the Protestant religion; among which, that which seem to be most considerable, and which seemed to be the most likely to have taken effect, was that which was in the time of King James II. of England, which is within the memory of many of us. There was at that time a strong conspiracy between the King of England and Lewis XIV. of France, who were both Papists, to extirpate the Northern heresy, as they called the Protestant religion, not only out of England, but out of all Europe; and had laid their schemes so, that they seemed to be almost sure of their purpose.

They looked upon it, that if the Reformed religion were suppressed in the British realms, and in the Netherlands, which were the strongest part, and chief defence of the Protestant interest, they should have easy work with the rest. And just as their matters seemed to become to a head, and their enterprise ripe for execution, God, in his providence, suddenly dashed all their schemes in pieces by the Revolution, at the coming in of King William and Queen Mary; by which all their designs were at an end; and the Protestant interest was more strongly established, by the crown of England’s being established in the Protestant house of Hanover, and a Papist being, by the constitution of the nation, for ever rendered incapable of wearing the crown of England. Thus they groped in darkness at noon day as in the night, and their hands could not perform their enterprise, and their kingdom was full of darkness, and they gnawed their tongues for pain. …

There was also a terrible persecution in England in Queen Mary’s time, wherein great numbers in all parts of the kingdom were burnt alive. After this, though the Protestant religion has been for the most part established by law in England, yet there have been very severe persecutions by the high church men, who symbolize in many things with the Papists. Such a persecution was that which occasioned our forefathers to flee from their native country, and to come and settle in this land, which was then an hideous howling wilderness. These persecutions were continued with little intermission till King William come to the throne.

Scotland also has been the scene, for many years together, of cruelties and blood by the hands of high churchmen, such as came very little short of the Popish persecution in Queen Mary’s days, and in many things much exceed it, which continued till they were delivered by King William. …

So since, when the Popish powers have plotted the overthrow of the Reformed church, and have seemed just about to bring their matters to a conclusion, and to finish their design, then God has wonderfully appeared for the deliverance of his church, as it was in the time of the Revolution by King William.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/jonathan-edwards.html">Jonathan Edwards</a></span><span class="wk"><span class="lbl">Work:</span> <cite>A history of the work of redemption. Containing the outlines of a body of divinity, in a method entirely new</cite>, ed. John Erskine (1774; Boston, 1782), pp 225, 228, 242.</span></figcaption>

e26.html&amp;via=5Solas" target="_blank" rel="noopener">Share on X</a><a class="perma" href="../quote/79ac24fe26.html">Permalink</a><a class="src" href="https://reformedcovenanter.wordpress.com/2019/09/20/jonathan-edwards-on-king-william-iii-and-the-defeat-of-popish-plots-against-the-reformed-church/" rel="noopener" target="_blank">Read it online · Reformed Covenanter</a></div>

</figure><figure class="quote" id="q-69c3303193" data-kw="">
<blockquote><p>But as this peace among Protestant Churches is very much to be wished and prayed for, so I despair to see so glorious a work take effect, except the differing parties would resolve to stand to the rules following:

1. That the respective parties which agree in the chief points of religion do not make any of those points they differ in, fundamental, as if the fortune of religion depended upon it, or as if those different points were so many different religions.

2. That the differing parties do not damn one another for those differences, there being nothing that has done religion more hurt than men’s damning one another for things which Christ and his apostles have affixed no damnation to.

3. That notwithstanding the little differences that are among them, they make one Church and endeavour after the welfare and prosperity of it, and join together in public prayer and in the sacrament of the eucharist, which is the badge and symbol of fraternity and amity.

4. That one party be not presently jealous and suspicious of the other, as if the opinion which one party espouses were embraced or maintained in a humor or for worldly ends, but that they charitably believe it’s conscience that puts them upon it, at least till either the party espousing that opinion confesses that conscience is not at the bottom of it or that it appear by undeniable evidences that a worldly or sinister design is the foundation of it.

5. That the differing parties do not multiply the controversies which are amongst them, make them neither more numerous nor greater than really they are, and that they do not interpret an accidental unwary expression that may drop from the pen or mouth of one party as a new controversy.

6. That one party do not charge the other with consequences which they do not own, nor with doctrines and positions which they detest from their hearts.

7. That each party defending or proving their opinion do it with great modesty, without provoking or exasperating or approbrious language and revilings or bitter reflections on the other.

8. That of these differing parties none do vie with the other except it be in living up to the precepts of the Gospel, particularly those of patience, long-suffering and charity. These rules I apprehend to be the foundation of peace and concord of Protestant Churches that differ in points of no great concernment; and were these maxims once put in practice, the particular controversies might soon be compromised. To this purpose is that saying of the apostle: ‘Nevertheless, whereto we have already attained, let’s walk by the same rule, let’s mind the same things; and if any be otherwise minded, God will even reveal that unto you,’ Phil. 3:15-16.</p></blockquote>

 it online · Reformed Books Online</a></div>

<blockquote><p>Fourthly, howsoever many have years of discretion, and the common use of natural gifts of understanding: yet if they neither have the knowledge of God, nor the knowledge of themselves, nor the knowledge of the doctrine of the sacraments, and other fundamental points of religion, they are not to be admitted [to the Supper,] but refused.</p></blockquote>

<blockquote><p>2. Whether a separation may be iustly made from our Church for some errors or corruptions of life. I know that diverse who were once among us, never of us, have put out their own lights, indeed excommunicated themselves. What’s their plea? That our assemblies are full of enormities. I answer: That the defects and corruptions of a Church must be distinguished: they are either in doctrine or in manners. For doctrine, some errors are Citra fundamentum, some Circa fundamentum, others Contra fundamentum. Errors beside the foundation trouble, errors about the foundation shake, errors against the foundation ouerturn all. So long then as no foundation is harmed, it is not lawful depart until the Church separates from Christ, we must not separate from it. In two cases there is warrant of separation: First, when the substance of God’s worship is quite corrupted. What agreement has the Temple of God with idols? (2 Cor. 6:16) When this is, verse 17, ‘Come out from among them, and be ye separate, says the Lord,’ When Jeroboam had set up idols in Israel, the priests and the Levites left their suburbs and possession and came to Judah and Jerusalem. (2 Chron. 11:14) Secondly, when the substance of doctrine is quite corrupted. If any man consent not to the words of our Lord Jesus Christ, and to the doctrine which is according to godliness, etc. (1 Tim. 6:3) ‘From such,’ verse 5, ‘withdraw thyself.’ Paul in the synagogue at Ephesus preached for the space of three months together. (Acts 19:9) But when diverse were hardened, and believed not, but spake evil of that way, he departed from them, and separated the disciples. In these two cases lawful, not else.</p></blockquote>

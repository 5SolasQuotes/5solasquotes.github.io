<main class="wrap"><figure class="quote" id="q-dbe357d368" data-kw="">
<blockquote><p>Reading of the word in the congregation, being part of the publick worship of God, (wherein we acknowledge our dependence upon him, and subjection to him,) and one mean sanctified by him for the edifying of his people, is to be performed by the pastors and teachers.</p></blockquote>

</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-f9b2e72a0b" data-kw="">
<blockquote><p>The proper act of religion is to bestow honor upon God and is called worship and adoration, Ex. 12:25, 26; Jn. 4:23. It must bear a certain good towards God, otherwise it would not be observance towards Him. No intrinsic good can be added to God, but honor is an outward good–a testimony to the virtue of another which adds to his glory or esteem. This is all a creature can do for God.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/william-ames.html">William Ames</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Marrow of Theology, ed. John Eusden (1639; Baker, 1997), bk. 2, ch. 4, ‘Religion’, section 23, p. 239 See also the chart on</cite>, pp. 72-73.</span></figcaption>

</figure><figure class="quote" id="q-0a04facbbf" data-kw="">
<blockquote><p>Dr. [Thomas] Jackson [d. 1640] in his Original of Unbelief [1625], pp. 334-35, very aptly to this purpose notes that some expressions may sometime be used, and observed well, which to use ordinarily (much more to institute) would be ridiculous or impious. As Jacob did unblameablely kiss his son Joseph’s coat, yet to have hanged it about his bed or table that it might receive such salutations evening and morning or at every meal time, might have countenanced many branches of superstition: once and use it not, may be discretion of those things whose continual use degenerates into abuse.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/william-ames.html">William Ames</a></span><span class="wk"><span class="lbl">Work:</span> <cite>A Fresh Suit Against Human Ceremonies in God’s Worship… (Amsterdam: Thorp, 1633), Manuduction, ch. 4, ‘Concerning the nature and definition of a ceremony’</cite>, pp. 26-27</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/worship/nature-of-worship.html">Nature of Worship</a></span></div>

</figure><figure class="quote" id="q-5fcaba6fdc" data-kw="">
<blockquote><p>every word that appertains to God may be required and discussed, and all knowledge of things out of them may be understood. But if anything do remain which the holy Scripture ought to be received to authorize any knowledge; but that which remains we must commit to the fire, that is, we must reserve it to God. For in this present world God would not have us to know all things.</p></blockquote>

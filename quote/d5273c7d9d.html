<blockquote><p>Paradise signifies a garden, the word being translated out of Greek into Latin, and so into French and English. In Hebrew it is called Heden, which signifies delights, a garden of all manner of delights, a place beset with all kind of fruitful and beautiful trees. There were two special trees in it, one called the tree of life, the other of the knowledge of good and evil. Some say it was called the tree of life from the effect, because of the hidden power and force it had a of sustaining and prolonging man’s life.1 Although it be a dispute, whether it had this force as meat [food] to prolong life or as medicine to prevent death, old age and diseases, as likewise whether this power in the tree were natural or supernatural. Therefore others say it was called so not from the effect, but signification, because it was an outward sign, that God would give them immortality if they did continue. 1. Paradise was a little model of heaven, and a sign of the great heaven, assuring Adam, that if he continued in obedience to God, he should be translated into heaven, to enjoy God supernaturally, as there he did enjoy him naturally: for the Law saying, “Do this and live,” [Luke 10:28] means it of ever lasting life.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/edward-leigh.html">Edward Leigh</a></span><span class="wk"><span class="lbl">Work:</span> <cite>A Treatise Of Divinity Consisting Of Three Books</cite>, (London, 1646), 122 [Spelling and punctuation modernized].</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/judgment-and-the-final-state/heaven-and-eternal-glory.html">Heaven and Eternal Glory</a></span></div>

<blockquote><p>That, however, of which it now consists (for it must not be called immaterial) is corporeal substance. For it will be, and in part already is, the ordinary place of glorified bodies, Jn. 14:2-3; 17:24. It was visibly opened, Mt. 3:16; Acts 7:56, and was passed through by Christ ascending, Eph. 4:10. It also has its own magnitude, Jn. 14:2-3. Meanwhile, we maintain that this substance is most subtle, most lucid, and subject to no corruption, on the ground of the places: 1 Tim. 6:16; Rev. 21-22. The position of this heaven is uppermost and outermost, above all visible heavens, Dt. 4:39; Lk. 2:14; Eph. 4:10. Its circuit, moreover, is most capacious, Jn. 14:2-3.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/johann-heinrich-alting.html">Johann Heinrich Alting</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Scriptural Theology of Heidelberg</cite>, vol. 1 (d. 1644; Amsterdam: Jansson, 1646), Locus 5, ‘On Creation’, trans. AI at Confessionally Reformed Theology</span></figcaption>

</figure><figure class="quote" id="q-56ef4b4cff" data-kw="">
<blockquote><p>Next we must consider the general organization of Israel that originated in this berith. This is usually designated as ‘theocracy’. This name for it is not found in the Scriptures, although it admirably describes what the Biblical account represents Israel’s constitution to have been. Probably the term was coined by Josephus. He observes in regard to the governments of other nations, that some of these were monarchies, others oligarchies, still others democracies; what God set up among Israel was a theocracy. Obviously Josephus finds in this something distinctive and unique. This is correct as far as the great systems of civilization of that day were concerned. But it is not quite correct, if Israel be compared with other Shemitic tribes. The theocratic principle, i.e., the principle of the deity being the supreme authority and power in national life, seems to have been not uncommon among the Shemites. We may infer as much from the observation that Melekh, ‘King’, is a frequent Shemitic name for the deity. But while under ordinary circumstances this was a mere belief, it proved among Israel an undoubted reality. The laws under which Israel lived not merely had the divine sanction behind them in the general sense in which all law and order ultimately derives from God through general revelation by way of the conscience, but in the specific sense, that Jehovah had directly revealed the law. In other words Jehovah in person performed the task usually falling to a human king. And in the sequel also, Jehovah by supernatural interposition, when necessary, continued to act the role of King of the nation. This fact was so deeply embedded in the consciousness of the leaders of Israel that still in the time of Gideon and Samuel it was felt to forbid the setting up of a purely human kingdom. The union of the religious lordship and the national kingship in the one Person of Jehovah involved that among Israel civil and religious life were inextricably interwoven. If the union had happened to exist in any other person but God, a division of the two spheres of relationship might have been conceivable. The bond to God is so one and indivisible that no separation of the one from the other can be conceived. Hence the later prophetic condemnation of politics, not merely wicked politics, but politics per se, as derogatory to the royal prerogative of Jehovah. Further it ought to be noticed that between these two concentric spheres the religious one has the pre-eminence. It is that for the sake of which the other exists. For our system of political government such an interrelation would, of course, seen a serious, intolerable defect. Not so among Israel. The chief end for which Israel had been created was not to teach the world lessons in political economy, but in the midst of a world of paganism to teach true religion, even at the sacrifice of much secular propaganda and advantage. Nor was it merely a question of teaching religion for the present world. A missionary institution theocracy never was intended to be in its Old Testament state. The significance of the unique organization of Israel can be rightly measured only by remembering that theocracy typified nothing short of the perfected kingdom of God, the consummate state of Heaven. In this ideal state there will be no longer any place for the distinction between church and state. The former will have absorbed the latter. In a rough way the principle involved was already apprehended by Josephus. In the passage introducing the word ‘theocracy’ he observes that Moses, by giving such a constitution to the Israelites, did not make religion a part of virtue, but made all other virtues to be a part of religion. The fusion between the two spheres of secular and religious life is strikingly expressed by the divine promise that Israel will be made ‘a kingdom of priests and an holy nation’ [Ex. 19:6]. As priests they are in, nay, constitute the kingdom.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/geerhardus-vos.html">Geerhardus Vos</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Biblical Theology: Old and New Testaments</cite>, (Eugene, OR: Wipf &amp; Stock Publishers, 2003), 124–26.</span></figcaption>

ll+other+virtues+to+be+a+part+of+religion.+The+fusion+between+the+two+spheres+of+secular+and+religious+life+is+strikingly+expressed+by+the+divine+promise+that+Israel+will+be+made+%E2%80%98a+kingdom+of+priests+and+an+holy+nation%E2%80%99+%5BEx.+19%3A6%5D.+As+priests+they+are+in%2C+nay%2C+constitute+the+kingdom.%E2%80%9D%0A%0A%E2%80%94+Geerhardus+Vos%2C+Biblical+Theology%3A+Old+and+New+Testaments+%28Eugene%2C+OR%3A+Wipf+%26+Stock+Publishers%2C+2003%29%2C+124%E2%80%9326+%28HT%3A+%40JimLincoln1517+on+X%29.&amp;url=https%3A%2F%2F5solasquotes.github.io%2Fquote%2F56ef4b4cff.html&amp;via=5Solas" target="_blank" rel="noopener">Share on X</a><a class="perma" href="../quote/56ef4b4cff.html">Permalink</a><a class="src" href="https://heidelblog.net/2025/08/vos-the-israelite-theocracy-was-a-type-and-shadow-of-heaven/" rel="noopener" target="_blank">Read it online · Heidelblog</a></div>
</figure><figure class="quote" id="q-e3c4b7bc33" data-kw="">
<blockquote><p>Life Eternal is the life of glory, wherein the soul, joined to our body, enjoys God forever, being advanced to the highest top and height of her felicity. The Cause of this life is God, to wit, the Father the efficient, the Son the meritorious, and the Holy Ghost the sealing and applying cause. The Matter, which has the respect of the subject, are those good things, which neither eye has seen, nor ear heard, nor can the mind of man comprehend. That which is of the Object, are all the blessed and elect. The Form is the most perfect knowledge, vision, and fruition of God Himself, and the exceeding felicity &amp; blessedness of man, which accompanies the same, which also consists both in the separation, and absence of all evil things, and in the participation, and presence of all good things; both are both perfect and eternal. The End is the glory of God’s grace, and the glorifying of the elect.</p></blockquote>

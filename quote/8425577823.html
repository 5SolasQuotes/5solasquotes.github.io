<main class="wrap"><figure class="quote" id="q-8425577823" data-kw="">
<blockquote><p>To all this it may be answered, that what is contended for is that the Christian church is warranted by the observance of services analogous to those of the Jewish temple to commemorate the past illustrious events of her history. Where is the warrant? We have a divine warrant for the observance of the Lord’s day. We have a divine warrant for the observance of the two sacraments of baptism and the Lord’s supper. What other days are we enjoined to keep holy? What other symbolical ordinances are we commanded to observe?

To take the ground that the church has a discretionary power to appoint other holy days and other symbolical rites is to concede to Rome the legitimacy of her five superfluous sacraments and all her self-devised paraphernalia of sacred festivals. There is no middle ground. Either we are bound by the Lord’s appointments in his Word, or human discretion is logically entitled to the full-blown license of Rome.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/john-l-girardeau.html">John L. Girardeau</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Instrumental Music in the Public Worship of the Church</cite>, (Richmond VA: Whittet &amp; Shepperson, 1888), p. 89.</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/worship/holy-days-and-church-calendar.html">Holy Days and Church Calendar</a></span></div>

</figure><figure class="quote" id="q-19f44e6044" data-kw="">
<blockquote><p>Some make a mockery of the holy things of God. One part of the year they will be holy; a rotten, foolish affection of people that are popish. In Lent they will use a little austerity, oh! they will please God wondrously! but before and after they are devils incarnate. So they make that part of the year as a good parenthesis, in an unlearned and unwitty speech. A good parenthesis is unseemly in a wicked speech, and a good piece is unseemly in a ragged garment; so their lives that make a good show then (and there are few that do so, they are scarce among us; men are such atheists that there is not outward reformation, but if there be), if they give themselves leave to be civil, and to respect holy things a little time, afterward they return to their looseness again. Doth this patching out of a holy life please God? No, no! ‘I have sworn, and I will perform it, that I will keep thy righteous statutes,’ saith David, Ps. 119:106. And St Paul, ‘I have resolved to be so to the end;’ I will be myself still. So where grace is, there is a resolution against all sin for the time to come. If you entertain not this resolution, to walk ‘in holiness and righteousness all the days of your life,’ Luke 1:75, acknowledge no benefit by Christ’s redemption, and come not near the holy things of God.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/richard-sibbes.html">Richard Sibbes</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Complete Works of Richard Sibbes</cite>, vol. 3 (Edinburgh; London; Dublin: James Nichol; James Nisbet and Co.; W. Robertson, 1862), 313.</span></figcaption>

</figure><figure class="quote" id="q-682b6ca324" data-kw="">
<blockquote><p>The Bishop presseth us with a fourth Argument, taken from the calling of people in great Towns, from their ordinary labours to Divine service. Which Argument Tilen also beateth upon. Ans. There is huge difference betwixt the rest which is enjoined upon anniversary Festivities, and the rest which is required, during the time of the weekly meetings for Divine Worship. For, 1. Upon Festival days, rest from labour is required all the day over, whereas upon the days of ordinary and weekly meetings, rest is required, only during the time of public Worship. 2. Cessation from labour for Prayers or Preaching on those appointed days of the week, at some occasions may be omitted, but the rest, and commemoration appointed by the Church to be precisely observed upon the anniversary Festival days, must not be omitted, in the Bishop’s judgment. 3. Men are straitly commanded &amp; compelled to rest from labour upon Holy days, but to leave work to come to the ordinary weekly meetings, they are only exhorted. And here I mark how the Bishop contradicteth himself: for in one place where his Antagonist maintaineth truly, that the Craftsman cannot be lawfully commanded nor compelled to leave his work, and to go to public Divine Service, except on the day that the Lord hath sanctified: He replieth, if he may be lawfully commanded to cease from his labour, during the time of divine service, he may be as lawfully compelled to obey the command.

Who can give these words any sense, or see anything in them said against his Antagonist’s position, except he be taken to say, that the Craftsman may be both commanded and compelled to leave his work, &amp; go to Divine Service, on the week days appointed for the same? Nay, he laboureth to prove thus much out of the 9. head of the first book of Discipline, which saith: In great Towns, we think expedient that every day there be either Sermon or common Prayers, &amp;c. Where there is nothing of compulsion, or a forcing command, only there is an exhortation. But ere the Bishop have said much, he forgetteth himself, and tells us, that it were against Equity &amp; Charity, to adstrict the husband-man to leave his plough, so oft as the days of weekly preaching do return, but that on the Festival days, reason would, that if he did not leave his plough willingly, by Authority he should be forced. Which place confirmeth this difference, which we give betwixt rest on the holy days, and rest at the times of weekly meeting.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/george-gillespie.html">George Gillespie</a></span><span class="wk"><span class="lbl">Work:</span> <cite>A dispute against the English-popish ceremonies, obtruded upon the Church of Scotland</cite>, (n.p., 1637), Part I, p. 24.</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/worship/holy-days-and-church-calendar.html">Holy Days and Church Calendar</a></span></div>

Who can give these words any sense, or see anything in them said against his Antagonist’s position, except he be taken to say, that the Craftsman may be both commanded and compelled to leave his work, &amp; go to Divine Service, on the week days appointed for the same? Nay, he laboureth to prove thus much out of the 9. head of the first book of Discipline, which saith: In great Towns, we think expedient that every day there be either Sermon or common Prayers, &amp;c. Where there is nothing of compulsion, or a forcing command, only there is an exhortation. But ere the Bishop have said much, he forgetteth himself, and tells us, that it were against Equity &amp; Charity, to adstrict the husband-man to leave his plough, so oft as the days of weekly preaching do return, but that on the Festival days, reason would, that if he did not leave his plough willingly, by Authority he should be forced. Which place confirmeth this difference, which we give betwixt rest on the holy days, and rest at the times of weekly meeting.”

— George Gillespie, A dispute against the English-popish ceremonies, obtruded upon the Church of Scotland, (n.p., 1637), Part I, p. 24.">Copy</button><a class="share" href="https://x.com/intent/post?text=%E2%80%9CThe+Bishop+presseth+us+with+a+fourth+Argument%2C+taken+from+the+calling+of+people+in+great+Towns%2C+from+their+ordinary+labours+to+Divine+service.+Which+Argument+Tilen+also+beateth+upon.+Ans.+There+is+huge+difference+betwixt+the+rest+which+is+enjoined+upon+anniversary+Festivities%2C+and+the+rest+which+is+required%2C+during+the+time+of+the+weekly+meetings+for+Divine+Worship.+For%2C+1.+Upon+Festival+days%2C+rest+from+labour+is+required+all+the+day+over%2C+whereas+upon+the+days+of+ordinary+and+weekly+meetings%2C+rest+is+required%2C+only+during+the+time+of+public+Worship.+2.+Cessation+from+labour+for+Prayers+or+Preaching+on+those+appointed+days+of+the+week%2C+at+some+occasions+may+be+omitted%2C+but+the+rest%2C+and+commemoration+appointed+by+the+Church+to+be+precisely+observed+upon+the+anniversary+Festival+days%2C+must+not+be+omitted%2C+in+the+Bishop%E2%80%99s+judgment.+3.+Men+are+straitly+commanded+%26+compelled+to+rest+from+labour+upon+Holy+days%2C+but+to+leave+work+to+come+to+the+ordinary+weekly+meetings%2C+they+are+only+exhorted.+And+here+I+mark+how+the+Bishop+contradicteth+himself%3A+for+in+one+place+where+his+Antagonist+maintaineth+truly%2C+that+the+Craftsman+cannot+be+lawfully+commanded+nor+compelled+to+leave+his+work%2C+and+to+go+to+public+Divine+Service%2C+except+on+the+day+that+the+Lord+hath+sanctified%3A+He+replieth%2C+if+he+may+be+lawfully+commanded+to+cease+from+his+labour%2C+during+the+time+of+divine+service%2C+he+may+be+as+lawfully+compelled+to+obey+the+command.%0A%0AWho+can+give+these+words+any+sense%2C+or+see+anything+in+them+said+against+his+Antagonist%E2%80%99s+position%2C+except+he+be+taken+to+say%2C+that+the+Craftsman+may+be+both+commanded+and+compelled+to+leave+his+work%2C+%26+go+to+Divine+Service%2C+on+the+week+days+appointed+for+the+same%3F+Nay%2C+he+laboureth+to+prove+thus+much+out+of+the+9.+head+of+the+first+book+of+Discipline%2C+which+saith%3A+In+great+Towns%2C+we+think+expedient+that+every+day+there+be+either+Sermon+or+common+Prayers%2C+%26c.+Where+there+is+nothing+of+compulsion%2C+or+a+forcing+command%2C+only+there+is+an+exhortation.+But+ere+the+Bishop+have+said+much%2C+he+forgetteth+himself%2C+and+tells+us%2C+that+it+were+against+Equity+%26+Charity%2C+to+adstrict+the+husband-man+to+leave+his+plough%2C+so+oft+as+the+days+of+weekly+preaching+do+return%2C+but+that+on+the+Festival+days%2C+reason+would%2C+that+if+he+did+not+leave+his+plough+willingly%2C+by+Authority+he+should+be+forced.+Which+place+confirmeth+this+difference%2C+which+we+give+betwixt+rest+on+the+holy+days%2C+and+rest+at+the+times+of+weekly+meeting.%E2%80%9D%0A%0A%E2%80%94+George+Gillespie%2C+A+dispute+against+the+English-popish+ceremonies%2C+obtruded+upon+the+Church+of+Scotland%2C+%28n.p.%2C+1637%29%2C+Part+I%2C+p.+24.&amp;url=https%3A%2F%2F5solasquotes.github.io%2Fquote%2F682b6ca324.html&amp;via=5Solas" target="_blank" rel="noopener">Share on X</a><a class="perma" href="../quote/682b6ca324.html">Permalink</a><a class="src" href="https://reformedcovenanter.wordpress.com/2023/05/20/george-gillespie-on-the-difference-between-mandatory-holy-days-and-voluntary-mid-week-gatherings/" rel="noopener" target="_blank">Read it online · Reformed Covenanter</a></div>

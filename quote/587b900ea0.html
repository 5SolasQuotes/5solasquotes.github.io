<blockquote><p>For profession brings a Church into outward fellowship with Christ’s body (as bad servants with a good master) and so into the way of being savingly of the body of Christ if they resist not, grieve not, quench not, or despise not the Spirit of grace. Secondly, for the form of a true Church, that is Christ united unto the persons professing his saving truth. For as the form of a man is his soul united to his body, so the form of a Church, which is the body of Christ, is Christ united unto it. Now, that Christ is united unto our Church is proved thus: because He gives the law of union to us as to the body, and makes it effectuall for conviction, or conversion, to serve the living and true God. As a king is united to his subjects by his laws, and executions of them for rewards and punishments: so is Jesus Christ to our Church. As the head united gives laws to the body for safety: so does Christ give laws to us for our salvation in his Word.</p></blockquote>

<blockquote><p>4. The fourth sort of erroneous persons which I judge holy Churches and saints ought to separate from, are such as err in fundamentals or foundation points of religion, holding opinions that lay the ax to the root of the Tree of Life. Now as these sorts of errors are most dangerous to be permitted, so they are most difficult to single out; for though it be a thing out of doubt that there are foundation doctrines which the Church of God ought to prefer in order to its being before its peace and unity, yet it remains very doubtful whether several of those precious and substantial truths that are highly to be prized and much contended for, and are by several godly and sound Christians esteemed foundation points, be so or no: that is, so to be esteemed foundations as the persons not believing them or holding error contrary to them (and are otherwise in the main gracious), be thereby made incommunicable: But as in the former cases, so in this, I shall decline coming to particulars as a work above my capacity and shall only tender my thoughts in some few general rules; and so leave it to them who are more able to add. 1. First, I judge that errors against the foundation points of religion must be of such a nature and tendency as do strike at the very root of saving-grace and tend to unstate the the person holding them from a possibility of salvation, he living and dying therein; for so Paul argues, 1 Cor. 15:14, concerning the resurrection of the dead: ‘If Christ be not risen then is our preaching vain, and our faith is also vain.’ And also verses 17-18, ‘And if Christ be not raised, your Faith is vain, ye are yet in your sins. Then they also that are fallen asleep in Christ, are perished.’ 2. I judge they must be errors contrary to the general tendency and scope of Scripture and to the doctrines of salvation plainly and evidently therein expressed which all true believers concur and agree in: And therefore says the apostle: ‘If our Gospel be hid, it is hid to them that are lost,’ 2 Cor. 3:3; and so chapter 11:3, ‘But I fear lest by any means, as the serpent beguiled Eve through his subtilty, so your minds should be corrupted from the simplicity that is in Christ. For if he that comes preaches another Jesus, whom we have not preached, or if ye receive another spirit which ye have not received, or another Gospel which ye have not excepted, etc. ye might well bear with him.’ And so Gal. 1:6-8, ‘I marvel that ye are so soon removed from him that has called you into the grace of Christ, unto another Gospel: Which is not another; but there be some which trouble you, and would pervert the Gospel of Christ. But though we, or an angel from Heaven preach another Gospel unto you, then that which we have preached, let him be accursed.’ Now it is evident that that bringing in another Gospel was a joining circumcision and the works of the Law with faith in Christ in justification, contrary to the very essence of Gospel faith, as they held it. Objection: Why, how did they hold it? Did not you before number this among one of the errors Paul permitted in the Church of Rome, etc. and pressed the Church to union, without separating from it? Answer: They held it rigidly, imposing it upon others as of necessity to salvation, ch. 2:14 and 6:12. For where the same error was held more moderately, as we observe before in the Church of Rome and Corinth, etc. the apostle deals milder with it; there he says, ‘Circumcision is nothing, nor uncircumcision is nothing,’ 1 Cor. 7:19. ‘Is any man called being circumcised; let him not be uncircumcised,’ verse 8. But when they come to hold it imposingly and positively, as in this verse, he then changes his voice: then ‘O foolish Galatians, who has bewitched you, that ye should not obey the truth?’ etc. ch. 3:1-4, then, ‘Behold, I Paul say unto you, that if ye be circumcised, Christ shall profit you nothing; For I testify again to every man that is circumcised, Christ is become of none effect unto you,’ ch. 5:2-4. So that the manner of holding an error alters the case of its fundamentalness much: It was Peter’s separating from the saints differing minded, and dissimulation, rather than his error, ch. 2:11-14, that made Paul withstand him to the face, verse 11… That if those errors and heresies the Scripture mentions as dangerous and unsufferable in the Church of God, which the Churches and saints of God are onely exhorted to reject and withdraw from, was all either of a scandalous profane nature, denying the power of godliness, on the one hand, or contrary to a godly life, inconsistent with true grace, or striking at the foundation of saving faith on the other hand: Then the Churches and saints of God, who desire not to be wise above what is written at this day, ought only to reject and withdraw from such…</p></blockquote>

th%2C+etc.+the+apostle+deals+milder+with+it%3B+there+he+says%2C+%E2%80%98Circumcision+is+nothing%2C+nor+uncircumcision+is+nothing%2C%E2%80%99+1+Cor.+7%3A19.+%E2%80%98Is+any+man+called+being+circumcised%3B+let+him+not+be+uncircumcised%2C%E2%80%99+verse+8.+But+when+they+come+to+hold+it+imposingly+and+positively%2C+as+in+this+verse%2C+he+then+changes+his+voice%3A+then+%E2%80%98O+foolish+Galatians%2C+who+has+bewitched+you%2C+that+ye+should+not+obey+the+truth%3F%E2%80%99+etc.+ch.+3%3A1-4%2C+then%2C+%E2%80%98Behold%2C+I+Paul+say+unto+you%2C+that+if+ye+be+circumcised%2C+Christ+shall+profit+you+nothing%3B+For+I+testify+again+to+every+man+that+is+circumcised%2C+Christ+is+become+of+none+effect+unto+you%2C%E2%80%99+ch.+5%3A2-4.+So+that+the+manner+of+holding+an+error+alters+the+case+of+its+fundamentalness+much%3A+It+was+Peter%E2%80%99s+separating+from+the+saints+differing+minded%2C+and+dissimulation%2C+rather+than+his+error%2C+ch.+2%3A11-14%2C+that+made+Paul+withstand+him+to+the+face%2C+verse+11%E2%80%A6+That+if+those+errors+and+heresies+the+Scripture+mentions+as+dangerous+and+unsufferable+in+the+Church+of+God%2C+which+the+Churches+and+saints+of+God+are+onely+exhorted+to+reject+and+withdraw+from%2C+was+all+either+of+a+scandalous+profane+nature%2C+denying+the+power+of+godliness%2C+on+the+one+hand%2C+or+contrary+to+a+godly+life%2C+inconsistent+with+true+grace%2C+or+striking+at+the+foundation+of+saving+faith+on+the+other+hand%3A+Then+the+Churches+and+saints+of+God%2C+who+desire+not+to+be+wise+above+what+is+written+at+this+day%2C+ought+only+to+reject+and+withdraw+from+such%E2%80%A6%E2%80%9D%0A%0A%E2%80%94+Richad+Lawrence%2C+Gospel-Separation+Separated+from+its+Abuses%3B+or+the+Saints%E2%80%99+Guide+in+Gospel-Fellowship%3A+whereby+they+may+be+Directed+not+only+to+Preserve+the+Purity%2C+but+withal+the+Unity+of+Gospel-Worship%3A+by+a+well-wisher+to+Sion%E2%80%99s+Purity+and+Unity+%28London%3A+Calvert%2C+1657%29%2C+p.+73-79+This+work+has+an+imprimatur+by+Joseph+Caryl.&amp;url=https%3A% <blockquote><p>XXVII. We hold it unlawful to reproach all Churches that we see to be faulty, but it is our duty to keep peace with all. [Rom. 12:18; Heb. 12:14]</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/richard-baxter.html">Richard Baxter</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The English Nonconformity as under King Charles II &amp; King James II Truly Stated &amp; Argued (London, 1689), ch. 2</cite>, p. 14</span></figcaption>

<blockquote><p>12. When we say that the pure ministry of the Word and pure celebration of the sacraments is a fit pledge and earnest, so that we may safely recognise a church in every society in which both exist, our meaning is that we are never to discard it so long as these remain, though it may otherwise teem with numerous faults. Nay, even in the administration of Word and sacraments defects may creep in which ought not to alienate us from Its communion. For all the heads of true doctrine are not in the same position. Some are so necessary to be known, that all must hold them to be fixed and undoubted as the proper essentials of religion: for instance, that God is one, that Christ is God, and the Son of God, that our salvation depends on the mercy of God, and the like. Others, again, which are the subject of controversy among the churches, do not destroy the unity of the faith; for why should it be regarded as a ground of dissension between churches, if one, without any spirit of contention or perverseness in dogmatising, hold that the soul on quitting the body flies to heaven, and another, without venturing to speak positively as to the abode, holds it for certain that it lives with the Lord? The words of the apostle are, “Let us therefore, as many as be perfect, be thus minded: and if in anything ye be otherwise minded, God shall reveal even this unto you,” (Phil. 3:15) Does he not sufficiently intimate that a difference of opinion as to these matters which are not absolutely necessary, ought not to be a ground of dissension among Christians? The best thing, indeed, is to be perfectly agreed, but seeing there is no man who is not involved in some mist of ignorance, we must either have no church at all, or pardon delusion in those things of which one may be ignorant, without violating the substance of religion and forfeiting salvation. Here, however, I have no wish to patronise even the minutest errors, as if I thought it right to foster them by flattery or connivance; what I say is, that we are not on account of every minute difference to abandon a church, provided it retain sound and unimpaired that doctrine in which the safety of piety consists, and keep the use of the sacraments instituted by the Lord. Meanwhile, if we strive to reform what is offensive, we act in the discharge of duty. To this effect are the words of Paul, “If anything be revealed to another that sits by, let the first hold his peace.” (1 Cor. 14:30) From this it is evident that to each member of the Church, according to his measure of grace, the study of public edification has been assigned, provided it be done decently and in order. In other words, we must neither renounce the communion of the Church, nor, continuing in it, disturb peace and discipline when duly arranged.</p></blockquote>

<blockquote><p>Then there may and ought to be uniting [in church union] when the evils that follow division or schism, are greater and more hurtful to the Church, than the evils that may be supposed to follow on union. I speak not of ills of sin (for the least of these are never to be chosen), but of evils and inconveniences that may indeed be hurtful to the Church in themselves, and sinful in respect of some persons, yet are not so to all: Now, in such evils the lesser is to be chosen.</p></blockquote>

<main class="wrap"><figure class="quote" id="q-c9b63a1088" data-kw="">
<blockquote><p>…Though the general time which they fulfil may be known, or is known and set down by writers, yet the precise particular time, the day of the month, or hour of the day, or (which is the thing inquired) when their months come out and are fulfilled, that’s a secret. Though it be commonly known that a woman goes nine months with child… I may say in this case, as our Lord Jesus Christ said about the end of the world, ‘Of that day and hour knows no man,’ we may know the general time, we may know it will not be long before the world shall end. The time which the world shall go with its great birth is commonly said to be six thousand years; but the day and hour of its travel, and of the consummation of all things according to the decree of God, no man, no nor angel, knows.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/joseph-caryl.html">Joseph Caryl</a></span><span class="wk"><span class="lbl">Work:</span> <cite>An Exposition with Practical Observations continued upon the Fifteenth, Sixteenth &amp; Seventeenth Chapters of the Book of Job</cite>, (London, 1666), on ch. 39, vv. 1-4, p. 217</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/creation/the-six-days.html">The Six Days</a></span></div>

 rel="noopener" target="_blank">Read it online · Reformed Books Online</a></div>

<blockquote><p>VIII. Nor is God the univocal cause of the world, but the equivocal; nor necessary and immanent, as Spinoza wishes, Ethics, pt. 1, On God, Proposition 18, p. 19, but free and transient, or better: Creation, taken actively, is not an immanent, but a transient action, by which God produces things diverse from Himself and confers being upon them, the immediate principle of which action is the practical volition of God, his command and mandate. For an agent is then said to act transiently when it actually flows into an external effect diverse from the agent, which has its place in Creation, where a true and real influx of God into the creature is given, signified by the command of God in:Gen. 1:3, “Let there be light: and there was light.”… From this it appears clearer than daylight that here is given a true and real influx of an efficient cause into the effect, and therefore a true and real transient action. These things being diligently observed, the whole of Spinozism collapses. … XI. The preceding, i.e., intrinsically moving, cause is the divine goodness, communicative and diffusive of itself, by which it came to pass that God, blessed in Himself, went forth outside Himself and communicated his goodness with creatures. Ps. 127:5-8; 145:9. He produced all things from nothing, and declared His immense goodness, wisdom, and power to the creature, especially the rational one, by which in turn He would be acknowledged and worshipped. The directing and ordering cause is knowledge, wisdom, and, based on these as a directive principle, the decree of God, as an imperious principle, which is accompanied by the power of God as an executive principle, which things were decreed from knowledge and most wisely. Whence in Eph. 1:11, God is said to do all things ‘according to the counsel of His own will.&#x27;</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/barthold-holtzfus.html">Barthold Holtzfus</a></span><span class="wk"><span class="lbl">Work:</span> <cite>‘Theological Dissertation on Creation’</cite>, (Frankfurt: Steppinus, 1706), trans. AI Latin</span></figcaption>

<blockquote><p>33. The divine ideas, therefore, are not the creatures themselves known by God, but are objective reasons, that is, the divine essence itself, conceived by God, insofar as it is imitable by created things: so that the divine exemplar is infinitely more perfect than created things, since it is the divine essence itself known as imitable. 34. But they express the things themselves, because the divine essence, which holds the nature of an idea, insofar as it is known by God, as in tablets by creatures, eminently contains man, for example, of whom it is the idea, as it is imitable by him, and similarly the other things, and represents them most perfectly. 35. The ideas are removed and separated from the commerce of matter and the concretion of singulars. 36. They are eternal, stable, unchangeable, and incorruptible. And they themselves are not formed: just as neither are created ideas made by an artificer, as Plato rightly teaches in the tenth book of the Republic, not far from the beginning. 37. They agree in part with created ideas and in part differ from them. They agree in that both are objective reasons: they differ in that the ideas of the supreme Architect are not things which he intends to produce, as the created ideas of a created artisan. The reason for this distinction is that in the divine essence, which is the primary object of divine understanding, all things that can be made are contained and reflected; therefore, it is necessary that God, in making any work, principally regards the idea of it in his mind and primarily imitates it. In the created artisan, however, the matter is not so, who sometimes changes something as the situation arises and does not always imitate the idea first conceived. They also differ from the conjoined forms of things. For ideas are objective forms, from which imitation is taken, and they always remain outside the essences of made things, not becoming part of them: but the conjoined forms of things are [Hebrew or Greek] forms, constitutive, and part of composite things. Furthermore, ideas are the prototypical reasons of things, of which they are the exemplars: but the conjoined forms, induced into things by God the Creator, are certain principled likenesses of them, which by informing matter comprehend essence.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/amandus-polanus.html">Amandus Polanus</a></span><span class="wk"><span class="lbl">Work:</span> <cite>A System of Christian Theology</cite>, (Hanau, 1609-1610) tr. ChatGPT-4 by Monergism | bk. 5, Creation &amp; Man, ch. 6, ‘On the Definition of the Creature’, pp. 126-28</span></figcaption>

<blockquote><p>‘And the evening’ That is, thus the first day ended with creating the light, and God forbare to create any more, until that evening was past, and the next morning came. By the ‘evening’, we must here understand the whole night, or space between the shutting in of the light and the dawning of the next day. Now Moses names the evening first, because the darkness was before the light. In the same manner runs the computation of times among the Hebrews to this day… God is here represented to us in the creation of the world proceeding by leisure, and taking the time of six days to perform that which He might have as easily dispatched in a moment of time, if He had so been pleased.</p></blockquote>

<main class="wrap"><figure class="quote" id="q-7d5bc10676" data-kw="">
<blockquote><p>…the Reformed customarily distinguish on the one side a fourfold good with which a person can be occupied in his choice, namely: (1) natural good, walking, reasoning; (2) moral good, the exercise of some sort of civil virtue; (3) ecclesiastical good, to which sort belong the duties of external divine worship; and (4) a spiritual and saving good, which accompanies salvation (Heb. 6:9)… With these things posited, they determine that… In the state of grace, through regeneration he recovers the strength lost by sin for doing spiritual and saving good, yet with some sort of a surviving inclination to evil… in the state of sin [being unconverted], to him is present some sort of strength toward natural, moral, and ecclesiastical good, but absolutely none for spiritual and saving good.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/petrus-van-mastricht.html">Petrus van Mastricht</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Theoretical Practical Theology</cite>, (RHB), vol. 3, bk. 4, ch. 2 | section 25, pp. 462-63</span></figcaption>

</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-91d458e168" data-kw="">
<blockquote><p>Be it so that God rewards the right use of natural things with an increase of natural goods, but not with the collation of supernatural ones. For this would be “to cross over into another kind” (metabainein eis to allo genos). For it is as if someone said that God promised good health to one who makes good use of honors. It is certain that the natural does not have an order of causality to the supernatural, because they are distant by a whole kind; nor can the seed of nature ever rise into the fruit of grace.</p></blockquote>

— John Duns Scotus, ‘The Nature &amp; Cause of Contingency’ in John Duns Scotus: Selected Writings on Ethics ed. &amp; trans. Thomas Williams (Oxford, 2017), pp. 86-95 from Reportatio IA, dd. 39-40, qq. 1-3, nn. 24-59, p. 86">Copy</button><a class="share" href="https://x.com/intent/post?text=%E2%80%9C%E2%80%A6we+must+deal+with+four+preliminary+issues%3A+first%2C+whether+there+is+contingency+in+things%3B+second%2C+given+that+there+is%2C+we+need+to+determine+the+first+cause+of+contingency%3B+third%2C+we+must+show+how+the+primary+basis+of+contingency+can+be+found+in+God%3B+and+fourth%2C+we+need+to+clarify+certain+propositions+that+arise+in+this+discussion.%E2%80%9D%0A%0A%E2%80%94+John+Duns+Scotus%2C+%E2%80%98The+Nature+%26+Cause+of+Contingency%E2%80%99+in+John+Duns+Scotus%3A+Selected+Writings+on+Ethics+ed.+%26+trans.+Thomas+Williams+%28Oxford%2C+2017%29%2C+pp.+86-95+from+Reportatio+IA%2C+dd.+39-40%2C+qq.+1-3%2C+nn.+24-59%2C+p.+86&amp;url=https%3A%2F%2F5solasquotes.github.io%2Fquote%2F92ef00dce0.html&amp;via=5Solas" target="_blank" rel="noopener">Share on X</a><a class="perma" href="../quote/92ef00dce0.html">Permalink</a><a class="src" href="https://reformedbooksonline.com/the-reformed-freedom-of-the-will-vs-philosophical-necessity/#:~:text=we%20must%20deal%20with%20four%20preliminary,propositions%20that%20arise%20in%20this%20discussion&amp;text=we%20must%20deal%20with%20four%20preliminary%20issues%3A%20first&amp;text=clarify%20certain%20propositions%20that%20arise%20in%20this%20discussion" rel="noopener" target="_blank">Read it online · Reformed Books Online</a></div>
</figure><figure class="quote" id="q-a7f8ab653f" data-kw="">
<blockquote><p>Hart’s second main objection is that any rational creature would, just by virtue of being rational, desire to know the very essence of the first cause of all things, so that such knowledge would be its natural end. There is a sense in which the premise is true, but the conclusion does not follow. To borrow an example from the philosopher Thomas Nagel, consider that there is an obvious sense in which a human being might desire to know what it is like to be a bat—to fly through the air the way a bat does, to get around via echolocation, and so on. Yet there is also an obvious sense in which it is simply not part of our nature to do these things, so that human beings can live complete lives as the kind of creatures we are without doing them. For that reason, our curiosity about what it is like to be a bat does not entail a sense of deprivation or loss in the way that, say, a missing limb would. In an analogous way, had human beings been created in a state of “pure nature,” without a divinely imparted orientation toward the supernatural end of the beatific vision, they might in a sense nevertheless wish that they could have a direct knowledge of God’s very essence. But they would also judge that this is simply no more possible for them than it is possible for them to know what it is like to be a bat, and thus they would not feel this impossibility as a deprivation of something they were by nature made for. The indirect knowledge of God that they are capable of would suffice.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/edward-feser.html">Edward Feser</a></span><span class="wk"><span class="lbl">Work:</span> <cite>‘David Bentley Hart’s Post-Christian Pantheism’</cite>, (2022) at Public Discourse</span></figcaption>

</figure><figure class="quote" id="q-40d2bfc068" data-kw="">
<blockquote><p>Man, by making bad use of free will, destroyed both himself and it. For just as he who kills himself, does not live by killing himself, nor can he resuscitate himself when he has killed himself: so, when sin was committed by a free will, with sin being the victor, free will also was lost. For by whom a man is overcome, to this one also is he addicted as a servant: whence he will not be free for doing justly, unless, being freed from sin, he has begun to be a servant of justice. But from where will this liberty be for a man who is addicted and sold, unless He redeem him, whose is that voice: ‘If the Son shall make you free, you shall be free indeed.&#x27;</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/augustine-of-hippo.html">Augustine of Hippo</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Other citations (work not named)</cite>, in Barthold Holtzfus, ‘Theological Dissertation on the Free Will of Man’ trans. AI by Nosferatu (Frankfurt: Zeitler, 1707), ch. 2, sect. 9, pp. 23-24 Latin | Enchiridion to Laurentius, ch. 30</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/free-will-and-inability/liberty-and-necessity.html">Liberty and Necessity</a></span></div>

<main class="wrap"><figure class="quote" id="q-b7b47d7be1" data-kw="">
<blockquote><p>John Calvin structured his soteriology and doctrine of atonement around the patristic principle of graced exchange, the idea that Christ became what we are in order to make us what He is. In them, Christ’s descent to hell and the believer’s ascent to God represent the two furthest poles of the exchange. Descent to hell and ascent to God both involve vision of God. Calvin explains descent to hell as the terror sinners experience in their souls when they sense God’s wrath and judgment. In the passion and crucifixion, Christ arraigned Himself before God’s tribunal as our surety to make satisfaction. Standing in the place of the accused, He saw God as an angry judge prepared to punish sin. As a real human being with the affections and infirmities common to human nature, Christ could not help but experience terror in his soul and even fear for his own salvation. Christ willingly underwent this ordeal to prove his obedience, demonstrate his love for humanity, and secure a more lavish redemption than otherwise possible. Christ emerged from the ordeal victorious, and the Father accepted his obedience as satisfaction for our sin. As a result, the redeemed are adopted as sons who will ascend to God and see Him face-to-face as a propitious Father.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/carl-mosser.html">Carl Mosser</a></span><span class="wk"><span class="lbl">Work:</span> <cite>‘Graced Exchange &amp; Vision of God in Calvin’s Atonement Theology’ in Reformed Theological Review</cite>, vol. 82, no. 1 (April 2023), pp. 48-74</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/judgment-and-the-final-state/heaven-and-eternal-glory.html">Heaven and Eternal Glory</a></span></div>

</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-80e7476069" data-kw="">
<blockquote><p>The Reformed acknowledge that Christ truly died, and therefore the natural union of the body and soul was taken away for those three days, and hence he was also certainly a dead man, but yet he was also a man in the true and proper sense, because otherwise: [Mastricht gives eight Scriptural and theological reasons]… If they should allege to the contrary that with the union of the essential parts of the body and soul taken away, a man in the true and proper sense would not survive, then I would grant that, with all union of those parts taken away, a man in the true and proper sense would not survive, but since, in agreement with all Christians, in the incarnation a twofold union was procured by the Holy Spirit—one natural, through which he was a living man, and the other personal, through which the same person was not only God but also man—when the former ceases, nevertheless the latter remains. So then, because the essential parts of man in death were not deprived of all union (as ordinarily occurs in the dead, who for this reason are also not men, except equivocally), but only the union that makes a living man, we conclude that he nevertheless throughout the three days of his death and burial remained a man in the true and proper sense.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/petrus-van-mastricht.html">Petrus van Mastricht</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Theoretical Practical Theology</cite>, 3. ‘Was Christ during the three days of his death and burial a true man?’ in Theoretical Practical Theology (RHB), vol. 4, bk. 5, ch. 13, Polemical Part, §XIII, pp. 466-68</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/judgment-and-the-final-state/heaven-and-eternal-glory.html">Heaven and Eternal Glory</a></span></div>

</figure><figure class="quote" id="q-ba6637706b" data-kw="">
<blockquote><p>What is ‘happiness’ after all? Is it a matter of ‘getting what you want’? Is it a matter of maximizing pleasure and minimizing pain, as Bentham and Mill held (albeit in different ways)? On these conceptions, happiness seems to be definable in terms of the subjective states of the agent. On an Aristotelian or classical natural law conception, though, it is something objective, a matter of living in accordance with one’s nature, understood as a fixed essence entailing a natural end or purpose.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/edward-feser.html">Edward Feser</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Neo-Scholastic Essays</cite>, (South Bend, IN: St. Augustine’s Press, 2015), ch. 15, ‘Self-ownership, Libertarianism, and Impartiality’, p. 368</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/judgment-and-the-final-state/heaven-and-eternal-glory.html">Heaven and Eternal Glory</a></span></div>

</figure><figure class="quote" id="q-40785982bc" data-kw="">
<blockquote><p>Out of this translation of Enoch we may learn: … Thirdly, whereas the papists hold that all the fathers who died before Christ were in limbus and came not in heaven till Christ fetched them thence and carried them with Him at His ascension, here we learn it is most false and forged. For here we see Enoch and afterward Elijah were in heaven both in body and soul many hundred years before Christ’s incarnation, whereby (as also by many other evidences that might be brought) it is apparent that limbus patrum [‘the limbo of the Fathers’] is nothing but a device of that heretical Church of Rome. Against this ground, being the very words of the Old Testament, no man can take exception. And here in a word, let us all mark the high and sovereign authority of God’s Word, which even the Holy Ghost Himself vouchsafes to allege for the confirmation of His own words.</p></blockquote>

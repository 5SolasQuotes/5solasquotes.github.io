<main class="wrap"><figure class="quote" id="q-86d4a47e9f" data-kw="">
<blockquote><p>By Scripture also, because Acts 8:1, we read of the ‘Church’ at Jerusalem, not the ‘churches’: Howbeit there were at that instant above eight thousand Christians at Jerusalem, and all these still in the city… This great number, neither did, nor could usually assemble into one place for the worship of God, but they met [in Greek] ‘house by house’, Acts 2:46. And whereas objection is made to the contrary from Acts 2:44 and 5:12 and 6:2. We have before answered [in pt. 2, ch. 3, p. 141-42] to the first of these places, for it is to be expounded by Acts 4:32, they were in one, that is, they were of one heart and of one soul… The last place proves no more but an extraordinary and occasional meeting, and it is also to be understood that they met turmatim [in squadrons] as four hundred thousand men did assemble together, Jud. 20:1…</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/george-gillespie.html">George Gillespie</a></span><span class="wk"><span class="lbl">Work:</span> <cite>An Assertion of the Government of the Church of Scotland in the points of Ruling-Elders and of the Authority of Presbyteries and Synods</cite>, … (1641), p. 192-94</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/worship/public-worship.html">Public Worship</a></span></div>

</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-fed762504d" data-kw="">
<blockquote><p>Let us then here call to mind the distinction which has been showed betwixt religious ceremonies and moral circumstances: for as touching moral circumstances which serve for common order and decency in the worship of God, they being so many and so alterable that they could not be particularly determined in Scripture, for all the different and almost infinite cases which might occur, the Jewish Synagogue had the same power for determining things of this nature which the church of Christ now has. For the law did not define but left the[m to] be defined by the Synagogue, the set hours for all public divine service, when it should begin, how long it should last, the order [that] should be kept in the reading and expounding of the law, praying, singing, catechizing, excommunicating, censuring and absolving of delinquents, etc., the circumstances of the celebration of mariage, of the education of youth in schools and colleges, etc.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/george-gillespie.html">George Gillespie</a></span><span class="wk"><span class="lbl">Work:</span> <cite>A Dispute Against the English-Popish Ceremonies</cite>, (1637), pt. 3, ch. 7, p. 119</span></figcaption>

<blockquote><p>…for if we speak of a constant rule, as now we must do, when apostles are removed, if the Church of believers be a visible Church, having the Keys and using them, even to admit officers [as in Congregationalism], and to excommunicate them, they: 1. Dispense censures and govern, who have no call to carry on censures and government, by preaching the Word, or exhorting and praying, for there are no officers as yet, etc.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/rutherford.html">Rutherford</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Survey of the Survey of that Sum of Church Discipline</cite>, p. 179</span></figcaption>

</figure><figure class="quote" id="q-257a0d3a59" data-kw="">
<blockquote><p>Answer: This [argument of Rutherford’s Independent opponent] speaks against glebes [contracted lands] of ministers, but the New Testament speaks not of manses or houses, or of moneys for ministers; yet a wage we know is due, Matt 10:10; 1 Cor. 9:8-10; Gal. 6:6, and the Levites were not to be distracted from the most necessary work of the Tabernacle and service of God more than ministers, yet they had lands and towns assigned of God to them; though the less distractous the wages be, the better and the more convenient they are, 2 Tim. 2:3-5. As for the tithes, we think quotta decimarum, or a sufficient maintenance of tithes or what else may conduce for food and raiment, of divine right, Matt 10:16; 1 Cor. 9:8-9, tithes formally as tithes are not necessary, so [as long as] the ministers be provided and a stipend be allowed to them, not as an alms but as a debt, Luke 10:7. But the stinting [frugal restricting] of maintenance for ministers the author [Rutherford’s opponent] condemns, because when Constantine gave large rents to the Church, it proved the bane of the Church. But I answer, stinting makes not this, but excess, for mountains of rents may be stinted no less than mole-hills.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/samuel-rutherford.html">Samuel Rutherford</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Due Right of Presbyteries, ‘Acts 15, A Pattern of a Juridicial Synod’</cite>, (1644), 2nd Part, pp. 465-66 Scottish commissioner to the Westminster Assembly</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/worship/public-worship.html">Public Worship</a></span></div>

t%20of%20Rutherford%E2%80%99s%20Independent,be%20stinted%20no%20less%20than%20mole%2Dhills&amp;text=Answer%3A%20This%20%5Bargument%20of%20Rutherford%E2%80%99s%20Independent%20opponent%5D%20speaks&amp;text=rents%20may%20be%20stinted%20no%20less%20than%20mole%2Dhills" rel="noopener" target="_blank">Read it online · Reformed Books Online</a></div>
</figure><figure class="quote" id="q-c72dbed8e3" data-kw="">
<blockquote><p>The learned [John] Selden [an Erastian] in his discourse of the Civil Right of Tithes, has endeavoured to prove this [that tithes are not by any Divine Law due to the ministers of the Gospel]. There has been a war in the Romish Church about this question, between the canonists and the scholastics; the former hotly maintaining that tithes are due to the Church jure divino [by divine right]; the latter, that they are due only by ecclesiastical constitution: so says [Robert] Bellarmine, and other of their learned men. Yet some of their theologues, agree with the canonists: So does Baronius (Annals, tome 1, anno. 57, s. 74)… Among Protestant writers, prelates, and prelatical men plead hard for the divine right of tithes as the ministers’ due. Bishop [Lancelot] Andrews and Bishop [George] Carleton have said as much for it as any that I have seen. But most of our reformed divines maintain the negative. So Peter Martyr (Common Places, pt. 4, ch. 13), Zanchy (Of Redemption, book 1, ch. 16), Daneus (Ethic., book 2, ch. 10 [also in 4th Precept, p. 810]), Rivet (in Genesis, exercitation 80), Voetius (Eccle. 1, book 4, p. 824): And to this we adhere.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/increase-mather.html">Increase Mather</a></span><span class="wk"><span class="lbl">Work:</span> <cite>A Discourse Concerning the Maintenance due to those that Preach the Gospel</cite>, (1706) Mather was a New England, congregationalist puritan minister., pp. 48-50</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/worship/public-worship.html">Public Worship</a></span></div>

<blockquote><p>I answer that, Everything is said to be good so far as it is perfect; for in that way only is it desirable (as shown above, AA. 1, 3). Now a thing is said to be perfect if it lacks nothing according to the mode of its perfection. But since everything is what it is by its form (and since the form presupposes certain things, and from the form certain things necessarily follow), in order for a thing to be perfect and good it must have a form, together with all that precedes and follows upon that form. … Further, upon the form follows an inclination to the end, or to an action, or something of the sort; for everything, in so far as it is in act, acts and tends towards that which is in accordance with its form;</p></blockquote>

<blockquote><p>8. He invites, Isa. 55:1-3, ‘Ho, every one that thirsteth come ye to the waters, and he that hath no money come, yea buy and eat without money, and without price;’ and again, verse 3, ‘Incline your ear and come unto Me, and your soul shall live;’ Hark how He calls, Mt. 11:29, ‘Come unto Me all ye that are weary, and heavy laden, and I will ease you.’ The Father says come, the Son says come, the Spirit says come; you that are in the hedges come; He sends out his servants to highway-people, Mt. 22:9. To as many as are found there: Why stay you disputing his will when He so often says ‘Come, come‘? Rev. 22:17, ‘The Spirit and the Bride say ‘Come,’ and let him that heareth say ‘Come,’ and let him that is athirst come, and whosoever will let him drink of the water of life freely.’ Is not all this enough to let thee know God is willing, and Christ is willing to receive thee? Lo, Christ will come to thee. 9. See that essence of glory bowing the heavens and coming down, laying aside his robes of majesty, and putting on thy filthy garments; see Him tiring Himself in going about from place to place upon no other errand than this, to cry at the markets, ‘Oh, if any sinners love life, happiness; if any will go to heaven: let them come to Me; I will show them the way to my father’s bosom and endear them to my fathers heart.’ Read his sermons, observe his pains; thou wilt find a willing Savior, not excepting publicans and harlots from the kingdom of God. 10. Wouldst thou have more tokens of his will yet? See Him dying, hanging upon the cross, dropping out his last blood, breathing out his last breath, stretching out his dying arms to encircle sinners should run in to Him, breathing out the breath of free grace in his very last act upon a thief that had not an hour to live; Who shall despair? who shall say Christ is not willing to save him, and not blaspheme eternal love? Speak truth! corrupt heart say thou art not willing to be saved. 11. Is not this yet enough? Observe Him setting ministers in his Church, lest thou shouldst not read, and none should tell thee the truth of his eternal love, to speak out his good will in thine ears: All our errand is nothing but this: Sinners, Christ is willing to save you; And as ambassadors for Christ, as though God did beseech you by us, we pray you in Christ’s stead to be ye reconciled to God, 2 Cor. 5:20. Why canst thou not believe his will? Consider in thy Savior’s will there is not only a latitude for, but an eagerness of thy eternal salvation: Why therefore dost thou say, ‘My sins are so great that God will not pardon me?’ Believe; O blaspheme not the God of infinite good-will.</p></blockquote>

<blockquote><p>Chapter 11 – Seeing it is not possible that the reprobate should receive this grace and live, and also seeing this is infallibly foreseen of God; and again, seeing God has fore-determined to suffer it so to be: Why does He yet will and command that the Gospel, and so grace in the general tenders [offers] thereof, should be proffered unto them? That God is willing to save even those that perish forever, is apparent, both from the consideration of the goodness of his nature, of man’s being his creature, and indeed in a miserable state. But I say, as I have also said already, there is a great difference between his being willing to save them, through their complying with these his reasonable terms, and his being resolved to save them, whether they, as men, will close therewith, or no: So only He saves the elect themselves, even according to the riches of his Grace, even according to his riches in glory, by Christ Jesus working effectually in them what the Gospel, as a condition, calls for from them.</p></blockquote>

<blockquote><p>Now although the nature of God be marvellously one and simple, so it is that according to our manner of conception, we distinguish his virtues and properties from his essence. Concerning his properties, we conceive them under very different respects, and pretend not when we say that he is merciful, to beget an apprehension in the minds of those that hear us, that He is just, or when we say that He is wise, to give occasion to think of his power and might, as his attributes have very different objects, so we comprehend them in our understandings under very different ideas: But then when we speak of his essence, we make a kind of abstraction of it from his properties, and represent it as a single and simple thing, in which all his attributes exist as in a common subject. As to what concerns his attributes, we see them in some sort in this life, in that we understand at least in some degree what is the nature of those operations by which they display themselves upon their objects. For we are not perfectly ignorant what may be that inclination in God of pardoning sins to the penitent, and punishing the obstinate and impenitent and things of like nature. But as to his essence, there is no man that does not acknowledge that we understand it not at all in this life; that is to say, we are not able to form any conception in our minds which has any respect to the nature of his essence, only some think that when we shall be received into the heavens, our supreme happiness will consist in the vision of this essence, which certainly seems extremely difficult to be imagined…</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/moses-amyraut.html">Moses Amyraut</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Evidence of Things Not Seen, or Diverse Scriptural &amp; Philosophical Discourses concerning the State of Good &amp; Holy Men after Death</cite>, ... (d. 1664; London: Cockerill, 1700), 4th Discourse, Concerning the Happiness of Believers after the Resurrection, pp. 172-74</span></figcaption>

<div class="actions"><button class="copy" data-copy="“Now although the nature of God be marvellously one and simple, so it is that according to our manner of conception, we distinguish his virtues and properties from his essence. Concerning his properties, we conceive them under very different respects, and pretend not when we say that he is merciful, to beget an apprehension in the minds of those that hear us, that He is just, or when we say that He is wise, to give occasion to think of his power and might, as his attributes have very different objects, so we comprehend them in our understandings under very different ideas: But then when we speak of his essence, we make a kind of abstraction of it from his properties, and represent it as a single and simple thing, in which all his attributes exist as in a common subject. As to what concerns his attributes, we see them in some sort in this life, in that we understand at least in some degree what is the nature of those operations by which they display themselves upon their objects. For we are not perfectly ignorant what may be that inclination in God of pardoning sins to the penitent, and punishing the obstinate and impenitent and things of like nature. But as to his essence, there is no man that does not acknowledge that we understand it not at all in this life; that is to say, we are not able to form any conception in our minds which has any respect to the nature of his essence, only some think that when we shall be received into the heavens, our supreme happiness will consist in the vision of this essence, which certainly seems extremely difficult to be imagined…”

— Moses Amyraut, The Evidence of Things Not Seen, or Diverse Scriptural &amp; Philosophical Discourses concerning the State of Good &amp; Holy Men after Death... (d. 1664; London: Cockerill, 1700), 4th Discourse, Concerning the Happiness of Believers after the Resurrection, pp. 172-74">Copy</button><a class="share" href="https://x.com/intent/post?text=%E2%80%9CNow+although+the+nature+of+God+be+marvellously+one+and+simple%2C+so+it+is+that+according+to+our+manner+of+conception%2C+we+distinguish+his+virtues+and+properties+from+his+essence.+Concerning+his+properties%2C+we+conceive+them+under+very+different+respects%2C+and+pretend+not+when+we+say+that+he+is+merciful%2C+to+beget+an+apprehension+in+the+minds+of+those+that+hear+us%2C+that+He+is+just%2C+or+when+we+say+that+He+is+wise%2C+to+give+occasion+to+think+of+his+power+and+might%2C+as+his+attributes+have+very+different+objects%2C+so+we+comprehend+them+in+our+understandings+under+very+different+ideas%3A+But+then+when+we+speak+of+his+essence%2C+we+make+a+kind+of+abstraction+of+it+from+his+properties%2C+and+represent+it+as+a+single+and+simple+thing%2C+in+which+all+his+attributes+exist+as+in+a+common+subject.+As+to+what+concerns+his+attributes%2C+we+see+them+in+some+sort+in+this+life%2C+in+that+we+understand+at+least+in+some+degree+what+is+the+nature+of+those+operations+by+which+they+display+themselves+upon+their+objects.+For+we+are+not+perfectly+ignorant+what+may+be+that+inclination+in+God+of+pardoning+sins+to+the+penitent%2C+and+punishing+the+obstinate+and+impenitent+and+things+of+like+nature.+But+as+to+his+essence%2C+there+is+no+man+that+does+not+acknowledge+that+we+understand+it+not+at+all+in+this+life%3B+that+is+to+say%2C+we+are+not+able+to+form+any+conception+in+our+minds+which+has+any+respect+to+the+nature+of+his+essence%2C+only+some+think+that+when+we+shall+be+received+into+the+heavens%2C+our+supreme+happiness+will+consist+in+the+vision+of+this+essence%2C+which+certainly+seems+extremely+difficult+to+be+imagined%E2%80%A6%E2%80%9D%0A%0A%E2%80%94+Moses+Amyraut%2C+The+Evidence+of+Things+Not+Seen%2C+or+Diverse+Scriptural+%26+Philosophical+Discourses+concerning+the+State+of+Good+%26+Holy+Men+after+Death...+%28d.+1664%3B+London%3A+Cockerill%2C+1700%29%2C+4th+Discourse%2C+Concerning+the+Happiness+of+Believers+after+the+Resurrection%2C+pp.+172-74&amp;url=https%3A%2F%2F5solasquotes.github.io%2Fquote%2F57a78890f2.html&amp;via=5Solas" target="_blank" rel="noopener">Share on X</a><a class="perma" href="../quote/57a78890f2.html">Permalink</a><a class="src" href="https://reformedbooksonline.com/on-a-divine-disposition-inclination-willingness/#:~:text=Now%20although%20the%20nature%20of%20God,seems%20extremely%20difficult%20to%20be%20imagined&amp;text=Now%20although%20the%20nature%20of%20God%20be%20marvellously&amp;text=which%20certainly%20seems%20extremely%20difficult%20to%20be%20imagined" rel="noopener" target="_blank">Read it online · Reformed Books Online</a></div>

<blockquote><p>The goodness of God is his inclination to deal well and bountifully with his creatures. (Cocceius, Sum, p. 50) ‘Tis that whereby He wills there should be something besides Himself for his own glory. God is good in Himself and to Himself, i.e. highly amiable to Himself; and therefore some define it a perfection of God, whereby He loves Himself and his own excellency; but as it stands in relation to his creatures, ’tis that perfection of God whereby He delights in his works and is beneficial to them. God is the highest goodness, because He does not act for his own profit, but for his creatures’ welfare and the manifestation of his own goodness. He sends out his beams without receiving any addition to Himself or substantial advantage from his creatures. ‘Tis from this perfection that He loves whatsoever is good, and that is whatsoever He has made, for ‘every creature of God is good.‘ (1 Tim. 4:4) Every creature has some communications from Him, which cannot be without some affection to them; Every creature has a footstep of divine goodness upon it; God therefore loves that goodness in the creature, else He would not love Himself. (Cajetan, in pt. 2 of 2, quest. 34, art. 3) God hates no creature, no not the devils and damned as creatures; He is not an enemy to them as they are the works of his hands: He is properly an enemy that does simply and absolutely wish evil to another; but God does not absolutely wish evil to the damned; that justice that He inflicts upon them, the deserved punishment of their sin, is part of his goodness (as shall afterward be shown).</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/stephen-charnock.html">Stephen Charnock</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Several Discourses upon the Existence &amp; Attributes of God</cite>, … (d. 1680; London: Newman, 1682), Goodness of God, pp. 584-85</span></figcaption>

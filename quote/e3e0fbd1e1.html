<blockquote><p>In 1849, a cholera epidemic was raging throughout the United States. Not long after former President James K. Polk died of the disease in June, President Zachary Taylor declared a national day of fasting and prayer to be observed on August 3, 1849. E.D. McMaster, in his final days as President of Miami University in Ohio, preached a sermon that day titled Impending Judgments Averted by Repentance.” – Andrew Myers, ‘National Judgments Call for National Repentance: E.D. McMaster’; see here for more background info. Henry, Symmes C. – The Pestilence, a Divine Visitation: a Sermon preached August the Third, 1849, the Day of the National Fast Ref (1849) Symmes was a presbyterian minister in New Jersey. On the 1855 epidemic of Yellow Fever in America Armstrong, George D. – ‘The Lesson of the Pestilence’ (1855) on Heb. 12:10 About the yellow-fever epidemic in 1855 in Norfolk, Virginia, and in America generally. Armstrong was a presbyterian pastor. Cummins, George David – ‘The Pestilence: God’s Messenger and Teacher’ (1855) on Num. 16:46 About the yellow-fever epidemic in Norfolk, Virginia. Cummins (1822-1876) was an American Anglican Bishop and founder of the Reformed Episcopal Church. He was a staunch evangelical of reformed doctrine and he opposed the influences of ritualism and the Anglo-Catholic Oxford Movement. Storrs, Richard S. – ‘Terrors of the Pestilence’ (1855) on Eccl. 9:12 Storrs (1821-1900) was a conservative, congregational minister of the Church of the Pilgrims in Brooklyn, NY. Handy, Isaac W.K. – ‘The Terrible Doings of God’ (1855) Handy was a confederate, presbyterian pastor who was a graduate of Princeton Theological Seminary. He preached this sermon in a baptist church upon the occasion of 28 members of a Masonic Lodge dying in the recent epidemic in Virginia. A book of his, about his being imprisoned by the Union in the North, has been reprinted by Sprinkle Publications. . Breed, William P. – II. ‘The Great Plague’ in Under the Oak (Philadelphia: Presbyterian Board of Publication, 1866), pp. 19-85 ‘Under the oak’ refers to Rev. Breed (1816-1889) sitting and talking with children on Sabbath afternoons under an oak. This story is for children, but contains much spiritual help on the topic. “A good many years ago, in a town in India, a hundred miles north of Calcutta, a man suddenly fell sick…</p></blockquote>

<blockquote><p>…external and vocal preaching, and a visible administration of the sacrament in such an orderly way, as Christ has instituted, is an external ruling of Church members according to the law of Christ as King, an external ordaining of the worship, is an external ordering of the worshippers according to the acts of worship thus ordered, as sense teaches us: but the external ordaining of the worship, to preach, this, not this, to celebrate [the sacrament] in both kinds [bread and wine], by prayer and the words of institution, and not in one kind only [a wafer, as the Papists], is an external ordering of God’s worship: therefore as kings cannot administrate the sacraments, nor preach, so neither can they have the external government of the Church in their hands. … 2… John Reynolds [the English puritan] answers [the fore-stated Popish and Erastian opinion] that, from two offices [of external government and inward, spiritual government] of the head [Christ], which is to give life and influence of motion to the members, and also to guide and moderate the actions external of the body [the Church], we cannot make two heads [the king for the outward and Christ for the inward, as in Anglicanism]; and because the king has some civil government about the Church, we cannot make two heads over the Church, Christ one, and the King another under him. [Reynolds is saying, Rutherford approving, that because the king, on presbyterianism, rightfully has ‘some civil government about the Church’, it does not follow that the king is therefore a head of the Church, under Christ or otherwise. If the king legitimately ruled in sacra, in sacred things, this would be the case; but he does not, and it cannot be the case.] 3. This [Erastian Anglican tenet] is Anabaptistical; for because the visible government of the Church is external, we are not to cut off all necessity of the ministry to feed and rule with ecclesiastical authority, and because the prince is gifted and a Christian, to give all to him, for a calling there must be from God, for the king to govern the Church of Christ by laws, and prescribing external worship therein, for Christ has left, Eph. 4; 1 Cor. 12; 1 Tim. 3; men to be feeders and governors of his Church by office, whose it is to be answerable for souls, Heb. 13:18. 4. It is tyrannical, because [1.] it puts power into the magistrate’s hand to take from the Church, that inbred and intrinsic power of external and visible government over herself and members, which all civil incorporations by instinct of nature have, and the magistrate, as such, not being a member of the Church has [would have] a headship, even being a heathen magistrate, over the redeemed body of Christ. 2. By this reason, the Lord Jesus as King has no pastors in his name to use the laws of his kingdom, by binding and loosing; for discipline being an external thing, (say they) is not a part of Christs kingly power, but the King as Christ’s civil vicar has this power [which Rutherford denies]…</p></blockquote>

<div class="actions"><button class="copy" data-copy="“…external and vocal preaching, and a visible administration of the sacrament in such an orderly way, as Christ has instituted, is an external ruling of Church members according to the law of Christ as King, an external ordaining of the worship, is an external ordering of the worshippers according to the acts of worship thus ordered, as sense teaches us: but the external ordaining of the worship, to preach, this, not this, to celebrate [the sacrament] in both kinds [bread and wine], by prayer and the words of institution, and not in one kind only [a wafer, as the Papists], is an external ordering of God’s worship: therefore as kings cannot administrate the sacraments, nor preach, so neither can they have the external government of the Church in their hands. … 2… John Reynolds [the English puritan] answers [the fore-stated Popish and Erastian opinion] that, from two offices [of external government and inward, spiritual government] of the head [Christ], which is to give life and influence of motion to the members, and also to guide and moderate the actions external of the body [the Church], we cannot make two heads [the king for the outward and Christ for the inward, as in Anglicanism]; and because the king has some civil government about the Church, we cannot make two heads over the Church, Christ one, and the King another under him. [Reynolds is saying, Rutherford approving, that because the king, on presbyterianism, rightfully has ‘some civil government about the Church’, it does not follow that the king is therefore a head of the Church, under Christ or otherwise. If the king legitimately ruled in sacra, in sacred things, this would be the case; but he does not, and it cannot be the case.] 3. This [Erastian Anglican tenet] is Anabaptistical; for because the visible government of the Church is external, we are not to cut off all necessity of the ministry to feed and rule with ecclesiastical authority, and because the prince is gifted and a Christian, to give all to him, for a calling there must be from God, for the king to govern the Church of Christ by laws, and prescribing external worship therein, for Christ has left, Eph. 4; 1 Cor. 12; 1 Tim. 3; men to be feeders and governors of his Church by office, whose it is to be answerable for souls, Heb. 13:18. 4. It is tyrannical, because [1.] it puts power into the magistrate’s hand to take from the Church, that inbred and intrinsic power of external and visible government over herself and members, which all civil incorporations by instinct of nature have, and the magistrate, as such, not being a member of the Church has [would have] a headship, even being a heathen magistrate, over the redeemed body of Christ. 2. By this reason, the Lord Jesus as King has no pastors in his name to use the laws of his kingdom, by binding and loosing; for discipline being an external thing, (say they) is not a part of Christs kingly power, but the King as Christ’s civil vicar has this power [which Rutherford denies]…”

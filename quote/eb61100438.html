<main class="wrap"><figure class="quote" id="q-eb61100438" data-kw="">
<blockquote><p>2. A calling is extraordinary, either in habit or in exercise; in habit, as to be an apostle and have the gift of miracles: Thus our reformers calling was not extraordinary, they were not immediately called by God from Heaven; for they would not have concealed such a calling, if they had had any such: Or a calling is extraordinary in the exercise, and that two ways; either in the principle moving them to teach, or, 2. in the manner of teaching and efficacy; a calling extraordinary in the principle moving is twofold: Either a mere prophetical impulsion of revelation stirring them up to such an act, as the Spirit of the Lord came upon Saul and he prophesied; this our reformers had not because we never find that they allege it. 2. A more than ordinary motion with illumination by God’s Spirit speaking in the Scriptures, in which motions they were not subordinate in the exercise of their ministry to the Church of pastors, but immediately in that subordinated to God; and in this I prove that our reformers were extraordinary doctors. 1. Because Eze. 34, in a universal apostasy of the prophets and shepherds, the Lord extraordinarily works, v. 11, ‘For thus saith the Lord God, behold I, even I will both search my sheep, and seek them out.’ Now this is by pastors, when the ordinary pastors are all failed. So Rev. 11, in that universal apostasy under Antichrist, when the gentiles tread upon the outer court of the Temple and the holy City, God stirs up two witnesses to prophesy in sackcloth; that is, some few pastors (for two is the smallest number) and they prophesy and are slain, and yet they rise again. We need not apply this to men in particular, as to John Huss and Jerome of Prague; but certainly, some few spake against Babylon and they were borne down and oppressed and killed, and men of that same spirit rose and spake that same truth as if the very two men who were slain had risen within three days again. 2. Because when the Church is overgone with heresy and Apostasy, our reformers, in the exercise of their ministry, were not to keep a certain flock as in a constitute[d] Church, and suppose they had no calling but eminent gifts, they were to spread the Gospel to nations, as Luther did; and suppose the people should resist them, as in many places they did; yet God called them, and they were not to expect election from people: So [men of] Cyprus and Cyrenus preached, Acts 11 and 18, and we read of no vocation that they had from either people or apostle. So Origen preached to a people in a certain town where there was not one Christian, and afterwards he was chosen their pastor.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/samuel-rutherford.html">Samuel Rutherford</a></span><span class="wk"><span class="lbl">Work:</span> <cite>A Peaceable &amp; Temperate Plea for Paul’s Presbytery in Scotland</cite>, (1642), pp. 126-7</span></figcaption>

<blockquote><p>The other two are ordinary office-bearers, pastors and teachers; I say two, though the disjunctive particle “some,” be not cast in between them; for they are distinguished, Rom. 12:7, 8, and the exercise of their respective offices is distinguished also, 1 Cor. 12:8; so that by pastors are meant those who, besides their ability to open up the text of Scripture in some measure, are chiefly gifted with the word of wisdom, wisely and powerfully to apply the word for working upon the affections, as the matter requires; and the teacher is he who is gifted with the word of knowledge, or ability to open up the mind of God in Scripture, establishing truth, and confuting error, without insisting much upon particular application; which office, because of the church’s poverty, is confined to the schools, and the ordinary exercise of it before the people left upon the pastor.</p></blockquote>

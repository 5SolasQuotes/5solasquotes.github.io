<main class="wrap"><figure class="quote" id="q-7c7cfbd18e" data-kw="against eternity matter">
<blockquote><p>Was the world from eternity, or at least could it have been? We deny. The question has two parts. One concerns the actual eternity of the world—whether it was really from eternity; the other concerns the possibility—whether at least it could be. The first lies between us and the ancient philosophers who asserted the eternity of the world, either materially only (as Plato) or formally also (as Aristotle).</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/francis-turretin.html">Francis Turretin</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Institutes of Elenctic Theology</cite>, 5.3.1</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/creation/creation-in-general.html">Creation in General</a> › <a href="../topics/creation/creation-in-general/against-the-eternity-of-matter.html">Against the eternity of matter</a></span></div>

</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-ac26449f03" data-kw="six days creation">
<blockquote><p>Creation may be viewed either in general with regard to the production of the whole universe, or in particular with regard to the production of its various parts in the six days of creation. In the latter, their creation is first set forth, then their distinction and lastly their adornment. In all these, God demonstrates his power splendidly in the production of all things (great as well as small) ex nihilo by his word alone; his wisdom, in their variety, order and use; his goodness, in the communication of himself (by which he made all things very good).</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/francis-turretin.html">Francis Turretin</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Institutes of Elenctic Theology</cite>, 5.1</span></figcaption>

</figure><figure class="quote" id="q-7320ae0471" data-kw="">
<blockquote><p>The attaining of God&#x27;s glory was an end, which being ultimate and supreme, must in no case whatsoever give place. This is spoken of as the end of God&#x27;s executing judgments on his enemies in this world. … And this is spoken of as the end, both of the executions of wrath, and in the glorious exercises of mercy, in the misery and happiness of another world. Rom. 9:22–23, &quot;What if God, willing to show his wrath, and make his power known, endured with much long suffering, the vessels of wrath fitted to destruction: and that he might make known the riches of his glory on the vessels of mercy, which he hath afore prepared unto glory …?&quot; … Then his glory shall be obtained, with respect both to saints and sinners. From these things it is manifest … that God&#x27;s glory is the ultimate end of the creation of the world.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/jonathan-edwards.html">Jonathan Edwards</a></span><span class="wk"><span class="lbl">Work:</span> <cite>A Dissertation Concerning the End for Which God Created the World</cite>, on Ex. 14:17 and Rom. 9:22–23</span></figcaption>

</figure><figure class="quote" id="q-d9f8cb9c0b" data-kw="creation ex nihilo">
<blockquote><p>The first work of nature is creation, by which he formed out of nothing as to its whole being this entire universe and all that is in it. Hence it is called “the beginning of the ways of God” (Prov. 8:22) because having come forth from the secret sanctuary of his eternal majesty, he willed to communicate himself ad extra by it and manifest himself unto men. Creation means a production out of nothing.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/francis-turretin.html">Francis Turretin</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Institutes of Elenctic Theology</cite>, 5.1.3–4</span></figcaption>

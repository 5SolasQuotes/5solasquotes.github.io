<main class="wrap"><figure class="quote" id="q-636237e129" data-kw="">
<blockquote><p>If &quot;elders&quot; and &quot;bishops&quot; be not the same persons, having the same office, the same function, and the same duties, and the same names, it is impossible, So far as I understand, how it should be expressed: for these elders are they whom the Holy Ghost made bishops, they were many of them in the same church, their duty it was to attend unto the flock and to feed the church, which comprise all the duties, the whole function of elders and bishops; which must therefore be the same.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/john-owen.html">John Owen</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The True Nature of a Gospel Church and Its Government</cite>, ch. 4 (Works 16)</span></figcaption>

<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/w-g-t-shedd.html">W. G. T. Shedd</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Quoted on X by @Tabletalk</cite>, Oct 25, 2020</span></figcaption>

</figure><figure class="quote" id="q-4ded594794" data-kw="">
<blockquote><p>In giving the name of bishops, presbyters, and pastors, indiscriminately to those who govern churches, I have done it on the authority of Scripture, which uses the words as synonymous. To all who discharge the ministry of the word it gives the name of bishops. Thus Paul, after enjoining Titus to ordain elders in every city, immediately adds, &quot;A bishop must be blameless,&quot; &amp;c., (Tit. 1: 5, 7.) So in another place he salutes several bishops in one church, (Phil. 1: 1.) And in the Acts, the elders of Ephesus, whom he is said to have called together, he, in the course of his address, designates as bishops, (Acts 20: 17.)</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/john-calvin.html">John Calvin</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Institutes of the Christian Religion</cite>, 4.3.8</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/church-government-and-the-ministry/offices.html">Offices</a> › <a href="../topics/church-government-and-the-ministry/offices/bishop-and-presbyter.html">Bishop and presbyter</a></span><span class="t"><a href="../topics/church-government-and-the-ministry/forms-of-government.html">Forms of Government</a> › <a href="../topics/church-government-and-the-ministry/forms-of-government/episcopal-presbyterian-congregational.html">Episcopal, presbyterian, congregational</a></span></div>

</figure><figure class="quote" id="q-7ecc71505d" data-kw="">
<blockquote><p>Discoursing of Bishops, and having described their character, and the qualities which they ought to possess, and having passed over the order of Presbyters, he proceeds to that of Deacons. The reason of this omission was, that between Presbyters and Bishops there was no great difference. Both had undertaken the office of Teachers and Presidents in the Church, and what he has said concerning Bishops is applicable to Presbyters. For they are only superior in having the power of ordination, and seem to have no other advantage over Presbyters.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/john-chrysostom.html">John Chrysostom</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Homilies on First Timothy</cite>, hom. 11 (on 1 Tim. 3:8)</span></figcaption>

<blockquote><p>First, consider the care of keeping Religion pure in a Nation, is part of the Christian Magistrates charge, and not the least the Kings of Israel were commanded to keep by them the Book of the Law that they might learn to fear the Lord, and keep all the words of this Law, Deut. 17, 18. which was not meant only personally (that was to be the endeavour of every private Israelite) but as a Ruler to see the Law of God kept, and the true Religion there commanded, preserved in their Kingdom.

Hence we find those Kings sharply reproved, that did either set up, or connive at idolatry in their reign; and those commended who removed the Monuments of idolatry, and restored the Worship of God to its purity. Thus we find of Hezekiah, the most famous Reformer of them all, a large testimony is given by God to him, for his zeal therein; That he cleaved to the Lord, and kept his Commandments, which the Lord commanded Moses. And truly, if it were the Magistrates work then, it continues to be so now, except we can find that Christ hath retrenched their power in matters of Religion, which he hath not …</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/william-gurnall.html">William Gurnall</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Magistrate’s Portraiture drawn from the Word, and Preached in a Sermon at Stowe-Market in Suffolk, upon August, the 20. 1656. before the Election of Parliament-men for the same County</cite>, (London: Ralph Smith, 1656), pp 31-32.</span></figcaption>

</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-7bdb2ab953" data-kw="">
<blockquote><p>What was then the sin of Peter in resuming the practice of the ceremonies there [in Galatians 2]? His sin was double. First, the abuse of his authority in the Church, for, that unawares by his example, he compelled the gentiles to the use of such ceremonies as himself saw liberty to forbear amongst them; and which having never been commanded by God to them, he had no power to impose on them. His other sin was the dissembling or concealing of his Christian Liberty which he should then have stood upon, when he saw the false teachers urge these ceremonies upon the gentiles as well as upon the Jews, to the prejudice of their Christian Liberty. When things that are indifferent are commanded to be done of necessity (as now all Popes, and prelates’ ceremonies are) then are not the same to be obeyed, because the same destroyes our freedom in Christ. The sum of all this will lead us by the hand one step farther, namely; if it be a sin in Church-governors to command (especially upon strict penalty) indifferent, decent things, it will be a sin also in ministers and in private Christians to subscribe ex animo [from the soul], and to yield obedience by conformity to such commands, although the ceremonies were as good (indeed) as they were pretended (which I believe they are not) indifferent-decent-things. For, does not such voluntary subscription and conforming to them build up our Church-governors, yea and with them (that which is most to be taken to heart of us, our soveraign civil governors also in the confidence) that such commandements are as well lawfully given by them, as received and obeyed, yea confirmed and allowed by us? Now to build up or edify a brother to sin, is properly to offend a brother; for the proper definition of an offence is that which edifies a brother unto sin, as the original word expresses it (1 Cor. 8:10), and so to sin against a brother, is to wound his conscience; yea, and as much as in us lies, to cause him to perish for whom Christ died; which is no better than spiritual murder of his soul. Now, if thus to edify any brother to sin be so heinous an offence, how much more heinous an offence is it to edify our governors to the giving and urging of such commandments, yea and to the sharp censuring of all others as refractory and factious persons, who choose rather to undergo the loss of the greatest comforts they enjoy in this world than to wound the consciences either of themselves or of their governours? It is true by forbearing obedience to those commandments we offend the spirits of our governors, and make them to be (though causelesly) offended with us; But by yielding obedience to these things we should offend their consciences in edifying them to sin, and provoke the Lord to be offended with them. Better they be offended with us, without fault, than through our fault God to be offended with them and us. It is not for Christians, much less for ministers, to redeem outward peace and liberty at so dear a price as the hazzard of the blood of so many precious souls, especially of our governors in highest place and authority. This was the author’s judgement with whom our martyr, Mr. William Tyndale concurs, in his Answer to Mr. Moore’s First Book, pp. 285-6. Our prelates ought to be our servants, as the apostles were, to teach us Christ’s doctrine, and not to Lord over us with their own, Peter called it tempting of the Holy Ghost, Acts 15[:10], to lade the heathen with ought but that which necessity and brotherly love requires, and Paul rebuking the Corinthians and Galatians for their over much obedience, warns all men to stand fast and not to suffer themselves to be brought into bondage.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/william-prynne.html">William Prynne</a></span><span class="wk"><span class="lbl">Work:</span> <cite>A Brief, Pithy Discourse upon 1 Corinthians 14:40</cite>, … (London, 1661), pp. 13-14</span></figcaption>

<blockquote><p>Question 16: What if a man or wife know that the other in hatred does really intend by poison or other murder, to take away their life? May they not depart? Answer: They may not do it upon a groundless or rash surmise, nor upon a danger which by other lawful means may be avoided (as by vigilancy, or the magistrate, or especially by love and duty). But in plain danger, which is not otherwise like[ly] to be avoided, I doubt not, but it may be done and ought. For it is a duty to preserve our own lives as well as our neighbours: And when marriage is contracted for mutual help, it is naturally implied that they shall have no power to deprive one another of life (however some barbarous nations have given men power of the lives of their wives). And killing is the grossest kind of desertion, and a greater injury and violation of the marriage-covenant than adultery, and may be prevented by avoiding the murderer’s presence, if that way be necessary. None of the ends of marriage can be attained where the hatred is so great.</p></blockquote>

— Richard Baxter, A Christian Directory, or a Sum of Practical Theology, … (London, 1673), pt. 2, ‘Christian Economics’, ch. 9, ‘Cases About Divorce &amp; Separation’, p. 538">Copy</button><a class="share" href="https://x.com/intent/post?text=%E2%80%9CQuestion+16%3A+What+if+a+man+or+wife+know+that+the+other+in+hatred+does+really+intend+by+poison+or+other+murder%2C+to+take+away+their+life%3F+May+they+not+depart%3F+Answer%3A+They+may+not+do+it+upon+a+groundless+or+rash+surmise%2C+nor+upon+a+danger+which+by+other+lawful+means+may+be+avoided+%28as+by+vigilancy%2C+or+the+magistrate%2C+or+especially+by+love+and+duty%29.+But+in+plain+danger%2C+which+is+not+otherwise+like%5Bly%5D+to+be+avoided%2C+I+doubt+not%2C+but+it+may+be+done+and+ought.+For+it+is+a+duty+to+preserve+our+own+lives+as+well+as+our+neighbours%3A+And+when+marriage+is+contracted+for+mutual+help%2C+it+is+naturally+implied+that+they+shall+have+no+power+to+deprive+one+another+of+life+%28however+some+barbarous+nations+have+given+men+power+of+the+lives+of+their+wives%29.+And+killing+is+the+grossest+kind+of+desertion%2C+and+a+greater+injury+and+violation+of+the+marriage-covenant+than+adultery%2C+and+may+be+prevented+by+avoiding+the+murderer%E2%80%99s+presence%2C+if+that+way+be+necessary.+None+of+the+ends+of+marriage+can+be+attained+where+the+hatred+is+so+great.%E2%80%9D%0A%0A%E2%80%94+Richard+Baxter%2C+A+Christian+Directory%2C+or+a+Sum+of+Practical+Theology%2C+%E2%80%A6+%28London%2C+1673%29%2C+pt.+2%2C+%E2%80%98Christian+Economics%E2%80%99%2C+ch.+9%2C+%E2%80%98Cases+About+Divorce+%26+Separation%E2%80%99%2C+p.+538&amp;url=https%3A%2F%2F5solasquotes.github.io%2Fquote%2F8980e17339.html&amp;via=5Solas" target="_blank" rel="noopener">Share on X</a><a class="perma" href="../quote/8980e17339.html">Permalink</a><a class="src" href="https://reformedbooksonline.com/on-divorce-remarriage/#:~:text=Question%2016%3A%20What%20if%20a%20man,where%20the%20hatred%20is%20so%20great&amp;text=Question%2016%3A%20What%20if%20a%20man%20or%2 <blockquote><p>But if no man ought to be compelled to goodness, to what intent doth Solomon (the wisest of all men) so many times command to chastise children? “He that spareth the rod hateth the child,” saith he; “Thou indeed dost strike him, but with the rod thou deliverest his soul from death [Prov. 13:24; 22:14].” Daily experience, and the disposition of men, do plainly teach, that in men there are most vehement affections, which, unless they be remedied and bridled betimes, do both destroy them in whom they be, and other men too, who at the first might easily with light punishment have been preserved. Men in their madness despise compulsion and chastising punishment; but, when they come to themselves again, and see how great evils they are delivered by those that compelled them, then they rejoice that to their health they were chastised, and praise the compulsion which before they despised.</p></blockquote>

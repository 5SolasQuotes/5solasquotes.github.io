<blockquote><p>XII. The [House of] representatives… shall each of them… before he takes his seat, shall make and subscribe the following declaration, viz. You do believe in one God, the Creator and Governor of the Universe, the rewarder of the good, and punisher of the wicked. And you do acknowledge the scriptures of the Old and New Testament to be given by divine inspiration; and own and profess the Protestant religion. … XXXVIII. …And all religious societies, or bodies of men, that may be hereafter united or incorporated, for the advancement of religion and learning, or for other pious and charitable purposes, shall be encouraged and protected in the enjoyment of the privileges, immunities and estates, which they in justice ought to enjoy, under such regulations as the General Assembly of this State shall direct.</p></blockquote>

</figure><figure class="quote" id="q-5fd50f4490" data-kw="">
<blockquote><p>But how does this oath, or the act of parliament requiring ministers to take this oath, make ministers dependent on the magistrate in the exercise of their ministry, when the oath only contains the duty of a subject, and speaks nothing either of the ministry or exercise of the ministry? ‘Yea, but the act enjoining it, makes it an essential requisite to a minister of this national Church.’ Answer: There is no such metaphysical term in the act as essential, but only that ministers of this national Church shall take it. The Church is considered not simply as a Church, but as national, having national and legal privileges, which they are deprived of that refuse this oath. It does not say he shall not be a minister if he take it not, but he shall not have the countenance and protection of civil authority, he shall not enjoy his benefice, shall not have allowance form the magistrate for, and encouragement in the exercise of his ministry. He shall not enjoy the peaceable public exercise of his ministry. And what wonder that the magistrate will not countenance them as ministers who will not bind themselves to him as subjects? that he will not let them preach to his subjects if he can hinder them, who will not promise and swear when required that they will not preach treason and rebellion against him, when they should teach them subjection and obedience to Christ? that he will not let them teach others what they call their duty to God who will not do their duty to their sovereign, but separate these things which God has conjoined, ‘Fear God, honor the king’? See more of this in the Seasonable Admonition and Exhortation of the Commission of the General Assembly, anno 1698, which you have neither obeyed neither yet given a reason of your disobedience; and in a Treatise against Separation, by Mr. Alexander Shields, one of your teachers, to whom you became his enemy, because he told you the truth… …But [the magistrate] shows by this act whom he will countenance and protect in the exercise of the ministry, to whom he will give or allow the stipends and legal maintenance to encourage them in the exercise of the ministry, whom he will suffer to pass and repass, and exercise their ministry without hazard or molestation…</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/gavin-hamilton.html">Gavin Hamilton</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Just Reflections upon a Pamphlet entitled, A Modest Reply to a Letter from a Friend to Mr. John M’millan ([Edinburgh] 1712) Hamilton was a Church of Scotland minister.</cite>, p. 35</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/civil-government-and-society/church-and-state.html">Civil Government and Society: Church and State</a></span></div>

</figure><figure class="quote" id="q-c30560e06a" data-kw="">
<blockquote><p>5. Did you know before you wrote this, that all such as we persuade men to hear, have by oath renounced their Christian liberty? what oath is it that you mean? If you mean the Oath of Supremacy or Allegiance, unless Popery be Christian liberty, we know of none such which these renounce. And I know of no other oath, except that of canonical obedience in licitis et honestis [in things lawful and honest]. And for that: 1. I find not that the act or canons do impose it on those that come for ordination (nor am so well skilled in the law as to know by what law it is done). 2. I know that men have been ordinarily ordained without it. And to such your reason for separation is vain. 3. Mr. [William] Bradshaw and other old non-conformists were wont to say that they obeyed the diocesans and so did promise them obedience only as they are the king’s officers, deputed for the exercise of that civil or coercive power which magistrates have in causes called ecclesiastical [i.e. circa sacra]. And what liberty does that give away? 4. But suppose that you are the wiser man, and that those that are more ignorant do mistakingly think that canonical obedience and the oath (with that of Supremacy) to be their duty, and no renouncing of their Christian liberty: Is it not false doctrine to conclude that Christ never sent out any that had as great a sin as this? what none? when he sent out Judas himself, who was first a thief and after a traitor? Do you think then that Christ ever sent out liars, railers, furious Church-dividers, false accusers, etc.? 5. That indeed they are nothing else, as to the whole discharge and exercise of their office, but the servants of men, is another slander and untruth. He that is a servant of Christ, and a true pastor of a Christian Church, and a sound preacher of the Gospel, and a helper of believers’ faith, and a lover of the people’s souls, and a diligent upright laborer for men’s salvation, is something else than a servant of man (even in the discharge of their ministerial office). But such are many of the conformable ministers: Therefore prove if you can that Dr. Preston, Sibbes, Stoughton, Whittaker, Mr. Bolton, Whateley, Gataker, Fenner, and all the late [Westminster] Assembly save eight or nine at most (being all conformists) were nothing else but the servants of men, and not at all the servants of Christ. Your Father thought otherwise of Mr. Bolton, and perhaps they were both as wise as you. Prove now that Mr. [William] Gurnall, Mr. [John] Trapp, Dr. [John] Lightfoot, Dr. Walker, Mr. Langley, and many others that I can name that are worthy men in London and round about it, are nothing else but the servants of men? And will it not be as hard to prove one to be a servant of Christ who serves Satan by falsehood and malice, and calumniating Christ’s Churches and servants, as those that are thus the servants of men.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/richard-baxter.html">Richard Baxter</a></span><span class="wk"><span class="lbl">Work:</span> <cite>A Second Admonition to Mr. Edward Bagshaw… (London, 1671), sect. 41</cite>, pp. 103-5</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/civil-government-and-society/church-and-state.html">Civil Government and Society: Church and State</a></span></div>
<div class="actions"><button class="copy" data-copy="“5. Did you know before you wrote this, that all such as we persuade men to hear, have by oath renounced their Christian liberty? what oath is it that you mean? If you mean the Oath of Supremacy or Allegiance, unless Popery be Christian liberty, we know of none such which these renounce. And I know of no other oath, except that of canonical obedience in licitis et honestis [in things lawful and honest]. And for that: 1. I find not that the act or canons do impose it on those that come for ordination (nor am so well skilled in the law as to know by what law it is done). 2. I know that men have been ordinarily ordained without it. And to such your reason for separation is vain. 3. Mr. [William] Bradshaw and other old non-conformists were wont to say that they obeyed the diocesans and so did promise them obedience only as they are the king’s officers, deputed for the exercise of that civil or coercive power which magistrates have in causes called ecclesiastical [i.e. circa sacra]. And what liberty does that give away? 4. But suppose that you are the wiser man, and that those that are more ignorant do mistakingly think that canonical obedience and the oath (with that of Supremacy) to be their duty, and no renouncing of their Christian liberty: Is it not false doctrine to conclude that Christ never sent out any that had as great a sin as this? what none? when he sent out Judas himself, who was first a thief and after a traitor? Do you think then that Christ ever sent out liars, railers, furious Church-dividers, false accusers, etc.? 5. That indeed they are nothing else, as to the whole discharge and exercise of their office, but the servants of men, is another slander and untruth. He that is a servant of Christ, and a true pastor of a Christian Church, and a sound preacher of the Gospel, and a helper of believers’ faith, and a lover of the people’s souls, and a diligent upright laborer for men’s salvation, is something else than a servant of man (even in the discharge of their ministerial office). But such are many of the conformable ministers: Therefore prove if you can that Dr. Preston, Sibbes, Stoughton, Whittaker, Mr. Bolton, Whateley, Gataker, Fenner, and all the late [Westminster] Assembly save eight or nine at most (being all conformists) were nothing else but the servants of men, and not at all the servants of Christ. Your Father thought otherwise of Mr. Bolton, and perhaps they were both as wise as you. Prove now that Mr. [William] Gurnall, Mr. [John] Trapp, Dr. [John] Lightfoot, Dr. Walker, Mr. Langley, and many others that I can name that are worthy men in London and round about it, are nothing else but the servants of men? And will it not be as hard to prove one to be a servant of Christ who serves Satan by falsehood and malice, and calumniating Christ’s Churches and servants, as those that are thus the servants of men.”

— Richard Baxter, A Second Admonition to Mr. Edward Bagshaw… (London, 1671), sect. 41, pp. 103-5">Copy</button><a class="share" href="https://x.com/intent/post?text=%E2%80%9C5.+Did+you+know+before+you+wrote+this%2C+that+all+such+as+we+persuade+men+to+hear%2C+have+by+oath+renounced+their+Christian+liberty%3F+what+oath+is+it+that+you+mean%3F+If+you+mean+the+Oath+of+Supremacy+or+Allegiance%2C+unless+Popery+be+Christian+liberty%2C+we+know+of+none+such+which+these+renounce.+And+I+know+of+no+other+oath%2C+except+that+of+canonical+obedience+in+licitis+et+honestis+%5Bin+things+lawful+and+honest%5D.+And+for+that%3A+1.+I+find+not+that+the+act+or+canons+do+impose+it+on+those+that+come+for+ordination+%28nor+am+so+well+skilled+in+the+law+as+to+know+by+what+law+it+is+done%29.+2.+I+know+that+men+have+been+ordinarily+ordained+without+it.+And+to+such+your+reason+for+separation+is+vain.+3.+Mr.+%5BWilliam%5D+Bradshaw+and+other+old+non-conformists+were+wont+to+say+that+they+obeyed+the+diocesans+and+so+did+promise+them+obedience+only+as+they+are+the+king%E2%80%99s+officers%2C+deputed+for+the+exercise+of+that+civil+or+coercive+power+which+magistrates+have+in+causes+called+ecclesiastical+%5Bi.e.+circa+sacra%5D.+And+what+liberty+does+that+give+away%3F+4.+But+suppose+that+you+are+the+wiser+man%2C+and+that+those+that+are+more+ignorant+do+mistakingly+think+that+canonical+obedience+and+the+oath+%28with+that+of+Supremacy%29+to+be+their+duty%2C+and+no+renouncing+of+their+Christian+liberty%3A+Is+it+not+false+doctrine+to+conclude+that+Christ+never+sent+out+any+that+had+as+great+a+sin+as+this%3F+what+none%3F+when+he+sent+out+Judas+himself%2C+who+was+first+a+thief+and+after+a+traitor%3F+Do+you+think+then+that+Christ+ever+sent+out+liars%2C+railers%2C+furious+Church-dividers%2C+false+accusers%2C+etc.%3F+5.+That+indeed+they+are+nothing+else%2C+as+to+the+whole+discharge+and+exercise+of+their+office%2C+but+the+servants+of+men%2C+is+another+slander+and+untruth.+He+that+is+a+servant+of+Christ%2C+and+a+true+pastor+of+a+Christian+Church%2C+and+a+sound+preacher+of+the+Gospel%2C+and+a+helper+of+believers%E2%80%99+faith%2C+and+a+lover+of+the+people%E2%80%99s+souls%2C+and+a+diligent+upright+laborer+for+men%E2%80%99s+salvation%2C+is+something+else+than+a+servant+of+man+%28even+in+the+discharge+of+their+ministerial+office%29.+But+such+are+many+of+the+conformable+ministers%3A+Therefore+prove+if+you+can+that+Dr.+Preston%2C+Sibbes%2C+Stoughton%2C+Whittaker%2C+Mr.+Bolton%2C+Whateley%2C+Gataker%2C+Fenner%2C+and+all+the+late+%5BWestminster%5D+Assembly+save+eight+or+nine+at+most+%28being+all+conformists%29+were+nothing+else+but+the+servants+of+men%2C+and+not+at+all+the+servants+of+Christ.+Your+Father+thought+otherwise+of+Mr.+Bolton%2C+and+perhaps+they+were+both+as+wise+as+you.+Prove+now+that+Mr.+%5BWilliam%5D+Gurnall%2C+Mr.+%5BJohn%5D+Trapp%2C+Dr.+%5BJohn%5D+Lightfoot%2C+Dr.+Walker%2C+Mr.+Langley%2C+and+many+others+that+I+can+name+that+are+worthy+men+in+London+and+round+about+it%2C+are+nothing+else+but+the+servants+of+men%3F+And+will+it+not+be+as+hard+to+prove+one+to+be+a+servant+of+Christ+who+serves+Satan+by+falsehood+and+malice%2C+and+calumniating+Christ%E2%80%99s+Churches+and+servants%2C+as+those+that+are+thus+the+servants+of+men.%E2%80%9D%0A%0A%E2%80%94+Richard+Baxter%2C+A+Second+Admonition+to+Mr.+Edward+Bagshaw%E2%80%A6+%28London%2C+1671%29%2C+sect.+41%2C+pp.+103-5&amp;url=https%3A%2F%2F5solasquotes.github.io%2Fquote%2Fc30560e06a.html&amp;via=5Solas" target="_blank" rel="noopener">Share on X</a><a class="perma" href="../quote/c30560e06a.html">Permalink</a><a class="src" href="https://reformedbooksonline.com/topics/topics-by-subject/civil-government/church-state-relations/erastianism/#:~:text=5.%20Did%20you%20know%20before%20you,are%20thus%20the%20servants%20of%20men." rel="noopener" target="_blank">Read it online · Reformed Books Online</a></div>

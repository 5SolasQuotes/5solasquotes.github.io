<blockquote><p>9. [Maxwell’s accusation of presbyterians is false:] That the king must submit his sceptre to the presbytery. The king’s sceptre is his royal office, which is not subject to any judicature, no more than any lawful ordinance of Christ; but if the king, as a man, blaspheme God, murder the innocent, advance belly-gods (such as our prelates for the most part were) above the Lord’s inheritance, the ministers of Christ are to say, ‘The king troubles Israel, and they have the keys to open and shut heaven to, and upon the king, if he can offend.’ … 21. It is false that presbyteries usurp both swords because they censure sins which the civil magistrate should censure and punish. Elijah might be said then to mix himself with the civil business of the kingdom, because he prophesied against idolaters’ killing of the Lord’s prophets; which crime the civil magistrate was to punish. But the truth is, the assembly of Glasgow, 1637, condemned the prelates because they, being pastors, would be also lords of parliament, of session, of secret council, of exchequer, judges, barons, and in their lawless high commission, would fine, imprison, and use the sword. … 29. It is a lie that our General Assembly may repeal [civil] laws, command and expect performance of the king, or then excommunicate, subject to them, force and compel king, judges and all, to submit to them. They may not force the conscience of the poorest beggar, nor is any Assembly infallible, nor can it lay bounds upon the souls of judges, which they are to obey with blind obedience — their power is ministerial, subordinate to Christ’s law; and what civil laws parliaments make against God’s Word, they may authoritatively declare them to be unlawful, as though the emperor (Acts 15) had commanded fornication and eating of blood. Might not the Assembly forbid these in the synod?</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/samuel-rutherford.html">Samuel Rutherford</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Lex Rex... (1644; Edinburgh: Ogle, 1843)</cite>, pp. xxii-xxiii</span></figcaption>

</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-15b6f3d606" data-kw="">
<blockquote><p>Forasmuch as it has pleased the Almighty God by the wise disposition of his divine providence so to Order and dispose of things that we… are now cohabiting and dwelling in and upon the River of Conectecotte… And well knowing where a people are gathered together the word of God requires that to maintain the peace and union of such a people there should be an orderly and decent Government established according to God… do therefore… enter into Combination and Confederation together, to maintain and preserve the liberty and purity of the gospel of our Lord Jesus which we now profess, as also the discipline of the Churches, which according to the truth of the said gospel is now practiced amongst us… 1. It is Ordered, sentenced and decreed that there shall be yearly two general Assemblies or Courts… wherein shall be yearly chosen form time to time so many magistrates and other public officers… Whereof one to be chosen Governor… which… shall have power to administer justice according to the Laws here established, and for want thereof according to the rule of the word of God… … The Oath of the Governor, for the [Present] I N. W…. do swear by the great and dreadful name of the everliving God, to promote the public good and peace of the same… and will further the execution of Justice according to the rule of God’s word; so help me God, in the name of the Lord Jesus Christ.</p></blockquote>

<blockquote><p>The State, considered in its corporate character, is a MORAL PERSON, with a moral standing and responsibility. It is not the creation of the so-called social compact or of the popular will, but a divine institution based on natural religion. It coheres by a moral and religious bond; and its rulers are the lieutenants of God. If the State is a moral person, capable of performing duty, of committing sin, and suffering punishment, which everyone must own who traces the fate of nations according to the divine word, it follows that a nation, acting by its rulers, can accept Christianity and make a public profession of it as the national rule and guide. It had been held together previous to the recognition of Christianity by some form of religion however impure, without which it could not have existed. And the first duty of the civil ruler when brought in contact with Christianity and persuaded of its divine origin is to RECEIVE THE BIBLE AS A REVELATION in a national way. The immediate effect of this is that it constitutes the State a Christian State, and pledges it to purge out its previous religion in the same way as Pagan and Mahommedan nations constituted themselves, according to their false religions, or as the atheistic state was constituted, or rather attempted to be constituted, by the French Convention. A nation must have a religion, and the only question is, which it will adopt. And when Christianity comes to the nation, or to the family, it does not frown on either of these institutions, which also are divine in origin, but enters into them with an elevating purifying power, and sweetly coalesces with all that is purely human in both. These ordinances of God now became vessels by which Christianity is diffused. The national recognition of the Bible as a revelation subjecting the nation to its authority, though a great step gained, does not exhaust the nation’s duty, as widely diverging views prevail upon the right interpretation of the Bible. The State must by the necessity of the case ADOPT A CREED which will commonly be prepared by the Church. The same duty that devolves upon an individual Christian confronts a Christian State, and it naturally appends the civil sanction to the Church’s creed. It must distinguish between scripture truth and its perversion. The State, by the adoption of a creed, gives utterance to the self-consciousness of a Christian community. It confesses the Christianity it has adopted.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/george-smeaton.html">George Smeaton</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Scottish Theory of Ecclesiastical Establishments and How Far the Theory is Realised (1875)</cite>, pp. 4-5</span></figcaption>

national+recognition+of+the+Bible+as+a+revelation+subjecting+the+nation+to+its+authority%2C+though+a+great+step+gained%2C+does+not+exhaust+the+nation%E2%80%99s+duty%2C+as+widely+diverging+views+prevail+upon+the+right+interpretation+of+the+Bible.+The+State+must+by+the+necessity+of+the+case+ADOPT+A+CREED+which+will+commonly+be+prepared+by+the+Church.+The+same+duty+that+devolves+upon+an+individual+Christian+confronts+a+Christian+State%2C+and+it+naturally+appends+the+civil+sanction+to+the+Church%E2%80%99s+creed.+It+must+distinguish+between+scripture+truth+and+its+perversion.+The+State%2C+by+the+adoption+of+a+creed%2C+gives+utterance+to+the+self-consciousness+of+a+Christian+community.+It+confesses+the+Christianity+it+has+adopted.%E2%80%9D%0A%0A%E2%80%94+George+Smeaton%2C+The+Scottish+Theory+of+Ecclesiastical+Establishments+and+How+Far+the+Theory+is+Realised+%281875%29%2C+pp.+4-5&amp;url=https%3A%2F%2F5solasquotes.github.io%2Fquote%2Fbf60db601c.html&amp;via=5Solas" target="_blank" rel="noopener">Share on X</a><a class="perma" href="../quote/bf60db601c.html">Permalink</a><a class="src" href="https://reformedbooksonline.com/topics/topics-by-subject/civil-government/church-state-relations/the-establishment-principle/#:~:text=The%20State%2C%20considered%20in%20its%20corporate,confesses%20the%20Christianity%20it%20has%20adopted&amp;text=The%20State%2C%20considered%20in%20its%20corporate%20character%2C%20is&amp;text=community.%20It%20confesses%20the%20Christianity%20it%20has%20adopted" rel="noopener" target="_blank">Read it online · Reformed Books Online</a></div>

<blockquote><p>The immediate reason for the rewriting of the earlier manuscript [of Lex Rex by S. Rutherford] was the publication, in January 1644, of a royalist treatise, Sacro-Sancta Regum Majestas… Its author was John Maxwell, the deposed ‘Canterburian’ Bishop of Ross and one of the major architects of the notorious Scottish Prayer Book. Rutherford found this treatise by an old enemy deeply provocative, and over the winter, spring and summer of 1644, he spent much of his free-time away from the Westminster Assembly writing a detailed refutation… Maxwell had written his book because he felt that it was appropriate for a divine to put the case for absolutism, since it had already been convincingly argued by eminent lawyers like Bodin and Barclay, and since it was so strongly supported by Scripture and Christian tradition. Rutherford clearly could not let this go unchallenged. The natural-law contractualism of the Scottish-parliamentarian alliance needed to be defended by a theologian.” – Coffey, Politics, Religion, pp. 148-49 Reformed Christian Politics: “In the seventeenth century, divine-right absolutists like Roger Mainwaring and John Maxwell were Arminian in their theology. Though this seems counterintuitive, Arminian doctrine is consistent with divine-right political theory, as it allows them to affirm God’s active role in establishing kings without violating human free will. Kingship, for them, comes not by determined providence according to divine concurrence, but rather in a special, divine act that has occurred above and apart from human action. God’s choice to make a man king could not be actualized via, or in, man’s choosing, for that would violate free will (that is, it would require Calvinist views of divine sovereignty). Nor could they say that God makes a man king subsequent to man’s choosing, for that would deny God’s active role in the choosing. Instead, God chooses one man to be king, and that man is, thereby, king, and God requires the people to obey him as such. God is active, and the people are passive. Indeed, Rutherford, in Lex, Rex, blamed John Maxwell’s divine absolutism on his Arminianism. In Reformed political doctrine, on the contrary, both God and man are active in the making of one man as king, and even in determining the political form of the commonwealth.</p></blockquote>

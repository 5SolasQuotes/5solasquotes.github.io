<main class="wrap"><figure class="quote" id="q-9bcc86ec04" data-kw="condemnation wrath conscience">
<blockquote><p>(c) For condemnation, when it denounces upon the convicted sinner the divine malediction by the dreadful sentence which it thunders in his ears: “Cursed is he who continues not.” Hence the apostle calls it “the ministration of condemnation” (2 Cor. 3:9), and he says that “it worketh wrath” (Rom. 4:15) and then it is like a whip, tormenting and scourging the conscience guilty of sin.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/francis-turretin.html">Francis Turretin</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Institutes of Elenctic Theology</cite>, 11.22.9</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/the-law-of-god/uses-of-the-law.html">Uses of the Law</a> › <a href="../topics/the-law-of-god/uses-of-the-law/second-use-pedagogical-and-condemning.html">Second use (pedagogical and condemning)</a></span><span class="t"><a href="../topics/the-law-of-god/law-in-general.html">Law in General</a> › <a href="../topics/the-law-of-god/law-in-general/the-law-and-conscience.html">The law and conscience</a></span></div>

— Francis Turretin, Institutes of Elenctic Theology, 11.22.9">Copy</button><a class="share" href="https://x.com/intent/post?text=%E2%80%9C%28c%29%20For%20condemnation%2C%20when%20it%20denounces%20upon%20the%20convicted%20sinner%20the%20divine%20malediction%20by%20the%20dreadful%20sentence%20which%20it%20thunders%20in%20his%20ears%3A%20%E2%80%9CCursed%20is%20he%20who%20continues%20not.%E2%80%9D%20Hence%20the%20apostle%20calls%20it%20%E2%80%9Cthe%20ministration%20of%20condemnation%E2%80%9D%20%282%20Cor.%203%3A9%29%2C%20and%20he%20says%20that%20%E2%80%9Cit%20worketh%20wrath%E2%80%9D%20%28Rom.%204%3A15%29%20and%20then%20it%20is%20like%20a%20whip%2C%20tormenting%20and%20scourging%20the%20conscience%20guilty%20of%20sin.%E2%80%9D%0A%0A%E2%80%94%20Francis%20Turretin%2C%20Institutes%20of%20Elenctic%20Theology%2C%2011.22.9&amp;url=https%3A%2F%2F5solasquotes.github.io%2Fquote%2F9bcc86ec04.html&amp;via=5Solas" target="_blank" rel="noopener">Share on X</a><a class="perma" href="../quote/9bcc86ec04.html">Permalink</a><span class="src none">No free online copy linked</span></div>
</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-ca815d96e5" data-kw="uses absolute relative rule">
<blockquote><p>A twofold use of the law may be laid down—absolute and relative. The former regards the law in itself; the latter regards the law in relation to the various states of man. The absolute (which obtains in every state of man) is that it may be a unique, full and certain rule of things to be done and avoided by each of us as well towards God as his neighbor. Thus there is no work truly and properly good and acceptable to God which does not agree with the law and is not prescribed by it.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/francis-turretin.html">Francis Turretin</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Institutes of Elenctic Theology</cite>, 11.22.2</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/the-law-of-god/uses-of-the-law.html">Uses of the Law</a> › <a href="../topics/the-law-of-god/uses-of-the-law/third-use-guide-for-believers.html">Third use (guide for believers)</a></span><span class="t"><a href="../topics/the-law-of-god/law-in-general.html">Law in General</a> › <a href="../topics/the-law-of-god/law-in-general/moral-ceremonial-and-judicial-law.html">Moral, ceremonial and judicial law</a></span></div>

</figure><figure class="quote" id="q-3a2e559560" data-kw="believer obedience not punishment">
<blockquote><p>In the state of grace, it binds the believer only to obedience, not to punishment because there is no condemnation to those who are in Christ (Rom. 8:1), whose transgressions are forgiven (Ps. 32:1). Rather the question concerns the state of sin—whether in it the sinner is bound to both (which we assert). First, from the twofold condition of sinful man, who is both a creature and a sinful creature. As a creature, he owes to God obedience forever and never can be discharged from it. As a sinner, he owes punishment.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/francis-turretin.html">Francis Turretin</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Institutes of Elenctic Theology</cite>, 11.22.12–13</span></figcaption>

</figure><figure class="quote" id="q-d867ceb0c2" data-kw="">
<blockquote><p>The law was once our foe when it came to our justification. But now the law is our friend when it comes to our sanctification.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/daniel-hyde.html">Daniel Hyde</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Quoted on X by @Tabletalk</cite>, Oct 25, 2018</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/the-law-of-god/uses-of-the-law.html">Uses of the Law</a> › <a href="../topics/the-law-of-god/uses-of-the-law/second-use-pedagogical-and-condemning.html">Second use (pedagogical and condemning)</a></span><span class="t"><a href="../topics/the-law-of-god/uses-of-the-law.html">Uses of the Law</a> › <a href="../topics/the-law-of-god/uses-of-the-law/third-use-guide-for-believers.html">Third use (guide for believers)</a></span><span class="t"><a href="../topics/the-law-of-god/law-and-gospel.html">Law and Gospel</a> › <a href="../topics/the-law-of-god/law-and-gospel/distinction.html">Distinction</a></span></div>

— Daniel Hyde, Quoted on X by @Tabletalk, Oct 25, 2018">Copy</button><a class="share" href="https://x.com/intent/post?text=%E2%80%9CThe+law+was+once+our+foe+when+it+came+to+our+justification.+But+now+the+law+is+our+friend+when+it+comes+to+our+sanctification.%E2%80%9D%0A%0A%E2%80%94+Daniel+Hyde%2C+Quoted+on+X+by+%40Tabletalk%2C+Oct+25%2C+2018&amp;url=https%3A%2F%2F5solasquotes.github.io%2Fquote%2Fd867ceb0c2.html&amp;via=5Solas" target="_blank" rel="noopener">Share on X</a><a class="perma" href="../quote/d867ceb0c2.html">Permalink</a><a class="src" href="https://x.com/Tabletalk/status/1055431788015816704" rel="noopener" target="_blank">Read it online · X</a></div>
</figure><figure class="quote" id="q-f9e83fa791" data-kw="schoolmaster lead to Christ">
<blockquote><p>In the restored state of grace, it has a varied use with respect to the elect, both before and after their conversions. Antecedently, it serves (a) to convince and humble man so that (his own misery and weakness being felt) he despairs of himself and renounces confidence in his own righteousness and merit and rests upon the mercy of God alone. (b) To lead men to Christ, not indeed primarily and by itself (because the law does not know Christ), but by the accident of grace, inasmuch as it impels man (cast down and despairing of his own strength) to seek the remedy of saving grace. Under this relation, it is called by Paul “a schoolmaster” unto Christ (Gal. 3:24) and Christ is called “the end of the law” (Rom. 10:4).</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/francis-turretin.html">Francis Turretin</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Institutes of Elenctic Theology</cite>, 11.22.10</span></figcaption>

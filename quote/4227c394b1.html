<main class="wrap"><figure class="quote" id="q-4227c394b1" data-kw="">
<blockquote><p>The minister hath his nets to take withal, the magistrate hath his traps. The first is the net of God’s word to cast into the sea for fishes, or to set upon the land for foxes. Preach the word, be instant in season and out of season. The Law of the Lord converteth souls.

With this net John Baptist caught at one time a great number of foxes, Scribes, Pharisees, Publicans, soldiers and sinners: they came confessing their sins, and asking, What shall we do? Peter cast out this net and in one Sermon brought three thousand unto Christ. With this net at Caesarea he took Cornelius the captain with a great multitude. Paul by spreading this net gate huge numbers in Asia, in Africa, in Europe, in all parts and quarters of the world.

Christ himself with this net took so many that they said, Behold the whole world goeth after him. Philip took the Eunuch in this net; in the same net Lidia, Dionysius, Paulus Sergius was caught. Ambrose set this net for Augustine &amp; took him in it.

Verily if this net were diligently set, it would catch these cubs apace. For they err, because they know not the scriptures; and they cannot know, because they are not taught. Woe therefore to the idle and Idol pastor, to the dumb dog, to the unpreaching minister. For the blood of all these that perish for lack of taking through his negligence shall be required at his hands.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/edwin-sandys.html">Edwin Sandys</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Sermons made by the Most Reverend Father in God, Edwin, Archbishop of York, Primate of England and Metropolitan</cite>, (London: Henry Midleton, 1585), pp 59-60.</span></figcaption>

</figure><figure class="quote" id="q-9d211e2e14" data-kw="">
<blockquote><p>But because sculpture and painting are gifts of God, I seek a pure and legitimate use of each… We believe it wrong that God should be represented by a visible appearance, because He Himself has forbidden it [Ex. 20:4] and it cannot be done without some defacing of his glory… Therefore it remains that only those things are to be sculptured or painted which the eyes are capable of seeing… Within this class some are histories and events, some are images and forms of bodies without any depicting of past events. The former have some use in teaching or admonition; as for the latter, I do not see what they can afford other than pleasure. And yet it is clear that almost all the images that until now have stood in churches were of this [latter] sort. From this, one may judge that these images had been called forth not out of judgment or selection but of foolish and thoughtless craving.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/john-calvin.html">John Calvin</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Institutes of the Christian Religion</cite>, bk. 1, ch. 11, sect. 12 (Battles)</span></figcaption>

<blockquote><p>As Emmanuel, he honoured the Sabbath, and consecrated it anew. By his glorious resurrection, at the completion of his second creation, in view of which it may be said that the first had no glory, by “reason of the glory that excelleth,” he re-enacted the law of the Sabbath, and fortified it by the most sublime and overpowering sanctions. And thus it became his anew and afresh. “All things were given to him then in heaven and in earth,” and then did he acquire a right and a power to wield all things for his people’s good and his enemies’ destruction, more glorious than he ever had before. And most assuredly, among “the all things in heaven and in earth,” the Sabbath, which, as it were, descends from heaven and alights on earth, so partaking of the character of both, holds a most conspicuous place.

As Son of Man he acquired a lordship over the Sabbath; and while this enhances his people’s safety here and glory hereafter, it awfully provides for the condemnation of his impenitent foes. And how terribly, and we might say, how easily, will he draw from it this most awful consequent. “All authority will be given to him to execute judgment, because he is the Son of Man;” and he will not forget, as an instrument in his judgments, the very Sabbath over which, for this same reason also – namely, that he is the Son of Man – he obtained this mysterious lordship. He will draw it forth from the elements of a forgotten history. The Sabbath, at the command of Christ, and reverencing the lordship which the Son of Man claims over it, will stand forth as accuser of his enemies.

They may plead that “they were very much immersed in this world’s cares and labours; – in the sweat of their brow they had to earn their bread; – time was not found by them to examine and accord to him the claims which, while they were in the flesh, Christ put in for their love and service; – their daily wants engrossed the labour of their hands; – the claims of their children occupied their thoughts; – and the short span of three score years and ten ran on with rapid flight, and there was not time for God to be in all their thoughts.” Ah! But what have they to answer to the silent witness which stands ready to record his testimony against them – the holy Sabbath! The holy Sabbath regularly came to them – the day of rest, expressly made for man, gave him liberty and rest from all his worldly cares. Granted that the world’s bustle and continual din of business, and rapid flight of ever-changing scenes, hurried away men’s thoughts from God – the Sabbath, in its weekly visit, brought with it a peace and a freedom from them all.

The morning of the blessed Sabbath came always to them, with its stillness and its hushed silence, and by that very silence spoke more loudly than words of the God whom, for six busy days at least, they had entirely forgotten. They complained of labour; but the Sabbath proclaimed their freedom from it. They complained of noise and agitation; but the Sabbath brought its quiet and stillness. They complained of the distractions of the world; but the Sabbath protruded on them – forced on their attention the things of God. Ah! what shall the answer be? “Every mouth shall be stopped,” and the holy Sabbath, which was given as a means of their salvation, in very proportion to the glory to which it offered to advance them, will loudly proclaim and irretrievably seal their utter condemnation, and visibly represent Jesus as clear when he judgeth, and justified when he speaketh forth their doom.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/hugh-martin.html">Hugh Martin</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Sabbath made for Man: A Sermon Preached in the Free Church, Panbride, on February 2, 1845. In Accordance with the Recommendation of the General Assembly</cite>, (Dundee: McCosh, 1845), pp 11-12.</span></figcaption>

stand+forth+as+accuser+of+his+enemies.%0A%0AThey+may+plead+that+%E2%80%9Cthey+were+very+much+immersed+in+this+world%E2%80%99s+cares+and+labours%3B+%E2%80%93+in+the+sweat+of+their+brow+they+had+to+earn+their+bread%3B+%E2%80%93+time+was+not+found+by+them+to+examine+and+accord+to+him+the+claims+which%2C+while+they+were+in+the+flesh%2C+Christ+put+in+for+their+love+and+service%3B+%E2%80%93+their+daily+wants+engrossed+the+labour+of+their+hands%3B+%E2%80%93+the+claims+of+their+children+occupied+their+thoughts%3B+%E2%80%93+and+the+short+span+of+three+score+years+and+ten+ran+on+with+rapid+flight%2C+and+there+was+not+time+for+God+to+be+in+all+their+thoughts.%E2%80%9D+Ah%21+But+what+have+they+to+answer+to+the+silent+witness+which+stands+ready+to+record+his+testimony+against+them+%E2%80%93+the+holy+Sabbath%21+The+holy+Sabbath+regularly+came+to+them+%E2%80%93+the+day+of+rest%2C+expressly+made+for+man%2C+gave+him+liberty+and+rest+from+all+his+worldly+cares.+Granted+that+the+world%E2%80%99s+bustle+and+continual+din+of+business%2C+and+rapid+flight+of+ever-changing+scenes%2C+hurried+away+men%E2%80%99s+thoughts+from+God+%E2%80%93+the+Sabbath%2C+in+its+weekly+visit%2C+brought+with+it+a+peace+and+a+freedom+from+them+all.%0A%0AThe+morning+of+the+blessed+Sabbath+came+always+to+them%2C+with+its+stillness+and+its+hushed+silence%2C+and+by+that+very+silence+spoke+more+loudly+than+words+of+the+God+whom%2C+for+six+busy+days+at+least%2C+they+had+entirely+forgotten.+They+complained+of+labour%3B+but+the+Sabbath+proclaimed+their+freedom+from+it.+They+complained+of+noise+and+agitation%3B+but+the+Sabbath+brought+its+quiet+and+stillness.+They+complained+of+the+distractions+of+the+world%3B+but+the+Sabbath+protruded+on+them+%E2%80%93+forced+on+their+attention+the+things+of+God.+Ah%21+what+shall+the+answer+be%3F+%E2%80%9CEvery+mouth+shall+be+stopped%2C%E2%80%9D+and+the+holy+Sabbath%2C+which+was+given+as+a+means+of+their+salvation%2C+in+very+proportion+to+the+glory+to+which+it+offered+to+advance+them%2C+will+loudly+proclaim+and+irretrievably+seal+their+utter+condemnation%2C+and+visibly+represent+Jesus+as+clear+when+he+judgeth%2C+and+justified+when+he+speaketh+forth+their+doom.%E2%80%9D%0A%0A%E2%80%94+Hugh+Martin%2C+The+Sabbath+made+for+Man%3A+A+Sermon+Preached+in+the+Free+Church%2C+Panbride%2C+on+February+2%2C+1845.+In+Accordance+with+the+Recommendation+of+the+General+Assembly%2C+%28Dundee%3A+McCosh%2C+1845%29%2C+pp+11-12.&amp;url=https%3A%2F%2F5solasquotes.github.io%2Fquote%2Fea3de9d2ba.html&amp;via=5Solas" target="_blank" rel="noopener">Share on X</a><a class="perma" href="../quote/ea3de9d2ba.html">Permalink</a><a class="src" href="https://reformedcovenanter.wordpress.com/2021/06/27/hugh-martin-on-the-implications-of-christs-lordship-over-the-sabbath-for-the-impenitent/" rel="noopener" target="_blank">Read it online · Reformed Covenanter</a></div>
</figure><figure class="quote" id="q-19b096a9df" data-kw="">
<blockquote><p>Although the oath which Joshua and the princes of Israel made to the Gibeonites was made unadvisedly, and without asking counsel from the mouth of the Lord, yet, some hundred years after, being broken, that breach brought a national judgment, till justice was done upon the offenders. How much more may a national judgment be feared, if even in our days the contempt and violation of a most lawful and sacred oath be winked at? Surely God will not wink at their sin who wink at his dishonour. Better not to have vowed than not to pay and perform.</p></blockquote>

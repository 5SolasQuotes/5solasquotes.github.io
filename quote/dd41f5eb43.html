<main class="wrap"><figure class="quote" id="q-dd41f5eb43" data-kw="">
<blockquote><p>(6) That the law does not obligate to what is impossible. I respond, It does not obligate to what is impossible simpliciter, simply, by nature, to man as he is a man, apart from his fault, such as, for example, flying, but it obligates to what is impossible secundum quid [according to which], relatively, by man’s own contumacy, to man as he is a sinner (Rom. 8:3).</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/petrus-van-mastricht.html">Petrus van Mastricht</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Theoretical Practical Theology</cite>, (RHB), vol. 3, bk. 4; ch. 3, ‘Actual Sin’, section 21, p. 505</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/free-will-and-inability/liberty-and-necessity.html">Liberty and Necessity</a></span></div>

</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-e47b07299f" data-kw="">
<blockquote><p>41. Potency involves some imperfection if it is understood in the sense of subjective or objective potency (potential being) [see pp. 51-52] or of passive or obediential potency [see pp. 52-53]; but not if it is understood as: the possible is opposed to the impossible. The point is plain from the definitions of these potencies; for all these potencies adduced before agree in that they express the capacity of receiving some real perfection, and so that which is said to be in this sort of potency is in itself perfectible and hence in some way imperfect. Actual being on the contrary does not involve imperfection. The same must be said of the logically possible and of active potency¹ [that these do not involve imperfection]. ¹ [The importance here is because the First Cause (i.e. God) has no passive potency, or capability to be acted upon or effected, but has all active potency, that is, to act upon others. This is not special pleading for God, but is plainly necessary for what a First Cause must be. See ‘On the Distinction Between Passive Power (Denied) &amp; Active Power (Affirmed) About God’.]</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/allan-b-wolter.html">Allan B. Wolter</a></span><span class="wk"><span class="lbl">Work:</span> <cite>‘Allan Wolter’s Conclusions respecting Reality, Proving God’</cite>, (1958), ‘Conclusions respecting Reality’</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/free-will-and-inability/liberty-and-necessity.html">Liberty and Necessity</a></span></div>
<div class="actions"><button class="copy" data-copy="“41. Potency involves some imperfection if it is understood in the sense of subjective or objective potency (potential being) [see pp. 51-52] or of passive or obediential potency [see pp. 52-53]; but not if it is understood as: the possible is opposed to the impossible. The point is plain from the definitions of these potencies; for all these potencies adduced before agree in that they express the capacity of receiving some real perfection, and so that which is said to be in this sort of potency is in itself perfectible and hence in some way imperfect. Actual being on the contrary does not involve imperfection. The same must be said of the logically possible and of active potency¹ [that these do not involve imperfection]. ¹ [The importance here is because the First Cause (i.e. God) has no passive potency, or capability to be acted upon or effected, but has all active potency, that is, to act upon others. This is not special pleading for God, but is plainly necessary for what a First Cause must be. See ‘On the Distinction Between Passive Power (Denied) &amp; Active Power (Affirmed) About God’.]”

%20if%20it%20is&amp;text=Power%20%28Denied%29%20%26%20Active%20Power%20%28Affirmed%29%20About%20God" rel="noopener" target="_blank">Read it online · Reformed Books Online</a></div>
</figure><figure class="quote" id="q-06f3f3f09c" data-kw="">
<blockquote><p>XXII. Therefore although the unregenerate can do nothing but sin, they nevertheless do it freely since they perform the exercise of the act in such a way that they could not perform it, and are in some way masters of their acts. However, regarding the species [type of act] they are determined since they can do nothing but sin, and have evil under the pretext of good as their object…</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/francis-gomarus.html">Francis Gomarus</a></span><span class="wk"><span class="lbl">Work:</span> <cite>‘Theological Disputation on Free Will’</cite>, (Leiden: Patius, 1603), trans. AI</span></figcaption>

<blockquote><p>§XVI. In the prestituted state or the State of Glory, the blessed will be free even from misery itself and from the sense or root of sin. Concerning which state Augustine in his Enchiridion, ch. 105, says: “free will will be much more free, because it will be altogether unable to serve sin.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/barthold-holtzfus.html">Barthold Holtzfus</a></span><span class="wk"><span class="lbl">Work:</span> <cite>‘Theological Dissertation on Creation’</cite>, trans. AI by Nosferatu (Frankfurt: Zeitler, 1707), p. 27 Latin</span></figcaption>

</figure><figure class="quote" id="q-ddacbd6460" data-kw="">
<blockquote><p>Free will, in the sense of those [errorists] who maintain it, is [said to be] a power in the will to incline either way, when that which is supernatural and saving is offered as its object; a power and freedom in the will to choose or refuse, to yield or resist, to embrace or reject, as it list. So that this with them is twofold: … 2. To choose, or embrace. The will, they [errorists] say, can incline to that which is spiritually and supernaturally good. They speak not of a capacity, which is not denied, but of an active power. A natural man, by the power of his will, as he can reject Christ, so he can embrace Him; as he can resist converting grace, so he can yield to it as he will; the will can incline itself to this as well as to the other. This is a true representation of their opinion in the other branch of it. Against which we say…</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/david-clarkson.html">David Clarkson</a></span><span class="wk"><span class="lbl">Work:</span> <cite>‘Man’s Insufficiency to do Anything of Himself’, on John 15:5, in The Works of David Clarkson</cite>, vol. 2, p. 128-29</span></figcaption>

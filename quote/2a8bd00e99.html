<main class="wrap"><figure class="quote" id="q-2a8bd00e99" data-kw="">
<blockquote><p>Whether relations are in God unto creatures, e.g. Creator, Lord, etc.: It is affirmed by Ockam and Gabriella, 1. d. 30, q. 5; Durand, q. 3; Marsil. 1. q. 32, art. 1; Gregory of Rimini, 1. d. 28, q. 3, art. 1; Peter Hurtad. It is denied by Thomists, but it is a dispute about a name, as notes Vasquez in 1 Tho. q. 13, art. 7, ‘For there is, indeed, no new foundation on the part of God, but on the part of the creature. Therefore the Thomists call the relation a relatio rationis [relation of reason].&#x27;</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/richard-baxter.html">Richard Baxter</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Catholic Theology Plain, Pure, Peaceable, for pacification of the dogmatical Word-Warriors who</cite>, (London: White, 1675), sect. 4, ‘Of God’s Relations to the Creature &amp; Denominations (thereupon) in his Power, Knowledge &amp; Will’, p. 8, margin note</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/attributes-of-god/affections-and-passions-in-god.html">Affections and Passions in God</a></span></div>

</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-c1d9e3c658" data-kw="">
<blockquote><p>Again, it is asked about what is said, “And God is called angry; but there is no anger in Him.” For He seems to speak wrongly, because in God there is a rational and a concupiscible power: therefore by equal reason an irascible power must be posited in God: therefore just as the act of cognition and love is truly in Him, so properly is the act of fury. I answer: It must be said that the irascible [power] in some way sounds of imperfection by the definition of its name; and therefore some say that it is in no way received in God, not even transumptively. However, since the acts of this power in us are to glory and to dominate, and these are in God; why not similarly this power? And it must be said therefore that in God there is truly this power of glorying and dominating, which is the divine substance itself. However, because anger has a passion conjoined to it by the definition of its name, therefore neither the irascible [power] nor anger is received in God, except transumptively and in tropical speech. And it is to be noted that God has signs of anger, not which signify anger in Him, but which signify anger in us and truly, when they are in us.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/bonaventure.html">Bonaventure</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Commentary on the Sentences</cite>, (d. 1274), bk. 1, dist. 45, Doubt 10 tr. AI by The Faith Received</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/attributes-of-god/affections-and-passions-in-god.html">Affections and Passions in God</a></span></div>

<blockquote><p>The absolute goodness of God, as it is the excellency of his nature, is the object of praise: the relative goodness of God, as He is our benefactor, is the object of thankfulness.</p></blockquote>

</figure><figure class="quote" id="q-973f800a2f" data-kw="">
<blockquote><p>The will of God is also to be viewed in the light of the various ‘affections’ attributed to God. these ‘affections’ are, in man, termed emotions or passions and are associated with human weakness and mutability. In relation to God, however, the ‘affections’: ‘do not designate any passions or emotions, nor are to be understood as diverse divine wills, for this would imply mutation in God, but as acts of the same will, indicating its different relations.’ (Pictet, Theol. chr. I.vii.1) Of course, the immutability of God, like his being unmoved, describes a God who is also actus purus [pure act]: thus neither concept indicates a divine immobility or quiescence.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/richard-muller.html">Richard Muller</a></span><span class="wk"><span class="lbl">Work:</span> <cite>PRRD</cite>, (Baker, 2003), vol. 3, pt. 2, ch. 5.4, D. The ad intra Distinctions, p. 454</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/attributes-of-god/affections-and-passions-in-god.html">Affections and Passions in God</a></span></div>

</figure><figure class="quote" id="q-3c63f3338a" data-kw="">
<blockquote><p>Hence the movement of anger has a twofold tendency: viz. to vengeance itself, which it desires and hopes for as being a good, wherefore it takes pleasure in it; and to the person on whom it seeks vengeance, as to something contrary and hurtful, which bears the character of evil.</p></blockquote>

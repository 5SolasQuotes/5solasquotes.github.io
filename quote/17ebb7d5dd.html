<main class="wrap"><figure class="quote" id="q-17ebb7d5dd" data-kw="">
<blockquote><p>We say that the said good works are pleasing and acceptable to God, and indeed have their reward from God, yet not a reward of any preceding merit properly so-called, which would have either an equality with the prize of eternal life, or even a proportion to it; but a reward that is only gracious, resting on the benignity and mercy of God.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/samuel-ward.html">Samuel Ward</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Theological Determinations in Works of Samuel Ward… ed. Seth Ward (d. 1643; Gallibrand, 1658) | ‘Good Works have a gracious promise of reward’, pp. 194-97</cite>, p. 194</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/judgment-and-the-final-state/heaven-and-eternal-glory.html">Heaven and Eternal Glory</a></span></div>

</figure><figure class="quote" id="q-80e7476069" data-kw="">
<blockquote><p>The Reformed acknowledge that Christ truly died, and therefore the natural union of the body and soul was taken away for those three days, and hence he was also certainly a dead man, but yet he was also a man in the true and proper sense, because otherwise: [Mastricht gives eight Scriptural and theological reasons]… If they should allege to the contrary that with the union of the essential parts of the body and soul taken away, a man in the true and proper sense would not survive, then I would grant that, with all union of those parts taken away, a man in the true and proper sense would not survive, but since, in agreement with all Christians, in the incarnation a twofold union was procured by the Holy Spirit—one natural, through which he was a living man, and the other personal, through which the same person was not only God but also man—when the former ceases, nevertheless the latter remains. So then, because the essential parts of man in death were not deprived of all union (as ordinarily occurs in the dead, who for this reason are also not men, except equivocally), but only the union that makes a living man, we conclude that he nevertheless throughout the three days of his death and burial remained a man in the true and proper sense.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/petrus-van-mastricht.html">Petrus van Mastricht</a></span><span class="wk"><span class="lbl">Work:</span> <cite>3. ‘Was Christ during the three days of his death and burial a true man?’ in Theoretical Practical Theology (RHB), vol. 4, bk. 5, ch. 13, Polemical Part, §XIII</cite>, pp. 466-68</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/judgment-and-the-final-state/heaven-and-eternal-glory.html">Heaven and Eternal Glory</a></span></div>
<div class="actions"><button class="copy" data-copy="“The Reformed acknowledge that Christ truly died, and therefore the natural union of the body and soul was taken away for those three days, and hence he was also certainly a dead man, but yet he was also a man in the true and proper sense, because otherwise: [Mastricht gives eight Scriptural and theological reasons]… If they should allege to the contrary that with the union of the essential parts of the body and soul taken away, a man in the true and proper sense would not survive, then I would grant that, with all union of those parts taken away, a man in the true and proper sense would not survive, but since, in agreement with all Christians, in the incarnation a twofold union was procured by the Holy Spirit—one natural, through which he was a living man, and the other personal, through which the same person was not only God but also man—when the former ceases, nevertheless the latter remains. So then, because the essential parts of man in death were not deprived of all union (as ordinarily occurs in the dead, who for this reason are also not men, except equivocally), but only the union that makes a living man, we conclude that he nevertheless throughout the three days of his death and burial remained a man in the true and proper sense.”

</figure><figure class="quote" id="q-7879f4cc76" data-kw="">
<blockquote><p>The most studied source for Gerald Odonis’ doctrine of the beatiﬁc vision is the text of his Advent 1333 disputed question known as his Quodlibet. The polemic nature of the question and its structural idiosyncrasies have led to diﬃculties in interpreting Odonis’ theory of the ‘middle vision’ of the divine essence that the separate souls of the blessed have, as well as in understanding his defense of Pope John XXII’s controversial opinion [that saints do not enjoy the complete Beatific Vision till after the Final Judgment] (which excludes such a middle vision). By relating Odonis’ 1333 disputation to his earlier commentary on the Sentences… this paper shows how Odonis tried to ﬁt his doctrine of the ‘middle vision’ with his previous discussion…</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/william-duba.html">William Duba</a></span><span class="wk"><span class="lbl">Work:</span> <cite>‘The Beatific Vision in the Sentences Commentary of Gerald Odonis’ Vivarium 47 (2009)</cite>, pp. 348-63</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/judgment-and-the-final-state/heaven-and-eternal-glory.html">Heaven and Eternal Glory</a></span></div>

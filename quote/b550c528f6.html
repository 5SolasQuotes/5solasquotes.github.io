<main class="wrap"><figure class="quote" id="q-b550c528f6" data-kw="God not depend on man">
<blockquote><p>It is absurd for the Creator to depend upon the creature, God upon man and the will of God (the first cause of all things) upon the things themselves. But this must be the case if the decrees of God are suspended on any condition in man.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/francis-turretin.html">Francis Turretin</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Institutes of Elenctic Theology</cite>, 4.3.4</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/reprobation/reprobation-and-the-free-offer.html">Reprobation and the Free Offer</a> › <a href="../topics/reprobation/reprobation-and-the-free-offer/command-and-ability-distinguished.html">Command and ability distinguished</a></span><span class="t"><a href="../topics/election/conditional-election.html">Conditional Election</a> › <a href="../topics/election/conditional-election/election-on-foreseen-faith.html">Election on foreseen faith</a></span></div>

</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-14ba01d57f" data-kw="Hardening Justice">
<blockquote><p>God certainly does not in either case effect or infuse blindness or hardness into the sinner (cf. James 1:13–14), yet neither does he only not take away blindness and hardness, by not circumcising the heart (Jer. 6:10, 26; Acts 7:51), or by not conferring spiritual light to the mind, or softness and malleability to the heart (Matt. 13:14–15; Isa. 6:9–10), but in addition: (1) on account of preceding sins, in a just and holy way, he takes away or diminishes the remnants of wisdom and moral goodness that a sinner has, and also augments and aggravates his original blindness and hardness.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/petrus-van-mastricht.html">Petrus van Mastricht</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Theoretical-Practical Theology</cite>, Vol. 3, bk. 3, ch. 10 (Providence), §20</span></figcaption>

</figure><figure class="quote" id="q-c93c333fae" data-kw="Hardening Satan Justice">
<blockquote><p>God is said to blind and to harden men not only negatively (by not enlightening and softening) and privatively (by withdrawing his grace whatever it may have been after men have abused it) and permissively (by not hindering), but also positively. Not by bringing in blindness or hardness (which is natural to man), but both objectively by presenting external objects to them which although ordained to another direction by their own nature, yet he knows will be drawn in a different way by their vice; and judicially by smiting them internally with blindness (the light which they abused being taken away or extinguished); and by loosening the reins to their lusts and delivering them up and enslaving them to Satan.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/francis-turretin.html">Francis Turretin</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Institutes of Elenctic Theology</cite>, 6.7.28</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/reprobation/hardening.html">Hardening</a> › <a href="../topics/reprobation/hardening/judicial-hardening.html">Judicial hardening</a></span></div>

</figure><figure class="quote" id="q-643aef881b" data-kw="preceptive will gospel offer">
<blockquote><p>Conditional promises and threatenings do not favor conditional decrees because they do not pertain to the decreeing will, but to the preceptive will and are appendages to the divine commands, added to stimulate and excite men. … Hence such promises and threats show only the necessary connection of the condition with the thing conditioned, but involve no futurition of the thing.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/francis-turretin.html">Francis Turretin</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Institutes of Elenctic Theology</cite>, 4.3.10</span></figcaption>

</figure><figure class="quote" id="q-692bfa9027" data-kw="Hardening Holy Spirit">
<blockquote><p>God may be said to cause men to err from his ways, and to harden their hearts from his fear, by withholding, upon their provocation, some such supply of his Spirit and actings of his grace as they have formerly enjoyed, to keep up their hearts to the ways and in the fear of God.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/john-owen.html">John Owen</a></span><span class="wk"><span class="lbl">Work:</span> <cite>God&#x27;s Withdrawing His Presence, the Correction of His Church</cite>, sermon on Isa. 63:17, 1675</span></figcaption>

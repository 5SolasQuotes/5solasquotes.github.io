<main class="wrap"><figure class="quote" id="q-cf8d9e31f7" data-kw="">
<blockquote><p>Its a wide mistake that a presbyterian Church has its formal essence from a voluntary, actual combination in such bounds, or such a circuit more or less. That is not a pillar of presbyterian Churches. For their near association, by dwelling where they may edify or scandalize one another, gives them right to be an associated Church; not simply habitation, but the habitation of such and such professors in covenant with God, baptized and giving themselves up in profession to Christ as disciples, before there be a formal consent, they are obliged to associate: yea, nor does that voluntary combination make a presbyterial Church.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/samuel-rutherford.html">Samuel Rutherford</a></span><span class="wk"><span class="lbl">Work:</span> <cite>A Survey of the Survey of that Sum of Church-Discipline Penned by Mr. Thomas Hooker</cite>, … wherein the way of the churches of N. England is now re-examined (London, 1658), p. 190</span></figcaption>

</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-d9f8a261cc" data-kw="">
<blockquote><p>…when the Gospel is come to a people, if the question be, what gives to this man, not to this man true real right to membership, and ordinances, and seals, so as he may claim them before God and not sin: the meritorious right is Christ’s death, the condition upon his part is faith; hence visible profession as such cannot give right… Profession is in order to the rulers and members of the Church, which have hand according to their place, either formal or tacit consent, to receive in members… the question is, what profession is required in such as the rulers may without sin admit to membership and ordinances; we say a profession morally true, not real conversion judged to be real by men. Now this confession or profession doth not make a Church-member, but declare a Church-member, and it only declares him to the conscience of the rulers, that they sin not in admitting such: but declares him neither to have right before God nor to his own conscience. Yea, for all this profession [Simon] Magus sinned in being baptized, Magus usurped, and hath no true and real right, no not ecclesiastic, except in a most unproper sense; [yet] the Church hath right and command to receive him to member membership and seals…</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/samuel-rutherford.html">Samuel Rutherford</a></span><span class="wk"><span class="lbl">Work:</span> <cite>A Survey of the Survey of that Sum of Church-Discipline Penned by Mr. Thomas Hooker</cite>, Book 1, ch. 22, ‘Whether profession makes a member of the Church visible?’ in A Survey of the Survey of that Sum of Church-Discipline Penned by Mr. Thomas Hooker (1658), p. 123</span></figcaption>

quote/d9f8a261cc.html">Permalink</a><a class="src" href="https://reformedbooksonline.com/topics/topics-by-subject/the-church/church-membership#:~:text=when%20the%20Gospel%20is%20come%20to,him%20to%20member%20membership%20and%20seals&amp;text=when%20the%20Gospel%20is%20come%20to%20a%20people&amp;text=to%20receive%20him%20to%20member%20membership%20and%20seals" rel="noopener" target="_blank">Read it online · Reformed Books Online</a></div>
</figure><figure class="quote" id="q-916cd650fe" data-kw="">
<blockquote><p>Also it is said, Acts 2:47, ‘God added to the Church daily such as should be saved’; which was not a particular congregational church, but the catholic. For it is not probable that those hundred and twenty that were together at Pentecost were one congregational church, for many of them were men of Galilee, which by their habitation could not pertain to the Church in Jerusalem, and yet the rest were added to them. … Again Eph. 4:4-5, the apostle proves the Church to be but one by diverse arguments. First he says, ‘There is but one body’ of Christ… Secondly, there is but one Spirit in that whole body, which is as one soul in one body. Thirdly, there is but one hope of their calling. Fourthly, there is but one Lord or King over the whole Church. Fifthly, there is but one Faith, i.e. one religion, doctrine, worship, the same commands and statutes for all. Sixthly, There is but one baptism to admit into this Church. Now if the whole world were under one King, and governed by one Law, and all capable of the same privileges, and all made denizons by the same way of enrollment, it would make but one empire; yet so it is with all the Churches in the world: they have the same King, Law, Word, sacraments, of admission and nutrition, which they visibly subject themselves unto and receive; therefore they are all one visible Church.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/samuel-hudson.html">Samuel Hudson</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Essence &amp; Unity of the Church, catholic, visible: and the Priority thereof in regard of Particular Churches Discussed</cite>, (London, 1645), pp. 16-17</span></figcaption>

</figure><figure class="quote" id="q-3f44fc0ca5" data-kw="">
<blockquote><p>As your baptism makes you members of the universal Church, in order of nature before you are members of a particular church, so your relation to the universal Church is more noble, more necessary and more durable than your relation to any particular church. It is more noble, because the society is more noble. The whole is more excellent than a little part: It is more necessary because you cannot be saved and be Christians without being members of the universal Church: But you may be Christians and be saved without being a member of any stated particular church. It is more durable because you can never separate from the universal Church or cease to be a member of it without being separated from Christ: but diverse occasions may warrant your removal from a particular church. Live not therefore in those narrow and dangerous principles as if your congregation or your party were all the Church of Christ, or as if you had no Christian relation to any other ministers or people, nor owed any duty to them as members of the same Body. But remember that all Christians, persons and congregations are but the members of the Kingdom of Christ.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/richard-baxter.html">Richard Baxter</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Cure of Church Divisions</cite>, … (London, 1670), pt. 1, Direction 18, ‘Understand well the necessity of your Communion with all the Universal Church, and wherein it consists, and how far to be preferred before your Communion with any particular Church’, pp. 115-18</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/the-church/church-membership.html">Church Membership</a></span></div>

<blockquote><p>1st Conclusion. An adjoining to a visible Church either formally to be a member thereof, or materially, confessing the Faith of the true visible Church, God offering occasion, is necessary to all: 1. Because we are to be ready to give a confession of the hope that is in us, to every one who asks, 1 Pet. 3:15. 2 Because he who denies Christ before men, him also will Christ deny before the Father and before the holy angels, Mt. 10:33. 3. Yet if some die without the Church, having faith in Christ, and want opportunity to confess Him before men, as repenting in the hour of death, their salvation is sure, and they are within the invisible Church: so is that to be taken, extra Ecclesiam nulla salus, none can be saved who are every way without the Church, both visible and invisible; as all perished who were not in Noah’s Ark. 2nd Conclusion. When God offers opportunity, all are obliged to join themselves to a true visible Church: 1. Because God has promised his presence to the Churches as his Son walks in the midst of the golden candlesticks, Rev. 2:2. 2. Because faith comes by hearing a sent preacher, Rom. 10:4. 3. Separation from the true visible Church is condemned, Heb. 10:24; Jude v. 19; 1 Jn. 2:19. 4. Good men esteem it a rich favour of God to lay hold on the skirt of a Jew, Zech. 8:23, and to have any communion, even as a door keeper in God’s House, and have desired it exceedingly and complained of the want thereof, Ps. 84:10. v. 1-2; Ps. 27:4; Ps. 42:1-4; Ps. 63:1-2.</p></blockquote>

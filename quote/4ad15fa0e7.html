<main class="wrap"><figure class="quote" id="q-4ad15fa0e7" data-kw="">
<blockquote><p>Heaven is that place alone where is to [be] obtained our highest end, and highest good. God hath made us for himself: “of God, and through God, and to God are all things” (Romans 11:36). Therefore then do we attain to our highest end, when we are brought to God. But that is by being brought to heaven, for that is God’s throne; that is the place of his special presence, and of his glorious residence. There is but a very imperfect union with God to be had in this world: a very imperfect knowledge of God in the midst of abundance of darkness, a very imperfect conformity to God, mingled with abundance of enmity and estrangement. Here we can serve and glorify God but in an exceeding imperfect manner, our service being mingled with much sin and dishonouring to God.

But when we get to heaven, if ever that be, there we shall be brought to a perfect union with God. There we shall have the clear views of God’s glory: we shall see face to face, and know as we are known [1 Corinthians 13:12]. There we shall be fully conformed to God, without any remains of sin: “we shall be like him; for we shall see him as he is” [1 John 3:2]. There we shall serve God perfectly. We shall glorify him in an exalted manner, and to the utmost of the powers and capacity of our nature. Then we shall perfectly give up ourselves to God; then will our hearts be wholly a pure and holy offering to God, offered all in the flame of divine love.

In heaven alone is attainment of our highest good. God is the highest good of the reasonable creature. The enjoyment of him is our proper happiness, and is the only happiness with which our souls can be satisfied. To go to heaven, fully to enjoy God, is infinitely better than the most pleasant accommodations here: better than fathers and mothers, husbands, wives, or children, or the company of any or all earthly friends. These are but shadows; but God is the substance. These are but scattered beams; but God is the sun. These are but streams; but God is the fountain. These are but drops; but God is the ocean.

Therefore, it becomes us to spend this life only as a journey towards heaven, as it becomes us to make the seeking of our highest end, and proper good, the whole work of our lives; and we should subordinate all the other concerns of life to it. Why should we labour for anything else, or set our hearts on anything else, but that which is our proper end, and true happiness?</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/jonathan-edwards.html">Jonathan Edwards</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The True Christian’s Life a Journey Towards Heaven</cite>, (1734) in Mark Valeri (ed.), Sermons and Discourses, 1730-1733: The Works of Jonathan Edwards Volume 17 (New Haven CN: Yale University Press, 2000), pp 437-38.</span></figcaption>

<blockquote><p>People often object to reprobation on the basis that it makes no sense for God to create men in order to damn them. W. G. T. Shedd argued that this objection has missed the point because God’s ultimate end in election and reprobation was his own glory:

When God saves a sinner, the attribute of mercy is glorified. When he leaves a sinner in sin and punishes him, the attribute of justice is glorified. Neither salvation nor damnation are ultimate ends, but means to an ultimate end; namely, the manifested glory of the triune God. To exhibit justice is honourable to God, as well as to exhibit mercy.</p></blockquote>

<blockquote><p>As many professing Christians in the United States are about to reject the crown rights of Jesus Christ over them at the ballot-box in order to vote for a Mormon anti-christ (on the pretext that he is the lesser of two evils), Samuel Rutherford gives us the following timely reminder of the need for civil rulers to bow before the King of kings:

Then grace makes rich men parliament men, and there is a wide difference between a public man, and a public spirit. All parliament men are public men, but they are not all public spirits, else so many of them would not have deserted the public, and run away from Christ’s colours, to seek their own private idols. Men void of grace make an idol of themselves; every wicked man is wholly himself, and wholly his own; they all seek their own, not the things of Jesus Christ (Phil. 2:21). He who is for the Bridegroom, cannot be against the Bride, nor against the commonwealth. He who is a statesman of heaven, and knows savingly the fundamental laws of Jesus Christ, the power, and prerogative royal of the King of Kings; he who is acquainted with the frame and constitution of the kingdom of sin, in his own heart; he who fears God, who fears his own light, and is awed with the decrees and laws of an enlightened conscience, shall be fast for the public. And the man who sells his religion and his soul for his private ends, will soon sell his country, his parliament, the laws and liberties of the kingdom. Will he put the law of God, and the crown and sceptre of that princely Lord Jesus to the market, and will he stick, for his court and honour, to sell the laws of England, and will he forfeit heaven, and will he not forfeit you all, and your Parliament and liberties?</p></blockquote>

<div class="actions"><button class="copy" data-copy="“As many professing Christians in the United States are about to reject the crown rights of Jesus Christ over them at the ballot-box in order to vote for a Mormon anti-christ (on the pretext that he is the lesser of two evils), Samuel Rutherford gives us the following timely reminder of the need for civil rulers to bow before the King of kings:

— Samuel Rutherford, A sermon preached to the honourable House of Commons at their late solemn fast, Wednesday, January 31, 1643/44 in Chris Coldwell (ed.), Sermons preached before the English Houses of Parliament by the Scottish commissioners to the Westminster Assembly of divines">Copy</button><a class="share" href="https://x.com/intent/post?text=%E2%80%9CAs+many+professing+Christians+in+the+United+States+are+about+to+reject+the+crown+rights+of+Jesus+Christ+over+them+at+the+ballot-box+in+order+to+vote+for+a+Mormon+anti-christ+%28on+the+pretext+that+he+is+the+lesser+of+two+evils%29%2C+Samuel+Rutherford+gives+us+the+following+timely+reminder+of+the+need+for+civil+rulers+to+bow+before+the+King+of+kings%3A%0A%0AThen+grace+makes+rich+men+parliament+men%2C+and+there+is+a+wide+difference+between+a+public+man%2C+and+a+public+spirit.+All+parliament+men+are+public+men%2C+but+they+are+not+all+public+spirits%2C+else+so+many+of+them+would+not+have+deserted+the+public%2C+and+run+away+from+Christ%E2%80%99s+colours%2C+to+seek+their+own+private+idols.+Men+void+of+grace+make+an+idol+of+themselves%3B+every+wicked+man+is+wholly+himself%2C+and+wholly+his+own%3B+they+all+seek+their+own%2C+not+the+things+of+Jesus+Christ+%28Phil.+2%3A21%29.+He+who+is+for+the+Bridegroom%2C+cannot+be+against+the+Bride%2C+nor+against+the+commonwealth.+He+who+is+a+statesman+of+heaven%2C+and+knows+savingly+the+fundamental+laws+of+Jesus+Christ%2C+the+power%2C+and+prerogative+royal+of+the+King+of+Kings%3B+he+who+is+acquainted+with+the+frame+and+constitution+of+the+kingdom+of+sin%2C+in+his+own+heart%3B+he+who+fears+God%2C+who+fears+his+own+light%2C+and+is+awed+with+the+decrees+and+laws+of+an+enlightened+conscience%2C+shall+be+fast+for+the+public.+And+the+man+who+sells+his+religion+and+his+soul+for+his+private+ends%2C+will+soon+sell+his+country%2C+his+parliament%2C+the+laws+and+liberties+of+the+kingdom.+Will+he+put+the+law+of+God%2C+and+the+crown+and+sceptre+of+that+princely+Lord+Jesus+to+the+market%2C+and+will+he+stick%2C+for+his+court+and+honour%2C+to+sell+the+laws+of+England%2C+and+will+he+forfeit+heaven%2C+and+will+he+not+forfeit+you+all%2C+and+your+Parliament+and+liberties%3F%E2%80%9D%0A%0A%E2%80%94+Samuel+Rutherford%2C+A+sermon+preached+to+the+honourable+House+of+Commons+at+their+late+solemn+fast%2C+Wednesday%2C+January+31%2C+1643%2F44+in+Chris+Coldwell+%28ed.%29%2C+Sermons+preached+before+the+English+Houses+of+Parliament+by+the+Scottish+commissioners+to+the+Westminster+Assembly+of+divines&amp;url=https%3A%2F%2F5solasquotes.github.io%2Fquote%2F7c64a93bd8.html&amp;via=5Solas" target="_blank" rel="noopener">Share on X</a><a class="perma" href="../quote/7c64a93bd8.html">Permalink</a><a class="src" href="https://reformedcovenanter.wordpress.com/2012/11/04/samuel-rutherford-on-the-statesmen-of-heaven-and-political-idolaters/" rel="noopener" target="_blank">Read it online · Reformed Covenanter</a></div>

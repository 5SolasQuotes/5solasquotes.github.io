<main class="wrap"><figure class="quote" id="q-d25bfdbd6b" data-kw="">
<blockquote><p>…a man may be a schismatic, forsaking communion with a true Church, and yet not be an heretic, in as much as he may rightly believe all the articles of the Faith. … Other divisions there are which are with separation, when men shall withdraw themselves from fellowship and communion with a true Church, so breaking themselves off from the body. And this (says our judicious [William] Ames)¹ by way of special appropriation, deserves most rightly to be called by the name of ‘schism’: in as much as heresy in this division is perfected and brought to a head, as also most clearly manifested, and declared, viz. in refusing of due Church-communion. ¹ Quia autem haec scissio maxime perficitur et apparet in debita communione Ecclesiastica recusanda, idcirco illa separatio per appropriationem singularium recte vocatur Schisma [But because this division is chiefly brought about and becomes evident in the refusing of due ecclesiastical communion, therefore that separation, by the appropriating of things to oneself, is rightly called ‘schism’]. Ames, Cases of Conscience on Schism Which refusal may be either partial, or total. Partial, in some particular acts and exercises, wherein a man cannot (or at least conceives he cannot) communicate without sin. Total, a rejecting, and renouncing of all religious communion. This latter all divines look upon as a schism, and that most properly so called. Which (again) may be either from the Church, or from a Church. From the Church catholic, the whole Church. That was properly Donatism (the direct error of the Seekers at this day): Or from a particular Church; and that is properly Separatism.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/john-brinsley.html">John Brinsley</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Arraignment of the Present Schism of New Separation in old England</cite>, (London: Field, 1646), pp. 14-15</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/the-church/church-unity-and-fundamentals.html">Church Unity and Fundamentals</a></span></div>

<blockquote><p>Bucer believed that in a face-to-face dialogue it would be easierto persuade one’s opponents of the truth… Bucer knew well that written documents were subjected to differing interpretations. His preference for public dialogue also influenced many of his written works, which adopted the literary genre of a fictional dialogue. In these works, he would exemplify how men of differing opinions could peaceably and gradually arrive at agreement on the truth. This gradual approach was illustrative of his pedagogy for persuading and teaching others the truth of God’s word… As Stupperich has asserted, for Bucer unity would result not from compromise but from the clarification of misunderstandings that enable a unity in the truth.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/brian-lugioyo.html">Brian Lugioyo</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Martin Bucer’s Doctrine of Justification: Reformation Theology &amp; Early Modern Irenicism</cite>, (Oxford Univ. Press, 2010) 260 pp. ToC, p. 23</span></figcaption>

</figure><figure class="quote" id="q-13cadfdfe6" data-kw="">
<blockquote><p>To conclude this, separation from Churches, from which Christ does not separate, is schismatical; now it’s clear in the Scripture that Christ owns churches where faith is sound for the substance, and their worship, Gospel-worship, though there be many defects and sinful mixtures among them. And what I have said concerning the schismaticalness of separation because of the sinful mixtures of those who are wicked in practice, is as true concerning separation from them who are erroneous in judgment; if the errors of those from whom the separation is made, be not fundamental, and hinder communion with Christ the head. And much more clear (if clearer can be) is the schismaticalness of those who separate from and renounce all communion with those churches which are not of their own manner of constitution and modelled according to the platform of their own particular church-order. To refrain fellowship and communion with such Churches who profess Christ their Lord, whose faith is sound, whose worship is Gospel-worship, whose lives are holy, because they come not into that particular way of church-order which we have pitched upon, is a schismatical rending of the Church of Christ to pieces… Herein likewise those separatists among ourselves are heinously faulty who censure and condemn all other churches, though their faith, worship and conversation be never so scriptural, merely because they are not gathered into church order according to their own patterns. In Scripture, Churches are commended and dignified, according as their fundamental faith was sound and their lives holy; not according to the regularity of their first manner of gathering.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/william-jenkyn.html">William Jenkyn</a></span><span class="wk"><span class="lbl">Work:</span> <cite>An Exposition of the Epistle of Jude</cite>, ... (London: Maxey, 1654), on verse 19, Observations, p. 593</span></figcaption>

</figure><figure class="quote" id="q-5c87d81f26" data-kw="">
<blockquote><p>The catholic or universal visible Church is the assembly of all those which make profession of the Gospel of Jesus Christ throughout the whole world, distinguished (as we have said) into many particular Churches, all which do make but one body. Of all these particular, as members and parts of one and the self-same body, some are pure, other some are impure, some more, and some less sound, and some at this day are sick even unto death… Those that are of the purer and sounder Churches, we call them sound and true Churches, consenting to the true doctrine, which is the name, that for the most part, the ancient fathers have given them. The others we call the erring, heretical or schismatical Churches, according as they err, either in faith or in charity, against the square and right rule of Christ, or against the rule of his Church, either in the one or in the other, notwithstanding every one in his degree.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/philip-mornay.html">Philippe de Mornay</a></span><span class="wk"><span class="lbl">Work:</span> <cite>A Notable Treatise of the Church in which are handled all the Principal Questions that have been moved in our Time concerning that matter</cite>, [in controversy with Romanism] (London: Barker, 1579), ch. 2, n.p.</span></figcaption>

<blockquote><p>The grand case of the Christian world is, What is the true center and rule of concord? Could they find out this, it would hold men of various tempers to it.

I. Christ first laid down the description and measure of Christianity: In the baptismal Covenant; and ordained that all should be accounted Christians in foro Ecclesiae who by baptism were solemnly devoted to Him, in a professed belief and Covenant, dedication and vow to God the Father, Son and Holy Ghost: These he would have called Christians or his disciples, and this is their Christening, and so ever called in the Church.

      2. And next He made it his new (that is Last) and Great Command that all his disciples should love each other [Jn. 13:34], and live in eminent unity and peace [Acts 2:41-47]: which He accordingly wrought them to by the first pouring out of his Spirit, Acts 2-4.

II. The apostles founding the Church in this baptismal vow or Covenant and mutual love, exhorted accordingly all the baptized to love each other, and to receive even the weak in faith, but not to doubtful disputations, Rom. 14-15, oft vehemently charging them to be of one mind [Phil. 2] and live in love and peace [2 Cor. 13:11; Gal. 5:22; Eph. 6:23; 1 Thess. 5:13; Jude 1:2], and to beware of them as not serving Christ but their own bellies [Phil. 3:19], who were for divisions, 1 Cor. 1:10-11; Rom. 16:17. And though they came with pretences of order, wisdom or piety, such good words and fair speeches were noted to be engines to deceive the hearts of the simple, Rom. 16:17[-18]. And whereas the objection seemed unanswerable: How can they so agree, who are of several judgements about good and evil? Paul often warns them to hold fast the form of sound words, and sums up (as 1 Cor. 15:1-4) the articles of their Faith, and charges them that so far as they had attained, they should walk by the same rule, and mind the same things, and if in any thing they were otherwise minded, stay till God revealed the matter to them, Phil. 3[:15-16]. He oft charges them to be of one mind and judgement (thus far) and to live in love and peace, and to do nothing by strife and vain glory, but in honor to prefer others to themselves [Rom. 12:10]; and not to strive about words that profit not [2 Tim. 2:14], nor about unnecessary questions, seeing such disputings and strivings gender to ungodliness [1 Tim. 1:4; 6:4; 2 Tim. 2:23], and fret like a canker, and pervert the hearers minds: Yea he directs the pastors to edify souls rather by a teaching than a disputing way [Rom. 14:1; Phil. 2:14; 1 Tim. 6:5], and to convince gainsayers, by meek instructing opposers, to see if thus God will give them repentance to the acknowledgement of the truth [2 Tim. 2:25]: for the minister or servant of the Lord must not strive [2 Tim. 2:24]; Love is their work to be effected in others, and love must be their principle, and love must be their mode and means, even loving others as themselves: Oft are they called by Christ and his apostles from masterly opinions, aspirings and endeavors, and to be as little children [Mt. 18:3-4]; and the servants of all, and as stewards of Gods mysteries and helpers, not lords of the Church’s faith, and not to domineer over the flock of Christ, but to oversee them not by constraint but voluntarily: And what cannot be done by light and love, is not to be done by them at all: The magistrate and not they, must use the sword; but not to make men believers (for he cannot). … And the certain truth is, that he knows neither the interest nor the ignorance and weakness of man, nor the nature of knowledge, who does not know that the frailty and employments of mankind are such as that there never will be an universal concord in very many, or uncertain, unnecessary things; And O that I could write it on all men’s hearts, or doors at least, that the Christian world will never have concord but in a few, certain, necessary things. Therefore Paul said to the Corinthians, 2 Cor. 11:2-3: ‘I am jealous of you with godly jealousy: For I have espoused you to one husband, etc. But I fear lest by any means, as the Serpent beguiled Eve through his subtilty, so your minds should be corrupted from the simplicity that is in (or towards) Christ.’ O mark these words all ye contentious Church-tyrants, dogmatists and superstitious ones. Read and study them well. God laid down the terms of the Church’s concord in seven unities:

      1. One Body or Church-catholic; [Eph. 4:4]

      2. One Spirit or Holy Ghost, as the soul of that Church; [Eph. 4:4]

      3. One hope, or heavenly felicity hoped for; [Eph. 4:4]

      4. One Lord of the Church, our Head and Savior; [Eph. 4:5]

      5. One Faith, or creed, or symbol of our belief, and belief thereof; [Eph. 4:5]

      6. One baptismal Covenant; [Eph. 4:5]

      7. And one God and Father of us all [Eph. 4:6], who is above all, through all and in us all. Eph. 4:3-6. And it is the unity of the Spirit in the bond of peace, that on these terms we are charged to keep, [Eph. 4] vv. 2-3, with all lowliness and meekness, with long-suffering, forbearing one another in love. [Eph. 4:2] But now [in 2 Cor. 11:3] comes the Serpent (note 1. the author) and by subtilty (2. note the means) even as he beguiled Eve (3. Note the precedent) which was by promising her more knowledge and exaltation to be as God; and he corrupts men’s minds, (4. mark the effect), though it is knowledge and advancement of mind that he promises and pretends: Even by drawing them (as to higher Power, Knowlege or Holiness) from the Christian simplicity (5. mark what the corruption of religion is). And what is this Christian Simplicity which they forsake, and how are they thus corrupted from it?…</p></blockquote>

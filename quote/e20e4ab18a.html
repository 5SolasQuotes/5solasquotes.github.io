<blockquote><p>The Lord now and then takes a few, and picks them up through the nations where they are scattered; they were all of the same mass, of the same lump, lying in the same pit; Peter was no better than Judas, nor Judas any worse than Peter; Cain was no worse than Abel, and Abel was no better than Cain, till grace made the difference; when they were in the same womb at the same time, yet, says the Lord, ‘Jacob have I loved, and Esau have I hated.</p></blockquote>

<blockquote><p>1. According to my ordering of the decrees divine: In no moment of nature or reason is the decree of damnation precedent to the decree of permitting infidelity, or leaving the infidelity of some men uncured, to wit, by denying them faith, by denying the grace of regeneration. But the decrees of creating all in Adam, of permitting all to fall in Adam, in bringing all men forth into the world in the state of original sin, of leaving this original sin uncured in them, and last of all, of damning them for their sins; are decrees not subordinate, but coordinate, as decrees de mediis [of means, or middle things], tending jointly to one supreme end, which is the manifestation of God’s glory upon them in the way of justice-vindicative, as also to show the riches of his glory upon the vessels of mercy whom He has prepared unto glory (Rom. 9:22), to wit, by beholding in others that miserable condition, which through God’s mere grace and goodness they have escaped. 2. According to the Contra-Remonstrants [Anti-Arminians] tenet, I answer: 1. Many of them do not maintain that infidelity is consequent to the decree of damnation, but in the foresight of God, precedent rather: as appears by the British [delegation of] divines [to the Synod of Dort], their Theses de Reprobatione; and Alvarez professes the same. The denial of grace, and so the permitting of natural infidelity to remain uncured, they make consequent (as it seems) to a negative decree of denying glory. And to the decree of permitting infidelity, they make the foresight of infidelity subsequent; and this foresight of infidelity they make precedent to reprobation, as it signifies the decree of damnation. And thus far I agree with them, that in no moment of nature, or sign of reason did God ordain any man to damnation, but for sin; and consequently in no moment of nature, or sign of reason, did the decree of damnation go before the foresight of sin or infidelity.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/william-twisse.html">William Twisse</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Riches of God’s Love unto the Vessels of Mercy, consistent with his Absolute Hatred or Reprobation of the Vessels of Wrath… (Oxford: L.L., 1653), pt. 1, ‘The Discourse Itself’</cite>, p. 69</span></figcaption>

<blockquote><p>Sovereignty is a comprehensive term. It contains several elements. First it denotes supremacy. A sovereign ruler is supreme in his dominions. All other rulers are under him. Secondly, sovereignty denotes independence. Says Woolsey, ‘In the intercourse of nations certain states have a position of entire independence of others. They have the power of self-government, that is, of independence of all other states as far as their own territory and citizens are concerned. This power of independent action in external and internal relations constitutes complete sovereignty.’ (Political Science, i., 204) Thirdly, sovereignty denotes optional power; that is, the power to act or not in a given instance. It is more particularly with reference to this latter characteristic of free alternative decision, that ‘the sovereignty of God in election’ is spoken of. In his election of a sinner to salvation, God as supreme, independent, and sovereign, acts with entire liberty of decision, and not as obliged and shut up to one course of action. This is the common understanding and definition of sovereignty as applied to decisions and acts. Says Blackstone [one of the most influential writers on English law]: ‘By the sovereign power is meant the power of making laws; for wherever that power resides all other powers must conform to, and be directed by it, whatever appearance the outward form and administration of the government may put on. For it is at any time in the option of the legislature to alter that form and administration by a new edict or rule, and put the execution of the law into whatever hands it pleases, by constituting one, or a few, or many executive magistrates.’ (Introduction, 2) Blackstone gives the same definition of sovereignty, when it is vested in a king (Book II., ch. vii.). The king has no superior to oblige or compel him to one course of action. He has independent and optional power.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/william-shedd.html">William Shedd</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Calvinism: Pure &amp; Mixed (1893; Banner of Truth, 1993)</cite>, pp. 70-71</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/election/nature-of-election.html">Nature of Election</a></span></div>

<blockquote><p>III. The third article [of difference between the Reformed and Lutherans] is that concerning predestination, which began to be controverted after Luther’s time, perhaps on the occasion of certain theologians who, asserting gratuitous predestination, sought out the mode and order of the signs of reason and of the divine acts perhaps more deeply than sacred Scripture, and than was fitting; and they use harsher forms of speaking. I plainly think that it can be explained in that mode and order according to the Scriptures, Augustine, and the article of our [Anglican] Church, as the late most reverend [John] Overall [d. 1619] explained it, so that I may easily hope that the more moderate Lutherans can be brought to our opinion, especially if they will not refuse to stand by Luther’s tenets in his book On the Bondage of the Will against Erasmus, and in his Annotations on the 9th chapter of Romans. From what has been said, it can be somewhat established that the Reformed Churches [including Lutherans] do not dissent in the fundamentals of faith.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/samuel-ward.html">Samuel Ward</a></span><span class="wk"><span class="lbl">Work:</span> <cite>‘The Reformed Churches do not Dissent in the Fundamentals of Faith’ in Theological Determinations in Works of Samuel Ward… ed. Seth Ward trans. AI (d. 1643; Gallibrand, 1658)</cite>, pp. 152-53</span></figcaption>

<div class="actions"><button class="copy" data-copy="“III. The third article [of difference between the Reformed and Lutherans] is that concerning predestination, which began to be controverted after Luther’s time, perhaps on the occasion of certain theologians who, asserting gratuitous predestination, sought out the mode and order of the signs of reason and of the divine acts perhaps more deeply than sacred Scripture, and than was fitting; and they use harsher forms of speaking. I plainly think that it can be explained in that mode and order according to the Scriptures, Augustine, and the article of our [Anglican] Church, as the late most reverend [John] Overall [d. 1619] explained it, so that I may easily hope that the more moderate Lutherans can be brought to our opinion, especially if they will not refuse to stand by Luther’s tenets in his book On the Bondage of the Will against Erasmus, and in his Annotations on the 9th chapter of Romans. From what has been said, it can be somewhat established that the Reformed Churches [including Lutherans] do not dissent in the fundamentals of faith.”

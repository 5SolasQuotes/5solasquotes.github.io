<blockquote><p>Nevertheless we, the people of these Confederate States, distinctly acknowledge our responsibility to God, and the supremacy of His Son, Jesus Christ, as King of Kings and Lord of Lords; and hereby ordain that no law shall be passed by the Congress of these Confederate States inconsistent with the will of God, as revealed in the Holy Scriptures.</p></blockquote>

</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-3b0779f7e3" data-kw="">
<blockquote><p>6. As morality and piety, rightly grounded on evangelical principles, will give the best and greatest security to government, and will lay in the hearts of men the strongest obligations to due subjection: and as the knowledge of these, is most likely to be propagated through a society by the institution of the public worship of the Deity, and of public instruction in morality and religion: therefore, to promote those important purposes, the people of this state have a right to impower, and do hereby fully impower the legislature to authorize form time to time, the several towns, parishes, bodies-corporate, or religious societies within this state, to make adequate provision at their own expense, for the support and maintenance of public protestant teachers of piety, religion and morality:</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/new-hampshire.html">State of New Hampshire</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Constitution of New Hampshire</cite>, 1784 (Thorpe, 4.2454, 2460)</span></figcaption>

</figure><figure class="quote" id="q-810bf8d936" data-kw="">
<blockquote><p>But we read not” (says Erastus) “where Christ has changed those laws in the New Testament.” It is true, Christ has not said in particular: “I abolish the debarring of the leper seven days, and he that is thus and thus unclean shall be separated till the evening;” nor has He said particularly of every carnal ordinance and judicial law: “it is abolished.” But we conceive the whole bulk of the Judicial Law, as judicial, and as it concerned the republic of the Jews only, is abolished, though the moral equity of all those be not abolished… … But sure Erastus errs who will have all such to be killed by the magistrate under the New Testament because they were killed by him in the Old: Why, but then the whole judicial law of God shall oblige us Christians as Carolostadius and others teach? I humbly conceive that the putting of some to death in the Old Testament, as it was a punishment to them [the malefactors], so was it a mysterious teaching of us how God hated such and such sins; and mysteries of that kind are gone with other shadows.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/samuel-rutherford.html">Samuel Rutherford</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Other citations (work not named)</cite>, ed. Travis Fentiman, ‘Samuel Rutherford on the Judicial Laws of Moses: Excerpts Arranged Topically’, pp. 4-6, 23 | Divine Right of Church Government (1646), pp. 383, 493-94</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/civil-government-and-society/church-and-state.html">Civil Government and Society: Church and State</a></span></div>

m/#:~:text=But%20we%20read%20not%E2%80%9D%20%28says%20Erastus,kind%20are%20gone%20with%20other%20shadows&amp;text=But%20we%20read%20not%E2%80%9D%20%28says%20Erastus%29%20%E2%80%9Cwhere%20Christ&amp;text=of%20that%20kind%20are%20gone%20with%20other%20shadows" rel="noopener" target="_blank">Read it online · Reformed Books Online</a></div>

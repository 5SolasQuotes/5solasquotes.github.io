<main class="wrap"><figure class="quote" id="q-967c5827ae" data-kw="">
<blockquote><p>2. Under the Old Testament the particular churches in the synagogues entered not into any solemn church-covenant in the admission of members: but only on extraordinary occasions, when they had made defection from God, all the faithfull of the whole national Church renewed their covenant with God, for restoring the decayed worship of God; or when they were by some other necessity called upon for renewing such a covenant.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/apollonius.html">Apollonius</a></span><span class="wk"><span class="lbl">Work:</span> <cite>A Consideration of Certain Controversies at this Time Agitated in the Kingdom of England, concerning the Government of the Church of God (1645), ch. 2, ‘Of a Church-Covenant’ Apollonius was a Dutch presbyterian.</cite>, p. 18</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/the-church/church-membership.html">Church Membership</a></span></div>
<div class="actions"><button class="copy" data-copy="“2. Under the Old Testament the particular churches in the synagogues entered not into any solemn church-covenant in the admission of members: but only on extraordinary occasions, when they had made defection from God, all the faithfull of the whole national Church renewed their covenant with God, for restoring the decayed worship of God; or when they were by some other necessity called upon for renewing such a covenant.”

</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-c548ce00e1" data-kw="">
<blockquote><p>2. A second way of your communion of [congregationalist] churches, is, ‘By way of recommendation, as Paul in the behalf of Phoebe, etc.’ But this is so far from being any part of the power of the keys that it is a duty which a church or party owe to any Christian that is godly, not by virtue of any particular church-membership, but by the common interest of Christianity, yea, by the common right of humanity, even to an honest heathen, according to the Ninth Commandment, which requires us to bear true witness to our brother if we be thereto required. The letters are only declarative, of the good behaviour of the party, occasioned to remove to such a place. Was this (think you) a part of the power of the keys delivered to Peter and the rest of the apostles? Besides, if there be any virtue in these letters, to admit a member into communion, is there not a like virtue in them to excommunicate one ungodly? And if these letters dimissory have power to admit a member of one church to be a member of another, without any new covenanting, have they not the like power to admit the pastor of one church, to be a pastor of another Church, without any new ordination? which yet, I believe, you do not practice.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/daniel-cawdrey.html">Daniel Cawdrey</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Vindiciæ Clavium: or, A Vindication of the Keys of the Kingdom of Heaven, into the Hands of the Right Owners… (1645), ch. 4, ‘Of the Subject of Church-Liberty’, p. 41 Cawdrey (1588–1664) was a presbyterian Westminster divine.</cite></span></figcaption>
<div class="meta"><span class="t"><a href="../topics/the-church/church-membership.html">Church Membership</a></span></div>

</figure><figure class="quote" id="q-7e8a050495" data-kw="">

</figure><figure class="quote" id="q-3f53e00f4c" data-kw="">
<blockquote><p>3. We grant that there may be an express and solemn covenant, in the presence of God and the Church, upon extraordinary occasions, entered into, by all the members of the visible Church of one nation or kingdom: when the Church in that kingdome or nation has made defection from God and his worship, or some other necessity call for it; for the preserving, or propagating, or restoring of the decayed worship of God. By which covenant notwithstanding there does not acrue to the Church of that kingdom any new right, but that right which before they had to enjoy the ordinances of God, which by reason of their defection, or some other cause, was hindered and as it were suspended, they may now freely and purely again reduce to practise. Thus did the Church of God under the Old Testament often in the time of defection, or extraordinary necessity, enter into a solemn covenant in the presence of God.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/apollonius.html">Apollonius</a></span><span class="wk"><span class="lbl">Work:</span> <cite>A Consideration of Certain Controversies at this Time Agitated in the Kingdom of England, concerning the Government of the Church of God (1645), ch. 2, ‘Of a Church-Covenant’ Apollonius was a Dutch presbyterian.</cite>, pp. 15-16</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/the-church/church-membership.html">Church Membership</a></span></div>
<div class="actions"><button class="copy" data-copy="“3. We grant that there may be an express and solemn covenant, in the presence of God and the Church, upon extraordinary occasions, entered into, by all the members of the visible Church of one nation or kingdom: when the Church in that kingdome or nation has made defection from God and his worship, or some other necessity call for it; for the preserving, or propagating, or restoring of the decayed worship of God. By which covenant notwithstanding there does not acrue to the Church of that kingdom any new right, but that right which before they had to enjoy the ordinances of God, which by reason of their defection, or some other cause, was hindered and as it were suspended, they may now freely and purely again reduce to practise. Thus did the Church of God under the Old Testament often in the time of defection, or extraordinary necessity, enter into a solemn covenant in the presence of God.”

></div>
</figure><figure class="quote" id="q-ddc2983088" data-kw="">
<blockquote><p>1. But come we to your [congregationalist] particulars: First, ‘by way of participation of the Lord’s Supper, the members of one church coming to another church, etc.’ But: 1. Why do you instance in this ordinance only? Have not their children, occasionally born there, a liberty also of baptisme? The rather, because baptism is not administred with respect to this or that church, but to the general visible Church: Unless you hold that a man or child is baptized to no church but that particular, and [is] an infidel to all the rest. Yet some of your brethren will hardly baptize a child of any but a member of their own church, which is next door to Anabaptism. … …4. But your reason I like very well: ‘For we receive the Lord’s Supper, not only as a seal of our communion with the Lord Jesus, and with his members in our own church, but also in all the churches of the saints’: Whence I infer, then, it is not any favour dispensed by you to a member of another church, but a dignity or privilege common to every member of that body, by virtue of that membership, and not with respect to his particular church membership. And I pray, is not baptism also a seal of our communion with all the members of Christ’s body? Why then may you not admit the children of the members of any church to be baptized by your pastors upon just occasion, as well as to admit the parents to the Lord’s Supper? Nay further: If the sacraments be seals of our communion with all the members of Christ, why do you not admit any true Christian, and his children, to the communion of the sacraments, though they be not as yet admitted members of any particular congregation? How dare you deny any member of that Body communion with its fellow-members, when it has union and communion with the Head? Consider it.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/daniel-cawdrey.html">Daniel Cawdrey</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Vindiciæ Clavium: or, A Vindication of the Keys of the Kingdom of Heaven, into the Hands of the Right Owners. Being some Animadversions upon a Tract of Mr. John Cotton’s… (1645), ch. 4, pp. 39-41 Cawdrey was an English presbyterian and Westminster divine.</cite></span></figcaption>
<div class="meta"><span class="t"><a href="../topics/the-church/church-membership.html">Church Membership</a></span></div>
<div class="actions"><button class="copy" data-copy="“1. But come we to your [congregationalist] particulars: First, ‘by way of participation of the Lord’s Supper, the members of one church coming to another church, etc.’ But: 1. Why do you instance in this ordinance only? Have not their children, occasionally born there, a liberty also of baptisme? The rather, because baptism is not administred with respect to this or that church, but to the general visible Church: Unless you hold that a man or child is baptized to no church but that particular, and [is] an infidel to all the rest. Yet some of your brethren will hardly baptize a child of any but a member of their own church, which is next door to Anabaptism. … …4. But your reason I like very well: ‘For we receive the Lord’s Supper, not only as a seal of our communion with the Lord Jesus, and with his members in our own church, but also in all the churches of the saints’: Whence I infer, then, it is not any favour dispensed by you to a member of another church, but a dignity or privilege common to every member of that body, by virtue of that membership, and not with respect to his particular church membership. And I pray, is not baptism also a seal of our communion with all the members of Christ’s body? Why then may you not admit the children of the members of any church to be baptized by your pastors upon just occasion, as well as to admit the parents to the Lord’s Supper? Nay further: If the sacraments be seals of our communion with all the members of Christ, why do you not admit any true Christian, and his children, to the communion of the sacraments, though they be not as yet admitted members of any particular congregation? How dare you deny any member of that Body communion with its fellow-members, when it has union and communion with the Head? Consider it.”

— Daniel Cawdrey, Vindiciæ Clavium: or, A Vindication of the Keys of the Kingdom of Heaven, into the Hands of the Right Owners. Being some Animadversions upon a Tract of Mr. John Cotton’s… (1645), ch. 4, pp. 39-41 Cawdrey was an English presbyterian and Westminster divine.">Copy</button><a class="share" href="https://x.com/intent/post?text=%E2%80%9C1.+But+come+we+to+your+%5Bcongregationalist%5D+particulars%3A+First%2C+%E2%80%98by+way+of+participation+of+the+Lord%E2%80%99s+Supper%2C+the+members+of+one+church+coming+to+another+church%2C+etc.%E2%80%99+But%3A+1.+Why+do+you+instance+in+this+ordinance+only%3F+Have+not+their+children%2C+occasionally+born+there%2C+a+liberty+also+of+baptisme%3F+The+rather%2C+because+baptism+is+not+administred+with+respect+to+this+or+that+church%2C+but+to+the+general+visible+Church%3A+Unless+you+hold+that+a+man+or+child+is+baptized+to+no+church+but+that+particular%2C+and+%5Bis%5D+an+infidel+to+all+the+rest.+Yet+some+of+your+brethren+will+hardly+baptize+a+child+of+any+but+a+member+of+their+own+church%2C+which+is+next+door+to+Anabaptism.+%E2%80%A6+%E2%80%A64.+But+your+reason+I+like+very+well%3A+%E2%80%98For+we+receive+the+Lord%E2%80%99s+Supper%2C+not+only+as+a+seal+of+our+communion+with+the+Lord+Jesus%2C+and+with+his+members+in+our+own+church%2C+but+also+in+all+the+churches+of+the+saints%E2%80%99%3A+Whence+I+infer%2C+then%2C+it+is+not+any+favour+dispensed+by+you+to+a+member+of+another+church%2C+but+a+dignity+or+privilege+common+to+every+member+of+that+body%2C+by+virtue+of+that+membership%2C+and+not+with+respect+to+his+particular+church+membership.+And+I+pray%2C+is+not+baptism+also+a+seal+of+our+communion+with+all+the+members+of+Christ%E2%80%99s+body%3F+Why+then+may+you+not+admit+the+children+of+the+members+of+any+church+to+be+baptized+by+your+pastors+upon+just+occasion%2C+as+well+as+to+admit+the+parents+to+the+Lord%E2%80%99s+Supper%3F+Nay+further%3A+If+the+sacraments+be+seals+of+our+communion+with+all+the+members+of+Christ%2C+why+do+you+not+admit+any+true+Christian%2C+and+his+children%2C+to+the+communion+of+the+sacraments%2C+though+they+be+not+as+yet+admitted+members+of+any+particular+congregation%3F+How+dare+you+deny+any+member+of+that+Body+communion+with+its+fellow-members%2C+when+it+has+union+and+communion+with+the+Head%3F+Consider+it.%E2%80%9D%0A%0A%E2%80%94+Daniel+Cawdrey%2C+Vindici%C3%A6+Clavium%3A+or%2C+A+Vindication+of+the+Keys+of+the+Kingdom+of+Heaven%2C+into+the+Hands+of+the+Right+Owners.+Being+some+Animadversions+upon+a+Tract+of+Mr.+John+Cotton%E2%80%99s%E2%80%A6+%281645%29%2C+ch.+4%2C+pp.+39-41+Cawdrey+was+an+English+presbyterian+and+Westminster+divine.&amp;url=https%3A%2F%2F5solasquotes.github.io%2Fquote%2Fddc2983088.html&amp;via=5Solas" target="_blank" rel="noopener">Share on X</a><a class="perma" href="../quote/ddc2983088.html">Permalink</a><a class="src" href="https://reformedbooksonline.com/local-church-membership-is-not-necessary-to-partake-of-the-sacraments/#:~:text=1.%20But%20come%20we%20to%20your,communion%20with%20the%20Head%3F%20Consider%20it." rel="noopener" target="_blank">Read it online · Reformed Books Online</a></div>

<main class="wrap"><figure class="quote" id="q-ce0d0714fd" data-kw="">
<blockquote><p>God having thus entered into covenant with our Surety Christ Jesus, was pleased also to enter into covenant with us in him. Now this covenant we define to be, a free and gratuitous agreement between an offended God and offending man, in which God promises to man pardon and salvation through the merits and satisfaction of Christ, and man on his part promises faith and obedience. The only author of this covenant is God, who alone could raise fallen man, and make a new covenant in the place of the old. God is here considered as offended, but at the same time as a merciful Father, capable of being propitiated, and willing to be reconciled to offending man. Man, with whom the covenant is entered into, is considered as a sinful creature, but conscious of his guilt and misery. The Mediator of the covenant is Christ. In this covenant God promises that he will be our God, which promise includes both our reconciliation and communion with him, and also the communication of those good things which are necessary for us, particularly holiness, life, and immortality Again, God requires from us that we should be his people, namely, he requires of us faith, repentance, worship, and obedience, all which he produces in us by his Spirit. The seals of this covenant are the sacraments. It is called the new covenant, because the old is abolished and the covenant of grace, because man in no way whatever could merit it, but God of his mere mercy entered into it with man; and also to distinguish it from the first covenant, which is called the covenant of works, which was entered into with Adam, and renewed on Mount Sinai. These two covenants indeed agree with each other in various particulars:—of both, God is the author; in both there are the same contracting parties; in both is promised eternal life and happiness: but they differ also in many respects; in the covenant of works God is considered as Creator and Lord, in the covenant of grace as Redeemer and Father; in the first there were was no mediator, in the second Christ is the Mediator; in the one God dealt with man as upright, in the other he deals with man as a sinner; the former depended on man’s own obedience, the latter depends on the obedience of Christ; in the former was promised life, namely, a state consisting of all good things; in the latter is promised salvation, which, along with life, includes also deliverance from sin and death; in the first God required works, saying, Do this and live; in the second he requires faith, saying, Believe, and thou shall be saved. The covenant of grace does indeed require works of righteousness, but not that we may merit eternal life by them; nor does the imperfection of Christian obedience, provided it be sincere, stand in the way of our salvation.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/benedict-pictet.html">Benedict Pictet</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Christian Theology</cite>, trans. Frederick Reyroux (Philadelphia: Presbyterian Board of Publication, n.d.), 281–82.</span></figcaption>

<blockquote><p>In the Gospel of John, we read the English verb “to believe” fifty-four times in the English Standard Version. By contrast, the original Greek verb πιστεύω (pisteuō), which underlies and is commonly translated as forms of “believe,” occurs ninety-eight times in John’s Gospel. This is no small feature. Central to Jesus’ message as recorded by John is belief in him—belief that he is the Son of God, sent by God, so that many would believe in him and have eternal life. Yet, in our age belief can be difficult. Doubts arise in our mind. Afflictions of this life especially challenge us at times and lead us to wonder: Is it all real? Did Jesus really live, die on a cross, rise from the dead on the third day, and ascend into heaven where he rules over all today? Nevertheless, even in Jesus’ day many did not believe, though they saw him and witnessed the signs he performed to prove that he was the Messiah sent by God to save his people. It is at times like this when unbelief assaults us with questions, uncertainty, and hesitancy, that we should turn to the Gospel of John to hear Jesus call us to belief in him—to believe, with good reason, that he is our Lord and Savior, who gives eternal life to all who believe in him. For example, John 3:16, which is one of the most commonly memorized verses in the Bible, reminds us of God’s love for whoever believes in Jesus and that, by believing, they should not perish but have eternal life. Hear the comfort of these words. Are you suffering and even facing the possibility of death sooner than later from disease or illness? Be comforted by the hope of eternal life—hope that is grounded in the Savior, Christ Jesus, who calls us to believe him when he promises the abundance of eternal life.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/daniel-rowlands.html">Daniel Rowlands</a></span><span class="wk"><span class="lbl">Work:</span> <cite>“Believe in Jesus Christ”</cite>, January 26, 2026</span></figcaption>

</figure><figure class="quote" id="q-c8942359ec" data-kw="">
<blockquote><p>It is admitted that God’s love to man is in one sense universal. He bears good-will towards them, as the work of his hands; but it does not follow thence that He must do all that he could do for their salvation… As to God’s willingness that all should turn and live, as God’s will has been observed sometimes expresses what He approves, and sometimes what He purposes. God wills, approves and desires a sinner’s turning unto Him. It is that which, through the whole Bible, is required of him; and whosoever thus returns shall live. I may add, God is willing to receive and forgive every sinner that returns to Him through Jesus Christ. He desires not the death of a sinner, but rather that he would repent and live. But He has not purposed the salvation of every sinner, or to incline his heart to embrace the salvation exhibited in the gospel. In this sense, the salvation of some is neither desired nor designed: if it were, it would be effected; for “his counsel shall stand, and He will do all his pleasure.”–“Whatsoever his soul desires, even that he does,” Isa. 46:10; Job 23:13.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/andrew-fuller.html">Andrew Fuller</a></span><span class="wk"><span class="lbl">Work:</span> <cite>“The Reality and Efficacy of Divine Grace”</cite>, (1815) in The Complete Works of Andrew Fuller (Harrisonburg, Virginia: Sprinkle Publications, 1988), 2:554</span></figcaption>

<div class="actions"><button class="copy" data-copy="“It is admitted that God’s love to man is in one sense universal. He bears good-will towards them, as the work of his hands; but it does not follow thence that He must do all that he could do for their salvation… As to God’s willingness that all should turn and live, as God’s will has been observed sometimes expresses what He approves, and sometimes what He purposes. God wills, approves and desires a sinner’s turning unto Him. It is that which, through the whole Bible, is required of him; and whosoever thus returns shall live. I may add, God is willing to receive and forgive every sinner that returns to Him through Jesus Christ. He desires not the death of a sinner, but rather that he would repent and live. But He has not purposed the salvation of every sinner, or to incline his heart to embrace the salvation exhibited in the gospel. In this sense, the salvation of some is neither desired nor designed: if it were, it would be effected; for “his counsel shall stand, and He will do all his pleasure.”–“Whatsoever his soul desires, even that he does,” Isa. 46:10; Job 23:13.”

— Andrew Fuller, “The Reality and Efficacy of Divine Grace” (1815) in The Complete Works of Andrew Fuller (Harrisonburg, Virginia: Sprinkle Publications, 1988), 2:554">Copy</button><a class="share" href="https://x.com/intent/post?text=%E2%80%9CIt+is+admitted+that+God%E2%80%99s+love+to+man+is+in+one+sense+universal.+He+bears+good-will+towards+them%2C+as+the+work+of+his+hands%3B+but+it+does+not+follow+thence+that+He+must+do+all+that+he+could+do+for+their+salvation%E2%80%A6+As+to+God%E2%80%99s+willingness+that+all+should+turn+and+live%2C+as+God%E2%80%99s+will+has+been+observed+sometimes+expresses+what+He+approves%2C+and+sometimes+what+He+purposes.+God+wills%2C+approves+and+desires+a+sinner%E2%80%99s+turning+unto+Him.+It+is+that+which%2C+through+the+whole+Bible%2C+is+required+of+him%3B+and+whosoever+thus+returns+shall+live.+I+may+add%2C+God+is+willing+to+receive+and+forgive+every+sinner+that+returns+to+Him+through+Jesus+Christ.+He+desires+not+the+death+of+a+sinner%2C+but+rather+that+he+would+repent+and+live.+But+He+has+not+purposed+the+salvation+of+every+sinner%2C+or+to+incline+his+heart+to+embrace+the+salvation+exhibited+in+the+gospel.+In+this+sense%2C+the+salvation+of+some+is+neither+desired+nor+designed%3A+if+it+were%2C+it+would+be+effected%3B+for+%E2%80%9Chis+counsel+shall+stand%2C+and+He+will+do+all+his+pleasure.%E2%80%9D%E2%80%93%E2%80%9CWhatsoever+his+soul+desires%2C+even+that+he+does%2C%E2%80%9D+Isa.+46%3A10%3B+Job+23%3A13.%E2%80%9D%0A%0A%E2%80%94+Andrew+Fuller%2C+%E2%80%9CThe+Reality+and+Efficacy+of+Divine+Grace%E2%80%9D+%281815%29+in+The+Complete+Works+of+Andrew+Fuller+%28Harrisonburg%2C+Virginia%3A+Sprinkle+Publications%2C+1988%29%2C+2%3A554&amp;url=https%3A%2F%2F5solasquotes.github.io%2Fquote%2Fc8942359ec.html&amp;via=5Solas" target="_blank" rel="noopener">Share on X</a><a class="perma" href="../quote/c8942359ec.html">Permalink</a><a class="src" href="https://reformedbooksonline.com/on-a-divine-disposition-inclination-willingness/#:~:text=It%20is%20admitted% <blockquote><p>Plead hard with God, but plead with Him upon his own arguments; there are amongst many others, these four grounds on which to bottom your plea… 1. On God Himself. And there are two special things from which you may plead here: 1. His gracious nature. Fetch your arguments by which you plead with God for mercy thence, whence He originally fetched his arguments to persuade Himself to show mercy; from his own bowels, from his gracious nature, from his natural goodness and gracious inclination to mercy, Jn. 3:16, ‘God so loved the world that He gave his only Son, etc.&#x27;</p></blockquote>

<main class="wrap"><figure class="quote" id="q-4d45975794" data-kw="">
<blockquote><p>The seducers that had infiltrated the Galatians and corrupted the purity of the gospel…Paul stops here, and says that if we are being forced and obliged to perform this task for God and to enter into this covenant with him, Jesus Christ will not profit us. …Why? Because they look no further than the external act…making us think that we are obliged to do it to be acceptable to God; we have entered into a covenant with him based upon doing our duty. Whoever has fulfilled his duty has made God his debtor, according to the devilish doctrines…We can only obtain grace by our merits, and the memory of our sins and iniquities can be wiped out by making our own satisfaction for sin and thereby appeasing God’s wrath. We see, therefore, that if we can obtain our own pardon, Jesus Christ is made of no value and cannot profit us at all. Why? Because Jesus Christ is not our righteousness if we do not seek remission of our sins through the sacrifice of his death. We need to be sure that God is our Father, and that we can call upon him with a peaceful conscience, having been adopted through the Lord Jesus Christ. …We need the assurance that he accepts us as his children and supports us so compassionately that he approves of what we do, though it is worthless, because of the fatherly love he bears us. If we do not have this assurance, the thought of serving God will make us grind our teeth. If, however, we are persuaded that God looks upon us favourably; if, though we are weak and can do nothing worthy of his approval, he accepts us in the name of the Lord Jesus Christ, then we will surely be filled with courage. We will be like a ship’s sail that has been stretched and filled by the breeze! Thus, our hearts will run to obey him, like a ship driven along by its sail, when we know that God delights in us and accepts our works, not wanting us to be compelled into servitude. He is happy for us to be his children, and that we desire to obey him. Knowing this, we can serve our God with all the more zeal. With his grace as our foundation, we are so filled with his joy that we can offer the sacrifice of praise. Likewise, having sought him in prayer, we can know that he will answer us and, in return, we can thank him for the priceless gifts that he communicates to us every day.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/john-calvin.html">John Calvin</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Sermon on Galatians 5:1–3</cite>, Other citations (work not named), 1557–58; HT: John Fonville)</span></figcaption>

</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-f4da6d65e4" data-kw="">
<blockquote><p>Assurance makes most for your comfort—but holiness makes most for God&#x27;s honor. Man&#x27;s holiness is now his greatest happiness, and in heaven man&#x27;s greatest happiness will be his perfect holiness. Assurance is the daughter of holiness; and he who shall more highly prize, and more earnestly press after the enjoyment of the daughter than the mother, it is not a wonder if God shuts the door upon him, and crosses him in the thing he most desires. The surest and the shortest way to assurance is to wrestle and contend with God for holiness. When the stream and cream of a man&#x27;s spirit runs after holiness, it will not be long night with that man; the Sun of righteousness will shine forth upon that man, and turn his winter into summer, and crown him with the diadem of assurance.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/thomas-brooks.html">Thomas Brooks</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Heaven on Earth: A Treatise on Christian Assurance</cite>, p. 104</span></figcaption>

</figure><figure class="quote" id="q-46149572b1" data-kw="">
<blockquote><p>In the eighteenth century the religious life of Europe suffered from the blight of Rationalism. Religion became a matter of the intellect only, and religious truth was made to depend on rational arguments. Religious certainty was identified with a rational insight into the truth, and divorced from the experience of a supernatural change, and the resulting testimony of the Holy Spirit. Under this chilling influence real spiritual life fast declined, and alongside of it there appeared a luxurious growth of a purely historical or a merely temporal faith. It was but natural that reaction should follow. When a spurious faith became alarmingly prevalent, the question forced itself upon serious-minded Christians with an ever increasing insistency: How can we distinguish the true from the false? The proper method was found in a close and sustained self-examination. The life of the soul was submitted to a very careful scrutiny and to an analysis surprising in its minuteness. A constantly growing number of marks were discovered by which true faith might be recognized, many of them based on an unwarranted generalization and therefore of a very questionable character. The spiritual experiences of those who were regarded as established Christians became the standard by which others were judged. But, though this method was undoubtedly applied with the best intention, it did not promote the glad assurance of salvation in the Church of God; in many cases it even led to hopeless confusion.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/louis-berkhof.html">Louis Berkhof</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Assurance of Faith</cite>, (Wm. B. Eerdmans Publishing Co., 1939), 29–30.</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/assurance-peace-and-joy.html">Assurance, Peace and Joy</a></span></div>

<blockquote><p>When we are sure that we are forgiven, then we abhor iniquity; and I suppose that when faith grows into full assurance, so that we are certain beyond a doubt that the blood of Jesus has washed us whiter than snow, it is then that repentance reaches to its greatest height. Repentance grows as faith grows.</p></blockquote>

<main class="wrap"><figure class="quote" id="q-ad34171032" data-kw="">
<blockquote><p>The duties required in the eighth commandment are… rendering to every one his due;[l]… moderation of our judgments, wills, and affections concerning worldly goods;[o] a provident care and study to get,[p] keep, use, and dispose these things which are necessary and convenient for the sustentation of our nature, and suitable to our condition;[q] a lawful calling,[r] and diligence in it;[s]… and an endeavour, by all just and lawful means, to procure, preserve, and further the wealth and outward estate of others, as well as our own.[x] [l] Rom. 13:7. [o] 1 Tim. 6:6-9. Gal. 6:14. [p] 1 Tim. 5:8. [q] Prov. 27:23-27. Eccl. 2:24. Eccl. 3:12,13. 1 Tim. 6:17,18. Isa. 38:1. Matt. 11:8. [r] 1 Cor. 7:20. Gen. 2:15. Gen. 3:19. [s] Eph. 4:28. Prov. 10:4. [x] Lev. 25:35. Deut. 22:1-4. Exod. 23:4,5. Gen. 47:14,20. Phil. 2:4. Matt. 22:39.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/westminster-assembly.html">Westminster Assembly</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Larger Catechism</cite>, #141</span></figcaption>

</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-e56ab7366e" data-kw="">
<blockquote><p>Thirdly, the practice of wisdom consists, first, in avoiding extremities, vv. 16-17. Secondly, in keeping the mean, v. 18. The extremities are excess or defect. The excess is an error on the right hand, when a man by pride abuses his wisdom, in stretching it beyond the limits and bounds of human capacity, either in defining thereby what is just, what unjust, or what is truth, what error. ‘Be not righteous overmuch.’ A man cannot be too righteous in respect of obedience to the Commandments, yet if he be so much addicted to one or some, as that he despises the rest, he bewrays hypocrisy and folly, and may well be said to be too just. For a man is not to cull out what he thinks good, thereby to justify himself, and to condemn others…</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/thomas-granger.html">Thomas Granger</a></span><span class="wk"><span class="lbl">Work:</span> <cite>A Familiar Exposition</cite>, (1621), ch. 7, p. 182</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/church-discipline/spiritual-abuse-and-cults.html">Spiritual Abuse and Cults</a></span></div>

</figure><figure class="quote" id="q-caf43006e7" data-kw="">

</figure><figure class="quote" id="q-2fcaf7c030" data-kw="">
<blockquote><p>Yea there are among you now many things of a lower [superstitious] nature, which some dare scarce plainly say God commands or forbids, and yet they are censorious enough about them: As heretofore many were… That no prayer may be used… in our common mixed assemblies which have any expressions which all, both good and bad, may not fitly use as for themselves…</p></blockquote>

</figure><figure class="quote" id="q-561d6a751d" data-kw="">
<blockquote><p>In the sixth petition (which is, ‘And lead us not into temptation, but deliver us from evil’) acknowledging, that… we… are not only subject to be tempted, and forward to expose ourselves unto temptations,[l] but also of ourselves unable and unwilling to resist them, to recover out of them, and to improve them;[m] and worthy to be left under the power of them:[n] we pray, that God would so over-rule the world and all in it,[o] subdue the flesh,[p] and restrain Satan,[q] order all things,[r] bestow and bless all means of grace,[s] and quicken us to watchfulness in the use of them, that we and all his people may by his providence be kept from being tempted to sin;[t] or, if tempted, that by his Spirit we may be powerfully supported and enabled to stand in the hour of temptation;[v] or when fallen, raised again and recovered out of it,[w] and have a sanctified use and improvement thereof:[x] that our sanctification and salvation may be perfected,[y] Satan trodden under our feet,[z] and we fully freed from sin, temptation, and all evil, for ever.[a] [l] Matt. 26:69-72. Gal. 2:11-14. 2 Chron. 18:3 compared with 2 Chron. 19:2. [m] Rom. 7:23,24. 1 Chron. 21:1-4. 2 Chron. 16:7-10. [n] Ps. 81:11,12. [o] John 17:15. [p] Ps. 51:10. Ps. 119:133. [q] 2 Cor. 12:7,8. [r] 1 Cor. 10:12,13. [s] Heb. 13:20,21. [t] Matt. 26:41. Ps. 19:13. [v] Eph. 3:14-17. 1 Thess. 3:13. Jude 24. [w] Ps. 51:12. [x] 1 Pet. 5:8-10. [y] 2 Cor. 13:7,9. [z] Rom. 16:20. Zech. 3:2. Luke 22:31,32. [a] John 17:15. 1 Thess. 5:23.</p></blockquote>

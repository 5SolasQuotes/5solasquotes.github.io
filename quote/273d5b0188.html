<main class="wrap"><figure class="quote" id="q-273d5b0188" data-kw="">
<blockquote><p>6. Christ was sufficient as a medicine to save the whole world, as the brazen serpent was to heal all Israel, yet only those that looked up were healed: So ’tis only those that apply this medicine, Habet in se quod omnibus prosit, sed si non bibitur non medetur. Prosper.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/christopher-ness.html">Christopher Ness</a></span><span class="wk"><span class="lbl">Work:</span> <cite>An Antidote against Arminianism, or a Succinct Discourse to Enervate &amp; Confute all the Five Points thereof</cite>, … (Cockerill, 1700), ch. 11, p. 88</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/priestly-office-satisfaction-and-atonement/extent-of-the-atonement.html">Extent of the Atonement</a></span></div>

</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-51cc54e121" data-kw="">
<blockquote><p>What are the fruits of this free grace of God with respect to the gift of Christ for us and to us, as related in this scripture-testimony… [3.] That God had made Him a little lower than the angels, in his being made man, that He might suffer and humble Himself to death. [4.] That God crowned the human nature of Christ with glory and honour… that by his sufferings He might make satisfaction, tasting death for every man, sensibly feeling and undergoing the bitter agonies of that shameful, painful, and cursed death of the cross, hereby putting all mankind into a new state of trial.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/william-tong.html">William Tong</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Matthew Henry’s Commentary, on Hebrews 2</cite>, verse 9</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/priestly-office-satisfaction-and-atonement/extent-of-the-atonement.html">Extent of the Atonement</a></span></div>
<div class="actions"><button class="copy" data-copy="“What are the fruits of this free grace of God with respect to the gift of Christ for us and to us, as related in this scripture-testimony… [3.] That God had made Him a little lower than the angels, in his being made man, that He might suffer and humble Himself to death. [4.] That God crowned the human nature of Christ with glory and honour… that by his sufferings He might make satisfaction, tasting death for every man, sensibly feeling and undergoing the bitter agonies of that shameful, painful, and cursed death of the cross, hereby putting all mankind into a new state of trial.”

</figure><figure class="quote" id="q-f271ecd378" data-kw="">
<blockquote><p>As early as 1595 Piscator, the longtime professor of theology at Herborn whose commentaries on Scripture were generally admired by the Reformed, argued that Christ in no way died for the reprobate. In England, the controversial Peter Baro picked up on this teaching and publicly rejected it in his sermon on the Lambeth Articles in January 1596. Baro had good reason to be alarmed for, in 1594, a Church of England minister named William Burton similarly denied that the death of Christ was sufficient for the nonelect.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/peter-baro.html">Peter Baro</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Michael Lynch, John Davenant’s Hypothetical Universalism: a Defense of Catholic &amp; Reformed Orthodoxy</cite>, (Oxford Univ. Press, 2021), p. 57</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/priestly-office-satisfaction-and-atonement/extent-of-the-atonement.html">Extent of the Atonement</a></span></div>
<div class="actions"><button class="copy" data-copy="“As early as 1595 Piscator, the longtime professor of theology at Herborn whose commentaries on Scripture were generally admired by the Reformed, argued that Christ in no way died for the reprobate. In England, the controversial Peter Baro picked up on this teaching and publicly rejected it in his sermon on the Lambeth Articles in January 1596. Baro had good reason to be alarmed for, in 1594, a Church of England minister named William Burton similarly denied that the death of Christ was sufficient for the nonelect.”

— Peter Baro, Michael Lynch, John Davenant’s Hypothetical Universalism: a Defense of Catholic &amp; Reformed Orthodoxy (Oxford Univ. Press, 2021), p. 57">Copy</button><a class="share" href="https://x.com/intent/post?text=%E2%80%9CAs+early+as+1595+Piscator%2C+the+longtime+professor+of+theology+at+Herborn+whose+commentaries+on+Scripture+were+generally+admired+by+the+Reformed%2C+argued+that+Christ+in+no+way+died+for+the+reprobate.+In+England%2C+the+controversial+Peter+Baro+picked+up+on+this+teaching+and+publicly+rejected+it+in+his+sermon+on+the+Lambeth+Articles+in+January+1596.+Baro+had+good+reason+to+be+alarmed+for%2C+in+1594%2C+a+Church+of+England+minister+named+William+Burton+similarly+denied+that+the+death+of+Christ+was+sufficient+for+the+nonelect.%E2%80%9D%0A%0A%E2%80%94+Peter+Baro%2C+Michael+Lynch%2C+John+Davenant%E2%80%99s+Hypothetical+Universalism%3A+a+Defense+of+Catholic+%26+Reformed+Orthodoxy+%28Oxford+Univ.+Press%2C+2021%29%2C+p.+57&amp;url=https%3A%2F%2F5solasquotes.github.io%2Fquote%2Ff271ecd378.html&amp;via=5Solas" target="_blank" rel="noopener">Share on X</a><a class="perma" href="../quote/f271ecd378.html">Permalink</a><a class="src" href="https://reformedbooksonline.com/on-the-sufficiency-of-the-atonement/#:~:text=As%20early%20as%201595%20Piscator%2C%20the,Christ%20was%20sufficient%20for%20the%20nonelect&amp;text=As%20early%20as%201595%20Piscator%2C%20the%20longtime%20professor&amp;text=death%20of%20Christ%20was%20sufficient%20for%20the%20nonelect" rel="noopener" target="_blank">Read it online · Reformed Books Online</a></div>
</figure><figure class="quote" id="q-8768b1173f" data-kw="">
<blockquote><p>2. Nor do we want to absolutely reject that judgment which distinguishes between the sufficiency and efficacy of Christ’s death, so that it extends to individuals; [but] here it [1 Tim. 2:6] is restricted to only the elect and believing. We know indeed this distinction was constantly received in the schools from the time of Lombard (Sentences, bk. 3, distinction 20, letter ‘c’) and Pope Innocent III (On the Mystical Mass, bk. 2, ch. 41), in which things already has shined not only Primasius, Prosper and others of the ancients, but even so at some time Augustine himself, To the false articles imputed to himself, article 1… Indeed the Synod of Dort itself evidently intimates that in the Second Head of Doctrine, sections 3 &amp; 8… But yet we choose fairly enough not to bring this distinction to the place of Paul upon which we treat. That is to be demonstrated shortly.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/samuel-maresius.html">Samuel Maresius</a></span><span class="wk"><span class="lbl">Work:</span> <cite>A Theological Judgment on the Questions of Grace &amp; Universal Redemption, Partly Refutative, containing 10 Exercitations, Against the Apology of John Daille, published in Belgium, contra the Common &amp; Constant Judgment of the Reformed Churches &amp; Schools of the Belgic Federation, and All Others, to which is Appended Brief Strictures to the Recent Vindications of the Same Daille, which are Most Wordy &amp; Contumacious</cite>, A Theological Judgment on the Questions of Grace &amp; Universal Redemption, Partly Refutative, containing 10 Exercitations, Against the Apology of John Daille, published in Belgium, contra the Common &amp; Constant Judgment of the Reformed Churches &amp; Schools of the Belgic Federation, and All Others, to which is Appended Brief Strictures to the Recent Vindications of the Same Daille, which are Most Wordy &amp; Contumacious… (Groningen, 1658) | Exercitation 2. Places customarily used to support universal redemption are weighed: 1 Tim. 2:6, the distinction between the sufficiency and efficacy of the death of Christ; Rom. 5:18; Heb. 2:9, ‘every man’, what it is; Jn. 1:9 &amp; 1 Jn. 2:2, in which the true sense is propounded and vindicated: other testimonies on the term ‘world’ 58-102</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/priestly-office-satisfaction-and-atonement/extent-of-the-atonement.html">Extent of the Atonement</a></span></div>
<div class="actions"><button class="copy" data-copy="“2. Nor do we want to absolutely reject that judgment which distinguishes between the sufficiency and efficacy of Christ’s death, so that it extends to individuals; [but] here it [1 Tim. 2:6] is restricted to only the elect and believing. We know indeed this distinction was constantly received in the schools from the time of Lombard (Sentences, bk. 3, distinction 20, letter ‘c’) and Pope Innocent III (On the Mystical Mass, bk. 2, ch. 41), in which things already has shined not only Primasius, Prosper and others of the ancients, but even so at some time Augustine himself, To the false articles imputed to himself, article 1… Indeed the Synod of Dort itself evidently intimates that in the Second Head of Doctrine, sections 3 &amp; 8… But yet we choose fairly enough not to bring this distinction to the place of Paul upon which we treat. That is to be demonstrated shortly.”

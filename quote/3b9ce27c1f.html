<main class="wrap"><figure class="quote" id="q-3b9ce27c1f" data-kw="">
<blockquote><p>The paraphrase is inserted between the verses of the text, and in a smaller type. The annotations are at the end of the chapters. They are for the most part very short, and contain much sound sense and piety.” – Thomas Hartwell Horne Clarke, Samuel – Rom. 13 in Annotations upon the Old &amp; New Testaments (1690) Clarke (d. 1701) was a late puritan. His comments are very brief and often sparse. ** ‘Notes very brief, but judicious. Author one of the ejected ministers, an exceedingly learned man. This work was highly commended by Owen, Baxter, Howe and others, but is now superseded.’ – Spurgeon . 1700’s Wall, William – Rom. 13 in Brief, Critical Notes, especially on the Various Readings of the New Testament Books... (d. 1728; 1734), pp. 245-46 ** ‘Dr. Wall was the great champion on infant baptism against the learned Gale. His notes are good, but out of date.’ ‘Explains some difficulties, but is far surpassed by other annotators.’ – Spurgeon Edwards, Jonathan Rom. 13 in Romans in The Blank Bible being WJE Online, vol. 24 There is nothing on Rom. 13 in Notes on the Bible in The Works of Jonathan Edwards, A.M. rev. Hickman in 2 vols (d. 1758; London: Ball, 1839), vol. 2, p. 799 Ostervald, Jean – Rom. 13 in The Arguments of the Books &amp; Chapters of the Old &amp; New Testaments, with Practical Observations (d. 1747; 1779), vol. 2 Ostervald (1663-1747) was a Swiss protestant pastor historically in the line of the reformed tradition, though, being one of the primary leaders of the Enlightenment (coming after the orthodox days of Turretin and Pictet), he was thought to show a leaning towards Socinianism and Arminianism (see Wiki). Guyse, John – Rom. 13 in The Practical Expositor: or an Exposition of the New Testament, in the Form of a Paraphrase, with Occasional Notes… for the Use of the Family &amp; the Closet, vol. 3 (Acts-Rom) (d. 1761) Guyse (1680-1761) was an English Independent minister. Spurgeon said regarding John Brown of Haddington’s Self-Interpreting Bible: ** ‘Useful in its day, and still popular. Notes on the New Testament an undisguised plagiarism from Guyse. Not a student’s book.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/richard-baxter.html">Richard Baxter</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Rom. 13 in A Paraphrase on the New Testament with Notes, Doctrinal &amp; Practical… (London: Simmons, 1685)</cite></span></figcaption>

</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-1e1630c6fb" data-kw="">
<blockquote><p>1 Cor. 6:12, ‘All things (indifferent) are lawful in themselves, but they are not expedient,’ if we be brought under the power or band of them by law. Therefore, in the means of worship, not only must we see what is lawful, but also what is profitable and conducing to the end… 1 Cor. 7:6, ‘But this I speak by permission, not of commandment.’ Therefore in things in which God has granted us liberty, to do or not to do, permission has place, not obliging necessity or penal laws. 13th Proposition. There cannot be commanding laws in things that are politicly good or evil according to the individual complexion, temperature, or gifts of singular men: [for example] to marry or not to marry, cannot be commanded, for where God looses, no power on earth can bind, v. 33. 1 Cor. 8:7, Paul condemns them in the use of their Christian liberty, ‘Howbeit there be not in every man this knowledge;’ then that rulers may make laws in things indifferent, without scandal, they must remove ignorance. 2. If there be but one person weak in knowledge (there is not in every man that knowledge), a law obliging all in things indifferent cannot be made.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/samuel-rutherford.html">Samuel Rutherford</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Divine Right of Church Government… (London, 1646), Appendix, Question 1</cite>, pp. 6-7</span></figcaption>

<blockquote><p>They spoil kings and parliaments of their legislative power. But their great tenet about the magistracy is this, that no prince nor state on the earth has any legislative power; that neither king nor parliament can make any law in anything that concerns either church or state; that God alone is the Lawgiver; that the greatest magistrate has no other power, but to execute the Laws of God set down in Scripture; that the judicial Law of Moses binds at this day all the nations of the world as well as ever it did the Jews: They tell us that whatever God in Scripture has left free, it may not be bound by any human law, whether civil or ecclesiastic; and what God has bound by any law in Scripture, they will not have it loosed by the hand of any man.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/robert-baillie.html">Robert Baillie</a></span><span class="wk"><span class="lbl">Work:</span> <cite>A Dissuasive From the Errours of the Time (1645)</cite>, p. 31</span></figcaption>

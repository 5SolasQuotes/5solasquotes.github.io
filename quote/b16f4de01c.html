<main class="wrap"><figure class="quote" id="q-b16f4de01c" data-kw="">
<blockquote><p>On the other side, let the government of the reformed churches be observed, in them there is no supreme jurisdiction, but an authority which always submitteth it self to the rule of God’s word, and Canons of a discipline regulated by it. Every man being subjected to the judgement, not of one alone, but of many, and those many not undertaking to bind any man by their authority, but only by the equity of their decrees, submitting themselves to the control of any man, yea and yielding to it, if it be accompanied with reason. The true church is of so ample a circumference that she cannot be governed by one alone, and of so Royal a descent, that in that which concerneth the conscience, she cannot be ruled by any but God himself.

Any other whosoever he be, employed in any function concerning her, must behave himself as her servant, not as her Lord, not prescribing her any thing, but bearing witness to what hath been prescribed her, not advancing himself above kings, but bowing unto them, not thinking, that his spiritual liberty, exempts him from bodily loyalty, but giving to Caesar, that which is Caesar’s, to God that which is God’s, honour to whom honour, tribute to whom tribute belongeth.

This is the platform and ground of jurisdiction in the protestant churches, very different from the Pope’s, who establisheth a spiritual monarchy in the church, who taketh upon him to judge all, without being judged by any, who requireth a blind obedience, grounded not upon the reason and equity of his injunctions, but upon the uncontrollable eminency of his place, making as much of his ordinances, as if they were brought down immediately from God, as having in the registry of his breast, the fullness of infallible knowledge.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/john-cameron.html">John Cameron</a></span><span class="wk"><span class="lbl">Work:</span> <cite>An examination of those plausible appearances which seem most to commend the Romish Church, and to prejudice the Reformed. Discovering them to be but mere shifts, purposely invented, to hinder an exact trial of doctrine by the Scriptures</cite>, trans. William Pinke (Oxford: Edward Forrest, 1626), pp 47-48.</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/civil-government-and-society/church-and-state.html">Civil Government and Society: Church and State</a></span></div>

</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-661fb6a393" data-kw="">
<blockquote><p>For the nation and kingdom that will not serve thee shall perish, yea, those nation shall be utterly wasted.” (Isaiah 60:12) …

If the expression does not ascribe to the Church any control over the State, it still more clearly forbids the idea that the State may exercise control over the Church. This, indeed, if it were at all permitted, would be to reverse the statement of the text, and to make out the line of duty to be, not that nations should serve the Church, but that the Church should serve the nations of the earth.

Whatever subjection the Church, both collectively and in her individual members, may give the State in civil things, she is not only free from this subjection in spiritual matters — that is, in all those things in which she is a church — in all those matters in which her being as a Church consists — but is warranted to expect and to claim the service of the State. Not only will the fulfilment of the prediction in the text “make an end of the Erastian controversy,” [George Gillespie] — the mere announcement should have prevented its rise.</p></blockquote>

</figure><figure class="quote" id="q-188acf59c2" data-kw="">
<blockquote><p>Whereas it has pleased the Lord to move the Heart of our dread Sovereign Charles [I] by the Grace of God King etc. to grant license and liberty to sundry of his subjects to plant themselves in the Western parts of America. We… considering with ourselves the holy Will of God and our own Necessity that we should not live without wholesome Laws and Civil Government among us… do in the name of Christ and in the sight of God combine ourselves together to erect and set up among us such Government as shall be to our best discerning agreeable to the Will of God… and binding of ourselves solemnly by the Grace and Help of Christ and in His Name and fear to submit ourselves to such Godly and Christian Laws as are established in the realm of England… which shall… be made and enacted among us according to God that we may live quietly and peaceably together in all godliness and honest.</p></blockquote>

<blockquote><p>47. The matter may further be thus illustrated: there is almost the like respect and consideration of the magistrate as he is occupied about the outward things of the church, and of the ecclesiastical ministry as it is occupied about the inward or spiritual part of civil government, that is, about those things which in the government of the commonwealth belong to the conscience.

It is one thing to govern the commonwealth, and to make political and civil laws; another thing to interpret the word of God, and out of it to show the magistrate his duty, to wit, how he ought to govern the commonwealth, and in what manner he ought to use the sword. The former is proper and peculiar to the magistrate (neither doth the ministry intermeddle or entangle itself into such businesses), but the latter is contained within the office of the ministers.</p></blockquote>

</figure><figure class="quote" id="q-305b649448" data-kw="">
<blockquote><p>I conclude with one word: Although the Church may enjoin it on its children, not to maintain free intercourse with any private person who has been cast out of the Church, yet it cannot command subjects to revolt from their Sovereigns when excommunicated; because they are bound to continue rendering the obedience due to them by law natural, civil and divine.</p></blockquote>

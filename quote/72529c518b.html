<main class="wrap"><figure class="quote" id="q-72529c518b" data-kw="">
<blockquote><p>And will place thee for a covenant. He now states the reason why God promises that he will be a guardian to Christ. Besides, the Prophet spoke of the Jews and the Gentiles separately; not that they differ by nature, or that the one is more excellent than the other, (for all need the grace of God, (Rom. iii.23,) and Christ has brought salvation to all indiscriminately,) but because the Lord assigned the first rank to the Jews, (Matt. x.6,) it was therefore proper that they should be distinguished from the others. Accordingly, before “the partition-wall” (Eph. ii.14) was thrown down, they excelled, not by their merit, but by the favor of God, because with them in the first instance the covenant of grace was made.

It may be objected, “Why is Christ appointed to a covenant which was ratified long before? for, more than two thousand years before, God had adopted Abraham, and thus the origin of the distinction was long previous to the coming of Christ.” I reply, the covenant which was made with Abraham and his posterity had its foundation in Christ; for the words of the covenant are these, “In thy seed shall all nations be blessed.” (Gen. xxii.18.)

And the covenant was ratified in no other manner than in the seed of Abraham, that is, in Christ, by whose coming, though it had been previously made, it was confirmed and actually sanctioned. Hence also Paul says, “that the promises of God are yea and amen in Christ,” (2 Cor. i.20,) and in another passage calls Christ “the minister of circumcision, to fulfill the promises which were given to the fathers.” (Rom. xv.8.) Still more clearly does he declare that Christ is “the peace” of all, so that they who were formerly separated are united in him, and both they who were far off and they who were near are thus reconciled to God. (Eph. ii.17.) Hence also it is evident that Christ was promised, not only to the Jews, but to the whole world.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/john-calvin.html">John Calvin</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Commentary on the Book of the Prophet Isaiah: Volume Third</cite>, trans. William Pringle (Geneva, 1551) in Calvin’s Commentaries (22 vols, Grand Rapids: Baker, 1993), viii, 294.</span></figcaption>

<blockquote><p>Third, because every agent acts by its form; hence the manner in which it has its form is the manner in which it is an agent. Therefore whatever is primarily and essentially an agent must be primarily and essentially form. Now God is the first agent, since He is the first efficient cause. He is therefore of His essence a form; and not composed of matter and form.</p></blockquote>

<blockquote><p>Even so God both endures “with much longsuffering” the sins of the reprobate and, at the same time, is patient with the elect prior to their conversion, willing their repentance rather than their immediate destruction because of sin.534 It is, thus, “the most bountiful will of God not suffering his displeasure suddenly to rise against his creatures offending, to be avenged of them, but he doth warn them beforehand, lightly correct and seek to turn them unto him.”535 The divine compassion, similarly, is the disposition of God to deliver creatures from their misery. It is manifest when “the object of the divine goodness of love [is] involved in misery, such as man who is a sinner and subject to death.”536 534. Brakel, Redelijke Godsdienst, I.iii.36.

535. Leigh, Treatise, II.xiii (p. 100).

536. Venema, Inst. theol., VIII (p. 185).</p></blockquote>

<main class="wrap"><figure class="quote" id="q-fb531881d3" data-kw="">
<blockquote><p>Men have generally formed such conceptions of the present state of human nature, and the extent of its powers, as they wish to be true, and wishing them to be true, have asserted them to be so; and after dressing her up in a gay attire of their own making, to complete her honour, and fix the crown of glory upon her head, have complacently enough given her salvation of her own working out. Hence it is, that human merit and personal righteousness pass so currently in this refined age as the only, conditions of our acceptance with God, and justification in his sight. The success of this modern method of Christian-making is easily accounted for. For as it ascribes the whole praise of his salvation to man himself, it is much more agreeable to the pride of the human heart, than the gospel method of salvation, which resolves the whole into the free grace of God in Christ Jesus. But though such a scheme of salvation is greedily swallowed by the human heart, yet if it has not the sanction of the infallible oracles of truth, it must be looked upon as “a cunningly devised fable.”

Whilst such unscriptural principles as these, with respect to the way of access to the divine favour, are assiduously propagated by some, and greedily swallowed by others, the following publication cannot be deemed an unseasonable one. It turns upon a capital article in the Christian system, upon our notions of which all our views of the method of acceptance with God must depend. For if one man maintains that human nature, by proper culture and improvement, may acquire strength and integrity equal to that which it had in the days of primaeval rectitude, salvation by works will to him appear quite practicable. But on the other hand, if another man, according to sacred writ, believes that the descendants of Adam are obnoxious to the curse of the law, and “dead in trespasses and sins,” he will clearly see the necessity of Christ’s satisfaction to remove the one, and the power of the Spirit to raise from the other.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/michael-boston.html">Michael Boston</a></span><span class="wk"><span class="lbl">Work:</span> <cite>A View of the Covenant of Works, from the Sacred Records</cite>, (1772) in The Whole Works of the Late Reverend Thomas Boston of Ettrick, ed. Samuel McMillan (12 vols, Aberdeen: George and Robert King, 1852), 11: 174-75.</span></figcaption>

</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-0a171f73ca" data-kw="">
<blockquote><p>If any man see his brother fall into and continue in such a sin as may be capable of forgiveness, let him earnestly sue unto God, for pardon of that offender; and God, who is great, and infinite in mercy, shall graciously incline his ear to his prayers, give remission and life to such an one. There is indeed a sin unto death, for which there is no forgiveness with God, because there is no capacity of repentance for it in the committer of it; I mean the sin against the Holy Ghost, when a man, having received the knowledge of the Gospel by the illumination of the Holy Spirit, and [has] professed the belief thereof, shall, in a devilish malice, wilfully blaspheme and persecute that known truth: I do not give you allowance to pray for the pardon of this sin.</p></blockquote>

<blockquote><p>Howsoever every sin, even the least, doth thus deserve eternal damnation, yet there is a great difference between some sins and others. And therefore sin is not a mere negation, but a privation, as diseases are, and so as one disease may be more desperate then another, so may one sin be more heinous then another. The Stoics thought all sins alike. And Cyprian among the Ancients, is reported by the Learned to have been of that mind. But Scripture doth evidently confute this, He that delivered me unto thee hath the greater sin, John 16.11. So you have the phrase, no be worse then an Infidel, 1 Tim. 5.8. Thus Ezek. 16.47. Israel is said to be more corrupted, and to do more abomination then Sodom. For although to sin be to miss the mark, yet some may shoot far wider from it, then others, one sin therefore may be more heinous then another, divers ways, as Divines shew: As

1. From the Person offending; if he know the will of God, or if he be in public place or office.

2. From the Object; If it be sin against God immediately, or man only, as Eli said, 1 Sam. 2.25. If one man sin against another, the Judge shall judge him, but if a man sin against the Lord, who shall intreat for him?

3. From the Matter about which; If it be in the life of a man, and not in his goods, that thou wrongest him. Some also may be aggravated from the disposition of the man, the means he enjoys to overcome sin from the frequency of it, or defending of it, and the like. Hence some sins are compared to Camels, others to Gnats, some to Beams, other to Moats, some to Talents, other to Farthings. This then being clear, let us consider, what difference a true believer should make between these in matter of pardon, and what difference he should not make.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/anthony-burgess.html">Anthony Burgess</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The true doctrine of justification asserted and vindicated, from the errors of Papists, Arminians, Socinians, and more especially Antinomians in XXX lectures preached at Lawrence-Jury, London</cite>, (2nd edn, London: Tho. Underhill, 1651), pp 206-07.</span></figcaption>

</figure><figure class="quote" id="q-3c5bbff1a1" data-kw="">
<blockquote><p>The faithless are the enemies of God and some of them the enemies of our Church and country, and some enemies to ourselves; and shall we pray for such? Although now they be the enemies of God, yet hereafter they may become friends and be reconciled unto Him: whereof our prayer may be a means: And therefore howsoever we are to pray against their wicked practices, we are to pray for their persons, that they of enemies may become friends; of infidels, faithful; of heretics and schismatics, sound Christians; of wicked and profane, religious and holy: ‘for this is good and acceptable in the sight of God our Savior, who wills that all men should be saved and come unto the knowledge of the truth.’ (1 Tim. 2:4) Examples of them who have prayed for the wicked are very many in the Word of God: As of Abraham, for the Sodomites, Gen. 18, Moses, for the rebellious Israelites, Ex. 32, yea, for Pharaoh and the Egyptians; Samuel, for Saul, the man of God for Jerdboam, 1 Kn. 13. But why seek [????] examples? We have a commandment to pray for such as have sinned not unto death, and a promise to procure mercy for them, 1 Jn. 5:16, and a complaint of God when this is not performed, Eze. 22:30. Prayers made for the wicked are many times without fruit. If they be without fruit, though they be to them idle, yet not to thee: Thy prayer shall return into thine own bosom, Ps. 35:13, according to that, Mt. 10:13, ‘When ye come into an house, salute it, or wish peace unto it: if the house be worthy, let your peace come upon it; but if it be not worthy, let your peace return to you.’ As for those that be our enemies, though the Schoolmen teach that we are not, or at least need not, specially to pray for them, yet our Savior Christ has commanded us to love our enemies, to bless them that curse us and to pray for them who despitefully use us and persecute us. So Jer. 29:7; Rom. 12:14. And this was practiced by our Savior, Lk. 13:34, by Stephen, Acts 7:60.</p></blockquote>

<div class="actions"><button class="copy" data-copy="“The faithless are the enemies of God and some of them the enemies of our Church and country, and some enemies to ourselves; and shall we pray for such? Although now they be the enemies of God, yet hereafter they may become friends and be reconciled unto Him: whereof our prayer may be a means: And therefore howsoever we are to pray against their wicked practices, we are to pray for their persons, that they of enemies may become friends; of infidels, faithful; of heretics and schismatics, sound Christians; of wicked and profane, religious and holy: ‘for this is good and acceptable in the sight of God our Savior, who wills that all men should be saved and come unto the knowledge of the truth.’ (1 Tim. 2:4) Examples of them who have prayed for the wicked are very many in the Word of God: As of Abraham, for the Sodomites, Gen. 18, Moses, for the rebellious Israelites, Ex. 32, yea, for Pharaoh and the Egyptians; Samuel, for Saul, the man of God for Jerdboam, 1 Kn. 13. But why seek [????] examples? We have a commandment to pray for such as have sinned not unto death, and a promise to procure mercy for them, 1 Jn. 5:16, and a complaint of God when this is not performed, Eze. 22:30. Prayers made for the wicked are many times without fruit. If they be without fruit, though they be to them idle, yet not to thee: Thy prayer shall return into thine own bosom, Ps. 35:13, according to that, Mt. 10:13, ‘When ye come into an house, salute it, or wish peace unto it: if the house be worthy, let your peace come upon it; but if it be not worthy, let your peace return to you.’ As for those that be our enemies, though the Schoolmen teach that we are not, or at least need not, specially to pray for them, yet our Savior Christ has commanded us to love our enemies, to bless them that curse us and to pray for them who despitefully use us and persecute us. So Jer. 29:7; Rom. 12:14. And this was practiced by our Savior, Lk. 13:34, by Stephen, Acts 7:60.”

— George Downame, A Godly &amp; Learned Treatise of Prayer, ... (Cambridge: 1640), ch. 32, ‘Distinctions of Prayer in regard of the Object,’, pp. 186-87">Copy</button><a class="share" href="https://x.com/intent/post?text=%E2%80%9CThe+faithless+are+the+enemies+of+God+and+some+of+them+the+enemies+of+our+Church+and+country%2C+and+some+enemies+to+ourselves%3B+and+shall+we+pray+for+such%3F+Although+now+they+be+the+enemies+of+God%2C+yet+hereafter+they+may+become+friends+and+be+reconciled+unto+Him%3A+whereof+our+prayer+may+be+a+means%3A+And+therefore+howsoever+we+are+to+pray+against+their+wicked+practices%2C+we+are+to+pray+for+their+persons%2C+that+they+of+enemies+may+become+friends%3B+of+infidels%2C+faithful%3B+of+heretics+and+schismatics%2C+sound+Christians%3B+of+wicked+and+profane%2C+religious+and+holy%3A+%E2%80%98for+this+is+good+and+acceptable+in+the+sight+of+God+our+Savior%2C+who+wills+that+all+men+should+be+saved+and+come+unto+the+knowledge+of+the+truth.%E2%80%99+%281+Tim.+2%3A4%29+Examples+of+them+who+have+prayed+for+the+wicked+are+very+many+in+the+Word+of+God%3A+As+of+Abraham%2C+for+the+Sodomites%2C+Gen.+18%2C+Moses%2C+for+the+rebellious+Israelites%2C+Ex.+32%2C+yea%2C+for+Pharaoh+and+the+Egyptians%3B+Samuel%2C+for+Saul%2C+the+man+of+God+for+Jerdboam%2C+1+Kn.+13.+But+why+seek+%5B%3F%3F%3F%3F%5D+examples%3F+We+have+a+commandment+to+pray+for+such+as+have+sinned+not+unto+death%2C+and+a+promise+to+procure+mercy+for+them%2C+1+Jn.+5%3A16%2C+and+a+complaint+of+God+when+this+is+not+performed%2C+Eze.+22%3A30.+Prayers+made+for+the+wicked+are+many+times+without+fruit.+If+they+be+without+fruit%2C+though+they+be+to+them+idle%2C+yet+not+to+thee%3A+Thy+prayer+shall+return+into+thine+own+bosom%2C+Ps.+35%3A13%2C+according+to+that%2C+Mt.+10%3A13%2C+%E2%80%98When+ye+come+into+an+house%2C+salute+it%2C+or+wish+peace+unto+it%3A+if+the+house+be+worthy%2C+let+your+peace+come+upon+it%3B+but+if+it+be+not+worthy%2C+let+your+peace+return+to+you.%E2%80%99+As+for+those+that+be+our+enemies%2C+though+the+Schoolmen+teach+that+we+are+not%2C+or+at+least+need+not%2C+specially+to+pray+for+them%2C+yet+our+Savior+Christ+has+commanded+us+to+love+our+enemies%2C+to+bless+them+that+curse+us+and+to+pray+for+them+who+despitefully+use+us+and+persecute+us.+So+Jer.+29%3A7%3B+Rom.+12%3A14.+And+this+was+practiced+by+our+Savior%2C+Lk.+13%3A34%2C+by+Stephen%2C+Acts+7%3A60.%E2%80%9D%0A%0A%E2%80%94+George+Downame%2C+A+Godly+%26+Learned+Treatise+of+Prayer%2C+...+%28Cambridge%3A+1640%29%2C+ch.+32%2C+%E2%80%98Distinctions+of+Prayer+in+regard+of+the+Object%2C%E2%80%99%2C+pp.+186-87&amp;url=https%3A%2F%2F5solasquotes.github.io%2Fquote%2F3c5bbff1a1.html&amp;via=5Solas" target="_blank" rel="noopener">Share on X</a><a class="perma" href="../quote/3c5bbff1a1.html">Permalink</a><a class="src" href="https://reformedbooksonline.com/on-not-praying-for-the-one-who-has-sinned-unto-death-1-jn-516-17/#:~:text=The%20faithless%20are%20the%20enemies%20of,Lk.%2013%3A34%2C%20by%20Stephen%2C%20Acts%207%3A60&amp;text=The%20faithless%20are%20the%20enemies%20of%20God%20and&amp;text=our%20Savior%2C%20Lk.%2013%3A34%2C%20by%20Stephen%2C%20Acts%207%3A60" rel="noopener" target="_blank">Read it online · Reformed Books Online</a></div>

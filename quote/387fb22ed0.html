<blockquote><p>2. Beside the Word, in actions-moral and in God’s worship, is all one with that which is contrary to the Word; and what is not commanded is forbidden, as not seeing in a creature capable of all the five senses is down right blindness. … 2. In actions or religious means of worship, and actions moral, whatever is beside the Word of God, is against the Word of God; I say in religious means, for there be means of worship, or circumstances physical, not moral, not religious, as whether the pulpit be of stone or of timber, the bell of this or this metal, the house of worship stand thus or thus in situation.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/samuel-rutherford.html">Samuel Rutherford</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Divine Right of Church Government (London, 1646), ch. 1, question 2</cite>, pp. 101-2</span></figcaption>

</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-814c750a7b" data-kw="">
<blockquote><p>The light of nature sheweth that there is a God, who hath lordship and sovereignty over all; is good, and doeth good unto all; and is therefore to be feared, loved, praised, called upon, trusted in, and served, with all the heart, and with all the soul, and with all the might.[a] But the acceptable way of worshipping the true God is instituted by himself, and so limited by his own revealed will, that he may not be worshipped according to the imaginations and devices of men, or the suggestions of Satan, under any visible representation, or any other way not prescribed in the holy Scripture.[b] [a] Rom. 1:20. Acts 17:24. Ps. 119:68. Jer. 10:7. Ps. 31:23. Ps. 18:3. Rom. 10:12. Ps. 62:8. Josh. 24:14. Mark 12:33. [b] Deut. 12:32. Matt. 15:9. Acts 17:25. Matt. 4:9,10. Deut. 4:15-20. Exod. 20:4-6. Col. 2:23.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/westminster-assembly.html">Westminster Assembly</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Confession, 21.1</cite></span></figcaption>
<div class="meta"><span class="t"><a href="../topics/worship/nature-of-worship.html">Nature of Worship</a></span></div>

</figure><figure class="quote" id="q-6dd71bd322" data-kw="">
<blockquote><p>He certainly did not suspect the Corinthians of such a degree of ignorance or carelessness as to think that they worshipped idols in their heart. But as they made no scruple of frequenting the assemblies of the wicked, and observing along with them certain rites instituted in honor of idols, he condemns this liberty taken by them, as being a very bad example. It is certain, then, that when he here makes mention of idolatry, he, speaks of what is outward, or, if you prefer it, of the profession of idolatry. For as God is said to be worshipped by the bending of the knee, and other tokens of reverence, while the principal and genuine worship of Him is inward, so is it also as to idols, for the case holds the same in things opposite. It is to no purpose that very many in the present day endeavor to excuse outward actions on this pretext, that the heart is not in them, while Paul convicts of idolatry those very acts, and assuredly with good reason. For, as we owe to God not merely the secret affection of the heart, but also outward adoration, the man who offers to an idol an appearance of adoration takes away so much of the honor due to God. Let him allege as he may that his heart is quite away from it. The action itself is to be seen, in which the honor that is due to God is transferred to an idol.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/john-calvin.html">John Calvin</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Commentary on 1 Cor. 10, verse 14</cite></span></figcaption>

a></div>
</figure><figure class="quote" id="q-63e52b3daf" data-kw="">
<blockquote><p>I do not here conceive that the Church acknowledges she has cast off her garments of Christ’s righteousness; for then how should she remain the spouse of Christ? Yea, how then should her heart have been otherwise than asleep too? But only she pleads she should appear too naked if she should open to Christ, if she should worship Him in the simplicity and nakedness of his simple ordinances.</p></blockquote>

</figure><figure class="quote" id="q-5d31cde9dc" data-kw="">

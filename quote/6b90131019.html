</figure><figure class="quote" id="q-4d2447d66c" data-kw="">
<blockquote><p>On the other side, narrow and temporary precepts and examples: 1. Are void of all these foresaid [universal and perpetual] characters; 2. They are about materials of temporary use; 3. Or they are but the ordering of such customs as were there before, and were proper to those countries; 4. And many speeches are plainly appropriated to the time and persons; 5. And many actions were manifestly occasional, without any intimation of reason or purpose of obliging others to imitation. … So the women’s veil and the custom of kissing each other as a token of love, and men’s not wearing long hair, were the customs of the country there ordered and improved by the apostles about sacred things, but not introduced into other countries that had no such custom.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/richard-baxter.html">Richard Baxter</a></span><span class="wk"><span class="lbl">Work:</span> <cite>A Christian Directory: a Sum of Practical Theology and Cases of Conscience</cite>, pp. 893-4</span></figcaption>

</figure><figure class="quote" id="q-67d3f536c8" data-kw="">
<blockquote><p>Some of the interpreters refer these words [1 Cor. 11:16] to the question in hand, and think that the apostle is here opposing the custom of the Churches to these that contended for men covering their heads in public meetings: but the better sort take this to be spoken against the study of contention, and think the apostle his meaning here is only to show that it is not his fashion, nor the fashion of the Churches of God, to be contentious for matters of such indifferency as those were of.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/david-lindsay.html">David Lindsay</a></span><span class="wk"><span class="lbl">Work:</span> <cite>A Treatise of the Ceremonies of the Church… (London, 1625), p. 23 Lindsay was a prominent bishop and defender of the Articles of Perth (1618).</cite></span></figcaption>
<div class="meta"><span class="t"><a href="../topics/worship/head-coverings-in-worship.html">Head Coverings in Worship</a></span></div>

</figure><figure class="quote" id="q-135600374f" data-kw="">
<blockquote><p>6. …Some [apostolic traditions] are concerning the rites and the good order of the Church; as that touching the blood of things that were strangled, the covering of women’s heads, that men should not be covered in the time of prayer, and such like. 7. Those things, which are concerning the substance of doctrine [e.g. Lord’s Supper], are to be perpetually observed in the Church: but as for the things which appertain to outward rites, they in consideration of diverse circumstances, as of time, place and person, may be changed: yet so, as regard be always had (which must be generally observed in all indifferent things) unto that which makes most for the glory of God and the edification of the Church.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/swiss-reformed.html">Swiss Reformed</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Theodore Beza &amp; Anthony Faius | Propositions &amp; Principles of Divinity Propounded &amp; Defended in the University of Geneva by certain students of divinity there, under Mr. Theodore Beza &amp; Anthonis Faius, professors of divinity (Edinburgh, 1591)</cite>, pp. 251-2</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/worship/head-coverings-in-worship.html">Head Coverings in Worship</a></span></div>

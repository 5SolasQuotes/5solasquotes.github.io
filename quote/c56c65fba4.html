<main class="wrap"><figure class="quote" id="q-c56c65fba4" data-kw="">
<blockquote><p>2. The theory of Edwards breaks down. (1) It does not explain guilt; it does not rid God of being the author of sin. (2) It does not explain the moral value attached to character. (3) This theory explains self-expression, but not self-determination. Now, just a view must show how we first determine and then habitually express ourselves. In these determinations is found the moral significance of these expressions. Otherwise my nature would be no more than the nature of a plant. Will supposes conscience and intelligence–these minister to it; the moral law–this is its standard. 3. …There was also the possibility of determining otherwise–a power of perverting our nature, of determining it in another direction. The power, therefore, of determining itself in one or the other direction… … In the moral sphere, and especially in relation to single acts, this freedom is now seen in man. It is neither necessity nor a contempt of the principle of law.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/james-henley-thornwell.html">James Henley Thornwell</a></span><span class="wk"><span class="lbl">Work:</span> <cite>‘Freedom of the Will’ appended to ‘Lecture 10’ in Theological Lectures, in Collected Writings</cite>, vol. 1, pp. 250-251</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/the-fall/the-first-sin.html">The First Sin</a></span></div>

formed Books Online</a></div>
</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-c26fbd5ea3" data-kw="">
<blockquote><p>We should give to God the glory of his supremacy; we should not deny to the creature the properties that God has bestowed. We should not be afraid to say, My act, or My thought, or My feeling, because whatever is positive or real in these functions should be ascribed only to God. They are ours by a power which God imparted to us, and every abuse of these faculties is an act which must be ascribed in all its relations to the will of the creature, and the creature alone.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/james-henley-thornwell.html">James Henley Thornwell</a></span><span class="wk"><span class="lbl">Work:</span> <cite>As quoted by John Girardeau, The Will in its Theological Relations</cite>, pp. 13-14, from Thornwell’s Collected Writings, vol. 1, Theological Lectures, on Sin</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/the-fall/the-first-sin.html">The First Sin</a></span></div>

</figure><figure class="quote" id="q-fda0824654" data-kw="">
<blockquote><p>What in [John] Milton’s opinion, was the causal basis of Adam’s disobedience? In a recent study Leon Howard… arrived at the following conclusions: ‘God is the remote first cause, who moves in so mysterious a way that human reason can find a force for teaching only in those more proximate causes with which he works. Adam, impelled by a ‘deficience’ of nature within him [the ‘proegumenic’ cause], was the principal cause of ‘all our woe.’ Eve provided the occasion [the ‘procatarctic’ cause] of his first disobedience. And Satan was the instrument by which the catastrophe was brought about.’ …It is useful… to know how Milton’s immediate predecessors and contemporaries regarded the problem, and to consult some sixteenth- and seventeenth century conceptions of the causes of man’s first apostasy.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/john-m-steadman.html">John M. Steadman</a></span><span class="wk"><span class="lbl">Work:</span> <cite>“‘Man’s First Disobedience’: The Causal Structure of the Fall” in Journal of the History of Ideas</cite>, vol. 21, no. 2 (Apr. – Jun., 1960), pp. 180-97</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/the-fall/the-first-sin.html">The First Sin</a></span></div>

</figure><figure class="quote" id="q-9c5b402fd2" data-kw="">
<blockquote><p>God did not foreknow the actions of man, as necessary, but as free… Man has a power to do otherwise than that which God foreknows he will do: Adam was not determined by any inward necessity to Fall, not any man by inward necessity to commit this or that particular sin; but God foresaw that he would fall, and Fall freely… and how that Free-Will of man will comply with this, or refuse that; he changes not the manner of the Creatures operation, whatsoever it be.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/stephen-charnock.html">Stephen Charnock</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Discourses upon the Existence &amp; Attributes of God 2 vols</cite>, vol. 1, p. 303, as cited in Muller, Divine Will, p. 296</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/the-fall/the-first-sin.html">The First Sin</a></span></div>

</figure><figure class="quote" id="q-d7672683ee" data-kw="eve unbelief">
<blockquote><p>Unbelief could not have place in man, unless first by thoughtlessness he had ceased from a consideration of God’s prohibition and of his truth and goodness. If he had always seriously directed his mind to it (especially in the moment of temptation), he could never have been moved from his faith and listened to the tempter. Hence, therefore, unbelief or distrust flowed first. By this man did not have the faith in the word of God which he was bound to have; then incredulity by which he believed the Devil rather than God; then ambition of a false excellence; then a desire of the forbidden fruit and finally an eating of it.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/francis-turretin.html">Francis Turretin</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Institutes of Elenctic Theology</cite>, 9.6.9</span></figcaption>

<main class="wrap"><figure class="quote" id="q-b71dc026c4" data-kw="object of faith word of God">
<blockquote><p>“The object of faith ought to be true and nothing false can come under it.” The reason is that the word of God (which is most true) is the sole object of faith and cannot be exposed to any error or falsehood, no more than God himself (its author, who is the truth itself and who, as he cannot be deceived, so he cannot deceive anyone, not knowing how to lie).</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/francis-turretin.html">Francis Turretin</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Institutes of Elenctic Theology</cite>, 15.11.1</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/faith/object-of-faith.html">Object of Faith</a> › <a href="../topics/faith/object-of-faith/the-testimony-of-god.html">The testimony of God</a></span><span class="t"><a href="../topics/faith/object-of-faith.html">Object of Faith</a> › <a href="../topics/faith/object-of-faith/christ-and-the-promises.html">Christ and the promises</a></span></div>

</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-eae029983e" data-kw="">
<blockquote><p>We are commanded to look to Christ, as the dying Israelites looked up to the brazen serpent. This looking involved trusting; and looking is declared to be believing. Sinners are exhorted to flee to Christ as a refuge. The man-slayer fled to the city of refuge because he relied upon it as a place of safety. We are said to receive Christ, to rest upon Him, to lay hold of Him. All these, and other modes of expression which teach us what we are to do when we are commanded to believe, show that trust is an essential element in the act of saving faith.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/charles-hodge.html">Charles Hodge</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Systematic Theology</cite>, vol. 3, pt. 3, ch. 16, “Faith”</span></figcaption>

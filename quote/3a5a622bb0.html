<main class="wrap"><figure class="quote" id="q-3a5a622bb0" data-kw="">
<blockquote><p>1. We do not question the duty of obeying the king and all his officers, governing as magistrates by the power of the swords which the king may commit to them. If bishops or lay-chancellors be made magistrates, we will obey them as such: And therefore when they summon us, we appear and answer, because the king authorizes them. And many non-conformists have defended the taking the promise [of canonical obedience to a bishop or ordinary in things lawful and honest] as supposing that the word ‘ordinary’ signifies only the judge of a court set up by the king as supreme governor by the sword in matters and over persons ecclesiastical as well as civil, according to the true sense of the Oath of Supremacy.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/richard-baxter.html">Richard Baxter</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The English Nonconformity as under King Charles II &amp; King James II Truly Stated &amp; Argued (1683; London: Parkhurst, 1689) The preface is dated 1683.</cite>, ch. 6, p. 31</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/civil-government-and-society/church-and-state.html">Civil Government and Society: Church and State</a></span></div>

</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-97903c9b00" data-kw="">
<blockquote><p>Reason 5. Let those that better know the law of the land consider whether it be not necessary to our own peace to free us from lawsuits that we have first the people’s express consent [for church membership, duties and public reproofs]? and whether they may have no action against a minister else for naming any man in the congregation by reproof and pronouncing him a person to be avoided? and so no discipline will be exercised.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/richard-baxter.html">Richard Baxter</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Christian Concord, or the Agreement of the Associated Pastors &amp; Churches of Worcestershire, with Richard Baxter’s Explication &amp; Defence of it, &amp; his Exhortation to Unity (London: A.M., 1653), ‘An Explication of some Passages in the foregoing Propositions’</cite>, p. 12</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/civil-government-and-society/church-and-state.html">Civil Government and Society: Church and State</a></span></div>
<div class="actions"><button class="copy" data-copy="“Reason 5. Let those that better know the law of the land consider whether it be not necessary to our own peace to free us from lawsuits that we have first the people’s express consent [for church membership, duties and public reproofs]? and whether they may have no action against a minister else for naming any man in the congregation by reproof and pronouncing him a person to be avoided? and so no discipline will be exercised.”

</figure><figure class="quote" id="q-713bd3ae9f" data-kw="">
<blockquote><p>Drawing on principles of contract law developed by jurists and theologians from the School of Salamanca [Spain], the Jesuit controversialist Martinus Becanus (1563–1624) argues in favor of the duty to honor promises beyond confessional boundaries [contra the normal Roman position]… In particular circumstances the toleration of religious diversity may not only prevent greater evil, but also advance the greater good, especially by stimulating a kind of pious competition between confessional communities. This first English translation… [is] a major work of one of the most prominent advocates of a permission concept of tolerance in the early modern period.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/martin-becanus.html">Martin Becanus</a></span><span class="wk"><span class="lbl">Work:</span> <cite>On the Duty to Keep Faith with Heretics</cite></span></figcaption>

</figure><figure class="quote" id="q-1d7699be7b" data-kw="">
<blockquote><p>1st Assertion: The magistrate as the magistrate is to procure that there be preachers and Church-officers to dispense Word, sacraments and discipline, for: 1. His end is, that people under him may lead a quiet and a peaceable life in godliness and honesty, 1 Tim. 2:2. And the Magistrate attains his end as a Magistrate, if there be simple exercise of religion in the quiet and peaceable way, that may consist with the subjects indemnity, and immunity, from rapine, injuries, and violence. … 4th Assertion. The magistrate de jure is obliged not only to permit, but also to procure the free exercise of the ministry in dispensing Word, sacraments and discipline, and owe his accumulative power, to convene synods, to add his sanction to the lawful and necessary constitutions and ordination of worthy, and to the deposition of unworthy officers in the Church, because: 1. He is a nurse-father in the Church, Isa. 49:23. 2. And by office, as a public father, to procure the good of the souls of the subjects in his coactive [coercive] way, that we may lead a quiet and peaceable life in all godliness and honesty, 1 Tim. 2:2. 3. He is not only to permit, but also positively to procure all peace, in the exercise of all lawful and profitable trades and arts; therefore, far more that glory may dwell in the land, and that the peace thereof may be as a river, Isa. 48:18, by the presence of Christ walking in the midst of the golden candlesticks.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/samuel-rutherford.html">Samuel Rutherford</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Divine Right of Church Government (London, 1646)</cite>, ch. 24, pp. 543 &amp; 552</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/civil-government-and-society/church-and-state.html">Civil Government and Society: Church and State</a></span></div>

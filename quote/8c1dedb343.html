<main class="wrap"><figure class="quote" id="q-8c1dedb343" data-kw="">
<blockquote><p>3. Much less must we prefer them [animals] before men: We must not be cruel to men pretending to show mercy to the brute creatures. The life of a beast must go still to save or preserve the life of a man. I cannot but condemn the Turks, who set birds at liberty out of their cages, redeeming with money these captives, and yet make no conscience of chaining Christians to their galleys; as also the hypocrisy [of those] that cheat amongst the Romanists, whose clergy are forbid to hunt beasts, and yet some made Lords Inquisitors on purpose to hunt down, tear and devour the harmless sheep and lambs of Christ. Surely the good, the great, and the chief Shepherd of the flock and the Bishop of our souls will count them but little thanks for their so doing when He shall come to hold his general Visitation and to judge the world. These things notwithstanding, I dare not condemn those (if necessitated to save and defend their own lives) which in the civil wars of France cut off their horse-legs and so made themselves a breast-work of their bodies. Nor dare I judge king David for houghing his enemies’ horses, thereby to make them unserviceable for the wars, 2 Sam. 8:4. Let’s not be superstitiously afraid to use these creatures, either for food, physic or service, no nor for our honest delight and recreation. See your charter for so doing, if not implicitly given to Adam, yet expressly to Noah; and again renewed, Acts 10, under the Gospel, in the vision and voice to Peter, ‘Arise Peter, kill, and eat.’ And though ’tis said the disciples of the Nazarites may be known by their abstinence from the flesh of all living creatures, yet our Lord Jesus Christ of Nazareth, and He that in substance though not in vow and ceremony was the true Nazarite, gave his disciples no such commandment. Those who refuse altogether to eat the flesh of living creatures, when duly killed, deserve the name of Pythagoreans, followers of Pythagoras the philosopher, rather than to be called Christians or disciples of Christ our Saviour. So then, use these creatures we may, we must, without scruple for our meat; yea and we may use these creatures for our work, to plow and harrow the ground, and to carry our corn into the barn, and for any other necessary use. And although many condemn those persons who promote the generation of mules [which are a mix of species], so does Maimonides in his More Nev. p. 3, ch. 4 and our own writers on Gen. 36:24, yet we may use them lawfully; for we find them brought to Solomon, 1 Kings 10:25; 2 Chron. 9:24, and amongst the Israelites at their return from captivity, Ezra 2:66 and Neh. 7:68. And we nowhere find that ever they were commanded to put these away, though monsters in nature, as they were to put away their outlandish wives.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/thomas-hodges.html">Thomas Hodges</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Creature’s Goodness, as they came out of God’s Hands, &amp; the good man’s mercy to the brute creatures, which God has put under his feet in Two Sermons</cite>, (London, 1675), sermon 2, pp. 40-41</span></figcaption>

rel="noopener" target="_blank">Read it online · Reformed Books Online</a></div>
</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-dbc05a79dd" data-kw="">
<blockquote><p>In the second member [of the verse] he betrays an evil conscience, or, at least, he shows that he handled rather a private business than any public cause, for he complains that the apostles will cause the priests and the scribes to be hated for the death of Christ. … Notwithstanding this is the principal point of the accusation, that they did not obey the commandment of the priests… But the chief priest does not consider what is his duty towards God and the Church; he abuses his authority tyrannously, as if the same were not under any laws, as the Pope deals with us at this day; for seeing that he takes to himself an unbridled authority and government, he fears not to condemn us for schismatics, so soon as he sees us refuse his decrees; for he catches at these sentences: “He which despiseth you despiseth me,” (Luke 10:16;) and thereupon he concludes that we will rebel against God. But if he will be heard as the ambassador of Christ, he must speak out of the mouth of Christ. Now, forasmuch as he does manifestly play the minister of Satan, he borrows authority, without shame and color, of the name of Christ; yea, the very form of speech which the chief priest uses doth prove how carelessly spiritual tyrants who usurp such authority and lordship as is not subject to the Word of God, dare grant liberty to themselves to attempt whatsoever pleases them. With a commandment (says he) have we commanded. Whence comes such strait rigor, save only because they think that all that must be received without exception which they shall command?</p></blockquote>

<blockquote><p>When we measure the goodness or the badness of a human action, we must not only measure it by the object and the end, but by all the circumstances which accompany it. Fed. Morellus upon those words of Seneca, Refert quid, cui, quando, quare, ubi, etc. says that without those circumstances of things, persons, times, places, facti ratio non constat [it does not consist with reason of fact]. Circumstances sometimes constituunt rerum earum quae aguntur speciem [establish those things which direct the species], say our divines, meaning that circumstances do make an action good or bad. Humani actus [a human action] say the Schoolmen, non solum ex objectis, verum ex circumstantiis boni vel mali esse dicuntur. It is not every mans part, (says one of our opposites) to judge de circumstantia, quae reddit actionem vel bonam vel malam. Some circumstances says another of them, are intrinsical and essential to actions, and specially making up their nature. The principal circumstances which here we speak of, are comprehended in this versicle: ‘Quis, Quid, Ubi, Quibus auxiliis, Cur, Quomodo, Quando.’ [‘Who, what, where, by what means, why, what way, when.’]</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/george-gillespie.html">George Gillespie</a></span><span class="wk"><span class="lbl">Work:</span> <cite>English Popish Ceremonies</cite>, ([1637]), pt. 4, ch. 3, pp. 6-7</span></figcaption>

<div class="actions"><button class="copy" data-copy="“When we measure the goodness or the badness of a human action, we must not only measure it by the object and the end, but by all the circumstances which accompany it. Fed. Morellus upon those words of Seneca, Refert quid, cui, quando, quare, ubi, etc. says that without those circumstances of things, persons, times, places, facti ratio non constat [it does not consist with reason of fact]. Circumstances sometimes constituunt rerum earum quae aguntur speciem [establish those things which direct the species], say our divines, meaning that circumstances do make an action good or bad. Humani actus [a human action] say the Schoolmen, non solum ex objectis, verum ex circumstantiis boni vel mali esse dicuntur. It is not every mans part, (says one of our opposites) to judge de circumstantia, quae reddit actionem vel bonam vel malam. Some circumstances says another of them, are intrinsical and essential to actions, and specially making up their nature. The principal circumstances which here we speak of, are comprehended in this versicle: ‘Quis, Quid, Ubi, Quibus auxiliis, Cur, Quomodo, Quando.’ [‘Who, what, where, by what means, why, what way, when.’]”

— George Gillespie, English-Popish Ceremonies ([1637]), pt. 4, ch. 3, pp. 6-7">Copy</button><a class="share" href="https://x.com/intent/post?text=%E2%80%9CWhen+we+measure+the+goodness+or+the+badness+of+a+human+action%2C+we+must+not+only+measure+it+by+the+object+and+the+end%2C+but+by+all+the+circumstances+which+accompany+it.+Fed.+Morellus+upon+those+words+of+Seneca%2C+Refert+quid%2C+cui%2C+quando%2C+quare%2C+ubi%2C+etc.+says+that+without+those+circumstances+of+things%2C+persons%2C+times%2C+places%2C+facti+ratio+non+constat+%5Bit+does+not+consist+with+reason+of+fact%5D.+Circumstances+sometimes+constituunt+rerum+earum+quae+aguntur+speciem+%5Bestablish+those+things+which+direct+the+species%5D%2C+say+our+divines%2C+meaning+that+circumstances+do+make+an+action+good+or+bad.+Humani+actus+%5Ba+human+action%5D+say+the+Schoolmen%2C+non+solum+ex+objectis%2C+verum+ex+circumstantiis+boni+vel+mali+esse+dicuntur.+It+is+not+every+mans+part%2C+%28says+one+of+our+opposites%29+to+judge+de+circumstantia%2C+quae+reddit+actionem+vel+bonam+vel+malam.+Some+circumstances+says+another+of+them%2C+are+intrinsical+and+essential+to+actions%2C+and+specially+making+up+their+nature.+The+principal+circumstances+which+here+we+speak+of%2C+are+comprehended+in+this+versicle%3A+%E2%80%98Quis%2C+Quid%2C+Ubi%2C+Quibus+auxiliis%2C+Cur%2C+Quomodo%2C+Quando.%E2%80%99+%5B%E2%80%98Who%2C+what%2C+where%2C+by+what+means%2C+why%2C+what+way%2C+when.%E2%80%99%5D%E2%80%9D%0A%0A%E2%80%94+George+Gillespie%2C+English-Popish+Ceremonies+%28%5B1637%5D%29%2C+pt.+4%2C+ch.+3%2C+pp.+6-7&amp;url=https%3A%2F%2F5solasquotes.github.io%2Fquote%2F60cf19bccc.html&amp;via=5Solas" target="_blank" rel="noopener">Share on X</a><a class="perma" href="../quote/60cf19bccc.html">Permalink</a><a class="src" href="https://reformedbooksonline.com/on-circumstances/#:~:text=When%20we%20measure%20the%20goodness%20or,what%20means%2C%20why%2C%20what%20way%2C%20when&amp;text=When%20we%20measure%20the%20goodness%20or%20the%20badness&amp;text=where%2C%20by%20what%20means%2C%20why%2C%20what%20way%2C%20when" rel="noopener" target="_blank">Read it online · Reformed Books Online</a></div>

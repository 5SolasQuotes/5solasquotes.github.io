<blockquote><p>It is very true, that things subordinate are not at variance. There is a natural end. As nature is subordinate to God, so natural ends are subordinate to those which are supernatural and divine. The end of our nature, so far as it is natural, is this, that it should approach very near to the Divine; so far as it is supernatural, it is that man may be united to God.</p></blockquote>

<div class="meta"><span class="t"><a href="../topics/theology/natural-theology.html">Natural Theology</a></span></div>

<blockquote><p>For just as it is self-evident to us that a whole is greater than its part, so is it most evident to those who see the very essence of God that God exists, since his essence is his existence. But because we are unable to see his essence, we come to know his existence not in himself, but in his effects. … Therefore, man must come by reasoning to know God in the likenesses to him which he discovers in God’s effects.</p></blockquote>

<blockquote><p>The reasons are: (1) the Scriptures frequently enjoin this judgment (Mt. 7:15; 16:6; Col. 2:8; 1 Thess. 5:21; Heb. 5:14); (2) the examples of the saints confirm it, as the Bereans (Acts 17:11) and the Corinthians (1 Cor. 10:15); (3) the design of Scripture teaches it (which is the perfection of the man of God in the knowledge of the truth and the conviction of gainsayers [2* Tim. 3:16; Tit. 1:9], which cannot be accomplished without it); (4) the use of reason is a strong proof because as the knowledge of the affirmation and negation of propositions and the doctrine of contradiction belong to it, so also must such a judgment. And unless we allow this, the widest door will be thrown open to all kinds of heretics and fanatics for introducing their fictions and monstrous opinions and we can never use any true contradiction. Sources of explanation.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/francis-turretin.html">Francis Turretin</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Institutes of Elenctic Theology</cite>, 1.10</span></figcaption>

</figure><figure class="quote" id="q-eaf88a4b2d" data-kw="">
<blockquote><p>Mattson challenged us to answer Richard Gaffin’s exegetical defense of Van Til and presuppositionalism from 1 Corinthians 2:6-16: “The natural man does not accept the things of the Spirit of God.”… In summary, Gaffin argues that “the things of the Spirit of God” which “the natural man does not accept” include all things, not only the content of special revelation but also knowledge of the whole creation which falls under the influence of the inaugurated and coming kingdom of God. Gaffin concludes: “1 Cor 2:6-16 (1:18-3:23) is the death blow to all natural theology” (123)… Gaffin, in order to extract his desired exegetical conclusion, assumes a controversial philosophical doctrine: The British idealist doctrine of holism. Holism is the doctrine that all truths are connected such that a difference at one point affects all points. Only by assuming this doctrine can Gaffin, and Mattson, argue that the natural man’s inability to understand the things of the Spirit of God obviates the possibility of natural law and natural theology. On the contrary, 1 Corinthians 2 was a favorite passage of Thomas Aquinas’s, which provided an exegetical basis for a distinction between the realm of nature and that of grace. Radically non-speculative exegesis of 1 Corinthians 2:6-16, I argue, leaves open all possible orthodox positions on this matter, from Van Til’s to Aquinas’s to my own… Gaffin, noting that verse 22 speaks of “all things” as having been “committed to me by the Father,” argues that “these things” – apparently limited in scope – now include our knowledge of all things. Everything is hidden from the unbeliever; knowledge of anything requires revelation and belief… Their method is the theological method I was taught at Westminster Seminary, what John Murray called, “radically non-speculative theology.” It is the idea that the content of systematic theology can be read directly off the pages of Scripture, redemptive-historically interpreted… an idea like “there is nothing in the entire creation that is irrelevant to the kingdom” is not one of the positions on Christ and culture, a distinctively presuppositionalist one. That is all of the positions… Gaffin infers that, if all things are impacted by the “hidden things,” then our knowledge of anything must begin from knowledge of the “hidden things.” But this inference only follows, given the truth of epistemological holism: The doctrine that the content of truths or facts are not separable but a unified, systematic whole. The authors of Classical Apologetics put it this way: “To know the flower in the wall, you have to know the world and all.” Holism was a central doctrine of the British Idealist philosophers. Cornelius Van Til’s philosophy Ph.D. at Princeton University was on the Idealists (“God and the Absolute”)… Van Til held that, if the Christian faith is true, then no truth is unaffected, truths of logic, mathematics, and scientific observation not excepted. Accordingly, no natural human knowledge, no science or philosophy, is fully true. (It might be “true so far as it goes.”) No natural theology or natural law can be built up from below, because all is affected by the content of special revelation. The question of the legitimacy of this logical leap is a philosophical question, and it is one that divides presuppositionalists from classical apologists… Epistemological holists, by contrast, hold that if thinkers have a difference at one point, then they effectively differ at all points. There are no individual truths, only holistic worldviews. Likewise, you cannot accurately perceive some of the world, some of the truth, but misunderstand other parts. The failure to understand the whole undermines apparent success in analyzing the parts… And on philosophical grounds, I would argue that holism is false. While the world is a unity and one part affects another, our knowledge of the world is separable and incomplete. Some people are masters of international finance and failures at emotional intelligence. Some people know every jot and tittle of Reformed theology but are ignorant of philosophy, economics, and politics. It happens… The incompleteness of this knowledge of morality and God is no knock against it. In fact, on biblical grounds, I would claim that it is such incomplete knowledge that renders people accountable to God (Rom 1:19-20). Often, it is such incomplete knowledge that leads people toward a more complete knowledge of God.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/joel-carini.html">Joel Carini</a></span><span class="wk"><span class="lbl">Work:</span> <cite>”The Natural Man does Not Accept the Things of the Spirit of God’ – But He Can Accept Natural Theology: A Response to Brian Mattson &amp; Richard Gaffin’</cite>, (2024)</span></figcaption>

3+apparently+limited+in+scope+%E2%80%93+now+include+our+knowledge+of+all+things.+Everything+is+hidden+from+the+unbeliever%3B+knowledge+of+anything+requires+revelation+and+belief%E2%80%A6+Their+method+is+the+theological+method+I+was+taught+at+Westminster+Seminary%2C+what+John+Murray+called%2C+%E2%80%9Cradically+non-speculative+theology.%E2%80%9D+It+is+the+idea+that+the+content+of+systematic+theology+can+be+read+directly+off+the+pages+of+Scripture%2C+redemptive-historically+interpreted%E2%80%A6+an+idea+like+%E2%80%9Cthere+is+nothing+in+the+entire+creation+that+is+irrelevant+to+the+kingdom%E2%80%9D+is+not+one+of+the+positions+on+Christ+and+culture%2C+a+distinctively+presuppositionalist+one.+That+is+all+of+the+positions%E2%80%A6+Gaffin+infers+that%2C+if+all+things+are+impacted+by+the+%E2%80%9Chidden+things%2C%E2%80%9D+then+our+knowledge+of+anything+must+begin+from+knowledge+of+the+%E2%80%9Chidden+things.%E2%80%9D+But+this+inference+only+follows%2C+given+the+truth+of+epistemological+holism%3A+The+doctrine+that+the+content+of+truths+or+facts+are+not+separable+but+a+unified%2C+systematic+whole.+The+authors+of+Classical+Apologetics+put+it+this+way%3A+%E2%80%9CTo+know+the+flower+in+the+wall%2C+you+have+to+know+the+world+and+all.%E2%80%9D+Holism+was+a+central+doctrine+of+the+British+Idealist+philosophers.+Cornelius+Van+Til%E2%80%99s+philosophy+Ph.D.+at+Princeton+University+was+on+the+Idealists+%28%E2%80%9CGod+and+the+Absolute%E2%80%9D%29%E2%80%A6+Van+Til+held+that%2C+if+the+Christian+faith+is+true%2C+then+no+truth+is+unaffected%2C+truths+of+logic%2C+mathematics%2C+and+scientific+observation+not+excepted.+Accordingly%2C+no+natural+human+knowledge%2C+no+science+or+philosophy%2C+is+fully+true.+%28It+might+be+%E2%80%9Ctrue+so+far+as+it+goes.%E2%80%9D%29+No+natural+theology+or+natural+law+can+be+built+up+from+below%2C+because+all+is+affected+by+the+content+of+special+revelation.+The+question+of+the+legitimacy+of+this+logical+leap+is+a+philosophical+question%2C+and+it+is+one+that+divides+presuppositionalists+from+classical+apologists%E2%80%A6+Epistemological+holists%2C+by+contrast%2C+hold+that+if+thinkers+have+a+difference+at+one+point%2C+then+they+effectively+differ+at+all+points.+There+are+no+individual+truths%2C+only+holistic+worldviews.+Likewise%2C+you+cannot+accurately+perceive+some+of+the+world%2C+some+of+the+truth%2C+but+misunderstand+other+parts.+The+failure+to+understand+the+whole+undermines+apparent+success+in+analyzing+the+parts%E2%80%A6+And+on+philosophical+grounds%2C+I+would+argue+that+holism+is+false.+While+the+world+is+a+unity+and+one+part+affects+another%2C+our+knowledge+of+the+world+is+separable+and+incomplete.+Some+people+are+masters+of+international+finance+and+failures+at+emotional+intelligence.+Some+people+know+every+jot+and+tittle+of+Reformed+theology+but+are+ignorant+of+philosophy%2C+economics%2C+and+politics.+It+happens%E2%80%A6+The+incompleteness+of+this+knowledge+of+morality+and+God+is+no+knock+against+it.+In+fact%2C+on+biblical+grounds%2C+I+would+claim+that+it+is+such+incomplete+knowledge+that+renders+people+accountable+to+God+%28Rom+1%3A19-20%29.+Often%2C+it+is+such+incomplete+knowledge+that+leads+people+toward+a+more+complete+knowledge+of+God.%E2%80%9D%0A%0A%E2%80%94+Joel+Carini%2C+%E2%80%98The+Natural+Man+Does+Not+Accept+the+Things+of+the+Spirit+of+God+%E2%80%93+But+He+Can+Accept+Natural+Theology+A+Response+to+Brian+Mattson+%26+Richard+Gaffin%E2%80%99+%282024%29&amp;url=https%3A%2F%2F5solasquotes.github.io%2Fquote%2Feaf88a4b2d.html&amp;via=5Solas" target="_blank" rel="noopener">Share on X</a><a class="perma" href="../quote/eaf88a4b2d.html">Permalink</a><a class="src" href="https://reformedbooksonline.com/natural-theology/#:~:text=Mattson%20challenged%20us%20to%20answer%20Richard,a%20more%20complete%20knowledge%20of%20God&amp;text=Mattson%20challenged%20us%20to%20answer%20Richard%20Gaffin%E2%80%99s%20exegetical&amp;text=people%20toward%20a%20more%20complete%20knowledge%20of%20God" rel="noopener" target="_blank">Re

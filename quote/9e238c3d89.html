<main class="wrap"><figure class="quote" id="q-9e238c3d89" data-kw="">
<blockquote><p>26. ‘Evil’ is an ambiguous term. It may stand for miserable evils or moral evils. One may morally choose to undergo and suffer certain miserable evils in necessity, other alternatives not being available, likely or reasonable. Electing to eat expired food rather than starve is not wrong. One ought never to do moral evil, though it be lesser in respect to another (1 Cor. 15:34; WLC 99.5).</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/travis-fentiman.html">Travis Fentiman</a></span><span class="wk"><span class="lbl">Work:</span> <cite>“Theses on the Ethics of Civil Voting, with a Correction to the Booklet, Christ Centered Voting”, “Choosing the Lesser of Two Evils” at ‘On Voting’ (RBO).</cite></span></figcaption>
<div class="meta"><span class="t"><a href="../topics/providence/providence-and-evil.html">Providence and Evil</a></span></div>

</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-1f18105752" data-kw="">
<blockquote><p>Desertion in sin is when, God withdrawing the assistance of his spirit, a man is left to fall into some actual and grievius sin. And for all this no man is to think that God is the author of sin, but only man that falls, and Satan. A resemblance of this truth we may see in a staff: which, if a man shall take and set upright upon the ground, so long as he holds it with his hand, it stands upright; but so soon as he withdraws his hand, though he never push it down, it falls of itself. In this desertion was the good king Hezekiah… God left him (namely, to the pride of his heart to exalt himself) in tempting him, that he might try out all that was in his heart. To this place appertain[s] Noah’s drunkenness, David’s adultery, Peter[‘s] denial of Christ.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/william-perkins.html">William Perkins</a></span><span class="wk"><span class="lbl">Work:</span> <cite>A Golden Chain... (Cambridge, 1600), A Declaration of Certain Spiritual Desertions…</cite>, p. 682</span></figcaption>

</figure><figure class="quote" id="q-5cbf7cd3e2" data-kw="">
<blockquote><p>The will of God is one and the same, but it is distinguished: 1. In respect of the object into voluntatem beneplaciti et placiti. God wills good things and good effects with the will of his good pleasure, approving them first of all, and by Himself, He intends their end and means, Eph. 1:5; but evil and evil effects as they are evil, he nils, disapproves and dislikes. Yet he voluntarily permits evil, and as there is a good end of it, He wills it with the will of his pleasure, for it is good that there should be evil, Ps. 81:12; Acts 14:16; 1 Cor. 10:5. Divines thus distinguish, there is volitio mala et mali [an evil volition and a volition of evil], to will sin to be, is not sinful; it had never come into the world if God had not willed it.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/edward-leigh.html">Edward Leigh</a></span><span class="wk"><span class="lbl">Work:</span> <cite>A System or Body of Divinity… (London, 1654), bk. 2, ch. 7, ‘Of God’s Understanding that He is Omniscient, and of his Will’</cite>, p. 165</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/providence/providence-and-evil.html">Providence and Evil</a></span></div>

</figure><figure class="quote" id="q-a0c131ba83" data-kw="">
<blockquote><p>As the term ‘good’ signifies perfect being, so the term ‘evil’ signifies nothing else than privation of perfect being. In its proper acceptation, privation is predicated of that which is fitted by its nature to be possessed, and to be possessed at a certain time and in a certain manner. Evidently, therefore, a thing is called evil if it lacks a perfection it ought to have.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/thomas-aquinas.html">Thomas Aquinas</a></span><span class="wk"><span class="lbl">Work:</span> <cite>A Compendium of Theology, ch. 114, ‘The Meaning of Good &amp; Evil in Things’</cite></span></figcaption>
<div class="meta"><span class="t"><a href="../topics/providence/providence-and-evil.html">Providence and Evil</a></span></div>

</figure><figure class="quote" id="q-4b8c25085e" data-kw="Author of sin">
<blockquote><p>Although God by his providence governs even sins, yet he is not the cause or author of sin: because he takes no delight in sin, but rather abhors it; nor does he himself sin, or can he sin; likewise because he neither commands nor persuades sin; nor does he pour malice into those who sin, nor compel them to sin; and moreover he directs all things to a good end.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/johannes-piscator.html">Johannes Piscator</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Aphorisms of Christian Doctrine</cite>, Locus 6, aph. 3</span></figcaption>

<main class="wrap"><figure class="quote" id="q-0b42a848a4" data-kw="">
<blockquote><p>As for the maintenance and the continuance of the office of ruling elders, we love not unnecessary multiplication of questions, let every Church do herein what they find most convenient. The manner of our Church in these things is such as best befits the condition of the same, and such as cannot be in reason condemned; Neither is a stipend, nor continuance in the function till death, essential to the ministry of the Church, but separable from the same. The Levites of old served not at all times, but by course, and when they were 50 years old, they were wholly liberat[ed], from the burden and labor (though not from the attendance) of the Levitical service; and ministers may still upon the Church’s permission, for lawful reasons and urgent necessities, be absent a whole year, and longer too, from their particular charges. The apostles, when they were first sent through Judea, took no stipend, Mt. 10:8-9. Neither did Paul take any at Corinth, 1 Cor. 9:18. The ministers among the Waldenses work with their hands for their maintenance. The old patriarchs were priests and preachers to their families, and maintained themselves by the work of their hands, feeding of flocks, tilling the ground, etc. These things I do not mention as rules, to be followed by us, but to show, that the intermission of the exercise of the ministry, the want of maintainance and laboring with the hands, are not altogether repugnant, nor inconsistent with the nature of the vocation of the ministers of the Word, but in some cases hic &amp; nunc [here and now], may be most approveable in them: much more in ruling elders. The revenues of our Church are so small that they cannot spare stipends to ruling elders, which makes them willing to serve without stipends; and lest they should be overburdened with this their service, though they be chosen and called to be ruling elders as long as they live, at least till they merit to be deposed, yet our book of policy [Second Book of Discipline] allows them that ease of intermission and serving by course which was allowed to the Levites of old in the Temple. The double honor which the apostle commands to give unto elders that rule well, 1 Tim. 5:17, needs not to be expounded of maintenance and obedience; for by double honor we may either simply understand much honor, or by way of comparison double honor in respect of the widows, whom he had before commanded to honor, 1 Tim. 5:3, as Calvin expounds the place. Both these interpretations does Oecumenius give upon the same place.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/george-gillespie.html">George Gillespie</a></span><span class="wk"><span class="lbl">Work:</span> <cite>An Assertion of the Government of Scotland… (Edinburgh, 1641), pt, 1</cite>, ch. 14, pp. 104-6</span></figcaption>

</figure><figure class="quote" id="q-160069d067" data-kw="">
<blockquote><p>Paul gives rules and directions to Timothy (1 Tim. 5:1,19 and Titus 2) as to pastors, not as to believers, concerning the manner of receiving [Church] complaints, nor is there in Scripture precept, promise or practice of believers to receive complaints, we are surer than our Brethren [the congregationalists]; and it’s safer to expound this [phrase], ‘Tell the Church’ [Mt. 18:17], that is, ‘Tell Timothy and the Elders’ than, ‘Tell the church, that is, tell any member of the church at Corinth,’ i.e. tell any woman or servant [your formal complaint], for they are as essentially members as Timothy or any of the Elders, [Point] 2. and [these laypersons] must join their consent to censures because members must hear the scandals because they must tacitly consent before censures be dispensed; it follows not [however] that members must be told [of such formal complaints as an authoritative court, in the sense of Mt. 18:17], for [only] the tacit consent of women [to such Church censures of others] is requisite, for they may be scandalized or edified by the good or evil dispensing of censures as well as men.</p></blockquote>

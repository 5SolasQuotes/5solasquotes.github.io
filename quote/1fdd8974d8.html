</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-4f9f5bf5fb" data-kw="">
<blockquote><p>Moreover, God permits: (1) sometimes in express terms (Col. 2:16, 20–21; Gen. 2:16–17; Lev. 11:2–4), when he removes these or those things from among things prohibited; (2) sometimes only by nowhere prohibiting (cf. Rom. 14:14; Acts 10:15); (3) sometimes also in terms of commanding (Deut. 23:20; Gen. 1:28), just as in the same terms of commanding he sometimes expressly prohibits (Num. 22:20; John 13:27).</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/petrus-van-mastricht.html">Petrus van Mastricht</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Theoretical Practical Theology</cite>, (RHB), vol. 3, bk. 3, ch. 11, section 4, pp. 356-57</span></figcaption>

</figure><figure class="quote" id="q-c42a704acc" data-kw="">
<blockquote><p>We must then learn from Familists: … 4. Then the delivering up of the Kingdom spoken of, 1 Cor. 15, and the Day of Judgment is already begun, and is in doing these many centuries of years. So we heard before H. Nicholas say, even now in this present day does the Lord sit in his throne and judge the world. I rather believe Paul than Saltmarsh or H. Nicholas; for Paul says, 1 Cor. 15, speaking of the resurrection of our bodies, which I am sure the Familists have not yet seen, 1 Cor. 15:24, then comes the end, [Greek] etc. Then, when the resurrection of the body shall be, then shall be the end, when He shall render up the Kingdom to the Father. So the rendering up of the Kingdom to the Father (which Saltmarsh says, p. 72, is even now, when the day dawns and the day-star ariseth) shall not be till the end, and till the general Resurrection of all be: And therefore Saltmarsh misses a step in his new devised order, except he say with Libertines and Hen. Nicholas that the Resurrection is to be exponed spiritually, as Hymaeneus and Philetus said, and there shall be no more Resurrection, nor Day of Judgement, nor rendering of the Kingdom, nor Heaven nor Hell, but such as we see in this life (as it is most like[ly] Saltmarsh believes with all the nation of the Familists), for the administration of the Spirit is in this life, as well as the ministration of Law and Gospel were in this life. The Scripture speaks of the Day of Judgment as of a thing not yet come, 2 Thess. 2:2, ‘Let no man trouble you, neither by spirit, nor by word, nor by letter as from us, as that the day of Christ is at hand.’ Then some by the spirit of Scriptureless revelation, as now Anabaptists and Familists have said, the Day of Judgment was near, or begun in this life; yea, the Scripture says, it is a day appointed of God, Acts 17.31, and shows us the foregoing tokens of that day, beyond which there is no more time nor Gospel, as 1 Thess. 5:1-2; Mt. 24:22, 23, 36-47; Mt. 25:31 &amp; 46; 2 Pet. 3:1-3 &amp; 10-13 &amp; 1 Cor. 15:24-26. And what needed the Holy Ghost bid us watch and be sober, and beware that that Day come not on us unawares, and tell us, if we have not oil in our lamps at that nick of time when the shout shall be given that the Bridegroom is entered in his chamber, Mt. 25, there is no more place for repentance or buying oil, or any possibility of salvation when that day is once come; because if the day of judgment be now, and the rendering up the Kingdom to the Father, be in this life, how is it that so many daily repent and escape out of the snare of the Devil? And the market of buying oil in this life is not passed: For Peter, Acts 8, wills Simon Magus, while he lives, to repent and sue for pardon. And so the time of the offered Gospel and the Day of Judgment cannot be both together, Paul could never say, 1 Cor. 3, I could not write to you as to spirituall, but as to carnal, except he meant that he wrote to some spiritual man, nor could he say, the spiritual man discerns all things except the last ministration, which is the spiritual ministration, were begun in the time that Paul wrote to the Corinthians, and then began the ministration of the Spirit, and our seeing of the Lord with open face, 2 Cor. 3, and so then was the rising of the dead, and the rendering of the Kingdom to the Father. And where are we now, if the dead have been a rising now these fifteen hundred years, and a dying all this [time?]; For Saltmarsh assured us that the [???] of the Kingdome is not in the end of world, when the fulness of time or ages is come, but it is a [???] in parts, till the fulness of the stature of [???], Eph. 4:11-13, that we meet all in Heaven, and the Lord Jesus his mystical body be filled up and perfected, and so long as pastors, teachers and a ministry shall be on earth, and when this shall be, the Scripture tells when the end shall come, 1 Cor. 15:24, and when all rule, power and authority shall be put down, and Christ’s enemies subdued, and when all things shall be subdued. Now this is not in this life.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/samuel-rutherford.html">Samuel Rutherford</a></span><span class="wk"><span class="lbl">Work:</span> <cite>A Survey of the Spiritual Antichrist, Opening the Secrets of Familism &amp; Antinomianism</cite>, ... (London, 1648) | pt. 1 | ch. 19, ‘Saltmarsh with Familists Phancyeth Diverse New Administrations of the Law, of John Baptist, of the Gospel, of All Spirits’</span></figcaption>

+at+hand.%E2%80%99+Then+some+by+the+spirit+of+Scriptureless+revelation%2C+as+now+Anabaptists+and+Familists+have+said%2C+the+Day+of+Judgment+was+near%2C+or+begun+in+this+life%3B+yea%2C+the+Scripture+says%2C+it+is+a+day+appointed+of+God%2C+Acts+17.31%2C+and+shows+us+the+foregoing+tokens+of+that+day%2C+beyond+which+there+is+no+more+time+nor+Gospel%2C+as+1+Thess.+5%3A1-2%3B+Mt.+24%3A22%2C+23%2C+36-47%3B+Mt.+25%3A31+%26+46%3B+2+Pet.+3%3A1-3+%26+10-13+%26+1+Cor.+15%3A24-26.+And+what+needed+the+Holy+Ghost+bid+us+watch+and+be+sober%2C+and+beware+that+that+Day+come+not+on+us+unawares%2C+and+tell+us%2C+if+we+have+not+oil+in+our+lamps+at+that+nick+of+time+when+the+shout+shall+be+given+that+the+Bridegroom+is+entered+in+his+chamber%2C+Mt.+25%2C+there+is+no+more+place+for+repentance+or+buying+oil%2C+or+any+possibility+of+salvation+when+that+day+is+once+come%3B+because+if+the+day+of+judgment+be+now%2C+and+the+rendering+up+the+Kingdom+to+the+Father%2C+be+in+this+life%2C+how+is+it+that+so+many+daily+repent+and+escape+out+of+the+snare+of+the+Devil%3F+And+the+market+of+buying+oil+in+this+life+is+not+passed%3A+For+Peter%2C+Acts+8%2C+wills+Simon+Magus%2C+while+he+lives%2C+to+repent+and+sue+for+pardon.+And+so+the+time+of+the+offered+Gospel+and+the+Day+of+Judgment+cannot+be+both+together%2C+Paul+could+never+say%2C+1+Cor.+3%2C+I+could+not+write+to+you+as+to+spirituall%2C+but+as+to+carnal%2C+except+he+meant+that+he+wrote+to+some+spiritual+man%2C+nor+could+he+say%2C+the+spiritual+man+discerns+all+things+except+the+last+ministration%2C+which+is+the+spiritual+ministration%2C+were+begun+in+the+time+that+Paul+wrote+to+the+Corinthians%2C+and+then+began+the+ministration+of+the+Spirit%2C+and+our+seeing+of+the+Lord+with+open+face%2C+2+Cor.+3%2C+and+so+then+was+the+rising+of+the+dead%2C+and+the+rendering+of+the+Kingdom+to+the+Father.+And+where+are+we+now%2C+if+the+dead+have+been+a+rising+now+these+fifteen+hundred+years%2C+and+a+dying+all+this+%5Btime%3F%5D%3B+For+Saltmarsh+assured+us+that+the+%5B%3F%3F%3F%5D+of+the+Kingdome+is+not+in+the+end+of+world%2C+when+the+fulness+of+time+or+ages+is+come%2C+but+it+is+a+%5B%3F%3F%3F%5D+in+parts%2C+till+the+fulness+of+the+stature+of+%5B%3F%3F%3F%5D%2C+Eph.+4%3A11-13%2C+that+we+meet+all+in+Heaven%2C+and+the+Lord+Jesus+his+mystical+body+be+filled+up+and+perfected%2C+and+so+long+as+pastors%2C+teachers+and+a+ministry+shall+be+on+earth%2C+and+when+this+shall+be%2C+the+Scripture+tells+when+the+end+shall+come%2C+1+Cor.+15%3A24%2C+and+when+all+rule%2C+power+and+authority+shall+be+put+down%2C+and+Christ%E2%80%99s+enemies+subdued%2C+and+when+all+things+shall+be+subdued.+Now+this+is+not+in+this+life.%E2%80%9D%0A%0A%E2%80%94+Samuel+Rutherford%2C+A+Survey+of+the+Spiritual+Antichrist...+%28London%2C+1648%29+%7C+pt.+1+%7C+ch.+19%2C+%E2%80%98Saltmarsh+with+Familists+Phancyeth+Diverse+New+Administrations+of+the+Law%2C+of+John+Baptist%2C+of+the+Gospel%2C+of+All+Spirits%E2%80%99&amp;url=https%3A%2F%2F5solasquotes.github.io%2Fquote%2Fc42a704acc.html&amp;via=5Solas" target="_blank" rel="noopener">Share on X</a><a class="perma" href="../quote/c42a704acc.html">Permalink</a><a class="src" href="https://reformedbooksonline.com/on-hyper-preterism/#:~:text=We%20must%20then%20learn%20from%20Familists,this%20is%20not%20in%20this%20life&amp;text=We%20must%20then%20learn%20from%20Familists&amp;text=subdued.%20Now%20this%20is%20not%20in%20this%20life" rel="noopener" target="_blank">Read it online · Reformed Books Online</a></div>

<blockquote><p>4. ‘By this the justified man lives and abides’ (as Towne says) ‘forever, by faith, in the sight of God.’ But what haste? The Resurrection is not past yet, except Antinomians with Familists follow Hymeneus and Phyletus: [1.] Nor are the justified yet glorified; they abide not ever under God’s eye sinless and as clean as Christ (as Eaton blasphemes to his everlasting shame), for the Jebusite (says Towne) remains in the land, the law of the members and sinful corruption of the flesh dwells in them.

2. They must say daily, ‘Forgive us our sins,’ if God be their Father, else they need not pray daily, ‘hallowed be thy name, thy kingdom come,’ etc.

3. The flesh of sin dwells with the Spirit, Rom. 7, while they live.

4. Death is not an imaginary lie and fancy, so as faith must believe the contradicent [contrary], that is, that believers’ breath goes not out, they return not to their dust, [rather] they are to believe, sure, believers see corruption, Acts 13:36; 2:27-29; 1 Cor. 15:42-44. Then Antinomians cannot say true[ly] that there is no more sin in believers, nor anything having the nature and being of sin, than is in Christ.

5. They are not yet enjoying God in a vision of glory, as Christ did, even in the days of his flesh, for He was both ‘viator’ [wayfarer] and ‘comprehensor’ [attainer], a traveller to the crown and an enjoyer of the crown, and therefore though justified, they must walk here below, and cannot choose but sin, though they be ‘not forced’ to sin (as Towne says).</p></blockquote>

<div class="actions"><button class="copy" data-copy="“4. ‘By this the justified man lives and abides’ (as Towne says) ‘forever, by faith, in the sight of God.’ But what haste? The Resurrection is not past yet, except Antinomians with Familists follow Hymeneus and Phyletus: [1.] Nor are the justified yet glorified; they abide not ever under God’s eye sinless and as clean as Christ (as Eaton blasphemes to his everlasting shame), for the Jebusite (says Towne) remains in the land, the law of the members and sinful corruption of the flesh dwells in them.

2. They must say daily, ‘Forgive us our sins,’ if God be their Father, else they need not pray daily, ‘hallowed be thy name, thy kingdom come,’ etc.

3. The flesh of sin dwells with the Spirit, Rom. 7, while they live.

4. Death is not an imaginary lie and fancy, so as faith must believe the contradicent [contrary], that is, that believers’ breath goes not out, they return not to their dust, [rather] they are to believe, sure, believers see corruption, Acts 13:36; 2:27-29; 1 Cor. 15:42-44. Then Antinomians cannot say true[ly] that there is no more sin in believers, nor anything having the nature and being of sin, than is in Christ.

5. They are not yet enjoying God in a vision of glory, as Christ did, even in the days of his flesh, for He was both ‘viator’ [wayfarer] and ‘comprehensor’ [attainer], a traveller to the crown and an enjoyer of the crown, and therefore though justified, they must walk here below, and cannot choose but sin, though they be ‘not forced’ to sin (as Towne says).”

— Samuel Rutherford, A Survey of the Spiritual Antichrist, Opening the Secrets of Familism &amp; Antinomianism, ... (London, 1648) | pt. 2 | ch. 58, ‘Antinomians teach, believers must not walk in their conversation as in the sight of God, but must live by faith with God’, p. 103">Copy</button><a class="share" href="https://x.com/intent/post?text=%E2%80%9C4.+%E2%80%98By+this+the+justified+man+lives+and+abides%E2%80%99+%28as+Towne+says%29+%E2%80%98forever%2C+by+faith%2C+in+the+sight+of+God.%E2%80%99+But+what+haste%3F+The+Resurrection+is+not+past+yet%2C+except+Antinomians+with+Familists+follow+Hymeneus+and+Phyletus%3A+%5B1.%5D+Nor+are+the+justified+yet+glorified%3B+they+abide+not+ever+under+God%E2%80%99s+eye+sinless+and+as+clean+as+Christ+%28as+Eaton+blasphemes+to+his+everlasting+shame%29%2C+for+the+Jebusite+%28says+Towne%29+remains+in+the+land%2C+the+law+of+the+members+and+sinful+corruption+of+the+flesh+dwells+in+them.+2.+They+must+say+daily%2C+%E2%80%98Forgive+us+our+sins%2C%E2%80%99+if+God+be+their+Father%2C+else+they+need+not+pray+daily%2C+%E2%80%98hallowed+be+thy+name%2C+thy+kingdom+come%2C%E2%80%99+etc.+3.+The+flesh+of+sin+dwells+with+the+Spirit%2C+Rom.+7%2C+while+they+live.+4.+Death+is+not+an+imaginary+lie+and+fancy%2C+so+as+faith+must+believe+the+contradicent+%5Bcontrary%5D%2C+that+is%2C+that+believers%E2%80%99+breath+goes+not+out%2C+they+return+not+to+their+dust%2C+%5Brather%5D+they+are+to+believe%2C+sure%2C+believers+see+corruption%2C+Acts+13%3A36%3B+2%3A27-29%3B+1+Cor.+15%3A42-44.+Then+Antinomians+cannot+say+true%5Bly%5D+that+there+is+no+more+sin+in+believers%2C+nor+anything+having+the+nature+and+being+of+sin%2C+than+is+in+Christ.+5.+They+are+not+yet+enjoying+God+in+a+vision+of+glory%2C+as+Christ+did%2C+even+in+the+days+of+his+flesh%2C+for+He+was+both+%E2%80%98viator%E2%80%99+%5Bwayfarer%5D+and+%E2%80%98comprehensor%E2%80%99+%5Battainer%5D%2C+a+traveller+to+the+crown+and+an+enjoyer+of+the+crown%2C+and+therefore+though+justified%2C+they+must+walk+here+below%2

<blockquote><p>[S]eek him in the word and sacraments, where he discovers himself familiarly … And how familiarly by the sacrament, by common bread and common wine, sanctified to do great matters above nature, to strengthen faith. He cometh to us through our faces, into our souls in the sacrament … He comes by familiar things, and by a familiar manner of conveying, as if he should name every one, ‘I come to thee, and give thee my body.’ Think with ourselves, Now Christ cometh to me; when the minister reacheth the bread and comes to me, think of heavenly bread, and of the gift of Christ to me by the means.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/richard-sibbes.html">Richard Sibbes</a></span><span class="wk"><span class="lbl">Work:</span> <cite>A Heavenly Conference</cite>, (1654; Edinburgh: Banner of Truth, 2015), pp 21-22.</span></figcaption>

</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-de0e31b76d" data-kw="">
<blockquote><p>XXV. Next follow the actions of the disciples, and consequently of the other guests. And these, according to Christ’s appointment, are three: first, to receive both the bread and the cup; but each separately, for so Christ distributed them: in this manner he commanded his people to take them; thus the body of Christ, as broken for us; his blood as poured out of his body, are more distinctly represented; and in fine, as a complete entertainment requires both meat and drink, so this most complete spiritual repast which we have in Christ, is thus most excellently represented. And therefore we cannot so well approve of that custom which prevailed in Cyprian’s time, to give a piece of bread dipt in wine to infants and the sick; which was the practice in some places, about the year of Christ 340, in the public and ordinary celebration of the sacrament. The same judgment we are to pass on the custom of the Greeks, who crumble the consecrated bread into the wine, and take it out with a spoon.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/herman-witsius.html">Herman Witsius</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Economy of the Covenants between God and Man</cite>, trans. William Crookshank, vol. 2 (London: T. Tegg &amp; Son, 1837), 4.17.27 (2.452). HT: Amy Warren.</span></figcaption>

</figure><figure class="quote" id="q-724305aa3c" data-kw="">
<blockquote><p>In and by the lawful use of the Lord’s Supper, the sealing of grace will progress to its highest degree and will be certain and infallibly secure. (Matt. 26:26; 1 Cor. 10:16-17; Ps. 93:5).

It is therefore erroneous … that some, because they are so weak in the faith and have so little assurance of their salvation, at times abstain from partaking of the Lord’s Supper. They dare not partake because they lack assurance.

Instead, however, they should partake in order to attain such assurance. The Lord’s Supper is the pledge or wedding ring whereby it pleases Christ to enlarge our hearts in a more powerful and lively manner. If we were always emotionally engaged and always steadfast in our walk, the Lord’s Supper would not be needed. All the more reason for us to partake, for it is here that we most frequently fail. Who would refrain from eating because he is too weak? Precisely, then, one ought to eat in order to become stronger.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/guiljelmus-saldenus.html">Guiljelmus Saldenus</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Efficacy of the Lord’s Supper to the Comfort and Sanctification of God’s Children</cite>, (1664), trans. Bartel Elshout in James A. De Jong (ed.), In Remembrance of Him: Profiting from the Lord’s Supper (Grand Rapids MI: Reformation Heritage Books, 2012), pp 55-56.</span></figcaption>

<blockquote><p>Question 9 [to objectors]: Should we not in doubtful cases take the safer side? And is it not safer to do as Christ and his apostles and his Church for many hundred years did, than to follow the novelties of later times? Is it not certain that where there is no law, there is no transgression? and I know of no law binding us to receive kneeling: therefore for my part I cannot fear that Christ will condemn me for following his own, his apostles’ and his Church’s example, when he never gave me a word to the contrary. Objection: If Christ’s example bind to sit, then you must also imitate Him in doing it in an upper room, and but to twelve, etc. Answer:

1. This objection is nothing to our question. For we be not affirming that sitting is necessary, but that it is certainly lawful, and that kneeling is not such a duty, as that men should refuse communion with a church for want of it.

2. Both the known reasons of the thing, and the after practices of the Church do assure us that Christ’s administering in an upper room, and but to twelve, and not to women, were all occasional and mutable; and the Churches did otherwise: But for a feasting gesture there is no such proof.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/richard-baxter.html">Richard Baxter</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Christian Concord</cite>, (London: A.M., 1653), ‘Objections Answered’, pp. 91-92</span></figcaption>

<blockquote><p>Andrew Willet criticised Richard Hooker for what he perceived as the latter’s undermining of the seriousness of the error of transubstantiation:

The Church of England pronounceth, that The Transubstantiation of the bread and wine in the Eucharist, can not be proved by the sacred Scripture, but is against plain words of Scripture, overturneth the nature of the sacrament, &amp; hath give occasion of many superstitions.

And for this cause our Reverend Fathers call it: A monstrous &amp; blasphemous doctrine: bringing in doubt the truth of Christ’s body. Contrary to Christ’s words, saying: It is expedient that I go away, Joh. 16. 7. and to that of Peter: Whom the heavens must contain until the time that all things be restored, Act. 3. 21. disagreeing from the articles of faith, He ascended into heaven, sitteth at the right hand of God the Father, &amp;c. making void the institution of Christ, which is to continue till he come, &amp;c. casting holy things to profane, as whoremongers, murderers, &amp;c. mise and dogs to receive the true real body of Christ. causing most cruel eating of man’s flesh, and many monstrous miracles: accidents without subjects: the body of Christ without his qualities and true manner of a body: nourishing the Marcionist to believe the phantastical body of Christ, and Eutychians confounding the two natures of Christ, and therefore they which affirm transubstantiation are indeed right Sacramentaries and Capernaites.

In regard whereof we intreat you Mai. Hoo[ker]. to make a fit construction of your words, were you say: Sith we all agree that by the sacrament, Christ doth really and truly in us perform his promise: why do we vainly trouble our selves with so fierce contentions. whether by consubstantiation or else by transubstantiation the sacrament it self be first possessed with Christ or no: a thing which no way can either further or hinder us howsoever it stand, because our participation of Christ in the Sacrament, dependeth on the cooperation of his omnipotent power, which maketh it his body and blood unto us, whether with change or without alteration of the element, such as they imagine, we need not greatly to care nor inquire after. In all which words you seem to make light of the doctrine of transubstantiation, as a matter not to be stood upon or to be contended for, cared for or enquired into:

Which maketh us to marvel how our Church and Reverend Fathers have all this time passed, been deceived. What should cause them to affirm it to be a thing contrary to the plain words of scripture, overturning the nature of the Sacrament, to call it monstrous doctrine: why so many reverend Fathers, as Crammer, Ridley, Hooper, Latimer, Rogers, Bradford, &amp;c. have given their lives in witness against it, if it bee a thing that neither furthereth nor hindreth, a thing not to be cared for, nor enquired after? And here we pray you ingeniously to shew whether your meaning be to bring that side into credit by softening the odiousness of their heresy, and our side into suspicion of peevishness, for standing upon trifles; which the rather we desire to be resolved in, because else where you call the enemies to Transubstantiation Sacramentaries, and labour to shew a certain ubiquity of Christ’s manhood and of his body, and of his soul, which seemeth to us that you would give a gentle construction of Popish opinions, and privily rob the truth of our English creed of her due estimation.

If you call our Reverend Fathers Sacramentaries for oppugning transubst. and they again call the maintainers of it right Sacramentaries and Capernaites (if you have given as good testimony of faithfulness as they) whom shall wee believe? are you not contradictory: and may we think you can favour that side; your words do beat down; shew us then we pray you how such great favours do not prejudice the doctrine of the church of England, or not condemn those millions of learned divines and blessed Martyrs of extreme folly, who have died for the same; and that God should reveal to you only that it was for that which neither furthered nor hurteth?

Lastly instruct us whether the institution of the Sacrament by Christ, saying: this is my body: do this in remembrance of me, be not the true and right making of it Christ’s body and blood unto us: and upon what ground of Scripture it may be proved, that the cooperation of his omnipotent power doeth make it his body and blood unto us, and in what sense: And whether such phrases do not help the Popish argument of God’s power which they commonly use to approve their transubstantiation.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/andrew-willet.html">Andrew Willet</a></span><span class="wk"><span class="lbl">Work:</span> <cite>A Christian letter of certain English protestants, unfained favourers of the present state of religion, authorised and professed in England: unto that reverend and learned man, Mr R. Hoo[ker] requiring resolution in certain matters of doctrine (which seem to overthrow the foundation of Christian rel</cite>, (Middelburg: Richard Schilders, 1599), pp 33-35.</span></figcaption>

The Church of England pronounceth, that The Transubstantiation of the bread and wine in the Eucharist, can not be proved by the sacred Scripture, but is against plain words of Scripture, overturneth the nature of the sacrament, &amp; hath give occasion of many superstitions.

And for this cause our Reverend Fathers call it: A monstrous &amp; blasphemous doctrine: bringing in doubt the truth of Christ’s body. Contrary to Christ’s words, saying: It is expedient that I go away, Joh. 16. 7. and to that of Peter: Whom the heavens must contain until the time that all things be restored, Act. 3. 21. disagreeing from the articles of faith, He ascended into heaven, sitteth at the right hand of God the Father, &amp;c. making void the institution of Christ, which is to continue till he come, &amp;c. casting holy things to profane, as whoremongers, murderers, &amp;c. mise and dogs to receive the true real body of Christ. causing most cruel eating of man’s flesh, and many monstrous miracles: accidents without subjects: the body of Christ without his qualities and true manner of a body: nourishing the Marcionist to believe the phantastical body of Christ, and Eutychians confounding the two natures of Christ, and therefore they which affirm transubstantiation are indeed right Sacramentaries and Capernaites.

In regard whereof we intreat you Mai. Hoo[ker]. to make a fit construction of your words, were you say: Sith we all agree that by the sacrament, Christ doth really and truly in us perform his promise: why do we vainly trouble our selves with so fierce contentions. whether by consubstantiation or else by transubstantiation the sacrament it self be first possessed with Christ or no: a thing which no way can either further or hinder us howsoever it stand, because our participation of Christ in the Sacrament, dependeth on the cooperation of his omnipotent power, which maketh it his body and blood unto us, whether with change or without alteration of the element, such as they imagine, we need not greatly to care nor inquire after. In all which words you seem to make light of the doctrine of transubstantiation, as a matter not to be stood upon or to be contended for, cared for or enquired into:

Which maketh us to marvel how our Church and Reverend Fathers have all this time passed, been deceived. What should cause them to affirm it to be a thing contrary to the plain words of scripture, overturning the nature of the Sacrament, to call it monstrous doctrine: why so many reverend Fathers, as Crammer, Ridley, Hooper, Latimer, Rogers, Bradford, &amp;c. have given their lives in witness against it, if it bee a thing that neither furthereth nor hindreth, a thing not to be cared for, nor enquired after? And here we pray you ingeniously to shew whether your meaning be to bring that side into credit by softening the odiousness of their heresy, and our side into suspicion of peevishness, for standing upon trifles; which the rather we desire to be resolved in, because else where you call the enemies to Transubstantiation Sacramentaries, and labour to shew a certain ubiquity of Christ’s manhood and of his body, and of his soul, which seemeth to us that you would give a gentle construction of Popish opinions, and privily rob the truth of our English creed of her due estimation.

If you call our Reverend Fathers Sacramentaries for oppugning transubst. and they again call the maintainers of it right Sacramentaries and Capernaites (if you have given as good testimony of faithfulness as they) whom shall wee believe? are you not contradictory: and may we think you can favour that side; your words do beat down; shew us then we pray you how such great favours do not prejudice the doctrine of the church of England, or not condemn those millions of learned divines and blessed Martyrs of extreme folly, who have died for the same; and that God should reveal to you only that it was for that which neither furthered nor hurteth?

Lastly instruct us whether the institution of the Sacrament by Christ, saying: this is my body: do this in remembrance of me, be not the true and right making of it Christ’s body and blood unto us: and upon what ground of Scripture it may be proved, that the cooperation of his omnipotent power doeth make it his body and blood unto us, and in what sense: And whether such phrases do not help the Popish argument of God’s power which they commonly use to approve their transubstantiation.”

— Andrew Willet, A Christian letter of certain English protestants, unfained favourers of the present state of religion, authorised and professed in England: unto that reverend and learned man, Mr R. Hoo[ker] requiring resolution in certain matters of doctrine (which seem to overthrow the foundation of Christian rel, (Middelburg: Richard Schilders, 1599), pp 33-35.">Copy</button><a class="share" href="https://x.com/intent/post?text=%E2%80%9CAndrew+Willet+criticised+Richard+Hooker+for+what+he+perceived+as+the+latter%E2%80%99s+undermining+of+the+seriousness+of+the+error+of+transubstantiation%3A%0A%0AThe+Church+of+England+pronounceth%2C+that+The+Transubstantiation+of+the+bread+and+wine+in+the+Eucharist%2C+can+not+be+proved+by+the+sacred+Scripture%2C+but+is+against+plain+words+of+Scripture%2C+overturneth+the+nature+of+the+sacrament%2C+%26+hath+give+occasion+of+many+superstitions.%0A%0AAnd+for+this+cause+our+Reverend+Fathers+call+it%3A+A+monstrous+%26+blasphemous+doctrine%3A+bringing+in+doubt+the+truth+of+Christ%E2%80%99s+body.+Contrary+to+Christ%E2%80%99s+words%2C+saying%3A+It+is+expedient+that+I+go+away%2C+Joh.+16.+7.+and+to+that+of+Peter%3A+Whom+the+heavens+must+contain+until+the+time+that+all+things+be+restored%2C+Act.+3.+21.+disagreeing+from+the+articles+of+faith%2C+He+ascended+into+heaven%2C+sitteth+at+the+right+hand+of+God+the+Father%2C+%26c.+making+void+the+institution+of+Christ%2C+which+is+to+continue+till+he+come%2C+%26c.+casting+holy+things+to+profane%2C+as+whoremongers%2C+murderers%2C+%26c.+mise+and+dogs+to+receive+the+true+real+body+of+Christ.+causing+most+cruel+eating+of+man%E2%80%99s+flesh%2C+and+many+monstrous+miracles%3A+accidents+without+subjects%3A+the+body+of+Christ+without+his+qualities+and+true+manner+of+a+body%3A+nourishing+the+Marcionist+to+believe+the+phantastical+body+of+Christ%2C+and+Eutychians+confounding+the+two+natures+of+Christ%2C+and+therefore+they+which+affirm+transubstantiation+are+indeed+right+Sacramentaries+and+Capernaites.%0A%0AIn+regard+whereof+we+intreat+you+Mai.+Hoo%5Bker%5D.+to+make+a+fit+construction+of+your+words%2C+were+you+say%3A+Sith+we+all+agree+that+by+the+sacrament%2C+Christ+doth+really+and+truly+in+us+perform+his+promise%3A+why+do+we+vainly+trouble+our+selves+with+so+fierce+contentions.+whether+by+consubstantiation+or+else+by+transubstantiation+the+sacrament+it+self+be+first+possessed+with+Christ+or+no%3A+a+thing+which+no+way+can+either+further+or+hinder+us+howsoever+it+stand%2C+because+our+participation+of+Christ+in+the+Sacrament%2C+dependeth+on+the+cooperation+of+his+omnipotent+power%2C+which+maketh+it+his+body+and+blood+unto+us%2C+whether+with+change+or+without+alteration+of+the+element%2C+such+as+they+imagine%2C+we+need+not+greatly+to+care+nor+inquire+after.+In+all+which+words+you+seem+to+make+light+of+the+doctrine+of+transubstantiation%2C+as+a+matter+not+to+be+stood+upon+or+to+be+contended+for%2C+cared+for+or+enquired+into%3A%0A%0AWhich+maketh+us+to+marvel+how+our+Church+and+Reverend+Fathers+have+all+this+time+passed%2C+been+deceived.+What+should+cause+them+to+affirm+it+to+be+a+thing+contrary+to+the+plain+words+of+scripture%2C+overturning+the+nature+of+the+Sacrament%2C+to+call+it+monstrous+doctrine%3A+why+so+many+reverend+Fathers%2C+as+Crammer%2C+Ridley%2C+Hooper%2C+Latimer%2C+Rogers%2C+Bradford%2C+%26c.+have+given+their+lives+in+witness+against+it%2C+if+it+bee+a+thing+that+neither+furthereth+nor+hindreth%2C+a+thing+not+to+be+cared+for%2C+nor+enquired+after%3F+And+here+we+pray+you+ingeniously+to+shew+whether+your+meaning+be+to+bring+that+side+into+credit+by+softening+the+odiousness+of+their+heresy%2C+and+our+side+into+suspicion+of+peevishness%2C+for+standing+upon+trifles%3B+which+the+rather+we+desire+to+be+resolved+in%2C+because+else+where+you+call+the+enemies+to+Transubstantiation+Sacramentaries%2C+and+labour+to+shew+a+certain+ubiquity+of+Christ%E2%80%99s+manhood+and+of+his+body%2C+and+of+his+soul%2C+which+seemeth+to+us+that+you+would+give+a+gentle+construction+of+Popish+opinions%2C+and+privily+rob+the+truth+of+our+English+creed+of+her+due+estimation.%0A%0AIf+you+call+our+Reverend+Fathers+Sacramentaries+for+oppugning+transubst.+and+they+again+call+the+maintainers+of+it+right+Sacramentaries+and+Capernaites+%28if+you+have+given+as+good+testimony+of+faithfulness+as+they%29+whom+shall+wee+believe%3F+are+you+not+contradictory%3A+and+may+we+think+you+can+favour+that+side%3B+your+words+do+beat+down%3B+shew+us+then+we+pray+you+how+such+great+favours+do+not+prejudice+the+doctrine+of+the+church+of+England%2C+or+not+condemn+those+millions+of+learned+divines+and+blessed+Martyrs+of+extreme+folly%2C+who+have+died+for+the+same%3B+and+that+God+should+reveal+to+you+only+that+it+was+for+that+which+neither+furthered+nor+hurteth%3F%0A%0ALastly+instruct+us+whether+the+institution+of+the+Sacrament+by+Christ%2C+saying%3A+this+is+my+body%3A+do+this+in+remembrance+of+me%2C+be+not+the+true+and+right+making+of+it+Christ%E2%80%99s+body+and+blood+unto+us%3A+and+upon+what+ground+of+Scripture+it+may+be+proved%2C+that+the+cooperation+of+his+omnipotent+power+doeth+make+it+his+body+and+blood+unto+us%2C+and+in+what+sense%3A+And+whether+such+phrases+do+not+help+the+Popish+argument+of+God%E2%80%99s+power+which+they+commonly+use+to+approve+their+transubstantiation.%E2%80%9D%0A%0A%E2%80%94+Andrew+Willet%2C+A+Christian+letter+of+certain+English+protestants%2C+unfained+favourers+of+the+present+state+of+religion%2C+authorised+and+professed+in+England%3A+unto+that+reverend+and+learned+man%2C+Mr+R.+Hoo%5Bker%5D+requiring+resolution+in+certain+matters+of+doctrine+%28which+seem+to+overthrow+the+foundation+of+Christian+rel%2C+%28Middelburg%3A+Richard+Schilders%2C+1599%29%2C+pp+33-35.&amp;url=https%3A%2F%2F5solasquotes.github.io%2Fquote%2F00e5058364.html&amp;via=5Solas" target="_blank" rel="noopener">Share on X</a><a class="perma" href="../quote/00e5058364.html">Permalink</a><a class="src" href="https://reformedcovenanter.wordpress.com/2020/08/26/andrew-willet-on-richard-hooker-and-tr

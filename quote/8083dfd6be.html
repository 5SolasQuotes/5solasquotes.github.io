<main class="wrap"><figure class="quote" id="q-8083dfd6be" data-kw="">
<blockquote><p>But lest we commit a mistake here, to the prejudice of Christ’s honour and glory, which must not be given to another, no not to faith itself; I promised you in the fourth place, to show you upon what account faith is thus dignified and honoured; that so we may give unto faith the things that are faith’s, and to Christ the things that are Christ’s.

And I find four opinions about the interest of faith in our justification: some will have it to justify us formally, not relatively: i.e. upon the account of his own intrinsical value and worth; and this is the popish sense of justification by faith. Some affirm, that though faith be not our perfect legal righteousness, considered as a work of ours, yet the act of believing is imputed to us for righteousness, i.e. God graciously accepts it instead of perfect legal righteousness, and so, in his esteem, it is our evangelical righteousness. And this is the Arminian sense of justification by faith.

Some there are also, even among our reformed divines, that contend that faith justifies and saves us, as it is the condition of the new covenant. And lastly, others will have it to justify us as an instrument apprehending, or receiving the righteousness of Christ; with which opinion I must close. When I consider my text calls it a receiving of Christ. Most certain it is,

That, First, It does not justify in the popish sense, upon the account of its own proper worth and dignity; for then,

First, Justification should be of debt, not of grace; contrary to Rom. iii. 23, 24.

Secondly, This would frustrate the very scope and end of the death of Christ; for if righteousness come by the law, i.e. by the way of works and desert, then is Christ dead in vain, Gal. ii. 21.

Thirdly, Then the way of our justification by faith would be so far from excluding, that it would establish boasting, expressly contrary to the apostle, Rom. iii. 26, 27.

Fourthly, Then there should be no defects or imperfections in faith, for a defective or imperfect thing can never be the matter of our justification before God: if it justify upon the account of its own worth and proper dignity, it can have no flaw or imperfection in it, contrary to the common sense of all believers. Nay,

Fifthly, Then it is the same thing to be justified by faith, and to be justified by works, which the apostle so carefully distinguisheth and opposeth, Phil. iii. 9. and Rom. iv. 6. So that we conclude it does not justify in the Popish sense, for any worth or proper excellency that is in itself.

Secondly, And it is as evident, it does not justify us in the Arminian sense, viz. as the to credere, the act of believing is imputed or accepted by God, as our evangelical righteousness, instead of perfect legal righteousness. In the former opinion you have the dregs of Popery, and here you have refined Popery. Let all Armenians know, we have as high an esteem for faith as any men in the world, but yet we will not rob Christ to clothe faith. We cannot embrace their opinion, because,

First, We must then dethrone Christ to exalt faith: we are willing to give it all that is due to it, but we dare not despoil Christ of his glory for faith’s sake: “He is the Lord our righteousness,” Jer. xxiii. We dare not set the servant above the master. We acknowledge no righteousness but what the obedience and satisfaction of Christ yields us. His blood, not our faith; his satisfaction, not our believing it, is the matter of our justification before God.

Secondly, We dare not yield this point, lest we undermine all the comfort of Christians, by setting their pardon and peace upon a weak imperfect work of their own. Oh how tottering and unstable must their station be, that stand upon such a bottom as this! What alterations are there in our faith, what mixtures of unbelief at all times, and prevalence of unbelief at some times; and is this a foundation to build our justification and hope upon? Debile fundamentum fallit opus: If we lay the stress here, we build upon very loose ground, and must be at a continual loss both as to safety and comfort.

Thirdly, We dare not wrong the justice and truth of God at that rate, as to affirm that he esteems and imputes our poor weak faith for perfect legal righteousness. We know that the judgement of God is always according to truth; if the justice of God require full payment, sure it will not say, it is fully satisfied by any acts of ours, when all that we can do amounts not to one mite of the vast sum we owe to God. So that we deservedly reject this opinion also.

Thirdly, And for the third opinion, That it justifies as the condition of the new covenant; though some of great name and worth among our Protestant divines seem to go that way, yet I cannot see, according to this opinion, any reason why repentance may not as properly be said to justify us as faith, for it is a condition of the new covenant as much as faith; and if faith justify as a condition, then every other grace that is a condition must justify as well as faith. I acknowledge faith to be a condition of the covenant, but cannot allow that it justifies as a condition.

And therefore must profess myself best satisfied in the last opinion, which speaks it an instrument in our justification: it is the hand which receives the righteousness of Christ that justifies us, and that gives it its value above all other graces; as when we say a diamond ring is worth one hundred pounds, we mean not the gold that receives, but the stone that is set in it, is worth so much. Faith, considered as an habit, is no more precious than other gracious habits are, but considered as an instrument to receive Christ and his righteousness, so it excels them all; … By faith, and through faith. And thus much of the nature and excellency of saving faith.</p></blockquote>

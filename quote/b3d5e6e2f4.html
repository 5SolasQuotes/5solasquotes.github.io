<main class="wrap"><figure class="quote" id="q-b3d5e6e2f4" data-kw="">
<blockquote><p>…the honor due to the means of worship, as the Bible, sacraments, which deserve not adoration, but only a negative reverence, or a not dispising or contemptuous handling of them; images being unlawful means, and not commanded of God, deserve no veneration at all;</p></blockquote>

</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-f9b50cc58d" data-kw="">
<blockquote><p>Let them [Independents] produce a particular Word for the order of God’s worship, what must be performed first, what second, what third, what fourth, and so of the rest, and that no ordinance nor part of worship may be in another order… let them produce what is required in the Word particularly, as the form of excommunication, or as the form of ordination; let them set down the outward worship and gesture of the external reverence which must be used, and no other way, in the several ordinances of God, as Word, prayer, singing of psalms, reading Scriptures, baptism, Lord’s Supper, excommunication, which if they cannot (as we know they are not able, neither in these nor many other things which may be named) let them then learn that many things in government and discipline have but general rules with equity of practices…</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/thomas-edwards.html">Thomas Edwards</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Reasons against the Independant Government of Particular Congregations</cite>, … (London, 1641), ‘Reasons Against the Independant Government of Particular Congregations’, p. 17</span></figcaption>

<blockquote><p>[The 2nd Commandment is practically broken] In respect of bodily posture, as if there were more religion in one posture than in another; as in receiving the Lord’s supper kneeling, or praying in such and such a posture, except in so far as it is decent, and otherwise rightly regulate[d] by rules of prudence and nature’s light.</p></blockquote>

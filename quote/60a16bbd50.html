<main class="wrap"><figure class="quote" id="q-60a16bbd50" data-kw="">
<blockquote><p>As your heavenly Father has a common love, which he extends to all mankind, in supplying their necessities, with the light and warmth of the sun, and with the rain; as well as a special love and favor, which He exercises only toward those that are good, and members of Christ; so ought you to have: though you are not obliged to take your enemies into your bosom, yet you ought to love them in their order. And as your heavenly Father, though he will one day have a satisfaction from sinners, for the wrong done to his majesty, unless they repent; yet, to heap coals of fire on their heads, gives them good things of common providence, that he might not leave them without witness, yea, and affords them the outward means of grace for their souls: so, although you are bound to seek some satisfaction for God’s honor and glory from flagitious sinners, and though you may in an orderly course seek a moderate satisfaction for the wrong done to yourselves, yet you ought to love them with a love consistent with these things; that so you may imitate your heavenly Father, and approve yourselves to be his children.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/john-collinges.html">John Collinges</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Other citations (work not named)</cite>, in Matthew Poole’s English Annotations on the Holy Bible</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/effectual-calling/common-grace.html">Common Grace</a></span></div>

ine</a></div>
</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-892ba504ee" data-kw="">
<blockquote><p>The second sort of divines (Contra-Remonstrants) [that is, those against the Arminians] distinguish the sufficiency and efficiency of Christ’s death. In respect of the worth and greatness of the price, He died for all men: because it was sufficient for the redemption of every man in the world if they did repent and believe; and God might, without impeachment of justice, have offered salvation to every man in the world had it been his pleasure. In the efficiency, as every man or any man has fruit by the death of Christ, so Christ died for him. But this is not of one kind: some fruit is common to every man; for as Christ is lord of all things in heaven and earth, even the earthly blessings which infidels enjoy may be termed fruits of Christ’s death. Others proper to the members of the visible Church, and common to them, as to be called by the word, enjoy the ordinances of grace, live under the covenant, partake of some graces that come from Christ, which, through their fault, be not saving; and in this sense Christ died for all that be under the covenant. But other fruits of Christ’s death, according to the will of God and intention of Christ as Mediator, be peculiar to the sheep of Christ, his brethren, them that be given unto him of the Father, as faith unfeigned, regeneration, pardon of sin, adoption, etc.; and so they hold Christ died efficiently for his people only, in this sense,–namely, so as to bring them effectually to faith, grace, and glory.</p></blockquote>

</figure><figure class="quote" id="q-f3d1a654ef" data-kw="">
<blockquote><p>4…. but the conscience is more dull in apprehending that spiritual vengeance follows such spiritual sins as unbelief, because until there be some supernatural revelation, we are dead to the Gospel truths, and Gospel sins, but when a common grace heightens the soul to a supernatural assent, that Christ is a Teacher sent of God (Jn. 7:28; Jn. 3:2), the conviction is more strong: But because it is more supernatural, and in stead of kindly affection of love which it wants [lacks], it is mixed with hatred and anger and so degenerates into fiery indignation against the Holy Ghost, as Jn. 15:24 compared with Mt.12:15; 26:31 clears.</p></blockquote>

<blockquote><p>Upon the stage of this world, mercy acts in part and shows itself in more objects, and in more instances, than the judgment of God does; that must have its course and triumph in the next world; here all sinners share, more or less, in the mercy of God. “The Lord is good to all” (Ps. 145:9) “He makes his rain to fall, and his sun to shine upon the just and the unjust.” (Matt 5:45).</p></blockquote>

<blockquote><p>We must not view these ways of talking about the love of God as independent, compartmentalized, loves of God… as if each were hermetically sealed off from the other… If you absolutize any one of these ways in which the Bible speaks of the love of God, you will generate a false system that squeezes out other important things the Bible says, thus finally distorting your vision of God.</p></blockquote>

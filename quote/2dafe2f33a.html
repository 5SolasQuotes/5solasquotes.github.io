<main class="wrap"><figure class="quote" id="q-2dafe2f33a" data-kw="">
<blockquote><p>After the unity of the Godhead asserted, here we have the nature of that one God described; and that by those properties, which the scriptures, that he hath revealed to us, and the reason that he hath implanted in us, attribute and ascribe unto him. Where by properties we are not to understand several faculties, habits, or qualities, as they are in us. For there is nothing in God, but what is God: the mercy of God is the same with the God of mercy; the power of God the same with the God of power; the love of God the same with the God of love; and the truth of God the same with the God of truth.

These properties of mercy, power, love, &amp;.c., as they are in us, they are accidents, and so really distinguished both from our souls, and from one another: but as they are in God, they are his nature and essence; and so neither distinguished from one another, nor from him in whom they are said to be. Distinguished from him or his essence they can- not be, for then he would be of himself imperfect; there being some property or perfection, which in his own nature he is not.

And again, if the properties of God should be really distinguished from himself, in themselves they would be either finite or infinite. Finite they could not all be; for infinitude itself is one of his properties, yea, and in our conception a property of all his other properties; so that his wisdom, power, justice, are all infinite, otherwise they would be imperfect: and therefore it is impossible all his properties, or indeed any of them, should be finite. And as they are not finite, so neither can they be infinite, if really distinguished from his essence: for then there would be something really distinguished from God infinite as well as God; and by consequence either God must not be infinite, and so not God; or else there must be two, yea, many infinites, which is as great an absurdity as the former.

And therefore we must needs acknowledge, that the properties of God are not really distinguished from the essence of God: but that the properties attributed to his essence are really the same with his essence to which they are attributed. So that his power, wisdom, goodness, truth, and the like, are all his essence, nature, or substance. And as they are not distinguished from his essence, so neither are they distinguished from one another; for then they must be really distinguished from his essence too, it being impossible that they should be all really and essentially distinct from one another, and yet be all but one and the self-same essence. And again, if they should be really distinguished from one another, then God would be compounded or made up of several distinct properties, and so not a simple, and therefore not a perfect God.

But by the properties therefore of God, we are to understand the several apprehensions that we have of him, according to the several manifestations that he maketh of himself to us. Which variety of discoveries of himself he maketh to us according to the variety of the objects which we apprehend him to act upon, and the variety of the circumstances that those objects may lie under. God in himself is a most simple and pure act, and therefore, as I have shewed, cannot have any thing in himself but himself, but what is that pure and simple act itself.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/william-beveridge.html">William Beveridge</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Ecclesia Anglicana Ecclesia Catholica; or, The Doctrine of the Church of England Consonant to Scripture, Reason, and Fathers: In a Discourse upon the Thirty-Nine Articles Agreed upon in the Convocation held at London MDLXII</cite>, in The Theological Works of William Beveridge, D.D. (12 vols, Oxford: John Henry Parker, 1842-48), 7: 13-15.</span></figcaption>

<blockquote><p>30. It is said by some very learned and reverend men, that God freely made the world, though He necessarily made it good; He freely made positive laws, though He necessarily made them wisely and just; He freely annexes threatenings to his laws, though necessarily they are just threatenings; He freely sentences or judges, though He necessarily judge justly; He freely executes his sentence by punishing, though He necessarily punish justly. And the reasons given, are:

1. Because God executes his sentence as Dominus [Lord].

2. Because his threatenings bind Him not to punish, but man to suffer.</p></blockquote>

<blockquote><p>[Y]et lo when death comes to end our work, when she stretcheth out her arms to pull us into the port, when after so many dangerous passages, and loathsome lodgings she would conduct us to our true home and resting place: instead of rejoicing at the end of our labour, of taking comfort at the sight of our land, of singing at the approach of our happy mansion, we would fain (who would believe it?) retake our work in hand, we would again hoist sail to the wind, and willingly undertake our journey anew.

No more, then, remember we our pains, our shipwrecks and dangers are forgotten: we fear no more the travels nor the thieves. Contrariwise, we apprehend death as an extreme pain, we doubt it as a rock, we flee it as a thief. … We fear that we ought to hope for, and wish for that we ought to fear. We call life a continual death: and death the issue of a living death, and the entrance of a never dying life.</p></blockquote>

<div class="meta"><span class="t"><a href="../topics/attributes-of-god/will-of-god.html">Will of God</a></span></div>
<div class="actions"><button class="copy" data-copy="“[Y]et lo when death comes to end our work, when she stretcheth out her arms to pull us into the port, when after so many dangerous passages, and loathsome lodgings she would conduct us to our true home and resting place: instead of rejoicing at the end of our labour, of taking comfort at the sight of our land, of singing at the approach of our happy mansion, we would fain (who would believe it?) retake our work in hand, we would again hoist sail to the wind, and willingly undertake our journey anew.

No more, then, remember we our pains, our shipwrecks and dangers are forgotten: we fear no more the travels nor the thieves. Contrariwise, we apprehend death as an extreme pain, we doubt it as a rock, we flee it as a thief. … We fear that we ought to hope for, and wish for that we ought to fear. We call life a continual death: and death the issue of a living death, and the entrance of a never dying life.”

— Philippe de Mornay, A discourse of life and death, trans. Countess of Pembroke (London: Mathew Lownes, 1608), unpaginated.">Copy</button><a class="share" href="https://x.com/intent/post?text=%E2%80%9C%5BY%5Det+lo+when+death+comes+to+end+our+work%2C+when+she+stretcheth+out+her+arms+to+pull+us+into+the+port%2C+when+after+so+many+dangerous+passages%2C+and+loathsome+lodgings+she+would+conduct+us+to+our+true+home+and+resting+place%3A+instead+of+rejoicing+at+the+end+of+our+labour%2C+of+taking+comfort+at+the+sight+of+our+land%2C+of+singing+at+the+approach+of+our+happy+mansion%2C+we+would+fain+%28who+would+believe+it%3F%29+retake+our+work+in+hand%2C+we+would+again+hoist+sail+to+the+wind%2C+and+willingly+undertake+our+journey+anew.%0A%0ANo+more%2C+then%2C+remember+we+our+pains%2C+our+shipwrecks+and+dangers+are+forgotten%3A+we+fear+no+more+the+travels+nor+the+thieves.+Contrariwise%2C+we+apprehend+death+as+an+extreme+pain%2C+we+doubt+it+as+a+rock%2C+we+flee+it+as+a+thief.+%E2%80%A6+We+fear+that+we+ought+to+hope+for%2C+and+wish+for+that+we+ought+to+fear.+We+call+life+a+continual+death%3A+and+death+the+issue+of+a+living+death%2C+and+the+entrance+of+a+never+dying+life.%E2%80%9D%0A%0A%E2%80%94+Philippe+de+Mornay%2C+A+discourse+of+life+and+death%2C+trans.+Countess+of+Pembroke+%28London%3A+Mathew+Lownes%2C+1608%29%2C+unpaginated.&amp;url=https%3A%2F%2F5solasquotes.github.io%2Fquote%2F487adb80fb.html&amp;via=5Solas" target="_blank" rel="noopener">Share on X</a><a class="perma" href="../quote/487adb80fb.html">Permalink</a><a class="src" href="https://reformedcovenanter.wordpress.com/2019/10/26/philippe-du-plessis-mornay-on-our-unwillingness-to-die/" rel="noopener" target="_blank">Read it online · Reformed Covenanter</a></div>

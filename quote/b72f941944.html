<main class="wrap"><figure class="quote" id="q-b72f941944" data-kw="">
<blockquote><p>Lastly, the names given to this sacrament, noting the nature thereof, do afford us a good consideration to strike through the heart of this private mass, being called sometimes the Supper of the Lord, and sometimes a Communion among ourselves. If it be an holy supper and spiritual banquet, why are none bidden and called thereunto? If it be a communion, why does the priest uncharitably swallow all alone? whereby they make it a communion, but without company: a supper, but without guests: meat, but without eating: drink, but without drinking: a table, but without sitting down: a participation, but without any that are partakers: a banquet, but without seeding thereat, the people departing as hungry and thirsty as they came. Wherefore, as no man celebrated the Passover aright, or received profit thereby, but such as did eat the flesh thereof: so can none come to the supper of the Lord as he ought, though he look upon others, except he eat of the bread and drink of the cup, according to the commandment of Christ, the author thereof. And thus much of the sole communions and private masses brought into the church against the example of Christ against the use of the apostles, and against the name and nature of the sacrament itself.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/william-attersoll.html">William Attersoll</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Badges of Christianity, or a Treatise of the Sacraments… (London, 1606), bk. 3, ‘Of the Lord’s Supper’</cite>, pp. 278-79</span></figcaption>

</figure><figure class="quote" id="q-80b701bb47" data-kw="">
<blockquote><p>In the [Scottish] Book of Common Order [‘The Order of Baptism’]… it is said that the sacraments are not ordained of God to be used in private corners, as charmers and sorcerers use[d] to do, but left to the congregation, and necessarily annexed to God’s Word as seals of the same. In the [general] assembly holden at Edinburgh… [Oct. 17,] 1581 [session 3], it was ordained that the sacraments be not ministered in private houses, but solemnly, according to the good order hitherto observed. But in the late pretended assembly holden at Perth, anno 1618, it was ordained [in its Acts] that the minister shall not refuse to baptize infants in private houses when great need compels the parents to crave it, but the great need is not specified, and therefore left to the judgement of every corrupt minister who shall be willing to pleasure his parishoner upon pretence of any alleged necessity, as a rainy day, or the saving of some charges [expenses], as a dinner, etc. Such like the minister must not refuse to administrate the communion in a private house beside him… It is required only that there be three or four of good religion and conversation present to communicate with him. But, which shakes all loose, these must be free of all impediments. What if they be not free? What suppose there were forty, let be four, if it be not celebrated in the congregation, it is but a private communion. … 2. …Because we cannot attain to a visible communion in the holy things of God immediately with the whole Church-militant, we enjoy it mediately by our communion in a particular congregation… … He [Dr. Lindsay] wrests also that place in Matthew [ch. 18], where Christ promised to be in the midst of two or three convened in his name, as if three or four convened to the administration of baptism or the Lord’s Supper, were a sufficient number to make up a lawful assembly… Christ speaks not there, as Master [Thomas] Cartwright has already answered, of the public administering of the Word and sacraments, but of the proceeding in the Church discipline. … It is a sinew of public assemblies, a hedge of our profession, a band of love and representation of our communion and fellowship, which is and ought to be among the members of the congregation. It is not a part, or two, or three, but the whole body of the congregation which is compared to one bread, when the apostle says, ‘We that are many are one bread, and one body, for we are partakers afore bread,’ 1 Cor. 10:17. Because it is not possible to us to celebrate a sacramental union with the whole Church militant, the Lord has appointed us to keep a sacramentall communion with some particular congregation or visible Church. … A company convened apart from the rest to communicate with the sick person is not united by themselves into the body of a Church, far less three of four, as take, the English [Anglican] service book means to be a number sufficient, seeing they allow the communion to be ministred to three or four in the Church, and in the time of plague, sweat, or such other like contagious sicknesses, the minister may communicate with the person diseased alone… says Bullinger (Decade 5, sermon 9). That is, ‘Seeing it is not a public or general meeting, when three or four communicate with the sick, they say nothing to purpose who say, that the supper may be celebrated beside the sick, if others also communicate.’ … The elements were sent to the absents in time, or immediately after the action in Justin Martyr’s time. Which was the first abuse we read of. After followed reservation of the eucharist for the use of the sick, which was a greater abuse, and carrying of it home to their houses. The opinion of the necessity of private communions did grow to such a height…</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/david-calderwood.html">David Calderwood</a></span><span class="wk"><span class="lbl">Work:</span> <cite>A Re-examination of the Five Articles enacted at Perth, anno 1618… (1636), ‘Of the Administration of the Sacraments in Private Places’</cite>, pp. 221-22, 224-25, 230-33</span></figcaption>

</figure><figure class="quote" id="q-001baf6d80" data-kw="">
<blockquote><p>Nor is it [baptism] to be administered in private places, or privately, but in the place of public worship, and in the face of the congregation, where the people may most conveniently see and hear; and not in the places where fonts, in the time of Popery, were unfitly and superstitiously placed.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/westminster-directory-of-public-worship.html">Westminster Directory of Public Worship</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Of the Administration of the Sacraments: and First, of Baptism</cite></span></figcaption>

<div class="actions"><button class="copy" data-copy="“Nor is it [baptism] to be administered in private places, or privately, but in the place of public worship, and in the face of the congregation, where the people may most conveniently see and hear; and not in the places where fonts, in the time of Popery, were unfitly and superstitiously placed.”

<blockquote><p>…it becometh not Mr. Hooker with Arminians and Socinians to impeach the wisdom of the Holy One, because He appoints the giving of the seals, baptism to Judas and to Magus, who have no right, true and real in foro Dei [in the court of God], in the Decree of God, and in his holy intention, as I spake [on] pp. 248, 249, to the seals, and the grace sealed; nor to the engraven Law, and God’s teaching of the heart, and to perseverance; .. Again, God giveth a right to the seals to hypocrites; that is, he commandeth the Church to give the seals to Magus, whether such really or hypocritically believe; this is a right not properly inherent in visible members, for their profession, yea, or their supposed conversion: 1. Because all saving and real right to ordinances is relative to election to glory, and flows from the merit of Christ’s death; but visible professors, as such, of whose society Magus and Judas are, have not any saving and real right, as chosen and redeemed in Christ, by grant of our [Congregationalist] Brethren. 2. A right flowing only from an external profession, and from composed hypocrisy in Magus, is no true right; a lie cannot give a true right: I offend that Mr. Hooker so anxiously contends for a charter to such bastards as Magus. 3. It is a favor to hear the Gospel and partake of the seals; and jus activum, ‘an active right’ the Church and ministers have to call and admit to the seals all who profess as Magus, that the elect in the visible Church may be converted, but it is not a right proprie dictum ne quidem Ecclesiasticum [properly said with certainty to the Church], that they have who are such hypocrites as Judas and Magus; for the command and revealed Will of God most unproperly is said to give Magus a right to the seals: Except [for] Mr. Hooker, never [a] divine so spake; the command reveals the right, but gives none. As also the right of visible professors is jus passivum, and a conditional and passive right; for Magus and Judas have no right to be visible members, or to partake of the seals, yea or to profess the Covenant and Name of God, Ps. 50:16, but upon condition of faith: for God cannot command sin and an hypocritical profession: yea, He forbids [their] treading in his courts, Isa. 1:12-13, except they repent and believe, vv. 16, 17; therefore Magus sins in professing, and in being baptized: he remaining rotten. But the Church sins not, but does the command of Christ in calling, inviting all that profess, whether they be really, or in the judgement of charity, converts or no. Which distinction not being observed, our [congregationalist] Brethren and Mr. Hooker mistake the nature of an ecclesiastical right; for the Lord in the command gives to all visible professors, such as Peter, who really believe, both the ecclesiastic and external right to the seals which He decreed to give them, and the same internal and real right which they have by faith, and no other than according to his eternal decree, they have given them in time by real believing. But for hypocrites, as Magus, they have no right ecclesiastic to the seals, but a sort of active and permissive right, by which they claim room in the visible Church, and the seals from the Church. Therefore taking the Church-visible as only visible, as contra-distinguished from the invisible and really believing: and as visibility is common to both Peter and Magus, and their external profession obvious to the eye of man, so the visible Church hath no right that is true and real to the seals. So I retort the Argument upon Mr. Hooker: True real believers, as Peter, and hypocrites, as Magus, have either one and the same Church-right to membership and seals, or another, and diverse. The same right they cannot have: 1. Because the right of truly and really believing ones, is according to the decree of election, such as the Lord ordained to be purchased to them by the merits of Christ, and also according to the Lord’s revealed Will. He who believes hath right to eat of the Tree of Life, and to membership and seals: But this right Magus and hypocrites have not, for they have no part in Christ. 2. The right that believers, as Peter and John, have, is by fulfilling of the condition. He who believes, and loves to be reformed, hath right to the Covenant, promises, to perseverance, to the anointing that teacheth all things. These are promised and decreed to them, Jer. 31:33-34 &amp; 32:38-40; Isa. 54:10-11 &amp; 59:20-21; compared with Acts 13:47-48; Jn. 6:44-46 &amp; 6:37 &amp; 10:26-27; and to them only, not to Magus and to reprobates. 3. Magus, and such like wooden and tree-legs, might claim the same life, living membership, lively and vital operations, and to have the anointing, and to be kept through faith unto salvation by the power of God, 1 Pet. 1:4 and to have the fear of God put in their hearts, that they should not depart from God, as Jer. 31:39-40, if they have the same right to membership and the seals in their substance and grace signified with sound believers. And this is most absurd.</p></blockquote>

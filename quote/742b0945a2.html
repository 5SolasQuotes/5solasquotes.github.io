<main class="wrap"><figure class="quote" id="q-742b0945a2" data-kw="">
<blockquote><p>…this penetrating essay examines the claims of the Plymouth Brethren and similar movements that sought to establish a “pure church” composed only of demonstrably regenerate believers. With historical learning, theological precision, and pastoral concern, Croskery argues that Scripture itself distinguishes between the visible and invisible church, and that attempts to create a perfectly pure communion on earth inevitably lead not to greater holiness, but to fragmentation, sectarianism, and spiritual pride.” – Blurb . 1900’s MacPherson, John – ‘Unity of the Church: The Sin of Schism’ (1901) 43 paragraphs from The Doctrine of the Church in Scottish Theology MacPherson was a minister in the Free Church of Scotland in the late 1800’s who here masterfully surveys the thought on the broadest unity of the church during the second reformation in Scotland (mid-1600’s). . 2000’s Winzer, Matthew – ‘A Review of Greg Barrow’s The Covenanted Reformation Defended‘ (2006) 18 paragraphs The jist of the Still Waters Revival’s claims, according to Dr. Richard Bacon, is that “they maintain that we can treat churches that lack the full well-being of the church just as we would treat a false church. Then they define full well-being as including the Solemn League and Covenant (1643) and several other documents that they refer to as ‘terms of communion.’ . . Books 1500’s Gifford, George A Short Treatise Against the Donatists of England, whom we call Brownists, wherein, by the Answers unto Certain Writings of theirs, Diverse of their Heresies are Noted, with Sundry Fantastical Opinions… (London, 1590) 110 pp. ToC Gifford (c. 1548–1600 or 1620?) was a non-conformist, English, puritan preacher at Maldon in Essex, England. John Greenwood replied to this work in, An Answer to George Gifford’s Pretended Defence. A Plain Declaration that our Brownists be Full Donatists by Comparing them Together from Point to Point out of the Writings of Augustine. Also a Reply to Master Greenwood touching Read Prayer, wherein his Gross Ignorance is Detected… (London, 1590) 126 pp. ToC This work is in reply to John Greenwood’s, An Answer to George Gifford’s Pretended Defence…, which was a reply to Gifford’s, A Short Treatise… A Short Reply unto the Last Printed Books of Henry Barrow &amp; John Greenwood, the Chief Ringleaders of our Donatists in England. Wherein is laid Open their Gross Ignorance &amp; Foul Errors: upon which their Whole Building is Founded (London, 1591) 98 pp. ToC . 1600’s English Puritans – A Refutation of the Errors of Separatists (1604; RBO, 2025) 300 pp. with an Extended Intro by Travis Fentiman: “Defending the Lawfulness of Partial-Conformity in Worship &amp; Church Government (including under Civil Impositions) from Scripture, Westminster &amp; the Scottish Indulgence Controversy, contra George Gillespie, while Driving against Denominationalism, for the Unifying of Christ’s Church</p></blockquote>

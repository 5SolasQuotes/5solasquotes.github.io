<main class="wrap"><figure class="quote" id="q-cdbd942d91" data-kw="">
<blockquote><p>When, therefore, a community, by the instinct and guidance of nature, incline to government, and to defend themselves from violence, they do not, by that instinct, formally agree to government by magistrates; and when a natural conscience gives a deliberate consent to good laws, as to this, “Whoso sheddeth man’s blood, by man shall his blood be shed,” Gen. 9:6, he does tacitly consent that his own blood shall be shed; but this he consents unto consequently, tacitly, and conditionally, — if he shall do violence to the life of his brother: yet so as this consent proceeds not from a disposition every way purely natural.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/samuel-rutherford.html">Samuel Rutherford</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Lex Rex</cite>, (1644), Question 2, pp. 2-3</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/civil-government-and-society/natural-law-and-civil-law.html">Natural Law and Civil Law</a></span></div>

</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-0101761904" data-kw="">
<blockquote><p>…as in a Church in an island, where the pastors are dead or taken away by pest[ilence] or otherways; the people may ordain pastors or rather do that which may supply the defect of ordination, as David without immediate revelation from Heaven to direct him, by only the Law of nature, did eat showbread; So is the case here, so answer the casuists and the schoolmen, that a positive law may yield in case of necessity to the good of the Church; so Thomas, Molina, Suarez, Vasquez, Vigverius, Sotus, Scotus, Altisiodorensis, Durand, Gabriel; and consider what the learned Voetius says in this: What if in an extreme case of necessity, a private man, endued with gifts and zeal should teach publicly, after the example of the faithful at Samosaten. Yea and Flavianus and Diodorus preached in Antioch, as Theodoret says; yea, says Voetius, an ordinary ministry might be imposed on a laic, or private person by the Church, though the presbytery consent not, in case of necessity. God (says Gerson) may make an immediate intermission of a calling by bishops; yea (says Anton. speaking of necessity’s law) the Pope may commit power of excommunication, quia est de jure positive, pure laico &amp; mulieri, to one mere laic, or a woman; though we justify not this, yet it is hence concluded that God has not tied Himself to one set rule of ordinary, positive laws: a captive woman (as Socrates says) preached the Gospel to the king and queen of Iberranes, and they to the people of the land.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/samuel-rutherford.html">Samuel Rutherford</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Due Right of Presbyteries, ‘Acts 15, A Pattern of a Juridicial Synod’</cite>, ... (1644) | pt. 1, p. 8</span></figcaption>

<blockquote><p>(8) Human flourishing is a greater and more foundational natural, teleological purpose and good than sex organs and contra-acting them in some way. Hence, so contra-acting, which is not inherently wrong, is right when it results in greater human flourishing, which could not occur (or would not best occur) except through this means.</p></blockquote>

</figure><figure class="quote" id="q-820b3cb529" data-kw="">
<blockquote><p>Do they [our divines] not teach… That the negative precepts of the Law do bind, not only at all times, but likewise to all times, (whereupon it follows that we may never do that which is inconvenient or scandalous), and that the affirmative precepts though they bind at all times, yet not to all times, but only quando expedit [when it is expedient] (whereupon it follows that we are never bound to the practice of any duty commanded in the Law of God except only when it is expedient to be done)? …forasmuch as to abstain from things scandalous and inconvenient is one of the negative precepts of the Law of God… it follows that the use and practice of the same is altogether unlawful unto us.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/george-gillespie.html">George Gillespie</a></span><span class="wk"><span class="lbl">Work:</span> <cite>English Popish Ceremonies</cite>, pt. 2, ch. 1, ‘Against Some of our Opposites who aknowledge the inconveniency of the Ceremonies &amp; yet would have us yield to them’ in English Popish Ceremonies (1637), pp. 1-13, p. 9</span></figcaption>

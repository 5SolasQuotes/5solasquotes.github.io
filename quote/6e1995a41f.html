</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-b016abb8db" data-kw="">
<blockquote><p>Reason 1. Because no man ought to separate himself from the true Church of Christ: Now such is an assembly professing the true faith, notwithstanding other corruption; for as holiness, if it might be supposed without true faith, cannot make a true Church, but false doctrine and error in the foundation overthrows it for being a Church: So e contra [from the contrary], corruptions in manners cannot make it no Church, when true faith is taught and maintained.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/richard-stock.html">Richard Stock</a></span><span class="wk"><span class="lbl">Work:</span> <cite>A Learned &amp; Very Useful Commentary upon the Whole Prophesy of Malachi</cite>, (London: T.H., 1641), on ch. 1, verse 9, pp. 177</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/the-church/church-unity-and-fundamentals.html">Church Unity and Fundamentals</a></span></div>
<div class="actions"><button class="copy" data-copy="“Reason 1. Because no man ought to separate himself from the true Church of Christ: Now such is an assembly professing the true faith, notwithstanding other corruption; for as holiness, if it might be supposed without true faith, cannot make a true Church, but false doctrine and error in the foundation overthrows it for being a Church: So e contra [from the contrary], corruptions in manners cannot make it no Church, when true faith is taught and maintained.”

— Richard Stock, A Learned &amp; Very Useful Commentary upon the Whole Prophesy of Malachi (London: T.H., 1641), on ch. 1, verse 9, pp. 177">Copy</button><a class="share" href="https://x.com/intent/post?text=%E2%80%9CReason+1.+Because+no+man+ought+to+separate+himself+from+the+true+Church+of+Christ%3A+Now+such+is+an+assembly+professing+the+true+faith%2C+notwithstanding+other+corruption%3B+for+as+holiness%2C+if+it+might+be+supposed+without+true+faith%2C+cannot+make+a+true+Church%2C+but+false+doctrine+and+error+in+the+foundation+overthrows+it+for+being+a+Church%3A+So+e+contra+%5Bfrom+the+contrary%5D%2C+corruptions+in+manners+cannot+make+it+no+Church%2C+when+true+faith+is+taught+and+maintained.%E2%80%9D%0A%0A%E2%80%94+Richard+Stock%2C+A+Learned+%26+Very+Useful+Commentary+upon+the+Whole+Prophesy+of+Malachi+%28London%3A+T.H.%2C+1641%29%2C+on+ch.+1%2C+verse+9%2C+pp.+177&amp;url=https%3A%2F%2F5solasquotes.github.io%2Fquote%2Fb016abb8db.html&amp;via=5Solas" target="_blank" rel="noopener">Share on X</a><a class="perma" href="../quote/b016abb8db.html">Permalink</a><a class="src" href="https://reformedbooksonline.com/that-union-in-at-least-christianitys-fundamentals-is-obliging/#:~:text=Reason%201.%20Because%20no%20man%20ought,true%20faith%20is%20taught%20and%20maintained&amp;text=Reason%201.%20Because%20no%20man%20ought%20to%20separate&amp;text=Church%2C%20when%20true%20faith%20is%20taught%20and%20maintained" rel="noopener" target="_blank">Read it online · Reformed Books Online</a></div>
</figure><figure class="quote" id="q-74e165a50d" data-kw="">
<blockquote><p>And 1st, albeit there be errors, and errors of a heinous nature among some in a Church, this is not sufficient ground of separation from that Church, nay, not though these errors should remain uncensured. For, as was noticed above, there were some in the Church of Corinth who had drunk in this gross error, “That there is no resurrection of the body;” hence the apostle asks, “How say some among you, there is no resurrection of the dead?” (1 Cor. 15:12) The interrogation plainly intimates there were some among them who denied that great and fundamental doctrine of the Christian religion; and yet this Church of Corinth was a true Church of Christ, from which it was not lawful to separate. So, in the Church of Pergamos, there were some uncensured who held the doctrine of Balaam, and the doctrine of the Nicolaitans; and yet she was a true Church of Christ, right and approven in the main. So, in the Church of Thyatira, “that wicked woman” Jezebel was tolerated without being censured, though she taught the Lord’s servants to commit heinous iniquity. So, though there should be sundry persons leavened with gross errors in the Church of Scotland at this day, this is no sufficient ground for a secession or separation from her. I own it is a sin, and I think a very heinous sin in any Church, to wink at errors, or not to censure for, and be zealous against them, especially if of a heinous nature, as are some of these wherewith some among us have been charged… … And as [John] Owen justly (Exposition, p. 174) observes, “There may be a fundamental error in a true Church for a season, where the Church errs not fundamentally,” citing for proof of this, 1 Cor. 15; 2 Tim. 2:18.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/john-currie.html">John Currie</a></span><span class="wk"><span class="lbl">Work:</span> <cite>An Essay on Separation: or a Vindication of the Church of Scotland, in which the Chief Things in the Testimonies of these Reverend Brethren who lately made a Secession from her are considered &amp; shown to be no Ground of Separation or Secession</cite>, An Essay on Separation: or a Vindication of the Church of Scotland, in which the Chief Things in the Testimonies of these Reverend Brethren who lately made a Secession from her are considered &amp; shown to be no Ground of Separation or Secession (1738) | ch. 3, Where some things are instanced, which, though just ground for fasting, mourning and lamentation, yet are not sufficient causes of separation from a Church of Christ</span></figcaption>

</figure><figure class="quote" id="q-49d1b19504" data-kw="">
<blockquote><p>Rule Two. We must have a respect to the ordinance itself, that it be not made contemptible, that the discipline of Christ’s house be not rendered obnoxious to reproach and contempt; and as in the first reformation of religion, when men were coming out of popery and were ready to fear and spurn at discipline, and knew not the difference between the popish yoke and Christ’s yoke, in that case and in that time there was forbearance on this account. ‘I would they were cut off that trouble you’ (Gal. 5:12). Why then would he not cut them off? Because there was such a distemper among the Galatians, they were so bewitched and led away after the false teachers, and Paul’s authority was questioned; therefore he held himself at a wish and will not put forth the authority he had against those false and corrupt men.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/james-durham.html">James Durham</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Collected Sermons of James Durham</cite>, p. 923 of 7. ‘A Sermon on Ephesians 4:11-12’ in Collected Sermons of James Durham…, vol. 1 (Naphtali &amp; RHB, 2017)</span></figcaption>

</figure><figure class="quote" id="q-4999659748" data-kw="">
<blockquote><p>13. And it greatly wrongs such men that they never had right apprehensions of the nature and great necessity of vanity among believers and the Churches of Christ. They cry out ‘Truth must not be sold for peace,’ when they neither know aright what is truth or peace. But by ‘truth’ they mean their own doubtful opinions and by ‘peace’ they mean their own quietness with men. We easily confess that as peace signifies our freedom from persecution or sufferings, or from the reproach of men, the least holy truth is to be preferred before it, and more tenaciously held than it: But if by ‘peace’ they mean the unity and concord of believers or of the Church of God, they speak dangerously and suppose a pernicious falsehood, that God’s truth and such peace or concord may at any time be separated: And it is no wiselier spoken than if they had said, A man’s eye-sight or health is to be preferred before the union of his soul and body, or before the concord of head and heart, or before the conjunction of his members. When as non cutis nulla est affectio [without skin there is no sensation]. Destroy the subject and you destroy the accidents. Without union of parts, the Church is no Church; dividing it is destroying it. A house or kingdom divided cannot stand. And when it is no Church, it has no truth as a Church, nor anything that dividers did contend for. An Integral member may rather be cut off, than the whole should perish: But what member will separate itself from the body? Or who but a murderer will on pretense of curing, be a divider and dissolver? … 16. And they forget that as the body must have its due magnitude, as well as its comely scite [position] of parts; so we must be zealous for the greatness, as well as the purity, the extensive as well as the intensive growth of the Church. And if Christ’s flock be little, they dishonor it that would make it tenfold less than indeed it is; Jer. 30:19, ‘And out of them shall proceed thanksgiving, and the voice of them that make merry: And I will multiply them, and they shall not be few, and I will glorify them, and they shall not be small.&#x27;</p></blockquote>

ed thanksgiving, and the voice of them that make merry: And I will multiply them, and they shall not be few, and I will glorify them, and they shall not be small.&#x27;”

— Richard Baxter, A Second Admonition to Mr. Edward Bagshaw (London: Simmons, 1671), ‘To those Readers…’, pp. 7-8">Copy</button><a class="share" href="https://x.com/intent/post?text=%E2%80%9C13.+And+it+greatly+wrongs+such+men+that+they+never+had+right+apprehensions+of+the+nature+and+great+necessity+of+vanity+among+believers+and+the+Churches+of+Christ.+They+cry+out+%E2%80%98Truth+must+not+be+sold+for+peace%2C%E2%80%99+when+they+neither+know+aright+what+is+truth+or+peace.+But+by+%E2%80%98truth%E2%80%99+they+mean+their+own+doubtful+opinions+and+by+%E2%80%98peace%E2%80%99+they+mean+their+own+quietness+with+men.+We+easily+confess+that+as+peace+signifies+our+freedom+from+persecution+or+sufferings%2C+or+from+the+reproach+of+men%2C+the+least+holy+truth+is+to+be+preferred+before+it%2C+and+more+tenaciously+held+than+it%3A+But+if+by+%E2%80%98peace%E2%80%99+they+mean+the+unity+and+concord+of+believers+or+of+the+Church+of+God%2C+they+speak+dangerously+and+suppose+a+pernicious+falsehood%2C+that+God%E2%80%99s+truth+and+such+peace+or+concord+may+at+any+time+be+separated%3A+And+it+is+no+wiselier+spoken+than+if+they+had+said%2C+A+man%E2%80%99s+eye-sight+or+health+is+to+be+preferred+before+the+union+of+his+soul+and+body%2C+or+before+the+concord+of+head+and+heart%2C+or+before+the+conjunction+of+his+members.+When+as+non+cutis+nulla+est+affectio+%5Bwithout+skin+there+is+no+sensation%5D.+Destroy+the+subject+and+you+destroy+the+accidents.+Without+union+of+parts%2C+the+Church+is+no+Church%3B+dividing+it+is+destroying+it.+A+house+or+kingdom+divided+cannot+stand.+And+when+it+is+no+Church%2C+it+has+no+truth+as+a+Church%2C+nor+anything+that+dividers+did+contend+for.+An+Integral+member+may+rather+be+cut+off%2C+than+the+whole+should+perish%3A+But+what+member+will+separate+itself+from+the+body%3F+Or+who+but+a+murderer+will+on+pretense+of+curing%2C+be+a+divider+and+dissolver%3F+%E2%80%A6+16.+And+they+forget+that+as+the+body+must+have+its+due+magnitude%2C+as+well+as+its+comely+scite+%5Bposition%5D+o

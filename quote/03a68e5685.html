<main class="wrap"><figure class="quote" id="q-03a68e5685" data-kw="">
<blockquote><p>Whether a Church may not, ought not, to take under its Conduct, Inspection and Rule, such as are not yet meet to be received into full Communion; such as are the Children and Servants of those who are complete Members of the Church. Answ. No doubt the Church in its Officers, may and ought so to do; and it is a great evil when it is neglected. For, (1.) They are to take care of Parents and Masters as such, and as unto the discharge of their Duty in their Families; which, without an inspection into the condition of their Children and Servants, they cannot do. (2.) Households were constantly reckoned unto the Church, when the Heads of the Families were entered into Covenant, Luk. 19.9. Act. 16.15. Rom. 16.10, 11. 1 Cor. 1.16. 2 Tim. 4.19.

(3.) Children to belong unto, and have an Interest in their Parents’ Covenant; not only in the promise of it, which gives them Right unto Baptism; but in the Profession of it in the Church Covenant, which gives them a Right unto all the Privileges of the Church, whereof they are capable, until they voluntarily relinquish their claim unto them.

(4.) Baptizing the Children of Church Members, giving them thereby an Admission into the visible Catholic Church, puts an Obligation on the Officers of the Church, to take care, what in them lieth, that they may be kept and preserved meet Members of it, by a due watch over them, and instruction of them.

(5.) Though neither the Church nor its Privileges be continued and preserved as of old, by carnal generation; yet, because of the nature of the Dispensation of God’s Covenant, wherein he hath promised to be a God unto Believers and their Seed; the advantage of the means of a gracious Education in such Families, and of conversion and edification in the Ministry of the Church, ordinarily the continuation of the Church, is to depend on the addition of Members out of the Families already incorporated in it. The Church is not to be like the Kingdom of the Mamalukes, wherein there was no regard unto natural Successors; but it was continually made up of Strangers and Foreigners incorporated into it: Nor like the beginning of the Roman Common-weal, which consisting of Men only, was like to have been the matter of one Age alone.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/john-owen.html">John Owen</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The true nature of a gospel church and its government</cite>, (London: William Marshall, 1689), pp 16-17.</span></figcaption>

<blockquote><p>XXXI. But as to what is often asked here, whether elect and saved infants also have faith, it is plain indeed that they cannot have actual faith; but nothing prohibits a certain habitual faith, or rather the seed and root of faith, from being infused in them. And certainly it cannot happen that God would purge from every stain of original sin as many infants as he admits into his heavenly kingdom, which nothing defiled and contaminated enters. Since therefore original sin in infants includes a certain seed of unbelief, just as of all vices, while God cleanses them, he undoubtedly takes away that innate unbelief, and so infuses the principle and a certain seed of faith. For God does not purge his own from vices except by infusing the contrary habits of virtues. XXXII. Moreover, whatever that may be, whether faith or the root of faith and disposition to faith which can be found in infants, it is beyond controversy that it must be attributed to God alone, and that the offices of man do not concur with it: nor can it be called into doubt by anyone: but Scripture also manifestly teaches that the same must be thought about the faith of adults, for it calls faith the gift of God, Eph. 2:8, “By grace you have been saved through faith, and that not of yourselves, it is the gift of God.” And to the Philippians the Apostle says that it was freely given to them to believe in Christ, Phil. 1:29.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/louis-le-blanc.html">Louis Le Blanc</a></span><span class="wk"><span class="lbl">Work:</span> <cite>‘Theological Theses on Faith’ in Theological Theses put forth at Various Times at the Academy of Sedan 3rd</cite>, ed. tr. Onku with AI (1645; London: Moses Pitt, 1683), p. 6 Le Blanc (1614-1675) was a reformed professor of theology at Sedan, France.</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/baptism/subjects-of-baptism.html">Subjects of Baptism</a></span></div>

</figure><figure class="quote" id="q-a24a7153fd" data-kw="">
<blockquote><p>LXV. Regarding the unbaptized children of the faithful, there is a real controversy about whether they pertain to the Church. For such infants, according to the Romanists, do not pertain to the Church in any way, while our [Reformed] theologians contend that they follow the condition of their parents and are in God’s covenant and constitute part of the visible Church, at least pertaining to the external communion of the Church, as is particularly evident in the English [Westminster] Confession, ch. 25, and in Bucanus’ work on the Church, in the definition of the Church.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/louis-le-blanc.html">Louis Le Blanc</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Theological Theses Published at Various Times</cite>, vol. 2 3rd ed. tr. by AI by Colloquia Scholastica at Discord (1675; London, 1683), Nature &amp; Definition of the Church, p. 435 Latin</span></figcaption>

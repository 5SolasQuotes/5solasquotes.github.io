<blockquote><p>9. Ninth [Objection to the simplicity of God]: God is in all things, and all things are in God. To which pertain those monstrous statements that God is prime matter, that man’s soul is a particle of divine breath and that God is the soul of the world; that God communicates Himself to us and we are so partakers of his divine nature that men, having been deified and transformed into God, are to be said to be essentially united with him – such as occur in the fanatics and Enthusiasts, the Henric-Nicolaitans, Weigelians, etc., about whom elsewhere. Meanwhile the treatise of the most noble Lord of Mont Saint-Aldegonde against the Libertines can be consulted, and Stegmann in the 2nd appendix of his Photianism, On True Christianity, with which compare Thomas, Summa Theologiae, pt. I, question 3, article 8, and Against the Gentiles, bk. 1, ch. 17, 20, 26-27. Response: Let those of that type briefly take these sources of solutions, thence let them apply them to those petty reasons or rather insanities. 1. God is in all things not as an essential or integral part in the whole, or as the contained in its containing, or as a subject under its accident, or as an accident in its subject, but as a cause is present to that on which it immediately acts. God is present, I say, to all things by essence, not because he is of the essence of things or something of their essence – whether as transient or constituent matter, or as informing form, or as perfecting accident. For he is most one, alone, divided, distinct from all – which also some think can not badly be intimated in Scripture by the attribute of holiness. In addition, if he came into composition with something, that would be more perfect than God, because every composite is more perfect than the compounding parts or principles. See the special reasons in Thomas and his commentator Ferrariensis in the cited place, and Summa Theologiae I, question 8, article 1. 2. All things are in God in three ways: in his power as in an efficient cause, in his idea as in an exemplar cause, in his knowledge as in one knowing. Whence the threefold being of creatures in God: eminent, ideal, intelligible. But this whole being is objective, without any composition or commingling, just as light is in air and air in light: Augustine, On the Literal Interpretation of Genesis, bk. 4, ch. 12, and On the Trinity, bk. 14, ch. 12; Cyril of Alexandria on John, bk. 9, ch. 40. See further the Scholastics on Summa Theologiae, pt. I, quest. 18, art. 4; Suárez, On God, bk. 2, ch. 2; and the commentators on Acts 17:28; 2 Pet. 1:4. And the philosophers explaining that axiom: ‘In a certain way, all things are four: God, heaven, prime matter, intellect.’ 3. God communicates his essence, life, goodness outside Himself, or ad extra, in the genus of efficient, exemplar, final cause, and indeed not naturally but freely, not through essence but through grace, so that for example all things participate of his goodness and are good by it extrinsically and causally, but by their proper goodnesses formally: Thomas, Summa Theologiae, pt. I, quest. 7, art. 4. Meanwhile they remain most distinct in individual and in species or univocal genus: the essence or goodness of God, and the essence or goodness produced in creatures to the likeness or image of the divine. But that communication of the divine essence is fivefold: 1. through creation, 2. through the grace of adoption, 3. through glory and beatitude, 4. through love and desire, 5. through incarnation;</p></blockquote>

<blockquote><p>the Chaldeans are daily refuted. How many things I remember being said by the Chaldeans to Pompey, how many to Crassus, how many to Caesar himself; that none of them would die except in old age, except at home, except with clarity, so that it seems very strange to me that anyone still exists who believes those whose predictions he sees refuted daily by fact and events”; yet all of these were taken away by a violent death, which is confirmed by the examples of Julian the Apostate, Ludovico Sforza, Prince of Milan, Edward VI, King of England, the son of Cardanus, and others, to whom things far different from what had been predicted happened. Hence 10 emperors, princes, and lawgivers have forbidden this art of divining from the stars, and wise men and the fathers have disapproved of it. Maecenas, in Dio, bk. 52, Oration to Augustus, said that “diviners should not be tolerated in a republic.” Augustus expelled the astrologers from the city, Tiberius and Claudius from Italy; Vitellius also severely judged that they should be deprived of the world and of life. See Code, bk. 9, Tit. 18; bk. 2, 5, 7, and Tacitus, bk. 2, Annals, ch. 32, in whose judgment, “mathematicians are a race of men untrustworthy to the powerful, deceitful to the hopeful: which in our state will always be both forbidden and retained.” Cf. Valerius Maximus, bk. 1, ch. 3; Curtius, bk. 4, ch. 10; bk. 7, ch. 7. If an event has corresponded to some predictions, this should be attributed either to the shrewdness of the diviners, who had knowledge of the morals, counsels, and studies of those consulting them; or to the credulity of those consulting, who have turned fortuitous chances into the fulfillment of the thing predicted; or to the work of the devil, from whose suggestion or inspiration such prophets can draw many things; or to the just judgment of God, who chastises the vain minds of men with those mockeries, and permits the superstition of men to feel the scourge of Satan.</p></blockquo

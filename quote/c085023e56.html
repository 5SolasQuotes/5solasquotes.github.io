<main class="wrap"><figure class="quote" id="q-c085023e56" data-kw="">
<blockquote><p>Whence it follows, that the merit of works ceases when righteousness is sought by faith; for it is necessary that this righteousness should be freely given by God, and offered in his word, in order that any one may possess it by faith. To render this more intelligible, when Moses says that faith was imputed to Abram for righteousness, he does not mean that faith was that first cause of righteousness which is called the efficient, but only the formal cause; as if he had said, that Abram was therefore justified, because, relying on the paternal loving-kindness of God, he trusted to His mere goodness, and not to himself, nor to his own merits. For it is especially to be observed, that faith borrows a righteousness elsewhere, of which we, in ourselves, are destitute; otherwise it would be in vain for Paul to set faith in opposition to works, when speaking of the mode of obtaining righteousness. Besides, the mutual relation between the free promise and faith, leaves no doubt upon the subject.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/john-calvin.html">John Calvin</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Commentary on the First Book of Moses</cite>, …, 1.407</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/justification.html">Justification</a></span></div>

</figure><figure class="quote" id="q-2c1dfd5f8d" data-kw="">
<blockquote><p>Thus [Paul] says also to the Romans (11:13): “Inasmuch as I am an apostle to the Gentiles, I magnify my ministry.” That is to say: “I want men to receive me, not as Paul of Tarsus but as Paul the apostle or ambassador of Jesus Christ.” He has to do this to maintain his authority, so that those who hear this may be more attentive and more willing to listen to him. For they are not listening to Paul; but in Paul they are listening to Christ Himself and to God the Father, who sends him forth. Just as men should devoutly honor the authority and majesty of God, so they should reverently receive and listen to His messengers, who bring His Word.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/martin-luther.html">Martin Luther</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Luther’s Works</cite>, Vol. 26: Lectures on Galatians, 1535, Chapters 1-4, ed. Jaroslav Jan Pelikan, Hilton C. Oswald, and Helmut T. Lehmann (Saint Louis: Concordia Publishing House, 1999), 16.</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/justification.html">Justification</a></span></div>

</figure><figure class="quote" id="q-6d834afe99" data-kw="">
<blockquote><p>Hence on the part of God there can only be question of a gratuitous promise of reward for certain good works. For such works He owes the promised reward, not in justice or equity, but solely because He has freely bound himself, i.e., because of His own attributes of veracity and fidelity.</p></blockquote>

<main class="wrap"><figure class="quote" id="q-bbc82a597e" data-kw="">
<blockquote><p>2dly, Regeneration does not only show the wide difference between the two states, the regenerate and unregenerate; but it comes in a different manner upon the regenerate themselves. I say a different manner; for there is no difference in the nature of the thing itself, that is the same in substance, essence, and principle in all who are regenerate: yet there are some circumstances attending regeneration sometimes, wherein one regenerate person may greatly differ from another, even in the first moment of regeneration, e.g. some may be regenerated and converted into higher degrees of grace in the first moment of their conversion, than some others (though as truly regenerate as they) may attain to all their days; all in regeneration do receive one and the same spirit of grace, but not in the same measure. Paul was converted into an eminency in grace; he was never a babe in Christ, but was born a strong man in Christ the very first moment of his conversion. God had present use of Paul; he had designed him for eminent service, which he was immediately to enter upon, and therefore God furnishes him accordingly.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/thomas-cole.html">Thomas Cole</a></span><span class="wk"><span class="lbl">Work:</span> <cite>A Discourse of Regeneration, Faith &amp; Repentance</cite>, ... (London: Cockerill, 1692), Discourse of Regeneration, ch. 4, ‘Manner of Regeneration’, p. 73</span></figcaption>

</figure><figure class="quote" id="q-0ef156bd79" data-kw="">
<blockquote><p>Every Christian man and woman are by faith mystically united unto Christ and made all members of one body, whereof Christ is the head. Now therefore as Christ by the power of his Godhead, when He was dead and buried, did overcome the grave and the power of death in his own Person, so by the very same power by means of this spiritual conjunction does He work in all his members a spiritual death and burial of sin and natural corruption… So let a man that is dead in sin be cast into the grave of Christ, that is, let him by faith but touch Christ dead and buried, it will come to pass by the virtue of Christ’s death and burial, that he shall be raised from the death and bondage of sin to become a new man.</p></blockquote>

</figure><figure class="quote" id="q-bd3525cc7f" data-kw="">
<blockquote><p>It is customary to consider this repentance in two ways: either as a spiritual disposition poured into our hearts by the Holy Spirit, or as an action from us that proceeds from that disposition. In the first way, it is properly speaking and in its strict sense called regeneration; in the second way, it is called repentance, taken in a more restricted sense, or penitence. And when the two are taken together it is called the circumcision of the heart, the conversion to God, the renewal of the Spirit, the sanctification of man, the new creation, and the first resurrection.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/anthony-walaeus.html">Anthony Walaeus</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Synopsis of a Purer Theology</cite>, tr. Reimer Faber, ed. Henk van den Belt (Brill, 2016), Disputation 32, ‘On Repentance’, section 2, p. 277</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/regeneration/nature-of-regeneration.html">Nature of Regeneration</a></span></div>

</figure><figure class="quote" id="q-b21925d580" data-kw="">
<blockquote><p>Question: By what means do we receive or draw these virtues from Christ, or enjoy them in Him? Answer: This is only by faith of Him, that is, by faith receiving or going to Christ’s person, pitching on Him alone as revealed and offered in the Gospel. Doctrine: Faith in Christ’s person, name, is the only means of receiving all saving virtues from Christ, when we believe the Gospel and glad tidings offering us Christ’s person with all his benefits and virtues, and behold Him to be such a one towards us as the Gospel reveals and offers Him to us, that is, our wisdom, righteousness, sanctification, and redemption, our King, Priest, and Prophet, then is He indeed become such a one towards us, and we are made such in Him.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/job-throckmorton.html">Job Throckmorton</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Other citations (work not named)</cite>, Of Faith, as given in Richard Baxter, Richard Baxter’s Confession of his Faith… (d. 1601; London: 1655), ch. 10, sect. 3, p. 396 Throckmorton (1545-1601) was an English puritan., pp. 30-31</span></figcaption>

<main class="wrap"><figure class="quote" id="q-4ba4f7ef7f" data-kw="">
<blockquote><p>The creature is limited by the circumstance of time, by which it has its being measured out as it were by parcels, past, present and to come; it had beginning, has succession and may have an end. The most glorious angel, as well as a worm, is thus limited by time; once he was not, then he began to be; that which is past is gone, and that which is to come is not yet, and he has but a little time present. But God’s essence had no beginning, has no succession, can have no end. We cannot say of it properly: It was or shall be; but alone It is, Ex. 3:14; Jn. 8:58. He has his whole being at once; not some after, some by parcels, one following another, Gen. 21:13 and 23:33; Ps. 90:2, 24; Isa. 57:15. Eternity is the continual existence and duration of the divine essence. The creatures being is a flux or perpetual flowing from one moment to another. God is a being above time, has his being measured by time, but is wholly eternal.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/edward-leigh.html">Edward Leigh</a></span><span class="wk"><span class="lbl">Work:</span> <cite>A System or Body of Divinity</cite>, (London: A.M., 1654), bk. 2, ch. 4, That God is infinite, omnipresent, eternal, pp. 148-49</span></figcaption>

</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-4246cbe1f0" data-kw="">
<blockquote><p>Angels are intelligent spirits free from a body. Propositions …

IV. Angels are in a particular place not as if they were enclosed within it, but to the exclusion of being anywhere else [non circumscriptive sed definitive].

V. Angels cannot be in several places at once.

VI. Angels truly move from one place to another.</p></blockquote>

</figure><figure class="quote" id="q-4ee3a8211b" data-kw="">
<blockquote><p>…the everlasting and precise observation of this favorable precept [2nd Commandment] in the ancient, purely Christian Church… They observed the rule with the Cherubim, too; it was exactly as if they had not been put in the temple, even outside the gaze of all the Priests, and they were put forth as types of the Majesty of the Messiah who rules over the angels themselves, the truth of which we now maintain. [Note that numerous reformed theologians (such as Owen below), in accord with many in the Christian Church before them, irrespective of possibly a more direct figuring of Israel under Egyptian persecution, taught that the burning bush was a type of the majesty of the Messiah (the true Israel) who would join the divine nature to his human nature in his Person (who spoke both as the angel of the Lord, and God, out of the bush), and not be consumed. Beza’s and the Reformed’s caution is here evident.] But the other images, like the lions and the bulls, pertain in no way to this matter, (r) since they were like decorations of holy vases, lacking any danger of idolatry, and besides this, constructed in this way by the express word of God.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/theodore-beza.html">Theodore Beza</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Lutheranism vs. Calvinism: The Classic Debate at the Colloquy of Montbeliard 1586</cite>, (Concordia Publishing House, 2017), ch. 4, p. 462</span></figcaption>

</figure><figure class="quote" id="q-e411c59bf1" data-kw="">
<blockquote><p>…and it is most certain that angelical persons have a limited presence, because they have a finite essince [as opposed to God]… I need say no more concerning angels than what is commonly said, ‘Angeli sunt alicuoi definitive; sunt enim in suo ubi non per operationem vel circumscriptionem, sed per designationem definitivam,’ angels are naturally somewhere; though they are not in any place by extension of parts, yet their finite nature is contained within certain bounds and limits. Hence it is that some learned men affirm that it is improper to say, that God is somewhere because He is everywhere; somewhere is a definitive word.</p></blockquote>

</figure><figure class="quote" id="q-041822af0e" data-kw="angels spirits">
<blockquote><p>Are angels spiritual and incorporeal substances? We affirm. Scripture expressly calls them spirits; now for what purpose would they be called “spirits” if they are corporeal? Spirit is diametrically opposed to body: “A spirit hath not flesh and bones,” says Christ, “as ye see me have” (Lk. 24:39). For the same reason they are classed among things “invisible” (Col. 1:16).</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/francis-turretin.html">Francis Turretin</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Institutes of Elenctic Theology</cite>, 7.2.2</span></figcaption>

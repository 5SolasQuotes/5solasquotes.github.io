<main class="wrap"><figure class="quote" id="q-5398bf7225" data-kw="">
<blockquote><p>Let not, then, the Arians flatter themselves with the employment of the name, because they call themselves Christians. The Lord will answer them: You set forward My Name, and deny My Substance, but I do not recognize My name where My eternal Godhead is not. That is not My Name which is divided from the Father, and separated from the Spirit; I do not recognize My Name where I do not recognize My doctrine; I do not recognize My Name where I do not recognize My Spirit.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/st-ambrose.html">Ambrose of Milan</a></span><span class="wk"><span class="lbl">Work:</span> <cite>On the Holy Spirit</cite>, (381), 3.11.80 in Nicene and Post-Nicene Fathers 2, 10: 153-54.</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/the-church.html">The Church</a></span></div>

</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-ebf4251402" data-kw="">
<blockquote><p>We maintain to start with that, when God raised up Luther and others, who held forth a torch to light us into the way of salvation on on whose ministry our churches are founded and built, those heads of doctrine in which the truth of our religion, those in which the pure and legitimate worship of God, and those in which the salvation of man are comprehended, were in a great measure obsolete.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/john-calvin.html">John Calvin</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Necessity of Reforming the Church</cite>, from his Supplex Exhortatio (1543; The Necessity of Reforming the Church) written at the request of Martin Bucer and written for Charles V and the Diet of Spire to clarify the state of the question between the Protestants and Rome.</span></figcaption>

</figure><figure class="quote" id="q-d473f1181c" data-kw="">
<blockquote><p>But if one avoid more ordinary communion with a church, as judging it, though not essentially defective, yet to want [lack] or err in some circumstances so considerable as that he counts [that] another church comes nearer the common Christian rule, the Holy Scriptures, and finds its administrations more conducing to his spiritual advantage; he may be led, by the judgment of his conscience, both, sometimes upon weighty and important reasons to communicate with the former [defective Church], and continue therein, according as those reasons shall continue urgent upon him; and yet, sometimes, as the cessant or diminished weight of such reasons shall allow, to communicate with the other [more spiritually advantageous church].</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/john-howe.html">John Howe</a></span><span class="wk"><span class="lbl">Work:</span> <cite>‘Some Consideration of a Preface to an Inquiry Concerning the Occasional Conformity of Dissenters, etc.’ in The Works of John Howe</cite>, vol. 5, Containing the Treatises: On Divine Prescience &amp; the Trinity… (Religious Tract Society, 1863) Howe (1630-1705) was an English puritan and presbyterian theologian., pp. 275-76</span></figcaption>

</figure><figure class="quote" id="q-4f2f1b7f0b" data-kw="">
<blockquote><p>245. Therefore, the confessions of particular Churches and the decrees and canons of particular synods, and the catecheses of particular Churches and the liturgies or ecclesiastical agendas and similar formulas, their doctrines or declarations are not the immutable and universal norm of faith and truth, according to which it ought to be judged or pronounced what is to be believed and conceded, what is to be repudiated and condemned, what is true or false, orthodox or heretical. For it is not always necessary that what agrees with the confession of some particular Church, synodical decrees, catechesis, liturgy or ecclesiastical agenda, formula of doctrine or some other declaration, is true; nor is it always false what disagrees with it. Therefore, it should not be demanded that all Churches subscribe to the declaration and formula of one particular Church: but indeed those formulas do not even bind one Church or any private person to approve them and to contain themselves within them, except with this condition, insofar as they agree with divine Scripture and universal Symbols.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/amandus-polanus.html">Amandus Polanus</a></span><span class="wk"><span class="lbl">Work:</span> <cite>A System of Christian Theology</cite>, tr. ChatGPT-4, with Latin (Hanau, 1609-1610) at Monergism, bk. 1, Theology &amp; Scripture, p. 1,889</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/the-church/creeds-confessions-and-councils.html">Creeds, Confessions and Councils</a></span></div>

<blockquote><p>This quotation is useful for understanding the rationale behind the descending obligation of national covenants:

By the term nation, as it is employed in common speech, and as we design to use it in the discussion of this subject, is intended an organised community, placed under a system of political government, capable of intercourse with other communities, and the subject of reward and punishment. It is hardly necessary to remark that the term does not refer to one generation merely. Both by the common consent of mankind, and by Jehovah, the moral Governor of the universe, a nation is regarded as a permanent body, having a continued moral identity, notwithstanding various physical changes, so that the political body remains the same, though the persons who compose it successively pass off the stage of time.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/thomas-houston.html">Thomas Houston</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Duty of Nations favoured with Divine Revelation to promote Scriptural Education: In Two Discourses</cite>, (Belfast, 1840), p. 8.</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/civil-government-and-society.html">Civil Government and Society</a></span></div>

<blockquote><p>1. An unrighteous judge does condemn the cause of God Himself: For every righteous cause is his. 2. …It is a damnable sin not to relieve the innocent and imprisoned in their distress, when we have power…

3. It is a turning of the remedy into a double misery; and taking away the only help of oppressed innocency. What other defense has innocency, but Law and Justice? And when their refuge itself does fall upon them and oppress them, whither shall the righteous fly?

4. It subverts laws and government, and abuses it to destroy the ends which it is appointed for.

5. Thereby it turns human society into a state of misery, like the depredations of hostility.

6. It is a deliberate resolved sin, and not done in a passion by surprise: It is committed in that place, and in that form, as acts of greatest deliberation should be done: As if he should say, upon full disquisition, evidence and deliberation, I condemn this person, and his cause.

7. All this is done as in the Name of God, and by his own commission, by one that pretends to be his officer or minister, Rom. 3:3- 6. For the judgement is the Lord’s; 2 Chron. 19:8-10 &amp; 19:5-7. And how great a wickedness is it thus to blaspheme, and to represent Him as Satan, an enemy to truth and righteousness, to his servants and Himself?…

8. It is sin against the fullest and frequentest prohibitions of God. Read over Ex. 23:1-3, etc.; Lev. 10:15; Dt. 1:16-17 &amp; 16:18; Isa. 1:17, 20, 23; Dt. 24:17 &amp; 27:19, ‘Cursed be he that perverts the judgement of the stranger, the fatherless and widow, and all the people shall say Amen’; Ezra 7:26; Ps. 33:5 &amp; 37:28 &amp; 72:2 &amp; 94:15 &amp; 106:3,30; Prov. 17:27 &amp; 19:28 &amp; 20:8 &amp; 29:4 &amp; 31:5; Eccl. 5:8; Isa. 5:7 &amp; 10:2 &amp; 56:1-2 &amp; 59:14-15; Jer. 5:1 &amp; 7:5 &amp; 9:24; Eze. 18:8 &amp; 45:9; Hos. 12:6; Amos 5:7,15,24 &amp; 6:12; Mic. 3:9; Zech. 7:9 &amp; 8:16; Gen. 18:19; Prov. 21:3,7,15. I cite not the words to avoid prolixity…

9. False judges cause the poor to appeal to God against them, and the cries of the afflicted shall not be forgotten, Lk. 18:5-8.

10. They call for God’s judgement upon themselves, and devolve the work into his hands… Ps. 9:7-9, ‘The Lord hath prepared his throne for judgement, and he shall judge the world in righteousness, he shall minister judgement to the people in uprightness; he will be a refuge for the oppressed;’ Ps. 37:6, ‘He will bring forth righteousness as the light, and thy judgement as the noon day;’ Ps. 89:14, ‘Justice and judgement are the habitation of his throne;’ Ps. 103:6, ‘The Lord executeth righteousness and judgement for all that are oppressed;’ Ps. 146:7. In a word, the sentence of an unjust Judge is passed against his own soul, and he calls to God to condemn him righteously, who unrighteously condemned others. Of all men, he cannot stand in judgement, nor abide the righteous doom of Christ.</p></blockquote>

<blockquote><p>First, that the setting up of Christ to be King is the greatest, the most desirable good that ever can betide any Nation.

Secondly, that the concurrence of Nobles and Commons, and Soldiers, and Ministers, and Citizens to this work; their concurrence I say in this work, is the most glorious, the most amiable, the most desirable means of attaining this great good that any soul can wish; and if both these be manifested, that the one is the greatest, and the other the most desirable means to attain it; where these two things meet there must needs be matter of great you.</p></blockquote>

<blockquote><p>On the other side, let the government of the reformed churches be observed, in them there is no supreme jurisdiction, but an authority which always submitteth it self to the rule of God’s word, and Canons of a discipline regulated by it. Every man being subjected to the judgement, not of one alone, but of many, and those many not undertaking to bind any man by their authority, but only by the equity of their decrees, submitting themselves to the control of any man, yea and yielding to it, if it be accompanied with reason. The true church is of so ample a circumference that she cannot be governed by one alone, and of so Royal a descent, that in that which concerneth the conscience, she cannot be ruled by any but God himself.

Any other whosoever he be, employed in any function concerning her, must behave himself as her servant, not as her Lord, not prescribing her any thing, but bearing witness to what hath been prescribed her, not advancing himself above kings, but bowing unto them, not thinking, that his spiritual liberty, exempts him from bodily loyalty, but giving to Caesar, that which is Caesar’s, to God that which is God’s, honour to whom honour, tribute to whom tribute belongeth.

This is the platform and ground of jurisdiction in the protestant churches, very different from the Pope’s, who establisheth a spiritual monarchy in the church, who taketh upon him to judge all, without being judged by any, who requireth a blind obedience, grounded not upon the reason and equity of his injunctions, but upon the uncontrollable eminency of his place, making as much of his ordinances, as if they were brought down immediately from God, as having in the registry of his breast, the fullness of infallible knowledge.</p></blockquote>

<main class="wrap"><figure class="quote" id="q-ff21275831" data-kw="">
<blockquote><p>God demanded this perfect obedience from a man that was perfect in every way, and equal to the stipulated duty, for indeed: (1) through the image of God conferred upon Him, and in that image, original righteousness, He was blessed with spiritual wisdom… (2) He was to that point without any vice or sin (as much original as actual), through which alone his whole posterity was incapable of rendering to God his due (Rom. 8:3). Thus: (3) intrinsically, he was equipped with a perfect principle of obeying, namely, original righteousness; extrinsically, there was before him a perfect norm of obeying, nor did anything hinder that obedience.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/petrus-van-mastricht.html">Petrus van Mastricht</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Theoretical Practical Theology</cite>, (RHB) | vol. 3, Bk. 3, ch. 12, section 19, ‘The man who was to render perfect obedience to God was perfect in every way’</span></figcaption>

</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-7c4489d22d" data-kw="">
<blockquote><p>For remission of sins does not only deliver from pain, to wit, eternal death; but also brings glory or eternal life. The reason of which thing is this, that remission of sins, wherein man’s justification consists, is remission of all sins: and therefore not only of sins of committing, but also of sins of omitting: whereby it comes that he to whom God forgives sins, is so accounted of, as if he had not only committed nothing which God has forbidden in his law: but also, omitted nothing of that which he has commanded: and therefore, as if he had perfectly fulfilled the law of God. Now where the perfect fulfilling of the law is, there also is life, according to that, ‘The man that doeth these things shall live in them.’ Moreover, the example of civil judgment which Bellarmine brings, proves not his assumption: because that absolution is unlike to the absolution of God. For this is universal, to wit from all sins against the law of God: but that is particular or special; to wit, from some certain crime or crimes, against the politic laws. Notwithstanding, the civil judge gives unto him whom he has quitted from certain crimes those rewards which he has promised to the innocent, namely, preservation in life and defence; although he give him no new and singular rewards which he has promised only to certain virtuous exploits. And so God gives eternal life as a reward to those unto whom He has promised it, to wit, unto those that keep his law: such as He accounts all those whose sins He has forgiven.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/johannes-piscator.html">Johannes Piscator</a></span><span class="wk"><span class="lbl">Work:</span> <cite>A Learned &amp; Profitable Treatise of Man’s Justification. Two Books. Opposed to the Sophisms of Robert Bellarmine, Jesuit</cite>, (London, 1599) 128 pp. ToC, bk. 2, ch. 4, pp. 106-8</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/justification/active-and-passive-obedience-imputed.html">Active and Passive Obedience Imputed</a></span></div>

</figure><figure class="quote" id="q-488385444a" data-kw="">
<blockquote><p>Howbeit this exposition of the term justification seems faulty as well as the former: and that two ways: … 2. With them all, it presumes in the matter of justification a needles twofold act, the not-imputation of sin, and the imputation of righteousness, as two distinct things; whereas not to impute sin in consideration of satisfaction made for it, is no other thing than to impute righteousness to the party therein concerned. Since that a man cannot be deemed or doomed guiltless or faultless, but he must of necessity be deemed or doomed just or righteous; there being no medium or middle state between a delinquent or a guilty person and one guiltless or just. He that can prove himself no delinquent, but free from fault, must of necessity be justified, acquitted and assoiled as just. See Dt. 25:1. If nothing but sin can make a man unjust, then surely the utter absence of sin must necessarily make a man just. See Paul’s plea, Acts 25:8.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/thomas-gataker.html">Thomas Gataker</a></span><span class="wk"><span class="lbl">Work:</span> <cite>An Antidote Against Error Concerning Justification</cite>, … (d. 1654; London: Brome, 1670), pp. 19-20</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/justification/active-and-passive-obedience-imputed.html">Active and Passive Obedience Imputed</a></span></div>

</figure><figure class="quote" id="q-08f2c04b0b" data-kw="">
<blockquote><p>But I fear the sense of this [said by antinomians], that ‘Christ repents for us, and obeys for us, He being the end of the Law to overy one that believes,’ be far otherwise, to wit, that Christ’s obedience of the Law, He being the end of the Law, as also his passive obedience is ours. If this be the intended sense, then: [1.] All our sanctification is nothing but the sanctification and holy active obedience of Christ. I yield this to be a broad, a fair and easy way to heaven. Christ does all for us [according to antinomians:], Christ weeped for my sins, and that is all the repentance required in me, if I believe that Christ was mortified and dead to the world for me, that is my mortification; and if I believe that the change of the whole man was truly in Christ, this is my true holiness: then my walking in holiness cannot be rewarded with life eternal, nor have any influence as a way or means leading to the kingdom. 2. Christ’s active obedience imputed to the sinner can be no evidence of justification, because it is in Christ, not in me; any evidence or mark of justification must be inherent in the believer, not in Christ. 3. And one and the same thing cannot be a mark and a sign of itself. Now the active obedience of Christ imputed to the sinner is holden [by antinomians] to be a part of justification [and therefore it cannot be a sign of justification].</p></blockquote>

<blockquote><p>2. In accepting us as righteous in Christ, who died for our sins to reconcile us unto God; and therefore sometimes he is said to be made righteousness to us, 1 Cor. 1:30, and we are said to be made the righteousness of God in Him, 2 Cor. 5:21, that is, we have the effect of his sufferings, as if we had suffered in person; for they were undergone in our stead and for our sakes, and the fruit of it given to us by God Himself.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/thomas-manton.html">Thomas Manton</a></span><span class="wk"><span class="lbl">Work:</span> <cite>A Second Volume of Sermons preached by the late reverend and learned Thomas Manton in two parts: the first containing 27 Sermons on the Twenty-Fifth chapter of St. Matthew</cite>, … (London: Astwood, 1684), Sermons on Rom. 8, Sermon 43, on Rom. 8:33, p. 333</span></figcaption>

<main class="wrap"><figure class="quote" id="q-57e3ee3491" data-kw="">
<blockquote><p>The laws then which the Church in proper speech is said to make, are decrees concerning outward order and comeliness in the administration of the Word and sacraments, in the meetings of the congregation, etc. and such laws made according to the general rules of God’s Word (which require that all things be done to edification, in comeliness, for the avoiding of offence) are necessary to be observed, and the Word of God binds all men to them so far forth as the keeping of them maintains decent order, and prevents open offence. Yet if a law concerning some external rite or thing indifferent, be at some time upon some occasion omitted no offence given, not contempt showed to ecclesiastical authority, there is no breach made in the conscience: and that appears by the example before handled. The apostles guided by the Holy Ghost made a decree for the avoiding of offence necessary to be observed, namely that the Gentiles should abstain from strangled [animals] and blood and idolythites, and yet Paul out of the case of scandal and contempt, permits the Corinthians to do otherwise, 1 Cor. 8 &amp; 9, which he would not have done, if to do otherwise out of the case of scandal and contempt had been sin</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/william-perkins.html">William Perkins</a></span><span class="wk"><span class="lbl">Work:</span> <cite>A Discourse of Conscience</cite>, (1596), pp. 67-68</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/civil-government-and-society/marriage-and-family.html">Marriage and Family</a></span></div>

od/#:~:text=The%20laws%20then%20which%20the%20Church,scandal%20and%20contempt%20had%20been%20sin&amp;text=The%20laws%20then%20which%20the%20Church%20in%20proper&amp;text=case%20of%20scandal%20and%20contempt%20had%20been%20sin" rel="noopener" target="_blank">Read it online · Reformed Books Online</a></div>
</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-a45f6ee05b" data-kw="">
<blockquote><p>If it be asked, whether the consent of parents be essential to marriage? the common sentence will resolve it, Multa impediunt matrimonium contrahendum, quae non dirimunt contractum, so that consent is necessary, necessitate praecepti, sed non necessitate medii [by the necessity of precept, but not by a necessity of means]; though by human constitution such marriages may be disallowed, and the issue repute as unlawful, but the marriage cannot be annulled, l. 11. de stat. hom. l. 13 §. 6. de Adult, by which laws, not only the Issue of such marriages are excluded from succession, but the marriage itself insinuate to be null, which human constitutions cannot reach, though the magistrate or minister, celebrator of the marriage, may refuse to proceed without consent of the parents; as by the law and custom of Holland, Art. 3. Ord. Pol. It is statute that… where the parties are minor, they be not married without consent of their parents; and where they are both major, intimation must be made to the parents, and if they appear not, their consent is presumed; and if they do appear and dissent, they must condescend upon the reasons, that it may be cognosced whether they be sufficient or not: And if the marriage do otherways proceed, they account it null… neither do the civil constitutions of princes annul or dissolve marriage, whatever they may work as to the interest of the married persons… Yea, between Jews and Christians, for diversity of religion cannot annul it.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/viscount-of-stair-james-dalrymple.html">James Dalrymple</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Other citations (work not named)</cite>, Title 4, ‘Conjugal Obligations’ in The Institutions of the Law of Scotland Deduced from its Originals, … (Edinburgh: Anderson, 1681), pp. 28-44, p. 32</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/civil-government-and-society/marriage-and-family.html">Marriage and Family</a></span></div>

</figure><figure class="quote" id="q-9d56faea0f" data-kw="">
<blockquote><p>Lastly, the question may be asked touching the daughter of a man given in marriage, the husband commandeth one thing, and the father another, whether of these is to be obeyed, the husband, or the father? I answer, the husband. For, as she must obey her husband before the father, so she is to love the husband better also, and God commandeth the man to leave father and mother and to cleave to his wife (Gen. 2:24), which is also a commandment unto the woman to leave parents, and to cleave to her husband, for they twain shall be one flesh, Mt. 19:5; Eph. 5:31; 1 Cor. 6:16: Therefore in this [latter] case the will of the husband is to be preferred before the will of the father. For as it is in the two great lights which God hath set in the firmament, the lesser evermore giveth place to the greater, and when the sun shineth, the light of the moon fadeth and vanisheth away: so when the greater authority of the husband commeth in place, the lesser power and authority of the father ceaseth. Besides, his giving of her in marriage to the husband is a giving away of his own right over her, as well as over that portion of goods which he bestoweth with her: so that now his authority is abridged, nay clean abolished.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/william-attersoll.html">William Attersoll</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Commentary on Numbers</cite>, (London, 1618), p. 1166</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/civil-government-and-society/marriage-and-family.html">Marriage and Family</a></span></div>

</figure><figure class="quote" id="q-8edd371a20" data-kw="">
<blockquote><p>Lo, before ever there was father or mother or son in the world, God has appointed that the bonds betwixt husband and wife shall be more strait and indissoluble than betwixt the parent and child; and can any man be so unreasonable as to defend it lawful upon some unkind usages or thwartness of disposition, for a parent to abandon and forsake his child; or the son to cast off his parent? Much less therefore may it be thus betwixt an husband and wife: They two are one flesh. Behold here an union of God’s making: A man’s body is not more his own than his wife’s body is his: And will a man be content to part easily with a piece of himself? Or can we think that God will endure an union made by Himself to be slightly dissolved? Or how is this bodily matrimony a lively image of the spiritual marriage betwixt Christ and his Church (who has said, ‘I will betroth thee unto me forever; Yea I will betroth thee unto me in righteousness and in judgment, and in loving kindness, and in mercies,’ Hos. 2:19), if upon small occasions it may be subject to utter dissolution? Yea, what speak I of divinity? Even modest heathens would hiss this Libertinism off the stage…</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/joseph-hall.html">Joseph Hall</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Cases of Conscience Practically Resolved Containing a Decision of the Principal Cases of Conscience of Daily Concernment &amp; Continual Use Amongst Men</cite>, (London, 1654), 4th Decade, Case 2, ‘Whether Marriage Lawfully made may Admit of any Cause of Divorce, save only for the Violation of the Marriage Bed, by Fornication or Adultery?’, p. 303, pp. 303-4</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/civil-government-and-society/marriage-and-family.html">Marriage and Family</a></span></div>

<blockquote><p>Question 19: May one [de]part from a husband or wife that has the leprosy or that has the French pox [syphilis] by their adulterous practices, when the innocent persons life is endangered by it. Answer: If it be an innocent person’s disease, the other must cohabit, and tenderly cherish and comfort the diseased; yea, so as somewhat to hazard their own lives, but not so as apparently to cast them away, upon a danger not like[ly] to be avoided, unless the other’s life, or some greater good be like[ly] to be purchased by it. But if it be the pox of an adulterer, the innocent party is at liberty [to divorce] by the other’s adultery, and the saving of their own lives does add thereto. But without adultery the disease alone will not excuse them from cohabitation, though it may from congress [coming together in sexual union].</p></blockquote>

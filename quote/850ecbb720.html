<main class="wrap"><figure class="quote" id="q-850ecbb720" data-kw="">
<blockquote><p>That the heavy hand of God upon a Nation, as it is laid on for sin, so for the most part not merely for punishment and destruction, but to discover to us the evil of our doings, that they may be repented of, and put away. And so there is much mercy in the midst of these Judgments, if they be improved to those ends to which their nature is fitted for, and which we are commanded to make of them.

The greatest of these Calamities to those that remain, are but like the sounding of a Trumpet, the giving an Alarm, the shooting off a Warning-piece, the hanging forth of a white Flag, and all speak to this purpose, That though the Sins of a Nation have been exceeding great and provoking, whereby the Anger of the most holy God is justly kindled against them, which he sends these his Judgments to testify, that yet he is willing to put up all former affronts that have been offered, if now at length they will become a reformed People, and with detestation of their sins turn from them unto God and his holy Ways; but if not, that his anger shall not be turned away, but his hand stretched out still, till he hath made a full end of them, and will follow them with judgment after judgment, till they are cast into the lowest hell.

So that you see plainly the Rod, hath a voice, and is a kind of Sermon, but comes nearer to the sense, and will force an observance more than mere words could do. We could choose whether we would read a Bible or good Book, or regard a Minister or godly Neighbour, giving us this very Lesson as plainly, but in a more gentle manner. We could stop our ears, or turn our backs, or harden our hearts against all the most awakening, startling Truths: We could make a pish of the most dreadful threatenings in the Book of God, denounced against those very sins we committed; we could laugh at our Teachers and Reprovers, and scorn at the offers of their love for our recovery.

And when we were sunk into such a deplorable estate, wanting nothing of falling head-long into Hell, but the withdrawing of that miraculous patience which kept us out every moment, then in infinite mercy did our God, who like a wise Physician, suits his potions to the nature of the disease, and temper of his Patients, make bare his Arm, and reveal himself and his pleasure to us, in a way most likely to affect us, if we who yet survive, be not obstinately bent upon our own destruction.</p></blockquote>

<blockquote><p>For such persons are not recalled by Disputations, Discourses, or Human Reasonings. That they may be healed and converted, God himself must speak, must scourge, and terrify them, with his revengeful Judgements. The sin of such Persons is like that of Sodom and Gomorrah, viz, Pride, Fulness of Bread, and Abundance of Idleness. (Ezech. xvi. 49.) They most especially are troubled with this Disease, who live in this World, according to their own desires, who abound with the Goods of this present World, who are overwhelmed with the Wealth, Honours, Sweets, and Pleasures of this Life: For the turning away of the Simple shall slay them, and the Prosperity of Fools shall destroy them; Prov. i. 32.

Whilst they enjoy this Prosperity, and have their ease and quiet, they avert their thoughts from God; the Remembrance of whom would but make them sad, and would much trouble their Repose, since they cannot promise to themselves any good from him, who loveth Virtue, Justice, and Holiness, which in no ways is consistent with that kind of Life, which they have chosen, to pass it in Pleasure, Delicateness, and Effeminacy.

Then do they stop their Ears, as the Serpent against the Charms of the Charmer, they leave off to be wise, and to do good; therefore they are not capable of receiving Instruction, and they would be very angry to acknowledge their Error; because, if so, they must be bound to amend their Lives, which is that they will not do, finding it wonderfully sweet and delicious.

But when they are met with by Death, and that they be a grappling with her, when she doth over-power them, or when by some notorious, wonderful, and exemplary Judgement of God, they are fallen from their Greatness, Wealth, Goods, &amp; Pleasures, and are reduced to the State of Job, or the Prodigal Son in the Gospel: then sometimes they may be healed, then their affrighted Conscience doth awake them from their deep slumber; then at sometimes they open their eyes to the acknowledgement, and detestation of their Error. Without this, they are like those, who, being sick of a Lethargy, may be pinched, spoken to, &amp;c. yet never budge, nor will not awake; because they take more pleasure in their sleep, and drowsiness, which at last lays them in their Grave.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/louis-cappel.html">Louis Cappel</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The hinge of faith and religion: or, a proof of the deity against atheists and profane persons, by reason, and the testimony of Holy Scripture: the divinity of which is demonstrated</cite>, trans. Philip Marinel (London: Thomas Dring, 1660), preface.</span></figcaption>

</figure><figure class="quote" id="q-ac832da950" data-kw="">
<blockquote><p>For the first, we lay hold on all the arguments that prove the Word preached to be the only means of converting the soul, begetting of faith and that carnal weapons are not able, yea nor were they ever appointed of God to doing down strong holds, nor can they make a willing people: and Lactantius said well, ‘What is left to us, if another’s lust 〈◊〉 th•t by force, which we must do willingly?’ (Lactantius, Institutes, bk. 5, ch. 14) And that of Tertullian: ‘It is of the law or right of man and of his natural power what every man worships, what he thinks he should worship, nor does the religion of one either do good or do evil to another man, nor is it religion to compel religion, which ought to be received by will, not by force: since sacrifices (of worship) are required of a willing mind.’ (Tertullian ad Scapul••) In which I observe:

1. Tertullian speaks not of the true Christian religion, which is now in question, but of religion in general as it is comprehensive of both true and false religion. Because he speaks of that religion which by the Law of nature a man chooses, and is humani juris et naturalis potestatis [‘of human law and natural power’]: but it is not of the law of man or natural power, nor in flesh and blood’s power to choose the true Christian religion; that election is supernatural says Tertullian there and elsewhere often, as also the Scripture: Jn. 6:44; Mt. 16:17; 11:25-27.

2. ‘Religion’ is taken two ways: 1. For the inward and outward acts of religion as seen both to God and man, as Lactantius, Tertullian and others say: so it is most true. Christians ought not with force of sword compel Jews, nor Jews or pagans compel Christians to be of their religion, because religion has begotten many by persuasion of the mind, not by forcing of the man. [2.] Again ‘religion’ is taken for the external profession and acting and performances of true religion within the Church, or by such as profess the truth, that are obvious to the eyes of magistrates and pastors, and thus the sword is no means of God to force men [who are not professing Christians] positively to external worship or performances.</p></blockquote>

<div class="actions"><button class="copy" data-copy="“For the first, we lay hold on all the arguments that prove the Word preached to be the only means of converting the soul, begetting of faith and that carnal weapons are not able, yea nor were they ever appointed of God to doing down strong holds, nor can they make a willing people: and Lactantius said well, ‘What is left to us, if another’s lust 〈◊〉 th•t by force, which we must do willingly?’ (Lactantius, Institutes, bk. 5, ch. 14) And that of Tertullian: ‘It is of the law or right of man and of his natural power what every man worships, what he thinks he should worship, nor does the religion of one either do good or do evil to another man, nor is it religion to compel religion, which ought to be received by will, not by force: since sacrifices (of worship) are required of a willing mind.’ (Tertullian ad Scapul••) In which I observe:

1. Tertullian speaks not of the true Christian religion, which is now in question, but of religion in general as it is comprehensive of both true and false religion. Because he speaks of that religion which by the Law of nature a man chooses, and is humani juris et naturalis potestatis [‘of human law and natural power’]: but it is not of the law of man or natural power, nor in flesh and blood’s power to choose the true Christian religion; that election is supernatural says Tertullian there and elsewhere often, as also the Scripture: Jn. 6:44; Mt. 16:17; 11:25-27.

2. ‘Religion’ is taken two ways: 1. For the inward and outward acts of religion as seen both to God and man, as Lactantius, Tertullian and others say: so it is most true. Christians ought not with force of sword compel Jews, nor Jews or pagans compel Christians to be of their religion, because religion has begotten many by persuasion of the mind, not by forcing of the man. [2.] Again ‘religion’ is taken for the external profession and acting and performances of true religion within the Church, or by such as profess the truth, that are obvious to the eyes of magistrates and pastors, and thus the sword is no means of God to force men [who are not professing Christians] positively to external worship or performances.”

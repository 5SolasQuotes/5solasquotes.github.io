<main class="wrap"><figure class="quote" id="q-adde82de61" data-kw="">
<blockquote><p>Question: How is an ecclesiastical covenant necessary? Answer: Conclusion 1. It is not necessary as a means to eternal salvation, since explicit communion with a particular visible Church is not necessary. Conclusion 2. It is necessary as a means to external communion with the visible Church, some covenant partly implicit and tacit, partly explicit and vocal. Conclusion 3. It is necessary for well-being, that is, it facilitates legitimate ecclesiastical communion and mutual edification, so that at least such explicit profession and covenant is maintained, which we have mentioned above is well or at least moderately maintained in properly ordered Churches. Conclusion 4. Yet we do not consider our own form, let alone the more exact and laborious one which is urged today by some (into whose requirements we inquired a little earlier), to be so absolutely necessary that without it Churches which are thus far without it would not in any way be Churches to us; nor would there be members, nor consequently would all those Churches be destroyed, as to their matter or body, as to their species and form; or if this is not done, then from outside (if not against them), from some withdrawing members, and others from other places joining their number, new and separate Churches should be erected in the same city or village. The reasons are: 1. Because that external form of profession of faith, promise, and admission into Church communion is fundamentally divine; but in its final formality and perfection it is ecclesiastical, for it is an application to particular circumstances of persons, places, times, and that through intervening free deliberations and ecclesiastical constitutions, which can be changed or remitted in cases of necessity. 2. Because with such canonical formalities, though lawful, indeed excellently conducted, the essence of the Church should not be so strictly alleged, and in it and through it the essence of the communion of saints; 3. Because with the canonical formalities of the Papacy rejected, indeed of the ancient Church itself (as prescribed by the Code of Canons of the Universal Church) in great part and even largely restored by established freedom and apostolic simplicity, we should not contend through ambiguities for the same or similar precipitations, and impose the yoke of new ecclesiastical authority and ecclesiastical constitutions so rigidly that we seem to leave nothing to the judgment and freedom of other Churches, not even in matters of detail. 4. For what appears to follow from this is absurd and inconvenient, namely, that it should be necessary to immediately withdraw from those Churches to which the external form of this covenant and its most integral integrity are not present. I do not see how this would not amount to rejecting Donationism and dividing Churches into the smallest parts, indeed into dust, after the manner of the Anabaptists (although today much has been lacking and improved among them). Conclusion 5. Nevertheless, whoever is in conscience bound by the necessity of divine precept to seek and promote the most perfect and exact things in this matter, according to Phil. 3:15, Heb. 6:1, and 2 Cor. 11:2-3.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/gisbert-voetius.html">Gisbert Voetius</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Ecclesiastical Politics</cite>, tr. by AI (Amsterdam: Joannes à Waesberge, 1663–1676), vol. 1, ‘The Nature of the Instituted Church’, pp. 64-68 (PDF p. 70)</span></figcaption>

<blockquote><p>2. By virtue of this church communion, they say, one church by letters of recommendation may give power to another church over any of her members for excommunication, and the ministers of one church may convey power to the ministers of another church for administration of the sacraments to any of their members. Cotton, Catechism, p. 7; Apology, pp. 2, 14, 26, 40; J.W. to T.S… 3. But without such letters of recommendations and formal granting over of such power, from one church and minister to another, it were unlawful in any case to administer any church ordinance to any church or members but their own or to admit them to any church communion upon any pretense whatsoever. Apology, pp. 14, 26, 40.</p></blockquote>

</figure><figure class="quote" id="q-98a386b464" data-kw="">
<blockquote><p>Reason 12. Those (moderate men) that are most against Church-covenantings, speak only against the necessity of them; but the lawfulness they deny not, no nor the convenience in case of liberty; no nor the necessity of the thing, but only of the circumstantials and manner of expression, and ends by some affixed. They require that the people expressly consent to the choice of their minister, and that they be examined before the sacrament of their knowledge in the fundamentals. This differs from what we propound but in circumstances. And I should think it more seasonable and convenient to be satisfied of our people’s spiritual sufficiency and capacity for Church-communion at our first reformation of a disordered Church, or in a well-ordered Church, at their first transition out of the state of imperfect, infant members, and admission into the number of adult members (and after this, to suppose their right good to communion and Church privileges, till it be on sufficient grounds disproved, excepted against or questioned by any) than to try them as only for admission to the Lord’s Supper, suffering them to live quietly in the reputation of members, [even] so [when] they will not come to the Table of the Lord.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/richard-baxter.html">Richard Baxter</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Christian Concord, or the Agreement of the Associated Pastors &amp; Churches of Worcestershire, with Richard Baxter’s Explication &amp; Defence of it, &amp; his Exhortation to Unity</cite>, (London: A.M., 1653) | ‘An Explication of some Passages in the foregoing Propositions’, p. 14</span></figcaption>

<blockquote><p>[John Owen:] ‘To make men members of any particular churches, their own consent is required.’ If he mean this of an explicit consent (as I suppose he does, or he says nothing) it is fully disproved above; and implicit confessed [consent is] sufficient. A man that removes his habitation (as both he and we grant, it’s free for him to do) may, by setting down in another congregation and submitting himself to all the ordinances of Christ there, with performance of all offices of love to the members of that congregation, implicitly and yet sufficiently consent[s] to be a member thereof. And on the other hand, a man may not remove his habitation from a congregation wherein he has long consented to communicate, and yet remove his consent to be a member of another, as we see too much, in this loose and wandering age.</p></blockquote>

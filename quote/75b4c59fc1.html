<main class="wrap"><figure class="quote" id="q-75b4c59fc1" data-kw="">
<blockquote><p>It has been affirmed by several learned writers that the Daemoniacs mentioned in the Gospel were persons laboring only under natural diseases, such as a deep melancholy [depression], madness or epilepsy, and not at all affected by any evil spirits. This opinion was intimated above a hundred years ago by Mr. Joseph Mede [d. 1639, in his 4th Discourse on John 10:20], and, about forty years since, urged with great vehemance by Dr. [Arthur] Sykes [an Anglican, latitudinarian, Arian, clergyman, 1684–1756, in his Enquiry into the Meaning of Demoniacs in the New Testament, 1737], when it was as warmly opposed by some other divines. The same hypothesis was afterwards taken up by Dr. [Nathaniel] Lardner [d. 1768, a Socinain-Unitarian] in his Case of the Demoniacs of the New Testament; and is now revived again and enforced by the Reverend Hugh Farmer…” – John Fell, ‘Introduction’ to Daemoniacs Wikipedia on Sykes: “…rejecting any belief in the existence of demons and regarding those possessed as simply suffering from mental illness. In this he went further than Joseph Mede’s exposition of the Doctrine of Demons, as in the later work of Dr. Richard Mead. Sykes also rejected the devil as a supernatural evil being, anticipating the allegory argument of John Epps [d. 1869]… These works were part of a larger debate on demonology and possession, with Sykes siding with the sceptics Francis Hutcheson and Thomas Woolston, against Zachary Pearce and Richard Smalbroke.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/leonard-twells.html">Leonard Twells</a></span><span class="wk"><span class="lbl">Work:</span> <cite>An Answer to the Enquiry into the Meaning of Demoniacs in the New Testament</cite>, [by Arthur Sykes] Ref (London, 1737)</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/angels-and-demons/evil-angels.html">Evil Angels</a></span></div>

<blockquote><p>The fifth and last [unlawful] remedy is exorcism, which is an adjuring and commanding the devil in the name of God to depart from the possessed party and to cease to molest him anymore. This means was used by our Savior Christ Himself, and after Him by His apostles and other believers in the time of the primitive church when the gift of working miracles was in force. But in these days (as I said before) that gift is ceased, and also the promise of power annexed to the use of adjuration, and therefore the means thereof must needs cease. And for an ordinary man now to command the devil in such sort is mere presumption and a practice of sorcery.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/william-perkins.html">William Perkins</a></span><span class="wk"><span class="lbl">Work:</span> <cite>A Discourse of the Damned Art of Witchcraft</cite>, … (Cambridge, 1610), ch. 7, ‘The application of the doctrine of witchcraft to our times’, section 3, question 3, ‘Whether a man may prevent the danger of witchcraft, and if he may, then what remedies he may lawfully and effectually use against it?’, pp. 245-46</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/angels-and-demons/evil-angels.html">Evil Angels</a></span></div>

ener" target="_blank">Read it online · Reformed Books Online</a></div>
</figure><figure class="quote" id="q-fd871d8b27" data-kw="">
<blockquote><p>2nd Use. If we pray God to deliver us from evil, then we must beware of all satanical practises as means of help in any distress; this is gross hypocrisy to pray against the evils of Satan and to give ourselves to the practise of them. Herein many offend, for the Papists say this prayer, but yet their religion in many things is a gross practice of magic and sorcery; for first: the consecration of their host in the mass is plain conjuration: and so are their exorcisms in halowing salt, bread, and water, their casting out of devils by certain words, by the sign of the cross, the application of relics and such like: nay, come to ourselues, what is more common among us than to use charmes and amuletts, to seek to witches and sorcerers when any strange affliction does befall us? And the setting of a figure, though it be not gross magic, yet therein is a close and privy work of the devil, his hand is deep therein: and the Church in former times has condemned it for witchcraft: for charms, characters and amulets be but the devil’s watchword and sacraments to set him a working: what though the words used be good, yet therein is Satan’s deeper policy, who turns himself into an angel of light, under fair shows working the greater mischeif. But what horrible impiety is this, that when God gives us occasion to come unto Him, we leave Him and run for help to his professed enemies.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/william-perkins.html">William Perkins</a></span><span class="wk"><span class="lbl">Work:</span> <cite>A Godly &amp; Learned Exposition of Christ’s Sermon in the Mount</cite>, on Mt. 6:13 in A Godly &amp; Learned Exposition of Christ’s Sermon in the Mount... (Cambridge, 1608), p. 315</span></figcaption>

<blockquote><p>(3) The next step [in the Roman heirarchy of offices] is that of Exorcists, whose pretended office is to cast out devils, in a feigned imitation of the miraculous operations of the first ages of Christianity. These sacred conjurers, who take upon them to dispossess devils, are inferior to the very deacons that serve tables [in Romanism], and yet equal to the very apostles, were they able to perform what they undertake. Though one would wonder why the bishops [of Romanism], the pretended successors of the apostles, did not reserve to themselves the power of casting out unclean spirits, as well as that of conferring the Holy Spirit, which, as they say, none but themselves can do. But these exorcists are men of that extraordinary power that they out-do the very apostles, for they did not cast out devils by laying on of hands, as these pretend to do. The bishop tells them that they are spirituales imperatores ad abjiciendos daemones de corporibus obsessis — i.e. they are spiritual governors to cast out devils, etc. to which purpose he gives them power of laying hands super energumenos sive baptizatos sive catechumenos (Pontif. de Ord. Exorc.)….</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/james-owen.html">James Owen</a></span><span class="wk"><span class="lbl">Work:</span> <cite>A Plea for Scripture Ordination</cite>, … (London, 1694), ch. 5 (2nd), pp. 78-79 Owen (1654-1706) was a presbyterian minister; his funeral sermon was preached by Matthew Henry.</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/angels-and-demons/evil-angels.html">Evil Angels</a></span></div>

<blockquote><p>([Margin Note:] Places Haunted by Evil Spirits must be Shunned) 3rd Use. This branch of the petition serves to direct us what to do in this case: say that a dwelling house or some other place is by God’s permission haunted and abused by some evil spirit, whether may a man lawfully frequent or abide in such a place? Answer: By this petition is plain he may not; for here we pray to be delivered from evil, and therefore we may not voluntarily thrust ourselves into such a place as is haunted by the devil: would we come within the compass of the lion’s paw, or within the chain of a mad dog, or of an hunger-bitten bear? Why then should we rashly thrust ourselues into the danger of the devil, who like a roaring lion seeks continually whom he may devour. Many ignorant people are so bold-hardy that they will rai•e upon and defy the deuil, and command him to be gone. But without a calling thereunto we may not so do. Indeed, if by God’s providence we be called to live in such places necessarily, then this we may do, we must not reason with the devil, but betake ourselves to God by humble and earnest prayer, and complain of Satan’s vexation, making God our shelter and defence both for soul and body: else if we presume to meddle with him without a calling from God, we may justly be foiled and abused by him (as the sons of Sceva were, Acts 19:14,16) because we have no promise from the Lord to be protected from him.</p></blockquote>

<main class="wrap"><figure class="quote" id="q-a9aceb5085" data-kw="">
<blockquote><p>Nay suppose some should so extol the fullness and sufficiency of the Scriptures that they should hold them so perfect and sufficient for all Christians as to be a perfect rule for all civil government, and that Chrstian commonwealths ought to be governed by laws only there recorded and by no other (which opinion in substance Carolostadius held; that in courts of justice judges should not proceed according to humane laws, but according to the law of Moses; and so for military practices, should hold all the way of war must be founded upon the Scriptures, and thereupon should clamor against any other art and way of war than what was practised there. What would you reply to these men, or what strength were there in such principles? Would not you answer them in what sense the Scriptures were perfect, and how they must understand it?</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/thomas-edwards.html">Thomas Edwards</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Antapologia, or, A Full Answer to the Apologetical Narration of Mr. Goodwin, Mr. Nye, Mr. Sympson, Mr. Burroughs, Mr. Bridge, members of the Assembly of Divines wherein is Handled Many of the Controversies of These Times</cite>, (London: G.M., 1644), p. 72</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/civil-government-and-society/the-civil-magistrate.html">The Civil Magistrate</a></span></div>

</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-031e75f6c4" data-kw="">
<blockquote><p>I conceive kings are conceived to have a threefold supreme power:

1. Strictly absolute to do what they please, their will being simply a law. This is tyrannical. Some kings have it, de facto, ex consuetudine [by custom], but by a divine law none have it…

2. There is another power limited to God’s law, the due proper right of kings. (Dt. 17:18-20)

3. There is, a potestas intermedia, a middle power, not so vast as that which is absolute and tyrannical, which yet is some way human. This I take what jurists call jus regium, lex regia, jura regalia regis; Cicero, jura majestatis; Livius, jura imperii, and these royal privileges are such common and high dignities as no one particular magistrate can have [inherently, or to himself alone], seeing they are common to all the kingdom… so the magazine and armory for the safety of the kingdom is in the king’s hand. The king has the like of these privileges, because he is the common, supreme, public officer and minister of God for the good of all the kingdom; and, amongst these royal privileges, I reckon that power that is given to the king, when he is made king, to do many things without warrant of the letter of the law, without the express consent of his council, which he cannot always carry about with him, as the law says. The king shall not raise armies without consent of the parliament; but if an army of Irish, or Danes, or Spaniards, should suddenly land in Scotland, he has a power, without a formally-convened parliament, to command them all to rise in arms against these invaders and defend themselves — this power no inferior magistrate has as he is, but [only] such a magistrate [as the king]. And in many such exigencies, when the necessity of justice or grace requires an ex-temporal [out of the moment] exposition of laws, pro re nata, ‘for present necessary execution’, some say only the emperor, — others, all kings have these pleasures.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/samuel-rutherford.html">Samuel Rutherford</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Lex Rex</cite>, ... (1644; Edinburgh: Ogle, 1843), Question 39, ‘Whether or No any Prerogative at All Above the Law be Due to the King, or if Jura Magestatis [the Rights of Majesty] be any Such Prerogative Royal?’, p. 193</span></figcaption>

</figure><figure class="quote" id="q-c1a1f211d5" data-kw="">
<blockquote><p>But Magistrates as Magistrates hold forth in their Law-abstinence from those same sins of adultery, incest, murder; But:

1. Not to the consciences of their subjects, but to the outer man as members of the commonwealth.

2. Not under the pain of eternal wrath and condemnation, before the judge of quick and dead: Magistrates as Magistrates have neither calling, office, place nor power to threaten or inflict eternal punishment; if Magistrates do persuade the equity of abstinence from adultery, incest, murder, in their statutes, or acts of parliament, from the Word of God, from the sixth and seventh command of the Decalogue, from the judgement and eternal punishment that follows these sins, they so persuade not as magistrates, but as divines, and as godly and Christian men…

3. Magistrates as Magistrates hold forth in their Law, abstinence from these sins, not as the ambassadors of Christ, craving subjection of conscience and divine-faith to those charges, but only external obedience: for though ministers as ministers crave faith and subjection of conscience to all commandments and inhibitions, as in Christ’s stead, 2 Cor. 5:19-20, yet the magistrate as the magistrate does not crave either faith or subjection of conscience; nor is he in Christ’s stead to lay divine bands on the conscience, to submit the soul and conscience to believe and abstain; he is the deputy of God as the God of Order, and as the Creator, and Founder, and another of human societies and of Peace, to exact external obedience, and to lay bands on your hands not to shed innocent blood, and on your body not to defile it with adultery, or incest, nor to violate the chastity of your brother… when the magistrate punishes spiritual sins, heresy, idolatry, he punishes them only with temporary punishment.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/samuel-rutherford.html">Samuel Rutherford</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Divine Right of Church Government</cite>, ... (1646), pp. 550-51</span></figcaption>

<blockquote><p>To these appertains the doing and execution of civil and temporal affairs, so as their subiects may live in peace. By reason whereof the taxes and subsidies are due unto them and to them appertain to use the sword which God has given them, for the preservation as well of the countries which be committed to them, as also for the defence and maintenance of good laws, and punishment of the evil and wicked doers. Secondly, the duty and office of the magistrates is not to regard simply the peace and concord of subiects, but principally for this end, that the peace and concord may tend to the honor and glory of God, that all men may live not only in a certain civil honesty, but also with piety and true worship of God, as witnesses saint Paul. For this cause especially it appertains to the magistrate that the laws which he uses and executes may be conformable to the will of God: and principally to give order that the religion be perfect and holy, and that all the Church be ordered according to the Word of God, forbidding and punishing, as the case requires, all those which trouble the Church or concerning the discipline thereof [Beza’s larger context makes clear he is speaking in the context of a Christian nation].</p></blockquote>

<main class="wrap"><figure class="quote" id="q-17e6751446" data-kw="">
<blockquote><p>Which action of God [i.e. Creation], since it is voluntary, Rev. 4:11, is not proper to one person, but common to three, Gen. 1:26; Ps. 33:6; and therefore is attributed to the Father, Acts 4:24, to the Son, Jn. 1:3 &amp; 10, Col. 1:16; Heb. 1:2 &amp; 10, and to the Holy Spirit, Job 26:13; Ps. 95:5 with Heb. 3:7 &amp; 9, yet with a preserved order of acting: but more frequently to the Father, by a certain excellence; not indeed of nature or action, but of personal order: because the Father is the first person in order, from whom the other two have the origin of their person from eternity; and therefore creation, and similar divine actions, are usually referred to the Father as to the first person.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/francis-gomarus.html">Francis Gomarus</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Epitome of Theological Common Places</cite>, (d. 1641; Amsterdam: Jansson, 1653), Locus 6, ‘On the Creation of the World’, trans. AI at Confessionally Reformed Theology</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/the-trinity/the-persons.html">The Persons</a></span></div>

</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-8f3b8fc5f4" data-kw="">
<blockquote><p>Among all the works of God those things rightly hold the first place, which concern the glory of His creation. For neither is it permitted, that we should consider concerning those works which are of the Father toward the Son, of the Son toward the Father, of both toward the Holy Spirit, of the Holy Spirit toward both, which are neither scrutable, nor necessary to be known: but it is abundantly sufficient, if the creature should acknowledge, look up unto and glorify the work of its creator as creator, propagator, conservator, reparator, governor and consummator.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/wolfgang-musculus.html">Wolfgang Musculus</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Loci Communes Sacrae Theologiae 3rd</cite>, ed. (Basel: Hervagius, 1564), ‘On Creation’, trans. AI at Confessionally Reformed Theology</span></figcaption>

</figure><figure class="quote" id="q-bd6f90c25f" data-kw="">
<blockquote><p>&quot;I cannot think of the unity without being irradiated by the Trinity: I cannot distinguish between the Trinity without being carried up to the unity.&quot; Therefore, let us beware of imagining such a Trinity of persons as will distract our thoughts, instead of bringing them instantly back to the unity.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/john-calvin.html">John Calvin</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Institutes of the Christian Religion</cite>, 1.13.17</span></figcaption>

— John Calvin, Institutes of the Christian Religion, 1.13.17">Copy</button><a class="share" href="https://x.com/intent/post?text=%E2%80%9C%22I%20cannot%20think%20of%20the%20unity%20without%20being%20irradiated%20by%20the%20Trinity%3A%20I%20cannot%20distinguish%20between%20the%20Trinity%20without%20being%20carried%20up%20to%20the%20unity.%22%20Therefore%2C%20let%20us%20beware%20of%20imagining%20such%20a%20Trinity%20of%20persons%20as%20will%20distract%20our%20thoughts%2C%20instead%20of%20bringing%20them%20instantly%20back%20to%20the%20unity.%E2%80%9D%0A%0A%E2%80%94%20John%20Calvin%2C%20Institutes%20of%20the%20Christian%20Religion%2C%201.13.17&amp;url=https%3A%2F%2F5solasquotes.github.io%2Fquote%2Fbd6f90c25f.html&amp;via=5Solas" target="_blank" rel="noopener">Share on X</a><a class="perma" href="../quote/bd6f90c25f.html">Permalink</a><a class="src" href="https://ccel.org/ccel/calvin/institutes" rel="noopener" target="_blank">Read it online · CCEL</a></div>
</figure><figure class="quote" id="q-eedfe4cad5" data-kw="Son generation">
<blockquote><p>Therefore, Scripture considers three persons in God, who are one God. The Father is indeed the source and principle of divinity, the Son is the Word and Wisdom of the Father, begotten from eternity and without beginning in time, and the Holy Spirit is the divine power proceeding from the Father and the Son.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/pierre-du-moulin.html">Pierre Du Moulin</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Theological Theses on the One God and Three Persons</cite>, VIII</span></figcaption>

<div class="actions"><button class="copy" data-copy="“Therefore, Scripture considers three persons in God, who are one God. The Father is indeed the source and principle of divinity, the Son is the Word and Wisdom of the Father, begotten from eternity and without beginning in time, and the Holy Spirit is the divine power proceeding from the Father and the Son.”

— Pierre Du Moulin, Theological Theses on the One God and Three Persons, VIII">Copy</button><a class="share" href="https://x.com/intent/post?text=%E2%80%9CTherefore%2C%20Scripture%20considers%20three%20persons%20in%20God%2C%20who%20are%20one%20God.%20The%20Father%20is%20indeed%20the%20source%20and%20principle%20of%20divinity%2C%20the%20Son%20is%20the%20Word%20and%20Wisdom%20of%20the%20Father%2C%20begotten%20from%20eternity%20and%20without%20beginning%20in%20time%2C%20and%20the%20Holy%20Spirit%20is%20the%20divine%20power%20proceeding%20from%20the%20Father%20and%20the%20Son.%E2%80%9D%0A%0A%E2%80%94%20Pierre%20Du%20Moulin%2C%20Theological%20Theses%20on%20the%20One%20God%20and%20Three%20Persons%2C%20VIII&amp;url=https%3A%2F%2F5solasquotes.github.io%2Fquote%2Feedfe4cad5.html&amp;via=5Solas" target="_blank" rel="noopener">Share on X</a><a class="perma" href="../quote/eedfe4cad5.html">Permalink</a><span class="src none">No free online copy linked</span></div>
</figure><figure class="quote" id="q-ee79620246" data-kw="">
<blockquote><p>VIII. Nor is God the univocal cause of the world, but the equivocal; nor necessary and immanent, as Spinoza wishes, Ethics, pt. 1, On God, Proposition 18, p. 19, but free and transient, or better: Creation, taken actively, is not an immanent, but a transient action, by which God produces things diverse from Himself and confers being upon them, the immediate principle of which action is the practical volition of God, his command and mandate. For an agent is then said to act transiently when it actually flows into an external effect diverse from the agent, which has its place in Creation, where a true and real influx of God into the creature is given, signified by the command of God in:Gen. 1:3, “Let there be light: and there was light.”… From this it appears clearer than daylight that here is given a true and real influx of an efficient cause into the effect, and therefore a true and real transient action. These things being diligently observed, the whole of Spinozism collapses. … XI. The preceding, i.e., intrinsically moving, cause is the divine goodness, communicative and diffusive of itself, by which it came to pass that God, blessed in Himself, went forth outside Himself and communicated his goodness with creatures. Ps. 127:5-8; 145:9. He produced all things from nothing, and declared His immense goodness, wisdom, and power to the creature, especially the rational one, by which in turn He would be acknowledged and worshipped. The directing and ordering cause is knowledge, wisdom, and, based on these as a directive principle, the decree of God, as an imperious principle, which is accompanied by the power of God as an executive principle, which things were decreed from knowledge and most wisely. Whence in Eph. 1:11, God is said to do all things ‘according to the counsel of His own will.&#x27;</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/barthold-holtzfus.html">Barthold Holtzfus</a></span><span class="wk"><span class="lbl">Work:</span> <cite>‘Theological Dissertation on Creation’</cite>, (Frankfurt: Steppinus, 1706), trans. AI Latin</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/creation/the-six-days.html">The Six Days</a></span><span class="t"><a href="../topics/the-trinity/the-persons.html">The Persons</a></span></div>

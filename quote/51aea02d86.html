<blockquote><p>Theology is a discipline, partly theoretical and partly practical, teaching the manner of living well and blessedly for eternity. … We know God and Christ in such a way that this knowledge produces something in us. Thus, when I know that God is all‑knowing, I ascribe to him this praise: that he knows all my defects and the poverty of both my soul and body. From this, I turn to prayer, asking him to pardon the former and graciously supply the latter. Likewise, when I know him to be almighty, I turn to him so that he may bend my heart to his statutes. Therefore, the knowledge of God’s omnipotence, omniscience, and his other attributes is indeed theoretical, yet it produces practice within us. And so theology consists partly in contemplation and partly in action.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/johannes-maccovius.html">Johannes Maccovius</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Loci Communes Theologici: Theological Commonplaces</cite>, (Amsterdam, 1658), p. 1. (Translated by Copilot.)</span></figcaption>

</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-9a5a5dc267" data-kw="">
<blockquote><p>The supporters of this Seminary are thorough and sound Presbyterians. No uncertain note is given from the pulpits of the alumni of this institution. The directors believe that the students graduated from this Seminary will be, theologically, largely what you make them. Therefore, we believe your teaching must be dogmatic. Your philosophy and your metaphysics will be great contributions to the power of your teaching. But, after all, our theology is not based on secular philosophy or modern psychology but on the Word of God, as contained in the Holy Scriptures, — described in our Confession as the only infallible rule of faith and practice.

Therefore, we expect the students to be taught with a fire of conviction, which cannot help leaving its impression upon them, so that your teaching will not seem to be the abstract discussion of a man who has only half thought his subject through: “Ever learning, but never coming to a knowledge of the truth”. But rather that kind of teaching which presents the result of the teacher’s own labours as he builds his system of theology on the eternal truth of God, revealed by him in our infallible Scriptures.

Such a teacher translates his theological science for his students — not alone correlating great theological principles or distinguishing the Biblical and professional teaching from erroneous views; but while it will be teaching of the highest scholarship, it will gain power — constructive power — by reason of the teacher’s own experience in the application of these great truths to his own soul. This, I believe, is what makes great theological teachers. It was this that made more than one of your distinguished predecessors what they were, and it is this that produces in our ministry men who are not dabblers in theology, but constructive defenders of our Presbyterian doctrinal heritage.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/maitland-alexander.html">Maitland Alexander</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Charge to Dr. Snowden in Bulletin of the Western Theological Seminary</cite></span></figcaption>

<blockquote><p>The controversy over Aristotelianism hardly ended with Aquinas’s work, much less with his death. In 1270, while Aquinas was still alive, Stephen Tempier, the bishop of Paris, had condemned several propositions associated with Averroism, though these did not include any defended by Aquinas. But after Aquinas’s death, in 1277, Tempier went on to condemn 219 propositions, some of which were clearly to be found in Aquinas. This led Albert the Great to come to Paris to defend his former student, and other Dominicans also threw themselves into the task of upholding the doctrine of their fellow friar. Indeed, the study of Aquinas was to become mandatory within the order. This Dominican defense and consolidation of Aquinas’s teaching beginning just after his death is sometimes taken by historians to constitute the beginning of the first of three periods in the history of Thomism. That it was successful is evidenced by the facts that Aquinas was declared a saint by Pope John XXII in 1323, and that two years later, in 1325, Tempier’s condemnations of 1277 were revoked by his successor. Just as Dominicans had generally defended Aquinas, members of the Franciscan order had been among his fiercest critics. The rivalry between the two orders would only become more bitter as a result of the influence of the Franciscan thinkers John Duns Scotus (c. 1266-1308) and William of Ockham (c. 1287-1347). Scotus and Ockham tended toward voluntarism, which emphasizes God’s will over his intellect and thus makes his actions more impenetrable to our rational understanding than they are on Aquinas’s account. Ockham is famously associated with nominalism, which denies the existence of universals. From the Thomistic point of view, these doctrines threaten to undermine the intelligibility of the world and the rational foundations of ethics and of our knowledge of God. Aquinas’s positions were ably defended against them by the likes of John Capreolus (1380-1444), who became known as princeps Thomistarum or ‘foremost Thomist.’ A second period in the history of Thomism is sometimes dated roughly from the period of the Protestant Reformation and the Council of Trent (1545-63)…</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/edward-feser.html">Edward Feser</a></span><span class="wk"><span class="lbl">Work:</span> <cite>‘The Thomistic tradition, Part I’</cite>, (2009)</span></figcaption>

<blockquote><p>Nineteenth-century Thomists like Joseph Kleutgen (1811-83) sought to revive the Aristotelian-Thomistic tradition in the face of these modern developments, and their efforts were massively aided by Pope Leo XIII’s encyclical Aeterni Patris (1879), which called for a renewal of Thomism, and of Scholastic philosophy in general. The result was a Neo-Thomistic and Neo-Scholastic movement which marked a third phase in the history of Thomism, dominated Roman Catholic thought until the Second Vatican Council (1962-65), and has dramatically influenced the modern understanding of Aquinas’s thought down to the present day. Several schools of thought describing themselves as ‘Thomistic’ have developed over the course of the last century or so, each representing a different response to the characteristic themes and assumptions of modern philosophy. Since they have had such a profound influence on the contemporary debate over Aquinas’s thought, it will be worthwhile briefly to describe the main positions:

1. Neo-Scholastic Thomism: The dominant tendency within Thomism in the first decades after the revival sparked by Leo’s encyclical, this approach is reflected in many of the manuals and textbooks widely in use in Roman Catholic colleges and seminaries before Vatican II. Due to its emphasis on following the interpretative tradition of the great commentators on Aquinas (such as Capreolus, Cajetan, and John of St. Thomas) and associated suspicion of attempts to synthesize Thomism with non-Thomistic categories and assumptions, it has also sometimes been labeled “Strict Observance Thomism.” Still, its focus was less on exegesis of the historical Aquinas’s own texts than on carrying out the program of deploying a rigorously worked out system of Thomistic metaphysics in a wholesale critique of modern philosophy. Its core philosophical commitments are summarized in the famous “Twenty-Four Thomistic Theses” approved by Pope Pius X. Reginald Garrigou-Lagrange (1877-1964) is perhaps its greatest representative.

2. Existential Thomism: Etienne Gilson (1884-1978), the key proponent of this approach to Thomism, tended to emphasize the importance of historical exegesis but also to deemphasize Aquinas’s continuity with the Aristotelian tradition, highlighting instead the originality of Aquinas’s doctrine of being or existence. He was also critical of the Neo-Scholastics’ focus on the tradition of the commentators, and given what he regarded as their insufficient emphasis on being or existence accused them of ‘essentialism’ (to allude to the other half of Aquinas’s distinction between being and essence). Gilson’s reading of Aquinas as putting forward a distinctively ‘Christian philosophy’ tended, at least in the view of his critics, to blur Aquinas’s distinction between philosophy and theology. Jacques Maritain (1882-1973) introduced into Thomistic metaphysics the notion that philosophical reflection begins with an ‘intuition of being,’ and in ethics and social philosophy sought to harmonize Thomism with personalism and pluralistic democracy. Though “existential Thomism” was sometimes presented as a counterpoint to modern existentialism, the main reason for the label is the emphasis this approach puts on Aquinas’s doctrine of existence. Contemporary proponents include Joseph Owens and John F.

X. Knasas.

      3. Laval or River Forest Thomism: This approach emphasizes the Aristotelian foundations of Aquinas’s philosophy, and in particular the idea that the construction of a sound metaphysics must be preceded by a sound understanding of natural science, as interpreted in light of an Aristotelian philosophy of nature. Accordingly, it is keen to show that modern physical science can and should be given such an interpretation. Charles De Koninck (1906-1965), James A. Weisheipl (1923-1984), William A. Wallace, and Benedict Ashley are among its representatives. It is sometimes called “Laval Thomism” after the University of Laval in Quebec, where De Koninck was a professor. The alternative label “River Forest Thomism” derives from a suburb of Chicago, the location of the Albertus Magnus Lyceum for Natural Science, whose members are associated with this approach. It is also sometimes called ‘Aristotelian Thomism’ (to highlight its contrast with Gilson’s brand of existential Thomism) though since Neo-Scholastic Thomism also emphasizes Aquinas’s continuity with Aristotle, this label seems a bit too proprietary. (There are writers, like the contemporary Thomist Ralph McInerny, who exhibit both Neo-Scholastic and Laval/River Forest influences, and the approaches are not necessarily incompatible.)

      4. Transcendental Thomism: Unlike the first three schools mentioned, this approach, associated with Joseph Marechal (1878-1944), Karl Rahner (1904-84), and Bernard Lonergan (1904-84), does not oppose modern philosophy wholesale, but seeks to reconcile Thomism with a Cartesian subjectivist approach to knowledge in general, and Kantian epistemology in particular. It seems fair to say that most Thomists otherwise tolerant of diverse approaches to Aquinas’s thought tend to regard transcendental Thomism as having conceded too much to modern philosophy genuinely to count as a variety of Thomism, strictly speaking, and this school of thought has in any event been far more influential among theologians than among philosophers.

      5. Lublin Thomism: This approach, which derives its name from the University of Lublin in Poland where it was centered, is also sometimes called “phenomenological Thomism.” Like transcendental Thomism, it seeks to combine Thomism with certain elements of modern philosophy, though in a way that is less radically revisionist. In particular, it seeks to make use of the phenomenological method of philosophical analysis associated with Edmund Husserl and the personalism of writers like Max Scheler in articulating the Thomist conception of the human person. Its best-known proponent is Karol Wojtyla (1920-2005), who went on to become Pope John Paul II.

      6. Analytical Thomism: This newest approach to Thomism is described by John Haldane… its key proponent, as ‘a broad philosophical approach that brings into mutual relationship the styles and preoccupations of recent English-speaking philosophy and the concepts and concerns shared by Aquinas and his followers’ (from the article on ‘analytical Thomism’ in The Oxford Companion to Philosophy, edited by Ted Honderich). By ‘recent English-speaking philosophy’ Haldane means the analytical tradition founded by thinkers like Gottlob Frege, Bertrand Russell, G. E. Moore, and Ludwig Wittgenstein, which tends to dominate academic philosophy in the English-speaking world. Elizabeth Anscombe (1919-2001) and her husband Peter Geach are sometimes considered the first ‘analytical Thomists,’ though (like most writers to whom this label has been applied) they did not describe themselves in these terms, and as Haldane’s somewhat vague expression ‘mutual relationship’ indicates, there does not seem to be any set of doctrines held in common by all so-called analytical Thomists. What they do have in common seems to be that they are philosophers trained in the analytic tradition who happen to be interested in Aquinas in some way; and the character of their ‘analytical Thomism’ is determined by whether it tends to stress the ‘analytical’ side of analytical Thomism, or the ‘Thomism’ side, or, alternatively, attempts to emphasize both sides equally.</p></blockquote>

<div class="actions"><button class="copy" data-copy="“Nineteenth-century Thomists like Joseph Kleutgen (1811-83) sought to revive the Aristotelian-Thomistic tradition in the face of these modern developments, and their efforts were massively aided by Pope Leo XIII’s encyclical Aeterni Patris (1879), which called for a renewal of Thomism, and of Scholastic philosophy in general. The result was a Neo-Thomistic and Neo-Scholastic movement which marked a third phase in the history of Thomism, dominated Roman Catholic thought until the Second Vatican Council (1962-65), and has dramatically influenced the modern understanding of Aquinas’s thought down to the present day. Several schools of thought describing themselves as ‘Thomistic’ have developed over the course of the last century or so, each representing a different response to the characteristic themes and assumptions of modern philosophy. Since they have had such a profound influence on the contemporary debate over Aquinas’s thought, it will be worthwhile briefly to describe the main positions:

1. Neo-Scholastic Thomism: The dominant tendency within Thomism in the first decades after the revival sparked by Leo’s encyclical, this approach is reflected in many of the manuals and textbooks widely in use in Roman Catholic colleges and seminaries before Vatican II. Due to its emphasis on following the interpretative tradition of the great commentators on Aquinas (such as Capreolus, Cajetan, and John of St. Thomas) and associated suspicion of attempts to synthesize Thomism with non-Thomistic categories and assumptions, it has also sometimes been labeled “Strict Observance Thomism.” Still, its focus was less on exegesis of the historical Aquinas’s own texts than on carrying out the program of deploying a rigorously worked out system of Thomistic metaphysics in a wholesale critique of modern philosophy. Its core philosophical commitments are summarized in the famous “Twenty-Four Thomistic Theses” approved by Pope Pius X. Reginald Garrigou-Lagrange (1877-1964) is perhaps its greatest representative.

2. Existential Thomism: Etienne Gilson (1884-1978), the key proponent of this approach to Thomism, tended to emphasize the importance of historical exegesis but also to deemphasize Aquinas’s continuity with the Aristotelian tradition, highlighting instead the originality of Aquinas’s doctrine of being or existence. He was also critical of the Neo-Scholastics’ focus on the tradition of the commentators, and given what he regarded as their insufficient emphasis on being or existence accused them of ‘essentialism’ (to allude to the other half of Aquinas’s distinction between being and essence). Gilson’s reading of Aquinas as putting forward a distinctively ‘Christian philosophy’ tended, at least in the view of his critics, to blur Aquinas’s distinction between philosophy and theology. Jacques Maritain (1882-1973) introduced into Thomistic metaphysics the notion that philosophical reflection begins with an ‘intuition of being,’ and in ethics and social philosophy sought to harmonize Thomism with personalism and pluralistic democracy. Though “existential Thomism” was sometimes presented as a counterpoint to modern existentialism, the main reason for the label is the emphasis this approach puts on Aquinas’s doctrine of existence. Contemporary proponents include Joseph Owens and John F.

X. Knasas.

      3. Laval or River Forest Thomism: This approach emphasizes the Aristotelian foundations of Aquinas’s philosophy, and in particular the idea that the construction of a sound metaphysics must be preceded by a sound understanding of natural science, as interpreted in light of an Aristotelian philosophy of nature. Accordingly, it is keen to show that modern physical science can and should be given such an interpretation. Charles De Koninck (1906-1965), James A. Weisheipl (1923-1984), William A. Wallace, and Benedict Ashley are among its representatives. It is sometimes called “Laval Thomism” after the University of Laval in Quebec, where De Koninck was a professor. The alternative label “River Forest Thomism” derives from a suburb of Chicago, the location of the Albertus Magnus Lyceum for Natural Science, whose members are associated with this approach. It is also sometimes called ‘Aristotelian Thomism’ (to highlight its contrast with Gilson’s brand of existential Thomism) though since Neo-Scholastic Thomism also emphasizes Aquinas’s continuity with Aristotle, this label seems a bit too proprietary. (There are writers, like the contemporary Thomist Ralph McInerny, who exhibit both Neo-Scholastic and Laval/River Forest influences, and the approaches are not necessarily incompatible.)

      4. Transcendental Thomism: Unlike the first three schools mentioned, this approach, associated with Joseph Marechal (1878-1944), Karl Rahner (1904-84), and Bernard Lonergan (1904-84), does not oppose modern philosophy wholesale, but seeks to reconcile Thomism with a Cartesian subjectivist approach to knowledge in general, and Kantian epistemology in particular. It seems fair to say that most Thomists otherwise tolerant of diverse approaches to Aquinas’s thought tend to regard transcendental Thomism as having conceded too much to modern philosophy genuinely to count as a variety of Thomism, strictly speaking, and this school of thought has in any event been far more influential among theologians than among philosophers.

      5. Lublin Thomism: This approach, which derives its name from the University of Lublin in Poland where it was centered, is also sometimes called “phenomenological Thomism.” Like transcendental Thomism, it seeks to combine Thomism with certain elements of modern philosophy, though in a way that is less radically revisionist. In particular, it seeks to make use of the phenomenological method of philosophical analysis associated with Edmund Husserl and the personalism of writers like Max Scheler in articulating the Thomist conception of the human person. Its best-known proponent is Karol Wojtyla (1920-2005), who went on to become Pope John Paul II.

      6. Analytical Thomism: This newest approach to Thomism is described by John Haldane… its key proponent, as ‘a broad philosophical approach that brings into mutual relationship the styles and preoccupations of recent English-speaking philosophy and the concepts and concerns shared by Aquinas and his followers’ (from the article on ‘analytical Thomism’ in The Oxford Companion to Philosophy, edited by Ted Honderich). By ‘recent English-speaking philosophy’ Haldane means the analytical tradition founded by thinkers like Gottlob Frege, Bertrand Russell, G. E. Moore, and Ludwig Wittgenstein, which tends to dominate academic philosophy in the English-speaking world. Elizabeth Anscombe (1919-2001) and her husband Peter Geach are sometimes considered the first ‘analytical Thomists,’ though (like most writers to whom this label has been applied) they did not describe themselves in these terms, and as Haldane’s somewhat vague expression ‘mutual relationship’ indicates, there does not seem to be any set of doctrines held in common by all so-called analytical Thomists. What they do have in common seems to be that they are philosophers trained in the analytic tradition who happen to be interested in Aquinas in some way; and the character of their ‘analytical Thomism’ is determined by whether it tends to stress the ‘analytical’ side of analytical Thomism, or the ‘Thomism’ side, or, alternatively, attempts to emphasize both sides equally.”

<blockquote><p>Controversy – Is God able not only to deprive an innocent creature of life but also to condemn them to the eternal tortures of hell? We deny against certain Scholastics. Arguments 1. All the ways of God should be mercy and truth to those who keep covenant (Ps. 25:10).

2. Anyone approaching God should believe that He will reward their obedience with a reward not condemn them (Heb. 11:6).

3. In an innocent creature there can be no consciousness of guilt or the just judgment of God, which is the meaning of punishment.

4. No glory to God could arise from this but rather the dishonor of a tyrannical lord.

5. The righteousness of God demands that He acquit the holy, but it does not permit him to condemn someone who has not merited it (Ps. 18:26-27, Gen. 18:25, Ps. 7:11). Objections 1. He can reduce the innocent to nothing. Reply. Then he only takes away what He gave, but punishment would be to do injury to someone while existing.

2. He acts this way with Christ. Reply. He was our surety, who took our debts on Himself.

3. God can impute to us the sin of Adam. Reply. That is imputed to be ours which is truly ours just as the children of slaves are slaves and the sons of citizens are citizens and are reputed to be such.

4. We are permitted to kill innocent creatures. Reply.

1. Not rational ones.

2. Irrational ones (bruta) for our use (2 Pet. 2:12).

3. It is one thing to kill, another to give to the living the highest punishment according to one’s pleasure.</p></blockquote>

<main class="wrap"><figure class="quote" id="q-80b1f1023b" data-kw="">
<blockquote><p>According to Acts 17:26, it is certain that all mankind is derived from one man and that God made out of one blood the whole race of mankind. This is assented by reason because unity is the principle of multitude. Virtue alone is what makes the difference between us who are equally born. …

Twice, even thrice noble are they, whose nobility of their race is made perfect through the knowledge of human and divine things: and this knowledge shimmering, so to speak, with radiating precious stones, brings all men to the love and to the desire of it. Since the Sun has no excellence unless it is accompanied in this life by the excellence of the Polar Star and is followed by it in the future life, it seems to me that those people have taught me their subject matter on the base of a completely divine precept and have received all approbation, who combine the pleasant with the useful, and who, I say, join together their learned studies (which make them good citizens of their Fatherland) and theology, which in my opinion is the queen of sciences.

Reason dictates that noble men, being the tutors of the church, must be steeped with knowledge of the things that concern the church. For when there is no desire for the unknown, there is no care for it. Hence the tears the church weeps over the apostasy of many. This apostasy originates from nothing else than the fact that such people have been completely ignorant of divine things. Scripture recommends kings of three ranks: Melchisedek, king and priest, David, king and prophet, and others as kings only. The alliance of political dignity and holy orders in one and the same person is in accordance with the opinion of the doctors of the church arguing that noble men must be bound by care, zeal and anxiety regarding divine things.

Even the pagans who are only enlightened by the light of nature rejoiced in such things: ‘King Anius was at the same time king of the people and priest of Phoebus’. And Trismegistus is called thrice the greatest, because he was the greatest philosopher, the greatest priest and the greatest king, according to Alexander of Naples, Book 2, chapter 6.12 But there is no need to spend more time on praising the heathens. The Christian Church has had Alfonso, the king of Aragon, who became most famous by reading Holy Scripture ten times including the glossa ordinaria from the beginning to the end. Theodosius was an emperor who sought the greatest part of his glory not in being an emperor, but in submitting himself to the empire of Christ as a member of the church.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/nicolaus-arnoldus.html">Nicolaus Arnoldus</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Letter to Johannes Maccovius, Scholastic Discourse: On Theological and Philosophical Distinctions and Rules, PIRef 4, trans. Willem J. van Asselt et al, ed. William den Boer (1656; Apeldoorn: Institute for Reformation Research, 2009), pp 43, 45, 47.</cite></span></figcaption>

<blockquote><p>Doth the plowman plow all day to sow? doth he open and break the clods of his ground? When he hath made plain the face thereof, doth he not cast abroad the fitches, and scatter the cummin, and cast in the principal wheat and the appointed barley and the rie in their place? For his God doth instruct him to discretion, and doth teach him. For the fitches are not threshed with a threshing instrument, neither is a cart wheel turned about upon the cummin; but the fitches are beaten out with a staff, and the cummin with a rod. Bread corn is bruised; because he will not ever be threshing it, nor break it with the wheel of his cart, nor bruise it with his horsemen. This also cometh forth from the Lord of hosts, which is wonderful in counsel, and excellent in working.</p></blockquote>

<blockquote><p>1041. But it should be noted that although he says that taxes are owed to rulers as a wage for their labours, rulers can sin in two ways by accepting taxes.

First, if they do not procure the people’s welfare but are intent only on seizing their goods. Hence it says in Ezekiel: you eat the fat, you clothe yourselves with the wool, you slaughter the fatlings, but you do not feed the sheep (Ezek 34:3).

Second, if they violently take more than the law permits and more than the people can bear. Hence it says in Micah: hear, you heads of Jacob and rulers of the house of Israel! Is it not you who tear the skin from my people, and their flesh from their bones? (Mic 3:1).</p></blockquote>

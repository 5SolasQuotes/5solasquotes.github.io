<blockquote><p>It is not able to be said that Christ does not in any way pertain to reprobates. Christ pertains to them even (1) by right [jure] in the offer of the Gospel, (2) by the sufficiency of the death of Christ, (3) by the right of sharing in a common nature, (4) by right of the common, first transgression being expiated by Christ, (5) by right of the New Covenant being preached to the reprobate out of the grace of Christ, (6) by right of the charge of God inciting so that reprobates receive Christ.</p></blockquote>

<blockquote><p>Quest. Whether Christ loved all, and gave himself for all, because here the apostle saith, He loved me, and gave himself for me’?

Ans. 1. I answer briefly, first, that Christ’s loving and giving himself was parallel in even lines with God’s love and gift, John vi. 37, 39; for Christ gives himself for none but those which God hath first given him. Christ had his commission, and he came to do his Father’s will, not his own, John vi. 38, and will save all whom his Father hath given unto him; as it is John xvii. 6, ‘Thine they were, thou gavest them me.’ Those that the Father gives in election, Christ redeems, and by redemption saves; for redemption, in regard of efficacy, is no larger than God’s election. Therefore he joins, ‘Christ loved me, and gave himself for me.’ His love is only to those whom God gave him, for he looks upon all he died for as they were in his Father’s love. There are a company in the world whom God hates: ‘Esau have I hated,’ Rom. ix. 13. Here love and gift go both together. He gives himself for no more than he loves, and he loves no more than God loves.

Ans. 2. Again, whomsoever Christ did love and give himself for to death, there be other fruits which accompany this. They who have interest in Christ’s redemption, they have the spirit of application. Where there is obtaining by Christ anything of God, there, I say, is grace to apply it by his Spirit; and many things go with it. For them that he died for, as the apostle shews, Rom. viii. 11, ‘for them he rose again, and for them he sits at the right hand of God.’ These go together: ‘For if he spared not his own Son, but gave him to death for us all, how shall he not with him also freely give us all things?’ Rom. viii. 32. Where God gives Christ, he gives the spirit of application with him, Mat. xvii. 13, 2 Thess. iii. 2.

But we see that the greatest part of the world have not faith; for it is the faith of the elect, which worldlings not having, nor the grace of application, therefore they have not the favour of God obtained by Christ. So it is written, Rom. v. 10, ‘For if, when we were enemies, we were reconciled to God by the death of his Son, much more, being reconciled, we shall be saved by his life.’ These go together. Now the greatest part are not saved by his life, therefore they are not reconciled by his death.

Other places do clear this truth, as Heb. ix. 14, where is shewed, that where Christ hath offered up himself for any, there is also a purging of the conscience from dead works to serve the living God. But the most are not purged, therefore they have no interest in Christ’s death. A strong reason is further shewed hereof by Christ, John xvii. 9, where he avouches plainly, and makes a main difference between two sorts of people, saying, ‘I pray for them: I pray not for the world, but for them which thou hast given me, for they are thine.’

Obj. But here some may object, Christ’s death is of larger extent than his intercession.

Ans. To cut off this objection, Christ says after in the same chapter, ver. 17, ‘And for their sakes I sanctify myself, that they also may be sanctified through the truth.’ That is, I prepare and sanctify myself to be a sacrifice as a priest; I prepare myself to be a holy sacrifice for such; therefore Christ sanctified himself for them, not for the world. Under the law there was a brasen altar for sacrifice, and the golden altar for incense, which golden altar for incense was effectual for no more than the brazen altar was for sacrifice. And Christ offered himself a sacrifice for all those that he makes intercession for. The point is clear.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/richard-sibbes.html">Richard Sibbes</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Salvation Applied</cite>, (London, 1637) in Alexander B. Grossart (ed.), The Works of Richard Sibbes (1862-64; 7 vols, Edinburgh: Banner of Truth, 1977), v, 388-89.</span></figcaption>

<blockquote><p>O how much, my brethren, is included in these two words, addressed by a convinced sinner to the Saviour, “remember me!” The eternal salvation of a sinner hangs upon them. If he remembers him, all is well; if he forgets him, woe unto him, for it shall be ill with him. Had not Christ remembered and thought upon us in our low estate, and undertaken our cause, we would have been hopeless.

Had he not remembered his people, and borne their names on his breastplate, when he approached God as the great high-priest to make reconciliation for iniquity, their guilt would have remained. Did he not remember them, when they are lying polluted in their blood, and say to them, “Live,” they would die in their sins. Did he not continue to remember them, and pray for them, and help them by his Spirit, he that desires to have them as his prey would gain his object, and they would never see the kingdom of heaven.

Had the penitent thief dropped out of the memory of Christ, he would have dropped into hell at death, along with his blaspheming companion; for “nor thieves nor revilers shall inherit the kingdom of God.” How could he, an ignorant, lawless, God-despising, heaven-daring profligate, presume to lift up his eyes, or to apply at the gates of paradise, unless he had ground to believe that his gracious and merciful fellow-sufferer would remember him? But if he continued to think of him and own him, what might he not expect?

In fine, this prayer was offered believingly as well as fervently. He believed that Jesus had the highest interest with the Father, who would not refuse any thing which should be craved by him who had laid down his life at his command; that he was about to be put in possession of all power in heaven and earth; and that this included authority to bestow its honours and rewards on whomsoever he would.

And he believed that such was the grace, condescension, and compassion of the dying Redeemer, that he would not reject the application of a poor, convicted, condemned criminal, but wash him from his sins in his blood, and sanctify him by the power of his Spirit, and present him faultless before the throne of his glory with exceeding joy. Nor did he believe in vain, nor was the answer of his prayer long delayed or dubiously expressed; for Jesus instantly said to him, “Verily, I say unto thee, To-day shalt thou be with me in paradise.</p></blockquote>

Had the penitent thief dropped out of the memory of Christ, he would have dropped into hell at death, along with his blaspheming companion; for “nor thieves nor revilers shall inherit the kingdom of God.” How could he, an ignorant, lawless, God-despising, heaven-daring profligate, presume to lift up his eyes, or to apply at the gates of paradise, unless he had ground to believe that his gracious and merciful fellow-sufferer would remember him? But if he continued to think of him and own him, what might he not expect?

In fine, this prayer was offered believingly as well as fervently. He believed that Jesus had the highest interest with the Father, who would not refuse any thing which should be craved by him who had laid down his life at his command; that he was about to be put in possession of all power in heaven and earth; and that this included authority to bestow its honours and rewards on whomsoever he would.

And he believed that such was the grace, condescension, and compassion of the dying Redeemer, that he would not reject the application of a poor, convicted, condemned criminal, but wash him from his sins in his blood, and sanctify him by the power of his Spirit, and present him faultless before the throne of his glory with exceeding joy. Nor did he believe in vain, nor was the answer of his prayer long delayed or dubiously expressed; for Jesus instantly said to him, “Verily, I say unto thee, To-day shalt thou be with me in paradise.”

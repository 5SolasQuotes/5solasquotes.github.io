<main class="wrap"><figure class="quote" id="q-51668855c3" data-kw="">
<blockquote><p>And accordingly we distinguish of the effects of God’s love in respect whereof He is said to love his creature. For they may be considered either in respect of life temporal, or of life spiritual, or of life eternal. The first effects of love, as touching life temporal, God communicates to all that have life; thus He is said to save both man and beast, and the eyes of all are said to wait upon Him; He hears the cry of ravens; the sparrows fall not to the ground without the providence divine; The very lions roaring after their prey, do seek their meat at [from] God. Thus He may be said to be as the Savior, so the lover of all men; but especially of them that believe, to wit, both in respect of the comforts of life spiritual, and the joys of life eternal which He affords unto them…</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/william-twisse.html">William Twisse</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Doctrine of the Synod of Dort &amp; Arles Reduced to the Practice</cite>, (1651), p. 52</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/effectual-calling/common-grace.html">Common Grace</a></span></div>

</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-2c8774013a" data-kw="">
<blockquote><p>The doctrine of a universal atonement necessarily implies, not only that God desired and intended that all men should be benefitted by Christ’s death, for this, in some sense, is universally admitted, but that, in its special and peculiar character as an atonement, that is, as a penal infliction, as a ransom price, it should effect something bearing favorably upon their spiritual welfare. This could be only by its purchasing for all men the pardon of their sins and reconciliation with God, which the Scripture plainly represents as the proper and direct results or effects of Christ’s death.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/william-cunningham.html">William Cunningham</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Historical Theology</cite>, (1863), vol. 2 | Section VIII, ‘Extent of the Atonement’, pp. 328-9</span></figcaption>

</figure><figure class="quote" id="q-67c096ad66" data-kw="">
<blockquote><p>In point of fact, the Old Testament has a great deal to teach on the benevolent side of God’s self-revelation to the world at large. The strongest of terms are used on occasion to emphasize this truth. Even the covenant conception is not deemed too sacred to be employed for the purpose of describing the solemn manner in which God pledged to the whole of creation, in the day of Noah, His abundant, ever-flowing kindness in the sphere of natural life, His longsuffering in the view of universal sin, His common grace working for the restraint of sin. It is attributed to His righteousness, universally revealed, that He keeps this covenant and preserves man and beast. As Jonah took pity on his gourd, so He pities and spares the Ninevites and their cattle. His mercy is wider and deeper than the ocean of human misery.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/geerhardus-vos.html">Geerhardus Vos</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Scriptural Doctrine of the Love of God in The Presbyterian &amp; Reformed Review 13:1-37</cite>, (1902), p. 11</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/effectual-calling/common-grace.html">Common Grace</a></span></div>

</figure><figure class="quote" id="q-5a0e2e650e" data-kw="">
<blockquote><p>As we see from the Westminster Confession and the 1689 Baptist Confession the Puritans… followed Calvin in resisting false human rationalisations. For instance they resisted the idea that God only loves the elect and hates the non-elect. This error is called hyper-Calvinism. It is a very serious error which is recurring today. The Puritans… believed in the universal love of God for all mankind (1 Tim 2:1-6; 2 Peter 3:9).</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/erroll-hulse.html">Erroll Hulse</a></span><span class="wk"><span class="lbl">Work:</span> <cite>“The Example of the English Puritans”</cite>, (Reformation Today 153, Sept/Oct 1996)</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/effectual-calling/common-grace.html">Common Grace</a></span></div>

</figure><figure class="quote" id="q-26d67d5000" data-kw="">
<blockquote><p>Therefore they are idle dreamers who extend God’s gracious calling to each and every human being [such as Arminians]. For they mix up God’s love towards humanity (whereby God embraces all people as his own creatures) with the love whereby He has ordained to take into his grace a select number of people from the common crowd of sinners who are perishing for their own wickedness, and to guide them in Jesus Christ, the Son in whom He delights.</p></blockquote>

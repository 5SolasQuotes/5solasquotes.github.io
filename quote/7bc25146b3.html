<main class="wrap"><figure class="quote" id="q-7bc25146b3" data-kw="revealed will rejected counsel">
<blockquote><p>The counsel which the Pharisees are said to have rejected against themselves (Lk. 7:30) does not denote any conditional decree concerning saving the Pharisees under the condition of faith and repentance, but the will of command (viz., the testimony of John concerning Christ by which God gave counsel to them about the mode of obtaining eternal salvation).</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/francis-turretin.html">Francis Turretin</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Institutes of Elenctic Theology</cite>, 4.3.12</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/reprobation/reprobation-and-the-free-offer.html">Reprobation and the Free Offer</a> › <a href="../topics/reprobation/reprobation-and-the-free-offer/gods-revealed-will-and-secret-will.html">God’s revealed will and secret will</a></span><span class="t"><a href="../topics/reprobation/reprobation-and-the-free-offer.html">Reprobation and the Free Offer</a> › <a href="../topics/reprobation/reprobation-and-the-free-offer/the-inexcusability-of-those-who-refuse.html">The inexcusability of those who refuse</a></span></div>
<div class="actions"><button class="copy" data-copy="“The counsel which the Pharisees are said to have rejected against themselves (Lk. 7:30) does not denote any conditional decree concerning saving the Pharisees under the condition of faith and repentance, but the will of command (viz., the testimony of John concerning Christ by which God gave counsel to them about the mode of obtaining eternal salvation).”

— Francis Turretin, Institutes of Elenctic Theology, 4.3.12">Copy</button><a class="share" href="https://x.com/intent/post?text=%E2%80%9CThe%20counsel%20which%20the%20Pharisees%20are%20said%20to%20have%20rejected%20against%20themselves%20%28Lk.%207%3A30%29%20does%20not%20denote%20any%20conditional%20decree%20concerning%20saving%20the%20Pharisees%20under%20the%20condition%20of%20faith%20and%20repentance%2C%20but%20the%20will%20of%20command%20%28viz.%2C%20the%20testimony%20of%20John%20concerning%20Christ%20by%20which%20God%20gave%20counsel%20to%20them%20about%20the%20mode%20of%20obtaining%20eternal%20salvation%29.%E2%80%9D%0A%0A%E2%80%94%20Francis%20Turretin%2C%20Institutes%20of%20Elenctic%20Theology%2C%204.3.12&amp;url=https%3A%2F%2F5solasquotes.github.io%2Fquote%2F7bc25146b3.html&amp;via=5Solas" target="_blank" rel="noopener">Share on X</a><a class="perma" href="../quote/7bc25146b3.html">Permalink</a><span class="src none">No free online copy linked</span></div>
</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-c93619138f" data-kw="Hardening Justice Satan">
<blockquote><p>As for those wicked and ungodly men whom God, as a righteous judge, for former sins, doth blind and harden; from them He not only withholdeth his grace, whereby they might have been enlightened in their understandings, and wrought upon in their hearts; but sometimes also withdraweth the gifts which they had, and exposeth them to such objects as their corruption makes occasions of sin; and withal, gives them over to their own lusts, the temptations of the world, and the power of Satan.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/westminster-assembly.html">Westminster Assembly</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Westminster Confession of Faith</cite>, 5.6</span></figcaption>

</figure><figure class="quote" id="q-cca077ef66" data-kw="Hardening Depravity">
<blockquote><p>Suitably upon the will and affections he hath several acts, -- obfirming the one in corruption, and giving up the other to vileness, Rom. 1:24, 26, until the heart become thoroughly hardened, and the conscience seared; not forcing the one, but leaving it to follow the judgment of practical reason, -- which being a blind, yea, a blinded guide, whither can it lead a blind follower, but into the ditch? -- not defiling the other with infused sensuality, but provoking them to act according to inbred, native corruption, and by suffering frequent vile actings to confirm them in ways of vileness.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/john-owen.html">John Owen</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Righteous Zeal Encouraged by Divine Protection</cite>, sermon on Jer. 15:19–20</span></figcaption>

</figure><figure class="quote" id="q-5ef3f2a919" data-kw="Hardening Holy Spirit">
<blockquote><p>When his light is taken away, nothing remains but blindness and darkness: when his Spirit is taken away, our hearts become hard as stones: when his guidance is withdrawn, we immediately turn from the right path: and hence he is properly said to incline, harden, and blind those whom he deprives of the faculty of seeing, obeying, and rightly executing.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/john-calvin.html">John Calvin</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Institutes of the Christian Religion</cite>, 2.4.3</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/reprobation/hardening.html">Hardening</a> › <a href="../topics/reprobation/hardening/permission-and-hardening.html">Permission and hardening</a></span><span class="t"><a href="../topics/the-decrees-of-god/decree-and-sin.html">Decree and Sin</a> › <a href="../topics/the-decrees-of-god/decree-and-sin/hardening.html">Hardening</a></span></div>
<div class="actions"><button class="copy" data-copy="“When his light is taken away, nothing remains but blindness and darkness: when his Spirit is taken away, our hearts become hard as stones: when his guidance is withdrawn, we immediately turn from the right path: and hence he is properly said to incline, harden, and blind those whom he deprives of the faculty of seeing, obeying, and rightly executing.”

— John Calvin, Institutes of the Christian Religion, 2.4.3">Copy</button><a class="share" href="https://x.com/intent/post?text=%E2%80%9CWhen+his+light+is+taken+away%2C+nothing+remains+but+blindness+and+darkness%3A+when+his+Spirit+is+taken+away%2C+our+hearts+become+hard+as+stones%3A+when+his+guidance+is+withdrawn%2C+we+immediately+turn+from+the+right+path%3A+and+hence+he+is+properly+said+to+incline%2C+harden%2C+and+blind+those+whom+he+deprives+of+the+faculty+of+seeing%2C+obeying%2C+and+rightly+executing.%E2%80%9D%0A%0A%E2%80%94+John+Calvin%2C+Institutes+of+the+Christian+Religion%2C+2.4.3&amp;url=https%3A%2F%2F5solasquotes.github.io%2Fquote%2F5ef3f2a919.html&amp;via=5Solas" target="_blank" rel="noopener">Share on X</a><a class="perma" href="../quote/5ef3f2a919.html">Permalink</a><a class="src" href="https://ccel.org/ccel/calvin/institutes" rel="noopener" target="_blank">Read it online · CCEL</a></div>
</figure><figure class="quote" id="q-7dc5b5cb68" data-kw="">
<blockquote><p>Holy Scripture most especially highlights this eternal and undeserved grace of our election and brings it out more clearly for us, in that it further bears witness that not all people have been chosen but that some have not been chosen or have been passed by in God’s eternal election—those, that is, concerning whom God, on the basis of his entirely free, most just, irreproachable, and unchangeable good pleasure, made the following decree: to leave them in the common misery into which, by their own fault, they have plunged themselves; not to grant them saving faith and the grace of conversion; but finally to condemn and eternally punish those who have been left in their own ways and under God’s just judgment, not only for their unbelief but also for all their other sins, in order to display his justice.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/synod-of-dort.html">Synod of Dort</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Canons of Dort</cite>, Head 1, Art. 15</span></figcaption>

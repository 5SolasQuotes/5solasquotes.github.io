<main class="wrap"><figure class="quote" id="q-4bce4e3a71" data-kw="">
<blockquote><p>Let the prayer, thanksgiving, or blessing of the bread and wine, be to this effect: ‘With humble and hearty acknowledgment of the greatness of our misery, from which neither man nor angel was able to deliver us, and of our great unworthiness of the least of all God’s mercies; to give thanks to God for all his benefits… and for this sacrament in particular, by which Christ, and all his benefits, are applied and sealed up unto us, which, notwithstanding the denial of them unto others, are in great mercy continued unto us, after so much and long abuse of them all…&#x27;</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/westminster-assembly.html">Westminster Assembly</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Directory for Public Worship</cite>, Of the Celebration of the Communion, or Sacrament of the Lord’s Supper</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/worship/impurities-in-worship.html">Impurities in Worship</a></span></div>

</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-1cd7397674" data-kw="">
<blockquote><p>That which hinders the Church’s edification by the ruler’s fault, it may be the people’s duty to obey for a greater good. For instance, it is less edifying to use our old singing psalms than a better version. And yet for concord, if the ruler appoint them, the people must use them because concord with that imperfection is better than to sing everyone a several better version or diverse versions at once. So a faulty translation of Scripture, a weak sermon, an inconvenient hour and place, when concord is necessary and cannot be had in the more edifying circumstances, it must be had in the best way we can. If the sheriff appoint an unfit time and place to meet to choose parliament-men, it’s a duty to comply rather than not to meet at all. Every evil so far excludes good, and yet we must not renounce communion in all good where men mix any evil lest we also give over all good ourselves.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/richard-baxter.html">Richard Baxter</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Richard Baxter on Worship &amp; Catholicity against Separatism &amp; John Owen</cite>, (1684; RBO, 2024), p. 68</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/worship/impurities-in-worship.html">Impurities in Worship</a></span></div>

</figure><figure class="quote" id="q-8e9b37055c" data-kw="">
<blockquote><p>Baptism is fully and formally God’s ordinance, though the [sign of the] cross be needlessly and superstitiously added thereunto [on the baby’s head] and the parent (by virtue of whose interest in God’s Covenant, the child receives the seal) is unjustly excluded [in the Anglican practice], and a deputation of godfathers and godmothers is groundlessly imposed:</p></blockquote>

</figure><figure class="quote" id="q-9b8f5296de" data-kw="">
<blockquote><p>There was a certain man in Caesarea called Cornelius… A devout man, and one that feared God with all his house, which gave much alms to the people, and prayed to God alway… And he said unto him, ‘Thy prayers and thine alms are come up for a memorial before God… And as Peter was coming in, Cornelius met him, and fell down at his feet, and worshipped him. But Peter took him up, saying, ‘Stand up; I myself also am a man.’… ‘…Now therefore are we all here present before God, to hear all things that are commanded thee of God.’ Then Peter opened his mouth, and said, ‘Of a truth I perceive that God is no respecter of persons: But in every nation he that feareth Him, and worketh righteousness, is accepted with Him….’ While Peter yet spake these words, the Holy Ghost fell on all them which heard the word.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/old-testament.html">The Bible</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Acts 10:1-4 25-26, 33-35, 44</cite></span></figcaption>

</figure><figure class="quote" id="q-b472dcc2f0" data-kw="">
<blockquote><p>VIII. Though it be the surest way to peace and concord to take up with these necessary things, and we cannot approve of the narrow dividing principles of those men that will impose things unnecessary, to the excluding of the necessary, yet if our lawful rulers shall command it, or the peace of the Church through the distempers of the brethren shall require it, we shall obey, and consent in things that God has not forbidden; and if we suffer for well-doing, and for obeying God rather than men, we shall endeavor to imitate our Lord, who being reviled, reviled not again, and when he suffered, threatened not; but committed all to Him that judges righteously, 1 Pet. 2:23.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/richard-baxter.html">Richard Baxter</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Christian Religion expressed</cite>, The Christian Religion expressed: I, briefly in the Ancient Creeds, the Ten Commandments &amp; the Lord’s Prayer, and, II, more largely in a Profession taken out of the Holy Scriptures, containing 1, the articles of the Christian Belief, 2, our consent to the Gospel Covenant, 3, the Sum of Christian Duty according to the primitive simplicity, purity, and practice, fitted to the right instruction of the ignorant, the promoting of holiness, and the charitable concord of all true believers… (London: 1660), The Agreement of the Associated Pastors</span></figcaption>

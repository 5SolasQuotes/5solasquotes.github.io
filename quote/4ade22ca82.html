<main class="wrap"><figure class="quote" id="q-4ade22ca82" data-kw="">
<blockquote><p>Where persons do cherish secret predominant lusts in their hearts and lives, God is not in their thoughts as he ought to be. He may be, he often is, much in the words of such persons, but in their thoughts he is not, he cannot be, in a due manner. And such persons no doubt there are. Ever and anon we hear of one and another whose secret lusts break forth into a discovery. They flatter themselves for a season, but God ofttimes so orders things in his holy providence that their iniquity shall be found out to be hateful. Some hateful lust discovers itself to be predominant in them: one is drunken, another unclean, a third an oppressor.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/john-owen.html">John Owen</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The grace and duty of being spiritually minded declared and practically improved</cite>, (London, 1681) in W. H. Goold (ed.), The works of John Owen (16 vols, Edinburgh, 1965), vii, 357.</span></figcaption>

</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-bc57e011a2" data-kw="">
<blockquote><p>The truth of God is perfectly harmonious, and is one complete whole. All the parts of it fit into one another, and are mutually dependent upon each other; and as this edifice, so reared by God, is complete and compact in all its parts, so the subtle influence of Satan is often applied to the undermining of one part of the building, in the knowledge that if he should succeed, he can scarcely fail to effect the destruction of all the rest.

We might illustrate this by showing how error, in what at first sight may appear an unimportant point, ruins the whole system, and essentially affects the whole doctrines of the gospel. It may seem, for instance, that the dispute regarding the precise nature of saving faith is a comparatively unimportant point, and one on which Christian men may afford to differ; and yet an error on this point might easily be shown to affect the doctrines of God’s sovereignty, of human depravity, the extent and nature of the atonement, and justification by faith alone.

We might show, for example, that those who make justification by faith to consist in the belief of the fact that they are pardoned—who maintain that a man must believe that Christ died personally for him as an individual—are compelled necessarily to adopt a mode of statement in regard to the bearing of Christ’s death upon all men indiscriminately, and particularly upon the lost, which strikes at the root of the doctrine of personal substitution altogether, and makes it difficult, if not impossible, to believe that Christ actually suffered in the very room and stead of guilty sinners themselves.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/robert-candlish.html">Robert Candlish</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Cross of Christ; The Call of God; Saving Faith: An Inquiry into the Completeness and Extent of the Atonement. With especial reference to the Universal Offer of the Gospel, and the Universal Obligation to Believe</cite>, (2nd edn, Edinburgh: John Johnstone, 1845), pp 136-37.</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/the-christian-life/obedience-and-profession.html">Obedience and Profession</a></span></div>

<blockquote><p>10. And men are much furthered in the way of separation by forgetting what good even hypocrites themselves may receive by their station in the visible Church: And that it is not for nothing that the Great Master of the Church has so ordered the terms of admission (upon mere profession of consent to the baptismal Covenant) and of exclusion (upon proved impenitency in gross sin after sufficient admonition and patience) as that multitudes of bad men ever have been and will be in the visible Church: Though the regular station that such persons should choose, till they come up to sincere consent, is the place of catechumens, if they were not baptized in infancy, and the place of penitents if they were, yet supposing that they intrude further by a false profession, yet God has provided great advantages in Church communion for their good and secured the innocent from imputation of sin by reason of their presence.</p></blockquote>

</figure><figure class="quote" id="q-93c6663cc1" data-kw="">
<blockquote><p>As your heavenly Father has a common love, which he extends to all mankind… so ought you to have: though you are not obliged to take your enemies into your bosom, yet you ought to love them in their order. And as your heavenly Father, though he will one day have a satisfaction from sinners, for the wrong done to his majesty, unless they repent; yet, to heap coals of fire on their heads, gives them good things of common providence, that he might not leave them without witness, yea, and affords them the outward means of grace for their souls: so, although you are bound to seek some satisfaction for God’s honor and glory from flagitious sinners, and though you may in an orderly course seek a moderate satisfaction for the wrong done to yourselves, yet you ought to love them with a love consistent with these things; that so you may imitate your heavenly Father, and approve yourselves to be his children.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/john-collinges.html">John Collinges</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Matthew Poole’s English Annotations on the Holy Bible, on Mt</cite>, 5:44-45</span></figcaption>

</figure><figure class="quote" id="q-722c3c783d" data-kw="">
<blockquote><p>Dr. Girardeau has defended the old usage of our church with a moral courage, loyalty to truth, clearness of reasoning and wealth of learning which should make every true Presbyterian proud of him, whether he adopts his conclusions or not. The framework of his arguments is this: it begins with that vital truth which no Presbyterian can discard without a square desertion of our principles. The man who contests this first premise had better set out at once for Rome: God is to be worshipped only in the ways appointed in his word. Every act of public cultus not positively enjoined by him is thereby forbidden. Christ and his apostles ordained the musical worship of the New Dispensation without any sort of musical instrument, enjoining only the singing with the voice of psalms, hymns, and spiritual songs. Hence such instruments are excluded from Christian worship. Such has been the creed of all churches, and in all ages, except of the Popish communion after it had reached the nadir of its corruption at the end of the thirteenth century, and of its prelatic imitators.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/robert-l-dabney.html">Robert L. Dabney</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Review of Girardeau on Musical Instruments</cite></span></figcaption>
<div class="meta"><span class="t"><a href="../topics/the-christian-life/obedience-and-profession.html">Obedience and Profession</a></span></div>

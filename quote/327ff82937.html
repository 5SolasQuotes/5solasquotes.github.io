<main class="wrap"><figure class="quote" id="q-327ff82937" data-kw="">
<blockquote><p>…this exercise of discipline for restraining of scandals is to be subservient to the preaching of the Word: which is the main and great edifying ordinance; Therefore discipline would be ordered so as it may not mar, but further that… 1. That no censure would be blindly or implicitly made use of, but both in reference to the party, and others, there would be instruction, exhortation, conviction, etc. by the Word going before or alongst with the same. In which respect (though improperly) censures may be some way looked upon as sacraments in a large sense in these particular cases, because there is in them both some signifying and confirming use; They being considered with respect to the end wherefore they were appointed.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/james-durham.html">James Durham</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Dying Man’s Testament to the Church of Scotland, or a Treatise concerning Scandal</cite>, … (Edinburgh, 1659), pt. 2, ch. 2, p. 69</span></figcaption>

</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-4cf0dda483" data-kw="">
<blockquote><p>The ministry is for edification and not for destruction… God has told us that no positive duty is a duty at all times… He gives us all a charge to learn what this means, ‘I will have mercy and not sacrifice,’ which must needs import: I prefer mercy before sacrifice and would have no sacrifice which hinders mercy… as that according to God’s ordinary way of working, it were like to do more hurt than good; it were no duty at that time. Discipline is an ordinance of Christ: But if sound reason tell me that if I publicly call this man to repentance, or excommunicate him, it is like to do much hurt to the church and no good to him, it would be at that time no duty but a sin. As physic [medicine] must be forborne where the disease will but be exasperated by it. Therefore Christ bounds our very preaching and reproof with a ‘Shake off the dust off your feet as a testimony against them.’ And give not that which is holy to dogs, etc. when treading under foot and turning again and rending us, is likest to be the success, the wisdom of Christ and not that of the flesh only requires us to take it for no duty. This is to be observed by them that think that admonitions and excommunications, and exclusion from the sacrament must be used in all places and at all times alike, without respect to the end, come of it what will: Or that will tempt God by presuming that He will certainly either bless or at least justify their unseasonable and imprudent actions as if they were a duty at all times. To be either against the Scripture or against the end is a certain proof that an action is no duty, because no means.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/richard-baxter.html">Richard Baxter</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Cure of Church Divisions</cite>, … (London, 1670), pt. 1, Direction 37, pp. 205-7</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/church-government-and-the-ministry/forms-of-government.html">Forms of Government</a></span></div>

</figure><figure class="quote" id="q-c2e86419c9" data-kw="">
<blockquote><p>…his [John Robinson’s] answer is that no parish assemblies [under patrons and bishops] have power of right to choose their ministers. Whereas on the contrary it is most evident that every congregation of Christians has right unto this thing from Christ Himself so inseparably annexed unto it that no external oppression by others or abuse of their own can possibly deprive them of this right, so long as they remain a Christian assembly or congregation. Suppose they be in external bondage, and that in some sense spiritual, yet no matter of fact can take away right, while they abide such as Christ has given that right unto. The whole case may be cleared in this example: two single persons agree on mariage betwixt themselves, with allowance of parents, and have by virtue of that contract mutual right one in other; yet the laws of the place where they live, having ordered that none shall be held for married persons without certain forms which they appoint, they have not external legal power or liberty one in the other before such rites be performed. Even so stands the matter betwixt minister and people in England, they agreeing or contracting betwixt themselves have right one in other: but external legal power or liberty they must receive from others. Another example also I would have considered: the emperor sometime was so subiect unto the pope that he had not liberty of emperial rule until he received his crown from Rome: yet was the emperor then no proper part of the papacy, nor did he take his right from the pope, neither did those that submitted unto him therein communicate with the pope’s authority. So is this in hand.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/william-ames.html">William Ames</a></span><span class="wk"><span class="lbl">Work:</span> <cite>A Second Manuduction for Mr</cite>, [John] Robinson. Or a confirmation of the former in an answer to his manumission (Amsterdam, 1615), pp. 12-13</span></figcaption>

</figure><figure class="quote" id="q-882295aa8e" data-kw="">
<blockquote><p>The Dutch superintendens are as like to English bishops as an emperor in the days of Fabius Maximus, when the senate ruled all, to an emperor in the days of Tiberius or Nero, when an absolute prince, I will not say a tyrant, did govern all at his pleasure. The name is one, but the things are essentially different, and so far distant as the East is from the West.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/robert-baillie.html">Robert Baillie</a></span><span class="wk"><span class="lbl">Work:</span> <cite>An Historical Vindication of the Government of the Church of Scotland</cite>, … (1646), p. 79</span></figcaption>

</figure><figure class="quote" id="q-0c7bcfc779" data-kw="">
<blockquote><p>But we have yet more to do, for the consequence of our argument is also denied both by the prelatical faction and by others [congregationalists] (whom we are more sorry to contradict) holding that reasons fetched from the Jewish Church do better fat the prelates than the consistorians; howsoever now to fetch the form of government for the Church from the Church of the Jews, were, say they, to revive the Old Testament. To me it seems strange that both the one side and the other do when they please reason from the forms of the Jewish Church and yet they will not permit us to reason in like manner. The former go about to prove the prelacy by the high priesthood and the lawful use of organs in the Church from the like in the temple of Solomon. The latter do argue that a congregation has right not only to elect ministers, but to ordain them and lay hands on them because the people of Israel laid hands on the Levites. That the maintenance of the ministers of the Gospel ought to be voluntary, because under the Law God would not have the priests and Levites to have any part or inheritance in the land of Canaan, but to be sustained by the offerings and altars of the Lord. That the power of excommunication is in the body of the Church, because the Lord laid upon all Israel the duty of removing the unclean and of putting away leaven out of their houses at the feast of Passover. Is it right dealing now to forbid us to reason from the form of the Jews? I will not use any further expostulation, but let the reader judge. The truth is this, even as that which is in a child, as he is a child, agrees not to a man, yet that which is in a child, as he is animal rationale, agrees also to a man: so what we find in the Jewish Church, as it was Jewish or in infancy and under the pedagogy of the Law, agrees not indeed to the Christian Church. But whatsoever the Jewish Church had as it was a political Church, or ecclesiastical republic (of which sort of things, the diversity and subordination of ecclesiastical courts was one) does belong by the same reason to the Christian Church. I say further, though the commonwealth and civil policy of the Jews be not in all points a pattern to our civil policy, yet I am sure it is no error to imitate the civil policy of the Jews in such things as they had, not for any special reason proper to them, but are common to all well constituted commonwealths, and so we may argue from their commonwealth that it is a good policy to have diverse civil courts and the higher to receive appellations from the inferior, as it was among them. Shall we not by the very like reason fetch from their ecclesiastical republic, diversity of spiritual courts, and the supreme to receive appellations from the inferior, because so was the constitution of the Jewish Church and that under the common respect and account of a political Church, and not for any special reason which does not concern us.</p></blockquote>

<div class="actions"><button class="copy" data-copy="“But we have yet more to do, for the consequence of our argument is also denied both by the prelatical faction and by others [congregationalists] (whom we are more sorry to contradict) holding that reasons fetched from the Jewish Church do better fat the prelates than the consistorians; howsoever now to fetch the form of government for the Church from the Church of the Jews, were, say they, to revive the Old Testament. To me it seems strange that both the one side and the other do when they please reason from the forms of the Jewish Church and yet they will not permit us to reason in like manner. The former go about to prove the prelacy by the high priesthood and the lawful use of organs in the Church from the like in the temple of Solomon. The latter do argue that a congregation has right not only to elect ministers, but to ordain them and lay hands on them because the people of Israel laid hands on the Levites. That the maintenance of the ministers of the Gospel ought to be voluntary, because under the Law God would not have the priests and Levites to have any part or inheritance in the land of Canaan, but to be sustained by the offerings and altars of the Lord. That the power of excommunication is in the body of the Church, because the Lord laid upon all Israel the duty of removing the unclean and of putting away leaven out of their houses at the feast of Passover. Is it right dealing now to forbid us to reason from the form of the Jews? I will not use any further expostulation, but let the reader judge. The truth is this, even as that which is in a child, as he is a child, agrees not to a man, yet that which is in a child, as he is animal rationale, agrees also to a man: so what we find in the Jewish Church, as it was Jewish or in infancy and under the pedagogy of the Law, agrees not indeed to the Christian Church. But whatsoever the Jewish Church had as it was a political Church, or ecclesiastical republic (of which sort of things, the diversity and subordination of ecclesiastical courts was one) does belong by the same reason to the Christian Church. I say further, though the commonwealth and civil policy of the Jews be not in all points a pattern to our civil policy, yet I am sure it is no error to imitate the civil policy of the Jews in such things as they had, not for any special reason proper to them, but are common to all well constituted commonwealths, and so we may argue from their commonwealth that it is a good policy to have diverse civil courts and the higher to receive appellations from the inferior, as it was among them. Shall we not by the very like reason fetch from their ecclesiastical republic, diversity of spiritual courts, and the supreme to receive appellations from the inferior, because so was the constitution of the Jewish Church and that under the common respect and account of a political Church, and not for any special reason which does not concern us.”

— George Gillespie, bk. 1 ToC of Aaron’s Rod Blossoming, or the Divine Ordinance of Church Government Vindicated… (Edinburgh: Ogle, Oliver &amp; Boyd, 1844), | 12. Fourteen arguments to prove that scandalous and presumptuous offenders against the moral law (though circumcised and not being legally unclean) were excluded from the Passover 56, p. 57">Copy</button><a class="share" href="https://x.com/intent/post?text=%E2%80%9CBut+we+have+yet+more+to+do%2C+for+the+consequence+of+our+argument+is+also+denied+both+by+the+prelatical+faction+and+by+others+%5Bcongregationalists%5D+%28whom+we+are+more+sorry+to+contradict%29+holding+that+reasons+fetched+from+the+Jewish+Church+do+better+fat+the+prelates+than+the+consistorians%3B+howsoever+now+to+fetch+the+form+of+government+for+the+Church+from+the+Church+of+the+Jews%2C+were%2C+say+they%2C+to+revive+the+Old+Testament.+To+me+it+seems+strange+that+both+the+one+side+and+the+other+do+when+they+please+reason+from+the+forms+of+the+Jewish+Church+and+yet+they+will+not+permit+us+to+reason+in+like+manner.+The+former+go+about+to+prove+the+prelacy+by+the+high+priesthood+and+the+lawful+use+of+organs+in+the+Church+from+the+like+in+the+temple+of+Solomon.+The+latter+do+argue+that+a+congregation+has+right+not+only+to+elect+ministers%2C+but+to+ordain+them+and+lay+hands+on+them+because+the+people+of+Israel+laid+hands+on+the+Levites.+That+the+maintenance+of+the+ministers+of+the+Gospel+ought+to+be+voluntary%2C+because+under+the+Law+God+would+not+have+the+priests+and+Levites+to+have+any+part+or+inheritance+in+the+land+of+Canaan%2C+but+to+be+sustained+by+the+offerings+and+altars+of+the+Lord.+That+the+power+of+excommunication+is+in+the+body+of+the+Church%2C+because+the+Lord+laid+upon+all+Israel+the+duty+of+removing+the+unclean+and+of+putting+away+leaven+out+of+their+houses+at+the+feast+of+Passover.+Is+it+right+dealing+now+to+forbid+us+to+reason+from+the+form+of+the+Jews%3F+I+will+not+use+any+further+expostulation%2C+but+let+the+reader+judge.+The+truth+is+this%2C+even+as+that+which+is+in+a+child%2C+as+he+is+a+child%2C+agrees+not+to+a+man%2C+yet+that+which+is+in+a+child%2C+as+he+is+animal+rationale%2C+agrees+also+to+a+man%3A+so+what+we+find+in+the+Jewish+Church%2C+as+it+was+Jewish+or+in+infancy+and+under+the+pedagogy+of+the+Law%2C+agrees+not+indeed+to+the+Christian+Church.+But+whatsoever+the+Jewish+Church+had+as+it+was+a+political+Church%2C+or+ecclesiastical+republic+%28of+which+sort+of+things%2C+the+diversity+and+subordination+of+ecclesiastical+courts+was+one%29+does+belong+by+the+same+reason+to+the+Christian+Church.+I+say+further%2C+though+the+commonwealth+and+civil+policy+of+the+Jews+be+not+in+all+points+a+pattern+to+our+civil+policy%2C+yet+I+am+sure+it+is+no+error+to+imitate+the+civil+policy+of+the+Jews+in+such+things+as+they+had%2C+not+for+any+special+reason+proper+to+them%2C+but+are+common+to+all+well+constituted+commonwealths%2C+and+so+we+may+argue+from+their+commonwealth+that+it+is+a+good+policy+to+have+diverse+civil+courts+and+the+higher+to+receive+appellations+from+the+inferior%2C+as+it+was+among+them.+Shall+we+not+by+the+very+like+reason+fetch+from+their+ecclesiastical+republic%2C+diversity+of+spiritual+courts%2C+and+the+supreme+to+receive+appellations+from+the+inferior%2C+because+so+was+the+constitution+of+the+Jewish+Church+and+that+under+the+common+respect+and+account+of+a+political+Church%2C+and+not+for+any+special+reason+which+does+not+concern+us.%E2%80%9D%0A%0A%E2%80%94+George+Gillespie%2C+bk.+1+ToC+of+Aaron%E2%80%99s+Rod+Blossoming%2C+or+the+Divine+Ordinance+of+Church+Government+Vindicated%E2%80%A6+%28Edinburgh%3A+Ogle%2C+Oliver+%26+Boyd%2C+1844%29%2C+%7C+12.+Fourteen+arguments+to+prove+that+scandalous+and+presumptuous+offenders+against+the+moral+law+%28though+circumcised+and+not+being+legally+unclean%29+were+excluded+from+the+Passover+56%2C+p.+57&amp;url=https%3A%2F%2F5solasquotes.github.io%2Fquote%2F0c7bcfc779.html&amp;via=5Solas" target="_blank" rel="noopener">Share on X</a><a class="perma" href=

<main class="wrap"><figure class="quote" id="q-82a1634277" data-kw="">
<blockquote><p>The high priest, although he entered by simony and reward to the Romans, yet notwithstanding we see our Saviour Christ bore him reverence for his office’s sake, and (as before his judge in spiritual causes) gave an accompt of his doctrine.</p></blockquote>

</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-c3825b9423" data-kw="">
<blockquote><p>If what is spoken to ‘angels’ here, be to be appropriated to one bishop, then it behoved to be said that it were only the bishop that had the door opened to him in preaching, as in Philadelphia; that he only were commended for his labor and patience, as in Ephesus; that he only did convert souls, and in that peculiar sense, were said to have few unspotted persons under him, as in the epistle to Sardis, etc. And if these things cannot be astricted to bishops, so understood, but must agree to all ministers in such cases, then must the title angel be so applied in these epistles. We know these things are more fully and accurately made out by many others, to whom we refer the reader: and in particular, to that accurate piece of the ministers of the province of London, called Ius Divinum Ministerii Evangelici, and to the books that are frequently mentioned therein…</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/james-durham.html">James Durham</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Other citations (work not named)</cite>, Lecture 3, ‘Concerning the Identity of Angel, Bishop &amp; Presbyter’ in A Commentary upon the Book of the Revelation, (Edinburgh, 1658), pp. 223-33, p. 229</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/church-government-and-the-ministry/forms-of-government.html">Forms of Government</a></span></div>

ead it online · Reformed Books Online</a></div>
</figure><figure class="quote" id="q-17d7cab950" data-kw="">
<blockquote><p>Our English [partially conforming] authors below will make the case for, under necessity, material cooperation with bishops, taking the oath of canonical obedience and yielding to civil patrons in the presentation of ministers to congregations (or patronage). Note that conferring with a bishop and getting the consent and recognition of a civil officer to one’s ministry¹ are not inherently sinful actions. To give further perspective to this, and what is to come, it will be proven in the next section that Church government (albeit of divine law) is not moral law, but is secondary. ¹ Note that having the recognition and approval of the civil government, though it ought to be secondary and consequential rather than primary and immediate, is involved in the Biblical doctrine of circa sacra and of itself is a good thing. On the proper order see Fentiman, Circa Sacra, pp. 49–51. [The book written by Scottish indulged ministers, associated with John] Bairdie poses the question: “Whether it be altogether heterogeneous and incompetent, as well as it may be inconvenient, for the ruler to make civil laws and constitutions about the circumstances, order, and exercise of matters of religion, without the previous cognizance and pre-determination of the Church thereupon, and that even in the most broken and ruined state of the Church when there is no governing-Church existent that can be owned.” Balm from Gilead, pp. 76–77. The answer, at least in the abstract, must be that such an exercise of civil power, however inconvenient and defective in some cases, is not always incompetent and invalid in itself.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/travis-fentiman.html">Travis Fentiman</a></span><span class="wk"><span class="lbl">Work:</span> <cite>“Editor’s Extended Introduction” in English Puritans, A Refutation of the Errors of Separatists</cite>, (1604; RBO, 2025), p. 106</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/church-government-and-the-ministry/forms-of-government.html">Forms of Government</a></span></div>

</figure><figure class="quote" id="q-95255754b2" data-kw="">
<blockquote><p>When subsequently one presbyter was chosen to preside over the rest, this was done to remedy schism and to prevent each individual from rending the church of Christ by drawing it to himself. For even at Alexandria from the time of Mark the Evangelist until the episcopates of Heraclas and Dionysius the presbyters always named as bishop one of their own number chosen by themselves and set in a more exalted position, just as an army elects a general, or as deacons appoint one of themselves whom they know to be diligent and call him archdeacon. For what function, excepting ordination, belongs to a bishop that does not also belong to a presbyter?</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/jerome.html">Jerome</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Letter 146</cite>, (to Evangelus), §1</span></figcaption>

</figure><figure class="quote" id="q-e271a9cc48" data-kw="">
<blockquote><p>The third consideration is that there is some footsteps of this identity of bishop and presbyter in the most corrupt writtings of the most impure schoolmen: which may appear in these three: 1. In that, generally, episcopacy is holden to be no distinct order from presbytery; and that presbytery, or priesthood (as they speak) is the highest order in all their hierarchy. And this is current as the doctrine of Lombardus the Master of Sentences, Hugo, Aquinas, Thomas Waldensis, and generally of all the Thomists at least. And though they seem to make bishops to be of a more eminent degree, yet by Estius and some others alleged by him, this is not thought sufficient to distinguish one office from another.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/james-durham.html">James Durham</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Other citations (work not named)</cite>, Lecture 3, ‘Concerning the Identity of Angel, Bishop &amp; Presbyter’ in A Commentary upon the Book of the Revelation, (Edinburgh, 1658), pp. 223-33, p. 227</span></figcaption>

<main class="wrap"><figure class="quote" id="q-c4cf9f05e8" data-kw="">
<blockquote><p>If a Sovereign Prince endeavor by arms to defend transgressors, to subvert those things which are taught in the word of God, they who are in authority under him, ought first to dissuade him; if they prevail not, and that he now bears himself not as a Prince, but as an enemy, and seeks to violate privileges and rights granted to inferior Magistrates or commonalities, it is the part of pious Magistrates, imploring first the assistance of God, rather to try all ways and means,then to betray the flock of Christ, to such an enemy of God: for they also are to this end ordained, that they may defend the people of God, and maintain those things which are good and just. For to have supreme power lessens not the evil committed by that power, but makes it the less tolerable, by how much the more generally hurtful. Then certainly the less tolerable, the more unpardonably to be punished.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/martin-bucer.html">Martin Bucer</a></span><span class="wk"><span class="lbl">Work:</span> <cite>on Mt. 5</cite></span></figcaption>
<div class="meta"><span class="t"><a href="../topics/civil-government-and-society/resistance-to-tyranny-and-lawful-authority.html">Resistance to Tyranny and Lawful Authority</a></span></div>

</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-adc906c82b" data-kw="">
<blockquote><p>Answer: I must entreat the reader carefully to distinguish here: … 2. Between obedience formally so called (which is, when we therefore obey in conscience because it is commanded, and the commander’s authority is the formal reason and object of our obedience) and obedience material only, which is properly no obedience, but a doing the thing which is commanded upon other reasons, and not at all because it is commanded. … And so I answer: … 4. Many such things may be done materially on other reasons (as for the Church’s good, the furtherance of the Gospel, the winning of men to God, the avoiding of scandal, or of hurt to others or ourselves, etc.) when they are not to be done in formal obedience, out of conscience to the authority imposing (as if it be commanded by one that has no just power).</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/richard-baxter.html">Richard Baxter</a></span><span class="wk"><span class="lbl">Work:</span> <cite>A Christian Directory: a Sum of Practical Theology and Cases of Conscience</cite>, p. 888</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/civil-government-and-society/resistance-to-tyranny-and-lawful-authority.html">Resistance to Tyranny and Lawful Authority</a></span></div>

</figure><figure class="quote" id="q-a2ed7eb824" data-kw="">
<blockquote><p>We must needs grant there are things which may be done upon the usurpers’ command or injunction (though not because or by virtue of it) for the command of him that unwarrantably assumes power cannot, by itself, make that unlawful which were lawful if that were not. For instance, the performance of acts of common equity, charity, order, public utility and self-preservation is requisite: suppose it be in concurrence with a usurpers’ command, and in thus doing we do materially, but not formally obey him; the ground of acting in such things being not at all any relation or principle of subjection to him, but conscience of obedience to the will of God and due respect to others and our own safety and good. Under this sort of actions I comprehend: … 3. Complaining, petitioning or going to law before the magistrates or courts authorized by the usurpers provided you give not the usurpers to whom you petition such titles as you give to the lawful magistrate [see others who are better on the issue of giving titles]). (“…excusantur à peccato inducendi tyrannum ad actum, et opus illicitum petentes ab illo iustitiam, quia non petunt actum illicitum, sed justitiam illius actus illiciti… pie interpretandae sunt petitiones tam iustitiae quam honestae gratiae quae offeruntur tyrannis, s. si vis, seu ex quo vis detinere, et exercere hoc dominium, utere illo iuste, utere honeste, utere pie, utere ad utilitatem publicam, et privatorum, prout deceret dominium… nec intendunt, nec petunt actum usurpatum, sed qualitatem sanctam inactu usurpato exercendo.” Thomas Cajetan, Summula [Venice: Carampellum, 1596], title: Rempublicam tyrannice occupare… [pp. 411-12]) In thus doing, I seek my necessary self-preservation; neither do I yield or ascribe to them to whom I have recourse any just power of judicature or participate in their sin of usurping it; only I acknowledge they have might and ability in their hand to right me; which, though they ought not to assume, yet I may take the benefit of their unjust use of it; as a poor man may receive relief at the hands of him that has gotten those goods he distributes unjustly; and I may receive my money, with a good conscience, from the hands of a thief that is willing to return it to me though he took it by robbery from another thief that robbed me of it; and if the party, with whom I have a controversy for my right will agree to refer the matter betwixt us to a private person as an arbitrator, and stand to his arbitrement; that is a lawful means of coming by my own, though by his help and award that has not claim of authority over me…</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/edward-gee.html">Edward Gee</a></span><span class="wk"><span class="lbl">Work:</span> <cite>An Exercitation concerning Usurped Powers… (London, 1650)</cite></span></figcaption>

<blockquote><p>…when there is a protestation against the constitution and very being of an Assembly, ‘tis true there is no submitting to it by the protesters. But yet there may be a protesting against some one or more particular deeds of an assembly when the constitution and being of it is acknowledged, and to such an assembly submission is not refused or denied by any principles of ours. So there may be a protesting or testifying against some particular abuses in a Church, and yet communion kept with that Church in lawful, true, necessary acts of divine worship.</p></blockquote>

<blockquote><p>No man has his power to destruction, but to edification. The bonum publicum [‘public good’] is the end of government:</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/richard-baxter.html">Richard Baxter</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Nonconformists’ Plea for Peace, or an Account of their Judgment in Certain Things in which they are Misunderstood… (London, 1679)</cite>, sect. 6, p. 57</span></figcaption>

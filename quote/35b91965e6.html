<main class="wrap"><figure class="quote" id="q-35b91965e6" data-kw="">
<blockquote><p>Christ does not free believers from obedience to the moral law: It is true we are no more under it as a covenant for our justification; but we are, and must still be under it, as a rule for our direction. The matter of the moral law is unchangeable, as the nature of good and evil is, and cannot be abolished except that distinction could be destroyed, Mat. 5: 17,18. The precepts of the law are still urged under the gospel to enforce duties upon us, Eph. 6:12. It is therefore a vain distinction, invented by Libertines, to say it binds us as creatures, not as Christians: or that it binds the unregenerate part, but not the regenerate: but this is a sure truth, that they who are freed from its penalties are still under its precepts.

Though believers are no more under its curse, yet they are still under its conduct: The law sends us to Christ to be justified, and Christ sends us to the law to be regulated. Let the heart of every Christian join therefore with David’s in that holy wish, Psal. 119:4, 5. “Thou hast commanded us to keep thy precepts diligently; O that my heart were directed to keep thy statutes.” It is excellent when Christians begin to obey the law from life, which others obey for life; because they are justified, not that they may be justified. It is also excellent when duties are done in the strength, and for the honour of Christ, which is evangelical; and not in our own strength, and for our own ends, which is servile and legal obedience: Had Christ freed us from obedience, such a liberty had been to our loss.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/john-flavel.html">John Flavel</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Method of Grace in the Gospel-Redemption</cite>, (1699) in The Works of John Flavel (1820; 6 vols, London: Banner of Truth: 1968), 2: 271.</span></figcaption>

<blockquote><p>Query 1. Are believers freed from obedience to the Moral Law; or from the Moral Law as a Rule of obedience? There are some who positively or peremptorily affirm that we are freed from the Law as a Rule, and we are not, since Christ, tied to the obedience of it. Others say it still remains in force as a Rule of Obedience, though it is abolished in other respects. We are still under the conduct and commands of the Law, though not under the curses and penalties of it. Others say, again, that we are freed from the law as given by Moses, and are only tied to the obedience of it as it is given by Christ. And though they are subject to those commands, and that Law which Moses gave, yet not as he gave it, but as Christ renews it; and as it comes out of the hand, and from the authority of Christ. Joh 13.34, A new commandment I give you, that you love one another. This is a commandment, for Christ is both a Savior and a Lord; and it is a new one — not that it didn’t exist before; but because it is now renewed, and we have it immediately from the hands of Christ. I will not dislike this much; I acknowledge the Moral Law as a Rule of obedience and of Christian walking; and there will be no falling out, whether you take it as promulgated by Moses, or as handed to you and renewed by Christ. Indeed, the Law as it is considered as a Rule, can no more be abolished or changed, than the nature of good and evil can be abolished and changed. The substance of the Law is the sum of doctrine concerning piety towards God, charity towards our neighbors, temperance and sobriety towards ourselves. And for the substance of it, it is Moral and Eternal, and cannot be abrogated. We grant the circumstances, that they were but temporary and changeable, and we now have nothing to do with the Promulgator, Moses; nor the place, Mount Sinai; nor the time, fifty days after they came out of Egypt; nor yet that it was written on Tablets of stone, delivered with thunder and lightning, etc. We don’t look to Sinai the hill of bondage, but to Zion the mountain of Grace. And we take the Law as the Image of the divine Will of God, which we desire to obey, but from which we do not expect life and favor, nor fear death and rigor. And this, I conceive, is the concurrent opinion of all Divines. The Law is abrogated in respect to its power to justify or condemn; but it still remains in force to direct us in our lives. It condemns sin in the faithful, though it cannot condemn the faithful for sin. Far be that profane opinion from us, to take away the Law as a Rule, which is an inflexible rule of living. By teaching, admonishing, chiding, and reproving, it prepares us for every good work, as Calvin says. The Law is void for its damnatory power, not its directory power; we are not under its curse, but we are still under its commands.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/samuel-bolton.html">Samuel Bolton</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The True Bounds of Christian Freedom</cite>, (London, 1545; 1656), 31.</span></figcaption>

</figure><figure class="quote" id="q-faff82bb91" data-kw="ceremonial abrogation">
<blockquote><p>The ceremonial law can be viewed in two ways: either with regard to doctrine and signification; or with regard to obligation and observance. The question is not whether it was abrogated as to doctrine. We confess that it still remains and is useful in many ways among Christians; and that the mystical truth, hidden under this shell, is always the same and of perpetual necessity. Rather the question is whether it was abrogated as to obligation and obedience and whether believers are still in subjection to the ceremonial law. This was the opinion not only of the Jews of old, but also of the Judaizing false apostles in the time of the apostles. However we, with the apostles and the whole church, deny it.</p></blockquote>

</figure><figure class="quote" id="q-ca815d96e5" data-kw="uses absolute relative rule">
<blockquote><p>A twofold use of the law may be laid down—absolute and relative. The former regards the law in itself; the latter regards the law in relation to the various states of man. The absolute (which obtains in every state of man) is that it may be a unique, full and certain rule of things to be done and avoided by each of us as well towards God as his neighbor. Thus there is no work truly and properly good and acceptable to God which does not agree with the law and is not prescribed by it.</p></blockquote>

<blockquote><p>Wherefore I conceive the two covenants to have been both delivered on Mount Sinai to the Israelites. First, The covenant of grace made with Abraham, contained in the preface, repeated and promulgate there unto Israel, to be believed and embraced by faith, that they might be saved; to which were annexed the ten commandments, given by the Mediator Christ, the head of the covenant, as a rule of life to his covenant people.

Secondly, The covenant of works made with Adam, contained in the same ten commands, delivered with thunderings and lightnings, the meaning of which was afterwards cleared by Moses, describing the righteousness of the law and sanction thereof, repeated and promulgate to the Israelites there, as the original perfect rule of righteousness, to be obeyed; and yet were they no more bound hereby to seek righteousness by the law than the young man was by our Saviour’s saying to him, Mat. xix. 17, 18, ”If thou wilt enter into life, keep the commandments — Thou shalt do no murder,” &amp;c. The latter was a repetition of the former.

Thus there is no confounding of the two covenants of grace and works; but the latter was added to the former as subservient unto it, to turn their eyes towards the promise, or covenant of grace: “God gave it to Abraham by promise. Wherefore then serveth the law? it was added, because of transgressions, till the Seed should come,” Gal. iii. 18, 19. So it was unto the promise given to Abraham, that this subservient covenant was added; and that promise we have found in the preface to the ten commands. To it, then, was the subservient covenant, according to the apostle, added, put, or set to, as the word properly signifies. So that it was no part of the covenant of grace, the which was entire to the fathers, before the time that it was set to it; and yet is, to the New Testament church, after that it is taken away from it: for, says the apostle, “It was added till the Seed should come.” Hence it appears, that the covenant of grace was, both in itself, and in God’s intention, the principal part of the Sinai transaction: nevertheless the covenant of works was the most conspicuous part of it, and lay most open to the view of the people.

According to this account of the Sinai transaction, the ten commands, there delivered, must come under a twofold notion or consideration; namely, as the law of Christ, and as the law of works: and this is not strange, if it is considered, that they were twice written on tables of stone, by the Lord himself, — the first tables the work of God, Exod. xxxii. 16, which were broken in pieces, verse 19, called the tables of the covenant, Deut. ix. 11, 15,— the second tables the work of Moses, the typical Mediator, Exod. xxxiv. 1; deposited at first (it would seem) in the tabernacle, mentioned chap, xxxiii. 7, afterward, at the rearing of the tabernacle with all its furniture, laid up in the ark within the tabernacle, chap. xxv. 16; and whether or not some such thing is intimated, by the double accentuation of the decalogue, let the learned determine; but to the ocular inspection it is evident, that the preface to the ten commands, Exod. xx. 2, and Deut. v. 6, stands in the original, both as a part of a sentence joined to the first command, and also as an entire sentence separated from it, and shut up by itself.

Upon the whole, one may compare with this the first promulgation of the covenant of grace, by the messenger of the covenant in paradise, Gen. iii. 15, and the flaming sword placed there by the same hand, “turning every way to keep the way of the Tree of Life.</p></blockquote>

<main class="wrap"><figure class="quote" id="q-4bd858e03d" data-kw="">
<blockquote><p>Though the Reformers were unanimous in rejecting the claim of the apocryphal books of the Old Testament to a place in the canon, in denying to them divine inspiration and authority, they generally allowed them to retain their place in the Bible, and translated them into the vulgar languages. And in some editions of the Bible which were circulated on the Continent, the apocryphal books were not merely collected together and appended to the Old Testament—the form and position in which they commonly appear in Bibles printed in England—but they even were intermingled with the sacred Scriptures, coming in without any obvious and palpable mark of distinction at the places where they are introduced in the Septuagint, the source from which those apocryphal books and portions of books are derived.

This was a very erroneous and dangerous practice, even in the less offensive form which it assumed in Bibles printed in England, in which the Apocrypha was appended and not intermingled, as tending to break down in men’s minds a right sense of the distinction that ought ever to be maintained full and unimpaired between the word of God and the word of man, between writings which come from God, and are therefore possessed of supreme and infallible authority, and writings which besides being possessed of no authority whatever, are some of them liable to the still more serious objection of putting forth a false claim to a divine origin.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/william-cunningham.html">William Cunningham</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Theological Lectures on Subjects Connected with Natural Theology, Evidences of Christianity, the Canon and Inspiration of Scripture</cite>, (New York: Robert Carter and Brothers, 1878), Lecture XXXIII, p. 422.</span></figcaption>

</figure><figure class="quote" id="q-4e6e6fd000" data-kw="apocrypha">
<blockquote><p>The Apocryphal books are so called not because the authors are unknown (for there are some canonical books whose authors are unknown and some apocryphal books whose authors are known); not because they could be read only in private and not in public (for some of them may be read even in public), but either because they were removed from the crypt (apo tēs kryptēs) (that sacred place in which the holy writings were laid up) as Epiphanius and Augustine think; or because their authority was hidden and suspected, and consequently their use also was secret since the church did not apply to them to confirm the authority of ecclesiastical doctrines (as Jerome says, ‘Praefatio in libros Salomonis’ from “Hieronymi Prologus Galeatus” in Biblia Sacra Vulgata Editionis Sixti V … et Celementis VIII [1865], p. lii); or, what is more probable, because they are of an uncertain and obscure origin (as Augustine says, CG 15.23* [FC 14:474]). Statement of the question.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/francis-turretin.html">Francis Turretin</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Institutes of Elenctic Theology</cite>, 2.9.1</span></figcaption>

<blockquote><p>CANON XV.

Moreover the Sacred Scriptures do render this Everlasting Free Grace of God in our Election the more illustrious, and recommend it to us by testifying that all Men are not Elected, but that some in the Eternal Election of God, are passed by, to wit, those whom God in his good pleasure (which is always most Free, most Righteous, Unblameable, and Unchangeable) Decreed to leave in that gulph of common Misery, whereinto by their own sin they had flung themselves headlong, and not to give them saving Faith, nor the Grace of Conversion; but having abandoned them to their own ways and lusts, he doth finally in his Righteous Judgment condemn and punish them Everlastingly not only for their unbelief, but also for all their other sins, for the manifestation of his Justice. This is the Decree of Reprobation, which doth not in any wise make God the Author of Sin, the very thought whereof is horrid Blasphemy; but on the contrary doth demonstrate him to be a most dreadful, irreprehensible, and Righteous Judge, and Revenger of all Sin.

CANON XVI.

Such, who do not as yet effectually feel in their own Souls a lively Faith in Christ Jesus, or a particular confidence of Heart in God, Peace of Conscience, a diligent care and endeavour to yield Filial Obedience, and to glorify God through Jesus Christ, and do yet nevertheless use the means, by which God hath promised to work those Graces in us, they should not be discouraged when as they here speak or Reprobation, nor should they reckon themselves in the number of Reprobates, but they ought carefully to continue in the use of means, and ardently to petition for that happy hour when this Grace of God shall be abundantly poured down upon them, and to wait for it in all Reverence and Humility, much less should they be affrighted at the Doctrine of Reprobation, who, when as they desire to be sincere Converts, and would please God entirely, and be delivered from this Body of Death, sin dwelling in them, yet cannot make so great a progress in Piety and Faith as they would: Because God who is full of Mercy hath promised that he will not quench the smoking flax, nor break the bruised reed. But this Doctrine is indeed terrible unto them, who forgetting God, and Jesus Christ our Saviour, are totally imbondaged unto the heart-piercing cares of this present World, and the Concupiscencies of their flesh, during the whole time of their unregeneracy. …

CANON XVIII.

In case any Person murmur against the free Grace of God in Election, and the Severity of God’s Justice in Reprobation; we should oppose them with that of the Apostle, Rom. 9.20. O! Man, who art thou, that contendest with God? And with those words of our Saviour, Matth. 20.15. Is it not lawful for me to do with my own as I please? But as for us, who adore these Divine Mysteries, let us cry out with the Apostle, Rom. 11.33, 34, 35, 36. O! The Depths of the Riches, and of the Wisdom and Knowledge of God, how incomprehensible are his Judgments, and his Ways are past finding out? For who hath known the Mind of the Lord? Or who hath been his Counsellor? Or who hath first given unto him, and it shall be rendered unto him again? For of him, and by him, and for him are all things. To him be Glory forever and ever, Amen.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/john-quick.html">John Quick</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Synodicon in Galliâ Reformatâ: or, the Acts, Decisions, Decrees and Canons of the seven last National Councils of The Reformed Churches in France: a work never before Extant in any language. Collected and Composed Out of the original manuscript acts of those councils. VOL. II.</cite>, (2 vols, London: Thomas Parkhurst, 1692), 2: 129-30.</span></figcaption>

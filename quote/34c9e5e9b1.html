<main class="wrap"><figure class="quote" id="q-34c9e5e9b1" data-kw="">
<blockquote><p>…these, therefore, who teach and practice conform to true doctrine, contained in the Scriptures, are the true servants of Christ Jesus and members of His Church: and consequently that true doctrine, and practice in God’s worship conform, is the essential note to know Christ’s Church thereby.</p></blockquote>

</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-f4042b8944" data-kw="">
<blockquote><p>While [John] Thomson has been portrayed as a strict Subscriber his overture [in 1727, which led to the Adopting Act] recognizes a need to deal with exceptions, ‘if any minister within our bounds shall take upon him to teach or preach any thing contrary to any of the said Articles, unless first he propose the said point to the Presbytery or Synod, to be by them discussed, he shall be censured’. And as he closed the preface: ‘if there should be any paragraphs or clauses at which some may scruple, there are rational methods according to charity and piety, to have such scruples removed in a regular way, and it’s a pity to deprive a whole Church of the benefit of such and excellent Confession, for the scruples perhaps of a few, or for a few scruples about some particular and lesser points of religion.&#x27;</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/before-the-adopting-act-of.html">Before the Adopting Act of</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Charles S. Sealy, Church Authority &amp; Non-Subscription Controversies in Early 18th Century Presbyterianism PhD thesis (Univ. of Glasgow, 2010), p. 176 quoting [John Thomson], An Overture Presented to the Reverend Synod of Dissenting Ministers, Sitting in Philadelphia, in the Month of September, 1728… (n.l., 1729)</cite>, pp. 24, 32</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/the-church/creeds-confessions-and-councils.html">Creeds, Confessions and Councils</a></span></div>
<div class="actions"><button class="copy" data-copy="“While [John] Thomson has been portrayed as a strict Subscriber his overture [in 1727, which led to the Adopting Act] recognizes a need to deal with exceptions, ‘if any minister within our bounds shall take upon him to teach or preach any thing contrary to any of the said Articles, unless first he propose the said point to the Presbytery or Synod, to be by them discussed, he shall be censured’. And as he closed the preface: ‘if there should be any paragraphs or clauses at which some may scruple, there are rational methods according to charity and piety, to have such scruples removed in a regular way, and it’s a pity to deprive a whole Church of the benefit of such and excellent Confession, for the scruples perhaps of a few, or for a few scruples about some particular and lesser points of religion.&#x27;”

</figure><figure class="quote" id="q-ce5619f376" data-kw="">
<blockquote><p>Thirdly, true matter [of the Church] are all such [persons] as are baptized, and openly profess that Jesus the son of Mary is the Son of God, made Christ the Lord, by whom only and alone is salvation… … Thirdly, because it is the sum of the whole Gospel, and Covenant in the New Testament, in respect whereof, there is no other point of religion necessary, but as it tends either to bring men unto, or to confirm them in this main truth. Hence it is, that St. John concludes his Gospel with this scope… And therefore since such as do profess this truth do summarily and in general profess all the evangelical doctrines in God’s book, such must needs be fit matter of the Church.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/richard-bernard.html">Richard Bernard</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Plain Evidences the Church of England is Apostolical, the Separation Schismatical... (London: 1610), 8th Error</cite>, p. 271</span></figcaption>

</figure><figure class="quote" id="q-4c00d8b93b" data-kw="">
<blockquote><p>For my own part, as highly as I honor the men [the Westminster divines], I am not of their mind in every point of the government which they would have set up; and some words in their Catechism I could wish had been more clear;</p></blockquote>

</figure><figure class="quote" id="q-9c67a990d8" data-kw="">
<blockquote><p>The requiring subscription to the 39 Articles is a great imposition: I believe them all myself, but as there are some which might be expressed more unexceptionably, so I think it a better way to let such matters continue to be still the standard of doctrine and to censure those who teach any contrary tenets, than to oblige all who serve in the Church to subscribe them. The greater part subscribe without ever examining them, and others do it because they must do it, though they can hardly satisfy their consciences about some things in them. Churches and societies are much better secured by laws than by subscriptions: it is a more reasonable as well as a more easy mode of government.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/gilbert-burnet.html">Gilbert Burnet</a></span><span class="wk"><span class="lbl">Work:</span> <cite>History of his own Time… new ed. (London: Orr, 1850), vol. 2, Conclusion, p. 904 Burnet (1643–1715) was a Scottish philosopher and historian, and Bishop of Salisbury.</cite></span></figcaption>
<div class="meta"><span class="t"><a href="../topics/the-church/creeds-confessions-and-councils.html">Creeds, Confessions and Councils</a></span></div>

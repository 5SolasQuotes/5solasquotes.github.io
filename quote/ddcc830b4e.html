<blockquote><p>…this dissertation does point to Beza as… possibly even the first systematizer of the doctrine under study, since he demonstrates his threefold righteousness imputed as early as his first edition of the Annotationes Maiores (1556) and a detailed discussion of the topic soon appears in his Confession (1559).</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/heber-carlos-de-campos-jr.html">Heber Carlos de Campos Jr.</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Johannes Piscator</cite>, (1546-1625) &amp; the Consequent Development of the Doctrine of the Imputation of Christ’s Active Obedience PhD diss. (Calvin Theological Seminary, 2009) 370 pp., p. 286</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/justification/active-and-passive-obedience-imputed.html">Active and Passive Obedience Imputed</a></span></div>
<div class="actions"><button class="copy" data-copy="“…this dissertation does point to Beza as… possibly even the first systematizer of the doctrine under study, since he demonstrates his threefold righteousness imputed as early as his first edition of the Annotationes Maiores (1556) and a detailed discussion of the topic soon appears in his Confession (1559).”

— de Campos, Jr., Heber Carlos, Johannes Piscator (1546-1625) &amp; the Consequent Development of the Doctrine of the Imputation of Christ’s Active Obedience PhD diss. (Calvin Theological Seminary, 2009) 370 pp., p. 286">Copy</button><a class="share" href="https://x.com/intent/post?text=%E2%80%9C%E2%80%A6this+dissertation+does+point+to+Beza+as%E2%80%A6+possibly+even+the+first+systematizer+of+the+doctrine+under+study%2C+since+he+demonstrates+his+threefold+righteousness+imputed+as+early+as+his+first+edition+of+the+Annotationes+Maiores+%281556%29+and+a+detailed+discussion+of+the+topic+soon+appears+in+his+Confession+%281559%29.%E2%80%9D%0A%0A%E2%80%94+de+Campos%2C+Jr.%2C+Heber+Carlos%2C+Johannes+Piscator+%281546-1625%29+%26+the+Consequent+Development+of+the+Doctrine+of+the+Imputation+of+Christ%E2%80%99s+Active+Obedience+PhD+diss.+%28Calvin+Theological+Seminary%2C+2009%29+370+pp.%2C+p.+286&amp;url=https%3A%2F%2F5solasquotes.github.io%2Fquote%2Fddcc830b4e.html&amp;via=5Solas" target="_blank" rel="noopener">Share on X</a><a class="perma" href="../quote/ddcc830b4e.html">Permalink</a><a class="src" href="https://reformedbooksonline.com/the-active-obedience-of-christ#:~:text=this%20dissertation%20does%20point%20to%20Beza,soon%20appears%20in%20his%20Confession%20%281559&amp;text=this%20dissertation%20does%20point%20to%20Beza%20as&amp;text=the%20topic%20soon%20appears%20in%20his%20Confession%20%281559" rel="noopener" target="_blank">Read it online · Reformed Books Online</a></div>
</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-a0cb24bd13" data-kw="">
<blockquote><p>And the man, out of Christ and under the Law, is still compelled in both active and passive obedience… And for the believer in Christ, the rigor of the Law is abated, not that the Law, as the Law, requires less of him than absolutely perfect obedience, but because in what he comes short in performing of new obedience, from a new principle, to wit, a Gospel-spirit in him, he is pardoned in Christ, and the rest is accepted for Christ’s sake, as if it were obedience. Now in this new obedience, the Spirit so oils the wheels of free-will as obedience, in its kind, is as free, connatural, delightful, being sweetened with the love of God, as if there were not an awing Law, but a sweetly alluring and heart-drawing free love, so that the believer obeys…</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/samuel-rutherford.html">Samuel Rutherford</a></span><span class="wk"><span class="lbl">Work:</span> <cite>A Survey of the Spiritual Antichrist, Opening the Secrets of Familism &amp; Antinomianism</cite>, ... (London: J.D., 1648), pt. 1, ch. 35, p. 317-18</span></figcaption>

</figure><figure class="quote" id="q-70d3190d07" data-kw="">
<blockquote><p>XVII. (2) The adjudication of eternal life, with respect to its right (Rom. 6:22; Jn. 3:16), for when the guilt of eternal death is taken away through absolution, the right of eternal life cannot but follow it. So that from this, it is perceived with no trouble that there is not a real distinction between absolution from eternal death and adjudication of eternal life. For just as there is also not a real difference between satisfaction and merit, such that absolution must be sought in only satisfaction and the right to eternal life in only merit, and then the former, that is, satisfaction, in only passive righteousness, and the latter in only active. For the dikaioma on account of which we are justified, as it includes without division both forms of the righteousness of Christ, so also it provides without division the cause on account of which also we are freed from the guilt of sin, and receive the right to every good, just as we taught elsewhere explicitly (1.5.18 §XIV; §XI, above).</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/petrus-van-mastricht.html">Petrus van Mastricht</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Theoretical Practical Theology</cite>, (RHB), vol. 5, ch. 6, the Justification of those to be Redeemed</span></figcaption>

opener" target="_blank">Read it online · Reformed Books Online</a></div>
</figure><figure class="quote" id="q-766b45942f" data-kw="">
<blockquote><p>From the imputation of righteousness, a meritorious claim upon life and the reward of life itself equally follow. For just as the sentence of sin’s remission has regard to three things—sin, liability to punishment, and punishment itself—so the sentence of justification has regard to three things—Christ’s righteousness or satisfaction, that merit which belongs to Christ’s righteousness or satisfaction (for his satisfaction is meritorious of eternal life), and life itself.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/robert-rollock.html">Robert Rollock</a></span><span class="wk"><span class="lbl">Work:</span> <cite>‘Treatise on Justification’</cite>, tr. Aaron Denlinger &amp; Noah Phillips MAJT 27 (2016), 1.4.2. ‘The Imputation of Righteousness’, pp. 107-8 Rollock (c. 1555-1599) was a Scottish minister.</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/justification/active-and-passive-obedience-imputed.html">Active and Passive Obedience Imputed</a></span></div>

</figure><figure class="quote" id="q-488385444a" data-kw="">
<blockquote><p>Howbeit this exposition of the term justification seems faulty as well as the former: and that two ways: … 2. With them all, it presumes in the matter of justification a needles twofold act, the not-imputation of sin, and the imputation of righteousness, as two distinct things; whereas not to impute sin in consideration of satisfaction made for it, is no other thing than to impute righteousness to the party therein concerned. Since that a man cannot be deemed or doomed guiltless or faultless, but he must of necessity be deemed or doomed just or righteous; there being no medium or middle state between a delinquent or a guilty person and one guiltless or just. He that can prove himself no delinquent, but free from fault, must of necessity be justified, acquitted and assoiled as just. See Dt. 25:1. If nothing but sin can make a man unjust, then surely the utter absence of sin must necessarily make a man just. See Paul’s plea, Acts 25:8.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/thomas-gataker.html">Thomas Gataker</a></span><span class="wk"><span class="lbl">Work:</span> <cite>An Antidote Against Error Concerning Justification</cite>, … (d. 1654; London: Brome, 1670), pp. 19-20</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/justification/active-and-passive-obedience-imputed.html">Active and Passive Obedience Imputed</a></span></div>

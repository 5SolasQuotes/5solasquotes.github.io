<main class="wrap"><figure class="quote" id="q-cf0ff331ae" data-kw="">
<blockquote><p>It’s also the common and continual complaint of those of the Reformed Religion, that their accusation is never proposed but mangled, and counterfeit, that their faith is represented by its enemies, out of its natural shape. That their Adversaries in their disputations against them, doe but quarrel with their own fictions, and combat with puppets of their own making. That they represent some prints, and lineaments of our doctrine, but not in their true decency, and proportion, like certain looking-glasses which representing the visage misshapen, yet after a sort preserve something of the hue and complexion.

So they having under taken as they say to paint our deformities yet they will not suffer any one to look us in the face. What may be thought of the cunning, or ingenuity of that Painter which would have us judge of his picture without comparing it to the original? They cite, and read our books in the chair, as the false accusers of Christ, with their cavilling sophistry, alleged his words to a contrary sense. But if they deal fairly, and say no more then what is true, why give they not their people leave to look, and consider at their leisure whether matters are so or no? Why is the mere curiosity of reading, and hearing our works accounted a sin?

What a wild contradiction, what a strange confusion is this, to cite our books and forbid the reading of them? But the natural laziness of men maketh this both excusable, &amp; plausible. For to refer the people to our writings seemeth unto them, a token of assurance in their Doctor, this assurance, or rather boldness serveth them also for a note of conscionable dealing, and withal the prohibition of troubling themselves about this matter, easeth them of a labour.

They are glad to hear our books cited, that they may not seem so unreasonable, as to condemn us upon other men’s words; they are as glad to be forbid to examine the citations, that they may be discharged of such a trouble. So the lazy merchant relyeth upon his factor, and the unworthy Councillor upon his clerk, so long as the one looketh now and then to some accounts, the other to an extract of the process, but carelessly, hand over head: and both of them say, the one of his factor, the other of his clerk, that they are sufficient, and conscionable men made both for their Master’s profit, and ease, they willingly persuade themselves so, that they may sleep the quietlier.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/john-cameron.html">John Cameron</a></span><span class="wk"><span class="lbl">Work:</span> <cite>An examination of those plausible appearances which seem most to commend the Romish Church, and to prejudice the Reformed. Discovering them to be but mere shifts, purposely invented, to hinder an exact trial of doctrine by the Scriptures</cite>, trans. William Pinke (Oxford: Edward Forrest, 1626), pp 18-19.</span></figcaption>

</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-f1c92274d4" data-kw="">
<blockquote><p>All this, it is obvious, must be implied in sanctifying or keeping holy the Sabbath of the Lord; and consequently, that this day is profaned if we neglect, or carelessly perform, its sacred duties; if we spend it in idleness, sloth, and sinful indulgence; or if we are occupied with “unnecessary thoughts, words, or works, about our worldly employments or recreations.”

And if so, then who can estimate the amount of guilt which is every Sabbath contracted, even in this professedly Christian community? — for who does not know, that besides the amusement and idleness to which countless multitudes systematically devote that day, it is with not a few a season of more gross and flagrant wickedness than any other day of the week?

It is appalling to think that a day which was mercifully designed to be a respite from the bodily toil and the mental anxieties inseparable from the ordinary avocations of men in this world of sin and sorrow, should be spent in the most debasing slavery — the service of sin and Satan; and that a season which was graciously intended to raise the soul to things holy and heavenly, and to prepare it for the joys of an eternal inheritance, should be employed in sinking it deeper in spiritual degradation and misery.

I fear, my friends, that even Christians, by being so familiar with the sight of Sabbath profanation, regard it with less horror and alarm than it is befitting they should; and that they are not always forward to use the influence which they might exercise in arresting or preventing a sin which, when it becomes so common as to be characteristic of a nation, will assuredly, as all past experience testifies, bring down the judgments of God in national calamities.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/robert-gordon.html">Robert Gordon</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Sanctification of the Sabbath: A Discourse in Christian Miscellany</cite></span></figcaption>
<div class="meta"><span class="t"><a href="../topics/worship.html">Worship</a></span></div>

</figure><figure class="quote" id="q-ebdc46ee83" data-kw="">
<blockquote><p>The state of the case turns on the definition. For the children of Reuben, Gad, and Manasseh, explain that they had a different intention, and thus exculpate themselves from the charge, inasmuch as the nature of the proceeding was quite different from what the others supposed… as if they had said, that it will be made palpable by the fact itself, that they never had any intention of devising any new form of worship; and they rightly explain how the altar would have been unlawful, namely, if they had built it for the purpose of offering sacrifice. For the Law did not condemn the mere raising of heaps of stones, but only enjoined that sacrifices should be offered in one place…</p></blockquote>

<blockquote><p>…all kinds of recreations which are not necessary for the preserving of health and life, and tend not to the better fitting and enabling of us for religious duties, but to sensual and carnal delight. Of which [lawful] sort are walking abroad that we may take the air, or that we may confer one with another, or meditate on the creatures, some bodily exercise in course of physick to refresh the body, and in some cases music, not only vocal by singing of Psalms, which is a duty of the Sabbath, but also on instruments, when as it is used, not for carnal and sensual delight, but to refresh our spirits, and quicken our dull and drowzy hearts and minds, that they may with more cheerfulness return vnto the performance of religious and holy duties; in which cases there may at some times be the same use of these recreations (so they be in moderation, in an holy manner, and to these ends) which is of physick, meats and drinks. But from all other recreations which tend only to carnal and sensual delight, we must wholly abstain… because these worldly recreations do more dangerously and cunningly wind into our hearts…</p></blockquote>

<blockquote><p>The human nature of Christ is the only true tabernacle, wherein God would dwell personally and substantially. The dwelling of God with men was ever looked on as an infinite condescension. So Solomon expressed it, in his prayer at the dedication of the temple, “But will God indeed dwell on the earth? Behold, the heaven and heaven of heavens cannot contain thee,” 1 Kings viii. 27. But there are various degrees of this condescension, various kinds of this inhabitation of God among men. Under the old testament, he dwelt in the tabernacle and temple, by many symbols and pledges of his glorious presence.

Such in especial were the ark and mercy-seat; whence that which was done before the ark is said to be done “before the LORD,” Exod. xxx. 8. This was, as Solomon expresseth it, a great condescension in the infinite, incomprehensible God; and there was a great glory accompanying this his presence. Under the new testament, God dwelleth in his saints by his Spirit, whereby they become a holy temple unto him. And of this inhabitation of God I have treated elsewhere. But his dwelling in the human nature of Christ is quite of another nature than either of these; and his love with his condescension, inconceivably more conspicuous than in them.

Hence is that expression of our apostle. “In him dwelleth all the fulness of the Godhead bodily,” Col. ii. 9. It is not any sign or token, it is not any effect of the divine power, goodness, and grace, that dwells in him, but “the fulness of the Godhead;” that is, the divine nature itself. And this dwelleth in him “bodily;” that is, by the assumption of the body or the human nature into personal subsistence with the Son of God. How glorious should this be in our eyes! How did they admire the condescension of God of old, in his dwelling in the tabernacle and temple by the glorious signs of his presence! and yet was it all but a dark representation and shadow of this glorious love and grace, whereby he dwells in our nature in Christ.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/john-owen.html">John Owen</a></span><span class="wk"><span class="lbl">Work:</span> <cite>An Exposition of the Epistle to the Hebrews. With Preliminary Exercitations</cite>, ed. W. H. Goold (1680; 7 vols, Edinburgh: Johnston and Hunter, 1854), 6: 21-22.</span></figcaption>

<main class="wrap"><figure class="quote" id="q-7d4de1144d" data-kw="">
<blockquote><p>…I shall manifest: (1) That they have not the same scope, design or end in their discourses; That they do not consider the same question, nor state the same case, nor determine on the same inquiry, and therefore not speaking ad idem, ‘unto the same thing,’ do not contradict one another. (2) That as faith is a word of various signification in the Scripture… they speak not of the same faith, or faith of the same kind… (3) That they do not speak of justification in the same sense, nor with respect unto the same ends. (4) That as unto works they both intend the same, namely, the works of obedience unto the moral Law. …As to the scope and design of the apostle Paul… is to declare how a guilty, convinced sinner comes through faith in the blood of Christ to have all his sins pardoned, to be accepted with God and obtain a right unto the heavenly inheritance, that is, be acquitted and justified in the sight of God… The apostle James on the other hand had no such scope or design… But he had in hand a business quite of another nature… there were many in those days who professed the Christian religion or faith in the Gospel, whereon they presumed that as they were already justified, so that there was nothing more needful unto them that they might be saved. A desirable estate they thought they had attained, suited unto all the interest of the flesh, whereby they might live in sin and neglect of all duty of obedience, and yet be eternally saved… Against this sort of persons, or for their conviction, he designs two things: (1) In general to prove the necessity of works unto all that profess the gospel or faith in Christ thereby; (2) To evidence the vanity and folly of their pretense unto justification, or that they were justified and should be saved by that faith that was indeed so far from being fruitful in good works, as that it was pretended by them only to countenance themselves in sin. Unto these ends are all his arguings designed and no other. He proves effectually that the faith which is wholly barren and fruitless as unto obedience, and which men pretended to countenance themselves in their sins, is not that faith whereby we are justified and whereby we may be saved, but a dead carcass, of no use nor benefit, as he declares by the conclusion of his whole dispute in the last verse of the chapter. He does not direct any how they may be justified before God, but convinces some that they are not justified by trusting unto such a dead faith, and declares the only way whereby any man may really evidence and manifest that he is so justified indeed. This design of his is so plain, as nothing can be more evident…</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/john-owen.html">John Owen</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Doctrine of Justification by Faith</cite>, ch. 20, ‘The Doctrine of the Apostle James concerning Faith &amp; Works, its Agreement with that of St. Paul’ in The Doctrine of Justification by Faith in Works (†1683; Johnstone &amp; Hunter, 1850), 5.384-400, pp. 387-89</span></figcaption>

<blockquote><p>But (says [John] Cameron) thus ‘to believe’ will be ‘to will’, and so faith must be confounded with love. Answer: The love of complacency is one thing, and the love of benevolence another. Love of complacency is required in faith to its object. Hence [Martin] Chemnitius on Melanchthon’s Common Places, Of Justification, p. 660, says, ‘Faith is such a knowledge in the mind to which follows assent in the will and a motion of the heart apprehending and applying to itself with desire and affiance that object which is manifested to be good, so that it rests in it.</p></blockquote>

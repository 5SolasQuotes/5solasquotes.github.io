<main class="wrap"><figure class="quote" id="q-3feea598b2" data-kw="">
<blockquote><p>2. I hope it will be granted me too, without much begging, that for the woman to come into the congregation of God’s worshippers with her head uncovered, or attired after the manner of the man, is a very uncomely and unchristian-like thing… 3. And I presume upon the observation of all that I have had to do with, that it will not be denied that in praying and in singing of psalms, the man ought to have his head uncovered. I met with none that own these ordinances, but are ready to own it to be their duty to be uncovered in them, and take it as a piece of profane irreverence and contempt of God’s ordinance to be otherwise. Though indeed there be some, who of late have learnt a new fashion of uncovering the head, by hanging their hats half way on one side, or on their brows; these are uncovered by a synecdoche partis, and show their readiness to keep them quite on, if it were but the fashion; as if they were afraid of too much reverence, or of abasing themselves too much in the sight of God. Of whom this fantastical fashion was first learnt, I know not; yet thus much even these seem to grant by that little they do, that in these duties the head ought to be uncovered in whole or in part. And being thus far agreed, that which remains to be tried, is only this: Whether it be the duty of the man to have his head uncovered, while the word of God is read or preached in the congregation of his people?… Objection 1: I hear some allege thus, That it is in itself a matter of indifferency, and to be determined by the custom of those particular churches or people, where any one has his conversation, and not to be positively asserted for a general duty… Objection 2: Others object, That the Reformed Churches in other countries observe no such thing, but generally practice the contrary in their assemblies; but if it were a duty, why should not they practice it as well as we?… Objection 4: Others there be that will allow it to be necessary, by the rules of decency and reverence, to be uncovered in prayer, and in singing and perhaps in reading of the Scriptures too, but not in preaching: And their reason is because in preaching we have not the pure word of God, but mixed with men’s own private opinions and improvements… Objection 5: Others, it seems, argue after this fashion: This uncovering of the head in divine worship, is a thing that has been so abused, and rested in by a company of dead formalists, and so zealously affected by such as dote on foolish and superstitious ceremonies, that to show our dislike of their ways, we think it expedient to act contrary to them in this thing also, and not to symbolize with their superstitions. Answer: Had I not heard it from some that pretended to sobriety… Objection 6: But there are yet others that think they have more to say than all this. Their bodily infirmities are such as that they cannot bear it to be so long uncovered, without hazard of their health: But God will have mercy, and not sacrifice… Objection 7: Others think to say something in this, if this had been such a duty; wherefore have our teachers been so long silent, Why had we not heard of this sooner?</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/samuel-stoddon.html">Samuel Stoddon</a></span><span class="wk"><span class="lbl">Work:</span> <cite>An Essay on a Question Relating to Divine Worship viz. Whether it be Contrary to the Apostolical Laws of Decency &amp; Reverence for a Man to have his Head Covered in the Time &amp; Place of God’s Solemn Public Worship?: Affirmative (London: Maxwell, 1682) Stoddon was an English, congregationalist minister.</cite>, pp. 40-44</span></figcaption>

<blockquote><p>[Durell:] ‘There was a great irreverence at prayer in their congregations, very few kneeling, many not so much as putting off their hats, and of this,’ he says, he was an eye-witness. …Into how many congregations he went where many did not so much as put off their hats in the time of prayer? And whether he either saw or heard that the ministers of those churches did any way countenance that irreverence? …For ought I know those in whom he observed this irreverence might be sectaries, who did more bitterly inveigh against presbyterians than against any other men whatever; perhaps also they might be episcopal-men, who designed to put an affront upon the presbyterians’ prayers: just as now some are observed to sit upon their breech all the time of pulpit-prayer, unless when just the Lord’s prayer is repeating, because forsooth pulpit-prayer is not allowed by the [establishing Anglican] Church, but only bidding of prayer. I write it with grief, but I must write it, I never in any congregations where I have been observed so much irreverence as I have observed in those in which there is the greatest abundance of such as always pretended a love to the English [Anglican] liturgy; particular stories I might relate…</p></blockquote>

</figure><figure class="quote" id="q-3addea374e" data-kw="">
<blockquote><p>…and consider the reason of such rules and commandments, which carries in it the light and the life of the commandments. For where that reason holds not, there are we free from the commandment; but where the reason is in force, there are we no less bound to the substance and effect of such particular commandment than they were. So if there could be like reason as caused that commandment to the disciples, we were in such case to keep it, and where the same offence is justly to be feared in eating of meats forbidden, as was then and may be in many like cases now and to the end, there that order of the apostles binds. As for the last place out of the 1 Cor. 11, if he look better upon it, he shall find that the apostle grounds that order there prescribed upon so general and necessary reasons of the ordinance of God, the glory of our Savior Christ, the regard of angels, and the voice of nature, and the custom of all the Churches, as he has taken his level far amiss to leave it at liberty, whether a man keep it or no: provided that he understand the apostle’s meaning aright: which is that men and women, especially being present in the public assemblies of the church, should carry the mark of their creation, agreeable to the sex whereof they were: the woman wearing upon her head a vail or kerchief, or such other attire (according to the lawful custom of their country and place of abode) as declares her sex and subjection to man by such coverture of her head. And the man, by not wearing any such attire upon his head as is proper to womankind, but by want of any such upon his head, show the glory of Christ, and the honor that in the order of creation is bestowed upon men. Therefore notwithstanding his caution or anything here alleged to the contrary, it remains firm and stable that the constant and perpetual examples of the Churches, the orders, rules, and commandments of our Savior Christ and of his apostles, both for the points of doctrine to be believed, and also for such as are to be obeyed and practiced in the public government of the Church, and in the private life of everyone, do bind the conscience of all the people of God to keep and to obey them: yea the most particular rules, the like case and reason being in us that was in them to whom they were given.</p></blockquote>

<div class="actions"><button class="copy" data-copy="“…and consider the reason of such rules and commandments, which carries in it the light and the life of the commandments. For where that reason holds not, there are we free from the commandment; but where the reason is in force, there are we no less bound to the substance and effect of such particular commandment than they were. So if there could be like reason as caused that commandment to the disciples, we were in such case to keep it, and where the same offence is justly to be feared in eating of meats forbidden, as was then and may be in many like cases now and to the end, there that order of the apostles binds. As for the last place out of the 1 Cor. 11, if he look better upon it, he shall find that the apostle grounds that order there prescribed upon so general and necessary reasons of the ordinance of God, the glory of our Savior Christ, the regard of angels, and the voice of nature, and the custom of all the Churches, as he has taken his level far amiss to leave it at liberty, whether a man keep it or no: provided that he understand the apostle’s meaning aright: which is that men and women, especially being present in the public assemblies of the church, should carry the mark of their creation, agreeable to the sex whereof they were: the woman wearing upon her head a vail or kerchief, or such other attire (according to the lawful custom of their country and place of abode) as declares her sex and subjection to man by such coverture of her head. And the man, by not wearing any such attire upon his head as is proper to womankind, but by want of any such upon his head, show the glory of Christ, and the honor that in the order of creation is bestowed upon men. Therefore notwithstanding his caution or anything here alleged to the contrary, it remains firm and stable that the constant and perpetual examples of the Churches, the orders, rules, and commandments of our Savior Christ and of his apostles, both for the points of doctrine to be believed, and also for such as are to be obeyed and practiced in the public government of the Church, and in the private life of everyone, do bind the conscience of all the people of God to keep and to obey them: yea the most particular rules, the like case and reason being in us that was in them to whom they were given.”

<blockquote><p>…we did never condemn all significant rites in religion, even though they be not founded on divine institution. Uncovering the head is a significant rite, and we know no divine institution for it; and yet we use it in the worship of God, viz. prayer and several other exercises; and will separate from no Church because of it. That a minister preach in a decent garb, and not in a fool’s coat, is a significant rite used in religion, not founded on divine institution, yet we shall not separate for enjoyning that.</p></blockquote>

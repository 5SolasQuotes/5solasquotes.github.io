<main class="wrap"><figure class="quote" id="q-661f801b54" data-kw="">
<blockquote><p>Q. What heed is to be taken in the action?

A. That in the act of receiving, with the signs we consider and call to our remembrance the particular matters signified. Seeing the bread broken, and the wine poured out, we are affectionately to remember the body of Christ broken, and his blood shed for us; and by the eye of faith, behold him crucified (as it were) before our eyes. Further, beholding the Minister reaching forth these elements unto us, we are to behold Christ himself therein, offering himself, and all his merits unto us, if we will receive them by faith.

Lastly, in the stretching forth of our hands to receive these elements, we are to labour to have a sense and feeling of our faith, laying hold upon Christ and all his saving benefits: and in our eating of this bread, and drinking this wine, we are to labour to feel such a spiritual refreshing of our souls, with the body and blood of Christ, as wee feel in our bodies by the bread and wine.

Q. How are we to close and shut up this action?

A. We are to be comforted in heart, in the sense of God’s favour towards us: from whence we should be ready (with feeling joy) to sing a Psalm unto the Lord, of praise and thanks-giving: and feeling our selves strengthened in the new man, we are to depart with a resolution to walk more strongly, and steadily in the ways of God, all the days of our life afterward. For this is a Sacrament, not of our incorporation into Christ, but of our growth in him.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/thomas-cartwright.html">Thomas Cartwright</a></span><span class="wk"><span class="lbl">Work:</span> <cite>A treatise of Christian religion. Or, the whole body and substance of divinity</cite>, (2nd edn, London: Thomas Man, 1616), pp 232-33.</span></figcaption>

<blockquote><p>Respect the sacramental table to which you have approached, the bread of which you have partaken, the cup in which you have communicated, being consecrated by the sufferings of Christ.5 5. Note that this allusion implies that Communion in both Kinds was given separately, as in the Anglican Church, not by intinction, as in the present Orthodox Eastern Church. Gregory Nazianzen | “Select Orations of Saint Gregory Nazianzen,” in S. Cyril of Jerusalem, S. Gregory Nazianzen, ed. Philip Schaff and Henry Wace, trans. Charles Gordon Browne and James Edward Swallow, vol. 7, A Select Library of the Nicene and Post-Nicene Fathers of the Christian Church, Second Series (New York: Christian Literature Company, 1894), 40.31 (p. 371). The first mention of intinction in the West, is at Carthage in the fifth century. We know it was practised in the seventh century and by the twelfth it had become general, to give place to the withdrawal of the chalice altogether in the West. Henry R. Percival | “The Canons of the 318 Holy Fathers Assembled in the City of Nice, in Bithynia,” in The Seven Ecumenical Councils, ed. Philip Schaff and Henry Wace, vol. 14, A Select Library of the Nicene and Post-Nicene Fathers of the Christian Church, Second Series (New York: Charles Scribner’s Sons, 1900), 31. All forms of intinction had virtually disappeared in the W. by c. 1200. The third form (dipping the Host into the consecrated wine) has been sporadically revived in modern times in the Anglican Communion as a method both of reservation and of giving Communion to the sick. F. L. Cross and Elizabeth A. Livingstone | eds., The Oxford Dictionary of the Christian Church (Oxford; New York: Oxford University Press, 2005), s.v. “Intinction.</p></blockquote>

</figure><figure class="quote" id="q-0aad91c5a6" data-kw="">
<blockquote><p>For the manner of their [Independents’] celebration, they who have seen it profess it to be in a very dead and comfortless way: it is not as in New England, once in the month, but as at Amsterdam, once every Lord’s Day, which makes the action much less solemn than in any other of the Reformed Churches, and in this too much like the daily masses of the Church of Rome. They have no preparation of their flock before: they are so happy as to have all their members prepared always sufficiently for the Lord’s Table, from their first entrance into their Church to their dying day; for all this time there is no catechizing among them; this exercise is below their condition and altogether needless in any of their congregations. They will have no sermon in the week before, nor so much as any warning [fore-notice] of the Communion. This practice of New England, to give warning the Sabbath before, is disliked now at London: nor must there be any sermon of thanksgiving after that sacrament: They use not so much as a little application of the doctrine in the sermon before it to that occasion. When they come to the action, there is no more but one little discourse and one short prayer of the minister; all the time of the participation, there is nothing in the congregation but a dumb silence: no reading, no exhortation, no psalms; their people need no such means to furnish them in their sacramental meditations;</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/robert-baillie.html">Robert Baillie</a></span><span class="wk"><span class="lbl">Work:</span> <cite>A Dissuasive from the Errors of the Time</cite>, (1645), ch. 6, p. 121</span></figcaption>

<blockquote><p>That we ought not to take from the laity the wine of the supper. Gelasius Pope of Rome, of consecration in that the second distinction, chapter Comperimus etc. “We have understood that some men receiving only the body of the Lord, do abstain themselves from the cup, who for as much as they sin by superstition, ought to be contravened and compelled to receive the sacrament wholly or else to reject it altogether. For the division of this mystery cannot be without great sacrilege. Jesus Christ commanded in his Supper and said: drink all of this, for this is my blood of the new testament.” The Council of Basle has ordained that the laity should communicate the supper in two kinds. St. Cyprian in his sermon on penitent sinners: “How shall we exhort the people to shed their blood for the confession of Christ, if we deny to them the blood of him when they ought to fight or how can we make ourselves capable to drink the cup of martyrdom, except that we suffer ourselves first to drink the cup of the Lord?</p></blockquote>

<blockquote><p>3. That God required not moral preparation in them for eating the Passover as he does in us before we eat the Lord’s Supper [as the congregationalists claimed], I conceive to be an untruth. 1. Because not to profane the holy things of God, and not to take God’s Law in their mouth and to hate to be reformed, Ps. 50:16, not to sacrifice with bloody hands, Isa. 1:11-12, etc. Ps. 50:8-10; Isa. 66:1, was moral, and did bind and oblige the Jews as they do us, and 2 Chron. 30:6, the posts are sent to gather the people to the Passover, charging them to turn to the Lord God of their fathers, not to be like their fathers; and it is clear by Hezekiah’s prayer, verses 18-19, ‘Good Lord pardon him that prepares his heart to seek the Lord God of his fathers, though he be not cleansed according to the purification of the sanctuary,’ verse 20, ‘And the Lord hearkened, and healed the people.’ Therefore, there was required a preparation of the heart for the right eating of the Passover, besides the typical and ceremonial preparation. Yea God counted the ceremonial preparation void of the moral preparation but abomination, as Isa. 66:1; Isa. 58:3-6 and Josiah’s Passover is commended from this, 2 Kings 23:22 (as Junius well observes) that none did with such care and zeal, as Josiah did prepare the priests, the people and himself for the passover, in removing all idolatry and abomination, and in renewing their covenant and resolution, verse 3, ‘to walk after the Lord and to keep his commandments with all their heart and with all their soul.’

4. The unclean and uncircumcised in heart were no more members of the true and invisible Church of the Jews, and of Christ’s mystical body, his spouse, his royal generation, than Sodom and Gomorrah, Isa. 1:10, than the Ethiopians, Amos 9:7, than Ammon and Moah, Jer. 9:25-26, as in the New Testament, and the true invisible Church amongst them, as amongst us were kings and priests unto God, Ex. 19:5,9; Ps. 149:1, as we are, 1 Pet. 2:9-10; Rev. 1:5.

5. Amongst them no man could invade the priest’s office, or run unsent, no more than under the New Testament, Heb. 5:4; 1 Tim. 4:22, though they were to rebuke one another, Lev. 19, and they had sacrifices for sins of ignorance, Lev. 4:27… And a third step was excommunication and casting out of the synagogue after the captivity, which are the very degrees of our Church censure.</p></blockquote>

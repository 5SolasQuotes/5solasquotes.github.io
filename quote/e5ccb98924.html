<main class="wrap"><figure class="quote" id="q-e5ccb98924" data-kw="">
<blockquote><p>After this we say, “Hallowed be Thy name;” not that we wish for God that He may be hallowed by our prayers, but that we beseech of Him that His name may be hallowed in us. But by whom is God sanctified, since He Himself sanctifies? Well, because He says, “Be ye holy, even as I am holy,” we ask and entreat, that we who were sanctified in baptism may continue in that which we have begun to be. And this we daily pray for; for we have need of daily sanctification, that we who daily fall away may wash out our sins by continual sanctification.

And what the sanctification is which is conferred upon us by the condescension of God, the apostle declares, when he says, “neither fornicators, nor idolaters, nor adulterers, nor effeminate, nor abusers of themselves with mankind, nor thieves, nor deceivers, nor drunkards, nor revilers, nor extortioners, shall inherit the kingdom of God. And such indeed were you; but ye are washed; but ye are justified; but ye are sanctified in the name of our Lord Jesus Christ, and by the Spirit of our God.”

He says that we are sanctified in the name of our Lord Jesus Christ, and by the Spirit of our God. We pray that this sanctification may abide in us and because our Lord and Judge warns the man that was healed and quickened by Him, to sin no more lest a worse thing happen unto him, we make this supplication in our constant prayers, we ask this day and night, that the sanctification and quickening which is received from the grace of God may be preserved by His protection.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/cyprian.html">Cyprian</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Treatise on the Lord’s Prayer</cite>, (c. 252), 12 in Ante-Nicene Fathers, 5: 450.</span></figcaption>

8924.html&amp;via=5Solas" target="_blank" rel="noopener">Share on X</a><a class="perma" href="../quote/e5ccb98924.html">Permalink</a><a class="src" href="https://reformedcovenanter.wordpress.com/2020/04/11/cyprian-of-carthage-on-hallowed-by-thy-name-as-a-prayer-for-sanctification/" rel="noopener" target="_blank">Read it online · Reformed Covenanter</a></div>
</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-f2cdf0ebfd" data-kw="">
<blockquote><p>But here the Apostle seems to comprehend a twofold holiness of those that are reconciled; one which consists in the remission of sins, and the imputation of Christ’s righteousness; the other which consists in our renovation, and in the fruits of holiness. For in both ways Christ presents all his people holy before God.

They are now strictly saints by imputation, because they are regarded as one mystical person with Christ their head; but as to inherent holiness, that is not effected instantly, but increases daily, and acquires not the summit of its perfection before we are translated from this life to the life of glory.

Yet we maintain that this incipient sanctification is real, although not complete. And therefore the Apostle adds these words, before God. For he is said to be just and holy before God, who is so in reality, not in appearance only; in rectitude of intention, not in fictitious imitation, as Lyra not inaptly remarks on these words.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/john-davenant.html">John Davenant</a></span><span class="wk"><span class="lbl">Work:</span> <cite>An Exposition of the Epistle of St. Paul to the Colossians</cite>, trans. Josiah Allport (1627; 2 vols, London: Hamilton, Adams, and Co., 1831), 1: 258.</span></figcaption>

</figure><figure class="quote" id="q-ea83841810" data-kw="remaining corruption">
<blockquote><p>Is sanctification so perfect in this life that believers can fulfill the law absolutely? We deny against the Romanists and Socinians. Among the questions concerning sanctification agitated between us and the ancient and modern Pelagians, are two principal ones: the first referring to its origin, the other to its perfection. It is well known that this is enumerated also among the many heads of the Pelagian hydra—that he contended that the believer can in this life live without sin.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/francis-turretin.html">Francis Turretin</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Institutes of Elenctic Theology</cite>, 17.2.1</span></figcaption>

</figure><figure class="quote" id="q-734562b80d" data-kw="">
<blockquote><p>O take a look of Him in his perfection. He is without measure and limits – without beginning and ending. He is one and the same in his nature, in his counsels, and in his love. He perfectly knoweth Himself, and all things that are possible. He can do all things that do not imply a contradiction, and argue imperfection.

He is good and doeth good; He is righteous in Himself, and equal in all his ways of dealing with his creatures. He is true without and dissimulation; He is holy, and delighteth in his own holiness, and in every resemblance of it, in his angels and in his saints.

O! who can think of Him and who can speak of Him aright? He is infinite in all his attributes; and every perfection hath a perfect meeting in Him. Albeit some of his attributes are in some degree communicable to his creatures, yet they are in Him in an altogether incommunicable manner and measure. There is nothing in God but what is God; for this is his name – “I am that I am.”

Again I say, Who can think of Him, and who can speak of Him aright? Who can comprehend Him, or compass Him about? Who by understanding can search out God? Humble and believing ignorance is better than curious and prying knowledge: for all that we can know of Him, is to know that we cannot know him.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/james-renwick.html">James Renwick</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Letter to the Honourable Societies of Strangers at Lewarden, in Friesland, 18 February 1686 in Thomas Houston (ed.), Spiritual Support and Consolation in Difficult Times: The Letters of the Rev. James Renwick (1865) in Works Doctrinal and Practical of the Rev. Thomas Houston, D.D. (4 vols, Edinburgh</cite></span></figcaption>
<div class="meta"><span class="t"><a href="../topics/sanctification/nature-of-sanctification.html">Nature of Sanctification</a></span></div>

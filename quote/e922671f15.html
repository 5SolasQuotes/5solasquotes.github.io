<main class="wrap"><figure class="quote" id="q-e922671f15" data-kw="">
<blockquote><p>Wherever Christ comes He brings division, not only between man and Himself, but between man and man, and between church and church; of which disturbance Christ is no more the cause than medicine is of trouble in a diseased body. Harmful agents are the real cause, for the purpose of medicine is to bring health.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/richard-sibbes.html">Richard Sibbes</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Bruised Reed, in Works</cite>, vol. 1</span></figcaption>

</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-e4d6b93d76" data-kw="">
<blockquote><p>He speaks there of Jesus Christ the Righteous: the Son of God, who is here in my text likewise made the object of this knowledge. ‘Thou art Christ the Son of the living God,’ [Mt. 16] is by Christ Himself made the rock upon which the whole Church is builded, ‘And other foundation’ (says St. Paul) ‘can no man lay than that is laid, which is Jesus Christ.’ Not that we should think that there were no other fundamental doctrine to be acknowledged but this alone (for the articles of the Holy Ghost, forgiveness of sins, resurrection of the dead, eternal judgement, and such like other have their place also in the foundation), but because this is the most special object of faith, and the primary foundation of all the other.</p></blockquote>

</figure><figure class="quote" id="q-8b86543bca" data-kw="">
<blockquote><p>Observation 4. Our Savior does not command his disciples to separate from commmunion with the Pharisees, and oblige them not hear their doctrine; but only to beware of the errors that they mix with their doctrine. We may, and ought to hold communion with a Church, though erroneous in doctrine, if not fundamentally erroneous. Separation from a Church is not justifiable upon any other ground than that which makes a separation betwixt God and that Church: Which is either the apostasy of that Church into gross idolatry; or in point of doctrine, into damnable heresy.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/william-burkitt.html">William Burkitt</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Expository Notes with Practical Observations on the Four Holy Evangelists</cite>, … (London, 1700), On Mt. 16</span></figcaption>

</figure><figure class="quote" id="q-fb014038e0" data-kw="">
<blockquote><p>I shall recommend to you Mr. [William] Perkins’ Exposition of this [Scripture] testimony (on Jude 19), comparing it with his comment to the same effect on the first chapter of the Epistle to the Galatians, the 2nd verse, and his doctrinal observation is this (I shall only abbreviate that descant he has enlarged): It is a great sin for a man to separate himself from the assembly of God’s people, Heb. 10:25. It is our duty to keep unity, Eph. 4:3. Upon this occasion he starts this question: Whether if there be errors in the Church, we may separate ourselves? His judicious resolution is this: Errors are either practical in manners or doctrinal in tenets. For vicious manners we may not separate; Lot did it not. The Jews might not do it from the scribes and Pharisees, because they sat in Moses’s chair. Though we may not separate from such corrupt persons in the public assemblies, yet we may in private conversation, 1 Cor. 5:11. If the Church err in doctrine, it is to be considered whether the error be in a point substantial, fundamental or not? if in a point substantial, fundamental, whether upon infirmity, or obstinacy? if of frailty, we may not separate, as in Corinth and Galatia. If a Church err in the foundation openly, obstinately, a separation may be made, 1 Tim. 4:5 (yet the error being in some, not in all, it remains a Church, as Corinth did). If the error be in smaller points, not fundamental, we may not separate: They which build upon the foundation of hay and stubble of erroneous opinon, may be saved, 1 Cor. 3:25. Mr. Perkins concludes that no man can separate from the Church of England with a good conscience, since it teaches, obeys, believes the doctrine of the prophets and apostles. In the most justifiable cause of separation he requires examination, conviction, censure (or condemnation). To separate without examination is not piety, but frenzy. No man can judge aright of that (says the Philosopher, Aristotle, bk. 1, Ethics) whereof he is ignorant. No man can well determine, what he does not well discuss. Qui ad pauca respicit de facili pronunciat.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/william-thomas.html">William Thomas</a></span><span class="wk"><span class="lbl">Work:</span> <cite>An Apology for the Church of England</cite>, (London: Leach, 1679), pp. 80-82 Thomas (d. 1689) was a Welsh Anglican bishop.</span></figcaption>

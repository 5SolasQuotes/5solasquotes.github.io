<main class="wrap"><figure class="quote" id="q-abb5c059c8" data-kw="">
<blockquote><p>It is required of those that are justified that they sin not, — it is their duty not to sin; but yet it is not so required of them, as that if in any thing they fail of their duty, they should immediately lose the privilege of their justification.</p></blockquote>

</figure><figure class="quote" id="q-780939a2cf" data-kw="">
<blockquote><p>God continues to forgive the sins of those that are justified, and although they can never fall from the state of justification, yet they may, by their sins, fall under God’s fatherly displeasure; and in that condition they usually do not have the light of his countenance restored to them, until they humble themselves, beg pardon, and renew their faith and repentance (Matt. 6:12; 1 John 1:7, 9; John 10:28; Ps. 89:31–33; Ps. 32:5; Ps. 51; Matt. 26:75).</p></blockquote>

</figure><figure class="quote" id="q-59df0fff9d" data-kw="">
<blockquote><p>Precisely because we are justified in Him – that is, in His justification – our justification is also final and irreversible. Indeed we can be so bold as to say that we are as fully justified before God as our Lord Jesus is. We are as finally justified as our Lord Jesus is. We are as irreversibly justified as our Lord Jesus is. The only justification we have – our only righteousness – is that of the Lord Jesus. We are justified with His justification.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/sinclair-ferguson.html">Sinclair Ferguson</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Assured by God</cite>, p. 91</span></figcaption>

</figure><figure class="quote" id="q-9964da864b" data-kw="">
<blockquote><p>And this life is by faith in Christ, as “he loved us, and gave himself for us;” that is, as he was a propitiation for our sins. This, then, is the only way, means, and cause, on our part, of the preservation of this life, of the continuance of our justification; and herein are we “kept by the power of God through faith unto salvation.”</p></blockquote>

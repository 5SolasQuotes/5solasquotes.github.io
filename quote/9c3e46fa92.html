<blockquote><p>The Reformers understood that welfare was necessary for the weak, disabled and incapacitated, but they did not believe in giving hand-outs to idlers who refuse to engage in productive work and who live like parasites of the labour of others. Hence, Peter Martyr Vermigli warned that such people should not be given assistance:

All the holy scripture exhorteth to pity and compassion upon the poor and to help them. But such poor as be oppressed with children or other necessary charges or by fire, water or other chance come to poverty, or for age, sickness or other causes be not able to labour, but to such as be poor by their own folly that be able to labour and will not. The scripture commandeth in nowise to aid them, or help them, but chargeth utterly all men to abhor them. But these men repining against God, gape at nothing else but unjustly and by force to take from other men that which God hath given unto them by their just labour.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/peter-martyr-vermigli.html">Peter Martyr Vermigli</a></span><span class="wk"><span class="lbl">Work:</span> <cite>A sermon concerning the time of rebellion (1549) in W. J. T. Kirby (ed.), The Zürich connection and Tudor political theology</cite></span></figcaption>
<div class="meta"><span class="t"><a href="../topics/worship.html">Worship</a></span></div>

<blockquote><p>BY Formality. Where the Worship of God is set up, Men don’t readily lose the form, but it is a frequent thing to lose the power of Godliness. It is an easy thing to carry on Praying, to attend Public Worship, and to attend duties of Religion on the Sabbath: this may be done, though their hearts are violently set upon the World, and they be under great prevailings of evil affections: but it is very cross to nature to mortify corruptions, and to exercise themselves in self-denial; give their hearts to God, and to be rejoicing in the righteousness of Christ. Many times People that retain the name of living lose the life of Religion, Rev. 3.1. People are wont to grow lukewarm, Rev. 3.15. The spirit of Religion doth decay by degrees.</p></blockquote>

</figure><figure class="quote" id="q-79ece82320" data-kw="">
<blockquote><p>God is not only a spirit or spiritual substance, but He is every way infinite and has sufficiency of all perfection in Himself. And therfore He takes no delight in any good thing that the creature can communicate to Him: but his delight is in the communication of his own goodness to us, and in all such duties whereby we conform ourselves to Him and magnify his goodness. Thus Paul, Acts 17:25, that ‘God needs nothing,’ and therefore He is not worshipped with anything made by the hands of man. And the Lord says by the Psalmist (Ps. 50; 8; 14) that He does not principally respect our gifts and our sacrifices, because all things are his, but He respects praise and thanksgiving.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/william-perkins.html">William Perkins</a></span><span class="wk"><span class="lbl">Work:</span> <cite>‘A Warning Against the Idolatry of the Last Times, &amp; an Instruction touching Religious or Divine Worship’ in The Works</cite>, (d. 1602; London: Legatt, 1626), vol. 1, p. 703</span></figcaption>

</figure><figure class="quote" id="q-90bfd51876" data-kw="">
<blockquote><p>There is a great difference to be made in respect of Humiliation, and the measure of godly sorrow for it. For as the sin may exceed another, as much as the Camel doth a Gnat; so ought the sorrow as much as an Ocean doth a drop. Thus Peter goeth out, and weeps bitterly; he did not so for every defect, and spiritual imperfection in him, as for this abominable Apostasy.

We read also of the incestuous person, as he committed a sin, that was not so much as named among the Gentiles, so he manifested such sorrow as was scarce heard among Christians; insomuch that the Apostle was afraid of him, lest he should be overwhelmed with too much sorrow. Now if for every sin of infirmity there should be as much sorrow and humiliation, as for these crimson and scarlet sins, how would the whole life of man be but a continual trouble of soul? and in what darkness would he live always?

Although all thy continual failings ought to be matter of humiliation unto thee, yet when such as these shall break out, thy soul ought to set open the flood-gates of thy soul. Neither may this be thought a low mercenary way, as if the party so humbled did intend a compensation unto God. But all places of Scripture must be regarded, as those which speak of Christ’s glorious grace; so also those which speak of our duties.

… The Spirit of God doth not only in his Word reveal a greater wrath against such sins, but he doth also withdraw all those consolations and comforts which were in the heart before. So that a man thus offending, doth, as it were, bolt himself in a dark dungeon, and shut out all the beams of the Sun against him. Insomuch that although Assurance, and the consolations of the holy Ghost may consist with the weaknesses, and sinful infirmities of God’s people; yet they do not with the gross impieties they plunge themselves into, as appeareth in David, Psal. 51. who prayeth for the restoring of that salvation he had lost by his sin.

The Spirit of God is a Dove, and that delighteth not in noisome buildings. The Spirit of God may be grieved and quenched in respect of the fruits thereof: So that a man thus wounded for sin, feels a very hell in his heart, admits of no comfort. Neither can it be otherwise, for when we refuse the Spirit of God sanctifying, we presently repel it comforting. If we have not the heat of this Sun, neither shall we have the light thereof.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/anthony-burgess.html">Anthony Burgess</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The true doctrine of justification asserted and vindicated, from the errors of Papists, Arminians, Socinians, and more especially Antinomians in XXX lectures preached at Lawrence-Jury, London</cite>, (2nd edn, London: Tho. Underhill, 1651), pp 207-08.</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/worship.html">Worship</a></span></div>

<blockquote><p>We had so contrived it with my Lord Wharton, that the Lords that day did petition the Assembly, that they might have one of the Divines to attend their House for a week, as it came about to pray to God with them. Some days thereafter the Lower House petitioned for the same. Both their desires were gladly granted: for by this means the relics of the service-book, which till then was every day used in both Houses, are at last banished. Paul’s and Westminster are purged of their images, organs, and all which gave offense. My Lord Manchester made two fair bonfires of such trinkets at Cambridge….</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/robert-baillie.html">Robert Baillie</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Letters and Journals Written by the Deceased Mr Robert Baillie, Principal of the University of Glasgow</cite>, … (Edinburgh, 1775), 1.421 (18 February, 1644).</span></figcaption>

<main class="wrap"><figure class="quote" id="q-0566894940" data-kw="">
<blockquote><p>God, from all eternity, did, by the most wise and holy counsel of his own will, freely, and unchangeably ordain whatsoever comes to pass: yet so, as thereby neither is God the author of sin, nor is violence offered to the will of the creatures; nor is the liberty or contingency of second causes taken away, but rather established.</p></blockquote>

<blockquote><p>Every decree of God is eternal; therefore it cannot depend upon a condition which takes place only in time. (2) God’s decrees depend on his good pleasure (eudokia) (Mt. 11:26; Eph. 1:5; Rom. 9:11). Therefore they are not suspended upon any condition outside of God. (3) Every decree of God is immutable (Is. 46:10; Rom. 9:11). Now a conditional decree is mutable because every condition is mutable.</p></blockquote>

</figure><figure class="quote" id="q-285e6e7ed1" data-kw="foreknowledge decree">

</figure><figure class="quote" id="q-0e430d2cf9" data-kw="conditional thing not decree">
<blockquote><p>It is one thing for the thing decreed to be conditional; another for the decree itself. The former we grant, but not the latter. There can be granted an antecedent cause or condition of the thing willed, but not immediately of the volition itself. Thus God wills salvation to have the annexed condition of faith and repentance in the execution, but faith and repentance are not the condition or cause of the act of willing in God, nor of the decree to save in the intention.</p></blockquote>

<blockquote><p>God’s ordination or appointment gives rules, measures, and ends, unto all sacred offices and employments. Whoever undertakes any thing in religion or divine worship without it, besides it, beyond it, is a transgressor, and therein worshippeth God in vain. He whom God doth not ordain in his service, is an intruder; and that which he doth not appoint is a usurpation. Nor will he accept of any duties, but what he himself hath made so. …

Many in all ages have been prone to indulge unto their own imaginations and inventions, in the disposal of divine worship. And this bitter root hath sprung up into all the superstition and idolatry that the earth is filled withal at this day. From these two poisoned springs hath proceeded that woful apostasy from Christ and evangelical worship which the world groans under.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/john-owen.html">John Owen</a></span><span class="wk"><span class="lbl">Work:</span> <cite>An Exposition of the Epistle to the Hebrews. With Preliminary Exercitations</cite>, ed. W. H. Goold (1680; 7 vols, Edinburgh: Johnston and Hunter, 1854), 6: 25, 43.</span></figcaption>

</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-2f9c96071c" data-kw="">
<blockquote><p>William Gouge was an eminent member of the Westminster Assembly of divines. His comments below shed light on what the Westminster Confession is referring to when it identifies the ‘singing of psalms with grace in the heart’ as an element of religious worship (XXI.V). Pay close attention to his employment of Ephesians 5:19 and Colossians 3:16, as these are often appealed to by those who defend the employment of uninspired songs in worship:

12 Q. What duties of piety are done by Minister and people all together?

A. Singing of Psalms. Mat. 26.30.

Singing of Psalms was always used by God’s people, not only in the Tabernacle, Temple and Synagogue of the Jews, but also in Christian Churches. Christ used it with his Disciples (Mat. 26.30) It is enjoined by the Apostle (Eph. 5.19. Col. 3:16.) and it was practiced by the primitive Church, (1 Cor. 14. 15, 26.) By this duty jointly performed by all, as our own spirits are quickened, so we quicken the spirits of others: and we are all made the more cheerful in serving God. On this ground they who are merry are enjoined to sing. Jam. 5.13.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/william-gouge.html">William Gouge</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Sabbath’s sanctification</cite>, (London, 1641), pp 5-6.</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/worship/psalmody.html">Psalmody</a></span></div>

</figure><figure class="quote" id="q-d5fc83548e" data-kw="">
<blockquote><p>Thirdly, as man is a creature endued with reason, the Law of Nature teacheth him, 1. Something concerning God. 2. Something concerning his Neighbour. 3. Something concerning himself. I mean some general notions concerning good and evil, in respect of Each of these. Whereof the Apostle meaneth, whiles he saith, that the Gentiles shew the work of the Law written in their hearts. First then, the Law of Nature teacheth man, to know that there is a God, and that this God is to be worshipped. Whereupon it followeth, that man should seek to know God, and the manner of his worship. Now that which may be known of God, is shewed even unto the Gentiles. The Apostle saith signanter [distinctly] τὸ γνωστὸν τοῦ θεοῦ [what is known about God], meaning those few and small sparkles of the knowledge of God, which natures imbred light discovered unto the Gentiles, for making them inexcusable, namely, that there is a[n] eternal power and Godhead, which men ought to reverence and to worship.

2. The Law of Nature teacheth man to hold fast friendship and amity with his Neighbours, for as much as he is Animal sociale [a social animal]. Violare alterum saith Cicero, naturae lege prohibemur. [We are forbidden to do dishonour to another by the law of nature.] For the Law of Nature biddeth us do to others as we would have them to do unto us. And from these precepts it followeth, that we should not offend other men, that we should keep promises, stand to bargains, give to every man his own, &amp;c.

3. As touching a man’s self, the Law of Nature teacheth him, that he should not live as a reasonless creature, but that all his actions should be such, as may be congruous and beseeming for a creature endued with reason. Whereupon it followeth, that he should live honestly and virtuously, that he should observe order &amp; decency in all his actions, &amp;c. Hence the Apostle saith, that nature itself teacheth, that it is a shame for a man to have long hair, because it is repugnant to that decency and comeliness which the Law of Nature requireth. For among other differences which Nature hath put betwixt men and women, this is one, that it hath given to women thicker and longer hair, then to men, that it might be as a vail to adorn and cover them. The reason whereof, Nature hath hid in the complexion of a woman, which is more humid then the complexion of a man. So that if a man should take him to this womanish ornament, he should but against Nature transform himself (in so far) into a woman.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/george-gillespie.html">George Gillespie</a></span><span class="wk"><span class="lbl">Work:</span> <cite>A dispute against the English-popish ceremonies, obtruded upon the Church of Scotland</cite>, (n.p., 1637), Part III, pp 199-200.</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/worship.html">Worship</a></span></div>

</figure><figure class="quote" id="q-546ca736cd" data-kw="">
<blockquote><p>Second it is useful and necessary that in our invocation of God we know what God we are invoking—that true God with whom we have entered into a covenant of faith, who has testified to us in an eternal covenant that He will be our God, and who has sealed that to us with the seal of baptism. This is so that the we might distinguish our invocation from that o f the pagans, the Turks, and such like, who invoke gods that are really not gods at all but fabrications by the father of lies. For it is in no way tolerable to God that any fellowship with false deities hinder His covenant partners in their invocation and worship, s the Holy Spirit eloquently proclaims in 2 Corinthians 6:14–15. The apostle also sets before our eyes the magnitude of this danger—unless we cling to the living God, whose covenant partners we are, by the true of obedience of faith, and wholly abstain from all idolatrous worship and invocation—in 1 Corinthians 10: [20–21]: “The things which the Gentiles sacrifice they sacrifice to demons and not to God, and I do not want you to have fellowship with demons. You cannot drink the cup of the Lord and the cup of demons; you cannot partake of the Lord’s Table and the table of demons.” For κοινωνιαν with the table demons with be followed also by κοινωνια in eternal punishment (Rev. 14:9–12; Luke 11:49–52).</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/caspar-olevianus.html">Caspar Olevianus</a></span><span class="wk"><span class="lbl">Work:</span> <cite>An Exposition of the Apostles’ Creed</cite>, trans. Lyle D. Bierma, Classic Reformed Theology, ed. R. Scott Clark (Grand Rapids: Reformation Heritage Books, 2009), 38–39.</span></figcaption>

<blockquote><p>XV…

1. As the holy blessing, whose formula is found in Numbers 6, is an invocation of God, from whom all good things are desired for those who receive the blessing, so too is the Christian salutation a prayer, a form of invocation, through which, by faith and charity, we earnestly pray for the best things for others.

2. It is also a support for fellowship and an indication of charity.

3. And it should be done especially for the Holy Church, devout families, and individual believers.</p></blockquote>

<main class="wrap"><figure class="quote" id="q-b0db1f5df1" data-kw="">
<blockquote><p>22. The Spirit is not given to ordinary Christians (though it be to prophets) to bring them from God new doctrines, or laws; nor to make any supplements to the Gospel already revealed, as if it was not sufficient in its kind; nor yet to reveal the matter of Christ’s Gospel immediately to the intellect or phantasy within by way of inspiration, visions or intuitions without an external Word or revelation; nor yet to cause them to work miracles themselves. But He is given to enable, dispose and help us to understand, believe, love and practice the doctrine and Law already, by the same Spirit given to the Church, by sanctifying our power, our reason, and our wills, by holy life and light, and love… Illuminating and sanctifying is not making us prophets or apostles, nor equal to them, as not being called to their works.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/thomas-edwards.html">Thomas Edwards</a></span><span class="wk"><span class="lbl">Work:</span> <cite>English Puritans</cite>, Manton, Bates, Case, Baxter, Fairclough, et al. | The Judgment of Non-Conformists of the Interest of Reason in Matters of Religion in which it is Proved against Make-Baits that both Conformists &amp; Non-Conformists, &amp; All Parties of true Protestants are herein really agreed, though unskilful speakers differ in words (London: 1676), p. 12 This was signed by 15 non-conformist English puritans.</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/modern-errors.html">Modern Errors</a></span></div>

</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-20c8220a8a" data-kw="">
<blockquote><p>There is no more ground for such a ministration in this life [of the Spirit without Church ordinances] than there is for no death, no crying, no sorrow, no pain in this life, Rev. 21:4, no sun, nor moon, v. 23, no unclean thing, no sin, v. 27 and no more warrant for delivering up the Kingdom, in this life, 1 Cor. 15, than for the Resurrection of the Dead, 23:37, and the blowing of the Last Trumpet, [v.] 52, and the swallowing up of death in victory, 55-57, as if all these should come to pass in this life agreeable to this, says H. Nicholas, Evangel. ch. 35. sec. 9. In which Resurrection of the Dead, God shows unto us that the time is now fulfilled, that his dead, or the dead which are fallen asleep in the Lord, rise up in this day of his judgement and appear unto us in godly glory, which shall also henceforth live in us everlastingly with Christ, and reign upon the earth, wherein the Scripture comes to be fulfilled in this present day. And Saltmarsh wills these that are as spiritual as himself and his Familists, to believe this and receive it, that is, except, we make shipwreck of faith and say the Resurrection is past in this life, as did Hymeneus and Philetus, we are all legal, literal men and void of the Spirit. 2. Saltmarsh is unwilling to contradict the truth of God, 1 Cor. 15:24, too openly, to wit, that in the end the Kingdom shall be delivered up: Now whether this be meant of Christ’s reigning no more in his Church in this life by ordidinances, or as Chrysostom does expound the place, it be the rendering up to the Father his conquished and purchased people, as it is most agreeable to Eph. 5:27, I dispute not now, but Saltmarsh says faintly, This is not only done on the whole body of Christ at the last, but also here. He dares not say this rendering up is not only at the Last Day, but also in this life; yet the apostle is clear, he thought of no rendering up of the Kingdome in this life, as Saltmarsh by this new spirit supposes, for the text is clear, v. 22-23, every man shall rise again from the dead, Christ first and then his members [Greek], ‘Then is the end when He shall deliver up the Kingdom to the Father.’ Then: [1.] there is no rendering up till the dead in Christ be raised, vv. 23-24, but the dead in Christ in their bodies (of which undoubtedly the apostle speaks, 1 Cor. 15:1-4, etc. do not rise in this life. 2. This rendering up is not till the end, then shall the end be. 3. It is when all rule and authority shall be put down, v. 27; this is not in this life. 4. It is when the last enemy shall be subdued, v. 26. 5. When God shall be all in all, v. 28. These are not in this life, therefore Saltmarsh dreams.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/samuel-rutherford.html">Samuel Rutherford</a></span><span class="wk"><span class="lbl">Work:</span> <cite>A Survey of the Spiritual Antichrist, Opening the Secrets of Familism &amp; Antinomianism</cite>, ... (London, 1648) | pt. 1 | ch. 34, ‘A taste of the wild allegoric interpretations of Scripture that are in this piece of Saltmarsh, which he fathers upon the pure immediate actings of the Spirit beyond Law and Gospel’, pp. 287-88</span></figcaption>

=are%20not%20in%20this%20life%2C%20therefore%20Saltmarsh%20dreams" rel="noopener" target="_blank">Read it online · Reformed Books Online</a></div>
</figure><figure class="quote" id="q-a78bfa55cf" data-kw="">
<blockquote><p>By the term ‘prophecy’, however, I do not understand the gift of foretelling the future, but as in 1 Cor. 14:3, the science of interpreting Scripture, so that a prophet is an interpreter of the will of God. For Paul, in the passage which I have quoted, assigns to prophets teaching for edification, exhortation, and consolation, and enumerates, as it were, these departments. Let, therefore, ‘prophecy’ in this passage be understood as meaning: interpretation made suitable to present use.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/john-calvin.html">John Calvin</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Commentary on 1 Thessalonians</cite>, 5, verse 20</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/modern-errors.html">Modern Errors</a></span></div>

<blockquote><p>The apostles did not always exercise it, but only made use of it [the power of miracles] to prove the Word of God, to confirm it by the miracles; as it is written here in the text: ‘And they went forth, and preached everywhere, the Lord working with them, and confirming the Word by the signs that followed. [Mk. 16:20]’ But since the Gospel has now been spread abroad, and made known to all the world, there is no need of working miracles as in the apostles’ times.</p></blockquote>

<blockquote><p>That they [spiritual gifts] are not communicated unto any by a sudden afflatus or extraordinary infusion, as were the gifts of miracles and tongues, which were bestowed on the apostles and many of the first converts. That dispensation of the Spirit is long since ceased, and where it is now pretended unto by any, it may justly be suspected as an enthusiastic delusion; for as the end of those gifts, which in their own nature exceed the whole power of all our faculties, is ceased, so is their communication, and the manner of it also.</p></blockquote>

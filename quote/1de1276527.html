<blockquote><p>Obj. 4. Further, In the Old Law God was praised with musical instruments and human song, according to Ps. 32:2, 3: “Give praise to the Lord on the harp, sing to Him with the psaltery, the instrument of ten strings. Sing to Him a new canticle.” But the Church does not make use of musical instruments, such as harps and psalteries, in the divine praises, for fear of seeming to imitate the Jews. Therefore in like manner neither should song be used in the divine praises. On the contrary, Blessed Ambrose established singing in the Church of Milan, as Augustine relates (Conf. ix.). Reply Obj. 4. As the Philosopher says (Polit. viii.), Teaching should not be accompanied with a flute or any artificial instrument such as the harp or anything else of this kind: but only with such things as make good hearers. For suchlike musical instruments move the soul to pleasure rather than create a good disposition within it. In the Old Testament instruments of this description were employed, both because the people were more coarse and carnal—so that they needed to be aroused by such instruments as also by earthly promises—and because these material instruments were figures of something else.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/thomas-aquinas.html">Thomas Aquinas</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Summa Theologica, pt. 3, a Treatise on the Incarnation</cite>, trans. Fathers of the English Dominican Province (Bellingham, WA: Logos Bible Software, 2009), 2a.2ae.91.</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/worship/musical-instruments-in-worship.html">Musical Instruments in Worship</a></span></div>

</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-a2fcaf6134" data-kw="">
<blockquote><p>It would be tedious, dearly beloved, were I to recount every episode from the history of the Psalms, especially since it is necessary now to offer something from the New Testament and confirmation of the Old, lest one think the ministry of psalmody to be forbidden inasmuch as many of the usages of the Old Law have been abolished. For those things that are carnal have been rejected, circumcision for example, and the observance of the [Jewish] Sabbath, sacrifices, discrimination among foods, as well as trumpets, citharas, cymbals, and timpana (all of which are now understood to reside in the bodily members of man, and there better to sound).</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/niceta-of-remesiana.html">Niceta of Remesiana</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Other citations (work not named)</cite>, On The Benefit of Psalmody in Oliver Strunk and Leo Treitler, ed. Source Readings in Music History (New York: W. W. Norton &amp; Company, 1950, repr. 1998), 130.</span></figcaption>

</figure><figure class="quote" id="q-9aed13649e" data-kw="">
<blockquote><p>What natural, or carnal affections may be excited by them [ceremonies], as men may inflame themselves with idols, Isa. 57:5, or what outward, outside devotion they may direct unto or excite, is uncertain; but that they are no means of stirring up the grace of God in the hearts of believers, or of the increase or strengthening of their faith, which things alone God accepts in Gospel worship, seeing they are not appointed by Him for any such purpose, is most certain: For to say that anything will effectually stir up devotion, that is, excite, strengthen or increase grace in the heart towards God, that is not of his own appointment, is on the one hand to reflect on his wisdom and care towards his Church, as if he had been wanting towards it in things so necessary, which He declares against, Isa. 5:4, ‘What,’ says He, ‘could have been done more to my vineyard, that I have not done in it?’; So on the other [hand], it extols the wisdom of men above what is meet to ascribe unto it. Shall men find out that which God would not, or could not, in matters of so great importance unto his glory and the souls of them that obey Him? yea, and it cannot be but that attendance unto them and their effects must needs divert the mind from those proper spiritual actings of faith and grace, which is its duty to attend unto. And this is evidently seen in them who indulging to themselves in their observation in multiplied instances, as in the Church of Rome, have changed the whole spiritual worship of the Church, into a theatrical pompeous show of carnal devotion.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/john-owen.html">John Owen</a></span><span class="wk"><span class="lbl">Work:</span> <cite>A Brief Instruction in the Worship of God</cite>, … (London: 1667), Question 14, ‘May not the Church find out and appoint to be observed such religious rites as being adjoined unto the celebration of God’s instituted worship, may farther the devotion of the worshippers, and render the worship itself in its performance more decent, beautiful and orderly…?’ pp. 57-58 This quote’s context does not specifically respect musical instruments.</span></figcaption>

</figure><figure class="quote" id="q-e600bb499b" data-kw="">
<blockquote><p>Concerning Musical Organs It is certain that in the ancient church and in Solomon’s temple, the use of musical instruments was accepted. Now that Christ has come, and together with the ancient priesthood and sacrifice and the representation appertaining to the Law, the use of instruments in churches has vanished like a shadow. For the various instruments of the musicians symbolized the parts and members of the elect, i.e., that the elect must worship the Lord with heart, soul, word and in every way. Thus David mentions every kind of instrument so that man may glorify God with all his strength, mind and members. He must speak and sing in the assembly with delight from the soul. For Paul would not only disapprove of the use of crude instruments, but does not permit in the church incomprehensible human words and singing that lacks edifying force; indeed, he calls them mindless that teach and sing in the assembly like barbarians in unfamiliar languages (1 Cor. 14). The fathers teach the same. There is not so much as a reference to the organ in the New Testament, nor of its introduction into the purer church; but it was only introduced in theatrical Masses, as if in obscene sport, by immoral priests to make clowns cut capers. The papal chronicles attribute its introduction to Pope Vitalian [†672]. The resolutions of the councils, together with Jerome, condemn the stentorian noise in churches of persons shouting in theatrical fashion (Amos 5, 6). In the prophets, the Lord prohibits the playing of the harp and organs, and commands that teaching be done with the human voice, not with shadows and tricks. Therefore, they do wrong that mumble foolishly before God the canonical hours as if superstitiously chattering to themselves something of merit in the process, and who keep an organ in the sacred assembly like papists and others. What my father has not planted will be rooted out (Matt. 15:13)…</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/hungarian-confessio-catholica.html">Hungarian Confessio Catholica</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Hungarian Confessio Catholica</cite>, 1562 | ed. Dennison, Jr., Reformed Confessions of the 16th and 17th Centuries in English Translation (RHB), vol. 2, pp. 565-66</span></figcaption>

<main class="wrap"><figure class="quote" id="q-0c167cbccd" data-kw="">
<blockquote><p>Truth is opposed to a ceremony and shadow. The ceremonies of old were shadows, or the external body of religion, in which the soul and spirit of godliness should have been enclosed, but the Lord did always urge more earnestly the substance and truth than the ceremony, the weightier matters of the Law, piety, equity, and sobriety, than these lighter external ceremonies: He sets an higher account upon mercy than sacrifice, and upon obedience than ceremonies; But this people turned just contrary; they summed up all their religion in some ceremonial performance, and separated those things God had so nearly conjoined; they would be devout men in offering sacrifices in their washings in their rites, and yet made no conscience of heart and soul-piety toward God, and upright just dealing with men: Therefore the Lord so often quarrels them and rejects all their service as being a device and invention of their own which never entered in his heart, Isa. 1, from 10 to 16; Jer. 7 throughout; Isa. 66 to 6; Isa. 28. Now if you will examine it impartially it is even just so with us, there are some external things in religion which in comparison with the weightier things of faith, and obedience are but ceremonial; in these you place the most part, if not all your religion, and think yourselves good Christians if you be baptized and hear the Word, and partake of the Lord’s table and such like, though in the mean time you be not given to secret prayer and reading, and do not inwardly judge and examine yourselves, that you may flee unto a Mediator, though your conversation be unjust and scandalous among men; I say unto such souls, as the Lord to the Jews, Who hath required this at your hands? who commanded you to hear the Word, to be baptized, to wait on publick ordinances? Away with all this, it is abomination to his Majesty; though it please you never so well, the more it displeases Him; If you say, why commands He us to hear? etc. I say the Lord never commanded these external ordinances for the sum of true religion; that was not the great thing which was in his heart that He had most pleasure unto, but the weightier matters of the Law, piety, equity and sobriety, a holy and godly conversation adorning the Gospel: ‘What hath the Lord required of thee, but this, O man, To do justly, and walk humbly with thy God?’ So then thou dost not worship him in truth, but in shadow; the truth is holiness and righteousness; that external profession is but a ceremony; while you separate these external ordinances from these weighty duties of piety and justice, that they are but as dead body without a soul. If the Lord required truth of old, much more now, when He has abolished the multitude of ceremonies that the great things of his Law may be more seen and loved.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/hugh-binning.html">Hugh Binning</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Common Principles of Christian Religion</cite>, … ([Glasgow] 1666 / 1667), 2nd Sermon on Jn. 4:24, pp. 134-35</span></figcaption>

<blockquote><p>…the most part of men have some form in worshipping God and please themselves in it so well that they think God well-pleased with it; but few there are who know indeed what it is to worship Him in a manner acceptable to his majesty: Now you know it is all one not to worship Him at all, as not to worship Him in that way He likes to be worshipped: Therefore the most part of men are but self-worshippers, because they please none but themselves in it, it is not the worship his soul has chosen, but their own invention, for you must take this as an undeniable ground, that God must be worshipped according to his own will and pleasure, and not according to your humor, or invention; therefore his soul abhors will-worship, devised by men out of ignorant zeal, or superstition, though there might seem much devotion in it, and much affection to God, as in the Israelites sacrificing their children, what more seeming self-denial? And yet what more real self-idolatry; God owns not such a service, for it is not service and obedience to his will and pleasure, but to men’s own will and humor: therefore a man must not look for a reward but from Himself. Now it is not only will-worship when the matter and substance of the worship is not commanded of God, but also when a commanded worship is not discharged in the appointed manner: Therefore, O how few true worshippers will the Father find? True worship must have truth for the substance and spirit for the manner of it: else it is not such a worship as the Father seeks and will be pleased with; divine worship must have truth in it, that is plain, but what was that truth, it must be conformed to the rule and pattern of worship, which is God’s will and pleasure revealed in the word of truth, true worship is the very practice of the word of truth, it caries the image and superscription and command upon it, which is a necessary ingredient in it, and constituent of it. Therefore if thy service have the image of thy own will stamped on it, it is not divine worship, but will-worship. Thus all human ceremonies and ordinances enjoined for service of God, carry the inscription not of God, but of man who is the author and original of them, and so are but adulterated and false coin, that will not pass current with God…</p></blockquote>

<blockquote><p>1. Worship of God is all that servitude, observancy, reverence and religion whereby as well inwardly in the heart, as outwardly in the work itself, we honor God and serve Him.

2. This, if it be rightly performed according unto the will of God, is termed true worship; but if contrariwise, it is called false and idolatrous worship.

3. True worship of God is every work, inward and outward, commanded by God, performed in faith, to this principal end, that God may be glorified.

4. And to worship God truly is so to worship Him as He has commanded in his Word how He would be worshipped.</p></blockquote>

3. True worship of God is every work, inward and outward, commanded by God, performed in faith, to this principal end, that God may be glorified.

4. And to worship God truly is so to worship Him as He has commanded in his Word how He would be worshipped.”

<blockquote><p>[Natural worship] is to know God, to acknowledge Him to be God, and glorify Him as God. Now man, as a dependent creature, stands in need of help in this concern; much more fallen man, who has no natural light left in him, to direct him how to worship God acceptably. And therefore God has pleased to show him a way, wherein he may do it; and to this way belong all the institutions appointed to man since the fall.</p></blockquote>

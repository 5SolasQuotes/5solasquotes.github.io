<main class="wrap"><figure class="quote" id="q-e4304c57e2" data-kw="">
<blockquote><p>I know what dreadful consequences would attend a needless separation from the established Church, however I am treated by the corrupt members and ministers of it; for I judge of the state of a Church, not from the practice of its members, but its primitive and public constitution; and so long as I think the articles of the Church of England are agreeable to Scripture, I’m resolved to preach them up, without either bigotry or party-zeal; for I love all that love the Lord Jesus.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/john-currie.html">John Currie</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Vindication of the Real Reformation Principles of the Church of Scotland concerning Separation, Contra the Seceders, 1740</cite></span></figcaption>
<div class="meta"><span class="t"><a href="../topics/the-church/schism-and-separation.html">Schism and Separation</a></span></div>

</figure><figure class="quote" id="q-5dbfab2b4a" data-kw="">
<blockquote><p>For hardliners like Hamilton, the ‘under-hand-dealings’ of Shields, Linning and Boyd and the Societies’ connivance in the Revolution settlement broke their Covenanted obligations and diluted the Societies’ testimony which they had so faithfully maintained. In 1691, Hamilton and some societies revived the Societies’ general correspondence or convention to maintain their former testimony in every ‘pendicule’ and to stand ‘alone’ until their cause was vindicated. Later known as the MAcmillanites, the continuing Societies would go on to form the Cameronian or Reformed Presbyterian Presbyterian Church. The continuing Societies’ formed part of a patchwork with other existing fragments of the wider militant movement which rejected the Revolution settlement. They included the rump of the Cameronian Russellites, who maintained their split from the Societies after the reunion of 1688, and the non-Cameronian Hebronites, the followers of John Hepburn… All those sects originated in the schisms of the United Societies and, like the post-Revolution Church, laid claim to the Societies’ heritage…. …Their response to the Revolution, in particular, reveals that persecution was a major factor in shaping their militancy. When persecution was removed at the Revolution, the majority of the Societies were able to moderate their demands and co-ordinate their actions with other presbyterians… The Societies were… one of the midwives of the Revolution. Even though the Revolution sidelined their Covenanted platform, the leadership and majority of the Societies accepted and supported it in the hope that it would place Scotland on a better path than it had been under the Catholic King James and the Restoration regime.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/mark-jardine.html">Mark Jardine</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The United Societies: Militancy, Martyrdom &amp; the Presbyterian Movement in Late-Restoration Scotland, 1679 to 1688 PhD diss. (Univ. of Edinburgh, 2009), Conclusion</cite>, p. 243</span></figcaption>

</figure><figure class="quote" id="q-36cd623f61" data-kw="">
<blockquote><p>It has been lately announced that the Synod of Philadelphia… adopted, and proceeded at once to enforce, a doctrine in reference to ecclesiastical proceedings, which appears to some altogether novel, and truly extraordinary. The doctrine is this,—’That no complaint, appeal, or protest, can be admitted by any judicatory, except in judicial cases.’… It never occurred to us, however, as possible, that it [the new doctrine] should receive countenance from gentlemen of experience and reflection… It is of more practical importance to show that the doctrine here assumed, cannot in our opinion, stand the test of a moment’s examination… In the Presbyterian Church in the United States, it is manifest that appeals, complaints and protests, have ever been allowed in all sorts of cases. Whenever a judicatory has decided any question which came before it by a vote, —whether the question were legislative, declarative, executive or strictly judicial—in any and every such case, both theory and practice allow of appeal, complaint and protest, at the pleasure of the party wishing to offer either. …more than thirty years before that time [1821], when the General Assembly was first organized, the following article appears in the system of Rules adopted for the government of that body: ‘Any member who may think himself aggrieved by a decision of the General Assembly, shall have his dissent or protest, with his reasons, entered on the records of the Assembly, or filed among their papers, if given in before the rising of the Assembly.’ … We have been in the constant habit of attending on the judicatories of the church, in all their grades, for more than forty years; and we never knew or heard of an in- dividual who doubted the right of appeal, complaint, and protest, in all sorts of cases… many a time, and on a great variety of occasions, we have participated in protests, etc. in all sorts of cases, without dreaming that any one ever thought of confining the privilege to cases of process only… The archives of the church are better than cursory assertions. Litera scripta manet. Let us, therefore, appeal to public records, which cannot lead us astray. In the year 1826, the General Assembly… determined, by a vote, to postpone fixing the location [of Western Theological Seminary] for another year. Against this decision the Reverend Joshua L. Wilson, of Cincinnati, entered his solemn protest, accompanied with five reasons, which still remain on permanent record. In the very same General Assembly, (of 1826)… Against this decision to receive Mr. B, forty-two members of the Assembly entered their solemn protest, supported by three reasons… In the General Assembly of 1828… In opposition to this act a solemn protest was presented and read, by a minority of the Assembly… Again, in the General Assembly of 1831… Against this decision a formal protest was entered by sixty-seven of the minority. And it is worthy of notice, that among the subscribers to this protest, the following names are found… the Reverend Robert J. Breckinridge… Alexander Boyd, Ashbel Green… At the same General Assembly, (1831)… Against this expression of opinion, a protest was offered, accepted, and recorded, signed by thirty members of the minority… Let us now attend–Secondly, to the dictates of reason on this subject…</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/samuel-miller.html">Samuel Miller</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Biblical Repertory &amp; Theological Review | no. 1, vol. 7 (Jan. 1835), article 5, ‘New Ecclesiastical Law’</cite>, pp. 89-97</span></figcaption>

tories+of+the+church%2C+in+all+their+grades%2C+for+more+than+forty+years%3B+and+we+never+knew+or+heard+of+an+in-+dividual+who+doubted+the+right+of+appeal%2C+complaint%2C+and+protest%2C+in+all+sorts+of+cases%E2%80%A6+many+a+time%2C+and+on+a+great+variety+of+occasions%2C+we+have+participated+in+protests%2C+etc.+in+all+sorts+of+cases%2C+without+dreaming+that+any+one+ever+thought+of+confining+the+privilege+to+cases+of+process+only%E2%80%A6+The+archives+of+the+church+are+better+than+cursory+assertions.+Litera+scripta+manet.+Let+us%2C+therefore%2C+appeal+to+public+records%2C+which+cannot+lead+us+astray.+In+the+year+1826%2C+the+General+Assembly%E2%80%A6+determined%2C+by+a+vote%2C+to+postpone+fixing+the+location+%5Bof+Western+Theological+Seminary%5D+for+another+year.+Against+this+decision+the+Reverend+Joshua+L.+Wilson%2C+of+Cincinnati%2C+entered+his+solemn+protest%2C+accompanied+with+five+reasons%2C+which+still+remain+on+permanent+record.+In+the+very+same+General+Assembly%2C+%28of+1826%29%E2%80%A6+Against+this+decision+to+receive+Mr.+B%2C+forty-two+members+of+the+Assembly+entered+their+solemn+protest%2C+supported+by+three+reasons%E2%80%A6+In+the+General+Assembly+of+1828%E2%80%A6+In+opposition+to+this+act+a+solemn+protest+was+presented+and+read%2C+by+a+minority+of+the+Assembly%E2%80%A6+Again%2C+in+the+General+Assembly+of+1831%E2%80%A6+Against+this+decision+a+formal+protest+was+entered+by+sixty-seven+of+the+minority.+And+it+is+worthy+of+notice%2C+that+among+the+subscribers+to+this+protest%2C+the+following+names+are+found%E2%80%A6+the+Reverend+Robert+J.+Breckinridge%E2%80%A6+Alexander+Boyd%2C+Ashbel+Green%E2%80%A6+At+the+same+General+Assembly%2C+%281831%29%E2%80%A6+Against+this+expression+of+opinion%2C+a+protest+was+offered%2C+accepted%2C+and+recorded%2C+signed+by+thirty+members+of+the+minority%E2%80%A6+Let+us+now+attend%E2%80%93Secondly%2C+to+the+dictates+of+reason+on+this+subject%E2%80%A6%E2%80%9D%0A%0A%E2%80%94+Samuel+Miller%2C+The+Biblical+Repertory+%26+Theological+Review+%7C+no.+1%2C+vol.+7+%28Jan.+1835%29%2C+article+5%2C+%E2%80%98New+Ecclesiastical+Law%E2%80%99%2C+pp.+89-97&amp;url=https%3A%2F%2F5solasquotes.github.io%2Fquote%2F36cd623f61.html&amp;via=5Solas" target="_blank" rel="noopener">Share on X</a><a class="perma" href="../quote/36cd623f61.html">Permalink</a><a class="src" href="https://reformedbooksonline.com/scottish-theology/free-church-of-scotland/quotes-on-the-right-of-continued-protest/#:~:text=It%20has%20been%20lately%20announced%20that,dictates%20of%20reason%20on%20this%20subject&amp;text=It%20has%20been%20lately%20announced%20that%20the%20Synod&amp;text=to%20the%20dictates%20of%20reason%20on%20this%20subject" rel="noopener" target="_blank">Read it online · Reformed Books Online</a></div>

<blockquote><p>‘This hour’. Among all the hours that Christ had, this was the saddest: 1. Christ saw that his life in this hour would be taken from Him; it was convenient that Christ, who was a man, like us in all things except sin, should not be a stock in dying; but have actual pain and sense in the losing of his life, for Christ had as much nature, though no corruption, as any man; and life is a sweet inheritance, it’s nature’s excellent free-hold, and no man is willingly, and without one sigh or tear cast out of this free-hold, and Christ’s nature was not brass or iron. Sorrow and sadness found a kindly lodging in Him. . Sorrow Bible Verse Mt. 26:37-38 “And he took with Him Peter and the two sons of Zebedee, and began to be sorrowful and very heavy. Then saith He unto them, ‘My soul is exceeding sorrowful, even unto death…&#x27;</p></blockquote>

</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-1195304235" data-kw="">
<blockquote><p>Theodoret does rightly and truly tell us that even the common people are hardly accustomed to speak any otherwise [about Christ’s person and his natures]: for if Peter speak, who would not rather say that Peter speaks, than say that Peter’s body or tongue speaks? and yet notwithstanding, neither does Peter’s mind, nor his foot nor any other member speak, but his tongue or mouth. But because these things have even personally grown up (as it were) together [in the Logos’s assumption of human nature], and are come into one subsistence or being, that is truly in the concrete attributed to, and spoken of the whole, which if it were uttered of the parts of the whole considered severally and by themselves, should be falsely spoken. What more? By reason of this personal union [between a person and his nature], though now it be dissolved through death, Peter shall be said to have died and sat [buried] at Rome, whose soul yet notwithstanding, neither is dead, neither anywhere placed upon the earth. So when I say [that] the eternal Son of God died, I consider and mean Him as He is whole-Christ, although I denominate Him after one of his natures, to wit, his mortal or human nature. So again I say [that] this man forgives sins, and yet not as He is man of Himself (for it belongs only to God to forgive sins), but because He is God and man in one person together.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/theodore-beza.html">Theodore Beza</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Two Very Learned Sermons of Mr. Beza, together with a Short Sum of the Sacrament of the Lord’s Supper</cite>, … (London, 1588), ‘The First Homily… 1574’, pp. 38-9</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/the-person-of-christ/union-of-the-two-natures.html">Union of the Two Natures</a></span></div>

</figure><figure class="quote" id="q-0dd2b3f86c" data-kw="">
<blockquote><p>Fifthly, the union of the two natures in Christ is an inseparable union. So that from the first moment thereof, there never was, nor to eternity shall be, any separation of them. If you ask how the union remained betwixt them when Christ’s human soul and body were separated from each other upon the cross? Is not death the dissolution of union betwixt soul and body? True, the natural union betwixt his soul and body was dissolved by death for a time, but this hypostatical union remained even then as entire and firm as ever. For though his soul and body were divided from each other, yet neither of them from the divine nature. Divines assist our conception of this mystery by an apt illustration. A man that holds in his hand a sword sheathed, when he pleases, draws forth the sword, but still holds that in one hand and the sheath in the other, and then sheaths it again, still holding it in his hand; so when Christ died his soul and body retained their union with the divine nature, though not (during that space) one with another.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/john-flavel.html">John Flavel</a></span><span class="wk"><span class="lbl">Work:</span> <cite>‘5th Sermon</cite>, on Jn. 1:14 in The Fountain of Life Opened, … (London, 1673), pp. 56-7</span></figcaption>

">Read it online · Reformed Books Online</a></div>
</figure><figure class="quote" id="q-87af132cd9" data-kw="">
<blockquote><p>He was from eternity a divine person–the second person in the Godhead. In this respect, no more, no less, he was and continues to be a person. Since the incarnation, he is not two persons, nor a compound person–a divine-human person, as Dorner holds–but one and the same divine person.</p></blockquote>

</figure><figure class="quote" id="q-c193217004" data-kw="">
<blockquote><p>Keckermann 323f.: (2) ‘Of the seed and blood of the Virgin Mary was formed Christ’s flesh, the Holy Spirit adding quickening force to this material. Of course the seed and blood of the Virgin Mary also possessed their own vital and animal spirits, as other men’s seed usually has. But these were by no means sufficient for the plastic or formative force of the foetus in question. And so the Holy Spirit’s extraordinary shadowing and quickening were added: whence also it is said to have been conceived of the Holy Spirit, a phrase and manner of speaking which is human and metaphorical, not strictly appropriate.–(3) Thus Christ’s incarnation was at once ordinary and extraordinary: ordinary as regards the material supplied by the Virgin Mary, extraordinary as regards the formative force added to this material…&#x27;</p></blockquote>

<blockquote><p>Whether both the symbols of bread and wine are to be administered? It is affirmed. Whether usual and truly ordinary bread [is to be used]? It is affirmed. … What in place of wine ought to be administered where wine may not be had? What is analogous. Of what kind [is to be administered to] those that abstain from the supper? The same [as the previous answer]. Whether water ought to be mixed with the wine? It is denied.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/gisbertus-voetius.html">Gisbertus Voetius</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Syllabus of Theological Problems</cite>, … (Utrecht, 1643), 2nd Section, ‘Of Redemption’, Tract 5, ‘Of Signs’, Title VII, ‘Of the Sacraments’, subtitle 5, ‘Of the Lord’s Supper’</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/worship/ceremonies-and-things-indifferent.html">Ceremonies and Things Indifferent</a></span></div>
<div class="actions"><button class="copy" data-copy="“Whether both the symbols of bread and wine are to be administered? It is affirmed. Whether usual and truly ordinary bread [is to be used]? It is affirmed. … What in place of wine ought to be administered where wine may not be had? What is analogous. Of what kind [is to be administered to] those that abstain from the supper? The same [as the previous answer]. Whether water ought to be mixed with the wine? It is denied.”

</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-88821cf794" data-kw="">
<blockquote><p>Conclusion 3. We hold that the Church of God has power to prescribe ordinances rules, or traditions, touching time and place of God’s worship, and touching order and comeliness to be used in the same: and in this regard, Paul, 1 Cor. 11:2, commends the Church of Corinth for keeping his traditions, and Acts 15, the Council at Jerusalem decreed that the Churches of the Gentiles should abstain from blood and from things strangled. This decree is termed a tradition, and it was in force among them so long as the offence of the Jews remained. And this kind of traditions, whether made by general councils or particular synods, we have care to maintain and observe; these caveats being remembered: First, that they prescribe nothing childish or absurd to be done: Secondly, that they be not imposed as any parts of God’s worship: Thirdly, that they be severed from superstition or opinion of merit: Lastly, that the Church of God be not burdened with the multitude of them.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/william-perkins.html">William Perkins</a></span><span class="wk"><span class="lbl">Work:</span> <cite>A Reformed Catholike</cite>, … ([Cambridge,] 1598), 7th Point, ‘Of Traditions’, pp. 136-7</span></figcaption>

</figure><figure class="quote" id="q-ebdc46ee83" data-kw="">
<blockquote><p>The state of the case turns on the definition. For the children of Reuben, Gad, and Manasseh, explain that they had a different intention, and thus exculpate themselves from the charge, inasmuch as the nature of the proceeding was quite different from what the others supposed… as if they had said, that it will be made palpable by the fact itself, that they never had any intention of devising any new form of worship; and they rightly explain how the altar would have been unlawful, namely, if they had built it for the purpose of offering sacrifice. For the Law did not condemn the mere raising of heaps of stones, but only enjoined that sacrifices should be offered in one place…</p></blockquote>

</figure><figure class="quote" id="q-26f04c7fb2" data-kw="">
<blockquote><p>Objection [of opponents]: In matters plainly determined by Scripture, rulers are to follow the Word of God; but in matters circumstantial or indifferent, where Scripture says neither for the one side, nor for the other, what rulers think good, is to be followed, there being no evil nor impiety in that which they command. Answer 1: This is to make rulers in matters of salvation liable to the Scriptures of God; but in matters which men call indifferent to make them Popes, and to hang our consciences upon their sleeve, which is most absurd:

1. Because Paul in matters most indifferent, of days and meats, would not have the Romans to hang upon his judgment, but will rule both their practice and his own by the Law of nature: ‘Murder not,’ ‘Scandalize not.’

2. What rulers think good is not a rule for constitutions and for people’s obedience in matters circumstantial; but the rule of rulers here in making laws, and of people in obeying laws, is goodness itself, order, decency, aptitude to edify, in things that they command; for it were strange if in matters that they call of salvation, not thoughts, but the Word of God should rule and square canon-makers, but in matters indifferent, their thoughts should be a law.

3. Scripture and the Law of nature, and right reason, which is a deduction from Scripture, is able sufficiently in all canons and constitutions to regulate both rulers and people, and to determine what is conventent in circumstances; and the Lord here is an infallible Judge, speaking in his Word, as He is in all matters, which they call fundamental; yea, the Scripture shall be imperfect in the duties of the Second Table, if it do not determine what is active scandal, or soul murder, as it does determine what is idolatry, what is lawful worship.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/samuel-rutherford.html">Samuel Rutherford</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Divine Right of Church Government</cite>, (London, 1646), Appendix, Intro, ‘Whether or no things indifferent can be commanded because indifferent?’, p. 656</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/worship/ceremonies-and-things-indifferent.html">Ceremonies and Things Indifferent</a></span></div>

</figure><figure class="quote" id="q-78cd3c2434" data-kw="">
<blockquote><p>5. They [papists] likewise say that some countries have no wine [in order to justify their witholding the cup from lay-persons]. I answer also that there are countries that have no bread; and that if men can carry the one thither, they may carry the other also: or if that be impossible, it is better in such a country to use that which serves there instead of bread and wine, rather than to be wholly or in part deprived of the sacrament… Add hereunto that if some countries cannot have wine for the sacrament, it follows not but that they may be furnished from an infinite number of other provinces where they may have wine.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/pierre-du-moulin.html">Pierre Du Moulin</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Buckler of the Faith</cite>, … (London, 1620), 38th Article, ‘An Examination of the Reasons Alledged by our Adversaries’, pp. 531-2</span></figcaption>

<div class="actions"><button class="copy" data-copy="“5. They [papists] likewise say that some countries have no wine [in order to justify their witholding the cup from lay-persons]. I answer also that there are countries that have no bread; and that if men can carry the one thither, they may carry the other also: or if that be impossible, it is better in such a country to use that which serves there instead of bread and wine, rather than to be wholly or in part deprived of the sacrament… Add hereunto that if some countries cannot have wine for the sacrament, it follows not but that they may be furnished from an infinite number of other provinces where they may have wine.”

— Sr. Pierre Du Moulin, The Buckler of the Faith: or a Defence of the Confession of Faith of the Reformed Churches in France, Against the Objections of Mr. Arnoux, the Jesuite… (London, 1620), 38th Article, ‘An Examination of the Reasons Alledged by our Adversaries’, pp. 531-2">Copy</button><a class="share" href="https://x.com/intent/post?text=%E2%80%9C5.+They+%5Bpapists%5D+likewise+say+that+some+countries+have+no+wine+%5Bin+order+to+justify+their+witholding+the+cup+from+lay-persons%5D.+I+answer+also+that+there+are+countries+that+have+no+bread%3B+and+that+if+men+can+carry+the+one+thither%2C+they+may+carry+the+other+also%3A+or+if+that+be+impossible%2C+it+is+better+in+such+a+country+to+use+that+which+serves+there+instead+of+bread+and+wine%2C+rather+than+to+be+wholly+or+in+part+deprived+of+the+sacrament%E2%80%A6+Add+hereunto+that+if+some+countries+cannot+have+wine+for+the+sacrament%2C+it+follows+not+but+that+they+may+be+furnished+from+an+infinite+number+of+other+provinces+where+they+may+have+wine.%E2%80%9D%0A%0A%E2%80%94+Sr.+Pierre+Du+Moulin%2C+The+Buckler+of+the+Faith%3A+or+a+Defence+of+the+Confession+of+Faith+of+the+Reformed+Churches+in+France%2C+Against+the+Objections+of+Mr.+Arnoux%2C+the+Jesuite%E2%80%A6+%28London%2C+1620%29%2C+38th+Article%2C+%E2%80%98An+Examination+of+the+Reasons+Alledged+by+our+Adversaries%E2%80%99%2C+pp.+531-2&amp;url=https%3A%2F%2F5solasquotes.github.io%2Fquote%2F78cd3c2434.html&amp;via=5Solas" target="_blank" rel="noopener">Share on X</a><a class="perma" href="../quote/78cd3c2434.html">Permalink</a><a class="src" href="https://reformedbooksonline.com/on-the-sacraments-in-extra-ordinary-circumstances/#:~:text=5.%20They%20%5Bpapists%5D%20likewise%20say%20that,provinces%20where%20they%20may%20have%20wine&amp;text=5.%20They%20%5Bpapists%5D%20likewise%20say%20that%20some%20countries&amp;text=of%20other%20provinces%20where%20they%20may%20have%20wine" rel="noopener" target="_blank">Read it online · Reformed Books Online</a></div>

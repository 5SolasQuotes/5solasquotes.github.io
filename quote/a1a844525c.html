<main class="wrap"><figure class="quote" id="q-a1a844525c" data-kw="">
<blockquote><p>The manner of worshipping God not commanded, is called Will-worship, to wit, a worship devised by man’s brain. Paul opposeth this kind of worshipping God to Christian Liberty, Col. 2. 20. 21, 22, 23 […] Such are those ceremonies brought in by Popery in Baptism, &amp;c and their five Sacraments by them devised, canonical hours, beads, and the Latin tongue in Prayer; Fasts placed rather in choice of meats, than in abstinence, chiefly Lent fast, the Vows also of poverty, Monkish obedience, and Religious continency.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/johannes-wolleb.html">Johannes Wollebius</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The abridgment of Christian divinity</cite>, trans. Alexander Ross (3rd edn, London, 1660), p. 343.</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/worship.html">Worship</a></span></div>

</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-cdfc0eea12" data-kw="">
<blockquote><p>All that outward reverence which we show towards God in his worship and service must be measured and estimated according to the customs and usage of places and countries; so that what they use as a sign and expression of honor to their superiors, they ought much more to use it in the presence of the great God, the King of Kings and Lord of Lords. And therefore uncovering of the head [for men], bowing of the body, an humble submiss and settled composure of the whole man, which among us are but fitting signs of respect and reverence, when we appear in the presence of those who are much our superiors, ought likewise to be used by us in the presence of God, who is infinitely such, not indeed that they are essential parts of worship, but signs and testimonies of it.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/ezekiel-hopkins.html">Ezekiel Hopkins</a></span><span class="wk"><span class="lbl">Work:</span> <cite>An Exposition on the Ten Commandments with other Sermons</cite>, … (London, 1691) | Second Commandment</span></figcaption>

</figure><figure class="quote" id="q-2e0d54db80" data-kw="">
<blockquote><p>And that David might not think this motion of building God an house displeasing unto Him, although he was not permitted so to do, it is said, 1 King: 8:18, ‘Whereas it was in thy mind to build Me an house, thou didst well,’ which is here omitted, the Lord approved it expressly as a pious intention in David. And lastly because he bent his mind to the building of an house for God, the Lord promises to requite him with the like, and to build him an house, as it is said He did for the midwives of Egypt, He built them houses…</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/john-mayer.html">John Mayer</a></span><span class="wk"><span class="lbl">Work:</span> <cite>A Commentary upon the Whole Old Testament</cite>, ... (London: 1653), on 2 Samuel, ch. 7, p. 390</span></figcaption>

</figure><figure class="quote" id="q-89d3562958" data-kw="">
<blockquote><p>Now in this that I declare unto you I praise you not, that ye come together not for the better, but for the worse. For first of all, when ye come together in the church, I hear that there be divisions among you; and I partly believe it. For there must be also heresies among you, that they which are approved may be made manifest among you. When ye come together therefore into one place, this is not to eat the Lord’s supper. For in eating every one taketh before other his own supper: and one is hungry, and another is drunken. What? have ye not houses to eat and to drink in? or despise ye the church of God, and shame them that have not? what shall I say to you? shall I praise you in this? I praise you not.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/old-testament.html">The Bible</a></span><span class="wk"><span class="lbl">Work:</span> <cite>1 Cor., 11:17-22</cite></span></figcaption>

</figure><figure class="quote" id="q-7d64ca73d6" data-kw="">
<blockquote><p>Judge, therefore, reader, whether the pope with his be the church; whether their authority be above the scripture; whether all they teach without scripture be equal with the scripture; whether they have erred, and not only whether they can. And against the mist of their sophistry take the ensamples that are past, in the Old Testament and authentic stories, and the present practice which thou seest before thine eyes.

Judge whether it be possible that any good should come out of their dumb ceremonies and sacraments into thy soul. Judge their penance, pilgrimages, pardons, purgatory, praying to posts, dumb blessings, dumb absolutions, their dumb pattering, and howling, their dumb strange holy gestures, with all their dumb disguisings, their satisfactions and justifyings. And because thou findest them false in so many things, trust them in nothing; but judge them in all things.

Mark at the last the practice of our fleshly spirituality and their ways, by which they have walked above eight hundred years; how they establish their lies, first, with falsifying the scripture; then through corrupting with their riches, whereof they have infinite treasure in store; and last of all, with the sword. Have they not compelled the emperors of the earth, and the great lords and high officers to be obedient unto them, to dispute for them, and to be their tormentors …</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/william-tyndale.html">William Tyndale</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Letter to Sir Thomas More’s Dialogue, The Supper of the Lord after the True Meaning of John VI. and 1 Cor. XI., and WM. Tracy’s Testament Expounded, ed. Henry Walter (Cambridge: The Parker Society, 1850), pp 9-10.</cite></span></figcaption>
<div class="meta"><span class="t"><a href="../topics/worship.html">Worship</a></span></div>

<main class="wrap"><figure class="quote" id="q-b8491921ea" data-kw="">
<blockquote><p>Now it was seen, and made plain to the World, that the suffering People in Scotland acted upon on Principles of Enthusiasm, blind Zeal or religious Frenzy, as their Enemies suggested; that they were no Enemies to Monarchy, Civil Government, order of Society, and the like, as had been scandalously said; but that they kept strictly to the Rule of God’s Word, adhered to an honest Cause, and acted upon just Principles: And when such Kings were called to the Throne, as desired to Rule for God, and the Good of the People, who made the Laws of God and Man the Rule of their Government, and the Prosperity of Religion, and of their Subjects the End of it; they knew how to obey, serve and defend such Princes with the Blood and Treasure, as well as they had Courage to resist and reject those, who, with the Breach of Faith, Honour or Constitution, became Tyrants and Persecutors, Enemies to God, and Destroyers of Men, as their former Princes had been.

This is evident by their Practice, at the Revolution; in that no sooner was the Prince of Orange Landed in England, and the Enemies of our Constitution began to stagger, but these People immediately took Arms, and successfully chased the bloody Party, out of their Country. But when this was done, what Measures did they take? Did they set up KING JESUS as a Temporal Prince, and the fifth Monarchy in his Name? Did they Preach the Doctrine of Dominion founded on Grace, or form Schemes of Republican Government? Did they erect themselves as Tyrants in the Room of those they pulled down, so making the People change their Masters, not their Yoke?

NO, NO, they adhered to the Legal Constitution of their Country, they submitted cheerfully to the Return of Magistracy, and the free Course of the Laws of their Country, they armed themselves, and came up to Edinburgh at their own Charge, formed themselves into Companies; indeed, they were able to have formed a considerable Army, and offered themselves to March to any Part of the Nation against the Popish and Jacobite Party; and especially they offered, and were accepted, and admitted to Guard the Convention of Estates, against the Attempt of the Duke of Gordon, who at that Time commanded a Popish Garrison in the Castle of Edinburgh; and against all, of any Denomination that should attempt to Disturb them; and to the eternal Honour of the wild Antimonarchical, Enthusiastic, Lunatic Cameronians, for so their Enemies had called them; they were the first Men in Scotland, that addressed or petitioned the Convention of Estates, to Place the Crown of Scotland on the Head of their Delivered King WILLIAM, which was done accordingly; to the restoring of Religion, healing the Breaches of Scotland, and the utter Confusion of their Persecutors …</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/daniel-defoe.html">Daniel Defoe</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Memoirs of the Church of Scotland, In Four Periods</cite>, (London: Eman. Matthews, 1717), pp 300-02.</span></figcaption>

<blockquote><p>The law of God may be divided into ceremonial, judicial, and moral categories. This three-fold division of the law is sometimes called the Lex Triplex. In his commentary on the Westminster Shorter Catechism, Thomas Boston explains how the categories may be distinguished:

There are three sorts of laws we find in the word.

1. The ceremonial law, which was given by Moses. This bound only the Jews, and that to the coming of Christ, by whom it was abrogated, being a shadow of good things that were then to come: a hedge and partition-wall betwixt them and the Gentiles, which is now taken down.

2. The judicial law, which was the civil law of the Jews, given also first by Moses, which their civil concerns were to be regulated, in respect of which the Jewish government was a Theocracy. What a happy people were they under such a government! Yet does it not bind other nations farther than it is of moral equity, being peculiarly adapted to the circumstances of that nation.

3. The moral law, which is the declaration of the will of God to mankind, binding all men to perfect obedience thereto in all the duties of holiness and righteousness. The ceremonial law was given to them as a church in their particular circumstances; the judicial law as a state; but the moral law was given them in common with all mankind.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/thomas-boston.html">Thomas Boston</a></span><span class="wk"><span class="lbl">Work:</span> <cite>An Illustration of the Doctrines of the Christian Religion, with respect to Faith and Practice, upon the plan of the Assembly’s Shorter Catechism; Comprehending a Complete Body of Divinity</cite>, in The Complete Works of the Late Rev. Thomas Boston, Ettrick, ed. Samuel McMillan (12 vols, London, 1853), 2: 60-61.</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/civil-government-and-society/natural-law-and-civil-law.html">Natural Law and Civil Law</a></span></div>

<blockquote><p>The third cause is to avoid the inconvenience of solitariness, signified in these words, “It is not good for man to be alone;” as though he had said, This life would be miserable and irksome, and unpleasant to man, if the Lord had not given him a wife to company his troubles. If it be not good for man to be alone, then it is good for man to have a fellow; therefore as God created a pair of all other kinds, so he created a pair of this kind.

We say that one is none, because he cannot be fewer than one, he cannot be less than one, he cannot be weaker than one, and therefore the wise man saith, Eccles. iv. 10, ‘Woe to him that is alone,’ that is, he which is alone shall have woe. Thoughts, and cares, and fears will come to him because he hath none to comfort him, as thieves steal in when the house is empty; like a turtle which hath lost his mate; like one leg when the other is cut off; like one wing when the other is clipped; so had the man been, if the woman had not been joined to him; therefore for mutual society, God coupled two together, that the infinite troubles which lie upon us in the world might be eased with the comfort and help one of another, and that the poor in the world might have some comfort as well as the rich ; for “the poor man,” saith Solomon, “is forsaken of his own brethren,” Prov. xix. 7; yet God hath provided one comfort for him, like Jonathan’s armour-bearer, that shall never forsake him, 1 Sam. xiv. 7, that is, another self, which is the only commodity (as I may term it) wherein the poor do match the rich; without which some persons should have no helper, no comfort, no friend at all.

But as it is not good to be alone, so Solomon sheweth that “it is better to be alone than to dwell with a froward wife,” Prov. xxi. 9, which is like a quotidian ague, to keep his patience in ure [sic]. Such furies do haunt some men, like Saul’s spirit, 1 Sam. xvi. 14, as though the devil had put a sword into their hands to kill themselves; therefore choose whom thou mayest enjoy, or live alone still, and thou shalt not repent thee of thy bargain.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/henry-smith.html">Henry Smith</a></span><span class="wk"><span class="lbl">Work:</span> <cite>A Preparative to Marriage</cite>, (1591) in The Works of Henry Smith; Including Sermons, Treatises, Prayers, and Poems, ed. Thomas Fuller (2 vols, Edinburgh: James Nichol, 1866), 1: 12.</span></figcaption>

<blockquote><p>We are personally separated from the Established Churches of the country, although as Christians and patriots we cannot cease to feel an interest in them, and although we still hold, I hope, and I am glad to observe from both the motions, that we avow our holding the principle of the right and duty of the State to maintain an ecclesiastical establishment of the truth.

Let me, moreover, state at the outset the precise difference, as it appears to me, between the two motions which are to be submitted to the House. Both the motions, as I have intimated already, seem to indicate that we still resolve to maintain the principle of an ecclesiastical establishment, as hitherto forming part of the testimony of our Church. We also are unanimously of opinion, as appears from the motions, that we should deprecate the endowment of Popery as the greatest public calamity that could befall the country. (Hear, hear.)

We are totally opposed to indiscriminate endowments of truth and falsehood, and the difference between the two motions—although it is a very wide difference after all—is this, that in the one motion a decided opinion is given upon the present state of matters and the political questions involved—an opinion, as I think, unwise and inconsistent with our principles; while in the other motion principles are stated, but an attempt is made to prevent our Church from assuming a mere party and political aspect by giving any unwise opinion as to the practical application of our principles, to the very difficult circumstances in which Ireland is placed, beyond this, that the Government is bound to support the truth of God in that land.

It is maintained on the other side that there is no alternative on the part of the Government, but either to support all bodies or to support none; and it is inferred that since it is better to support none than to support all, we ought to give it forth as our opinion, that this is the alternative which the statesmen of our country should at present adopt. Now, this is plausible but fallacious, for, in the first place, I do not admit that we are driven to any such alternative as this of supporting all or supporting none—(hear, hear)—I do not think we are entitled to tell statesmen that that is the alternative to which they are driven, or ever can be driven. (Hear, hear.)

For my part I cannot see that, as men interpreting the Word of God, we are ever entitled to say to statesmen that they are put, or can be put, into a position in which they have merely to choose between two evils, the promotion of truth and falsehood alike, or an entire abstinence from any support of the cause of Christ. There is surely always a third alternative, viz., to do what is right.

And then, in the second place, I do not believe, in opposition to loud assertions to the contrary, that the measures which are in progress and which we are called upon to support, have in the slightest degree the tendency to advance Protestantism. On the contrary, I think I shall prove that they have a direct tendency to promote Popery, and that if we shall throw ourselves into the revolutionary stream which seems now to be running so strongly, we shall to all appearance simply be aiding in the restoration of the influence of a system which was so successfully resisted and overturned by our ancestors at the Reformation, and at the Revolution.</p></blockquote>

<blockquote><p>The first is, that he hath reserved a remnant among us that do make use of this space and season to apply themselves unto the throne of grace, and to cry mightily for mercy. God hath not taken his Holy Spirit from us. God hath not said, by any open work or secret intimation of providence, “Pray no more for this people; my heart shall not be toward them.” He hath not said so; and, therefore, there are yet among us precious souls who do lift up prayers to God night and day, not only for themselves and families, not only for the church of God, but for this poor land of our nativity, that, if it were the will of God, we may not see it soaked in blood;—that God would not come forth to destroy it with a curse;—that God would pity, and spare, and have mercy upon it;—that he would not make it an “Aceldama,”—a field of blood. There are many cries to God to this purpose. So that there are some by whom this space and season God hath given us is made use of.</p></blockquote>

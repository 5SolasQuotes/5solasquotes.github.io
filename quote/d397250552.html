<main class="wrap"><figure class="quote" id="q-d397250552" data-kw="">
<blockquote><p>…whether any non-human animals are intelligent. Certainly some of them are, in a loose sense of ‘intelligent’. For some of them solve problems, produce crude tools, and so forth… So, the question of whether any non-human animals are intelligent in the strict sense ultimately boils down to the question of whether any of them exhibits linguistic behavior that is plausibly interpreted as conveying abstract concepts, propositions and logical inferences. The answer is that none of them does… as Noam Chomsky observes, there are five crucial differences between human language and what such apes are capable of. Two of them are biological. In human beings, Chomsky observes, language is associated with specific language centers in the brain that have no apparent parallel in apes… …In human beings, Chomsky points out, language is used in a way that is largely independent of immediate stimuli, the satisfaction of needs, or instrumental purposes… Our use is also governed by rules determining the structure of utterances, in a recursive way that allows for a potentially infinite number of sentences. The alleged cases of language use by apes exhibits none of these key features. Furthermore, human children come to learn language by mere exposure to it, without the need for explicit training… …Wishful thinking, dubious inferences, problematic methodology, and conceptual imprecision are rife in the work of researchers who claim to have taught ASL [American Sign Language] or some other linguistic system to apes… Nor is there behavior clearly exhibiting anything more than mere conditioning to carry out an action so as to secure some reward (as opposed to genuine understanding of a name), or simple associations of the kind a dog exhibits when it carries its leash over to its owner so as to go out for a walk. Nor is there any serious evidence that apes follow grammatical rules when emitting sequences of symbols (as opposed, say, to rote repetition of paired terms)… Nor do apes emit the alleged linguistic behavior they exhibit in a spontaneous way, as opposed to under prompting. Nor do they take turns in conversation, but sign simultaneously with their partner and in a manner that is not clearly visible to him. Nor once they gain whatever favility with words human trainers are able to impart to them, do they pass it on to other chimpanzees. Nor, unlike human beings, are they able to introduce new words by use of existing words. Arguments for linguistic competence in apes seem to get off the ground only because such obvious differences are ignored, while relatively trivial analogies between human and ape performance are overemphasized… As Chomsky says, to think this shows that such apes are exhibiting the early stages of genuine linguistic development is like supposing that a human child flapping his arms ‘is exhibiting’exhibiting incipient flight motions.”</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/edward-feser.html">Edward Feser</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Immortal Souls: a Treatise on Human Nature (Editiones Scholasticae, 2024) | pt. 2, ch. 6, ‘Animality’ | ‘Animal Intelligence’</cite>, pp. 245-56</span></figcaption>

</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-bf53d697a1" data-kw="">
<blockquote><p>But when I say that God can without respect of sin, inflict any torment upon his creature, this is delivered of power absolute. This power the Lord did execute upon his own Son: for what was his sin? Was He not the spotless lamb of God? Yet what agonies did He suffer in the garden, what torments and terrors upon the cross, when He cried out ‘My God, my God, Why hast thou forsaken Me?’ But the like power He does not execute on us, only He gives us authority to exercise the like power over other creatures: If the powder of an hare [rabbit] burnt alive in an oven, be found to be wholesome for us, He gives us leave thus to deal with him, and the like: yet have not these creatures sinned either against God, or against us. Of this absolute power of God I have discoursed more sparingly in the place cited by him, bk. 1, pt. 2, De Electione, digression 3.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/william-twisse.html">William Twisse</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Riches of God’s Love unto the Vessels of Mercy, consistent with his Absolute Hatred or Reprobation of the Vessels of Wrath… (Oxford: L.L., 1653), pt. 2, 2nd Sort of Arguments, sect. 3</cite>, pp. 150-51</span></figcaption>

<blockquote><p>…non-rational animals pursue the good in its most practical and immediate aspect, according to their (non- rational) desires and motivations. Only the rational creature, however, can desire the good as abstracted from practical desires and circumstances, pursuing goodness in its universal form as an end in itself. It is the intellectual and volitional capacity within the human person that makes him the image of God, distinct from other creatures who reflect God’s goodness in lesser ways. It is in the human soul precisely as rational that the image of God reaches its pinnacle in the created order. By extension, there is a sense in which God’s causal intimacy with created causes also finds a kind of special intimacy in the case of human willing. Because of the volitional capacity of the rational soul, our participation in the similitude of divine goodness is far deeper than that of any other creature.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/reginald-m-lynch.html">Reginald M. Lynch</a></span><span class="wk"><span class="lbl">Work:</span> <cite>“Divine Causality &amp; Human Freedom: Aquinas, Banez and Premotion after Descartes” in eds. Ballor, Gaetano &amp; Sytsma, Beyond Dordt &amp; De Auxiliis: the Dynamics of Protestant &amp; Catholic Soteriology in the Sixteenth &amp; Seventeenth Centuries (Brill, 2019), p. 229 Lynch is a Dominican and writes in the Thomist tradition.</cite></span></figcaption>
<div class="meta"><span class="t"><a href="../topics/man/image-of-god.html">Image of God</a></span></div>

<blockquote><p>Now as man’s will, so the will of Christ has two several kinds of operation: the one natural or necessary, whereby it desires simply whatsoever is good in itself and shuns as generally all things which hurt; the other deliberate, when we therefore embrace things as good because the eye of understanding judges them good to that end which we simply desire. Thus in itself we desire health, physic, only for health’s sake. And in this sort, special reason oftentimes causes the will by choice to prefer one good thing before another, to leave one for another’s sake, to forgo meaner for the attainment of higher desires, which our Savior likewise did. These different inclinations of the will considered, the reason is easy how in Christ there might grow desires seeming, but being not indeed opposite, either the one of them unto the other, or either of them to the will of God. For let the manner of his speech be weighed: ‘My soul is now troubled, and what should I say? Father, save Me out of this hour? But yet for this very cause I am come into this hour.’ His purpose herein was most effectually to propose to the view of the whole world two contrary objects, the like whereunto in force and efficacy were never presented in that manner to any but only to the soul of Christ. There was presented before his eyes in that fearful hour on the one side God’s heavy indignation and wrath towards mankind as yet unappeased, death as yet in full strength, Hell as yet never mastered by any that came within the confines and bounds thereof, somewhat also peradventure more than is either possible or needful for the wit of man to find out; finally, Himself flesh and blood left alone to enter into conflict with all these. On the other side: a world to be saved by One, a pacification of wrath through the dignity of that sacrifice which should be offered, a conquest over death through the power of that Deity which would not suffer the tabernacle thereof to see corruption, and an utter disappointment of all the forces of infernal powers through the purity of that soul which they should have in their hands and not be able to touch. Let no man marvel that in this case the soul of Christ was much troubled. For what could such apprehensions breed, but (as their nature is) inexplicable passions of mind, desires abhorring what they embrace and embracing what they abhor? In which agony, how should the tongue go about to express what the soul endured? When the griefs of Job were exceeding great, his words accordingly to open them were many; howbeit, still unto his seeming they were undiscovered: ‘Though my talk’ (says Job) ‘be this day in bitterness, yet my plague is greater than my groaning.’ But here to what purpose should words serve, when nature has more to declare than groans and strong cries, more than streams of bloody sweats, more than his doubled and tripled prayers can express, who thrice putting forth his hand to receive that cup, besides which, there was no other cause of his coming into the world, He thrice pulls it back again and as often even with tears of blood craves, ‘If it be possible, O Father, or if not, even what thine own good pleasure is;’ for whose sake the passion that has in it a bitter and a bloody conflict, even with wrath and death, and Hell, is most welcome. Whereas therefore we find in God a will resolved that Christ shall suffer; and in the human will of Christ two actual desires, the one avoiding and the other accepting death: Is that desire which first declares itself by prayer against that wherewith He concludes prayer, or either of them, against his mind to whom prayer in this case seeks? We may judge of these diversities in the will by the like in the understanding. For as the intellectual part does not cross itself by conceiving man to be just and unjust, when it means not the same man, nor by imagining the same man learned and unlearned, if learned in one skill and in another kind of learning unskilful, because the parts of every true opposition do always both concern the same subject and have reference to the same thing, since otherwise they are but in show opposite and not in truth: So the will about one and the same thing may in contrary respects have contrary inclinations and that without contrariety. The minister of justice may, for publike example to others, virtuously will the execution of that party whose pardon another for consanguinity’s sake as virtuously may desire. Consider death in itself and nature teaches Christ to shun it. Consider death as a mean to procure the salvation of the world and mercy works in Christ all willingness of mind towards it. Therefore in these two desires there can be no repugnant opposition. Again, compare them with the will of God, and if any opposition be, it must be only between his appointment of Christ’s death and the former desire which wishes deliverance from death. But neither is this desire opposite to the will of God. The will of God was that Christ should suffer the pains of death. Not so his will, as if the torment of innocency did in itself please and delight God; but such was his will in regard of the end whereunto it was necessary that Christ should suffer. The death of Christ in itself therefore, God wills not, which to the end we might thereby obtain life, He both allows and appoints. In like manner, the Son of Man endures willingly to that purpose those grievous pains which simply not to have shunned had been against nature, and by consequent against God. I take it therefore to be an error that Christ either knew not what Himself was to suffer, or else had forgotten the things He knew. The root of which error was an over-restrained consideration of prayer, as though it had no other lawful use but only to serve for a chosen mean whereby the will resolves to seek that which the understanding certainly knows it shall obtain: Whereas prayers, in truth, both unto are, and his were, as well sometime a presentation of mere desires as a mean of procuring desired effects at the hands of God. We are therefore taught by his example that the presence of dolorous and dreadful objects, even in minds most perfect, may as clouds overcast all sensible joy; that no assurance touching future victories can make present conflicts so sweet and easy, but nature will shun and shrink from them; nature will desire ease and deliverance from oppressive burdens that the contrary determination of God is oftentimes against the effect of this desire, yet not against the affection itself, because it is naturally in us; that in such case our prayers cannot serve us as means to obtain the thing we desire; that notwithstanding, they are unto God most acceptable sacrifices because they testify we desire nothing but at his hands, and our desires we submit with contentment to be overruled by his will; and in general they are not repugnant unto the natural will of God which wishes to the works of his own hands, in that they are his own handiwork, all happiness, although perhaps for some special cause in our own particular, a contrary determination have seemed more convenient. Finally, that thus to propose our desires which cannot take such effects as we specify shall notwithstanding otherwise procure us his heavenly grace, even as this very prayer of Christ obtained angels to be sent Him as comforters in his agony. And according to this example, we are not afraid to present unto God our prayers for those things, which that He will perform unto us, we have no sure, nor certain knowledge… Such prayers of the Church to be delivered from all adversity are no more repugnant to any reasonable disposition of men’s minds towards death, much less to that blessed patience and meek contentment which saints by heavenly inspiration have to endure (what cross or calamity soever it pleases God to lay upon them) than our Lord and Savior’s own prayer before his passion was repugnant unto his most gracious resolution to die for the sins of the whole world.</p></blockquote>

r+into+conflict+with+all+these.+On+the+other+side%3A+a+world+to+be+saved+by+One%2C+a+pacification+of+wrath+through+the+dignity+of+that+sacrifice+which+should+be+offered%2C+a+conquest+over+death+through+the+power+of+that+Deity+which+would+not+suffer+the+tabernacle+thereof+to+see+corruption%2C+and+an+utter+disappointment+of+all+the+forces+of+infernal+powers+through+the+purity+of+that+soul+which+they+should+have+in+their+hands+and+not+be+able+to+touch.+Let+no+man+marvel+that+in+this+case+the+soul+of+Christ+was+much+troubled.+For+what+could+such+apprehensions+breed%2C+but+%28as+their+nature+is%29+inexplicable+passions+of+mind%2C+desires+abhorring+what+they+embrace+and+embracing+what+they+abhor%3F+In+which+agony%2C+how+should+the+tongue+go+about+to+express+what+the+soul+endured%3F+When+the+griefs+of+Job+were+exceeding+great%2C+his+words+accordingly+to+open+them+were+many%3B+howbeit%2C+still+unto+his+seeming+they+were+undiscovered%3A+%E2%80%98Though+my+talk%E2%80%99+%28says+Job%29+%E2%80%98be+this+day+in+bitterness%2C+yet+my+plague+is+greater+than+my+groaning.%E2%80%99+But+here+to+what+purpose+should+words+serve%2C+when+nature+has+more+to+declare+than+groans+and+strong+cries%2C+more+than+streams+of+bloody+sweats%2C+more+than+his+doubled+and+tripled+prayers+can+express%2C+who+thrice+putting+forth+his+hand+to+receive+that+cup%2C+besides+which%2C+there+was+no+other+cause+of+his+coming+into+the+world%2C+He+thrice+pulls+it+back+again+and+as+often+even+with+tears+of+blood+craves%2C+%E2%80%98If+it+be+possible%2C+O+Father%2C+or+if+not%2C+even+what+thine+own+good+pleasure+is%3B%E2%80%99+for+whose+sake+the+passion+that+has+in+it+a+bitter+and+a+bloody+conflict%2C+even+with+wrath+and+death%2C+and+Hell%2C+is+most+welcome.+Whereas+therefore+we+find+in+God+a+will+resolved+that+Christ+shall+suffer%3B+and+in+the+human+will+of+Christ+two+actual+desires%2C+the+one+avoiding+and+the+other+accepting+death%3A+Is+that+desire+which+first+declares+itself+by+prayer+against+that+wherewith+He+concludes+prayer%2C+or+either+of+them%2C+against+his+mind+to+whom+prayer+in+this+case+seeks%3F+We+may+judge+of+these+diversities+in+the+will+by+the+like+in+the+understanding.+For+as+the+intellectual+part+does+not+cross+itself+by+conceiving+man+to+be+just+and+unjust%2C+when+it+means+not+the+same+man%2C+nor+by+imagining+the+same+man+learned+and+unlearned%2C+if+learned+in+one+skill+and+in+another+kind+of+learning+unskilful%2C+because+the+parts+of+every+true+opposition+do+always+both+concern+the+same+subject+and+have+reference+to+the+same+thing%2C+since+otherwise+they+are+but+in+show+opposite+and+not+in+truth%3A+So+the+will+about+one+and+the+same+thing+may+in+contrary+respects+have+contrary+inclinations+and+that+without+contrariety.+The+minister+of+justice+may%2C+for+publike+example+to+others%2C+virtuously+will+the+execution+of+that+party+whose+pardon+another+for+consanguinity%E2%80%99s+sake+as+virtuously+may+desire.+Consider+death+in+itself+and+nature+teaches+Christ+to+shun+it.+Consider+death+as+a+mean+to+procure+the+salvation+of+the+world+and+mercy+works+in+Christ+all+willingness+of+mind+towards+it.+Therefore+in+these+two+desires+there+can+be+no+repugnant+opposition.+Again%2C+compare+them+with+the+will+of+God%2C+and+if+any+opposition+be%2C+it+must+be+only+between+his+appointment+of+Christ%E2%80%99s+death+and+the+former+desire+which+wishes+deliverance+from+death.+But+neither+is+this+desire+opposite+to+the+will+of+God.+The+will+of+God+was+that+Christ+should+suffer+the+pains+of+death.+Not+so+his+will%2C+as+if+the+torment+of+innocency+did+in+itself+please+and+delight+God%3B+but+such+was+his+will+in+regard+of+the+end+whereunto+it+was+necessary+that+Christ+should+suffer.+The+death+of+Christ+in+itself+therefore%2C+God+wills+not%2C+which+to+the+end+we+might+thereby+obtain+life%2C+He+both+allows+and+appoints.+In+like+manner%2C+the+Son+of+Man+endures+willingly+to+that+purpose+those+grievous+pains+which+simply+not+to+have+shunned+had+been+against+nature%2C+and+by+consequent+against+God.+I+take+it+therefore+to+be+an+error+that+Christ+either+knew+not+what+Himself+was+to+suffer%2C+or+else+had+forgotten+the+things+He+knew.+The+root+of+which+error+was+an+over-restrained+consideration+of+prayer%2C+as+though+it+had+no+other+lawful+use+but+only+to+serve+for+a+chosen+mean+whereby+the+will+resolves+to+seek+that+which+the+understanding+certainly+knows+it+shall+obtain%3A+Whereas+prayers%2C+in+truth%2C+both+unto+are%2C+and+his+were%2C+as+well+sometime+a+presentation+of+mere+desires+as+a+mean+of+procuring+desired+effects+at+the+hands+of+God.+We+are+therefore+taught+by+his+example+that+the+presence+of+dolorous+and+dreadful+objects%2C+even+in+minds+most+perfect%2C+may+as+clouds+overcast+all+sensible+joy%3B+that+no+assurance+touching+future+victories+can+make+present+conflicts+so+sweet+and+easy%2C+but+nature+will+shun+and+shrink+from+them%3B+nature+will+desire+ease+and+deliverance+from+oppressive+burdens+that+the+contrary+determination+of+God+is+oftentimes+against+the+effect+of+this+desire%2C+yet+not+against+the+affection+itself%2C+because+it+is+naturally+in+us%3B+that+in+such+case+our+prayers+cannot+serve+us+as+means+to+obtain+the+thing+we+desire%3B+that+notwithstanding%2C+they+are+unto+God+most+acceptable+sacrifices+because+they+testify+we+desire+nothing+but+at+his+hands%2C+and+our+desires+we+submit+with+contentment+to+be+overruled+by+his+will%3B+and+in+general+they+are+not+repugnant+unto+the+natural+will+of+God+which+wishes+to+the+works+of+his+own+hands%2C+in+that+they+are+his+own+handiwork%2C+all+happiness%2C+although+perhaps+for+some+special+cause+in+our+own+particular%2C+a+contrary+determination+have+seemed+more+convenient.+Finally%2C+that+thus+to+propose+our+desires+which+cannot+take+such+effects+as+we+specify+shall+notwithstanding+otherwise+procure+us+his+heavenly+grace%2C+even+as+this+very+prayer+of+Christ+obtained+angels+to+be+sent+Him+as+comforters+in+his+agony.+And+according+to+this+example%2C+we+are+not+afraid+to+present+unto+God+our+prayers+for+those+things%2C+which+that+He+will+perform+unto+us%2C+we+have+no+sure%2C+nor+certain+knowledge%E2%80%A6+Such+prayers+of+the+Church+to+be+delivered+from+all+adversity+are+no+more+repugnant+to+any+reasonable+disposition+of+men%E2%80%99s+minds+towards+death%2C+much+less+to+that+blessed+patience+and+meek+contentment+which+saints+by+heavenly+inspiration+have+to+endure+%28what+cross+or+calamity+soever+it+pleases+God+to+lay+upon+them%29+than+our+Lord+and+Savior%E2%80%99s+own+prayer+before+his+passion+was+repugnant+unto+his+most+gracious+resolution+to+die+for+the+sins+of+the+whole+world.%E2%80%9D%0A%0A%E2%80%94+Richard+Hooker%2C+The+Works+of+Mr.+Richard+Hooker%E2%80%A6+in+Eight+Books+of+Ecclesiastical+Polity%E2%80%A6+%28London%3A+Newcomb%2C+1666%29%2C+bk.+5%2C+pp.+202-4&amp;url=https%3A%2F%2F5solasquotes.github.io%2Fquote%2F2971c85a78.html&amp;via=5Solas" target="_blank" rel="noopener">Share on X</a><a class="perma" href="../quote/2971c85a78.html">Permalink</a><a class="src" href="https://reformedbooksonline.com/on-the-human-soul/#:~:text=Now%20as%20man%E2%80%99s%20will%2C%20so%20the,the%20sins%20of%20the%20whole%20world&amp;text=Now%20as%20man%E2%80%99s%20will%2C%20so%20the%20will%20of&amp;text=die%20for%20the%20sins%20of%20the%20whole%20world" rel="noopener" target="_blank">Read it online · Reformed Books Online</a></div>

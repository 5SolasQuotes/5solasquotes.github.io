<main class="wrap"><figure class="quote" id="q-8b352127fe" data-kw="">
<blockquote><p>To this principle of contradiction or of identity is subordinated the principle of sufficient reason, which in its generality may be formulated thus: ‘Everything that is has its raison d’etre, in itself, if of itself it exists, in something else, if of itself it does not exist.’ But this generality must be understood in senses analogically different. First. [Formal cause] The characteristics of a thing, e.g.: a circle, have their raison d’etre in the essence (nature) of that thing. [In a siimlar way the sufficient reason for God is in Himself] Secondly. [Efficient cause] The existence of an effect has its raison d’etre in the cause which produces and preserves that existence, that is to say, in the cause which is the reason not only of the ‘becoming,’ but also of the continued being of that effect. Thus that which is being by participation has its reason of existence in that which is being by essence [namely God]. Thirdly. [Final cause] Means have their raison d’etre in the end, the purpose, to which they are proportioned. Fourthly, [Material cause] Matter is the raison d’etre of the corruptibility of bodies. This principle, we see, is to be understood analogically, according to the order in which it is found, whether that order is intrinsic (the nature of a circle related to its characteristics [or in something being material and corruptible]): or extrinsic (cause, efficient or final, to its effects). When I ask the reason why, says St. Thomas, I must answer by one of the four causes. Why has the circle these properties? By its intrinsic nature. Why is this iron dilated? Because it has been heated (efficient cause). Why did you come? For such or such a purpose. Why is man mortal? Because he is a material composite, hence corruptible. [Unfallen Adam was capable of dying though He would not have died by the providence of God if he had remained upright.] Thus the raison d’etre, answering the question ‘why’ (propter quid): is manifold in meaning, but these different meanings are proportionally the same, that is, analogically. We stand here at a central point. We see that the efficient cause presupposes the very universal idea of cause, found also in the final cause, and in formal cause, as well as in the agent. Thus the principle of sufficient reason had been formulated long before Leibnitz.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/reginald-garrigou-lagrange.html">Reginald Garrigou-Lagrange</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Reality: a Synthesis of Thomistic Thought</cite>, (n.p., 1946), ch. 4, ‘Intelligible Being &amp; First Principles’, pp. 24-25</span></figcaption>

</figure><figure class="quote" id="q-51661f2fec" data-kw="">
<blockquote><p>What did John Calvin (1509– 64) know of Thomas Aquinas’s (d. 1274) theology? Did he actually read the Angelic Doctor’s work, or is his knowledge of Aquinas a mediated knowledge? And in the end did he understand what he encountered?… The older scholarship was generally optimistic about Calvin’s firsthand familiarity with Aquinas’s work… I argue that when citing Thomas, Calvin was not engaging Aquinas through a firsthand reading of his work. Rather, he received a mediated knowledge of Thomas from secondary sources. Even more, the evidence suggests that the secondary lens arises from the nominalist school of thought and refracts Thomas’s position in a direction more according to this school, in which human merit plays a stronger role in explaining the doctrine of predestination than Thomas himself believes. In the end, I conclude that Aquinas is of little to no importance to Calvin, with Calvin having very little firsthand knowledge of the Angelic Doctor’s thought.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/charles-raith.html">Charles Raith</a></span><span class="wk"><span class="lbl">Work:</span> <cite>“Calvin &amp; Aquinas Reconsidered” in eds. Ballor, Gaetano &amp; Sytsma, Beyond Dordt &amp; De Auxiliis: the Dynamics of Protestant &amp; Catholic Soteriology in the Sixteenth &amp; Seventeenth Centuries</cite>, (Brill, 2019), pp. 19-35, p. 21</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/theology/faith-and-reason.html">Faith and Reason</a></span></div>

</figure><figure class="quote" id="q-595686e025" data-kw="">
<blockquote><p>Certainly [James] Arminius… saw that… the novel Pseudo-philosophy of the Jesuits was being confounded with true metaphysics and the Thomistic Scholastics… His disciples—when they perceived that the little pseudo-philosophical reasonings, by which at the beginning, and almost alone, they had assailed the received truth, were no longer a terror but a derision, and that their own theology daily grew worse—began strenuously to declaim against the philosophy of the schools, especially the metaphysical… Solid ratiocinations they call Scholastic subtleties: by this name they pretext their fault. … But [the Arminian] Vorstius, in his writings… in place of the philosophy of Aristotle and of the Scholastics—rightly emended in the reformed schools and accommodated to the truth of religion—substitutes the metaphysics of Taurellus, conjoined with the declamations of Ramus (which they call schools), with Bodin’s Theater [of Nature] from time to time employed… Let now the metaphysics and Triumphus of Taurellus be compared, with some things of Bodin added, and the declamations of Ramus, and let it be judged whether by their help the Atheistic, Epicurean, Ethnic [pagan], Judaic, Muhammadan, Enthusiastico-Libertine, Vorstian, Socinian, etc. [errors] can better be refuted than out of Thomas and the other Scholastics, and the more recent disciples of these, Suárez, Fonseca, etc. Certainly of these it may be said what was once said of Origen: where good, none better; where bad, none worse. When they are not hindered by the prejudices and authority of the corrupted religion and church of their own [communion], they render truly useful service (certain errors, and things too curious, excepted)—e.g. in the defense of the Trinity, of the divine attributes, of Christ the θεάνθρωπος [God-man], of the creation of the world, of the resurrection, of the general theses concerning the end of man, concerning the affections, faculties, etc. Hence it is that our most excellent theologians not unwillingly plow with their heifer [i.e. make use of them]—e.g. Martyr, Zanchi, Danaeus, Franciscus Junius, Ferrius, Molinaeus, Perkins, Twisse, Rutherford, etc. And the [Protestant] philosophers have, in emulation, out of the same—and chiefly out of Suárez, among the more recent—composed their own metaphysics: e.g. Cornelius Martinius, Jacobus Martinius, Combachius, Werenbergius, Scheibler, Jachaeus, Rutgersius, Burgersdicius, Senguerdius, etc. But the virtues and vices of Scholastic Theology we have explained ex professo [expressly, professedly] in the disputation On Scholastic Theology.</p></blockquote>

<div class="actions"><button class="copy" data-copy="“Certainly [James] Arminius… saw that… the novel Pseudo-philosophy of the Jesuits was being confounded with true metaphysics and the Thomistic Scholastics… His disciples—when they perceived that the little pseudo-philosophical reasonings, by which at the beginning, and almost alone, they had assailed the received truth, were no longer a terror but a derision, and that their own theology daily grew worse—began strenuously to declaim against the philosophy of the schools, especially the metaphysical… Solid ratiocinations they call Scholastic subtleties: by this name they pretext their fault. … But [the Arminian] Vorstius, in his writings… in place of the philosophy of Aristotle and of the Scholastics—rightly emended in the reformed schools and accommodated to the truth of religion—substitutes the metaphysics of Taurellus, conjoined with the declamations of Ramus (which they call schools), with Bodin’s Theater [of Nature] from time to time employed… Let now the metaphysics and Triumphus of Taurellus be compared, with some things of Bodin added, and the declamations of Ramus, and let it be judged whether by their help the Atheistic, Epicurean, Ethnic [pagan], Judaic, Muhammadan, Enthusiastico-Libertine, Vorstian, Socinian, etc. [errors] can better be refuted than out of Thomas and the other Scholastics, and the more recent disciples of these, Suárez, Fonseca, etc. Certainly of these it may be said what was once said of Origen: where good, none better; where bad, none worse. When they are not hindered by the prejudices and authority of the corrupted religion and church of their own [communion], they render truly useful service (certain errors, and things too curious, excepted)—e.g. in the defense of the Trinity, of the divine attributes, of Christ the θεάνθρωπος [God-man], of the creation of the world, of the resurrection, of the general theses concerning the end of man, concerning the affections, faculties, etc. Hence it is that our most excellent theologians not unwillingly plow with their heifer [i.e. make use of them]—e.g. Martyr, Zanchi, Danaeus, Franciscus Junius, Ferrius, Molinaeus, Perkins, Twisse, Rutherford, etc. And the [Protestant] philosophers have, in emulation, out of the same—and chiefly out of Suárez, among the more recent—composed their own metaphysics: e.g. Cornelius Martinius, Jacobus Martinius, Combachius, Werenbergius, Scheibler, Jachaeus, Rutgersius, Burgersdicius, Senguerdius, etc. But the virtues and vices of Scholastic Theology we have explained ex professo [expressly, professedly] in the disputation On Scholastic Theology.”

— Gisbertus Voetius, Problems on God, pt. 4 in Select Theological Disputations, pt. 5 (Utrecht, 1669) tr. AI by Roman Prestarri Latin">Copy</button><a class="share" href="https://x.com/intent/post?text=%E2%80%9CCertainly+%5BJames%5D+Arminius%E2%80%A6+saw+that%E2%80%A6+the+novel+Pseudo-philosophy+of+the+Jesuits+was+being+confounded+with+true+metaphysics+and+the+Thomistic+Scholastics%E2%80%A6+His+disciples%E2%80%94when+they+perceived+that+the+little+pseudo-philosophical+reasonings%2C+by+which+at+the+beginning%2C+and+almost+alone%2C+they+had+assailed+the+received+truth%2C+were+no+longer+a+terror+but+a+derision%2C+and+that+their+own+theology+daily+grew+worse%E2%80%94began+strenuously+to+declaim+against+the+philosophy+of+the+schools%2C+especially+the+metaphysical%E2%80%A6+Solid+ratiocinations+they+call+Scholastic+subtleties%3A+by+this+name+they+pretext+their+fault.+%E2%80%A6+But+%5Bthe+Arminian%5D+Vorstius%2C+in+his+writings%E2%80%A6+in+place+of+the+philosophy+of+Aristotle+and+of+the+Scholastics%E2%80%94rightly+emended+in+the+reformed+schools+and+accommodated+to+the+truth+of+religion%E2%80%94substitutes+the+metaphysics+of+Taurellus%2C+conjoined+with+the+declamations+of+Ramus+%28which+they+call+schools%29%2C+with+Bodin%E2%80%99s+Theater+%5Bof+Nature%5D+from+time+to+time+employed%E2%80%A6+Let+now+the+metaphysics+and+Triumphus+of+Taurellus+be+compared%2C+with+some+things+of+Bodin+added%2C+and+the+declamations+of+Ramus%2C+and+let+it+be+judged+whether+by+their+help+the+Atheistic%2C+Epicurean%2C+Ethnic+%5Bpagan%5D%2C+Judaic%2C+Muhammadan%2C+Enthusiastico-Libertine%2C+Vorstian%2C+Socinian%2C+etc.+%5Berrors%5D+can+better+be+refuted+than+out+of+Thomas+and+the+other+Scholastics%2C+and+the+more+recent+disciples+of+these%2C+Su%C3%A1rez%2C+Fonseca%2C+etc.+Certainly+of+these+it+may+be+said+what+was+once+said+of+Origen%3A+where+good%2C+none+better%3B+where+bad%2C+none+worse.+When+they+are+not+hindered+by+the+prejudices+and+authority+of+the+corrupted+religion+and+church+of+their+own+%5B

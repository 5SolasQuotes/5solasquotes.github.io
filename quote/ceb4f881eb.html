<main class="wrap"><figure class="quote" id="q-ceb4f881eb" data-kw="">
<blockquote><p>IT is an old custom, and confirmed by examples of holy Fathers that the professors of good Arts and learning, use to dedicate the fruits of their studies, either to their friends, or to men of honour and authority, whereby to procure either their favour and good will, or else to make them defenders of their labours and pains. And whereas I have thought good (most honourable Lords and fathers) to dedicate my labours upon the Acts of the Apostles chiefly unto you: many and weighty causes have moved me thereunto. For privately your liberality toward me, required the same, and publicly the continual care that you have to profit your country, and religion in general, enforced me to shew mine allegiance &amp; good heart, towards you, with some duty of gratitude &amp; thankfulness.

Whereby that fervent desire that you bear unto godliness might be set forth with the public testimony of our Church, whose example now many years, divers excellent states of common weals [commonwealths or countries], have not been ashamed to imitate. Howbeit, to tell you the plain truth, the chief cause of this my doing was, for that I perceived the matter of this book, and the consideration thereof appertained unto you principally: For in this book [of Acts] is contained, a most absolute pattern and form of Christ’s universal Church, which it behoveth all such as are in authority &amp; bear rule, well to know and understand.

For those men that say temporal magistrates have nothing to do but with temporal matters, and would have them utterly to abstain from intermeddling in ecclesiastical affairs, are in no wise to be regarded? which men seem to me to be of opinion, that they would have common weals exempt from God’s providence, without the which the very Gentiles perceived they could not stand or be preserved. And who knoweth not that sentence of the Godly and princely Prophet: Except the Lord keep the city, the watchman waketh but in vain. Which also exhorteth kings and Princes to suffer themselves to be instructed in the word of God, and to kiss and reverence Jesus Christ the son of God.

But to what end should kings be taught the word, if there be no use of the same, in the administration of the common weal? And how shall they kiss or reverence Christ, if they neglect his Church, which he esteemeth dearer than the apple of his eye, yea, than his life? And how can they neglect that body, whereof if they be not members under Christ their head, they cannot be saved? We must hearken rather unto Esaias, who prophesying of Christ’s Church, among other things saith. Kings and Queens shall be thy Nurses. In which words, he seemeth not so much to comfort the Church as to set forth the office and dignity of Kings and Rulers, which chiefly appeareth in this, that God doth vouchsafe to commit unto them the care of his Church, which he hath redeemed with the blood of his son.

Indeed we must confess that God hath herein no need of man’s help, if he would use his absolute &amp; peerless power. Neither deny we that many times Churches are increased and defended rather by the power and unspeakable counsel of God, than by the industry of man. But this cometh not so to pass because God disalloweth the care and duty of Magistrates, but that it might appear how all praise and glory, is to be ascribed to him only, because no man should think religion depended more upon the will of man, than upon God’s providence.

In the mean season such is the goodness of God, that he doth vouchsafe to take men to be his coadjutors &amp; helpers, by their ministry to regenerate his elect people through the word, &amp; defendeth the same under godly magistrates, against the rage of this world, in the middle of present dangers on every side, that they may live in peace &amp; rest, as far forth as is convenient for their faith and salvation. And that this is the will of God, not only the scriptures testify, but the whole consent of all nations doth likewise prove the same. Certes in that golden world of the Patriarchs, we read that one man was both king and priest. But when God afterward under the law would have these offices severed, yet ordained he a great conjunction and amity between the kings and priests, least either the kings should reign without religion, or the Priests by them not cared for, and regarded, might at the pleasure of wicked men be misused.</p></blockquote>

</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-a5f228bd85" data-kw="">
<blockquote><p>That truth is, that Christ is the King of kings, as well as the Head of the Church. He claims authority in the kingdoms of men, as well as among his own peculiar people. The Civil Magistrate, then, as the servant of Christ, has something to do with the Church. It is not merely his duty to associate himself with it as a member, and to subject himself to its discipline, but to defend and uphold it by the gifts of power and influence which have been conferred upon him. It is his duty further, to take order that all things in the Church be done according to the Word of God. …

It is not theirs to bear the ark. God hath appointed others to that office. But it is theirs, by the exercise of their constitutional functions, to prevent the ark from being touched by unhallowed hands. It is theirs to receive the testimony of Scripture, to bow themselves to its dictates, and to take order that they be obeyed.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/william-wilson.html">William Wilson</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Statement of the Scriptural Argument Against Patronage</cite>, (Edinburgh: John Johnstone, 1842), p. 36.</span></figcaption>

<blockquote><p>2. Calvin thinks their vow not lawful. Bucanus, Polyander and Willet think it the lawful vow of the Nazarites, commanded [in] Num. 6. What then? if by God’s Law of the Nazarites, they abstained from wine and the Passover? God is above his own Law… 3. How prove ye, they abstained from the Passover? being so divine a law, might not their vow suffer an exception for a greater law in eating the Passover? I think it might, for in case of necessity they [the Rechabites] came and dwelt at Jerusalem for fear of the army of the Chaldeans, Jer. 35:11, and yet their vow was to dwell in tents.</p></blockquote>

<blockquote><p>Every chief householder hath Curam animarum, the charge of the souls of his family (not properly pastoral, but very like it.) He must give an account of the souls, of his Wife, Children, Servants, as well as the Magistrate of the souls of his Subjects, Ezek. 34.10. or the Minister of the souls of his people, Ezek. 2.18. It concerns him therefore very nearly to endeavour to make them Religious, which is the only way to save their souls.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/daniel-cawdrey.html">Daniel Cawdrey</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Family reformation promoted. In a sermon on Joshua, chap. 24. ver. 15.</cite>, (London: John Wright, 1656), pp 23-24.</span></figcaption>

</figure><figure class="quote" id="q-5a6cb653be" data-kw="">
<blockquote><p>When, in 1661, good James Guthrie was brought upon the scaffold, and about to suffer, he put aside the napkin which covered his face and said, “The Covenants, the Covenants will yet be Scotland’s reviving.” He was a true prophet. Under that inspiriting Ensign, and strengthened from on high, our “Church in the wilderness” nobly held out during all that long age of darkness and blood, which disgraced the reigns of the Second Charles and the Second James, till King William came, a good Samaritan, to relieve the three afflicted nations, afflicted indeed — robbed? wounded, exanimated, as having fallen among thieves.

When Britain came to herself she took care to guard against a repetition of priestly enormities, by passing laws under the shadow of which we have ever since reposed, thrived, and become the chief of nations. Whether, now that the happy policy inaugurated at the Revolution — a policy of utter antagonism to Rome — has been not only altered but reversed, we shall still bask in sunshine, seems vastly doubtful.

Should our statesmen and parliaments, however, persevere in their new policy, should they continue to disregard the blood-bought lessons of history, and should they still break that law which plainly prohibits them from countenancing idolatry on pain of being partakers of “the Babylonian woe,” our decline and destruction are inevitable. Nor can the time be distant when the friends of order and religion shall be compelled to buckle on their armour anew, and go forth under their ancient Standard.</p></blockquote>

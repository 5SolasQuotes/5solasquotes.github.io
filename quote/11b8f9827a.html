<main class="wrap"><figure class="quote" id="q-11b8f9827a" data-kw="">
<blockquote><p>For example, someone observing in his church an excessive zeal for this world and a lukewarmness toward spiritual piety might undertake an argument concerning a heavenly manner of life. A suitable text for the selected argument should: (1) be taken from only the canonical books of Scripture, which are the most effective in convicting the conscience; (2) not be excessively prolix, so that the time for the argument not be snatched away by the first by a rather prolix explanation of the words; and (3) not be excessively brief, so that the preacher not make his argument less clearly and plainly, and even produce in his hearers a suspicion of affected brevity.

For example, an argument chosen regarding a heavenly manner of life could be built upon the text of Colossians 3:1: “And so if you have been resurrected with Christ, seek the things above, where Christ is, seated at the right hand of God.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/petrus-van-mastricht.html">Petrus van Mastricht</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Best Method of Preaching in Theoretical-Practical Theology Volume 1: Prolegomena</cite></span></figcaption>
<div class="meta"><span class="t"><a href="../topics/worship.html">Worship</a></span></div>

</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-0e132c236f" data-kw="">
<blockquote><p>There was a certain Count of your [Reformed] confession who possessed common jurisdiction in a certain church with a certain Prince of our [Lutheran] religion. Therefore since the Associate was judging that he [the reformed Count] had more of right in that church, he made sure that the altar was destroyed and that a table be built [for the Lord’s Supper] in the temple [church building]. The Prince found out later about this, and ordered that the table be removed and an altar be constructed again. The Count in return took care a second time in return that the altar be destroyed, and the table restored. The Prince likewise a second time ordered that the table be taken away and the altar restored. I do not know whether this happened a third time. But the [reformed] Count later heeded the [Lutheran] Prince’s strictness, and left off from his course, such that the altar remained in the temple in place of the table.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/jacob-andreae.html">Jacob Andreae</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Lutheranism vs. Calvinism</cite>, (Concordia Publishing House, 2017), ch. 4, ‘On the Reformation of Temples, Images &amp; Organs’, p. 497 Andreae (1528–1590) was a leading Lutheran theologian debating Theodore Beza.</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/worship/ceremonies-and-things-indifferent.html">Ceremonies and Things Indifferent</a></span></div>

<blockquote><p>Reason 2. Because nothing is required of them unfitting or burdensome, but that once every week, in convenient time and place, every one would contribute according to that measure wherewith God had blessed him: And the manner is plain, whereby the collection might be made publicly every Lord’s Day, and yet every one should lay it by himself, i. e. no man knowing the sum: We may imagine that they imitated the example of the ancient Church, a bored Chest being placed in the entrance to the house where they met for the Worship of God.</p></blockquote>

<blockquote><p>5. They [papists] likewise say that some countries have no wine [in order to justify their witholding the cup from lay-persons]. I answer also that there are countries that have no bread; and that if men can carry the one thither, they may carry the other also: or if that be impossible, it is better in such a country to use that which serves there instead of bread and wine, rather than to be wholly or in part deprived of the sacrament… Add hereunto that if some countries cannot have wine for the sacrament, it follows not but that they may be furnished from an infinite number of other provinces where they may have wine.</p></blockquote>

<blockquote><p>…the Rejoinder [of an opponent] brings abundance of instances [for human ceremonies in worship though they had been idolatrously abused] out of his old store: 1. Kneeling, bowing, prostrating, lifting up of the eyes, and of the hands, shouting, and dancing for joy [which are a form of natural worship]. But these we absolutely deny to be human inventions. The Rejoinder knew this and therefore by prevention replies: to say these are not human inventions because they partly spring out of natural light is as much as to say they are not because they are human inventions: for what are human inventions, but such as spring out of natural light? What? the cross and surplice; the cornered-cap and tippet; the bishop’s rochet and cope, with a thousand such like; which whoesoever will equal, or (in regard of naturalness and willfull invention) liken unto lifting up of eyes and hands, etc. in prayer, must for that time lay aside right natural invention and judgment… I think it would trouble all the graduates in England to find out that natural light from whence bachelors of art, maisters of art, bachelors and doctors of divinity received their several kinds of hoods, even as much as to find out light of nature for all the several habits of monks. But (says the Rejoynder) all came from natural light, better or worse, more or less agitated, just as men’s long hair and women’s short, which nature itself teaches to be uncomely (according to the apostle’s light [1 Cor. 11:14]) came from the light of nature. It is natural to a child, for to suck the dug and after to put the hand to the mouth; and after to creep or go: Is it like natural to sound a certain distinct sound upon a trumpet? to dance a certain round, or galliard after every fiddle? It is natural for a child to signify his discerning of those that it is used to by some such sound as dad and mam, but not to make verses in a certain number.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/william-ames.html">William Ames</a></span><span class="wk"><span class="lbl">Work:</span> <cite>A Fresh Suit Against Human Ceremonies in God’s Worship, ‘An Addition of the two last reasons of the former reply’</cite>, … (1633), pp. 495-96</span></figcaption>

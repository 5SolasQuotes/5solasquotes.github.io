<main class="wrap"><figure class="quote" id="q-fbd6ea6f9c" data-kw="">
<blockquote><p>Fiftly, works though otherwise in themselves servile, requisite to God’s worship, as travelling to Church, Lk. 6:6, or riding diverse miles off to the prophets of God, if need be, 2 Kings 4:22-23… If any call this profaning God’s Sabboth, he must know it is blameless, Mt. 12:5.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/william-fenner.html">William Fenner</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Spiritual Man’s Directory… (London, 1648), Q. 74</cite>, p. 37</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/worship/the-lords-day.html">The Lord&#x27;s Day</a></span></div>

</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-16bd4886a2" data-kw="">
<blockquote><p>And in the seventh chapter [Jn. 7:23], He defends this fact of his, saying, ‘If a man upon the Sabbath receive circumcision, that the law of Moses should not be broken; be ye angry with Me, because I haue made a man every whit whole on the Sabbath day?’ If the law of circumcision do bind men to minister and receive it upon the Sabbath, then much more does the law of love bind men to show mercy upon the Sabbath, seeing that it is appointed of God, not to hinder us from, but to further us in all his works, among which the relieving of them that be in necessity, is one of the chief and principal. And as the Lord Jesus Christ came not to destroy the law, but to fulfill it, so He observed it very carefully in this point, and being most full of compassion, did declare it abundantly, by taking all oportunity to succour them that were in misery, even upon the Sabbath, as the fittest time for it.</p></blockquote>

</figure><figure class="quote" id="q-284985c76e" data-kw="">
<blockquote><p>But unto the place which the Lord your God shall choose out of all your tribes to put his name there, even unto his habitation shall ye seek, and thither thou shalt come: And thither ye shall bring your burnt offerings… And there ye shall eat before the Lord your God, and ye shall rejoice in all that ye put your hand unto, ye and your households, wherein the Lord thy God hath blessed thee… But thou must eat them before the Lord thy God in the place which the Lord thy God shall choose, thou, and thy son, and thy daughter, and thy manservant, and thy maidservant, and the Levite that is within thy gates: and thou shalt rejoice before the Lord thy God in all that thou puttest thine hands unto.</p></blockquote>

</figure><figure class="quote" id="q-ea6137d763" data-kw="">
<blockquote><p>We think to deny the lawfulness of public fasting on the Lord’s day, as if the Christian Sabbath were a day only of spiritual feasting and rejoicing, because that day Christ ended the work of redemption and second creation, is a wronging of the Christian Sabbath, which is ordained for the whole public worship of God, joying, sorrowing for sin, learning God’s will in all and every point, as the Jewish Sabbath was not ordained only for meditation on the work of creation, but for worships of all kinds: The worship of this day, Acts 20:7, is as large as preaching, and being in the Spirit, on the Lord’s day, and seeing the visions of God, Rev. 1:10-12, and the whole ordinary public worship. It is then too narrow to restrict all our Sabbath-worship to one single act of festival rejoicing.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/samuel-rutherford.html">Samuel Rutherford</a></span><span class="wk"><span class="lbl">Work:</span> <cite>A Peaceable &amp; Temperate Plea for Paul’s Presbytery in Scotland, ch. 20, Article 7</cite></span></figcaption>
<div class="meta"><span class="t"><a href="../topics/worship/the-lords-day.html">The Lord&#x27;s Day</a></span></div>

</figure><figure class="quote" id="q-dc547a7a6f" data-kw="">
<blockquote><p>2. The duties of worship to be attended by us on this Day, are either Natural or Instituted… 1. The duties of natural worship, are such as are suited to the nature of man and flow from the great end he was made for, viz. actively to glorify God. And therefore the light of Nature directs men to practice them on all occasions, certainly then these are fitted for the Sabbath, according to the end and usefulness of it… 2. The duties of instituted worship. And under these are contained all the positive ordinances and sacred ceremonies of God’s appointment…</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/samuel-willard.html">Samuel Willard</a></span><span class="wk"><span class="lbl">Work:</span> <cite>A Complete Body of Divinity… (Boston, 1726), Sermon 172, Q. 60</cite>, pp. 584-88</span></figcaption>

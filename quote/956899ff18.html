<main class="wrap"><figure class="quote" id="q-956899ff18" data-kw="">
<blockquote><p>We have already advertised that this opinion is falsely laid upon us: That God does draw a man unresistibly [being unable to resist]. We only say that the elect, although they may resist a long time, yet at length they obey God calling, and their voluntary conversion is wrought certainly and infallibly, and that it cannot come to pass that they should never be converted, or being converted, that they should finally fall away and the grace of God should be at length extinguished, and be finally overcome by the resistance of the flesh.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/peter-du-moulin.html">Peter Du Moulin</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Anatomy of Arminianism… (1619; London, 1635)</cite>, p. 492</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/effectual-calling/efficacious-grace.html">Efficacious Grace</a></span></div>

</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-fb99bb1495" data-kw="">

</figure><figure class="quote" id="q-d1ee3d3ea9" data-kw="against moral suasion">
<blockquote><p>Hence of two to whom the same grace is offered, if one is converted while the other remains unbelieving, the reason is not to be found (according to them) in the grace (which is the same), but in the disposition of the subject or man, because the one draws the bolt, the other does not (i.e., one rejects the grace which the other admits). Thus what they seem to give largely with one hand (preaching that the beginning, progress and complement of all our good is from grace), they secretly steal away with the other, maintaining that the mode of that operation is such that man can always resist it.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/francis-turretin.html">Francis Turretin</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Institutes of Elenctic Theology</cite>, 15.6.3</span></figcaption>

<blockquote><p>12. Therefore that grace does not inflict force upon us, whether resistible or irresistible, neither resistibly nor irresistibly – whichever of these you might say, you could seem to be saying something harmful and hostile. But that grace, according to the testimony of the same priest, brings us peace, salvation, and mercy.</p></blockquote>

<div class="meta"><span class="t"><a href="../topics/effectual-calling/efficacious-grace.html">Efficacious Grace</a></span></div>

</figure><figure class="quote" id="q-1aa05b143d" data-kw="">
<blockquote><p>20. In what sense is grace irresistible? It must be remembered that the true Christian is the subject at the same time of those moral and mediate influences of grace upon the will, common to him and to the unconverted, and also of those special influences of grace within the will, which are certainly efficacious. The first class of influences Christians may, and constantly do resist, through the law of sin remaining in their members. The second class of influences are certainly efficacious, but are neither resistible nor irresistible, because they act from within and carry the will spontaneously with them. It is to be lamented that the term irresistible grace has ever been used, since it suggests the idea of a mechanical and coercive influence upon an unwilling subject, while, in truth, it is the transcendent act of the infinite Creator, making the creature spontaneously willing.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/a-a-hodge.html">A. A. Hodge</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Outlines of Theology new ed. enlarged (London: Nelson, 1879), ch. 28, ‘The Application of Redemption…’</cite>, pp. 451-52</span></figcaption>

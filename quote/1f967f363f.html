<main class="wrap"><figure class="quote" id="q-1f967f363f" data-kw="">
<blockquote><p>All writings of men, according to the truth of the scriptures, have some divinity in them, inasmuch as they have of truth, which is a divine thing. Yet the holy scriptures are by way of excellency attributed to God, for they are immediately inspired of God. Therefore Peter saith that ‘the scriptures came not in old time by the will of man, but holy men spake as they were moved by the Holy Ghost,’ 2 Peter 1.21.

God by his Spirit, as it were, acted the part of the soul in the prophets and apostles; and they did no more but utter what the Spirit conceived. The Holy Ghost inspired the matter and the words, and they were but tongues and pens to speak and write it unto the people; there needed no debate, no search in their own minds for the truth, no inquisition for light; but light shined upon their souls so brightly, so convincingly, that it put it beyond all question that it was the mind and voice of God.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/hugh-binning.html">Hugh Binning</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Common Principles of the Christian Religion, Clearly Proved, and Singularly Improved. Or, A Practical Catechism</cite>, (1672) in The Works of Hugh Binning, ed. James Cochrane (3 vols, Edinburgh: William Whyte, 1839), 1: 30.</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/holy-scripture/divine-authority.html">Divine Authority</a></span></div>

</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-f03dd13181" data-kw="">
<blockquote><p>Thus, intellect and reason may not be considered as a basis for, as a rule to go by, or as a touchstone, in determining whether that which God reveals in His Word is truth. We believe this solely … because God declares it to be so. Reason must surrender itself to the Word; the Word must never surrender itself to reason. Reason is to Scripture what Hagar was to Sarah; it is the servant and not the master.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/wilhelmus-a-brakel.html">Wilhelmus à Brakel</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Christian’s Reasonable Service</cite>, vol. 1, ch. 2, pp. 59–60</span></figcaption>

</figure><figure class="quote" id="q-462fd7899f" data-kw="">
<blockquote><p>V. The subscriptio [to the letter to the Colossians] indicates the ministerial cause through which the Holy Spirit, as the author and primary authority, has used this epistle. That [ministerial] cause is Paul.

VI. It is described by the added clause, namely that he is an Apostle of Jesus Christ, that is, an Ambassador and Teacher of the Church, immediately taught by Christ Himself through revelation and sent to proclaim the Gospel of the Messiah exhibited everywhere in the whole world and to establish the foundation of the Church, having this testimony from God, that he has not erred in doctrine.</p></blockquote>

</figure><figure class="quote" id="q-ec738a4a8b" data-kw="authority">
<blockquote><p>The authority of Scripture (concerning which we here inquire) is nothing else than the right and dignity of the sacred books, on account of which they are most worthy of faith with regard to those things which they propose to be believed and of our obedience in those things which they command us to omit or to do. The divine and infallible truth of these books (which have God for their author) is the foundation because he has the highest right to bind men to faith and duty. But this truth may be either intrinsic or extrinsic. The former is the credibility (axiopistia) in itself of the word which is always equal and consistent with itself, whether it has the testimony of men or not. The latter is the estimation or judgment of men in relation to the Scriptures, which is different as the subjects are different. Of history and of rule.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/francis-turretin.html">Francis Turretin</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Institutes of Elenctic Theology</cite>, 2.4.3</span></figcaption>

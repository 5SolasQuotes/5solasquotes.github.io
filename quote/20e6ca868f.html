<main class="wrap"><figure class="quote" id="q-20e6ca868f" data-kw="">
<blockquote><p>This obedience of the Son was superior to all the justice of the Law. For Adam also, if he willed, could have remained in the righteousness of the Law. And to the degree that the curse was owed for every sin of the elect, to the same degree he had to fulfill all righteousness without any complaint, not even all the Angels were able to do this. Therefore, this obedience of the Son was not only regarding the righteousness of the Law, such as Adam received in creation, and such as the Law required of him, but also it exceeded the righteousness of all the Angels.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/caspar-olevianus.html">Caspar Olevianus</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Ad Galatas Notae</cite>, (Geneva, 1578), 57.</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/the-covenant-of-works.html">The Covenant of Works</a></span></div>

</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-1b332b9bae" data-kw="">
<blockquote><p>Canon VII: As all his works were known unto God from eternity, (Acts 15:18), so in time, according to his infinite power, wisdom, and goodness, he made man, the glory and end of his works, in his own image, and, therefore, upright, wise, and just. Having created man in this manner, he put him under the Covenant of Works, and in this Covenant freely promised him communion with God, favor and life, if indeed he acted in obedience to his will. Canon VIII: Moreover that promise connected to the Covenant of Works was not a continuation only of earthly life and happiness but the possession especially of eternal and celestial life, a life namely, of both body and soul in heaven, if indeed man ran the’ course of perfect obedience, with unspeakable joy in communion with God. For not only did the Tree of Life prefigure this very thing unto Adam, but the power of the law, which, being fulfilled by Christ, who went under it in our place, awards to us nothing other than celestial life in Christ who kept the same righteousness of the law. The power of the law also threatens man with both temporal and eternal death. Canon IX: Wherefore we can not agree with the opinion of those who deny that a reward of heavenly bliss was offered to Adam on condition of obedience to God. We also do not admit that the promise of the Covenant of Works was any thing more than a promise of perpetual life abounding in every kind of good that can be suited to the body and soul of man in a state of perfect nature, and the enjoyment thereof in an earthly Paradise. For this also is contrary to the sound sense of the Divine Word, and weakens the power of the law considered in itself. Canon X: God entered into the Covenant of Works not only with Adam for himself, but also, in him as the head and root with thc whole human race. Man would, by virtue of the blessing of the nature derived from Adam, inherit also the same perfection, provided he continued in it. So Adam by his sorrowful fall sinned and lost the benefits promised in the Covenant not only for himself, but also for the whole human race that would be born by the flesh. We hold, therefore, that the sin of Adam is imputed by the mysterious and just judgment of God to all his posterity. For the Apostle testifies that “in Adam all sinned, by one man’s disobedience many were made sinners” (Rom 5:12,19) and “in Adam all die” (I Cor 15:21–22). But there appears no way in which hereditary corruption could fall, as a spiritual death, upon the whole human race by the just judgment of God, unless some sin of that race preceded, incurring the penalty of that death. For God, the most supreme Judge of all the earth, punishes none but the guilty.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/j-h-heidegger-and-francis-turretin.html">J. H. Heidegger and Francis Turretin</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Helvetic Consensus Formula</cite>, (1675)</span></figcaption>

</figure><figure class="quote" id="q-cba784bf7e" data-kw="">
<blockquote><p>According to the Westminster Confession of Faith, Scripture thinks of man as a covenant being. It tells us that man was originally placed on earth under the terms of the covenant of works. It informs us further that man broke this covenant of works and that God was pleased to carry through his aims with the covenant of works by means of the covenant of grace. Thus Scripture may be said to be the written expression of the provisions of God’s covenantal relationship with man. The Confession further sets forth the Protestant doctrine of Scripture under the four heads of its necessity, its authority, its sufficiency and its perspicuity. The necessity of Scripture lies in the fact that man has broken the covenant of works. He therefore needs the grace of God. There is no speech or manifestation of grace in nature.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/cornelius-van-til.html">Cornelius Van Til</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Christian Apologetics</cite>, 2nd ed. (Philiipsburg, NJ: The Presbyterian and Reformed Publishing Company, 2003).</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/the-covenant-of-works.html">The Covenant of Works</a></span></div>

</figure><figure class="quote" id="q-762b7e58fd" data-kw="">
<blockquote><p>We can never state our thoughts aright in this matter, unless we have a clear apprehension of, and satisfaction in, the introduction of grace by Jesus Christ into the whole of our relation unto God, with its respect unto all parts of our obedience. There was no such thing, nothing of that nature or kind, in the first constitution of that relation and obedience by the law of our creation. We were made in a state of immediate relation unto God in our own persons, as our creator, preserver, and rewarder. There was no mystery of grace in the covenant of works. No more was required unto the consummation of that state but what was given us in our creation, enabling us unto rewardable obedience. “Do this, and live,” was the sole rule of our relation unto God. There was nothing in religion originally of that which the gospel celebrates under the name of the grace, kindness, and love of God, whence all our favourable relation unto God doth now proceed, and whereinto it is resolved; nothing of the interposition of a mediator with respect unto our righteousness before God, and acceptance with him;—which is at present the life and soul of religion, the substance of the gospel, and the centre of all the truths revealed in it.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/john-owen.html">John Owen</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Works of John Owen</cite>, ed. William H. Goold, vol. 5 (Edinburgh: T&amp;T Clark, n.d.), 44–45.</span></figcaption>

</figure><figure class="quote" id="q-91df145c0c" data-kw="">
<blockquote><p>This statement does not rest upon any express declaration of the Scriptures. It is, however, a concise and correct mode of asserting a plain Scriptural fact, namely, that God made to Adam a promise suspended upon a condition, and attached to disobedience a certain penalty. This is what in Scriptural language is meant by a covenant, and this is all that is meant by the term as here used. Although the word covenant is not used in Genesis, and does not elsewhere, in any clear passage, occur in reference to the transaction there recorded, yet inasmuch as the plan of salvation is constantly represented as a New Covenant, new, not merely in antithesis to that made at Sinai, but new in reference to all legal covenants whatever, it is plain that the Bible does represent the arrangement made with Adam as a truly federal transaction. The Scriptures know nothing of any other than two methods of attaining eternal life: the one that which demands perfect obedience, and the other that which demands faith. If the latter is called a covenant, the former is declared to be of the same nature. It is of great importance that the Scriptural form of presenting truth should be retained. Rationalism was introduced into the Church under the guise of a philosophical statement of the truths of the Bible free from the mere outward form in which the sacred writers, trained in Judaism, had presented them. On this ground the federal system, as it was called, was discarded. On the same ground the prophetic, priestly, and kingly offices of Christ were pronounced a cumbrous and unsatisfactory form under which to set forth his work as our Redeemer. And then the sacrificial character of his death, and all idea of atonement were rejected as mere Jewish drapery. Thus, by theory of accommodation, every distinctive doctrine of the Scriptures was set aside, and Christianity reduced to Deism. It is, therefore, far more than a mere matter of method that is involved in adhering to the Scriptural form of presenting Scriptural truths. God then did enter into a covenant with Adam. That covenant is sometimes called a covenant of life, because life was promised as the reward of obedience. Sometimes it is called the covenant of works, because works were the condition on which that promise was suspended, and because it is thus distinguished from the new covenant which promises life on condition of faith. …The condition of the covenant made with Adam is said in the symbols of our church to be perfect obedience. That that statement is correct may be inferred (1.) From the nature of the case and from the general principles clearly revealed in the word of God. Such is the nature of God, and such the relation which He sustains to his moral creatures, that sin, the transgression of the divine law, must involve the destruction of the fellowship between man and his Creator, and the manifestation of the divine displeasure. The Apostle therefore says, that he who offends in one point, who breaks one precept of the law of God, is guilty of the whole. (2.) It is everywhere assumed in the Bible, that the condition of acceptance under the law is perfect obedience. “Cursed is every one who continueth not in all things written in the book of the law to do them.” This is not a peculiarity of the Mosaic economy, but a declaration of a principle which applies to all divine laws. (3.) The whole argument of the Apostle in his epistles to the Romans and to the Galatians, is founded on the assumption that the law demands perfect obedience. If that be not granted, his whole argument falls to the ground. The specific command to Adam not to eat of a certain tree, was therefore not the only command he was required to obey. It was given simply to be the outward and visible test to determine whether he was willing to obey God in all things. Created holy, with all his affections pure, there was the more reason that the test of his obedience should be an outward and positive command; something wrong simply because it was forbidden, and not evil in its own nature. It would thus be seen that Adam obeyed for the sake of obeying. His obedience was more directly to God, and not to his own reason. The question whether perpetual, as well as perfect obedience was the condition of the covenant made with Adam, is probably to be answered in the negative. It seems to be reasonable in itself and plainly implied in the Scriptures that all rational creatures have a definite period of probation. If faithful during that period they are confirmed in their integrity, and no longer exposed to the danger of apostasy. Thus we read of the angels who kept not their first estate, and of those who did. Those who remained faithful have continued in holiness and in the favour of God. It is therefore to be inferred that had Adam continued obedient during the period allotted to his probation, neither he nor any of his posterity would have been ever exposed to the danger of sinning.</p></blockquote>

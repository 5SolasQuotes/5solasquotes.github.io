<main class="wrap"><figure class="quote" id="q-8b86543bca" data-kw="">
<blockquote><p>Observation 4. Our Savior does not command his disciples to separate from commmunion with the Pharisees, and oblige them not hear their doctrine; but only to beware of the errors that they mix with their doctrine. We may, and ought to hold communion with a Church, though erroneous in doctrine, if not fundamentally erroneous. Separation from a Church is not justifiable upon any other ground than that which makes a separation betwixt God and that Church: Which is either the apostasy of that Church into gross idolatry; or in point of doctrine, into damnable heresy.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/william-burkitt.html">William Burkitt</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Expository Notes with Practical Observations on the Four Holy Evangelists… (London, 1700), On Mt. 16</cite></span></figcaption>

— James Durham, The Dying Man’s Testament to the Church of Scotland, or a Treatise concerning Scandal… (Edinburgh: Higgins, 1659) | Preface">Copy</button><a class="share" href="https://x.com/intent/post?text=%E2%80%9CThou+wilt+also+find+%5Bin+this+volume%5D%E2%80%A6+what+things+are+to+be+forborne%2C+and+what+is+to+be+done+in+order+to+uniting%2C+and+that+as+well+in+closing+doctrinal+differences%2C+not+fundamental+nor+nigh+the+foundation%E2%80%A6%E2%80%9D%0A%0A%E2%80%94+James+Durham%2C+The+Dying+Man%E2%80%99s+Testament+to+the+Church+of+Scotland%2C+or+a+Treatise+concerning+Scandal%E2%80%A6+%28Edinburgh%3A+Higgins%2C+1659%29+%7C+Preface&amp;url=https%3A%2F%2F5solasquotes.github.io%2Fquote%2Fdd9e37fec9.html&amp;via=5Solas" target="_blank" rel="noopener">Share on X</a><a class="perma" href="../quote/dd9e37fec9.html">Permalink</a><a class="src" href="https://reformedbooksonline.com/that-union-in-at-least-christianitys-fundamentals-is-obliging/#:~:text=Thou%20wilt%20also%20find%20%5Bin%20this,not%20fundamental%20nor%20nigh%20the%20foundation&amp;text=Thou%20wilt%20also%20find%20%5Bin%20this%20volume&amp;text=doctrinal%20differences%2C%20not%20fundamental%20nor%20nigh%20the%20foundation" rel="noopener" target="_blank">Read it online · Reformed Books Online</a></div>
</figure><figure class="quote" id="q-69c3303193" data-kw="">
<blockquote><p>But as this peace among Protestant Churches is very much to be wished and prayed for, so I despair to see so glorious a work take effect, except the differing parties would resolve to stand to the rules following: 1. That the respective parties which agree in the chief points of religion do not make any of those points they differ in, fundamental, as if the fortune of religion depended upon it, or as if those different points were so many different religions. 2. That the differing parties do not damn one another for those differences, there being nothing that has done religion more hurt than men’s damning one another for things which Christ and his apostles have affixed no damnation to. 3. That notwithstanding the little differences that are among them, they make one Church and endeavour after the welfare and prosperity of it, and join together in public prayer and in the sacrament of the eucharist, which is the badge and symbol of fraternity and amity. 4. That one party be not presently jealous and suspicious of the other, as if the opinion which one party espouses were embraced or maintained in a humor or for worldly ends, but that they charitably believe it’s conscience that puts them upon it, at least till either the party espousing that opinion confesses that conscience is not at the bottom of it or that it appear by undeniable evidences that a worldly or sinister design is the foundation of it. 5. That the differing parties do not multiply the controversies which are amongst them, make them neither more numerous nor greater than really they are, and that they do not interpret an accidental unwary expression that may drop from the pen or mouth of one party as a new controversy. 6. That one party do not charge the other with consequences which they do not own, nor with doctrines and positions which they detest from their hearts. 7. That each party defending or proving their opinion do it with great modesty, without provoking or exasperating or approbrious language and revilings or bitter reflections on the other. 8. That of these differing parties none do vie with the other except it be in living up to the precepts of the Gospel, particularly those of patience, long-suffering and charity. These rules I apprehend to be the foundation of peace and concord of Protestant Churches that differ in points of no great concernment; and were these maxims once put in practice, the particular controversies might soon be compromised. To this purpose is that saying of the apostle: ‘Nevertheless, whereto we have already attained, let’s walk by the same rule, let’s mind the same things; and if any be otherwise minded, God will even reveal that unto you,’ Phil. 3:15-16.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/anthony-horneck.html">Anthony Horneck</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Blessed Advantages of Peace &amp; Peacemakers In a Sermon preached at the Savoy in London upon the Fifth of St. Matthew, verse 9, ‘Blessed are the Peace-makers…’ (London: Aylmer, 1697)</cite>, pp. 34-37</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/the-church/church-unity-and-fundamentals.html">Church Unity and Fundamentals</a></span></div>

</figure><figure class="quote" id="q-06dba7071a" data-kw="">
<blockquote><p>5. Remember, that you have all but one end and one aim, that is, you are all of you elected and called to this assembly for the glory of your God, the honor of your king, the welfare of his people, the peace and purity of the Church, the punishing of offenders, the reforming of abuses and the taking away of all polluted and pernicious doctrines and practices from amongst us. And then the remembrance hereof will be a means to make you one.</p></blockquote>

</figure><figure class="quote" id="q-917f4352cb" data-kw="">
<blockquote><p>But mistake me not, I speak not this of all kind of errors in judgement, what man is he that errs not? All errors are sinful, but all errors are not damning: all errors are hurtful, but all errors are not destructive and undoing errors. I told you there were some errors which were building errors, and some which were fundamental errors: as the apostle speaks, 1 Cor. 3:10-12, etc. In the one the work shall be burnt, in the other the workman. One shall be saved, but so saved as by fire, the other shall be destroyed in fire; work and workman, person and errors shall perish together, 1 Cor. 3:13-15.</p></blockquote>

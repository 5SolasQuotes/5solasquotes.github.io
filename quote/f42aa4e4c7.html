<blockquote><p>Saints by profession are also united in one body, and bound to maintain a holy fellowship and communion with each other. Professed saints compose the Church considered as visible… This union is not confined to those who live together, and can assemble in one place for the observance of religious ordinances, but extends to ‘all that in every place call upon the name of Jesus Christ our Lord, both theirs and ours.’ The visible bonds of this unity are specified by the Apostle Paul: ‘There is one body and one Spirit, even as ye are called in one hope of your calling; one Lord, one faith, one baptism; one God and Father of all, who is above all, and through all, and in you all.’ — Eph. iv. 4-6.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/robert-shaw.html">Robert Shaw</a></span><span class="wk"><span class="lbl">Work:</span> <cite>An Exposition of the Confession of Faith of the Westminster Assembly of Divines 4th</cite>, ed. (1845; Johnstone &amp; Hunter, 1850), ch. 26, ‘Of the Communion of Saints’, p. 274</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/the-church/communion-of-saints.html">Communion of Saints</a></span></div>

</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-f07d136d95" data-kw="">
<blockquote><p>…when the Creed speaks of the ‘Catholic church,’ meaning true saints, that serve God in truth, it speaks not ‘multitude,’ though it mean ‘universal’. But it speaks, that such are scattered up and down the world; here some in one nation, there some in another; here one in one city, there another in another. II. Therefore, ‘communion of saints’ cannot mean personal or local union, or communion: saints in one place, or in one lump, together: not a college of all saints in one place, but a communion betwixt them, as scattered here and there, all the world over. As there is a communion betwixt two friends, one in Turkey, another in England; one in New England, another in Old [England]… How would you understand that, Mt. 24:31, ‘And he shall send his angels with a great sound of a trumpet, and they shall gather together his elect from the four winds, from one end of heaven to the other.’ By the ‘angels,’ he means his messengers the ministers; by the ‘sound of a trumpet,’ he means the gospel; by the whole he means, that, after the destruction of Jerusalem, of which the speech is in the verses before,–God, by the preaching of the Gospel, would fetch in his elect among all nations, or call home the gentiles. But how gather them together? What, into any one place, or country, or city? No, but into such a communion, as we are speaking of, in the several nations or countries, where they lived: one saint in Judea, another in Assyria, another in Greece: all staying in the place where they receive the gospel, and yet all gathered together into one communion.</p></blockquote>

</figure><figure class="quote" id="q-761439a811" data-kw="">
<blockquote><p>Also this word ‘communion’ is very evident and comfortable. For first, the meaning thereof is, that betwixt God and us there is a communion, that is, a fellowship and participation, and so, consequently, a parting betwixt us of all good and heavenly things. And then also we understand, that we are fellows and partakers with all the saints that are living either in heaven or on earth: for we are members of them under one head, Christ. For the apostle John says: “That which we have seen and heard we declare unto you, that ye also may have fellowship with us, and that your fellowship may be with the Father, and his Son Jesus Christ… …What can be more delightful to our ears than to hear that all the saints, as well in heaven as in earth, are our brethren, and that we again are members, partners, and fellows with them?</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/heinrich-bullinger.html">Heinrich Bullinger</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Decades</cite>, p. 163</span></figcaption>

</figure><figure class="quote" id="q-e696627f2a" data-kw="communion join church">
<blockquote><p>For since salvation cannot be obtained except in communion with the true church and many glory in this sacred name who are destitute of its truth, it is of great value to know its true marks that we may be able to distinguish the true fold of Christ from the dens of thieves and dens of robbers. Also that thus we may know what that assembly is to which it is necessary that we should join ourselves that we may obtain salvation.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/francis-turretin.html">Francis Turretin</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Institutes of Elenctic Theology</cite>, 18.12.1c</span></figcaption>

</figure><figure class="quote" id="q-e1fee7694e" data-kw="">
<blockquote><p>I. There is a communion of converse, and communion of affection… And there may be communion of affection, where there is no converse. Nay, there is, as it were, planted in morality, an affection of one excellent person to another. A valiant man loves a valiant man, though he never came near him. A scholar loves a scholar, that he has only heard of. Much more is such an affection planted in true Christianity in a heart truly religious, be he who he will, where he will; though he never saw him. As, ‘My delight is in the saints, and excellent on the earth,’ (Ps. 16:3) be they far off or near.

II. There is communion in ‘common interest,’ where, it may be, there is not communion in coomon converse. Those that never saw or heard of one another to converse together, yet may have communion in common interest. Englishmen meeting beyond sea, that never saw each other before, yet will take parts, and side together, as in the common interest of being countrymen. There is a common interest in all the saints in the world, though at their never so great distance and separation, viz. glorifying God, and loving the Lord Jesus. As the apostle says, 1 Jn. 1:3, ‘Our fellowship is with the Father, and with his Son Jesus Christ.’… This is the special center, in which saints meet, be they never so far asunder. And in this sense, their ‘gathering together,’ is to be understood (of which there is so frequent mention); not into one place; but into this one circle of loving, fearing, serving God; Zeph. 3:9, ‘That they may call upon the name of the Lord, and serve Him with one consent.’ In the Hebrew it is, ‘with one shoulder;’ as if many were together shouldering up the same weight or burden: all in their places jointly putting-to their endeavor to bear up the name, glory and honor, of God: east, west, north, south, every saint joining in this great work, and meeting in this holy point. As the twelve oxen under the brazen sea, their face to the four quarters of heaven, but their bodies all meeting to bear up the weight. Now, III. They that are all of the same mind, all meet in this common interest towards God, cannot but love one another, though they know not one another. ‘My heart’ (says Deborah) ‘is towards the governors of Israel, that offered themselves willingly among the people.’ (Judges 5:9) Did she know all their faces and persons? Could she call them by their names? No, but she could not but love them, be they who they would, that put-to their hands and shoulders to that common cause. We see, how men are ready to affect any that they hear to be of their opinion, humor and mind, though they never saw them. Much more does a saint love a saint, that is partner with him in this holy work. Though he knew not where to find him, or name him; yet if he be for God, he must have his heart; and loving God, he cannot but love whosoever loves Him.

IV. Accordingly they sympathize one with another; ‘Whether one member suffer, all the members suffer with it; or one member be honored, all the members rejoice with it.’ (1 Cor. 12:26)… It grieves a saint, if it be ill with any saint in the world; and he rejoices , if it go well with him. His heart is touched with his case, as with his own. As we are affected with the well or ill doing of any Englishman in any part of the world, for common interest of country’s sake. Neh. 1:4, “And it came to pass, when I heard these words, that I sat down, and wept, and mourned certain days, and fasted, and prayed before the God of heaven.’ ‘Why Nehemiah? thou are well enough; thou art in place of honor, pleasure, preferment.’–‘Oh! but it is ill with the people of God.’–And, Ps. 137:5-6, says the Psalmist, ‘If I forget thee, O Jerusalem, let my right hand forget her cunning. If I do not remember thee, let my tongue cleave to the roof of my mouth, if I prefer not Jerusalem above my chief joy:’ I can never forget Jerusalem.

V. Answerably, they have one another’s prayers. There is not a saint in the world, but has the prayers of all the saints in the world. Any child of God makes it conscience to pray for every child of God on earth. One member cannot but do its best for another. ‘And as many as walk according to this rule, Peace be on them, and mercy, and upon the Israel of God.’ (Gal. 6:16) ‘Pray for thyself, Paul, and for thine own churches’–‘Nay, but every saint wherever is a member of the same body that I am of; and, therefore, I must pray for them also.’ So Eph. 6:24, ‘Grace be with all them, that love our Lord Jesus Christ in sincerity.’ I love Christ, and cannot but love and pray for all that love Him.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/john-lightfoot.html">John Lightfoot</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Other citations (work not named)</cite>, 3. ‘The Communion of Saints’ in An Exposition of Three Articles… (d. 1675), pp. 80-82</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/the-church/communion-of-saints.html">Communion of Saints</a></span></div>
<div class="actions"><button class="copy" data-copy="“I. There is a communion of converse, and communion of affection… And there may be communion of affection, where there is no converse. Nay, there is, as it were, planted in morality, an affection of one excellent person to another. A valiant man loves a valiant man, though he never came near him. A scholar loves a scholar, that he has only heard of. Much more is such an affection planted in true Christianity in a heart truly religious, be he who he will, where he will; though he never saw him. As, ‘My delight is in the saints, and excellent on the earth,’ (Ps. 16:3) be they far off or near.

II. There is communion in ‘common interest,’ where, it may be, there is not communion in coomon converse. Those that never saw or heard of one another to converse together, yet may have communion in common interest. Englishmen meeting beyond sea, that never saw each other before, yet will take parts, and side together, as in the common interest of being countrymen. There is a common interest in all the saints in the world, though at their never so great distance and separation, viz. glorifying God, and loving the Lord Jesus. As the apostle says, 1 Jn. 1:3, ‘Our fellowship is with the Father, and with his Son Jesus Christ.’… This is the special center, in which saints meet, be they never so far asunder. And in this sense, their ‘gathering together,’ is to be understood (of which there is so frequent mention); not into one place; but into this one circle of loving, fearing, serving God; Zeph. 3:9, ‘That they may call upon the name of the Lord, and serve Him with one consent.’ In the Hebrew it is, ‘with one shoulder;’ as if many were together shouldering up the same weight or burden: all in their places jointly putting-to their endeavor to bear up the name, glory and honor, of God: east, west, north, south, every saint joining in this great work, and meeting in this holy point. As the twelve oxen under the brazen sea, their face to the four quarters of heaven, but their bodies all meeting to bear up the weight. Now, III. They that are all of the same mind, all meet in this common interest towards God, cannot but love one another, though they know not one another. ‘My heart’ (says Deborah) ‘is towards the governors of Israel, that offered themselves willingly among the people.’ (Judges 5:9) Did she know all their faces and persons? Could she call them by their names? No, but she could not but love them, be they who they would, that put-to their hands and shoulders to that common cause. We see, how men are ready to affect any that they hear to be of their opinion, humor and mind, though they never saw them. Much more does a saint love a saint, that is partner with him in this holy work. Though he knew not where to find him, or name him; yet if he be for God, he must have his heart; and loving God, he cannot but love whosoever loves Him.

IV. Accordingly they sympathize one with another; ‘Whether one member suffer, all the members suffer with it; or one member be honored, all the members rejoice with it.’ (1 Cor. 12:26)… It grieves a saint, if it be ill with any saint in the world; and he rejoices , if it go well with him. His heart is touched with his case, as with his own. As we are affected with the well or ill doing of any Englishman in any part of the world, for common interest of country’s sake. Neh. 1:4, “And it came to pass, when I heard these words, that I sat down, and wept, and mourned certain days, and fasted, and prayed before the God of heaven.’ ‘Why Nehemiah? thou are well enough; thou art in place of honor, pleasure, preferment.’–‘Oh! but it is ill with the people of God.’–And, Ps. 137:5-6, says the Psalmist, ‘If I forget thee, O Jerusalem, let my right hand forget her cunning. If I do not remember thee, let my tongue cleave to the roof of my mouth, if I prefer not Jerusalem above my chief joy:’ I can never forget Jerusalem.

V. Answerably, they have one another’s prayers. There is not a saint in the world, but has the prayers of all the saints in the world. Any child of God makes it conscience to pray for every child of God on earth. One member cannot but do its best for another. ‘And as many as walk according to this rule, Peace be on them, and mercy, and upon the Israel of God.’ (Gal. 6:16) ‘Pray for thyself, Paul, and for thine own churches’–‘Nay, but every saint wherever is a member of the same body that I am of; and, therefore, I must pray for them also.’ So Eph. 6:24, ‘Grace be with all them, that love our Lord Jesus Christ in sincerity.’ I love Christ, and cannot but love and pray for all that love Him.”

— John Lightfoot, Other citations (work not named), 3. ‘The Communion of Saints’ in An Exposition of Three Articles… (d. 1675), pp. 80-82">Copy</button><a class="share" href="https://x.com/intent/post?text=%E2%80%9CI.+There+is+a+communion+of+converse%2C+and+communion+of+affection%E2%80%A6+And+there+may+be+communion+of+affection%2C+where+there+is+no+converse.+Nay%2C+there+is%2C+as+it+were%2C+planted+in+morality%2C+an+affection+of+one+excellent+person+to+another.+A+valiant+man+loves+a+valiant+man%2C+though+he+never+came+near+him.+A+scholar+loves+a+scholar%2C+that+he+has+only+heard+of.+Much+more+is+such+an+affection+planted+in+true+Christianity+in+a+heart+truly+religious%2C+be+he+who+he+will%2C+where+he+will%3B+though+he+never+saw+him.+As%2C+%E2%80%98My+delight+is+in+the+saints%2C+and+excellent+on+the+earth%2C%E2%80%99+%28Ps.+16%3A3%29+be+they+far+off+or+near.+II.+There+is+communion+in+%E2%80%98common+interest%2C%E2%80%99+where%2C+it+may+be%2C+there+is+not+communion+in+coomon+converse.+Those+that+never+saw+or+heard+of+one+another+to+converse+together%2C+yet+may+have+communion+in+common+interest.+Englishmen+meeting+beyond+sea%2C+that+never+saw+each+other+before%2C+yet+will+take+parts%2C+and+side+together%2C+as+in+the+common+interest+of+being+countrymen.+There+is+a+common+interest+in+all+the+saints+in+the+world%2C+though+at+their+never+so+great+distance+and+separation%2C+viz.+glorifying+God%2C+and+loving+the+Lord+Jesus.+As+the+apostle+says%2C+1+Jn.+1%3A3%2C+%E2%80%98Our+fellowship+is+with+the+Father%2C+and+with+his+Son+Jesus+Christ.%E2%80%99%E2%80%A6+This+is+the+special+center%2C+in+which+saints+meet%2C+be+they+never+so+far+asunder.+And+in+this+sense%2C+their+%E2%80%98gathering+together%2C%E2%80%99+is+to+be+understood+%28of+which+there+is+so+frequent+mention%29%3B+not+into+one+place%3B+but+into+this+one+circle+of+loving%2C+fearing%2C+serving+God%3B+Zeph.+3%3A9%2C+%E2%80%98That+they+may+call+upon+the+name+of+the+Lord%2C+and+serve+Him+with+one+consent.%E2%80%99+In+the+Hebrew+it+is%2C+%E2%80%98with+one+shoulder%3B%E2%80%99+as+if+many+were+together+shouldering+up+the+same+weight+or+burden%3A+all+in+their+places+jointly+putting-to+their+endeavor+to+bear+up+the+name%2C+glory+and+honor%2C+of+God%3A+east%2C+west%2C+north%2C+south%2C+every+saint+joining+in+this+great+work%2C+and+meeting+in+this+holy+point.+As+the+twelve+oxen+under+the+brazen+sea%2C+their+face+to+the+four+quarters+of+heaven%2C+but+their+bodies+all+meeting+to+bear+up+the+weight.+Now%2C+III.+They+that+are+all+of+the+same+mind%2C+all+meet+in+this+common+interest+towards+God%2C+cannot+but+love+one+another%2C+though+they+know+not+one+another.+%E2%80%98My+heart%E2%80%99+%28says+Deborah%29+%E2%80%98is+towards+the+governors+of+Israel%2C+that+offered+themselves+willingly+among+the+people.%E2%80%99+%28Judges+5%3A9%29+Did+she+know+all+their+faces+and+persons%3F+Could+she+call+them+by+their+names%3F+No%2C+but+she+could+not+but+love+them%2C+be+they+who+they+would%2C+that+put-to+their+hands+and+shoulders+to+that+common+cause.+We+see%2C+how+men+are+ready+to+affect+any+that+they+hear+to+be+of+their+opinion%2C+humor+and+mind%2C+though+they+never+saw+them.+Much+more+does+a+saint+love+a+saint%2C+that+is+partner+with+him+in+this+holy+work.+Though+he+knew+not+where+to+find+him%2C+or+name+him%3B+yet+if+he+be+for+God%2C+he+must+have+his+heart%3B+and+loving+God%2C+he+cannot+but+love+whosoever+loves+Him.+IV.+Accordingly+they+sympathize+one+with+another%3B+%E2%80%98Whether+one+member+suffer%2C+all+the+members+suffer+with+it%3B+or+one+member+be+honored%2C+all+the+members+rejoice+with+it.%E2%80%99+%281+Cor.+12%3A26%29%E2%80%A6+It+grieves+a+saint%2C+if+it+be+ill+with+any+saint+in+the+world%3B+and+he+rejoices+%2C+if+it+go+well+with+him.+His+heart+is+touched+with+his+case%2C+as+with+his+own.+As+we+are+affected+with+the+well+or+ill+doing+of+any+Englishman+in+any+part+of+the+world%2C+for+common+interest+of+country%E2%80%99s+sake.+Neh.+1%3A4%2C+%E2%80%9CAnd+it+came+to+pass%2C+when+I+heard+these+words%2C+that+I+sat+down%2C+and+wept%2C+and+mourned+certain+days%2C+and+fasted%2C+and+prayed+before+the+God+of+heaven.%E2%80%99+%E2%80%98Why+Nehemiah%3F+thou+are+well+enough%3B+thou+art+in+place+of+honor%2C+pleasure%2C+preferment.%E2%80%99%E2%80%93%E2%80%98Oh%21+but+it+is+ill+with+the+people+of+God.%E2%80%99%E2%80%93And%2C+Ps.+137%3A5-6%2C+says+the+Psalmist%2C+%E2%80%98If+I+forget+thee%2C+O+Jerusalem%2C+let+my+right+hand+forget+her+cunning.+If+I+do+not+remember+thee%2C+let+my+tongue+cleave+to+the+roof+of+my+mouth%2C+if+I+prefer+not+Jerusalem+above+my+chief+joy%3A%E2%80%99+I+can+never+forget+Jerusalem.+V.+Answerably%2C+they+have+one+another%E2%80%99s+prayers.+There+is+not+a+saint+in+the+world%2C+but+has+the+prayers+of+all+the+saints+in+the+world.+Any+child+of+God+makes+it+conscience+to+pray+for+every+child+of+God+on+earth.+One+member+cannot+but+do+its+best+for+another.+%E2%80%98And+as+many+as+walk+according+to+this+rule%2C+Peace+be+on+them%2C+and+mercy%2C+and+upon+the+Israel+of+God.%E2%80%99+%28Gal.+6%3A16%29+%E2%80%98Pray+for+thyself%2C+Paul%2C+and+for+thine+own+churches%E2%80%99%E2%80%93%E2%80%98Nay%2C+but+every+saint+wherever+is+a+member+of+the+same+body+that+I+am+of%3B+and%2C+therefore%2C+I+must+pray+for+them+also.%E2%80%99+So+Eph.+6%3A24%2C+%E2%80%98Grace+be+with+all+them%2C+that+love+our+Lord+Jesus+Christ+in+sincerity.%E2%80%99+I+love+Christ%2C+and+cannot+but+love+and+pray+for+all+that+love+Him.%E2%80%9D%0A%0A%E2%80%94+John+Lightfoot%2C+Other+citations+%28work+not+named%29%2C+3.+%E2%80%98The+Communion+of+Saints%E2%80%99+in+An+Exposition+of+Three+Articles%E2%80%A6+%28d.+1675%29%2C+pp.+80-82&amp;url=https%3A%2F%2F5solasquotes.github.io%2Fquote%2Fe1fee7694e.html&amp;via=5Solas" target="_blank" rel="noopener">Share on X</a><a class="perma" href="../quote/e1fee7694e.html">Permalink</a><a class="src" href="https://reformedbooksonline.com/on-the-communion-of-the-saints/#:~:text=I.%20There%20is%20a%20communion%20of,pray%20for%20all%20that%20love%20Him&amp;text=I.%20There%20is%20a%20communion%20of%20converse%2C%20and&amp;text=love%20and%20pray%20for%20all%20that%20love%20Him" rel="noopener" target="_blank">Read it online · Reformed Books Online</a></div>

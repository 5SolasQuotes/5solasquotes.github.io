<blockquote><p>God had been the same, perfect and blessed for ever, though the creature had never been… Infiniteness is God of universal, unlimited and incomprehensible perfection, Job 11:8-9; 1 Tim. 6:16… God therefore having all perfection in his own power, cannot deny any to Himself.</p></blockquote>

5. And so it admits degrees of further perfection.

6. But by no means the defect of a full and final falling away.

8. Because these are the inseparable companions of any wayfarer, hence falls the dream of Papist perfection in this life.</p></blockquote>

<blockquote><p>21. By the knowledge of our own acts we know our powers and the nature of our own souls (though imperfectly). And by the knowledge of our souls, we know the nature of other intellectual spirits. And by the knowledge of ourselves and them, and the Scripture expressions of his attributes, we know so much of God as we can here know. And accordingly must speak of him, or be silent. For we have no higher notions than such as are thus analogical, expressing that which is in God in an inconceivable eminency and transcendency, by words which first signify that which is formally in the soul (as is said).</p></blockquote>

</figure><figure class="quote" id="q-f4da6d65e4" data-kw="">
<blockquote><p>Assurance makes most for your comfort—but holiness makes most for God&#x27;s honor. Man&#x27;s holiness is now his greatest happiness, and in heaven man&#x27;s greatest happiness will be his perfect holiness. Assurance is the daughter of holiness; and he who shall more highly prize, and more earnestly press after the enjoyment of the daughter than the mother, it is not a wonder if God shuts the door upon him, and crosses him in the thing he most desires. The surest and the shortest way to assurance is to wrestle and contend with God for holiness. When the stream and cream of a man&#x27;s spirit runs after holiness, it will not be long night with that man; the Sun of righteousness will shine forth upon that man, and turn his winter into summer, and crown him with the diadem of assurance.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/thomas-brooks.html">Thomas Brooks</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Heaven on Earth: A Treatise on Christian Assurance</cite>, p. 104</span></figcaption>

</figure><figure class="quote" id="q-9ca33d955c" data-kw="">
<blockquote><p>Effects arisen and dependent from faith considered organically are: …

IV. Sanctification strictly so called, or the excitation and study of new holiness in the inner and outer man, 2 Cor. 7:1. To which pertains the practice of repentance and faith and a purged conscience, concerning which we treat in the Ascetics, or in the treatise On the Exercise of Piety. Now the proper character of this new practice of holiness is perfection or integrity, which consists in this:

      1. That they do not sin totally and entirely, because of the resistance and reaction of the spirit, Rom. 7:17–20; Gal. 5:17.

      2. That consequently there is always some restraint, and they feel their sin with remorse and grief after they have sinned, 2 Sam. 24:10.

      3. That sin is not their daily and ordinary and professed practice, 1 Jn. 3:6, 8–9, and thus they are not and are not properly called sinners, workers of iniquity, impious, unjust; but on the contrary servants of God, pious, righteous, etc.

      4. That their merciful and most wise Father takes occasion from their fall or perpetually adhering infirmities to excite and bring them to perfection of faith, repentance, custody, excitation, and practice of conscience. Concerning which we have treated in our treatise against Tilenus written in Dutch, and in the Disputation on the Uses of Sin Per Accidens.

      5. That they are perfect with perfection of the greater parts, namely, the inner and outer—that is, that they worship God not hypocritically but sincerely.

      6. That moreover they are perfect with perfection of the lesser parts—that is, they live according to all the commandments of God as to the ordinary and composed course of life, so that they know no commandment of God or set before themselves any which they have resolved to transgress knowingly and willingly, Phil. 1:1 [This should be a different reference]; Rom. 7:15–16.

      7. That they also in their own manner attain some perfection of degrees: namely, by desire, affection, purpose, study, and endeavor—yet not by effect.

V. Inchoate blessedness or glorification, which comprehends joy, peace, living hope, liberty, and all goods and privileges of the sons of God, 1 Pet. 1:3, 6–8; Rom. 8:1–2, throughout; 2 Cor. 3:17–18. Compare Ames’s Medulla, bk. 1, ch. 30.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/gisbertus-voetius.html">Gisbertus Voetius</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Disputation 30, ‘On Regeneration’, pt. 2</cite>, (1639) tr. AI by Roman Prestarri in Select Theological Disputations (1655), vol. 2, pp. 447ff. Latin at Confessionally Reformed Theology</span></figcaption>

</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-0616ec9e74" data-kw="">
<blockquote><p>I have said elsewhere that the Westminster Divines, from their earnest desire to form one comprehensive Church, did not require subscription to their Directories for Public Worship and for Church Government, nor exact conformity to their minute details, as [Archbishop] Laud had done to those of the Prayer-Book and Canons. It may be doubted if the English section of them meant to require more for their Confession of Faith than that it should be (like the Irish Articles) the norm of public teaching. They felt with Baxter that ‘there is a singular use for a full body of theology or a profession concluded on by such reverend assemblies, that the younger ministers may be taught by it, and the reverence of it may restrain them from rash contradicting it; and there is a necessity of exercising power in ministerial assemblies for the actual restraint of such as shall teach things intolerably unsound, and all ministers should be there accountable for their doctrine.’ Such a full body of theology in a non-liturgical Church was essential as a guide in prayer as well as in preaching, and its authority as the norm of both was the least restriction that could be imposed if reasonable soundness was to be maintained, and due security given to the congregations that the liberty allowed in the devotional services should not degenerate into licence. Probably this was all that the majority of the English divines were disposed to insist on. At any rate a sentence of Tuckney often quoted, seems to point in that direction. ‘In the Assembly I gave my vote with others that the Confession of Faith, put out by authority, should not be either required to be sworn or subscribed to… but only so as not to be publicly preached or written against.’ I have not come on any clear trace of this vote in the Minutes of the Assembly, but possibly it occurred on or soon after 26th November 1646, when the Confession was completed, and about to be sent up to the Houses, and when it is recorded that ‘Mr. Nye, Mr. Carter junior, and Mr. Greenhill enter their dissent to the sending up of the Confession of Faith in order to the Preface,’ and is ordered that ‘before the Confession of Faith be sent up the Preface shall be debated and prepared to be sent up with it, if any be made.’ But so far as appears from the Minutes none was debated or sent up. The Church of Scotland, while agreeing with the English Divines as to the Directory of Public Worship, and Form of Church Government, has always required her ministers to regard the Confession of Faith as something more than the norm of teaching to which in their public ministrations they were to conform [this is not actually true, as the WCF was not enacted to be subscribed till 1693], and by the Act of the Scottish Parliament in 1693 she was sufficiently authorised to require more than this, including at least personal acceptance of its main doctrines, and of the sum and substance of the Reformed faith, as set forth in it.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/alexander-mitchell.html">Alexander Mitchell</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Appendix: “Subscription to the Confession” in The Westminster Assembly: its History &amp; Standards (1884)</cite>, pp. 511-12</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/the-church/creeds-confessions-and-councils.html">Creeds, Confessions and Councils</a></span></div>

</figure><figure class="quote" id="q-20716bd4d4" data-kw="">
<blockquote><p>I, N.N., do swear and affirm before God and this holy assembly that I do receive, approve, and embrace all the doctrine taught and decided by the Synod of Dort [1619], as entirely conforming (entierement conforme) to the Word of God and the Confession of our churches. I swear and promise to persevere in the profession of this doctrine during my whole life, and to defend it with all my ability, and that I will never, neither by preaching, nor by teaching in the schools, nor by writing, depart from this rule (regle)… So may God help me, and be gracious to me, as I swear all this before him without any ambiguity, equivocation or mental reservation.</p></blockquote>

</figure><figure class="quote" id="q-8e6b20902e" data-kw="Creeds below Scripture">
<blockquote><p>The authority of confessions ought indeed to be great with the pious in the churches, but still sinking below the authority of the Scripture. For the latter is a rule, they the thing ruled. It alone is self-credible (autopistos) with respect to words as well as to things, divine and infallible; they, as divine in things, still in words and manner of treatment are human writings. Faith is immediately and absolutely due to it; to them an examination is due and that having been made, if they agree with the word, faith. It is the constant and immutable canon of faith; while they are subject to revision and new examination, in which it is right not only to explain and amplify them, but also to correct whatever fault should be found in them and reform according to the rule of the word. Hence it is evident that they err here in excess who hold such confessions as the rule of the truth itself and make them equal to the word of God.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/francis-turretin.html">Francis Turretin</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Institutes of Elenctic Theology</cite>, 18.30.9</span></figcaption>

</figure><figure class="quote" id="q-d757378e08" data-kw="">
<blockquote><p>The Shorter Catechism agreed upon by the Assembly of divines at Westminster, and presented to the honorable Houses of Parliament then sitting, and by them ordered to be printed and published, but no man enjoined to use it, or punishable if he made use of any other to instruct his people in. This little book for the comprehensiveness of it, as also exactness of order and expression, has (as it deserves) a great esteem with many learned men, notwithstanding to be the one and only book for all capacities that are to be instructed in principles throughout the nation, is a perfection not to be expected from any common gift, nor is this for such purpose the fittest in its kind, as we shall endeavor to show in this dispute.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/philip-nye.html">Philip Nye</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Beams of Former Light: discovering how Evil it is to Impose doubtful and disputable forms or practices, upon ministers: especially under the penalty of ejection for non-conformity unto the same. As also something about catechizing. (London: 1660) This was published just before the Great Ejection of 1662.</cite>, pp. 10-11</span></figcaption>

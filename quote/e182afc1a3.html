<main class="wrap"><figure class="quote" id="q-e182afc1a3" data-kw="">
<blockquote><p>After indicating that the Genevans, of course, wish and hope for the gospel to be spread everywhere, the letter states: “But we know well also what is within our compass, and we do not presume even to wish to reform extensive kingdoms.”… What is fascinating here is the apparent renouncing, on the part of the Genevans, of any connection to the evangelical movement within France or anywhere else. They would seem to wish for the king to believe that Geneva stays resolutely and quietly within its own geographical border and does not meddle in the work of reforming other parts of Europe, let alone France. In all of this, Geneva kept up a near-constant state of deception in regards to the French king and his government… Geneva was extremely effective at feigning obedience to French kings.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/jon-balserak.html">Jon Balserak</a></span><span class="wk"><span class="lbl">Work:</span> <cite>‘Geneva’s Use of Lies, Deceit &amp; Simulation in Their Efforts to Reform France</cite>, 1536–1563’ HTR 112:1 (2019), pp. 76–100, p. 99</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/the-christian-life/obedience-and-profession.html">Obedience and Profession</a></span></div>

</figure><figure class="quote" id="q-ea9285199b" data-kw="">
<blockquote><p>Put such books into people’s hands as plead best the cause of love and peace. Among others, get men to read these: Bishop Ussher’s Sermon on Eph. 4:13 at Wansted before King James [‘A Brief Declaration of the Universality of the Church of Christ’, 1624 / 1629], Bishop Hall’s [sermon, ‘The True] Peacemaker’ [1624]: Mr. Jeremiah Burroughs’s of Heart-Divisions, and Mr. Stillingfleet’s Irenicon, and all Mr. [John] Durie’s.</p></blockquote>

<blockquote><p>Further, if people are thus unjustly charged, it may be some comfort to consider the best of Christ’s servants have been thus accused, as appears from what the apostle says, 2 Cor. 1:17-18, when it seems such as turned his enemies in that Church had charged him with lightness and changeableness in his doctrine and principles, as well as in his purposes, where, for his own vindication, he is obliged to use a sort of solemn oath, saying, ‘But as God is true, our word,’ or preaching, ‘toward you was not yea and nay.’ And Durham on Scandal (p. 176) instances this as one of the ways whereby the Devil carries on division in the Church, viz. by making people charge ministers with ‘lightness’ and ‘changeableness,’ as if they were of one mind this year and of another the next. As formerly I endeavored to contribute my mite in opposing what I judged amiss in the Church of Scotland, so, through grace, I hope to continue and cannot see a shadow of reason to imagine but it is as acceptable to God, and much more acceptable to Him to oppose what may be amiss in her conduct, in a way of Church-communion, as in a separate state, ‘Separation’ (as the Protesters say) ‘being highly impedimental to reformation.’ (Rep. to Ass., 1652) I know every Christian, and ministers of the Gospel, in a special manner, ought to be very cautious, guarding against giving offense to any of Christ’s little ones, but if they will take offense at doing what is plain present duty, though they are to be pitied and used tenderly, yet they are not to be regarded so as to omit duty for fear they take offense. When the great apostle of the gentiles opposed Peter, and other saints, who pretending greater strictness, did separate from the gentile converts, he knew his conduct in that would offend many who were dear unto the Lord; yet he regarded not their offense, but ‘withstood Peter to the face, because he was to be blamed.’ (Gal. 2:11-14) Our Lord Jesus knew his healing and curing diseased persons on the Sabbath would occasion such as watched him (Mk. 3:2) to take offense; He also knew his familiar converse with publicans and sinners would be stumbling and offensive to sundry; yet he would not forbear it. Sometimes we are called to deny ourselves as to our ease, conveniency, pleasure and satisfaction rather than occasion the offending of such as causelessly take offense, but, according to our Lord’s example, commanded present duty is to be done, let never so many stumble or be offended. Hence [Matthew] Henry says (on Mk. 2:16), ‘Those are too tender of their own good name who, to preserve it with some nice people, will decline a good work; Christ would not do so.’ And tender Christians, who may be ready to take offense, ought to consider what danger there is in being ‘righteous over much.’ If the prophetess Miriam, or Aaron, the saint of God, speak against Moses, his Lord will resent it, asking ‘Wherefore were ye not afraid to speak against my servant Moses?’ (Num. 12:8) Now, for doing what, in my opinion, is plain present duty in this case, viz. the opposing what I take to be sinful schism, though I should further suffer in my reputation from some, yet ’tis some satisfaction to think in this I’m far from being singular; for here I suffer with a cloud of faithful witnesses, as…</p></blockquote>

+duty+for+fear+they+take+offense.+When+the+great+apostle+of+the+gentiles+opposed+Peter%2C+and+other+saints%2C+who+pretending+greater+strictness%2C+did+separate+from+the+gentile+converts%2C+he+knew+his+conduct+in+that+would+offend+many+who+were+dear+unto+the+Lord%3B+yet+he+regarded+not+their+offense%2C+but+%E2%80%98withstood+Peter+to+the+face%2C+because+he+was+to+be+blamed.%E2%80%99+%28Gal.+2%3A11-14%29+Our+Lord+Jesus+knew+his+healing+and+curing+diseased+persons+on+the+Sabbath+would+occasion+such+as+watched+him+%28Mk.+3%3A2%29+to+take+offense%3B+He+also+knew+his+familiar+converse+with+publicans+and+sinners+would+be+stumbling+and+offensive+to+sundry%3B+yet+he+would+not+forbear+it.+Sometimes+we+are+called+to+deny+ourselves+as+to+our+ease%2C+conveniency%2C+pleasure+and+satisfaction+rather+than+occasion+the+offending+of+such+as+causelessly+take+offense%2C+but%2C+according+to+our+Lord%E2%80%99s+example%2C+commanded+present+duty+is+to+be+done%2C+let+never+so+many+stumble+or+be+offended.+Hence+%5BMatthew%5D+Henry+says+%28on+Mk.+2%3A16%29%2C+%E2%80%98Those+are+too+tender+of+their+own+good+name+who%2C+to+preserve+it+with+some+nice+people%2C+will+decline+a+good+work%3B+Christ+would+not+do+so.%E2%80%99+And+tender+Christians%2C+who+may+be+ready+to+take+offense%2C+ought+to+consider+what+danger+there+is+in+being+%E2%80%98righteous+over+much.%E2%80%99+If+the+prophetess+Miriam%2C+or+Aaron%2C+the+saint+of+God%2C+speak+against+Moses%2C+his+Lord+will+resent+it%2C+asking+%E2%80%98Wherefore+were+ye+not+afraid+to+speak+against+my+servant+Moses%3F%E2%80%99+%28Num.+12%3A8%29+Now%2C+for+doing+what%2C+in+my+opinion%2C+is+plain+present+duty+in+this+case%2C+viz.+the+opposing+what+I+take+to+be+sinful+schism%2C+though+I+should+further+suffer+in+my+reputation+from+some%2C+yet+%E2%80%99tis+some+satisfaction+to+think+in+this+I%E2%80%99m+far+from+being+singular%3B+for+here+I+suffer+with+a+cloud+of+faithful+witnesses%2C+as%E2%80%A6%E2%80%9D%0A%0A%E2%80%94+John+Currie%2C+A+Vindication+of+the+Real+Reformation-Principles+of+the+Church+of+Scotland+concerning+Separation%2C+etc....+%28Edinburgh%3A+A.+Alison%2C+1740%29%2C+To+the+Reader%2C+pp.+viii-ix&amp;url=https%3A%2F%2F5solasquotes.github.io%2Fquote%2F645fa28869.html&amp;via=5Solas" target="_blank" rel="noopener">Share on X</a><a class="perma" href="../quote/645fa28869.html">Permalink</a><a class="src" href="https://reformedbooksonline.com/on-scandal/#:~:text=Further%2C%20if%20people%20are%20thus%20unjustly,a%20cloud%20of%20faithful%20witnesses%2C%20as&amp;text=Further%2C%20if%20people%20are%20thus%20unjustly%20charged%2C%20it&amp;text=suffer%20with%20a%20cloud%20of%20faithful%20witnesses%2C%20as" rel="noopener" target="_blank">Read it online · Reformed Books Online</a></div>

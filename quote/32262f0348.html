<blockquote><p>What we call beautiful in objects, to speak in the mathematical style, seems to be in a compound ratio of uniformity and variety; so that where the uniformity of bodies is equal, the beauty is as the variety; and where the variety is equal, the beauty is as the uniformity.</p></blockquote>

</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-70b462bc5a" data-kw="">
<blockquote><p>Q. What if by the wrong a man does me, I observe such infirmity, yea and iniquity to be in him, as by experience I find him to be a far other man than at first I supposed him to be, ought I notwithstanding to make such account of him as I did before? A. We must put difference betwixt a wrong done upon such an occasion as may afterwards be avoided, and that which is done upon an evil disposition, which remaining in a man, may be a means to make him continue to do more and more wrongs. The wrong of the former must be so forgiven, as the wrong doer be so accepted as if he had done no wrong at all. As for the latter, we are to try if he may be brought to sight of his evil disposition, and to repentance for the same. If he be, then ought we to esteem him as if he never had done us any hurt. But if obstinately he persist in that evil disposition, and be like, on all occasions, again and again to wrong us, though we do, as we ought, fully forgive all the wrongs done, and neither take any present revenge, nor keep them in mind and memory for any future revenge, yet may we in our judgment esteem him to be such an one as we find him to be. (Woe to them that call evil good: that put light for darkness, and sweet for bitter.) For example, if I find one of whom I have had a very good account, and thereupon used him very familiarly, to have no command of his tongue, but on all occasions to be ready to blab out, and blaze abroad whatsoever he sees or hears, if therein he have wronged me, I may forbear to use him so familiarly as I did before, and take heed what secrets I communicate to him, though I fully forgive the wrong that is past. Or if I have accounted one to be an entire friend to me, but by experience find him to be hollow-hearted, and maliciously minded against me, I ought wisely and warily to avoid his society, and to take heed of the snares which he lays for me. (For which we have the pattern of David, and Christ) yet so to pass by the wrongs done as if none had been done.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/william-gouge.html">William Gouge</a></span><span class="wk"><span class="lbl">Work:</span> <cite>A Guide to go to God: or an Explanation of the Perfect Pattern of Prayer, the Lord’s Prayer (London, 1626), §148. ‘Of a full forgiving one another,’</cite>, pp. 186-87</span></figcaption>

</figure><figure class="quote" id="q-92245bfd04" data-kw="">
<blockquote><p>III. With these words [Col. 1:12-13], our eternal salvation is ascribed to the heavenly Father with due thanksgiving… IV. Now, following the footsteps of the Apostle, we will first discuss thanksgiving, and then its arguments. Thanksgiving to God is the worship of God when we give Him proper praise for His benefits. V. This thanksgiving is rendered to God in three ways: in thought, in words, and in deeds. VI. In thought, when we truly acknowledge that whatever good we are and have, we owe it all to God the Father, through and on account of Christ, by the efficacy of the Holy Spirit, according to the gracious will and eternal benevolence of the Father, Son, and Holy Spirit towards us. Furthermore, we have perpetual gratitude in our hearts towards God. VII. This thanksgiving, which pertains to thought, holds the first place in order and dignity, without which the other expressions of gratitude are not pleasing and acceptable to God. VIII. In words, when we privately or publicly commemorate the benefits of God, from which they have come forth, through preaching His goodness. IX. In deeds, when, to testify our gratitude to God, we offer ourselves and our material and spiritual possessions to Him, willingly devoting them for His glory and the use of the saints. X. The arguments for thanksgiving are derived both from the cause that impels God to bestow benefits upon us and from the benefits themselves as effects of God.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/amandus-polanus.html">Amandus Polanus</a></span><span class="wk"><span class="lbl">Work:</span> <cite>‘Analytical Theses on Colossians, containing the Exordium of the Epistle’, pt. 2 (on Col. 1:12-13) $3 Download tr. Jonathan Tomes (Basel: Johannes Schroeter, 1601)</cite></span></figcaption>

<blockquote><p>…Calvin protested [to the French king] “in truth before God” that Geneva has “never attempted to send persons into your kingdom.” Explaining matters further, the letter declared: “that never with our knowledge and permission has someone gone from here to preach except one individual who was requested from us for the city of London… So then, the Genevan ministers say they encouraged some people to exercise their gifts everywhere. There is, however, the clear implication that was all they did. The explanation would appear to wish to persuade the king that what he has heard of as Geneva sending ministers into his kingdom is actually a simple case of free preachers and godly men wandering of their own free will into the king’s territory… The answers to both concerns are, according to Calvin and Beza’s own Augustinian understanding of lying, plainly speech contra mentem. They did send preachers into France and they were involved in dissensions of precisely the kind about which the king was asking.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/jon-balserak.html">Jon Balserak</a></span><span class="wk"><span class="lbl">Work:</span> <cite>‘Geneva’s Use of Lies, Deceit &amp; Simulation in Their Efforts to Reform France, 1536–1563’ HTR 112:1 (2019), pp. 76–100</cite>, p. 98</span></figcaption>

<blockquote><p>Beauty is a mode of being, through which the being is understood to please. The academics do not distinguish beauty from good. They err…</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/johann-heinrich-alsted.html">Johann Heinrich Alsted</a></span><span class="wk"><span class="lbl">Work:</span> <cite>12. ‘Of Beauty’ in Metaphysics Drawn out in Three Books through Methodical Precepts, Select Theorems &amp; Clear, Short Commentaries… (Herborne, 1613), bk. 1, Of Transcendentals</cite>, pp. 115-17</span></figcaption>

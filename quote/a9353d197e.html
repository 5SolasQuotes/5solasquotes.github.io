<main class="wrap"><figure class="quote" id="q-a9353d197e" data-kw="">
<blockquote><p>This is the sum of their answer, It is lawful for them, nay, they ought to prefer God before men. God commandeth us to bear witness of Christ; therefore it is in vain for you to command us to keep silence. But I have declared before in the third chapter, when this sentence taketh place, that we ought rather to obey God than men. God doth set men over us in such sort with power, that he keepeth still his own authority safe and sound. Therefore, we must obey rulers so far, that the commandment of God be not broken.

Whereas power and authority is lawfully used, then it is out of season to make comparison between God and man. If a faithful pastor do command or forbid out of the Word of God, it shall be in vain for men which are stubborn to object that we ought to obey God; for God will be heard by man. Yea, man is nothing else but an instrument of God. If a magistrate do his duty as he ought, a man shall in vain say that he is contrary to God, seeing that he dissenteth in nothing; yea, rather the contrary rule is then in force. We must obey God’s ministers and officers if we will obey him.

But so soon as rulers do lead us away from the obedience of God, because they strive against God with sacrilegious boldness, their pride must be abated, that God may be above all in authority. Then all smokes of honour vanish away. For God doth not vouchsafe to bestow honourable titles upon men, to the end they may darken his glory. Therefore, if a father, being not content with his own estate, do essay to take from God the chief honour of a father, he is nothing else but a man. If a king, or ruler, or magistrate, do become so lofty that he diminisheth the honour and authority of God, he is but a man.

We must thus think also of pastors. For he which goeth beyond his bounds in his office, (because he setteth himself against God:) must be despoiled of his honour, lest, under a colour or visor, he deceive. The office of a pastor is very excellent, the authority of the Church is great, yet so that no part of God’s power and Christ’s mastership be diminished. Whence we may easily gather that the pride of the Pope is ridiculous, who, when as he treadeth under foot the whole kingdom of Christ, and doth set himself openly against God, will yet, nevertheless, lie hid under the name of Christ.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/john-calvin.html">John Calvin</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Commentary on the Acts of the Apostles</cite>, ed. Henry Beveridge, trans. Christopher Fetherstone (1560; London, 1585) in Calvin’s Commentaries (22 vols, Grand Rapids: Baker, 1993), 18a: 214-15.</span></figcaption>

<blockquote><p>Objection 3. The apostle says, 1 Cor. 14:26, ‘When ye come together every one of you hath a psalm, hath a doctrine, hath a tongue, hath a revelation, hath an interpretation,’ v. 31, ‘ye may all prophesy one by one.’ Therefore all that preach or prophesy need not to be ordained. Answer: What those prophets were, and what is meant by prophesying there, all are not of one opinion. I hold that these prophets were immediately and extraordinarily inspired, and I reckon them among these other administrations, which were not ordinary, or ever to continue in the Church: apostles, evangelists, workers of miracles. But of this I am to speak distinctly, and by itself afterwards [in ch. 5]. Meanwhile, they that make the objection must prove two things, else they conclude nothing against the necessity of ordination:

1. That these prophets were not sent and ordained, but that their gifts and parts, gave them a sufficient calling to interpret in the Church.

2. That although they had no ministerial sending or vocation, yet they were not extraordinary prophets, but that such prophets are to continue ordinarily in the Church. I believe it will trouble them to prove either.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/george-gillespie.html">George Gillespie</a></span><span class="wk"><span class="lbl">Work:</span> <cite>A Treatise of Miscellany Questions</cite>, (Edinburgh, 1649), ch. 4, objection 3, p. 59</span></figcaption>

<blockquote><p>1st Distinction. There is one power of public preaching in a Church not constitute[d], and another in a Church constitute[d]; gifted persons in extraordinary cases, where a Church is not planted, may publicly preach, but the case is otherwise in a Church constituted. … 3rd Distinction. Public preaching, as it is the ordinary mean of saving such as believe, is proper and peculiar to the Church, both subjectively, as being only in the Church, and objectively as being only exercised on the Church members per se, but upon pagans by accident. 4th Distinction. There is a call to an habitual and ordinary prophesying; here is required not only a calling by gifts, but also a collation of authority to the office, either immediately by God, or mediately by the Church, and there is a call to some particular or occasional acts of exhorting, as the martyrs and Stephen [Acts 7] are called to give confession of their faith, and a king in battle, to exhort his army, or a prince his subjects to piety, and to this latter there is no other call required but the place and profession of the exhorter, though he bee not by office a pastor. 5th Distinction. There is a formal calling of the Church, as the laying on of the hands of the elders, and a virtual and interpretative calling or tacit approbation of the Church, when learned men of eminent gifts, not in office, do write commentaries, sermons on canonic Scriptures, and tractates refuting heresies; to this the tacit approbation of the Church is required, but these have not ordinary pastoral care, nor are they the ordinary converters of souls to Christ, as the pretended prophets of [the] Separatists are. 6th Distinction. Gifted Christians may occasionally admonish, warn, rebuke and exhort one another: 1. privately; 2. without any pastoral care of souls as they are a Church, but only as they occasionally converse with them; 3. ex communi officio charitatis [out of the common office and charity], by the Law of nature, charity tying one member to help another;

4. Not authoritatively by special office; but all authority here is from the Word occasionally spoken. The pastor is to preach, 1. publicly; 2. to the Church as the Church. 3. with a pastoral obligation to all alike, whether he converse daily with them or not. 4. not only by the tie of common charity, but by a virtue of a special office.

5. With authority both objective from the Word and official from his charge. 6. and is obliged to separate himself for this charge allanerly [singly, especially or wholly], as a watchman who must give an account in a special manner to Jesus Christ.</p></blockquote>

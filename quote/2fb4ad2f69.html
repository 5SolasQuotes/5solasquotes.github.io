<main class="wrap"><figure class="quote" id="q-2fb4ad2f69" data-kw="">
<blockquote><p>Herein it is not amiss to be noted that not only some small church truly so called, though in some points imperfect, but many churches may go astray, whole populous churches may be seduced. For truly people, whether sole and single or assembled and making a church or churches, are but people, and therefore prone to sin and soon deceived; and as the moon does often eclipse, so churches may sometimes err.

And yet another good observation it is, that if anyone therefore will needs be willful and unwilling to contend to perfection because all people necessarily have imperfections, verily that person is unwise and wants grace and can be no child of the church of God, which is a house of such people as invoke and call on the holy name of God. And whosoever so does, of duty must evermore more and more depart as far as possible from all iniquity.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/john-prime.html">John Prime</a></span><span class="wk"><span class="lbl">Work:</span> <cite>An Exposition and Observations upon Saint Paul to the Galatians. Together with Incident Questions Debated and Motives Removed</cite>, (Oxford, 1587). Quoted in Gerald L. Bray, Timothy F. George, Scott M. Manetsch (eds), Reformation Commentary on Scripture X: Galatians, Ephesians (Downers Grove IL: IVP Academic, 2011), p. 16.</span></figcaption>

</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-77a37dace4" data-kw="">
<blockquote><p>The purposes of Deity are not lawless and arbitrary. His will is determined by the perfections of His nature. To say, therefore, that there are things which He cannot do, is simply to affirm that He cannot will them, and to say that He cannot will them, is just to assert that they are inconsistent with the perfections of His Being. In such cases, consequently, we do not limit, we only define the power of God …

It is His glory to be what He is. The possession of infinite perfections and the enjoyment within Himself of unchanging blessedness, independence and self-sufficiency, are characteristics of the Deity which render it impossible that His manifold works should spring from any other motive but the counsel of His Own will.</p></blockquote>

</figure><figure class="quote" id="q-ee49ad5efe" data-kw="">
<blockquote><p>Our consent [with Romanists on the state of perfection] I will set down in two conclusions: I. All true believers have a state of true perfection in this life: Mt. 5:48, ‘Be you perfect as your father in heaven is perfect.’ Gen. 6:9, ‘Noah was a just and perfect man in his time, and walked with God.’ Gen. 17:1, ‘Walk before me and be perfect.’ And sundry kings of Judah are said to walk uprightly before God with a perfect heart, as David, Josiah, Hezekiah, etc. And Paul accounts himself with the rest of the faithfull to be perfect, saying, ‘Let us all that are perfect be thus minded.’ Phil. 3:15. Now this perfection has two parts: The first is the imputation of Christ’s perfect obedience, which is the ground and fountain of all our perfection whatsoever. Heb. 10:14, ‘By one offering,’ that is, by his obedience in his death and passion, ‘has He consecrated, or made perfect, forever them that believe.’ The second part of Christian perfection is sincerity, or uprightness, standing in two things: The first is to acknowledge our imperfection and unworthiness in respect of ourselves: and hereupon, though Paul had said he was perfect, yet he adds further that he did account of himself, not as though he had attained to perfection: but did forget the good things behind, and endeavored himself to that which was before. Here therefore it must be remembered that the perfection whereof I speak may stand with sundry wants and imperfections. It is said of Asa that his heart was perfect with God all his days, and yet he pulled not down the high places, and being diseased in his feet, he put his trust in the physicians and not in the Lord. Secondly this uprightness stands in a constant purpose, endeavor and care to keep not some few, but all and every commandment of the Law of God, as David says, Ps. 119:6, ‘Then shall I not be confounded, when I have respect to all thy commandments.’ And this endeavor is a fruit of perfection, in that it proceeds from a man regenerate. For, as all men through Adam’s Fall, have in them by nature the seeds of all sin, none excepted, no not the sin against the Holy Ghost: so by grace of regeneration through Christ, all the faithful have in them likewise the seeds of all virtues needfull to salvation: and hereupon they both can and do endeavor to yield perfect obedience unto God, according to the whole law. And they may be termed ‘perfect,’ as a child is called a perfect man: though it want [lack] perfection of age and stature and reason: yet has it perfection of parts: because it has all and every part and faculty both of body and soul that is required to a perfect man.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/william-perkins.html">William Perkins</a></span><span class="wk"><span class="lbl">Work:</span> <cite>A Reformed Catholic, The Eleventh Point</cite>, … ([Cambridge] 1598), ch. 13. ‘Of the State of Perfection’, pp. 980-81</span></figcaption>

</figure><figure class="quote" id="q-159ca6531c" data-kw="">
<blockquote><p>It is the never-failing characteristic of true religion, to prompt its professor, in imitation of the great apostle of the Gentiles, forgetting the things that are behind, to press forward towards the prize of his high and heavenly calling; and to be continually advancing in his Christian course, and never to be satisfied with his actual attainments, but to be striving to root out every remaining corruption, and to perfect every Christian grace, that he may bring every thought and feeling into the obedience of Christ;—to live more habitually under the influence of that divine Spirit, of which Christians are said, in Scripture, to be the temples;—and to feel more constantly and more powerfully the life and force of this blessed principle.</p></blockquote>

<blockquote><p>7th Problem: Whether unregenerate or regenerate man sanctifies himself, or actively concurs to it? I respond: concerning the former, negatively; concerning the latter, affirmatively, if indeed sanctification in the moment and in the second act is understood, that is, its excitation and ἐνέργεια [energeia, energy/activity], or continuation. And thus the sayings 2 Cor. 7:1; 1 Jn. 3:3 are to be understood.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/gisbertus-voetius.html">Gisbertus Voetius</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Disputation 29, ‘On Regeneration’, pt. 1</cite>, (1639) tr. AI by Roman Prestarri in Select Theological Disputations (1655), vol. 2, pp. 432-65 Latin at Confessionally Reformed Theology</span></figcaption>

<div class="actions"><button class="copy" data-copy="“7th Problem: Whether unregenerate or regenerate man sanctifies himself, or actively concurs to it? I respond: concerning the former, negatively; concerning the latter, affirmatively, if indeed sanctification in the moment and in the second act is understood, that is, its excitation and ἐνέργεια [energeia, energy/activity], or continuation. And thus the sayings 2 Cor. 7:1; 1 Jn. 3:3 are to be understood.”

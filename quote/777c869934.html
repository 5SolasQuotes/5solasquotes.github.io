<main class="wrap"><figure class="quote" id="q-777c869934" data-kw="">
<blockquote><p>1. Indifferent Things are far below the scale of divine institutions, though these institutions are but positive, and not of eternal goodness and righteousness. All the appointments of God and Christ are lifted up into that state the divine appointment designs them to; and shall, if used according to those appointments, be made efficacious to those ends for which they are appointed, according to the effectual working of that power and grace from which they received their original: So that they do make us better, they do commend us to God, if we observe the will and law of God concerning them; and we are the worse in the sinful neglect of them, according to the degree of neglect. 2. They are not of the scale of those things, wherein that order, of which God, by the very laws of rational nature is the author, stands; and not of confusion; so that though this order runs, or ought to run along, and conduct all human actions, and so is not in itself a point of religion; yet when it is applied to religious services and actions, does indeed commend our religious actions and services to God, and the contrary is an evil. 3. Of the same account is that euschemonia, or decency of religious actions, required by God before Himself, and before the holy angels, of which the apostle discourses; ‘Every man praying with his Head uncovered, dishonoureth his head;’ every Woman praying so, ‘ought to have a covering on her head, because of the angels;’ such a distinction of sexes being founded in nature; and in what is beyond nature, the grave customs of ages and places, carry a great weight of determination.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/thomas-beverly.html">Thomas Beverly</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Principles of Protestant Truth &amp; Peace in Four Treatises… (London, 1683)</cite>, pp. 39-40</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/worship/head-coverings-in-worship.html">Head Coverings in Worship</a></span></div>

</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-87a9dd8be8" data-kw="">
<blockquote><p>Paul, when writing to the Corinthians who were Greeks, gives the preference to that [Greek] custom [of men having an uncovered head in worship]. In doing so, he did not intend to lay down a universal law which should be everywhere observed. He merely accommodated himself to a custom of civil life observed, at that time, by those to whom he was writing. This is admirably, I think, explained by [Johann H.] Altingius in a discourse already quoted… It must not be supposed that the same rule which he had given to the Corinthians from a regard to their customs would have been invariably given to Jews dwelling in their own country, or to Egyptians or Arabians, who followed a different custom. The usages of civil life are endlessly varied by place and time. Consequently what, at one place and time, is sufficiently becoming, would be, at anotlier place and time highly unbecoming. Yet the apostolic rule has been in force, since that time, among almost all Christians. Is it because keeping the head uncovered is universally regarded by them as a token of reverence? I hardly think so. It has spread widely in the north, through the nations of France and Germany. But among the Jews, the Greeks, ancient Italy, and the whole of the East, the custom is wholly unknown. It appears, therefore, to belong to the liberty of the New Testament. ‘With uncovered head,’ says Tertullian, ‘because we are not ashamed.&#x27;</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/herman-witsius.html">Herman Witsius</a></span><span class="wk"><span class="lbl">Work:</span> <cite>pp. 84-90 of Dissertation 4, ‘On Gestures in Prayer’ in Sacred Dissertations on the Lord’s Prayer (1689; Edinburgh: Thomas Clark, 1708)</cite></span></figcaption>
<div class="meta"><span class="t"><a href="../topics/worship/head-coverings-in-worship.html">Head Coverings in Worship</a></span></div>

<blockquote><p>…to argue that head means ‘pre-eminent one’ without any nuance of leadership or authority seems clearly to fly in the face of an abundance of evidence from both the New Testament and numerous other ancient texts.</p></blockquote>

</figure><figure class="quote" id="q-f5c66c7321" data-kw="">
<blockquote><p>Honor is but the expressing of the inward respect we bear to persons by outward signs, speeches and gestures; without the outward signification of it thus, no man can tell who is honored: and as is the custom of the nation, so we express this, whether by uncovering the head, bowing the body, etc.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/giles-firmin.html">Giles Firmin</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Stablishing against Shaking: or a Discovery of the… Deluded People called, Quakers… (London, 1656), p. 22 Firmin was an English clergyman with Independent, puritan leanings.</cite></span></figcaption>

</figure><figure class="quote" id="q-0bb30d911a" data-kw="">
<blockquote><p>Sundry religious ordinances are appointed in the New Testament: that there should be every Lord’s Day a collection for the poor: that the man being after a more excellent manner the image of God should pray bare-headed, not being ashamed to show his head, but having a kind of headship over the woman; and the woman should cover her head, when she prays… no Christian Church can consist without some external rites and ceremonies, which if they be not repugnant to the Word of God, are to be observed by us, as these ordinances of religion were by the Jews. …In these indifferent things which in their own nature are neither good, nor evil, we must not contend, breaking the peace and unity of the Church.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/william-jones.html">William Jones</a></span><span class="wk"><span class="lbl">Work:</span> <cite>A Commentary upon the Epistles of Saint Paul to Philemon, &amp; to the Hebrews... (London, 1635), on Heb. 9:1</cite>, pp. 327-28</span></figcaption>

<main class="wrap"><figure class="quote" id="q-cb67543f31" data-kw="">
<blockquote><p>It may well be, and I find it convincing, that there is a great deal of continuity between the mainstream of Protestant reformers, especially in the Reformed tradition, and the thought of Thomas Aquinas, on a wide variety of points, some metaphysical, some doctrinal, and some moral and practical. But it is not the case that the Reformers as such were concerned with being faithful Thomists. The teaching of Thomas Aquinas, whether engaged directly or filtered through various traditions and appropriated as such, was of instrumental value to the Reformers. The point for the Reformers in engaging Thomas was not so that they could become more faithful Thomists. Rather, they used Thomas to the extent that they found Thomas and his teachings helpful in clarifying the true teachings of the church and necessary reforms. The same is true, mutatis mutandis, for other predecessors, whether Bernard of Clairvaux, Duns Scotus, or Gregory of Rimini, which explains in part the persistent eclecticism of the Reformers—considered both individually and corporately—even where there is more or less clear dependence or reliance on an earlier authority. In this way, there is the potential for misunderstanding if something identified as Reformed Thomism or Calvinist Thomism is taken to mean that there was a self-styled attempt by Reformed theologians to be Thomists in the sixteenth or seventeenth centuries… The ‘sounder scholastics’ (like Thomas) are put to positive use more often essentially because they are sounder. But where a Reformer thinks that Thomas is mistaken or not helpful, there is little hesitation to depart from (or ignore) his thought.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/jordan-j-ballor.html">Jordan J. Ballor</a></span><span class="wk"><span class="lbl">Work:</span> <cite>‘The Prophetic Role of The Protestant Reformation’</cite>, (2024) in Hanover Review, vol. 3, no. 1 (2024)</span></figcaption>

</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-2f36d8f083" data-kw="">
<blockquote><p>…to take a simple bodily action as an example, the intellect and will constitute the formal-cum-final cause of the action, of which the firing of the neurons, flexing of the muscles, and so on are the material-cum-efficient causes. That it is a bodily action is due to its matter and the way the bodily parts interact; that it is a bodily action with a certain specific end in view (rather than an involuntary reflex or an unconscious robotic movement) is due to its form and final cause. There are not (as there are for the Cartesian dualist) two substances with events going on in each that are somehow mysteriously correlated. There is one substance and one set of events having both formal and material, and final- and efficient-causal components.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/edward-feser.html">Edward Feser</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Aquinas: a Beginner’s Guide</cite>, (OneWorld, 2010), ch. 4, ‘Psychology’ | ‘The Soul’, pp. 114-22 ‘Hylemorphic Dualism’, pp. 138-47, pp. 141-42</span></figcaption>

<blockquote><p>Upright common sense (or practical reason) tends to accurately recognize moral judgments before one can formally articulate and intellectually conclude the sometimes complex moral principles involved (Ps. 119:66; Rom. 2:14-15; Lk. 10:36-37; 14:5; Jn. 3:21; 1 Cor. 10:15; 14:37; 1 Jn. 1:1-4; 2:20; 3:9-10, 18-19). In this respect philosophy ought to confirm and validate common sense. It is believed the principles laid out in this article do exactly that (albeit imperfectly due to my own unskillful dullness), and reflect and synthesize the gradations of ethical living in common life better…</p></blockquote>

<main class="wrap"><figure class="quote" id="q-b7093a9d35" data-kw="">
<blockquote><p>Now Prosper shows how original sin passes over all, not by the will of God; and secondly, how it passes over all by the will of God: Not by the will of God instituente; but by the will of God judicante: His words are these: Haec servitus non est institutio Dei, sed judicium. This slavery of sin which came upon all by Adam’s sin is not God’s institution but his judgment. As much as to say it came not upon a man by God’s first creation, but by his judgment upon him, because of his first trangression; so that if divine judgment be the will of God; it is apparent Prosper is so far from denying that slavery to have come upon all men by the just will of God, as that he expressly acknowledges it.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/william-twisse.html">William Twisse</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Riches of God’s Love unto the Vessels of Mercy, consistent with his absolute Hatred or Reprobation of the Vessels of Wrath, or an answer unto a book entitled, God’s Love unto Mankind</cite>, … (d. 1646; Oxford, 1653), bk. 2, An Examination of Certain Passages inserted into Mr. Hord’s Discourse, Answer to the Additions, p. 61</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/sin/original-sin.html">Original Sin</a></span></div>

</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-0f7d0d440a" data-kw="">
<blockquote><p>7. We are all so very much in the dark as to the clear and distinct apprehension of the true nature of original, inherent pravity or sin that we must needs be as much ignorant of the true nature of that inherent sanctity or righteousness which is its contrary, or cure. Learned [Matthew Flacius] Illiricus thought it was a substance, which he has in his Clavis pleaded for at large. Others call it a habit, others a nature, or natural inclination and a privation of a natural inclination to God: others call it an indisposition of the mind and will to holy truth and goodness, and an ill disposition of them to error and evil. Others call it only the inordinate lust of the sensitive faculties, with a debility of reason and will to resist it. And whilst the nature of the soul itself and its faculties are so much unknown to itself, the nature of original pravity and righteousness must needs be very much unknown.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/richard-baxter.html">Richard Baxter</a></span><span class="wk"><span class="lbl">Work:</span> <cite>A Christian Directory, or a Sum of Practical Theology</cite>, ... (London: 1673), Question 42, ‘But the great question is, How the Holy Ghost is given to infants in baptism?…’, p. 819</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/sin/original-sin.html">Original Sin</a></span></div>

</figure><figure class="quote" id="q-429a546bdb" data-kw="Original Sin Mortification Forgiveness">
<blockquote><p>The corruption of nature, during this life, does remain in those that are regenerated (Rom. 7:18, 23; Eccl. 7:20; 1 John 1:8); and although it be through Christ pardoned and mortified, yet both itself, and the first motions thereof, are truly and properly sin (Rom. 7:23–25; Gal. 5:17).</p></blockquote>

</figure><figure class="quote" id="q-6156ddcc2e" data-kw="Author of sin The Fall Original Sin">
<blockquote><p>It is true that nature has received a mortal wound, but there is a great difference between a wound inflicted from without, and one inherent in our first condition. It is plain that this wound was inflicted by sin; and, therefore, we have no ground of complaint except against ourselves.</p></blockquote>

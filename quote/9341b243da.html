<main class="wrap"><figure class="quote" id="q-9341b243da" data-kw="">
<blockquote><p>Now it remains to address the Magistrate, whom I judge can be described as a person chosen and instituted by God to defend the divine laws in matters of external discipline, by inflicting bodily punishment upon transgressors and by supporting and encouraging the good. The divine plan selects many people who do not act as magistrates. The ministers of the Church are one example. They still defend God’s word and laws, but not only in matters of external instruction. It is the duty of ministers to reach into the depths and motions of souls by way of the divine word. The Holy Spirit acts here as well, joining His strength with that of orthodox preaching and of the sacraments distributed by the Church.

The magistrate works alone in edifying and punishing transgressors. The minister binds the guilty and the incorrigible in the name of God, and excludes them from the kingdom of Heaven unless they correct their ways. The magistrate inflicts external punishment, working through the use of the sword. Both ministers and magistrates act to nurture the pious, but in different ways. The magistrate increases them in works, honours and merits. The minister consoles them through the promises of God and the sacraments.

The magistrate assures that the laws are kept most carefully, the guilty are punished, and the good are both helped and nurtured. The law acts as a mute magistrate, while the magistrate represents the moving and speaking law. Certainly he is also a minister of God since, as Paul said, magistrates sing the praises of those who live justly [Romans 13:3]. The magistrate wields the sword against the wicked, acting as the avenger and champion of God, and looks to nothing else but the salvation of men.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/peter-martyr-vermigli.html">Peter Martyr Vermigli</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Of a magistrate, and the difference between civil and ecclesiastical power (1561) in W. J. T. Kirby (ed.), The Zürich Connection and Tudor Political Theology</cite></span></figcaption>

<blockquote><p>The duty of man and woman joined in marriage, requireth that they two should be as one person, and cleave each to other with mutual love and liking in society of life, until it please God, who hath coupled them together in this bond, to set them free from it, and to dissociate and sever them by death. But the inordinate fancies &amp; desires of our corrupt nature have soe inveigled Adam’s seed in many places, that men have accustomed to put away their wives upon every trifling mislike &amp; discontentment: yea, the Jews supposed themselves to be warranted by God’s law to do it, so that whosoever put away his wife gave her a bill of divorcement.

This perverse opinion &amp; error of theirs our Saviour Christ reproved teaching that divorcements may not be made for any cause save whoredom only. For whosoever (saith he) shall put away his wife except it be for whoredom and shall marry another doth commit adultery and who so marrieth her which is put away, doth commit adultery. Now about the meaning of these words of Christ expressed more fully by one of the Evangelists, by others more sparingly, there hath a doubt arisen: and diverse men even from the primitive churches time have been of diverse minds.

For many of the fathers have gathered thereupon, that if a man’s wife committed whoredom &amp; fornication, he might not only put her away, but marry another. Some others, and among them namely S. Augustine, have thought that the man might put away his wife but marry another he might not.

The School divines of latter years, &amp; the Canonists, as for the most part they were addicted commonly to S. Austin’s judgment, did likewise follow him herein &amp; the Pope’s maintaining their doctrine for Catholic, have possessed the church of Rome with this opinion. But since in our days the light of good learning both for arts &amp; tongues hath shined more brightly by God’s most gracious goodness then in the former ages, and the holy scriptures by the help thereof have been the better understood: the Pastors and Doctors of the reformed Churches have perceived &amp; shewed, that if a man’s wife defile her self with fornication, he may not only put her away by Christ’s Doctrine but also marry another. Wherein that they teach agreeably to the truth, and not erroneously, as Jesuits &amp; Papists do falsely and unjustly charge them.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/john-rainolds.html">John Rainolds</a></span><span class="wk"><span class="lbl">Work:</span> <cite>A defence of the judgment of the Reformed churches. That a man may lawfully not only put away his wife for her adultery, but also marry another. Wherein both Robert Bellarmine the Jesuits Latin treatise, and an English pamphlet of a nameless author maintaining the contrary are confuted by John Raino</cite>, (Dordrecht: George Walters, 1609), pp 1-2.</span></figcaption>

— John Rainolds, A defence of the judgment of the Reformed churches. That a man may lawfully not only put away his wife for her adultery, but also marry another. Wherein both Robert Bellarmine the Jesuits Latin treatise, and an English pamphlet of a nameless author maintaining the contrary are confuted by John Raino, (Dordrecht: George Walters, 1609), pp 1-2.">Copy</button><a class="share" href="https://x.com/intent/post?text=%E2%80%9CThe+duty+of+man+and+woman+joined+in+marriage%2C+requireth+that+they+two+should+be+as+one+person%2C+and+cleave+each+to+other+with+mutual+love+and+liking+in+society+of+life%2C+until+it+please+God%2C+who+hath+coupled+them+together+in+this+bond%2C+to+set+them+free+from+it%2C+and+to+dissociate+and+sever+them+by+death.+But+the+inordinate+fancies+%26+desires+of+our+corrupt+nature+have+soe+inveigled+Adam%E2%80%99s+seed+in+many+places%2C+that+men+have+accustomed+to+put+away+their+wives+upon+every+trifling+mislike+%26+discontentment%3A+yea%2C+the+Jews+supposed+themselves+to+be+warranted+by+God%E2%80%99s+law+to+do+it%2C+so+that+whosoever+put+away+his+wife+gave+her+a+bill+of+divorcement.%0A%0AThis+perverse+opinion+%26+error+of+theirs+our+Saviour+Christ+reproved+teaching+that+divorcements+may+not+be+made+for+any+cause+save+whoredom+only.+For+whosoever+%28saith+he%29+shall+put+away+his+wife+except+it+be+for+whoredom+and+shall+marry+another+doth+commit+adultery+and+who+so+marrieth+her+which+is+put+away%2C+doth+commit+adultery.+Now+about+the+meaning+of+these+words+of+Christ+expressed+more+fully+by+one+of+the+Evangelists%2C+by+others+more+sparingly%2C+there+hath+a+doubt+arisen%3A+and+diverse+men+even+from+the+primitive+churches+time+have+been+of+diverse+minds.%0A%0AFor+many+of+the+fathers+have+gathered+thereupon%2C+that+if+a+man%E2%80%99s+wife+committed+whoredom+%26+fornication%2C+he+might+not+only+put+her+away%2C+but+marry+another.+Some+others%2C+and+among+them+namely+S.+Augustine%2C+have+thought+that+the+man+might+put+away+his+wife+but+marry+another+

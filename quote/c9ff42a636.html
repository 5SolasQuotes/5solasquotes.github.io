<main class="wrap"><figure class="quote" id="q-c9ff42a636" data-kw="">
<blockquote><p>At the same time, as he works not effectually in all, but only where the Spirit, the inward teacher, illuminates the heart, he subjoins, to every one who believes. The gospel is indeed offered to all for their salvation but the power of it appears not everywhere: and that it is the savor of death to the ungodly, does not proceed from what it is, but from their own wickedness. By setting forth but one salvation he cuts off every other trust. When men withdraw themselves from this one salvation, they find in the gospel a sure proof their own ruin. Since then the gospel invites all to partake of salvation without any difference, it is rightly called the doctrine of salvation: for Christ is there offered, whose peculiar office is to save that which was lost; and those who refuse to be saved by him, shall find him a judge. But everywhere in Scripture the word salvation is simply set in opposition to the word destruction: and hence we must observe, when it is mentioned, what the subject of the discourse is. Since then the gospel delivers from ruin and the curse of endless death, its salvation is eternal life.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/john-calvin.html">John Calvin</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Commentary on Romans</cite>, 1.16.</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/the-trinity/the-holy-spirit.html">The Holy Spirit</a></span></div>

</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-82f50666e6" data-kw="">
<blockquote><p>It is by means of the gospel that the Holy Spirit continues to apply Christ, with His righteousness and fullness, to the hearts of believers for increasing their sanctification and consolation. They are said in Scripture to be sanctified “through thy truth” (John 17:17–19), to be clean through the word that Christ has spoken to them (John 15:3), and to have their hearts purified by faith (Acts 15:9). The apostle Paul presented this prayer for the saints at Ephesus: “That Christ may dwell in your hearts by faith…that ye might be filled with all the fulness of God” (Eph. 3:17, 19). And he informed them that they were “built upon the foundation of the apostles and prophets” (Eph. 2:20). It is in proportion, then, as the saints are enabled to believe with application to themselves the offers and promises of the gospel and to trust in Jesus Christ for salvation that they advance in holiness and comfort. And it is “in the unity of the faith, and of the knowledge of the Son of God” that they all come “unto a perfect man, unto the measure of the stature of the fullness of Christ.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/john-colquhoun.html">John Colquhoun</a></span><span class="wk"><span class="lbl">Work:</span> <cite>A Treatise on the Law and Gospel</cite>, (Grand Rapids: Reformation Heritage Books), 110-11.</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/the-trinity/the-holy-spirit.html">The Holy Spirit</a></span></div>

<blockquote><p>John Bidle’s XII Arguments Drawn out of the Scripture; wherein the commonly Received Opinion, Touching the Deity of the Holy Spirit, Is clearly and fully Refuted (1647) was answered by several Reformed theologians and scholars, both continental and British. These responses were full, demonstrative, and clear; but they were written largely for academics. It fell to a young parish minister, Matthew Poole, not yet thirty years of age, to provide a concise and popular response, for the edification of the common man. Poole’s Blasphemer Slaine with the Sword of the Spirit remains one of the best popular defenses of the Deity of the Holy Spirit in the English language.</p></blockquote>

<main class="wrap"><figure class="quote" id="q-578fd89c59" data-kw="">
<blockquote><p>This epistle to the Galatians is polemical in nature because in it Paul is upbraiding the Galatians for having so easily turned away from the true doctrine of the gospel and fallen into the works of the law, which they were preaching as necessary for justification. But when Paul starts teaching about true righteousness, which is found in Christ Jesus without regard to the law or to works, the tone changes and the epistle becomes more didactic in nature.

In the first part of the epistle he calls the Galatians back from the error of justification by works into which they had fallen because of the teaching of false apostles who had visited them after his departure. In the second part he teaches what the difference is between the righteousness that comes from faith and the righteousness that comes from works.

In the epistle to the Romans, Paul’s main argument is that God is the God not only of the Jews but also of the Gentiles. In order to prove this he brings in all kinds of considerations, and to make things as clear as possible he adopts the technique of starting with an explanation of righteousness by faith, to which the Gentiles have been called by grace. He then describes the righteousness that comes by the law, under which the Jews had struggled until Christ came teaching justification by faith, without reference to works. In this epistle, Paul does exactly the same thing.

The false apostles had led the people astray by preaching circumcision and the works of the law, insisting that they were necessary for justification by faith. The apostle refutes their position and asserts that even uncircumcised Gentiles can belong to Christ. In order that the Galatians might understand this more easily, he adopts the same method that he used in the epistle to the Romans. Thus the epistle to the Galatians may rightly be called a summary of the epistle to the Romans.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/erasmus-sarcerius.html">Erasmus Sarcerius</a></span><span class="wk"><span class="lbl">Work:</span> <cite>In Epistolas Divi Pauli ad Galatas et Ephesios Annotationes</cite>, (Frankfurt, 1542). Quoted in Gerald L. Bray, Timothy F. George, Scott M. Manetsch (eds), Reformation Commentary on Scripture X: Galatians, Ephesians (Downers Grove IL: IVP Academic, 2011), p. 4.</span></figcaption>

<blockquote><p>The first commandment teaches us that God wants us to sincerely trust Him. Yet we must fear Him about everything else. … So the good works required by the first commandment are holy and must be obeyed. But who can live up to them? Certainly no one can completely obey the first commandment. Everyone is a sinner except for Christ. Christ, however, comes to us and says, “I have shed my blood for you. My blood cries out on your behalf.” Out of His grace and kindness, He brings us the forgiveness of our sins at no cost to us whatsoever.</p></blockquote>

</figure><figure class="quote" id="q-3dcf2df3aa" data-kw="">
<blockquote><p>For because Paul had taught, that a man is justified by faith without works, hence some inferred, that in whatever manner a man live, it, equally suffices, that he persuade himself that Christ is his Saviour. Which they could have inferred with no plausibility, if that had been evident which the very learned man will have to be so, viz. That Paul, by faith understood evangelical godliness. But because Paul’s words evidently bore that sense, that faith was a thing distinct from all the works of holiness, as in reality it is, hence arose the pretext of calumny. I say, of calumny: for though Paul taught, that works contribute nothing to justification, or to procure a man’s title to salvation; yet he always taught, that they were not only useful, but also necessary to salvation, and that it is impossible, that sanctification should be separated from justification. James treads in the same path, and teaches that it is necessary that he who is justified by faith, should also be justified by works: that is, perform these works which are the evidences and effects of righteousness, and by which it is demonstrated not only before men, but also before God, that he is righteous: according to that of John, “He who doeth righteousness is righteous,” 1 John 3:7. Indeed there is a double justification: one of a man sinful in himself, whereby he is absolved from sin, and declared to have a title to eternal life, on account of Christ’s righteousness apprehended by faith, which Paul inculcated: another of a man, righteous already, sanctified by the Spirit of Christ, and who is declared to be such, by his words and actions. James teaches, that this is so necessary, and so connected with the former, that he is deceived who boasts of that and is destitue of this.</p></blockquote>

<blockquote><p>From an ethical point of view the difference practically amounts to this that, if the reward due to condign merit be withheld, there is a violation of right and justice and the consequent obligation in conscience to make restitution, while, in the case of congruous merit, to withhold the reward involves no violation of right and no obligation to restore, it being merely an offence against what is fitting or a matter of personal discrimination (acceptio personarum). Hence the reward of congruous merit always depends in great measure on the kindness and liberality of the giver, though not purely and simply on his good will.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/joseph-pohle.html">Joseph Pohle</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Catholic Encyclopedia</cite>, s.v. “Merit” (1911)</span></figcaption>

</figure><figure class="quote" id="q-beb1f4e886" data-kw="">
<blockquote><p>If someone could believe with a certain and constant faith, and could understand the magnitude of it all, that he is the son and heir of God, he could regard all the power and wealth of all the kingdoms of the world as filth and refuse in comparison with his heavenly inheritance. Whatever the world has that is sublime and glorious would make him sick. And the greater the pomp and glory of the world is, the more detestable it would be to him. In other words, whatever the world admires and exalts most, that is foul and worthless in his eyes. For what is the whole world with its power, wealth, and glory in comparison with God, whose heir and son he is? He also desires anxiously to depart with Paul and to be with Christ (Phil. 1:23). Nothing more delightful could happen to him than a premature death, which he would embrace as the most joyous peace; for he would know that it is the end of all his evils and that through it he comes into his inheritance. In fact, a man who believed this completely would not go on living very long but would soon be consumed by his overwhelming joy.</p></blockquote>

<div class="actions"><button class="copy" data-copy="“If someone could believe with a certain and constant faith, and could understand the magnitude of it all, that he is the son and heir of God, he could regard all the power and wealth of all the kingdoms of the world as filth and refuse in comparison with his heavenly inheritance. Whatever the world has that is sublime and glorious would make him sick. And the greater the pomp and glory of the world is, the more detestable it would be to him. In other words, whatever the world admires and exalts most, that is foul and worthless in his eyes. For what is the whole world with its power, wealth, and glory in comparison with God, whose heir and son he is? He also desires anxiously to depart with Paul and to be with Christ (Phil. 1:23). Nothing more delightful could happen to him than a premature death, which he would embrace as the most joyous peace; for he would know that it is the end of all his evils and that through it he comes into his inheritance. In fact, a man who believed this completely would not go on living very long but would soon be consumed by his overwhelming joy.”

— Martin Luther, Luther’s Works, Vol. 26: Lectures on Galatians, 1535, Chapters 1–4, ed. Jaroslav Jan Pelikan, Hilton C. Oswald, and Helmut T. Lehmann, vol. 26 (Saint Louis: Concordia Publishing House, 1999), 392–93.">Copy</button><a class="share" href="https://x.com/intent/post?text=%E2%80%9CIf+someone+could+believe+with+a+certain+and+constant+faith%2C+and+could+understand+the+magnitude+of+it+all%2C+that+he+is+the+son+and+heir+of+God%2C+he+could+regard+all+the+power+and+wealth+of+all+the+kingdoms+of+the+world+as+filth+and+refuse+in+comparison+with+his+heavenly+inheritance.+Whatever+the+world+has+that+is+sublime+and+glorious+would+make+him+sick.+And+the+greater+the+pomp+and+glory+of+the+world+is%2C+the+more+detestable+it+would+be+to+him.+In+other+words%2C+whatever+the+world+admires+and+exalts+most%2C+that+is+foul+and+worthless+in+his+eyes.+For+what+is+the+whole+world+with+its+power%2C+wealth%2C+and+glory+in+comparison+with+God%2C+whose+heir+and+son+he+is%3F+He+also+desires+anxiously+to+depart+with+Paul+and+to+be+with+Christ+%28Phil.+1%3A23%29.+Nothing+more+delightful+could+happen+to+him+than+a+premature+death%2C+which+he+would+embrace+as+the+most+joyous+peace%3B+for+he+would+know+that+it+is+the+end+of+all+his+evils+and+that+through+it+he+comes+into+his+inheritance.+In+fact%2C+a+man+who+believed+this+completely+would+not+go+on+living+very+long+but+would+soon+be+consumed+by+his+overwhelming+joy.%E2%80%9D%0A%0A%E2%80%94+Martin+Luther%2C+Luther%E2%80%99s+Works%2C+Vol.+26%3A+Lectures+on+Galatians%2C+1535%2C+Chapters+1%E2%80%934%2C+ed.+Jaroslav+Jan+Pelikan%2C+Hilton+C.+Oswald%2C+and+Helmut+T.+Lehmann%2C+vol.+26+%28Saint+Louis%3A+Concordia+Publishing+House%2C+1999%29%2C+392%E2%80%9393.&amp;url=https%3A%2F%2F5solasquotes.github.io%2Fquote%2Fbeb1f4e886.html&amp;via=5Solas" target="_blank" rel="noopener">Share on X</a><a class="perma" href="../quote/beb1f4e886.html">Permalink</a><a class="src" href="https://heidelblog.net/2024/03/luther-the-world-and-its-glory-is-nothing-comp

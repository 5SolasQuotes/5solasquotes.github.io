<main class="wrap"><figure class="quote" id="q-c8631a09ca" data-kw="">
<blockquote><p>To the kirks where no ministers can be had presently, must be appointed the most apt men that distinctly can read the common prayers and the scriptures, to exercise both themselves and the kirk, till they grow to greater perfection; and in process of time he that is but a reader may attain to the further degree, and by consent of the kirk and discreet ministers, may be permitted to minister the sacraments;</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/first-scottish-book-of-discipline.html">First Scottish Book of Discipline</a></span><span class="wk"><span class="lbl">Work:</span> <cite>First Book of Discipline</cite>, Scottish First Book of Discipline</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/worship/public-worship.html">Public Worship</a></span></div>

</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-6c67a959d7" data-kw="">
<blockquote><p>Another fault is that all the people are appointed in diverse places to say after the minister, whereby not only the time is unprofitably wasted and a confused voice of the people, one speaking after another, caused but an opinion bred in their heads that those only be their prayers which they say and pronounce with their own mouths, which causes them to give the less heed to the rest of the prayers which they rehearse not after the minister, which, notwithstanding are as well their prayers as those which they pronounce after the minister otherwise than the order which is left unto the church of God does bear. For God has ordained the minister to this end, that, as in public meetings he only is the mouth of the Lord from Him to the people, even so he ought to be the only mouth of the people from them unto the Lord, and that all the people should attend to that which is said by the minister, and in the end both declare their consent to that which is said, and their hope that it should so be and come to pass which is prayed, by the word “Amen;” as St. Paul declares in the epistle to the Corinthians [1 Cor. 14:6], and Justin Martyr shows to have been the custom of the churches in his time. Although these blots in the Common Prayer be such as may easily enough appear unto any which is not wedded to a prejudicate opinion and that there is no great difficulty in this matter, yet I know that this treatise of prayer will be subject to many reprehensions and that there will not be wanting some probable colors also whereby these things may be defended if men will set themselves to strive and to contend: yet (for the desire that I have that these things should be amended and for the instruction of the simpler which are studious of the truth) I have been bold to utter that which I think, not doubting also but that the light of the truth shall be able to scatter all those mists of reasons which shall go about to darken the clearness thereof.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/thomas-cartwright.html">Thomas Cartwright</a></span><span class="wk"><span class="lbl">Work:</span> <cite>A Reply to an Answer made of Mr. Doctor Whitgift Against the</cite>, ([Hempstead] 1573), ‘To the next section contained in the 77th, 78th and a piece of the 79th page’, pp. 138-39</span></figcaption>

</figure><figure class="quote" id="q-7b42ef7128" data-kw="">
<blockquote><p>For they [the Independents] hold that although a congregation increase so much as that they cannot, or be so persecuted that they may not, meet safely in one place for the Word and sacraments, and supposing the Church of Jerusalem before the dispersion, Acts 8:1, to have been so numerous and to have accressed to so many thousands as could not receive the sacrament of the Lord’s Supper, nor ordinarily assemble into one place for the worship of God (that they received the Lord’s Supper in several companies and several houses is ordinarily collected from Acts 2:46, and breaking bread from house to house, which the Syriac expounds expressely of the Eucharist), Yet all this (say they) breaks not the Church, but they are still one particular church. Now if several companies of the same church assembled and receaving the Lord’s Supper in several places be not a breaking or dividing of the congregation, nor a deviation from the example of Christ, much less can they with any reason, charge our communicating by several companies at successive tables, in the same meeting place or assembly to be a breaking of the congregation or a deviation from Christ’s example.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/george-gillespie.html">George Gillespie</a></span><span class="wk"><span class="lbl">Work:</span> <cite>A Treatise of Miscellany Questions</cite>, pp. 221-22 of ch. 18, ‘Of the Use of a Table in the Lord’s Supper. And of the Communicants their Coming to &amp; Receiving at the Table’ in A Treatise of Miscellany Questions… (1649)</span></figcaption>

ef="https://reformedbooksonline.com/historic-reformed-quotes-on-social-distancing-the-adaptation-of-the-church/#:~:text=For%20they%20%5Bthe%20Independents%5D%20hold%20that,or%20a%20deviation%20from%20Christ%E2%80%99s%20example&amp;text=For%20they%20%5Bthe%20Independents%5D%20hold%20that%20although%20a&amp;text=the%20congregation%20or%20a%20deviation%20from%20Christ%E2%80%99s%20example" rel="noopener" target="_blank">Read it online · Reformed Books Online</a></div>
</figure><figure class="quote" id="q-ecb89ccf1c" data-kw="">
<blockquote><p>1. The benefits of a sound liturgy are: 1. to keep out heresy and ill words from public worship, 2. to be a help to men of unready utterance, 3. that the people may know beforehand what they join in. The inconveniences are: 1. the dulling of affection in hearing still the same words, 2. the tempting of slothful worldly candidates and ministers to learn no other way of praying when this will serve all their worldly turns. But I must add that this follows not from the imposing of a liturgy, but from the exclusion of other prayer and taking up with this alone.

2. The conveniences of praying from a habit are: 1. a just variation, as occasions vary, 2. help to fresh affection, 3. forcing ministers to get ability for utterance. The inconveniences are:

1. That the people know not till the words are past whether they may own them, and so hardly try all and follow with just consent.

2. That abundance of young, raw, unskillful men do ordinarily disgrace prayer by their unskillful methods and expressions.

3. That heretics and erroneous men have great opportunity to put their sins into their prayer, which yet the people should by joining in make their own were they sound (which they are not bound to do by sermons): And no man of understanding can choose, but suspect that weak ignorant ministers will be showing their weakness in the highest duties, and so must suspend their consent till late.

4. That less care will be taken in speaking to God than in speaking to men, while most sober ministers study their sermons.

5. That when to avoid disgraceful words and manner of praying, men must decree that no such weak or unready men shall be ministers, the number that can do it better will be so small as that most churches on earth must be so deprived of ministers and all public worship if that take place.

6. That by this means young ignorant men that by use can speak fluently and fervently in prayer shall be followed by the people when many great divines, judicious and holy that have not that readiness of utterance, shall be rejected as having not the Spirit.

7. That as all men’s bodies and minds be not in the like quickness and fitness at all times, but sometimes clouded by fumes or weakness, the public worship shall be as mutable, uncertain and various as men’s tempers are. All these on both sides are so great inconveniences that though both Formalists and Fanatics have derided me for it, I have formerly said, and still say that I believe that the best way to avoid both sorts of evils is to have meet set forms, which shall be owned by the Church as their professed desires, not being so long as to take up too much time from freer prayer, much less to forbid it, which Calvin wisely ordered for France and Geneva.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/richard-baxter.html">Richard Baxter</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Richard Baxter on Worship &amp; Catholicity against Separatism &amp; John Owen</cite>, (1684; RBO, 2024), pp. 53-54, on a mixture of a minister praying with forms in public worship with free prayer as the ideal.</span></figcaption>

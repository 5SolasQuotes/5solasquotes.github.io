<main class="wrap"><figure class="quote" id="q-abd7a1051c" data-kw="resurrection own power">
<blockquote><p>The first degree of Christ’s exaltation is put in his resurrection. For the Socinians, as they say Christ was a mere man, so they maintain that Christ did not raise himself by his own power, but was raised by God’s power. But the orthodox ascribe the cause of the resurrection to Christ himself no less than to the Father. Since the power of the Father and the Son is the same, they think that by the same the Father raised Christ and Christ raised himself. Did Christ rise by his own power? We affirm against the Socinians.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/francis-turretin.html">Francis Turretin</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Institutes of Elenctic Theology</cite>, 13.17.1–2</span></figcaption>

</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-346a73a762" data-kw="session right hand dominion">
<blockquote><p>This phrase is used to denote the supreme dignity and sway of Christ. The metaphor is taken from the custom of kings and chiefs, who are accustomed to place on their right hand those to whom they concede the nearest degree to them, both of honor and of power in governing. This phrase is understood of the nearest degree of honor in 1 K. 2:19, where Solomon, about to show his mother special honor, places her on his right hand. And in Ps. 45:9, the wife of the king (i.e., the church) is said to stand upon the right hand of the Messiah (i.e., in the next degree of dignity to him). It is used of dominion or the administration of a kingdom (Mt. 20:21).</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/francis-turretin.html">Francis Turretin</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Institutes of Elenctic Theology</cite>, 13.19.2</span></figcaption>

</figure><figure class="quote" id="q-f42ee4c27d" data-kw="extra calvinisticum circumscription">
<blockquote><p>For the more easily to evade the argument drawn from the ascension of Christ to prove the circumscription of Christ’s body, they deny that Christ truly and properly ascended; but only figuratively, inasmuch as he withdrew his visible presence from the world (although he still remains in the world invisibly). And the heaven into which he ascended (they maintain) is not the highest or third heaven (called the heaven of the blessed), but the heaven of the beatitude and kingdom of God (which is everywhere). We affirm that Christ ascended properly by a local movement from the lower places to the supreme heaven of the blessed; and deny the metaphorical disappearance against the Lutherans.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/francis-turretin.html">Francis Turretin</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Institutes of Elenctic Theology</cite>, 13.18.1</span></figcaption>

</figure><figure class="quote" id="q-0ff00e8d9b" data-kw="twofold state humiliation exaltation">
<blockquote><p>This is commonly held to be twofold: the one of emptying and humiliation; the other of exaltation and majesty; of suffering and of glory; of battle and of triumph; of the way and of the goal; of death and of life. The following demonstrate the verity of both. (1) The oracles of the Old Testament in which he is foretold. In Ps. 8 mention is made of his being made a little lower than the angels (which is the emptying) and of his being crowned with glory and honor (which is the exaltation). In Ps. 110:7, it is said of the Messiah, “He shall drink of the brook in the way; therefore shall he lift up the head.”</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/francis-turretin.html">Francis Turretin</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Institutes of Elenctic Theology</cite>, 13.9.1–2</span></figcaption>

</figure><figure class="quote" id="q-6b2d9a44b2" data-kw="local ascension against ubiquity">
<blockquote><p>Did Christ ascend properly by a local movement from the lower places to the supreme heaven of the blessed; or metaphorically by disappearance? We affirm the former and deny the latter against the Lutherans. This question is introduced on account of the Lutherans and those who ascribe ubiquity to the body of Christ.</p></blockquote>

<main class="wrap"><figure class="quote" id="q-042f495e37" data-kw="">
<blockquote><p>Q. What are the general things considered in all this matter of Creation?

A. First, the Creator of all these things, which is God the Father, the Son, and the holy Ghost.

Secondly, his omnipotencie, that he made all by his word, that is, by his only will, who calleth things that are not, as though they were.

Thirdly, that he made not all at once, and in a moment, but in six days.

Q. Why did he make them in six days, which could have perfected all in a moment?

A. First, that we might thereby more easily conceive, that the world was not made confusedly, or by chance, but orderly, and by counsel.

Secondly, that all men from the beginning of the world, to the end thereof, might have, in God himself, an example of labouring in their vocations, six days in this life, and retiring the seventh.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/thomas-cartwright.html">Thomas Cartwright</a></span><span class="wk"><span class="lbl">Work:</span> <cite>A treatise of Christian religion. Or the whole body and substance of divinity</cite>, (London, 1616), p. 25.</span></figcaption>

</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-12ce38167b" data-kw="">
<blockquote><p>The supposition of a perpetual night, is a dismal gloomy Thought. O what will the Everlasting Darkness of the Infernal Prison be! The Sun by day enlightens the Earth, directs our motion, guides our way, governs our Travail, assists Conversation, awakens Industry, warms the Earth and Air, gives life, and vigour, and fruitfulness to all things under the Sun, and makes the whole Inferior Creation to rejoice. An Emblem of God’s universal Goodness, who is kind to all his Creatures. How admirable is its Lustre! how glorious is its Light! how loudly doth it proclaim his Power and Wisdom! who made this, and the other Lights of Heaven, his powerful Word, and preserves them hitherto by his daily Providence.

If God be now so glorious, contemplated in his works, considered in the lustre of the created Sun, viewed only through the Windows of Sense; how much more glorious will he appear hereafter, when we shall see him face to face, and nothing interpose betwixt us and his incomparable Light! If mine Eyes dazzle to look upon the meridian Sun, in what inaccessible Light must he dwell, who is the Father of Lights? If this lower World, the common receptacle of his Friends and Enemies, have so much of his Glory vouchsafed them by the Heavenly Bodies; O what a place will Heaven be, where shall be no Sun or Moon nor need of any, but the Glory of God shall lighten it, and the Lamb be the Light thereof?</p></blockquote>

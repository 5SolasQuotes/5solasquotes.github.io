</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-e899841436" data-kw="">
<blockquote><p>The second is, why God called only the light ‘day’, and Moses calls both the evening and the morning, that is, the time of light and darkness, ‘one day’, or ‘the first day’. I answer that God’s ‘day’, which is most truly and properly so called, is the time of light, and in it there is no night or darkness. For God speaks of a natural day, distinct from the night: but Moses speaks of a civil day which comprehends in it the space of 24 hours, in which the sun runs round about the world with the heavens; which ‘day’ includes in it a day and a night: and here observe that God’s ‘day’ is all light, and man’s ‘day’ is mixed of light and darkness. Thirdly, it may asked whether the night, or the day went before in the first day of the creation. The answer is that the night or time of darkness was first; and it is likely that darkness did overspread the face of the deep the space of a night, that is 12 hours, before God formed the light, and setled the visible heavens in their place; and that after the light was created, it did shine forth for the space of 12 hours more before God went about to make the firmament, which was the second day’s work; and so the first day of the world was of the same length with all other civil or astronomical days, that is, 24 hours, divided equally between light and darkness.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/george-walker.html">George Walker</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The History of the Creation as it is Written by Moses</cite>, … (London: Barlet, 1641), Of the Creation of the World, ch. 6; p. 113</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/creation/the-six-days.html">The Six Days</a></span></div>
<div class="actions"><button class="copy" data-copy="“The second is, why God called only the light ‘day’, and Moses calls both the evening and the morning, that is, the time of light and darkness, ‘one day’, or ‘the first day’. I answer that God’s ‘day’, which is most truly and properly so called, is the time of light, and in it there is no night or darkness. For God speaks of a natural day, distinct from the night: but Moses speaks of a civil day which comprehends in it the space of 24 hours, in which the sun runs round about the world with the heavens; which ‘day’ includes in it a day and a night: and here observe that God’s ‘day’ is all light, and man’s ‘day’ is mixed of light and darkness. Thirdly, it may asked whether the night, or the day went before in the first day of the creation. The answer is that the night or time of darkness was first; and it is likely that darkness did overspread the face of the deep the space of a night, that is 12 hours, before God formed the light, and setled the visible heavens in their place; and that after the light was created, it did shine forth for the space of 12 hours more before God went about to make the firmament, which was the second day’s work; and so the first day of the world was of the same length with all other civil or astronomical days, that is, 24 hours, divided equally between light and darkness.”

— George Walker, The History of the Creation as it is Written by Moses in the First &amp; Second Chapters of Genesis: Plainly Opened &amp; Expounded in Several Sermons… (London: Barlet, 1641), Of the Creation of the World, ch. 6; p. 113">Copy</button><a class="share" href="https://x.com/intent/post?text=%E2%80%9CThe+second+is%2C+why+God+called+only+the+light+%E2%80%98day%E2%80%99%2C+and+Moses+calls+both+the+evening+and+the+morning%2C+that+is%2C+the+time+of+light+and+darkness%2C+%E2%80%98one+day%E2%80%99%2C+or+%E2%80%98the+first+day%E2%80%99.+I+answer+that+God%E2%80%99s+%E2%80%98day%E2%80%99%2C+which+is+most+truly+and+properly+so+called%2C+is+the+time+of+light%2C+and+in+it+there+is+no+night+or+darkness.+For+God+speaks+of+a+natural+day%2C+distinct+from+the+night%3A+but+Moses+speaks+of+a+civil+day+which+comprehends+in+it+the+space+of+24+hours%2C+in+which+the+sun+runs+round+about+the+world+with+the+heavens%3B+which+%E2%80%98day%E2%80%99+includes+in+it+a+day+and+a+night%3A+and+here+observe+that+God%E2%80%99s+%E2%80%98day%E2%80%99+is+all+light%2C+and+man%E2%80%99s+%E2%80%98day%E2%80%99+is+mixed+of+light+and+darkness.+Thirdly%2C+it+may+asked+whether+the+night%2C+or+the+day+went+before+in+the+first+day+of+the+creation.+The+answer+is+that+the+night+or+time+of+darkness+was+first%3B+and+it+is+likely+that+darkness+did+overspread+the+face+of+the+deep+the+space+of+a+night%2C+that+is+12+hours%2C+before+God+formed+the+light%2C+and+setled+the+visible+heavens+in+their+place%3B+and+that+after+the+light+was+created%2C+it+did+shine+forth+for+the+space+of+12+hours+more+before+God+went+about+to+make+the+firmament%2C+which+was+the+second+day%E2%80%99s+work%3B+and+so+the+first+day+of+the+world+was+of+the+same+length+with+all+other+civil+or+astronomical+days%2C+that+is%2C+24+hours%2C+divided+equally+between+light+and+darkness.%E2%80%9D%0A%0A%E2%80%94+George+Walker%2C+The+History+of+the+Creation+as+it+is+Written+by+Moses+in+the+First+%26+Second+Chapters+of+Genesis%3A+Plainly+Opened+%26+Expounded+in+Several+Sermons%E2%80%A6+%28London%3A+Barlet%2C+1641%29%2C+Of+the+Creation+of+the+World%2C+ch.+6%3B+p.+113&amp;url=https%3A%2F%2F5solasquotes.github.io%2Fquote%2Fe899841436.html&amp;via=5Solas" target="_blank" rel="noopener">Share on X</a><a class="perma" href="../quote/e899841436.html">Permalink</a><a class="src" href="https://reformedbooksonline.com/topics/topics-by-subject/creation/on-westminsters-in-the-space-of-six-days/#:~:text=The%20second%20is%2C%20why%20God%20called,divided%20equally%20between%20light%20and%20darkness&amp;text=The%20second%20is%2C%20why%20God%20called%20only%20the&amp;text=24%20hours%2C%20divided%20equally%20between%20light%20and%20darkness" rel="noopener" target="_blank">Read it online · Reformed Books Online</a></div>

</figure><figure class="quote" id="q-f207c9e0fe" data-kw="">
<blockquote><p>…those dreamers who have a spirit of bitterness and contradiction, who reprove everything and prevent the order of nature. We will see some who are so deranged, not only in religion but who in all things reveal their monstrous nature, that they will say that the sun does not move, and that it is the earth which shifts and turns. When we see such minds we must indeed confess that the devil posses them, and that God sets them before us as mirrors, in order to keep us in his fear. So it is with all who argue out of pure malice, and who happily make a show of their imprudence. When they are told: “That is hot,” they will reply: “No, it is plainly cold.” When they are shown an object that is black, they will say that it is white, or vice versa. Just like the man who said that snow is black; for although it is perceived and known by all to be white, yet he clearly wished to contradict the fact. And so it is that they are madmen who would try to change the natural order, and even to dazzle eyes and benumb their senses.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/john-calvin.html">John Calvin</a></span><span class="wk"><span class="lbl">Work:</span> <cite>‘Sermon on 1 Corinthians 10:19-24’ in Calvini Opera Selecta, Corpus Refomatorum</cite>, Vol 49, p. 677, tr. Robert White in ‘Calvin &amp; Copernicus: the Problem Reconsidered’ in Calvin Theological Journal 15 (1980), pp. 236-237</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/creation/the-six-days.html">The Six Days</a></span></div>

<blockquote><p>Josephus, Of the Jewish War, bk. 7, ch. 24, writes that there is a river in Palestine, which passes between two cities… which river is admirable for an extraordinary singularity: namely, that having entertained his violent and swift course for the space of six days, on the seventh it remains dry: which being past, it runs as before; and therefore is called the river of the Sabbath:</p></blockquote>

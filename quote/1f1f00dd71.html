<blockquote><p>In like manner, did the eternal Son of God assume, into the subsistence of his own infinite person, the whole nature of man, the body and the soul; by the virtue of which wonderful union, notwithstanding the properties of the divine nature remain absolutely intransient and incommunicable unto the human; yet are there shed, from that inexhaustible fountain, many high and glorious endowments, by which the humanity under this manner of subsistence is anointed, consecrated, sealed, and set apart for that work of incomprehensible love and power, the redemption of the world.</p></blockquote>

</figure><figure class="quote" id="q-61c54dd5b7" data-kw="">
<blockquote><p>At this point, some people ask how Paul can say that he did not receive his apostolic office from men or through man, when he also says that he got it from Christ. Does this mean that Christ is not a man? My answer is that questions of this kind are more speculative than necessary and that the people who ask them are trying to create a tempest in a teapot. Obviously, Paul knew that Christ was a man, and he even says that he was born of the seed of David and of the Jewish race. But he was also the eternal God. It was not as a man that he sent out his apostles but as the mediator of eternal salvation, in whose person God and man are conjoined.

The apostle refers to this elsewhere when he writes “God was in Christ” and also “In him the fullness of the Godhead dwells bodily.” Isaiah also calls him Emmanuel. So the speculations of such people do not impress us very much. More worthwhile are the observations of the ancients, who saw in Paul’s commission the mystery of the most holy and praiseworthy Trinity. Their argument was that when Paul says that he was not made an apostle by men or through man but then goes on to say that it was through Jesus Christ and God the Father, he is stating that Jesus Christ is God, coeternal and consubstantial with the Father. Paul was not sent by men or through man but by the Holy Spirit, which proves that the Holy Spirit is also God.

Someone will no doubt object that Christ was raised from the dead by the Father and must therefore have been inferior to him, but that does not follow. The works of the Father and the Son are the same, and whatever the Father does the Son does also. Just as the Father raises the dead and gives them life, so the Son also gives life to whomever he wills. Remember what Jesus said: “Destroy this temple and I will raise it up again in three days.” What logic compels us to say that Christ rose from the dead thanks to an outside power, when the apostles raised people from the dead in his name?

This takes us on to another subject, so suffice it to observe here how careful the ancients were in noting those passages where the eternal deity of Jesus Christ is asserted and proved. Let us exercise the same care today, when Satan is everywhere bringing back the ancient heresies by using poorly educated men to do so.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/rudolf-gwalther.html">Rudolf Gwalther</a></span><span class="wk"><span class="lbl">Work:</span> <cite>In Divi Pauli Apostoli Epistolam ad Galatas Homiliae LXI</cite>, (Zurich, 1576). Quoted in Gerald L. Bray, Timothy F. George, Scott M. Manetsch (eds), Reformation Commentary on Scripture X: Galatians, Ephesians (Downers Grove IL: IVP Academic, 2011), pp 11-12.</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/the-person-of-christ/union-of-the-two-natures.html">Union of the Two Natures</a></span></div>

</figure><figure class="quote" id="q-c3b7b7471c" data-kw="">
<blockquote><p>The kind of feelings, by which Christ was tempted, is also worthy of notice. Matthew says that he was affected by grief and sorrow (or anxiety); Luke says that he was seized with anguish; and Mark adds that he trembled. And whence came to Him both sorrow and anxiety and fear, except because He felt in death something sadder and more horrible than the separation of the soul and body? And certainly He underwent death, not merely that He might move from earth to heaven, but rather that He might take on Himself the curse to which we were liable, and deliver us from it. His horror was not, then, at death simpliciter, as a passage out of the world, but because He had before his eyes the dreadful tribunal of God, and the Judge Himself armed with inconceivable vengeance; it was our sins, the burden of which He had assumed, that pressed Him down with their enormous mass. It is, then, not at all strange if the dreadful abyss of destruction tormented Him grievously with fear and anguish.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/john-calvin.html">John Calvin</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Commentary on Matthew</cite>, 26 | v. 37</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/the-person-of-christ/union-of-the-two-natures.html">Union of the Two Natures</a></span></div>

<blockquote><p>[Robert] Browne, the Father of the Brownists, was the first of note that did separate himself from the Church of England and said that we had not a Church; he meant a true Church. But after he went into France, and being at Geneva, he saw the Sabbath much prophaned, and the wafer-cake given in the sacrament instead of bread, whereupon he began to think better of the Church of England… The Church of Rome was a true Church, the Reformed Churches separated from it becoming a false Church.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/edward-leigh.html">Edward Leigh</a></span><span class="wk"><span class="lbl">Work:</span> <cite>A System or Body of Divinity... (London: A.M., 1654), bk. 6</cite>, ch. 2, p. 456</span></figcaption>

</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-fb1b6b0eac" data-kw="">
<blockquote><p>§5. But we find the ancient Fathers with a holy zeal, charging such as apostates from the Church and breakers of her peace, who held opinions contrary to the essential and fundamental, or any of the great articles of the Christian Faith, so that they placed the unity of the catholic Church in a harmonious consent to these great truths. Irenaeus ([Against Heresies] bk. 1, ch. 3, p. 53, edition Cologne, 1625), having given a short account of the chief articles of the true religion, has these words: hanc igitur praedicationem, et hanc ••dem adepta Ecclesia, quamvis dispersa in universo mundo, diligenter conservat, a• si in una eademque domo habitaret, ac similiter iis fidem habet, ac si unam animam unumque et idem cor haberet; atque un• consensu hoc praedicat, docet ac tradit, ac si uno ore praedita esset. Quamvis enim dissimilia sunt in mundo genera linguarum, una tamen et eadem est vis traditionis; nec quae constitutae sunt in Germania Ecclesiae aliter credunt; nec quae in Hispania, neque in Galliis; neque in Oriente, neque in Aegypto, neque in Lybia, aut in medio Orbis terrarum fundatae sunt, sed quemadmodum Sol Creatura Dei unus et idem est in universo Mundo; ita &amp; praedicatio veritatis ubiquae lucet, &amp; illuminat eos qui ad notionem veritatis venire volunt. Eusebius (Ecclesiastical History, bk. 4, ch. 27) cites Irenaeus condemning Tatianus, the author of the sect of the Encratitae, and saying of him, [Greek], he reckoned his opinions a falling from the Church, or a breaking her unity. The same Historian, bk. 4, ch. 24, gives account of Egesippus narrating, how long the Church remained a virgin, teaching and believing nothing but the Law and the prophets, and what the Lord Himself taught, and he mentions particularly the Churches of Corinth, Rome and Jerusalem; and then shows how heresies arose, whose authors he calls false Christs, false prophets and false apostles, and of them he says, [Greek],they divided the unity of the Church by their corrupt doctrines against God, and against his Christ. Several other citations might be brought to this purpose, but these may be sufficient. I do not question but that there might be other things which might be called schism, even with respect to the universal Church, as if any should bring in idolatrous, or superstitious worship, contrary to the rules of the Gospel, or should violate any of the necessary and laudable canons of General Councils, and should set up societies in opposition, not only to one or few, but to all the societies of Christians, or all the soundest of them… §6. There is another sort of unity much regarded among the ancients, which though the breach of it had as bad influence on all, or most Churches, and so on the catholic Church: yet it properly respected neighbor Churches, either which were united by the bond of one government, a provincial, or lesser synod, being made up of them: or only living in the vicinity of one another, or having frequent occasion of correspondence; they who were not under any uniting bonds, but these commune to all the parts of the catholic Church, yet had an unity of kind correspondence, mutual assistance, as occasion offered, acquainting one another with their affairs so far as it was of any advantage: admitting the members of other Churches to communion with them on occasion, refusing communion with such members of other Churches as were by them excommunicated: and this unity was then broken when these acts of friendship were shunned or refused, especially when they who were cast out by one were received to another: or when occasional communion was either shuned by them who so joined in another Church or denied to such sojourners if they desired it: or when one Church showed rage, fury and bitterness against another because of what they differed about.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/gilbert-rule.html">Gilbert Rule</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Good Old Way Defended (Edinburgh: Anderson, 1697), sect. 10, ‘Of Schism’ Rule was a Scottish, divine-right presbyterian minister.</cite>, pp. 250-52</span></figcaption>

</figure><figure class="quote" id="q-ae60862e38" data-kw="">
<blockquote><p>Let us 1. distinguish of opinions. Some are in the foundation, in those necessary doctrines upon which the House of God is built, 1 Cor. 3:9-10; Heb. 6:1; Mt. 7:24, the errors contrary wherereunto are pernicious and damnable, 2 Pet. 2:1. Some are only in the superstruction which do not so nearly touch the vitals and essentials of religion, which are not fidei but quaestionum, as Augustine somewhere distinguishes. Such were in the apostles’ time disputes touching meats, and drinks, and days, and things indifferent, Rom. 14:5-6, and in our days touching forms of discipline and government in the Church, wherein men abound in their own sense, with meekness and with submission to the spirits of the prophets.</p></blockquote>

<blockquote><p>11… But when we complain of our divisions for making much against the cause of Christ, or work of reformation, we do not complain against men, because they cannot all understand things alike. But this we complain of: 1. That all men who profess godliness, have not joined in opposing that which they believe cannot stand with godliness, by all the ways that God has put into their hands. 2. That they have not joined to promote those ways of godliness, which they are convinced to be so. 3. That they have not joined to study what ways and means may be found out to ease the hearts and consciences one of another, to bear with one another, so far as Christ would have them be helpful to, and bear with one another. It is this that has made such a stop in the work of reformation. A peaceable, humble, and quiet discussing of things furthers that reformation that Christ would have. Do you think that Christ would be pleased with such a reformation wherein the lesser part should give up their consciences and practices to the judgments of the greater? Such a kind of slubbering over matters might soon be, but Christ must have all the matters of his worship and doctrine consented to, and practiced from a principle of faith. Let us join with all our might in all we know, and with peaceable, quiet, humble spirits seek to know more, and in the meantime carry ourselves humbly and peaceably towards those we differ from, and Christ will not charge us at the Great Day for retarding his cause, the great work of reformation in hand. 12. These our dissensions are against a great part of the Covenant of Grace which God has made with his people in Christ, and those many promises of so much peace that there is to be in the times of the Gospel. We by these do that which tends to make void the Covenant…</p></blockquote>

<div class="actions"><button class="copy" data-copy="“11… But when we complain of our divisions for making much against the cause of Christ, or work of reformation, we do not complain against men, because they cannot all understand things alike. But this we complain of: 1. That all men who profess godliness, have not joined in opposing that which they believe cannot stand with godliness, by all the ways that God has put into their hands. 2. That they have not joined to promote those ways of godliness, which they are convinced to be so. 3. That they have not joined to study what ways and means may be found out to ease the hearts and consciences one of another, to bear with one another, so far as Christ would have them be helpful to, and bear with one another. It is this that has made such a stop in the work of reformation. A peaceable, humble, and quiet discussing of things furthers that reformation that Christ would have. Do you think that Christ would be pleased with such a reformation wherein the lesser part should give up their consciences and practices to the judgments of the greater? Such a kind of slubbering over matters might soon be, but Christ must have all the matters of his worship and doctrine consented to, and practiced from a principle of faith. Let us join with all our might in all we know, and with peaceable, quiet, humble spirits seek to know more, and in the meantime carry ourselves humbly and peaceably towards those we differ from, and Christ will not charge us at the Great Day for retarding his cause, the great work of reformation in hand. 12. These our dissensions are against a great part of the Covenant of Grace which God has made with his people in Christ, and those many promises of so much peace that there is to be in the times of the Gospel. We by these do that which tends to make void the Covenant…”

— Jeremiah Burroughs, Irenicum, to the Lovers of Truth and Peace. Heart-Divisions Opened… (London: Robert Davvlman, 1653), ch. 28, pp. 207-8">Copy</button><a class="share" href="https://x.com/intent/post?text=%E2%80%9C11%E2%80%A6+But+when+we+complain+of+our+divisions+for+making+much+against+the+cause+of+Christ%2C+or+work+of+reformation%2C+we+do+not+complain+against+men%2C+because+they+cannot+all+understand+things+alike.+But+this+we+complain+of%3A+1.+That+all+men+who+profess+godliness%2C+have+not+joined+in+opposing+that+which+they+believe+cannot+stand+with+godliness%2C+by+all+the+ways+that+God+has+put+into+their+hands.+2.+That+they+have+not+joined+to+promote+those+ways+of+godliness%2C+which+they+are+convinced+to+be+so.+3.+That+they+have+not+joined+to+study+what+ways+and+means+may+be+found+out+to+ease+the+hearts+and+consciences+one+of+another%2C+to+bear+with+one+another%2C+so+far+as+Christ+would+have+them+be+helpful+to%2C+and+bear+with+one+another.+It+is+this+that+has+made+such+a+stop+in+the+work+of+reformation.+A+peaceable%2C+humble%2C+and+quiet+discussing+of+things+furthers+that+reformation+that+Christ+would+have.+Do+you+think+that+Christ+would+be+pleased+with+such+a+reformation+wherein+the+lesser+part+should+give+up+their+consciences+and+practices+to+the+judgments+of+the+greater%3F+Such+a+kind+of+slubbering+over+matters+might+soon+be%2C+but+Christ+must+have+all+the+matters+of+his+worship+and+doctrine+consented+to%2C+and+practiced+from+a+principle+of+faith.+Let+us+join+with+all+our+might+in+all+we+know%2C+and+with+peaceable%2C+quiet%2C+humble+spirits+seek+to+know+more%2C+and+in+the+meantime+carry+ourselves+humbly+and+peaceably+towards+those+we+differ+from%2C+and+Christ+will+not+charge+us+at+the+Great+Day+for+retarding+his+cause%2C+the+great+work+of+reformation+in+hand.+12.+These+our+dissensions+are+against+a+great+part+of+the+Covenant+of+Grace+which+God+has+made+with+his+people+in+Christ%2C+and+those+many+promises+of+so+much+peace+that+there+is+to+be+in+the+times+of <blockquote><p>2. It is not a bare union of men that makes a Church a true Church, but that union must have truth for its foundation; else you know thieves and robbers and highway-men and pirates, and buccaneers, because they agree among themselves, might lay claim to this title, and the most perverse heretics, because they agree in certain points, might say they are the true Church… … And indeed, that which justifies the Protestant Churches’ separation from her [Rome], or breaking peace and communion with her is: 1. Because she would impose that upon the consciences of men which Christ and his apostles never imposed. 2. Because she has turned the spiritual worship of the Gospel into carnal and mechanical devotion and introduced innumerable superstitions… … 5. Because rejecting the supreme authority of the Scriptures, which are the sole rule of Faith, she has made her pretended head, and such councils as he shall call or approve of, the sole dictators and expositors of the doctrine of Christ, requiring blind obedience to their decisions… The divisions among Protestant Churches are to be deplored so much the more because the points they differ in are inconsiderable and might easily be composed if men had but peaceable tempers and were resolved to lay aside interest and carnal respects, and punctilios of honor and credit, etc. for they all agree in fundamentals, all are satisfied that the Church of Rome has notoriously deviated from the simplicity of the Gospel; and the matters in difference, are things in which salvation is not concerned. And upon that account their labours deserve great commendations, who heretofore and very lately have endeavored to reconcile the Protestant Churches into a perfect union: A blessed work. Blessed are the peacemakers, that endeavor to make peace among the jarring members of Christ’s Body; and though they may fail of success, yet they shall not lose their reward. In the meanwhile those who widen or heighten these differences, and incite the respective parties to hatred, and wrath, and animosities one against another, to be sure are no children of the God of peace, and had need at least before they die make public satisfaction for the dreadful effects their heats and passions do produce. But as this peace among Protestant Churches is very much to be wished and prayed for…</p></blockquote>

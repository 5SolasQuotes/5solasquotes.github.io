<main class="wrap"><figure class="quote" id="q-26209086ef" data-kw="">
<blockquote><p>a) The principle ‘whatever is moved is moved by another’ is not a per se nota [through known things themselves] proposition, nor does it seem to be universally valid (Scotus, Oxon. 1, d. 3, q. 7, 2 d. 2, q. 10, 2 d. 25, q. un, Questions on Metaphysics 9, q.14). [The principle ‘whatever is moved is moved by another,’ is Thomist, albeit articulated in a loose way, which could be shored up. Wolter is giving Scotist criticisms. He is saying this principle is presupposed and not demonstrated through known things. One proposed exception to it in the Scotist tradition, though perhaps there may be others, is the free will of created rational agents.] b) The argument that is founded on the impossibility of passing from potency to act save as by a being in act does not seem to be valid, because an agent, insofar as an agent has an active power, virtually contains its own action even before it actually acts. This is plain certainly about the will and probably about the intellect and other principles of motion.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/allan-b-wolter.html">Allan B. Wolter</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Little Summary of Metaphysics</cite>, (Milwaukee: Bruce Publishing Co., 1958), Wolter was a Scotist., p. 82</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/free-will-and-inability/liberty-and-necessity.html">Liberty and Necessity</a></span></div>

</figure><figure class="quote" id="q-5b6fc015ca" data-kw="">
<blockquote><p>52. Because nothing is done without a sufficient Reason (sect. 1), also liberty in election cannot act without reason, we therefore define the same as that faculty of the mind to elect or choose out of more possible things what one pleases, agreeable to proposed reasons. Hence all coaction [coercion] by which man is compelled thorugh extrinsical violence is at a great distance from liberty; metaphysical necessity, where there is but one only object possible, and consequently election ceases, has nothing to do with liberty; also physical necessity (i.e. natural necessity), when there is no knowledge of the objects, is far distant from liberty (or is utterly inconsistent with the very nature of it); but there is only a moral necessity, which is no more than a certainty so that man is sweetly and willingly inclined or moved to this or that thing from these or other motives, namely because he sees what things are best.

53. Hence since liberty of indifference is repugnant to the principle of a sufficient reason, it is utterly impossible (i.e. there is no liberty of indifference); it is a chimera (or a groundless and vain imagination which has no foundation in reason or nature); it is nothing but the mere inaction of the will; besides let those who maintain an indifference of the equilibrium in liberty (or those who place the essence of liberty in the indifference of the will), let them answer us (let them reply to the following queries, viz.), Whether God, the (holy) angels and all the inhabitants of heaven are not most free, or act with the most perfect liberty? and whether they are indifferent about good and evil?</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/daniel-wyttenbach.html">Daniel Wyttenbach</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Theological Theses</cite>, … (1747; NY: Samuel Brown, 1766), pp. 24-25</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/free-will-and-inability/liberty-and-necessity.html">Liberty and Necessity</a></span></div>

</figure><figure class="quote" id="q-8cbb708b33" data-kw="">
<blockquote><p>They all happen and are according to the decree, but they are not caused by it, and therefore rational agents may act freely notwithstanding the preordination of God. For the decree does not so affect the actions of men, as to lay any force upon the actors. It is not denied that there is a necessity of the certain futurition of the acts and events, so that they shall infallibly and inevitably come to pass; but there is not on the things themselves or the actors a necessity, whereby the persons are forced to do what they do, and ot do it unwillingly.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/john-edwards.html">John Edwards</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Veritas Redux</cite>, p. 266</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/free-will-and-inability/liberty-and-necessity.html">Liberty and Necessity</a></span></div>

</figure><figure class="quote" id="q-b943e00d91" data-kw="">
<blockquote><p>Thesis XX. Whence it appears not only that all and every heir of Adam is universally corrupt, but also totally corrupt, namely both with respect to the soul, and with respect to the body, and finally with respect to the whole composite being. For it should not be thought as if only the body were corrupt, or even only the soul, but the whole man, as great as he is, is corrupt. For just as the image of God was not in the soul alone, nor even in the body alone, but in man and therefore in the whole composite, so also this original sin should be attributed not only to the soul and body, but to the whole composite consisting of soul and body; which can be best gathered from the opposite, regeneration, which pertains not to one or the other part of man, but to the whole man. … Thesis XXII. That the soul is corrupt is, alas, sufficiently clear from the depravation both of the intellect, which, although it may discern something in matters contributing to the convenience of civil life, yet in spiritual matters pertaining to the true worship of God and the salvation of our soul, it is not so much dim-sighted as blind, unless the Lord gives a mind to understand, eyes to see, etc. For its wisdom is enmity against God, holding those things which are of the Spirit of God for foolishness. And although worldly men sometimes understand something, yet they have it not from flesh and blood, but from the revelation of God the heavenly Father. Then of the will, which is placed in the same plight as the intellect. For original sin has so depraved the will that it in no way wills the spiritual good, namely, neither with respect to substance, nor with respect to manner, that is, from faith and for the glory of God. Whence the heart of man is not undeservedly called fraudulent, hardened, whose imagination is evil from his youth. Thesis XXIII. The body is so corrupt that, first in general, our members present themselves as weapons of unrighteousness for sin; then in particular, the mouth is full of curses and bitterness; the tongue is deceitful and the lips are filled with the venom of asps; the throat is an open sepulcher; the eyes are either lustful and evil; the hands are ready for theft; the belly is a god; the knees are bent to idolatry; the feet are swift to shed innocent blood.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/christoph-luthard.html">Christoph Luthard</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Theological Disputation on Original Sin</cite>, (Bern: Fabricius, 1637), pp. 9-10 Lüthardt (1590-1663) was a Swiss reformed professor of philosophy and theology at Bern.</span></figcaption>

— Christoph Luthard, Theological Disputation on Original Sin (Bern: Fabricius, 1637), pp. 9-10 Lüthardt (1590-1663) was a Swiss reformed professor of philosophy and theology at Bern.">Copy</button><a class="share" href="https://x.com/intent/post?text=%E2%80%9CThesis+XX.+Whence+it+appears+not+only+that+all+and+every+heir+of+Adam+is+universally+corrupt%2C+but+also+totally+corrupt%2C+namely+both+with+respect+to+the+soul%2C+and+with+respect+to+the+body%2C+and+finally+with+respect+to+the+whole+composite+being.+For+it+should+not+be+thought+as+if+only+the+body+were+corrupt%2C+or+even+only+the+soul%2C+but+the+whole+man%2C+as+great+as+he+is%2C+is+corrupt.+For+just+as+the+image+of+God+was+not+in+the+soul+alone%2C+nor+even+in+the+body+alone%2C+but+in+man+and+therefore+in+the+whole+composite%2C+so+also+this+original+sin+should+be+attributed+not+only+to+the+soul+and+body%2C+but+to+the+whole+composite+consisting+of+soul+and+body%3B+which+can+be+best+gathered+from+the+opposite%2C+regeneration%2C+which+pertains+not+to+one+or+the+other+part+of+man%2C+but+to+the+whole+man.+%E2%80%A6+Thesis+XXII.+That+the+soul+is+corrupt+is%2C+alas%2C+sufficiently+clear+from+the+depravation+both+of+the+intellect%2C+which%2C+although+it+may+discern+something+in+matters+contributing+to+the+convenience+of+civil+life%2C+yet+in+spiritual+matters+pertaining+to+the+true+worship+of+God+and+the+salvation+of+our+soul%2C+it+is+not+so+much+dim-sighted+as+blind%2C+unless+the+Lord+gives+a+mind+to+understand%2C+eyes+to+see%2C+etc.+For+its+wisdom+is+enmity+against+God%2C+holding+those+things+which+are+of+the+Spirit+of+God+for+foolishness.+And+although+worldly+men+sometimes+understand+something%2C+yet+they+have+it+not+from+flesh+and+blood%2C+but+from+the+revelation+of+God+the+heavenly+Father.+Then+of+the+will%2C+which+is+placed+in+the+same+plight+as+the+intellect.+For+original+sin+has+so+depraved+the+will+that+it+in+no+way+wills+the+spiritual+good%2C+namely%2C+neither+with+respect+to+substance%2C+nor+with+respect+to+m

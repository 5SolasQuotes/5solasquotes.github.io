<main class="wrap"><figure class="quote" id="q-2a7fd9e9d1" data-kw="">
<blockquote><p>Now whereas there is no Nation so projectedly Savage, as to be aliens to the belief of existence of some Deity, which mankind ought to adore; no people, who do not essay by some kind of performances to express the sentiments of Devotion and Honour they bear towards him; it is difficult to imagine there should be any persons found of minds so immensely distant from the common conceptions of reason, as to be able resolvedly to deny it. And the reason of the difficulty is this that Notices which are so Universal, having a necessary foundation and firm root in Nature, it must needs be that such as stifle the same in themselves, have in the first place violated and defaced that.

Hence it is that I would not formally accuse them who maintain that the Deity does not intermeddle in the affairs of this lower World, and conceive we ought to venerate the same only upon the account of its excellence, although there is not to be attended from it either Punishment for Wickedness or Compensation for Virtue; to have absolutely banished the knowledge of it from amongst them, and to make profession of believing there is a God only to escape the infamous title of Atheist.

Cicero indeed reproaches Epicurus with this artifice, and raises the suspicion upon his Followers; which nevertheless shall not engage me to believe that the corruption of our Age could possibly afford birth to such monsters. But howsoever that particular be, certain it is beyond contradiction, that the Opinions of this Philosopher lead directly to Impiety; and that if they who have embraced them believe the existence of God, tis Nature which prevails in them, and which is never conquerable by all the attempts and outrages they employ to conquer and suppress her.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/moses-amyraut.html">Moses Amyraut</a></span><span class="wk"><span class="lbl">Work:</span> <cite>A treatise concerning religions, in refutation of the opinion which accounts all indifferent. Wherein is also evinced the necessity of a particular revelation, and the verity and preeminence of the Christian religion above the pagan, Mahometan, and Jewish rationally demonstrated</cite>, (London: Will. Nealand, 1660), Part 1.1, pp 2-3.</span></figcaption>

</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-2860e14caa" data-kw="">
<blockquote><p>[W]e cannot yield obedience, for conscience’ sake, to the present civil authority in North America. […]

1. The federal constitution, or instrument of national union, does not even recognize the existence of God, the King of Nations. In these civil deeds, though the immediate end may be the happiness of the commonwealth, yet the ultimate end, as well in this as in every other thing we do, should be the glory of God. Ought not men, in the formation of their deeds, to consider their responsibility to the moral governor, and their obligation to acknowledge his authority? Prov. 3:5: “In all thy ways acknowledge him, and he shall direct thy paths.” That a national deed, employed about the fundamental stipulations of magistracy as an ordinance of God, and the investiture of magistrates as his ministers, should nowhere recognize the existence of the Governor of the universe, is, to say nothing worse of it, truly lamentable. May it not be said of this nation as of Israel, Hos. 8:4: “They have set up kings, but not by me; they have made princes, and I knew it not?” Did not the framers of this instrument act, not only as if there had been no divine revelation for the supreme standard of their conduct; but also as if there had been no God? Did they not, in this, resemble the fool mentioned, Ps. 14:1, who “said in his heart, There is no God?” Every official act of the governor of a province must have some specific stamp of his dependence upon the authority which appointed him: and shall a nation act as if independent of the God of the universe, and expect to be guiltless?</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/s-b-wylie.html">S. B. Wylie</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The two sons of oil; or, the faithful witness for magistracy and ministry upon a scriptural basis</cite>, (1803; York PA, 2002), pp 34-5.</span></figcaption>

</figure><figure class="quote" id="q-2a8ade0fe4" data-kw="">
<blockquote><p>And it assuredly exists so truly, that it cannot be conceived not to exist. For it is possible to conceive of a being which cannot be conceived not to exist; and this is greater than one which can be conceived not to exist… There is, then, so truly a being than which nothing greater can be conceived to exist, that it cannot even be conceived not to exist; and this being thou art, O Lord, our God… For, if a mind could conceive of a being better than thee, the creature would rise about the Creator; and this is most absurd. And, indeed, whatever else there is, except thee alone, can be conceived not to exist. To thee alone, therefore, it belongs to exist more truly than all other beings, and hence in a higher degree than all others. For, whatever else exists does not exist so truly, and hence in a less degree it belongs to it to exist.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/anselm.html">Anselm</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Proslogium, or ‘Discourse’ on the Existence of God ToC in St. Anselm: Proslogium; Monologium; an Appendix in behalf of the Fool by Gaunilon</cite>, … tr. Sidney N. Deane (Chicago: Open Court Publishing Co., 1903), pp. 1-34, ch. 3, pp. 8-9</span></figcaption>

0to%20it%20to%20exist" rel="noopener" target="_blank">Read it online · Reformed Books Online</a></div>

<blockquote><p>I answer that, The existence of God can be proved in five ways… The fifth way is taken from the governance of the world. We see that things which lack intelligence, such as natural bodies, act for an end, and this is evident from their acting always, or nearly always, in the same way, so as to obtain the best result. Hence it is plain that not fortuitously, but designedly, do they achieve their end. Now whatever lacks intelligence cannot move towards an end, unless it be directed by some being endowed with knowledge and intelligence; as the arrow is shot to its mark by the archer. Therefore some intelligent being exists by whom all natural things are directed to their end; and this being we call God.</p></blockquote>

<blockquote><p>God has condescended to reveal himself to us both in nature and in the Scriptures. First, that we may know that he is (with respect to existence) against the atheist. Second, that we may know what he is (with respect to his nature and attributes) against the heathen. Third, that we may know who he is (with respect to the persons) against the Jews and heretics.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/francis-turretin.html">Francis Turretin</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Institutes of Elenctic Theology</cite>, 3.1.1–2</span></figcaption>

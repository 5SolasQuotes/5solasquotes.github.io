<main class="wrap"><figure class="quote" id="q-c1dc9455e9" data-kw="">
<blockquote><p>[A]nything borrowed from heathenism or the abolished temple-service — as pretended priests, altars, altar-cloths, incense, symbolical vestments, or instrumental music — are entirely without divine warrant, and therefore unlawful. The same thing may be said of all man-pleasing, sensationalism, solo-singing, with any of the peculiarities of the theatre transferred without divine warrant into the worship of the Christian Church.

The worship of the New Testament Church, unlike that of the temple, is based on the worship of the synagogue. That worship consisted of singing, prayer, with reading and expounding the Scriptures. All priests, incense, instruments of music, and sacrifices were discarded; and our worship, now that the temple is completely destroyed, must be the simple worship of the synagogue under the clearer light of the New Testament, conducted in the name and by the authority of Christ, and under the solemn impression that “God is a Spirit, and they that worship Him must worship Him in spirit and in truth.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/james-a-begg.html">James A. Begg</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Anarchy in Worship or Recent Innovations Contrasted with the Constitution of the Presbyterian Church and the Vows of Her Office-Bearers</cite>, (Edinburgh: Lyon &amp; Gemmell, 1875), pp 13-14.</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/worship.html">Worship</a></span></div>

</figure><figure class="quote" id="q-4f35eb7f6b" data-kw="">
<blockquote><p>The woman said to Him, “Sir, I perceive that You are a prophet. Our fathers worshipped on this mountain, and you Jews say that in Jerusalem is the place where one ought to worship.” John 4:19-20

Commenting on this passage, John Calvin warns us about the danger of human autonomy in the worship of God:

Our fathers. It is a mistaken opinion which some hold, that the woman, finding the reproof [of her sexual immorality] to be disagreeable and hateful, cunningly changes the subject. On the contrary, she passes from what is particular to what is general, and, having been informed of her sin, wishes to be generally instructed concerning the pure worship of God. She takes a proper and regular course, when she consults a Prophet, that she may not fall into a mistake in the worship of God. It is as if she inquired at God himself in what manner he chooses to be worshipped; for nothing is more wicked than to contrive various modes of worship without the authority of the word of God.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/john-calvin.html">John Calvin</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Commentary on the gospel according to John</cite>, trans. William Pringle (Geneva, 1553) in Calvin’s commentaries (22 vols, Grand Rapids, 1993), xvii, 154.</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/worship.html">Worship</a></span></div>

</figure><figure class="quote" id="q-66a913b15c" data-kw="">
<blockquote><p>In the field, or in the bed, clothed with gown or cloak, when we pray or preach, are mere accidents and circumstances of praying and preaching, and we grant them to be variable and indifferent; howbeit, they admit of regulation-moral, and so are not simply indifferent; for to pray in the fields and streets, to be seen of men, is vain glory. But I hope they are not indifferent in your [Forbes’] meaning, as are surplice, holy-days, etc. For you will not say the Church may make laws that no prayers be but in the fields, no preaching except the preacher be clothed with a cloak. … 3. Place or habit does not constitute praying and preaching in their specific nature; that were a wonder, for their objects do constitute their nature, and their objects are God and God’s Word;</p></blockquote>

<blockquote><p>And I dare say, whosoever shall peruse with a judicious and unpartial eye most of those pamphlets, that in this daring age have been thrust into the world against… (…things of lesser regard and usefulness and more open to acception [exception] and abuse, yet so far as I can understand, unjustly condemned as things utterly unlawful, such as are lusorious lots, dancing, stage plays and some other things of like nature), when he shall have drained out the bitter invectives, unmannerly jeers, petulant guirding at those that are in authority, impertinent digressions, but above all those most bold and perverse wrestings of holy Scripture, wherewith such books are infinitely stuffed, he shall find that little poor remainder that is left behind to contain nothing but vain words and empty arguments. For when these great undertakers have snatched up the bucklers, as if they would make it good against all comers, that such and such things are utterly unlawful, and therefore ought in all reason and conscience to bring such proofs as will come up to that conclusion: Quid dignum tanto? very seldom shall you hear from them any other arguments than such as will conclude but an inexpediency at the most, as that they are apt to give scandal, that they carry with them an appearance of evil, that they are often occasions of sin, that they are not command[ed] in the Word, and such like. Which objections, even where they are just, are not of force (no not taken altogether, much less any of them singly) to prove a thing to be utterly unlawful. And yet are they glad many times, rather than sit out, to play very small game and to make use of arguments yet weaker than these and such as will not reach so far as to prove a bare inexpediency, as that they were invented by heathens, that they have been abused in Popery and other such like. Which to my understanding is a very strong presumption that they have taken a very weak cause in hand and such as is wholly destitute of sound proof.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/robert-sanderson.html">Robert Sanderson</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Bishop Sanderson his Judgment in One View for the Settlement of the Church in Reason &amp; Judgement</cite>, … (London: Marsh, 1663), pp. 75-77 Sanderson (1587–1663) was an Anglican bishop, theologian and casuist.</span></figcaption>

<blockquote><p>3. We grant that there may be an express and solemn covenant, in the presence of God and the Church, upon extraordinary occasions, entered into by all the members of the visible Church of one nation or kingdom: when the Church in that kingdom or nation has made defection from God and his worship, or some other necessity call for it; for the preserving, or propagating, or restoring of the decayed worship of God. By which covenant notwithstanding there does not accrue to the Church of that kingdom any new right, but that right which before they had to enjoy the ordinances of God, which by reason of their defection, or some other cause, was hindered and as it were suspended, they may now freely and purely again reduce to practise. Thus did the Church of God under the Old Testament often in the time of defection, or extraordinary necessity, enter into a solemn Covenant in the presence of God. 4. …it is lawful also expressely, publicly and solemnly to vow to God those things which are in the precepts of God enjoined to all believers: But that necessity of making this public, solemn and express covenant, in the presence of the whole Church, requiring it as a thing of absolute necessity to the essential constitution of a particular church, we do not acknowledge: But that union above mentioned, we conceive sufficient by the Word of God for the joining men professing the faith into one particular church. So that, by the Word of God, to the essence and entireness of a particular Church, this union is sufficient.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/wilhelm-apollonius.html">Wilhelm Apollonius</a></span><span class="wk"><span class="lbl">Work:</span> <cite>A Consideration of Certain Controversies at this Time Agitated</cite>, (London, 1645), ch. 2, ‘Of a church-covenant’, pp. 15-16</span></figcaption>

<blockquote><p>Question: Is it simply unlawful to play for any money at all, the game being lawful? Answer: No; if the play be for a small matter, the loss whereof is no hurt to him that loses it, and if it be applied to a common good, and be bestowed in some honest meeting for the increase of love, then it is lawful: otherwise not.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/edward-elton.html">Edward Elton</a></span><span class="wk"><span class="lbl">Work:</span> <cite>God’s Holy Mind Touching Matters Moral which Himself Uttered in Ten Words</cite>, … in God’s Holy Mind Touching Matters Moral which Himself Uttered in Ten Words… Also Christ’s Holy Mind touching Prayer… (1625), p. 311 Elton (1569-1624) was an English minister near London.</span></figcaption>

<div class="actions"><button class="copy" data-copy="“Question: Is it simply unlawful to play for any money at all, the game being lawful? Answer: No; if the play be for a small matter, the loss whereof is no hurt to him that loses it, and if it be applied to a common good, and be bestowed in some honest meeting for the increase of love, then it is lawful: otherwise not.”

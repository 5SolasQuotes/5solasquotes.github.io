<main class="wrap"><figure class="quote" id="q-0e31d655df" data-kw="">
<blockquote><p>Other two questions here are shortly to be discussed, as belonging to this purpose, as: 1. Whether discipline be a mark of the visible Church? Mr. [John] Robinson says [that] the power of censures is simply necessary for the being of the Church; sundry of our divines affirm it is. So the learned professors of Leiden, and Ursinus with Pareus. Great Junius says [that] it is a note belonging to the Church’s order, ad decorum; the [Lutheran] Augsburg Confession leaves it out from amongst the notes, and so does Calvin and Whittaker, making two notes only: Word and sacraments. Learned Beza makes only the preaching of the Word a note, not excluding the other two. I think distinctions may help the matter: 1. There is a power of discipline, and there is a care thereof. True Churches have a power given them of Christ, and this Robinson proves, and no more; yet the care to exercise the power may be wanting [lacking] in a true Church. 2nd Distinction: Right discipline is not necessary for the essence of a visible Church: [1.] All our divines condemn Anabaptists and Pelagians, who plead that righteous men only, and such societies as have right discipline, to be true Churches. 2. Novatians and Donatists came near to them in this also, as we may see in Augustine. So Richard Field, Parker [and] Cartwright make it necessary to the well-being of the Church: 1. Because it is not indifferent. 2. Because it is commanded in God’s Word. 3. Discipline in the substantial points is immutable. 4. It is necessary in respect of the end. And all this the learned Parker demonstrates to be true. But it is not necessary simply to the being of it: as a city may be without walls, a garden without an hedge. 3rd Distinction: The power and right to discipline is a propriety essential to the Church, and is not removed from it till God remove the candlestick and the Church cease to be a visible Church; but the exercise may be wanting and the Church a true visible Church, from which we are not to separate. 4th. Discipline is a necessary note and inseparable from a visible Church, whole, entire and not lame and imperfect. But a Church may retain the essence and being of a visible Church, and yet have no discipline in actual use, or little; and though want of discipline do leaven a Church, yet it does not (as Robinson says) evert the nature thereof and turn it into Babylon and a den of dragons. Robinson will have profaneness and impiety, by absolute necessity, rooted out by discipline; but he is too hasty. Nay, not by public preaching of a sent pastor through absolute [necessity], but only through ordinary and conditional necessity. You bind the Almighty too hard.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/samuel-rutherford.html">Samuel Rutherford</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Due Right of Presbyteries, ‘Acts 15, A Pattern of a Juridicial Synod’</cite>, … (1644), ch. 9, section 9, pp. 287-8</span></figcaption>

<blockquote><p>…if the laws of the Church obliged the conscience in such a [absolute] manner, as that the transgression of them were a sin, the observance of them would then be a good action… …the persons against whom I dispute, pretend the violation of ecclesiastical laws to be therefore only sinful, because it implies an infraction of the law of God, who has commanded us to obey the Church: but if not to do what the Church enjoins be to violate the law of God, must it not be allowed, that to comply with her injunctions, is to observe the same divine law, and consequently to perform a good and virtuous act?… Lastly, if ecclesiastical laws obliged the conscience, the Church would only have changed her yoke by the establishment of Christianity: she would still continue a slave; and the only difference would be, that whereas under the [Mosaic] Law her servitude was terminated with respect to God, she would now be in bondage to men… …ever since the Reformation, it has been a particular controversy between the Romanists and us, whether ecclesiastical laws oblige the conscience, in other cases besides those of contempt and scandal. The Church of Rome has declared for the affirmative; and Protestant authors, as well Lutherans as Calvinists, for the negative. If any question this, let them give themselves the trouble of reading Bellarmine De Bonis Operibus [Of Good Works], particularly book 2, ch. 7 [‘Ecclesiastical Law Obliges the Faithful in Conscience…’], and the Brothers of Valemborch, tome 1, p. 183; tome 2, p. 187, among the papists; and among those of our communion, the supplement to Chamier, p. 375; Rivet’s Summary of Controversies [in French], tract 2, question 9 [‘Whether the Church may Make Laws?’]; [Jean] Mestrezat, Of the Church, Theses of Salmur, tome 1, disputation 1 [‘Whether Conscience to the Faith is Prior to that of the Church, or that to the Church is Prior to that of the Faith?’]. But this is not all, the Confession of Faith, published by the Reformed Churches of France, is express to the same purpose; see Article 33. So that if I have gone too far in this respect, I have all the Protestant Churches for my vouchers.</p></blockquote>

<div class="actions"><button class="copy" data-copy="“…if the laws of the Church obliged the conscience in such a [absolute] manner, as that the transgression of them were a sin, the observance of them would then be a good action… …the persons against whom I dispute, pretend the violation of ecclesiastical laws to be therefore only sinful, because it implies an infraction of the law of God, who has commanded us to obey the Church: but if not to do what the Church enjoins be to violate the law of God, must it not be allowed, that to comply with her injunctions, is to observe the same divine law, and consequently to perform a good and virtuous act?… Lastly, if ecclesiastical laws obliged the conscience, the Church would only have changed her yoke by the establishment of Christianity: she would still continue a slave; and the only difference would be, that whereas under the [Mosaic] Law her servitude was terminated with respect to God, she would now be in bondage to men… …ever since the Reformation, it has been a particular controversy between the Romanists and us, whether ecclesiastical laws oblige the conscience, in other cases besides those of contempt and scandal. The Church of Rome has declared for the affirmative; and Protestant authors, as well Lutherans as Calvinists, for the negative. If any question this, let them give themselves the trouble of reading Bellarmine De Bonis Operibus [Of Good Works], particularly book 2, ch. 7 [‘Ecclesiastical Law Obliges the Faithful in Conscience…’], and the Brothers of Valemborch, tome 1, p. 183; tome 2, p. 187, among the papists; and among those of our communion, the supplement to Chamier, p. 375; Rivet’s Summary of Controversies [in French], tract 2, question 9 [‘Whether the Church may Make Laws?’]; [Jean] Mestrezat, Of the Church, Theses of Salmur, tome 1, disputation 1 [‘Whether Conscience to the Faith is Prior to that of the Church, or that to the Church is Prior to that of the Faith?’]. But this is not all, the Confession of Faith, published by the Reformed Churches of France, is express to the same purpose; see Article 33. So that if I have gone too far in this respect, I have all the Protestant Churches for my vouchers.”

— Jean La Placette, Ch. 10, ‘Of Ecclesiastical Ordinances’ &amp; ‘Remarks on the 10th Chapter’ in The Christian Casuist: or, a Treatise of Conscience (London: 1705). pp. 64-92, pp. 71-75">Copy</button><a class="share" href="https://x.com/intent/post?text=%E2%80%9C%E2%80%A6if+the+laws+of+the+Church+obliged+the+conscience+in+such+a+%5Babsolute%5D+manner%2C+as+that+the+transgression+of+them+were+a+sin%2C+the+observance+of+them+would+then+be+a+good+action%E2%80%A6+%E2%80%A6the+persons+against+whom+I+dispute%2C+pretend+the+violation+of+ecclesiastical+laws+to+be+therefore+only+sinful%2C+because+it+implies+an+infraction+of+the+law+of+God%2C+who+has+commanded+us+to+obey+the+Church%3A+but+if+not+to+do+what+the+Church+enjoins+be+to+violate+the+law+of+God%2C+must+it+not+be+allowed%2C+that+to+comply+with+her+injunctions%2C+is+to+observe+the+same+divine+law%2C+and+consequently+to+perform+a+good+and+virtuous+act%3F%E2%80%A6+Lastly%2C+if+ecclesiastical+laws+obliged+the+conscience%2C+the+Church+would+only+have+changed+her+yoke+by+the+establishment+of+Christianity%3A+she+would+still+continue+a+slave%3B+and+the+only+difference+would+be%2C+that+whereas+under+the+%5BMosaic%5D+Law+her+servitude+was+terminated+with+respect+to+God%2C+she+would+now+be+in+bondage+to+men%E2%80%A6+%E2%80%A6ever+since+the+Reformation%2C+it+has+been+a+particular+controversy+between+the+Romanists+and+us%2C+whether+ecclesiastical+laws+oblige+the+conscience%2C+in+other+cases+besides+those+of+contempt+and+scandal.+The+Church+of+Rome+has+declared+for+the+affirmative%3B+and+Protestant+authors%2C+as+well+Lutherans+as+Calvinists%2C+for+the+negative.+If+any+question+this%2C+let+them+give+themselves+the+trouble+of+reading+Bellarmine+De+Bonis+Operibus+%5BOf+Good+Works%5D%2C+particularly+book+2%2C+ch.+7+%5B%E2%80%98Ecclesiastical+Law+Obliges+the+Faithful+in+Conscience%E2%80%A6%E2%80%99%5D%2C+and+the+Brothers+of+Valemborch%2C+tome+1%2C+p.+183%3B+tome+2%2C+p.+187%2C+among+the+papists%3B+and+among+those+of+our+communion%2C+the+supplement+to+Chamier%2C+p.+375%3B+Rivet%E2%80%99s+Summary+of+Controversies+%5Bin+French%5D%2C+tract+2%2C+question+9+%5B%E2%80%98Whether+the+Church+may+Make+Laws%3F%E2%80%99%5D%3B+%5BJean%5D+Mestrezat%2C+Of+the+Church%2C+Theses+of+Salmur%2C+tome+1%2C+disputation+1+%5B%E2%80%98Whether+Conscience+to+the+Faith+is+Prior+to+that+of+the+Church%2C+or+that+to+the+Church+is+Prior+to+that+of+the+Faith%3F%E2%80%99%5D.+But+this+is+not+all%2C+the+Confession+of+Faith%2C+published+by+the+Reformed+Churches+of+France%2C+is+express+to+the+same+purpose%3B+see+Article+33.+So+that+if+I+have+gone+too+far+in+this+respect%2C+I+have+all+the+Protestant+Churches+for+my+vouchers.%E2%80%9D%0A%0A%E2%80%94+Jean+La+Placette%2C+Ch.+10%2C+%E2%80%98Of+Ecclesiastical+Ordinances%E2%80%99+%26+%E2%80%98Remarks+on+the+10th+Chapter%E2%80%99+in+The+Christian+Casuist%3A+or%2C+a+Treatise+of+Conscience+%28London%3A+1705%29.+pp.+64-92%2C+pp.+71-75&amp;url=https%3A%2F%2F5solasquotes.github.io%2Fquote%2F74fed37c58.html&amp;via=5Solas" target="_blank" rel="noopener">Share on X</a><a class="perma" href="../quote/74fed37c58.html">Permalink</a><a class="src" href="https://reformedbooksonline.com/on-church-ordinances/#:~:text=if%20the%20laws%20of%20the%20Church,the%20Protestant%20Churches%20for%20my%20vouchers&amp;text=if%20the%20laws%20of%20the%20Church%20obliged%20the&amp;text=have%20all%20the%20Protestant%20Churches%20for%20my%20vouchers" rel="noopener" target="_blank">Read it online · Reformed Books Online</a></div>

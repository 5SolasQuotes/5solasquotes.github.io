<main class="wrap"><figure class="quote" id="q-5f08a677c6" data-kw="">
<blockquote><p>Blessed be God the father of our Lord Jesus Christ, which in these last and perilous times hath stirred up in all countries witnesses on to his son to testify the truth on to the unfaithful, to save at the least some from the snares of Antichrist which lead on to perdition. As ye may here perceive by that excellent and well learned young man Patrick born in Scotland of a noble progeny, which to testify the truth sought all means and took upon him priesthood (even as Paul circumcised Timothy to win the weak Jews) that he might be admitted to preach the pure word of God.

Notwithstanding as soon as the chamberlain and other bishops of Scotland had perceived that the light began to spring which disclosed their falsehood that they convey in darkness, they laid hands on him: and because he would not deny his saviour Christ at their instance they burnt him to ashes. Nevertheless God of his bounteous merry (to publish on to the whole world, what a man the monsters have murdered, hath reserved a little treatise made by this Patrick, which if ye list ye may call Patrick’s places. For it entreateth exactly of certain common places, which known, ye have the pith of all divinity. This treatise have I turned in to the English tongue to the profit of my nation: to whom I beseech God give light, that they may espy the deceitful paths of perdition &amp; return in to the right way which leadeth on to life everlasting. Amen.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/john-frith.html">John Frith</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Unto the Christian Reader in Patrick Hamilton, Patrick’s Places</cite></span></figcaption>
<div class="meta"><span class="t"><a href="../topics/worship.html">Worship</a></span></div>

</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-2c8917f261" data-kw="">
<blockquote><p>And forasmuch also as they have been so wonderfully abused within this Realm, to the high contumely and dishonour of God, and have been great cause of blindness, and of much contention among the king’s majesty’s loving subjects, and were like so to be still if they should remain, and chiefly seeing God’s word speaketh so much against them.

You may hereby right well consider, what great causes and grounds the king’s majesty had, to take them away within his Realm, following herein the example of the godly king Ezechias, who brake down the brazen serpent, when he saw it worshipped and was therefore greatly praised of God, not withstanding at the first, the same was made and set up by God’s commandment, and was not only a remembrance of God’s benefits, before received, but also a figure of Christ to come. And not only Ezechias, but also Manasses, and Josaphat and Josias the best kings that were of the Jews, did pull down images in the time of their Reign.

Consider than how Godly an act is this to take away so many images, not made by God’s commandments, whereunto contrary to God’s commandments and his honour were so many Idolatries committed. For unto Christ Prince’s office, and cure appertaineth the defence of God’s true word &amp; Christ[ian] religion, &amp; to take away all those things, which hinder or let true godliness and religion, or make trouble &amp; contention, within their realms.

So good children you have heard the true meaning of these words. Thou shalt make to thee no graven image, thou shalt not bow down &amp; worship the same, the which I pray you grave deeply in your memories, that when you be demanded, what is meant by the words heretofore rehearsed, you may answer. This commandment forbiddeth us all kind of idolatry as well bodily as ghostly, &amp; inhibiteth us to give the honour which is due unto God to any creature or image of creature, but to worship God alone.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/thomas-cranmer.html">Thomas Cranmer</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Catechismus, that is to say, a short instruction into Christian religion for the singular commodity and profit of children and young people</cite>, (n.p., 1548), unpaginated.</span></figcaption>

</figure><figure class="quote" id="q-b2e68becf5" data-kw="">
<blockquote><p>The 72d Psalm is an eminent instance of Christ being the subject matter of praise; the person spoken of. To apply it exclusively to David or to Solomon would contradict the facts of history and be little short of impiety. An infinitely greater than David or Solomon is here. While the petition with which the Psalm begins can apply to them both, in a far higher sense it applies to him who is both David’s Son and Lord. In this song the Old Testament worshipper prayed for the establishment and perpetuity of the kingdom of the Messiah before he came into the world. We in singing it and other Messianic songs celebrate the greatness of the kingdom and the glory of the King.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/thomas-sproull.html">Thomas Sproull</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Exposition of the Psalms in Reformed Presbyterian and Covenanter</cite></span></figcaption>
<div class="meta"><span class="t"><a href="../topics/worship/psalmody.html">Psalmody</a></span></div>

</figure><figure class="quote" id="q-e73cdb43c0" data-kw="">
<blockquote><p>God, who hath made the world. Paul’s drift is to teach what God is. Furthermore, because he hath to deal with profane men, he draweth proofs from nature itself; for in vain should he have cited testimonies of Scripture. I said that this was the holy man’s purpose, to bring the men of Athens unto the true God. For they were persuaded that there was some divinity; only their preposterous religion was to be reformed. Whence we gather, that the world doth go astray through bending crooks and boughts, yea, that it is in a mere labyrinth, so long as there remaineth a confused opinion concerning the nature of God.

For this is the true rule of godliness, distinctly and plainly to know who that God whom we worship is. If any man will intreat generally of religion, this must be the first point, that there is some divine power or godhead which men ought to worship. But because that was out of question, Paul descendeth unto the second point, that true God must be distinguished from all vain inventions. So that he beginneth with the definition of God, that he may thence prove how he ought to be worshipped; because the one dependeth upon the other. For whence came so many false worshippings, and such rashness to increase the same oftentimes, save only because all men forged to themselves a God at their pleasure? And nothing is more easy than to corrupt the pure worship of God, when men esteem God after their sense and wit.

Wherefore, there is nothing more fit to destroy all corrupt worshippings, than to make this beginning, and to show of what sort the nature of God is. Also our Saviour Christ reasoneth thus, John 4:24, “God is a Spirit.” Therefore he alloweth no other worshippers but such as worship him spiritually. And surely he doth not subtilely dispute of the secret substance [essence] of God; but by his works he declareth which is the profitable knowledge of him. And what doth Paul gather thence, because God is the creator, framer, and Lord of the world? to wit, that he dwelleth not in temples made with hands. For, seeing that it appeareth plainly by the creation of the world, that the righteousness, wisdom, goodness, and power of God doth reach beyond the bounds of heaven and earth; it followeth, that he can be included and shut up within no space of place.

Notwithstanding this demonstration seemeth to have been in vain, because they might readily have said, that images and pictures were placed in temples to testify God’s presence; and that none was so gross but that he knew that God did fulfil [fill] all things. I answer, that that is true which I said a little before, that idolatry is contrary to itself. The unbelievers said, that they worshipped the gods before their images; but unless they had tied the Godhead and power of God to images, and had hoped to be holpen thereby, would they have directed their prayers thither? Hereby it came also to pass, that one temple was more holy than another. They ran to Delphos that they might fet [fetch] the oracles of Apollo thence. Minerva had her seat and mansion at Athens. Now we see that Paul doth touch that false opinion, whereby men have always been deceived; because they feigned to themselves a carnal God.

This is the first entrance into the true knowledge of God, if we go without ourselves, and do not measure him by the capacity of our mind; yea, if we imagine nothing of him according to the understanding of our flesh, but place him above the world, and distinguish him from creatures. From which sobriety the whole world was always far; because this wickedness is in men, naturally to deform God’s glory with their inventions. For as they be carnal and earthy, they will have one that shall be answerable to their nature. Secondly, after their boldness they fashion him so as they may comprehend him. By such inventions is the sincere and plain knowledge of God corrupt; yea, his truth, as saith Paul, is turned into a lie, (Romans 1:25.) For whosoever doth not ascend high above the world, he apprehendeth vain shadows and ghosts instead of God.</p></blockquote>

— John Calvin, Commentary on the Acts of the Apostles, ed. Henry Beveridge, trans. Christopher Fetherstone (1560; London, 1585) in Calvin’s Commentaries (22 vols, Grand Rapids: Baker, 1993), 19a: 157-59.">Copy</button><a class="share" href="https://x.com/intent/post?text=%E2%80%9CGod%2C+who+hath+made+the+world.+Paul%E2%80%99s+drift+is+to+teach+what+God+is.+Furthermore%2C+because+he+hath+to+deal+with+profane+men%2C+he+draweth+proofs+from+nature+itself%3B+for+in+vain+should+he+have+cited+testimonies+of+Scripture.+I+said+that+this+was+the+holy+man%E2%80%99s+purpose%2C+to+bring+the+men+of+Athens+unto+the+true+God.+For+they+were+persuaded+that+there+was+some+divinity%3B+only+their+preposterous+religion+was+to+be+reformed.+Whence+we+gather%2C+that+the+world+doth+go+astray+through+bending+crooks+and+boughts%2C+yea%2C+that+it+is+in+a+mere+labyrinth%2C+so+long+as+there+remaineth+a+confused+opinion+concerning+the+nature+of+God.%0A%0AFor+this+is+the+true+rule+of+godliness%2C+distinctly+and+plainly+to+know+who+that+God+whom+we+worship+is.+If+any+man+will+intreat+generally+of+religion%2C+this+must+be+the+first+point%2C+that+there+is+some+divine+power+or+godhead+which+men+ought+to+worship.+But+because+that+was+out+of+question%2C+Paul+descendeth+unto+the+second+point%2C+that+true+God+must+be+distinguished+from+all+vain+inventions.+So+that+he+beginneth+with+the+definition+of+God%2C+that+he+may+thence+prove+how+he+ought+to+be+worshipped%3B+because+the+one+dependeth+upon+the+other.+For+whence+came+so+many+false+worshippings%2C+and+such+rashness+to+increase+the+same+oftentimes%2C+save+only+because+all+men+forged+to+themselves+a+God+at+their+pleasure%3F+And+nothing+is+more+easy+than+to+corrupt+the+pure+worship+of+God%2C+when+men+esteem+God+after+their+sense+and+wit.%0A%0AWherefore%2C+there+is+nothing+more+fit+to+destroy+all+corrupt+worshippings%2C+than+to+make+this+beginning%2C+and+to+show+of+what+sort+the+nature+of+God+is.+Also+our+Saviour+Christ+reasoneth+thus%2C+John+4%3A24%2C+%E2%80%9CGod+is+a+Spirit.%E2%80%9D+Therefore+he+alloweth+no+other+worshippers+but+such+as+worship+him+spiritually.+And+surely+he+doth+not+subtilely+dispute+of+the+secret+substance+%5Bessence%5D+of+God%3B+but+by+his+works+he+declareth+which+is+the+profitable+knowledge+of+him.+And+what+doth+Paul+gather+thence%2C+because+God+is+the+creator%2C+framer%2C+and+Lord+of+the+world%3F+to+wit%2C+that+he+dwelleth+not+in+temples+made+with+hands.+For%2C+seeing+that+it+appeareth+plainly+by+the+creation+of+the+world%2C+that+the+righteousness%2C+wisdom%2C+goodness%2C+and+power+of+God+doth+reach+beyond+the+bounds+of+heaven+and+earth%3B+it+followeth%2C+that+he+can+be+included+and+shut+up+within+no+space+of+place.%0A%0ANotwithstanding+this+demonstration+seemeth+to+have+been+in+vain%2C+because+they+might+readily+have+said%2C+that+images+and+pictures+were+placed+in+temples+to+testify+God%E2%80%99s+presence%3B+and+that+none+was+so+gross+but+that+he+knew+that+God+did+fulfil+%5Bfill%5D+all+things.+I+answer%2C+that+that+is+true+which+I+said+a+little+before%2C+that+idolatry+is+contrary+to+itself.+The+unbelievers+said%2C+that+they+worshipped+the+gods+before+their+images%3B+but+unless+they+had+tied+the+Godhead+and+power+of+God+to+images%2C+and+had+hoped+to+be+holpen+thereby%2C+would+they+have+directed+their+prayers+thither%3F+Hereby+it+came+also+to+pass%2C+that+one+temple+was+more+holy+than+another.+They+ran+to+Delphos+that+they+might+fet+%5Bfetch%5D+the+oracles+of+Apollo+thence.+Minerva+had+her+seat+and+mansion+at+Athens.+Now+we+see+that+Paul+doth+touch+that+false+opinion%2C+whereby+men+have+always+been+deceived%3B+because+they+feigned+to+themselves+a+carnal+God.%0A%0AThis+is+the+first+entrance+into+the+true+knowledge+of+God%2C+if+we+go+without+ourselves%2C+and+do+not+measure+him+by+the+capacity+of+our+mind%3B+yea%2C+if+we+imagine+nothing+of+him+according+to+the+understanding+of+our+flesh%2C+but+place+him+above+the+world%2C+and+distinguish+him+from+creatures.+From+which+sobriety+the+whole+world+was+always+far%3B+because+this+wickedness+is+in+men%2C+naturally+to+deform+God%E2%80%99s+glory+with+their+inventions.+For+as+they+be+carnal+and+earthy%2C+they+will+have+one+that+shall+be+answerable+to+their+nature.+Secondly%2C+after+their+boldness+they+fashion+him+so+as+they+may+comprehend+him.+By+such+inventions+is+the+sincere+and+plain+knowledge+of+God+corrupt%3B+yea%2C+his+truth%2C+as+saith+Paul%2C+is+turned+into+a+lie%2C+%28Romans+1%3A25.%29+For+whosoever+doth+not+ascend+high+above+the+world%2C+he+apprehendeth+vain+shadows+and+ghosts+instead+of+God.%E2%80%9D%0A%0A%E2%80%94+John+Calvin%2C+Commentary+on+the+Acts+of+the+Apostles%2C+ed.+Henry+Beveridge%2C+trans.+Christopher+Fetherstone+%281560%3B+London%2C+1585%29+in+Calvin%E2%80%99s+Commentaries+%2822+vols%2C+Grand+Rapids%3A+Baker%2C+1993%29%2C+19a%3A+157-59.&amp;url=https%3A%2F%2F5solasquotes.github.io%2Fquote%2Fe73cdb43c0.html&amp;via=5Solas" target="_blank" rel="noopener">Share on X</a><a class="perma" href="../quote/e73cdb43c0.html">Permalink</a><a class="src" href="https://reformedcovenanter.wordpress.com/2020/05/22/john-calvin-on-drawing-proofs-from-nature-and-the-vanity-of-idolatry/" rel="noopener" target="_blank">Read it online · Reformed Covenanter</a></div>

<blockquote><p>…and consider the reason of such rules and commandments, which carries in it the light and the life of the commandments. For where that reason holds not, there are we free from the commandment; but where the reason is in force, there are we no less bound to the substance and effect of such particular commandment than they were. So if there could be like reason as caused that commandment to the disciples, we were in such case to keep it, and where the same offence is justly to be feared in eating of meats forbidden, as was then and may be in many like cases now and to the end, there that order of the apostles binds. As for the last place out of the 1 Cor. 11, if he look better upon it, he shall find that the apostle grounds that order there prescribed upon so general and necessary reasons of the ordinance of God, the glory of our Savior Christ, the regard of angels, and the voice of nature, and the custom of all the Churches, as he has taken his level far amiss to leave it at liberty, whether a man keep it or no: provided that he understand the apostle’s meaning aright: which is that men and women, especially being present in the public assemblies of the church, should carry the mark of their creation, agreeable to the sex whereof they were: the woman wearing upon her head a vail or kerchief, or such other attire (according to the lawful custom of their country and place of abode) as declares her sex and subjection to man by such coverture of her head. And the man, by not wearing any such attire upon his head as is proper to womankind, but by want of any such upon his head, show the glory of Christ, and the honor that in the order of creation is bestowed upon men. Therefore notwithstanding his caution or anything here alleged to the contrary, it remains firm and stable that the constant and perpetual examples of the Churches, the orders, rules, and commandments of our Savior Christ and of his apostles, both for the points of doctrine to be believed, and also for such as are to be obeyed and practiced in the public government of the Church, and in the private life of everyone, do bind the conscience of all the people of God to keep and to obey them: yea the most particular rules, the like case and reason being in us that was in them to whom they were given.</p></blockquote>

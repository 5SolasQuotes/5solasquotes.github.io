<main class="wrap"><figure class="quote" id="q-82d33e112a" data-kw="Pope as interpreter">
<blockquote><p>The cardinals attend the pope only in the way of ornament and pomp, and have no place in the settling of any definition. Yea, although all the cardinals were to say nay, yet the pope can define what he will. Therefore, although the Jesuit puts a council of pastors along with the pope, yet in reality this authority of interpretation is lodged with the pope alone; because, however much the rest oppose, yet his opinion shall always stand and prevail.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/william-whitaker.html">William Whitaker</a></span><span class="wk"><span class="lbl">Work:</span> <cite>A Disputation on Holy Scripture</cite>, Question 5, ch. 3</span></figcaption>

</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-694d9cd5ae" data-kw="">
<blockquote><p>Further, he took upon him power, rule, and authority over the Christian church, and over the Holy Scriptures, the Word of God; … They who, against God&#x27;s Word, boast of the church&#x27;s authority, are mere idiots. The pope attributes more power to the church, which is begotten and born, than to the Word, which has begotten, conceived, and borne the church.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/martin-luther.html">Martin Luther</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Table Talk</cite>, Of the Pope, CCCCLIII, p. 269</span></figcaption>

</figure><figure class="quote" id="q-09308723bf" data-kw="">
<blockquote><p>No sooner is such a word spoken but immediately the wicked bestial lives, the ignorance, atheisms, and horrid ends of many of them, present themselves to the thoughts of men, and a tremor comes over their hearts to hear men open their mouths with such blasphemies as to affirm that the Lord Christ did as much manifest his divinity and power in such beasts as in his own person.</p></blockquote>

</figure><figure class="quote" id="q-386ba41121" data-kw="">
<blockquote><p>Doth he succeed him in his personal qualifications, which were of such extraordinary advantage unto the church of God in his days, — his faith, love, holiness, light, and knowledge? You will not say so. Many of your popes, by your own confession, have been ignorant and stupid; many of them flagitiously wicked, to say no more.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/john-owen.html">John Owen</a></span><span class="wk"><span class="lbl">Work:</span> <cite>A Vindication of the Animadversions on Fiat Lux</cite>, ch. 8</span></figcaption>

</figure><figure class="quote" id="q-819cd372c2" data-kw="">
<blockquote><p>According to the judgment of the Nicene Council, we say, that the Bishop of Rome hath no more jurisdiction over the Church of God than the rest of the patriarchs, either of Alexandria, or of Antiochia have. And as for the Bishop of Rome, who now calleth all matters before himself alone, except he do his duty as he ought to do, except he minister the Sacraments, except he instruct the people, except he warn them and teach them, we say that he ought not of right once to be called a bishop, or so much as an elder. For a bishop, as saith Augustine, is a name of labour, and not of honour: because he will have that man understand himself to be no bishop, which will seek to have pre-eminence, and not to profit others.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/john-jewel.html">John Jewel</a></span><span class="wk"><span class="lbl">Work:</span> <cite>An Apology of the Church of England</cite>, Part 2</span></figcaption>

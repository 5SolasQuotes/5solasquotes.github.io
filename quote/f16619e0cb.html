<main class="wrap"><figure class="quote" id="q-f16619e0cb" data-kw="">
<blockquote><p>There are commandments which may be called the least, and there are others which may be called the greatest, In ordine motum [in the order of the motion], the order shows the weight. The fundamental article of the Covenant is to have God for our God, and to prefer natural worship before instituted: the means stated, before manner and time [of them]; God before man; parents before others.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/thomas-manton.html">Thomas Manton</a></span><span class="wk"><span class="lbl">Work:</span> <cite>‘The Preference of Duties: Morals Before Rituals’ on Mt. 9:13 in Works, vol. 2, Several Discourses Tending to Promote Peace and Holiness, pp. 6-22</cite>, p. 7</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/the-lords-supper/preparation-celebration-reflection.html">Preparation, Celebration, Reflection</a></span></div>

</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-f4f0adf507" data-kw="">
<blockquote><p>II. …This latter opinion [of Martin Luther] is followed by the Lutherans of our day. They maintain that to break means nothing else than to distribute the bread and give it to another; although they do not deny that Christ properly broke the bread. But this ceremony [of breaking the bread] is merely free and indifferent, lacking a command, which the church can at pleasure observe or omit… III. The [reformed] orthodox retain the breaking which was employed by the Lord… They think it is not an accidental and indifferent ceremony, but according to the institution of Christ, no less necessary than taking it in the hand, delivering and communing. Nor yet do they wish to contend so rigidly about it that no fellowship can be retained with those who omit it. they think this want [lack] of a thing not unimportant should neither be left unnoticed, nor tolerated if it can be corrected. Thus they are to be rebuked who hold this opinion, although they are not to be absolutely condemned.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/francis-turretin.html">Francis Turretin</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Institutes (P&amp;R), vol. 3, 19th Topic, ‘The Sacraments’, section 3</cite>, p. 443</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/the-lords-supper/preparation-celebration-reflection.html">Preparation, Celebration, Reflection</a></span></div>

</figure><figure class="quote" id="q-ebf3a1e066" data-kw="">
<blockquote><p>The statement of the question is not: (1) whether proper reverence and honor are due to the bread and the cup, the symbols of the Lord’s body and blood, both on account of the majesty of the author and the divinity of the things they seal and the excellent and singular use they have in religion, such as is legitimately exhibited to baptism and other rites and signs of religion. … However, we, although not denying that a proper reverence should be paid to the sacred symbol, do deny that the adoration which is due to the supreme God (usually designated by the Romanists as the worship of latria) should be paid to them. And although in one and the same celebration of the sacrament, they are made once and at the same time, still we think that they ought to be distinct the one from the other and unconfounded that we may not receive the signs for the things themselves; but may pay reverence to the signs indeed, but adoration to Christ alone. As in baptism of adults, the adoration of Christ (into whom they are initiated) and the reverence towards the water (the sacred symbol of the mystery) remain widely distinct… But we deny that on this account the sacrament itself should be adored; nay, we reject this worship as a most foul and detestable idolatry and bread-worship (artolatreian).</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/francis-turretin.html">Francis Turretin</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Institutes 3.538-39</cite></span></figcaption>

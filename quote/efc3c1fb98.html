<main class="wrap"><figure class="quote" id="q-efc3c1fb98" data-kw="">
<blockquote><p>For you [a Romanist] say that that privation which Adam contracted by sinning, we, by being born, although it is a sin, is yet not our sin nor proper to us, unless because what Adam did when he sinned, we also did, the apostle saying, “In him all have sinned.” [Rom. 5:12] And this also I acknowledge. For his will was ours; and therefore his transgression is ours, because he is not considered as one man, but as the root of the human race, in whom we were all included by virtue [in potency or in power], as Augustine says, “we were all that one man” (De pecc. merit. &amp; remiss., bk. 1, ch. 10). But now original sin does not consist only in the deformity which the fault of Adam brought forth, but it also comprehends the act of that sin itself, if we did the same as Adam did, if we truly sinned with Adam, and what he willed, we willed. Original sin will therefore not be so involuntary as you think, so that it is therefore the least of all sins because it has the least of that which is voluntary. For if Adam’s will was ours, as much as Adam willed, so much are we also to be thought to have willed. But Adam sinned knowingly and willingly; we therefore in him, and by that his will, both have sinned and willed to sin. But unless you admit imputation here (a word from which you abhor and carefully guard yourself), you will fall into the greatest absurdity, and you will fight with yourself, you who a little before said that the sin which entered into the world, and by which we are all made sinners, is not the actual sin of Adam, but a certain iniquity contracted from it and transmitted into us. Now you attribute to us the same will of sinning which was in Adam; otherwise, you affirm, this privation left in nature by sin could not make us sinners. Therefore, we are not only bound by a habitual iniquity, but we have sinned with an actual will in Adam; and this will is primarily to be considered in original sin, without which we could neither be nor be held as sinners. What you [Bellarmine] interpose concerning a pact or precept pertains nothing to the matter; for whether Adam received this justice on this law and condition, that he should either preserve or lose it for himself and his own, or whether no such convention intervened between God and Adam, since he was the parent and origin of the nature and of the human race, it was necessary that in him we either stand or fall. Although, that God threatened him with death if he should move his hand to the forbidden tree, from this it sufficiently appears that he had been forewarned of the danger into which he would cast himself headlong if he should sin, of which nothing was to be feared if he should remain in his duty. And hither is wont to be brought what we read in the prophet: “But they like Adam have transgressed the covenant” (Hos. 6:7). Nor is it to be thought that Adam was ignorant either of the reward, if he should not sin, or of the punishment, if he should dare to sin. Unless this had been foretold to him, he would have had some excuse, although not a sufficient one; now, having been taught before of the event, since he did not have faith nor take care for himself, he is to be thought to have deservedly fallen into this calamity. Although, however, there had been no word on this matter, yet what unhappiness he willingly brings upon himself, God has justly inflicted upon all his posterity. But in what way? Because His will is the norm of right and of justice. You will never otherwise understand it to have been just that we are all born miserable on account of the temerity, or infidelity, or ambition, or whatever fault of the first man. For that you say his will was ours, and we willed in him, I confess to be true, but the reason for this truth is none other than the will of the creator. For what cause will you bring [on your view] why all children do not in the same way atone for the faults of their parents? You will say that Adam is to be considered as the seed and principle of nature, and his sin was the sin of nature itself; the sins of others are personal; therefore his is transfused with nature, not those of others. I hear, and I do not object. But why Adam by sinning destroyed not only his person but nature, when other men harm their own persons but do not make nature worse, assign a cause, if you can, other than the most just will of God.</p></blockquote>

</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-86a6f25ed5" data-kw="covenant reward">
<blockquote><p>By his own right, God could indeed have prescribed obedience to man (created by him) without any promise of reward. But in order to temper that supreme dominion with his goodness, he added a covenant consisting in the promise of a reward and the stipulation of obedience. As he wished to assert more strongly his own right over man, so he demonstrated the highest benignity in this—that he (himself in need of nothing) willed to invite to a nearer communion with him the creature already subject to him by right of creation.</p></blockquote>

<blockquote><p>Controversy – Did man before the Fall have the promises of a blessed life and the glory of heaven? We affirm against the Socinians and Anabaptists. Arguments:

1. The covenant of God, “Do this and live,” only had a place before the Fall and in the case of Christ, but it means, “you will live forever” (Gal. 3:12, 21).

2. The death denounced to man includes eternal death under the dominion of the devil, as we may conclude from Gen. 3:13 and 1 Cor. 15:22; therefore, the promised life was eternal life.

3. The law has only been weakened through sin so that it cannot save (salvare) (Rom. 8:3); therefore, before sin it was able to save (salvare).

4. He had the tree of life, and the thing that it signified was eternal life (Rev. 2:7).</p></blockquote>

<div class="actions"><button class="copy" data-copy="“Controversy – Did man before the Fall have the promises of a blessed life and the glory of heaven? We affirm against the Socinians and Anabaptists. Arguments:

1. The covenant of God, “Do this and live,” only had a place before the Fall and in the case of Christ, but it means, “you will live forever” (Gal. 3:12, 21).

2. The death denounced to man includes eternal death under the dominion of the devil, as we may conclude from Gen. 3:13 and 1 Cor. 15:22; therefore, the promised life was eternal life.

3. The law has only been weakened through sin so that it cannot save (salvare) (Rom. 8:3); therefore, before sin it was able to save (salvare).

4. He had the tree of life, and the thing that it signified was eternal life (Rev. 2:7).”

— Leonard Riissen, A Complete Summary of Elenctic Theology &amp; of as Much Didactic Theology as is Necessary, trans. J. Wesley White MTh thesis (Bern, 1676; GPTS, 2009), Ch. 9, ‘The Law, the Fall &amp; Sin’, pp. 82-99">Copy</button><a class="share" href="https://x.com/intent/post?text=%E2%80%9CControversy+%E2%80%93+Did+man+before+the+Fall+have+the+promises+of+a+blessed+life+and+the+glory+of+heaven%3F+We+affirm+against+the+Socinians+and+Anabaptists.+Arguments%3A+1.+The+covenant+of+God%2C+%E2%80%9CDo+this+and+live%2C%E2%80%9D+only+had+a+place+before+the+Fall+and+in+the+case+of+Christ%2C+but+it+means%2C+%E2%80%9Cyou+will+live+forever%E2%80%9D+%28Gal.+3%3A12%2C+21%29.+2.+The+death+denounced+to+man+includes+eternal+death+under+the+dominion+of+the+devil%2C+as+we+may+conclude+from+Gen.+3%3A13+and+1+Cor.+15%3A22%3B+therefore%2C+the+promised+life+was+eternal+life.+3.+The+law+has+only+been+weakened+through+sin+so+that+it+cannot+save+%28salvare%29+%28Rom.+8%3A3%29%3B+therefore%2C+before+sin+it+was+able+to+save+%28salvare%29.+4.+He+had+the+tree+of+life%2C+and+the+thing+that+it+signified+was+eternal+life+%28Rev.+2%3A7%29.%E2%80%9D%0A%0A%E2%80%94+Leonard+Riissen%2C+A+Complete+Summary+of+Elenctic+Theology+%26+of+as+Much+Didactic+Theology+as+is+Necessary%2C+trans.+J.+Wesley+White+MTh+thesis+%28Bern%2C+1676%3B+GPTS%2C+2009%29%2C+Ch.+9%2C+%E2%80%98The+Law%2C+the+Fall+%26+Sin%E2%80%99%2C+pp.+82-99&amp;url=https%3A%2F%2F5solasquotes.github.io%2Fquote%2F956ef8743f.html&amp;via=5Solas" target="_blank" rel="noopener">Share on X</a><a class="perma" href="../quote/956ef8743f.html">Permalink</a><a class="src" href="https://reformedbooksonline.com/topics/the-covenant-of-works/#:~:text=Controversy%20%E2%80%93%20Did%20man%20before%20the,signified%20was%20eternal%20life%20%28Rev.%202%3A7&amp;text=Controversy%20%E2%80%93%20Did%20man%20before%20the%20Fall%20have&amp;text=that%20it%20signified%20was%20eternal%20life%20%28Rev.%202%3A7" rel="noopener" target="_blank">Read it online · Reformed Books <blockquote><p>…describes the entire biblical history as a series of events by which an original covenant of works is gradually annulled, bringing new phases in the history of the covenant of grace. He shows that God’s standard way of relating to mankind is through covenant, which, at its heart, is friendship with God.” – Bookflap Vlak, Johannes – Dissertation 1, On the Covenant of Works of God in A Triad of Dissertations: on the Covenants of God of Works &amp; of Peace, &amp; on Justification in Response to Leydekker (1689), pp. 71-170 trans. AI Latin Vlak (c.1635-1690) appears to have leaned towards Cocceius, contra Leydekker who was a Voetian. Flavel, John – Vindiciæ Legis &amp; Fœderis: or, A Reply to Mr. Philip Cary’s Solemn Call, wherein he Pretends to Answer All the Arguments of Mr. Allen, Mr. Baxter, Mr. Sydenham, Mr. Sedgwick, Mr. Roberts, and Dr. Burthogge for the Right of Believers’ Infants to Baptism, by Proving the Law at Sinai &amp; the Covenant of Circumcision with Abraham were the Very Same with Adam’s Covenant of Works, &amp; that Because the Gospel-Covenant is Absolute (London, 1690) . 1700’s Hopkins, Ezekiel – The Doctrine of the Two Covenants, wherein the Nature of Original Sin is at Large Explained… (London, 1712) Table of Contents This is also in vol. 2 of his Works. Hopkins (1634-1690) was a reformed, Anglican divine in the Church of Ireland. Hog, James – Some Select Notes Towards Detecting a Covered Mixture of the Covenant of Works, &amp; of Grace: With the Danger of that Evil; &amp; a Few Advices for Remedying Thereof. Contained in a Letter to a Friend Upon the Head Ref (1718) 20 pp. Hog (c.1658-1734) was a Scottish minister at Carnock, known for his role in the Marrow Controversy within the Church of Scotland. Taylor, Richard – Discourses on the Fall &amp; Misery of Man: &amp; on the Covenant of Grace (London: John Clark, 1725) 379 pp. Herman Witsius footnotes this work under the statement: “The formularies of the Protestant Churches in general, and the writings of the most eminent Reformed Divines…” – On the Apostles’ Creed, Note XII, p. 386 Wilson, David – Palæmon’s Creed Reviewed &amp; Examined: wherein Several Gross &amp; Dangerous Errors, Advanced by the Author of the Letters on Theron &amp; Aspasio, are Detected &amp; Refuted; &amp; the Protestant Doctrine Concerning the Covenant of Works &amp; the Covenant of Grace, Conviction of Sin, Regeneration, Faith, Justification, Inherent Grace, etc., Vindicated from the Cavils and Exceptions of that Author, and shown to be entirely conformable to the Apostolic Doctrine concerning the several points afore-mentioned, vol. 1, 2 (London, 1762) Wikipedia: “Theron and Aspasio, or a series of Letters upon the most important and interesting Subjects [by James Hervey, 1724-58, an Anglican clergyman], which appeared in 1755, and was equally well received, called forth some adverse criticism even from Calvinists, on account of tendencies which were considered to lead to antinomianism, and was strongly objected to by Wesley in his Preservative against unsettled Notions in Religion. Besides carrying into England the theological disputes to which the Marrow of Modern Divinity had given rise in Scotland (the Marrow Controversy), it also led to what is known as the Sandemanian controversy as to the nature of saving faith.</p></blockquote>

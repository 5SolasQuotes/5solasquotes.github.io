<blockquote><p>Donald Cargill’s theonomic views of the judicial law are further explicated in the Queensferry Paper of 1680, a document which was owned by many of the covenanting martyrs in their dying testimonies (for more on this see A cloud of witnesses for the royal prerogatives of Jesus Christ ). The teachings of the Queensferry Paper are thus part of the covenanted testimony for which the martyrs laid down their lives. Any divergence from its view of biblical penology, therefore, represents a serious departure from Covenanter principles.

In the third article of the Queensferry Paper, the adherents, in accordance with the National Covenant (1638) and Solemn League and Covenant (1643), bound themselves to extirpate gross sins and crimes against the first table of the law:

That we shall endeavour to our utmost, the extirpation of the kingdom of Darkness, and whatsoever is contrary to the kingdom of Christ, and especially Idolatry, and Popery in all the Articles of it, as we are bound in our National Covenant; and Superstition, Will-Worship, and Prelacy, with its Hierarchy, as we are bound in our Solemn League and Covenant; And that we shall with the same sincerity, endeavour (God giving us assistance) the overthrow of that Power that hath established that Prelacy and Erastianism over the Church, and exercises such a lustful and arbitrary Tyranny over the Subjects, seeking again to introduce Idolatry and Superstition in these Lands, contrary to our Covenants: And in a word, that we shall endeavour the extirpation of all the works of Darkness, and the Relics of Idolatry and Superstition, (which are both much enlarged and revived in our times,) and execute righteous judgment impartially (according to the word of God, and degree of offences) upon committers of those things, especially, to wit, the blasphemy, idolatry, atheism, sorcery, perjury, uncleanness, profanation of the Lord’s day, oppression, and malignancy, that thus being zealous of God’s glory, he may delight to dwell in the midst of us. [1]

What is important about this extract, for our present purposes, is that it demonstrates to us that the strictest Covenanters believed that the civil magistrate was to execute righteous judgment by punishing a multiplicity of crimes in accordance with biblical law – a central tenet of theonomy. Since many of the crimes listed above were punished in scripture with the death sentence, it is stretching credulity to think that Cargill would have consented to the modern notion that capital punishment only applies to murder.

Cargill also complained about the covenant-breaking regime in Scotland not upholding biblical jurisprudence:

So that it can no more be called a Government, but a lustful Rage, exercised with as little right reason, and with more cruelty then in Beasts, and they themselves can be no more called Governors, but publick Grassators, and publick Judgments, which all Men ought as earnestly to labour to be free of, as of Sword, Famine, or Pestilence raging amongst us; and besides, hath stopped (instead of punishing) the course of Law and Justice against Idolaters, Blasphemers, Atheists, Murderers, Incestuous and Adulterous, and other Malefactors; and instead of rewarding the Good, hath made Butcheries and Murthers on the Lords People, sold them as Slaves, Imprisoned, Forfaulted, Banished and Fined them, upon no other account, but for maintaining the Lords Right to rule Consciences, against the usurpations of Men, for fulfilling their Vows, and repelling unjust Violence, which innocent Nature allows to all; of which, and more particulars, we can give (we speak as before God) innumerable and sure instances …[2]

Obviously, he could not have said this if he had believed that the Mosaic judicials had been entirely set aside or that capital punishment was to be reserved for the single crime of murder. Instead, Cargill taught the magistrates of covenanted Scotland were to govern in accordance with biblical civil law:

Moreover, we declare that these Men whom we shall set over us, shall be engaged to govern us principally by that Civil or Judicial Law, given by God to His People of Israel, especially in matters of Life and Death, and in all other things also, so far as they teach, excepting only that Law, (viz. anent Slaves,) which does not agree with that Christian Liberty established in all Christendom (only violated by our Tyrants, and some others of late,) [obviously he is not saying that the Old Testament authorised chattel slavery, based on manstealing] and that of Divorces and Polygamy; the one being not a Law, but a permission granted upon the account of the hardness of their Hearts, the other being a sinful custom contrary to the first institution of Marriage, crept into the Church …[3]

Cargill avoids the extremist opinion that the entire judicial law of Moses remains binding, recognising that specifically Jewish laws have expired. Laws such as those permitting the heathen to be used by Israelites as unpaid bondservants were deemed to be incongruous with the inclusion of the Gentiles into the New Testament church (Colossians 4:1 teaches that servants are to be paid wages, which is not consistent even with voluntary bondservice). Nevertheless, Cargill does recognise that the parts of the judicial law which are also part of the moral law, especially those dealing with crime and punishment, are to be followed by the Christian magistrate.

[1] A true and exact copy of a treasonable and bloody-paper called, the fanticks new-covenant: which was taken from Mr. Donald Cargill at Queens-Ferry, the third day of June, 1680 (Edinburgh, 1680), p. 4.

[2] Ibid., p, 5. The reference to slavery reveals that the early Covenanters, in common with their later heirs, condemned chattel slavery as a form of manstealing.</p></blockquote>

<blockquote><p>Other churches there are in the world which are not evidently guilty of the enormities in doctrine, worship and discipline before discoursed of. These all we judge to be true churches of Christ; and do hope that his promised presence is with them in their assemblies. Answerable hereunto is our judgment concerning their officers or rulers, and all their sacred administrations. It becomes us to think and believe that the one [their offices] have authority from Christ and that the other [their sacred administrations] are accepted with Him: For it is most unwarrantable rashness and presumption, yea an evident fruit of ignorance, or want of love, or secular private interest, when, upon lesser differences men judge churches to be no true churches and their ministers to be no true ministers, and consequently all their administrations to be invalid… But the validity or invalidity of the ordinances of Christ, which are the means of union and communion with Him unto all his disciples, depend not on the determination of things highly disputable in their notion, and not inconsistent with true Gospel-obedience in their practice… We stand to the judgment of Christ and his Word. We cannot but judge indeed that many Churches have missed, and do miss in some things the precise rules of their due constitution and walking; that many of them have added useless, superfluous rites to the worship of God among them; that there is in many of them a sinful neglect of evangelical discipline, or a carnal rule erected in the stead of it; that errors in doctrines of importance and danger, are prevalent in sundry of them; that their rulers are much influenced by a spirit of bitterness and envy against such as plead for reformation beyond their measure or interest; yet that hereupon they should all or any of them immediately forfeit their church-state, so as to have no lawful ministers, nor acceptable sacred administrations, is in itself a false imagination, and such as was never by us entertained.</p></blockquote>

— John Owen, A Discourse concerning Evangelical Love, Church-Peace &amp; Unity, (1672), ch. 3, pp. 84-86">Copy</button><a class="share" href="https://x.com/intent/post?text=%E2%80%9COther+churches+there+are+in+the+world+which+are+not+evidently+guilty+of+the+enormities+in+doctrine%2C+worship+and+discipline+before+discoursed+of.+These+all+we+judge+to+be+true+churches+of+Christ%3B+and+do+hope+that+his+promised+presence+is+with+them+in+their+assemblies.+Answerable+hereunto+is+our+judgment+concerning+their+officers+or+rulers%2C+and+all+their+sacred+administrations.+It+becomes+us+to+think+and+believe+that+the+one+%5Btheir+offices%5D+have+authority+from+Christ+and+that+the+other+%5Btheir+sacred+administrations%5D+are+accepted+with+Him%3A+For+it+is+most+unwarrantable+rashness+and+presumption%2C+yea+an+evident+fruit+of+ignorance%2C+or+want+of+love%2C+or+secular+private+interest%2C+when%2C+upon+lesser+differences+men+judge+churches+to+be+no+true+churches+and+their+ministers+to+be+no+true+ministers%2C+and+consequently+all+their+administrations+to+be+invalid%E2%80%A6+But+the+validity+or+invalidity+of+the+ordinances+of+Christ%2C+which+are+the+means+of+union+and+communion+with+Him+unto+all+his+disciples%2C+depend+not+on+the+determination+of+things+highly+disputable+in+their+notion%2C+and+not+inconsistent+with+true+Gospel-obedience+in+their+practice%E2%80%A6+We+stand+to+the+judgment+of+Christ+and+his+Word.+We+cannot+but+judge+indeed+that+many+Churches+have+missed%2C+and+do+miss+in+some+things+the+precise+rules+of+their+due+constitution+and+walking%3B+that+many+of+them+have+added+useless%2C+superfluous+rites+to+the+worship+of+God+among+them%3B+that+there+is+in+many+of+them+a+sinful+neglect+of+evangelical+discipline%2C+or+a+carnal+rule+erected+in+the+stead+of+it%3B+that+errors+in+doctrines+of+importance+and+danger%2C+are+prevalent+in+sundry+of+them%3B+that+their+rulers+are+much+influenced+by+a+spirit+of+bitterness+and+envy+against+such+as+plead+for+reformation+beyond+their+measure+or+interest%3B+yet+that+hereupon+they+should+all+or+any+of+them+immediately+forfeit+their+church-state%2C+so+as+to+have+no+lawful+ministers%2C+nor+acceptable+sacred+administrations%2C+is+in+itself+a+false+imagination%2C+and+such+as+was+never+by+us+entertained.%E2%80%9D%0A%0A%E2%80%94+John+Owen%2C+A+Discourse+concerning+Evangelical+Love%2C+Church-Peace+%26+Unity%2C+%281672%29%2C+ch.+3%2C+pp.+84-86&amp;url=https%3A%2F%2F5solasquotes.github.io%2Fquote%2F29283f1287.html&amp;via=5Solas" target="_blank" rel="noopener">Share on X</a><a class="perma" href="../quote/29283f1287.html">Permalink</a><a class="src" href="https://reformedbooksonline.com/on-impurities-in-worship/#:~:text=Other%20churches%20there%20are%20in%20the,as%20was%20never%20by%20us%20entertained&amp;text=Other%20churches%20there%20are%20in%20the%20world%20which&amp;text=and%20such%20as%20was%20never%20by%20us%20entertained" rel="noopener" target="_blank">Read it online · Reformed Books Online</a></div>

<blockquote><p>That whereunto more respect and account is given than God alloweth to be given to it, and wherein more excellency is placed than God hath put into it, or will at all communicate to it, is an idol exalted against God. […] Now, when Hooker accounteth festival days, for God’s extraordinary works wrought upon them, to be holier than other days, what man of sound judgment will not perceive that these days are idolised, since such an eminence and excellency is put in them, whereas God hath made no difference betwixt them and any other days?</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/george-gillespie.html">George Gillespie</a></span><span class="wk"><span class="lbl">Work:</span> <cite>A dispute against the English Popish ceremonies obtruded on the Church of Scotland</cite>, (1637; Edinburgh, 1844), p. 92.</span></figcaption>

</figure><figure class="quote" id="q-8483e69a21" data-kw="">
<blockquote><p>First, the power claimed by the governors of the Christian Church is not an arbitrary or capricious authority, to be wielded at will by them, in disregard of the rights or consciences of the members. There are certain limitations of a most important nature affixed to that power, and certain principles of a definite kind laid down for the use and administration of it, which set bounds round about it, and bring it into harmony with the liberty of conscience, rightfully belonging to every private individual of the Christian society. … 3rd. Church power is limited by the rule prescribed for its exercise, or by the Word of God. This third limitation ties down the administration of Church power to certain fixed principles and a certain definite law, and excludes the possibility of its becoming a wayward and arbitrary authority, to be wielded at the will or caprice of man. It forbids the unauthorized addition or subtraction of anything in the constitution, doctrine, worship, or discipline of the Church, such as Christ has not sanctioned in His Word.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/james-bannerman.html">James Bannerman</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Church of Christ</cite>, vol. 1 (Edinburgh, 1868), pp. 241-2, 248</span></figcaption>

</figure><figure class="quote" id="q-e7d89572bd" data-kw="">
<blockquote><p>Doctrine 1. Albeit the Lord have made creatures which are excellent above man, especially as he is now fallen by sin, yet none of these are so perfect as that they can boast of purity before Him. For it is here again inculcated that saints and the heavens are not clean. So that whatever perfections there be in some creatures above others, yet all of them must be sensible of imperfection before God. … 3. The best sight will be got of the emptiness of the creatures perfections when we look to God, how perfect He is, and what his thoughts are of the creatures; for they are not clean in his sight, says He, whatever others may think of them.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/george-hutcheson.html">George Hutcheson</a></span><span class="wk"><span class="lbl">Work:</span> <cite>An Exposition of the book of Job being the Sum of 316 Lectures</cite>, (1657), sermon on Job 15:15-16, p. 213</span></figcaption>

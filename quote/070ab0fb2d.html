<main class="wrap"><figure class="quote" id="q-070ab0fb2d" data-kw="">
<blockquote><p>So powerful and so insidious has been the influence of this [pantheistic] philosophy in Germany, where church history has been more scientifically studied than in any other country, that even historians whom charity compels us to accept as Christians write often as if the course of events were a necessary unfolding and development according to an internal law, without the direction or control of any presiding intelligence whatever.

Professor [Philip] Schaff, for example, who is not only a fine scholar and a man of great learning, but, I have no doubt, receives, ex animo, the doctrines of the Heidelberg Catechism, is disposed to apologise for the errors and abuses in the church as belonging to a particular stage of development, where, as it appears to us, fidelity to the truth and loyalty to his Master would have required him to judge and to pronounce according to the law and the testimony. Mr. [J. W.] Nevin, who was for some time his colleague at Mercersburg, has gone much further, and has applied the pantheistic theory of development in such a way as to reach the result of a sort of mixture of popery and eutychianism.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/thomas-peck.html">Thomas Peck</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Church History (1861) in Miscellanies of Rev. Thomas E. Peck, D.D., LL.D., Professor of Theology in the Union Theological Seminary in Virginia</cite></span></figcaption>
<div class="meta"><span class="t"><a href="../topics/civil-government-and-society.html">Civil Government and Society</a></span></div>

</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-cc95b40e74" data-kw="">
<blockquote><p>A second kind of abrogation of the Law, an outward one, is that the political laws of Moses do not apply to us at all. Therefore we should not restore them to the courthouse or chain ourselves to them in some superstitious way, as some men who were ignorant of this liberty did several years ago. Nevertheless, although the Gospel does not subject us to the civil laws of Moses, it does not completely set us free from obedience to all political laws; but in this bodily life it subjects us to the laws of the state in which we live, and it commands everyone to obey his magistrate and his laws, “not only to avoid God’s wrath but also for the sake of conscience” (1 Peter 2:13–14; Rom. 13:5). Nor would it be a sin if the emperor used some of the civil laws of Moses; in fact, it would be a good idea if he did. Therefore the sophists are in error when they imagine that after Christ the civil laws of Moses are fatal to us.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/martin-luther.html">Martin Luther</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Luther’s Works</cite>, Vol. 26: Lectures on Galatians, 1535, Chapters 1–4, ed. Jaroslav Jan Pelikan, Hilton C. Oswald, and Helmut T. Lehmann, vol. 26 (Saint Louis: Concordia Publishing House, 1999), 448.</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/civil-government-and-society.html">Civil Government and Society</a></span></div>

</figure><figure class="quote" id="q-6669dec487" data-kw="">
<blockquote><p>First, that the setting up of Christ to be King is the greatest, the most desirable good that ever can betide any Nation.

Secondly, that the concurrence of Nobles and Commons, and Soldiers, and Ministers, and Citizens to this work; their concurrence I say in this work, is the most glorious, the most amiable, the most desirable means of attaining this great good that any soul can wish; and if both these be manifested, that the one is the greatest, and the other the most desirable means to attain it; where these two things meet there must needs be matter of great you.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/stephen-marshall.html">Stephen Marshall</a></span><span class="wk"><span class="lbl">Work:</span> <cite>A Sacred Panegyrick, or A Sermon of Thanksgiving, Preaching to the Two Houses of Parliament</cite>, (London: Stephen Bowtell, 1644), p. 12.</span></figcaption>

</figure><figure class="quote" id="q-f9f8801f7c" data-kw="">
<blockquote><p>This offence was plagued with most sharp punishment even in the beginning almost, and as soon as the world was created. Pharao [sic], the king of Egypt, commanded Sara, Abraham’s wife, to be taken away and carried to his palace, that he might use her as his wife; thinking verily that she had been Abraham’s sister. But the scripture saith, “The Lord vexed Pharaoh and all his house with great plagues, because of Sara, Abraham’s wife.” Lo, here the king of Egypt is punished with grievous plagues for his adultery; and yet he knew not that Sara was Abraham’s wife: how great plagues therefore are prepared for the men that wittingly and willingly, without all shame, commit adultery! To Abimelech, king of the Philistines, the Lord doth say, “Lo, thou shalt die, because of the woman which thou hast taken away from her husband.” And yet this king also had taken away Sara, not knowing that she was Abraham’s wife. Joseph, being provoked to adultery by his master’s wife, doth simply say, “How should I do this great wickedness, and sin against God?” Every woth doth bear some weight: for adultery is an heinous sin. Whereupon in the book of Job we find these words of Job himself: “If mine heart have been deceived by a woman, or I have laid wait at my neighbour’s door; then let my wife be another man’s harlot, and let other men have to do with her. For this is a wickedness and sin that is worthy to be judged to death: yea, it is a fire that utterly should consume and root out all mine increase.” [Job 31] Job saith that he hath not only not committed adultery to defile another man’s wife. He confesseth that adultery is a sin, and so grievous an offence, that it doth deserve to have the adulterer’s wife to be defiled with adultery. He addeth that adultery is a fire that utterly consumeth and devoureth all things; and, lastly, that it is a sin to be judged, and punished with death.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/heinrich-bullinger.html">Heinrich Bullinger</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Fifty godly and learned sermons divided into the five decades containing the chief and principal points of Christian religion</cite>, ed. Thomas Harding (1849-52 Parker edn; 4 vols, Grand Rapids, 2004), i, 410-11.</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/civil-government-and-society.html">Civil Government and Society</a></span></div>

</figure><figure class="quote" id="q-ad6c570a0e" data-kw="">
<blockquote><p>We do not teach that Church-men are loosed from the positive laws of emperors and kings. Bellarmine [a Papal apologist] says that the magistrate can neither punish Church-men, nor convene them before the tribunal; so [Pope] Innocentius the third, says the empire is not above the Pope, but the Pope is above the empire… And what they allege for Peter’s exemption from paying tribute, will exime [exempt] all the disciples, and so all Church-men by divine right from the laws of princes. Yea all Clergy-men (say they [Papists]) by a divine positive law are eximed from the laws of magistrates. So says Suarez, Bellarmine, and the [??] of Rheimes, but with neither conscience, nor reason. And contrary to their own practice and doctrine: For Paul will have every soul subject to superior powers, and except the Roman Clergy want [lack] souls, they must also be subject. Solomon punished Abiathar, Josiah burnt the bones of the priests upon the altar, Christ subjected himself to his parents, payed tribute to Caesar, and commanded scribes and pharisees to do the like, Mt. 22, willing that they should give to Caesar those things which are Caesar’s. Paul appealed to Caesar’s tribunal, and Rom. 13, as many as may do evil [unqualified], as many as are in danger of resisting the power, are to be subject. Rom. 13:4; but Church-men are such, therefore they are subject.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/samuel-rutherford.html">Samuel Rutherford</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Due Right of Presbyteries, ‘Acts 15, A Pattern of a Juridicial Synod’</cite>, (1644), Appendix, pp. 454-5</span></figcaption>

<main class="wrap"><figure class="quote" id="q-36c2bc95f2" data-kw="">
<blockquote><p>If in the Old Testament God himself ordered lepers to be banished from the community and compelled to live outside the city to prevent contamination [Leviticus 13–14], we must do the same with this dangerous pestilence so that anyone who becomes infected will stay away from other persons, or allow himself to be taken away and given speedy help with medicine.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/martin-luther.html">Martin Luther</a></span><span class="wk"><span class="lbl">Work:</span> <cite>“Whether One May Flee From a Deadly Plague”</cite>, pp. 6-7</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/civil-government-and-society/plague-quarantine-and-public-health.html">Plague, Quarantine and Public Health</a></span></div>
<div class="actions"><button class="copy" data-copy="“If in the Old Testament God himself ordered lepers to be banished from the community and compelled to live outside the city to prevent contamination [Leviticus 13–14], we must do the same with this dangerous pestilence so that anyone who becomes infected will stay away from other persons, or allow himself to be taken away and given speedy help with medicine.”

— Martin Luther, “Whether One May Flee From a Deadly Plague”, pp. 6-7">Copy</button><a class="share" href="https://x.com/intent/post?text=%E2%80%9CIf+in+the+Old+Testament+God+himself+ordered+lepers+to+be+banished+from+the+community+and+compelled+to+live+outside+the+city+to+prevent+contamination+%5BLeviticus+13%E2%80%9314%5D%2C+we+must+do+the+same+with+this+dangerous+pestilence+so+that+anyone+who+becomes+infected+will+stay+away+from+other+persons%2C+or+allow+himself+to+be+taken+away+and+given+speedy+help+with+medicine.%E2%80%9D%0A%0A%E2%80%94+Martin+Luther%2C+%E2%80%9CWhether+One+May+Flee+From+a+Deadly+Plague%E2%80%9D%2C+pp.+6-7&amp;url=https%3A%2F%2F5solasquotes.github.io%2Fquote%2F36c2bc95f2.html&amp;via=5Solas" target="_blank" rel="noopener">Share on X</a><a class="perma" href="../quote/36c2bc95f2.html">Permalink</a><a class="src" href="https://reformedbooksonline.com/historic-reformed-quotes-on-social-distancing-the-adaptation-of-the-church/#:~:text=If%20in%20the%20Old%20Testament%20God,and%20given%20speedy%20help%20with%20medicine&amp;text=If%20in%20the%20Old%20Testament%20God%20himself%20ordered&amp;text=taken%20away%20and%20given%20speedy%20help%20with%20medicine" rel="noopener" target="_blank">Read it online · Reformed Books Online</a></div>
</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-cf1be67157" data-kw="">
<blockquote><p>And to Honoratus he [Augustine] says that in a great persecution, all ministers ought not to fly away, nor yet all abandon themselves unto peril, but those must be retained which shall be sufficient for the present use and the rest to be sent away, that they may be reserved till a better season. But here what maner of choosing shall be had? Those must be retained (says he) whom we shall think to be the more profitable and better for the people which remain. But if all shall be alike, and all shall say that they would tary and die, then says he the matter must be committed unto lots.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/peter-martyr-vermigli.html">Peter Martyr Vermigli</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Common Places… (London: Rowe, 1583), pt. 1, ch. 8, ‘Of Lots, whereby God’s Counsel was Asked…’</cite>, pp. 60</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/civil-government-and-society/plague-quarantine-and-public-health.html">Plague, Quarantine and Public Health</a></span></div>

</figure><figure class="quote" id="q-097d771964" data-kw="">
<blockquote><p>Believe if ye will [as it is claimed by Romanists] that [Emperor] Constantine gave to the Popes of Rome freedom and immunity from the imperial laws… we teach no such kingly power given to Church-men, and judge this Donation [of Constantine] to be a forged lie, invented by Papists… 6. We do not teach that Church-men are loosed from the positive laws of emperors and kings. [The Romanist, Robert] Bellarmine says that the Magistrate can neither punish Church-men, nor convene them before the tribunal… And as he says, by divine law the Pope is eximed [exempt] from all laws of princes… And what they allege for Peter’s exemption from paying tribute, will exime all the disciples, and so all Church-men by divine right from the laws of princes. Yea all Clergy-men (say they) by a divine positive law are eximed from the laws of Magistrates… Paul will have every soul subject to superior powers, and except the Roman clergy want [lack] souls, they must also be subject. Solomon punished [the priest] Abiathar, Josiah burnt the bones of the priests upon the altar, Christ subjected Himself to his parents, payed tribute to Caesar, and commanded scribes and pharisees to do the like, Mt. 22, willing that they should give to Ceasar those things which are Caesar’s. Paul appealed to Caesar’s tribunal, and Rom. 13, as many as may do evil, as many as are in danger of resisting the power, are to be subject, Rom. 13:4. 2. but Church-men are such, therefore they are subject.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/samuel-rutherford.html">Samuel Rutherford</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Due Right of Presbyteries (1644), pt. 2, Appendix</cite>, p. 454</span></figcaption>

</figure><figure class="quote" id="q-2fbace919d" data-kw="">
<blockquote><p>15. In times of extraordinary necessities of the Church, or State, or poor, there must be extraordinary bounty in our contributions; As if an enemy be ready to invade the land, or if some extraordinary work of God (as the conversion of some heathen nations) do require it, or some extraordinary persecution, and distress befall the pastors, or in a year of famine, plague, or war, when the necessities of the poor are extraordinary: The tenths in such cases will not suffice, from those that have more to give; Therefore in such a time, the primitive Christians sold their possessions, and laid down the price at the feet of the Apostles.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/richard-baxter.html">Richard Baxter</a></span><span class="wk"><span class="lbl">Work:</span> <cite>A Christian Directory, or a Sum of Practical Theology… (London, 1673) | Pt. 4</cite>, pp. 196-7</span></figcaption>

<blockquote><p>Yea also according to public extremities and necessities must our prayers be ordered, as in time of drought, for when fair weather is seasonable, for fair weather (1 Kings 18:42; Jam. 5:18): in time of plague (2. Sam. 24:25), etc. famine (Joel 1:14), war (Ex. 17:10-11), or any other like distress, for succor against those messengers of death: that thus so long as God hath appointed us to live in this world, we may comfortably pass over that time of life.</p></blockquote>

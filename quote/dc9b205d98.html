<main class="wrap"><figure class="quote" id="q-dc9b205d98" data-kw="">
<blockquote><p>The sufferings which justified believers are called upon to endure are not punishments, because not designed for the satisfaction of justice. They are chastisements intended for the benefit of the sufferer, the edification of the Church, and the glory of God.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/charles-hodge.html">Charles Hodge</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Systematic Theology</cite>, vol. 2, pt. 3, ch. 7, “Satisfaction of Christ,” § 2</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/trials-the-cross-and-comfort/affliction-as-gods-fatherly-discipline.html">Affliction as God&#x27;s Fatherly Discipline</a> › <a href="../topics/trials-the-cross-and-comfort/affliction-as-gods-fatherly-discipline/affliction-for-our-profit.html">Affliction for our profit</a></span><span class="t"><a href="../topics/priestly-office-satisfaction-and-atonement/nature-of-the-satisfaction.html">Nature of the Satisfaction</a></span></div>

</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-a6a670da33" data-kw="Affliction Comfort Love">
<blockquote><p>And what a comfort it is to believe this doctrine. If we are poor, or sick, or bereaved, or defamed, how delightful it is to know that it is the Lord, and not man; the Lord and not Satan; a friend and not an enemy; a most tender father and not a capricious master—who thus ordains. David was wise when he said, &quot;Let me fall into the hand of the Lord, and not into the hand of man.&quot; Luther said, &quot;Smite, Lord, for you love me.&quot; Every child of God may say as much.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/william-s-plumer.html">William S. Plumer</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Jehovah-Jireh: A Treatise on Providence</cite>, ch. “Practical Remarks on the Nature of God’s Providence”</span></figcaption>

</figure><figure class="quote" id="q-13755d1246" data-kw="Comfort Justice Assurance">
<blockquote><p>Let us oft think of this nearness between Christ and us, if we have once given our names to him, and not be discouraged for any sin or unworthiness in us. Who sues a wife for debt, when she is married? Uxori lis non intenditur. Therefore answer all accusations thus:—&#x27;Go to Christ.&#x27; If you have anything to say to me, go to my husband. God is just, but he will not have his justice twice satisfied, seeing whatsoever is due thereunto is satisfied by Christ our husband. What a comfort is this to a distressed conscience! If sin cannot dismay us, which is the ill of ills and cause of all evil, what other ill can dismay us?</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/richard-sibbes.html">Richard Sibbes</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Bowels Opened</cite>, Sermon II (Song 5:1)</span></figcaption>

</figure><figure class="quote" id="q-dac24ced2c" data-kw="Affliction">
<blockquote><p>The truth is, the crook in the lot is the great engine of Providence for making men appear in their true colours, discovering both their ill and their good. And if the grace of God is in them, it will bring it out, and cause it to display itself. It so puts the Christian to his shifts, that however it makes him stagger for awhile, yet it will at length evidence both the reality and the strength of grace in him.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/thomas-boston.html">Thomas Boston</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Crook in the Lot</cite>, Doct. I, head III (why God makes a crook)</span></figcaption>

<main class="wrap"><figure class="quote" id="q-dfac016fde" data-kw="">
<blockquote><p>That a man should duly, and as he ought, believe, and receive the decision of a synod, it must be both true and he must believe and know that it is true; but [on the other hand,] that it may oblige him and does oblige him, whether his conscience be erroneous, or no[t], is as true, for then this Commandment, ‘Thou shalt not kill’, ‘Honor thy father and thy mother’, should lay no obligation on a man that believes it is service to God to kill the apostles, as, John 16, some do. For no man is exempted from an obligation to obey God’s Law because of his own sinful and culpable ignorance, for we speak not now of invincible ignorance of these things which we are not obliged to know or believe. But if our sinful and erroneous conscience free us from actual obligation to be tied by a law, then our erroneous conscience frees us from sinning against a law, and so from punishment; for whatever frees a man from actual obligation frees him also from actual sinning: for all sin is a doing against a Law-obligation; and if so, then are none to be led by any rule but their own conscience: the written Law and Gospel is not henceforth our rule any more.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/samuel-rutherford.html">Samuel Rutherford</a></span><span class="wk"><span class="lbl">Work:</span> <cite>A Free Disputation Against Pretended Liberty of Conscience… (1649)</cite>, ch. 2, p. 34</span></figcaption>

</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-ccdb759494" data-kw="">
<blockquote><p>But first of all, it is necessary to consider certain changes which took place in Christian thought on this subject during the preceding centuries. Be the origin of the doctrine in the attempt to smooth the rough places of law for the sake of the weak or tender conscience, or in the practical necessity for a guiding principle of division as a kind of ready reckoner for pastoral purposes, or in both these causes, a change of deep significance came about in its structure. At first, and up to the close of the patristic era, the key-note of the distinction was oþjectivity. The external act is the criterion, so that there is a regular tabula of sins, the commission of any of which involves the sinner in mortal sin. But by the time of the Schoolmen, and notably, of in the works of St. Thomas Aquinas, a tremendous ethical course, change in the idea has come about. There are still sins which are reckoned as mortal, suo genere [in its genera], but the governing factor is no longer the external act. It is the deliberateness with which the act is committed. In other words, intention or motive is receiving recognition as the determining element in assessing the gravity of sin. It was to Peter Abelard [c. 1079–1142)] that Aquinas and his fellows were indebted for this improved idea: In the Scito Te Ipsum [Know Yourself, by Abelard] the discussion of sin moves forward out of the realm of externals. Consequent on this stressing of deliberateness at the expense of drawing a clear line between what was mortal and what venial. This indeterminacy. inevitably paved the way for laxity in the computation of the guiltiness of certain sinful acts.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/henry-r-mcadoo.html">Henry R. McAdoo</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Ch. 4, ‘Mortal &amp; Venial Sin: the Reforming Strain’ in The Structure of Caroline Moral Theology (Longmans, Green, 1949)</cite>, pp. 98-119</span></figcaption>

</figure><figure class="quote" id="q-e31e9ad7d3" data-kw="Original Sin">
<blockquote><p>Concupiscence, although it is without doubt born in us, is both an evil and sin; for we are not to judge according to nature, but according to the law whether a thing be sin or not. Whatever is opposed to the law is sin, whether it be born in us, or not.</p></blockquote>

</figure><figure class="quote" id="q-8f9e8de841" data-kw="">
<blockquote><p>If that law demands perfect conformity to the image of God, then these impulses of evil are clearly sinful. … The Protestant doctrine which pronounces these impulsive acts to be of the nature of sin is confirmed by the consciousness of the believer. He recognizes as evil in their own nature the first risings of malice, envy, pride, or cupidity.</p></blockquote>

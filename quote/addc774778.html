<main class="wrap"><figure class="quote" id="q-addc774778" data-kw="">
<blockquote><p>[T]he Lord Jesus Christ shall be exalted to be their King, and then shall the People joy before him, like the joy in harvest, so likewise in the 9 of Zachary ver. 9, rejoice greatly O Daughters of Zion, should for joy O Daughter of Jerusalem; what is the matter Behold thy King cometh to thee, and if you mark it, when Christ first came to them in that place, he came poor and meek, riding upon an ass, yea, to be hang’d upon the Cross to be crucified; but yet afterward it follows, that his Dominion should be from Sea to Sea, and from the River to the end of the Earth; This entertaining of Christ their King, should make them rejoice greatly, and should for you.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/stephen-marshall.html">Stephen Marshall</a></span><span class="wk"><span class="lbl">Work:</span> <cite>A Sacred Panegyrick, or A Sermon of Thanksgiving, Preached to the two Houses of Parliament</cite>, (London: Stephen Bowtell, 1644), p. 11.</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/civil-government-and-society.html">Civil Government and Society</a></span></div>

</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-5e345233f7" data-kw="">
<blockquote><p>1. There be some preparations which go before faith: Faith is a seed of heaven… so does the Lord set up a new world of faith in a soul void of faith by degrees: There’s a time when there’s neither perfect night, nor perfect day: but the twilight of the morning… There’s a half summer, and a half spring in the close of the spring which God made. The embryo, or birth not yet animated, is neither seed only, nor a man-child only… … 3. Its true, the new creation and life of God is virtually seminaliter [seminally] in these preparations, as the seed is a tree in hope, the blossom an apple, the foundation a palace in its beginning; so half a desire in the non-converted is love sickness for Christ in the seed, legal humiliation is in hope evangelic repentance and mortification: But as the seed and the growing tree differ not gradually only, but in nature and specifically, as a thing without life is not of that same nature and essence with a creature that has a vegetative life and growth, so the preparatory good affections of desire, hunger sorrow, humiliation going before conversion, differ specifically from those renewed affections which follow after…</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/samuel-rutherford.html">Samuel Rutherford</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Trial &amp; Triumph of Faith</cite>, … (London, 1652), Sermon 21, ‘Then Jesus Answered &amp; Said unto Her, ‘O Woman, great is thy Faith, etc.”, pp. 312-14</span></figcaption>

booksonline.com/on-when-the-soul-is-joined-to-the-body-in-the-womb/#:~:text=1.%20There%20be%20some%20preparations%20which,those%20renewed%20affections%20which%20follow%20after&amp;text=1.%20There%20be%20some%20preparations%20which%20go%20before&amp;text=specifically%20from%20those%20renewed%20affections%20which%20follow%20after" rel="noopener" target="_blank">Read it online · Reformed Books Online</a></div>
</figure><figure class="quote" id="q-efdf554992" data-kw="">
<blockquote><p>Mr. Hooker, Mr. Thomas Goodwin, and Mr. Philip Nye [congregationalists] give them [the eldership of a local church] only an authoritative directing power [to ordain new elders], such as parents have in the marriage of their daughter, which is an authority extrinsic, which the magistrate and pastor in their kind have; but the virgin has the only formal and intrinsic power to consent and so to make the marriage, and to dissent so as it shall be no marriage: In which case the Fraternity only, or Male-church formally [according to congregationalists], intrinsically judges, and may judge, though there were no officers, as the maid may marry, though parents and tutors were dead; and the directive authority of the officers may be wanting [lacking], as the directive authority of the magistrate may be wanting.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/samuel-rutherford.html">Samuel Rutherford</a></span><span class="wk"><span class="lbl">Work:</span> <cite>A Survey of the Survey of that Sum of Church-Discipline Penned by Mr. Thomas Hooker</cite>, Book 3, ch. 3, p. 308</span></figcaption>

</figure><figure class="quote" id="q-008959d7e1" data-kw="">
<blockquote><p>So the love-tokens and testimonial rings and bracelets of the Husband, my love to the saints, my keeping of his word, my holy walking in Christ, being the works of his Spirit, which dwelt in Jesus Christ, are actu primo [the first act], in themselves, as infallible signs of the Bridegroom’s love to me; as the Beloved’s word who spake and said, ‘Arise, my love’: And if the spirations and breathings of the Spirit go not along, both the voice and the love-bracelets (for Christ is no more counterfeit in his love-tokens than in his word when He speaks as a Husband) are alike ineffectual to persuade the soul.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/samuel-rutherford.html">Samuel Rutherford</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Christ Dying &amp; Drawing Sinners to Himself</cite>, (1647), pp. 98-99</span></figcaption>

<blockquote><p>However, all those things of which it cannot be said that God was not by necessity of nature bound to the other part of the contradiction (or in which we know that God can make or has actually made some change in the obligation) belong to positive right. Such were the symbolical law given to Adam and the ceremonial laws of the Old Testament (which depended on the free will of God). Here also the permission of sin is usually referred.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/francis-turretin.html">Francis Turretin</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Institutes of Elenctic Theology</cite>, vol. 2, 11th Topic, 2nd Question, ‘The Nature of the Moral Law’, section 5, p. 8</span></figcaption>

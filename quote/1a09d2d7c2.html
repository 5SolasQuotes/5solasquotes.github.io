<main class="wrap"><figure class="quote" id="q-1a09d2d7c2" data-kw="">
<blockquote><p>From Adam till now, what is the history of our race? It is a lengthened and almost unvarying bill of mortality. What is the most necessary part of a family possession? It is a burial-place where to lay our dead. What are the words which apply alike to all? It is the solemn sentence —”Dust to dust, earth to earth.” Go where you will, you will everywhere see the ravages of death. There is no island of the blest—no famed spot of earth where you will not meet with the grim and ghastly trophies of his triumph.

There is no speech nor language where you will not hear his hoarse voice calling, “Return ye children of men.” The pyramids of Egypt, while they are a monument of human labour, are also a monument of human folly and of man’s mortality. The decaying cemetery in Jehoshaphat’s vale reads to us an intelligible lesson, even though the epitaphs of the tombs are obliterated. The thickening grave-stones of every church-yard speak to the eye and to the heart, and say, “All flesh is as grass.”

There are times when the truth of man’s mortality is forced upon the mind with the most striking solemnity. The sun rises with a burning heat, and the grass withereth. The progress of the plague, or a fever’s desolation, fills the church-yard and thins the ranks of families; and every house wears mourning, because death hath entered the dwelling; and every countenance wears gloom, because of the uncertainty and fears in which every man lives.

There are other times when the grass is not withered by a sudden stroke, but is cut down by the hand of the mower. At morn it flourishes, it is allowed to stand during the day, but by evening it is doomed to fall before the sickle of the reaper. It is fading at the best. So is it with man. He may escape sudden death, or rapid disease, or premature decay—he may live during his day—but evening comes, and relentless death with his sweeping scythe lays him low.

Every man knows these things; every man is assured that he must die—that sooner or later he will be carried to his long home, and will lie down in his narrow bed. Yet on how few does this assurance exercise a practical effect! It is a general truth of which men speak, but of which they seldom think. Let me ask you, dying man, Have you ever retired into your closet, and held converse with death? Have you ever said to yourself, After a few short years are come and gone, I will go to that place whence I shall not return? Have you ever asked yourself, What shall become of me after I die? Is it true what the Bible says, “After death is the judgment?” Must this soul which animates my bosom live for ever? How awfully solemn are such thoughts!</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/j-w-taylor.html">J. W. Taylor</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Mortality of Man and the Eternity of the Word of God in The Free Church Pulpit; Consisting of Discourses by the Most Eminent divines of the Free Church of Scotland. Vol. I.</cite></span></figcaption>

</figure><figure class="quote" id="q-74f5aabfd7" data-kw="">
<blockquote><p>Back in the days of the Arian controversy in the Synod of Ulster, there were some orthodox people who argued that Trinitarians should tolerate Unitarians and Arians in their midst in the hope that this destructive heresy would just quietly die out. Dr John Paul of Loughmourne, on the other hand, argued that this was irrational nonsense:

For the Antitrinitarians and the orthodox to “agree to differ,” is quite preposterous. To say:- “We do not worship the same God – we regard each other as idolaters or blasphemers; and yet, to show our liberality, we will still continue to worship together, we will hold communion with each other.” This is monstrously absurd. What communion hath the temple of God with idols? To sit down at the same holy table of the Lord with those whom we regard as blasphemers or idolaters, is surely a great absurdity; nor is it less absurd to join with them in discipline. What! join in the acts of discipline with blasphemers or idolaters! Join, as a Presbytery, in laying hands on blasphemers or idolaters! Ordain to the work of the holy ministry blasphemers or idolaters! Could any thing be more inconsistent, absurd, or impious? Surely not.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/john-paul.html">John Paul</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Review of a speech by the Rev. Dr Montgomery of Belfast, and the doctrines of the Unitarians proved to be unfavourable to the right of private judgment, to liberality and charity, to the investigation of truth, and the practice of virtue</cite>, (Belfast, 1828) in Stewart Bates (ed.), Works of the late Rev. John Paul, D.D., of Carrickfergus. With a memoir and introduction by the editor (Belfast, 1855), p. 428.</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/civil-government-and-society/church-and-state.html">Civil Government and Society: Church and State</a></span></div>

</figure><figure class="quote" id="q-8803cdc02b" data-kw="">
<blockquote><p>The Westminster divine, Stephen Marshall, helpfully distinguishes between what a civil magistrate may and may not do in coercing his subjects to support true religion. He argues that while the magistrate cannot convert anyone with the sword, nevertheless, he can compel his subjects to attend public worship:

Nor do I find a warrant for Magistrates to compel any to profession of truth, Psal. 110. His people a willing people. To Order what men shall believe, is to exercise Dominion over men’s Consciences: It is One thing to cause the people to attend the means, and another to make them believe the truth, the first they must do, but not the second: Faith is God’s gift. It is one thing to hinder Idolatry and blasphemy spreading, another thing to make people renounce an opinion, and embrace the truth. …

They may Command and Order the people to come and attend upon the Ministry of the Word, as the means instituted by Christ for their instruction to salvation. It is one thing to order them what they shall believe, another thing to order them to wait upon the means. All grant the civil Magistrate may call public Assemblies, to hear their Proclamations, and Statutes, &amp;c. read: if they may call a whole Town to hear a Law, then much more may they call them to hear God’s Laws.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/stephen-marshall.html">Stephen Marshall</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The power of the magistrate in matters of religion, vindicated. The extent of his power determined. In a sermon preached before parliament on a monthly fast day</cite>, (London, 1657), pp 5, 7-8.</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/civil-government-and-society.html">Civil Government and Society</a></span></div>

They may Command and Order the people to come and attend upon the Ministry of the Word, as the means instituted by Christ for their instruction to salvation. It is one thing to order them what they shall believe, another thing to order them to wait upon the means. All grant the civil Magistrate may call public Assemblies, to hear their Proclamations, and Statutes, &amp;c. read: if they may call a whole Town to hear a Law, then much more may they call them to hear God’s Laws.”

— Stephen Marshall, The power of the magistrate in matters of religion, vindicated. The extent of his power determined. In a sermon preached before parliament on a monthly fast day, (London, 1657), pp 5, 7-8.">Copy</button><a class="share" href="https://x.com/intent/post?text=%E2%80%9CThe+Westminster+divine%2C+Stephen+Marshall%2C+helpfully+distinguishes+between+what+a+civil+magistrate+may+and+may+not+do+in+coercing+his+subjects+to+support+true+religion.+He+argues+that+while+the+magistrate+cannot+convert+anyone+with+the+sword%2C+nevertheless%2C+he+can+compel+his+subjects+to+attend+public+worship%3A%0A%0ANor+do+I+find+a+warrant+for+Magistrates+to+compel+any+to+profession+of+truth%2C+Psal.+110.+His+people+a+willing+people.+To+Order+what+men+shall+believe%2C+is+to+exercise+Dominion+over+men%E2%80%99s+Consciences%3A+It+is+One+thing+to+cause+the+people+to+attend+the+means%2C+and+another+to+make+them+believe+the+truth%2C+the+first+they+must+do%2C+but+not+the+second%3A+Faith+is+God%E2%80%99s+gift.+It+is+one+thing+to+hinder+Idolatry+and+blasphemy+spreading%2C+another+thing+to+make+people+renounce+an+opinion%2C+and+embrace+the+truth.+%E2%80%A6%0A%0AThey+may+Command+and+Order+the+people+to+come+and+attend+upon+the+Ministry+of+the+Word%2C+as+the+means+instituted+by+Christ+for+their+instruction+to+salvation.+It+is+one+thing+to+order+them+what+they+shall+believe%2C+another+thing+to+order+them+to+wait+upon+the+means.+All+grant+the+civil+Magistrate+may+call+public+Assemblies%2C+to+hear+their+Proclamations%2C+and+Statutes%2C+%26c.+read%3A+if+they+may+call+a+whole+Town+to+hear+a+Law%2C+then+much+more+may+they+call+them+to+hear+God%E2%80%99s+Laws.%E2%80%9D%0A%0A%E2%80%94+Stephen+Marshall%2C+The+power+of+the+magistrate+in+matters+of+religion%2C+vindicated.+The+extent+of+his+power+determined.+In+a+sermon+preached+before+parliament+on+a+monthly+fast+day%2C+%28London%2C+1657%29%2C+pp+5%2C+7-8.&amp;url=https%3A%2F%2F5solasquotes.github.io%2Fquote%2F8803cdc02b.html&amp;via=5Solas" target="_

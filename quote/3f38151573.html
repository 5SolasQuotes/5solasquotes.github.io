</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-c53281baab" data-kw="">
<blockquote><p>the Schoolmen manage it as an insuperable difficulty: Whether God could have made the world, or any thing better than it is? If you will pardon me for making that easy which they make ineffable, I answer: Goodness is primitive (that is, God) or derivative, which only is in creatures. This last is formally good, as it is related as conformed to God’s will, the Prime Good, as its rule: To be a Deo volitum [having been willed by God], is the formal notion of created good. And so the world is perfect, and can be no better, because it is as God wills it: and yet God can make particular creatures better to themselves, and to one another; He can make any man more wise, more holy, etc. But bonum sibi [good with respect to Him] is no further properly bonum, than it is volitum a Deo: Therefore God can make the world far otherwise than it is; and yet then it would be no better. For still it would be but as God willed it to be: So that the matter and private goodness might alter; but the true form of goodness would be still just the same as now.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/richard-baxter.html">Richard Baxter</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Catholic Theology Plain, Pure, Peaceable</cite>, (London: White, 1675), sect. 1, ‘Of our Knowledge of God as here Attainable’, p. 2, margin note</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/creation/the-six-days.html">The Six Days</a></span></div>

el="noopener" target="_blank">Read it online · Reformed Books Online</a></div>
</figure><figure class="quote" id="q-a68262c412" data-kw="">
<blockquote><p>7. And lastly, in what time or how many days did God create all things, in six days says the Scripture, and every day some thing says this place, till the seventh day, wherein He rested. Non uno momento, sed sex dierum spatio, ‘not in one moment, but in six days’ space.’ If you happily think or meet with Syrach’s words [in Ecclesiasticus], who says, ‘He that lives made all things together, the Lord who only is iust,’ etc., you must consider that he speaks not of the time, but of the multitude of creatures, meaning that God made them all together before He rested, and gave over creating, but not meaning that He made them all in one moment of time or in one day, for we see both this place and others against it: the Lord’s own commandment written with his own finger gives testimony that in six days the whole was made.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/gervase-babington.html">Gervase Babington</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Certain Plain, Brief &amp; Comfortable Notes upon every Chapter of Genesis</cite>, (London: 1592), ch. 1, p. 6</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/creation/the-six-days.html">The Six Days</a></span></div>

<blockquote><p>4. It is ignorance in Burges to prove God may be adored in the elements, because they are as excellent symbols of God’s presence as the ark [in the OT]: for created excellency is no ground of adoring the elements, except it be a Godhead and uncreated excellency: We condemn Pope Anastasius, who directs reverend bowing at the hearing of the Gospel and not of the Epistles, as if the Gospel were holier than the Epistles.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/samuel-rutherford.html">Samuel Rutherford</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Divine Right of Church Government</cite>, … (London, 1646) | Section 3, pp. 172, ch. 1, Question 5</span></figcaption>

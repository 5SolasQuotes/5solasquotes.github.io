<main class="wrap"><figure class="quote" id="q-13fc6efea9" data-kw="">
<blockquote><p>Thus we are not speaking of some small matter, nor are we seeking something worthy of scorn, when, insofar as the divine generosity helps us, we discuss the forgiveness of sins. By it, those whom God will assign to the kingdom of his beloved Son are snatched away from the power of darkness. By it, they are freed from eternal punishment that they may attain eternal bliss. Through it is left behind that burden, either that which a birth in sin has contracted or what the wickedness of an evil life has added. Through it Christ refreshes those who labour and are heavy burdened, who come to him, and on them he imposes the mild yoke and the light burden of his love.

Through it the sinner is freely justified that his faith may be accounted justice. Through it he leaves behind the evil life in which he was ensnared and freely receives a good one, of which he was unworthy. Through it come about that, from now on, enlightened by the gift of prevenient mercy, he may walk in the path of goodness, and, led along on it, may persevere with further gifts of mercy; so that, by an undeserved grace, the gift of good living will start in a person, and the forgiveness of sins having been given, this will be brought to perfection when the power of perseverance has been granted.

By the forgiveness of sins, people are freely separated from those who will be tortured for eternity with the Devil, and they will be added to those who will reign with Christ without end. Finally, such is the forgiveness of sins that, for it, the Only-Begotten of God became a human being; for it, even his blood was poured out.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/fulegentius-of-ruspe.html">Fulegentius of Ruspe</a></span><span class="wk"><span class="lbl">Work:</span> <cite>On the Forgiveness of Sins</cite>, (c. 517-23) in Selected Works, trans. Robert B. Enos, The Fathers of the Church: A New Translation, vol. 95 (Washington D.C.: The Catholic University of America Press, 1997), IV.1-2, pp 113-14.</span></figcaption>

<blockquote><p>There is a twofold charge commenced against us, [1] as sinners, and breakers of the Law; [2] as hypocrites and unsound believers. To the first we have nothing but the merits of Christ to plead; to the second, a fruitful obedience; or else, Paul in the opposition between works and faith, means by works, legal observances; by faith true Christianity [inclusive of it working; see Manton’s larger context]. The Jews boasted of their legal observances, to the rejection of the faith of Christ; and James by faith, [meant] a dead faith; and by works, [he meant] Christian duties, or acts of obedience to God; not external observances of the law of man.</p></blockquote>

<blockquote><p>We think, therefore, that congruous merit is founded rather in some dignity of the work than in a promise. For the promises by which God promises pardon to penitents are not such as those by which he promises a crown of glory to those who work well. For the latter contain a true pact, which God makes with man as with a laborer about wages to be paid; but the former do not properly contain a pact about wages to be paid, but an assertion of a thing certainly to come, so that a man may be made secure of obtaining pardon if he repents.</p></blockquote>

<blockquote><p>[God] himself took on him the burden of our iniquities, he gave his own Son as a ransom for us, the Holy One for transgressors, the blameless one for the wicked, the righteous one for the unrighteous, the incorruptible one for the corruptible, the immortal one for them that are mortal. For what other thing was capable of covering our sins than his righteousness? By what other one was it possible that we, the wicked and ungodly, could be justified, than by the only Son of God? O sweet exchange! O unsearchable operation! O benefits surpassing all expectation! — that the wickedness of many should be hid in a single Righteous One, and that the righteousness of one should justify many transgressors!’</p></blockquote>

<blockquote><p>I. Faith taken theologically in general is the assent which we give to God speaking, when we are certainly persuaded that something is true, moved to that by Divine Authority. And by this faith is distinguished from opinion, which is a timid and uncertain assent. Likewise from knowledge, which is indeed a certain assent; but one which rests on demonstration or some evident argument, not truly on anyone’s testimony. Finally, from human faith, which acquiesces in the authority of men.

II. Therefore not every assent, even applied to those things which are contained in the Word of God, should be considered faith. For if someone certainly and firmly holds some dogma of religion, such as the creation of all things out of nothing: yet not impelled to that by divine revelation, but by some reason which seems necessary to him, to that extent he does not have faith… … XXIX. Certainly those who place faith also in the will are moved to that because they confuse trust with faith, and think trust is the principal act of faith and as it were its form. But in that they are deceived, or do not speak accurately enough. For trust is an effect of faith, not truly an act and form of faith. And if we want to speak properly, trust pertains to hope, not to faith. For it is nothing other than hope strengthened and confirmed. And certainly the apostle manifestly distinguishes trust from faith in Eph. 3:12, “In Christ,” he says, “we have boldness and access with confidence through faith in him.” Where faith is placed as the cause of trust or confidence, since we are said to have trust or confidence through faith: which would be said absurdly if trust and faith were the same thing. For this being posited, the sense of the passage would be, “Through trust we have trust”; which is nugatory.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/louis-le-blanc.html">Louis Le Blanc</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Theological Theses Published at Various Times</cite>, vol. 2 3rd ed. tr. AI by Colloquia Scholastica (1645; London: Moses Pitt, 1683) Le Blanc (1614-1675) was a reformed professor of theology at Sedan, France. | ‘On Faith’, pp. 125, 131</span></figcaption>

<div class="actions"><button class="copy" data-copy="“I. Faith taken theologically in general is the assent which we give to God speaking, when we are certainly persuaded that something is true, moved to that by Divine Authority. And by this faith is distinguished from opinion, which is a timid and uncertain assent. Likewise from knowledge, which is indeed a certain assent; but one which rests on demonstration or some evident argument, not truly on anyone’s testimony. Finally, from human faith, which acquiesces in the authority of men.

II. Therefore not every assent, even applied to those things which are contained in the Word of God, should be considered faith. For if someone certainly and firmly holds some dogma of religion, such as the creation of all things out of nothing: yet not impelled to that by divine revelation, but by some reason which seems necessary to him, to that extent he does not have faith… … XXIX. Certainly those who place faith also in the will are moved to that because they confuse trust with faith, and think trust is the principal act of faith and as it were its form. But in that they are deceived, or do not speak accurately enough. For trust is an effect of faith, not truly an act and form of faith. And if we want to speak properly, trust pertains to hope, not to faith. For it is nothing other than hope strengthened and confirmed. And certainly the apostle manifestly distinguishes trust from faith in Eph. 3:12, “In Christ,” he says, “we have boldness and access with confidence through faith in him.” Where faith is placed as the cause of trust or confidence, since we are said to have trust or confidence through faith: which would be said absurdly if trust and faith were the same thing. For this being posited, the sense of the passage would be, “Through trust we have trust”; which is nugatory.”

— Louis Le Blanc, Theological Theses Published at Various Times, vol. 2 3rd ed. tr. AI by Colloquia Scholastica (1645; London: Moses Pitt, 1683) Le Blanc (1614-1675) was a reformed professor of theology at Sedan, France. | ‘On Faith’, pp. 125, 131">Copy</button><a class="share" href="https://x.com/intent/post?text=%E2%80%9CI.+Faith+taken+theologically+in+general+is+the+assent+which+we+give+to+God+speaking%2C+when+we+are+certainly+persuaded+that+something+is+true%2C+moved+to+that+by+Divine+Authority.+And+by+this+faith+is+distinguished+from+opinion%2C+which+is+a+timid+and+uncertain+assent.+Likewise+from+knowledge%2C+which+is+indeed+a+certain+assent%3B+but+one+which+rests+on+demonstration+or+some+evident+argument%2C+not+truly+on+anyone%E2%80%99s+testimony.+Finally%2C+from+human+faith%2C+which+acquiesces+in+the+authority+of+men.%0A%0AII.+Therefore+not+every+assent%2C+even+applied+to+those+things+which+are+contained+in+the+Word+of+God%2C+should+be+considered+faith.+For+if+someone+certainly+and+firmly+holds+some+dogma+of+religion%2C+such+as+the+creation+of+all+things+out+of+nothing%3A+yet+not+impelled+to+that+by+divine+revelation%2C+but+by+some+reason+which+seems+necessary+to+him%2C+to+that+extent+he+does+not+have+faith%E2%80%A6+%E2%80%A6+XXIX.+Certainly+those+who+place+faith+also+in+the+will+are+moved+to+that+because+they+confuse+trust+with+faith%2C+and+think+trust+is+the+principal+act+of+faith+and+as+it+were+its+form.+But+in+that+they+are+deceived%2C+or+do+not+speak+accurately+enough.+For+trust+is+an+effect+of+faith%2C+not+truly+an+act+and+form+of+faith.+And+if+we+want+to+speak+properly%2C+trust+pertains+to+hope%2C+not+to+faith.+For+it+is+nothing+other+than+hope+strengthened+and+confirmed.+And+certainly+the+apostle+manifestly+distinguishes+trust+from+faith+in+Eph.+3%3A12%2C+%E2%80%9CIn+Christ%2C%E2%80%9D+he+says%2C+%E2%80%9Cwe+have+boldness+and+access+with+confidence+through+faith+in+him.%E2%80%9D+Where+faith+is+placed+as+the+cause+of+trust+or+confidence%2C+since+we+are+said+to+have+trust+or+confidence+through+faith%3A+which+would+be+said+absurdly+if+trust+and+faith+were+the+same+thing.+For+this+being+posited%2C+the+sense+of+the+passage+would+be%2C+%E2%80%9CThrough+trust+we+have+trust%E2%80%9D%3B+which+is+nugatory.%E2%80%9D%0A%0A%E2%80%94+Louis+Le+Blanc%2C+Theological+Theses+Published+at+Various+Times%2C+vol.+2+3rd+ed.+tr.+AI+by+Colloquia+Scholastica+%281645%3B+London%3A+Moses+Pitt%2C+1683%29+Le+Blanc+%281614-1675%29+was+a+reformed+professor+of+theology+at+Sedan%2C+France.+%7C+%E2%80%98On+Faith%E2%80%99%2C+pp.+125%2C+131&amp;url=https%3A%2F%2F5solasquotes.github.io%2Fquote%2F39c2e2c7c7.html&amp;via=5Solas" target="_blank" rel="noopener">Share on X</a><a class="perma" href="../quote/39c2e2c7c7.html">Permalink</a><a class="src" href="https://reformedbooksonline.com/topics/faith#:~:text=I.%20Faith%20taken%20theologically%20in%20general,we%20have%20trust%E2%80%9D%3B%20which%20is%20nugatory&amp;text=I.%20Faith%20taken%20theologically%20in%20general%20is%20the&amp;text=Through%20trust%20we%20have%20trust%E2%80%9D%3B%20which%20is%20nugatory" rel="noopener" target="_blank">Read it online · Reformed Books Online</a></div>

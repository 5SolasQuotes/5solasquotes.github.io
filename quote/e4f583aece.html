<main class="wrap"><figure class="quote" id="q-e4f583aece" data-kw="">
<blockquote><p>Now then, so many ways and no more as a thing may be known to come from God with an intention to oblige all perpetually, a thing may be said to be of an unalterable divine right; and those can be no more than these two: either by the Law of Nature, or by some positive Law of God. Nothing else can bind universally and perpetually but one of these two, or by virtue of them, as shall be made appear. I begin with the Law of Nature. The Law of Nature binds indispensably, as it depends not upon any arbitrary constitutions, but is founded upon the intrinsical nature of good and evil in the things themselves, antecedently to any positive declaration of God’s will. So that till the nature of good and evil be changed, that Law is unalterable as to its obligation. When I say the Law of Nature is indispensable, my meaning is, that in those things which immediately flow from that Law by way of precept, as the three first Commands of the Moral Law, no man can by any positive law be exempted from his obligation to do them, neither by any abrogation of the laws themselves, nor by derogation from them, nor interpretation of them, nor change in the object, matter, or circumstance whatsoever it be. Now although the formal reason of man’s obedience to the precepts of this Law be the conformity which the things commanded have to the divine nature and goodness, yet I conceive the efficient cause of man’s obligation to these things is to be fetched from the will, command and pleasure of God: Not as it is taken for an arbitrary positive will, but as it is executive of divine purposes, and as it engraves such a Law upon the hearts of men. For notwithstanding man’s reason, considered in itself, be the chiefest instrument of discovery what are these necessary duties of human nature (in which sense Aristotle defines a natural law to be that which [Greek] has everywhere the same force and strength (Ethics, bk. 5, ch. 10), i.e. as Andronicus Rhodius very well interprets it, [Greek], among all that have the free use of their reason and faculties), yet I say it is not bare reason which binds men to the doing of those things commanded in that Law, but as it is expressive of an eternal Law, and deduces its obligation from thence. And so this Law, if we respect the rise, extent and immutability of it, may be called deservedly the Law of Nature (V. Selden, De jure Nat. apud▪ Ebrae, bk. 1, ch. 7-8); but if we look at the emanation, efflux and original of it, it is a divine Law, and so it is called by Molina, Alphonsus à Castr••, and others (Mol., De Just et Jur., p. 1, Disputation 3; Alphons., De leg. pur▪, bk. 2, ch. 14). For the sanction of this Law of Nature, as well as others, depends upon the will of God, and therefore the obligation must come from Him, it being in the power of no other to punish for the breach of a law, but those who had the legislative power to cause the obligation to it. It appears then from hence that whatever by just consequence can be deduced from the preceptive Law of Nature, is of divine right, because from the very nature of that Law (it being indispensable), it appears that God had an intent to oblige all persons in the world by it.</p></blockquote>

<blockquote><p>Rutherford’s position is that God by creating rational creatures… at once creates the common principles of the natural law. Since they are part of the very constitution of the rational creature these are unable to be effaced… However, taking up Menchaca’s own Ockhamist position, Rutherford agrees that it would have been quite possible for God to have created another species of rational creature distinct from man to whom he gave a diverse natural law… Rutherford’s position is that the love of God and the subjection of the creature to the Creator is an essential part of any kind of natural law. Rutherford therefore concurs with the prominent Dutch Reformed theologian Gisbertus Voetius that the dependency of the rational creature on its Creator in morality and in order to right reason is so necessary that its opposite implies a contradiction… this law… is immutable and antecedent to every act of the divine will [stemming from the divine nature], forming the cornerstone of the natural law. What is left open to the divine decree is simply to select whether a particular act or its omission should be considered as due subjection and obedience to God, or not. Thus while the divine will establishes the moral status of a complex act, it always does so against the backdrop of God’s own nature.</p></blockquote>

<blockquote><p>XIII. The glory of God, the good of souls, the happiness of Christian societies, are irresistible motives to quicken the magistrate to act (against such dangerous persons as we have described according to the law of judgement, and their different demerits) in Faith and Love:

      1. In Faith; for the Christian magistrate does not act like himself, if he does not perform acts of civil-justice in faith. And it is clear that if there be no moral equity in any of the judicial laws in the Old Testament (and there are none at all extant in the New) [then] the Christian magistrate cannot perform any act of Civil-justice in faith. But it is indeed too evident to be denied that all divine laws which concern the punishment of moral transgressions are of perpetual obligation, and therefore still remain in force according to their substance and general equity, abstracted from special circumstances, typical accessories and the old forms of Mosaical polity, for:

      1. These divine laws are not expired in their own nature.

      2. They are not repealed by God.

      3. The authority of the Lawgiver is the same under both administrations, old and new; the consciences of Christians as well as Jews are subject to his sovereign and perpetual jurisdiction.

      4. The matter of the laws is moral, and very agreeable to the dictates of nature, as does appear by the several laws and decrees of heathens: Dan. 3:29; Ezra. 7:23,25-27; Ezra 10:3,5,8 compared with Num. 15:30-31; Lev. 24:15-16; Deut. 13:8-9; Zech. 13:3,6. Seducing, poisoning, slaying of souls is by the law of Nature and Nations the worst of injuries.

      5. The reason of these divine laws is immutable, and that reason is sometimes expressed and declared: But it is not necessary that there should be any express ratification of every moral law in the New Testament which is plainly delivered in the Old.

      6. These divine laws are independent on the will of man, and therefore indispensable man’s authority.</p></blockquote>

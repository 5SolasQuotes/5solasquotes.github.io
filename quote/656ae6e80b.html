</figure><figure class="quote" id="q-c2399ff34c" data-kw="">
<blockquote><p>Only a fraction of the present body of professing Christians are solidly appropriating the justifying work of Christ in their lives… In their day-to-day existence they rely on their sanctification for justification… Few know enough to start each day with a thoroughgoing stand upon Luther’s platform: you are accepted, looking outward in faith and claiming the wholly alien righteousness of Christ as the only ground for acceptance, relaxing in that quality of trust which will produce increasing sanctification as faith is active in love and gratitude.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/richard-lovelace.html">Richard Lovelace</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Dynamics of Spiritual Life</cite>, p. 101-102</span></figcaption>

</figure><figure class="quote" id="q-1762391914" data-kw="">
<blockquote><p>It is our Duty. In his Example we have a taste of his Spirit; I am not of the World, saith Christ; and we should imitate Christ as dear Children, Ephes. 5.1. They that love to live in delight and pleasures, are but Christians in Name. If we had no other Reason to contemn the vanity of the World, than the Life of Christ, this were enough. Who was wisest, Christ, or you? Who can make the better choice, Christ or you? Who is in an Error, Christ or you? Christ chose a poor Life, and you affect Greatness.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/thomas-manton.html">Thomas Manton</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Sermons upon the Seventeenth Chapter of St. John</cite>, Sermon 25, in A Second Volume of Sermons (London, 1684), p. 225</span></figcaption>

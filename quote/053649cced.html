<main class="wrap"><figure class="quote" id="q-053649cced" data-kw="">
<blockquote><p>It is dangerous for any man to be ambitious; but, in him that teaches the Gospel in the name of the Lord, whose calling should be, to seek the Lord &amp; his glory, ambition is most dangerous: if this man be ambitious, if the thing he seeks by his preaching, be his honour and estimation, if his heart be inclined that way, in the end, if occasion serve, he will prove an evil man; he will be a papist, an heretic, and so forth. It is a most sure thing, he that is given to ambition will apply all his actions to obtain honour, because he serves that sin as a slave.

I confess, there are none free of vice, we are all born in sin, (except the Lord Jesus) and naturally we are inclined to all vice, to avarice to ambition, we would all be Kings, and rulers &amp;c. no, none of us is free thereof: but, blessed is that soul that getteth a piece of mortification, that his sins reign not over him, as lords; for, if sin reign over thee, thou shalt be compelled to serve thy appetite. We are all foul, as well ministers as people, but, the Lord keep us from ambition reigning in us and tyrannizing over us.

For, then, there is no vice nor mischief in this world that can be devised, but we shall be compelled to commit it, and all, to serve that foul sin; and a Minister in his calling of all men ought to have the greatest care to flee this ambition. Alas, the reigning of these sins what they have wrought in this age, experience has told: this black darkness and this corruption that is in the kingdom of Antichrist has risen on flattery, avarice &amp; ambition: among all the Princes on earth, who overcomes this Antichrist in avarice? who overcomes him in ambition? who goes before him in flattery? Miserable experience shows well enough, that these vices has brought in all heresies, and darkness, and these are the roots to all other vices.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/robert-rollock.html">Robert Rollock</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Lectures upon the first and second Epistles of Paul to the Thessalonians</cite>, (Edinburgh: Robert Charteris, 1606), pp 59-60.</span></figcaption>

</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-a37aba1432" data-kw="">
<blockquote><p>Now, the ceremonies are the bane of our churches’ peace and the unhappy instruments of lamentable discord among bretheren who should dwell together in unity. I know that the refusers of the ceremonies are blamed as if they were the troublers of the peace of the Church and the tumultuating contentious spirits who make so much ado about matters of rite and ceremony. But I know also that none have been more ordinarily and commonly blamed for troubling the peace of the Church than they who least deserved to be blamed for it. So was Elijah himself thought to be he that troubled Israel when he contended against the corruptions of the Church in his time.</p></blockquote>

</figure><figure class="quote" id="q-ac4705b8fe" data-kw="">
<blockquote><p>For the erecting of a Church within a presbyterian Church, I must say that it is a novation with a witness. Our friends express much zeal for the obligation of our covenants (which I acknowledge is inviolable) and therefore I would recommend to their serious views that article of our National Covenant, whereby we abjure all novations contrary to our received standards. Sure I am, our old covenanters were not of their mind. I know no precedent for their way amongst us save this one, of which I think they will not be very fond, namely, that of the Public Resolutioners, who were the first that ever pretended to set up distinct judicatories in this Church: The Protesters sat with them in judicatories without any hesitation, and pressed to continue, and to act a faithful part as it might please the Lord to guide them, they were the separatists.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/john-currie.html">John Currie</a></span><span class="wk"><span class="lbl">Work:</span> <cite>An Essay on Separation</cite></span></figcaption>

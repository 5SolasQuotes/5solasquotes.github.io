<main class="wrap"><figure class="quote" id="q-70eb7e2b84" data-kw="">
<blockquote><p>Having considered the reasons for which the word of God has been committed to writing, we must now ascertain where that record is to be found. Shall we seek it among the heathens? No book of theirs is met with which can be accounted divine. All is uncertain, fabulous, full of superstition and idolatry. Shall we look for it among the Mahomedans? They have the Koran, we confess; but that book is hardly worthy of a man in his sense; and whatever good is in it, has entirely been derived from the Jews and Christians. Truly no where else must the word of God be sought for but in the books of the Old and New Testament …</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/benedict-pictet.html">Benedict Pictet</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Christian Theology</cite>, trans. Frederick Reyroux (1696; London, 1834), 1.5, p. 13.</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/worship.html">Worship</a></span></div>

<blockquote><p>§. 9. Of the faults of servants contrary to reverence in carriage. … 2. Others, if at first coming to their master they give some salutation, yet, through too much familiarity with them, all the day after they will carry themselves fellow-like, scarce uncovering their heads in their master’s presence, not enduring to stand long before him, but either setting themselves down, or slinking away when they should be in presence… This unmannerly familiarity is commonly in such servants, as have poor and mean [low] masters: for rich and great men’s servants can be so full of curtesy, as not a word shall be spoken by their masters to them, or by them to their masters, but the knee shall be bowed withal: they can stand hour after hour before their masters, and not once put on their hat: if they be walking after their masters, their master shall not turn sooner than their hat will be off, and that so oft as he turns or speaks to them.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/william-gouge.html">William Gouge</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Other citations (work not named)</cite>, Of Domestical Duties… (London: 1622) | 7th Treatise, “Duties of Servants” | section 9, p. 602</span></figcaption>

<blockquote><p>Who would not wish that these elegancies might universally hold, and that as sure as Moses knew that God was extraordinarily present in the burning bush… and the apostles that the Spirit was come down when they saw the fiery cloven tongues…</p></blockquote>

</figure><figure class="quote" id="q-cfca42e4d8" data-kw="">
<blockquote><p>But by reason of the short warning that they had, a multitude of the people of Ephraim, and Manasseh, Issachar and Zabulun had not cleansed themselves according to the Law in that behalf provided, Ex. 12; Num. 9, and therefore were in danger to be cut off, Lev. 7:20. In this regard they were in great distress, and in a sore strait, yet they thought it better to receive the sacrament, though they failed in some circumstances of their preparation, than to omit it until the next year, having wanted it so long before, whereupon they adventured to eat the Passover; …Hezekiah, in fear of God’s displeasure and in commiseration of the people that stood in danger of God’s plagues and punishments, falls to prayer for them and is instant with the Lord in that behalf: He saw their great desire to be made partakers of it; the pains that they had taken to come unto Jerusalem for that very purpose; and perceived a strange hand of God inclining their hearts so far… And thus he prayed unto God for them… The word that is translated ‘be merciful’ signifies thus much in effect, as if he had said, ‘The good Lord pardon and supply that which is wanting [lacking] in him that prepares his whole heart.’ And now they wanted not so much willingness, as time to prepare themselves…</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/john-dod.html">John Dod</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Ten Sermons, Tending Chiefly to the Fitting of Men for the Worthy Receiving of the Lord’s Supper</cite>, (1634), The Fourth Sermon of the Lord’s Supper, on 2 Chron. 30:18-20, p. 111</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/worship/impurities-in-worship.html">Impurities in Worship</a></span></div>

<main class="wrap"><figure class="quote" id="q-9170246cd4" data-kw="">
<blockquote><p>...it is a dreadful sin to depart from the church for the purpose of establishing one which is better, for the church is one, being the body of Christ. To separate ourselves from the church is to separate from the people of Christ and thus from His body, thereby withdrawing from the confession of Christ and departing from the fellowship of the saints. If we indeed deem the church to be what she really is, we shall then cause schism in the body of Christ, grieve the godly, offend others, give cause for the blaspheming of God‟s Name, and cause the common church member to err. By maintaining that the church is no church, we thereby deny the church of Christ, and therefore are also guilty of the sins just mentioned. We thereby displease God, who will not leave this unavenged, regardless of how much we please and flatter ourselves. Such activity the apostle opposes when he refers to such individuals as being carnal in 1 Cor 3:1, 3. He warns against this when he writes, “Now I beseech you, brethren, by the name of our Lord Jesus Christ, that ye all speak the same thing, and that there be no divisions among you” (1 Cor 1:10); “I hear that there be divisions among you” (1 Cor 11:18).</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/wilhelmus-a-brakel.html">Wilhelmus à Brakel</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Christian’s Reasonable Service</cite>, pp. 61-62</span></figcaption>

</figure><figure class="quote" id="q-7c69e010b9" data-kw="">
<blockquote><p>If it be asked then, With what kind of defects or discontents may a union be made up? or, what rules may be walked by therein? For answer, we offer these considerations or rules:

1. Whatever doesn’t warrant an initial separation doesn’t warrant a continued separation…

2. Whatever defects do not make union with a church and her ordinances sinful do not warrant separation…

3. Union with a church is lawful for those (i) whose callings lead them to a particular church and (ii) they can fulfill the duty of their callings without impediment, even if others fail to fulfill their duty…

4. Union must be maintained even if principles generally acknowledged in a church are not applied in practice…

5. Union must be maintained when the inconveniences following from separation are more harmful to the church than the inconveniences following union, provided that nothing makes union with a church and her ordinances sinful…

6. Union must be maintained when union with a church and her ordinances doesn’t require (i) personal sin or (ii) complicity in others’ sin.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/james-durham.html">James Durham</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Dying Man’s Testament to the Church of Scotland</cite>, … (Edinburgh, 1659) | pt. 4, ch. 7, ‘General Grounds leading to Unity’, pp. 320-24</span></figcaption>

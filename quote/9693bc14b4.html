<blockquote><p>Ninth Obj. He has brought himself to want by his own fault.

Ans. It must be considered what you mean by “his fault.”

1. If you mean a want of a natural faculty to manage affairs to advantage, that is to be considered as his calamity. Such a faculty is a gift that God bestows on some and not on others, and ’tis not owing to themselves. You ought to be thankful that God has given you such a gift that he has denied to him. And it will be a very suitable way for you to show your thankfulness to help them to whom that gift is denied and let them share of the benefit of it, which [is] as reasonable as that he to whom providence had imparted sight should be willing to help him to whom sight is denied, and that he should have the benefit of his sight, who has none of his own, or as he that God has given wisdom should be willing that the ignorant should have the benefit of his knowledge, or that he that has sound feet should be willing to lead the lame.

2. If they have been reduced to want by some oversight and are to be blamed that they did not consider themselves better, yet that don’t free us from all obligation of charity to ’em. If we should forever refuse to help a man because of that, that would be for us to make his inconsiderateness and imprudent act an unpardonable crime, quite contrary to the rules of the gospel, which insist so much upon forgiveness. We should not be disposed so highly to resent such an oversight in any that we have a dear affection for, as our children or near friends, so as to refuse to help ’em in that necessity and distress which they have brought upon themselves by their own inconsiderateness; but we ought to have a dear affection and concern for the welfare of all our fellow Christians, whom we should love as brethren, as Christ has loved us.

3. If they are come to want by a vicious idleness or prodigality, yet we ben’t thereby excused from all obligation to relieve ’em unless they continue in it. If they don’t continue in it, the rules of the gospel direct us to forgive ’em; and if their fault be forgiven ’em, then it won’t remain to be any bar in the way of our charitably relieving of ’em. If we do otherwise, we shall act very contrary to that rule of loving {one another} as Christ hath {loved us}: as we observed, not in degree, but [in the] manner of our expressing {love}. Now, Christ has loved us, pitied us, and greatly laid out himself to relieve us from that want and misery that we brought on ourselves by our own folly and wickedness. We foolishly and perversely threw away those riches that we were provided with, upon which we might have lived and been happy to all eternity.

4. If they continue in the same courses still, yet that don’t excuse us from charity to their families that are innocent. If we can’t relieve those of their families without them having something of it, yet that ought not to be a bar in the way of our charity; and that, because ’tis supposed that those of their families are proper objects of charity. And those that are so, we are bound to relieve; the command is positive and absolute. If we look upon that which the heads of the families have of it as entirely lost, yet we had better lose something of our estates than suffer those who are really proper objects of charity to remain without relief.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/jonathan-edwards.html">Jonathan Edwards</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Letter to the Poor, Explained and Enforced (1733) in Mark Valeri (ed.), Sermons and Discourses, 1730-1733: The Works of Jonathan Edwards Volume 17 (New Haven CN: Yale University Press, 2000), pp 401-02.</cite></span></figcaption>

<blockquote><p>VIII. Third, as to moral necessity arising from habits. For as the will can be called “free” if it is devoid of habit, so it can rightly be called “slavish” if by habit it has been determined to a certain manner of acting. Still this servitude by no means overthrows the true and essential nature of liberty. Otherwise it would follow that habits destroy the will (which they rather perfect and facilitate to operation). Hence moral habits are twofold: good and evil. A twofold servitude also is thence born: the one of righteousness in good; the other of sin in evil and misery. This belongs to man in a state of sin, of which John says, “Whosoever committeth sin is the servant of sin” (8:34); and “Ye were the servants of sin” (Rom. 6:17)…

IX. Hence it is evident that the adversaries falsely charge our men with saying the will is a slave in the state of sin, as if its liberty were destroyed by that very thing. Scripture beforehand so calls it and indeed with a twofold limitation: (1) that “servant” should be understood not absolutely and physically, but relatively, after the fall in a state of sin; (2) not simply about every natural, civil, or externally moral object, but especially about a spiritual object good per se (in which manner inability to good is more strongly asserted, but the essence of liberty is not destroyed). Although the sinner is so enslaved by evil that he cannot but sin, still he does not cease to sin most freely and with the highest liberty.</p></blockquote>

<blockquote><p>A will that was not of its nature directed toward what the intellect takes to be good would be like an acorn that was not of its nature directed toward becoming an oak. The latter just wouldn’t really be an acorn, and the former just wouldn’t really be a will.¹ ¹ For further discussion and defense of the thesis that the will always aims at what the intellect takes to be good, see Edward Feser, ‘Being, the Good, and the Guise of the Good,’ in Daniel D. Novotny and Lukas Novak, eds., Neo-Aristotelian Perspectives in Metaphysics (London: Routledge, 2012). …A tree that did not aim at getting its branches toward the sun would not be a freer tree, but just a defective tree. And a will that did not aim at the good would not be a freer will, but just a defective will.</p></blockquote>

<blockquote><p>Answer. It is granted, that no sinner will truly and sincerely repent and believe in Christ, without the powerful and effectual Influences of converting grace; and therefore they are called ‘blind’ and ‘dead’ in sin, because God knows the final event will be the same as if they were under a natural impossibility, or utter natural impotence. And for this reason the conversion of a sinner is called, ‘a new creation’; ‘being born again’; ‘giving sight to the blind’; or, a ‘resurrection from the dead’: And the necessity of divine power to effect this change, is held forth in many places of scripture. Yet we must say still, that sinners are not under such a real natural impossibility of repenting and believing, as though they were naturally blind or dead. ‘Tis true, the blind and the dead have lost their natural powers of seeing and moving; but when Scripture represents the inability of sinners to repent, or believe in Christ, by such figures and metaphors as death or blindness, it must be remembered these are but metaphors and figures, such as the holy writers and all the Eastern nations frequently use; and they must not be understood in their literal sense, as if men had lost their natural powers or faculties of understanding, will, and affections, which are the only natural powers necessary to believe and repent. Now ’tis plain that these natural faculties, powers, or capacities, are not lost by the Fall; for if they were, there would be no manner of need or use of any moral means or motives, such as commands, threatenings, promises, exhortations; these would all be impertinent and absurd, for they could have no more influence on sinners, than if we command or exhort a blind person to see, or a dead body to rise or move; which commands and exhortations would appear ridiculous and useless. And since the blessed God, in his Word, uses these moral means and motives to call sinners to repentance and faith, it is certain that they have natural powers and faculties sufficient to understand and practice these duties; and therefore they are not under a necessity of sinning, and of being destroyed, since there is nothing more wanted [lacking] in a way of sufficient natural powers, faculties, or abilities, than what they have. All the other impotence and inability therefore in sinners to repent and believe, properly speaking, is but moral, or seated chiefly in their wills. ‘Tis a great disinclination or aversion in these natural faculties, to attend to, learn, or practice the things of God and religion*; and this holds them fast in their sinful state in a similar way, as if they were blind and dead, and I said the final event will be the same, i.e. they will never repent without almighty grace. * I grant this inability to repent has been sometimes called by our divines a natural impotence, because it arises from the original corruption of our nature since the Fall of Adam; and in this sense I fully believe it. But this spring of it is much better signified and expressed by the name of native impotence, to show that it comes from our birth; and the quality of this impotence is best called moral, being seated chiefly in the will and affections, and not in any want of natural powers or faculties to perform what God requires: And the reason is plain, (viz.) That no new natural powers are given by converting grace, but only a change of the moral bent or inclination of the soul, a happier turn given to our natural faculties by the sovereign grace of God and his Spirit. And upon this account that strong and settled inclination to sin, and aversion to God, which is in the will or affections, is represented in our own language, as well as in the Eastern countries, by impotence or inability to forsake or subdue sin: As when a drunkard shall say, I had such a strong desire to the liquor, that I could not but drink to excess, I could not withhold the cup from my mouth: Or when a murderer shall say, I hated my neighbor so much, that having a fair opportunity, I could not help killing him: Or when we say to a man of fury in his passion, You are so warm at present, that you cannot see things in a true light, you cannot hearken to reason, you cannot judge aright, you are not capable of acting regularly. And that this is the manner of speaking in the Eastern countries, is evident from the Bible, Gen. 37:4. Joseph’s brethren hated him, and could not speak peaceably to him: Yet you will grant all this is but moral impotence, i.e. a very strong inclination to excess of drink, or murder, or passion, or a strong aversion to the contrary virtues. Even in the things of common life the ‘cannot’ sometimes signifies nothing but the ‘will not’, Luke 11:7. ‘Trouble me not, my door is shut, my children are with me in bed, I cannot rise to give thee’; i.e. I will not. And with regard to faith or believing in Christ, our Savior explains his own Language in this manner. In one place He says, ‘No man can come unto Me except my Father draw him,’ John 6:44. And in another place He charges the Jews with this as their fault: ‘Ye will not come unto Me, that ye may have life,’ John 5:40. So in the parable one excuse is, Luke 14:20, ‘I have married a wife, and I cannot come.’ All these citations intend the same thing: their cannot is their will not, i.e. ’tis the strength of their aversion to Christ, which is a moral impotence or inability to believe in Him, and the fault lies in the will. St. Paul speaks to the same purpose, Rom. 8:7, where he shows, that ’tis the aversion or enmity of the carnal mind to God, which hinders it from obeying the Law of God, and at last he says, ‘it cannot be subject to it.’ The carnal mind is enmity against God, for it is not subject to the Law of God, neither indeed can be: ‘So then they who are in the flesh cannot please God.’ The fault still lies in the will of sinful man; and ’tis this makes it criminal, while it is not naturally impossible to be avoided or overcome. And upon this account God is pleased to use moral means and motives, (viz.) promises, threatenings, commands, etc. toward all men, such as are suited to awaken their hearts, and excite and persuade their will to use all their natural abilities, to set their natural powers or faculties to work, to attend to, and learn, and practice faith and repentance; and ’tis by these very means God persuades his elect powerfully to repent and believe. But when persons will not hear, nor be influenced by these motives, because of their strong and willful aversion to God and godliness, their crime is entirely their own, and their condemnation is just. They have natural powers or faculties in them, which, if well tried, might overcome their native propensity to vice, though they never will do it. If the great God, in a way of sovereign mercy, gives some persons superior aids of grace to overcome this moral impotence, and conquer this aversion to God and goodness‡; if He effectually leads, inclines, or persuades them by his Spirit to repent and believe in Christ, this does not at all hinder the others from exercising their natural powers of understanding, and will in believing and repenting. ‡ Whether the Spirit of God effectually persuade the will to repent and believe in Christ, by immediate Influence upon the will itself, or by setting the things of the Gospel before the mind in so strong a light, and persuading the soul so to attend to them, as shall effectually influence the will, this shall not be any matter of my present debate or determination; for in both the event and consequences are much the same: There is no new natural power or faculty given to the soul in order to faith and repentance, but a divine influence upon the old natural powers, giving them a new and better turn. Nor can anything of their guilt and willful impenitence be imputed to the blessed God, who is Lord of his own favors, and gives or withholds where He pleases, and who shall say to Him, what dost thou? Why should mine eye be evil toward my neighbor, because the eye of God is good? Or what pretense have I to charge God with injustice, when He does more for me than He is bound to do, though He does more for my neighbor than He has done for me? Let this then be constantly maintained, there is a natural, inward sufficiency of powers and faculties given to every sinner to hearken to the calls and offers of grace and the gospel, though they lie under a moral impotence; and there is an outward sufficiency of provision of pardon in the death of Christ, for everyone who repents and accepts the gospel, though pardon is not actually procured for all men, nor secured to them. And thus much is sufficient to maintain the sincerity of God in his universal offers of grace through Jesus Christ, and his present commands to all men to repent and trust in his mercy; as well as to vindicate his equity in the last great Day, when the impenitent and unbelievers shall be condemned. Their death lies at their own doors, for since there was both an outward and inward sufficiency for their recovery, the fault must lie in their own free-will, in their willful aversion to God and Christ, and his salvation. I think this distinction of natural and moral power and impotence, will reconcile all the various expressions of Scripture on this subject, both to one another, and well as to the reason of things, which can hardly be reconciled any other way.</p></blockquote>

rs%2C+than+if+we+command+or+exhort+a+blind+person+to+see%2C+or+a+dead+body+to+rise+or+move%3B+which+commands+and+exhortations+would+appear+ridiculous+and+useless.+And+since+the+blessed+God%2C+in+his+Word%2C+uses+these+moral+means+and+motives+to+call+sinners+to+repentance+and+faith%2C+it+is+certain+that+they+have+natural+powers+and+faculties+sufficient+to+understand+and+practice+these+duties%3B+and+therefore+they+are+not+under+a+necessity+of+sinning%2C+and+of+being+destroyed%2C+since+there+is+nothing+more+wanted+%5Blacking%5D+in+a+way+of+sufficient+natural+powers%2C+faculties%2C+or+abilities%2C+than+what+they+have.+All+the+other+impotence+and+inability+therefore+in+sinners+to+repent+and+believe%2C+properly+speaking%2C+is+but+moral%2C+or+seated+chiefly+in+their+wills.+%E2%80%98Tis+a+great+disinclination+or+aversion+in+these+natural+faculties%2C+to+attend+to%2C+learn%2C+or+practice+the+things+of+God+and+religion%2A%3B+and+this+holds+them+fast+in+their+sinful+state+in+a+similar+way%2C+as+if+they+were+blind+and+dead%2C+and+I+said+the+final+event+will+be+the+same%2C+i.e.+they+will+never+repent+without+almighty+grace.+%2A+I+grant+this+inability+to+repent+has+been+sometimes+called+by+our+divines+a+natural+impotence%2C+because+it+arises+from+the+original+corruption+of+our+nature+since+the+Fall+of+Adam%3B+and+in+this+sense+I+fully+believe+it.+But+this+spring+of+it+is+much+better+signified+and+expressed+by+the+name+of+native+impotence%2C+to+show+that+it+comes+from+our+birth%3B+and+the+quality+of+this+impotence+is+best+called+moral%2C+being+seated+chiefly+in+the+will+and+affections%2C+and+not+in+any+want+of+natural+powers+or+faculties+to+perform+what+God+requires%3A+And+the+reason+is+plain%2C+%28viz.%29+That+no+new+natural+powers+are+given+by+converting+grace%2C+but+only+a+change+of+the+moral+bent+or+inclination+of+the+soul%2C+a+happier+turn+given+to+our+natural+faculties+by+the+sovereign+grace+of+God+and+his+Spirit.+And+upon+this+account+that+strong+and+settled+inclination+to+sin%2C+and+aversion+to+God%2C+which+is+in+the+will+or+affections%2C+is+represented+in+our+own+language%2C+as+well+as+in+the+Eastern+countries%2C+by+impotence+or+inability+to+forsake+or+subdue+sin%3A+As+when+a+drunkard+shall+say%2C+I+had+such+a+strong+desire+to+the+liquor%2C+that+I+could+not+but+drink+to+excess%2C+I+could+not+withhold+the+cup+from+my+mouth%3A+Or+when+a+murderer+shall+say%2C+I+hated+my+neighbor+so+much%2C+that+having+a+fair+opportunity%2C+I+could+not+help+killing+him%3A+Or+when+we+say+to+a+man+of+fury+in+his+passion%2C+You+are+so+warm+at+present%2C+that+you+cannot+see+things+in+a+true+light%2C+you+cannot+hearken+to+reason%2C+you+cannot+judge+aright%2C+you+are+not+capable+of+acting+regularly.+And+that+this+is+the+manner+of+speaking+in+the+Eastern+countries%2C+is+evident+from+the+Bible%2C+Gen.+37%3A4.+Joseph%E2%80%99s+brethren+hated+him%2C+and+could+not+speak+peaceably+to+him%3A+Yet+you+will+grant+all+this+is+but+moral+impotence%2C+i.e.+a+very+strong+inclination+to+excess+of+drink%2C+or+murder%2C+or+passion%2C+or+a+strong+aversion+to+the+contrary+virtues.+Even+in+the+things+of+common+life+the+%E2%80%98cannot%E2%80%99+sometimes+signifies+nothing+but+the+%E2%80%98will+not%E2%80%99%2C+Luke+11%3A7.+%E2%80%98Trouble+me+not%2C+my+door+is+shut%2C+my+children+are+with+me+in+bed%2C+I+cannot+rise+to+give+thee%E2%80%99%3B+i.e.+I+will+not.+And+with+regard+to+faith+or+believing+in+Christ%2C+our+Savior+explains+his+own+Language+in+this+manner.+In+one+place+He+says%2C+%E2%80%98No+man+can+come+unto+Me+except+my+Father+draw+him%2C%E2%80%99+John+6%3A44.+And+in+another+place+He+charges+the+Jews+with+this+as+their+fault%3A+%E2%80%98Ye+will+not+come+unto+Me%2C+that+ye+may+have+life%2C%E2%80%99+John+5%3A40.+So+in+the+parable+one+excuse+is%2C+Luke+14%3A20%2C+%E2%80%98I+have+married+a+wife%2C+and+I+cannot+come.%E2%80%99+All+these+citations+intend+the+same+thing%3A+their+cannot+is+their+will+not%2C+i.e.+%E2%80%99tis+the+strength+of+their+aversion+to+Christ%2C+which+is+a+moral+impotence+or+inability+to+believe+in+Him%2C+and+the+fault+lies+in+the+will.+St.+Paul+speaks+to+the+same+purpose%2C+Rom.+8%3A7%2C+where+he+shows%2C+that+%E2%80%99tis+the+aversion+or+enmity+of+the+carnal+mind+to+God%2C+which+hinders+it+from+obeying+the+Law+of+God%2C+and+at+last+he+says%2C+%E2%80%98it+cannot+be+subject+to+it.%E2%80%99+The+carnal+mind+is+enmity+against+God%2C+for+it+is+not+subject+to+the+Law+of+God%2C+neither+indeed+can+be%3A+%E2%80%98So+then+they+who+are+in+the+flesh+cannot+please+God.%E2%80%99+The+fault+still+lies+in+the+will+of+sinful+man%3B+and+%E2%80%99tis+this+makes+it+criminal%2C+while+it+is+not+naturally+impossible+to+be+avoided+or+overcome.+And+upon+this+account+God+is+pleased+to+use+moral+means+and+motives%2C+%28viz.%29+promises%2C+threatenings%2C+commands%2C+etc.+toward+all+men%2C+such+as+are+suited+to+awaken+their+hearts%2C+and+excite+and+persuade+their+will+to+use+all+their+natural+abilities%2C+to+set+their+natural+powers+or+faculties+to+work%2C+to+attend+to%2C+and+learn%2C+and+practice+faith+and+repentance%3B+and+%E2%80%99tis+by+these+very+means+God+persuades+his+elect+powerfully+to+repent+and+believe.+But+when+persons+will+not+hear%2C+nor+be+influenced+by+these+motives%2C+because+of+their+strong+and+willful+aversion+to+God+and+godliness%2C+their+crime+is+entirely+their+own%2C+and+their+condemnation+is+just.+They+have+natural+powers+or+faculties+in+them%2C+which%2C+if+well+tried%2C+might+overcome+their+native+propensity+to+vice%2C+though+they+never+will+do+it.+If+the+great+God%2C+in+a+way+of+sovereign+mercy%2C+gives+some+persons+superior+aids+of+grace+to+overcome+this+moral+impotence%2C+and+conquer+this+aversion+to+God+and+goodness%E2%80%A1%3B+if+He+effectually+leads%2C+inclines%2C+or+persuades+them+by+his+Spirit+to+repent+and+believe+in+Christ%2C+this+does+not+at+all+hinder+the+others+from+exercising+their+natural+powers+of+understanding%2C+and+will+in+believing+and+repenting.+%E2%80%A1+Whether+the+Spirit+of+God+effectually+persuade+the+will+to+repent+and+believe+in+Christ%2C+by+immediate+Influence+upon+the+will+itself%2C+or+by+setting+the+things+of+the+Gospel+before+the+mind+in+so+strong+a+light%2C+and+persuading+the+soul+so+to+attend+to+them%2C+as+shall+effectually+influence+the+will%2C+this+shall+not+be+any+matter+of+my+present+debate+or+determination%3B+for+in+both+the+event+and+consequences+are+much+the+same%3A+There+is+no+new+natural+power+or+faculty+given+to+the+soul+in+order+to+faith+and+repentance%2C+but+a+divine+influence+upon+the+old+natural+powers%2C+giving+them+a+new+and+better+turn.+Nor+can+anything+of+their+guilt+and+willful+impenitence+be+imputed+to+the+blessed+God%2C+who+is+Lord+of+his+own+favors%2C+and+gives+or+withholds+where+He+pleases%2C+and+who+shall+say+to+Him%2C+what+dost+thou%3F+Why+should+mine+eye+be+evil+toward+my+neighbor%2C+because+the+eye+of+God+is+good%3F+Or+what+pretense+have+I+to+charge+God+with+injustice%2C+when+He+does+more+for+me+than+He+is+bound+to+do%2C+though+He+does+more+for+my+neighbor+than+He+has+done+for+me%3F+Let+this+then+be+constantly+maintained%2C+there+is+a+natural%2C+inward+sufficiency+of+powers+and+faculties+given+to+every+sinner+to+hearken+to+the+calls+and+offers+of+grace+and+the+gospel%2C+though+they+lie+under+a+moral+impotence%3B+and+there+is+an+outward+sufficiency+of+provision+of+pardon+in+the+death+of+Christ%2C+for+everyone+who+repents+and+accepts+the+gospel%2C+though+pardon+is+not+actually+procured+for+all+men%2C+nor+secured+to+them.+And+thus+much+is+sufficient+to+maintain+the+sincerity+of+God+in+his+universal+offers+of+grace+through+Jesus+Christ%2C+and+his+present+commands+to+all+men+to+repent+and+trust+in+his+mercy%3B+as+well+as+to+vindicate+his+equity+in+the+last+great+Day%2C+when+the+impenitent+and+unbelievers+shall+be+condemned.+Their+death+lies+at+their+own+doors%2C+for+since+there+was+both+an+outward+and+inward+sufficiency+for+their+recovery%2C+the+fault+must+lie+in+their+own+free-will%2C+in+their+willful+aversion+to+God+and+Christ%2C+and+his+salvation.+I+think+this+distinction+of+natural+and+moral+power+and+impotence%2C+will+reconcile+all+the+various+expressions+of+Scripture+on+this+subject%2C+both+to+one+another%2C+and+well+as+to+the+reason+of+things%2C+which+can+hardly+be+reconciled+any+other+way.%E2%80%9D%0A%0A%E2%80%94+Isaac+Watts%2C+The+Ruin+%26+Recovery+of+Mankind%2C+%28London%2C+1740%2C+pp.+247-54.&amp;url=https%3A%2F%2F5solasquotes.github.io%2Fquote%2F6e2dfb79f6.html&amp;via=5Solas" target="_blank" rel="noopener">Share on X</a><a class="perma" href="../quote/6e2dfb79f6.html">Permalink</a><a class="src" href="https://reformedbooksonline.com/topics/topics-by-subject/calvinism/total-depravity/natural-vs-moral-inability/#:~:text=Answer.%20It%20is%20granted%2C%20that%20no,hardly%20be%20reconciled%20any%20other%20way&amp;text=Answer.%20It%20is%20granted%2C%20that%20no%20sinner%20will&amp;text=which%20can%20hardly%20be%20reconciled%20any%20other%20way" rel="noopener" target="_blank">Read it online · Reformed Books Online</a></div>

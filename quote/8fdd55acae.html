<main class="wrap"><figure class="quote" id="q-8fdd55acae" data-kw="">
<blockquote><p>Wherefore, just as the eggs of an asp, which have harmed no one, are rightly crushed, so infants are rightly subject to punishment on account of that inherent and death-bringing pestilence, by which they are prone to evil.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/pierre-du-moulin.html">Pierre Du Moulin</a></span><span class="wk"><span class="lbl">Work:</span> <cite>An Untying of Grave Questions</cite>, ch. 1, ‘In which the question is examined, whether there is original sin, in whom it exists, and whether it is removed by Baptism. Only Christ is excepted from this stain. Not even the Virgin Mary was immune from it’ in An Untying of Grave Questions (Leiden: Elzevirana, 1632), Treatise 5, on Original Sin, trans. AI Latin, p. 24</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/sin/original-sin.html">Original Sin</a></span></div>

</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-18dace4f5e" data-kw="">
<blockquote><p>Thus it has come about that there has been much debate in America upon ‘imputation,’ in the sense of the imputation of Adam’s sin, and diverse types of theology have been framed, especially among the Congregationalists and Presbyterians, centering in differences of conception of this doctrine. Among the Presbyterians, for example, four such types are well marked, each of which has been taught by theologians of distinction. These are (1) the ‘Federalistic,’ characterized by its adherence to the doctrine of ‘immediate imputation,’ represented, for example, by Dr. Charles Hodge; (2) the ‘New School,’ characterized by its adherence to the doctrine of ‘mediate imputation,’ represented, for example, by Dr. Henry B. Smith; (3) the ‘Realistic,’ which teaches that all mankind were present in Adam as generic humanity, and sinned in him, and are therefore guilty of his and their common sin, represented, for example, by Dr. W. G. T. Shedd; and (4) one which may be called the ‘Agnostic,’ characterized by an attempt to accept the fact of the transmission of both guilt and depravity from Adam without framing a theory of the mode of their transmission or of their relations one to the other, represented, for example, by Dr. R. W. Landis.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/benjamin-b-warfield.html">Benjamin B. Warfield</a></span><span class="wk"><span class="lbl">Work:</span> <cite>‘Imputation’, ‘6. La Place &amp; Later Theologians &amp; Schools’</cite></span></figcaption>
<div class="meta"><span class="t"><a href="../topics/sin/original-sin.html">Original Sin</a></span></div>

=Thus%20it%20has%20come%20about%20that,example%2C%20by%20Dr.%20R.%20W.%20Landis&amp;text=Thus%20it%20has%20come%20about%20that%20there%20has&amp;text=represented%2C%20for%20example%2C%20by%20Dr.%20R.%20W.%20Landis" rel="noopener" target="_blank">Read it online · Reformed Books Online</a></div>
</figure><figure class="quote" id="q-75beba006a" data-kw="">
<blockquote><p>I had never read one Socinian, nor much of any Arminians… and I remembered two or three things in Dr. [William] Twisse (whom I most esteemed) which inclined me to moderation in the five Articles [disputed between Arminians and the Reformed]: … 4. That the ratio reatus [defining rule of guilt] in our Original Sin, is first founded in our natural propagation from Adam, and but secondarily from the positive Covenant [of Works] of God.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/richard-baxter.html">Richard Baxter</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Catholic Theology Plain, Pure, Peaceable</cite>, ... (London: White, 1675), Preface, n.p.</span></figcaption>

</figure><figure class="quote" id="q-3630fcaed0" data-kw="Original Sin Author of sin Justice">
<blockquote><p>He is not the author of the evil dispositions with which that nature is infected at birth. The doctrine of original sin attributes no efficiency to God in the production of evil. It simply supposes that He judicially abandons our apostate race, and withholds from the descendants of Adam the manifestations of his favour and love, which are the life of the soul.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/charles-hodge.html">Charles Hodge</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Systematic Theology</cite>, Vol. 2 (on original sin)</span></figcaption>

</figure><figure class="quote" id="q-0f7d0d440a" data-kw="">
<blockquote><p>7. We are all so very much in the dark as to the clear and distinct apprehension of the true nature of original, inherent pravity or sin that we must needs be as much ignorant of the true nature of that inherent sanctity or righteousness which is its contrary, or cure. Learned [Matthew Flacius] Illiricus thought it was a substance, which he has in his Clavis pleaded for at large. Others call it a habit, others a nature, or natural inclination and a privation of a natural inclination to God: others call it an indisposition of the mind and will to holy truth and goodness, and an ill disposition of them to error and evil. Others call it only the inordinate lust of the sensitive faculties, with a debility of reason and will to resist it. And whilst the nature of the soul itself and its faculties are so much unknown to itself, the nature of original pravity and righteousness must needs be very much unknown.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/richard-baxter.html">Richard Baxter</a></span><span class="wk"><span class="lbl">Work:</span> <cite>A Christian Directory, or a Sum of Practical Theology</cite>, ... (London: 1673), Question 42, ‘But the great question is, How the Holy Ghost is given to infants in baptism?…’, p. 819</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/sin/original-sin.html">Original Sin</a></span></div>

<main class="wrap"><figure class="quote" id="q-1a52fd1c0c" data-kw="">
<blockquote><p>In its covenant form, [the Law] serves to show them what Christ, the second Adam, did and suffered in their stead. By requiring from all who are under it perfect holiness of nature and perfect obedience of life with complete satisfaction for sin as the conditions of eternal life, it teaches believers what the Lord Jesus, in the greatness of His astonishing love, condescended to become, to do, and to suffer for them. They may see in it as in a glass that He did infinitely more for them than any mere man or angel could ever have done (Rom. 8:3–4; Gal. 3:13–14; Phil. 2:8). Thus, the law, in subservience to the gospel, teaches believers indirectly what the gospel teaches them in direct terms. It is of use also to show them under what infinite obligations they lie to the Lord Jesus for having fulfilled all the righteousness of it in their stead. Though they are not under the law in its covenant form to be either justified or condemned by it, yet it is of special use to them to teach them how much they are bound to love and serve Christ who, by obeying the precepts and enduring the penalties of it in their stead, has brought in everlasting righteousness for their justification. And so it is a means of exciting their gratitude to Christ and also to God, who so loved them as to send Him to answer all its demands for them (2 Cor. 9:15; Col. 1:12–14).</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/john-colquhoun.html">John Colquhoun</a></span><span class="wk"><span class="lbl">Work:</span> <cite>A Treatise on the Law and Gospel (Grand Rapids: Reformation Heritage Books), 117.</cite></span></figcaption>

/colquhoun-the-republication-of-the-law-points-us-to-christ/" rel="noopener" target="_blank">Read it online · Heidelblog</a></div>
</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-f980f0e3eb" data-kw="">
<blockquote><p>God freely justifies the persons whom he effectually calls. He does this, not by infusing righteousness into them but by pardoning their sins and by accounting them, and accepting them as righteous. This He does for Christ’s sake alone and not for anything wrought in them or done by them. The righteousness which is imputed to them, that is, reckoned to their account, is neither their faith nor the act of believing nor any obedience to the gospel which they have rendered, but Christ’s obedience alone. Christ’s one obedience is twofold – His active obedience rendered to the entire divine law, and His passive obedience rendered in his death.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/westminster-assembly.html">Westminster Assembly</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Westminster Confession of Faith</cite>, 11.1 (modern English)</span></figcaption>

<blockquote><p>[1.] Now the active obedience of Christ falls under a twofold consideration: 1. As the man-Christ’s perfect conformity to the Law of God, so as man he was obliged to do and suffer all that He did and suffered, even to lay down his life for man. But had He been only man his righteousness had neither been by condignity meritorious, nor yet satisfactory for us. But: 2. The whole course of Christ’s obedience from his birth to the grave, by doing and suffering, is to be considered as the doing and suffering of so excellent a Person, his being born, his praying, preaching, dying, coming from a Person, God-man. Now the Law required not praying, preaching of God-man, the blood of God, or the dying of Him who was God-Man. And so all these being both so excellent, and then so undue, have respect of satisfaction to God. 2. The active obedience of Christ and all that Christ did and suffered were performed by Him in his state of humiliation: in which he was poor, [Greek], 2 Cor. 8:9, for us, so also by the same ground a weeping man, hungry, thirsty, weary for us, made lower then the angels by the suffering of death, Heb. 2:9, humbled by partaking of flesh and blood, because of the children, Heb. 2:14, emptied Himself for us, Phil. 2. This was, as [David] Pareus well says: perpetua quaedam passio et paena peccatorum nostrorum, fuit tota vita Christi [‘The whole life of Christ was a certain perpetual suffering and punishment for our sins’]: All these have a respect of punishment and suffering. For since Christ was both a viator [pilgrim] and a comprehensor [one attaining glory], and such a holy sinless person, He ought to have had the actual possession of the crown of glory from the womb, and so should have been free of weeping, hunger, thirst, weariness, groaning, sighing, sadnesse, persecution, reproaches, etc., all which adhered to all his active holiness, and therefore, in that, his actions were satisfactory passions. For satisfaction is defined [as] a voluntary restoring of the equivalent, and as good in the place of what is taken away; and the good restored must be: 1. Undue. 2. The proper good of the restorer, which agrees to the active and passive obedience of Christ.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/samuel-rutherford.html">Samuel Rutherford</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Covenant of Life Opened (1655), pt. 2</cite>, ch. 1; pp. 226-27</span></figcaption>

</figure><figure class="quote" id="q-080a24a856" data-kw="">
<blockquote><p>The righteousness by which we are justified and stand righteous before God, is not our own righteousness, but the righteousness of Christ, Phil. 3:8-9; 2 Cor. 5:21, not the righteousness of Christ as God the Second Person in Trinity, but as Mediator, God-man. In which there are two things: 1. The perfect holiness of his humane nature, Heb. 7:26. 2. The perfect righteousness which He performed in doing and suffering according to the Law, this is imputed to us. Christ’s active obedience, his good works and holy life could never have been meritorious for us, nor brought us to Heaven, if he had not died for us, therefore our justification and obtaining of heaven is ascribed to his blood, as if that alone had done both, Rom. 5:9; Heb. 10:19; Rev. 5:6, 9, 11; his intercession and prayers had not been meritorious for us, if he had not died for us.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/edward-leigh.html">Edward Leigh</a></span><span class="wk"><span class="lbl">Work:</span> <cite>A System or Body of Divinity… (London, A.M., 1654), bk. 7, ch. 6, ‘Of Justification’</cite>, pp. 513-14</span></figcaption>

<blockquote><p>1. That righteouseness whereby we are justified before God is the fulfilling of God’s law. 2. Legal justice is the fulfilling of the law, performed by him which is named just. 3. Evangelical justice is the punnishment of our sins, which Christ endured for us, freely imputed by God to them that believe. 4. Since the fall of man no man besides Christ alone in this life is justified before God by the righteouseness of the law. 5. We are justified only by faith in Christ. 6. And yet the righteousness of the law must in this life be begun in all that will be saved.</p></blockquote>

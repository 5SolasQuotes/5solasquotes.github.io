<main class="wrap"><figure class="quote" id="q-7f3aa44429" data-kw="">
<blockquote><p>…but the truth is, neither the king’s judgement, as a certain rule to the representative Church, nor [is] the representative Church’s judgment a rule to the King, but the Word of God [is] the infallible rule to both. Judgment may crook, truth cannot bow; it stands still unmoveable like God, the father of truth; but in this case if both err, excellently says Junius (contra Bellarmine, on Councils, bk.1, ch. 12), the magistrate erring, the Church may do something extraordinarily; and the Church erring the magistrate may do something also in an extraordinary way, as common equity and mutual law requires, that friends with mutual tongues bick [quarrel?] the wounds of friends.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/samuel-rutherford.html">Samuel Rutherford</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Due Right of Presbyteries (1644)</cite>, pp. 415-6</span></figcaption>

<blockquote><p>…for the key of knowledge and the power of pastoral preaching is given, uni subjective, non unitati nisi objective, ‘to one man as to the subject,’ and to the Church, for her salvation and good, as for the end and object; and the pastor being once ordained a pastor, may use these keys, quoad specificationem, independently, for he may preach mercy and wrath, not waiting the Church’s suffrages. Et potestas clavium quoad jurisdictionem data est ecclesiae et subjective et objective, et data est non uni, sed unitati: ‘but the power of the keys,’ in censures, for binding and loosing ‘is given to no one mortal man, but to the Church, both as to the subject, and the object.’ I mean the ministerial Church; and not one man pastor, Pope, or prelate may use the keys; the Church has them and can only validly use them.</p></blockquote>

/div>

<blockquote><p>4. They that distinguish between the key of order and the key of jurisdiction do without question allow the former to the presbyters. Now the key of order (as rightly understood, as Spalatensis has largely opened it) comprehends all that power whereby we do immediately work on the conscience, and so is exercised in foro interno, and not directly in externo. Now that which we have agreed on [in Baxter’s Association] is only so much as belongs to order, or to a presbyter as the ambassador of Christ and [as] his watchman over the souls of those people; and it is to be no further effectual than they conscientiously submit to it, voluntarily, without external force. It is but our preaching and applying God’s Word to the consciences of the hearers.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/richard-baxter.html">Richard Baxter</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Christian Concord, or the Agreement of the Associated Pastors &amp; Churches of Worcestershire, with Richard Baxter’s Explication &amp; Defence of it, &amp; his Exhortation to Unity (London: A.M., 1653), ‘Objections Answered’</cite></span></figcaption>

ad it online · Reformed Books Online</a></div>
</figure><figure class="quote" id="q-22e2ddb815" data-kw="">
<blockquote><p>The covenanters are often considered to have been unrelenting opponents of episcopacy. In the Glasgow Assembly of 1638, when nearly all covenanters voted to ‘remove and abjure’ episcopacy in the kirk, the Glaswegian minister Robert Baillie was the sole named dissenter. Baillie’s subsequent conformity to the covenanting regime after 1638 and his ultimate acceptance of the restored episcopate after 1661 have led historians to claim that he was pliantly obeying those in power. In order to offer an alternative explanation, this article explores the contours of Baillie’s writings on episcopacy in the periods 1637-9 and 1658-62. His views were informed by hatred of the Laudian episcopate and his belief that Scripture described a lawful form of episcopacy similar to the superintendents of the post-Reformation kirk. Whilst Baillie protested against the restored episcopate in 1661, the reasons for his subsequent submission suggest one explanation as to why many presbyterian ministers acquiesced in Charles II’s Erastian kirk settlement.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/alexander-campbell.html">Alexander Campbell</a></span><span class="wk"><span class="lbl">Work:</span> <cite>‘Episcopacy in the Mind of Robert Baillie, 1637-1662’ The Scottish Historical Review, vol. 93, no. 236, pt. 1 (April 2014), pp. 29-55 | Abstract:</cite></span></figcaption>
<div class="meta"><span class="t"><a href="../topics/church-government-and-the-ministry/forms-of-government.html">Forms of Government</a></span></div>

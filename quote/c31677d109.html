<blockquote><p>As I am not willing to thrust any man into extremes, nor to trouble men with calling those sins which God has not forbidden… 1. It is not absolutely unlawful to personate another man, nor does the Second Commandment forbid such living images in this extent… 2. To personate good men in good actions, is not simply unlawful… 3. To personate a bad man, in a bad action, is more dubious; but seems not to be in all cases unlawful… 4. I think it possible to devise and act a comedy or tragedy which should be lawful and very edifying. It might be so ordered by wise men… 5. I think I never knew or heard of a lawful stage-play, comedy or tragedy in the age that I have lived in: And that those now commonly used, are not only sins, but heinous aggravated sins, for these reasons:</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/richard-baxter.html">Richard Baxter</a></span><span class="wk"><span class="lbl">Work:</span> <cite>A Christian Directory… (London: White, 1673), pt. 3, ‘Christian Ecclesiastics’, Question 114, ‘Whether Stage-Plays where the Virtuous &amp; Vicious are Personated, be Lawful?’ [Yes]</cite>, pp. 877-78</span></figcaption>

<blockquote><p>The classical and confessional understanding of this principle [the RPW] led the Reformed churches to distinguish between two aspects of worship: elements and circumstances. This distinction was a corollary to the distinction between a substance and an accident. A substance is that which makes a thing what it is. An accident is something that is temporarily connected or related to the substance but such that it can be changed without changing the substance.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/r-scott-clark.html">R. Scott Clark</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Recovering the Reformed Confession (P&amp;R, 2008)</cite>, pp. 229-30</span></figcaption>

<blockquote><p>2. How names are to be given to places, we cannot better learn than of those ancient founders of names, the holy Patriarchs: As Abraham Gen. 22:14 calls the mountain Jehovah-jireh, ‘The Lord hath seen.’ So Jacob gives holy names to the place where he met the angels, Gen. 32:2, and where he wrestled with the angel, v. 31. They, as we see, gave holy and reverent names unto places, not made peculiar for God’s service, but only for civil use for the places to be called and known by: how much more ought churches and houses of God to be called by his name? We therefore conclude that churches ought not to be erected in saints’ names, to worship them thereby and make them our patrons, mediators, and presenters of our prayers [as Romanists]: for this were great idolatry: Even like as the heathen called their temples by the names of their idols, Venus, Jupiter, Diana and the like: Yet we refuse not to call our churches by the names of saints, as they have been called of old, because we are not inventors of names; and terms inured by continual custom can hardly be left. We use them only as civil terms to distinguish places by: if any otherwise use them, for any religious purpose, they do amiss. And yet we deny not but that the names of holy men may be safely remembered by thanksgiving unto God for such excellent instruments, and setting before our eyes their good example. And concerning the names which have been superstitiously given in times past unto churches and other places (though it were to be wished that they never had been so given) yet now we use them (setting apart all superstition) as civil names of difference, as St. Luke [the author of Acts] describes the ship of Alexandria wherein they were carried, whose badge (says he) was Castor &amp; Pollux, Acts 28:11. In a civil matter of description, he refuses not to use the names of the heathen gods. Augustine also gives a good rule concerning such names. He speaks of the names of days, which were called after the names of heathenish idols, as the fourth day in the week, which we call Wednesday, was then called and is yet in the Latin tongue,Dies Mercurij, Mercury, his day. ‘Sic dicitur, a paganis, &amp; a multis Christianis, sed nolumus vt dicant, et vtinam corrigātur: melius de ore Christiano ritus loquendi ecclesiasticus procedit.’ So it is called of the heathen, and of many Christians, but I would not have them called so, and I wish they were amended: for a Christian kind of speaking best becomes a Christian. Sed si quem forte cōsuetudo traxerit, etc. sciat illos omnes homines fuisse. ‘But if custom prevail with a man so to speak, let him understand that all they were but men,’ whom the heathen take for gods. So say we, it were to be wished that we had names void of all show of superstition: but seeing for our speaking we must be ruled by custom, let us know that those saints by whose names places are called, are no gods, nor God’s fellows, nor patrons or mediators for us, nor any way to be worshipped: But they are the fellow servants of all.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/andrew-willet.html">Andrew Willet</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Synopsis Papismi… (London, 1592)</cite>, pp. 369-370</span></figcaption>

<blockquote><p>Question 6. Whether any singular and individual action be indifferent? 10th Answer. First, there be some actions which though they be actions of a man, yet they are not human actions; such are those which proceed from imagination only, and not from deliberate reason, as the rubbings of men’s hands, to scratch the head or beard, to take up a straw, etc. while we are thinking of something else: these actions are not morally good or evil, they want that which is required to make them so, namely counsel and deliberation. For although a man may sin by those actions, as if in time of prayer he suffer his imagination to wander, and do give way to such toyings as those. Yet these actions considered in themselves are neither good nor evil. It is true these motions are subject to the command of man’s will, but yet they are so subject that they may be exercised without any precedent act of reason: Neither are we bound any further by reason to prevent them; but only so far that they hinder not the duties we are about. So for moving of the eyelids, reason and the will have power to moderate them, but it is not worth the while to take notice how often we wink, if so be we take heed that in such things nothing be done which is indecent, or against our duty. 11. Secondly, every action which proceeds from deliberate reason and is properly called human, considered singularly and in the individual, as it is an exercised action, is either good or evil. For such a kind of action is either ordered to a good end, or it is not; If it be, then it has the nature of a good action, if other circumstances be correspondent; if it be not ordered to a good end, it is an evil action because it wants the perfection which ought to be in it, and is not according to its rule. 12. Yet is not required to the goodness of natural action that it be always actually and explicitly referred to the due end, so that this [at least] be done implicity and virtually; because reason in that exercise of such kind of actions, may often with more profit be conversant about those objects. 13. Thirdly, some one or two circumstances of an human action may be indifferent, as if one scholar be speaking with another, it is sometimes indifferent whether they use the Latin tongue, or any other. But their talk taken with all the circumstances is necessarily either good or bad: the reason is, because the determination of an action does not depend upon one circumstance apart, but upon all jointly together. 14. Fourthly, there may be some singular action in which there is no goodness-special to be found, which may not be found in another, and so, that at this time we do this or that, rather than another thing, therein is ofttimes neither good nor evil. Opportunity, or the suggestion of our minds, without any respect of moral goodness, may be of weight sufficient to make the determination. 15. Fifthly, although therefore there be no singular actions-human, that is neither good, nor evil; yet there are diverse, which singularly and in comparison of others, are neither necessary nor unlawful. For as the carver oftentimes has no certain reason why he rather makes this image than that: yet if he make any, it is necessary that he either follow the rules of his art and make a good one, or fail and so make a bad one. So it is in many singular actions of men, which in respect of the exercise, have no proper reason beside the inclination of the mind, but in the doing they are either good or bad.</p></blockquote>

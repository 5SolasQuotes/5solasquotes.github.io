<main class="wrap"><figure class="quote" id="q-d6f122fade" data-kw="">
<blockquote><p>X. The covenant [of works] does, on the part of God, comprise three things in general. 1st. A promise of consummate happiness in eternal life. 2dly. A designation and prescription of the condition, by the performance of which man acquires a right to the promise. 3dly. A penal sanction against those who do not come up to the prescribed condition. All these things regard the whole man, or ολοκληρος, in Paul’s phrase, as consisting of soul and body. God’s promise of happiness is to each part, he requires the sanctification of each, and threatens each with destruction. And so this covenant makes God appear glorious in the whole man.

XI. To engage in such a covenant with the rational creature, formed after the divine image, is entirely worthy of, and by no means unbecoming of God. For it was impossible, but God should propose himself to the rational creature, as a pattern of holiness, in conformity to which he ought to frame himself and all his actions, carefully keeping, and always exerting the activity of that original righteousness, which he was, from his very origin, endowed with. God cannot but bind man to love, worship, and seek him, as the chief good: nor is it conceivable, how God should require man to love and seek him, and yet refuse to be found by man, loving, seeking, and esteeming him as his chief good, longing, hungering, and thirsting after him alone.

Who can conceive it to be worthy of God, that he should thus say to man: I am willing that thou seekest me only, but on condition of never finding me; to be ardently longed for above every thing else with the greatest hunger and thirst, but yet never to be satisfied. And the justice of God no less requires, that man, upon rejecting the happiness offered on the most equitable terms, should be punished with the privation of it, and likewise incur the severest indignation of God, whom he has despised. Whence it appears, that, from the very consideration of the divine perfections, it may be fairly deduced, that he has prescribed a certain law to man, as the condition of enjoying happiness, which consists in the fruition of God; enforced with the threatening of a curse against the rebel. In which we have just now said, that the whole of the covenant consisted.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/herman-witsius.html">Herman Witsius</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Economy of the Covenants Between God and Man: Comprehending a Complete Body of Divinity</cite>, trans. William Crookshank (1677; 2 vols, London, 1822), 1.1.10-11, i, p. 46.</span></figcaption>

<blockquote><p>To say that God carryeth all things by an absolute and unconditional decree of providence, viz. opposing absolute to all conditions presupposed in the creature, in my judgment is neither agreeing to the Doctrine of Scripture, nor of our Divines; who do both teach that as God in the fulness of time doth administer and dispense the way of his providence, so he decreed to dispense them in the same manner from eternity.

Now in dispensing the performance of the Covenant of works, the Lord punisheth and rewardeth the creature according to the condition of obedience or disobedience performed by it, as it is at large described, Levit. 26; Deut. 28. and therefore surely he decreed to carry such works of his providence upon the same conditions.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/william-twisse.html">William Twisse</a></span><span class="wk"><span class="lbl">Work:</span> <cite>A treatise of Mr. Cotton’s, Clearing certain doubts concerning predestination. Together with an examination thereof</cite>, (London: Andrew Crook, 1646), p. 245.</span></figcaption>

</figure><figure class="quote" id="q-354c26cd8f" data-kw="">
<blockquote><p>Because what God so severely punished must have been no light sin but a detestable crime, we must consider what species of sin (peccati) there was in Adam’s fall that kindled God’s horrible vengeance against the whole human race. To regard Adam’s sin as gluttonous intemperance (a common notion) is childish. As if the sum and head of all virtues lay in abstaining solely from one fruit, when all sorts of desirable delights abounded everywhere; and not only abundance but also magnificent variety was at hand in that blessed fruitfulness of earth! We must, therefore, look deeper. The prohibition from the tree of knowledge of good and evil was a test of obedience (obedientiae examen), that Adam, by observing it, might prove his willing submission to the command of God. The very name of the tree shows the sole purpose of the precept was to keep him content with his lot and to prevent him from becoming puffed up with cupidity. The promise (promissio), which gave him hope of eternal life as long as he should eat of the tree of life (arbore vitae), and, on the other hand, the fearful denunciation of death the moment he should taste of the tree of knowledge of good and evil, were meant to test (probandam) and exercise his faith. Hence it is not hard to deduce by what means Adam provoked God’s wrath upon himself. Indeed, Augustine speaks rightly when he declares that pride was the beginning of all evils. For if ambition had not raised man higher than was meet and right, he could have remained in his original state.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/john-calvin.html">John Calvin</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Institutes of the Christian Religion</cite>, 2.1.4.</span></figcaption>

</figure><figure class="quote" id="q-956ef8743f" data-kw="">
<blockquote><p>Controversy – Did man before the Fall have the promises of a blessed life and the glory of heaven? We affirm against the Socinians and Anabaptists. Arguments:

1. The covenant of God, “Do this and live,” only had a place before the Fall and in the case of Christ, but it means, “you will live forever” (Gal. 3:12, 21).

2. The death denounced to man includes eternal death under the dominion of the devil, as we may conclude from Gen. 3:13 and 1 Cor. 15:22; therefore, the promised life was eternal life.

3. The law has only been weakened through sin so that it cannot save (salvare) (Rom. 8:3); therefore, before sin it was able to save (salvare).

4. He had the tree of life, and the thing that it signified was eternal life (Rev. 2:7).</p></blockquote>

Online</a></div>
</figure><figure class="quote" id="q-26adfe6d32" data-kw="">
<blockquote><p>Because God added thereunto a pledge and Sacrament in the Tree of Life, whereby he would have that Covenant of the Law, written in the heart, more clearly confirmed also outwardly; to wit, that he would by the observation of his Law, first perpetuate man’s life in this world unto the solemn justification of him; at his appointed time; and then advance him to a further and heavenly Felicity. And on the other side, he threatens Death unto him, in case he should depart from that Will and Law of God: all which had been done to no purpose, if man had been at first made by God himself, in any measure or manner sinful and perverse.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/william-ames.html">William Ames</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Substance of Christian Religion: Or, A Plain and Easy Draught of the Christian Catechism</cite>, (London: Thomas Davies, 1659), p. 19.</span></figcaption>

<main class="wrap"><figure class="quote" id="q-6b1cafc707" data-kw="">
<blockquote><p>In forming the religious character here recommended, it is of the utmost importance that the foundation be laid in clear views of divine truth. Doctrinal knowledge is apt to be undervalued by private Christians, and especially by the young. They imagine, according to the popular prejudice, that if the heart be right, and the conduct correct, the doctrines embraced are of small moment. This supposes that the heart of any one may be right, while his principles are essentially wrong; or that his practice may be pure, while his religious opinions are radically erroneous. But nothing can be more contrary both to Scripture and experience.

The great Founder of our holy Religion declares that men are “sanctified by the truth.” In fact, it is only so far as the truth is received, loved, and obeyed, that real religion has any place either in the heart or life. To suppose that any one can be sanctified, or in any respect benefited, by embracing error, is as repugnant to reason as it is to the word of God. He who “has a hope in him,” ought ever to be ready to “give a reason for it with meekness and fear;” and he will be ready to do so, if his hope be scriptural and intelligent.

It is melancholy to think how frequently this matter is in a great measure disregarded by professing Christians, otherwise well informed. Physicians, Lawyers, Merchants, and others, who confidently call themselves by the name of Christ, who have given many laborious days and nights to the acquirement of other kinds of knowledge, and who would be ashamed of being found ignorant of those branches of literature or science to which they profess to have attended, manifest no shame whatever in acknowledging themselves ignorant of the plainest subjects in Theology.

It is not intended here either to assign the reasons, or to show the sin and folly of this deplorable fact; but to remark that the foundation of this fact is commonly laid in youth. If the young, and even the thinking and serious portion of the young, were as careful to store their minds with elementary principles, and with clear, discriminating views of revealed truth, as they are with the best and most accredited elements of other sciences, we should not find so many hoary-headed Christians unable to defend their own professed principles, and led astray by the artful votaries of error. That firm and accurate foundation of knowledge which is laid in youth, is most apt to remain unmoved, and to serve as a basis for the loftiest and most useful superstructure in after life.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/samuel-miller.html">Samuel Miller</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Introductory Address to William Buell Sprague, Lectures to Young People</cite></span></figcaption>

</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-fe286fc243" data-kw="">
<blockquote><p>For this our age shows us plainly how much the state needs excellent knowledge, because everywhere many – be it from lack of judgement, or because they cannot explain anything clearly – have spread or defend absurd and miscellaneous beliefs, from which great struggles and great discord in the Church have emerged. There will be no end to these ills unless the young are called back to the true and erudite system of studying. Those who lead the Church and the state would truly need to apply themselves to that task. But the same concern is also a matter for our office, that is, for those who teach or study in the schools. For our office also pertains to the state. We are put in our position by divine providence in order to preserve and spread a knowledge useful for humankind. God demands this diligence from teachers and students in equal measure.

Therefore the young should consider that they have a duty towards God to strive for firm and complete knowledge which will be of use to the Church and the state. As we bring our minds to the churches, we need to bring them to the school, that is, in order that we come to know divine things there and disclose them to others. If anyone comes to the school only in order to take away from there some particular discipline that he could direct to gain and idle show, he should know that he defiles the most holy temple of knowledge. In the same way, if the young understand their duty, if they know in what spirit they need to busy themselves with their studies, we shall easily obtain from those whose minds are not monstrous that they understand all the arts correctly and in order, and that they attempt to acquire not the empty shadow of erudition, but true knowledge.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/philip-melanchthon.html">Philip Melanchthon</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Preface to Johannes Vogelin s, Book on the Elements of Geometry</cite></span></figcaption>

<blockquote><p>Mr. Robert Hamilton [1650–1701] was a gentleman of good family, being brother to Sir William Hamilton of Preston, to whose title and estates he would have succeeded, on his death, at the [Glorious] Revolution [1689], if he had not refused to own, or rather had not openly disowned, the authority of [King] William and Mary [of Orange]. He appears to have been a pious man and of good intentions, but of narrow views, severe in his temper, and altogether unqualified, by want of military talents and experience, for the command which he assumed, or which was conferred on him by the small body which proved successful in the skirmish at Drumclog [1679]. He is charged, and apparently not without reason, with having been active in pushing [Donald] Cargill, [Richard] Cameron, and some other ministers, to those extremes which produced a breach between them and their brethren, with whom they had until of late acted in concert. This dissension was a main cause of the failure of the present attempt to redress national grievances. Hamilton and his party acted on the principle, that it was unlawful to associate, for vindicating their civil and religious rights, with any but those with whom they could join in church-communion; or, which amounts to the same thing, that it behoved them to introduce into the state of their quarrel, as appearing in arms, a condemnation of every thing in relation to the public interests of religion which was sinful or unscriptural;¹ a principle which, while it involved them in that very confounding of civil and ecclesiastical matters against which they inveighed so loudly under the name of Erastianism, tended to rivet the chains of servitude on themselves and the nation. ¹ [See ‘Not All Truths must be Preached in All Circumstances’ at ‘Pastors’ (RBO)] Into this error they appear to have been betrayed partly by mistaken notions of the controversy which had formerly arisen respecting the Public Resolutions [in the late-1640’s and early-1650’s].² What the more honest party at that period opposed was, the admitting to places of power and trust of such as had shown by their previous conduct that they were enemies to the reformation introduced into church and state, and would use the power intrusted to them to overturn it. ² [See ‘The Scottish Resolutioner-Protester Controversy, 1650’s’ (RBO)] This could not be said of those who had accepted of or acquiesced in the Indulgence,³ and still less of those whom Hamilton’s friends wrangled with so fiercely, who protested solemnly that they disapproved of the Indulgence, and whose former conduct vouched for the sincerity of their protestations. ³ [See the ‘Intro’ at ‘Defenses of Scottish Covenanting &amp; the Indulgence &amp; Occasional Hearing Controversies, 1661-1688’ (RBO)] Another remark is suggested by the facts here referred to. If ministers of the gospel would preserve their usefulness and respectability, they must guard their independence on the side of the people as well as of civil rulers. Provided they become “the servants of men,” it matters not much whether their masters wear a crown or a bonnet; and if, instead of going before the people to point out to them the path of duty, and checking them when they are ready to run into extremes, they wait to receive directions from them, and suffer themselves to be borne along by the popular stream, the consequences cannot fail to be fatal to both. Firm and tenacious of his purpose, the servant of the Lord, while gentle to all, ought to hold on the even tenor of his way, unmoved equally by the frown of the tyrant, the cry of the multitude, and the dictates of forward individuals, good and well-meaning men it may be, but who ” cannot see afar off,” and just need the more to be led that they think themselves capable of being leaders. An opposite conduct on the part of two or three ministers tended to foster those extravagant opinions and practices adopted by some presbyterians at this period, which discredited the cause for which they appeared, and which their best friends, though they may excuse, will not be able to defend, and should not seek to vindicate.</p></blockquote>

y+under+the+name+of+Erastianism%2C+tended+to+rivet+the+chains+of+servitude+on+themselves+and+the+nation.+%C2%B9+%5BSee+%E2%80%98Not+All+Truths+must+be+Preached+in+All+Circumstances%E2%80%99+at+%E2%80%98Pastors%E2%80%99+%28RBO%29%5D+Into+this+error+they+appear+to+have+been+betrayed+partly+by+mistaken+notions+of+the+controversy+which+had+formerly+arisen+respecting+the+Public+Resolutions+%5Bin+the+late-1640%E2%80%99s+and+early-1650%E2%80%99s%5D.%C2%B2+What+the+more+honest+party+at+that+period+opposed+was%2C+the+admitting+to+places+of+power+and+trust+of+such+as+had+shown+by+their+previous+conduct+that+they+were+enemies+to+the+reformation+introduced+into+church+and+state%2C+and+would+use+the+power+intrusted+to+them+to+overturn+it.+%C2%B2+%5BSee+%E2%80%98The+Scottish+Resolutioner-Protester+Controversy%2C+1650%E2%80%99s%E2%80%99+%28RBO%29%5D+This+could+not+be+said+of+those+who+had+accepted+of+or+acquiesced+in+the+Indulgence%2C%C2%B3+and+still+less+of+those+whom+Hamilton%E2%80%99s+friends+wrangled+with+so+fiercely%2C+who+protested+solemnly+that+they+disapproved+of+the+Indulgence%2C+and+whose+former+conduct+vouched+for+the+sincerity+of+their+protestations.+%C2%B3+%5BSee+the+%E2%80%98Intro%E2%80%99+at+%E2%80%98Defenses+of+Scottish+Covenanting+%26+the+Indulgence+%26+Occasional+Hearing+Controversies%2C+1661-1688%E2%80%99+%28RBO%29%5D+Another+remark+is+suggested+by+the+facts+here+referred+to.+If+ministers+of+the+gospel+would+preserve+their+usefulness+and+respectability%2C+they+must+guard+their+independence+on+the+side+of+the+people+as+well+as+of+civil+rulers.+Provided+they+become+%E2%80%9Cthe+servants+of+men%2C%E2%80%9D+it+matters+not+much+whether+their+masters+wear+a+crown+or+a+bonnet%3B+and+if%2C+instead+of+going+before+the+people+to+point+out+to+them+the+path+of+duty%2C+and+checking+them+when+they+are+ready+to+run+into+extremes%2C+they+wait+to+receive+directions+from+them%2C+and+suffer+themselves+to+be+borne+along+by+the+popular+stream%2C+the+consequences+cannot+fail+to+be+fatal+to+both.+Firm+and+tenacious+of+his+purpose%2C+the+servant+of+the+Lord%2C+while+gentle+to+all%2C+ought+to+hold+on+the+even+tenor+of+his+way%2C+unmoved+equally+by+the+frown+of+the+tyrant%2C+the+cry+of+the+multitude%2C+and+the+dictates+of+forward+individuals%2C+good+and+well-meaning+men+it+may+be%2C+but+who+%E2%80%9D+cannot+see+afar+off%2C%E2%80%9D+and+just+need+the+more+to+be+led+that+they+think+themselves+capable+of+being+leaders.+An+opposite+conduct+on+the+part+of+two+or+three+ministers+tended+to+foster+those+extravagant+opinions+and+practices+adopted+by+some+presbyterians+at+this+period%2C+which+discredited+the+cause+for+which+they+appeared%2C+and+which+their+best+friends%2C+though+they+may+excuse%2C+will+not+be+able+to+defend%2C+and+should+not+seek+to+vindicate.%E2%80%9D%0A%0A%E2%80%94+Thomas+M%E2%80%99Crie+Sr.%2C+Memoirs+of+Mr.+William+Veitch%2C+and+George+Brysson%2C+Written+by+Themselves%2C+ed.+Thomas+M%E2%80%99Crie+%28Edinburgh%3A+William+Blackwood%2C+1825%29%2C+%E2%80%9CBiographical+Notices+of+James+Ure+of+Shargarton%E2%80%9D%2C+pp.+452-54&amp;url=https%3A%2F%2F5solasquotes.github.io%2Fquote%2F32fce1c9ef.html&amp;via=5Solas" target="_blank" rel="noopener">Share on X</a><a class="perma" href="../quote/32fce1c9ef.html">Permalink</a><a class="src" href="https://reformedbooksonline.com/on-cameronianism/#:~:text=Mr.%20Robert%20Hamilton%20%5B1650%E2%80%931701%5D%20was%20a,and%20should%20not%20seek%20to%20vindicate&amp;text=Mr.%20Robert%20Hamilton%20%5B1650%E2%80%931701%5D%20was%20a%20gentleman%20of&amp;text=to%20defend%2C%20and%20should%20not%20seek%20to%20vindicate" rel="noopener" target="_blank">Read it online · Reformed Books Online</a></div>

<blockquote><p>We assent to all the Thirty-Nine Articles, except these about bishops and ceremonies; and we would not separate from the Church because of doctrinal mistakes in these things, if the owning of them were not imposed as the terms of our communion with her. But,” says he, “It is not so easy to persuade us that there is no just cause to withdraw from the communion of some particular parishes in England, where Arminianism or Socinianism is commonly taught, where the practice of godliness is ridiculed, and principles striking at the root of it are instilled into the hearers, etc.</p></blockquote>

<blockquote><p>Referring to the first gathering of the General Assembly of the Church of Scotland after the Glorious Revolution, which met in October 1690, the younger Thomas McCrie made the following observations on some of the prominent godly ministers in attendance:

The Moderator, HUGH KENNEDY, first attracts our notice. He is a venerable man, selected for the honourable place he occupies from respect to his great age and his tried attachment to the cause of Presbytery. So keen was his opposition to Prelacy, that the Jacobites had nicknamed him Bitter-Beard. His brethren, however, who knew him better, assure us that those who gave him such a name “mistook the temper of the man.” And how often do we find similar misapprehensions of public men entertained by those who know them only as opponents, or have seen them only amidst “the strife of tongues!”

Turning our eye towards the Assembly, we see many of his compatriots and fellow-sufferers around him. There is old GABRIEL SEMPILL of Jedburgh, who assisted at the renewing of the covenants at Lanark before the rising at Pentland; — a gentleman by birth, being the son of Sir Bryce and the descendant of Lord Sempill, — a bold man and a genuine chip of the old block was this same Gabriel Sempill; — the companion of the heroic John Welsh in his weary wanderings and hairbreadth escapes, and though, like him, no lover of the extreme policy of Sir Robert Hamilton and his party, yet a sufferer in the good cause, for he was captured, thrown into prison, and narrowly escaped “with the skin of his teeth;” and a powerful preacher withal, “eminently countenanced of God with success in the work of the gospel.” There he stands, hale and sound after all he has endured, and with a vigour so little impaired by age that Thomas Boston, having heard him deliver an address “from the reader’s desk,” declares, ” I was in a manner amazed, for his words went out through me, and in through me, so that I said in my heart, Happy are those that hear thy wisdom!”

And there sits WILLIAM VEITCH, whose Memoirs, lately rescued from oblivion, have made us familiar with his adventurous career; and beside him sits his friend, GILBERT ELLIOT, after wards Lord Minto, who, when an advocate, had contrived to save his life. The two friends may be conceived conversing on the perils through which they had passed; for often was his lordship wont facetiously to say to Veitch after he became minister of Dumfries, “Ah, Willie, Willie, had it no” been for me, the pyets hail been pyking your pate on the Netherbow port!” To which Veitch would reply, “Ah, Gibbie, Gibbie, had it no’ been for me, ye would have been writing papers yet for a plack the page!”

There, too, might be seen a venerable sufferer, whose name was enough to diffuse an air of sanctity over the Assembly which he graced with his presence — the grave, the godly, the apostolic THOMAS HOG of Kiltearn. There he sits — that man of God, whom the Highlanders have not even yet forgot, who would spend whole days and nights in prayer; the man whom Lauderdale committed to the Bass, and whom, on his praying to be released on the plea of delicate health, Sharp ordered to be thrust down into the subterranean cell of that prison, but where, instead of perishing, as was no doubt intended, he recovered, and used afterwards to observe, when any thing was said to the prejudice of the Archbishop, “Commend me to Sharp for a good physician!”

Gifted with that celestial light “shining inward,&#x27;” which seems to have been vouchsafed to the saints under the dark cloud of persecution, on the same principle that Milton looked for it, when deprived of sight, this singular man predicted the Revolution four years before it took place, sending the following message to the Prince of Orange in the “killing time” of 1685:— “Tell him that I have assurance of the Lord, that though the Church of Scotland is under a dark cloud now, yet it will be over in a few years, and that he shall be the instrument of her deliverance, and shall be king of these realms.” What must have been his feelings, now that he saw his prophecy realised! There he sits, not scathed but sublimed by the fires of persecution — destined yet to leave the stamp of his piety on the north, and graft the genial influences of Christianity on the hardy stock of the Highland character. The firmness and fidelity of the martyr followed him to the grave.

The Assembly having, partly from sanitary, partly from anti-popish reasons, prohibited intermural burials in churches, a hot-headed laird determined to violate the injunction, and came for that purpose with a train of armed attendants. Mr Hog placed himself at the church door, and told them, that if they entered, it should be over his dead body. His own grave he ordered to be dug at the threshold, and on his tombstone was written the inscription, “This stone shall bear witness against the parishioners of Kiltearn, if they bring ane ungodly minister in here.”

Another striking character in this assembly is HENRY ERSKINE, the pious father of the famous Ebenezer and Ralph Erskine; and, what is not less honourable to his memory, the spiritual father of Thomas Boston, who traced his conversion to a sermon delivered by this worthy man, — a conversion which has issued, it is believed, in that of thousands besides. Who that has heard can ever forget the domestic scene in the cottage at Dryburgh, when the scanty supplies were consumed at supper-time, and the children awoke crying for bread, while the good minister tried to entertain them by playing on the gittern, and to comfort their poor mother, playing and praying by turns, when some one knocks at the door, and the country man on horseback leaves the bag stored with provisions, and gets so mysteriously surly on being questioned whence it came, and goes off leaving them lost in astonishment and gratitude!

Or to change the scene, who can fail to admire the same good man, as he stood before the Privy Council with the instruments of torture attached to his hands, and when required to give bond to preach no more at conventicles, replying to Sir George Mackenzie: “My lord, I have my commission from Christ, and though I were within an hour of my death, I durst not lay it down at the feet of any mortal man!” And who does not rejoice to see such a noble character sitting again in the Assembly of his church, and peacefully ending his days at an advanced age in his manse at Chirnside!

The names we have now chronicled may be regarded as representing the more pious and devoted class — types of the men of the covenant.</p></blockquote>

d+of+God+with+success+in+the+work+of+the+gospel.%E2%80%9D+There+he+stands%2C+hale+and+sound+after+all+he+has+endured%2C+and+with+a+vigour+so+little+impaired+by+age+that+Thomas+Boston%2C+having+heard+him+deliver+an+address+%E2%80%9Cfrom+the+reader%E2%80%99s+desk%2C%E2%80%9D+declares%2C+%E2%80%9D+I+was+in+a+manner+amazed%2C+for+his+words+went+out+through+me%2C+and+in+through+me%2C+so+that+I+said+in+my+heart%2C+Happy+are+those+that+hear+thy+wisdom%21%E2%80%9D%0A%0AAnd+there+sits+WILLIAM+VEITCH%2C+whose+Memoirs%2C+lately+rescued+from+oblivion%2C+have+made+us+familiar+with+his+adventurous+career%3B+and+beside+him+sits+his+friend%2C+GILBERT+ELLIOT%2C+after+wards+Lord+Minto%2C+who%2C+when+an+advocate%2C+had+contrived+to+save+his+life.+The+two+friends+may+be+conceived+conversing+on+the+perils+through+which+they+had+passed%3B+for+often+was+his+lordship+wont+facetiously+to+say+to+Veitch+after+he+became+minister+of+Dumfries%2C+%E2%80%9CAh%2C+Willie%2C+Willie%2C+had+it+no%E2%80%9D+been+for+me%2C+the+pyets+hail+been+pyking+your+pate+on+the+Netherbow+port%21%E2%80%9D+To+which+Veitch+would+reply%2C+%E2%80%9CAh%2C+Gibbie%2C+Gibbie%2C+had+it+no%E2%80%99+been+for+me%2C+ye+would+have+been+writing+papers+yet+for+a+plack+the+page%21%E2%80%9D%0A%0AThere%2C+too%2C+might+be+seen+a+venerable+sufferer%2C+whose+name+was+enough+to+diffuse+an+air+of+sanctity+over+the+Assembly+which+he+graced+with+his+presence+%E2%80%94+the+grave%2C+the+godly%2C+the+apostolic+THOMAS+HOG+of+Kiltearn.+There+he+sits+%E2%80%94+that+man+of+God%2C+whom+the+Highlanders+have+not+even+yet+forgot%2C+who+would+spend+whole+days+and+nights+in+prayer%3B+the+man+whom+Lauderdale+committed+to+the+Bass%2C+and+whom%2C+on+his+praying+to+be+released+on+the+plea+of+delicate+health%2C+Sharp+ordered+to+be+thrust+down+into+the+subterranean+cell+of+that+prison%2C+but+where%2C+instead+of+perishing%2C+as+was+no+doubt+intended%2C+he+recovered%2C+and+used+afterwards+to+observe%2C+when+any+thing+was+said+to+the+prejudice+of+the+Archbishop%2C+%E2%80%9CCommend+me+to+Sharp+for+a+good+physician%21%E2%80%9D%0A%0AGifted+with+that+celestial+light+%E2%80%9Cshining+inward%2C%27%E2%80%9D+which+seems+to+have+been+vouchsafed+to+the+saints+under+the+dark+cloud+of+persecution%2C+on+the+same+principle+that+Milton+looked+for+it%2C+when+deprived+of+sight%2C+this+singular+man+predicted+the+Revolution+four+years+before+it+took+place%2C+sending+the+following+message+to+the+Prince+of+Orange+in+the+%E2%80%9Ckilling+time%E2%80%9D+of+1685%3A%E2%80%94+%E2%80%9CTell+him+that+I+have+assurance+of+the+Lord%2C+that+though+the+Church+of+Scotland+is+under+a+dark+cloud+now%2C+yet+it+will+be+over+in+a+few+years%2C+and+that+he+shall+be+the+instrument+of+her+deliverance%2C+and+shall+be+king+of+these+realms.%E2%80%9D+What+must+have+been+his+feelings%2C+now+that+he+saw+his+prophecy+realised%21+There+he+sits%2C+not+scathed+but+sublimed+by+the+fires+of+persecution+%E2%80%94+destined+yet+to+leave+the+stamp+of+his+piety+on+the+north%2C+and+graft+the+genial+influences+of+Christianity+on+the+hardy+stock+of+the+Highland+character.+The+firmness+and+fidelity+of+the+martyr+followed+him+to+the+grave.%0A%0AThe+Assembly+having%2C+partly+from+sanitary%2C+partly+from+anti-popish+reasons%2C+prohibited+intermural+burials+in+churches%2C+a+hot-headed+laird+determined+to+violate+the+injunction%2C+and+came+for+that+purpose+with+a+train+of+armed+attendants.+Mr+Hog+placed+himself+at+the+church+door%2C+and+told+them%2C+that+if+they+entered%2C+it+should+be+over+his+dead+body.+His+own+grave+he+ordered+to+be+dug+at+the+threshold%2C+and+on+his+tombstone+was+written+the+inscription%2C+%E2%80%9CThis+stone+shall+bear+witness+against+the+parishioners+of+Kiltearn%2C+if+they+bring+ane+ungodly+minister+in+here.%E2%80%9D%0A%0AAnother+striking+character+in+this+assembly+is+HENRY+ERSKINE%2C+the+pious+father+of+the+famous+Ebenezer+and+Ralph+Erskine%3B+and%2C+what+is+not+less+honourable+to+his+memory%2C+the+spiritual+father+of+Thomas+Boston%2C+who+traced+his+conversion+to+a+sermon+delivered+by+this+worthy+man%2C+%E2%80%94+a+conversion+which+has+issued%2C+it+is+believed%2C+in+that+of+thousands+besides.+Who+that+has+heard+can+ever+forget+the+domestic+scene+in+the+cottage+at+Dryburgh%2C+when+the+scanty+supplies+were+consumed+at+supper-time%2C+and+the+children+awoke+crying+for+bread%2C+while+the+good+minister+tried+to+entertain+them+by+playing+on+the+gittern%2C+and+to+comfort+their+poor+mother%2C+playing+and+praying+by+turns%2C+when+some+one+knocks+at+the+door%2C+and+the+country+man+on+horseback+leaves+the+bag+stored+with+provisions%2C+and+gets+so+mysteriously+surly+on+being+questioned+whence+it+came%2C+and+goes+off+leaving+them+lost+in+astonishment+and+gratitude%21%0A%0AOr+to+change+the+scene%2C+who+can+fail+to+admire+the+same+good+man%2C+as+he+stood+before+the+Privy+Council+with+the+instruments+of+torture+attached+to+his+hands%2C+and+when+required+to+give+bond+to+preach+no+more+at+conventicles%2C+replying+to+Sir+George+Mackenzie%3A+%E2%80%9CMy+lord%2C+I+have+my+commission+from+Christ%2C+and+though+I+were+within+an+hour+of+my+death%2C+I+durst+not+lay+it+down+at+the+feet+of+any+mortal+man%21%E2%80%9D+And+who+does+not+rejoice+to+see+such+a+noble+character+sitting+again+in+the+Assembly+of+his+church%2C+and+peacefully+ending+his+days+at+an+advanced+age+in+his+manse+at+Chirnside%21%0A%0AThe+names+we+have+now+chronicled+may+be+regarded+as+representing+the+more+pious+and+devoted+class+%E2%80%94+types+of+the+men+of+the+covenant.%E2%80%9D%0A%0A%E2%80%94+Thomas+M%E2%80%99Crie+Jr.%2C+%E2%80%9CThe+Marrow+Controversy%3A+with+Notices+of+the+State+of+Scottish+Theology+in+the+beginning+of+the+last+century%E2%80%99%2C+British+and+Foreign+Evangelical+Review&amp;url=https%3A%2F%2F5solasquotes.github.io%2Fquote%2Fedc83f228d.html&amp;via=5Solas" target="_blank" rel="noopener">Share on X</a><a class="perma" href="../quote/edc83f228d.html">Permalink</a><a class="src" href="https://reformedcovenanter.wordpress.com/2019/12/10/thomas-mccrie-the-younger-on-the-characters-of-the-1690-scottish-general-assembly/" rel="noopener" target="_blank">Read it online · Reformed Covenanter</a></div>

<blockquote><p>Should we come to the throne of grace, that we may find grace? Then prayerless people are graceless people. Grace is only to be had at this throne; therefore such as have no business at the throne of grace, are a graceless people. A prayerless person is a graceless person; a prayerless family is a graceless family; and London would be a graceless city, and England a graceless kingdom, if there were no seekers of God in them. But blessed be God, there are a great many.

The Lord make them an hundred times more, and that our eyes may see it, as Joab said to David about numbering of Israel, 2 Samuel 24:3, Jer. 10:25, Pour out thy fury upon the heathen that know thee not, and upon the families that call not on thy name. Heathens that know not God, and families that call not on his name, are the same sort of folks, and the same wrath of God hangs over them. Wrath overtakes all that have not found grace at this throne.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/robert-traill.html">Robert Traill</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Sermons Concerning the Throne of Grace</cite>, (1696) in The Works of Robert Traill, A.M. Minister of the Gospel in London (4 vols, Edinburgh: J. Ogle, 1810), 1: 155.</span></figcaption>

</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-baa8f1dc20" data-kw="">
<blockquote><p>This sin of not coming [to the throne of grace], is committed by delaying to come The call of God is, Let us come; the answer of many hearts is, Let us delay to come. Whence think you that these delays come? We have it daily to bewail before God and you, that a multitude will come together to hear, and do so day by day; yet all that can be said to them, from their childhood to their old age, never prevailed with many of them to spend one hour in serious treating at the throne of grace, with God in Christ, for the eternal salvation of their souls.

It is undeniable, that ye are but a pack of gross hypocrites, if you attend on the means of grace in the assemblies of saints, and yet have no particular personal errand to the throne of grace for your own Souls. The salvation of the soul is not carried on in a crowd. The grace of God must be particularly applied to you, and you must particularly apply it to yourselves, and yourselves to the throne of grace, if ever you be saved.

The fellowship of saints was never ordained for this end, to render personal applications to God needless; and it is grossly abused when it is so perverted. It is impossible, that a person can have any true fellowship with saints in any ordinance of God, unless he hath particular business at the throne of grace for himself. He hath indeed no true religion, whose all of religion is in company and in public.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/robert-traill.html">Robert Traill</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Sermons Concerning the Throne of Grace</cite>, (1696) in The Works of Robert Traill, A.M. Minister of the Gospel in London (4 vols, Edinburgh: J. Ogle, 1810), 1: 50-51.</span></figcaption>

c20.html&amp;via=5Solas" target="_blank" rel="noopener">Share on X</a><a class="perma" href="../quote/baa8f1dc20.html">Permalink</a><a class="src" href="https://reformedcovenanter.wordpress.com/2019/11/07/robert-traill-attendance-at-public-worship-without-private-worship-is-hypocrisy/" rel="noopener" target="_blank">Read it online · Reformed Covenanter</a></div>

<blockquote><p>Of the 150 Psalms in the Psalter, some six are commonly classified as “imprecatory” Psalms—the 55th, 59th, 69th, 79th, 109th and 137th. Many other Psalms contain “imprecatory” elements, namely, divinely inspired prayers for the destruction of certain wicked men, enemies of God. The Psalter is constantly being reproached because of the “imprecatory” Psalms. It is said that these Psalms breathe a savage spirit, that they are alien to the “spirit of Jesus,” that they are not suited to Christian devotion, and so forth.

These objections spring partly from a misunderstanding of the Psalms themselves. The objectors often regard them as mere human compositions. They see in them simply David’s private wrath against his personal enemies. But such is not the character of these Psalms. They are divinely inspired and they are directed against implacable enemies of God and of God’s kingdom. They are so cited in the New Testament (Psalm 69:25 and 109:8 quoted in Acts 1:20).

Nor are the “imprecatory” Psalms really contrary to the “spirit of Jesus” or the “spirit” of the New Testament. All that is found in them can be matched by statements of the New Testament, and none is more terrible than the words of Jesus Christ against those permanently identified with Satan’s kingdom. The objections also arise partly from a false idealism in religion, which regards Christianity as merely a matter of ideals. Christianity is not merely a matter of ideals; it is not even merely salvation; Christianity is divine redemption from an objective realm of evil—from the land of Egypt, from the house of bondage, from Satan’s kingdom.

Christianity involves divine judgment on sin and sinners as truly as it involves divine redemption for God’s people. The false notion that God is nothing but love is responsible for much of the opposition to these Psalms. The present writer recalls hearing a young woman, a member of a Psalm-singing church, say of Psalm 137: “I just HATE that Psalm!”

The most charitable explanation of this attitude toward a part of God’s holy Word is that this young woman really understood neither Psalm 137, nor the real character of Biblical religion as divine redemption from an objective realm of evil. She had no doubt been fed on a false religious idealism which thought of God as nothing but love, and left His justice entirely out of the picture.

Such is a very one-sided view of God. “Behold the goodness and severity of God” (Romans 11:22)—not only the goodness of God, but also the severity of God. The Psalms give the whole picture, not just one side. They portray not only God’s love and salvation, but His justice and retribution meted out to wicked men. Christ’s kingdom is not advanced without Satan’s kingdom being destroyed.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/johannes-g-vos.html">Johannes G. Vos</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Ashamed of the Tents of Shem? in Blue Banner Faith and Life</cite></span></figcaption>

</figure><figure class="quote" id="q-989f6f9a74" data-kw="">
<blockquote><p>But they like men have transgressed the covenant: there have they dealt treacherously against me.” (Hosea 6:7)

I told them by my prophets what I required of them by covenant, but I could not obtain it, they regarded not what I said. Like men; or, like Adam: some take it for a proper name, and so refer it unto the first man, and his breaking covenant; and, for aught I see, it may well enough refer to him, who forgot or slighted the threat, who judged of what he did by what it appeared, as a small matter; and so these forget and slight my threats, and judge of the place where, and the persons by whom, and the times when, sacrifices are to be offered as no material circumstances, and therefore do choose what places they please, and appoint what priest liketh them best to offer; or else transgress the covenant, as if it were the covenant of a man like themselves.

The covenant; the law of their God, which directed and encouraged their obedience, and which threatened their disobedience, and cursed it. There; in that very place, the good land, which by covenant I gave them, they have broken my covenant; or in the things in which they thought they kept covenant, in their sacrifices, and observing of feasts, in these things they transgress the covenant. Dealt treacherously against me; very frowardly, and with wilful resolutions perverted my law; their transgressing was a designed perfidiousness. I told them, Obedience, not sacrifice; they reply, Sacrifice, and stop there; they give no obedience, though they offer many sacrifices.</p></blockquote>

I told them by my prophets what I required of them by covenant, but I could not obtain it, they regarded not what I said. Like men; or, like Adam: some take it for a proper name, and so refer it unto the first man, and his breaking covenant; and, for aught I see, it may well enough refer to him, who forgot or slighted the threat, who judged of what he did by what it appeared, as a small matter; and so these forget and slight my threats, and judge of the place where, and the persons by whom, and the times when, sacrifices are to be offered as no material circumstances, and therefore do choose what places they please, and appoint what priest liketh them best to offer; or else transgress the covenant, as if it were the covenant of a man like themselves.

The covenant; the law of their God, which directed and encouraged their obedience, and which threatened their disobedience, and cursed it. There; in that very place, the good land, which by covenant I gave them, they have broken my covenant; or in the things in which they thought they kept covenant, in their sacrifices, and observing of feasts, in these things they transgress the covenant. Dealt treacherously against me; very frowardly, and with wilful resolutions perverted my law; their transgressing was a designed perfidiousness. I told them, Obedience, not sacrifice; they reply, Sacrifice, and stop there; they give no obedience, though they offer many sacrifices.”

s%3A%2F%2F5solasquotes.github.io%2Fquote%2F989f6f9a74.html&amp;via=5Solas" target="_blank" rel="noopener">Share on X</a><a class="perma" href="../quote/989f6f9a74.html">Permalink</a><a class="src" href="https://reformedcovenanter.wordpress.com/2020/07/11/matthew-poole-on-breaking-the-covenant-like-adam/" rel="noopener" target="_blank">Read it online · Reformed Covenanter</a></div>
</figure><figure class="quote" id="q-700f6f7af7" data-kw="">
<blockquote><p>Labour to preserve the holiness of God’s true Institutions; those things that are of divine consecration. For human consecration, alas what is it? But for the Sabbath, the Lord’s day, labour to keep it holy. We talk much of Holy days, this is so indeed.

The Lord’s Supper, that’s of Divine Institution, labour for a holy participation thereof. If any thing in the world would drive me to a Passion, this would, to hear men plead for the holiness of places, and live unholy Lives; to stand up for human, and not regard Divine institutions.

Oh that our King and Parliament might do something more than is done for keeping the Sabbath holy! oh that we could mourn for that we cannot mend! The Sacraments are Holy: it is the duty of Ministers to labour to keep them holy. The Lord’s Word that’s Holy. Ministry, and the Ordinances of Jesus Christ, labour to keep in High esteem. We ought to hear with the same reverence, as if Jesus Christ himself was here to preach. Live like walking Temples.</p></blockquote>

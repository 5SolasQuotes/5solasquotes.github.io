<blockquote><p>Crowe pays no attention at all to the historical debates,” – G.A. van den Brink . . Books 1600’s Walker, George – A Defense of the True Sense &amp; Meaning of the Words of the Holy Apostle, Rom. 4:3, 5, 9 in an Answer to Sundry Arguments Gathered from the Forenamed Scriptures by Mr. John Goodwin, together with a Reply to the Former Answer (1641) 56 pp. ToC Walker was a Westminster divine, who argues for Christ’s active righteousness being imputed in this work. Roborough, Henry – The Doctrine of Justification Cleared, by Animadversions on Mr. John Goodwin’s Animadversions Upon Mr. George Walker’s Defense of the True Sense of the Apostle, Rom. 4:3,5, etc. Together with an Examination of Both Parts of his Treatise of Justification: wherein the Imputation of Faith in a Proper Sense is Denied, &amp; the Imputation of Christ’s Righteousness, Active &amp; Passive, Affirmed, Against that Treatise (London: R.C., 1643) 221 pp. Roborough (d. 1649) was a non-voting scribe at the Westminster Assembly. John Goodwin was a prominent Arminian, though often considered a puritan. Roborough argues for Christ’s active righteousness being imputed in this work. See especially ‘Examination of Goodwin’s Conclusions’, ch. 5, ‘Wherein Scriptures are cleared, brought for the imputation of Christ’s active obedience with their true sense according to the judgment of the best expositors of the Protestant party’. Norton, John – A Discussion of that Great Point in Divinity, the Sufferings of Christ, &amp; the Question about his Righteousness-Active, Passive: &amp; the Imputation Thereof. Being an Answer to a Dialogue [of William Pynchon] entitled, The Meritorious Price of Redemption, Justification, etc. [1650], by John Norton, Teacher of the Church at Ipswich in New-England, who was Appointed to Draw up this Answer by the General Court (London, 1653) 270 pp. ToC Norton (1606-1663) was a puritan divine of England and New England. He argues for the imputation of Christ’s active obedience. Norton writes against William Pynchon (1590–1662), an influential New England settler who critiqued the puritan theology that surounded him and the nature of Christ’s satisfaction in an unique way in The Meritorious Price of Man’s Redemption… (1650; 1655). The book was burned on the Boston Common. The work argues that Christ’s obedience, rather than his punishment and suffering, was the price of atonement. Officials of the Massachusetts Bay Colony formally accused Pynchon of heresy and demanded that he retract its argument, which he did not. He moved back to England. The previously linked, later edition contains an appendix responding to Norton’s charges of heresy. . 2000’s McCormick, Micah – The Active Obedience of Jesus Christ PhD diss. (Southern Baptist Theological Seminary, 2010) 380 pp. Abstract: “Chapter 1 defines the doctrine, surveys previous literature, offers warrant for the work, and previews the argument of the work. In short, the thesis of this work is that the active obedience of Christ is a biblical doctrine. Chapter 2 presents a historical survey, tracing theologians from the early church up to the present time to see the development of the doctrine. Special attention is given to the Reformation and Post-Reformation eras, during which the doctrine received its primary development. Chapter 3 examines God’s original arrangement with Adam…. Chapter 4 examines human obedience after the Fall. Looking especially at the “do this and live” passages, this chapter argues that God requires perfect obedience from humans in order to gain eternal life. Chapter 5 traces the OT’s presentation of the need for a Messiah to come who would represent his people in perfect obedience… Chapter 6… Beginning with the Gospels and moving on to the rest of the NT, this chapter shows that Christ represented his people in perfect obedience throughout the whole course of his earthly mediation. Chapter 7 first offers a systematic formulation of the doctrine. This chapter then answers some of the major objections put to the doctrine of Christ’s active obedience, examining the views of opponents both ancient and contemporary. Chapter 8 summarizes the work…</p></blockquote>

<blockquote><p>By which righteousness of Christ we are justified XI. Since, moreover, a twofold righteousness is observed in Christ—an essential righteous, as much of the divine as of the human nature, with which he was born (Luke 1:35); and a righteousness procured or acquired during his life on earth—so that we may more easily understand by which righteousness of Christ we are justified, it must be maintained that: (1) certainly the whole Christ, and all his righteousness, is profitable to us for justification, because the whole Christ was given by God to the world, that whosoever believes in him should not perish, but have eternal life (John 3:16) and because he was not born for himself, and did not come into the world so that he might minister to himself, but to us, that he might give himself as the price of redemption for many (Matt. 20:28; Eph. 5:2, 25–26), although it does not all profit us in one and the same way. In particular, (2) his essential righteousness, as much the divine as the human, is by no means profitable for justification as our [Greek], dikaioma, righteousness, on account of which we are justified, because not only does he require it for himself, but because it would also make superfluous and void a justification through a procured righteousness. For if we were to be absolved on account of the righteousness of the divine person, which is of infinite value, or even on account of the righteousness of the human nature, as our dikaioma, why would the righteousness of his death or of his life be required? Still, this essential righteousness also is profitable as a prerequisite in the person of the Mediator, apart from which he could not provide the dikaioma for us (2 Cor. 5:21; Isa. 53:11). So (3) only the procured righteousness of Christ provides the dikaioma on account of which we are justified by God. But since again a twofold procured righteousness of Christ is observed, one active, whereby he kept the law exactly (Matt. 3:15; 5:17; Gal. 4:4), and the other passive, whereby he suffered for the law that we violated (Rom. 4:25; Phil. 2:8), it must be maintained that (4) the active righteousness alone is insufficient for procuring justification, because a dikaioma was demanded for sinners, who had earned death (Gen. 2:17; Rom. 5:12; 6:23), which from the divine decree, the threat of the law, and God’s natural hatred of sin, was necessary to be suffered (Rom. 1:32; 2 Thess. 1:6). And also (5) he did not expend on our behalf only his passive righteousness, because it is not only his passive righteousness that is referred to our salvation throughout Scripture (Jer. 23:6; 1 Cor. 1:30; Rom. 5:19; Phil. 3:9), but it also regards the fullness of grace that he was expended for us in the whole of what he is (Rom. 8:32). Hence, (6) both kinds of his righteousness join into our one dikaioma, whereby he satisfied for the sins of those to be justified (Rom. 8:3–4), such that accordingly, (7) this twofold righteousness is not separated, indeed not even distinguished in such a way that to the passive righteousness alone is attributed the efficacy of making satisfaction for our guilt, and thus of delivering us from evils, and to the active righteousness alone is attributed the power of meriting for us the right of eternal life. For not only do satisfying and meriting in this matter not differ really, but neither should the passive be stripped of the dignity of meriting, nor the active of the dignity of satisfying, as we have demonstrated elsewhere (1.5.18 §XIV; cf. §XVII, below).</p></blockquote>

<div class="actions"><button class="copy" data-copy="“By which righteousness of Christ we are justified XI. Since, moreover, a twofold righteousness is observed in Christ—an essential righteous, as much of the divine as of the human nature, with which he was born (Luke 1:35); and a righteousness procured or acquired during his life on earth—so that we may more easily understand by which righteousness of Christ we are justified, it must be maintained that: (1) certainly the whole Christ, and all his righteousness, is profitable to us for justification, because the whole Christ was given by God to the world, that whosoever believes in him should not perish, but have eternal life (John 3:16) and because he was not born for himself, and did not come into the world so that he might minister to himself, but to us, that he might give himself as the price of redemption for many (Matt. 20:28; Eph. 5:2, 25–26), although it does not all profit us in one and the same way. In particular, (2) his essential righteousness, as much the divine as the human, is by no means profitable for justification as our [Greek], dikaioma, righteousness, on account of which we are justified, because not only does he require it for himself, but because it would also make superfluous and void a justification through a procured righteousness. For if we were to be absolved on account of the righteousness of the divine person, which is of infinite value, or even on account of the righteousness of the human nature, as our dikaioma, why would the righteousness of his death or of his life be required? Still, this essential righteousness also is profitable as a prerequisite in the person of the Mediator, apart from which he could not provide the dikaioma for us (2 Cor. 5:21; Isa. 53:11). So (3) only the procured righteousness of Christ provides the dikaioma on account of which we are justified by God. But since again a twofold procured righteousness of Christ is observed, one active, whereby he kept the law exactly (Matt. 3:15; 5:17; Gal. 4:4), and the other passive, whereby he suffered for the law that we violated (Rom. 4:25; Phil. 2:8), it must be maintained that (4) the active righteousness alone is insufficient for procuring justification, because a dikaioma was demanded for sinners, who had earned death (Gen. 2:17; Rom. 5:12; 6:23), which from the divine decree, the threat of the law, and God’s natural hatred of sin, was necessary to be suffered (Rom. 1:32; 2 Thess. 1:6). And also (5) he did not expend on our behalf only his passive righteousness, because it is not only his passive righteousness that is referred to our salvation throughout Scripture (Jer. 23:6; 1 Cor. 1:30; Rom. 5:19; Phil. 3:9), but it also regards the fullness of grace that he was expended for us in the whole of what he is (Rom. 8:32). Hence, (6) both kinds of his righteousness join into our one dikaioma, whereby he satisfied for the sins of those to be justified (Rom. 8:3–4), such that accordingly, (7) this twofold righteousness is not separated, indeed not even distinguished in such a way that to the passive righteousness alone is attributed the efficacy of making satisfaction for our guilt, and thus of delivering us from evils, and to the active righteousness alone is attributed the power of meriting for us the right of eternal life. For not only do satisfying and meriting in this matter not differ really, but neither should the passive be stripped of the dignity of meriting, nor the active of the dignity of satisfying, as we have demonstrated elsewhere (1.5.18 §XIV; cf. §XVII, below).”

— Petrus van Mastricht, Theoretical Practical Theology (RHB), vol. 5, ch. 6, the Justification of those to be Redeemed">Copy</button><a class="share" href="https://x.com/intent/post?text=%E2%80%9CBy+which+righteousness+of+Christ+we+are+justified+XI.+Since%2C+moreover%2C+a+twofold+righteousness+is+observed+in+Christ%E2%80%94an+essential+righteous%2C+as+much+of+the+divine+as+of+the+human+nature%2C+with+which+he+was+born+%28Luke+1%3A35%29%3B+and+a+righteousness+procured+or+acquired+during+his+life+on+earth%E2%80%94so+that+we+may+more+easily+understand+by+which+righteousness+of+Christ+we+are+justified%2C+it+must+be+maintained+that%3A+%281%29+certainly+the+whole+Christ%2C+and+all+his+righteousness%2C+is+profitable+to+us+for+justification%2C+because+the+whole+Christ+was+given+by+God+to+the+world%2C+that+whosoever+believes+in+him+should+not+perish%2C+but+have+eternal+life+%28John+3%3A16%29+and+because+he+was+not+born+for+himself%2C+and+did+not+come+into+the+world+so+that+he+might+minister+to+himself%2C+but+to+us%2C+that+he+might+give+himself+as+the+price+of+redemption+for+many+%28Matt.+20%3A28%3B+Eph.+5%3A2%2C+25%E2%80%9326%29%2C+although+it+does+not+all+profit+us+in+one+and+the+same+way.+In+particular%2C+%282%29+his+essential+righteousness%2C+as+much+the+divine+as+the+human%2C+is+by+no+means+profitable+for+justification+as+our+%5BGreek%5D%2C+dikaioma%2C+righteousness%2C+on+account+of+which+we+are+justified%2C+because+not+only+does+he+require+it+for+himself%2C+but+because+it+would+also+make+superfluous+and+void+a+justification+through+a+procured+righteousness.+For+if+we+were+to+be+absolved+on+account+of+the+righteousness+of+the+divine+person%2C+which+is+of+infinite+value%2C+or+even+on+account+of+the+righteousness+of+the+human+nature%2C+as+our+dikaioma%2C+why+would+the+righteousness+of+his+death+or+of+his+life+be+required%3F+Still%2C+this+essential+righteousness+also+is+profitable+as+a+prerequisite+in+the+person+of+the+Mediator%2C+apart+from+which+he+could+not+provide+the+dikaioma+for+us+%282+Cor.+5%3A21%3B+Isa.+53%3A11%29.+So+%283%29+only+the+procured+righteousness+of+Christ+provides+the+dikaioma+on+account+of+which+we+are+justified+by+God.+But+since+again+a+twofold+procured+righteousness+of+Christ+is+observed%2C+one+active%2C+whereby+he+kept+the+law+exactly+%28Matt.+3%3A15%3B+5%3A17%3B+Gal.+4%3A4%29%2C+and+the+other+passive%2C+whereby+he+suffered+for+the+law+that+we+violated+%28Rom.+4%3A25%3B+Phil.+2%3A8%29%2C+it+must+be+maintained+that+%284%29+the+active+righteousness+alone+is+insufficient+for+procuring+justification%2C+because+a+dikaioma+was+demanded+for+sinners%2C+who+had+earned+death+%28Gen.+2%3A17%3B+Rom.+5%3A12%3B+6%3A23%29%2C+which+from+the+divine+decree%2C+the+threat+of+the+law%2C+and+God%E2%80%99s+natural+hatred+of+sin%2C+was+necessary+to+be+suffered+%28Rom.+1%3A32%3B+2+Thess.+1%3A6%29.+And+also+%285%29+he+did+not+expend+on+our+behalf+only+his+passive+righteousness%2C+because+it+is+not+only+his+passive+righteousness+that+is+referred+to+our+salvation+throughout+Scripture+%28Jer.+23%3A6%3B+1+Cor.+1%3A30%3B+Rom.+5%3A19%3B+Phil.+3%3A9%29%2C+but+it+also+regards+the+fullness+of+grace+that+he+was+expended+for+us+in+the+whole+of+what+he+is+%28Rom.+8%3A32%29.+Hence%2C+%286%29+both+kinds+of+his+righteousness+join+into+our+one+dikaioma%2C+whereby+he+satisfied+for+the+sins+of+those+to+be+justified+%28Rom.+8%3A3%E2%80%934%29%2C+such+that+accordingly%2C+%287%29+this+twofold+righteousness+is+not+separated%2C+indeed+not+even+distinguished+in+such+a+way+that+to+the+passive+righteousness+alone+is+attributed+the+efficacy+of+making+satisfaction+for+our+guilt%2C+and+thus+of+delivering+us+from+evils%2C+and+to+the+active+righteousness+alone+is+attributed+the+power+of+meriting+for+us+the+right+of+eternal+life.+For+not+only+do+satisfying+and+meriting+in+this+matter+not+differ+really%2C+but+neither+should+the+passive+be+stripped+of+the+dignity+of+meriting%2C+nor+the+active+of+the+dignity+of+satisfying%2C+as+we+have+demonstrated+elsewhere+%281.5.18+% <blockquote><p>Howbeit this exposition of the term justification seems faulty as well as the former: and that two ways: … 2. With them all, it presumes in the matter of justification a needles twofold act, the not-imputation of sin, and the imputation of righteousness, as two distinct things; whereas not to impute sin in consideration of satisfaction made for it, is no other thing than to impute righteousness to the party therein concerned. Since that a man cannot be deemed or doomed guiltless or faultless, but he must of necessity be deemed or doomed just or righteous; there being no medium or middle state between a delinquent or a guilty person and one guiltless or just. He that can prove himself no delinquent, but free from fault, must of necessity be justified, acquitted and assoiled as just. See Dt. 25:1. If nothing but sin can make a man unjust, then surely the utter absence of sin must necessarily make a man just. See Paul’s plea, Acts 25:8.</p></blockquote>

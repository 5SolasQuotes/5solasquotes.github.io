<main class="wrap"><figure class="quote" id="q-29cde56673" data-kw="">
<blockquote><p>117. A significant part of that dominion and subjection [Gen. 1:28] is that humans could feed not only on herbs and tree fruits, but also on animals for food. After the Pythagoreans and Hebrews, other ancient and modern Christians considered this unlawful, deceived by παρερμηνείᾳ [a misinterpretation] of Moses’ words, which when correctly explained declare the opposite. For God speaks thus [Gen. 1:29-30]: “Behold, I have given you every herb bearing seed, which is upon the face of the earth, and every tree which is in it, the fruit of the tree bearing seed shall be yours for food; ולכל חית הארץ [and for all living things of the earth], or together with all animals of the earth, indeed and every bird of יeaven and every creeping thing upon the earth, with every green herb of the earth for food.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/johann-h-heidegger.html">Johann H. Heidegger</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Body of Christian Theology tr. by AI by Onku (Zurich: Bodmer, 1700), vol. 1, locus 6, ‘On the Creation of the World’, sect. 117</cite>, pp. 235-36</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/man/image-of-god.html">Image of God</a></span></div>

<blockquote><p>John Owen (1616–83), a prominent English Reformed theologian, emphasized the importance of affections in Christian life… Affections, as opposed to turbulent emotions, are regarded as a more delicate inclination and disposition of the soul… Owen’s theology is built in a theocentric way, with a particular emphasis on the experiential and pastoral aspects. This research investigates how Owen used the concept of affections to construct his anthroposensitive theology.</p></blockquote>

</figure><figure class="quote" id="q-a789796766" data-kw="">
<blockquote><p>The image of God which we have spoken about neither completely perished through sin, nor completely survived from sin. Therefore it remains in some measure (Gen. 9:6; James 3:9; 1 Cor. 11:7, where without doubt the topic is not the past state, but the current one). It remains, I say, to the extent that it consists: (1) in the very nature of man, of the body and soul. (2) In the natural faculties of the soul, in the intellect and will. (3) In certain gifts of the intellect and will, insofar as among the worst is still seen some use of reason, and also some propensity to good, even moral good (Rom. 1:19; 2:15; 1 Cor. 5:1). Furthermore, (4) in at least some remnants of original dominion (Gen. 7:2). God willed all these bits of his own image to survive in us from the fall, first so that they may be witnesses of his own most undeserved goodness toward us…</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/petrus-van-mastricht.html">Petrus van Mastricht</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Theoretical Pracgtical Theology (RHB), Bk. 3, ch. 9, section 39</cite></span></figcaption>

</figure><figure class="quote" id="q-1b7a7012b6" data-kw="">
<blockquote><p>[3.] If parents, by refusing to comply with the desire of their children [in desiring to marry someone], plainly, in the judgment of the wisest of men, obstruct their happiness, and the glory of God herein. Or, if they have no reason for their not complying, or the reason given is contrary to the laws of God, or the common sense of all impartial judges; especially if the affair took its first rise from them, and afterwards they changed their mind, without sufficient ground. This, without doubt, lessens, or it may be so circumstanced, that it wholly takes away the charge of sin in the child, in acting contrary to the will of his parents, and fastens the guilt on them.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/thomas-ridgley.html">Thomas Ridgley</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Body of Divinity (1731; 1814), vol. 3, pp. 522-23, commenting on Westminster’s Larger Catechism</cite></span></figcaption>

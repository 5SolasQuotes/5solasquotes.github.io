<main class="wrap"><figure class="quote" id="q-ef8c84ca9f" data-kw="">
<blockquote><p>There are then a great number of truths, both of faith and of morality, which seem contradictory, and which all hold good together in a wonderful system. The source of all heresies is the exclusion of some of these truths, and the source of all the objections which the heretics make against us is the ignorance of some of our truths. And it generally happens that, unable to conceive the connection of two opposite truths, and believing that the admission of one involves the exclusion of the other, they adhere to the one, exclude the other, and think of us as opposed to them. Now exclusion is the cause of their heresy; and ignorance that we hold the other truth causes their objections.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/blaise-pascal.html">Blaise Pascal</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Pensees, section 14, Appendix: ‘Polemical Fragments’ in Pensees – The Provincial Letters in The Modern Library (d. 1662; NY: Modern Library, 1941)</cite>, p. 305</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/the-christian-life/obedience-and-profession.html">Obedience and Profession</a></span></div>

</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-01b488a996" data-kw="">
<blockquote><p>Of the premises ye may gather some definition of faith, as namely that ‘love is a holy endeavor for the preservation of that which is beloved, whether God or man, with an earnest desire to be united unto it.’ For love is that bond, as the apostle speaks, whereby the members of the body are knit together. And it serves also in some sort and place to unite us unto God and Christ, notwithstanding that the communion of Christ, the head of his body the Church, be principally to be ascribed unto faith.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/robert-rollock.html">Robert Rollock</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Select Works of Robert Rollock ed. Gunn (d. 1599; Edinburgh: Wodrow Society, 1849), vol. 1, A Treatise of God’s Effectual Calling, ch. 33, ‘Of Charity or Love’</cite>, pp. 236-37</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/the-christian-life/obedience-and-profession.html">Obedience and Profession</a></span><span class="t"><a href="../topics/repentance-and-conversion/repentance-and-faith.html">Repentance and Faith</a></span></div>

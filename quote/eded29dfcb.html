<main class="wrap"><figure class="quote" id="q-eded29dfcb" data-kw="">
<blockquote><p>The Judicial Law is entirely abrogated so far as it concerns the distinction of Jews from the Gentiles (Eph. 2:14-15) and the typical signification of the kingdom of Christ (Col. 2:17; Heb. 10:1). However, as far as it concerns a form of civil government, it is abrogated in some particular aspects. For whatever was a particular proper right, such as peculiarly concerned the Jews, of which sort was the law concerning the office of the Levites, as another concerning inheritances not being transferred from one tribe to another, all of this kind have ceased. But insofar as it concerned common right, enacted according to the law of nature for all men together, of which sort are the laws concerning the punishments of crimes, these same all remain. The reason is that it enters into the order of the Moral Law and is thus perpetual. It was prescribed to the Jews, not as Jews, as a peculiar people admitted into Covenant, but as men, by the Law of Nature, subject with the other nations. If the same conclusion is recognized by the rule of common law from other [countries’] legislators, or it is discovered to be framed in view of the precepts of the Decalogue: it is sanctioned.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/johann-heinrich-alting.html">Johann Heinrich Alting</a></span><span class="wk"><span class="lbl">Work:</span> <cite>‘7th Place: of the Law of God’ in Common Places in The Scriptural Theology of Heidelberg</cite>, vol. 1, p. 112, trans. Adam Brink &amp; Travis Fentiman</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/civil-government-and-society/natural-law-and-civil-law.html">Natural Law and Civil Law</a></span></div>

</figure><figure class="quote" id="q-384ac9342b" data-kw="">
<blockquote><p>32. They [presbyterians] hold (I believe with warrant of God’s Word) if the king refuse to reform religion, the inferior judges, and assembly of godly pastors and other church-officers may reform; if the king will not kiss the Son, and do his duty in purging the House of the Lord, may not Elijah and the people do their duty and cast out Baal’s priests [1 Kings 18:19-24, 30, 37-40]. Reformation of religion is a personal act that belongs to all, even to any one private person according to his place.

33. They may swear a covenant without the king, if he refuse, and build the Lord’s house (2 Chron. 15:9) themselves, and relieve and defend one another when they are oppressed. For my acts and duties of defending myself and the oppressed do not tie my conscience conditionally, so the king consent, but absolutely, as all duties of the law of nature do (Jer. 22:3; Prov. 24:11; Isa. 58:6; 1:17).

34. The Popish Prelate [John Maxwell] condemns our reformation because it was done against the will of our popish queen. This shows what estimation he has of popery and how he abhors protestant religion.</p></blockquote>

"noopener" target="_blank">Read it online · Reformed Books Online</a></div>
</figure><figure class="quote" id="q-9e2bfe81dd" data-kw="">
<blockquote><p>We indeed know that repudiation [divorce], properly speaking, had never been allowed by God; for though it was not punished under the [Mosaic] Law, yet it was not permitted. It was the same as with a magistrate, who is constrained to bear many things which he does not approve; for we cannot so deal with mankind as to restrain all vices. It is indeed desirable, that no vice should be tolerated; but we must have a regard to what is possible. Hence Moses has specified no punishment, according to the heinousness of the crime, if one repudiated his wife; and yet it was never permitted.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/john-calvin.html">John Calvin</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Commentary on Malachi</cite>, 2:16</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/civil-government-and-society/natural-law-and-civil-law.html">Natural Law and Civil Law</a></span></div>

</figure><figure class="quote" id="q-d118d349d4" data-kw="">
<blockquote><p>Thus human laws cannot bind the conscience: It is God only, 1 John 3:21, who, as He is greater than the conscience, so has power to bind or loose it: Isa. 31:22. It is He that is the only Lawgiver to the conscience: Jam. 4:12. Princes and Churches may make laws for the outward man, but they can no more bind the heart than they can make it; … The laws of men therefore do not, ought not, cannot bind your conscience, as of themselves; but, if they be just, they bind you in conscience to obedience: … As then we are wont to say in relation of our actions to the laws of God, that some things are forbidden because they are sinful, and some things are sinful because they are forbidden, so it holds also in the laws of men: some things are forbidden because they are justly offensive and some other things are only therefore offensive because they are forbidden; In the former of these we must yield our careful obedience out of respect even to the duty itself; in the latter, out of respect to the will of the lawgiver; yet so, as that if our own important occasions shall enforce us to transgress a penal law, without any affront of authority or scandal to others, our submission to the penalty frees us from a sinful disobedience.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/joseph-hall.html">Joseph Hall</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Cases of Conscience Practically Resolved Containing a Decision of the Principal Cases of Conscience of Daily Concernment &amp; Continual Use Amongst Men: Very Necessary for their Information &amp; Direction in These Evil Times</cite>, 3rd Decade, Case 6, ‘Whether the Laws of Men do Bind the Conscience, &amp; How Far we are Tied to Their Obedience?’ in Cases of Conscience Practically Resolved Containing a Decision of the Principal Cases of Conscience of Daily Concernment &amp; Continual Use Amongst Men: Very Necessary for their Information &amp; Direction in These Evil Times (London, 1654), pp. 211-13, 218-9</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/civil-government-and-society/natural-law-and-civil-law.html">Natural Law and Civil Law</a></span></div>

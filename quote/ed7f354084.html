<main class="wrap"><figure class="quote" id="q-ed7f354084" data-kw="acts of faith knowledge assent trust">
<blockquote><p>As to the acts, they are explained by theologians in different ways—some making more, others fewer. Some make only one, namely assent or persuasion. Others acknowledge only two—knowledge and assent. Others add a third (to wit, trust). Others a fourth also (to wit, confidence or the acquiescence of the will). These different opinions do not so much change the nature of faith as unfold it in different ways.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/francis-turretin.html">Francis Turretin</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Institutes of Elenctic Theology</cite>, 15.8.1</span></figcaption>

<main class="wrap"><figure class="quote" id="q-939396c332" data-kw="Infallibility of the church">
<blockquote><p>When they deny that the Church can err, their end and meaning are to this effect: Since the Church is governed by the Spirit of God, she can walk safely without the word; in whatever direction she moves, she cannot think or speak anything but the truth, and hence, if she determines anything without or beside the word of God, it must be regarded in no other light than if it were a divine oracle. If we grant the first point--viz. that the Church cannot err in things necessary to salvation--our meaning is, that she cannot err, because she has altogether discarded her own wisdom, and submits to the teaching of the Holy Spirit through the word of God. Here then is the difference. They place the authority of the Church without the word of God; we annex it to the word, and allow it not to be separated from it.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/john-calvin.html">John Calvin</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Institutes of the Christian Religion</cite>, 4.8.13</span></figcaption>

</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-25d85261d2" data-kw="Infallible rule">
<blockquote><p>Although infallibility is not given by God to the church, it cannot on this account be said that God was wanting in things necessary to her, because it is not necessary to have a supreme and infallible tribunal among men upon whose decrees and responses our faith should be suspended, since it is sufficient for her to have an infallible rule of faith and practice in the Scriptures, which as long as she observes, she will not wander from the right track.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/francis-turretin.html">Francis Turretin</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Institutes of Elenctic Theology</cite>, 18.11.32</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/the-church/infallibility-of-the-church.html">Infallibility of the Church</a> › <a href="../topics/the-church/infallibility-of-the-church/the-church-can-err.html">The church can err</a></span><span class="t"><a href="../topics/rome/the-church.html">Rome: The Church</a> › <a href="../topics/rome/the-church/infallibility.html">Infallibility</a></span><span class="t"><a href="../topics/holy-scripture/sufficiency.html">Sufficiency</a> › <a href="../topics/holy-scripture/sufficiency/scripture-alone.html">Scripture alone</a></span></div>

</figure><figure class="quote" id="q-c7a26c5231" data-kw="church can err">
<blockquote><p>Is the church infallible or can it err about faith? The former we deny; the latter we affirm against the Romanists. The question concerning the infallibility of the church is the most agitated of all which lie between us and Romanists about the church and of so great importance that the papacy seems to rest upon it as its principal fulcrum. For no other reason do they fight so sharply for the infallibility of the church than that they may attach this privilege to their own, which they hold to be the only true church.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/francis-turretin.html">Francis Turretin</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Institutes of Elenctic Theology</cite>, 18.11.1</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/the-church/infallibility-of-the-church.html">Infallibility of the Church</a> › <a href="../topics/the-church/infallibility-of-the-church/against-rome.html">Against Rome</a></span><span class="t"><a href="../topics/the-church/infallibility-of-the-church.html">Infallibility of the Church</a> › <a href="../topics/the-church/infallibility-of-the-church/the-church-can-err.html">The church can err</a></span></div>

— Francis Turretin, Institutes of Elenctic Theology, 18.11.1">Copy</button><a class="share" href="https://x.com/intent/post?text=%E2%80%9CIs%20the%20church%20infallible%20or%20can%20it%20err%20about%20faith%3F%20The%20former%20we%20deny%3B%20the%20latter%20we%20affirm%20against%20the%20Romanists.%20The%20question%20concerning%20the%20infallibility%20of%20the%20church%20is%20the%20most%20agitated%20of%20all%20which%20lie%20between%20us%20and%20Romanists%20about%20the%20church%20and%20of%20so%20great%20importance%20that%20the%20papacy%20seems%20to%20rest%20upon%20it%20as%20its%20principal%20fulcrum.%20For%20no%20other%20reason%20do%20they%20fight%20so%20sharply%20for%20the%20infallibility%20of%20the%20church%20than%20that%20they%20may%20attach%20this%20privilege%20to%20their%20own%2C%20which%20they%20hold%20to%20be%20the%20only%20true%20church.%E2%80%9D%0A%0A%E2%80%94%20Francis%20Turretin%2C%20Institutes%20of%20Elenctic%20Theology%2C%2018.11.1&amp;url=https%3A%2F%2F5solasquotes.github.io%2Fquote%2Fc7a26c5231.html&amp;via=5Solas" target="_blank" rel="noopener">Share on X</a><a class="perma" href="../quote/c7a26c5231.html">Permalink</a><span class="src none">No free online copy linked</span></div>
</figure><figure class="quote" id="q-d931506157" data-kw="Infallibility of the church">
<blockquote><p>For if the church ought to be infallible, the Holy Spirit would undoubtedly somewhere have told believers of it, as of a thing of the greatest importance to confirm the faith of the pious and to guard them against all seductions. Otherwise he would appear to have been wanting in a thing the most necessary of all and which it was of the greatest moment for the church to know. But nowhere is mention made of this privilege having been given to any certain church; for it will be shown hereafter that the many passages adduced by our opponents to prove this thing do not prove it. So far from its being said that this was granted to the Roman church (as ought to have been said by all means, if any such thing belonged to it), on the contrary Paul earnestly admonishes it of the danger of defection and of their impending fall: “Because of unbelief they were broken off, and thou standest by faith. Be not highminded, but fear: For if God spared not the natural branches, take heed lest he also spare not thee” (Rom. 11:20, 21).</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/francis-turretin.html">Francis Turretin</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Institutes of Elenctic Theology</cite>, 18.11.10</span></figcaption>

</figure><figure class="quote" id="q-1aa6efdfbb" data-kw="Pope judge in own cause">
<blockquote><p>It is unjust that he who is the subject of the controversy should be the judge of the controversy; and I am in greater doubt of the pope’s authority than of the sense of this passage. There is need, therefore, of some other and more impartial judge. For who could say this was a legitimate interpretation;— since the pope says that infallibility is promised to him in this text, therefore he is infallible? Surely he needs some greater authority and testimony than his own word to prove that such a promise hath been made to him. Besides, the papists themselves acknowledge, that the pope may not only err, but even be a heretic, and so completely overturn this interpretation of the passage. Finally, councils, fathers, popes, are men; and scripture testifies that all men are deceitful.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/william-whitaker.html">William Whitaker</a></span><span class="wk"><span class="lbl">Work:</span> <cite>A Disputation on Holy Scripture</cite>, Question 5, ch. 8</span></figcaption>

<main class="wrap"><figure class="quote" id="q-f1ee7b8ac1" data-kw="">
<blockquote><p>Not by putting this wicked hatred into them, which is not consistent either with the holiness of God’s nature, or with the truth of His word, and which was altogether unnecessary, because they had that and all other wickedness in them by nature; but partly by withdrawing the common gifts and operations of the his Spirit, and all the restraints and hindrances to it, and wholly leaving them to their own mistakes, and passions, and corrupt affections, which of their own accord were ready to take that course; and partly, by directing and governing that hatred, which was wholly in and from themselves, so as it should fall upon the Israelites rather than upon other people.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/matthew-poole.html">Matthew Poole</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Annotations on Psalm 105:25, “He turned their heart to hate his people, to deal subtilly with his servants.”</cite></span></figcaption>
<div class="meta"><span class="t"><a href="../topics/effectual-calling/common-grace.html">Common Grace</a></span></div>

<blockquote><p>The second sort of divines (Contra-Remonstrants) [that is, those against the Arminians] distinguish the sufficiency and efficiency of Christ’s death. In respect of the worth and greatness of the price, He died for all men: because it was sufficient for the redemption of every man in the world if they did repent and believe; and God might, without impeachment of justice, have offered salvation to every man in the world had it been his pleasure. In the efficiency, as every man or any man has fruit by the death of Christ, so Christ died for him. But this is not of one kind: some fruit is common to every man; for as Christ is lord of all things in heaven and earth, even the earthly blessings which infidels enjoy may be termed fruits of Christ’s death. Others proper to the members of the visible Church, and common to them, as to be called by the word, enjoy the ordinances of grace, live under the covenant, partake of some graces that come from Christ, which, through their fault, be not saving; and in this sense Christ died for all that be under the covenant. But other fruits of Christ’s death, according to the will of God and intention of Christ as Mediator, be peculiar to the sheep of Christ, his brethren, them that be given unto him of the Father, as faith unfeigned, regeneration, pardon of sin, adoption, etc.; and so they hold Christ died efficiently for his people only, in this sense,–namely, so as to bring them effectually to faith, grace, and glory.</p></blockquote>

</figure><figure class="quote" id="q-0d7bed3c60" data-kw="">
<blockquote><p>First, I say, let us view the love of a God of love, in the different kinds of it. … 2, He has a love, not only of benevolence, but of beneficence; He not only wishes you well, but does well unto you. O Sirs! many a good turn has He done you, particularly you who are members of the visible church; He gives you line upon line, precept upon precept; He makes you to hear the joyful sound, the voice of the turtle; many a minister has He sent you; many an offer of Christ, and of life through Him, has He made to you; many a time has He knocked at thy door, by word, by conscience, and the motions and whispers of his Spirit; so that He may say to us, as He did of his vineyard, Isa. 5:4, “What could have been done more for them, that I have not done?” And because of your obstinacy in unbelief and sin, He may challenge you as he did Israel, and say, Micah 6:3, “O my people, what have I done unto thee, and wherein have I wearied thee? testify against me. Was I ever a barren wilderness, or a land of darkness?” Thus, I say, God’s love of benevolence and beneficence is, in some respects, extended unto all.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/ebenezer-erskine.html">Ebenezer Erskine</a></span><span class="wk"><span class="lbl">Work:</span> <cite>‘God in Christ, A God of Love’, a sermon on 1 Jn. 4:16, in The Whole Works of the late Rev. Ebenezer Erskine</cite>, vol. 1, pp. 280-81</span></figcaption>

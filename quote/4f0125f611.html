<main class="wrap"><figure class="quote" id="q-4f0125f611" data-kw="">
<blockquote><p>All I mean to infer from what I have said is, that though councils, otherwise pious and holy, were governed by the Holy Spirit, he yet allowed them to share the lot of humanity, lest we should confide too much in men.</p></blockquote>

</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-584b7f205d" data-kw="See of Peter Vicar of Christ">
<blockquote><p>To fix down Christ and the Holy Spirit and the Church to a particular spot, so that every one who presides in it, should he be a devil, must still be deemed vicegerent of Christ, and the head of the Church, because that spot was formerly the See of Peter, is not only impious and insulting to Christ, but absurd and contrary to common sense. … The see which they occupy, therefore, no more makes them the vicars of Christ, than it makes an idol to become God, when it is placed in the temple of God (2 Thess. 2:4).</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/john-calvin.html">John Calvin</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Institutes of the Christian Religion</cite>, 4.7.29</span></figcaption>

</figure><figure class="quote" id="q-ff2a372682" data-kw="">
<blockquote><p>For it is certain that many Roman pontiffs have erred, even when teaching ex cathedra, that is, determining controversies … Then who, I pray you, will be the supreme judge of the church, when the supreme pontiff hath fallen into heresy? Is he a fit person to be the supreme judge in religion, and one in whose judgment we should acquiesce, who may be, and is a heretic, as the very papists themselves confess? Surely, never. The supreme judge of all controversies must be such a one as can neither err nor prove a heretic: and such is Christ himself, that true High Priest, and the sacred scripture.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/william-whitaker.html">William Whitaker</a></span><span class="wk"><span class="lbl">Work:</span> <cite>A Disputation on Holy Scripture</cite>, q. 5, ch. 5</span></figcaption>

</figure><figure class="quote" id="q-f40671079e" data-kw="Councils and the pope">
<blockquote><p>Although the Levitical high priest had the right to convoke councils and to gain for them infallible authority, it does not follow that the same belongs to the Roman pontiff, because no other besides Christ succeeded the ancient high priest (Heb. 7, 8, 9). Besides, the right of extraordinary conventions was with the supreme magistrate (as we have said) and if they had any authority, that flowed entirely from the word, not from the pope.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/francis-turretin.html">Francis Turretin</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Institutes of Elenctic Theology</cite>, 18.33.17</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/church-government-and-the-ministry/synods-and-assemblies.html">Synods and Assemblies</a> › <a href="../topics/church-government-and-the-ministry/synods-and-assemblies/authority-of-synods.html">Authority of synods</a></span><span class="t"><a href="../topics/rome/the-papacy.html">Rome: The Papacy</a> › <a href="../topics/rome/the-papacy/papal-supremacy.html">Papal supremacy</a></span></div>
<div class="actions"><button class="copy" data-copy="“Although the Levitical high priest had the right to convoke councils and to gain for them infallible authority, it does not follow that the same belongs to the Roman pontiff, because no other besides Christ succeeded the ancient high priest (Heb. 7, 8, 9). Besides, the right of extraordinary conventions was with the supreme magistrate (as we have said) and if they had any authority, that flowed entirely from the word, not from the pope.”

— Francis Turretin, Institutes of Elenctic Theology, 18.33.17">Copy</button><a class="share" href="https://x.com/intent/post?text=%E2%80%9CAlthough+the+Levitical+high+priest+had+the+right+to+convoke+councils+and+to+gain+for+them+infallible+authority%2C+it+does+not+follow+that+the+same+belongs+to+the+Roman+pontiff%2C+because+no+other+besides+Christ+succeeded+the+ancient+high+priest+%28Heb.+7%2C+8%2C+9%29.+Besides%2C+the+right+of+extraordinary+conventions+was+with+the+supreme+magistrate+%28as+we+have+said%29+and+if+they+had+any+authority%2C+that+flowed+entirely+from+the+word%2C+not+from+the+pope.%E2%80%9D%0A%0A%E2%80%94+Francis+Turretin%2C+Institutes+of+Elenctic+Theology%2C+18.33.17&amp;url=https%3A%2F%2F5solasquotes.github.io%2Fquote%2Ff40671079e.html&amp;via=5Solas" target="_blank" rel="noopener">Share on X</a><a class="perma" href="../quote/f40671079e.html">Permalink</a><span class="src none">No free online copy linked</span></div>
</figure><figure class="quote" id="q-dc981ba28d" data-kw="">
<blockquote><p>We deny that the pope was or can be said to be the successor of Peter, as they pretend. The reasons are: first, if he is his successor, this will be either with respect to the common and ordinary ministry of preaching the word, administering the sacraments and exercising discipline; or with respect to the special and extraordinary work of the apostleship. And yet in the former sense, succession does not belong to anyone in particular, but to all true ministers of Christ and pastors of the church in general, who on this account are everywhere called by the fathers “successors of the divine apostles” (diadochoi tōn theiōn apostolōn). While in the latter sense, no one could succeed the apostles because their office was temporary and extraordinary (to lay the foundations of the Christian church) and therefore did not admit of successors in the same office.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/francis-turretin.html">Francis Turretin</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Institutes of Elenctic Theology</cite>, 18.19.3</span></figcaption>

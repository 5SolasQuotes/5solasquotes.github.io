<main class="wrap"><figure class="quote" id="q-666c16c43d" data-kw="">
<blockquote><p>They who truly fear the name of God are indeed scandalized by the Prelates, their depriving of ministers for refusing to conform: but by the ministers, their suffering of deprivation for this cause, they are not scandalized, but edified… Our refusal to conform to inconvenient ceremonies, being a necessary duty, if the magistrate be provoked therewith, we are blameless: neither can it any otherwise provoke him to disgrace those well deserving ministers than Moses his seeking of liberty for Israel to go and serve God according to his will, provoked Pharaoh the more to oppress them; or than Christ’s preaching of the truth, and his abstaining from the superstitious ceremonies of the Pharisees, provoked them to disgrace Him and plot his hurt. Howbeit we are not ignorant that the magistrate is not provoked by our refusing to conform, except as it is misreported, misdeemed and misconstructed to him by the false calumnies of our adversaries: which being so, he is not incited by our deed, but by theirs.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/george-gillespie.html">George Gillespie</a></span><span class="wk"><span class="lbl">Work:</span> <cite>English Popish Ceremonies</cite>, (1637), pt. 2, ch. 1, p. 7</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/the-church/schism-and-separation.html">Schism and Separation</a></span></div>

</figure><figure class="quote" id="q-042fffb915" data-kw="">
<blockquote><p>This truth is fully made out by those three worthy and pious divines of New England, [John] Cotton, [Thomas] Hooker and [John] Norton: The last whereof, by many reasons evinces this in his answer to Apollonius’s last question, pp. 162-163, and does from the Church of Corinth in particular confirm this: There (says he) was impurity or corruption in worship, for women taught in the Church; There was corrupt doctrine, many denied the Resurrection; in manners, she was most corrupt, there being so many fornications, sects, palpable love of the world, etc. Yet (says he) the apostle did not command those that were worthily prepared to abstain from the Supper, but, rectifying abuses, he did command every one to try himself, and so to eat, etc. And many other things hath he excellently to this purpose, and lays this for a ground, that per alios indigne accedentes non polluitur communio, licet minuitur consolatio, that is, ‘the communion in worship is not polluted, though the consolation be diminished by such joint worshippers.’</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/james-durham.html">James Durham</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Dying Man’s Testament to the Church of Scotland, or a Treatise concerning Scandal</cite>, … (Edinburgh, 1659) | pt. 2, ch. 13, pp. 145-46</span></figcaption>

<main class="wrap"><figure class="quote" id="q-2ac0a9a91f" data-kw="">
<blockquote><p>…whatsoever a man holds, though his conscience be never so much taken with it, yet if it cannot stand with the power of godliness, but destroys it, if this man be in a Christian society after all means used to reduce him, if he still perseveres in it, he is, notwithstanding his conscience, to be cast out of the society of the saints; This is not a little matter, if a man has any conscience in him, it cannot but be a dreadful thing to him: If poison be got into a glass, and you cannot wash it out, the poison and glass too is to be thrown into the sink: Such a man as this is, with the conscience that he has, is to be thrown upon the dunghill. If a man by his wickedness cuts himself off from the mystical body of Christ, the Church may cut him off from his visible, he has forfeited his Church-priviledge.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/jeremiah-burroughs.html">Jeremiah Burroughs</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Irenicum, to the Lovers of Truth and Peace. Heart-Divisions Opened… (London: Robert Davvlman, 1653)</cite>, ch. 6, p. 34</span></figcaption>

</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-eaba72d093" data-kw="">
<blockquote><p>2. Whether a separation may be iustly made from our Church for some errors or corruptions of life. I know that diverse who were once among us, never of us, have put out their own lights, indeed excommunicated themselves. What’s their plea? That our assemblies are full of enormities. I answer: That the defects and corruptions of a Church must be distinguished: they are either in doctrine or in manners. For doctrine, some errors are Citra fundamentum, some Circa fundamentum, others Contra fundamentum. Errors beside the foundation trouble, errors about the foundation shake, errors against the foundation ouerturn all. So long then as no foundation is harmed, it is not lawful depart until the Church separates from Christ, we must not separate from it. In two cases there is warrant of separation: First, when the substance of God’s worship is quite corrupted. What agreement has the Temple of God with idols? (2 Cor. 6:16) When this is, verse 17, ‘Come out from among them, and be ye separate, says the Lord,’ When Jeroboam had set up idols in Israel, the priests and the Levites left their suburbs and possession and came to Judah and Jerusalem. (2 Chron. 11:14) Secondly, when the substance of doctrine is quite corrupted. If any man consent not to the words of our Lord Jesus Christ, and to the doctrine which is according to godliness, etc. (1 Tim. 6:3) ‘From such,’ verse 5, ‘withdraw thyself.’ Paul in the synagogue at Ephesus preached for the space of three months together. (Acts 19:9) But when diverse were hardened, and believed not, but spake evil of that way, he departed from them, and separated the disciples. In these two cases lawful, not else.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/thomas-adams.html">Thomas Adams</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Happiness of the Church, or a Description of those Spiritual Prerogatives wherewith Christ has endowed her, considered in some Contemplations upon part of the 12th Chapter of the Hebrews (London, 1619), ‘To the General Assembly, and Church of the Firstborn which are Written in Heaven,’</cite>, pp. 66-67</span></figcaption>

</figure><figure class="quote" id="q-f3cf654479" data-kw="">
<blockquote><p>The ignorance of fundamentals condemns, which is to be understood [in] two ways: 1. The ignorance of fundamentals such as are supernatural fundamentals, condemns all within the visible church as a sin, but it does not formally condemn those who are [outside] the visible church (John 15:22). It only makes those who are without the church incurable, but does not formally condemn them, as medicine not known, and so not refused, makes sick men incurable, as a loss, but does not kill them as a sin. 2. Superstructures, which by consequence arise from fundamentals, are fundamental by consequence, and secondarily, as the second rank of stones that are immediately laid upon the foundation, are a foundation in respect of the higher parts of the wall, and therefore are materially fundamental. And the ignorance of these virtually condemns, and the denying of such, by consequence, is a denying of the foundation.</p></blockquote>

ad it online · Reformed Books Online</a></div>
</figure><figure class="quote" id="q-61eea66ae6" data-kw="">
<blockquote><p>Therefore there is no binding men’s faith to that the Scripture avers not. The Papists do bind to things: 1. Citra fundamentum, besides the foundation; as traditions, untempered mortar daubed on the walls of truth to hide it. 2. Circa fundamentum, to things about the foundation, such as endanger it: as denial of Scripture to laymen. This is a wretched sin, to obtrude for matter of faith, that it is not lawful to read the Scriptures which are the rule of faith. 3. Contra fundamentum, to things against the foundation; as the sacrifice of the mass, distinction of mortal and venial sins, justification by works, etc. What is against that which is necessarily to be believed to salvation, is against the foundation. But it is necessary to trust in Christ’s blood and merits only, because there is no other name given under heaven whereby we may be saved. (Acts 4:12) Therefore to trust in others, to let angels or men share part of our faiths, is against the foundation. Indeed they boast that they only hold the foundation: but ‘I Paul say unto you, that if ye be circumcised, Christ shall profit you nothing.’ (Gal. 5:2) If you join your own merits with Christ’s merits, he shall profit you nothing.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/thomas-adams.html">Thomas Adams</a></span><span class="wk"><span class="lbl">Work:</span> <cite>A Commentary or Exposition upon the divine Second Epistle General, written by the blessed apostle St. Peter (London: Badger, 1633), on ch. 1, verse 5</cite>, p. 110</span></figcaption>

<blockquote><p>II. In dealing with adversaries, or others, about controverted truths, it were good for their conviction to make use of some known, uncontroverted principle, and thence deduce what they would have received; for where there is no agreement in any common notion or principle, there is no hope of getting truths received: therefore Paul, in debating this matter [Romans 7:1-3], doth wisely lay down, in the first place, what they received as truth, and did not doubt of saying, Know ye not; which is as much as if he had said, You know this, and cannot deny it, viz. That the law hath dominion over a man, as long as he liveth. III. It is not the most gaining way, in dealing with adversaries of truth, to contemn their parts and abilities, and to speak of them in an undervaluing manner; but rather on the contrary, to acknowledge their parts and knowledge, and make use of that for their conviction, as the apostle doth here; he does not lightly them, but says, they knew the law. IV. In all our attempts ot gain folks to the truth, we should still labour to gain their affection; and we should so carry ourselves, as they may be convinced of our love and tender respect towards them, and that we seek not to shame, or rub any affront on them, but intend, out of a friendly and brotherly manner, to gain them; for Paul doth insinuate himself thus upon these here, by stiling them brethren: thus he laboured to conciliate their favour.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/john-brown-of-wamphray.html">John Brown of Wamphray</a></span><span class="wk"><span class="lbl">Work:</span> <cite>An Exposition of the Epistle of Paul the Apostle to the Romans</cite>, p. 221</span></figcaption>

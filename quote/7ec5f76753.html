<main class="wrap"><figure class="quote" id="q-7ec5f76753" data-kw="">
<blockquote><p>…so neither is the prince to be obeyed, using his authority against God, in commanding impious and unhonest things: we must give unto Caesar the things that are Caesar’s and unto God the things which are God’s, we may not give unto the prince the things which are God’s, that is, the conscience. And in this case the apostles give us a rule, to obey God rather than man, Acts 4:19, when obedience then is denied in unjust and unlawful things, not the authority which is God’s ordinance, but the abuse of the authority is gainsaid.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/andrew-willet.html">Andrew Willet</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Hexapla, that is, a Six-fold Commentary upon the Most Divine Epistle of the Holy Apostle, St. Paul to the Romans</cite>, … ([Cambridge] 1611), ch. 13, 3. The Questions &amp; Doubts Discussed, Question 17, ‘How far the Magistrate is to be Obeyed, and wherein not to be Obeyed?’, p. 588</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/civil-government-and-society/natural-law-and-civil-law.html">Natural Law and Civil Law</a></span></div>

</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-0c73e026c1" data-kw="">
<blockquote><p>As touching submission or subjection, we say with Dr. Field that subjection is generally and absolutly required where obedience is not, and even when our consciences suffer us not to obey, yet still we submit and subject ourselves, and neither do nor shall (I trust) show any the least contempt of authority.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/george-gillespie.html">George Gillespie</a></span><span class="wk"><span class="lbl">Work:</span> <cite>English Popish Ceremonies</cite>, … (1637), | Pt. 1, ch. 3, ‘That the Ceremonies thus imposed &amp; urged as things necessary, do bereave us of our Christian liberty, first, because our practise is adstricted’, p. 6</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/civil-government-and-society/natural-law-and-civil-law.html">Natural Law and Civil Law</a></span></div>

</figure><figure class="quote" id="q-384ac9342b" data-kw="">
<blockquote><p>32. They [presbyterians] hold (I believe with warrant of God’s Word) if the king refuse to reform religion, the inferior judges, and assembly of godly pastors and other church-officers may reform; if the king will not kiss the Son, and do his duty in purging the House of the Lord, may not Elijah and the people do their duty and cast out Baal’s priests [1 Kings 18:19-24, 30, 37-40]. Reformation of religion is a personal act that belongs to all, even to any one private person according to his place.

33. They may swear a covenant without the king, if he refuse, and build the Lord’s house (2 Chron. 15:9) themselves, and relieve and defend one another when they are oppressed. For my acts and duties of defending myself and the oppressed do not tie my conscience conditionally, so the king consent, but absolutely, as all duties of the law of nature do (Jer. 22:3; Prov. 24:11; Isa. 58:6; 1:17).

34. The Popish Prelate [John Maxwell] condemns our reformation because it was done against the will of our popish queen. This shows what estimation he has of popery and how he abhors protestant religion.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/samuel-rutherford.html">Samuel Rutherford</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Lex Rex</cite>, (1644; Edinburgh: Ogle, 1843), p. xxiii</span></figcaption>

"noopener" target="_blank">Read it online · Reformed Books Online</a></div>
</figure><figure class="quote" id="q-c42b46fc70" data-kw="">
<blockquote><p>The officers that rule the world in God’s stead, as father mother, master, husband, lord and prince, are honoured, when the law, which Almighty God has committed unto them to rule with, is obeyed. Thy neighbour that is out of office is honored, when thou (as God has commanded thee) lovest Him as thyself, countest him as good as thyself, thinkest him as worthy of any thing as thyself, and comest lovingly to help him at all his need, as thou wouldest be holp thyself; because God hath made him like unto his own image, as well as thee, and Christ hath bought him as well as thee. If I hate the law, so I break it in mine heart; and both hate and dishonour God, the maker thereof. If I break it outwardly, then I dishonour God before the world, and the officer that ministers it. If I hurt my neighbour, then I dishonor my neighbor and Him that made him, and him also that bought him with his blood… If I be not ready to help my neighbor at his need, so I take his due honour from him, and dishonour him, and him that made him, and Him also that bought him with his blood, whose servant he is… In like manner, if the officer, abusing his power, compel the subject to do that which God forbiddeth, or to leave undone that which God commandeth, so he dishonoureth God in withdrawing his servant from him, and maketh an idol of his own lusts, in that he honoureth them above God; and he dishonoureth his brother in that he abuseth him, contrary unto the right use which God hath created him for, and Christ hath bought him for, which is to wait on God’s commandments. For if the officer be otherwise minded than this, the worst of these subjects is made by the hands of Him that made me, and bought with the blood of Him that bought me, and therefore, my brother; and I but his servant only, to defend him, and to keep him in the honour that God and Christ has set him, that no man dishonors him: he dishonours both God and man.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/william-tyndale.html">William Tyndale</a></span><span class="wk"><span class="lbl">Work:</span> <cite>An Answer to Sir Thomas More’s Dialogue, the Supper of the Lord</cite>, … (d. c. 1536; Cambridge: Parker Society, 1850), pp. 56-57</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/civil-government-and-society/natural-law-and-civil-law.html">Natural Law and Civil Law</a></span></div>

f+Him+that+made+me%2C+and+bought+with+the+blood+of+Him+that+bought+me%2C+and+therefore%2C+my+brother%3B+and+I+but+his+servant+only%2C+to+defend+him%2C+and+to+keep+him+in+the+honour+that+God+and+Christ+has+set+him%2C+that+no+man+dishonors+him%3A+he+dishonours+both+God+and+man.%E2%80%9D%0A%0A%E2%80%94+William+Tyndale%2C+An+Answer+to+Sir+Thomas+More%E2%80%99s+Dialogue%2C+the+Supper+of+the+Lord%E2%80%A6+%28d.+c.+1536%3B+Cambridge%3A+Parker+Society%2C+1850%29%2C+pp.+56-57&amp;url=https%3A%2F%2F5solasquotes.github.io%2Fquote%2Fc42b46fc70.html&amp;via=5Solas" target="_blank" rel="noopener">Share on X</a><a class="perma" href="../quote/c42b46fc70.html">Permalink</a><a class="src" href="https://reformedbooksonline.com/on-how-human-laws-bind-the-conscience-how-they-do-not/#:~:text=The%20officers%20that%20rule%20the%20world,he%20dishonours%20both%20God%20and%20man&amp;text=The%20officers%20that%20rule%20the%20world%20in%20God%E2%80%99s&amp;text=dishonors%20him%3A%20he%20dishonours%20both%20God%20and%20man" rel="noopener" target="_blank">Read it online · Reformed Books Online</a></div>

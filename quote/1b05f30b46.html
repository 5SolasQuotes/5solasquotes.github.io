<main class="wrap"><figure class="quote" id="q-1b05f30b46" data-kw="">
<blockquote><p>O how much, my brethren, is included in these two words, addressed by a convinced sinner to the Saviour, “remember me!” The eternal salvation of a sinner hangs upon them. If he remembers him, all is well; if he forgets him, woe unto him, for it shall be ill with him. Had not Christ remembered and thought upon us in our low estate, and undertaken our cause, we would have been hopeless.

Had he not remembered his people, and borne their names on his breastplate, when he approached God as the great high-priest to make reconciliation for iniquity, their guilt would have remained. Did he not remember them, when they are lying polluted in their blood, and say to them, “Live,” they would die in their sins. Did he not continue to remember them, and pray for them, and help them by his Spirit, he that desires to have them as his prey would gain his object, and they would never see the kingdom of heaven.

Had the penitent thief dropped out of the memory of Christ, he would have dropped into hell at death, along with his blaspheming companion; for “nor thieves nor revilers shall inherit the kingdom of God.” How could he, an ignorant, lawless, God-despising, heaven-daring profligate, presume to lift up his eyes, or to apply at the gates of paradise, unless he had ground to believe that his gracious and merciful fellow-sufferer would remember him? But if he continued to think of him and own him, what might he not expect?

In fine, this prayer was offered believingly as well as fervently. He believed that Jesus had the highest interest with the Father, who would not refuse any thing which should be craved by him who had laid down his life at his command; that he was about to be put in possession of all power in heaven and earth; and that this included authority to bestow its honours and rewards on whomsoever he would.

And he believed that such was the grace, condescension, and compassion of the dying Redeemer, that he would not reject the application of a poor, convicted, condemned criminal, but wash him from his sins in his blood, and sanctify him by the power of his Spirit, and present him faultless before the throne of his glory with exceeding joy. Nor did he believe in vain, nor was the answer of his prayer long delayed or dubiously expressed; for Jesus instantly said to him, “Verily, I say unto thee, To-day shalt thou be with me in paradise.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/thomas-m-crie-sr.html">Thomas M’Crie Sr.</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Prayer of the Thief on the Cross in Sermons</cite></span></figcaption>

<blockquote><p>Q 73 Why could this covenant not have been valid without a mediator?

A Because God’s justice demanded that he be angry with men forever on account of sin. Therefore, since it was impossible for God to have any fellowship with the human race contrary to his justice, it was necessary that some one intervene who, by pleading with God for us, satisfying the justice of God, and removing every future offence, might again unite God with men who were separated from him.

Q 74 Why must this mediator of the covenant be true man?

A Because the justice of God required that sin be atoned for by suffering and death. But, since the divine nature could not suffer and die, satisfaction had to come through a creature; and since man sinned, through no other creature than man himself.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/zacharias-ursinus.html">Zacharias Ursinus</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Large Catechism</cite>, (1561), trans. Fred H. Klooster and John Medendrop; http://links.christreformed.org/doctrinevision/ursinus_project.pdf.</span></figcaption>

<blockquote><p>3. The kingdom of the Son of God is twofold: universal and singular.

4. The universal kingdom of the Son of God is the kingdom that, by nature, God Himself truly possesses in common with the Father and the Holy Spirit throughout the universe, from eternity to eternity, and this by nature or by natural right, as the Only Begotten Son of God the Father. Hence, it is also called the divine kingdom by Athanasius in his work De Incarnatione Verbi Contra Arianos (On the Incarnation of the Word Against the Arians), Volume 1, Page 476. This same natural kingdom of His is accustomed to be called.

5. He has never relinquished nor will He ever relinquish this kingdom.

6. The singular kingdom of the Son of God is His special possession within the Church, which is His mystical body. It is often called the kingdom of gift and acquisition.

7. It encompasses both grace and glory.

8. The kingdom of grace is the governance of the Church in this life, in which Christ exhibits His grace to His elect for the attainment of their eternal salvation. This kingdom is called “human” by Athanasius in the aforementioned passage because it is administered by the Son of God in His capacity as the Word made flesh, voluntarily and graciously undertaking the role of Mediator. Hence, it is also appropriately called the “Economical” or “Mediatorial” kingdom, as it pertains specifically to us humans.

9. Christ will deliver this kingdom to God the Father, as stated in 1 Corinthians 15:24. As Athanasius noted in the previously mentioned passage, the Lord of heaven assumed the likeness of our humanity and took upon Himself the human throne of David, who is His Father according to the flesh, in order to rebuild and restore it. Through this restoration, we all reign in Him, and He will deliver the restored human kingdom to His Father. …

13. That God may be all in all [1 Cor. 15:28], that is, that God the Father may reign through the Son, through His own Word, after He has reigned here through Him as the Savior, as the same Athanasius piously declares.

14. The kingdom of glory is the governance of the Son of God, which will accompany the universal resurrection of all the dead. When the restoration and glorification of God’s elect are completed, they will contemplate the glory of God the Father in the Only Begotten Son through the Holy Spirit for eternity, and they will be blessed without end in the present vision of God and will reign gloriously with Christ.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/amandus-polanus.html">Amandus Polanus</a></span><span class="wk"><span class="lbl">Work:</span> <cite>‘Analytical Theses on Colossians</cite>, tr. Jonathan Tomes (Basel: Johannes Schroeter, 1601) | section XIV, Consequences</span></figcaption>

<main class="wrap"><figure class="quote" id="q-afe324ad34" data-kw="">
<blockquote><p>These three opinions [two involve the imputation of Christ’s active obedience], agreeing all in the main point (that is, that only Christ in his obedience is our righteousness) may well (without any contention, strife or schism) be tollerated in the Church of God: if Christian modesty, humbleness of mind, and meekness did in that measure possess all, that they could support one another in love: and study more to keep the unity of the Spirit, in the bond of peace: then by controversies of disputations, to engender strife. Especially seeing none of these opinions overthrow the foundation: or yet contains in them any impiety: or leads any man from the mark or matter of his righteousness, seeing all three exclude all things except only Christ’s obedience from our righteousness. Moreover, if we shall consider two things distinctly: we shall easily perceive that these three opinions may easily be reconciled, and made all to agree in one: and that none of them is contrary to the truth of God.</p></blockquote>

nk">Read it online · Reformed Books Online</a></div>
</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-a8587284b2" data-kw="">
<blockquote><p>Here he indicates the end for which God, in the flesh of his Son, condemned our sin—namely, that the righteousness (or justification) of the Law might be fulfilled in us; that is, that we might be justified, being endowed with that righteousness which the Law requires of us. For the Law requires of us either perfect obedience or punishment. But we have not rendered perfect obedience; yet we have paid the penalty in Christ, for he paid it on our behalf. Therefore we have satisfied the Law in Christ; and consequently the Law cannot condemn us, but is bound to justify us.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/johannes-piscator.html">Johannes Piscator</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Other citations (work not named)</cite>, On Rom. 8:4, “That the righteousness of the law might be fulfilled in us, who walk not after the flesh, but after the Spirit.”</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/justification/active-and-passive-obedience-imputed.html">Active and Passive Obedience Imputed</a></span></div>

</figure><figure class="quote" id="q-5af6e0c4db" data-kw="">
<blockquote><p>By which righteousness of Christ we are justified XI. Since, moreover, a twofold righteousness is observed in Christ—an essential righteous, as much of the divine as of the human nature, with which he was born (Luke 1:35); and a righteousness procured or acquired during his life on earth—so that we may more easily understand by which righteousness of Christ we are justified, it must be maintained that: (1) certainly the whole Christ, and all his righteousness, is profitable to us for justification, because the whole Christ was given by God to the world, that whosoever believes in him should not perish, but have eternal life (John 3:16) and because he was not born for himself, and did not come into the world so that he might minister to himself, but to us, that he might give himself as the price of redemption for many (Matt. 20:28; Eph. 5:2, 25–26), although it does not all profit us in one and the same way. In particular, (2) his essential righteousness, as much the divine as the human, is by no means profitable for justification as our [Greek], dikaioma, righteousness, on account of which we are justified, because not only does he require it for himself, but because it would also make superfluous and void a justification through a procured righteousness. For if we were to be absolved on account of the righteousness of the divine person, which is of infinite value, or even on account of the righteousness of the human nature, as our dikaioma, why would the righteousness of his death or of his life be required? Still, this essential righteousness also is profitable as a prerequisite in the person of the Mediator, apart from which he could not provide the dikaioma for us (2 Cor. 5:21; Isa. 53:11). So (3) only the procured righteousness of Christ provides the dikaioma on account of which we are justified by God. But since again a twofold procured righteousness of Christ is observed, one active, whereby he kept the law exactly (Matt. 3:15; 5:17; Gal. 4:4), and the other passive, whereby he suffered for the law that we violated (Rom. 4:25; Phil. 2:8), it must be maintained that (4) the active righteousness alone is insufficient for procuring justification, because a dikaioma was demanded for sinners, who had earned death (Gen. 2:17; Rom. 5:12; 6:23), which from the divine decree, the threat of the law, and God’s natural hatred of sin, was necessary to be suffered (Rom. 1:32; 2 Thess. 1:6). And also (5) he did not expend on our behalf only his passive righteousness, because it is not only his passive righteousness that is referred to our salvation throughout Scripture (Jer. 23:6; 1 Cor. 1:30; Rom. 5:19; Phil. 3:9), but it also regards the fullness of grace that he was expended for us in the whole of what he is (Rom. 8:32). Hence, (6) both kinds of his righteousness join into our one dikaioma, whereby he satisfied for the sins of those to be justified (Rom. 8:3–4), such that accordingly, (7) this twofold righteousness is not separated, indeed not even distinguished in such a way that to the passive righteousness alone is attributed the efficacy of making satisfaction for our guilt, and thus of delivering us from evils, and to the active righteousness alone is attributed the power of meriting for us the right of eternal life. For not only do satisfying and meriting in this matter not differ really, but neither should the passive be stripped of the dignity of meriting, nor the active of the dignity of satisfying, as we have demonstrated elsewhere (1.5.18 §XIV; cf. §XVII, below).</p></blockquote>

<blockquote><p>Our justice or righteousness, that is, the justice or righteousness of the Gospel, whereby we are just in the sight of God, is not our conformity with the Law: but it is Christ’s satisfaction performed unto the Law for us, or the punishment, which He sustained for us, and so his whole humiliation (that is, his taking of flesh, his undertaking of servitude, penury, ignominy, and infirmity: his suffering of that bitter passion and death: all which He did undergo for us, but willingly) and that humiliation and satisfaction freely of God imputed unto us his faithful and believers. 1 Cor. 2:2, ‘I esteemed not to know anything among you, save Jesus Christ and Him crucified.’ Col. 2:10, ‘Ye are complete in Him.’ Rom. 5:19, ‘By the obedience of one shall many be made righteous.’ Isa. 53:5-6, ‘With his stripes we are healed. The Lord hath laid upon him the iniquity of us all.’ Now that Christ might perform obedience and satisfy for us, it behoved Him to be our Mediator, being by Himself just and holy, Heb. 7:26, ‘For such an High-Priest it became us to have, holy, harmeless, undefiled, separate from sinners, and made higher than the heavens.’ All these things are true perfectly and wholly in Christ. For He has perfectly fulfilled the Law for us: 1. by the holiness of his human nature. 2.by his obedience: for He became obedient unto the death, even the death of the cross: And the former fulfilling of the law, namely, the holiness of Christ’s human nature, was requisite for the other, even for his obedience. This obedience and satisfaction of Christ is our satisfaction, and our proper iustice, for which we please God, for which we are received into favor with God the Father, and which is imputed unto us. That former fulfilling of the Law is indeed imputed also unto us, namely the humiliation and justice or righteousness of Christ’s human nature, that we may be reputed holy before God: but this holiness of Christ is imputed unto us for his obedience or satisfaction sake: because He satisfied for us God’s justice, in sustaining eternal punishment and pains, which we should have sustained everlastingly. Hence is it, that the effusion of Christ’s blood (as being the complement and consummation of Christ’s satisfaction) is only said to be our justice and righteousness. 1 Jn. 1:7, ‘The blood of Jesus Christ cleanseth us from all sin,’ that is, not only from that which is past, but also from that which is to come. … 5. How Christ’s satisfaction is made our justice and righteousness: This question is adjoined because it seems absurd that we should be justified by that which is another man’s, and not ours. The satisfaction or justice of Christ is made ours, or applied unto us, two ways, that is, by a double application. The former application is God’s, who in respect of that fulfilling of the Law performed by Christ, accepts us, and applies the same unto us; that is, He imputes it, no less than if we had never sinned, or at least had paid and suffered sufficient punishment for our sins. For albeit to justify signifies to make just, yet in the Church it signifies another thing, and is taken in another sense. Or God does apply it, when He imputes the fulfilling of the Law performed by Christ unto us, even as if it were performed by us, neither will at all punish us. But to impute, is, to accept Christ’s satisfaction, performed to this end, that it might be our justice and righteousness. We then also apply unto us the fulfilling of the Law performed by Christ, when we are steadfastly persuaded, that God does impute, apply and give it unto us, and for it reputes us for just, absolving us from all guilt… That which we have now spoken of both applications, both God’s, and ours, does manifestly show what is meant in this place by justifying: Which is, that, to justify, is not to make one just who is uniust: but to repute him for just and righteous who is uniust, and to absolve the unjust and unrighteous from all guilt, and not to punish him, and this for another’s justice and righteousness imputed by faith unto us.</p></blockquote>

C+to+accept+Christ%E2%80%99s+satisfaction%2C+performed+to+this+end%2C+that+it+might+be+our+justice+and+righteousness.+We+then+also+apply+unto+us+the+fulfilling+of+the+Law+performed+by+Christ%2C+when+we+are+steadfastly+persuaded%2C+that+God+does+impute%2C+apply+and+give+it+unto+us%2C+and+for+it+reputes+us+for+just%2C+absolving+us+from+all+guilt%E2%80%A6+That+which+we+have+now+spoken+of+both+applications%2C+both+God%E2%80%99s%2C+and+ours%2C+does+manifestly+show+what+is+meant+in+this+place+by+justifying%3A+Which+is%2C+that%2C+to+justify%2C+is+not+to+make+one+just+who+is+uniust%3A+but+to+repute+him+for+just+and+righteous+who+is+uniust%2C+and+to+absolve+the+unjust+and+unrighteous+from+all+guilt%2C+and+not+to+punish+him%2C+and+this+for+another%E2%80%99s+justice+and+righteousness+imputed+by+faith+unto+us.%E2%80%9D%0A%0A%E2%80%94+Zacharias+Ursinus%2C+The+Sum+of+Christian+Religion%3A+Delivered%E2%80%A6+in+his+Lectures+upon+the+Catechism%E2%80%A6+tr.+Henrie+Parrie+%28Oxford%2C+1587%29%2C+%E2%80%98Of+Justification%E2%80%99%2C+4+What+is+our+iustice+%26+5+How+Christ%E2%80%99s+satisfaction+is+made+our+justice+and+righteousness%2C+pp.+680-82&amp;url=https%3A%2F%2F5solasquotes.github.io%2Fquote%2F95f67b534e.html&amp;via=5Solas" target="_blank" rel="noopener">Share on X</a><a class="perma" href="../quote/95f67b534e.html">Permalink</a><a class="src" href="https://reformedbooksonline.com/the-active-obedience-of-christ#:~:text=Our%20justice%20or%20righteousness%2C%20that%20is,righteousness%20imputed%20by%20faith%20unto%20us&amp;text=Our%20justice%20or%20righteousness%2C%20that%20is%2C%20the%20justice&amp;text=justice%20and%20righteousness%20imputed%20by%20faith%20unto%20us" rel="noopener" target="_blank">Read it online · Reformed Books Online</a></div>

<blockquote><p>It is a question, the threatening standing, Gen. 2:17, how the active righteousness of Christ can be a cause meriting to us life and satisfying the Law when there is no suffering for the breach of the Law, which expressly required death in the sinner: Not to say that it seems too near to make Christ’s dying needless if his active holiness do the business; Nay we cannot so teach.</p></blockquote>

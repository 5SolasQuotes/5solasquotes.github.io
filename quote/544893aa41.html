<main class="wrap"><figure class="quote" id="q-544893aa41" data-kw="">
<blockquote><p>These words contain the fourth Commandment of the Decalogue, being the last of the first Table concerning our duty to God immediately. The Sum of it is to appoint unto men a set and solemn time wherein they should wholly give themselves to the study of holiness, and to the performance of holy exercises necessary for that purpose. …

It is propounded in these words, Remember the Sabbath-day to sanctify it. Remembrance is properly of things past, but here according to the usual acceptation of the word, it signifies a diligent consideration of the thing before hand, as where the young man is commanded, Eccles. 12. 1. To remember his Creator in the days of his youth, that is, seriously to consider of him. It is all one as if he should say, diligently observe, for so he interprets himself Deut. 5. 12.

Think upon and accordingly provide for the observation of this holy rest, by dispatching all the works of thy calling, that nothing might be undone which providence and diligence might prevent, that might hinder thy rest on the seventh day. Men are apt to forget the Creation of the world, therefore the Lord appointed the fourth Commandment; and to forget Christ, therefore he appointed the standing Ordinance of the Lord’s Supper, Luk. 22. 19.

The Sabbath-day] or the day of rest, and ceasing from labour, as the word properly signifieth, which is repeated again in the conclusion of the Commandment. It must not be bestowed as other days, but then they ought conscionably to forbear those things which on other days they might lawfully perform, for rest is a cessation from doing things.

To sanctify it] or keep it holy, that is, to employ the day in holy duties of God’s immediate worship, to sanctify it, to set it a part to holy uses and purposes. So two things are required, 1. The remembrance of the time, which is a serious preconsideration to prepare for it. 2. A careful celebration, consisting in resting and sanctifying it, for a bare rest is not enough, but such a rest as tendeth to and endeth in the sanctifying of it.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/edward-leigh.html">Edward Leigh</a></span><span class="wk"><span class="lbl">Work:</span> <cite>A system or body of divinity consisting of ten books: wherein the fundamentals and main grounds of religion are opened, the contrary errors refuted, most of the controversies between us, the papists, Arminians, and Socinians discussed and handled, several Scriptures explained and vindicated from cor</cite>, (London: William Lee, 1654), IX.V, pp 811-12.</span></figcaption>

</figure><figure class="quote" id="q-adc2d5bc08" data-kw="">
<blockquote><p>So, for that scriptural heavenly duty of singing: what more commonly alleged against it than the abuse and ill effects of that precious ordinance? How often is the nonsense and error of the common translation, the rudeness and dullness of the meter of some Psalms, as Ps. 7:13, as also the cold formality with which that ordinance is performed by many who do but parrotize? I say, how often are these things buzzed into the ears of the people to alienate their hearts from so sweet and beneficial a duty? And very often we find it urged [by Antinomians, who sometimes forsook singing public praise altogether] to the same end, how unwarrantable and dangerous a thing it is for carnal and unregenerated persons to appropriate to themselves in singing those praises and experiences which are peculiar to the saints; not understanding or considering that the singing of Psalms is an ordinance of Christ appointed for teaching and admonition, as well as praising, Col. 3:16, ‘Teaching and admonishing one another in psalms and hymns,’ etc… If Satan can prevail first with wicked men to corrupt and abuse God’s ordinances by superstitious mixtures and additions; and then with good men to renounce and slight them for the sake of those abuses; he fully obtains his design, and gives Christ a double wound at once; one by the hands of his avowed enemies, the other by the hands of his friends, no less grievous than the first. First, wicked men corrupt Christ’s ordinances, and then good men nauseate them.</p></blockquote>

<blockquote><p>That is to say, that among the people of Israel there was, as it were, a twofold holiness of persons: the one common, according to which that whole nation was separated from all other nations so that they might be covenanted and consecrated to God—and for that reason they were called “a holy nation,” while the rest of the nations were “profane”; the other more special, and proper to those who, for the service of God in the tabernacle, were exempted from other employments—on which account they were with peculiar propriety called “holy,” as also, in the same manner, were all vessels made use of in the sacred service.

In fact, then, the apostle refers to the one or the other of these two kinds of holiness, with a view to show either that the children of believers are set apart by God, to the end that they may resemble certain vessels that under the old economy were specially dedicated to his own service, or that they are separated from the common condition of other infants so that they may participate in the covenanted people of God.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/moses-amyraut.html">Moses Amyraut</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Disputatio de Paedobaptismi</cite>, §XIV. Quoted in Herman Witsius, On the Efficacy and Utility of Baptism in the Case of Elect Infants whose Parents are under the Covenant (1693), trans. William Marshall, ed. J. Mark Beach in Mid-American Journal of Theology, 17 (2006), pp 128-29.</span></figcaption>

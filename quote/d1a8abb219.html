<main class="wrap"><figure class="quote" id="q-d1a8abb219" data-kw="">
<blockquote><p>8. All prophets are either ordinary or extraordinary, as is clear in God’s Word; extraordinary now are not in the Church, and the ordinary prophets now are not gifted to preach the Word, except as Timothy, from their youth they have been trained up in the Scriptures and have learning, sciences, knowledge of the tongues, if he would be a man able to teach others, 2 Tim. 2:3; 1 Tim. 3, he must meditate, read, and give himself wholly to these things, 1 Tim. 3:15-16, and so must leave his calling contrary to the apostle his commandment, 1 Cor. 7:20-22; 1 Thess. 4:11; Eph. 4:28, but if he have a gift for public preaching, he is to separate himself for it, seeing a gift is a token of Gods separation.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/samuel-rutherford.html">Samuel Rutherford</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Due Right of Presbyteries, ‘Acts 15, A Pattern of a Juridicial Synod’</cite>, (London, 1644), pt. 2, ch. 5, sections 1 &amp; 2, Question 2, “Whether or not all gifted persons may preach the Word of God publicly and ordinarily, for the gathering in of souls to Christ, though they be destitute of all official authority, or Church calling to that ministry? [No]”, pp. 280-81</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/church-government-and-the-ministry/the-call-to-ministry.html">The Call to Ministry</a></span></div>

</figure><figure class="quote" id="q-20014c7035" data-kw="">
<blockquote><p>But you [a congregationalist] will say, in a church in an island, one may be a pastor without any ordination if the people elect him and there be no elders to ordain. I answer: it is true: but so many pastors send a pastor to be a pastor to a congregation, though that congregation never choose him, as possibly they be for the most part Popish or unwilling; yet both cases are extraordinary and the Church [is in the case of] not [being] constituted and established.</p></blockquote>

</figure><figure class="quote" id="q-3257a990ce" data-kw="">
<blockquote><p>4. Mr. Hooker [a congregationalist] will not say all that were scattered, Acts 8[:4] (for they were all scattered, except the apostles, verse 1) did preach the Gospel, for there were of them women, verse 3; then some of them only preached. And if Mr. Hooker say they were not officers, Mr. Rutherford says they were officers, and that the extraordinariness of their condition supplied the want of a Church-calling, and let Mr. Hooker but attempt to bring a proof for it. 5. If nothing extraordinary was here, l […]t Mr. Hooker or any for him vindicate the place, Acts 8, from Anabaptists who allege the same place, Acts 8, to destroy the standing ordinance of the ministry: and read the judicious Tractate of the Ministers of London, of Mr. Collings.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/samuel-rutherford.html">Samuel Rutherford</a></span><span class="wk"><span class="lbl">Work:</span> <cite>A Survey of the Survey of that Sum of Church-Discipline Penned by Mr. Thomas Hooker</cite>, … (1658), p. 426</span></figcaption>

</figure><figure class="quote" id="q-cd39974bed" data-kw="">
<blockquote><p>1. We must distinguish a twofold power of the keys (Trelcatius, Instittutes of Theology, bk. 2, p. 287-88; Pareus on 1 Cor. 5, Of Excommunication): the one is execute in doctrine: the other in discipline: the one concionalis [of preaching]: the other judicialis [of judgment]. Touching the former, we grant it is proper for pastors alone, whose office and vocation it is, by the preaching and publishing of God’s Word, to shut the Kingdom of Heaven against impenitent and disobedient men, and to open it unto penitent sinners, to bind God’s heavy wrath upon the former, and (by application of the promises of mercy) to loose the latter from the sentence and fear of condemnation. When we ascribe the power of binding and loosing to that whole consistory, wherein governing elders are joined together with pastors, we mean only of the Keys of external discipline, which are used in ecclesiastical courts and judicatories.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/george-gillespie.html">George Gillespie</a></span><span class="wk"><span class="lbl">Work:</span> <cite>English Popish Ceremonies</cite>, (1637), pt. 3, ch. 8, Digression 4, pp. 188-89</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/church-government-and-the-ministry/the-call-to-ministry.html">The Call to Ministry</a></span></div>

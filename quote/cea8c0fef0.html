<main class="wrap"><figure class="quote" id="q-cea8c0fef0" data-kw="Apostolic succession">
<blockquote><p>Here we must distinguish succession: one is personal and local, as to persons and places; another is doctrinal, as to faith. We do not deny that the latter is a mark and thus it coincides with ours. But the former (of which we treat here) cannot be a mark. (a) It is merely contingent and aside from the nature of the church, unless it is founded on unity of sound doctrine and true faith (Eph. 4:4, 5, 11, 12). … For the church is not to be sought in walls and temples, but in doctrines. The church is where true faith is. “They do not have the inheritance of Peter, who have not the faith of Peter” (Ambrose).</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/francis-turretin.html">Francis Turretin</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Institutes of Elenctic Theology</cite>, 18.13.28</span></figcaption>

</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-e515d7fb38" data-kw="">
<blockquote><p>Secondly, the pope is not infallible in doctrine or in practice. Some have been exceptionally ungodly, having been fornicators, occultists, heretics, and atheists; this has been confirmed by papal chroniclers. How can such individuals function as infallible judges in disputes that relate to doctrinal issues?</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/wilhelmus-a-brakel.html">Wilhelmus à Brakel</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Christian&#x27;s Reasonable Service</cite>, Vol. 1, p. 55</span></figcaption>

</figure><figure class="quote" id="q-669e01d933" data-kw="">
<blockquote><p>Your see, however, which is called the Court of Rome, and which neither you nor any man can deny to be more corrupt than any Babylon or Sodom, and quite, as I believe, of a lost, desperate, and hopeless impiety, this I have verily abominated, and have felt indignant that the people of Christ should be cheated under your name and the pretext of the Church of Rome; and so I have resisted, and will resist, as long as the spirit of faith shall live in me.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/martin-luther.html">Martin Luther</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Letter to Pope Leo X</cite>, p. 2</span></figcaption>

</figure><figure class="quote" id="q-44327ec6c7" data-kw="">
<blockquote><p>Has it never occurred to you that the pope, cardinals, bishops, monks, and that the whole synagogue of Satan are trouble-makers? The truth is, they are worse than false apostles. The files [sic] apostles taught that in addition to faith in Christ the works of the Law of God were necessary unto salvation. But the papists omit faith altogether and teach self-devised traditions and works that are not commanded of God, indeed are contrary to the Word of God, and for these traditions they demand preferred attention and obedience.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/martin-luther.html">Martin Luther</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Commentary on Galatians</cite>, p. 22</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/church-government-and-the-ministry/papacy.html">Papacy</a></span><span class="t"><a href="../topics/rome/the-papacy.html">Rome: The Papacy</a></span></div>

</figure><figure class="quote" id="q-dd5daca24a" data-kw="">
<blockquote><p>Shall we recognise the Apostolic See where we see nothing but horrible apostasy? Shall he be the vicar of Christ who, by his furious efforts in persecuting the Gospel, plainly declares himself to be Antichrist? Shall he be the successor of Peter who goes about with fire and sword demolishing everything that Peter built? Shall he be the Head of the Church who, after dissevering the Church from Christ, her only true Head, tears and lacerates her members? Rome, indeed, was once the mother of all the churches, but since she began to be the seat of Antichrist she ceased to be what she was.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/john-calvin.html">John Calvin</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Institutes of the Christian Religion</cite>, 4.7.24</span></figcaption>

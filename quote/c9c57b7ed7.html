<blockquote><p>In the case of men and angels, God has been pleased to promise this transcendent benefit upon certain conditions; which conditional promise is called a covenant. There can be no doubt that this amazing gift of God’s personal love and life-giving society had been offered to angels, and at the beginning was offered to the first human pair, upon conditions. Some object that the conditional promise made to Adam in the garden is not explicitly called a covenant, and that it does not possess all the essential elements of a covenant, since it was a constitution sovereignly ordained by the Creator without consulting the will of the creature.

It is a sufficient answer to these objections, – (1) That although Adam’s will was not consulted, yet his will was unquestionably cordially consenting to this divine constitution and all the terms thereof, and hence the transaction did embrace all the elements of a covenant. (2) That instances of analogous transactions between God and men are expressly styled covenants in the Bible. If God’s transactions with Noah (Gen. 9:11,12) and with Abraham (Gen. 17:1-21) were covenants, then was his transaction with Adam in the garden a covenant.

The analysis of a covenant always gives the following elements: (a) Its parties. (b) Its promise. (c) Its conditions. (d) Its penalty. As to its parties, our Standards teach –

In the first covenant that concerned mankind God dealt with Adam as the representative of all his descendants. The parties, therefore, are God and Adam, the latter representing the human race. That Adam did so act as the representative of his descendants, in such a sense that they were equally interested with himself in all the merit or the demerit, the reward or the penalty, attaching to his action during the period of probation, has already been proved to be the doctrine both of our Standards and of Scripture. (Ch. 6., ss. 3, 4.) As to the further nature of this covenant, our Standards teach – The promise of it was life, the condition of it perfect obedience, and the penalty of it death. (L. Cat., q. 20; S. Cat., q. 12.)

This covenant is variously styled, from one or other of these several elements. Thus, it is called the “covenant of works,” because perfect obedience was its condition, and to distinguish it from the covenant of grace, which rests our salvation on a different basis altogether. It is also called the “covenant of life,” because life was promised on condition of the obedience. It is also called a “legal covenant,” because it demanded the literal fulfilment of the claims of the moral law as the condition of God’s favour. This covenant was also in its essence a covenant of grace, in that it graciously promised life in the society of God as the freely-granted reward of an obedience already unconditionally due. Nevertheless it was a covenant of works and of law with respect to its demands and conditions.

(1) That the promise of the covenant was life is proved – (a) From the nature of the penalty, which is recorded in terms. If disobedience was linked to death, obedience must have been linked to life. (b) It is taught expressly in many passages of Scripture. Paul says, Rom. 10:5, “Moses describes the righteousness which is of the law, That the man which does those things shall live by them.” (Matt. 19:16,17; Gal. 3:12; Lev. 18:5; Neh. 9:29.)

That the life promised was not mere continuance of existence is plain – (a) From the fact that the death threatened was not the mere extinction of existence. Adam experienced that death the very day he ate the forbidden fruit. The death threatened was exclusion from the communion of God. The life promised, therefore, must consist in the divine fellowship and the excellence and happiness thence resulting. (b) From the fact that mere existence was not in jeopardy. It is the character, not the fact, of continued existence which God suspended upon obedience. (c) Because the terms “life” and “death” are used in the Scriptures constantly to define two opposite spiritual conditions, which depend upon the relation of the soul to God. (John 5:24; 6:4; Rom. 6:23; 11:15; Eph. 2:1-3; 5:14; Rev. 3:1.)

(2) That the condition of the covenant was perfect obedience is plain from the fact – (a) That the divine law can demand no less. It is of the essence of all that is right that it is obligatory. James says, that “whosoever shall keep the whole law, and yet offend in one point, he is guilty of all.” James 2:10; Gal. 3:10; Deut. 27:26. (b) That the command not to eat of the fruit of the tree of the knowledge of good and evil, relating to a thing indifferent in itself, was plainly designed to be a naked test of obedience, absolute and without limit.

(3) That the penalty of this covenant was death is distinctly stated: “In the day thou eatest thereof, dying thou shalt die.” Gen. 3:17. This denoted a most lamentable state of existence, physical and moral, and not the cessation of existence or the dissolution of the union between soul and body, because-(a) It took effect in our first parents hundreds of years before the dissolution of that union. (b) Because the Scriptures constantly describe the moral and spiritual condition into which their descendants are born, and from which they are delivered by Christ, as a state of death. (Rev. 3:1; Eph. 2:1-5; 5:14; John 5:24.) This death is a condition of increasing sin and misery, resulting from excision from the only source of life. It involves the entire person, soul and body, and continues as long as the cause continues.</p></blockquote>

<blockquote><p>See hence the errors of those who imagine that it was a covenant of works which God entered into with Israel at Mount Sinai. Indeed, if the promise had followed after the commandments of the law; and if God had said, Keep these commandments, and, upon your so doing, I will be the Lord your God; in this, case it had been a pure covenant of works: whether perfect or sincere obedience had been the condition, it is all one; still the reward would have been in a way of pactional debt as in the first covenant.

But, as you heard the order of the covenant of works, or the connection betwixt the precept and promise, as it was laid in that covenant, it is now inverted: for now God first promises, in a way of sovereign grace, to be the Lord our God and Redeemer, which is the substance and sum of the new covenant; and having made such a grant of grace, to be received by faith, without, or before any works of obedience can be performed by us, be immediately subjoins the law of nature in ten words, showing us what is good, and what the Lord our God requires of us, not as a condition of his own gracious grant, but as a testimony of our love and gratitude to him, who promises, of his free and sovereign grace, to be the Lord our God.

So that, I say, it was God’s covenant of grace that was promulgated at Mount Sinai, and the law was added to it because of transgression, and graffed upon it as a rule of obedience. And whatever covenants or engagements to duty we read of, whether national or personal, still they went upon the foundation of grace laid in God’s covenant of grace; and in so far as Israel, or any else, go off from this foundation in their engagements to duty, in so far they pervert the design of the promise and law annexed to it, and turn back to a covenant of works.</p></blockquote>

— Ebenezer Erskine, A Treasure of Gospel-Grace Digged out of Mount Sinai, or, The Sinner s Claim of Right Cleared from God’s Covenant with Israel at Sinai. A Sermon Preached on a Sacramental Occasion at Kinglassie’ in The Whole Works of Ebenezer Erskine">Copy</button><a class="share" href="https://x.com/intent/post?text=%E2%80%9CSee+hence+the+errors+of+those+who+imagine+that+it+was+a+covenant+of+works+which+God+entered+into+with+Israel+at+Mount+Sinai.+Indeed%2C+if+the+promise+had+followed+after+the+commandments+of+the+law%3B+and+if+God+had+said%2C+Keep+these+commandments%2C+and%2C+upon+your+so+doing%2C+I+will+be+the+Lord+your+God%3B+in+this%2C+case+it+had+been+a+pure+covenant+of+works%3A+whether+perfect+or+sincere+obedience+had+been+the+condition%2C+it+is+all+one%3B+still+the+reward+would+have+been+in+a+way+of+pactional+debt+as+in+the+first+covenant.%0A%0ABut%2C+as+you+heard+the+order+of+the+covenant+of+works%2C+or+the+connection+betwixt+the+precept+and+promise%2C+as+it+was+laid+in+that+covenant%2C+it+is+now+inverted%3A+for+now+God+first+promises%2C+in+a+way+of+sovereign+grace%2C+to+be+the+Lord+our+God+and+Redeemer%2C+which+is+the+substance+and+sum+of+the+new+covenant%3B+and+having+made+such+a+grant+of+grace%2C+to+be+received+by+faith%2C+without%2C+or+before+any+works+of+obedience+can+be+performed+by+us%2C+be+immediately+subjoins+the+law+of+nature+in+ten+words%2C+showing+us+what+is+good%2C+and+what+the+Lord+our+God+requires+of+us%2C+not+as+a+condition+of+his+own+gracious+grant%2C+but+as+a+testimony+of+our+love+and+gratitude+to+him%2C+who+promises%2C+of+his+free+and+sovereign+grace%2C+to+be+the+Lord+our+God.%0A%0ASo+that%2C+I+say%2C+it+was+God%E2%80%99s+covenant+of+grace+that+was+promulgated+at+Mount+Sinai%2C+and+the+law+was+added+to+it+because+of+transgression%2C+and+graffed+upon+it+as+a+rule+of+obedience.+And+whatever+covenants+or+engagements+to+duty+we+read+of%2C+whether+national+or+personal%2C+still+they+went+upon+the+foundation+of+grace+laid+in+God%E2%80%99s+covenant+of+grace%3B+and+in+so+far+as+Israel%2C+or+any+else%2C+go+off+from+this+foundation+in+their+engagements+to+duty%2C+in+so+far+they+pervert+the+design+of+the+promise+and+law+annexed+to+it%2C+and+turn+back+to+a+covenant+of+works.%E2%80%9D%0A%0A%E2%80%94+Ebenezer+Erskine%2C+A+Treasure+of+Gospel-Grace+Digged+out+of+Mount+Sinai%2C+or%2C+The+Sinner+s+Claim+of+Right+Cleared+from+God%E2%80%99s+Covenant+with+Israel+at+Sinai.+A+Sermon+Preached+on+a+Sacramental+Occasion+at+Kinglassie%E2%80%99+in+The+Whole+Works+of+Ebenezer+Erskine&amp;url=https%3A%2F%2F5solasquotes.github.io%2Fquote%2F09d701cb0b.html&amp;via=5Solas" target="_blank" rel="noopener">Share on X</a><a class="perma" href="../quote/09d701cb0b.html">Permalink</a><a class="src" href="https://reformedcovenanter.wordpress.com/2019/05/26/ebenezer-erskine-the-mosaic-covenant-was-not-a-covenant-of-works-simpliciter/" rel="noopener" target="_blank">Read it online · Reformed Covenanter</a></div>
</figure><figure class="quote" id="q-0fda161e6b" data-kw="">
<blockquote><p>Promises made to the Faithful and their Prerogatives l. The life, of which the promise is added to the observation of the law, is not only earthly and temporal, but also heavenly and eternal. … Rejection of the error of those: l. Who teach that the recompense of the legal covenant was such that its function was only natural and temporal.</p></blockquote>

</figure><figure class="quote" id="q-762b7e58fd" data-kw="">
<blockquote><p>We can never state our thoughts aright in this matter, unless we have a clear apprehension of, and satisfaction in, the introduction of grace by Jesus Christ into the whole of our relation unto God, with its respect unto all parts of our obedience. There was no such thing, nothing of that nature or kind, in the first constitution of that relation and obedience by the law of our creation. We were made in a state of immediate relation unto God in our own persons, as our creator, preserver, and rewarder. There was no mystery of grace in the covenant of works. No more was required unto the consummation of that state but what was given us in our creation, enabling us unto rewardable obedience. “Do this, and live,” was the sole rule of our relation unto God. There was nothing in religion originally of that which the gospel celebrates under the name of the grace, kindness, and love of God, whence all our favourable relation unto God doth now proceed, and whereinto it is resolved; nothing of the interposition of a mediator with respect unto our righteousness before God, and acceptance with him;—which is at present the life and soul of religion, the substance of the gospel, and the centre of all the truths revealed in it.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/john-owen.html">John Owen</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Works of John Owen</cite>, ed. William H. Goold, vol. 5 (Edinburgh: T&amp;T Clark, n.d.), 44–45.</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/the-covenant-of-works.html">The Covenant of Works</a></span></div>

</figure><figure class="quote" id="q-1d4fed99d8" data-kw="">
<blockquote><p>Because what God so severely punished must have been no light sin but a detestable crime, we must consider what kind of sin there was in Adam’s desertion that enkindled God’s fearful vengeance against the whole of mankind. To regard Adam’s sin as gluttonous intemperance (a common notion) is childish. As if the sum and head of all virtues lay in abstaining solely from one fruit, when all sorts of desirable delights abounded everywhere; and not only abundance but also magnificent variety was at hand in that blessed fruitfulness of earth! We must, therefore, look deeper than sensual intemperance. The prohibition to touch the Tree of Knowledge of good and evil was a trial of obedience (obedientiae examen), that Adam, by observing it, might prove his willing submission to the command of God. …The promise, which gave him hope of eternal life as long as he should eat of the tree of life (arbore vitae), and, on the other hand, the fearful denunciation of death the moment he should taste of the Tree of Knowledge of good and evil, were meant to test and exercise his faith.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/john-calvin.html">John Calvin</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Institutes of the Christian Religion</cite>, (1559), 2.1.4.</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/the-covenant-of-works.html">The Covenant of Works</a></span></div>

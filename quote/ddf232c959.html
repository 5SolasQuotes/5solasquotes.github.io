<blockquote><p>Some may not be used to thinking of God as an unmoved mover. Yet is not the first cause of all things God? If God is anything He is that. But many more attributes may be derived from the unmoved mover being pure act,ª which will show that we are dealing with God. ª This is not accidental. Just as (1) the attributes of a thing derive from its kind of existence, so (2) if God’s existence or being may be established and that it is of itself, or from itself (aseity), (3) its absoluteness, independence and primacy being herein established, (4) and everything else must flow out of this first principle and (5) must be systematically related to it, it ought to be expected that many attributes of the first principle may be further drawn out. See the footnote below on classic reformed theology and Mastricht. … While we could go on for some time deriving many of the attributes of the unmoved mover from nature’s light, such an exercise in natural theology is unnecessary here.° It is clear we are dealing with God. ° While classic reformed theology during the Post-Reformation varied with how far God’s attributes might be derived from nature’s light alone, especially with regard to epistemology after the Fall (in distinction from metaphysics from pure-nature), yet there is good reason, said Mastricht, to think “all the attributes of God are established in this primacy” of God’s being. All attributes of things depend upon and flow out of the characteristic being of the thing. If one establishes the greater, one establishes (at least theoretically) all the lesser. Thus if God’s “aseity [from Himself-ness], independence and primacy” (which things inhere from being pure act) are proved, from this may be deduced, according to Mastricht, God’s unity, immutability, infinity, simplicity, life, intellect, will, omnipotence and “the virtues of the intellect and will—wisdom, goodness, grace, holiness, and others…” Theoretical-Practical Theology, vol. 2, bk. 2, ch. 3, sect. 16, pp. 84-85 In most of the subsequent chapters on God’s attributes Mastricht has a specific section on how each attribute may be derived “from reasons”.</p></blockquote>

</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-8f505995d2" data-kw="">
<blockquote><p>Most of the work being done in the proof [by Wolter] is in conclusions 2 and 68-69 respecting reality, and in conclusions 1-3 of the Proof of God. Much of the argument through the rest is patterned off of those. To illustrate conclusions 2, 16-17 and 24: If anything is caused and comes into existence in changing reality around us, it does not have its reason for existence in itself; otherwise, if it did, it would always exist. This may be likened to a metal link hanging solitary in the air: nothing in the link itself can explain or provide the power for it hanging in the air. Connect to the link several more links, or an infinite chain of them. Yet nothing in the infinite chain can justify its hanging in the air. Form the chain into a circle: it still, of its own nature, can’t cause itself to float in the air. Yet that nothing can come from nothing, in order to account for this phenomenon, is plain. Something is yet causing the chain to be suspended in the air and to exist. That something must be (1) able to cause (so as to hold the chain in the air, or in being), and (2) cause all other things needing a cause, that is all things besides itself (or else it would be a part of the chain). Yet as it cannot be one more link in the chain, needing a further cause, it must be uncaused. The very existence of a cause necessitates that a causer, which is uncaused, exists. In the scenario above, with a few explanations and adjustments, one may replace the relevant terms with: transient / permanent temporal / eternal changeable / unchangeable dependent / independent contingent / necessary relative / absolute composite / simple finite / infinite imperfect / perfect Hence if something transient, temporal, changeable, etc. exists, so must something permanent, eternal, unchangeable, etc.; in fact, something infinitely necessary, absolute and perfect must exist. But it is undeniable by one’s own experience that something transient or changeable, etc. exists, or may exist (which possibility will reach the same conclusion). This we call God. As all perfections must be in God, infinitely, as Wolter will show, God must be personal. All the terms of the above pairs are attributes (or properties) of being. As they are contradictory opposites with respect to being, all being may be divided amongst the opposite terms of each pair. Hence Wolter calls these pairs, “disjunctive attributes of being”. He will show that if being of the less perfect term of the pair exists, or can exist, some being of the opposite term must exist (conclusions 68-69).</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/travis-fentiman.html">Travis Fentiman</a></span><span class="wk"><span class="lbl">Work:</span> <cite>‘Allan Wolter’s Conclusions respecting Reality, Proving God’, Intro, ‘The Proof’</cite></span></figcaption>

</figure><figure class="quote" id="q-6f01bb37e2" data-kw="without beginning">
<blockquote><p>God is without beginning. “In the beginning God created” the world, Gen. 1:1. God was then before the beginning of it; and what point can be set wherein God began, if he were before the beginning of created things? God was without beginning, though all other things had time and beginning from him. As unity is before all numbers, so is God before all his creatures.</p></blockquote>

<blockquote><p>The metaphysical essence of God is constituted by His aseity Proof: The concept of self-existent being, or omnimodal aseity can be understood in the following manner: 1. It is that which is conceived as the first and foremost in God. 2. It is the primary distinguishing characteristic of God from all other things. 3. It serves as the fundamental root of God’s attributes. Therefore, aseity constitutes the metaphysical essence of God; this is the proper understanding of the metaphysical essence. Regarding the first part, this is evident because any other perfection or attributes attributed to God, such as being wise, eternal, infinite, cannot be conceived as truly divine without aseity, which means complete independence from anything else. Additionally, no other attribute can be assigned from which aseity itself could be derived. As for the second part, this is because by His aseity, God is first and immediately distinguished from creatures, which exist from another as a cause. God is conceived as having the power to emanate from Himself or, rather, to contain within Himself all other divine perfections or attributes. As St. Thomas puts it, “God is existence itself, of itself subsistent. Consequently, He must contain within Himself the whole perfection of being.” (Summa Theologiæ, Prima Pars, q. 4, a. 2) Concerning the third part, it follows from the fact that God is being from Himself and by Himself, and that He has no cause for limitation, and therefore necessarily possesses all possible perfections, which are the divine attributes themselves. Therefore, all these attributes are conceived to flow forth from His aseity as their primary source.</p></blockquote>

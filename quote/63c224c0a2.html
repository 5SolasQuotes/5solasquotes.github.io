<blockquote><p>The state of the controversy is: Whether in church buildings of Christians images are to be tolerated, and also whether organs ought to be used? They affirm; we deny.</p></blockquote>

</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-ebc7ade868" data-kw="">
<blockquote><p>Next you [Gilbert Burnet] inquire, Why do you [Scottish non-conformists] not anoint the sick with oil? I answer, though you address this demand to a non-conformist, yet it is evident that your conclusion of deformity to the Scripture pattern thence inferred, is equally levelled against the whole Protestant Church, wherein this ceremony is universally disused, and that not from your vain warrant of the Church’s authority in and over things expressly commanded, as you judge this rite to be; No, this is a presumption so high, and lax, that even the grossest Papists are unwilling to avouch it; But the sound answer of all the Churches is that, as the custom of anointing might have been occasioned from an observance then in use in these parts, where anointings were much more ordinary than in our parts of the world, so it is mentioned in the Scripture by the apostle James, not by way of command, but as the accustomed symbol adhibite[d] in the exercise of the gift of healing, which being then ordinary in the Church, is commanded to be applied by the prayer of faith, whereunto the effect is solely referred, and only with the formality of anointing, as being then customary in the like cases. Seeing then that the text runs clearly thus, ‘Is any sick? Let him call the elders, and let them pray over him anointing him with oil in the name of the Lord, and the prayer of faith shall save the sick;’ and that the application of the extraordinary gift of healing by prayer, with the then us […]all circumstance of anointing […] is here only enjoined, how can you make this text binding as to the manner and circumstance, when you cannot but acknowledge that the substance, viz. the power of healing, is ceased? But having made your non-conformist say that the apostle promises recovery upon the anointing, you turn to fight with your own shadow, and tell him there is no such matter, that the recovery is promised to prayer, and also forgiveness; and seing we pray by all for their raising up, and that they may be forgiven, why do we not as well anoint? But, what logic can make out this consequence inasmuch as anointing, being there only spoken of as the concomitant rite used in the application of the gift of healing, it is manifest that without the existence and exercise of the gift itself, it is not now to be repeated; and therefore though prayer be principally commanded as the special mean, by which even the gift of miracles was actuate[d] and made effectual, and to this day does remain as the great one by which all the promises either for raising up or remission are drawn out unto effect; yet thence to infer that anointing, a peculiar solemnity in the gift of healing, should still continue, notwitstanding the gift itself be ceased, is very absurd: Now, that anointing was an ordinary observance in the exercise of the gift of healing, you may read it clearly in the disciples’ practice, Mk. 6:13. And they anointed with oil many that were sick and healed them. This being then the just and true account, not only of our practice, but also of that of the whole reformed Churches, how vain and ridiculous are you to tell us, that our pretence of Scripture is but to impose on women and simple people, and all our persuasion, grave nods and big words: but leaving you to puff petulantly where you can prove nothing.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/robert-macward.html">Robert MacWard</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The True Non-Conformist</cite>, … (1671), 3rd Dialogue, pp. 117-19</span></figcaption>

<blockquote><p>It is a contradiction that an action-individual should be indifferent, and so neither good nor evil, and yet done in faith and referred to God’s glory: For the ground of doing, which is faith, and the end, which is God’s glory, are individual properties necessarily concurring to the individuation of the action-moral.

2. An action-individual that is merely indifferent, and so without sin, may be performed without sin or omitted without sin, cannot be an action of faith referred to God’s glory: For what may be done without sin and may not be done without sin, is a will-action, and wants all necessity of reason, and so is an idle and sinful action; but a sinful action may be done in fancy, but in faith it cannot be done; it may in the vain intention of the doer be referred to God’s glory, in intentione erronea operantis, but ex conditione operis, according to the nature of the work, it serves not for God’s glory. This way to cast stones in the water [for example], should be of faith, and referred to God’s glory: But shall I believe I am doing in faith and glorifying God when I am casting stones in the water, and I have as good reason not to cast at all? If one will-action that may be done, and may not be done, may be of faith and referred to God’s glory, then may they all be of faith and referred to God’s glory: This is a laughter, rather than divinity.

3. I cannot believe that an action that has as good reason to be omitted as to be done, can be acceptable to God, because I have no ground for my faith; for my faith here leans neither on Scripture nor on Reason; but there is no reason why the action should rather be, nor not be, because it is indifferent; yea, crossing and kneeling [as worship] of themselves shall be of faith, because I believe them to be of faith: But it is a vain thing to say that faith makes its object.

4. There are no actions in the world but they have all their moral necessity from their intrinsic goodness: For from whence is it necessary to love God, but from the intrinsic goodness that the love of God has from God’s command? For there is no necessity an action to be at all; yea, it is idle and superfluous if there be no goodness in it at all. If then crossing and kneeling (laying aside the respect of humane laws commanding them) have no necessity-moral from any commandment of God why they should be at all, their necessity must be all from man’s will: this is tyranny in rulers for their sole pleasure to command under the heaviest pain things that have no necessity at all but their will.

5. Neither is it any yoke to men’s conscience, to square all their moral-action by God’s Word and so to see (‘according as it is written’) before they venture upon any action-moral. It is liberty to keep God’s way accurately.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/samuel-rutherford.html">Samuel Rutherford</a></span><span class="wk"><span class="lbl">Work:</span> <cite>‘An Introduction to the Doctrine of Scandal’ in The Divine Right of Church Government</cite>, ... (1646), p. 653</span></figcaption>

because+it+is+indifferent%3B+yea%2C+crossing+and+kneeling+%5Bas+worship%5D+of+themselves+shall+be+of+faith%2C+because+I+believe+them+to+be+of+faith%3A+But+it+is+a+vain+thing+to+say+that+faith+makes+its+object.+4.+There+are+no+actions+in+the+world+but+they+have+all+their+moral+necessity+from+their+intrinsic+goodness%3A+For+from+whence+is+it+necessary+to+love+God%2C+but+from+the+intrinsic+goodness+that+the+love+of+God+has+from+God%E2%80%99s+command%3F+For+there+is+no+necessity+an+action+to+be+at+all%3B+yea%2C+it+is+idle+and+superfluous+if+there+be+no+goodness+in+it+at+all.+If+then+crossing+and+kneeling+%28laying+aside+the+respect+of+humane+laws+commanding+them%29+have+no+necessity-moral+from+any+commandment+of+God+why+they+should+be+at+all%2C+their+necessity+must+be+all+from+man%E2%80%99s+will%3A+this+is+tyranny+in+rulers+for+their+sole+pleasure+to+command+under+the+heaviest+pain+things+that+have+no+necessity+at+all+but+their+will.+5.+Neither+is+it+any+yoke+to+men%E2%80%99s+conscience%2C+to+square+all+their+moral-action+by+God%E2%80%99s+Word+and+so+to+see+%28%E2%80%98according+as+it+is+written%E2%80%99%29+before+they+venture+upon+any+action-moral.+It+is+liberty+to+keep+God%E2%80%99s+way+accurately.%E2%80%9D%0A%0A%E2%80%94+Samuel+Rutherford%2C+%E2%80%98An+Introduction+to+the+Doctrine+of+Scandal%E2%80%99+in+The+Divine+Right+of+Church+Government%2C+...+%281646%29%2C+p.+653&amp;url=https%3A%2F%2F5solasquotes.github.io%2Fquote%2Fbf17dd8e89.html&amp;via=5Solas" target="_blank" rel="noopener">Share on X</a><a class="perma" href="../quote/bf17dd8e89.html">Permalink</a><a class="src" href="https://reformedbooksonline.com/on-things-indifferent-adiaphora/#:~:text=It%20is%20a%20contradiction%20that%20an,liberty%20to%20keep%20God%E2%80%99s%20way%20accurately&amp;text=It%20is%20a%20contradiction%20that%20an%20action%2Dindividual%20should&amp;text=It%20is%20liberty%20to%20keep%20God%E2%80%99s%20way%20accurately" rel="noopener" target="_blank">Read it online · Reformed Books Online</a></div>
</figure><figure class="quote" id="q-f3d2fda4ac" data-kw="">
<blockquote><p>23rd Question. After the ministry of the Word and the seals thereof, how is the collection for the saints to be administered? Answer. The collection for the saints was by the apostles’ ordinance, to be made: for the time, every Lord’s Day; for the measure, as God has prospered every man; for the manner, not of constraint, but freely and willingly, brought by the givers as an offering to the Lord, and laid down, as at first before the apostles, so afterwards by their appointment before the deacons of the Church as into a common treasury, by them to be distributed to the supply of the ministry, and of the poor saints, according to their need, and of outward service of the Church.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/john-cotton.html">John Cotton</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Doctrine of the Church</cite>, … (London, 1644), p. 8</span></figcaption>

</figure><figure class="quote" id="q-edbc3687c1" data-kw="">
<blockquote><p>I respond that it was a part of the obedience to the divinely given ceremonial laws until the death of Christ, and a fulfilling of the time of correction (Col. 2; Heb. 9). But by the death of Christ, it being one with the other ceremonials, became defunct as to observing it in conscience, yet not however until it had an honest funeral, but from reason of the scandal of the weak from amongst the circumcision, some of them were to observe them in parts till the Jews may be fully and plainly convicted of the cessation of the ceremonial law.</p></blockquote>

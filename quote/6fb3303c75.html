<main class="wrap"><figure class="quote" id="q-6fb3303c75" data-kw="">
<blockquote><p>Because the Lord’s-day is the special time for religious duties, I shall therefore, reader, give thee here some particular directions for thy sanctification of it, and edification by it. As of all actions, none call for more care than holy duties; so of all seasons for those actions, none commandeth so much caution and conscience as the Lord’s-day.

The first command teacheth us the object of worship; the second, the matter of worship; the third, the manner of worship; the fourth, the time of worship. That God is to be worshipped, that some time must be set apart for that work, is moral natural, and written on the tables of all our hearts; but that one day of seven must be consecrated to this end, is moral positive, and written on the tables of stone.

All nations have had their seasons for sacrifice; even the heathen, who worshipped dumb idols, had their festivals and holidays. It is reported of Alexander Severus, emperor of Rome, that he would on a Sabbath-day lay aside his worldly affairs, and go into the capitol to worship his gods. Among those that acknowledged the true God, the Turks have their stata tempora—set times of devotion—nay, they have their Friday-Sabbath.

But to keep the Lord’s-day upon a conscientious ground, and in a religious manner, is peculiar to the true Christian. In the primitive times, the observation of this day was esteemed the principal sign of a saint. Indeed, our sanctification of it is by God himself counted a sign that he hath sanctified us, Exod. xxxi. 13.

It is observable that God hath fenced this command with more hedges than ordinary, to prevent our excursions:

1. It is marked with a memento above other commands, ‘Remember the Sabbath-day, to keep it holy,’ partly because of our forgetfulness, and partly because of its concernments.

2. It is delivered both negatively and affirmatively, which no other command is, to shew how strongly it binds.

3. It hath more reasons to enforce it than any other precept,—its equity, God’s bounty, his own pattern, and the day’s benediction.

4. It is put in the close of the first, and beginning of the second table, to note that the observation of both tables depends much upon the sanctification of this day.

It is considerable also, that it is more repeated than other of the commands, Exod. xx. 8, xxxi. 14-16, xxxv. 2 ; Levit. xvi. 31, xxiii. 3, 32.

God would have Israel know, in those forequoted places, that their busiest times, earing and harvest, and the very building of the tabernacle, must give way to this precept.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/george-swinnock.html">George Swinnock</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Christian Man’s Calling</cite>, (1661-65) in The Works of George Swinnock, M.A. (5 vols, Edinburgh: James Nichol, 1868), 1: 222-23.</span></figcaption>

<blockquote><p>We would beware of forming Ideas, representations, or shapes of that One God and Three Persons in the heart, or in the head: these cannot but be derogatory to Him, being a likeness to Him of our own up-setting in our hearts: and cannot but diminish that Authority, which the true God should have in our hearts. We would remember therefore that He is purely Spiritual, whom no eye hath seen, nor can see: and therefore all such imaginations, are to be abandoned and abhorred. …

We would beware of dividing the Object of Worship, or separating the Three blessed Persons in our worshipping of them, even in our imagination; as if when One is named, we were not praying unto, and worshipping both the other; and as if the Son were an other God than the Father or Spirit, &amp;c. But still this would be remembered, that what ever Person be named, He is God, and that same One God with the other Two: and therefore the Object of Worship, is ever the same One God, Father, Son, and Spirit, that are but One God.

We Worship the Father, the Son, and the Spirit; but we do not Worship the Father, or the Son, or the Spirit, as if He who is not named, were less worshipped than He who is named: and seeing the Son and holy Ghost, are the same God with the Father (the former ground being laid) it’s all one thing what ever Person be named, though in Scripture sometimes respect is had to their order of subsisting and operating; and so the Father is only named sometimes to be the ground upon, and by which, we have access to God; and so, the Son, only is named.</p></blockquote>

<blockquote><p>Having his head covered; i.e. with a hat or cap, or such covering of the head as is in use in the country wherein he lives. It is not to be understood of the natural covering of the head, which is our hair; nor yet of any other covering which is necessary for the preservation of life and health; but such a covering as he might spare, and is ornamental to him according to the fashion of the country… Dishonoureth his head; …Interpreters rightly agree, that this and the following verses are to be interpreted from the customs of countries; and all that can be concluded from this verse is, that it is the duty of men employed in divine ministrations, to look to behave themselves as those who are to represent the Lord Jesus Christ, behaving themselves with a just authority and gravity that becometh his ambassadors, which decent gravity is to be judged from the common opinion and account of the country wherein they live. So as all which this text requires of Christian ministers, is authority and gravity, and what are external ludications of it. Our learned Dr. Lightfoot observes, that the Jewish priests were wont in the worship of God to veil their heads; so that Christian ministers praying or prophesying with their heads covered, Judaized, which he judges the reason of the apostle’s assertion. The heathens also, both Romans and Grecians, were wont to minister in their sacred things with their heads covered. Some think this was the reason why the Christians used the contrary gesture; but the apostle’s arguing from the man’s headship, seems to import that the reason of this assertion of the apostle was, because in Corinth the uncovered head was a sign of authority. At this day the Mahometans (or Turks) speak to their superiors covered, and so are covered also in their religious performances. The custom with us in these western parts is quite otherwise; the uncovering of the head is a sign or token of subjection: hence ministers pray and preach with their heads uncovered, to denote their subjection to God and Christ: but yet this custom is not uniform, for in France the Reformed ministers preach with their heads covered; as they pray uncovered, to express their reverence and subjection to God, so they preach covered, as representing Christ, the great Teacher, from whom they derive, and whom they represent. Nothing in this is a further rule to Christians, than that it is the duty of ministers, in praying and preaching, to use postures and habits that are not naturally, nor according to the custom of the place where they live, uncomely and irreverent, and so looked upon. It is only the general observation of decency (which cannot by any be created, but arises either from nature, or custom, and prescription) which this text of the apostle makes to be the duty of all Christians; though as to the Corinthians, he particularly required the man’s ministering in sacred things with his head uncovered, either to avoid the habit or posture used by Jews and pagans; or for the showing of his dignity and superiority over the woman, (whom we shall by and by find commanded to pray or prophesy covered), or that he represented Christ who was the Head of the church. The uncovering of the head being with them as much a sign of subjection, as it is with us of superiority and pre-eminence.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/matthew-poole.html">Matthew Poole</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Annotations on 1 Cor. 11</cite>, v. 4</span></figcaption>

isters pray and preach with their heads uncovered, to denote their subjection to God and Christ: but yet this custom is not uniform, for in France the Reformed ministers preach with their heads covered; as they pray uncovered, to express their reverence and subjection to God, so they preach covered, as representing Christ, the great Teacher, from whom they derive, and whom they represent. Nothing in this is a further rule to Christians, than that it is the duty of ministers, in praying and preaching, to use postures and habits that are not naturally, nor according to the custom of the place where they live, uncomely and irreverent, and so looked upon. It is only the general observation of decency (which cannot by any be created, but arises either from nature, or custom, and prescription) which this text of the apostle makes to be the duty of all Christians; though as to the Corinthians, he particularly required the man’s ministering in sacred things with his head uncovered, either to avoid the habit or posture used by Jews and pagans; or for the showing of his dignity and superiority over the woman, (whom we shall by and by find commanded to pray or prophesy covered), or that he represented Christ who was the Head of the church. The uncovering of the head being with them as much a sign of subjection, as it is with us of superiority and pre-eminence.”

— Matthew Poole, Annotations on 1 Cor. 11, v. 4">Copy</button><a class="share" href="https://x.com/intent/post?text=%E2%80%9CHaving+his+head+covered%3B+i.e.+with+a+hat+or+cap%2C+or+such+covering+of+the+head+as+is+in+use+in+the+country+wherein+he+lives.+It+is+not+to+be+understood+of+the+natural+covering+of+the+head%2C+which+is+our+hair%3B+nor+yet+of+any+other+covering+which+is+necessary+for+the+preservation+of+life+and+health%3B+but+such+a+covering+as+he+might+spare%2C+and+is+ornamental+to+him+according+to+the+fashion+of+the+country%E2%80%A6+Dishonoureth+his+head%3B+%E2%80%A6Interpreters+rightly+agree%2C+that+this+and+the+following+verses+are+to+be+interpreted+from+the+customs+of+countries%3B+and+all+that+can+be+concluded+from+this+verse+is%2C+that+it+is+the+duty+of+men+employed+in+divine+ministrations%2C+to+look+to+behave+themselves+as+those+who+are+to+represent+the+Lord+Jesus+Christ%2C+behaving+themselves+with+a+just+authority+and+gravity+that+becometh+his+ambassadors%2C+which+decent+gravity+is+to+be+judged+from+the+common+opinion+and+account+of+the+country+wherein+they+live.+So+as+all+which+this+text+requires+of+Christian+ministers%2C+is+authority+and+gravity%2C+and+what+are+external+ludications+of+it.+Our+learned+Dr.+Lightfoot+observes%2C+that+the+Jewish+priests+were+wont+in+the+worship+of+God+to+veil+their+heads%3B+so+that+Christian+ministers+praying+or+prophesying+with+their+heads+covered%2C+Judaized%2C+which+he+judges+the+reason+of+the+apostle%E2%80%99s+assertion.+The+heathens+also%2C+both+Romans+and+Grecians%2C+were+wont+to+minister+in+their+sacred+things+with+their+heads+covered.+Some+think+this+was+the+reason+why+the+Christians+used+the+contrary+gesture%3B+but+the+apostle%E2%80%99s+arguing+from+the+man%E2%80%99s+headship%2C+seems+to+import+that+the+reason+of+this+assertion+of+the+apostle+was%2C+because+in+Corinth+the+uncovered+head+was+a+sign+of+authority.+At+this+day+the+Mahometans+%28or+Turks%29+speak+to+their+superiors+covered%2C+and+so+are+covered+also+in+their+religious+performances.+The+custom+with+us+in+these+western+parts+is+quite+otherwise%3B+the+uncovering+of+the+head+is+a+sign+or+token+of+subjection%3A+hence+ministers+pray+and+preach+with+their+heads+uncovered%2C+to+denote+their+subjection+to+God+and+Christ%3A+but+yet+this+custom+is+not+uniform%2C+for+in+France+the+Reformed+ministers+preach+with+their+heads+covered%3B+as+they+pray+uncovered%2C+to+express+their+reverence+and+subjection+to+God%2C+so+they+preach+covered%2C+as+representing+Christ%2C+the+great+Teacher%2C+from+whom+they+derive%2C+and+whom+they+represent.+Nothing+in+this+is+a+further+rule+to+Christians%2C+than+that+it+is+the+duty+of+ministers%2C+in+praying+and+preaching%2C+to+use+postures+and+habits+that+are+not+naturally%2C+nor+according+to+the+custom+of+the+place+where+they+live%2C+uncomely+and+irreverent%2C+and+so+looked+upon.+It+is+only+the+general+observation+of+decency+%28which+cannot+by+any+be+created%2C+but+arises+either+from+nature%2C+or+custom%2C+and+prescription%29+which+this+text+of+the+apostle+makes+to+be+the+duty+of+all+Christians%3B+though+as+to+the+Corinthians%2C+he+particularly+required+the+man%E2%80%99s+ministering+in+sacred+things+with+his+head+uncovered%2C+either+to+avoid+the+habit+or+posture+used+by+Jews+and+pagans%3B+or+for+the+showing+of+his+dignity+and+superiority+over+the+woman%2C+%28whom+we+shall+by+and+by+find+commanded+to+pray+or+prophesy+covered%29%2C+or+that+he+represented+Christ+who+was+the+Head+of+the+church.+The+uncovering+of+the+head+being+with+them+as+much+a+sign+of+subjection%2C+as+it+is+with+us+of+superiority+and+pre-eminence.%E2%80%9D%0A%0A%E2%80%94+Matthew+Poole%2C+Annotations+on+1+Cor.+11%2C+v.+4&amp;url=https%3A%2F%2F5solasquotes.github.io%2Fquote%2F538ab8b4d5.html&amp;via=5Solas" target="_blank" rel="noopener">Share on X</a><a class="perma" href="../quote/538ab8b4d5.html">Permalink</a><a class="src" href="https://reformedbooksonline.com/the-history-of-head-coverings/head-coverings-in-the-post-reformation-era/#:~:text=Having%20his%20head%20covered%3B%20i.e.%20with,with%20us%20of%20superiority%20and%20pre%2Deminence&amp;text=Having%20his%20head%20covered%3B%20i.e.%20with%20a%20hat&amp;text=it%20is%20with%20us%20of%20superiority%20and%20pre%2Deminence" rel="noopener" target="_blank">Read it online · Reformed Books Online</a></div>

<blockquote><p>II. Should saints and angels be invoked? No.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/johannes-hoornbeeck.html">Johannes Hoornbeeck</a></span><span class="wk"><span class="lbl">Work:</span> <cite>‘A Practical Theological Disputation on Sin, pt. 2’</cite>, tr. Onku with AI (Leiden: Johann Elsevir, 1660), Corollaries Latin</span></figcaption>

<div class="actions"><button class="copy" data-copy="“II. Should saints and angels be invoked? No.”

</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-f54649e8d6" data-kw="">
<blockquote><p>([Margin Note:] What sort of influences we are to seek from God) But this is also a tempting of God:

1. We are not to pray for influences-physical simply and absolutely for all uses and ends to work miracles, to remove mountains, but especially we are to pray for more influences and such as are suitable to our ordinary duties: Ps. 119:36, ‘Incline my heart’ (but he suits not of God every bowing of the heart abstracted from the Word) ‘incline my heart unto thy testimonies and not to covetousness.’ Verse 133, ‘Order my heart in thy steps; let not any iniquity have dominion over me.’

2. David seeks not every sort of quickening influences, but Ps. 119:25, ‘Quicken Thou me according to thy Word.’ Verse 40, ‘Quicken me in thy righteousness.’ Verse 88, ‘Quicken me after thy loving kindness.’ Verse 149, ‘O Lord, quicken me according to thy judgement.’ Verse 156 and 116, ‘Uphold me according to thy word, that I may live.’ Quakers and Familists seek after the furious wild-fire of hell, skaddings and flamings of a spirit abstracted from the Word…</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/samuel-rutherford.html">Samuel Rutherford</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Influences of the Life of Grace</cite>, (London, 1659), p. 94</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/prayer/nature-and-necessity-of-prayer.html">Nature and Necessity of Prayer</a></span></div>
<div class="actions"><button class="copy" data-copy="“([Margin Note:] What sort of influences we are to seek from God) But this is also a tempting of God:

20Word" rel="noopener" target="_blank">Read it online · Reformed Books Online</a></div>
</figure><figure class="quote" id="q-7ccd6764ee" data-kw="">
<blockquote><p>We do not reject the commemoration or honorable mention of the dead saints, nor an annual thanksgiving for those who have departed in the faith of Christ: besides we have acknowledged that we may pray for a blessed resurrection, for a public absolution in the day of judgment and the perfect happiness of deceased believers, without any superstition. Hence that solemn prayer in our English [Anglican] Church, when the dead are conveyed to the tomb: ‘Almighty God… beseeching Thee, that it may please Thee of thy gracious goodness shortly to accomplish… that we, with all those who are departed in the true faith of thy holy name, may have our perfect consummation and bliss, both in body and soul, in they eternal and everlasting glory, etc.&#x27;</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/john-davenant.html">John Davenant</a></span><span class="wk"><span class="lbl">Work:</span> <cite>‘The Prayers of the Papists for the Dead are Vain’</cite>, p. 222 in The Determinations, or Resolutions of Certain Theological Questions, Publicly Discussed in the University of Cambridge trans. Josiah Allport (1634; 1846) bound at the end of John Davenant, A Treatise on Justification, or the Disputatio de Justitia... trans. Josiah Allport (1631; London, 1846), vol. 2</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/prayer/nature-and-necessity-of-prayer.html">Nature and Necessity of Prayer</a></span></div>

<main class="wrap"><figure class="quote" id="q-bf19c49251" data-kw="">
<blockquote><p>HOW dreadful must the state of the Egyptians have been, when for three days they were enveloped in a darkness which might be felt; so that they saw not one another, neither rose any from his place. To be doomed to remain in this condition for years, or through the whole of life who can endure the very thought? But to dwell amidst the horrid gloom of spiritual darkness, without one beam of divine revelation discovering the way of salvation by Jesus Christ, is a more deplorable case. Such, however, has been the miserable lot of the greater part of mankind, from generation to generation, and it is their lot still.

On the other hand, how pleasing it is to have the light of the glorious Gospel of the blessed God shining into the mind; and this light increasing more and more unto the perfect day. This privilege is enjoyed by you, and I pray that it may be suitably improved. Earnestly should every Christian, while he seeks to derive from it the highest personal benefit, desire that it may be diffused over the face of the whole earth: that as the sun in the firmament visits in his course every part of the globe, the whole of the rational world may be enlightened with the beams of the Sun of righteousness. Rejoice with me, my brethren, that this shall come to pass, for the infallible Spirit of God hath declared, “that the earth shall be full of the knowledge of the Lord as the waters cover the sea.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/david-bogue.html">David Bogue</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Discourses on the Millennium</cite>, (London: T. Hamilton, 1818), pp 23-24.</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/creation.html">Creation</a></span></div>

</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-643453b65e" data-kw="">
<blockquote><p>All creatures and created beings compared with God, the first being of Himself subsisting, and the infinite God may be denied, to be beings comparatively: And so our created self is nothing, to wit, nothing in dignity, or excellency beside God, or nothing in the kind of a being that essentially is of itself: as God is in genere entis per essentiam, yet man is a being in the kind of being by participation, in genere entis per participationem; man comared with God, is a poor, worthless, sorry, little-nothing, a weeping, melting, evanishing cipher… So the Scripture says, ‘Man at his best state is altogether vanity.’ Ps. 39:5, ‘Behold, thou hast made my days as a handbreadth, and mine age is nothing before thee: verily every man at his best state is altogether vanity.’ Isa. 40:17, ‘All nations before Him are nothing, and less than nothing, and vanity.’ Yet a heathen may say and think and demonstrate by reason that self and man, and all the world are less in incomparison of the infinite God than nothing to all things, a drop of water to the sea, the shadow to the body, a peny-torch to the light of ten thousand millions of suns in one;</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/samuel-rutherford.html">Samuel Rutherford</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Christ Dying &amp; Drawing Sinners to Himself</cite>, … (London: 1647), pt. 2, p. 359</span></figcaption>

</figure><figure class="quote" id="q-3a1e2cddfe" data-kw="">
<blockquote><p>Creation is a work of God, by which he has brought forth all creatures of nothing (Gen 1.2) A creature is whatsoever has been made by God of nothing. Now all the creatures of God were created very good. Therefore all nature, as it is nature, is good because it is the work of God. Of these creatures some are created according to the image of God; some are not. The image of God is that dignity and excellency in which the reasonable creatures, begin created like unto God, do excel other creatures. Of this image of God there are two parts: perfect reason and perfect blessedness. Perfect reason is is a part of God’s image, by which the reasonable creature does more expressly carry the image of God his creator, while by a certain divine force it knows plainly things without error, as they are, and does will and choose no other tuning that which does please God. And that perfect reason consists both in the mind and in the will.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/amandus-polanus.html">Amandus Polanus</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Partitiones theologiae translated as The Substance of the Christian Religion</cite>, (London, 1595). Spelling modernized.</span></figcaption>

<main class="wrap"><figure class="quote" id="q-dbe612dc35" data-kw="">
<blockquote><p>But the conjunction between the sign and the reality signified is made by the force and power of the Holy Spirit alone. Through Him, Jesus Christ, who, as Scripture testifies, as a man is in Heaven and nowhere else, is as truly given to us, to us who are on the earth, as the signs which are used in the Sacraments.

Thus, as the promise expressly assures us, our faith contemplates Him in the Sacraments, and climbs up to heaven to embrace Him more and more and joins us to Him.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/theodore-beza.html">Theodore Beza</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Christian Faith</cite>, trans. James Clark (1558; Edinburgh, 2016), 4.44, p. 51.</span></figcaption>

</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-f213479f08" data-kw="">
<blockquote><p>But for Christians, I advise you, in reading the prophets and apostles concerning Christ and his sufferings, to make use of this as a key to open up all, as a light that enlightens all — That all the sufferings of Christ were laid on him, and endured by him, and presented unto God, as he did represent his guilty people; otherwise justice could not exact on him, nor his people be saved by them. See how Christ expresseth this in the celebration and institution of his last supper. He taketh, blesseth, breaketh, and giveth bread, and calls it, my body given for you. Likewise also the cup after supper, saying, “This cup is the new testament in my blood, which is shed for you,” Luke xxii. 19, 20.

I do not mind the antichristian synagogue, (for a church it is not, but in an usurped name, or in a vain notion,) who have abused and perverted these plain and easy words, more than devils or men did ever pervert any words of God or man before; and have, upon that abuse of them, set up the grossest idol that ever a heathen worshipped; for such as worship sun, and moon, and the host of heaven, have God’s glorious workmanship before their eyes; yea, the Egyptians’ garden and herb gods are preferable greatly to a bit of paste, kneaded and baked by a baker in his oven, conjured into a pitiful godhead by the mumbling of a priest, and first worshipped, and then swallowed down as other food, by the besotted people. Nothing less than the dreadful wrath of God can be in men’s believing this lie, that the man’s reason and all his senses militate against, 2 Thess. ii. 10—12.

But many that are not infected with this strong delusion, understand no more by Christ’s words in this sacred ordinance, than that the bread and wine, so used as Christ appointed, do signify the sufferings unto death of our Lord Jesus Christ, cruelly handled by wicked men, and severely dealt with by the justice of God; but the cause and end of his death, they mind not. This Christ puts us in mind of, in these words: “For you, and for your sins, and for the remission of them; you, and your sins, are the cause of my death: and my death is the cause of your forgiveness.” Christians, if you keep out that word, for you; if your faith do not echo to Christ’s for you, with your for me, I assure you, that the bread and wine on the Lord’s table, and the same food on your own table, will be of equal signification, as to soul-nourishment; and that is, none at all.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/robert-traill.html">Robert Traill</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Sixteen Sermons on the Lord’s Prayer, in John xvii. 24</cite>, (1705) in The Works of Robert Traill, A.M. Minister of the Gospel in London (4 vols, Edinburgh: J. Ogle, 1810), 2: 227-28.</span></figcaption>

</figure><figure class="quote" id="q-76c794adda" data-kw="">
<blockquote><p>Q. Why is faith required [to rightly receive communion]?

A. Because well we may eat the Bread, and drink the wine without faith; but we cannot eat Christ’s body, and drink his Blood without faith.

True; for the eating of his Body is a spiritual eating, and the drinking of his Blood is a spiritual drinking, consisting in meditation of the wonderful love of GOD the Father, who to save our souls, spared not his own Son: The wonderful love of God the Son, who to save our souls, spared not his own self but gave himself to suffer a shameful death, a bitter death, and an accursed death for our sins: He is the love of Christ that passeth knowledge: such is the breadth and the length and depth, and height of it, that we are not able sufficiently to comprehend it.

And like as the body by feeding and drinking, doth gather strength to the better performance of all actions of nature: so the soul of a Christian by meditation on this love of Christ in giving his body to be crucified, and his blood to be shed for our sins, doth gather more and more strength continually for the better performance of all actions of grace; whether they be actions of dependence, to depend upon him, and put our trust in him in all states, in all conditions, even in the time of affliction, and persecution, and at the very house of death; Or whether they be actions of conformity to his will, in obeying him, and walking in the ways of his commandments unto the end?</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/william-twisse.html">William Twisse</a></span><span class="wk"><span class="lbl">Work:</span> <cite>A Brief Catechetical Exposition of Christian Doctrine</cite>, (London, 1633), pp 10-11.</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/the-lords-supper.html">The Lord&#x27;s Supper</a></span></div>

</figure><figure class="quote" id="q-faa49b0340" data-kw="">
<blockquote><p>By reason, therefore, of this laver of repentance and knowledge of God, which has been ordained on account of the transgression of God’s people, as Isaiah cries, we have believed, and testify that that very baptism which he announced is alone able to purify those who have repented; and this is the water of life. But the cisterns which you have dug for yourselves are broken and profitless to you. For what is the use of that baptism which cleanses the flesh and body alone? Baptize the soul from wrath and from covetousness, from envy, and from hatred; and, lo! the body is pure. For this is the symbolic significance of unleavened bread, that you do not commit the old deeds of wicked leaven. But you have understood all things in a carnal sense, and you suppose it to be piety if you do such things, while your souls are filled with deceit, and, in short, with every wickedness. Accordingly, also, after the seven days of eating unleavened bread, God commanded them to mingle new leaven, that is, the performance of other works, and not the imitation of the old and evil works.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/justin-martyr.html">Justin Martyr</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Dialogue with Trypho the Jew</cite>, Ch. 14, Righteousness is Not Placed in Jewish Rites, but in the Conversion of the Heart Given in Baptism by Christ.</span></figcaption>

<blockquote><p>4thly, Ye may not deny your covenant-engagements; ye may, by no means, deny the covenant you have solemnly sworn. For David gives it as a mark of the man that shall dwell on that high and holy hill; that he is a man that will not swear, nor forswear; he will not break his oath, though it should be to his hurt. So, ye must not deny your covenant, though it should be to your hurt; though it should be to the loss of houses, lands, goods, &amp;c.; yea, and your own life also. It is said, “They like Adam have transgressed the covenant.” Many a time the Lord charges this sin upon the people of Israel by the prophets. Now we must tell you in the name of the Lord this day, that ye should beware of breaking the covenant. In the name and by the authority of the Lord Jesus, we debar and excommunicate all such from the table of the Lord, as are not resolved to adhere to these covenants that the lands are under to the most high God.</p></blockquote>

<main class="wrap"><figure class="quote" id="q-192dc16522" data-kw="">
<blockquote><p>Remember now, that every time thou art to go to worship God, thou art to set thy self as in his immediate presence, to have to deal with that infinite holy God whose pure eyes cannot endure to behold least iniquity; that God that is so Holy that the very Angels cover their faces as not being able to behold him, thou art to go before this God, and wilt thou go bespotted and be smeared, and never look into the glass of the Law to see how thou art there, that thou mayest labour to cleanse thy soul? wilt thou come into God’s presence in thy filth?

O bold sinner that know’st not what it is to deal with the Infinite Holy God: Those that know what God is, what his Infinite Holiness means, when they come into God’s presence they make it the great part of their work in preparing their hearts before they come; and indeed the spiritual part of Godliness doth as much consist in this one thing, as in any, in the preparation of the heart for the presence of God in Holy duties; and that man or woman that is careful and conscionable in this thing, may have good comfort to themselves that they are acquainted with the spiritual part of Godliness; that wherein the power of it consists: But for such that can go into God’s presence, and no such sear and reverence of God is in their hearts, certainly these neither know God, nor have anything of the power of Godliness in their hearts …</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/jeremiah-burroughs.html">Jeremiah Burroughs</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The difference between the spots of the godly and of the wicked preached by Mr. Jeremiah Burroughs at Cripple Gate</cite>, (London, 1668), p. 16.</span></figcaption>

<blockquote><p>Yea further, times and places which are applied to the worship of God as circumstances only for outward order and policy may be by a private Christian applied to a civil use, for in so doing he breaks not the ordinance of the Church: For example, material churches are appointed to be the receptacles of Christian assemblies, and that only for such common commodity and decency, which has place as well in civil as in holy meetings, and not for any holiness conceived to be in them more than in other houses. Now if I be standing in a churchyard when it rains, may not I go into the church that I may be defended from the injury of the weather? If I must meet with certain men for putting order to some of my worldly affairs, and it fall out that we cannot conveniently meet in any part but in the church, may we not there keep our tryst? A material church then may serve for a civil use, the same way that it serves to a holy use.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/george-gillespie.html">George Gillespie</a></span><span class="wk"><span class="lbl">Work:</span> <cite>English Popish Ceremonies</cite>, (1637), pt. 3, ch. 1, ‘That the Ceremonies are Unlawful, because superstitious…’, pp. 11-12</span></figcaption>

<blockquote><p>§65. The sum of all that I have said is this, that man may determine of modes and circumstances of worship, necessary and commanded in genere, but not determined by God in specie. But to make new worship-ordinances, or institute sacraments, or sacramental signs, or any thing else, for which in genere he has no commission, this is simply unlawful. §66. But this is not all: There is a second thing unlawful also; and that is the misdetermining of those same modes and circumstances, which he is authorized to determine. For he is (as is said) to do it by God’s General Rule. Here therefore we must thus conclude:

1. That every misordering of such great affairs is the sin of them that do it.

2. But yet that the subject is not exempted from obedience by every such mistake of the governor: but by some, he is.</p></blockquote>

<blockquote><p>…as [John] Cameron notes, it is ordinary to call that necessary which is very profitable and expedient. Beside this (I say), we further maintain that in the use of things indifferent, that which we deliberate upon to do is never lawful to be done except it be also necessary, though not necessitate absoluta seu consequentis [by an absolute necessity, of the consequence], yet necessitate consequentiae seu ex supposition [by a necessity of the consequent, or from the supposition]. Paul’s circumcising of Timothy was lawful only because it was necessary, for he behooved by this means to win the goodwill of the people of Lystra who had once stoned him, otherwise he could not safely have preached the Gospel among them. Therefore he had done wrong if he had not circumcised Timothy, since the circumcising of him was according to the rules of the Word, and it was expedient to circumcise him and unexpedient to do otherwise. And (because de paribus idem est judicium [from the parts, so is the judgment]) whensoever the use of any indifferent thing is according to the rules of the Word, that is, when it is profitable for God’s glory and man’s edification, and the doer is persuaded of so much, I say, putting this case, then (for so much as not only it may, but ought to be done) the use of it is not only lawful, but necessary: and (for so much as not only it needs not, but ought not to be omitted) the omission of it is not only unnecessary, but also unlawful.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/george-gillespie.html">George Gillespie</a></span><span class="wk"><span class="lbl">Work:</span> <cite>A Dispute Against the English-Popish Ceremonies</cite>, (1637) | pt. 4, ch. 3, ‘Whether there be anything indifferent in actu exercito [in the exercised act]’, p. 17 While Gillespie’s teaching here is not in the context of the Sabbath, it is very relevant.</span></figcaption>

<blockquote><p>The scribes and Pharisees in the days of our Savior said but did not; laid heavy burdens on the people, which themselves would not touch with one of their fingers… yet the Lord Himself, who reproved them, heard them and charged his disciples to hear them, because they sat in Moses’s seat. Let it be observed and remembered: the authority may, but the quality of the minister does not add to or abstract from the entity or efficacy of God’s ordinances; he may preach to my salvation who is himself a castaway.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/zachary-crofton.html">Zachary Crofton</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Reformation, Not Separation</cite>, … in a Letter, written July 20, 1661… (1662) Crofton (1626-1672) was a presbyterian and puritan born and raised in Ireland., p. 16</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/worship/impurities-in-worship.html">Impurities in Worship</a></span></div>
<div class="actions"><button class="copy" data-copy="“The scribes and Pharisees in the days of our Savior said but did not; laid heavy burdens on the people, which themselves would not touch with one of their fingers… yet the Lord Himself, who reproved them, heard them and charged his disciples to hear them, because they sat in Moses’s seat. Let it be observed and remembered: the authority may, but the quality of the minister does not add to or abstract from the entity or efficacy of God’s ordinances; he may preach to my salvation who is himself a castaway.”

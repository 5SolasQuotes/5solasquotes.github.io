<blockquote><p>Question: Seeing God purposed to destroy them, and did it not, is not his will alterable and inefficacious? Answer: The counsels, purposes, decrees of God are unalterable and do take place, Ps. 33:11; Isa. 14:27; 43:13; 46:10; Mal. 3:6; Heb. 6:17. For that said and done here, it’s more humano [by a human custom]: God saw cause-sufficient to move Him to their destruction, but seeing what evil was like to come about, He would not destroy them; had the Lord decreed it before the world, it must have taken place, no change or alteration could have been.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/william-greenhill.html">William Greenhill</a></span><span class="wk"><span class="lbl">Work:</span> <cite>An Exposition continued upon the 20th-29th chapters of the prophet Ezekiel</cite>, ... (London: Chapman, 1658), on ch. 20, v. 8, p. 43</span></figcaption>

</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-5bffc2791f" data-kw="">
<blockquote><p>Also one must bear in mind that God’s original wish was that all should be saved [1 Tim. 2:4] and come to His Kingdom. For it was not for punishment that He formed us but to share in his goodness, inasmuch as He is a good God. But inasmuch as He is a just God, his will is that sinners should suffer punishment. The first then is called God’s antecedent will and pleasure, and springs from Himself, while the second is called God’s consequent will and permission, and has its origin in us. And the latter is twofold: one part dealing with matters of guidance and training, and having in view our salvation, and the other being hopeless and leading to our utter punishment, as we said above. And this is the case with actions that are not left in our hands. But of actions that are in our hands, the good ones depend on his antecedent goodwill and pleasure, while the wicked ones depend neither on his antecedent, nor on His consequent will, but are a concession to free-will. For that which is the result of compulsion has neither reason nor virtue in it. God makes provision for all creation and makes all creation the instrument of his help and training, yea often even the demons themselves, as for example in the cases of Job and the swine [Mt. 8:30 ff.].</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/john-of-damascus.html">John of Damascus</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Exposition of the Orthodox Faith</cite>, bk. 2, ch. 29, ‘On Providence’ in NPNF2, vol. 9, pt. 2, p. 42 Damascus (c. 675 or 676 – 749) was Christian monk, apologist and theologian, known as the last of the Greek fathers. Damascus appears not to believe in an unconditional predestination underlying his antecedent/ consequent distinction, per ch. 30.</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/attributes-of-god/will-of-god.html">Will of God</a></span></div>

</figure><figure class="quote" id="q-f529867863" data-kw="">
<blockquote><p>X. We may sometimes interchange the eudokian [good-purpose of decree] for the euarestia [good-pleasure or complacency of the revealed will], when it is spoken of those things with which God is pleased because there is in them some quality or condition which agrees with the nature of God and therefore conciliates his favor…

XI. Eurestia contradistinguished from eudokian in this connection means nothing else than the mere complacency by which God approves anything as just and holy and delights in it (and besides wills to prescribe it to the creature as his most just duty). Hence it does not properly include any decree or volition in God, but implies only the agreement of the thing with the nature of God (according to which He cannot but love what is agreeable to his holiness)… … XX. The will of sign which is set forth as extrinsic ought to correspond with some internal will in God that it may not be false and deceptive; but that internal will is not the decree concerning the gift of salvation to this or that one, but the decree concerning the command of faith and promise of salvation if the man does believe (which is founded both upon the connection established by God between faith and salvation and the internal disposition of God by which, as He loves Himself, He cannot but love his image wherever He sees it shining and is so much pleased with the faith and repentance of the creature as to grant it salvation).</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/francis-turretin.html">Francis Turretin</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Institutes of Elenctic Theology</cite>, (P&amp;R), vol. 1 | 3rd Topic, ‘The Will of God’, 15th Question, ‘May the will be properly distinguished into the will of decree and of precept, good purpose (eudokias) and good pleasure (euarestias), signified, secret and revealed? We affirm., pp. 222, 224</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/attributes-of-god/will-of-god.html">Will of God</a></span></div>

<blockquote><p>549. Prov. 1:26, ‘I will mock at your trouble; and laugh when your destruction comes.’ Eze. 18:32, ‘I will not the death of a sinner, for I take no pleasure in the destruction of a sinner.’ God is delighted in his justice, when He punishes those which despise his grace, and that will not hearken to his fatherly vocation; but of his mercy He will not the death of sinners, as death is the destruction of nature. The former place belongs to God’s consequent will; the latter to his antecedent will; that is ruled by justice, this by mercy.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/johannes-thaddaeus.html">Johannes Thaddaeus</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Reconciler of the Bible</cite>, … (London: Miller, 1662) | Proverbs</span></figcaption>

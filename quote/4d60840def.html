<main class="wrap"><figure class="quote" id="q-4d60840def" data-kw="">
<blockquote><p>Again, here we see the use of God’s laws, which serve to prevent, restrain, and cut off sin, into which otherwise men would fall unless they were compassed and guarded by laws. Some object for freedom of will, on this manner. If the laws of God cannot be kept, they are in vain. But they are not in vain. Therefore they may be kept. Answer. The major or first part of the reason is not true. For there are other uses of the laws of God than the keeping of them. For they serve to restrain and to prevent open offences, and to keep men in order, at the least outwardly.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/william-perkins.html">William Perkins</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Works of William Perkins: vol. 2: Commentary on Galatians</cite>, ed. Paul M. Smalley, Joel R. Beeke, and Derek W. H. Thomas, vol. 2 (Grand Rapids, MI: Reformation Heritage Books, 2015), 203.</span></figcaption>

<blockquote><p>Q. 86. What is forbidden in the tenth commandment? A. The tenth commandment forbids all discontentment with our own estate (1 Kings 21:4; Est. 5:13; 1 Cor. 10:10), envying or grieving at the good of our neighbor (Gal. 5:26; James 3:14, 16), and all inordinate motions and affections to anything that is his (Rom. 7:7–8; 13:9; Deut. 5:21).</p></blockquote>

</figure><figure class="quote" id="q-170e2c1298" data-kw="">
<blockquote><p>What does it mean to have a god? or, what is God? Answer: A god means that from which we are to expect all good and to which we are to take refuge in all distress, so that to have a God is nothing else than to trust and believe Him from the [whole] heart; as I have often said that the confidence and faith of the heart alone make both God and an idol. If your faith and trust be right, then is your god also true; and, on the other hand, if your trust be false and wrong, then you have not the true God; for these two belong together, faith and God. That now, I say, upon which you set your heart and put your trust is properly your god. Therefore it is the intent of this commandment to require true faith and trust of the heart which settles upon the only true God, and clings to Him alone.… Whatever you lack of good things, expect it of Me, and look to Me for it, and whenever you suffer misfortune and distress, creep and cling to Me. I, yes, I, will give you enough and help you out of every need; only let not your heart cleave to or rest in any other.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/martin-luther.html">Martin Luther</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Large Catechism</cite>, First Commandment</span></figcaption>

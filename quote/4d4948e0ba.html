<main class="wrap"><figure class="quote" id="q-4d4948e0ba" data-kw="">
<blockquote><p>‘Twas observed of the three ministers of Geneva, that none thundered more loudly than Farel, none piped more sweetly than Viret, none taught more learnedly and solidly than Calvin. So variously doth the Lord dispense his gifts, to shew the liberty of the spirit, and for the greater beauty and order to the church; for difference with proportion causeth beauty; and to prevent schism, every member having his distinct excellency.

So that what is wanting in one, may be supplied by another; and all have something to commend them to the church, that they may be not despised; as in several countries they have several commodities to maintain traffic between them and all. We are apt to abuse the diversity of gifts to divisions and partialities, whereas God hath given them to maintain a communion. In the church’s vestment, there is variety, but no rent.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/thomas-manton.html">Thomas Manton</a></span><span class="wk"><span class="lbl">Work:</span> <cite>To the Reader in Richard Sibbes, A Learned Commentary or Exposition upon the First Chapter of the Second Epistle of S. Paul to the Corinthians</cite></span></figcaption>

<blockquote><p>3rd Distinction. It is one thing to receive ordination from a Prelate lawfully and another thing to receive lawful ordination. The former we deny; ministers sin who receive ordination from a prelate, as they sin who receive baptism from the Romish Church; yet is the ordination lawful and valid, because prelacy, though different in nature from the office of a true pastor, is consistent in the same subject with the pastor’s office.</p></blockquote>

</figure><figure class="quote" id="q-602d94bbb6" data-kw="">
<blockquote><p>The fifth mark is “the continued succession of bishops without any interruption, from the apostles even to our times.” But here (in the first place), we must distinguish succession: one is personal and local, as to persons and places; another is doctrinal, as to faith. We do not deny that the latter is a mark and thus it coincides with ours. But the former (of which we treat here) cannot be a mark. (a) It is merely contingent and aside from the nature of the church, unless it is founded on unity of sound doctrine and true faith (Eph. 4:4, 5, 11, 12). Nay, since the church is ambulatory and not tied down to this or that place, such also is its succession. (b) It is not proper because it belongs also to false teachers. Annas and Caiaphas succeeded Aaron in the priesthood; the scribes and Pharisees succeeded the fathers and the interpreters of the law; Arians succeeded the orthodox; the Greek church (which the Romanists consider schismatical and heretical) glories in an uninterrupted succession of bishops from the apostles. Bellarmine himself confesses that “the church cannot necessarily be inferred to be where a succession is” (“De Notis Ecclesiae,” 4.8 Opera [1857], 2:118). (c) A local and personal succession can be without a succession of doctrine. Therefore it cannot be a mark of the church because it cannot be a true church which does not have the apostolic doctrine. For the church is not to be sought in walls and temples, but in doctrines. The church is where true faith is.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/francis-turretin.html">Francis Turretin</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Institutes of Elenctic Theology</cite>, 18.13.28</span></figcaption>

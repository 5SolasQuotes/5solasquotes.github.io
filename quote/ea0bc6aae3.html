<main class="wrap"><figure class="quote" id="q-ea0bc6aae3" data-kw="">
<blockquote><p>To acknowledge and confess, that, as we are convinced of our guilt, so, out of a deep sense thereof, we judge ourselves unworthy of the smallest benefits, most worthy of God’s fiercest wrath, and of all the curses of the law, and heaviest judgments inflicted upon the most rebellious sinners… Notwithstanding all which, to draw near to the throne of grace, encouraging ourselves with hope of a gracious answer of our prayers, in the riches and all-sufficiency of that only one oblation, the satisfaction and intercession of the Lord Jesus Christ… and humbly and earnestly to supplicate for mercy… And, with confidence of his mercy to his whole church, and the acceptance of our persons, through the merits and mediation of our High Priest, the Lord Jesus, to profess that it is the desire of our souls to have fellowship with God in the reverend and conscionable use of his holy ordinances; and, to that purpose, to pray earnestly for his grace and effectual assistance to the sanctification of his holy sabbath, the Lord’s day, in all the duties thereof, publick and private, both to ourselves, and to all other congregations of his people, according to the riches and excellency of the gospel, this day celebrated and enjoyed… And because we have been unprofitable hearers in times past, and now cannot of ourselves receive, as we should, the deep things of God, the mysteries of Jesus Christ, which require a spiritual discerning; to pray, that the Lord, who teacheth to profit, would graciously please to pour out the Spirit of grace, together with the outward means thereof, causing us to attain such a measure of the excellency of the knowledge of Christ Jesus our Lord, and, in him, of the things which belong to our peace…</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/westminster-assembly.html">Westminster Assembly</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Directory for the Public Worship of God</cite>, Of Public Prayer before the Sermon</span></figcaption>

</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-44afb1d0a7" data-kw="">
<blockquote><p>Yet there was in those rites some manner of difference, not only between the first Passover celebrated in Egypt and the subsequent ones, but also between the primary Passover, which was ordinarily eaten in the month of Nisan on the fourteenth day, and the secondary one, which was celebrated in the second month on the fourteenth day, for the sake of those who were either unclean or absent in the prior month, because in the latter, the communicants were not bound to such an exact purging of all leaven, and also they conducted this feast for not but one day [instead of seven].</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/petrus-van-mastricht.html">Petrus van Mastricht</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Theoretical Practical Theology</cite>, (1698; RHB), bk. 7, ch. 5, sect. 5</span></figcaption>

<blockquote><p>We have here a full revelation of God’s favour to David and the kind intentions of that favour, the notices and assurances of which God sent him by Nathan the prophet… David’s purpose to build God a house is superseded. God took notice of that purpose, for he knows what is in man; and He was well pleased with it, as appears 1 Kings 8:18, Thou didst well that it was in thy heart; yet he forbade him to go on with his purpose (2 Sam. 7:5): “Shalt thou build me a house? No, thou shalt not (as it is explained in the parallel place, 1 Chron. 17:4)… That worship only is acceptable which is instituted; why should David therefore design what God never ordained? Let him wait for a warrant, and then let him do it. Better a tent of God’s appointing than a temple of his own inventing… God was not indebted to him for his good intentions, but, whatever he did for God’s honour, God was beforehand with him, 2 Samuel 7:8, 9… Blessings are entailed upon the family and posterity of David. David had purposed to build God a house, and, in requital, God promises to ‘build him a house,’2 Samuel 7:11. Whatever we do for God, or sincerely design to do though Providence prevents our doing it, we ‘shall in no wise lose our reward.’ He had promised to make him a name (2 Sam. 7:9); here he promises to make him a house, which should bear up that name… Though David came short of making good his purpose to build God a house, yet God did not come short of making good his promise to build him a house. Such is the tenour of the covenant we are under; though there are many failures in our performances, there are none in God’s.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/matthew-henry.html">Matthew Henry</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Commentary on the While Bible</cite>, on 2 Samuel, ch. 7, vv. 4-17</span></figcaption>

<blockquote><p>V. 1, ‘And Nadab and Abihu’ — These jolly young priests, overjoyed haply of their new employment and overwarmed with wine, as some gather out of Lev. 10:9, over did themselves the very day of their service, Lev. 10:19 and are suddenly surprised by a doleful death. … V. 16, ‘And Moses diligently sought the goat of the sin offering, and, behold, it was burnt: and he was angry with Eleazar and Ithamar, the sons of Aaron’ Passion for their dead friends had so transported the priests that they knew not well what they did… but then it must not be excessive as here, and as 2 Sam. 18:33. … V. 18, ‘Behold, the blood of it was not brought in within the holy (place): ye should indeed have eaten it in the holy (place), as I commanded.’ Thus, by misreckoning a point, ye have missed the haven and hazarded yourselves to the rocks of the divine displeasure, against which your brethren so lately split.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/john-trapp.html">John Trapp</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Commentary on Leviticus</cite>, 10</span></figcaption>

<blockquote><p>Will any object unto us the profaneness of the ministers, rudeness and disorder of the ministration of God’s worship, we yield it is too visibly true; but more vile administrators, or irregular administrations cannot be than were the sons of Eli in their service, who made the people to loathe the offerings of the Lord, and were rebuked, and described by Samuel in 1 Sam. 2:12-17… O horrid uncleanness, most heaven-daring villany! Yet I find not that any God-fearing-Israelite forsook the sanctuary, or durst forbear their sacrifice; nor did Samuel (who reproved, and denounced God’s judgment against this profaneness) ever advise or direct the same.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/zachary-crofton.html">Zachary Crofton</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Reformation, Not Separation</cite>, … in a Letter, written July 20, 1661… (1662) Crofton (1626-1672) was a presbyterian and puritan born and raised in Ireland., p. 16</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/worship/impurities-in-worship.html">Impurities in Worship</a></span></div>
<div class="actions"><button class="copy" data-copy="“Will any object unto us the profaneness of the ministers, rudeness and disorder of the ministration of God’s worship, we yield it is too visibly true; but more vile administrators, or irregular administrations cannot be than were the sons of Eli in their service, who made the people to loathe the offerings of the Lord, and were rebuked, and described by Samuel in 1 Sam. 2:12-17… O horrid uncleanness, most heaven-daring villany! Yet I find not that any God-fearing-Israelite forsook the sanctuary, or durst forbear their sacrifice; nor did Samuel (who reproved, and denounced God’s judgment against this profaneness) ever advise or direct the same.”

— Zachary Crofton, Reformation, Not Separation, or, Mr. Crofton’s Plea for Communion with the Church… in a Letter, written July 20, 1661… (1662) Crofton (1626-1672) was a presbyterian and puritan born and raised in Ireland., p. 16">Copy</button><a class="share" href="https://x.com/intent/post?text=%E2%80%9CWill+any+object+unto+us+the+profaneness+of+the+ministers%2C+rudeness+and+disorder+of+the+ministration+of+God%E2%80%99s+worship%2C+we+yield+it+is+too+visibly+true%3B+but+more+vile+administrators%2C+or+irregular+administrations+cannot+be+than+were+the+sons+of+Eli+in+their+service%2C+who+made+the+people+to+loathe+the+offerings+of+the+Lord%2C+and+were+rebuked%2C+and+described+by+Samuel+in+1+Sam.+2%3A12-17%E2%80%A6+O+horrid+uncleanness%2C+most+heaven-daring+villany%21+Yet+I+find+not+that+any+God-fearing-Israelite+forsook+the+sanctuary%2C+or+durst+forbear+their+sacrifice%3B+nor+did+Samuel+%28who+reproved%2C+and+denounced+God%E2%80%99s+judgment+against+this+profaneness%29+ever+advise+or+direct+the+same.%E2%80%9D%0A%0A%E2%80%94+Zachary+Crofton%2C+Reformation%2C+Not+Separation%2C+or%2C+Mr.+Crofton%E2%80%99s+Plea+for+Communion+with+the+Church%E2%80%A6+in+a+Letter%2C+written+July+20%2C+1661%E2%80%A6+%281662%29+Crofton+%281626-1672%29+was+a+presbyterian+and+puritan+born+and+raised+in+Ireland.%2C+p.+16&amp;url=https%3A%2F%2F5solasquotes.github.io%2Fquote%2F7b93b1b030.html&amp;via=5Solas" target="_blank" rel="noopener">Share on X</a><a class="perma" href="../quote/7b93b1b030.html">Permalink</a><a class="src" href="https://reformedbooksonline.com/on-impurities-in-worship/#:~:text=Will%20any%20object%20unto%20us%20the,ever%20advise%20or%20direct%20the%20same&amp;text=Will%20any%20object%20unto%20us%20the%20profaneness%20of&amp;text=this%20profaneness%29%20ever%20advise%20or%20direct%20the%20same" rel="noopener" target="_blank">Read it online · Reformed Books Online</a></div>

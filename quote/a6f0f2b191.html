<main class="wrap"><figure class="quote" id="q-a6f0f2b191" data-kw="">
<blockquote><p>May it please your Grace and your Lordships, I Should not presume to take up any part of that time, which Your Grace so happily employs in the Government and Conservation of a whole Nation; nor to divert the rest of this honourable Board from those important Affairs, which usually call your Lordships hither; were I not under an Obligation both of Gratitude and Duty, to be an Interpreter for those poor Protestants, lately come out of France, to take Sanctuary with you: and to express for them and in their names, as they have earnestly desired me, a part of that grateful sense, which they have, and will for ever preserve, of your Lordships Christian Charity and Generosity towards them: This they have often, I assure you, acknowledged to Heav’n in their Prayers, but could not be satisfied, till they had made their solemn and public Acknowledgments to their Noble Benefactors.

Life and Religion are the two things most dear and valuable of all upon earth: Life is the ground of all the Good and Happiness we enjoy in this world, and Religion is the foundation of all the Felicities we hope for in that to come; so that those persons that are deprived both of the comforts of Life, and the Profession and Exercise of their Religion, may justly be looked upon as the truest objects of pity that we can meet with in this world; and by the same rule, those that have a lively sympathy with such, have the true principle of a Christian Spirit, and are the true examples of a Christian Practice.

What extreme Hardships and Sufferings those Protestants were under in their own Country, both as to their Livelihood and Religion, is too sad and too notorious a truth, as well as too big a Subject for me now to enlarge upon. The many Proclamations which their Prince made against them, for pulling down and demolishing most of their Churches, and excluding them from all Trades and Preferments, are well known, they could neither serve God, nor enjoy themselves; They are forbidden to quit their Country, and yet by their hard usage, and persecution, in effect, not suffered to stay.

The Cry of that Egyptian-like Bondage and Slavery, they groaned under, that entered into the ears of the Lord of Hosts, entered also into your noble and charitable Hearts, and there has met with Compassion and Pity; and by your Christian Example and Charity you have set your selves Patterns to this whole Nation: By it you have excited the general Beneficence of all; and by it, no less than by your Orders, you have already influenced this great City (and I hope will shortly after, the whole Kingdom) into an Obedience to that truly Christian, and royal Law of Beneficence and Mercy.

And although this be eminent, and extraordinary in its kind, yet it is no wonder that that Illustrious Person, who began as early to be good, as to be great, whose matchless Courtesy and Generosity are not only known to his Friends, to his Servants, to Strangers, but even to his greatest Enemies; who has learned by a long experience, what it is to suffer for Righteousness sake, and to forsake all, rather than his Honour and Religion; no wonder, I say, that He should be ready and zealous to relieve those that suffer innocently, and for a good Conscience, and who forsake their All, rather than forsake their God.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/peter-drelincourt.html">Peter Drelincourt</a></span><span class="wk"><span class="lbl">Work:</span> <cite>A speech made to His Grace the Duke of Ormond Lord Lieutenant of Ireland, and to the Lords of His Majesties most Honourable Privy Council to return the humble thanks of the French Protestants lately arrived in this kingdom, and graciously relieved by them</cite>, (Dubliln: William Mendey, 1682), pp 3-5.</span></figcaption>

</figure><figure class="quote" id="q-5284cf8707" data-kw="">
<blockquote><p>Now of all other temptations, it pleaseth God to suffer his church to be tempted with afflictions. It is never free either from the sword of Ishmael; which is a reviling tongue: or the sword of Esau, a persecuting hand. Neither was there yet ever Christian man found, who had not his part in the cup of affliction. We must drink of the same cup our master did: the disciple is not about his master.

The reasons why God doth visit vs thus with afflictions, are: 1. To humble us. 2. To wean us. 3. To winnow us. 4. To prevent us. 5. To teach us. 6. To enlighten us. 7. To honour us. 8. To cure us. 9. To crown us. 10. To comfort us. 11. To protect us. 12. To adopt us. And last of all, to teach and comfort others.

To humble us, that we be not proud: to wean us, that we love not his world: to winnow us, that we be not chaff: to prevent us, that we do not sin: to teach us, that we be patient in adversity: to enlighten us, that we see our errors: to honour us, that our faith may be manifest: to cure us, that we surfeit not of security: to crown us, that we may live eternally: to comfort us, that he may send his spirit: to protect us, that he may guide us by his Angels: to adopt us, that we may be his sons: and to teach others, that they seeing how sin is punished in us, they may take heed it be not found in them: that they seeing our comforts in troubles, may not be discouraged in the like trials.</p></blockquote>

<div class="actions"><button class="copy" data-copy="“Now of all other temptations, it pleaseth God to suffer his church to be tempted with afflictions. It is never free either from the sword of Ishmael; which is a reviling tongue: or the sword of Esau, a persecuting hand. Neither was there yet ever Christian man found, who had not his part in the cup of affliction. We must drink of the same cup our master did: the disciple is not about his master.

The reasons why God doth visit vs thus with afflictions, are: 1. To humble us. 2. To wean us. 3. To winnow us. 4. To prevent us. 5. To teach us. 6. To enlighten us. 7. To honour us. 8. To cure us. 9. To crown us. 10. To comfort us. 11. To protect us. 12. To adopt us. And last of all, to teach and comfort others.

To humble us, that we be not proud: to wean us, that we love not his world: to winnow us, that we be not chaff: to prevent us, that we do not sin: to teach us, that we be patient in adversity: to enlighten us, that we see our errors: to honour us, that our faith may be manifest: to cure us, that we surfeit not of security: to crown us, that we may live eternally: to comfort us, that he may send his spirit: to protect us, that he may guide us by his Angels: to adopt us, that we may be his sons: and to teach others, that they seeing how sin is punished in us, they may take heed it be not found in them: that they seeing our comforts in troubles, may not be discouraged in the like trials.”

— Robert Hill, To the Right Honourable Sir William Russell in William Perkins, The combat between Christ and the Devil displayed: or A commentary upon the temptations of Christ">Copy</button><a class="share" href="https://x.com/intent/post?text=%E2%80%9CNow+of+all+other+temptations%2C+it+pleaseth+God+to+suffer+his+church+to+be+tempted+with+afflictions.+It+is+never+free+either+from+the+sword+of+Ishmael%3B+which+is+a+reviling+tongue%3A+or+the+sword+of+Esau%2C+a+persecuting+hand.+Neither+was+there+yet+ever+Christian+man+found%2C+who+had+not+his+part+in+the+cup+of+affliction.+We+must+drink+of+the+same+cup+our+master+did%3A+the+disciple+is+not+about+his+master.%0A%0AThe+reasons+why+God+doth+visit+vs+thus+with+afflictions%2C+are%3A+1.+To+humble+us.+2.+To+wean+us.+3.+To+winnow+us.+4.+To+prevent+us.+5.+To+teach+us.+6.+To+enlighten+us.+7.+To+honour+us.+8.+To+cure+us.+9.+To+crown+us.+10.+To+comfort+us.+11.+To+protect+us.+12.+To+adopt+us.+And+last+of+all%2C+to+teach+and+comfort+others.%0A%0ATo+humble+us%2C+that+we+be+not+proud%3A+to+wean+us%2C+that+we+love+not+his+world%3A+to+winnow+us%2C+that+we+be+not+chaff%3A+to+prevent+us%2C+that+we+do+not+sin%3A+to+teach+us%2C+that+we+be+patient+in+adversity%3A+to+enlighten+us%2C+that+we+see+our+errors%3A+to+honour+us%2C+that+our+faith+may+be+manifest%3A+to+cure+us%2C+that+we+surfeit+not+of+security%3A+to+crown+us%2C+that+we+may+live+eternally%3A+to+comfort+us%2C+that+he+may+send+his+spirit%3A+to+protect+us%2C+that+he+may+guide+us+by+his+Angels%3A+to+adopt+us%2C+that+we+may+be+his+sons%3A+and+to+teach+others%2C+that+they+seeing+how+sin+is+punished+in+us%2C+they+may+take+heed+it+be+not+found+in+them%3A+that+they+seeing+our+comforts+in+troubles%2C+may+not+be+discouraged+in+the+like+trials.%E2%80%9D%0A%0A%E2%80%94+Robert+Hill%2C+To+the+Right+Honourable+Sir+William+Russell+in+William+Perkins%2C+The+combat+between+Christ+and+the+Devil+displayed%3A+or+A+commentary+upon+the+temptations+of+Christ&amp;url=https%3A%2F%2F5solasquotes.github.io%2Fquo

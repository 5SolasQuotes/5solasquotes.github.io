<blockquote><p>The women of my people you drive out from their delightful houses; from their young children you take away my splendour for ever” Micah 2:9

Now, Micah specifically speaks next of elderly widows and orphaned children, as whenever cruel measures are practiced, little children and widows suffer. Once we lose sight of them, we signal how absent of human feeling we have become, and how like wild beasts we are. Accordingly, we are hereby admonished that, so long as people are weak and unable to support themselves, then all the more are we obligated not to hurt them, and to abstain from any act of evil or extortion that would bring them harm. And why is that? Because, if God is offended by our harming a person who is capable of defending himself, the offense is double when we wrong a defenseless, poor soul. For, of certainty, God will exact vengeance and take the person’s cause in hand. That is why Scripture proclaims that God is “the protector of widows” and the “Father of the fatherless” [Psalm 68:5]. For there are the very ones whom society neglects most, since they are the most destitute of human support. That is why our Lord embraces them in his safekeeping. For whenever the poor are unable to fend for themselves, then God expects us to step in, and, at the last judgment, will reveal that every time we oppressed widows and orphans, we were engaging in war with God himself.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/john-calvin.html">John Calvin</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Sermons on the book of Micah</cite>, trans. and ed. B. W. Farley (1551; Phillipsburg, 2003), p. 116.</span></figcaption>

b8bf.html">Permalink</a><a class="src" href="https://reformedcovenanter.wordpress.com/2012/06/16/john-calvin-on-societys-duty-to-care-for-widows-and-orphans/" rel="noopener" target="_blank">Read it online · Reformed Covenanter</a></div>

<blockquote><p>[1. The Rule of Reformation.] The rule of building the house of God, and of the reformation of religion is the same and perpetual: the commandment of God, and not the commandment of man one or more, whether they be civil or ecclesiastical persons. It is their part to provide according to their places and callings, to command and direct that the Commandment of God be obeyed. This King commands not that his will be done, but what God has commanded. Neither King nor Parliament can command otherwise. Civil powers have great authority, not only in things civil, but in matters of Religion; and they sin against God, if they use not the authority which God hath put in their hands, for the good of Religion. To them belongs inspection and watching over, not only ecclesiasticos [ecclesiastical persons], but ecclesiastica [that which is ecclesiastical]. Ecclesiastical persons are subject to civil authority no less than others; and in respect of things-ecclesiastical, or matters of religion, Eusebius brings in Constantine the great, saying: ‘Vos Episcopi in Ecclesia, ego extra Ecclesiam seu templum Episcopus a Deo constitutus sum‘ [Ye are overseers in the Church; I am constituted of God an overseer outside of the Church Church]: Not that any mortal man whether Pope or Prince, can be properly Head of the Church, or vice-gerent [regent] unto Christ the Mediator in his special and economical Kingdom of Grace: for princes are vice-gerents to God, and to his Son Jesus Christ as He is God, in his universal Kingdom of Providence; and this watching and inspection of princes and magistrates, is objective ecclesiastica [objectively ecclesiastical], but formaliter civilis [formally civil], it is about matters of religion in a civil manner, and in a way suitable to the nature and quality of their place and power. The faithful custody and preservation of religion, is a part of their office: for they are not only keepers of the Second, but of the First Table of the Law… Religion also expects from them the civil sanction, that the worship of God, and the wholesome constitutions of the Church about religion, be confirmed and settled by their Laws. Coaction [coercion] also is theirs, for they by their power [in a Christian nation] are to constrain their subjects to the duties of religion, and to coerce and stop them that they do nothing to the contrary.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/alexander-henderson.html">Alexander Henderson</a></span><span class="wk"><span class="lbl">Work:</span> <cite>‘A Sermon Preached To the Honorable House of Commons, at Their late Solemn Fast, Wed., Dec. 27</cite>, 1643’ (London, 1644)</span></figcaption>

<blockquote><p>Many never think of measuring things political with a moral measuring reed. And yet, as Christians we are bound so to do. The revealed will of God furnishes principles whereby all things are to be tested. In stating that constitutions of government are to be tested by the Scriptures it is not meant that they are to be pronounced defective unless they contain all Bible truth.

Church creeds should cover the whole field of revealed truth, but political constitutions have no such end to serve. Nevertheless, civil government exists within the sphere of morals. It has moral interests to conserve and moral ends to reach. …

The next task will be to take this moral standard and try the national constitution by it. Since the secular and the Christian are the only two theories of government there are, it is promised that the one or the other will show its presence and dominating power in every political constitution. Let us therefore examine the national constitution to see whether it measures up to the Christian standard, or whether the secular theory has determined its character. We begin with the preamble. It is as follows: “We, the people of the United States, in order to form a more perfect union, establish justice, insure domestic tranquillity, provide for the common defence, promote the general welfare, and secure the blessings of liberty to ourselves and our posterity, do ordain and establish this constitution for the United States of America.”

This is an admirable statement of the ends of civil government. It is difficult to see how it can be improved. Many a one, unprovided with a correct standard for measuring political documents would at once pronounce the constitution Christian. But a careful measurement with our moral standard already agreed upon will reveal a very serious defect. It declares that “We, the people . . . . do ordain and establish this Constitution.” This statement is objectionable, not because of what it contains, but because of what it omits. It is admitted that the people do ordain, and have the right to ordain constitutions of government. Peter says: “Submit your selves to every ordinance of man for the Lord’s sake.” Striking out the words above quoted would not make the constitution Christian, and therefore their presence does not make it secular.

But this preamble does not measure up to the Christian standard. Had the expression, “We, the people,” been followed by some such words as, “Acknowledging Almighty God as the source of all power and authority in civil government, the Lord Jesus Christ as the Ruler of Nations, and His revealed will as the supreme standard to decide moral issues in national life,” its Christian character would be placed beyond all doubt. But while the people are recognized as ordaining civil government, there is not a hint given that the authority to do this comes from God, or that the nation and its government exist in the sphere of divine authority and are subject to the moral law. To make prominent the human and to ignore the divine element in civil government is of the very nature of secularism.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/richard-cameron-wylie.html">Richard Cameron Wylie</a></span><span class="wk"><span class="lbl">Work:</span> <cite>What the Constitution Lacks in A Report of the Christian Citizenship Conference, Devoted to the Consideration of Political Loyalty to the Lord Jesus Christ, held in the Allegheny Covenanter Church, Corner of Sandusky and North Diamond Streets. Monday and Tuesday February 24th and 25th, 1902</cite></span></figcaption>

This is an admirable statement of the ends of civil government. It is difficult to see how it can be improved. Many a one, unprovided with a correct standard for measuring political documents would at once pronounce the constitution Christian. But a careful measurement with our moral standard already agreed upon will reveal a very serious defect. It declares that “We, the people . . . . do ordain and establish this Constitution.” This statement is objectionable, not because of what it contains, but because of what it omits. It is admitted that the people do ordain, and have the right to ordain constitutions of government. Peter says: “Submit your selves to every ordinance of man for the Lord’s sake.” Striking out the words above quoted would not make the constitution Christian, and therefore their presence does not make it secular.

But this preamble does not measure up to the Christian standard. Had the expression, “We, the people,” been followed by some such words as, “Acknowledging Almighty God as the source of all power and authority in civil government, the Lord Jesus Christ as the Ruler of Nations, and His revealed will as the supreme standard to decide moral issues in national life,” its Christian character would be placed beyond all doubt. But while the people are recognized as ordaining civil government, there is not a hint given that the authority to do this comes from God, or that the nation and its government exist in the sphere of divine authority and are subject to the moral law. To make prominent the human and to ignore the divine element in civil government is of the very nature of secularism.”

— Richard Cameron Wylie, What the Constitution Lacks in A Report of the Christian Citizenship Conference, Devoted to the Consideration of Political Loyalty to the Lord Jesus Christ, held in the Allegheny Covenanter Church, Corner of Sandusky and North Diamond Streets. Monday and Tuesday February 24th and 25th, 1902">Copy</button><a class="share" href="https://x.com/intent/post?text=%E2%80%9CMany+never+think+of+measuring+things+political+with+a+moral+measuring+reed.+And+yet%2C+as+Christians+we+are+bound+so+to+do.+The+revealed+will+of+God+furnishes+principles+whereby+all+things+are+to+be+tested.+In+stating+that+constitutions+of+government+are+to+be+tested+by+the+Scriptures+it+is+not+meant+that+they+are+to+be+pronounced+defective+unless+they+contain+all+Bible+truth.%0A%0AChurch+creeds+should+cover+the+whole+field+of+revealed+truth%2C+but+political+constitutions+have+no+such+end+to+serve.+Nevertheless%2C+civil+government+exists+within+the+sphere+of+morals.+It+has+moral+interests+to+conserve+and+moral+ends+to+reach.+%E2%80%A6%0A%0AThe+next+task+will+be+to+take+this+moral+standard+and+try+the+national+constitution+by+it.+Since+the+secular+and+the+Christian+are+the+only+two+theories+of+government+there+are%2C+it+is+promised+that+the+one+or+the+other+will+show+its+presence+and+dominating+power+in+every+political+constitution.+Let+us+therefore+examine+the+national+constitution+to+see+whether+it+measures+up+to+the+Christian+standard%2C+or+whether+the+secular+theory+has+determined+its+character.+We+begin+with+the+preamble.+It+is+as+follows%3A+%E2%80%9CWe%2C+the+people+of+the+United+States%2C+in+order+to+form+a+more+perfect+union%2C+establish+justice%2C+insure+domestic+tranquillity%2C+provide+for+the+common+defence%2C+promote+the+general+welfare%2C+and+secure+the+blessings+of+liberty+to+ourselves+and+our+posterity%2C+do+ordain+and+establish+this+constitution+for+the+United+States+of+America.%E2%80%9D%0A%0AThis+is+an+admirable+statement+of+the+ends+of+civil+government.+It+is+difficult+to+see+how+it+can+be+improved.+Many+a+one%2C+unprovided+with+a+correct+standard+for+measuring+political+documents+would+at+once+pronounce+the+constitution+Christian.+But+a+careful+measurement+with+our+moral+standard+already+agreed+upon+will+reveal+a+very+serious+defect.+It+declares+that+%E2%80%9CWe%2C+the+people+.+.+.+.+do+ordain+and+establish+this+Constitution.%E2%80%9D+This+statement+is+objectionable%2C+not+because+of+what+it+contains%2C+but+because+of+what+it+omits.+It+is+admitted+that+the+people+do+ordain%2C+and+have+the+right+to+ordain+constitutions+of+government.+Peter+says%3A+%E2%80%9CSubmit+your+selves+to+every+ordinance+of+man+for+the+Lord%E2%80%99s+sake.%E2%80%9D+Striking+out+the+words+above+quoted+would+not+make+the+constitution+Christian%2C+and+therefore+their+presence+does+not+make+it+secular.%0A%0ABut+this+preamble+does+not+measure+up+to+the+Christian+standard.+Had+the+expression%2C+%E2%80%9CWe%2C+the+people%2C%E2%80%9D+been+followed+by+some+such+words+as%2C+%E2%80%9CAcknowledging+Almighty+God+as+the+source+of+all+power+and+authority+in+civil+government%2C+the+Lord+Jesus+Christ+as+the+Ruler+of+Nations%2C+and+His+revealed+will+as+the+supreme+standard+to+decide+moral+issues+in+national+life%2C%E2%80%9D+its+Christian+character+would+be+placed+beyond+all+doubt.+But+while+the+people+are+recognized+as+ordaining+civil+government%2C+there+is+not+a+hint+given+that+the+authority+to+do+this+comes+from+God%2C+or+that+the+nation+and+its+government+exist+in+the+sphere+of+divine+authority+and+are+subject+to+the+moral+law.+To+make+prominent+the+human+and+to+ignore+the+divine+element+in+civil+government+is+of+the+very+nature+of+secularism.%E2%80%9D%0A%0A%E2%80%94+Richard+Cameron+Wylie%2C+What+the+Constitution+Lacks+in+A+Report+of+the+Christian+Citizenship+Conference%2C+Devoted+to+the+Consideration+of+Political+Loyalty+to+the+Lord+Jesus+Christ%2C+held+in+the+Allegheny+Covenanter+Church%2C+Corner+of+Sandusky+and+North+Diamond+Streets.+Monday+and+Tuesday+February+24th+and+25th%2C+1902&amp;url=https%3A%2F%2F5solasquotes.github.io%2Fquote%2F38970d0fb0.html&amp;via=5Solas" target="_blank" rel="noopener">Share on X</a><a class="perma" href="../quote/38970d0fb0.html">Permalink</a><a class="src" href="https://reformedcovenanter.wordpress.com/2021/04/22/richard-cameron-wylie-on-measuring-the-american-constitution-by-a-christian-standard/" rel="noopener" target="_blank">Read it online · Reformed Covenanter</a></div>

<blockquote><p>Question 8: May a guilty person plead not guilty, or deny the fact? Answer: Common use is the interpreter of words: If the common use of those words does make their public sense a lie, it may not be done. But if the forensic [legal] common use of the denial is taken to signify no more but this, ‘Let him that accuses me, prove it’ [then]: I am not bound to accuse my self, or, in foro [in court] I am not guilty till it be proved, then it is lawful to plead ‘not-guilty’ and deny the fact, except in cases wherein you are bound to an open confession, or in which the scandal will do more hurt than the denial will do good.</p></blockquote>

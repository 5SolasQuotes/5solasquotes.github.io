<main class="wrap"><figure class="quote" id="q-2137a9d82a" data-kw="">
<blockquote><p>Judging from the nature of the Gospel and of human society together, or judging from the actual history of the facts, we may lay it down, as a position not to be controverted, that when the civil magistrate does not own the truth and recognise it as a friend, then he will view it and treat it as an enemy. The state cannot be neutral; if it is not professedly Christian, it will, directly or indirectly, be the persecutor of Christianity.

It is not enough to allege in reply, that Christianity may claim, and rightfully claim, the same measure of protection as every other form of faith or unbelief; and that, in the toleration granted equally to truth and to falsehood by the civil magistrate, — who, upon the Voluntary theory, is equally indifferent to both, — the Gospel is secure. It may be fairly questioned whether this measure of protection or toleration would cover and include all that Christianity, as the one truth of God, has a right to demand, even were it fully and equally carried out.

At least this much is certain, that our Lord never claimed toleration for His kingdom and truth upon the footing that it had an equal right, and no more than equal, with falsehood, to be owned and protected by Caesar. Nay, our Lord never claimed toleration for His Gospel upon any other ground than that it was the truth, and not falsehood, and had a right, which falsehood had not, to be not only tolerated, but also owned and recognised and submitted to by Caesar.

But, apart from this argument altogether, history teaches the lesson but too plainly, from the record of the past, that where a civil magistrate does not recognise the Gospel, there he never can even protect the profession and demands of the Gospel. The theory of full toleration, on the principle of absolute and evenhanded indifference on the part of the state alike to truth and falsehood, is a mere theory, and nothing more. It is impossible to carry it out fully and fairly into practice. The magistrate himself has a human heart within him, which, if it does not own and love the truth of God, will assuredly deny it and hate it; and if not decidedly the friend, he will be decidedly the enemy, of the Gospel.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/james-bannerman.html">James Bannerman</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Church of Christ: A Treatise on the Nature, Powers, Ordinances, Discipline, and Government of the Christian Church</cite>, ed. D. Douglas Bannerman (2 vols, Edinburgh: T &amp; T Clark, 1868), 1: 143-44.</span></figcaption>

</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-e6f3e4d566" data-kw="">
<blockquote><p>Observe first that he says, “he will cling to his wife” and not “wives.” Next, he says, “the two will be one flesh.” Here polygamy is manifestly condemned, which so effects one flesh that it also pulls man apart into many fleshes. Indeed, it is also true that, after the first institution, that custom prevailed among the fathers. But now I do not dispute how this was done rightly. I say with Christ that it was not this way from the beginning, but neither is anything corrected better than when it is led back to the first institution.</p></blockquote>

</figure><figure class="quote" id="q-dd7252cd57" data-kw="">
<blockquote><p>XVI. Second, the necessity of the case makes many things lawful which otherwise would not be lawful, in domestic affairs as well as in politics. If the doorkeeper of a house is overcome by a lethargy or by apoplexy, he cannot prevent the entrance of thieves, even though it is lawful for any servant to take the keys and to close the gates against them. If he to whom the care of supporting a family is committed denies bread to his children, who would say that it is not lawful for anyone of the domestics to supply them with bread if he can so that they may not perish with hunger? If the father himself rages for the destruction of his children, should not his arms be wrested from him, his children removed and entrusted to a guardian, not waiting for the judgment of a magistrate? Nay, a friend and neighbor can take this upon himself until the public authority has made some provision for them. When a fire is raging, who doubts that it is the duty of all to bring water to extinguish it, especially when they cease to whom this care pertained? Thus in a republic, if the rulers and prefects snore while the enemy approaches; if the gatekeepers open the gates to him; will it not be lawful for any citizen to snatch the keys from the hand of the betrayer in order to shut the gates against the enemy and to call to arms?… When the thing itself calls, what need is there to seek an external call? Nay, if they should cease form a regard to obedience, unmindful of the oath given to their prince, they would be deservedly convicted of perfidy and treachery because here the consciousness of wickedness alone pollutes, from which no one purges himself, unless according to his ability he resists the inrushing evil.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/francis-turretin.html">Francis Turretin</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Institutes of Elenctic Theology</cite>, ed. Dennison, Jr. (P&amp;R), vol. 3, 18th Topic, Question 23, p. 220</span></figcaption>

<main class="wrap"><figure class="quote" id="q-ea95be5137" data-kw="">
<blockquote><p>§3… When Christ says, ‘If thy right eye or hand offend (or scandalize thee) pluck it out,’ or ‘cut it off,’ etc., Mt. 5… He plainly means, ‘if it draw thee to sin,’ or else He had never added that it is better to enter maimed into life than having two eyes or hands to be cast into Hell! That is, in a word, ‘Thy damnation is a greater hurt than the loss of hand or eye, and therefore if there were no other way to avoid it, this would be a very cheap way.&#x27;</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/richard-baxter.html">Richard Baxter</a></span><span class="wk"><span class="lbl">Work:</span> <cite>A Christian Directory: a Sum of Practical Theology and Cases of Conscience</cite>, pp. 80, 82-83</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/the-christian-life/ethics-and-virtue.html">Ethics and Virtue</a></span></div>
<div class="actions"><button class="copy" data-copy="“§3… When Christ says, ‘If thy right eye or hand offend (or scandalize thee) pluck it out,’ or ‘cut it off,’ etc., Mt. 5… He plainly means, ‘if it draw thee to sin,’ or else He had never added that it is better to enter maimed into life than having two eyes or hands to be cast into Hell! That is, in a word, ‘Thy damnation is a greater hurt than the loss of hand or eye, and therefore if there were no other way to avoid it, this would be a very cheap way.&#x27;”

</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-46c286a640" data-kw="">
<blockquote><p>If superiors command that which is above their sphere to command, namely, things not necessary in genere [in their kind], yet if they be not simply evil, subjects may do those things, unless they be evil in their consequence to a higher degree than the not doing of them would be. In this case it is not formal obedience, but they are done for the end’s sake and to avoid evil.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/john-corbet.html">John Corbet</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Of Divine Worship, pt. 3, §6 in The Remains of the Reverend &amp; Learned Mr. John Corbet… (d. 1680; London: Thomas Parkhurst, 1684)</cite>, p. 218</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/the-christian-life/ethics-and-virtue.html">Ethics and Virtue</a></span></div>
<div class="actions"><button class="copy" data-copy="“If superiors command that which is above their sphere to command, namely, things not necessary in genere [in their kind], yet if they be not simply evil, subjects may do those things, unless they be evil in their consequence to a higher degree than the not doing of them would be. In this case it is not formal obedience, but they are done for the end’s sake and to avoid evil.”

— John Corbet, Of Divine Worship, pt. 3, §6 in The Remains of the Reverend &amp; Learned Mr. John Corbet… (d. 1680; London: Thomas Parkhurst, 1684), p. 218">Copy</button><a class="share" href="https://x.com/intent/post?text=%E2%80%9CIf+superiors+command+that+which+is+above+their+sphere+to+command%2C+namely%2C+things+not+necessary+in+genere+%5Bin+their+kind%5D%2C+yet+if+they+be+not+simply+evil%2C+subjects+may+do+those+things%2C+unless+they+be+evil+in+their+consequence+to+a+higher+degree+than+the+not+doing+of+them+would+be.+In+this+case+it+is+not+formal+obedience%2C+but+they+are+done+for+the+end%E2%80%99s+sake+and+to+avoid+evil.%E2%80%9D%0A%0A%E2%80%94+John+Corbet%2C+Of+Divine+Worship%2C+pt.+3%2C+%C2%A76+in+The+Remains+of+the+Reverend+%26+Learned+Mr.+John+Corbet%E2%80%A6+%28d.+1680%3B+London%3A+Thomas+Parkhurst%2C+1684%29%2C+p.+218&amp;url=https%3A%2F%2F5solasquotes.github.io%2Fquote%2F46c286a640.html&amp;via=5Solas" target="_blank" rel="noopener">Share on X</a><a class="perma" href="../quote/46c286a640.html">Permalink</a><a class="src" href="https://reformedbooksonline.com/topics/ethics#:~:text=If%20superiors%20command%20that%20which%20is,end%E2%80%99s%20sake%20and%20to%20avoid%20evil." rel="noopener" target="_blank">Read it online · Reformed Books Online</a></div>
</figure><figure class="quote" id="q-b87385155f" data-kw="">
<blockquote><p>Divines hold absolutely that inter duo vel plura mala culpae [between two or more culpable evils] (such as things scandalous and inconvenient) nullum est eligendum [none are to be chosen]. (Alsted, Theol. Cas., ch. 12, p. 199) That though in evils of punishment we may choose a lesser to shun a greater, yet in evils of fault, election [choosing] has no place, neither may we do a lesser fault to shun a greater: nec ullum admittendum malum, ut eveniat aliquod bonum, sive per se sive per accidens. [Neither ought any evil to be accepted so that it may bring forth some good, either through it or by the occasion of it.] (Paraeus on Rom. 3:8)</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/george-gillespie.html">George Gillespie</a></span><span class="wk"><span class="lbl">Work:</span> <cite>English Popish Ceremonies (1637), bk. 2, ch. 1</cite>, p. 10</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/the-christian-life/ethics-and-virtue.html">Ethics and Virtue</a></span></div>

— George Gillespie, English Popish Ceremonies (1637), bk. 2, ch. 1, p. 10">Copy</button><a class="share" href="https://x.com/intent/post?text=%E2%80%9CDivines+hold+absolutely+that+inter+duo+vel+plura+mala+culpae+%5Bbetween+two+or+more+culpable+evils%5D+%28such+as+things+scandalous+and+inconvenient%29+nullum+est+eligendum+%5Bnone+are+to+be+chosen%5D.+%28Alsted%2C+Theol.+Cas.%2C+ch.+12%2C+p.+199%29+That+though+in+evils+of+punishment+we+may+choose+a+lesser+to+shun+a+greater%2C+yet+in+evils+of+fault%2C+election+%5Bchoosing%5D+has+no+place%2C+neither+may+we+do+a+lesser+fault+to+shun+a+greater%3A+nec+ullum+admittendum+malum%2C+ut+eveniat+aliquod+bonum%2C+sive+per+se+sive+per+accidens.+%5BNeither+ought+any+evil+to+be+accepted+so+that+it+may+bring+forth+some+good%2C+either+through+it+or+by+the+occasion+of+it.%5D+%28Paraeus+on+Rom.+3%3A8%29%E2%80%9D%0A%0A%E2%80%94+George+Gillespie%2C+English+Popish+Ceremonies+%281637%29%2C+bk.+2%2C+ch.+1%2C+p.+10&amp;url=https%3A%2F%2F5solasquotes.github.io%2Fquote%2Fb87385155f.html&amp;via=5Solas" target="_blank" rel="noopener">Share on X</a><a class="perma" href="../quote/b87385155f.html">Permalink</a><a class="src" href="https://reformedbooksonline.com/topics/ethics#:~:text=Divines%20hold%20absolutely%20that%20inter%20duo,of%20it.%5D%20%28Paraeus%20on%20Rom.%203%3A8%29" rel="noopener" target="_blank">Read it online · Reformed Books Online</a></div>
</figure><figure class="quote" id="q-bbd710f39d" data-kw="">
<blockquote><p>…yea there can be no sin eligible [chosen] by such and such a case [of necessary circumstance], as Lot sinned in exposing his daughters to the lust of men, to redeem abstinence from sodomy. Hence it is clear: we may not do a less, nor counsel another to commit a less sin, to eschew a greater, as the Jesuits wickedly teach. So Tannerus, so Turrianus and others who make a scandalum permissum, a scandal that a Christian may hinder another to fall in, and yet he permits him to fall in it. But God has a prerogative to permit sinful scandals, men have no such power, when they are obliged to hinder it. The divinity of others seems better to me, who deny that the least venial [sin] should be committed to eschew a greater sin.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/samuel-rutherford.html">Samuel Rutherford</a></span><span class="wk"><span class="lbl">Work:</span> <cite>A Dispute Touching Scandal &amp; Christian Liberty, p. 83 in The Divine Right of Church Government (1646)</cite></span></figcaption>

</figure><figure class="quote" id="q-21d7debf01" data-kw="">
<blockquote><p>Besides, arguments drawn from scandal in things neither unlawful nor (setting the reason of scandal aside) inexpedient, as they are subject to sundry frailties otherwise, so they are manifestly of no weight at all when they are counterpoised with the apparent danger of evil consequents on the other side. For in such cases there is commonly equal danger (if not rather something more) of scandal to be taken from the example the quite contrary way.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/robert-sanderson.html">Robert Sanderson</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Bishop Sanderson’s Judgment concerning Submission to Usurpers (d. 1663; London, 1678)</cite>, pp. 26-27</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/the-christian-life/ethics-and-virtue.html">Ethics and Virtue</a></span></div>

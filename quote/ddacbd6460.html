<blockquote><p>Free will, in the sense of those [errorists] who maintain it, is [said to be] a power in the will to incline either way, when that which is supernatural and saving is offered as its object; a power and freedom in the will to choose or refuse, to yield or resist, to embrace or reject, as it list. So that this with them is twofold: … 2. To choose, or embrace. The will, they [errorists] say, can incline to that which is spiritually and supernaturally good. They speak not of a capacity, which is not denied, but of an active power. A natural man, by the power of his will, as he can reject Christ, so he can embrace Him; as he can resist converting grace, so he can yield to it as he will; the will can incline itself to this as well as to the other. This is a true representation of their opinion in the other branch of it. Against which we say…</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/david-clarkson.html">David Clarkson</a></span><span class="wk"><span class="lbl">Work:</span> <cite>‘Man’s Insufficiency to do Anything of Himself’, on John 15:5, in The Works of David Clarkson, vol. 2</cite>, p. 128-29</span></figcaption>

<blockquote><p>…divine providence is occupied not only with respect to necessary things, which have a natural connection with their own causes (Jer. 33:20, 25), but also, first, with respect to contingent things, which have an uncertain, fortuitous, and casual connection: either with the existence and nature of God, in which sense all things except God exist contingently, inasmuch as in themselves they are able not to exist; or with their own proximate causes operating accidentally and contingently; or with man’s free choice. That contingent things of this sort are subject to divine governance is taught throughout Scripture (Ex. 21:12–13; Deut. 19:5; Prov. 21:31; Ps. 127:1–2; 46:8–10; Dan. 11:21), even to the smallest things, such as the falling of a hair (Matt. 10:30), the operations of locusts and lice (Ex. 8:17; 10:12; Joel 1:4; Acts 12:23). In these things, accordingly, their own natural contingency does not perish, because they are certainly and infallibly directed, and come to pass, by the first cause. This appears specifically in the lot (Prov. 16:33), by which God decides cases through merely contingent events (Judges 6:37; Josh. 7:14), and likewise in his deciding the end of human life (Ex. 21:12–13; Isa. 38:5). 5. With free actions XVII. It is also occupied, second, with respect to free things that result from choice or counsel. For that these are subject to divine determination (and that certainly physical, not only moral), is evident both by the Scriptures (Prov. 16:1; 19:21; 21:1; Gen. 43:14; Ex. 11:1–3; 4:11; Phil. 2:12), and by reasons, because otherwise free choice would be independent, at least with respect to the act of determining itself. Yet notwithstanding, that these things remain free, is likewise, according to Scripture (1 Peter 5:2; Heb. 10:26) and experience, an indubitable fact. Moreover, by what reckoning the liberty of our choice is consistent with divine predestination is not so difficult to understand (as many think), if we consider that the divine influence and its predetermination does not hinder man from acting from counsel and rational complacency, or from determining himself while remaining otherwise undetermined and indeterminable by any created cause. I will add that if God, by determining the will and therefore producing a volition, deprived the will of liberty, then also the will, by determining itself and procuring its own volition, would deprive itself of liberty, which is contradictory; conversely, if the will, by determining itself, does not destroy its own liberty, then neither does God by doing the same. Wherefore the providence of God, in determining our choice, in no way either takes away or injures the liberty of choice. 6. With moral operations XVIII. It is occupied, namely, third, with respect to moral actions, both good and evil, which, just as from this determination of divine providence they are not any less free, likewise they are not any less ours: for although God is their efficient cause insofar as they are existing things (Acts 17:25, 28), nevertheless man remains their formal cause. God certainly produces faith in man, yet it is not God who believes, but man.</p></blockquote>

<blockquote><p>52. Because nothing is done without a sufficient Reason (sect. 1), also liberty in election cannot act without reason, we therefore define the same as that faculty of the mind to elect or choose out of more possible things what one pleases, agreeable to proposed reasons. Hence all coaction [coercion] by which man is compelled thorugh extrinsical violence is at a great distance from liberty; metaphysical necessity, where there is but one only object possible, and consequently election ceases, has nothing to do with liberty; also physical necessity (i.e. natural necessity), when there is no knowledge of the objects, is far distant from liberty (or is utterly inconsistent with the very nature of it); but there is only a moral necessity, which is no more than a certainty so that man is sweetly and willingly inclined or moved to this or that thing from these or other motives, namely because he sees what things are best. 53. Hence since liberty of indifference is repugnant to the principle of a sufficient reason, it is utterly impossible (i.e. there is no liberty of indifference); it is a chimera (or a groundless and vain imagination which has no foundation in reason or nature); it is nothing but the mere inaction of the will; besides let those who maintain an indifference of the equilibrium in liberty (or those who place the essence of liberty in the indifference of the will), let them answer us (let them reply to the following queries, viz.), Whether God, the (holy) angels and all the inhabitants of heaven are not most free, or act with the most perfect liberty? and whether they are indifferent about good and evil?</p></blockquote>

<blockquote><p>What then is your opinion of liberum arbitrium [free will] in the state of man before conversion? That it is thoroughly bad. The soul, it is true, with its faculties of knowledge (intellectus) and will has remained intact as an essence. But the powers of these faculties for spiritual good have been completely lost…</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/william-bucanus.html">William Bucanus</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Institutes of Theology, 1602, XVIII, 4, as quoted in Heinrich Heppe, Reformed Dogmatics, p. 362. Bucanus’s Institutes was one of the first reformed systematic theologies.</cite></span></figcaption>

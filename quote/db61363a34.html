</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-1ef4dac9cd" data-kw="">
<blockquote><p>To the arguments: To 2. To that which is objected [against election being eternally in God], that the will and love of God is without discretion, it must be said that there is an antecedent will and a consequent will: the antecedent, by which He wills as much as is in Him, and the consequent, by which He wills with the foreknowledge of our salvation; and the first is indeed of all, but the second is not. According to this mode, love is twofold: one, which regards the antecedent will, and with this He loves all; and there is another, which regards the consequent, and with this He loves all those to be saved, and this is election.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/bonaventure.html">Bonaventure</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Commentary on the Sentences</cite>, (d. 1274), bk. 1 | dist. 40, art. 3, On Divine Election, quest. 1, ‘Whether election is in God from eternity, or in time.’</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/attributes-of-god/will-of-god.html">Will of God</a></span></div>

</figure><figure class="quote" id="q-07a072d47b" data-kw="">
<blockquote><p>We assert that the eternal law is above the nature of all other laws (as we just now said). For when we call the eternal law the immutable concept and form of reason, we demonstrate that it is pure, unadulterated act, just as God is a simple actuality on whom, as the universal principle, entirely all things depend. Moreover, when we say that that form of reason has been conceived by God and in God for the common good, we manifestly distinguish the eternal law of God from the rest of the reason of the divine wisdom that acts and occupies itself with created things. For the reason of that divine wisdom, which is prominent in acting, moving, and sustaining created things, is occupied with all things all the time.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/francis-junius.html">Francis Junius</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Mosaic Polity</cite>, (Sources in Early Modern Economics, Ethics, and Law) (CLP Academic, 2015), thesis 2, p. 42</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/attributes-of-god/will-of-god.html">Will of God</a></span></div>

</figure><figure class="quote" id="q-65547cb8c6" data-kw="">
<blockquote><p>These sensual atheists, then turning the grace of God into wantoness and giving over themselves to the following of their lusts, securely derided and scoffed at any directions of holiness or denunciations of judgments which opposed them in their ungodly courses as vain and contemptible fables: … 4. It makes all the means of grace ineffectual; scorners will not be bettered: ‘Rebuke a scorner, and he will hate thee;’ the strength of this sin makes all the helps of holiness to be but weak; they all slide off, as water from an oiled post. A scorner, is (as it were) a brazen wall, which beats back all the arrows of reprehension. Mocking argues obduratenesse in sin; It extinguishes light natural and opposes light spiritual.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/william-jenkyn.html">William Jenkyn</a></span><span class="wk"><span class="lbl">Work:</span> <cite>An Exposition of the Epistle of Jude</cite>, … (London: Maxey, 1654), on vv. 17-19, pp. 569-70</span></figcaption>

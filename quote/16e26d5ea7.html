<main class="wrap"><figure class="quote" id="q-16e26d5ea7" data-kw="">
<blockquote><p>We see, secondly, in these verses [John 9:26-41], how cruelly and unjustly unconverted men will sometimes treat those who disagree with them. When the Pharisees could not frighten the blind man who had been cured, they expelled him from the Jewish Church. Because he manfully refused to deny the evidence of his own senses, they excommunicated him, and put him to an open shame. They cast him out “as a heathen man and a publican [tax-collector].”

The temporal injury that such treatment did to a poor Jew was very great indeed. It cut him off from the outward privileges of the Jewish Church. It made him an object of scorn and suspicion among all true Israelites. But it could do no harm to his soul. That which wicked men bind on earth is not bound in heaven. “The curse causeless shall not come.” (Prov. 26:2.)

The children of God in every age have only too frequently met with like treatment. Excommunication, persecution, and imprisonment have generally been favourite weapons with ecclesiastical tyrants. Unable, like the Pharisees, to answer arguments, they have resorted to violence and injustice. Let the child of God console himself with the thought that there is a true Church out of which no man can cast him, and a Church-membership which no earthly power can take away. He only is blessed whom Christ calls blessed; and he only is accursed whom Christ shall pronounce accursed at the last day.

We see, thirdly, in these verses, how great is the kindness and condescension of Christ. No sooner was this poor blind man cast out of the Jewish Church than Jesus finds him and speaks words of comfort. He knew full well how heavy an affliction excommunication was to an Israelite, and at once cheered him with kind words. He now revealed Himself more fully to this man than He did to any one except the Samaritan woman. In reply to the question, “Who is the Son of God?” He says plainly, “Thou hast both seen Him, and it is He that talketh with thee.”

We have here one among many beautiful illustrations of the mind of Christ. He sees all that His people go through for His sake, and feels for all, from the highest to the lowest. He keeps account of all their losses, crosses, and persecutions. “Are they not all written in His book?” (Psalm. 56:8.) He knows how to come to their hearts with consolation in their time of need, and to speak peace to them when all men seem to hate them. The time when men forsake us is often the very time when Christ draws near, saying, “Fear thou not; for I am with thee: be not dismayed; for I am thy God: I will strengthen thee: yea, I will help thee; yea, I will uphold thee with the right hand of my righteousness.” (Isaiah. 41:10.)</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/j-c-ryle.html">J. C. Ryle</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Expository Thoughts on John: Volume 2</cite>, (1869; Edinburgh: Banner of Truth, 1987), pp 180-81.</span></figcaption>

<blockquote><p>…I grant that persons grosly ignorant and notoriously scandalous and impenitent ought to be excluded from the Lord’s Supper, but it must be done by them only to whom God has given this power, and in such order and manner as the Lord has appointed. That is necessary (says Mr. [John] Ball in his Tryal of the Grounds Tending to Separation, p. 190) to them that have received commission from God, which is unlawful to them that want authority. In the commonwealth the execution of justice is necessary; but private persons must not challenge the sword of the magistrate. In a corporation no one must take that upon himself which belongs to the common-council. Holy things must not be given to prophane persons; but every one at his pleasure must not deny holy things to unholy persons, but unholy persons must be debarred from holy things in such order as God has prescribed.</p></blockquote>

</figure><figure class="quote" id="q-8a69526e11" data-kw="">
<blockquote><p>That this covenant is not dissolved without the consent of this Church. Distinguish here direct dissolution from indirect, or that which consequently accompanies something else. The former is when someone decides to migrate elsewhere of his own accord; cessation of actual and explicit communion with and in that particular Church follows migration. Here, a free person is subject to the judgment of no Church; nor do the Bin and Luc. 12, D. 14, 14, which pertain directly to the Church. Unless someone extends ecclesiastical unity and power with the Pontificals to all secular matters, in order, as they say, to spiritual matters. … Furthermore, another departure is different from renunciation and separation or division, from exchange: just as one moves from one room to another in the same house, or from house to house in the same city. The former is directly subordinated to the judgment and authority of the Church; the latter is not at all. For he does not depart from Christ and ecclesiastical communion who migrates from one church to another. But he does depart who through migration forsakes all external communion of the Church or even passes over to sects.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/gisbertus-voetius.html">Gisbertus Voetius</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Ecclesiastical Politics</cite>, tr. by AI (Amsterdam: Joannes à Waesberge, 1663–1676), vol. 1, ‘The Nature of the Instituted Church’, pp. 62-63 (PDF p. 67)</span></figcaption>

<blockquote><p>There have been many heresies before them [the Arians], which, venturing further than they ought, have fallen into folly; but these men by endeavouring in all their cavils to overthrow the Divinity of the Word, have justified the other in comparison of themselves, as approaching nearer to Antichrist. Wherefore they have been excommunicated and anathematized by the Church.

We grieve for their destruction, and especially because, having once been instructed in the doctrines of the Church, they have now sprung away. Yet we are not greatly surprised, for Hymenaeus and Philetus did the same, and before them Judas, who followed the Saviour, but afterwards became a traitor and an apostate.</p></blockquote>

<blockquote><p>Lawyer: But you did not answer [the verse], ‘from such turn away, and with such not to eat, etc.’ Minister: The answer is obvious:

1. It is the duty of the Church to cast out wicked impenitent men; and this Christ commands them; but He never bids particular Christians to separate from the Church where some such are because the Church omits its duty: For then you should separate from duty, from God’s worship and holy communion on pretence of separating from sinners.

2. But for family and private converse, every Christian is judge himself, and must refuse all familiarity with scandalous Christians which encourages them in sin or seems to own it. God commands no man to do that which is not in his power; to put a scandalous impenitent man from the Church, is in the Church’s power, and so that command belongs to them; it is not in your power, and therefore belongs not to you save to admonish men and tell the Church; but to put men from your table and familiarity is in your power and belongs to you. Suppose the king write to the city of London to put all rebels out of their company and converse; it’s easy to understand that every one must do it only in his own place. Every single man cannot turn such out of the common-council: The city rulers must do that, and till it be done, single men may not deny obedience to the governours: But all may turn them out of their houses, shops and familiarity.</p></blockquote>

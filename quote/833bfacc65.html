<main class="wrap"><figure class="quote" id="q-833bfacc65" data-kw="">
<blockquote><p>He takes it unkindly that I will not stand to the English Translation of the word κρίμα, damnation, but rather translate it so, They that resist shall receive to themselves judgement.

To which I say, that I do not deny but grant that the Word may be translated Damnation: but seeing the word firstly signifies Judgement, as Piscator observes; I would not have the Dr. so peremptory, scaring people with the word damnation, when as more naturally the word may be rendered otherwise, I told him before what Piscator’s reason is, for the translating of it Judgement, he may read what Musculus also said, and in him what many other Divines, who speaks thus.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/william-bridge.html">William Bridge</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The truth of the times vindicated whereby the lawfulness of Parliamentary proceedings in taking up of arms, is justified, Doctor Ferne’s reply answered, and the case in question more fully resolved</cite>, (London: Ben. Allen, 1643), pp 38-39.</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/civil-government-and-society/the-civil-magistrate.html">The Civil Magistrate</a></span></div>

</figure><figure class="quote" id="q-81e332f51c" data-kw="">
<blockquote><p>The paying of money to the clerks [related to the Scottish third Indulgence of 1679]… These clerks seek it not by the prelates’ authority, but upon the [civil] council’s appointment, backed with charges of horning [being declared a rebel and having civil protections taken away]; and whether it be rather eligible to [choose to] pay a little money, or to be put to the horn and taken with caption, let any sober person judge. The scruples that the author [John Brown of Wamphray] and some others have put in the people’s heads about paying of stipends to the conformists and sessors [tax assessors and collectors] have wasted some peoples’ estates and tends to waste their consciences; for when they are quartered on and eaten up and plundered, they are driven to do what they thought sinful [i.e. to pay the tax]; and this disposes them to do things that are truly sinful upon temptations; and when they are by necessity driven to pay, they who wait for their halting, allege they have no conscience; and if they were put to it in other things, they would do all that would be required of them.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/william-vilant.html">William Vilant</a></span><span class="wk"><span class="lbl">Work:</span> <cite>A Review &amp; Examination of a Book bearing the Title of The History of the Indulgence</cite>, (London: Cockerill, 1681), p. 228</span></figcaption>

&amp;text=do%20all%20that%20would%20be%20required%20of%20them" rel="noopener" target="_blank">Read it online · Reformed Books Online</a></div>
</figure><figure class="quote" id="q-c1a1f211d5" data-kw="">
<blockquote><p>But Magistrates as Magistrates hold forth in their Law-abstinence from those same sins of adultery, incest, murder; But:

1. Not to the consciences of their subjects, but to the outer man as members of the commonwealth.

2. Not under the pain of eternal wrath and condemnation, before the judge of quick and dead: Magistrates as Magistrates have neither calling, office, place nor power to threaten or inflict eternal punishment; if Magistrates do persuade the equity of abstinence from adultery, incest, murder, in their statutes, or acts of parliament, from the Word of God, from the sixth and seventh command of the Decalogue, from the judgement and eternal punishment that follows these sins, they so persuade not as magistrates, but as divines, and as godly and Christian men…

3. Magistrates as Magistrates hold forth in their Law, abstinence from these sins, not as the ambassadors of Christ, craving subjection of conscience and divine-faith to those charges, but only external obedience: for though ministers as ministers crave faith and subjection of conscience to all commandments and inhibitions, as in Christ’s stead, 2 Cor. 5:19-20, yet the magistrate as the magistrate does not crave either faith or subjection of conscience; nor is he in Christ’s stead to lay divine bands on the conscience, to submit the soul and conscience to believe and abstain; he is the deputy of God as the God of Order, and as the Creator, and Founder, and another of human societies and of Peace, to exact external obedience, and to lay bands on your hands not to shed innocent blood, and on your body not to defile it with adultery, or incest, nor to violate the chastity of your brother… when the magistrate punishes spiritual sins, heresy, idolatry, he punishes them only with temporary punishment.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/samuel-rutherford.html">Samuel Rutherford</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Divine Right of Church Government</cite>, ... (1646), pp. 550-51</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/civil-government-and-society/the-civil-magistrate.html">The Civil Magistrate</a></span></div>

<blockquote><p>Concerning the Civil Magistrate … 2. For the due form of government, or power of governors in any nation, they believe God’s Word has fixed no universal rule, only confirming the just laws of kingdoms and polities, and they believe it their duty to be obedient to such governors in all places, as the laws in that place have established, and in the exercise of such power as those laws have given them. From the obedience to which no person upon the account of religion can pretend to an immunity; and in the exercise of which no magistrate ought by any to be resisted.</p></blockquote>

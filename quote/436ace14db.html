</figure><figure class="quote" id="q-f773a7b874" data-kw="">
<blockquote><p>Since we have been delivered from our misery by grace alone through Christ, without any merit of our own, why must we yet do good works? Because Christ, having redeemed us by his blood, also renews us by his Holy Spirit to be his image, so that with our whole life we may show ourselves thankful to God for his benefits, and he may be praised by us. Further, that we ourselves may be assured of our faith by its fruits, and that by our godly walk of life we may win our neighbours for Christ.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/zacharias-ursinus-caspar-olevianus.html">Zacharias Ursinus &amp; Caspar Olevianus</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Heidelberg Catechism</cite>, Q&amp;A 86</span></figcaption>

</figure><figure class="quote" id="q-9d95ad2e21" data-kw="">
<blockquote><p>2. We are mere patients in the causes of blessedness; but in respect of conditions we are not so: for as we said of faith, we may also say of good works: God enables to them, but man works them, and walks in the way of them to blessedness: not that our works are causes, but conditions without which blessedness is not attained. See Mt. 25:35. 3. This assertion [previously objected] bewrays great ignorance of the proper and present use of sanctification, and the duties of it; which they conceive as legally urged to help the believer in his title and right to the blessed inheritance purchased in heaven: whereas only Christ’s righteousness and merits give right and title unto heaven; but yet the grace of sanctification gives us an aptitude and fitness unto it: for, ‘without holiness none shall see God,’ Heb. 12:14, and, no unclean thing shall enter into the gates of that City. (Rev. 21:27) Yea it is proceeding in sanctification to the measure and stature of Christ that fits us to the vision and fruition of the glorious presence of God, and for the full possession of that heavenly inheritance.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/thomas-taylor.html">Thomas Taylor</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Regula Vitæ: the Rule of the Law under the Gospel</cite>, … (London: Dawman, 1631), ch. 4, 3rd Error, pp. 72-73 Taylor (1576–1632) was a partially conforming English minister, sympathetic with the puritans.</span></figcaption>

<blockquote><p>24. And although that obedience is no part of that righteousness by which we are justified, or by the merit of which our sins are forgiven; yet it is no less than faith itself (from which it arises) necessary for us unto eternal salvation, since without it there is no hope that the imputed righteousness of Christ can profit us. (Rom. 6:2-3, 22; Heb. 12:14)</p></blockquote>

<blockquote><p>…this is not to be conceived in the way of some transient actions that pass away and leave not so much as a relative change. No, for when God does justify us at first, we are upon our believing put into a state and a fixed condition of peace with God. Thus the Scripture speaks of it as a state, like that of sanctification and glorification; so that while we are sleeping we are justified, because put into that estate, although we do not then actually believe. The first act therefore of faith receiving Christ, in whom we are justified, is like the putting of one into a state of marriage, or of magistracy: Though the first act pass away, yet the relative change it has made continues always; We are not justified by the habit of faith, but by the act, and yet after the first act we stand justified, though we are not all the day long actually believing. Its true, many learned divines say justification is a continued action, and it may be granted in this sense, that God does daily justify believers, even as He constantly preserves them in their natural being; but it is not true in this sense, as if we were put into a new state of justification every day. This is not only to make a first and a second justification, but a thousand justifications; remission of sins and imputation of Christ’s righteousness are reiterated; but justification besides these does connote a fixed estate of the justified person, which is but once, and the Mediator of the Covenant of grace does so firmly uphold this privilege, that there shall never be any total intercission of it, neither do ever any plenarily apostatize from this wonderful favor, that once received it.</p></blockquote>

<blockquote><p>4. We are justified by works, and not by faith only; by which are meant the fruits of sanctification: for true faith and true holiness will show itself by good works; faith gives us the first right, but works continue it, for otherwise a course of sin would put us into a state of damnation again: therefore at the Last Judgment these are considered, Rev. 20:12, ‘And the dead were judged out of those things which were written in the books, according to their works.’ Mt. 25:35-36: ‘For I was an hungry, and ye gave me meat; I was thirsty, and ye gave me drink; I was a stranger, and ye took me in; naked, and ye cloathed me; I was sick, and ye visited me; I was in prison, and ye came unto me.’ Faith is our consent, but obedience verifies it, or is our performance of what we consented unto; the one as covenant-making, the other as covenant-keeping; we are admitted by covenant-making, but continued in our privileges by covenant-keeping, Ps. 25:10, ‘All the paths of the Lord are mercy and truth unto such as keep his Covenant.’</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/thomas-manton.html">Thomas Manton</a></span><span class="wk"><span class="lbl">Work:</span> <cite>A Second Volume of Sermons preached by the late reverend and learned Thomas Manton in two parts: the first containing 27 Sermons on the Twenty-Fifth chapter of St. Matthew</cite>, … (London: Astwood, 1684), Sermons on Rom. 8, Sermon 43, on Rom. 8:33, p. 336</span></figcaption>

<blockquote><p>So in treating of our restoration, Paul intimates in close connection issuing from our very justification before God–provided conviction of it is ours–the immediate presence in believers of the Spirit, the fashioner of all the righteousness we are to display in our lives. Hence he never uses the word ‘justify’ in this way without appearing to speak no less of this imparting of true righteousness than of the round and head of our entire salvation, the forgiveness of sins. In chapter 3 (verse 25) [of Romans] after saying that righteousness is revealed in the era of the unveiling of the gospel, that is to say, is so clearly manifested in the lives of believers that the world now acknowledges these alone to be capable of true righteousness, and after saying secondly, that Christ came to introduce to the world an endeixis, a demonstration of divine righteousness unmistakable to all, he then added, ‘that God himself might be righteous, and the justifier of him who has faith in Jesus Christ’. Here without a doubt he includes at the same time in the word ‘justify’ that righteousness which God produces by his Spirit in those who believe in Christ, and which he intends to be his attestation to the effect that he has now forgiven their sins and counts them among those he resolved to justify, that is, to count among the righteous not only by pardoning their sin but also by conforming them to the image of his Son. The apostle always speaks about our justification in this fashion, never failing to comprehend the summit of our salvation, for which he prayed for the Philippians as follows: ‘It is my prayer that your love may abound more and more in knowledge and all aesthesis (that is, a quality of discernment) whereby you may be able to approve with certainty what is excellent, and to this end, that you may be pure and give offence to no one, thus being equipped for the day of Christ, and filled with the fruits of righteousness which are produced through Jesus Christ to the glory and praise of God.’ [1:9-11] Consequently, since Paul is accustomed to speaking in this way, denoting by the word ‘justification’ first of course the remission of sins, yet at the same time always indicating in addition that imparting of righteousness which God proceeds to work in us by the Spirit, the same Spirit by whom he grants us assurance of the pardon of our sins and of his goodwill towards us, and whom he has established the seal (sphragis) of that pardon–because, I say, Paul customarily speaks in these terms, the majority of the holy Fathers, bearing in mind no doubt the more visible aspect of justification, have taken dikaiousthai, ‘to be justified’, in the sense of ‘to be made righteous… It goes without saying that however great a degree of righteousness the Spirit of Christ might effect in us when we believe, it will nonetheless [not?] be sufficient to merit our being regarded as righteous in God’s sight, for we remain unprofitable servants even when we have fulfilled all his bidding. It was with this in mind that Philip Melanchthon in his highly erudite and devout Commentary on this Epistle rightly condemns those who want to make, “We are justified by faith,’ mean, “Faith is the source or cause that produces other virtues for whose sake we are pronounced righteous,’ or ‘Faith itself is in us a virtue, deserving of God’s approval.’ And he subjoins these godly words: ‘“We are justified by faith,” should be transposed in[to] this sentence: “We are reckoned righteous by mercy.” Similarly, “we are justified by faith alone” means, “We are pronounced righteous by trusting in mercy alone”–so it is only for us to add, ‘as we are given the assurance that we are so pronounced, and thus know by experience this merciful favour of God.’ Surely no godly soul can doubt for a moment that it is through God’s mercy alone and for the sake of Christ’s merit alone that we are justified, pronounced righteous before God, and not because of anything in us at all, however many works of holiness, however genuine our fruits of the Spirit. For who is ignorant of the Scripture, ‘Enter not into judgment with thy servant, for no man living will be justified before thee’? [Ps. 143:2] And in Isaiah, ‘In the Lord shall all the seed of Israel be justified and praised’. [Isa. 45:25]</p></blockquote>

<div class="meta"><span class="t"><a href="../topics/justification/twofold-justification.html">Twofold Justification and Its Increase</a></span></div>

 which are produced through Jesus Christ to the glory and praise of God.’ [1:9-11] Consequently, since Paul is accustomed to speaking in this way, denoting by the word ‘justification’ first of course the remission of sins, yet at the same time always indicating in addition that imparting of righteousness which God proceeds to work in us by the Spirit, the same Spirit by whom he grants us assurance of the pardon of our sins and of his goodwill towards us, and whom he has established the seal (sphragis) of that pardon–because, I say, Paul customarily speaks in these terms, the majority of the holy Fathers, bearing in mind no doubt the more visible aspect of justification, have taken dikaiousthai, ‘to be justified’, in the sense of ‘to be made righteous… It goes without saying that however great a degree of righteousness the Spirit of Christ might effect in us when we believe, it will nonetheless [not?] be sufficient to merit our being regarded as righteous in God’s sight, for we remain unprofitable servants even when we have fulfilled all his bidding. It was with this in mind that Philip Melanchthon in his highly erudite and devout Commentary on this Epistle rightly condemns those who want to make, “We are justified by faith,’ mean, “Faith is the source or cause that produces other virtues for whose sake we are pronounced righteous,’ or ‘Faith itself is in us a virtue, deserving of God’s approval.’ And he subjoins these godly words: ‘“We are justified by faith,” should be transposed in[to] this sentence: “We are reckoned righteous by mercy.” Similarly, “we are justified by faith alone” means, “We are pronounced righteous by trusting in mercy alone”–so it is only for us to add, ‘as we are given the assurance that we are so pronounced, and thus know by experience this merciful favour of God.’ Surely no godly soul can doubt for a moment that it is through God’s mercy alone and for the sake of Christ’s merit alone that we are justified, pronounced righteous before God, and not because of anything in us at all, however many works of holiness, however genuine our fruits of the Spirit. For who is ignorant of the Scripture, ‘Enter not into judgment with thy servant, for no man living will be justified before thee’? [Ps. 143:2] And in Isaiah, ‘In the Lord shall all the seed of Israel be justified and praised’. [Isa. 45:25]”

that+is%2C+a+quality+of+discernment%29+whereby+you+may+be+able+to+approve+with+certainty+what+is+excellent%2C+and+to+this+end%2C+that+you+may+be+pure+and+give+offence+to+no+one%2C+thus+being+equipped+for+the+day+of+Christ%2C+and+filled+with+the+fruits+of+righteousness+which+are+produced+through+Jesus+Christ+to+the+glory+and+praise+of+God.%E2%80%99+%5B1%3A9-11%5D+Consequently%2C+since+Paul+is+accustomed+to+speaking+in+this+way%2C+denoting+by+the+word+%E2%80%98justification%E2%80%99+first+of+course+the+remission+of+sins%2C+yet+at+the+same+time+always+indicating+in+addition+that+imparting+of+righteousness+which+God+proceeds+to+work+in+us+by+the+Spirit%2C+the+same+Spirit+by+whom+he+grants+us+assurance+of+the+pardon+of+our+sins+and+of+his+goodwill+towards+us%2C+and+whom+he+has+established+the+seal+%28sphragis%29+of+that+pardon%E2%80%93because%2C+I+say%2C+Paul+customarily+speaks+in+these+terms%2C+the+majority+of+the+holy+Fathers%2C+bearing+in+mind+no+doubt+the+more+visible+aspect+of+justification%2C+have+taken+dikaiousthai%2C+%E2%80%98to+be+justified%E2%80%99%2C+in+the+sense+of+%E2%80%98to+be+made+righteous%E2%80%A6+It+goes+without+saying+that+however+great+a+degree+of+righteousness+the+Spirit+of+Christ+might+effect+in+us+when+we+believe%2C+it+will+nonetheless+%5Bnot%3F%5D+be+sufficient+to+merit+our+being+regarded+as+righteous+in+God%E2%80%99s+sight%2C+for+we+remain+unprofitable+servants+even+when+we+have+fulfilled+all+his+bidding.+It+was+with+this+in+mind+that+Philip+Melanchthon+in+his+highly+erudite+and+devout+Commentary+on+this+Epistle+rightly+condemns+those+who+want+to+make%2C+%E2%80%9CWe+are+justified+by+faith%2C%E2%80%99+mean%2C+%E2%80%9CFaith+is+the+source+or+cause+that+produces+other+virtues+for+whose+sake+we+are+pronounced+righteous%2C%E2%80%99+or+%E2%80%98Faith+itself+is+in+us+a+virtue%2C+deserving+of+God%E2%80%99s+approval.%E2%80%99+And+he+subjoins+these+godly+words%3A+%E2%80%98%E2%80%9CWe+are+justified+by+faith%2C%E2%80%9D+should+be+transposed+in%5Bto%5D+this+sentence%3A+%E2%80%9CWe+are+reckoned+righteous+by+mercy.%E2%80%9D+Similarly%2C+%E2%80%9Cwe+are+justified+by+faith+alone%E2%80%9D+means%2C+%E2%80%9CWe+are+pronounced+righteous+by+trusting+in+mercy+alone%E2%80%9D%E2%80%93so+it+is+only+for+us+to+add%2C+%E2%80%98as+we+are+given+the+assurance+that+we+are+so+pronounced%2C+and+thus+know+by+experience+this+merciful+favour+of+God.%E2%80%99+Surely+no+godly+soul+can+doubt+for+a+moment+that+it+is+through+God%E2%80%99s+mercy+alone+and+for+the+sake+of+Christ%E2%80%99s+merit+alone+that+we+are+justified%2C+pronounced+righteous+before+God%2C+and+not+because+of+anything+in+us+at+all%2C+however+many+works+of+holiness%2C+however+genuine+our+fruits+of+the+Spirit.+For+who+is+ignorant+of+the+Scripture%2C+%E2%80%98Enter+not+into+judgment+with+thy+servant%2C+for+no+man+living+will+be+justified+before+thee%E2%80%99%3F+%5BPs.+143%3A2%5D+And+in+Isaiah%2C+%E2%80%98In+the+Lord+shall+all+the+seed+of+Israel+be+justified+and+praised%E2%80%99.+%5BIsa.+45%3A25%5D%E2%80%9D%0A%0A%E2%80%94+Martin+Bucer%2C+Common+Places%2C+pp.+162%E2%80%9364+in+Steven+Wedgeworth%2C+%E2%80%98Bucer+on+Double+Justification%E2%80%99+%282008%29+at+Wedgewords&amp;url=https%3A%2F%2F5solasquotes.github.io%2Fquote%2Ff6b0d135b8.html&amp;via=5Solas" target="_blank" rel="noopener">Share on X</a><a class="perma" href="../quote/f6b0d135b8.html">Permalink</a><a class="src" href="https://reformedbooksonline.com/on-a-twofold-justification/#:~:text=So%20in%20treating%20of%20our%20restoration,be%20justified%20and%20praised%E2%80%99.%20%5BIsa.%2045%3A25&amp;text=So%20in%20treating%20of%20our%20restoration%2C%20Paul%20intimates&amp;text=of%20Israel%20be%20justified%20and%20praised%E2%80%99.%20%5BIsa.%2045%3A25" rel="noopener" target="_blank">Read it online · Reformed Books Online</a></div>

<blockquote><p>For justification, see what it is: the Scripture in St. Paul’s epistles speaks of justification by faith; and in St. James, of justification by works. Now it will be useful for us in this point to know whence justification comes. It comes from justice, tsedeck as the original [Hebrew] has it, and ‘to justify’; so that justification and righteousness depend one upon the other. For what is justification but the manifestation of the righteousness that is in a man? and therefore in Gal. 3:21, they are put for one and the same thing: ‘For if there had been a Law given which could have given life, verily righteousness had been by the Law;’ that is, justification had been by the Law. Again, ‘If righteousness be by the Law, then Christ is dead in vain,’ Gal. 2. That is also: If justification had been by the Law, etc. justification is a manifestation of righteousness. And as many ways as righteousness is taken, so many ways is justification, which is a declaration of righteousness; so that if there be a double righteousness, there must be also a double justification. Beloved, I bring you no new doctrine; be not afraid of that; but I show you how to reconcile places of Scripture against the Church of Rome and those things which the Papists bring against us in this point. It stands by reason, seeing justification is a declaration of righteousness, that there must be so many sorts of justification as there be of righteousness. Now there is a double sort of righteousness, Rom. 8:4, ‘That the righteousness of the Law may be fulfilled in us.’ See then there is a double righteousness: there is a righteousness fulfilled in us, and a righteousness fulfilled by us; that is walking in the Spirit. The righteousness fulfilled in us is fulfilled by another and is made ours by imputation; so we have a righteousness without us and a righteousness inherent in us; the righteousness without us is forgiveness of sins and pardon of them, which is a gracious act of God, letting fall all actions against me, and accounting of me as if I had never sinned against Him all my lifetime; then there is a righteousness within me, an inherent righteousness. And if a righteousness, then justification; for that is but a declaration of righteousness. And so that which the Fathers call “justification” is taken generally for sanctification; that which we call “justification”, they call forgiveness of sins; that which we call “sanctification”, they call “justification”; so that the difference is only in the terms. Justification we must know, is not taken only as opposed to condemnation, which is the first kind of righteousness: Rom. 6:7, ‘He that is dead, is freed from sin.’ If you look to the Greek or to the margin, it is, ‘He that is dead is justified from sin;’ this is not taken in the first sense as opposed to condemnation, but in the other sense as it has relation to final grace; The perfection of sanctification is wrought in me; for where there is final grace, there is a supersedeas from all sin; so Rev. 22:11, ‘Let him that is righteous, be righteous still;’ the Greek is, ‘Let him that is righteous, be justified still.’ See then the difference between Saint Paul and Saint James. Saint Paul speaks of that which consists in remission of sins, as in comparing the apostle with David will appear, ‘Blessed is the man whose sins are forgiven.’ [Ps. 32:1] Saint James speaks of justification in the second acception. You need not fly to that distinction of justification before God and justification before men; think not that Saint James speaks only of justification before men. Was not Abraham our father justified by works when he offered up Isaac on the altar? [Gen. 22] What, justified by killing his son? this was a proper work indeed to justify him before man, to be a parricide; to kill his son, though it were not so before God. So Ps. 106, we read how God accounted the act of Phineas as for righteousness. Thus you see how works are accounted righteousness in the second kind of righteousness. In the former righteousness we are justified by faith; for in righteousness inherent there is a goodly chain of virtues: ‘Add to your faith virtue,’ etc. Add one grace to another; add to virtue knowledge. Faith is but one part of the crown. Now this justification in the first sense whereby my sins are forgiven is called the righteousness of God because of Christ which is God, because it is wrought by Christ, Dan. 9; He is called an everlasting righteousness, which continues forever world without end; for do not think the saints in Heaven have only the second kind of righteousness; for they have the same covering by justification by Christ in Heaven that they had before; God covers their sins not here only, but there also; justification follows them forever.</p></blockquote>

— James Ussher, Eighteen Sermons preached in Oxford, 1640, of conversion, unto God, of redemption &amp; justification, by Christ (London: 1660) | 15th Sermon, on Rom. 5:1, pp. 396-99">Copy</button><a class="share" href="https://x.com/intent/post?text=%E2%80%9CFor+justification%2C+see+what+it+is%3A+the+Scripture+in+St.+Paul%E2%80%99s+epistles+speaks+of+justification+by+faith%3B+and+in+St.+James%2C+of+justification+by+works.+Now+it+will+be+useful+for+us+in+this+point+to+know+whence+justification+comes.+It+comes+from+justice%2C+tsedeck+as+the+original+%5BHebrew%5D+has+it%2C+and+%E2%80%98to+justify%E2%80%99%3B+so+that+justification+and+righteousness+depend+one+upon+the+other.+For+what+is+justification+but+the+manifestation+of+the+righteousness+that+is+in+a+man%3F+and+therefore+in+Gal.+3%3A21%2C+they+are+put+for+one+and+the+same+thing%3A+%E2%80%98For+if+there+had+been+a+Law+given+which+could+have+given+life%2C+verily+righteousness+had+been+by+the+Law%3B%E2%80%99+that+is%2C+justification+had+been+by+the+Law.+Again%2C+%E2%80%98If+righteousness+be+by+the+Law%2C+then+Christ+is+dead+in+vain%2C%E2%80%99+Gal.+2.+That+is+also%3A+If+justification+had+been+by+the+Law%2C+etc.+justification+is+a+manifestation+of+righteousness.+And+as+many+ways+as+righteousness+is+taken%2C+so+many+ways+is+justification%2C+which+is+a+declaration+of+righteousness%3B+so+that+if+there+be+a+double+righteousness%2C+there+must+be+also+a+double+justification.+Beloved%2C+I+bring+you+no+new+doctrine%3B+be+not+afraid+of+that%3B+but+I+show+you+how+to+reconcile+places+of+Scripture+against+the+Church+of+Rome+and+those+things+which+the+Papists+bring+against+us+in+this+point.+It+stands+by+reason%2C+seeing+justification+is+a+declaration+of+righteousness%2C+that+there+must+be+so+many+sorts+of+justification+as+there+be+of+righteousness.+Now+there+is+a+double+sort+of+righteousness%2C+Rom.+8%3A4%2C+%E2%80%98That+the+righteousness+of+the+Law+may+be+fulfilled+in+us.%E2%80%99+See+then+there+is+a+double+righteousness%3A+there+is+a+righteousness+fulfilled+in+us%2C+and+a+righteousness+fulfilled+by+us%3B+that+is+walking+in+the+Spirit.+The+righteousness+fulfilled+in+us+is+fulfilled+by+another+and+is+made+ours+by+imputation%3B+so+we+have+a+righteousness+without+us+and+a+righteousness+inherent+in+us%3B+the+righteousness+without+us+is+forgiveness+of+sins+and+pardon+of+them%2C+which+is+a+gracious+act+of+God%2C+letting+fall+all+actions+against+me%2C+and+accounting+of+me+as+if+I+had+never+sinned+against+Him+all+my+lifetime%3B+then+there+is+a+righteousness+within+me%2C+an+inherent+righteousness.+And+if+a+righteousness%2C+then+justification%3B+for+that+is+but+a+declaration+of+righteousness.+And+so+that+which+the+Fathers+call+%E2%80%9Cjustification%E2%80%9D+is+taken+generally+for+sanctification%3B+that+which+we+call+%E2%80%9Cjustification%E2%80%9D%2C+they+call+forgiveness+of+sins%3B+that+which+we+call+%E2%80%9Csanctification%E2%80%9D%2C+they+call+%E2%80%9Cjustification%E2%80%9D%3B+so+that+the+difference+is+only+in+the+terms.+Justification+we+must+know%2C+is+not+taken+only+as+opposed+to+condemnation%2C+which+is+the+first+kind+of+righteousness%3A+Rom.+6%3A7%2C+%E2%80%98He+that+is+dead%2C+is+freed+from+sin.%E2%80%99+If+you+look+to+the+Greek+or+to+the+margin%2C+it+is%2C+%E2%80%98He+that+is+dead+is+justified+from+sin%3B%E2%80%99+this+is+not+taken+in+the+first+sense+as+opposed+to+condemnation%2C+but+in+the+other+sense+as+it+has+relation+to+final+grace%3B+The+perfection+of+sanctification+is+wrought+in+me%3B+for+where+there+is+final+grace%2C+there+is+a+supersedeas+from+all+sin%3B+so+Rev.+22%3A11%2C+%E2%80%98Let+him+that+is+righteous%2C+be+righteous+still%3B%E2%80%99+the+Greek+is%2C+%E2%80%98Let+him+that+is+righteous%2C+be+justified+still.%E2%80%99+See+then+the+difference+between+Saint+Paul+and+Saint+James.+Saint+Paul+speaks+of+that+which+consists+in+remission+of+sins%2C+as+in+comparing+the+apostle+with+David+will+appear%2C+%E2%80%98Blessed+is+the+man+whose+sins+are+forgiven.%E2%80%99+%5BPs.+32%3A1%5D+Saint+James+speaks+of+justification+in+the+second+acception.+You+need+not+fly+to+that+distinction+of+justification+before+God+and+justification+before+men%3B+think+not+that+Saint+James+speaks+only+of+justification+before+men.+Was+not+Abraham+our+father+justified+by+works+when+he+offered+up+Isaac+on+the+altar%3F+%5BGen.+22%5D+What%2C+justified+by+killing+his+son%3F+this+was+a+proper+work+indeed+to+justify+him+before+man%2C+to+be+a+parricide%3B+to+kill+his+son%2C+though+it+were+not+so+before+God.+So+Ps.+106%2C+we+read+how+God+accounted+the+act+of+Phineas+as+for+righteousness.+Thus+you+see+how+works+are+accounted+righteousness+in+the+second+kind+of+righteousness.+In+the+former+righteousness+we+are+justified+by+faith%3B+for+in+righteousness+inherent+there+is+a+goodly+chain+of+virtues%3A+%E2%80%98Add+to+your+faith+virtue%2C%E2%80%99+etc.+Add+one+grace+to+another%3B+add+to+virtue+knowledge.+Faith+is+but+one+part+of+the+crown.+Now+this+justification+in+the+first+sense+whereby+my+sins+are+forgiven+is+called+the+righteousness+of+God+because+of+Christ+which+is+God%2C+because+it+is+wrought+by+Christ%2C+Dan.+9%3B+He+is+called+an+everlasting+righteousness%2C+which+continues+forever+world+without+end%3B+for+do+not+think+the+saints+in+Heaven+have+only+the+second+kind+of+righteousness%3B+for+they+have+the+same+covering+by+justification+by+Christ+in+Heaven+that+they+had+before%3B+God+covers+their+sins+not+here+only%2C+but+there+also%3B+justification+follows+them+forever.%E2%80%9D%0A%0A%E2%80%94+James+Ussher%2C+Eighteen+Sermons+preached+in+Oxford%2C+1640%2C+of+conversion%2C+unto+God%2C+of+redemption+%26+justification%2C+by+Christ+%28London%3A+1660%29+%7C+15th+Sermon%2C+on+Rom.+5%3A1%2C+pp.+396-99&amp;url=https%3A%2F%2F5solasquotes.github.io%2Fquote%2F212ccc2b72.html&amp;via=5Solas" target="_blank" rel="noopener">Share on X</a><a class="perma" href="../quote/212ccc2b72.html">Permalink</a><a class="src" href="https://reformedbooksonline.com/on-a-twofold-justification/#:~:text=For%20justification%2C%20see%20what%20it%20is,there%20also%3B%20justification%20follows%20them%20forever&amp;text=For%20justification%2C%20see%20what%20it%20is%3A%20the%20Scripture&amp;text=only%2C%20but%20there%20also%3B%20justification%20follows%20them%20forever" rel="noopener" target="_blank">Read it online · Reformed Books Online</a></div>

<main class="wrap"><figure class="quote" id="q-4a3de6de98" data-kw="">
<blockquote><p>It is good for us to mind what Christ says of great sinners, Mt. 12:31-32, ‘I say unto you, all manner of sin and blasphemy shall be forgiven unto men.’ When Christ says, ‘all manner of sin and blasphemy shall be forgiven unto men,’ and excepts none but the blasphemy against the Holy Ghost, no, not a word spoken against the Son of Man Himself, we may well think a word spoken or a deed done against ourselves may be pardoned; and that it may be so, [we] should pray for it; and we may hope for a good effect of it. Stephen’s prayer, when he was stoned (Acts 7:60), probably had an influence on Paul’s conversion. St. John tells us, 1 John 5:16, ‘If any man see his brother sin a sin which is not unto death, he shall ask, and he shall give him life for them that sin not unto death.’ So that unless a man could be assured that another has sinned that sin which is unto death, he may, nay, he ought to pray for him: ‘He shall ask, etc.’ In any case where there is but an ‘if so be,’ or a ‘who can tell,’ or a ‘perhaps,’ there is room left for prayer. In that mighty tempest that arose in the sea to arrest Jonah as he was going to Tarshish, which was like to have broken the ship, he is called on to arise and call upon his God, Jon. 1:6, ‘If so be that God will think upon us, that we perish not.’ Their case was very doubtful, yet they pray. So when Jonah had delivered his message to the Ninevites, ‘Yet forty days and Nineveh shall be overthrown,’ they cry mightily unto God, saying, ‘Who can tell if God will turn and repent?’ Jon. 3.9. Simon Magus was in a very bad state, in the gall of bitterness and the bond of iniquity, and Peter perceived it; yet he bids him repent and pray, if perhaps the thoughts of his heart might be forgiven him; and can we think, that he who put him upon praying for himself, would not pray for him too, especially considering Simon requested it of him? Acts 8:21, 24. Calvin in location: Si fieri possit, ab ipsis inferis extrahendi nobis sunt homines. [“If it were possible, men ought to be drawn by us even from the very depths of hell.”]</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/john-millward.html">John Millward</a></span><span class="wk"><span class="lbl">Work:</span> <cite>A Continuation of Morning-Exercise Questions &amp; Cases of Conscience Practicaly Resolved... (London: Dunton, 1683), Sermon 19, ‘How ought we to do our Duty towards others, though they do not theirs towards us?’, p. 564 Millward (d. 1684) was an English puritan put out at the Great Ejection.</cite></span></figcaption>

</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-e8ce5f41fe" data-kw="">
<blockquote><p>But it may be said, when the apostle (1 Jn. 5:16) directs to pray for a brother whom we see sinning a sin that is not unto death, and adds, ‘there is a sin unto death, I do not say he shall pray for it,’ is it not implied that it may be known when one sins that sin unto death, not only to himself, but even to others too? I answer it is implied there may be too probable appearances of it, and much ground to suspect and fear it concerning some, in some cases; as when any against the highest evidence of the truth of the Christian religion, and that Jesus is the Christ or the Messiah… do notwithstanding, from that malice which blinds their understanding, persist in infidelity or apostatize and relapse into it from a former profession, there is great cause of suspicion lest such have sinned that sin unto death. Whereupon yet it is to be observed, he does not expresly forbid praying for the persons whose case we may doubt; only he does not enjoin it, as he does for others, but only says, ‘I do not say ye shall pray for it,’ i.e. that in his present direction to pray for others, he did not intend such, but another sort, for whom they might pray remotely from any such suspicion: viz. that he meant now such praying as ought to be interchanged between Christian friends that have reason in the main to be well persuaded concerning one another, in the mean time intending no opposition to what is elsewhere enjoined, the praying for all men, 1 Tim. 2:1, without the personal exclusion of any, as also our Lord Himself prayed indefinitely for his most malicious enemies, ‘Father forgive them they know not what they do,’ though He had formerly said there was such a sin as should never be forgiven, whereof ’tis highly probable some of them were guilty: yet such He does not expressly except; but his prayer being in the indefinite, not the universal form, ’tis to be supposed it must mean such as were within the compass and reach of prayer and capable of benefit by it. Nor does the apostle [John] here [in 1 Jn. 5] direct personally to exclude any, only that indefinitely and in the general such must be supposed [that it was] not meant [of those] as had sinned the sin unto death; or [they] must be conditionally excluded, if they had, without determining who had or had not. To which purpose it is very observable that a more abstract form of expression is used in this latter clause of this verse [1 Jn. 5:16]. For whereas in the former positive part of the direction, he enjoins praying for him, or them that had not sinned unto death (viz. concerning whom there was no ground for any such imagination or suspicion that they had). In the negative part, concerning such as might have sinned it, he does not say for him or them, but for “it” (i.e. concerning, or in reference to it), as if he had said the case in general only is to be excepted, and if persons are to be distinguished (since every sin is someone’s sin, the sin of some person or other), let God distinguish, but do not you: ’tis enough for you to except the sin committed by whomsoever. And though the former part of the verse speaks of a particular person: ‘If a man see his brother sin a sin that is not unto death,’ which is as determinate to a person as the sight of our eye can be, it does not follow the latter part must suppose a like particular determination of any person’s case, that he has sinned it. I may have great reason to be confident such and such have not, when I can only suspect that such a one has. And it is a thing much less unlikely to be certain to oneself [about] than another, for they that have sinned unto death are no doubt so blinded and stupified by it that they are not more apt or competent to observe themselves and consider their case than others may be.</p></blockquote>

<blockquote><p>The sin against the Holy Ghost is an universal, final and wilfull falling away of hypocritical professors from the truth and common graces of the Holy Ghost once received and professed, to the blasphemous despiting of the Spirit of Grace, horrid contempt and malice against the Son of God and violent persecution of the way of Christianity.</p></blockquote>

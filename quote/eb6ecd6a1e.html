<main class="wrap"><figure class="quote" id="q-eb6ecd6a1e" data-kw="">
<blockquote><p>6. Ordination is the separation and sanctifying of the person appointed of God and his kirk, after he is well-tried and found qualified. The ceremonies of ordination are fasting, earnest prayer, and imposition of hands of the eldership.</p></blockquote>

</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-9c1bb1857c" data-kw="">
<blockquote><p>Kneeling in receiving imposition of hands, which is joined with prayer and invocation, has nothing ado with kneeling in a mediate worship, for in this case a man kneels because of the immediate worship of invocation: But when there is no prayer, I suppose no man will kneel religiously and with a religious respect to those persons or things which are before him, as there purposely in his sight that before them he may adore, which is the kind of kneeling now in question, or if any did so, there were more need to give him instruction than ordination.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/george-gillespie.html">George Gillespie</a></span><span class="wk"><span class="lbl">Work:</span> <cite>English Popish Ceremonies</cite>, (1637), pt. 3, ch. 4, p. 73</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/church-government-and-the-ministry/the-call-to-ministry.html">The Call to Ministry</a></span></div>

</figure><figure class="quote" id="q-22ecc7abf5" data-kw="">
<blockquote><p>Those that will not use the name of ordination may yet use the thing: which is nothing but the solemn designation or appointment of a fit person to the office, by competent men: which is most fitly accompanied with prayer and imposition of hands, where they may be had.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/richard-baxter.html">Richard Baxter</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Christian Concord, or the Agreement of the Associated Pastors &amp; Churches of Worcestershire, with Richard Baxter’s Explication &amp; Defence of it, &amp; his Exhortation to Unity</cite>, (London: A.M., 1653), An Explication of Some Passages in the Propositions, p. 9</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/church-government-and-the-ministry/the-call-to-ministry.html">The Call to Ministry</a></span></div>
<div class="actions"><button class="copy" data-copy="“Those that will not use the name of ordination may yet use the thing: which is nothing but the solemn designation or appointment of a fit person to the office, by competent men: which is most fitly accompanied with prayer and imposition of hands, where they may be had.”

</figure><figure class="quote" id="q-16e4b882f4" data-kw="">
<blockquote><p>2. To preach publicly as ordinary messengers, I say ‘ordinary’ because of our expectants of the ministry, who preach by the call of the Church for a time, as the sons of the prophets, while they be ordained pastors [in the time that they are in the process of being or becoming ordained]. To preach, I say, ‘publicly’, is a formal act of pastors who are sent, Rom. 10.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/samuel-rutherford.html">Samuel Rutherford</a></span><span class="wk"><span class="lbl">Work:</span> <cite>A Peaceable &amp; Temperate Plea for Paul’s Presbytery in Scotland</cite>, ... (1642), ch. 16, p. 248</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/church-government-and-the-ministry/the-call-to-ministry.html">The Call to Ministry</a></span></div>

</figure><figure class="quote" id="q-bea6e2c2af" data-kw="">
<blockquote><p>Nor will it follow that it is intrinsically unlawful for a synod of New England [who were congregationalists] to send 24 gracious youths understanding in the language, ordain them pastors by laying on of hands of the elders, and by fasting and praying, instruct them to go and act as pastors among the savages, preaching and baptizing; and their warrant is Acts 13; and here are pastors without certain flocks [contra congregationalism]. If any (Acts 13) say [that] the Spirit gives a special command there, and names Saul and Barnabas, but its not so here: I answer, there is without question something extraordinary in Acts 13, nor are we with Seekers (too much fortified in their way by our [congregationalist] Brethren’s doctrine) to wait for the Lord’s naming from heaven John, Thomas, to be preachers in such a place. But to me: 1. The nearness to the savages, 2. The knowledge of their language (as I suppose), 3. Their weak desire, or the professed not hating of the Gospel [by the savages], were equivalent to a command from heaven, ‘Go preach to the Americans’, and that in the capacity as proper pastors.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/samuel-rutherford.html">Samuel Rutherford</a></span><span class="wk"><span class="lbl">Work:</span> <cite>A Survey of the Survey of that Sum of Church-Discipline Penned by Mr. Thomas Hooker</cite>, … (1658), pp. 421-3</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/church-government-and-the-ministry/the-call-to-ministry.html">The Call to Ministry</a></span></div>

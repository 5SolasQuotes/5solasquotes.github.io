<main class="wrap"><figure class="quote" id="q-7086ee12f9" data-kw="">
<blockquote><p>Nevertheless, regarding the mode of concurring by determining, Scotus does not agree with the position of the Thomists positing a prior quality or positive influx in the secondary cause through which it is constituted in first act and proximately capable of operating. This is apparent from nearly all the cited places, where he excepts antecedent motion of the first cause from being done through an intermediate other created power — which exception establishes the rule of the impossibility of determining from a created cause.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/francisco-macedo.html">Francisco Macedo</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Collations of the Teachings of St. Thomas &amp; Scotus, with the Differences between the Two: with the Texts of Both Faithfully Presented, and the Sentences Subtly Examined, with the Commentaries of the Interpreters… vol. 2 tr. AI by Vertias (Padua: Frambotti, 1671), , bk. 2, Collation 9, pp. 361-429 | Scotus</cite>, pp. 394-95</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/providence/concurrence.html">Concurrence</a></span></div>

oks Online</a></div>
</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-dbd64be838" data-kw="Permission Author of sin Free Will">
<blockquote><p>In evil actions, however, he so concurs as neither to effect, assist, nor approve of them, but to permit and efficaciously direct; not by infusing wickedness, but by so determining rational creatures physically to the substance of the act in the genus of being, that they (when left to themselves failing from the law) move and determine themselves to bad actions in the genus of morals, performing them freely and voluntarily (hekousiōs). Hence the guilt rests upon them alone.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/francis-turretin.html">Francis Turretin</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Institutes of Elenctic Theology</cite>, 6.6.8</span></figcaption>

<blockquote><p>There is a fallacy of the accident in the minor proportion; for the actions of the wicked are sins, not (per se) in themselves, in as far as they are actions; but by an accident on account of the want of righteousness, and of the perversity of the will of the ungodly, who do not observe this so as to follow in the action the will of God.</p></blockquote>

</figure><figure class="quote" id="q-b4af681b72" data-kw="Author of sin">
<blockquote><p>The influences of divine providence concur with every action, be it what it may, as an action, since all live, and move, and have their being in God; every action, as an action, is from God; but the obliquity, irregularity, and sinfulness of the action, is from the creature: wherefore God is not the author of any sin.</p></blockquote>

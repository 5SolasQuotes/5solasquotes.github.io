<blockquote><p>For the [Mosiac] covenant was a legal covenant solemnly agreed, by which the people were obligated to present, by their own strength, perfect obedience to the Law (Matthew 22). Since the Law is the eternal rule of righteousness in the divine mind to which he wills all rational creatures to be conformed, and eternal life was promised by God to the servants who perfectly obeyed, truly the curse is pronounced upon transgressors. …For this reason also the Apostle says in Romans 10 that the goal of this legal covenant was Christ. And he withdrew nothing from the divine justice expressed in the sanction of the law, already before the same through the Prophet he promised a Mediator, God and Man, who by the his merit the memory of sin will be destroyed and by his efficacy the laws will be inscribed on our hearts. Because the knowledge of him will have been given to us by means of Christ.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/caspar-olevianus.html">Caspar Olevianus</a></span><span class="wk"><span class="lbl">Work:</span> <cite>De substantia foederis gratuiti inter deum et electos</cite>, 1.1.9 and 11. | Translation by R. Scott Clark.</span></figcaption>

<blockquote><p>6th Objection: The Messiah brings everlasting justice and righteousness. Imputed righteousness is not eternal. Therefore we are not thereby justified. Answer: It is said that Christ’s righteousness shall be an everlasting righteousness; but after a diverse manner. For in the life to come we shall be just after another manner than in this life. For although we shall then be just by the same righteousness, even by the righteousness of Christ imputed unto us: yet with this shall also the legal justice and righteousness be continued, so that then also by the legal righteousness we shall be perfectly just, because now only we are, as concerning that, but in part and beginning just. Each justice, both the justice of the Law, and the justice of the Gospel, is eternal, by continuation: And the justice and righteousness of the Gospel, that is, the justice of Christ imputed unto us, is eternal by continuation of the imputation: The justice of the Law is eternal by continuation of good works, even as it is continued by good works, first, and beginning in this life, until at length after this life it be perfected, and become perfect, and so continue to all eternity.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/zacharias-ursinus.html">Zacharias Ursinus</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Sum of Christian Religion: Delivered</cite>, … in his Lectures upon the Catechism… tr. Henrie Parrie (Oxford, 1587), ‘Of Justification’, 7. ‘Why Christ’s satisfaction is made ours by faith only’, ‘Objections against this Doctrine of Justification’, p. 687</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/justification/twofold-justification.html">Twofold Justification and Its Increase</a></span></div>

<blockquote><p>What sort of faith it is that God requires of all within the visible Church, for the want [lack] whereof reprobates are condemned? Assertion 1. Saving faith required of all within the visible Church is not as Antinomians conceive, the apprehension of God’s everlasting love of election to glory of all and every one that are charged to believe. Saltmarsh, in an ignorant and confused treatise tells us: ‘To believe now is the only work of the Gospel—that is, that ye be persuaded of such a thing that Christ was crucified for sins, and for your sins—so as salvation is not a business of our working and doing, it was done by Christ with the Father—all our work is no work of salvation, but in savation we receive all, not doing anything, that we may receive more; but doing because we receive so much, and because we are saved, and yet we are to work as much, as if we were to be saved by what we do, because we should do as much by what is done already for us, and to our hands, as if we were to receive it, for what we did ourselves: So here is short work’ (says the man) ‘Believe and be saved—there are yet these grounds why salvation is so soon done:

1. Because it was done before by Christ, but not believed on before by thee till now.

2. Because it is the Gospel-way of dispensation to assure and pass over salvation in Christ to any that will believe it.

3. There needs no more on our sides to work or warrant salvation to us, but to be persuaded that Jesus Christ died for us, because Christ has suffered and God is satisfied; now suffering and satisfaction is that great work of salvation.’ And the man taking on him to determine controversies of Arminians touching the extent of free grace, whether Christ died for all (in which questions I dare make apology for his innocency, that he is not guilty of wading too deep in them) he would father on the Reformed Churches of Protestant divines that we make this a rational way of justice, that God will merely and arbitrarily damn men because He will, so as God has put every one under a state of redemption and power of salvation; and they are damned not from their own will, but from God’s. The opinion by Arminians is fathered upon that apostolic light of the Church of Christ, eminent and divine Calvin, and Saltmarsh will but second them, that he may appear a star in the firmament with others of some great magnitude. ‘But’ (says he) ‘the other way is, Christ died only for his, but is offered to all, that his who are amongst this all might believe, and though he died not for all, yet none are excepted’ (that is as he says, all and every one to whom Christ is preached, elect or reprobate, are to be persuaded that Christ died for them in particular) ‘and yet none are accepted but they that believe, and none believe, but they to whom it is given:’ And having shown some dreams of his own touching these controversies, he concludes with a truth, I believe, easily: ‘Thus have I opened, though weakly the mystery;’ Weakly, but willfully and daringly. But faith is formally no such persuasion as to be persuaded, ‘Every man is loved with an everlasting love, chosen and redeemed in Christ,’ for: [1.] It changes the whole Gospel in a lie, Christ obliges no man to believe an untruth: Now all are charged to believe in the Son of God, and elect and reprobate (as there be of both sorts within the net of the Kingdom) are not loved with an everlasting love, nor did Christ die for them all.

2. It’s mere presumption, not faith, that all hypocrites, fleshly men slaves to their lusts, idolaters, covetous men, remaining such, never broken with any law-work, should immediately believe Christ is their Savior, died for them and the Father loved them to salvation before the world was. True it is, before a sinner believe, he is an unpardoned, an ungodly and guilty sinner; but that he is unbroken, yea, or unconverted before he believe (I speak of order of nature), it’s as unpossible as that a thistle can bring forth figs, for then he should believe having no new heart in him, which is the only principle of faith.

3. It’s a more ingenuous opinion that Christ died for all and every one, though it have no truth in itself, than to hold that He died for the elect only, and yet oblige men (as Antinomians do) against their conscience to believe He died for all and every one that are engaged in the practice of believing.

4. He that believes not, makes God a liar; then that which is to be believed must be an evangelic truth.

5. Faith lays bands on all within the visible Church to be knit together in love unto all riches of the full assurance of understanding to the acknowledgement of the mystery of God and of the Father, and of Christ, Col. 2:1-2, to be persuaded that nothing can separate us from the love of God in Christ, Rom. 8:37-39, to full assurance, Heb. 10, without wavering or declining, or bowing like a tottering wall. Now sure all and every one within the visible Church to whom the command of believing comes, reprobate or elect, are not holden to have a full assurance that they are chosen in Christ to salvation and redeemed in his blood. Assertion 2. The object of saving faith, required of all within the visible Church is:

1. Christ’s faithfulness to save believers, Heb. 10:23, ‘Let us hold fast the profession of our faith without wavering;’ and the apostle backs it with an argument, that saving faith must lean upon (‘for He is faithful that has promised’), and Paul, 1 Cor. 1:9, presses the same: ‘God is faithful, by whom ye were called, unto the fellowship of his Son Jesus Christ our Lord.’

2. We do not read in the Old or New Testament that the decree, purpose or intention of God to save and redeem persons in particular is the object of that saving faith required in the Gospel. For the second object of this faith is the truth and goodness of that mother promise of the Gospel, Jn. 3:16 and 5:25, that Gospel-record, 1 Jn. 5:10-12, ‘He that believeth hath life eternal,’ and ‘Jesus Christ came into the world to save sinners,’ 1 Tim. 1:15, ‘to seek and to save the lost,’ Lk. 19:1•; That He came to save me in particular is apprehended by sense, not by faith; for the election of me by name to glory and the Lord’s intention to die for me, is neither promise, nor precept, nor threatening; if it be a history that I must believe, it’s good, show me histories of particular men now to be believed, except of the Antichrist, the Second Coming of Jesus Christ to judge the world. Election to glory is not held forth as a promise: ‘If ye do this, ye shall be elected to glory,’ nor is the contrary holden forth as a threatening: ‘If ye believe not, ye shall be reprobated,’ nor does the Lord command me to be chosen in Christ to salvation before the foundation of the world, nor does He command all men within the visible Church to believe they are chosen to salvation or that any one elect person should believe a thing as revealed which is not revealed; when He is pleased to give to any elect person the white stone and the new name and to give him faith by which he chooses Christ for his portion, he is then, and never till then to believe, or rather by spiritual sense to apprehend that he is chosen to salvation from eternity; so election is neither precept, nor promise, but a truth of God’s gracious goodwill and pleasure hid in God’s mind till He be pleased to reveal it by the fruits thereof. There can be no such imaginable double dealing in the world as Arminians lay upon God: For they make the Lord to say thus as, imagine a king should speak to twenty thousand captives: I have a good will, purpose, hearty intention and earnest desire to make you all and every one free princes, and pray, wish, obtest and beseech you subscribe such a writ of grace for that end, but I only can lead your hand at the pen and give you eyes to see and a willing heart to consent to your own happiness, and if you refuse to sign the bill of grace you shall be tormented forever and ever in a river of fire and brimstone: Again, I have a like good will to my own justice and purpose so to carry on the design as that sixteen thousand of you shall not have the benefit of my hand, or of one finger to lead your hand at the pen, nor any efficacious motion to act upon your will to obtain your consent to subscribe the writ; yea by the contrary though, I of exceeding great free love will, intend, decree and purpose you be all princes of glory, yet I purpose that these sixteen thousand whose salvation and happiness I extremely desire shall for their former rebellion, which I with the like desire of spirit could and I only might have removed, never be moved to consent to this bill of grace. Now were not this the outside of a good will, and should not this prince be said rather to will and desire the destruction of these sixteen thousand and not their honor and happiness? Assertion 3. This is the mystery of the Gospel, in which I must profess ignorance and that the Lord’s thoughts are not as our thoughts nor his ways as our ways: He has by the preaching of the gospel engaged thousand thousands within the visible Church to the duty of their fiducial adherence and heart resting on Christ, as they would be saved, and yet has the Lord never purposed to work their hearts (and He only can do it) to this heart-resting on Christ by faith, nor has He purchased either remission of sins or pardon for them. If any object, How can Christ in equity judge and condemn them for not believing pardon and salvation in his blood when as neither pardon nor salvation are purchased in this blood to them, nor purposes He to give them faith? Yet we may plead for the Lord: we conceive of the decree of God as of a deep policy and a stratagem and snare laid for us: whereas the Lord lies not in wait for our ruin, nor carries He on a secret design in the gospel to destroy men: If Christ should say in the Gospel-precepts, promises or threatenings, ‘I decree purpose and intend to redeem all and every man, but I purpose to carry on the designs so, as the far greatest part of mankind inevitably shall be lost,’ it should be a stratagem; but the gospel as the gospel reveals not any decree or intention of God touching the salvation or damnation of men intended from eternity: Indeed the gospel as obeyed or disobeyed reveals Gods intentions and decrees; the gospel reveals nothing but the Lord’s complacency, approbation and good-liking of the sweet connection between faith and salvation, the just concatenation between unbelief, disobedience and eternal damnation: so the gospel reveals duties, but not the persons saved or damned; the Lord’s working with the gospel, or the efficacy of the gospel (which is a far other thing), reveals the persons. Now the difficulty is, how the Lord can command the reprobate to believe life and salvation in Christ when there is no life and salvation either intended to them or purchased for them? To which I answer:

1. God gave a law to all the angels created in the truth, ‘If ye abide in the truth, ye shall be eternally happy.’ Ye cannot say that the devils in that instant were to believe that God intended and decreed them for eternal happiness and to give them efficacious grace by which they should abide in the truth as their fellow angels did: God’s command and promise did reveal no such intention of God. So the Lord said to Adam and to all his seed, ‘If ye keep the law perfectly, ye shall have life eternal,’ according to that, ‘Do this and live:’ yet was not Adam then, far less these that are now under the Law, to believe that God ordained them from eternity to eternal life legally purchased or that any flesh should be justified by the works of the Law. Arminians tell us that there be numbers judicially blinded and hardened within the visible Church who cannot believe and whom the Lord hath destined for destruction, yet the Word is preached to them; they hear and read the promises of the gospel, and the precepts; Whither are they to believe that God intended from eternity to them salvation and grace to believe? I think not, for they teach that Christ neither prays for, nor intends to die for the unbelieving and obstinate world as such, nor decreed their salvation, and except men may fancy senses on the words of God’s Spirit: where learned they to expound the word ‘world’ (when it makes for them) for all and every one of mankind; and when it makes against them, for the least part of mankind, and that either within the visible Church only or yet without the visible Church? For in both, Satan’s world of disobedient ones is the far greatest part, seeing the whole world lies in sin, as John says. Let it be also remembered when Arminians say, ‘The Lamb of God taketh away the sins of the world,’ that is of all and every mortal man, they mean Christ takes not away, nor sheds He his blood for the sins of the rebellious world; so the world’s rebellion, contumacy and infidelity against Christ must be pardoned without shedding of blood, and if Christ did bear all the sins of the world on the cross conditionally and none of them absolutely: then our act of believing must be the only nearest cause of satisfaction for sins: but why then, if Christ satisfied on the cross for the final impenitency and unbelief of the rebellious world conditionally, so they believe and be not rebellious, but Arminians should say right down Christ died for the rebellious and contumacious world, and He prays for the contumacious world as such, but conditionally; for He prays and dies for the not-rebellious-world of all mortal men, not absolutely, but conditionally, so they believe in Christ; if they believe not, neither the prayers of Christ nor his death are more effectual for them than for devils. To all these we may add that the Lord in commanding reprobates to rest on Christ for salvation, though no salvation be purchased for them, deals sincerely and candidly with them, for: First, He commands them to believe no intention in God to save them by the death of his Son, nor says He any such thing to them, but only commands them to rely on Christ as an all-sufficient Savior. Secondly, God commands all the reprobate, even by their [Arminian] way, to believe that Christ in his death intended their salvation, justification, conversion, and yet whereas God takes ways effectual and such as He foresees shall be effectual for the efficacious working of justification and conversion and actual glorification of some few, yet He takes ways which He knows shall be utterly ineffectual for the salvation, justification and conversion of all these reprobates, and yet commands them to believe that He decree and intends their salvation and conversion with no less ardency and vehemency of serious affection than He does intend the salvation and conversion of all that shall be glorified. Sure this we would call double dealing in men, and the Scripture says he is a God of truth, Dt. 32, and the Lord who cannot lie. Objection: If a rich innkeeper should dig a fountain in his field for all passengers, thirsty and diseased, which were able to cure them and quench their thirst, and invite them all to come and drink and be cured, upon condition they come and believe the virtue of the water to be such, and yet should intend and decree absolutely and irresistibly the tenth man invited should never be cured, this innkeeper should not deal sincerely with them. So you [the reformed] make God to deal with sinners in the Gospel. He does all, in inviting sick sinners to come and drink life and salvation at Christ the Fountain of life, which expresses with men who speak as they think their sincere intention, but He intends no such thing. Answer: Make the comparison run as it should do and it makes more against Arminians: say that this Innkeeper had dominion over the heart and will, as the Lord has, Prov. 21:1; Ps. 119:36-37; Heb. 13:20-21; Mt. 6:13, and that He could and does without straining of the heart work in all the passengers a sense of their disease, grace actually to come and drink, and yet He takes a dealing with the souls of some few and causes them come to the waters and drink and heals them, and He uses such means and so acts upon the will of the far most part that they shall never come, never be sensible of their disease, and yet He invites them to come to the waters and drink; it’s clear this Innkeeper never intended the health of all and every one of the passengers, but only of these few that come and drink; nor do invitations with men upon condition, which the party invited is obliged to perform, but does never perform, and which the inviter only of grace can work in the invited, but does not work them, as being not obliged thereunto, speak any such intention. Again, let it be considered that here:

1. God lies in wait for no man’s destruction.

2. God is not obliged to reveal his eternal purpose and intentions touching men’s salvation and damnation but in the way and manner seems best to Him.

3. God never says in all the Gospel that from eternity He has passed a resolve to save all mankind, if they will, and to yield them the bridle on their own necks that they may be indifferent and absolute Lords of Heaven and Hell.

4. Nor should the Gospel be framed in such wisdom if the Lord had set down particularly the names of all the elect and reprobate in the world and have proponed salvation upon condition of obedience and faith to some few: it should evidently have raised a hard opinion in the minds of thousands touching Christ. Assertion 4. The third object of faith is the sufficiency and power of Christ to save.

1. The Scripture makes the object of coming, which is believing, Jn. 5:40; Jn. 6:35; Mt. 11:27, to be Christ’s ability and power, Heb. 7:25, ‘to save them to the uttermost,’ that come unto God by Him, seeing He ever liveth to make intercession for them. What the Scripture presses us to believe savingly, that we must be inclined to misbelieve, and for the misbelieving thereof the reprobates are condemned, and not because they believe not the Lord’s intention to save all, or his decrees of election and reprobation. But the Scripture presses faith in the power of mercy, Rom. 4:21, Abraham staggered not, but was strong in the faith, giving glory to God, being fully persuaded that what He had promised, He was able also to perform. Now Abraham is commended for that he savingly and for his justification believed the power of God in the Gospel promise that God was able of his mercy to give him the son of promise in his old age; otherwise to believe simply the power of God to give a child to a mother who is passed the natural date of bearing children is but the faith of miracles, which of itself is not saving and may be in workers of iniquity, Mt. 7:21-22; so this power then is the power of saving conjoined with the mercy and good will of Christ.

2. The Scripture holds forth to our faith the power of God to graft in the Jews again in Christ, Rom. 11:23, to make a weak believer stand, Rom. 14:4, to keep the saints from falling and to present them faultless before the presence of his glory with exceeding joy, Jude v. 24.

3. The good Land was a type of the heavenly rest, Heb 4:1 and Heb. 3:19, some entered not in through unbelief: why, what unbelief? The story shows us, Ps. 93:7; Num. 14:9; 13:28, they doubted of the power of God and believed the report of the unbelieving spies, who said, ‘The people be strong that dwell in the land, the cities are walled and very great, and moreover we saw the children of Anak there.’ Joshua and Caleb, ch. 14:9, said they should not be bread for them and their strength was gone; then the question was, whether God was able to give them that good Land. So then men enter not into the heavenly rest because they believe not that Jesus is able to save to the uttermost those that come through him to God, Heb. 7:23.

4. The Scripture is as much in proving the all-sufficiency, power and perfection of Christ our Savior, to save, as in demonstrating his tenderness of mercy and goodwill to save; as in the epistle to the Hebrews, the apostle labors much for to prove the Godhead of Christ, his excellency above angels and that the angels were to adore him, his dignity and greatness above Moses and all the mortal and dying priests, the virtue of his blood above all the bloods of bulls and goats, to purge the conscience from dead works, to expiate sin, to sanctify his people, to open a way, a new and living way to the holy of holiest, by his blood, that we with full assurance may draw near to God, that He with one sacrifice, never to be repeated, did that which all the thousands of reiterated sacrifices were never able to do; that He is no dying priest, but lives forever to intercede for us at the right hand of God. And for what is all this but that we should believe the all-sufficiency of Christ to save? and because we have too low thoughts of Christ, as conceiving Him to be but a man or less than an angel, or a common priest that can do no more by his blood as touching remission of sins than dying priests could do with the blood of beasts, and that He is dead, and now when we sin, He cannot advocate for us at the right hand of God, that his redemption He brings in is not eternal, yea all this says that saving faith rests upon Christ as God, as able and completely perfect and sufficient to save, though sinners do not in the formal act of faith believe his good will, decree and intention to redeem and save them by name.

5. I should think that these who have high and precious thoughts of the grace, tender mercy, perfection and sufficiency of Christ to save all that believe and fiducially rely on Christ as a Savior sealed for the work of redemption, though they know not God’s mind touching their own salvation in particular, have such a faith as the Gospel speaks of, and do savingly believe that Christ came to seek and to save that which is lost, to save sinners, that Christ is the Son of the living God, the Savior of mankind; and this no devil, no temporary believer, no hypocrite can attain unto.</p></blockquote>

<div class="actions"><button class="copy" data-copy="“What sort of faith it is that God requires of all within the visible Church, for the want [lack] whereof reprobates are condemned? Assertion 1. Saving faith required of all within the visible Church is not as Antinomians conceive, the apprehension of God’s everlasting love of election to glory of all and every one that are charged to believe. Saltmarsh, in an ignorant and confused treatise tells us: ‘To believe now is the only work of the Gospel—that is, that ye be persuaded of such a thing that Christ was crucified for sins, and for your sins—so as salvation is not a business of our working and doing, it was done by Christ with the Father—all our work is no work of salvation, but in savation we receive all, not doing anything, that we may receive more; but doing because we receive so much, and because we are saved, and yet we are to work as much, as if we were to be saved by what we do, because we should do as much by what is done already for us, and to our hands, as if we were to receive it, for what we did ourselves: So here is short work’ (says the man) ‘Believe and be saved—there are yet these grounds why salvation is so soon done:

1. Because it was done before by Christ, but not believed on before by thee till now.

2. Because it is the Gospel-way of dispensation to assure and pass over salvation in Christ to any that will believe it.

3. There needs no more on our sides to work or warrant salvation to us, but to be persuaded that Jesus Christ died for us, because Christ has suffered and God is satisfied; now suffering and satisfaction is that great work of salvation.’ And the man taking on him to determine controversies of Arminians touching the extent of free grace, whether Christ died for all (in which questions I dare make apology for his innocency, that he is not guilty of wading too deep in them) he would father on the Reformed Churches of Protestant divines that we make this a rational way of justice, that God will merely and arbitrarily damn men because He will, so as God has put every one under a state of redemption and power of salvation; and they are damned not from their own will, but from God’s. The opinion by Arminians is fathered upon that apostolic light of the Church of Christ, eminent and divine Calvin, and Saltmarsh will but second them, that he may appear a star in the firmament with others of some great magnitude. ‘But’ (says he) ‘the other way is, Christ died only for his, but is offered to all, that his who are amongst this all might believe, and though he died not for all, yet none are excepted’ (that is as he says, all and every one to whom Christ is preached, elect or reprobate, are to be persuaded that Christ died for them in particular) ‘and yet none are accepted but they that believe, and none believe, but they to whom it is given:’ And having shown some dreams of his own touching these controversies, he concludes with a truth, I believe, easily: ‘Thus have I opened, though weakly the mystery;’ Weakly, but willfully and daringly. But faith is formally no such persuasion as to be persuaded, ‘Every man is loved with an everlasting love, chosen and redeemed in Christ,’ for: [1.] It changes the whole Gospel in a lie, Christ obliges no man to believe an untruth: Now all are charged to believe in the Son of God, and elect and reprobate (as there be of both sorts within the net of the Kingdom) are not loved with an everlasting love, nor did Christ die for them all.

2. It’s mere presumption, not faith, that all hypocrites, fleshly men slaves to their lusts, idolaters, covetous men, remaining such, never broken with any law-work, should immediately believe Christ is their Savior, died for them and the Father loved them to salvation before the world was. True it is, before a sinner believe, he is an unpardoned, an ungodly and guilty sinner; but that he is unbroken, yea, or unconverted before he believe (I speak of order of nature), it’s as unpossible as that a thistle can bring forth figs, for then he should believe having no new heart in him, which is the only principle of faith.

3. It’s a more ingenuous opinion that Christ died for all and every one, though it have no truth in itself, than to hold that He died for the elect only, and yet oblige men (as Antinomians do) against their conscience to believe He died for all and every one that are engaged in the practice of believing.

4. He that believes not, makes God a liar; then that which is to be believed must be an evangelic truth.

5. Faith lays bands on all within the visible Church to be knit together in love unto all riches of the full assurance of understanding to the acknowledgement of the mystery of God and of the Father, and of Christ, Col. 2:1-2, to be persuaded that nothing can separate us from the love of God in Christ, Rom. 8:37-39, to full assurance, Heb. 10, without wavering or declining, or bowing like a tottering wall. Now sure all and every one within the visible Church to whom the command of believing comes, reprobate or elect, are not holden to have a full assurance that they are chosen in Christ to salvation and redeemed in his blood. Assertion 2. The object of saving faith, required of all within the visible Church is:

1. Christ’s faithfulness to save believers, Heb. 10:23, ‘Let us hold fast the profession of our faith without wavering;’ and the apostle backs it with an argument, that saving faith must lean upon (‘for He is faithful that has promised’), and Paul, 1 Cor. 1:9, presses the same: ‘God is faithful, by whom ye were called, unto the fellowship of his Son Jesus Christ our Lord.’

2. We do not read in the Old or New Testament that the decree, purpose or intention of God to save and redeem persons in particular is the object of that saving faith required in the Gospel. For the second object of this faith is the truth and goodness of that mother promise of the Gospel, Jn. 3:16 and 5:25, that Gospel-record, 1 Jn. 5:10-12, ‘He that believeth hath life eternal,’ and ‘Jesus Christ came into the world to save sinners,’ 1 Tim. 1:15, ‘to seek and to save the lost,’ Lk. 19:1•; That He came to save me in particular is apprehended by sense, not by faith; for the election of me by name to glory and the Lord’s intention to die for me, is neither promise, nor precept, nor threatening; if it be a history that I must believe, it’s good, show me histories of particular men now to be believed, except of the Antichrist, the Second Coming of Jesus Christ to judge the world. Election to glory is not held forth as a promise: ‘If ye do this, ye shall be elected to glory,’ nor is the contrary holden forth as a threatening: ‘If ye believe not, ye shall be reprobated,’ nor does the Lord command me to be chosen in Christ to salvation before the foundation of the world, nor does He command all men within the visible Church to believe they are chosen to salvation or that any one elect person should believe a thing as revealed which is not revealed; when He is pleased to give to any elect person the white stone and the new name and to give him faith by which he chooses Christ for his portion, he is then, and never till then to believe, or rather by spiritual sense to apprehend that he is chosen to salvation from eternity; so election is neither precept, nor promise, but a truth of God’s gracious goodwill and pleasure hid in God’s mind till He be pleased to reveal it by the fruits thereof. There can be no such imaginable double dealing in the world as Arminians lay upon God: For they make the Lord to say thus as, imagine a king should speak to twenty thousand captives: I have a good will, purpose, hearty intention and earnest desire to make you all and every one free princes, and pray, wish, obtest and beseech you subscribe such a writ of grace for that end, but I only can lead your hand at the pen and give you eyes to see and a willing heart to consent to your own happiness, and if you refuse to sign the bill of grace you shall be tormented forever and ever in a river of fire and brimstone: Again, I have a like good will to my own justice and purpose so to carry on the design as that sixteen thousand of you shall not have the benefit of my hand, or of one finger to lead your hand at the pen, nor any efficacious motion to act upon your will to obtain your consent to subscribe the writ; yea by the contrary though, I of exceeding great free love will, intend, decree and purpose you be all princes of glory, yet I purpose that these sixteen thousand whose salvation and happiness I extremely desire shall for their former rebellion, which I with the like desire of spirit could and I only might have removed, never be moved to consent to this bill of grace. Now were not this the outside of a good will, and should not this prince be said rather to will and desire the destruction of these sixteen thousand and not their honor and happiness? Assertion 3. This is the mystery of the Gospel, in which I must profess ignorance and that the Lord’s thoughts are not as our thoughts nor his ways as our ways: He has by the preaching of the gospel engaged thousand thousands within the visible Church to the duty of their fiducial adherence and heart resting on Christ, as they would be saved, and yet has the Lord never purposed to work their hearts (and He only can do it) to this heart-resting on Christ by faith, nor has He purchased either remission of sins or pardon for them. If any object, How can Christ in equity judge and condemn them for not believing pardon and salvation in his blood when as neither pardon nor salvation are purchased in this blood to them, nor purposes He to give them faith? Yet we may plead for the Lord: we conceive of the decree of God as of a deep policy and a stratagem and snare laid for us: whereas the Lord lies not in wait for our ruin, nor carries He on a secret design in the gospel to destroy men: If Christ should say in the Gospel-precepts, promises or threatenings, ‘I decree purpose and intend to redeem all and every man, but I purpose to carry on the designs so, as the far greatest part of mankind inevitably shall be lost,’ it should be a stratagem; but the gospel as the gospel reveals not any decree or intention of God touching the salvation or damnation of men intended from eternity: Indeed the gospel as obeyed or disobeyed reveals Gods intentions and decrees; the gospel reveals nothing but the Lord’s complacency, approbation and good-liking of the sweet connection between faith and salvation, the just concatenation between unbelief, disobedience and eternal damnation: so the gospel reveals duties, but not the persons saved or damned; the Lord’s working with the gospel, or the efficacy of the gospel (which is a far other thing), reveals the persons. Now the difficulty is, how the Lord can command the reprobate to believe life and salvation in Christ when there is no life and salvation either intended to them or purchased for them? To which I answer:

1. God gave a law to all the angels created in the truth, ‘If ye abide in the truth, ye shall be eternally happy.’ Ye cannot say that the devils in that instant were to believe that God intended and decreed them for eternal happiness and to give them efficacious grace by which they should abide in the truth as their fellow angels did: God’s command and promise did reveal no such intention of God. So the Lord said to Adam and to all his seed, ‘If ye keep the law perfectly, ye shall have life eternal,’ according to that, ‘Do this and live:’ yet was not Adam then, far less these that are now under the Law, to believe that God ordained them from eternity to eternal life legally purchased or that any flesh should be justified by the works of the Law. Arminians tell us that there be numbers judicially blinded and hardened within the visible Church who cannot believe and whom the Lord hath destined for destruction, yet the Word is preached to them; they hear and read the promises of the gospel, and the precepts; Whither are they to believe that God intended from eternity to them salvation and grace to believe? I think not, for they teach that Christ neither prays for, nor intends to die for the unbelieving and obstinate world as such, nor decreed their salvation, and except men may fancy senses on the words of God’s Spirit: where learned they to expound the word ‘world’ (when it makes for them) for all and every one of mankind; and when it makes against them, for the least part of mankind, and that either within the visible Church only or yet without the visible Church? For in both, Satan’s world of disobedient ones is the far greatest part, seeing the whole world lies in sin, as John says. Let it be also remembered when Arminians say, ‘The Lamb of God taketh away the sins of the world,’ that is of all and every mortal man, they mean Christ takes not away, nor sheds He his blood for the sins of the rebellious world; so the world’s rebellion, contumacy and infidelity against Christ must be pardoned without shedding of blood, and if Christ did bear all the sins of the world on the cross conditionally and none of them absolutely: then our act of believing must be the only nearest cause of satisfaction for sins: but why then, if Christ satisfied on the cross for the final impenitency and unbelief of the rebellious world conditionally, so they believe and be not rebellious, but Arminians should say right down Christ died for the rebellious and contumacious world, and He prays for the contumacious world as such, but conditionally; for He prays and dies for the not-rebellious-world of all mortal men, not absolutely, but conditionally, so they believe in Christ; if they believe not, neither the prayers of Christ nor his death are more effectual for them than for devils. To all these we may add that the Lord in commanding reprobates to rest on Christ for salvation, though no salvation be purchased for them, deals sincerely and candidly with them, for: First, He commands them to believe no intention in God to save them by the death of his Son, nor says He any such thing to them, but only commands them to rely on Christ as an all-sufficient Savior. Secondly, God commands all the reprobate, even by their [Arminian] way, to believe that Christ in his death intended their salvation, justification, conversion, and yet whereas God takes ways effectual and such as He foresees shall be effectual for the efficacious working of justification and conversion and actual glorification of some few, yet He takes ways which He knows shall be utterly ineffectual for the salvation, justification and conversion of all these reprobates, and yet commands them to believe that He decree and intends their salvation and conversion with no less ardency and vehemency of serious affection than He does intend the salvation and conversion of all that shall be glorified. Sure this we would call double dealing in men, and the Scripture says he is a God of truth, Dt. 32, and the Lord who cannot lie. Objection: If a rich innkeeper should dig a fountain in his field for all passengers, thirsty and diseased, which were able to cure them and quench their thirst, and invite them all to come and drink and be cured, upon condition they come and believe the virtue of the water to be such, and yet should intend and decree absolutely and irresistibly the tenth man invited should never be cured, this innkeeper should not deal sincerely with them. So you [the reformed] make God to deal with sinners in the Gospel. He does all, in inviting sick sinners to come and drink life and salvation at Christ the Fountain of life, which expresses with men who speak as they think their sincere intention, but He intends no such thing. Answer: Make the comparison run as it should do and it makes more against Arminians: say that this Innkeeper had dominion over the heart and will, as the Lord has, Prov. 21:1; Ps. 119:36-37; Heb. 13:20-21; Mt. 6:13, and that He could and does without straining of the heart work in all the passengers a sense of their disease, grace actually to come and drink, and yet He takes a dealing with the souls of some few and causes them come to the waters and drink and heals them, and He uses such means and so acts upon the will of the far most part that they shall never come, never be sensible of their disease, and yet He invites them to come to the waters and drink; it’s clear this Innkeeper never intended the health of all and every one of the passengers, but only of these few that come and drink; nor do invitations with men upon condition, which the party invited is obliged to perform, but does never perform, and which the inviter only of grace can work in the invited, but does not work them, as being not obliged thereunto, speak any such intention. Again, let it be considered that here:

1. God lies in wait for no man’s destruction.

2. God is not obliged to reveal his eternal purpose and intentions touching men’s salvation and damnation but in the way and manner seems best to Him.

3. God never says in all the Gospel that from eternity He has passed a resolve to save all mankind, if they will, and to yield them the bridle on their own necks that they may be indifferent and absolute Lords of Heaven and Hell.

4. Nor should the Gospel be framed in such wisdom if the Lord had set down particularly the names of all the elect and reprobate in the world and have proponed salvation upon condition of obedience and faith to some few: it should evidently have raised a hard opinion in the minds of thousands touching Christ. Assertion 4. The third object of faith is the sufficiency and power of Christ to save.

1. The Scripture makes the object of coming, which is believing, Jn. 5:40; Jn. 6:35; Mt. 11:27, to be Christ’s ability and power, Heb. 7:25, ‘to save them to the uttermost,’ that come unto God by Him, seeing He ever liveth to make intercession for them. What the Scripture presses us to believe savingly, that we must be inclined to misbelieve, and for the misbelieving thereof the reprobates are condemned, and not because they believe not the Lord’s intention to save all, or his decrees of election and reprobation. But the Scripture presses faith in the power of mercy, Rom. 4:21, Abraham staggered not, but was strong in the faith, giving glory to God, being fully persuaded that what He had promised, He was able also to perform. Now Abraham is commended for that he savingly and for his justification believed the power of God in the Gospel promise that God was able of his mercy to give him the son of promise in his old age; otherwise to believe simply the power of God to give a child to a mother who is passed the natural date of bearing children is but the faith of miracles, which of itself is not saving and may be in workers of iniquity, Mt. 7:21-22; so this power then is the power of saving conjoined with the mercy and good will of Christ.

2. The Scripture holds forth to our faith the power of God to graft in the Jews again in Christ, Rom. 11:23, to make a weak believer stand, Rom. 14:4, to keep the saints from falling and to present them faultless before the presence of his glory with exceeding joy, Jude v. 24.

3. The good Land was a type of the heavenly rest, Heb 4:1 and Heb. 3:19, some entered not in through unbelief: why, what unbelief? The story shows us, Ps. 93:7; Num. 14:9; 13:28, they doubted of the power of God and believed the report of the unbelieving spies, who said, ‘The people be strong that dwell in the land, the cities are walled and very great, and moreover we saw the children of Anak there.’ Joshua and Caleb, ch. 14:9, said they should not be bread for them and their strength was gone; then the question was, whether God was able to give them that good Land. So then men enter not into the heavenly rest because they believe not that Jesus is able to save to the uttermost those that come through him to God, Heb. 7:23.

4. The Scripture is as much in proving the all-sufficiency, power and perfection of Christ our Savior, to save, as in demonstrating his tenderness of mercy and goodwill to save; as in the epistle to the Hebrews, the apostle labors much for to prove the Godhead of Christ, his excellency above angels and that the angels were to adore him, his dignity and greatness above Moses and all the mortal and dying priests, the virtue of his blood above all the bloods of bulls and goats, to purge the conscience from dead works, to expiate sin, to sanctify his people, to open a way, a new and living way to the holy of holiest, by his blood, that we with full assurance may draw near to God, that He with one sacrifice, never to be repeated, did that which all the thousands of reiterated sacrifices were never able to do; that He is no dying priest, but lives forever to intercede for us at the right hand of God. And for what is all this but that we should believe the all-sufficiency of Christ to save? and because we have too low thoughts of Christ, as conceiving Him to be but a man or less than an angel, or a common priest that can do no more by his blood as touching remission of sins than dying priests could do with the blood of beasts, and that He is dead, and now when we sin, He cannot advocate for us at the right hand of God, that his redemption He brings in is not eternal, yea all this says that saving faith rests upon Christ as God, as able and completely perfect and sufficient to save, though sinners do not in the formal act of faith believe his good will, decree and intention to redeem and save them by name.

5. I should think that these who have high and precious thoughts of the grace, tender mercy, perfection and sufficiency of Christ to save all that believe and fiducially rely on Christ as a Savior sealed for the work of redemption, though they know not God’s mind touching their own salvation in particular, have such a faith as the Gospel speaks of, and do savingly believe that Christ came to seek and to save that which is lost, to save sinners, that Christ is the Son of the living God, the Savior of mankind; and this no devil, no temporary believer, no hypocrite can attain unto.”

— Samuel Rutherford, Christ Dying &amp; Drawing Sinners to Himself, (London: 1647), pp. 449-[sic]23">Copy</button><a class="share" href="https://x.com/intent/post?text=%E2%80%9CWhat+sort+of+faith+it+is+that+God+requires+of+all+within+the+visible+Church%2C+for+the+want+%5Black%5D+whereof+reprobates+are+condemned%3F+Assertion+1.+Saving+faith+required+of+all+within+the+visible+Church+is+not+as+Antinomians+conceive%2C+the+apprehension+of+God%E2%80%99s+everlasting+love+of+election+to+glory+of+all+and+every+one+that+are+charged+to+believe.+Saltmarsh%2C+in+an+ignorant+and+confused+treatise+tells+us%3A+%E2%80%98To+believe+now+is+the+only+work+of+the+Gospel%E2%80%94that+is%2C+that+ye+be+persuaded+of+such+a+thing+that+Christ+was+crucified+for+sins%2C+and+for+your+sins%E2%80%94so+as+salvation+is+not+a+business+of+our+working+and+doing%2C+it+was+done+by+Christ+with+the+Father%E2%80%94all+our+work+is+no+work+of+salvation%2C+but+in+savation+we+receive+all%2C+not+doing+anything%2C+that+we+may+receive+more%3B+but+doing+because+we+receive+so+much%2C+and+because+we+are+saved%2C+and+yet+we+are+to+work+as+much%2C+as+if+we+were+to+be+saved+by+what+we+do%2C+because+we+should+do+as+much+by+what+is+done+already+for+us%2C+and+to+our+hands%2C+as+if+we+were+to+receive+it%2C+for+what+we+did+ourselves%3A+So+here+is+short+work%E2%80%99+%28says+the+man%29+%E2%80%98Believe+and+be+saved%E2%80%94there+are+yet+these+grounds+why+salvation+is+so+soon+done%3A+1.+Because+it+was+done+before+by+Christ%2C+but+not+believed+on+before+by+thee+till+now.+2.+Because+it+is+the+Gospel-way+of+dispensation+to+assure+and+pass+over+salvation+in+Christ+to+any+that+will+believe+it.+3.+There+needs+no+more+on+our+sides+to+work+or+warrant+salvation+to+us%2C+but+to+be+persuaded+that+Jesus+Christ+died+for+us%2C+because+Christ+has+suffered+and+God+is+satisfied%3B+now+suffering+and+satisfaction+is+that+great+work+of+salvation.%E2%80%99+And+the+man+taking+on+him+to+determine+controversies+of+Arminians+touching+the+extent+of+free+grace%2C+whether+Christ+died+for+all+%28in+which+questions+I+dare+make+apology+for+his+innocency%2C+that+he+is+not+guilty+of+wading+too+deep+in+them%29+he+would+father+on+the+Reformed+Churches+of+Protestant+divines+that+we+make+this+a+rational+way+of+justice%2C+that+God+will+merely+and+arbitrarily+damn+men+because+He+will%2C+so+as+God+has+put+every+one+under+a+state+of+redemption+and+power+of+salvation%3B+and+they+are+damned+not+from+their+own+will%2C+but+from+God%E2%80%99s.+The+opinion+by+Arminians+is+fathered+upon+that+apostolic+light+of+the+Church+of+Christ%2C+eminent+and+divine+Calvin%2C+and+Saltmarsh+will+but+second+them%2C+that+he+may+appear+a+star+in+the+firmament+with+others+of+some+great+magnitude.+%E2%80%98But%E2%80%99+%28says+he%29+%E2%80%98the+other+way+is%2C+Christ+died+only+for+his%2C+but+is+offered+to+all%2C+that+his+who+are+amongst+this+all+might+believe%2C+and+though+he+died+not+for+all%2C+yet+none+are+excepted%E2%80%99+%28that+is+as+he+says%2C+all+and+every+one+to+whom+Christ+is+preached%2C+elect+or+reprobate%2C+are+to+be+persuaded+that+Christ+died+for+them+in+particular%29+%E2%80%98and+yet+none+are+accepted+but+they+that+believe%2C+and+none+believe%2C+but+they+to+whom+it+is+given%3A%E2%80%99+And+having+shown+some+dreams+of+his+own+touching+these+controversies%2C+he+concludes+with+a+truth%2C+I+believe%2C+easily%3A+%E2%80%98Thus+have+I+opened%2C+though+weakly+the+mystery%3B%E2%80%99+Weakly%2C+but+willfully+and+daringly.+But+faith+is+formally+no+such+persuasion+as+to+be+persuaded%2C+%E2%80%98Every+man+is+loved+with+an+everlasting+love%2C+chosen+and+redeemed+in+Christ%2C%E2%80%99+for%3A+%5B1.%5D+It+changes+the+whole+Gospel+in+a+lie%2C+Christ+obliges+no+man+to+believe+an+untruth%3A+Now+all+are+charged+to+believe+in+the+Son+of+God%2C+and+elect+and+reprobate+%28as+there+be+of+both+sorts+within+the+net+of+the+Kingdom%29+are+not+loved+with+an+everlasting+love%2C+nor+did+Christ+die+for+them+all.+2.+It%E2%80%99s+mere+presumption%2C+not+faith%2C+that+all+hypocrites%2C+fleshly+men+slaves+to+their+lusts%2C+idolaters%2C+covetous+men%2C+remaining+such%2C+never+broken+with+any+law-work%2C+should+immediately+believe+Christ+is+their+Savior%2C+died+for+them+and+the+Father+loved+them+to+salvation+before+the+world+was.+True+it+is%2C+before+a+sinner+believe%2C+he+is+an+unpardoned%2C+an+ungodly+and+guilty+sinner%3B+but+that+he+is+unbroken%2C+yea%2C+or+unconverted+before+he+believe+%28I+speak+of+order+of+nature%29%2C+it%E2%80%99s+as+unpossible+as+that+a+thistle+can+bring+forth+figs%2C+for+then+he+should+believe+having+no+new+heart+in+him%2C+which+is+the+only+principle+of+faith.+3.+It%E2%80%99s+a+more+ingenuous+opinion+that+Christ+died+for+all+and+every+one%2C+though+it+have+no+truth+in+itself%2C+than+to+hold+that+He+died+for+the+elect+only%2C+and+yet+oblige+men+%28as+Antinomians+do%29+against+their+conscience+to+believe+He+died+for+all+and+every+one+that+are+engaged+in+the+practice+of+believing.+4.+He+that+believes+not%2C+makes+God+a+liar%3B+then+that+which+is+to+be+believed+must+be+an+evangelic+truth.+5.+Faith+lays+bands+on+all+within+the+visible+Church+to+be+knit+together+in+love+unto+all+riches+of+the+full+assurance+of+understanding+to+the+acknowledgement+of+the+mystery+of+God+and+of+the+Father%2C+and+of+Christ%2C+Col.+2%3A1-2%2C+to+be+persuaded+that+nothing+can+separate+us+from+the+love+of+God+in+Christ%2C+Rom.+8%3A37-39%2C+to+full+assurance%2C+Heb.+10%2C+without+wavering+or+declining%2C+or+bowing+like+a+tottering+wall.+Now+sure+all+and+every+one+within+the+visible+Church+to+whom+the+command+of+believing+comes%2C+reprobate+or+elect%2C+are+not+holden+to+have+a+full+assurance+that+they+are+chosen+in+Christ+to+salvation+and+redeemed+in+his+blood.+Assertion+2.+The+object+of+saving+faith%2C+required+of+all+within+the+visible+Church+is%3A+1.+Christ%E2%80%99s+faithfulness+to+save+believers%2C+Heb.+10%3A23%2C+%E2%80%98Let+us+hold+fast+the+profession+of+our+faith+without+wavering%3B%E2%80%99+and+the+apostle+backs+it+with+an+argument%2C+that+saving+faith+must+lean+upon+%28%E2%80%98for+He+is+faithful+that+has+promised%E2%80%99%29%2C+and+Paul%2C+1+Cor.+1%3A9%2C+presses+the+same%3A+%E2%80%98God+is+faithful%2C+by+whom+ye+were+called%2C+unto+the+fellowship+of+his+Son+Jesus+Christ+our+Lord.%E2%80%99+2.+We+do+not+read+in+the+Old+or+New+Testament+that+the+decree%2C+purpose+or+intention+of+God+to+save+and+redeem+persons+in+particular+is+the+object+of+that+saving+faith+required+in+the+Gospel.+For+the+second+object+of+this+faith+is+the+truth+and+goodness+of+that+mother+promise+of+the+Gospel%2C+Jn.+3%3A16+and+5%3A25%2C+that+Gospel-record%2C+1+Jn.+5%3A10-12%2C+%E2%80%98He+that+believeth+hath+life+eternal%2C%E2%80%99+and+%E2%80%98Jesus+Christ+came+into+the+world+to+save+sinners%2C%E2%80%99+1+Tim.+1%3A15%2C+%E2%80%98to+seek+and+to+save+the+lost%2C%E2%80%99+Lk.+19%3A1%E2%80%A2%3B+That+He+came+to+save+me+in+particular+is+apprehended+by+sense%2C+not+by+faith%3B+for+the+election+of+me+by+name+to+glory+and+the+Lord%E2%80%99s+intention+to+die+for+me%2C+is+neither+promise%2C+nor+precept%2C+nor+threatening%3B+if+it+be+a+history+that+I+must+believe%2C+it%E2%80%99s+good%2C+show+me+histories+of+particular+men+now+to+be+believed%2C+except+of+the+Antichrist%2C+the+Second+Coming+of+Jesus+Christ+to+judge+the+world.+Election+to+glory+is+not+held+forth+as+a+promise%3A+%E2%80%98If+ye+do+this%2C+ye+shall+be+elected+to+glory%2C%E2%80%99+nor+is+the+contrary+holden+forth+as+a+threatening%3A+%E2%80%98If+ye+believe+not%2C+ye+shall+be+reprobated%2C%E2%80%99+nor+does+the+Lord+command+me+to+be+chosen+in+Christ+to+salvation+before+the+foundation+of+the+world%2C+nor+does+He+command+all+men+within+the+visible+Church+to+believe+they+are+chosen+to+salvation+or+that+any+one+elect+person+should+believe+a+thing+as+revealed+which+is+not+revealed%3B+when+He+is+pleased+to+give+to+any+elect+person+the+white+stone+and+the+new+name+and+to+give+him+faith+by+which+he+chooses+Christ+for+his+portion%2C+he+is+then%2C+and+never+till+then+to+believe%2C+or+rather+by+spiritual+sense+to+apprehend+that+he+is+chosen+to+salvation+from+eternity%3B+so+election+is+neither+precept%2C+nor+promise%2C+but+a+truth+of+God%E2%80%99s+gracious+goodwill+and+pleasure+hid+in+God%E2%80%99s+mind+till+He+be+pleased+to+reveal+it+by+the+fruits+thereof.+There+can+be+no+such+imaginable+double+dealing+in+the+world+as+Arminians+lay+upon+God%3A+For+they+make+the+Lord+to+say+thus+as%2C+imagine+a+king+should+speak+to+twenty+thousand+captives%3A+I+have+a+good+will%2C+purpose%2C+hearty+intention+and+earnest+desire+to+make+you+all+and+every+one+free+princes%2C+and+pray%2C+wish%2C+obtest+and+beseech+you+subscribe+such+a+writ+of+grace+for+that+end%2C+but+I+only+can+lead+your+hand+at+the+pen+and+give+you+eyes+to+see+and+a+willing+heart+to+consent+to+your+own+happiness%2C+and+if+you+refuse+to+sign+the+bill+of+grace+you+shall+be+tormented+forever+and+ever+in+a+river+of+fire+and+brimstone%3A+Again%2C+I+have+a+like+good+will+to+my+own+justice+and+purpose+so+to+carry+on+the+design+as+that+sixteen+thousand+of+you+shall+not+have+the+benefit+of+my+hand%2C+or+of+one+finger+to+lead+your+hand+at+the+pen%2C+nor+any+efficacious+motion+to+act+upon+your+will+to+obtain+your+consent+to+subscribe+the+writ%3B+yea+by+the+contrary+though%2C+I+of+exceeding+great+free+love+will%2C+intend%2C+decree+and+purpose+you+be+all+princes+of+glory%2C+yet+I+purpose+that+these+sixteen+thousand+whose+salvation+and+happiness+I+extremely+desire+shall+for+their+former+rebellion%2C+which+I+with+the+like+desire+of+spirit+could+and+I+only+might+have+removed%2C+never+be+moved+to+consent+to+this+bill+of+grace.+Now+were+not+this+the+outside+of+a+good+will%2C+and+should+not+this+prince+be+said+rather+to+will+and+desire+the+destruction+of+these+sixteen+thousand+and+not+their+honor+and+happiness%3F+Assertion+3.+This+is+the+mystery+of+the+Gospel%2C+in+which+I+must+profess+ignorance+and+that+the+Lord%E2%80%99s+thoughts+are+not+as+our+thoughts+nor+his+ways+as+our+ways%3A+He+has+by+the+preaching+of+the+gospel+engaged+thousand+thousands+within+the+visible+Church+to+the+duty+of+their+fiducial+adherence+and+heart+resting+on+Christ%2C+as+they+would+be+saved%2C+and+yet+has+the+Lord+never+purposed+to+work+their+hearts+%28and+He+only+can+do+it%29+to+this+heart-resting+on+Christ+by+faith%2C+nor+has+He+purchased+either+remission+of+sins+or+pardon+for+them.+If+any+object%2C+How+can+Christ+in+equity+judge+and+condemn+them+for+not+believing+pardon+and+salvation+in+his+blood+when+as+neither+pardon+nor+salvation+are+purchased+in+this+blood+to+them%2C+nor+purposes+He+to+give+them+faith%3F+Yet+we+may+plead+for+the+Lord%3A+we+conceive+of+the+decree+of+God+as+of+a+deep+policy+and+a+stratagem+and+snare+laid+for+us%3A+whereas+the+Lord+lies+not+in+wait+for+our+ruin%2C+nor+carries+He+on+a+secret+design+in+the+gospel+to+destroy+men%3A+If+Christ+should+say+in+the+Gospel-precepts%2C+promises+or+threatenings%2C+%E2%80%98I+decree+purpose+and+intend+to+redeem+all+and+every+man%2C+but+I+purpose+to+carry+on+the+designs+so%2C+as+the+far+greatest+part+of+mankind+inevitably+shall+be+lost%2C%E2%80%99+it+should+be+a+stratagem%3B+but+the+gospel+as+the+gospel+reveals+not+any+decree+or+intention+of+God+touching+the+salvation+or+damnation+of+men+intended+from+eternity%3A+Indeed+the+gospel+as+obeyed+or+disobeyed+reveals+Gods+intentions+and+decrees%3B+the+gospel+reveals+nothing+but+the+Lord%E2%80%99s+complacency%2C+approbation+and+good-liking+of+the+sweet+connection+between+faith+and+salvation%2C+the+just+concatenation+between+unbelief%2C+disobedience+and+eternal+damnation%3A+so+the+gospel+reveals+duties%2C+but+not+the+persons+saved+or+damned%3B+the+Lord%E2%80%99s+working+with+the+gospel%2C+or+the+efficacy+of+the+gospel+%28which+is+a+far+other+thing%29%2C+reveals+the+persons.+Now+the+difficulty+is%2C+how+the+Lord+can+command+the+reprobate+to+believe+life+and+salvation+in+Christ+when+there+is+no+life+and+salvation+either+intended+to+them+or+purchased+for+them%3F+To+which+I+answer%3A+1.+God+gave+a+law+to+all+the+angels+created+in+the+truth%2C+%E2%80%98If+ye+abide+in+the+truth%2C+ye+shall+be+eternally+happy.%E2%80%99+Ye+cannot+say+that+the+devils+in+that+instant+were+to+believe+that+God+intended+and+decreed+them+for+eternal+happiness+and+to+give+them+efficacious+grace+by+which+they+should+abide+in+the+truth+as+their+fellow+angels+did%3A+God%E2%80%99s+command+and+promise+did+reveal+no+such+intention+of+God.+So+the+Lord+said+to+Adam+and+to+all+his+seed%2C+%E2%80%98If+ye+keep+the+law+perfectly%2C+ye+shall+have+life+eternal%2C%E2%80%99+according+to+that%2C+%E2%80%98Do+this+and+live%3A%E2%80%99+yet+was+not+Adam+then%2C+far+less+these+that+are+now+under+the+Law%2C+to+believe+that+God+ordained+them+from+eternity+to+eternal+life+legally+purchased+or+that+any+flesh+should+be+justified+by+the+works+of+the+Law.+Arminians+tell+us+that+there+be+numbers+judicially+blinded+and+hardened+within+the+visible+Church+who+cannot+believe+and+whom+the+Lord+hath+destined+for+destruction%2C+yet+the+Word+is+preached+to+them%3B+they+hear+and+read+the+promises+of+the+gospel%2C+and+the+precepts%3B+Whither+are+they+to+believe+that+God+intended+from+eternity+to+them+salvation+and+grace+to+believe%3F+I+think+not%2C+for+they+teach+that+Christ+neither+prays+for%2C+nor+intends+to+die+for+the+unbelieving+and+obstinate+world+as+such%2C+nor+decreed+their+salvation%2C+and+except+men+may+fancy+senses+on+the+words+of+God%E2%80%99s+Spirit%3A+where+learned+they+to+expound+the+word+%E2%80%98world%E2%80%99+%28when+it+makes+for+them%29+for+all+and+every+one+of+mankind%3B+and+when+it+makes+against+them%2C+for+the+least+part+of+mankind%2C+and+that+either+within+the+visible+Church+only+or+yet+without+the+visible+Church%3F+For+in+both%2C+Satan%E2%80%99s+world+of+disobedient+ones+is+the+far+greatest+part%2C+seeing+the+whole+world+lies+in+sin%2C+as+John+says.+Let+it+be+also+remembered+when+Arminians+say%2C+%E2%80%98The+Lamb+of+God+taketh+away+the+sins+of+the+world%2C%E2%80%99+that+is+of+all+and+every+mortal+man%2C+they+mean+Christ+takes+not+away%2C+nor+sheds+He+his+blood+for+the+sins+of+the+rebellious+world%3B+so+the+world%E2%80%99s+rebellion%2C+contumacy+and+infidelity+against+Christ+must+be+pardoned+without+shedding+of+blood%2C+and+if+Christ+did+bear+all+the+sins+of+the+world+on+the+cross+conditionally+and+none+of+them+absolutely%3A+then+our+act+of+believing+must+be+the+only+nearest+cause+of+satisfaction+for+sins%3A+but+why+then%2C+if+Christ+satisfied+on+the+cross+for+the+final+impenitency+and+unbelief+of+the+rebellious+world+conditionally%2C+so+they+believe+and+be+not+rebellious%2C+but+Arminians+should+say+right+down+Christ+died+for+the+rebellious+and+contumacious+world%2C+and+He+prays+for+the+contumacious+world+as+such%2C+but+conditionally%3B+for+He+prays+and+dies+for+the+not-rebellious-world+of+all+mortal+men%2C+not+absolutely%2C+but+conditionally%2C+so+they+believe+in+Christ%3B+if+they+believe+not%2C+neither+the+prayers+of+Christ+nor+his+death+are+more+effectual+for+them+than+for+devils.+To+all+these+we+may+add+that+the+Lord+in+commanding+reprobates+to+rest+on+Christ+for+salvation%2C+though+no+salvation+be+purchased+for+them%2C+deals+sincerely+and+candidly+with+them%2C+for%3A+First%2C+He+commands+them+to+believe+no+intention+in+God+to+save+them+by+the+death+of+his+Son%2C+nor+says+He+any+such+thing+to+them%2C+but+only+commands+them+to+rely+on+Christ+as+an+all-sufficient+Savior.+Secondly%2C+God+commands+all+the+reprobate%2C+even+by+their+%5BArminian%5D+way%2C+to+believe+that+Christ+in+his+death+intended+their+salvation%2C+justification%2C+conversion%2C+and+yet+whereas+God+takes+ways+effectual+and+such+as+He+foresees+shall+be+effectual+for+the+efficacious+working+of+justification+and+conversion+and+actual+glorification+of+some+few%2C+yet+He+takes+ways+which+He+knows+shall+be+utterly+ineffectual+for+the+salvation%2C+justification+and+conversion+of+all+these+reprobates%2C+and+yet+commands+them+to+believe+that+He+decree+and+intends+their+salvation+and+conversion+with+no+less+ardency+and+vehemency+of+serious+affection+than+He+does+intend+the+salvation+and+conversion+of+all+that+shall+be+glorified.+Sure+this+we+would+call+double+dealing+in+men%2C+and+the+Scripture+says+he+is+a+God+of+truth%2C+Dt.+32%2C+and+the+Lord+who+cannot+lie.+Objection%3A+If+a+rich+innkeeper+should+dig+a+fountain+in+his+field+for+all+passengers%2C+thirsty+and+diseased%2C+which+were+able+to+cure+them+and+quench+their+thirst%2C+and+invite+them+all+to+come+and+drink+and+be+cured%2C+upon+condition+they+come+and+believe+the+virtue+of+the+water+to+be+such%2C+and+yet+should+intend+and+decree+absolutely+and+irresistibly+the+tenth+man+invited+should+never+be+cured%2C+this+innkeeper+should+not+deal+sincerely+with+them.+So+you+%5Bthe+reformed%5D+make+God+to+deal+with+sinners+in+the+Gospel.+He+does+all%2C+in+inviting+sick+sinners+to+come+and+drink+life+and+salvation+at+Christ+the+Fountain+of+life%2C+which+expresses+with+men+who+speak+as+they+think+their+sincere+intention%2C+but+He+intends+no+such+thing.+Answer%3A+Make+the+comparison+run+as+it+should+do+and+it+makes+more+against+Arminians%3A+say+that+this+Innkeeper+had+dominion+over+the+heart+and+will%2C+as+the+Lord+has%2C+Prov.+21%3A1%3B+Ps.+119%3A36-37%3B+Heb.+13%3A20-21%3B+Mt.+6%3A13%2C+and+that+He+could+and+does+without+straining+of+the+heart+work+in+all+the+passengers+a+sense+of+their+disease%2C+grace+actually+to+come+and+drink%2C+and+yet+He+takes+a+dealing+with+the+souls+of+some+few+and+causes+them+come+to+the+waters+and+drink+and+heals+them%2C+and+He+uses+such+means+and+so+acts+upon+the+will+of+the+far+most+part+that+they+shall+never+come%2C+never+be+sensible+of+their+disease%2C+and+yet+He+invites+them+to+come+to+the+waters+and+drink%3B+it%E2%80%99s+clear+this+Innkeeper+never+intended+the+health+of+all+and+every+one+of+the+passengers%2C+but+only+of+these+few+that+come+and+drink%3B+nor+do+invitations+with+men+upon+condition%2C+which+the+party+invited+is+obliged+to+perform%2C+but+does+never+perform%2C+and+which+the+inviter+only+of+grace+can+work+in+the+invited%2C+but+does+not+work+them%2C+as+being+not+obliged+thereunto%2C+speak+any+such+intention.+Again%2C+let+it+be+considered+that+here%3A+1.+God+lies+in+wait+for+no+man%E2%80%99s+destruction.+2.+God+is+not+obliged+to+reveal+his+eternal+purpose+and+intentions+touching+men%E2%80%99s+salvation+and+damnation+but+in+the+way+and+manner+seems+best+to+Him.+3.+God+never+says+in+all+the+Gospel+that+from+eternity+He+has+passed+a+resolve+to+save+all+mankind%2C+if+they+will%2C+and+to+yield+them+the+bridle+on+their+own+necks+that+they+may+be+indifferent+and+absolute+Lords+of+Heaven+and+Hell.+4.+Nor+should+the+Gospel+be+framed+in+such+wisdom+if+the+Lord+had+set+down+particularly+the+names+of+all+the+elect+and+reprobate+in+the+world+and+have+proponed+salvation+upon+condition+of+obedience+and+faith+to+some+few%3A+it+should+evidently+have+raised+a+hard+opinion+in+the+minds+of+thousands+touching+Christ.+Assertion+4.+The+third+object+of+faith+is+the+sufficiency+and+power+of+Christ+to+save.+1.+The+Scripture+makes+the+object+of+coming%2C+which+is+believing%2C+Jn.+5%3A40%3B+Jn.+6%3A35%3B+Mt.+11%3A27%2C+to+be+Christ%E2%80%99s+ability+and+power%2C+Heb.+7%3A25%2C+%E2%80%98to+save+them+to+the+uttermost%2C%E2%80%99+that+come+unto+God+by+Him%2C+seeing+He+ever+liveth+to+make+intercession+for+them.+What+the+Scripture+presses+us+to+believe+savingly%2C+that+we+must+be+inclined+to+misbelieve%2C+and+for+the+misbelieving+thereof+the+reprobates+are+condemned%2C+and+not+because+they+believe+not+the+Lord%E2%80%99s+intention+to+save+all%2C+or+his+decrees+of+election+and+reprobation.+But+the+Scripture+presses+faith+in+the+power+of+mercy%2C+Rom.+4%3A21%2C+Abraham+staggered+not%2C+but+was+strong+in+the+faith%2C+giving+glory+to+God%2C+being+fully+persuaded+that+what+He+had+promised%2C+He+was+able+also+to+perform.+Now+Abraham+is+commended+for+that+he+savingly+and+for+his+justification+believed+the+power+of+God+in+the+Gospel+promise+that+God+was+able+of+his+mercy+to+give+him+the+son+of+promise+in+his+old+age%3B+otherwise+to+believe+simply+the+power+of+God+to+give+a+child+to+a+mother+who+is+passed+the+natural+date+of+bearing+children+is+but+the+faith+of+miracles%2C+which+of+itself+is+not+saving+and+may+be+in+workers+of+iniquity%2C+Mt.+7%3A21-22%3B+so+this+power+then+is+the+power+of+saving+conjoined+with+the+mercy+and+good+will+of+Christ.+2.+The+Scripture+holds+forth+to+our+faith+the+power+of+God+to+graft+in+the+Jews+again+in+Christ%2C+Rom.+11%3A23%2C+to+make+a+weak+believer+stand%2C+Rom.+14%3A4%2C+to+keep+the+saints+from+falling+and+to+present+them+faultless+before+the+presence+of+his+glory+with+exceeding+joy%2C+Jude+v.+24.+3.+The+good+Land+was+a+type+of+the+heavenly+rest%2C+Heb+4%3A1+and+Heb.+3%3A19%2C+some+entered+not+in+through+unbelief%3A+why%2C+what+unbelief%3F+The+story+shows+us%2C+Ps.+93%3A7%3B+Num.+14%3A9%3B+13%3A28%2C+they+doubted+of+the+power+of+God+and+believed+the+report+of+the+unbelieving+spies%2C+who+said%2C+%E2%80%98The+people+be+strong+that+dwell+in+the+land%2C+the+cities+are+walled+and+very+great%2C+and+moreover+we+saw+the+children+of+Anak+there.%E2%80%99+Joshua+and+Caleb%2C+ch.+14%3A9%2C+said+they+should+not+be+bread+for+them+and+their+strength+was+gone%3B+then+the+question+was%2C+whether+God+was+able+to+give+them+that+good+Land.+So+then+men+enter+not+into+the+heavenly+rest+because+they+believe+not+that+Jesus+is+able+to+save+to+the+uttermost+those+that+come+through+him+to+God%2C+Heb.+7%3A23.+4.+The+Scripture+is+as+much+in+proving+the+all-sufficiency%2C+power+and+perfection+of+Christ+our+Savior%2C+to+save%2C+as+in+demonstrating+his+tenderness+of+mercy+and+goodwill+to+save%3B+as+in+the+epistle+to+the+Hebrews%2C+the+apostle+labors+much+for+to+prove+the+Godhead+of+Christ%2C+his+excellency+above+angels+and+that+the+angels+were+to+adore+him%2C+his+dignity+and+greatness+above+Moses+and+all+the+mortal+and+dying+priests%2C+the+virtue+of+his+blood+above+all+the+bloods+of+bulls+and+goats%2C+to+purge+the+conscience+from+dead+works%2C+to+expiate+sin%2C+to+sanctify+his+people%2C+to+open+a+way%2C+a+new+and+living+way+to+the+holy+of+holiest%2C+by+his+blood%2C+that+we+with+full+assurance+may+draw+near+to+God%2C+that+He+with+one+sacrifice%2C+never+to+be+repeated%2C+did+that+which+all+the+thousands+of+reiterated+sacrifices+were+never+able+to+do%3B+that+He+is+no+dying+priest%2C+but+lives+forever+to+intercede+for+us+at+the+right+hand+of+God.+And+for+what+is+all+this+but+that+we+should+believe+the+all-sufficiency+of+Christ+to+save%3F+and+because+we+have+too+low+thoughts+of+Christ%2C+as+conceiving+Him+to+be+but+a+man+or+less+than+an+angel%2C+or+a+common+priest+that+can+do+no+more+by+his+blood+as+touching+remission+of+sins+than+dying+priests+could+do+with+the+blood+of+beasts%2C+and+that+He+is+dead%2C+and+now+when+we+sin%2C+He+cannot+advocate+for+us+at+the+right+hand+of+God%2C+that+his+redemption+He+brings+in+is+not+eternal%2C+yea+all+this+says+that+saving+faith+rests+upon+Christ+as+God%2C+as+able+and+completely+perfect+and+sufficient+to+save%2C+though+sinners+do+not+in+the+formal+act+of+faith+believe+his+good+will%2C+decree+and+intention+to+redeem+and+save+them+by+name.+5.+I+should+think+that+these+who+have+high+and+precious+thoughts+of+the+grace%2C+tender+mercy%2C+perfection+and+sufficiency+of+Christ+to+save+all+that+believe+and+fiducially+rely+on+Christ+as+a+Savior+sealed+for+the+work+of+redemption%2C+though+they+know+not+God%E2%80%99s+mind+touching+their+own+salvation+in+particular%2C+have+such+a+faith+as+the+Gospel+speaks+of%2C+and+do+savingly+believe+that+Christ+came+to+seek+and+to+save+that+which+is+lost%2C+to+save+sinners%2C+that+Christ+is+the+Son+of+the+living+God%2C+the+Savior+of+mankind%3B+and+this+no+devil%2C+no+temporary+believer%2C+no+hypocrite+can+attain+unto.%E2%80%9D%0A%0A%E2%80%94+Samuel+Rutherford%2C+Christ+Dying+%26+Drawing+Sinners+to+Himself%2C+%28London%3A+1647%29%2C+pp.+449-%5Bsic%5D23&amp;url=https%3A%2F%2F5solasquotes.github.io%2Fquote%2F9594f91183.html&amp;via=5Solas" target="_blank" rel="noopener">Share on X</a><a class="perma" href="../quote/9594f91183.html">Permalink</a><a class="src" href="https://reformedbooksonline.com/topics/faith#:~:text=What%20sort%20of%20faith%20it%20is,believer%2C%20no%20hypocrite%20can%20attain%20unto&amp;text=What%20sort%20of%20faith%20it%20is%20that%20God&amp;text=no%20temporary%20believer%2C%20no%20hypocrite%20can%20attain%20unto" rel="noopener" target="_blank">Read it online · Reformed Books Online</a></div>

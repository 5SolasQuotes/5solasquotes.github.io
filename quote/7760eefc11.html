<main class="wrap"><figure class="quote" id="q-7760eefc11" data-kw="">
<blockquote><p>‘Occasional‘, properly, is that which has a reason, not from the nature of the thing itself, but from such occasional occurrences of providence, as God will not alter, and its that which has no moral nor sacred conveniency with the nature of worship, but has only a conveniency for such a time and place, as Christ’s preaching in a ship, when He is at the sea side, and a multitude are to hear Him, the ship has no agreement with the nature of preaching, more than a house has. Time, place, and persons are clearly such as agreed with that [Last] Supper, as [a supper] first, not as a sacred worship; and therefore [these particulars] were merely occasional, and so not imitable [by us]; and though Christ might have altered them, yet had they been occasional, and they have no sacred conveniency with this Supper, as this Supper; and if Christ had altered these for mere will, upon no reasons that concerns all suppers, they had not been occasional, but positive points of worship, and so had obliged us;</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/samuel-rutherford.html">Samuel Rutherford</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Divine Right of Church Government</cite>, … (1646), p. 193</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/worship/public-worship.html">Public Worship</a></span><span class="t"><a href="../topics/worship/ceremonies-and-things-indifferent.html">Ceremonies and Things Indifferent</a></span></div>

</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-7a79f74b0c" data-kw="">
<blockquote><p>Where these Forms are contended for by men, with respect unto their own use and practice only, as suitable to their experience, and judged by them a serving of God with the best that they have; I shall not take the least notice of them, nor of any dissent about them. But whereas a persuasion not only of their lawfulness but of their necessity is made use of unto other ends and purposes, wherein the peace and edification of believers is highly concerned, it is necessary we should make some inquiry thereinto.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/john-owen.html">John Owen</a></span><span class="wk"><span class="lbl">Work:</span> <cite>A Discourse of the Work of the Holy Spirit in Prayer with a Brief Inquiry into the Nature and Use of Mental Prayer and Forms</cite>, (London, 1682) being Book 7 of Pneumatologia: or a Discourse concerning the Holy Spirit in Works, 4.235-350, Ch. 11, ‘Prescribed forms of Prayer Examined’; p. 212</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/worship/public-worship.html">Public Worship</a></span></div>

</figure><figure class="quote" id="q-52be45d224" data-kw="">
<blockquote><p>2nd Quaere: Seeing hence it follows [on congregationalist terms] that single believers are to pray publicly, and exhort publicly, and authoritatively convince gainsayers at the ordination and deprivation of pastors, if they may not also publicly preach and administer the sacrament? I answer: If you give to single believers one pastoral act, you may with the like weight of reason give to them all.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/samuel-rutherford.html">Samuel Rutherford</a></span><span class="wk"><span class="lbl">Work:</span> <cite>A Peaceable &amp; Temperate Plea for Paul’s Presbytery in Scotland</cite>, … (London, 1642), ch. 18, p. 272</span></figcaption>

</figure><figure class="quote" id="q-904755a747" data-kw="">
<blockquote><p>Objection 17: But the particulars of your [Westminster] Directory of worship are not in Scripture, how then can the magistrate punish for not following the Directory? Answer: That there should be prayers, preaching, reading, praising of God, sacraments in the public worship, is evident by the Scripture, but for the ordering of these worships secundum prius &amp; posterius [according to what is first and that which follows] the words of prayer (so they be according to the pattern of sound doctrine) the Preface of the Directory is clear, that no man is therein to be compelled, though to transgress the Holy Ghost’s express order in the celebration of the Lord’s Supper and to break bread and eat first, and that before any of the words of institution be mentioned, or any blessing of the elements, must be a manifest breach of the directory of Jesus Christ which sure holds forth to us a twofold ordering of acts of worship, one divine, which we must peremptorily follow, another prudential and human in circumstances which concern both the worship of God and civil assemblies, as time, place, persons, etc. and in the latter we are no further to be commanded in point of uniformity than the general rules of the Word lead us; and compulsion, where God has no compelling commandment going before in an exact uniformity, we utterly disclaim, nor can men, or Church, or all the assemblies on earth make laws in matters of God’s worship where the Supreme Lawgiver has made none, and the Preface of the Directory is so clear in this that we trust we shall quickly agree with the godly and sound in judgment in this.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/samuel-rutherford.html">Samuel Rutherford</a></span><span class="wk"><span class="lbl">Work:</span> <cite>A Free Disputation Against Pretended Liberty of Conscience</cite>, … (London, 1649), pp. 372-3</span></figcaption>

<blockquote><p>242. Of the use of Amen being added to a Speech …

1. Three duties especially are required of him that utters the speech whereunto ‘Amen’ is added. …

2. To speak audibly, so as they which are to say Amen, may hear what is said. The Levites under the Law were expressly enjoined to speak to the people with a loud voice. Accordingly the Levites that were the mouth of the people to God, and prayed in their presence, cried with a loud voice unto the Lord their God. Be a prayer made as intelligibly as may be, if it be not heard of them that are present, they cannot with assent, desire, and say Amen.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/william-gouge.html">William Gouge</a></span><span class="wk"><span class="lbl">Work:</span> <cite>A Guide to Go to God</cite>, ... (1626; RHB, 2011) See the whole of the larger section, pp. 330-40.</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/worship/public-worship.html">Public Worship</a></span></div>

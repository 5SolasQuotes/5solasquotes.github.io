<main class="wrap"><figure class="quote" id="q-5acde3f0ea" data-kw="">
<blockquote><p>17. The Sieur Codure, formerly pastor and professor of divinity in the Church and University of Nismes, having sent letters with a diatribe of his, dedicated unto this Assembly, in which he pretends to reconcile the differences between the Protestants and the Church of Rome concerning Justification, and demanded audience of it: According to his request, he was admitted to propound the reasons and motives of his design. Which having done, there was a most serious remonstrance made him of the great wrong he had done; First, unto the truth of God, in taking upon him to reconcile contradictory opinions, and utterly inconsistent one with the other. And then secondly, how injurious he was unto the Protestants, in oppugning as erroneous their common Confession, that so to their prejudice he might advantage the Romish Church, which does notoriously confound two of the greatest blessings of God, and inseparable one from the other, though yet always distinct in themselves; to wit, the sinner’s absolution before the tribunal of God, upon the account of the merits of Christ Jesus, his obedience imputed to him, and regeneration wrought in the heart of man, by the sanctifying operation of the Holy Ghost. And lastly, how much an enemy he was unto himself, in forsaking his ministry, and the cure of souls, to become an advocate of such a vile and ungodly cause as is this of the Papacy, which is altogether unreasonable in him, for that he undertakes things impossible. But he still protesting that he never intended to, and never would depart from the Orthodox Creed professed in our Churches, and offered to purge and acquit himself from all suspicions that might be had of him by his voluntary subscribing the principal articles of the doctrine of truth, from which he was supposed to have swerved and declined: They were thereupon offered to him; which when he had as freely and in general signed and subscribed, as he had offered to do it, yet it being done with hesitation for some time, and this also attended with ambiguous expressions, the Assembly was constrained to doubt of his sincerity; and it was the rather feared, for that after the subscription required, he resolutely refused to follow his vocation, and the counsel of his brethren, discovering an unworthy disdain and scorn of that holy and honorable employment in the ministry of the Gospel, whereunto in his younger days he was called by God. All which considered, the synod interdicted him all the offices of the sacred ministry, and of the profession of theology, and enjoined both the province, and that particular church where he constantly resides, to watch over his deportments, and to give an accompt of him and his conversation unto the next national synod, which may, according to what testimonials they shall receive of him, and his future carriage, proceed unto his restoration.</p></blockquote>

<blockquote><p>§40. II. It is greatly needful to the well-being of the ministry and the success that doctrine be kept sound: And therefore: 1. That the Christian simplicity be retained, and many subtle and curious decisions be not made necessary: A few great, necessary certain truths are easilier preserved than multitudes of uncertain controverted niceties. 2. It is needful that such as are ordained ministers, be tried men, of sound understanding in that which they must teach and do, and therefore that both the ordainers and the hearers try them. This account of their understanding is better than the imposing of human forms upon them for subscription: Not but that teachers should know more than the flock, that is, than the essentials; nor that I presume to condemn all the Churches that impose their confessions to be subscribed in their own and not in Scripture-words, while they keep only to necessary, certain things: But I shall afterward prove that this way, though tolerable, is not best, but unnecessary and dangerous: 1. The Scripture affording us apt words enough to form our confessions in, which are past controversy; 2. and there being no probability of bounding men’s impositions of this kind, when once they set upon this way; 3. and most confessions of that nature now extant, having some needless words which other Churches or good Christians do dissent from: 4. And the ancient Creeds understood (which the ordainers must try) and the old catechistical verities being sufficient to this use. 5. And there being means of restraining men from preaching and vending heresies which are more safe and congruous. 3. I add therefore that a certain confession containing the certainest and needfulest integrals of religion should or may well be drawn up as a law, forbidding all upon meet penalties to preach or speak against them, without any subscribing, promising or professing. 4. And upon proof of the violating of such a law, and preaching against such articles it is sufficient that both the Church and the Christian magistrate in their several ways may judge them and by just penalties correct them (of which more after in due place). For it is very hard so to form long confessions (beyond the old creeds, Lord’s Prayer, Decalogue, and the general belief of Scripture) and this not in Scripture-terms, which shall not have some words which sound and honest Ministers cannot assent to (without lying, which they will not do): But to silence many words which yet we conceive true, and forbear speaking against some things which yet he cannot profess assent to, there are very few sober men but will do. And an error never spoken or written hurts not others, nor is to be judged, being not known; Non apparere here is as non esse. And if it be vended, the person may be judged as well as if he had sworn, subscribed or promised. And they that will tell us yet what evil may befall secret whispering errors without such oaths, subscriptions or promises, do by this over-doing dangerously undo; and lest man should be man and the Church imperfect, on pretence of avoiding a possible unavoidable hurt, they will set up knaves that will say any thing, shut out honest men, and necessitate divisions, confusions and persecutions, where they can never stop on this side banishing or killing or continued imprisoning multitudes of faithful men, and never the more attain their ends. Sound doctrine may be kept up as far as is to be hoped by the aforesaid means.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/richard-baxter.html">Richard Baxter</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The True &amp; only Way of Concord of all the Christian Churches, the Desirableness of it &amp; the Detection of False Dividing Terms (London: Hancock, 1680), pt. 2, ch. 5, ‘What are the terms necessary to the office and exercise of the sacred ministry?’</cite>, pp. 222-23</span></figcaption>

ing+heresies+which+are+more+safe+and+congruous.+3.+I+add+therefore+that+a+certain+confession+containing+the+certainest+and+needfulest+integrals+of+religion+should+or+may+well+be+drawn+up+as+a+law%2C+forbidding+all+upon+meet+penalties+to+preach+or+speak+against+them%2C+without+any+subscribing%2C+promising+or+professing.+4.+And+upon+proof+of+the+violating+of+such+a+law%2C+and+preaching+against+such+articles+it+is+sufficient+that+both+the+Church+and+the+Christian+magistrate+in+their+several+ways+may+judge+them+and+by+just+penalties+correct+them+%28of+which+more+after+in+due+place%29.+For+it+is+very+hard+so+to+form+long+confessions+%28beyond+the+old+creeds%2C+Lord%E2%80%99s+Prayer%2C+Decalogue%2C+and+the+general+belief+of+Scripture%29+and+this+not+in+Scripture-terms%2C+which+shall+not+have+some+words+which+sound+and+honest+Ministers+cannot+assent+to+%28without+lying%2C+which+they+will+not+do%29%3A+But+to+silence+many+words+which+yet+we+conceive+true%2C+and+forbear+speaking+against+some+things+which+yet+he+cannot+profess+assent+to%2C+there+are+very+few+sober+men+but+will+do.+And+an+error+never+spoken+or+written+hurts+not+others%2C+nor+is+to+be+judged%2C+being+not+known%3B+Non+apparere+here+is+as+non+esse.+And+if+it+be+vended%2C+the+person+may+be+judged+as+well+as+if+he+had+sworn%2C+subscribed+or+promised.+And+they+that+will+tell+us+yet+what+evil+may+befall+secret+whispering+errors+without+such+oaths%2C+subscriptions+or+promises%2C+do+by+this+over-doing+dangerously+undo%3B+and+lest+man+should+be+man+and+the+Church+imperfect%2C+on+pretence+of+avoiding+a+possible+unavoidable+hurt%2C+they+will+set+up+knaves+that+will+say+any+thing%2C+shut+out+honest+men%2C+and+necessitate+divisions%2C+confusions+and+persecutions%2C+where+they+can+never+stop+on+this+side+banishing+or+killing+or+continued+imprisoning+multitudes+of+faithful+men%2C+and+never+the+more+attain+their+ends.+Sound+doctrine+may+be+kept+up+as+far+as+is+to+be+hoped+by+the+aforesaid+means.%E2%80%9D%0A%0A%E2%80%94+Richard+Baxter%2C+The+True+%26+only+Way+of+Concord+of+all+the+Christian+Churches%2C+the+Desirableness+of+it+%26+the+Detection+of+False+Dividing+Terms+%28London%3A+Hancock%2C+1680%29%2C+pt.+2%2C+ch.+5%2C+%E2%80%98What+are+the+terms+necessary+to+the+office+and+exercise+of+the+sacred+ministry%3F%E2%80%99%2C+pp.+222-23&amp;url=https%3A%2F%2F5solasquotes.github.io%2Fquote%2Ff861c3603b.html&amp;via=5Solas" target="_blank" rel="noopener">Share on X</a><a class="perma" href="../quote/f861c3603b.html">Permalink</a><a class="src" href="https://reformedbooksonline.com/on-subscription-to-confessions-by-church-officers/#:~:text=%C2%A740.%20II.%20It%20is%20greatly%20needful,be%20hoped%20by%20the%20aforesaid%20means." rel="noopener" target="_blank">Read it online · Reformed Books Online</a></div>

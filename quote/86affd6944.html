<main class="wrap"><figure class="quote" id="q-86affd6944" data-kw="">
<blockquote><p>That it repeals the decision of the Synod of 1926 regarding choir~singing, and declare that there shall be no singing in our public services except by the congregation as a whole, on the ground: a) That there is no place for such singing according to our Reformed conception of public worship. Since God meets and fellowships with His Church in public worship, every element must be either an act of God (through the Minister) having the congregation as its object or an act of the congregation (directly or through the minister) having God as its object. Anthem-singing by a choir or a soloist is neither. It is in reality a usurpation of the privilege and duty of the whole congregation to sing praise to God; b) It conflicts with Article 69 of the Church Order which permits the singing of only a few hymns specifically mentioned; c) It conflicts with the basic principle of Article 69 of the Church Order, namely, that the Church as a whole. through the Synod, shall determine what shall be sung in our churches…. Respectfully. Your Committee. W. HEYNS. H. J. KUIPER. L. TRAP. D. ZWIER. J. V AN LONKHUYZEN W. STUART Y. P. DE JONG</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/acta-der-synode-1928-van-christelijke-gereformeerde-kerk.html">Acta der Synode 1928 van Christelijke Gereformeerde Kerk</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Other citations (work not named)</cite>, 11–29 Juni, 1928, Holland, Michigan. Supplement XIV</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/worship.html">Worship</a></span></div>

</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-bb2401ee82" data-kw="">
<blockquote><p>But as far as images are concerned, whether painted or sculpted, though we do not reject their use when sacred material or histories are represented, nevertheless we do not admit them in holy places without hesitation. Nor do we do we judge it prudent especially that sculpted images be set up in Temples, not because it is impious in and of itself, or because we think it not allowed, but rather because of the sad appearance of the Churches we see in Temples of the Papists, which took its origin from the use of Images and pictures… For this reason, though I completely concede that the use of images in which sacred things and histories are represented in temples is a matter of indifference (adiaphoron), nevertheless since people easily abuse thme when they are seen in sacred places, I think they do wisely who eliminate all these things from temples.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/theodore-beza.html">Theodore Beza</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Lutheranism vs. Calvinism</cite>, (Concordia Publishing House, 2017), ch. 4, pp. 469-70</span></figcaption>

<blockquote><p>Thirdly, he expresseth the matter to be sung in three words, the very titles which are given to David’s Psalms and other scriptural songs: and though there be some difference among interpreters about the kind of songs, which are expressed by every one of those in particular, yet the most received and probable opinion is that by ‘psalms’ are meant all holy songs in general of whatsoever argument, whether they contain prayers, praises, complaints, deprecations, prophecy, history, or a purpose mixed of all those; and by ‘hymns’ are meant special songs of praise to God; and by ‘songs’, a certain kind of hymns, expressing the praises of God for some of his noble acts, great and wonderful beyond others. And those ‘songs’ he calleth ‘spiritual’ (which epithet is to be extended to the psalms and hymns also), as being framed by the Spirit of God, containing spiritual and heavenly purpose, and requiring the assistance of God’s Spirit and a spiritual frame of heart for singing them aright; and this in opposition to the obscene, filthy, and fleshly songs of carnal men and drunkards. … 2. That we may go about this worship of singing praises to God acceptably, it is necessary that we be filled with the Spirit and have a rich and copious measure of his presence and assistance, though not to compose new songs: for he pointeth at scriptural songs, as the most fitting purpose to be sung, under the titles of “psalms, hymns, and spiritual songs;” yet that we may be enabled to choose the fittest songs for the present occasion, and sing them with such a spiritual, elevated frame of heart, as such a divine and heavenly piece of worship requireth; for he saith, “be filled with the Spirit, speaking to yourselves in psalms and hymns and spiritual songs.</p></blockquote>

<blockquote><p>Again, hereby all Popish corruptions and mixtures brought into this sacrament [of baptism] are confuted and condemned, as their cream, their tapers [candles], their crosses, their censers, their salt, their spittle, their holy-water, their exorcisings and conjurations, having also an opinion of salvation and worship annexed unto them… True it is, if all the other parts and actions be observed, these inventions and additions, which are so many abuses make not baptism void, neither bring a nullity therof…</p></blockquote>

</figure><figure class="quote" id="q-4842eb8ff8" data-kw="">
<blockquote><p>That it is an ancient and excellent ordinance of God, that in his worship and service we should sing psalms, even David’s Psalms, and that we should sing them in that manner as may be most unto edification. Observe the proof of this doctrine, as I shall propound it unto you distinctly in three points: … Thirdly, the Psalms that God’s people did use to sing in the worship of God were most usually David’s Psalms, and those that are accounted among his: and that even at such times when there were prophets in the Church that had extraordinary gifts, and were inspired by the Holy Ghost, yet the Church did not usually sing any other than David’s Psalms: This we shall see in the days of Hezekiah, 2 Chron. 29:30. Hezekiah the King, and the princes commanded the Levites to sing praise to the Lord, with the words of David, and of Asaph the Seer. The like we may see in Ezra’s time, Ezra 3:10. They set the priests in their apparel with trumpets; and the Levites the sons of Asaph with cymbals to praise the Lord with those songs (as Tremelius rendreth it) that David the King of Israel did deliver; and the Psalm they sung was, Ps. 136, as appeareth by the 11th verse. And this may also further appear by that which we read, Neh. 12:46. To which purpose it is worthy the observing that though there were many of God’s holy servants that made songs, and psalms beside David, as Deborah, Jud. 5:1, and Anna, the mother of Samuel, 1 Sam. 2:1, and Solomon, Cant. 1:1, and Mary the blessed Virgin, Lk. 1:46, such as might be used, yet were none of them committed to the musicians to be publicly sung in the temple, but these of David only. In which respect he (by an excellency) is called the sweet Psalmist of Israel, 2 Sam. 3:1.</p></blockquote>

<div class="actions"><button class="copy" data-copy="“That it is an ancient and excellent ordinance of God, that in his worship and service we should sing psalms, even David’s Psalms, and that we should sing them in that manner as may be most unto edification. Observe the proof of this doctrine, as I shall propound it unto you distinctly in three points: … Thirdly, the Psalms that God’s people did use to sing in the worship of God were most usually David’s Psalms, and those that are accounted among his: and that even at such times when there were prophets in the Church that had extraordinary gifts, and were inspired by the Holy Ghost, yet the Church did not usually sing any other than David’s Psalms: This we shall see in the days of Hezekiah, 2 Chron. 29:30. Hezekiah the King, and the princes commanded the Levites to sing praise to the Lord, with the words of David, and of Asaph the Seer. The like we may see in Ezra’s time, Ezra 3:10. They set the priests in their apparel with trumpets; and the Levites the sons of Asaph with cymbals to praise the Lord with those songs (as Tremelius rendreth it) that David the King of Israel did deliver; and the Psalm they sung was, Ps. 136, as appeareth by the 11th verse. And this may also further appear by that which we read, Neh. 12:46. To which purpose it is worthy the observing that though there were many of God’s holy servants that made songs, and psalms beside David, as Deborah, Jud. 5:1, and Anna, the mother of Samuel, 1 Sam. 2:1, and Solomon, Cant. 1:1, and Mary the blessed Virgin, Lk. 1:46, such as might be used, yet were none of them committed to the musicians to be publicly sung in the temple, but these of David only. In which respect he (by an excellency) is called the sweet Psalmist of Israel, 2 Sam. 3:1.”

<main class="wrap"><figure class="quote" id="q-1b04833bae" data-kw="">
<blockquote><p>…the instrumental cause of the administration of the Lord’s Supper, viz. the ministers of the Gospel, and the power which they have as ministers to administer the Lord’s Supper. It is called by divines potestas ordinis [the power of order] or potestas muneris specialis [the power of a special office]: and by the London divines in their Divine-Right of Church-Government, is defined to be a Church-power more special and particular to the office of some Church-governors only, as the power of preaching the Gospel, and which they as ministers may execute virtute officii [by virtue of the office]: and it is distinguished from the power of jurisdiction which is more general and common to the office of all Church-governors, as the power of censures, wherein ruling-elders may act with ministers… …That which belongs to ministers as ministers, belongs to all ministers, and always, in all states and conditions of the Church, as well in an un-presbyterated as a presbyterated Church. For a quatenus ad de omni valet argumentum: and the universality required in a proposition, that is, de omni, is universalitas posterioristica, as well as prioristica; temporis, as well as subjecti; Indeed this universality of time, this always is not to be understood, as in natural attributions, for that which is absolutely such in a mathematical latitude, but is to be taken (as usually it is) when it is applied to matters moral, for frequency or usualness… For first every power is for its act, and therefore power in a minister of administring the Lord’s Supper is not to lie idle and unactive; but to be exercised and actuated as often as there is a fit occasion and opportunity; unless there be some such impediment, as I spake of but now, etc. ‘[Greek] Hoc est frustra, quod sua natura in alterius gratiam est comparatum, quando non perficit id, cujus gratia est, &amp; natura comparatum est.’ (Aristotle, bk. 2, Physics, text 62. ‘Now if that may be said in vain which does not reach that end unto which it was appointed, much more may that be said so which is never used or applied for the compassing of that end.’ Secondly, The edification of the Church of Christ is, as the London divines say well, that eminent scope and end why Christ gave Church Government, and all other ordinances of the New Testament to the Church, 2 Cor. 10:8; 2 Cor. 13:10. The power then both of Order and Jurisdiction are both to be employed to the edification of the Church. The power of jurisdiction the minister cannot exercise singly by himself, without other Church officers. The power of order he may: For he alone is the seat and receptacle thereof. …Now a minister ought to exercise and employ for the edification of the Church all the power and authority that he may lawfully exercise. For, not to employ it, were with the slothful servant in the parable to hide his talent in the earth.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/henry-jeanes.html">Henry Jeanes</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Want of Church-Government</cite>, … (London, 1650) Jeanes was an English presbyterian., pp. 26-27</span></figcaption>

<blockquote><p>It is said [about the divine right of Church government] that, ‘All this is but a plea for a dominion of an higher nature, even over the consciences of men by censures.’ But why a dominion? Because a power of censures? Surely, if they were not spiritual censures, and such as have influence on the conscience, we should yield a domination were the business. But this power of censuring spiritually is as strong as authoritative in dispensing rebukes, threats, Gospel-charges and commands in the Word preached, as in censures; The power is ministerial only in the Word, not lordly; and why should it be deemed a dominion, and an arbitrary power in the one, and not in the other?</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/samuel-rutherford.html">Samuel Rutherford</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Divine Right of Church Government</cite>, ... (1646), ‘To the Ingenuous and Equitable Reader’, unnumbered page</span></figcaption>

<blockquote><p>Conclusion 3. We hold that the Church of God has power to prescribe ordinances rules, or traditions, touching time and place of God’s worship, and touching order and comeliness to be used in the same: and in this regard, Paul, 1 Cor. 11:2, commends the Church of Corinth for keeping his traditions, and Acts 15, the Council at Jerusalem decreed that the Churches of the Gentiles should abstain from blood and from things strangled. This decree is termed a tradition, and it was in force among them so long as the offence of the Jews remained. And this kind of traditions, whether made by general councils or particular synods, we have care to maintain and observe; these caveats being remembered: First, that they prescribe nothing childish or absurd to be done: Secondly, that they be not imposed as any parts of God’s worship: Thirdly, that they be severed from superstition or opinion of merit: Lastly, that the Church of God be not burdened with the multitude of them.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/william-perkins.html">William Perkins</a></span><span class="wk"><span class="lbl">Work:</span> <cite>A Reformed Catholike: or, A Declaration showing how near we may come to the present Church of Rome in sundry points of religion: and wherein we must forever depart from them</cite>, … ([Cambridge,] 1598), 7th Point, ‘Of Traditions’, pp. 136-7</span></figcaption>

<blockquote><p>Question. And if it be questioned how can any truth be kept [back], or any duty forborne? Should not all sin be reproved and can we be truthful to God and the people and not reprove sin or in forbearing any necessary duty, suppose it be to censure and maintaining authority of adjudications? Answer. The question is not wither duty should be forborne or if all sin should be reproved, but of the right means how to get such a sin taken with and how to get such duty done rightly. [2.] The speaking of all truth and doing of all duty is not a duty simply lying on ministers at all times, for that which may not edify is not a duty. Besides that, all ministers know not all truth; therefore speaking of truth and doing of duty must be so gone about as they preach such and such a particular truth, to convince of this or that sin, or bring to the doing of such a duty, principally to edify the body of Christ, [and for] the saving of people’s souls. And if the forbearing of such a truth or the not pressing such a duty for a time gain the soul sooner, is he not bound to make his practice subservient to that end? To clear it in a similitude: a man gets a commission to take in a strong city, but he is not obliged to take it in at such a strong port that is strongly fortified and at no other, but he is left to skill how to go about it or where to assault it. Will not wisdom say it were better to go to a part that is weaker or a part where either is more easy access and entry to be had, his commission being principally to take in the town and not that port now? A minister’s work is to cast out Satan, and all lusts out of the soul, and to bring every thought in subjection to Christ, and whither is it wisdom to batter at one door of the soul that is strongly fortified against such a truth, or to look to win in by another that is less controverted, wisdom would say it is best to labor to win in on the soul by a truth that is less controverted and then it is far more easy to win that sort the sinner, keeps and gains the city. This was the way Paul took, and directs ministers to use this holy wisdom and prudence, not stinting them to one gate [way] of pressing to duty or proponing [setting forth] truths, or convincing of sin, but leaving room to them to follow that way which may most edify, and to choose matter and method of proceeding as may be most subservient to that end. For when folks are confirmed in a thing and have a prejudice at that [which] may be spoken against it, it is a double work to a minister to set on a sin that is both in the affection and judgment. It is far better going in at another port than were the prejudice is fixed. Hence Paul leaves controverted questions of the law and is less preaching down those, but is more in positive truths and sins unquestioned, [and on] principles acknowledged by those he dealt with, and with idolaters and superstitious Samaritans beginning with preaching Christ, and not first falling on their idols, which might mar the other.</p></blockquote>

<main class="wrap"><figure class="quote" id="q-3d18ff0399" data-kw="">
<blockquote><p>Vers. 14. For sin shall not have dominion over you; for ye are not under the Law, but under Grace.

Argum. 4. If you contend and fight against sin, the Tyrant shall not recover his dominion over you, which he hath lost, neither shall sin reign over you, but you shall become Conquerors through Christ; therefore ought you to labour after Holiness.

For you are not] Argum. 5. Confirming the former, you are not under the Law, under the Covenant of works, wherein the Commandment exacted strict obedience, but affords no strength to assist in our obedience; but you are under Grace, or the Covenant of Grace, wherein the Grace of God, with the Command, confers life to Believers, and strength to obey; therefore certain of the victory against sin, ye ought to endeavour after Holiness.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/david-dickson.html">David Dickson</a></span><span class="wk"><span class="lbl">Work:</span> <cite>An exposition of all St. Paul’s epistles together with an explanation of those other epistles of the apostles St. James, Peter, John &amp; Jude: wherein the sense of every chapter and verse is analytically unfolded and the text enlightened</cite>, (London: Francis Eglesfield, 1659), p. 15.</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/the-covenant-of-grace.html">The Covenant of Grace</a></span></div>

<blockquote><p>The Reformed orthodox describe God’s love as an act of the divine will or a movement toward the good–both toward the good in itself and toward the good as it is embodied in the creature. Indeed, the predications of will, love, and goodness conjoin in the basic definition, granting that the divine will is God’s propensity for the good that is ultimately the divine essence itself as the source of all good–and amor [love], strictly defined, is a propensity for the good (Mastricht, Theoretico-practica theol., II.xvii.3, 4, 6; cf. Brakel, Redelijke Godsdienst, I.iii.33. Note the similar definitions in Arminius, Disputationes privatae, XX.iii-iv.), or a desire or ‘appetite for union.’ (Heidanus, Corpus theol., II (p. 172).)</p></blockquote>

<blockquote><p>The Reformed, although they do not at all deny that words that express affections, just as words that express body parts, are employed to speak of God in the Scriptures, and although likewise they acknowledge that when every imperfection is removed from the affections, the substance of those words is in God, even so do not dare to allow in God these disturbances, in which almost the whole nature of affections consists.</p></blockquote>

</figure><figure class="quote" id="q-6a77a27b91" data-kw="conditions">
<blockquote><p>Third, if the covenant be viewed in relation to the first sanction in Christ, it has no previous condition, but rests upon the grace of God and the merit of Christ alone. But if it is considered in relation to its acceptance and application to the believer, it has faith as a condition (uniting man to Christ and so bringing him into the fellowship of the covenant). If, however, in relation to its consummation with faith (obedience and the desire of holiness), it has the relation of condition and means because without them no one shall see God. Source of explanation.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/francis-turretin.html">Francis Turretin</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Institutes of Elenctic Theology</cite>, 12.3</span></figcaption>

</figure><figure class="quote" id="q-6a3f19b66b" data-kw="">
<blockquote><p>When God had caused his everlasting decree to fall in labour, and had delivered it by giving the world a being, and upon infinite consultation had formed man to be his viceroy over all the works of his hands, he embarked him, with all abilities needful for such a voyage, in the bottom of the covenant of works.

Adam set forth fully furnished with skill, and richly fraught with all the fortunes, hopes, and happiness of mankind; but he had scarce launched out of sight, before Satan, who knew very well the worth of the prize, envying man the haven of bliss to which he was sailing, and envying God, who was the owner, the honour of such a venture, raised a storm, whereby the vessel, through the unfaithfulness of Adam, the pilot, ran upon a rock and miscarried. Oh what a joyful spectacle was that to Satan!

What a doleful sight to Adam, to behold himself, and all his posterity, sinking into the boundless, bottomless ocean of destruction and misery, through his falseness and treachery! when, lo, on a sudden the glorious God, out of the superabundant riches of his mercy, resolving that the devil should never rob him of the honour of that manifold wisdom, unsearchable goodness, and almighty power, which had been manifested in the work of creation, did provide and cast out the covenant of grace, a plank sufficient for his poor shipwrecked creature to swim safe to shore on.

As all the rivers meet in the sea, and all the lines in the centre, so do all the comforts of mankind meet in this covenant. The whole Scripture is ‘sincere milk,’ but this covenant is the cream of it: all our mercies are contained in it, all our hopes are sustained by it, and our heaven is at last attained through it.

The blessed God doth not only enter into a covenant of mercy, but out of compassion to our infirmities, hath been pleased to confirm it by his hand and seal: by his hand in his word, by his seals, by the privy-seal of his Spirit, and by the broad seals of the sacraments, that by these ‘immutable things, in which it is impossible for God to lie, we might have strong consolation, who have fled for refuge, to lay hold upon the hope set before us,’ Heb. vi. 18.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/george-swinnock.html">George Swinnock</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Christian Man’s Calling</cite>, (1661-65) in The Works of George Swinnock, M.A. (5 vols, Edinburgh: James Nichol, 1868), 1: 172.</span></figcaption>

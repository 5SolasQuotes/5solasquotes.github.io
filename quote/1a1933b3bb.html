<main class="wrap"><figure class="quote" id="q-1a1933b3bb" data-kw="">
<blockquote><p>Yea if the Covenant of the Gospel, that is, of life and salvation by Christ, be as absolute, without any condition on man’s part, as that with Noah concerning the not drowning of the whole world again (Gen. 9:9-10), then it is all one whether men receive it, and believe it, or no: the promise of life and salvation, and the covenant made with Christ concerning it, shall be made good unto them, as well as that made with Noah, shall be made good unto men, whether they know it and heare it, and believe it or not.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/thomas-gataker.html">Thomas Gataker</a></span><span class="wk"><span class="lbl">Work:</span> <cite>A Mistake or Misconstruction Removed (Whereby little difference is pretended to have been acknowledged between the Antinomians &amp; us)… (London: Clifton, 1646)</cite>, p. 25</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/the-covenant-of-grace/conditions-of-the-covenant.html">Conditions of the Covenant</a></span></div>

</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-29e7141547" data-kw="">
<blockquote><p>Does it not seem that the condition of the Gospel Covenant is violated of many as truly as of the Legal Covenant? It is as truly violated by many; but it is not violated by as many. For the condition of the Legal Covenant is violated of all; Yea it is impossible to be kept, even to the penitent; But the condition of the Gospel Covenant is otherwise, etc. There was therefore need of a New Covenant, unless mankind should perish, etc. Certainly no man is saved but by a Covenant kept; therefore the Covenant by which men are saved, is not the same with that by which no man is saved, it being kept by no man.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/john-cameron.html">John Cameron</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Works… (d. 1625; Geneva: Chovet, 1658), as trans. in Richard Baxter, Richard Baxter’s Confession of his Faith… (London: 1655), ch. 10, sect. 3, pp. 379-80 | Questions on Hebrews | on Heb. 8:9</cite>, p. 413</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/the-covenant-of-grace/conditions-of-the-covenant.html">Conditions of the Covenant</a></span></div>
<div class="actions"><button class="copy" data-copy="“Does it not seem that the condition of the Gospel Covenant is violated of many as truly as of the Legal Covenant? It is as truly violated by many; but it is not violated by as many. For the condition of the Legal Covenant is violated of all; Yea it is impossible to be kept, even to the penitent; But the condition of the Gospel Covenant is otherwise, etc. There was therefore need of a New Covenant, unless mankind should perish, etc. Certainly no man is saved but by a Covenant kept; therefore the Covenant by which men are saved, is not the same with that by which no man is saved, it being kept by no man.”

</figure><figure class="quote" id="q-b86df6a6a3" data-kw="">
<blockquote><p>Most broadly understood it [a condition] includes anything that is required in any way for the covenant of grace, whether: (1) antecedently, and as it were in a preparatory fashion, in which sense the hearing of the promulgated covenant, a general assent given to the divine Word, a conviction of the necessity of the covenant of grace, an effectual call to faith (prior to faith, if not in time, at least in nature), an acknowledgement and sense of one’s misery, a godly desperation about oneself and all things outside the Mediator, and so forth, can be called a condition. Or, (2) concomitantly, in which manner self-denial (Lk. 9:23; Phil. 3:4–12), the exercise of repentance (Mk. 1:15; Acts 2:38–39), and so forth, can be taken as a condition. Or, (3) consequently, as covenantal duties, in which sense evangelical obedience (cf. Gen. 12:1–3; 15:18; 17:1–2; 9:1–15) and renewal of repentance (Dt. 30:1–9 with 29:24 to the end) can be admitted as a condition.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/petrus-van-mastricht.html">Petrus van Mastricht</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Theoretical Practical Theology (2nd ed. 1698; RHB), vol. 4, pt. 1, bk. 5, ch. 1, ‘The Covenant of Grace’, sect. XXII, ‘What the condition of the covenant of grace is’</cite>, p. 24</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/the-covenant-of-grace/conditions-of-the-covenant.html">Conditions of the Covenant</a></span></div>
<div class="actions"><button class="copy" data-copy="“Most broadly understood it [a condition] includes anything that is required in any way for the covenant of grace, whether: (1) antecedently, and as it were in a preparatory fashion, in which sense the hearing of the promulgated covenant, a general assent given to the divine Word, a conviction of the necessity of the covenant of grace, an effectual call to faith (prior to faith, if not in time, at least in nature), an acknowledgement and sense of one’s misery, a godly desperation about oneself and all things outside the Mediator, and so forth, can be called a condition. Or, (2) concomitantly, in which manner self-denial (Lk. 9:23; Phil. 3:4–12), the exercise of repentance (Mk. 1:15; Acts 2:38–39), and so forth, can be taken as a condition. Or, (3) consequently, as covenantal duties, in which sense evangelical obedience (cf. Gen. 12:1–3; 15:18; 17:1–2; 9:1–15) and renewal of repentance (Dt. 30:1–9 with 29:24 to the end) can be admitted as a condition.”

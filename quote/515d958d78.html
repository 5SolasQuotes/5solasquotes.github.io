<main class="wrap"><figure class="quote" id="q-515d958d78" data-kw="">
<blockquote><p>In this sacrament there are two things, a visible sign, and an invisible grace: there is a visible sacramental sign of bread and wine; and there is the thing and matter signified, namely the body and blood of Christ: there is an earthly matter, and an heavenly matter.

The outward sacramental sign is common to all; as well the bad, as the good. Judas received the Lord’s bread; but not that bread, which is the Lord to the faithful receiver. The spiritual part, that which feedeth the soul only the faithful do receive.

For he cannot be partaker of the body of Christ, which is no member of Christ’s body. This food offered us at the Lord’s table is to feed our souls withal; it is meat for the mind, and not for the belly. Our souls being spiritual can neither receive, nor digest that which is corporal, they feed only upon spiritual food. It is the spiritual eating that giveth life. The flesh saith Christ, doeth nothing profit. We must lift up our selves from these external and earthly signs, and like Eagles fly up and sore aloft; there to feed on Christ, which sitteth on the right hand of his father, whom the heavens shall keep until the latter day.

From thence and from no other Altar shall he come, in his natural body to judge both quick and dead. His natural body is local, for else it were not a natural body; his body is there, therefore not here: for a natural body doth not occupy sundry places at once. Here we have a sacrament, a sign, a memorial, a commemoration, a representation, a figure effectual of the body and blood of Christ.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/edwin-sandys.html">Edwin Sandys</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Sermons made by the most reverend Father in God, Edwin, Archbishop of York, primate of England and metropolitan</cite>, (London: Henry Midleton, 1585), p. 75.</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/the-lords-supper.html">The Lord&#x27;s Supper</a></span></div>

</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-9ad7b51dbc" data-kw="">
<blockquote><p>In the Supper of the Lord, the external minister holds forth the external symbols, the bread of the Lord and the wine of the Lord, which are perceived by the organs of our body, consumed and swallowed. The internal minister, the Holy Spirit, not by external organs of the body, but by his secret virtue, feeds the souls of the faithful, both truly and efficaciously, with the body and the blood of the Lord unto eternal life, as truly as they know themselves to be nourished for this mortal life by bread and wine.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/john-calvin.html">John Calvin</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Calvin: Theological Treatises</cite>, J. K. S. Reid, Calvin: Theological Treatises (Louisville, KY; London: Westminster John Knox Press, 1954), 174.</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/the-lords-supper.html">The Lord&#x27;s Supper</a></span></div>

</figure><figure class="quote" id="q-87e52ffea1" data-kw="">
<blockquote><p>1. The Question is, Whether we shall oppose all the Lights of our Senses, which say, that the Signs of the Eucharist are Bread and Wine; and if we shall believe, that God doth continually offer Illusion to our Senses, which is opposite to his Verity and to his Purity.

2. The Question is, Whether we must suppose, that God doth every Moment, and without necessity violate the Laws of Nature, that are most inviolable, which is opposite to his Wisdom.

3. The Question is, Whether we shall receive a Theology, whereof the Consequences destroy all Christian Religion; a Theology which confounds Body and Soul, and takes away the Bounds that distinguish them. A Doctrine, which supposing the Flesh of Christ becomes Spiritual, Invisible, subsisting under a Point, confounds the Body with the Soul. For I know not how else we can define the Properties of the Soul, but in saying, She is Invisible, without Extension, without Space, and concluded under a Point.

This Doctrine also confounds Human Nature with the Divine; for it gives to the Flesh of Jesus Christ that which belongs only to his Divinity, that is, to be in many Places at once, and be able to fill Heaven and Earth. It destroys the Article of Ascension, and robs the Church of that Proof, which she made use of against those Heretics who denied the Truth of the Human Nature of Jesus Christ; so they opposed them by a Proof drawn from thence, That during the Life of the Lord, Men had always seen in him all the Actions, the Motions and Properties of Man. This Reasoning will be nothing worth, if a Body can be without its Properties, and if the Properties of a Body can be without a Body.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/pierre-jurieu.html">Pierre Jurieu</a></span><span class="wk"><span class="lbl">Work:</span> <cite>A preservative against the change of religion, or, A just and true idea of the Roman Catholick religion, opposed to the flattering portraictures made thereof, and particularly to that of my Lord of Condom</cite>, trans. Claudius Gilbert (London: Thomas Cockerill, 1683), pp 125-26.</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/the-lords-supper.html">The Lord&#x27;s Supper</a></span></div>

</figure><figure class="quote" id="q-14bed2b0c7" data-kw="">
<blockquote><p>This communion and fellowship of man with God, was first founded on a covenant of works made with Adam in paradise. If he did obey, and did not eat of the forbidden fruit, he should have life both for himself and his posterity; the which covenant, because God would not have forgotten, he afterward renewed in the delivery of the ten commandments, requiring from man obedience to them in his own person, exactly, at all times, perpetually: promising life on the obedience, and threatening death and cursing if he continued not in everything the law required to do. But this fellowship being placed in man’s own freedom, and having so weak a foundation, he lost both himself and it, so that now by the first covenant of works, Adam and all his posterity are under a curse; for we cannot fulfill the law that requires personal obedience, perfect obedience, and exact obedience. He that ‘continues not in all is cursed,’ Gal. 3:10. The law then finds us dead and kills us. It finds us dead before, and not only leaves us dead still, but makes us more dead.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/richard-sibbes.html">Richard Sibbes</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Complete Works of Richard Sibbes</cite>, ed. Alexander Balloch Grosart, vol. 6 (Edinburgh; London; Dublin: James Nichol; James Nisbet and Co.; W. Robertson, 1863), 3. [spelling modernized]</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/the-lords-supper.html">The Lord&#x27;s Supper</a></span></div>

<blockquote><p>…Christ’s greatest soul trouble as a Son (for that He was essentially) was in that his holy soul was sadded and made heavy even to death, for sin, as sin, and as contrary to his Father’s love. The elect sinned against the Lord, not looking to Him, as either Lord, or Father: but Christ paied full dear for sin…</p></blockquote>

<blockquote><p>46. The assumption of the human nature in the divine hypostasis did not cause any change in the divine nature, but only in the human nature. For all change is either generation or corruption or augmentation or diminution or alteration or local motion. Nothing of this kind, however, takes place in the divine nature. 47. The union of both natures of Christ is incomprehensible to us. The reason is that it is a union of the finite with the infinite. Even if the union between Christ and the Church is incomprehensible to us, all the more this mystery.</p></blockquote>

<blockquote><p>§X. The Son assumed the human nature from the blood of the Virgin Mary by the power of the Holy Spirit. §XI. And although the Holy Spirit can be said to have formed Christ’s body, created His soul, and joined them together, the Holy Spirit is not, however, the father of Christ, since nothing is generated from Him.</p></blockquote>

</figure><figure class="quote" id="q-78af632c0e" data-kw="">
<blockquote><p>Pantachus [a Lutheran]: As you say, the Word of God is certainly impassible and immutable, but because of the hypostatic union the Word [logos], so to speak, was affected in the same way as if it had suffered and died. Orothetes [reformed]: Except for your interjection ‘so to speak,’ I would reject your statement as unacceptable. For the Word of God is not affected since He is in no way changed. You have a case of why the Scriptures and the Fathers sometimes use such terminology in that they are mainly concerned with the Person. Neither was it possible, because of the unity of the two natures, for the divine hypostasis not to be present at the passion and death. But as Irenaeus said most wisely, ‘The Word was present and remained and acquiesced [consented and allowed], but He Himself did not die or suffer. Likewise our soul is present to man at death, that is, to the flesh, but the soul itself does not die. Hence let us confess that Christ suffered and died, but in the flesh, as Peter says [1 Pet. 4:1], or as regards the man.’ (For Irenaeus as quoted by Theodoret, see PG 83:284) Cyril was somewhat more forceful in the struggle against Nestorius, who pulled apart the natures and acknowledged no union of the divine nature with the human other than one based on merit… Cyril urged this union so hard that at first his teaching was rejected. For he spoke as if he believed that the Word of God Himself had literally suffered and died. But when he later explained his terminology, he was accepted as a faithful and sound teacher. Besides, when Eutyches was later condemned by the Council of Chalcedon for imagining that Christ had only one nature and maintaining that the Word of God was turned into flesh and had really and truly suffered, been crucified, and died in his own nature, more caution was observed in the sermons, statements, and terminology… Hence when we regard as verbal the communication of idioms [properties] what is impossible for either the human or the divine nature, it is verbal in this way: it has the hypostatic union as a solid root and firm foundation. Hence it does not follow that we say that Christ is God only verbally. We confess that He really is God and consubstantial with the Father regarding the divine nature, although his human nature is not divine. But you Pantachus, with considerable contempt have gathered from our statements the conclusion that for us Christ is God nominally. Who could plausibly think that about us, who testify in most explicit terms that there never existed in Christ a human nature without its adhering to the divine person?… I beg you, tell us whether according to your [Lutheran] ubiquity [of the human nature], if I understand with my mind and not my body and I hunger with my body and not my mind, do I therefore hunger or understand only verbally? Similarly when we say that Christ truly and suffered and died insofar as He was a man, you cannot rightly construe this as if He suffered and died only verbally… …although I deny that the Word of God really suffered and died, still I do not claim that the passion and death did not involve it at all, for the Word was present at the passion and death, as has been said, because of the hypostatic union, although in a quiescent way. It was not affected by any suffering or by a new quality. Hence it is not empty words that the Son of God suffered and died since that nature and flesh which He made his own and to which He was present by a union of Person, really and truly suffered and died. But I would never say, as you are used to asserting, that the Word [logon] Himself really and truly both suffered and died. … …I see your [Pantachus’s] explanation as admitting two interpretations. The first is that you understand the Son of God to have suffered and died in the sense that the passion and death sprang from the human nature but nonetheless so that they reached to the Word itself and reached in a way that the Word truly suffered and died. Some expressions of Cyril back at the Council of Ephesus conveyed that sense, which seriously offended many people. Surely it should be beyond dispute that the Word is impassible and immutable. Therefore I will not agree with such a statement. Neither do I retreat from the interpretation given by Cyril himself… The second sense is that which we usually express when we say that Christ suffered and died not from the nature of the Godhead but from the nature of the humanity, namely that the passion and death proceeded from the humanity and were terminated in it since they did not pass through nor penetrate the Word itself because it could neither die nor suffer. But if they Word is said to die and suffer, that means that the nature which it made its own through the incarnation died and suffered. Cyril expressed clearly this point in the passage you quoted when he writes: ‘The Word calls its own things which are proper to the flesh,’ and so forth. (PG 75:1405) It was not speaking falsely in calling them its own since they belong to that flesh that it assumed in the hypostatic union.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/peter-martyr-vermigli.html">Peter Martyr Vermigli</a></span><span class="wk"><span class="lbl">Work:</span> <cite>A Dialogue on the Two Natures in Christ</cite>, ed. &amp; trans. John Donnelly in The Peter Martyr Library, vol. 2, pp. 59-62</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/the-person-of-christ/union-of-the-two-natures.html">Union of the Two Natures</a></span></div>

at the Word truly suffered and died. Some expressions of Cyril back at the Council of Ephesus conveyed that sense, which seriously offended many people. Surely it should be beyond dispute that the Word is impassible and immutable. Therefore I will not agree with such a statement. Neither do I retreat from the interpretation given by Cyril himself… The second sense is that which we usually express when we say that Christ suffered and died not from the nature of the Godhead but from the nature of the humanity, namely that the passion and death proceeded from the humanity and were terminated in it since they did not pass through nor penetrate the Word itself because it could neither die nor suffer. But if they Word is said to die and suffer, that means that the nature which it made its own through the incarnation died and suffered. Cyril expressed clearly this point in the passage you quoted when he writes: ‘The Word calls its own things which are proper to the flesh,’ and so forth. (PG 75:1405) It was not speaking falsely in calling them its own since they belong to that flesh that it assumed in the hypostatic union.”

taining+that+the+Word+of+God+was+turned+into+flesh+and+had+really+and+truly+suffered%2C+been+crucified%2C+and+died+in+his+own+nature%2C+more+caution+was+observed+in+the+sermons%2C+statements%2C+and+terminology%E2%80%A6+Hence+when+we+regard+as+verbal+the+communication+of+idioms+%5Bproperties%5D+what+is+impossible+for+either+the+human+or+the+divine+nature%2C+it+is+verbal+in+this+way%3A+it+has+the+hypostatic+union+as+a+solid+root+and+firm+foundation.+Hence+it+does+not+follow+that+we+say+that+Christ+is+God+only+verbally.+We+confess+that+He+really+is+God+and+consubstantial+with+the+Father+regarding+the+divine+nature%2C+although+his+human+nature+is+not+divine.+But+you+Pantachus%2C+with+considerable+contempt+have+gathered+from+our+statements+the+conclusion+that+for+us+Christ+is+God+nominally.+Who+could+plausibly+think+that+about+us%2C+who+testify+in+most+explicit+terms+that+there+never+existed+in+Christ+a+human+nature+without+its+adhering+to+the+divine+person%3F%E2%80%A6+I+beg+you%2C+tell+us+whether+according+to+your+%5BLutheran%5D+ubiquity+%5Bof+the+human+nature%5D%2C+if+I+understand+with+my+mind+and+not+my+body+and+I+hunger+with+my+body+and+not+my+mind%2C+do+I+therefore+hunger+or+understand+only+verbally%3F+Similarly+when+we+say+that+Christ+truly+and+suffered+and+died+insofar+as+He+was+a+man%2C+you+cannot+rightly+construe+this+as+if+He+suffered+and+died+only+verbally%E2%80%A6+%E2%80%A6although+I+deny+that+the+Word+of+God+really+suffered+and+died%2C+still+I+do+not+claim+that+the+passion+and+death+did+not+involve+it+at+all%2C+for+the+Word+was+present+at+the+passion+and+death%2C+as+has+been+said%2C+because+of+the+hypostatic+union%2C+although+in+a+quiescent+way.+It+was+not+affected+by+any+suffering+or+by+a+new+quality.+Hence+it+is+not+empty+words+that+the+Son+of+God+suffered+and+died+since+that+nature+and+flesh+which+He+made+his+own+and+to+which+He+was+present+by+a+union+of+Person%2C+really+and+truly+suffered+and+died.+But+I+would+never+say%2C+as+you+are+used+to+asserting%2C+that+the+Word+%5Blogon%5D+Himself+really+and+truly+both+suffered+and+died.+%E2%80%A6+%E2%80%A6I+see+your+%5BPantachus%E2%80%99s%5D+explanation+as+admitting+two+interpretations.+The+first+is+that+you+understand+the+Son+of+God+to+have+suffered+and+died+in+the+sense+that+the+passion+and+death+sprang+from+the+human+nature+but+nonetheless+so+that+they+reached+to+the+Word+itself+and+reached+in+a+way+that+the+Word+truly+suffered+and+died.+Some+expressions+of+Cyril+back+at+the+Council+of+Ephesus+conveyed+that+sense%2C+which+seriously+offended+many+people.+Surely+it+should+be+beyond+dispute+that+the+Word+is+impassible+and+immutable.+Therefore+I+will+not+agree+with+such+a+statement.+Neither+do+I+retreat+from+the+interpretation+given+by+Cyril+himself%E2%80%A6+The+second+sense+is+that+which+we+usually+express+when+we+say+that+Christ+suffered+and+died+not+from+the+nature+of+the+Godhead+but+from+the+nature+of+the+humanity%2C+namely+that+the+passion+and+death+proceeded+from+the+humanity+and+were+terminated+in+it+since+they+did+not+pass+through+nor+penetrate+the+Word+itself+because+it+could+neither+die+nor+suffer.+But+if+they+Word+is+said+to+die+and+suffer%2C+that+means+that+the+nature+which+it+made+its+own+through+the+incarnation+died+and+suffered.+Cyril+expressed+clearly+this+point+in+the+passage+you+quoted+when+he+writes%3A+%E2%80%98The+Word+calls+its+own+things+which+are+proper+to+the+flesh%2C%E2%80%99+and+so+forth.+%28PG+75%3A1405%29+It+was+not+speaking+falsely+in+calling+them+its+own+since+they+belong+to+that+flesh+that+it+assumed+in+the+hypostatic+union.%E2%80%9D%0A%0A%E2%80%94+Peter+Martyr+Vermigli%2C+A+Dialogue+on+the+Two+Natures+in+Christ+ed.+%26+trans.+John+Donnelly+in+The+Peter+Martyr+Library%2C+vol.+2%2C+pp.+59-62&amp;url=https%3A%2F%2F5solasquotes.github.io%2Fquote%2F78af632c0e.html&amp;via=5Solas" target="_blank" rel="noopener">Share on X</a><a class="perma" href="../quote/78af632c0e.html">Permalink</a><a class="src" href="https://reformedbooksonline.com/topics/topics-by-subject/christ/the-human-and-divine-natures-of-christ/#:~:text=Pantachus%20%5Ba%20Lutheran%5D%3A%20As%20you%20say,it%20assumed%20in%20the%20hypostatic%20union&amp;text=Pantachus%20%5Ba%20Lutheran%5D%3A%20As%20you%20say%2C%20the%20Word&amp;text=flesh%20that%20it%20assumed%20in%20the%20hypostatic%20union" rel="noopener" target="_blank">Read it online · Reformed Books Online</a></div>

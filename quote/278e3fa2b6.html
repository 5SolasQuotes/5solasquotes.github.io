<main class="wrap"><figure class="quote" id="q-278e3fa2b6" data-kw="">
<blockquote><p>In context, Samuel Rutherford is discussing the question as to whether or not the reprobates have lost all right to the use of God’s creation as a result of Adam’s fall. In the midst of this, he raises a question concerning thieves being required to make restitution for goods that they have stolen, and he answers in the affirmative. Although I am not sure if this is enough to indicate a change in position from that which he took in his earlier work, A Free Disputation (where he argued that restitution for theft was not among the Mosaic laws of common equity), the reference to the case laws in Exodus 22 implies that the marrow of the laws concerning restitution are still binding:

[A] thief is obliged to restore stolen goods […] They who enjoy that which they may and ought by their own private power, restore, such as ill conquered goods. They sin in using that, true, Proverbs 3:27; Exodus 22:26, 27; Luke 19:8. It’s a sin to withhold the raiment though laid in pawned, which should cover the poor man’s skin in the night, and they have no right to enjoy that.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/samuel-rutherford.html">Samuel Rutherford</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The covenant of life opened; or, a treatise of the covenant of grace</cite>, ed. C. M. McMahon (1654; New Lennox IL, 2005), pp 98-9.</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/civil-government-and-society.html">Civil Government and Society</a></span></div>

</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-1c74c757a8" data-kw="">
<blockquote><p>I am ordained into this Church, resigning, we shall say, all other life prospects which I might be warranted to cherish and devoting to her service all my energies and interests, embarking on her prospects also all the temporal interests on my family. I am then ordained in terms of an Ordination Vow. This vow is not an instrument special in my case, not peculiar to me. It is the vow taken also by all my brothers who in this Church are exactly my peers. It has been already taken by all the brothers who in this transaction of exacting and accepting my vow represent to me and act the part towards me of the Church. Not to mention that they are thus bound by the self-same vow already, taking into account merely that they exact and I render this vow in my ordination, is it conceivable that speaking of this one ordination merely I alone became bound by it? Is this merely a pact on my side without being a compact between me and the Church? . . . Do I then come under obligation to the Church without the Church coming under obligation to me? Who would make an assertion so outrageous? The idea of a vow between creatures of God binding only one party in the transaction is a sheer paralogism [piece of illogical reasoning]. This vow entails very weighty obligations on my side and on the side of the Church the weight of obligation is as great. The obligation is manifestly reciprocal. That inheres in the idea of it. Laying out of view the contingency of my convictions as to the subject-matter of my vow coming to be changed and my leaving the Church accordingly, I am bound by it, aye, and until the Church shall release me. Is it conceivable that all this time the Church should have been silently reserving a right to release herself what time she may be able to outvote me? Is it possible that on what are actually called ‘general impressions’ and considerations of ‘good sense’ it is proposed to regulate anew our Church Communion and I am to be – by a dispensing power, we presume – set free from my ordination vow and the Church from her reciprocal and another is to be substituted in its stead? Has a majority power to do this? Yes, if I have power to change my vow and still continue in the Church. And yes, if the Church was not bound to me by prescribing and accepting my vow… A majority may prove treacherous to a vow, just as an individual may: nor is it in the power of the multiplication table to settle a question of morals. Our ordination vow taking us bound to our Confession settles that we have a Constitution, clearly enough defines it, renders us answerable to it and pledges the Church reciprocally as amenable to it also.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/hugh-martin.html">Hugh Martin</a></span><span class="wk"><span class="lbl">Work:</span> <cite>‘Are We to have No Constitution?’ The Watchword 6</cite>, (April 1, 1871), pp. 4-15 | From Martin’s article:</span></figcaption>

</figure><figure class="quote" id="q-044af23c27" data-kw="">
<blockquote><p>First, the vow must be possible of fulfilment and within our power to perform. For who will vow an impossible thing? Or who will demand it? All vows are therefore described in the Scriptures in terms that are within our power, such as to give God cattle, sheep, houses, land, and so on. Now, chastity is not in our power, as little as are God’s other wonders and graces. But we are all made for marriage, as our bodies show and as the Scriptures state in Gen., ch. 2: “It is not good that man should be alone; I will make him a help meet for him.”

Whoever, therefore, considers himself a man and believes himself to be included in this general term should hear what God, his Creator, here says and decrees for him: he does not wish man to be alone but desires that he should multiply, and so he makes him a helpmeet to be with him and help him so that he may not be alone. This is the Word of God, through whose power procreative seed is planted in man’s body and a natural, ardent desire for woman is kindled and kept alive. This cannot be restrained either by vows or by laws. For it is God’s law and doing. Let him who will be alone abandon the name of man and prove or make himself an angel or spirit, for God does not grant or allow such a condition to a man.

Accordingly we do well when we sing of holy virgins in such a way as to indicate that they lived lives that were angelic rather than human and that they were enabled to live in the flesh and yet without the flesh by a special grace of God. Our bodies are in great part the flesh of women, for by them we were conceived, developed, borne, suckled, and nourished, and so it is quite impossible to keep entirely apart from them. This is in accord with the Word of God. He has caused it to be so and wishes it so. Even the impotent, as we know, are full of natural desire. Indeed, the more impotent they are, the more they desire to be with women, which is altogether natural, for we always desire most what we can least have.

Therefore, whoever will live alone undertakes an impossible task and takes it upon himself to run counter to God’s Word and the nature that God has given and preserves in him. The outcome is in keeping with the attempt; such persons revel in whoredom and all sorts of uncleanness of the flesh until they are drowned in their own vices and driven to despair. For this reason such a vow against God’s Word and against nature, being impossible, is null and void. And God also condemns it just as if somebody should vow to be God’s mother or to make a heaven.</p></blockquote>

<blockquote><p>So when God layeth sin to the charge of the sinner, in punishing it, He is said to lay a burden on the sinner, 2 Kings 9:25. And to remove this burden, is to pardon the sin. 2 Chron. 7:14, “If my people humble themselves, then will I hear from heaven, and will forgive their sin, and will heal their land;” by removing the locusts and the pestilence. See, the pardoning of their sin is exponed [expounded] to be the removing of the locusts and pestilence [2 Chron. 7:13].</p></blockquote>

<blockquote><p>What the period of embryonism is, and what the beginning of animation, neither Hippocrates, nor Galen, nor Aristotle know; but He knows who knows all things. For the precise definition of that matter is endured neither by the diversity of the seed itself from time to time, nor by the different disposition of the uterus or of the whole mother.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/gisbertus-voetius.html">Gisbertus Voetius</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Select Theological Disputations</cite>, vol. 1, pt. 2 tr. by AI by Onku (Utrecht: Johannes a Waesberg, 1648) Latin | Disputations on Creation, Appendix 1 | After problem 24, pp. 332-33 | “Problem 3: At what time the soul is infused into the body. | Where there is an open distinction between pregnant women in whom the fetus is animated [animatus est, ensouled], and in whom it is not. It is therefore expedient to know when it is animated. | But the foundation is slippery. For it is not certain to us from that passage that the reason for that law is a certain period of formation. From the same passage one could conclude that the fetus is animated on the seventh or fourteenth day, namely because the members are then conformed, although the perfect formation is extended to the fortieth or eightieth day, since even that is not simply necessary for the soul to be received. But he will prove it from the fact that the graver impurity is terminated on the eighth day, if she had borne a male, but on the fifteenth, if a female. Hurtado in the cited disputation, section 112, says:</span></figcaption>

<main class="wrap"><figure class="quote" id="q-77fd343af0" data-kw="">
<blockquote><p>[T]he Son of God, having been constituted by the Father as Mediator of the covenant, the guarantor on two counts: 1) He shall satisfy for the sins of all those whom the Father has given him (John 17) and he decreed from eternity to adopt them into sonship wrought Christ (Ephesians 1); 2) He shall also bring to pass that they, being planted in him, shall enjoy peace of conscience and be renewed daily in the image of God.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/caspar-olevianus.html">Caspar Olevianus</a></span><span class="wk"><span class="lbl">Work:</span> <cite>De substantia foederis gratuiti inter deum et electos</cite>, (1585), 1.2.1 in R. Scott Clark, Caspar Olevian and the Substance of the Covenant (p 178)</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/the-covenant-of-grace.html">The Covenant of Grace</a></span></div>
<div class="actions"><button class="copy" data-copy="“[T]he Son of God, having been constituted by the Father as Mediator of the covenant, the guarantor on two counts: 1) He shall satisfy for the sins of all those whom the Father has given him (John 17) and he decreed from eternity to adopt them into sonship wrought Christ (Ephesians 1); 2) He shall also bring to pass that they, being planted in him, shall enjoy peace of conscience and be renewed daily in the image of God.”

</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-a534325fc2" data-kw="">
<blockquote><p>…why then did Christ here urge the testimony of John? Why, these things I say, that you may be saved. This He aimed at in all this discourse, to save not his own life, but the souls of others; He produced John’s testimony because, being one of themselves, it was to be hoped that they would hearken to it. Note, First, Christ desires and designs the salvation even of his enemies and persecutors. Secondly, the word of Christ is the ordinary means of salvation. Thirdly, Christ in his word considers our infirmities and condescends to our capacities, consulting not so much what it befits so great a prince to say as what we can bear, and what will be most likely to do us good.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/matthew-henry.html">Matthew Henry</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Commentary on the Bible</cite></span></figcaption>

</figure><figure class="quote" id="q-316d33ca96" data-kw="">
<blockquote><p>Observation 5. Christ the Bridegroom and His Father are very willing to have the match made up and the marriage completed… therefore they expostulate when this marriage is refused, “O Jerusalem, Jerusalem, how often would I have gathered you, but you would not!” (Mt. 23:37). “O Jerusalem, Jerusalem, if thou, even thou, hadst known in this thy day the things that belong to thy peace!” (Lk. 19:42). All these sad complaints, that Israel would not hearken to his voice, and his people would have none of Him (Ps. 81:11), that He came to His own, and His own received Him not (Jn. 1:11), and that they will not come to Him that they might have life (Jn. 5:40), make out His willingness abundantly and undeniably.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/james-durham.html">James Durham</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Unsearchable Riches of Christ</cite>, (1764; Soli Deo Gloria, 2002), sermon 3, ‘Gospel Presentations are the Strongest Invitations’, p. 55 on Mt. 22:4, ‘All things are ready; come to the marriage.’</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/the-covenant-of-grace/the-gospel-offer.html">The Gospel Offer</a></span></div>

online · Reformed Books Online</a></div>
</figure><figure class="quote" id="q-d1bc25edd6" data-kw="">
<blockquote><p>As the term God is more distinctly expressive of majesty, so the term ‘Father’ conveys the idea of clemency and benevolent disposition. It becomes us to contemplate both as existing in God, that his majesty may inspire us with fear and reverence, and that his fatherly love may secure our full confidence. Hence it is not without good reason that Paul has conjoined these two things… At the same time there will be no inconsistency in saying, that he contents himself with the single term, ‘Father’. Farther, as it is necessary that his incomparable grace should be expressed by the term ‘Father’…</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/john-calvin.html">John Calvin</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Commentary on Colossians</cite>, 1:12</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/the-covenant-of-grace/the-gospel-offer.html">The Gospel Offer</a></span></div>

</figure><figure class="quote" id="q-4be16a5051" data-kw="">
<blockquote><p>I answer that, The will is a rational appetite. Now every appetite is only of something good. The reason of this is that the appetite is nothing else than an inclination of a person desirous of a thing towards that thing. Now every inclination is to something like and suitable to the thing inclined. Since, therefore, everything, inasmuch as it is being and substance, is a good, it must needs be that every inclination is to something good. And hence it is that the Philosopher says (Ethic. i, 1) that the good is that which all desire. But it must be noted that, since every inclination results from a form, the natural appetite results from a form existing in the nature of things: while the sensitive appetite, as also the intellective or rational appetite, which we call the will, follows from an apprehended form.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/thomas-aquinas.html">Thomas Aquinas</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Summa</cite>, pt. 1 of 2 | quest. 8, art. 1, Whether the will is of good only?</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/the-covenant-of-grace/the-gospel-offer.html">The Gospel Offer</a></span></div>

<main class="wrap"><figure class="quote" id="q-458a803ab8" data-kw="">
<blockquote><p>Speaking in relation to an overture by the Edinburgh Presbytery to the General Assembly of the Free Church of Scotland, which mentioned the Covenanted Reformation, Robert S. Candlish made the following remarks about the principles of the National Covenant of Scotland and the Solemn League and Covenant:

I take for granted that all who can be possibly expected to approve of this document, will concur in admitting the general lawfulness of what our fathers did on the occasion of the — First and Second Reformations, — that they will acknowledge the lawfulness of the objects for which they allied, and the engagements and vows of the Covenants.

I take it for granted, also, that we will all acknowledge, or that nearly all of us will be prepared to own, that generally, in their substance, the Covenants and engagements into which, on these two occasions, our fathers entered, were lawful in themselves, just and necessary in the circumstances in which they were placed, and in accordance with the Word of God; and I believe that none of us will have any difficulty in owning that, in so far as their engagements were in accordance with the Word of God, suited to the emergencies of the times, based on sound principle, and fitted to promote the cause of Christ, they are to be regarded by us as a superadded obligation laid upon us to hold fast by the principles which they have handed down to us.

The obligation under which we lie to maintain our principles, does not arise primarily from any engagements or covenants of man. We know and we feel that the obligation under which we lie to maintain and carry out these principles primarily and essentially arise out of the authority of the Word of God. We do not desire to maintain the principles for which we have testified, and to follow them out, merely because our fathers did so, and because our fathers bound themselves to do so. We recognise as the only primary obligation the authority of the Word of God.

But when, as in ordinary life, and as in the intercourse of man with man, and still more, in the intercourse of nation with nation, we do own and acknowledge contracts and engagements entered into, as increasing or enforcing the obligation under which men originally lie to do justly to one another, so I think we cannot dispute that in some sense or other, and to some extent or other, if we are identically the Church that entered into engagements in former times, and that was enabled to make attainments in former times, we lie under a superadded obligation to be faithful, and to hand down to the generation following the testimony which has been handed down to us.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/robert-candlish.html">Robert Candlish</a></span><span class="wk"><span class="lbl">Work:</span> <cite>‘Testimony of the Church, 28 May 1847’ in Proceedings of the General Assembly of the Free Church of Scotland, held at Edinburgh, May 1847</cite>, (Edinburgh: W. P. Kennedy, 1847), p. 251.</span></figcaption>

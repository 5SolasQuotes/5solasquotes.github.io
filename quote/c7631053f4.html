<main class="wrap"><figure class="quote" id="q-c7631053f4" data-kw="">
<blockquote><p>Why may not Lutherans and Calvinists of the same nation, town or village have their several churches under their several pastors, and live in peace? Nothing could hinder the said peace but want of Christian humility and charity. And consequently, why among us may not Christians that have invincible diversity of persuasions in matters of Church government live peaceably within the same precincts in their several churches?</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/john-corbet.html">John Corbet</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Nonconformist’s Plea for Lay-Communion with the Church of England, together with a Modest Defense of Ministerial Nonconformity</cite>, ... (London: 1683) | A Defense of my Endeavors for the Work of the Ministry, p. 23</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/the-church/schism-and-heresy.html">Schism and Heresy</a></span></div>

</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-a944fdd3cb" data-kw="">
<blockquote><p>You’ll say the rulers and the generality of the country are to reform it. True, but ’tis usually the knowledge and zeal of holy people, who by their words and doings and sufferings put the rulers upon casting evils out of their kingdoms and churches. [2 Chron. 29:34; 35:15]</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/francis-tallents.html">Francis Tallents</a></span><span class="wk"><span class="lbl">Work:</span> <cite>A Short History of Schism: for the Promoting of Christian Moderation &amp; the Communion of Saints</cite>, (London: Parkhurst, 1705), p. 115 Tallents (1619–1708) was a non-conforming English presbyterian minister.</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/the-church/schism-and-heresy.html">Schism and Heresy</a></span></div>

</figure><figure class="quote" id="q-4585167369" data-kw="Unity">
<blockquote><p>Since there are various species of union—some in evil, others in good and the truth—that unity only is to be proved which rests upon the truth. Hence unity is to be estimated by faith, not faith by unity. And thus the truth of doctrine, on which all true and saving union is founded, must first be known before the church can be evident.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/francis-turretin.html">Francis Turretin</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Institutes of Elenctic Theology</cite>, 18.13.37</span></figcaption>

</figure><figure class="quote" id="q-a9d1505dc2" data-kw="">
<blockquote><p>That there are many things which are not to be approved in the Church, which are not worthy of contention; Calvin, Epistle 51, fol. 100. … That many things must of us be tolerated which is not in our power to reform; Calvin, Epistle 148, fol. 254. That albeit men must endeavor to purge the Church of corruptions which sprung up out of superstition, yet this exception must go along, that certain things although they be not to be approved, yet must be born with all; Calvin, Epistle 305, fol. 504, to John Knox. That some rites and ceremonies, albeit not necessary are yet to be tolerated, or born withall for concord’s sake; Beza, Epistle 8, fol. 70. That as the manners of doting parents, so the customs of our unadvised country must be endured: yea the servitude which is without impiety, and that in matters of lesser nature (in the Church) must be borne withall; Harmony of Confessions §11, fol. 860; Melancthon, Concil. Thelog., pt. 2, fol. 107; and that there is ever some kind of servitude of the Church, more mild somewhere, somewhere more hard: howbeit more or less, there is ever some; Melanchthon, ibid., fol. 92.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/john-sprint.html">John Sprint</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Cassander Anglicanus, showing the Necessity of Conformity to the Prescribed Ceremonies of our Church in Case of Deprivation</cite>, (London: Bill, 1623), ‘Reformed Practices’, pp. 121-22</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/the-church/schism-and-heresy.html">Schism and Heresy</a></span></div>

</figure><figure class="quote" id="q-31c7caa99b" data-kw="">
<blockquote><p>Truth is catholic; error is sectarian, and tends to divide. For there is such a thing as Christian principle, and the force of conscience. And he is the sectarian—not who adheres to fundamental truth and high Christian principle—but who deviates from the truth, and forsakes Christian principle.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/charles-ross.html">Charles Ross</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Inner Sanctuary</cite></span></figcaption>

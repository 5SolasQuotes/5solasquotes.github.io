<main class="wrap"><figure class="quote" id="q-5cada0718d" data-kw="">
<blockquote><p>The Church of Rome makes four senses of the Scriptures, the literal, allegorical, tropological and anagogical, as in this her example: Melchizedek offered bread and wine. The literal sense is that the King of Salem with meat which he brought, refreshed the soldiers of Abraham being tired with travel. The allegorical is that the priest does offer up Christian ye Mass. The tropological is therefore something is to be given to the poor. The Anagogical is that Christ in like manner being in heaven, shall be the bread of life to the faithful. But this her device of the fourfold meaning of the Scripture must be exploded and rejected. There is one only sense, and the same is the Literal. An allegory is only a certain manner of uttering the same sense. The Anagoge and Tropology are ways whereby the sense may be applied.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/william-perkins.html">William Perkins</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Art of Prophesying: or a Treatise concerning the Sacred &amp; Only True Manner &amp; Method of Preaching</cite>, (London, 1607), pp. 30-31</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/holy-scripture/interpretation.html">Interpretation</a></span></div>

</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-4bd5742617" data-kw="">
<blockquote><p>Besides that, we are all priests, as I have said, and have all one faith, one Gospel, one Sacrament; how then should we not have the power of discerning and judging what is right or wrong in matters of faith? What becomes of St. Paul&#x27;s words, &quot;But he that is spiritual judgeth all things, yet he himself is judged of no man&quot; (1 Cor. ii. 15), and also, &quot;we having the same spirit of faith&quot;? (2 Cor. iv. 13). Why then should we not perceive as well as an unbelieving pope what agrees or disagrees with our faith?</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/martin-luther.html">Martin Luther</a></span><span class="wk"><span class="lbl">Work:</span> <cite>To the Christian Nobility of the German Nation</cite>, The Second Wall</span></figcaption>

</figure><figure class="quote" id="q-8292d341b5" data-kw="">
<blockquote><p>I do not doubt that the most ancient fathers, to whom the coming night was the end of one day and the beginning of another, followed this mode of reckoning. Although Moses did not intend here to prescribe a rule which it would be criminal to violate; yet (as we have now said) he accommodated his discourse to the received custom. Wherefore, as the Jews foolishly condemn all the reckonings of other people, as if God had sanctioned this alone; so again are they equally foolish who contend that this modest reckoning, which Moses approves, is preposterous. The first day: Here the error of those is manifestly refuted, who maintain that the world was made in a moment. For it is too violent a cavil to contend that Moses distributes the work which God perfected at once into six days, for the mere purpose of conveying instruction. Let us rather conclude that God himself took the space of six days, for the purpose of accommodating his works to the capacity of men.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/john-calvin.html">John Calvin</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Commentary on Genesis</cite>, 1:5</span></figcaption>

</figure><figure class="quote" id="q-42a48afdd7" data-kw="">
<blockquote><p>Much of recent American Reformed theology has been caught up for some time in a distorted form of biblicism that has fallen into the trap of trying to reinvent the theological wheel in areas where doing so is fraught with danger—in particular, the doctrine of the divine attributes and the doctrine of the Trinity. More often than should be the case, important aspects of these essential doctrines of the Christian faith have been seriously misunderstood and then, on the basis of such misunderstanding, rejected or revised, with disastrous consequences. One way in which these misunderstandings could have been avoided would have been to grapple with the way these doctrines were defined and defended by the greatest theologians of the past, theologians such as Augustine, Gregory of Nazianzus, and yes, even Thomas Aquinas.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/keith-a-mathison.html">Keith A. Mathison</a></span><span class="wk"><span class="lbl">Work:</span> <cite>“Should We Read Thomas Aquinas?” Tabletalk</cite>, (August 10, 2018)</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/holy-scripture/interpretation.html">Interpretation</a></span></div>

</figure><figure class="quote" id="q-82d33e112a" data-kw="Pope as interpreter">
<blockquote><p>The cardinals attend the pope only in the way of ornament and pomp, and have no place in the settling of any definition. Yea, although all the cardinals were to say nay, yet the pope can define what he will. Therefore, although the Jesuit puts a council of pastors along with the pope, yet in reality this authority of interpretation is lodged with the pope alone; because, however much the rest oppose, yet his opinion shall always stand and prevail.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/william-whitaker.html">William Whitaker</a></span><span class="wk"><span class="lbl">Work:</span> <cite>A Disputation on Holy Scripture, Against the Papists, Especially Bellarmine &amp; Stapleton</cite>, Question 5, ch. 3</span></figcaption>

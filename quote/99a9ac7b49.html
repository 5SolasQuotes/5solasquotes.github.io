<blockquote><p>All means of worship devised by men pretending holiness, by teaching, exciting our dull affections to devotion, as if they were powerful means of grace, and did lay a band on the conscience, when as yet they be no such thing, and want all warrant from God, and are contrary to devotion, are unlawful.</p></blockquote>

</figure><figure class="quote" id="q-3750c533ad" data-kw="">
<blockquote><p>The Papists say indeed that all additions corrupting the worship of God are forbidden, but such as further adorn and preserve it are not so, which implies a contradiction, for whereas every addition is principally a corruption because it is an addition, under which notion it is forbidden (and that in the worship of God which is forbidden, is a corruption of it), there can be no such preserving, adorning addition, unless we will allow a preserving and adorning corruption. Neither is it of more force which is pleaded by them that the additions which they make belong not unto the substance of the worship of God, but unto the circumstances of it, for every circumstance observed religiously, or to be observed in the worship of God, is of the substance of it, as were all those ceremonious observances of the [Mosaic] Law which had the same respect in the prohibitions of adding with the most weighty things whatsoever.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/john-owen.html">John Owen</a></span><span class="wk"><span class="lbl">Work:</span> <cite>A Brief Instruction in the Worship of God</cite>, … (London: 1667), Question 14, ‘May not the Church find out and appoint to be observed such religious rites, as being adjoined unto the celebration of God’s instituted worship, may farther the devotion of the worshippers and render the worship itself in its performance more decent, beautiful and orderly…?’, pp. 64-65</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/worship/nature-of-worship.html">Nature of Worship</a></span></div>

</figure><figure class="quote" id="q-b4884cf61b" data-kw="">
<blockquote><p>Step Five: Analysis Becomes Myth At this stage, the explanation stops needing actual proof. Not because the evidence is overwhelming, but because the story has become self-sustaining. It can explain everything if you just try hard enough. … The belief now no longer functions as an explanation of reality, instead it’s a closed or “self-sealing” system. It can’t be tested, corrected, or falsified. And most importantly, it can’t be escaped without significant psychological cost. It’s a bit like a prison. Because at this point, abandoning it would mean admitting that the soothing clarity you felt was an illusion. This allows anxiety back in the front door, often holding hands with public humiliation. For many “disaffected” and isolated young men, this is an intolerable duo to entertain. But once a belief can’t be falsified, it’s no longer analysis. It’s a mythology. And mythology has a dangerous advantage: it feels deeper than facts, like a soul-level insight. You’ve finally seen behind the curtain to where the puppet masters pull the strings. You don’t have to guess or speculate, you know. … Step Six: Myth Becomes Moral Signal This is when conspiracy thinking stops being a private explanation held by an individual, and instead becomes a public signal to others. You can hear it in the language: … ”If you don’t see it, you’re asleep.” ”Once you see it, you can’t unsee it.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/will-spencer.html">Will Spencer</a></span><span class="wk"><span class="lbl">Work:</span> <cite>‘The Eight Steps to Scapegoating’</cite>, (2026)</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/worship/nature-of-worship.html">Nature of Worship</a></span></div>

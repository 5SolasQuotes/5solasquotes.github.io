<main class="wrap"><figure class="quote" id="q-6e81acd84b" data-kw="">
<blockquote><p>But then (say they) this makes things arbitrary and indifferent to become necessary. This is true: but you must conceive that a thing may be said to be necessary two ways: necessary in itself, and necessary in the outward submission to the use of it. In itself, a thing indifferent cannot be made necessary. It is always as it is by nature, and conscience informed must so judge it; yet in the outward use, for the peace of the Church, it may upon command become necessary. After the death of Christ, till the destruction of the temple, abstaining from things strangled and blood, circumcision, legal vows and purifyings were indifferent in themselves, (for else the apostles would not have used them so): yet for the peace of some churches they were judged necessary to be yielded in love; and so may it be in other things: yet the indifferent nature of things is not taken away, but the necessary use prescribed for the peace of the church, upon better grounds than that we should suffer ourselves to be unsettled from royal power [as in his day with the civil government instituting ceremonies].</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/robert-abbot.html">Robert Abbot</a></span><span class="wk"><span class="lbl">Work:</span> <cite>A Trial of our Church-Forsakers. Or A Meditation Tending to still the Passions of Unquiet Brownists, upon Heb. 10:25, Section 10, pp. 94-95 Abbot was a reformed Anglican.</cite></span></figcaption>
<div class="meta"><span class="t"><a href="../topics/civil-government-and-society/marriage-and-family.html">Marriage and Family</a></span></div>

</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-3e90e17e47" data-kw="">
<blockquote><p>Again, if the unbelieving party shall solicit the other and use all means, both fair and foul, to draw him or her to idolatry, the believing party in this case, may go aside for a time and omit the duty of marriage. For this is all one as if the idolatrous and unbelieving party should depart. For indeed, that party is said to depart in whom the cause of departing is, as in the Church he is a schismatic in whom the cause of the schism is, and not always he that separates.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/william-perkins.html">William Perkins</a></span><span class="wk"><span class="lbl">Work:</span> <cite>‘A Warning Against the Idolatry of the Last Times, &amp; an Instruction touching Religious or Divine Worship’ in The Works (London: Legatt, 1626), vol. 1</cite>, p. 692</span></figcaption>

</figure><figure class="quote" id="q-37f089a21d" data-kw="">
<blockquote><p>Question 19: May one [de]part from a husband or wife that has the leprosy or that has the French pox [syphilis] by their adulterous practices, when the innocent persons life is endangered by it. Answer: If it be an innocent person’s disease, the other must cohabit, and tenderly cherish and comfort the diseased; yea, so as somewhat to hazard their own lives, but not so as apparently to cast them away, upon a danger not like[ly] to be avoided, unless the other’s life, or some greater good be like[ly] to be purchased by it. But if it be the pox of an adulterer, the innocent party is at liberty [to divorce] by the other’s adultery, and the saving of their own lives does add thereto. But without adultery the disease alone will not excuse them from cohabitation, though it may from congress [coming together in sexual union].</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/richard-baxter.html">Richard Baxter</a></span><span class="wk"><span class="lbl">Work:</span> <cite>A Christian Directory… (London, 1673), pt. 2, ‘Christian Economics’, ch. 9, ‘Cases About Divorce &amp; Separation’</cite>, p. 539</span></figcaption>

</figure><figure class="quote" id="q-aa0b348ef9" data-kw="">
<blockquote><p>His comforts to me are not dealt with a niggard’s hand, but I would fain learn not to idolize comfort, sense, joy, and sweet felt-presence: All these are but creatures, and nothing but the kingly robe, the gold-ring and the bracelets of the Bridegroom: The Bridegroom Himself is better then all the ornaments that are about Him.</p></blockquote>

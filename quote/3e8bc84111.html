<main class="wrap"><figure class="quote" id="q-3e8bc84111" data-kw="">
<blockquote><p>The Calvinist, on the contrary [to Arminianism], holds that the unregenerate man never ceases to resist and never yields to God of his own motion, but only as he is acted upon by the Holy Spirit and is thereby ‘persuaded and enabled’ to cease resisting and to yield obedience. Ceasing to resist God, he [the Calvinist] contends, is holy action, and so is yielding or submitting to God. To refer this kind of action to the sinful and unregenerate will as its author [as the Arminian does], the Calvinist asserts [this] is contrary to the Scripture declaration, that ‘the carnal mind is enmity against God, and is not subject to the law of God, neither indeed can be,’ Rom. 8:7. A will at enmity with God never of itself ceases resisting Him, and never of itself yields to Him. It must be changed from enmity into love by ‘the washing of regeneration and renewing of the Holy Ghost’ in order to sweet and gentle submission. The sinner, as such, cannot, therefore, assist and co-operate with the Holy Spirit in this work of originating faith and repentance, but the whole of it must be done by that Almighty Agent who can turn the human heart as the rivers of water. Christ, through the Spirit, is the sole ‘author of faith’ (Heb. 12:2). When the Holy Spirit puts forth a higher degree of his energy than He exerts in his ordinary operation, He overcomes and stops the sinner’s resistance instead of the sinner’s overcoming and stopping it of himself, and [the Holy Spirit] inclines the sinner to yield to the Divine monitions [admonitions] and impulse instead of the sinner’s yielding of his own accord [as the Arminian says]. If the sinner’s resistance is ‘overcome’, it is overcome by God’s action [according to the Calvinist]; but if it ‘ceases’, it ceases by the sinner’s action [by his own power, according to the Arminian]. To say that common grace [in the sincere strivings of the Spirit] would [hypothetically] succeed [in salvation] if it were not resisted by man, is not the same as saying that common grace would succeed if it were yielded to by man[‘s independent power, as in Arminianism]. [Hypothetical] Non-resistance is different from ceasing resistance [of the Arminian]. In the former [hypothetical] instance there is no opposition by the man [and thus the common, gracious striving of the Spirit in the gospel call would result in saving grace]; in the latter there is opposition, which is put a stop to by the man[‘s independent power, on the Arminian view]. … According to the monergistic [God alone working] or Calvinistic view of grace, on the contrary [to Arminianism], no man receives a grace that is ‘sufficient for generating faith’ who does not receive such a measure of Divine influence as overcomes his hostile will; so that he does not stop his own resistance but it stopped by the mercy and power of God; so that his faith and repentance are not the result in part of his own efficiency, but solely of the Holy Spirit’s irresistible and sovereign energy in regeneration. In a word, the dependence upon Divine grace in the Calvinistic system [in being saved] is total; in the Arminian is partial. In the former, common grace cannot be made saving grace by the sinner’s co-action; in the latter it can be.</p></blockquote>

<blockquote><p>God, by way of an agreement [pacto], willed our salvation by a simple love [affectu] and that salvation is pleasing to him, so that unless sins hinder it, he effectually wills it… therefore because of this mixed [implicitae] will under a condition, we say that God has a conditional will, or as they say, willingness [velleitatem].</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/john-davenant.html">John Davenant</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Other citations (work not named)</cite>, On John Davenant &amp; Aquinas | Michael Lynch, John Davenant’s Hypothetical Universalism: a Defense of Catholic &amp; Reformed Orthodoxy (Oxford Univ. Press, 2021) | “Davenant also often distinguishes between conditional and absolute decrees with respect to the voluntas simplicis complacentiae. Absolute decrees properly fall under God’s voluntas beneplaciti, whereas God’s voluntas simplicis complacentiae is often expressed conditionally in Scripture. Thus, when Scripture says God wills the salvation of all, it is on the condition of believing in Christ— an act “so agreeable unto Gods will that wheresoever it is found it shall be rewarded.” Consider, for example, God’s voluntas simplicis complacentiae by which God is said to desire or will the salvation of all. This will can be understood as an effectual will (virtually, in itself) with a condition. That is, it is a mixed conditional, as opposed to a mere conditional. As the sixteenth-century Jesuit Gabriel Vásquez explains, pp. 151-52</span></figcaption>

<blockquote><p>All those absolutely, and only those with whom God makes this covenant, are intended. Those whose sins are not pardoned do in no sense partake of this covenant; it is not made with them. For this is the covenant that God makes with them, that he will be merciful unto their sins; that is, unto them in the pardon of them. […] for they are all actually pardoned with whom this covenant is made. And the indefinite declaration of the nature and terms of the covenant, is not the making of a covenant with any.</p></blockquote>

<blockquote><p>The necessity and contingency of things is not to be attributed to God’s decree, but to the working of his power; contingency is when He uses his resistible power; if He works irresistibly then follows necessity: what is contingent to the second cause is infallible to God’s prescience, but necessary to the work of his omnipotency: his decree is a remote cause, which without his power works not. Christ’s death was contingent to the Jews that crucified Him; infallible to God’s prescience, who foresaw that the Jews would kill Him; but necessary in regard of his decree, working by his power in presenting that bitter cup unto Him.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/alexander-ross.html">Alexander Ross</a></span><span class="wk"><span class="lbl">Work:</span> <cite>A Century of Divine Meditations upon Predestination &amp; its Adjuncts</cite>, ... (London: 1646), sect. 25, pp. 24-25</span></figcaption>

<blockquote><p>First, whether may a wicked man, a man as yet not called, be able to resist and keep off his own call? And that you may understand the answer hereto, I must lay down this distinction: that there is a twofold calling of Christ: a significative calling, and an operative calling. First, a significative calling, which is such a calling whereby Christ, in the ministry of the Word, signifies and declares what He would have men to do. Now this kind of call wicked men may resist; this call, I say, and this revealed will of God, in declaring what graces he would have men act, and what sins he would have men forbear. Therefore we read, Acts 7:51, “You stiff-necked people, and uncircumcised in heart and ears, you have always resisted the Holy Ghost”; meaning the preaching of the Word by the ministry of his apostles. So Prov. 1:24, ‘I have called, and ye have refused,’ etc. But then secondly, there is an operative calling, and that is such a call whereby God does not only signify to a man what he must do, but with the signification of his will gives a man a power to do what He calls him to do, accompanying the Word with his Spirit, making the heart stoop and yield to Jesus Christ. Now this call no man can resist; grace is irresistible; and this effectual calling, by the operation of the Spirit, a man cannot resist. All the gainsayings of the heart, and all the stoutness of the will, it must stoop and must be brought under subjection to Jesus Christ. Jn. 6:37, ‘All that the Father hath given Me,’ says Christ, ‘shall come unto Me.’ They shall not be able to withstand Jesus Christ, but they shall come in unto Him. So Isa. 55:10–11: ‘As the rain comes down, and the snow from heaven, and returns not thither again, but waters the earth, to make it bring forth… so shall my word be that goes out of my mouth; it shall not return in vain, but shall accomplish that which I intended, and it shall prosper in the thing whereto I sent it.’ As all the world cannot hinder the rain from coming down on the earth, no more can any man in the world, if God has an intent to convert and call him, hinder the benefit of the Word from redounding upon his soul.</p></blockquote>

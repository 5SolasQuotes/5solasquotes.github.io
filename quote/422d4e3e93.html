<blockquote><p>For the righteousness of Christ is none of ours, till we do repent and believe: let us see how our title does arise, when we thankfully, seriously and broken-heartedly accept Christ as our Lord and Savior, then we are found in Him not having our own righteousness.</p></blockquote>

</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-537ed3534c" data-kw="">
<blockquote><p>The third place is that, Rom. 8:30, ‘Whom God hath predestinated, these He hath called, whom called, justified; whom justified, glorified.’… That sanctification is here comprised in the word ‘vocation.’ For whereas the links of this golden chain are inseparable, and all those that are called must needs be justified and glorified: by ‘vocation,’ must here be meant that calling which is inward and effectual, not that alone which is outward by the external ministry of the Word. For all that are thus called, be not justified, as is apparent; and again, some, as infants, are justified that are not capable of such a [external] calling. But now, wherein stands the inward vocation of a sinner? Is it not in the infusion of inherent sanctifying grace, enlightning his eyes, opening his ear, changing his heart, turning him from darkeness to light, from the power of Satan to the obedience of God; in a word, in the renovation of his faculties? Which, what is it else but sanctification? or regeneration? or conversion? Only styled by that tearm of ‘vocation’ in regard of the means whereby it is ordinarily effected (that is) the preaching of the Word. He must needs coin us some new mystery in divinity who will persuade us that some other work of grace is meant by ‘vocation,’ and not that of sanctification. Therefore we have neither one link snapped out, nor two shuffled together in this chain of our salvation: But four, as distinct, as undividable: Election, Sanctification (whereto we are called by the Gospel preached, 2 Thess. 2:14), Justification by Faith (which is a fruit of sanctification) and Glorification.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/william-pemble.html">William Pemble</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Vindiciae fidei, or A Treatise of Justification by Faith</cite>, … (Oxford, 1625) | section 1, ch. 2, pp. 11-12</span></figcaption>

<blockquote><p>…and first of repentance the continual and inseparable companion of faith. For albeit it be daily made more perfect after justification, yet because no man is justified without repentance, and the beginning thereof goes before justification, therefore we have purposed in this first place to declare what our belief is concerning the same. I. To Justification, and therefore to the communion with Christ, repentance is necessary. We believe that to the true participation of Christ’s righteousness, and so to the communion with Christ, repentance is very needful: whereby being turned from sin and from the world, by changing our minds and wills, we are turned to God and are joined unto Him, and so obtain forgiveness of our sins in Him and by Him, and be clothed with his righteousness and holiness. For the first thing that John Baptist, yea that Christ Himself preached, was repentance for the remission of sins. (Mk. 1:4, 15) ‘And, except’ (says Christ) ‘ye repent, ye shall all likewise perish.’ (Lk. 13:3, 5) … V. A sum of the doctrine of repentance, everywhere and always necessary to all of years of discretion. …repentance is a changing of the mind and heart, stirred up in us through the Holy Ghost, by the Word both of the Law and the gospel: wherein we grieve from our heart: we detest: we lament: we lothe and bewail: confess before God all our sins, and even the corruption of our nature, as things utterly repugnant (as the law teaches) to the will of God, and to the cleansing whereof, the death of God’s own Son (as the gospel preaches) was needful: and do humbly pray and entreat for pardon and forgiveness of the same: and do earnestly resolve upon amendment of our life, and on a continual study and care of innocency and Christian virtues, and exercise ourselves in the same diligently all the days of our life: to the glory of God and edification of the Church.</p></blockquote>

</figure><figure class="quote" id="q-ced3bb21d5" data-kw="">
<blockquote><p>Q. But is justifying faith solitary without all attendants? A. No, justifying faith has two daughters that inseparably attend her.

1. Repentance: Here sinful man retracts and undoes his faults, acknowledges his transgressions, rents his heart weeps, smites upon his breast, and cries ‘What have I done?’ laments after the Lord and abhors himself in dust and ashes: He executes the Law upon himself; and since God excuses him from the punishment, he accuses himself of the guilt, and condemns himself to the shame of his sin; and hereby the sinner honors the equity of the threatening by his tears, acknowledging that his blood was due.

2. Newness of life: Here the sinner acknowledges perfect obedience to be still his duty, which honors the equity of God’s commandments. (Rom. 16:26)</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/thomas-vincent.html">Thomas Vincent</a></span><span class="wk"><span class="lbl">Work:</span> <cite>An Explicatory Catechism: or an Explanation of the</cite>, [Westminster] Assembly’s Shorter Catechism… (London: Mortlock, 1675), pp. 68-69</span></figcaption>

<blockquote><p>II. As soon as a principle of new life is infused into the adult person by the Spirit of Grace, immediately spiritual acting of every kind springs up from that principle, actions so pervading and exciting one another, and so mingled in their exercise that they can scarcely be distinguished in practice; and as difficult is it to determine which is first in time, which last. Surely it is not possible but that the soul, quickened by the Spirit, should in that supernatural light wherewith it is illuminated, both see itself defiled and undone with innumerable sins, and see Christ full of grace, truth and salvation. Such a view cannot but cause both, that with shame and sorrow it be displeased with itself, and with ardent desire be carried out unto Christ. Hence arises the receiving and accepting of Christ, that it may be delivered from the fiithiness and guilt of its sins. Now it cannot receive Him for justification except at the same time it receive him for sanctification: nor receive Him as a Priest to expiate sin, unless it also receive him as a King to whom it may submit in order to obedience. Hence it follows that that act of faith whereby we receive Christ for righteousness cannot be exercised without either a previous, or at least a concomitant repentance, and a purpose of a new life. If therefore faith go before justification, as we have lately asserted; the same must be said of repentance, springing up together with it from the same principle of spiritual life.</p></blockquote>

<div class="meta"><span class="t"><a href="../topics/repentance-and-conversion/repentance-and-faith.html">Repentance and Faith</a></span></div>
<div class="actions"><button class="copy" data-copy="“II. As soon as a principle of new life is infused into the adult person by the Spirit of Grace, immediately spiritual acting of every kind springs up from that principle, actions so pervading and exciting one another, and so mingled in their exercise that they can scarcely be distinguished in practice; and as difficult is it to determine which is first in time, which last. Surely it is not possible but that the soul, quickened by the Spirit, should in that supernatural light wherewith it is illuminated, both see itself defiled and undone with innumerable sins, and see Christ full of grace, truth and salvation. Such a view cannot but cause both, that with shame and sorrow it be displeased with itself, and with ardent desire be carried out unto Christ. Hence arises the receiving and accepting of Christ, that it may be delivered from the fiithiness and guilt of its sins. Now it cannot receive Him for justification except at the same time it receive him for sanctification: nor receive Him as a Priest to expiate sin, unless it also receive him as a King to whom it may submit in order to obedience. Hence it follows that that act of faith whereby we receive Christ for righteousness cannot be exercised without either a previous, or at least a concomitant repentance, and a purpose of a new life. If therefore faith go before justification, as we have lately asserted; the same must be said of repentance, springing up together with it from the same principle of spiritual life.”

— Herman Witsius, Conciliatory or Irenical Animadversions on the Controversies Agitated in Britain: under the Unhappy Names of Antinomians &amp; Neonomians (1696; Glasgow, 1807), ch. 11, ‘Whether repentance precedes the remission of sins? [Yes]’, pp. 119-20">Copy</button><a class="share" href="https://x.com/intent/post?text=%E2%80%9CII.+As+soon+as+a+principle+of+new+life+is+infused+into+the+adult+person+by+the+Spirit+of+Grace%2C+immediately+spiritual+acting+of+every+kind+springs+up+from+that+principle%2C+actions+so+pervading+and+exciting+one+another%2C+and+so+mingled+in+their+exercise+that+they+can+scarcely+be+distinguished+in+practice%3B+and+as+difficult+is+it+to+determine+which+is+first+in+time%2C+which+last.+Surely+it+is+not+possible+but+that+the+soul%2C+quickened+by+the+Spirit%2C+should+in+that+supernatural+light+wherewith+it+is+illuminated%2C+both+see+itself+defiled+and+undone+with+innumerable+sins%2C+and+see+Christ+full+of+grace%2C+truth+and+salvation.+Such+a+view+cannot+but+cause+both%2C+that+with+shame+and+sorrow+it+be+displeased+with+itself%2C+and+with+ardent+desire+be+carried+out+unto+Christ.+Hence+arises+the+receiving+and+accepting+of+Christ%2C+that+it+may+be+delivered+from+the+fiithiness+and+guilt+of+its+sins.+Now+it+cannot+receive+Him+for+justification+except+at+the+same+time+it+receive+him+for+sanctification%3A+nor+receive+Him+as+a+Priest+to+expiate+sin%2C+unless+it+also+receive+him+as+a+King+to+whom+it+may+submit+in+order+to+obedience.+Hence+it+follows+that+that+act+of+faith+whereby+we+receive+Christ+for+righteousness+cannot+be+exercised+without+either+a+previous%2C+or+at+least+a+concomitant+repentance%2C+and+a+purpose+of+a+new+life.+If+therefore+faith+go+before+justification%2C+as+we+have+lately+asserted%3B+the+same+must+be+said+of+repentance%2C+springing+up+together+with+it+from+the+same+principle+of+spiritual+life.%E2%80%9D%0A%0A%E2%80%94+Herman+Witsius%2C+Conciliatory+or+Irenical+Animadversions+on+the+Controversies+Agitated+in+Britain%3A+under+the+Unhappy+Names+of+Antinomians+%26+Neonomians+%281696%3B+Glasgow%2C+1807%29%2C+ch.+11%2C+%E2%80%98Whether+repentance+precedes+the+remission+of+sins%3F+%5BYes%5D%E2%80%99%2C+pp.+119-20&amp;url=https%3A%2F%2F5solasquotes.github.io%2Fquote%2F47764201aa.html&amp;via=5Solas" target="_blank" rel="noopener">Share on X</a><a class="perma" href="../quote/47764201aa.html">Permalink</a><a class="src" href="https://reformedbooksonline.com/on-the-relation-of-repentance-to-saving-faith-justification/#:~:text=II.%20As%20soon%20as%20a%20principle,the%20same%20principle%20of%20spiritual%20life&amp;text=II.%20As%20soon%20as%20a%20principle%20of%20new&amp;text=it%20from%20the%20same%20principle%20of%20spiritual%20life" rel="noopener" target="_blank">Read it online · Reformed Books Online</a></div>

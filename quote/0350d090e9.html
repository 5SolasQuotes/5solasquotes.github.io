<blockquote><p>[1. The Rule of Reformation.] The rule of building the house of God, and of the reformation of religion is the same and perpetual: the commandment of God, and not the commandment of man one or more, whether they be civil or ecclesiastical persons. It is their part to provide according to their places and callings, to command and direct that the Commandment of God be obeyed. This King commands not that his will be done, but what God has commanded. Neither King nor Parliament can command otherwise. Civil powers have great authority, not only in things civil, but in matters of Religion; and they sin against God, if they use not the authority which God hath put in their hands, for the good of Religion. To them belongs inspection and watching over, not only ecclesiasticos [ecclesiastical persons], but ecclesiastica [that which is ecclesiastical]. Ecclesiastical persons are subject to civil authority no less than others; and in respect of things-ecclesiastical, or matters of religion, Eusebius brings in Constantine the great, saying: ‘Vos Episcopi in Ecclesia, ego extra Ecclesiam seu templum Episcopus a Deo constitutus sum‘ [Ye are overseers in the Church; I am constituted of God an overseer outside of the Church Church]: Not that any mortal man whether Pope or Prince, can be properly Head of the Church, or vice-gerent [regent] unto Christ the Mediator in his special and economical Kingdom of Grace: for princes are vice-gerents to God, and to his Son Jesus Christ as He is God, in his universal Kingdom of Providence; and this watching and inspection of princes and magistrates, is objective ecclesiastica [objectively ecclesiastical], but formaliter civilis [formally civil], it is about matters of religion in a civil manner, and in a way suitable to the nature and quality of their place and power. The faithful custody and preservation of religion, is a part of their office: for they are not only keepers of the Second, but of the First Table of the Law… Religion also expects from them the civil sanction, that the worship of God, and the wholesome constitutions of the Church about religion, be confirmed and settled by their Laws. Coaction [coercion] also is theirs, for they by their power [in a Christian nation] are to constrain their subjects to the duties of religion, and to coerce and stop them that they do nothing to the contrary.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/alexander-henderson.html">Alexander Henderson</a></span><span class="wk"><span class="lbl">Work:</span> <cite>‘A Sermon Preached To the Honorable House of Commons, at Their late Solemn Fast, Wed., Dec. 27</cite>, 1643’ (London, 1644)</span></figcaption>

</figure><figure class="quote" id="q-d279c3545e" data-kw="">
<blockquote><p>There must also an order be set down [by the magistrates] among the citizens, to avoid public assemblies, games, feasts, drinkings, marriages, dancings, fairs, schools, churches, and public baths; for besides that in many of these there is great offence committed, not only against the body, but also against the soul, there is also no small danger of getting and scattering the infection. Wherefore, wise men give counsel that at such times we should very seldom come into great companies of men. For there is no man so unskillful but he knows that where as all things are done without consideration, as it were in a mingle mangle, that there the infection is spread farthest and infects many. As when the taverns and typling houses whither they go to drink are open unto all daily, the market also, the shambles, public places also in which linen is washed, and diverse sorts of people are wont [accustomed] to be mixed together, are haunted [frequented by the plague]. In this case, therefore, laws must be made by the Preservers [civil health officials appointed specifically for the plague] whereby such meetings may be forbidden, or else severed into diverse places and times. … If marriages are to be made (albeit whom can these contracts like in such an estate of things, in which if at any time else, the counsel of the apostle ought to prevail, that for the present necessity it were better to remain single) let them be kept with a very small number of persons and without all pomp. As for drunkenness and gormandize, dancings and other not necessary or rather dangerous and hurtful ceremonies and fashions, which for the most part are wont to be used: let them be sent packing far away, lest (as it is in the proverb) this sweet meat have sour sauce (Tob. 2; Amos 8; 1. Mach. 1; Prov. 14), and lest they bewail the next day the oversight committed the day before. … Now concerning houses of learning and schools in which children come together, what shall I say? Else than that it seems very convenient and in manner necessary, if we will avoid the spreading of the infection, that those which cannot be brought unto a place more commodious, be for a time shut up and that the youth be rather taught at home, albeit with never so small profit, and give themselves to private readings than with so great danger by heaps to come together. For the age of children and lads, as being given to feeding, intemperate, tender, thin, unwary, is wont to be more subject unto this sickness [bubonic plague] than those that are elder and of more years. Wherefore, Rhases, the chief of the Arabian physicians, and after him Franciscus Valleriola, physician of Arles, give counsel that infants and children be with speed removed from infectious places into another country where they need fear no danger of infection, The like may be judged of common and yearly fairs, also of funerals or burials… Unto this chapter, let the Preservers [civil health officials appointed for the plague] add this, and earnestly advise upon it with all the magistrates, namely, whether it were better for certain poor people, which get their living by begging from door to door, and by reason of their needy life feeding on everything, are more in danger of this disease than others, go unto and run about all streets, and chiefly such houses where dead corpses are, and seek unto all men (for cruel necessity drives them out of their own poor cottages); let them I say consider whether it were better to send them some whither else, or to maintain them by the common charge at their own houses so long until the sickness slack, that by this means occasion may be taken from them of running up and down, of receiving and scattering the infection. For it can scarce be said how great and present danger does hereby grow unto the whole city. … For this way it shall come to pass that the less multitude of people there is, so much the less infection there shall be: and the less infection there is, so much less dying and more speedy deliverance is to be hoped for. For like as when the rot is gotten into an heap of apples, the more lie gathered together, the more it increases and the longer the rotting endures: so also here it comes to pass that if once the plague be crept into a city that is populous, we see the sickness daily to be increased and cherished a great while, which thing is not wont in such sort to happen in a place less peopled…</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/johann-von-ewich.html">Johann von Ewich</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Duty of a Faithful and Wise Magistrate in Preserving and Delivering of the Commonwealth from Infection</cite>, (London, 1583) | ch. 6, ‘Of Order to be Appointed Among the Citizens, and of Leaving of Public Meetings &amp; Assemblies’, pp. 26-7 ff.</span></figcaption>

ze%2C+dancings+and+other+not+necessary+or+rather+dangerous+and+hurtful+ceremonies+and+fashions%2C+which+for+the+most+part+are+wont+to+be+used%3A+let+them+be+sent+packing+far+away%2C+lest+%28as+it+is+in+the+proverb%29+this+sweet+meat+have+sour+sauce+%28Tob.+2%3B+Amos+8%3B+1.+Mach.+1%3B+Prov.+14%29%2C+and+lest+they+bewail+the+next+day+the+oversight+committed+the+day+before.+%E2%80%A6+Now+concerning+houses+of+learning+and+schools+in+which+children+come+together%2C+what+shall+I+say%3F+Else+than+that+it+seems+very+convenient+and+in+manner+necessary%2C+if+we+will+avoid+the+spreading+of+the+infection%2C+that+those+which+cannot+be+brought+unto+a+place+more+commodious%2C+be+for+a+time+shut+up+and+that+the+youth+be+rather+taught+at+home%2C+albeit+with+never+so+small+profit%2C+and+give+themselves+to+private+readings+than+with+so+great+danger+by+heaps+to+come+together.+For+the+age+of+children+and+lads%2C+as+being+given+to+feeding%2C+intemperate%2C+tender%2C+thin%2C+unwary%2C+is+wont+to+be+more+subject+unto+this+sickness+%5Bbubonic+plague%5D+than+those+that+are+elder+and+of+more+years.+Wherefore%2C+Rhases%2C+the+chief+of+the+Arabian+physicians%2C+and+after+him+Franciscus+Valleriola%2C+physician+of+Arles%2C+give+counsel+that+infants+and+children+be+with+speed+removed+from+infectious+places+into+another+country+where+they+need+fear+no+danger+of+infection%2C+The+like+may+be+judged+of+common+and+yearly+fairs%2C+also+of+funerals+or+burials%E2%80%A6+Unto+this+chapter%2C+let+the+Preservers+%5Bcivil+health+officials+appointed+for+the+plague%5D+add+this%2C+and+earnestly+advise+upon+it+with+all+the+magistrates%2C+namely%2C+whether+it+were+better+for+certain+poor+people%2C+which+get+their+living+by+begging+from+door+to+door%2C+and+by+reason+of+their+needy+life+feeding+on+everything%2C+are+more+in+danger+of+this+disease+than+others%2C+go+unto+and+run+about+all+streets%2C+and+chiefly+such+houses+where+dead+corpses+are%2C+and+seek+unto+all+men+%28for+cruel+necessity+drives+them+out+of+their+own+poor+cottages%29%3B+let+them+I+say+consider+whether+it+were+better+to+send+them+some+whither+else%2C+or+to+maintain+them+by+the+common+charge+at+their+own+houses+so+long+until+the+sickness+slack%2C+that+by+this+means+occasion+may+be+taken+from+them+of+running+up+and+down%2C+of+receiving+and+scattering+the+infection.+For+it+can+scarce+be+said+how+great+and+present+danger+does+hereby+grow+unto+the+whole+city.+%E2%80%A6+For+this+way+it+shall+come+to+pass+that+the+less+multitude+of+people+there+is%2C+so+much+the+less+infection+there+shall+be%3A+and+the+less+infection+there+is%2C+so+much+less+dying+and+more+speedy+deliverance+is+to+be+hoped+for.+For+like+as+when+the+rot+is+gotten+into+an+heap+of+apples%2C+the+more+lie+gathered+together%2C+the+more+it+increases+and+the+longer+the+rotting+endures%3A+so+also+here+it+comes+to+pass+that+if+once+the+plague+be+crept+into+a+city+that+is+populous%2C+we+see+the+sickness+daily+to+be+increased+and+cherished+a+great+while%2C+which+thing+is+not+wont+in+such+sort+to+happen+in+a+place+less+peopled%E2%80%A6%E2%80%9D%0A%0A%E2%80%94+Johann+von+Ewich%2C+The+Duty+of+a+Faithful+and+Wise+Magistrate+in+Preserving+and+Delivering+of+the+Commonwealth+from+Infection+in+the+Time+of+the+Plague+or+Pestilence%2C+Two+Books+%28London%2C+1583%29+%7C+ch.+6%2C+%E2%80%98Of+Order+to+be+Appointed+Among+the+Citizens%2C+and+of+Leaving+of+Public+Meetings+%26+Assemblies%E2%80%99%2C+pp.+26-7+ff.&amp;url=https%3A%2F%2F5solasquotes.github.io%2Fquote%2Fd279c3545e.html&amp;via=5Solas" target="_blank" rel="noopener">Share on X</a><a class="perma" href="../quote/d279c3545e.html">Permalink</a><a class="src" href="https://reformedbooksonline.com/on-the-civil-magistrates-just-authority-for-quarantining-and-restraining-the-congregating-of-citizens-even-the-church-with-sufficient-natural-warrant/#:~:text=There%20must%20also%20an%20order%20be,happen%20in%20a%20place%20less%20peopled&amp;text=There%20must%20also%20an%20order%20be%20set%20down&amp;text=sort%20to%20happen%20in

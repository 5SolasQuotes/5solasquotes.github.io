<blockquote><p>The correct judgment, I would argue, is that the conscious awareness characteristic of animal life is irreducible to the properties possessed either by inorganic substances or purely vegetative living substances, but that it is nevertheless an entirely physical or corporeal phenomenon.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/edward-feser.html">Edward Feser</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Immortal Souls: a Treatise on Human Nature (Editiones Scholasticae, 2024) | pt. 2, ch. 6, ‘Animality’ | ‘Sentient versus vegetative life’</cite>, p. 232</span></figcaption>

</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-ffafce369f" data-kw="">
<blockquote><p>It ought to be well understood in approaching this topic that the delineated distinctions, and further ones that will be made, are not magic solutions to ethical predicaments. Rather they are (very useful) tools that will go a long way towards working to what is righteous and pleasing before God. As with all tools, they may be used well, or irresponsibly. If through the multiplying of distinctions and terms (or the opposite, the lack of using such), a conclusion is reached that seems off or suspect, sophistry is likely being committed. Ethical conclusions reached should go with, and support an informed common sense in line with Scripture, not go against it. The purpose is to clearly understand and ground the reasons for right action, and to clear away all the mist, leaps and gymnastics of those who advocate error and manipulate truth as a wax-nose.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/travis-fentiman.html">Travis Fentiman</a></span><span class="wk"><span class="lbl">Work:</span> <cite>‘On the Ethics of Material Cooperation with, &amp; Associations with Evil’, ‘Extended Intro’, ‘The Beginnings of Answers: Distinctions’</cite></span></figcaption>

<blockquote><p>‘to you it shall be for meat’: which is generally thought to be the food of the antediluvians, it not being proper, at least very soon, to kill any of the animals until they were multiplied and increased, lest their species should be destroyed, though here is no prohibition of eating flesh; nor is it said that this only should be for meat which is before mentioned; and by the early employment of some in keeping sheep, and by the sacrifice of creatures immediately after the Fall, part of which used to be eaten by the offerers; and by the distinction of clean and unclean creatures before the Flood, it looks probable that flesh might be eaten: and Bochart refers this clause to what goes before in the preceding verse, as well as to what is in this, and takes the sense to be that the fishes of the sea and fowls of the air, and every living creature man had dominion over, as well as herbs and fruits, were given him for his food: but the Jews are of opinion that the first man might not eat flesh, but it was granted to the sons of Noah.</p></blockquote>

</figure><figure class="quote" id="q-bf53d697a1" data-kw="">
<blockquote><p>But when I say that God can without respect of sin, inflict any torment upon his creature, this is delivered of power absolute. This power the Lord did execute upon his own Son: for what was his sin? Was He not the spotless lamb of God? Yet what agonies did He suffer in the garden, what torments and terrors upon the cross, when He cried out ‘My God, my God, Why hast thou forsaken Me?’ But the like power He does not execute on us, only He gives us authority to exercise the like power over other creatures: If the powder of an hare [rabbit] burnt alive in an oven, be found to be wholesome for us, He gives us leave thus to deal with him, and the like: yet have not these creatures sinned either against God, or against us. Of this absolute power of God I have discoursed more sparingly in the place cited by him, bk. 1, pt. 2, De Electione, digression 3.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/william-twisse.html">William Twisse</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Riches of God’s Love unto the Vessels of Mercy, consistent with his Absolute Hatred or Reprobation of the Vessels of Wrath… (Oxford: L.L., 1653), pt. 2, 2nd Sort of Arguments, sect. 3</cite>, pp. 150-51</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/man/image-of-god.html">Image of God</a></span></div>

rel="noopener" target="_blank">Read it online · Reformed Books Online</a></div>
</figure><figure class="quote" id="q-cdb094eedf" data-kw="">
<blockquote><p>But a great question here does justly offer itself, whether man might not eat flesh at the first, but herbs, seeds and fruits only. And because the other creatures are confined to herbs and seeds, whether such of them as live now upon flesh, were otherwise sustained then, as lions, beares, wolves, etc. Touching either of these diverse expositours are of diverse opinions. Some think that although herbs and seeds and fruits only are named, when man’s food is appointed unto him, yet for so much as flesh is not forbidden, and a dominion over the creatures to use them, as he thought good, was given unto him, he might at his pleasure make food of that also. And they argue from this that sacrifices were to be made of the creatures, some part of which was to be eaten, and likewise that they were to be killed, that they might have their skins for clothing, wherefore it is most probable that they ate their flesh. So that God in appointing these things to be eaten, did but appoint their ordinary food, there being a liberty to use flesh for food also, when man should think good. But others hold that seeds and herbs and fruits were mans only food till the Flood, because none but these are mentioned and an express allowance is given to eat flesh after the flood, as these things. Thus the Fathers generally, and most new writers of all sorts. And it seems to have been an ancient received opinion, by that which old poets have left written, as Boethius. The former age was content with the faithful fields, and satified their hunger with the acorn, when they had fasted long. And Ovid: Men were content with meat growing without forcing, they gathered the fruits growing in mountainous places and those that grow upon thorns, etc. (bk. 1, Metamor.) And it stands with good reason that man should feed then only upon such things, they being such as might well suffice nature, and most pleasant at the first, and men’s bodies being strong and healthful, and this was a most simple diet, and so most fit to be appointed at the first to rebuke the luxury of after times. Some also yield this for a reason, that man not being used to the shedding of blood might be better preserved from murder. But this reason is weak, because beasts were killed for sacrifice, and to have their skins for apparel, and therefore Cain, the very first man born into the world, fell into this damnable sin of murder. The reasons before rendered therefore are best, and that the creatures not being killed up at the first, might the better be multiplied upon the earth. After the flood men’s bodies grew weaker, and it is generally thought that neither herbs nor waters were so wholesome as before, but more corrupt through that deluge, and therefore flesh was now allowed to be eaten; and whereas waters were their only drink before, vines were now planted that they might have wine for their infirmity. Yet it is not to be doubted but that Noah and his sons did forbear the killing of beasts to eat for a time, that their increase might not be hindered. Calvin thinks it best to suspend and not to determine this question. Touching beasts, that now live upon flesh, some also think that they did so at the first, because the nature of a creature is always the same, and that when God assigned herbs and seeds for the beasts to feed upon, He meant not all beasts. But this is contrary to the text, speaking of all, wherein was the breath of life, and howsoever creatures never alter from their specifical nature, yet they may alter from their individual [nature], using such food at one time, as they used not at another, as children, who at the first are nourished with milk, and eat no solid meat, yet afterwards they eat it. Others therefore more probably hold, that even those beasts that since have lived upon flesh, and birds also, lived then all upon seeds and herbs, and that this discord and malignity of nature came upon them afterwards, since the Flood, one bearing a kind of hatred to another and so preying upon it and tearing and eating the flesh thereof. And this opinion has both the present text plainly for it and even at the time of the Flood it must needs be yielded to have been so, because all sorts of creatures earthly living with Noah in the ark, were susteined without eating flesh, for otherwise their number, being so few of each kind taken in, would not have sufficed, see also for this Isa. 11:7 and 65:25.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/john-mayer.html">John Mayer</a></span><span class="wk"><span class="lbl">Work:</span> <cite>A Commentary upon the Whole Old Testament (1627; 1653), on Genesis, ch. 1</cite>, pp. 27-28</span></figcaption>

nd+eat+no+solid+meat%2C+yet+afterwards+they+eat+it.+Others+therefore+more+probably+hold%2C+that+even+those+beasts+that+since+have+lived+upon+flesh%2C+and+birds+also%2C+lived+then+all+upon+seeds+and+herbs%2C+and+that+this+discord+and+malignity+of+nature+came+upon+them+afterwards%2C+since+the+Flood%2C+one+bearing+a+kind+of+hatred+to+another+and+so+preying+upon+it+and+tearing+and+eating+the+flesh+thereof.+And+this+opinion+has+both+the+present+text+plainly+for+it+and+even+at+the+time+of+the+Flood+it+must+needs+be+yielded+to+have+been+so%2C+because+all+sorts+of+creatures+earthly+living+with+Noah+in+the+ark%2C+were+susteined+without+eating+flesh%2C+for+otherwise+their+number%2C+being+so+few+of+each+kind+taken+in%2C+would+not+have+sufficed%2C+see+also+for+this+Isa.+11%3A7+and+65%3A25.%E2%80%9D%0A%0A%E2%80%94+John+Mayer%2C+A+Commentary+upon+the+Whole+Old+Testament+%281627%3B+1653%29%2C+on+Genesis%2C+ch.+1%2C+pp.+27-28&amp;url=https%3A%2F%2F5solasquotes.github.io%2Fquote%2Fcdb094eedf.html&amp;via=5Solas" target="_blank" rel="noopener">Share on X</a><a class="perma" href="../quote/cdb094eedf.html">Permalink</a><a class="src" href="https://reformedbooksonline.com/on-mans-original-state-in-righteousness/#:~:text=But%20a%20great%20question%20here%20does,for%20this%20Isa.%2011%3A7%20and%2065%3A25&amp;text=But%20a%20great%20question%20here%20does%20justly%20offer&amp;text=see%20also%20for%20this%20Isa.%2011%3A7%20and%2065%3A25" rel="noopener" target="_blank">Read it online · Reformed Books Online</a></div>

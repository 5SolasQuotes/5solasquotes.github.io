<main class="wrap"><figure class="quote" id="q-50f44e86d0" data-kw="">
<blockquote><p>But for what reason, then, is eternal punishment due to it? You respond, by the condition of man, who is found without grace; and that this is the doctrine of St. Thomas (Stapleton, Of Original Sin, bk. 1, ch. 1, disp. 1, q. 5). Whatever this may be, it is surely most absurd: that man is punished not because he is stained by original sin, but because he lacks the grace which ought to have been present. Is it thus graver and more repugnant to original justice to lack grace than to be stained with a fault? But this very lack of justice, if it could be separated from stains, would be much lighter than to be stained with sins; for it could happen that someone is held to be unjust, as Pighius thought, on account of a plainly alien offense, of which he himself was never an associate. Then, a stain brings a deformity worthy of hatred and punishment; to lack justice indeed removes a habit, but does not posit the contrary. But Scripture, on the contrary, teaches that nothing but uncleanness and abomination delays entry into heaven (Apoc. 21:27). But from these things it is now sufficiently clear how this error about the punishment of original sin is not undeservedly or falsely imposed upon you. For first you teach that no punishment of sense, neither exterior nor interior, is due to this sin (Thomas, in 2, dist. 33, q. 2, art. 2). For there is a certain eternal punishment, if we believe you, without the sense of pain, and with this original sin, if it is alone, is punished: a mild punishment, I believe, which inflicts no pain either without or within. What is this other than to take away all punishment?</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/william-whitaker.html">William Whitaker</a></span><span class="wk"><span class="lbl">Work:</span> <cite>A Treatise on Original Sin</cite>, … against the three first books of Thomas Stapleton on the Whole Doctrine of Justification presently controverted (d. 1595; Legat, 1600), bk. 1, ch. 1 trans. AI Latin, p. 8</span></figcaption>

<blockquote><p>13. Reason is employed on both sides, as an instrument, not a judge or norm. So that neither are they to be listened to who defer to it more than is fair in theological matters, and demand the things of faith from its scales, who are the Socinians; nor those who pointlessly begrudge its use in theological argumentation and forming consequences, which the Verronian Papists do, and some Lutherans.</p></blockquote>

</figure><figure class="quote" id="q-220aa72596" data-kw="">
<blockquote><p>2 …but the metaphysician proves the principles of the inferior sciences in as much as if those principles are obstinately denied by anyone, he explains their terms, which having been declared and perceived by the adversary, he cannot but assent to the truth of the proposed principles, unless he be completely stripped of reason in the manner of a brute. For nothing conduces more to the confirmation of principles than the perception of the same: and nothing more helps the intellect, that it perceive principles than the understanding of the terms from which the principles are composed. Furthermore, he proves those principles a posteriori [from those things that follow], and indeed by leading the adversary through the impossible, in as much as unless he acknowledge the truth of the principles it will be necessary for him to have acknowledged the greatest absurdity resulting from the denied principles. Thus to one denying that the whole is greater than its part, it will be explained what part, what whole. If he be not yet sufficiently moved, it will be inferred from that negation, the acception of the terms having been presupposed according to the explained way, that the whole would not be whole, nor would the part be part; and thus the same would be and not be at the same time. Which, as most absurd, will not be to be admitted. 5. …All principles, of whatever genus they be, can be called first; and in what way first, in that way also they are indemonstrable. They are therefore first in as much as they do not recognize others through which they are demonstrated a priori [from things prior]. Then they are first in as much as in that science of which they are principles, they do not recognize others prior to themselves through which they are demonstrated. But what principles in their science are first can still in the order of another science be posterior and thus demonstrable, at least a posteriori, if not also a priori.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/paul-voet.html">Paul Voet</a></span><span class="wk"><span class="lbl">Work:</span> <cite>First Philosophy Reformed</cite>, tr. by AI by Onku (Utrecht: Johann Waesberg, 1657), ch. 2, sect. 2</span></figcaption>

<blockquote><p>7. In Corollary 1 I had said that the opinion of Taurellus and Gorlaeus about man as a being per accidens stumbles in many ways. The argument by which they are moved is such. Two beings or complete substances make one per accidens and not per se: but the body and soul of man are two complete substances. Therefore. I respond: The major is not universally true; and the minor is denied. That in the presence of the disputation itself it may be aired to many and to the end, we now cursorily indicate these hypotheses: I. That man is a species of substance and animal created into one essence or nature from soul and body, we think is implied in Gen. 3:7, 1 Cor. 15:45, compared with Gen. 1:26-27. II. Christ-Theanthropos [God-man] (in whom there are two natures or complete substances) is one per se and not per accidens: for the union of natures was made into one suppositum, [Greek]. See the theologians on the person of Christ: Much more therefore substantially and per se the union was made between the soul and body of man, which indeed are not so far distant, nor are they such complete substances as divinity and humanity. III. The true human nature of Christ would not be more one substance through itself than in the death of the same … [These articles are about Christ, man, the soul and angels] … IX. This opinion even impinges on many metaphysical dogmas… … 5. That man is not a substance nor does he directly pertain to the predication of substance: but only indirectly, and per accidens is referred to it, since he is a being per accidens and collective. 6. That one man is no more one per se, than an army, a city, etc. where there are many men collectively. 7. That consequently man cannot be defined by an essential and perfect definition. 8. That the matter and form of a composite are properly matter, and its form is the union, that is an accident, or pure mode, namely a relation. See Gorlaeus, Exercit. 14, p. 266. 9. That the union of the human soul with its body is to be sought in some mere accident from those five, and indeed in position or posture: as some seem to concede. 10. That the body is not the nature of man, but only his instrument, through which the soul existing in the body operates.</p></blockquote>

<blockquote><p>When we demand the use of reason and logic, we no more turn them into the foundations, principles, and rules of faith than we do our eyes, ears, and tongues without which we can neither learn nor teach our religion, nor defend it against opponents. For us they are, therefore, means and requirements without which there is no faith or theological knowledge, but they are certainly not principles, norms, rules, and foundations.</p></blockquote>

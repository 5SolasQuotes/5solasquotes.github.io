<main class="wrap"><figure class="quote" id="q-19b23ce590" data-kw="">
<blockquote><p>In this consideration that learned and grave divine Dr. Andrew Rivet says well (in Decalog., ch. 5, p. 204) that as we believe a man well skilled in his own art, so that his judgement is a supreme rule; so the supreme authority of the magistrate to us in things positive is a rule; for indeed it cannot be denied but there be arcana imperis, secrets of State that are not to be communicated to pastors or to any, in which the rulers have a supremacy.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/samuel-rutherford.html">Samuel Rutherford</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Divine Right of Church Government… (London, 1646)</cite>, pp. 558-9</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/church-government-and-the-ministry/synods-and-assemblies.html">Synods and Assemblies</a></span></div>

</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-dcc315b710" data-kw="">
<blockquote><p>But may one say, if the decrees of a Synod concerning matters of faith or worship, may and ought to be examined by the sure rule of the Word of God, and only to be received when they do agree therewith; and if also the constitutions of a Synod in external circumstances do not bind, except ex aeque et bono [out of equity and good], and propter regula mandandi causas [due to commanding according to just causes]: or, as divines speak, in casu scandali &amp; contemptus [in the case of scandal and contempt], and not for the mere will or authority of a synod… as our divines maintain and prove against Papists. … Our divines, by those their tenets, mean not to open a door to disobedience and contempt of the ordinances of a synod, but only to oppugne the Popish error concerning the binding power of ecclesiastical laws, by the sole will and naked authority of the law-maker, and that Christian people ought not to seek any further reason or motive of obedience.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/george-gillespie.html">George Gillespie</a></span><span class="wk"><span class="lbl">Work:</span> <cite>An Assertion of the Government of the Church of Scotland… (Edinburgh, 1641)</cite>, pp. 152-3</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/church-government-and-the-ministry/synods-and-assemblies.html">Synods and Assemblies</a></span></div>

</figure><figure class="quote" id="q-31fa497d99" data-kw="Councils contradict councils">
<blockquote><p>Nor is there any ground for whispering to me, that when councils are at variance, one or other of them is not a lawful council. For how shall we ascertain this? Just, if I mistake not, by judging from Scripture that the decrees are not orthodox. For this alone is the sure law of discrimination.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/john-calvin.html">John Calvin</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Institutes of the Christian Religion</cite>, 4.9.9</span></figcaption>

<blockquote><p>6. What is warranted by natural reason, is warranted by Scripture, for the Law of nature is but a part of Scripture.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/samuel-rutherford.html">Samuel Rutherford</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Divine Right of Church Government... (1646) | Question 2</cite>, p. 101</span></figcaption>

</figure><figure class="quote" id="q-d0cd79814c" data-kw="">
<blockquote><p>[4.] Calvin treating of Church-power, says well, ‘Non est igitur ecclesiae potestas in•…inita, sed subjecta verbo Domini, &amp; in eo quasi inclusa.’ (Institutes, bk. 4, ch. 8, sect. 4) That all Church-judicatories, whether congregational-elderships, or presbyteries or synods, whether provincial or national, or ecumenic, being constituted of men that are weak, frail and ignorant in part, are in their determinations fallible and subject to error, Isa. 40:6-8; Rom. 3:4; 1 Cor. 13:9,12. 5. That insofar as any of these do actually err and decline from the truth, they do insofar act without power and authority from Jesus Christ: They can do nothing (of themselves, they may do, but not by His commission and warrant) against the truth, but for the truth, 2 Cor. 13:8. The power which He has given them being to edification, and not to destruction, 2 Cor. 13:12. 6. Sad experience, almost in every generation, does teach us that Church-guides and Church-judicatories do oftentimes decline from the straight-ways of the Lord, and decree unrighteous decrees, and write grievous things which they have prescribed, Isa. 9:15-16; Jer. 8:8-9; Mal. 2:8-9; Jer. 2:8. And that whilst they are boasting of the authority given to them of God, and of their skill in the Law, and professing to walk according thereto, they are perverting the precious truths of God, and persecuting these who cleave thereunto, Jer. 18:18; Isa. 66:5; Jn. 7:48-49. 7. That the same Lord, who has commanded us not to despise prophesying, 1 Thess. 5:19, has also commanded us to prove all things, and to hold fast that which is good, ver. 20. And no[t] to believe every spirit, but to try the spirits, whether they be of God, because many false prophets are gone forth into the world, 1 Jn. 4:1. And that whatsoever is not of faith is sin, Rom. 14:15. And that we ought not to be the servants of men, 1 Cor. 7:23. That is to do things (especially in the matters of God) for which we have no other warrant, but the mere pleasure and will of men, which the apostle Peter calls living to the lusts of men, and not to the will of God, 1 Pet. 4:2. And that it is therefore both the duty and privilege of every Church-member, and of every inferior Church-judicatory, to examine by the judgement of discretion every thing which the Church-authority joins, whether it be agreeable or repugnant to the rules of the Word; and if after a diligent and impartial search, it be found repugnant, they are not to bring their consciences in bondage thereto; neither is the allowing and exercising of the judgement of discretion by inferiors, the setting them as judges over their superiors, or making them transgress the line, or limits of that due subordination and submission appointed unto them of God. Protestant divines in their writings, de judice controverstarum [on the judge of controversies] have fully answered this, and showed us that it does not make a private man or an inferior, judge of the sentences and decrees of his superiors, but only of his own actions.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/james-guthrie.html">James Guthrie</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Protesters No Subverters… (Edinburgh, 1658)</cite>, pp. 96-7</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/church-government-and-the-ministry/synods-and-assemblies.html">Synods and Assemblies</a></span></div>

h we have no other warrant, but the mere pleasure and will of men, which the apostle Peter calls living to the lusts of men, and not to the will of God, 1 Pet. 4:2. And that it is therefore both the duty and privilege of every Church-member, and of every inferior Church-judicatory, to examine by the judgement of discretion every thing which the Church-authority joins, whether it be agreeable or repugnant to the rules of the Word; and if after a diligent and impartial search, it be found repugnant, they are not to bring their consciences in bondage thereto; neither is the allowing and exercising of the judgement of discretion by inferiors, the setting them as judges over their superiors, or making them transgress the line, or limits of that due subordination and submission appointed unto them of God. Protestant divines in their writings, de judice controverstarum [on the judge of controversies] have fully answered this, and showed us that it does not make a private man or an inferior, judge of the sentences and decrees of his superiors, but only of his own actions.”

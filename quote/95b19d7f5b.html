</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-2e52373e46" data-kw="">
<blockquote><p>Come not into the company of idolatrous papists; dare not to live under the same roof with them, else you run into the devil&#x27;s mouth. John the divine would not be in the bath where Cerinthus the heretic was. 2. Go not into their chapels to see their crucifixes, or hear mass; as the looking on an harlot draws to adultery, so the looking on the popish gilded picture may draw to idolatry.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/thomas-watson.html">Thomas Watson</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Ten Commandments</cite>, p. 100</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/worship/idolatry-and-images.html">Idolatry and Images</a></span><span class="t"><a href="../topics/rome/worship.html">Rome: Worship</a></span></div>
<div class="actions"><button class="copy" data-copy="“Come not into the company of idolatrous papists; dare not to live under the same roof with them, else you run into the devil&#x27;s mouth. John the divine would not be in the bath where Cerinthus the heretic was. 2. Go not into their chapels to see their crucifixes, or hear mass; as the looking on an harlot draws to adultery, so the looking on the popish gilded picture may draw to idolatry.”

— Thomas Watson, The Ten Commandments, p. 100">Copy</button><a class="share" href="https://x.com/intent/post?text=%E2%80%9CCome+not+into+the+company+of+idolatrous+papists%3B+dare+not+to+live+under+the+same+roof+with+them%2C+else+you+run+into+the+devil%27s+mouth.+John+the+divine+would+not+be+in+the+bath+where+Cerinthus+the+heretic+was.+2.+Go+not+into+their+chapels+to+see+their+crucifixes%2C+or+hear+mass%3B+as+the+looking+on+an+harlot+draws+to+adultery%2C+so+the+looking+on+the+popish+gilded+picture+may+draw+to+idolatry.%E2%80%9D%0A%0A%E2%80%94+Thomas+Watson%2C+The+Ten+Commandments%2C+p.+100&amp;url=https%3A%2F%2F5solasquotes.github.io%2Fquote%2F2e52373e46.html&amp;via=5Solas" target="_blank" rel="noopener">Share on X</a><a class="perma" href="../quote/2e52373e46.html">Permalink</a><a class="src" href="https://ccel.org/ccel/watson/commandments" rel="noopener" target="_blank">Read it online · CCEL</a></div>
</figure><figure class="quote" id="q-ce7d2c08fc" data-kw="">
<blockquote><p>Nay, here idolatry is manifest; since the worship of adoration and religious invocation is due to God alone (Ps. 50:15; Matt. 4:10; Rom. 10:17), nor can the calves of the lips be offered to the Saints, nor the incense of prayers burned to them, without their thereby being reckoned omniscient, omnipotent, omnipresent, and immense — able in a moment to be present to all who invoke them, in various places, on various matters.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/samuel-maresius.html">Samuel Maresius</a></span><span class="wk"><span class="lbl">Work:</span> <cite>A Concise Refutation of Papism</cite>, p. 17</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/prayer/prayers-to-saints-and-for-the-dead.html">Prayers to Saints and for the Dead</a> › <a href="../topics/prayer/prayers-to-saints-and-for-the-dead/invocation-of-saints-refuted.html">Invocation of saints refuted</a></span><span class="t"><a href="../topics/rome/mary-and-the-saints.html">Rome: Mary and the Saints</a> › <a href="../topics/rome/mary-and-the-saints/invocation-of-saints.html">Invocation of saints</a></span></div>
<div class="actions"><button class="copy" data-copy="“Nay, here idolatry is manifest; since the worship of adoration and religious invocation is due to God alone (Ps. 50:15; Matt. 4:10; Rom. 10:17), nor can the calves of the lips be offered to the Saints, nor the incense of prayers burned to them, without their thereby being reckoned omniscient, omnipotent, omnipresent, and immense — able in a moment to be present to all who invoke them, in various places, on various matters.”

— Samuel Maresius, A Concise Refutation of Papism, p. 17">Copy</button><a class="share" href="https://x.com/intent/post?text=%E2%80%9CNay%2C+here+idolatry+is+manifest%3B+since+the+worship+of+adoration+and+religious+invocation+is+due+to+God+alone+%28Ps.+50%3A15%3B+Matt.+4%3A10%3B+Rom.+10%3A17%29%2C+nor+can+the+calves+of+the+lips+be+offered+to+the+Saints%2C+nor+the+incense+of+prayers+burned+to+them%2C+without+their+thereby+being+reckoned+omniscient%2C+omnipotent%2C+omnipresent%2C+and+immense+%E2%80%94+able+in+a+moment+to+be+present+to+all+who+invoke+them%2C+in+various+places%2C+on+various+matters.%E2%80%9D%0A%0A%E2%80%94+Samuel+Maresius%2C+A+Concise+Refutation+of+Papism%2C+p.+17&amp;url=https%3A%2F%2F5solasquotes.github.io%2Fquote%2Fce7d2c08fc.html&amp;via=5Solas" target="_blank" rel="noopener">Share on X</a><a class="perma" href="../quote/ce7d2c08fc.html">Permalink</a><span class="src none">No free online copy linked</span></div>
</figure><figure class="quote" id="q-48f84ab3d4" data-kw="">
<blockquote><p>Do we not see with our eyes that in the Roman Church the people is denied the Communion of the cup? Do we not see pictures of the Trinity, and the people bowing the knee before images? Do we not hear public service and prayers in an unknown tongue? And if these things be formally prohibited in the holy Scripture, are they not unto us sensible marks of a false and erroneous Church?</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/pierre-du-moulin.html">Pierre Du Moulin</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Novelty of Popery</cite>, ch. 28</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/worship/idolatry-and-images.html">Idolatry and Images</a> › <a href="../topics/worship/idolatry-and-images/images-icons-and-crucifixes.html">Images, icons and crucifixes</a></span><span class="t"><a href="../topics/rome/worship.html">Rome: Worship</a> › <a href="../topics/rome/worship/images.html">Images</a></span></div>
<div class="actions"><button class="copy" data-copy="“Do we not see with our eyes that in the Roman Church the people is denied the Communion of the cup? Do we not see pictures of the Trinity, and the people bowing the knee before images? Do we not hear public service and prayers in an unknown tongue? And if these things be formally prohibited in the holy Scripture, are they not unto us sensible marks of a false and erroneous Church?”

— Pierre Du Moulin, The Novelty of Popery, ch. 28">Copy</button><a class="share" href="https://x.com/intent/post?text=%E2%80%9CDo+we+not+see+with+our+eyes+that+in+the+Roman+Church+the+people+is+denied+the+Communion+of+the+cup%3F+Do+we+not+see+pictures+of+the+Trinity%2C+and+the+people+bowing+the+knee+before+images%3F+Do+we+not+hear+public+service+and+prayers+in+an+unknown+tongue%3F+And+if+these+things+be+formally+prohibited+in+the+holy+Scripture%2C+are+they+not+unto+us+sensible+marks+of+a+false+and+erroneous+Church%3F%E2%80%9D%0A%0A%E2%80%94+Pierre+Du+Moulin%2C+The+Novelty+of+Popery%2C+ch.+28&amp;url=https%3A%2F%2F5solasquotes.github.io%2Fquote%2F48f84ab3d4.html&amp;via=5Solas" target="_blank" rel="noopener">Share on X</a><a class="perma" href="../quote/48f84ab3d4.html">Permalink</a><span class="src none">No free online copy linked</span></div>
</figure><figure class="quote" id="q-83366dc9c8" data-kw="">
<blockquote><p>And the reasons the man adds of this his assertion contain the grand plea of all idolaters, heathenish and antichristian: &quot;Whatever is given to them,&quot; saith he, &quot;who are in that subordination is given to God.&quot; So said the Pagans of old, so say the Papists at this day; all redounds to the glory of God, when they worship stocks and stones, because he appoints them so to do. And so said the Israelites when they worshipped the golden calf: &quot;It is a feast to Jehovah.&quot;</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/john-owen.html">John Owen</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Vindiciae Evangelicae</cite>, ch. 19</span></figcaption>

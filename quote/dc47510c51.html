<main class="wrap"><figure class="quote" id="q-dc47510c51" data-kw="">
<blockquote><p>The sum, in general, of what this author opposeth with so much clamour is, That divine revelation is the sole rule of divine religious worship; an assertion that, in its latitude of expression, hath been acknowledged in and by all nations and people. The very heathen admitted it of old, as shall be manifested, if need require, by instances sufficient; for though they framed many gods, in their foolish, darkened imaginations, yet they thought that every one of them would be worshipped according to his own mind, direction, and prescription. So did, and I think do, Christians generally believe. Only, some have a mind to pare this generally-avowed principle, to curb it, and order it so, by distinctions and restrictions, that it may serve their turn and consist with their interest; for an opposition unto it nakedly, directly, and expressly, few have had the confidence yet to make. And the Nonconformists need not go one step farther in the expression of their judgments and principles in this matter; for who shall compel them to take their adversaries, distinctions (which have been invented and used by the most learned of them) of “substantial and accidental, proper and reductive, primitive and accessary, direct and consequential, intrinsic and circumstantial worship,” and the like, for the most part, unintelligible terms, in their application unto the state of the question? If men have a mind, let them oppose this thesis as laid down; if not, let them let it alone: and they who shall undertake the confirmation of it will no doubt carry it through the briers of those unscriptural distinctions. And that this author may be the better instructed in his future work, I shall give him a farther account of the terms of the assertion laid down.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/john-owen.html">John Owen</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Truth And Innocence Vindicated in The Works of John Owen</cite>, ed. William H. Goold, vol. 13 (Edinburgh: T&amp;T Clark, n.d.), 465.</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/worship.html">Worship</a></span></div>

<blockquote><p>The mortality in our perish is not over yet, though I hoped my child had closed it: but just while I was writing this, I heard of the death of a mother of four small children… carried off at night by a sickness, so far as I could understand, not above two hours long long. Alas! we have provoked our God. By the awful voice of Providence continuing, I was led to Zech. 12:12, ‘And the land shall mourn, every family apart,’ etc., on which I dwelt from 11th March till 20th May; and for some time after, on Ps. 126:5, ‘They that sow in tears, shall reap in joy.’ Upon the former of these I pressed the duty of personal and family fasting, among other things. And this was not without fruit. I knew that some were engaged in these duties; particularly James Biggar’s family, on which the hand of the Lord lay long and heavy, and carried off several of them…</p></blockquote>

<blockquote><p>III. Whether the Christian Sabbath requires a day of twenty-four hours, or a νυχθήμερον [a night-and-day]? [VI.C.1. The Thesis: The Day, Not the Night, Is Properly the Sabbath] Answer: I see this asserted by some, but I require the reasons. This is of the substance of the Sabbath: that a day of rest succeed six working days. But those working days are the courses of the sun above the earth; nor does the night make a part thereof, according to that saying: “I must work the works of Him that sent me, while it is day” (John 9:4), and John 11:9, and Psalm 104:22–23 [recte v. 22ff.]. Now that the Jews observed a night-and-day rest, and indeed beginning from evening, contributed nothing to its substantial sanctification and proportional partition of labor and rest. For ordinary human labor is destined for the day—that is, that space of time which is distinct from the night—as from the passages John 9:4; Psalm 104 just cited, and from the common light of nature and universal experience, I judge to be evident. Nor is it an objection that extraordinary cases of necessity sometimes require the labors of men both by night and by day. The same we also freely concede concerning the nocturnal treatment and meditation of sacred things, or the prolongation thereof into the late hours of the night (Acts 20:9), a particular case so requiring. But as it cannot be inferred thence that individual nights, equally as days, are to be spent in ordinary labours, excluding all sleep, so from the virtue of the partition prescribed in the Decalogue it cannot be inferred that the entire night preceding the Sabbath is ordinarily to be devoted to sacred exercises equally as the day. Such sabbatizing would savor of the nocturnal vigils once introduced into the Church ἀλόγως [irrationally] from some extraordinary occasion, and afterward λογίως [rationally] abrogated—the remnants or surrogates of which still survive in Popery today. Concerning which, see Hospinian, On Feasts, chapter 7. [VI.C.2. Objection I: The Commencement of the Sabbath from Evening] But perhaps someone will say: 1. Objection. The commencement of the Sabbath from the preceding evening was expressly enjoined upon the Israelites; therefore the night is equally the Sabbath of the Lord [Sabbathum Jehova] as the day is the day of the Lord [dies Domini]. Answer: 1. I grant that rest was enjoined—namely, rest and abstinence from ordinary labor—because this is the conditio sine qua non [condition without which not], or as it were the removing of the impediment to Sabbath preparation and observance. For commonly men through the sleeplessness and labor of that night are rendered unfit for vigorously performing the exercises of piety on the following day, so that the Sabbath is to them more a burden, δύσβατον [hard to walk], than עֹנֶג [oneg], that is, delights (Isaiah 58:13). But I deny that the sleep or rest of sleep was prohibited, and that a vigil and sanctification of that night through labor in divine worship and exercises of piety, both public and private, was enjoined. 2. Granting that rest itself was, by divine institution, a sacred part or a part of the sanctification of the Israelite Sabbath, and indeed equally through the night destined for sleep as through the day destined for the works of divine worship: yet it does not follow thence that this circumstantial and accessory element pertains to the substance of the weekly Sabbath instituted from the beginning of the world, and consequently is moral and immutable, by which we are bound equally as the Israelites. It suffices that rest from labors be observed by us in general and materially, as a condition without which not—although it be not believed to be formally and properly holy, formally as a sacred rest from ordinary labor both negatively (by ceasing from work) and positively (through sleep) after the manner of an economical sanctity. Whatever may be the case concerning rest under the Old Testament (about which I do not wish here anxiously to inquire), at least under the New Testament I judge that no rest from labour is to be adorned with the name of virtue, good work, and holiness in itself and of itself, but only in order to another thing—namely, that we may wholly and expressly devote ourselves to divine worship and sanctify that day with spiritual exercises. And thus I judge that sufficient provision is made for the practice of Sabbath sanctification against all profanations—in the same manner as we judge, concerning the matter of religious fasting, about abstinence from food. What, moreover, is commanded in the fourth precept concerning the rest of beasts of burden, that is ordered to the rest of men—without which the Sabbath cannot be solemnly sanctified or holily spent with spiritual works. [VI.C.3. Objection II: The Consequence for Nations with Continuous Night] 2. Objection. Hence it would follow that no Sabbath whatsoever is to be kept for certain months by those nations for whom there is then a continuous night. But this is absurd. Answer: This is the objection of Thomas Shepard, who in his English treatise entitled Theses Sabbaticae, pt. 2, inquires into the commencement of the Sabbath beyond other writers. We deny the consequence. For those nations can and ought, just as they separate their working days in those long darknesses from the nights or ordinary time of rest, so also separate and observe the seventh day as free from ordinary works and occupied with divine worship. This simple opinion of mine on this question I think will satisfy those who are solely solicitous about the practice of piety and the Sabbath.</p></blockquote>

ch, see Hospinian, On Feasts, chapter 7. [VI.C.2. Objection I: The Commencement of the Sabbath from Evening] But perhaps someone will say: 1. Objection. The commencement of the Sabbath from the preceding evening was expressly enjoined upon the Israelites; therefore the night is equally the Sabbath of the Lord [Sabbathum Jehova] as the day is the day of the Lord [dies Domini]. Answer: 1. I grant that rest was enjoined—namely, rest and abstinence from ordinary labor—because this is the conditio sine qua non [condition without which not], or as it were the removing of the impediment to Sabbath preparation and observance. For commonly men through the sleeplessness and labor of that night are rendered unfit for vigorously performing the exercises of piety on the following day, so that the Sabbath is to them more a burden, δύσβατον [hard to walk], than עֹנֶג [oneg], that is, delights (Isaiah 58:13). But I deny that the sleep or rest of sleep was prohibited, and that a vigil and sanctification of that night through labor in divine worship and exercises of piety, both public and private, was enjoined. 2. Granting that rest itself was, by divine institution, a sacred part or a part of the sanctification of the Israelite Sabbath, and indeed equally through the night destined for sleep as through the day destined for the works of divine worship: yet it does not follow thence that this circumstantial and accessory element pertains to the substance of the weekly Sabbath instituted from the beginning of the world, and consequently is moral and immutable, by which we are bound equally as the Israelites. It suffices that rest from labors be observed by us in general and materially, as a condition without which not—although it be not believed to be formally and properly holy, formally as a sacred rest from ordinary labor both negatively (by ceasing from work) and positively (through sleep) after the manner of an economical sanctity. Whatever may be the case concerning rest under the Old Testament (about which I do not wish here anxiously to inquire), at least under the New Testament I judge that no rest from labour is to be adorned with the name of virtue, good work, and holiness in itself and of itself, but only in order to another thing—namely, that we may wholly and expressly devote ourselves to divine worship and sanctify that day with spiritual exercises. And thus I judge that sufficient provision is made for the practice of Sabbath sanctification against all profanations—in the same manner as we judge, concerning the matter of religious fasting, about abstinence from food. What, moreover, is commanded in the fourth precept concerning the rest of beasts of burden, that is ordered to the rest of men—without which the Sabbath cannot be solemnly sanctified or holily spent with spiritual works. [VI.C.3. Objection II: The Consequence for Nations with Continuous Night] 2. Objection. Hence it would follow that no Sabbath whatsoever is to be kept for certain months by those nations for whom there is then a continuous night. But this is absurd. Answer: This is the objection of Thomas Shepard, who in his English treatise entitled Theses Sabbaticae, pt. 2, inquires into the commencement of the Sabbath beyond other writers. We deny the consequence. For those nations can and ought, just as they separate their working days in those long darknesses from the nights or ordinary time of rest, so also separate and observe the seventh day as free from ordinary works and occupied with divine worship. This simple opinion of mine on this question I think will satisfy those who are solely solicitous about the practice of piety and the Sabbath.”

— Gisbertus Voetius, Select Theological Disputations (Utrecht, Johannis à Waesberge, 1659), vol. 3, ‘On the Sabbath &amp; Feasts’, Problem III: Whether the Christian Sabbath Requires a Day of Twenty-Four Hours tr. AI by">Copy</button><a class="share" href="https://x.com/intent/post?text=%E2%80%9CIII.+Whether+the+Christian+Sabbath+requires+a+day+of+twenty-four+hours%2C+or+a+%CE%BD%CF%85%CF%87%CE%B8%CE%AE%CE%BC%CE%B5%CF%81%CE%BF%CE%BD+%5Ba+night-and-day%5D%3F+%5BVI.C.1.+The+Thesis%3A+The+Day%2C+Not+the+Night%2C+Is+Properly+the+Sabbath%5D+Answer%3A+I+see+this+asserted+by+some%2C+but+I+require+the+reasons.+This+is+of+the+substance+of+the+Sabbath%3A+that+a+day+of+rest+succeed+six+working+days.+But+those+working+days+are+the+courses+of+the+sun+above+the+earth%3B+nor+does+the+night+make+a+part+thereof%2C+according+to+that+saying%3A+%E2%80%9CI+must+work+the+works+of+Him+that+sent+me%2C+while+it+is+day%E2%80%9D+%28John+9%3A4%29%2C+and+John+11%3A9%2C+and+Psalm+104%3A22%E2%80%9323+%5Brecte+v.+22ff.%5D.+Now+that+the+Jews+observed+a+night-and-day+rest%2C+and+indeed+beginning+from+evening%2C+contributed+nothing+to+its+substantial+sanctification+and+proportional+partition+of+labor+and+rest.+For+ordinary+human+labor+is+destined+for+the+day%E2%80%94that+is%2C+that+space+of+time+which+is+distinct+from+the+night%E2%80%94as+from+the+passages+John+9%3A4%3B+Psalm+104+just+cited%2C+and+from+the+common+light+of+nature+and+universal+experience%2C+I+judge+to+be+evident.+Nor+is+it+an+objection+that+extraordinary+cases+of+necessity+sometimes+require+the+labors+of+men+both+by+night+and+by+day.+The+same+we+also+freely+concede+concerning+the+nocturnal+treatment+and+meditation+of+sacred+things%2C+or+the+prolongation+thereof+into+the+late+hours+of+the+night+%28Acts+20%3A9%29%2C+a+particular+case+so+requiring.+But+as+it+cannot+be+inferred+thence+that+individual+nights%2C+equally+as+days%2C+are+to+be+spent+in+ordinary+labours%2C+excluding+all+sleep%2C+so+from+the+virtue+of+the+partition+prescribed+in+the+Decalogue+it+cannot+be+inferred+that+the+entire+night+preceding+the+Sabbath+is+ordinarily+to+be+devoted+to+sacred+exercises+equally+as+the+day.+Such+sabbatizing+would+savor+of+the+nocturnal+vigils+once+introduced+into+the+Church+%E1%BC%80%CE%BB%CF%8C%CE%B3%CF%89%CF%82+%5Birrationally%5D+from+some+extraordinary+occasion%2C+and+afterward+%CE%BB%CE%BF%CE%B3%CE%AF%CF%89%CF%82+%5Brationally%5D+abrogated%E2%80%94the+remnants+or+surrogates+of+which+still+survive+in+Popery+today.+Concerning+which%2C+see+Hospinian%2C+On+Feasts%2C+chapter+7.+%5BVI.C.2.+Objection+I%3A+The+Commencement+of+the+Sabbath+from+Evening%5D+But+perhaps+someone+will+say%3A+1.+Objection.+The+commencement+of+the+Sabbath+from+the+preceding+evening+was+expressly+enjoined+upon+the+Israelites%3B+therefore+the+night+is+equally+the+Sabbath+of+the+Lord+%5BSabbathum+Jehova%5D+as+the+day+is+the+day+of+the+Lord+%5Bdies+Domini%5D.+Answer%3A+1.+I+grant+that+rest+was+enjoined%E2%80%94namely%2C+rest+and+abstinence+from+ordinary+labor%E2%80%94because+this+is+the+conditio+sine+qua+non+%5Bcondition+without+which+not%5D%2C+or+as+it+were+the+removing+of+the+impediment+to+Sabbath+preparation+and+observance.+For+commonly+men+through+the+sleeplessness+and+labor+of+that+night+are+rendered+unfit+for+vigorously+performing+the+exercises+of+piety+on+the+following+day%2C+so+that+the+Sabbath+is+to+them+more+a+burden%2C+%CE%B4%CF%8D%CF%83%CE%B2%CE%B1%CF%84%CE%BF%CE%BD+%5Bhard+to+walk%5D%2C+than+%D7%A2%D6%B9%D7%A0%D6%B6%D7%92+%5Boneg%5D%2C+that+is%2C+delights+%28Isaiah+58%3A13%29.+But+I+deny+that+the+sleep+or+rest+of+sleep+was+prohibited%2C+and+that+a+vigil+and+sanctification+of+that+night+through+labor+in+divine+worship+and+exercises+of+piety%2C+both+public+and+private%2C+was+enjoined.+2.+Granting+that+rest+itself+was%2C+by+divine+institution%2C+a+sacred+part+or+a+part+of+the+sanctification+of+the+Israelite+Sabbath%2C+and+indeed+equally+through+the+night+destined+for+sleep+as+through+the+day+destined+for+the+works+of+divine+worship%3A+yet+it+does+not+follow+thence+that+this+circumstantial+and+accessory+element+pertains+to+the+substance+of+the+weekly+Sabbath+instituted+from+the+beginning+of+the+world%2C+and+consequently+is+moral+and+immutable%2C+by+which+we+are+bound+equally+as+the+Israelites.+It+suffices+that+rest+from+labors+be+observed+by+us+in+general+and+materially%2C+as+a+condition+without+which+not%E2%80%94although+it+be+not+believed+to+be+formally+and+properly+holy%2C+formally+as+a+sacred+rest+from+ordinary+labor+both+negatively+%28by+ceasing+from+work%29+and+positively+%28through+sleep%29+after+the+manner+of+an+economical+sanctity.+Whatever+may+be+the+case+concerning+rest+under+the+Old+Testament+%28about+which+I+do+not+wish+here+anxiously+to+inquire%29%2C+at+least+under+the+New+Testament+I+judge+that+no+rest+from+labour+is+to+be+adorned+with+the+name+of+virtue%2C+good+work%2C+and+holiness+in+itself+and+of+itself%2C+but+only+in+order+to+another+thing%E2%80%94namely%2C+that+we+may+wholly+and+expressly+devote+ourselves+to+divine+worship+and+sanctify+that+day+with+spiritual+exercises.+And+thus+I+judge+that+sufficient+provision+is+made+for+the+practice+of+Sabbath+sanctification+against+all+profanations%E2%80%94in+the+same+manner+as+we+judge%2C+concerning+the+matter+of+religious+fasting%2C+about+abstinence+from+food.+What%2C+moreover%2C+is+commanded+in+the+fourth+precept+concerning+the+rest+of+beasts+of+burden%2C+that+is+ordered+to+the+rest+of+men%E2%80%94without+which+the+Sabbath+cannot+be+solemnly+sanctified+or+holily+spent+with+spiritual+works.+%5BVI.C.3.+Objection+II%3A+The+Consequence+for+Nations+with+Continuous+Night%5D+2.+Objection.+Hence+it+would+follow+that+no+Sabbath+whatsoever+is+to+be+kept+for+certain+months+by+those+nations+for+whom+there+is+then+a+continuous+night.+But+this+is+absurd.+Answer%3A+This+is+the+objection+of+Thomas+Shepard%2C+who+in+his+English+treatise+entitled+Theses+Sabbaticae%2C+pt.+2%2C+inquires+into+the+commencement+of+the+Sabbath+beyond+other+writers.+We+deny+the+consequence.+For+those+nations+can+and+ought%2C+just+as+they+separate+their+working+days+in+those+long+darknesses+from+the+nights+or+ordinary+time+of+rest%2C+so+also+separate+and+observe+the+seventh+day+as+free+from+ordinary+works+and+occupied+with+divine+worship.+This+simple+opinion+of+mine+on+this+question+I+think+will+satisfy+those+who+are+solely+solicitous+about+the+practice+of+piety+and+the+Sabbath.%E2%80%9D%0A%0A%E2%80%94+Gisbertus+Voetius%2C+Select+Theological+Disputations+%28Utrecht%2C+Johannis+%C3%A0+Waesberge%2C+1659%29%2C+vol.+3%2C+%E2%80%98On+the+Sabbath+%26+Feasts%E2%80%99%2C+Problem+III%3A+Whether+the+Christian+Sabbath+Requires+a+Day+of+Twenty-Four+Hours+tr.+AI+by&amp;url=https%3A%2F%2F5solasquotes.github.io%2Fquote%2F78e5d22c91.html&amp;via=5Solas" target="_blank" rel="noopener">Share on X</a><a class="perma" href="../quote/78e5d22c91.html">Permalink</a><a class="src" href="https://reformedbooksonline.com/topics/topics-by-subject/the-lords-day/the-whole-lords-day-is-sanctified/#:~:text=III.%20Whether%20the%20Christian%20Sabbath%20requires,practice%20of%20piety%20and%20the%20Sabbath&amp;text=III.%20Whether%20the%20Christian%20Sabbath%20requires%20a%20day&amp;text=about%20the%20practice%20of%20piety%20and%20the%20Sabbath" rel="noopener" target="_blank">Read it online · Reformed Books Online</a></div>

<main class="wrap"><figure class="quote" id="q-544f430d4d" data-kw="">
<blockquote><p>All obedience to men is limited thus, that it be in the Lord, and with regard to His supremacy; and therefore, no authority can oblige to the obedience of any command that crosses His. Authority is primitively and originally in God, and He gives not His glory to another. He gives not away any of His peculiar authority to man, but substitutes Him; and our first tie is to God, as His creatures, and this is universal.

The greatest kings are His vassals, and owe Him homage, and no authority derived from Him, can free us from that which we owe to Himself There is a straight line of subordination, and if superiors leave this, we are to adhere to it, looking directly to God, keeping our station.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/robert-leighton.html">Robert Leighton</a></span><span class="wk"><span class="lbl">Work:</span> <cite>An Exposition of the Ten Commandments</cite>, (1701) in The Whole Works of the Most Reverend Father in God, Robert Leighton, D.D., Archbishop of Glasgow (2 vols, London: James Duncan, 1828), 2: 385.</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/church-government-and-the-ministry.html">Church Government and the Ministry</a></span></div>

</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-e9d125e39c" data-kw="">
<blockquote><p>And with respect to the government of Christ’s house, alas! the generality of the present age seem to be agreed, that it is a matter of mere indifferency and moonshine, whether a person be of the Episcopalian, Independent, or Presbyterial way of thinking about it; although it is the declared principle of this church, founded on the word of God, solemnly sworn unto and sealed by the blood of many of the Lord’s witnesses, That the spiritual power and authority, is lodged, neither in the hand of the civil magistrate, not in the community of the faithful, as they call them, but in church officers, ministers and elders acting in parity, and judicatories subordinate to one another. Now, we say that a faithful minister of Christ is set for the defence of the gospel, namely, both for the defence of gospel-truth, and likewise of the hedge of government, which the glorious Head hath set about it.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/ebenezer-erskine.html">Ebenezer Erskine</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The character of a faithful minister of Christ in The works of Ebenezer Erskine</cite></span></figcaption>

</figure><figure class="quote" id="q-de8f816fdc" data-kw="">
<blockquote><p>This system also conflicts with Scripture, which recognizes no such primacy of Peter as that on which the system is built, and distinctly recognizes the voice of the people in ecclesiastical affairs. Moreover, the claim of the Roman Catholic Church, that there has been an unbroken line of succession from the time of Peter down to the present day, is contradicted by history. The papal system is, both exegetically and historically, untenable.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/louis-berkhof.html">Louis Berkhof</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Systematic Theology</cite>, pt. 5, “The Government of the Church”</span></figcaption>

</figure><figure class="quote" id="q-0d872d61bf" data-kw="">
<blockquote><p>That this confounding both of the titles and offices of bishop and presbyter [as synonymous], will be found agreeable to the most pure primitive times. It is true, within some few ages, difference was made between bishops and presbyters in the Church; yet was never that distinction counted by them to be jure divino, or by the Law of God; but as a thing belonging to order in the Church, and brought in by custom: which was, that he who was of greatest age and respect, and did preside in the meetings, was particularly called bishop, which afterward was established by some Councils… not only Jerome was of that mind with Aerius (whose opinion was that the bishop and the presbyter were equal and the same) but also, that Ambrosius, Augustinus, Sedulius, Primasius, Chrysostomus, Theoderetus, Oecumenius and Theophilactus were of that same mind… If it be asked, How this distinction [between presbyter and bishop] did enter? He [Jerome] answers in that epistle [to Evagrius]… that when afterward one came to be elected and preferred to the rest, it was done for the remedy of schism.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/james-durham.html">James Durham</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Other citations (work not named)</cite>, Lecture 3, ‘Concerning the Identity of Angel, Bishop &amp; Presbyter’ in A Commentary upon the Book of the Revelation, (Edinburgh, 1658), pp. 223-33, p. 225</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/church-government-and-the-ministry/forms-of-government.html">Forms of Government</a></span></div>

<main class="wrap"><figure class="quote" id="q-487c7dba5b" data-kw="">
<blockquote><p>But it is not simply with respect to his divinity that St. Paul speaks after this manner. For God is not only the Father of Christ with regard to his divinity by the eternal generation of the Logos, or Word, who is adorable fruit of his divine mind; but he is also the Father of his holy humanity by the incarnation, that is to say, by the personal union of two natures in the Redeemer.

For as on account of this adorable union the blessed virgin is called the mother of God, that which was conceived in her being God in unity of person; so, for the same reason, the Eternal Father is the Father of the son of Mary, because he, whom God had begotten in his bosom before all ages, is truly man in one and the same person.

It was for this reason that, in the ninth century, one Felix, of Urgel, and some other bishops of Spain, having taught that Jesus, as a man, was the adopted Son of God, and that only, Charlemagne immediately assembly a council, by which this error was condemned. And, besides, that great emperor himself, who certainly very much liked theology, wrote against that false doctrine, proving that the man Christ Jesus was the true and proper Son of God, as well as the Son of the virgin.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/pierre-du-bosc.html">Pierre Du Bosc</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Protestantism. Being a Series of Discourses on a Portion of the Epistle to the Ephesians</cite>, trans. J. B. Law (1699; London: A. Hall, Virtue, &amp; Co., 1853), pp 116-18.</span></figcaption>

</figure><figure class="quote" id="q-a2863a5000" data-kw="Judge of controversies">
<blockquote><p>It is not necessary that there should be in the church any external infallible judge by whom controversies of faith may be solved. It suffices for believers, for the tranquility and rest of their consciences, that there is an interior or divine definitive judgment (namely, of Christ and the Holy Spirit speaking in the Scriptures). An external human judgment, infallible and definitive in the church, is neither necessary nor possible. Controversies do not belong to external order but to the mental judgment for which a judge is necessary to enlighten the mind and sanctify the will (which an external and human judge cannot do because he has no power over the conscience).</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/francis-turretin.html">Francis Turretin</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Institutes of Elenctic Theology</cite>, 18.33.23</span></figcaption>

</figure><figure class="quote" id="q-33fb3b11d1" data-kw="">
<blockquote><p>We make our prayers in that tongue which all our people, as meet is, may understand, to the end they may (as Paul counselleth us) take common commodity by common prayer, even as all the holy fathers and Catholic bishops, both in the Old and New Testament, did used to pray themselves, and taught the people to pray too, lest, as Augustine saith, &quot;like parrots and ousels we should seem to speak that we understand not.&quot; Neither have we any other mediator and intercessor, by whom we may have access to God the Father, than Jesus Christ, in whose only Name all things are obtained at His Father&#x27;s hand.</p></blockquote>

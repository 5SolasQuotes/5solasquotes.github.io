<main class="wrap"><figure class="quote" id="q-19b268feb7" data-kw="">
<blockquote><p>The first is, how we may discern whether particular men and particular Churches holding errors, be found members of the Catholic church or no. For the answering of this, we must make a double distinction, one of errors, the other of persons that err. Of errors, some are destroyers of the faith, some only weakners of it.

A destroyer is that, which overturneth any fundamental point of religion; which is of that nature, that if it be denied, religion it self is overturned; as the denial of the death of Christ, and the immortality of the soul, justification by works, and such like: and the sum of these fundamental points is comprised in the Creed of the Apostles and the Decalogue. A weakening error is that, the holding whereof doth not overturn any point in the foundation of salvation; as the error of freewill, and sundry such like.

This distinction is made by the holy Ghost, who saith expressly that the doctrines of repentance, and faith, and baptisms, and laying on of hands, and the resurrection, and the last judgement, are the foundation, namely of religion: and again, that Christ is the foundation, and that other doctrines consonant to the word, are as gold and silver laid thereupon.

Secondly, persons erring, are of two sorts: some err of weakness, being carried away by others; or of simple ignorance, not yet being convicted and informed concerning the truth. Some again err of obstinacy, or affected ignorance, which having been admonished and convicted, still persevere in their forged opinions.

This being said, we now come to the point. If any man or Church, shall hold an error of the lighter kind, he still remains a member of the Church of God, and so must be reputed of us. As when a Lutheran shall hold, that images are still to be retained in the church; that there is an Universal Election of all men, &amp;c. for these and such like opinions may be maintained, the foundation of salvation unrased.

This which I say is flatly avouched by Paul. If any man (saith he) build on this foundation gold, silver, precious stones; timber, hay, or stubble, his work shall be made manifest by the fire, &amp;c. and if any man’s work burn, he shall lose, but yet he shall be safe himself. And therefore the hay and stubble of men’s errors that are beside the foundation, on which they are laid, do not debar them from being Christians or members of the church.

A man breaks down the windows of his house; the house stands: he breaks down the roof or the walls; the house yet stands, though deformed: he pulls up the foundation; the house it self falls and ceaseth to be an house. Now religion which we profess is like an house or building: and some points thereof are like windows, doors, walls, roofs, and some are the very foundation: and the former may be battered, the foundation standing.

Again, if the error be directly or by necessary consequent, even in common sense against the foundation, consideration must be had whether the Church or party erreth of weakness or malice: if of weakness, the party is to be esteemed as a member of the Catholic church. And thus Paul writes unto the church of Galatia, as to a church of God, though by false teachers it had been turned away to another Gospel, and embraced the fundamental error of justification by works.

But when any man or church shall hold fundamental errors in obstinacy or affected ignorance, we are not then bound to repute them any longer as churches or Christians, but as such to whom condemnation belongs, as Paul sheweth by the example of Jannes and Jambres. And as Jannes and Jambres, saith he, withstood Moses, so do these also resist the truth, men of corrupt minds, reprobate concerning the faith.

Yet withal, this caveat must ever be remembered, that we rather condemn the error then the person that erreth, because Gods mercy is like a bottomless sea, whereby he worketh what he will and when he will in the hearts of miserable sinners.</p></blockquote>

<blockquote><p>10. We have said that the symbols by which the Church is discerned are the preaching of the Word and the observance of the sacraments, for these cannot any where exist without producing fruit and prospering by the blessing of God… When the preaching of the gospel is reverently heard, and the sacraments are not neglected, there for the time the face of the Church appears without deception or ambiguity; and no man may with impunity spurn her authority… far less revolt from her, and violate her unity, (see Chap. II, sec. 1, 10, and Chap. VIII, sec. 12). For such is the value which the Lord sets on the communion of his Church, that all who contumaciously alienate themselves from any Christian society, in which the true ministry of his Word and sacraments is maintained, He regards as deserters of religion. So highly does He recommend her authority, that when it is violated He considers that his own authority is impaired. For there is no small weight in the designation given to her, “the house of God,” “the pillar and ground of the truth,” (1 Tim. 3:15)… 11… How perilous, then, nay, how fatal the temptation, when we even entertain a thought of separating ourselves from that assembly in which are beheld the signs and badges which the Lord has deemed sufficient to characterise his Church!… If it holds the order instituted by the Lord in Word and sacraments there will be no deception; we may safely pay it the honour due to a church: on the other hand, if it exhibit itself without Word and sacraments, we must in this case be no less careful to avoid the imposture… 12… in the administration of word and sacraments defects may creep in which ought not to alienate us from Its communion. For all the heads of true doctrine are not in the same position. Some are so necessary to be known, that all must hold them to be fixed and undoubted as the proper essentials of religion: for instance, that God is one, that Christ is God, and the Son of God, that our salvation depends on the mercy of God, and the like. Others, again, which are the subject of controversy among the churches, do not destroy the unity of the faith…</p></blockquote>

<blockquote><p>I. Although from what has been said in the preceding question concerning the obscurity of the church, it is easy to answer the proposed question (for if the church can sometimes be so obscured and concealed as to the nowhere conspicuous on the earth—which our opponents themselves acknowledge concerning the times of antichrist—why can we not say that our church certainly existed, but it was latent and obscured?) Because they do not cease to press us over and over again with this question in order to prove that our church did not exist at all at that time. Since it cannot be shown where it was, it was thus a novelty and of recent origin. We must see what reply must be given to such a postulate.

II. However, here before all things it must be observed: (1) that by our church (or the Reformed Church) is not meant that which by express title and notion was distinguished from other assemblies, but which by consanguinity and profession of the same doctrine as to articles of faith and true ecclesiastical communion was the same with hours of today. (2) The true and catholic doctrine is here to be distinguished from discipline, and ceremonies from dogmas, and in the dogmas the questions and maxims of the schools; or the private opinions of doctors are are to be distinguished from the necessary articles of faith to be embraced by the common faith of the church. Again, among those things which the church prescribes, some are of divine right (which are absolutely necessary to faith and salvation, in which the essence of Christianity consists); others are of positive right (which are indeed useful, but nevertheless so that nothing prohibits their being changed and reconstructed in the progress of time).

III. Before we answer the question, however, the absurdity and unfairness of the demand must be marked. First, it supposes a false hypothesis, which is the prime error (πρωτον ψευδος) of our opponents. Once this is denied and overthrown, whatever is built upon it must necessarily fall in like manner—namely, that the true church ought always to exist in the world with perpetual splendor. Since we have in the preceding question proved this to be most false and it is evident that there are times like that of Elijah in which the church lies hidden and is withdrawn from the sight of men, in vain are we asked to show where our church was. For it could lie hidden without splendor and prominence.</p></blockquote>

<div class="actions"><button class="copy" data-copy="“I. Although from what has been said in the preceding question concerning the obscurity of the church, it is easy to answer the proposed question (for if the church can sometimes be so obscured and concealed as to the nowhere conspicuous on the earth—which our opponents themselves acknowledge concerning the times of antichrist—why can we not say that our church certainly existed, but it was latent and obscured?) Because they do not cease to press us over and over again with this question in order to prove that our church did not exist at all at that time. Since it cannot be shown where it was, it was thus a novelty and of recent origin. We must see what reply must be given to such a postulate.

II. However, here before all things it must be observed: (1) that by our church (or the Reformed Church) is not meant that which by express title and notion was distinguished from other assemblies, but which by consanguinity and profession of the same doctrine as to articles of faith and true ecclesiastical communion was the same with hours of today. (2) The true and catholic doctrine is here to be distinguished from discipline, and ceremonies from dogmas, and in the dogmas the questions and maxims of the schools; or the private opinions of doctors are are to be distinguished from the necessary articles of faith to be embraced by the common faith of the church. Again, among those things which the church prescribes, some are of divine right (which are absolutely necessary to faith and salvation, in which the essence of Christianity consists); others are of positive right (which are indeed useful, but nevertheless so that nothing prohibits their being changed and reconstructed in the progress of time).

III. Before we answer the question, however, the absurdity and unfairness of the demand must be marked. First, it supposes a false hypothesis, which is the prime error (πρωτον ψευδος) of our opponents. Once this is denied and overthrown, whatever is built upon it must necessarily fall in like manner—namely, that the true church ought always to exist in the world with perpetual splendor. Since we have in the preceding question proved this to be most false and it is evident that there are times like that of Elijah in which the church lies hidden and is withdrawn from the sight of men, in vain are we asked to show where our church was. For it could lie hidden without splendor and prominence.”

rness+of+the+demand+must+be+marked.+First%2C+it+supposes+a+false+hypothesis%2C+which+is+the+prime+error+%28%CF%80%CF%81%CF%89%CF%84%CE%BF%CE%BD+%CF%88%CE%B5%CF%85%CE%B4%CE%BF%CF%82%29+of+our+opponents.+Once+this+is+denied+and+overthrown%2C+whatever+is+built+upon+it+must+necessarily+fall+in+like+manner%E2%80%94namely%2C+that+the+true+church+ought+always+to+exist+in+the+world+with+perpetual+splendor.+Since+we+have+in+the+preceding+question+proved+this+to+be+most+false+and+it+is+evident+that+there+are+times+like+that+of+Elijah+in+which+the+church+lies+hidden+and+is+withdrawn+from+the+sight+of+men%2C+in+vain+are+we+asked+to+show+where+our+church+was.+For+it+could+lie+hidden+without+splendor+and+prominence.%E2%80%9D%0A%0A%E2%80%94+Francis+Turretin%2C+Institutes+of+Elenctic+Theology%2C+18.10.1%E2%80%933&amp;url=https%3A%2F%2F5solasquotes.github.io%2Fquote%2Fc5ca2861e3.html&amp;via=5Solas" target="_blank" rel="noopener">Share on X</a><a class="perma" href="../quote/c5ca2861e3.html">Permalink</a><a class="src" href="https://heidelblog.net/2022/08/turretin-the-true-church-has-always-existed/" rel="noopener" target="_blank">Read it online · Heidelblog</a></div>

<blockquote><p>Q. IV. What are the ends that I aim at in the great undertaking? … 3. I can appeal to God, that I have no design in the least to maintain a party, or to keep up any schismatical faction; my heart rises against the thoughts of it. I hate dividing principles and practices, and whatever others use, I am for peace and healing; and if my blood would be sufficient balsam, I would gladly part with the last drop of it, for the close up of the bleeding wounds of differences that are amongst true Christians. Peace is such a precious jewel, that I would give anything for it but truth. Those who are hot and bitter in their contendings for or against little things, and zealous in keeping up names of division and maintaining parties, are of a spirit which I understand not. Let not my soul come into their secret. My ends then are according to my principles, and I humbly appeal to God concerning the integrity of my heart in them.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/matthew-henry.html">Matthew Henry</a></span><span class="wk"><span class="lbl">Work:</span> <cite>‘Serious Self-Examination Before Ordination’</cite>, (1687) in the biographies of Henry by William Tong &amp; J.B. Williams</span></figcaption>

<blockquote><p>My mind being thus many years immersed in studies of this nature, and I having also long wearied myself in searching what fathers and schoolmen have said of such things before us, and my genius abhorring confusion and equivocals, I came by many years longer study to perceive that most of the doctrinal controversies among Protestants (that I say not in the Christian world) are far more about equivocal words than matter; and it wounded my soul to perceive what work both tyrannical and unskillful, disputing clergymen had made these thirteen hundred years in the world! And experience since the year 1643 till this year, 1675, has loudly called to me to repent of my own prejudices, sidings and censurings of causes and persons not understood, and of all the miscarriages of my ministry and life, which have been thereby caused; and to make it my chief work to call men that are within my hearing to more peaceable thoughts, affections and practices: And my endeavours have not been in vain, in that the ministers of the country where I lived, were very many of such a peaceable temper (though since cast out [at the Great Ejection, 1662]), (and a great number more through the land by God’s grace (rather than any endeavors of mine) are so minded). But the sons of the coal were exasperated the more against me, and accounted him to be against every man that called all men to love and peace, and was for no man as in a contrary way. And now looking daily in this posture, when God calls me hence (summoned by an incurable disease to hasten all that ever I will do in this world) being uncapable of prevailing with the present Church disturbers, I do apply myself to posterity, leaving them the sad warning of their ancestors’ distractions, as a pillar of salt, and acquainting them what I have found to be the cause of our calamities, and therein they will find the cure themselves.

II. I Have oft taken the boldness (constrainedly) to say that I doubt not but the contentions of the clergy have done far more hurt to the Christian world than the most bloody wars of princes. …

      13. No man is sufficiently apprehensive of the greatness of the curse in the confusion of tongues [Gen. 10]: whereby as we can preach but to few nations in the world, so we cannot intelligibly converse with one another. All words (being arbitrary signs) are ambiguous; And few disputers have the jealousy and skill which is necessary to discuss equivocations, and to agree of the meaning of all their terms before they use them in disputing: And so taking verbal differences for material, does keep up most of the wretched academical and theological wars of the world.

      14. And nothing here undoes all the world in point of wisdom, so much as over-hasty judging or prefidence: It is natural to almost all to fasten presently upon the first appearances and to be confident before they have half tried: In cases where seven and seven years serious study is necessary to a thorough digested knowledge, every novice will presently conclude as if he were sure. And then as everyone is apt to be confident, so to be tenacious; every error leading on more, and the reputation of the person being concerned in it, mutability being a shame: And so it becomes a very difficult thing to unlearn the errors once learned; as white paper is easier [to be] written on than that which is written on before.

      15. And then no man knows his own error (else it were no error), nor knows what another man’s perceptions are, nor what any other man knows more than he. 16…. And by all these means almost all are of the opinion of the country where they live, or of those that they most reverence, or which are most for their interest; and boldly condemn the rest not understood.</p></blockquote>

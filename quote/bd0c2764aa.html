<main class="wrap"><figure class="quote" id="q-bd0c2764aa" data-kw="">
<blockquote><p>This Command [to observe the Sabbath] was obligatory even in Paradise itself in the state of Innocency, and therefore contains nothing in it unworthy the state of a Christian. It is no Ceremonial Command, nor to be reckoned amongst those things which were typical, and prefigured Christ to come in the Flesh; and therefore neither was it abolish’d at his coming, but still there lies a strict and indispensable Obligation upon us to observe a Sabbath Holy unto the Lord.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/ezekiel-hopkins.html">Ezekiel Hopkins</a></span><span class="wk"><span class="lbl">Work:</span> <cite>An Exposition on the Ten Commandments: With Other Sermons</cite>, (London, 1692), p. 213.</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/worship.html">Worship</a></span></div>

<blockquote><p>Though making of images simply be not unlawful and discharged by this [2nd] Commandment, yet thereby every representation of God (who is the object to be worshipped) and every image religiously made use of in worship is condemned (though civil and political images and statues, which are used as ornaments, or badges of honor, or remembrancers of some fact, etc. be not condemned)… …images (otherwise lawful) when abused to idolatry become unlawful, and are not to be suffered but orderly to be removed, we call that more than a civil or a common use, when religious worship or reverence is purposely intended to them, or there is, by some one occasion or other, danger lest they may be so abused; and of this sort (viz. dangerous ones) are: 1. Images in places of worship, but it is not idolatry to have dead men’s images on their tombs or monuments in churches.</p></blockquote>

</figure><figure class="quote" id="q-1519ed2764" data-kw="">
<blockquote><p>When certain days are represented as holy in themselves, when one day is distinguished from another on religious grounds, when holy days are reckoned a part of divine worship, then days are improperly observed. The Jewish Sabbath, new moons, and other festivals, were earnestly pressed by the false apostles, because they had been appointed by the law. When we, in the present age, intake a distinction of days, we do not represent them as necessary, and thus lay a snare for the conscience; we do not reckon one day to be more holy than another; we do not make days to be the same thing with religion and the worship of God; but merely attend to the preservation of order and harmony. The observance of days among us is a free service, and void of all superstition.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/john-calvin.html">John Calvin</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Commentary on Galatians and Ephesians</cite>, 4:10</span></figcaption>

</figure><figure class="quote" id="q-eb4ed9ad21" data-kw="">
<blockquote><p>It is a very evil thing to halt in Religion. It is a very evil thing to be either a Neuter, or an Uterque, or a Waverer in Religion. Neutrality, without controversy, is not to be endured. The Prophet in his Dilemma takes it for granted, that there is no colourable plea for neutrality. If the Lord be God, follow him, &amp;c. he takes it for granted, that one of them must be worshipped; otherwise his reasoning had not been cogent: for they might have replied, Nay, but we will suspend, we perceive that we are in a snare. If we Serve Jehovah, we shall displease Ahab; and if we worship Baal, we shall offend you: it will be our wisdom to serve neither.

Honourable, and Beloved, in matters civil we have sometimes a latitude, and liberty of suspension: but in Religion there is a necessity of determination, and resolution.

The Scripture speaks out: Thou shalt fear the Lord thy God, and serve him, Deut. 6.13. As I live, saith the Lord, every knee shall bow to me, Isa. 45.23. As the Neuter is abominable, so the halting Uterque is not to be endured, that divideth between God, and Baal: God will not allow of any dividing either in the Object, or Terminus of worship: as he will be worshipped; so he will be worshipped solely. Thou shalt have no other Gods but me. The Lord is a jealous God, and will endure no co-rival. Jealousy is the rage of a man, and he will not spare in the day of his wrath, Prov. 6.34.35. God looks upon divided worship, as no worship. It is said of those Idolaters spoken of, 2 King. 17. in one vers. that they feared God, and worshipped their Idols: and in the vers. immediately following, That they feared not God, 2 King. 17.33.34. and 1 Zeph. 5. The Lord severely threatened such as did swear by the Lord, and by Malcham.

As the Lord cannot endure dividing in the Terminus of worship, so he hates dividing in the rule of worship, and the worship it self. The halting Uterque that makes the Scripture a partial rule of worship, that worshippeth God partly after the prescript of the word, and partly according to the Dictates of his own carnal reason, cannot perform any acceptable service to Almighty God. See thou do all things according to the pattern, was the command of God unto Moses, Heb. 8.5. Will-worship is vain worship. In vain do they worship me, teaching for doctrines, the commandments of men, Matth. 15.9. This corrupt mingling in Gods worship was prohibited, Levit. 19.19.

As God will be worshipped solely, and wholly, so he will be worshipped constantly: as he hates a Neuter, and Uterque, so he cannot endure a Waverer. The Lord commands us to hold fast our profession without wavering, Heb. 10.23. When we have proved all things, we must hold fast that which is good, 1 Thes. 5.21. Inconstancy in Religion is a very evil thing, whether you consider the sin of it, or the punishment which is due to it. It cometh from evil, it tends to evil. It cometh from evil, as from the general fountain of all actual sins; original corruption: so particularly from that evil heart of unbelief whereby we depart from the living God, Heb. 3.12.

It tends to evil both in respect of sin, and punishment. It is dishonourable unto God. It is a high impeachment of his glorious attributes. It wrongs God in his wisdom, justice, mercy, power, goodness, faithfulness, as if God were not worthy of our firmest resolutions, and most constant adherence; in a word, of our poor All; or, as if he were either unable, or unwilling to revenge himself upon inconstant halters. As it dishonours God, so it discredits Religion, it brings an ill report upon the holy ways of God, as those Spies brought an ill report upon the good Land of Canaan, as if the ways of God were unpleasant, or his service unprofitable.

As it is dishonourable unto God, and unto Religion, so it is hurtful unto themselves. It hurts the Wavering Christian in his conscience, if conscience be not in a dead sleep, it will speak bitter things unto the backslider: it will say unto him. If the Lord be not God, why dost thou serve him at all? and if he be God, and worthy of thy service, why dost thou not serve him always? The backslider in heart shall be filled with his own ways, Prov. 14.14. When (I say) conscience is thoroughly awakened, it will fill the soul with most exquisite torments.

It hurts us in our credits; what greater ignominy, then the brand of inconstancy? There goes a shifter, a turncoat, an Apostatizing hypocrite: what can render a man more stigmatically odious? what makes the devil so black, but his Apostasy? In a word, it hurts us temporally, and eternally: It subjects us to a thousand miseries in this life, and to everlasting punishment in the world to come. What are the causes of so many sad changes in our present outward condition? surely, this is not the least, even our changeableness in Religion: When they chose new Gods, then was war in the gates, Judg. 5.8. It subjects the soul, and body unto everlasting perdition in hell, there to endure the punishments both of loss, and sense.

It is a fearful thing to fall into the hands of the living God, who is a jealous God, and a consuming fire: such as draw back to unbelief, they do it to the perdition of their souls, Heb. 10.23.26.27.39. Nothing is more just then that Jesus Christ should deny us before God his Father, and all his holy Angels, and blessed Saints; if we deny him before men. The fearful and unbelieving shall be cast into the lake which burns with fire, and brimstone, which is the second death, Revel. 21.8.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/arthur-salwey.html">Arthur Salwey</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Halting stigmatized in a sermon preached to the Honorable House of Commons on the monthly fast day, Octob. 25. 1643. at Margaret’s Westminster</cite>, (London: Christopher Meredith, 1644), pp 8-12.</span></figcaption>

hat+they+feared+not+God%2C+2+King.+17.33.34.+and+1+Zeph.+5.+The+Lord+severely+threatened+such+as+did+swear+by+the+Lord%2C+and+by+Malcham.%0A%0AAs+the+Lord+cannot+endure+dividing+in+the+Terminus+of+worship%2C+so+he+hates+dividing+in+the+rule+of+worship%2C+and+the+worship+it+self.+The+halting+Uterque+that+makes+the+Scripture+a+partial+rule+of+worship%2C+that+worshippeth+God+partly+after+the+prescript+of+the+word%2C+and+partly+according+to+the+Dictates+of+his+own+carnal+reason%2C+cannot+perform+any+acceptable+service+to+Almighty+God.+See+thou+do+all+things+according+to+the+pattern%2C+was+the+command+of+God+unto+Moses%2C+Heb.+8.5.+Will-worship+is+vain+worship.+In+vain+do+they+worship+me%2C+teaching+for+doctrines%2C+the+commandments+of+men%2C+Matth.+15.9.+This+corrupt+mingling+in+Gods+worship+was+prohibited%2C+Levit.+19.19.%0A%0AAs+God+will+be+worshipped+solely%2C+and+wholly%2C+so+he+will+be+worshipped+constantly%3A+as+he+hates+a+Neuter%2C+and+Uterque%2C+so+he+cannot+endure+a+Waverer.+The+Lord+commands+us+to+hold+fast+our+profession+without+wavering%2C+Heb.+10.23.+When+we+have+proved+all+things%2C+we+must+hold+fast+that+which+is+good%2C+1+Thes.+5.21.+Inconstancy+in+Religion+is+a+very+evil+thing%2C+whether+you+consider+the+sin+of+it%2C+or+the+punishment+which+is+due+to+it.+It+cometh+from+evil%2C+it+tends+to+evil.+It+cometh+from+evil%2C+as+from+the+general+fountain+of+all+actual+sins%3B+original+corruption%3A+so+particularly+from+that+evil+heart+of+unbelief+whereby+we+depart+from+the+living+God%2C+Heb.+3.12.%0A%0AIt+tends+to+evil+both+in+respect+of+sin%2C+and+punishment.+It+is+dishonourable+unto+God.+It+is+a+high+impeachment+of+his+glorious+attributes.+It+wrongs+God+in+his+wisdom%2C+justice%2C+mercy%2C+power%2C+goodness%2C+faithfulness%2C+as+if+God+were+not+worthy+of+our+firmest+resolutions%2C+and+most+constant+adherence%3B+in+a+word%2C+of+our+poor+All%3B+or%2C+as+if+he+were+either+unable%2C+or+unwilling+to+revenge+himself+upon+inconstant+halters.+As+it+dishonours+God%2C+so+it+discredits+Religion%2C+it+brings+an+ill+report+upon+the+holy+ways+of+God%2C+as+those+Spies+brought+an+ill+report+upon+the+good+Land+of+Canaan%2C+as+if+the+ways+of+God+were+unpleasant%2C+or+his+service+unprofitable.%0A%0AAs+it+is+dishonourable+unto+God%2C+and+unto+Religion%2C+so+it+is+hurtful+unto+themselves.+It+hurts+the+Wavering+Christian+in+his+conscience%2C+if+conscience+be+not+in+a+dead+sleep%2C+it+will+speak+bitter+things+unto+the+backslider%3A+it+will+say+unto+him.+If+the+Lord+be+not+God%2C+why+dost+thou+serve+him+at+all%3F+and+if+he+be+God%2C+and+worthy+of+thy+service%2C+why+dost+thou+not+serve+him+always%3F+The+backslider+in+heart+shall+be+filled+with+his+own+ways%2C+Prov.+14.14.+When+%28I+say%29+conscience+is+thoroughly+awakened%2C+it+will+fill+the+soul+with+most+exquisite+torments.%0A%0AIt+hurts+us+in+our+credits%3B+what+greater+ignominy%2C+then+the+brand+of+inconstancy%3F+There+goes+a+shifter%2C+a+turncoat%2C+an+Apostatizing+hypocrite%3A+what+can+render+a+man+more+stigmatically+odious%3F+what+makes+the+devil+so+black%2C+but+his+Apostasy%3F+In+a+word%2C+it+hurts+us+temporally%2C+and+eternally%3A+It+subjects+us+to+a+thousand+miseries+in+this+life%2C+and+to+everlasting+punishment+in+the+world+to+come.+What+are+the+causes+of+so+many+sad+changes+in+our+present+outward+condition%3F+surely%2C+this+is+not+the+least%2C+even+our+changeableness+in+Religion%3A+When+they+chose+new+Gods%2C+then+was+war+in+the+gates%2C+Judg.+5.8.+It+subjects+the+soul%2C+and+body+unto+everlasting+perdition+in+hell%2C+there+to+endure+the+punishments+both+of+loss%2C+and+sense.%0A%0AIt+is+a+fearful+thing+to+fall+into+the+hands+of+the+living+God%2C+who+is+a+jealous+God%2C+and+a+consuming+fire%3A+such+as+draw+back+to+unbelief%2C+they+do+it+to+the+perdition+of+their+souls%2C+Heb.+10.23.26.27.39.+Nothing+is+more+just+then+that+Jesus+Christ+should+deny+us+before+God+his+Father%2C+and+all+his+holy+Angels%2C+and+blessed+Saints%3B+if+we+deny+him+before+men.+The+fearful+and+unbelieving+shall+be+cast+into+the+lake+which+burns+with+fire%2C+and+brimstone%2C+which+is+the+second+death%2C+Revel.+21.8.%E2%80%9D%0A%0A%E2%80%94+Arthur+Salwey%2C+Halting+stigmatized+in+a+sermon+preached+to+the+Honorable+House+of+Commons+on+the+monthly+fast+day%2C+Octob.+25.+1643.+at+Margaret%E2%80%99s+Westminster%2C+%28London%3A+Christopher+Meredith%2C+1644%29%2C+pp+8-12.&amp;url=https%3A%2F%2F5solasquotes.github.io%2Fquote%2Feb4ed9ad21.html&amp;via=5Solas" target="_blank" rel="noopener">Share on X</a><a class="perma" href="../quote/eb4ed9ad21.html">Permalink</a><a class="src" href="https://reformedcovenanter.wordpress.com/2021/11/24/arthur-salwey-on-the-evil-of-neutrality-in-religion/" rel="noopener" target="_blank">Read it online · Reformed Covenanter</a></div>

<blockquote><p>1. The institution of the Sabbath rests upon the physical, moral and religious nature of man, as that nature exists under the conditions of his life in this world.

2. In conformity with this fact, God instituted the Sabbath at the creation of man, setting apart the seventh day for that purpose, and imposed its observance as a universal and perpetual moral obligation upon the race.

3. After the resurrection of Christ, instead of abrogating an old and introducing a new institution, God, through his inspired agents, perpetuated the Sabbath, reimposing it upon Christians with increased obligations, and by changing the day from the seventh to the first day of the week enriched it with new and higher significance.</p></blockquote>

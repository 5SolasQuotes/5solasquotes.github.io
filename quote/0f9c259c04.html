<blockquote><p>1. That the Mediator is the Object of Divine Worship, is fixedly to be acknowledged; even the Man Christ, is to be honoured with Divine Worship, prayed unto, &amp;c. as in Scripture is clear. Thus the Mediator is the material Object of Divine Worship, or, the Objectum quod: for, we worship and invocate Him who is the Mediator; and there is no question of this.

2. Christ, considered as Mediator, and in the virtue of His mediation, is the only ground, upon which we have right to expect to be accepted in any part of our worship; or, to have prayers granted, which we put up to God under what ever designation or title: for, so He is the Door and the Way, Joh. 10.9. and 14.6. and in this respect though He be not as such, the formal Object of Divine Worship; yet, He is the foundation whereupon it is now built; the Way, by which it must be addressed to God; and He is the High Priest, Heb. 7.25. This was typified by the Temple, Ark, and High Priest under the Law: for, sinners have not access to God, but by Him; and this strengthens Faith to approach, that God is manifested in our nature, and that so we have, by His suffering, entry through the Vail, to the Throne of Grace, which formerly, without respect to this, was shut.

3. Our Lord Jesus, who is God, in our worshipping of Him, may be considered as Mediator; and, upon that ground, the heart may be emboldened to approach unto God: because He that is God, is also Man and Mediator. Thus, we praise and pray to Him that died, and considering Him as once dead, in our uptaking of Him, yet so, as it is, because He is God: for, had it been possible that the Mediator could not have been God, there had not been ground for giving of this Worship unto Him; yet, this consideration warms the heart with love to Him, and gives confidence and cheerfulness in praying to Him, or praising of Him, as in this same place, and afterward, cap. 5. because seeing we have a Man to do with, who hath so experimentally felt sinless infirmities, of purpose to be the ground of a sympathy with His Members; and seeing He hath still human affections, by having a glorified body still united in One Person with His Divine Nature, which wants not human feeling, though in an inconceivable manner; and seeing also, that that is given in the Word, as an encouragement for us, to step forward, to expect grace and help in the time of need, Heb. 2.18. and 4.15, 16. and that even from Him: there is no question but, by the actual considering of this, a soul may, and ought to strengthen it self in its approaching unto God.

4. Yet, this Divine Worship is given to Him, as He is God, and because He is God; and so Christ-God is the Objectum formale, or, quo of this Divine Worship, because it is the Godhead that is the alone formal Object of Divine Worship, as is said; and Christ only, as God, hath these essential Attributes of Omniscience, Supreme Majesty, Adorability, &amp;c. which are requisite for the Object of Divine Worship. And therefore in this place, although He be set out in what is peculiar to Him as Mediator; yet, His being reckoned with the other Two blessed Persons, doth prove that notwithstanding thereof He is considered in His Person as God. It is then thus, as we say, Christ-God died, yet as Man; so the Man Christ, is worshipped, yet as God: for, though He be one Person, yet the properties of the two Natures are distinct. Hence, as the Fathers did prove Christ’s Godhead against the Arians, from this, that He was worshipped with Divine Worship; and account them Idolaters for worshipping Him thus, whom they did not esteem to be God; so do the latter Divines in reference to the Socinians.

5. Therefore this Worship that is given to Christ, the Mediator, is of the same kind that is given to God, to wit, Supreme, Divine Worship: for, there are not two sorts of Divine Worship. And to give the Mediator, who is God, an inferior kind of Worship, would, 1. wrong Him who is God: for, by taking to Himself that external relation, He hath not diminished His essential Glory and Majesty. 2. It supposes two objects of Worship, and two kinds of Divine Worship; which is false. Therefore Divines have ever censured that assertion in the Remonstrants’ Confession, anent giving a peculiar and middle-kind of Worship to Christ the Mediator, as of it self unsafe and as making way for the Socinian subterfuge, which is to allow a Worship to the Mediator, as Mediator, inferior to that which is given to God; and so, that it should not follow from this, that Christ is worshipped.

Therefore, He is God equal with the Father. Now, the Scripture giveth Him that same Worship, and not any other, even when it is denied to all creatures; yea, when He is worshipped in the days of His flesh. He is considered as the only begotten of the Father, as Lord and Almighty, having all creatures as servants under Him, &amp;c. and yet He is styled the Son of David, He that was to come, &amp;c, even at that time; to shew, that both considerations have place in worshipping of the same Person, who is God, and also Mediator; and not to bring in a new Worship; for, none can be more glorious, than what is due to God; but to lay a new ground of having access to give Him the Worship which is due, and by a new relation to give a kindly qualification of the Object, whereby the heart may be provoked lovingly and thankfully to give the same.

6. When this Worship is given to Him, it is given to the Person who is Mediator, and that in one individual act: for, He, as God, is not worshipped one way; and, as man an other way; nor is there a division of His Natures to be conceived; but the Person, who is Man, is worshipped with this Divine Honour in the same act, because He is God: therefore there is no such precision called for in the intent of the Worshipper, as if one Nature of Christ’s were to be worshipped and not the other: for, it’s the Person, who is worshipped, now consisting of two Natures.</p></blockquote>

<blockquote><p>As for the recreations, which are here said to serve lawfully to the refreshing of our spirits, this appellation [by an opponent] is very ambiguous; neither do I know any difference between the recreating of our spirits and the refreshing of our spirits: yet here the refreshing of our spirits is made the end of recreation. Again it were good to distinguish between recreation of the body, and recreation of the mind. I think the refreshing of spirits pertains to the recreation of the body; men’s spirits are natural and material things, and they are apt to be wasted first naturally… and spirits thus wasted are recreated, that is, repaired by eating and drinking. And thus provisions of victual are commonly called recreats. 2. Secondly they are wasted also by labour voluntarily undertaken, and these are repaired, as by the former way, so by rest also. And each way we are allowed to recreate our spirits on the Lord’s Day… But now adays many courses are called recreations, wherein there is found little rest; and the natural spirits of man are rather wasted, and his nature tired; far more than the one is repaired, or the other eased. And when all comes to all, I doubt the issue will be to style the pleasures of our senses by the cleanly name of recreations. Now the Jews were expressely forbidden to find their own pleasure on the Lord’s holy day, Isa. 58:13, yet were they not forbidden all pleasure, that belonged only to such a sabbath as was a fast; and therein indeed hypocrites are taxed for finding pleasure on that day, Isa. 58:3. But the weekly Sabbath was for pleasure and delight, but not for man’s own pleasure, nor for the doing of their own ways. But to delight in the Lord, which is spiritual pleasure, and the recreating of our souls in the Lord: this is a blessed rest, thus to rest unto Him; and the Word of God is the best food of the soul; No recreates like unto God’s holy ordinances.</p></blockquote>

<div class="actions"><button class="copy" data-copy="“As for the recreations, which are here said to serve lawfully to the refreshing of our spirits, this appellation [by an opponent] is very ambiguous; neither do I know any difference between the recreating of our spirits and the refreshing of our spirits: yet here the refreshing of our spirits is made the end of recreation. Again it were good to distinguish between recreation of the body, and recreation of the mind. I think the refreshing of spirits pertains to the recreation of the body; men’s spirits are natural and material things, and they are apt to be wasted first naturally… and spirits thus wasted are recreated, that is, repaired by eating and drinking. And thus provisions of victual are commonly called recreats. 2. Secondly they are wasted also by labour voluntarily undertaken, and these are repaired, as by the former way, so by rest also. And each way we are allowed to recreate our spirits on the Lord’s Day… But now adays many courses are called recreations, wherein there is found little rest; and the natural spirits of man are rather wasted, and his nature tired; far more than the one is repaired, or the other eased. And when all comes to all, I doubt the issue will be to style the pleasures of our senses by the cleanly name of recreations. Now the Jews were expressely forbidden to find their own pleasure on the Lord’s holy day, Isa. 58:13, yet were they not forbidden all pleasure, that belonged only to such a sabbath as was a fast; and therein indeed hypocrites are taxed for finding pleasure on that day, Isa. 58:3. But the weekly Sabbath was for pleasure and delight, but not for man’s own pleasure, nor for the doing of their own ways. But to delight in the Lord, which is spiritual pleasure, and the recreating of our souls in the Lord: this is a blessed rest, thus to rest unto Him; and the Word of God is the best food of the soul; No recreates like unto God’s holy ordinances.”

</figure><figure class="quote" id="q-f5fc829787" data-kw="">
<blockquote><p>The precept of the Sabbath observance is moral in one respect, insofar as it commands man to give some time to the things of God, according to Ps. 45:11: ‘Be still and see that I am God.’ In this respect it is placed among the precepts of the decalogue: but not as to the fixing of the time, in which respect it is a ceremonial precept.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/thomas-aquinas.html">Thomas Aquinas</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Summa, pt. 1</cite>, of 2, quest. 100, article 3, reply to Objection 2</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/worship/the-lords-day.html">The Lord&#x27;s Day</a></span></div>

</figure><figure class="quote" id="q-a19e6d16fd" data-kw="">
<blockquote><p>The unction and fragrance of the Spirit with which the Psalms are replete lead me to notice, before leaving this portion of our survey, that it is an utter misconception to represent the Old Testament religion as more fed by mundane hopes, than by the influence of the Holy Spirit.

It is to pervert the plainest evidence to affirm, as Cocceius and his school affirmed, that there was neither sonship nor the spirit of adoption in the Old Testament Church. That was to ignore the Abrahamic Covenant, and Christ’s divine presence with His Church, and merely to fix all attention upon the intermediate and transitory Sinai Covenant. But the Psalms to which we are adverting, when considered as the actual expression of praise for the Israelitish Church, as well as a legacy handed down to us in the Christian Church, sufficiently refute that view.

No book of a similar kind was prepared for the New Testament Church. The Holy Spirit, replenishing the sweet singers of Israel with spiritual truth and holy love, anticipated in this way much of the necessity that should be felt in Christian times. I am not here discussing the debated point as to the use of psalms in public worship.

My object is to show the spirituality of the Israelitish Church as evinced by its inspired and invaluable psalms. They describe the eternity and omnipresence, the majesty and condescension, the justice and mercy of God in a strain of the most fervid devotion. They sing of repentance and faith, of joy in God and delight in God’s law, with an ardour beyond which it is impossible to go. They depict Christ’s royal reign and His union with His Church; the anointing with the oil of gladness (Ps. 45.7); the receiving of gifts for men (Ps. 68.18); and the supreme dominion with which Christ was to be invested by the Father with a tenderness, unction, and joy, to which no other words are equal And those psalms which are called “new songs” anticipate the full millennial glory.

To reason back from effect to cause, the power and presence of the Spirit in ample fulness must have been graciously conferred to produce these psalms, and to use them fitly when prepared. We trace the power of God’s Spirit in turning the captivity of Israel, and in filling them with penitence. Not only so: the apostle, when adducing the quotation from the Psalms, “I believed, therefore have I spoken,” prefixes “We having the same spirit of faith — we also believe and therefore speak” (2 Cor 4.13; Ps. 116.10). The language of the apostle affirms the same faith and the possession of the same Spirit.

From this fact, and from the whole series of quotations made from them, it is evident that the experience of the Church was the same in both economies, though complexional varieties attached to each. But these varieties, as Calvin well remarks, describe the Church more in its corporate character than in the experience of the individual members. The true Church in the Old Testament, whatever might be the character of the nominal adherents, cannot be said to be unspiritual when we trace a faith and a knowledge of God, a fidelity and courage, an endurance and self-denial in all that great cloud of witnesses that fill us with astonishment, and leave us conscious that we are practically far behind.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/george-smeaton.html">George Smeaton</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Doctrine of the Holy Spirit. The Ninth Series of the Cunningham Lectures, 1882</cite>, (Edinburgh: T. &amp; T. Clark, 1882), pp 25-27.</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/worship/psalmody.html">Psalmody</a></span></div>

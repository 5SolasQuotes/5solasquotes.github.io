<blockquote><p>I shall therefore a little further explain this distinction and then show you the soundness of it, and then the exceeding usefulness and necessity of it, both in this and many other controversies: 1. For the title I choose rather to denominate it from the object than the act, because the diversity is in the object, but none in the species of the act naturally considered: Debitum and natural being are two distinct things; but ‘to will’ one and ‘to will’ the other is all one as to the nature of willing. God does as properly will duty as He wills natural beings. Yet if I must denominate it from the acts, I would distinguish between God’s Directive Will and his Legislative. For to call it voluntas praecepti is too narrow a term, for the precept is but one part of God’s Law and determines only of one sort of right, that is, of the dueness of obediential actions or forbearance of forbidden actions. But there is also a debitum praemii et beneficii–pure vel absolute–dati, et debitum poenae [debt of reward and benefit, whether purely or absolutely given, and a debt of punishment], which the rest of the Law, Testament or Covenant of God determines of, which must all be here included as well as the former. In sum, the Law determines: 1. What shall be due from us; 2. and what shall be due to us, and on what terms. I call it therefore, The will of God de eventu, et de debito [of event, and of debt], as such. I say ‘as such,’ for else they are coincident: For God’s will de rerum natura, vel existentia determines de debito quatenus evenit esse debitum [determines the nature or existence of things, and debt so far as debt comes about], but not qua debitum [as debt]. And his will de debito determines of the dueness of some events, not as eventual [as to the event], but as due. Or to avoid all ambiguity: call it God’s will de ente mere naturali [concerning merely natural being] and his will de debito morali [concerning moral debt], or Legislative or Governing. 2. And for the nature of the distinction, understand further that there are two acts which I call God’s will de debito: The first is that immanent act of his will by which He strictly and properly wills what shall be due. This also is twofold: 1. Productive, or instituting dueness; 2. and approbative, or taking complacency in duty. The former of these I principally intend, but exclude not the latter. God does eternally will every due, but it is not therefore eternally or from eternity due. For He wills from eternity (to speak vulgarly) only that this shall be due at such a time and by such a means. I say by such means: For though God’s will produce all dueness, yet only by means does He produce it. That means is the revelation of his will. 2. This revelation of God’s will de debito we call his Law. This therefore is the second thing which I call God’s will de debito, or his Legislative will, that is, the Law as it is signum voluntatis divinae [a sign of the divine will], that is, formally as a law. This I call God’s will de debito, only metonymically, as it is the sign of his will before expressed. If the proper will of God were separated from this, it would then be no producer of dueness or right at all, for it would be no law, no signum; it would lose its nature as abrogated laws do.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/richard-baxter.html">Richard Baxter</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Universal Redemption of Mankind by the Lord Jesus Christ Stated &amp; Cleared</cite>, … (London: Salusbury, 1694), ch. 2, pp. 28-32</span></figcaption>

</figure><figure class="quote" id="q-8483e69a21" data-kw="">
<blockquote><p>First, the power claimed by the governors of the Christian Church is not an arbitrary or capricious authority, to be wielded at will by them, in disregard of the rights or consciences of the members. There are certain limitations of a most important nature affixed to that power, and certain principles of a definite kind laid down for the use and administration of it, which set bounds round about it, and bring it into harmony with the liberty of conscience, rightfully belonging to every private individual of the Christian society. … 3rd. Church power is limited by the rule prescribed for its exercise, or by the Word of God. This third limitation ties down the administration of Church power to certain fixed principles and a certain definite law, and excludes the possibility of its becoming a wayward and arbitrary authority, to be wielded at the will or caprice of man. It forbids the unauthorized addition or subtraction of anything in the constitution, doctrine, worship, or discipline of the Church, such as Christ has not sanctioned in His Word.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/james-bannerman.html">James Bannerman</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Church of Christ: A Treatise on the Nature, Powers, Ordinances, Discipline, and Government of the Christian Church</cite>, vol. 1 (Edinburgh, 1868), pp. 241-2, 248</span></figcaption>

</figure><figure class="quote" id="q-2bcb8c6370" data-kw="">
<blockquote><p>This comprehensive application of the [Scriptural] rule [articulated by Rutherford] was necessitated because the advocates for human ceremonies had argued that such things might be justified as circumstances of worship. It was maintained that circumstances which were not forbidden were lawful if they were edifying. Their reformed opponents quickly saw that this argument effectively created a class of religious actions which were beside the Word in matters of faith and worship. Their response was clear and concise: any action which served as a means of worship was a moral action and required the warrant of God’s Word. To the point, Rutherford asserted, “In actions or religious means of worship, and actions moral, whatever is beside the Word of God is against the Word of God”. (Divine Right of Church Government, 1646, [Intro, section 2], pp. 19-20)</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/matthew-winzer.html">Matthew Winzer</a></span><span class="wk"><span class="lbl">Work:</span> <cite>‘The Constitutional Principle of the Scottish Reformation: 1547-1648’ in Scottish Reformation Society Historical Journal</cite>, 2012, vol. 2, pp. 1-42</span></figcaption>

<blockquote><p>Worship is an action, or performance, or thing, by which we tender our immediate honor to God from the nature of the thing itself: 1. I call it an action because the passion of dying or suffering is not formally worship, but only dying comparatively: rather than denying of Christ or dying so and so qualified: [in a comparative way] dying with patience and faith may be called a worship [2 Tim. 4:6]. 2. I call it not an action only, but a performance or thing, because an office, as the priesthood, the ministry, is a worship and yet not an action; sometime[s], time itself, as the Sabbath Day is a worship; yet it is not an action: So the Lord calls it his Holy Day: and undeniably the Jewish days, the High Priest’s garment, and many things of that kind, were divine or religious performances, things or adjuncts of divine worship, but so as they are not merely adjuncts of worship, but also worship: For the High Priest’s ephod was not only a civil ornament, nor was it a mere physical or natural means to fence off the injuries of sun and heaven; we do not think that the Lord in all, or any place of the Old or New Testament sets down any laws concerning garments simply, as they do fence off cold or heat; that belongs to art: only He speaks of garments, as contrary to gravity [being sober-minded], as signs of vanity and lightness, Isa. 3:16, etc.; Zeph. 1:8; 1 Pet. 3:3-4. And of garments as religious observances, of which sort was the attire and garments of the priests and High Priests in their service, in which consideration the religious times, holy places, and Mosaical garments were divine worship, by which God was immediately honored; but [they were] not adjuncts only, or actions, but religious things or performances. 3. It is such a performance, as from thence honor does immediately redound to God. But that this may be the clearer, I conceive that there is a twofold, immediate honoring of God in the worship of God: 1. An honoring of God less immediate, as hearing of the Word, is an immediate honoring of God, because honor flows immediately from God, both ex conditione operis, and ex conditione operantis; ‘from the nature of the work’, and ‘[from the] intention of the worker’: yet it is a less immediate honoring of God, in regard that I may also hear the Word even from the condition of the work, and so from the intrinsic end of the worker that I may learn to know God and believe; for thus far I am led to honor God immediately in hearing the Word, that action of its own nature conveying honor to God; there intervenes also a medium amidst between me and honoring of God, to wit, the preacher or the Bible (to which no external adoration is due): [2.] There is another more immediate worship, to wit, praising of God, from which, by an immediate result, God is honored, and in worship especially, strictly, immediate, God is immediately honored both in the intention of the work and the intrinsic end of it, and the intention of the worker; though no other thing be done, and others be not edified either in knowledge, increase of faith or any other ways: And in this, duties of the Second Table, of mercy and justice, differ from worship in that such acts of love and mercy, as to give alms to save the life of my brother or of his beast, are not acts of worshipping God; their intrinsic end, and the nature of the work being to do good to the creature, principally, ex natura et conditione operis, though God also thereby be honored, yet in a more secondary consideration: For I praying to God, do immediately, from the nature of the action, honor God, though no good should either redound to myself or to the creature; thereby it is true, God, by acts of love and mercy to our neighbor, is honored two ways: 1. In that men seeing our good works do thence take occasion to glorify our heavenly Father, whose truth teaches us by the grace of God to do these works, but the intrinsic and proper use of these is to do good to ourselves, as in works of sobriety, and to our neighbor, as in works of righteous dealing, but not immediately, and in the first and primary consideration to honor God, as in works of piety, holiness and worship, the honoring of God by secondary resultance, does issue also from these duties of righteousness, but not as from the acts of praying, praising, sacramental eating, drinking. 2. The doer of these acts of mercy may, and is to intend, the honoring of God.</p></blockquote>

gious+things+or+performances.+3.+It+is+such+a+performance%2C+as+from+thence+honor+does+immediately+redound+to+God.+But+that+this+may+be+the+clearer%2C+I+conceive+that+there+is+a+twofold%2C+immediate+honoring+of+God+in+the+worship+of+God%3A+1.+An+honoring+of+God+less+immediate%2C+as+hearing+of+the+Word%2C+is+an+immediate+honoring+of+God%2C+because+honor+flows+immediately+from+God%2C+both+ex+conditione+operis%2C+and+ex+conditione+operantis%3B+%E2%80%98from+the+nature+of+the+work%E2%80%99%2C+and+%E2%80%98%5Bfrom+the%5D+intention+of+the+worker%E2%80%99%3A+yet+it+is+a+less+immediate+honoring+of+God%2C+in+regard+that+I+may+also+hear+the+Word+even+from+the+condition+of+the+work%2C+and+so+from+the+intrinsic+end+of+the+worker+that+I+may+learn+to+know+God+and+believe%3B+for+thus+far+I+am+led+to+honor+God+immediately+in+hearing+the+Word%2C+that+action+of+its+own+nature+conveying+honor+to+God%3B+there+intervenes+also+a+medium+amidst+between+me+and+honoring+of+God%2C+to+wit%2C+the+preacher+or+the+Bible+%28to+which+no+external+adoration+is+due%29%3A+%5B2.%5D+There+is+another+more+immediate+worship%2C+to+wit%2C+praising+of+God%2C+from+which%2C+by+an+immediate+result%2C+God+is+honored%2C+and+in+worship+especially%2C+strictly%2C+immediate%2C+God+is+immediately+honored+both+in+the+intention+of+the+work+and+the+intrinsic+end+of+it%2C+and+the+intention+of+the+worker%3B+though+no+other+thing+be+done%2C+and+others+be+not+edified+either+in+knowledge%2C+increase+of+faith+or+any+other+ways%3A+And+in+this%2C+duties+of+the+Second+Table%2C+of+mercy+and+justice%2C+differ+from+worship+in+that+such+acts+of+love+and+mercy%2C+as+to+give+alms+to+save+the+life+of+my+brother+or+of+his+beast%2C+are+not+acts+of+worshipping+God%3B+their+intrinsic+end%2C+and+the+nature+of+the+work+being+to+do+good+to+the+creature%2C+principally%2C+ex+natura+et+conditione+operis%2C+though+God+also+thereby+be+honored%2C+yet+in+a+more+secondary+consideration%3A+For+I+praying+to+God%2C+do+immediately%2C+from+the+nature+of+the+action%2C+honor+God%2C+though+no+good+should+either+redound+to+myself+or+to+the+creature%3B+thereby+it+is+true%2C+God%2C+by+acts+of+love+and+mercy+to+our+neighbor%2C+is+honored+two+ways%3A+1.+In+that+men+seeing+our+good+works+do+thence+take+occasion+to+glorify+our+heavenly+Father%2C+whose+truth+teaches+us+by+the+grace+of+God+to+do+these+works%2C+but+the+intrinsic+and+proper+use+of+these+is+to+do+good+to+ourselves%2C+as+in+works+of+sobriety%2C+and+to+our+neighbor%2C+as+in+works+of+righteous+dealing%2C+but+not+immediately%2C+and+in+the+first+and+primary+consideration+to+honor+God%2C+as+in+works+of+piety%2C+holiness+and+worship%2C+the+honoring+of+God+by+secondary+resultance%2C+does+issue+also+from+these+duties+of+righteousness%2C+but+not+as+from+the+acts+of+praying%2C+praising%2C+sacramental+eating%2C+drinking.+2.+The+doer+of+these+acts+of+mercy+may%2C+and+is+to+intend%2C+the+honoring+of+God.%E2%80%9D%0A%0A%E2%80%94+Samuel+Rutherford%2C+The+Divine+Right+of+Church+Government%E2%80%A6+%281646%29%2C+pp.+86-88&amp;url=https%3A%2F%2F5solasquotes.github.io%2Fquote%2F94e44db38d.html&amp;via=5Solas" target="_blank" rel="noopener">Share on X</a><a class="perma" href="../quote/94e44db38d.html">Permalink</a><a class="src" href="https://reformedbooksonline.com/on-ceremonies/#:~:text=Worship%20is%20an%20action%2C%20or%20performance,to%20intend%2C%20the%20honoring%20of%20God&amp;text=Worship%20is%20an%20action%2C%20or%20performance%2C%20or%20thing&amp;text=and%20is%20to%20intend%2C%20the%20honoring%20of%20God" rel="noopener" target="_blank">Read it online · Reformed Books Online</a></div>

<blockquote><p>Whereunto it was replied that then Cassander’s images (not for adoration, but for information and incitement) are not Popish, which the Rejoinder does not only grant, but also proves it, by the consent of Calvin himself (Institutes, book 1, ch. 11, sect. 12), where he says, that historical images, or pictures, may have some use, in teaching, and putting, in remembrance. Now for this, let it be considered that Calvin in that section speaks only of ordinary pictures for teaching and putting in remembrance of that which they represent of themselves, without any ecclesiastical institution, as certain words written do signify a certain meaning without any special institution. Such (it may be) would be the picture of Ananias in a white surplice, signifying with other pictures agreeable to the story, that Paul esteemed and called him a whited wall (Acts 23:3). But in the very next section, which is the thirteenth, Calvin, disputing against setting up of any images in churches, does sufficiently declare that he allowed of no ceremonial religious use of images, such as is of our cross and surplice.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/william-ames.html">William Ames</a></span><span class="wk"><span class="lbl">Work:</span> <cite>A Fresh Suit Against Human Ceremonies in God’s Worship, ‘An Addition of the two last reasons of the former reply’</cite>, pp. 283-84 (1633)</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/worship/idolatry-and-images.html">Idolatry and Images</a></span></div>

<blockquote><p>By this petulant carnal kind of zeal, I remember our divisions were here raised at the first: To deride the Common Prayer and deride them that used it was too common with some kind of religious people: And they excused it by Elijah’s example [1 Kn. 18:27], as if idolaters and the true worshippers of God that differ from us in a form or ceremony were all one.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/richard-baxter.html">Richard Baxter</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Cure of Church Divisions</cite>, (London: Symmons, 1670), pt. 1 | Direction 32, p. 188</span></figcaption>

— Richard Baxter, The Cure of Church Divisions (London: Symmons, 1670), pt. 1 | Direction 32, p. 188">Copy</button><a class="share" href="https://x.com/intent/post?text=%E2%80%9CBy+this+petulant+carnal+kind+of+zeal%2C+I+remember+our+divisions+were+here+raised+at+the+first%3A+To+deride+the+Common+Prayer+and+deride+them+that+used+it+was+too+common+with+some+kind+of+religious+people%3A+And+they+excused+it+by+Elijah%E2%80%99s+example+%5B1+Kn.+18%3A27%5D%2C+as+if+idolaters+and+the+true+worshippers+of+God+that+differ+from+us+in+a+form+or+ceremony+were+all+one.%E2%80%9D%0A%0A%E2%80%94+Richard+Baxter%2C+The+Cure+of+Church+Divisions+%28London%3A+Symmons%2C+1670%29%2C+pt.+1+%7C+Direction+32%2C+p.+188&amp;url=https%3A%2F%2F5solasquotes.github.io%2Fquote%2F79dc11f4c8.html&amp;via=5Solas" target="_blank" rel="noopener">Share on X</a><a class="perma" href="../quote/79dc11f4c8.html">Permalink</a><a class="src" href="https://reformedbooksonline.com/on-idolatry/#:~:text=By%20this%20petulant%20carnal%20kind%20of,form%20or%20ceremony%20were%20all%20one&amp;text=By%20this%20petulant%20carnal%20kind%20of%20zeal%2C%20I&amp;text=in%20a%20form%20or%20ceremony%20were%20all%20one" rel="noopener" target="_blank">Read it online · Reformed Books Online</a></div>
</figure><figure class="quote" id="q-f52605aeb2" data-kw="">
<blockquote><p>Touching civil society with them, two points are to be handled: [1.] What society may be used with them, and [2.] what not. For the first, we may use their society upon neccessity that cannot be avoided, unless we will utterly reject the fellowship of mankind. Paul, who forbids the Corinthians to company with a brother that is an idolator, for all this gives them liberrty to converse with the idolatrous of the world. (1 Cor. 5:10-11) This may seem strange but the reason is because the company of believers was then but small and the whole world beside was nothing but idolaters: and therefore it was impossible for believers to avoid their society unless they meant to go out of the world. And upon this necessity, Paul permits the Church in his days to use the fellowship of idolators; and for the very same cause he says, 1 Cor. 10:27, ‘If any of them that believe not bid you to a feast, go if ye will.’ Secondly, believers may lawfully join with idolaters in the society of concord. For by the general calling of Christianity they are bound to have peace with all men. Upon this ground may the Church make covenants of peace with idolators upon even and just conditions. Heb. 12:14, ‘Have peace towards all men, and holiness.’ Rom. 12:18, ‘Have peace with all men, if it be possible, and as much as in you lies.’ Thus Abraham made a league of peace with Aner and Eschol, king of the Amorites, and with Abimelech; and Isaac with Abimelech, and Jacob with Laban (Gen. 23-24): and Heber the Kenite with Jabin a foreign king (Judg. 4:17): and thelr examples have sufficient warrant. For that which we may do we may bind ourselves to do. Thirdly, we may use any such fellowship with them as is, or shall be occasioned by virtue of our particular calling. Thus Christ, being the Savior of the world, conversed with publicans and sinners. Thus Paul being the Apostle of the Gentiles, enters into Athens, and there beholds their devotions. It is God’s commandement that the believing wife, shall nor forsake her unbelieving husband, if he be willing or desirous to dwell with her. (1 Cor. 7:13) If it be alleged that Ezra constrained the Israelites to put away their Ammonitish and Moabitish, and the rest of their heathen, wives (Ezra 10:3): I answer that their marriages were indeed void and no marriages: First, because the nations with whom they married were people, according to God’s Law, civilly dead: in that God had commanded their destruction, unless when peace was offered, they accepted of it. (Dt. 20:10) Secondly, in that they were not only idolators, but also enticers to idolatry; God by express commandment did simply forbid the Jews to marry with them unless they did repent and changed their religion. And in regard of this commandment, the foresaid marriages were nullities, as incestuous marriages are no marriages by reason of the absolute prohibition of God. Touching the society forbidden us with idolators, it is the society of amity, that is, of familiarity and special love. Two examples, whereof we find in the Word of God. One is of contracts of marriage with idolators, which the Scripture precisely condemns as an abomination in lsrael and a profanation of the name of God, when Judah marries the daughter of a strange god, Mal. 2:11. Boaz indeed married Ruth, a Moabitess, but she was entered and received into the body of the Israelites by a former marriage: and she was one that believed in the God of Israel. ‘Thy people’ (says he to Naomi and Ruth) ‘shall be my people, and thy God, my God.’ Sampson likewise married a woman of the Philistines (Judg. 14:4), but that was by divine instinct and consequently by a special appointment of God. Again it is alleged that God by express law gave leave to the Israelites to marry heathenish women taken captives in war. (Dt. 21:10-11) Answer: That is a law only of toleration, without approbation, in which God, for the hardness of their hearts, permits the evil, which cannot by policy be quite taken away. And this appears by two things: First, before the marriage, the woman by God’s appointment must be deformed, by cutting off her hair, by the growing of her nails, by putting off the garments of her captivity, and by mourning for her father and mother for the space of a month: and the end of this was to cause a dislike in the Israelites of their intended marriages, or to signify a change of religion, at the least in pretense, in the parties espoused. The second example is of leagues, in mutual aid and protection, which may not be contracted between believers and idolaters. Jehoshaphat for making this kind of league with Ahab is thus reproved, 2 Chron. 19:2. ‘Wouldest thou help the wicked, and love them that hate the Lord? Therefore for this things the wrath of the Lord is upon thee.’ Again, that which we may not do, we may not covenant to do; now we may not mutually give and take aid and protection of idolators. This tends to the dishonor of God, because it makes idolators boast that the people of God cannot stand without their aid. It is further an occasion of idolatry and this league often enfolds the people of God in the same plagues and judgment with idolators. It has been the decay both of Greece and Hungary that they have heretofore entered into leagues of amity with the Turks. lt may be objected that Abraham made this covenant of protection with the Amorites, Aner, Eschol, Mamre: and that thereupon they aided him in rescuing of Lot, and in the slaughter of the kings. I answer: First, it may be they were believers, embracing the faith Abraham: nothing can be showed to the contrary. Secondly, if they were infidels, the covenant that was between them was of peace only and they aided Abraham, not by request made by him, but by secret special motion of God. Thirdly, the fathers did sundry actions upon bad custom, which God by law afterward redressed: and their examples may not be followed in all things. Lastly, I suppose that Abraham joined with them as against a common adversary: and therefore the protection they ministered to Abraham was as necessary for themselves as for him and his people. Here one exception must not be omitted. Put the case that the husband is an idolator and is content to dwell with his believing wife: she then is to live with him, not only in the society of peace, but also in the society of amity by doing all duties of Iove that concern a wife, so far as may stand with good conscience. For the precept of Paul’s, that marriage and marriage duties are to be preserved of the believing party with an infidel (1 Cor. 7:13-14), so be it the said infidel be content. It may be al!eged that thus the believer exposes himself to danger of idolatry. I answer: Not because God defends them that call upon Him who thrust not themselves into danger, but bear the danger and calamity into which they are fallen, attending upon their callings. Again, if the unbelieving party shall solicit the other and use all means, both fair and foul, to draw him or her to idolatry, the believing party in this case, may go aside for a time and omit the duty of marriage. For this is all one as if the idolatrous and unbelieving party should depart. For indeed, that party is said to depart in whom the cause of departing is, as in the Church he is a schismatic in whom the cause of the schism is, and not always he that separates. Secondly, it may be objected that a Christian may not become the member of a harlot, much less of an idolator; considering idolatry is a great sin. I answer: The reason is not like. For the fornicator consents to the fornication: and so does not the believing party, by doing duties that pertain to marriage, consent to the idolatry of the unbelieving party. And the fornicator willingly joins himself with an harlot; whereas the believing party desires he might be yoked with a believer and not with an infidel. Lastly, it may be objected: if for adultery, divorce may be made, why not for idolatry which is spiritual adultery? I answer: That not any sin by itself, as it is a sin, not breaking the troth and bond of marriage, is the proper cause of a divorce; and not any kind of idolatry, but the sin of adultery breakest his troth.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/william-perkins.html">William Perkins</a></span><span class="wk"><span class="lbl">Work:</span> <cite>‘A Warning Against the Idolatry of the Last Times, &amp; an Instruction touching Religious or Divine Worship’ in The Works</cite>, (d. 1602; London: Legatt, 1626), vol. 1, p. 692</span></figcaption>

<div class="actions"><button class="copy" data-copy="“Touching civil society with them, two points are to be handled: [1.] What society may be used with them, and [2.] what not. For the first, we may use their society upon neccessity that cannot be avoided, unless we will utterly reject the fellowship of mankind. Paul, who forbids the Corinthians to company with a brother that is an idolator, for all this gives them liberrty to converse with the idolatrous of the world. (1 Cor. 5:10-11) This may seem strange but the reason is because the company of believers was then but small and the whole world beside was nothing but idolaters: and therefore it was impossible for believers to avoid their society unless they meant to go out of the world. And upon this necessity, Paul permits the Church in his days to use the fellowship of idolators; and for the very same cause he says, 1 Cor. 10:27, ‘If any of them that believe not bid you to a feast, go if ye will.’ Secondly, believers may lawfully join with idolaters in the society of concord. For by the general calling of Christianity they are bound to have peace with all men. Upon this ground may the Church make covenants of peace with idolators upon even and just conditions. Heb. 12:14, ‘Have peace towards all men, and holiness.’ Rom. 12:18, ‘Have peace with all men, if it be possible, and as much as in you lies.’ Thus Abraham made a league of peace with Aner and Eschol, king of the Amorites, and with Abimelech; and Isaac with Abimelech, and Jacob with Laban (Gen. 23-24): and Heber the Kenite with Jabin a foreign king (Judg. 4:17): and thelr examples have sufficient warrant. For that which we may do we may bind ourselves to do. Thirdly, we may use any such fellowship with them as is, or shall be occasioned by virtue of our particular calling. Thus Christ, being the Savior of the world, conversed with publicans and sinners. Thus Paul being the Apostle of the Gentiles, enters into Athens, and there beholds their devotions. It is God’s commandement that the believing wife, shall nor forsake her unbelieving husband, if he be willing or desirous to dwell with her. (1 Cor. 7:13) If it be alleged that Ezra constrained the Israelites to put away their Ammonitish and Moabitish, and the rest of their heathen, wives (Ezra 10:3): I answer that their marriages were indeed void and no marriages: First, because the nations with whom they married were people, according to God’s Law, civilly dead: in that God had commanded their destruction, unless when peace was offered, they accepted of it. (Dt. 20:10) Secondly, in that they were not only idolators, but also enticers to idolatry; God by express commandment did simply forbid the Jews to marry with them unless they did repent and changed their religion. And in regard of this commandment, the foresaid marriages were nullities, as incestuous marriages are no marriages by reason of the absolute prohibition of God. Touching the society forbidden us with idolators, it is the society of amity, that is, of familiarity and special love. Two examples, whereof we find in the Word of God. One is of contracts of marriage with idolators, which the Scripture precisely condemns as an abomination in lsrael and a profanation of the name of God, when Judah marries the daughter of a strange god, Mal. 2:11. Boaz indeed married Ruth, a Moabitess, but she was entered and received into the body of the Israelites by a former marriage: and she was one that believed in the God of Israel. ‘Thy people’ (says he to Naomi and Ruth) ‘shall be my people, and thy God, my God.’ Sampson likewise married a woman of the Philistines (Judg. 14:4), but that was by divine instinct and consequently by a special appointment of God. Again it is alleged that God by express law gave leave to the Israelites to marry heathenish women taken captives in war. (Dt. 21:10-11) Answer: That is a law only of toleration, without approbation, in which God, for the hardness of their hearts, permits the evil, which cannot by policy be quite taken away. And this appears by two things: First, before the marriage, the woman by God’s appointment must be deformed, by cutting off her hair, by the growing of her nails, by putting off the garments of her captivity, and by mourning for her father and mother for the space of a month: and the end of this was to cause a dislike in the Israelites of their intended marriages, or to signify a change of religion, at the least in pretense, in the parties espoused. The second example is of leagues, in mutual aid and protection, which may not be contracted between believers and idolaters. Jehoshaphat for making this kind of league with Ahab is thus reproved, 2 Chron. 19:2. ‘Wouldest thou help the wicked, and love them that hate the Lord? Therefore for this things the wrath of the Lord is upon thee.’ Again, that which we may not do, we may not covenant to do; now we may not mutually give and take aid and protection of idolators. This tends to the dishonor of God, because it makes idolators boast that the people of God cannot stand without their aid. It is further an occasion of idolatry and this league often enfolds the people of God in the same plagues and judgment with idolators. It has been the decay both of Greece and Hungary that they have heretofore entered into leagues of amity with the Turks. lt may be objected that Abraham made this covenant of protection with the Amorites, Aner, Eschol, Mamre: and that thereupon they aided him in rescuing of Lot, and in the slaughter of the kings. I answer: First, it may be they were believers, embracing the faith Abraham: nothing can be showed to the contrary. Secondly, if they were infidels, the covenant that was between them was of peace only and they aided Abraham, not by request made by him, but by secret special motion of God. Thirdly, the fathers did sundry actions upon bad custom, which God by law afterward redressed: and their examples may not be followed in all things. Lastly, I suppose that Abraham joined with them as against a common adversary: and therefore the protection they ministered to Abraham was as necessary for themselves as for him and his people. Here one exception must not be omitted. Put the case that the husband is an idolator and is content to dwell with his believing wife: she then is to live with him, not only in the society of peace, but also in the society of amity by doing all duties of Iove that concern a wife, so far as may stand with good conscience. For the precept of Paul’s, that marriage and marriage duties are to be preserved of the believing party with an infidel (1 Cor. 7:13-14), so be it the said infidel be content. It may be al!eged that thus the believer exposes himself to danger of idolatry. I answer: Not because God defends them that call upon Him who thrust not themselves into danger, but bear the danger and calamity into which they are fallen, attending upon their callings. Again, if the unbelieving party shall solicit the other and use all means, both fair and foul, to draw him or her to idolatry, the believing party in this case, may go aside for a time and omit the duty of marriage. For this is all one as if the idolatrous and unbelieving party should depart. For indeed, that party is said to depart in whom the cause of departing is, as in the Church he is a schismatic in whom the cause of the schism is, and not always he that separates. Secondly, it may be objected that a Christian may not become the member of a harlot, much less of an idolator; considering idolatry is a great sin. I answer: The reason is not like. For the fornicator consents to the fornication: and so does not the believing party, by doing duties that pertain to marriage, consent to the idolatry of the unbelieving party. And the fornicator willingly joins himself with an harlot; whereas the believing party desires he might be yoked with a believer and not with an infidel. Lastly, it may be objected: if for adultery, divorce may be made, why not for idolatry which is spiritual adultery? I answer: That not any sin by itself, as it is a sin, not breaking the troth and bond of marriage, is the proper cause of a divorce; and not any kind of idolatry, but the sin of adultery breakest his troth.”

— William Perkins, ‘A Warning Against the Idolatry of the Last Times, &amp; an Instruction touching Religious or Divine Worship’ in The Works (d. 1602; London: Legatt, 1626), vol. 1, p. 692">Copy</button><a class="share" href="https://x.com/intent/post?text=%E2%80%9CTouching+civil+society+with+them%2C+two+points+are+to+be+handled%3A+%5B1.%5D+What+society+may+be+used+with+them%2C+and+%5B2.%5D+what+not.+For+the+first%2C+we+may+use+their+society+upon+neccessity+that+cannot+be+avoided%2C+unless+we+will+utterly+reject+the+fellowship+of+mankind.+Paul%2C+who+forbids+the+Corinthians+to+company+with+a+brother+that+is+an+idolator%2C+for+all+this+gives+them+liberrty+to+converse+with+the+idolatrous+of+the+world.+%281+Cor.+5%3A10-11%29+This+may+seem+strange+but+the+reason+is+because+the+company+of+believers+was+then+but+small+and+the+whole+world+beside+was+nothing+but+idolaters%3A+and+therefore+it+was+impossible+for+believers+to+avoid+their+society+unless+they+meant+to+go+out+of+the+world.+And+upon+this+necessity%2C+Paul+permits+the+Church+in+his+days+to+use+the+fellowship+of+idolators%3B+and+for+the+very+same+cause+he+says%2C+1+Cor.+10%3A27%2C+%E2%80%98If+any+of+them+that+believe+not+bid+you+to+a+feast%2C+go+if+ye+will.%E2%80%99+Secondly%2C+believers+may+lawfully+join+with+idolaters+in+the+society+of+concord.+For+by+the+general+calling+of+Christianity+they+are+bound+to+have+peace+with+all+men.+Upon+this+ground+may+the+Church+make+covenants+of+peace+with+idolators+upon+even+and+just+conditions.+Heb.+12%3A14%2C+%E2%80%98Have+peace+towards+all+men%2C+and+holiness.%E2%80%99+Rom.+12%3A18%2C+%E2%80%98Have+peace+with+all+men%2C+if+it+be+possible%2C+and+as+much+as+in+you+lies.%E2%80%99+Thus+Abraham+made+a+league+of+peace+with+Aner+and+Eschol%2C+king+of+the+Amorites%2C+and+with+Abimelech%3B+and+Isaac+with+Abimelech%2C+and+Jacob+with+Laban+%28Gen.+23-24%29%3A+and+Heber+the+Kenite+with+Jabin+a+foreign+king+%28Judg.+4%3A17%29%3A+and+thelr+examples+have+sufficient+warrant.+For+that+which+we+may+do+we+may+bind+ourselves+to+do.+Thirdly%2C+we+may+use+any+such+fellowship+with+them+as+is%2C+or+shall+be+occasioned+by+virtue+of+our+particular+calling.+Thus+Christ%2C+being+the+Savior+of+the+world%2C+conversed+with+publicans+and+sinners.+Thus+Paul+being+the+Apostle+of+the+Gentiles%2C+enters+into+Athens%2C+and+there+beholds+their+devotions.+It+is+God%E2%80%99s+commandement+that+the+believing+wife%2C+shall+nor+forsake+her+unbelieving+husband%2C+if+he+be+willing+or+desirous+to+dwell+with+her.+%281+Cor.+7%3A13%29+If+it+be+alleged+that+Ezra+constrained+the+Israelites+to+put+away+their+Ammonitish+and+Moabitish%2C+and+the+rest+of+their+heathen%2C+wives+%28Ezra+10%3A3%29%3A+I+answer+that+their+marriages+were+indeed+void+and+no+marriages%3A+First%2C+because+the+nations+with+whom+they+married+were+people%2C+according+to+God%E2%80%99s+Law%2C+civilly+dead%3A+in+that+God+had+commanded+their+destruction%2C+unless+when+peace+was+offered%2C+they+accepted+of+it.+%28Dt.+20%3A10%29+Secondly%2C+in+that+they+were+not+only+idolators%2C+but+also+enticers+to+idolatry%3B+God+by+express+commandment+did+simply+forbid+the+Jews+to+marry+with+them+unless+they+did+repent+and+changed+their+religion.+And+in+regard+of+this+commandment%2C+the+foresaid+marriages+were+nullities%2C+as+incestuous+marriages+are+no+marriages+by+reason+of+the+absolute+prohibition+of+God.+Touching+the+society+forbidden+us+with+idolators%2C+it+is+the+society+of+amity%2C+that+is%2C+of+familiarity+and+special+love.+Two+examples%2C+whereof+we+find+in+the+Word+of+God.+One+is+of+contracts+of+marriage+with+idolators%2C+which+the+Scripture+precisely+condemns+as+an+abomination+in+lsrael+and+a+profanation+of+the+name+of+God%2C+when+Judah+marries+the+daughter+of+a+strange+god%2C+Mal.+2%3A11.+Boaz+indeed+married+Ruth%2C+a+Moabitess%2C+but+she+was+entered+and+received+into+the+body+of+the+Israelites+by+a+former+marriage%3A+and+she+was+one+that+believed+in+the+God+of+Israel.+%E2%80%98Thy+people%E2%80%99+%28says+he+to+Naomi+and+Ruth%29+%E2%80%98shall+be+my+people%2C+and+thy+God%2C+my+God.%E2%80%99+Sampson+likewise+married+a+woman+of+the+Philistines+%28Judg.+14%3A4%29%2C+but+that+was+by+divine+instinct+and+consequently+by+a+special+appointment+of+God.+Again+it+is+alleged+that+God+by+express+law+gave+leave+to+the+Israelites+to+marry+heathenish+women+taken+captives+in+war.+%28Dt.+21%3A10-11%29+Answer%3A+That+is+a+law+only+of+toleration%2C+without+approbation%2C+in+which+God%2C+for+the+hardness+of+their+hearts%2C+permits+the+evil%2C+which+cannot+by+policy+be+quite+taken+away.+And+this+appears+by+two+things%3A+First%2C+before+the+marriage%2C+the+woman+by+God%E2%80%99s+appointment+must+be+deformed%2C+by+cutting+off+her+hair%2C+by+the+growing+of+her+nails%2C+by+putting+off+the+garments+of+her+captivity%2C+and+by+mourning+for+her+father+and+mother+for+the+space+of+a+month%3A+and+the+end+of+this+was+to+cause+a+dislike+in+the+Israelites+of+their+intended+marriages%2C+or+to+signify+a+change+of+religion%2C+at+the+least+in+pretense%2C+in+the+parties+espoused.+The+second+example+is+of+leagues%2C+in+mutual+aid+and+protection%2C+which+may+not+be+contracted+between+believers+and+idolaters.+Jehoshaphat+for+making+this+kind+of+league+with+Ahab+is+thus+reproved%2C+2+Chron.+19%3A2.+%E2%80%98Wouldest+thou+help+the+wicked%2C+and+love+them+that+hate+the+Lord%3F+Therefore+for+this+things+the+wrath+of+the+Lord+is+upon+thee.%E2%80%99+Again%2C+that+which+we+may+not+do%2C+we+may+not+covenant+to+do%3B+now+we+may+not+mutually+give+and+take+aid+and+protection+of+idolators.+This+tends+to+the+dishonor+of+God%2C+because+it+makes+idolators+boast+that+the+people+of+God+cannot+stand+without+their+aid.+It+is+further+an+occasion+of+idolatry+and+this+league+often+enfolds+the+people+of+God+in+the+same+plagues+and+judgment+with+idolators.+It+has+been+the+decay+both+of+Greece+and+Hungary+that+they+have+heretofore+entered+into+leagues+of+amity+with+the+Turks.+lt+may+be+objected+that+Abraham+made+this+covenant+of+protection+with+the+Amorites%2C+Aner%2C+Eschol%2C+Mamre%3A+and+that+thereupon+they+aided+him+in+rescuing+of+Lot%2C+and+in+the+slaughter+of+the+kings.+I+answer%3A+First%2C+it+may+be+they+were+believers%2C+embracing+the+faith+Abraham%3A+nothing+can+be+showed+to+the+contrary.+Secondly%2C+if+they+were+infidels%2C+the+covenant+that+was+between+them+was+of+peace+only+and+they+aided+Abraham%2C+not+by+request+made+by+him%2C+but+by+secret+special+motion+of+God.+Thirdly%2C+the+fathers+did+sundry+actions+upon+bad+custom%2C+which+God+by+law+afterward+redressed%3A+and+their+examples+may+not+be+followed+in+all+things.+Lastly%2C+I+suppose+that+Abraham+joined+with+them+as+against+a+common+adversary%3A+and+therefore+the+protection+they+ministered+to+Abraham+was+as+necessary+for+themselves+as+for+him+and+his+people.+Here+one+exception+must+not+be+omitted.+Put+the+case+that+the+husband+is+an+idolator+and+is+content+to+dwell+with+his+believing+wife%3A+she+then+is+to+live+with+him%2C+not+only+in+the+society+of+peace%2C+but+also+in+the+society+of+amity+by+doing+all+duties+of+Iove+that+concern+a+wife%2C+so+far+as+may+stand+with+good+conscience.+For+the+precept+of+Paul%E2%80%99s%2C+that+marriage+and+marriage+duties+are+to+be+preserved+of+the+believing+party+with+an+infidel+%281+Cor.+7%3A13-14%29%2C+so+be+it+the+said+infidel+be+content.+It+may+be+al%21eged+that+thus+the+believer+exposes+himself+to+danger+of+idolatry.+I+answer%3A+Not+because+God+defends+them+that+call+upon+Him+who+thrust+not+themselves+into+danger%2C+but+bear+the+danger+and+calamity+into+which+they+are+fallen%2C+attending+upon+their+callings.+Again%2C+if+the+unbelieving+party+shall+solicit+the+other+and+use+all+means%2C+both+fair+and+foul%2C+to+draw+him+or+her+to+idolatry%2C+the+believing+party+in+this+case%2C+may+go+aside+for+a+time+and+omit+the+duty+of+marriage.+For+this+is+all+one+as+if+the+idolatrous+and+unbelieving+party+should+depart.+For+indeed%2C+that+party+is+said+to+depart+in+whom+the+cause+of+departing+is%2C+as+in+the+Church+he+is+a+schismatic+in+whom+the+cause+of+the+schism+is%2C+and+not+always+he+that+separates.+Secondly%2C+it+may+be+objected+that+a+Christian+may+not+become+the+member+of+a+harlot%2C+much+less+of+an+idolator%3B+considering+idolatry+is+a+great+sin.+I+answer%3A+The+reason+is+not+like.+For+the+fornicator+consents+to+the+fornication%3A+and+so+does+not+the+believing+party%2C+by+doing+duties+that+pertain+to+marriage%2C+consent+to+the+idolatry+of+the+unbelieving+party.+And+the+fornicator+willingly+joins+himself+with+an+harlot%3B+whereas+the+believing+party+desires+he+might+be+yoked+with+a+believer+and+not+with+an+infidel.+Lastly%2C+it+may+be+objected%3A+if+for+adultery%2C+divorce+may+be+made%2C+why+not+for+idolatry+which+is+spiritual+adultery%3F+I+answer%3A+That+not+any+sin+by+itself%2C+as+it+is+a+sin%2C+not+breaking+the+troth+and+bond+of+marriage%2C+is+the+proper+cause+of+a+divorce%3B+and+not+any+kind+of+idolatry%2C+but+the+sin+of+adultery+breakest+his+troth.%E2%80%9D%0A%0A%E2%80%94+William+Perkins%2C+%E2%80%98A+Warning+Against+the+Idolatry+of+the+Last+Times%2C+%26+an+Instruction+touching+Religious+or+Divine+Worship%E2%80%99+in+The+Works+%28d.+1602%3B+London%3A+Legatt%2C+1626%29%2C+vol.+1%2C+p.+692&amp;url=https%3A%2F%2F5solasquotes.github.io%2Fquote%2Ff52605aeb2.html&amp;via=5Solas" target="_blank" rel="noopener">Share on X</a><a class="perma" href="../quote/f52605aeb2.html">Permalink</a><a class="src" href="https://reformedbooksonline.com/on-idolatry/#:~:text=Touching%20civil%20society%20with%20them%2C%20two,sin%20of%20adultery%20breakest%20his%20troth&amp;text=Touching%20civil%20society%20with%20them%2C%20two%20points%20are&amp;text=but%20the%20sin%20of%20adultery%20breakest%20his%20troth" rel="noopener" target="_blank">Read it online · Reformed Books Online</a></div>

<blockquote><p>Vers. 15. And having spoiled principalities and powers, he made a shew of them openly, triumphing over them in it.

Argum. 10. Christ hath brought all the Devils, who exercise their power and tyranny upon the Elect, overthrown by the price of Redemption paid upon the Cross, and gloriously triumpheth over them openly in the sight of God, Angels and men (whose eyes are open) unto their own disgrace, and our deliverance: Therefore it remains that nothing is to be sought out of Christ.

The Devils are called Principalities and Powers, (1) Because in the world they potently exercise authority over all the reprobate children of disobedience, and all the unregenerate, which do nothing else, but execute the will of the Devil. (2) Because they are Sergeants executing the judgement of God, holding those captive that are not reconciled to God in Christ. (3) Because they fight against Christ the Redeemer, neither do they dismiss the redeemed and reconciled from the prison of darkness, unless compelled by the stronger power of Christ.

They are said to be spoiled by Christ on the Cross, (1) Inasmuch as Christ, paying the price of our Redemption, hath obtained by Covenant of the Father, that all the redeemed should be delivered from the prison of darkness, ignorance, sin and death. (2) Inasmuch as Christ, infinite in power, when he had once satisfied justice on the Cross, broke the bars and chains of sin, judgement, and the Law, wherewith the Devil, held the redeemed bound, that henceforth they cannot have any power. (3) Inasmuch as he hath made his redeemed his possession, and peculiar people, that they might not any longer be the flock of Satan.

Christ is said to have made a shew of the Devils, and to have openly triumphed on the Cross, (1) Inasmuch as he hath valiantly received, overcome, and extinguished all their temptations and poisoned darts, whether immediately cast by them against him hanging on the Cross, or hurled by the poisonous tongues of furious adversaries, or brandished by the provocation of the ingratitude of his Disciples flying from him. (2) Inasmuch as Christ hath turned the malice of the Devils, all their subtilties and machinations (by which they sought his life, incessantly stirring up their slaves to crucify him till he hanged upon the Cross) to their own destruction, and to the most open ruin of their dominion.

(3) Inasmuch as he hath shewn himself Lord of Heaven and Earth, by signs and wonders in the very time of his crucifying. (4) Inasmuch as he hath shewn openly his power by converting the thief hanging at his right hand, and the Centurion standing at his feet. (5) Inasmuch as the price of Redemption being already paid, the Conqueror, not only in the sight of God, and Angels, but also in the sight of these Devils, and also in the bearing of all beholders, cried out, that his work was finished, and that to his own eternal glory, and the perpetual ignominy of his enemies. From which it follows, that we must not depart from Christ for the obtaining of any good, or that we might be delivered from any evil.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/david-dickson.html">David Dickson</a></span><span class="wk"><span class="lbl">Work:</span> <cite>An exposition of all St. Paul’s epistles together with an explanation of those other epistles of the apostles St. James, Peter, John &amp; Jude: wherein the sense of every chapter and verse is analytically unfolded and the text enlightened</cite>, (London: Francis Eglesfield, 1659), p. 140.</span></figcaption>

<blockquote><p>The fifth and last [unlawful] remedy is exorcism, which is an adjuring and commanding the devil in the name of God to depart from the possessed party and to cease to molest him anymore. This means was used by our Savior Christ Himself, and after Him by His apostles and other believers in the time of the primitive church when the gift of working miracles was in force. But in these days (as I said before) that gift is ceased, and also the promise of power annexed to the use of adjuration, and therefore the means thereof must needs cease. And for an ordinary man now to command the devil in such sort is mere presumption and a practice of sorcery.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/william-perkins.html">William Perkins</a></span><span class="wk"><span class="lbl">Work:</span> <cite>A Discourse of the Damned Art of Witchcraft</cite>, … (Cambridge, 1610), ch. 7, ‘The application of the doctrine of witchcraft to our times’, section 3, question 3, ‘Whether a man may prevent the danger of witchcraft, and if he may, then what remedies he may lawfully and effectually use against it?’, pp. 245-46</span></figcaption>

<blockquote><p>([Margin Note:] Places Haunted by Evil Spirits must be Shunned) 3rd Use. This branch of the petition serves to direct us what to do in this case: say that a dwelling house or some other place is by God’s permission haunted and abused by some evil spirit, whether may a man lawfully frequent or abide in such a place? Answer: By this petition is plain he may not; for here we pray to be delivered from evil, and therefore we may not voluntarily thrust ourselves into such a place as is haunted by the devil: would we come within the compass of the lion’s paw, or within the chain of a mad dog, or of an hunger-bitten bear? Why then should we rashly thrust ourselues into the danger of the devil, who like a roaring lion seeks continually whom he may devour. Many ignorant people are so bold-hardy that they will rai•e upon and defy the deuil, and command him to be gone. But without a calling thereunto we may not so do. Indeed, if by God’s providence we be called to live in such places necessarily, then this we may do, we must not reason with the devil, but betake ourselves to God by humble and earnest prayer, and complain of Satan’s vexation, making God our shelter and defence both for soul and body: else if we presume to meddle with him without a calling from God, we may justly be foiled and abused by him (as the sons of Sceva were, Acts 19:14,16) because we have no promise from the Lord to be protected from him.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/william-perkins.html">William Perkins</a></span><span class="wk"><span class="lbl">Work:</span> <cite>A Godly &amp; Learned Exposition of Christ’s Sermon in the Mount</cite>, on Mt. 6:13 in A Godly &amp; Learned Exposition of Christ’s Sermon in the Mount... (Cambridge, 1608), pp. 315-6</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/angels-and-demons/evil-angels.html">Evil Angels</a></span></div>

<blockquote><p>Until the day Dr. Peck first met the young woman called Jersey, he did not believe in the devil. In fact, as a mature, highly experienced psychiatrist, he expected that this case would resolve his ongoing effort to prove to himself, as scientifically as possible, that there were absolutely no grounds for such beliefs. Yet what he discovered could not be explained away simply as madness or by any standard clinical diagnosis… …he recounts his journey from skepticism to eventual acknowledgment of the reality of an evil spirit, even at the risk of being shunned by the medical establishment.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/m-scott-peck.html">M. Scott Peck</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Glimpses of the Devil</cite></span></figcaption>

<div class="actions"><button class="copy" data-copy="“Until the day Dr. Peck first met the young woman called Jersey, he did not believe in the devil. In fact, as a mature, highly experienced psychiatrist, he expected that this case would resolve his ongoing effort to prove to himself, as scientifically as possible, that there were absolutely no grounds for such beliefs. Yet what he discovered could not be explained away simply as madness or by any standard clinical diagnosis… …he recounts his journey from skepticism to eventual acknowledgment of the reality of an evil spirit, even at the risk of being shunned by the medical establishment.”

<blockquote><p>But here we meet with a question often discussed and much debated, both by learned men and Idiots: Whether Sorcerers or Witches, Fairies or Spirits, (call them by what name you will) can raise any tempests, or bring down such Hail as we oft see?

To which we answer with a distinction, that as they have some, so they have no absolute nor self sufficient power to hurt, for even Satan himself (whose power otherwise is great, whose bondslaves and vassals these wretched varlets are) cannot hurt either man or beast, either how or when him list, much less these accursed slaves of his, can have the air and winds at commandment, but GOD in his righteous judgment giving him leave, what may he not do? work wonders in the world, shake the heavens, trouble the air, frush [sic] the earth, and torn all things topside otherway, a passing nimble spirit he is doubtless, and a most speedy workman, so that out of hand, even in the twinkling of an eye, he will use his leave granted, to some mischief. The Hogs without leave (of God the Father) Matthew the 8. Chapter, he could not possess, but no sooner had he obtained leave, but presently he tumbleth them headlong into the sea.

The Egyptian Sorcerers wrought incredible wonders, imitating Moses and Aaron, before Pharaoh. Known and memorable is that story of Job to this purpose, to show that this Behemoth being curbed, he is disabled, but if the reins be given him, there is no ho [sic] with him, and yet hath he his bounds set him, which he cannot pass in any wise.

Whereupon Origen on that place breaketh out in this wise. How sweet is thy kindness O King of heaven, how mighty is thy power, how glorious thy majesty o eternal God? How greatly comfortest thou those which fly unto thee, that the Adversary of Mankind hath no power over any creature, but that which is granted him by permission? Neither is he permitted but where GOD doth know it may make for the evidence of faith, for the trial of constancy, and for a pledge of a glorious reward: which we knowing, let us with care and fear flee unto God, and with instance of prayer, and sincerity of heart, cry unto him, to deliver us from the cruel assaults, and from the subtle snares of the wicked, and suffer vs not to be tempted above our strength. Thus far Origen,

Now to our purpose, these Sorcerers having covenanted with the Devil, he useth their malice to his purpose: he deviseth for them, and prescribeth to them Medicines, Drugs, Poisons, Exorcisms, wherewith they may hurt men, children and beasts, infect pastures, deceive the senses, juggle cunningly, work incredibly, but not without his assistance. Who though they be thus conjured together, yet holding Saint Paul’s ground (If God be with us, who can be against us?) what need we fear? For this is sure, that though they have both ability, and will, yet have they no authority more then limited, especially against the faithful, which are ever under the shadow of the Almighty. But for the raising of storms, the congealing of hail, the whirling of winds, we utterly deny them any power that way, because holy writ attributeth the raising and ruling of these tempests to God alone.

Why but themselves willingly without any torture, and boldly without fear, avow that they can trouble the air, and disturb the elements at their pleasure. But I say as boldly, that this (as many other their assertions) is but a Devilish illusion. For Satan by natural reason, and by his quick conceit, not only knoweth the causes, places, and effects of tempests, but also executeth partly with, and partly against his will, the just judgment of God’s indignation: for he is (sayeth Origin) God’s Executioner. Now he knoweth these circumstances, having his commission with his leave granted, presently goes to his accomplices, puts them in mind of their bargain, promiseth now to wreak their malice, as they desire, teacheth them the means how to effect it, and sometimes forceth them by violence unto it. And thus those malicious Miscreants go to their business, bring their purpose to passe, and rejoice in the fatal issues of their accursed Art: And now hath this old Deceiver obtained that he would, not only in binding these Wretched Souls, as with a three-fold Cord, unto his own will, but also in persuading others to ascribe any Calamity, Dearth, or Penury, not to God’s Judgment, but to the power and malice of these Accursed Caitiffs.</p></blockquote>

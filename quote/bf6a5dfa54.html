<main class="wrap"><figure class="quote" id="q-bf6a5dfa54" data-kw="">
<blockquote><p>I have seen hot love, soon cold; and love that has continued to act, yet act towards the end, as the man that by running, and has run himself off his legs, pants, and can hardly run any longer: but I never saw love like the love of Christ, who as a giant, and bridegroom coming out of his chamber, and as a strong man, rejoiceth to run his race (Psa 19:5). Loving higher and higher, stronger and stronger, I mean as to the lettings out of love, for he reserveth the best wine even till the last (John 2:10).</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/john-bunyan.html">John Bunyan</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Saints’ Knowledge of Christ’s Love</cite></span></figcaption>
<div class="meta"><span class="t"><a href="../topics/the-christian-life/love.html">Love</a></span></div>

</figure><figure class="quote" id="q-c28bff1c27" data-kw="">
<blockquote><p>Consider therefore, his infinite condescension, grace, and love herein. Why all this towards you? Does he stand in need of you? Have you deserved it at his hands? Did you love him first? Cannot he be happy and blessed without you? Has he any design upon you, that he is so earnest in calling you unto him? Alas! it is nothing but the overflowing of mercy, compassion, and grace, that moves and acts him herein.</p></blockquote>

</figure><figure class="quote" id="q-98ebf40a4f" data-kw="">
<blockquote><p>In reference to grateful love, nothing so much tends to fill the heart with this emotion as the believing realization of Christ’s redemption work—nothing so melts the heart; and no purer love to God can be imbibed. … There is no motive to a holy life so powerful and efficacious as that which is drawn from the propitiatory work of Christ, who, after meeting the demands of the law and bearing its curse, makes that same law a rule to direct our steps; and Christians learn to take it from the Mediator’s hand.</p></blockquote>

</figure><figure class="quote" id="q-4c214d30fa" data-kw="">
<blockquote><p>If any thing be altered or added which is not commanded of God, being not essential, but accidental, and not as necessary, but as indifferent, appertaining to decency, or to order, or to edification, we cannot hence conclude that anything is altered of the appointed worship, or that there is another worship erected. As for example, Christ performed his Supper at night. The apostles were wont to perform it also in the morning, and the Church followed afterwards this time. Should a man hereupon say that anything is derogated from the Supper of the Lord? Surely no, because Christ commanded not the same to be celebrated in the night, as Himself observed it, but only ‘hoc facite,‘ that we should do that (for the matter or substance) which He did, but not at that time wherein He did it. Also to that the primitive Church (as appears in Justin Martyr) did mingle water with the wine in the Lord’s Supper; it is not a sufficient ground to say they altered or changed the institution of the Lord’s Supper, and that for two reasons: One, because it may be that the wine which Christ Jesus gave to his disciples was mingled with water, seeing the apostles do not report the contrary and it is probable that the primitive Church might receive this from the apostles. Another reason is because the primitive Church did not add water as a matter altogether necessary, and so as appertaining to the substance of the Lords Supper, but only to signify a mystery. But if any did commend it as necessary, they did undoubtedly deprave the Lord’s Supper. But they much more, who used only water in the Lord’s Supper, as the Aquarii did, against whom Cyprian did write: for it is evident, that Christ our Sauior used wine, and commanded that we also should do the like. To this add, in that the ancient bishops in the celebration of the Lord’s Supper did put on another garment than that they usually did wear, appertains nothing to the alteration of the Lord’s Supper: For Christ commanded not that we should celebrate his Supper with our usual garments, as He did, but only that we should do that which He did Himself. The like may be affirmed of sundry other things, as well in baptism as in the Supper of the Lord. The sum of all is this: Such things as are added, but yet as matters indifferent, for order, for decency and to edification, such matters do not change the substance of the sacraments, and therefore alter not the worship. But such things as are taken from the institution of Christ, or else are added as necessary, and appertaining to the substance, those things do corrupt the institution of the Lord, and so do establish another kind of worship. To this kind of addition appertain the places of forbidding to add to God’s Word, Dt. 4:1-2. Note that which he there says, ‘Ye shall not add to the Word which I command you,’ the Word of the Lord is necessary, it ties the conscience, and delivers the substance of the worship, and has nothing adiaphoral or indifferent therein: wherefore to add unto the Word is to ordain or appoint in God’s worship some thing as necessary, and as appertaining to the essence or worship of God, and which does so bind men’s consciences, even as the Word of God itself; wherefore he adds not unto the Word of God, which by the consent of the Church ordains anything, not as necessary, but as indifferent, and free for order only, or for decency, and unto edification, not binding the conscience of any by such an ordinance.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/jerome-zanchi.html">Jerome Zanchi</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Of Redemption, ch. 19, fol. 447, as quoted in John Sprint, Cassander Anglicanus, showing the Necessity of Conformity to the Prescribed Ceremonies of our Church in Case of Deprivation (London: Bill, 1618), ‘Reformed Practices’, ‘Practice’</cite>, pp. 177-79</span></figcaption>

<blockquote><p>…distinguishing the Church from Antichrist and his worship brought into the Church, and added to the ordinances thereof for obscuring the worship of Christ… yet is the Temple and Church now different from his additions, as the Temple of the Jews was from the corruptions that were accidentally brought in upon it in the times of corruption. Thus, the Word of God, sacraments, prayer, ordination, etc. are continued, which are as the material worship of God, and, as such, are not Antichristian.</p></blockquote>

<blockquote><p>38. The instruments of producing this faith are the Word and sacraments, not by reason of inherent virtue, but by reason of adhering blessing, and that from God’s ordination. Whence both the use of the Word and Sacraments is to be employed, yet to be circumscribed, and neither is to be attributed to the instruments what belongs to Him who acts through instruments, nor is God to be bound to them, but man only, nor is the same latitude to be judged of our duty and of grace. 39. The efficient cause of this faith is God’s Spirit, who through internal calling produces its act, through sanctification its habit, and through this omnimodo-sanctity according to parts, although not according to degrees, both as to the repurgation of faculties corrupted through sin and as to the convenient subordination of them inverted through sin.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/friedrich-spanheim.html">Friedrich Spanheim</a></span><span class="wk"><span class="lbl">Work:</span> <cite>‘Miscellaneous Theological Disputation exhibiting a Theological Compendium’ in Disputationum Theologicarum Miscellaneorum Pars Prima (d. 1649; Geneva: Chouët, 1652), trans. AI by Roman Prestarri at Confessionally Reformed Theology Latin</cite></span></figcaption>

<div class="actions"><button class="copy" data-copy="“38. The instruments of producing this faith are the Word and sacraments, not by reason of inherent virtue, but by reason of adhering blessing, and that from God’s ordination. Whence both the use of the Word and Sacraments is to be employed, yet to be circumscribed, and neither is to be attributed to the instruments what belongs to Him who acts through instruments, nor is God to be bound to them, but man only, nor is the same latitude to be judged of our duty and of grace. 39. The efficient cause of this faith is God’s Spirit, who through internal calling produces its act, through sanctification its habit, and through this omnimodo-sanctity according to parts, although not according to degrees, both as to the repurgation of faculties corrupted through sin and as to the convenient subordination of them inverted through sin.”

— Friedrich Spanheim, ‘Miscellaneous Theological Disputation exhibiting a Theological Compendium’ in Disputationum Theologicarum Miscellaneorum Pars Prima (d. 1649; Geneva: Chouët, 1652), trans. AI by Roman Prestarri at Confessionally Reformed Theology Latin">Copy</button><a class="share" href="https://x.com/intent/post?text=%E2%80%9C38.+The+instruments+of+producing+this+faith+are+the+Word+and+sacraments%2C+not+by+reason+of+inherent+virtue%2C+but+by+reason+of+adhering+blessing%2C+and+that+from+God%E2%80%99s+ordination.+Whence+both+the+use+of+the+Word+and+Sacraments+is+to+be+employed%2C+yet+to+be+circumscribed%2C+and+neither+is+to+be+attributed+to+the+instruments+what+belongs+to+Him+who+acts+through+instruments%2C+nor+is+God+to+be+bound+to+them%2C+but+man+only%2C+nor+is+the+same+latitude+to+be+judged+of+our+duty+and+of+grace.+39.+The+efficient+cause+of+this+faith+is+God%E2%80%99s+Spirit%2C+who+through+internal+calling+produces+its+act%2C+through+sanctification+its+habit%2C+and+through+this+omnimodo-sanctity+according+to+parts%2C+although+not+according+to+degrees%2C+both+as+to+the+repurgation+of+faculties+corrupted+through+sin+and+as+to+the+convenient+subordination+of+them+inverted+through+sin.%E2%80%9D%0A%0A%E2%80%94+Friedrich+Spanheim%2C+%E2%80%98Miscellaneous+Theological+Disputation+exhibiting+a+Theological+Compendium%E2%80%99+in+Disputationum+Theologicarum+Miscellaneorum+Pars+Prima+%28d.+1649%3B+Geneva%3A+Chou%C3%ABt%2C+1652%29%2C+trans.+AI+by+Roman+Prestarri+at+Confessionally+Reformed+Theology+Latin&amp;url=https%3A%2F%2F5solasquotes.github.io%2Fquote%2F886a61bd3d.html&amp;via=5Solas" target="_blank" rel="noopener">Share on X</a><a class="perma" href="../quote/886a61bd3d.html">Permalink</a><a class="src" href="https://reformedbooksonline.com/topics/topics-by-subject/worship/#:~:text=38.%20The%20instruments%20of%20producing%20this,subordination%20of%20them%20inverted%20through%20sin&amp;text=38.%20The%20instruments%20of%20producing%20this%20faith%20are&amp;text=th

<main class="wrap"><figure class="quote" id="q-c469fd8b7f" data-kw="">
<blockquote><p>I know not any, that ever I read, or heard, said, the sword of men can compel the mind, or compel men in things of the mind; for let the persecuting Emperors, and all the Tyrants on earth, armed with the fury and power of the Prince of the bottomless pit, torture, torment, or kill, they cannot reach soul, mind, will, conscience and affections, we never said that the sword is a means of converting souls to Christ, or that Religion is, or can be compelled: but we hold that the sword is an external, though not simply necessary means to hinder wolves and grievous foxes to destroy the souls of others, by bringing out of their corrupt minds in word, writing, teaching, professing another Gospel, such as fleshly and abominable familism; now the not perverting of the souls of others, the only object of the Magistrates sword, is not the conversion, nor any sign that the false teacher thus hindered to hurt the flock, is converted to the faith.

The Magistrate then defendeth only, and guardeth the Law of God and Church from pestilent heresy, but neither he, nor his sword is hereby made a means, way, or cause of conversion of souls, or propagating the Gospel: who ever usurp the sword to defend ravening wolves, that, with such doctrine destroys the flock of Christ, they give their power to the beast, and their horns and strength to the false Prophet, and I writ it, God shall deliver souls out of their captivity; (for the elect cannot finally be seduced, Matth. 24.24.)</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/samuel-rutherford.html">Samuel Rutherford</a></span><span class="wk"><span class="lbl">Work:</span> <cite>A survey of the spiritual antichrist</cite>, (London: Andrew Crooke, 1648), Part 1.30, pp 261-62.</span></figcaption>

</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-1181f8ced7" data-kw="">
<blockquote><p>It is the duly of government to provide for the moral training and culture of the community, especially of the young, by encouraging education, endowing schools and colleges, watching over their interests with parental solicitude, and taking care that the young shall be educated so as to make them good men and useful citizens. To attain this the reading of the scriptures must be made a prominent part of ordinary school education. To refuse the scriptures a place in common schools is directly to encourage and strengthen the growth of infidelity. Education can never be safely separated from Christian principle. For this reason a national provision for religion should embrace a provision for national education. The latter is an important part of the former. There is an inconsistency on the part of some who while they are friendly to a public provision for schools, are opposed to a public provision for the support of religion. The objection made against the latter may with equal propriety be made against the former, unless schools are so conducted as to have no reference to the Christian religion; and then it might be doubted whether they would he ultimately any advantage to a community.

The immediate end of civil government is the good of society; but this is most perfectly attained where the glory of God is kept in view as the ultimate end. The welfare of society can never be secured irrespective of this. The attainment of the ends of civil government require that provision should be made for Christian instruction and education. Immorality and crime will thus be most surely prevented, and to prevent is incomparably better than to punish crime. The prevalence of vice, and the general corruption of society necessarily and universally accompany mental debasement and religious ignorance. If it were the design of a government to encourage vice and ruin the happiness of a community, the object could not be gained more effectually than by discountenancing religious education and the regular ministration of divine truth from sabbath to sabbath. Let the places of Christian worship be shut, and the schools closed where the scriptures are read, and the race of infidels reared in such a state of things, would soon demonstrate the folly and wickedness of the policy pursued. Society would soon become a pandemonium. And as a national policy may tend to lessen the means of Christian instruction and education, the same ruinous effects will in part follow. The French revolution and the horrid scenes of blood which followed it, show that it is unwise and dangerous to separate religious principle from national policy. Such a course is as dangerous to the safety and stability of a government, as it is destructive of national happiness.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/david-scott.html">David Scott</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Distinctive principles of the Reformed Presbyterian Church</cite>, (Albany, 1841), pp 289-90.</span></figcaption>

</figure><figure class="quote" id="q-9322c0b889" data-kw="">
<blockquote><p>First, consider they are great things that you trust them with, whom you chose to sit in the great Senate of the Nation; you trust them with your purse, and I am sure most of you account that something, whatever you think of other things; you will know him well, to whom you will give the Key of your chest, where your money lies. You trust them with your liberties and lives, and those your purses have paid soundly for; yea, with your Religion, without which the other are not worth the taking up.

In one word, with all that is dear to you as English men, as Christians, you put that power into their hands, which if they be not the more faithful, they may turn like a cannon upon your own breasts, and so you most truly become felo de se, guilty of your own miseries; and let me tell you, those sorrows have a peculiar bitterness in them above all other, which are not imposed on us, but chosen by us.

Better an enemy should come in and turn us by force of arms, out of possession of these, then we send those that shall vote us out of them, partly because of the little pity we shall deserve, or can reasonably expect from others, when they shall see the rod with which we are whip’t was of our own gathering; as also because of the inward guilt which will add a further stinging consideration then all this to our sorrows, and deprive us of those comforts which the conscience of doing our duty would help us to, in the greatest calamities that otherwise could befall us. He that is accessory to the burning down of his house, by the negligence of a drunken person, whom he trusted to watch and keep it, hath more reason to be troubled, then he that hath it consumed by a fire from heaven, or some other inevitable Providence.

O Sirs, there are less matters then these, in which you would be very choice and curious; if you were to chose a Nurse for your child, you would look for one of a healthful constitution and good disposition, you would weigh and taste her milk whether good or no; You are now to choose Nurses for three Nations, so Magistrates are called in Scripture, Nursing Fathers and Mothers; You are to choose these in a time of these Nations languishing, as the only means under God, (so thought by the best Physicians among us,) to recover the consumptive state of this great body; and will you send any to such a place and work, before you know what milk they have given in their private capacities in the Country?

If you were to choose a Shield, should it be one that would let the arrow come through it, to pierce you to the heart? Magistrates are the Shields of the earth. You value the life of the Nation little, that will put a Shield into its hand you have not well tried; I am sure, David threw away Armour, though it were a Kings, because he had not tried it; in a word, if you were but to choose a Shepherd, or a Herdsman, any should not serve your turn. Pharaoh a King thought it not beneath his care, though in so low a business, Gen. 47.6. If thou knowest any man, saith he to Joseph, of activity amongst thy brethren, make them rulers over my cattle; you are to choose such, as are not to go before beasts, but to lead in and out the Lord’s people and flock.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/william-gurnall.html">William Gurnall</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Magistrate’s Pourtraiture drawn from the Word, and Preached in a Sermon at Stowe-Market in Suffolk, upon August, the 20. 1656. before the Election of Parliament-men for the same County</cite>, (London: Ralph Smith, 1656), pp 23-25.</span></figcaption>

atch+and+keep+it%2C+hath+more+reason+to+be+troubled%2C+then+he+that+hath+it+consumed+by+a+fire+from+heaven%2C+or+some+other+inevitable+Providence.%0A%0AO+Sirs%2C+there+are+less+matters+then+these%2C+in+which+you+would+be+very+choice+and+curious%3B+if+you+were+to+chose+a+Nurse+for+your+child%2C+you+would+look+for+one+of+a+healthful+constitution+and+good+disposition%2C+you+would+weigh+and+taste+her+milk+whether+good+or+no%3B+You+are+now+to+choose+Nurses+for+three+Nations%2C+so+Magistrates+are+called+in+Scripture%2C+Nursing+Fathers+and+Mothers%3B+You+are+to+choose+these+in+a+time+of+these+Nations+languishing%2C+as+the+only+means+under+God%2C+%28so+thought+by+the+best+Physicians+among+us%2C%29+to+recover+the+consumptive+state+of+this+great+body%3B+and+will+you+send+any+to+such+a+place+and+work%2C+before+you+know+what+milk+they+have+given+in+their+private+capacities+in+the+Country%3F%0A%0AIf+you+were+to+choose+a+Shield%2C+should+it+be+one+that+would+let+the+arrow+come+through+it%2C+to+pierce+you+to+the+heart%3F+Magistrates+are+the+Shields+of+the+earth.+You+value+the+life+of+the+Nation+little%2C+that+will+put+a+Shield+into+its+hand+you+have+not+well+tried%3B+I+am+sure%2C+David+threw+away+Armour%2C+though+it+were+a+Kings%2C+because+he+had+not+tried+it%3B+in+a+word%2C+if+you+were+but+to+choose+a+Shepherd%2C+or+a+Herdsman%2C+any+should+not+serve+your+turn.+Pharaoh+a+King+thought+it+not+beneath+his+care%2C+though+in+so+low+a+business%2C+Gen.+47.6.+If+thou+knowest+any+man%2C+saith+he+to+Joseph%2C+of+activity+amongst+thy+brethren%2C+make+them+rulers+over+my+cattle%3B+you+are+to+choose+such%2C+as+are+not+to+go+before+beasts%2C+but+to+lead+in+and+out+the+Lord%E2%80%99s+people+and+flock.%E2%80%9D%0A%0A%E2%80%94+William+Gurnall%2C+The+Magistrate%E2%80%99s+Pourtraiture+drawn+from+the+Word%2C+and+Preached+in+a+Sermon+at+Stowe-Market+in+Suffolk%2C+upon+August%2C+the+20.+1656.+before+the+Election+of+Parliament-men+for+the+same+County%2C+%28London%3A+Ralph+Smith%2C+1656%29%2C+pp+23-25.& <blockquote><p>Yet we must remember, that this restriction [against eating blood] was part of the old law. Wherefore, what Tertullian relates, that in his time it was unlawful among Christians to taste the blood of cattle, savours of superstition. For the apostles, in commanding the Gentiles to observe this rite, for a short time, did not intend to inject a scruple into their consciences, but only to prevent the liberty which was otherwise sacred, from proving an occasion of offense to the ignorant and the weak.</p></blockquote>

<blockquote><p>For besides the moral precepts (in which all mankind are concerned) we have an account of the laws of the Israelites by which they were to be governed in their own land: And though it be true, that these judicial laws were given to the Hebrews, and that they were concerned in them, and that other nations must be governed by the laws of their several countries, yet, certain it is, that the justice and the equity, on which these laws are founded, and which they recommend, are worthy the consideration and imitation too of other nations. And if inquisitive persons think it worth their while to look into the laws of Sparta, and Athens, of Rome and other kingdoms and commonwealths, certainly they must judge the laws of Moses, which came from God Himself, are well worthy their looking into, and their serious consideration.</p></blockquote>

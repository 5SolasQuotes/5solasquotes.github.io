<main class="wrap"><figure class="quote" id="q-0720d2dc5c" data-kw="">
<blockquote><p>VIII. Fifth, the injustice of the demand appears also clearly in this—that they treacherously corrupt the writings of the fathers and endeavor to destroy whatever of candor remains and extinguish all memory of antiquity as far as they are able (most base men). They wish to turn against us the arms of truth which they themselves have tempered with, overlaid and expunged because we cannot bring them forward. They, who persecuted the pious with flames and the sword, now make sport of them, evidently as the Jews who, smiting Christ with rods, said, “prophesy who struck you.” Thus they wish us to prophesy and to give a reason for a previous time.

IX. Sixth, if our opponents wish us to answer the proposed question, they are also bound to answer us—where was their church in the time of Christ and the apostles, in which nothing concerning either transubstantiation, the sacrifice of the Mass, the invocation of saints and the worship of images, purgatory, indulgences, the pope and his authority, and the other errors theoretical and practical prevailed as yet among believers? Let them show us where then was that magnificent apparatus of temples and ceremonies which has corrupted Christianity completely and converted divine worship into a show. Where was the papacy in the first six centuries of purer (or at least of less impure) Christianity? For although various errors began gradually to creep into the church, still it is certain that far more numerous and grievous errors were introduced in the following ages or received strength: The worship of images, transubstantiation, communion under one species, the infallibility and monarchy of the pope, the use of a foreign language in the sacred service, etc. let them show where the church was in the 10th century (which Baronius calls the “iron” age), in which there were more than 50 Popes succeeding each other, not so much apostolical (apostolici), as “apostatical” (apostatici) And “apostactical” (apostactici) (according to Genebrard).</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/francis-turretin.html">Francis Turretin</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Institutes of Elenctic Theology</cite>, 18.10.8–9.</span></figcaption>

</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-cd1dc35099" data-kw="Equality of apostles">
<blockquote><p>If Peter was constituted an ecumenical pontiff, he was greater and superior to the others. But we read of no such superiority having been bestowed upon Peter above the others by Christ or usurped by Peter himself or acknowledged by the apostles. Christ sends them equally: “As the Father sent me, so send I you” (Jn. 20:21). He equally breathes his Spirit into them (v. 22) and gives them the power to remit and to retain sins: “Whose soever sins ye remit, they are remitted unto them; and whose soever sins ye retain, they are retained” (v. 23). He equally gives to all the command to preach and to baptize: “Go ye therefore, and teach all nations” (Mt. 28:19). Hence, he promises them an equality of thrones: “In the regeneration” (i.e., in the renovation of the church caused by the gospel) “ye shall sit upon twelve thrones, judging the twelve tribes of Israel” (Mt. 19:28).</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/francis-turretin.html">Francis Turretin</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Institutes of Elenctic Theology</cite>, 18.17.5</span></figcaption>

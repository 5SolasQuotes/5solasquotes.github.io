<main class="wrap"><figure class="quote" id="q-d0d239f23f" data-kw="">
<blockquote><p>A man may be in some sort called by another to exercise some power which is not his that so called him. As when a physician is called by the civil magistrate or by a bishop to exercise such art as he has, among the people that are ruled by him. For no man I think will say that such a physician in giving of a potion does exercise a kingly or an episcopal power. So likewise is the case of a schoolmaster set in place by a bishops license and authority: in teaching of grammar, he does not exercise the power of a bishop.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/william-ames.html">William Ames</a></span><span class="wk"><span class="lbl">Work:</span> <cite>A Second Manuduction for Mr</cite>, [John] Robinson. Or a confirmation of the former in an answer to his manumission (Amsterdam, 1615), p. 14</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/church-government-and-the-ministry/forms-of-government.html">Forms of Government</a></span></div>

</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-4307c99bbc" data-kw="">
<blockquote><p>I remember one of our brethren of Scotland, in a discourse tending to the advancing of the presbyterian way, tells us that Dr. Montague, the late worthy bishop of Winchester, asked King James of blessed memory (whose sweet affability the world well knew) how it came about that there were so few heresies and errors of doctrine broached and prosecuted to the public disturbance of the Church of Scotland? Unto which the wise and learned king is said to have returned this answer: ‘That every parish has their pastor ever present with them and watching over them; that the pastor has his elders and deacons sorted with him; that he with them once a week meets at a set time and place for the censure of manners or whatever disorder falls out in the parish; so as he by this means perfectly knows his flock and every aberration of them, either in matter of opinion or practice: And lest any error or heresy may seize upon the pastor; they have their presbyteries, consisting of several shrivalties, which meet together in the chief town or city next to them, every week also once; and have there their exercise of prophesying; after which the moderator of the said meeting asks and gathers the judgements of all the said pastors concerning the doctrine then delivered, or, of any other doubtful point that is then and there propounded; And if the said presbyters be divided in their opinions, then the question is, under an enjoined silence, put over to the next synod, which is held twice a year; unto that all the pastors of that quarter or province duly resort; accompanied with their elders; the moderator of the former synod begins the action; then a new moderator is chosen for the present, or (as it seldom falls out) the last moderator, by voices, continued. Any question of doubt being proposed is either decided by that meeting or (if it cannot be so done) is, with charge of silence, reserved till the national synod or general assembly; which they hold every year once; whither come not the pastors only, but the king himself or his commissioners and some of all orders and degrees sufficiently authorized for the determining of any controversy that shall arise amongst them.&#x27;</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/king-james-i.html">King James I</a></span><span class="wk"><span class="lbl">Work:</span> <cite>as narrated by Joseph Hall, ‘A Modest Offer of some meet Considerations tendered to the Learned Prolocutor and to the rest of the Assembly of Divines met at Westminster’</cite>, (Oxford, 1644), pp. 8-10</span></figcaption>

<blockquote><p>2. I grant the whole, and yet nothing is concluded against us. For the power of the keys is not given to the catholic presbytery as to the first subject, to be a mean of edification in an ordinary and constant way; but only in an extraordinary and occasional way, in those things which concern the power of jurisdiction belonging to the whole catholic Church. By ‘extraordinary’ here, I mean not that which is against a particular law of God, and cannot be done without a divine dispensation of providence, but by ‘extraordinary’ I mean that which is raro contingens, and does not oft fall out; as almost it never falls out that the universal Church has need to excommunicate a national Church, for all and every one of a national Church do never fall away from the faith. Yet a remote power for excommunication is in the catholic visible Church.</p></blockquote>

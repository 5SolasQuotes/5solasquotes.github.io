<main class="wrap"><figure class="quote" id="q-33c24143a8" data-kw="">
<blockquote><p>But here it is requisite, that we make a difference betwixt the office which is the good ordinance of God, and the evil person that doth not rightly execute that good office. If therefore in the magistrate evil be found, and not the good for which he was ordained, that cometh of other causes, and the fault thereof is the men of persons, which neglect God and corrupt the ordinance of God, and not in God, nor in his ordinance: for either the evil prince, seduced by the devil, corrupteth the ways of God, and by his own fault and naughtiness transgresseth God’s ordinance, so far, that he doth worthily deserve the name of devilish power, and not divine authority[.]

[W]e have an example of this in the magistrate of Jerusalem. For although he was able to refer the beginning of his power by degrees to Moses, and so to God himself who ordained it — yet, because he arrests the Saviour in the garden and binds him, it is said to his servants, “Ye are come out as it were to a thief with swords and staves; when I was with you daily in the temple, ye stretched not forth your hands against me. But this is even your hour, and the power of darkness.” Lo, here he calleth the ordinary magistrate the power of the devil, when he abuseth his power. What could be more evidently spoken? But here ye must mark, that the reproach was in the person, and not in the office.

Likewise also the Roman empire was ordained by God, as by the visions of Daniel it is clearly evident: and yet, when Nero, not without God’s ordinance, bare the sway in the empire, whatsoever he did as king and emperor, contrary to the office of a good king, that did he not of God, but of the devil: for whereas he hung up and beheaded the apostles of Christ, moving a bloody persecution against the church, that sprang not from elsewhere than from the devil, the father of murder. So then, verily, we ought not at any time to defend the tyrannical power, and say that it is of God: for tyranny is not a divine, but a devilish, kind of government; and tyrants themselves are properly the servants of the devil, and not of God.</p></blockquote>

</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-09822e2260" data-kw="">
<blockquote><p>God gives kingdoms to whom He will. What then?… and He gives tyrannous conquests to whom He will: and it is Nebuchadnezzar to whom Daniel speaks that from the Lord [Dan. 5:21], and he had no just title to many kingdoms, especially to the kingdom of Judah, which yet God, the King of kings, gave to him because it was his good pleasure; and if God had not commanded them by the mouth of his prophet Jeremiah, might they not have risen, and, with the sword, have vindicated themselves and their own liberty, no less than they lawfully, by the sword, vindicated themselves from under Moab, (Judges 3) and from under Jabin, king of Canaan, who, twenty years, mightily oppressed the children of Israel, Judges 4. Now this Popish Prelate [John Maxwell], by all these instances, making heathen kings to be kings by as good a title as David and Hezekiah, [implicitly] condemns the people of God as rebels, if, being subdued and conquered by the Turk and Spanish king, they should, by the sword, recover their own liberty [such as happened the Reformation in the Netherlands]; and that Israel, and the saviours which God raised to them, had not warrant from the law of nature to vindicate themselves to liberty, which was taken from them violently and unjustly by the sword… for Nebuchadnezzar’s sovereignty over the people of God, and many other kingdoms also, was revenged of God as tyranny, Jer. 1:6-7; and therefore the vengeance of the Lord, and the vengeance of his temple, came upon him and his land, Jer. 1:16, etc. It is true the people of God were commanded of God to submit to the king of Babylon, to serve him, and to pray for him, and to do the contrary was rebellion; but this was not because the king of Babylon was their king, and because the king of Babylon had a command of God so to bring under his yoke the people of God. So Christ had a commandment to suffer the death of the cross (John 10:18) but had Herod and Pilate any warrant to crucify him? None at all.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/samuel-rutherford.html">Samuel Rutherford</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Lex Rex</cite>, ... (1644; Edinburgh: Ogle, 1843), p. 16</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/civil-government-and-society/resistance-to-tyranny-and-lawful-authority.html">Resistance to Tyranny and Lawful Authority</a></span></div>

<blockquote><p>with the Reformed Churches, martyrs, confessors, doctors, we detest it [the Romish mass] from the heart as a denial of the unique sacrifice of Christ on the cross, and execrable idolatry, as our [Heidelberg] Catechism says in question 80. Moreover, we add that Christian Magistrates most gravely wound their conscience when they knowingly and willingly allow the miserable people to be imposed on by those abominable rites; which, however, we do not want to apply to those who can protest before God in conscience that they only tolerate an evil which they cannot remove without subversion of the Republic, or great concussion, or formidable and inevitable danger; which brings more evil than tolerating the mass.</p></blockquote>

<blockquote><p>And hereupon the question is wont to be demanded: Whether an evil, that is, a tyrannical magistrate be of God or no? To this I answer, that God is the author of good and not of evil. For God by nature is good, and all his purposes are good, being directed to the health and preservation, not to the destruction, of us men. Therefore the good and healthful ordaining of the magistrate, without all doubt, is of God Himself, who is the author of all goodness. But here it is requisite, that we make a difference between the office which is the good ordinance of God, and the evil person that does not rightly execute that good office. If therefore in the magistrate evil be found, and not the good for which he was ordained, that comes of other causes, and the fault thereof is in the men and persons, which neglect God and corrupt the ordinance of God, and not in God, nor in his ordinance: for either the evil prince, seduced by the devil, corrupts the ways of God, and by his own fault and naughtiness transgresses God’s ordinance, so far, that he does worthily deserve the name of devilish power, and not divine authority;-(we have an example hereof in the magistrate of Jerusalem: for although he were able to refer the beginning of his power by degrees unto Moses, and so unto God Himself who did ordain it; yet, for because he takes the Savior in the garden and binds Him, to his servants it is said, ‘Ye are come out as it were to a thief with swords and staves; when I was daily with you in the temple, ye stretched not forth your hands against me; but this is even your hour, and the power of darkness.’ Lo, here he calls the ordinary magistrate the power of the devil, when he abuses his power. What could be more evidently spoken? But here ye must mark, that the reproach was in the person, and not in the office. Likewise also the Roman empire was ordained by God, as by the visions of Daniel it is clearly evident: and yet, when Nero, not without God’s ordinance, bare the sway in the empire, whatsoever he did as king and emperor, contrary to the office of a good king, that did he not of God, but of the devil…</p></blockquote>

<div class="actions"><button class="copy" data-copy="“And hereupon the question is wont to be demanded: Whether an evil, that is, a tyrannical magistrate be of God or no? To this I answer, that God is the author of good and not of evil. For God by nature is good, and all his purposes are good, being directed to the health and preservation, not to the destruction, of us men. Therefore the good and healthful ordaining of the magistrate, without all doubt, is of God Himself, who is the author of all goodness. But here it is requisite, that we make a difference between the office which is the good ordinance of God, and the evil person that does not rightly execute that good office. If therefore in the magistrate evil be found, and not the good for which he was ordained, that comes of other causes, and the fault thereof is in the men and persons, which neglect God and corrupt the ordinance of God, and not in God, nor in his ordinance: for either the evil prince, seduced by the devil, corrupts the ways of God, and by his own fault and naughtiness transgresses God’s ordinance, so far, that he does worthily deserve the name of devilish power, and not divine authority;-(we have an example hereof in the magistrate of Jerusalem: for although he were able to refer the beginning of his power by degrees unto Moses, and so unto God Himself who did ordain it; yet, for because he takes the Savior in the garden and binds Him, to his servants it is said, ‘Ye are come out as it were to a thief with swords and staves; when I was daily with you in the temple, ye stretched not forth your hands against me; but this is even your hour, and the power of darkness.’ Lo, here he calls the ordinary magistrate the power of the devil, when he abuses his power. What could be more evidently spoken? But here ye must mark, that the reproach was in the person, and not in the office. Likewise also the Roman empire was ordained by God, as by the visions of Daniel it is clearly evident: and yet, when Nero, not without God’s ordinance, bare the sway in the empire, whatsoever he did as king and emperor, contrary to the office of a good king, that did he not of God, but of the devil…”

— Heinrich Bullinger, The Decades, 1570’s-1580’s, as quoted in, ed. Edmund Morgan, Puritan Political Ideas, 1558-1794, pp. 18-19">Copy</button><a class="share" href="https://x.com/intent/post?text=%E2%80%9CAnd+hereupon+the+question+is+wont+to+be+demanded%3A+Whether+an+evil%2C+that+is%2C+a+tyrannical+magistrate+be+of+God+or+no%3F+To+this+I+answer%2C+that+God+is+the+author+of+good+and+not+of+evil.+For+God+by+nature+is+good%2C+and+all+his+purposes+are+good%2C+being+directed+to+the+health+and+preservation%2C+not+to+the+destruction%2C+of+us+men.+Therefore+the+good+and+healthful+ordaining+of+the+magistrate%2C+without+all+doubt%2C+is+of+God+Himself%2C+who+is+the+author+of+all+goodness.+But+here+it+is+requisite%2C+that+we+make+a+difference+between+the+office+which+is+the+good+ordinance+of+God%2C+and+the+evil+person+that+does+not+rightly+execute+that+good+office.+If+therefore+in+the+magistrate+evil+be+found%2C+and+not+the+good+for+which+he+was+ordained%2C+that+comes+of+other+causes%2C+and+the+fault+thereof+is+in+the+men+and+persons%2C+which+neglect+God+and+corrupt+the+ordinance+of+God%2C+and+not+in+God%2C+nor+in+his+ordinance%3A+for+either+the+evil+prince%2C+seduced+by+the+devil%2C+corrupts+the+ways+of+God%2C+and+by+his+own+fault+and+naughtiness+transgresses+God%E2%80%99s+ordinance%2C+so+far%2C+that+he+does+worthily+deserve+the+name+of+devilish+power%2C+and+not+divine+authority%3B-%28we+have+an+example+hereof+in+the+magistrate+of+Jerusalem%3A+for+although+he+were+able+to+refer+the+beginning+of+his+power+by+degrees+unto+Moses%2C+and+so+unto+God+Himself+who+did+ordain+it%3B+yet%2C+for+because+he+takes+the+Savior+in+the+garden+and+binds+Him%2C+to+his+servants+it+is+said%2C+%E2%80%98Ye+are+come+out+as+it+were+to+a+thief+with+swords+and+staves%3B+when+I+was+daily+with+you+in+the+temple%2C+ye+stretched+not+forth+your+hands+against+me%3B+but+this+is+even+your+hour%2C+and+the+power+of+darkness.%E2%80%99+Lo%2C+here+he+calls+the+ordinary+magistrate+the+power+of+the+devil%2C+when+he+abuses+his+power.+What+could+be+more+evidently+spoken%3F+But+here+ye+must+mark%2C+that+the+reproach+was+in+the+person%2C+and+not+in+the+office.+Likewise+also+the+Roman+empire+was+ordained+by+God%2C+as+by+the+visions+of+Daniel+it+is+clearly+evident%3A+and+yet%2C+when+Nero%2C+not+without+God%E2%80%99s+ordinance%2C+bare+the+sway+in+the+empire%2C+whatsoever+he+did+as+king+and+emperor%2C+contrary+to+the+office+of+a+good+king%2C+that+did+he+not+of+God%2C+but+of+the+devil%E2%80%A6%E2%80%9D%0A%0A%E2%80%94+Heinrich+Bullinger%2C+The+Decades%2C+1570%E2%80%99s-1580%E2%80%99s%2C+as+quoted+in%2C+ed.+Edmund+Morgan%2C+Puritan+Political+Ideas%2C+1558-1794%2C+pp.+18-19&amp;url=https%3A%2F%2F5solasquotes.github.io%2Fquote%2F49c8841963.html&amp;via=5Solas" target="_blank" rel="noopener">Share on X</a><a class="perma" href="../quote/49c8841963.html">Permalink</a><a class="src" href="https://reformedbooksonline.com/against-separation-from-impure-civil-governments/#:~:text=And%20hereupon%20the%20question%20is%20wont,of%20God%2C%20but%20of%20the%20devil&amp;text=And%20hereupon%20the%20question%20is%20wont%20to%20be&amp;text=he%20not%20of%20God%2C%20but%20of%20the%20devil" rel="noopener" target="_blank">Read it online · Reformed Books Online</a></div>

<blockquote><p>If it be just to do, which thou through constraint hast promised, it is just also for thee to promise by oath to do it. For what we may lawfully do, the same also we may lawfully promise by an oath to do. As, if a man falling into the hands of a thief, should be required by the thief to give a piece of money for the redeeming of his life; verily he not only may, but also ought, if he be able, to perform that which the thief requires. And if this be lawfully performed unto a thief, it is lawfully also performed unto him by an oath.</p></blockquote>

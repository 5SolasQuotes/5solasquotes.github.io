<main class="wrap"><figure class="quote" id="q-447a4bfa17" data-kw="">
<blockquote><p>Too high an estimation of any peculiar way of worship is apt to entice the minds of some into a hurtful confidence in these things. Having an apprehension that they alone have attained unto the right way of gospel worship and the administration of its ordinances, and that, perhaps, on such accounts as wherein they are eminently deceived, they begin first greatly to value themselves, and then to despise all others, and, if they can, to persecute them. This insensibly works them into a trust in that which they esteem so excellent, and that unto an open neglect of things of a greater weight and moment. Thus is it not unusual to see persons who are under the power of some singular opinion and practice in religion to make one thing almost their whole business, the measure of other things and persons, the rule of communion and of all sincere love;—to value and esteem themselves and others according unto their embracing or not embracing of that opinion… Wherefore, although we ought greatly to prize and to endeavour after the true order of the church of Christ, the purity of worship, and regular administration of ordinances, yet let us take heed that we prize not ourselves too much on what we have attained; for if we do so, we shall be very apt to countenance ourselves in other neglects thereby, which will certainly bring us into a spiritual sickness and declension.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/john-owen.html">John Owen</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Works of John Owen</cite>, (NY: Robert Carter, 1852), vol. 7, Nature &amp; Causes of Apostasy from the Gospel, ch. 12, pp. 252-53</span></figcaption>

17.html">Permalink</a><a class="src" href="https://reformedbooksonline.com/topics/topics-by-subject/worship/#:~:text=Too%20high%20an%20estimation%20of%20any,into%20a%20spiritual%20sickness%20and%20declension&amp;text=Too%20high%20an%20estimation%20of%20any%20peculiar%20way&amp;text=bring%20us%20into%20a%20spiritual%20sickness%20and%20declension" rel="noopener" target="_blank">Read it online · Reformed Books Online</a></div>

<blockquote><p>The Papists say indeed that all additions corrupting the worship of God are forbidden, but such as further adorn and preserve it are not so, which implies a contradiction, for whereas every addition is principally a corruption because it is an addition, under which notion it is forbidden (and that in the worship of God which is forbidden, is a corruption of it), there can be no such preserving, adorning addition, unless we will allow a preserving and adorning corruption. Neither is it of more force which is pleaded by them that the additions which they make belong not unto the substance of the worship of God, but unto the circumstances of it, for every circumstance observed religiously, or to be observed in the worship of God, is of the substance of it, as were all those ceremonious observances of the [Mosaic] Law which had the same respect in the prohibitions of adding with the most weighty things whatsoever.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/john-owen.html">John Owen</a></span><span class="wk"><span class="lbl">Work:</span> <cite>A Brief Instruction in the Worship of God</cite>, … (London: 1667), Question 14, ‘May not the Church find out and appoint to be observed such religious rites, as being adjoined unto the celebration of God’s instituted worship, may farther the devotion of the worshippers and render the worship itself in its performance more decent, beautiful and orderly…?’, pp. 64-65</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/worship/nature-of-worship.html">Nature of Worship</a></span></div>

<blockquote><p>Doctrine Two. We may consider Christ’s sufferings and death in the fruits of it, either as they respect common favors, and mercies, common gifts, and means of grace, which are not peculiar and saving, but common to believers with others, being bestowed upon professors in the visible Church; or as they are peculiar and saving, such as faith, justification, adoption, etc. Now when we say that Christ’s sufferings and death are a price for the sins of his people, we exclude not the reprobate simply from temporal and common favors and mercies that come by his death; they may have, and actually have, common gifts and works of the Spirit, the means of grace, which are some way effects and fruits of the same covenant. But we say, that the reprobate partake not of saving mercy and that Christ’s death is a satisfaction only for the elect, and that none others get pardon of sin, faith, repentance, etc. by it, but they only; it was intended for none others. And this we clear and confirm from, and by, these following grounds and arguments, which we will shortly hint at.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/james-durham.html">James Durham</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Christ Crucified: The Marrow of the Gospel in 72 Sermons on Isaiah 53</cite>, (Dallas, TX: Naphtali Press, 2001), pp. 343-44</span></figcaption>

<blockquote><p>I do not here conceive that the Church acknowledges she has cast off her garments of Christ’s righteousness; for then how should she remain the spouse of Christ? Yea, how then should her heart have been otherwise than asleep too? But only she pleads she should appear too naked if she should open to Christ, if she should worship Him in the simplicity and nakedness of his simple ordinances.</p></blockquote>

<blockquote><p>…worship taken generally, signifies the giving of honor and reverence to another. Now this honor is either civil or divine. Civil honor is that outward reverence we give to men, by prostrating of the body, or bowing of the knee; and the end of this civil worship is, that thereby we might acknowledge another to be our superior… The second kind of honor is divine or religious worship, when we give such honor to another that thereby we do ascribe divinity and divine power unto it, acknowledging thereby that it is some divine thing above all creatures. And this we do first, when we ascribe the Godhead to it, and make it God: secondly, when we ascribe God’s attributes to it, as omnipotency, providence, etc. thirdly, when we acknowledge it to be the creator and maker of all things: fourthly, when we acknowledge it to be the giver of those good things we enjoy, and the defender of us from evil.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/william-perkins.html">William Perkins</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Satan’s Sophistry Answered by our Savior Christ, &amp; in Diverse Sermons Further Manifested</cite>, (London, 1604), ‘Satan’s Sophistry,’, pp. 114-15</span></figcaption>

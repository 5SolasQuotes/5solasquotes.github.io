<blockquote><p>to children lacking the use of reason, who cannot distinguish between spiritual and bodily food, the Eucharist should not be given, although some of the Byzantines maintain the opposite, though irrationally: because actual devotion is required for the consumption of the Eucharist, which children of that age cannot have. However, once children have begun to have discretion, even before the age of maturity, for example when they are ten or eleven years old, or around then, it can be given to them, if signs of discretion and devotion appear in them… Baptized infants acquire the right to receive the body of Christ, not right away though, but at the fitting time;” (Sentences, bk. 4, dist. 9, q. 1, art. 5, resp. to Quaestiuncula 4) For the Reformed: ‘Paedocommunion’. . Contra Intinction Thomas: “Here he [Peter Lombard] considers… how it should be distributed now, at: ‘And the Eucharist is not to be given by intinction to the people ‘as a supplement of communion.”” (Sentences, bk. 4, dist. 11) On the Reformed: ‘Intinction’. . Disagreements Rome’s Supper is Not Valid &amp; is Not to be Received by Christians, or Attended apart from Necessity Needless to say, Thomas held the Roman Supper to be valid and ethically obliging to receive. The Reformed held the mass to be invalid (as it involved the formal idolatry of worshipping the creature, bread and wine), that it was sinful to receive from a priest, and that the mass ought not to be attended apart from necessity: ‘Why is Romish Baptism Valid but the Supper Not to be Received by a Romish Priest?’ ‘On the Mass &amp; Transubstantiation’ ‘On Attending the Mass’ . Only Ministers may Administer, even in “Necessity</p></blockquote>

</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-ca5ddc7651" data-kw="">
<blockquote><p>The purpose of this paper is to explain Descartes’ views on Metaphysics. It is my thesis that one of the ways in which he influenced not only modern philosophy, but the way in which we do philosophy even today, is by turning metaphysical inquiry into an epistemological enterprise. That is to say, he made the critique of knowledge necessary prior to any consideration of existence, and what may or may not have it… I will attempt to show that Descartes’ view of Metaphysics, in spite of the fact that he used familiar scholastic metaphysical terminology, actually turned Metaphysics into what is today termed Epistemology. Descartes, not Kant, was the first to perform a true critique of knowledge, and to make that critique a necessary preliminary to all questions about what exists outside our minds.</p></blockquote>

</figure><figure class="quote" id="q-e59b32ddfd" data-kw="">
<blockquote><p>Metaphysics is defined as the science of being qua [as] being… Metaphysics can, therefore, be described as the first real speculative science. It is a science because it is a body of demonstrated truths about a single formal object… Insofar as it is a science, metaphysics differs from sacred theology because the latter is not a science in the strict Aristotelian sense for its principles are not evident but revealed. Metaphysics is a real science, as is plain from its definition. For being signifies the same as thing or what actually exists or is at least capable of such existence. Therefore metaphysical notions are first intentions, or concepts that are predicated immediately of things themselves. So metaphysics differs from the logical sciences which deal with second intentions, that is, with concepts that are predicated immediately of other concepts or of beings of reason. Metaphysics indeed is the first or supreme real science, and so differs from other less universal real things, as physics, cosmology, psychology; for it does not just consider one or other part of reality, as these sciences do, but with the totality of things. Therefore, by reason of its material object, metaphysics is equivalent to all the real sciences taken together. Further, it is first by reason of its formal object; for the other sciences consider real things in some narrower respect, as physics considers things as changeable, cosmology things as bodily, etc. But metaphysics considers them precisely as they are real. Hence other real sciences, as cosmology, philosophy of man, presuppose metaphysics and use its conclusions as their principles. But metaphysics does not use the conclusions of any other real science, physics or natural philosophy, as principles. Metaphysics is a speculative and not practical science, because it does not tend toward any other operation but speculation. Hence it differs from ethics, which is practical.</p></blockquote>

<blockquote><p>The greatest of the philosophers was John Duns Scotus, but there were others such as John Ireland, John Mair of Haddington and George Lokert of Ayr. Focusing on the concepts of will, intellect and faith… Broadie investigates the philosophy of these men and the relationships between their ideas. He places them within the framework of the medieval dispute between nominalists and realists which so characterised philosophy and theology in the Middle Ages. Scotus’ account of the primacy of will over intellect was demonstrably influenced by his Franciscan inheritance.” – Blurb . 2000’s A Companion to the Theology of John Mair eds. John T. Slotemaker &amp; Jeffrey C. Witt (Brill, 2015) 390 pp. ToC This work discusses the legacy of Scotus. . . In the Post-Reformation General Article Hoenen, Maarten J.F.M. – ‘Scotus &amp; the Scotist School: the Tradition of Scotist thought in the Medieval &amp; Early Modern Period’ in John Duns Scotus (1265/6–1308): Renewal of Philosophy, ed. Egbert P. Bos (Amsterdam: Rodopi, 1998), pp. 197-210 . Book Burton, Simon J.G. – Ramism &amp; the Reformation of Method: The Franciscan Legacy in Early Modernity in Oxford Studies in Historical Theology (Oxford Univ. Press, 2024) Blurb: “Reveals the deep roots of Ramism in medieval and Renaissance thought and its connection to a wider Franciscan reformation of method.</p></blockquote>

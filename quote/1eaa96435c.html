<main class="wrap"><figure class="quote" id="q-1eaa96435c" data-kw="">
<blockquote><p>4. It is none of our controversy whether this [SL&amp;C] or any other covenant or vow do bind us to rebellion, sedition or any unlawful act; we renounce all such obligation. 5. Yea, we hold that neither this, nor any other vows of our own can prevent any obligation that the king has authority to impose upon us in things great or small; else men might disable magistrates to rule them and exempt themselves from obedience by vowing beforehand not to obey.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/richard-baxter.html">Richard Baxter</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The English Nonconformity as under King Charles II &amp; King James II Truly Stated &amp; Argued (1683; London: Parkhurst, 1689), ch. 37</cite>, p. 126</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/worship/oaths-and-vows.html">Oaths and Vows</a></span></div>

</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-a23ef92dc8" data-kw="">
<blockquote><p>I am neither so blind, wicked or singular as to deny the common doctrine of casuists, protestants and Papists, that though a vow be both sinfully imposed and sinfully taken, yet it binds in materia necessaria et licita [in necessary and lawful matter]. Yea, that if part of the matter be unlawful, yet it binds to that part which is lawful. Else a knave might exempt himself from the performance of all his vows by foisting in some unlawful matter or by making them in an unlawful manner.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/richard-baxter.html">Richard Baxter</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The English Nonconformity as under King Charles II &amp; King James II Truly Stated &amp; Argued (1683; London: Parkhurst, 1689), ch. 37</cite>, pp. 126-27</span></figcaption>

</figure><figure class="quote" id="q-f5d3235cf1" data-kw="">
<blockquote><p>II. Although, in relation to the foreknowledge and decree of God, the first cause, all things come to pass immutably and infallibly:[h] yet, by the same providence, he ordereth them to fall out, according to the nature of second causes, either necessarily, freely, or contingently.[i] [h] Acts 2:23. [i] Gen. 8:22. Jer. 31:35. Exod. 21:13 with Deut. 19:5. 1 Kings 22:28,34. Isa. 10:6,7.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/westminster-assembly.html">Westminster Assembly</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Confession of Faith | 5.2</cite></span></figcaption>

</figure><figure class="quote" id="q-369bf50e10" data-kw="">
<blockquote><p>I beseech you consider, that if when an oath whose institution by God is to be the end of all strife [Heb. 6:16], shall have a natural tendency to the maintaining of strife, division and contention, to be the occasion of wars and commotions in the land of our nativity, to administer matter and occasion of jealousy in our superiors, that while we judge ourselves bound in conscience by an oath that we have taken to endeavour to alter and change the government, whether he will or no, there can be no safety.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/richard-lytler.html">Richard Lytler</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Reformed Presbyterian, humbly offering to the consideration of all pious and peaceable spirits several arguments for obedience to the Act for Uniformity… (London: 1662), ch. 6</cite>, p. 47</span></figcaption>

</figure><figure class="quote" id="q-19bd646c65" data-kw="">
<blockquote><p>Gataker’s opinion on the nature of lots eventually was commonly accepted. Plagiarized versions of his arguments in favour of the use of cards and dice in sport appeared as early as 1633 (Downe, 1633). Clark (1916) credits Gataker’s (1619) work as instrumental in ending the Christian practice of divination by lot, although it was practiced sporadically by some Christian groups including the Wesleys into the eighteenth century.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/d-r-bellhouse.html">D.R. Bellhouse</a></span><span class="wk"><span class="lbl">Work:</span> <cite>“Probability in the Sixteenth &amp; Seventeenth Centuries: An analysis of Puritan Casuistry” in International Statistical Review, 56, 1 (1988), pp. 63-74 with a bibliography</cite>, p. 72</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/worship/oaths-and-vows.html">Oaths and Vows</a></span></div>

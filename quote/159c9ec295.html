<blockquote><p>(10) Aiming at a higher good and partially fulfilling it so far as one morally can (though it necessarily involve a partial counter-acting of an essential, facultative end) is good and is not an immoral deficiency.</p></blockquote>

</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-4ef9d041db" data-kw="">
<blockquote><p>The human law is that which humans, proceeding by reason, produce from the preceding laws, accommodated first to common just, honest, useful, and necessary conclusions, then to particular determinations for the condition of persons for whose good it is produced, the things or matters concerning which it is produced, and for the circumstances which occur to them. … We call determinations that part of human law that circumscribes any of those natural conclusions with specific (as we call it) boundaries, not by the authority of nature, but rather by the judgment of the wisest persons, by the common law of nature specifically accommodated to the mode of individual things. .. The objects of just proportion exist in three kinds… for the sake of producing specific determinations. For either they are [1] primary objects whose good is seen by natural, divine, and human law; or [2] they are secondary objects that are ordered to the former ones as to their own end; or, [3] finally, they are accidents, by which the previous two objects are commonly clothed in a certain way and change.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/francis-junius.html">Francis Junius</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Mosaic Polity</cite>, ch. 4, ‘Of the Part in Human Laws which is Mutable, and the Causes of the Mutability’ in The Mosaic Polity (1st ed. 1592; 1602; CLP Academic, 2015), pp. 54 &amp; 56-57</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/civil-government-and-society/natural-law-and-civil-law.html">Natural Law and Civil Law</a></span></div>

n%20way%20and%20change&amp;text=The%20human%20law%20is%20that%20which%20humans%2C%20proceeding&amp;text=commonly%20clothed%20in%20a%20certain%20way%20and%20change" rel="noopener" target="_blank">Read it online · Reformed Books Online</a></div>
</figure><figure class="quote" id="q-6c1d14f854" data-kw="">
<blockquote><p>Finally, it is to be noted that though in some things we may and do commendably refuse obedience to the laws of those whom God has set over us, yet are we ever obliged (and accordingly intend) still to subject ourselves unto them. For to be subject, does signify (as Zanchius shows [Commentary on Eph. 5, on Subject.]) to be placed under, to be subordinate, and so to give honor and reverence to him who is above, which may well stand without obedience to every one of his laws. Yea and Dr. Field [an Anglican] also tells us, that subjection is generally and absolutely required, where obedience is not.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/george-gillespie.html">George Gillespie</a></span><span class="wk"><span class="lbl">Work:</span> <cite>English Popish Ceremonies</cite>, … (1637), | ‘To All &amp; Every One in the Reformed Churches…’, no page number</span></figcaption>

</figure><figure class="quote" id="q-61ea27f815" data-kw="">
<blockquote><p>What is divinely willed, as regards his antecedent will, is known to us from the natural inclination itself. But what is willed by the consequent will he makes known to us either through a revelation or through his activity.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/thomas-aquinas.html">Thomas Aquinas</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Commentary on the Sentences</cite>, bk. 1, dist. 48, quest. 1, The conformity of our will to the will of God, art. 4, Whether we are bound to conformity in the thing willed, reply to obj. 1</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/civil-government-and-society/natural-law-and-civil-law.html">Natural Law and Civil Law</a></span></div>

</figure><figure class="quote" id="q-21077c0d55" data-kw="">
<blockquote><p>Some judicial precepts are Juris communis, of common equity, such as are agreeable to the instinct and law of nature, common to all men; and these for substance bind all persons, both Jews and Gentiles; as being Moral, and so agreeing with the Moral Law. These judicial precepts which were Juris particularis, of particular equity, such as pertained especially to the Jews’ commonwealth, and were fitted for them and their time, are now abolished, e.g., that a man should marry with none but his own stock; that the brother should raise up seed to his brother, and that a thief should restore fourfold, this was peculiar to the Jewish commonwealth and not to ours…. So then those judicial and civil precepts which are agreeable to the Moral Law, and do confirm and uphold it, they bind for ever. For example, ’tis a judicial Law that adulterers and adulteresses should die the death; now this being agreeable to common equity, and to the Law of Nature, as appears (Gen. 38:24) where Judah (before this judicial Law was publish by Moses) appoints Tamar his daughter-in-Law to be burnt for this sin, and Nebuchadnezzar burnt Ahab and Zedekiah for it (Jer. 29:21-23), so this judicial Law of putting witches to death by the magistrate, is agreeable to common equity, it helps to preserve all the Moral precepts which are broken by the idolatry, murder, and malice, of witches.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/thomas-hall.html">Thomas Hall</a></span><span class="wk"><span class="lbl">Work:</span> <cite>A Practical &amp; Polemical Commentary, Or Exposition upon 2 Tim. 3-4</cite>, (1658), pp. 227-28</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/civil-government-and-society/natural-law-and-civil-law.html">Natural Law and Civil Law</a></span></div>

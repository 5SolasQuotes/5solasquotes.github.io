</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-50c5c02faf" data-kw="">
<blockquote><p>That the [Anglican] Ceremonies are a great hinderance to edification appears, first, in that they obscure the substance of religion and weaken the life of godliness by outward glory and splendor, which draws away the minds of people so after it that they forget the substance of the service which they are about… departing from the apostolical and most ancient simplicity, and for adding ceremonies unto ceremonies in a worldly splendor and spectability, whereas the worship of God ought to be pure and simple… Secondly, the Ceremonies are impediments to the inward and spiritual worship, because they are fleshly and external…</p></blockquote>

</figure><figure class="quote" id="q-9093877d1c" data-kw="">
<blockquote><p>There is a twofold opinion concerning the reformation of Churches: some hold that nothing at all should be added to apostolical simplicity, and by consequence are of mind that whatsoever the apostles did, they think they are to do it, but whatsoever the Church after the apostles did add to the first rites, they think them fit even all at once to be abolished. There are others on the other side which hold that certain ancient rites (besides the apostolical ordinances) are to be retained, partly as profitable and necessary: partly also albeit not necessary, yet to be tolerated for concord sake’s. For mine own part I doubt not but the apostolical doctrine to be most absolutely perfect without all exception, to the which it is not lawful to add or to detract any thing; howbeit, touching ceremonies my judgement is otherwise. For first, it is certain that even the apostles themselves could not determinately set down what they judged to be expedient for the Churches in their first beginning: and therefore necessarily they proceeded by little and little, as the institution of deacons does make evident, inasmuch as they suffered for a season many Jewish ceremonies, as appears in the story of their Acts: again, to whom can it be doubtful that the apostles had exceeding regard unto their times, places and persons in external rites. Inasmuch as it is not profitable that the same rites were observed everywhere, as appears in that excellent epistle of Irenaeus to Victor. Besides, necessity itself abolished certain of their ordinances, as their common feasts of love. Wherefore whatsoever was performed by the apostles in rites and ceremonies, I do not judge that presently, neither yet without some exception, to be followed as a rule. And indeed I wonder not that those ancient fathers, having respect unto their own times, did take away some things, some things add and somewhat alter. Only herein (with their good leave be it spoken) they seem to me to have often failed, that they neither held any measure in their rites, neither had that due regard to Christian simplicity and purity as was meet.</p></blockquote>

</figure><figure class="quote" id="q-5cac7503f0" data-kw="">
<blockquote><p>When the worship of God, in its purity and simplicity, is the object of our esteem and love, ’tis the effect of a spiritual frame of soul. During the Levitical dispensation, the service of God was performed with pomp and luster, suitable to the Church in its minority, when faith did need the assistance of the senses: But now the Church is come to mature age, and brought to nearer communion with God, the gaudy allurements of sense are taken away. Men are naturally under the dominion of sense; of this there is the most clear and palpable proof in the heathen world, that would rather worship visible idols than the true invisible God. ‘Tis a certain indication of men’s carnal minds, that they are pleased with carnal service, that lavishly runs out in formalities, which by sympathy works upon them. This affects the eye, and is far more easy than spiritual, inward worship that issues from the strength of the soul and is performed with attention and ardency. This is very disparaging to the nature of God; for it proceeds from the conceiving of Him to be like themselves (who are not heavenly and spiritual) to be pleased with an earthly bodily service. The introducing theatrical ceremonies into the service of God, is directly opposite to the simplicity of the Gospel. Whatever pretenses are made, that they set a gloss upon the plainness of Christian worship and make it more amiable and venerable, they are like the artificial painting of natural beauty that corrupts and does not commend it. The productions of human minds are imperfect at first, and are polished and arrive to perfection by degrees: But divine institutions are complete in their kind at first, and the more they recede from their original, [the more] they lose of their purity and perfection. How acceptable those parts of worship (not chosen and commanded by God) are we may clearly understand by considering that the enjoining such new rites, is a tacit presumption that the reason of man knows better how God should be honored than Himself does; and how unprofitable they are to us, is evident: for being used without his warrant and promise, we cannot expect the conveyance of his grace, and obtaining his favor by them. Only spiritual religion, the inward reality, is of value in his esteem. When the understanding is spiritually enlightened, it esteems the simplicity of Gospel-worship to be its true beauty: ‘Tis like the nakedness of Paradise, the indication of the unstained purity of our first parents in that state. ‘Tis true, in the Worship of God, we are to glorify Him with our bodies, to behave ourselves in such a manner, as may express reverence and excite affection; but the joining human devices upon that pretense, is the snare of conscience and has been fatal to the peace of the Church.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/william-bates.html">William Bates</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Spiritual Perfection, Unfolded &amp; Enforced from 2 Cor. 7:1… (London, 1699), ch. 10</cite>, pp. 310-32</span></figcaption>

<div class="actions"><button class="copy" data-copy="“When the worship of God, in its purity and simplicity, is the object of our esteem and love, ’tis the effect of a spiritual frame of soul. During the Levitical dispensation, the service of God was performed with pomp and luster, suitable to the Church in its minority, when faith did need the assistance of the senses: But now the Church is come to mature age, and brought to nearer communion with God, the gaudy allurements of sense are taken away. Men are naturally under the dominion of sense; of this there is the most clear and palpable proof in the heathen world, that would rather worship visible idols than the true invisible God. ‘Tis a certain indication of men’s carnal minds, that they are pleased with carnal service, that lavishly runs out in formalities, which by sympathy works upon them. This affects the eye, and is far more easy than spiritual, inward worship that issues from the strength of the soul and is performed with attention and ardency. This is very disparaging to the nature of God; for it proceeds from the conceiving of Him to be like themselves (who are not heavenly and spiritual) to be pleased with an earthly bodily service. The introducing theatrical ceremonies into the service of God, is directly opposite to the simplicity of the Gospel. Whatever pretenses are made, that they set a gloss upon the plainness of Christian worship and make it more amiable and venerable, they are like the artificial painting of natural beauty that corrupts and does not commend it. The productions of human minds are imperfect at first, and are polished and arrive to perfection by degrees: But divine institutions are complete in their kind at first, and the more they recede from their original, [the more] they lose of their purity and perfection. How acceptable those parts of worship (not chosen and commanded by God) are we may clearly understand by considering that the enjoining such new rites, is a tacit presumption that the reason of man knows better how God should be honored than Himself does; and how unprofitable they are to us, is evident: for being used without his warrant and promise, we cannot expect the conveyance of his grace, and obtaining his favor by them. Only spiritual religion, the inward reality, is of value in his esteem. When the understanding is spiritually enlightened, it esteems the simplicity of Gospel-worship to be its true beauty: ‘Tis like the nakedness of Paradise, the indication of the unstained purity of our first parents in that state. ‘Tis true, in the Worship of God, we are to glorify Him with our bodies, to behave ourselves in such a manner, as may express reverence and excite affection; but the joining human devices upon that pretense, is the snare of conscience and has been fatal to the peace of the Church.”

— William Bates, Spiritual Perfection, Unfolded &amp; Enforced from 2 Cor. 7:1… (London, 1699), ch. 10, pp. 310-32">Copy</button><a class="share" href="https://x.com/intent/post?text=%E2%80%9CWhen+the+worship+of+God%2C+in+its+purity+and+simplicity%2C+is+the+object+of+our+esteem+and+love%2C+%E2%80%99tis+the+effect+of+a+spiritual+frame+of+soul.+During+the+Levitical+dispensation%2C+the+service+of+God+was+performed+with+pomp+and+luster%2C+suitable+to+the+Church+in+its+minority%2C+when+faith+did+need+the+assistance+of+the+senses%3A+But+now+the+Church+is+come+to+mature+age%2C+and+brought+to+nearer+communion+with+God%2C+the+gaudy+allurements+of+sense+are+taken+away.+Men+are+naturally+under+the+dominion+of+sense%3B+of+this+there+is+the+most+clear+and+palpable+proof+in+the+heathen+world%2C+that+would+rather+worship+visible+idols+than+the+true+invisible+God.+%E2%80%98Tis+a+certain+indication+of+men%E2%80%99s+carnal+minds%2C+that+they+are+pleased+with+carnal+service%2C+that+lavishly+runs+out+in+formalities%2C+which+by+sympathy+works+upon+them.+This+affects+the+eye%2C+and+is+far+more+easy+than+spiritual%2C+inward+worship+that+issues+from+the+strength+of+the+soul+and+is+performed+with+attention+and+ardency.+This+is+very+disparaging+to+the+nature+of+God%3B+for+it+proceeds+from+the+conceiving+of+Him+to+be+like+themselves+%28who+are+not+heavenly+and+spiritual%29+to+be+pleased+with+an+earthly+bodily+service.+The+introducing+theatrical+ceremonies+into+the+service+of+God%2C+is+directly+opposite+to+the+simplicity+of+the+Gospel.+Whatever+pretenses+are+made%2C+that+they+set+a+gloss+upon+the+plainness+of+Christian+worship+and+make+it+more+amiable+and+venerable%2C+they+are+like+the+artificial+painting+of+natural+beauty+that+corrupts+and+does+not+commend+it.+The+productions+of+human+minds+are+imperfect+at+first%2C+and+are+polished+and+arrive+to+perfection+by+degrees%3A+But+divine+institutions+are+complete+in+their+kind+at+first%2C+and+the+more+they+recede+from+their+original%2C+%5Bthe+more%5D+they+lose+of+their+purity+and+perfection.+How+acceptable+those+parts+of+worship+%28not+chosen+and+commanded+by+God%29+are+we+may+clearly+understand+by+considering+that+the+enjoining+such+new+rites%2C+is+a+tacit+presumption+that+the+reason+of+man+knows+better+how+God+should+be+honored+than+Himself+does%3B+and+how+unprofitable+they+are+to+us%2C+is+evident%3A+for+being+used+without+his+warrant+and+promise%2C+we+cannot+expect+the+conveyance+of+his+grace%2C+and+obtaining+his+favor+by+them.+Only+spiritual+religion%2C+the+inward+reality%2C+is+of+value+in+his+esteem.+When+the+understanding+is+spiritually+enlightened%2C+it+esteems+the+simplicity+of+Gospel-worship+to+be+its+true+beauty%3A+%E2%80%98Tis+like+the+nakedness+of+Paradise%2C+the+indication+of+the+unstained+purity+of+our+first+parents+in+that+state.+%E2%80%98Tis+true%2C+in+the+Worship+of+God%2C+we+are+to+glorify+Him+with+our+bodies%2C+to+behave+ourselves+in+such+a+manner%2C+as+may+express+reverence+and+excite+affection%3B+but+the+joining+human+devices+upon+that+pretense%2C+is+the+snare+of+conscience+and+has+been+fatal+to+the+peace+of+the+Church.%E2%80%9D%0A%0A%E2%80%94+William+Bates%2C+Spiritual+Perfection%2C+Unfolded+%26+Enforced+from+2+Cor.+7%3A1%E2%80%A6+%28London%2C+1699%29%2C+ch.+10%2C+pp.+310-32&amp;url=https%3A%2F%2F5solasquotes.github.io%2Fquote%2F5cac7503f0.html&amp;via=5Solas" target="_blank" rel="noopener">Share on X</a><a class="perma" href="../quote/5cac7503f0.html">Permalink</a><a class="src" href="https://reformedbooksonline.com/on-the-simplicity-of-worship/#:~:text=When%20the%20worship%20of%20God%2C%20in,to%20the%20peace%20of%20the%20Church&amp;text=When%20the%20worship%20of%20God%2C%20in%20its%20purity&amp;text=been%20fatal%20to%20the%20peace%20of%20the%20Church" rel="noopener" target="_blank">Read it online · Reformed Books Online</a></div>

<blockquote><p>…baptism “saves us by the resurrection of Jesus Christ” (1 Pet. 3:21). Not by its own efficacy, therefore, but as the emblem of what has been done by Christ’s redemption, whose “resurrection” is one of the constituent factors in it. And in order to preclude the notion that the mere application of water has any spiritual effect like that of regenerating the soul, the apostle explains that baptism does not “save by the putting away of the filth of the flesh,” but by “the answer of a good conscience toward God.” The “answer of a good conscience” is its pacification through the atonement of Christ for sin, to which baptism has reference.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/w-g-t-shedd.html">W. G. T. Shedd</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Dogmatic Theology</cite>, on 1 Pet. 3:21</span></figcaption>

</figure><figure class="quote" id="q-c7037dede4" data-kw="">
<blockquote><p>We have a proof of this in Cornelius the centurion, who, after he had been previously endued with the graces of the Holy Spirit, was baptised for the remission of sins, not seeking a fuller forgiveness from baptism, but a surer exercise of faith; nay, an argument for assurance from a pledge. It will, perhaps, be objected, Why did Ananias say to Paul that he washed away his sins by baptism (Acts 22:16), if sins are not washed away by the power of baptism? I answer, we are said to receive, procure, and obtain, whatever according to the perception of our faith is exhibited to us by the Lord, whether he then attests it for the first time, or gives additional confirmation to what he had previously attested. All then that Ananias meant to say was, Be baptised, Paul, that you may be assured that your sins are forgiven you. In baptism, the Lord promises forgiveness of sins: receive it, and be secure. I have no intention, however, to detract from the power of baptism. I would only add to the sign the substance and reality, inasmuch as God works by external means. …</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/john-calvin.html">John Calvin</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Institutes of the Christian Religion</cite>, 4.15.15</span></figcaption>

</figure><figure class="quote" id="q-ff93b48a27" data-kw="">
<blockquote><p>Hence Romanists and Ritualists have inferred that the sign is inseparable from the grace signified, and that these spiritual effects are due to the outward ordinance. Hence the doctrine of baptismal regeneration. But it must be observed that the Scriptures do not assert these spiritual attributes of water baptism in itself considered, but of water baptism as the sign or emblem of baptism by the holy Ghost. These spiritual attributes belong only to baptism by the Spirit, and they accompany the sign only when the sign is accompanied by that which it signifies. It does not follow, however, that the sign is inseparable from the grace. The grace is sovereign; and experience teaches us that it is often absent from the sign, and that the sign is least frequently honoured by the presence of the grace when it is itself most implicitly relied upon.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/a-a-hodge.html">A. A. Hodge</a></span><span class="wk"><span class="lbl">Work:</span> <cite>A Commentary on the Confession of Faith</cite>, chs. 27–28 (on baptismal regeneration)</span></figcaption>

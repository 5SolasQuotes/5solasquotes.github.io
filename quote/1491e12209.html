<blockquote><p>Objection 3. The apostle says, 1 Cor. 14:26, ‘When ye come together every one of you hath a psalm, hath a doctrine, hath a tongue, hath a revelation, hath an interpretation,’ v. 31, ‘ye may all prophesy one by one.’ Therefore all that preach or prophesy need not to be ordained. Answer: What those prophets were, and what is meant by prophesying there, all are not of one opinion. I hold that these prophets were immediately and extraordinarily inspired, and I reckon them among these other administrations, which were not ordinary, or ever to continue in the Church: apostles, evangelists, workers of miracles. But of this I am to speak distinctly, and by itself afterwards [in ch. 5]. Meanwhile, they that make the objection must prove two things, else they conclude nothing against the necessity of ordination: 1. That these prophets were not sent and ordained, but that their gifts and parts, gave them a sufficient calling to interpret in the Church. 2. That although they had no ministerial sending or vocation, yet they were not extraordinary prophets, but that such prophets are to continue ordinarily in the Church. I believe it will trouble them to prove either.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/george-gillespie.html">George Gillespie</a></span><span class="wk"><span class="lbl">Work:</span> <cite>A Treatise of Miscellany Questions (Edinburgh, 1649), ch. 4, objection 3</cite>, p. 59</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/church-government-and-the-ministry/the-call-to-ministry.html">The Call to Ministry</a></span></div>

</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-063551aa12" data-kw="">
<blockquote><p>2. It is not said that deacons were ordained with fasting and prayer, Acts 6, as the elders are chosen in every Church, Acts 14:23, and as hands are laid upon Paul and Barnabas; Acts 13:3-4, but simply that the apostles, Acts 6:6, prayed and laid their hands on them. Which seemeth to me to be nothing but a sign of praying over the deacons, and no ceremony or sacrament conferring on them the Holy Ghost: And Steven his working of miracles, and speaking with wisdom irresistible was but the fruit of that grace and extraordinary measure of the Holy Ghost abundantly poured forth on all ranks of persons in those days when the prophecy of Joel was now taking its accomplishment; Acts 2:16-19; Joel 2:28-29. which grace was in Steven before he was ordained a deacon by the laying on of hands. Acts 6:3-5. And the Text saith not that Steven did wonders and signs amongst the people by virtue of imposition of hands, or of his deaconry, but because he was full of faith and power. v. 8, else you must make working of miracles a gift bestowed on all those who serve tables, and are not to give themselves to continual praying and the ministry of the Word. I think papists will not say so much of all their priests; and we can say it of none of our pastors, nor doth Chysostom say that Steven, as a deacon, and by virtue of the office of a deacon wrought miracles, but only that his miracles and disputing was a mere consequent of laying on of hands. Further, laying on of hands was taken from the custom of blessing amongst the Jews, Christ laid his hands upon young children and blessed them, yet did he not, thereby, design them to any office.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/samuel-rutherford.html">Samuel Rutherford</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Due Right of Presbyteries (1644), Part 1, ch. 7, section 7, ‘Of Deacons’</cite>, pp. 169-70</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/church-government-and-the-ministry/the-call-to-ministry.html">The Call to Ministry</a></span></div>

</figure><figure class="quote" id="q-bdf86fef4e" data-kw="">
<blockquote><p>1… And the first word ‘vocation’ is taken often for God’s act of calling when it has no success, and this is called uneffectual calling. So it is used, Prov. 1:24, ‘Because I called and ye refused, I have stretched forth my hands and no man regarded; But ye have set at nought all my counsel, and would none of my reproof.’ So Isa. 65:12; Jer. 7:13, ‘I called, but ye answered not,’ and many other places: Sometimes it is taken for the act of God when it is successful; as 1 Thess. 2:12 and many more places: 2. This success itself is termed our calling in a passive sense: and it is twofold: 1. Common; when men are brought but to outward profession and common gifts; and so the word is used often. 2. Special; when men are savingly converted to Christ; The former is common effectual calling; the latter is special effectual calling: and this last is the same with conversion:</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/richard-baxter.html">Richard Baxter</a></span><span class="wk"><span class="lbl">Work:</span> <cite>A Treatise of Conversion… (London: R.W., 1657), ch. 1, sect. 3</cite>, pp. 6-7</span></figcaption>

<blockquote><p>…a man may truly take upon him that which he cannot fully and in every part perform or fullfil, desiring and endeavoring so far as his knowledge &amp; ability extends. Otherwise, no high preist in Israel from the time of Solomon unto the time of Hezekiah did truly take upon them the charge of a high preist: because none did celebrate the Passover, which was a principal sacrament, in such sort as was written, 2. Chron. 30:5, 26, nor keep the feast of tabernacles in a far longer time, Neh. 8:17. Nor did any king all that time truly take upon him the charge or office of a king: because none did reform things as he ought. If any difference be, their sin was greater, that might have done their duty and would not, than theirs that would and cannot.</p></blockquote>

<blockquote><p>2. Because when the Church is overgone with heresy and apostasy, our reformers, in the exercise of their ministry, were not to keep a certain flock as in a constitute[d] Church, and suppose they had no calling but eminent gifts, they were to spread the Gospel to nations, as Luther did; And suppose the people should resist them, as in many places they did; yet God called them, and they were not to expect election from people: So [men of] Cyprus and Cyrenus preached, Acts 11 and 18, and we read of no vocation that they had from either people or apostle. So Origen preached to a people in a certain town where there was not one Christian, and afterwards he was chosen their pastor.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/samuel-rutherford.html">Samuel Rutherford</a></span><span class="wk"><span class="lbl">Work:</span> <cite>A Peaceable &amp; Temperate Plea (1642)</cite>, pp. 126-7</span></figcaption>

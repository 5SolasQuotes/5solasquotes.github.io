<blockquote><p>‘That being justified by his grace’ If we understand ‘regeneration’ in its strict and ordinary meaning, it might be thought that the apostle employs the word ‘justified’ instead of ‘regenerated;’ and this is sometimes the meaning of it, but very seldom; yet there is no necessity which constrains us to depart from its strict and more natural [forensic] signification. The design of Paul is to ascribe to the grace of God all that we are, and all that we have, so that we may not exalt ourselves proudly against others. Thus he now extols the mercy of God, by ascribing to it entirely the cause of our salvation. But because he had spoken of the vices of unbelievers, it would have been improper to leave out the grace of regeneration, which is the medicine for curing them. Still this does not prevent him from returning immediately to praise divine mercy; and he even mingles both blessings together — that our sins have been freely pardoned, and that we have been renewed so as to obey God. This, at least, is evident, that Paul maintains that “justification,” is the free gift of God; and the only question is, what he means by the word justified. The contest seems to demand that its meaning shall be extended further than to the imputation of righteousness; and in this larger sense it is seldom (as I have said) employed by Paul; yet there is nothing that hinders the meaning of it from being limited to the forgiveness of sins.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/john-calvin.html">John Calvin</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Commentary on Titus</cite>, 3, v. 7</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/justification/twofold-justification.html">Twofold Justification and Its Increase</a></span></div>

<blockquote><p>4. The Holy Ghost speaks generally of all men, whether regenerate or unregenerate, and of all works, whether going before faith or following it, that a man, that is, every one, who is justified, is justified by faith without the works of the law, Rom. 3:28, that a man is not justified (that is, that no man is justified) by the works of the Law, but by the faith of Jesus Christ, for by the works of the Law no flesh, that is, as the Psalmist speaks, no man living shall be justified, Gal. 2:16. For as in the first act of justification we are justified by faith without respect of works, so our justification is continued unto us without respect of our works. And this appears most plainly in the examples of Abraham, of Job, of David, of Paul, etc. as I showed before, who, though they abounded with good works which they wrought by faith, yet were not justified by them, but by faith only. For that which Chrysostom says of Abraham is also verified of all the godly: for, says he, that a man having not works should be justified by faith, it is no unlikely thing: [Greek], but this, that a man flourishing in good works, should not thereby be justified, but by faith, it was wonderful, and very much sets forth the force of faith.</p></blockquote>

<blockquote><p>779. Now besides this justification of the sinner which has its place in the first conversion of the sinner to God and which is renewed so long as he repents (for the faithful life is the continual exercise of faith), he is also given a justification of the just which is by works, which James discusses. 780. By this we understand the declaration of God with respect to the accusation of Satan, since in the regenerated sinner are true, colored, and indubitable signs and proofs of true faith which are pleasing to Him, and which are required among the heirs of the goods of grace. 781. This second justification is necessarily connected with the first (it is necessary to distinguish this from the variation of the Papists) so that it cannot be separated from it for any reason.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/campegius-vitringa.html">Campegius Vitringa</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Fundamentals of Sacred Theology Pre</cite>, (d. 1722; RHB, 2024), ch. 21, ‘Justification…’, p. 186 Note Vitringa does not clearly join these two justifications as one, and it is said by the editor in a footnote that he later dropped the language of a “second” justification.</span></figcaption>

<blockquote><p>4. That the promises concerning perseverance (as has been often intimated) are of two sorts. The first, of the continuance of the favor of God to us, which respects our justification. The other, of the continuance of our obedience unto God, which respects our sanctification… … 2. For those of the first sort, which I shall now handle… I shall propose only some few things unto consideration… … 2. That these promises of God do not properly, and as to their original rise, depend on any conditions in believers or by them to be fulfilled, but are the fountains and springs of all conditions whatever that are required to be in them or expected from them; though the grace and obedience of believers are often mentioned in them, as the means, whereby they are carried on according to the appointment of God unto the enjoyment (or continued in it) of what is promised.</p></blockquote>

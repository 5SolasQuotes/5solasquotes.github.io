</figure><figure class="quote" id="q-f51fbde79a" data-kw="">
<blockquote><p>13. If a pastor preach some unsound doctrines or faultily perform the public worship, or neglect just discipline and receive the unworthy to the communion of the church, or reject the worthy, the presence of the innocent members (who make not the fault their own by consent, or by neglecting their duties to reform it), makes none of this to be their sin, nor is to be taken for a sign of their consent: Nor will the presence of the unworthy deprive the godly of the blessing or comfort of God’s ordinance: Nor are they bound to separate from that church because of these corruptions, unless they are so great as to unchurch that church or make their worship and communion such as God Himself rejects and will not accept: or unless by imposing sin upon them, or some other way, the church expel them, or they have accidentally some other reason to remove.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/richard-baxter.html">Richard Baxter</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Church Concord, containing I. a Dissuasive from Unnecessary Division &amp; Separation, &amp; the Real Concord of the Moderate Independents with the Presbyterians… (London: Parkhurst, 1691), pt. 2, Question 2</cite>, p. 65</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/the-church/schism-and-separation.html">Schism and Separation</a></span></div>

ener" target="_blank">Read it online · Reformed Books Online</a></div>

</figure><figure class="quote" id="q-ffce390ebe" data-kw="">
<blockquote><p>It had weight with me to mention the failings of the Church of Scotland in that period, that sundry of our separatists look upon the acts and determinations of the Church of Scotland in that period, as of little less authority than the Scripture for a rule, complaining that since the Revolution, ‘she has never revived and corroborated the registers, acts and constitutions of those Assemblies;’ affirming also, these ancient acts of the Church of Scotland ‘are a part of the traditions which we have received’: And therefore people ought to withdraw from ministers, as guilty of scandalous defections, while they remain so disorderly as not to observe them.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/john-currie.html">John Currie</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Vindication of the Real Reformation Principles of the Church of Scotland concerning Separation, Contra the Seceders, 1740</cite></span></figcaption>

<main class="wrap"><figure class="quote" id="q-ec32e2afb4" data-kw="">
<blockquote><p>We never held it unlawful to do one of these actions, though it were by mistake unlawfully commanded; e. g. If the rulers prescribe a time, place, metre, tune, etc. unfit, if it be not so bad as to overthrow the ends and use of the worship, the fault of the commander will not disoblige us from the duty of obeying. And whereas some argue that no man has authority to sin; therefore, we are not bound to obey that which is no act of authority, I answer: Rulers have authority to command that which is good though not in a faulty manner; and when we cannot do the good without the faulty manner, it is their fault and not ours: e.g. If an inconvenient time, place, text, tune, etc. be chosen, the union and concord which is held by agreeing in those modes is necessary: He that will not join in them cannot join in the worship. So that we obey the ruler or guide as a determiner of the means of concord, which is necessary, and not sub ratione erroris [under the rule of the error], [we do not obey and perform the action formally] as misdetermining, though [we do the action] in that which is [materially] misdetermined. We never pray without some fault in the manner, and yet must rather do it so than not at all. The mistaken ruler bids us not sin: It’s his sin to choose a mis-circumstance; and it is not his own action that he bids us do, but ours: And it’s to us a lawful circumstance, because [it is] necessary to concord and commanded, though mistakingly.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/richard-baxter.html">Richard Baxter</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The English Nonconformity as under King Charles II &amp; King James II Truly Stated &amp; Argued</cite>, (London, 1689), ch. 2, pp. 13-14</span></figcaption>

</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-12e409b06d" data-kw="">
<blockquote><p>Though we must prefer better before worse, that worse may be best to us at that time and place when we cannot have better without more hurt than benefit to the public or ourselves. Among many ministers, weak and strong, all cannot hear the best, nor must renounce the weaker. To live under the countenance of government under an honest minister of mean parts in peace and concord, though he use the liturgy, is more to the common advantage of religion and to the profit of most particular souls than to hear an abler man with the distraction of disturbers and to be fined and lie in prison on no better a cause.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/richard-baxter.html">Richard Baxter</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Catholic Communion Doubly Defended by Dr. Owen’s Vindicator &amp; Richard Baxter</cite>, … (London: Parkhurst, 1684) | section 5, p. 33</span></figcaption>

</figure><figure class="quote" id="q-2c61c9312a" data-kw="">
<blockquote><p>Another argument there is taken from them, that ‘they sought the Lord, etc.’ Which seeking of theirs is set out by the manner of it, that they prepared their whole heart to seek Him: Not as if their hearts were so free from sin, or so full of grace as they should have been; but that they were true and plain, and sincere: Not such as had no sin, for it is said, ‘they were not cleansed according to the purification of the sanctuary,’ but that did love no sin: Not such hearts as wanted no grace, or preparation for God’s ordinance: But such as were humbled for the want of grace and of that preparation that they should have made… For it is said, ‘He healed the people,’ that is, gave them that which God does offer unto his people in the sacrament: They received the seal of the Covenant, and He made good the Covenant unto them…</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/john-dod.html">John Dod</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Ten Sermons, Tending Chiefly to the Fitting of Men for the Worthy Receiving of the Lord’s Supper</cite>, (1634), The Fourth Sermon of the Lord’s Supper, on 2 Chron. 30:18-20, p. 112</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/worship/impurities-in-worship.html">Impurities in Worship</a></span></div>

· Reformed Books Online</a></div>
</figure><figure class="quote" id="q-b0ac55f2ac" data-kw="">
<blockquote><p>As the goodness of outward acts consists not in the acts themselves, so the acceptableness of them results not from the acts themselves but from the inward frame animating and quickning those acts, as blood and spirits running through the veins of a duty to make it a living service in the sight of God. Imperfections in worship hinder not God’s acceptation of it, if the heart spirited by grace be there to make it a sweet savour. The stench of burning flesh and fat in the legal sacrifices might render them noisome to the outward senses; but God smelt a sweet savour in them, as they respected Christ. When the heart and spirit are offered up to God, it may be a savory duty, though attended with unsavory imperfections.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/stephen-charnock.html">Stephen Charnock</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Several Discourses upon the Existence &amp; Attributes of God</cite>, (London, 1682) | ‘Of Spiritual Worship’, p. 169</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/worship/impurities-in-worship.html">Impurities in Worship</a></span></div>

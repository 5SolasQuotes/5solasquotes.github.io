<main class="wrap"><figure class="quote" id="q-f05b682edd" data-kw="">
<blockquote><p>As to the fearful epithets of ‘schismatics’ and ‘separatists,’ wherewith you and your party are branded, and which are so odious to you, let all good men judge whether you may be justly called so. The definition of schism is: A separating from the unity and communion of a true Church. If you doubt this definition, know that it is the definition the learned Mr. Durham gave of it, on Rev. 18:4.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/john-currie.html">John Currie</a></span><span class="wk"><span class="lbl">Work:</span> <cite>An Essay on Separation</cite></span></figcaption>

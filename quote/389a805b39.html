<blockquote><p>Of Admonition, to take heed how we vilifie or contemne this Law of God, either doctrinally, or practically. Doctrinally, so the Marcionites, and the Manichees, and Basilides; whereof some have said, it was carnall, yea that it was from a Devil, and that it was given to the Jews for their destruction because it’s said to work wrath, and to be the instrument of death. And those opinions and expressions of the Antinomians about it are very dangerous. What, shall we revile that which is God’s great mercy to a people? Because the Jews and Papists do abuse the Law, and the works of it to justification, shall it not therefore have its proper place and dignity?

Take heed therefore of such phrases, An Old-Testament-spirit, and, His Sermon is nothing but an explication of the Law: For it ought much to rejoyce thee, to hear that pure and excellent image of Gods holiness opened. How mayest thou delight to have that purity enjoyned, which will make thee loath thy self, prize Christ and Grace more, and be a quick goad to all holiness? And if you say, Here is nothing of Christ all this while: I answer That is false, as is to be proved, if the Law be not taken very strictly: And besides, the Law and the Gospel are not to be severed, but they mutually put a fresh relish and taste upon each other. And shall no mercy be esteemed, but what is the Gospel? Thou art thankfull for temporall mercies, and yet they are not the Gospel; but this is a spiritual mercy.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/anthony-burgess.html">Anthony Burgess</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Vindiciae legis, or, A vindication of the moral law and the covenants, from the errors of Papists, Arminians, Socinians, and more especially, Antinomians</cite>, (London, 1647), pp 152-3 emphasis added.</span></figcaption>

<blockquote><p>2. Under the new covenant or testament, however, these promised blessings are not given to all men, because God is true, thus the covenant is necessarily discriminate. These blessings are, however, given doubly when the covenant is received. In the first place, by the substance itself of the covenant, or by the promised blessings from God themselves, then by their administration in the visible assembly. In the first meaning learned from Jeremiah in the place already cited and which substance is peculiar to the elect. For to all the elect and to them alone, this part, the remission of sins, renewal to the image of God, and the knowledge of God itself is therefor promised, or which embraces God’s favor which they would never have had from themselves (John 6:44,45; 64,65; 10:26; 11:52; Acts 13:47,48; Romans 8:29,30; 9:7,8,9,11,15,16; Titus 1:1). Thus Moses spoke about substance of the covenant (Deuteronomy 30[:6]). “God will circumcise your heart and that of your children.” He acts truly in the administration of the covenant, (Genesis 17), ‘This is my covenant’ etc. Likewise he says, ‘My covenant will be in your flesh.’ Certainly, the very substance of the covenant was not in their flesh. And not all of their hearts were circumcised, to whom the covenant was administered or offered through circumcision (Acts 7:51,52,53). That is to say, they personally, maliciously, rejected the gracious offer of the covenant, as Stephen teaches in the same place. Therefore, the covenant of grace, if you see its essence, is a sworn oath promised by God, a gift to you by God who is never angry with you (Isaiah 54) and by our adoption in God’s Son we have been made heirs of eternal life with Jesus Christ the eternal and only begotten Son of God, the seed of Abraham who is Christ, and to all men, who by faith in this free gift which was brought by the seed, and in whom by grace they were justified and glorified short of any condition or stipulation, knowledge of the good, so that he might be celebrated in his gracious goodness from himself, in this life and life eternal (Hosea 2; Isaiah 54; Genesis 22; Hebrews chapters 1, 6; Galatians 3:15-18, 22,26,29). The administration of the covenant of grace, however, is through the testimony or call of the Royal word from the darkness (of which darkness he is convicted by the law partly natural and partly written) that is, from sin and the penalty of sin, to the light, which is unto the discerning and receiving of the Son of God offered in the gospel, with the double benefit, truly, free rightousness in the remission of sins, by cleansing in his blood, and renewal to the image of God or the spirit of holiness for sharing in the heavenly inheritance. By the outward voice and visible signs in the testimony of mutual agreement between God and us, and by the addition of the truly efficacious gift of grace of internal faith and repentance out the infinite, incomprehensible mercy to the elect, which mercy is not truly added indeed to the reprobate, but nevertheless justly and to the worship of God’s justice. For the call from the darkness to the light, that is, the gracious offer, is never rejected without evil and contumacy of the heart.</p></blockquote>

<blockquote><p>If God’s love is known by what it hates, it is also known by what it loves or inclines toward. First, in a sense, it extends to all creatures. All creatures have some good from God.136 Even the wicked share in this benevolence. “God is kind to the unthankful and evil.”137 Man is now naturally contrary to God and positively evil, but the Luke 6:35 sermon shows that God still loves him in some ways. Indeed, Edwards goes on to say in another sermon: “even in damnation.”138 Yet, fundamentally, “holy persons love holy things for their holiness.”139 136. Unpublished MS sermon on Ps. 145:15–21, “All creatures in heaven and earth have their good things from God,” p. 1, St. Ind., Nov. 1, 1753.

137. Unpublished MS sermon on Lk. 6:35.

138. Unpublished MS sermon on Eph. 4:15–16, “In a company of Christians among whom Christianity has its genuine effect, love is the beginning and love is the middle and love is the end of all their affairs,” p. 2, May 1743.

139. Unpublished MS sermons on Ps. 119:[1]40.</p></blockquote>

<blockquote><p>[T]he Son of God, having been constituted by the Father as Mediator of the covenant, the guarantor on two counts: 1) He shall satisfy for the sins of all those whom the Father has given him (John 17) and he decreed from eternity to adopt them into sonship wrought Christ (Ephesians 1); 2) He shall also bring to pass that they, being planted in him, shall enjoy peace of conscience and be renewed daily in the image of God.</p></blockquote>

</figure><figure class="quote" id="q-1a1933b3bb" data-kw="">
<blockquote><p>Yea if the Covenant of the Gospel, that is, of life and salvation by Christ, be as absolute, without any condition on man’s part, as that with Noah concerning the not drowning of the whole world again (Gen. 9:9-10), then it is all one whether men receive it, and believe it, or no: the promise of life and salvation, and the covenant made with Christ concerning it, shall be made good unto them, as well as that made with Noah, shall be made good unto men, whether they know it and heare it, and believe it or not.</p></blockquote>

<main class="wrap"><figure class="quote" id="q-25d85261d2" data-kw="Infallible rule">
<blockquote><p>Although infallibility is not given by God to the church, it cannot on this account be said that God was wanting in things necessary to her, because it is not necessary to have a supreme and infallible tribunal among men upon whose decrees and responses our faith should be suspended, since it is sufficient for her to have an infallible rule of faith and practice in the Scriptures, which as long as she observes, she will not wander from the right track.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/francis-turretin.html">Francis Turretin</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Institutes of Elenctic Theology</cite>, 18.11.32</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/the-church/infallibility-of-the-church.html">Infallibility of the Church</a> › <a href="../topics/the-church/infallibility-of-the-church/the-church-can-err.html">The church can err</a></span><span class="t"><a href="../topics/rome/the-church.html">Rome: The Church</a> › <a href="../topics/rome/the-church/infallibility.html">Infallibility</a></span><span class="t"><a href="../topics/holy-scripture/sufficiency.html">Sufficiency</a> › <a href="../topics/holy-scripture/sufficiency/scripture-alone.html">Scripture alone</a></span></div>

</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-8fd989b3de" data-kw="">
<blockquote><p>By contrast, the Reformation asserted that a church, however venerable, can still err. … Even the most simple believer can and may if necessary, Bible in hand, stand up to an entire church, as Luther did to Rome. Only thus the freedom of the Christian, and simultaneously the sovereignty of God, is maintained. There is no higher appeal from Scripture. It is the supreme court of appeal. No power or pronouncement stands above it.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/herman-bavinck.html">Herman Bavinck</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Reformed Dogmatics</cite>, vol. 1: Prolegomena, ch. 14</span></figcaption>

</figure><figure class="quote" id="q-60822eb805" data-kw="Councils">
<blockquote><p>Wherefore, though our opponents should name councils of thousands of bishops it will little avail them; nor will they induce us to believe that they are, as they maintain, guided by the Holy Spirit, until they make it credible that they assemble in the name of Christ: since it is as possible for wicked and dishonest to conspire against Christ, as for good and honest bishops to meet together in his name.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/john-calvin.html">John Calvin</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Institutes of the Christian Religion</cite>, 4.9.2</span></figcaption>

<div class="actions"><button class="copy" data-copy="“Wherefore, though our opponents should name councils of thousands of bishops it will little avail them; nor will they induce us to believe that they are, as they maintain, guided by the Holy Spirit, until they make it credible that they assemble in the name of Christ: since it is as possible for wicked and dishonest to conspire against Christ, as for good and honest bishops to meet together in his name.”

</figure><figure class="quote" id="q-b4ae17b616" data-kw="Canon Church can err">
<blockquote><p>If then we grant that that church, which was the whole and sole church at that particular time, could have rejected canonical books, then it is evident that the church may err, which the papists will not be willing to allow.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/william-whitaker.html">William Whitaker</a></span><span class="wk"><span class="lbl">Work:</span> <cite>A Disputation on Holy Scripture</cite>, Question 1, ch. 5</span></figcaption>

</figure><figure class="quote" id="q-013b0de4a2" data-kw="Councils can err">
<blockquote><p>As matters usually become worse and worse, it is easy to see in more modern councils how much the Church gradually degenerated from the purity of that golden age. I doubt not, however, that even in those more corrupt ages, councils had their bishops of better character. But it happened with them as the Roman senators of old complained in regard to their decrees. Opinions being numbered, not weighed, the better were obliged to give way to the greater number.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/john-calvin.html">John Calvin</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Institutes of the Christian Religion</cite>, 4.9.8</span></figcaption>

<main class="wrap"><figure class="quote" id="q-41dd7fee28" data-kw="">
<blockquote><p>Though the patrons of the doctrine of the necessity of repentance in order to the obtaining of the pardon of sin, do not aim at any encroachment on the doctrine of free pardon; yet, with all deference to those learned men, I conceive, that such doctrine is injurious to the grace of God, and doth much darken the free pardon offered in the gospel, in regard the pardon is promised immediately to those that believe, Acts x. 43. “Through his name, whosoever believeth in him, shall receive remission of sins.” But they require, that believers bring something with them, if they would obtain it, even that they bring repentance along with them. …

Upon the whole we may see; that the gospel teaches us to come empty-handed to the market of free grace, for remission of sin and God’s favour. But he comes not empty, who brings repentance along with him. If any shall say, that if we screw up matters so high in this point, we most cast faith as well as repentance, in the matter of attaining pardon; for that is still something we bring with us. I shall answer; For the safety of God’s grace, let the work faith, the inherent quality faith, go, and be made to stand aback, while the sinner stands before God’s tribunal to be justified; that the empty-handed, taking faith, may alone have place. Hath not the Lord made it to be only of faith, that it might be of grace, while faith comes with an empty hand, and receives all?

There is a vast difference betwixt faith and repentance in this matter, even as much as betwixt giving and receiving: for there is no grace of the Spirit that hath more of the nature of giving than repentance, in so far as it is a turning of the whole man from sin unto God; and upon that head it ought to be banished far from the soul’s justification, and to have no part nor lot in the matter of attaining free pardon.

And seeing this doctrine doth so well agree with the natural religion that is in all men, whereby they, when they come to God to obtain a favour, would always be sure of some qualification in themselves fitting them for the receipt of it; let us take heed, that it turn not the covenant of grace into a bastard covenant of works. The covenant of works says, Do this; the covenant of grace says so too. Where is the difference then? Why, the covenant of works says, Do this, and thou shalt live, viz. in God’s favour, wherein life lies. But the covenant of grace saith, Live thou, and do this.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/thomas-boston.html">Thomas Boston</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Miscellaneous Questions</cite>, in The Complete Works of the Late Rev. Thomas Boston, Ettrick, ed. Samuel McMillan (12 vols, London, 1853), 6: 87-88.</span></figcaption>

<blockquote><p>God therefore displayed on Mount Sinai the law of the Ten Commandments as a covenant of works in subservience to the covenant of grace. He displayed it in that form in order that the people might, by contemplating it, see what kind and degree of righteousness it required as the condition of eternal life, and that by means of it, finding themselves utterly destitute of perfect righteousness, they might be impelled to take hold of the covenant of grace in which the perfect righteousness of the second Adam is provided and exhibited for the justification of all who believe.</p></blockquote>

<blockquote><p>The communion and fellowship of man with God, was first founded on a covenant of works made with Adam in paradise. If he did obey, and did not eat of the forbidden fruit, he should have life both for himself and his posterity; the which covenant, because God would not have forgotten, he afterward renewed in the delivery of the ten Commandments, requiring from man obedience to them in his own person, exactly, at all times, perpetually: promising life on the obedience, and threatening death and cursing if he continued not in everything the law required to do. But this fellowship being places in man’s own freedom, and having so weak a foundation, he lost both himself and it, so that now by the first covenant of works, Adam and all his posterity are under a curse; for we cannot fulfill the law that requireth personal obedience, perfect obedience, and exact obedience. He that ‘continueth not in all is cursed,’ Gal. iii. 10. The law then findeth us dead and killeth us. It findeth us dead before, and not only leaves us dead still, but makes us more dead.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/richard-sibbes.html">Richard Sibbes</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Works of Richard Sibbes</cite>, 6.3.</span></figcaption>

</figure><figure class="quote" id="q-ca26c0b1a4" data-kw="">
<blockquote><p>We were debtors to the mandatory and minatory part of the law, arraigned at the instance of divine justice to pay the debt; Christ substitutes himself in our room, and comes under the law to pay the whole debt. It is true, the debt was personal, and justice had a demand upon the person that sinned by virtue of the covenant of works; but that covenant never excluded a surety, tho’ it provided none. The law promised life, upon our personal obedience; but, in case we fail, it revealed no surety to make out an obedience in our room.

There behoved indeed to be a secret reserve in the covenant of works, whereby the perfect obedience of another was not excluded: For, if the covenant of works had absolutely excluded a surety in our room, then the covenant of grace had been excluded, and our salvation had been impossible after our fall; but tho’ the covenant of works did not exclude a surety, yet that covenant did neither provide nor reveal a surety: This is done in the covenant of grace, which is Christ as surety fulfilling for us the covenant of works, in all the articles of it. Now, is truth and faithfulness at any loss here?

No, the truth of the promise &amp; threatening both of the law of works, is fulfilled. On the one hand, the promise of eternal life made to perfect obedience; which, tho’ we forfeited in our own person, yet we recover in the person of Christ; the promise of life upon the ground and condition of perfect obedience being fulfilled to us in him, who hath yielded that perfect obedience in our room: On the other hand, divine truth and faithfulness, in the threatening of the law, which was death, is glorified, in that it is fulfilled upon the surety; while we, who came under the sentence of death in the first Adam, undergo that death in the second.

Again, is righteousness and justice at any loss by this surety in our room? No, no; whether we look upon it as vindictive or retributive justice, vindictive justice is displayed in its utmost severity upon Christ; Awake, O sword, against my shepherd, and the man that is my fellow: And so the sword is drunk in his blood to infinite satisfaction. Retributive justice is gloriously displayed also, in the sinner’s being rewarded, justified, saved upon this ground.</p></blockquote>

<div class="meta"><span class="t"><a href="../topics/the-covenant-of-works.html">The Covenant of Works</a></span></div>
<div class="actions"><button class="copy" data-copy="“We were debtors to the mandatory and minatory part of the law, arraigned at the instance of divine justice to pay the debt; Christ substitutes himself in our room, and comes under the law to pay the whole debt. It is true, the debt was personal, and justice had a demand upon the person that sinned by virtue of the covenant of works; but that covenant never excluded a surety, tho’ it provided none. The law promised life, upon our personal obedience; but, in case we fail, it revealed no surety to make out an obedience in our room.

There behoved indeed to be a secret reserve in the covenant of works, whereby the perfect obedience of another was not excluded: For, if the covenant of works had absolutely excluded a surety in our room, then the covenant of grace had been excluded, and our salvation had been impossible after our fall; but tho’ the covenant of works did not exclude a surety, yet that covenant did neither provide nor reveal a surety: This is done in the covenant of grace, which is Christ as surety fulfilling for us the covenant of works, in all the articles of it. Now, is truth and faithfulness at any loss here?

No, the truth of the promise &amp; threatening both of the law of works, is fulfilled. On the one hand, the promise of eternal life made to perfect obedience; which, tho’ we forfeited in our own person, yet we recover in the person of Christ; the promise of life upon the ground and condition of perfect obedience being fulfilled to us in him, who hath yielded that perfect obedience in our room: On the other hand, divine truth and faithfulness, in the threatening of the law, which was death, is glorified, in that it is fulfilled upon the surety; while we, who came under the sentence of death in the first Adam, undergo that death in the second.

Again, is righteousness and justice at any loss by this surety in our room? No, no; whether we look upon it as vindictive or retributive justice, vindictive justice is displayed in its utmost severity upon Christ; Awake, O sword, against my shepherd, and the man that is my fellow: And so the sword is drunk in his blood to infinite satisfaction. Retributive justice is gloriously displayed also, in the sinner’s being rewarded, justified, saved upon this ground.”

— Ralph Erskine, The harmony of the divine attributes displayed; in the redemption &amp; salvation of sinners by Jesus Christ. Being a sermon preached at Dunfermline on the 20th of September 1723; immediately after the celebration of the Lord’s Supper, (1723; Boston: S. Kneeland and T. Green, 1748), pp 15-16.">Copy</button><a class="share" href="https://x.com/intent/post?text=%E2%80%9CWe+were+debtors+to+the+mandatory+and+minatory+part+of+the+law%2C+arraigned+at+the+instance+of+divine+justice+to+pay+the+debt%3B+Christ+substitutes+himself+in+our+room%2C+and+comes+under+the+law+to+pay+the+whole+debt.+It+is+true%2C+the+debt+was+personal%2C+and+justice+had+a+demand+upon+the+person+that+sinned+by+virtue+of+the+covenant+of+works%3B+but+that+covenant+never+excluded+a+surety%2C+tho%E2%80%99+it+provided+none.+The+law+promised+life%2C+upon+our+personal+obedience%3B+but%2C+in+case+we+fail%2C+it+revealed+no+surety+to+make+out+an+obedience+in+our+room.%0A%0AThere+behoved+indeed+to+be+a+secret+reserve+in+the+covenant+of+works%2C+whereby+the+perfect+obedience+of+another+was+not+excluded%3A+For%2C+if+the+covenant+of+works+had+absolutely+excluded+a+surety+in+our+room%2C+then+the+covenant+of+grace+had+been+excluded%2C+and+our+salvation+had+been+impossible+after+our+fall%3B+but+tho%E2%80%99+the+covenant+of+works+did+not+exclude+a+surety%2C+yet+that+covenant+did+neither+provide+nor+reveal+a+surety%3A+This+is+done+in+the+covenant+of+grace%2C+which+is+Christ+as+surety+fulfilling+for+us+the+covenant+of+works%2C+in+all+the+articles+of+it.+Now%2C+is+truth+and+faithfulness+at+any+loss+here%3F%0A%0ANo%2C+the+truth+of+the+promise+%26+threatening+both+of+the+law+of+works%2C+is+fulfilled.+On+the+one+hand%2C+the+promise+of+eternal+life+made+to+perfect+obedience%3B+which%2C+tho%E2%80%99+we+forfeited+in+our+own+person%2C+yet+we+recover+in+the+person+of+Christ%3B+the+promise+of+life+upon+the+ground+and+condition+of+perfect+obedience+being+fulfilled+to+us+in+him%2C+who+hath+yielded+that+perfect+obedience+in+our+room%3A+On+the+other+hand%2C+divine+truth+and+faithfulness%2C+in+the+threatening+of+the+law%2C+which+was+death%2C+is+glorified%2C+in+that+it+is+fulfilled+upon+the+surety%3B+while+we%2C+who+came+under+the+sentence+of+death+in+the+first+Adam%2C+undergo+that+death+in+the+second.%0A%0AAgain%2C+is+righteousness+and+justice+at+any+loss+by+this+surety+in+our+room%3F+No%2C+no%3B+whether+we+look+upon+it+as+vindictive+or+retributive+justice%2C+vindictive+justice+is+displayed+in+its+utmost+severity+upon+Christ%3B+Awake%2C+O+sword%2C+against+my+shepherd%2C+and+the+man+that+is+my+fellow%3A+And+so+the+sword+is+drunk+in+his+blood+to+infinite+satisfaction.+Retributive+justice+is+gloriously+displayed+also%2C+in+the+sinner%E2%80%99s+being+rewarded%2C+justified%2C+saved+upon+this+ground.%E2%80%9D%0A%0A%E2%80%94+Ralph+Erskine%2C+The+harmony+of+the+divine+attributes+displayed%3B+in+the+redemption+%26+salvation+of+sinners+by+Jesus+Christ.+Being+a+sermon+preached+at+Dunfermline+on+the+20th+of+September+1723%3B+immediately+after+the+celebration+of+the+Lord%E2%80%99s+Supper%2C+%281723%3B+Boston%3A+S.+Kneeland+and+T.+Green%2C+1748%29%2C+pp+15-16.&amp;url=https%3A%2F%2F5solasquotes.github.io%2Fquote%2Fca26c0b1a4.html&amp;via=5Solas" target="_blank" rel="noopener">Share on X</a><a class="perma" href="../quote/ca26c0b1a4.html">Permalink</a><a class="src" href="https://reformedcovenanter.wordpress.com/2021/05/14/ralph-erskine-on-the-covenant-of-works-and-christ-the-surety/" rel="noopener" target="_blank">Read it online · Reformed Covenanter</a></div>

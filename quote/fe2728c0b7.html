<main class="wrap"><figure class="quote" id="q-fe2728c0b7" data-kw="">
<blockquote><p>After the Restoration of the English monarchy in the person of Charles II in 1660, the new king and his first Parliament declared the anniversary of the beheading of his father Charles I (January 30, 1649) a religious holiday with a special commemoration in the Book of Common Prayer, naming the late monarch a saint and martyr. This holiday was not generally celebrated in Massachusetts until the emergence of several Anglican churches there in the early eighteenth century. In 1750, Jonathan Mayhew, the twenty-nine-year old pastor of the West (Congregational) Church in Boston, took occasion to dispute the first Charles’ credentials to saintship, martyrdom, and even his kingship as well. Mayhew’s Discourse is an extremely interesting bridge between the radical Puritan past and the American Revolutionary future. His sermon contains the language, rhetoric, symbolism, typology, and religious and philosophical arguments that would be used extensively in the agitation for American independence twenty-five years later. Mayhew (1720-1766) would subsequently take a leading role in the resistance to the Stamp Act of 1765, and his sermons and writings had an enormous impact on the evolution of New England Puritanism into American republican ideology.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/jonathan-mayhew.html">Jonathan Mayhew</a></span><span class="wk"><span class="lbl">Work:</span> <cite>A Discourse Concerning Unlimited Submission &amp; Non-Resistance to the Higher Powers: With some Reflections on the Resistance made to King Charles I (1750) 55 pp. Mayhew was liberal both in his religion and politics. This famous sermon was credited by John Adams with being greatly influential in leading to the commencement of the War of American Independence. | The University of Nebraska abstract:</cite></span></figcaption>
<div class="meta"><span class="t"><a href="../topics/civil-government-and-society/resistance-to-tyranny-and-lawful-authority.html">Resistance to Tyranny and Lawful Authority</a></span></div>

</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-c4cf9f05e8" data-kw="">
<blockquote><p>If a Sovereign Prince endeavor by arms to defend transgressors, to subvert those things which are taught in the word of God, they who are in authority under him, ought first to dissuade him; if they prevail not, and that he now bears himself not as a Prince, but as an enemy, and seeks to violate privileges and rights granted to inferior Magistrates or commonalities, it is the part of pious Magistrates, imploring first the assistance of God, rather to try all ways and means,then to betray the flock of Christ, to such an enemy of God: for they also are to this end ordained, that they may defend the people of God, and maintain those things which are good and just. For to have supreme power lessens not the evil committed by that power, but makes it the less tolerable, by how much the more generally hurtful. Then certainly the less tolerable, the more unpardonably to be punished.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/martin-bucer.html">Martin Bucer</a></span><span class="wk"><span class="lbl">Work:</span> <cite>on Mt. 5</cite></span></figcaption>
<div class="meta"><span class="t"><a href="../topics/civil-government-and-society/resistance-to-tyranny-and-lawful-authority.html">Resistance to Tyranny and Lawful Authority</a></span></div>

</figure><figure class="quote" id="q-67937c6a69" data-kw="">
<blockquote><p>In regard of the justness and necessity of some things which may be the subject or matter of the usurpers’ command and the arbitrariness of others, and the lawfulness of either, not depending upon the command or warrant of a superior, but resulting out of the nature of the action itself; so that a private man might do it, were there no magistrate to command it, or no command from the magistrate for it. We must needs grant there are things which may be done upon the usurpers’ command or injunction (though not because or by virtue of it) for the command of him that unwarrantably assumes power cannot, by itself, make that unlawful which were lawful if that were not. For instance, the performance of acts of common equity, charity, order, public utility and self-preservation is requisite: suppose it be in concurrence with a usurpers’ command, and in thus doing we do materially, but not formally obey him; the ground of acting in such things being not at all any relation or principle of subjection to him, but conscience of obedience to the will of God and due respect to others and our own safety and good. Under this sort of actions I comprehend: 1. Taking up arms for the preservation of ourselves and the country against a common enemy, upon the usurpers’ summons; the which we might do of ourselves, were there no authority; or if a just authority were in being, yet if it could not, or did not, maturely enough call us forth to it. 2. Payment of taxes and bearing other impositions for the usurping power, where, and while we are under his compulsive power, because such contributions may, and will be taken whether I will pay them or not; and I yield them under his enforcement, as a ransom for my life, or liberty, or somewhat else that is better to me than the payment; and consequently I am to choose the parting with it as the less evil, rather than with that which is better, which to loose is to incur a greater evil for the avoidance of a less… 3. Complaining, petitioning or going to law before the magistrates or courts authorized by the usurpers provided you give not the usurpers to whom you petition such titles as you give to the lawful magistrate). (“…excusantur à peccato inducendi tyrannum ad actum, et opus illicitum petentes ab illo iustitiam, quia non petunt actum illicitum, sed justitiam illius actus illiciti… pie interpretandae sunt petitiones tam iustitiae quam honestae gratiae quae offeruntur tyrannis, s. si vis, seu ex quo vis detinere, et exercere hoc dominium, utere illo iuste, utere honeste, utere pie, utere ad utilitatem publicam, et privatorum, prout deceret dominium… nec intendunt, nec petunt actum usurpatum, sed qualitatem sanctam inactu usurpato exercendo.” Cajetan, Summula [Venice: Carampellum, 1596], title: Rempublicam tyrannice occupare… [pp. 411-12]) In thus doing, I seek my necessary self-preservation; neither do I yield or ascribe to them to whom I have recourse any just power of judicature or participate in their sin of usurping it; only I acknowledge they have might and ability in their hand to right me; which, though they ought not to assume, yet I may take the benefit of their unjust use of it; as a poor man may receive relief at the hands of him that has gotten those goods he distributes unjustly; and I may receive my money, with a good conscience, from the hands of a thief that is willing to return it to me though he took it by robbery from another thief that robbed me of it; and if the party, with whom I have a controversy for my right will agree to refer the matter betwixt us to a private person as an arbitrator, and stand to his arbitrement; that is a lawful means of coming by my own, though by his help and award that has not claim of authority over me… But, in granting liberty of concurrence with some commands of an usurped authority, we neither yield any obedience at all to be due, or performable to it; nor can we allow a correspondence with it in diverse things, and therefore we are to put a difference: First, betwixt things that are in themselves necessary, and those that are of a middle or an indifferent nature in themselves considered… 2. Betwixt moral, or prudential acts competible [competent] to private men or subjects, and political acts or judicial proceedings that flow from power and authority inherent in the person that acts them, or are the issues of distributive justice, and either come forth from a person clothed with government, or unto which is requisite a stamp of authority to make them lawful, and justifiable: as to bear the office of a magistrate, or commander in civil or military affairs, or to be any under agent, or servant in carrying on, or assisting the government.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/edward-gee.html">Edward Gee</a></span><span class="wk"><span class="lbl">Work:</span> <cite>An Exercitation concerning Usurped Powers: wherein the Difference betwixt Civil Authority &amp; Usurpation is Stated. That the obedience due to lawful magistrates, is not owing, or payable, to usurped powers, is maintained. The obligation of oaths and other sanctions to the former, notwithstanding the antipolity of the latter is asserted. And the arguments urged on the contrary part in diverse late printed discourses are answered… (London, 1650) 88 pp. ToC</cite>, pp. 22-25</span></figcaption>

— Edward Gee, An Exercitation concerning Usurped Powers: wherein the Difference betwixt Civil Authority &amp; Usurpation is Stated. That the obedience due to lawful magistrates, is not owing, or payable, to usurped powers, is maintained. The obligation of oaths and other sanctions to the former, notwithstanding the antipolity of the latter is asserted. And the arguments urged on the contrary part in diverse late printed discourses are answered… (London, 1650) 88 pp. ToC, pp. 22-25">Copy</button><a class="share" href="https://x.com/intent/post?text=%E2%80%9CIn+regard+of+the+justness+and+necessity+of+some+things+which+may+be+the+subject+or+matter+of+the+usurpers%E2%80%99+command+and+the+arbitrariness+of+others%2C+and+the+lawfulness+of+either%2C+not+depending+upon+the+command+or+warrant+of+a+superior%2C+but+resulting+out+of+the+nature+of+the+action+itself%3B+so+that+a+private+man+might+do+it%2C+were+there+no+magistrate+to+command+it%2C+or+no+command+from+the+magistrate+for+it.+We+must+needs+grant+there+are+things+which+may+be+done+upon+the+usurpers%E2%80%99+command+or+injunction+%28though+not+because+or+by+virtue+of+it%29+for+the+command+of+him+that+unwarrantably+assumes+power+cannot%2C+by+itself%2C+make+that+unlawful+which+were+lawful+if+that+were+not.+For+instance%2C+the+performance+of+acts+of+common+equity%2C+charity%2C+order%2C+public+utility+and+self-preservation+is+requisite%3A+suppose+it+be+in+concurrence+with+a+usurpers%E2%80%99+command%2C+and+in+thus+doing+we+do+materially%2C+but+not+formally+obey+him%3B+the+ground+of+acting+in+such+things+being+not+at+all+any+relation+or+principle+of+subjection+to+him%2C+but+conscience+of+obedience+to+the+will+of+God+and+due+respect+to+others+and+our+own+safety+and+good.+Under+this+sort+of+actions+I+comprehend%3A+1.+Taking+up+arms+for+the+preservation+of+ourselves+and+the+country+against+a+common+enemy%2C+upon+the+usurpers%E2%80%99+summons%3B+the+which+we+might+do+of+ourselves%2C+were+there+no+authority%3B+or+if+a+just+authority+were+in+being%2C+yet+if+it+could+not%2C+or+did+not%2C+maturely+enough+call+us+forth+to+it.+2.+Payment+of+taxes+and+bearing+other+impositions+for+the+usurping+power%2C+where%2C+and+while+we+are+under+his+compulsive+power%2C+because+such+contributions+may%2C+and+will+be+taken+whether+I+will+pay+them+or+not%3B+and+I+yield+them+under+his+enforcement%2C+as+a+ransom+for+my+life%2C+or+liberty%2C+or+somewhat+else+that+is+better+to+me+than+the+payment%3B+and+consequently+I+am+to+choose+the+parting+with+it+as+the+less+evil%2C+rather+than+with+that+which+is+better%2C+which+to+loose+is+to+incur+a+greater+evil+for+the+avoidance+of+a+less%E2%80%A6+3.+Complaining%2C+petitioning+or+going+to+law+before+the+magistrates+or+courts+authorized+by+the+usurpers+provided+you+give+not+the+usurpers+to+whom+you+petition+such+titles+as+you+give+to+the+lawful+magistrate%29.+%28%E2%80%9C%E2%80%A6excusantur+%C3%A0+peccato+inducendi+tyrannum+ad+actum%2C+et+opus+illicitum+petentes+ab+illo+iustitiam%2C+quia+non+petunt+actum+illicitum%2C+sed+justitiam+illius+actus+illiciti%E2%80%A6+pie+interpretandae+sunt+petitiones+tam+iustitiae+quam+honestae+gratiae+quae+offeruntur+tyrannis%2C+s.+si+vis%2C+seu+ex+quo+vis+detinere%2C+et+exercere+hoc+dominium%2C+utere+illo+iuste%2C+utere+honeste%2C+utere+pie%2C+utere+ad+utilitatem+publicam%2C+et+privatorum%2C+prout+deceret+dominium%E2%80%A6+nec+intendunt%2C+nec+petunt+actum+usurpatum%2C+sed+qualitatem+sanctam+inactu+usurpato+exercendo.%E2%80%9D+Cajetan%2C+Summula+%5BVenice%3A+Carampellum%2C+1596%5D%2C+title%3A+Rempublicam+tyrannice+occupare%E2%80%A6+%5Bpp.+411-12%5D%29+In+thus+doing%2C+I+seek+my+necessary+self-preservation%3B+neither+do+I+yield+or+ascribe+to+them+to+whom+I+have+recourse+any+just+power+of+judicature+or+participate+in+their+sin+of+usurping+it%3B+only+I+acknowledge+they+have+might+and+ability+in+their+hand+to+right+me%3B+which%2C+though+they+ought+not+to+assume%2C+yet+I+may+take+the+benefit+of+their+unjust+use+of+it%3B+as+a+poor+man+may+receive+relief+at+the+hands+of+him+that+has+gotten+those+goods+he+distributes+unjustly%3B+and+I+may+receive+my+money%2C+with+a+good+conscience%2C+from+the+hands+of+a+thief+that+is+willing+to+return+it+to+me+though+he+took+it+by+robbery+from+another+thief+that+robbed+me+of+it%3B+and+if+the+party%2C+with+whom+I+have+a+controversy+for+my+right+will+agree+to+refer+the+matter+betwixt+us+to+a+private+person+as+an+arbitrator%2C+and+stand+to+his+arbitrement%3B+that+is+a+lawful+means+of+coming+by+my+own%2C+though+by+his+help+and+award+that+has+not+claim+of+authority+over+me%E2%80%A6+But%2C+in+granting+liberty+of+concurrence+with+some+commands+of+an+usurped+authority%2C+we+neither+yield+any+obedience+at+all+to+be+due%2C+or+performable+to+it%3B+nor+can+we+allow+a+correspondence+with+it+in+diverse+things%2C+and+therefore+we+are+to+put+a+difference%3A+First%2C+betwixt+things+that+are+in+themselves+necessary%2C+and+those+that+are+of+a+middle+or+an+indifferent+nature+in+themselves+considered%E2%80%A6+2.+Betwixt+moral%2C+or+prudential+acts+competible+%5Bcompetent%5D+to+private+men+or+subjects%2C+and+political+acts+or+judicial+proceedings+that+flow+from+power+and+authority+inherent+in+the+person+that+acts+them%2C+or+are+the+issues+of+distributive+justice%2C+and+either+come+forth+from+a+person+clothed+with+government%2C+or+unto+which+is+requisite+a+stamp+of+authority+to+make+them+lawful%2C+and+justifiable%3A+as+to+bear+the+office+of+a+magistrate%2C+or+commander+in+civil+or+military+affairs%2C+or+to+be+any+under+agent%2C+or+servant+in+carrying+on%2C+or+assisting+the+government.%E2%80%9D%0A%0A%E2%80%94+Edward+Gee%2C+An+Exercitation+concerning+Usurped+Powers%3A+wherein+the+Difference+betwixt+Civil+Authority+%26+Usurpation+is+Stated.+That+the+obedience+due+to+lawful+magistrates%2C+is+not+owing%2C+or+payable%2C+to+usurped+powers%2C+is+maintained.+The+obligation+of+oaths+and+other+sanctions+to+the+former%2C+notwithstanding+the+antipolity+of+the+latter+is+asserted.+And+the+arguments+urged+on+the+contrary+part+in+diverse+late+printed+discourses+are+answered%E2%80%A6+%28London%2C+1650%29+88+pp.+ToC%2C+pp.+22-25&amp;url=https%3A%2F%2F5solasquotes.github.io%2Fquote%2F67937c6a69.html&amp;via=5Solas" target="_blank" rel="noopener">Share on X</a><a class="perma" href="../quote/67937c6a69.html">Permalink</a><a class="src" href="https://reformedbooksonline.com/on-the-ethics-of-usurped-powers/#:~:text=In%20regard%20of%20the%20justness%20and,carrying%20on%2C%20or%20assisting%20the%20government&amp;text=In%20regard%20of%20the%20justness%20and%20necessity%20of&amp;text=servant%20in%20carrying%20on%2C%20or%20assisting%20the%20government" rel="noopener" target="_blank">Read it online · Reformed Books Online</a></div>
</figure><figure class="quote" id="q-18f4a949e3" data-kw="">
<blockquote><p>For the words themselves, ‘Honor the King’, I have already spoken at large of the duty contained herein: Know we only, that by the King here, is meant Caesar, who was a heathen emperor, one that intruded himself, ruled tyrannously, and was an idolater… … Under this honor is understood, the inward reverence in heart to be declared outwardly by obedience to all their godly commandments, cheerfulness in payments, prayer and thanksgiving, etc. Now if all this be due to a wicked King, as here, and now to be performed of us, if we had a wicked king, what then is to be done of us to such a king as God has bestowed on us?</p></blockquote>

</figure><figure class="quote" id="q-643bfc56c0" data-kw="">
<blockquote><p>A people may be, by God’s special commandment, subject to a conquering Nebuchadnezzar and a Caesar, as to their king, as was Judah commanded by the prophet Jeremiah to submit unto the yoke of the king of Babylon, and to pray for him, and the people of the Jews were to give to Caesar the things of Caesar; and yet both those were unjust conquerors: for those tyrants had no command of God to oppress and reign over the Lord’s people, yet were they to obey those kings; so the passive subjection was just and commanded of God, and the active [subjection], unjust and tyrannous, and forbidden of God.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/samuel-rutherford.html">Samuel Rutherford</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Lex Rex... (1644; Edinburgh: Ogle, 1843)</cite>, p. 47</span></figcaption>

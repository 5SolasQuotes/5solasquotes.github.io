<main class="wrap"><figure class="quote" id="q-0468be755d" data-kw="">
<blockquote><p>There be not only cavils of profane men, but also conceits in the hearts of the godly themselves which trouble them much, against the necessity and benefit of using prayer. For first, if God know what we want before we ask, what need is there, or what availeth it, to shew and solicit our suits to him which knoweth them already? for such rehearsals are wont to be troublesome and grievous. S. Hierome [Jerome] answereth very finely: That, in prayer we are no shewers, but suiters: and it is one thing, to make known to him that is ignorant; and another thing, to intreat and ask of him that knoweth.

Yet this answer removeth not all difficulty. For our heavenly father doth not only know, what thing we want, but also unasked of his fatherly care and favour, is ready and forward of his own accord to help us before we ask. And therefore it seemeth, there is either no benefit or no need of praying; I answer: we do not pray with that intent, and for that end, as though we would by our prayers stir up God, and put him in mind of his duty, being negligent and careless of our affaires; or otherwise as being hard and merciless, allure him by our prayers, and bring him into an other mind.

We know indeed that God is ready of his own accord to give good things, but yet to those which doe repent, and humble themselves under the mighty hand of God, who by faith do seek, knock, and ask. And therefore we do pour out our prayers before God, not for that we doubt of his good will, but that we may indeed shew our selves to bring true repentance, because he hath promised forgiveness of sins to them which repent, Ezek. 8.23. that he will assuage his judgements, and bestow his blessings, Jer. 18.8. and give grace unto the humble, 1. Pet. 5.5.

And that it may appear that when we call upon God, and think upon his promises, we bring with us and likewise do exercise true faith, because the Lord hath promised all good things to him that doth knock and aske, Math. 7.7. and that we do come boldly to the throne of grace, that we may receive mercy and find grace to help in time of need, Hebr. 4.16. Again, spiritual blessings can not otherwise be received then by faith: indeed bodily or outward benefits are oft bestowed upon the wicked also: and yet that those may be profitable unto us, it is the will of God that we should wait for them by hope, and receive them by faith from his fatherly hand. And therefore we pray in faith, that we may shew forth our desire to receive from God not only corporal blessings, but those especially which are spiritual, heavenly, and eternal.

And that we would so receive from God the blessings of this life, that by his blessing they may be profitable unto us. And because God would have this glory given to himself, to be the fountain, the author and giver of every good thing, Jam. 1.17. &amp; that we should wholly rely upon him: we therefore in prayer do testify, that we neither ascribe them to any other, nor seek them elsewhere, but doe wholly hope for, expect, and require the same from God alone: for God hath promised, that he will be ready and willing to help such.

Also in our prayers we do thus lay open our wants and miseries before God, not as though he knew them not, but that by pouring out our cares in the Lord’s bosom, we may disburden &amp; ease our own soul. And the promise is most sweet and comfortable, Psal. 37.5. and 55.22. 1. Pet. 5.7. Roll &amp; cast thy ways upon the Lord, and he will have care and bring it to pass.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/martin-chemnitz.html">Martin Chemnitz</a></span><span class="wk"><span class="lbl">Work:</span> <cite>A substantial and Godly exposition of the prayer commonly called the Lord’s Prayer</cite>, (Cambridge: John Legate, 1598), pp 1-4.</span></figcaption>

<blockquote><p>The time when Christ was buried was the evening, wherein the Sabbath was to begin according to the manner of the Jews, which began their days at sun setting from evening to evening according to that in Genesis: the evening and the morning was the first day.

Now Joseph cometh a little before evening and beggeth the body of Christ and burieth it: where note, that howsoever we are not bound to keep the sabbath so strictly as the Jews were, yet when we have any business or work to be done of our ordinary calling, we must not take a part of the Lord’s sabbath to do it in, but prevent the time, and doe it either before as Joseph did, or rather after the sabbath.

This is little practised in the world. Men think if they go to Church before and after noon to hear Gods word, then all the day after they may do what they list, and spend the rest of the time at their own pleasure: but the whole day is the Lord’s, and therefore must be spent wholly in his service both by public hearing of the word, and also by private reading and meditation on the same.</p></blockquote>

<blockquote><p>…if the work be necessarily required to the performance of the service of God, servile or not, it must be done. As circumcision on the eighth day, if it fell upon the Sabbath, it was to be done, Jn. 7:22. And the priests on the Sabbath killed the sacrifice and were blameless, Mt. 12:5. And in this respect the minister on the Sabbath is allowed to go to preach, as Christ did upon the Sabbath, Mt. 12, and the people are to go to hear. An example whereof we have in the Shunamite, that went ordinarily upon the Sabbath and new moon to the prophet: For when she demanded leave of her husband to go to the prophet, ‘Why wilt thou go’ (says he) ‘seeing it is neither Sabbath nor new moone’: intimating thereby that upon those times she went to hear him. And in this regard was the Sabbath day’s journey allowed, Acts 1:12. And therefore whosoever shall break the rest of the Sabbath in this respect is blameless. For the Sabbath was made for man, that he might keep it holy unto the Lord. Now, if it may so fall that the rest itself should any way be a let to the keeping of it holy, then the rest itself is to be broken: and they that so doe are blameless. For the end of the law in this respect is to be regarded and not the letter. For the Sabbath was made for man, that is, for the good of man; and not man for the Sabbath, that is for the rest. And this is the meaning of that place, Mk. 2:27, ‘The Sabbath was made for man, and not man for the Sabbath.’ … The conclusion then of this point is this: That no kind of ordinary or servile work may be done upon the Sabbath; neither in the house, nor in the city, nor in the fields, nor upon the seas, be they never so small, or never so meet, or never so glorious in show, except either God command it extraordinarily, or that the work tend directly to God’s worship: or be of necessity either for the preservation of life, or health, or goods; in which respects God has given us allowance upon the Sabbath to work, and not otherwise.</p></blockquote>

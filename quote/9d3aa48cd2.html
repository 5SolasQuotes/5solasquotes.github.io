<blockquote><p>IN the blessed Life of our Saviour we read once and again of his going into the Synagogues, to attend the public Worship of God on the Sabbath days. Luke 4.6. As his Custom was he went into the Synagogue on the Sabbath day. This he did to teach and require us to keep the Sabbath as he did. He has given us this Example that we should follow his steps. So he served and worshiped God, fulfilling all Righteousness, and so must we. He came not to destroy the Law and the Prophets, but to fulfil them. Had he put an end to the Sacred weekly Sabbath, it had destroyed the Law and the Prophets with a witness.

But Christ fulfilled this Law, and kept many a Sabbath to the glory of God in a perfect manner, so as no mere man, nor all the Holy men of God together, ever did or can do. He has taught us how to Sabbatise; how to spend our Sabbaths in the solemn Assemblies, and in works of piety and mercy. Many a high Exercise of devotion, and many a good work of charity, did he upon the Sabbath-day. He fill’d up the Holy time with work, and the work with Spirit. For these very works of God like goodness he was sometimes reproached as a breaker of the Sabbath; but it turned to the confusion of his ignorant and superstitious, if not hypocritical and malicious Accusers. As in Mark 3. Init. He sanctified and honoured the Sabbath by his divine Sermons, and by his miracles of mercy on that blessed day. He made it a Day of his Blessing to men, both on temporal and spiritual accounts. Luk. 13.10, 17.

He kept that blessed Law for his Elect, which Believers themselves keep so poorly and imperfectly.—He also taught his Disciples and followers to observe and keep the Sabbath-day, Indeed some of the superstitious Pharisees did sometimes tax the Disciples with taking undue liberties on the Holy Sabbath. But what was it? they plucked an ear of corn and eat of it as they passed thro’ a field. They were hungry and it was but a proper and needed taste, and an ordinary hasty bit, for their support and refreshment in the services of the day.

The Women also that followed our Lord Jesus, and ministered unto him, were strict Sabbatizers: Luk. 23. ult. They rested on the Sabbath day according to the Commandment. Tho’ they were preparing spices for the dead body of their dear Saviour, yet they laid by the holy care and labour of love till the Sabbath was over. Verily God’s Sabbaths did they keep; even as if the words of my Text were then in their remembrance, and they considered that as the holy work of the Tabernacle was to give place to the holy Rest of God’s day, so their pious ministering to that sacred Temple of the Deity, our Lord’s Body.—And that was the last Seventh day Sabbath which the Disciples kept.

For early in the morning of the next day, being the first day of the week these Women came unto the Sepulchre, bringing the Spices which they had prepared; and they found not the Body of Jesus, but had a vision of Angels who told them of his resurrection from the dead.— And that same day the Lord himself appeared several times to one and another of his Followers; to Mary Magdalene, to the two disciples on their way to Emmaus, to Simon, and to the ten together in the Evening: when he blessed them, breathed on ’em, and gave them their Commission.

That day seven night, being again the first day of the week, the Lord appeared again unto them, Thomas being then present, and shewed them his hands and his feet.— Now by the Resurrection of Christ on the first day of the week, and by his repeated visits to them on this day, the Inspired Apostles (under the infallible Conduct of the Holy Ghost) from thenceforth held their solemn Meetings, their holy Convocations, on this day of the seven, and called it the Lord’s-Day.— On this first day of the week, the Disciples were all with one accord in one place, assembled as on their holy Sabbath, when suddenly there appeared the cloven Tongues of fire and sat upon them, and they were all filled with the Holy Ghost; and spake in every language the wonderful works of God; the proper service of the Sabbath day.

That this day of Pentecost was the first day of the week is easily computed and proved. The day after the Passover was the first day of the feast of unleavened bread; (see Lev. 23.5, 6.) which was as a Sabbath to the Jews; They were to have an holy Convocation on it, and to do no servile work thereon. On the next day was the Offering of the first-fruits unto the Lord: And from this day, (the next but one after the Passover) they were ordered to count fifty days, or seven weeks complete; and then was the feast of Pentecost, so called from the fiftieth day.

Now see how these things were all fulfilled in the Dying and Resurrection of our Lord Jesus, and in the pouring out of the Spirit on the day of Pentecost.— Our blessed Lord Jesus was slain at the Passover, which fell that year on a fryday: Then was the Lamb of God offered, Christ our Passover sacrificed for us.— That Evening therefore was the preparation, as it is called John 19.31. scil. the preparation both for the weekly Sabbath, and also for the Feast of unleavened bread; which made that Sabbath a high day. The Jews therefore were earnest with Pilate to have the Bodies taken down early from the Cross. This whole Sabbath our Lord’s Body lay in the grave.

And the next morning early, being the first day of the week, the next day but one after the Passover, the day of the offering of the first-fruits unto the Lord, he rose from the dead, and became the first-fruits of them that sleep. Now compute just seven weeks from this day of our Lord’s Resurrection, and the first day of the eighth week, even the fiftieth day, was the day of Pentecost; when the Spirit, (the promise of the Father) was poured out from the ascended Jesus upon his Apostles, as they were assembled together for his solemn Worship.</p></blockquote>

<blockquote><p>Now some would make a significancy in it [Christ sitting to preach, Lk. 4:20]; but I take it, it was only a civil gesture, that Christ observing what the way was at that time, He would conform himself to the order and way of sitting, not that it had any spiritual signification: As now, the French Ministers, they preach with their hats on, It’s the custom there, and no question, if any one were to go among them it were fit they should observe the customs that they have: and so here, to sit down, and in other Churches to stand… Therefore observe here, whatsoever ceremony is but natural and helpful in a natural way, there should be no contention, we have no such custom, nor the Churches of God to contend about these, but if they come to have a religious use put upon them… now they come to be sinful, and therefore Christ He observed the ceremony of the Jews [of sitting to preach] as a natural help.</p></blockquote>

<blockquote><p>I shall therefore a little further explain this distinction and then show you the soundness of it, and then the exceeding usefulness and necessity of it, both in this and many other controversies:

1. For the title I choose rather to denominate it from the object than the act, because the diversity is in the object, but none in the species of the act naturally considered: Debitum and natural being are two distinct things; but ‘to will’ one and ‘to will’ the other is all one as to the nature of willing. God does as properly will duty as He wills natural beings. Yet if I must denominate it from the acts, I would distinguish between God’s Directive Will and his Legislative. For to call it voluntas praecepti is too narrow a term, for the precept is but one part of God’s Law and determines only of one sort of right, that is, of the dueness of obediential actions or forbearance of forbidden actions. But there is also a debitum praemii et beneficii–pure vel absolute–dati, et debitum poenae [debt of reward and benefit, whether purely or absolutely given, and a debt of punishment], which the rest of the Law, Testament or Covenant of God determines of, which must all be here included as well as the former. In sum, the Law determines:

1. What shall be due from us; 2. and what shall be due to us, and on what terms. I call it therefore, The will of God de eventu, et de debito [of event, and of debt], as such. I say ‘as such,’ for else they are coincident: For God’s will de rerum natura, vel existentia determines de debito quatenus evenit esse debitum [determines the nature or existence of things, and debt so far as debt comes about], but not qua debitum [as debt]. And his will de debito determines of the dueness of some events, not as eventual [as to the event], but as due. Or to avoid all ambiguity: call it God’s will de ente mere naturali [concerning merely natural being] and his will de debito morali [concerning moral debt], or Legislative or Governing.

2. And for the nature of the distinction, understand further that there are two acts which I call God’s will de debito: The first is that immanent act of his will by which He strictly and properly wills what shall be due. This also is twofold:

1. Productive, or instituting dueness; 2. and approbative, or taking complacency in duty. The former of these I principally intend, but exclude not the latter. God does eternally will every due, but it is not therefore eternally or from eternity due. For He wills from eternity (to speak vulgarly) only that this shall be due at such a time and by such a means. I say by such means: For though God’s will produce all dueness, yet only by means does He produce it. That means is the revelation of his will.

2. This revelation of God’s will de debito we call his Law. This therefore is the second thing which I call God’s will de debito, or his Legislative will, that is, the Law as it is signum voluntatis divinae [a sign of the divine will], that is, formally as a law. This I call God’s will de debito, only metonymically, as it is the sign of his will before expressed. If the proper will of God were separated from this, it would then be no producer of dueness or right at all, for it would be no law, no signum; it would lose its nature as abrogated laws do.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/richard-baxter.html">Richard Baxter</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Universal Redemption of Mankind by the Lord Jesus Christ Stated &amp; Cleared</cite>, … (London: Salusbury, 1694), ch. 2, pp. 28-32</span></figcaption>

<blockquote><p>When we were sat in Assembly, the three creeds were read, and many debates were held upon them, but especially about this word, in the eighth article, “they ought thoroughly to be received,” as if it set them in too high a place, in an equality with Scripture. At last it was resolved, that that article should be tendered to the Parliament, by way of humble advice, to be read thus, ‘The Creeds that go under the name of the Nice Creed, Athanasian Creed, and that which is commonly called the Apostles’ Creed, are thoroughly to be received and believed, for that the matter of them may be proved by most certain warrants of holy Scripture.’ Then was there a long agitation about translating the creeds anew, and about setting some gloss upon the preface and conclusion of Athanasius’ Creed, which seems to be something harsh; but at last it was concluded, that the creeds should be printed, at the end of the thirty-nine articles; so the determining of these matters referred thither.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/john-lightfoot.html">John Lightfoot</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Journal of the Proceedings of the Assembly of Divines, from July 1, 1643, to December 31, 1644</cite>, ed. John Rogers Pitman (London: J. F. Dove, 1824), 18 August 1643, p. 10.</span></figcaption>

<blockquote><p>Say what you will, it must needs be an Excellent thing wherewith Christ Jesus Himself was Filled, and that was with The Spirit of this Fear, Esai. 11.2. An excellent thing which God Himself so earnestly desires to be still in us, and that is this Fear. O (saith He) that there were such an Heart in them, that they would fear me, and keep my Commandments always, which is indeed the whole Duty of Man; without which (Saint Bernard concludes) Every man is Nothing. He is not a Man (reasons a Schoolman) but the Shadow of a Man; because He employs not his Soule to that noble End for which he had it, namely, to be squared and ruled by the fear of the Lord: without which no man can so much as Begin to be wise, because this Fear is the Beginning of wisdom, nor so much as Begin to Love God, because this Fear is the Beginning of the Love of God.

It is the Sale alludes Blesensis that must be in every Sacrifice, in every Work we do, so that there is no Serving God, no Rejoicing in Him, no hearty Repenting, no Chaste Conversing, no Perfecting Holiness, no Working out our Salvation, but with Fear and Trembling; nay there is no Salvation, no Blessedness without Continuing in this Fear, Prov. 28.14. Again, is not that Excellent, that will make us more Excellent than our Neighbours, that will Exalt us above them, that will keep our hearts from Hardening, our Houses from Overthrowing? but nothing can do this; but this Fear of the Lord. This fear (saith Paris.) can cause a spiritual Earth-quake in a man’s Heart, able to overthrow all the Devil’s strongest holds, any Bosom-sin, be it never so pleasing and profitable, by reason of that Contrariety and Opposition that is between Lying in any Sweet Sin, and Living in God’s Fear and Favour, as you may see, Levit. 25.36.

Lastly, this is an Excellent Fear, because it is A fountain of Life: wherefore? To drive away Sins, Sins which have been committed by Repentance (saith S. Bernard) and Sins whereto we are Tempted, by Resistance; and yet this is not all the Excellency of this Fear: For it is A fountain of life also: To Cause us to find favour at our Deaths; and which is more, Such an Excellent Fear as will make us Not fear, nor be afraid. Whereupon Saint Augustine concludes for my purpose: … Let him learn to fear, that would not fear: Let him be wary and cautelous [sic] for a time, that would be happy and secure for ever.

Tertullian gives the reason, because if We fear to Offend, by Fearing we will take heed, lest we Offend, and by Taking heed, we shall be in safety; otherwise if we presume and be not always watchful over our hearts lest they offend, we cannot be Saved, Jer. 4.14. He that is not over-hold on his own strength; but confident in Christ, and lives not securely in the minion-delight of any known sin; but stands in such continual awe of God’s Presence, Precepts, Promises, Threats, that he dare not so much as once make any offer of incurring his Displeasure by the impenitent Allowance of any sin in his heart, and studies to do every Good work as carefully, as if it were the Last he should do in this World, and as exactly, as if his whole Salvation depended upon it, such a Man in Ancient Tertullian’s judgement may be truly secure of Persevering in Grace here; and of being Glorified hereafter, 1 Thess. 5.15, 24.</p></blockquote>

<div class="actions"><button class="copy" data-copy="“Say what you will, it must needs be an Excellent thing wherewith Christ Jesus Himself was Filled, and that was with The Spirit of this Fear, Esai. 11.2. An excellent thing which God Himself so earnestly desires to be still in us, and that is this Fear. O (saith He) that there were such an Heart in them, that they would fear me, and keep my Commandments always, which is indeed the whole Duty of Man; without which (Saint Bernard concludes) Every man is Nothing. He is not a Man (reasons a Schoolman) but the Shadow of a Man; because He employs not his Soule to that noble End for which he had it, namely, to be squared and ruled by the fear of the Lord: without which no man can so much as Begin to be wise, because this Fear is the Beginning of wisdom, nor so much as Begin to Love God, because this Fear is the Beginning of the Love of God.

It is the Sale alludes Blesensis that must be in every Sacrifice, in every Work we do, so that there is no Serving God, no Rejoicing in Him, no hearty Repenting, no Chaste Conversing, no Perfecting Holiness, no Working out our Salvation, but with Fear and Trembling; nay there is no Salvation, no Blessedness without Continuing in this Fear, Prov. 28.14. Again, is not that Excellent, that will make us more Excellent than our Neighbours, that will Exalt us above them, that will keep our hearts from Hardening, our Houses from Overthrowing? but nothing can do this; but this Fear of the Lord. This fear (saith Paris.) can cause a spiritual Earth-quake in a man’s Heart, able to overthrow all the Devil’s strongest holds, any Bosom-sin, be it never so pleasing and profitable, by reason of that Contrariety and Opposition that is between Lying in any Sweet Sin, and Living in God’s Fear and Favour, as you may see, Levit. 25.36.

Lastly, this is an Excellent Fear, because it is A fountain of Life: wherefore? To drive away Sins, Sins which have been committed by Repentance (saith S. Bernard) and Sins whereto we are Tempted, by Resistance; and yet this is not all the Excellency of this Fear: For it is A fountain of life also: To Cause us to find favour at our Deaths; and which is more, Such an Excellent Fear as will make us Not fear, nor be afraid. Whereupon Saint Augustine concludes for my purpose: … Let him learn to fear, that would not fear: Let him be wary and cautelous [sic] for a time, that would be happy and secure for ever.

Tertullian gives the reason, because if We fear to Offend, by Fearing we will take heed, lest we Offend, and by Taking heed, we shall be in safety; otherwise if we presume and be not always watchful over our hearts lest they offend, we cannot be Saved, Jer. 4.14. He that is not over-hold on his own strength; but confident in Christ, and lives not securely in the minion-delight of any known sin; but stands in such continual awe of God’s Presence, Precepts, Promises, Threats, that he dare not so much as once make any offer of incurring his Displeasure by the impenitent Allowance of any sin in his heart, and studies to do every Good work as carefully, as if it were the Last he should do in this World, and as exactly, as if his whole Salvation depended upon it, such a Man in Ancient Tertullian’s judgement may be truly secure of Persevering in Grace here; and of being Glorified hereafter, 1 Thess. 5.15, 24.”

— Hannibal Gamon, The praise of a godly woman. A sermon preached at the solemn funeral of the right honourable lady, the Lady Frances Roberts, at Lanhide-rock-Church in Cornwall, the tenth of August, 1626, (London: John Grismond, 1627), pp 14-16.">Copy</button><a class="share" href="https://x.com/intent/post?text=%E2%80%9CSay+what+you+will%2C+it+must+needs+be+an+Excellent+thing+wherewith+Christ+Jesus+Himself+was+Filled%2C+and+that+was+with+The+Spirit+of+this+Fear%2C+Esai.+11.2.+An+excellent+thing+which+God+Himself+so+earnestly+desires+to+be+still+in+us%2C+and+that+is+this+Fear.+O+%28saith+He%29+that+there+were+such+an+Heart+in+them%2C+that+they+would+fear+me%2C+and+keep+my+Commandments+always%2C+which+is+indeed+the+whole+Duty+of+Man%3B+without+which+%28Saint+Bernard+concludes%29+Every+man+is+Nothing.+He+is+not+a+Man+%28reasons+a+Schoolman%29+but+the+Shadow+of+a+Man%3B+because+He+employs+not+his+Soule+to+that+noble+End+for+which+he+had+it%2C+namely%2C+to+be+squared+and+ruled+by+the+fear+of+the+Lord%3A+without+which+no+man+can+so+much+as+Begin+to+be+wise%2C+because+this+Fear+is+the+Beginning+of+wisdom%2C+nor+so+much+as+Begin+to+Love+God%2C+because+this+Fear+is+the+Beginning+of+the+Love+of+God.%0A%0AIt+is+the+Sale+alludes+Blesensis+that+must+be+in+every+Sacrifice%2C+in+every+Work+we+do%2C+so+that+there+is+no+Serving+God%2C+no+Rejoicing+in+Him%2C+no+hearty+Repenting%2C+no+Chaste+Conversing%2C+no+Perfecting+Holiness%2C+no+Working+out+our+Salvation%2C+but+with+Fear+and+Trembling%3B+nay+there+is+no+Salvation%2C+no+Blessedness+without+Continuing+in+this+Fear%2C+Prov.+28.14.+Again%2C+is+not+that+Excellent%2C+that+will+make+us+more+Excellent+than+our+Neighbours%2C+that+will+Exalt+us+above+them%2C+that+will+keep+our+hearts+from+Hardening%2C+our+Houses+from+Overthrowing%3F+but+nothing+can+do+this%3B+but+this+Fear+of+the+Lord.+This+fear+%28saith+Paris.%29+can+cause+a+spiritual+Earth-quake+in+a+man%E2%80%99s+Heart%2C+able+to+overthrow+all+the+Devil%E2%80%99s+strongest+holds%2C+any+Bosom-sin%2C+be+it+never+so+pleasing+and+profitable%2C+by+reason+of+that+Contrariety+and+Opposition+that+is+between+Lying+in+any+Sweet+Sin%2C+and+Living+in+God%E2%80%99s+Fear+and+Favour%2C+as+you+may+see%2C+Levit.+25.36.%0A%0ALastly%2C+this+is+an+Excellent+Fear%2C+because+it+is+A+fountain+of+Life%3A+wherefore%3F+To+drive+away+Sins%2C+Sins+which+have+been+committed+by+Repentance+%28saith+S.+Bernard%29+and+Sins+whereto+we+are+Tempted%2C+by+Resistance%3B+and+yet+this+is+not+all+the+Excellency+of+this+Fear%3A+For+it+is+A+fountain+of+life+also%3A+To+Cause+us+to+find+favour+at+our+Deaths%3B+and+which+is+more%2C+Such+an+Excellent+Fear+as+will+make+us+Not+fear%2C+nor+be+afraid.+Whereupon+Saint+Augustine+concludes+for+my+purpose%3A+%E2%80%A6+Let+him+learn+to+fear%2C+that+would+not+fear%3A+Let+him+be+wary+and+cautelous+%5Bsic%5D+for+a+time%2C+that+would+be+happy+and+secure+for+ever.%0A%0ATertullian+gives+the+reason%2C+because+if+We+fear+to+Offend%2C+by+Fearing+we+will+take+heed%2C+lest+we+Offend%2C+and+by+Taking+heed%2C+we+shall+be+in+safety%3B+otherwise+if+we+presume+and+be+not+always+watchful+over+our+hearts+lest+they+offend%2C+we+cannot+be+Saved%2C+Jer.+4.14.+He+that+is+not+over-hold+on+his+own+strength%3B+but+confident+in+Christ%2C+and+lives+not+securely+in+the+minion-delight+of+any+known+sin%3B+but+stands+in+such+continual+awe+of+God%E2%80%99s+Presence%2C+Precepts%2C+Promises%2C+Threats%2C+that+he+dare+not+so+much+as+once+make+any+offer+of+incurring+his+Displeasure+by+the+impenitent+Allowance+of+any+sin+in+his+heart%2C+and+studies+to+do+every+Good+work+as+carefully%2C+as+if+it+were+the+Last+he+should+do+in+this+World%2C+and+as+exactly%2C+as+if+his+whole+Salvation+depended+upon+it%2C+such+a+Man+in+Ancient+Tertullian%E2%80%99s+judgement+may+be+truly+secure+of+Persevering+in+Grace+here%3B+and+of+being+Glorified+hereafter%2C+1+Thess.+5.15%2C+24.%E2%80%9D%0A%0A%E2%80%94+Hannibal+Gamon%2C+The+praise+of+a+godly+woman.+A+sermon+preached+at+the+solemn+funeral+of+the+right+honou

<main class="wrap"><figure class="quote" id="q-3dcb0432b0" data-kw="">
<blockquote><p>21. By the knowledge of our own acts we know our powers and the nature of our own souls (though imperfectly). And by the knowledge of our souls, we know the nature of other intellectual spirits. And by the knowledge of ourselves and them, and the Scripture expressions of his attributes, we know so much of God as we can here know. And accordingly must speak of him, or be silent. For we have no higher notions than such as are thus analogical, expressing that which is in God in an inconceivable eminency and transcendency, by words which first signify that which is formally in the soul (as is said).</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/richard-baxter.html">Richard Baxter</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Catholic Theology (London: White, 1675) | sect. 3, ‘The several inadequate conceptions which in order make up our knowledge of God’</cite></span></figcaption>

<blockquote><p>§1. We have laid out the concept of the natural knowledge of God based on the mainstream orthodox view. What is left is to demonstrate the wider agreement on this by quoting different authors… These authors do not just generally affirm this natural knowledge of God, but also distinctly break it down into parts or species which they explain: the innate or implanted or subjective type; and the acquired or added or objective or discursive or demonstrative type, derived a posteriori from observing effects.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/gisbertus-voetius.html">Gisbertus Voetius</a></span><span class="wk"><span class="lbl">Work:</span> <cite>‘Disputation On the Ways of Knowing God’, pt. 2 tr. Michael Lynch (1665; 2024) at Translationes Lyncei</cite></span></figcaption>
<div class="meta"><span class="t"><a href="../topics/theology/faith-and-reason.html">Faith and Reason</a></span></div>

</figure><figure class="quote" id="q-ebb8e21ffd" data-kw="">
<blockquote><p>14. What is the legitimate office of reason in the sphere of religion? 1st. Reason is the primary revelation God has made to man, necessarily presupposed in every subsequent revelation of whatever kind. 2d. Hence Reason, including the moral and emotional nature, and experience, must be the organ by means of which alone all subsequent revelations can be apprehended and received. A revelation addressed to the irrational would be as inconsequent as light to the blind. This is the usus organicus [organic use] of reason. 3d. Hence no subsequent revelation can contradict reason acting legitimately within its own sphere. For then (1) God would contradict Himself, and (2) faith would be impossible. To believe is to assent to a thing as true, but to see that it contradicts reason, is to see that it is not true.</p></blockquote>

<blockquote><p>…the intention of the wise man must be directed to the twofold truth of divine things [one which can be known by reason and the other not] and to the refutation of contrary errors… Therefore, in order to deduce the first kind of truth, we must proceed by demonstrative arguments by which we can convince our adversaries. But, since there are no such arguments in support of the second kind of truth, our intention must be not to convince our opponent by our arguments, but to solve the arguments which he brings against the truth, because, as shown above (ch. 7), natural reason cannot be opposed to the truth of faith.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/thomas-aquinas.html">Thomas Aquinas</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Summa Contra Gentiles, bk. 1, ch. 9, ‘Of the order and mode of procedure in this work’</cite></span></figcaption>

</figure><figure class="quote" id="q-2744cc85f0" data-kw="">
<blockquote><p>Bullinger (1504-1575), a Swiss reformer, was the successor of Heidrich Zwingli. He was one of the most influential of the earlier reformers… He was educated in the via antiqua [old way], learning from such greats as Aquinas and Scotus. In what follows, I provide quotes from Bullinger on the following subjects: Faith, Nature, Natural Reason, Natural Theology, and Natural Law. The quotes are accompanied only by short comments to help situate them or better understand them.” – Haines ‘John Calvin’s View of Natural Theology’ Abstract: “I will, therefore, consider Calvin’s claims about man’s natural knowledge of God under five headings: (1) What Calvin means by “knowledge of God”, (2) The possibility of knowledge of God, (3) The sources of man’s knowledge of God, (4) The content of this knowledge, and (5) the what man does with this knowledge (or, the effect of this knowledge on man).</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/thomas-joseph-white.html">Thomas Joseph White</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Wisdom in the Face of Modernity: A Study in Thomistic Natural Theology (Ave Maria, FL: Sapienta Press, 2009) 340 pp. ToC | ‘Heinrich Bullinger on Natural Reason, Theology &amp; Law’</cite></span></figcaption>

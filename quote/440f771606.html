<main class="wrap"><figure class="quote" id="q-440f771606" data-kw="">
<blockquote><p>There is no end of books, and yet we seem to need more every day. There was such a darkness brought in by the fall, as will not thoroughly be dispelled till we come to heaven; where the sun shineth without either cloud or night. For the present, all should contribute their help according to the rate and measure of their abilities. Some can only hold up a candle, others a torch; but all are useful.

The press is an excellent means to scatter knowledge, were it not so often abused. All complain there is enough written, and think that now there should be a stop. Indeed, it were well if in this scribbling age there were some restraint. Useless pamphlets are grown almost as great a mischief as the erroneous and profane. Yet ’tis not good to shut the door upon industry and diligence. There is yet room left to discover more, above all that hath been said, of the wisdom of God and the riches of his grace in the gospel; yea, more of the stratagems of Satan and the deceitfulness of man’s heart.

Means need to be increased every day to weaken sin and strengthen trust, and quicken us to holiness. Fundamentals are the same in all ages, but the constant necessities of the church and private Christians, will continually enforce a further explication. As the arts and slights of besieging and battering increase, so doth skill in the foundation. If we have no other benefit by the multitude of books that are written, we shall have this benefit: an opportunity to observe the various workings of the same Spirit about the same truths, and indeed the speculation is neither idle nor unfruitful.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/thomas-manton.html">Thomas Manton</a></span><span class="wk"><span class="lbl">Work:</span> <cite>To the Reader in Richard Sibbes, A Learned Commentary or Exposition upon the First Chapter of the Second Epistle of S. Paul to the Corinthians</cite></span></figcaption>

<blockquote><p>As at other times, he put a comparative neglect upon his mother, which seemed purposely designed to obviate the extravagant respect which men in aftertimes would be apt to pay her. Our respect ought to be guided and governed by Christ&#x27;s; now the virgin Mary, or Christ&#x27;s mother, is not equalled with, but postponed to, ordinary believers, on whom Christ here puts a superlative honour.</p></blockquote>

</figure><figure class="quote" id="q-87a9dd8be8" data-kw="">
<blockquote><p>Paul, when writing to the Corinthians who were Greeks, gives the preference to that [Greek] custom [of men having an uncovered head in worship]. In doing so, he did not intend to lay down a universal law which should be everywhere observed. He merely accommodated himself to a custom of civil life observed, at that time, by those to whom he was writing. This is admirably, I think, explained by [Johann H.] Altingius in a discourse already quoted… It must not be supposed that the same rule which he had given to the Corinthians from a regard to their customs would have been invariably given to Jews dwelling in their own country, or to Egyptians or Arabians, who followed a different custom. The usages of civil life are endlessly varied by place and time. Consequently what, at one place and time, is sufficiently becoming, would be, at anotlier place and time highly unbecoming. Yet the apostolic rule has been in force, since that time, among almost all Christians. Is it because keeping the head uncovered is universally regarded by them as a token of reverence? I hardly think so. It has spread widely in the north, through the nations of France and Germany. But among the Jews, the Greeks, ancient Italy, and the whole of the East, the custom is wholly unknown. It appears, therefore, to belong to the liberty of the New Testament. ‘With uncovered head,’ says Tertullian, ‘because we are not ashamed.&#x27;</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/herman-witsius.html">Herman Witsius</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Other citations (work not named)</cite>, pp. 84-90 of Dissertation 4, ‘On Gestures in Prayer’ in Sacred Dissertations on the Lord’s Prayer (1689; Edinburgh: Thomas Clark, 1708)</span></figcaption>

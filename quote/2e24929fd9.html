<main class="wrap"><figure class="quote" id="q-2e24929fd9" data-kw="">
<blockquote><p>The third Impediment of the Churches restauration taken away by these great earth-quakes, is error, heresy, false worship, idolatry, &amp;c. You cannot preach, nor pray them down directly and immediately (though all other meanes depend upon these (and the Saints must own the thing) God is terrible out of his holy places, Psa. 68.35.) Well, that which the Word cannot do, the sword shall; that which the water cannot wash out, the fire will burn out. Unto this particular the Apostle applies this very text in part, namely concerning the shaking of the Heavens, Heb, 12.26, 27. Yet once more I shake not earth only, but also heaven, &amp;c.

An earth-quake (as we have heard) was appointed to shake down the ceremonial Ordinances; now if this were necessary for the abolition of that divine worship, which had sometimes been by God’s own holy institution, how much more shall that which hath been of human invention (yea, the very fumes and fogs of the bottomless pit) to God’s infinite displeasure and dishonour, be tumbled down with violence and vengeance to hell, from whence it came? And therefore as the heathenish idolatry fell with such a terrible earthquake as shook down both it and all its supporters both Emperors and Empire; even so shall antichristian idolatry and heresy with Babylon their Mother, the Beast their Father, and all their intoxicated and dementated defenders, be thrown like a Mill-stone into the bottom of the sea, Rev. 18.21.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/william-reyner.html">William Reyner</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Babylon’s ruining-earthquake and the restoration of Zion delivered in a sermon before the honourable House of Commons at Margaret’s Westminster, at their public fast, August 28, 1644</cite>, (London: Samuel Enderby, 1644), pp 20-21.</span></figcaption>

</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-9187585789" data-kw="">
<blockquote><p>Things less than fully good, or impure, not inherently wrong, may in some circumstances, especially according to the degree of necessity, be personally, materially done, even in worship, public worship and Church government (though they occasion passive scandal in some), for the good in the things themselves and for attaining higher and weightier goods (in proportion to that degree), while seeking to avoid the greater hurt and scandal, without approving the impurities or what may be deficient in them.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/travis-fentiman.html">Travis Fentiman</a></span><span class="wk"><span class="lbl">Work:</span> <cite>“Editor’s Extended Introduction” in English Puritans, A Refutation of the Errors of Separatists</cite>, 2. “Principled Partial Conformity in Worship” in “Editor’s Extended Introduction” in English Puritans, A Refutation of the Errors of Separatists (1604; RBO, 2025), pp. 21-93, p. 48</span></figcaption>

</figure><figure class="quote" id="q-33ebb59ee1" data-kw="">
<blockquote><p>At the Reformation of religion, some learned and godly men were of opinion that in detestation of the Popish superstition which had overspread and soiled all the worship of God, the best way was to as far from the Church of Rome as possibly might be: Others, no less learned and godly than they thought it better to depart no further from the Romish Church than she had departed from the right way, partly that they that would might step over from them to us the more easily; partly that our departure from them might appear to be made rather of necessity than of choice, and not for things which might be tolerated, but for things intolerable. Both aimed at one mark, but did not shoot after one compass; and the wiser sort and more pious pleased themselves and were not displeased with others in this difference.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/john-burges.html">John Burges</a></span><span class="wk"><span class="lbl">Work:</span> <cite>An Answer Rejoined to that much Applauded Pamphlet of a Nameless Author, bearing this Title</cite>, … (London, Matthewes, 1631), Preface, p. 2</span></figcaption>

</figure><figure class="quote" id="q-bc55678204" data-kw="">
<blockquote><p>There is a political end of the Sabbath, viz. The refreshment and recreative breathing of the outward man, a relaxation of the body from the pains and toil of the week; and therefore the Sabbath is called a rest. It is said of God Himself that on the seventh day He rested and was refreshed, Ex. 31:17. And how much more does poor man stand in need of rest and refreshment? Death indeed fairly unpins our tabernacle of clay, folds it up and lays it in the grave, but too much labour tears it down; man’s body is taken down by death, is thrown down by too much toil, therefore the wearisome labours of the week must be allayed by the rest of the Sabbath. The very name of a Sabbath signifies nothing but rest, strongly to argue, that that holy day was appointed for mans relaxation from the hurries of the world, and the sweats of the week. The Sabbath is a rest to the body and a revival to the soul, the body’s ease, and the soul’s enjoyment; the outward man on the Sabbath recovers strength, and the inward man receives Christ: Our exhausted spirits on God’s holy day are sweetly recruited, and our importunate souls are rarely answered, they then prey upon a Christ offered in the Gospel. Plato observes that the gods willing to recrui• mankind over-toiled with labour, in pity have appointed festival days for their ease and relaxation. Thus that heathen philosopher gives in his verdict to this particular; Indeed God’s blessed Sabbath shores up a piece of clay, and it builds up a piece of eternity, the precious and the immortal soul. The Sabbath is the body’s friend, and the soul’s fosterer; the body’s rest-time, and the soul’s term-time.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/john-wells.html">John Wells</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Practical Sabbatarian</cite>, … (London, 1668) Wells was an English puritan. | ch. 23, ‘We must not only meditate on the God of the Sabbath, but on the Sabbath of God, in the morning of his holy day’, pp. 193-94</span></figcaption>

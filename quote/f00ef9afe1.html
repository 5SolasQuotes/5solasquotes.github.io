<main class="wrap"><figure class="quote" id="q-f00ef9afe1" data-kw="">
<blockquote><p>Still, however, the will of God is not at variance with itself. It undergoes no change. He makes no pretence of not willing what He wills, but while in Himself the will is one and undivided, to us it appears manifold, because, from the feebleness of our intellect, we cannot comprehend how, though after a different manner, He wills and wills not the very same thing.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/john-calvin.html">John Calvin</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Institutes of the Christian Religion</cite>, 1.18.3</span></figcaption>

</figure><figure class="quote" id="q-2f386bf031" data-kw="">
<blockquote><p>Thus then the morality of our actions must not be measured by any decree concerning the futurition of events, but by some other rule, in which must concur God’s will and appointment, setting bounds unto us and designing our duty, and discovering what is well-pleasing and acceptable to God, honest and laudable in itself, and profitable and comfortable to us in the issue; and thus we have the Word of God for our direction and have his laws and testimonies to be our rule: Dt. 29:29; Isa. 8:20; Dt. 30:10-12; Dt. 5:29; Ps. 147:19; Rom, 12:2; 1 Thess. 4:2; 1 Pet. 4:2, etc. and we may take notice of these three things as necessarily requisite and concurring in that which is a warrant unto and rule of our actions and petitions: 1. The good-pleasure and decree of God, not concerning what shall come to pass, but concerning the quality and moral goodness of human actions, and which does limit and set bounds to reasonable creatures and prescribes unto them their duty; and this is the fountain and first spring (yea and by many judicious and sober divines is judged to be the supreme adequate and first rule) of moral rectitude. Hence we may conceive that God’s laws in Scripture are called ‘decrees,’ ‘statutes’ and ‘ordinances’. 2. From this decree and appointment, does (to our apprehension) flow divine approbation, complacency and delight in what is thus appointed to be our work and duty: hence that appointment is called the good, acceptable and perfect will of God, Rom. 12:2, and our actions when conform[ed] to that rule, are said to be well-pleasing in his sight, Heb. 13:2; yea the Lord does not only declare his love of his complacency, and delight in these when they are performed, but also He is said to will and desire (though not according to the Jesuitical and Arminian gloss)¹ those works while He is speaking to the rebellious and disobedient who have slighted his laws and casten all his statutes behind their backs: Eze. 18:23, 32; 33:11; Hos. 6:6; 1 Sam. 15:22; Isa. 61:8; Mt. 9:13; 2 Pet. 3:9, etc. ¹ Arminians, Socinians and Jesuits from thence would collect a frustratable and inefficacious will and desire in God, but this phrase does only import God’s serious approbation of the works of righteousness and detestation of the contrary. 3. There must be an intimation and promulgation of this decree and appointment, and a declaration of those things that would be well pleasing, and acceptable to God.</p></blockquote>

Reformed Books Online</a></div>

<blockquote><p>XXIV. All these [previous] things are not therefore spoken that we should reject this distinction of the will of God into his antecedent and consequent will: For we know that among the decrees of God, some are before and some are after in order. But we deny that there are two decrees of God, between which man’s will steps in, as if man’s will came between the decree of creating man and the decree of condemning certain men. But we deny that the will of man does so come between the two decrees of God that the first, or antecedent decree, is broken off by the will of man and that God is compelled to absist from that end which He had propounded to Himselfe and which He did seriously intend: We deny also in the work of our election, the precise will of God to depend on the foreseeing of any power or action of man’s free-will, or the consequent will of God to be suspended on man’s will.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/pierre-du-moulin.html">Pierre Du Moulin</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Anatomy of Arminianism</cite>, ch. 5, ‘Of the Antecedent &amp; Consequent Will of God’ in The Anatomy of Arminianism… (London: Snodham, 1620), pp. 27-41, pp. 40-41</span></figcaption>

<blockquote><p>The will of God is one, since it is the very essence of God. Yet sometimes it is spoken of as many, as in the words of Ps. 110:2: ‘Great are the works of the Lord, sought out according to all His wills.’ Therefore sometimes the sign must be taken for the will… Some things are said of God in their strict sense; others by metaphor, as appears from what has been said before (q. 13, art. 3). When certain human passions are predicated of the Godhead metaphorically, this is done because of a likeness in the effect. Hence a thing that is in us a sign of some passion, is signified metaphorically in God under the name of that passion… In the same way, what is usually with us an expression of will, is sometimes metaphorically called will in God; just as when anyone lays down a precept, it is a sign that he wishes that precept obeyed. Hence a divine precept is sometimes called by metaphor the will of God, as in the words: ‘Thy will be done on earth, as it is in heaven’ (Matt 6:10)… Therefore in God there are distinguished will in its proper sense, and will as attributed to Him by metaphor. Will in its proper sense is called the will of good pleasure; and will metaphorically taken is the will of expression [signi], inasmuch as the sign itself of will is called will… Expressions [signa] of will are called divine wills, not as being signs that God wills anything; but because what in us is the usual expression [signa] of our will, is called the divine will in God. Thus punishment is not a sign that there is anger in God; but it is called anger in Him, from the fact that it is an expression [signum] of anger in ourselves.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/thomas-aquinas.html">Thomas Aquinas</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Summa, pt. 1</cite>, q. 19, art. 11</span></figcaption>

<div class="actions"><button class="copy" data-copy="“The will of God is one, since it is the very essence of God. Yet sometimes it is spoken of as many, as in the words of Ps. 110:2: ‘Great are the works of the Lord, sought out according to all His wills.’ Therefore sometimes the sign must be taken for the will… Some things are said of God in their strict sense; others by metaphor, as appears from what has been said before (q. 13, art. 3). When certain human passions are predicated of the Godhead metaphorically, this is done because of a likeness in the effect. Hence a thing that is in us a sign of some passion, is signified metaphorically in God under the name of that passion… In the same way, what is usually with us an expression of will, is sometimes metaphorically called will in God; just as when anyone lays down a precept, it is a sign that he wishes that precept obeyed. Hence a divine precept is sometimes called by metaphor the will of God, as in the words: ‘Thy will be done on earth, as it is in heaven’ (Matt 6:10)… Therefore in God there are distinguished will in its proper sense, and will as attributed to Him by metaphor. Will in its proper sense is called the will of good pleasure; and will metaphorically taken is the will of expression [signi], inasmuch as the sign itself of will is called will… Expressions [signa] of will are called divine wills, not as being signs that God wills anything; but because what in us is the usual expression [signa] of our will, is called the divine will in God. Thus punishment is not a sign that there is anger in God; but it is called anger in Him, from the fact that it is an expression [signum] of anger in ourselves.”

— Thomas Aquinas, Summa, pt. 1, q. 19, art. 11">Copy</button><a class="share" href="https://x.com/intent/post?text=%E2%80%9CThe+will+of+God+is+one%2C+since+it+is+the+very+essence+of+God.+Yet+sometimes+it+is+spoken+of+as+many%2C+as+in+the+words+of+Ps.+110%3A2%3A+%E2%80%98Great+are+the+works+of+the+Lord%2C+sought+out+according+to+all+His+wills.%E2%80%99+Therefore+sometimes+the+sign+must+be+taken+for+the+will%E2%80%A6+Some+things+are+said+of+God+in+their+strict+sense%3B+others+by+metaphor%2C+as+appears+from+what+has+been+said+before+%28q.+13%2C+art.+3%29.+When+certain+human+passions+are+predicated+of+the+Godhead+metaphorically%2C+this+is+done+because+of+a+likeness+in+the+effect.+Hence+a+thing+that+is+in+us+a+sign+of+some+passion%2C+is+signified+metaphorically+in+God+under+the+name+of+that+passion%E2%80%A6+In+the+same+way%2C+what+is+usually+with+us+an+expression+of+will%2C+is+sometimes+metaphorically+called+will+in+God%3B+just+as+when+anyone+lays+down+a+precept%2C+it+is+a+sign+that+he+wishes+that+precept+obeyed.+Hence+a+divine+precept+is+sometimes+called+by+metaphor+the+will+of+God%2C+as+in+the+words%3A+%E2%80%98Thy+will+be+done+on+earth%2C+as+it+is+in+heaven%E2%80%99+%28Matt+6%3A10%29%E2%80%A6+Therefore+in+God+there+are+distinguished+will+in+its+proper+sense%2C+and+will+as+attributed+to+Him+by+metaphor.+Will+in+its+proper+sense+is+called+the+will+of+good+pleasure%3B+and+will+metaphorically+taken+is+the+will+of+expression+%5Bsigni%5D%2C+inasmuch+as+the+sign+itself+of+will+is+called+will%E2%80%A6+Expressions+%5Bsigna%5D+of+will+are+called+divine+wills%2C+not+as+being+signs+that+God+wills+anything%3B+but+because+what+in+us+is+the+usual+expression+%5Bsigna%5D+of+our+will%2C+is+called+the+divine+will+in+God.+Thus+punishment+is+not+a+sign+that+there+is+anger+in+God%3B+but+it+is+called+anger+in+Him%2C+from+the+fact+that+it+is+an+expression+%5Bsignum%5D+of+anger+in+ourselves.%E2%80%9D%0A%0A%E2%80%94+Thomas+Aquinas%2C+Summa%2C+pt.+1%2C+q.+19%2C+art.+11&amp;url=https%3A%2F%2F5so

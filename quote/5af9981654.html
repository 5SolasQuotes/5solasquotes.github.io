<blockquote><p>But the head of this horrid abomination was, when he raised a sign by which it was not only obscured and perverted, but altogether obliterated and abolished, vanished away and disappeared from the memory of man—namely, when, with most pestilential error, he blinded almost the whole world into the belief that the Mass was a sacrifice and oblation for obtaining the remission of sins.</p></blockquote>
<figcaption>— <a href="../authors/john-calvin.html">John Calvin</a>, <cite>Institutes of the Christian Religion</cite>, 4.18.1</figcaption>

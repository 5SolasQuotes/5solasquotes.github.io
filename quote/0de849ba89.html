<main class="wrap"><figure class="quote" id="q-0de849ba89" data-kw="">
<blockquote><p>So let the Prelate [John Maxwell] glory in his borrowed logic; he had it from Barclay [a Romanist]: ‘It is not in the power of the wife to repudiate her husband, though never so wicked. She is tied to him forever, and may not give to him a bill of divorcement, as by law the husband might give to her…’ Answer: …but a wife may divorce from her husband…</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/samuel-rutherford.html">Samuel Rutherford</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Lex Rex</cite>, ... (1644; Edinburgh: Ogle, 1843), pp. 69-70</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/civil-government-and-society/marriage-and-family.html">Marriage and Family</a></span></div>

</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-899ec16a4d" data-kw="">
<blockquote><p>Yet we must remember, that this restriction [against eating blood] was part of the old law. Wherefore, what Tertullian relates, that in his time it was unlawful among Christians to taste the blood of cattle, savours of superstition. For the apostles, in commanding the Gentiles to observe this rite, for a short time, did not intend to inject a scruple into their consciences, but only to prevent the liberty which was otherwise sacred, from proving an occasion of offense to the ignorant and the weak.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/john-calvin.html">John Calvin</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Commentary on Genesis</cite>, 9:4</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/civil-government-and-society/marriage-and-family.html">Marriage and Family</a></span></div>

</figure><figure class="quote" id="q-a5f5cc9242" data-kw="">
<blockquote><p>…to return to our main subject, that of matrimony, we see what kind of treaty there was about it, Gen. 34:6, 12, what the contract, Gen. 24:50-51, 57-58, what the solemnizing of it, Gen. 24:67, were in those early days. We read not of any formality in joining of man and woman. Mutual consent made marriage. ‘Wilt thou go with this man?’ And she said, ‘I will go.’ Then when she was come to his house, he took her, and she became his wife.</p></blockquote>

</figure><figure class="quote" id="q-27ea4671ad" data-kw="">
<blockquote><p>Fifthly, such as are wicked and ungodly vows… And thus two evils meet together, the one whereof is to vow, the other to perform such a vow; and therefore such vows are not to be kept. This serveth to set before the eyes of many their folly, who never consider what the vow is which they have taken upon them to observe, but if they can say, I have a vow to do this or that, they grow obstinate and settled in evil, and will by no means be removed, yea and think they are bound by virtue of their vow to do it, and are discharged of all fault and offence when they have done it: whereas that which is evil to vow, is much worse to perform; and therefore they must repent of their rash vow, and not proceed to the accomplishment of it, for that were to add one transgression to another, as it were drunkenness unto thirst, and to plunge themselves into endless destruction both of soul and body. This is the case of many young men and women who have entangled themselves in such vows, by promising marriage either to other without the consent of parents; they often pretend great scruple of conscience, which cannot be tied by such evil vows, the vow was evil, and therefore the way is not to go forward, but to crave pardon of God for that evil, as here it is prescribed in this Chapter [Num. 30].</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/william-attersoll.html">William Attersoll</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Commentary on Numbers</cite>, (London, 1618), p. 1,159</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/civil-government-and-society/marriage-and-family.html">Marriage and Family</a></span></div>

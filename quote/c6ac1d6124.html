<blockquote><p>This question is rightly instituted to counter the unjust calumny of the Romanists, who defame us everywhere with the name of Solifidians, because we assert that we are justified by faith alone, as if we reject all dispositions for justification and all other preparatory works for justification… …we say that the said preparatory works are given [by God], that is, are prerequisite for justification, before God either forgives sins or accepts to life. For God does not justify any sinner living in the Church, but a sinner who believes with catholic Faith, fears punishment, hopes for pardon, loves and desires beatitude, loves God graciously inviting to salvation, acknowledges and condemns sins, is truly sorry for offending God, is weary of his former life, and pants for a new one. A sinner, unless he has been prepared and disposed by these previous arts, does not seek a physician, nor does he run and flee to Christ the Justifier and Savior, nor does he desire to flee… we demonstrate from the scriptures that this array of preparatory works is necessary.” – 32-33 Collinges, John – The Spouse’s Hidden Glory &amp; Faithful Leaning upon her Well-Beloved, wherein is laid down the soul’s glory in Christ and the way by which the soul comes to Christ, delivered in two lecture sermons… (London: 1646) 81 pp. This is excellent. Ambrose, Isaac – The Doctrine &amp; Directions but more especially the Practice &amp; Behavior of a Man in the Act of the New Birth… (London: 1650) Hooker, Thomas – multiple works Grebenitz, Elias – Disputation 3, ‘On Regeneration in General’ in ‘Theological Treatise on Regeneration in Three Disputations [&amp; on Conversion &amp; Preparation]’ trans. AI (Becman, 1671), pp. 60-87 Grebenitz (1627-1689) was a German reformed professor of logic, metaphysics and theology at Frankfurt. Le Blanc de Beaulieu, Louis – Theological Theses Published at Various Times in the Academy of Sedan 3rd ed. tr. by AI by Colloquia Scholastica (1675; London, 1683) Latin Whether sufficient grace for conversion and avoiding sins is given to all men? 291-97 … Necessity of grace for fallen nature for salvific good and true piety: Roman doctrine 847 . pt. 2, Protestants’ doctrine compared with Roman 859 Whether man, in a state of sin, can prepare and dispose himself for grace by his natural powers alone 867 . pt. 2, Roman school 879 . pt. 3, Protestant and Roman opinions are compared 891-906 Le Blanc (1614-1675) was a reformed professor of theology at Sedan. . 1700’s de Moor, Bernard – Continuous Commentary on John Marck’s Didactic-Elenctic Compendium of Christian Theology Buy (1761-1772), ch. 2, Scripture Theological Disputation on Eph. 5:14, “Wherefore he saith, Awake thou that sleepest, and arise from the dead, and Christ shall give thee light.</p></blockquote>

<blockquote><p>[Arminian Error:] 7. That man’s conversion is properly nothing but the act of believing the promise of grace. This restraint of our conversion unto so narrow a compass as first to bring it from the habit [inward power] of faith to the act of believing, and then to appropriate it to that act without so much as once mentioning any other graces: this narrow conceit touching our conversion is that which has filled the writings of many learned about this point with much darkness and confusion. They so speak and write of conversion as if it began in that one and only action of man’s will consenting to the promise of mercy in Christ. But this is without all ground. To convert is not only to believe, but to repent, to love God and our neighbor, to abstain from every evil way, to practice all duties of piety and goodness: these acts are as proper and immediate parts of true conversion, as faith. Nor does the Scripture so much as intimate any such limitation, as to appropriate our conversion to the act of faith: nay, tis manifest that the Scriptures when they speak of man’s turning unto God, do join repentance and other godly acts together with faith: as appears by that solemn invitation of men unto God, ‘Repent and believe the Gospel,’ so often used in the New Testament.</p></blockquote>

<blockquote><p>However, such [good] works, through a new supervening sin, are said to be mortified, when they are impeded from their own proper effect and operation. For as a living thing through death loses the operation of life, so things are said by analogy to be mortified, when they are impeded from their own proper effect or operation. But the effect of good works which emanate from faith and grace, by divine ordinance and pact, is to lead to eternal life. This effect, however, is cut off when a grave sin intervenes, by which, as I might say, the said good works are mortified; and they are deprived of their own proper effect and operation of leading to life, so much so that the force of these, while the guilt of that sin lasts, is suspended. We say, however, that these very works, mortified by grave sin, are revived by penitence and recover their former vigor and virtue of leading to life.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/samuel-ward.html">Samuel Ward</a></span><span class="wk"><span class="lbl">Work:</span> <cite>‘Good Works Mortified by Sin are Revived by Penitence’ in Theological Determinations in Works of Samuel Ward</cite>, … ed. Seth Ward (d. 1643; Gallibrand, 1658), pp. 189-94, p. 192</span></figcaption>

<blockquote><p>But the persons to whom we refer seem to think that nothing is done towards the salvation of men, but at the moment of their conversion, and that every good effect must be at once manifest. Perhaps some one may infer that we believe in a gradual regeneration, and that special grace differs from common, only in degree; but such an inference would be utterly false, for there can be no medium between life and death; but we do profess to believe and maintain, that there is a gradual preparation, by common grace, for regeneration, which may be going on from childhood to mature age; and we believe that, as no mortal can tell the precise moment, when the soul is vivified, and as the principle of spiritual life in its commencement is often very feeble, so it is an undoubted truth, that the developement of the new life in the soul may be, and often is, very slow; and not unfrequently that which is called conversion is nothing else but a more sensible and vigorous exercise of a principle which has long existed. Just as the seed under ground may have life, and may be struggling to come forth to open day; but it may meet with various obstructions and unfavourable circumstances which retard its growth. At length, however, it makes its way through the earth, and expands its leaves to the light and the air, and begins to drink in from every source that nutriment which it needs. No one supposes, however, that the moment of its appearing above ground is the commencement of its life; but this mistake is often made in the analogous case of the regeneration of the soul. The first clear and lively exercise of faith and repentance is made the date of the origin of spiritual life, whereas it existed in a feeble state, and put forth obscure acts long before.</p></blockquote>

<div class="meta"><span class="t"><a href="../topics/regeneration/nature-of-regeneration.html">Nature of Regeneration</a></span><span class="t"><a href="../topics/repentance-and-conversion/nature-of-repentance.html">Nature of Repentance</a></span></div>
<div class="actions"><button class="copy" data-copy="“But the persons to whom we refer seem to think that nothing is done towards the salvation of men, but at the moment of their conversion, and that every good effect must be at once manifest. Perhaps some one may infer that we believe in a gradual regeneration, and that special grace differs from common, only in degree; but such an inference would be utterly false, for there can be no medium between life and death; but we do profess to believe and maintain, that there is a gradual preparation, by common grace, for regeneration, which may be going on from childhood to mature age; and we believe that, as no mortal can tell the precise moment, when the soul is vivified, and as the principle of spiritual life in its commencement is often very feeble, so it is an undoubted truth, that the developement of the new life in the soul may be, and often is, very slow; and not unfrequently that which is called conversion is nothing else but a more sensible and vigorous exercise of a principle which has long existed. Just as the seed under ground may have life, and may be struggling to come forth to open day; but it may meet with various obstructions and unfavourable circumstances which retard its growth. At length, however, it makes its way through the earth, and expands its leaves to the light and the air, and begins to drink in from every source that nutriment which it needs. No one supposes, however, that the moment of its appearing above ground is the commencement of its life; but this mistake is often made in the analogous case of the regeneration of the soul. The first clear and lively exercise of faith and repentance is made the date of the origin of spiritual life, whereas it existed in a feeble state, and put forth obscure acts long before.”

— A.A. Alexander, Thoughts on Religious Experience (Philadelphia: Presbyterian Board of Publication, 1841), pp. 16-17">Copy</button><a class="share" href="https://x.com/intent/post?text=%E2%80%9CBut+the+persons+to+whom+we+refer+seem+to+think+that+nothing+is+done+towards+the+salvation+of+men%2C+but+at+the+moment+of+their+conversion%2C+and+that+every+good+effect+must+be+at+once+manifest.+Perhaps+some+one+may+infer+that+we+believe+in+a+gradual+regeneration%2C+and+that+special+grace+differs+from+common%2C+only+in+degree%3B+but+such+an+inference+would+be+utterly+false%2C+for+there+can+be+no+medium+between+life+and+death%3B+but+we+do+profess+to+believe+and+maintain%2C+that+there+is+a+gradual+preparation%2C+by+common+grace%2C+for+regeneration%2C+which+may+be+going+on+from+childhood+to+mature+age%3B+and+we+believe+that%2C+as+no+mortal+can+tell+the+precise+moment%2C+when+the+soul+is+vivified%2C+and+as+the+principle+of+spiritual+life+in+its+commencement+is+often+very+feeble%2C+so+it+is+an+undoubted+truth%2C+that+the+developement+of+the+new+life+in+the+soul+may+be%2C+and+often+is%2C+very+slow%3B+and+not+unfrequently+that+which+is+called+conversion+is+nothing+else+but+a+more+sensible+and+vigorous+exercise+of+a+principle+which+has+long+existed.+Just+as+the+seed+under+ground+may+have+life%2C+and+may+be+struggling+to+come+forth+to+open+day%3B+but+it+may+meet+with+various+obstructions+and+unfavourable+circumstances+which+retard+its+growth.+At+length%2C+however%2C+it+makes+its+way+through+the+earth%2C+and+expands+its+leaves+to+the+light+and+the+air%2C+and+begins+to+drink+in+from+every+source+that+nutriment+which+it+needs.+No+one+supposes%2C+however%2C+that+the+moment+of+its+appearing+above+ground+is+the+commencement+of+its+life%3B+but+this+mistake+is+often+made+in+the+analogous+case+of+the+regeneration+of+the+soul.+The+first+clear+and+lively+exercise+of+faith+and+repentance+is+made+the+date+of+the+origin+of+spiritual+life%2C+whereas+it+existed+in+a+feeble+state%2C+and+put+forth+obscure+acts+long+before.%E2%80%9D%0A%0A%E2%80%94+A.A.+Alexander%2C+Thoughts+on+Religious+Experience+%28Philadelphia%3A+Presbyterian+Board+of+Publication%2C+1841%29%2C+pp.+16-17&amp;url=https%3A%2F%2F5solasquotes.github.io%2Fquote%2F220fd0f8ce.html&amp;via=5Solas" target="_blank" rel="noopener">Share on X</a><a class="perma" href="../quote/220fd0f8ce.html">Permalink</a><a class="src" href="https://reformedbooksonline.com/topics/regeneration#:~:text=But%20the%20persons%20to%20whom%20we,put%20forth%20obscure%20acts%20long%20before&amp;text=But%20the%20persons%20to%20whom%20we%20refer%20seem&amp;text=state%2C%20and%20put%20forth%20obscure%20acts%20long%20before" rel="noopener" target="_blank">Read it online · Reformed Books Online</a></div>

<blockquote><p>1. Regeneration is the work of the one and only God. 2. Hence man in the first moment of his regeneration is merely passive. 3. Nor are there any internal preparations in a spiritually dead man for the same.</p></blockquote>

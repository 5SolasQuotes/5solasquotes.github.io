<blockquote><p>3. That the ordinance of superiors cannot make the ceremonies [which were claimed to be indifferent, to be] necessary, I have proven in the first part of this Dispute. This is given for one of the chief marks of the man of sin [in 1 Tim. 4:1-5], ‘That which is indifferent, he by his laws and prohibitions maketh to be sin;’ (Morney, Mister. of Iniq., in the Conclusion) and shall they who profess to take part with Christ against Antichrist [such as the prelates] do no less than this? It will be replyed that the ceremonies are not thought necessary in themselves, nor non-conformity unlawful in itself, but only in respect of the Church’s ordinance. Just so the Papists profess that the omission of their rites and observances is not a sin in itself, but only in respect of contemning the Church’s customs and commandments. How comes it then that they [the prelates] are not ashamed to pretend such a necessity for the stumbling blocks of those offending ceremonies among us, as Papists pretend for the like among them?</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/george-gillespie.html">George Gillespie</a></span><span class="wk"><span class="lbl">Work:</span> <cite>English Popish Ceremonies</cite>, (1637), pt. 2, ch. 9, pp. 46-7</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/worship/ceremonies-and-things-indifferent.html">Ceremonies and Things Indifferent</a></span></div>

</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-dcbe19221d" data-kw="">
<blockquote><p>I shall therefore a little further explain this distinction and then show you the soundness of it, and then the exceeding usefulness and necessity of it, both in this and many other controversies: 1. For the title I choose rather to denominate it from the object than the act, because the diversity is in the object, but none in the species of the act naturally considered: Debitum and natural being are two distinct things; but ‘to will’ one and ‘to will’ the other is all one as to the nature of willing. God does as properly will duty as He wills natural beings. Yet if I must denominate it from the acts, I would distinguish between God’s Directive Will and his Legislative. For to call it voluntas praecepti is too narrow a term, for the precept is but one part of God’s Law and determines only of one sort of right, that is, of the dueness of obediential actions or forbearance of forbidden actions. But there is also a debitum praemii et beneficii–pure vel absolute–dati, et debitum poenae [debt of reward and benefit, whether purely or absolutely given, and a debt of punishment], which the rest of the Law, Testament or Covenant of God determines of, which must all be here included as well as the former. In sum, the Law determines: 1. What shall be due from us; 2. and what shall be due to us, and on what terms. I call it therefore, The will of God de eventu, et de debito [of event, and of debt], as such. I say ‘as such,’ for else they are coincident: For God’s will de rerum natura, vel existentia determines de debito quatenus evenit esse debitum [determines the nature or existence of things, and debt so far as debt comes about], but not qua debitum [as debt]. And his will de debito determines of the dueness of some events, not as eventual [as to the event], but as due. Or to avoid all ambiguity: call it God’s will de ente mere naturali [concerning merely natural being] and his will de debito morali [concerning moral debt], or Legislative or Governing. 2. And for the nature of the distinction, understand further that there are two acts which I call God’s will de debito: The first is that immanent act of his will by which He strictly and properly wills what shall be due. This also is twofold: 1. Productive, or instituting dueness; 2. and approbative, or taking complacency in duty. The former of these I principally intend, but exclude not the latter. God does eternally will every due, but it is not therefore eternally or from eternity due. For He wills from eternity (to speak vulgarly) only that this shall be due at such a time and by such a means. I say by such means: For though God’s will produce all dueness, yet only by means does He produce it. That means is the revelation of his will. 2. This revelation of God’s will de debito we call his Law. This therefore is the second thing which I call God’s will de debito, or his Legislative will, that is, the Law as it is signum voluntatis divinae [a sign of the divine will], that is, formally as a law. This I call God’s will de debito, only metonymically, as it is the sign of his will before expressed. If the proper will of God were separated from this, it would then be no producer of dueness or right at all, for it would be no law, no signum; it would lose its nature as abrogated laws do.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/richard-baxter.html">Richard Baxter</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Universal Redemption of Mankind by the Lord Jesus Christ Stated &amp; Cleared</cite>, … (London: Salusbury, 1694), ch. 2, pp. 28-32</span></figcaption>

<blockquote><p>…every action takes its species from its object; while human action, which is called moral, takes its species from the object, in relation to the principle of human actions, which is the reason. Wherefore if the object of an action includes something in accord with the order of reason, it will be a good action according to its species; for instance, to give alms to a person in want. On the other hand, if it includes something repugnant to the order of reason, it will be an evil act according to its species; for instance, to steal, which is to appropriate what belongs to another. But it may happen that the object of an action does not include something pertaining to the order of reason; for instance, to pick up a straw from the ground, to walk in the fields, and the like: and such actions are indifferent according to their species.</p></blockquote>

<blockquote><p>…one can imagine a tree that grows 10 branches, with 10 twigs on each branch, and 10 fruits on each twig, but one can also walk outside and observe trees with branches hacked away, twigs broken off, widely different numbers of twigs on different branches, fruit plucked by birds and squirrels, and so forth.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/john-tors.html">John Tors</a></span><span class="wk"><span class="lbl">Work:</span> <cite>‘Does Differential Reproduction of Manuscripts Undermine the Majority Text Theory? A Challenge Refuted’</cite>, (2023) | James Snapp, Jr. raised the challenge to the majority text theory that not all copies from an original are reproduced in uniform number:</span></figcaption>

<blockquote><p>1. Some brethren of the Classical [presbytrian] way may possibly object [to joining an accommodated church-association such as Baxter’s], that joining with us in this way may seem to signify a dislike of the resolutions of the [Westminster?] Assembly, or a consent to the undoing of what they have done. Answer: There is no ground for this scruple: For we do not disclaim or condemn the judgment or way of any party, by taking up at present with what all are agreed in. A present forbearance of the use of full Classical government is no rejecting it. We did in this county seek for authority from the parliament many years ago for the establishing of the presbyterian government, and all our endeavors were frustrated. And many brethren that make this objection do preach themselves without the exercise of the presbyterian government. For because they live not in London, Lancashire, Shropshire, where that government was authorized by parliament, therefore they will not use it: And so some of them for many years have forborne all administration of the Lord’s Supper, and others administer it without any exercise of discipline: And may not we as lawfully exercise so much as all are agreed in, as they may forbear all? Objection: But why may not you as well set up the Classical government punctually, as do what you do? Answer: We are not all of one mind; and those of us that are for the Classical government do not think those parts of it which we here omit and forbear to be of so great necessity or moment as for the present use of it to disjoin and divide from all our brethren of a different judgment. We take ourselves bound to do much for the unity and peace of the churches: Besides, being many of us at a loss in several controverted points of discipline, we think the amicable union and association of brethren where all things may be frequently and plainly debated will be the likeliest way to satisfy and rectify us in those controverted points. In the meantime, you may join with us in going so far as we can go unanimously, without disclaiming, yea or forbearing your own way. For I think the constant exercise of the presbyterian government may well consist with our Propositions and associations: part of it being indeed above, but not contrary to our Agreement, and therefore may be done by those that will overgo us, without dividing from us. … And whereas it may be objected that we do allow a single minister to name offenders and to charge it on the people’s consciences to avoid communion with them, which only a presbytery is authorized to do, I answer: 1. We desire each church may have a presbytery, and then we are agreed. 2. The brethren of the Classical Way do allow a single pastor to pronounce the sentence of excommunication itself, so be it he have the advice and consent of a presbytery. And to avoid all possibility of breach upon this ground, we have agreed to take the advice of the Association of ministers before we require the people to avoid communion with any. Only we resolve not to do this all on the same reasons and principles: One may think it of flat necessity in a regimental way: Another may think it of necessity in a way of union: Another may think it convenient to avoid miscarriages and rash censures in so weighty a case: Another may think it fit to be yielded to for peace with those brethren that judge it necessary, seeing it is unquestionably lawful to take advice in cases of such weight. And why must we needs agree in our reasons as long as we agree in our practice? 3. It is only a preaching power that we exercise, applying Christ’s doctrine to particular persons and cases: supposing the evidence of the fact and guilt to be beyond question, we do but apply the word to the person hereupon… Have not pastors a charge of particular souls, but only of people in general? Is not the Old Testament and New full of examples to warrant us in this? Take heed of crying down duty, under pretense of questioning authority. … I will say no more to any objections that may possibly be made by my brethren of the Classical Way, because I find by experience it is needless (if others be as those with us), for they are the forwardest men to our union and Association of any others (here). The Lord grant the like spirit of unity and condescension in other parts. … Brethren! Would you have unity and peace or no? If you would, must not you condescend as far as may be to others, as well as others to you? Let it be the property of the Pope to accept of no peace with any Church that will not wholly come up to his will and way. And you know that this is the great point which you must yield in or you cannot have union with the contrary minded… Is it not fit that bounds for order and division should be set?… And is it not done in most places as well as you can desire? And where it is not… get them amended as soon as you can. In the mean time, affect not confusion: turn not all order upside down: God is not the God of confusion, but of order, which He would have established in all the Churches. 5. In the mean time, I pray you observe, that you may join with us in this without contradicting or deserting your own principles… The public welfare and unity of the churches is to be preferred before the pleasing, yea or edifying of any single member. What confusion will follow the plucking up of Christ’s and the magistrate’s and the churches’ bounds?</p></blockquote>

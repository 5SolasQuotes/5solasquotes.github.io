<blockquote><p>Herein now we disprove the papistical doctrine which allows of private masses and teaches that the priest offers up the body and blood of our Lord for the standers by; and that by the mass he applies the merit of redemption unto them that with devotion come to that sacrifice. For as there is no one word of the Lord extant that commands the priests to sacrifice or privately to apply the supper for others, or that promises anything unto them that stand by and look on it (for He says, “Do this; eat ye and drink ye all in the remembrance of me;” He says not, ‘Look upon the priests only while they be eating and drinking for you’)… … Concerning the place where the supper is to be celebrated, I find no contention has been amongst the most ancient ministers of the Church. It is read how that our Lord Jesus used the hall of a certain private man’s house. And also the apostle Paul both preached and brake bread at Troas in a certain dining-place (Acts 20)… At this present there seems no place to be more worthy or more commodious to celebrate the holy supper in, than that which is appointed for doctrine and prayer. For so have we learned of St. Paul, 1 Cor. ch. 11. Howbeit, if tyrannical power will not suffer us to have a church, what shall let us but that we may reverently celebrate the supper in honest private houses?</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/heinrich-bullinger.html">Heinrich Bullinger</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Decades</cite>, (Parker Society, 1852), 5th Decade, Sermon 9, ‘Of the Lord’s Holy Supper’, pp. 417-8</span></figcaption>

<blockquote><p>It appertains to the policy of the church to appoint the times when the sacraments shall be ministered. Baptism may be ministered whensoever the word is preached; but we think it more expedient that it be ministered upon the Sunday, or upon the [mid-week] day of prayers, only after the sermon; partly to remove this gross error by the which many deceived think that children are damned if they die without baptism; and partly to make the people assist the administration of that sacrament with greater reverence than they do. For we do see the people begin already to wax weary by reason of the frequent repetition of those promises.</p></blockquote>

<blockquote><p>Can these men [dissenters]… prove in this sense we maintain a private Communion? These terms were never known to fit our church doctrine, till those first moniters and the heirs of their scruples… The Gentle Admonition [to the Parliament, 1572, by Cartwright and the presbyterians] that was the first bate for this idle debate, then rawly entered, since over hotly followed (but vainly, and unfruitfully God He knows, and we deplore) makes this an occasion of their lamentable separation. Ye should first prove (say they) that the private communion is agreable to the Word of God. And is it not reason they should first prove that we enjoin a private communion, before they enjoin us to prove what they now reprove?</p></blockquote>

</figure><figure class="quote" id="q-d6f009ea0d" data-kw="">
<blockquote><p>His second objection is that the Lord’s Supper is not given to the sick at their homes. I wish that they [the Lutherans] had gone before us in this with a purer example. Had they been careful to adapt their practice to the genuine rule of Christ, we would willingly have followed them. But since nothing is less accordant with the doctrine of our heavenly Master than that the bread should be carried about in procession like cakes in a fair, and then that one individual should receive in private and eat apart, disregarding the law of communicating, pious and learned men were from the very first much averse to private dispensations of the Supper. Nothing, therefore, can be more absurd than Westphal’s calumny, that owing to the crafty counsel of Satan, poor souls are deprived of consolation. For we [the Genevan Church] carefully recall to the remembrance of the sick the pledge of life which was once deposited with us, that they may thence confirm their faith, and borrow weapons for the spiritual combat. In short, we herein profit so far that the Supper received in the public assembly, according to the ordinance of Christ, supports them with present consolation not less effectually than if they were to enjoy it privately without communion.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/john-calvin.html">John Calvin</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Tracts Relating to the Reformation</cite>, Second Defense of the… Sacraments, in Answer to the Calumnies of Joachim Westphal (1556) in Tracts, containing Treatises on the Sacraments… vol. 2 tr. Henry Beveridge (Edinburgh: Calvin Translation Society, 1849), pp. 320-21</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/the-sacraments-in-general/minister-and-intention.html">Minister and Intention</a></span></div>

</figure><figure class="quote" id="q-1d651cbde2" data-kw="">
<blockquote><p>Peter clearly insinuates that all who have received the Holy Ghost are to be baptized, Acts 8:47, as Philip, Acts 8:37, and that if the eunuch believed, he might be baptized. So that faith, to speak properly, does give us right to the seals; and to speak accurately, a visible profession of faith does not give a man right to the seals of grace, but only it does notify and declare to the Church that the man has right to the seals because he believes, and that the Church may lawfully give to him the seals, and that profession is a condition required in the right receivers of the seals in an ecclesiastical way; But faith gives the right to these seals, and because the faith of the believer goes with the believer, when he goes to another visible congregation than his own, that faith giveth him right to the seals in all places and in all congregations: for faith gives right to receive Christ sacramentally, not in one congregation only, but in all, and a visible profession does, as a condition notify this faith, and Church-right in all congregations.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/samuel-rutherford.html">Samuel Rutherford</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Due Right of Presbyteries, ‘Acts 15, A Pattern of a Juridicial Synod’</cite>, … (1644), ch. 4, section 5, pp. 195-6</span></figcaption>

<div class="actions"><button class="copy" data-copy="“Peter clearly insinuates that all who have received the Holy Ghost are to be baptized, Acts 8:47, as Philip, Acts 8:37, and that if the eunuch believed, he might be baptized. So that faith, to speak properly, does give us right to the seals; and to speak accurately, a visible profession of faith does not give a man right to the seals of grace, but only it does notify and declare to the Church that the man has right to the seals because he believes, and that the Church may lawfully give to him the seals, and that profession is a condition required in the right receivers of the seals in an ecclesiastical way; But faith gives the right to these seals, and because the faith of the believer goes with the believer, when he goes to another visible congregation than his own, that faith giveth him right to the seals in all places and in all congregations: for faith gives right to receive Christ sacramentally, not in one congregation only, but in all, and a visible profession does, as a condition notify this faith, and Church-right in all congregations.”

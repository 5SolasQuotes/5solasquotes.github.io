<main class="wrap"><figure class="quote" id="q-cfbdfea50a" data-kw="">
<blockquote><p>VI. The negative act includes two: both preterition, by which in the election of some to glory as well as to grace, he neglected and slighted others (which is evident from the event of election); and negative desertion, by which he left them in the corrupt mass and in their misery. However this is so to be understood: (that the are not excepted from the laws of common providence, but remain subject to them; nor are they immediately deprived of all God’s favor [Latin: gratia, or grace], but only of the saving and a vivifying (which is the fruit of election)</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/francis-turretin.html">Francis Turretin</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Institutes of Elenctic Theology</cite>, 1:381</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/effectual-calling/common-grace.html">Common Grace</a></span></div>

</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-cd5dc750db" data-kw="">
<blockquote><p>It may be observed, in passing, that there is a double sense in which we may speak of Christ’s purchase; First, Strictly and properly, when we regard Him as purchasing men; and secondly, More improperly, when we consider Him as purchasing benefits for men. This last view [the second], as we have hinted, is rather figurative and metaphorical than real and literal; for the idea of his purchasing benefits from the Father for mankind, must ever be understood in consistency with the Father’s sovereignty, and his pre-existing love to the children of men. The Father is not induced or persuaded to bestow benefits on men by a price paid to Him; but being antecedently full of compassion to all…</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/robert-candlish.html">Robert Candlish</a></span><span class="wk"><span class="lbl">Work:</span> <cite>An Inquiry into the Completeness &amp; Extent of the Atonement, with Especial Reference to the Universal Offer of the Gospel &amp; the Universal Obligation to Believe</cite>, (1845), pp. 4-6</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/effectual-calling/common-grace.html">Common Grace</a></span></div>

</figure><figure class="quote" id="q-6516df25c5" data-kw="">
<blockquote><p>IV. 3rdly, The suretiship and satisfaction of Christ, have also been an occasion of much good, even to the reprobate. For it is owing to the death of Christ that the Gospel is preached to every creature, that gross idolatry is abolished in many parts of the world, that wicked impiety is much restrained by the discipline of the word of God, that they obtain at times many and excellent though not saving gifts of the Holy Spirit, that ‘they have escaped the pollutions of the world through the knowledge of the Lord and Savior Jesus Christ, 2 Pet. 2:20. And who can in short enumerate all those things which they enjoy, not through accident only, and beside the intention of God, and of Christ, but by the appointment of God? Not indeed with a design and purpose of saving them according to the testament; but from a view to make known His long-suffering towards the vessels of wrath, that is, those who are to perish, who dwell among those who are to be saved. For nothing falls out by accident, with respect to the intention of God; every thing being according to His determinate counsel.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/herman-witsius.html">Herman Witsius</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Economy of the Covenants between God and Man: Comprehending a Complete Body of Divinity</cite>, (1677), vol. 1, bk. 2, ch. 9, section 4, pp. 259-60</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/effectual-calling/common-grace.html">Common Grace</a></span></div>

</figure><figure class="quote" id="q-e8d6383555" data-kw="">
<blockquote><p>8. The application [of redemption] plainly has the same latitude as redemption itself, i.e., redemption applies to all those and only to those for whom it was obtained by the intention of Christ and the Father. Yet because of them the same temporal benefits of Christ overflow also to others. 9. As for the intention of application, it is rightly said that Christ made satisfaction only for those whom He saved, though in regard to the sufficiency in the mediation of Christ it may also rightly be said that Christ made satisfaction for each and all. Because these counsels of God are hidden to us, it is the part of charity to judge well of every one, although we may not say of all collectively that Christ equally pleads the cause of each before God.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/william-ames.html">William Ames</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Marrow of Theology 3rd</cite>, tr. John D. Eusden (1623; Baker, 1997), bk. 1, ch. 24, ‘The Application of Christ’, p. 150</span></figcaption>

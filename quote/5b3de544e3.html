<blockquote><p>It must also be kept in mind that for the Aristotelian-Thomistic tradition, human beings and their operations are, like other natural substances and processes, to be analyzed in terms of formal, material, efficient and final causes, which together form an irreducible unity. In the case of a thought (such as the thought that snow is white) the neural processes associated with the relevant phantasms [sensory experience or memory] might be regarded as the material cause of a single event of which the intellective activity is the formal cause. To be sure, the analysis of human thought and action in terms of the Aristotelian four-causal explanatory framework is a more complicated business than that suggests. But it is only if that framework is rejected that to acknowledge that there are immaterial aspects of thought can seem to open up what Dillard calls “an apparently unbridgeable gulf between thought and behavior.” And to reject it without argument would simply be to beg the question against the Aristotelian-Thomistic view.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/edward-feser.html">Edward Feser</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Immortal Souls: a Treatise on Human Nature</cite>, (Editiones Scholasticae, 2024), pt. 3, ‘What is a human being?’, ch. 8, ‘Against Materialism’; p. 328</span></figcaption>

<blockquote><p>A further point to make about cause and effect is that whatever is in some effect must in some way or other be in the cause, even if not always in the same way. For a cause cannot give what it does not have to give. This is sometimes called the principle of proportionate causality. Suppose, for example, that I give you $20. The effect in this case is your having the $20, and I am the cause of this effect. But the only way I can cause that effect is if I have the $20 to give you in the first place. Now there are several ways in which I might have it. I might have a $20 bill in my wallet, or two $10 bills, or four $5 bills. Or I may have no money in my wallet, but do have $20 in my bank account and write you a check. Or I may not even have that, but I am able to borrow the $20 from someone else, or work for it, so that I can go on to give it to you. Or perhaps I have a friend who has a key to the U.S. Treasury printing press and I get him to run off an official $20 bill for me to give to you. Or to take an even more farfetched scenario, suppose that in order to guarantee that you get that $20 I somehow convince Congress to pass a law which permits me personally to manufacture my own $20 bills. These are all various ways in which I might in theory give you $20. But if none of these ways are available to me, then I can’t do it. Again, these are different ways in which the cause may have what is in the effect. When I myself have a $20 bill ready to hand and I cause you to have it, what is in the effect was in the cause formally, to use some traditional jargon. That is to say, I myself was an instance of the form or pattern of having a $20 bill, and I caused you to become another instance of that form or pattern. When I don’t have the $20 bill ready to hand but I do have at least $20 credit in my bank account, you might say that what was in the effect was in that case in the cause virtually. For though I didn’t actually have the $20 on hand, I did have the power to get hold of it. And when I get Congress to grant me the power to manufacture $20 bills, you might say (once again to use some traditional jargon) that I had the $20 eminently. Because in that case, I not only have the power to acquire already existing $20 bills, but the more “eminent” power of causing them to exist in the first place. When it is said, then, that what is in an effect must in some way be in its cause, what is meant is that it must be in the cause at least “virtually” or “eminently” even if not “formally”. … These things [namely all things] thereby exist in that purely actual cause eminently and virtually even if not formally. For the cause of things is not itself a cat or a tree (and cannot be, given that it is immaterial), but it can cause a cat or a tree, or anything else that might exist.</p></blockquote>

<blockquote><p>The soul, by which each was man, was not educed from the potency of the body, but was created from nothing by God [in Gen. 2], infused into the body and personally united with it. For God breathed into the body the spirit of life, that is, the soul, Gen. 2:7, and thus man was made a living soul, in the same place and 1 Cor. 15:45. Therefore the soul of man is of a spiritual nature, as it is everywhere called ‘spirit’, Ps. 31:5; Eccl. 12:7; Zech. 12:1; Lk. 23:46; Acts 7:59. It is immortal, which cannot be killed, Mt. 10:28, but after death remains surviving, Mt. 22:32; Phil. 1:23; Lk. 16:22-23ff. Endowed also with the faculty of understanding and willing.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/johann-heinrich-alting.html">Johann Heinrich Alting</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Scriptural Theology of Heidelberg</cite>, vol. 1 (d. 1644; Amsterdam: Jansson, 1646), Locus 5, ‘On Creation’, trans. AI at Confessionally Reformed Theology</span></figcaption>

<div class="actions"><button class="copy" data-copy="“The soul, by which each was man, was not educed from the potency of the body, but was created from nothing by God [in Gen. 2], infused into the body and personally united with it. For God breathed into the body the spirit of life, that is, the soul, Gen. 2:7, and thus man was made a living soul, in the same place and 1 Cor. 15:45. Therefore the soul of man is of a spiritual nature, as it is everywhere called ‘spirit’, Ps. 31:5; Eccl. 12:7; Zech. 12:1; Lk. 23:46; Acts 7:59. It is immortal, which cannot be killed, Mt. 10:28, but after death remains surviving, Mt. 22:32; Phil. 1:23; Lk. 16:22-23ff. Endowed also with the faculty of understanding and willing.”

<main class="wrap"><figure class="quote" id="q-9e85108631" data-kw="">
<blockquote><p>The terms of Communion in the Reformed Presbyterian Church are certainly more comprehensive than those in force in any other denomination. It is necessary that all who become members acknowledge the inspiration and infallibility of the Old and New Testaments; the agreeableness of the Confession of Faith and Catechisms (Larger and Shorter) with the Word of God; the divine right of Presbyterianism; the perpetual obligation of the National Covenant and Solemn League and Covenant; practical dissent from all national constitutions that ignore the Lord Jesus Christ as King of nations, and the duty of adorning the doctrine of God our Saviour by a life of godliness. No Church in the world has a larger creed for membership. […]

The popular cry now is for a brief creed, and the avowed object of this cry is that larger numbers may be led into the membership of the Church. The more comprehensive and intensive the creed the fewer must the members of the Church be; the fewer and less explicit the articles of the creed the more numerous will be the members. A creed with many articles is said to be a stumbling-block in the way of those without, to burden the Church and diminish her influence. It is true, doubtless, that a large creed is the occasion of much unpopularity meanwhile, but the adoption of the policy implied in the objection would abolish all creeds, however brief and narrow. […] To remove any truth from the creed of a Church is to strip her of part of the armour with which she is to gird herself for the duty required of her by her great Commander-in-chief. It is to limit and narrow the area on which she stands, and so bind her arms – her powers and influence. “The faith which was once for all delivered unto the saints” is one body; it is a perfect unity; and the Church that attempts to mutilate that perfect body incurs a dread responsibility. Her offence against the Lord is aggravated when this deed is perpetuated under the profession of breadth and enlargement. When the policies of ecclesiastical procedure have the peacock feathers of liberality and charity, with which they have been adorned, plucked off, they stand revealed as vultures which, with unrestrained appetite, would devour the whole body of revealed truth, and reduce the Christian and the Church to a condition of lamentable leanness – the mere skeletons of Christians and Churches.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/james-kerr.html">James Kerr</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Reformed Presbyterianism: its special claims</cite>, (Belfast, 1895), pp 5-6.</span></figcaption>

</figure><figure class="quote" id="q-754559c311" data-kw="">
<blockquote><p>Vers. 23. For I have received of the Lord that which also I delivered unto you, that the Lord Jesus, the same night in which he was betrayed, took bread,

24. And when he had given thanks, he brake it, and said, Take, eat, this is my body which is broken for you: this do in remembrance of me.

That he may correct these errors; First he sets down the institution of the Sacrament, to vers. 27. and then he exhorts them to, and teaches them the lawful use of this Sacrament, to the end. As for the institution of the Supper, he shews that the Lord Jesus being about to suffer, by way of Testament, set his seal to the Covenant of Grace, which by his mediation he entered into between God and the Church: Whereby the glorious memory of his death might be celebrated in the world, till his second coming, and might be delivered to the faithful, and being delivered, it might judicially confirm a right to his person, and the benefits of his sufferings, and a living virtue flowing from his death, resurrection, and exaltation, to the sanctification and salvation of Believers, and that by the symbols of this holy Banquet, and holy Communion with God, and amongst themselves.

To which end Christ sitting at Table with his Disciples, after the eating of the Paschal Lamb; First, Took Bread, and sanctified it by giving of thanks, brake, and gave it to his Disciples, commanding them to take and eat; further, he declared the Bread received and eaten, to be his body represented after a Sacramental manner, that it being given for our Redemption, and after a judicial manner, applied to us; and lastly, he commanded that his Disciples, or all the faithful should imitate this his action in the Church, in remembrance of him, who had paid the price of Redemption by the sufferings of his body.

Vers. 25. After the same manner also he took the Cup, when he had supped, saying, This Cup is the New Testament in my blood: this do you, as oft as ye drink it, in remembrance of me.

That which concerns the other part of the Supper follows: In the same Supper, (viz. after the Paschal Supper) when the Bread was distributed, Christ took the Cup with Wine, sanctified by the giving of thanks, gave it to the Disciples to drink; further concerning the Cup he declared, That it being taken and drunk, was that new Covenant of Grace, between God and the Church, established Sacramentally by his blood, i. e. As it is ratified on God’s part that gives, so it is confirmed on the believers part that receives, and judicially applied and sealed: Lastly, He commanded that his Disciples should frequently imitate him in this action, in remembrance of him, who had paid the price of Redemption for the Church by the shedding of his blood.

Vers. 26. For as often as ye eat this Bread, and drink this Cup, ye do shew the Lord’s death till he come.

And that we might acknowledge, that of two Elements, Bread and Wine, one Supper (frequently to be celebrated in the Church) ought to be made; the Apostle would have perpetuated in the Church, a public commemoration of our Lord’s death, by the often reiteration of this Sacrament, and that because Christ would not be present in his body with the Church, before the last judgement, by this Sacrament he would that the memorial of the Churches redemption, by his death, might be preserved and celebrated, until he come out of Heaven in the last day.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/david-dickson.html">David Dickson</a></span><span class="wk"><span class="lbl">Work:</span> <cite>An exposition of all St. Paul’s epistles together with an explanation of those other epistles of the apostles St. James, Peter, John &amp; Jude: wherein the sense of every chapter and verse is analytically unfolded and the text enlightened</cite>, (London: Francis Eglesfield, 1659), pp 58-59.</span></figcaption>

+for+our+Redemption%2C+and+after+a+judicial+manner%2C+applied+to+us%3B+and+lastly%2C+he+commanded+that+his+Disciples%2C+or+all+the+faithful+should+imitate+this+his+action+in+the+Church%2C+in+remembrance+of+him%2C+who+had+paid+the+price+of+Redemption+by+the+sufferings+of+his+body.%0A%0AVers.+25.+After+the+same+manner+also+he+took+the+Cup%2C+when+he+had+supped%2C+saying%2C+This+Cup+is+the+New+Testament+in+my+blood%3A+this+do+you%2C+as+oft+as+ye+drink+it%2C+in+remembrance+of+me.%0A%0AThat+which+concerns+the+other+part+of+the+Supper+follows%3A+In+the+same+Supper%2C+%28viz.+after+the+Paschal+Supper%29+when+the+Bread+was+distributed%2C+Christ+took+the+Cup+with+Wine%2C+sanctified+by+the+giving+of+thanks%2C+gave+it+to+the+Disciples+to+drink%3B+further+concerning+the+Cup+he+declared%2C+That+it+being+taken+and+drunk%2C+was+that+new+Covenant+of+Grace%2C+between+God+and+the+Church%2C+established+Sacramentally+by+his+blood%2C+i.+e.+As+it+is+ratified+on+God%E2%80%99s+part+that+gives%2C+so+it+is+confirmed+on+the+believers+part+that+receives%2C+and+judicially+applied+and+sealed%3A+Lastly%2C+He+commanded+that+his+Disciples+should+frequently+imitate+him+in+this+action%2C+in+remembrance+of+him%2C+who+had+paid+the+price+of+Redemption+for+the+Church+by+the+shedding+of+his+blood.%0A%0AVers.+26.+For+as+often+as+ye+eat+this+Bread%2C+and+drink+this+Cup%2C+ye+do+shew+the+Lord%E2%80%99s+death+till+he+come.%0A%0AAnd+that+we+might+acknowledge%2C+that+of+two+Elements%2C+Bread+and+Wine%2C+one+Supper+%28frequently+to+be+celebrated+in+the+Church%29+ought+to+be+made%3B+the+Apostle+would+have+perpetuated+in+the+Church%2C+a+public+commemoration+of+our+Lord%E2%80%99s+death%2C+by+the+often+reiteration+of+this+Sacrament%2C+and+that+because+Christ+would+not+be+present+in+his+body+with+the+Church%2C+before+the+last+judgement%2C+by+this+Sacrament+he+would+that+the+memorial+of+the+Churches+redemption%2C+by+his+death%2C+might+be+preserved+and+celebrated%2C+until+he+come+out+of+Heaven+in+the+last+day.%E2%80%9D%0A%0A%E2%80%94+David+Dickson%2C+An+exposition+of+all+St.+Paul%E2%80%99s+epistles+together+with+an+explanation+of+those+other+epistles+of+the+apostles+St.+James%2C+Peter%2C+John+%26+Jude%3A+wherein+the+sense+of+every+chapter+and+verse+is+analytically+unfolded+and+the+text+enlightened%2C+%28London%3A+Francis+Eglesfield%2C+1659%29%2C+pp+58-59.&amp;url=https%3A%2F%2F5solasquotes.github.io%2Fquote%2F754559c311.html&amp;via=5Solas" target="_blank" rel="noopener">Share on X</a><a class="perma" href="../quote/754559c311.html">Permalink</a><a class="src" href="https://reformedcovenanter.wordpress.com/2019/12/16/david-dickson-on-the-lords-supper-as-the-banquet-of-the-covenant-of-grace/" rel="noopener" target="_blank">Read it online · Reformed Covenanter</a></div>

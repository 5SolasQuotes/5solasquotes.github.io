<main class="wrap"><figure class="quote" id="q-98e8182564" data-kw="">
<blockquote><p>Bishop Andrewes will have the feast of Easter drawn from that place 1 Cor. 5:8, where he says there is not only a warrant, but an order for the keeping of it, and he will have it out of doubt that this feast is of apostolical institution, because after the times of the apostles, when there was a contention about the manner of keeping Easter, it was agreed upon by all that it should be kept, and when the one side alleged for them St. John [for keeping it on Passover], and the other St. Peter [for keeping it on the Lord’s Day], it was acknowledged by both that the feast was apostolical. I answer, the testimony of Socrates [a church historian in the early Church] deserves more credit than the Bishop’s naked conclusion. ‘I am of opinion,’ says Socrates (bk. 5, ch. 22), ‘that as many other things crept in of custom in sundry places, so the feast of Easter to have prevailed among all people, of a certain private custom and observation.’ But whereas B. Lindsay in defense of B. Andrewes, replies that Socrates propounds this for his own opinion only, I answer that Socrates in that chapter proves his opinion from the very same ground, which B. Andrewes wrests, to prove that this Feast is Apostolical. For while as in that hot controversy about the keeping of Easter, they of the East alleged John the apostle for their author, and they of the west alleged Peter and Paul for themselves; Yet (says Socrates), there is none that can show in writing any testimony of theirs, for confirmation and proof of their custom. And hereby I do gather that the celebration of the Feast of Easter came up more of custom than by any law or canon.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/george-gillespie.html">George Gillespie</a></span><span class="wk"><span class="lbl">Work:</span> <cite>English Popish Ceremonies</cite>, (1637), pt. 3, ch. 6, p. 98</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/worship/holy-days-and-church-calendar.html">Holy Days and Church Calendar</a></span></div>

</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-e8fa779d47" data-kw="">
<blockquote><p>Those days which are consecrated to Christ in the Church, if they are received only for reason of a remembrance of the saving graces of Christ to us, and are retained, in order to make us more certain concerning these matters and actions, and if they are observed without any superstition of the day, in the way that they were celebrated when they were first instituted, not by the Papists, but by the Church), then, let them be retained for the honor of Christ, for as long as it seems good to the pious Church, because they are matters straightaway indifferent, and means. Although, I think and judge that even these days among us (who cannot now doubt concerning the trustworthiness of the Evangelical history; nor do we, by the grace of God, walk amongst the heathens), these days, I say, are to be abolished. For, every day, by the preaching of the gospel, Christ is born, circumcised, dies, and resurrects for us, Heb. 13:8.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/lambert-daneau.html">Lambert Daneau</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Ad tomum I. et II. controversiarum Roberti Bellarmini responsio</cite>, (Joannes le Preux, 1598), pp. 1519–20. The latin was cited by George Gillespie, A Dispute Against the English Popish Ceremonies (Naphtali Press, 2013), p. 50 and Balduin, de Cas. Consc., lib. 2, cap. 12, cas. 1. Trans. Charles Johnson</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/worship/holy-days-and-church-calendar.html">Holy Days and Church Calendar</a></span></div>

</figure><figure class="quote" id="q-6851cdc0bb" data-kw="">
<blockquote><p>But to celebrate solemnly the day of a man’s birth, it has been a custom of all nations: and in my judgment, it is not done amiss, so that there be used a godly modesty. Surely it is a notable gift that we may be reckoned among the number of God’s creatures. And who doubts, but that it is well done, to give thanks unto God for it, and in thanksgiving to testify the joyfulness of mind by an outward token of some modest banket? The use of honest pleasures is such, as they have always godliness joined with them.</p></blockquote>

<blockquote><p>5. It is one question whether a day may be set apart for commemoration of some mystery of our religion, by men, and as a part of God’s worship. And another whether such days may be set apart for worshipping God merely as a piece of good order and policy. The first the Papists are for: the other most of our prelatists own, though some of them differ little from the Papists in this matter. 6. The question is not whether a day may be set apart occasionally for religious worship: that is, when any special providence gives occasion for fasting and humiliation or for thanksgiving and rejoicing: seeing in that case there is a special providential call to that solemn work: but whether a day may be set apart to be observed constantly and as it recurs every year. The one makes a difference between that day of the year and other days and exempts it altogether and constantly from civil use, the other does not so; the one makes a difference among days, the other makes the difference only in the works or dispensations of God which occasion such work on that day and not on another. All that the Church does in the one case, is, whereas the present providence calls to the work, as it is expressed, Isa. 22:12. The Church only determines the circumstance of time, which must be done: in the other, the Church determines more than a necessary circumstance, viz. that there shall be such a solemnity, which the Lord has not enjoined; neither do we doubt, but that the Church may appoint recurrent days for solemn worship, to wit, while the present providence that calls to such work continues. Weekly or monthly fasts may be appointed under a lasting calamity or threatening.</p></blockquote>

<blockquote><p>[Col. 2] verse. 17, What should we do with the shadow, when we have the body? another, verse 20, Why should we be subject to human ordinances, since through Christ we are dead to them, and have nothing ado with them? Now, by the same reasons are our holy-days to be condemned as taking away Christian liberty; and so that which the apostle says, does militate as well against them as against any other holy-days: for whereas it might be thought that the apostle does not condemn all holy-days, because both he permits others to observe days, Rom. 14:5, and he himself also did observe one of the Jewish feasts, Acts 18:21. It is easily answered that our holy-days have no warrant from these places except our opposites will say that they esteem their festival days holier than other days, and that they observe the Jewish festivities, neither of which they do aknowledge; and if they did, yet they must consider that which the apostle either said or did hereanent, is to be expounded and understood of bearing with the weak Jews, whom he permitted to esteeme one day above another, and for whose cause he did in his own practice, thus far apply himself to their infirmity at [???] time, when they could not possibly be as yet fully and throughly instructed concerning Christian liberty and the abrogation of the Ceremonial Law, because the Gospel was as yet not fully propagated: and when the Mosaical rites were like a dead man not yet buried, as Augustine’s simile runs. So that all this can make nothing for holy-days after the full promulgation of the Gospel, and after that the Jewish ceremonies are not only dead, but also buried, and so deadly to be used by us. Hence it is, that the apostle will not bear with the observation days in Christian Churches, who have known God as he speaks. … The apostle comports with the observation of days in the weak Jews, who understood not the fullness of the Christian liberty, especially, since those days having had the honor to be once appointed by God Himself, were to be honorably buried: but the same apostle reproves the Galatians who had attained to this liberty, and had once left off the observation of days. … Now for confutation of this forged exposition of those places of the apostle… The [Romanist] Rhemists affirm that the apostle condemns only Jewish days [in Col. 2 &amp; Gal. 4], but not Christian days, and that we do falsely interpret his words against their holy-days. [Thomas] Cartwright answers them that if Paul condemned the observing of feasts which God Himself instituted, then much more does He condemn the observation of feasts of man’s devising… for he [Paul] condemnes that observation of days which had crept into the Church of Galatia, which was not Jewish nor typical, seeing the Galatians, believing that Christ was already come, could not keep them as figures of his coming, as the Jews did, but rather as memorials that He was already come, says Cartwright.</p></blockquote>

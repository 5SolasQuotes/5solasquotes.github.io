<blockquote><p>Divine Apostolical Institutions (that we may draw to our purpose) were again of two sorts: First, variable, or temporary, which were such injunctions as were prescribed, either for some special ends, as that law for abstaining from blood, and things strangled, Acts 15:1, for avoiding offence to the Jews, or to some special nations, or persons, as agreeable to the customs of those places and times, as that of women being vailed in the congregations, and some other the like. Secondly, invariable and perpetual: such as concerned the whole Church: This distinction we received from that learned and Professor [John Prideaux, d. 1650];</p></blockquote>

<blockquote><p>[Margin Note:] The uncovering of the head not like kneeling We uncover our heads, say they, when we receive the elements, why may we not also kneel? I answer: First, the uncovering of the head is a gesture of reverence only, and that only among some nations, but not of adoration. The Jews, Turks and Mahometans pray with their heads covered. The Grecians and Romans of old, howbeit they walked in public with uncovered heads, except in rain, great heat or mourning, yet in the service of their gods, they had their heads covered. The Europeans this day uncover their heads when they are praying. Kneeling is a gesture of adoration among all nations, either in civil or religious use. Augustine says: ‘Honorat emnis qui adorat, no autem adorat omnes quid onorat;’ ‘Every one that does adore, does honor, but not every one that honors, adores.’ Contra Serm. Arian., ch. 23 I will not kneel to every one to whom I uncover my head civilly. Everyone that stands with his head uncovered in presence of the king is not adoring, as he is who is presenting his petition to the king upon his knee in their sight. A provincial synod holden at London (anno 1603) ordained the head to be uncovered when their service is read in the Church, yet I think they would not have enjoined kneeling. We [the Scots] hear the canonical scripture read [in the administration of the Lord’s Supper] with uncovered heads, but yet we kneel not. The words of Christ, which He uttered at the institution are still and often uttered; that same voice sounds through all the tables of the world; his actions, which were divine and holy, are reiterat[ed]. In Gratian’s decree (De consecrat. dist. 1, ch. 68) we have a superstitious direction of Pope Anastasius, that when the Gospel is read in the Church, those that are present shall not sit, but stand, venerabiliter curvi, bowing reverently, hearken and adore. Wherefore more at the hearing of the Gospel than the [reading of the] Epistle[s], which is also Evangelical? Yet you see, howbeit that standing with bowing be more than to have the head uncovered, it was but veneration. And, whereas he says, Et fideliter adorent, the gloss has, id est venerentur, because the word ‘adoring’ is taken there in a large sense, as ye may see [in] sundry places above cited, not for that which is in a strict sense called adoration. Adoration in strict sense is kneeling or prostration. Whereas Matthew says, ch. 8, of the leprous man, that he worshipped Christ, or adored Christ, as the Latin translation has according to the original, Mk. 1:40, He kneeled down to Him, and Luke 5:12, that he fell in his face. Suchlike, where it is said of the Cananitish woman, Mt. 15:25, that she worshipped, or adored Him: et adoravit eum, Mk. 7:25, it is said that she fell at his feet. The Greek word [Greek], signifies to fall down like a dog o••whelp at the feet of another, as our Lord. Further, our heads are not other way uncovered in the act of receiving than in the rest of the time of the celebration when we are not near the elements. And thirdly, the uncovering of our head is compatible with the variety of actions in time of celebration: praying, singing, the words of the institution, and chapters read, but adoration directed, as they pretend to God, cannot be without presenting our petitions and thanks to God, which requires a several part of the action by itself.</p></blockquote>

<blockquote><p>Massey… argues at article length for an apparently unique view of v. 15 which assumes the hair ‘as’ a ‘corresponding counterpart’ to a covering (veil), is in the public, church context. For him the long hair and veil function together;” – Fentiman ‘Gender Versus Marital Concerns: Does 1 Corinthians 11:2-16 Address the Issues of Male/Female or Husband/Wife?’ Tyndale Bulletin 64 (2), pp. 239-56 Massey argues that the passage addresses the husband / wife relationship. The view that it addresses all the adult women is recommended; see Fentiman, Head-coverings are Not Perpetual, pp. 203-5. ‘Veiling among Men in Roman Corinth: 1 Corinthians 11:4 &amp; the Potential Problem of East Meeting West’ Pre Journal of Biblical Literature, vol. 137, no. 2 (Summer, 2018), pp. 501-17 Brown (below) had previously argued against Massey and another scholar on whether the key greek syntax in 1 Cor. 11:4 could mean, or primarily does mean, that it was a shame for men to have long hair while praying (Brown), or that it was a shame for a man to pray with a material head-covering on (Massey). This article of Massey follows that of Brown but never appears to address Brown’s article directly. This work of Massey “is based on the foundational work of Oster, Gill, and Finney.</p></blockquote>

<blockquote><p>How few be they in our times, who by observing this distance do declare that they believe the Church to be God’s house, how many that come in without preparing themselves at first by devotion and prayer? How many who clap on their hats when God is speaking to them by his Word, I mean in the time when the very text is reading? Nay the servant who will be uncovered before this master in his own house, will many times be covered before him in God’s house; all which bewrays that many men do either take the Church not to be ‘my house’ [Mt. 21:13], that is, God’s; or (which is worse) God’s house not to be so good as their own.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/walter-balcanquhall.html">Walter Balcanquhall</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Honor of Christian Churches &amp; the Necessity of Frequenting of Divine Service &amp; Public Prayers in them. Delivered in a Sermon at White-Hall before the King’s most excellent Majesty</cite>, … (London, 1633), p. 14 Balcanquhall (1586?–1645) was a Scottish clergyman who became a staunch royalist and supporter of the church policy of Charles I of England (which was fundamentally Anglican), Balcanquhall being the author the defense of the King’s actions against the Scots in the 2nd Reformation, His Majestie’s Large Declaration concerning the Late Tumults in Scotland (1639).</span></figcaption>

s+Large+Declaration+concerning+the+Late+Tumults+in+Scotland+%281639%29.&amp;url=https%3A%2F%2F5solasquotes.github.io%2Fquote%2Fc9e225d1ed.html&amp;via=5Solas" target="_blank" rel="noopener">Share on X</a><a class="perma" href="../quote/c9e225d1ed.html">Permalink</a><a class="src" href="https://reformedbooksonline.com/the-post-reformation-scottish-church-on-head-coverings-in-public-worship/#:~:text=How%20few%20be%20they%20in%20our,be%20so%20good%20as%20their%20own&amp;text=How%20few%20be%20they%20in%20our%20times%2C%20who&amp;text=not%20to%20be%20so%20good%20as%20their%20own" rel="noopener" target="_blank">Read it online · Reformed Books Online</a></div>
</figure><figure class="quote" id="q-76183e5ca3" data-kw="">
<blockquote><p>The worship of God, must be expressed with seemly, meet, and convenient gesture. The word translated ‘worship’, signifies doing of reverence with bowing of the body and knee: and therefore it is not an indifferent thing, but necessary, to use convenient gesture in God’s worship, that thereby the grace and humility of the heart may be expressed. The angels that stand before the throne of God, have two wings to cover their feet, and two to cover their faces: thereby testifying their reverence to God’s majesty; In this point also many come short: for as the common complaint is, the manner of many is to lie snorting and sleeping under men’s elbows at sermons, and in the time of prayer to sit unreverently with their heads covered. These things ought not to be: for God is Lord of body and soul, and ought to be worshipped with both.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/william-perkins.html">William Perkins</a></span><span class="wk"><span class="lbl">Work:</span> <cite>A Godly &amp; Learned Exposition or Commentary upon the Three First Chapters of the Revelation</cite>, … (d. 1602; London, 1606), ch. 3, p. 187</span></figcaption>

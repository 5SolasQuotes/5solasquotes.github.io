<blockquote><p>The divine Nature, is especially in perpetual operation by three attributes, the which do manifest the operation of God towards his creatures. These are his Wisdom, Will, and Omnipotency. The wisdom or knowledge of God, is that by the which God doth, not by certaine notions abstracted from the things themselves, but by his own essence: nor successively and by discourse of reason, but by one eternal and immutable act of understanding, distinctly and perfectly know himself, and all other things, though infinite, whether they have been or not. Mat. 11. 27. No man knoweth the son but the Father, nor the Father but the [note] Son, and he to whom the Son will reveale him. Heb. 4. 13. There is nothing created, which is not manifest in his sight: but all things are naked and open to his eyes, with whom we have to do, Psal. 147. 5. His wisdom is infinite.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/william-perkins.html">William Perkins</a></span><span class="wk"><span class="lbl">Work:</span> <cite>A Golden Chaine, or The Description of Theologie Containing the Order of the Causes of Salvation and Damnation</cite>, (1616)</span></figcaption>

</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-a47b51708f" data-kw="">
<blockquote><p>But to answer more clearly to the point in hand: We must first consider that mere or purely conditional decrees, or conditional volitions, agree not with the perfection of the divine nature. Volitiones pure conditionales sunt alienae a sapientia et prudentia Dei. (Ruiz, De Voluntate, disp. 20, §1) [Volitions that are purely conditional are incompatible with the wisdom and prudence of God.] Voluntas Dei conditionata dici potest, non quia actu feratur in objectum sub conditione, sed quia ex illa voluntate quae praesens est alia oriretur si conditio in objecto poneretur. (Vasqez, in 1st part, disp. 83, p. 511) [The will of God may be called conditional, not because it is actually directed toward its object under a condition, but because from that will which is presently existing another would arise if the condition were to be posited in the object.] The speeches therefore above-cited out of Scripture do not imply a conditional will in God suspended for any moment of time, and then post purificatam conditionem [after the condition has been fulfilled], becoming an absolute and effectual will (see Ruiz, De Scientia, disp. 71, §7), as the like conditional propositions do in us, who have neither knowledge whether the condition will be certainly performed or no, nor yet power in ourselves to work the condition whereupon the future act of our will was suspended. (Ruiz, De Voluntate, disp. 8, §7) But in God, who knows eternally what every man will do or not do, and who in Himself has an absolute power and freedom to make men do any good whereunto He makes promise of reward, and to leave them to their own defective freewill in doing those things for which He has threatened desertion and destruction, these conditional decrees or volitions must be far otherwise conceived: namely, not purely but mixedly conditionalia [conditionals], that is, grounded in some absolute revealed decree of God to the performance whereof He has tied Himself. For example; It is an absolute decree of the divine will published in the gospel that whosoever repents, believes, perseveres, shall be saved: From hence is derived that mixed conditional decree: If Cain, if Judas, if any other repent and believe, they shall be saved. Now such mixed conditional decrees carry no contradiction to the absolute decrees of election and non-election or reprobation. For who sees not that these two propositions may well stand together: I will that if Judas repent and believe he shall have remission and salvation; I will not give unto Judas the gift of repentance, of faith, and of eternal life? The former conditional proposition contains all which this author [Davenant is writing against] can truly collect from the testimonies alleged; and the latter does as truly infer that absolute reprobation for which we contend. For the absolute decree of God resolving not to give faith, repentance and eternal life unto Judas, is that which we understand by the word ‘reprobation’: and this is never abrogated by any conditional promise founded in any universal absolute decree of God.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/john-davenant.html">John Davenant</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Animadversions upon a Treatise entitled, God’s Love to Mankind</cite>, ... (Cambridge: Daniel, 1641), ‘Answer to his Five Reasons against Absolute Reprobation’, pp. 225-27</span></figcaption>

<blockquote><p>That God’s power is infinite, quia est ipsa infinita essentia [because He Himself is an infinite essence], is past doubt: But whether it may be called infinite as respecting outward objects, is disputed: And some prove the affirmative by asserting infinite objects, but Gregory of Rimini, n. 1, d. 43, q. 2. has reasons too subtle to be here recited: One of them Vasquez uses in 1. Tho. q. 25, d. 103, ch. 2 &amp; disp. 104. See the opinions of Gabriel, Scotus and Thomas on the rule of the name of divine omnipotentce.</p></blockquote>

</figure><figure class="quote" id="q-8f505995d2" data-kw="">
<blockquote><p>Most of the work being done in the proof [by Wolter] is in conclusions 2 and 68-69 respecting reality, and in conclusions 1-3 of the Proof of God. Much of the argument through the rest is patterned off of those. To illustrate conclusions 2, 16-17 and 24: If anything is caused and comes into existence in changing reality around us, it does not have its reason for existence in itself; otherwise, if it did, it would always exist. This may be likened to a metal link hanging solitary in the air: nothing in the link itself can explain or provide the power for it hanging in the air. Connect to the link several more links, or an infinite chain of them. Yet nothing in the infinite chain can justify its hanging in the air. Form the chain into a circle: it still, of its own nature, can’t cause itself to float in the air. Yet that nothing can come from nothing, in order to account for this phenomenon, is plain. Something is yet causing the chain to be suspended in the air and to exist. That something must be (1) able to cause (so as to hold the chain in the air, or in being), and (2) cause all other things needing a cause, that is all things besides itself (or else it would be a part of the chain). Yet as it cannot be one more link in the chain, needing a further cause, it must be uncaused. The very existence of a cause necessitates that a causer, which is uncaused, exists. In the scenario above, with a few explanations and adjustments, one may replace the relevant terms with: transient / permanent temporal / eternal changeable / unchangeable dependent / independent contingent / necessary relative / absolute composite / simple finite / infinite imperfect / perfect Hence if something transient, temporal, changeable, etc. exists, so must something permanent, eternal, unchangeable, etc.; in fact, something infinitely necessary, absolute and perfect must exist. But it is undeniable by one’s own experience that something transient or changeable, etc. exists, or may exist (which possibility will reach the same conclusion). This we call God. As all perfections must be in God, infinitely, as Wolter will show, God must be personal. All the terms of the above pairs are attributes (or properties) of being. As they are contradictory opposites with respect to being, all being may be divided amongst the opposite terms of each pair. Hence Wolter calls these pairs, “disjunctive attributes of being”. He will show that if being of the less perfect term of the pair exists, or can exist, some being of the opposite term must exist (conclusions 68-69).</p></blockquote>

<div class="actions"><button class="copy" data-copy="“Most of the work being done in the proof [by Wolter] is in conclusions 2 and 68-69 respecting reality, and in conclusions 1-3 of the Proof of God. Much of the argument through the rest is patterned off of those. To illustrate conclusions 2, 16-17 and 24: If anything is caused and comes into existence in changing reality around us, it does not have its reason for existence in itself; otherwise, if it did, it would always exist. This may be likened to a metal link hanging solitary in the air: nothing in the link itself can explain or provide the power for it hanging in the air. Connect to the link several more links, or an infinite chain of them. Yet nothing in the infinite chain can justify its hanging in the air. Form the chain into a circle: it still, of its own nature, can’t cause itself to float in the air. Yet that nothing can come from nothing, in order to account for this phenomenon, is plain. Something is yet causing the chain to be suspended in the air and to exist. That something must be (1) able to cause (so as to hold the chain in the air, or in being), and (2) cause all other things needing a cause, that is all things besides itself (or else it would be a part of the chain). Yet as it cannot be one more link in the chain, needing a further cause, it must be uncaused. The very existence of a cause necessitates that a causer, which is uncaused, exists. In the scenario above, with a few explanations and adjustments, one may replace the relevant terms with: transient / permanent temporal / eternal changeable / unchangeable dependent / independent contingent / necessary relative / absolute composite / simple finite / infinite imperfect / perfect Hence if something transient, temporal, changeable, etc. exists, so must something permanent, eternal, unchangeable, etc.; in fact, something infinitely necessary, absolute and perfect must exist. But it is undeniable by one’s own experience that something transient or changeable, etc. exists, or may exist (which possibility will reach the same conclusion). This we call God. As all perfections must be in God, infinitely, as Wolter will show, God must be personal. All the terms of the above pairs are attributes (or properties) of being. As they are contradictory opposites with respect to being, all being may be divided amongst the opposite terms of each pair. Hence Wolter calls these pairs, “disjunctive attributes of being”. He will show that if being of the less perfect term of the pair exists, or can exist, some being of the opposite term must exist (conclusions 68-69).”

— Travis Fentiman, ‘Allan Wolter’s Conclusions respecting Reality, Proving God’, Intro, ‘The Proof’">Copy</button><a class="share" href="https://x.com/intent/post?text=%E2%80%9CMost+of+the+work+being+done+in+the+proof+%5Bby+Wolter%5D+is+in+conclusions+2+and+68-69+respecting+reality%2C+and+in+conclusions+1-3+of+the+Proof+of+God.+Much+of+the+argument+through+the+rest+is+patterned+off+of+those.+To+illustrate+conclusions+2%2C+16-17+and+24%3A+If+anything+is+caused+and+comes+into+existence+in+changing+reality+around+us%2C+it+does+not+have+its+reason+for+existence+in+itself%3B+otherwise%2C+if+it+did%2C+it+would+always+exist.+This+may+be+likened+to+a+metal+link+hanging+solitary+in+the+air%3A+nothing+in+the+link+itself+can+explain+or+provide+the+power+for+it+hanging+in+the+air.+Connect+to+the+link+several+more+links%2C+or+an+infinite+chain+of+them.+Yet+nothing+in+the+infinite+chain+can+justify+its+hanging+in+the+air.+Form+the+chain+into+a+circle%3A+it+still%2C+of+its+own+nature%2C+can%E2%80%99t+cause+itself+to+float+in+the+air.+Yet+that+nothing+can+come+from+nothing%2C+in+order+to+account+for+this+phenomenon%2C+is+plain.+Something+is+yet+causing+the+chain+to+be+suspended+in+the+air+and+to+exist.+That+something+must+be+%281%29+able+to+cause+%28so+as+to+hold+the+chain+in+the+air%2C+or+in+being%29%2C+and+%282%29+cause+all+other+things+needing+a+cause%2C+that+is+all+things+besides+itself+%28or+else+it+would+be+a+part+of+the+chain%29.+Yet+as+it+cannot+be+one+more+link+in+the+chain%2C+needing+a+further+cause%2C+it+must+be+uncaused.+The+very+existence+of+a+cause+necessitates+that+a+causer%2C+which+is+uncaused%2C+exists.+In+the+scenario+above%2C+with+a+few+explanations+and+adjustments%2C+one+may+replace+the+relevant+terms+with%3A+transient+%2F+permanent+temporal+%2F+eternal+changeable+%2F+unchangeable+dependent+%2F+independent+contingent+%2F+necessary+relative+%2F+absolute+composite+%2F+simple+finite+%2F+infinite+imperfect+%2F+perfect+Hence+if+something+transient%2C+temporal%2C+changeable%2C+etc.+exists%2C+so+must+something+permanent%2C+eternal%2C+unchangeable%2C+etc.%3B+in+fact%2C+something+infinitely+necessary%2C+absolute+and+perfect+must+exist.+But+it+is+undeniable+by+one%E2%80%99s+own+experience+that+something+transient+or+changeable%2C+etc.+exists%2C+or+may+exist+%28which+possibility+will+reach+the+same+conclusion%29.+This+we+call+God.+As+all+perfections+must+be+in+God%2C+infinitely%2C+as+Wolter+will+show%2C+God+must+be+personal.+All+the+terms+of+the+above+pairs+are+attributes+%28or+properties%29+of+being.+As+they+are+contradictory+opposites+with+respect+to+being%2C+all+being+may+be+divided+amongst+the+opposite+terms+of+each+pair.+Hence+Wolter+calls+these+pairs%2C+%E2%80%9Cdisjunctive+attributes+of+being%E2%80%9D.+He+will+show+that+if+being+of+the+less+perfect+term+of+the+pair+exists%2C+or+can+exist%2C+some+being+of+the+opposite+term+must+exist+%28conclusions+68-69%29.%E2%80%9D%0A%0A%E2%80%94+Travis+Fentiman%2C+%E2%80%98Allan+Wolter%E2%80%99s+Conclusions+respecting+Reality%2C+Proving+God%E2%80%99%2C+Intro%2C+%E2%80%98The+Proof%E2%80%99&amp;url=https%3A%2F%2F5solasquotes.github.io%2Fquote%2F8f505995d2.html&amp;via=5Solas" target="_blank" rel="noopener">Share on X</a><a class="perma" href="../quote/8f505995d2.html">Permalink</a><a class="src" href="https://reformedbooksonline.com/on-gods-aseity-or-that-he-is-from-himself/#:~:text=Most%20of%20the%20work%20being%20done,opposite%20term%20must%20exist%20%28conclusions%2068%2D69&amp;text=Most%20of%20the%20work%20being%20done%20in%20the&amp;text=of%20the%20opposite%20term%20must%20exist%20%28conclusions%2068%2D69" rel="noopener" target="_blank">Read it online · Reformed Books Online</a></div>

<main class="wrap"><figure class="quote" id="q-f9b2e72a0b" data-kw="">
<blockquote><p>The proper act of religion is to bestow honor upon God and is called worship and adoration, Ex. 12:25, 26; Jn. 4:23. It must bear a certain good towards God, otherwise it would not be observance towards Him. No intrinsic good can be added to God, but honor is an outward good–a testimony to the virtue of another which adds to his glory or esteem. This is all a creature can do for God.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/william-ames.html">William Ames</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Marrow of Theology 3rd</cite>, ed. John Eusden (1639; Baker, 1997), bk. 2, ch. 4, ‘Religion’, section 23, p. 239 See also the chart on, pp. 72-73.</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/worship/nature-of-worship.html">Nature of Worship</a></span></div>

</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-15b44f5f14" data-kw="">
<blockquote><p>Q. What is the main scope of the First Commandment, ‘Thou shalt have no other Gods before Me?’ A. Here is required all that natural worship of God, whether the same be inward or outward, which is such as if there were no Law prescribed, yet if we well know his nature, we would undoubtedly perform it to Him. Q. Name some principal duties that are here required, with the contrary vices forbidden? A. Here is required faith in God, love to his Majesty, and hope in Him, hearing his voice, calling upon Him by prayer, and such like. … Q What is the main scope of the Second Commandment? A. The Second Commandement enjoyns all that worship of God which is by divine institution and ordinance, Mt. 28:20; Dt. 12:32. Q What are some of the particulars? A. The public and solemn preaching and hearing of his word, and prayer, celebration of sacraments, Church fellowship, election and ordaining of ministers and their whole ministration, with the due observation of Church discipline. … Q. What is the sum of the Third Commandement? A. The things here required are the due manner of observing and using all things that pertain to the natural or instituted worship of God, and all that name of God whereby He makes Himself known unto his people?</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/richard-mather.html">Richard Mather</a></span><span class="wk"><span class="lbl">Work:</span> <cite>A Catechisme</cite>, … (1650), ch. 32, ‘Of the life that beievers ought to live in the world, and of the Law of God’, pp. 114-16</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/worship/nature-of-worship.html">Nature of Worship</a></span></div>

</figure><figure class="quote" id="q-f64932c74e" data-kw="">
<blockquote><p>Thus there are certain devout Jews, so called, yet they stirred up persecution against Paul, Acts 13:50; 17:17. They were exceedingly affectionate and devout in their traditional worship they had of God; and so none [were] greater enemies to spiritual worship than they: So true is that of the apostle: ‘The wisdom of the flesh is enmity to God; and it is not, nor can be subject to Him,’ Rom. 8:7. [There is] No greater adversary in the world to the pure worship of God, than a man’s natural reason and carnal apprehensions, destitute of Scripture directions; all the false and superstitious worship which ever came into the Church (and she was scarce ever free) did flow from this fountain: a carnal and human judgment [about] what was fit and orderly, what was pleasing to God and what was displeasing. Austin observed this long ago; and certainly, the simplicity, and pure spiritual worship of God is very offensive and troublesome to carnal apprehensions. When therefore thou art to judge what is the best worship pleasing to God, and wherein He does most delight, do not consult with thy own methinks, or what custom and education has engaged thee to, but to what the Scripture informs therein.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/anthony-burgess.html">Anthony Burgess</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Spiritual Refining: or A Treatise of Grace and Assurance</cite>, … (London, 1652) | section 7, sermon 57</span></figcaption>

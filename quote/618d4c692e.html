<main class="wrap"><figure class="quote" id="q-618d4c692e" data-kw="">
<blockquote><p>Here you see how the waters of free grace rise higher and higher; an invitation is much, a promise of welcome is more; but the actual grants of mercy is most satisfying of all. Come on poor trembling soul, don’t be discouraged, stretch out the small weak arms of thy faith to that great and gracious Redeemer; open thy heart wide to receive Him, He will not refuse to come in; He has sealed thousands of pardons to as vile wretches as thyself; He never yet shut the door of mercy upon a willing, hungering soul.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/john-flavel.html">John Flavel</a></span><span class="wk"><span class="lbl">Work:</span> <cite>England’s Duty under the Present Gospel Liberty from Rev. 3</cite>, verse 20: wherein is opened the admirable condescension and patience of Christ in waiting upon trifling and obstinate sinners… (London: Wotton, 1689), sermon 7, doctrine 7, p. 244</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/effectual-calling/means-of-calling.html">Means of Calling</a></span></div>
<div class="actions"><button class="copy" data-copy="“Here you see how the waters of free grace rise higher and higher; an invitation is much, a promise of welcome is more; but the actual grants of mercy is most satisfying of all. Come on poor trembling soul, don’t be discouraged, stretch out the small weak arms of thy faith to that great and gracious Redeemer; open thy heart wide to receive Him, He will not refuse to come in; He has sealed thousands of pardons to as vile wretches as thyself; He never yet shut the door of mercy upon a willing, hungering soul.”

</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-611e1783bf" data-kw="">
<blockquote><p>6. The effects of this first [divine] work are these: (1) A hearty welcoming of Christ Jesus into the soul; they do not take up with comfort on this side [of] Christ; Men’s troubles are known by their satisfaction… But if we see the necessity of a Savior, receive Him into our hearts and believe in Him with all our hearts, desire and delight and all is carried after Christ, and after the refreshings of his grace and are satisfied with none but Christ, and our hearts pant for Him, as the hart pants after the water brooks, you ought to bless God that He has left the impression of the effect, though He has not left the impression of the way; Ps. 42:1.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/thomas-manton.html">Thomas Manton</a></span><span class="wk"><span class="lbl">Work:</span> <cite>One Hundred &amp; Ninety Sermons on the Hundred &amp; Nineteenth Psalm</cite>, … (d. 1677; London: T.P., 1681), sermon 98, p. 605</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/effectual-calling/means-of-calling.html">Means of Calling</a></span></div>

</figure><figure class="quote" id="q-d65f70bbd1" data-kw="">
<blockquote><p>‘O’, says the soul, ‘Lord, I have come to you upon an earnest business! I am arrested by Satan, my conscience convicts me, and I will be accused before the judgment seat of God… Lord, I am distressed, undertake for me!’ O consider your advocate a friend, and not an enemy! You must open your heart to Him and reveal your whole cause unto Him.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/john-bunyan.html">John Bunyan</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Works</cite>, 1:171-72</span></figcaption>

</figure><figure class="quote" id="q-e980bf0599" data-kw="">
<blockquote><p>And then for what He suffers in his minister? There He knocks, and says, ‘Open in them.’ And how was He used in the apostles that were after Him, and in the ministers of the Church ever since. What have they endured? for He put a spirit of patience upon them. And what indignities endured they in the primitive Church, that were the publishers of the Gospel, those sweet publishers thereof, drawing men to open to Christ, were killed for preaching.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/richard-sibbes.html">Richard Sibbes</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Bowels Opened</cite>, (London: G.M., 1639) | 6th Sermon, p. 167</span></figcaption>

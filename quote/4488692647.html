<blockquote><p>Answer: 1. Show a law of nature that the father might enslave his children; by a divine positive law, presupposing sin, the father might do that; and yet I think that may be questioned, whether it was not a permission rather than a law, as was the bill of divorce; but a law of nature it was not; 2. The Popish Prelate [John Maxwell] can see no law but the law of nature here; but it is because he is blind or will not see. His reason is, It was not by mutual and voluntary contract of children and fathers, therefore it was by the law of nature; so he that cursed his father was to die by God’s law. This law was not made by mutual consent betwixt the father and the son, therefore it was a law of nature: the Prelate will see no better. Nature will teach a man to enslave himself to redeem himself from death, but that it is a dictate of nature that a man should enslave his son, I conceive not.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/samuel-rutherford.html">Samuel Rutherford</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Lex Rex</cite>, ... (1644; Edinburgh: Ogle, 1843), p. 53</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/civil-government-and-society/natural-law-and-civil-law.html">Natural Law and Civil Law</a></span></div>

</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-36cd623f61" data-kw="">
<blockquote><p>It has been lately announced that the Synod of Philadelphia… adopted, and proceeded at once to enforce, a doctrine in reference to ecclesiastical proceedings, which appears to some altogether novel, and truly extraordinary. The doctrine is this,—’That no complaint, appeal, or protest, can be admitted by any judicatory, except in judicial cases.’… It never occurred to us, however, as possible, that it [the new doctrine] should receive countenance from gentlemen of experience and reflection… It is of more practical importance to show that the doctrine here assumed, cannot in our opinion, stand the test of a moment’s examination… In the Presbyterian Church in the United States, it is manifest that appeals, complaints and protests, have ever been allowed in all sorts of cases. Whenever a judicatory has decided any question which came before it by a vote, —whether the question were legislative, declarative, executive or strictly judicial—in any and every such case, both theory and practice allow of appeal, complaint and protest, at the pleasure of the party wishing to offer either. …more than thirty years before that time [1821], when the General Assembly was first organized, the following article appears in the system of Rules adopted for the government of that body: ‘Any member who may think himself aggrieved by a decision of the General Assembly, shall have his dissent or protest, with his reasons, entered on the records of the Assembly, or filed among their papers, if given in before the rising of the Assembly.’ … We have been in the constant habit of attending on the judicatories of the church, in all their grades, for more than forty years; and we never knew or heard of an in- dividual who doubted the right of appeal, complaint, and protest, in all sorts of cases… many a time, and on a great variety of occasions, we have participated in protests, etc. in all sorts of cases, without dreaming that any one ever thought of confining the privilege to cases of process only… The archives of the church are better than cursory assertions. Litera scripta manet. Let us, therefore, appeal to public records, which cannot lead us astray. In the year 1826, the General Assembly… determined, by a vote, to postpone fixing the location [of Western Theological Seminary] for another year. Against this decision the Reverend Joshua L. Wilson, of Cincinnati, entered his solemn protest, accompanied with five reasons, which still remain on permanent record. In the very same General Assembly, (of 1826)… Against this decision to receive Mr. B, forty-two members of the Assembly entered their solemn protest, supported by three reasons… In the General Assembly of 1828… In opposition to this act a solemn protest was presented and read, by a minority of the Assembly… Again, in the General Assembly of 1831… Against this decision a formal protest was entered by sixty-seven of the minority. And it is worthy of notice, that among the subscribers to this protest, the following names are found… the Reverend Robert J. Breckinridge… Alexander Boyd, Ashbel Green… At the same General Assembly, (1831)… Against this expression of opinion, a protest was offered, accepted, and recorded, signed by thirty members of the minority… Let us now attend–Secondly, to the dictates of reason on this subject…</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/samuel-miller.html">Samuel Miller</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Biblical Repertory &amp; Theological Review</cite>, no. 1, vol. 7 (Jan. 1835), article 5, ‘New Ecclesiastical Law’, pp. 89-97</span></figcaption>

<blockquote><p>[‘Equity’ is] the suitable application of the law to the demands of the situation, in which is seen the law’s will and intention [i.e. the spirit of the law]… or it is the moderating and amendment of the law that comes about from the prudence of the judge accommodating himself to the circumstances of the case, and bending the law to the case, not the case to the law.</p></blockquote>

<blockquote><p>5thly. I shall only propose one thing more to your consideration. Although the institutions and examples of the Old Testament, of the duty of magistrates in the things and about the worship of God, are not, in their whole latitude and extent, to be drawn into rules that should be obligatory to all magistrates now, under the administration of the gospel,-and that because the magistrate then was ‘custos, vindex, et administrator legis judicialis, et politiae Mosaicae,’ [the custodian, vindicator and administrator of the Judicial Law and Mosaic polity] from which, as most think, we are freed;–yet, doubtless, there is something moral in those institutions, which, being unclothed of their Judaical form, is still binding to all in the like kind, as to some analogy and proportion. Subduct [subtract] from those administrations what was proper to, ad lies upon the account of, the church and nation of the Jews, and what remains upon the general notion of a church and nation must be everlastingly binding.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/john-owen.html">John Owen</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Christ’s Kingdom &amp; the Magistrate’s Power: a Sermon</cite>, p. 509</span></figcaption>

— John Owen, Christ’s Kingdom &amp; the Magistrate’s Power: a Sermon, p. 509">Copy</button><a class="share" href="https://x.com/intent/post?text=%E2%80%9C5thly.+I+shall+only+propose+one+thing+more+to+your+consideration.+Although+the+institutions+and+examples+of+the+Old+Testament%2C+of+the+duty+of+magistrates+in+the+things+and+about+the+worship+of+God%2C+are+not%2C+in+their+whole+latitude+and+extent%2C+to+be+drawn+into+rules+that+should+be+obligatory+to+all+magistrates+now%2C+under+the+administration+of+the+gospel%2C-and+that+because+the+magistrate+then+was+%E2%80%98custos%2C+vindex%2C+et+administrator+legis+judicialis%2C+et+politiae+Mosaicae%2C%E2%80%99+%5Bthe+custodian%2C+vindicator+and+administrator+of+the+Judicial+Law+and+Mosaic+polity%5D+from+which%2C+as+most+think%2C+we+are+freed%3B%E2%80%93yet%2C+doubtless%2C+there+is+something+moral+in+those+institutions%2C+which%2C+being+unclothed+of+their+Judaical+form%2C+is+still+binding+to+all+in+the+like+kind%2C+as+to+some+analogy+and+proportion.+Subduct+%5Bsubtract%5D+from+those+administrations+what+was+proper+to%2C+ad+lies+upon+the+account+of%2C+the+church+and+nation+of+the+Jews%2C+and+what+remains+upon+the+general+notion+of+a+church+and+nation+must+be+everlastingly+binding.%E2%80%9D%0A%0A%E2%80%94+John+Owen%2C+Christ%E2%80%99s+Kingdom+%26+the+Magistrate%E2%80%99s+Power%3A+a+Sermon%2C+p.+509&amp;url=https%3A%2F%2F5solasquotes.github.io%2Fquote%2F0617859933.html&amp;via=5Solas" target="_blank" rel="noopener">Share on X</a><a class="perma" href="../quote/0617859933.html">Permalink</a><a class="src" href="https://reformedbooksonline.com/topics/topics-by-subject/covenant-of-grace/the-mosaic-covenant/the-civil-law/#:~:text=5thly.%20I%20shall%20only%20propose%20one,and%20nation%20must%20be%20everlastingly%20binding&amp;text=5thly.%20I%20shall%20only%20propose%20one%20thing%20more&amp;text=a%20church%20and%20nation%20must%20be%20everlastingly%20binding" rel="noopener" target="_blank">Read it online · Reformed Books Online</a>

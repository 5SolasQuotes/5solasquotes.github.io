<blockquote><p>The Schoolmen (though they be none of the soundest Divines) yet of late years, have crept (for a time) into more credit amongst Schools, then the most judicious and Orthodox of our best new writers (Luther, Calvin, Martyr, Bucer, and the rest:) and their books were much more vendible, and at a far greater price: But what or wherein lay their pre-eminence?

Not in the light of Divine Grace (whereof most of them were wholly destitute) nor in their skill in Tongues and Polite Literature, (wherein they were Barbarians:) nor in their deeper insight into the holy Scriptures (in which they were far less conversant, then in Peter Lombard, and Aristotle:) but in their rational disputes, with distinct Solidity and Succinct brevity. But in the mean time they corrupted the whole body of Divinity, with many curious and unprofitable questions, with many Philosophical (falsely so called) and vain Notions, and with many subtle devices, to uphold the Church of Rome, in their then prevailing Antichristian Apostacy.</p></blockquote>

30333312.html">Permalink</a><a class="src" href="https://reformedcovenanter.wordpress.com/2022/10/22/john-cotton-on-the-schoolmen/" rel="noopener" target="_blank">Read it online · Reformed Covenanter</a></div>
</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-162e363767" data-kw="">
<blockquote><p>And I exhort you to do nothing out of strife, but according to the doctrine of Christ. When I heard some saying, If I do not find it in the ancient Scriptures, I will not believe the Gospel; on my saying to them, ‘It is written,’ they answered me, ‘That remains to be proved.’ But to me Jesus Christ is in the place of all that is ancient: His cross, and death, and resurrection, and the faith which is by Him, are undefiled monuments of antiquity;</p></blockquote>

</figure><figure class="quote" id="q-bedcdada13" data-kw="">
<blockquote><p>We have peace with God through our Lord Jesus Christ.” The Saviour came to bear the curse—to take away the wrath—to mediate between God and sinners, so that the child of wrath might become a member of God’s blessed family. He saw men separated by their iniquities from the friendship of God, and lying under just condemnation. He pitied their miserable case. He saw them ready to perish through the anger of the holy Sovereign of all. His errand was to appease that anger, and to save them from it for ever.

It was not in vain that he interposed. He satisfied justice—he expiated sin—he redressed the wrongs of the law—and made peace for his people. “There is no condemnation to them that are in Christ Jesus.” There is condemnation to others. “The wrath of God abideth” on them that do not believe. But such as are in Him have “peace from God the Father.” He gives them that peace. “Peace,” he has said, “I leave with you; my peace I give unto you: not as the world giveth, give I unto you. Let not your heart be troubled, neither let it be afraid.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/andrew-gray.html">Andrew Gray</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Religious Divisions (Preached at the opening of the Free Synod of Perth, 16th April 1844) in The Free Church Pulpit; Consisting of Discourses by the Most Eminent divines of the Free Church of Scotland. Vol. I.</cite></span></figcaption>

<blockquote><p>IV. As to the people’s case, it needs no other answer:

      1. No member may remove without cause:

      2. Nor abruptly and uncharitably to the church’s dissatisfaction, when he may avoid it. But 3. He may remove upon many just causes (private or public) whether the church and pastors consent or not, so the manner be as becomes a Christian.</p></blockquote>

<blockquote><p>The recognition that there may be true Christians within the bounds of the Church of Rome is something that most Reformed theologians have granted. The Scottish Covenanter, Samuel Rutherford, for example, refused to countenance the dogmatic notion that there were no Christians within the Romish communion:

[F]or even the whole Romish Church in all its members deserveth not excommunication, in respect we are sure God hath thousands in the bosom of that Church, who believe in Christ, and do not defend popery with obstinacie …</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/samuel-rutherford.html">Samuel Rutherford</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Due Right of Presbyteries. Or, A Peaceable Plea, for the Government of the Church of Scotland</cite>, (London: E. Griffin, 1644), p. 417.</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/the-church.html">The Church</a></span></div>

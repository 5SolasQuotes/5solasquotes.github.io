<main class="wrap"><figure class="quote" id="q-74d60c8b9d" data-kw="">
<blockquote><p>What are the sins of Masters?

1. Unadvised entertainment of sinful Servants. 2. Negligence in not instructing them, (in the Fear of God, and in some lawful Calling) and not using Religious Exercises with them. [This refers to servants living in the master’s home – DR] 3. Not admonishing nor correcting them, or doing it in an ill manner: grieving more when they fail in their Business, than when they are slack in God’s Service; 4. Giving them an ill example, and using light behaviour before them. 5. Detaining their Wages from them; and not recompensing their Labors, by giving them a due reward, when they are with them, and when they part from them. 6. Neglect of them in Sickness: unjust stopping of their Wages for that time. 7. Not relieving them (if they be able) in their Age, who have spent their youth in their Service.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/james-ussher.html">James Ussher</a></span><span class="wk"><span class="lbl">Work:</span> <cite>A body of divinity: or, the sum and substance of Christian religion</cite>, ed. Michael Nevarr (1648; Herndon VA, 2007), p. 238.</span></figcaption>

<blockquote><p>3rd Doctrine. Temporary obedience does often turn aside a temporary punishment. Verse 26. ‘So He departed from him, etc.’ Zipporah here not of any devotion, but of necessity, circumcised her son, yet it pleased God so to accept of this forced obedience that he spared Moses: So many times a temporary and external obedience does turn away a temporal punishment: as Ahab’s sackcloth put off the punishment threatened, that it came not in his days. So the Samaritans’ corrupt worship of God delivered them from the lions, 2 Kings 17 (vv. 24-33). [So Josias] Simler. [Johannes] Piscator. If God be so pleased sometime with outward service, accepting the small beginnings of those that are coming unto Him: how much more acceptable unto Him is the true spiritual worship?</p></blockquote>

</figure><figure class="quote" id="q-51b66a50ba" data-kw="">
<blockquote><p>The Sum of all, in one Syllogism.

That the Lord’s day, or Christian Sabbath, is necessarily to be observed by all Christians to the end of the World.

Whatsoever days observation was in the New Testament sanctified, and set apart to an holy use: First, by Christ his triumphant resurrection. Then, by his first appearing to his gathered Apostles &amp; Disciples, five times on that same day. Next, by his second appearing to his gathered Apostles. Fourthly, by his sending of the Holy-Ghost to his Apostles gathered again, and blessing of their doctrine by conversion of souls. Fifthly, by Apostolical Command, &amp; Constitution, to be observed by Christian Churches. Sixthly, by Christ’s Command, not to be profaned of any faithful Christian. Seventhly, by [the] apostles’ solemn practice of preaching, ministering the Sacraments in the Christian Congregation, and meditation of the Scripture.

Eighthly, by the holy-Ghost’s induing it with a notable &amp; peculiar title of the Lord’s day. By Apostolical, primitive, and all later reformed Churches general and continual practice, from thence unto our times. By the judgement of the spiritual &amp; most godly learned Teachers and Writers of the former and later ages. By the witness of God’s general and continual blessing of the practice thereof, with peace of conscience, joy of the Holy-Ghost, and sensible increase of knowledge and grace in all sincere Christians, that with soundness profess the Gospel every where. And last of all, by the dislike and opposition of the only most wicked of life, ignorant of mind, or otherwise unsound in judgement and doctrine. The Observation of that Day is most necessary, and doth tie the Conscience to the end of the World.

But such is the Observation of the Lord’s day, or first day of the week; and so confirmed in every point. Therefore, The holy Observation of the Lord’s day or first day of the week, is most necessary, and doth tie the conscience to the end of the World.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/john-sprint.html">John Sprint</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Propositions, tending to prove the necessary use of the Christian Sabbath or Lord’s Day; and that it is commanded unto us in God’s Word. Whereunto is added the practice of that sacred day, framed after the rules of the same Word</cite>, (London: Thomas Man, [1607]), unpaginated.</span></figcaption>

</figure><figure class="quote" id="q-5d1d7cee19" data-kw="">
<blockquote><p>Psalms are song by emperors; the common people rejoice in them. Each man does his utmost in singing what will be a blessing to all. Psalms are sung in the home and rehearsed on the streets. The psalm is learned without labor and remembered with delight. Psalmody unites those who disagree, makes friends of those at odds, and brings together those who are out of charity with one another. Who could retain a grievance against the man whom he had joined in singing before God? The singing of praise is the very bond of unity, when the whole people join a single act of song.</p></blockquote>

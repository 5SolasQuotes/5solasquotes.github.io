<main class="wrap"><figure class="quote" id="q-6b2cfa0ec6" data-kw="">
<blockquote><p>III… Although this concept cannot be conveniently defined, since it is not a single entity by its nature but rather an aggregate of various diverse natures, and therefore defies categorization according to logical principles, it can be most conveniently described as the conformity of man, according to his measure, to the supreme perfection of God. As D. Ames presents it in Medulla Theologiae (Book 1, Chapter 8, Sections 9 and 68), it is helpful to analyze this further. It is called conformity because an image, as such, is a kind of likeness expressed from another; therefore, it must be described through similarity and conformity, not identity… The subject of this image, both directly and indirectly, is man. Here we note two points: first, that man can be considered in his fourfold state: as whole in creation, fallen in corruption, restored in regeneration, and glorified in glorification. For each of these states, a different aspect of the image is attributed to him by the Holy Scriptures in various ways… Secondly, we must note, following Genesis 1:26-28, that women are by no means excluded from this image… Furthermore, the phrase “according to his measure” is not without significance, for although this conformity is in itself most perfect, it varies according to the capacity of its subjects (since it applies differently to angels than to humans). Consequently, this image was also implanted in humans according to their measure—that is, perfectly (for nothing imperfect comes from God), yet in a way divinely adjusted to their capacity, as they were not endowed with supreme perfection. Lastly, the phrase “to the supreme perfection of God” alludes to the genuine archetype and original exemplar to which man, as a secondary type and copy, is said to conform. The reason for this conformity is explained in the prolegomena. I will add only this: that this communication should in no way be conceived as formal but only effective, by way of effect… IV… Therefore, we examine the parts or the substance from which it (as previously mentioned, it is composed of multiple elements) consists, in three aspects: first, those concerning the body; second, those concerning the soul, which are further divided into 1) essence, 2) faculties, and 3) habits; and third, those concerning the whole composite… although various parts constituting this image are enumerated here, it should be understood that not all contribute equally—some antecedently and presuppositionally, others formally and primarily, and still others consequentially and sequentially.</p></blockquote>

</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-9580d6b32c" data-kw="">

<blockquote><p>Yet know and consider that God’s power in thus abandoning all mankind for their sin in Adam is far inferior to that power He showed in cruciating his own Son, his most innocent and holy Son, in making his soul an offering for our sin. And that God has power, not only to annihilate the holiest (which is without all question), but to inflict upon him any pain. Medina is bold to profess, Ex concordi omnium theologorum sententia [according to the harmonious judgment of all theologians]; And Vasques the Jesuit acknowledges as much, though herein, they say, He should not cary himself as Judex [a Judge], but as Dominus vitae et mortis [the Lord of life and death].</p></blockquote>

</figure><figure class="quote" id="q-8490358cb2" data-kw="">
<blockquote><p>V. Next, we must examine those aspects that primarily and chiefly pertain here (πρώτως καὶ κυρίως, “primarily and chiefly”): namely, the infused and inherent habits (habitus infusi &amp; concreati), for considering only acquired habits, as the Socinians and Remonstrants do, is sheer nonsense. These habits perfected and adorned these faculties excellently, such as the clarity and rectitude of the mind, not only regarding that innate (ὑπάρχον) aspect of the divine (τὸ τοῦ θεοῦ), whether it is innate through common notions (κοιναὶ ἐννοίαι) and the subjective light of the mind, or acquired through the objective light of being, as Socinus vainly objects (Romans 1; Isaiah 40; Psalm 19; Acts 14; Romans 2). But as a supernatural good, spiritual and religious, man knew God, His revealed will, and found his supreme happiness therein with perfect accuracy… We do not, however, regard this Original Righteousness as something substantial, as Osiander does, nor do we consider it a supernatural addition extrinsically added to the first nature in its pure natural state, as the Roman Catholics do. Instead, we deem it natural or connatural; otherwise, God would have commanded man to fulfill His law by his own strength in vain. This is further confirmed by the fact that, as it was to be propagated because it was natural, so reciprocally it was to be propagated by divine grace (Genesis 1:28, 1 Corinthians 15:48). What pertains to the supernatural, as such, cannot be sought in vain. However, we can easily accept calling it supernatural insofar as it did not flow from the essential principles of human nature but was infused by the grace of God as a moral good.</p></blockquote>

<div class="actions"><button class="copy" data-copy="“V. Next, we must examine those aspects that primarily and chiefly pertain here (πρώτως καὶ κυρίως, “primarily and chiefly”): namely, the infused and inherent habits (habitus infusi &amp; concreati), for considering only acquired habits, as the Socinians and Remonstrants do, is sheer nonsense. These habits perfected and adorned these faculties excellently, such as the clarity and rectitude of the mind, not only regarding that innate (ὑπάρχον) aspect of the divine (τὸ τοῦ θεοῦ), whether it is innate through common notions (κοιναὶ ἐννοίαι) and the subjective light of the mind, or acquired through the objective light of being, as Socinus vainly objects (Romans 1; Isaiah 40; Psalm 19; Acts 14; Romans 2). But as a supernatural good, spiritual and religious, man knew God, His revealed will, and found his supreme happiness therein with perfect accuracy… We do not, however, regard this Original Righteousness as something substantial, as Osiander does, nor do we consider it a supernatural addition extrinsically added to the first nature in its pure natural state, as the Roman Catholics do. Instead, we deem it natural or connatural; otherwise, God would have commanded man to fulfill His law by his own strength in vain. This is further confirmed by the fact that, as it was to be propagated because it was natural, so reciprocally it was to be propagated by divine grace (Genesis 1:28, 1 Corinthians 15:48). What pertains to the supernatural, as such, cannot be sought in vain. However, we can easily accept calling it supernatural insofar as it did not flow from the essential principles of human nature but was infused by the grace of God as a moral good.”

— Andreas Essenius, ‘Theological Disputation on the Image of God in Man’ Download tr. Jonathan Tomes (Utrecht: Johannes Waesberg, 1653) Latin">Copy</button><a class="share" href="https://x.com/intent/post?text=%E2%80%9CV.+Next%2C+we+must+examine+those+aspects+that+primarily+and+chiefly+pertain+here+%28%CF%80%CF%81%CF%8E%CF%84%CF%89%CF%82+%CE%BA%CE%B1%E1%BD%B6+%CE%BA%CF%85%CF%81%CE%AF%CF%89%CF%82%2C+%E2%80%9Cprimarily+and+chiefly%E2%80%9D%29%3A+namely%2C+the+infused+and+inherent+habits+%28habitus+infusi+%26+concreati%29%2C+for+considering+only+acquired+habits%2C+as+the+Socinians+and+Remonstrants+do%2C+is+sheer+nonsense.+These+habits+perfected+and+adorned+these+faculties+excellently%2C+such+as+the+clarity+and+rectitude+of+the+mind%2C+not+only+regarding+that+innate+%28%E1%BD%91%CF%80%CE%AC%CF%81%CF%87%CE%BF%CE%BD%29+aspect+of+the+divine+%28%CF%84%E1%BD%B8+%CF%84%CE%BF%E1%BF%A6+%CE%B8%CE%B5%CE%BF%E1%BF%A6%29%2C+whether+it+is+innate+through+common+notions+%28%CE%BA%CE%BF%CE%B9%CE%BD%CE%B1%E1%BD%B6+%E1%BC%90%CE%BD%CE%BD%CE%BF%CE%AF%CE%B1%CE%B9%29+and+the+subjective+light+of+the+mind%2C+or+acquired+through+the+objective+light+of+being%2C+as+Socinus+vainly+objects+%28Romans+1%3B+Isaiah+40%3B+Psalm+19%3B+Acts+14%3B+Romans+2%29.+But+as+a+supernatural+good%2C+spiritual+and+religious%2C+man+knew+God%2C+His+revealed+will%2C+and+found+his+supreme+happiness+therein+with+perfect+accuracy%E2%80%A6+We+do+not%2C+however%2C+regard+this+Original+Righteousness+as+something+substantial%2C+as+Osiander+does%2C+nor+do+we+consider+it+a+supernatural+addition+extrinsically+added+to+the+first+nature+in+its+pure+natural+state%2C+as+the+Roman+Catholics+do.+Instead%2C+we+deem+it+natural+or+connatural%3B+otherwise%2C+God+would+have+commanded+man+to+fulfill+His+law+by+his+own+strength+in+vain.+This+is+further+confirmed+by+the+fact+that%2C+as+it+was+to+be+propagated+because+it+was+natural%2C+so+reciprocally+it+was+to+be+propagated+by+divine+grace+%28Genesis+1%3A28%2C+1+Corinthians+15%3A48%29.+What+pertains+to+the+supernatural%2C+as+such%2C+cannot+be+sought+in+vain.+However%2C+we+can+easily+accept+calling+it+supernatural+insofar+as+it+did+not+flow+from+the+essential+principles+of+human+nature+but+was+infused+by+the+grace+of+God+as+a+moral+good.%E2%80%9D%0A%0A%E2%80%94+Andreas+Essenius%2C+%E2%80%98Theological+Disputation+on+the+Image+of+God+in+Man%E2%80%99+Download+tr.+Jonathan+Tomes+%28Utrecht%3A+Johannes+Waesberg%2C+1653%29+Latin&amp;url=https%3A%2F%2F5solasquotes.github.io%2Fquote%2F8490358cb2.html&amp;via=5Solas" target="_blank" rel="noopener">Share on X</a><a class="perma" href="../quote/8490358cb2.html">Permalink</a><a class="src" href="https://reformedbooksonline.com/on-mans-original-state-in-righteousness/#:~:text=V.%20Next%2C%20we%20must%20examine%20those,of%20God%20as%20a%20moral%20good&amp;text=V.%20Next%2C%20we%20must%20examine%20those%20aspects%20that&amp;text=the%20grace%20of%20God%20as%20a%20moral%20good" rel="noopener" target="_blank">Read it online · Reformed Books Online</a></div>

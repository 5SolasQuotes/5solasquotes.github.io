<main class="wrap"><figure class="quote" id="q-ca410e32d5" data-kw="">
<blockquote><p>[Samuel Rutherford]

But I know this ye hold: to maintain festival days, so long as ye do it for mere order, and for no religious mark ye can put upon the day.

[Thomas Sydserff]

And I think ye can hardly say anything against that.

[Samuel Rutherford]

This I would say against it, that then ye may bring into the church religious circumcision, the feast of Tabernacles, the Passover, the whole Jewish days, and esteemed as arbitrary and indifferent and no ways necessary.

[Thomas Sydserff]

What fault were that if our church should appoint a feast after the harvest for thanksgiving to God for the fruits of the ground, answerable to the Jewish feast?

[Samuel Rutherford]

This fault, in my weak judgment, it were Judaism and we might have an new temple, an new ark, new sacrifices and shedding of blood, after Christ by his death hath removed all bloody sacrifices. If this be added, they are indifferent and not necessary. I pray you, would this distinction keep the Galatians from being entangled with the old yoke of Jewish bondage, if they brought in circumcision, and holy days, with an new opinion and laid aside all typical and Jewish opinion?</p></blockquote>

</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-0190135555" data-kw="">
<blockquote><p>5. It is one question whether a day may be set apart for commemoration of some mystery of our religion, by men, and as a part of God’s worship. And another whether such days may be set apart for worshipping God merely as a piece of good order and policy. The first the Papists are for: the other most of our prelatists own, though some of them differ little from the Papists in this matter.

6. The question is not whether a day may be set apart occasionally for religious worship: that is, when any special providence gives occasion for fasting and humiliation or for thanksgiving and rejoicing: seeing in that case there is a special providential call to that solemn work: but whether a day may be set apart to be observed constantly and as it recurs every year. The one makes a difference between that day of the year and other days and exempts it altogether and constantly from civil use, the other does not so; the one makes a difference among days, the other makes the difference only in the works or dispensations of God which occasion such work on that day and not on another. All that the Church does in the one case, is, whereas the present providence calls to the work, as it is expressed, Isa. 22:12. The Church only determines the circumstance of time, which must be done: in the other, the Church determines more than a necessary circumstance, viz. that there shall be such a solemnity, which the Lord has not enjoined; neither do we doubt, but that the Church may appoint recurrent days for solemn worship, to wit, while the present providence that calls to such work continues. Weekly or monthly fasts may be appointed under a lasting calamity or threatening.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/gilbert-rule.html">Gilbert Rule</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Good Old Way Defended</cite>, … (Edinburgh: 1697), sect. 9, pp. 205-6</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/worship/holy-days-and-church-calendar.html">Holy Days and Church Calendar</a></span></div>

<blockquote><p>Concerning ceremonial festivals of man’s making, our practice cannot be objected, because we observe none. We take occasion of hearing and praying upon any day when occasion is offered. We say (with [Rudolph] Hospinian [d. 1626], [in Latin] Of Christian Festivals, ch. 2 [1611/74]) ‘Not the day, but the Word of God… puts us in mind of the nativity, resurrection and ascension of Christ.&#x27;</p></blockquote>

</figure><figure class="quote" id="q-1519ed2764" data-kw="">
<blockquote><p>When certain days are represented as holy in themselves, when one day is distinguished from another on religious grounds, when holy days are reckoned a part of divine worship, then days are improperly observed. The Jewish Sabbath, new moons, and other festivals, were earnestly pressed by the false apostles, because they had been appointed by the law. When we, in the present age, intake a distinction of days, we do not represent them as necessary, and thus lay a snare for the conscience; we do not reckon one day to be more holy than another; we do not make days to be the same thing with religion and the worship of God; but merely attend to the preservation of order and harmony. The observance of days among us is a free service, and void of all superstition.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/john-calvin.html">John Calvin</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Commentary on Galatians and Ephesians</cite>, 4:10</span></figcaption>

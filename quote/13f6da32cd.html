<blockquote><p>The state of the public mind around us is becoming more favourable to the just appreciation of our Testimony in regards to the rights of man. The whole north is awaking on the subject of slavery. It is now the controlling element in the great political movements of the country; and while we are far from approving the manner and spirit with which this great contest against despotism is in many instances conducted, we do rejoice as philanthropists, as patriots, as Christians, and as Covenanters, that the great principles of human liberty, long practically despised and set aside by the slave-holding institutions of the United States, are spreading themselves with new energy throughout the increasing millions of our lands In this you will rejoice with us. […]

James M. Willson Clerk Com. of For. Corr.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/j-m-willson.html">J. M. Willson</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Letter to R.P.S.I., 1 June 1849 (Reformed Presbyterian Historical Library, Knockbracken, American correspondence, no. 15).</cite></span></figcaption>

</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-53dc81c98d" data-kw="">
<blockquote><p>But Jesus in this passage also asserts His own Lordship over the Sabbath. “The Son of man is Lord even of the Sabbath.” The title Son of man is distinctly Messianic and points to the dominion which He in His capacity as the Messiah exercises. It is in His capacity as the Son of man that He exercises this Lordship over the Sabbath. And this simply means that, within that universal Lordship and authority that is His as the one to whom all authority in heaven and earth has been committed, the Sabbath has its proper place and function. Abolition of it is, as B. B. Warfield says, “as far as possible from the suggestion of the passage.”

Further, we must observe that Jesus says “even of the Sabbath.” The presence of the word “even” serves to show the extent of Jesus’ Lordship. This Lordship is so comprehensive that it even includes the Sabbath, and surely such an emphasis discloses the high conception of its sanctity and authority Jesus entertained.

Finally, the reason assigned for this Lordship over the Sabbath is the fact that the Sabbath was made for man. It was for the sake of man that Jesus came into the world, it was for man’s sake that He died and rose again, it is for man’s sake that He is exalted as the Messiah to supreme mediatorial sovereignty. But it was also for man’s sake that the Sabbath was made. If, then, it was for man’s sake that Jesus came, and suffered, and died, and rose again to ascend up where He was before, is it possible that that which was made for man – the Sabbath – should be annulled and abrogated by that which He became and did for man’s sake?

There is complete congruity between His Messianic work and Lordship on the one hand and the Sabbath ordinance on the other. They both serve the same purpose. And so His Lordship embraces the Sabbath institution, embraces it too for the purpose of preserving it, confirming it and blessing it. He is Lord of the Sabbath too.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/john-murray.html">John Murray</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Fourth Commandment According to the Westminster Standards in The Calvin Forum</cite></span></figcaption>

</figure><figure class="quote" id="q-843a56be0d" data-kw="">
<blockquote><p>The great, primary, responsible leader of all worship in the Church is our blessed Lord Himself – the minister of the true sanctuary which the Lord pitched, and not man. In this capacity He is pleased to say in the 22nd Psalm – and it is quoted in the New Testament too – “I will declare thy name unto my brethren; in the midst of the church will I sing praise unto thee.” On this verse Calvin has this beautiful comment:– “It thus appears that our Lord is the leader of our songs and chief composer of our hymns.” Are they uninspired hymns which Christ composes, and leads us in singing in the great congregation? He is spiritually present with His people in their worship in the sanctuary.

But were He bodily present, as in the synagogue of Nazareth, when there was given to Him the book of the prophet Isaiah, would you give Him any other book of song than the book of the Psalms of David, or other inspired songs of Scripture? Would you give Him other than His own Psalms to lead you in singing? – His own Psalms, in that they are composed by Himself; and His own Psalms, in that His soul sang them, with grace in His heart unto the Lord, in the days of His flesh. You maintain communion with Him, and He with you, when, in the praises of the sanctuary, you sing His Psalms.

You may think your hymns are in accordance with His Word, but the Psalms are His very Word itself. You can sing them in faith untainted with doubt, in the full assurance of faith, unshackled from the spirit of criticism which man’s word continually provokes, yea, demands – in that faith which cometh by hearing, when the hearing is the hearing of the Word of God, and which goeth forth in songs of faith, when the songs are the songs of the Spirit of God.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/hugh-martin.html">Hugh Martin</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Psalms and Uninspired Hymns. Extracts from Speech by Dr. Hugh Martin, in the General Assembly of the Free Church, 3rd June, 1872 in Free Presbyterian Magazine</cite></span></figcaption>

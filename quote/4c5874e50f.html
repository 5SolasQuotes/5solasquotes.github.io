<main class="wrap"><figure class="quote" id="q-4c5874e50f" data-kw="">
<blockquote><p>There be some who have daily some new command from God, to make known unto their brothers and strangers. Some are rapt into an ecstasy and have their appearance and countenance changed, lying upon the ground certain hours. Some tremble and quake for two or three hours together; after that, when they are come back to their senses, they prophesy and speak strange things as if they had been in another world or as if they had fallen from heaven: and they account to have that in common with the Apostle, when he was taken up into the third heaven.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/guido-de-bres.html">Guido de Brès</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Rise and Spring of the Anabaptists</cite>, (1555).</span></figcaption>

<blockquote><p>Does not our Savior tell the men of Capernaum, that had the wonderful means of grace, Mt. 11:31, If those things had been done in Tyre and Sidon (two heathenish places) they would have repented in dust, in ashes? It’s thought, true repentance and conversion is not here meant; but palpable and sensible demonstrations they would have made of some sorrow and humiliation; and therefore Christ threatens to take away the Kingdom of heaven from the Jews; viz. The Gospel, and give it to a nation bringing forth fruit better than they: Oh consider then, whether the very Heathens and Pagans would not give more respect, and show more joy at the Word preached than you do: Take heed, for there are none further off grace, than those that have been called, and yet reject it: There is more hopes of those to whom the Gospel was never rendered;</p></blockquote>

</figure><figure class="quote" id="q-ffe939c855" data-kw="">
<blockquote><p>Q. What are the sins forbidden in the first commandment? A. The sins forbidden in the first commandment, are, Atheism, in denying or not having a God; Idolatry, in having or worshipping more gods than one, or any with or instead of the true God; the not having and avouching him for God, and our God; the omission or neglect of any thing due to him, required in this commandment; ignorance, forgetfulness, misapprehensions, false opinions, unworthy and wicked thoughts of him; … selflove, selfseeking, and all other inordinate and immoderate setting of our mind, will, or affections upon other things, and taking them off from him in whole or in part; … distrust … trusting in lawful means; carnal delights and joys; … ascribing the praise of any good we either are, have, or can do, to fortune, idols, ourselves, or any other creature.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/westminster-assembly.html">Westminster Assembly</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Westminster Larger Catechism</cite>, Q. 105</span></figcaption>

<blockquote><p>John the Baptist was an occasional conformist to the Jewish Church: He went to Jerusalem to worship thrice a year at the solemn feasts, according to the Law [Dt. 16:16]; but at other times he held separate assemblies¹ in the wilderness of Judea at Jordan [Mk. 1:5], and at Aenon [Jn. 3:23], where he taught and baptized… ¹ [For a summary in English Church history after the Reformation of presbyterians and puritans who at times held separate assemblies from the established Anglican Church, yet still held communion with her, see James Owen, Moderation Still a Virtue, 1704, pp. 42-44.] Our Lord Jesus Christ, the Author of our holy religion, was also an occasional conformist. We find Him sometimes in the Temple and synagogues; at other times preaching in private houses, on mountains and in the wilderness, etc… He preached in separate congregations, was a dissenter from the imposed ceremonies and traditions of the elders, and vindicated his disciples in their non-conformity to them, telling his censorious accusers that they ‘taught for doctrine the commandments of men.’ (Mt. 15:1-9; Mk. 7:1-8) The apostles of our Lord Jesus, in imitation of their Master, were occasional conformists. One, while we find them in the Temple at public worship and teaching there (Acts 3:1; 4:1); another [time] while in a private meeting, or conventicle, as some would call it. St. Luke says, ‘They continued daily with one accord in the Temple’, and ‘broke bread from house to house.’ (Acts 2:46) St. Paul, the apostle of the gentiles, was eminent for occasional conformity. He exhorts the Christians to assert their freedom from the law of ceremonies (Gal. 5:1), lives himself after the manner of the gentiles (Gal. 2:14), and by consequence, in fellowship with them, yet occasionally purified himself in the Temple, according to the Law of Moses. (Acts 21:26) He was a dissenter from the ceremonies of the Law, and yet submits to them to avoid offense [Acts 16:3; 18:21]. He statedly communicated with the gentile Churches, but holds occasional communion with the national Jewish Church. He judged occasional communion lawful, but did not therefore conclude constant communion a duty, nay, it had been sinful to him and all other Christians; for then they must have separated from the fellowship of the Gospel [Acts 15:7-19; Gal. 2:9-21], and renounced Christianity… From this different constitutions of the Jewish [in Acts 15:21] and Gentile Churches, it follows: 1. That there was no exact uniformity in the Churches planted by the apostles. Nor did they make any laws of uniformity in lesser matters, as the condition of Christian communion; but left the believers to follow their different sentiments, and to approve themselves to God therein. Some were free to eat all things, others eat herbs, rather than forbidden flesh, or clean flesh dressed after the manner of the gentiles, some observed days, others not. (Rom. 14:2, 5) Here is a manifest difference in practice, and the rule or canon which the apostle gives about it, is not a rule of uniformity, but of charity, not to despise or judge one another. (Rom. 14:3)</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/james-owen.html">James Owen</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Occasional Communion</cite>, Moderation a Virtue, or, The Occasional Conformist Justified from the Imputation of Hypocrisy… (London: Baldwin, 1703), pp. 7-9 Owen (1654-1706) was an English, Independent puritan. By “occasional conformity,” Owen does not mean ever doing that which is sinful. | Lawfulness &amp; Need in Some Circumstances for Some Separation, while Maintaining Occasional Communion, or Conformity</span></figcaption>

2C+or%2C+The+Occasional+Conformist+Justified+from+the+Imputation+of+Hypocrisy%E2%80%A6+%28London%3A+Baldwin%2C+1703%29%2C+pp.+7-9+Owen+%281654-1706%29+was+an+English%2C+Independent+puritan.+By+%E2%80%9Coccasional+conformity%2C%E2%80%9D+Owen+does+not+mean+ever+doing+that+which+is+sinful.+%7C+Lawfulness+%26+Need+in+Some+Circumstances+for+Some+Separation%2C+while+Maintaining+Occasional+Communion%2C+or+Conformity&amp;url=https%3A%2F%2F5solasquotes.github.io%2Fquote%2F2f0051a23a.html&amp;via=5Solas" target="_blank" rel="noopener">Share on X</a><a class="perma" href="../quote/2f0051a23a.html">Permalink</a><a class="src" href="https://reformedbooksonline.com/on-impurities-in-worship/#:~:text=John%20the%20Baptist%20was%20an%20occasional,or%20judge%20one%20another.%20%28Rom.%2014%3A3&amp;text=John%20the%20Baptist%20was%20an%20occasional%20conformist%20to&amp;text=to%20despise%20or%20judge%20one%20another.%20%28Rom.%2014%3A3" rel="noopener" target="_blank">Read it online · Reformed Books Online</a></div>

<blockquote><p>Moreover, as we may not use any indifferent thing at our own pleasure; so neither may the Church at her will and pleasure command the use of it: but as our practice, so the Church’s injunction must be determined and squared according to the former [three] rules [of using indifferent things (1) to the glory of God, (2)according to the law of charity and (3) purity of conscience]. And if any man think, that in the use of things indifferent he may be led and ruled by the Church’s determination without examining any further, let him understand that the Church’s determination is but a subordinate rule, or a rule ruled by higher rules. … He [Dr. Forbes] has been speaking of the rules which God’s Word gives us concerning the use of things indifferent, and all of them he comprehends under this rule, that we should hear the Church and obey them who are set over us, as if God’s rules were subordinate to men’s rules and not theirs to his. We say not that every man may use things indifferent suo arbitratu [according to his judgment]: but we say withal that neither may the Church command the use of things indifferent, suo arbitratu. Both, she in commanding and we in obeying, must be guided by the rules of Scripture. They who are set over us in the Church have no power given them of Christ which is not for edifying, Eph. 4:12. The council of the apostles and elders at Jerusalem (which is a lively pattern of a lawful synod to the world’s end) professed they would lay no other burden upon the disciples except such things as the law of charity made necessary for shunning of scandal: and so that which they decreed had force and strength to bind, a Charitate propter Scandalum [from charity due to scandal], says Sanctius. But suo arbitratu [by their (mere) judgment] they enjoined nothing. It appears by this place (says [Thomas] Cartwright) that there may be no abridgment of liberty simply decreed, but in regard of circumstance, according to the rule of edification. And if the Church’s decrees and canons be not according to the rules of the Word, yet forasmuch as everyone of us shall give account of himself and his own deed, we must look that whatsoever the Church decree, yet our practice in the use or omission of a thing indifferent, be according to the foresaid rules. We may not for the commandment of men transgress the rule of piety by doing anything which is not for God’s glory and ordered according to his will; neither ought any of us to obey men, except for the Lord’s sake and as the servants of Christ, doing the will of God; which teaches us the manner how we ought to obey men, namely, propter Christum et sicut Christus praecipit [for Christ, as Christ commands]. For if we should know no more but the will of man for that which we do, then we should be the servants of men, not the servants of Christ. Neither yet may we for any human ordinance break the rule of charity: but whatsoever either would weaken or not edify our brother, be it never so lawful, never so profitable to ourselves, never so powerfully by earthly authority enjoined, Christians, who are not born unto themselves, but unto Christ, unto his Church and unto the fellow members, must not dare to meddle with it. Nor lastly may we obey men so as to break the Law of Purity, and perform any action with a doubtful conscience, that is, whereof either the Word has not, or we out of it have no warrant: in which case tender consciences must be tendered, rather than be racked by authority: for be the things in themselves never so lawful, etc., they are utterly unlawful to me without such information. Whereas therefore some say that in the use of matters indifferent, the laws of those who are set over us ought to rule us; we still answer that our practice may not be ruled by any law of man except it be according to the rules of the Word; whereof one is this: Tantum oportere esse obedientiae studium in Christianis, ut nihil agant, quod non existiment vel potius certi sint placere Deo (Calvin on Rom. 14:5).</p></blockquote>

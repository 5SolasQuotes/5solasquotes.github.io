<blockquote><p>6. But here is sad news to such who slight this salvation and refuse Jesus Christ: great will their condemnation be: The men of Nineveh shall rise up in judgment with this generation and condemn it, because they repented at the preaching of Jonah; and behold a greater than Jonah is here. The greatness of this Savior who preaches the Gospel to you and is come to save you will aggravate your condemnation. What was Jonah to Jesus Christ?… O know you, sinners, this day, that Jesus Christ, this glorious King, and Prince of the kings of the earth, this mighty Savior is come to your doors: ‘Behold, I stand at the door and knock’: Will you not open the door, nor cry to Him to help you to open to Him, to enable you to believe in Him? What do you say, shall the Son of God stand at your doors, and you not so much as ask, ‘Who is there? Who is at my door?’ Shall Christ be kept out of your hearts, and stand at your doors, whilst sin commands the chiefest room and has absolute power over you, and rules in you? How will you be able to look this blessed Savior in the face another day? Is He come through a sea of blood to offer his love to you, and to espouse you unto Himself forever, and will not you be persuaded to break your league with the old lovers, who will at last stab you at the very heart, and betray your souls into the hands of divine wrath? Nay, they have done it already: What are your lovers but your lusts… And to deliver you from them, and from that wrath which is due to you for them (I mean, for your sins) is Christ come, and this great Savior is offered to you.</p></blockquote>

<blockquote><p>The intended scope of it [Ps. 24] may be considered literally and mystically: … 2. Mystically, according to the spiritual mystery and truth intended, it is; To set out the kingdom of Christ, generally over the whole world, but peculiarly over his Church and saints, described by their properties, and dignified with great privileges; and to incite all to open the gates of their hearts, with up-lifted joy, to entertain this King.</p></blockquote>

<blockquote><p>They do not receive this grace as they ought to do. They let it into the ear, giving it the hearing, but not into the heart, embracing of it. They shut the door of their souls against it. Now upon this condition it is that Christ promises to communicate Himself and his grace to those to whom He comes, viz. if they shall open the door to Him, ‘Behold, I stand at the door and knock, if any man hear my voice and open the door, I will come in, and sup with him, and he with Me.’ (Rev. 3.20). It is not the bare hearing of the voice of Christ speaking in his word, but the opening of the door, the letting of Him into the soul, receiving and entertaining Him by faith and love that will bring men to have communion with Him to be made partakers of his grace and Spirit. Now this many will not do; they shut the door of their souls against Jesus Christ, not letting in the motions of his Spirit into their hearts, but opposing, resisting it. This is that which Stephen charges upon the Jews, Acts 7:51, ‘Ye stiff-necked and uncircumcised in heart, and ears, ye do always resist the holy Ghost; as your fathers did so do you.’ And so is it with many, they hear the Word, but they do not let in the monitions of it, nor the motions of the Spirit into their hearts. Question: Why, but is not the grace of God irresistible? A. This is made a matter of controversy, eagerly debated betwixt Arminians and Orthodox divines; I shall not now wade into it. In a word take this resolution: The Spirit of grace in itself is irresistible (I mean so irresistible, as that though it may be opposed, yet it cannot be conquered) but it does not always work in an irresistable way and manner. In itself (I say) it is irresistible, so as if it will put forth its strength, it is able to make way for the motions of it; able to open the door of the soul, though never so closed shut against it, so as not only to illuminate the mind, but also to change the will; not by forcing and constraining it (which being contrary to the nature of the will, is inconsistent with it; should the will be forced, it should cease to be a will, the property whereof is to act freely), but by sweetly inclining it, of unwilling, making it willing to comply and yield to such terms as are tendered to it; by which means the grace of God becomes effectual in it. But this I shall not enlarge upon, resting contented with this, that the grace of God is sufficient for all that shall receive it: sufficient for their conversion.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/john-brinsley.html">John Brinsley</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Aqua cœlestis, or a Sovereign Cordial extracted from the Sufficiency of Divine Grace &amp; Strength made Perfect in Weakness</cite>, … (London: Sawbridge, 1663), pp. 54-56</span></figcaption>

</figure><figure class="quote" id="q-d18b7522d8" data-kw="">
<blockquote><p>Sixthly, by his not only offering acquaintance with us upon these terms, by his ambassadors, his ministers, but by his coming personally by his Spirit to our several hearts, inviting and soliciting us to this acquaintance. According to that of our Lord Jesus Christ, ‘Behold I stand at the door and knock; if any man hear my voice, and open to Me, I will come in to him, and will sup with him, and he with Me.’ The Greeks and Romans of old were wont always to have their feasts at supper; therefore when it is said here, ‘I will come in to him, and sup with him,’ it is as if He had said, ‘I will come in to him and feast with him.’ And feasting together was of old a symbol of perfect reconciliation, and intimate friendship and acquaintance. Now, behold here the wonderful goodness and condescension of God, and his gracious disposition and inclination towards peace and acquaintance with his poor creatures… Behold therefore, I say, and admire the gracious disposition of God towards sinful man, and the great desire He has towards peace and renewed acquaintance with Him.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/matthew-newcomen.html">Matthew Newcomen</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Best Acquaintance &amp; Highest Honor of Christians, or a Discourse of Acquaintance with God</cite>, (London: Parker, 1679), ch. 4, pp. 48-49</span></figcaption>

<div class="actions"><button class="copy" data-copy="“Sixthly, by his not only offering acquaintance with us upon these terms, by his ambassadors, his ministers, but by his coming personally by his Spirit to our several hearts, inviting and soliciting us to this acquaintance. According to that of our Lord Jesus Christ, ‘Behold I stand at the door and knock; if any man hear my voice, and open to Me, I will come in to him, and will sup with him, and he with Me.’ The Greeks and Romans of old were wont always to have their feasts at supper; therefore when it is said here, ‘I will come in to him, and sup with him,’ it is as if He had said, ‘I will come in to him and feast with him.’ And feasting together was of old a symbol of perfect reconciliation, and intimate friendship and acquaintance. Now, behold here the wonderful goodness and condescension of God, and his gracious disposition and inclination towards peace and acquaintance with his poor creatures… Behold therefore, I say, and admire the gracious disposition of God towards sinful man, and the great desire He has towards peace and renewed acquaintance with Him.”

— Matthew Newcomen, The Best Acquaintance &amp; Highest Honor of Christians, or a Discourse of Acquaintance with God (London: Parker, 1679), ch. 4, pp. 48-49">Copy</button><a class="share" href="https://x.com/intent/post?text=%E2%80%9CSixthly%2C+by+his+not+only+offering+acquaintance+with+us+upon+these+terms%2C+by+his+ambassadors%2C+his+ministers%2C+but+by+his+coming+personally+by+his+Spirit+to+our+several+hearts%2C+inviting+and+soliciting+us+to+this+acquaintance.+According+to+that+of+our+Lord+Jesus+Christ%2C+%E2%80%98Behold+I+stand+at+the+door+and+knock%3B+if+any+man+hear+my+voice%2C+and+open+to+Me%2C+I+will+come+in+to+him%2C+and+will+sup+with+him%2C+and+he+with+Me.%E2%80%99+The+Greeks+and+Romans+of+old+were+wont+always+to+have+their+feasts+at+supper%3B+therefore+when+it+is+said+here%2C+%E2%80%98I+will+come+in+to+him%2C+and+sup+with+him%2C%E2%80%99+it+is+as+if+He+had+said%2C+%E2%80%98I+will+come+in+to+him+and+feast+with+him.%E2%80%99+And+feasting+together+was+of+old+a+symbol+of+perfect+reconciliation%2C+and+intimate+friendship+and+acquaintance.+Now%2C+behold+here+the+wonderful+goodness+and+condescension+of+God%2C+and+his+gracious+disposition+and+inclination+towards+peace+and+acquaintance+with+his+poor+creatures%E2%80%A6+Behold+therefore%2C+I+say%2C+and+admire+the+gracious+disposition+of+God+towards+sinful+man%2C+and+the+great+desire+He+has+towards+peace+and+renewed+acquaintance+with+Him.%E2%80%9D%0A%0A%E2%80%94+Matthew+Newcomen%2C+The+Best+Acquaintance+%26+Highest+Honor+of+Christians%2C+or+a+Discourse+of+Acquaintance+with+God+%28London%3A+Parker%2C+1679%29%2C+ch.+4%2C+pp.+48-49&amp;url=https%3A%2F%2F5solasquotes.github.io%2Fquote%2Fd18b7522d8.html&amp;via=5Solas" target="_blank" rel="noopener">Share on X</a><a class="perma" href="../quote/d18b7522d8.html">Permalink</a><a class="src" href="https://reformedbooksonline.com/let-jesus-come-into-your-heart/#:~:text=Sixthly%2C%20by%20his%20not%20only%20offering,peace%20and%20renewed%20acquaintance%20with%20Him&amp;text=Sixthly%2C%20by%20his%20not%20only%20offering%20acquaintance%20with&amp;text=has%20towards%20peace%20and%20renewed%20acquaintance%20with%20Him" rel="noopener" target="_blank">Read it online · Reformed Books Online</a></div>

<blockquote><p>‘I stand.’ Christ expresses his mind by borrowed speeches: for in this verse [Rev. 3:20] He compares every man to a house or householder, and our hearts to doors by which an entrance is made: and Himself to a guest or stranger which comes to the house, and desires to be let in and entertained: yet not so much to look for kindness to be shown [to] Him, as to show favor to us. By this similitude Christ purposes to show this Church, what his mind is toward it: and He expresses it by two signs here set down: first, a desire of their conversion, which He heartily seeks and looks for, ‘I stand and knock.’ Secondly, his promise after their conversion, ‘If any, etc.’ He will have fellowship, even mutual fellowship with them. Now of the words in order as they lie. The scope and substance of them being thus first thus generally propounded, I here note two things. First, that this Church (if we regard the greater part of it) had no true fellowship with Christ as yet, nor Christ with them: because He was not yet received into their houses, but stood at their doors which were shut. This may seem strange: but the cause is evident; the truth is, there were many good things in them: for they knew the Gospel and liked it, and professed it, and were partakers of the seals of the covenant: and yet they were tainted with one great sin of lukewarmness, which closed up the door of their hearts, so that though they had many good things, yet this one sin kept out Christ. By which we see, that one sin, in a man endued with many good graces, keeps out Christ, and bars Him from all fellowship and society with Him… … Seeing then Christ standing at the door of men’s hearts knocks so earnestly to save men’s souls, we again ought to be earnest to receive and embrace the Gospel. He knocks in good earnest, and we must accordingly by God’s grace be as earnest. So much for the first token of Christs love, his desire of their conversion, which He shows by two signs; first his waiting, secondly his knocking, and that joined with crying.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/william-perkins.html">William Perkins</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Lectures Upon the Three First Chapters of the Revelation</cite>, … (1595; London: Field, 1604), pp. 331–34</span></figcaption>

<main class="wrap"><figure class="quote" id="q-8872bfd394" data-kw="">
<blockquote><p>Although pardon of sin be compleated at that great day, yet this is not to be understood, as if Gods pardon of any sin were imperfect, and something of sinne did still remain to be done away. No, those expressions of forgivenes of sin in the Scripture, denote such a full and plenary pardon, that a sin cannot be more remitted then it is. But because we commit new sinnes daily, and so need pardon daily, Therefore it is that we are not compleatly pardoned till then. As also because the perfect pardon we have here, shall then solemnly and publikely be declared to all the world.</p></blockquote>
<figcaption>— <a href="../authors/anthony-burgess.html">Anthony Burgess</a>, <cite>The True Doctrine of Justification</cite>, London, 1651, Lecture 29, pp. 258–259</figcaption>

<blockquote><p>God continues to forgive the sins of those that are justified, and although they can never fall from the state of justification, yet they may, by their sins, fall under God’s fatherly displeasure; and in that condition they usually do not have the light of his countenance restored to them, until they humble themselves, beg pardon, and renew their faith and repentance (Matt. 6:12; 1 John 1:7, 9; John 10:28; Ps. 89:31–33; Ps. 32:5; Ps. 51; Matt. 26:75).</p></blockquote>
<figcaption>— <a href="../authors/particular-baptists.html">Particular Baptists</a>, <cite>Second London Baptist Confession of Faith</cite>, 1689, 11.5</figcaption>

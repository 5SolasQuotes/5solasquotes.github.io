<main class="wrap"><figure class="quote" id="q-ec599c4d3d" data-kw="">
<blockquote><p>That infants may possess the root and principle of faith is clear both from the principle of reason (of which they are capable, although not of reasoning) and from the condition in which those infants must have been who should have descended from Adam if he had continued in his primeval integrity, in whom certainly there would have existed from the womb an innate purity—a principle and root of assent to every word of God, which would have put itself forth in due time; and likewise from the opposing root of sin that now lies hid in the infant soul. …

This is no more incomprehensible (ακαταληρτον) than how either innate purity should have existed in children descended from Adam in a state of innocence if he had continued in his integrity, or how sin, not only in respect of guilt but also in respect of inherent corruption, should exist in children descended from Adam in his fallen state, or how the principle of reason or laughter should now lie hid in an infant, &amp;c.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/friedrich-spanheim.html">Friedrich Spanheim</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Dubia evangelica in tres partes distributa</cite>, (Geneva, 1655-58), XXVII, § XII-XIII. Quoted in Herman Witsius, On the Efficacy and Utility of Baptism in the Case of Elect Infants whose Parents are under the Covenant (1693), trans. William Marshall, ed. J. Mark Beach in Mid-American Journal of Theology, 17 (2006), p. 144.</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/sin/original-sin.html">Original Sin</a></span></div>

This is no more incomprehensible (ακαταληρτον) than how either innate purity should have existed in children descended from Adam in a state of innocence if he had continued in his integrity, or how sin, not only in respect of guilt but also in respect of inherent corruption, should exist in children descended from Adam in his fallen state, or how the principle of reason or laughter should now lie hid in an infant, &amp;c.”

</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-0e9b8e9327" data-kw="">

<main class="wrap"><figure class="quote" id="q-e8064395f9" data-kw="">
<blockquote><p>We must therefore hold these two principles, first, that believers are called to the possession of the kingdom of heaven, so far as relates to good works, not because they deserved them through the righteousness of works, or because their own minds prompted them to obtain that righteousness, but because God justifies those whom he previously elected, (Romans 8:30.) Secondly, although by the guidance of the Spirit they aim at the practice of righteousness, yet as they never fulfill the law of God, no reward is due to them, but the term reward is applied to that which is bestowed by grace.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/john-calvin.html">John Calvin</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Commentary on a Harmony of the Evangelists</cite>, Matthew 25:35</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/adoption/privileges-of-sons.html">Privileges of Sons</a> › <a href="../topics/adoption/privileges-of-sons/heirs.html">Heirs</a></span><span class="t"><a href="../topics/good-works/merit-and-reward.html">Merit and Reward</a> › <a href="../topics/good-works/merit-and-reward/reward-of-grace-against-rome.html">Reward of grace (against Rome)</a></span></div>

</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-fdfd4585cb" data-kw="">
<blockquote><p>First, I differ from them in this, that they make eternal life the reward; … whereas Scripture uniformly proclaims that it is the inheritance which falls to us by no other right than that of free adoption.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/john-calvin.html">John Calvin</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Acts of the Council of Trent with the Antidote</cite>, Session 6, on ch. 16</span></figcaption>

<blockquote><p>Adoption is the highest privilege of the gospel. The traitor is forgiven, brought in for supper, and given the family name.</p></blockquote>

<div class="meta"><span class="t"><a href="../topics/adoption/privileges-of-sons.html">Privileges of Sons</a> › <a href="../topics/adoption/privileges-of-sons/family-of-god.html">Family of God</a></span></div>
<div class="actions"><button class="copy" data-copy="“Adoption is the highest privilege of the gospel. The traitor is forgiven, brought in for supper, and given the family name.”

— J. I. Packer, Quoted on X by @BobKellemen, Oct 24, 2019">Copy</button><a class="share" href="https://x.com/intent/post?text=%E2%80%9CAdoption+is+the+highest+privilege+of+the+gospel.+The+traitor+is+forgiven%2C+brought+in+for+supper%2C+and+given+the+family+name.%E2%80%9D%0A%0A%E2%80%94+J.+I.+Packer%2C+Quoted+on+X+by+%40BobKellemen%2C+Oct+24%2C+2019&amp;url=https%3A%2F%2F5solasquotes.github.io%2Fquote%2Fce3beb517e.html&amp;via=5Solas" target="_blank" rel="noopener">Share on X</a><a class="perma" href="../quote/ce3beb517e.html">Permalink</a><a class="src" href="https://x.com/BobKellemen/status/1187442405538009095" rel="noopener" target="_blank">Read it online · X</a></div>
</figure><figure class="quote" id="q-ae28ff4efe" data-kw="">
<blockquote><p>For though it may be easy to object, that the reward was laid up with a view to their future merits, any person who will candidly examine the words must acknowledge that there is an implied commendation of the grace of God. Nay more, Christ does not simply invite believers to possess the kingdom, as if they had obtained it by their merits, but expressly says that it is bestowed on them as heirs.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/john-calvin.html">John Calvin</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Commentary on a Harmony of the Evangelists</cite>, Matthew 25:34</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/adoption/privileges-of-sons.html">Privileges of Sons</a> › <a href="../topics/adoption/privileges-of-sons/heirs.html">Heirs</a></span><span class="t"><a href="../topics/good-works/merit-and-reward.html">Merit and Reward</a> › <a href="../topics/good-works/merit-and-reward/reward-of-grace-against-rome.html">Reward of grace (against Rome)</a></span></div>
<div class="actions"><button class="copy" data-copy="“For though it may be easy to object, that the reward was laid up with a view to their future merits, any person who will candidly examine the words must acknowledge that there is an implied commendation of the grace of God. Nay more, Christ does not simply invite believers to possess the kingdom, as if they had obtained it by their merits, but expressly says that it is bestowed on them as heirs.”

— John Calvin, Commentary on a Harmony of the Evangelists, Matthew 25:34">Copy</button><a class="share" href="https://x.com/intent/post?text=%E2%80%9CFor%20though%20it%20may%20be%20easy%20to%20object%2C%20that%20the%20reward%20was%20laid%20up%20with%20a%20view%20to%20their%20future%20merits%2C%20any%20person%20who%20will%20candidly%20examine%20the%20words%20must%20acknowledge%20that%20there%20is%20an%20implied%20commendation%20of%20the%20grace%20of%20God.%20Nay%20more%2C%20Christ%20does%20not%20simply%20invite%20believers%20to%20possess%20the%20kingdom%2C%20as%20if%20they%20had%20obtained%20it%20by%20their%20merits%2C%20but%20expressly%20says%20that%20it%20is%20bestowed%20on%20them%20as%20heirs.%E2%80%9D%0A%0A%E2%80%94%20John%20Calvin%2C%20Commentary%20on%20a%20Harmony%20of%20the%20Evangelists%2C%20Matthew%2025%3A34&amp;url=https%3A%2F%2F5solasquotes.github.io%2Fquote%2Fae28ff4efe.html&amp;via=5Solas" target="_blank" rel="noopener">Share on X</a><a class="perma" href="../quote/ae28ff4efe.html">Permalink</a><a class="src" href="https://ccel.org/ccel/calvin/calcom33" rel="noopener" target="_blank">Read it online · CCEL, vol. 3</a></div>
</figure><figure class="quote" id="q-a8ad7c04ce" data-kw="adoption sonship heirs">
<blockquote><p>The other part of justification is adoption or the bestowal of a right to life, flowing from Christ’s righteousness, which acquired for us not only deliverance from death, but also a right to life by the adoption with which he endows us. For on this account, he is said to have been made under the law (hypo nomon) by an economical subjection that he might redeem us from the bondage of the law and confer upon us the adoption or the right of sons (Gal. 4:4, 5). On this, the right to life depends because “if children, then heirs” (Rom. 8:17).</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/francis-turretin.html">Francis Turretin</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Institutes of Elenctic Theology</cite>, 16.6.1</span></figcaption>

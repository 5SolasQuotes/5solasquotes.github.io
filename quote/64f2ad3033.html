<main class="wrap"><figure class="quote" id="q-64f2ad3033" data-kw="">
<blockquote><p>Thy Word (O Lord) is holy and pure, as is thine own Majesty, and being sincerely preached, worketh either to the salvation or condemnation of the hearers. And we all that are here assembled before thee at this time, are of uncircumcised hearts and ears: utterly unworthy by reason of that sin, wherein we were conceived and borne; and of those actual transgressions that we have multiplied against thy Majesty, in thought, word and deed, from our first being, until this present hour; once to set foot into thy Temple or to hear thy Word at all. Utterly unfit and unable by reason of our custom in sin, and the hardness of our hearts to profit by it, when as we hear it.

So that (Lord) we are at this time in danger, to be unprofitable hearers of thy holy Word, and by being unprofitable bearers of the same, we are in danger of thy heavy displeasure. Yet forasmuch as it hath pleased thee in mercy to command us this exercise, to appoint it to be the only ordinary means, whereby thou wilt work Faith and repentance in thy children, and the principal means whereby thou wilt increase them, to promise also graciously that thou wilt accompany the outward ministry of thy Word, with the inward grace and blessing of thy Spirit, in the hearts of them that shall be reverently and faithfully exercised in the same:

We therefore in humble obedience, to this thy holy commandment, and in full affiance and confidence in this thy gracious promise, are bold to present our selves before thee at this time: Beseeching thee in thy sons blood to wash away all our sins, so as they may never be laid to our charge again, either in the world to come to our condemnation, or at this time to bring a curse upon this our exercise.

Good Lord so sprinkle that blood of thy Son upon our consciences, that we may be assured of thy love and favour towards us in him. By it sanctify us at this time, and thy word to our uses, opening and enlightening our understanding so as we may be able to understand and conceive of thy word aright, strengthening our memories so as we may be able to remember it, softening our hard and stony hearts, so as we may be able to believe it, to yield unto it, to apply it to our own souls, to meditate and confer thereupon, to practise it in our lives, and conversations, to stir up one another to the obedience thereof.

That this our exercise may tend to the increase of our knowledge, and of our obedience, of our Faith, and of repentance, the glory of thy blessed name, and the everlasting comfort of our own souls: Hear us (O Lord) in these our requests, in what else soever thou knowest good for us, or any of thy Church: for Jesus Christ his sake our Lord and only Saviour. In whose name we continue our prayers unto thee, as he himself hath taught us, Saying,

Our Father which art in Heaven, &amp;c.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/arthur-hildersham.html">Arthur Hildersham</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The doctrine of fasting and prayer, and humiliation for sin. Delivered in sundry sermons at the fast appointed by publique authority, in the year 1625</cite>, (London: Edward Brewster, 1633), unpaginated.</span></figcaption>

<blockquote><p>Those who are strangers to prayer, their mercies are not mercies indeed to them. That threatening is fulfilled upon them, Malachi 2:2, “I will send a curse upon you, and I will curse your blessings.” Prayer will turn curses into blessing. Afflictions are part of the curse inflicted because of sin, but prayer alters the nature of them. For the sanctification of them being begged and granted, they work together for the good of them that feel them. Affliction yields “the peaceable fruits of righteousness to them that are exercised thereby,” says the Apostle.

On the other side, where prayer is not, blessings are a snare, and the good things which are received work together for the harm and ruin of those that do enjoy them. There is a spirit of slumber that has seized on them in the midst of their enjoyments. Their table, their plenty, their abundance becomes a snare “and a trap, and a stumbling block, and a recompense to them,” Romans 11:8, 9.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/nathanael-vincent.html">Nathanael Vincent</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Spirit of Prayer</cite>, (1677) in Don Kistler (ed.), The Puritans on Prayer (Morgan PA: Soli Deo Gloria, 1995), pp 155-56.</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/prayer.html">Prayer</a></span></div>

</figure><figure class="quote" id="q-d4f737bd23" data-kw="">
<blockquote><p>One of the greatest misconceptions doing the rounds today is the notion that early Covenanters were opposed to all written prayers and even to the use of the Lord’s Prayer in public worship. Samuel Rutherford helpfully reminds us that this was not the case:

[Y]et did our Church never condemn, but constantly practice the praying of that divine and Canonical prayer of our Saviour, called the Lord’s Prayer, as being commanded, Mat 6.9 Luk 11.2 in matter and manner, though affirmative precepts oblige not ad semper.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/samuel-rutherford.html">Samuel Rutherford</a></span><span class="wk"><span class="lbl">Work:</span> <cite>A Peaceable and Temperate Plea for Paul’s Presbytery in</cite>, Scotland (London, 1642), p. 326.</span></figcaption>

</figure><figure class="quote" id="q-ad8d89aeae" data-kw="">
<blockquote><p>O Jehovah! God of my salvation! Let me call upon you particularly to notice what I have just now stated, That although the prophet simply, and without hyperbole, recites the agony which he suffered from the greatness of his sorrows, yet his purpose was at the same time to supply the afflicted with a form of prayer that they might not faint under any adversities, however severe, which might befall them. We will hear him by and by bursting out into vehement complaints on account of the grievousness of his calamities; but he seasonably fortifies himself by this brief exordium, lest, carried away with the heat of his feelings, he might become chargeable with complaining and murmuring against God, instead of humbly supplicating Him for pardon. By applying to Him the appellation of the God of his salvation, casting, as it were, a bridle upon himself, he restrains the excess of his sorrow, shuts the door against despair, and strengthens and prepares himself for the endurance of the cross.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/john-calvin.html">John Calvin</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Commentary on Psalms</cite>, 88, trans. James Anderson.</span></figcaption>

<div class="actions"><button class="copy" data-copy="“O Jehovah! God of my salvation! Let me call upon you particularly to notice what I have just now stated, That although the prophet simply, and without hyperbole, recites the agony which he suffered from the greatness of his sorrows, yet his purpose was at the same time to supply the afflicted with a form of prayer that they might not faint under any adversities, however severe, which might befall them. We will hear him by and by bursting out into vehement complaints on account of the grievousness of his calamities; but he seasonably fortifies himself by this brief exordium, lest, carried away with the heat of his feelings, he might become chargeable with complaining and murmuring against God, instead of humbly supplicating Him for pardon. By applying to Him the appellation of the God of his salvation, casting, as it were, a bridle upon himself, he restrains the excess of his sorrow, shuts the door against despair, and strengthens and prepares himself for the endurance of the cross.”

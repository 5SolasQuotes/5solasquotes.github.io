<blockquote><p>We have learned from none others the plan of our salvation, than from those through whom the Gospel has come down to us, which they did at one time proclaim in public, and, at a later period, by the will of God, handed down to us in the Scriptures, to be the ground and pillar of our faith.</p></blockquote>

<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/particular-baptists.html">Particular Baptists</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Second London Baptist Confession of Faith</cite>, 1689, 1.1, 1.6</span></figcaption>

</figure><figure class="quote" id="q-27a9e0c727" data-kw="">
<blockquote><p>As all were not true prophets, the Apostle here declares that they ought to have been examined and tried. And he addresses not only the whole Church, but also every one of the faithful. … That we may then be fit judges, we must necessarily be endowed with and directed by the Spirit of discernment. But as the Apostle would have commanded this in vain, were there no power of judging supplied, we may with certainty conclude, that the godly shall never be left destitute of the Spirit of wisdom as to what is necessary, provided they ask for him of the Lord.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/john-calvin.html">John Calvin</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Commentaries on the Catholic Epistles</cite>, 1 John 4:1</span></figcaption>

</figure><figure class="quote" id="q-6013b2a7fb" data-kw="">
<blockquote><p>Unless I am refuted and convicted by testimonies of the Scriptures or by clear arguments (since I believe neither the Pope nor the Councils alone; it being evident that they have often erred and contradicted themselves), I am conquered by the Holy Scriptures quoted by me, and my conscience is bound in the word of God: I can not and will not recant any thing, since it is unsafe and dangerous to do any thing against the conscience. … Here I stand. [I can not do otherwise.] God help me! Amen.</p></blockquote>

<main class="wrap"><figure class="quote" id="q-1a4990e9ac" data-kw="">
<blockquote><p>Also, “he is not willing that any should perish, but that all should come to repentance,” 2 Pet. iii. 9, even all those towards whom he exercises patience and long-suffering for that end; which, as the apostle there informs us, is ” to us-ward,”— that is, to believers, of whom he is speaking. Of them, also, it is said that he doth not afflict willingly nor grieve the children of men,” Lam. iii. 33, even his church, of which the prophet is speaking; although this also may be extended to all, God never afflicting or grieving men but it is for some other reason and cause than merely his own will, their destruction being of themselves.

David, indeed, tells us that “the Lord is gracious, and full of compassion; slow to anger, and of great mercy;” that “the Lord is good to all ; and his tender mercies are over all his works,” Ps. cxlv, 8, 9 : but he tells us withal whom he intends by the “all” in this place, even the “generations which praise his works and declare his mighty acts,” verse 4; those who “abundantly utter the memory of his great goodness, and sing of his righteousness,” verse 7; or his “saints,” as he expressly calls them, verse 10. The work he there mentions is the work of the kingdom of Christ over all, wherein the tender mercies of God are spread abroad in reference to them that do enjoy them. Not but that God is good to all, even to his whole creation, in the many unspeakable blessings of his providence, wherein he abounds towards them in all goodness, but that is not here intended.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/john-owen.html">John Owen</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Vindiciæ Evangelicæ; or, The Mystery of the Gospel Vindicated and Socinianism Examined</cite>, (Oxford, 1655) in William H. Goold (ed.), The Works of John Owen (1850-53; Edinburgh: Banner of Truth, 1966), xii, 559-60.</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/worship/psalmody.html">Psalmody</a></span></div>

David, indeed, tells us that “the Lord is gracious, and full of compassion; slow to anger, and of great mercy;” that “the Lord is good to all ; and his tender mercies are over all his works,” Ps. cxlv, 8, 9 : but he tells us withal whom he intends by the “all” in this place, even the “generations which praise his works and declare his mighty acts,” verse 4; those who “abundantly utter the memory of his great goodness, and sing of his righteousness,” verse 7; or his “saints,” as he expressly calls them, verse 10. The work he there mentions is the work of the kingdom of Christ over all, wherein the tender mercies of God are spread abroad in reference to them that do enjoy them. Not but that God is good to all, even to his whole creation, in the many unspeakable blessings of his providence, wherein he abounds towards them in all goodness, but that is not here intended.”

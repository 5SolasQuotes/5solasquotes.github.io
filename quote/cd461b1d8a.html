<main class="wrap"><figure class="quote" id="q-cd461b1d8a" data-kw="">
<blockquote><p>You may remember that I said (a word perhaps that some think much of) that the question betwixt us and Rome is not whether we be justified by faith or no? But whether we be justified at all; I will make it good. There are two graces, righteousness imputed, which implies forgiveness of sins; and righteousness inherent, which is that grace of sanctification begun. They utterly deny that there is any righteousness but righteousness inherent. They say forgiveness of sins is nothing but sanctification. A new doctrine never heard of in the Church of God, till these last days, till the spawn of the Jesuits devised it. Forgiveness of sin is this, that God will never charge me with it again. They say that forgiveness of sin is an abolishing of sin in the subject, where is true remission; as much as to say, There is no justification distinct from sanctification: whereas the apostle distinguishes them, when as he says, ‘The Son of God is made unto us wisdom, righteousness, sanctification and redemption’: ‘He is made unto us’ (of God). By the way let me expound it unto you. Christ has three offices; A Prophetical, Regal and Sacerdotical office… The work of Christ’s priestly office is to be a propitiation for our sins; sanctification proceeds from the scepter of his kingdom: The one is without me, the other within me. The one receives degrees, the other not. As a man that is holy may be more holy; but imputed righteousness does not more forgive one man than another. Imputation is without augmentation or diminution. Those things which have diverse contraries, cannot be one and the same thing. Justification and sanctification have diverse contraries. The contrary to justification is condemnation; but the contrary to sanctification is wickedness, and false-dealing, etc. Aristotle distinguishes homonymous words and bids you consider their contraries; thus you see the difference between these two.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/james-ussher.html">James Ussher</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Eighteen Sermons preached in Oxford, 1640, of conversion, unto God, of redemption &amp; justification, by Christ (London: 1660) | 16th Sermon, on Rom. 5:1</cite>, pp. 421-23</span></figcaption>

</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-f455066f86" data-kw="">
<blockquote><p>26. Therefore, every true Christian who has actually returned into the grace of God, being now constituted in a state of grace, has a twofold righteousness—not acquired by his own free will or the powers of nature, but given to him by God through Christ—and both are necessary for his salvation: one imputed, the other inherent. The imputed is that which Christ has performed for him, to satisfy for all sins committed by him throughout his whole life; the inherent is that by which, through divine grace in Christ, he begins inwardly more and more to cease from sins to be committed hereafter, and strives most diligently to observe the divine law exactly. For by that imputed righteousness of Christ he is not freed from the keeping of the law, but rather bound to it more closely.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/william-bradshaw.html">William Bradshaw</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Dissertation on the Doctrine of Justification, in which a plain way is built up to the concord of them which vary on this thing (d. 1618; Leiden, 1684), trans. ChatGPT-5</cite>, ch. 24, ‘Of the Effects of Justification’; sect. 26, pp. 114-15</span></figcaption>

<blockquote><p>5. Our justification is not by degrees. For the sins of all of us are cast upon Christ, at the same time and once and for all. But this only applies to active justification; for passive justification happens so often as man is repenting his sins and seizes the remission of sins by means of faith.</p></blockquote>

</figure><figure class="quote" id="q-739f9ec4ab" data-kw="">
<blockquote><p>18th Objection [by Osiander]: Christ has brought us eternal justice. This applied justice is not eternal: Therefore this is not our justice, but God Himself is our justice. Answer: The Lord is our justice, that is, our Justifier. But that our applied justice is eternal, has been showed before; because the imputation thereof is continued to all eternity. That justice also of the Law which is begun in us in this life, shall be continued, and perfected in the life to come. But that justice which is God Himself is not in us: because so God should be an accident to his creature, and become justice in man. For justice and virtue are things created in us, not the essence of God. Moreover Osiander, who obiects this, does not discern the cause from the effect. As we live not, or are wise by the essence of God (for this is all one, as to say, that we are as wise as God) so also we are not just by the essence of God. Wherefore nothing is more impious than to say that the essential justice of the Creator is the justice of the creatures: for thereof it would follow, that we have the justice of God, yea the very essence of God. The cause must be discerned from the effect, increate iustice from created justice.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/zacharias-ursinus.html">Zacharias Ursinus</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Sum of Christian Religion: Delivered… in his Lectures upon the Catechism… tr. Henrie Parrie (Oxford, 1587), ‘Of Justification’, 7. ‘Why Christ’s satisfaction is made ours by faith only’, ‘Objections against this Doctrine of Justification’</cite>, p. 691</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/justification/nature-of-justification.html">Nature of Justification</a></span><span class="t"><a href="../topics/justification/twofold-justification.html">Twofold Justification and Its Increase</a></span></div>

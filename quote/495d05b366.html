<main class="wrap"><figure class="quote" id="q-495d05b366" data-kw="">
<blockquote><p>40. …by reason of the will of God Himself revealed in his Word, we must not only suffer and be content that those do rule which are set over their own [civil] territories, whether by hereditary, or by elective right; but also to love them, fear them, and with all reverence and honour embrace them as the ambassadors and ministers of the most high and good God, being in his stead…</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/george-gillespie.html">George Gillespie</a></span><span class="wk"><span class="lbl">Work:</span> <cite>111 Propositions... (London, 1647)</cite></span></figcaption>
<div class="meta"><span class="t"><a href="../topics/worship/posture-and-gestures.html">Posture and Gestures</a></span></div>

</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-a9be409335" data-kw="">
<blockquote><p>Wherefore they are called upon to declare their joy and gladness by ‘clapping their hands’; which is a gesture expressive of exultation and joy; see Psalm 98:8, Nahum 3:19. It was used at the unction and coronation of a king, 2 Kings 11:12; and so very proper to be used on occasion of the Messiah being made or declared Lord and Christ, as he was at his ascension, Acts 2:36.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/john-gill.html">John Gill</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Commentary on Psalm 47, verse 1</cite></span></figcaption>
<div class="meta"><span class="t"><a href="../topics/worship/posture-and-gestures.html">Posture and Gestures</a></span></div>
<div class="actions"><button class="copy" data-copy="“Wherefore they are called upon to declare their joy and gladness by ‘clapping their hands’; which is a gesture expressive of exultation and joy; see Psalm 98:8, Nahum 3:19. It was used at the unction and coronation of a king, 2 Kings 11:12; and so very proper to be used on occasion of the Messiah being made or declared Lord and Christ, as he was at his ascension, Acts 2:36.”

— John Gill, Commentary on Psalm 47, verse 1">Copy</button><a class="share" href="https://x.com/intent/post?text=%E2%80%9CWherefore+they+are+called+upon+to+declare+their+joy+and+gladness+by+%E2%80%98clapping+their+hands%E2%80%99%3B+which+is+a+gesture+expressive+of+exultation+and+joy%3B+see+Psalm+98%3A8%2C+Nahum+3%3A19.+It+was+used+at+the+unction+and+coronation+of+a+king%2C+2+Kings+11%3A12%3B+and+so+very+proper+to+be+used+on+occasion+of+the+Messiah+being+made+or+declared+Lord+and+Christ%2C+as+he+was+at+his+ascension%2C+Acts+2%3A36.%E2%80%9D%0A%0A%E2%80%94+John+Gill%2C+Commentary+on+Psalm+47%2C+verse+1&amp;url=https%3A%2F%2F5solasquotes.github.io%2Fquote%2Fa9be409335.html&amp;via=5Solas" target="_blank" rel="noopener">Share on X</a><a class="perma" href="../quote/a9be409335.html">Permalink</a><a class="src" href="https://reformedbooksonline.com/posture-in-prayer/#:~:text=Wherefore%20they%20are%20called%20upon%20to,was%20at%20his%20ascension%2C%20Acts%202%3A36." rel="noopener" target="_blank">Read it online · Reformed Books Online</a></div>
</figure><figure class="quote" id="q-1e3e039a49" data-kw="">
<blockquote><p>You [the episcopalian adversary] fall next to censure ‘the posture of sitting in time of public prayer, as very irreverent.’ Sir, not to detain you, I am not far from your opinion: For my own part, and I have many of our way assenting, I dislike sitting in prayer (if infirmity and other great inconveniences do not hinder it)… so I cannot but disagree from you in your overprizing and exacting the postures that you plead for: for though I am convinced that there is an indecency, and other inconveniences in sitting, for which I wish that wherever it may be, it were wholly disused, yet I am far from offending at, let be imposing upon these who of no intended irreverence, but for the most part from a just disgust of the too great weight has been laid upon such circumstances, do innocently practice it… So there are also upon record, such clear instances of an undetermined liberty in these matters, apparent enough in our Lord, his disciples and company, their ordinary sitting down to meat, and blessing and giving thanks in that posture, that I cannot but strange at your bringing any of these practices under an obligation…</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/robert-macward.html">Robert MacWard</a></span><span class="wk"><span class="lbl">Work:</span> <cite>pp. 70-71 of ‘The Second Dialogue’ in The True Non-Conformist (1671)</cite></span></figcaption>
<div class="meta"><span class="t"><a href="../topics/worship/posture-and-gestures.html">Posture and Gestures</a></span></div>

</figure><figure class="quote" id="q-fea30d9bc7" data-kw="">
<blockquote><p>And by this posture [lifting up his eyes] did [Christ] testify the heavenly and depending frame of his spirit. 4. Albeit the Lord know the most secret desires of the heart, and do respect and hear the very thoughts of his people, yet it is their duty, as they have opportunity, to make use of their tongue in prayer, that so they may do Him homage with the whole man, may, by that means (among others) excite their own affections in prayer and may edify others in their place and station, for some (at least) of these causes it is that Christ in prayer spake in the audience of his disciples, ‘He lift up his eyes, and said,’ and by his practice and example would teach us our duty.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/george-hutcheson.html">George Hutcheson</a></span><span class="wk"><span class="lbl">Work:</span> <cite>An Exposition of the Gospel of Jesus Christ, According to John (London, 1657) | on Jn.</cite>, 17:1</span></figcaption>

</figure><figure class="quote" id="q-9cfa4ce655" data-kw="">
<blockquote><p>…one of our doctors objects that we lift up our eyes and our hands to heaven and worship God, yet do not worship the heaven: that a man going to bed prays before his bed: that David offered the sacrifices of thanksgiving in the presence of all the people, Ps. 116, that Paul having taken bread gave thanks before all them who were in the ship, Acts 27:35, that the Israelites worshipped before Moses and Aaron, Ex. 4:31. Hereupon another doctor harping on the same string tells us that when we kneel in the act of receiving the sacrament, we kneel no more to bread than to the pulpit when we join our prayers with the ministers. Oh, unworthy instances and reproachful to doctors! All these things were and are accidentally present to the worshippers and not purposely before them, not respected as having a religious state in the worship. What? do we worship before the bread in the sacrament even as before a pulpit, a bed, etc? Nay, graduate men should understand better what they speak of.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/george-gillespie.html">George Gillespie</a></span><span class="wk"><span class="lbl">Work:</span> <cite>English-Popish Ceremonies (1637) | pt. 3, ch. 4</cite>, p. 73</span></figcaption>

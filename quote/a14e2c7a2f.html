<main class="wrap"><figure class="quote" id="q-a14e2c7a2f" data-kw="">
<blockquote><p>…will I join a most godly ancient bishop, whose Greek epistle being sent to John, bishop of Jerusalem, Jerome did translate into Latin; his name is Epiphanius. The words of the epistle are these: ‘…Wherein we do learn all these godly lessons: First, that no place ought to be given in the church of Christ to those things that are against the authority of the holy Scriptures. Secondly, that to give place in the church of Christ unto images, it is against the authority of the holy Scriptures, that is, of that law, which says: Thou shalt not make to thyself any graven image. Thirdly that not only graven and molten images, and such as be set up on high, upon or over the altars, but also the painted images ought to be cast out of the churches. Fourthly that the image of Christ Himself ought in no wise to stand in the church, because that of all other it is most perilous and breeds the greatest idolatry. Fifthly that the images ought to be caste out of the church of Christ, not only by sedulity and diligence of doctrine, but also by very fact and deed. Sixthly, that they ought not coldly, but with a fervent and earnest zeal of the true religion be put done, defaced, and broken all to pieces, as we do see this holy man of God Epiphanius to have rent and torn in pieces the vail that had the image of Christ painted, which he did being moved with the zeal of God. Seventhly, that it is the part and duty of bishops, to see that images be not set up in the church of Christ. Last of all, that it is a mere scrupulosity and superstition, unseemly for the church and the faithful people of God to have images.’ Here may we see that this godly ancient bishop did much differ in judgment from those fond persons that think it to be a profitable thing for the people of God to have images standing in the churches. Let them weigh these things that have always the fathers in their mouths, and so let them learn that it is more honesty for us to be called iconoclastae, that is, image breakers, than to be called iconoplastae, that is, image makers, and that we do approach nearer to the example of the old ancient church than they do, although they brag and boast themselves to be catholic and apostolic.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/john-veron.html">John Veron</a></span><span class="wk"><span class="lbl">Work:</span> <cite>A Strong Battery against the Idolatrous Invocation of the Dead Saints, and Against the having or setting up of Images</cite>, … (London: Sutton, 1562), pp. 92-93</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/worship/idolatry-and-images.html">Idolatry and Images</a></span></div>

</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-49f3ff8527" data-kw="">
<blockquote><p>Idolatry is not to picture any historical thing, but to worship or adore an image. This indeed they have not made who have sometimes in our Bibles conjoined pictured histories with the narratives… For instance, at Ex. 3:2-3 a picture of the bramble bush is certainly represented, in which Jehovah appeared, but there is no likeness or image of Jehovah, who appeared in the bramble bush. The bramble bush is indeed one thing, God appearing in the bramble bush another.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/johann-heinrich-heidegger.html">Johann Heinrich Heidegger</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Mound of the Council of Trent</cite>, … where is a Historical-Theological Anatomy of the Council of Trent... (Zurich: Gessner, 1690), vol. 2, ‘Of Sacred Images’, p. 897 top</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/worship/idolatry-and-images.html">Idolatry and Images</a></span></div>

</figure><figure class="quote" id="q-34b5e65b7d" data-kw="against invocation of saints">
<blockquote><p>The question is not whether the saints piously dying in the Lord are to be held in any respect and honor. We do not deny that they are to be honored by us according to the degree of their excellence, both by thinking highly of them as servants of God most happy and admitted into the fellowship of the Lord and by cherishing their memory with a grateful and pleasant recollection, extolling their conflicts and victories, preserving their doctrine, celebrating and imitating their virtues (Heb. 12:1), praising God in and for them. Rather the question is whether they are to be reverenced with religious worship properly so called. This our opponents wish; we deny.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/francis-turretin.html">Francis Turretin</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Institutes of Elenctic Theology</cite>, 11.9 / on invocation</span></figcaption>

</figure><figure class="quote" id="q-af2a076485" data-kw="Mary Queen of Heaven Idolatry">

</figure><figure class="quote" id="q-27bfb2857b" data-kw="">
<blockquote><p>Whereunto it was replied that then Cassander’s images (not for adoration, but for information and incitement) are not Popish, which the Rejoinder does not only grant, but also proves it, by the consent of Calvin himself (Institutes, book 1, ch. 11, sect. 12), where he says, that historical images, or pictures, may have some use, in teaching, and putting, in remembrance. Now for this, let it be considered that Calvin in that section speaks only of ordinary pictures for teaching and putting in remembrance of that which they represent of themselves, without any ecclesiastical institution, as certain words written do signify a certain meaning without any special institution. Such (it may be) would be the picture of Ananias in a white surplice, signifying with other pictures agreeable to the story, that Paul esteemed and called him a whited wall (Acts 23:3). But in the very next section, which is the thirteenth, Calvin, disputing against setting up of any images in churches, does sufficiently declare that he allowed of no ceremonial religious use of images, such as is of our cross and surplice.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/william-ames.html">William Ames</a></span><span class="wk"><span class="lbl">Work:</span> <cite>A Fresh Suit Against Human Ceremonies in God’s Worship, ‘An Addition of the two last reasons of the former reply’</cite>, pp. 283-84 (1633)</span></figcaption>

<div class="actions"><button class="copy" data-copy="“Whereunto it was replied that then Cassander’s images (not for adoration, but for information and incitement) are not Popish, which the Rejoinder does not only grant, but also proves it, by the consent of Calvin himself (Institutes, book 1, ch. 11, sect. 12), where he says, that historical images, or pictures, may have some use, in teaching, and putting, in remembrance. Now for this, let it be considered that Calvin in that section speaks only of ordinary pictures for teaching and putting in remembrance of that which they represent of themselves, without any ecclesiastical institution, as certain words written do signify a certain meaning without any special institution. Such (it may be) would be the picture of Ananias in a white surplice, signifying with other pictures agreeable to the story, that Paul esteemed and called him a whited wall (Acts 23:3). But in the very next section, which is the thirteenth, Calvin, disputing against setting up of any images in churches, does sufficiently declare that he allowed of no ceremonial religious use of images, such as is of our cross and surplice.”

— William Ames, A Fresh Suit Against Human Ceremonies in God’s Worship, pp. 283-84 (1633)">Copy</button><a class="share" href="https://x.com/intent/post?text=%E2%80%9CWhereunto+it+was+replied+that+then+Cassander%E2%80%99s+images+%28not+for+adoration%2C+but+for+information+and+incitement%29+are+not+Popish%2C+which+the+Rejoinder+does+not+only+grant%2C+but+also+proves+it%2C+by+the+consent+of+Calvin+himself+%28Institutes%2C+book+1%2C+ch.+11%2C+sect.+12%29%2C+where+he+says%2C+that+historical+images%2C+or+pictures%2C+may+have+some+use%2C+in+teaching%2C+and+putting%2C+in+remembrance.+Now+for+this%2C+let+it+be+considered+that+Calvin+in+that+section+speaks+only+of+ordinary+pictures+for+teaching+and+putting+in+remembrance+of+that+which+they+represent+of+themselves%2C+without+any+ecclesiastical+institution%2C+as+certain+words+written+do+signify+a+certain+meaning+without+any+special+institution.+Such+%28it+may+be%29+would+be+the+picture+of+Ananias+in+a+white+surplice%2C+signifying+with+other+pictures+agreeable+to+the+story%2C+that+Paul+esteemed+and+called+him+a+whited+wall+%28Acts+23%3A3%29.+But+in+the+very+next+section%2C+which+is+the+thirteenth%2C+Calvin%2C+disputing+against+setting+up+of+any+images+in+churches%2C+does+sufficiently+declare+that+he+allowed+of+no+ceremonial+religious+use+of+images%2C+such+as+is+of+our+cross+and+surplice.%E2%80%9D%0A%0A%E2%80%94+William+Ames%2C+A+Fresh+Suit+Against+Human+Ceremonies+in+God%E2%80%99s+Worship%2C+pp.+283-84+%281633%29&amp;url=https%3A%2F%2F5solasquotes.github.io%2Fquote%2F27bfb2857b.html&amp;via=5Solas" target="_blank" rel="noopener">Share on X</a><a class="perma" href="../quote/27bfb2857b.html">Permalink</a><a class="src" href="https://reformedbooksonline.com/topics/topics-by-subject/worship/religious-images-in-worship/#:~:text=Whereunto%20it%20was%20replied%20that%20then,is%20of%20our%20cross%20and%20surplice&amp;text=Whereunto%20it%20was%20replied%20that%20then%20Cassander%E2%80%99s%20images&amp;text=such%20as%20is%20of%20our%20c

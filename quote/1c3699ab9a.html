<main class="wrap"><figure class="quote" id="q-1c3699ab9a" data-kw="">
<blockquote><p>5. Good works are no less necessary as they are our walking in the way which leads to heaven. Jesus Christ is the way (John 14:6). Faith and holiness are our walking in Him as the way. This way, accordingly, is called “the way of holiness,” or “the holy way” (Isaiah 35:8), inasmuch as none can walk in Christ other than by faith, and by that holiness of heart and life which is “the obedience of faith.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/john-colquhoun.html">John Colquhoun</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Other citations (work not named)</cite>, p. 327 of Section 2, ‘Of the Necessity of Good Works’ in ch. 12, ‘Of the Nature, Necessity &amp; Desert of Good Works’, in A Treatise on the Law and the Gospel (Edinburgh, 1819)</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/good-works/necessity-of-good-works.html">Necessity of Good Works</a></span></div>

</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-cf37093ac5" data-kw="">
<blockquote><p>[The means of happiness are reckoned among] Those pious acts of man which are necessary for the obtaining thereof, especially those that directly and immediately have God for their object. Whether these actions have a relation of efficiency to that happiness, under which notion we conceive of means ordinarily, and perhaps not amiss in this case, if we speak of happiness as it signifies that future state of glory: Or whether rather those actions are parts of it, etc. happiness itself, etc.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/john-stoughton.html">John Stoughton</a></span><span class="wk"><span class="lbl">Work:</span> <cite>as given in Richard Baxter, Richard Baxter’s Confession of his Faith</cite>, … (London: 1655), ch. 3, pp. 397-98 Stoughton (1593?–1639) | A Learned Treatise, pt. 1, The Definition, p. 27</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/good-works/necessity-of-good-works.html">Necessity of Good Works</a></span></div>

<blockquote><p>We are created unto good works which God hath ordained, that we should walk in them as the elect vessels of God, not thereby to merit salvation, but to signify unto the world that we be the elect of God, who being possessed with faith, show forth the fruits of faith, which are our good works, to the example of others, that they may follow in well-doing.</p></blockquote>

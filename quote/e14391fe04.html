<main class="wrap"><figure class="quote" id="q-e14391fe04" data-kw="">
<blockquote><p>Davenant recognized that if God wills the means of salvation to be procured for the reprobate, then God’s intention to save appears thwarted. Does this not imply that God’s will is ineffectual because of God’s universal desire to save all? Davenant responds to God’s apparent impotence by noting that God oftentimes obtains (and sometimes actually grants) the means to an end wherein the end is never attained. Davenant appeals to the scholastic distinction between providence and predestination employed by Aquinas. (Davenant, De Morte Christi, in DD, 23 (370); Davenant, Sententia de Gallicana controversia, in DD, fol. Ii4v. Cf. Aquinas, [Disputed Questions,] De Veritate, in CT, q. 6 [on Predestination] a. 2 co. [actually art. 3, body]) Providence is a general appointment of a thing toward an end (universaliter ordinationem in finem), whereas predestination represents the outcome or result of an ordering (exitum vel eventum ordinis). Predestination differs from providence in that “not everything that is ordained to an end [as in providence] reaches that end.” (Aquinas, De Veritate, in CT, q. 6 a. 2 co. [actually art. 3, body]) Like providence, then, the evangelical covenant is grounded upon an ordination to an end that does not infallibly obtain. God has ordained that Christ make a universal satisfaction on condition of belief, which condition being not always fulfilled, necessitates that not all are forgiven. This evangelical covenant, which displays the “freedom, mercy, and justice of God,” is made, consonant with God’s general love for mankind, between humanity and God promising the saving benefits of Christ to those who repent and believe.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/john-davenant.html">John Davenant</a></span><span class="wk"><span class="lbl">Work:</span> <cite>On John Davenant &amp; Aquinas | Michael Lynch, John Davenant’s Hypothetical Universalism: a Defense of Catholic &amp; Reformed Orthodoxy (Oxford Univ. Press, 2021)</cite>, p. 138</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/effectual-calling/efficacious-grace.html">Efficacious Grace</a></span></div>

</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-05567d1ee7" data-kw="">
<blockquote><p>When God ‘foreordains’ a sinner ‘to everlasting death,’ He decides to leave him in the sin which deserves everlasting death and results in it. The non-elect sinner has experienced the operation of common grace. It is an error to say that God shows no kind or degree of mercy to the non-elect. But he has resisted and defeated it. God decides to proceed no further with him by the bestowment of that special grace which regenerates, and ‘makes willing in the day of God’s power.’ The elect sinner has also experienced, resisted, and defeated common grace. God decides to proceed further with him, by effectual calling and regeneration.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/william-g-t-shedd.html">William G.T. Shedd</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Calvinism: Pure &amp; Mixed (NY: 1893)</cite>, ch. 3, pp. 19-20</span></figcaption>

</figure><figure class="quote" id="q-d562dd76f8" data-kw="">
<blockquote><p>Whether we can Resist the Grace of God, or No? But now arises an other doubt as touching our nature as it is now fallen and corrupt, whether it can resist the grace of God and his Spirit being present, or no? (There are sundry degrees of grace of God) I think we must consider that there are, as it were, sundry degrees of the help or grace of God: for his might and abundance is sometimes so great that He wholly bows the will of man and does not only counsel, but also persuade. And when it so comes to pass, we cannot depart from the right way, but we are of God’s side and obey his sentence. Wherefore it was said unto Paul: “It is hard for thee to kick against the pricks.</p></blockquote>

</figure><figure class="quote" id="q-74b4201285" data-kw="">
<blockquote><p>First, whether may a wicked man, a man as yet not called, be able to resist and keep off his own call? And that you may understand the answer hereto, I must lay down this distinction: that there is a twofold calling of Christ: a significative calling, and an operative calling. First, a significative calling, which is such a calling whereby Christ, in the ministry of the Word, signifies and declares what He would have men to do. Now this kind of call wicked men may resist; this call, I say, and this revealed will of God, in declaring what graces he would have men act, and what sins he would have men forbear. Therefore we read, Acts 7:51, “You stiff-necked people, and uncircumcised in heart and ears, you have always resisted the Holy Ghost”; meaning the preaching of the Word by the ministry of his apostles. So Prov. 1:24, ‘I have called, and ye have refused,’ etc. But then secondly, there is an operative calling, and that is such a call whereby God does not only signify to a man what he must do, but with the signification of his will gives a man a power to do what He calls him to do, accompanying the Word with his Spirit, making the heart stoop and yield to Jesus Christ. Now this call no man can resist; grace is irresistible; and this effectual calling, by the operation of the Spirit, a man cannot resist. All the gainsayings of the heart, and all the stoutness of the will, it must stoop and must be brought under subjection to Jesus Christ. Jn. 6:37, ‘All that the Father hath given Me,’ says Christ, ‘shall come unto Me.’ They shall not be able to withstand Jesus Christ, but they shall come in unto Him. So Isa. 55:10–11: ‘As the rain comes down, and the snow from heaven, and returns not thither again, but waters the earth, to make it bring forth… so shall my word be that goes out of my mouth; it shall not return in vain, but shall accomplish that which I intended, and it shall prosper in the thing whereto I sent it.’ As all the world cannot hinder the rain from coming down on the earth, no more can any man in the world, if God has an intent to convert and call him, hinder the benefit of the Word from redounding upon his soul.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/christopher-love.html">Christopher Love</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Treatise of Effectual Calling &amp; Election... (London: Rothwell, 1653), Sermon 5, on 2 Pet. 1:10</cite>, pp. 64-65</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/effectual-calling/efficacious-grace.html">Efficacious Grace</a></span></div>

<blockquote><p>God’s stretching out his hands” is all one with his call, (Prov. 1:24); but all men are not called after the same rate as the called according to purpose: wherefore, this place proves not, that the workings of grace as to the elect are resistible; but that the offers of grace as to the non-elect are serious, God in the means really spreading out his arms of grace unto them. Again: they [the Remonstrants] urge that of our Savior, “These things I say, that you might be saved,” (John 5:34); which words were spoken to them, which “would not come to Christ,” (ver. 40); but that the Holy Spirit spoke as inwardly and powerfully to them, as to the elect who” hear and learn of the Father;” what chemistry can extract it out of this text? or from what other scripture can it be demonstrated? God” commands the light to shine out of darkness in some hearts,” (2 Cor. 4:6); but does He so in all? Whence then are those blinded ones? (ver. 4). If there be any such, where is the Remonstrants’ equality of grace? Where, when they say, that illumination is wrought irresistibly? These things cannot consist together. Wherefore our Savior’s words show not forth the weakness or separableness of grace as to the elect, but the true end and scope of Christ’s preaching as to the non-elect; what he spoke to them was in order to their salvation… wherefore this place proves not I that the working of grace in the elect is resistible, but it signally shows forth the nature, of divine ordinances. Every ordinance is an ordinance from the will of God; it is an appointment dropped down from heaven; it is divinely destinated eis oikodomen, for edification and not for destruction… John’s baptism was not a mere external sign or shadow, but imported God’s ordinative counsel to bring men to repentance; it was eis matanoian, to repentance, as its proper end, (Mt. 3:11). Gospel-preaching is not a mere sound or voice of words, but it imports God’s ordinative counsel to turn men unto himself. Hence every true minister is said to stand. in God’s counsel, and for this very end, to turn them from the evil of their doings, (Jer. 22:22). Every ordinance speaks an ordinative counsel for some spiritual end, a serious ordination for the good of souls.</p></blockquote>

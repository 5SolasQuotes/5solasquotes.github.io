<main class="wrap"><figure class="quote" id="q-fe5f29ba12" data-kw="">
<blockquote><p>We complain that the whole doctrine of godliness is adulterated by impious dogmas; that the whole worship of God is vitiated by foul and disgraceful superstitions; that the pure institution of the sacraments has been supplanted by horrible sacrilege; that their use has been converted into a profane trafficking</p></blockquote>
<figcaption>— <a href="../authors/john-calvin.html">John Calvin</a>, <cite>Acts of the Council of Trent with the Antidote</cite>, p. 20</figcaption>
<div class="meta"><a class="tag" href="../topics/rome/sacraments.html">Rome: Sacraments</a><a class="tag" href="../topics/worship/idolatry-and-images.html">Idolatry and Images</a></div>

</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-ddf34f9955" data-kw="">
<blockquote><p>The many portentous idolatries by which the Church of God is deformed — the many defilements of superstitions — the many profanations of sacred things — the vast sink of errors must not be touched. There is to be no diminution of the tyrannical yoke of impious laws by which miserable consciences have been ensnared; but all who desire any change are to be judged heretics.</p></blockquote>
<figcaption>— <a href="../authors/john-calvin.html">John Calvin</a>, <cite>Acts of the Council of Trent with the Antidote</cite>, On the Decree concerning Residences</figcaption>

</figure><figure class="quote" id="q-84de3e55fc" data-kw="">
<blockquote><p>For this I affirm (and would that I could not, for such just causes, affirm it): that white does not more oppose black than Papism opposes Christianity; which I have now resolved to prove in a few words. Nor do I here dispute about their crimes and most abandoned morals, but I aim at the very throat of the cause, namely their doctrine, than which I affirm that nothing more impure or corrupt can even be feigned.</p></blockquote>
<figcaption>— <a href="../authors/theodore-beza.html">Theodore Beza</a>, <cite>The Christian Faith</cite>, ch. 7, art. 1</figcaption>

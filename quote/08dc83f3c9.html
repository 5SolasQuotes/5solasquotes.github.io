<main class="wrap"><figure class="quote" id="q-08dc83f3c9" data-kw="">
<blockquote><p>The use of instruments in worship was admittedly part of the Temple service. It had no place in the Tabernacle before David’s day, beyond the use of two silver trumpets made by Moses, in the hands of the priests. There is not a particle of evidence to show that it entered into the ordinary worship of the family or the synagogue. We are now prepared to take a step further, and note that, in the Temple service, it was uniformly and most closely associated with sacrifice and the burning of incense. …[T]he playing on instruments was confined to those bands of Levites whom David was training in anticipation of the building of the temple—these acting in this for and as representing the whole people. …1 Chron xxiii.26–32. It is very plain from this passage that the service of praise as conducted by the Levitical choirs with musical accompaniment, was associated with the regular morning and evening sacrifice, and with other sacrifices.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/robert-nevin.html">Robert Nevin</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Instrumental Music in Christian Worship: A Review Chiefly in the Way of Reply to Professor Wallace</cite>, 2nd edition, rev. (Londonderry: Bible and Colportage Society, 1873), 29, 30.</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/worship/musical-instruments-in-worship.html">Musical Instruments in Worship</a></span></div>

</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-830945a23e" data-kw="">
<blockquote><p>Lastly, God’s spirit works not with ceremonies, and so they are as the offering of swines’ blood and the slaying of a man; and so abomination to God, Isa. 66:3. 2. The Holy Spirit is merited to us by Christ, Jn. 16:14, “He shall receive of mine and show unto you”: but who can say that the grace of joy in the Holy Ghost, wrought by the droning of organs and the holiness taught by surplice, is a work of the spirit merited by Christ as our High Priest? 3. God has made no promise that He will work by ceremonies, for the Spirit works not without the Word; so then I might resist the working of the Spirit and not sin against the Word; and this is Anabaptists’ Enthusiasm: If God work not by them, they be vain and fruitless; and the idol is unlawful for this [reason], that ‘it profits not’. Also, the Spirit’s action is either natural or supernatural here: If natural, it is a natural work, and a natural spirit, and to be rejected: If supernatural, we may devise means to produce supernatural effects: men’s ceremonies can produce supernatural joy, comfort, peace, and acts of grace purchased to us by Christs merit; this is a miracle.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/samuel-rutherford.html">Samuel Rutherford</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Divine Right of Church Government</cite>, (1646), Question 3, ‘Whether Ceremonies Have any Divinity in Them’, p. 136</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/worship/musical-instruments-in-worship.html">Musical Instruments in Worship</a></span></div>

</figure><figure class="quote" id="q-d31aac66d3" data-kw="">
<blockquote><p>There are many who consider the use of instruments as merely an aid to singing. If Christians are commanded to sing in worship, what is wrong with using an instrument to assist the voice in carrying the tune? After all, it is argued, without an instrument to assist, many would not be able to sing the tunes properly. In other words, instruments have become a necessary aid to the practice of a Scriptural element of worship, as if congregational singing is impossible or impractical without mechanical help. Looking at it this way, some argue that instruments are a circumstance to worship, not an element regulated by Scripture, much like the building, what pulpit is used, and other things common to any kind of meeting. Even if instrumental music could be considered as an aid to worship, the Lord still strictly controls what aids are allowed in His worship. The Israelites, in their zeal to offer to the Lord true worship, nevertheless committed idolatry when they forged the golden calf at Sinai to magnify the great power of God. They weren’t blind pagans; they intended to worship the God of Israel, not some pagan deity. But in their desire for an aid to worship, they sinned and instead provoked the wrath of God. To them the golden calf was an aid to worship that they thought the Lord would have allowed, but to the Lord it was an unauthorized aid that He abhorred. In matters of worship, both reason and the will of man is a fatal guide. We would do well to remember the words of Solomon in Prov. 16:25, “There is a way that seemeth right unto a man, but the end thereof are the ways of death.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/brad-freeman.html">Brad Freeman</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Rev. Freeman is a Presbyterian Reformed Church minister. Why Not Instruments In Worship?</cite>, V. A Common Reason Answered</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/worship/musical-instruments-in-worship.html">Musical Instruments in Worship</a></span></div>

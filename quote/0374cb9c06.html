<blockquote><p>In the point of excellency, no other form of psalmody can bear a comparison with the songs of inspiration. Imperfection is stamped upon all the works of man; the most highly finished pieces of sacred poetry frequently discover weakness of sentiment, or are marred by improper figures and allusion. Of the Psalms alone, it can be truly declared that they are perfect. The Holy Spirit has transcribed his own character of purity, wisdom and love, in these unrivalled compositions. This excellence they claim above every rival, that, as the words of God, they are of tried power to enlighten the mind, purify the affections, subjugate the will, and transform the whole inner man. It accords with the experience of the saints in every age to believe that the Spirit’s hallowed influences descend most copiously upon his own words: the most sensible relief, encouraging counsel, and abounding comfort are experienced in calling them to remembrance, and by faith applying them. As the design of singing praise is evidently to elevate the affections, and to excite the hope and peace and joy, the believer has reason to expect that, in using the inspired Psalms, which are the immediate productions of the Holy Spirit, these spiritual emotions will be awakened, and the enjoyment of their appropriate objects realized; the same confidence, in an equal measure, he has no ground to entertain from the use of uninspired psalmody.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/covenanter.html">Covenanter</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Covenanter</cite>, Jan. 1835, p. 4</span></figcaption>

</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-aa6a5b1feb" data-kw="">
<blockquote><p>St. Paul giving a rule how men should sing, first says, “I will sing in voice, and I will sing with understanding.” And in another place, showing what songs should be song, exhorts the Ephesians to “edify one another with psalms, songs of praise, and such as are spiritual, singing in their hearts to the Lord with thanks giving.” As if the Holy Ghost would say, that the song did inflame the heart to call upon God, and praise him with a more fervent and lively zeal. And as music or singing is natural unto us, and therefore every man delights therein; so our merciful God sets before our eyes, how we may rejoice and singe to the glory of his name, recreation of our spirits, and profit of ourselves. But as there is no gift of God so precious or excellent, that Satan has not after a sort drawn to himself and corrupt, so has he most impudently abused this notable gift of singing, chiefly by the Papists his ministers, in disfiguring it, partly by strange language, that cannot edify, and partly by a curious wanton sort, hiring men to tickle the ears and flatter the fantasies, not esteeming it as a gift approved by the Word of God, profitable for the Church, and confirmed by all antiquity. As, besides other places, is most manifest by the words of Pliny, called the younger, who, when he was depute in Asia unto the Emperor Trajan, and had received charge to inquire out the Christians to put them to death, writ among other things, touching the Christians, “That their manners were to sing verses or psalms early in the morning to Christ their God.” If any, perhaps, would doubt, when, or by whom these churches or assemblies were institute, it is likewise evident, that St. John the Apostle, who, although in Domitian’s time he was banished in the Isle Patmos; yet when Nerva his successor, and next before Trajan reigned, returned to Ephesus, and so planted the churches, as the stories report. Seeing therefore God’s Word does approve it, antiquity bears witness thereof, and best reformed Churches have received the same, no man can reprove it, except he will condemn God’s Word, despise antiquity, and utterly condemn the godly reformed Churches. And there are no songs more appropriate than the Psalms of the Prophet David, which the Holy Ghost has framed to the same use, and commended to the Church, as containing the effect of the whole Scriptures, that hereby our hearts might be more lively touched, as appears by Moses, Hezekiah, Judith, Debora, Mary, Zechariah, and others, who by songs and metre, rather than in their common speech and prose, gave thanks to God for such comfort as He sent them. Here it were to long to entreat of the metre; but for as much as the learned doubt not thereof, and it is plainly proven that the Psalms are not only metre, and contain just pauses, but also have grace and majesty in the verse more than any other places of the Scriptures, we need not to enter into any probation. For they that are skillful in the Hebrew tongue, [Read Moses Chabib, in his books called, מרפא לשון דרכי נרעם] by comparing the Psalms with the rest of the Scriptures, easily may perceive the metre. And to whom is it not known, how the Holy Ghost by all means sought to help our memory, when he fashioned many Psalms according to the letters of the alphabet; so that every verse begins with the letters thereof in order. Sometimes ‘A’ begins the half verse, and ‘B’ the other half; and in another place, three verses, yea and eight verses with one letter, even the Psalm throughout; as if all men should be inflamed with the love thereof, both for variety of matter, and also briefness, easiness, and delectation. Now, to make you privy also why we altered the rhyme in certain places of him, whom for the gifts that God had given him, we esteemed and reverenced, this may suffice: that in this enterprise, we did only set God before our eyes, and therefore weighed the words and sense of the Prophet, rather considering the meaning thereof than what any man had write. And chiefly being in this place, whereas most perfect and godly judgment did assure us, and exhortations to the same encourage us, we thought it better to frame the rhyme to the Hebrew sense, than to bind that sense to the English meter: and so either altered for the better, in such places as he had not attained unto, or else where he had escaped part of the verse, or sometimes the whole, we added the same, not as men desirous to find faults, but only as such which covet to hide them, as the learned can judge.</p></blockquote>

<blockquote><p>‘God be merciful unto us, and bless us; and cause His face to shine upon us. That Thy way may be known upon earth, Thy saving health among all nations.’ Psalm Ixvii. 1, 2

The royal Psalmist, in the spirit of inspiration, personating the Church of the redeemed in every age, and more especially under its last and most perfect dispensation, here offers up a sublime prayer for its inward prosperity, and outward universal extension. All is in the order of nature and of grace. Knowing full well that he who has not obtained mercy from the Lord, cannot be a fit bearer of it to others, — that he who has obtained no blessings himself, can dispense none,—that he who enjoys no light, can communicate none, — he first of all, with marked and beautiful propriety, begins with the supplication of personal and individual blessings: — ‘God be merciful unto us,’ forgiving and pardoning all our sins: ‘and bless us,’ conferring every gift and every grace really needful for time and eternity: ‘and lift up the light of thy countenance upon us,’ cheering us with the smile of reconciliation and love, and causing the Sun of Righteousness to arise on our darkened souls with healing in his beams.

But does the Psalmist stop here? Does he for a moment intend that he and his fellow-worshippers, as representatives of the visible Church of the living God, should absorb all the mercy, all the blessing, and all the light of Jehovah’s countenance? Oh no! Having thus fervently prayed for evangelical blessings to descend upon himself, and every member of the Church, he immediately superadds, in the true evangelistic or missionary spirit, ‘That thy way,’ or, as it is given in our metrical version, ‘That so thy way may be known upon earth, thy saving health among all nations.’

How significant the connection here established between the obtainment and the distribution of evangelical favours! ‘God be merciful unto us, and bless us.’ — Why? only that we ourselves may be pardoned and sanctified, and thereby attain to true happiness? No. There is another grand end in view, to the accomplishment of which our being blessed is but a means. ‘God be merciful unto us, and bless us, that so thy way may be known on earth,’ — that so — that thus — that in this way — that by our instrumentality — that by our being blessed, and having the light of thy countenance shining upon us, — ‘thy way’ — thy way of justification through the atoning righteousness of the Redeemer, — thy way of sanctification by his Holy Spirit, — ‘may be made known on earth, and thy saving health among all nations.’</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/alexander-duff.html">Alexander Duff</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Missions. The Chief End of the Christian Church</cite>, (New edn, Edinburgh: Andrew Elliot, 1877), pp 7-10.</span></figcaption>

<div class="actions"><button class="copy" data-copy="“‘God be merciful unto us, and bless us; and cause His face to shine upon us. That Thy way may be known upon earth, Thy saving health among all nations.’ Psalm Ixvii. 1, 2

The royal Psalmist, in the spirit of inspiration, personating the Church of the redeemed in every age, and more especially under its last and most perfect dispensation, here offers up a sublime prayer for its inward prosperity, and outward universal extension. All is in the order of nature and of grace. Knowing full well that he who has not obtained mercy from the Lord, cannot be a fit bearer of it to others, — that he who has obtained no blessings himself, can dispense none,—that he who enjoys no light, can communicate none, — he first of all, with marked and beautiful propriety, begins with the supplication of personal and individual blessings: — ‘God be merciful unto us,’ forgiving and pardoning all our sins: ‘and bless us,’ conferring every gift and every grace really needful for time and eternity: ‘and lift up the light of thy countenance upon us,’ cheering us with the smile of reconciliation and love, and causing the Sun of Righteousness to arise on our darkened souls with healing in his beams.

But does the Psalmist stop here? Does he for a moment intend that he and his fellow-worshippers, as representatives of the visible Church of the living God, should absorb all the mercy, all the blessing, and all the light of Jehovah’s countenance? Oh no! Having thus fervently prayed for evangelical blessings to descend upon himself, and every member of the Church, he immediately superadds, in the true evangelistic or missionary spirit, ‘That thy way,’ or, as it is given in our metrical version, ‘That so thy way may be known upon earth, thy saving health among all nations.’

How significant the connection here established between the obtainment and the distribution of evangelical favours! ‘God be merciful unto us, and bless us.’ — Why? only that we ourselves may be pardoned and sanctified, and thereby attain to true happiness? No. There is another grand end in view, to the accomplishment of which our being blessed is but a means. ‘God be merciful unto us, and bless us, that so thy way may be known on earth,’ — that so — that thus — that in this way — that by our instrumentality — that by our being blessed, and having the light of thy countenance shining upon us, — ‘thy way’ — thy way of justification through the atoning righteousness of the Redeemer, — thy way of sanctification by his Holy Spirit, — ‘may be made known on earth, and thy saving health among all nations.’”

— Alexander Duff, Missions. The Chief End of the Christian Church, (New edn, Edinburgh: Andrew Elliot, 1877), pp 7-10.">Copy</button><a class="share" href="https://x.com/intent/post?text=%E2%80%9C%E2%80%98God+be+merciful+unto+us%2C+and+bless+us%3B+and+cause+His+face+to+shine+upon+us.+That+Thy+way+may+be+known+upon+earth%2C+Thy+saving+health+among+all+nations.%E2%80%99+Psalm+Ixvii.+1%2C+2%0A%0AThe+royal+Psalmist%2C+in+the+spirit+of+inspiration%2C+personating+the+Church+of+the+redeemed+in+every+age%2C+and+more+especially+under+its+last+and+most+perfect+dispensation%2C+here+offers+up+a+sublime+prayer+for+its+inward+prosperity%2C+and+outward+universal+extension.+All+is+in+the+order+of+nature+and+of+grace.+Knowing+full+well+that+he+who+has+not+obtained+mercy+from+the+Lord%2C+cannot+be+a+fit+bearer+of+it+to+others%2C+%E2%80%94+that+he+who+has+obtained+no+blessings+himself%2C+can+dispense+none%2C%E2%80%94that+he+who+enjoys+no+light%2C+can+communicate+none%2C+%E2%80%94+he+first+of+all%2C+with+marked+and+beautiful+propriety%2C+begins+with+the+supplication+of+personal+and+individual+blessings%3A+%E2%80%94+%E2%80%98God+be+merciful+unto+us%2C%E2%80%99+forgiving+and+pardoning+all+our+sins%3A+%E2%80%98and+bless+us%2C%E2%80%99+conferring+every+gift+and+every+grace+really+needful+for+time+and+eternity%3A+%E2%80%98and+lift+up+the+light+of+thy+countenance+upon+us%2C%E2%80%99+cheering+us+with+the+smile+of+reconciliation+and+love%2C+and+causing+the+Sun+of+Righteousness+to+arise+on+our+darkened+souls+with+healing+in+his+beams.%0A%0ABut+does+the+Psalmist+stop+here%3F+Does+he+for+a+moment+intend+that+he+and+his+fellow-worshippers%2C+as+representatives+of+the+visible+Church+of+the+living+God%2C+should+absorb+all+the+mercy%2C+all+the+blessing%2C+and+all+the+light+of+Jehovah%E2%80%99s+countenance%3F+Oh+no%21+Having+thus+fervently+prayed+for+evangelical+blessings+to+descend+upon+himself%2C+and+every+member+of+the+Church%2C+he+immediately+superadds%2C+in+the+true+evangelistic+or+missionary+spi <blockquote><p>47. Yet because the lifting up of the heart to God is together required, Simul &amp; consequenter, and going along with the thing that is sung, and it is also the end of that meditation; therefore we are said to sing in our heart to the Lord, Col. 3:16, and psalms that are sung have the consideration of prayers.

48. But because this religious melody hath the respect of prayers, therefore it is not so fit that the Decalogue, and other such like, which do not partake the nature of prayer, be turned into meter and be sung instead of psalms. … 53. But in the melody of singing, because it tendeth to our mutual edification, attention, and stirring up of pious affections among us one toward another, Col. 3:16, therefore all do join their voices together, 1. Chron. 16:35; Mk. 14:26.</p></blockquote>

<blockquote><p>Mr. Flavel after this, returned to Dartmouth, where with his family and dear people he blessed God for his mercies towards him. He was in a little time after confined close prisoner to his house, where many of his dear flock stole in over night, or betimes on the Lord’s Day in the morning, to enjoy the benefit of his labors, and spend the sabbath in hearing, praying, singing of psalms, and holy discourses.</p></blockquote>

</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-5e998e8dd1" data-kw="" data-pol="">
<blockquote><p>Between them and us there is this difference, that they persuade themselves that the movement comes from the man himself, whereas we maintain that faith is voluntary, because God draws our wills to himself. Add, that when we say a man is justified by faith alone, we do not fancy a faith devoid of charity, but we mean that faith alone is the cause of justification.</p></blockquote>
<figcaption>— <a href="../authors/john-calvin.html">John Calvin</a>, <cite>Acts of the Council of Trent with the Antidote</cite>, Antidote to the Sixth Session, on Canon 9</figcaption>
<div class="meta"><a class="tag" href="../topics/polemics/rome-justification.html">Rome: Justification</a><a class="tag" href="../topics/salvation/justification.html">Justification</a><a class="tag" href="../topics/salvation/faith.html">Faith</a></div>

<figcaption>— <a href="../authors/john-calvin.html">John Calvin</a>, <cite>Institutes of the Christian Religion</cite>, 3.2.7</figcaption>

</figure><figure class="quote" id="q-7581bd9f56" data-kw="" data-pol="">
<blockquote><p>This is why the Bible teaches that faith alone in Christ alone is the only way to salvation from sin. Faith is the anti-work. It’s the realization that there is nothing you can do but trust in what has been done for you in the life, death, and resurrection of Jesus. Faith is the realization that God’s pleasure in you will never be based upon your performance for Him. Instead, God’s pleasure in you will always be based upon Christ’s performance for you.</p></blockquote>
<figcaption>— <a href="../authors/david-platt.html">David Platt</a>, <cite>Follow Me</cite>, p. 60</figcaption>
<div class="meta"><a class="tag" href="../topics/salvation/faith.html">Faith</a><a class="tag" href="../topics/salvation/justification.html">Justification</a></div>

</figure><figure class="quote" id="q-9ea85d7a6b" data-kw="" data-pol="">
<blockquote><p>[Christians] look away from themselves to Christ. They believe that God has loved them from eternity past. They believe that the payment of Christ on the cross for sins was for them. They find Christ irresistible, and following Him the greatest privilege of all. They have faith in Christ and what He has done for them. They trust Christ, looking outside of themselves to Him alone.</p></blockquote>
<figcaption>— <a href="../authors/jim-elliff.html">Jim Elliff</a>, <cite>A Three-legged Stool: All Sides of God’s Salvation Process</cite></figcaption>

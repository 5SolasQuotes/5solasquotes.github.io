<main class="wrap"><figure class="quote" id="q-5816cdc836" data-kw="">
<blockquote><p>One of Scotland’s noblest distinctions — her well-spent Sabbaths — is now on the eve of being lost. The old landmarks, which have so long guarded the day of rest, as within a sacred enclosure, and which were commonly understood to have been set up by the hand of God himself, are in progress of being taken down and cast aside as useless incumbrances.

Not only has a corrupt practice, in various places, been encroaching on its devout observance, but, what is unspeakably worse, a change of sentiment regarding its nature and obligation is fast loosening its hold of the national conscience, and opening the way for its unscrupulous desecration.

Indeed the Sabbath, properly so-called, that is, a day in every week hallowed and set apart, by the special appointment of God, for bodily and spiritual rest, and allowing no interruption except what may arise from the works, which either cannot or should not be deferred, of necessity and mercy — such a day no longer exists in the opinion of a large and influential portion of the community.

The only thing they acknowledge is what is more fitly called Sunday, a day which requires, and that by common consent, rather than by express precept, the consecration of a few hours to the public worship of God, but leaves men free to spend all its other hours according to their taste or circumstances, either in pleasant recreations, or in pressing business.

If our readers have watched any of the discussions, regarding the Sabbath, which within the last few years have taken place in the town-councils or other public bodies, and observed how often this lighter notion of a Sunday, or a first day of the week, is made to supplant the notion of a proper Sabbath, now reputed old, Jewish, or Puritanical, even by men who have a name in the religious world, they will be satisfied that what we say is not without foundation.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/patrick-fairbairn.html">Patrick Fairbairn</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Sabbath in Christian Miscellany</cite></span></figcaption>

<blockquote><p>But they say immediately, ‘We teach that these images are not to be worshipped.’ As if, in fact, says [Jerome] Zanchius (De Imagin., col. 402), ‘God had not once rather diligently done the same thing through Moses and the prophets, that we are doing. So then why did He even want all images abolished? Because it is not enough to teach by word that an evil thing must not be done; but the slight obstacles, the incentives, the causes, the occasions of evil doing must be abolished.’ It is not enough, with the scribes and Pharisees, to teach out of Moses’ chair what the people should do, but all occasions, yea, appearances of evil, are to be taken out of their sight. ‘Those things affect more powerfully, and affect more, which fall upon the eyes than those which fell upon the ears. And so Hezekiah had been able to warn the people not to worship the serpent, but he preferred to break it in pieces and completely remove it from visibility,’ says one well to this purpose. (Thomas Naogeorgus [Kirchmeyer] in 1 Jn 5:21)</p></blockquote>

</figure><figure class="quote" id="q-8fa0a4a8f4" data-kw="">
<blockquote><p>Dr. Thornwell exhibited through life one mark of extravagance, in always having the best of everything in its kind. Indeed, it was his doctrine that the best was always the cheapest. He always concurred with [Thomas] Carlyle in his denunciation of “the cheap and nasty;” which, like Carlyle, he pushed in many directions, and made it the measure of men and principles, as well as of things. Still, it was with him very much a matter of taste. He always bought the best editions of books; wore clothing of the finest texture; was fond of fine horses; and smoked always the best brands.

To illustrate his epicurianism [sic] as to the last named, the writer once offered him a cigar, such as he was himself smoking at the time, and as good in quality as he felt he could afford. After drawing two or three whiffs, it was pitched impatiently through the window, with the exclamation, “Any man who will smoke such cigars will steal!” The anecdote will be excused its want of dignity, if it shows the freedom and dash of his raillery towards those whom he loved.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/benjamin-m-palmer.html">Benjamin M. Palmer</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Life and Letters of James Henley Thornwell, D.D., LL.D.</cite>, (Richmond VA: Whittet &amp; Shepperson, 1875), p. 135.</span></figcaption>

<main class="wrap"><figure class="quote" id="q-2838d2990a" data-kw="two wills dyothelite">
<blockquote><p>The reasons are: (1) the opposition of the two natures in Christ is frequent in Scripture (Rom. 1:3; 1 Pet. 3:18; Heb. 9:14; Jn. 1:14; Phil. 2:6, 7, 11); (2) two wills are ascribed to him (“not my will, but thine, be done,” Lk. 22:42). Nor does it follow that there are two willing because the will belongs to the nature, while willing belongs to the person; nor is it evident that the will follows personally forthwith because in God there are three persons, but only one will.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/francis-turretin.html">Francis Turretin</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Institutes of Elenctic Theology</cite>, 13.7.14</span></figcaption>

</figure><figure class="quote" id="q-5b880359da" data-kw="hypostatic union">
<blockquote><p>In the Christian religion there are two questions above all others which are difficult. The first concerns the unity of the three persons in the one essence in the Trinity; the other concerns the union of the two natures in the one person in the incarnation. As in the Trinity the unity of essence does not hinder the persons from being distinct, so the union of natures in the person of Christ does not prevent both the natures and their properties from remaining unconfounded and distinct.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/francis-turretin.html">Francis Turretin</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Institutes of Elenctic Theology</cite>, 13.6.1</span></figcaption>

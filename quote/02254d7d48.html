<blockquote><p>1. The law of Moses was, in the first place, a re-enactment of the covenant of works. A covenant is simply a promise suspended upon a condition. The covenant of works, therefore, is nothing more than the promise of life suspended on the condition of perfect obedience. The phrase is used as a concise and convenient expression of the eternal principles of justice on which God deals with rational creatures, and which underlie all dispensations, the Adamic, Abrahamic, Mosaic and Christian. Our Lord said to the lawyer who asked what he should do to inherit eternal life, “What is written in the law? How readest thou? And he answering said, Thou shalt love the Lord thy God with all thy heart, and with all thy soul, and with all thy strength, and with all thy mind; and thy neighbour as thy-self. And he said unto him, Thou hast answered right, this do and thou shalt live,” Luke 10:26–28. This is the covenant of works. It is an immutable principle that where there is no sin there is no condemnation, and where there is sin there is death. This is all that those who reject the gospel have to fall back upon. It is this principle which is rendered so prominent in the Mosaic economy as to give it its character of law. Viewed under this aspect it is the ministration of condemnation and death.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/charles-hodge.html">Charles Hodge</a></span><span class="wk"><span class="lbl">Work:</span> <cite>An Exposition of the Second Epistle to the Corinthians</cite>, (New York: A. C. Armstrong &amp; Son, 1891), 57–58.</span></figcaption>

<blockquote><p>As therefore I have showed in what sense the covenant of grace is called “the new covenant,” in this distinction and opposition, so I shall propose sundry things which relate unto the nature of the first covenant, which manifest it to have been a distinct covenant, and not a mere administration of the covenant of grace: — 1. This covenant, called “the old covenant,” was never intended to be of itself the absolute rule and law of life and salvation unto the church, but was made with a particular design, and with respect unto particular ends.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/john-owen.html">John Owen</a></span><span class="wk"><span class="lbl">Work:</span> <cite>An Exposition of the Epistle to the Hebrews</cite>, 8:6; Works, vol. 22, p. 92</span></figcaption>

<blockquote><p>This statement does not rest upon any express declaration of the Scriptures. It is, however, a concise and correct mode of asserting a plain Scriptural fact, namely, that God made to Adam a promise suspended upon a condition, and attached to disobedience a certain penalty. This is what in Scriptural language is meant by a covenant, and this is all that is meant by the term as here used. Although the word covenant is not used in Genesis, and does not elsewhere, in any clear passage, occur in reference to the transaction there recorded, yet inasmuch as the plan of salvation is constantly represented as a New Covenant, new, not merely in antithesis to that made at Sinai, but new in reference to all legal covenants whatever, it is plain that the Bible does represent the arrangement made with Adam as a truly federal transaction. The Scriptures know nothing of any other than two methods of attaining eternal life: the one that which demands perfect obedience, and the other that which demands faith. If the latter is called a covenant, the former is declared to be of the same nature. It is of great importance that the Scriptural form of presenting truth should be retained. Rationalism was introduced into the Church under the guise of a philosophical statement of the truths of the Bible free from the mere outward form in which the sacred writers, trained in Judaism, had presented them. On this ground the federal system, as it was called, was discarded. On the same ground the prophetic, priestly, and kingly offices of Christ were pronounced a cumbrous and unsatisfactory form under which to set forth his work as our Redeemer. And then the sacrificial character of his death, and all idea of atonement were rejected as mere Jewish drapery. Thus, by theory of accommodation, every distinctive doctrine of the Scriptures was set aside, and Christianity reduced to Deism. It is, therefore, far more than a mere matter of method that is involved in adhering to the Scriptural form of presenting Scriptural truths. God then did enter into a covenant with Adam. That covenant is sometimes called a covenant of life, because life was promised as the reward of obedience. Sometimes it is called the covenant of works, because works were the condition on which that promise was suspended, and because it is thus distinguished from the new covenant which promises life on condition of faith. …The condition of the covenant made with Adam is said in the symbols of our church to be perfect obedience. That that statement is correct may be inferred (1.) From the nature of the case and from the general principles clearly revealed in the word of God. Such is the nature of God, and such the relation which He sustains to his moral creatures, that sin, the transgression of the divine law, must involve the destruction of the fellowship between man and his Creator, and the manifestation of the divine displeasure. The Apostle therefore says, that he who offends in one point, who breaks one precept of the law of God, is guilty of the whole. (2.) It is everywhere assumed in the Bible, that the condition of acceptance under the law is perfect obedience. “Cursed is every one who continueth not in all things written in the book of the law to do them.” This is not a peculiarity of the Mosaic economy, but a declaration of a principle which applies to all divine laws. (3.) The whole argument of the Apostle in his epistles to the Romans and to the Galatians, is founded on the assumption that the law demands perfect obedience. If that be not granted, his whole argument falls to the ground. The specific command to Adam not to eat of a certain tree, was therefore not the only command he was required to obey. It was given simply to be the outward and visible test to determine whether he was willing to obey God in all things. Created holy, with all his affections pure, there was the more reason that the test of his obedience should be an outward and positive command; something wrong simply because it was forbidden, and not evil in its own nature. It would thus be seen that Adam obeyed for the sake of obeying. His obedience was more directly to God, and not to his own reason. The question whether perpetual, as well as perfect obedience was the condition of the covenant made with Adam, is probably to be answered in the negative. It seems to be reasonable in itself and plainly implied in the Scriptures that all rational creatures have a definite period of probation. If faithful during that period they are confirmed in their integrity, and no longer exposed to the danger of apostasy. Thus we read of the angels who kept not their first estate, and of those who did. Those who remained faithful have continued in holiness and in the favour of God. It is therefore to be inferred that had Adam continued obedient during the period allotted to his probation, neither he nor any of his posterity would have been ever exposed to the danger of sinning.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/charles-hodge.html">Charles Hodge</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Systematic Theology</cite>, (repr. Oak Harbor, WA: Logos Research Systems, Inc., 1997), 2.117–18, 119–120.</span></figcaption>

+command+he+was+required+to+obey.+It+was+given+simply+to+be+the+outward+and+visible+test+to+determine+whether+he+was+willing+to+obey+God+in+all+things.+Created+holy%2C+with+all+his+affections+pure%2C+there+was+the+more+reason+that+the+test+of+his+obedience+should+be+an+outward+and+positive+command%3B+something+wrong+simply+because+it+was+forbidden%2C+and+not+evil+in+its+own+nature.+It+would+thus+be+seen+that+Adam+obeyed+for+the+sake+of+obeying.+His+obedience+was+more+directly+to+God%2C+and+not+to+his+own+reason.+The+question+whether+perpetual%2C+as+well+as+perfect+obedience+was+the+condition+of+the+covenant+made+with+Adam%2C+is+probably+to+be+answered+in+the+negative.+It+seems+to+be+reasonable+in+itself+and+plainly+implied+in+the+Scriptures+that+all+rational+creatures+have+a+definite+period+of+probation.+If+faithful+during+that+period+they+are+confirmed+in+their+integrity%2C+and+no+longer+exposed+to+the+danger+of+apostasy.+Thus+we+read+of+the+angels+who+kept+not+their+first+estate%2C+and+of+those+who+did.+Those+who+remained+faithful+have+continued+in+holiness+and+in+the+favour+of+God.+It+is+therefore+to+be+inferred+that+had+Adam+continued+obedient+during+the+period+allotted+to+his+probation%2C+neither+he+nor+any+of+his+posterity+would+have+been+ever+exposed+to+the+danger+of+sinning.%E2%80%9D%0A%0A%E2%80%94+Charles+Hodge%2C+Systematic+Theology+%28repr.+Oak+Harbor%2C+WA%3A+Logos+Research+Systems%2C+Inc.%2C+1997%29%2C+2.117%E2%80%9318%2C+119%E2%80%93120.&amp;url=https%3A%2F%2F5solasquotes.github.io%2Fquote%2F91df145c0c.html&amp;via=5Solas" target="_blank" rel="noopener">Share on X</a><a class="perma" href="../quote/91df145c0c.html">Permalink</a><a class="src" href="https://heidelblog.net/2016/04/charles-hodge-the-covenant-with-adam-before-the-fall-was-a-covenant-of-works/" rel="noopener" target="_blank">Read it online · Heidelblog</a></div>
</figure><figure class="quote" id="q-4df24fc1d8" data-kw="">
<blockquote><p>It therefore now appears, that as the law or dictates of pure nature, comprehended together with other fit additionals, became at first one entire constitution aptly suited to the government of man in his innocent state, unto which the title did well agree of the law or covenant of works: so the same natural dictates, transcribed and made express (because now sullied, and not so legible in the corrupted nature of man) do, with such allays [alleviation] and additions as the case required, compose and make up the constitution which bears the title of the law or covenant of grace, or the law of faith, or the gospel of Christ; and is only suitable to the state of man lapsed and fallen, as the measure of that righteousness which he is now to aim at, and aspire unto.</p></blockquote>

<blockquote><p>1. Of God’s Covenant of Works, with the First Adam, and his natural seed before the fall. APHORISM I. GOD was pleased to enter into covenant with the first Adam, before his fall. Under the term, Adam, Scripture sometimes comprehends both sexes, both Adam and his wife. And if any shall contend that God entered into covenant with both Adam and we at once, as the complete root of mankind, I shall not much gainsay: and yet this will not so easily be proved, nor know I any inconvenience that would follow, should it be denied, the woman coming of Adam as well as any of his posterity. Nor am I ignorant that some are of opinion, that Adam received the covenant alone, and was to teach it, and did teach it to his wife, which opinion hath the more weight, because when God forbids the Eating of the tree of knowledge under pain of death, (wherein the promise of life contrariwise is implied,) he speaks only in the singular number, viz. to Adam only. But how may it be evidenced, That God entered into covenant with the first Adam, even into a Covenant of Works, before the Fall? Answ. Though it be not positively and plainly said in Scripture, that God gave Adam a Covenant of Works, before his fall: and though the characters and footsteps of this covenant are not so expressly discovered in Holy Writ, as of some others; yet notwithstanding, upon sundry Scripture-grounds and considerations, it may be evinced sufficiently. As, From the Inscription of the Covenant of Works in Adam’s heart. Before the Fall God wrote the Covenant of Works, viz. The Substance of the Moral Law, perfectly in Adam’s heart; and in so doing, entered into Covenant with him. Here are three thing in this Position to be cleared; viz. That the Moral Law is the Covenant of Works. That this Moral Law was perfectly written in Adams heart before the Fall. That God in Writing the Moral Law in his heart, entered into Covenant of Works with him.

1. That the Moral Law (abstractly and precisely in its self considered, without the additionals, viz. the preface, ceremonial law, &amp;c. jointly promulgated with it in Horeb) is the Covenant of Works is manifest; (1) Because, the Moral Law (by which is the knowledge of sin, and which works wrath) is styled by the Apostle “The Law of works,” and is set in opposition to “The Law of Faith.” Now this Law of Works, and Law of Faith, amount in effect to as much as the Covenant of works, and Covenant of Faith. (2) Because Righteousness and life were at first by the Moral Law, and should have been so still, had not the Law become unable to give Righteousness and life, in that it was weak through the flesh, man through Sin being unable to keep it. Now the Law, requiring obedience, and promising life upon that condition, must needs be a covenant, and that a Covenant of Works: Works being the proper Condition of it.

2. That this Moral Law for Substance was perfectly written in Adams heart before the Fall, is certain; (1) Because, Man was made in God’s image upright, and perfect. And consequently was thoroughly furnished with all accomplishments of upright and perfect Humane nature: and particularly with the Moral Law, that Law of Nature; The substance whereof was engraved both in his mind, by natural light, knowing it; and in his will, by natural integrity conforming unto it. (2) Because, The Work of the Law remains imperfectly written in some dim characters in the very hearts of pagans and heathens since the fall; They doing by nature the things contained in the Law, and being a Law unto themselves, without the Law of God written. Whence we may strongly conclude that much more before the fall the Moral Law was perfectly written in Adam’s heart, there being in him no sin to deface it in the least degree.

3. That, God, in writing the Moral Law in Adam’s heart, entered into Covenant of Works with him. viz. by real impressions upon his heart: though not by verbal expressions to the ear. For by this Law written in Adam’s heart, he had laid before him, what obedience was required and assented to on Adam’s part: And what recompense should be performed on God’s part. And this was at least an implicit, if not an explicit, covenanting. 2. From God’s express prescription of a positive Law unto Adam in his innocent State. God’s positive Law is laid down in these words, “And the LORD God commanded the man, saying, of every Tree of the Garden you may freely eat: But of the Tree of the Knowledge of good and evil, you shall not eat of it; for in the day that you eat thereof thou shall surely die.” Here are parties covenanting, and agreeing upon terms, viz. God and Adam: Here are also terms agreed upon and matters covenanted reciprocally by these parties; Adam on his part was to be obedient to God, in forbearing to Eat of the Tree of Knowledge only: God on his part, for present, permits Adam to eat of all other Trees of the Garden; And for future (in his explicit threatening of death in case of disobedience,) implicitly promises life in case of obedience herein. Now where there are parties covenanting and agreeing upon terms: And terms mutually agreed upon by those parties, as here; there’s the substance of an express covenant, though it be not formally and in express words called a covenant.</p></blockquote>

— Francis Roberts, The Mystery And Marrow Of The Bible, (London, 1657), 19–21 [Spelling and punctuation modernized].">Copy</button><a class="share" href="https://x.com/intent/post?text=%E2%80%9C1.+Of+God%E2%80%99s+Covenant+of+Works%2C+with+the+First+Adam%2C+and+his+natural+seed+before+the+fall.+APHORISM+I.+GOD+was+pleased+to+enter+into+covenant+with+the+first+Adam%2C+before+his+fall.+Under+the+term%2C+Adam%2C+Scripture+sometimes+comprehends+both+sexes%2C+both+Adam+and+his+wife.+And+if+any+shall+contend+that+God+entered+into+covenant+with+both+Adam+and+we+at+once%2C+as+the+complete+root+of+mankind%2C+I+shall+not+much+gainsay%3A+and+yet+this+will+not+so+easily+be+proved%2C+nor+know+I+any+inconvenience+that+would+follow%2C+should+it+be+denied%2C+the+woman+coming+of+Adam+as+well+as+any+of+his+posterity.+Nor+am+I+ignorant+that+some+are+of+opinion%2C+that+Adam+received+the+covenant+alone%2C+and+was+to+teach+it%2C+and+did+teach+it+to+his+wife%2C+which+opinion+hath+the+more+weight%2C+because+when+God+forbids+the+Eating+of+the+tree+of+knowledge+under+pain+of+death%2C+%28wherein+the+promise+of+life+contrariwise+is+implied%2C%29+he+speaks+only+in+the+singular+number%2C+viz.+to+Adam+only.+But+how+may+it+be+evidenced%2C+That+God+entered+into+covenant+with+the+first+Adam%2C+even+into+a+Covenant+of+Works%2C+before+the+Fall%3F+Answ.+Though+it+be+not+positively+and+plainly+said+in+Scripture%2C+that+God+gave+Adam+a+Covenant+of+Works%2C+before+his+fall%3A+and+though+the+characters+and+footsteps+of+this+covenant+are+not+so+expressly+discovered+in+Holy+Writ%2C+as+of+some+others%3B+yet+notwithstanding%2C+upon+sundry+Scripture-grounds+and+considerations%2C+it+may+be+evinced+sufficiently.+As%2C+From+the+Inscription+of+the+Covenant+of+Works+in+Adam%E2%80%99s+heart.+Before+the+Fall+God+wrote+the+Covenant+of+Works%2C+viz.+The+Substance+of+the+Moral+Law%2C+perfectly+in+Adam%E2%80%99s+heart%3B+and+in+so+doing%2C+entered+into+Covenant+with+him.+Here+are+three+thing+in+this+Position+to+be+cleared%3B+viz.+That+the+Moral+Law+is+the+Covenant+of+Works.+That+this+Moral+Law+was+perfectly+written+in+Adams+heart+before+the+Fall.+That+God+in+Writing+the+Moral+Law+in+his+heart%2C+entered+into+Covenant+of+Works+with+him.+1.+That+the+Moral+Law+%28abstractly+and+precisely+in+its+self+considered%2C+without+the+additionals%2C+viz.+the+preface%2C+ceremonial+law%2C+%26c.+jointly+promulgated+with+it+in+Horeb%29+is+the+Covenant+of+Works+is+manifest%3B+%281%29+Because%2C+the+Moral+Law+%28by+which+is+the+knowledge+of+sin%2C+and+which+works+wrath%29+is+styled+by+the+Apostle+%E2%80%9CThe+Law+of+works%2C%E2%80%9D+and+is+set+in+opposition+to+%E2%80%9CThe+Law+of+Faith.%E2%80%9D+Now+this+Law+of+Works%2C+and+Law+of+Faith%2C+amount+in+effect+to+as+much+as+the+Covenant+of+works%2C+and+Covenant+of+Faith.+%282%29+Because+Righteousness+and+life+were+at+first+by+the+Moral+Law%2C+and+should+have+been+so+still%2C+had+not+the+Law+become+unable+to+give+Righteousness+and+life%2C+in+that+it+was+weak+through+the+flesh%2C+man+through+Sin+being+unable+to+keep+it.+Now+the+Law%2C+requiring+obedience%2C+and+promising+life+upon+that+condition%2C+must+needs+be+a+covenant%2C+and+that+a+Covenant+of+Works%3A+Works+being+the+proper+Condition+of+it.+2.+That+this+Moral+Law+for+Substance+was+perfectly+written+in+Adams+heart+before+the+Fall%2C+is+certain%3B+%281%29+Because%2C+Man+was+made+in+God%E2%80%99s+image+upright%2C+and+perfect.+And+consequently+was+thoroughly+furnished+with+all+accomplishments+of+upright+and+perfect+Humane+nature%3A+and+particularly+with+the+Moral+Law%2C+that+Law+of+Nature%3B+The+substance+whereof+was+engraved+both+in+his+mind%2C+by+natural+light%2C+knowing+it%3B+and+in+his+will%2C+by+natural+integrity+conforming+unto+it.+%282%29+Because%2C+The+Work+of+the+Law+remains+imperfectly+written+in+some+dim+characters+in+the+very+hearts+of+pagans+and+heathens+since+the+fall%3B+They+doing+by+nature+the+things+contained+in+the+Law%2C+and+being+a+Law+unto+themselves%2C+without+the+Law+of+God+written.+Whence+we+may+strongly+conclude+that+much+more+before+the+fall+the+Moral+Law+was+perfectly+written+in+Adam%E2%80%99s+heart%2C+there+being+in+him+no+sin+to+deface+it+in+the+least+degree.+3.+That%2C+God%2C+in+writing+the+Moral+Law+in+Adam%E2%80%99s+heart%2C+entered+into+Covenant+of+Works+with+him.+viz.+by+real+impressions+upon+his+heart%3A+though+not+by+verbal+expressions+to+the+ear.+For+by+this+Law+written+in+Adam%E2%80%99s+heart%2C+he+had+laid+before+him%2C+what+obedience+was+required+and+assented+to+on+Adam%E2%80%99s+part%3A+And+what+recompense+should+be+performed+on+God%E2%80%99s+part.+And+this+was+at+least+an+implicit%2C+if+not+an+explicit%2C+covenanting.+2.+From+God%E2%80%99s+express+prescription+of+a+positive+Law+unto+Adam+in+his+innocent+State.+God%E2%80%99s+positive+Law+is+laid+down+in+these+words%2C+%E2%80%9CAnd+the+LORD+God+commanded+the+man%2C+saying%2C+of+every+Tree+of+the+Garden+you+may+freely+eat%3A+But+of+the+Tree+of+the+Knowledge+of+good+and+evil%2C+you+shall+not+eat+of+it%3B+for+in+the+day+that+you+eat+thereof+thou+shall+surely+die.%E2%80%9D+Here+are+parties+covenanting%2C+and+agreeing+upon+terms%2C+viz.+God+and+Adam%3A+Here+are+also+terms+agreed+upon+and+matters+covenanted+reciprocally+by+these+parties%3B+Adam+on+his+part+was+to+be+obedient+to+God%2C+in+forbearing+to+Eat+of+the+Tree+of+Knowledge+only%3A+God+on+his+part%2C+for+present%2C+permits+Adam+to+eat+of+all+other+Trees+of+the+Garden%3B+And+for+future+%28in+his+explicit+threatening+of+death+in+case+of+disobedience%2C%29+implicitly+promises+life+in+case+of+obedience+herein.+Now+where+there+are+parties+covenanting+and+agreeing+upon+terms%3A+And+terms+mutually+agreed+upon+by+those+parties%2C+as+here%3B+there%E2%80%99s+the+substance+of+an+express+covenant%2C+though+it+be+not+formally+and+in+express+words+called+a+covenant.%E2%80%9D%0A%0A%E2%80%94+Francis+Roberts%2C+The+Mystery+And+Marrow+Of+The+Bible%2C+%28London%2C+1657%29%2C+19%E2%80%9321+%5BSpelling+and+punctuation+modernized%5D.&amp;url=https%3A%2F%2F5solasquotes.github.io%2Fquote%2F47aa6c917c.html&amp;via=5Solas" target="_blank" rel="noopener">Share on X</a><a class="perma" href="../quote/47aa6c917c.html">Permalink</a><a class="src" href="https://heidelblog.net/2016/02/roberts-god-made-an-implicit-covenant-of-works-with-adam/" rel="noopener" target="_blank">Read it online · Heidelblog</a></div>

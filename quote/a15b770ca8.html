<blockquote><p>Secondly, whereas there goes but two things to the reformation of the Church, they are both in the word glory.

First, there must be all the ordinances; thus the Ark was called glory, and the Ark signified both the word and Sacraments; here are communicants in these, and they are such as are cleansed and undefiled, vers. 3. here is thirdly, government; 2 Pet. 2.10. it is said of some they do despise and not respect dominions, or glories, as the word is; and the glory that is there spoken is not evil but ecclesiastical, for it is such a kind of despising, as Corah and Dathan were guilty of against Moses, Jude 8.11. Now they opposed Moses, not as a Magistrate, but as a Minister and Law-giver unto the Church, and therefore they said, Are not all the people of the Lord holy? and not wise, or valorous, or true hearted? which art the virtues of a Magistrate. Besides, false teachers are for the most part flatterers of Princes, not Despisers, as Zedekiah was, and Simon Magus who adored Nero.

When you have the ordinances, then the Second thing required to a Reformation, is to have them pure, and after God’s prescript, without human addition or alteration: take this for a rule, the more plain God’s ordinances are, the more powerful; the more there is of man, the less there is of God in them, Ezek. 44.7. God tells them they had polluted his Sanctuary, that is, made it common, the sacramental bread did them no more good than their own ordinary bread, and the company of the Saints no more then the company and society of men. You have this in the text too, for here is beauty joined with glory in vers. 2. and beauty is a native complexion; here is glory joined with purging, the spirit of judgement, and of burning, in the verse before my text; here is holiness written on every Soul, vers. 3. and to be holy is all one with being set apart to a holy use and being prepared, and fitted for it.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/sidrach-simpson.html">Sidrach Simpson</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Reformation’s preservation opened in a sermon preached at Westminster before the honourable House of Commons, at the late solemne fast, July 26, 1643</cite>, (London: Benjamin Allen, 1643), pp 4-5.</span></figcaption>

<blockquote><p>6. The question concerning particular works, or permitted recreations, is wholly useless and trifling: for quod lege prohibitoriâ vetitum non est, permissum intelligitur, says the law: all that is permitted which in the negative precept is not forbidden: But as for some persons to give themselves great liberties of sport on that day is neither pious nor prudent; so to deny some to others is neither just nor charitable. The plowman sits still in the Church and the Priest labours; and the wearied man is permitted to his refreshment, and others not permitted because they need it not (Ordinary Gloss on Mt. 28); and there is no violation of any commandement of God, even when there is a profanation of the day indulged upon pious and worthy considerations.</p></blockquote>

<blockquote><p>…we would not only fall down upon our faces and give him thanks, but with loud voices would we praise Him, and in the midst of the congregation would we extol his name, as David and Asaph do almost in every psalm. For doubtless whoso believeth that God loveth him, and feeleth by his faith, that he hath forgiven him all his sins, and careth for him… shall be compelled by the Spirit of God to break out into praise and thanksgiving therefore… but shall cry and call upon them, as David doth, saying: “Praise the Lord with me, and let us magnify his name together. I sought the Lord, and He heard me, yea, He delivered me out of all my fear.”… Yea, would God that our minstrels had none other thing to play upon, neither our carters and ploughmen other thing to whistle upon, save psalms, hymns, and such godly songs as David is occupied withal! And if women, sitting at their rocks [instruments used in spinning], or spinning at the wheels, had none other songs to pass their time withal, than such as Moses’ sister, Glehana’s [Elkanah’s] wife, Debora, and Mary the mother of Christ, have sung before them, they should be better occupied than with ‘hey nony nony, hey troly loly,’ and such like fantasies. If young men also that have the gift of singing, took their pleasure in such wholesome ballads as the [apocryphal] three children sing in the fire, and as Jesus the Son of Sirac doth in his last chapter, it were a token, both that they felt some spark of God’s love in their hearts, and that they also had some love unto Him; for truly, as we love, so sing we… Seeing then that, as the prophet David saith, it is so good and pleasant a thing to praise the Lord, and so expedient for us to be thankful (Ps. 147); therefore, to give our youth of England some occasion to change their foul and corrupt ballads into sweet songs and spiritual hymns of God s honor, and for their own consolation in him, I have here, good reader, set out certain comfortable songs grounded on God’s Word, and taken some out of the holy scripture, specially out of the Psalms of David, all whom would God that our musicians would learn to make their songs! and if they which are disposed to be merry, would in their mirth follow the counsel of St. Paul and St. James (Col. 3; James 5), and not to pass their time in naughty songs of fleshly love and wantonness, but with singing of psalms, and such songs as edify, and corrupt not men’s conversation. … The children of Israel in the old time, when God had delivered them from their enemies, gave thanks unto Him, and made their song of Him, as thou seest by Moses, Barak, David, and other more. Why should not we then make our songs and mirth of God, as well as they? Hath He not done as much for us as for them? Hath He not delivered us from as great troubles as them? Yes, doubtless. Why should He not then be our pastime, as well as theirs? As for such psalms as the scripture describeth (beside the great consolation that they bring into the heart of the spiritual singer) they do not only cause him to spend his time well by exercising himself in the sweet Word of God; but through such ensamples they provoke other men also unto the praise of God and virtuous living. And this is the very right use wherefore psalms should be sung; namely, to comfort a man’s heart in God, to make him thankful, and to exercise him in his Word, to encourage him in the way of godliness, and to provoke other men unto the same. By this thou mayest perceive, what spiritual edifying cometh of godly psalms and songs of God s Word; and what inconvenience foloweth the corrupt ballads of this vain world. …</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/miles-coverdale.html">Miles Coverdale</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Ghostly</cite>, [Spiritual] Psalms and Spiritual Songs (1539), ‘Unto the Christian Reader’ in Remains of Myles Coverdale (Cambridge: Parker Society, 1846), pp. 536-540</span></figcaption>

<blockquote><p>The sins which are prohibited can be enumerated as follows: First, we sin when we do not, with joyous approbation, set the sabbath apart from the other days, and when we fail to acknowledge that this day has been set apart by God by virtue of His example and command, having appointed it to be a day of rest, refreshment, and glorification of God. This sin consists in disobedience and a despising of privileges.

Secondly, we sin when we make a workday out of this day — if we occupy ourselves with the work of our profession; that is, to be engaged as brewers, bakers, laundry men, cooks, tailors, and shoemakers. Furthermore, we sin if, in order to finish remaining work, we then bring work home, even if it is toward noon. This also applies to barbers, those who load and unload ships, those who labour upon ferries, luggage porters, and garbage men; it pertains to all the labour whereby one earns a living. To this also belong miscellaneous activities which one postpones to the day of rest or does on this day to be prepared for the next day; such as mending, washing of children, to either prepare wash, send it to the laundry, or receive it at home, writing out bills, and going shopping — in one word, all that by which one gains money and time. On this day God wants universal cessation of activity upon the entire face of the earth. This is evident from the commandment itself.

Thirdly, we sin when we transform this day into a market day. This pertains to buying and selling by merchants, store owners, sellers of fruit, vendors of all sorts of edible material, sellers of fish, etc. (cf. Neh 13:15-16, 19-21).

Fourthly, we sin when we make this day into a day of worldly pleasure. The sabbath is a delight — however, a delighting in the Lord. It is a dreadful desecration of this day, however, when we abuse it by delighting ourselves in worldly things and in the lusts of the flesh. This pertains to sailing, horse-riding, fishing, bird-hunting, playing tennis, playing ball, or to the entertaining of one’s self with such things that are lawful at the appropriate time and place, in the appropriate company, and with the appropriate objective. This pertains even more to games of chance, playing cards, and playing with dice (cf. Isa 58:13-14). However, strolling in the fields or in gardens (be it alone or with others) does not belong to the forbidden sins, if we do so for the purpose of observing the works of God, to glorify Him thereby, and to be refreshed according to soul and body. Even if the world does this in a sinful manner, this cannot prevent the believer from doing it in a spiritual manner.

Fifthly, we sin when we make this day into a day of sin, attiring ourselves with all manner of hideous, worldly garb, and even daring to come thus to church and thereby before God‘s countenance. This pertains to drinking in bars and inns, where one can hear the violin, the vain chatter and jeering of drunkards, and the playing of drums. This pertains to having cold buffets in one’s yard, elaborate meals in the home, and being engaged in all manner of foolish talk and gossip. This pertains to going courting — as young men and women are accustomed to do in many villages. In one word, we sin if we spend this day in all manner of looseness and licentiousness. Such sins are double in measure — yes, they provoke God in an extraordinary manner.

Sixthly, we sin by making this a day of idleness, spending the entire day in a lazy and slothful manner, sleeping the major part of the morning. Having nothing to do, one can then catch up on sleep. Thus, there are many who sleep away the morning service, eat during the afternoon service, and walk away the evening service. Even if one has attended the worship services once or twice, he may possibly have slept there or have been occupied with other thoughts, and thus derived no more benefit from this than a donkey would. Such persons nevertheless imagine that they have spent the sabbath well, for they have rested and have been to church.

Seventhly, we sin when we reject and speak against the sabbath; draw others away from hallowing this day and give them liberty to do so; ridicule those who conscientiously hallow the sabbath according to God‘s command, railing at them by calling them ignorant, hair-splitters, and hypocrites (how abominable!); are unwilling to hallow the sabbath ourselves; draw others away from doing so; and mock with those who sanctify this day.</p></blockquote>

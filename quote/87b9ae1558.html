<main class="wrap"><figure class="quote" id="q-87b9ae1558" data-kw="">
<blockquote><p>Common “wine” is instituted, of indifferent color, undiluted with water because it is called simply the “fruit of the vine” (Mt. 26:29; Mk. 14:25). Thus the Romanists here without reason urge the mixture of water with the wine, which although according to them is not of the integrity of the sacrament, still is of its congruity, nor can it be omitted without mortal sin (as Bellarmine holds). For although it may seem to be indifferent (which may be equally omitted or retained, provided the order of the church is not disturbed; and it is clear that by the ancients water was mixed with the wine because the use of pure wine is rare among the orientals); still they are deservedly to be censured because (without authority from the word) they invent mortal sins and condemn the liberty of others.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/francis-turretin.html">Francis Turretin</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Institutes of Elenctic Theology</cite>, 19.22.6 ed. James T. Dennison Jr., trans. George Musgrave Giger, vol. 3 (Phillipsburg, NJ: P&amp;R Publishing, 1992–1997), 431.</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/the-lords-supper.html">The Lord&#x27;s Supper</a></span></div>

</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-820b3cb529" data-kw="">
<blockquote><p>Do they [our divines] not teach… That the negative precepts of the Law do bind, not only at all times, but likewise to all times, (whereupon it follows that we may never do that which is inconvenient or scandalous), and that the affirmative precepts though they bind at all times, yet not to all times, but only quando expedit [when it is expedient] (whereupon it follows that we are never bound to the practice of any duty commanded in the Law of God except only when it is expedient to be done)? …forasmuch as to abstain from things scandalous and inconvenient is one of the negative precepts of the Law of God… it follows that the use and practice of the same is altogether unlawful unto us.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/george-gillespie.html">George Gillespie</a></span><span class="wk"><span class="lbl">Work:</span> <cite>English Popish Ceremonies</cite>, pt. 2, ch. 1, ‘Against Some of our Opposites who aknowledge the inconveniency of the Ceremonies &amp; yet would have us yield to them’ in English Popish Ceremonies (1637), pp. 1-13, p. 9</span></figcaption>

</figure><figure class="quote" id="q-e3fdcde974" data-kw="">
<blockquote><p>45. The Lord’s Supper shall be celebrated at least every month, and everyone at their location should strive that if the whole congregation cannot participate every Sunday (which most corresponds to Christ’s ordinance and to apostolic custom and is greatly desired), at least it should happen as often as possible…</p></blockquote>

</figure><figure class="quote" id="q-118969d3d1" data-kw="institution">
<blockquote><p>The other sacrament of the New Testament is the holy Supper, in which, by the distribution and reception of broken bread and poured-out wine, is declared and sealed to believers the communion of the body of Christ broken for them on the cross and of his blood shed for them unto eternal life. The more illustrious and of greater moment to the consolation of believers this mystery of the Christian religion is, with so much the greater violence has Satan always endeavored to obscure and corrupt it in order to deprive the church of this inestimable treasure. Hence it has happened that in no part of religion have such prolix and animated disputations been raised up, so that at length the Romanists seem to have constituted the sum of theology in this article, nor is there anything in theology or philosophy which they have not brought to bear upon this and compelled to serve their purpose. Various names by which it is usually expressed: (1) the Lord’s Supper (1 Cor. 11:20).</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/francis-turretin.html">Francis Turretin</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Institutes of Elenctic Theology</cite>, 19.21.1</span></figcaption>

</figure><figure class="quote" id="q-98e33e6fa9" data-kw="">
<blockquote><p>For what is idolatry if it is not to worship the gifts instead of the giver? Here the sin is twofold. The honour robbed from God is transferred to the creature, and God, moreover, is dishonoured by the pollution and profanation of his own goodness, while his holy sacrament is converted into an execrable idol.</p></blockquote>

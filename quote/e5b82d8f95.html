<blockquote><p>19. 4. Although the day be wholly to be dedicated to the ends of a sacred rest before insisted on, yet, 1. Duties in their performance drawn out to such a length as to beget wearisomeness and satiety, tend not to edification, nor do any way promote the sanctification of the name of God in the worship itself. Regard, therefore, in all such performances is to be had: 1. Unto the weakness of the natural constitution of some, the infirmities and indispositions of others, who are not able to abide in the outward part of duties, as others can. And there is no wise shepherd but will rather suffer the stronger sheep of his flock to lose somewhat of what they might reach to in his guidance of them, than to compel the weaker to keep pace with them to their hurt, and it may be their ruin. Better a great number should complain of the shortness of some duties, who have strength and desires for a longer continuance in them, than that a few who are sincere should be really discouraged by being overburdened, and have the service thereby made useless unto them. I always loved in sacred duties that observation of Seneca concerning the orations of Cassius Severus, when they heard him, ‘Timebamus ne desineret,’ ‘We were afraid that he would end.’ 2. To the spiritual edge of the affections of men, which ought to be whetted, and not through tediousness in duties abated and taken off.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/john-owen.html">John Owen</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Exercitation XL, ‘The Practical Observance of the Lord’s Day’ in Commentary on Hebrews (d. 1683), vol. 1 (of 4)</cite>, pp. 748-49</span></figcaption>

<blockquote><p>…young men who would ‘endure long and hard labor in so much that after twelve hours hard work they will go in the evening to football, stoole ball, cricket, prison-base, wrestling, cugel throwing, or some such like vehement exercise.&#x27;” 7 Richard Baxter maintained that the argument from lack of spare time on week-days was a “sad argument to be used by them that by racking of rents do keep them (laboring people) in poverty.”8 The Puritan protest against Sabbath profanation was also a protest against overwork on the other six days of the week. But the truth is, it is not the minds of poor laboring men, that are overworked and tired on week-days, but it is their bodies; and therefore there is no recreation so suitable to them as the ease of the body, and the holy and joyful exercise of the mind, upon their Creator, and their Redeemer, and their everlasting rest.9 1 Bownd, Sabbathum Veteris, p. 271; cf. Dudley Fenner, A Short and Profitable Treatise, of lavvful and unlavvful Recreations; William Perkins, 1558-1602: English Puritanist, ed. by Thomas F. Merrill (Nieuwkoop, 1966), pp. 217-22 with extracts from Perkins’ The Whole Treatise of Cases of Conscience, Book 3. 2 Elton, An Exposition of the Ten Commandments, pp. 54-56; George Walker, The Doctrine of the Holy Weekly Sabbath (London, 1641), p. 157; Richard Baxter, The Divine Appointment of the Lord’s Day, pp. 440, 444-445. 3 Cf. Nicolas Bifield (Byfield), The Beginning of the Doctrine of Christ, or, A Catalogue of Sinnes (London, 1636), p. 63. 4 For a survey of the relative truth of this point, see Carl Bridenbaugh, Vexed and Troubled Englishmen, 1590-1642 (New York, 1968), pp. 109-118. 5 John Dod and Robert Cleaver, A Plaine and Familiar Exposition of the Ten Commandments (London, 1628), p. 140. 6 Percy Scholes (The Puritans and Music in England and New England(London, 1934), pp. 104-111) mentions the provisions of a bill presented to Parliament in 1647 which allowed every other Tuesday to be designated as a holiday. Scholes’ judicious treatment of the Puritan attitude toward recreation is refreshing as well as accurate; cf. also pp. 302-331. Compare Hugh Martin, Puritanism and Richard Baxter (London, 1954), pp. 101-106. 7 Bridenbaugh, Vexed, p. 115. 8 Baxter, Divine Appointment, p. 444. 9 Ibid., p. 445.</p></blockquote>

<blockquote><p>The reasons by which it appears that this restraint of kindling a fire [by the Israelites in the wilderness] on the Sabbath day was only temporary, are these: … Secondly, this seems to cross our Savior’s general rule, Mk. 2:27, that the Sabbath was made for man, and not man for the Sabbath; He means for man’s comfort and refreshing, for which kindling of fire and dressing of meat may be, and are in a sort necessary. Thirdly, our Savior allows the loosing of a beast from the stall, and leading of him to the water on the Sabbath day: now we know, the beast might be provided for by setting water in the stall overnight, which would refresh it sufficiently, and better than meat dressed overnight could comfort many men. Fourthly, we find our Savior present at a great feast, Lk. 14:1, where many, and it seems persons of quality, verses 7, 12, were bidden: now it is very unlikely that the provisions for that feast were dressed over night; and if it were dressed on that day, neither would the Pharisee have permitted, nor our Savior have countenanced the dinner with his presence, if dressing of meat, kindling of fires on the Sabbath day, had been forbidden by the law. Now why the dressing of manna, while the Israelites were in their peregrination in the wilderness was forbidden, though the dressing of other meats might be allowed afterwards, there may be some reason given. For manna it may be… as good and comfortable eaten cold as hot, and the preparing overnight, might be no inconvenience at all; howsoever it is out of question that in that unsetled condition of the Israelites wandering in the wilderness, when they were enforced to pick up fuel, where they could get it, baking and boiling must needs be more troublesome and laborious than it was afterwards in Canaan, where being settled in their dwellings, they had all things whereof they were to make use for such works provided and ready at hand.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/john-white.html">John White</a></span><span class="wk"><span class="lbl">Work:</span> <cite>A Way to the Tree of Life Discovered in Sundry Directions for the Profitable Reading of the Scriptures... (1647), A Digression concerning the Morality of the Fourth Commandement, Section III, ‘The Morality &amp; Perpetuity of the Sabbath Proved out of the Fourth Commandement’, pp. 294-95 White was a Westminster divine.</cite></span></figcaption>

<div class="actions"><button class="copy" data-copy="“The reasons by which it appears that this restraint of kindling a fire [by the Israelites in the wilderness] on the Sabbath day was only temporary, are these: … Secondly, this seems to cross our Savior’s general rule, Mk. 2:27, that the Sabbath was made for man, and not man for the Sabbath; He means for man’s comfort and refreshing, for which kindling of fire and dressing of meat may be, and are in a sort necessary. Thirdly, our Savior allows the loosing of a beast from the stall, and leading of him to the water on the Sabbath day: now we know, the beast might be provided for by setting water in the stall overnight, which would refresh it sufficiently, and better than meat dressed overnight could comfort many men. Fourthly, we find our Savior present at a great feast, Lk. 14:1, where many, and it seems persons of quality, verses 7, 12, were bidden: now it is very unlikely that the provisions for that feast were dressed over night; and if it were dressed on that day, neither would the Pharisee have permitted, nor our Savior have countenanced the dinner with his presence, if dressing of meat, kindling of fires on the Sabbath day, had been forbidden by the law. Now why the dressing of manna, while the Israelites were in their peregrination in the wilderness was forbidden, though the dressing of other meats might be allowed afterwards, there may be some reason given. For manna it may be… as good and comfortable eaten cold as hot, and the preparing overnight, might be no inconvenience at all; howsoever it is out of question that in that unsetled condition of the Israelites wandering in the wilderness, when they were enforced to pick up fuel, where they could get it, baking and boiling must needs be more troublesome and laborious than it was afterwards in Canaan, where being settled in their dwellings, they had all things whereof they were to make use for such works provided and ready at hand.”

— John White, A Way to the Tree of Life Discovered in Sundry Directions for the Profitable Reading of the Scriptures... (1647), A Digression concerning the Morality of the Fourth Commandement, Section III, ‘The Morality &amp; Perpetuity of the Sabbath Proved out of the Fourth Commandement’, pp. 294-95 White was a Westminster divine.">Copy</button><a class="share" href="https://x.com/intent/post?text=%E2%80%9CThe+reasons+by+which+it+appears+that+this+restraint+of+kindling+a+fire+%5Bby+the+Israelites+in+the+wilderness%5D+on+the+Sabbath+day+was+only+temporary%2C+are+these%3A+%E2%80%A6+Secondly%2C+this+seems+to+cross+our+Savior%E2%80%99s+general+rule%2C+Mk.+2%3A27%2C+that+the+Sabbath+was+made+for+man%2C+and+not+man+for+the+Sabbath%3B+He+means+for+man%E2%80%99s+comfort+and+refreshing%2C+for+which+kindling+of+fire+and+dressing+of+meat+may+be%2C+and+are+in+a+sort+necessary.+Thirdly%2C+our+Savior+allows+the+loosing+of+a+beast+from+the+stall%2C+and+leading+of+him+to+the+water+on+the+Sabbath+day%3A+now+we+know%2C+the+beast+might+be+provided+for+by+setting+water+in+the+stall+overnight%2C+which+would+refresh+it+sufficiently%2C+and+better+than+meat+dressed+overnight+could+comfort+many+men.+Fourthly%2C+we+find+our+Savior+present+at+a+great+feast%2C+Lk.+14%3A1%2C+where+many%2C+and+it+seems+persons+of+quality%2C+verses+7%2C+12%2C+were+bidden%3A+now+it+is+very+unlikely+that+the+provisions+for+that+feast+were+dressed+over+night%3B+and+if+it+were+dressed+on+that+day%2C+neither+would+the+Pharisee+have+permitted%2C+nor+our+Savior+have+countenanced+the+dinner+with+his+presence%2C+if+dressing+of+meat%2C+kindling+of+fires+on+the+Sabbath+day%2C+had+been+forbidden+by+the+law.+Now+why+the+dressing+of+manna%2C+while+the+Israelites+were+in+their+peregrination+in+the+wilderness+was+forbidden%2C+though+the+dressing+of+other+meats+might+be+allowed+afterwards%2C+there+may+be+some+reason+given.+For+manna+it+may+be%E2%80%A6+as+good+and+comfortable+eaten+cold+as+hot%2C+and+the+preparing+overnight%2C+might+be+no+inconvenience+at+all%3B+howsoever+it+is+out+of+question+that+in+that+unsetled+condition+of+the+Israelites+wandering+in+the+wilderness%2C+when+they+were+enforced+to+pick+up+fuel%2C+where+they+could+get+it%2C+baking+and+boiling+must+needs+be+more+troublesome+and+laborious+than+it+was+afterwards+in+Canaan%2C+where+being+settled+in+their+dwellings%2C+they+had+all+things+whereof+they+were+to+make+use+for+such+works+provided+and+ready+at+hand.%E2%80%9D%0A%0A%E2%80%94+John+White%2C+A+Way+to+the+Tree+of+Life+Discovered+in+Sundry+Directions+for+the+Profitable+Reading+of+the+Scriptures...+%281647%29%2C+A+Digression+concerning+the+Morality+of+the+Fourth+Commandement%2C+Section+III%2C+%E2%80%98The+Morality+%26+Perpetuity+of+the+Sabbath+Proved+out+of+the+Fourth+Commandement%E2%80%99%2C+pp.+294-95+White+was+a+Westminster+divine.&amp;url=https%3A%2F%2F5solasquotes.github.io%2Fquote%2F5fe307e2c4.html&amp;via=5Solas" target="_blank" rel="noopener">Share on X</a><a class="perma" href="../quote/5fe307e2c4.html">Permalink</a><a class="src" href="https://reformedbooksonline.com/recreation-on-the-lords-day/#:~:text=The%20reasons%20by%20which%20it%20appears,works%20provided%20and%20ready%20at%20hand." rel="noopener" target="_blank">Read it online · Reformed Books Online</a></div>

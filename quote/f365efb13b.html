<blockquote><p>That the law as a covenant of works was displayed on Mount Sinai appears also from this: the Ten Commandments, written on tables of stone and so given to Moses on Sinai are called, by the apostle Paul, “the ministration of death, written and engraven in stones” (2 Cor. 3:7). Now it is manifest that these commandments are no otherwise the ministration of death than as they are in the form of the covenant of works. In this form they were delivered to Moses to be deposited in the ark in order to prefigure the fulfilling of them by Messiah, the surety of a better covenant (Heb. 7:22), and the concealing of that form, or the removal of it from them, to all who should believe in Him.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/john-colquhoun.html">John Colquhoun</a></span><span class="wk"><span class="lbl">Work:</span> <cite>A Treatise on the Law and Gospel</cite>, (Grand Rapids: Reformation Heritage Books), 55–56.</span></figcaption>

</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-15e919d249" data-kw="">
<blockquote><p>1. Christ is a doer and fulfiller of the covenant of works most exactly in all points, both the command, and the curse and penalty of the Covenant, is satisfied by him; this is works, and this was the condition required upon his part, Heb. 10. 7, “Then said I, lo I come, in the volume of the book it is written of me, to do your will, O God.” Gal. 3. 13, “Christ has redeemed us from the curse of the Law, being made a curse for us.”

2. Christ as a doer and obedient fulfiller of the Law, has a reward in justice by the promise of this covenant: For (I humbly conceive) he had his reward of debt, and merit, having paid a condign price to the justice of God; therefore his reward is due to him, by commutative Justice, Phil. 2. 7, 8, “But made himself of no reputation, and took upon him the form of a servant, and was made in the likeness of man; And being found in fashion as a man, he humbled himself, and became obedient unto death, even the death of the Cross; wherefore God also hath highly exalted him,” and is craved by him, Joh. 17. 4, 5, “I have glorified you on earth, I have finished the work which you gaves me to do. And now, O Father, glorify me with your own self.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/patrick-gillespie.html">Patrick Gillespie</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Ark of the Covenant Opened</cite>, (London, 1677), 61 [spelling and punctuation modernized].</span></figcaption>

</figure><figure class="quote" id="q-8f2f9905ba" data-kw="">
<blockquote><p>Now, therefore, we are to speak of the Word, or of the covenant of God, having first set down the ground, that all the word of God appertains to some covenant; for God speaks nothing to man without the covenant. For which cause all the scripture, both old and new where in God’s Word is contained, bears the name of God’s covenant or testament. The covenant of God generally is a promise under some one certain condition. And it is twofold; the first is the covenant of works; the second is the covenant of grace. Paul (Gal 4:24) expressly set down two covenants, which in the Old Testament were shadowed by two women, as by types, to whit, Hagar, the handmaid, and Sarah, the free woman; For saith he,”These be those two covenants.” Let us then speak something of these two covenants; and first of the covenant of works. The covenant of works, which may also be called a legal or natural covenant, is founded in nature, which by creation was pure and holy, and in the law of God, which in the first creation was engraven in man’s heart. For after that God had created man after his own image, pure and holy, and had written his law in his mind, he made a covenant with man, wherein he promised him eternal life, under the condition of holy and good works, which should be answerable to the holiness and goodness of their creation, and conformable to his law and that nature thus beautified with holiness and righteousness in the light of God’s law, is the foundation of the covenant of works, it is very evident for that could not stand well with the justice of God to make a covenant under condition of good works and perfect obedience to his law, except he had first created man pure and holy, and had engraven his law in His heart, whence those good works might proceed. For this cause he, when he was to repeat that covenant of works to the people of Israel, he gave the first law written in tables of stone; Then he made a covenant with his people, saying,”do these things and ye shall live.” Therefore the ground of the covenant of works was not Christ, nor the grace of God in Christ, but the nature of man in the first creation holy and perfect, endued also with the knowledge of the law. For, as touching the covenant of works, there was no mediator in the beginning between God and man, that God showed in him, as in and buy a mediator, make his covenant with man. And the causes that there was no need of a mediator was this, that albeit there were two parties entering into a covenant, yet there was no such breach or variance betwixt them that they had need of any mediator to make reconciliation between them; for, as for the covenant of works, God made this covenant with man, as one friend doth with another. For in the creation we were God’s friends, and not his enemies. Thus far of the ground of the covenant of works.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/robert-rollock.html">Robert Rollock</a></span><span class="wk"><span class="lbl">Work:</span> <cite>A Treatise of God’s Effectual Calling in Select Works of Robert Rollock</cite>, ed. William M. Gunn , 2 vol. (Edinburgh: Woodrow Society, 1849), 1.33–35</span></figcaption>

+to+his+law%2C+except+he+had+first+created+man+pure+and+holy%2C+and+had+engraven+his+law+in+His+heart%2C+whence+those+good+works+might+proceed.+For+this+cause+he%2C+when+he+was+to+repeat+that+covenant+of+works+to+the+people+of+Israel%2C+he+gave+the+first+law+written+in+tables+of+stone%3B+Then+he+made+a+covenant+with+his+people%2C+saying%2C%E2%80%9Ddo+these+things+and+ye+shall+live.%E2%80%9D+Therefore+the+ground+of+the+covenant+of+works+was+not+Christ%2C+nor+the+grace+of+God+in+Christ%2C+but+the+nature+of+man+in+the+first+creation+holy+and+perfect%2C+endued+also+with+the+knowledge+of+the+law.+For%2C+as+touching+the+covenant+of+works%2C+there+was+no+mediator+in+the+beginning+between+God+and+man%2C+that+God+showed+in+him%2C+as+in+and+buy+a+mediator%2C+make+his+covenant+with+man.+And+the+causes+that+there+was+no+need+of+a+mediator+was+this%2C+that+albeit+there+were+two+parties+entering+into+a+covenant%2C+yet+there+was+no+such+breach+or+variance+betwixt+them+that+they+had+need+of+any+mediator+to+make+reconciliation+between+them%3B+for%2C+as+for+the+covenant+of+works%2C+God+made+this+covenant+with+man%2C+as+one+friend+doth+with+another.+For+in+the+creation+we+were+God%E2%80%99s+friends%2C+and+not+his+enemies.+Thus+far+of+the+ground+of+the+covenant+of+works.%E2%80%9D%0A%0A%E2%80%94+Robert+Rollock%2C+A+Treatise+of+God%E2%80%99s+Effectual+Calling+in+Select+Works+of+Robert+Rollock%2C+ed.+William+M.+Gunn+%2C+2+vol.+%28Edinburgh%3A+Woodrow+Society%2C+1849%29%2C+1.33%E2%80%9335&amp;url=https%3A%2F%2F5solasquotes.github.io%2Fquote%2F8f2f9905ba.html&amp;via=5Solas" target="_blank" rel="noopener">Share on X</a><a class="perma" href="../quote/8f2f9905ba.html">Permalink</a><a class="src" href="https://heidelblog.net/2015/03/rollock-covenant-of-works-founded-on-nature-and-republished-to-israel/" rel="noopener" target="_blank">Read it online · Heidelblog</a></div>
</figure><figure class="quote" id="q-59dd07b4c9" data-kw="">
<blockquote><p>A difference exists between a furnished and destitute state. The one is of the law considered in itself and its own nature; the other, in relation to us. The law was given to man in the beginning (before the fall) for life and by itself also led to life according to the sanction “do this and thou shalt live” (cf. Rom. 2:13). But after the fall, being destitute of strength through the flesh, it is not given for life, but for a mirror of sin and misery to render the sinner inexcusable (Rom. 3:19, 20). [1.4.15] …So God seriously wills (i.e., commands man to obey the law that he may live, according to the brief clause of the covenant of works: “Do this and thou shalt live”). [4.17.45] IV. (2) If Adam was righteous, he ought to have been immortal because there is a necessary connection between righteousness and life. (a) From the order of God who has joined righteousness and life in the law by an indissoluble bond (as he joined closely together sin and death: “Do this and thou shalt live; the soul that sinneth it shall die”). [5.12.4] XVII. There is not the same relation of justification and of the covenant through all things. To the former, faith alone concurs, but to the observance of the latter other virtues also are required besides faith. These conduce not only to the acceptance of the covenant, but also to its observance. For these two things ought always to be connected—the acceptance of the covenant and the keeping of it when accepted. Faith accepts by a reception of the promises; obedience keeps by a fulfillment of the commands. “Be ye holy, for I am holy.” And yet in this way legal and evangelical obedience are not confounded because the legal is prescribed for the meriting of life, the evangelical, however, only for the possession of it. The former precedes as the cause of life (“Do this and thou shalt live”); the latter follows as its fruit, not that you may live but because you live. The former is not admitted unless it is perfect and absolute; the latter is admitted even if imperfect, provided it be sincere. That is only commanded as man’s duty; this is also promised and given as the gift of God. [12.3.17]</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/francis-turretin.html">Francis Turretin</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Institutes of Elenctic Theology</cite>, trans. George Musgrave Giger, ed. James T. Dennison Jr. (Phillipsburg, NJ: P&amp;R Publishing, 1992–97).</span></figcaption>

<div class="actions"><button class="copy" data-copy="“A difference exists between a furnished and destitute state. The one is of the law considered in itself and its own nature; the other, in relation to us. The law was given to man in the beginning (before the fall) for life and by itself also led to life according to the sanction “do this and thou shalt live” (cf. Rom. 2:13). But after the fall, being destitute of strength through the flesh, it is not given for life, but for a mirror of sin and misery to render the sinner inexcusable (Rom. 3:19, 20). [1.4.15] …So God seriously wills (i.e., commands man to obey the law that he may live, according to the brief clause of the covenant of works: “Do this and thou shalt live”). [4.17.45] IV. (2) If Adam was righteous, he ought to have been immortal because there is a necessary connection between righteousness and life. (a) From the order of God who has joined righteousness and life in the law by an indissoluble bond (as he joined closely together sin and death: “Do this and thou shalt live; the soul that sinneth it shall die”). [5.12.4] XVII. There is not the same relation of justification and of the covenant through all things. To the former, faith alone concurs, but to the observance of the latter other virtues also are required besides faith. These conduce not only to the acceptance of the covenant, but also to its observance. For these two things ought always to be connected—the acceptance of the covenant and the keeping of it when accepted. Faith accepts by a reception of the promises; obedience keeps by a fulfillment of the commands. “Be ye holy, for I am holy.” And yet in this way legal and evangelical obedience are not confounded because the legal is prescribed for the meriting of life, the evangelical, however, only for the possession of it. The former precedes as the cause of life (“Do this and thou shalt live”); the latter follows as its fruit, not that you may live but because you live. The former is not admitted unless it is perfect and absolute; the latter is admitted even if imperfect, provided it be sincere. That is only commanded as man’s duty; this is also promised and given as the gift of God. [12.3.17]”

— Francis Turretin, Institutes of Elenctic Theology, trans. George Musgrave Giger, ed. James T. Dennison Jr. (Phillipsburg, NJ: P&amp;R Publishing, 1992–97).">Copy</button><a class="share" href="https://x.com/intent/post?text=%E2%80%9CA+difference+exists+between+a+furnished+and+destitute+state.+The+one+is+of+the+law+considered+in+itself+and+its+own+nature%3B+the+other%2C+in+relation+to+us.+The+law+was+given+to+man+in+the+beginning+%28before+the+fall%29+for+life+and+by+itself+also+led+to+life+according+to+the+sanction+%E2%80%9Cdo+this+and+thou+shalt+live%E2%80%9D+%28cf.+Rom.+2%3A13%29.+But+after+the+fall%2C+being+destitute+of+strength+through+the+flesh%2C+it+is+not+given+for+life%2C+but+for+a+mirror+of+sin+and+misery+to+render+the+sinner+inexcusable+%28Rom.+3%3A19%2C+20%29.+%5B1.4.15%5D+%E2%80%A6So+God+seriously+wills+%28i.e.%2C+commands+man+to+obey+the+law+that+he+may+live%2C+according+to+the+brief+clause+of+the+covenant+of+works%3A+%E2%80%9CDo+this+and+thou+shalt+live%E2%80%9D%29.+%5B4.17.45%5D+IV.+%282%29+If+Adam+was+righteous%2C+he+ought+to+have+been+immortal+because+there+is+a+necessary+connection+between+righteousness+and+life.+%28a%29+From+the+order+of+God+who+has+joined+righteousness+and+life+in+the+law+by+an+indissoluble+bond+%28as+he+joined+closely+together+sin+and+death%3A+%E2%80%9CDo+this+and+thou+shalt+live%3B+the+soul+that+sinneth+it+shall+die%E2%80%9D%29.+%5B5.12.4%5D+XVII.+There+is+not+the+same+relation+of+justification+and+of+the+covenant+through+all+things.+To+the+former%2C+faith+alone+concurs%2C+but+to+the+observance+of+the+latter+other+virtues+also+are+required+besides+faith.+These+conduce+not+only+to+the+acceptance+of+the+covenant%2C+but+also+to+its+observance.+For+these+two+things+ought+always+to+be+connected%E2%80%94the+acceptance+of+the+covenant+and+the+keeping+of+it+when+accepted.+Faith+accepts+by+a+reception+of+the+promises%3B+obedience+keeps+by+a+fulfillment+of+the+commands.+%E2%80%9CBe+ye+holy%2C+for+I+am+holy.%E2%80%9D+And+yet+in+this+way

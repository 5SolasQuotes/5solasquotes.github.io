<blockquote><p>[F]or it seems plainly to be founded on the clearest notions of the light of nature, that the worship of God is to be regulated by the will and pleasure of God; which if he reveal not, how can we know it? Hence it was that the heathens never pretended reason, but always revelation for their worship.</p></blockquote>

<div class="meta"><span class="t"><a href="../topics/worship.html">Worship</a></span></div>

<blockquote><p>But they like men have transgressed the covenant: there have they dealt treacherously against me.” (Hosea 6:7)

I told them by my prophets what I required of them by covenant, but I could not obtain it, they regarded not what I said. Like men; or, like Adam: some take it for a proper name, and so refer it unto the first man, and his breaking covenant; and, for aught I see, it may well enough refer to him, who forgot or slighted the threat, who judged of what he did by what it appeared, as a small matter; and so these forget and slight my threats, and judge of the place where, and the persons by whom, and the times when, sacrifices are to be offered as no material circumstances, and therefore do choose what places they please, and appoint what priest liketh them best to offer; or else transgress the covenant, as if it were the covenant of a man like themselves.

The covenant; the law of their God, which directed and encouraged their obedience, and which threatened their disobedience, and cursed it. There; in that very place, the good land, which by covenant I gave them, they have broken my covenant; or in the things in which they thought they kept covenant, in their sacrifices, and observing of feasts, in these things they transgress the covenant. Dealt treacherously against me; very frowardly, and with wilful resolutions perverted my law; their transgressing was a designed perfidiousness. I told them, Obedience, not sacrifice; they reply, Sacrifice, and stop there; they give no obedience, though they offer many sacrifices.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/matthew-poole.html">Matthew Poole</a></span><span class="wk"><span class="lbl">Work:</span> <cite>A Commentary on the Holy Bible</cite>, (1685; 3 vols, London: Banner of Truth, 1962), 2: 865.</span></figcaption>

<blockquote><p>34. Though we must prefer better before worse, that worse may be best to us at that time and place when we cannot have better without more hurt than benefit to the public or ourselves. Among many ministers, weak and strong, all cannot hear the best, nor must renounce the weaker. To live under the countenance of government under an honest¹ minister of mean parts in peace and concord, though he use the liturgy, is more to the common advantage of religion and to the profit of most particular souls than to hear an abler man with the distraction of disturbers² and to be fined and lie in prison on no better a cause.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/richard-baxter.html">Richard Baxter</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Catholic Communion Doubly Defended by Dr. Owen’s Vindicator &amp; Richard Baxter</cite>, Detailed | Catholic Communion Doubly Defended by Dr. Owen’s Vindicator &amp; Richard Baxter… (London: Parkhurst, 1684), section 2, pp. 9-14 | Best may be that which can be Attained</span></figcaption>

</figure><figure class="quote" id="q-4ddeaf76d2" data-kw="">
<blockquote><p>It is well known, that in the last century Mr. Rouse’s and Mr. Barton’s versions of the Psalms were much in use and highly esteemed and recommended by many; several other versions were also in use; but the New England and the Scotch were sung by many congregations, much recommended, being preferred by them as the closest versions and most agreeable to the original. For it was then the concurrent judgement of the dissenting churches, that nothing ought to be sung in public worship, but those psalms, hymns, and spiritual songs which God has provided his Church with in his inspired Word. But of late years these versions have been much despised by some, and laid aside by many congregations which formerly used them; because of the roughness of the lines… and other versions, or rather paraphrases on the psalms are made use of by them. Many others use hymns of mere human composure as preferable to the inspired ones. But there are yet many serious Christians, and some churches, that adhere to the sentiments of our godly ancestors in preferring Scripture psalms, hymns and songs to any mere human composures, lest they should incur the guilt of bringing strange fire to God’s altar…</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/samuel-pike.html">Samuel Pike</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Book of Psalms in Metre. Fitted to the Various Tunes in Common Use</cite>, … (London, 1751), ‘The Preface’, p. iii. Pike (1717?–1773) was an Independent minister in London, known for his work on cases of conscience. He argues for inspired Bible-song singing in the Preface.</span></figcaption>

</figure><figure class="quote" id="q-f76f632505" data-kw="">
<blockquote><p>Let every day of the week be managed by you in a Christian sort. To that End, Be sure to present unto the Lord your Morning and Evening-Sacrifice of prayer and praise to God continually: as God of Old appointed a Morning and Evening Sacrifice for every day in the week. Holy David and Daniel Prayed thrice in a day.

Every day, open with God in the morning, and shut with God in the Evening, by some religious ejaculation or savourly meditation. Read daily some portion of Holy Scripture, to keep up your acquaintance with God, with Jesus Christ, and his Spirit, and the mysteries of true Religion. And then follow the lawful affairs of your honest particular Calling, diligently and righteously.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/francis-roberts.html">Francis Roberts</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Letter to the Tree of Life, or, The Natural Man Directed unto Christ (London, 1673), epistolary exhortation.</cite></span></figcaption>

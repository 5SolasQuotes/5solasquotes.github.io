<main class="wrap"><figure class="quote" id="q-51a25e70e1" data-kw="">
<blockquote><p>Assurance of Salvation is attainable. If Salvation be sure upon our believing, then we may be fully assured of Salvation; for one may know certainly whether he believes or not, whether he be content to accept of and close with the Lord Jesus Christ upon his own Terms. This is not only knowable, but it may be more easily discerned than most do apprehend. Were we but with any Measure of Seriousness and Concern, turning our Eyes inward, we could not but know how cur Hearts stand affected toward Christ and the Gospel-method of Salvation …</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/thomas-halyburton.html">Thomas Halyburton</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Great Concern of Salvation</cite>, (Edinburgh, 1721), p. 321.</span></figcaption>

<blockquote><p>§19. Question 12. If another man deceive me into a promise or covenant against my good, am I bound to perform it when I have discovered the deceit? Answer: Yes, 1. in case that the law of the land or other reasons for the public good require it; 2. Or in case that you were faulty by negligence, heedlessness, or otherwise guilty of your own deceit, in any considerable and avoidable degree. Otherwise, in that measure that he deceived you, and in those respects you are not obliged. §20. Question 13. If the contracting parties do neither of them understand the other, is it a covenant: or if it be, whose sense must carry it? Answer: If they understand not each other in the essentials of the contract, it is no contract, in point of conscience: except where the laws, for the public safety, do annex the obligation to the bare external act. But if they understand not one another in some circumstances, and be equally culpable or innocent, they must come to a new agreement in those particulars: But if one party only be guilty of the misunderstanding, he must bear the loss if the other insist on it. … §22. Question 15. If I say I will give such or such a one this or that, am I bound thereby to do it? Answer: It is one thing to express your present mind and resolution without giving away the liberty of changing it: And it’s another thing to intend the obliging of yourself to do the thing mentioned, and that obligation is either intended to man or to God only; and that is either in point of rendition and use, or in point of veracity, or the performance of that moral duty of speaking truth. If you meant no more in saying, ‘I will do it,’ or ‘I will give it,’ but that this is your present will and purpose and resolution, yea, though it add the confident persuasion that your will shall not change, yet this no further obliges you than you are obliged to continue in that will: And a man’s confident resolutions may lawfully be changed upon sufficient cause. But if you intended to alienate the title to another, or to give him present right, or to oblige yourself for the future to him by that promise; or to oblige yourself to God to do it by way of peremptory assertion, as one that will be guilty of a lie if you perform it not; or if you dedicate the thing to God by those words as a vow, then you are obliged to do accordingly (supposing nothing else to prohibit it).</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/richard-baxter.html">Richard Baxter</a></span><span class="wk"><span class="lbl">Work:</span> <cite>A Christian Directory, or a Sum of Practical Theology</cite>, ... (London, 1673) | pt. 4, ch. 19, title 2, p. 117</span></figcaption>

</figure><figure class="quote" id="q-59fd7dbf92" data-kw="">
<blockquote><p>It is farther observed in this Answer [of the Larger Catechism], that men take the name of God in vain by sinful lots. This subject, however, needs explanation. Let it be considered, then, that when lots were an ordinance, by which God in an extraordinary manner determined things which were before unknown, they being an instituted means of appealing to Him for that end, as in the case of Achan and others, were not to be used in a common way; for to have used them so would have been a profaning of a sacred institution. But as this extraordinary ordinance has now ceased, it does not seem unlawful, so as to be an instance of profaneness to make use of lots in civil matters, provided we do not consider them as an ordinance which God has appointed, in which we think we have ground to expect his immediate interposition and to depend upon it as if it were a divine oracle. In this view it would be unlawful, at present, to use lots in any respect whatsoever.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/thomas-ridgley.html">Thomas Ridgley</a></span><span class="wk"><span class="lbl">Work:</span> <cite>A Body of Divinity</cite>, (d. 1734; NY: Robert Carter, 1855), vol. 2, p. 340 Ridgley (c. 1667–1734) was an English dissetning minister and here wrote the first commentary on Westminster’s Larger Catechism.</span></figcaption>

<blockquote><p>§8. Question 3. Is a man obliged by a contract which he made in ignorance or mistake of the matter? Answer: I have answered this before in the case of marriage, pt. 2, ch.

1. I add here, we must distinguish:

1. Between culpable and inculpable error;

2. Between an error about the principal matter and about some smaller accidents or circumstances;

3. Between a case where the law of the Land, or the common good interposes and where it does not.

1. If it be your own fault that you are mistaken, you are not wholly freed from the obligation: But if it was your gross fault, by negligence or vice, you are not at all freed. But if it were but such a frailty as almost all men are liable to, so that none but a person of extraordinary virtue or diligence could have avoided the mistake, then equity will proportionably make you an abatement or free you from the obligation. So far as you were obliged to understand the matter, so far you are obliged by the contract; especially when another is a loser by your error.

2. An inculpable error about the circumstances or smaller parts will not free you from an obligation in the principal matter: But an inculpable error in the essentials will.

3. Except when the law of the land or the common good, does otherwise overrule the case: For then you may be obliged by that accident. In diverse cases the rulers may judge it necessary, that the effect of the contract shall depend upon the bare words or writings, or actions; lest false pretenses of misunderstanding should exempt deceitful persons from their obligations and nothing should be a security to contractors. And then men’s private commodity must give place to the law and to the public good.

4. Natural infirmities must be numbered with faults, though they be not moral vices, as to the contracting of an obligation, if they be in a person capable of contracting. As if you have some special defect of memory, or ignorance of the matter which you are about! Another who is no way faulty by over-reaching you, must not be a loser by your weakness. For he that comes to the market, or contracts with another who knows not his infirmity, is to be supposed to understand what he does, unless the contrary be manifest: You should not meddle with matters which you understand not: Or if you do, you must be content to be a loser by your weakness.

5. Yet in such cases, another that has gained by the bargain, may be obliged by the laws of equity and charity, to remit the gain, and not to take advantage of your weakness: But he may so far hold you to it, as to secure himself from loss: except in cases where you become the object of his charity, and not of commutative justice only.</p></blockquote>

— Richard Baxter, A Christian Directory, or a Sum of Practical Theology, ... (London, 1673) | pt. 4, ch. 19, title 2, p. 115">Copy</button><a class="share" href="https://x.com/intent/post?text=%E2%80%9C%C2%A78.+Question+3.+Is+a+man+obliged+by+a+contract+which+he+made+in+ignorance+or+mistake+of+the+matter%3F+Answer%3A+I+have+answered+this+before+in+the+case+of+marriage%2C+pt.+2%2C+ch.+1.+I+add+here%2C+we+must+distinguish%3A+1.+Between+culpable+and+inculpable+error%3B+2.+Between+an+error+about+the+principal+matter+and+about+some+smaller+accidents+or+circumstances%3B+3.+Between+a+case+where+the+law+of+the+Land%2C+or+the+common+good+interposes+and+where+it+does+not.+1.+If+it+be+your+own+fault+that+you+are+mistaken%2C+you+are+not+wholly+freed+from+the+obligation%3A+But+if+it+was+your+gross+fault%2C+by+negligence+or+vice%2C+you+are+not+at+all+freed.+But+if+it+were+but+such+a+frailty+as+almost+all+men+are+liable+to%2C+so+that+none+but+a+person+of+extraordinary+virtue+or+diligence+could+have+avoided+the+mistake%2C+then+equity+will+proportionably+make+you+an+abatement+or+free+you+from+the+obligation.+So+far+as+you+were+obliged+to+understand+the+matter%2C+so+far+you+are+obliged+by+the+contract%3B+especially+when+another+is+a+loser+by+your+error.+2.+An+inculpable+error+about+the+circumstances+or+smaller+parts+will+not+free+you+from+an+obligation+in+the+principal+matter%3A+But+an+inculpable+error+in+the+essentials+will.+3.+Except+when+the+law+of+the+land+or+the+common+good%2C+does+otherwise+overrule+the+case%3A+For+then+you+may+be+obliged+by+that+accident.+In+diverse+cases+the+rulers+may+judge+it+necessary%2C+that+the+effect+of+the+contract+shall+depend+upon+the+bare+words+or+writings%2C+or+actions%3B+lest+false+pretenses+of+misunderstanding+should+exempt+deceitful+persons+from+their+obligations+and+nothing+should+be+a+security+to+contractors.+And+then+men%E2%80%99s+private+commodity+must+give+place+to+the+law+and+to+the+public+good.+4.+Natural+infirmities+must+be+numbered+with+faults%2C+though+they+be+not+moral+vices%2C+as+to+the+contracting+of+an+obligation%2C+if+they+be+in+a+person+capable+of+contracting.+As+if+you+have+some+special+defect+of+memory%2C+or+ignorance+of+the+matter+which+you+are+about%21+Another+who+is+no+way+faulty+by+over-reaching+you%2C+must+not+be+a+loser+by+your+weakness.+For+he+that+comes+to+the+market%2C+or+contracts+with+another+who+knows+not+his+infirmity%2C+is+to+be+supposed+to+understand+what+he+does%2C+unless+the+contrary+be+manifest%3A+You+should+not+meddle+with+matters+which+you+understand+not%3A+Or+if+you+do%2C+you+must+be+content+to+be+a+loser+by+your+weakness.+5.+Yet+in+such+cases%2C+another+that+has+gained+by+the+bargain%2C+may+be+obliged+by+the+laws+of+equity+and+charity%2C+to+remit+the+gain%2C+and+not+to+take+advantage+of+your+weakness%3A+But+he+may+so+far+hold+you+to+it%2C+as+to+secure+himself+from+loss%3A+except+in+cases+where+you+become+the+object+of+his+charity%2C+and+not+of+commutative+justice+only.%E2%80%9D%0A%0A%E2%80%94+Richard+Baxter%2C+A+Christian+Directory%2C+or+a+Sum+of+Practical+Theology%2C+...+%28London%2C+1673%29+%7C+pt.+4%2C+ch.+19%2C+title+2%2C+p.+115&amp;url=https%3A%2F%2F5solasquotes.github.io%2Fquote%2F56f985347c.html&amp;via=5Solas" target="_blank" rel="noopener">Share on X</a><a class="perma" href="../quote/56f985347c.html">Permalink</a><a class="src" href="https://reformedbooksonline.com/on-oaths-vows/#:~:text=8.%20Question%203.%20Is%20a%20man,and%20not%20of%20commutative%20justice%20only&amp;text=8.%20Question%203.%20Is%20a%20man%20obliged%20by&amp;text=his%20charity%2C%20and%20not%20of%20commutative%20justice%20only" rel="noopener" target="_blank">Read it online · Reformed Books Online</a></div>

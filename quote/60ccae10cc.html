<main class="wrap"><figure class="quote" id="q-60ccae10cc" data-kw="">
<blockquote><p>It may be remarked that the law of the ten commandments was promulgated to Israel from Sinai in the form of a covenant of works. Not that it was the design of God to renew a covenant of works with Israel or to put them upon seeking life by their own obedience to the law but the law was published to them as a covenant of works to show them that without a perfect righteousness answering to all the demands of the law they could not be justified before God and that finding themselves wholly destitute of that righteousness they might be excited to take hold of the covenant of grace in which a perfect righteousness for their justification is graciously provided. The Sinai transaction was a mixed dispensation. In it the covenant of grace was published as appears from these words in the preface standing before the commandments “I am the Lord thy God which have brought thee out of the land of Egypt out of the house of bondage” and from the promulgation of the ceremonial law at the sametime But the moral law as a covenant of works was also displayed to convince the Israelites of their sinfulness and misery to teach them the necessity of an atonement and lead them to embrace by faith the blessed Mediator the Seed promised to Abraham in whom all the families of the earth were to be blessed. The law therefore was published at Sinai as a covenant of works in subservience to the covenant of grace And the law is still published in subservience to the gospel as a schoolmaster to bring sinners to Christ that they may be justified by faith Gal iii 24.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/robert-shaw.html">Robert Shaw</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Reformed Faith: An Exposition of the Westminster Confession of Faith</cite>, (1845) on WCF chapter 19</span></figcaption>

</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-7b11c3aef5" data-kw="">
<blockquote><p>There then is the first use of the preaching of the law; to make known our innumerable faults so that in ourselves we begin to be miserable and greatly humble ourselves; in short, to beget in us the first degree of repentance which is called “contrition of heart”; this produces a full and open confession toward the Lord.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/theodore-beza.html">Theodore Beza</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Christian Faith</cite>, (1558), trans., James Clark (East Sussex: Christian focus Ministries Trust, 1992), 44.</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/the-law-of-god.html">The Law of God</a></span></div>

</figure><figure class="quote" id="q-ac44ef0045" data-kw="judicial ends theocracy">
<blockquote><p>The forensic or judicial law concerned the civil government of the people of God under the Old Testament and contained a body of precepts concerning the form of that political rule. There were various ends of it. (1) The good order and legitimate constitution of the Jewish polity, which should be a true theocracy, as Josephus calls it. (2) The distinguishing of that state and nation from all other people and states and that that polity might be the seat of the church and the place for the manifestation of God. (3) The vindication of the moral and ceremonial law from contempt. (4) The adumbration of the spiritual kingdom of Christ.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/francis-turretin.html">Francis Turretin</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Institutes of Elenctic Theology</cite>, 11.26.1</span></figcaption>

</figure><figure class="quote" id="q-c2ea72c458" data-kw="">
<blockquote><p>When we pursue worldly wealth or worldly reputation with more vehemence than the riches of grace or the favor of God; when we have a foolish imagination that our happiness consists in them, we prefer earth before heaven, broken cisterns that can hold no water before an ever-springing fountain of glory and bliss, and, as though there were a defect in God, cannot be content with him as our portion without an addition of something inferior to him; when we make it our hopes to say to the wedge, “You are my confidence,” and rejoice more because it is great and because our hand has gotten much than in the privilege of communion with God and the promise of an everlasting fruition of him (Job 31:24–25)—this is so gross that Job joins it with the idolatry of the sun and moon.… And the apostle, when he mentions covetousness or covetous men, passes it not over without the title of idolatry to the vice and idolater to the person (Col. 3:5), in that it is a preferring of clay and dirt as an end more desirable than the original of all goodness, in regard of affection and dependence.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/stephen-charnock.html">Stephen Charnock</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Existence and Attributes of God</cite>, Discourse 2, On Practical Atheism (covetousness as idolatry)</span></figcaption>

</figure><figure class="quote" id="q-9bcc86ec04" data-kw="condemnation wrath conscience">
<blockquote><p>(c) For condemnation, when it denounces upon the convicted sinner the divine malediction by the dreadful sentence which it thunders in his ears: “Cursed is he who continues not.” Hence the apostle calls it “the ministration of condemnation” (2 Cor. 3:9), and he says that “it worketh wrath” (Rom. 4:15) and then it is like a whip, tormenting and scourging the conscience guilty of sin.</p></blockquote>

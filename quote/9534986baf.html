<main class="wrap"><figure class="quote" id="q-9534986baf" data-kw="">
<blockquote><p>For nature itself presupposes the following: (1) There is a God, or some first being, by whom all things exist, who is the ultimate end to whom all things aim, and who consequently is above all things.

(2) He must be worshipped, or, what is the same thing, life must be lived for him. For if we have all things from him, and we have them so that we may give them back to him, and if likewise he is over all things and more perfect than all things, certainly it is evidently that all these truths must be acknowledged with due reverence, and in doing so the worship of God is performed.

(3) This worship of God is not a work of nature, such as seeing, hearing, and walking, which accordingly do not require a rule to direct them. Rather, the worship of God is a certain art that must be directed by certain rules.

(4) The rule is not reason, because it is corrupted, as anyone who is rich in reason acknowledges, and something that is corrupt cannot be the measure of right. Neither is the rule the statutes of the wise, for they depend upon reason alone (which we have already excluded from this axiom), and from it they borrow their authority.

Neither is it the sayings of the church fathers, for all of them were men just as we are and, to that extent, not only were they bound to a certain rule in the same way that we are, but they were also fallible and, what is more, often wrong. So they cannot compose any rule except a pliable one, which is not one at all, since the rule ought to be infallible.

Neither is the rule the Jewish Talmud, since, due to the unwritten tradition through which it has been handed down from Moses to the Jews, not only is its truth uncertain, but also, on account of the fables with which it overflows, its falsity is certain. Neither is it the Qur’an of the Muslims, since it too readily reveals its own ineptitude by its superstitious and scurrilous nonsense. So then, there is no rule that remains standing except our Holy Scriptures, and thus we declare it to be our axiom.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/petrus-van-mastricht.html">Petrus van Mastricht</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Theoretical-Practical Theology Volume 1: Prolegomena</cite>, trans. Todd M. Rester, ed. Joel R. Beeke (1699; Grand Rapids MI: Reformation Heritage Books, 2018), 1.1.2, IV, pp 117-18.</span></figcaption>

<blockquote><p>In the third place he comes on to the chief Organ, that is, the in­strument wherewith they should sing. It is not with the Or­gans of the Papists, no not with thy tongue; but it is with the heart, and with the affection of a well ruled heart. Therefore as a fiddler, or any that plays on an Instrument tempers his Simile. Instrument, that a sweet harmony may be heard of it: Even so before thou sing, temper thou thy heart; and let thy song rise, not from thy throat, but from the depth of thine heart, that is, from thine affections set upon God.</p></blockquote>

<blockquote><p>As for the veils wherewith the apostle would have women covered whileas they were praying (that is in their hearts following the public and common prayer) or prophesying (that is singing, 1 Sam. 10:10; 1 Chron. 25:1) they are worthy to be covered with shame as with a garment, who allege this example for sacred significant ceremonies of human institution. This covering was a moral sign, for that comely and orderly distinction of men and women which civil decency required in all their meetings: wherefore, that distinction of habits [garments], which they used for decency and comliness in their common behavior and conversation, the apostle will have them, for the same decency and comeliness still to retain in their holy assemblies. And further the apostle shows, that it is also a natural sign, and that nature itself teaches it: therefore he urges it both by the inferiority or subjection of the woman vv. 3. 8-9 (For covering was then a sign of subjection) and by the long hair which nature gives to a woman v. 15. Where he would have the artificial covering, to be fashioned in imitation of the natural. What need we anymore? Let us see nature’s institution, or the apostles’ recommendation for the controverted ceremonies (as we have seen them for women’s veils) and we yield the argument. Last of all, the sign of imposition of hands, helps not the cause of our Opposites, because it the example of Christ, and the apostles, and their disciples, which our ceremonies have not: yet we think not imposition of hands to be any sacred or mystical sign, but only a moral, for designation of a person: let them who think more highly or honorably of it, look to their warrants.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/george-gillespie.html">George Gillespie</a></span><span class="wk"><span class="lbl">Work:</span> <cite>English Popish Ceremonies</cite>, 3, ch. 5, pp. 90-91</span></figcaption>

<blockquote><p>Objection: 1. But Christ says, “Swear not at all;” and James says, “Nor by any other oath…”. Therefore Christians are not allowed to swear [oaths] under any form. Answer: There is here a fallacy of composition; for when Christ says, swear not at all, we are not to refer this language to the oath itself, but to the various forms of rash [oath] swearing which the Pharisees imagined lawful. It is, therefore, as if he would say, “Swear not falsely or rashly at all, whether it be in a direct or indirect way.” So when the Apostle James says, “Nor by any other oath,” we must understand him also as referring to such oaths as are rash and false, of which kind he furnishes some specimens, and forbids all of a similar character. If this be not the proper interpretation of these passages, Christ himself has violated his own precept which he here lays down, saying, “Let your communication be yes, yes or no, no;” for he frequently in his discourses used this most emphatic form of expression, “Truly, truly I say to you.” And James would in this case condemn Paul, who called God for a record upon his soul. And the Holy Spirit would contradict himself by condemning all oaths by James, and commending them by another Apostle as a remedy useful and necessary to the preservation of society, for the purpose of putting an end to strife and controversies, from which human life, in this state of frailty and imperfection, cannot be free. Objection 2: But such oaths as were permitted, together with the examples which are found in the Scriptures, have respect to public oaths—such as were exacted or given in the name of the public and for the public good. Therefore at least private oaths, or such as pass between private individuals, are entirely prohibited. Answer. 1: We deny the antecedent; because there is not only no such restriction as that which is here maintained, specified in the instances recorded in the Scriptures, where the saints make oath to God, but it is impossible to interpret them in this way, as a careful examination of the passages themselves will prove. 2: There are many oaths recorded in the Scriptures, the private character of which cannot be doubted, such as that of Jacob and Laban, that of Boaz, Abdiah, Abigail, and David. (Gen. 31:53. Ruth 3:13. etc.) 3. The same thing may be proven from the design of the oath, which is a confirmation of fidelity and truth among men, and the putting an end to strife. These things now have respect to Christians also as private individuals; and hence the oath itself by which we establish truth and fidelity, likewise has respect to them.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/zacharias-ursinus.html">Zacharias Ursinus</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Body of Orthodox Doctrine of the Explication of the Catechism, on Q. 7</cite></span></figcaption>

ublic+good.+Therefore+at+least+private+oaths%2C+or+such+as+pass+between+private+individuals%2C+are+entirely+prohibited.+Answer.+1%3A+We+deny+the+antecedent%3B+because+there+is+not+only+no+such+restriction+as+that+which+is+here+maintained%2C+specified+in+the+instances+recorded+in+the+Scriptures%2C+where+the+saints+make+oath+to+God%2C+but+it+is+impossible+to+interpret+them+in+this+way%2C+as+a+careful+examination+of+the+passages+themselves+will+prove.+2%3A+There+are+many+oaths+recorded+in+the+Scriptures%2C+the+private+character+of+which+cannot+be+doubted%2C+such+as+that+of+Jacob+and+Laban%2C+that+of+Boaz%2C+Abdiah%2C+Abigail%2C+and+David.+%28Gen.+31%3A53.+Ruth+3%3A13.+etc.%29+3.+The+same+thing+may+be+proven+from+the+design+of+the+oath%2C+which+is+a+confirmation+of+fidelity+and+truth+among+men%2C+and+the+putting+an+end+to+strife.+These+things+now+have+respect+to+Christians+also+as+private+individuals%3B+and+hence+the+oath+itself+by+which+we+establish+truth+and+fidelity%2C+likewise+has+respect+to+them.%E2%80%9D%0A%0A%E2%80%94+Zacharias+Ursinus%2C+Body+of+Orthodox+Doctrine+of+the+Explication+of+the+Catechism%2C+on+Q.+7&amp;url=https%3A%2F%2F5solasquotes.github.io%2Fquote%2F9b96dfa318.html&amp;via=5Solas" target="_blank" rel="noopener">Share on X</a><a class="perma" href="../quote/9b96dfa318.html">Permalink</a><a class="src" href="https://heidelblog.net/2016/01/ursinus-contra-the-anabaptists-on-oaths/" rel="noopener" target="_blank">Read it online · Heidelblog</a></div>

<blockquote><p>Those virtues which more immediately respect God, appeared in Christ in the work that he did for our redemption. There appeared in him an holy fear and reverence towards God the Father. Christ had a greater trial of his virtue in this respect than any other had, from the honourableness of his person. This was the temptation of the angels that fell, to cast off their worship of God, and reverence of his majesty, that they were beings of such exalted dignity and worthiness themselves.

But Christ was infinitely more worthy and honourable than they; for he was the eternal Son of God, and his person was equal to the person of God the Father: and yet, as he had taken on him the office of mediator, and the nature of man, he was full of reverence towards God. He adored him in the most reverential manner time after time. So he manifested a wonderful love towards God.

The angels give great testimonies of their love towards God, in their constancy and agility in doing the will of God; and many saints have given great testimonies of their love, who, from love to God, have endured great labours and sufferings, but none ever gave such testimonies of love to God as Christ has given; none ever performed such a labour of love as he, and suffered so much from love to God. So he manifested the most wonderful submission to the will of God. Never was any one’s submission so tried as his was. So he manifested the most wonderful spirit of obedience that ever was manifested.</p></blockquote>

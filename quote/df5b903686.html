<main class="wrap"><figure class="quote" id="q-df5b903686" data-kw="">
<blockquote><p>But as much as many being called by the Gospel do not repent nor believe in Christ, but perish in their infidelity, this comes not to pass for want of, or by any insufficiency of the sacrifice of Christ offered upon the Cross, but by their own default.</p></blockquote>

</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-fdbda0e0cc" data-kw="">
<blockquote><p>2. To die for all, and to be given for all, must in some places [in Scripture, such as 1 Tim. 2:4-6; 4:10; Heb. 2:9; 2 Cor. 5:14-15; Tit. 2:11] respect the sufficiency of the dignity in the death of Christ, but not always the efficacy of his death in the virtual extent of it, which none that I have read will maintain in this point of Christ’s dying for all.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/obadiah-sedgwick.html">Obadiah Sedgwick</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Bowels of Tender Mercy Sealed in the Everlasting Covenant... (London: Motershed, 1661), pt. 1, ch. 7, The Covenant of Grace considered in Relation to Christ the Mediator, sect. 8, Whether Jesus Christ as Mediator died for all and every man?</cite>, p. 304</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/priestly-office-satisfaction-and-atonement/extent-of-the-atonement.html">Extent of the Atonement</a></span></div>

</figure><figure class="quote" id="q-39e34c7d9b" data-kw="">
<blockquote><p>This notion, as if the justification, righteousness, and life spoken of in Rom. v. implied the resurrection of damnation, is not only without ground from Scripture, but contrary to reason. For those are there spoken of as great benefits, by the grace and free gift of God: but this is the contrary, in the highest degree possible; the most consummate calamity. To obviate this, our author supposes the resurrection of all to be a great benefit in itself, though turned into a calamity by the sin and folly of obstinate sinners, who abuse God&#x27;s goodness. But the far greater part of mankind, since Adam, have never had opportunity to abuse this goodness, it having never been made known to them. Men cannot abuse a kindness, which they never had either in possession, promise, offer, or some intimation: but a resurrection is made known only by divine revelation which few comparatively have enjoyed. So that as to such wicked men as die in lands of darkness, if their resurrection comes at all by Christ, it comes from him, and to them, only is a curse, and not a blessing; for it never comes to them at all by any conveyance, grant, promise, or offer, or any thing by which they can claim it, or know any thing of it, till it comes as an infinite calamity, past all remedy.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/jonathan-edwards.html">Jonathan Edwards</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Great Christian Doctrine of Original Sin Defended</cite>, pt. 2, ch. 4, sec. 1 (on Rom. 5:12–21)</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/resurrection/resurrection-of-the-body.html">Resurrection of the Body</a> › <a href="../topics/resurrection/resurrection-of-the-body/resurrection-of-the-just-and-unjust.html">Resurrection of the just and unjust</a></span><span class="t"><a href="../topics/priestly-office-satisfaction-and-atonement/extent-of-the-atonement.html">Extent of the Atonement</a> › <a href="../topics/priestly-office-satisfaction-and-atonement/extent-of-the-atonement/particular-redemption.html">Particular redemption</a></span></div>

0A%E2%80%94%20Jonathan%20Edwards%2C%20The%20Great%20Christian%20Doctrine%20of%20Original%20Sin%20Defended%2C%20pt.%202%2C%20ch.%204%2C%20sec.%201%20%28on%20Rom.%205%3A12%E2%80%9321%29&amp;url=https%3A%2F%2F5solasquotes.github.io%2Fquote%2F39e34c7d9b.html&amp;via=5Solas" target="_blank" rel="noopener">Share on X</a><a class="perma" href="../quote/39e34c7d9b.html">Permalink</a><a class="src" href="https://ccel.org/ccel/edwards/works1" rel="noopener" target="_blank">Read it online · CCEL, Works vol. 1</a></div>
</figure><figure class="quote" id="q-2a4490c1ea" data-kw="">
<blockquote><p>It follows from this view that, as the atonement of Christ was, in itself, sufficient, had God so pleased, to ground the salvation of all men, it is sufficient to ground the universal offer of salvation. Men are invited to stand on a platform which is broad enough to hold them all, to rest upon a foundation which is strong enough to support them all, to partake of provisions which are abundant enough to supply them all. When, therefore, God invites all men to seek salvation in Christ, He is not insincere in offering them a platform too narrow to hold them, a foundation too weak to sustain them, provisions too meagre to supply them. Were they all to accept the invitation, they would all be saved. So much for the intrinsic sufficiency of the remedy for human sin and misery. So far the Calvinist is not chargeable with representing God as insincere in the matter of the gospel offer. It will be urged, however, that notwithstanding his admission of the absence of limitation, as to the intrinsic sufficiency of the atonement, the difficulty remains in view of his doctrine that there is limitation, as to its extrinsic design and application. It was not rendered for all, it is not intended to be effectually applied to all…</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/john-l-girardeau.html">John L. Girardeau</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Calvinism &amp; Evangelical Arminianism, pt. 1, Section 3, Objections [to Election and Reprobation] from the Moral Attributes of God Answered; 4. Objection from Divine Veracity</cite>, pp. 359-93</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/priestly-office-satisfaction-and-atonement/extent-of-the-atonement.html">Extent of the Atonement</a></span></div>

<main class="wrap"><figure class="quote" id="q-dccece3332" data-kw="">
<blockquote><p>Moreover, in the blessed after the Resurrection of the Body there shall also be a Vision of the Son of God Incarnate, in His human nature assumed and now for some time glorified, with the eyes of their bodies; concerning whom John speaks the words in 1 John 3:2, and whom already formerly Holy Job was awaiting, Job 19:26, 27. With respect to the present life Job had entirely cast away all hope of restoration; compare Job 6:11; 7:5, 7, 8, 15, 16; 16:16; 17:1, 14, 15; 19:10. But after death he was certain that he was going to see God, at the time when after his skin they had some time ago pierced this very thing, and his Redeemer in the end would stand upon the earth.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/bernard-de-moor.html">Bernardinus de Moor</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Continuous Commentary on Johannes Marckius’ Didactico-Elenctic Compendium of Christian Theology. Volume 1: Concerning the Word and Definition of Theology</cite>, trans. Steven Dilday (1761; Central SC: From Reformation to Reformation Translations, 2017), Ch. 1, § 9, p. 96.</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/judgment-and-the-final-state.html">Judgment and the Final State</a></span></div>

</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-496b81c5fc" data-kw="">
<blockquote><p>Uniquely among the thirteenth-century Scholastic theologians, Henry of Ghent (c.1217–1293) gives an account of beatific union with God according to which it consists not simply in God’s being the object of a creature’s acts of cognition and/or volition, but in God’s fully interpenetrating the creature in such a way that the creature becomes in some sense identical with God. This article places Henry’s view in its immediate theological context, and outlines the two most important immediate reactions to it – including its influence, hitherto unnoticed, on Meister Eckhart’s account of mystical union. In so doing, it highlights a continuity between Scholastic and non-Scholastic theology in the Middle Ages.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/richard-cross.html">Richard Cross</a></span><span class="wk"><span class="lbl">Work:</span> <cite>‘Scholastic Debates on Beatific Union with God</cite>, (c.1217-1293) &amp; his Interlocutors’ in Traditio</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/judgment-and-the-final-state/heaven-and-eternal-glory.html">Heaven and Eternal Glory</a></span></div>

</figure><figure class="quote" id="q-c9829607ae" data-kw="">
<blockquote><p>How much of spiritual meaning and significance is revealed to the eye of faith, in that great truth “He inhabiteth eternity.” From eternity did God exist, and infinitely happy in his own glory. His being is underived, and never had a beginning; before angel and arch-angel were called into being to celebrate his praises, did our God exist in his own uncreated glory. The blessed spirits of heaven, who, as they receive their existence from the “high and lofty One,” derive also their happiness from the infinite happiness which resides in his perfections, and delight to magnify his glory, and to do his will. Their fervid praises ascend to him, who has given them all their powers of serving him, and their capacities of enjoying him. In the immediate dwelling place of God are the souls of the redeemed, who “have passed beyond tribulation, and who, clothed with white robes and palms in their hands,” cry with a loud voice, saying, “Salvation to our God which sitteth upon the throne, and unto the Lamb.”

Infinite happiness is in the immediate dwelling-place of him who inhabits eternity; unutterable glory is also around the God of our salvation. The Word of God elevates our faith, and calls upon us to entertain devout and adoring views of the glory of him, who is holy in his nature, and holy and righteous in all his ways. Yet, though thus glorious and exalted, though infinite in his own happiness, though inconceivably pure and holy in his essence, though requiring no services of any created beings that rejoices in the excellence of his will, to add to his internal and infinite happiness and complacency, yet, amazing truth of God’s own grace and condescension, he delights to come forth from the glory which he inhabits in eternity, and to dwell with them, who in the depths of humility and self-abasement, feel their own guilt and unworthiness in his holy and omniscient view, and in faith and love acknowledge him as their God in Christ.

What a precious revelation does the Prophet give of the grace of God! What a consolatory representation of his unsearchable condescension! While God dwells in the heavens, and praises of eternity — while he dwells in the “high and holy place” — a heavenly temple—the grandeur, the purity, the glory of which befit the blessed perfections of his nature — yet he dwells also with him who is of a contrite and humble spirit — God dwells with such for a blessed and gracious purpose — “to revive the spirit of the humble, and to revive the heart of the contrite ones.” In his wisdom and grace, he has devised a glorious plan of salvation, through which he can hold communion with those in whom these spiritual qualities reside.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/mungo-fairlie-parker.html">Mungo Fairlie Parker</a></span><span class="wk"><span class="lbl">Work:</span> <cite>God s Dwelling with the Humble and Contrite, the Source of their Revival’ in The Free Church Pulpit; Consisting of Discourses by the Most Eminent divines of the Free Church of Scotland. Vol. I.</cite></span></figcaption>
<div class="meta"><span class="t"><a href="../topics/judgment-and-the-final-state/heaven-and-eternal-glory.html">Heaven and Eternal Glory</a></span></div>

</figure><figure class="quote" id="q-56ef4b4cff" data-kw="">
<blockquote><p>Next we must consider the general organization of Israel that originated in this berith. This is usually designated as ‘theocracy’. This name for it is not found in the Scriptures, although it admirably describes what the Biblical account represents Israel’s constitution to have been. Probably the term was coined by Josephus. He observes in regard to the governments of other nations, that some of these were monarchies, others oligarchies, still others democracies; what God set up among Israel was a theocracy. Obviously Josephus finds in this something distinctive and unique. This is correct as far as the great systems of civilization of that day were concerned. But it is not quite correct, if Israel be compared with other Shemitic tribes. The theocratic principle, i.e., the principle of the deity being the supreme authority and power in national life, seems to have been not uncommon among the Shemites. We may infer as much from the observation that Melekh, ‘King’, is a frequent Shemitic name for the deity. But while under ordinary circumstances this was a mere belief, it proved among Israel an undoubted reality. The laws under which Israel lived not merely had the divine sanction behind them in the general sense in which all law and order ultimately derives from God through general revelation by way of the conscience, but in the specific sense, that Jehovah had directly revealed the law. In other words Jehovah in person performed the task usually falling to a human king. And in the sequel also, Jehovah by supernatural interposition, when necessary, continued to act the role of King of the nation. This fact was so deeply embedded in the consciousness of the leaders of Israel that still in the time of Gideon and Samuel it was felt to forbid the setting up of a purely human kingdom. The union of the religious lordship and the national kingship in the one Person of Jehovah involved that among Israel civil and religious life were inextricably interwoven. If the union had happened to exist in any other person but God, a division of the two spheres of relationship might have been conceivable. The bond to God is so one and indivisible that no separation of the one from the other can be conceived. Hence the later prophetic condemnation of politics, not merely wicked politics, but politics per se, as derogatory to the royal prerogative of Jehovah. Further it ought to be noticed that between these two concentric spheres the religious one has the pre-eminence. It is that for the sake of which the other exists. For our system of political government such an interrelation would, of course, seen a serious, intolerable defect. Not so among Israel. The chief end for which Israel had been created was not to teach the world lessons in political economy, but in the midst of a world of paganism to teach true religion, even at the sacrifice of much secular propaganda and advantage. Nor was it merely a question of teaching religion for the present world. A missionary institution theocracy never was intended to be in its Old Testament state. The significance of the unique organization of Israel can be rightly measured only by remembering that theocracy typified nothing short of the perfected kingdom of God, the consummate state of Heaven. In this ideal state there will be no longer any place for the distinction between church and state. The former will have absorbed the latter. In a rough way the principle involved was already apprehended by Josephus. In the passage introducing the word ‘theocracy’ he observes that Moses, by giving such a constitution to the Israelites, did not make religion a part of virtue, but made all other virtues to be a part of religion. The fusion between the two spheres of secular and religious life is strikingly expressed by the divine promise that Israel will be made ‘a kingdom of priests and an holy nation’ [Ex. 19:6]. As priests they are in, nay, constitute the kingdom.</p></blockquote>

us life were inextricably interwoven. If the union had happened to exist in any other person but God, a division of the two spheres of relationship might have been conceivable. The bond to God is so one and indivisible that no separation of the one from the other can be conceived. Hence the later prophetic condemnation of politics, not merely wicked politics, but politics per se, as derogatory to the royal prerogative of Jehovah. Further it ought to be noticed that between these two concentric spheres the religious one has the pre-eminence. It is that for the sake of which the other exists. For our system of political government such an interrelation would, of course, seen a serious, intolerable defect. Not so among Israel. The chief end for which Israel had been created was not to teach the world lessons in political economy, but in the midst of a world of paganism to teach true religion, even at the sacrifice of much secular propaganda and advantage. Nor was it merely a question of teaching religion for the present world. A missionary institution theocracy never was intended to be in its Old Testament state. The significance of the unique organization of Israel can be rightly measured only by remembering that theocracy typified nothing short of the perfected kingdom of God, the consummate state of Heaven. In this ideal state there will be no longer any place for the distinction between church and state. The former will have absorbed the latter. In a rough way the principle involved was already apprehended by Josephus. In the passage introducing the word ‘theocracy’ he observes that Moses, by giving such a constitution to the Israelites, did not make religion a part of virtue, but made all other virtues to be a part of religion. The fusion between the two spheres of secular and religious life is strikingly expressed by the divine promise that Israel will be made ‘a kingdom of priests and an holy nation’ [Ex. 19:6]. As priests they are in, nay, constitute the kingdom.”

— Geerhardus Vos, Biblical Theology: Old and New Testaments, (Eugene, OR: Wipf &amp; Stock Publishers, 2003), 124–26.">Copy</button><a class="share" href="https://x.com/intent/post?text=%E2%80%9CNext+we+must+consider+the+general+organization+of+Israel+that+originated+in+this+berith.+This+is+usually+designated+as+%E2%80%98theocracy%E2%80%99.+This+name+for+it+is+not+found+in+the+Scriptures%2C+although+it+admirably+describes+what+the+Biblical+account+represents+Israel%E2%80%99s+constitution+to+have+been.+Probably+the+term+was+coined+by+Josephus.+He+observes+in+regard+to+the+governments+of+other+nations%2C+that+some+of+these+were+monarchies%2C+others+oligarchies%2C+still+others+democracies%3B+what+God+set+up+among+Israel+was+a+theocracy.+Obviously+Josephus+finds+in+this+something+distinctive+and+unique.+This+is+correct+as+far+as+the+great+systems+of+civilization+of+that+day+were+concerned.+But+it+is+not+quite+correct%2C+if+Israel+be+compared+with+other+Shemitic+tribes.+The+theocratic+principle%2C+i.e.%2C+the+principle+of+the+deity+being+the+supreme+authority+and+power+in+national+life%2C+seems+to+have+been+not+uncommon+among+the+Shemites.+We+may+infer+as+much+from+the+observation+that+Melekh%2C+%E2%80%98King%E2%80%99%2C+is+a+frequent+Shemitic+name+for+the+deity.+But+while+under+ordinary+circumstances+this+was+a+mere+belief%2C+it+proved+among+Israel+an+undoubted+reality.+The+laws+under+which+Israel+lived+not+merely+had+the+divine+sanction+behind+them+in+the+general+sense+in+which+all+law+and+order+ultimately+derives+from+God+through+general+revelation+by+way+of+the+conscience%2C+but+in+the+specific+sense%2C+that+Jehovah+had+directly+revealed+the+law.+In+other+words+Jehovah+in+person+performed+the+task+usually+falling+to+a+human+king.+And+in+the+sequel+also%2C+Jehovah+by+supernatural+interposition%2C+when+necessary%2C+continued+to+act+the+role+of+King+of+the+nation.+This+fact+was+so+deeply+embedded+in+the+consciousness+of+the+leaders+of+Israel+that+still+in+the+time+of+Gideon+and+Samuel+it+was+felt+to+forbid+the+setting+up+of+a+purely+human+kingdom.+The+union+of+the+religious+lordship+and+the+national+kingship+in+the+one+Person+of+Jehovah+involved+that+among+Israel+civil+and+religious+life+were+inextricably+interwoven.+If+the+union+had+happened+to+exist+in+any+other+person+but+God%2C+a+division+of+the+two+spheres+of+relationship+might+have+been+conceivable.+The+bond+to+God+is+so+one+and+indivisible+that+no+separation+of+the+one+from+the+other+can+be+conceived.+Hence+the+later+prophetic+condemnation+of+politics%2C+not+merely+wicked+politics%2C+but+politics+per+se%2C+as+derogatory+to+the+royal+prerogative+of+Jehovah.+Further+it+ought+to+be+noticed+that+between+these+two+concentric+spheres+the+religious+one+has+the+pre-eminence.+It+is+that+for+the+sake+of+which+the+other+exists.+For+our+system+of+political+government+such+an+interrelation+would%2C+of+course%2C+seen+a+serious%2C+intolerable+defect.+Not+so+among+Israel.+The+chief+end+for+which+Israel+had+been+created+was+not+to+teach+the+world+lessons+in+political+economy%2C+but+in+the+midst+of+a+world+of+paganism+to+teach+true+religion%2C+even+at+the+sacrifice+of+much+secular+propaganda+and+advantage.+Nor+was+it+merely+a+question+of+teaching+religion+for+the+present+world.+A+missionary+institution+theocracy+never+was+intended+to+be+in+its+Old+Testament+state.+The+significance+of+the+unique+organization+of+Israel+can+be+rightly+measured+only+by+remembering+that+theocracy+typified+nothing+short+of+the+perfected+kingdom+of+God%2C+the+consummate+state+of+Heaven.+In+this+ideal+state+there+will+be+no+longer+any+place+for+the+distinction+between+church+and+state.+The+former+will+have+absorbed+the+latter.+In+a+rough+way+the+principle+involved+was+already+apprehended+by+Josephus.+In+the+passage+introducing+the+word+%E2%80%98theocracy%E2%80%99+he+observes+that+Moses%2C+by+giving+such+a+constitution+to+the+Israelites%2C+did+not+make+religion+a+part+of+virtue%2C+but+made+all+other+virtues+to+be+a+part+of+religion.+The+fusion+between+the+two+spheres+of+secular+and+religious+life+is+strikingly+expressed+by+the+divine+promise+that+Israel+will+be+made+%E2%80%98a+kingdom+of+priests+and+an+holy+nation%E2%80%99+%5BEx.+19%3A6%5D.+As+priests+they+are+in%2C+nay%2C+constitute+the+kingdom.%E2%80%9D%0A%0A%E2%80%94+Geerhardus+Vos%2C+Biblical+Theology%3A+Old+and+New+Testaments%2C+%28Eugene%2C+OR%3A+Wipf+%26+Stock+Publishers%2C+2003%29%2C+124%E2%80%9326.&amp;url=https%3A%2F%2F5solasquotes.github.io%2Fquote%2F56ef4b4cff.html&amp;via=5Solas" target="_blank" rel="noopener">Share on X</a><a class="perma" href="../quote/56ef4b4cff.html">Permalink</a><a class="src" href="https://heidelblog.net/2025/08/vos-the-israelite-theocracy-was-a-type-and-shadow-of-heaven/" rel="noopener" target="_blank">Read it online · Heidelblog</a></div>

<blockquote><p>38. Can we say very much about heaven and the blessings of heaven? No, for this far surpasses our understanding. We know only: … b) The enjoyment of heaven is in the first place the enjoyment of God, the visio Dei, a ‘beholding of God.’ This is not to be understood one-sidedly in an intellectualistic manner but in all its magnitude. The nearness of God will affect every capacity of man, and every capacity will react to it. Theologians usually speak of visio [seeing], amor [love], gaudium [joy], gloria [glory]; others of knowing, serving, enjoying and glorifying God (cf. 1 Cor. 13:9-13). It has been asked whether this will be a seeing with physical eyes. This is not to be assumed. God is not visible to the senses. The Mediator certainly is. No one has ever seen God. This seeing follows on faith. It is thus something that is comparable with faith but that still does not necessarily need to be a perceiving with the senses. There will thus be a perception of God, yet such that it is not a material entity that appears to us. c) The enjoyment of heaven in fellowship with God is eternal life in all its fullness.</p></blockquote>

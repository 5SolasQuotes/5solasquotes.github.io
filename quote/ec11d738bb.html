<main class="wrap"><figure class="quote" id="q-ec11d738bb" data-kw="">
<blockquote><p>Hence infer, that there are no regular teachers, but those on whom God has conferred the office; and that it is not enough to have the word of God, if there be not likewise a special calling.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/john-calvin.html">John Calvin</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Commentary on Luke</cite>, 3, verse 2</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/church-government-and-the-ministry/the-call-to-ministry.html">The Call to Ministry</a></span></div>

</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-38d4725347" data-kw="">
<blockquote><p>Thirdly, while you are preaching that opinion which your zeal is so much for, you are omitting far greater and more necessary truths. Fourthly, mercy is to be preferred before sacrifice: What if the present uttering some truth would cost many thousand men’s lives? Were not that an untimely and unmerciful word? And is it not as bad if (but accidentally) it tend to the ruin of the Church and the hurt of souls? It were easy to instance in unseasonable and imprudent words of truth spoken to princes, which have raised persecutions of long continuance and ruined Churches, silenced ministers and caused the death of multitudes of men. … It is not truth but goodness which is the ultimate object of the soul. And God who is infinite goodness itself, has revealed his truths to the world to do men good, and not to hurt them. And the Devil, who is the Destroyer, so he may but do men hurt, will be content to make use even of truth to do it; though usually he only pretends truth to cover his lies: And this angel of Light has his ministers of light and righteousness, who are known by their fruits; whilst the pretenses of light and righteousness are used to Satan’s ends and not to Christ’s, to hurt and destroy and to hinder Christ’s Kingdom, and not to save and to do good: as the wolf is known by his bloody jaws, even in his sheep’s clothing.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/richard-baxter.html">Richard Baxter</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Other citations (work not named)</cite>, Direction 38, ‘Neglect not any truth of God, much less renounce it or deny it: for lying and contempt of sacred truth is always sinful: But yet do not take it for your duty to publish all which you judge to be truth, nor a sin to silence many lesser truths, when the Church’s peace and welfare does require it’ in The Cure of Church Divisions, Direction 38, ‘Neglect not any truth of God, much less renounce it or deny it: for lying and contempt of sacred truth is always sinful: But yet do not take it for your duty to publish all which you judge to be truth, nor a sin to silence many lesser truths, when the Church’s peace and welfare does require it’ in The Cure of Church Divisions… (London, 1670), pt. 1, pp. 208-9</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/church-government-and-the-ministry/the-call-to-ministry.html">The Call to Ministry</a></span></div>

</figure><figure class="quote" id="q-07f8ba90e2" data-kw="">
<blockquote><p>XII. As an instrument, He uses his word (Rom. 10:16), and that of both the Law and the Gospel, in different ways: by the former, indeed, preparing the way for the efficacy of vocation (Gal. 3:24), and by the latter, perfecting the same in the called (Rom. 1:16).

XIII. This is also sometimes extraordinary, and God acts beyond the accustomed manner, so that what He is accustomed to effect together with the Word, He produces without its help or assistance, administering the matter by the revelation and efficacy of his Spirit alone (Acts 9:3-6).</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/anthony-walaeus.html">Antonius Walaeus</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Theological Theses on the Efficacious Vocation of the Sinner to Salvation</cite>, trans. AI (Leiden: Marcus, 1620), p. 3</span></figcaption>

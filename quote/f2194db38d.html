<blockquote><p>XIII. The matter from which, of the first creation, there was none, but the omnipotent Creator produced all things from nothing, either negative, which signifies a pure negation and absence of pre-existing matter; or privative, which denotes a privation or indisposition, and therefore matter indeed, but indisposed, unsuitable, and by its nature inept for the production of the term, in which only an obediential potentiality, or non-repugnance in order to the first cause, acting with infinite power, is given. And the first, or immediate, creation [Gen. 1:1] was from negative nothing; but the second, or mediate, creation of the following days [from that which was without form and void, Gen. 1:2] was from privative nothing.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/barthold-holtzfus.html">Barthold Holtzfus</a></span><span class="wk"><span class="lbl">Work:</span> <cite>‘Theological Dissertation on Creation’ (Frankfurt: Steppinus, 1706), trans. AI Latin</cite></span></figcaption>
<div class="meta"><span class="t"><a href="../topics/free-will-and-inability/liberty-and-necessity.html">Liberty and Necessity</a></span></div>

<blockquote><p>…for as the love of Christ, our prayers, humility, are not formally sins, but only concomitantly, in regard that sin adheres to them, as muddy water is not formally clay and mud, but in mixture it’s clay and muddy, so our faith is concomitantly sinful; both because often it’s weak, and so wanting [lacking] many degrees and mixed with sin, deserves a curse, as well as works of sanctification, but it apprehends Christ and righteousness in Him and so it bottoms our assurance.</p></blockquote>

</figure><figure class="quote" id="q-3476ba8153" data-kw="">
<blockquote><p>Though God by his grace must change the perverse disposition of men’s wills before they will make a gracious choice, yet it is most certain that the teachings, commands, exhortations and reproofs of God are directed to the will of man: And that the promises and threatnings, mercies and judgements are used to move and change the will: And that in the tenor of his laws and covenants, Christ has set life and death before men and put their happiness in their own choice; and that no man shall have better or worse than he made choice of: that is, none shall be either happy or miserable but as they did choose or refuse the causes of happiness or misery. And the reason of this is, because natural-free-will was part of the natural-image of God on Adam; and it is as natural to a man to be a free-agent as to be reasonable. And God will govern man as man agreeably to his nature.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/richard-baxter.html">Richard Baxter</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Cure of Church Divisions… (London, 1670), pt. 1, Direction 15</cite>, pp. 109-10</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/free-will-and-inability/liberty-and-necessity.html">Liberty and Necessity</a></span></div>

</figure><figure class="quote" id="q-e7d5eaa632" data-kw="">
<blockquote><p>What makes it the case that I do in fact act or refrain from acting on the reasons in question? Doesn’t a choice to act require a cause, and if the act is to be a free and thus self-determined one, doesn’t that entail that the cause must be some further choice on my part? If that is the case, doesn’t that further choice itself require yet another choice as a cause, and so on ad infinitum? The answer is that this does not follow. Just as the will’s ultimate ends in the order of final causes are simply given rather than pursued for the sake of yet further ends, so too its ultimate acts in the order of efficient causes can bring about effects (such as bodily movements) without themselves being caused. The will is in this sense an uncaused cause or unmoved mover.† † …as Cuypers goes on to note, this is consistent with holding that the will is ultimately moved by God, just as, for the Thomist, everything other than God ultimately exists and acts at any moment only insofar as God conserves it in being and concurs with its causal activity. If we acccept this theological picture (as I happen to), the will would count as an unmoved mover only in a relative sense, with God alone being an unmoved mover in an absolute sense… In my view, how divine causality related to the will is in any event more a question about the nature of divine causality than it is a question about the nature of the will. This does not entail that its operation is random, either in the snese of being an exception to the principle of causality or in the sense of being unintelligible or devoid of explanation. It is not an exception to the principle of causality, because events require causes insofar as they contain some passive potentiality that requires actualization… The exertion of the will by contrast, is entirely active rather than passive. It is a bringing about that is not itself brought about by anything else. Yet it is not unintelligible or devoid of explanation, because it is done for a reason–in particular, for the sake of the end grasped by the intellect–and something done for a reason is the opposite of unintelligible. Hence the defender of agent-causal free will [which Aquinas’s view more or less fits into] is not stuck with the dilemma of having to posit either ‘an infinite regress or a nonrational flip-flop.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/edward-feser.html">Edward Feser</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Immortality of Souls: a Treatise on Human Nature (Editiones Scholastica, 2024), ch. 4, ‘The Will’ Feser is an Anyltical Thomist, writing in the Thomist tradition. What is said below is consistent with divine, physical predetermination.</cite>, pp. 169-70</span></figcaption>

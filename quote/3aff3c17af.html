</figure><figure class="quote" id="q-32dd884dec" data-kw="">
<blockquote><p>The worship (or service) of God is a work commanded of God, wrought through faith (principally) to the setting forth of the glory of God. In this definition there be three things, which in the true worship of God are necessarily joined together: First: The matter (or material part), which is a work commanded of God. Secondly: The cause, namely that the same work be done of faith, in Jesus Christ. Thirdly: The end, namely the glory of God, which the worker respects, that by this means he may declare himself obedient to his heavenly father.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/niels-hemmingsen.html">Niels Hemmingsen</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Way of Life A Christian, &amp; Catholic Institution comprehending Principal Points of Christian Religion</cite>, … (London: Jones, 1578), ‘Of the Worship (or Service) of God’, p. 180 Hemmingsen was a Lutheran.</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/worship/nature-of-worship.html">Nature of Worship</a></span></div>

</figure><figure class="quote" id="q-cb4154b57e" data-kw="">
<blockquote><p>For, whereas worshipping God in, by, or before a creature respective [repectively], or with relation to the creature, may be understood before it respective, or with relation to it, as the terminus [end], or object to which it is directed; as worshipping before, Lk. 4:7, is worshipping of Satan, Mt. 4:9, and the relation to the creature may be as conceiving God included in it, as in the consecrated host, or represented by it, as by the golden calf, or a crucifix, or as pertaining to God, being consecrated to Him, as Gideon’s ephod, or Popish relics of saints or hallowed grains or the like, without God’s institution. In these and such like relations, the adoration being directed to the creatures, whether as the only object to which, or the intermediate object, whether properly or improperly; of itself or by accident… But he [the opponent] thought it best… to express himself more intelligibly… in the minor [proposition], that: ‘kneeling is adoration or worshipping of God before the creature respectivè, or with relation to the creature, as the objectum significativè à quo [the signifying object from which], or the motive of the kneeling.’ But in this sense I deny his major [proposition, that this be idolatry]; and that he may not think me bereft of my wits, but that I know what I say, I give him this reason of my denial: I find the Holy Ghost inviting the Jews to worship at God’s footstool, his holy hill, Ps. 99:5, 9, which were creatures; and there they were to bow down to God, in, by or before these creatures respective, or with relation to them, as the objectum significative a quo, that is, that thing which was an object signifying God’s presence there, and the motive of their bowing down to God; which, if they had not been there, that is, the ark, temple, altar, they would not have done; and there was no idolatry therein. And to stop the evasion, that it was so, when God appointed it, though this would not avoid the instance, the bread and wine being of God’s appointment, and the use of them in the sacrament of the Lord’s Supper, as well as the altar, ark, temple, were, they were instituted to be memorative signs of Christ’s body and blood, communicated to the receivers by faith; yet I find that adoration or worshipping of God before the creature respective, or with relation to it, as the objectum significative a quo, and the motive of the adoration, has been performed occasionally without institution, and yet no idolatry committed. When the Israelites at mount Carmel, 1 Kn. 18:38, saw the fire of the Lord fall and consume the burnt offering and the wood, and the stones, and the dust, and lick up the water that was in the trench, they fell on their faces and they said, ‘The Lord He is God, the Lord He is the God.’ Here was adoration of God before the creature respective, or with relation to it, as the objectum significative a quo, signifying the Lord to be God; and as the motive of that adoration, which, if it had not been there, they would not have done it; and yet no idolatry committed. Another instance is 2 Chron. 7:3, when all the children of Israel saw how the fire came down, and the glory of the Lord upon the house, they bowed themselves with their faces to the ground upon the pavement, and worshipped and praised the Lord, saying, ‘For He is good, for his mercy endureth forever.’ Here was adoration and worshipping God, in, by or before a creature, not having special institution, abiding in their sight, as the objectum significative a quo, or the motive of their adoration, and worship of the Lord, and yet no Idolatry. I confess that when the worship is before it, so as it is directed to it, as upon the sight of the bread, or a crucifix, the host, or a crucifix is worshipped, whether terminatively, or as the representative of another, it is idolatry: As If Job, when he had seen the un when it shined, or the moon walking in brightness, his heart had been secretly enticed, and his mouth had kissed his hand, as it is Job 31:26-27, it had been idolatry: For then the sun had been not only objectum a quo [the object from which], the motive or occasion, but also objectum ad quod [the object to which], or the terminus ad quem [the end to which], to which it had been directed. But if he had only taken occasion, upon the sight of the sun, to worship God, as David did, Ps. 8:3, magnify or worship God the Creator, it had been no idolatry, though the moon or sun were the objectum a quo significative, or the sight 〈◊〉 it, the motive to it. Till divine worship be given to a creature, it is not idolatry, although in the kind or means of worship, there may be will-worship; and in the opinion of those that count their act or the object to be holy, when it is not, there may be superstition of the mind; and in the use of such things, or forbearing their use, superstition in the members… for the adoring of God, though it be at the receiving the elements, yet the elements are not objectum significative a quo, or the motive of their kneeling, according to the [Anglican] Common-Prayer Book, which says that the order in the office for the administration of the Lord’s Supper, that: ‘The communicants should receive it kneeling, is well meant, for a signification of our humble and grateful acknowledgement of the benefits of Christ, therein given to all worthy receivers; and for the avoiding of such profanation and disorder in the holy Communion as might otherwise ensue: That thereby no adoration is intended, or ought to be done, either unto the sacramental bread and wine there bodily received, or unto any corporal presence of Christ’s natural flesh and blood.’ Which intimate that the elements are not the objectum significative a quo, or the motive of their kneeling; but the benefits of Christ in the Lord’s Supper, given to all worthy receivers; And that, not the sight of bread or wine, (which is not seen till the cup be in their hand) but the remembrance of Christ’s death, and the remission of sins by his blood, by faith, are the motive to kneel to God, with prayer and thanksgiving to Him, without any honor of the bread and wine, though received, eaten and drunk, to remember Christ’s death, as the procuring cause of those benefits. As for his [the opponent’s] reason, if the elements were not there, they would not kneel; therefore they are the objectum significative a quo, or the motive of their kneeling; partly the antecedent is not true, for they kneel before they receive the elements brought to them, and after they have eaten and drunk, while they are in the meditation of Christs death, and the benefits by it, using holy ejaculation in prayer and thanksgiving to God…</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/john-tombes.html">John Tombes</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Theodulia, or a Just Defence of Hearing the Sermons &amp; other teaching of the present Ministers of England against a book unjustly entitled, A Christian testimony against them that serve the image of the beast</cite>, … (London: E. Cotes, 1667) 333 pp. ToC | ch. 7, section 15, ‘Kneeling in receiving the sacramental elements is not idolatry’, pp. 257-60</span></figcaption>

— John Tombes, Theodulia, or a Just Defence of Hearing the Sermons &amp; other teaching of the present Ministers of England against a book unjustly entitled, A Christian testimony against them that serve the image of the beast… (London: E. Cotes, 1667) 333 pp. ToC | ch. 7, section 15, ‘Kneeling in receiving the sacramental elements is not idolatry’, pp. 257-60">Copy</button><a class="share" href="https://x.com/intent/post?text=%E2%80%9CFor%2C+whereas+worshipping+God+in%2C+by%2C+or+before+a+creature+respective+%5Brepectively%5D%2C+or+with+relation+to+the+creature%2C+may+be+understood+before+it+respective%2C+or+with+relation+to+it%2C+as+the+terminus+%5Bend%5D%2C+or+object+to+which+it+is+directed%3B+as+worshipping+before%2C+Lk.+4%3A7%2C+is+worshipping+of+Satan%2C+Mt.+4%3A9%2C+and+the+relation+to+the+creature+may+be+as+conceiving+God+included+in+it%2C+as+in+the+consecrated+host%2C+or+represented+by+it%2C+as+by+the+golden+calf%2C+or+a+crucifix%2C+or+as+pertaining+to+God%2C+being+consecrated+to+Him%2C+as+Gideon%E2%80%99s+ephod%2C+or+Popish+relics+of+saints+or+hallowed+grains+or+the+like%2C+without+God%E2%80%99s+institution.+In+these+and+such+like+relations%2C+the+adoration+being+directed+to+the+creatures%2C+whether+as+the+only+object+to+which%2C+or+the+intermediate+object%2C+whether+properly+or+improperly%3B+of+itself+or+by+accident%E2%80%A6+But+he+%5Bthe+opponent%5D+thought+it+best%E2%80%A6+to+express+himself+more+intelligibly%E2%80%A6+in+the+minor+%5Bproposition%5D%2C+that%3A+%E2%80%98kneeling+is+adoration+or+worshipping+of+God+before+the+creature+respectiv%C3%A8%2C+or+with+relation+to+the+creature%2C+as+the+objectum+significativ%C3%A8+%C3%A0+quo+%5Bthe+signifying+object+from+which%5D%2C+or+the+motive+of+the+kneeling.%E2%80%99+But+in+this+sense+I+deny+his+major+%5Bproposition%2C+that+this+be+idolatry%5D%3B+and+that+he+may+not+think+me+bereft+of+my+wits%2C+but+that+I+know+what+I+say%2C+I+give+him+this+reason+of+my+denial%3A+I+find+the+Holy+Ghost+inviting+the+Jews+to+worship+at+God%E2%80%99s+footstool%2C+his+holy+hill%2C+Ps.+99%3A5%2C+9%2C+which+were+creatures%3B+and+there+they+were+to+bow+down+to+God%2C+in%2C+by+or+before+these+creatures+respective%2C+or+with+relation+to+them%2C+as+the+objectum+significative+a+quo%2C+that+is%2C+that+thing+which+was+an+object+signifying+God%E2%80%99s+presence+there%2C+and+the+motive+of+their+bowing+down+to+God%3B+which%2C+if+they+had+not+been+there%2C+that+is%2C+the+ark%2C+temple%2C+altar%2C+they+would+not+have+done%3B+and+there+was+no+idolatry+therein.+And+to+stop+the+evasion%2C+that+it+was+so%2C+when+God+appointed+it%2C+though+this+would+not+avoid+the+instance%2C+the+bread+and+wine+being+of+God%E2%80%99s+appointment%2C+and+the+use+of+them+in+the+sacrament+of+the+Lord%E2%80%99s+Supper%2C+as+well+as+the+altar%2C+ark%2C+temple%2C+were%2C+they+were+instituted+to+be+memorative+signs+of+Christ%E2%80%99s+body+and+blood%2C+communicated+to+the+receivers+by+faith%3B+yet+I+find+that+adoration+or+worshipping+of+God+before+the+creature+respective%2C+or+with+relation+to+it%2C+as+the+objectum+significative+a+quo%2C+and+the+motive+of+the+adoration%2C+has+been+performed+occasionally+without+institution%2C+and+yet+no+idolatry+committed.+When+the+Israelites+at+mount+Carmel%2C+1+Kn.+18%3A38%2C+saw+the+fire+of+the+Lord+fall+and+consume+the+burnt+offering+and+the+wood%2C+and+the+stones%2C+and+the+dust%2C+and+lick+up+the+water+that+was+in+the+trench%2C+they+fell+on+their+faces+and+they+said%2C+%E2%80%98The+Lord+He+is+God%2C+the+Lord+He+is+the+God.%E2%80%99+Here+was+adoration+of+God+before+the+creature+respective%2C+or+with+relation+to+it%2C+as+the+objectum+significative+a+quo%2C+signifying+the+Lord+to+be+God%3B+and+as+the+motive+of+that+adoration%2C+which%2C+if+it+had+not+been+there%2C+they+would+not+have+done+it%3B+and+yet+no+idolatry+committed.+Another+instance+is+2+Chron.+7%3A3%2C+when+all+the+children+of+Israel+saw+how+the+fire+came+down%2C+and+the+glory+of+the+Lord+upon+the+house%2C+they+bowed+themselves+with+their+faces+to+the+ground+upon+the+pavement%2C+and+worshipped+and+praised+the+Lord%2C+saying%2C+%E2%80%98For+He+is+good%2C+for+his+mercy+endureth+forever.%E2%80%99+Here+was+adoration+and+worshipping+God%2C+in%2C+by+or+before+a+creature%2C+not+having+special+institution%2C+abiding+in+their+sight%2C+as+the+objectum+significative+a+quo%2C+or+the+motive+of+their+adoration%2C+and+worship+of+the+Lord%2C+and+yet+no+Idolatry.+I+confess+that+when+the+worship+is+before+it%2C+so+as+it+is+directed+to+it%2C+as+upon+the+sight+of+the+bread%2C+or+a+crucifix%2C+the+host%2C+or+a+crucifix+is+worshipped%2C+whether+terminatively%2C+or+as+the+representative+of+another%2C+it+is+idolatry%3A+As+If+Job%2C+when+he+had+seen+the+un+when+it+shined%2C+or+the+moon+walking+in+brightness%2C+his+heart+had+been+secretly+enticed%2C+and+his+mouth+had+kissed+his+hand%2C+as+it+is+Job+31%3A26-27%2C+it+had+been+idolatry%3A+For+then+the+sun+had+been+not+only+objectum+a+quo+%5Bthe+object+from+which%5D%2C+the+motive+or+occasion%2C+but+also+objectum+ad+quod+%5Bthe+object+to+which%5D%2C+or+the+terminus+ad+quem+%5Bthe+end+to+which%5D%2C+to+which+it+had+been+directed.+But+if+he+had+only+taken+occasion%2C+upon+the+sight+of+the+sun%2C+to+worship+God%2C+as+David+did%2C+Ps.+8%3A3%2C+magnify+or+worship+God+the+Creator%2C+it+had+been+no+idolatry%2C+though+the+moon+or+sun+were+the+objectum+a+quo+significative%2C+or+the+sight+%E3%80%88%E2%97%8A%E3%80%89+it%2C+the+motive+to+it.+Till+divine+worship+be+given+to+a+creature%2C+it+is+not+idolatry%2C+although+in+the+kind+or+means+of+worship%2C+there+may+be+will-worship%3B+and+in+the+opinion+of+those+that+count+their+act+or+the+object+to+be+holy%2C+when+it+is+not%2C+there+may+be+superstition+of+the+mind%3B+and+in+the+use+of+such+things%2C+or+forbearing+their+use%2C+superstition+in+the+members%E2%80%A6+for+the+adoring+of+God%2C+though+it+be+at+the+receiving+the+elements%2C+yet+the+elements+are+not+objectum+significative+a+quo%2C+or+the+motive+of+their+kneeling%2C+according+to+the+%5BAnglican%5D+Common-Prayer+Book%2C+which+says+that+the+order+in+the+office+for+the+administration+of+the+Lord%E2%80%99s+Supper%2C+that%3A+%E2%80%98The+communicants+should+receive+it+kneeling%2C+is+well+meant%2C+for+a+signification+of+our+humble+and+grateful+acknowledgement+of+the+benefits+of+Christ%2C+therein+given+to+all+worthy+receivers%3B+and+for+the+avoiding+of+such+profanation+and+disorder+in+the+holy+Communion+as+might+otherwise+ensue%3A+That+thereby+no+adoration+is+intended%2C+or+ought+to+be+done%2C+either+unto+the+sacramental+bread+and+wine+there+bodily+received%2C+or+unto+any+corporal+presence+of+Christ%E2%80%99s+natural+flesh+and+blood.%E2%80%99+Which+intimate+that+the+elements+are+not+the+objectum+significative+a+quo%2C+or+the+motive+of+their+kneeling%3B+but+the+benefits+of+Christ+in+the+Lord%E2%80%99s+Supper%2C+given+to+all+worthy+receivers%3B+And+that%2C+not+the+sight+of+bread+or+wine%2C+%28which+is+not+seen+till+the+cup+be+in+their+hand%29+but+the+remembrance+of+Christ%E2%80%99s+death%2C+and+the+remission+of+sins+by+his+blood%2C+by+faith%2C+are+the+motive+to+kneel+to+God%2C+with+prayer+and+thanksgiving+to+Him%2C+without+any+honor+of+the+bread+and+wine%2C+though+received%2C+eaten+and+drunk%2C+to+remember+Christ%E2%80%99s+death%2C+as+the+procuring+cause+of+those+benefits.+As+for+his+%5Bthe+opponent%E2%80%99s%5D+reason%2C+if+the+elements+were+not+there%2C+they+would+not+kneel%3B+therefore+they+are+the+objectum+significative+a+quo%2C+or+the+motive+of+their+kneeling%3B+partly+the+antecedent+is+not+true%2C+for+they+kneel+before+they+receive+the+elements+brought+to+them%2C+and+after+they+have+eaten+and+drunk%2C+while+they+are+in+the+meditation+of+Christs+death%2C+and+the+benefits+by+it%2C+using+holy+ejaculation+in+prayer+and+thanksgiving+to+God%E2%80%A6%E2%80%9D%0A%0A%E2%80%94+John+Tombes%2C+Theodulia%2C+or+a+Just+Defence+of+Hearing+the+Sermons+%26+other+teaching+of+the+present+Ministers+of+England+against+a+book+unjustly+entitled%2C+A+Christian+testimony+against+them+that+serve+the+image+of+the+beast%E2%80%A6+%28London%3A+E.+Cotes%2C+1667%29+333+pp.+ToC+%7C+ch.+7%2C+section+15%2C+%E2%80%98Kneeling+in+receiving+the+sacramental+elements+is+not+idolatry%E2%80%99%2C+pp.+257-60&amp;url=https%3A%2F%2F5solasquotes.github.io%2Fquote%2Fcb4154b57e.html&amp;via=5Solas" target="_blank" rel="noopener">Share on X</a><a class="perma" href="../quote/cb4154b57e.html">Permalink</a><a class="src" href="https://reformedbooksonline.com/against-kneeling-in-receiving-the-lords-supper/#:~:text=For%2C%20whereas%20worshipping%20God%20in%2C%20by,in%20prayer%20and%20thanksgiving%20to%20God&amp;text=For%2C%20whereas%20worshipping%20God%20in%2C%20by%2C%20or%20before&amp;text=holy%20ejaculation%20in%20prayer%20and%20thanksgiving%20to%20God" rel="noopener" target="_blank">Read it online · Reformed Books Online</a></div>

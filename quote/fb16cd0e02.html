<main class="wrap"><figure class="quote" id="q-fb16cd0e02" data-kw="">
<blockquote><p>Distinctions have been drawn by certain exceedingly wise men (measured by their own estimate of themselves), between the people of God who lived before the coming of Christ and those who lived afterwards. We have even heard it asserted that those who lived before the coming of Christ do not belong to the Church of God! We never know what we shall hear next, and perhaps it is a mercy that these absurdities are revealed one at a time in order that we may be able to endure their stupidity without dying of amazement!

Why, every child of God in every place stands on the same footing! The Lord has not some children best beloved, some second-rate offspring, and others whom He hardly cares about. These who saw Christ’s day before it came, had a great difference as to what they knew, and perhaps in the same measure a difference as to what they enjoyed while on earth in meditating upon Christ; but they were all washed in the same blood, all redeemed with the same ransom price, and made members of the same body! Israel in the covenant of grace is not natural Israel, but all believers in all ages! Before the first advent, all the types and shadows all pointed one way—they pointed to Christ, and to Him all the saints looked with hope. Those who lived before Christ were not saved with a different salvation to that which shall come to us; they exercised faith as we must; that faith struggled as our struggles, and that faith obtained its reward as ours shall, as like as a man’s face to that which he sees in a glass is the spiritual life of David to the spiritual life of the believer now.

Take the book of Psalms in your hand, and forgetting, for an instant that you have the representation of the life of one in the olden times, you might suppose that David wrote but yesterday. Even in what he writes of Christ, he seems as though he lived after Christ instead of before, and both in what he sees of himself, and in what he sees of his Savior, he appears to be rather a Christian writer than a Jew. I mean that living before Christ, he has the same hopes and the same fears, the same joys and the same sorrows, and there is the same estimate of his blessed Redeemer which you and I have in these times. Jesus was the same yesterday as an anointed Savior to His people, as He is today, and they under Him received like precious gifts. If the goodly fellowship of the prophets could be here today, they would all testify to you that He was the same in every office in their times as He is in these, our days.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/charles-h-spurgeon.html">Charles H. Spurgeon</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Jesus Christ Immutable. Delivered Lord s-day Morning, January 3, 1869’, no. 848 in The, Metropolitan Tabernacle Pulpit: Volume 15</cite></span></figcaption>

</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-4c849b76e2" data-kw="">
<blockquote><p>For these things [Mk. 16:17-20] are not absolutely and without exception, but in some respect the tokens of faith belonging to that primitive Church until the gospel were made more manifest. For miracles were as trumpets and open criers whereby the gospel was commended. For even as the law of Moses procured to itself credit, through the manifold miracles showed upon mount Sinai and in the wilderness, which afterward ceased when they were come to the land of promise: so in like manner miracles are now also taken away, seeing the gospel is spread throughout the world. And therefore the promise which Christ would have to be written in the gospel of Mark belonged not to all times; whereof it is not our part either to complain or find any fault, because that we hear that the Holy Ghost distributes to everyone as He will, who nevertheless, for great considerations Him moving, does not impart to all men gifts and graces alike. For if they should happen to all alike, they would soon grow out of estimation, whereas God has determined to make store of them. Moreover, He would that charity should grow and increase, which is then exercised when one man does help another, which thing would not have taken place if all men had been endued with like gifts.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/peter-martyr-vermigli.html">Peter Martyr Vermigli</a></span><span class="wk"><span class="lbl">Work:</span> <cite>‘Whether it be lawful for the godly to desire miracles, and why there be none in this our age’ in ch. 9. ‘Of Miracles, &amp; the Definition &amp; Difference of Them’ in The Common Places</cite>, … (London: Henrie Denham et al., 1583), pt. 1, pp. 69-72, pp. 71-72</span></figcaption>

</figure><figure class="quote" id="q-2f72050000" data-kw="">
<blockquote><p>His [God’s] existence no less clearly appears from the exact fulfilment of so many, and so particularly circumstantiated predictions, published long before the events took place, viz. predictions concerning mankind in general; – the descendants of Noah, Lot, and Abraham; – Canaanites, Syrians, Assyrians, Chaldeans, Persians, Greeks, Romans, – Arabs, Turks, – Jesus Christ; Antichrist; New Testament church. It is impossible that these predictions, which were so exactly fulfilled in their respective periods, and of the fulfilment of which there are, at present, thousands of demonstrative and sensible documents in the world, could proceed from any but an all-seeing, and infinitely wise, and almighty Governor of the world.</p></blockquote>

<main class="wrap"><figure class="quote" id="q-758c05857d" data-kw="">
<blockquote><p>Because repentance from sin is frequently in the holy Scripture made a condition going before remission and a cause without which we shall not have it, it so orders its exhortations that it may drive us to true repentance and true sanctity that so we may obtain remission. So the prophets, John Baptist, etc.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/moses-amyrauld.html">Moses Amyrauld</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Theses Salmuriensis</cite>, vol. 2, Disputation on Satisfaction, p. 63 as trans. Richard Baxter, Richard Baxter’s Confession of his Faith… (London: 1655), ch. 10, sect. 3, p. 338</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/repentance-and-conversion/repentance-and-faith.html">Repentance and Faith</a></span></div>

— Moses Amyrauld, Theses Salmuriensis, vol. 2, Disputation on Satisfaction, p. 63 as trans. Richard Baxter, Richard Baxter’s Confession of his Faith… (London: 1655), ch. 10, sect. 3, p. 338">Copy</button><a class="share" href="https://x.com/intent/post?text=%E2%80%9CBecause+repentance+from+sin+is+frequently+in+the+holy+Scripture+made+a+condition+going+before+remission+and+a+cause+without+which+we+shall+not+have+it%2C+it+so+orders+its+exhortations+that+it+may+drive+us+to+true+repentance+and+true+sanctity+that+so+we+may+obtain+remission.+So+the+prophets%2C+John+Baptist%2C+etc.%E2%80%9D%0A%0A%E2%80%94+Moses+Amyrauld%2C+Theses+Salmuriensis%2C+vol.+2%2C+Disputation+on+Satisfaction%2C+p.+63+as+trans.+Richard+Baxter%2C+Richard+Baxter%E2%80%99s+Confession+of+his+Faith%E2%80%A6+%28London%3A+1655%29%2C+ch.+10%2C+sect.+3%2C+p.+338&amp;url=https%3A%2F%2F5solasquotes.github.io%2Fquote%2F758c05857d.html&amp;via=5Solas" target="_blank" rel="noopener">Share on X</a><a class="perma" href="../quote/758c05857d.html">Permalink</a><a class="src" href="https://reformedbooksonline.com/on-the-relation-of-repentance-to-saving-faith-justification/#:~:text=Because%20repentance%20from%20sin%20is%20frequently,So%20the%20prophets%2C%20John%20Baptist%2C%20etc&amp;text=Because%20repentance%20from%20sin%20is%20frequently%20in%20the&amp;text=obtain%20remission.%20So%20the%20prophets%2C%20John%20Baptist%2C%20etc" rel="noopener" target="_blank">Read it online · Reformed Books Online</a></div>
</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-07d73a7197" data-kw="">
<blockquote><p>…those works of preventing grace, whereby out of the general apprehension of faith, God works in us dislike of our former condition, desire to be reconciled to God, to have remission of that [which] is past, and grace hereafter to decline the like evils, and to do contrary good things. For by these we are prepared, disposed and fitted for justification; without these none are justified. And in this sense, and to imply a necessity of these to be found in us, sometimes the Fathers and others say that we are not justified by faith only. And we all agree, that it is not our conversion to God, nor the change we find in ourselves, that can any way make us stand in judgment without fear, and look for any good from God, otherwise than in that we find ourselves so disposed and fitted, as is necessary for justification, whence we assure ourselves God will in mercy accept us for Christs sake.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/richard-field.html">Richard Field</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Other citations (work not named)</cite>, Of the Church... (Oxford: Turner, 1628), bk. 3, appendix, ch. 11, p. 324 Field (1561–1616) was an Anglican theologian associated with Richard Hooker’s work.</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/repentance-and-conversion/repentance-and-faith.html">Repentance and Faith</a></span></div>

</figure><figure class="quote" id="q-052ea44d12" data-kw="">
<blockquote><p>Now, since Christ confers upon us, and we obtain by faith, both free reconciliation and newness of life, reason and order require that I should here begin to treat of both. The shortest transition, however, will be from faith to repentance; for repentance being properly understood it will better appear how a man is justified freely by faith alone, and yet that holiness of life, real holiness, as it is called, is inseparable from the free imputation of righteousness.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/john-calvin.html">John Calvin</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Institutes of the Christian Religion</cite>, 3.3.1</span></figcaption>

</figure><figure class="quote" id="q-a279f3b688" data-kw="">
<blockquote><p>The commandment to embrace the Mediator by faith also conjoins repentance: according to that saying of John the Baptist, Mk. 1:15, Repent ye, and believe the Gospel. Thus God Himself from heaven reveals the Mediator, and commands that He be embraced by true faith, Mt. 17:5, this is my beloved Son, in whom I am well pleased; hear ye Him. The promise is expressed, Jn. 3:16, God so loved the world, that He gave His only begotten Son, that whosoever believeth in Him should not perish, but have everlasting life. … The external call, which ordinarily is made through the ministers and preachers of the word, concerns adults, and not the elect alone, even if these primarily, but also reprobates, to whom God also reveals the Mediator, and, should they repent, commands them to expect life from Him: and that unto this end, that, with the condition of repentance and faith neglected, without which salvation through Christ come to no one, they are made ἀναπολόγητοι or inexcusable, and understand the just cause of damnation.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/marcus-friedrich-wendelin.html">Marcus Friedrich Wendelin</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Christian Theology 3rd</cite>, ed. (1634), Gospel-Offer &amp; Covenant of Grace Wendelin (1584-1652)</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/repentance-and-conversion/repentance-and-faith.html">Repentance and Faith</a></span></div>

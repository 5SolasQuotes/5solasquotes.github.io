<main class="wrap"><figure class="quote" id="q-1e7198fc15" data-kw="">
<blockquote><p>First of all, I hold that it is proper for the ceremonies in the church to be absolutely as few and as pure as possible. For besides the fact that we must now worship the Lord in Spirit and truth, even plain experience, that teacher of fools, ought to warn us not to imitate the example of those who–while setting no limit on their ceremonies–do not increase the worship of God, but completely undermine it. And so we determined that we should take thought how to do away with ceremonies rather than establishing them.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/theodore-beza.html">Theodore Beza</a></span><span class="wk"><span class="lbl">Work:</span> <cite>A Clear &amp; Simple Treatise on the Lord’s Supper</cite>, (RHB, 2016), p. 143</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/worship/ceremonies-and-things-indifferent.html">Ceremonies and Things Indifferent</a></span></div>

</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-09b3b03b78" data-kw="">
<blockquote><p>If it be said that the best man who lives ties not himself to these rules, in the use of every indifferent thing, but oftimes uses or omits a thing of that nature at his own pleasure. I answer: In many things we offend all. And who can understand his errors? But in the mean time, the rules of the Word limit us so strictly that we may never use a thing in its own nature indifferent at our arbitrament and pleasure, and that the use of it is never lawful to us except it be done piously for God’s glory, profitably for man’s edification and purely with full assurance that that which we do is approved of God.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/george-gillespie.html">George Gillespie</a></span><span class="wk"><span class="lbl">Work:</span> <cite>A Dispute Against the English-Popish Ceremonies</cite>, ... ([Leiden] 1637), | pt. 4, ‘Against the Indifferency of the Ceremonies’ | ch. 3, ‘Whether There be Anything Indifferent In Actu Exercito [In the Exercised Act]?’ No., p. 16</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/worship/ceremonies-and-things-indifferent.html">Ceremonies and Things Indifferent</a></span></div>

</figure><figure class="quote" id="q-6cfc349ce3" data-kw="">
<blockquote><p>Fourthly, the flux and reflux (so to speak) of several successive [seatings of] tables [for the Lord’s Supper in one congregation], where there is a great number to communicate, and the repeating, or pronouncing and applying to those several tables of receivers, the words, ‘Take ye’, ‘eat ye’, which Christ pronounced but once in one act of distribution, these things (I say) cannot be justly charged as deviations from the example of Christ, when the same providence which limited Him to a fewer number, calls us to distribute to a great number: Neither can they [the Independents] who so charge us [the presbyterians], ever make good what they allege, unless they prove that although Christ had been distributing this sacrament to all the 500 disciples to whom He appeared after his resurrection [1 Cor. 15:6] (suppose I say, there had been so many communicants), yet He had given them all at once the elements, and had said but once, ‘Take ye, eat ye’, and that there had been no intermission at all, nor no partition into several successive companies. If this can be proved, then they say much against the use of successive tables, otherwise not.</p></blockquote>

s/#:~:text=Fourthly%2C%20the%20flux%20and%20reflux%20%28so,use%20of%20successive%20tables%2C%20otherwise%20not&amp;text=Fourthly%2C%20the%20flux%20and%20reflux%20%28so%20to%20speak&amp;text=against%20the%20use%20of%20successive%20tables%2C%20otherwise%20not" rel="noopener" target="_blank">Read it online · Reformed Books Online</a></div>

<blockquote><p>2. Rulers may not make laws of things having no necessity of goodness, decency and aptness to edify, and [they are] only [deemed] good because they will, when they see, of necessity, these laws shall inevitably ruin many souls; for that is to have more regard to their own will than to the salvation of people’s souls, whereas even Christ pleased not Himself.</p></blockquote>

</figure><figure class="quote" id="q-c49d678bc0" data-kw="">
<blockquote><p>Yea further, times and places which are applied to the worship of God as circumstances only for outward order and policy may be by a private Christian applied to a civil use, for in so doing he breaks not the ordinance of the Church: For example, material churches are appointed to be the receptacles of Christian assemblies, and that only for such common commodity and decency, which has place as well in civil as in holy meetings, and not for any holiness conceived to be in them more than in other houses. Now if I be standing in a churchyard when it rains, may not I go into the church that I may be defended from the injury of the weather? If I must meet with certain men for putting order to some of my worldly affairs, and it fall out that we cannot conveniently meet in any part but in the church, may we not there keep our tryst? A material church then may serve for a civil use, the same way that it serves to a holy use.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/george-gillespie.html">George Gillespie</a></span><span class="wk"><span class="lbl">Work:</span> <cite>English Popish Ceremonies</cite>, (1637), pt. 3, ch. 1, ‘That the Ceremonies are Unlawful, because superstitious…’, pp. 11-12</span></figcaption>

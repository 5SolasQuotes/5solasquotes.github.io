<main class="wrap"><figure class="quote" id="q-e2c8bb289e" data-kw="">
<blockquote><p>Lastly I answer that the ground of the former objection is erroneous, namely that the promise of salvation depends on the condition of our works: because the Scripture says it is made and accomplished on man’s part freely. I grant indeed that to the promise there is annexed a condition of faith: yet faith must not here be considered as a work, but as an instrument apprehending Christ with his benefits: and withal, repentance with the fruits thereof are on our part required, yet no otherwise but as they are necessary consequents of faith and the signs and documents thereof.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/william-perkins.html">William Perkins</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Of Conscience, ch. 3, Of the kinds of conscience: and of conscience-regenerate, p. 880 appended to A Golden Chain... (Cambridge, 1600)</cite></span></figcaption>
<div class="meta"><span class="t"><a href="../topics/good-works/necessity-of-good-works.html">Necessity of Good Works</a></span></div>

</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-3889c8ecc7" data-kw="">
<blockquote><p>In respect of God, our election standeth certain from all eternity… But in respect of ourselves it is uncertain, and therefore we must ‘strive to make the same sure’ by good works, 2 Peter 1:10. These are the ways to come to heaven, though they be not the cause why we should come to heaven; therefore we must keep the way, if ever we mean to come to heaven; for as we are ordained to the end, so are we ordained to the means which bring us to that end.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/henry-smith.html">Henry Smith</a></span><span class="wk"><span class="lbl">Work:</span> <cite>In ‘Good Works are the Way to Heaven’ in The Lawyer’s Question: In Three Sermons (1595) in The Works of Henry Smith; Including Sermons, Treatises, Prayers, and Poems, ed. Thomas Fuller (2 vols, Edinburgh: James Nichol, 1866)</cite>, 2:108</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/good-works/necessity-of-good-works.html">Necessity of Good Works</a></span></div>
<div class="actions"><button class="copy" data-copy="“In respect of God, our election standeth certain from all eternity… But in respect of ourselves it is uncertain, and therefore we must ‘strive to make the same sure’ by good works, 2 Peter 1:10. These are the ways to come to heaven, though they be not the cause why we should come to heaven; therefore we must keep the way, if ever we mean to come to heaven; for as we are ordained to the end, so are we ordained to the means which bring us to that end.”

— Henry Smith, In ‘Good Works are the Way to Heaven’ in The Lawyer’s Question: In Three Sermons (1595) in The Works of Henry Smith; Including Sermons, Treatises, Prayers, and Poems, ed. Thomas Fuller (2 vols, Edinburgh: James Nichol, 1866), 2:108">Copy</button><a class="share" href="https://x.com/intent/post?text=%E2%80%9CIn+respect+of+God%2C+our+election+standeth+certain+from+all+eternity%E2%80%A6+But+in+respect+of+ourselves+it+is+uncertain%2C+and+therefore+we+must+%E2%80%98strive+to+make+the+same+sure%E2%80%99+by+good+works%2C+2+Peter+1%3A10.+These+are+the+ways+to+come+to+heaven%2C+though+they+be+not+the+cause+why+we+should+come+to+heaven%3B+therefore+we+must+keep+the+way%2C+if+ever+we+mean+to+come+to+heaven%3B+for+as+we+are+ordained+to+the+end%2C+so+are+we+ordained+to+the+means+which+bring+us+to+that+end.%E2%80%9D%0A%0A%E2%80%94+Henry+Smith%2C+In+%E2%80%98Good+Works+are+the+Way+to+Heaven%E2%80%99+in+The+Lawyer%E2%80%99s+Question%3A+In+Three+Sermons+%281595%29+in+The+Works+of+Henry+Smith%3B+Including+Sermons%2C+Treatises%2C+Prayers%2C+and+Poems%2C+ed.+Thomas+Fuller+%282+vols%2C+Edinburgh%3A+James+Nichol%2C+1866%29%2C+2%3A108&amp;url=https%3A%2F%2F5solasquotes.github.io%2Fquote%2F3889c8ecc7.html&amp;via=5Solas" target="_blank" rel="noopener">Share on X</a><a class="perma" href="../quote/3889c8ecc7.html">Permalink</a><a class="src" href="https://reformedbooksonline.com/good-works/#:~:text=In%20respect%20of%20God%2C%20our%20election,which%20bring%20us%20to%20that%20end&amp;text=In%20respect%20of%20God%2C%20our%20election%20standeth%20certain&amp;text=the%20means%20which%20bring%20us%20to%20that%20end" rel="noopener" target="_blank">Read it online · Reformed Books Online</a></div>
</figure><figure class="quote" id="q-3a90d76244" data-kw="">
<blockquote><p>…good works are causes of the favors of God and of eternal salvation, and that this cannot be denied, since God witnesses it everywhere in the Scripture, but that they are not the primary causes, nor are they causes in themselves, but the secondary causes and that too only from the spontaneous benevolence of God…</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/martin-bucer.html">Martin Bucer</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Disputata Ratisbonae, in altero colloqui, Anno XLVI. Et Collocutorum Augustanae Confessionis Responsa … De Justificatione, et locis doctrinae Euangelicae omnibus, quos doctrina de Iustificatione complectitur… (1548) as translated in Forbes, Justification, p. 311. Rutherford quotes from this work of Bucer to the same effect as below approvingly in his Examination, pp. 531-531.</cite>, p. 99, also 100-101 ff.</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/good-works/necessity-of-good-works.html">Necessity of Good Works</a></span></div>

— Martin Bucer, Disputata Ratisbonae, in altero colloqui, Anno XLVI. Et Collocutorum Augustanae Confessionis Responsa … De Justificatione, et locis doctrinae Euangelicae omnibus, quos doctrina de Iustificatione complectitur… (1548) as translated in Forbes, Justification, p. 311. Rutherford quotes from this work of Bucer to the same effect as below approvingly in his Examination, pp. 531-531., p. 99, also 100-101 ff.">Copy</button><a class="share" href="https://x.com/intent/post?text=%E2%80%9C%E2%80%A6good+works+are+causes+of+the+favors+of+God+and+of+eternal+salvation%2C+and+that+this+cannot+be+denied%2C+since+God+witnesses+it+everywhere+in+the+Scripture%2C+but+that+they+are+not+the+primary+causes%2C+nor+are+they+causes+in+themselves%2C+but+the+secondary+causes+and+that+too+only+from+the+spontaneous+benevolence+of+God%E2%80%A6%E2%80%9D%0A%0A%E2%80%94+Martin+Bucer%2C+Disputata+Ratisbonae%2C+in+altero+colloqui%2C+Anno+XLVI.+Et+Collocutorum+Augustanae+Confessionis+Responsa+%E2%80%A6+De+Justificatione%2C+et+locis+doctrinae+Euangelicae+omnibus%2C+quos+doctrina+de+Iustificatione+complectitur%E2%80%A6+%281548%29+as+translated+in+Forbes%2C+Justification%2C+p.+311.+Rutherford+quotes+from+this+work+of+Bucer+to+the+same+effect+as+below+approvingly+in+his+Examination%2C+pp.+531-531.%2C+p.+99%2C+also+100-101+ff.&amp;url=https%3A%2F%2F5solasquotes.github.io%2Fquote%2F3a90d76244.html&amp;via=5Solas" target="_blank" rel="noopener">Share on X</a><a class="perma" href="../quote/3a90d76244.html">Permalink</a><a class="src" href="https://reformedbooksonline.com/good-works/#:~:text=good%20works%20are%20causes%20of%20the,from%20the%20spontaneous%20benevolence%20of%20God&amp;text=good%20works%20are%20causes%20of%20the%20favors%20of&amp;text=too%20only%20from%20the%20spontaneous%20benevolence%20of%20God" rel="noopener" target="_blank">Read it online · Reformed Books Online</a></div>
</figure><figure class="quote" id="q-af730605b1" data-kw="">
<blockquote><p>We do not absolutely deny, that good works are a cause of salvation, viz., an instrumental rather than an efficient one… and as the cause which is called a sine qua non [without which: none]… Good works are an instrumental cause of the possession of life eternal, for by these as by media and by the legitimate path God leads us into the possession of eternal life… The same truly are rightly able to be said to be an instrumental cause of eternal life, insofar as God leads us by them into eternal life.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/jerome-zanchi.html">Jerome Zanchi</a></span><span class="wk"><span class="lbl">Work:</span> <cite>‘Whether Good Works are the Cause of Eternal Salvation?’ in Of the Nature of God, or of the Divine Attributes (Neustadt, 1593), Book 5, ch. 2, after Of Predestination in General, Question 6, Other Part, Of the Predestination of the Saints, Question 3, after the Thesis, pp. 670-71, begins bottom of left column on</cite>, p. 670</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/good-works/necessity-of-good-works.html">Necessity of Good Works</a></span></div>
<div class="actions"><button class="copy" data-copy="“We do not absolutely deny, that good works are a cause of salvation, viz., an instrumental rather than an efficient one… and as the cause which is called a sine qua non [without which: none]… Good works are an instrumental cause of the possession of life eternal, for by these as by media and by the legitimate path God leads us into the possession of eternal life… The same truly are rightly able to be said to be an instrumental cause of eternal life, insofar as God leads us by them into eternal life.”

— Jerome Zanchi, ‘Whether Good Works are the Cause of Eternal Salvation?’ in Of the Nature of God, or of the Divine Attributes (Neustadt, 1593), Book 5, ch. 2, after Of Predestination in General, Question 6, Other Part, Of the Predestination of the Saints, Question 3, after the Thesis, pp. 670-71, begins bottom of left column on, p. 670">Copy</button><a class="share" href="https://x.com/intent/post?text=%E2%80%9CWe+do+not+absolutely+deny%2C+that+good+works+are+a+cause+of+salvation%2C+viz.%2C+an+instrumental+rather+than+an+efficient+one%E2%80%A6+and+as+the+cause+which+is+called+a+sine+qua+non+%5Bwithout+which%3A+none%5D%E2%80%A6+Good+works+are+an+instrumental+cause+of+the+possession+of+life+eternal%2C+for+by+these+as+by+media+and+by+the+legitimate+path+God+leads+us+into+the+possession+of+eternal+life%E2%80%A6+The+same+truly+are+rightly+able+to+be+said+to+be+an+instrumental+cause+of+eternal+life%2C+insofar+as+God+leads+us+by+them+into+eternal+life.%E2%80%9D%0A%0A%E2%80%94+Jerome+Zanchi%2C+%E2%80%98Whether+Good+Works+are+the+Cause+of+Eternal+Salvation%3F%E2%80%99+in+Of+the+Nature+of+God%2C+or+of+the+Divine+Attributes+%28Neustadt%2C+1593%29%2C+Book+5%2C+ch.+2%2C+after+Of+Predestination+in+General%2C+Question+6%2C+Other+Part%2C+Of+the+Predestination+of+the+Saints%2C+Question+3%2C+after+the+Thesis%2C+pp.+670-71%2C+begins+bottom+of+left+column+on%2C+p.+670&amp;url=https%3A%2F%2F5solasquotes.github.io%2Fquote%2Faf730605b1.html&amp;via=5Solas" target="_blank" rel="noopener">Share on X</a><a class="perma" href="../quote/af730605b1.html">Permalink</a><a class="src" href="https://reformedbooksonline.com/good-works/#:~:text=We%20do%20not%20absolutely%20deny%2C%20that,us%20by%20them%20into%20eternal%20life&amp;text=We%20do%20not%20absolutely%20deny%2C%20that%20good%20works&amp;text=God%20leads%20us%20by%20them%20into%20eternal%20life" rel="noopener" target="_blank">Read it online · Reformed Books Online</a></div>
</figure><figure class="quote" id="q-2ab5bb4321" data-kw="">
<blockquote><p>In the Covenant of Nature obedience and works were commanded as the cause of life and justification: in the Covenant of Grace, Faith is required as the instrumental cause of Remission and Salvation, obedience as the qualification of the party justified, and the way leading to everlasting blessedness.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/john-ball.html">John Ball</a></span><span class="wk"><span class="lbl">Work:</span> <cite>A Treatise of the Covenant of Grace (London, 1645)</cite>, p. 26</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/good-works/necessity-of-good-works.html">Necessity of Good Works</a></span></div>

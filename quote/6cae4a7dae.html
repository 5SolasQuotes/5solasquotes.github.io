<main class="wrap"><figure class="quote" id="q-6cae4a7dae" data-kw="">
<blockquote><p>But this fruit (of Christ’s death) the apostle says belongs not promiscuously to all, but to them only who obey Him; For only these do accept the offered benefit. The rest by their own fault are deprived of it, because they obstinately refuse it: To obey Christ is not only to profess the name of Christ, but it is to acknowledge Christ the only perfect Redeemer, by true affiance to adhere to him and to live worthy the Gospel. This condition is in the whole Gospel required in them that must be saved.</p></blockquote>

</figure><figure class="quote" id="q-658bc426d4" data-kw="">
<blockquote><p>Bellarmine: 1. The adversaries in this bring things together so that good works are not necessary to salvation, except for a necessity of presence, so that they do not have any relation to salvation as they are merits, causes, conditions, etc. We speak against them that just good works are necessary to salvation, even as an efficient principle, even as they bring about [efficiunt] salvation. Protestants: We do not deny that good works have some relation to salvation, namely that they have a relation of being joined as a consequence, as a fitting effect to salvation (so to speak), being joined as an antecedent, namely as a fitting disposition unto salvation, and also as an argument confirming trust and hope in salvation; but we deny that our works are able to be some meritorious cause of justification and salvation.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/william-ames.html">William Ames</a></span><span class="wk"><span class="lbl">Work:</span> <cite>‘Of the Necessity of Works unto Salvation’ in Bellarmine Enervated, or Anti-Bellarmine Disputations</cite>, vol. 4 (London, 1632), pp. 367-369, p. 367</span></figcaption>

</figure><figure class="quote" id="q-3eddfe8052" data-kw="">
<blockquote><p>XL. Are good works therefore unnecessary for our justification? To become righteous from being guilty and liable to punishment—that is, to receive the abundance of grace and the gift of righteousness—they are not necessary as antecedents. But they are absolutely necessary as consequences. They are the fruits and ends of justification, from which justification ought not and cannot be separated. For in the New Covenant, God has first promised us the forgiveness of sins, and then sanctification. Christ has been made for us not only righteousness, but also sanctification. Faith embraces both promises, and draws both benefits from the fullness of Christ, into whom it inserts us. Thus, a faith that does not produce good works as its fruits reveals itself not to be true faith at all, but a rotten corpse of faith, which mimics the outward appearance of faith but has no power, movement, or activity. Therefore, in order that we may be declared righteous, and that it may be shown (whether in the court of our conscience or in the final judgment) that God has truly granted us forgiveness of sins, good works are necessary as posterior evidences, as they say. For faith is known by its works, just as a tree is known by its fruits. References: Heb. 10:16; 2 Cor. 1:30; Jm. 1:11.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/joshua-placeus.html">Joshua Placeus</a></span><span class="wk"><span class="lbl">Work:</span> <cite>‘Theological Theses on the Justification of Man before God’</cite>, trans. AI (1634), p. 9</span></figcaption>

<main class="wrap"><figure class="quote" id="q-38d43ec2b4" data-kw="">
<blockquote><p>But that is expressly restricted to that broken and declining state of the Church, Informatory Vindication, page 73, and tantum pro tempore [so far as the time], while they continued in that course, Testimony, page 30. Now the ministry of these with whom we are pleading to unite [the established Church of Scotland in 1690], is not so circumstantiated; it is not subject to strange lords, nor have they any holding, new or old upon any usurped power; nor are they by any confederacy servants of men: nor is our hearing of them a submitting unto any encroachment made upon the privileges of this Church, or liberties of this kingdom… But as that is restricted to the then broken and declining state in three several repetitions, Informatory Vindication, page 74 and 76. So now it cannot be applied to the generality of the present ministers, who now neither condemn the then testimony in their preaching, nor if they did in some things differ from it, would it be a sufficient ground of withdrawing, when that now is not the testimony, and they are faithful in the present testimony againft Popery, Prejacy, Erastianism and tyranny, etc… But whatever might be said for justifying that then in that broken and declining state of the Church, page 78, when these compliances were snares and stumbling-blocks persisted in and defended, that cannot be an argument now for withdrawing from all these compliers, when now the Church is not so declining but recovering her freedom from fetters, when now these cease to be snares and stumbling-blocks, when they are not persisted in, seeing also all these compliances are not alike, nor do they all deserve deposition.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/alexander-shields.html">Alexander Shields</a></span><span class="wk"><span class="lbl">Work:</span> <cite>An Enquiry into Church-Communion, or a Treatise against Separation from the Revolution Settlement of this National Church, as it was settled anno 1689 and 1690… (1706; Edinburgh: Gray, 1747)</cite>, pp. 29-31</span></figcaption>

</figure><figure class="quote" id="q-badc6b380d" data-kw="">
<blockquote><p>Take heed of pretending to greater purity and strictness about Church communion and administrations than the Word of God commends, or the examples of Christ and the apostles and the primitive Church do commend; nor be so extremely rigid as not to bear with things that they have tolerated. It is an observable rule laid down by wise and eminent divines that too much strictness and severity often does injury the Church more than profit it; it’s the way to overturn churches, not to reform them; especially this severity is unbecoming private Christians, who having no authority, yet complain such persons and such things are defilements: they must separate from them, they must not touch the unclean thing: such should take heed that they be not ‘righteous over-much,’ and not dare to be wise above what is written, lest their too much affected purity and misguided zeal hurt more the Church of Christ, and their own souls than the corruptions they so much complain of. Calvin adv. Anab., Art. 2. ‘Cum sub specie studii perfectionis imperfectionem nulam tollerare possumus; tune Diabolum nos tumefacere superbia, et hypocrisi seducere moneamur.&#x27;</p></blockquote>

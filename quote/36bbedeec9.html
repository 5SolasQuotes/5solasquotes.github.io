<main class="wrap"><figure class="quote" id="q-36bbedeec9" data-kw="">
<blockquote><p>What then? shall the single life have no prerogative? Yes questionless, if it conduce more to piety, then marriage; but if it fail in this point it’s much inferior to marriage. Now it always faileth of that in them who have not the gift of it.

There are some (saith our Saviour) which make themselves Eunuchs for the kingdom of heaven; but all men cannot receive this saying, save they to whom it is given. Which is clearly expounded veto us by St Paul, telling us that he could wish indeed, that all had the gift of continence as well as he, but that every man hath his proper gift, one in one kind, another in another.

To him then, who hath received this gift after the same manner as St Paul had received it, his single life doubtless will be far more advantageous then marriage, because that to him who is thus qualified, virginity is a help for piety, marriage would bee but an incumbrance. But to him who hath not received that gift in that manner, his single life would be but a snare and a trap: for by reason of his single life he would burn, &amp; the Apostle tells us that it is better to marry, then to burn.

As then marriage serves but for an hindrance and disturbance to him, who hath the gift that St. Paul had, to wit, the gift of continence: so the single life serveth but for an encumbrance and temptation, the danger of which is unavoidable, and deadly, to him who hath not received the gift of containing himself. We worthily esteem of the single life of those whom God calleth to it, but we say that no man is called unto it, who is forced to burn in it.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/john-cameron.html">John Cameron</a></span><span class="wk"><span class="lbl">Work:</span> <cite>An examination of those plausible appearances which seem most to commend the Romish Church, and to prejudice the Reformed. Discovering them to be but mere shifts, purposely invented, to hinder an exact trial of doctrine by the Scriptures</cite>, trans. William Pinke (Oxford: Edward Forrest, 1626), pp 168-69.</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/rome/the-church.html">Rome: The Church</a></span></div>

</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-8d72401d18" data-kw="">
<blockquote><p>Baxter (1615–1691) was… [an] English Puritan of the seventeenth century. He is well known for his ministerial manual “The Reformed Pastor”, in which he expressed the unusual conviction that parish ministers were better off unmarried. And yet, Baxter seemed to contradict himself by marrying one of his parishioners, Margaret Charlton. Though Baxter claimed to be happily married, he continued to champion celibacy for the rest of his life. This book explores Baxter’s argument for clerical celibacy by placing it in the context of his life and the turbulent events of seventeenth-century England. His viewpoint was shaped by several factors, including the Puritan literature he read, the context of his parish ministry, his burdensome model of soul care, and the formative life experiences shaping his theology and perspective. These factors not only explain why Baxter became the only Puritan to champion clerical celibacy but also why he continued to do so even after marrying.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/seth-d-osborne.html">Seth D. Osborne</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Reformed &amp; Celibate Pastor Richard Baxter’s Argument for Clerical Celibacy PhD diss</cite>, (V&amp;R, 2021) 417 pp.</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/rome/the-church.html">Rome: The Church</a></span></div>

<blockquote><p>For that the doctrine there is most impure, we have demonstrated through its several parts. But if it is asked about morals, come, let the very histories of the Roman pontiffs (which the parasites of the pontiffs wrote) be compared with whatever monsters of men ever existed from the founding of the world, and it will be found that in this one seat more was permitted to Satan than in any tyranny that ever oppressed the world.</p></blockquote>

</figure><figure class="quote" id="q-cdc5d78994" data-kw="">
<blockquote><p>Whereas one of them reports that I had said to him, that I thought the marriage of ministers had so great inconveniences, that though necessity made it lawful, yet it was but lawful; that is, to be avoided as far as lawfully we may. I answer that I did say so to him; and I never changed my judgment; yea, my wife lived and died in the same mind. And I here freely advise all ministers that have not some kind of necessity, to think of these few reasons among many… I did not marry till I was silenced and ejected, and had no flock or pastoral cure.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/richard-baxter.html">Richard Baxter</a></span><span class="wk"><span class="lbl">Work:</span> <cite>A Breviate of the Life of Margaret</cite>, p. 106</span></figcaption>

</figure><figure class="quote" id="q-373000dea1" data-kw="">
<blockquote><p>Hence, then, it is obvious that we do not at all deny that churches remain under his tyranny; churches, however, which by sacrilegious impiety he has profaned, by cruel domination has oppressed, by evil and deadly doctrines like poisoned potions has corrupted and almost slain; churches where Christ lies half-buried, the gospel is suppressed, piety is put to flight, and the worship of God almost abolished; where, in short, all things are in such disorder as to present the appearance of Babylon rather than the holy city of God.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/john-calvin.html">John Calvin</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Institutes of the Christian Religion</cite>, 4.2.12</span></figcaption>

<main class="wrap"><figure class="quote" id="q-8b0ed966e0" data-kw="">
<blockquote><p>Reason 2. Because nothing is required of them unfitting or burdensome, but that once every week, in convenient time and place, every one would contribute according to that measure wherewith God had blessed him: And the manner is plain, whereby the collection might be made publicly every Lord’s Day, and yet every one should lay it by himself, i. e. no man knowing the sum: We may imagine that they imitated the example of the ancient Church, a bored Chest being placed in the entrance to the house where they met for the Worship of God.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/david-dickson.html">David Dickson</a></span><span class="wk"><span class="lbl">Work:</span> <cite>An exposition of all St. Pauls epistles, together with an explanation of those other epistles of the apostles, St. James, Peter, John &amp; Jude</cite>, … (London, 1659), p. 69 on 1 Cor. 16:2</span></figcaption>

</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-e9b601c8d0" data-kw="">
<blockquote><p>The duties required in the first commandment are, the knowing and acknowledging of God to be the only true God, and our God;[o] and to worship and glorify him accordingly,[p] by thinking,[q] meditating,[r] remembering,[s] highly esteeming,[t] honouring,[v] adoring,[w] choosing,[x] loving,[y] desiring,[z] fearing of him;[a] believing him;[b] trusting,[c] hoping,[d] delighting,[e] rejoicing in him;[f] being zealous for him;[g] calling upon him, giving all praise and thanks,[h] and yielding all obedience and submission to him with the whole man;[i] being careful in all things to please him,[k] and sorrowful when in any thing he is offended;[l] and walking humbly with him.[m] [o] 1 Chron. 28:9. Deut. 26:17. Isa. 43:10. Jer. 14:22. [p] Ps. 95:6,7. Matt. 4:10. Ps. 29:2. [q] Mal. 3:16. [r] Ps. 63:6. [s] Eccl. 12:1. [t] Ps. 71:19. [v] Mal. 1:6. [w] Isa. 45:23. [x] Josh. 24:15,22. [y] Deut. 6:5. [z] Ps. 73:25. [a] Isa. 8:13. [b] Exod. 14:31. [c] Isa. 26:4. [d] Ps. 130:7. [e] Ps. 37:4. [f] Ps. 32:11. [g] Rom. 12:11 compared with Num. 25:11. [h] Phil. 4:6. [i] Jer. 7:23. James 4:7. [k] 1 John 3:22. [l] Jer. 31:18. Ps. 119:136. [m] Micah 6:8.</p></blockquote>

<blockquote><p>XIX…

I. The moral precepts are known by nature, and therefore eternal, and obligate all men: The rest are not so.

II. The moral precepts are the principal worship of God; the ceremonial and forensic are subordinate, but serve the moral precepts, and therefore yield to them.

III. The moral precepts obligate all rational creatures; the others obligate the Jews only.

IV. The ceremonial and forensic are typical; the moral are antitypical.

V. The moral are general; the ceremonial and forensic are special and determinate.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/francis-gomarus.html">Francis Gomarus</a></span><span class="wk"><span class="lbl">Work:</span> <cite>’15th of the Theological Disputations, on the Law of God’</cite>, (Leiden: Patius, 1603), trans. AI at Confessionally Reformed Theology Latin</span></figcaption>

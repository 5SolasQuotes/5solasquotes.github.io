<main class="wrap"><figure class="quote" id="q-973b10ebf3" data-kw="">
<blockquote><p>The second element of the discipline of piety I shall mention is the constant reading of God’s word in the English version. Be not startled at this statement. Are we not here, you are ready to say, for the express purpose of studying the Scriptures? Why, then, mention this particularly? I answer, that the very fact that you are here for the study of the Scriptures makes it all the more needful to exhort you to familiarity with the English version.

The grammatical and critical study of the Hebrew and Greek texts in which you are to be employed will not answer the purposes of devotion. Your want of thorough acquaintance with these languages will be a constant obstruction to the flow of feeling. Your habit of searching into the exact meaning and shade of meaning of every word—a habit to be cultivated with much diligence—will have the effect, if not counteracted by other habits, of making your acquaintance with Scripture merely scholastic in its character and limited in its range, limited to the parts of the Bible which are critically studied in the seminary course.

Hence, the importance of reading the Bible in a language with which you are so familiar that you will not have to think of the words at all. The kind of reading of which I am speaking is, in a certain sense, no doubt, superficial. Many words and even sentences will be passed over without being understood, and you will have to resist the temptation to stop and analyze. But bear in mind that you are reading now for the purpose of catching the tone and imbibing the spirit of the sacred writers, not for the purpose of ascertaining the meaning of what they say.

A child growing up in what is called “good company” hears and sees a hundred things it does not know the meaning of, but it is moulded, nevertheless, and acquires a certain tone and manner which will make people say, “This child has seen good company.” Let your familiarity with the English Bible be such as to make men say that you have been with Jesus, and have been keeping company with prophets and apostles.

Another argument for the diligent reading of the English version is, that it is the people’s Bible. Some preachers, who are scholars and learned men, are complained of by the people because they do not quote the Bible correctly. A misquotation of the common English Version impresses the hearer who is familiar with it in a manner similar to that in which a misquotation of a Greek or Latin classic impresses a scholar. It produces a jar or shock which is disagreeable, if not painful. Such misquotation is often the result of reading more in the original than in the English Version.

This was said of the great preacher, Robert Hall. Constant reading in the version which the people use will prevent this. I would earnestly recommend, also, a daily exercise of committing to memory a portion of the English Version. This will promote correct quotation, and at the same time help you to form a pure and simple English style.

The ability to recite off-hand, from memory, paragraph after paragraph of Milton or Shakespeare has been considered an enviable attainment. Why should we value less a like facility in reference to the Bible? The English Bible, considered merely as an English classic, is fully equal, to say the least, to Shakespeare or Milton. It is incomparably superior for the purposes of a minister, because, among the masses of the people, it has ten readers where any other great classic has one.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/thomas-peck.html">Thomas Peck</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Take Heed to Thyself (1889) in Miscellanies of Rev. Thomas E. Peck, D.D., LL.D., Professor of Theology in the Union Theological Seminary in Virginia</cite></span></figcaption>

<blockquote><p>‘nature’ here some understand the law of nature, according to which it would have an intrinsic evil in it, which it is plain it has not; for then neither must the Nazarites have used it (as they did), neither would it be lawful for the sake of men’s health or life. Others understand by nature the law of nations; but neither is this true, for in many nations men wear hair at the utmost length. Others understand common sense, or the light and judgment of that natural reason which since the fall is left in man; but this must be the same in all men, and we know that all men do not judge this shameful. Others therefore by nature here understand a common custom, which (as they say) makes as it were a second nature; so the term is taken, Rom. 11:24; but it cannot so signify here; for there neither is, nor ever was, such a universal custom in any place, that none in it wore long hair. Others by nature here understand natural inclination; but neither can this be the sense, for there is in some men, as well as in women, a natural propension and inclination to wear their hair at excessive lengths. Others here by nature understand the difference of the sex, as they take this word to be used, Rom. 1:26; the distinction of the sexes teaches us this: and this seems to be the most probable sense of this text. The apostle arguing, that as the male and female sex are artificially distinguished by garments, and it was the will of God they should be so, so they should also be distinguished by the wearing of their hair; and it was no less shame for a man to wear his hair like a woman, than to wear garments like a woman.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/matthew-poole.html">Matthew Poole</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Annotations on 1 Cor. 11</cite>, v. 14</span></figcaption>

<blockquote><p>Obj. 4. Further, In the Old Law God was praised with musical instruments and human song, according to Ps. 32:2, 3: “Give praise to the Lord on the harp, sing to Him with the psaltery, the instrument of ten strings. Sing to Him a new canticle.” But the Church does not make use of musical instruments, such as harps and psalteries, in the divine praises, for fear of seeming to imitate the Jews. Therefore in like manner neither should song be used in the divine praises. On the contrary, Blessed Ambrose established singing in the Church of Milan, as Augustine relates (Conf. ix.). Reply Obj. 4. As the Philosopher says (Polit. viii.), Teaching should not be accompanied with a flute or any artificial instrument such as the harp or anything else of this kind: but only with such things as make good hearers. For suchlike musical instruments move the soul to pleasure rather than create a good disposition within it. In the Old Testament instruments of this description were employed, both because the people were more coarse and carnal—so that they needed to be aroused by such instruments as also by earthly promises—and because these material instruments were figures of something else.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/thomas-aquinas.html">Thomas Aquinas</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Summa Theologiae, pt. 1</cite>, trans. Fathers of the English Dominican Province (Bellingham, WA: Logos Bible Software, 2009), 2a.2ae.91.</span></figcaption>

<blockquote><p>Answer 2. We know no necessity to have, nor any danger to want [lack] such wares as surplice, crossing, bowing to altars, to elements, which sure the apostolic Church wanted, both in specie, and in individuo.</p></blockquote>

</figure><figure class="quote" id="q-562edf6204" data-kw="">
<blockquote><p>But some schisms are of a lower nature, and consistent with true faith and love, and the grace of God in men. Such as proceed from lesser errors, mistaken zeal, weakness of grace, and remainders of corruption in such as have true faith in Christ, and love to all saints, and to all men: For alas, We know but in part [1 Cor. 13], and love but in part. Yet even these schisms are sins against God, hurtful to the Church, and provoke the Lord to correct people that are guilty of ’em more or less many ways; sometimes in their souls, by withdrawing his gracious presence, and writing bitter things against them; oft in their bodies and outward concerns, and sometimes even by shattering and destroying Churches. Therefore I am far from writing this to flatter any in their schism, or to encourage any wantonly, proudly, or carelessly to run into it, or continue in it, but carefully to avoid it; for we are to watch against all sin if we will be saved.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/francis-tallents.html">Francis Tallents</a></span><span class="wk"><span class="lbl">Work:</span> <cite>A Short History of Schism: for the Promoting of Christian Moderation &amp; the Communion of Saints (London: Parkhurst, 1705)</cite>, pp. 9-10</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/the-church/schism-and-separation.html">Schism and Separation</a></span></div>

</figure><figure class="quote" id="q-b19411a9f4" data-kw="">
<blockquote><p>That whosoever, after the sentence of deposition pronounced against them, do either exercise any part of their ministerial calling in the places they formerly served in, or do possess, meddle or intromit with the stipends or other benefits whatsoever belonging to these kirks they served, they shall be proceeded against with excommunication: And, if any suspended minister, during his suspension, either exercise any part of their ministerial calling, or intromit with the stipend, that he be deposed, and after deposition continuing in any of those faults, that eh be processed with excommunication.</p></blockquote>

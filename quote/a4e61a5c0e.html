</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-f5e879f068" data-kw="">
<blockquote><p>A conclusion certain enough: God loves himself.” p. 100 Proof: 1) A perfect being’s love seems to be a pure perfection; therefore it belongs to God and indeed in supreme degree. The proof of the antecedent is: a) If love of this sort were not a pure perfection formally, it could be reduced to one or other pure perfections that were not formally love. But I do not see how such love could be reduced to something that was [not] formally love. b) To love seems to be better than not to love; therefore love seems to be a pure perfection, because it is better than what is incompatible with it (namely not to love). The proof of the antecedent here is: a distinction must be drawn between love of friendship (benevolence) and love of concupiscence. The former is love of an object for its own sake, that is, because of the object’s intrinsic perfection, and this love does not seem to involve imperfection in the lover. Love of concupiscence is love of an object and not for the object’s sake finally but because the object perfects the lover or is a good for the lover. But this love does involve imperfection because the object is wanted precisely because it perfects a lover that is in itself capable of perfection. 2) Blessedness seems to be a pure perfection, and therefore it belongs to God in supreme degree. But love seems to be either the principal element in blessedness, or at any rate intimately connected with the blessedness of an intellectual being. That blessedness is a pure perfection is clear from the notion of it; for blessedness is nothing other than an intellectual being pleased, that follows upon possession of one’s proper perfection. But God knows himself as infinitely perfect; he seems, therefore, to be blessed; therefore blessedness seems to be a pure perfection. That this blessedness is not simply intellection, but includes an act of will or love, seems to follow from the fact that there is in God some operation besides what is formally called intellection, for God is formally willing, at least in respect of creatures. (See the next chapter [Part 3] about the proof of free volition in God.) For if God freely creates things outside himself and so has volition, it seems that he also has some act of volition, namely love, toward himself. 3) God is the first cause of all love in us. Hence he has this perfection either formally or virtually. If you concede that the love is better than not to love, God cannot have love only virtually, because the more imperfect does not include the more perfect virtually. Therefore God has love formally. As was said above about divine intellection, this divine love is not something really distinct from God’s essence. It extends, therefore, to everything that is really identified with the same essence. Hence it can be said that God loves his essence, his decrees, his knowledge, etc. This love is also eternal, unchangeable, non-contingent.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/allan-b-wolter.html">Allan B. Wolter</a></span><span class="wk"><span class="lbl">Work:</span> <cite>‘Allan Wolter’s Conclusions respecting Reality, Proving God’</cite>, (1958), ‘Proof of God’</span></figcaption>

<blockquote><p>There was a little Christian child who was asked, when she was dying, why she was so happy? ‘Because,’ she said, ‘I am going to be with Christ.’ ‘But,’ they said to her, ‘perhaps Christ will leave heaven.’ ‘Ah! Then,’ she said, ‘I will leave it, too, and go with Him.’ It is our very heaven to be with Christ; we shall see eye to eye.</p></blockquote>

</figure><figure class="quote" id="q-971cc0d92f" data-kw="">
<blockquote><p>Does it belong to the perfection of the soul that we comprehend God’s essence? Response: certainly this does not appear to be the case, and the reason is that what is incomprehensible cannot be comprehended. But, they say, even if what is infinite cannot be comprehended distinctly, nevertheless, it can be comprehended confusedly, and they called this ‘comprehension.’ Thus, that famous phrase: ‘All God is known, but not totally.’ [totum sed non totaliter; this phrase summarizes Thomas, Summa, pt. 1, q. 12, art. 7, replies to objections 2-3] And they bring up the example of an eye, which contemplates the whole man; namely, confusedly, but not totally. Response: There is no comparison between things which come within reach of eyesight and the divine nature… the divine nature is most simple; certainly the soul cannot confusedly comprehend those things which are most simple, let alone the senses, unless it comprehends them in another way than by essence; that is, by laying hold of their very essence. And thus, if God is known by us by essence, it is necessary for him to be known by us distinctly; and if he is known by us distinctly, he is indeed comprehended, which those who state that God will be seen by essence in the life to come do not wish to concede. the axiom common in the schools, “All that is received is received according to the manner of the recipient.” Now, if God’s essence will be seen, it will be seen in a finite way, for the recipient is finite: and thus, the infinite will be seen by essence in a finite way, which implies a contradiction. For finite knowledge is an image of a thing in the mind, and thus, if knowledge is finite, but the thing comprehended is infinite, on the other hand, it follows that the thing is known and not known.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/johannes-maccovius.html">Johannes Maccovius</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Other citations (work not named)</cite>, in Johannes Hoornbeek, ch. 13, §§19-20 of Institutes of Theology, tr. Charles Johnson</span></figcaption>

<blockquote><p>38. Can we say very much about heaven and the blessings of heaven? No, for this far surpasses our understanding. We know only: … b) The enjoyment of heaven is in the first place the enjoyment of God, the visio Dei, a ‘beholding of God.’ This is not to be understood one-sidedly in an intellectualistic manner but in all its magnitude. The nearness of God will affect every capacity of man, and every capacity will react to it. Theologians usually speak of visio [seeing], amor [love], gaudium [joy], gloria [glory]; others of knowing, serving, enjoying and glorifying God (cf. 1 Cor. 13:9-13). It has been asked whether this will be a seeing with physical eyes. This is not to be assumed. God is not visible to the senses. The Mediator certainly is. No one has ever seen God. This seeing follows on faith. It is thus something that is comparable with faith but that still does not necessarily need to be a perceiving with the senses. There will thus be a perception of God, yet such that it is not a material entity that appears to us. c) The enjoyment of heaven in fellowship with God is eternal life in all its fullness.</p></blockquote>

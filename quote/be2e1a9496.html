<blockquote><p>whom He did predestinate, them He also called; and whom He called, them He also justified; and whom He justified, them He also glorified.</p></blockquote>

</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-3b1cfb93cb" data-kw="">
<blockquote><p>Secondly, justification does connote a state and established condition of a man, and therefore is not frequently iterated, although it be continued. A man is not justified many times in a day, though sins be pardoned often in a day. It is true, God does continue to justify those that believe in Him, and if He should cease to do so, they would immediately fall into misery and guilt; but yet God does not renew or revive our justification, as if there were an interruption or intermission of it. That justification does denote an estate is plain by comparing it with all the other privileges God vouchsafes his people: regeneration and vocation denote a state the person is put into, so does glorification. As therefore sanctification is one thing, and those auxiliary actings of God’s grace are another thing, so that though we may say such a man has new quickening grace every day, yet we cannot say he has a new regeneration; so it is here: though we may say that every day the believer, begging the pardon of his daily infirmities, has a new pardon, yet he has not a new justification, because this denominates the state of a man. Neither can it be said that pardon of this sin or that sin puts a man into the state of God’s favor absolutely, but quoad hoc [so far as this]; the pardon of this or that sin does not make that universal righteousness of the person whereby he stands acquitted from all. It is true, some learned men call this daily remission of sin justificatio particularis [a particular justification]; but we are now treating of that universal justification whereby the person of a believer stands acquitted and disobliged from the guilt of all his sins he has committed. And great is the comfort of a Christian in that his justification is a state of favor with God; for hence flow many other inestimable benefits and advantages, which the believer is to study out and improve.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/anthony-burgess.html">Anthony Burgess</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The True Doctrine of Justification Asserted &amp; Vindicated, from the Errours of Papists, Arminians, Socinians &amp; more especially Antinomians in 30 Lectures</cite>, … (London: Underhill, 1654), pt. 2, | sermon 27, ‘That the whole nature of justification is not comprehended in remission and forgiveness of sin’, p. 268</span></figcaption>

</figure><figure class="quote" id="q-7959f57f7c" data-kw="">
<blockquote><p>Justification is an act. It is not a work, or a series of acts. It is not progressive. The weakest believer and the strongest saint are alike equally justified. Justification admits no degrees. A man is either wholly justified or wholly condemned in the sight of God.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/william-swan-plumer.html">William Swan Plumer</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Grace of Christ</cite>, p. 195</span></figcaption>

</figure><figure class="quote" id="q-50333aa4f5" data-kw="">
<blockquote><p>‘That being justified by his grace’ If we understand ‘regeneration’ in its strict and ordinary meaning, it might be thought that the apostle employs the word ‘justified’ instead of ‘regenerated;’ and this is sometimes the meaning of it, but very seldom; yet there is no necessity which constrains us to depart from its strict and more natural [forensic] signification. The design of Paul is to ascribe to the grace of God all that we are, and all that we have, so that we may not exalt ourselves proudly against others. Thus he now extols the mercy of God, by ascribing to it entirely the cause of our salvation. But because he had spoken of the vices of unbelievers, it would have been improper to leave out the grace of regeneration, which is the medicine for curing them. Still this does not prevent him from returning immediately to praise divine mercy; and he even mingles both blessings together — that our sins have been freely pardoned, and that we have been renewed so as to obey God. This, at least, is evident, that Paul maintains that “justification,” is the free gift of God; and the only question is, what he means by the word justified. The contest seems to demand that its meaning shall be extended further than to the imputation of righteousness; and in this larger sense it is seldom (as I have said) employed by Paul; yet there is nothing that hinders the meaning of it from being limited to the forgiveness of sins.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/john-calvin.html">John Calvin</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Commentary on Titus</cite>, 3, v. 7</span></figcaption>

<blockquote><p>3. To whomsoever the guilt of any particular sin is charged, he has either committed that sin or not committed it.

4. If he has committed it, he can in no other way be truly justified before God than by pleading the satisfaction of Christ, performed for him in general.

5. If he has not committed it, then his own innocence or righteousness may be pleaded for his justification; which is to be justified from his own works, or from a formal and inherent righteousness in himself, insofar as this is concerned.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/william-bradshaw.html">William Bradshaw</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Dissertation on the Doctrine of Justification</cite>, (d. 1618; Leiden, 1684), trans. ChatGPT-5, ch. 25, ‘Of Particular Justification’, pp. 117-18</span></figcaption>

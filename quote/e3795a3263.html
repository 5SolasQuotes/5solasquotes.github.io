<main class="wrap"><figure class="quote" id="q-e3795a3263" data-kw="">
<blockquote><p>Nay thou worshippest them, who makest them that they may be worshipped. But in all other senses the making a picture is not making an idol; and therefore that severe sense of the commandment, though as it is most probable it did oblige the Jews, and all persons in equal danger; yet because the reason may cease, and the danger be secured, when it is ceased, the obligation also is null; and therefore though that was in the commandment, yet it is no part of its morality; but that excepted, every other clause [of the Second Commandment] is moral and eternal.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/jeremy-taylor.html">Jeremy Taylor</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Ductor dubitantium, or, The Rule of Conscience in all her General Measures serving as a great instrument for the determination of cases of conscience</cite>, … (London, 1660), vol. 1, Of the Rule of Conscience, ch. 2, Rule 6, ‘Every thing in the Decalogue is not obligatory to Christians, is not a portion of the Moral or Natural law’ Taylor (1613–1667) was a cleric in the Church of England who achieved fame as an author during the Protectorate of Oliver Cromwell. He was Arminian in outlook., p. 342</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/worship/idolatry-and-images.html">Idolatry and Images</a></span></div>

</figure><figure class="quote" id="q-1e6551a841" data-kw="">
<blockquote><p>…the attitude of the early Fathers had been anything but friendly toward the images of art. They had rejected their use by Christians and had held a quite derogatory view of religious imagery. It was only in the age of the great Cappadocians, toward the end of the fourth century, when in religious literature and learning, too, the first phase of the fusion between Christianity and Hellenism was well-nigh completed, that religious imagery was no longer considered as idolatry by the leaders of Christian thought. But it remained for the [iconophiles in the] era of the Iconoclastic Controversy to give a thorough theoretical foundation to the distinction between idols and icons.</p></blockquote>

</figure><figure class="quote" id="q-21f55b1030" data-kw="">
<blockquote><p>Beginning in the second half of the sixth century, a slow but steady diffusion of icons of saints, of Christ, and of the Virgin is evident in the Empire… These icons do not, however, indicate the prevalence of a form of icon worship during this period, for most of them were, in fact, ‘simple commemorative and ex voto images,’ with the exception of some that were considered relics and therefore endowed with miraculous or intercessory powers. The origin of the cult of icons apparently dates to a later time, probably toward the end of the seventh century.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/juan-s-codoner.html">Juan S. Codoñer</a></span><span class="wk"><span class="lbl">Work:</span> <cite>‘Melkites &amp; Icon Worship during the Iconoclastic Period’ in Dumbarton Oaks Papers</cite>, vol. 67 (2013), pp. 135-87, p. 135</span></figcaption>

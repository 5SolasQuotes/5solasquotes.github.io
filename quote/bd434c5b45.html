<main class="wrap"><figure class="quote" id="q-bd434c5b45" data-kw="">
<blockquote><p>IN the year 1521 and the year ensuing, there arose a certain number of mutinous and seditious persons, who secretly made Factions: they chiefly dwelt in the quarters of Saxony, which bordered upon the River Salah; among whom their chief was Nicholas Stork.

They dreamed dreams, and said, That they spake familiarly with God by Visions, they preached their dreams for truths and Divine Oracles; and because that there should come a new world, wherein should dwell righteousness: Therefore they ought to exterminate all the wicked, with all the Princes and unbelieving Magistrates, from off the earth (they called all those unbelievers which were not of their Sect and Faction.)

From out of this School came Thomas Muntzer, Dr. Balthazar Hubmore, Melchior Rink, John Hutt, John Deuter, Lodovike Hetzer, &amp;c. All these boasted that they familiarly conferred with the Lord. In their teachings, they with heat of affection did defame and detract from the Ministers of the Gospel: afterward with the like violence fell upon the Magistrate, thinking that if they could make void these two Orders unto the Church, the wolves might safely fall upon and dismember the Flock; wherefore these wolves, (i. e.) these false Teachers, have always principally set themselves against the Ministers of the Church, and the Magistrates, to see if they could drive them out from the Flock, or at least disgust some of the sheep against their Pastors; that so estranging them from them, they might undo them.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/guido-de-bres.html">Guido de Brès</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The rise, spring and foundation of the Anabaptists, or re-baptized of our time</cite>, trans. Joshua Scottow (1565; Cambridge MA: Marmaduke Johnson, 1668), pp 1-2.</span></figcaption>

</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-658bc3431b" data-kw="">
<blockquote><p>Upon mature deliberation we did perceive that the wise and holy providence of God… has… disabled that [former] way of government and all that depends thereon, from affording any protection and preservation to any of the inhabitants of this land; and has enabled another form of government to afford it; Wherefore we did conclude from the light of nature, from the judgement of the learned, from the practice of Christians in former ages, from our own principles and from our former engagements that it was the will of God we should quietly and peaceably set ourselves in our places and callings to live under this government and to submit to it in such things as are imposed upon or required of us [such as the oath of Engagement] by the powers which are in actual possession, being things in themselves lawful and necessary, or expedient to the preservation of ourselves and others… Fourthly, because we clearly conceive that there is no difference at all between the submission which the authors of the Proposals themselves rightly acknowledge to be due to the powers which are in actual possession and that which is required by the subscription to this Engagement: for seeing the express words of the Engagement give no ground to interpret the act of subscription beyond that which is a clear and known duty: therefore we think it not (as to our consciences) warrantable to interpret it otherwise; but we rather think it contrary to a known duty to make of a thing in itself lawful and necessary at this time, any scrupulous interpretation beyond what the words import; or to suspend obedience from a duty upon the conjecture of something which may be thought undutiful, when that which is to our conscience a known duty is apparent: Upon which ground we declare that we trouble not ourselves, nor do we think it lawful to stagger others in their thoughts with the inferences which the proposers make upon the subscription of the Engagement with reference to these queries [of theirs]: As how far it does imply an approbation of the manner of the present establishment, whether as effected by a full and free authority yea or no? whether yea or no, it does imply an active concurrence and a ratifying consent of the people thereunto further than what has been already acknowledged to be due to the powers in actual possession by all that are in subjection under them and depend upon their protection? and whether yea or no, and how far it fastens an obligation to act to the strengthening and promoting of the government which is at present or may be hereafter established by the advantage of possible power? We say that to trouble our own or other men’s weaker consciences with these or such like doubtful conjectures to color the suspension of our own, or occasion the aversion of other men’s affections from yielding obedience to a clear and confessed duty, is not only preposterous and contrary to the aim of healing breaches, and of advancing a public good in this time of distraction, but inconsistent (as to our reason) with the obvious meaning of the words which are to be subscribed and disagreeing (as to our affections) with the charity due no less to superiors than to other men, which is not to think evil when good may be thought of them. And lastly, it is opposite (as to our spirits) unto that wisdom which is from above (the rule of our walking) teaching us to have pure and peaceable thoughts in all our actings, to perform duties in godly simplicity and without worldly wisdom, to be gentle and easily intreated, to do good works without partial scrupulosity and without hypocrisy. And upon these principles of true wisdom (which we humbly conceive are not laid to heart by our brethren in the third paragraph of their Proposals) we professedly wave all those scruples and the stumbling-blocks which they have laid to themselves and wherewith they have puzzled others, upon this clear account: that whenever the consideration of these things, which are said to be implied in the subscription (which we see not) shall come before us, to be circumstantially considered for the edification of others, or the clearing of our own way, we then shall be most ready to declare our sense therein, according to known principles and the circumstances, which God shall offer…</p></blockquote>

</figure><figure class="quote" id="q-7a04b1b8b5" data-kw="">
<blockquote><p>By the diatactic [Teaching] power a Synod may institute, restore, or change, according to the condition and exigence of the Church, the external circumstances in the worship of God, and ecclesiastical discipline: I mean those circumstances which are common both to civil and sacred societies, the conveniency whereof is determinable by the light of Nature, always observing the general rules of the Word, which commands that all be done to the glory of God, that all be done to edifying, that all be done in order and decency, that we give none offence, that we support the weak, that we give no place to the enemies of the truth, nor symbolize with idolaters, etc. Now for avoiding disorder and disconformity in a nation professing one religion, it is fit that National Synods give certain directions and rules even concerning these rites and circumstances, not having therein an arbitrary or autocratorke power, but being always tied to follow the rules foresaid.</p></blockquote>

<blockquote><p>For [God] sets before every race of mankind that which is always and universally just, as well as all righteousness; and every race knows that adultery, and fornication, and homicide, and such like, are sinful; and though they all commit such practices, yet they do not escape from the knowledge that they act unrighteously whenever they so do, with the exception of those who are possessed with an unclean spirit, and who have been debased by education, by wicked customs, and by sinful institutions, and who have lost, or rather quenched and put under, their natural ideas. For we may see that such persons are unwilling to submit to the same things which they inflict upon others, and reproach each other with hostile consciences for the acts which they perpetrate.</p></blockquote>

<blockquote><p>53. The object of ecclesiastical power is not the same with the object of the civil power, but much differing from it; for the ecclesiastical power does determine and appoint nothing concerning men’s bodies, goods, dignities, civil rights, but is employed only about the inward man, or the soul, not that it can search the hearts, or judge of the secrets of the conscience, which is in the Power of God alone: Yet notwithstanding it has for its proper object those externals which are purely spiritual, and do belong properly and most nearly to the spiritual good of the soul; Which also are termed [in Greek] the inward things of the Church.

54. Those things then wherein the ecclesiastical power is exercised, are the Preaching of the Word, the Administration of Sacraments, public Prayer and Thanksgiving, the Catechising and instructing of children and ignorant persons, the examination of those who are to come to the holy Communion, the Ecclesiastical Discipline, the Ordination of Ministers, and the abdication, deposing, and degrading of them (if they become like unsavory salt), the deciding and determining of controversies of Faith and cases of Conscience, Canonical constitutions concerning the treasury of the Church and collections of the faithful, as also concerning ecclesiastical rites, or indifferent things, which pertain to the keeping of decency and order in the Church, according to the general rules of Christian love and prudence contained in the Word of God. … 79. Seeing then there are so many and so great differences of both offices [of the Church and the magistrate], and seeing also that the function of ministers and elders of the Church is not at all contained in the office of the magistrate; neither on the other part, this is comprehended within that; magistrates shall no less sin in usurping ecclesiastical power, ministering holy things, ordaining ministers, or exercising discipline ecclesiastical, than ministers should sin in rushing into the borders of the magistrate, and in thrusting themselves into his calling. 81. So then the Word of God and the Law of Christ which by so evident difference separates and distinguishes ecclesiastical government from the civil, forbids the Christian magistrate to enter upon or usurp the ministry of the Word and sacraments,, or the juridical dispensing of the keys of the Kingdom of Heaven, to invade the Church-Government, or to challenge to himself the right of both swords, spiritual and corporal; But if any magistrate (which God forbid) should dare to arrogate to himself so much, and to enlarge his skirts so far, the Church shall then straightway be constrained to complain justly, and cry out, that though the Pope is changed, yet Popedom remains still.</p></blockquote>

<main class="wrap"><figure class="quote" id="q-9a61ae153e" data-kw="">
<blockquote><p>The heart of the Christian often for the moment spontaneously lusts for evil when the conscience promptly condemns and the will forbids and restrains and diverts the attention.

Although the man does not consent to the sin that is present in him, nevertheless the Christian feels that such movements of concupiscence are unholy, and worthy of condemnation, and he not only resists them but condemns and loathes himself because of them, and seeks to be purged Irom them at once by the atoning blood, and the sanctifying spirit of Jesus.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/a-a-hodge.html">A. A. Hodge</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Outlines of Theology</cite>, (2nd edn, New York: Robert Carter and Brothers, 1879), pp 318-19.</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/sin/concupiscence.html">Concupiscence</a></span></div>

</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-72b7111168" data-kw="">
<blockquote><p>Fifth, the last commandment of lust forbids the first motions to sin that are before consent. … Again, the philosophers knew that lust with consent was evil, even by the light of nature. But Paul, a learned Pharisee, and therefore more than a philosopher, knew not lust to be sin that is forbidden in this commandment [Rom. 7:7]. Lust therefore that is forbidden here, is without consent.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/william-perkins.html">William Perkins</a></span><span class="wk"><span class="lbl">Work:</span> <cite>An Advertisement to all Favorers of the Roman Religion</cite></span></figcaption>

</figure><figure class="quote" id="q-b2e530e092" data-kw="">
<blockquote><p>If he take vincible, as opposed to invincible ignorance, he Popishly then says that the Scripture offers to us many things whereof we may be invincibly ignorant. Now invincible ignorance, Protestants acknowledge only in matters of fact, or of gospel-truths never so much as in the letter revealed, as heathens may be invincibly ignorant of Christ, and their ignorance not be sinful, as John 15:22, and Jacob was invincibly ignorant in lying with Leah instead of Rachel. There can be no such vincibleness, or invincibleness, in an heretic that hears the Gospel, for whoever hear the Gospel and yet remain ignorant, their ignorance is not invincible, Nulla est invincibilis ignorantia juris [Nothing is invincible ignorance in law].</p></blockquote>

</figure><figure class="quote" id="q-e31e9ad7d3" data-kw="Original Sin">
<blockquote><p>Concupiscence, although it is without doubt born in us, is both an evil and sin; for we are not to judge according to nature, but according to the law whether a thing be sin or not. Whatever is opposed to the law is sin, whether it be born in us, or not.</p></blockquote>

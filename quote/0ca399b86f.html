<blockquote><p>She [the church at Philadelphia] is set in the second place after Sardis (for this is the first after Jezabel overcome) where by is shewed that her Antitype is the second reformed Church, which should arise after the Germane, and this is the Church of the Helvetians, Suevia [Swabia], Geneva, France, Holland Scotland. I join all these into one, because they live almost after one and the same kind of laws and ordinances, as touching the things that are of any moment. Neither doth the distance of place break of that society which the conjunction of minds and will doth couple.

Yea this dispersion doth agree chiefly to the Philadelphians, whom we have shewed to dwell thicker and more frequent in the fields then in the city. Whereby it cometh to pass that this thins [sic] of the citizens taketh up much place, though the citizens are not so many. We shall find that this Church which I speak of arose a little while after the German; when Ulricus Zwinglius began to teach at Tigur in Helvetia, in the year 1519, and the reformation was begun the fourth year after, to wit, in the year 1523, at which time no Papist durst enter into combat against Zwinglius, who did defer the judgment of all controversies to the arbitrement of the sacred scriptures. They of Constance, Basil, Strasbourg, Geneva and others, followed their steps. …

In the Antitype, a divine power specially shineth forth sanctifying the Church, by kindling the desyre of godlines, and in making it in Christ Iesus fit and cheerfull to every good worke. Let my words be without envy, the true doctrine soundeth no where purer, the worship lesse corrupted, more flourisheth the faithfull diligence of the Pastors, is performed more willing obedience of the peo∣ple, nor greater reverence of all religion among all degrees. …

Neither doth she keep only the doctrine of salvation uncorrupt, but also she both delivereth and teacheth in writings and exerciseth in practise a sincere manner of administring, wherby salvation is bestowed. Certainly the whole will of God is communicated with his saints, so as Christ taketh to himself not undeservedly this praise of true in governing this Church: He doth also perform plenteously that which he promised, that he would keep safe and sound those that seek him with an upright heart.

What have not endevoured the French man, the Spaniard, the Savoyan, the Pope, to root out them of Geneva, a small people, and environed on every side with enemies, and shut up from all aid of friends? Nevertheless it flourisheth yet still thanks be to God, and shall flourish hereafter, while all her adversaries burst with envy: as long as she shall continue in this holy order. The French Church hath been preserved hitherto, no other wise then the three children in the furnace.

Who would have believed that the Low Countries had been able to resist and withstand the raging Philip, the cruel Duke d’Alve, and so many bloody Tyrants? But true is he, who hath promised this honour to his saints, that they should bind the Kings with chains, and their nobles with fetters of iron, Psalm 149.8.9. And that I may not speake of every each one, they can be safe only by thy protection, o most high God, who art constant in all thy promises, whom both enemies almost infinite do persecute with deadly hatred, and also to whom many of their freinds through envy wish not very well.</p></blockquote>

<blockquote><p>Secondly; a mournful sense of Afflictions sent from God is consistent with a dutiful resignation of our selves to his Will. ‘Twas the vain boast of the Philosophers, that their Instructions would fortify Men with such magnanimous Principles, and generous Spirits, as with an equal calm tranquillity of Mind to encounter all the fierce and sorrowful Accidents to which they might be exposed here: They speak high against Fortune and Fate, and resolve stubbornly, that no misery, whether Poverty or Disgrace, Torments or Death, should extort from them a confession that it was Misery. ‘Twas one of their Axioms, That a Wise Man is not subject to the vicissitudes and instability of things here below; That he suffers no conflict of contrary Passions in his Breast; that he is always above in the Serene, where no Tempests can disturb, no Eclipse can darken his Mind: But these proud pretensions were empty of reality.

Indeed such a perfect exemption from all afflicting Passions is neither possible nor regular in our present state: not possible, for the best Men are not all Spirit, but united to Flesh; and when the Body is under strong pains, the Soul suffers in its sufferings; and while we are thus compounded, the loss of those Comforts that support and sweeten the present Life, must cause Grief. ‘Tis easy to utter brave Expressions, and lay down severe Precepts in contempt of Evils when they are at a distance, but hard to sustain the Spirit under the actual feeling of them; ’tis one thing to discourse of a Battle, and another to be engaged in the heat of it. But supposing by a Philosophical Charm the Heart were so hardened as to be proof against the most piercing afflictions, such a forced insensibility is not regular, but proceeds from the extinction of Humanity and Piety, and that will appear by considering Afflictions in a natural or moral respect.

First, in a natural respect, for so they are destructive or oppressive Evils, and a pensive feeling of them is suitable to the Law of our Creation: for the Human Nature is framed with such Senses and Passions, as according to God’s intention should be affected suitably to the quality of their objects; and if the Soul acts rationally, ’tis moved accordingly. A Saint on Earth is not a Saint in Heaven, raised above all Disasters and Troubles, freed from all hurtful impressions from without, and sorrowful impressions within, but is liable to afflicting evils: And it is becoming his Duty to have his passions pliable to his condition, but without excess; the Eyes must not be drowned, nor dry, but tenderly affected.

Secondly; Considered in a moral respect, as they are sent from the high and just Providence of God, it is absolutely necessary there should be an humble resentment of his Displeasure. This is a consequent of the former; for if our affections are seared up, that we do not feel the stroke, how shall we regard the hand that smites us? If we are not sensible of Affliction, we are secure in our Sins. Natural Sorrow is introductive of Godly Sorrow. There are two extremes to be avoided by the afflicted, according to the direction of Solomon in the person of Wisdom, and repeated by the Apostle: My Son, despise not thou the chastening of the Lord, nor faint when thou art rebuked of him.

Some are discouraged and over-born by Afflictions as insupportable: others are stubborn and careless, and never lay them to heart: they never look upward to the original efficient Cause, an Offended God; nor inward to the impulsive deserving Cause, their Sins; but esteem them fortuitous Events that happen in this mutable state, without a design to correct and reform Sinners; or to proceed from a blind necessity, things of course; or merely regard the second Causes and Instruments of their Troubles: accordingly, when they meet with Calamities, all their care is by a perverse shift to seek for relief only in Temporal Comforts; without serious applying themselves to God, whose end in sending Troubles, is to reclaim us from Sin to Holiness, from Earth to Heavens, from the Creatures to himself.

This secret Atheism, like a benumbing Opium, stupefies the Conscience; and the insensibility of God’s hand inflicting Evils, is as different from Christian Patience and Constancy, as a mortal Lethargy is from the quiet, soft Sleep of Health: Nothing kindles his Anger more than neglecting it; ’tis equally provoking with the despising of his Love: It is a symptom of a wretched state of Soul; if there proceed no sighs and groans, no signs of grief from the sense of God’s displeasure, it is a sad evidence there is no Spiritual Life. Indolence under the effects of God’s Anger, is like the stillness of the Dead Sea, whose Calm is a Curse. The Jews, though intitled the People of God, are deeply charged for this prodigious Madness; O Lord, thou hast struck them, but they have not grieved; thou hast consumed them, but they refused to receive correction: they have made their faces harder than a Rock, they have refused to return. Jer. 5. 3.

We have whole Quarries of such obdurate Wretches amongst us; this impenitent disregard of God’s hand is a dreadful presage of future and more heavy Judgments. Who ever hardened himself against the Lord, and prospered? Do we provoke the Lord to Jealousy, are we stronger than he? The most refractory Sinner he can compel to acknowledge with bitter lamentations his Wickedness, and weakness, how unable he is to contend with his Judge. But supposing a respite from Punishment here, there is an Hell prepared for stubborn Sinners, where is Weeping and Wailing for ever. Whom the Rods do not awaken, the Scorpions shall.</p></blockquote>

<blockquote><p>I am mute; I do not open my mouth, for it is you who have done it.” (Psalm 39:9)

First, There is a stoical silence. The stoics of old thought it altogether below a man that hath reason or understanding either to rejoice in any good, or to mourn for any evil; but this stoical silence is such a sinful insensibleness as is very provoking to a holy God, Isa. xxvi. 10, 11. God will make the most insensible sinner sensible either of his hand here, or of his wrath in hell. It is a heathenish and a horrid sin to be without natural affections, Rom. i. 31. And of this sin Quintus Fabius Maximus seems to be foully guilty, who, when he heard that his mother and wife, whom he dearly loved, were slain by the fall of an house, and that his younger son, a brave, hopeful young man, died at the same time in Umbria, he never changed his countenance, but went on with the affairs of the commonwealth as if no such calamity had befallen him. This carriage of his spoke out more stupidity than patience, Job xxxvi. 13.

And so Harpalus was not at all appalled when he saw two of his sons laid ready dressed in a charger, when Astyages had bid him to supper. This was a sottish insensibleness. Certainly if the loss of a child in the house be no more to thee than the loss of a chick in the yard, thy heart is base and sordid, and thou mayest well expect some sore awakening judgment. This age is full of such monsters, who think it below the greatness and magnanimity of their spirits to be moved, affected, or afflicted with any afflictions that befall them. I know none so ripe and ready for hell as these.

Aristotle speaks of fishes, that though they have spears thrust into their sides, yet they awake not. God thrusts many a sharp spear through many a sinner’s heart, and yet he feels nothing, he complains of nothing. These men’s souls will bleed to death. Seneca, Epist. x., reports of Senecio Cornelius, who minded his body more than his soul, and his money more than heaven ; when he had all the day long waited on his dying friend, and his friend was dead, he returns to his house, sups merrily, comforts himself quickly, goes to bed cheerfully. His sorrows were ended, and the time of his mourning expired before his deceased friend was interred. Such stupidity is a curse that many a man lies under. But this stoical silence, which is but a sinful sullenness, is not the silence here meant.</p></blockquote>

</figure><figure class="quote" id="q-726573c8f3" data-kw="">
<blockquote><p>In order that we may arrive at even the most faint and remote conception of the indescribable sorrow and heaviness of the Saviour, it is necessary for us to have our mind impressed with the doctrine of Scripture regarding the constitution of his person. We are too apt ignorantly to conclude, that to him in whom dwelt all the fulness of the godhead bodily, nothing could be a difficulty, nothing could cost a struggle — that his omnipotence must have borne him onward above the power of pain, and grief, and distress — and that, if his apparent sufferings were not altogether unreal, they must to him at least have been trifling and contemptible.

Now, it is to be remembered that, while he was truly God, co-eternal and co-essential with the father, he was at the same time complete and perfect man, possessed of a true body and a reasonable soul — a soul of the most exquisite sensibility, and susceptible of the most painful impressions from every form of evil. The union of the two natures in his one person was without confusion of their properties.

Notwithstanding the union, the natures remained distinct, and their operations distinct. Neither his original dignity as the Son of God, nor the union of the Divine nature with the human, nor the sacred distinction attending his birth, furnished the slightest ground to doubt his absolute participation of our nature and actual communion with us in all our sufferings. In the body, he was liable to hunger, and thirst, and weariness, as much as any of us. He was capable of being bruised with stripes, torn with scourges, pricked with thorns, pierced with nails, transfixed with a spear.

So also his soul was endued with the same faculties and affections as ours. He was moved with pity and compassion. He was stung with reproach and ingratitude. He was susceptible of affliction, and disturbance, and agony. He was devoid of no property that belongs to us. He was free only from the contamination that adheres to our corrupted nature. Such was the depth of humiliation, such the capacity of suffering, to which he stooped who was the Lord of nature and fountain of life, the eternal partaker of the Father’s happiness, the brightness of his glory the express image of his person.</p></blockquote>

<blockquote><p>Suffering especially tests and strengthens hope. Paul teaches that discovering God’s help increases our hope (Rom. 5:5). Because God enables us to experience his goodness, power, and faithfulness when we are in need, because he strengthens us against every temptation and safeguards us against every attack, and because he delivers us from all our fears, he in all these ways so establishes and guarantees in us the truth of his promises that whoever calls on him will be saved and whoever trusts in him will never be put to shame. …

By means of trials God puts our obedience to the test. When all goes well according to the flesh, it is not difficult for us to yield to his will and to recognize his goodness and love towards us. But when he visits us with sickness, poverty, reproach, or some other misery, it is then true obedience to feel that he loves us, to embrace his divine guidance, and to submit to his will. …

How shabbily we treat this one, true, and heavenly Father when in days of oppression we fail to hallow his name, to conform our will to his, and to confess that all things proceed from his goodness and love – all of which serves his praise as well as our salvation.

So we see how in the school of we learn what it actually means to be obedient to God. We need this education. For as Jesus Christ, even though he was God’s Son, nevertheless “learned obedience from what he suffered” (Heb. 5:8), how much more necessary it is for us in days of persecution to learn to submit our heads and our hearts to God’s leading.</p></blockquote>

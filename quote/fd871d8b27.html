<blockquote><p>2nd Use. If we pray God to deliver us from evil, then we must beware of all satanical practises as means of help in any distress; this is gross hypocrisy to pray against the evils of Satan and to give ourselves to the practise of them. Herein many offend, for the Papists say this prayer, but yet their religion in many things is a gross practice of magic and sorcery; for first: the consecration of their host in the mass is plain conjuration: and so are their exorcisms in halowing salt, bread, and water, their casting out of devils by certain words, by the sign of the cross, the application of relics and such like: nay, come to ourselues, what is more common among us than to use charmes and amuletts, to seek to witches and sorcerers when any strange affliction does befall us? And the setting of a figure, though it be not gross magic, yet therein is a close and privy work of the devil, his hand is deep therein: and the Church in former times has condemned it for witchcraft: for charms, characters and amulets be but the devil’s watchword and sacraments to set him a working: what though the words used be good, yet therein is Satan’s deeper policy, who turns himself into an angel of light, under fair shows working the greater mischeif. But what horrible impiety is this, that when God gives us occasion to come unto Him, we leave Him and run for help to his professed enemies.</p></blockquote>

<blockquote><p>The fifth and last [unlawful] remedy is exorcism, which is an adjuring and commanding the devil in the name of God to depart from the possessed party and to cease to molest him anymore. This means was used by our Savior Christ Himself, and after Him by His apostles and other believers in the time of the primitive church when the gift of working miracles was in force. But in these days (as I said before) that gift is ceased, and also the promise of power annexed to the use of adjuration, and therefore the means thereof must needs cease. And for an ordinary man now to command the devil in such sort is mere presumption and a practice of sorcery.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/william-perkins.html">William Perkins</a></span><span class="wk"><span class="lbl">Work:</span> <cite>A Discourse of the Damned Art of Witchcraft… (Cambridge, 1610), ch. 7, ‘The application of the doctrine of witchcraft to our times’, section 3, question 3, ‘Whether a man may prevent the danger of witchcraft, and if he may, then what remedies he may lawfully and effectually use against it?’</cite>, pp. 245-46</span></figcaption>

ener" target="_blank">Read it online · Reformed Books Online</a></div>

<blockquote><p>Until the day Dr. Peck first met the young woman called Jersey, he did not believe in the devil. In fact, as a mature, highly experienced psychiatrist, he expected that this case would resolve his ongoing effort to prove to himself, as scientifically as possible, that there were absolutely no grounds for such beliefs. Yet what he discovered could not be explained away simply as madness or by any standard clinical diagnosis… …he recounts his journey from skepticism to eventual acknowledgment of the reality of an evil spirit, even at the risk of being shunned by the medical establishment.</p></blockquote>

<blockquote><p>(3) The next step [in the Roman heirarchy of offices] is that of Exorcists, whose pretended office is to cast out devils, in a feigned imitation of the miraculous operations of the first ages of Christianity. These sacred conjurers, who take upon them to dispossess devils, are inferior to the very deacons that serve tables [in Romanism], and yet equal to the very apostles, were they able to perform what they undertake. Though one would wonder why the bishops [of Romanism], the pretended successors of the apostles, did not reserve to themselves the power of casting out unclean spirits, as well as that of conferring the Holy Spirit, which, as they say, none but themselves can do. But these exorcists are men of that extraordinary power that they out-do the very apostles, for they did not cast out devils by laying on of hands, as these pretend to do. The bishop tells them that they are spirituales imperatores ad abjiciendos daemones de corporibus obsessis — i.e. they are spiritual governors to cast out devils, etc. to which purpose he gives them power of laying hands super energumenos sive baptizatos sive catechumenos (Pontif. de Ord. Exorc.)….</p></blockquote>

ext%20step%20%5Bin%20the,sive%20catechumenos%20%28Pontif.%20de%20Ord.%20Exorc&amp;text=3%29%20The%20next%20step%20%5Bin%20the%20Roman%20heirarchy&amp;text=sive%20baptizatos%20sive%20catechumenos%20%28Pontif.%20de%20Ord.%20Exorc" rel="noopener" target="_blank">Read it online · Reformed Books Online</a></div>
</figure><figure class="quote" id="q-e977de2a40" data-kw="">
<blockquote><p>In MPD [or Dissociative Identity Disorder], we have a phenomenon that was traditionally categorized as demonic possession. Accordingly, people exhibiting the behavior now associated with MPD described it, not as a fragmentation of a single mind into multiple ones, but as the entrance from without of a distinct and alien mind… Many well-known cases of alleged MPD–such as that of ‘Sybil,’ made famous in the film of that title–have been shown to have been exaggerations or even hoaxes. ‘Sybil’ herself has admitted that her ‘disorder’ was more or less her own invention, that she was coxed into believing that she had multiple personalities by therapists eager to prove that MPD was real, and that under their encouragement and in an emotionally fragile state she had manufactured and acted out various ‘personalities’ to confirm their diagnosis. Many other MPD patients, emotionally disturbed people to start with, acknowledge that they see themselves less as literally ‘fragmenting’ into different personalities than as fantasizing and acting out different roles–again, often under the influence of overzealous therapists. The behavior of ‘split-brain’ patients is no less subject to interpretation, interpretation that can reflect the enthusiastic theorizing of the researcher as much as the objective facts. To begin with, the two hemispheres of the brains of such patients are not completely disconnected–there are other connections between the halves that remain undisturbed, and thus there are no grounds for insisting that the halves must be associated with different ‘minds’. Furthermore, under ordinary conditions, such patients behave more or less normally, or at least no in any way that suggests that more than a single mind occupies their bodies. It is only in contrived experimental contexts that they can be made to exhibit remarkable behavior, and even then that behavior is by no means obviously best interpreted as involving a ‘division’ of the mind. Many researchers hold instead that such behavior, when examined carefully, amounts to little more than a variation on the awkwardness, failure of co-ordination, or general cognitive malfunctioning that can result from any serious injury to brain…</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/edward-feser.html">Edward Feser</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Philosophy of Mind (Oneworld, 2006)</cite>, pp. 27-8</span></figcaption>

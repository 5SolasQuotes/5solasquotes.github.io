<blockquote><p>Q. After the Ministry of the Word; what other part of God’s Worship is next to be Administered?

A. After the Word, which is the Covenant of God, the Seals of the Covenant are next to be administered; &amp; as for Baptism, it is to be dispensed by a Minister of the Gospel, unto a Believer professing his Repentance and his Faith, being a Member of the same Church-Body, and likewise to his Seed, presented by the Parent, unto the Lord and his Church.

At which time the Minister in God’s room calleth upon the Parent, to Renew his Covenant with God, for himself and his Seed, and calleth upon God as the nature of the Ordinance requireth, for the pardon of Original Sin, and the Sin of the Parent, and likewise for a Blessing upon the Sacrament, and the Infant, and then calling the Child by that name the Parents hath given it, for their own Edification and the Childs; he baptizeth it, whether by dipping or sprinkling, in the Name of the Father, and of the Son, and of the Holy Ghost, Acts 8.38 Acts 16.31, 32, 36, 37, 38 1 Cor 10.16, 17 Acts 16.14, 15 1 Cor 7.14. Mat 3.11 1 Tim. 4.5 Luke 1.63 Mat 28.19.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/john-cotton.html">John Cotton</a></span><span class="wk"><span class="lbl">Work:</span> <cite>A treatise I. Of faith. II. Twelve fundamental articles of Christian religion. III. A doctrinal conclusion. IV. Questions and answers upon church-government. Taken from written copies long since delivered by the late Reverend Mr. John Cotton, teacher of the First Church in Boston, in New-England</cite>, (Boston, 1713), pp 26-27.</span></figcaption>

</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-c0133e5e55" data-kw="">
<blockquote><p>They went down into the water. Here we see the rite used among the men of old time in baptism; for they put all the body into the water. Now the use is this, that the minister doth only sprinkle the body or the head. But we ought not to stand so much about such a small difference of a ceremony, that we should therefore divide the Church, or trouble the same with brawls. We ought rather to fight even an hundred times to death for the ceremony itself of baptism, inasmuch as it was delivered us by Christ that we should suffer the same to be taken from us.

But forasmuch as we have as well a testimony of our washing, as of newness of life, in the figure of water; forasmuch as Christ representeth unto us his blood in the water as in a glass, that we may get our cleanness thence; forasmuch as he teacheth that we are fashioned again by his Spirit, that being dead to sin, we may live to righteousness; it is certain that we want nothing which maketh to the substance of baptism.

Wherefore the Church did grant liberty to herself, since the beginning, to change the rites somewhat, excepting this substance. For some dipped them thrice, some but once. Wherefore there is no case why we should be so straitlaced in matters which are of no such weight; so that external pomp do no whit pollute the simple institution of Christ.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/john-calvin.html">John Calvin</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Commentary on the Acts of the Apostles</cite>, ed. Henry Beveridge, trans. Christopher Fetherstone (1560; London, 1585) in Calvin’s Commentaries (22 vols, Grand Rapids: Baker, 1993), 18a: 364-65.</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/baptism.html">Baptism</a></span></div>

</figure><figure class="quote" id="q-6c2ab75214" data-kw="">
<blockquote><p>Now concerning baptism, baptize as follows: after you have reviewed all these things, baptize in the name of the Father and of the Son and of the Holy Spirit in running water. But if you have no running water, then baptize in some other water; and if you are not able to baptize in cold water, then do so in warm. But if you have neither, then pour water on the head three times in the name of the Father and Son and Holy Spirit. And before the baptism let the one baptizing and the who is to be baptized fast, as well as any others who are able. Also, you must instruct the one who is to be baptized to fast for one or two days beforehand.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/the-didache.html">The Didache</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Other citations (work not named)</cite>, ch. 7 (early 2nd century) trans. Michael W. Holmes, The Apostolic Fathers: Greek Texts and English Translations, 3rd edn (Grand Rapids: Baker, 2007).</span></figcaption>

<blockquote><p>8 Neither is the water turned into the blood or spirit of Christ, neither is the blood of Christ present in the water or in the same place with the water, neither are the bodies of such as are baptized sprinkled invisibly therewithal, neither is the holy Ghost in substance or vertue more in this water then elsewhere; but in the lawful use of baptism he worketh in their hearts which are baptised, and spiritually doth wash and sprinkle them with the blood of Christ, and useth this external sign as an instrument, &amp; as a visible word &amp; promise, to uphold &amp; stir up the faith of such as are baptised.

9 Therefore when baptism is said to be the washing of regeneration, or to save us, or to wash away our sins; it is meant; that external baptism is a sign of the internal baptism, that is, of regeneration; salvation, and spiritual washing &amp; that this internal washing is joined with the external, whensoever baptism is lawfully used.</p></blockquote>

<main class="wrap"><figure class="quote" id="q-1680b0c3a7" data-kw="">
<blockquote><p>But though you have not been able to distinguish betwixt an adversary to your way, and an adversary to your person, but have thought every blow that was given to your error, was a mortal wound to your dear self, yet many others can, and do. If in exposing your errors, your reputation be exposed, you must blame them for occasioning it, and not us. It gives no pleasure that I and others have bestowed upon you labor in vain…</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/james-robe.html">James Robe</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Mr. Robe’s Fourth Letter to Mr</cite>, [James] Fisher… (Edinburgh: Fleming, 1743), p. 1</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/the-church/church-unity-and-fundamentals.html">Church Unity and Fundamentals</a></span></div>

</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-9c97dd5e3d" data-kw="">
<blockquote><p>1. That the [term] division which is intended here [in this chapter] is not every contest and alienation of mind, and difference of practice incident to men, but that which is proper to the church concerning church affairs, and so is to be distinguished from civil debates and contentions. We would advert also that there may be church differences that fall not under the charge of scandal, as when in some things men of conscience are of different judgments, yet carry it without any offense or breach of charity, or when in some practices there is diversity with forbearance, as was in Polycarp’s days, and the time of Irenaeus (about Easter matters)…</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/james-durham.html">James Durham</a></span><span class="wk"><span class="lbl">Work:</span> <cite>A Treatise Concerning Scandal</cite>, (Naphtali Press, 1990), pt. 4, ch. 1, ‘How Heresy, Schism &amp; Division Differ’</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/the-church/church-unity-and-fundamentals.html">Church Unity and Fundamentals</a></span></div>

</figure><figure class="quote" id="q-4fd8fffa64" data-kw="">
<blockquote><p>Comprehended in the salutation or apostolic benediction: Because Paul, the author of this epistle, would not that the dignity of the Church of Corinth should in any ways be eclipsed (although he knew there were most corrupt persons among them, not only which lay hid, but openly showed themselves enemies to the apostle), but constantly accounted the Church at Corinth a true Church, to which, by his authority, he applied the benediction of the Gospel, and doubted not to wish them all good things.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/david-dickson.html">David Dickson</a></span><span class="wk"><span class="lbl">Work:</span> <cite>An exposition of all St. Pauls epistles, together with an explanation of those other epistles of the apostles, St. James, Peter, John &amp; Jude</cite>, ... (London: R.I., 1659) | on 2 Cor., 1:2</span></figcaption>

<blockquote><p>2. Such a Baptism that is valid, as touching the substance of the seal, as is in Rome: such a Church according to the metaphysic entity and being of a Church, is Rome a Ministerial Church, teaching necessary fundamentals, though darkening and contradicting all; but it is not morally a true Church, but leprous and unclean. See what Junius, Whitaker, Calvin and Rivetus say hereupon…</p></blockquote>

</figure><figure class="quote" id="q-957762d948" data-kw="">
<blockquote><p>The Reformed orthodox generally also note… three kinds of doctrinal error: 1. errors against a fundamental article… 2. errors around a fundamental or in indirect contradiction to it… 3. errors beyond a fundamental article (praeter fundamentum)… The third category of error does not address fundamental articles directly or indirectly but rather involves faith in problematic and curious questions… that do not arise out of the revealed Word–hay and stubble!–and that, because of their curiosity and vanity, constitute diversions from and impediments to salvation. (Rijssen, Summa, I.xiii; cf. Turretin, Inst. theol., I.xiv.9)” – Muller, PRRD (2003) 1.422-23 Hottinger, Johann Heinrich – The 8th Theological Disputation of the Gymnasium: Of the Use &amp; Abuse of the Distinction of [Theological] Places into Fundamental &amp; Non-Fundamental (Zurich, 1664) Cocceius, Johannes – ch. 7. ‘Of that which is Fundamental’ in A Sum of Theology Rehearsed out of the Scriptures (Geneva, 1665), pp. 90-97 Velthuysen, Lambert – 3. ‘Of Principles from the First Rising, or Fundamental Articles &amp; Errors’ in Theology (Fribourg, 1666), pp. 8-11 Velthuysen (1623-1685) Burman, Francis – Ch. 3. ‘Of the Foundation &amp; Fundamental Articles’ in A Synopsis of Theology… (Utrecht, 1671), vol. 2, Locus 41, ‘Of Revelation &amp; the Word under the Economy of the New Covenant’, pp. 308-317 Burman (1628-79) Pauli, Reinhold – A Compendium of Theological Disputations… Ch. 1, On the Fundamental of the Faith (Marburg 1672) Pauli (1638-1682) was a German reformed professor of theology at Marburg. Heidegger, Johann Heinrich – A Dissertation on the Foundation of Salvation, whereby the Whole Subject of Fundamental &amp; Non-Fundamental Articles &amp; Errors is Struck (Zurich, 1676) Rissen, Leonard – Locus 1, ‘Of Theology’, Controversy 3, sections 12-13, pp. 13-14 in A Sum of Didactic &amp; Elenctic Theology, out of Our Theologians, especially out of Francis Turretin’s Institutes of Theology... (Bern, 1676; 1690) Here is an introduction to the life of Rissen (1636-1700). Amongst other things, Rissen notes that Socinians and Arminians err in fundamentals by defect, and Papists and Lutherans err in excess. “We maintain the middle.</p></blockquote>

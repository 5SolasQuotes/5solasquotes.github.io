<main class="wrap"><figure class="quote" id="q-e661f7cd8d" data-kw="">
<blockquote><p>2. This [God’s injunction to obey civil magistrates] condemns the clergy of Rome, that exempt themselves from all princes’ authority, whereas God has said, ‘Let every soul be subject to the higher powers’ [Rom. 13:1]: If they have souls they must be subject. But how do they exempt themselves? … 2. By the Donation of Constantine; but its not in the power of princes so to do: They [princes] may exempt them [clergy] from tribute [taxes], if they will, as Pharoah took not the priests’ lands to gage for Corn; but to exempt them from subjection: they cannot. This were to make themselves wiser then God, who has put them under their authority, yea, the too much indulgence and favor of emperors, has been the bane of the Church, and helped up the Pope into his stirrup; Therefore its wisdom in them to hold their authority which God has given them.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/john-rogers.html">John Rogers</a></span><span class="wk"><span class="lbl">Work:</span> <cite>A Godly and Fruitful Exposition upon all the First Epistle of Peter</cite>, (d. 1636; 1650) | On 1 Pet. 2:13, pp. 318-19</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/civil-government-and-society/resistance-to-tyranny-and-lawful-authority.html">Resistance to Tyranny and Lawful Authority</a></span></div>

<blockquote><p>And these were the Halcionian days which Ambrose himself declares and magnifies, even when Maximus had suppressed the Arrians, En tempus acceptabile! quo non hiemalibus perfidiae caligantis pruinas annus riget, nec altis nivis, etc. ibid. Reader was not that time more strange than ours? that Ambrose must be so loyal as to save his prince and country from a usurper; and yet so pious as to be persecuted by his prince, and he and his brethren saved by that same usurper, and openly give praise to God for the great felicity of the Church which it received by that same usurper whom he so resisted?</p></blockquote>

<blockquote><p>45. A man is said to be a partaker of another’s sin in nine ways, indicated by the following: Command, counsel, consent, flattery [or coaxing], retreat, participating, nodding [or faltering], not opposing, not making public [or not revealing]. [Jussio, consilium, consensus, palpo, recursus, participans, nutans, non obstans, non manifestans.] Or, in sum, consent is given to sinners by counseling, defending, helping, permitting what we might hinder, and being silent when we might profitably speak, Rom. 1:32.</p></blockquote>

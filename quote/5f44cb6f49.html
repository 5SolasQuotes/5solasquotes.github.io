<main class="wrap"><figure class="quote" id="q-5f44cb6f49" data-kw="">
<blockquote><p>The woman being created was brought to man and given unto him by God, and he took her, with her consent, as flesh of his flesh, and bone of his bone; and they twain became one flesh. And God commanded this order to be observed unto the end of the world. This was the first institution of this sacred society: So that the first and principal efficient of marriage, was God instituting it; the subordinate, is the mutual consent of the parties. For marriage is a contract, or covenant: This is the general nature of it; and as the matter is one man, and one woman, free from all former obligation that may hinder it, so the form, and chief essence is in the special nature of the contract, whereby they mutually bind themselves one unto another so as to become one flesh for term of life of both the parties. The end is propagation mutual help and comfort, and upon the Fall, per accidens, the avoiding of fornication.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/george-lawson.html">George Lawson</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Theo-Politica, or, A Body of Divinity Containing the Rules of the Special Government of God</cite>, ... (London: Streater, 1659), ch. 8, 7th Commandment, p. 205</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/civil-government-and-society/marriage-and-family.html">Marriage and Family</a></span></div>

</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-b2d8991f58" data-kw="">
<blockquote><p>Here, however, where God compares polygamy with divorce, he says that polygamy is the worse and more detestable crime; for the husband impurely connects himself with another woman, and then, not only deals unfaithfully with his wife to whom he is bound, but also forcibly detains her: thus his crime is doubled. For if he replies and says that he keeps the wife to whom he is bound, he is yet an adulterer as to the second wife: thus he blends, as they say, holy with profane things; and then to adultery and lasciviousness he adds cruelty, for he holds under his authority a miserable woman, who would prefer death to such a condition; for we know what power jealousy has over women. And when any one introduces a harlot, how can a lawful wife bear such an indignity without being miserably tormented?</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/john-calvin.html">John Calvin</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Commentary on Malachi</cite>, 2:16</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/civil-government-and-society/marriage-and-family.html">Marriage and Family</a></span></div>

</figure><figure class="quote" id="q-24dd033885" data-kw="">
<blockquote><p>Obiection II. There was blood and things strangled forbidden in the council at Jerusalem after Christ’s ascension, Acts 15. Answer. It was forbidden only in regard of offence and for a time, so long as the weak Jew remained weak, not in regard of conscience. And therefore afterward Paul says that all things, even blood itself was lawful, though not expedient, in regard of scandal (1 Cor. 6:12). And to the pure all things are pure (Titus 1:15).</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/william-perkins.html">William Perkins</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Whole Treatise of the Cases of Conscience</cite>, (1606), p. 541</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/civil-government-and-society/marriage-and-family.html">Marriage and Family</a></span></div>

</figure><figure class="quote" id="q-1d8c041065" data-kw="">
<blockquote><p>Some have upon these words made a question whether it be lawful for the husband or the wife separated for adultery to marry again while each other lives. As to the party offending, it may be a question; but as to the innocent person offended, it is no question, for the adultery of the person offending has dissolved the knot of marriage by the Divine law. It is true that the knot cannot be dissolved without the freedom of both persons each from another, but yet it seemeth against reason that both persons should have the like liberty to a second marriage. For:

1. The adulteress is by God’s law a dead woman, and so in no capacity to a second marriage.

2. It is unreasonable that she should make an advantage of her own sin and error.

3. This might be the occasion of adultery, to give a wicked person a legal liberty to satisfy an extravagant lust. But for the innocent person, it is as unreasonable that he or she should be punished for the sin of another.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/matthew-poole.html">Matthew Poole</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Annotations on 1 Cor. 11</cite>, ch. 19, v. 9</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/civil-government-and-society/marriage-and-family.html">Marriage and Family</a></span></div>

</figure><figure class="quote" id="q-5aa04506f5" data-kw="">
<blockquote><p>But those [leading presbyterian and congregationalist ministers] that were called by the king, and one another, 1660 and 1661, to treat of concord, and that assembled at Sion College, and elsewhere about it, did openly make known their minds: And I think they meddled not against any of these things following, by any accusation of them as sinful: … XIX. We never thought that things indifferent do become unlawful to us because the magistrate commands them.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/richard-baxter.html">Richard Baxter</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The English Nonconformity as under King Charles II &amp; King James II Truly Stated &amp; Argued</cite>, (1683; London: Parkhurst, 1689), pp. 11-13</span></figcaption>

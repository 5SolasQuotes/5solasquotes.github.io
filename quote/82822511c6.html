<main class="wrap"><figure class="quote" id="q-82822511c6" data-kw="">
<blockquote><p>God’s moral government of the universe of intelligent beings, is his chief glory. But Jesus Christ, and he crucified, or, Jesus Christ in the accomplishment of the work of redemption, is the bright sun, which throws light, and warmth, and beauty, over this whole moral system. In this work, angels are ministering spirits; and every high archangel, and seraphim, and cherubim, will sing a louder song, and shout with more transporting joy, when all its grand purposes are fulfilled, than when they heard the potent word of God bidding creation into beautiful existence. This is the golden chain which will for ever bind in happy union to one another, and in higher and holier adoration to God, all the pure and immortal spirits of his great kingdom.

Oh! what a work is this! Ye angels! swell your notes, and let the universe hear of its glory—let heaven re-echo His praise. It is the new creation, and in comparison with it, the former shall be remembered no more, nor come into mind. By it is made known to the principalities and powers in heavenly places, the manifold wisdom of God. And while the material system is continually wasting away, and the heavens and the earth which God brought into being and form, shall be rolled together as a scroll, shall wax old like a garment, and be changed as a vesture, the new heavens and new earth will be growing in beauty and glory, be permanent as the throne of God, and to its years there shall be no end.

Inasmuch, then, as the work of redemption is recognized in the Bible as the chief work of heaven, is represented as intended to display to the hosts of seraphim and cherubim the manifold wisdom of God, and containing in it exhibitions of the perfections of Jehovah, which awaken the earnest investigation, and profound adoration of angels, who desire to look into it; and inasmuch as it is the great purpose of the Sabbath that man shall commemorate the attributes of God as unfolded in his works, the strong presumption is, that now, since a greater work is accomplished than when God rested from all which he had created and made, and his perfections are more gloriously displayed in it, the completion of this work will be the object of commemoration, and the day on which Christ entered into his rest, having ceased from his work as God did from his own, will be the day on which the righteous will enter into the courts of the Lord’s house; and in private also feel that this is the day which the Lord hath made and set apart for the duties of devotion. That day was the first day of the week, when the Redeemer burst the bars of death and arose triumphant over the grave.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/john-holmes-agnew.html">John Holmes Agnew</a></span><span class="wk"><span class="lbl">Work:</span> <cite>A Manual on the Christian Sabbath</cite>, (Philadelphia PA: Presbyterian Board of Publication, 1852), pp 101-03.</span></figcaption>

<blockquote><p>This thesis argues that in 1 Corinthians 11:2-16 Paul asserts most centrally that women should wear head coverings while praying and prophesying in the Corinthian Christian assembly. I examine the honor and shame value system of the Greco-Roman world, both generally and in specific reference to head adornment, since head coverings and hairstyles were connected to honor and status. Then I look at Paul’s treatment of honor and shame throughout 1 Corinthians, which denounces the worldly value system of status seeking in favor of the value system of the cross. Paul’s stance leads him to subject cultural norms to gospel values…</p></blockquote>

<blockquote><p>Meanwhile we remark, that this principle, instead of being a principle, either of oppression on the one hand, or slavish submission on the other, is the great charter of Christian liberty, and of the elevated dignity of Christ’s freemen; while the opposite principle is not only the badge, but the instrument of tyranny on the one hand, and of slavish submission to the impositions and inventions of men on the other. It is no slavery, and no degradation to submit to the commands, and walk according to the rules prescribed by the Majesty of heaven and earth. “I will walk at liberty, because I seek thy precepts,” said David. ” Ye shall know the truth, and the truth shall make you free,” says our Lord; …

This is verified by the whole facts alike of individual and of social history, civil and ecclesiastical. That is the history of individual and monkish fanaticism? Not a history, in the first instance, of bad men, but the history of good men following their own inventions, and putting in practice their own devices, and being “wise above what was written;” and the whole issuing in the excesses of folly, and the most enormous crimes of lust and murder. What is the history of the whole gorgeous and burdensome, and even puerile, ceremonial and ritual of Rome, now being copied and imitated in the Church of England at the present moment?

Not the history of things positively forbidden by the Bible in so many words, but the history of things which are “not prescribed in Holy Scripture.” If one man is at liberty to plead for his own invention, because it is not forbidden in the Bible, why may not another do the same for his, and forthwith set it up, on the principle that all is lawful in the worship of God which is not forbidden? What right have the anti-ritualists of England, unless they adopt our principle, to disturb the public peace by their present opposition] Nay, what right have such parties to oppose the ritual of Antichrist himself?

Very different is the case when the Christian man and the Christian church can demand, ” By what Bible authority do you these things? and who gave you this authority?”

Would that the professing church of Christ—would that Christian men might seriously ponder, in the first instance, the great principle to which we have given expression in the words of the Westminster Confession of Faith. It is one which seems to us just, reasonable, and scriptural, and of unspeakable importance to the liberty and highest interests of the Christian church, and their only security against the irruptions of the Papacy, and the introduction of its worst practices into the Church of England.

We tell them, and tell all men, that history, experience, and rational reflection, show that men waste their breath against all such inventions, and gratuitously disturb the peace both of Church and State, if they cannot plead the authority of the Word of God for what they are doing; and what is more, they disturb it in vain—for ”will-worship,” sanctioned, will have its own way, and human nature, “priest and people, love to have it so.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/james-gibson.html">James Gibson</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Public Worship of God: Its Authority and Modes, Hymns and Hymn Books</cite>, (London: James Nisbet and Son, 1869), pp 17-18.</span></figcaption>

r.wordpress.com/2020/04/16/james-gibson-on-the-regulative-principle-and-the-defence-of-christian-liberty-in-worship/" rel="noopener" target="_blank">Read it online · Reformed Covenanter</a></div>

<blockquote><p>Nor did the Sabbath originate with Moses, or with any sinner. It was an ordinance in Eden. When, for his sins, man was driven out of paradise, God permitted him to carry with him two institutions, established for his good before his fall. Which of these institutions is the greatest mercy to our world, or which is the dearest to the heart of a good man, I will not undertake to say. One of them is marriage, the other the Sabbath-day. If he is the enemy of virtue who would abolish the former, he cannot be the friend of God or man who would set aside the latter.

By restoring marriage, as far as possible, to its original purity in Eden, that is, by confining it to the pairs and rendering it indissoluble, the Christian religion has incalculably advanced civilization, peace, and all the domestic virtues. By restoring the Sabbath, as near as possible, to its purity in Eden, that is, by the holy observance of all of it, man makes his nearest approach to primitive innocence and to future glory. There is no example of any community, large or small, ancient or modern, continuing virtuous or happy for a considerable time, if they slighted either marriage or the Sabbath-day.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/william-swan-plumer.html">William Swan Plumer</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Law of the Sabbath Still Binding, and What it Forbids in Tracts of American Tract Society. General Series</cite>, vol. VI, no. 187 (New York, n.d.), pp 4-5.</span></figcaption>

<blockquote><p>Saying AMEN, audibly to all. Neh. 8. 6. […]

As for an audible pronouncing of Amen, if the mind of them that pronounce it, have been upon that which the Minister uttered, and their heart have given consent thereto, it compriseth altogether as much as the Minister hath uttered. This is the only warranteable means for people to utter their mind in a Congregation. It must therefore be uttered by every one, altogether, so loud, as well as they hear what he hath uttered in their name. For the one is as requisite as the other.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/william-gouge.html">William Gouge</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Sabbath’s Sanctification</cite>, (London, 1641), p. 5.</span></figcaption>

<main class="wrap"><figure class="quote" id="q-4c57a2c187" data-kw="">
<blockquote><p>I must by the way tell you that I find not sackcloth therein commanded as a solemn significant ceremony; I say commanded as a solemn ceremony, for that you find it not only mentioned as the ordinary concomitant of more grievous mournings, nay by the prophets even literally commanded, as also baldness, sitting in the dust, howling and wallowing in ashes, the better to express that serious mourning, whereunto the Lord did call, is plainly obvious, and can only infer that therefore and after this manner it is the more capable to be still contained.</p></blockquote>

<blockquote><p>It is wont to be excepted against this that Christian Liberty stands not in the freedom of outward actions, but only in the freedom of conscience. As long therefore as there is no doctrinal necessity put upon the conscience to limit the lawfulness of the use of outward things, Christian Liberty is preserved, though the use and practise of outward things be limitted. Whereto I answer 1. that the apostle in this case leaves the people of God at liberty, not only in point of conscience for lawfulness to marry [1 Cor. 7], but even in outward actions and practise, ‘Let him do’ (says he) ‘what he will; he sins not, let him be married,’ verses 30 &amp; 38, as who should say, the conscience being free from sin in it, I will put no tie on the outward practice to restrain it. 2. That true Christian Liberty consists principally in the free, actual use of things lawful and indifferent in themselves, and the prohibition of their free, actual use to Christians is expressly censured as anti-evangelical, a badge of false apostles, of apostates from the faith, hypocrites, men of seared consciences, anti-Christian usurpers, 1 Tim. 4:1,3-4: ‘Now the Spirit speaks expresly that in the later times some shall depart from the faith, giving heed to seducing spirits and doctrines of devils, speaking lies in hypocrisy, having their consciences seared with a hot Iron, forbidding to marry, and commanding to abstain from meats which God has created to be received with thanksgiving: for every creature of God is good, and nothing to be refused if it be received with thanksgiving; For it is sanctified by the Word of God and prayer.’ Col. 2:20-21: ‘Wherefore if ye be dead with Christ from the rudiments of the world; why as though living in this world are ye subject to ordinances?’ (or canons) ‘touch not, taste not, handle not’ (no not God’s ordinances, sacraments, creatures but in such vestiments, gestures, postures) ‘which all are to perish with the using; which things have indeed a show of wisdom in will-worship and punishing of the body.’ 1 Cor. 4:5-6: ‘Have we not power to eat and to drink? Have we not power to lead about a sister, wife, as well as other apostles, and as the brethren of the Lord and Cephas?’ compared with verses 19 to 24. Rom. 14:2-3: ‘For one believeth that he may eat all things another who is weak eateth herbs; Let not him that eateth despise him that eateth not; and let not him which eateth not, judge him that eateth; For God hath received him. Who art thou that judgest another man’s servant? To his own master he standeth and falleth. But why dost thou judge thy brother’ (or refrain him in the use of things indifferent) ‘or why dost thou set at nought thy brother? We shall all stand before the judgement seat of Christ? etc. Let us not therefore iudge one another any more, but judge this rather that no man put a stumbling block or an occasion to fall in his brother’s way, etc.’ to wit, by any restraints, canons, inhibitions, censures, in or concerning things or ceremonies that are but indifferent, and not absolutely necessary by God’s prescription, or the nature of the things themselves. Therefore to prohibit any ministers of the gospel who are able and faithfull to preach the Word, or to excommunicate or cast them, or any other consciencious Christians out of the Church, or debar them from the sacrament, because they cannot wear a surplice, kneel at the Lord’s Table or Supper, or conform to every punctilio in the Liturgy or Canons, and to deny them their Christian Liberty in the free use or forbearing of ceremonies which are only decent and indifferent, indirectly repugnant to Christian Liberty, the Gospel of Christ, and to Acts 4:18-20; ch. 5:27-29, 41-42; 1 Thess. 2:14-16; 3 John 9-10; Rev. 13:16-17; 1 Cor. 7:8-9, 25-28, 35-40; Gal. 5:13-14.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/william-prynne.html">William Prynne</a></span><span class="wk"><span class="lbl">Work:</span> <cite>A Brief, Pithy Discourse upon 1 Corinthians 14:40</cite>, … (London, 1661), pp. 8-9</span></figcaption>

</figure><figure class="quote" id="q-3eb42af139" data-kw="">
<blockquote><p>The Divine worship includes not only sacrifices and the like, which seem to be directed to God immediately, but also those things whereby His worshippers are duly prepared to worship Him: thus too in other matters, whatever is preparatory to the end comes under the science whose object is the end. Accordingly those precepts of the Law which regard the clothing and food of God’s worshippers, and other such matters, pertain to a certain preparation of the ministers, with the view of fitting them for the Divine worship: just as those who administer to a king make use of certain special observances. Consequently such are contained under the ceremonial precepts.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/thomas-aquinas.html">Thomas Aquinas</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Summa, pt. 2, pt. 1</cite>, Question 101, ‘Of the Ceremonial Precepts in Themselves’, Article 1, ‘Whether the nature of the ceremonial precepts consists in their pertaining to the worship of God?’, Reply to Objection 1. While Aquinas’s teaching can be taken too far, as Romanists have taken it in setting apart as holy the many various instruments involved with the mass, yet there is an aspect of truth in the teaching.</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/worship/ceremonies-and-things-indifferent.html">Ceremonies and Things Indifferent</a></span></div>
<div class="actions"><button class="copy" data-copy="“The Divine worship includes not only sacrifices and the like, which seem to be directed to God immediately, but also those things whereby His worshippers are duly prepared to worship Him: thus too in other matters, whatever is preparatory to the end comes under the science whose object is the end. Accordingly those precepts of the Law which regard the clothing and food of God’s worshippers, and other such matters, pertain to a certain preparation of the ministers, with the view of fitting them for the Divine worship: just as those who administer to a king make use of certain special observances. Consequently such are contained under the ceremonial precepts.”

— Aquinas, Summa, pt. 2, pt. 1, Question 101, ‘Of the Ceremonial Precepts in Themselves’, Article 1, ‘Whether the nature of the ceremonial precepts consists in their pertaining to the worship of God?’, Reply to Objection 1. While Aquinas’s teaching can be taken too far, as Romanists have taken it in setting apart as holy the many various instruments involved with the mass, yet there is an aspect of truth in the teaching.">Copy</button><a class="share" href="https://x.com/intent/post?text=%E2%80%9CThe+Divine+worship+includes+not+only+sacrifices+and+the+like%2C+which+seem+to+be+directed+to+God+immediately%2C+but+also+those+things+whereby+His+worshippers+are+duly+prepared+to+worship+Him%3A+thus+too+in+other+matters%2C+whatever+is+preparatory+to+the+end+comes+under+the+science+whose+object+is+the+end.+Accordingly+those+precepts+of+the+Law+which+regard+the+clothing+and+food+of+God%E2%80%99s+worshippers%2C+and+other+such+matters%2C+pertain+to+a+certain+preparation+of+the+ministers%2C+with+the+view+of+fitting+them+for+the+Divine+worship%3A+just+as+those+who+administer+to+a+king+make+use+of+certain+special+observances.+Consequently+such+are+contained+under+the+ceremonial+precepts.%E2%80%9D%0A%0A%E2%80%94+Aquinas%2C+Summa%2C+pt.+2%2C+pt.+1%2C+Question+101%2C+%E2%80%98Of+the+Ceremonial+Precepts+in+Themselves%E2%80%99%2C+Article+1%2C+%E2%80%98Whether+the+nature+of+the+ceremonial+precepts+consists+in+their+pertaining+to+the+worship+of+God%3F%E2%80%99%2C+Reply+to+Objection+1.+While+Aquinas%E2%80%99s+teaching+can+be+taken+too+far%2C+as+Romanists+have+taken+it+in+setting+apart+as+holy+the+many+various+instruments+involved+with+the+mass%2C+yet+there+is+an+aspect+of+truth+in+the+teaching.&amp;url=https%3A%2F%2F5solasquotes.github.io%2Fquote%2F3eb42af139.html&amp;via=5Solas" target="_blank" rel="noopener">Share on X</a><a class="perma" href="../quote/3eb42af139.html">Permalink</a><a class="src" href="https://reformedbooksonline.com/on-circumstances/#:~:text=The%20Divine%20worship%20includes%20not%20only,are%20contained%20under%20the%20ceremonial%20precepts&amp;text=The%20Divine%20worship%20includes%20not%20only%20sacrifices%20and&amp;text=Consequently%20such%20are%20contained%20under%20the%20ceremonial%20precepts" rel="noopener" target="_blank">Read it online · Reformed Books Online</a></div>

<blockquote><p>Answer 1 [to the Papists’s practice of keeping the cup from the people]: As in some countries there is no wine to be had, so we find that in certain places and regions of the world there is no bread, such as Christ used, made of wheat or the like grain: as in some places amongst the West Indians they have a certain kind of bread made of roots called Cazabi, as Benzo witnesses. Wherefore by this reason [of the Papists] of uniformity, we should not communicate at all, either in bread or wine, seeing that as some countries are destitute of wine, so other are of bread: But all this not withstanding, the sacrament may be duly administered in all places in both kinds: and where they have neither bread nor wine, neither can possibly provide them, they may safely use such other elements, as do stand them in the like stead: as in the place of bread, that which comes nearest to the use thereof: and for wine, some other precious liquor, that is to be had, as in Russia instead of wine they use a certain drink like unto that which we call Metheglen.</p></blockquote>

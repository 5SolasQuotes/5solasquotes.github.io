<main class="wrap"><figure class="quote" id="q-37c15bd479" data-kw="">
<blockquote><p>Having showed what ruling elders are, it follows to show Scripture and divine right for them. Our first argument is taken from the governement and policy of the Jewish Church thus: Whatsoever kind of office-bearers the Jewish Church had, not as it was Jewish, but as it was a Church, such ought the Christian Church to have also. But the Jewish Church, not as it was Jewish, but as it was a Church, had elders of the people who assisted in their ecclesiastical government and were members of their ecclesiastical consistories. Therefore such ought the Christian Church to have also. The proposition will no man call in question, for quod competit alicui qua tali competit omni tali. That which agrees to any Church as it is a Church, agrees to every Church. I speak of the Church as it is a political body and setled ecclesiastical republic. Let us see then to the assumption. The Jewish Church, not as it was a Church, but as it was Jewish, had an high priest, typifying our great high Priest Jesus Christ… But as it was a Church, and not as Jewish, it had four sorts of ordinary office-bearers, priests, Levites, doctors, and elders, and we conformably have pastors, deacons, doctors and elders. To their priests and Levites, Cyprian does rightly liken our pastors and deacons, for howsoever sundry things were done by the priests and Levites, which were typical and Jewish only, yet may we well parallel our pastors with their priests, in respect of a perpetual ecclesiastical office common to both, viz. the teaching and governing of the people of God, Mal. 2:7; 2 Chron. 19:8, and our deacons with their Levites, in respect of the care of ecclesiastical goods and of the work of the service of the house of God in the materials and appurtenances thereof, a function likewise common to both, 1 Chron. 26:20 &amp; 23:24-28. The Jewish Church had also doctors and schools, or colleges for the preservation of true divinity among them, and of tongues, arts and sciences, necessary thereto, 1 Chron. 15:22-27; 2 Kings 22:14; 1 Sam. 19:20; 2 Kings 2:3-5; Acts 19:9. These office-bearers they had for no typical use, but we have them for the same use and end for which they had them. And all these sorts of office-bearers among us we do as rightly warrant from the like sorts among them as other whiles we warrant our baptizing of infants from their circumcising of them, our churches by their synagogues, etc. Now that the Jewish Church had also such elders as we plead for, it is manifest: for besides the elders of the priests, there were also elders of the people joined with them in the hearing and handling of ecclesiastical matters, Jer. 19:1, ‘Take of the ancients of the people and of the ancients of the priests.’ The Lord sending a message by the prophet would have a representative body of all Judah to be gathered together for receiving it, as Tremellius notes. So 2 Kings 6:32. Elisha sat in his house and the elders sat with him. We read, 2 Chron. 19:8, that with the priests were joined some of the chief of the fathers of Israel to judge ecclesiastical causes and controversies. And howsoever many things among the Jews in the latter times, after the captivity, did wear to confusion and misorder, yet we find even in the days of Christ and the apostles, that the elders of the people still sat and voiced in council with the priests, according to the ancient form, as is clear from sundry places of the New Testament, Mt. 16:21 and 21:23 and 26:57-59 and 27:1-12; Mk. 14:43; Lk. 22:66; Acts 4:5.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/george-gillespie.html">George Gillespie</a></span><span class="wk"><span class="lbl">Work:</span> <cite>An Assertion of the Government of the Church of Scotland in the Points of Ruling-Elders</cite>, ... (Edinburgh: Bryson, 1641), ch. 3, pp. 17-20</span></figcaption>

<blockquote><p>I have also proven before that human laws do not bind to obedience but only in this case, when the things which they prescribe do agree and serve to those things which God’s Law prescribes: so that as human laws they bind not, neither have they any force to bind, but only by participation with God’s Law.</p></blockquote>

</figure><figure class="quote" id="q-0b42a848a4" data-kw="">
<blockquote><p>As for the maintenance and the continuance of the office of ruling elders, we love not unnecessary multiplication of questions, let every Church do herein what they find most convenient. The manner of our Church in these things is such as best befits the condition of the same, and such as cannot be in reason condemned; Neither is a stipend, nor continuance in the function till death, essential to the ministry of the Church, but separable from the same. The Levites of old served not at all times, but by course, and when they were 50 years old, they were wholly liberat[ed], from the burden and labor (though not from the attendance) of the Levitical service; and ministers may still upon the Church’s permission, for lawful reasons and urgent necessities, be absent a whole year, and longer too, from their particular charges. The apostles, when they were first sent through Judea, took no stipend, Mt. 10:8-9. Neither did Paul take any at Corinth, 1 Cor. 9:18. The ministers among the Waldenses work with their hands for their maintenance. The old patriarchs were priests and preachers to their families, and maintained themselves by the work of their hands, feeding of flocks, tilling the ground, etc. These things I do not mention as rules, to be followed by us, but to show, that the intermission of the exercise of the ministry, the want of maintainance and laboring with the hands, are not altogether repugnant, nor inconsistent with the nature of the vocation of the ministers of the Word, but in some cases hic &amp; nunc [here and now], may be most approveable in them: much more in ruling elders. The revenues of our Church are so small that they cannot spare stipends to ruling elders, which makes them willing to serve without stipends; and lest they should be overburdened with this their service, though they be chosen and called to be ruling elders as long as they live, at least till they merit to be deposed, yet our book of policy [Second Book of Discipline] allows them that ease of intermission and serving by course which was allowed to the Levites of old in the Temple. The double honor which the apostle commands to give unto elders that rule well, 1 Tim. 5:17, needs not to be expounded of maintenance and obedience; for by double honor we may either simply understand much honor, or by way of comparison double honor in respect of the widows, whom he had before commanded to honor, 1 Tim. 5:3, as Calvin expounds the place. Both these interpretations does Oecumenius give upon the same place.</p></blockquote>

<main class="wrap"><figure class="quote" id="q-a42c0bc5fe" data-kw="">
<blockquote><p>Pleasing people is the mark of a false teacher and of one who is not the servant of Christ. Pleasing people is not so much a matter of seeking one’s own glory or of being impressed by the praise of others as of being governed in spiritual matters by the judgment and opinion of other people. The false apostles were not servants of Christ because they pleased people, relied on human praise, went after human rewards and were governed by the judgments and opinions of others. To be a servant of Christ is the exact opposite of this—it is precisely not to please people!</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/erasmus-sarcerius.html">Erasmus Sarcerius</a></span><span class="wk"><span class="lbl">Work:</span> <cite>In Epistolas Divi Pauli ad Galatas et Ephesios Annotationes</cite>, (Frankfurt, 1542). Quoted in Gerald L. Bray, Timothy F. George, Scott M. Manetsch (eds), Reformation Commentary on Scripture X: Galatians, Ephesians (Downers Grove IL: IVP Academic, 2011), p. 32.</span></figcaption>

<blockquote><p>242. Of the use of Amen being added to a Speech …

1. Three duties especially are required of him that utters the speech whereunto ‘Amen’ is added. …

<blockquote><p>Mercy and truth are met together, righteousness and peace have kissed each other. When God made heaven and earth out of nothing, he made them by a word, without any other ceremony; but, when he made man, there was some particular solemnity, a grand council, as it were, of the glorious Trinity called; Come, let us make man after our image. But now man having unmade himself, if God hath a mind for the praise of his own glorious grace to make him up again, by a new creation in Christ Jesus, there must be a more glorious solemnity yet; not only a council of the adorable Trinity, but a grand meeting of all the attributes of God, to consult their own glory that was marred, and reconcile their own interests, and seemingly contradictory claims:

For the sin of man had brought real confusion among all the creatures of God on earth, yea, and seeming war among all the attributes of God in heaven, concerning the execution of the sentence of the law upon mankind, the transgressor thereof; some of these attributes, such as Mercy, saying, if the sentence of death be executed upon them, how shall I be glorified? Others, such as Truth, saying, if the sentence be not executed, how shall I be glorified? Is it to be expected that such opposites can meet together? Or, if they meet, that they will agree together cordially? Yea, tho’ it be beyond the expectation of men and angels, yet behold, it is here celebrated with a song? Mercy and truth are met together, righteousness and peace have kissed each other. …

But now, if we would know what sort of glory it is that appears when Christ is revealed, why it is even the glorious harmony of all the divine attributes illustriously shining in him, who is both our salvation and our glory; Mercy and truth are met together; righteousness and peace have kissed each other. Now, tho’ these words may be applied to the happy meeting of graces in men, upon the revelation of Christ in the soul, which I may afterwards observe in the sequel, and in which sense some interpreters understand it, yet I take it mainly to import the happy meeting of perfections in God to be glorified in the sinner’s salvation by Jesus Christ, which is a gloss that no interpreter I have had occasion to consult does neglect or omit; and, if any of them should miss it, I think they would miss the very ground-work and foundation of all other happy meetings: Mercy and truth are met together, righteousness and peace have kissed each other.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/ralph-erskine.html">Ralph Erskine</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The harmony of the divine attributes displayed; in the redemption &amp; salvation of sinners by Jesus Christ. Being a sermon preached at Dunfermline on the 20th of September 1723; immediately after the celebration of the Lord’s Supper</cite>, (1723; Boston: S. Kneeland and T. Green, 1748), pp 4, 5-6.</span></figcaption>

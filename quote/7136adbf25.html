<main class="wrap"><figure class="quote" id="q-7136adbf25" data-kw="">
<blockquote><p>When we look into the doctrine of Mahomet, we find therein many truths, which he had taken from Jews and Christians, which greatly advance his religion above that of the pagans. He admitted only of one God, and asserted that his essence was simple and infinite… Thus far his doctrine is good: these are truths which that impostor drew from the books of the Old and New Testament.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/benedict-pictet.html">Benedict Pictet</a></span><span class="wk"><span class="lbl">Work:</span> <cite>True &amp; False Religion Examined</cite>, pp. 41-42</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/jews-and-muslims.html">Jews and Muslims</a></span></div>

<blockquote><p>§17. Now to the Political Means. I. Nothing is accomplished, indeed, things are done badly, by persecuting, harassing or oppressing the Jews, driving them away, or killing them. … Therefore, the better and more common opinion, both among theologians and among jurists, is that the Jews should be tolerated—not indeed enticed, but, where they are found, not treated more harshly. Thus: • Baldus, vol. 1, Consil, 315-16 • Rolandus a Valle, vol. 3, Consil, 25 • Alexander of Hales, Summa, pt. 2, Questions 179-80 • Vincent of Beauvais, Spec. Doctr., bk. 10, ch. 38, etc. • Johannes Gerhard, Common Places, On the Magistrate, p. 631 • Hottinger, Thesaurus Philologicus, bk. 1, ch. 1, section 2, question 1 And the one who treated this matter learnedly and extensively in a separate book, Georgius Theodorus, Counselor of Hesse, De jure et statu Iudæorum in Republica Christianorum [On the Law and Status of the Jews in the Republics of Christians].</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/johannes-hoornbeeck.html">Johannes Hoornbeeck</a></span><span class="wk"><span class="lbl">Work:</span> <cite>T’shuvah Yehudah</cite>, (Leiden, 1655), pp. 24-25 tr. AI Latin</span></figcaption>

d it online · Reformed Books Online</a></div>

<blockquote><p>If adversity with roughness were to compel those whose mind cannot be fully drawn by reason given back, it would drive them far away.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/alexander-of-hales.html">Alexander of Hales</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Sum of Universal Theology</cite>, (Paris, 1230-1245), pt. 2 of 2, inq. 3, tract 8, sect. 1, quest. 1, title 2 | member 1 | ch. 3, ‘Whether Jews are to be Permitted to Observe their Rite in Solemnities and Other Things’ | [Solution]: | To this it must be said that they are to be permitted by a permission of tolerance, as is found in the Extra, Consuluit, where it is said (Decretals, V, tit. 6, c. 7 [n. 21] II, 773): For if they were forbidden (they ought to have as great [liberty] as in the old synagogues they are tolerated in their observances to keep their rites) they would now as it were be compelled to the Faith; but coerced services do not please God. Furthermore, Gregory says:</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/jews-and-muslims.html">Jews and Muslims</a></span></div>

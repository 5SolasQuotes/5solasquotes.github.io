<main class="wrap"><figure class="quote" id="q-c9fff794c6" data-kw="">
<blockquote><p>Images of God were strictly forbidden. But Puritan psychology also kept its strong Scholastic roots… Tension between Reformed iconoclasm and Scholastic psychology was not immediately apparent, but during the Evangelical Awakening of the 1740s it became acute. The problem may be stated concisely: If mental images are natural products of the imagination, how can a mental image of Christ be condemned as idolatrous? Does not this impugn the character of God who gave the mind its capacity for forming images? The following study… concludes with the controversy which erupted in Scotland when Jonathan Edwards defended the psychological neutrality of ‘Imaginary ideas of Christ.&#x27;</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/start-here.html">Reformed Books Online</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Table of Contents</cite>, VI. Evaluation . 1. Erskine &amp; Robe . 2. Easing the Tension</span></figcaption>

<blockquote><p>She was called the Queen of heaven, Queen of queens, said to be exalted above all principalities and powers; to be seated at the right hand of Christ, to share with Him in the universal and absolute power committed to his hands. All the blessings of salvation were sought at her hands, as well as protection from all enemies, and deliverance from all evils.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/charles-hodge.html">Charles Hodge</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Systematic Theology</cite>, vol. 3 (Mariolatry)</span></figcaption>

</figure><figure class="quote" id="q-99dfff926c" data-kw="">
<blockquote><p>Therefore, in forbidding us to have strange gods, he means that we are not to transfer to another what belongs to him. Even though there are innumerable things that we owe to God, yet they may be conveniently grouped in four headings: (1) adoration (to which is added as an appendix, spiritual obedience of the conscience), (2) trust, (3) invocation, (4) thanksgiving.… As the Lord suffers nothing of these to be transferred to another, so he commands that all be rendered wholly to himself.… And it will not be enough to abstain from a strange god.… If we are content, therefore, with one God, let us remember what was said before: that we are to drive away all invented gods and are not to rend asunder the worship that the one God claims for himself. For it is unlawful to take away even a particle from his glory; rather, all things proper to him must remain with him.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/john-calvin.html">John Calvin</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Institutes of the Christian Religion</cite>, 2.8.16</span></figcaption>

</figure><figure class="quote" id="q-ddf34f9955" data-kw="">
<blockquote><p>The many portentous idolatries by which the Church of God is deformed — the many defilements of superstitions — the many profanations of sacred things — the vast sink of errors must not be touched. There is to be no diminution of the tyrannical yoke of impious laws by which miserable consciences have been ensnared; but all who desire any change are to be judged heretics.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/john-calvin.html">John Calvin</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Acts of the Council of Trent with the Antidote</cite>, On the Decree concerning Residences</span></figcaption>

</figure><figure class="quote" id="q-49f3ff8527" data-kw="">
<blockquote><p>Idolatry is not to picture any historical thing, but to worship or adore an image. This indeed they have not made who have sometimes in our Bibles conjoined pictured histories with the narratives… For instance, at Ex. 3:2-3 a picture of the bramble bush is certainly represented, in which Jehovah appeared, but there is no likeness or image of Jehovah, who appeared in the bramble bush. The bramble bush is indeed one thing, God appearing in the bramble bush another.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/johann-heinrich-heidegger.html">Johann Heinrich Heidegger</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Mound of the Council of Trent</cite>, … where is a Historical-Theological Anatomy of the Council of Trent... (Zurich: Gessner, 1690), vol. 2, ‘Of Sacred Images’, p. 897 top</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/worship/idolatry-and-images.html">Idolatry and Images</a></span></div>

<main class="wrap"><figure class="quote" id="q-cbb697c9ed" data-kw="">
<blockquote><p>I answer briefly that God does always begin to us, and is beforehand with us in all dealings with ourselves. He gives us many motions, and never withdraws Himself from us but when He is despised and slighted first: therefore let us take heed that we labor to answer Christ’s call when He does call. If we slight it, then in a judicious course, He ceases to speak further to us, if we slight his beginnings of revelations… We would not yield to all the passages of salvation; but when He was beforehand with us, and offered many sweet motions, yet we loved our sins better then our souls, and so repelled all. Therefore I beseech you do not refuse the sweet messages from Heaven, the gracious and sweet motions of the spirit of Christ, make much of them. God has begun to you, be sure to answer. Learn it of Mary, when Christ began [after his resurrection], she set not her heart and infidelity against it, but she opened her heart, and said, ‘Rabboni’ [Jn. 20:16]; learn therefore the duty of spiritual obedience, when God speaks, ‘Speak Lord, for thy servant hears.’ Do not shut your ears to the motions of God’s blessed Spirit, do not harden your hearts against his voice, but open your hearts as she did, ‘Rabboni’.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/richard-sibbes.html">Richard Sibbes</a></span><span class="wk"><span class="lbl">Work:</span> <cite>A Heavenly Conference between Christ &amp; Mary after his Resurrection</cite>, … (d. 1635; London: 1654), pp. 21-22</span></figcaption>

</figure><figure class="quote" id="q-f3c4ad26d2" data-kw="">
<blockquote><p>…he exhorts all the members of the visible Church to the intent they may receive righteousness and salvation from God (who is in covenant with his Church) heartily to welcome Christ Jesus, the King of glory and Lord of hosts… He exhorts, I say, patent doors to be made unto Him, wherever he offers Himself to kingdoms, cities, incorporations, visible Churches, families and hearts of men in special. Whence learn:

1. The way to make men true converts, true believers, true saints and inheriters of Heaven, is to receive Christ heartily and honorably, to cast up doors in hearty consent of faith and love, like triumphant archers for welcoming so glorious a conquerour to be their guest; ‘Lift up your heads, O ye gates, etc.’

2. Whosoever shall receive the offer, and open the heart to Him, He shall close covenant with Him; ‘Be ye lift up ye everlasting doors, and the King of glory shall come in.’

3. He is an unknown King till He be manifested to us; and such as are wise, when they hear of Him, will seek to know Him. ‘Who is this King of glory?’ will be their question.

4. Such as seek to know Christ, shall indeed have experimental knowledge of Him: That He is able to save them to the uttermost, to work all their work for them, to defend them from their adversaries, and to give them complete victory; ‘He is the Lord strong and mighty, the Lord mighty in battle.’

5. We have need again and again to hear the offer of Christ’s grace, and to be wakened up to observe Christ and his glory: need to be exhorted again and again to open our hearts wide to Him. ‘Lift up your heads, ye gates,’ the second time.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/david-dickson.html">David Dickson</a></span><span class="wk"><span class="lbl">Work:</span> <cite>A Brief Explication of the Last Fifty Psalms from Ps. 100 to the End</cite>, (London: T.M., 1655), on Ps. 24, verses 7-10</span></figcaption>

<main class="wrap"><figure class="quote" id="q-4d2048fb35" data-kw="">
<blockquote><p>§9. Of Wearing the Surplice As touching the surplice, the wearing of a garment of this or that color, or of this or that form or shape in divine worship, is neither commanded nor forbidden of God. But though as to its material it may be indifferent, yet as to its formal state, it may not be also. If the surplice be made a holy garment, as the priestly garments under the law, if it be used to make him that wears it more holy, and the service more acceptable for obtaining divine grace, it is superstitious. If it be made a symbol of sanctity, it may raise a scruple. But a distinctive habit [garment] of a minister, whether used as his ordinary garb, or only in sacred administrations, I cannot see to be superstitious or forbidden. But a habit that is not superstitious may be too gaudy or too theatrical. What is the formal state or reason of the surplice is to be judged by the authoritatively declared meaning of those that enjoin it, touching its end and use. But whatsoever the nature and reason of this garment be, I cannot approve the enforcing of it upon such ministers and in such congregations to whom by reason of invincible prejudice, it is either odious or ridiculous, yea though their prejudice be supposed culpable. Wise rulers give way to the immovable averseness of inferiors in things unnecessary and of no great moment, though of good intention. And as I should be loath to wear a fool’s coat in divine service upon the command of a superior, so I should be loath to appear in a congregation in a habit which I knew would be to them as ridiculous as a fool’s coat, though it were their great folly so to think.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/john-corbet.html">John Corbet</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Other citations (work not named)</cite>, Of Divine Worship, pt. 3, sect. 9 in Remains (London: Parkhurst, 1684), pp. 219-20</span></figcaption>

<blockquote><p>§21. 13. God that has required us to celebrate his worship, does imply that we must do it in a decent habit: Nakedness is a shame: Clothing we must wear: but He has not told us what it must be: Whether linen or woolen: whether black or white: or of what shape and fashion; This therefore is left to human prudence.</p></blockquote>

</figure><figure class="quote" id="q-29ffa4a185" data-kw="">
<blockquote><p>3. They hold that all outward means instituted and set apart to express and set forth the inward worship of God, are parts of Divine worship and that not only all moral actions, but all typical rites and figures, ordained to shadow forth in the solemn worship and service of God, any spiritual or religious act or habit in the mind of man, are special parts of the same, and therefore that every such act ought evidently to be prescribed by the Word of God, or else ought not to be done? it being a sin to perform any other worship to God, whether external or internal, moral or ceremonial, in whole or in part, then that which God Himself requires in his Word.</p></blockquote>

</figure><figure class="quote" id="q-e0034c6279" data-kw="">
<blockquote><p>Other of the ceremonies that are not evil in their own nature, yet were devised to evil, for example, the surplice. The replier to Dr. Mourton’s Particular Defence, observes (ch. 1, section 3), that this superstition about apparel in divine worship began first among the French bishops, unto whom Caelestinus writes thus. Discernendi, etc. ‘We are to be distinguished from the common people and others by doctrine, not by garment, by conversation, not by habit, by the purity of mind, not by attire: for if we study to innovation, we tread underfoot the order which has been delivered unto us by our fathers, to make place to idle superstitions; wherefore we ought not lead the minds of the faithful into such things: for they are rather to be instructed than played withal: neither are we to blind and beguile their eyes, but to infuse instructions into their minds.’ In which words Caelestinus reprehends this apparel, as a novelty which tended to superstition, and made way to the mocking and deceiving of the faithful.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/george-gillespie.html">George Gillespie</a></span><span class="wk"><span class="lbl">Work:</span> <cite>English Popish Ceremonies</cite>, (1637), pt. 2, ch. 9, p. 47</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/worship/vestments-and-dress.html">Vestments and Dress</a></span></div>

</figure><figure class="quote" id="q-d2cc4b9b6c" data-kw="">
<blockquote><p>Thirdly, all pride and vanity of garments are to be shunned and all those ornaments which do rather beseem the profane theaters of the gentiles than the sacred temples of Christians and which rather tend to delight the flesh than to edify the spirit: but all things must be done in the churches with most high reverence and modesty, as in the very sight of God and his angels. And albeit concerning the fashion of garments which ministers ought publicly to wear, either in their ministery or out of it, we do not think it a matter to be so stood upon that for it the peace of the church ought to be troubled; yet where they come nearest to the simplicity of the apostles, there we judge the church rather to be approved.</p></blockquote>

</figure><figure class="quote" id="q-75bb75dfa8" data-kw="">
<blockquote><p>7. Yet we say, that as God by gifts may furnish some in a more than ordinary way; so may He, and uses He to thrust them out in a mixed way to the exercise of these for the edification of His Church, and make the seal of his call extraordinarily ratify his sending of them, that is, as He may furnish men partly by means, and especially by his blessing extraordinarily accompanying them, so may He send them out partly in a mediate way by men’s opening of the door, partly by his more than ordinary thrusting of them out, making up so what was defective in the mediate call by some extraordinary concurrences of impulse and gifts within, of circumstances of providence without, and of efficacy upon, and acception of it amongst others, whereby it cometh to be ratified. This the Lord fulfilled at the entry of the Reformation, raising up men comparatively extraordinarily furnished and commissionated for his work, yet still ministers of the same Gospel, and walking according to the common rule with others in their ministerial charge. This is not ordinarily to be imitated, but where the like cases, call, and circumstances concur…</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/james-durham.html">James Durham</a></span><span class="wk"><span class="lbl">Work:</span> <cite>ch. 10, ‘Concerning Prophesying’ in A Commentary upon the Book of the Revelation… (Edinburgh, 1658)</cite>, pp. 469-72</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/modern-errors.html">Modern Errors</a></span></div>

text=where%20the%20like%20cases%2C%20call%2C%20and%20circumstances%20concur" rel="noopener" target="_blank">Read it online · Reformed Books Online</a></div>
</figure><figure class="quote" id="q-b429bc8ea1" data-kw="">
<blockquote><p>Secondly, every office necessarily supposes the corresponding gift. No man could be an apostle without the gift of infalibility; nor a prophet without the gift of inspiration; nor a healer of diseases without the gift of healing. Man may appoint men to offices for which they have not the necessary gifts, but God never does, any more than he ordains the foot to see or the hand to hear. If any man, therefore, claims to be an apostle, or prophet, or worker of miracles, without the corresponding gift, he is a false pretender. In the early church, as now, there were many false apostles, i.e. those who claimed the honor and authority of the office without its gifts. Thirdly, the fact that any office existed in the apostolic church is no evidence that it was intended to be permanent. In that age there was a plenitude of spiritual manifestations and endowments demanded for the organization and propagation of the church, which is no longer required. We have no longer prophets, nor workers of miracles, nor gifts of tongues. The only evidence that an office was intended to be permanent is the continuance of the gift of which it was the organ, and the command to appoint to the office those who are found to possess the gift.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/charles-hodge.html">Charles Hodge</a></span><span class="wk"><span class="lbl">Work:</span> <cite>An Exposition of the First Epistle to the Corinthians (NY: Robert Carter, 1860), on 1 Cor. 12:28</cite>, p. 263</span></figcaption>

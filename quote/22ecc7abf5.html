<blockquote><p>Those that will not use the name of ordination may yet use the thing: which is nothing but the solemn designation or appointment of a fit person to the office, by competent men: which is most fitly accompanied with prayer and imposition of hands, where they may be had.</p></blockquote>

<div class="meta"><span class="t"><a href="../topics/church-government-and-the-ministry/the-call-to-ministry.html">The Call to Ministry</a></span></div>

</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-47c8ab8f0f" data-kw="">
<blockquote><p>1st Distinction. There is one power of public preaching in a Church not constitute[d], and another in a Church constitute[d]; gifted persons in extraordinary cases, where a Church is not planted, may publicly preach, but the case is otherwise in a Church constituted. … 3rd Distinction. Public preaching, as it is the ordinary mean of saving such as believe, is proper and peculiar to the Church, both subjectively, as being only in the Church, and objectively as being only exercised on the Church members per se, but upon pagans by accident. 4th Distinction. There is a call to an habitual and ordinary prophesying; here is required not only a calling by gifts, but also a collation of authority to the office, either immediately by God, or mediately by the Church, and there is a call to some particular or occasional acts of exhorting, as the martyrs and Stephen [Acts 7] are called to give confession of their faith, and a king in battle, to exhort his army, or a prince his subjects to piety, and to this latter there is no other call required but the place and profession of the exhorter, though he bee not by office a pastor. 5th Distinction. There is a formal calling of the Church, as the laying on of the hands of the elders, and a virtual and interpretative calling or tacit approbation of the Church, when learned men of eminent gifts, not in office, do write commentaries, sermons on canonic Scriptures, and tractates refuting heresies; to this the tacit approbation of the Church is required, but these have not ordinary pastoral care, nor are they the ordinary converters of souls to Christ, as the pretended prophets of [the] Separatists are. 6th Distinction. Gifted Christians may occasionally admonish, warn, rebuke and exhort one another: 1. privately; 2. without any pastoral care of souls as they are a Church, but only as they occasionally converse with them; 3. ex communi officio charitatis [out of the common office and charity], by the Law of nature, charity tying one member to help another; 4. Not authoritatively by special office; but all authority here is from the Word occasionally spoken. The pastor is to preach, 1. publicly; 2. to the Church as the Church. 3. with a pastoral obligation to all alike, whether he converse daily with them or not. 4. not only by the tie of common charity, but by a virtue of a special office. 5. With authority both objective from the Word and official from his charge. 6. and is obliged to separate himself for this charge allanerly [singly, especially or wholly], as a watchman who must give an account in a special manner to Jesus Christ.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/samuel-rutherford.html">Samuel Rutherford</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Pt. 2</cite>, p. 272</span></figcaption>

</figure><figure class="quote" id="q-6c6f893d51" data-kw="">
<blockquote><p>3. And He has described the persons that he will have to be the officers by their requisite qualifications [e.g. 1 Tim. 3]. All this is done in his laws already. 4. There is nothing therefore left to be done but to determine which are the individual persons that are fittest according to God’s description. This God Himself also will do, but has not tied himself to one way in doing it: In general, some sign of God’s will that this is the man must be had; At first in calling the apostles his own immediate nomination was the sign. Now the most notable sign is the most eminent unquestionable qualification of the person, which when God confers so notably or discernably, that man must be taken as chosen by God, and they that reject him do sin: These qualifications lie both in abilities, willingness, conveniency of habitation or other externals and interest in the people; and if God bow their minds to consent, there is the fuller signification of his will; yet lest any by intrusion should abuse the Church, God has made the pastors and overseers judges of men’s fitness, or the ordinary discerners of it, for the guidance of the Church in their consent.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/richard-baxter.html">Richard Baxter</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Christian Concord, or the Agreement of the Associated Pastors &amp; Churches of Worcestershire, with Richard Baxter’s Explication &amp; Defence of it, &amp; his Exhortation to Unity (London: A.M., 1653), ‘Objections Answered’</cite>, pp. 82-83</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/church-government-and-the-ministry/the-call-to-ministry.html">The Call to Ministry</a></span></div>

</figure><figure class="quote" id="q-deb6d25ad7" data-kw="">
<blockquote><p>Neither can it be ground enough to plead for such decisions in preaching, that the thing they preach-for is truth, and the thing they condemn is error. Because: 1. It is not the lawfulness of the thing simply that is in question, but the necessity and expediency thereof in such a case: Now, many things are lawful that are not expedient, 1 Cor. 10:23. 2. In these differences that were in the primitive times concerning meats, days, genealogies, etc. there was a truth or an error upon one of the sides, as there is a right and a wrong in every contradiction of such a kind, yet the apostle thinks fitter, for the Church’s peace, that such be altogether refrained, rather than any way (at least in public) insisted upon or decided. 3. Because no minister can bring forth every truth at all times, he must then make choice; And I suppose some ministers may die, and all do so, who have not preached every truth, even which they knew, unto the people. Beside, there are (no question) many truths hid to the most learned. Neither can this be thought inconsistent with a minister’s fidelity, who is to reveal the whole counsel of God; because, that counsel is to be understood of things necessary to men’s salvation, and is not to be extended to all things whatsoever; for, we find the great apostle expounding this in that same sermon, Acts 20, verse 20, ‘I have keeped back nothing that was profitable unto you;’ which evidenceth that ‘the whole counsel of God,’ or the things which he showed unto them, is the whole, and all that was profitable for them, and that for no by-respect or fear whatsoever he shunned to reveal that unto them. [4.] Also, it is clear, that there are many truths which are not decided by any judicial act; and amongst other things, sparingness to decide truths that are not fundamental judicially has been ever thought no little mean[s] of the Church’s peace, as the contrary has been of division.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/james-durham.html">James Durham</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Treatise on Scandal</cite>, pp. 358-359</span></figcaption>

<blockquote><p>It is universally conceded that the singing of the Psalms was an essential part of the Christian liturgy from the very beginning… … The introduction of uninspired hymns into the worship of the Church was a gradual process, and it was not until the fourth century that the practice became widespread… The paucity of extant hymns from the early centuries of the Church is rather striking and can only be explained as a result of the firm adherence of the Church as a whole to the inspired Psalms. Says [Phillip] Schaff [a standard Church historian]: ‘We have no complete religious song remaining from the period of persecution (i.e. from the first three centuries) except the song of Clement of Alexandria to the divine Logos–which, however, cannot be called a hymn and was probably never intended for public use; the ‘Morning Song’ and the ‘Evening Song’ in the Apostolic Constitutions [A.D. 380, which songs were for daily use, but were not in the public worship of the Church on the Lord’s Day], especially the former; and the so-called Gloria in Excelsis, which as an expression of the hymn of the heavenly hosts [the first versions of it only included Lk. 2:14, an inspired Bible song], still rings in all parts of the Christian world. Next in order comes Te Deum, in its original eastern form [having originated circa A.D. 387]. The Ter Sanctus [from Isa. 6:3, its later expanded form having originated circa 434-446] and several ancient liturgical prayers may also be regarded as poems. Excepting these hymns [most of which were responsive prayers based on inspired Bible songs and were of late origin] in rhythmic prose, the Greek church of the first six centuries produced nothing in this field which has had any permanent value or general use. It long adhered almost exclusively to the Psalms of David, who, as Chrysostom, says, was first, middle, and last in the assemblies of the Christians: and it had, in opposition to heretical predilections, even a decided aversion to the public use of uninspired songs.’¹ ¹ ‘The Greek and Latin Hymnology,’ British and Foreign Evangelical Review, no. 58, Oct., 1866, p. 680-1 …Extant accounts, for example, of searches made for the books of the Christians during times of persecution, make no mention of hymnals, whereas the canonical Scriptures, and especially copies of the Psalter, are frequently mentioned. Jerome mentions that he learned the psalms as a child and continued to sing them in his old age. … The evidence usually brought forward to establish the use of uninspired hymns in the worship of the early church is rather meager. The four earliest non-canonical witnesses to Christian worship practice are: [1.] 1 Clement (ca. A.D. 96); [2.] The Didache (ca. A.D. 80-100?); [3.] Ignatius’ Epistles, written en route to his martyrdom (ca. A.D. 108); and [4.] Pliny’s letter to Trajan (ca. A.D. 110) quoted by Eusebius. In chronological order the next liturgical text is that contained in Justin’s Apology (ca. A.D. 150-153). Of these Pliny’s letter is the only witness that bears in a direct way upon the question of the content of the hymns sung by early Christians and its interpretation is much debated. Ignatius in Ephesians IV describes the Christian worship service using a rather elaborate musical metaphor and supposed ‘hymnic’ passages have been ‘isolated’ in both the Didache and in the letters of Ignatius, but there is nothing in these sources that can with confidence be pointed to as a record of early Christian hymnody. Pliny’s letter thus becomes the only early witness of a positive nature to the hymnody of the early church… …he [Pliny, A.D. 111-112] says that the Christians were in the habit of meeting ‘before dawn on a stated day and singing alternately a hymn to Christ as to God.’ The meaning of the key term carmen (‘hymn’) in this clause has been much debated. On the basis of parallels with the Jewish Sabbath service, C.J. Kraemer and E.C. Ratcliff take it to refer to an Old Testament Psalm. J.B. Lightfoot remarks that the term carmen can be used of ‘any set form of words’ and does not have to presuppose a metrical composition at all. Along the same lines J. Stevenson renders the phrase in question as, ‘recite by turns a form of words.’ In support of this interpretation it is pointed out that the primary meaning of the verb used in the clause (dicere) is ‘to say’ or ‘to declare,’ not ‘to sing.’… The fact of the matter is that none of the current interpretations of Pliny’s letter requires that we see in it a reference to the singing of uninspired compositions, and there is nothing in the passage to preclude its being seen as a reference to the inspired Psalms… … The historical evidence that has come down to us [only some of which has been quoted above] thus presents a picture of widespread commitment to canonical psalmody, a commitment which only gradually deteriorated under the influence of heretical compositions… Attempts to marshal evidence from the post-Apostolic period to buttress attempts to show that uninspired hymns were common in the Apostolic church, are, and always will be, futile.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/michael-bushell.html">Michael Bushell</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Songs of Zion: A Contemporary Case for Exclusive Psalmody</cite>, pp. 154-67.</span></figcaption>

<blockquote><p>St. Paul giving a rule how men should sing, first says, “I will sing in voice, and I will sing with understanding.” And in another place, showing what songs should be song, exhorts the Ephesians to “edify one another with psalms, songs of praise, and such as are spiritual, singing in their hearts to the Lord with thanks giving.” As if the Holy Ghost would say, that the song did inflame the heart to call upon God, and praise him with a more fervent and lively zeal. And as music or singing is natural unto us, and therefore every man delights therein; so our merciful God sets before our eyes, how we may rejoice and singe to the glory of his name, recreation of our spirits, and profit of ourselves. But as there is no gift of God so precious or excellent, that Satan has not after a sort drawn to himself and corrupt, so has he most impudently abused this notable gift of singing, chiefly by the Papists his ministers, in disfiguring it, partly by strange language, that cannot edify, and partly by a curious wanton sort, hiring men to tickle the ears and flatter the fantasies, not esteeming it as a gift approved by the Word of God, profitable for the Church, and confirmed by all antiquity. As, besides other places, is most manifest by the words of Pliny, called the younger, who, when he was depute in Asia unto the Emperor Trajan, and had received charge to inquire out the Christians to put them to death, writ among other things, touching the Christians, “That their manners were to sing verses or psalms early in the morning to Christ their God.” If any, perhaps, would doubt, when, or by whom these churches or assemblies were institute, it is likewise evident, that St. John the Apostle, who, although in Domitian’s time he was banished in the Isle Patmos; yet when Nerva his successor, and next before Trajan reigned, returned to Ephesus, and so planted the churches, as the stories report. Seeing therefore God’s Word does approve it, antiquity bears witness thereof, and best reformed Churches have received the same, no man can reprove it, except he will condemn God’s Word, despise antiquity, and utterly condemn the godly reformed Churches. And there are no songs more appropriate than the Psalms of the Prophet David, which the Holy Ghost has framed to the same use, and commended to the Church, as containing the effect of the whole Scriptures, that hereby our hearts might be more lively touched, as appears by Moses, Hezekiah, Judith, Debora, Mary, Zechariah, and others, who by songs and metre, rather than in their common speech and prose, gave thanks to God for such comfort as He sent them. Here it were to long to entreat of the metre; but for as much as the learned doubt not thereof, and it is plainly proven that the Psalms are not only metre, and contain just pauses, but also have grace and majesty in the verse more than any other places of the Scriptures, we need not to enter into any probation. For they that are skillful in the Hebrew tongue, [Read Moses Chabib, in his books called, מרפא לשון דרכי נרעם] by comparing the Psalms with the rest of the Scriptures, easily may perceive the metre. And to whom is it not known, how the Holy Ghost by all means sought to help our memory, when he fashioned many Psalms according to the letters of the alphabet; so that every verse begins with the letters thereof in order. Sometimes ‘A’ begins the half verse, and ‘B’ the other half; and in another place, three verses, yea and eight verses with one letter, even the Psalm throughout; as if all men should be inflamed with the love thereof, both for variety of matter, and also briefness, easiness, and delectation. Now, to make you privy also why we altered the rhyme in certain places of him, whom for the gifts that God had given him, we esteemed and reverenced, this may suffice: that in this enterprise, we did only set God before our eyes, and therefore weighed the words and sense of the Prophet, rather considering the meaning thereof than what any man had write. And chiefly being in this place, whereas most perfect and godly judgment did assure us, and exhortations to the same encourage us, we thought it better to frame the rhyme to the Hebrew sense, than to bind that sense to the English meter: and so either altered for the better, in such places as he had not attained unto, or else where he had escaped part of the verse, or sometimes the whole, we added the same, not as men desirous to find faults, but only as such which covet to hide them, as the learned can judge.</p></blockquote>

ve it, antiquity bears witness thereof, and best reformed Churches have received the same, no man can reprove it, except he will condemn God’s Word, despise antiquity, and utterly condemn the godly reformed Churches. And there are no songs more appropriate than the Psalms of the Prophet David, which the Holy Ghost has framed to the same use, and commended to the Church, as containing the effect of the whole Scriptures, that hereby our hearts might be more lively touched, as appears by Moses, Hezekiah, Judith, Debora, Mary, Zechariah, and others, who by songs and metre, rather than in their common speech and prose, gave thanks to God for such comfort as He sent them. Here it were to long to entreat of the metre; but for as much as the learned doubt not thereof, and it is plainly proven that the Psalms are not only metre, and contain just pauses, but also have grace and majesty in the verse more than any other places of the Scriptures, we need not to enter into any probation. For they that are skillful in the Hebrew tongue, [Read Moses Chabib, in his books called, מרפא לשון דרכי נרעם] by comparing the Psalms with the rest of the Scriptures, easily may perceive the metre. And to whom is it not known, how the Holy Ghost by all means sought to help our memory, when he fashioned many Psalms according to the letters of the alphabet; so that every verse begins with the letters thereof in order. Sometimes ‘A’ begins the half verse, and ‘B’ the other half; and in another place, three verses, yea and eight verses with one letter, even the Psalm throughout; as if all men should be inflamed with the love thereof, both for variety of matter, and also briefness, easiness, and delectation. Now, to make you privy also why we altered the rhyme in certain places of him, whom for the gifts that God had given him, we esteemed and reverenced, this may suffice: that in this enterprise, we did only set God before our eyes, and therefore weighed the words and sense of the Prophet, rather considering the meaning thereof than what any man had write. And chiefly being in this place, whereas most perfect and godly judgment did assure us, and exhortations to the same encourage us, we thought it better to frame the rhyme to the Hebrew sense, than to bind that sense to the English meter: and so either altered for the better, in such places as he had not attained unto, or else where he had escaped part of the verse, or sometimes the whole, we added the same, not as men desirous to find faults, but only as such which covet to hide them, as the learned can judge.”

— William Whittingham, Prefatory Letter to The Form of Prayers and Ministration of the Sacraments, etc., used in the English Congregation at Geneva: and approved, by the famous and godly learned man, John Calvin (Edinburgh, 1562)">Copy</button><a class="share" href="https://x.com/intent/post?text=%E2%80%9CSt.+Paul+giving+a+rule+how+men+should+sing%2C+first+says%2C+%E2%80%9CI+will+sing+in+voice%2C+and+I+will+sing+with+understanding.%E2%80%9D+And+in+another+place%2C+showing+what+songs+should+be+song%2C+exhorts+the+Ephesians+to+%E2%80%9Cedify+one+another+with+psalms%2C+songs+of+praise%2C+and+such+as+are+spiritual%2C+singing+in+their+hearts+to+the+Lord+with+thanks+giving.%E2%80%9D+As+if+the+Holy+Ghost+would+say%2C+that+the+song+did+inflame+the+heart+to+call+upon+God%2C+and+praise+him+with+a+more+fervent+and+lively+zeal.+And+as+music+or+singing+is+natural+unto+us%2C+and+therefore+every+man+delights+therein%3B+so+our+merciful+God+sets+before+our+eyes%2C+how+we+may+rejoice+and+singe+to+the+glory+of+his+name%2C+recreation+of+our+spirits%2C+and+profit+of+ourselves.+But+as+there+is+no+gift+of+God+so+precious+or+excellent%2C+that+Satan+has+not+after+a+sort+drawn+to+himself+and+corrupt%2C+so+has+he+most+impudently+abused+this+notable+gift+of+singing%2C+chiefly+by+the+Papists+his+ministers%2C+in+disfiguring+it%2C+partly+by+strange+language%2C+that+cannot+edify%2C+and+partly+by+a+curious+wanton+sort%2C+hiring+men+to+tickle+the+ears+and+flatter+the+fantasies%2C+not+esteeming+it+as+a+gift+approved+by+the+Word+of+God%2C+profitable+for+the+Church%2C+and+confirmed+by+all+antiquity.+As%2C+besides+other+places%2C+is+most+manifest+by+the+words+of+Pliny%2C+called+the+younger%2C+who%2C+when+he+was+depute+in+Asia+unto+the+Emperor+Trajan%2C+and+had+received+charge+to+inquire+out+the+Christians+to+put+them+to+death%2C+writ+among+other+things%2C+touching+the+Christians%2C+%E2%80%9CThat+their+manners+were+to+sing+verses+or+psalms+early+in+the+morning+to+Christ+their+God.%E2%80%9D+If+any%2C+perhaps%2C+would+doubt%2C+when%2C+or+by+whom+these+churches+or+assemblies+were+institute%2C+it+is+likewise+evident%2C+that+St.+John+the+Apostle%2C+who%2C+although+in+Domitian%E2%80%99s+time+he+was+banished+in+the+Isle+Patmos%3B+yet+when+Nerva+his+successor%2C+and+next+before+Trajan+reigned%2C+returned+to+Ephesus%2C+and+so+planted+the+churches%2C+as+the+stories+report.+Seeing+therefore+God%E2%80%99s+Word+does+approve+it%2C+antiquity+bears+witness+thereof%2C+and+best+reformed+Churches+have+received+the+same%2C+no+man+can+reprove+it%2C+except+he+will+condemn+God%E2%80%99s+Word%2C+despise+antiquity%2C+and+utterly+condemn+the+godly+reformed+Churches.+And+there+are+no+songs+more+appropriate+than+the+Psalms+of+the+Prophet+David%2C+which+the+Holy+Ghost+has+framed+to+the+same+use%2C+and+commended+to+the+Church%2C+as+containing+the+effect+of+the+whole+Scriptures%2C+that+hereby+our+hearts+might+be+more+lively+touched%2C+as+appears+by+Moses%2C+Hezekiah%2C+Judith%2C+Debora%2C+Mary%2C+Zechariah%2C+and+others%2C+who+by+songs+and+metre%2C+rather+than+in+their+common+speech+and+prose%2C+gave+thanks+to+God+for+such+comfort+as+He+sent+them.+Here+it+were+to+long+to+entreat+of+the+metre%3B+but+for+as+much+as+the+learned+doubt+not+thereof%2C+and+it+is+plainly+proven+that+the+Psalms+are+not+only+metre%2C+and+contain+just+pauses%2C+but+also+have+grace+and+majesty+in+the+verse+more+than+any+other+places+of+the+Scriptures%2C+we+need+not+to+enter+into+any+probation.+For+they+that+are+skillful+in+the+Hebrew+tongue%2C+%5BRead+Moses+Chabib%2C+in+his+books+called%2C+%D7%9E%D7%A8%D7%A4%D7%90+%D7%9C%D7%A9%D7%95%D7%9F+%D7%93%D7%A8%D7%9B%D7%99+%D7%A0%D7%A8%D7%A2%D7%9D%5D+by+comparing+the+Psalms+with+the+rest+of+the+Scriptures%2C+easily+may+perceive+the+metre.+And+to+whom+is+it+not+known%2C+how+the+Holy+Ghost+by+all+means+sought+to+help+our+memory%2C+when+he+fashioned+many+Psalms+according+to+the+letters+of+the+alphabet%3B+so+that+every+verse+begins+with+the+letters+thereof+in+order.+Sometimes+%E2%80%98A%E2%80%99+begins+the+half+verse%2C+and+%E2%80%98B%E2%80%99+the+other+half%3B+and+in+another+place%2C+three+verses%2C+yea+and+eight+verses+with+one+letter%2C+even+the+Psalm+throughout%3B+as+if+all+men+should+be+inflamed+with+the+love+thereof%2C+both+for+variety+of+matter%2C+and+also+briefness%2C+easiness%2C+and+delectation.+Now%2C+to+make+you+privy+also+why+we+altered+the+rhyme+in+certain+places+of+him%2C+whom+for+the+gifts+that+God+had+given+him%2C+we+esteemed+and+reverenced%2C+this+may+suffice%3A+that+in+this+enterprise%2C+we+did+only+set+God+before+our+eyes%2C+and+therefore+weighed+the+words+and+sense+of+the+Prophet%2C+rather+considering+the+meaning+thereof+than+what+any+man+had+write.+And+chiefly+being+in+this+place%2C+whereas+most+perfect+and+godly+judgment+did+assure+us%2C+and+exhortations+to+the+same+encourage+us%2C+we+thought+it+better+to+frame+the+rhyme+to+the+Hebrew+sense%2C+than+to+bind+that+sense+to+the+English+meter%3A+and+so+either+altered+for+the+better%2C+in+such+places+as+he+had+not+attained+unto%2C+or+else+where+he+had+escaped+part+of+the+verse%2C+or+sometimes+the+whole%2C+we+added+the+same%2C+not+as+men+desirous+to+find+faults%2C+but+only+as+such+which+covet+to+hide+them%2C+as+the+learned+can+judge.%E2%80%9D%0A%0A%E2%80%94+William+Whittingham%2C+Prefatory+Letter+to+The+Form+of+Prayers+and+Ministration+of+the+Sacraments%2C+etc.%2C+used+in+the+English+Congregation+at+Geneva%3A+and+approved%2C+by+the+famous+and+godly+learned+man%2C+John+Calvin+%28Edinburgh%2C+1562%29&amp;url=https%3A%2F%2F5solasquotes.github.io%2Fquote%2Faa6a5b1feb.html&amp;via=5Solas" target="_blank" rel="noopener">Share on X</a><a class="perma" href="../quote/aa6a5b1feb.html">Permalink</a><a class="src" href="https://reformedbooksonline.com/singing-of-praise#:~:text=St.%20Paul%20giving%20a%20rule%20how,them%2C%20as%20the%20learned%20can%20judge&amp;text=St.%20Paul%20giving%20a%20rule%20how%20men%20should&amp;text=to%20hide%20them%2C%20as%20the%20learned%20can%20judge" rel="noopener" <blockquote><p>Towards God the duty is set down, that when we are merry and cheerful, to sing psalms and hymns unto God, ver. 16. And therefore St. James saith, chap. 5:13, ‘if any be merry, let him sing psalms ;’ … …a hymn, is a song of thanksgiving for a benefit received, and therefore our Savior, after his supper, sang an hymn, Mt. 26:30, viz., for a particular benefit. Lastly, a song is a more general thing than either the psalm or hymn, viz., wherein we give thanks, not for particular benefits, but for general blessings received at God’s hands, as when David praised the Lord for the works of creation, as the heavens, etc., Ps. 104… Use. These must be spiritual songs, viz. holy psalms and songs, not profane and wicked love-songs…</p></blockquote>

<blockquote><p>Some promoters of singing hymns may differ with the [OPC] majority and minority reports, alleging that perhaps the phrase “singing of psalms” in the Westminster Confession of Faith may not mean that only psalms are to be employed in public worship. Some Presbyterians have argued that the term ‘psalms,’ being a lower case ‘p’ might refer to psalms and hymns. In the original 1648 edition of the Westminster Directory for the Publick Worship of God, the upper case ‘P’ in the term ‘Psalms’ was consistently used;¹ but regardless of which edition is used with consistent upper or lower case, it will make no difference to the true intent of the writers and signers of the Westminster Standards. The following Westminster documents consistently speak of singing psalms, with no mention of hymns: Westminster Confession of Faith (ch. XXI, sec. V), Westminster Form of Presbyterial Church Government (Of the Ordinances in a particular Congregation), and the Westminster Directory for the Publick Worship of God (Of the Sanctification of the Lord’s Day, Of Singing of Psalms). Acknowledging historic Presbyterian familiarity with the Synod of Dordrecht Church Order (1618-19) and the distinction made between psalms and hymns, in all fairness to legislative intent interpretation, the ‘psalms’ or ‘Psalms’ in the Westminster Standards must be biblical psalms of praise. ¹ The Westminster Standards, An Original Facsimile (Audubon, New Jersey: Old Paths Publications, 1997) In the later editions of the Westminster Standards, biblical psalms of praise, were commonly referred to as ‘psalms.’ In the reading of the Scriptures, in The Westminster Directory for the Publick Worship of God, it references exposition of the portion of Scripture read: “let it not be done until the whole chapter of psalm be ended” (Of Public Reading of the Holy Scriptures). Regarding public preaching, it speaks of some ‘text of scripture’; it further orders the use of “some chapter, a psalm, or book of the holy scripture” (Of the Preaching of the Word). In the Directory for the Publick Worship of God, there are parallel and coordinate directives to read or sing a ‘psalm,’ but no directive to sing a hymn. We find this same employment of the term ‘psalm’ or ‘psalms’ in the Authorised King James Version to refer to the Book of Psalms (see Luke 24:44). The London or Baptist Confession of Faith (1689) deliberately altered section V, of the chapter, Of Religious Worship and the Sabbath Day, to read “psalms, hymns, and spiritual songs.” The Baptists understood the legislative intent meaning of the Westminster Confession of Faith to be psalms only, as Ephesians 5:19 and Colossians 3:16 are used as proof-texts for the “singing of psalms with grace in the heart” (West. Con. ch. XXI, sec. V). The Baptists, therefore, decidedly rejected the historic Westminster Presbyterian interpretation of Ephesians 5:19 and Colossians 3:16. The 17th century Westminster Presbyterians interpreted, “psalms, hymns, and spiritual songs” (Eph. 5:19; Col. 3:16) to the Book of Psalms.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/george-bancroft.html">George Bancroft</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Apostolic Church &amp; the Gospel Ministry</cite>, pp. 223-24</span></figcaption>

<blockquote><p>The French Confession [1559] says (article 40) ‘Ajjirmamus ergo parendumesse legibus et statutis, solvenda tributa, subjectionis denique jugum voluntarie tolerandum, etiamsi infideles fuerint magistrates, dummodo Dei summum imperium integrum et illibatum maneat. [Therefore we affirm that obedience must be yielded unto their laws and statutes, that tribute must be paid them, taxes and all other duties, and that we must bear the yoke of subjection with a free and willing mind, although the magistrates are infidels; so that the sovereign government of God may be preserved entire.]’ So clear it is that all active obedience is due to all magistrates, and that that yoke of passive obedience is to be tolerated but conditionally, with a dummodo [so that], ‘so as’ the magistrate violate not the supreme commandment of the King of kings; and we know, accordingly, protestants of that church have taken defensive arms against their king.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/samuel-rutherford.html">Samuel Rutherford</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Lex Rex</cite>, (1644), ch. 43, p. 222</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/civil-government-and-society/resistance-to-tyranny-and-lawful-authority.html">Resistance to Tyranny and Lawful Authority</a></span></div>

<blockquote><p>Understand further that powers are from God, not as pestilence and famine, and wars, and other visitations for sin are said to be from Him, but because He has appointed them for the legitimate and just government of the world. For though tyrannies and unjust exercise of power, as they are full of disorder (ἀταξίας) are not an ordained government, yet the right of government is ordained by God for the well-being of mankind.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/john-calvin.html">John Calvin</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Commentary on Romans</cite>, 13:1</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/civil-government-and-society/resistance-to-tyranny-and-lawful-authority.html">Resistance to Tyranny and Lawful Authority</a></span></div>
<div class="actions"><button class="copy" data-copy="“Understand further that powers are from God, not as pestilence and famine, and wars, and other visitations for sin are said to be from Him, but because He has appointed them for the legitimate and just government of the world. For though tyrannies and unjust exercise of power, as they are full of disorder (ἀταξίας) are not an ordained government, yet the right of government is ordained by God for the well-being of mankind.”

— John Calvin, Commentary on Rom., 13:1">Copy</button><a class="share" href="https://x.com/intent/post?text=%E2%80%9CUnderstand+further+that+powers+are+from+God%2C+not+as+pestilence+and+famine%2C+and+wars%2C+and+other+visitations+for+sin+are+said+to+be+from+Him%2C+but+because+He+has+appointed+them+for+the+legitimate+and+just+government+of+the+world.+For+though+tyrannies+and+unjust+exercise+of+power%2C+as+they+are+full+of+disorder+%28%E1%BC%80%CF%84%CE%B1%CE%BE%E1%BD%B7%CE%B1%CF%82%29+are+not+an+ordained+government%2C+yet+the+right+of+government+is+ordained+by+God+for+the+well-being+of+mankind.%E2%80%9D%0A%0A%E2%80%94+John+Calvin%2C+Commentary+on+Rom.%2C+13%3A1&amp;url=https%3A%2F%2F5solasquotes.github.io%2Fquote%2F0e6c52307d.html&amp;via=5Solas" target="_blank" rel="noopener">Share on X</a><a class="perma" href="../quote/0e6c52307d.html">Permalink</a><a class="src" href="https://reformedbooksonline.com/topics/topics-by-subject/civil-government/resistance-to-tyrrany/quotes-on-resistance-to-tyranny/#:~:text=Understand%20further%20that%20powers%20are%20from,God%20for%20the%20well%2Dbeing%20of%20mankind&amp;text=Understand%20further%20that%20powers%20are%20from%20God%2C%20not&amp;text=ordained%20by%20God%20for%20the%20well%2Dbeing%20of%20mankind" rel="noopener" target="_blank">Read it online · Reformed Books Online</a></div>
</figure><figure class="quote" id="q-bed99c3371" data-kw="">
<blockquote><p>My arguments against the derivation of magistracy from Jesus Christ as Mediator, and against the magistrate’s holding of his office of and under Christ as Mediator, are these: First, this doctrine does evacuate and nullify the civil authority and government of all heathen or pagan magistrates; for which way was the authority of government derived from Christ, and from Him as Mediator, to a pagan magistrate or emperor? If he has not his power from Christ, as Mediator, then He is but a usurper, and has no just title to reign, according to their principles, who hold that all government, even civil, is given to Christ, and to Him as Mediator. Mr. Hussey, forsooth, does learnedly yield the argument, and answers, p. 20, that not only it is a sin to be a heathen, but the government of a heathen is sinful and unlawful; for which he gives this reason, ‘Whatsoever is not of faith is sin.’ He might as well conclude, in that sense, that the best virtues of the heathen were sin, because not of faith; that is, accidentally sin, in respect of the end, or manner of doing, not materially, or in their own nature. Upon the same reason he must conclude, that the government of a heathen magistrate per se [in of itself], simpliciter [essentially], et ex natura sua [out of its nature], unlawful and sinful? Whether has he any just right or title to government and magistracy? If his title to civil magistracy be just, and if his government be in itself materially and substantially lawful, then he must have a commission from Christ, and from him as Mediator. This I suppose cannot be Mr. Hussey’s sense, for he has not answered one syllable to the argument, tending that way. But if the government of a heathen magistrate be in itself materially, substantially, and in the nature of the tenure, sinful and unlawful, so that, as long as he remains a heathen, he has no real right or true title to government, but only a pretended and usurped title (which must needs be Mr. Hussey’s sense, if he has answered anything at all to my argument), then he goes cross not only to the holy men of God in the Old Testament, who honored heathen princes, and were subject to them as to lawful magistrates, but also to the doctrine of Jesus Christ, who taught his disciples to give unto Caesar what is Caesar’s; and of the apostles, who in their time, exhorted the churches to be subject even to the heathen magistrates (for they had no other at that time), to obey them, to pray for them, Rom. 13; Titus 3:1; 1 Tim. 2:1-2; 1 Pet. 2:13-17. It is justly condemned as one of the errors of the Anabaptists, that a heathen magistrate is not to be acknowledged as a lawful magistrate, or as being from God. See Gerhard, Loc. Com., tom. 6, p. 498-9; P. Hinkelmannus, de Anabaptismo, disp. 13, cap. 1 The Scriptures now cited are so clear, that when Mr. Hussey says of the heathen magistrate, ‘Let Baal plead for himself,’ he might as well have said, that Christ and his apostles pleaded for Baal. They that plead for the authority of a heathen magistrate do not plead for Baal, but for God, and for his ordinance; ‘For the powers that be are ordained of God,’ says Paul, speaking even of the heathen magistrates, Rom. 13:1. But what will Mr. Hussey say, if his great master Erastus be found a pleader for Baal as much as I am? Confirm. Thes., lib. 3, cap. 2, p. 184, speaking of the heathen and unbelieving magistrates, before whom the Corinthians went to law one against another, he says, [contains Latin], Is not the ungodly magistrate also preferred by God, that he may defend any of his subjects from injury and violence. Yea, the Scriptures afore touched are so clear in this point, that Gamachaeus, in Primam Secundae, quest. 4-5, cap. 33, though he hold that by human and ecclesiastical right, pagan princes lose their dominion and authority over their subjects when their subjects turn Christians, yet he acknowledges that they still retain their former jurisdiction over those subjects by the law of God and nature. Surely one might as well say, that heathen parents are unlawful, and heathen husbands are unlawful (all which were contrary to the Word of God), as to say that heathen magistrates are unlawful. Take the instance in parents; for all lawful magistrates are fathers by the fifth commandment: Does the paternity of a heathen father differre specie [differ in kind] from the paternity of a Christian father? are they not both lawful parents, being made such by God and nature? are not their children bound to honor them, and be subject to them, and obey them in things lawful? The paternity is the same in se [in principle], but different modaliter [in way], that I may borrow a distinction from Mr. Hussey. The Christian father is sanctified, and qualified to do service to Jesus Christ, as a father, in educating his children Christianly, which a heathen father cannot do. The heathen magistrate and the Christian magistrate are both lawful magistrates, being made such by God and nature, or by election of people. They are both of them to be honored, submitted unto, and obeyed; they are both of them the ministers of God for the good to their people; their power is the same in actu signato [the intent of power], though not in actu exercito [in how the power is actually exercised in specific acts]. The heathen magistrate may do, and ought to do, what the Christian magistrate does; but the Christian magistrate is fitted, qualified, enabled, and sanctified to glorify and serve Jesus Christ as a magistrate, which the heathen magistrate is not.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/george-gillespie.html">George Gillespie</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Aaron’s Rod Blossoming</cite>, bk. 2, ch. 7, pp. 107-8 Gillespie was a Westminster divine.</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/civil-government-and-society/resistance-to-tyranny-and-lawful-authority.html">Resistance to Tyranny and Lawful Authority</a></span></div>

overnment+of+a+heathen+magistrate+be+in+itself+materially%2C+substantially%2C+and+in+the+nature+of+the+tenure%2C+sinful+and+unlawful%2C+so+that%2C+as+long+as+he+remains+a+heathen%2C+he+has+no+real+right+or+true+title+to+government%2C+but+only+a+pretended+and+usurped+title+%28which+must+needs+be+Mr.+Hussey%E2%80%99s+sense%2C+if+he+has+answered+anything+at+all+to+my+argument%29%2C+then+he+goes+cross+not+only+to+the+holy+men+of+God+in+the+Old+Testament%2C+who+honored+heathen+princes%2C+and+were+subject+to+them+as+to+lawful+magistrates%2C+but+also+to+the+doctrine+of+Jesus+Christ%2C+who+taught+his+disciples+to+give+unto+Caesar+what+is+Caesar%E2%80%99s%3B+and+of+the+apostles%2C+who+in+their+time%2C+exhorted+the+churches+to+be+subject+even+to+the+heathen+magistrates+%28for+they+had+no+other+at+that+time%29%2C+to+obey+them%2C+to+pray+for+them%2C+Rom.+13%3B+Titus+3%3A1%3B+1+Tim.+2%3A1-2%3B+1+Pet.+2%3A13-17.+It+is+justly+condemned+as+one+of+the+errors+of+the+Anabaptists%2C+that+a+heathen+magistrate+is+not+to+be+acknowledged+as+a+lawful+magistrate%2C+or+as+being+from+God.+See+Gerhard%2C+Loc.+Com.%2C+tom.+6%2C+p.+498-9%3B+P.+Hinkelmannus%2C+de+Anabaptismo%2C+disp.+13%2C+cap.+1+The+Scriptures+now+cited+are+so+clear%2C+that+when+Mr.+Hussey+says+of+the+heathen+magistrate%2C+%E2%80%98Let+Baal+plead+for+himself%2C%E2%80%99+he+might+as+well+have+said%2C+that+Christ+and+his+apostles+pleaded+for+Baal.+They+that+plead+for+the+authority+of+a+heathen+magistrate+do+not+plead+for+Baal%2C+but+for+God%2C+and+for+his+ordinance%3B+%E2%80%98For+the+powers+that+be+are+ordained+of+God%2C%E2%80%99+says+Paul%2C+speaking+even+of+the+heathen+magistrates%2C+Rom.+13%3A1.+But+what+will+Mr.+Hussey+say%2C+if+his+great+master+Erastus+be+found+a+pleader+for+Baal+as+much+as+I+am%3F+Confirm.+Thes.%2C+lib.+3%2C+cap.+2%2C+p.+184%2C+speaking+of+the+heathen+and+unbelieving+magistrates%2C+before+whom+the+Corinthians+went+to+law+one+against+another%2C+he+says%2C+%5Bcontains+Latin%5D%2C+Is+not+the+ungodly+magistrate+also+preferred+by+God%2C+that+he+may+defend+any+of+his+subjects+from+injury+and+violence.+Yea%2C+the+Scriptures+afore+touched+are+so+clear+in+this+point%2C+that+Gamachaeus%2C+in+Primam+Secundae%2C+quest.+4-5%2C+cap.+33%2C+though+he+hold+that+by+human+and+ecclesiastical+right%2C+pagan+princes+lose+their+dominion+and+authority+over+their+subjects+when+their+subjects+turn+Christians%2C+yet+he+acknowledges+that+they+still+retain+their+former+jurisdiction+over+those+subjects+by+the+law+of+God+and+nature.+Surely+one+might+as+well+say%2C+that+heathen+parents+are+unlawful%2C+and+heathen+husbands+are+unlawful+%28all+which+were+contrary+to+the+Word+of+God%29%2C+as+to+say+that+heathen+magistrates+are+unlawful.+Take+the+instance+in+parents%3B+for+all+lawful+magistrates+are+fathers+by+the+fifth+commandment%3A+Does+the+paternity+of+a+heathen+father+differre+specie+%5Bdiffer+in+kind%5D+from+the+paternity+of+a+Christian+father%3F+are+they+not+both+lawful+parents%2C+being+made+such+by+God+and+nature%3F+are+not+their+children+bound+to+honor+them%2C+and+be+subject+to+them%2C+and+obey+them+in+things+lawful%3F+The+paternity+is+the+same+in+se+%5Bin+principle%5D%2C+but+different+modaliter+%5Bin+way%5D%2C+that+I+may+borrow+a+distinction+from+Mr.+Hussey.+The+Christian+father+is+sanctified%2C+and+qualified+to+do+service+to+Jesus+Christ%2C+as+a+father%2C+in+educating+his+children+Christianly%2C+which+a+heathen+father+cannot+do.+The+heathen+magistrate+and+the+Christian+magistrate+are+both+lawful+magistrates%2C+being+made+such+by+God+and+nature%2C+or+by+election+of+people.+They+are+both+of+them+to+be+honored%2C+submitted+unto%2C+and+obeyed%3B+they+are+both+of+them+the+ministers+of+God+for+the+good+to+their+people%3B+their+power+is+the+same+in+actu+signato+%5Bthe+intent+of+power%5D%2C+though+not+in+actu+exercito+%5Bin+how+the+power+is+actually+exercised+in+specific+acts%5D.+The+heathen+magistrate+may+do%2C+and+ought+to+do%2C+what+the+Christian+magistrate+does%3B+but+the+Christian+magistrate+is+f <blockquote><p>As for such who not only withdraw from this Church [of Scotland] but also have disowned the [Scottish] civil government always since this late happy [Glorious] Revolution [of 1689], and yet take the name of presbyterians to themselves [such as the United Societies and later Reformed Presbyterians], it is to be feared some of them may be under some bad Influence of Jacobites [those loyal to the previous king, James II and the House of the Stuarts], or else to be so weak as not to discern the absurdity of such a practice: And it is more remarkable that since King William came to the throne, these people have neither had minister nor preacher under the name of a presbyterian to countenance them in their sinful courses. And, in the year 1688 and 1689 we were so far from giving any countenance to such courses that we encouraged the publishing the Prince of Orange’s Declaration at Glasgow before it was published in any other place of the kingdom; we prayed publicly for success to his enterprise even before his landing in England; we swore (in the National Covenant renewed at Lesmahagow, March 3, 1689) that we would stand to the defense of his Highness, his person and authority when lawfully chosen and established as king or supreme magistrate over us. The people we preached to, in consequence of this, went to Edinburgh with others and guarded the Convention of Estates, anno 1689, and mustered in one day 1,140 men as a regiment under the command of the right honorable, the late Earl of Angus, to fight for religion and liberty under the authority of King William of glorious memory. All which make it evident that our former testimony against tyranny was from no disloyal principle to magistracy; and consequently that these people never had any encouragement to live as they do.</p></blockquote>

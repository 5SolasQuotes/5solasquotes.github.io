<main class="wrap"><figure class="quote" id="q-98f205ba91" data-kw="">
<blockquote><p>This election supposes that the persons chosen are found amongst others. The word “election” denotes this; it signifies a choosing out. The elect are found by cleansing grace amongst the rest of mankind. They were of the company from amongst whom they are chosen. They were found amongst them not only as they dwell amongst them—elect and reprobate are found mixed together, as tares and wheat—and not only as they are of the same human nature: they are descended of the same first parents and are in the same outward condition.

But they are found amongst them in the same sinfulness and in the same misery. They are alike partakers of original corruption. They are amongst them in the guilt of the first transgression. They are amongst them in being destitute of anything in them that is good. They are amongst them in enmity against God in serving Satan and being in bondage to him. They are amongst them in condemnation to eternal destruction. They are amongst them in being without righteousness. And they are amongst them every way, so that there is no distinction between them prior to the distinction that election makes. There is no respect wherein the elect are not amongst the common multitude of mankind. ‘Tis [that] they are chosen from amongst them, and election makes a distinction; 1 Corinthians 4:7, “Who maketh thee to differ?”; 1 Corinthians 6:11, “Such were some of you.” And therefore,

(2) Nothing foreseen, foreseen excellency or endeavours of the elected, is the motive that influences God to choose them; but election is only from his good pleasure. God’s election being the first thing that causes any distinction, it can be no distinction that is already the foresight of which is to [be] considered as prior, that it influences God to choose them.

It is not the seeing of any amiableness in these above the rest that causes God to choose them rather than the rest. God don’t choose men because they are excellent, but he makes them excellent because he has chosen them. ‘Tis not because God considers them as holy that he chooses them; he chooses them that they might be holy; Ephesians 1:4–5, “According as he hath chosen us in him before the foundation of the world, that we should be holy and without blame before him in love: having predestinated us unto the adoption of children by Jesus Christ to himself, according to the good pleasure of his will.”

God don’t choose them from any foresight of any respect they will have to him more than others. God don’t choose men and set his love upon them because they love him, for he hath first loved us; 1 John 4:10, “not that we loved him, but that he loved us”; and 1 John 4:19, “because he first loved us.”

‘Tis not from any foresight of good works, either any good works that men do before or after conversion. But, on the contrary, men do good works because God hath chosen them; John 15:16, “Ye have not chosen me, but I have chosen you, and ordained you, that you should go and bring forth much fruit, and that your fruit should remain.”

Nor did God choose men because he foresaw that they would believe and come to Christ. Faith is the fruit of election and not the cause of it; Acts 13:48, “As many as were ordained to eternal life believed.” ‘Tis because God hath chosen men that he calls them to Christ and causes them to come to him. To suppose that election is from the foresight of faith is to place calling before election, which is contrary to the order in which the Scriptures represents things; Romans 8:30, “Whom he did predestinate, them he also called.”

‘Tis not from the foresight of any, neither moral nor natural qualifications, or any circumstances, that God chooses men: not because he sees that some men are of a more amiable make, a better natural temper, or genius, not because he foresees that some men will have better abilities and will have more wisdom than others and so will be able to do more service for God than others that he chooses, or because he foresees that they will be great and rich and so under greater advantages to do service for him; 1 Corinthians 1:27–28, “God hath chosen the foolish things of this world to confound the wise; and God hath chosen the weak things of the world to confound the things which are mighty; and base things of the world, and things which are despised, hath God chosen, yea, and things which are not, to bring to naught things that are.”

Nor is it from any foresight of men’s endeavours after conversion, because he sees that some will do much more than others to obtain heaven, that he chooses. But God chooses them and therefore awakens them and stirs them up to strive for conversion; Romans 9:16, “not of him that willeth, but of God that showeth mercy.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/jonathan-edwards.html">Jonathan Edwards</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Christians a Chosen Generation</cite>, (1731) in Mark Valeri (ed.), Sermons and Discourses, 1730-1733: The Works of Jonathan Edwards Volume 17 (New Haven CN: Yale University Press, 2000), pp 279-81.</span></figcaption>

<blockquote><p>True Christians are elect according to the foreknowledge of God the Father; they are such whom God, according to the counsel of His own will, according to His own purpose and grace, chose from all eternity to be a holy and peculiar people to Himself, to glorify Him here on earth that they might be glorified by Him hereafter in heaven. And this election evidences itself in the sanctification of the Spirit.</p></blockquote>

<blockquote><p>God offereth in the covenant excellent benefits, upon gracious terms and conditions: there must be a consent to the terms, as well as an acceptation of the privileges.</p></blockquote>

</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-2a2daaae1f" data-kw="">
<blockquote><p>The end which God aimed at in giving the law of Moses, was not, that any should ever attain to holiness or salvation by condition of perfect or sincere obedience to it; though, if there had been any such way of salvation at that time, it must have consisted in the performance of that law, which was then given to the church, to be a rule of life, as well as a covenant. There was another covenant made before that time with Abraham, Isaac, and Jacob, a covenant of grace, promising all blessings freely through Christ, the promised seed, by which only they were to be saved. And the covenant of the law was added, that they might see their sinfulness, and subjection to death and wrath, and the impossibility of attaining to life or holiness by their works, and be forced to trust on the free promise only for all their salvation, and that sin might be restrained by the spirit of bondage, until the coming of that promised seed Jesus Christ, and the more plentiful pouring out of the sanctifying Spirit, by him. This the apostle Paul shows largely (Gal. 3:15-24; Rom. 5:20,21 and 10:3,4). None of the Israelites under the Old Testament were ever saved by the Sinai covenant; neither did any of them ever attain to holiness by the terms of it. Some of them did indeed perform the commandments of it sincerely, though imperfectly: but those were first justified, and made partakers of life and holiness, by virtue of that better covenant made with Abraham, Isaac, and Jacob, which was the same in substance with the new covenant or testament established by the blood of Christ. Had it not been for the better covenant, the Sinai covenant would have proved to them an occasion of no happiness , but only of sin, despair, and destruction. Of itself it was only a killing letter, the ministration of death and condemnation: and therefore it is now abolished, 2 Cor. 3:6,8,9,11. – We have cause to praise God, for delivering His church, by the blood of Christ, from this yoke of bondage; and we have cause to abhor the device of those that would lay upon us a more grievous and terrible yoke, by turning our very new covenant in a covenant of sincere works, and leaving us no such better covenant, as the Israelites had under their yoke, to relieve us in our extremity.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/walter-marshall.html">Walter Marshall</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Gospel Mystery of Sanctification</cite>, 51</span></figcaption>

</figure><figure class="quote" id="q-cb92350f40" data-kw="">
<blockquote><p>For the better understanding whereof, we are to consider the merits of Christ, and the benefits which we have thereby, according to his own intention expressed in the covenant of grace (the condition whereof is faith,) and are not to extend them to those, to whom they were not intended, CHRIST is the Saviour of the world, yet all are not saved, nor to be saved: for many still remain in the state of damnation. he is the redeemer of mankind, yet all are not actually redeemed; for many still remain in the servitude of sin &amp; satan. For they that commit sin, are the servants of sin. Whereas if the son had made them free, they should have been free indeed. Joh. 8.34.36. God was in Christ reconciling the world unto himself; and yet very many, as they continue in their rebellion against God; so the wrath of God abideth upon them. Joh. 3.36.

Neither ought this to seem strange, seeing the covenant of grace promiseth and assureth, neither salvation, nor remission of sins, nor other benefits of Christ to all, but only to those that believe. So God loved the world that he gave his only begotten son, that whosoever believeth in him should not perish but have life everlasting. John 3.16. Mark. 16.16. he that believeth and is baptized shall be saved, but he that believeth not shall be condemned.</p></blockquote>

-only-for-believers/" rel="noopener" target="_blank">Read it online · Reformed Covenanter</a></div>
</figure><figure class="quote" id="q-0902f1baa4" data-kw="">
<blockquote><p>goodness (bonitas) is that act of the divine will, by which he is disposed to self-communication. Love (amor), that by which God is moved toward created things and bestows blessings on them. Grace (gratia), that by which God is moved to communicate himself to creatures of his own accord, not on grounds of merit or debt. Mercy (misericordia) is the disposition of the divine will to help the wretched, not because of any external cause, but solely of the divine goodness. Hatred (odium) in God indicates either the disapproval of sin, or the will to punish sinners that follows sin, or the denial of those salutary benefits that flow from the divine will. Longing (desiderium) in God indicates that the obedience of human beings is exceedingly pleasing to him, and not without future reward. Hope and expectation (spes et expectatio) in God signify that something is owed. God is said to rejoice (gaudere) when something is pleasing to him. Dread (metus) is something attributed to him, in order to indicate that he desires to prevent evil. Sorrow (tristia) in God indicates something that is exceedingly displeasing to God and contrary to his virtues.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/leonard-riissen.html">Leonard Riissen</a></span><span class="wk"><span class="lbl">Work:</span> <cite>as translated in Richard Muller, Post-Reformation Reformed Dogmatics</cite>, (Baker Academic, 2003), vol. 3, ch. 6.3, Divine Affections &amp; Virtues, A. General Considerations, 3. Doctrinal Conclusions, pp. 560-61</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/the-covenant-of-grace/the-gospel-offer.html">The Gospel Offer</a></span></div>

ef="https://reformedbooksonline.com/on-a-divine-disposition-inclination-willingness/#:~:text=goodness%20%28bonitas%29%20is%20that%20act%20of,God%20and%20contrary%20to%20his%20virtues&amp;text=goodness%20%28bonitas%29%20is%20that%20act%20of%20the%20divine&amp;text=displeasing%20to%20God%20and%20contrary%20to%20his%20virtues" rel="noopener" target="_blank">Read it online · Reformed Books Online</a></div>

<blockquote><p>But at the same time we must observe that the covenant of grace is nothing more than the accomplishment of the eternal counsel of God. The righteousness of faith, of which the sacraments are the seals, and which is promised in the covenant, belongs exclusively to the elect.

Nor must we omit to observe what is here of no small consequence, that the promises of the covenant, including everything it embraces, are not conditional but absolute.

For in the covenant God promises to bestow even those qualifications that are to be regarded as the prerequisites of its ultimate and complete fruition (Jer. 31:32, 33; 32:39, 40). The reason is that the promises of this covenant are founded in the satisfaction and merits of Christ, who has merited for his people not only eternal life but likewise all those benefits without which that life could not be obtained.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/herman-witsius.html">Herman Witsius</a></span><span class="wk"><span class="lbl">Work:</span> <cite>On the Efficacy and Utility of Baptism in the Case of Elect Infants whose Parents are under the Covenant</cite>, (1693), trans. William Marshall, ed. J. Mark Beach in Mid-American Journal of Theology, 17 (2006), pp 136-37.</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/the-covenant-of-grace.html">The Covenant of Grace</a></span></div>
<div class="actions"><button class="copy" data-copy="“But at the same time we must observe that the covenant of grace is nothing more than the accomplishment of the eternal counsel of God. The righteousness of faith, of which the sacraments are the seals, and which is promised in the covenant, belongs exclusively to the elect.

Nor must we omit to observe what is here of no small consequence, that the promises of the covenant, including everything it embraces, are not conditional but absolute.

For in the covenant God promises to bestow even those qualifications that are to be regarded as the prerequisites of its ultimate and complete fruition (Jer. 31:32, 33; 32:39, 40). The reason is that the promises of this covenant are founded in the satisfaction and merits of Christ, who has merited for his people not only eternal life but likewise all those benefits without which that life could not be obtained.”

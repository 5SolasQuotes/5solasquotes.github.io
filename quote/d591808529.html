<main class="wrap"><figure class="quote" id="q-d591808529" data-kw="">
<blockquote><p>How cruel are men grown to their little infants, by keeping of them from the seal of entrance into the Kingdom of heaven, and making their children (their own children) to be just in the same condition with the children of Turks and Infidels? I remember at the beginning of these wars there was a great fear fell upon godly people about their little children, and all their care was for their preservation, and their safety; and for the continuance of the Gospel to them, &amp;c.

But now our little children are likely to be in a worser condition then ever. The Oxford Army labour to steal away the Gospel from them, and the Anabaptist labours to steal away the seal of the covenant of Grace from them; and that which is worser then all, there are some godly people love to have it so. And all this has come upon us as a just punishment for our Baptismal covenant-breaking.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/edmund-calamy.html">Edmund Calamy</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The great danger of covenant-refusing and covenant-breaking</cite>, (London, 1646), p. 24.</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/baptism.html">Baptism</a></span></div>

</figure><figure class="quote" id="q-b066cda5ea" data-kw="">
<blockquote><p>But since before baptism was instituted God’s people had circumcision instead, let us examine how these two signs differ from each other, and in what respects they are alike. From this will appear the anagogic relationship of the one to the other. When the Lord commands Abraham to observe circumcision, he previously states that he will be God to him and his descendants [Gen. 17:7, 10], adding that he possesses the abundance and sufficiency of all things [Gen. 17:1, 6, 8]. This he does in order that Abraham may regard His hand as the source of every good. The promise of eternal life is contained in these words as Christ interprets them, drawing an argument from them for the immortality and resurrection of believers. For Christ says, “He is not the God of the dead but of the living” [Luke 20:38; Matt. 22:32]. Paul also, therefore, when he shows to the Ephesians out of what destruction the Lord has delivered them, from the fact that they had not been admitted into the covenant of circumcision infers that they were without Christ, without God, without hope, strangers to the testaments of promise [Eph. 2:12]—all of which the covenant itself contained. But the first access to God, the first entry into immortal life, is the forgiveness of sins. Accordingly, this corresponds to the promise of baptism that we shall be cleansed. Afterward, the Lord covenants with Abraham that he should walk before him in uprightness and innocence of heart [Gen. 17:1]. This applies to mortification, or regeneration.1 And lest anyone be in doubt, Moses more clearly explains elsewhere, when exhorting the Israelite people to circumcise the foreskin of their heart for the Lord [Deut. 10:16], that circumcision is the sign of mortification; on this account Israel has been chosen as the people of God out of all the nations of the earth [Deut. 10:15]. As God, when he adopts the posterity of Abraham as his people, commands them to be circumcised, so Moses declares that they ought to be circumcised in heart, explaining the true meaning of this carnal circumcision [Deut. 30:6]. Again, that no man should strive after it by his own strength, Moses teaches that it is a work of God’s grace. All these things are so often reiterated by the prophets that there is no need to heap up here the many texts, as they occur repeatedly [Jer. 4:4; Ezek. 16:30]. We have, therefore, a spiritual promise given to the patriarchs in circumcision such as is given us in baptism, since it represented for them forgiveness of sins and mortification of flesh. Moreover, as we have taught that Christ is the foundation of baptism, in whom both of these reside, so it is also evident that he is the foundation of circumcision. For he is promised to Abraham, and in him the blessing of all nations [Gen. 12:2–3]. To seal this grace, the sign of circumcision is added.</p></blockquote>

<blockquote><p>Who are these that fly as a cloud, and as doves to their windows” (Isaiah 60:8)

When preaching on the above text, the early Seceder Ebenezer Erskine distinguished between water baptism and the baptism of the Spirit:

There is the public window of baptism, that initiating ordinance, ‘which signifies and seals our ingrafting into Christ, and our partaking of the benefits of the new covenant, and our engagement to be the Lord’s.’ Sirs, ye are all entered into God’s outer house by this window. O do not stay there, but fly in a little further, even into the chambers of presence. The outward seal of God’s covenant gives you a right to take hold of the covenant, and of Christ the covenant Head; and I may say to you (who have come in at this window of the visible church), what Paul says concerning the Jews, Rom. ix. 4, “To you belongs the adoption, and the glory, and the covenants, and the giving of the law, and the service of God, and the promises;” and therefore take care that you do not forsake your own mercy; never rest until you get the baptism of the Spirit, as well as the baptism of water, by which ye shall be “sealed unto the day of redemption.</p></blockquote>

<blockquote><p>20. It is also pertinent here to know that it is wrong for private individuals to assume the administration of baptism; for this as well as the serving of the Supper is a function of the ecclesiastical ministry. For Christ did not command women, or men of every sort, to baptize, but gave this command to those whom he had appointed apostles. And when he ordered his disciples to do in the ministering of the Supper [Matt. 28:19] what they had seen him do—while he was performing the function of a lawful steward [Luke 22:19]—he doubtless willed that they should follow his example in it. For many ages past and almost from the beginning of the church, it was a custom for laymen to baptize those in danger of death if a minister was not present at the time. I do not see, however, how this can be defended with sound reasoning. Not even the ancient writers themselves, who either followed this practice or condoned it, were certain whether it was right to do it. Now Augustine displays this doubt when he says: “Even if a layman compelled by necessity should give baptism, I do not know whether anyone might piously say that it should be repeated. For if no necessity compels it to be done, it is a usurping of another’s office; but if necessity urges it, it is either no sin at all or a venial one.” 37xConcerning women, it was decreed without exception in the Council of Carthage that they should not presume to baptize at all. Yet (you say) there is danger lest he who is ill, if he die without baptism, be deprived of the grace of regeneration. Not at all. God declares that he adopts our babies as his own before they are born, when he promises that he will be our God and the God of our descendants after us [Gen. 17:7]. Their salvation is embraced in this word. No one will dare be so insolent toward God as to deny that his promise of itself suffices for its effect. Few realize how much injury the dogma that baptism is necessary for salvation, badly expounded, has entailed. As a consequence, they are less cautious. For, where the opinion has prevailed that all are lost who have not happened to be baptized with water, our condition is worse than that of God’s ancient people—as if the grace of God were now more restricted than under the law! For men will think that Christ has come not to fulfill the promises but to abolish them [cf. Matt. 5:17], seeing that the promise (which was then effective enough of itself to confer salvation before the eighth day) [Gen. 17:7; cf. v. 12] now would not be valid without the aid of a sign.

21. The practice before Augustine was born is first of all inferred from Tertullian, who held that a woman was not allowed to speak in the church, and also not to teach, to baptize, or to offer. This was that she might not claim for herself the function of any man, much less that of a priest. Epiphanius also is a trustworthy witness of this matter when he upbraids Marcion for having given women permission to baptize. And I am well aware of the answer of those who think otherwise: that there is a great difference between common usage and an extraordinary remedy required by dire necessity. But since Epiphanius declares that it is a mockery to give women the right to baptize and makes no exception, it is clear enough that he condemns this corrupt practice as inexcusable under any pretext. Also in the third book, where he teaches that permission was not even given to the holy mother of Christ, he adds no reservation.</p></blockquote>

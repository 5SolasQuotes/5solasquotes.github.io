<main class="wrap"><figure class="quote" id="q-d8b6704766" data-kw="">
<blockquote><p>The Religion, Doctrine and Discipline received, believed and defended by the Church of Scotland, and namely the public ministration of Baptism, and the Lord’s Supper, sitting at the table in the act of receiving the bread and wine of that Sacrament, the observation of the Lord’s Day, and the examination of children, for the first time at the ninth year of their age, for the second at the twelfth, for the third at the fourteenth, excluding and abhorring private baptism, private communion, kneeling in the act of receiving the Supper, holy days, or feast of Christmas, Passion, Resurrection, Ascension and sending down of the Holy Ghost: were brought in at the reformation of religion [in 1560], and enjoyed ever since in manner and form as follows. After due trial and advertisement taken of the heads in general and particular above written, the whole church was of one heart and judgment concerning the same…</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/david-calderwood.html">David Calderwood</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Perth Assembly</cite>, 1619, p. 24</span></figcaption>

</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-e8fa779d47" data-kw="">
<blockquote><p>Those days which are consecrated to Christ in the Church, if they are received only for reason of a remembrance of the saving graces of Christ to us, and are retained, in order to make us more certain concerning these matters and actions, and if they are observed without any superstition of the day, in the way that they were celebrated when they were first instituted, not by the Papists, but by the Church), then, let them be retained for the honor of Christ, for as long as it seems good to the pious Church, because they are matters straightaway indifferent, and means. Although, I think and judge that even these days among us (who cannot now doubt concerning the trustworthiness of the Evangelical history; nor do we, by the grace of God, walk amongst the heathens), these days, I say, are to be abolished. For, every day, by the preaching of the gospel, Christ is born, circumcised, dies, and resurrects for us, Heb. 13:8.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/lambert-daneau.html">Lambert Daneau</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Ad tomum I. et II. controversiarum Roberti Bellarmini responsio</cite>, (Joannes le Preux, 1598), pp. 1519–20. The latin was cited by George Gillespie, A Dispute Against the English Popish Ceremonies (Naphtali Press, 2013), p. 50 and Balduin, de Cas. Consc., lib. 2, cap. 12, cas. 1. Trans. Charles Johnson</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/worship/holy-days-and-church-calendar.html">Holy Days and Church Calendar</a></span></div>

ne.com/quotes-on-religious-holidays/#:~:text=Those%20days%20which%20are%20consecrated%20to,and%20resurrects%20for%20us%2C%20Heb.%2013%3A8&amp;text=Those%20days%20which%20are%20consecrated%20to%20Christ%20in&amp;text=circumcised%2C%20dies%2C%20and%20resurrects%20for%20us%2C%20Heb.%2013%3A8" rel="noopener" target="_blank">Read it online · Reformed Books Online</a></div>
</figure><figure class="quote" id="q-fb44c0729d" data-kw="">
<blockquote><p>This one thing, however, we can scarcely refrain from mentioning, with regard to what is written in the 24th chapter of the aforesaid [Second Helvetic] Confession [of 1566] concerning the ‘festival of our Lord’s nativity, circumcision, passion, resurrection, ascension, and sending of the Holy Ghost upon his disciples,’ that these festivals at the present time obtain no place among us; for we dare not religiously celebrate any other feast-day than what the divine oracles have prescribed. Everything else, as we have said, we teach, approve, and most willingly embrace [in the Second Helvetic Confession].</p></blockquote>

</figure><figure class="quote" id="q-03a9544991" data-kw="">
<blockquote><p>…as Didoclavius [David Calderwood] observes (Altar of Damascus, ch. 10, p. 878), aliud est deputare, aliud dedicare, aliud sanctificare; Designation or deputation is when a man appoints a thing for such a use, still reserving power and right to put it to another use, if he please; so the Church appoints times and hours for preaching upon the week days, yet reserving power to employ those times otherwise when she shall think fit. Dedication is when a man so devotes a thing to some pious or civil use that he denudes himself of all right and title which thereafter he might claim unto it: as when a man dedicates a sum of money for the building of an exchange, a judgment-hall, etc. or a parcel of ground for a Church, a Church-yard, a glebe, a school, a hospital; he can claim no longer right to the dedicated thing. Sanctification is the setting apart of a thing for a holy or religious use in such sort that thereafter it may be put to no other use, Prov. 20:25. Now, whereas times set apart for ordinary and weekly preaching are only designed by the Church for this end and purpose, so that they are not holy, but only for the present they are applied to a holy use; neither is the worship appointed as convenient or beseeming for those times, but the times are appointed as convenient for the worship: festival days are holy both by dedication and consecration of them.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/george-gillespie.html">George Gillespie</a></span><span class="wk"><span class="lbl">Work:</span> <cite>English Popish Ceremonies</cite>, (1637), pt. 3, ch. 1, pp. 6-7</span></figcaption>

ligious-holidays/#:~:text=as%20Didoclavius%20%5BDavid%20Calderwood%5D%20observes%20%28Altar,by%20dedication%20and%20consecration%20of%20them&amp;text=as%20Didoclavius%20%5BDavid%20Calderwood%5D%20observes%20%28Altar%20of%20Damascus&amp;text=holy%20both%20by%20dedication%20and%20consecration%20of%20them" rel="noopener" target="_blank">Read it online · Reformed Books Online</a></div>

<blockquote><p>21. Neither are they for stated anniversary feasts or fasts, which are sadly profaned and abused among the Romanists, for at least the superstitious unthinking vulgar make little other use of them than for rioting and raveling, sporting and gamming, and other such dissolute practices, highly unbeseeming days that pass under the character and opinion of holy-days: Yet when emergencies and dispensations of providence occur that call for public humiliation and fasting, or solemn Thanksgiving, they think it their duty to consecrate some part of their time for fasts and thanksgivings, devoutly to deprecate God’s imminent wrath, and to plead the aversion of impendent judgments due to them for their sins, or to praise God for benefits received and to beg further favors; These being such pieces of religious work which God both by his Word and providence sometimes requires. Geneva: Treatise of Fasting; Acts of the Assembly, 1645. ss: Vlt.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/james-clark.html">James Clark</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Presbyterial Government Described, or, A Methodical Synopsis of it, as it is Professed &amp; Practiced in the Church of Scotland</cite>, … (Edinburgh, 1695), no page number</span></figcaption>

<main class="wrap"><figure class="quote" id="q-58f3f585b9" data-kw="">
<blockquote><p>The Equity of our Cause is most evident. The Indian Savages have certainly no Right to murder our Fellow-subjects, living quiet and inoffensive in their Habitations; nor have the French any Power to hound them out upon us, nor to invade the Territories belonging to the British Crown, and secured to it by the Faith of Treaties. This is a clear Case. And it is equally clear, that you are engaged in a Cause of the utmost Importance.

To protect your Brethren from the most bloody Barbarities—to defend the Territories of the best of Kings against the Oppression and Tyranny of arbitrary Power, to secure the inestimable Blessings of Liberty, British Liberty, from the Chains of French Slavery—to preserve your Estates, for which you have sweat and toiled, from falling a Prey to greedy Vultures, Indians, Priests, Friers, and hungry Gallic Slaves, or not-more-devouring Flames—to guard your Religion, the pure Religion of Jesus, streaming uncorrupted from the sacred Fountain of the Scriptures; the most excellent, rational and divine Religion that ever was made known to the Sons of Men; to guard such a dear precious Religion (my Heart grows warm while I mention it) against Ignorance, Superstition, Idolatry, Tyranny over Conscience, Massacre, Fire and Sword, and all the Mischiefs, beyond Expression, with which Popery is pregnant—to keep from the cruel Hands of Barbarians and Papists, your Wives, your Children, your Parents, your Friends—to secure the Liberties conveyed to you by your brave Fore-Fathers, and bought with their Blood, that you may transmit them uncurtailed to your Posterity—these are the Blessings you content for; all these will be torn your eager Grasp, if this Colony should become a Province of France.

And Virginians! Britons! Christians! Protestants! if these Names have any Import or Energy, will you not strike home in such a Cause? Yes, this View of the Matter must fire you into Men; methinks the cowardly Soul must tremble, lest the Imprecation of the Prophet fall upon him, Cursed be the Man that keepeth back his Sword from Blood. To this shocking, but necessary Work, the Lord now calls you, and cursed is he that doth the Work of the Lord deceitfully; that will not put his Hand to it, when it is in his Power, or that will not perform it with all his Might.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/samuel-davies.html">Samuel Davies</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Religion and patriotism the constituents of a good soldier. A sermon preached to Captain Overton’s Independent Company of Volunteers, raised in Hanover County, Virginia, August 17, 1755</cite>, (Philadelphia: James Chattin, 1755), pp 13-14.</span></figcaption>

</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-45e0471d7c" data-kw="">
<blockquote><p>Lastly, they say, ‘Rome cannot be the whore [in Rev. 17], because (forsooth) of her holiness,’ and what is that? There are so many abbacies, mortifications, holy Churchmen, relics and temples of saints, many masses and such like there, etc. All which serve not to prove this conclusion, that she is so. And it is not unobserveable that immediately after this answer, Cornelius à Lapide, professor at Rome, does justify the toleration of stews and brothel-houses in it, as a thing tending to prevent much sin and becoming a well-ordered commonwealth; And when this is mentioned by them as a piece of Rome’s holiness, we may the more easily judge of the rest.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/james-durham.html">James Durham</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Commentary on Revelation</cite>, (1658) ch. 17, Lecture 6, p. 675</span></figcaption>

</figure><figure class="quote" id="q-28472d13d7" data-kw="">
<blockquote><p>To have a scrupulous conscience about matters of indifference argues a weak Christian; for so the Apostle calls them “weak in the faith,” such as bound conscience when Scripture left it free. One believer thought he might eat anything, and another doubted the lawfulness of eating sundry things. Now those who doubted, the Apostle called weak; and the weak conscience is apt to be defiled. Not to know our liberty, and to abuse our liberty, is an argument we have but little grace. Young converts call more things sins than ever God did; they perplex and entangle themselves merely in indifferent things. It is true, there ought to be a conscientious tenderness in all Christians; tenderness of conscience is our duty, but a tormenting, entangling scrupulosity is our infirmity. And yet, as a weak Christian is better than no Christian, a weak faith is better than a seared conscience.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/christopher-love.html">Christopher Love</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Grace: the truth, growth, and different degrees</cite>, ed. Don Kistler (Morgan PA, 1997), pp 17-18.</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/the-christian-life/christian-liberty-and-conscience.html">Christian Liberty and Conscience</a></span></div>

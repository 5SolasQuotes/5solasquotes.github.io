<main class="wrap"><figure class="quote" id="q-c3ce2747fb" data-kw="">
<blockquote><p>…a distinguished privilege belongs to those infants whose benefit it is in divine providence to be born of parents whom the grace of the Most High has honored with the saving fellowship of his covenant… III. This however by no means implies that all the children of pious parents should be regarded as ordained to salvation by the divine appointment. For it is manifest, both from the indubitable records of the sacred volume and the examples there placed beyond controversy, and from the experience of everyday life, that not infrequently the offspring of the best of men grow up with the worst dispositions, wickedly bent upon their own destruction. Still God has given that pledge to pious parents that they may regard their little ones as the children of God by gracious adoption, until, when further advanced, they betray themselves by indications to the contrary, and that they may feel not less secure regarding their children dying in infancy than did Abraham and Isaac of old. … LXXVI. (2) If God usually bestows his grace at the same time as it is exhibited in the sacrament, and in the very administration of baptism both regenerates infants and delivers them from the guilt of original sin, the forwardness of parents in speedily presenting their children for baptism will accelerate their regeneration, with all its consequences, while their negligence will retard it; and thus the influences of divine grace upon the souls of some persons will be usually determined by the activity or the slothfulness of others. … LXXVII. (3) If infants, up to the period of baptism, are the children of wrath, and by receiving baptism pass immediately into a state of grace; and if the salvation of baptized persons dying in infancy is certain, while we have only the judgment of charity regarding the salvation of those not baptized, I repeat, there must be a most inexcusable want of Christian parental love (storges) and of paternal piety, when parents do not, at the very instant of birth, procure that baptism on which so much depends. Nor can those ecclesiastical constitutions be defended with the slightest show of reason, which impose the smallest delay upon the administration of the rite. … LXXIX. In like manner, I profess myself unable to reconcile with these doctrines such things as the following: that baptism is as necessary to salvation as food to the sustenance of life, or medicine to the restoration of health; that it is something approaching to a miracle if anyone is saved without baptism; that since we are not to presume too rashly upon the performance of miracles, the judgment of charity respecting the salvation of those dying without baptism rests upon a very doubtful foundation; and that, in the meanwhile, death supplies the want of baptism in infants, as, according to the Papists, martyrdom does in adults. These things seem to me mutually to refute each other, for if death procures for infants what, according to the Papists, martyrdom procures for adults, the salvation of infants dying without baptism will be as certain as that of those who are baptized. For who in the Romish church has any doubt of the salvation of the martyrs? But where did this great man [Pierre Jurieu] learn that death supplies the want of baptism? Has he been taught it by any testimony of Scripture? Is there otherwise any argument in mere assertion, however emphatic?</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/herman-witsius.html">Herman Witsius</a></span><span class="wk"><span class="lbl">Work:</span> <cite>‘On the Efficacy &amp; Utility of Baptism in the Case of Elect Infants whose Parents are Under the Covenant’</cite>, pp. 127-8 &amp; 184-6 in MJT 17 (2006) 121-190, originally an appendix in William Marshall, Popery in The Full Corn, the Ear, and the Blade; or, The Doctrine of Baptism in the Popish, Episcopalian, and Congregational Churches; with a Defence of the Calvinistic or Presbyterian View (Edinburgh: Paton and Ritchie, 1852).</span></figcaption>

</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-ecdfc48c21" data-kw="">
<blockquote><p>We do not hesitate to pronounce the doctrine of “baptismal regeneration” to be the paramount lie of Satan; the most subtle and fatal weapon which this arch foe of our race ever forged for the destruction of men’s souls in eternal perdition! Do not build your hope of glory upon your baptism. You are lost to all eternity if you do. You must be born again if ever you enter the kingdom of heaven. If you plunge into eternity clutching the airy fiction, the fatal notion, that you passed from spiritual death into spiritual life in your baptism; that in baptism you were regenerated, adopted, justified, made holy and saved; you have staked your eternal happiness upon the most fatal lie! In many instances, the unhappy victim of this delusion passes away, undeceived until the deception is too late to rectify!</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/octavius-winslow.html">Octavius Winslow</a></span><span class="wk"><span class="lbl">Work:</span> <cite>From Grace to Glory</cite></span></figcaption>

</figure><figure class="quote" id="q-3aa24a2f4e" data-kw="">
<blockquote><p>Baptism is a profession of faith in the Father, and the Son, and the Holy Spirit; not of a faith to be obtained through the ordinance, but of a faith already entertained. When the Eunuch applied to Philip for baptism, he said: “If thou believest with all thine heart thou mayest.” Of those who heard Peter’s sermon on the day of Pentecost it is said, “they that gladly received his word were baptized.” (Acts 2:41.) On this point, however, there can be no dispute. The only way in which Romanists and Romanizers evade this argument, is by denying that faith and repentance are the fruits of the Spirit, or of regeneration. They are in their view not gracious, but natural works, works done before regeneration; works which leave the soul in a state of perdition. But in this they contradict the express words of Christ, who says, whosoever believes shall be saved. And, in contradicting Christ, they contradict the whole Bible.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/charles-hodge.html">Charles Hodge</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Systematic Theology</cite>, vol. 3, “Efficacy of Baptism”</span></figcaption>

<blockquote><p>Question 72. Is then the external baptism with water, the washing away of sin itself? Answer. Not at all, for the blood of Jesus Christ only, and the Holy Ghost, cleanse us from all sin. …So when it is said, “Baptism saves us,” is “the washing of regeneration,” and “the washing away of sin;” it is the same thing as to say, Baptism is the sign of all these things. Question 73. Why then doth the Holy Ghost call baptism “the washing of regeneration,” and “the washing away of sins?” Answer. God speaks thus not without great cause, to wit, not only thereby to teach us, that, as the filth of the body is purged away by water, so our sins are removed by the blood and Spirit of Jesus Christ; but especially that, by this divine pledge and sign, he may assure us that we are spiritually cleansed from our sins as really as we are externally washed with water.</p></blockquote>

<div class="actions"><button class="copy" data-copy="“Question 72. Is then the external baptism with water, the washing away of sin itself? Answer. Not at all, for the blood of Jesus Christ only, and the Holy Ghost, cleanse us from all sin. …So when it is said, “Baptism saves us,” is “the washing of regeneration,” and “the washing away of sin;” it is the same thing as to say, Baptism is the sign of all these things. Question 73. Why then doth the Holy Ghost call baptism “the washing of regeneration,” and “the washing away of sins?” Answer. God speaks thus not without great cause, to wit, not only thereby to teach us, that, as the filth of the body is purged away by water, so our sins are removed by the blood and Spirit of Jesus Christ; but especially that, by this divine pledge and sign, he may assure us that we are spiritually cleansed from our sins as really as we are externally washed with water.”

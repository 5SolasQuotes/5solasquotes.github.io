<main class="wrap"><figure class="quote" id="q-00feb2e9e7" data-kw="against will-worship">
<blockquote><p>This would be to approve of will worship (ethelothrēskeias, which he elsewhere condemns); but in the second, for that which is founded on reason and is exercised by reason. That is, Paul uses that which is spiritual and inward, not carnal and outward, by antithesis to the Levitical and Old Testament ceremonial service which was carnal in the offering up of beasts; whereas God now no more requires brutes, but rational and spiritual sacrifices, as Peter calls them (1 Pet. 2:5).</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/francis-turretin.html">Francis Turretin</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Institutes of Elenctic Theology</cite>, 12 / will-worship</span></figcaption>

</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-27b9fb99a7" data-kw="">
<blockquote><p>There is a twofold worship due only to God, internal and external.… Internal, which consists in the acts of the soul and actions answerable thereto. When the mind is most taken up with an object, and the heart and affections most set upon it, this is soul worship, and this is due only to God.… Now according to this distinction of worship there are two sorts of idolatry, 1. Open, outward idolatry.… 2. Secret and soul idolatry, when the mind and heart is set upon anything more than God; when anything is more valued, more intended; anything more trusted, more loved, or our endeavours more for any other thing than God. Then is that soul worship, which is due only to God … given to other things besides him. And this is as true, as heinous idolatry, as the former, though not so open, discernible, nor so much observed.… Secret idolaters shall have no inheritance in the kingdom of God. Soul idolatry will exclude men out of heaven as well as open idolatry. He that serves his lusts is as uncapable of heaven as he that serves, worships idols of wood or stone.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/david-clarkson.html">David Clarkson</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Soul Idolatry Excludes Men Out of Heaven</cite>, on Eph. 5:5 (definition of soul idolatry)</span></figcaption>

</figure><figure class="quote" id="q-6b1f4111a2" data-kw="prescribed by law regulative">
<blockquote><p>Thus there is no work truly and properly good and acceptable to God which does not agree with the law and is not prescribed by it; and whatsoever is not commanded nor forbidden by it is to be considered in its own nature indifferent and left to the freedom of man, unless this freedom has been restricted by some positive law.</p></blockquote>

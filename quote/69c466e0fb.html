<blockquote><p>The question of negro slavery moves ecclesiastical and civil society to their centres. The rights of man have always occupied a prominent place in the testimony of Covenanters; and as we never permitted slaveholders to enjoy the communion of the church, we could not witness the great efforts of British and American philanthropists without deep sympathy. We, as Covenanters, look with peculiar interest at this most intense movement of the public mind, in its bearings on the United States’ Constitution, and on the fourteen state constitutions south of Mason and Dixon’s line, in all of which there are imbodied pro-slavery provisions.

In this view our distinctive principles are justified, as they respect human rights, by these benevolent anti-slavery efforts. On this great topic, a Christian, especially a Reformed Presbyterian magazine should, and by the Divine aid will, speak out in a manner that cannot be misunderstood. We thank God that he has called forth so strong and increasing a host of auxiliaries in pleading the cause of human liberty. We hope and pray that Messiah will lead them all on, as he has done many, to assault the citadel of this despotism—the United States’ Constitution.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/james-m-willson.html">James M. Willson</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Introduction in Covenanter</cite></span></figcaption>
<div class="meta"><span class="t"><a href="../topics/civil-government-and-society/work-wealth-and-poverty.html">Work, Wealth and Poverty</a></span></div>

</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-0486140920" data-kw="">
<blockquote><p>M.—I think I recollect that, towards their subjects, they were to practise the indulgence of fathers to their children, to use the diligence of shepherds in promoting their interest, to behave as generals for the security of their persons, as chief-justices in displaying a pre-eminence of virtue, and as emperors in issuing salutary edicts.

B.—Can he, then, be called a father, who treats his subjects as slaves? or he a shepherd, who does not feed but slay his flock? or he a pilot, whose constant study it is to throw the goods overboard; and who, according to the nautical adage, scuttles the vessel in which he sails?

M.—By no means.

B.—What do you think of the king who governs, not for the benefit of the people, but for the gratification of his own appetites and passions, and is manifestly engaged in an insidious conspiracy against his subjects?

M.—I shall certainly deem him neither a general, an emperor, nor a supreme judge.

B.—Should you, then, observe a man usurping the name of king who excels none of the multitude in any species of virtue, and is even inferior to many, who discovers no paternal affection for his subjects, but crushes them under his proud sway; who considers them as a flock entrusted to him, not for their preservation but for his own emolument; will you reckon him truly a king, though he should stalk along, crowded by a numerous train of guards, and make an ostentatious display of a magnificent dress, and dazzle the eye by exhibiting the sword of the law, and conciliate the favour and applause of the vulgar by prizes, games, processions, mad piles of buildings, and other popular signs of grandeur? Will you, I say, deem him a king?

M.—Not at all, if I mean to be consistent; I must consider him as an outcast from human society.

B.—By what bounds do you circumscribe this human society?

M.—By the very same to which you seemed to me, in your preceding dissertation, to wish it confined to the fences of law; for I see that robbers, thieves, and adulterers, who transgress them, are punished by the public, and that their transgression of the limits prescribed by human society is thought a just cause for their punishment.

B.—What will you say of those who never would come within the pale of human society?

M.—I should consider them as enemies to God and man, and entitled to the treatment, not of men, but of wolves and other noxious animals, which, if bred by any person, are bred to the destruction of himself and of others, and, if killed, are killed to the advantage, not only of the individual, but of the public. Nay, were I empowered to enact a law, I would adopt the Roman method of treating monsters, and order such a race of men to be exposed on some desolate island, or to be sunk in the deep at a distance from the sight of land, lest they should, even when dead, injure the living by their contagion; and publish a decree, that whoever despatched them should be rewarded, not only by the whole people, but by private persons, as is generally done to those who have killed wolves or bears, or seized their cubs.

For, if any such monster were to arise, and to utter human accents, and to have the appearance of a man’s face, and his likeness in every other part, I could never think myself connected with him by any social tie. Or, if any one, divesting himself of humanity, should degenerate into savage barbarity, and refuse to unite with other men, but for men’s destruction, I do not think him entitled to the appellation of man any more than satyrs, apes, or bears, though in his look, gesture, and language, he should counterfeit man.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/george-buchanan.html">George Buchanan</a></span><span class="wk"><span class="lbl">Work:</span> <cite>De Jure Regni Apud Scotos; A Dialogue Concerning the Rights of the Crown in Scotland</cite>, trans. Robert MacFarlan (1579; Colorado Springs: Portage Publications, 2016), pp 42-44.</span></figcaption>

</figure><figure class="quote" id="q-c5c9d752b4" data-kw="">
<blockquote><p>If a people, trusting in the goodness of their prince, enslave themselves to him, and he shall after[ward] turn [a] tyrant, a rash and temerarious surrender obliges not, Et ignorantia facit factum quasi involuntarium. Ignorance makes the fact some way involuntary; for if the people had believed that a meek king would have turned a roaring lion, they should not have resigned their liberty into his hand; and, therefore, the surrender was tacitly conditional to the king as meek, or whom they believed to be meek, and not to a tyrannous lord; and, therefore, when the contract is made for the utility of the one party, the law says, their place is for after wits, that men may change their mind and resume their liberty, though, if they had given away their liberty for money, they cannot recall it; and if violence made the surrender of liberty, here is slavery; and slaves taken in war, so soon as they can escape and return to their own, they are free. (D. Sect. item, ea justit. de rerum divin. I. nihil. F. de rapt. I. 3). So the learned Ferdin. Vasquez (illust. bk. 2, ch. 82, n. 15) says, “The bird that was taken, and has escaped, is free.” Nature in a forced people, so soon as they can escape from a violent conqueror, makes them a free people; and si solo tempore (says Ferd. Vasquez, bk. 2, ch. 82, n. 6) justificatur subjectio, solo tempore facilius justificabitur liberatio.</p></blockquote>

<blockquote><p>Learned politicians, as Bartholomeus Romulus, (Defens. part 1, n. 153, and Joannes de Anania (in c. fin. de his qui fil. occid.) teach… nor is he more to accuse his son, than to accuse himself, because the father loves the son better than himself,” (D. Listi quidem. Sect. Fin. quod, met. caus, et D. L. fin. c. de cura furiosi) and certainly a father had rather die in his own person, as choose to die in his son’s, in whom he affects a sort of immortality, in specie, quando non potest in individuo [in kind when not able in the individual]; but a king does not love his subjects with a natural or fatherly love thus; and if the affections differ, the power which seconds the affection, for the conservation either of being, or well-being, must also differ proportionally.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/samuel-rutherford.html">Samuel Rutherford</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Lex Rex</cite>, ... (1644; Edinburgh: Ogle, 1843), p. 63</span></figcaption>

</figure><figure class="quote" id="q-ae4f51c9f2" data-kw="">
<blockquote><p>It is often assumed that American slavery was wholly the fault of those living in the Southern states of the union; this assumption is crudely reductionist. Indeed, we find Albert Barnes, a New School Presbyterian theologian, arguing that public opinion in the North was often more proslavery than that in the South:

[…] I have been led to apprehend that there are many there [in the South] who, in this respect, are much in advance of many at the North, and that among these are many who exhibit a degree of candour which we do not always find in those portions of our country in which slavery does not exist. There is a hesitancy at the North in speaking of it as an evil; a desire to apologize for it, and even to defend it as a scripture institution, which by no means meets the convictions of the great body of men in the South, and for which they do not thank us. They regard slavery as an unmixed evil – as the direct calamity of their portion of the republic. They consider it to be contrary to the spirit of the Bible. They look upon it as a curse in the midst of which they were born; as an evil entailed upon them without their consent, and which they desire above all things to get rid of. They remember with little gratitude the laws and cupidity of the mother country [Britain] by which it was imposed on them, and the Northern ships by which the inhabitants of Africa were conveyed to their shores; and they little thank the professors in Theological Seminaries, and the pastors of the churches, and the editors of papers, and the ecclesiastical bodies at the North, who labour to convince the world that it is not an evil, and that it is one of the designs and tendencies of Christianity to rivet the curse on them for ever. Such men ask for no defence of slavery from the North. […] There have been more published defences of slavery from the Bible at the North, than there have been from the South.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/albert-barnes.html">Albert Barnes</a></span><span class="wk"><span class="lbl">Work:</span> <cite>An inquiry into the scriptural views of slavery</cite>, (Philadelphia, 1846), pp 9-10.</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/civil-government-and-society/work-wealth-and-poverty.html">Work, Wealth and Poverty</a></span></div>

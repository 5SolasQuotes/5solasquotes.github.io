<blockquote><p>Protestant writers… supposing it [1 Cor. 14:29, 32-33] to hold forth a binding authoritative judgment of the prophets, whereunto any one prophet is bound to be subject, the judgement of his private discretion being always reserved to him, that he give not blind obedience.</p></blockquote>

</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-4a2f105d7d" data-kw="">
<blockquote><p>Moreover, as we may not use any indifferent thing at our own pleasure; so neither may the Church at her will and pleasure command the use of it: but as our practice, so the Church’s injunction must be determined and squared according to the former [three] rules [of using indifferent things (1) to the glory of God, (2)according to the law of charity and (3) purity of conscience]. And if any man think, that in the use of things indifferent he may be led and ruled by the Church’s determination without examining any further, let him understand that the Church’s determination is but a subordinate rule, or a rule ruled by higher rules. … He [Dr. Forbes] has been speaking of the rules which God’s Word gives us concerning the use of things indifferent, and all of them he comprehends under this rule, that we should hear the Church and obey them who are set over us, as if God’s rules were subordinate to men’s rules and not theirs to his. We say not that every man may use things indifferent suo arbitratu [according to his judgment]: but we say withal that neither may the Church command the use of things indifferent, suo arbitratu. Both, she in commanding and we in obeying, must be guided by the rules of Scripture. They who are set over us in the Church have no power given them of Christ which is not for edifying, Eph. 4:12. The council of the apostles and elders at Jerusalem (which is a lively pattern of a lawful synod to the world’s end) professed they would lay no other burden upon the disciples except such things as the law of charity made necessary for shunning of scandal: and so that which they decreed had force and strength to bind, a Charitate propter Scandalum [from charity due to scandal], says Sanctius. But suo arbitratu [by their (mere) judgment] they enjoined nothing. It appears by this place (says [Thomas] Cartwright) that there may be no abridgment of liberty simply decreed, but in regard of circumstance, according to the rule of edification. And if the Church’s decrees and canons be not according to the rules of the Word, yet forasmuch as everyone of us shall give account of himself and his own deed, we must look that whatsoever the Church decree, yet our practice in the use or omission of a thing indifferent, be according to the foresaid rules. We may not for the commandment of men transgress the rule of piety by doing anything which is not for God’s glory and ordered according to his will; neither ought any of us to obey men, except for the Lord’s sake and as the servants of Christ, doing the will of God; which teaches us the manner how we ought to obey men, namely, propter Christum et sicut Christus praecipit [for Christ, as Christ commands]. For if we should know no more but the will of man for that which we do, then we should be the servants of men, not the servants of Christ. Neither yet may we for any human ordinance break the rule of charity: but whatsoever either would weaken or not edify our brother, be it never so lawful, never so profitable to ourselves, never so powerfully by earthly authority enjoined, Christians, who are not born unto themselves, but unto Christ, unto his Church and unto the fellow members, must not dare to meddle with it. Nor lastly may we obey men so as to break the Law of Purity, and perform any action with a doubtful conscience, that is, whereof either the Word has not, or we out of it have no warrant: in which case tender consciences must be tendered, rather than be racked by authority: for be the things in themselves never so lawful, etc., they are utterly unlawful to me without such information. Whereas therefore some say that in the use of matters indifferent, the laws of those who are set over us ought to rule us; we still answer that our practice may not be ruled by any law of man except it be according to the rules of the Word; whereof one is this: Tantum oportere esse obedientiae studium in Christianis, ut nihil agant, quod non existiment vel potius certi sint placere Deo (Calvin on Rom. 14:5).</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/george-gillespie.html">George Gillespie</a></span><span class="wk"><span class="lbl">Work:</span> <cite>A Dispute Against the English-Popish Ceremonies</cite>, ... ([Leiden] 1637), pt. 4, ch. 3, pp. 10-11</span></figcaption>

</figure><figure class="quote" id="q-f84e20c164" data-kw="">
<blockquote><p>We are not our own; therefore, neither is our own reason or will to rule our acts and counsels… let us not make it our end to seek what may be agreeable to our carnal nature… we are God’s; let us therefore live and die to Him (Rom. 14:8); We are God’s; therefore, let his wisdom and will preside over all our actions. We are God’s; to Him, then, as the only legitimate end, let every part of our life be directed. O how great the proficiency of him, who taught that he is not his own, has withdrawn the dominion and government of himself from his own reason that he may give them to God. For as the surest source of destruction to men is to obey themselves, so the only haven of safety is to have no other will, no other wisdom, than to follow the Lord wherever He leads. Let this, then, be the first step, to abandon ourselves, and devote the whole energy of our minds to the service of God. By service, I mean not only that which consists in verbal obedience, but that by which the mind, divested of its own carnal feelings, implicitly obeys the call of the Spirit of God. This transformation (which Paul calls the renewing of the mind, Rom. 12:2; Eph. 4:23) though it is the first entrance to life, was unknown to all the philosophers. They give the government of man to reason alone, thinking that she alone is to be listened to; in short, they assign to her the sole direction of the conduct. But Christian philosophy bids her give place and yield complete submission to the Holy Spirit, so that the man himself no longer lives, but Christ lives and reigns in him (Gal. 2:20).</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/john-calvin.html">John Calvin</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Institutes of the Christian Religion</cite>, bk. 3, ch. 7, section 1</span></figcaption>

<blockquote><p>11. Do not our divines plead for this judgement of private discretion, which ought to be permitted to Christians, when anything is propounded to be believed or done by them? And this, their judgement, is to be seen in their writings against Papists about the controversies de interpretatione Scripturae, deside implicita, etc.</p></blockquote>

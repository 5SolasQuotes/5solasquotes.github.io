<main class="wrap"><figure class="quote" id="q-8f38ca21ce" data-kw="">
<blockquote><p>God is nothing but pure eternity itself. And we cannot conceive of several eternities. For if there are several eternities, they are either without or within one another. But nothing is outside eternity. Therefore, neither is there an eternity outside eternity. Similarly, if eternities are outside one another, they are in different places or times, and this is unrelated to eternity. And so there are not several eternities outside one another. And if one asserts that there are several eternities within one another, such a one ought to know that there is only one and the same eternity, however many times eternity may be replicated upon itself.

For a nature that, replicated upon itself, is always one with itself in complete unity is of higher rank than a nature that admits plurality of itself. For there is diversity where there is plurality. And where there is diversity, there is not complete agreement. For agreement is complete that agrees in one identity and the same unity. Therefore, if complete agreement is better than incomplete agreement — and there cannot be anything incomplete in the highest good (i.e. eternity itself)—the nature of eternity cannot admit plurality. Therefore, there is one and the same, and only one, eternity.

And we likewise say the same about many other things. For example, omnipotence upon omnipotence is only one omnipotence. And I shall propose as an example one of the things that do not have the divine nature, in which the case is similar: a point superimposed on a point is only one point. For points like the midpoint of the world and this moment of time (i.e., the present time) have some comparison to eternity, no small matter for the useful consideration of the same eternity. And so there is need to consider this more broadly in another place. The consideration here suffices only to demonstrate that a simple point (i.e. one without parts), like eternity, is also indivisible, and so a point with a point superimposed without any interval is only one point, just as an eternity with an eternity superimposed is only one eternity.

Therefore, as God is eternity, there are not several gods, since there is no God outside of God, nor does God in God add plurality to God. Therefore, God is always one and the same, and only one. And so when God is generated from God, the offspring is in the parent, and the parent in the offspring (namely, one God the Father and the Son), since the generated is not outside the source of the generated. And when God proceeds from God the Father and the Son, he does not proceed outside God; God (i.e. the Holy Spirit) abides in God from whom he proceeds, and there is one God the Father and the Son and the Holy Spirit. And since this generation and procession are without beginning (otherwise, the eternity generated and the eternity proceeding have a beginning, and this is false), we neither ought nor can in any way conceive that God began to be the Father or the Son or the Holy Spirit.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/anselm-of-canterbury.html">Anselm of Canterbury</a></span><span class="wk"><span class="lbl">Work:</span> <cite>On the Incarnation of the Word</cite>, (c. 1090), 15 in Anselm of Canterbury: The Major Works, eds Brian Davies and Gillian Evans, Oxford World’s Classics (Oxford: Oxford University Press, 1998), pp 257-58.</span></figcaption>

<blockquote><p>When was time created? It is explained. Whether the day was first or night? The latter is affirmed. Whether the foreknowing of times and similar natural things are able to be predicted from the stars? It is distinguished. Whether through the inspection of an astrolabe and through an index of the stars it may be sinful to investigate future things? It is distinguished. Whether an event and actions which depend on the free will of men and are merely contingent by their nature, may be able to be certainly predicted from the stars? It is denied. Since there may be a twofold distinction for the year of the Old Testament, because there is a twofold entrance and twofold exit, which is better and older? It is explained. Whether time may be some precise thing understood from every operation? It is distinguished. Whether time may differ from motion in reality? It is denied with a distinction.</p></blockquote>

<blockquote><p>God is without beginning. “In the beginning God created” the world, Gen. 1:1. God was then before the beginning of it; and what point can be set wherein God began, if he were before the beginning of created things? God was without beginning, though all other things had time and beginning from him. As unity is before all numbers, so is God before all his creatures.</p></blockquote>

<blockquote><p>According to Boethius “eternity is the total and perfect possession of unending life simultaneously” (Consolation of Philosophy 5.6). He expounds this definition as follows: “Whatever lives in time, proceeds in the present from the past to the future; for nothing is constituted in time that can embrace the whole extent of its life, but it does not yet grasp tomorrow and has already lost yesterday. That then which comprehends and as equally possesses the total fullness of unending life, and for which nothing of the future is absent and nothing of the past slipped away, is rightly held to be eternal.” In this definition are found the terms: a) ‘unending’, so that not only are beginning and ending excluded but their possibility too; b) ‘life’, so that the most perfect way of existing, namely as living, is expressed; c) ‘total and perfect possession simultaneously’, so that all succession and change are excluded and so that an eternal being is should to possess simultaneously the fullness of life. Such enduring existence, as will be seen later, belongs to God alone.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/allan-b-wolter.html">Allan B. Wolter</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Little Summary of Metaphysics</cite>, (Milwaukee: Bruce Publishing Co., 1958), ch. 3, article 2, p. 36</span></figcaption>

<blockquote><p>Eternity is God without beginning, without end and without all manner of succession; there is nothing past, nor to come. It was well said of him, who unto the question, ‘What was eternity?’ answered by that word of modesty, ‘I know not: It is the measure (without measure) of the duration of God, according to our apprehension.’ (Quid autem sit aeternitas, quaerat aliquis? Hîc si respondeam per verbum modestiae nescio recta ingenia per se intelligent, a byssum esse.) Three things are requisite thereunto, viz. to be without beginning, without end, and without all change: An unalterable and independing duration: It is all at once, where there is nothing past, nor to come; A remaining NOW. Duration is either increated, viz. eternity, proper to God, or created, viz. eviternity, the duration of the blessed in glory: or time, which is the duration of the corruptible creature: Eternity is a duration, consisting of an eternal NOW, without beginning, and without ending; there is nothing past, nor to come. Eviternity is a duration, having a continuing NOW, with a beginning, but without ending. The duration of angels and of the blessed, in respect of their persons and substances admit of no instant concerning which it can be said that it is past: but in regard of their operations and other accidents, their duration admits of succession. Time is a successive duration, having a beginning and ending, without any remaining NOW.</p></blockquote>

<div class="meta"><span class="t"><a href="../topics/attributes-of-god/eternity.html">Eternity</a></span></div>
<div class="actions"><button class="copy" data-copy="“Eternity is God without beginning, without end and without all manner of succession; there is nothing past, nor to come. It was well said of him, who unto the question, ‘What was eternity?’ answered by that word of modesty, ‘I know not: It is the measure (without measure) of the duration of God, according to our apprehension.’ (Quid autem sit aeternitas, quaerat aliquis? Hîc si respondeam per verbum modestiae nescio recta ingenia per se intelligent, a byssum esse.) Three things are requisite thereunto, viz. to be without beginning, without end, and without all change: An unalterable and independing duration: It is all at once, where there is nothing past, nor to come; A remaining NOW. Duration is either increated, viz. eternity, proper to God, or created, viz. eviternity, the duration of the blessed in glory: or time, which is the duration of the corruptible creature: Eternity is a duration, consisting of an eternal NOW, without beginning, and without ending; there is nothing past, nor to come. Eviternity is a duration, having a continuing NOW, with a beginning, but without ending. The duration of angels and of the blessed, in respect of their persons and substances admit of no instant concerning which it can be said that it is past: but in regard of their operations and other accidents, their duration admits of succession. Time is a successive duration, having a beginning and ending, without any remaining NOW.”

— John Norton, The Orthodox Evangelist, … (London: Macock, 1654), ch. 1, ‘Of the Divine Essence’, pp. 7-8">Copy</button><a class="share" href="https://x.com/intent/post?text=%E2%80%9CEternity+is+God+without+beginning%2C+without+end+and+without+all+manner+of+succession%3B+there+is+nothing+past%2C+nor+to+come.+It+was+well+said+of+him%2C+who+unto+the+question%2C+%E2%80%98What+was+eternity%3F%E2%80%99+answered+by+that+word+of+modesty%2C+%E2%80%98I+know+not%3A+It+is+the+measure+%28without+measure%29+of+the+duration+of+God%2C+according+to+our+apprehension.%E2%80%99+%28Quid+autem+sit+aeternitas%2C+quaerat+aliquis%3F+H%C3%AEc+si+respondeam+per+verbum+modestiae+nescio+recta+ingenia+per+se+intelligent%2C+a+byssum+esse.%29+Three+things+are+requisite+thereunto%2C+viz.+to+be+without+beginning%2C+without+end%2C+and+without+all+change%3A+An+unalterable+and+independing+duration%3A+It+is+all+at+once%2C+where+there+is+nothing+past%2C+nor+to+come%3B+A+remaining+NOW.+Duration+is+either+increated%2C+viz.+eternity%2C+proper+to+God%2C+or+created%2C+viz.+eviternity%2C+the+duration+of+the+blessed+in+glory%3A+or+time%2C+which+is+the+duration+of+the+corruptible+creature%3A+Eternity+is+a+duration%2C+consisting+of+an+eternal+NOW%2C+without+beginning%2C+and+without+ending%3B+there+is+nothing+past%2C+nor+to+come.+Eviternity+is+a+duration%2C+having+a+continuing+NOW%2C+with+a+beginning%2C+but+without+ending.+The+duration+of+angels+and+of+the+blessed%2C+in+respect+of+their+persons+and+substances+admit+of+no+instant+concerning+which+it+can+be+said+that+it+is+past%3A+but+in+regard+of+their+operations+and+other+accidents%2C+their+duration+admits+of+succession.+Time+is+a+successive+duration%2C+having+a+beginning+and+ending%2C+without+any+remaining+NOW.%E2%80%9D%0A%0A%E2%80%94+John+Norton%2C+The+Orthodox+Evangelist%2C+%E2%80%A6+%28London%3A+Macock%2C+1654%29%2C+ch.+1%2C+%E2%80%98Of+the+Divine+Essence%E2%80%99%2C+pp.+7-8&amp;url=https%3A%2F%2F5solasquotes.github.io%2Fquote%2Ff09f8805cf.html&amp;via=5Solas

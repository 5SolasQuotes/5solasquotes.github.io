<main class="wrap"><figure class="quote" id="q-1dd061a1b1" data-kw="">
<blockquote><p>I answer: that for men to pray or prophesy with their heads covered, or with long hair, and women uncovered, were things in their own nature indifferent (unless you make it necessary, as a moral duty for men to pray or prophesy uncovered, and women contra; which no interpreters upon that text do) and yet the apostle enjoins the Corinthians so to do… …in the use of things indifferent; whereas there are at least five [rules] to that purpose: And by the same reason, that the apostle enjoins men to keep decency, he enjoins to keep order; and so other rules, concerning things indifferent. Does not the apostle complain of disorder in the Corinthians preaching covered? yet the contrary order was not necessary, but in itself indifferent.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/daniel-cawdrey.html">Daniel Cawdrey</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Vindiciæ clavium: or, A Vindication of the Keys of the Kingdom of Heaven, into the Hands of the Right Owners... (London, 1645), ch. 6</cite>, pp. 57-58</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/worship/head-coverings-in-worship.html">Head Coverings in Worship</a></span></div>

</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-aacdbafef7" data-kw="">
<blockquote><p>And so he proceeds to answer their next query, which concerned decent behavior of men and women in Church-assemblies… so the man, being inferior to Christ, is yet above the woman, being her head. From which they may understand that order in Church-assemblies is to be observed. …having any covering on his head, that is, having his head and face covered, he dishonors himself, and does an indecent thing against the liberty and dignity of his sex, it being a sign of shame and infamy for a man to have his head covered, but was a sign of power and dominion (in that country) to have his head, and face bare and uncovered… …He further appeals to the common custom of those countries, and demands of them whether it would not be uncomely for men to wear long and dishevelled hair, like women, to whom nature has given long hair for an ornament and a covering, and so to be a token to them of their subjection.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/samuel-cradock.html">Samuel Cradock</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Apostolical History, containing the Acts, Labors, Travels, Sermons, Discourses, Miracles, Successes &amp; Sufferings of the Holy Apostles… (London, 1672), ch. 6, section 7, pp. 171-2 Cradock (1621?–1706) was an English presbyterian.</cite></span></figcaption>
<div class="meta"><span class="t"><a href="../topics/worship/head-coverings-in-worship.html">Head Coverings in Worship</a></span></div>
<div class="actions"><button class="copy" data-copy="“And so he proceeds to answer their next query, which concerned decent behavior of men and women in Church-assemblies… so the man, being inferior to Christ, is yet above the woman, being her head. From which they may understand that order in Church-assemblies is to be observed. …having any covering on his head, that is, having his head and face covered, he dishonors himself, and does an indecent thing against the liberty and dignity of his sex, it being a sign of shame and infamy for a man to have his head covered, but was a sign of power and dominion (in that country) to have his head, and face bare and uncovered… …He further appeals to the common custom of those countries, and demands of them whether it would not be uncomely for men to wear long and dishevelled hair, like women, to whom nature has given long hair for an ornament and a covering, and so to be a token to them of their subjection.”

oken%20to%20them%20of%20their%20subjection&amp;text=And%20so%20he%20proceeds%20to%20answer%20their%20next&amp;text=be%20a%20token%20to%20them%20of%20their%20subjection" rel="noopener" target="_blank">Read it online · Reformed Books Online</a></div>
</figure><figure class="quote" id="q-ebe7e3e6b2" data-kw="">
<blockquote><p>…then he falls to the preaching, which some hear with their heads covered, some otherwise (in that you may do as your health requires)…</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/william-cowper.html">William Cowper</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Seven Days Conference between a Catholic Christian &amp; a Catholic Roman… (London, 1613), the 7th Day, p. 219 Cowper was a Scottish bishop; men being uncovered during the preaching likely reflects the episcopalian practice, imitating Anglicanism, of persons normally having their hats off the whole time they are in the church building, out of a superstitious reverence (unless they keep them on for warmth).</cite></span></figcaption>

</figure><figure class="quote" id="q-15a6d09e85" data-kw="">
<blockquote><p>Part III will find the exact ‘covering’ prohibited to men while ‘praying or prophesying’ (11:4) is less certain [compared to the woman’s covering], though it seems Paul proscribed Corinthian men from wearing any dishonoring covering in the assemblies, namely which hung down from their heads, whether material, a hair–bun or long hair, yet not wreaths, helmets, hats or turbans.</p></blockquote>

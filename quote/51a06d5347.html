<blockquote><p>Every chief householder hath Curam animarum, the charge of the souls of his family (not properly pastoral, but very like it.) He must give an account of the souls, of his Wife, Children, Servants, as well as the Magistrate of the souls of his Subjects, Ezek. 34.10. or the Minister of the souls of his people, Ezek. 2.18. It concerns him therefore very nearly to endeavour to make them Religious, which is the only way to save their souls.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/daniel-cawdrey.html">Daniel Cawdrey</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Family reformation promoted. In a sermon on Joshua, chap. 24. ver. 15.</cite>, (London: John Wright, 1656), pp 23-24.</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/civil-government-and-society.html">Civil Government and Society</a></span></div>

</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-9322c0b889" data-kw="">
<blockquote><p>First, consider they are great things that you trust them with, whom you chose to sit in the great Senate of the Nation; you trust them with your purse, and I am sure most of you account that something, whatever you think of other things; you will know him well, to whom you will give the Key of your chest, where your money lies. You trust them with your liberties and lives, and those your purses have paid soundly for; yea, with your Religion, without which the other are not worth the taking up.

In one word, with all that is dear to you as English men, as Christians, you put that power into their hands, which if they be not the more faithful, they may turn like a cannon upon your own breasts, and so you most truly become felo de se, guilty of your own miseries; and let me tell you, those sorrows have a peculiar bitterness in them above all other, which are not imposed on us, but chosen by us.

Better an enemy should come in and turn us by force of arms, out of possession of these, then we send those that shall vote us out of them, partly because of the little pity we shall deserve, or can reasonably expect from others, when they shall see the rod with which we are whip’t was of our own gathering; as also because of the inward guilt which will add a further stinging consideration then all this to our sorrows, and deprive us of those comforts which the conscience of doing our duty would help us to, in the greatest calamities that otherwise could befall us. He that is accessory to the burning down of his house, by the negligence of a drunken person, whom he trusted to watch and keep it, hath more reason to be troubled, then he that hath it consumed by a fire from heaven, or some other inevitable Providence.

O Sirs, there are less matters then these, in which you would be very choice and curious; if you were to chose a Nurse for your child, you would look for one of a healthful constitution and good disposition, you would weigh and taste her milk whether good or no; You are now to choose Nurses for three Nations, so Magistrates are called in Scripture, Nursing Fathers and Mothers; You are to choose these in a time of these Nations languishing, as the only means under God, (so thought by the best Physicians among us,) to recover the consumptive state of this great body; and will you send any to such a place and work, before you know what milk they have given in their private capacities in the Country?

If you were to choose a Shield, should it be one that would let the arrow come through it, to pierce you to the heart? Magistrates are the Shields of the earth. You value the life of the Nation little, that will put a Shield into its hand you have not well tried; I am sure, David threw away Armour, though it were a Kings, because he had not tried it; in a word, if you were but to choose a Shepherd, or a Herdsman, any should not serve your turn. Pharaoh a King thought it not beneath his care, though in so low a business, Gen. 47.6. If thou knowest any man, saith he to Joseph, of activity amongst thy brethren, make them rulers over my cattle; you are to choose such, as are not to go before beasts, but to lead in and out the Lord’s people and flock.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/william-gurnall.html">William Gurnall</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Magistrate’s Pourtraiture drawn from the Word, and Preached in a Sermon at Stowe-Market in Suffolk, upon August, the 20. 1656. before the Election of Parliament-men for the same County</cite>, (London: Ralph Smith, 1656), pp 23-25.</span></figcaption>

<blockquote><p>For what actions have no good, nor lawfulness, nor aptitude to edify in themselves, these the will of man can never make good, lawful and apt to edify, because only God, whose will is the prime rule of all goodness, can create moral goodness in actions: Not to eat of the fruit of the Tree of Knowledge is only good because God has so appointed in his Law, and to eat of the fruit of that tree had been as lawful and just as not to eat, if God had commanded eating thereof, under promises and threatnings.</p></blockquote>

</figure><figure class="quote" id="q-371541bb79" data-kw="">
<blockquote><p>God’s curse to the woman was in part, ‘I will greatly multiply your sorrow and your conception’ (Gen. 3:16). Just as every other aspect of creation entered into a curse, so too did conception. To ignore the impact of the fall upon procreation is to miss critical changes that have come about that can make conception a sorrow rather than a blessing (things like cancer, high blood pressure, being worn out from running after five children under the age of six, changes to the function of lactation, etc.)… Physiology shows that perfect bodies were designed by God to suppress ovulation as long as there was breastfeeding (up to three years). The Fall has impacted many bodies to override this normal God-given function.</p></blockquote>

<blockquote><p>To open this, consider, That there is a twofold original fountain of Righteousness towards man:

1. There is the immediate command and word of God, and that is called Jus Divinum, Divine Righteousness.

2. There is the Law and Command of Nature, and that is Jus Humanum, An humane Righteousness, or Right: And this is either general, the first and immediate principles of nature, such as the apostle speaks of, Rom. 1, concerning the gentiles, that they had ‘a Law written in their hearts,’ [sic] verse 7 [2:14-15], about just and unjust things, and their consciences accusing or excusing, upon the omission or commission of such things, or else they are more remote and particular dictates, such as the good and wholesome laws of all lawgivers, in respective nations. So what is righteous and just between man and man, is to be determined by the laws of that land where they live: Indeed, if any lawgivers (as some heathenish have) commanded or allowed anything that is against the Law of God, or the universal dictates of right reason; such commands are not worthy the name of laws, they are rather unjust decrees, and so do not bind: But otherwise, the laws of a land determine what is righteous and just between man and man: for although it be God’s command, that a man should not steal, yet they are human laws that give the bounds and proprieties of estates to men: So that we Christians, and the Jews, do something differ about the rules of righteousness and equity; for God was the immediate Lawgiver unto that people: Moses as a messenger from God, received from God’s mouth the Judicial Law, which he delivered to them; so that the Judicial Law appointed by God Himself, was the statute-law of that realm: Their Laws were not human, as all the laws of kingdoms and states are since Christ’s coming, but they were Divine: Their laws about a thief, a murderer, the buyer and the seller, were all Divine laws, because immediately commanded by God, though the matter was merely human. Now its greatly disputed how far these Judicial Laws commanding judgement and justice between man and man, do bind us Christians; and whether all lawgivers and statesmen, are not bound to bring in those Judicial Laws? For who can determine what is righteousness and equity better then God, a righteous and wise God? It’s not pertinent to wade into this excellent question at this time: Though some in this point are very rigid, to make all obligatory, that are not expressly repealed by Christ; and some again are very remiss and lax; yet all conclude that the Moral Equity and Reason that was in every Judicial Law, does bind Christians as well as Jews; and with that we shall conclude this particular, whatsoever law God made about justice, restitution or punishment to the Jews, the equity and reason of that law, does still bind us, though not the particular manner. As for the New Testament, Christ’s Kingdoms was not temporal, or of this world; and therefore He only commands righteousness in the general, and commands that excellent maxim, which an heathen emperor did so much admire, saying, he received it from Christians, ‘What ye would have men do to you, do ye to them, for this is the Law and the Prophets,’ Mt. 7:12… Christ therefore He has only given us general rules of righteousness, and for the particulars, He does command Christians to obey and submit to the wholesome laws of that place where they are; as Rom. 13, ‘Pay tribute to whom tribute, custom to whom custom:’ And this the Scripture does often press, that none might think that the freedom they had by Christ did take them off from human obligations and relations: This was a great temptation, they thought because they were Christians, and made free by Christ, that this also did take them off from obedience to civil magistrates, and from the laws they lived under: No, the Scripture is diligent to teach this, That Christianity and the Gospel does not abolish political and civil government, but rather greatly advances it as an institution of God, pressing obedience thereunto for conscience sake.</p></blockquote>

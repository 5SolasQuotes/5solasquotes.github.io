<main class="wrap"><figure class="quote" id="q-2719866a3b" data-kw="">
<blockquote><p>Right from the beginning of the Revolution [of 1688-1689], there was an awareness by elements of the Societies’ leadership that the age of protests and remonstrances had come to an end and had been replaced by one of deft diplomatic manoeuvres and influencing outcomes. Instead of directly petitioning Orange for a Covenanted settlement, the Societies would renew the Covenants themselves in early March I689 and press other presbyterians to accept a Covenanted settlement through negotiation. Ultimately, that strategy failed. The pursuit of a Covenanted settlement within the fractured denominational landscape of post-Revolutionary Scotland was unrealistic, and in I69o, Shields, Boyd and Linning would lead the majority of the Societies to accept a uncovenanted presbyterian settlement of the Church under protest.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/mark-jardine.html">Mark Jardine</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The United Societies: Militancy, Martyrdom &amp; the Presbyterian Movement in Late-Restoration Scotland, 1679 to 1688 PhD diss. (Univ. of Edinburgh, 2009), Conclusion</cite>, pp. 235-36</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/the-church/schism-and-separation.html">Schism and Separation</a></span></div>

<blockquote><p>as in the case of famous Mr. Alexander Henderson, who, at his first entry to the ministry at Leuchars, was prelatic, and by the bishop of St. Andrews brought in against the parish’s consent, so that, the day of his admission, the Church-doors being shut by the people, they were forced to break in by a window to get him entrance: But a little after, upon the report of a communion where Mr. Bruce was to help, he would needs, from a longing he had for to hear and see such a man, go secretly there, and placed himself in a dark place of the church where he might not be known. When Mr. Bruce was come to the pulpit, he did for a considerable time keep silence, as his manner was; which did some way astonish Mr. Henderson, but much more when he heard the first words wherewith he began, which were these, ‘He that comes not in by the door, but climbs up any other way, the same is a thief and a robber,’ which did, by the Lord’s blessing, at the very present take him by the heart, and had so great an impression on him, that it was the mean of his conversion.</p></blockquote>

rsion" rel="noopener" target="_blank">Read it online · Reformed Books Online</a></div>

<blockquote><p>(2.) [Informatory Vindiction:] ‘We distinguish between a Church in a growing case, coming forward out of darkness, and advancing in reformation, and a Church declining and going back again. In the former many things may be born with, which, in the latter, are noways to be yielded unto, as in the time of the former prelacy many did hear prelatical men,’ etc. In times of defection and division, the Church was declining and going back, and in that case it was needful to be very peremptory in tenaciousness: But now she is growing and coming forward out of darkness, and advancing, though weakly, in reformation; and therefore now, sure it must be born with to hear presbyterian ministers, though formerly guilty of defections, as much as in former times to hear prelatical men. (3.) ‘We diftinguished between a Church and a reformed and settled state, and a Church in a broken and disturbed state.’ In times of defection and division, it was thought the: ‘most lawful expedient and conducive mean for maintaining the attained unto reformation, to abstract and withdraw from such disorders in ministers, which we could not otherwise get rectified.’ But now that is neither the lawful expedient, nor conducible mean to maintain reformation, but rather the way to obstruct it, to withdraw from ministers, whose former disorders we would have rectified in a case where the Church is settled, so far as to have liberty to keep General Assemblies to rectify them, and the government thereof is confirmed with the civil sanction of acts of parliament. … (6.) ‘We distinguished between a faithful and a sinless ministry.’ In times of defection and division, we might, for the want of the former qualification withdraw, that is, when they were not faithful.’ But now when they are more faithful, we cannot withdraw, except we would withdraw from them because they are not sinless, which in no case can be a ground.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/alexander-shields.html">Alexander Shields</a></span><span class="wk"><span class="lbl">Work:</span> <cite>An Enquiry into Church-Communion, or a Treatise against Separation from the Revolution Settlement of this National Church, as it was settled anno 1689 and 1690… (1706; Edinburgh: Gray, 1747)</cite>, pp. 34-35</span></figcaption>

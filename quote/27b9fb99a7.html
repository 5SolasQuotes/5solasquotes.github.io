<main class="wrap"><figure class="quote" id="q-27b9fb99a7" data-kw="">
<blockquote><p>There is a twofold worship due only to God, internal and external.… Internal, which consists in the acts of the soul and actions answerable thereto. When the mind is most taken up with an object, and the heart and affections most set upon it, this is soul worship, and this is due only to God.… Now according to this distinction of worship there are two sorts of idolatry, 1. Open, outward idolatry.… 2. Secret and soul idolatry, when the mind and heart is set upon anything more than God; when anything is more valued, more intended; anything more trusted, more loved, or our endeavours more for any other thing than God. Then is that soul worship, which is due only to God … given to other things besides him. And this is as true, as heinous idolatry, as the former, though not so open, discernible, nor so much observed.… Secret idolaters shall have no inheritance in the kingdom of God. Soul idolatry will exclude men out of heaven as well as open idolatry. He that serves his lusts is as uncapable of heaven as he that serves, worships idols of wood or stone.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/david-clarkson.html">David Clarkson</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Soul Idolatry Excludes Men Out of Heaven</cite>, on Eph. 5:5 (definition of soul idolatry)</span></figcaption>

</figure><figure class="quote" id="q-c204f63b4a" data-kw="">
<blockquote><p>The Papists restrict or bind the worship of Christ to a thing, to which Christ has not restricted it by any express command; and in this way they declare themselves idolaters, no less than if they were to worship Christ at a wall, or if they were to adore him falling down before a pillar. From what has now been said, it is evident that the mass is an idol, formed by Anti-Christ out of various accursed errors and blasphemies, and substituted in the place of the Lord&#x27;s supper, which, for his reason, is properly and necessarily abolished.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/zacharias-ursinus.html">Zacharias Ursinus</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Commentary on the Heidelberg Catechism</cite>, On the Lord&#x27;s Supper (the Mass)</span></figcaption>

</figure><figure class="quote" id="q-170e2c1298" data-kw="">
<blockquote><p>What does it mean to have a god? or, what is God? Answer: A god means that from which we are to expect all good and to which we are to take refuge in all distress, so that to have a God is nothing else than to trust and believe Him from the [whole] heart; as I have often said that the confidence and faith of the heart alone make both God and an idol. If your faith and trust be right, then is your god also true; and, on the other hand, if your trust be false and wrong, then you have not the true God; for these two belong together, faith and God. That now, I say, upon which you set your heart and put your trust is properly your god. Therefore it is the intent of this commandment to require true faith and trust of the heart which settles upon the only true God, and clings to Him alone.… Whatever you lack of good things, expect it of Me, and look to Me for it, and whenever you suffer misfortune and distress, creep and cling to Me. I, yes, I, will give you enough and help you out of every need; only let not your heart cleave to or rest in any other.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/martin-luther.html">Martin Luther</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Large Catechism</cite>, First Commandment</span></figcaption>

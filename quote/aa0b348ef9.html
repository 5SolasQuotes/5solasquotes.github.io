<main class="wrap"><figure class="quote" id="q-aa0b348ef9" data-kw="">
<blockquote><p>His comforts to me are not dealt with a niggard’s hand, but I would fain learn not to idolize comfort, sense, joy, and sweet felt-presence: All these are but creatures, and nothing but the kingly robe, the gold-ring and the bracelets of the Bridegroom: The Bridegroom Himself is better then all the ornaments that are about Him.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/samuel-rutherford.html">Samuel Rutherford</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Joshua Redivivus, or Mr. Rutherford’s Letters</cite>, (1664) | To Mr. David Dickson (197), pp. 381-2</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/civil-government-and-society/marriage-and-family.html">Marriage and Family</a></span></div>

</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-4ef8944025" data-kw="">
<blockquote><p>But perhaps they will object the apostles determination (Acts 15) concerning the Gentiles newly converted to Christianity, that they should abstain from eating of blood and things strangled, which was a Mosaical rite. To which I answer: First, that the apostles in the same place (v. 10) do show, that that burden of legal ceremonies was removed by the death of Christ and buried in his grave. Secondly, they did this in regard of the Jews which dwelt among those Christians for the time, being for peace’s sake, until the Christian Jews were better confirmed in the faith and knowledge of Christ (v. 21). Thirdly, they did it by the special direction of the Holy Ghost (v. 28), for the reason alleged. So as that example being extraordinary, and for the time of the infancy of the Gospel, it is no rule for us to follow now after so long a shining forth of the Gospel. And I might add this moreover, that the apostles did not this alone, but with the whole congregation, the presbyters, or elders, and brethren being joined with them. Whereas our prelates, though, they confess that a General Council has no immediate institution from Christ to determine controversies; but that it was prudently taken up in the Church from the apostles’ example, Acts 15. Yet for all their prudence in taking up that which belongs not unto them, they shew themselves very unfaithful, while they follow not the example of the apostles in determining alone, and not with the whole congregation; and therefore Christians have the less reason to captivate their faith to prelatical decrees, either in a General Council where the Pope of Rome and of Canterbury are the rulers of the rost, or in a convocation, where the Pope of Canterbury is Prime, Primate, Metropolitan, and All, who without the Holy Ghost (which is never given to any such Antichristian assemblies) whatever they decree in point of faith or otherwise, be it never so erroneous, yet they enjoin obedience thereunto by all men, as our Prelate affirms.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/william-prynne.html">William Prynne</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Lord Bishops, None of the Lord’s Bishops. Or A Short Discourse, wherein is Proved that Prelatical Jurisdiction is Not of Divine Institution, but forbidden by Christ Himself</cite>, (1640), ch. 7. Prynne was a prominent Erastian.</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/civil-government-and-society/marriage-and-family.html">Marriage and Family</a></span></div>

</figure><figure class="quote" id="q-ad4c6f2e3d" data-kw="">
<blockquote><p>The godly man will remember that the peace between God and us was made by way of contract, whereby God gives Himself to us in his Son, and we give ourselves to Him. If then any refuse to give himself to God, there is no contract, God will not give Himself to him, and so no peace, for every contract must be mutual. When the one party offers to sign and seal, and the other refuses it, there is no agreement… For, since this covenant is often termed in Scripture a marriage, our soul which is the spouse of Christ must give herself to him as Christ gives Himself to her, else the marriage is void, for it is the mutual consent that makes the marriage.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/jr-perre-du-moulin.html">Perre Du Moulin Jr.</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Other citations (work not named)</cite>, Of Peace &amp; Contentment of Mind (London: 1657), ch. 9, ‘Of Good Conscience’</span></figcaption>

</figure><figure class="quote" id="q-e387a2a2b1" data-kw="">
<blockquote><p>O but we are covetous and soul-thirsty after our own will in the matter of soul-manifestations; either I see little here, or we idol comforts, and would gladly have a Christ of created grace, rather than Christ, or his grace; and when we are thirsting for Christ, it is his comforts, the rings, jewels, bracelets of the Bridegroom, we sick after, rather than Himself; its not an unmixed, nor a poor marriage-love, to marry the riches and possessions, and not the person,</p></blockquote>

</figure><figure class="quote" id="q-30a0357d09" data-kw="">
<blockquote><p>For first although there be accidents or certain adjuncts of worship, yet there is no worship to be simply called accidental, because it has in it the very essence of worship. Secondly, as the least commands of God—even to iotas and tittles—are religiously to be observed (Mat. 5:18-19), so additions which seem very small are by the same reason to be rejected. Thirdly, Moses does seal up even those laws of the place of Divine worship, of the manner, of abstinence from blood, and the like, which must needs be referred to accidental worship (if any such be), with this very caution of not adding or taking away (Deut. 12:32).</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/william-ames.html">William Ames</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Marrow of Modern Divinity</cite>, (1639), book 2, ch. 13, section 21, p. 272-73</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/civil-government-and-society/marriage-and-family.html">Marriage and Family</a></span></div>

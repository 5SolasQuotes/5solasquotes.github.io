<main class="wrap"><figure class="quote" id="q-afa15eee03" data-kw="">
<blockquote><p>Evan. If we look into the word of God, we shall find that the ordinary means and parts of God’s worship, are invocations upon the name of God, ministry and hearing of the word of God, administration and receiving the sacraments, with all helps and furtherances to the right performance of the same.

But to declare this more particularly, First of all, prayer both public and private is required in God’s word, as you may see, (1 Tim. 2:8, Acts 2:21,22, Dan. 6:10).

Secondly, Reading the word, or hearing it read, both publicly and privately, is required in God’s word, as you may see, (Rev. 1:3, Deut. 5:6).

Thirdly, Preaching, and hearing of the word preached, is required in the word of God, as you may see, (2 Kings 4:2, 1 Thess. 2:13).

Fourthly, The administration and receiving the sacrament is required in the word of God, as you may see, (Matt. 3:6, 26:26, 1 Cor. 10:16).

Fifthly, Praising of God, in singing of psalms, both publicly and privately, is required in the word of God, as you may see, (Col. 3:16, James 5:13).

Sixthly, Meditation on the word of God is required in the word of God, as you may see, (Psa. 1:2, Acts 17:11). Seventhly, Conference about the word of God is required in the word of God, as you may see, (Mal. 3:16).

And, Lastly, For the better fitting and stirring us up to the right performance of these duties, religious fasting, both in public and in private, is required in the word of God, as you may see, (Joel 1:14, 2:15). And so also is a religious vow or free promise made to God, to perform some outward work, or bodily exercise for some end, as you may see, (Eccl. 5:3,4). And thus have I shown you what be the means of God’s worship which he hast prescribed in his word.</p></blockquote>

<blockquote><p>10th Question: What duties are done by the minister? A. 1 Reading the Word. Acts 13:27; Col. 4:16 2 Preaching it. Lk. 4:20-21; Acts 13:15 3 Praying and praising God. 1 Cor. 14:15-16; Neh. 8:6 &amp; 9:5-6 4 Administering Sacraments. Mt. 28:19 &amp; 26:26; Acts 20:11 5. Blessing the people. Num. 6:23 In performing the two first (reading and preaching the Word) and the two last (administering Sacraments, and blessing the people) the Minister stands in God’s room, and is his mouth: but in the middlemost duty (praying to God and praising Him) he is the peoples’ mouth to God.</p></blockquote>

<blockquote><p>You also wrote me concerning some supposed image of Christ, which image you wished me to send you. Now what kind of thing is this that you call the image of Christ? I do not know what impelled you to request that an image of Our Saviour should be delineated. What sort of image of Christ are you seeking? Is it the true and unalterable one which bears His essential characteristics, or the one which He took up for our sake when He assumed the form of a servant? . . . Granted, He has two forms, even I do not think that your request has to do with His divine form. . . . Surely then, you are seeking His image as a servant, that of the flesh which He put on for our sake. But that, too, we have been taught, was mingled with the glory of His divinity so that the mortal part was swallowed up by Life. Indeed, it is not surprising that after His ascent to heaven He should have appeared as such, when, while He—the God, Logos—was yet living among men, He changed the form of the servant, and indicating in advance to a chosen band of His disciples the aspect of His Kingdom, He showed on the mount that nature which surpasses the human one—when His face shone like the sun and His garments like light. Who, then, would be able to represent by means of dead colors and inanimate delineations (skiagraphiai) the glistening, flashing radiance of such dignity and glory, when even His superhuman disciples could not bear to behold Him in this guise and fell on their faces, thus admitting that they could not withstand the sight? If, therefore, His incarnate form possessed such power at the time, altered as it was by the divinity dwelling within Him, what need I say of the time when He put off mortality and washed off corruption, when He changed the form of the servant into the glory of the Lord God. . . ? … How can one paint an image of so wondrous and unattainable a form—if the term ‘form’ is at all applicable to the divine and spiritual essence—unless, like the unbelieving pagans, one is to represent things that bear no possible resemblance to anything. . . ? For they, too, make such idols when they wish to mould the likeness of what they consider to be a god or, as they might say, one of the heroes or anything else of the kind, yet are unable even to approach a resemblance, and so delineate and represent some strange human shapes. Surely, even you will agree that such practices are not lawful for us. But if you mean to ask of me the image, not of His form transformed into that of God, but that of the mortal flesh before its transformation, can it be that you have forgotten that passage in which God lays down the law that no likeness should be made either of what is in heaven or what is in the earth beneath? Have you ever heard anything of the kind either yourself in church or from another person? Are not such things banished and excluded from churches all over the world, and is it not common knowledge that such practices are not permitted to us alone? Once— I do not know how—a woman brought me in her hands a picture of two men in the guise of philosophers and let fall the statement that they were Paul and the Saviour—I have no means of saying where she had had this from or learned such a thing. With the view that neither she nor others might be given offence, I took it away from her and kept it in my house, as I thought it improper that such things ever be exhibited to others, lest we appear, like idol worshippers, to carry our God around in an image. I note that Paul instructs all of us not to cling any more to things of the flesh; for, he says, though we have known Christ after the flesh, yet now henceforth know we Him no more. It is said that Simon the sorcerer is worshipped by godless heretics painted in lifeless material. I have also seen myself the man who bears the name of madness57 [painted] on an image and escorted by Manichees. To us, however, such things are forbidden. For in confessing the Lord God, Our Saviour, we make ready to see Him as God, and we ourselves cleanse our hearts that we may see Him after we have been cleansed. . .</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/eusebius-of-caesarea.html">Eusebius of Caesarea</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Art of the Byzantine Empire 312-1453</cite>, (1972, rep. 1986),p. 16-18. Source: Patrologia Graeca 20, 1545 f.</span></figcaption>

d+washed+off+corruption%2C+when+He+changed+the+form+of+the+servant+into+the+glory+of+the+Lord+God.+.+.+%3F+%E2%80%A6+How+can+one+paint+an+image+of+so+wondrous+and+unattainable+a+form%E2%80%94if+the+term+%E2%80%98form%E2%80%99+is+at+all+applicable+to+the+divine+and+spiritual+essence%E2%80%94unless%2C+like+the+unbelieving+pagans%2C+one+is+to+represent+things+that+bear+no+possible+resemblance+to+anything.+.+.+%3F+For+they%2C+too%2C+make+such+idols+when+they+wish+to+mould+the+likeness+of+what+they+consider+to+be+a+god+or%2C+as+they+might+say%2C+one+of+the+heroes+or+anything+else+of+the+kind%2C+yet+are+unable+even+to+approach+a+resemblance%2C+and+so+delineate+and+represent+some+strange+human+shapes.+Surely%2C+even+you+will+agree+that+such+practices+are+not+lawful+for+us.+But+if+you+mean+to+ask+of+me+the+image%2C+not+of+His+form+transformed+into+that+of+God%2C+but+that+of+the+mortal+flesh+before+its+transformation%2C+can+it+be+that+you+have+forgotten+that+passage+in+which+God+lays+down+the+law+that+no+likeness+should+be+made+either+of+what+is+in+heaven+or+what+is+in+the+earth+beneath%3F+Have+you+ever+heard+anything+of+the+kind+either+yourself+in+church+or+from+another+person%3F+Are+not+such+things+banished+and+excluded+from+churches+all+over+the+world%2C+and+is+it+not+common+knowledge+that+such+practices+are+not+permitted+to+us+alone%3F+Once%E2%80%94+I+do+not+know+how%E2%80%94a+woman+brought+me+in+her+hands+a+picture+of+two+men+in+the+guise+of+philosophers+and+let+fall+the+statement+that+they+were+Paul+and+the+Saviour%E2%80%94I+have+no+means+of+saying+where+she+had+had+this+from+or+learned+such+a+thing.+With+the+view+that+neither+she+nor+others+might+be+given+offence%2C+I+took+it+away+from+her+and+kept+it+in+my+house%2C+as+I+thought+it+improper+that+such+things+ever+be+exhibited+to+others%2C+lest+we+appear%2C+like+idol+worshippers%2C+to+carry+our+God+around+in+an+image.+I+note+that+Paul+instructs+all+of+us+not+to+cling+any+more+to+things+of+the+flesh%3B+for%2C+he+says%2C+ <blockquote><p>Let no one deceive you by any means; for that Day will not come unless the falling away comes first, and the man of sin is revealed, the son of perdition (2 Thessalonians 2:3)

5. This apostasy from our Lord’s authority and the interests of his kingdom is some notable and discernible apostasy, and the head patron thereof is Antichrist. The defection is not of one, or a few, or many in divers churches; there have always been backsliders from the faith: 1 John ii. 19, ‘They went out from us, but they were not of us;’ and the spirit of Antichrist wrought in the apostles’ days: 1 John ii. 18, ‘As you have heard that Antichrist shall come, even now there are many Antichrists;’ and again, 1 John iv. 3, we are told of the spirit of Antichrist: ‘And this is that spirit of Antichrist, whereof you have heard that it should come, and even now already is it in the world;’ then described to be afterwards (ver. 5) a worldly spirit: ‘They are of the world, and speak of the world, and the world heareth them.’

Though they profess Christianity, carnal, worldly hypocrites, which never conquered the fleshly mind and interest, have the spirit of Antichrist; these obscure the light, and obstruct the life and love of the gospel — they that wholly affect a life of pomp and ease in the church. Now, this hath always been in all the ages. The false Christians forget their hopes are built upon a crucified Christ, and are to be derived to them from a glorified Christ in the other world — crucified in this world and glorified in the next, — which indeed are the two considerations that keep Christianity pure and lively; that all was purchased by a crucified Christ, and all is dispensed by a glorified Christ; and I wish you would oftener think of it.

But the great apostasy is eminently found in some external visible church, where these corruptions are generally received and defended. For the head of that church is Antichrist, where doctrine is corrupted, and the worship mingled with idolatry, and the government a usurpation, and bent against the holy seed that desire to worship God in spirit and in truth; there is this manifest revolt from and rebellion against God and Christ, though they push with the horns of the lamb.</p></blockquote>

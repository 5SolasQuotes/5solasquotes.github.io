<main class="wrap"><figure class="quote" id="q-60f22a0d15" data-kw="">
<blockquote><p>Now certainly right reason, that lamp and image of God, does not deceive—who denies this except a fool?</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/henricus-pontanus.html">Henricus Pontanus</a></span><span class="wk"><span class="lbl">Work:</span> <cite>‘Funeral Oration for Peter van Mastricht’ in Theoretical Practical Theology</cite>, (RHB), vol. 1, p. lxxxii</span></figcaption>

</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-157f170654" data-kw="">
<blockquote><p>1st Distinction. The Word of God being given to man as a moral agent, is a rule of all his moral actions, but not of actions of art, sciences, disciplines, yea, or of mere nature. … 6. What is warranted by natural reason, is warranted by Scripture, for the Law of nature is but a part of Scripture. 7. Actions are either purely moral, or purely not-moral, or mixed of both: The first has warrant in Scripture, the second none at all, the third requires not a warrant of Scripture every way concludent, but only in so far as they be moral. 8. Matters of mere fact, known by sense and human testimony, are to be considered according to their physical existence, if they be done or not done; if Titus did such a thing or not, such are not in that notion to be proved by Scripture: 2. They may be considered according to their essence and moral quality of good and lawful, bad or unlawful, and so they are to be warranted by Scripture. … * * * 5. Matters of fact are not, and need not be proved by Scripture: 1. Because sense makes them known to us. 2. Their morality is sufficiently known from God’s Word. 3. In matters of fact there may be invincible ignorance: Christ’s resurrection is not a matter of fact, as Hugo Grotius says, but also a matter of Law, as all the miracles and histories in the Word, and to be believed, because God has so spoken in the Word.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/samuel-rutherford.html">Samuel Rutherford</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Divine Right of Church Government</cite>, (London, 1646), ch. 1, question 2, pp. 101-2</span></figcaption>

</figure><figure class="quote" id="q-93e36ab959" data-kw="">
<blockquote><p>If the Scriptures be what they claim to be, the word of God, they are the work of one mind, and that mind divine. From this it follows that Scripture cannot contradict Scripture. God cannot teach in one place anything which is inconsistent with what He teaches in another. Hence Scripture must explain Scripture. If a passage admits of different interpretations, that only can be the true one which agrees with what the Bible teaches elsewhere on the same subject.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/charles-hodge.html">Charles Hodge</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Systematic Theology</cite>, vol. 1, Introduction, ch. 6, §6</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/holy-scripture/interpretation.html">Interpretation</a> › <a href="../topics/holy-scripture/interpretation/the-interpreter-and-judge-of-controversies.html">The interpreter and judge of controversies</a></span><span class="t"><a href="../topics/holy-scripture/sufficiency.html">Sufficiency</a> › <a href="../topics/holy-scripture/sufficiency/scripture-alone.html">Scripture alone</a></span></div>

</figure><figure class="quote" id="q-1219b1eb93" data-kw="">
<blockquote><p>Pedagogically the church is prior to Scripture. But in the logical order Scripture is the sole foundation (principium unicum) of church and theology. In case of conflict between them, the possibility of which can never be denied on a Reformational view, church and confession must yield to Scripture. … Nothing may be put on a level with Scripture. Church, confession, tradition—all must be ordered and adjusted by it and submit themselves to it.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/herman-bavinck.html">Herman Bavinck</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Reformed Dogmatics: God and Creation</cite>, vol. 1: Prolegomena, ch. 2</span></figcaption>

</figure><figure class="quote" id="q-1ee1a05ede" data-kw="">
<blockquote><p>Christ Jesus has so far forth set down and stablished a perfect platform of Church-government in all morals, not only both for the inward, but also for the outward and external government of his House, that He has left no liberty or latitude to magistrates or Churches whatsoever to choose and settle such an orderly form of Church-government or discipline, as is most suitable to their particular civil-government, laws, manners and customs, so this form be not repugnant to the Word of God.</p></blockquote>

<main class="wrap"><figure class="quote" id="q-7126d39207" data-kw="">
<blockquote><p>If I were with [the Cameronian minister] Mr. [James] Renwick, I would put him to call to mind the saying which at his parting I said to him, while he was requiring of me some memorable token, ‘Be not righteous over much, neither make thyself over wise; why shouldest thou destroy thyself?’ Now you understand not this; but remember that this I said to you, that sometime it shall be useful. Now it is time to live according to that word. Oh what need has he now of that admonition! If I were present with them that do adhere to Mr. Renwick, these that refuse to hear ministers, I would show them how great a sin schism is; and that the wrath of God is not far off from them who make and cherish separation. I with tears in the name of Jesus would beg that, leaving schism, they might live with their brethren in peace, love and unanimity. To decline union in every truth is nothing but pride and lordliness… if there be any that in his conscience thinks other ministers ought not to be heard, he errs in simplicity, and it is necessary that most quickly he leave that error.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/wilhelmus-a-brakel.html">Wilhelmus à Brakel</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Maurice Grant, Preacher to the Remnant: The Story of James Renwick</cite>, (Blue Banner Productions, 2009), pp. 140-41</span></figcaption>

kly%20he%20leave%20that%20error" rel="noopener" target="_blank">Read it online · Reformed Books Online</a></div>
</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-9be10c6f93" data-kw="">
<blockquote><p>In matter of hearing, it is not so hard to discern who are to be accounted to speak without God’s commission: because ordinarily, such have either no warrantable call at all (no not in the outward form; and so cannot be accounted but to run unsent) or, by palpable defection from the truth, and commission given them in that call, they have forfeited their commission, and so no more are to be accounted ambassadors to Christ, or watchmen of His flock, than a watchman of the city, is to be accounted an observer thereof, when he has publicly made defection to the enemy, and taken on with him. For we are here to rest in the external call, and not to dispute that which is inward: because it passes our reach; and Christ has furnished his House with external ordinances, for the warranting of his people’s peace in reference to these things: there is therefore great difference to be placed here between one that is called, and one whom we think not worthy to be called: it’s the first that warrants hearing…</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/james-durham.html">James Durham</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Other citations (work not named)</cite>, ch. 1, Lecture 9, ‘Of Reading &amp; Hearing’ in A Commentary upon the Book of the Revelation… (Edinburgh, 1658), pp. 64-66</span></figcaption>

nts%20hearing" rel="noopener" target="_blank">Read it online · Reformed Books Online</a></div>

<blockquote><p>15… As for the differences which arose about the public resolutions [in the late-1640’s], they made a division indeed in the Church, but no schism, at lest in worship (of which we speak), but only in government, except by accident in some places where presbyteries divided themselves, whereupon followed opposite ordinations, which brought in division among the people, some adhering to one minister, some to another. But I never heard that any held it unlawful to hear ministers on either side, though comparatively they judged it duty rather to hear others. By the way I wish the question about hearing of curates had never come a greater length. See below. However (as dogs, they say, gars swine ‘gree (make to agree)) by the reintroduction of prelacy [in 1661] this difference was buried, as fire under ashes.” Ministers, who had before been putting and thrusting at one another, being, by this, put all an one condition, that is, thrust all out together [in 1662, for 30% of the ministry], except those who complied with Prelacy [or rather a relatively low form of episcopacy]. These, and others whom the prelates and tey put in, occupying the room of pastors, debates arose among presbyterians, ministers and others, anent the lawfulness or unlawfulness, duty or sin of hearing them. Some pleading compliance in hearing, to prove it sinful; some pleading separation in withdrawing to prove hearing to be duty: Some pleading soundness in doctrine to prove it lawful and duty to hear, some pleading corruption in government to prove it unlawful and sinful. And though these different pleadings, accompanied with different practices, in hearing or not hearing curates, as they were called, made no schism among presbyterians. In regard, ministers, who heard and who heard not, preached sometimes privately; and people of either practice heard any of them indifferently. Yet, in these debates, some laid down principles, which, if followed out, would oblige them to hear none that were not of their mind or way, in all matters whether of judgment or practice, which were too much improven afterward. (See Dr. [Gilbert] Rule’s Rational Defence of Non-Conformity, and Mene Tekel)</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/gavin-hamilton.html">Gavin Hamilton</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Just Reflections upon a Pamphlet entitled, A Modest Reply to a Letter from a Friend to Mr. John M’millan</cite>, ([Edinburgh?], 1712), p. 17</span></figcaption>

</figure><figure class="quote" id="q-2be9b15777" data-kw="">
<blockquote><p>It is most probable that no gift, no pains a man takes to fit himself for preaching, shall ever do good to the people or himself, except a man labor to have and keep his heart in a spiritual condition before God, depending on Him always for furniture and the blessing. Earnest faith and prayer, a single aim at the glory of God, and good of people, a sanctified heart and carriage, shall avail much for right preaching. There is sometime somewhat in preaching that cannot be ascribed either to the matter or expression, and cannot be described what it is, or from whence it comes, but with a sweet violence, it pierces into the heart and affections, and comes immediately from the Lord. But if there be any way to attain to any such thing, it is by a heavenly disposition of the speaker.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/john-livingstone.html">John Livingstone</a></span><span class="wk"><span class="lbl">Work:</span> <cite>‘Remarks on Preaching and Praying in Public by John Livingstone’, in Scottish Puritans: Select Biographies</cite>, vol. 1, p. 287</span></figcaption>

</figure><figure class="quote" id="q-353437fd6b" data-kw="">
<blockquote><p>The light of nature, which is a spark of the will of God, has taught many useful rules even to pagans, anent the right way of making solemn speeches before others, the most of which are to be applied to preaching with due discretion; so that what is thought unseemly in the one is to be avoided in the other. But the best rules are taken from the preachings of Christ, of the apostles and prophets.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/john-livingstone.html">John Livingstone</a></span><span class="wk"><span class="lbl">Work:</span> <cite>‘Remarks on Preaching and Praying in Public by John Livingstone’, in Scottish Puritans: Select Biographies</cite>, vol. 1, p. 288</span></figcaption>

<blockquote><p>XXXV. The argument drawn from ‘the abstemious,’ who commune only under one kind, cannot favor our opponents. The insuperable exception of a few ought not to overthrow a general rule. Their abstaining from the cup is not voluntary and free (which would be altogether culpable), but involuntary and invincible on account of a natural and unavoidable inability. Therefore, if they do not use the cup, they are not on that account to be considered as violators of the divine command, because the precept has reference only to those who can use wine and not to those in whom God has placed such an invincible impediment (and whom on that account He wished to dispense [dispensare] from this precept). But so far is this from infringing the command of Christ that it rather strengthens it the more, as an exception added to a rule is wont to bind it more strongly. For since they only are excused from taking the cup who have a disgust for wine, by that very thing all others are determined to be bound to receive it. This is illustrated by the example of the deaf; for although the command to hear the Word is given to all, it binds only those who can hear and not the deaf. And if the deaf are exempted from it, falsely would anyone infer from this that it was also lawful for others to be excepted. XXXVI. The article of discipline of our churches by which the abstemious are excused from the use of the cup, provided they show reverence only by the movement of the cup to the mouth (by which they follow the institution of Christ and do not abstain from it through contempt but from inability), cannot help the Romanists (cf. ‘The Discipline of the Reformed Churches of France,’ 12, Canon 7 in Quick, Synodicon [1692], 1:xlviii). (1) Our practice differs widely from the Roman. It is one thing to bear with the weakness of those who cannot use wine; another to takw away from and prohibit the cup to those who are without such weakness. The former is done by us; the latter by Romanists. (2) The article of discipline is a work of charity and accommodation (synkatabaseos) towards a few out of unavoidable necessity. But the dogma of the Romanists is an absolute and simple interdiction towards all without necessity and against the express command of Christ. (3) The discipline does not intend that the species of the sacrament should be divided; nay, it intends that the sacrament should be retained entire and be conjointly extended and distributed to the people by the ministers (although both species cannot be received by the abstemious, but only one). But the Roman doctrine and practice wishes the sacrament to be divided and the communion mutilated by the priests. According to us the abstemious ought not only to desire the cup, but also to do everything to overcome their weakness; but the Romanists so take away the cup from the people that it is wrong for them to ask for it or to touch it. In one word, while according to our opinion nobody is kept from the use of the cup; nay, pastors are commanded to offer both kinds and believers to do all they can for its reception; by the Romanists the use of the cup is expressly forbidden to the people. It is evident that there is a great and wide difference between our opinion and theirs. XXXVII. Now although the abstemious receive the sacrament only under one kind, their communion is not on that account to be considered wholly profitless (illusoria). (1) The entire sacrament is extended to them by the minister and if they are compelled to abstain from one kind, it is not done spontaneously and contemptuously, but from sheer weakness and unavoidable necessity. (2) Although the species in the sacrament are indivisible by the ordination of God, this has respect to those only who can use them and not to others (whom He Himself dispenses by the obstacle placed in their way). For as He made the law, so He alone can dispense from it whom He pleases; and separate the species in certain cases, who joined them and willed them to be joined. (3) The defect of use (or of either species through the taste) can in some measure be supplied both by the wish and from the sight, touch, smell and other sensations. (4) Although both signs are not received, they do not cease to be made partakers of the whole thing signified, which is indivisible.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/francis-turretin.html">Francis Turretin</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Institutes of Elenctic Theology</cite>, (P&amp;R), vol. 3, 19th Topic, Question 25, ‘Communion under Both Kinds’, sections 35-37, pp. 463-4 This is contra Rome withholding the cup from the laity.</span></figcaption>

<blockquote><p>‘Occasional‘, properly, is that which has a reason, not from the nature of the thing itself, but from such occasional occurrences of providence, as God will not alter, and its that which has no moral nor sacred conveniency with the nature of worship, but has only a conveniency for such a time and place, as Christ’s preaching in a ship, when He is at the sea side, and a multitude are to hear Him, the ship has no agreement with the nature of preaching, more than a house has. Time, place, and persons are clearly such as agreed with that [Last] Supper, as [a supper] first, not as a sacred worship; and therefore [these particulars] were merely occasional, and so not imitable [by us]; and though Christ might have altered them, yet had they been occasional, and they have no sacred conveniency with this Supper, as this Supper; and if Christ had altered these for mere will, upon no reasons that concerns all suppers, they had not been occasional, but positive points of worship, and so had obliged us;</p></blockquote>

<blockquote><p>Let God be ‘praised in the dance with timbrel and harp,’ according to the usage of the Old-Testament church very early (Ex. 15:20), where we find God praised with timbrels and dances. Those who from this urge the use of [instrumental] music in religious worship must by the same rule introduce dancing, for they went together, as in David’s dancing before the ark, and Judg. 21:21. But, whereas many scriptures in the New Testament keep up singing as a gospel-ordinance, none provide for the keeping up of [instrumental] music and dancing; the gospel-canon for psalmody is to sing with the spirit and with the understanding.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/matthew-henry.html">Matthew Henry</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Commentary on Psalms</cite>, 149, verse 4</span></figcaption>

<blockquote><p>As I am not willing to thrust any man into extremes, nor to trouble men with calling those sins which God has not forbidden; So I have reason to advise men to go in doubtful cases on the safer side; much more to disuade them from undoubted sin, and especially from great and multiplyed sins:</p></blockquote>

<blockquote><p>…I will set down a catalogue of inventions of men used for religious ends and uses without any commandment of God, and that both before the Law and under the Law, and under the Gospel. First, before the Law we read of these things: The laying of the hand under the thigh in swearing, Gen. 24, etc. [Gen. 24:26, “And the man bowed down his head, and worshipped the Lord.”] Jacob’s pillar erected, as a religious monument, Gen. 28:18. Secondly, under the Law we read of these instances: [Josh. 7:6, “And Joshua rent his clothes, and fell to the earth upon his face before the ark of the Lord until the eventide, he and the elders of Israel, and put dust upon their heads.”] The altar of the two tribes and a half, Josh. 22:10 &amp; 27:30. [Josh. 24:25-27, “So Joshua made a covenant with the people that day, and set them a statute and an ordinance in Shechem. And Joshua wrote these words in the book of the law of God, and took a great stone, and set it up there under an oak, that was by the sanctuary of the Lord. And Joshua said unto all the people, Behold, this stone shall be a witness unto us; for it hath heard all the words of the Lord which he spake unto us: it shall be therefore a witness unto you, lest ye deny your God.] [1 Sam. 7:5-6, “Samuel said, Gather all Israel to Mizpeh, and I will pray for you unto the Lord. And they gathered together to Mizpeh, and drew water, and poured it out before the Lord, and fasted on that day, and said there, ‘We have sinned against the Lord.&#x27;”] David’s dancing and playing on all sorts of instruments and songs before the ark, 1 Chron. 13:8 and 15:16 and 2 Sam. 6:14. David’s wearing of a linen ephod, the garment of the Levites, 1 Chron. 15:27. David’s appointing of the offices of the Levites and his bringing in of the new order of singing men into the Temple, 1 Chron. 24 &amp; 25. The use of sackcloth and ashes in fasting. Solomon built another altar besides the altar of the Lord, 2 Chron. 7:7. Hezekiah kept the Passeover at a time not appointed by the Law, and the people kept it seven days longer, 2 Chron. 30:2-3, 23. About the celebration of the Passover, it is manifest that the godly Jews brought in of their own heads: 1. The gesture of sitting, which Christ Himself also used. 2. The solemn use of the cup, of which mention is made also that Christ used it, Lk. 22:17. The Rechabites abstinence not only from wine (according to the Law of the Nazarites), but from husbandry and houses, Jer. 35. The Jews had everywhere synagogues, which were not commanded by the Law, Lk. 7:5. [Jer. 34:18-19, “And I will give the men that have transgressed my covenant, which have not performed the words of the covenant which they had made before me, when they cut the calf in twain, and passed between the parts thereof, The princes of Judah, and the princes of Jerusalem, the eunuchs, and the priests, and all the people of the land, which passed between the parts of the calf;”] Mordecai appointed the feasts of Pur, or ‘lots’. Judas Maccabeus appointed the feast of Tabernacles, which our Saviour graced with his presence [Jn. 7:2]. Thirdly, under the Gospel: Our Savior Christ approved the gesture of sitting and the cup at the Passover, the Jewish synagogues, and the feast of Tabernacles. The apostle Paul used the Jewish ceremonies when they were no more the ordinances of God, as circumcision, shaving the head, purifying, vowing, contributing, yea sacrificing, Acts 21. Abstaining from meat sacrificed to idols. The observation of the Jewish Sabbath. The women’s coverings, 1 Cor. 11. The love-feasts. The holy kiss.</p></blockquote>

<main class="wrap"><figure class="quote" id="q-c7b99b2e9d" data-kw="">
<blockquote><p>5. All the justified have a real union and interest in Christ, to live by faith (Hab. 2:4; Rom. 1:17), and wait on God in all their troubles by faith; but though there be an union of love in God’s mind from eternity, between the elect and God, yet a complete union between us and Christ, without the Spirit, and without any faith, though it be boldly asserted by Familists (Rise, Reign, Er., p. 37), is against the Scripture: For then might we be born again, and not receive Christ by faith, contrary to the Scripture (Jn. 1:11-12, Antinomians hold an union with Christ before we believe); and be united to Christ, as branches to the Vine-tree, and not abide in Christ (Jn. 15:1-6), have Christ dwelling in our heart, and not by faith, contrary to Paul (Eph. 3:17); so might Christ live in us, and we eat and drink Him as the true manna, have the Son, and yet want [lack] faith, contrary to the Scriptures (Gal. 2:20; Rev. 2:7•; Jn. 6:35, 40, 44, 47, 54-55). All which, or most of them, prove that we were not justified when Christ died on the cross.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/samuel-rutherford.html">Samuel Rutherford</a></span><span class="wk"><span class="lbl">Work:</span> <cite>A Survey of the Spiritual Antichrist, Opening the Secrets of Familism &amp; Antinomianism</cite>, … (London: 1648), pt. 2, ch. 18, ‘That we are not justified until we believe’, pp. 19-20</span></figcaption>

</figure><figure class="quote" id="q-34e17462fb" data-kw="">
<blockquote><p>In one word, then, by repentance I understand regeneration, the only aim of which is to form in us anew the image of God, which was sullied, and all but effaced by the transgression of Adam. So the apostle teaches when he says, ‘We all with open face beholding as in a glass the glory of the Lord, are changed into the same image from glory to glory, as by the Spirit of the Lord.’ Again, ‘Be renewed in the spirit of your mind,’ and ‘put ye on the new man, which after God is created in righteousness and true holiness.’ Again, ‘Put ye on the new man, which is renewed in knowledge after the image of him that created him.’ Accordingly, through the blessing of Christ we are renewed by that regeneration into the righteousness of God from which we had fallen through Adam, the Lord being pleased in this manner to restore the integrity of all whom He appoints to the inheritance of life. This renewal, indeed, is not accomplished in a moment, a day, or a year, but by uninterrupted, sometimes even by slow, progress God abolishes the remains of carnal corruption in his elect, cleanses them from pollution, and consecrates them as his temples, restoring all their inclinations to real purity, so that during their whole lives they may practise repentance, and know that death is the only termination to this warfare.</p></blockquote>

<blockquote><p>2. Faith makes us children, as it is the vital principle. Hab. 2:4, ‘The just shall live by faith.’ All God’s children are living, none of them are still-born; now by faith we live. As the heart is the primum vivens, the fountain of life in the body, so faith is the fountain of life in the soul.

3. Faith makes us children, as it is the uniting grace; it knits us to Christ; the other graces cannot do this; by faith we are one with Christ, and so we are akin to God; being united to the Natural Son, we become adopted sons: The kindred comes in by faith: God is the Father of Christ; faith makes us Christ’s brethren (Heb. 2:11), and so God comes to be our Father.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/thomas-watson.html">Thomas Watson</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Beatitudes: or a Discourse upon part of Christ’s Famous Sermon on the Mount</cite>, … (London: Smith, 1660), ch. 19, sect. 3, p. 298</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/regeneration/nature-of-regeneration.html">Nature of Regeneration</a></span></div>

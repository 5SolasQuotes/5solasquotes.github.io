<main class="wrap"><figure class="quote" id="q-06f4f04b52" data-kw="">
<blockquote><p>The Church of England believeth, that Predestination unto life is the eternal purpose of God, whereby before the foundations of the world were laid, he constantly decreed by his counsel unto us unknown to deliver from the curse &amp; destruction them whom he chose in Christ out of mankind, &amp; (as vessels made unto honour) through Christ to bring them to eternal salvation. Whereupon they who are endowed with so excellent benefit of God, are called according to his purpose, and that by his spirit working in a fit time.

But you Mai. [Richard] Hoo[ker]. seem to vs, to affirm contrary, when you say: If any man doubt how God should accept such prayers in case they be opposite to his will, or not grant them, if they be according to that him self willeth: Our answer is, that such suits God accepteth, in that they are conformable to his general inclination, which is that all men might be saved: yet always he granteth them not, for so much as there is in God a more private occasioned will, which determineth the contrary. Here we beg your aide to make manifest unto us, how God eternally predestinateth by a constant decree, them whom he calleth and saveth (as our Church professeth) and yet hath, as you say, a general inclination that all men might be saved:

Whether he foresaw not something that occasioned his will otherwise; so that he elected not all, but only them whom he calleth and saveth, or that of his general inclination he elected all men, but some more privately occasioned him in time to alter his will, and to refuse them; or that some men gave God occasion that he saveth them, though he never decreed it before the foundations of the world. What meant the blessed Apostle where he sayeth: Whom he predestinated them also he called: and whom he called them also he justified. &amp;c.

Is this to be understood of a constant decree, as we say, or of an inclination? He sayeth: God worketh all things after the counsel of his own will. Is this to be understood, that upon occasion sometimes he either altereth his counsel, or decreeth something which he had not thought upon before. Saint James saith, that in God there is no variableness nor shadow of turning. Is not this more then a variableness or shadow of turning to incline one way, and upon occasion to decree another.

Do not these words of yours give some place unto chance and fortune: Do they not make GOD as a man not of an all-sufficient knowledge, wisdom, and counsel, but inclinable some one way, till by occasion he find a more better way. Where is that God you speak of in your first book, of whom and through whom and for whom are all things. And where is that law by which he worketh, which you there call aeternall, and therefore can have no shew or colour of mutability.

Have we not cause to fear that the witty schoolmen have seduced you, and by their conceited distinctions made you forget, That you are neither able nor worthy to open and look into the book of God’s law, by which he guideth the world. And yet you will say, There is in God an occasioned will. Good Mai. Hoo[ker]. help us here, and shew us how we may think, that you incline not to the error of popery touching works foreseen, and that you favour our church’s belief.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/andrew-willet.html">Andrew Willet</a></span><span class="wk"><span class="lbl">Work:</span> <cite>A Christian letter of certain English protestants, unfained favourers of the present state of religion, authorised and professed in England: unto that reverend and learned man, Mr R. Hoo[ker] requiring resolution in certain matters of doctrine (which seem to overthrow the foundation of Christian rel</cite>, (Middelburg: Richard Schilders, 1599), pp 15-17.</span></figcaption>

<blockquote><p>We are said to be “elected in Christ” (Eph. 1:4) … that Christ is the primary means of election to be executed and the cause of salvation destined to us through him, not the cause of the decree by which it is decreed. … He says that we are elected in Christ that “we should be holy.” Therefore we cannot be regarded as existing in Christ antecedently for then we would be holy already.</p></blockquote>

<blockquote><p>II. Both you and I hold, and must hold, that God decrees to damn all that shall be damned. But it is false that we hold that He does it without any respect to foreseen sin. (Vasquez on Thomas, pt. 1, quest. 23, art. 3, p. 709, Conclusio (quod Deus aliquos reprobat) est de fide constat enim ex scriptura multos a Deo reprobari [The conclusion (that God reprobates some) is of the Faith, for it is evident from Scripture that many are reprobated by God.”]. See Ruiz, On Predestination, tract. 2 through the whole) For:

      1. He foresees this sin as the only meritorious cause of their damnation; what He does in time, that is it which He decreed to do from eternity: But in time He damns no man but for sin; therefore from eternity He decreed to damn no man but for sin: For sin, I say, as the cause of damnation, which Dr. Twisse does frequently profess.

      2. And though this sin can be no proper efficient cause of God’s volition or decree, yet it is a presupposed necessary qualification in the object, as foreseen in the mind of God, and so, as aforesaid, is an objective cause as foreseen.</p></blockquote>

<div class="actions"><button class="copy" data-copy="“II. Both you and I hold, and must hold, that God decrees to damn all that shall be damned. But it is false that we hold that He does it without any respect to foreseen sin. (Vasquez on Thomas, pt. 1, quest. 23, art. 3, p. 709, Conclusio (quod Deus aliquos reprobat) est de fide constat enim ex scriptura multos a Deo reprobari [The conclusion (that God reprobates some) is of the Faith, for it is evident from Scripture that many are reprobated by God.”]. See Ruiz, On Predestination, tract. 2 through the whole) For:

      1. He foresees this sin as the only meritorious cause of their damnation; what He does in time, that is it which He decreed to do from eternity: But in time He damns no man but for sin; therefore from eternity He decreed to damn no man but for sin: For sin, I say, as the cause of damnation, which Dr. Twisse does frequently profess.

      2. And though this sin can be no proper efficient cause of God’s volition or decree, yet it is a presupposed necessary qualification in the object, as foreseen in the mind of God, and so, as aforesaid, is an objective cause as foreseen.”

— Richard Baxter, Catholic Theology Plain, Pure, Peaceable, (London: White, 1675), pt. 2, 1st Day’s Conference, about Predestination, p. 9">Copy</button><a class="share" href="https://x.com/intent/post?text=%E2%80%9CII.+Both+you+and+I+hold%2C+and+must+hold%2C+that+God+decrees+to+damn+all+that+shall+be+damned.+But+it+is+false+that+we+hold+that+He+does+it+without+any+respect+to+foreseen+sin.+%28Vasquez+on+Thomas%2C+pt.+1%2C+quest.+23%2C+art.+3%2C+p.+709%2C+Conclusio+%28quod+Deus+aliquos+reprobat%29+est+de+fide+constat+enim+ex+scriptura+multos+a+Deo+reprobari+%5BThe+conclusion+%28that+God+reprobates+some%29+is+of+the+Faith%2C+for+it+is+evident+from+Scripture+that+many+are+reprobated+by+God.%E2%80%9D%5D.+See+Ruiz%2C+On+Predestination%2C+tract.+2+through+the+whole%29+For%3A%0A%0A%C2%A0%C2%A0%C2%A0%C2%A0%C2%A0%C2%A01.+He+foresees+this+sin+as+the+only+meritorious+cause+of+their+damnation%3B+what+He+does+in+time%2C+that+is+it+which+He+decreed+to+do+from+eternity%3A+But+in+time+He+damns+no+man+but+for+sin%3B+therefore+from+eternity+He+decreed+to+damn+no+man+but+for+sin%3A+For+sin%2C+I+say%2C+as+the+cause+of+damnation%2C+which+Dr.+Twisse+does+frequently+profess.%0A%0A%C2%A0%C2%A0%C2%A0%C2%A0%C2%A0%C2%A02.+And+though+this+sin+can+be+no+proper+efficient+cause+of+God%E2%80%99s+volition+or+decree%2C+yet+it+is+a+presupposed+necessary+qualification+in+the+object%2C+as+foreseen+in+the+mind+of+God%2C+and+so%2C+as+aforesaid%2C+is+an+objective+cause+as+foreseen.%E2%80%9D%0A%0A%E2%80%94+Richard+Baxter%2C+Catholic+Theology+Plain%2C+Pure%2C+Peaceable%2C+%28London%3A+White%2C+1675%29%2C+pt.+2%2C+1st+Day%E2%80%99s+Conference%2C+about+Predestination%2C+p.+9&amp;url=https%3A%2F%2F5solasquotes.github.io%2Fquote%2Fc8a0ce7831.html&amp;via=5Solas" target="_blank" rel="noopener">Share on X</a><a class="perma" href="../quote/c8a0ce7831.html">Permalink</a><a class="src" href="https://reformedbooksonline.com/topics/the-decrees-of-god#:~:text=II.%20Both%20you%20and%20I%20hold,is%20an%20objective%20cau

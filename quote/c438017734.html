<main class="wrap"><figure class="quote" id="q-c438017734" data-kw="">
<blockquote><p>We say that it is a superstition to esteem one day more holy than another, or to think that to abstain from labor is something which, in itself, pleases God (Rom 14:15, 6; Col 2:16,17). But, following what the Lord has commanded, we sanctify one of the seven days (Gen 2:3). We devote it entirely to ecclesiastical assemblies to hear the Word of God; yet, as we have said, there is with us no Judaistic ceremony or stupid superstition. This is why we have not chosen the Jewish Sabbath, Saturday, but Sunday, following the custom of the early Church (1 Cor 16:2; Acts 20:7; Rev 1:10).</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/theodore-beza.html">Theodore Beza</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Christian Faith</cite>, (1558), trans., James Clark (East Sussex: Christian focus Ministries Trust, 1992), 107–08.</span></figcaption>

</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-da3987fe7e" data-kw="">
<blockquote><p>3 Q. Of how many hours does the Sabbath day consist? A. Of four and twenty. Gen. 2:3 The Sabbath is called the seventh day: so as it is a seventh part of the week: therefore so many hours as make up every of the other days (which are four and twenty) must be accounted to this day. 4 Q. Are all those hours to be sanctified? A. Yes. Exod. 20:11 The Lord rested the whole seventh day: and all the time wherein He rested He sanctified. Gen. 2:2,3 5 Q. How can all that time be sanctified? A. 1. By observing things commanded. Jer. 17:22 2. By observing things permitted. Exod. 12:16.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/william-gouge.html">William Gouge</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Sabbath’s Sanctification</cite>, (1641), p. 2</span></figcaption>

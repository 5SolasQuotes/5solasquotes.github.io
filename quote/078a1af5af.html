<main class="wrap"><figure class="quote" id="q-078a1af5af" data-kw="">
<blockquote><p>Now albeit Nature (as was said) teach all men that there is a eternal and mighty God, who should be worshipped and honored by them. Yet it descends not unto such particular precepts as can have any show of making ought for significant ceremonies Omnibus enim innatum est et in animo quasi insculptum, esse deos: but yet quales sint, says Cicero, varium est. And as Nature has not taught men to know the Nature and the attributes of the Godhead, together with the sacred Trinity of persons in the same: so neither has it taught what sort or manner of worship should be given unto God, Lex naturalis rerum communium est, and does only inform us with those common notions called [Greek]. Concerning the worship of God, it speaks only de genere, not de specie. Wherefore there can be no inference from that worship which the Law of Nature requires, either of any distinct kind of worship, or of any ceremony in that kind. No more than it follows, Si est animal, est Asinus [‘If it is an animal, it is a donkey’]; for à genere ad speciem non valet consequentia affirmando.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/george-gillespie.html">George Gillespie</a></span><span class="wk"><span class="lbl">Work:</span> <cite>English Popish Ceremonies</cite>, (1637), pt. 3, ch. 9, p. 202</span></figcaption>

</figure><figure class="quote" id="q-9ff29c0ec7" data-kw="">
<blockquote><p>How this Worship is Correspondent to the Nature of God. The Lord does show it in the fourth of John, verses 23 and 24, saying, the true worshippers, shall worship God in spirit and truth, that is in the Spirit of sanctification dwelling in the mind, helping our infirmities with sighs and groans, which cannot be expressed; and in the truth of his Word dwelling in us in all wisdom and spiritual understanding, such as these the Father requires should worship Him, because God is a Spirit, and they that worship Him, must worship Him in spirit and truth, and not in the ignorance of the mind, nor in the invention and will-worship of man; For this cause the Psalmist says in the 51:6, ‘Thou O Lord lovest truth in the inward affections’; and in the 50th Psalm he says, ‘Offer to God the sacrifice of praise, and pay the vows of the Most High, and call upon God; for the Lord loves truth in the inward parts.’ This is the pure and simple worship of God, without the glory and beauty of outward ceremonies, agreeing with the simple pure essence and nature of God Himself. Consider well Paul’s caveat in the Col. 2:8,18,20-23, warning all men to beware of human wisdom, and deceitful inventions and traditions, according to the rudiments of the world, and not after Christ; the outward show of holiness which puffs up men’s hearts with self-conceit, being burdened with traditions, which having a glorious show of holiness, of wisdom and voluntary religion, wherein men are out of measure superstitious in zeal, not sparing their bodily labor.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/william-fenwick.html">William Fenwick</a></span><span class="wk"><span class="lbl">Work:</span> <cite>An Exact Enquiry After Ancient Truths, both in Scripture &amp; Fathers, Touching the Subsistence of the Church of God</cite>, … (London, 1643), pp. 2-3</span></figcaption>

</figure><figure class="quote" id="q-66d8ababe8" data-kw="">
<blockquote><p>The worship of God is either natural or instituted. Natural worship is that which in specie, and immediately, is founded in the nature of God and the nature of man, and God’s relation to man, and man’s relation to God. And it is twofold, either that which is naturally necessary, or that which is naturally laudable. That which is naturally necessary, is indispensable and unchangeable. That which is naturally laudable must be used whensoever conveniently it may. There is natural worship due to God, both as the Creator of man and as the Redeemer of fallen man. As God is our Creator, He is our absolute Owner and Ruler, and Benefactor; and as such, He is to be acknowledged by us with all due observance. And whatsoever acts of observance towards God we are upon this ground immediately obliged unto, they are natural worship due to God as our Creator. All natural worship due to God as Creator is discernable by natural revelation, or the Book of Nature. In Nature entire it was clearly and completely thereby discernible; but in Nature fallen, more dimly and defectively; yet not for want of objective evidence, but for the indisposition of our faculty. Likewise to God our Redeemer, there is a worship due from us, naturally and immediately arising from our redemption, and our relation to God therein founded. And it is (our redemption being supposed) no more of God’s arbitrary institution than that worship which is founded in the Law of our Creation and primitive State. To the knowledge of this sort of natural worship, we come by means of that divine revelation by which we come to the knowledge of our redeemed state. But the knowledge of our redeemed state being supposed, natural reason will show that such and such acts of observance in specie are naturally and indispensably due to God our Redeemer.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/john-corbet.html">John Corbet</a></span><span class="wk"><span class="lbl">Work:</span> <cite>§5. ‘Divine worship distinguished into Natural &amp; Instituted. And first, of Natural Worship’ in The Remains</cite>, … (d. 1680; London: Parkhurst, 1684), ‘Of Divine Worship’, pt. 1, pp. 174-75</span></figcaption>

<blockquote><p>In the external worship which God requires, or in ceremonies, nothing by us is to be contrived out of our head.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/jerome-zanchi.html">Jerome Zanchi</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Other citations (work not named)</cite>, Of the Law of God, 1.14 in Theological Works (1619), vol. 2, pt. 4, cols. 362-63, see also 502; also as quoted in Latin by George Gillespie, English-Popish Ceremonies (1637), bk. 3, ch. 7, section 14, pp. 121-22, with a further elaboration in English.</span></figcaption>

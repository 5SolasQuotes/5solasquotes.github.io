<main class="wrap"><figure class="quote" id="q-672b6588f3" data-kw="">
<blockquote><p>HEAVEN is the Lot of the Righteous; where the absence of all Evil, an unspeakable fulness of Blessings, both for Body and Soul, and a perfect fruition of GOD, shall make up our Happiness. JESUS CHRIST, the Bridegroom, will there give Consummation to our Joys.

NO more Temptations, no more Sins, no more Sufferings, no more Fears; But Light in the Mind, Comforts in the Heart, Peace in the Conscience, a perfect Union of the Faithful in giving Eternal Thanks to God, in the enjoyment of Felicity that shall have no end.

What ought not we to do; what Miseries should not we be content to suffer, to secure the hope of this Glory God has promised to us? What Terror ought to seize us, when we reflect upon our Sins, which (if not repented of) will deprive us of it for ever?</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/pierre-allix.html">Pierre Allix</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Epictetus Christianus; or, Maxims of True Christianity</cite>, trans. Paul Lorrain (London: Brab. Aylmer, 1688), p. 80.</span></figcaption>

</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-7cd6b5913e" data-kw="">
<blockquote><p>There is a Community of Glory betwixt Christ and Us: The Heaven that the Mediator Christ Enjoys, is our Heaven; Our Heaven is to the Man Christ in a Conquest: Heaven was bought with Blood to Him and Us, and to make you Rejoice: None of GOD‘s Children gets a Heaven properly of their own; Why? We got a share and part of Christ‘s Inheritance, He is the Principal Heir, Romans 8.

We are the Conjunct-heirs: Sweet is that Word which He speaks to his Children, Luke 22. 29. And I appoint unto You a Kingdom, as My Father hath appointed unto Me, that ye may Eat and Drink at My Table in My Kingdom, Sitting on Thrones, Judging the Twelve Tribes of Israel. The Meaning is, My Father hath made a Disposition to Me of the Kingdom of GOD, it is Mine and My Dear Children. I will think Heaven uncouth if ye be not with Me. Here I make a Disposition and Resignation of that Kingdom to you; Ye shall Sit at my Table in My Kingdom: Up your Heart, howbeit ye be not Lords in Earth, ye shall be Lords in Heaven; I and Ye shall part Kingdoms and Thrones together.

Secondly, Rejoice in this ye that are in Christ and see your Condition, ye and Christ are Halfers together of Heaven and Glory, O if GOD‘s Children be in a Sweet Case as long as Christ is in Heaven and keeps the Inheritance, as long shall we keep our Right; And who can cause him Flit? The Devil hath made these Enemies of the Grace of GOD to Misken all our communion with Christ, they have put Christ and the Elect together, as a Man in an Inns for a Night, and to go away to Morrow; They have yoked Christ and us together, as if He were one and we another; as if He were His own, and We were our own; as if Christ had no Law and Right to Us, and We had no Law and Right to Christ, but met at a Venture, and sundered at a Venture; as if We had one heaven, and He had another; As if he had his Portion by himself alone, and that he keeps for ever; and that We had our Share be our alone too, to Sell when We pleased.

Sells if we Dispone Heaven, We Dispone not Christ‘s Heaven. In the Fighting he fights all the Battles his alone, We but look on: But when it comes to the Dividing of the Spoil, We get a Rich Share of the Spoil, Yet he gave the Whole Sum for the Inheritance, and We Nothing; yet we are set at his Elbow in a Throne with him, Now seeing our Right is also Good, slip not from them: Do not as some Unworthy Heir, who having a Good Right slips from it for a feckless composition after Drink, quits all, howbeit he should Beg: Indeed the Wicked does this.

The Devil drinks them Blankfull, and fills them with Worldly Pleasures, and gars them Subscribe a Resignation, and gives them an unworthy composition, some present Pleasure. Compone not with the Devil to go to the Law with him, let Christ be your Advocate, Subscribe not a Submission with the Devil, come never in Trysting Terms with him hold you aback from the World, and the Lusts of it, it is the Devil’s Arles that he gives to Silly Drunken Heirs, when they cry Hills and Mountains fall on us: They would fain give back the Arles and Rew, but it is out of time.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/samuel-rutherford.html">Samuel Rutherford</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Christ and the doves’ heavenly salutations, with their pleasant conference together: or A sermon before the communion in Anwoth. Anno 1630. By that flour of the Church, Mr. Samuel Rutherford</cite>, (n.p., [1660]), pp 21-22.</span></figcaption>

<blockquote><p>Against claims that John Calvin repudiated the beatific vision and teleological virtue ethics, this article demonstrates the importance of the visio Dei by examining sections of Calvin’s exegesis and several important sermons. To explicate how such a teleology impacts the Christian’s relation to ‘lower goods’, it then explores Augustine’s theology of created being. Together these conversations contribute to an explanation of Calvin’s view of Christian moral life now through growth in virtue and in relation to the hope of seeing or contemplating God.</p></blockquote>

<blockquote><p>III. However, the received opinion among the orthodox is that the promise given to Adam was not only of a happy life to be continued in paradise, but of a heavenly and eternal life (to which he was to be carried after the course of perfect obedience and perseverance had been run and which God had prescribed to him as a trial of his faith). Hence it is evident that the question is not whether Adam had the privilege of immortality in his upright state (which we have proved before against Socinus). The question is not whether the promise was given to him of happiness and life perpetually to endure, if he had persisted integrity (which the learned men, with whom we here dispute, do not deny). Rather the question is whether that happiness and life were to be passed in heaven or only upon the earth and in paradise. The latter, they affirm; we the former.

IV. The reasons are: (1) The law of works had the promise of heavenly and eternal life; therefore also the law prescribed to Adam. In each instance, it is the same law as to substance. The former is evident from “who doeth these things, shall live by them” (Lev. 18:5); “if thou wilt enter into life” (namely, the heavenly) “keep the commandments” (Mt. 19:16, 17); and “the commandment was ordained to life” (Rom. 7:10) assuredly, not earthly, but heavenly. Since however, after the fall, the law can justify no one, this promise must necessarily have had place in upright Adam.</p></blockquote>

<blockquote><p>Whether you had your Commission, Office and Authority from the Magistrate, and your Power in, and relation to the Church, be of a Civil Stamp? We know the Magistrate doth not pretend to this: And if none but Christ did, nor could Commissionate you, can any but He discharge you? or can the Relation between the Church and you (if Divine and Spiritual) cease upon the interposition of a Power merely Political, which is toto genere distinct? If the Magistrate did not constitute and cause this Relation, how can he make it to cease? or take away what (confessedly) he cannot give? were not this to make it to be at the Magistrate’s pleasure whether Christ shall have any Ministry or no? any Service or no? whether there shall be any Preaching or not? and so indeed, whether God shall have any Church or no?

And if the Magistrate cannot make your Relation to the Church to cease, how can he make the Duty of that Relation to cease? sith the shadow doth not more naturally and necessarily follow the substance, than the Duty doth the Relation. In a word; Will it be a sufficient Answer, at God’s Righteous Judgment, when the Lord shall ask us why we did not preach the Gospel as he had bid us? to say, Lord, it was because the Magistrate did forbid us. God is our Record in Heaven, that we are of those that do unfeignedly fear the Lord, and honour the King; to whom we shall ever yield obedience in licitis, deny submission in nullis.

Only we are afraid, that it will not be sufficient in that dreadful day, to produce the Magistrate’s Warrant for our discharge, when directly contradicting the tremendous Charge of our Lord Jesus Christ, who shall judge both quick and dead at his appearing. We verily fear, the Magistrate’s Dispensation will not be allowed before his Tribunal; and then what a sorry case were we in, should we desist thereupon from our work?</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/joseph-alleine.html">Joseph Alleine</a></span><span class="wk"><span class="lbl">Work:</span> <cite>A call to Archippus, or, An humble and earnest motion to some ejected ministers (by way of letter). To take heed to their ministry, that they fulfil it</cite>, ([London], 1664), pp 11-12.</span></figcaption>

</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-64f61fc0cc" data-kw="">
<blockquote><p>For in a Christian communion there are these different administrations or polities or states, ecclesiastical and civil. … For, 1. Though both agree in this, that there is order in their administrations, yet with this difference that the guides in the church have not a despotical, but Œconomical power only, being not lords over Christ’s heritage, but stewards and ministers of Christ and of the church; the dominion and law-giving power being reserved to Christ alone, as he only [is the] head of the church. But in the other state he has given lordly power, authority, and dominion unto men.

2. Though both agree in this, that man is the common subject of them both, yet with this difference, man by nature being a reasonable and sociable creature, capable of civil order, is or may be the subject of civil power and state. But man by grace called out of this world to fellowship with Jesus Christ, and with his people, is the only subject of church power; yet so, as the outward man of church members is subject to the civil power in common with other men, while their inward man is the subject of spiritual order and administrations.

3. Though they both agree in this, that God is the efficient [cause] and author of them both, and that by Christ, yet not eadem ratione [for the same reason]. For, God as the Creator and Governor of the world is the author of civil order and administrations. But God as in covenant with his people in Christ is the author of church administrations. So likewise Christ, as the essential word and wisdom of God creating and governing the world is the efficient [cause] and fountain of civil order and administrations. But as mediator of the New Covenant and head of the church, he establishes ecclesiastical order.

4. Though they both agree in this, that they have the same last end, viz., the glory of God, yet they differ in their next ends; for the next end of civil order and administrations is the preservation of humane societies in outward honour, justice, and peace. But the next ends of church order and administrations are the conservation, edification, and salvation of souls, pardon of sins, power against sin, peace with God, etc.

5. Hence arises another difference about the objects of these different states. For though both agree in this, that they have the common welfare for their aim and scope, yet the things about which the civil power is primary conversant are bodies, τα βιωτικά (1 Cor. 6:4) or τά πρός τόν βίον, “the things of this life” as goods, lands, honour, the liberties and peace of the outward man. The things whereabout the church power is exercised are τά πρός τόν θεόν, “the things of God” (Heb. 5:1) as the souls and consciences of men, the doctrine and worship of God, the communion of the saints. Hence also they have different laws, different officers, different power, whereby to reduce men to order, according to their different objects and ends.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/john-cotton.html">John Cotton</a></span><span class="wk"><span class="lbl">Work:</span> <cite>A discourse about civil government in a new plantation whose design is religion. Written many years since, by that Reverend and worthy Minister of the Gospel, John Cotton, B.D.; And now published by some undertakers of a new plantation, for general direction and information</cite>, (Cambridge MA: Samuel Green, 1663), pp 6-7.</span></figcaption>

</figure><figure class="quote" id="q-df04ad4eee" data-kw="">
<blockquote><p>God, to whom belongs the world and the fulness thereof, disponed to Abraham and his seed the land of Canaan for their inheritance and ordained that they should use their bow and their sword for the actual possession thereof; and the like divine right had David to the Edomites and Ammonites, though the occasion of David’s taking possession of these kingdoms by his sword did arise from particular and occasional exigencies and injuries; but it follows in no sort that, therefore, kings now wanting any word of promise, and so of divine right to any lands, may ascend to the thrones of other kingdoms than their own by no other title than the bloody sword. That God’s will was the chief patent here is clear, in that God forbade his people to conquer Edom, or Esau’s possession, when as He gave them command to conquer the Amorites. I doubt not to say, if Joshua and David had no better title than their bloody sword, though provoked by injuries, they could have had no right to any kingly power over these kingdoms; and if only success by the sword be a right of providence, it is no right of precept.</p></blockquote>

<blockquote><p>The traditional Covenanter view of the Old Testament’s penal sanctions is that the majority of them remain binding today, as they have not been abrogated in the New Testament. Samuel B. Wylie, an American Reformed Presbyterian, explains this position below:

It may perhaps be inquired, what are those things which he [the civil magistrate] may lawfully command? To this I answer, he may lawfully command whatever is contained in the constitution prescribed by him whom he represents. Deut. 17:18, we are told what this is, namely, the Divine Law. Whatever penalties are specified in that law, and nowhere either repealed or mitigated, should be duly inflicted, in case of disobedience. Where the law is silent or indefinite, with respect to particular crimes, against any precept of the Decalogue, and the punishment due thereto, great prudence and discretion will be necessary to ascertain whether said crimes are punishable by civil pains, as there are many violations of the moral law to which no particular civil penalty can attach.</p></blockquote>

</figure><figure class="quote" id="q-0dcd26448c" data-kw="">
<blockquote><p>From whence we take the freedom to entreat you for God’s sake, strictly to inspect into vocations and employments, that they be not mixed nor confounded to the detriment both of the one and other. The ministerial function is expressly limited by the Word of God as to its laws, ends, means and actings, it being altogether different from, yea and totally contrary to the secular government; And we conceive that there is no such difficulty in the matter, but that ministers may be kept within the inviolable bounds of their most holy calling, and yet be useful unto the public without glorying in those little arts of subtilties and surprisals, which abutt at no other mark than temporal and carnal profit. Besides that ’tis a very rare thing to find a man capable both of the one and other calling, there is this grand mischief in it, that flesh and blood seeing in the holy ministry nothing but what is mean and humble, despicable, and painful, difficult and dangerous, and contrariwise meeting in the management of secular affairs with food and fuel enough for pride, ambition and covetousness (the ground of all envies and jealousies), and with the means and helps to carry on designs of self-advancement and domination, as tricks, craft and dissimulation; It will be almost impossible to hinder the spreading of this contagion, which creeps insensibly into the greatest wits, and seizes upon them at unawares, and not as an affected and approved vice. We know very well, that necessity, the law of the present day, is pleaded and urged on behalf of this practice, too too much in use among you to vindicate and justify it. But for God’s sake, most dear brethren, we beseech you to consider, whether it were not better that your temporal affair should suffer some inconveniencies, than your spiritual ones to be contaminated; And whether the great risk you run in ruining and depraving your pastors should be preferred unto your temporal interests. And whether it were not better to have a reserve among you of some pure and savory salt against the general corruption, rather than to hazard all in this universal overthrow by the world, upon which theater we see the most valiant champions to be foiled. If the necessity be absolute, peremptory and indispensable, then let them go about such secular political affairs with regret and grief, troubled at their enforced distraction from their heavenly calling, lamenting as the spouse in the Canticles that they have made me the keeper of the vineyard, but mine own vineyard have I not kept. Let them go, but then only, when your businesses are in extreme danger, as it were at the last gasp, when you need the greatest circumspection, a most immovable fidelity, and unchangeable integrity, and without any affectation or introduction of ambition, or hidden, disguised interests. No man going to war entangles himself with the world, that so he may the better please his Captain that has listed him. That commination is very dreadful, the priest shall be as the people, and that lamentation exceeding doleful, All this evil and mischief is from the prophets, and the stones of the sanctuary are lying at the four corners of the streets. Let us, most dear and honored brethren, give up and resign ourselves to the conduct of true wisdom, speaking to us from the Word of God, which is, to forsake our own. This also, most honored brethren should be endeavored, that all persons whatsoever in the ministry, when called forth unto those secondary employments of the Church, do retain in their deportments and conversations the marks and characters of their first and most sacred vocation. Let their devotion, piety, gravity, self-denial, and sequestration from worldly pleasures, used with too great a liberty by many Christian statesmen serve to maintain the sweet odor and reputation of our Church government, and to keep up inviolably the authority of their most holy ministry, and to bind the souls and consciences of men by religious humility to an everlasting dependance on the majesty of their great Lord, whose holiness and sovereign wisdom shines forth most resplendently in the order of his service, as the Queen of Sheba saw and admired it in the Court of Solomon. Impiety and impudence are too much in vogue everywhere. But let the sanctuary, the Church of God be at least the receptacle and habitation of true and unfeigned piety, where it may act and breath freely at in the open air, with an uplifted countenance, in a courageous demonstration of the Spirit, and evidence of Truth, convincing and condemning the unfruitful works of darkness, and awakening with its bright shining flambeau the drowzy consciences of a perverse generation, it may encourage the faithful unto perseverance, and preserve the remnant of Jacob in this day of dispersions and desolations.</p></blockquote>

<blockquote><p>Q. How doth God deal with reprobates dying infants?

A. Being once conceived, they are in the state of death, by reason of the sin of Adam imputed, and of original corruption cleaving to their nature, wherein also dying, they perish; as (for instance) the children of Heathen parents; for touching the children of Christians, we are taught to account them holy.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/samuel-crooke.html">Samuel Crooke</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The guide unto true blessedness. Or, A body of the doctrine of the Scriptures, directing man to the saving knowledge of God</cite>, (London: John Pindley, 1613), p. 31.</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/civil-government-and-society.html">Civil Government and Society</a></span></div>

</figure><figure class="quote" id="q-2a4ea25045" data-kw="">
<blockquote><p>The General Assembly, soon after the Disruption, thought it necessary to embody the great principle for the sake of which the Church had resigned the emoluments of the State, in an additional question to be proposed to all office-bearers at the time of their ordination. The question is in these terms:—“Do you believe that the Lord Jesus Christ, as King and Head of the Church, has therein appointed a government in the hands of Church-officers, distinct from, and not subordinate in its own province to, civil government, and that the civil magistrate does not possess jurisdiction or authoritative control over the regulation of the affairs of Christ’s Church! and do you approve,” &amp;c.

Let the opening statement be observed carefully, “that the Lord Jesus Christ, as King and Head of the Church, has therein appointed a government in the hands of Church-officers, distinct from, and not subordinate in its own province to, civil government.” It is but a slight enlargement of the following words of the Confession of Faith:—“The Lord Jesus Christ, as King and Head of his Church, hath therein appointed a government in the hand of Church officers, distinct from the civil magistrate.”

First, that Christ is the only King and Head of the Church: second, that as such he has appointed a government of the Church in the hands of officers of her own, of ecclesiastical office-bearers; and, third, that this government in their hands, derived from Him, is wholly distinct from the State, or civil power, is subordinate to Him alone,—is not subordinate within its own province to the civil magistrate.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/charles-j-brown.html">Charles J. Brown</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Disruption Question Stated. Reprinted (with some additions) from the Free Church Record, at the request of the Free Presbytery of Edinburgh</cite>, (Edinburgh: T. Nelson and Sons, 1863), pp 3-4.</span></figcaption>

</figure><figure class="quote" id="q-4055135c21" data-kw="">
<blockquote><p>Paracelsus [d. 1541] teaches that men can be produced by the chemical art in his [Opus] Paramirum [A Work Beyond-Wonder, 1531], where he makes three parts of man: elemental, celestial and divine. He denies that the first two come into heaven. There he writes thus: ‘It was doubted by the philosophers whether it could happen that a man be born outside the womb of a woman; to which I respond that it is not repugnant to chemical art and nature, but is very easy. For sperm enclosed in a cucurbit [a flask] or sealed in the womb [venter equinus] of a [living] horse, by the highest putrefaction putrefies for fifty days, until it moves, which is easy to discern. After that time, it will appear somehow similar to a fetus, yet without a body, transparent. If you then daily prudently nourish or feed this with human blood, and keep and cherish it in the equal heat of the horse’s belly, after nine months it will appear adorned with all members like an infant born from a woman, yet smaller in quantity. This thing we call a homunculus, which must afterwards be educated with careful solicitude and diligence like a true boy or infant, until it grows up.’ He adds there that those who are thus born understand all arcana and hidden things which it is otherwise impossible for men to know, because they have acquired life, body, flesh and bones by art; therefore the arts and sciences are innate to them, nor do they need to learn from elsewhere.</p></blockquote>

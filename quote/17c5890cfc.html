<main class="wrap"><figure class="quote" id="q-17c5890cfc" data-kw="">
<blockquote><p>Therefore the Law or the old covenant contains only physical promises, to which some such condition as this is always attached: “If you will hear My voice” (Ps. 95:7); “If you will keep My covenant” (Ex. 19:5); “If you walk in My ways, you will be My people” (Deut. 28:9). The Jews did not pay attention to this; but they took hold of these conditional promises and made them absolute and unconditional, which they thought that God could never revoke but had to keep. And so when they heard the prophets—who were able to distinguish properly between the physical promises of the Law and the spiritual promises about Christ and His kingdom—predict that the city of Jerusalem, the temple, the kingdom, and the priesthood would be laid waste, they persecuted and killed them as heretics and blasphemers against God; for they did not see the condition that was attached: “If you keep My commandments, it will be well with you.” Therefore Hagar the slave gave birth to nothing but a slave. And so even though Ishmael was a genuine son of Abraham, he was not an heir but remained a slave. What was lacking? The promise and blessing of the Word. Thus the Law given on Mt. Sinai, which the Arabs call “Hagar,” gives birth to nothing but slaves; for there was no promise of Christ added to the Law. “And so if you forsake the promise and faith and turn back again to the Law and works, O Galatians, you will remain slaves forever. That is, you will never be free of sin and death; but you will remain under the curse of the Law. For Hagar does not give birth to a child of promise or an heir; that is, the Law does not justify, does not grant sonship and an inheritance but rather hinders it and works wrath.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/martin-luther.html">Martin Luther</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Luther’s Works</cite>, Vol. 26: Lectures on Galatians, 1535, Chapters 1–4, ed. Jaroslav Jan Pelikan, Hilton C. Oswald, and Helmut T. Lehmann, vol. 26 (Saint Louis: Concordia Publishing House, 1999), 437–38.</span></figcaption>

</figure><figure class="quote" id="q-0902f1baa4" data-kw="">
<blockquote><p>goodness (bonitas) is that act of the divine will, by which he is disposed to self-communication. Love (amor), that by which God is moved toward created things and bestows blessings on them. Grace (gratia), that by which God is moved to communicate himself to creatures of his own accord, not on grounds of merit or debt. Mercy (misericordia) is the disposition of the divine will to help the wretched, not because of any external cause, but solely of the divine goodness. Hatred (odium) in God indicates either the disapproval of sin, or the will to punish sinners that follows sin, or the denial of those salutary benefits that flow from the divine will. Longing (desiderium) in God indicates that the obedience of human beings is exceedingly pleasing to him, and not without future reward. Hope and expectation (spes et expectatio) in God signify that something is owed. God is said to rejoice (gaudere) when something is pleasing to him. Dread (metus) is something attributed to him, in order to indicate that he desires to prevent evil. Sorrow (tristia) in God indicates something that is exceedingly displeasing to God and contrary to his virtues.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/leonard-rijssen.html">Leonard Rijssen</a></span><span class="wk"><span class="lbl">Work:</span> <cite>as translated in Richard Muller, Post-Reformation Reformed Dogmatics</cite>, (Baker Academic, 2003), vol. 3, ch. 6.3, Divine Affections &amp; Virtues, A. General Considerations, 3. Doctrinal Conclusions, pp. 560-61</span></figcaption>

<blockquote><p>(1.) The life which he now led was a life of faith with respect unto things spiritual and eternal. For he had for the foundation and object hereof, [1.] The promise of the blessed Seed, and the spiritual blessing of all nations in him, as a confirmation of the first fundamental promise to the church, concerning the Seed of the woman that was to break the serpent’s head. And [2] God entered expressly into covenant with him, confirming it with the seal of circumcision, wherein he obliged himself to be his God, his God almighty, or all-sufficient, for his temporal and eternal good. To suppose that Abraham saw nothing in this promise and covenant but only things confined unto this life, nothing of spiritual grace or mercy, nothing of eternal reward or glory, is so contrary to the analogy of faith, to express testimony of Scripture, so destructive of all the foundations of religion, so unworthy of the nature and properties of God, rendering his title of “the father of the faithful,” and his example in believing, so useless, as that it is a wonder men of any tolerable sobriety should indulge to such an imagination.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/john-owen.html">John Owen</a></span><span class="wk"><span class="lbl">Work:</span> <cite>An Exposition of the Epistle to the Hebrews</cite>, ed. W. H. Goold, Works of John Owen (Edinburgh: Johnstone and Hunter, 1854), 24.67.</span></figcaption>

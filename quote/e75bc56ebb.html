<main class="wrap"><figure class="quote" id="q-e75bc56ebb" data-kw="">
<blockquote><p>Slavery of servants to lords or masters, such as were of old amongst the Jews, is not natural, but against nature.

1. Because slavery is malum naturae, a penal evil and contrary to nature, and a punishment of sin.

2. Slavery should not have been in the world, if man had never sinned, no more than there could have been buying and selling of men, which is a miserable consequent of sin and a sort of death, when men are put to the toiling pains of the hireling, who longs for the shadow, and under iron harrows and saws, and to hew wood, and draw water continually.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/samuel-rutherford.html">Samuel Rutherford</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Lex Rex</cite>, ... (1644; Edinburgh: Ogle, 1843), p. 51</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/civil-government-and-society/the-civil-magistrate.html">The Civil Magistrate</a></span></div>

</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-cf842d1c29" data-kw="">
<blockquote><p>Objection 4 [by an Erastian]: When its required that the magistrates be men fearing God, hating coveteousness, etc. (Ex. 18:21; Dt. 1:16-17; 17:19-20), is not this an essential ingredient of a king as a king, that he read in the book of the Law, that he may fear God, Deut. 17? [Rutherford’s] Answer: There is a twofold goodness here to be considered: one of the magistrate as a magistrate, another as a good and Christian magistrate. The former is an official goodness, or a magistratical prudence, justice, and goodness; this is required of all magistrates, as such, to judge the people: so the acts of a heathen magistrate done according to common natural equity, by Nebuchadnezzar, Pilate, Caesar, Felix, Festus, are to be acknowledged as acts of a lawful magistrate, valid and no less essentially magistratical than if performed by King David; and of this goodness the Scriptures speak not as essential to a magistrate as a magistrate. But there is another goodness required of magistrates as they are members of the Jewish Church, and as they are Christians, and of these the Scripture speaks; and so magistrates not as magistrates, but as good and Christian, are to be such as fear God, hate covetousness, respect not the face and favor of men; so its denied that the fear of God, hating of covteousness, are essential ingredients of kings as kings. For kings as kings intend justice, peace, godliness, materially considered, both ex conditione operis [out of the nature of the work], and operantium [of those working]. But for justice and righteous judgment in a spiritual and an evangelic way, that belongs not to the essence of a magistrate, nec ex conditione seu ex intentione operis, nec ex conditione operantis [neither out of the nature or the intention of the work, nor out of the nature of the one working]: The Holy Ghost requires it of judges, as they would approve themselves as truly holy and religious, and would be accepted of God; And in this sense kings as kings do not serve God, nor the mediator Christ, nor yet as men; only they serve God and the mediator Christ as Christian Kings, or as Christian men rather.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/samuel-rutherford.html">Samuel Rutherford</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Divine Right of Church Government</cite>, … (London, 1646), ch. 24, Question 20, pp. 547-48</span></figcaption>

<blockquote><p>5. [Henning] Arnisaeus [d. 1636, a German, Lutheran political writer] desires that kings may use sparingly the plenitude of their power for public good; there must be, says he, necessity to make it lawful to use the plenitude of their power justly; therefore Ahab sinned, in that he unjustly possessed Naboth’s vineyard… but this plenitude of power may be justly put forth in act, says he, if the public good may be regarded.</p></blockquote>

<blockquote><p>2. The civil corporation may: [1.] limit the major [an official] in regard of time, for a year and no longer; 2. they may make him half a tyrant, a dictator and absolute, or give him less power, that he shall rule none but with the consent of 12 assessors; but the people may not make him a pastor for a year and then lay him aside for no fault as a major is unofficed; nor may they limit him so as he shall not preach in season and out of season but by the consent of 12 men.

3. The corporation may erect itself in a kingdom or commonwealth and may create consuls, dictators, praetors, tribunos plebis, etc. as may most serve for the safety and peace of this State; but the Church may bring in no new officers but those appointed by Christ; nor may they alter the government, and metamorphose it into another than that which is according to the pattern showed in the mount.</p></blockquote>

</figure><figure class="quote" id="q-89f7088cea" data-kw="">
<blockquote><p>Next to fidelity towards God, study to adorn your cause with loyalty to your king, in the Lord, Rom. 13:1, 5; Prov. 24:21; 1 Pet. 2:13. ‘Give unto God the things which are God’s, and unto Ceasar the things which are Cesar’s,” that hereby ye may stop the mouths of them that falsely speak evil of the presbyterian interest and party as inimical to king’s crowns, 1 Pet. 2:15. Did he not in the Usurper’s [Cromwell’s] time find you the most faithful party to him of any? And albeit ye be but ill requat, yet discourage not to follow your duty for the Lord’s sake. We are apt to believe, if any other party in the nation had been so crushed and harassed by his power as ye, none would have born it better. Let him still find that no discouragement will fret or tempt you from your duty and that for conscience-sake, without by-ends; yea, bear due allegiance to him so far as may stand with your allegiance to the King of kings and Lord of lords. And who knows what a conviction this may produce in end? 1 Sam. 24:17-18, testifying to him and all men your cause is of God, which leads you to be so conscientious toward man; and that you are the only fast and faithful friends to authority, who will cleave to it in a stormy day out of the fear of God when all its self-seeking friends will desert it when their interest parts with it; and that it is not humor, but conscience which keeps you off from complying with his will in the matters of your God wherein ye differ from him.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/john-bairdie.html">John Bairdie</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Balm from Gilead</cite>, (1674; London: Cockerill, 1681), pp. 171-72</span></figcaption>

<div class="actions"><button class="copy" data-copy="“Next to fidelity towards God, study to adorn your cause with loyalty to your king, in the Lord, Rom. 13:1, 5; Prov. 24:21; 1 Pet. 2:13. ‘Give unto God the things which are God’s, and unto Ceasar the things which are Cesar’s,” that hereby ye may stop the mouths of them that falsely speak evil of the presbyterian interest and party as inimical to king’s crowns, 1 Pet. 2:15. Did he not in the Usurper’s [Cromwell’s] time find you the most faithful party to him of any? And albeit ye be but ill requat, yet discourage not to follow your duty for the Lord’s sake. We are apt to believe, if any other party in the nation had been so crushed and harassed by his power as ye, none would have born it better. Let him still find that no discouragement will fret or tempt you from your duty and that for conscience-sake, without by-ends; yea, bear due allegiance to him so far as may stand with your allegiance to the King of kings and Lord of lords. And who knows what a conviction this may produce in end? 1 Sam. 24:17-18, testifying to him and all men your cause is of God, which leads you to be so conscientious toward man; and that you are the only fast and faithful friends to authority, who will cleave to it in a stormy day out of the fear of God when all its self-seeking friends will desert it when their interest parts with it; and that it is not humor, but conscience which keeps you off from complying with his will in the matters of your God wherein ye differ from him.”

— John Bairdie, Balm from Gilead, or the Differences about the Indulgence Stated &amp; Impleaded in a Sober &amp; Serious Letter to Ministers &amp; Christians in Scotland (1674; London: Cockerill, 1681), pp. 171-72">Copy</button><a class="share" href="https://x.com/intent/post?text=%E2%80%9CNext+to+fidelity+towards+God%2C+study+to+adorn+your+cause+with+loyalty+to+your+king%2C+in+the+Lord%2C+Rom.+13%3A1%2C+5%3B+Prov.+24%3A21%3B+1+Pet.+2%3A13.+%E2%80%98Give+unto+God+the+things+which+are+God%E2%80%99s%2C+and+unto+Ceasar+the+things+which+are+Cesar%E2%80%99s%2C%E2%80%9D+that+hereby+ye+may+stop+the+mouths+of+them+that+falsely+speak+evil+of+the+presbyterian+interest+and+party+as+inimical+to+king%E2%80%99s+crowns%2C+1+Pet.+2%3A15.+Did+he+not+in+the+Usurper%E2%80%99s+%5BCromwell%E2%80%99s%5D+time+find+you+the+most+faithful+party+to+him+of+any%3F+And+albeit+ye+be+but+ill+requat%2C+yet+discourage+not+to+follow+your+duty+for+the+Lord%E2%80%99s+sake.+We+are+apt+to+believe%2C+if+any+other+party+in+the+nation+had+been+so+crushed+and+harassed+by+his+power+as+ye%2C+none+would+have+born+it+better.+Let+him+still+find+that+no+discouragement+will+fret+or+tempt+you+from+your+duty+and+that+for+conscience-sake%2C+without+by-ends%3B+yea%2C+bear+due+allegiance+to+him+so+far+as+may+stand+with+your+allegiance+to+the+King+of+kings+and+Lord+of+lords.+And+who+knows+what+a+conviction+this+may+produce+in+end%3F+1+Sam.+24%3A17-18%2C+testifying+to+him+and+all+men+your+cause+is+of+God%2C+which+leads+you+to+be+so+conscientious+toward+man%3B+and+that+you+are+the+only+fast+and+faithful+friends+to+authority%2C+who+will+cleave+to+it+in+a+stormy+day+out+of+the+fear+of+God+when+all+its+self-seeking+friends+will+desert+it+when+their+interest+parts+with+it%3B+and+that+it+is+not+humor%2C+but+conscience+which+keeps+you+off+from+complying+with+his+will+in+the+matters+of+your+God+wherein+ye+differ+from+him.%E2%80%9D%0A%0A%E2%80%94+John+Bairdie%2C+Balm+from+Gilead%2C+or+the+Differences+about+the+Indulgence+Stated+%

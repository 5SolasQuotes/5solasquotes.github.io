<main class="wrap"><figure class="quote" id="q-0314faa90f" data-kw="">
<blockquote><p>why does Moses in this place [Dt. 33:16] set Him in the bush? It is because God had there showed Himself unto Him… God considers how it is for our benefit to have some familiarity with Him: and thereupon He yields to our rudeness, and takes upon Him as it were a new shape, howbeit not which is contrary (as I said afore), but to the intent that we should not be scared, nor take occasion to shrink from Him. Now then, He allures us gently, and therewithal He stops to us and makes Himself as it were mean [lowly] unto us…. But we see how He showed Himself to the fathers of old-time under certain shapes. As for example when He talked with Jacob in Bethel, it was because Jacob needed such confirmation (Gen. 28:13)… …as if he should say, ‘…he appeared to me in the bush, and there I knew his majesty…&#x27;</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/john-calvin.html">John Calvin</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Sermons on Deuteronomy</cite>, The Sermons of… Calvin upon the Fifth Book of Moses… (London: Middleton, 1583), Sermon 196, pp. 1215-16</span></figcaption>

<blockquote><p>If these other things of policy be necessary, necessitate precepti [by the necessity of precept], in regard that Jesus Christ has commanded them to be observed, why then are some things alterable which Christ has commanded to be observed, some things unalterable? Cross and surplice, which prelates say have been in the Church these twelve hundred years, are in themselves as positive, and have as small affinity with the civil laws, customs and manners of nations (except they mean sinful customs) as sacramental eating and drinking. And the like may be said of all the alterable ceremonies sometimes in use, in England, and now in force amongst Papists.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/samuel-rutherford.html">Samuel Rutherford</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Divine Right of Church Government</cite>, (London, 1646), p. 10</span></figcaption>

</figure><figure class="quote" id="q-6618d7e760" data-kw="">
<blockquote><p>1. The form of worship forbidden in the word of God is idolatry and the adoration of saints.

2. Idolatry is the making, maintaining and religious worshipping of an idol. …

3. An idol is an image of likeness [simulacrum] made for the purposes of religious worship. Propositions I. An idol differs from an image and likeness as species from genus… So not every likeness [simulacrum] is an idol; in fact, Tertullian calls man the simulacrum of God. …

III. To make an idol is to make an image or likeness for purposes of religious worship.

IV. Therefore, not all making of images and likenesses is idolatry; they may be made for memorials, for enjoyment and other secular [politicus] purposes.

V. The cherubim, the bronze serpent, and other objects made by God’s order were not made for purposes of religious worship, but as types of Christ. Therefore, the papists wrongly seek to defend their idols on this pretext. For (1) God ordered the making of these objects, but forbids idols; (2) no religious worship was given them, so that when the bronze serpent began to be worshipped, it was destroyed (2 Kings 18:4); to idols the religious worship is given; (3) since all types are done away since the coming of Christ, such objects have no place in the New Testament. Saints are true idols [images of God].

VI. The images that the papists make of Christ, the angels, Mary and the saints [are forbidden]. The reason is tht they are made for purposes of religious worship. The papists deny that they are idols because… (4) the saints lived in genuine human form, and (5) the images are books for the laity. Response: …(4) As to the fourth, it follows from this only that images of the saints can be made, that is, if it is not done for purposes of religious worship. (5) As for the fifth argument, its premise is false; what kind of books the idols [note Wolleb does not say “images”] are is evident from Jeremiah 10:14-15 and Habakkuk 2:18-19, where they are called teachers of lies and vanity.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/johannes-wolleb.html">Johannes Wollebius</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Abridgment of Christian Divinity</cite>, (1626), bk. 2, ‘The Service of God’, 2nd Commandment in ed. John Beardslee, Reformed Dogmatics: J. Wollebius, G. Voetius &amp; F. Turretin (Oxford Univ. Press, 1965), pp. 208-10</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/worship/idolatry-and-images.html">Idolatry and Images</a></span></div>

</figure><figure class="quote" id="q-d9eb87081e" data-kw="">
<blockquote><p>For our hope is placed in the true cross of our Lord Jesus Christ, not in an image. For this reason I confess that I whole-heartedly detest the image of the crucifix. It is the image of the cruelty of the Jews against Christ, and so I cannot bear it. Hezekiah is praised for destroying the bronze serpent to which divine worship was being offered (2 Kings 10 [18:4]), and so I think they should be praised also who do away with the image of the crucifix as well, for the purpose of guarding against the same idolatry, and eliminate them from all temples and sacred places.</p></blockquote>

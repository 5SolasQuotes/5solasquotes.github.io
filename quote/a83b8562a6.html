<main class="wrap"><figure class="quote" id="q-a83b8562a6" data-kw="">
<blockquote><p>For which cause principally, I thought good to speak of it [love] briefly in this treatise, after faith and hope, for that faith, wherein we say consists the second part of our effectual calling, has these for inseparable companions, faith, hope, and repentance; after which follows our justification by order, not of time, but of nature.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/robert-rollock.html">Robert Rollock</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Select Works of Robert Rollock ed. Gunn (d. 1599; Edinburgh: Wodrow Society, 1849), vol. 1, A Treatise of God’s Effectual Calling, ch. 33, ‘Of Charity or Love’</cite>, p. 237</span></figcaption>

</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-43175d6add" data-kw="Faith alone">
<blockquote><p>By that alone are we justified by which the righteousness of Christ is applied to us, who satisfied the law for us. Now this is done by faith alone; nor does it belong to love or to hope. Not to hope, which does not apprehend, but expects the thing promised. Not to love, which is concerned with the fulfillment of a command, not with the apprehension of a promise.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/francis-turretin.html">Francis Turretin</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Institutes of Elenctic Theology</cite>, 16.8.9</span></figcaption>

</figure><figure class="quote" id="q-eb601da6ae" data-kw="Sola fide Faith alone">
<blockquote><p>The reader now perceives with what fairness the Sophists of the present day cavil at our doctrine, when we say that a man is justified by faith alone (Rom. 4:2). They dare not deny that he is justified by faith, seeing Scripture so often declares it; but as the word alone is nowhere expressly used they will not tolerate its being added. … Does he not plainly enough attribute everything to faith alone when he disconnects it with works?</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/john-calvin.html">John Calvin</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Institutes of the Christian Religion</cite>, 3.11.19</span></figcaption>

<main class="wrap"><figure class="quote" id="q-e6965be348" data-kw="">
<blockquote><p>Samuel Simms, who at the time of writing was the minister of Loughbrickland Reformed Presbyterian Church (Covenanter) in Co. Down, did not exactly think that exclusive psalmody was a “non-essential”. Here is what he says about the evil of uninspired hymns:

Singing uninspired hymns is not, properly speaking, public worship at all; it is public will-worship, and is an utter abomination in God’s sight! A minister might just as well take his text out of Calvin’s Institutes, as give out a mere human composition, however good, to be sung by the congregation.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/samuel-simms.html">Samuel Simms</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Bible, the church, and terms of communion: together with the terms of communion of the Reformed Presbyterian Church in Ireland. To which is appended the Cameronian Dream</cite>, (Belfast, 1879), p. 42.</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/worship/psalmody.html">Psalmody</a></span></div>

<blockquote><p>ALL SCRIPTURE is INSPIRED by God and is useful, 1 composed by the Spirit for this reason, namely, that we men, each and all of us, as if in a general hospital for souls, may select the remedy for his own condition. For, it says, ‘care will make the greatest sin to cease.’ 2 Now, the prophets teach one thing, historians another, the law something else, and the form of advice found in the proverbs something different still.

But, the Book of Psalms has taken over what is profitable from all. It foretells coming events; it recalls history; it frames laws for life; it suggests what must be done; and, in general, it is the common treasury of good doctrine, carefully finding what is suitable for each one. The old wounds of souls it cures completely, and to the recently wounded it brings speedy improvement; the diseased it treats, and the unharmed it preserves. On the whole, it effaces, as far as is possible, the passions, which subtly exercise dominion over souls during the lifetime of man, and it does this with a certain orderly persuasion and sweetness which produces sound thoughts.

When, indeed, the Holy Spirit saw that the human race was guided only with difficulty toward virtue, and that, because of our inclination toward pleasure, we were neglectful of an upright life, what did He do? The delight of melody He mingled with the doctrines so that by the pleasantness and softness of the sound heard we might receive without perceiving it the benefit of the words, just as wise physicians who, when giving the fastidious rather bitter drugs to drink, frequently smear the cup with honey.

Therefore, He devised for us these harmonious melodies of the psalms, that they who are children in age or, even those who are youthful in disposition might to all appearances chant but, in reality, become trained in soul. For, never has any one of the many indifferent persons gone away easily holding in mind either an apostolic or prophetic message, but they do chant the words of the psalms, even in the home, and they spread them around in the market place, and, if perchance, someone becomes exceedingly wrathful, when he begins to be soothed by the psalm, he departs with the wrath of his soul immediately lulled to sleep by means of the melody.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/st-basil.html">Basil of Caesarea</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Homily 10 on Psalm 1</cite>, 1 in Saint Basil’s Exegetic Homilies, trans. Agnes Clare Way in The Fathers of the Church: A New Translation, Volume 46 (Washington DC, 1963), pp 151-52.</span></figcaption>

</figure><figure class="quote" id="q-1b98dd77e9" data-kw="">
<blockquote><p>Hymns of human composition are used so commonly now in public worship by Presbyterian churches that it is difficult to believe that the practice is not a hundred years old, and that in some of the churches it is of very recent date. On the supposition that it is good and dutiful and wise to sing such hymns in worship, it is equally difficult to account for the neglect of the churches at the time of the Reformation, and for generations afterwards. What could have so blinded the reformers as to make them reject hymns and sing the Psalms alone? How could the Westminster Divines, in framing their Confession of Faith and Directory for Worship, have been so unanimous in the blunder that the service of praise is to consist of the “Singing of Psalms?” And apart from the aspect of duty, how could the Presbyterian churches, for about a hundred and fifty or two hundred years after the Westminster Assembly, have been so insensible to the power of hymns as an attractive addition to their public services? We cannot by any means understand how it was that, if it was dutiful to use hymns in worship, the reformers did not discover the Scriptural warrant for the duty, especially as hymns had been used for centuries by the Church of Rome. Nor can we understand how they rejected the hymns and used the Psalms alone, unless on the supposition that they believed the use of hymns to be part of the will-worship of Rome.

If they were wrong on this point, then Rome and our modern Presbyterian churches are right. In that case, the Puritans and Covenanters were fanatics, and Romanists were truly enlightened. And most of our Presbyterian churches of the present day were fanatical too, and did not become truly enlightened and liberal till they got hack to the Romish practice! The Free Church of Scotland, for example, which existed for nearly forty years without an authorized hymn-book must have been so far an heir to Puritanic and Covenanting fanaticism till the year of grace 1882, when it went back beyond the time of the Presbyterian Reformation to find a nobler inheritance in the Romish practice of singing uninspired hymns in worship.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/james-dick.html">James Dick</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Hymns and hymn-books in Original Covenanter</cite></span></figcaption>
<div class="meta"><span class="t"><a href="../topics/worship/psalmody.html">Psalmody</a></span></div>

</figure><figure class="quote" id="q-b63324ff26" data-kw="">
<blockquote><p>Had the Psalms been scattered throughout the books of the Old Testament, instead of being collected into one Book, then it might have been fairly inferred that the people of God were left to sing all the songs contained in the sacred writings— the songs of Moses, Deborah, Hannah, &amp;c., as well as those composed by David, Asaph, and others, and now found in the Psalter.

But infinite Wisdom in preparing a Psalm Book for His Church, thought proper to leave out the song of Moses at the Red Sea, of Deborah, of Hannah, and other songs, and who will say that it was a fault, and that God ought to have incorporated these songs with the “Sepher Tehillim,” or Book of Praises?

How can Mr. C. [Thomas Smyth] say, as he often does in substance, that the Church is as much hound to sing those Divine songs which have been left out of the Psalter, as those contained in it? If so, why were they left out? Their omission was surely not an oversight in the Deity. It was His will that they should be omitted, and no man can say with propriety that they should not, and that the Church was, and is still bound to employ them in Divine worship, notwithstanding their exclusion from that standard of praise which God himself has provided.

It may be the songs of Moses, Deborah, and others, not found in the Book of Psalms, were sung in the stated worship of God previous to the compilation of that Book, but after the compilation was made, and they were omitted, it was no longer proper to employ them in the regular instituted service of the Temple-—else where was the propriety of God’s “taking order” in selecting a system of Psalmody, if, after the selection was made, every one had a right to add to it what ever he thought proper, and even those very songs which Infinite Wisdom thought wise to omit?</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/william-ramsey-hemphill.html">William Ramsey Hemphill</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Letter IV. Psalmody – Divine Authority in Evangelical Guardian</cite></span></figcaption>

<div class="actions"><button class="copy" data-copy="“Had the Psalms been scattered throughout the books of the Old Testament, instead of being collected into one Book, then it might have been fairly inferred that the people of God were left to sing all the songs contained in the sacred writings— the songs of Moses, Deborah, Hannah, &amp;c., as well as those composed by David, Asaph, and others, and now found in the Psalter.

But infinite Wisdom in preparing a Psalm Book for His Church, thought proper to leave out the song of Moses at the Red Sea, of Deborah, of Hannah, and other songs, and who will say that it was a fault, and that God ought to have incorporated these songs with the “Sepher Tehillim,” or Book of Praises?

How can Mr. C. [Thomas Smyth] say, as he often does in substance, that the Church is as much hound to sing those Divine songs which have been left out of the Psalter, as those contained in it? If so, why were they left out? Their omission was surely not an oversight in the Deity. It was His will that they should be omitted, and no man can say with propriety that they should not, and that the Church was, and is still bound to employ them in Divine worship, notwithstanding their exclusion from that standard of praise which God himself has provided.

It may be the songs of Moses, Deborah, and others, not found in the Book of Psalms, were sung in the stated worship of God previous to the compilation of that Book, but after the compilation was made, and they were omitted, it was no longer proper to employ them in the regular instituted service of the Temple-—else where was the propriety of God’s “taking order” in selecting a system of Psalmody, if, after the selection was made, every one had a right to add to it what ever he thought proper, and even those very songs which Infinite Wisdom thought wise to omit?”

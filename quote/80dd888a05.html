<main class="wrap"><figure class="quote" id="q-80dd888a05" data-kw="">
<blockquote><p>The law as a rule of life is also of great use to believers. … Now in this point of view, it serves in the following ways, under the illuminating influences of the Holy Spirit: …To show them how far they are from perfection of holiness. In order to render them humbler and more contrite; to cause them to renounce, in a higher degree, all confidence in their own wisdom, righteousness, and strength; and to trust constantly and only in the Lord Jesus for all their salvation, the law discovers to them the sin that dwells in them and that cleaves to all their thoughts, words, and actions. It is of great use to teach them the need that they have to be more humble, penitent, and holy. And so it serves, in a high degree, to promote their sanctification and their desire to attain perfection of holiness (Rom. 7:22–24; Phil. 3:10–14). As it requires them to be holy in a perfect degree (Matt. 5:48), it shows them that their want of perfect conformity to it is, every moment, their sin and that they ought continually to press on toward perfection and long for heaven, where their holiness and happiness will be perfect (2 Cor. 5:2–4; Phil. 1:23).</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/john-colquhoun.html">John Colquhoun</a></span><span class="wk"><span class="lbl">Work:</span> <cite>A Treatise on the Law and Gospel</cite>, (Grand Rapids: Reformation Heritage Books), 117-18.</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/the-law-of-god.html">The Law of God</a></span></div>

</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-be4c076f2a" data-kw="">
<blockquote><p>When Paul says, “The law is not of faith,” he sets down the main difference between the law and the gospel. The law promises life to him that performs perfect obedience, and that for his works. The gospel promises life to him that does nothing in the cause of his salvation, but only believes in Christ. And it promises salvation to him that believes, yet not for his faith, or for any works else, but for the merit of Christ. The law then requires doing to salvation; and the gospel, believing, and nothing else.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/william-perkins.html">William Perkins</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Works of William Perkins: vol. 2: Commentary on Galatians</cite>, ed. Paul M. Smalley, Joel R. Beeke, and Derek W. H. Thomas, vol. 2 (Grand Rapids, MI: Reformation Heritage Books, 2015), 177.</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/the-law-of-god.html">The Law of God</a></span></div>

</figure><figure class="quote" id="q-8063f6df32" data-kw="">
<blockquote><p>Ignorance of the difference between the law and the gospel promotes also, in a great degree, the strength and influence of a self-righteous temper. When a man is driven to acts of obedience by the dread of God’s wrath revealed in the law and not drawn to them by the belief of His love revealed in the gospel; when he fears God because of His power and justice and not because of His goodness; when he regards God more as an avenging judge than as a compassionate friend and father; and when he contemplates God rather as terrible in majesty than as infinite in grace and mercy, he shows that he is under the dominion, or at least under the prevalence, of a legal spirit. If he builds his faith of the pardon of sin, of the favor of God, and of eternal life on any graces that he supposes are implanted in him or on any duties that are performed by him, he is evidently under the power of a self-righteous temper. He shows that he is under the influence of this hateful temper by grounding his hope and his comfort on conditions performed by himself and not on the gracious and absolute promises of the gospel. In a word, when his hope of divine mercy is raised by the liveliness of his frame in duties and not by discoveries of the freeness and riches of redeeming grace offered to him in the gospel; or when he expects eternal life not as the gift of God through Jesus Christ but as a recompense from God for his own obedience and suffering, he plainly shows that he is under the power of a legal spirit. Now, if he is ignorant of the leading distinctions between the law and the gospel, this ignorance will strengthen his legal propensity and confirm him in his resolution to seek justification partly, if not wholly, by the works of the law.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/john-colquhoun.html">John Colquhoun</a></span><span class="wk"><span class="lbl">Work:</span> <cite>A Treatise on the Law and Gospel</cite>, (Grand Rapids: Reformation Heritage Books), 129–30.</span></figcaption>

<main class="wrap"><figure class="quote" id="q-ba4f4a651c" data-kw="">
<blockquote><p>The most of the persons whom the Papists now keep holy days for were very religious godly people: And the zealous religious people of that age did think that the honoring of the memories of the martyrs was a great means to invite the infidels to Christianity and to encourage the weak to stick to Christ: and therefore they kept the days of their martyrdom in thanksgiving to God and in honor of them. The wicked of that age hated and persecuted both the martyrs and them that honored them. In the next age, religion being uppermost in the world, the wicked did turn hypocrites and keep holy days for the honor of their names whom their forefathers murdered. At last when it was observed that the Papists who burned the living saints were the greatest honorers of the dead, the most religious people turned quite to dislike and reject those very days which their predecessors had set up in thanksgiving to God for the doctrine, example and constancy of the martyrs.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/richard-baxter.html">Richard Baxter</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Cure of Church Divisions</cite>, … (London, 1670), pt. 1, Direction 58, ‘Take heed of superstition, and observe well the circular course of zealous superstition…’, p. 280</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/worship/holy-days-and-church-calendar.html">Holy Days and Church Calendar</a></span></div>

<blockquote><p>§46. 6. And as for holy days, there is great difference between them: Those are liable to most question that are obtruded on the Church with the greatest confidence. As for such days as are appointed upon some emergent occasions that arose since Scripture was indited, and are not common to all times and places of the Church, there is no more question whether the magistrate may command them, or the pastors agree upon them, than whether a lecture-day, or fast-day, or thanksgiving-day may be commanded or agreed on: some time for God’s worship besides the Lord’s Day must be appointed: And God having not told us which, the magistrate may, on fit occasions. And this is no derogation from the sufficiency of Scripture: For the occasion of the day was not existent when the Scripture was written: such occasions are various according to the various state of the Church in several ages and countries. And therefore to keep an anniversary day of thanksgiving, such as we keep on the fifth of November for our deliverance from the Papists’ powder plot, is no more questionable than to keep a lecture.</p></blockquote>

<blockquote><p>I would to God that every [so-called] Holy-day whatsoever beside the Lord’s Day, were abolished. That zeal which brought them in, was without all warrant of the Word, and merely followed corrupt reason, forsooth to drive out the Holy days of the Pagans, as one nail drives out another. Those Holy days, have been so tainted with superstition that I wonder we tremble not at their very names.</p></blockquote>

</figure><figure class="quote" id="q-98e8182564" data-kw="">
<blockquote><p>Bishop Andrewes will have the feast of Easter drawn from that place 1 Cor. 5:8, where he says there is not only a warrant, but an order for the keeping of it, and he will have it out of doubt that this feast is of apostolical institution, because after the times of the apostles, when there was a contention about the manner of keeping Easter, it was agreed upon by all that it should be kept, and when the one side alleged for them St. John [for keeping it on Passover], and the other St. Peter [for keeping it on the Lord’s Day], it was acknowledged by both that the feast was apostolical. I answer, the testimony of Socrates [a church historian in the early Church] deserves more credit than the Bishop’s naked conclusion. ‘I am of opinion,’ says Socrates (bk. 5, ch. 22), ‘that as many other things crept in of custom in sundry places, so the feast of Easter to have prevailed among all people, of a certain private custom and observation.’ But whereas B. Lindsay in defense of B. Andrewes, replies that Socrates propounds this for his own opinion only, I answer that Socrates in that chapter proves his opinion from the very same ground, which B. Andrewes wrests, to prove that this Feast is Apostolical. For while as in that hot controversy about the keeping of Easter, they of the East alleged John the apostle for their author, and they of the west alleged Peter and Paul for themselves; Yet (says Socrates), there is none that can show in writing any testimony of theirs, for confirmation and proof of their custom. And hereby I do gather that the celebration of the Feast of Easter came up more of custom than by any law or canon.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/george-gillespie.html">George Gillespie</a></span><span class="wk"><span class="lbl">Work:</span> <cite>English Popish Ceremonies</cite>, (1637), pt. 3, ch. 6, p. 98</span></figcaption>

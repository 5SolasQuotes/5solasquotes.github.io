<blockquote><p>Redemption is to mend the creature, not of any defect that was left in the creation, but from the ruin which came by our defacing transgression. The law of grace upon this redemption is superadded to the law of nature given on the creation; not to amend any imperfections in that law, but to save the sinner from its insufferable penalty by dissolving its obligation of him thereto; and thus, in its nature and use, it is a remedying law.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/richard-baxter.html">Richard Baxter</a></span><span class="wk"><span class="lbl">Work:</span> <cite>True Christianity; or, Christ’s Absolute Dominion, and Man’s Necessary Self-Resignation and Subjection. In Two Assize Sermons, Preached before the Honourable Judge of Assize, at Worcester, August 2, 1654</cite>, in The Practical Works of Richard Baxter (4 vols, London: George Virtue, 1838), 3: 785.</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/civil-government-and-society.html">Civil Government and Society</a></span></div>

<blockquote><p>That it is possible that the sadness, sorrow, mid grief of those particular saints that thou hast thine eye upon may arise from the natural temper and constitution of their bodies. Many saints are often cast into a melancholy mould; for though grace changes the disposition of the soul, yet it alters not the constitution of the body.

Now there is no greater enemy to holy joy and gladness than melancholy, for this pestilent humour will raise such strange passions and imaginations, it will raise such groundless griefs, and fears, and frights, and such senseless surmises and jealousies, as will easily damp a Christian’s joy, and mightily vex, perplex, trouble, and turmoil, daunt, and discourage a Christian’s spirit.

A melancholy constitution is Satan’s anvil, upon which he forms many black, dark, and dismal temptations, which do exceedingly tend to the keeping down of divine consolation from rising high in the soul. This black, dark, dusky humour disturbs both soul and body; it tempts Satan to tempt the soul, and it unables the soul to resist the temptation; yea, it prepares the soul to hearken to the temptation, and to close and fall in with the temptation, as the experiences of all melancholy Christians can testify.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/thomas-brooks.html">Thomas Brooks</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Crown and Glory of Christianity; or Holiness, the only way to Happiness. Discovered in LVIII Sermons from Heb. 12. 14</cite>, (1662) in The Works of Thomas Brooks, ed. Alexander B. Grossart (6 vols, Edinburgh: James Nichol, 1861-67), 4: 260.</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/civil-government-and-society.html">Civil Government and Society</a></span></div>

</figure><figure class="quote" id="q-9341b243da" data-kw="">
<blockquote><p>Now it remains to address the Magistrate, whom I judge can be described as a person chosen and instituted by God to defend the divine laws in matters of external discipline, by inflicting bodily punishment upon transgressors and by supporting and encouraging the good. The divine plan selects many people who do not act as magistrates. The ministers of the Church are one example. They still defend God’s word and laws, but not only in matters of external instruction. It is the duty of ministers to reach into the depths and motions of souls by way of the divine word. The Holy Spirit acts here as well, joining His strength with that of orthodox preaching and of the sacraments distributed by the Church.

The magistrate works alone in edifying and punishing transgressors. The minister binds the guilty and the incorrigible in the name of God, and excludes them from the kingdom of Heaven unless they correct their ways. The magistrate inflicts external punishment, working through the use of the sword. Both ministers and magistrates act to nurture the pious, but in different ways. The magistrate increases them in works, honours and merits. The minister consoles them through the promises of God and the sacraments.

The magistrate assures that the laws are kept most carefully, the guilty are punished, and the good are both helped and nurtured. The law acts as a mute magistrate, while the magistrate represents the moving and speaking law. Certainly he is also a minister of God since, as Paul said, magistrates sing the praises of those who live justly [Romans 13:3]. The magistrate wields the sword against the wicked, acting as the avenger and champion of God, and looks to nothing else but the salvation of men.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/peter-martyr-vermigli.html">Peter Martyr Vermigli</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Of a magistrate, and the difference between civil and ecclesiastical power (1561) in W. J. T. Kirby (ed.), The Zürich Connection and Tudor Political Theology</cite></span></figcaption>
<div class="meta"><span class="t"><a href="../topics/civil-government-and-society.html">Civil Government and Society</a></span></div>

</figure><figure class="quote" id="q-801ac81cd6" data-kw="">
<blockquote><p>Fourth [Obj.] Again, some may object against charity to such or such particular persons, that they are not obliged to give ’em [charity], for though they are [in] need yet they ben’t in extremity. ‘Tis true, they meet with difficulty, but yet not so but that they can live, though they suffer some hardships.

Ans. It don’t answer [the] rules of Christian charity only to relieve those that are in extremity, as might be abundantly shown. But I shall at this time mention but two things as an evidence of it.

1. We are commanded to love and treat one another as brethren; 1 Peter 3:8, “have compassion one of another, love as brethren, be pitiful.” Now is it a brotherly part for brethren to refuse to help one another, and to do anything for each other’s comfort and for the relief of each other’s difficulties, only when they are in extremity? Does it not become brothers and sisters to have a more friendly disposition one towards another than this comes to, and to be ready to be compassionate to one another under difficulties, though they ben’t extreme?

The rule of the gospel is that when we see our brother under any difficulty or burden we should be ready to bear the burden with him; Galatians 6:2, “Bear ye one another’s burdens, and so fulfil the law of Christ.” So we are commanded, “by love” to “serve one another” (Galatians 5:13).

The Christian spirit will make us apt to sympathize with our neighbour when we see him under any difficulty; Romans 12:15, “Rejoice with them that do rejoice, and weep with them that weep.” When our neighbour is under difficulty, he is afflicted; and we ought to have such a spirit of love to him that we should be afflicted with him in his affliction. And if we ought to be afflicted, then it will follow that we ought to be ready to relieve, because if we are afflicted with him, we relieve ourselves in relieving him; his relief is so far our relief as his affliction is our affliction. Christianity teaches [us] to be afflicted in our neighbour’s affliction; and nature teaches us to relieve ourselves when afflicted.

We should behave ourselves one towards another as brethren that are fellow-travellers, for we are pilgrims and strangers here on earth, and are on a journey. Now, if brethren are on a journey together, if one meets with difficulty in the way, does it not become the rest to help him not only in the extremity of broken bones or the like? If the provision for the journey falls short, it becomes his fellow-travellers to afford him supply out of their stores, and not to be over nice, and exact, and fearful, lest they should give him too much; for ’tis but provision for a journey, and it makes no odds when they get to their journey’s end.

2. That we should only relieve our neighbour when in extremity is not agreeable to that rule of loving our neighbour as ourselves. Though that rule don’t imply that we should love our neighbour to the same degree as we love ourselves, yet it implies that our love towards our neighbour should work in the same manner and express itself in the ways as our love to ourselves. We are very sensible of our own difficulties; we should also be ready to be sensible of their difficulties. We, from our love to ourselves, when we are under difficulties and suffer hardships, are apt to be concerned for our relief, to seek relief, and lay ourselves out for it. And, as we would love our neighbour {as ourselves}, we ought in like manner to be concerned when our neighbour is under difficulty and seek their relief.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/jonathan-edwards.html">Jonathan Edwards</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Letter to the Poor, Explained and Enforced (1733) in Mark Valeri (ed.), Sermons and Discourses, 1730-1733: The Works of Jonathan Edwards Volume 17 (New Haven CN: Yale University Press, 2000), pp 394-95.</cite></span></figcaption>

— Jonathan Edwards, Letter to the Poor, Explained and Enforced (1733) in Mark Valeri (ed.), Sermons and Discourses, 1730-1733: The Works of Jonathan Edwards Volume 17 (New Haven CN: Yale University Press, 2000), pp 394-95.">Copy</button><a class="share" href="https://x.com/intent/post?text=%E2%80%9CFourth+%5BObj.%5D+Again%2C+some+may+object+against+charity+to+such+or+such+particular+persons%2C+that+they+are+not+obliged+to+give+%E2%80%99em+%5Bcharity%5D%2C+for+though+they+are+%5Bin%5D+need+yet+they+ben%E2%80%99t+in+extremity.+%E2%80%98Tis+true%2C+they+meet+with+difficulty%2C+but+yet+not+so+but+that+they+can+live%2C+though+they+suffer+some+hardships.%0A%0AAns.+It+don%E2%80%99t+answer+%5Bthe%5D+rules+of+Christian+charity+only+to+relieve+those+that+are+in+extremity%2C+as+might+be+abundantly+shown.+But+I+shall+at+this+time+mention+but+two+things+as+an+evidence+of+it.%0A%0A1.+We+are+commanded+to+love+and+treat+one+another+as+brethren%3B+1+Peter+3%3A8%2C+%E2%80%9Chave+compassion+one+of+another%2C+love+as+brethren%2C+be+pitiful.%E2%80%9D+Now+is+it+a+brotherly+part+for+brethren+to+refuse+to+help+one+another%2C+and+to+do+anything+for+each+other%E2%80%99s+comfort+and+for+the+relief+of+each+other%E2%80%99s+difficulties%2C+only+when+they+are+in+extremity%3F+Does+it+not+become+brothers+and+sisters+to+have+a+more+friendly+disposition+one+towards+another+than+this+comes+to%2C+and+to+be+ready+to+be+compassionate+to+one+another+under+difficulties%2C+though+they+ben%E2%80%99t+extreme%3F%0A%0AThe+rule+of+the+gospel+is+that+when+we+see+our+brother+under+any+difficulty+or+burden+we+should+be+ready+to+bear+the+burden+with+him%3B+Galatians+6%3A2%2C+%E2%80%9CBear+ye+one+another%E2%80%99s+burdens%2C+and+so+fulfil+the+law+of+Christ.%E2%80%9D+So+we+are+commanded%2C+%E2%80%9Cby+love%E2%80%9D+to+%E2%80%9Cserve+one+another%E2%80%9D+%28Galatians+5%3A13%29.%0A%0AThe+Christian+spirit+will+make+us+apt+to+sympathize+with+our+neighbour+when+we+see+him+under+any+difficulty%3B+Romans+12%3A15%2C+%E2%80%9CRejoice+with+them+that+do+rejoice%2C+and+weep+with+them+that+weep.%E2%80%9D+When+our+neighbour+is+under+difficulty%2C+he+is+afflicted%3B+and+we+ought+to+have+such+a+spirit+of+love+to+him+that+we+should+be+afflicted+with+him+in+his+affliction.+And+if+we+ought+to+be+afflicted%2C+then+it+will+follow+that+we+ought+to+be+ready+to+relieve%2C+because+if+we+are+afflicted+with+him%2C+we+relieve+ourselves+in+relieving+him%3B+his+relief+is+so+far+our+relief+as+his+affliction+is+our+affliction.+Christianity+teaches+%5Bus%5D+to+be+afflicted+in+our+neighbour%E2%80%99s+affliction%3B+and+nature+teaches+us+to+relieve+ourselves+when+afflicted.%0A%0AWe+should+behave+ourselves+one+towards+another+as+brethren+that+are+fellow-travellers%2C+for+we+are+pilgrims+and+strangers+here+on+earth%2C+and+are+on+a+journey.+Now%2C+if+brethren+are+on+a+journey+together%2C+if+one+meets+with+difficulty+in+the+way%2C+does+it+not+become+the+rest+to+help+him+not+only+in+the+extremity+of+broken+bones+or+the+like%3F+If+the+provision+for+the+journey+falls+short%2C+it+becomes+his+fellow-travellers+to+afford+him+supply+out+of+their+stores%2C+and+not+to+be+over+nice%2C+and+exact%2C+and+fearful%2C+lest+they+should+give+him+too+much%3B+for+%E2%80%99tis+but+provision+for+a+journey%2C+and+it+makes+no+odds+when+they+get+to+their+journey%E2%80%99s+end.%0A%0A2.+That+we+should+only+relieve+our+neighbour+when+in+extremity+is+not+agreeable+to+that+rule+of+loving+our+neighbour+as+ourselves.+Though+that+rule+don%E2%80%99t+imply+that+we+should+love+our+neighbour+to+the+same+degree+as+we+love+ourselves%2C+yet+it+implies+that+our+love+towards+our+neighbour+should+work+in+the+same+manner+and+express+itself+in+the+ways+as+our+love+to+ourselves.+We+are+very+sensible+of+our+own+difficulties%3B+we+should+also+be+ready+to+be+sensible+of+their+difficulties.+We%2C+from+our+love+to+ourselves%2C+when+we+are+under+difficulties+and+suffer+hardships%2C+are+apt+to+be+concerned+for+our+relief%2C+to+seek+relief%2C+and+lay+ourselves+out+for+it.+And%2C+as+we+would+love+our+neighbour+%7Bas+ourselves%7D%2C+we+ought+in+like+manner+to+be+concerned+when+our+neighbour+is+under+difficulty+and+seek+their+relief.%E2%80%9D%0A%0A%E2%80%94+Jonathan+Edwards%2C+Letter+to+the+Poor%2C+Explained+and+Enforced+%281733%29+in+Mark+Valeri+%28ed.%29%2C+Sermons+and+Discourses%2C+1730-1733%3A+The+Works+of+Jonathan+Edwards+Volume+17+%28New+Haven+CN%3A+Yale+University+Press%2C+2000%29%2C+pp+394-95.&amp;url=https%3A%2F%2F5solasquotes.github.io%2Fquote%2F801ac81cd6.html&amp;via=5Solas" target="_blank" rel="noopener">Share on X</a><a class="perma" href="../quote/801ac81cd6.html">Permalink</a><a class="src" href="https://reformedcovenanter.wordpress.com/2019/11/23/jonathan-edwards-on-our-duty-to-help-those-in-difficulty-not-simply-in-extremity/" rel="noopener" target="_blank">Read it online · Reformed Covenanter</a></div>

<blockquote><p>THUS MUCH CONCERNING INWARD FREEDOM: NOW CONCERNING OUTWARD FREEDOM. The outward freedom, is that which pertaineth to the outward life. And it is called Christian liberty, because it belongeth to Christians only. And that is two fold, freedom from the laws of Moses, and freedom indifferent things. Freedom from the laws of Moses, is that by which Christians are loosed from the ceremonial, &amp; Judicial laws of Moses, namely, so far forth as they only pertaine to the civil governement under Moses.

1. Cor. 9. 1. 19.

2. Cor. 3. 17. Heb. 9. 10. For such laws which belong to the law of nature, and by which all nations are bound, are not abrogated.</p></blockquote>

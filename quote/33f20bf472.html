<main class="wrap"><figure class="quote" id="q-33f20bf472" data-kw="">
<blockquote><p>Nor do the Arminians much honor the magistrate, who, walking in the steps of Erastus, do hold that the magistrate having power of public places, preachers are obliged not to preach in public places if the magistrate forbid them; but they may preach in private places. But: …

2. The Lord has no more given to magistrates power of places, or religious-actions in places, than He has given to them power of truths: Therefore, they [Arminians] must be obliged in conscience, rejecting a vain and sapless distinction, to preach in public places: for as that judicious and learned, [reformed] professor, Jacob Triglandius says, ‘The place is accident all to the worship, and changes not the nature of it;’ (Trigland, de Potest. et Eccelesiastica Dissertatio, Theol., p. 123)…

3. The apostles knew not this distinction, for they not only preached truth (the scribes and pharisees forbidding them), but in public places, and at all occasions, and daily in the Temple, and in every house they ceased not to teach and preach Jesus Christ (Acts 6:2,4; 4:1,20; 5:20-21). The magistrate, being Antichristian, forbids not preaching of saving truths because of the place, be it private or public, but he forbids them because they are saving; and if Jesus Christ has called a man to preach in public in the housetops, the magistrate has no power from God to silence him in public more than in private. The magistrate forbids that any teach false doctrine, not for the place, but because it is injurious and hurtful to human societies that men should be principled in a false religion, and cannot but disturb the public peace.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/samuel-rutherford.html">Samuel Rutherford</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Divine Right of Church Government</cite>, (1646), pp. 557-8</span></figcaption>

</figure><figure class="quote" id="q-56880e1e24" data-kw="">
<blockquote><p>2. My second distinction shall be this: The magistrate may and ought not only to conserve justice, peace and order in the commonwealth and in the church, as it is in the commonwealth, but also to take special care of the conservation of the true reformed religion and of the reformation of it when and wherein it needs to be reformed, imperative [by command], not elicitive [not by drawing forth the power by oneself]. The magistrate (says Dr. [Andrew] Rivet on the Decalogue, p. 262) is neither to administer Word, nor sacra- ments, nor church discipline, etc., but he is to take care that all these things be done by those whom God has called thereunto. Whatever is properly spiritual, belonging to the soul and inward man (such as church censures, and the other particular before mentioned), cannot be actus elicitus [an elicited act] of the magistrate… Yet all these, and generally the administration of the keys of the kingdom of Heaven, are actus imperati [having been commanded] of the Christian magistrate, and that both antecedenter [antecedently, before-hand] and consequenter [consequently, after-the-fact]: Antecedently, the magistrate may command church officers to suspend or excommunicate all obstinate and scandalous persons; he may command the classes to ordain able and godly ministers, and no other; he may command a synod to meet to debate and determine such or such a controversy. Consequently, also, when the thing is examined, judged, resolved, or done by the ecclesiastical power, the magistrate has power and authority to add his civil sanction, confirmation, or ratification; to make the ecclesiastical sentence to be obeyed and submitted unto by all whom it concerns; — in all which the Christian magistrate does exceeding much for the conservation and purgation of religion, not eliciendo actus, doing or exercising by himself, or by his own authority, acts of church government or discipline, but taking care that such and such things be done by those to whom they do belong.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/george-gillespie.html">George Gillespie</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Aaron’s Rod Blossoming</cite>, ... (London, 1646), bk. 2, ch. 8, pp. 122-23</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/civil-government-and-society/plague-quarantine-and-public-health.html">Plague, Quarantine and Public Health</a></span></div>

</figure><figure class="quote" id="q-c3281fdd53" data-kw="">
<blockquote><p>…it is the duty of a Christian Magistrate to provide that those things which either breed or nourish the plague, so far as they may, be taken away, and that regard may be had of those that be visited with this sickness, that all be not driven to be careful for all. But how they that serve in any public civil office may leave their charge in the time of the plague, I do not see; … But if in such calamities the magistrate do not in time provide, as much as may be, both by such lawful means as are not repugnant unto Christian charity, that the infection may be prevented, and also that the sick of the plague want [lack] nothing; he shall doubtless do very well both for the sick and the whole, and shall take away many questions which in this argument are wont [accustomed] to be raised:</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/theodore-beza.html">Theodore Beza</a></span><span class="wk"><span class="lbl">Work:</span> <cite>A Learned Treatise of the Plague</cite>, … (London, 1665), p. 18</span></figcaption>

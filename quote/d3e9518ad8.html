<main class="wrap"><figure class="quote" id="q-d3e9518ad8" data-kw="">
<blockquote><p>This is what they are doing here: for they do not mention what seemed good, that is, the restoration of the blind man’s sight, but stress what they can against Christ, that is, his breaking of the Sabbath. Thus some of the Pharisees said, that is, those who were malicious and corrupt, this man is not from God, who does not keep the Sabbath. But Christ did keep the Sabbath, for when the Lord forbade work on the Sabbath he had in mind servile work, which is a sin: whoever commits sin is the slave of sin (John 8:34). Therefore, he who performs works of sin on the Sabbath, breaks the Sabbath. So Christ, who was without sin, rather than they, kept the Sabbath.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/thomas-aquinas.html">Thomas Aquinas</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Super Evangelium S. Ioannis Lectura</cite>, (1270-72), C9.L2.n1326.</span></figcaption>

</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-0aa68eeec8" data-kw="">
<blockquote><p>Remember.] This word used, seems, 1. To reflect upon by-past omission and forgetfulness. For, though it was instituted in paradise, and was not now a new unheard-of thing to this people, as appears by Exod. xvi. 23, yet, it is like they were much worn out of the observation and practice of it, especially during the time of their captivity in Egypt. So then, it is renewed thus: Keep holy this day which you know was so long ago appointed to be so—Be not now any more unmindful and regardless of it.

2. Such a way of enjoining seems more particularly needful in this [commandment] than in the rest, because it is not so written in nature as the rest, but depends wholly upon particular institution, which may also be the cause why it is so large, and the form of it alone, amongst all the ten, both negative and positive. Thou shalt do no work, and, Remember to keep it holy.

3. But the main reason of this Remember, is, the main thing or aim in this Precept, as both the badge, and the preserver and increaser of all piety and religion. And therefore is it, that it is so often pressed in the books of the Law, and in the sermons of the Prophets to the people of God, and so often called a sign of God’s covenant with them, and their mark of distinction from all other people. Exod. xxiii. 12, and xxxi. 13, 14. Levit. xix, 30; XXV. 2, &amp;c. Jer. xvii. Isa. Iviii. 13, 14, &amp;c.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/robert-leighton.html">Robert Leighton</a></span><span class="wk"><span class="lbl">Work:</span> <cite>An Exposition of the Ten Commandments</cite>, (1701) in The Whole Works of the Most Reverend Father in God, Robert Leighton, D.D., Archbishop of Glasgow (2 vols, London: James Duncan, 1828), 2: 380.</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/worship.html">Worship</a></span></div>

</figure><figure class="quote" id="q-c14dc0bdcb" data-kw="">
<blockquote><p>I have enterprised (Christian reader) this work, with regard of God’s honor, and comfort of his people; that his Word might dwell in us richly, in all wisdom; and that we might teach and admonish ourselves, in psalms and hymns and songs spiritual. This I have labored to effect, by setting over into our tongue the Psalms in meter… … Psalms of holy Scripture, are perpetually to be sung in the Church.</p></blockquote>

</figure><figure class="quote" id="q-5f508fedcc" data-kw="">
<blockquote><p>1. It is not absolutely unlawful to personate another man, nor does the Second Commandment forbid such living Images in this extent. I pass by the instance of the woman of Tekoah, 2 Sam. 14, because the bare history proves not the lawfulness. But Paul’s speaking as of himself and Apollos the things which concerned others, was approvable: And as Christ frequently taught by parables, so his parables were a description of good and evil, by the way of feigned history, as if such and such things had been done by such persons as never were. And this fiction is no falsehood; For the hearer knows that it is not meant as an historical narrative, but a parable; And it is but an image in words, or a painted doctrine. And if a person and action may be feigned by words, I know not where it is forbidden to feign them by personal representation. Therefore to personate another is not simply a sin.

2. To personate good men in good actions is not simply unlawful: because:

1. It is not unlawful as it is personating, as is showed:

2. Nor as lying: Because it is not an asserting, but a representing; nor so taken.

3. To personate a bad man in a bad action, is more dubious; but seems not to be in all cases unlawful. To pass by David’s feigning himself mad (as of uncertain quality) it is common with preachers to speak oft the words of wicked men, as in their names or persons, to disgrace them: And Prov. 5:11-12, etc. comes near it. And whether Job be a history, or a dialogue personating such speakers, is doubted by the most learned expositors.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/richard-baxter.html">Richard Baxter</a></span><span class="wk"><span class="lbl">Work:</span> <cite>A Christian Directory, or a Sum of Practical Theology</cite>, … (London: White, 1673), pt. 3, ‘Christian Ecclesiastics’, Question 114, ‘Whether Stage-Plays where the Virtuous &amp; Vicious are Personated, be Lawful?’ [Yes], p. 877</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/worship/ceremonies-and-things-indifferent.html">Ceremonies and Things Indifferent</a></span></div>

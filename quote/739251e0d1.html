<main class="wrap"><figure class="quote" id="q-739251e0d1" data-kw="">
<blockquote><p>Question. But if we see a fashion used in other countries that we like, may we not take it up? Answer. No… Paul taxes it as a great disorder in the Corinthians that men wore long hair, and women went uncovered, 1 Cor. 11.13-14.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/samuel-clarke.html">Samuel Clarke</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Medulla Theologiæ, or, The Marrow of Divinity contained in Sundry Questions &amp; Cases of Conscience, both Speculative &amp; Practical</cite>, (London, 1659), p. 112</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/worship/head-coverings-in-worship.html">Head Coverings in Worship</a></span></div>

</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-66a913b15c" data-kw="">
<blockquote><p>In the field, or in the bed, clothed with gown or cloak, when we pray or preach, are mere accidents and circumstances of praying and preaching, and we grant them to be variable and indifferent; howbeit, they admit of regulation-moral, and so are not simply indifferent; for to pray in the fields and streets, to be seen of men, is vain glory. But I hope they are not indifferent in your [Forbes’] meaning, as are surplice, holy-days, etc. For you will not say the Church may make laws that no prayers be but in the fields, no preaching except the preacher be clothed with a cloak. … 3. Place or habit does not constitute praying and preaching in their specific nature; that were a wonder, for their objects do constitute their nature, and their objects are God and God’s Word;</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/samuel-rutherford.html">Samuel Rutherford</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Divine Right of Church Government</cite>, ... (1646), pp. 649-50</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/worship/head-coverings-in-worship.html">Head Coverings in Worship</a></span></div>

</figure><figure class="quote" id="q-c3d5b94713" data-kw="">
<blockquote><p>‘Doth not even nature itself teach you’. By nature is either meant, the law and light of nature, reason in man, common sense, or rather custom, which is second nature; and which, in this case, must be restrained to the Greeks and Jews; for though among the Grecians the men cut their hair, and did not suffer it to grow long, as also did the Jews, yet there were many nations who did not (Alex., ab. Alex. Genial. Dier., bk. 5, ch. 18. Servius in Virgil, Aeneid, bk. 10. prope finem), even at that time, observe such a rule or custom; but as the Jews and Greeks were the persons chiefly, if not solely, known to the Corinthians, the apostle signifies that the usages of these people might direct and inform them in this matter:</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/john-gill.html">John Gill</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Exposition of the Whole Bible, on 1 Cor. 11</cite>, v. 14</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/worship/head-coverings-in-worship.html">Head Coverings in Worship</a></span></div>

</figure><figure class="quote" id="q-a298a272c7" data-kw="">
<blockquote><p>He [an Independent, separatist schismatic] condemns Presbyterians, Independents, Anabaptists and all Dissenters that are here called Protestants. For they have all many of the foresaid uninstituted things: They put off the hat in Church at prayer.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/richard-baxter.html">Richard Baxter</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Schism Detected in both Extremes, or Two Sorts of Sinful Separation</cite>, … (London: 1684), pt. 2, p. 16</span></figcaption>

</figure><figure class="quote" id="q-0d68aa6d6c" data-kw="">
<blockquote><p>To those who, in a narrow spirit, insist on having divine prescription for the most insignificant details of religious life and public worship, this appeal to ‘nature itself,’ [v. 14] as a great guide in relation to the decencies of public worship, should read a wholesome lesson. Nature, though uniform in its essential features, varies in all that is subordinate in different regions and at different periods. In matters of feeling, taste, and decorum, as to the way in which the relation of the sexes should be expressed, eastern and western ideas notoriously and widely differ, and they should be allowed their natural and proper development.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/david-brown.html">David Brown</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Other citations (work not named)</cite>, 1 Cor. 11 in A Popular Commentary on the New Testament, ed. Philip Schaff, p. 203</span></figcaption>

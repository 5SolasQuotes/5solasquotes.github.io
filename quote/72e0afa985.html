<blockquote><p>…take notice of this distinction, as a foundation, viz. that there is in Scripture a twofold repentance or humiliation of the soul for sin: The one antecedent and going before pardon, and this the Scripture requires as a necessary condition, without which forgiveness of sin cannot be obtained: of this repentance the Scripture for the most part speaks, Eze. 18:18, 30; Mt. 3.2; Mk. 6.12; Lk. 13:3; Acts 3:19; and generally in most places of Scripture. In the second place there is an humiliation of heart and brokenness of soul for sin, arising from the apprehension of God’s love in pardoning, whereby we grieve that we should deal so unkindly with so good and gracious a God: this, though more rarely, yet is sometimes spoken of in Scripture, as first in this woman, who out of the apprehension of God’s love in pardoning so much to her did pour out her soul in all ways of thankfulness. After this manner also was David’s repentance, Ps. 51; for he was thus deeply affected after Nathan had told him his sin was taken away; although it does appear by the psalm also that he had not as yet that sense of pardon which did quiet his conscience. This kind of affection was also in Paul, 1 Tim. 1:12–16; 1 Cor. 15:8–9, in which places the apostle, remembering his former sins, confesses them, and acknowledges thereby his unworthiness of all that grace and favour he had received; so that the apostle does not there humble himself that he may obtain mercy, but because he had obtained mercy. The most eminent instance of this kind of sorrow and shame is Eze. 16:62–63, where God promises to establish his covenant with them, and then mark the event of this: ‘That thou mayest remember and be confounded, and never open thy mouth more because of thy shame, when I am pacified toward thee.’ So then both these kinds of humiliations are to be owned and practiced; and therefore it is a false and dangerous error to acknowledge no other kind of repentance than the latter [former]. The Papists will not acknowledge this latter humiliation at all, because they deny all faith and assurance that a believer may have of his sins in particular. And others say that there is only this latter; and therefore the forementioned author, in his treatise of Gospel Repentance, makes this only gospel-repentance. But as gospel-faith is not that reflex act of the soul in a man whereby it is persuaded that Christ is his, but a direct act of taking and receiving Christ to be ours, so a gospel-repentance is not that mainly whereby we are humbled because we receive God’s love to us in pardoning, but principally in that loathing of ourselves to obtain pardon. It is therefore great ignorance in that author, in his treatise of Gospel Repentance, when p. 58, he calls repentance that goes before this faith, viz. that my sins are pardoned, a dead work; as if the faith that justifies, and without which it is impossible to please God, were the believing that my sins are pardoned; whereas the Scripture makes it to be the receiving of Christ and laying hold on Him. And seeing that the object must in order of nature be before the act that is employed about it, it follows infallibly that I must have justification before I can believe I have it. Repentance therefore may be thought to go before a twofold act of faith: first, that whereby Christ is laid hold upon and made ours, and so the repentance that precedes this may be called legal and slavish. Or secondly, before a persuasion that my sins are pardoned; and before this act of faith repentance must necessarily go, because the covenant of grace dispenses pardon only to such.</p></blockquote>

</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-0b63c82837" data-kw="">
<blockquote><p>First, the word [justificare] does imply an accounting just: And this is acknowledged by the Papists themselves as more frequent though they plead much for such a sense as to make just. Now the truth is there needs not much quarrel even about that signification, though the Scripture does not manifest it: For we confess that he is made just, who is justified, and that not only in respect of the inward renovation of a man, but also in respect of justification; for God does not account him just who is not so, and certainly to esteem a man just without righteousness, is as absurd as to account a man learned without learning, or the wall white without whiteness; only we say this righteousness that does to make a man just, is not inherent in him, but reckoned to him by the satisfaction of another: for a man is accounted righteous two ways, either when he is not guilty of the crime charged upon him, or when he does make satisfaction; and in this latter sense by Christ we become righteous. 2. So that if the word should signify as much as to make righteous, as to sanctify does signify to make holy, still we could grant it, though not in the Popish way; and indeed the apostle, Rom. 5, says many are made righteous by the second Adam, which if not meant of inherent holiness, does imply that the righteousness we have by Christ is not merely declarative, but also constitutive; and indeed one is in order before the other, for a man must be righteous before he can be pronounced or declared so to be. But the Hebrew word does not signify this sense primarily; for whereas the Hebrew word in [the tense] qal does signify to be righteous by a positive quality; The word in hiphil, according to that rule in grammar, signifies to attribute and account this righteousness unto a man by some words, or other testimony, even as the word that in qal signifies to be wicked, does in hiphil signify to condemn and judge a man as wicked, so that there are these two things in justifying, whereof one is the ground of the other, first to make righteous, and then to pronounce or declare so. From these two follows a third, which is to deal with a man so justified as a just man, so that condemnation, crimes, reproach and fear shall be taken away from him. This declares the admirable benefit of being justified before God, for when this is done, Rom. 5:1, we have peace with God, Eph. 3, we come with boldness into his presence, and open face; so that unbelief and slavish fears in the godly are great enemies to this grace of justification; yea, they are a reproach and dishonor to it. Thou thinkest if thy heart were not conscious to sin, if nothing but holiness were in thee, thou wouldest be bold, thou wouldst not fear or be troubled, but thou dost not consider that God walks towards thee as a righteous man, looks upon thee as so, so that if Christ be bold thou mayst, if God will not reject Christ, or thy sins cannot condemn Him, so neither will God reject thee, or shall thy sins overwhelm thee; this is the sweet consolation of the Gospel, to a sinner broken-hearted, who would give a world for a perfect righteousness to make him accepted.</p></blockquote>

ct%20righteousness%20to%20make%20him%20accepted&amp;text=First%2C%20the%20word%20%5Bjustificare%5D%20does%20imply%20an%20accounting&amp;text=for%20a%20perfect%20righteousness%20to%20make%20him%20accepted" rel="noopener" target="_blank">Read it online · Reformed Books Online</a></div>
</figure><figure class="quote" id="q-e54df171fc" data-kw="">
<blockquote><p>Repentance goes before justification, even as faith and hope; for of the Baptist it is said, that he preached the baptism of repentance for the remission of sins, Mk. 1:4; Lk. 3:3. But regeneration follows justification; for, being justified, we receive the Spirit of sanctification, whereby we are renewed, and, as it were, find a new creature begun even in this life. Repentance is the cause, regeneration is the effect; for therefore God does renew us in Christ, and make us new men, because we repent us of our old life, and begin to be wise after sin committed. Notwithstanding in the middle place, betwixt repentance and regeneration, comes in justification, when as God does of his mere mercy account and repute us as just. The name of repentance implies sorrow, but the name of regeneration gladness. To conclude, the points of repentance, as whence it proceeds and whereunto it tends, they are deeds, the evil or sin committed, and the good which ought to be practised; but the bounds of regeneration are qualities — inherent corruption, and sanctity or holiness, which is wrought in us; the old man and new man renewed in Christ. …For every change of the mind is not to be deemed forthwith regeneration, but there are certain changes of man’s mind which go before regeneration, and which prepare the mind, and so the whole man, unto regeneration, and to that new creation; in which kind repentance is a special grace. These things are to be distinguished not in time but in nature; for at that very same instant, we believe, and be effectually called, and do repent, and be justified, and be regenerate.</p></blockquote>

<blockquote><p>Therefore secondly, we say that there are other graces coexistent with faith in the person justified. A solitary faith is not a saving and justifying faith: Faith, if it has not works, is dead, being alone. Faith that is alone saves not, though faith alone save. As the act of seeing is by the eye only, without the ear, or other senses; the eye only sees; the ear sees not, nor the taste, nor the smell, nor the feeling; yet the eye could not see if you should take away the other senses from the body. So it’s faith only that justifies without other graces or good works; yet faith without them, or separated from them, cannot justify: because indeed it cannot be without them in the person or subject where it is. So that faith is without other graces and works in its office, but not in its existence. And you may as soon part light and heat in the sun, as sanctification from justification in a believer. For faith is not only a fruit of the Spirit with other graces, but also the seed and nursery of other graces, because faith in Christ is the root-grace… It would be a strange soul that should give a faculty of seeing and no other faculty or sense: as strange a state of grace would that be that should give an act of saving and justifying faith and give no other grace besides.</p></blockquote>

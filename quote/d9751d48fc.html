<main class="wrap"><figure class="quote" id="q-d9751d48fc" data-kw="">
<blockquote><p>If matters in their expediency be questionable and probable on both sides, the Church’s determination should end the controversy (say the [Aberdeen] Doctors); this is the doctrine of the Jesuits, Suarez, Thomas, Sanchez and Gregory de Valentia [all Romanists]… when a thing is probable and I be resolved in conscience against neither of the sides, and fear the one side be… against God’s commandment, and know that human authority commands the contrary, and am persuaded it is indifferent, and a positive commandment of men, if the Church’s determination be here to sway my conscience, to practice is to me blind obedience, for human authority as it is such, gives no light.” Divine Right of Church Government (1646), Dispute Touching Scandal, Question 4, p. 43 When you seek reasons for what is going on and the only answers you get are of the kind, “The elders have determined…”, “This was the counsel of the presbytery,” “The principal clerk believes…” this is all directing you to trust persons without it being established in God-given reason. Take a cue from common life: persons that insist on you trusting them are the last persons you should trust. Trustworthy persons freely give their reasons precisely because they understand them as the grounds of the rightness of the action. Persons always (silently) trying to gain your confidence, are manipulators. . Unanimity The church leadership is geared towards being unanimous in their decisions and actions in order to give a united front (notice the disparity here with the people). They may do things unanimously or not at all. With time, of course, this puts pressure on all the elders to agree, even in situations that aren’t so cut and dry. And if they all do, you should too. “Look, all the elders are unanimous on this.” This is especially compelling under the (pressurized) lingo and mantra of Church unity, which really fits well with cultic characteristics. Cults thrive on the principle that the leadership’s will is God’s will, just like under the Papacy. In presbyterianism that may fly under the flag of a misinterpreting and mishandling of Mt. 18:18, “Whatsoever ye shall bind on earth shall be bound in heaven.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/cultic-characteristics.html">Cultic Characteristics</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Smaller, Celebrity or Personality Culture &amp; Implicit Faith</cite>, If you observe in the congregation not just a rational trust in your pastor and elders, but an implicit faith by many in much or most of what they say or do, especially when there is contrary evidence, you are not in a safe position. But elders should be honored and revered, and therefore if there is uncertainty, their determination settles the matter, right? Samuel Rutherford:</span></figcaption>

<blockquote><p>Q. What is the main scope of the First Commandment, ‘Thou shalt have no other Gods before Me?’ A. Here is required all that natural worship of God, whether the same be inward or outward, which is such as if there were no Law prescribed, yet if we well know his nature, we would undoubtedly perform it to Him. Q. Name some principal duties that are here required, with the contrary vices forbidden? A. Here is required faith in God, love to his Majesty, and hope in Him, hearing his voice, calling upon Him by prayer, and such like. … Q What is the main scope of the Second Commandment? A. The Second Commandement enjoyns all that worship of God which is by divine institution and ordinance, Mt. 28:20; Dt. 12:32. Q What are some of the particulars? A. The public and solemn preaching and hearing of his word, and prayer, celebration of sacraments, Church fellowship, election and ordaining of ministers and their whole ministration, with the due observation of Church discipline. … Q. What is the sum of the Third Commandement? A. The things here required are the due manner of observing and using all things that pertain to the natural or instituted worship of God, and all that name of God whereby He makes Himself known unto his people?</p></blockquote>

<blockquote><p>5. Divine worship is internal only or external also. Internal worship is merely spiritual, and performed only within the temple of man’s heart, of which none are witnesses but God and a man’s own conscience. All the inward motions of the heart directed unto God are parts of this worship, as faith, hope, confidence, love, fear and joy in God, etc. which are all of them diverse acts and parts of inward worship, in everyone of which God is honored. All which spring from the apprehension of our own wants, and God’s infinite excellency and goodness towards us… 6. External worship is an expressing and setting forth of the internal by outward signs and rites: by which as by certain outward bodily shadows and colors the spiritual and inward worship of God is made visible and sensible to others.</p></blockquote>

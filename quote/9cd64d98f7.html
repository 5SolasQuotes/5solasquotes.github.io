<main class="wrap"><figure class="quote" id="q-9cd64d98f7" data-kw="">
<blockquote><p>‘In the beginning God created.’ It is absolutely necessary that things begun in time be also brought to an end in time. If they have a beginning in time, have no doubt about the end. Really, to what end are geometry and arithmetical investigations, the diligent study of solids and the much-discussed astronomy all very laborious vanity directed, if those who pursue them have believed that this visible world is co-eternal with God, the Creator of all things; if they attribute to a circumscribed world which possesses a material body the same glory as to the limitless and invisible Nature; and if they are not able to understand even this much, that the whole of anything whatsoever, whose parts are subject to corruption and change, must also at some time submit to the same changes as its parts?

But, to such an extent ‘they have become vain in their reasonings, and their senseless minds have been darkened, and while professing to be wise, they have become fools’ that some have declared that heaven is co-existent with God from eternity; others, that it is God Himself without beginning and without end, and that it is responsible for the arrangement of every individual thing.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/st-basil.html">Basil of Caesarea</a></span><span class="wk"><span class="lbl">Work:</span> <cite>On the Hexaemeron</cite>, (379), 1.3 in Saint Basil’s Exegetic Homilies, trans. Agnes Clare Way in The Fathers of the Church: A New Translation, Volume 46 (Washington DC, 1963), pp 7-8.</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/creation/the-six-days.html">The Six Days</a></span></div>

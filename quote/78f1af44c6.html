<main class="wrap"><figure class="quote" id="q-78f1af44c6" data-kw="">
<blockquote><p>First: how God is not a cause when He permits. For if God were to give his efficacious grace to the will, it would not sin. I respond that this doubt is common to all and looks elsewhere. Briefly, however, I say that for us, who hold every sin to be an effect of reprobation [this is hard language which the Reformed often spoke against]… the response is at hand: namely, that God is not bound to exhibit efficacious grace, since through original sin its privation has been incurred [the Reformed agree with this]; and therefore the permission is just. [The Reformed generally disagree:] He does give sufficient grace, with which man can and without which he cannot avoid sin. And in that permission God foresees that the man will sin, as we have often taught with Scotus.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/francisco-macedo.html">Francisco Macedo</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Collations of the Teachings of St. Thomas &amp; Scotus, with the Differences between the Two: with the Texts of Both Faithfully Presented, and the Sentences Subtly Examined, with the Commentaries of the Interpreters</cite>, … vol. 2 tr. AI by Vertias (Padua: Frambotti, 1671), , bk. 2, Collation 9, pp. 361-429 | Concurrence with Evil Actions | Difference with the Reformed, p. 422</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/providence/concurrence.html">Concurrence</a></span></div>

e-secondary-causation-occasionalism/#:~:text=First%3A%20how%20God%20is%20not%20a,we%20have%20often%20taught%20with%20Scotus&amp;text=First%3A%20how%20God%20is%20not%20a%20cause%20when&amp;text=sin%2C%20as%20we%20have%20often%20taught%20with%20Scotus" rel="noopener" target="_blank">Read it online · Reformed Books Online</a></div>
</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-b7e4f428d6" data-kw="">
<blockquote><p>How may we attribute this same work to God, to Satan, and to man as author, without either excusing Satan as associated with God, or making God the author of evil? Easily, if we consider first the end, and then the manner, of acting. The Lord&#x27;s purpose is to exercise the patience of His servant by calamity; Satan endeavors to drive him to desperation; the Chaldeans strive to acquire gain from another&#x27;s property contrary to law and right. So great is the diversity of purpose that already strongly marks the deed. There is no less difference in the manner. The Lord permits Satan to afflict His servant; He hands the Chaldeans over to be impelled by Satan, having chosen them as His ministers for this task. Satan with his poison darts arouses the wicked minds of the Chaldeans to execute that evil deed. They dash madly into injustice, and they render all their members guilty and befoul them by the crime.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/john-calvin.html">John Calvin</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Institutes of the Christian Religion</cite>, 2.4.2</span></figcaption>

</figure><figure class="quote" id="q-8520e28d8b" data-kw="Author of sin Free Will">
<blockquote><p>As there is a vast difference between the sun being the cause of the lightsomeness and warmth of the atmosphere, and the brightness of gold and diamonds, by its presence and positive influence; and its being the occasion of darkness and frost, in the night, by its motion, whereby it descends below the horizon. The motion of the sun is the occasion of the latter kind of events; but it is not the proper cause, efficient, or producer of them; though they are necessarily consequent on that motion, under such circumstances: no more is any action of the Divine Being the cause of the evil of men&#x27;s Wills.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/jonathan-edwards.html">Jonathan Edwards</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Freedom of the Will</cite>, pt. 4, sec. 9</span></figcaption>

</figure><figure class="quote" id="q-7df9615162" data-kw="Permission Author of sin">
<blockquote><p>For two things are to be considered in evil actions: the action itself, and the ἀνομία [anomia, lawlessness] of the action. The action itself, as a natural motion, takes place by the efficacious working of God; but the anomia or wickedness takes place by the active permission of God. … for as in a horse the cause of the motion is one thing and the cause of the limping another, so it is one thing to be the cause of the action and another to be the cause of the wickedness cleaving to it.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/johannes-wolleb.html">Johannes Wollebius</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Compendium of Christian Theology</cite>, bk. 1, ch. 6 (providence), canon 11</span></figcaption>

</figure><figure class="quote" id="q-f124048d8b" data-kw="">
<blockquote><p>…the opposing position of the Thomists about the physically predetermining quality, as they call it… I agree with them in the matter and differ only in the mode; and because a quality of this kind understood in that way is not found in Saint Thomas; and because through the artifice of adversaries it was introduced into the Thomist school — with them caring less about it because they thought it made no difference to be determined in this or that mode, and afterward quarreling about the act of it, as Zumel admits, in whose writings I found it written; and because, the error being now recognized, that quality is commonly rejected and another kind of determination is received. Concerning which we perhaps agree with them… First I observe that this prior impressed physical quality is altogether rejected by Scotus, as we will show below… That predetermining quality physically is altogether required [according to Thomists] in the free cause in first act for operating, and without it the will cannot be determined to second act; and given it, the will consequently acts and operates with certainty and determination — for it is given for that purpose, so that it may operate. But from this it follows that those in whom it is not impressed cannot operate;</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/francisco-macedo.html">Francisco Macedo</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Collations of the Teachings of St. Thomas &amp; Scotus, with the Differences between the Two: with the Texts of Both Faithfully Presented, and the Sentences Subtly Examined, with the Commentaries of the Interpreters</cite>, … vol. 2 tr. AI by Vertias (Padua: Frambotti, 1671), , bk. 2, Collation 9, pp. 361-429 | Contra Physical Predetermination, p. 386</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/providence/concurrence.html">Concurrence</a></span></div>

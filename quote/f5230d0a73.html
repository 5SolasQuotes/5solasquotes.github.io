<main class="wrap"><figure class="quote" id="q-f5230d0a73" data-kw="">
<blockquote><p>XII. The Adjuncts of good works are, their imperfection and their necessity nevertheless. … XV. Good works are necessary by the necessity of precept and of the means, but not by the necessity of the cause or merit. By the necessity of precept they are necessary, because the study of good works through all the Scriptures is most severely enjoined to us: They are necessary in regard of the means, because they are sure marks of Vocation, Election, and true Faith; and because they are the way and means to attain heavenly bliss: As if a man should make a journey from York to London to obtain an inheritance, the way or journey is them medium or means, but not the meriting cause or the inheritance; even so it is in this matter.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/johannes-wolleb.html">Johannes Wolleb</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Abridgment of Christian Divinity</cite>, (d. 1629; London, 1660), Book 2, ‘Concerning the Worship of God’, Ch. 1, ‘Of the Nature of Good Works’, sections 12 &amp; 15, pp. 315-317</span></figcaption>

</figure><figure class="quote" id="q-757e8a0bda" data-kw="">
<blockquote><p>The righteousness required by the Moral Law is of two sorts: 1. Habitual [an abiding inward disposition], in the inherent holiness of man’s whole person, when such gracious qualities are fixed and planted in every faculty of soul and body: as do dispose and incline the motions of both only unto that which is conformable to the righteousness of the Law. That such righteousness is required by the Law is a plain case and confessed; That which commands the good or forbids the evil action does command the virtuous and forbid the vicious habit too. He that looks for purity in the stream cannot but dislike poison in the fountain: and God that commands us to do good, bids us also to be holy; nor can we do the one, unless we do the other. And therefore the apostle joins both together. The end of the commandment is love, (but where?) out of a pure heart, 1 Tim. 1:5. 2. Actual, in the exercise of all good works enjoined by the Law, and forbearing the contrary evil works. Whether these good or evil works be inward in that spiritual obedience which the Law required; (viz.) in the right ordering of all the motions of our souls, that every one of our thoughts, imaginations, purposes of our mind, and all the secret workings and stirrings of our affections, be altogether employed upon piety and charity, not so much as touching upon any thing that is contrary to the love of God or our neighbor. Or, whether these good and evil works be outward in the bodily obedience unto the Law, in doing all and every external duty of religion towards God: of justice and mercy towards man; and in leaving undone the contrary. Further this actual righteousnesse of the Law is to be considered two ways: 1. As it respects all the commandments, and so that righteousness is only perfect, which fulfils all and every particular precept of the Law. 2. As it respects any one commandment, or any one duty therein contained. And so we may call that righteousness perfect, which exactly performs any one point of the Law, though it fail in others.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/william-pemble.html">William Pemble</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Vindiciae fidei, or A Treatise of Justification by Faith</cite>, … 1st ed. (Oxford, 1625), section 3, ch. 1, pp. 66-67</span></figcaption>

</figure><figure class="quote" id="q-5d88dca792" data-kw="">
<blockquote><p>14. Christians having sorrow or serious regret for sin in them, and being in earnest conflict with the law in their members, with the lusts, and irregular passions, and inordinate affections of the flesh, their way of walking cannot (as to their ordinary and habitual course) be after the flesh; nor can they be the slaves of sin; but being made free from sin, and become servants to God ([Rom.] ch. 6:22), they walk after the Spirit, have their fruit unto holiness (which is the necessary and certain characteristic of the true Christian), and the end everlasting life; to which end and final issue holiness is indispensably necessary–though, however necessary, yet eternal life is not proper wages which men win by their holiness, but is the gift of God through Jesus Christ.</p></blockquote>

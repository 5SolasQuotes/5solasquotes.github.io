<main class="wrap"><figure class="quote" id="q-3ebf181a8e" data-kw="">
<blockquote><p>II… 2. God as the best being, by necessity of nature is zealous for his own glory, which is the end of all his actions…</p></blockquote>

</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-f89fa2cd79" data-kw="">
<blockquote><p>7. To the first argument [n.1] I say that although the saying of the apostle [1 Tim. 2:4] could be expounded with a distribution accommodated for all those who will be saved – yet it could much better be expounded of antecedent will, thus: ‘he wills to save all men and that all are saved’, namely as far as concerns his own part and by his antecedent will, forasmuch as he has given them natural gifts and right laws and common aids sufficient for salvation. 8. Just as of a king, establishing good laws and prefixing ministers to guard those laws, it could be said that he wills all his subjects to live peaceably and quietly, as far as in him, and yet, if he see someone being unjustly oppressed, it would not be necessary that the king at once involve himself, to make him live quietly, unless he were turned over to him by a complaint of fact (he does indeed antecedently will everyone to live peaceably and quietly, but he does not will everyone immediately so to live), – so I say in the matter at hand, that although God [does] not have a will of being well-pleased to save this person, yet he wills for him the common aids to salvation, by which he too can live sufficiently well and be saved; on account of which it can be said that, as far as is on his part, he wills all to be saved.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/john-duns-scotus.html">John Duns Scotus</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Ordinatio</cite>, bk. 1, dist. 26-48 tr. Peter Simpson (2013 / 2023), dist. 46, Whether God’s Will of Good-Pleasure is always fulfilled? II. To the Principal Arguments, p. 197</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/attributes-of-god/will-of-god.html">Will of God</a></span></div>

</figure><figure class="quote" id="q-a319b77b06" data-kw="">
<blockquote><p>3. Again, by an antecedent will God wills all men to be saved: if, therefore, He reprobates anyone, this is by a consequent will, for He creates no one of Himself for punishment; but the consequent will is a concession for our cause; but it is not for any other cause than merit: therefore, etc.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/bonaventure.html">Bonaventure</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Commentary on the Sentences</cite>, (d. 1274), bk. 1 | dist. 41, Treatment of the Questions</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/attributes-of-god/will-of-god.html">Will of God</a></span></div>

</figure><figure class="quote" id="q-ef4bec73dc" data-kw="will irresistible precept">
<blockquote><p>The decretive will relates to the futurition and the event of things and is the rule of God’s external acts; the preceptive is concerned with precepts and promises and is the rule of our action. The former cannot be resisted and is always fulfilled: “Who hath resisted his will?” (Rom. 9:19). The latter is often violated by men: “How often would I have gathered you together, and ye would not” (Mt. 23:37).</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/francis-turretin.html">Francis Turretin</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Institutes of Elenctic Theology</cite>, 3.15.2</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/attributes-of-god/will-of-god.html">Will of God</a> › <a href="../topics/attributes-of-god/will-of-god/decretive-and-preceptive-will.html">Decretive and preceptive will</a></span><span class="t"><a href="../topics/attributes-of-god/will-of-god.html">Will of God</a> › <a href="../topics/attributes-of-god/will-of-god/secret-and-revealed-will.html">Secret and revealed will</a></span></div>

</figure><figure class="quote" id="q-0ffc758c98" data-kw="">
<blockquote><p>34. The Will of God is the other faculty of the life of God, or the act that follows, by which God knows Himself and wills and approves of all good things as they agree unto the nature and order of his mind, the contraries He necessarily disapproves, which will is called approving; and out of which things He is able to do, some He freely wills, chooses and decrees by a foregoing wisdom, and does, which is the effecting will;…</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/antonius-thysius.html">Antonius Thysius</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Thesis 34 in The Sixth of the Theological Disputations in On the Nature of God &amp; the Divine Attributes</cite>, (d. 1640; Leiden, 1620) This disputation is also in the Synopsis of Pure Theology as disputation 6.</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/attributes-of-god/will-of-god.html">Will of God</a></span></div>

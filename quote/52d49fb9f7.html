<main class="wrap"><figure class="quote" id="q-52d49fb9f7" data-kw="">
<blockquote><p>Lastly he [Paul] exhorteth those that are reconciled, and thus endowed with his spirit, to bring forth works, worthy of those that repent to the end, that the glory of their king may shine in them. Rom. 8. ver. 29, 30. These degrees, in the administration of the kingdom of Christ, and of his new covenant, the Lord comprehendeth in that same speech to Paul, when he saith, that thou mayst open their eyes: that is done, when through the working of that king Christ, their conscience is illuminated through the holy Ghost. (For it is he that maketh his ministry effectual) so as they know both themselves and their sins, and again God, his holiness and righteousness, to which they must be conformable, that through faith turning unto him, they may receive in Christ a double benefit, forgiveness of their sins, &amp; a lot amongst the sanctified, who daily study (Christ exhorting them) to bring forth the worthy fruits of repentance. For whom he hath chosen, those also hath he called: whom he hath justified, those also he hath glorified.

First therefore let us see how Christ our king by calling into his kingdom, doth engender in men a desire of being reconciled to God; then how he offereth unto them the forgiveness of their sins, or rather the free grace of reconciliation and justification, and therewithal how he beginneth, their restoring to everlasting life and glory: how daily he setteth it forward, and at length in the world to come doth fully finish the same.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/caspar-olevianus.html">Caspar Olevianus</a></span><span class="wk"><span class="lbl">Work:</span> <cite>An Exposition of the Symbol of the Apostles</cite>, trans. John Field (London: Thomas Man, 1581), pp 47-48.</span></figcaption>

</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-991e1ee8e5" data-kw="">
<blockquote><p>And not to urge thee [Calvin] more on these matters, this finally I would wish thee to consider with thyself in the spirit of peace: If when anyone is justified, he is always, even according to thine opinion, sanctified also, what sin is there in establishing some word whereby we may explain both, and generally all the benefits which in that moment are conferred on the sinner by God? If we wish to teach anyone what he receives from God when his sins are forgiven, or when he is admitted to divine grace, wilt thou not suffer us to say, nor to teach him, the benefits which he acquires in his justification? What term shall we use to embrace all these things in one word more conveniently than this one, which is so common in Scripture, and draws its etymology from those words by which absolution from sins and reconciliation with God, and his friendship and adoption, and the performing of works of justice, is designated?</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/andreas-de-vega.html">Andreas de Vega</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Other citations (work not named)</cite>, bk. 15, On Justification, ch. 5, toward the end, p. 683 in William Forbes, Considerationes Modestae et Pacificae Controversiarum de Justificatione... 4th ed. (d. 1634; 1658; Oxford: Parker, 1850), bk. 2, ch. 4, pp. 149-51 Vega (d. 1560) was a Spanish Franciscan theologian, and is addressing Calvin.</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/justification/twofold-justification.html">Twofold Justification and Its Increase</a></span></div>

</figure><figure class="quote" id="q-677425ee04" data-kw="">
<blockquote><p>Externally this covenant is made with every member of the Church, even with the parents and their children, so many as hear and embrace the promises of salvation, and give and dedicate their children unto God according to his direction; for the sacraments—what are they but seals of the covenant? But savingly, effectually, and in a special manner it is made only with them who are partakers of the benefits promised. And as the covenant is made outwardly or effectually, so some are the people of God externally, others internally and in truth. For they are the people of God with whom God has contracted a covenant, and who in like manner have sworn to the words of the covenant, God stipulating and the people receiving the condition; which is done two ways: [1] for either the covenant is made extrinsically, God by some sensible token gathering the people, and the people embracing the condition in the same manner, and so an external consociation of God and the people is made; [2] or the covenant is entered after an invisible manner, by the intervention of the Spirit, and that with so great efficacy that the condition of the covenant is received after an invisible manner, and so an internal consociation of God and the people is made up.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/john-ball.html">John Ball</a></span><span class="wk"><span class="lbl">Work:</span> <cite>A Treatise of the Covenant of Grace</cite>, … (London: 1645), ch. 3, ‘Of the Covenant of Grace in General’, p. 24</span></figcaption>

<blockquote><p>I remember that Staupitz used to say: “More than a thousand times I have vowed to God that I would improve, but I have never performed what I have vowed. Hereafter I shall not make such vows, because I know perfectly well that I shall not live up to them. Unless God is gracious and merciful to me for the sake of Christ and grants me a blessed final hour when the time comes for me to depart this miserable life, I shall not be able to stand before Him with all my vows and good works.” This despair is not only truthful but is godly and holy. Whoever wants to be saved must make this confession with his mouth and with his heart. The saints do not rely on their own righteousness; they sing with David (Ps. 143:2): “Enter not into judgment with Thy servant, for no man living is justified before Thee”; and (Ps. 130:3): “If Thou, O Lord, shouldst mark iniquities, Lord, who could stand?” Therefore they gaze at Christ, their Propitiator, who gave His life for their sins. And if there is any remnant of sin their flesh, they know that this is not imputed to them but is pardoned by forgiveness. Meanwhile they battle by the Spirit against the flesh. This does not mean that they do not feel its desires at all; it means that they do not gratify them. Even though they feel their flesh raging and rebelling against the Spirit and feel themselves falling into sins and living in them, they do not become downcast on that account or immediately suppose that their way of life, their social station, and the works they have done in accordance with their calling are displeasing to God. No, they fortify themselves with their faith.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/martin-luther.html">Martin Luther</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Luther’s Works</cite>, Vol. 27: Lectures on Galatians, 1535, Chapters 5-6; 1519, Chapters 1-6, ed. Jaroslav Jan Pelikan, Hilton C. Oswald, and Helmut T. Lehmann, vol. 27 (Saint Louis: Concordia Publishing House, 1999), 73–74.</span></figcaption>

<blockquote><p>Whereof to make some good use to our selves, we may note and mark first, the truth of God’s promise made to Abraham in the 15. of Gen. when he bad him look up to the stars of heaven, and number them, if he could, assuring him then, that even so would he make his posterity and offspring a mighty people, and a great kindred, which we all see here was fulfilled. So assuredly true are all other of Gods promises, and therefore think of what you will, your faith and comfort shall not fail you. That sweet promise, that, at what time soever a sinner repenteth truly of his sins, God in mercy will forgive him, it shall never fail. He may as soon cease to be God, as cease to be true in any thing which he hath spoken.

And for this particular he hath not only spoken it, but sworn it, that, as he liveth he will not the death of any true penitent and sorrowful sinner. We may not therefore do him wrong, and doubt of it. It is no pride to take fast hold of this word, but it is duty due from us to confess his truth, and to be thankful. An other promise he hath made to us, that, if we seek the kingdom and the righteousness thereof, these worldly wants of ours shall ever be supplied, as shall be fit and good for us. This also will he as assuredly keep, as he is God, to the great quietness of our hearts, if we will believe him.

In a word, that promise of all promises, that, if we believe in his Son, we shall never perish, but have eternal life, he will perform. So, both for this life, and that to come, we have his word: and, no more than he failed Abraham in multiplying his seed, will he fail us in any promise. Only his time we must tarry, and hasty minds learn humble patience. He knoweth when is best both for him, and us. Tarry he may, but come he will. Never untruth passed from him, never any that believed in him was disappointed of his hope.</p></blockquote>

</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-b5e0986283" data-kw="">
<blockquote><p>A man preaches that sermon only well unto others which preaches itself in his own soul. And he that does not feed on and thrive in the digestion of the food which he provides for others will scarce make it savoury unto them; yea, he knows not but the food he has provided may be poison, unless he have really tasted of it Himself. If the Word do not dwell with power in us, it will not pass with power from us.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/john-owen.html">John Owen</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Works, vol. 16</cite>, p. 76</span></figcaption>

</figure><figure class="quote" id="q-9462578d12" data-kw="">
<blockquote><p>If Paul in preaching had either substituted human wisdom for the doctrine of the cross, or had so presented that doctrine as to turn it into a philosophy, his preaching would have been powerless. It would lose its divine element and become nothing more than human wisdom. Whatever obscures the cross deprives the gospel of its power.</p></blockquote>

</figure><figure class="quote" id="q-4bef7517da" data-kw="">
<blockquote><p>He commanded the lepers cleansed to go to the priests, and offer their due, and his disciples to hear the scribes and pharisees in moses’s chair, etc. And yet: 1. The high priests were not of Aaron‘s line according to institution. 2. They bought the office of heathen Romans. 3. They had it not for life, according to institution. 4. Doctrine, worship, discipline and manners were heinously corrupted, so that the hearers were to beware of the leaven of their doctrine and not to imitate their lives. 4. They were bitter enemies of Christ and persecutors: yet Christ never bid his disciples to separate from anything but their errors; but says, ‘They shall cast you out of the synagogues.’ And doubtless Christ committed no sin; nor can we be so holy as He.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/richard-baxter.html">Richard Baxter</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Schism Detected in both Extremes… (London: 1684), pt. 2</cite>, pp. 14-15</span></figcaption>

</figure><figure class="quote" id="q-65274d9d9b" data-kw="">
<blockquote><p>19. To prohibit the reading of Scripture is impious, to concede it by peculiar dispensation is ridiculous, for he who has the Lord’s command has no need of the dispensation of servants. 20. To accuse Scripture of obscurity and ambiguity, and imperfection, and other defects of this kind, is to confess that one’s religion is handed down in it only obscurely and imperfectly, and neither can be drawn entire from it nor resolved entire into it.</p></blockquote>

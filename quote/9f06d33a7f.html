<main class="wrap"><figure class="quote" id="q-9f06d33a7f" data-kw="">
<blockquote><p>How long is it since God did create the world? Four thousand years before the birth of our Saviour Christ, and so about 5614 years before this time. Why is the order of the years of the world so carefully set down in the Scripture?

1. To convince all heathen that either thought that the world was without beginning, or that it began millions of years before it did.

2. To give light to all sacred histories of the Bible… … How long was God creating the world? Six days and six nights. Why was He creating so long, seeing He could have perfected all the creatures at once and in a moment? First, to show the variety, distinction and excellency of his several creatures. Secondly, to teach us the better to understand their workmanship, even as a man which will teach a child in the frame of a letter will first teach him one line of the letter, and not the whole letter together. Thirdly, to admonish us that we are bound to bestow more time in discerning and knowing them than we do. Fourthly, that we might also by his example finish our work in six days. Fifthly, that we might observe, that many of the creatures were made before those which are ordinarily their causes, and thereby learn, that the Lord is not bound to any creature, or to any means: thus the sun was not created before the fourth day, and yet days which now are caused by the rising of the sun were before that; so trees and plants were created the third day, but the sun, moon and stars, by which they are now nourished and made to grow, were not created till after the third day.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/james-ussher.html">James Ussher</a></span><span class="wk"><span class="lbl">Work:</span> <cite>A Body of Divinity</cite>, ... (1645), A Large Explication of the Body of Christian Religion, pp. 96-97</span></figcaption>

</figure><figure class="quote" id="q-f9add80416" data-kw="">
<blockquote><p>God could have created them all at once, but He made them in the space of six days,¹ that He might show… ¹ That opinion of Augustine, that God made all things in a moment and distributed them into days because of our better understanding, is exploded by all. Although Creation was done in a moment, in respect of the particular bodies severally considered, yet in respect of all, it was not perfected in an instant, but in the space of six days; which spaces of days, note not a temporal succession of the same, but the order of diverse works. Some allege [against this the singular word ‘day’ in] Gen. 2:4, but it is not unusual in the Scripture to comprehend many days under the name of one. See Aquinas, [Summa] pt. 1, quest. 74, art. 2.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/edward-leigh.html">Edward Leigh</a></span><span class="wk"><span class="lbl">Work:</span> <cite>A System or Body of Divinity</cite>, (London: 1654), bk. 3, ch. 2, p. 229</span></figcaption>

</figure><figure class="quote" id="q-bb7c6bef38" data-kw="">
<blockquote><p>1. Man is to be considered as a creature [and] 2. as such a creature, to wit, endued with reason and the Image of God; in either considerations, especially in the former, all that are created are obliged to do and suffer the will of God though they never sinned. It’s not enough to say that sun, moon, trees, herbs, vines, earth, beasts, birds and fishes cannot suffer the ill of punishment which is relative to the break of a Law, for the whole creation is subject to vanity for our sins, Rom. 8:20-21. The servant is smitten and sickened for the master’s sake, and God may take from them what He gave them, [even] their lives without sense of pain and dolor, for all beings, yea [even] defects and privations, are debtors to the glory-declarative of God, Prov. 16:4; Rom. 11:36; yea, and no-beings [things that could be, but are not,] are under this debt.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/samuel-rutherford.html">Samuel Rutherford</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Covenant of Life Opened or A Treatise of the Covenant of Grace</cite>, … (1655), p. 17</span></figcaption>

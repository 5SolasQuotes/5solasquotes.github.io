<main class="wrap"><figure class="quote" id="q-1aa5655632" data-kw="">
<blockquote><p>He tarries the sinner’s leisure till the day of patience be quite spent ere [before] He executes this threatening of the new covenant; and offers men all this while many helps and advantages, enticing them by his mercies, awing them by his judgments, persuading them by his Word, drawing them by his Spirit, knocking at the door of their hearts by the serious impressions of his grace, and awakening them by the stings and checks of their own consciences; all which are so many signs and evidences that He takes no pleasure in the death of sinners, as the prejudiced world thinks, but does all that becomes Him to do, as a prudent and gracious lawgiver (though not all that He could do as an almighty God) and sovereign disposer of his grace;</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/thomas-manton.html">Thomas Manton</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Works</cite>, vol. 21, Two sermons on Eze. 18:23, Sermon 1, pp. 463-79</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/effectual-calling/means-of-calling.html">Means of Calling</a></span></div>

</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-300c8b4d54" data-kw="">
<blockquote><p>Behold, I have used all means for thy conversion: I have patiently expected it, and earnestly importuned it, and still I continue so doing; and if any man hear the voice of my Word, and open the door of his heart to Me, yielding to those my vehement solicitations, I will impart Myself to the soul of that man, and will have mutual fellowship with him, and he with Me.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/joseph-hall.html">Joseph Hall</a></span><span class="wk"><span class="lbl">Work:</span> <cite>A Plain &amp; Familiar Explication: by way of Paraphrase, of All the Hard Texts of the Whole Divine Scriptures</cite>, … (d. 1656; Oxford: Talboys, 1838), vol. 2, on Rev. 3:20, p. 553</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/effectual-calling/means-of-calling.html">Means of Calling</a></span></div>

</figure><figure class="quote" id="q-74624ffb35" data-kw="">
<blockquote><p>Why, this is it that Christ offers, no less than Himself, to be thine forever. This is it which He offers when He stands and knocks at thy heart: ‘Open to me; I will be thy God, the Lord thy Redeemer. Though thou hast rebelled against Me, and followed after strange gods, yet now renounce those idols; Open to me, I will be thy God, and that by covenant more durable than heaven and earth.’ ‘Open to me, thy Redeemer will be thy husband. Though thou hast played the harlot with many lovers… I will marry thee to Myself in an everlasting covenant that shall never be broken; I will rejoice over thee as a bridegroom over his bride.’ ‘Open to me, I will make over no less than Myself unto thee. Thou shalt have that which it is the glory and happiness of Heaven to have, myself, communion with Me; I will come and sup with thee, and thou with Me. Art thou poor? Open to Me;’ The commander of Heaven and earth will be thine to enrich thee… Thus Christ offers Himself; and oh how wonderful is it, that He should come to vile worms, and knock, and wait, and entreat that Himself may be accepted!</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/david-clarkson.html">David Clarkson</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Christ’s Gracious Invitation to Sinners on Rev. 3:20 in Practical Works</cite>, (d. 1686; Edinburgh: J. Nichol, 1865), vol. 2, pp. 34-100, p. 42</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/effectual-calling/means-of-calling.html">Means of Calling</a></span></div>
<div class="actions"><button class="copy" data-copy="“Why, this is it that Christ offers, no less than Himself, to be thine forever. This is it which He offers when He stands and knocks at thy heart: ‘Open to me; I will be thy God, the Lord thy Redeemer. Though thou hast rebelled against Me, and followed after strange gods, yet now renounce those idols; Open to me, I will be thy God, and that by covenant more durable than heaven and earth.’ ‘Open to me, thy Redeemer will be thy husband. Though thou hast played the harlot with many lovers… I will marry thee to Myself in an everlasting covenant that shall never be broken; I will rejoice over thee as a bridegroom over his bride.’ ‘Open to me, I will make over no less than Myself unto thee. Thou shalt have that which it is the glory and happiness of Heaven to have, myself, communion with Me; I will come and sup with thee, and thou with Me. Art thou poor? Open to Me;’ The commander of Heaven and earth will be thine to enrich thee… Thus Christ offers Himself; and oh how wonderful is it, that He should come to vile worms, and knock, and wait, and entreat that Himself may be accepted!”

</figure><figure class="quote" id="q-8255fdcb02" data-kw="">
<blockquote><p>But perchance thou wilt ask: If the opening of the eyes be from God alone, to what purpose shall advice be given to thee, in a matter that lies not in thee, and which is not effected by advice, but by supernatural operation? To this I answer that although the power that must enlighten thee does descend from above, yet usually it does communicate itself unto us by the service of certain means, left with us here below. Again, when grace does first breath upon us, it works by degrees, which degrees being by some neglected, or misconstrued, it has bred unto them a greater difficulty and hardness of travail in the new birth; but being perceived and duly entertained, they turn into testimonials unto us, yea to encouragements unto farther degrees of grace.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/francis-rouse.html">Francis Rous</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Art of Happiness</cite>, ... (London: Stansby, 1619), pt. 3 Rous was a Westminster divine. | 2. ‘How a man may get this faculty which unites man to God’, pp. 228-30</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/effectual-calling/means-of-calling.html">Means of Calling</a></span></div>

</figure><figure class="quote" id="q-cfed485a96" data-kw="">
<blockquote><p>Christ is said To knock at the door (the outward call here spoken of) and if any admit Him, He will come in and sup with him, Rev. 3:20. So then you see, to be called to the graces and duties of the Gospel, is matter of great joy and comfort;… Oh then how great is the madness and folly of all recusants to this gracious offer!</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/anthony-burgess.html">Anthony Burgess</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Spiritual Refining: or A Treatise of Grace and Assurance</cite>, (1652; Ames, Iowa, 1990), Section 12, Sermon 108</span></figcaption>

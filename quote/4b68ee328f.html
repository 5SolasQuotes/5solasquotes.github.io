<main class="wrap"><figure class="quote" id="q-4b68ee328f" data-kw="">
<blockquote><p>The authority of Christ, as the source of Church power, limits it so as to exclude the right of appointing ecclesiastical holidays. It is never to be forgotten, that all worship on the part of man addressed to God is an act done unto God. It is an acknowledgment of His authority as having opened up the way and appointed the manner for sinners to approach Him, and a religious expression of their homage to that authority.

This is more especially apparent in regard to the positive institutions or parts of worship. Such institutions are used by us in worship, simply because God has appointed them; and in the use of these, and not of others, we do homage to God, as having the authority both to require the worship at our hands, and to regulate the forms and institutions of it. All this is abundantly obvious in the case of the Sabbath itself. In keeping the last day of the week as a day of religious observance, the Jews, by the very act, expressed their religious acknowledgment of God, who had appointed it, and did an act of worship to Him as its author, in the character of the one Creator who made the heavens and the earth.

In keeping the first day of the week now, Christians, by the very act, recognise Christ as the author of it, and do an act of religious homage to Him as the one Redeemer, who on that day rose from the dead, and secured the salvation of His people. By keeping the last day of the week holy, the Jews, by the very act, adored one God, the Creator of all. In keeping the first day of the week holy, Christians, by the very act, adore one Saviour, the Redeemer of all.

Though there were no other service rendered on the Sabbath, and though our lips were silent and our tongues expressed no articulate praise, the single act of keeping the first day of the week holy would be an act of religious homage to the authority, and of solemn adoration to the person of Christ. The observance of that day above the rest, as part of the ordinary worship of the Church, is an act of adoration to Christ, as much as a hymn in His praise would be an expression of adoration to Christ.

And who does not see, that upon the very same principle the observance of holidays appointed by the Church, as ordinary and stated parts of Divine worship, is an expression of religious homage to man, who is the author of the appointment,—an unlawful acknowledgment of human or ecclesiastical authority in an act of worship. In keeping, after a religious sort, a day that has no authority but man’s, we are paying a religious homage to that authority; we are bowing down, in the very act of our observance of the day as part of worship, not to Christ, who has not appointed it, but to the Church, which has. We are keeping the season holy, not to God, but to man.

Such uncommanded seasons, observed in religious worship as a part of it, cannot but be an unlawful encroachment upon the authority of Christ. They are instituted, not in His name, but in man’s. They are kept, not in His name, but in the Church’s name. They are holy, and honoured as holy, not because of His authority, but because of ecclesiastical authority. They are an expression of religious homage addressed, not to the Divine Master, but to His human servant.

If they are acts of worship at all, they are the worship, not of Christ the Saviour, but of the Church’s ordinance and authority. In this point of view, the observance, after a religious manner, of human or ecclesiastical days is a daring interference with the sole authority of Him who is the Divine Head of the Church, to be adored in it, and the Divine Head of ordinances, to be adored through them. The authority of Christ as the Divine source of Church power, forbids the exercise of it in such a manner as to dishonour Himself; it forbids the appointment by it of holidays in worship, other than He has appointed.</p></blockquote>

<blockquote><p>The third matter to be noted in this [fourth] commandment is the added incentives. These are three in number.

(1) There is the example of God. God has created man after His image. This holy disposition of soul must also be manifested by man‘s deeds, and when he is thus active, he must be engaged in harmony with both God‘s commandment as well as His example. “Be ye therefore followers of God, as dear children” (Eph 5:1). God, after being engaged in the work of creation for six days, rested upon the seventh day, and by so doing has designated this as an example to be followed. Man must be motivated by this to do likewise.

(2) The second incentive is taken from that which is to our benefit. “Therefore the Lord blessed the sabbath day.” This does not imply that inherent efficacy was bestowed upon this day in order to render it profitable to man. Rather, it is a promise of blessing made to the conscientious observers of that day; that is, the receipt of comfort, joy, and holiness for the soul, and to render the physical labour of the six workdays to be more prosperous and profitable. For everything is dependent upon the blessing of the Lord, and without this all our labour is in vain (Ps 127:1-2).

(3) The third incentive is derived from God’s command and the appropriateness of obedience to it. He hallowed it. The Lord has set this day apart for sacred usage in order that man may solemnly and uniformly glorify and serve Him with a holy rest. No one may therefore make this day a common day by using it as other days and spending it by working. Rather, according to God’s command, we must acknowledge it as having been set apart and spend it in a fashion which is consistent with the purpose for which God has set it apart and designated it.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/wilhelmus-a-brakel.html">Wilhelmus à Brakel</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Christian’s Reasonable Service</cite>, trans. Bartel Elshout, ed. Joel R. Beeke (1700; Grand Rapids MI: Reformation Heritage Books, 1992), 3: 142-43.</span></figcaption>

<blockquote><p>The apostle names three sorts of them [i.e. ‘divine canticles’], psalms, hymns, or praises, and odes, or songs… You have various examples of them all in the book of Psalms… It is with these sacred lyres, of which the word of Christ affords us both the matter and the form, that the apostle would have us solace ourselves. St. James gives us orders for it: ‘Is any among you merry? let him sings psalms,’ James 5:13. The apostle calls all these sonnets spiritual, both on account of their author, who is the Holy Spirit, and also of their matter, which concerns only divine and heavenly things, the glory of God, and our salvation…</p></blockquote>

<blockquote><p>3. No man can enjoin anything upon the consciences of men (as absolutely necessary to enjoying the sacraments of divine grace and the benefits of the ministry of the Church) which God has not enjoined, without damnable will-worship. But God has not enjoined such a covenant on the consciences of men as absolutely necessary…</p></blockquote>

<blockquote><p>…for God has commanded his ministers to bless his people (Num. 6:22-27), which by just analogy belongs to the ministers of the gospel; neither is there any ground for making herein a difference between them and the minister of the Law, but we must conceive the commandment to tie both alike to the blessing of God’s people… And if we farther consider, that the duty of blessing was performed by the minister of the Lord (Heb. 7:6), even before the Law of Moses, we are yet more confirmed to think, that the blessing of the people was not commanded in the Law as a thing peculiar and proper to the Levitical priesthood, but as a moral and perpetual duty belonging to the Lord’s ministers forever.</p></blockquote>

<main class="wrap"><figure class="quote" id="q-b95374da72" data-kw="">
<blockquote><p>Last of all, which you make the greatest matter, the perpetual virginity of the mother of Christ after his birth, although for my part I do believe it, and wish all men so to do, yet dare I affirm that it is not damnable not to believe it except it can be proved that the Scripture has taught it. But you object against me first the condemnation of Helvidius testified by Sozomenus. Whereto I answer that he was justly condemned, not because he believed not, but because he did obstinately deny it, and troubled the peace of the church about an unnecessary question.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/william-fulke.html">William Fulke</a></span><span class="wk"><span class="lbl">Work:</span> <cite>A Defense of the Sincere &amp; True Translations of the Holy Scriptures into the English Tongue</cite>, ... (London, 1583), A Brief Confutation of Sundry Cavils…, p. 53</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/rome/mary-and-the-saints.html">Rome: Mary and the Saints</a></span></div>

</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-0c5e6b9875" data-kw="">
<blockquote><p>We need believe nothing that is outside the Word of God. It is not necessary to believe that Mary remained a virgin, since the Scriptures do not assert it diserte [explicitly]. Augustine advises us not to believe either affirmation or denial in such cases.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/peter-martyr-vermigli.html">Peter Martyr Vermigli</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Reformed Dogmatics</cite>, As quoted in Heinrich Heppe, ed. Ernst Bizer (1950; Wipf &amp; Stock, 2007), ch. 17, section 10, p. 422 No source in Vermigli is given.</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/rome/mary-and-the-saints.html">Rome: Mary and the Saints</a></span></div>
<div class="actions"><button class="copy" data-copy="“We need believe nothing that is outside the Word of God. It is not necessary to believe that Mary remained a virgin, since the Scriptures do not assert it diserte [explicitly]. Augustine advises us not to believe either affirmation or denial in such cases.”

</figure><figure class="quote" id="q-f0b36fd5f9" data-kw="">
<blockquote><p>XX. The subject ‘to which’ it [original sin] happens are all men who are brought forth into the light by the common law of birth. And therefore, Christ alone was immune from this sin; and the Virgin Mary was subject to this evil, because she was propagated from Adam naturally. Then, since Holy Scripture convicts all of sin (1 Kn. 8:46; Eccl. 7:21; Rom. 11:32; Gal. 3:22, etc.), who can press forward and give exceptions to the general propositions of the Word of God, besides the Word itself? But it excepts only Jesus.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/theodore-tronchin.html">Theodore Tronchin</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Theological Theses on Original Sin</cite>, trans. AI (Geneva: de la Planche, 1625), p. 6 Tronchin (1582-1657) was a professor of Hebrew and theology at Geneva.</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/rome/mary-and-the-saints.html">Rome: Mary and the Saints</a></span></div>

</figure><figure class="quote" id="q-59d8e8b056" data-kw="">
<blockquote><p>For a memorial of this history, which had happened in the desert, that brazen serpent was preserved among the children of Israel for more than 700 years; and until the misuse of worship and adoration arose, they did not judge that they were sinning against the Law (Ex. 20:4) by preserving this image. However, when they began to burn incense to this image, Hezekiah judged that this militated against that law of God, and therefore he broke that serpent in pieces (2 Kings 18:4).</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/martin-chemnitz.html">Martin Chemnitz</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Examination of the Council of Trent</cite>, Part IV, Second Topic (Images), Sec. III</span></figcaption>

<blockquote><p>she would not have needed the redemption and salvation which is through Christ, which is unfitting, that Christ is not the Savior of all men.</p></blockquote>

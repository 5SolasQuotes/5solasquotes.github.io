<blockquote><p>In the text [of Rom. 3:23-26] we have the eight following things: 1. The persons justified – (i) Sinners; (ii) Such sinners of all sorts that shall believe, whether Jews or Gentiles. 2. The justifier, or efficient cause – God. 3. The impulsive cause – grace. 4. The means effecting, or material cause – the redemption of Christ. 5. The formal cause – the remission of sins. 6. The instrumental cause – faith. 7. The time of declaring – the present time. 8. The end – that God may appear just.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/walter-marshall.html">Walter Marshall</a></span><span class="wk"><span class="lbl">Work:</span> <cite>‘The Doctrine of Justification Open &amp; Applied’, on Rom. 3:23-26 appended to The Gospel Mystery of Sanctification… (London: Parkhurst, 1692) 31 pp.</cite></span></figcaption>

</figure><figure class="quote" id="q-3e250a42f4" data-kw="">
<blockquote><p>3. Likewise, it is quite clear that adults do not obtain these blessings of Christ, except by the prevenient movement of the Holy Spirit, by which their mind and will are moved to hate sin. For, as St. Augustine says, it is impossible to begin a new life if we do not repent of the former one. Likewise, in the last chapter of Luke [24:47], Christ commands that repentance and forgiveness of sin should be preached in his name. Also, John the Baptist, sent to prepare the way of the Lord, preached repentance, saying [Matt. 3:2]: ‘Repent [Poenitentiam agite], for the kingdom of heaven is drawing near.’ Next, man’s mind is moved toward God by the Holy Spirit through Christ and this movement is through faith. Through this man’s mind believes with certainty all that God has transmitted [tradita], and also with full certainty and without doubt assents to the promises made to us by God who, as stated in the psalm [144:13], is faithful in all his words. From there he acquires confidence [fiduciam] on account of God’s promise, by which he has pledged that he will remit sins freely and that he will adopt as children those who believe in Christ, those I say who repent of their former life. By this faith, he is lifted up to God by the Holy Spirit and so he receives the Holy Spirit, remission of sins, imputation of righteousness and countless other gifts. 4. So it is a reliable and sound doctrine that the sinner is justified by living and efficacious faith, for through it we are pleasing and acceptable to God on account of Christ. And living faith is what we call the movement of the Holy Spirit, by which those who truly repent of their old life are lifted up to God and truly appropriate the mercy promised in Christ, so that they now truly recognize that they have received the remission of sins and reconciliation on account of the merits of Christ, through the free [gratuita] goodness of God, and cry out to God: Abba Father’. But this happens to no one unless also at the same time love is infused [infundatur] which heals the will so that the healed will may begin to fulfil the law, just as Saint Augustine said [Of the Spirit &amp; Letter, ch. 9,15]. So living faith is that which both appropriates mercy in Christ, believing that the righteousness which is in Christ is freely imputed to it, and at the same time receives the promise of the Holy Spirit and love. Therefore the faith that truly justifies is that faith which is effectual through love [Gal. 5:6]. Nevertheless it remains true that it is by this faith that we are justified (i.e. accepted and reconciled to God) inasmuch as it appropriates the mercy and righteousness which is imputed to us on account of Christ and his merit, not on account of the worthiness or perfection of the righteousness imparted [communicatae] to us in Christ. 5. Although the one who is justified receives righteousness and through Christ also has inherent [righteousness], as the apostle says [1 Cor. 6:11]: ‘you are washed, you are sanctified, you are justified, etc.’ (which is why the holy fathers made use of [the term] ‘to be justified’ even to mean ‘to receive inherent righteousness’), nevertheless, the faithful soul depends not on this, but only on the righteousness of Christ given to us as a gift, without which there is and can be no righteousness at all. And so by faith in Christ we are justified or reckoned to be righteous, that is we are accepted through his merits and not on account of our own worthiness or works. And on account of the righteousness inherent in us we are said to be righteous, because the works which we perform are righteous, according to the saying of John [1 John 3:7]: ‘whoever who does what is right is righteous’. … 10. Now those who say that we are justified by faith alone should at the same time teach the doctrine of repentance, of the fear of God, of the judgement of God and of good works, so that all the chief points of the preaching may remain firm, as Christ said: ‘preaching repentance and the remission of sins in my name’ [Luke 24:47]. And that is to prevent this way of speaking [i.e. sola fide] from being understood other than has been previously mentioned.</p></blockquote>

ccording+to+the+saying+of+John+%5B1+John+3%3A7%5D%3A+%E2%80%98whoever+who+does+what+is+right+is+righteous%E2%80%99.+%E2%80%A6+10.+Now+those+who+say+that+we+are+justified+by+faith+alone+should+at+the+same+time+teach+the+doctrine+of+repentance%2C+of+the+fear+of+God%2C+of+the+judgement+of+God+and+of+good+works%2C+so+that+all+the+chief+points+of+the+preaching+may+remain+firm%2C+as+Christ+said%3A+%E2%80%98preaching+repentance+and+the+remission+of+sins+in+my+name%E2%80%99+%5BLuke+24%3A47%5D.+And+that+is+to+prevent+this+way+of+speaking+%5Bi.e.+sola+fide%5D+from+being+understood+other+than+has+been+previously+mentioned.%E2%80%9D%0A%0A%E2%80%94+Regensburg+Agreement+of%2C+Article+5&amp;url=https%3A%2F%2F5solasquotes.github.io%2Fquote%2F3e250a42f4.html&amp;via=5Solas" target="_blank" rel="noopener">Share on X</a><a class="perma" href="../quote/3e250a42f4.html">Permalink</a><a class="src" href="https://reformedbooksonline.com/topics/justification#:~:text=3.%20Likewise%2C%20it%20is%20quite%20clear,other%20than%20has%20been%20previously%20mentioned." rel="noopener" target="_blank">Read it online · Reformed Books Online</a></div>

<blockquote><p>if heretics wanted only the merits of Christ to be imputed to us, because they are given to us, and we can offer them to God the Father for our sins, since Christ undertakes the burden of satisfying for us, and not reconciling us to God the Father, their opinion would be correct.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/louis-le-blanc.html">Louis Le Blanc</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Theological Theses published at Various Times in the Academy of Sedan, vol. 2 3rd ed. tr. by AI by Colloquia Scholastica at Discord (1675; London, 1683), ‘On Imputed Righteousness’, pp. 259-61 Latin | XXXIII. Indeed, not even our way of speaking is dared to be simply condemned by the Roman School of Theology, for they concede that it can be said in a sound sense that the righteousness of Christ is imputed to us and becomes ours. Indeed, that sound sense according to which they interpret that expression is the very one that we intend. This is clearly evident from Bellarmine, bk. 2, On Justification, ch. 7, §4: “Fourth, it is refuted. For,” he says</cite></span></figcaption>

<div class="actions"><button class="copy" data-copy="“if heretics wanted only the merits of Christ to be imputed to us, because they are given to us, and we can offer them to God the Father for our sins, since Christ undertakes the burden of satisfying for us, and not reconciling us to God the Father, their opinion would be correct.”

— Louis Le Blanc, Theological Theses published at Various Times in the Academy of Sedan, vol. 2 3rd ed. tr. by AI by Colloquia Scholastica at Discord (1675; London, 1683), ‘On Imputed Righteousness’, pp. 259-61 Latin | XXXIII. Indeed, not even our way of speaking is dared to be simply condemned by the Roman School of Theology, for they concede that it can be said in a sound sense that the righteousness of Christ is imputed to us and becomes ours. Indeed, that sound sense according to which they interpret that expression is the very one that we intend. This is clearly evident from Bellarmine, bk. 2, On Justification, ch. 7, §4: “Fourth, it is refuted. For,” he says">Copy</button><a class="share" href="https://x.com/intent/post?text=%E2%80%9Cif+heretics+wanted+only+the+merits+of+Christ+to+be+imputed+to+us%2C+because+they+are+given+to+us%2C+and+we+can+offer+them+to+God+the+Father+for+our+sins%2C+since+Christ+undertakes+the+burden+of+satisfying+for+us%2C+and+not+reconciling+us+to+God+the+Father%2C+their+opinion+would+be+correct.%E2%80%9D%0A%0A%E2%80%94+Louis+Le+Blanc%2C+Theological+Theses+published+at+Various+Times+in+the+Academy+of+Sedan%2C+vol.+2+3rd+ed.+tr.+by+AI+by+Colloquia+Scholastica+at+Discord+%281675%3B+London%2C+1683%29%2C+%E2%80%98On+Imputed+Righteousness%E2%80%99%2C+pp.+259-61+Latin+%7C+XXXIII.+Indeed%2C+not+even+our+way+of+speaking+is+dared+to+be+simply+condemned+by+the+Roman+School+of+Theology%2C+for+they+concede+that+it+can+be+said+in+a+sound+sense+that+the+righteousness+of+Christ+is+imputed+to+us+and+becomes+ours.+Indeed%2C+that+sound+sense+according+to+which+they+interpret+that+expression+is+the+very+one+that+we+intend.+This+is+clearly+evident+from+Bellarmine%2C+bk.+2%2C+On+Justification%2C+ch.+7%2C+%C2%A74%3A+%E2%80%9CFourth%2C+it+is+refuted.+For%2C%E2%80%9D+he+says&amp;url=https%3A%2F%2F5solasquotes.github.io%2Fquote%2F971fd04fa4.html&amp;via=5Solas" target="_blank" rel="noopener">Share on X</a><a class="perma" href="../quote/971fd04fa4.html">Permalin

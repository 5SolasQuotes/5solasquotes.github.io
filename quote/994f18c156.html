<main class="wrap"><figure class="quote" id="q-994f18c156" data-kw="">
<blockquote><p>There is a double interpretation of this text, each of them claiming under very valuable interpreters; some making it a declaration of Christ’s readiness to come in to souls, and to give them a spiritual fellowship and communion with Himself; others interpreting it of Christ’s readiness to come to the Last Judgment, and to take his saints into an eternal joyful fellowship and communion with Himself: hence there is a different interpretation of every sentence in the text. I stand at the door; either, in my gospel dispensations, I stand at the door of sinners’ hearts; or, I am ready to come to judge the world. And knock, by the inward monitions and impressions of my Spirit, or my ministers more externally; or, I am about to knock, that is, I am ready to have the last trump sounded. If any man hear my voice, and open the door; that is, if any man will hearken to the counsels and exhortations of my ministers, and to the monitions of my Spirit, and not resist my Holy Spirit; or, if any man has heard my voice, and opened his heart to Me.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/john-collinges.html">John Collinges</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Matthew Poole’s English Annotations on the Holy Bible. Collinges was one of the men who finished Poole’s Commentary after he died, having gotten to Isa. 58</cite>, Rev. 3:20, “Behold, I stand at the door, and knock: if any man hear my voice, and open the door, I will come in to him, and will sup with him, and he with me.”</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/effectual-calling/means-of-calling.html">Means of Calling</a></span></div>

ote%2F994f18c156.html&amp;via=5Solas" target="_blank" rel="noopener">Share on X</a><a class="perma" href="../quote/994f18c156.html">Permalink</a><a class="src" href="https://reformedbooksonline.com/let-jesus-come-into-your-heart/#:~:text=There%20is%20a%20double%20interpretation%20of,and%20opened%20his%20heart%20to%20Me&amp;text=There%20is%20a%20double%20interpretation%20of%20this%20text&amp;text=my%20voice%2C%20and%20opened%20his%20heart%20to%20Me" rel="noopener" target="_blank">Read it online · Reformed Books Online</a></div>
</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-acf626ff03" data-kw="">
<blockquote><p>3. The wooings of Christ to gain your hearts: Consider Him bowing the heavens and coming down, and laying aside his robes of majesty, and putting on your filthy garments: Consider Him going about from place to place, on no other errand, but to gain your hearts and win your souls: And, whoever spake such effectual words as Christ spake when He was upon the earth? Who ever gave such precious jewels to a bride, as Christ gave to his spouse? Who ever put on such apparel as Christ did, when He wooed his Church?… Ah! poor Sinners, see your Jesus hanging on the cross, dropping out his last blood, breathing out his last breath, stretching out his dying arms to encircle sinners; and come, Oh come and throw yourselves into his bleeding arms! Away with all prejudicate opinions! Who shall say Christ is not willing to save him, and not blaspheme eternal love? Speak truth: Corrupt hearts speak truth; say not Christ is unwilling, but you are unwilling; ‘I would, but ye would not.’ [Mt. 23:37] 4. The weepings of Christ if He cannot prevail. Thus we find Him in the Gospel expressing Himself, not only in words, but in tears. And when He was come near Jerusalem, He beheld the city, and wept over it, Lk. 19:41… What? Christ to weep for you, over you? Methinks, if you had hearts of stone, it should melt your hearts.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/isaac-ambrose.html">Isaac Ambrose</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Looking unto Jesus: a View of the Everlasting Gospel</cite>, … (d. 1664; Edinburgh: Ormiston, 1723), pp. 246–47</span></figcaption>

</figure><figure class="quote" id="q-b4d63f5295" data-kw="">
<blockquote><p>So in the 23rd [of] Proverbs, v. 26. ‘My son give me thy heart;’ ‘O my son,’ says God, ‘give Me thy heart;’ Christ is the Everlasting Father, and He says, ‘My son, give me thy heart, come to Me.’ One place more in the 3rd [chapter of] Revelation is worth your observing; ‘Behold, I stand at the door and knock, if any man hear my voice and open the door, I will come in to him and will sup with him, and he with Me:’ ‘Behold I stand at the door and knock;’ I came down from heaven into mine ordinances, I knock at the door of your hearts and consciences, if any man will open now, if any many would have water of life from me, if any man would have bread of life from Me, if any man would have communion with Me, let him but open and receive Me in, and I will sup with him and he with Me: what sweet invitations have we from Christ, how forward, how ready is the Lord Jesus to do poor sinners good.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/ezekiel-greenhill.html">Ezekiel Greenhill</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Sermons of Christ</cite>, … (London: R.I., 1656), “Christ’s Willingness to Save Sinners, Sermon 1”, p. 156</span></figcaption>

<blockquote><p>Behold, I have used all means for thy conversion: I have patiently expected it, and earnestly importuned it, and still I continue so doing; and if any man hear the voice of my Word, and open the door of his heart to Me, yielding to those my vehement solicitations, I will impart Myself to the soul of that man, and will have mutual fellowship with him, and he with Me.</p></blockquote>

<main class="wrap"><figure class="quote" id="q-eb652065a8" data-kw="">
<blockquote><p>Scripture attributes wrath to God throughout, and other passions also. It will be queried therefore in this place whether it pertains to God, and in what way. And first, the philosophers denied wrath to occur in God, as Epicurus denied and the Stoics, which we so grant, though we only minimally demonstrate [in what follows]. … True, therefore, is this judgment: Wrath does not properly occur in God by his nature, but concerning that, it is said in a human fashion. … We define, therefore, the wrath of God to be the eternal judgment, always like unto Himself, against a sinner.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/aretius.html">Aretius</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Sacred Problems of Theology… (Geneva, 1589; Bern, 1604), Place 158, ‘Whether Wrath is in God, and How?’</cite>, pp. 477-78</span></figcaption>

<blockquote><p>…his virtues follow; which as they have their seat in man, in the will and affections, so it is not inconvenient for method’s sake to refer them to the same in God. Gods virtues are his essence considered, as it always works orderly, fitly and agreeably to perfect reason. They are not things differing from his essence as in us, but we must conceive of them according to our capacity, and handle them distinctly. By virtues we understand first in general the idea of virtue, or the chiefest moral perfection, by which God is in Himself absolutely the best, and in respect of which all the virtues of angels and men are only slender shadows and representations.</p></blockquote>

</figure><figure class="quote" id="q-95fb5874b7" data-kw="">
<blockquote><p>The more principal Relative Attributes are in number seven: 1. Creation. 2. Providence. 3. Lordship. 4. Benignity. 5. Mercy. 6. Redemption. 7. Justice. To which, or some of which, the rest of like nature may conveniently be referred. Though the terms Creator, Governor, Redeemer and Lord do more clearly hold forth the relation between God and the creature, yet (after others) the fore-named terms are here made use of: both as sufficiently containing the relation and better conducing to teach the doctrine intended. A new Relative Attribute or praedication does not always presuppose a change in that thing unto which that new relation is given, though it always presupposes a change in that whereunto such relation does really belong: for example sake: Peter may sit at the right hand of John without any change in Peter, the change being only in John who places himself at Peter’s left hand. The princes are said to stand on the right hand of the wall, Neh. 12:31, without any change in the wall; the change was only in them so placing themselves. So God who was not a Creator from eternity, is a Creator in time: yet this new appellation puts no change in God, but only in the creature. The Second Person who was not incarnate from eternity, becomes incarnate in the fulness of time, yet without any change: the change was, and is only in the human nature assumed, not in the divine nature assuming. In these Relative Attributes (the Creator being above the order of the creature), the extremes not being alike, the relation is not alike. The relation on Gods part is only a relation of reason: that is, such a respect of the Creator to the creature, as is without any change in Him: but on the creature’s part, it is a real relation: that is, such a relation as infers a change in it. Relative Attributes add a new predication or title to, but cause no real mutation or change in God: as concerning the creature, they both add a new predication to it and cause a real mutation in it. In all Relative Attributes there are considerable (but especially in Creation, Providence and Redemption) an eternal immanent act, whereby God wills such a thing to be; and a transient temporal act, whereby He works the thing according to his will.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/john-norton.html">John Norton</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Orthodox Evangelist… (London: Macock, 1654), ch. 1, Of the Divine Essence</cite>, pp. 10-11</span></figcaption>

</figure><figure class="quote" id="q-5f3e720410" data-kw="">
<blockquote><p>…love consists in a certain agreement of the lover with the object loved, while hatred consists in a certain disagreement or dissonance. Now we should consider in each thing, what agrees with it, before that which disagrees: since a thing disagrees with another, through destroying or hindering that which agrees with it. Consequently love must needs precede hatred; and nothing is hated, save through being contrary to a suitable thing which is loved. And hence it is that every hatred is caused by love.</p></blockquote>

<main class="wrap"><figure class="quote" id="q-2a845446ec" data-kw="">
<blockquote><p>Let us humble ourselves under the mighty Hand of God, which is lifted up over our guilty Heads, that we may be exalted in due Time. I could venture the Reputation of my Judgment and Veracity, that it will never be well with our Country, ’til there be more of the Fear and Love of God in it, and ’til the Name of Jesus be of more Importance among us. I could prescribe a Method for our Deliverance, which is at once infallible, and also cheap, and safe, and so far from endangering the Life of any, that it would secure the everlasting Life of all that comply with it.

Ye that complain of the Burden of our public Taxes; ye that love ease and shrink from the Dangers of War; ye that wish to see peace restored once more; ye that would be happy beyond the Grave, and live forever, attend to my Proposal: It is this, A THOROUGH NATIONAL REFORMATION. This will do, what Millions of Money and Thousands of Men, with Guns and Swords and all the dreadful Artillery of Death, could not do; it will procure us Peace again; a lasting well-established Peace.

We have tried other Expedients without this long enough: Let us now try this new Expedient, the Success of which I dare to warrant.—And do not object, that such a general Reformation is beyond your Power; for a general Reformation must begin with Individuals: therefore do you, through the Grace of God, do your Part; Begin at Home, and endeavour to reform yourselves, and those under your Influence.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/samuel-davies.html">Samuel Davies</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The curse of cowardice. A sermon preached to the militia of Hanover County, in Virginia, at a general muster, May 8, 1758. With a view to raise a company for Captain Samuel Meredith</cite>, (Boston: Z. Fowle and S. Draper, 1759), pp 29-30.</span></figcaption>

</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-f56d03c37b" data-kw="">
<blockquote><p>With the deepest feeling of affection for the Church of England I cannot avoid the conclusion that in the matter of the laity its system is at present defective and infra-scriptural, and hence this well-meant scheme of Brotherhoods. I cannot reconcile the position of the English lay Episcopalian in 1890 with that of his brother in any apostolic Church eighteen centuries ago. I cannot make the two things square. To my eyes it seems that in the regular working of the Church of England almost everything is left in the hands of the clergy, and hardly anything is assigned to the laity! The clergy settle everything! The clergy manage everything! The clergy arrange everything!

The laity are practically allowed neither voice, nor place, nor opinion, nor power, and must accept whatever the clergy decide for them. In all this there is no intentional slight. Not the smallest reflection is implied on the trustworthiness and ability of the laity. But from one cause or another they are left out in the cold, passive recipients and not active members, in a huge ecclesiastical corporation; sleeping partners and not working agents in an unwieldy and ill-managed concern.

In short, in the normal action of the Church of England, lay Churchmen have been left on a siding. Like soldiers not wanted, they have fallen out of the ranks, retired to the rear, and sunk out of sight. The effect at the present day is that the English laity are far below the position they ought to occupy, and the English clergy are far above theirs. Both parties, in short, are in the wrong place. The clergy have too much to do and the laity too little, and the whole result is that the masses are not reached.</p></blockquote>

<blockquote><p>Nothing begets so great an aptness in men to receive errors as this sinful admiration. Affection commonly makes men take down falsities; and error is easily received from them whom we much admire; and God does often leave admired teachers to err, for trial of the people, and the punishing of their vanity, in making God’s truth to stand at the devotion of the teacher for its acceptance, and trampling upon the holy, and (perhaps) learned labors of those who are more seeing and faithful than the admired.</p></blockquote>

<main class="wrap"><figure class="quote" id="q-5f2ddee527" data-kw="">
<blockquote><p>Our God is one, or rather He is Oneness itself, a unity which has nothing in itself but itself, not consisting of many things, as everything else does. In this essential Unity of God, a hypostatic Trinity subsists in a way that far exceeds the imagination of men. The external operations of God in time and history are such that, even though He is one, each hypostasis does something particular and appropriate.

For since they are Three and subsist in the essence of one Deity, it can truly be said that all things are from the Father, by the Son, and through the Holy Spirit. What the Son hears from the Father, and what the Spirit receives from the Father and the Son, we come to receive at the hands of the Spirit (John 16:13-15), and therefore He is the last and nearest to us in order, although in power He is equal to the Second and First.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/richard-hooker.html">Richard Hooker</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Divine Law and Human Nature: Book I of Hooker’s Laws: A Modernization</cite>, ed. W. Bradford Littlejohn et al. (Lincoln NE: The Davenant Press, Kindle Edition, 2017), pp 5-6.</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/the-trinity.html">The Trinity</a></span></div>

</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-a5eeac7eee" data-kw="">
<blockquote><p>The faith which the holy patriarchs and prophets received from God before the Incarnation of the Son of God, the faith which the holy Apostles too heard from the Lord himself, living in the flesh, and, instructed by the teaching of the Holy Spirit, not only preached orally but also left behind instilled in their writings for the salutary instruction of posterity—this faith proclaims one God, the Trinity, i.e., Father, Son, and Holy Spirit. But it would not be a real Trinity if one and the same person were called Father and Son and Holy Spirit. For, if, just as there is one substance of the Father and the Son and the Holy Spirit, so there would be one person, then there would be no way at all in which it could truly be called a Trinity.

Again, it would be a real Trinity, but that Trinity would not be one God if, just as Father, Son, and Holy Spirit are distinct from one another by what is proper to their persons, so likewise they would be different by a diversity of natures. But, since in that one true God, the Trinity, not only because God is one but also because he is a Trinity, it is naturally true therefore that the true God is in himself a Trinity of persons but in nature is one.

Through this unity of nature, the whole of the Father is in the Son and the Holy Spirit, and the whole of the Son in the Father and the Holy Spirit, and, as well, the whole of the Holy Spirit in the Father and the Son. No one of these is outside of any of the others, because none either precedes the others in eternity, or exceeds them in greatness, or overcomes them in power; because the Father is neither prior to nor greater than the Son or the Holy Spirit, in so far as it pertains to the unity of the divine nature.

Neither is the eternity nor the immensity of the Son either prior to or greater than; nor does it by nature either precede or exceed the eternity or the immensity of the Holy Spirit. Just as the Son is neither later nor less than the Father, so neither is the Holy Spirit later or less than the Son. And the Son is eternal and without beginning, because the Son, born from the nature of the Father, has always existed. And the Holy Spirit is eternal and without beginning, because the Holy Spirit proceeds from the nature of the Father and the Son. So, therefore, rightly do we believe and say that the three are one God, because there is a single eternity, a single immensity, a single divinity by nature of three persons.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/fulegentius-of-ruspe.html">Fulegentius of Ruspe</a></span><span class="wk"><span class="lbl">Work:</span> <cite>To Peter on the Faith</cite>, in Selected Works, trans. Robert B. Enos, The Fathers of the Church: A New Translation, vol. 95 (Washington D.C.: The Catholic University of America Press, 1997), 4, pp 61-63.</span></figcaption>

</figure><figure class="quote" id="q-fdb18aed36" data-kw="Filioque from Son">
<blockquote><p>Although the Greeks ought not to have been charged with heresy on account of their opinion … still the opinion of the Latins may be properly retained as more agreeable to the words of Scripture and the truer. (1) The Holy Spirit is sent from the Son as well as from the Father (Jn. 16:7). He therefore ought to proceed from him because he cannot be sent by the Son unless he proceeds from him. (2) He is called the Spirit of the Son as well as the Father (Gal. 4:6).</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/francis-turretin.html">Francis Turretin</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Institutes of Elenctic Theology</cite>, 3.31.5</span></figcaption>

</figure><figure class="quote" id="q-899d6c24a5" data-kw="">
<blockquote><p>Works of Nature they call those which God produces in Nature by a certain common operation. And they are either of Creation, or of Conservation and Governance. … By this, however, no Persons of the Deity are excluded from creation, but only creatures and fictitious divinities. For the individual Persons are that one, true, living, and everlasting God, and in respect to them this work no less than the other external works is counted indivisible or common. Which the very history of creation openly testifies, when it introduces several Persons consulting and creating, Gen. 1:26. Scripture testifies elsewhere, where concerning the one God the creator it speaks by the name of makers, Isa. 54:5, in the plural number, Job 35:10. Moreover, the work of creation is attributed no less to the Son, John 1:3; Col. 1:16; Heb. 1:2; and to the Holy Spirit, Gen. 1:2; Job 26:13; 33:4; Ps. 104:30, than the Father claims it διὰ ῥητῶν [dia rhētōn, explicitly]. That the Father is sometimes peculiarly called creator and Lord of heaven and earth, Acts 4:24; Mt. 11:25, is all from the order and mode of operation in creation. For He created not from another but from Himself, inasmuch as He is the fountain of the Deity and of divine operations. The Son, however, and the Holy Spirit created not from themselves but from the Father, and the Father through them, 1 Cor. 8:6; Rom. 11:36.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/johann-heinrich-alting.html">Johann Heinrich Alting</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Scriptural Theology of Heidelberg</cite>, vol. 1 (d. 1644; Amsterdam: Jansson, 1646), Locus 5, ‘On Creation’, trans. AI at Confessionally Reformed Theology</span></figcaption>

</figure><figure class="quote" id="q-2b5af919d5" data-kw="">
<blockquote><p>God hath all life, glory, goodness, blessedness, in and of himself; and is alone in and unto himself all-sufficient, not standing in need of any creatures which he hath made, nor deriving any glory from them, but only manifesting his own glory in, by, unto, and upon them: he is the alone fountain of all being, of whom, through whom, and to whom, are all things;</p></blockquote>

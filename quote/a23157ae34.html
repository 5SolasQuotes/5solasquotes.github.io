<blockquote><p>Secondly, Consider we the Law as in the administration of it to Moses, and so to the people of the Jews: The administration of the Law to them it was under another notion, it was to bring them to Christ, and that they might come to see their inability of keeping of that Covenant, and come to understand Christ so much the more, and to be driven unto Christ by having the Law presented to them, God did never intend by giving of the Law to the people of the Jews that it should be a Covenant of eternal life to them; indeed there was this in the administration of it somewhat different from us, some special Covenant about their living in Canaan, and about mercies in that promised Land, beyond that that we have in the Law, as we find in the new Testament, they (I say) had this annexed to it.

The Law that was first given unto Adam and written in his heart, afterwards even obliterated, then it was transcribed by the same hand in tables of stone and given unto them chiefly to shew them their misery, and their need of Christ; to be a preparation for Christ’s coming into the world; and with this one addition beyond what we have in the new Testament, that there was a temporal Covenant annexed unto it, that concerned their living prosperously in the Land of Canaan, (&amp; so far we are delivered even from the Law as it was given by Moses, that is, from the connexion of the Covenant that was added unto the delivering of the Law) concerning their happy and comfortable condition in the Land of Canaan upon the keeping of their Law; but now (how ever it was) certainly that Conversation that becomes the Gospel should be beyond what could be even from godly men in the time of the Law.

As first, The Law to them it was given under low Promises, their promises were but very low that were under the Law: It’s true, they had somewhat of the Gospel that we have, but extreme darkly, and very little that they knew of it, but the chief Ministration of God towards them was then in a legal way, and that had but low promises, as their living in Canaan; you shall find generally al the promises that are annexed to the Law even by Moses, it is but, that they shall prolong their days in the Land the Lord their God shall give them, That they should be blest in their basket and store: their Promises were under Heaven-Promises, Promises of this life only; and therefore it could raise them but to a very low degree of holiness.

Secondly, Their Ordinances were but poor and mean, and beggarly in comparison of our; for so the Gospel calls them, Col. 2. They were but beggarly rudiments, which stood only in meats and drinks, and divers washings, and carnal Ordinances imposed on them until the time of reformation. Heb. 9. 10. They had an earthly Tabernacle, a worldly Sanctuary, Heb. 9. 1. &amp;c.

Thirdly, The burden of them under the Law was very great, they were under a heavy yoke &amp; burden that did bow them down: A man that is under a heavy burden it makes him stoop &amp; bend in the back, he cannot stand so upright nor fast as others that have no such weight upon them. Fourthly, The administration of the Law was with Thunder and Lightning very terrible, It made even Moses quake and tremble, (as the Author to the Hebrews speaks.)

Fifthly, Their spirits were very servile under the Law, they were subject to bondage even all their days; God so ordered things as to carry on his people even in a very servile way, they were but mean servants then, hewers of wood and drawers of water.

But now under the Gospel, First, our Promises are far better, and our Covenant better, in Heb. 8. 6. there the Apostle compares their Condition and ours, Who serve (saith he) unto the example and shadow of heavenly things, There was but the shadow of heavenly things; the Gospel hath the Heavenly things themselves, and they are but the shadow, for so you have it in Heb. 10. 1. For the Law having a shadow of good things to come, and not the very image of the things: They had but a shadow of good things to come, and not the very image it self. As Moses was admonished of God, when he was about to make the Tabernacle, For see (saith he) that thou make all things according to the pattern shewed to thee in the Mount.

And then in Heb. 8. 6. But now hath he obtained a more excellent Ministry, [that’s Christ] By how much also he is the Mediator of a better Covenant, which was established upon better promises: A better Covenant, and stablished upon better promises, or a better Testament: Their promises I say were but low and mean; and our promises are high and precious, and we have a better Covenant, a Covenant not of living in the Land of Canaan, but of Heaven, of which that Canaan was but a Type, and therefore our Conversations should rise higher in holiness according as our Covenant and Promises are better than theirs.</p></blockquote>

<blockquote><p>…these considerations must be premised:

1. That mercy is otherwise in God than in man: in man indeed it is a grief or compassion conceived upon another’s misery: but in God it is only a propension and readiness of the divine will to help those which are in misery.

2. Mercy in God either signifies the inclination, power, faculty and property to show mercy, and this is natural in God: or the act and exercising of that property toward the creature, and this is so natural in God as yet it is directed by his will.

3. A thing is said to be natural two ways: Either that which only proceeds from the instinct of nature, as the fire naturally burns: or that whereunto nature inclines, yet not without direction of the will, as thus a man is said to speak, to understand naturally: So God is both ways naturally merciful, in Himself the first way; toward his creatures the second. Now to the arguments we answer:

1. The apostle [in Rom. 9:18] speaks not of the natural property, but of the act of mercy, which is directed by the will of God.

2. All the natural properties which are in God He always uses not, nor towards all: as his justice, power, longanimity, mercy: they are always in God, but He exercises them as it pleases Him.

3. Justice and mercy are not contrary, but cruelty is opposed to mercy: neither is there any contrariety in God, but in the effects in diverse subjects: as the Sun with the same heat mollifies the wax and hardens the clay.

4. Neither are these properties unequal in God, but the effects and acts only are unequal, as it pleases God to dispose in his freewill.</p></blockquote>

<blockquote><p>In the times of truest spiritual life, this was not forgotten in Israel. The holy men who “obtained a good report by faith” had large and world-wide views, and large and world-wide hopes, as to the grace of God and the reign of their Messiah. They expected Him to rule over a kingdom co-extensive with the whole world. They expected Him to dispense blessings sufficient for every land.

The more they appreciated their own sinfulness and the freeness and sovereignty of the grace of God, the more did they clearly comprehend how the Gentiles also might freely partake of the same free mercy with themselves; and the more they felt the vanity of all earthly good and the helplessness of their whole earthly estate, and appreciated the promised kingdom and sovereign reign of their Christ as unworldly, spiritual, heavenly, divine, and eternal, so much the more did they clearly see how all nations, as they needed, so they might be embraced by, this new, heavenly kingdom of the Lord and His Anointed.

Hence, in the days of David, when true spiritual life flourished, and un-Pharisaic knowledge of the grace of God was comparatively widely diffused, the Gentiles were looked on with no evil eye; their salvation was felt to be clearly within the compass of the covenant of Abraham; and their subjugation to the coming Messiah was regarded as one of the glorious events which should mark and grace His advent and manifestation. Hence such passages in the Psalms as these,—the first addressed by the Father to His Anointed, and the second by the Church to her covenant God :— “Ask of me, and I will give thee the heathen for thine inheritance, and the uttermost parts of the earth for thy possession;” “Have respect unto Thy covenant, for the dark places of the earth are full of the habitations of cruelty” (Ps. ii. 6; lxxiv. 20).

And if any farther proof be needed that the Church, in the days of her true life and fidelity, looked for being enlarged with the believing brotherhood of the converted nations, we have it in that noble hymn of missionary prayer and hope, opening as it does with the well-remembered words, “God be merciful unto us, and bless us: and cause his face to shine upon us; that thy way may be known upon earth, thy saving health among all nations,” and closing with the confession of free, unhampered, appropriating faith, “God shall bless us,” and with the enlarged and unbounded expectation, “And all the ends of the earth shall fear him” (Ps. lxvii. 1—7).

But in the days of Israel’s degeneracy, when faith gave place to formalism, and contrite gratitude to cold and supercilious ceremony; when self-righteous pride, singularly enough keeping pace with increasing iniquity and worthlessness, arrogantly claimed right to the privileges of the covenant in very proportion as all the spirit of the covenant was violated; when the close and narrow spirit of legalism, resting its claims on carnal distinctions, and saying, “ We have Abraham to our Father,” superseded the true spirit of Israel, “I am not worthy of the least of all the goodness and the truth thou hast shown unto thy servant;” the idea of pure and sovereign grace being lost sight of — that grace whereby Jew and Gentile alike may be freely saved, — and the kingdom of the Messiah being conceived of as earthly and limited — set up, indeed, as a badge of distinction, to magnify the seed of Abraham according to the flesh; then the Gentile nations began to be looked upon as natural and irreconcilable enemies.

The Jewish Church, in fact, in such a spirit, enacts exactly the part of the Pharisee of the parable, while the publican may represent the waste of heathendom; and the vain-glorious Church, claiming Heaven’s favour on the ground of her carnal distinctions and pitiable tithings, thanks God that she is not as this poor publican!

For in every point of view, and on whatever scale, self-righteousness is exclusive and malignant, remorselessly consigning over others to a destruction which, on its own proud merit and pre-eminence, it counts itself entitled to escape. Perhaps, more properly indeed, it came to this, that the heathen nations, as to their moral and spiritual interests, were, among Israel, objects of simple contempt and neglect, and were dealt with as if Jehovah, the God of Israel, utterly neglected them also —-as if, in short, they were beyond the pale of His government; or, in other words, as if Jehovah’s government were not universal, but limited to their own nation alone. It is evident how, with such a view of their own God, their own adoring regards for Him must have been destroyed.

Jehovah is the God of the spirits of all flesh, and ruleth over all the nations. Any other or more limited idea of His government, reduces Him, if not to the level, at least to the company, of the local, territorial, geographical gods of heathendom. And thus, by taking a wrong view of the relation of heathendom to the living and true God, the God of Israel, Israel virtually imbibed the very views of heathendom itself. Indeed, nothing but true faith, contrition, adoring confidence, and loyalty to Jehovah, could prevent this painful perversion of the truth.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/hugh-martin.html">Hugh Martin</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Prophet Jonah: His Character and Mission to Nineveh</cite>, (London: Alexander Strahan, 1866), pp 6-9.</span></figcaption>

<blockquote><p>[T]here is a further consideration that will make it appear, that the Grace of God does exceed the grace of the most glorious angel in heaven: which is the unlimited perfection of God’s nature, the Angels have a stinted measure of perfection: the excelling of their nature is not sufficient in order to some acts of grace: as in other respects, they are not sufficient, so they have not grace enough to pardon such wrongs as God pardons; to be at such cost for man’s salvation, as God has been at: ’tis true that they do approve of and rejoice in all those acts of Grace that God does? but such actions do exceed the grace that is in their hearts; they have can’t perform those acts of mercy that God does: therefore where God would shew his sufficiency to pardon the iniquities of his people, he tells them, that God, Hos. 11.6. this infiniteness of God’s grace is the foundation of our faith, for such things as we are utterly unworthy of: Psal. 36.7. how excellent is thy loving kindness O Lord, therefore the Sons of men put their trust under the shadow of thy wings.

There is an infinite Ocean of grace in the heart of God, whereby he can bestow the greatest gifts upon his creatures, that their natures are capable of: this plain from that absolute liberty which the Scripture does ascribe unto God in all his actions; he does all things after the counsel of his own Will. Eph. 1.11. I will have mercy on whom I will have mercy, Rom 9.15. which shews there is no limitedness in his perfection, to be any restraint unto him: or a reason why he does not pardon and save these and those: his glorious excellency is such, that no unworthiness, nor provocation can overcome his mercy: but there is a sufficiency of grace in him, for any thing that is an act of mercy.</p></blockquote>

— Solomon Stoddard, The safety of appearing at the day of judgement, in the righteousness of Christ: opened and applied, (Boston MA: Samuel Phillips, 1687), pp 17-18.">Copy</button><a class="share" href="https://x.com/intent/post?text=%E2%80%9C%5BT%5Dhere+is+a+further+consideration+that+will+make+it+appear%2C+that+the+Grace+of+God+does+exceed+the+grace+of+the+most+glorious+angel+in+heaven%3A+which+is+the+unlimited+perfection+of+God%E2%80%99s+nature%2C+the+Angels+have+a+stinted+measure+of+perfection%3A+the+excelling+of+their+nature+is+not+sufficient+in+order+to+some+acts+of+grace%3A+as+in+other+respects%2C+they+are+not+sufficient%2C+so+they+have+not+grace+enough+to+pardon+such+wrongs+as+God+pardons%3B+to+be+at+such+cost+for+man%E2%80%99s+salvation%2C+as+God+has+been+at%3A+%E2%80%99tis+true+that+they+do+approve+of+and+rejoice+in+all+those+acts+of+Grace+that+God+does%3F+but+such+actions+do+exceed+the+grace+that+is+in+their+hearts%3B+they+have+can%E2%80%99t+perform+those+acts+of+mercy+that+God+does%3A+therefore+where+God+would+shew+his+sufficiency+to+pardon+the+iniquities+of+his+people%2C+he+tells+them%2C+that+God%2C+Hos.+11.6.+this+infiniteness+of+God%E2%80%99s+grace+is+the+foundation+of+our+faith%2C+for+such+things+as+we+are+utterly+unworthy+of%3A+Psal.+36.7.+how+excellent+is+thy+loving+kindness+O+Lord%2C+therefore+the+Sons+of+men+put+their+trust+under+the+shadow+of+thy+wings.%0A%0AThere+is+an+infinite+Ocean+of+grace+in+the+heart+of+God%2C+whereby+he+can+bestow+the+greatest+gifts+upon+his+creatures%2C+that+their+natures+are+capable+of%3A+this+plain+from+that+absolute+liberty+which+the+Scripture+does+ascribe+unto+God+in+all+his+actions%3B+he+does+all+things+after+the+counsel+of+his+own+Will.+Eph.+1.11.+I+will+have+mercy+on+whom+I+will+have+mercy%2C+Rom+9.15.+which+shews+there+is+no+limitedness+in+his+perfection%2C+to+be+any+restraint+unto+him%3A+or+a+reason+why+he+does+not+pardon+and+save+these+and+those%3A+his+glorious+excellency+is+such%2C+that+no+unworthiness%2C+nor

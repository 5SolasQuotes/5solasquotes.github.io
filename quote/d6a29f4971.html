<main class="wrap"><figure class="quote" id="q-d6a29f4971" data-kw="">
<blockquote><p>This whole matter depends on sure, firm, and harmonious testimonies of the first and ancient church, and where these are lacking, the later church, as it cannot make genuine books out of spurious ones, so also it cannot make certain writings out of doubtful ones without clear and firm proofs.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/martin-chemnitz.html">Martin Chemnitz</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Examination of the Council of Trent</cite>, Part I, Topic on the Holy Scripture, Sec. VI</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/holy-scripture/canon.html">Canon</a> › <a href="../topics/holy-scripture/canon/disputed-books.html">Disputed books</a></span><span class="t"><a href="../topics/rome/the-rule-of-faith.html">Rome: The Rule of Faith</a> › <a href="../topics/rome/the-rule-of-faith/apocrypha.html">Apocrypha</a></span></div>

</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-8d052c2daa" data-kw="">
<blockquote><p>Some distinguished men among the Roman Catholics have asserted, that the Scriptures owe all their authority to the Church; so that if she did not give her attestation to the gospels, they would have no more authority than Æsop&#x27;s Fables. But when asked how the Church can establish her authority, they must answer, that it is proved by the testimony of the Scriptures. This is a perfect example of the sophism called &quot;a circle,&quot; for they prove the authority of the Scriptures by the Church, and the authority of the Church by the Scriptures.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/archibald-alexander.html">Archibald Alexander</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Evidences of the Authenticity, Inspiration, and Canonical Authority of the Holy Scriptures</cite>, ch. on the canon of the New Testament, pp. 273–274</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/holy-scripture/canon.html">Canon</a></span><span class="t"><a href="../topics/holy-scripture/divine-authority.html">Divine Authority</a></span><span class="t"><a href="../topics/rome/the-rule-of-faith.html">Rome: The Rule of Faith</a> › <a href="../topics/rome/the-rule-of-faith/scripture-vs-tradition.html">Scripture vs tradition</a></span></div>

</figure><figure class="quote" id="q-c25d9bf3fd" data-kw="">
<blockquote><p>The later church only preserves and transmits to posterity the witness of the first church, but it neither should nor can decree anything concerning those books for which it does not have sure proofs from the witness of the first church.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/martin-chemnitz.html">Martin Chemnitz</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Examination of the Council of Trent</cite>, Part I, Topic on the Holy Scripture, Sec. VI</span></figcaption>

</figure><figure class="quote" id="q-4e6e6fd000" data-kw="apocrypha">
<blockquote><p>The Apocryphal books are so called not because the authors are unknown (for there are some canonical books whose authors are unknown and some apocryphal books whose authors are known); not because they could be read only in private and not in public (for some of them may be read even in public), but either because they were removed from the crypt (apo tēs kryptēs) (that sacred place in which the holy writings were laid up) as Epiphanius and Augustine think; or because their authority was hidden and suspected, and consequently their use also was secret since the church did not apply to them to confirm the authority of ecclesiastical doctrines (as Jerome says, ‘Praefatio in libros Salomonis’ from “Hieronymi Prologus Galeatus” in Biblia Sacra Vulgata Editionis Sixti V … et Celementis VIII [1865], p. lii); or, what is more probable, because they are of an uncertain and obscure origin (as Augustine says, CG 15.23* [FC 14:474]). Statement of the question.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/francis-turretin.html">Francis Turretin</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Institutes of Elenctic Theology</cite>, 2.9.1</span></figcaption>

</figure><figure class="quote" id="q-8d111793c1" data-kw="">

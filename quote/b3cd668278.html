<blockquote><p>40. The reformed churches believe also, and openly confess, the power and authority of emperors over their empires, of kings over their kingdoms, of princes and dukes over their dominions, and of other magistrates or states over their commonwealths and cities, to be the ordinances of God Himself appointed as well as to the manifestation of his own glory, as to the singular profit of mankind: and withal, that by reason of the will of God Himself, revealed in his Word, we must not only suffer and be content that those do rule which are set over their own territories, whether by hereditary or elective right, but also to love them, fear them, and with all reverence and honor embrace them as the ambassadors and ministers of the most high and good God, being in his stead, and preferred for the good of their subjects, to pour out prayers for them, to pay tributes to them, and in all business of the commonwealth which is not against the Word of God, to obey their laws and edicts. … 48. For to that end also is the holy Scripture profitable, to show which is the best manner of governing a commonwealth, and that the magistrate, as being Gods minister, may by this guiding star be so directed, as that he may execute the parts of his office according to the will of God and may perfectly be instructed to every good work…</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/george-gillespie.html">George Gillespie</a></span><span class="wk"><span class="lbl">Work:</span> <cite>One Hundred and Eleven Propositions concerning the Ministry and Government of the Church (1647; Edinburgh, 1844)</cite>, p. 12</span></figcaption>

<blockquote><p>§12. Question 7. May a true man promise money to a robber for the saving of his life or of a greater sum or more precious commodity? Answer: Yes, in case of necessity, when his life or estate cannot better be preserved: And so taxes may be paid to an enemy in arms, or to a plundering soldier (supposing that it do no other hurt which is greater than the good). Any man may part with a lesser good to preserve a greater: And it is no more voluntary or imputable to our wills than the casting of our goods into the sea to save the vessel and our lives.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/richard-baxter.html">Richard Baxter</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Christian Directory (London, 1673), pt. 4, ch. 19, title 2</cite>, p. 116</span></figcaption>

<blockquote><p>Controversy – Is God able not only to deprive an innocent creature of life but also to condemn them to the eternal tortures of hell? We deny against certain Scholastics. Arguments 1. All the ways of God should be mercy and truth to those who keep covenant (Ps. 25:10). 2. Anyone approaching God should believe that He will reward their obedience with a reward not condemn them (Heb. 11:6). 3. In an innocent creature there can be no consciousness of guilt or the just judgment of God, which is the meaning of punishment. 4. No glory to God could arise from this but rather the dishonor of a tyrannical lord. 5. The righteousness of God demands that He acquit the holy, but it does not permit him to condemn someone who has not merited it (Ps. 18:26-27, Gen. 18:25, Ps. 7:11). Objections 1. He can reduce the innocent to nothing. Reply. Then he only takes away what He gave, but punishment would be to do injury to someone while existing. 2. He acts this way with Christ. Reply. He was our surety, who took our debts on Himself. 3. God can impute to us the sin of Adam. Reply. That is imputed to be ours which is truly ours just as the children of slaves are slaves and the sons of citizens are citizens and are reputed to be such. 4. We are permitted to kill innocent creatures. Reply. 1. Not rational ones. 2. Irrational ones (bruta) for our use (2 Pet. 2:12). 3. It is one thing to kill, another to give to the living the highest punishment according to one’s pleasure.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/leonard-riissen.html">Leonard Riissen</a></span><span class="wk"><span class="lbl">Work:</span> <cite>A Complete Summary of Elenctic Theology &amp; of as Much Didactic Theology as is Necessary trans. J. Wesley White MTh thesis (Bern, 1676; GPTS, 2009), ch. 11, ‘Christ’</cite>, pp. 84-85, 112-13, 121-22</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/civil-government-and-society/the-civil-magistrate.html">The Civil Magistrate</a></span><span class="t"><a href="../topics/theology/faith-and-reason.html">Faith and Reason</a></span></div>

</figure><figure class="quote" id="q-5abffce96c" data-kw="">
<blockquote><p>…for the king and people are each of them above and below others in divers respects: the people, because they create the man king, they are so above the king, and have a virtual power to compel him to do his duty; and the king, as king, has an authoritative power above the people, because royalty is formally in him, and originally and virtually only in the people, therefore may he compel them to their duty, as we shall hear anon; and therefore there is no need of an earthly ruler higher than both, to compel both.</p></blockquote>

</figure><figure class="quote" id="q-4698f1b8ef" data-kw="">
<blockquote><p>And because the king being made a king leaves not off to be a reasonable creature, he must be under a law, and so his will and lust cannot be the rule of his power and dominion, but law and reason must regulate him. Now if God had given to the king a dominion over men as reasonable creatures, his power and dominion which by royalists is conceived to be above law, should be a rule to men as reasonable men, which would make men under kings no better than brute beasts, for then should subjects exercise acts of reason, not because good and honest, but because their prince commands them so to do; and if this cannot be said, none can be at the disposing of kings in politic acts liable to royal government, that way that the slave is in his actions under the dominion of his master.</p></blockquote>

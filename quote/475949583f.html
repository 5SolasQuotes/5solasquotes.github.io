<blockquote><p>19. Marriage is the individual conjunction of one man and one woman by lawful consent, for a mutual communion of their bodies, and society of life among themselves.</p></blockquote>

<blockquote><p>[1.] We do not speak of parents that are so far deprived of judgment, that they are not fit to determine this matter; nor, [2.] Such as have divested themselves of the natural affection of parents, and entertaining an ungrounded prejudice against some of their children, are endeavoring to expose them to ruin, that they may show more kindness to others. These forfeit that right, which is otherwise founded in nature. [3.] If parents, by refusing to comply with the desire of their children, plainly, in the judgment of the wisest of men, obstruct their happiness, and the glory of God herein. Or, if they have no reason for their not complying, or the reason given is contrary to the laws of God, or the common sense of all impartial judges; especially if the affair took its first rise from them, and afterwards they changed their mind, without sufficient ground. This, without doubt, lessens, or it may be so circumstanced, that it wholly takes away the charge of sin in the child, in acting contrary to the will of his parents, and fastens the guilt on them. [4.] The case is vastly different, when applied to children who are so far from being dependent on their parents, that they depend on them. Nevertheless, in this case, some deference and respect ought to be paid to them; and as it is the children’s duty, it may be their interest so to do; since we can hardly suppose, that parents, who depend on their children, would oppose their happiness, in an affair that is apparently contrary to their own interest, if they did not think that they had sufficient reason for it; which ought to be duly weighed, that it may be known, whether their advice is expedient to be complied with, or no. And if in this, or any other instance, children are obliged to act contrary to the will of their parents; they ought to satisfy them, that it is not out of contempt to their authority, but a conscientious regard to the glory of God; and that it is conducive to their happiness, in the opinion of the wisest and best of men.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/thomas-ridgley.html">Thomas Ridgley</a></span><span class="wk"><span class="lbl">Work:</span> <cite>A Body of Divinity</cite>, (1731; 1814), vol. 3, pp. 522-23, commenting on Westminster’s Larger Catechism</span></figcaption>

</figure><figure class="quote" id="q-f817ee7328" data-kw="">
<blockquote><p>But here appeareth a manifest reason why they gave particular commandment concerning things offered to idols, blood, and that which was strangled. They were, indeed, of themselves things indifferent; yet such as had some special thing in them more than other rites of the law. We know how straitly the Lord commandeth to eschew those things which are contrary to the external profession of faith, and wherein there is any appearance or suspicion of idolatry. Therefore, lest there should any blot of superstition remain in the Gentiles, and lest the Jews should see anything in them which did not agree with the pure worship of God, no marvel if, to avoid offense, they be commanded to abstain from things offered to idols.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/john-calvin.html">John Calvin</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Commentary on Acts</cite>, 15</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/civil-government-and-society/marriage-and-family.html">Marriage and Family</a></span></div>

</figure><figure class="quote" id="q-537c63a515" data-kw="">
<blockquote><p>The very ground of this assertion of master [Robert] Bellarmine’s [a Romanist], is that he thinks not the copulation of married folk to be of the substance of matrimony. And this he proves by some testimonies out of the fathers in that fifth chapter. But yet himself will not [have] that this his saying should be so understood as if that he said that the use of marriage is not any way of the substance of marriage. For afterwards he says that this their sacrament may have two respects. As it is made, and as it is continued. As it [is] made, that is, (if I be not deceived) as the mutual consent of parties joines them together by their promises, the consent expressed by such words, is the matter and form of their sacrament. And thus must we understand that common rule in their law, that consent makes marriages. And thus do the fathers understand that which they say concerning the substance of marriage to consist in the mutual consent: partly, because after such consent given, the parties are not free to change the choice which they have made: and partly because that even by God’s law, if parties after such consent given, should carnally know another, it was death for them so to do: which could not be, but because this their consent is after a sort the marriage itself.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/francis-bunny.html">Francis Bunny</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Truth &amp; Falsehood</cite>, … (London: Sims, 1595), ch. 19, ‘Of Matrimony, that it is not a Sacrament &amp; that it is Lawful for all’</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/civil-government-and-society/marriage-and-family.html">Marriage and Family</a></span></div>

quotes.github.io%2Fquote%2F537c63a515.html&amp;via=5Solas" target="_blank" rel="noopener">Share on X</a><a class="perma" href="../quote/537c63a515.html">Permalink</a><a class="src" href="https://reformedbooksonline.com/topics/topics-by-subject/family/marriage/#:~:text=The%20very%20ground%20of%20this%20assertion,after%20a%20sort%20the%20marriage%20itself&amp;text=The%20very%20ground%20of%20this%20assertion%20of%20master&amp;text=consent%20is%20after%20a%20sort%20the%20marriage%20itself" rel="noopener" target="_blank">Read it online · Reformed Books Online</a></div>

<blockquote><p>In Latin children are called pignora, that is pledges, as if I should say, a pledge of the husbands love to the wife, and a pledge of the wife’s love toward the husband: for there is nothing which does so knit love between the man and the wife, as the fruit of the womb… If a woman have many defects (as Leah had) yet this is the mends which she makes her husband to bring him children, which is the right wedding ring that seals and makes up as it were the marriage.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/henry-smith.html">Henry Smith</a></span><span class="wk"><span class="lbl">Work:</span> <cite>A Preparative to Marriage</cite>, (1591), pp. 97-98</span></figcaption>

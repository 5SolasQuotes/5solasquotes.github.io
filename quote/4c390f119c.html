<main class="wrap"><figure class="quote" id="q-4c390f119c" data-kw="">
<blockquote><p>You have state yourselves public witnesses for Jesus Christ, who profess to adhere to, and propagate his injured truths, and to commemorate with thankfulness the remarkable mercies, which he has bestowed on our Church and Nation, and to testify against and mourn over our own and our fathers’ fearful backsliding from that Covenanted work of Reformation once attained in our land. See that you be judicious, upright, constant and faithful in your profession. I now approach death heartily satisfied, with our excellent Westminster Confession of Faith, Catechisms and Form of Church Government, and cordially adhering to these Covenants, by which our fathers solemnly bound themselves and their posterity to profess the Doctrines and practice the duties therein contained. […] Study to see everything with your own eyes but never indulge and itch after NOVELTIES! Most of those which are now esteemed such, are nothing but OLD ERRORS which were long ago justly refuted, varnished over with some new expressions. If I mistake not the Churches are entering into a fearful cloud of apostacy and trouble! But he that endures to the end shall be saved. Be ye faithful unto death and Christ shall give you a crown of life.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/john-brown.html">John Brown</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The absurdity and perfidy of all authoritative toleration of gross heresy, blasphemy, idolatry, popery, in Britain. In two letters to a friend. In which the doctrine of the Westminster Confession of Faith relative to toleration of a false religion, and the power of the civil magistrate about sacred </cite>, (1780; Glasgow, 1803), xviii-xix.</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/the-church/schism-and-separation.html">Schism and Separation</a></span></div>

<blockquote><p>Vers. 22. Lay hands suddenly on no man; neither be partakers of other men’s sins: Keep thy self pure.

Precept 5. That he do not rashly receive any one into the sacred Ministry, without mature deliberation, and examination preceding, he do not lay hands (which was the sign of Ordination) upon any one: He gives two Reasons of it.

Neither] Reas. 1. Lest if he should ordain one unfitting, in this very thing he should communicate with him in his sins, and by consequence in his punishments.

Thy self] Reas. 2. Because thou oughtest to keep thy self pure from defilements; and therefore from the ordaining of an unworthy man; If happily the rest of the Presbytery at any time shall determine to admit an unfit man to the Ministry, or one that is not approved, keep thy self pure, neither consent thou, but labour by all means so to preserve purity and holiness, that thou keep off from all affinity with sin, as much as in thee lies. He explains the parts of this Precept in the two next following verses, the meaning of the latter part, of being himself pure, vers. 23. and shews the meaning of the former part, vers. 24.

Vers. 23. Drink no longer water, but use a little wine for thy stomach’s sake, and thine often infirmities.

As to the latter part of the Precept, of keeping himself pure; because the Apostle knew that Timothy by reason of his earnest endeavours after purity and chastity, had been injurious to his own health, therefore by the way he adviseth him, that he do not so understand the Precept of keeping himself pure, as to neglect his health and render himself unfit for the works of his Calling, but use an holy prudence, and in subduing his body, by drinking of water, to use a little wine as it were physically, and for the necessity of health, lest if he should proceed in not favouring his weak stomach, and his body labouring under often infirmities, immediately the tabernacle of his body should fall to decay, and the Church should be deprived of so profitable an instrument.

Vers. 24. Some men’s sins are open before hand, going before to judgement: And some men they follow after.

As to what concerns the meaning of the former part of the Precept, Lest he should partake of other men’s sins; he shews that he spake of open sins, which may be known, and avoided, not of private, which fall not under observation; and that he beware, lest he partake of other men’s sins, and in laying hands rashly on no man; he shews in this, that using examination, and trial, the open sins of any one that is unworthy may be known, as also the open virtues of men meet to be admitted to the Ministry of the Gospel.

For the sins of some Candidates of the Ministry are so manifest, that they prevent the examination and judgement of the Church, that they may easily be rejected. For before the judgement of the Church can determine about them, there is matter in readiness, in their open sins, for their condemnation, or rejection from the Ministry, by the opinion of the Ecclesiastical Senate: And the sins of others, upon examination premised, and the judgement of the Church concerning them being given, are brought forth into the light.

Vers. 25. Likewise also the good works of some, are manifest before-hand, and they that are otherwise cannot be hid.

In like manner the virtue of some that are Candidates to the Ministry, and their good works, are so manifestly known, that it is easy for the Church to judge them fit to be admitted. But the works of those that are otherwise, or upon examination had, and inquisition made, are not manifest, or so secret, that they cannot be known of men, they are to be left to God, nor can they long bee hid, but in their own time will be brought to light, that if the Church cannot prevent, but those hypocrites are admitted to the Ministry, yet care may be had, where they are already made manifest, that they be dealt with according to the Discipline of the Church.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/david-dickson.html">David Dickson</a></span><span class="wk"><span class="lbl">Work:</span> <cite>An exposition of all St. Paul’s epistles together with an explanation of those other epistles of the apostles St. James, Peter, John &amp; Jude: wherein the sense of every chapter and verse is analytically unfolded and the text enlightened</cite>, (London: Francis Eglesfield, 1659), p. 168.</span></figcaption>

<blockquote><p>3. The revelation alone exhibited in the sphere of nature cannot be salutary, nor has any mortal through it alone either been led to salvation or been able to be led.

4. To those therefore to whom the grace of superior revelation in the sphere of grace after sin introduced into the world has not been made, salvation was never destined by God: for the wise one does not will the end for him to whom he by no means grants the necessary means, without which it cannot come to pass that he should attain the end, when those can be had only by his giving.

5. And since the sphere of nature exhibits only τὸ γνωστὸν τοῦ θεοῦ [the knowledge of God], by no means indeed σοφίαν τοῦ θεοῦ ἐν μυστηρίῳ [the wisdom of God in mystery], that is, the Gospel, and doctrine concerning Christ the Savior and faith in him, who, without knowledge of Him who alone is the way, can come to life?

6. Therefore the revelation alone exhibited to sinners in the sphere of grace through God’s word can be salutary, which reveals both the actual expiation of sin, and the mode of it, and Him through whom it is expiated, and the means of applying that expiation to us.</p></blockquote>

<blockquote><p>The great Antichrist, is he, who under the name of Christ’s Vicar, persecutes him,

The Rules.

I. The name Antichrist belongs not to one person alone, but to a whole state or order of men, as it were in the same Kingdom succeeding each other.

Even as the word of High Priest. He is not then opposite to Christ, as one person is to another, in respect of substance, but he is opposite to him in respect of quality or office.

II. The Papists will have Antichrist to be one particular man; a Jew of the Tribe of Dan, the Jews Messiah, and the restorer of their Religion, who shall reign at Jerusalem three years and a half, shall fight with Henoch [Enoch] and Eliah [Elijah], shall offer to ascend to heaven from Mount Olivet, but shall be destroyed by Christ.

III. But we out of Scripture describe Antichrist thus. 1. That he is a man at one time, one; but in succession of time, an order of men; in the same state succeeding each other. 2. Raised by Satan. 3. A Christian in name only. 4. In very deed Christ’s Enemy. 5. Sitting in the Temple of God, as God. 6. Reigning in that great City, which ruleth over the Kings of the Earth. 7. Seducing the inhabitants of the Earth with laying wonders. 8. Setting a mark on his followers. 9. Full of idolatry, ambition, avarice, cruelty and impurity. 10. Revealed in the last times. 11. He shall be destroyed by the breath of Christ’s mouth, and shall be overthrown by his own lovers, and utterly abolished at Christ’s glorious coming.

Johannes Wollebius, The abridgment of Christian divinity, trans. Alexander Ross (3rd edn, London, 1660), pp 233-5.</p></blockquote>

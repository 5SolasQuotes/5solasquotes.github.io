<main class="wrap"><figure class="quote" id="q-165fdfecae" data-kw="">
<blockquote><p>Between theology and philosophy there is a very close and intimate connection. Consequently it becomes a matter of much importance to determine what value is to be attached, in preaching, to those branches of knowledge which belong more especially to the department of speculative thought. Theology begins where philosophy ends, — that which is ultimate to the one is fundamental to the other; of course this can refer only to that true philosophy which has always perfectly harmonized with Christianity, and proved in all ages a powerful auxiliary in the battle with untruth. There can be no doubt, however, that many of these speculations, esteemed eminently philosophical, have proved barren of useful results; and that the great system of Gospel truth exists wholly apart and independent of them.

The pulpit is a field from which Gospel hearers expect to gather the golden grain of living and eternal truth; not an arena to which they resort in order to be delighted by a display of mental gymnastics, or the fierce combats of intellectual gladiators. To feed with the dry husks of metaphysical speculations, those who are hungering and thirsting for the bread and water of life, is to dispense stones instead of bread — to give a serpent instead of a fish. To persons of ardent piety and spirituality of mind, such discussions are cold, cheerless, tasteless, absolutely intolerable — broken cisterns, clouds without rain, pits without water. Attendance upon them is the mere “toil of dropping buckets into empty wells, and drawing nothing up.”

The preacher’s views upon the origin of ideas, the limits of knowledge, the nature of virtue, the foundation of moral obligation, natural ability, freedom of the will, the existence and province of conscience, with many other similar and kindred questions, will necessarily exert a most important influence over his modes of thought and instruction. True it is, as someone has said, “tell me your view of the nature of virtue, and I will tell you to what school of theology you belong.” These topics force themselves upon our consideration. They are worthy of profound attention; but they are seldom, and many of them never, suitable themes for the pulpit. The scribe well instructed will not permit them to usurp the place of those grander and more momentous truths which constitute the burden of his message.

We must, however, be careful to draw the distinction between the use and abuse of metaphysical power and knowledge in the preacher. All truly great preachers, we imagine, have been, to a great extent, metaphysicians; they betray profound acquaintance with the philosophical systems of the day, great knowledge of the human mind, and capacity to turn such knowledge to account in the detection and overthrow of error, and in the elucidation and establishment of truth. Of this Calvin, Howe, Edwards, Hall, Chalmers, are eminent examples.

In this age, when old errors are appearing in so many and varied forms—old, dead, and long-since buried philosophies raised from the grave, their bones scraped, re-washed, and presented anew to the world, —acquaintance with the great systems of speculative thought, both of belief and unbelief, appears an essential element of ministerial qualification.

He who knows little or nothing of Spinoza, Des Cartes, Locke, Hume, Kant, Hamilton, Comte, Fichte, Hickok, &amp;c., may be a very good practical preacher, perhaps—whatever that may mean; but can scarcely be esteemed a competent defender of the faith. Such knowledge, however, will always be held subservient to the one great end—the establishment of the truth, as it is in Christ,—“as the vessels of the Egyptians were dedicated to sacred purposes by the Israelites.”

Philosophy, like science, must wait at wisdom’s gates. “Stand thou here, while I go there and worship.</p></blockquote>

</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-3e46f87690" data-kw="">
<blockquote><p>It is true that charity is twisted into vice when a man has become too hostile to reason and has cast it from its throne under the pretext of religion. Indeed, many matters hotly disputed today in this cause of truth turn aside and degenerate into wranglings about phrases and terms. In recent years [Samuel] Werenfels, who adorns the academy of Basel, published the most beautiful little book on contests over words, to which if one would add all the ways people everywhere sin in this regard, into how vast a volume would it grow? If anyone finds fault with any use of human reason in theology, he must be banished from human society into the company of brute beasts. Indeed, the Sacred Letters were written for men, not beasts.

The Reformed Church from its earliest beginnings has thought differently, and by countless examples has shown how much she has accomplished with the assistance of a sober and modest philosophy. For this reason in all its schools it created philosophers as much as theologians, just as the wise mistress depends on the help of her handmaids.</p></blockquote>

<blockquote><p>While Thomas Aquinas strongly resisted the blasphemous notion that God had the power to do things contrary to his nature (such as sin and lie), he did not adhere to the other erroneous view that divine omnipotence was restricted to what God actually does:

[I]f we consider his power absolutely, he can do other things besides those that are subject to his providence or operation: but he cannot do what has been eternally contained in the order to his providence, because he is unchangeable. Through failing to observe this distinction some have fallen into various errors. Some in an endeavour to extend to things themselves the unchangeableness of the divine order, said that all things must of necessity be as they are; so much so, that some declared that God is unable to do except what he does. Against this we have the words Matth. 26:53: Cannot I ask my Father, and he will give me presently more than twelve legions of angels?</p></blockquote>

<blockquote><p>…views like Ockham’s prefigured themes that would come to define modern philosophy, and modern civilization more generally. The idea that only particular individual things exist and share no universal natures in common… Aristotelian metaphysics involves a number of complex distinctions which require for their expression an equally complex technical vocabulary; and this complexity only grew as Aquinas and other Aristotelian Scholastic philosophers of the Middle Ages developed Aristotle’s views further. This is unfortunate for the student of philosophy, but unavoidable given that the real world just is, Aristotelians would say, as complex as the vocabulary needed to describe it. But suppose that we interpreted this vocabulary in terms of a nominalist or conceptualist metaphysics, rather than a realist one. Then all those complicated technicalities would reflect, not objective reality, but only our subjective ideas or the way we decided to use words. The Scholastic philosophy that inherited this terminology would come to seem an exercise in mere wordplay and irrelevant hair-splitting, rather than a serious investigation of the real world. And that is exactly what happened as views like Ockham’s started to proliferate within Scholasticism. The early modern philosophers who rejected Aristotle and his Scholastic successors as mere sophists…</p></blockquote>

<div class="actions"><button class="copy" data-copy="“…views like Ockham’s prefigured themes that would come to define modern philosophy, and modern civilization more generally. The idea that only particular individual things exist and share no universal natures in common… Aristotelian metaphysics involves a number of complex distinctions which require for their expression an equally complex technical vocabulary; and this complexity only grew as Aquinas and other Aristotelian Scholastic philosophers of the Middle Ages developed Aristotle’s views further. This is unfortunate for the student of philosophy, but unavoidable given that the real world just is, Aristotelians would say, as complex as the vocabulary needed to describe it. But suppose that we interpreted this vocabulary in terms of a nominalist or conceptualist metaphysics, rather than a realist one. Then all those complicated technicalities would reflect, not objective reality, but only our subjective ideas or the way we decided to use words. The Scholastic philosophy that inherited this terminology would come to seem an exercise in mere wordplay and irrelevant hair-splitting, rather than a serious investigation of the real world. And that is exactly what happened as views like Ockham’s started to proliferate within Scholasticism. The early modern philosophers who rejected Aristotle and his Scholastic successors as mere sophists…”

<blockquote><p>Let your theologians [O Stapleton] dispute as much as they will that it is the least of all sins, and less than any venial one: what else do they reveal to all but their singular ignorance? If it is so minimal that it ought to be considered less than even any venial sin, then it cannot even be a sin, because what is less than venial is not to be placed among sins, since no sin is less than venial. Do you think Thomas felt this, when he writes that original sin is greater extensively than actual sin, but intensively less, because the actual has more of the nature of the voluntary (Thomas, in pt. 1 of 2, q. 82, art. 2)? If that reason does not deceive, they did rightly who placed it below any venial sin whatsoever, since in the slightest sin there is more of the voluntary than in the original, unless we are understood to have willed in Adam.</p></blockquote>

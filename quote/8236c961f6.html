<main class="wrap"><figure class="quote" id="q-8236c961f6" data-kw="">
<blockquote><p>By it [repentance unto life] a sinner, out of the sight and sense, not only of the danger, but also of the filthiness and odiousness of his sins, as contrary to the holy nature and righteous law of God, and upon the apprehension of his mercy in Christ to such as are penitent, so grieves for and hates his sins, as to turn from them all unto God,[c] purposing and endeavouring to walk with him in all the ways of his commandments.[d] [c] Ezek. 18:30,31. Ezek. 36:31. Isa. 30:22. Ps. 51:4. Jer. 31:18,19. Joel 2:12,13. Amos 5:15. Ps. 119:128. 2 Cor. 7:11. [d] Ps. 119:6,59,106. Luke 1:6. 2 Kings 23:25.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/westminster-assembly.html">Westminster Assembly</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Confession of Faith</cite>, 15.2</span></figcaption>

<blockquote><p>V. Restoration or restitution, in the case of a lapse, or of prolonged custom in some sin, or of spiritual relapse—which can be called a kind of second regeneration and specifically a renovation (Galatians 4:19; 2 Corinthians 2:7–8). Problem I. Whether in such a case the habits were diminished, or rather only the acts impeded? Eighteen years ago we inclined to the affirmative of the latter, and we wiped away the cavils of the Remonstrant darkener against this our assertion in the Thersites Heautontimorumenos [Thersites the Self-Tormentor]. Nor did any of the most distinguished theologians who attested in letters sent to me that they had read that writing see anything heterodox in it. Problem II. Whether the habit is restored through infusion or apposition of a degree or augmentation, which happens at once and simultaneously through the practice of renewed faith and repentance; or rather gradually and successively through frequent and repeated actions? [No answer is given in the English]</p></blockquote>

<blockquote><p>[Arminian Error:] 7. That man’s conversion is properly nothing but the act of believing the promise of grace. This restraint of our conversion unto so narrow a compass as first to bring it from the habit [inward power] of faith to the act of believing, and then to appropriate it to that act without so much as once mentioning any other graces: this narrow conceit touching our conversion is that which has filled the writings of many learned about this point with much darkness and confusion. They so speak and write of conversion as if it began in that one and only action of man’s will consenting to the promise of mercy in Christ. But this is without all ground. To convert is not only to believe, but to repent, to love God and our neighbor, to abstain from every evil way, to practice all duties of piety and goodness: these acts are as proper and immediate parts of true conversion, as faith. Nor does the Scripture so much as intimate any such limitation, as to appropriate our conversion to the act of faith: nay, tis manifest that the Scriptures when they speak of man’s turning unto God, do join repentance and other godly acts together with faith: as appears by that solemn invitation of men unto God, ‘Repent and believe the Gospel,’ so often used in the New Testament.</p></blockquote>

<div class="actions"><button class="copy" data-copy="“[Arminian Error:] 7. That man’s conversion is properly nothing but the act of believing the promise of grace. This restraint of our conversion unto so narrow a compass as first to bring it from the habit [inward power] of faith to the act of believing, and then to appropriate it to that act without so much as once mentioning any other graces: this narrow conceit touching our conversion is that which has filled the writings of many learned about this point with much darkness and confusion. They so speak and write of conversion as if it began in that one and only action of man’s will consenting to the promise of mercy in Christ. But this is without all ground. To convert is not only to believe, but to repent, to love God and our neighbor, to abstain from every evil way, to practice all duties of piety and goodness: these acts are as proper and immediate parts of true conversion, as faith. Nor does the Scripture so much as intimate any such limitation, as to appropriate our conversion to the act of faith: nay, tis manifest that the Scriptures when they speak of man’s turning unto God, do join repentance and other godly acts together with faith: as appears by that solemn invitation of men unto God, ‘Repent and believe the Gospel,’ so often used in the New Testament.”

— William Pemble, Vindiciæ gratiæ. = A Plea for Grace, More especially the Grace of Faith… (London: 1627), p. 135">Copy</button><a class="share" href="https://x.com/intent/post?text=%E2%80%9C%5BArminian+Error%3A%5D+7.+That+man%E2%80%99s+conversion+is+properly+nothing+but+the+act+of+believing+the+promise+of+grace.+This+restraint+of+our+conversion+unto+so+narrow+a+compass+as+first+to+bring+it+from+the+habit+%5Binward+power%5D+of+faith+to+the+act+of+believing%2C+and+then+to+appropriate+it+to+that+act+without+so+much+as+once+mentioning+any+other+graces%3A+this+narrow+conceit+touching+our+conversion+is+that+which+has+filled+the+writings+of+many+learned+about+this+point+with+much+darkness+and+confusion.+They+so+speak+and+write+of+conversion+as+if+it+began+in+that+one+and+only+action+of+man%E2%80%99s+will+consenting+to+the+promise+of+mercy+in+Christ.+But+this+is+without+all+ground.+To+convert+is+not+only+to+believe%2C+but+to+repent%2C+to+love+God+and+our+neighbor%2C+to+abstain+from+every+evil+way%2C+to+practice+all+duties+of+piety+and+goodness%3A+these+acts+are+as+proper+and+immediate+parts+of+true+conversion%2C+as+faith.+Nor+does+the+Scripture+so+much+as+intimate+any+such+limitation%2C+as+to+appropriate+our+conversion+to+the+act+of+faith%3A+nay%2C+tis+manifest+that+the+Scriptures+when+they+speak+of+man%E2%80%99s+turning+unto+God%2C+do+join+repentance+and+other+godly+acts+together+with+faith%3A+as+appears+by+that+solemn+invitation+of+men+unto+God%2C+%E2%80%98Repent+and+believe+the+Gospel%2C%E2%80%99+so+often+used+in+the+New+Testament.%E2%80%9D%0A%0A%E2%80%94+William+Pemble%2C+Vindici%C3%A6+grati%C3%A6.+%3D+A+Plea+for+Grace%2C+More+especially+the+Grace+of+Faith%E2%80%A6+%28London%3A+1627%29%2C+p.+135&amp;url=https%3A%2F%2F5solasquotes.github.io%2Fquote%2Ff168bae878.html&amp;via=5Solas" target="_blank" rel="noopener">Share on X</a><a class="perma" href="../quote/f168bae878.html">Permalink</a><a class="src" href="https://reformedbooksonline.com/on-conversion/#:~:text=Arminian

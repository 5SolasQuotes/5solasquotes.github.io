<blockquote><p>From this, these things we posit, saying: 1. God seriously wills, that is, He loves, approves and by an act of complacency He lifts up for the obedience of reprobates, insofar as it is a good and holy thing, whether the obedience may come forth by the act, or not… … 5. For God to intend and decree the death of a sinner, and for God not to delight in the death of a sinner, as He swears in Eze. 33:11, are in no way contradictions.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/samuel-rutherford.html">Samuel Rutherford</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Exercise 2, ‘Of Notions of the Divine Will’, ch. 1, ‘Of God’s Revealed Will [Signi] and His Will of Good-pleasure’ in Apologetic Exercises for Divine Grace (Amsterdam, 1636; 1651), pp. 213-238</cite>, p. 232-233</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/attributes-of-god/will-of-god.html">Will of God</a></span></div>

</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-06dacfd041" data-kw="">
<blockquote><p>And so in all the commandments of God, we must understand the will of God to be either (Zanchi, Of the Nature of God, ch. 3): 1. Declarans [declaring] 2. Efficiens [effecting] The first is that which shows what should be done, and so the Law is called doctrina, a rule which shows us what pleases or displeases God. The second is that which causes us to do what is pleasing to Him, and so the Law is called mandatum [a commandment], when He makes the elect to walk in his paths (Eze. 11:20), or works faith in their hearts to believe in Christ. The 1. may be broken by the wicked. The 2. cannot: ‘For my counsel shall stand, and my will shall be done, says the Lord.’ (Isa. 46) But then it may be objected that the wicked sin not, because they do not break or do any thing against the absolute and proper will of God. I answer: That sin is not defined to be the transgressing of the secret will of God which cannot be broken, but of his declared and revealed will (Zanchi, bk. 3, ch. 4, Of the Nature of God), which only shows what is pleasing or displeasing to Him. Hereby then you see the will of God is only one, immutable and unchangeable, and that although He gives his Law unto all, yea, both legem operandi and lege credendi [the law to be worked and the law to be believed], to show what should be done and what should be believed; yet it is not his absolute will that all men should either do or believe the same, that they might be saved. For if it were, who could resist it? (Rom. 9:19)</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/william-griffith.html">William Griffith</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Delights of the Saints… (London: Butter, 1622), pt. 1, pp. 15-16 Gryffith (c.1589–1672) was an Anglican bishop, opposed to the puritans.</cite></span></figcaption>

</figure><figure class="quote" id="q-66bdb9a034" data-kw="">
<blockquote><p>[I] This is called his [Greek] (Acts 2:23), Determined purpose, [Greek] (Acts 4:28), The hand and counsel of God; [Greek] (Eph. 1:9), The good pleasure of God and Gods eternal providence. (Now this is called his eternal providence, that it may be distinguished from actual providence, which is nothing else but the execution of God’s decrees.) II. This is called, the Will of God, or The will of his good pleasure. Indeed the decree is the very will of God; yet for our better understanding, the will is considered as the cause efficient, the decree is the effect. Now whereas this word ‘will’ is taken diversely, it is diverse ways distinguished by divines, to wit, into the will of his good pleasure and the will of the sign; into an antecedent and consequent; into absolute, and conditional; into secret and revealed. But these are not real distributions of the divine will, but distinctions only of the name: For to speak properly, there is in God but one only will, which is called the will of his good pleasure, because out of his most free good pleasure He has decreed what shall be done: It is called also his antecedent will because it had existence before any creature and from eternity with God it was established: It is named also absolute, because it depends upon God’s good pleasure and not from the things which are done in time. Lastly it is called secret, because in respect of priority it is known neither to men nor angels. But these things are improperly styled by the name of divine will which are comprehended in that ordinary verse: Praecipit, et prohibet, promittit, consulit, implet: “Commands, forbids, promises, consults, fulfills.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/johannes-wolleb.html">Johannes Wolleb</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Abridgment of Christian Divinity... (d. 1629; London: Mabb, 1660), bk. 1, ch. 3, Concerning the Works of God &amp; the Decrees of God in General, The Rules</cite>, pp. 33-37</span></figcaption>

<blockquote><p>673. Eze. 18:23; 33:11, ‘God will not the death.’ ‘He has no pleasure in the death of the wicked.’ Rom. 9:18, ‘He has mercy on whom He will, and whom He will he hardens.’ God will not the death of a sinner by his antecedent will, but by his consequent will, or his justice; because he justly punishes him who rejects the grace of God offered unto Him. He hardens therefore permissively, not affectively. 674. Eze. 18:23, ‘I will not the death of him that dies. Ch. 3:18, ‘Thou shalt die the death.’ God as our Father will not by the Gospel, but as He is our judge and revenger, He will by the Law, that a sinner shall die.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/johannes-thaddaeus.html">Johannes Thaddaeus</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Reconciler of the Bible… (London: Miller, 1662) | Ezekiel</cite></span></figcaption>

<blockquote><p>Again, some school-divines following Damascene make and ascribe to God an applied or depending [consequent] will, on this manner: God for his part [antecedently] would have all men without exception to be saved: why then are they not saved? They themselves will not. And because they will not, God therefore [consequently] chooses some and refuses others. But according to the former doctrine, I take this kind of applied will to be an invention of man’s brain. For the contrary is the truth, namely that man’s will wholly depends on the will of God. That vessels be some of honor, some of dishonor, it is not in the power of the clay, but in the will of the potter. The first cause orders the second, and not the second the first. To make God’s will depend on man’s will, is to put God out of his throne of majesty, and to set the creature in his room. Others set forth the depending will of God on this manner: God (say they) decrees nothing in particular of things that are casual and contingent, but He foresees within Himself what the will of the creature will do or not do, when things are thus or thus ordered: and upon this foresight He consequently determines what shall be done. (Bellarmine, bk. 4, ch. 15, Of Grace &amp; Free Will; Richard Tapper) But this opinion, as it gives unto God a common or general providence, so it takes away the certain determination of God touching all particular events. And it is absurd to think that God should foresee the future acts of man’s freewill, when as yet He has determined nothing: for things that shall be, are therefore to come to pass, because God by decree has determined their being. And therefore the foreknowledge of things that shall be follows the decree of God.</p></blockquote>

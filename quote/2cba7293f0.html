<blockquote><p>The Lutherans teach, and that rightly, that in death the soul of Christ was truly and really separated from His body, and that locally (although some expressly deny the same: as I have shown in the Exercitation). At the same time, they also teach, that, because of the personal union, His soul and body were necessarily wherever His divinity was. Graver in the supplement to article 3 of the Confessionis Augustanæ. Whence it follows, that His soul was not able to be separated locally from His body. For, as His divinity was not able to be separated from His body or soul: because it was everywhere: so neither was His body absent from His soul, nor His soul from His body, locally, that is, distant by an interval of space: because the soul of Christ was no less everywhere, than His divinity, nor was His body any less everywhere. But from this net Meisner attempt to extricate himself, Quæstionibus Vexatis 2, §32. Christ, says he, was truly dead, and so, where His body was, there His soul was not, on account of the natural separation made: but, nevertheless, these two, of which the one was physically and locally distant from the other, were not distant from each other hyperphysically and in the λόγῳ/Logos: since His hypostasis is infinite, illocal, indivisible, indistant. He says that this is a great mystery. Whence he orders the Calvinists to learn, that the mode of natural presence is one thing, of personal presence another: and that one thing is able to be present with another and to be absent from it in different respects, without ἀντιφάσει/contradiction. The argument, whereby he concludes this great mystery, and in the answering of which he wishes us to be exercised, is of this sort: Whatever things in the altogether simple λόγῳ/Logos are indistantly (ἀδιαστάτως, without distance, from each other) united; those in that third, in which (ἀδιαστάτως, without distance, from each other) they are united and subsist, are altogether present to each other. But the soul of Christ in the heavens, and the body of Christ on earth, which are naturally and locally most distant, in the perfectly simple and indistant λόγῳ/Logos, were united (ἀδιαστάτως, without distance, from each other). Therefore, the soul of Christ in the heavens, and the body of Christ on earth, which are naturally and locally most distant, were altogether present to each other in the hypostasis of the λόγου/Logos. And so the body and soul were able to be separated, although each was everywhere. Response: No laborious exercise is needed. We deny the minor, which Meisner was obliged clearly to prove, not to assume without demonstration. Indeed, the body and soul of Christ, at the time of His death, were united to the λόγῳ/Logos, but were not united with each other ἀδιαστάτως, without distance: seeing that they were at an incredible distance from each other. But, says our opponent, what things are united to a single, altogether simple, indivisible, and indistant third thing; those are united and present to each other (ἀδιαστάτως, without distance). Response: If that third altogether simple and indivisible thing be finite, we grant what our opponent maintains: but, if it be infinite and omnipresent, united to which were the body and soul of Christ at the time of His death, we do not at all grant it. The falsity is perfectly evident. Elijah and I are united to a third, altogether simple, indivisible, indistant, namely, God. But, who would say, that I, existing on the earth, am present by substantial proximity to Elijah, existing, not on earth, but in heaven? Therefore, the mystery vanishes. That personal presence, whereby body and soul, being locally separated by the whole heaven, were nevertheless altogether present to each other ἀδιαστάτως, without distance, in the λόγῳ/Logos, is not a great mystery, but a great and contradictory fiction. We turn that argument back upon our opponents. What in substance is everywhere, that is absent from no place with respect to essence or substance. But the soul of Christ, in the death of Christ, because of the union with the λόγῳ/Logos (according to the Lutheran hypothesis), in substance was everwhere. Therefore, the soul of Christ was absent from no place with respect to its substance: and by consequence, it was also in its body, and was united to it ἀδιαστάτως, without distance, and so was not separated from it: which the Suebi maintain: but Meisner with other Lutherans does not maintain it, against the Lutheran hypotheses.</p></blockquote>

<blockquote><p>Theodoret does rightly and truly tell us that even the common people are hardly accustomed to speak any otherwise [about Christ’s person and his natures]: for if Peter speak, who would not rather say that Peter speaks, than say that Peter’s body or tongue speaks? and yet notwithstanding, neither does Peter’s mind, nor his foot nor any other member speak, but his tongue or mouth. But because these things have even personally grown up (as it were) together [in the Logos’s assumption of human nature], and are come into one subsistence or being, that is truly in the concrete attributed to, and spoken of the whole, which if it were uttered of the parts of the whole considered severally and by themselves, should be falsely spoken. What more? By reason of this personal union [between a person and his nature], though now it be dissolved through death, Peter shall be said to have died and sat [buried] at Rome, whose soul yet notwithstanding, neither is dead, neither anywhere placed upon the earth. So when I say [that] the eternal Son of God died, I consider and mean Him as He is whole-Christ, although I denominate Him after one of his natures, to wit, his mortal or human nature. So again I say [that] this man forgives sins, and yet not as He is man of Himself (for it belongs only to God to forgive sins), but because He is God and man in one person together.</p></blockquote>

— Theodore Beza, Two Very Learned Sermons of Mr. Beza, together with a Short Sum of the Sacrament of the Lord’s Supper… (London, 1588), ‘The First Homily… 1574’, pp. 38-9">Copy</button><a class="share" href="https://x.com/intent/post?text=%E2%80%9CTheodoret+does+rightly+and+truly+tell+us+that+even+the+common+people+are+hardly+accustomed+to+speak+any+otherwise+%5Babout+Christ%E2%80%99s+person+and+his+natures%5D%3A+for+if+Peter+speak%2C+who+would+not+rather+say+that+Peter+speaks%2C+than+say+that+Peter%E2%80%99s+body+or+tongue+speaks%3F+and+yet+notwithstanding%2C+neither+does+Peter%E2%80%99s+mind%2C+nor+his+foot+nor+any+other+member+speak%2C+but+his+tongue+or+mouth.+But+because+these+things+have+even+personally+grown+up+%28as+it+were%29+together+%5Bin+the+Logos%E2%80%99s+assumption+of+human+nature%5D%2C+and+are+come+into+one+subsistence+or+being%2C+that+is+truly+in+the+concrete+attributed+to%2C+and+spoken+of+the+whole%2C+which+if+it+were+uttered+of+the+parts+of+the+whole+considered+severally+and+by+themselves%2C+should+be+falsely+spoken.+What+more%3F+By+reason+of+this+personal+union+%5Bbetween+a+person+and+his+nature%5D%2C+though+now+it+be+dissolved+through+death%2C+Peter+shall+be+said+to+have+died+and+sat+%5Bburied%5D+at+Rome%2C+whose+soul+yet+notwithstanding%2C+neither+is+dead%2C+neither+anywhere+placed+upon+the+earth.+So+when+I+say+%5Bthat%5D+the+eternal+Son+of+God+died%2C+I+consider+and+mean+Him+as+He+is+whole-Christ%2C+although+I+denominate+Him+after+one+of+his+natures%2C+to+wit%2C+his+mortal+or+human+nature.+So+again+I+say+%5Bthat%5D+this+man+forgives+sins%2C+and+yet+not+as+He+is+man+of+Himself+%28for+it+belongs+only+to+God+to+forgive+sins%29%2C+but+because+He+is+God+and+man+in+one+person+together.%E2%80%9D%0A%0A%E2%80%94+Theodore+Beza%2C+Two+Very+Learned+Sermons+of+Mr.+Beza%2C+together+with+a+Short+Sum+of+the+Sacrament+of+the+Lord%E2%80%99s+Supper%E2%80%A6+%28London%2C+1588%29%2C+%E2%80%98The+First+Homily%E2%80%A6+1574%E2%80%99%2C+pp.+38-9&amp;url=https%3A%2F%2F </figure><figure class="quote" id="q-04da18c64a" data-kw="">
<blockquote><p>Certainly from one perspective, as a creature and as man, it seems that He [Christ] cannot be exempted from the moral government of God, nor otherwise could He as a man have merited anything for Himself. From another perspective, if He were in Adam under the covenant of nature, then it would seem that in and with Adam who sinned, He violated that same covenant, which is beyond absurd. Therefore it seems most safe to state: although as a rational creature He cannot be exempted from moral government with respect to his natural duties, yet He could have been withdrawn by God from the same moral governance in the positive duties, such as the commandment not to eat of the forbidden fruit (upon the transgression of which the sin of the human race hangs).</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/petrus-van-mastricht.html">Petrus van Mastricht</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Theoretical Practical Theology</cite>, (RHB), vol. 3, bk. 3, ch. 12, section 9, ‘Was it [the CoW] also entered into with the second Adam?’</span></figcaption>

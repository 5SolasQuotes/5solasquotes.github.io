<blockquote><p>In substance, the lex moralis [moral law] is identical with the lex naturalis [natural law], but, unlike the natural law, it is given by revelation in a form which is clearer and fuller than that otherwise known to the reason.</p></blockquote>

</figure><figure class="quote" id="q-e89aa0b540" data-kw="">
<blockquote><p>…what is meant by the Law of Nature. To wit, that Law which God writes and imprints in the nature of man, so that it is as it were connatural and born together with man (Zanchi, bk. 1, Of the Law of God, thesis 8, col. 190). Now if we consider what law was written in the nature of man in his first creation, it was no other than the Decalogue or the Moral Law (Amandus Polanus, System, bk. 6, ch. 9, col. 49; D. Pau. Explic. Catech., pt. 3, question 92, p. 503). But the Law which we are here to enquire of is that law, which after the Fall, God still writes in the heart of every man: which (we all know) comes far short and wants much of that which was written in the heart of man before his Fall… For that law which is simply called jus naturale is innatum, and lays before the minds of men that way, wherein by the guidance and conduct of nature, they may be led to that good which is in the end proportionate to nature (Francis Junius, On the Mosaic Polity).</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/george-gillespie.html">George Gillespie</a></span><span class="wk"><span class="lbl">Work:</span> <cite>A Dispute Against the English-Popish Ceremonies</cite>, … (1637), Part 3, ch. 9, ‘That the lawfulness of the [English-Popish] ceremonies, cannot be warranted by the Law of Nature’, p. 197</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/civil-government-and-society/natural-law-and-civil-law.html">Natural Law and Civil Law</a></span></div>

</figure><figure class="quote" id="q-067e38576a" data-kw="">
<blockquote><p>It is an indispensable duty to forgive; we are not bound to trust an enemy, but we are bound to forgive him… It is with going to law as it is with going to war; when the just rights of a nation are invaded, it is lawful to go to war; so when a man’s estate is trespassed upon by another, he may go to law to recover it. But the law must be used in the last place; when no entreaties or arbitrations will prevail, then the chancery must decide it. Yet this is no revenge, it is not so much to injure another, as to right one’s self, which may be, and yet we may live in charity.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/thomas-watson.html">Thomas Watson</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Lord’s Prayer</cite></span></figcaption>

</figure><figure class="quote" id="q-a7deb7955d" data-kw="">
<blockquote><p>But our [prelate] doctors will have the commandments-positive of men to stand [upon the Church of Scotland], and the commandments of God, which are expressly of the law of nature to fall before their Dagon, and to lose all obligatory power, whereas God’s own positive-law yields, and loses obligatory power, when God’s natural commandment of mercy comes in competition with it, as is clear as the noon-day, in David famishing, who eat[s] the showbread, which by a positive law, was not lawful to any save the priests only, to eat, yet must man’s law stand and God’s law of nature fall at the pleasure of these Doctors.</p></blockquote>

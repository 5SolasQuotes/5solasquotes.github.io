<main class="wrap"><figure class="quote" id="q-bc0effdd91" data-kw="">
<blockquote><p>And so that immediate and per se motion of the first cause upon the secondary cause is, so to speak, the secondary cause’s own and natural motion, absorbed into its very being and operation — so that in the common and accepted view, both causes operate through one single and individual action, and nothing is done by one that is not done by the other. Therefore it is not to be thought that the contingent and free mode of acting of the secondary cause is overturned or destroyed by the pure concurrence of the first cause antecedent in nature to the concurrence and determination of the secondary cause — since this is intimately absorbed into the very nature of the secondary cause itself. I speak plainly. To be determined by God is as much as to be determined by itself, since that determination pertains to the natural mode of operating of the secondary cause. This is urged and explained: because that antecedence of nature, since it is not a real priority, nor one of time, nor of a temporal instant, posits and imprints nothing antecedently in the secondary cause before it operates. Rather, it is a priority altogether conjoined with the action of the secondary cause, such that they exist simultaneously and operate in the same instant of time. The priority of nature is only on the side of the first cause, by reason of the subordination and dependence of the secondary cause upon the first — which all call consequential subsistence — so that just as the secondary cause depends upon the first in being, so also it depends upon it in operating. Thus it is true to say: the secondary cause operates because God operates, and not the converse…</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/francisco-macedo.html">Francisco Macedo</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Collations of the Teachings of St. Thomas &amp; Scotus, with the Differences between the Two: with the Texts of Both Faithfully Presented, and the Sentences Subtly Examined, with the Commentaries of the Interpreters</cite>, … vol. 2 tr. AI by Vertias (Padua: Frambotti, 1671), , bk. 2, Collation 9, pp. 361-429 | Macedo &amp; Scotus’s View, p. 409</span></figcaption>

<blockquote><p>[Thomas:] ‘God is the first cause moving both natural causes and voluntary causes; and just as by moving natural causes He does not take away the fact that their acts are natural, so by moving voluntary causes He does not take away the fact that their actions are voluntary, but rather brings this about in them — for He operates in each according to its property.&#x27;</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/francisco-macedo.html">Francisco Macedo</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Collations of the Teachings of St. Thomas &amp; Scotus, with the Differences between the Two: with the Texts of Both Faithfully Presented, and the Sentences Subtly Examined, with the Commentaries of the Interpreters</cite>, … vol. 2 tr. AI by Vertias (Padua: Frambotti, 1671), , bk. 2, Collation 9, pp. 361-429 | Thomas’s Position, pp. 425-26</span></figcaption>

</figure><figure class="quote" id="q-7b8d5182a4" data-kw="">
<blockquote><p>It becomes us, as Christ’s example goes before us, to submit in the hardest and most bloody providences, to the straight and holy will of God:

1. Christ presses He has no will divided from God’s will; He lays down his glory, his heaven, his life, his fruition of the sweet influence of an highest vision, love, presence, feeling of God in a personal union at the feet of God, that the Lord may carve and cut and dispose of Him and his blood as He thought good.

2. All the difficulty in us, in whom dwells a body of sin is to answer the objections that flesh and blood has against a sad providence, which I will labor to do, and then give some rules for direction.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/samuel-rutherford.html">Samuel Rutherford</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Christ Dying &amp; Drawing Sinners to Himself</cite>, pp. 141-58 of Christ Dying &amp; Drawing Sinners to Himself (London: 1647) Including answering 9 objections and giving 13 rules, p. 141</span></figcaption>

</figure><figure class="quote" id="q-b4af681b72" data-kw="Author of sin">
<blockquote><p>The influences of divine providence concur with every action, be it what it may, as an action, since all live, and move, and have their being in God; every action, as an action, is from God; but the obliquity, irregularity, and sinfulness of the action, is from the creature: wherefore God is not the author of any sin.</p></blockquote>

</figure><figure class="quote" id="q-aee029b880" data-kw="Author of sin Free Will">

<blockquote><p>Commend the way of God and religion to others, and encourage good motions where ye can perceive them. Grace is communicative for the honour of God; and every gracious person is disposed to propagate religion.

Hence said the Lord of Abraham, Gen. xviii. 19, “I know him, that he will command his children, and his household after him, and they shall keep the way of the Lord, to do justice and judgment,” &amp;c. The wearing out of that so much now, from what it was in former years, is one of the black symptoms of the decay of religion at this day.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/thomas-boston.html">Thomas Boston</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Peculiar Mercy and Business of Life, Opened Up, and Applied (1727) in The Works of Thomas Boston</cite></span></figcaption>
<div class="meta"><span class="t"><a href="../topics/civil-government-and-society.html">Civil Government and Society</a></span></div>

<blockquote><p>First, the vow must be possible of fulfilment and within our power to perform. For who will vow an impossible thing? Or who will demand it? All vows are therefore described in the Scriptures in terms that are within our power, such as to give God cattle, sheep, houses, land, and so on. Now, chastity is not in our power, as little as are God’s other wonders and graces. But we are all made for marriage, as our bodies show and as the Scriptures state in Gen., ch. 2: “It is not good that man should be alone; I will make him a help meet for him.”

Whoever, therefore, considers himself a man and believes himself to be included in this general term should hear what God, his Creator, here says and decrees for him: he does not wish man to be alone but desires that he should multiply, and so he makes him a helpmeet to be with him and help him so that he may not be alone. This is the Word of God, through whose power procreative seed is planted in man’s body and a natural, ardent desire for woman is kindled and kept alive. This cannot be restrained either by vows or by laws. For it is God’s law and doing. Let him who will be alone abandon the name of man and prove or make himself an angel or spirit, for God does not grant or allow such a condition to a man.

Accordingly we do well when we sing of holy virgins in such a way as to indicate that they lived lives that were angelic rather than human and that they were enabled to live in the flesh and yet without the flesh by a special grace of God. Our bodies are in great part the flesh of women, for by them we were conceived, developed, borne, suckled, and nourished, and so it is quite impossible to keep entirely apart from them. This is in accord with the Word of God. He has caused it to be so and wishes it so. Even the impotent, as we know, are full of natural desire. Indeed, the more impotent they are, the more they desire to be with women, which is altogether natural, for we always desire most what we can least have.

Therefore, whoever will live alone undertakes an impossible task and takes it upon himself to run counter to God’s Word and the nature that God has given and preserves in him. The outcome is in keeping with the attempt; such persons revel in whoredom and all sorts of uncleanness of the flesh until they are drowned in their own vices and driven to despair. For this reason such a vow against God’s Word and against nature, being impossible, is null and void. And God also condemns it just as if somebody should vow to be God’s mother or to make a heaven.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/martin-luther.html">Martin Luther</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Letter to Wolfgang Reissenbusch, 27 March 1525 in Luther: Letters of Spiritual Counsel, ed. and trans. Theodore G. Tappert, Library of Christian Classics, vol. 18 (London: SCM Press, 1955), pp 273-74.</cite></span></figcaption>

</figure><figure class="quote" id="q-76363c3521" data-kw="">
<blockquote><p>5. It is now supposed, and shall (if it please God) hereafter be demonstrated, that human souls are not traducted, nor causally brought out of the flesh: yet are they occasionally (that I may touch at the manner), God having resolved and decreed, after generation and fit organization of the embryo, to create and infuse a reasonable soul: which soul, because it is united to a mass corrupted, in such a manner as a spiritless mass may be corrupted, or rather to a mass inclining or inducing to corruption, in the very unition it contracts original sin. Hugo Eterianus [d. 1182] thus descants on this point: ‘When the soul languishes, it is neither cast down by the will, nor by necessity, but only by fellowship, if the soul were corrupted by the will, it should not be counted original sin, but actual: if it should fall by necessity, that vice were no further to be imputed.’ Concerning the latter part, I answer, if in his necessity he imply coaction, he says true: otherwise, by this concurrence of our condescending will in Adam, or by our own implicit will, we may draw on us a necessity of after-sinning, which most justly may be imputed to us, and we may tie ourselves with our own bonds. To the former part this may give satisfaction, that against the will of the soul, the soul itself cannot be corrupted: for then the will should be forced, and so [be] no will at all, but [a] noluntas, and not voluntas. ‘It is not necessary,’ says Bellarmine, ‘that our soul must needs come from Adam, because we draw sin from him: if but one part come from him it is enough.’ For a father does not per se produce original sin in the child, but per accidens; namely, as by the act of generation it comes to pass, that his son is a member of mankind, which was overtaken in Adam’s corruption, and that the propension unto evil of the earthly part traducted, meeting with a soul not much resisting, causes this original sin to result thencefrom, and death by this original sin. So that no sooner is the soul united to its body, and the matter glued to the form, but the infant deserves to be, and is the child of death, by reason of the primigeneal corruption. If you inquire after what manner the body works the soul unto this evil, we may truly say, ‘The body works not upon the soul by a natural and immediate action.’ You heard what Hugo Eterianus said, ‘It is stricken or cast down only by fellowship.’ He enlarges himself in the same chapter, thus: ‘Imperfection, languishing, and corruption abide in the flesh before the soul’s conjunction; from which disease the soul is infected: as if a vessel be tainted with an ill odour, it infects therewith whatsoever liquor it receives.’ Gerson thus, ‘The soul by the conjunction with the body contracts that infection; as when one falls into the mire, he is besmeared and stained.’ Felisius thus: ‘A clean apple put in an unclean hand is soiled. Good wine poured into a fustie vessel contracts a strange taste, and loses its own natural: so the soul loses its naturall vigor, when it is united in the flesh.’ Another thus, ‘Anima cum labente simul labitur, et frustra nititur dum innititur.’ To the same effect another says thus: ‘As the purest rain-water falling on dust, is turned with the dust into a lump of mire: so at the coadunation of the soul unto the earthly part, both spirit and flesh are plunged in the durt of corruption.’ Augustine, against Julian the Pelagian, prefers the very heathen before Julian; for he held that ‘nothing was conveyed unto us from Adam;’ and they held, ‘That we were born to be punished for old crimes committed in a former life.’ ‘And,’ says Augustine, ‘it is true which Aristotle relates, that we are punished like to those who fell among the Hetrurian robbers, whose living bodies being coupled face to face with dead men’s carcasses, were so killed.’ Of the Hetrurian tyrant Mezentius, Virgil, Aeneid, 8, records the like: Mortua corporibus jungebat corpora vivis, Componens manibúsque manus at que oribus ora, (Tormenti genus) et sanie tabóque fluentes, Complexu in misero, longâ sic morte necabat. But I return from this digression. The heathen say (as St. Augustine relates) that ‘our souls united to our bodies are like the living coupled with the dead.’ ‘They saw somewhat,’ says he, and commends their wisdom in discerning the miseries of mankind to be for somewhat before committed, and in acknowledging the power and justice of God; though without divine revelation they could not know that it was Adam’s offence which brought such a wrack both on our souls and on our bodies. What has been hitherto related seems too much to incline to the natural, physical, immediate working of the soul upon the body. Others are as faulty, who say, ‘The soul receives no annoyance from the body, but by way of impedition [being impeded] only, where the spiritual faculties are hindered and the music spilt, by reason of the untuneableness of the organs. But they will not seem to hear that ‘a spiritual substance can receive infection from a nature corporeal.’ Both opinions may rest contented in the middesse or mean, that as the body cannot go beyond the sphere of its activity, and work properly and physically upon the soul: so by the interposition, as it were, of a middle nature, the body not only hinders the faculties of the soul from working, but sometimes works upon the soul. Thus the natural, vital and animal spirits do bind and unite the soul to the body, that neither part can part from other, though it would. Thus bodily objects work on the mind, but it is by the mediation of the outward and inward senses. Shall corporeal, outward, and remote objects, by degrees, draw the soul into sin, even in our perfect age, when our natural reason is most vigorous; and may not the corrupted seed, having as great a propension to evil as Naphtha to take fire, at the conjunction, infect the soul with a participation of uncleanness, though the operation be not physical, or immediate? By Adam’s soul sinning was Adam’s flesh infected; may not our soul be infected as well by our flesh? A spiritual substance can produce a bodily effect. Boëtius says excellently: ‘Forms material came from forms immaterial: Our will was moved by our intellect, our appetite by our will, and a bodily change conformable to our appetite.’ And may not a bodily species work by the same degrees, backward, on the soul itself? The reason is alike in the contrariety. Does the corporeal fire of Hell torment and affect the incorporeal spirits of evil angels, and shall it of wicked men (as most certainly it does and must; which shall be proved, God willing, otherwhere) and may not the matter make some impression on the form, the body upon the soul, when there is such a sympathy in nature betwixt them? If the soul do no way suffer from the body, how does it follow the temperature of the body? How does madness, foolishness, anger and love, with other affections, work upon the mind? Yea, how comes it to pass that not only strength and nimbleness of body, but even goodness of wit is propagated (if nature be strong) and children resemble their fathers both in manners and understanding? The flesh itself without the soul, if it be beaten, hurt, or cut, is no way sensible. Reunite the separated soul to the wronged body, the soul feeleth, and is much affected: nor is the grief in the incision only, but in the soul. Yea, in apoplexies and deep sleeps, cast upon men by stupefactive ingredients and compounded by art, while the soul is in the body, wounds have been given unto the earthy part, and it never felt them: when those fits are vanished, the soul feels the pain of the discontinuity and division of the flesh as well as the body. Doctor [John] Rainolds thus, ‘God by nature has ordered that the soul naturally united to the body should suffer with the body and be grieved, the body being afflicted, and rejoice, it being refreshed, and be sorrowfull, the body being killed; so that some way it suffers by reason of the body.’ Permit me but the use of his modification some way and I dare say the body draws the soul its way, some way to sin. Aquinas on Rom. 5, lect. 3: ‘It should not seem that sin, which is an accident of the soul, can be produced by the original of the flesh: It is answered (says he) with reason. Though the soul be not in the seed, yet there is in the seed a virtue disposing the body to receive the soul, which soul being poured or infused into the body, is after a sort conformable to the body, because every thing received is in the receiver according to the capacity of the receiver.’ To him let me add: if a new created soul should be put into a body not descending from Adam, it should not have original sin; but meeting with a body disposed to corruption, after its kind it yields and contracts original sin.

6. Yea, but the act of Adam’s sin passed quickly away, and the guiltines was forgiven [for him]; how could it infect us? I answer, ‘The person did first infect the nature, afterwards the nature did infect the person.’… And the manner how the soul is made sinful is described at large before, to wit, that by the union it is infected, and so soon as it is infused, it tastes of corruption… so does a just man beget an unjust, Christianus non Christianum, ‘A Christian an unchristian’; the circumcised Hebrews beget children uncircumcised: for the generation is natural and not spiritual… just Lot who begat wicked daughters, or David who had Absalom, or Abraham, who had Ismael, or Isaac who had Esau; or Noah, who had Ham… For man begets man like to himself, as he is species hominis [the species of a man], not as he is individuum [an individual]: and accidents belonging to the individual person of the Father pass not over to the child, but those things that pertain to the specifical nature. Therefore what belongs to man, as he is individuum, he does not propagate.</p></blockquote>

<div class="actions"><button class="copy" data-copy="“5. It is now supposed, and shall (if it please God) hereafter be demonstrated, that human souls are not traducted, nor causally brought out of the flesh: yet are they occasionally (that I may touch at the manner), God having resolved and decreed, after generation and fit organization of the embryo, to create and infuse a reasonable soul: which soul, because it is united to a mass corrupted, in such a manner as a spiritless mass may be corrupted, or rather to a mass inclining or inducing to corruption, in the very unition it contracts original sin. Hugo Eterianus [d. 1182] thus descants on this point: ‘When the soul languishes, it is neither cast down by the will, nor by necessity, but only by fellowship, if the soul were corrupted by the will, it should not be counted original sin, but actual: if it should fall by necessity, that vice were no further to be imputed.’ Concerning the latter part, I answer, if in his necessity he imply coaction, he says true: otherwise, by this concurrence of our condescending will in Adam, or by our own implicit will, we may draw on us a necessity of after-sinning, which most justly may be imputed to us, and we may tie ourselves with our own bonds. To the former part this may give satisfaction, that against the will of the soul, the soul itself cannot be corrupted: for then the will should be forced, and so [be] no will at all, but [a] noluntas, and not voluntas. ‘It is not necessary,’ says Bellarmine, ‘that our soul must needs come from Adam, because we draw sin from him: if but one part come from him it is enough.’ For a father does not per se produce original sin in the child, but per accidens; namely, as by the act of generation it comes to pass, that his son is a member of mankind, which was overtaken in Adam’s corruption, and that the propension unto evil of the earthly part traducted, meeting with a soul not much resisting, causes this original sin to result thencefrom, and death by this original sin. So that no sooner is the soul united to its body, and the matter glued to the form, but the infant deserves to be, and is the child of death, by reason of the primigeneal corruption. If you inquire after what manner the body works the soul unto this evil, we may truly say, ‘The body works not upon the soul by a natural and immediate action.’ You heard what Hugo Eterianus said, ‘It is stricken or cast down only by fellowship.’ He enlarges himself in the same chapter, thus: ‘Imperfection, languishing, and corruption abide in the flesh before the soul’s conjunction; from which disease the soul is infected: as if a vessel be tainted with an ill odour, it infects therewith whatsoever liquor it receives.’ Gerson thus, ‘The soul by the conjunction with the body contracts that infection; as when one falls into the mire, he is besmeared and stained.’ Felisius thus: ‘A clean apple put in an unclean hand is soiled. Good wine poured into a fustie vessel contracts a strange taste, and loses its own natural: so the soul loses its naturall vigor, when it is united in the flesh.’ Another thus, ‘Anima cum labente simul labitur, et frustra nititur dum innititur.’ To the same effect another says thus: ‘As the purest rain-water falling on dust, is turned with the dust into a lump of mire: so at the coadunation of the soul unto the earthly part, both spirit and flesh are plunged in the durt of corruption.’ Augustine, against Julian the Pelagian, prefers the very heathen before Julian; for he held that ‘nothing was conveyed unto us from Adam;’ and they held, ‘That we were born to be punished for old crimes committed in a former life.’ ‘And,’ says Augustine, ‘it is true which Aristotle relates, that we are punished like to those who fell among the Hetrurian robbers, whose living bodies being coupled face to face with dead men’s carcasses, were so killed.’ Of the Hetrurian tyrant Mezentius, Virgil, Aeneid, 8, records the like: Mortua corporibus jungebat corpora vivis, Componens manibúsque manus at que oribus ora, (Tormenti genus) et sanie tabóque fluentes, Complexu in misero, longâ sic morte necabat. But I return from this digression. The heathen say (as St. Augustine relates) that ‘our souls united to our bodies are like the living coupled with the dead.’ ‘They saw somewhat,’ says he, and commends their wisdom in discerning the miseries of mankind to be for somewhat before committed, and in acknowledging the power and justice of God; though without divine revelation they could not know that it was Adam’s offence which brought such a wrack both on our souls and on our bodies. What has been hitherto related seems too much to incline to the natural, physical, immediate working of the soul upon the body. Others are as faulty, who say, ‘The soul receives no annoyance from the body, but by way of impedition [being impeded] only, where the spiritual faculties are hindered and the music spilt, by reason of the untuneableness of the organs. But they will not seem to hear that ‘a spiritual substance can receive infection from a nature corporeal.’ Both opinions may rest contented in the middesse or mean, that as the body cannot go beyond the sphere of its activity, and work properly and physically upon the soul: so by the interposition, as it were, of a middle nature, the body not only hinders the faculties of the soul from working, but sometimes works upon the soul. Thus the natural, vital and animal spirits do bind and unite the soul to the body, that neither part can part from other, though it would. Thus bodily objects work on the mind, but it is by the mediation of the outward and inward senses. Shall corporeal, outward, and remote objects, by degrees, draw the soul into sin, even in our perfect age, when our natural reason is most vigorous; and may not the corrupted seed, having as great a propension to evil as Naphtha to take fire, at the conjunction, infect the soul with a participation of uncleanness, though the operation be not physical, or immediate? By Adam’s soul sinning was Adam’s flesh infected; may not our soul be infected as well by our flesh? A spiritual substance can produce a bodily effect. Boëtius says excellently: ‘Forms material came from forms immaterial: Our will was moved by our intellect, our appetite by our will, and a bodily change conformable to our appetite.’ And may not a bodily species work by the same degrees, backward, on the soul itself? The reason is alike in the contrariety. Does the corporeal fire of Hell torment and affect the incorporeal spirits of evil angels, and shall it of wicked men (as most certainly it does and must; which shall be proved, God willing, otherwhere) and may not the matter make some impression on the form, the body upon the soul, when there is such a sympathy in nature betwixt them? If the soul do no way suffer from the body, how does it follow the temperature of the body? How does madness, foolishness, anger and love, with other affections, work upon the mind? Yea, how comes it to pass that not only strength and nimbleness of body, but even goodness of wit is propagated (if nature be strong) and children resemble their fathers both in manners and understanding? The flesh itself without the soul, if it be beaten, hurt, or cut, is no way sensible. Reunite the separated soul to the wronged body, the soul feeleth, and is much affected: nor is the grief in the incision only, but in the soul. Yea, in apoplexies and deep sleeps, cast upon men by stupefactive ingredients and compounded by art, while the soul is in the body, wounds have been given unto the earthy part, and it never felt them: when those fits are vanished, the soul feels the pain of the discontinuity and division of the flesh as well as the body. Doctor [John] Rainolds thus, ‘God by nature has ordered that the soul naturally united to the body should suffer with the body and be grieved, the body being afflicted, and rejoice, it being refreshed, and be sorrowfull, the body being killed; so that some way it suffers by reason of the body.’ Permit me but the use of his modification some way and I dare say the body draws the soul its way, some way to sin. Aquinas on Rom. 5, lect. 3: ‘It should not seem that sin, which is an accident of the soul, can be produced by the original of the flesh: It is answered (says he) with reason. Though the soul be not in the seed, yet there is in the seed a virtue disposing the body to receive the soul, which soul being poured or infused into the body, is after a sort conformable to the body, because every thing received is in the receiver according to the capacity of the receiver.’ To him let me add: if a new created soul should be put into a body not descending from Adam, it should not have original sin; but meeting with a body disposed to corruption, after its kind it yields and contracts original sin.

6. Yea, but the act of Adam’s sin passed quickly away, and the guiltines was forgiven [for him]; how could it infect us? I answer, ‘The person did first infect the nature, afterwards the nature did infect the person.’… And the manner how the soul is made sinful is described at large before, to wit, that by the union it is infected, and so soon as it is infused, it tastes of corruption… so does a just man beget an unjust, Christianus non Christianum, ‘A Christian an unchristian’; the circumcised Hebrews beget children uncircumcised: for the generation is natural and not spiritual… just Lot who begat wicked daughters, or David who had Absalom, or Abraham, who had Ismael, or Isaac who had Esau; or Noah, who had Ham… For man begets man like to himself, as he is species hominis [the species of a man], not as he is individuum [an individual]: and accidents belonging to the individual person of the Father pass not over to the child, but those things that pertain to the specifical nature. Therefore what belongs to man, as he is individuum, he does not propagate.”

— Edward Kellet, Miscellanies of Divinity, divided into Three Books, … (Cambridge, 1635), bk. 1, ch. 6 Kellet (1583-1641) was a doctor of divinity and a calvinistic, Anglican, canon in the cathedral church at Exeter. | section 5, pp. 103-6">Copy</button><a class="share" href="https://x.com/intent/post?text=%E2%80%9C5.+It+is+now+supposed%2C+and+shall+%28if+it+please+God%29+hereafter+be+demonstrated%2C+that+human+souls+are+not+traducted%2C+nor+causally+brought+out+of+the+flesh%3A+yet+are+they+occasionally+%28that+I+may+touch+at+the+manner%29%2C+God+having+resolved+and+decreed%2C+after+generation+and+fit+organization+of+the+embryo%2C+to+create+and+infuse+a+reasonable+soul%3A+which+soul%2C+because+it+is+united+to+a+mass+corrupted%2C+in+such+a+manner+as+a+spiritless+mass+may+be+corrupted%2C+or+rather+to+a+mass+inclining+or+inducing+to+corruption%2C+in+the+very+unition+it+contracts+original+sin.+Hugo+Eterianus+%5Bd.+1182%5D+thus+descants+on+this+point%3A+%E2%80%98When+the+soul+languishes%2C+it+is+neither+cast+down+by+the+will%2C+nor+by+necessity%2C+but+only+by+fellowship%2C+if+the+soul+were+corrupted+by+the+will%2C+it+should+not+be+counted+original+sin%2C+but+actual%3A+if+it+should+fall+by+necessity%2C+that+vice+were+no+further+to+be+imputed.%E2%80%99+Concerning+the+latter+part%2C+I+answer%2C+if+in+his+necessity+he+imply+coaction%2C+he+says+true%3A+otherwise%2C+by+this+concurrence+of+our+condescending+will+in+Adam%2C+or+by+our+own+implicit+will%2C+we+may+draw+on+us+a+necessity+of+after-sinning%2C+which+most+justly+may+be+imputed+to+us%2C+and+we+may+tie+ourselves+with+our+own+bonds.+To+the+former+part+this+may+give+satisfaction%2C+that+against+the+will+of+the+soul%2C+the+soul+itself+cannot+be+corrupted%3A+for+then+the+will+should+be+forced%2C+and+so+%5Bbe%5D+no+will+at+all%2C+but+%5Ba%5D+noluntas%2C+and+not+voluntas.+%E2%80%98It+is+not+necessary%2C%E2%80%99+says+Bellarmine%2C+%E2%80%98that+our+soul+must+needs+come+from+Adam%2C+because+we+draw+sin+from+him%3A+if+but+one+part+come+from+him+it+is+enough.%E2%80%99+For+a+father+does+not+per+se+produce+original+sin+in+the+child%2C+but+per+accidens%3B+namely%2C+as+by+the+act+of+generation+it+comes+to+pass%2C+that+his+son+is+a+member+of+mankind%2C+which+was+overtaken+in+Adam%E2%80%99s+corruption%2C+and+that+the+propension+unto+evil+of+the+earthly+part+traducted%2C+meeting+with+a+soul+not+much+resisting%2C+causes+this+original+sin+to+result+thencefrom%2C+and+death+by+this+original+sin.+So+that+no+sooner+is+the+soul+united+to+its+body%2C+and+the+matter+glued+to+the+form%2C+but+the+infant+deserves+to+be%2C+and+is+the+child+of+death%2C+by+reason+of+the+primigeneal+corruption.+If+you+inquire+after+what+manner+the+body+works+the+soul+unto+this+evil%2C+we+may+truly+say%2C+%E2%80%98The+body+works+not+upon+the+soul+by+a+natural+and+immediate+action.%E2%80%99+You+heard+what+Hugo+Eterianus+said%2C+%E2%80%98It+is+stricken+or+cast+down+only+by+fellowship.%E2%80%99+He+enlarges+himself+in+the+same+chapter%2C+thus%3A+%E2%80%98Imperfection%2C+languishing%2C+and+corruption+abide+in+the+flesh+before+the+soul%E2%80%99s+conjunction%3B+from+which+disease+the+soul+is+infected%3A+as+if+a+vessel+be+tainted+with+an+ill+odour%2C+it+infects+therewith+whatsoever+liquor+it+receives.%E2%80%99+Gerson+thus%2C+%E2%80%98The+soul+by+the+conjunction+with+the+body+contracts+that+infection%3B+as+when+one+falls+into+the+mire%2C+he+is+besmeared+and+stained.%E2%80%99+Felisius+thus%3A+%E2%80%98A+clean+apple+put+in+an+unclean+hand+is+soiled.+Good+wine+poured+into+a+fustie+vessel+contracts+a+strange+taste%2C+and+loses+its+own+natural%3A+so+the+soul+loses+its+naturall+vigor%2C+when+it+is+united+in+the+flesh.%E2%80%99+Another+thus%2C+%E2%80%98Anima+cum+labente+simul+labitur%2C+et+frustra+nititur+dum+innititur.%E2%80%99+To+the+same+effect+another+says+thus%3A+%E2%80%98As+the+purest+rain-water+falling+on+dust%2C+is+turned+with+the+dust+into+a+lump+of+mire%3A+so+at+the+coadunation+of+the+soul+unto+the+earthly+part%2C+both+spirit+and+flesh+are+plunged+in+the+durt+of+corruption.%E2%80%99+Augustine%2C+against+Julian+the+Pelagian%2C+prefers+the+very+heathen+before+Julian%3B+for+he+held+that+%E2%80%98nothing+was+conveyed+unto+us+from+Adam%3B%E2%80%99+and+they+held%2C+%E2%80%98That+we+were+born+to+be+punished+for+old+crimes+committed+in+a+former+life.%E2%80%99+%E2%80%98And%2C%E2%80%99+says+Augustine%2C+%E2%80%98it+is+true+which+Aristotle+relates%2C+that+we+are+punished+like+to+those+who+fell+among+the+Hetrurian+robbers%2C+whose+living+bodies+being+coupled+face+to+face+with+dead+men%E2%80%99s+carcasses%2C+were+so+killed.%E2%80%99+Of+the+Hetrurian+tyrant+Mezentius%2C+Virgil%2C+Aeneid%2C+8%2C+records+the+like%3A+Mortua+corporibus+jungebat+corpora+vivis%2C+Componens+manib%C3%BAsque+manus+at+que+oribus+ora%2C+%28Tormenti+genus%29+et+sanie+tab%C3%B3que+fluentes%2C+Complexu+in+misero%2C+long%C3%A2+sic+morte+necabat.+But+I+return+from+this+digression.+The+heathen+say+%28as+St.+Augustine+relates%29+that+%E2%80%98our+souls+united+to+our+bodies+are+like+the+living+coupled+with+the+dead.%E2%80%99+%E2%80%98They+saw+somewhat%2C%E2%80%99+says+he%2C+and+commends+their+wisdom+in+discerning+the+miseries+of+mankind+to+be+for+somewhat+before+committed%2C+and+in+acknowledging+the+power+and+justice+of+God%3B+though+without+divine+revelation+they+could+not+know+that+it+was+Adam%E2%80%99s+offence+which+brought+such+a+wrack+both+on+our+souls+and+on+our+bodies.+What+has+been+hitherto+related+seems+too+much+to+incline+to+the+natural%2C+physical%2C+immediate+working+of+the+soul+upon+the+body.+Others+are+as+faulty%2C+who+say%2C+%E2%80%98The+soul+receives+no+annoyance+from+the+body%2C+but+by+way+of+impedition+%5Bbeing+impeded%5D+only%2C+where+the+spiritual+faculties+are+hindered+and+the+music+spilt%2C+by+reason+of+the+untuneableness+of+the+organs.+But+they+will+not+seem+to+hear+that+%E2%80%98a+spiritual+substance+can+receive+infection+from+a+nature+corporeal.%E2%80%99+Both+opinions+may+rest+contented+in+the+middesse+or+mean%2C+that+as+the+body+cannot+go+beyond+the+sphere+of+its+activity%2C+and+work+properly+and+physically+upon+the+soul%3A+so+by+the+interposition%2C+as+it+were%2C+of+a+middle+nature%2C+the+body+not+only+hinders+the+faculties+of+the+soul+from+working%2C+but+sometimes+works+upon+the+soul.+Thus+the+natural%2C+vital+and+animal+spirits+do+bind+and+unite+the+soul+to+the+body%2C+that+neither+part+can+part+from+other%2C+though+it+would.+Thus+bodily+objects+work+on+the+mind%2C+but+it+is+by+the+mediation+of+the+outward+and+inward+senses.+Shall+corporeal%2C+outward%2C+and+remote+objects%2C+by+degrees%2C+draw+the+soul+into+sin%2C+even+in+our+perfect+age%2C+when+our+natural+reason+is+most+vigorous%3B+and+may+not+the+corrupted+seed%2C+having+as+great+a+propension+to+evil+as+Naphtha+to+take+fire%2C+at+the+conjunction%2C+infect+the+soul+with+a+participation+of+uncleanness%2C+though+the+operation+be+not+physical%2C+or+immediate%3F+By+Adam%E2%80%99s+soul+sinning+was+Adam%E2%80%99s+flesh+infected%3B+may+not+our+soul+be+infected+as+well+by+our+flesh%3F+A+spiritual+substance+can+produce+a+bodily+effect.+Bo%C3%ABtius+says+excellently%3A+%E2%80%98Forms+material+came+from+forms+immaterial%3A+Our+will+was+moved+by+our+intellect%2C+our+appetite+by+our+will%2C+and+a+bodily+change+conformable+to+our+appetite.%E2%80%99+And+may+not+a+bodily+species+work+by+the+same+degrees%2C+backward%2C+on+the+soul+itself%3F+The+reason+is+alike+in+the+contrariety.+Does+the+corporeal+fire+of+Hell+torment+and+affect+the+incorporeal+spirits+of+evil+angels%2C+and+shall+it+of+wicked+men+%28as+most+certainly+it+does+and+must%3B+which+shall+be+proved%2C+God+willing%2C+otherwhere%29+and+may+not+the+matter+make+some+impression+on+the+form%2C+the+body+upon+the+soul%2C+when+there+is+such+a+sympathy+in+nature+betwixt+them%3F+If+the+soul+do+no+way+suffer+from+the+body%2C+how+does+it+follow+the+temperature+of+the+body%3F+How+does+madness%2C+foolishness%2C+anger+and+love%2C+with+other+affections%2C+work+upon+the+mind%3F+Yea%2C+how+comes+it+to+pass+that+not+only+strength+and+nimbleness+of+body%2C+but+even+goodness+of+wit+is+propagated+%28if+nature+be+strong%29+and+children+resemble+their+fathers+both+in+manners+and+understanding%3F+The+flesh+itself+without+the+soul%2C+if+it+be+beaten%2C+hurt%2C+or+cut%2C+is+no+way+sensible.+Reunite+the+separated+soul+to+the+wronged+body%2C+the+soul+feeleth%2C+and+is+much+affected%3A+nor+is+the+grief+in+the+incision+only%2C+but+in+the+soul.+Yea%2C+in+apoplexies+and+deep+sleeps%2C+cast+upon+men+by+stupefactive+ingredients+and+compounded+by+art%2C+while+the+soul+is+in+the+body%2C+wounds+have+been+given+unto+the+earthy+part%2C+and+it+never+felt+them%3A+when+those+fits+are+vanished%2C+the+soul+feels+the+pain+of+the+discontinuity+and+division+of+the+flesh+as+well+as+the+body.+Doctor+%5BJohn%5D+Rainolds+thus%2C+%E2%80%98God+by+nature+has+ordered+that+the+soul+naturally+united+to+the+body+should+suffer+with+the+body+and+be+grieved%2C+the+body+being+afflicted%2C+and+rejoice%2C+it+being+refreshed%2C+and+be+sorrowfull%2C+the+body+being+killed%3B+so+that+some+way+it+suffers+by+reason+of+the+body.%E2%80%99+Permit+me+but+the+use+of+his+modification+some+way+and+I+dare+say+the+body+draws+the+soul+its+way%2C+some+way+to+sin.+Aquinas+on+Rom.+5%2C+lect.+3%3A+%E2%80%98It+should+not+seem+that+sin%2C+which+is+an+accident+of+the+soul%2C+can+be+produced+by+the+original+of+the+flesh%3A+It+is+answered+%28says+he%29+with+reason.+Though+the+soul+be+not+in+the+seed%2C+yet+there+is+in+the+seed+a+virtue+disposing+the+body+to+receive+the+soul%2C+which+soul+being+poured+or+infused+into+the+body%2C+is+after+a+sort+conformable+to+the+body%2C+because+every+thing+received+is+in+the+receiver+according+to+the+capacity+of+the+receiver.%E2%80%99+To+him+let+me+add%3A+if+a+new+created+soul+should+be+put+into+a+body+not+descending+from+Adam%2C+it+should+not+have+original+sin%3B+but+meeting+with+a+body+disposed+to+corruption%2C+after+its+kind+it+yields+and+contracts+original+sin.%0A%0A6.+Yea%2C+but+the+act+of+Adam%E2%80%99s+sin+passed+quickly+away%2C+and+the+guiltines+was+forgiven+%5Bfor+him%5D%3B+how+could+it+infect+us%3F+I+answer%2C+%E2%80%98The+person+did+first+infect+the+nature%2C+afterwards+the+nature+did+infect+the+person.%E2%80%99%E2%80%A6+And+the+manner+how+the+soul+is+made+sinful+is+described+at+large+before%2C+to+wit%2C+that+by+the+union+it+is+infected%2C+and+so+soon+as+it+is+infused%2C+it+tastes+of+corruption%E2%80%A6+so+does+a+just+man+beget+an+unjust%2C+Christianus+non+Christianum%2C+%E2%80%98A+Christian+an+unchristian%E2%80%99%3B+the+circumcised+Hebrews+beget+children+uncircumcised%3A+for+the+generation+is+natural+and+not+spiritual%E2%80%A6+just+Lot+who+begat+wicked+daughters%2C+or+David+who+had+Absalom%2C+or+Abraham%2C+who+had+Ismael%2C+or+Isaac+who+had+Esau%3B+or+Noah%2C+who+had+Ham%E2%80%A6+For+man+begets+man+like+to+himself%2C+as+he+is+species+hominis+%5Bthe+species+of+a+man%5D%2C+not+as+he+is+individuum+%5Ban+individual%5D%3A+and+accidents+belonging+to+the+individual+person+of+the+Father+pass+not+over+to+the+child%2C+but+those+things+that+pertain+to+the+specifical+nature.+Therefore+what+belongs+to+man%2C+as+he+is+individuum%2C+he+does+not+propagate.%E2%80%9D%0A%0A%E2%80%94+Edward+Kellet%2C+Miscellanies+of+Divinity%2C+divided+into+Three+Books%2C+%E2%80%A6+%28Cambridge%2C+1635%29%2C+bk.+1%2C+ch.+6+Kellet+%281583-1641%29+was+a+doctor+of+divinity+and+a+calvinistic%2C+Anglican%2C+canon+in+the+cathedral+church+at+Exeter.+%7C+section+5%2C+pp.+103-6&amp;url=https%3A%2F%2F5solasquotes.github.io%2Fquote%2F76363c3521.html&amp;via=5Solas" target="_blank" rel="noopener">Share on X</a><a class="perma" href="../quote/76363c3521.html">Permalink</a><a class="src" href="https://reformedbooksonline.com/on-when-the-soul-is-joined-to-the-body-in-the-womb/#:~:text=5.%20It%20is%20now%20supposed%2C%20and,is%20individuum%2C%20he%20does%20not%20propagate&amp;text=5.%20It%20is%20now%20supposed%2C%20and%20shall%20%28if&amp;text=as%20he%20is%20individuum%2C%20he%20does%20not%20propagate" rel="noopener" target="_blank">Read it online · Reformed Books Online</a></div>

<blockquote><p>To be taken without consent from my home and friends; to lose my liberty; to undergo all those assaults on my personality which modern psychotherapy knows how to deliver; to be re-made after some pattern of “normality” hatched in a Viennese laboratory to which I never professed allegiance; to know that this process will never end until either my captors have succeeded or I grown wise enough to cheat them with apparent success – who cares whether this is called Punishment or not? That it includes most of the elements for which any punishment is feared – shame, exile, bondage, and years eaten by the locust – is obvious. …

Of all tyrannies a tyranny sincerely exercised for the good of its victims may be the most oppressive. It may be better to live under robber barons than under omnipotent moral busybodies. The robber baron’s cruelty may sometimes sleep, his cupidity may at some point be satiated; but those who torment us for our own good will torment us without end for they do so with the approval of their own conscience. They may be more likely to go to Heaven yet at the same time likelier to make a Hell of earth.

Their very kindness stings with intolerable insult. To be “cured” against one’s will and cured of states which we may not regard as disease is to be put on a level with those who have not yet reached the age of reason or those who never will; to be classed with infants, imbeciles, and domestic animals. But to be punished, however severely, because we have deserved it, because we “ought to have known better”, is to be treated as a human person made in God’s image.

In reality, however, we must face the possibility of bad rulers armed with a Humanitarian theory of punishment. … And when they are wicked· the Humanitarian theory of punishment will put in their hands a finer instrument of tyranny than wickedness ever had before. For if crime and disease are to be regarded as the same thing, it follows that any state of mind which our masters choose to call “disease” can be treated as crime; and compulsorily cured. It will be vain to plead that states of mind which displease government need not always involve moral turpitude and do not therefore always deserve forfeiture of liberty.

For our masters will not be using the concepts of Desert and Punishment but those of disease and cure. We know that one school of psychology already regards religion as a neurosis. When this particular neurosis becomes inconvenient to government, what is to hinder government from proceeding to “cure” it? Such “cure” will, of course, be compulsory; but under the Humanitarian theory it will not be called by the shocking name of Persecution. No one will blame us for being Christian, no one will hate us, no one will revile us.

The new Nero will approach us with the silky manners of a doctor, and though all will be in fact as compulsory as the tunica molesta or Smithfield or Tyburn, all will go on within the unemotional therapeutic sphere where words like “right” and “wrong” or “freedom” and “slavery” are never heard. And thus when the command is given, every prominent Christian in the land may vanish overnight into Institutions for the Treatment of the Ideologically Unsound, and it will rest with the expert gaolers to say when (if ever) they are to re-emerge. But it will not be persecution. Even if the treatment is painful, even if it is life-long, even if it is fatal, that will be only a regrettable accident; the intention was purely therapeutic.</p></blockquote>

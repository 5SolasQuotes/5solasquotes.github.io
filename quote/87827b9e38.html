<main class="wrap"><figure class="quote" id="q-87827b9e38" data-kw="">
<blockquote><p>Nor do they speak in a satisfactory manner who annul by the sacraments the operation of the internal influence in the soul, and yet suppose that these same sacraments, whatever are the causes, do infallibly produce grace—God uniformly operating in virtue of a certain law or covenant, whereon the sacraments are observed. For although these persons ascribe the whole influence to God, and not to the sacraments, yet they do not avoid the other mischiefs of the opinion formerly mentioned (that which ascribes to the sacraments an influence of a physical kind). For they connect the divine influence with these signs, as if it could operate only when they are present, which is altogether false, since even before the sacraments are partaken of, God is accustomed to bestow his grace, of the acceptance of which these are but the signs and tokens.

And, indeed, their opinion differs but little from the superstitious notion of magical incantations by signs and words—just as Scripture frequently gives the name of sorcerers to those corrupters of religion who attach importance in sacred matters only to external words and signs. And besides, they fix the minds of believers far too strongly upon these mere external symbols, so that they are apt to imagine that, apart from them, the grace of God and eternal life can scarcely be bestowed.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/francis-burman.html">Francis Burman</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Synopsis theologiæ, &amp; speciatim oeconomiæ foederum</cite>, Dei (Amsterdam, 1699), Bk VII, chap. iv, sect. 28. Quoted in Herman Witsius, On the Efficacy and Utility of Baptism in the Case of Elect Infants whose Parents are under the Covenant (1693), trans. William Marshall, ed. J. Mark Beach in Mid-American Journal of Theology, 17 (2006), pp 181-82.</span></figcaption>

<blockquote><p>31. But the sense of these places [1 Jn. 2 and 2 Pet. 2] is that Christ gave Himself (which we easily acknowledge) as a sufficient price for the whole world and for the false teachers themselves. Even so, those alone are effectually redeemed who acknowledge this grace; not those who delight themselves in their own captivity, and are rejecters of Christ, such as are the reprobate.

32. We have already warned above about those universal passages that they ought to be, in certain places, restricted to all the elect, whom the Lord has [as his own], not only in Judea but also in all parts of the world, in which sense it may also be said that “the blood of Christ is a propitiation for the whole world”—although this text we freely acknowledge to be about sufficiency. … 37. However, it is incredible shamelessness of those critics which drives them to write that our church doctrine about the death of Christ, and its efficacy being limited to the elect and believers alone, leads people to despair, because one cannot deduce anything certain from mere particular propositions. …

9. We accordingly conclude with the Scriptures that all the elect or believers in Christ are saved by Christ…

10. But as one error begets another, our adversaries claiming that God equally loves all and that Christ died effectually for all, although they nominally admit there to be a certain number of the elect, nevertheless they undermine the whole force of divine election, and instead they move into the military camp of the Pelagians, who make foreseen faith and [foreseen] unbelief the cause of salvation and death, of election and reprobation.</p></blockquote>

<blockquote><p>Hence in vain is alleged [by Socinians]: 1. The innocence of Christ, as if it impeded his right of bearing our punishments (Socinus, part 3, ch. 9). For Christ himself professes that he has the right of laying down his life and that he lays it down for his sheep (John 10:15,18). But it rests on this, that God made him, our sponsor (Heb 7:22), to be sin for us, imputatively, that he might be pressed by the exactions of our debts (as the word אָשָׁם indicates), that is, that he might pay our penalties (Isa 53:7), which same thing is most clearly suggested when Christ is said to have suffered ὑπὲρ ἡμῶν, that is, in our place and stead. When therefore he is said to have been made a curse for us in order to remove the curse from us (Gal 3:13), why should we doubt his most rigid and strict satisfaction in our place? I admit indeed that the word ὑπὲρ sometimes has a wider sense and is joined with such a verb by which some benefit is said to be procured for another, as Paul says that he suffered for (ὑπὲρ) the church of God (Eph 3:1,13, Col 1:24), which Volkelius objects to (ibid.). But I say that when Scripture speaks of the sufferings of Christ, it indicates by it such a substitution by which Christ took upon himself the punishments to be borne by us, concerning which Paul, discussing them, denies that he [Paul] was crucified for the Corinthians (1 Cor 1:13). And certainly Socinus himself (ibid.) says that God manifested true justice concerning the innocent Christ, and Scripture says that peace and salvation flow to us from his sufferings (Isa 53:5). Let the good man explain to us here punishment without respect to sin, and free God from cruelty according to his view, [God] who burdened his most beloved and innocent Son with such great and dire torments, and indeed with justice administering it, if to punish the innocent for the guilty is a sign of utmost cruelty, as the Socinian axiom has it.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/johannes-hoornbeeck.html">Johannes Hoornbeeck</a></span><span class="wk"><span class="lbl">Work:</span> <cite>‘Theological Disputation on the Satisfaction of Christ’</cite>, tr. by AI by Onku (Utrecht, 1650) Latin</span></figcaption>

<div class="actions"><button class="copy" data-copy="“Hence in vain is alleged [by Socinians]: 1. The innocence of Christ, as if it impeded his right of bearing our punishments (Socinus, part 3, ch. 9). For Christ himself professes that he has the right of laying down his life and that he lays it down for his sheep (John 10:15,18). But it rests on this, that God made him, our sponsor (Heb 7:22), to be sin for us, imputatively, that he might be pressed by the exactions of our debts (as the word אָשָׁם indicates), that is, that he might pay our penalties (Isa 53:7), which same thing is most clearly suggested when Christ is said to have suffered ὑπὲρ ἡμῶν, that is, in our place and stead. When therefore he is said to have been made a curse for us in order to remove the curse from us (Gal 3:13), why should we doubt his most rigid and strict satisfaction in our place? I admit indeed that the word ὑπὲρ sometimes has a wider sense and is joined with such a verb by which some benefit is said to be procured for another, as Paul says that he suffered for (ὑπὲρ) the church of God (Eph 3:1,13, Col 1:24), which Volkelius objects to (ibid.). But I say that when Scripture speaks of the sufferings of Christ, it indicates by it such a substitution by which Christ took upon himself the punishments to be borne by us, concerning which Paul, discussing them, denies that he [Paul] was crucified for the Corinthians (1 Cor 1:13). And certainly Socinus himself (ibid.) says that God manifested true justice concerning the innocent Christ, and Scripture says that peace and salvation flow to us from his sufferings (Isa 53:5). Let the good man explain to us here punishment without respect to sin, and free God from cruelty according to his view, [God] who burdened his most beloved and innocent Son with such great and dire torments, and indeed with justice administering it, if to punish the innocent for the guilty is a sign of utmost cruelty, as the Socinian axiom has it.”

— Johannes Hoornbeeck, ‘Theological Disputation on the Satisfaction of Christ’, tr. by AI by Onku (Utrecht, 1650) Latin">Copy</button><a class="share" href="https://x.com/intent/post?text=%E2%80%9CHence+in+vain+is+alleged+%5Bby+Socinians%5D%3A+1.+The+innocence+of+Christ%2C+as+if+it+impeded+his+right+of+bearing+our+punishments+%28Socinus%2C+part+3%2C+ch.+9%29.+For+Christ+himself+professes+that+he+has+the+right+of+laying+down+his+life+and+that+he+lays+it+down+for+his+sheep+%28John+10%3A15%2C18%29.+But+it+rests+on+this%2C+that+God+made+him%2C+our+sponsor+%28Heb+7%3A22%29%2C+to+be+sin+for+us%2C+imputatively%2C+that+he+might+be+pressed+by+the+exactions+of+our+debts+%28as+the+word+%D7%90%D6%B8%D7%A9%D6%B8%D7%81%D7%9D+indicates%29%2C+that+is%2C+that+he+might+pay+our+penalties+%28Isa+53%3A7%29%2C+which+same+thing+is+most+clearly+suggested+when+Christ+is+said+to+have+suffered+%E1%BD%91%CF%80%E1%BD%B2%CF%81+%E1%BC%A1%CE%BC%E1%BF%B6%CE%BD%2C+that+is%2C+in+our+place+and+stead.+When+therefore+he+is+said+to+have+been+made+a+curse+for+us+in+order+to+remove+the+curse+from+us+%28Gal+3%3A13%29%2C+why+should+we+doubt+his+most+rigid+and+strict+satisfaction+in+our+place%3F+I+admit+indeed+that+the+word+%E1%BD%91%CF%80%E1%BD%B2%CF%81+sometimes+has+a+wider+sense+and+is+joined+with+such+a+verb+by+which+some+benefit+is+said+to+be+procured+for+another%2C+as+Paul+says+that+he+suffered+for+%28%E1%BD%91%CF%80%E1%BD%B2%CF%81%29+the+church+of+God+%28Eph+3%3A1%2C13%2C+Col+1%3A24%29%2C+which+Volkelius+objects+to+%28ibid.%29.+But+I+say+that+when+Scripture+speaks+of+the+sufferings+of+Christ%2C+it+indicates+by+it+such+a+substitution+by+which+Christ+took+upon+himself+the+punishments+to+be+borne+by+us%2C+concerning+which+Paul%2C+discussing+them%2C+denies+that+he+%5BPaul%5D+was+crucified+for+the+Corinthians+%281+Cor+1%3A13%29.+And+certainly+Socinus+himself+%28ibid.%29+says+that+God+manifested+true+justice+concerning+the+innocent+Christ%2C+and+Scripture+says+that+peace+and+salvation+flow+to+us+from+his+sufferings+%28Isa+53%3A5%29.+Let+the+good+man+explain+to+us+here+punishment+without+respect+to+sin%2C+and+free+God+from+cruelty+according+to+his+view%2C+%5BGod%5D+who+burdened+his+most+beloved+and+innocent+Son+with+such+great+and+dire+torments%2C+and+indeed+with+justice+administering+it%2C+if+to+punish+the+innocent+for+the+guilty+is+a+sign+of+utmost+cruelty%2C+as+the+Socinian+axiom+has+it.%E2%80%9D%0A%0A%E2%80%94+Johannes+Hoornbeeck%2C+%E2%80%98Theological+Disputation+on+the+Satisfaction+of+Christ%E2%80%99%2C+tr.+by+AI+by+Onku+%28Utrecht%2C+1650%29+Latin&amp;url=https%3A%2F%2F5solasquotes.github.io%2Fquote%2Fe320c2c7f1.html&amp;via=5Solas" target="_blank" rel="noopener">Share on X</a><a class="perma" href="../quote/e320c2c7f1.html">Permalink</a><a class="src" href="https://reformedbooksonline.com/topics/atonement#:~:text=Hence%20in%20vain%20is%20alleged%20%5Bby,as%20the%20Socinian%20axiom%20has%20it&amp;text=Hence%20in%20vain%20is%20alleged%20%5Bby%20Socinians%5D%3A%201&amp;text=utmost%20cruelty%2C%20as%20the%20Socinian%20axiom%20has%20it" rel="noopener" target="_blank">Read it online · Reformed Books Online</a></div>

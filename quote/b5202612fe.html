<main class="wrap"><figure class="quote" id="q-b5202612fe" data-kw="">
<blockquote><p>Bear always in mind that this is the rule of faith which I profess; by it I testify that the Father, and the Son, and the Spirit are inseparable from each other, and so will you know in what sense this is said. Now, observe, my assertion is that the Father is one, and the Son one, and the Spirit one, and that They are distinct from Each Other. This statement is taken in a wrong sense by every uneducated as well as every perversely disposed person, as if it predicated a diversity, in such a sense as to imply a separation among the Father, and the Son, and the Spirit. I am, moreover, obliged to say this, when (extolling the Monarchy at the expense of the Economy) they contend for the identity of the Father and Son and Spirit, that it is not by way of diversity that the Son differs from the Father, but by distribution: it is not by division that He is different, but by distinction; because the Father is not the same as the Son, since they differ one from the other in the mode of their being.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/tertullian.html">Tertullian</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Against Praxeas. in Latin Christianity</cite>, ed. Alexander Roberts, James Donaldson, and A. Cleveland Coxe, trans. Peter Holmes, vol. 3, The Ante-Nicene Fathers (Buffalo, NY: Christian Literature Company, 1885), 9 (p. 603–04).</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/the-church.html">The Church</a></span></div>

el="noopener" target="_blank">Read it online · Heidelblog</a></div>
</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-d73260422e" data-kw="">
<blockquote><p>As for schismatics, that is, those who separate themselves from true Christian churches for some slight cause, whether in doctrine or discipline, our theologians distinguish between the authors of the schism and the people deceived by them. As for the authors of the schism, since they break the bond of charity, they acknowledge that they cannot belong to the invisible Church, whose bond and communion consist in faith, hope, and charity. But concerning the deceived people or those born in schism, they are less rigid and believe that there can be good men among them, not alien to the body of Christ but joined to it by true faith and charity; nor do they entirely exclude schismatic churches from the visible Church if they retain the foundations of doctrine and discipline, since they reserve this honor only for those who deny and overthrow the fundamentals of faith and discipline.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/louis-le-blanc.html">Louis Le Blanc</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Elucidation of the Status of Controversies about the Church Militant</cite>, bk. 5, ch. 1, ‘On the Nature and Definition of the Church’ in Theological Theses Published at Various Times in the Academy of Sedan, 3rd ed., tr. by AI by Colloquia Scholastica (1675; London, 1683), p. 1,056</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/the-church/church-unity-and-fundamentals.html">Church Unity and Fundamentals</a></span></div>

</figure><figure class="quote" id="q-9f457c32af" data-kw="">
<blockquote><p>As to the charge of schism, they,” viz. the Assembly’s committee, “admit that difference in judgment in some particular points is no schism, nor does an inconformity to some things enjoined deserve that name; but our Brethren” (says that committee) “desire further to set up separate communions, which is a manifest rupture of our societies into others, and is therefore a schism in the body: This is setting up altar against altar, allowing our Churches to be true Churches, as the Independents do.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/john-currie.html">John Currie</a></span><span class="wk"><span class="lbl">Work:</span> <cite>An Essay on Separation</cite></span></figcaption>

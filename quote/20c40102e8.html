<main class="wrap"><figure class="quote" id="q-20c40102e8" data-kw="Creeds and confessions">
<blockquote><p>To this power belongs the making of public creeds and confessions, which are usually and by synods and presbyteries to preserve the unity and agreement of faith and reject errors. They do not have the same authority as the Scriptures, since they must be compared with and corrected by them. Yet they have even their own memorable weight and ought to be valued very highly by the pious. Both because they contain the sum and foundation of the Christian doctrine and are like barriers against the errors and corruptions which can injure religion. And because they are the bonds of ecclesiastical communion and formulas of consent which testify of the unity of faith and the agreement of churches with each other and are distinguished from unbelievers, as soldiers by marks or watchwords from their enemies.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/francis-turretin.html">Francis Turretin</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Institutes of Elenctic Theology</cite>, 18.30.5</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/the-church/creeds-confessions-and-councils.html">Creeds, Confessions and Councils</a> › <a href="../topics/the-church/creeds-confessions-and-councils/authority-of-creeds.html">Authority of creeds</a></span></div>

</figure><figure class="quote" id="q-14a00d8b26" data-kw="">

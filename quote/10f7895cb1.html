<blockquote><p>3. The charge of ‘false worship’ unexplained, is mere deceit:

1. Worship is so far false as it is contrary to the rule. Every sermon, prayer or sacrament which we administer has faultiness and sin and is so far ‘false worship’.

2. But worship offered God on pretence that He instituted it when He did not, or that man has authority to command the like, is yet worse false worship.

3. And the worship of false gods or idols, is yet worse than that, and abhorred of God.

4. His [a separatist] making all faulty circumstances, such as he names, to be idolatry, because ‘false’, as he calls it, is yet more sinful and of mischievous importance [than the above three items].</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/richard-baxter.html">Richard Baxter</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Schism Detected in both Extremes, or Two Sorts of Sinful Separation</cite>, … (London: 1684), pt. 2, p. 14</span></figcaption>

</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-f7398ec5b3" data-kw="">
<blockquote><p>…take heed that you not act like the weak in Rom. 14. Those who were weak in the Christian Faith (v. 1) held excessive religious strictures and scruples, especially in practical matters, however inconvenient (v. 2). Their simplistic beliefs determined their actions, which set them apart from other Christians. They prided themselves in their strict living, self-denial and high standard (v. 2), taking what they thought was righteous grief, offense and scandal at things actually lawful (vv. 20–21), they not thinking them best or godly enough (vv. 4–5). They spoke ill of their Christian brothers, judged them (vv. 3–4, 16, even Paul implicitly), whom they saw as worldly, licentious and not devoted enough, though their brethren were equally devoted (v. 6) and actually stronger and more understanding in the truth than they (v. 14). The weak’s distinctives exemplified misplaced priorities, valuing certain external practices they considered to be religiously necessary above their brethren’s fellowship, and hence also above the fundamentals of “righteousness, and peace, and joy in the Holy Ghost,” in which the kingdom of God consists. (v. 17) The weak practically valued what they considered to be sanctification, and that in others, above other Christians’ faith and justification (v. 18), that they are accepted with God forever in Christ, and He will make them stand. (v. 4) It was not only the strong, but the weak as well that were deficient in following “after the things which make for peace, and things wherewith one may edify another.” (v. 19) If such a weak person began to teach their distinctives and seek to bind them on others, would not he be sectarian?</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/travis-fentiman.html">Travis Fentiman</a></span><span class="wk"><span class="lbl">Work:</span> <cite>“Extended Editor’s Introduction” in English Puritans, A Refutation of the Errors of Separatists</cite>, (1604; RBO, 2025), pp. 185-86</span></figcaption>

</figure><figure class="quote" id="q-655d825017" data-kw="">
<blockquote><p>‘Ye shall not do’ (says Moses) ‘after all things, which we do here this day, every man, all that is right in his own eyes.’ [Dt. 12:8]… And the speech of Moses seems to mean the true service of God, which was not yet perfected, neither could be in their travels, as it was after in Canaan, vv. 10-11. Not that they sacrificed after their fancy (says the Geneva notes) but that God would be served more purely in the land of Canaan. Junius upon this place notes: ‘Etsi oblationum lex una semper fuit ab initi• praescripta a Deo, non potuit tamen usque adeo in ambulatoriis Israelitarum castris observari, ant summo jure ab illis exigi, prout ostendit; Antithesis, verse 11; vide Num, 28:6.’ The [Romanist] Douay divines, on the place, give this observation, ‘In the desert they could not observe the ceremonies of the Law, but coming to rest, they were bound to keep all one set form of holy rites.’ The conclusion from this text is that God is pleased to dispense with his people in his own prescribed worship, until, if He has appointed, determined, or appropriated a certain form, time and place, they have opportunity to serve Him at that time, in that place, and after that form.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/john-ball.html">John Ball</a></span><span class="wk"><span class="lbl">Work:</span> <cite>An Answer to Two Treatises of Mr. John Can, the Leader of the English Brownists in Amsterdam</cite>, … (London: R.B., 1642), ch. 1, section 4, p. 51</span></figcaption>

</figure><figure class="quote" id="q-e4fbc8bf29" data-kw="">
<blockquote><p>Though God in mercy can distinguish between his own and ours, and does not count the whole worship to be in vain where any degree of superstition is mixed (for then most zealous persons were undone), yet the superstitious part of worship is always in vain; And all the rest is made as vain where that is the predominant and denominating part. Thus overdoing is undoing, and thus the superstitious are (materially) righteous overmuch.</p></blockquote>

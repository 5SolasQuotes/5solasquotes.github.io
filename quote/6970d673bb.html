<main class="wrap"><figure class="quote" id="q-6970d673bb" data-kw="">
<blockquote><p>To cover or uncover the head in these places in the time of divine service is a ceremony; and therefore if the observation or non-observation of ceremonies be a superstition, he that uncovers not his head may be as superstitious as he who is bare-headed… …the other looks upon those plain words of the apostle, ‘Every man praying or prophesying, having his head covered, dishonours his head:’ and thinks he is obliged to it, as indeed he is, till the meaning of the text be otherwise cleared to him. The question then ought to be this, whether a man ought to be covered in the service of God? If uncovered, why do you jear at our bare-heads? If covered, why do you [Independents] not keep your own rule, but sit covered at one part of service, and uncovered at another? covered when a chapter is read and expounded; covered all the time of sermon… and yet uncovered again, at the singing of a psalm, at your extemporary prayers before and after sermon, at the administration of the sacraments. Tell me what privilege you have to dispense with this ceremony in one part of divine service more than another; Let it then be but considered who it is that speaks from heaven unto us, that in voce hominis tuba Dei, that it is God that speaks by man’s mouth, that the message is his, and man only the ambassador to deliver it; and then I think no man deserves a scoff that hears it with a bare head. When some of your party [of the Independents] were pressed with this argument, at last they came to this result that there was a necessity for all men to keep on their hats all the time of divine actions, more particularly at the time of the celebration of the sacrament. For this act was a right significant to the communicants of their table-honor and fellowship with Christ; also, that the minister at the celebration must be uncovered, and that in sign of his service to the communicants as the Lord’s much honored children, sitting covered when they eat of their father’s meat.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/william-nicholson.html">William Nicholson</a></span><span class="wk"><span class="lbl">Work:</span> <cite>An Apology for the Discipline of the Ancient Church: intended especially for that of our Mother, the Church of England: in Answer to the Admonitory Letter lately published (London, 1659), 3rd Part, section 6</cite>, pp. 187-8</span></figcaption>

</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-76622747c4" data-kw="">
<blockquote><p>Although certain ordinations of the apostles (which referred to the rites and circumstances of divine worship) were variable and instituted only for a time (as the sanction of not eating blood and of things strangled [Acts 15:20]; concerning the woman’s head being covered and the man’s being uncovered when they prophesy [1 Cor. 11:4, 5]) because there was a special cause and reason for them and (this ceasing) the institution itself ought to cease also; still there were others invariable and of perpetual observance in the church, none of which were founded upon any special occasion to last only for a time by which they might be rendered temporary…</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/francis-turretin.html">Francis Turretin</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Institutes, vol. 2, 11th Topic, The Law of God, 14th Question: The Lord’s Day</cite>, p. 95</span></figcaption>

</figure><figure class="quote" id="q-7ebfafd06a" data-kw="">
<blockquote><p>The evangelical ceremonies [in the NT] are either natural or instituted. The natural either common or proper. The common natural ceremonies of religion, are such as are equally used in civil and in religious matters, as bowing the knee, uncovering the head, and some other things which respect that civil order, reverence, and decency, which ought to be observed in the external (and especially in the public) worship of God. The proper are such as are not used but in the matters of religion. The instituted ceremonies of the Gospel strictly and properly taken in contradistinction to natural, and which are designed to be of perpetual use, are only the two Sacraments… yet in a large sense even natural ceremonies, and matters of real decency and order, that is such things as are ex natura rei, pro hic et nunc [from the nature of the thing, here and now], necessary hereunto, and acceptable in the worship of God, are instituted too, i.e. commanded either implicitly or explicitly; for nothing offered by man, especially in worship, which is not in obedience to God, by virtue of some command, is honorable or acceptable to God; but what God has commanded, He has thereby instituted. So then, the matter in hand will fall under the notion of a common, natural ceremony of religion, pertaining to the decency or reverence of God’s worship in the public assemblies of his saints.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/samuel-stoddon.html">Samuel Stoddon</a></span><span class="wk"><span class="lbl">Work:</span> <cite>An Essay on a Question Relating to Divine Worship viz. Whether it be Contrary to the Apostolical Laws of Decency &amp; Reverence for a Man to have his Head Covered in the Time &amp; Place of God’s Solemn Public Worship?: Affirmative. (London: Maxwell, 1682) 56 pp. ToC</cite>, pp. 3-4</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/worship/head-coverings-in-worship.html">Head Coverings in Worship</a></span></div>

</figure><figure class="quote" id="q-1dd061a1b1" data-kw="">
<blockquote><p>I answer: that for men to pray or prophesy with their heads covered, or with long hair, and women uncovered, were things in their own nature indifferent (unless you make it necessary, as a moral duty for men to pray or prophesy uncovered, and women contra; which no interpreters upon that text do) and yet the apostle enjoins the Corinthians so to do… …in the use of things indifferent; whereas there are at least five [rules] to that purpose: And by the same reason, that the apostle enjoins men to keep decency, he enjoins to keep order; and so other rules, concerning things indifferent. Does not the apostle complain of disorder in the Corinthians preaching covered? yet the contrary order was not necessary, but in itself indifferent.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/daniel-cawdrey.html">Daniel Cawdrey</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Vindiciæ clavium: or, A Vindication of the Keys of the Kingdom of Heaven, into the Hands of the Right Owners... (London, 1645), ch. 6</cite>, pp. 57-58</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/worship/head-coverings-in-worship.html">Head Coverings in Worship</a></span></div>

</figure><figure class="quote" id="q-fcc025fa63" data-kw="">
<blockquote><p>He lets them know that both these kinds of disorders are repugnant to the institution of God and the dictates of reason. But especially the latter of these practices is confuted here by an appeal to nature, which is a comprehensive topic, and you may understand by it the general dictate of natural reason, and the particular law of nature concerning distinction of sexes, as also usage and custom, which is a second nature… In a word, a man must not be like a woman either as to her veil and covering or as to her long and dressed hair, because he is taught otherwise by the law of reason, and by that of the sex, and even by the practice and custom of the soberest part of the world, which are all comprised in the large extent of the word ‘nature’ in this place of the apostle.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/john-edwards.html">John Edwards</a></span><span class="wk"><span class="lbl">Work:</span> <cite>An Enquiry into Four Remarkable Texts of the New Testament which Contain Some Difficulty in Them… (Cambridge, 1692), The 2nd Text Inquired into, 1 Cor. 11:14</cite>, pp. 135-36</span></figcaption>

<div class="actions"><button class="copy" data-copy="“He lets them know that both these kinds of disorders are repugnant to the institution of God and the dictates of reason. But especially the latter of these practices is confuted here by an appeal to nature, which is a comprehensive topic, and you may understand by it the general dictate of natural reason, and the particular law of nature concerning distinction of sexes, as also usage and custom, which is a second nature… In a word, a man must not be like a woman either as to her veil and covering or as to her long and dressed hair, because he is taught otherwise by the law of reason, and by that of the sex, and even by the practice and custom of the soberest part of the world, which are all comprised in the large extent of the word ‘nature’ in this place of the apostle.”

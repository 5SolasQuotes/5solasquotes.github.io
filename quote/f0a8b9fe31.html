<main class="wrap"><figure class="quote" id="q-f0a8b9fe31" data-kw="">
<blockquote><p>The liberty and edification of Christ’s people, the grand aim and end of Church power, are inconsistent with that exercise of it which ordains ecclesiastical holidays.

In drawing near to God in holy things, as emphatically as in other matters, “whatsoever is not of faith is sin.” It is of the very essence of acceptable worship, that men “be fully persuaded in their own minds,” and that the conscience, out of a sense of duty, lend its free and willing consent to the acts of worship, as authorized and required by that God who has a right to bind the conscience, and to lay upon it the sense of obligation.

The appointment of ecclesiastical holidays, as parts of worship addressed to God, is inconsistent with the right exercise of conscience in the matter; and that whether the conscience is offended and grieved by the introduction of human and uncommanded ordinances in Divine service, or whether the conscience, deluded and ignorant as to the sin, has no sense of the injury and wrong done to it.

In the one case,—if the conscience is hurt and aggrieved by the imposition, in a matter so nearly concerning it as God’s worship, of unwarranted and uncommanded rites, and is forced, although wounded and offended, to submit against its felt conviction, it is plain that here there can be no liberty left to it at all, but that its Christian rights and freedom in the very matter of approaching to God are trampled under foot.

The oppression upon the conscience in such a case is both great and painfully felt. But even in the other case,— when the conscience is not forced to stifle its own convictions, because no convictions of the wrong done to it are felt,—when, knowing them to be no more than human or ecclesiastical ordinances, they are yet made use of in God’s worship at the bidding of the Church, without any feeling of being offended by the unlawful imposition, still Christian liberty is taken away not the less, and the conscience is enthralled as much, or rather all the more, because it is unconscious of the thraldom.

That the conscience should be taught and trained, in a matter of conscience, to yield a passive and unconscious submission,—that in the very worship of God the conscience should be instructed to own the obligation, not of God’s authority, but of man’s,—that the act of religious service should be a homage, done, not to Christ, but to the Church,—this is to destroy true and intelligent liberty of conscience; and the deed is all the worse, and not the better, because the conscience is made to feel no wrong, but rather to love the yoke that binds it.

It matters not whether, in the appointment and observance of human and uncommanded days, as part of God’s worship, by ecclesiastical authority, the conscience of those on whom they are enforced feels the chain or not. In either case, the imposition is inconsistent with the true liberty wherewith Christ has made His people free.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/james-bannerman.html">James Bannerman</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Church of Christ: A Treatise on the Nature, Powers, Ordinances, Discipline, and Government of the Christian Church</cite>, ed. D. Douglas Bannerman (2 vols, Edinburgh: T &amp; T Clark, 1868), 1: 417-18.</span></figcaption>

</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-ba4f4a651c" data-kw="">
<blockquote><p>The most of the persons whom the Papists now keep holy days for were very religious godly people: And the zealous religious people of that age did think that the honoring of the memories of the martyrs was a great means to invite the infidels to Christianity and to encourage the weak to stick to Christ: and therefore they kept the days of their martyrdom in thanksgiving to God and in honor of them. The wicked of that age hated and persecuted both the martyrs and them that honored them. In the next age, religion being uppermost in the world, the wicked did turn hypocrites and keep holy days for the honor of their names whom their forefathers murdered. At last when it was observed that the Papists who burned the living saints were the greatest honorers of the dead, the most religious people turned quite to dislike and reject those very days which their predecessors had set up in thanksgiving to God for the doctrine, example and constancy of the martyrs.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/richard-baxter.html">Richard Baxter</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Cure of Church Divisions</cite>, … (London, 1670), pt. 1, Direction 58, ‘Take heed of superstition, and observe well the circular course of zealous superstition…’, p. 280</span></figcaption>

<blockquote><p>That they [Romanists] cry up a private, unproved, unwritten tradition of their own, as of equal authority with this safe and full rule, which is contained in this written Word of God. Their crime and fault may be considered, partly with respect to the object and matter; that these traditions are not indifferent customs, but essential points necessary to faith and christian practice. And so though a Christian be never so through and sound in his obedience to the Word of God, and true to the baptismal covenant, yet if he submits not to these unwritten traditions, he wants [lacks] some point necessary to faith and practice, and so to life eternal: which is contrary to Mark 16:16. “He that believes and is baptized, shall be saved; and he that believes not, shall be damned.” And John 17:3.” This is life eternal, to know you the only true God, and Jesus Christ whom you have sent.” Partly as to the subject, as they make their own faction to be the only keepers of these things; and that nothing is to be owned as apostolic tradition, but what is delivered as such by their authority; which is to leave the church to the tyranny and usurpation of a corrupt faction; to declare for apostolic tradition any thing which serves their end and interest, and for which no true historical evidence is produced. Now the unjust and fraudulent practices which they have used, to promote this usurpation over the churches of Christ, render them false men, most unfit to be trusted in this kind. Partly with respect to the manner, they will have these things to be received, pari reverentia et pietatis affectu, with the same reverence and pious affection with which we receive the Holy Scriptures; and so man’s post is set by God’s, and unproved traditions equaled with doctrines of faith. Their opinion is bad enough, but their practice is worse. For there they show they value these things more than the Scriptures. As superstition always abounds in its own things. Did ever any of their doctors [teachers] say the same things of traditions, which they take the boldness to say of Scripture? Did they ever call them pen and inkhorn, or parchment divinity, a nose of wax, a dumb rule, an obscure and ambiguous doctrine? These Blasphemies they vent boldly against the Scriptures: but did they ever speak these of traditions? And again, their common people are a thousand times better instructed in their traditions, than in the doctrine of salvation. They skill more of Lent, and Ember-weeks, etc. than they truly understand the doctrine of man’s misery and remedy. And call you this reverence and pious affection to the Scriptures and traditions? Partly because they would never give us a catalogue of unwritten traditions, necessary to be observed by all Christians; It may be lest they should amaze the people with the multitude of them, or else that the people may not know how many of their doctrines are destitute of Scripture proof, and so they plainly be discovered to be imposers on the belief of the Christian world.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/thomas-manton.html">Thomas Manton</a></span><span class="wk"><span class="lbl">Work:</span> <cite>XVIII Sermons on the Second Chapter of the 2nd Epistle to the Thessalonians</cite>, … (London, 1679), 340–42 [Spelling and punctuation modernized].</span></figcaption>

<blockquote><p>Article XI Concerning Things Commanded and Not Commanded Of self law (Autonomia) or power in the conscience, Relinquished to Christ alone in the church We confess that no one ought to command in any manner that which Christ has not commanded; also, therefore, no one ought to prohibit that which he has not forbidden (For it has been written,”Hear him.” Matt. 17:5; Luke 9:35; Deut. 18:18, 19; Acts 7:37). Of the Emptiness of the Precepts of the Popes, and Expressly Auricular Confession, Lenten Fasts, and Papal Feasts For this reason we do not hold as precepts, auricular confession, Lenten fasts, feast days of the saints, and things of that kind which have sprung up from men….</p></blockquote>

</figure><figure class="quote" id="q-19f44e6044" data-kw="">
<blockquote><p>Some make a mockery of the holy things of God. One part of the year they will be holy; a rotten, foolish affection of people that are popish. In Lent they will use a little austerity, oh! they will please God wondrously! but before and after they are devils incarnate. So they make that part of the year as a good parenthesis, in an unlearned and unwitty speech. A good parenthesis is unseemly in a wicked speech, and a good piece is unseemly in a ragged garment; so their lives that make a good show then (and there are few that do so, they are scarce among us; men are such atheists that there is not outward reformation, but if there be), if they give themselves leave to be civil, and to respect holy things a little time, afterward they return to their looseness again. Doth this patching out of a holy life please God? No, no! ‘I have sworn, and I will perform it, that I will keep thy righteous statutes,’ saith David, Ps. 119:106. And St Paul, ‘I have resolved to be so to the end;’ I will be myself still. So where grace is, there is a resolution against all sin for the time to come. If you entertain not this resolution, to walk ‘in holiness and righteousness all the days of your life,’ Luke 1:75, acknowledge no benefit by Christ’s redemption, and come not near the holy things of God.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/richard-sibbes.html">Richard Sibbes</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Complete Works of Richard Sibbes</cite>, vol. 3 (Edinburgh; London; Dublin: James Nichol; James Nisbet and Co.; W. Robertson, 1862), 313.</span></figcaption>

<blockquote><p>I. The first thing is, to inquire into the scripture-account of the character and duty of a faithful minister of Christ.

1. He is one who speaks the things which become sound doctrine, as the apostle exhorts Titus, chap. ii. 1. “But speak thou the things which become sound doctrine.” […] And in order to our thus speaking the things which become sound doctrine, it is necessary that we be well acquainted with the holy scriptures, with approven systems of divinity, and particularly with our own standards, our excellent Confession of Faith, and catechisms, which may well be called forms of sound words.</p></blockquote>

</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-6e13fc085d" data-kw="">
<blockquote><p>Conservatives argued that the Synod of Philadelphia was correct in interpreting the 1729 Adopting Act in terms of the ‘afternoon minute’ and the strict reinterpretation of 1736. Receiving and adopting the ‘system’ [a term used in 1788] of the [Westminster] Confession meant embracing the whole confession without exception, once the originally scrupled articles on the civil magistrate had been amended in 1788. A larger group of Presbyterians, recalling the original intent of the morning minute of 1729, believed the ‘system’ referred to the Confession’s Calvinistic doctrines; this body advocated the distinction between doctrines ‘essential’ to the system and those that were not. This was the spirit of the old Synod of New York. And there was a third small party, which held that ‘system of doctrine’ [in 1788] referred to the fundamental doctrines shared in common with all Christian churches. This minority expression drew inspiration from the 1729 language ‘systems of Christian doctrine’ [in the early morning session of the Adopting Act 1729]. Some of the early pre-1729 discussions about subscription had advocated this opinion, but, it ultimately had been rejected [Fortson claims] in the compromise of 1729. Nonetheless, a few voices would continue to herald a loose view of subscription which favored mere assent to catholic Christianity as the ‘substance’ of Westminster doctrines.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/s-donald-fortson-iii.html">S. Donald Fortson III</a></span><span class="wk"><span class="lbl">Work:</span> <cite>‘New School Calvinism &amp; the Presbyterian Creed’ in The Journal of Presbyterian History</cite>, (1997-), vol. 82, no. 4 (Winter 2004), pp. 221-43, p. 222</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/the-church/creeds-confessions-and-councils.html">Creeds, Confessions and Councils</a></span></div>

<blockquote><p>§40.

II. It is greatly needful to the well-being of the ministry and the success that doctrine be kept sound: And therefore:

      1. That the Christian simplicity be retained, and many subtle and curious decisions be not made necessary: A few great, necessary certain truths are easilier preserved than multitudes of uncertain controverted niceties.

      2. It is needful that such as are ordained ministers, be tried men, of sound understanding in that which they must teach and do, and therefore that both the ordainers and the hearers try them. This account of their understanding is better than the imposing of human forms upon them for subscription: Not but that teachers should know more than the flock, that is, than the essentials; nor that I presume to condemn all the Churches that impose their confessions to be subscribed in their own and not in Scripture-words, while they keep only to necessary, certain things: But I shall afterward prove that this way, though tolerable, is not best, but unnecessary and dangerous: 1. The Scripture affording us apt words enough to form our confessions in, which are past controversy; 2. and there being no probability of bounding men’s impositions of this kind, when once they set upon this way; 3. and most confessions of that nature now extant, having some needless words which other Churches or good Christians do dissent from:

      4. And the ancient Creeds understood (which the ordainers must try) and the old catechistical verities being sufficient to this use.

      5. And there being means of restraining men from preaching and vending heresies which are more safe and congruous.

      3. I add therefore that a certain confession containing the certainest and needfulest integrals of religion should or may well be drawn up as a law, forbidding all upon meet penalties to preach or speak against them, without any subscribing, promising or professing.

      4. And upon proof of the violating of such a law, and preaching against such articles it is sufficient that both the Church and the Christian magistrate in their several ways may judge them and by just penalties correct them (of which more after in due place). For it is very hard so to form long confessions (beyond the old creeds, Lord’s Prayer, Decalogue, and the general belief of Scripture) and this not in Scripture-terms, which shall not have some words which sound and honest Ministers cannot assent to (without lying, which they will not do): But to silence many words which yet we conceive true, and forbear speaking against some things which yet he cannot profess assent to, there are very few sober men but will do. And an error never spoken or written hurts not others, nor is to be judged, being not known; Non apparere here is as non esse. And if it be vended, the person may be judged as well as if he had sworn, subscribed or promised. And they that will tell us yet what evil may befall secret whispering errors without such oaths, subscriptions or promises, do by this over-doing dangerously undo; and lest man should be man and the Church imperfect, on pretence of avoiding a possible unavoidable hurt, they will set up knaves that will say any thing, shut out honest men, and necessitate divisions, confusions and persecutions, where they can never stop on this side banishing or killing or continued imprisoning multitudes of faithful men, and never the more attain their ends. Sound doctrine may be kept up as far as is to be hoped by the aforesaid means.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/richard-baxter.html">Richard Baxter</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The True &amp; only Way of Concord of all the Christian Churches, the Desirableness of it &amp; the Detection of False Dividing Terms</cite>, (London: Hancock, 1680), pt. 2, ch. 5, ‘What are the terms necessary to the office and exercise of the sacred ministry?’, pp. 222-23</span></figcaption>

<blockquote><p>…We have the apostles for authors of our doctrine, says Tertullian (Prescription against Heresies). He says also, It lies not in man’s power to determine any thing (in matters of faith) of his own head. Quamuis sanctus sit aliquis post Apostolos, etc. Howsoever holy, or eloquent a man be, says Jerome in Psalm 86, yet coming after the apostles he deserves no authentical credit. The Lord declares in Scriptures. … The last foundation of Romish faith is the preaching of mass-priests and friars. Quomodo Christus eius(que) doctrina (says Stapleton): Christianae religionis fundamentum est, sic alii nunc a Christo missi, eorumque doctrina, praedicatio, determinatio, fundamenti apud me vim et locum habebunt. As Christ and his doctrine is the foundation of Christian religion: so others now sent of Christ, and their doctrine, preaching, and determination shall in my opinion have the force and place of a foundation, says he. (Praetat ante relect princip. doctrin.)</p></blockquote>

<div class="actions"><button class="copy" data-copy="“…We have the apostles for authors of our doctrine, says Tertullian (Prescription against Heresies). He says also, It lies not in man’s power to determine any thing (in matters of faith) of his own head. Quamuis sanctus sit aliquis post Apostolos, etc. Howsoever holy, or eloquent a man be, says Jerome in Psalm 86, yet coming after the apostles he deserves no authentical credit. The Lord declares in Scriptures. … The last foundation of Romish faith is the preaching of mass-priests and friars. Quomodo Christus eius(que) doctrina (says Stapleton): Christianae religionis fundamentum est, sic alii nunc a Christo missi, eorumque doctrina, praedicatio, determinatio, fundamenti apud me vim et locum habebunt. As Christ and his doctrine is the foundation of Christian religion: so others now sent of Christ, and their doctrine, preaching, and determination shall in my opinion have the force and place of a foundation, says he. (Praetat ante relect princip. doctrin.)”

— Matthew Sutcliffe, A Full &amp; Round Answer to N.D., alias Robert Parsons, … the First [Book] contains a Defence of Queen Elizabeth’s most pious and happy government… (London: 1604), bk. 2, ch. 3, pp. 137-38">Copy</button><a class="share" href="https://x.com/intent/post?text=%E2%80%9C%E2%80%A6We+have+the+apostles+for+authors+of+our+doctrine%2C+says+Tertullian+%28Prescription+against+Heresies%29.+He+says+also%2C+It+lies+not+in+man%E2%80%99s+power+to+determine+any+thing+%28in+matters+of+faith%29+of+his+own+head.+Quamuis+sanctus+sit+aliquis+post+Apostolos%2C+etc.+Howsoever+holy%2C+or+eloquent+a+man+be%2C+says+Jerome+in+Psalm+86%2C+yet+coming+after+the+apostles+he+deserves+no+authentical+credit.+The+Lord+declares+in+Scriptures.+%E2%80%A6+The+last+foundation+of+Romish+faith+is+the+preaching+of+mass-priests+and+friars.+Quomodo+Christus+eius%28que%29+doctrina+%28says+Stapleton%29%3A+Christianae+religionis+fundamentum+est%2C+sic+alii+nunc+a+Christo+missi%2C+eorumque+doctrina%2C+praedicatio%2C+determinatio%2C+fundamenti+apud+me+vim+et+locum+habebunt.+As+Christ+and+his+doctrine+is+the+foundation+of+Christian+religion%3A+so+others+now+sent+of+Christ%2C+and+their+doctrine%2C+preaching%2C+and+determination+shall+in+my+opinion+have+the+force+and+place+of+a+foundation%2C+says+he.+%28Praetat+ante+relect+princip.+doctrin.%29%E2%80%9D%0A%0A%E2%80%94+Matthew+Sutcliffe%2C+A+Full+%26+Round+Answer+to+N.D.%2C+alias+Robert+Parsons%2C+%E2%80%A6+the+First+%5BBook%5D+contains+a+Defence+of+Queen+Elizabeth%E2%80%99s+most+pious+and+happy+government%E2%80%A6+%28London%3A+1604%29%2C+bk.+2%2C+ch.+3%2C+pp.+137-38&amp;url=https%3A%2F%2F5solasquotes.github.io%2Fquote%2F0d5a70fe58.html&amp;via=5Solas" target="_blank" rel="noopener">Share on X</a><a class="perma" href="../quote/0d5a70fe58.html">Permalink</a><a class="src" href="https://reformedbooksonline.com/on-subscription-to-confessions-by-church-officers/#:~:text=We%20have%20the%20apostles%20for%20authors,he.%20%28Praetat%20ante%20relect%20princi <blockquote><p>For the three early centuries the Church was entirely without it. The members of the Church made a profession of their faith at baptism. But this was in the simplest form; it was not a precautionary assent to a variety of intellectual propositions, but a profession of service under a new Master, and of entrance into a new life. No deacon, no presbyter, no bishop, made any subsequent profession. The distinction between the requirements of belief from clergy and from laity was as yet wholly unknown. The first subscription to a series of dogmatical propositions as such, was that enforced by Constantine at the Council of Nicea. It was the natural but rude expedient of a half-educated soldier to enforce unanimity in the Church, as he had by the sword enforced it in the empire. It was accompanied then by the same casuistry, by the same ambiguity, by the same inoperative results as at present [in the Church of England]. At each [subsequent] council the same process was repeated by the bishops who were present. But the practice, as far as appears, never extended to the clergy generally or to the laity; and, as it was then in the Ancient Church, so on the whole has it been in those portions of Christendom which have clung most tenaciously to Catholic usages, and been most steadfast in the defence of Orthodoxy. The Roman Catholic clergy and the clergy of the Eastern Church neither formerly nor now are bound by any definite forms of subscription. The unity of the State is preserved everywhere, not by preliminary promises or oaths, but by the general laws of discipline and order, and by the general public sentiment of the whole community.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/arthur-p-stanley.html">Arthur P. Stanley</a></span><span class="wk"><span class="lbl">Work:</span> <cite>A Letter to the Lord Bishop of London on the State of Subscription</cite>, (Oxford: Henry &amp; Parker, 1863), pp. 35-36</span></figcaption>

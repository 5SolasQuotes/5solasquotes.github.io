</figure><figure class="quote" id="q-6b9349f83f" data-kw="sufficiency">
<blockquote><p>The question is not whether all those things are taught in Scripture word for word (autolexei), or immediately and expressly. We acknowledge that many things are to be deduced by legitimate inference and to be considered as the word of God. But the question is whether they are so contained in Scripture, be they expressly in it or derivable from it by legitimate inference, that there is no need of another and an unwritten (agraphō) rule of faith from which to derive matters of religion and salvation.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/francis-turretin.html">Francis Turretin</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Institutes of Elenctic Theology</cite>, 2.16.3</span></figcaption>

<blockquote><p>II. Those give too much (in bulk, but too little in virtue) to the Scriptures: 1. Who would set them up instead of the whole Law, and Light of Nature, as excluding this, as useless where the Scripture is. 2. And they that feign it to be instead of all grammars, logic, philosophy, and all other arts and sciences, and to be a perfect particular rule for every ruler, lawyer, physician, mariner, architect, husbandman and tradesman, to do his work by. 3. And they that feign it to be fully sufficient to all men to prove its own authority and truth, without the subsidiary use of that Church-history and tradition, which tells us the supposed matters of fact and must help us to know what books are canonical and what not; and without historical evidence that these are the true books which the prophets and apostles wrote and the miracles and providences which have attested them. 4. And those that think that it is sufficient for its own promulgation, or the peoples instruction, without the ministry of man to preserve, deliver, translate, expound and preach it to the people. 5. And those that think it sufficient to sanctify men, without the concourse of the Spirit’s illumination, vivification and inward operation to that end. 6. And they that say that no man can be saved by the knowledge, belief, love and practice of all the substantial parts of Christianity brought to him by tradition, parents or preachers, who tell him nothing of the Scriptures, but deliver him the doctrines as attested by miracles and the Spirit without any notice of the Book. 7. And those that say that Scripture alone must be made use of as to all the history of Scripture-times, and that it is unlawful to make use of any other historians, (as Josephus and such others). 8. And they that say, no other books of divinity but Scripture are useful, yea, or lawful to be read of Christians; or at least in the Church. 9. And they that say that the Scriptures are so divine, not only in matter, but in method and style, as that there is nothing of human (inculpable [blameless]) imperfection or weakness in them. 10. And those that say that the logical method and the phrase is as perfect as God was able to make them. 11. And they that say that all passages in Scripture historically related are moral truths: and so make the Devil’s words to Eve, of Job, to Christ, etc. to be all true. 12. And they that say that all passages in the Scripture were equally obligatory to all other places and ages, as to those that first received them (as the kiss of peace, the veils of women, washing feet, anointing the sick, deaconesses, etc.) 13. And they that make Scripture so perfect a rule to our belief that nothing is to be taken for certain, that comes to us any other way (as natural knowledge or historical). 14. And those that think men may not translate the Scripture, turn the Psalms into metre, tune them, divide the Scripture into chapters and verses, etc. as being derogatory alterations of the perfect Word. 15. And those that think it so perfect a particular rule of all the circumstances, modes, adjuncts and external expressions of and in God’s worship, as that no such may be invented or added by man, that is not there prescribed: as time, place, vesture [clothing, such as a grave garment], gesture, utensils, methods, words, and many other things, mentioned before. 16. And those that Jewishly feign a multitude of unproved mysteries to lie in the letters, orders, numbers and proper names in Scriptures (though I deny not that there is much mystery which we little observe). 17. They that say that the Scripture is all so plain that there is no obscure or difficult passages in them, which men are in danger of wresting to their own destruction. 18. And they that say that all in the Scripture is so necessary to salvation (even the darkest prophecies) that they cannot be saved that understand them not all; or at least endeavor not studiously and particularly to understand them. 19. And they that say that every book and text must of necessity to salvation be believed to be canonical and true. 20. And those that say that God has so preserved the Scripture, as that there are no various readings and doubtful texts thereupon, and that no written or printed copies have been corrupted (when Dr. Heylin tells us that the King’s printer printed the Seventh Commandment, ‘Thou shalt commit adultery’); all these err in over-doing. … IV. The dangers of over-doing here are these: 1. It leads to downright infidelity: for when men find that the Scripture is imperfect or wanting in that which they fancy to be part of its perfection, and to be really insufficient, e.g. to teach men physics, logic, medicine, languages, etc. they will be apt to say, ‘It is not of God, because it has not that which it pretends to have.’ 2. God is made the author of defects and imperfections. 3. The Scripture is exposed to the scorn and confutation of infidels. 4. Papists are assisted in proving its imperfection. But I must stop, having spoke to this point before in Question 35 and partly Question 30 &amp; 31 &amp; 33 more at large.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/richard-baxter.html">Richard Baxter</a></span><span class="wk"><span class="lbl">Work:</span> <cite>A Christian Directory... (1673), Part 3, Question 166, ‘Who be they that give too little to the Scriptures, and who too much; and what is the danger of each extreme?’</cite>, pp. 912-13</span></figcaption>

ure-times%2C+and+that+it+is+unlawful+to+make+use+of+any+other+historians%2C+%28as+Josephus+and+such+others%29.+8.+And+they+that+say%2C+no+other+books+of+divinity+but+Scripture+are+useful%2C+yea%2C+or+lawful+to+be+read+of+Christians%3B+or+at+least+in+the+Church.+9.+And+they+that+say+that+the+Scriptures+are+so+divine%2C+not+only+in+matter%2C+but+in+method+and+style%2C+as+that+there+is+nothing+of+human+%28inculpable+%5Bblameless%5D%29+imperfection+or+weakness+in+them.+10.+And+those+that+say+that+the+logical+method+and+the+phrase+is+as+perfect+as+God+was+able+to+make+them.+11.+And+they+that+say+that+all+passages+in+Scripture+historically+related+are+moral+truths%3A+and+so+make+the+Devil%E2%80%99s+words+to+Eve%2C+of+Job%2C+to+Christ%2C+etc.+to+be+all+true.+12.+And+they+that+say+that+all+passages+in+the+Scripture+were+equally+obligatory+to+all+other+places+and+ages%2C+as+to+those+that+first+received+them+%28as+the+kiss+of+peace%2C+the+veils+of+women%2C+washing+feet%2C+anointing+the+sick%2C+deaconesses%2C+etc.%29+13.+And+they+that+make+Scripture+so+perfect+a+rule+to+our+belief+that+nothing+is+to+be+taken+for+certain%2C+that+comes+to+us+any+other+way+%28as+natural+knowledge+or+historical%29.+14.+And+those+that+think+men+may+not+translate+the+Scripture%2C+turn+the+Psalms+into+metre%2C+tune+them%2C+divide+the+Scripture+into+chapters+and+verses%2C+etc.+as+being+derogatory+alterations+of+the+perfect+Word.+15.+And+those+that+think+it+so+perfect+a+particular+rule+of+all+the+circumstances%2C+modes%2C+adjuncts+and+external+expressions+of+and+in+God%E2%80%99s+worship%2C+as+that+no+such+may+be+invented+or+added+by+man%2C+that+is+not+there+prescribed%3A+as+time%2C+place%2C+vesture+%5Bclothing%2C+such+as+a+grave+garment%5D%2C+gesture%2C+utensils%2C+methods%2C+words%2C+and+many+other+things%2C+mentioned+before.+16.+And+those+that+Jewishly+feign+a+multitude+of+unproved+mysteries+to+lie+in+the+letters%2C+orders%2C+numbers+and+proper+names+in+Scriptures+%28though+I+deny+not+that+there+is+much+mystery+which+we+little+observe%29.+17.+They+that+say+that+the+Scripture+is+all+so+plain+that+there+is+no+obscure+or+difficult+passages+in+them%2C+which+men+are+in+danger+of+wresting+to+their+own+destruction.+18.+And+they+that+say+that+all+in+the+Scripture+is+so+necessary+to+salvation+%28even+the+darkest+prophecies%29+that+they+cannot+be+saved+that+understand+them+not+all%3B+or+at+least+endeavor+not+studiously+and+particularly+to+understand+them.+19.+And+they+that+say+that+every+book+and+text+must+of+necessity+to+salvation+be+believed+to+be+canonical+and+true.+20.+And+those+that+say+that+God+has+so+preserved+the+Scripture%2C+as+that+there+are+no+various+readings+and+doubtful+texts+thereupon%2C+and+that+no+written+or+printed+copies+have+been+corrupted+%28when+Dr.+Heylin+tells+us+that+the+King%E2%80%99s+printer+printed+the+Seventh+Commandment%2C+%E2%80%98Thou+shalt+commit+adultery%E2%80%99%29%3B+all+these+err+in+over-doing.+%E2%80%A6+IV.+The+dangers+of+over-doing+here+are+these%3A+1.+It+leads+to+downright+infidelity%3A+for+when+men+find+that+the+Scripture+is+imperfect+or+wanting+in+that+which+they+fancy+to+be+part+of+its+perfection%2C+and+to+be+really+insufficient%2C+e.g.+to+teach+men+physics%2C+logic%2C+medicine%2C+languages%2C+etc.+they+will+be+apt+to+say%2C+%E2%80%98It+is+not+of+God%2C+because+it+has+not+that+which+it+pretends+to+have.%E2%80%99+2.+God+is+made+the+author+of+defects+and+imperfections.+3.+The+Scripture+is+exposed+to+the+scorn+and+confutation+of+infidels.+4.+Papists+are+assisted+in+proving+its+imperfection.+But+I+must+stop%2C+having+spoke+to+this+point+before+in+Question+35+and+partly+Question+30+%26+31+%26+33+more+at+large.%E2%80%9D%0A%0A%E2%80%94+Richard+Baxter%2C+A+Christian+Directory...+%281673%29%2C+Part+3%2C+Question+166%2C+%E2%80%98Who+be+they+that+give+too+little+to+the+Scriptures%2C+and+who+too+much%3B+and+what+is+the+danger+of+each+extreme%3F%E2%80%99%2C+pp.+912-13&amp;url=https%3A%2F%2F5solasquotes.github.io%2Fquote%2Fc04bcda648.html&amp;via=5Solas" target="_blank" rel="noopener">Share on X</a><a class="perma" href="../quote/c04bcda648.html">Permalink</a><a class="src" href="https://reformedbooksonline.com/the-sufficiency-of-scripture/#:~:text=II.%20Those%20give%20too%20much%20%28in,31%20%26%2033%20more%20at%20large&amp;text=II.%20Those%20give%20too%20much%20%28in%20bulk%2C%20but&amp;text=30%20%26%2031%20%26%2033%20more%20at%20large" rel="noopener" target="_blank">Read it online · Reformed Books Online</a></div>

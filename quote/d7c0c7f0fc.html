<main class="wrap"><figure class="quote" id="q-d7c0c7f0fc" data-kw="">
<blockquote><p>The refusal of the reprobate to obey the word of God when manifested to them, will be properly ascribed to the malice and depravity of their hearts, provided it be at the same time added that they were adjudged to this depravity, because they were raised up by the just but inscrutable judgment of God, to show forth his glory by their condemnation.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/john-calvin.html">John Calvin</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Institutes of the Christian Religion</cite>, 3.24.14</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/reprobation/hardening.html">Hardening</a> › <a href="../topics/reprobation/hardening/judicial-hardening.html">Judicial hardening</a></span><span class="t"><a href="../topics/reprobation/hardening.html">Hardening</a> › <a href="../topics/reprobation/hardening/the-instances-of-pharaoh-and-esau.html">The instances of Pharaoh and Esau</a></span><span class="t"><a href="../topics/reprobation/reprobation-and-the-free-offer.html">Reprobation and the Free Offer</a> › <a href="../topics/reprobation/reprobation-and-the-free-offer/the-inexcusability-of-those-who-refuse.html">The inexcusability of those who refuse</a></span></div>

</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-c71e2bebb7" data-kw="Author of sin Hardening Justice Depravity">
<blockquote><p>Yes, there is even in ourselves sin and corruption enough, so that there is no need that God should infuse into us either a new or greater measure of wickedness. Therefore, when God is said in the Scripture to harden (Ex. 7:13), to blind (John 12:40) and to deliver us up into a reprobate sense (Rom. 1:28), it is to be understood that God does it by just judgment, as a just judge and avenger.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/heinrich-bullinger.html">Heinrich Bullinger</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Second Helvetic Confession</cite>, 1566, ch. 8</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/reprobation/hardening.html">Hardening</a> › <a href="../topics/reprobation/hardening/permission-and-hardening.html">Permission and hardening</a></span><span class="t"><a href="../topics/the-decrees-of-god/decree-and-sin.html">Decree and Sin</a> › <a href="../topics/the-decrees-of-god/decree-and-sin/god-does-not-put-evil-into-mens-hearts.html">God does not put evil into men&#x27;s hearts</a></span></div>
<div class="actions"><button class="copy" data-copy="“Yes, there is even in ourselves sin and corruption enough, so that there is no need that God should infuse into us either a new or greater measure of wickedness. Therefore, when God is said in the Scripture to harden (Ex. 7:13), to blind (John 12:40) and to deliver us up into a reprobate sense (Rom. 1:28), it is to be understood that God does it by just judgment, as a just judge and avenger.”

— Heinrich Bullinger, The Second Helvetic Confession, 1566, ch. 8">Copy</button><a class="share" href="https://x.com/intent/post?text=%E2%80%9CYes%2C+there+is+even+in+ourselves+sin+and+corruption+enough%2C+so+that+there+is+no+need+that+God+should+infuse+into+us+either+a+new+or+greater+measure+of+wickedness.+Therefore%2C+when+God+is+said+in+the+Scripture+to+harden+%28Ex.+7%3A13%29%2C+to+blind+%28John+12%3A40%29+and+to+deliver+us+up+into+a+reprobate+sense+%28Rom.+1%3A28%29%2C+it+is+to+be+understood+that+God+does+it+by+just+judgment%2C+as+a+just+judge+and+avenger.%E2%80%9D%0A%0A%E2%80%94+Heinrich+Bullinger%2C+The+Second+Helvetic+Confession%2C+1566%2C+ch.+8&amp;url=https%3A%2F%2F5solasquotes.github.io%2Fquote%2Fc71e2bebb7.html&amp;via=5Solas" target="_blank" rel="noopener">Share on X</a><a class="perma" href="../quote/c71e2bebb7.html">Permalink</a><a class="src" href="https://www.ccel.org/creeds/helvetic.htm" rel="noopener" target="_blank">Read it online · CCEL</a></div>
</figure><figure class="quote" id="q-276fa7e7b7" data-kw="Hardening Original Sin Depravity">
<blockquote><p>Thus God is said to harden men, not by positive hardening, or working anything in the creature, but by not working, not softening, leaving a man to the hardness of his own heart, whereby it is unavoidable, by the depravation of man’s nature, and the fury of his passions, but that he should be further hardened. … If you put fire near to wax or resin, both will melt; but when the fire is removed, they return to their natural quality of hardness and brittleness. The positive act of the fire is to melt and soften, and the softness of the rosin is to be ascribed to that, but the hardness is from the resin itself, wherein the fire hath no influence, but only a negative act by a removal of it; so when God hardens a man, he only leaves him to that stony heart which he derived from Adam, and brought with him into the world.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/stephen-charnock.html">Stephen Charnock</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Existence and Attributes of God</cite>, Discourse on the Holiness of God</span></figcaption>

</figure><figure class="quote" id="q-c93619138f" data-kw="Hardening Justice Satan">
<blockquote><p>As for those wicked and ungodly men whom God, as a righteous judge, for former sins, doth blind and harden; from them He not only withholdeth his grace, whereby they might have been enlightened in their understandings, and wrought upon in their hearts; but sometimes also withdraweth the gifts which they had, and exposeth them to such objects as their corruption makes occasions of sin; and withal, gives them over to their own lusts, the temptations of the world, and the power of Satan.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/westminster-assembly.html">Westminster Assembly</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Westminster Confession of Faith</cite>, 5.6</span></figcaption>

</figure><figure class="quote" id="q-215040d6fd" data-kw="Author of sin Justice Satan The Fall">
<blockquote><p>Just as he that wishes to punish someone by fumigating with a foul smell, sulfur and dung, does not put a foul smell into the sulfur and dung (it already is there), so God, when He punishes sins through the devil and the vessels of wrath with sins, does not put any sin into them, but it is there naturally since the fall in the devil and in men (Eph. 4; Rom. 1).</p></blockquote>

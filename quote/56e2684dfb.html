<blockquote><p>So then in this article [of the Creed] we confess that all the faithful dispersed throughout the whole compass of the earth, and they also that at this time live in Heaven, as many, I say, as are already saved, or shall even until the very end of the world be born to be saved, are one body, having gotten fellowship and participation with God and a mutual communion among themselves.</p></blockquote>

</figure><figure class="quote" id="q-ebc8cf72cc" data-kw="">
<blockquote><p>They sympathize with the condition of all distressed saints, wherever they are, and thereby hold communion with all saints in the world, all Churches of Christ throughout the universe. And from this compassion and love it is, that they feel an ineffable pleasure and satisfaction in their souls whenever they understand and hear of, or behold the success of the family of God, the prosperity of his people, and the spreading of his kingdom in the world. … Those that hold communion with God and his Son Jesus Christ… do necessarily maintain a Communion and Society with those that are the children of God, and the members of Jesus Christ… …When Peter was cast into prison, ‘Prayer was made without ceasing of the Church unto God for him,’ Acts 12:5. There is a continual stock of prayers, a common bank, whereby a constant traffic and exchange is kept up among the saints. This is called by the apostle, ‘supplication for all saints,’ Eph. 6:18, whereby they are ever partaking of the benefit of the petitions and addresses that are put up to the Divine Majesty throughout the whole world. And accordingly the fellowship of all Christians dispersed over the whole earth is preserved.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/john-edwards.html">John Edwards</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Theologia Reformata: or the Body &amp; Substance of the Christian Religion… (London: 1713), ‘The Latter Part of the 9th Article, Namely, the Communion of Saints, where the Nature of this Communion is Explained…’</cite>, pp. 747-48</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/the-church/communion-of-saints.html">Communion of Saints</a></span></div>

<blockquote><p>I. There is a communion of converse, and communion of affection… And there may be communion of affection, where there is no converse. Nay, there is, as it were, planted in morality, an affection of one excellent person to another. A valiant man loves a valiant man, though he never came near him. A scholar loves a scholar, that he has only heard of. Much more is such an affection planted in true Christianity in a heart truly religious, be he who he will, where he will; though he never saw him. As, ‘My delight is in the saints, and excellent on the earth,’ (Ps. 16:3) be they far off or near. II. There is communion in ‘common interest,’ where, it may be, there is not communion in coomon converse. Those that never saw or heard of one another to converse together, yet may have communion in common interest. Englishmen meeting beyond sea, that never saw each other before, yet will take parts, and side together, as in the common interest of being countrymen. There is a common interest in all the saints in the world, though at their never so great distance and separation, viz. glorifying God, and loving the Lord Jesus. As the apostle says, 1 Jn. 1:3, ‘Our fellowship is with the Father, and with his Son Jesus Christ.’… This is the special center, in which saints meet, be they never so far asunder. And in this sense, their ‘gathering together,’ is to be understood (of which there is so frequent mention); not into one place; but into this one circle of loving, fearing, serving God; Zeph. 3:9, ‘That they may call upon the name of the Lord, and serve Him with one consent.’ In the Hebrew it is, ‘with one shoulder;’ as if many were together shouldering up the same weight or burden: all in their places jointly putting-to their endeavor to bear up the name, glory and honor, of God: east, west, north, south, every saint joining in this great work, and meeting in this holy point. As the twelve oxen under the brazen sea, their face to the four quarters of heaven, but their bodies all meeting to bear up the weight. Now, III. They that are all of the same mind, all meet in this common interest towards God, cannot but love one another, though they know not one another. ‘My heart’ (says Deborah) ‘is towards the governors of Israel, that offered themselves willingly among the people.’ (Judges 5:9) Did she know all their faces and persons? Could she call them by their names? No, but she could not but love them, be they who they would, that put-to their hands and shoulders to that common cause. We see, how men are ready to affect any that they hear to be of their opinion, humor and mind, though they never saw them. Much more does a saint love a saint, that is partner with him in this holy work. Though he knew not where to find him, or name him; yet if he be for God, he must have his heart; and loving God, he cannot but love whosoever loves Him. IV. Accordingly they sympathize one with another; ‘Whether one member suffer, all the members suffer with it; or one member be honored, all the members rejoice with it.’ (1 Cor. 12:26)… It grieves a saint, if it be ill with any saint in the world; and he rejoices , if it go well with him. His heart is touched with his case, as with his own. As we are affected with the well or ill doing of any Englishman in any part of the world, for common interest of country’s sake. Neh. 1:4, “And it came to pass, when I heard these words, that I sat down, and wept, and mourned certain days, and fasted, and prayed before the God of heaven.’ ‘Why Nehemiah? thou are well enough; thou art in place of honor, pleasure, preferment.’–‘Oh! but it is ill with the people of God.’–And, Ps. 137:5-6, says the Psalmist, ‘If I forget thee, O Jerusalem, let my right hand forget her cunning. If I do not remember thee, let my tongue cleave to the roof of my mouth, if I prefer not Jerusalem above my chief joy:’ I can never forget Jerusalem. V. Answerably, they have one another’s prayers. There is not a saint in the world, but has the prayers of all the saints in the world. Any child of God makes it conscience to pray for every child of God on earth. One member cannot but do its best for another. ‘And as many as walk according to this rule, Peace be on them, and mercy, and upon the Israel of God.’ (Gal. 6:16) ‘Pray for thyself, Paul, and for thine own churches’–‘Nay, but every saint wherever is a member of the same body that I am of; and, therefore, I must pray for them also.’ So Eph. 6:24, ‘Grace be with all them, that love our Lord Jesus Christ in sincerity.’ I love Christ, and cannot but love and pray for all that love Him.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/john-lightfoot.html">John Lightfoot</a></span><span class="wk"><span class="lbl">Work:</span> <cite>3. ‘The Communion of Saints’ in An Exposition of Three Articles… (d. 1675)</cite>, pp. 80-82</span></figcaption>

lder%3B%E2%80%99+as+if+many+were+together+shouldering+up+the+same+weight+or+burden%3A+all+in+their+places+jointly+putting-to+their+endeavor+to+bear+up+the+name%2C+glory+and+honor%2C+of+God%3A+east%2C+west%2C+north%2C+south%2C+every+saint+joining+in+this+great+work%2C+and+meeting+in+this+holy+point.+As+the+twelve+oxen+under+the+brazen+sea%2C+their+face+to+the+four+quarters+of+heaven%2C+but+their+bodies+all+meeting+to+bear+up+the+weight.+Now%2C+III.+They+that+are+all+of+the+same+mind%2C+all+meet+in+this+common+interest+towards+God%2C+cannot+but+love+one+another%2C+though+they+know+not+one+another.+%E2%80%98My+heart%E2%80%99+%28says+Deborah%29+%E2%80%98is+towards+the+governors+of+Israel%2C+that+offered+themselves+willingly+among+the+people.%E2%80%99+%28Judges+5%3A9%29+Did+she+know+all+their+faces+and+persons%3F+Could+she+call+them+by+their+names%3F+No%2C+but+she+could+not+but+love+them%2C+be+they+who+they+would%2C+that+put-to+their+hands+and+shoulders+to+that+common+cause.+We+see%2C+how+men+are+ready+to+affect+any+that+they+hear+to+be+of+their+opinion%2C+humor+and+mind%2C+though+they+never+saw+them.+Much+more+does+a+saint+love+a+saint%2C+that+is+partner+with+him+in+this+holy+work.+Though+he+knew+not+where+to+find+him%2C+or+name+him%3B+yet+if+he+be+for+God%2C+he+must+have+his+heart%3B+and+loving+God%2C+he+cannot+but+love+whosoever+loves+Him.+IV.+Accordingly+they+sympathize+one+with+another%3B+%E2%80%98Whether+one+member+suffer%2C+all+the+members+suffer+with+it%3B+or+one+member+be+honored%2C+all+the+members+rejoice+with+it.%E2%80%99+%281+Cor.+12%3A26%29%E2%80%A6+It+grieves+a+saint%2C+if+it+be+ill+with+any+saint+in+the+world%3B+and+he+rejoices+%2C+if+it+go+well+with+him.+His+heart+is+touched+with+his+case%2C+as+with+his+own.+As+we+are+affected+with+the+well+or+ill+doing+of+any+Englishman+in+any+part+of+the+world%2C+for+common+interest+of+country%E2%80%99s+sake.+Neh.+1%3A4%2C+%E2%80%9CAnd+it+came+to+pass%2C+when+I+heard+these+words%2C+that+I+sat+down%2C+and+wept%2C+and+mourned+certain+days%2C+and+fasted%2C+and+prayed+before+the+God+of+heaven.%E2%80%99+%E2%80%98Why+Nehemiah%3F+thou+are+well+enough%3B+thou+art+in+place+of+honor%2C+pleasure%2C+preferment.%E2%80%99%E2%80%93%E2%80%98Oh%21+but+it+is+ill+with+the+people+of+God.%E2%80%99%E2%80%93And%2C+Ps.+137%3A5-6%2C+says+the+Psalmist%2C+%E2%80%98If+I+forget+thee%2C+O+Jerusalem%2C+let+my+right+hand+forget+her+cunning.+If+I+do+not+remember+thee%2C+let+my+tongue+cleave+to+the+roof+of+my+mouth%2C+if+I+prefer+not+Jerusalem+above+my+chief+joy%3A%E2%80%99+I+can+never+forget+Jerusalem.+V.+Answerably%2C+they+have+one+another%E2%80%99s+prayers.+There+is+not+a+saint+in+the+world%2C+but+has+the+prayers+of+all+the+saints+in+the+world.+Any+child+of+God+makes+it+conscience+to+pray+for+every+child+of+God+on+earth.+One+member+cannot+but+do+its+best+for+another.+%E2%80%98And+as+many+as+walk+according+to+this+rule%2C+Peace+be+on+them%2C+and+mercy%2C+and+upon+the+Israel+of+God.%E2%80%99+%28Gal.+6%3A16%29+%E2%80%98Pray+for+thyself%2C+Paul%2C+and+for+thine+own+churches%E2%80%99%E2%80%93%E2%80%98Nay%2C+but+every+saint+wherever+is+a+member+of+the+same+body+that+I+am+of%3B+and%2C+therefore%2C+I+must+pray+for+them+also.%E2%80%99+So+Eph.+6%3A24%2C+%E2%80%98Grace+be+with+all+them%2C+that+love+our+Lord+Jesus+Christ+in+sincerity.%E2%80%99+I+love+Christ%2C+and+cannot+but+love+and+pray+for+all+that+love+Him.%E2%80%9D%0A%0A%E2%80%94+John+Lightfoot%2C+3.+%E2%80%98The+Communion+of+Saints%E2%80%99+in+An+Exposition+of+Three+Articles%E2%80%A6+%28d.+1675%29%2C+pp.+80-82&amp;url=https%3A%2F%2F5solasquotes.github.io%2Fquote%2Fe1fee7694e.html&amp;via=5Solas" target="_blank" rel="noopener">Share on X</a><a class="perma" href="../quote/e1fee7694e.html">Permalink</a><a class="src" href="https://reformedbooksonline.com/on-the-communion-of-the-saints/#:~:text=I.%20There%20is%20a%20communion%20of,pray%20for%20all%20that%20love%20Him." rel="noopener" target="_blank">Read it online · Reformed Books Online</a></div>

<blockquote><p>How vast the fellowship! With the saints of all ages in the past! With the saints of all ages in the future! With the church eternal in glory! How comforting! We are not alone in our work, in our trials, in our hopes! Millions uncounted have been working for us, praying for us, rejoicing over us! Millions uncounted of hearts are now beating in unison with ours! Millions uncounted are to follow us, for whom we are even now transmitting the riches of grace.</p></blockquote>

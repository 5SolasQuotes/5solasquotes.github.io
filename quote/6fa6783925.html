<blockquote><p>The time of the creation, as here I take it in general, is not only the first moment of time, as in this [first] verse it signifies, but also the six days mentioned distinctly in the rest of the chapter. For the highest heaven, and the rude matter, the earth, were created in the first moment of time, and all other things in the space of six days, as the history most plainly teaches… …or if I incline to any opinion concerning the time of the year, it is that the world was created in the Spring, when the day and night are equal and both of one length in all the world, that is, in the month [Hebrew] Abib, which is part of March and part of April.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/george-walker.html">George Walker</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The History of the Creation as it is Written by Moses in the First &amp; Second Chapters of Genesis: Plainly Opened &amp; Expounded in Several Sermons</cite>, … (London: Barlet, 1641), Of the Creation of the World, ch. 1, pp. 7-8. See also p. 6 for more similar context.</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/creation/the-six-days.html">The Six Days</a></span></div>

</figure><figure class="quote" id="q-bf633d9870" data-kw="">
<blockquote><p>It must first be reiterated that with extraordinary few exceptions no educated person in the history of Western Civilization from the third century B.C. onward believed that the earth was flat. A round earth appears at least as early as the sixth century BC with Pythagoras, who was followed by Aristotle, Euclid, and Aristarchus, among others in observing that the earth was a sphere. Although there were a few dissenters–Leukippos and Demokritos for example–by the time of Eratosthenes (3 c. BC), followed by Crates(2 c. BC), Strabo (3 c. BC), and Ptolemy (first c. AD), the sphericity of the earth was accepted by all educated Greeks and Romans. Nor did this situation change with the advent of Christianity. A fewóat least two and at most five–early Christian fathers denied the spherically of earth by mistakenly taking passages such as Ps. 104:2-3 as geographical rather than metaphorical statements. On the other side tens of thousands of Christian theologians, poets, artists, and scientists took the spherical view throughout the early, medieval, and modern church… No one before the 1830s believed that medieval people thought that the earth was flat… But now, why did the false accounts of Letronne and Irving become melded and then, as early as the 1860s, begin to be served up in schools and in schoolbooks as the solemn truth? The answer is that the falsehood about the spherical earth became a colorful and unforgettable part of a larger falsehood: the falsehood of the eternal war between science (good) and religion (bad) throughout Western history… The reason for promoting both the specific lie about the sphericity of the earth and the general lie that religion and science are in natural and eternal conflict in Western society, is to defend Darwinism. The answer is really only slightly more complicated than that bald statement. The flat-earth lie was ammunition against the creationists. The argument was simple and powerful, if not elegant: “Look how stupid these Christians are. They are always getting in the way of science and progress.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/j-b-russell.html">J.B. Russell</a></span><span class="wk"><span class="lbl">Work:</span> <cite>‘The Myth of the Flat Earth’</cite>, (1997) at The American Scientific Affiliation</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/creation/the-six-days.html">The Six Days</a></span></div>

<blockquote><p>§5. But as in the concept of the divine intellect the ratio of the object was chiefly regarded, the same is now to be observed in the concept of the divine will, whose object is everything willed. It can, however, be divided into primary and secondary: the former is God Himself, or the divine essence; the latter, whatever is conceived to have been, to be, or to be about to be besides God. The former is called primary, because it is present to Him before His consciousness as the first and greatest good, independent of every other thing. The latter is called secondary, because all its goodness depends upon the goodness of God, and is exceedingly limited.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/salomon-van-til.html">Salomon Van Til</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Compendium of Both Theologies, even Natural &amp; Revealed</cite>, … (1703; 1719), 1. Nature of God, subsection 4, ‘On the Will of God’ tr. AI by Roman Prestarri Latin</span></figcaption>

<blockquote><p>For He is the First immaterial Being; and as intellectuality is a result of immateriality, it follows that He is the First intelligent Being. Therefore since in each order the first is the cause of all that follows, we must conclude that from Him proceeds all intellectual power. In like manner, since He is the First Being, and all other beings pre-exist in Him as in their First Cause, it follows that they exist intelligibly in Him, after the mode of His own Nature. For as the intelligible types of everything exist first of all in God, and are derived from Him by other intellects in order that these may actually understand; so also are they derived by creatures that they may subsist.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/thomas-aquinas.html">Thomas Aquinas</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Summa, pt. 1</cite>, quest. 105, Art. 3, I answer that</span></figcaption>

</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-2ac0a9a91f" data-kw="">
<blockquote><p>…whatsoever a man holds, though his conscience be never so much taken with it, yet if it cannot stand with the power of godliness, but destroys it, if this man be in a Christian society after all means used to reduce him, if he still perseveres in it, he is, notwithstanding his conscience, to be cast out of the society of the saints; This is not a little matter, if a man has any conscience in him, it cannot but be a dreadful thing to him: If poison be got into a glass, and you cannot wash it out, the poison and glass too is to be thrown into the sink: Such a man as this is, with the conscience that he has, is to be thrown upon the dunghill. If a man by his wickedness cuts himself off from the mystical body of Christ, the Church may cut him off from his visible, he has forfeited his Church-priviledge.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/jeremiah-burroughs.html">Jeremiah Burroughs</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Irenicum, to the Lovers of Truth and Peace. Heart-Divisions Opened</cite>, … (London: Robert Davvlman, 1653), ch. 6, p. 34</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/the-church/church-unity-and-fundamentals.html">Church Unity and Fundamentals</a></span></div>

</figure><figure class="quote" id="q-411e307970" data-kw="">
<blockquote><p>Doubtless, no opinion that does not thwart the fundamentals of religion should make a separation, and destroy our love and charity; and that, because we have only probable arguments for our opinions, but we have an express command for our love; one excellent property of which, is, that it ‘Bears all things, suffers long, and is kind:’ And indeed, if we do but consider the long suffering of God towards us, how much he bears with us every day, we have all the reason in the world to make that excellent character and property ours, and as much as may be, to bear with one another, to support, and not devour the weak; to strengthen, and not confound the feeble knees; to raise up, and not to trample upon those that are down; and by this means we may do more good, than by all the violence we can use, since a gentle persuasion accompanied with kindness, will reach farther than the strongest argument urged with hatred and ill nature. Christianity should appear with all the ornaments of a meek and quiet spirit, and show a love mixed with sorrow, towards those that are strangers or enemies to it; and this will make them esteem the love that’s showed them, the persons that show it, and praise the religion that moves them to it, and sooner than anything else, persuade them to be of it.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/thomas-jekyll.html">Thomas Jekyll</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Peace &amp; Love Recommended &amp; Persuaded in Two Sermons</cite>, … (London: 1675), 1st Sermon, p. 14 Jekyll (1646–1698) was an Anglican conforming minister.</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/the-church/church-unity-and-fundamentals.html">Church Unity and Fundamentals</a></span></div>

<blockquote><p>Have ye had a care to keep a Christian state to Christ’s honor? Have ye loved public assemblies to that end and use? Have ye not forsaken the assemblies of Christ’s people for no just cause? Is not that a true church which professes the name of Christ according to his Word, whereto it submits as the rule of the religion it has? Is not that a true Church which enters covenant with Me, as all the Christians in the world by entering into my school by baptism?</p></blockquote>

</figure><figure class="quote" id="q-edb152a677" data-kw="">
<blockquote><p>All the difference of religion, which is at this day between the Church of Rome and the Protestants, lies in some certain points which the Church of Rome maintains as important, and necessary articles of the Christian faith: whereas the Protestants, on the contrary, neither believe nor will receive them as such. For as for those matters which the Protestants believe, which they conceive to be the fundamentals of religion, they are evidently and undeniably such, that even their enemies admit and receive them as well as they: inasmuch as they are both clearly delivered in the Scriptures, and expressly admitted by the ancient councils and Fathers ; and are indeed unanimously received by the greatest part of Christians in all ages, and in different parts of the world. But now their adversaries add to these many other points, which they press and command men to believe as necessary; and such as, without believing in, there is no possible hope of salvation. As for example: that the Pope of Rome is the head and supreme monarch of the whole Christian Church throughout the world, that he, or at least the Church which he acknowledges a true one, cannot possibly err in matters of faith… which their adversaries plainly protest that they cannot with a safe conscience believe. These points are the ground of the whole difference between them; the one party pretending that they have been believed and received by the Church of Christ in all ages as revealed by him; and the other maintaining the contrary.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/jean-daille.html">Jean Daillé</a></span><span class="wk"><span class="lbl">Work:</span> <cite>‘Author’s Preface’ in A Treatise on the Right Use of the Fathers in the Decision of Controversies Existing at this Day in Religion 2nd</cite>, ed. (1631; Philadelphia, 1856), pp. 17-21, pp. 17-19</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/the-church/church-unity-and-fundamentals.html">Church Unity and Fundamentals</a></span></div>

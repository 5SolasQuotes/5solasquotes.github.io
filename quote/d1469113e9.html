<main class="wrap"><figure class="quote" id="q-d1469113e9" data-kw="">
<blockquote><p>Follows the mean the second thing, which was the man [Gamaliel] that spake and his Speech, the man was a Pharisee, he was Learned and a Doctor of Divinity, for his good parts of reputation naturally and Politically wise, and upon such grounds he convinces them all, and further he seems to be a Peaceable man and does what he can to save innocent blood but there was one thing wanting, Faith in Christ, and love to his word. Act. 22.

It is said, Paul was brought up at the feet of Gamaliel, as was his Scholar so was his Master, he was ignorant and so a persecutor, there is more required for accomplishment of a man then the gifts of the mind, which this man seems to have a man’s natural parts are like a vesture of gold, &amp; the gifts of grace like precious stones, but this faith is like a precious Diamond in the middle, incomparably greater in worth judge of things according to their quality the best of these beside the great jewel are given to the wicked and the godly and are bestowed on them for other men’s good and not their own. But this is proper to thy self and for thy self and this jewel shall make the rich and it concerns none more then Ministers …

[Y]et although thou wert as Learned as Gamaliel if thou have no more, thou art not meet to be a Minister of Christ. You know what entertainment the Apostles got at Athens, they mocked them. A man that has a Learned head and a graceless heart is not fit for Christ’s work; let us join both together. Of all men that ever I was acquainted with, I saw none so profane as Ministers. What was good in this man, let us strive to imitate and what he wants let us Labour to have our Souls filled with the love of Christ and think more of grace than of Learning.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/alexander-henderson.html">Alexander Henderson</a></span><span class="wk"><span class="lbl">Work:</span> <cite>A sermon preached by the learned Mr Alexander Henderson, before the sitting down of the General Assembly, begun the 12 of August 1639</cite>, (n.p. 1683), pp 7-9.</span></figcaption>

</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-31ccf53a7e" data-kw="">
<blockquote><p>Justification has a positive and a negative element. It consists at once in the removal of guilt and the imputation, or granting, of righteousness. It rescues the sinner as a brand from the burning and at the same time gives him a title to Heaven. If it failed to do either of these, it would fail to do anything. For man, as a sinner against God, must have that enormous guilt somehow removed. But, at the same time, if he had the guilt removed, he would still be devoid of positive righteousness and with no title to Heaven and would also be certain to fall again into sin and condemnation. If Christ only cancelled out guilt, He would merely return the sinner to Adam’s original state without Adam’s original perfection of nature. There must be the “double cure.”</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/john-gerstner.html">John Gerstner</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Theology for Everyman</cite>, ch. 6</span></figcaption>

</figure><figure class="quote" id="q-b310460fa0" data-kw="">
<blockquote><p>Two things are generally to be considered, the occasion of this [Galatians] epistle and the scope. The occasion that moved Paul to write this epistle was because certain false apostles slandered him both in respect of his calling as also in respect of his doctrine, teaching that he was no apostle and that his doctrine was false. And by this means they seduced the churches of Galatia, persuading them that justification and salvation was partly by Christ and partly by the law. The scope of the epistle is in three things. First, the apostle defends his calling in the first and second chapters. Secondly, he defends the truth of his doctrine, teaching justification by Christ alone. And upon this occasion he handles the greatest question in the world, namely, what is that justice whereby a sinner stands righteous before God, in the third and fourth and in the beginning of the fifth. Thirdly, he prescribes rules of good life in the fifth and sixth chapters.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/william-perkins.html">William Perkins</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Commentary on Galatians</cite>, 2:13.</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/justification.html">Justification</a></span></div>

<blockquote><p>V. Faith is the alone instrument of the sinner’s justification. That we are justified by faith is so frequently and expressly declared in the Scriptures, that no one who professes to receive the Word of God as the rule of his faith can venture to deny it. There are very different opinions, however, in regard to the office of faith in the justification of a sinner. Some say that a sinner is justified by faith, as it is an act performed by him; as if faith came in the room of perfect obedience, required by the law. This we have already disproved; and “it is well known,” says Witsius, “that the Reformed Churches condemned Arminius and his followers for saying that faith comes to be considered, in the matter of justification, as a work or act of ours.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/robert-shaw.html">Robert Shaw</a></span><span class="wk"><span class="lbl">Work:</span> <cite>An Exposition of the Confession of Faith of the Westminster Assembly of Divines</cite>, 8th ed. (Glasgow: Blackie &amp; Son, 1857), pp. 130-31</span></figcaption>

</figure><figure class="quote" id="q-0d04a8f604" data-kw="">
<blockquote><p>My next work is to show you how it justifieth. There being mistakes in this matter, I shall endeavour to lay the truth before you.

1. Faith does not justify as a mutual cause together with works, as if they did cooperate together; but we must distinguish. There is a first and second justification, the one ascribed to faith, the other to works. This opinion maketh as if we were beholden to grace only for some courtesies, where we cannot engage God of ourselves. It is true James saith, ‘Not by faith, but by works;’ but that is only to justify faith. It is a false faith that doth not end in works; but works have nothing to do in justification. God abhorreth such a profane medley; he would have it wholly of grace. The papists exact an imaginary faith, and so are put upon a necessity of eking it out with works.

2. Not as an act and grace in us. Faith justifieth relativè, not effectivè et formaliter: not as if the act of believing were instead of perfect obedience to the law, and as if it were grace in us, and not an apprehending of Christ’s righteousness. But it is in reference to the object that it is said to justify, only because of its necessary concurrence as an instrument. Christ’s righteousness maketh us righteous, only because it cannot apprehend this righteousness but by faith, therefore it is said faith doth it. The hand may be said to feed and nourish the body, but the nutritive virtue is not in the hand, but the meat.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/thomas-manton.html">Thomas Manton</a></span><span class="wk"><span class="lbl">Work:</span> <cite>A Practical Exposition upon the Fifty-Third Chapter of Isaiah</cite>, (1703) in The Complete Works of Thomas Manton, D.D. (22 vols, London: James Nisbet &amp; Co., 1871), 3: 440.</span></figcaption>

1. Faith does not justify as a mutual cause together with works, as if they did cooperate together; but we must distinguish. There is a first and second justification, the one ascribed to faith, the other to works. This opinion maketh as if we were beholden to grace only for some courtesies, where we cannot engage God of ourselves. It is true James saith, ‘Not by faith, but by works;’ but that is only to justify faith. It is a false faith that doth not end in works; but works have nothing to do in justification. God abhorreth such a profane medley; he would have it wholly of grace. The papists exact an imaginary faith, and so are put upon a necessity of eking it out with works.

2. Not as an act and grace in us. Faith justifieth relativè, not effectivè et formaliter: not as if the act of believing were instead of perfect obedience to the law, and as if it were grace in us, and not an apprehending of Christ’s righteousness. But it is in reference to the object that it is said to justify, only because of its necessary concurrence as an instrument. Christ’s righteousness maketh us righteous, only because it cannot apprehend this righteousness but by faith, therefore it is said faith doth it. The hand may be said to feed and nourish the body, but the nutritive virtue is not in the hand, but the meat.”

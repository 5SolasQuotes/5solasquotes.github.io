<blockquote><p>Therefore, if there is any Word of God outside the Scriptures, it is not necessary for attaining this ultimate end.</p></blockquote>

</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-3f153cbdb3" data-kw="">
<blockquote><p>Sola Scriptura (&quot;by Scripture alone&quot;). The Holy Scriptures are our supreme and only rule of faith and life; they, not human tradition and reasoning, determine our faith and command our obedience. … Our minds are servants to receive the Word, not to judge it.</p></blockquote>
<figcaption>— <a href="../authors/joel-r-beeke-paul-m-smalley.html">Joel R. Beeke &amp; Paul M. Smalley</a>, <cite>Reformed Systematic Theology</cite>, vol. 1, ch. 4</figcaption>

</figure><figure class="quote" id="q-d232debef1" data-kw="">
<blockquote><p>Holy Scripture contains all things necessary for our salvation, and that clearly; and therefore nothing beyond its open testimony is to be admitted in religion as necessary either to believe or to do.</p></blockquote>
<figcaption>— <a href="../authors/jerome-zanchi.html">Jerome Zanchi</a>, <cite>On the Sufficiency of Scripture</cite>, Proposition 1</figcaption>
<div class="meta"><span class="t"><a href="../topics/holy-scripture/sufficiency.html">Sufficiency</a> › <a href="../topics/holy-scripture/sufficiency/scripture-alone.html">Scripture alone</a></span><span class="t"><a href="../topics/holy-scripture/perspicuity.html">Perspicuity</a> › <a href="../topics/holy-scripture/perspicuity/clarity.html">Clarity</a></span></div>

</figure><figure class="quote" id="q-8317e796d9" data-kw="">
<blockquote><p>Protestants have always been accustomed to meet these views, whether put forth by Roman Catholics or Anglo-Catholics, by establishing the sufficiency and perfection of the sacred Scriptures as the only rule of faith, and by proving that we have not in point of fact, any certain means of knowing accurately what was declared and prescribed by the apostles, except from the writings of the New Testament.</p></blockquote>
<figcaption>— <a href="../authors/william-cunningham.html">William Cunningham</a>, <cite>The Romanist Theory of Development</cite>, p. 6</figcaption>
<div class="meta"><span class="t"><a href="../topics/holy-scripture/sufficiency.html">Sufficiency</a> › <a href="../topics/holy-scripture/sufficiency/scripture-alone.html">Scripture alone</a></span><span class="t"><a href="../topics/holy-scripture/sufficiency.html">Sufficiency</a> › <a href="../topics/holy-scripture/sufficiency/unwritten-traditions.html">Unwritten traditions</a></span><span class="t"><a href="../topics/rome/the-rule-of-faith.html">Rome: The Rule of Faith</a> › <a href="../topics/rome/the-rule-of-faith/scripture-vs-tradition.html">Scripture vs tradition</a></span></div>

— William Cunningham, The Romanist Theory of Development, p. 6">Copy</button><a class="share" href="https://x.com/intent/post?text=%E2%80%9CProtestants+have+always+been+accustomed+to+meet+these+views%2C+whether+put+forth+by+Roman+Catholics+or+Anglo-Catholics%2C+by+establishing+the+sufficiency+and+perfection+of+the+sacred+Scriptures+as+the+only+rule+of+faith%2C+and+by+proving+that+we+have+not+in+point+of+fact%2C+any+certain+means+of+knowing+accurately+what+was+declared+and+prescribed+by+the+apostles%2C+except+from+the+writings+of+the+New+Testament.%E2%80%9D%0A%0A%E2%80%94+William+Cunningham%2C+The+Romanist+Theory+of+Development%2C+p.+6&amp;url=https%3A%2F%2F5solasquotes.github.io%2Fquote%2F8317e796d9.html&amp;via=5Solas" target="_blank" rel="noopener">Share on X</a><a class="perma" href="../quote/8317e796d9.html">Permalink</a><span class="src none">No free online copy linked</span></div>
</figure><figure class="quote" id="q-7b5f26575e" data-kw="">
<blockquote><p>In this we are even more justified, because the nature and requirements of a rule fit as exactly as possible with Scripture alone. First, the rule of living for God, without doubt, ought to be prescribed by God alone (Deut. 12:32; Matt. 15:9). For a rule cannot be prescribed by any other than by the one whom the rule concerns. Now, Scripture alone has been prescribed by God as the rule for us (2 Tim. 3:16; 2 Peter 1:21), and due to the sublimity of the matter it could not be revealed and prescribed by anyone but God.</p></blockquote>
<figcaption>— <a href="../authors/petrus-van-mastricht.html">Petrus van Mastricht</a>, <cite>Theoretical-Practical Theology</cite>, vol. 1: Prolegomena, Part 1, Book 1, ch. 2, §V</figcaption>

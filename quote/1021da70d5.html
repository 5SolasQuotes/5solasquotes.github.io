<main class="wrap"><figure class="quote" id="q-1021da70d5" data-kw="">
<blockquote><p>The Scriptures teach that there is essentially but one God, and, therefore, that the essence both of the Son and Spirit is unbegotten; but inasmuch as the Father is first in order, and of himself begat his own Wisdom, he, as we lately observed, is justly regarded as the principle and fountain of all the Godhead. Thus God, taken indefinitely, is unbegotten, and the Father, in respect of his person, is unbegotten.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/john-calvin.html">John Calvin</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Institutes of the Christian Religion</cite>, 1.13.25</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/the-trinity/the-father.html">The Father</a> › <a href="../topics/the-trinity/the-father/the-first-person-unbegotten.html">The first person, unbegotten</a></span><span class="t"><a href="../topics/the-trinity/the-father.html">The Father</a> › <a href="../topics/the-trinity/the-father/fountain-of-deity-fons-deitatis.html">Fountain of deity (fons deitatis)</a></span></div>

</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-ffeea9e3e5" data-kw="undivided external works">
<blockquote><p>Although the external works are undivided and equally common to the single persons (both on the part of the principle and on the part of the accomplishment), yet they are distinguished by order and by terms. For the order of operating follows the order of subsisting. As therefore the Father is from himself, so he works from himself; as the Son is from the Father, so he works from the Father; as the Holy Spirit is from both, so he works from both.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/francis-turretin.html">Francis Turretin</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Institutes of Elenctic Theology</cite>, 3.27</span></figcaption>

— Francis Turretin, Institutes of Elenctic Theology, 3.27">Copy</button><a class="share" href="https://x.com/intent/post?text=%E2%80%9CAlthough%20the%20external%20works%20are%20undivided%20and%20equally%20common%20to%20the%20single%20persons%20%28both%20on%20the%20part%20of%20the%20principle%20and%20on%20the%20part%20of%20the%20accomplishment%29%2C%20yet%20they%20are%20distinguished%20by%20order%20and%20by%20terms.%20For%20the%20order%20of%20operating%20follows%20the%20order%20of%20subsisting.%20As%20therefore%20the%20Father%20is%20from%20himself%2C%20so%20he%20works%20from%20himself%3B%20as%20the%20Son%20is%20from%20the%20Father%2C%20so%20he%20works%20from%20the%20Father%3B%20as%20the%20Holy%20Spirit%20is%20from%20both%2C%20so%20he%20works%20from%20both.%E2%80%9D%0A%0A%E2%80%94%20Francis%20Turretin%2C%20Institutes%20of%20Elenctic%20Theology%2C%203.27&amp;url=https%3A%2F%2F5solasquotes.github.io%2Fquote%2Fffeea9e3e5.html&amp;via=5Solas" target="_blank" rel="noopener">Share on X</a><a class="perma" href="../quote/ffeea9e3e5.html">Permalink</a><span class="src none">No free online copy linked</span></div>
</figure><figure class="quote" id="q-ab7a2fd88e" data-kw="">
<blockquote><p>In the unity of the Godhead there be three persons, of one substance, power, and eternity: God the Father, God the Son, and God the Holy Ghost: the Father is of none, neither begotten, nor proceeding; the Son is eternally begotten of the Father; the Holy Ghost eternally proceeding from the Father and the Son.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/westminster-assembly.html">Westminster Assembly</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Westminster Confession of Faith</cite>, 2.3</span></figcaption>

<div class="actions"><button class="copy" data-copy="“In the unity of the Godhead there be three persons, of one substance, power, and eternity: God the Father, God the Son, and God the Holy Ghost: the Father is of none, neither begotten, nor proceeding; the Son is eternally begotten of the Father; the Holy Ghost eternally proceeding from the Father and the Son.”

</figure><figure class="quote" id="q-c36511e0ac" data-kw="Father unbegotten">
<blockquote><p>However, the Holy Spirit speaking in the Scriptures does not merely propose one God to us but also teaches us the way to approach God. Therefore, God is revealed to us in three persons, namely the Father, the Son, and the Holy Spirit, so that we may know the path by which God is accessible. For if you consider God absolutely as Lord and Judge, that terrifying majesty presents itself to the mind, whose brilliance dazzles the eye, and the most righteous tribunal whose aspect strikes the conscience of men with sheer terror.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/pierre-du-moulin.html">Pierre Du Moulin</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Theological Theses on the One God and Three Persons</cite>, VII</span></figcaption>

— Pierre Du Moulin, Theological Theses on the One God and Three Persons, VII">Copy</button><a class="share" href="https://x.com/intent/post?text=%E2%80%9CHowever%2C%20the%20Holy%20Spirit%20speaking%20in%20the%20Scriptures%20does%20not%20merely%20propose%20one%20God%20to%20us%20but%20also%20teaches%20us%20the%20way%20to%20approach%20God.%20Therefore%2C%20God%20is%20revealed%20to%20us%20in%20three%20persons%2C%20namely%20the%20Father%2C%20the%20Son%2C%20and%20the%20Holy%20Spirit%2C%20so%20that%20we%20may%20know%20the%20path%20by%20which%20God%20is%20accessible.%20For%20if%20you%20consider%20God%20absolutely%20as%20Lord%20and%20Judge%2C%20that%20terrifying%20majesty%20presents%20itself%20to%20the%20mind%2C%20whose%20brilliance%20dazzles%20the%20eye%2C%20and%20the%20most%20righteous%20tribunal%20whose%20aspect%20strikes%20the%20conscience%20of%20men%20with%20sheer%20terror.%E2%80%9D%0A%0A%E2%80%94%20Pierre%20Du%20Moulin%2C%20Theological%20Theses%20on%20the%20One%20God%20and%20Three%20Persons%2C%20VII&amp;url=https%3A%2F%2F5solasquotes.github.io%2Fquote%2Fc36511e0ac.html&amp;via=5Solas" target="_blank" rel="noopener">Share on X</a><a class="perma" href="../quote/c36511e0ac.html">Permalink</a><span class="src none">No free online copy linked</span></div>
</figure><figure class="quote" id="q-103dd6146c" data-kw="">
<blockquote><p>It were unbecoming to say nothing of a distinction which we observe that the Scriptures have pointed out. This distinction is, that to the Father is attributed the beginning of action, the fountain and source of all things; to the Son, wisdom, counsel, and arrangement in action, while the energy and efficacy of action is assigned to the Spirit. Moreover, though the eternity of the Father is also the eternity of the Son and Spirit, since God never could be without his own wisdom and energy; and though in eternity there can be no room for first or last, still the distinction of order is not unmeaning or superfluous, the Father being considered first, next the Son from him, and then the Spirit from both.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/john-calvin.html">John Calvin</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Institutes of the Christian Religion</cite>, 1.13.18</span></figcaption>

<main class="wrap"><figure class="quote" id="q-13395f7f0e" data-kw="">
<blockquote><p>Because, where the doctrine itself is sound and pure, and the ceremonies used to a civil honesty and decency, the inconveniences are rather to be passed by in silence than that by occasion of them men should proceed to contentions and more grievous tumults; Calvin, Epistle 303, fol. 497. Because, albeit these things be not to be approved, yet, sometimes these indifferent things, howsoever offensive and burdensome, are to be born withal, so far forth (quoad aliter non liceat) as conveniently we cannot do otherwise, lest if men contend about them more bitterly then they ought, it be both an hindrance to the progress of the Gospel, and the things which in their own nature are indifferent, be taught by our vehement contention to be plainly wicked; which two points do bring with them most grievous inconveniences; P. Martyr to [John] Hooper, Common Places, folio 1086 [p. 117]. And therefore these things which the pastors cannot change, they should rather bear withal, than by forsaking the Church for that cause they should give occasion for far greater and more dangerous mischiefs unto Satan, who seeks nothing else; Beza, Epistle 12, fol. 99. … Because we must give place unto the sway of the times wherein we live, so far forth as may stand with keeping faith and a good conscience, Acts 28:11; 19:10, 26; 15:28-29; Master [William] Perkins, Cases of Conscience, bk. 3, ch. 2, fol. 482-83. Because if we cannot do the good that most we desire, in such exquisite manner as we would, we must content ourselves with the mean, and in things which are good and to be done, it is the safest course to satisfy ourselves in doing the less, lest in venturing to do the more, which cannot be, we grow to the extremity, and so fail or offend in our action, Eccl. 7:16; read the proofs: Perkins, Cases of Conscience, bk. 3, ch. 2, fol. 483-86.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/john-sprint.html">John Sprint</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Cassander Anglicanus, showing the Necessity of Conformity to the Prescribed Ceremonies of our Church in Case of Deprivation</cite>, (London: Bill, 1623) | ‘Reformed Practices’, pp. 163-65</span></figcaption>

</figure><figure class="quote" id="q-79ece82320" data-kw="">
<blockquote><p>God is not only a spirit or spiritual substance, but He is every way infinite and has sufficiency of all perfection in Himself. And therfore He takes no delight in any good thing that the creature can communicate to Him: but his delight is in the communication of his own goodness to us, and in all such duties whereby we conform ourselves to Him and magnify his goodness. Thus Paul, Acts 17:25, that ‘God needs nothing,’ and therefore He is not worshipped with anything made by the hands of man. And the Lord says by the Psalmist (Ps. 50; 8; 14) that He does not principally respect our gifts and our sacrifices, because all things are his, but He respects praise and thanksgiving.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/william-perkins.html">William Perkins</a></span><span class="wk"><span class="lbl">Work:</span> <cite>‘A Warning Against the Idolatry of the Last Times, &amp; an Instruction touching Religious or Divine Worship’ in The Works</cite>, (d. 1602; London: Legatt, 1626), vol. 1, p. 703</span></figcaption>

<blockquote><p>14th Objection: They object: To be present at a mass is to countenance an idol worship; so to be present in a church worship where there is any error in the worship is to countenance the error. For what worship we countenance to that we say, ‘Amen,’ and so we must consent to the wrong constitution of a church where are profane people? Answer: To countenance a worship professedly idolatrous, where the name of the worship imports the worshipping of a false god, is unlawful, for others do interpret our presence [as] a joint worshipping with them. But our presence at every lawful worship that is acknowledged lawful, does not give so much as interpretatively signification of our consent to every particular in the worship, because hearing, discerning, choosing or refusing, believing or not believing, according as you find the points agreeable to God’s Word, or dissonant therefrom, intervenes between your presence at the worship, and your consent to the worship. Now the act of consenting, approving and receiving the point of worship is formally to partake of the worship, else we could not obey the precept (1 Thess. 5:21) ‘Try all things.’ Some things in the preacher are to be borne with; The preachers of the Separation have not an apostolic and infallible spirit; if any of them preach unsound doctrine, the presence of the hearers does not involve them in the guilt of the preacher’s erroneous worship. The Pharisees corrupting of the Law was known and rebuked by Christ, but yet Christ forbade Separation. ‘Hear them’ (Matt. 23) ‘they sit in Moses’ chair.’</p></blockquote>

<div class="actions"><button class="copy" data-copy="“14th Objection: They object: To be present at a mass is to countenance an idol worship; so to be present in a church worship where there is any error in the worship is to countenance the error. For what worship we countenance to that we say, ‘Amen,’ and so we must consent to the wrong constitution of a church where are profane people? Answer: To countenance a worship professedly idolatrous, where the name of the worship imports the worshipping of a false god, is unlawful, for others do interpret our presence [as] a joint worshipping with them. But our presence at every lawful worship that is acknowledged lawful, does not give so much as interpretatively signification of our consent to every particular in the worship, because hearing, discerning, choosing or refusing, believing or not believing, according as you find the points agreeable to God’s Word, or dissonant therefrom, intervenes between your presence at the worship, and your consent to the worship. Now the act of consenting, approving and receiving the point of worship is formally to partake of the worship, else we could not obey the precept (1 Thess. 5:21) ‘Try all things.’ Some things in the preacher are to be borne with; The preachers of the Separation have not an apostolic and infallible spirit; if any of them preach unsound doctrine, the presence of the hearers does not involve them in the guilt of the preacher’s erroneous worship. The Pharisees corrupting of the Law was known and rebuked by Christ, but yet Christ forbade Separation. ‘Hear them’ (Matt. 23) ‘they sit in Moses’ chair.’”

— Samuel Rutherford, A Peaceable &amp; Temperate Plea… (London, 1642), ch. 11, pp. 162-63">Copy</button><a class="share" href="https://x.com/intent/post?text=%E2%80%9C14th+Objection%3A+They+object%3A+To+be+present+at+a+mass+is+to+countenance+an+idol+worship%3B+so+to+be+present+in+a+church+worship+where+there+is+any+error+in+the+worship+is+to+countenance+the+error.+For+what+worship+we+countenance+to+that+we+say%2C+%E2%80%98Amen%2C%E2%80%99+and+so+we+must+consent+to+the+wrong+constitution+of+a+church+where+are+profane+people%3F+Answer%3A+To+countenance+a+worship+professedly+idolatrous%2C+where+the+name+of+the+worship+imports+the+worshipping+of+a+false+god%2C+is+unlawful%2C+for+others+do+interpret+our+presence+%5Bas%5D+a+joint+worshipping+with+them.+But+our+presence+at+every+lawful+worship+that+is+acknowledged+lawful%2C+does+not+give+so+much+as+interpretatively+signification+of+our+consent+to+every+particular+in+the+worship%2C+because+hearing%2C+discerning%2C+choosing+or+refusing%2C+believing+or+not+believing%2C+according+as+you+find+the+points+agreeable+to+God%E2%80%99s+Word%2C+or+dissonant+therefrom%2C+intervenes+between+your+presence+at+the+worship%2C+and+your+consent+to+the+worship.+Now+the+act+of+consenting%2C+approving+and+receiving+the+point+of+worship+is+formally+to+partake+of+the+worship%2C+else+we+could+not+obey+the+precept+%281+Thess.+5%3A21%29+%E2%80%98Try+all+things.%E2%80%99+Some+things+in+the+preacher+are+to+be+borne+with%3B+The+preachers+of+the+Separation+have+not+an+apostolic+and+infallible+spirit%3B+if+any+of+them+preach+unsound+doctrine%2C+the+presence+of+the+hearers+does+not+involve+them+in+the+guilt+of+the+preacher%E2%80%99s+erroneous+worship.+The+Pharisees+corrupting+of+the+Law+was+known+and+rebuked+by+Christ%2C+but+yet+Christ+forbade+Separation.+%E2%80%98Hear+them%E2%80%99+%28Matt.+23%29+%E2%80%98they+sit+in+Moses%E2%80%99+chair.%E2%80%99%E2%80%9D%0A%0A%E2%80%94+Samuel+Rutherford%2C+A+Peaceable+%26+Temperate+Plea%E2%80%A6+%28London%2C+1642%29%2C+

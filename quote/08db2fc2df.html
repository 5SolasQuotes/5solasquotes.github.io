<blockquote><p>A Hebrew day is either natural or artificial. A natural day is the space of 24 hours, containing also both the morning and the evening. The morning and the evening are the bounds of every day, and the evening is of two sorts. The first is from the ninth hour [counted from 6 am, that is, 3 pm] to the setting of the sun. The second is from the sun-setting [roughly 6 pm] unto the shutting in of the night. “In the first month and the fourteenth day of the month, between the two evenings shall be the Passover of the Lord” (Lev. 23:5). A natural day according to the diverse uses thereof is either a work day or a holy day. A work day is that which is appointed for our civil business, and (as it seems to me) this day among the Jews, lasted from the sun-rising to the sun-rising, that is, it began at the morning: “Why sittest thou thyself alone, and all the people stand about thee from morning to even?” (Ex. 18:14). “In the end of the Sabbath when the first day of the week began to dawn” (Matt 28:1). It is not likely that Matthew spoke these things after the manner of the Romans, seeing that he wrote his gospel especially for the Hebrews. A holy day is that which is appointed for holy uses. A holy day is only made by God to whom only it belongs to bless and hallow the times. A holy day begins at the evening and ends at the evening: “From even to even shall ye celebrate the Sabbath” (Lev. 23:32). The holy day common to all ages is the Sabbath, which according to the moral law is a certain seventh day set apart for divine worship. Here is to be noted that sometimes the word Sabbath is put for the whole week: “I fast twice a Sabbath” (Luke 18:12); “The first of the Sabbath” (1 Cor. 16:2). An artificial day is the space of time from the rising of the sun to the setting (John 11:9-10), wherefore it is longer in summer and shorter in winter.</p></blockquote>

<blockquote><p>III. Whether the Christian Sabbath requires a day of twenty-four hours, or a νυχθήμερον [a night-and-day]? [VI.C.1. The Thesis: The Day, Not the Night, Is Properly the Sabbath] Answer: I see this asserted by some, but I require the reasons. This is of the substance of the Sabbath: that a day of rest succeed six working days. But those working days are the courses of the sun above the earth; nor does the night make a part thereof, according to that saying: “I must work the works of Him that sent me, while it is day” (John 9:4), and John 11:9, and Psalm 104:22–23 [recte v. 22ff.]. Now that the Jews observed a night-and-day rest, and indeed beginning from evening, contributed nothing to its substantial sanctification and proportional partition of labor and rest. For ordinary human labor is destined for the day—that is, that space of time which is distinct from the night—as from the passages John 9:4; Psalm 104 just cited, and from the common light of nature and universal experience, I judge to be evident. Nor is it an objection that extraordinary cases of necessity sometimes require the labors of men both by night and by day. The same we also freely concede concerning the nocturnal treatment and meditation of sacred things, or the prolongation thereof into the late hours of the night (Acts 20:9), a particular case so requiring. But as it cannot be inferred thence that individual nights, equally as days, are to be spent in ordinary labours, excluding all sleep, so from the virtue of the partition prescribed in the Decalogue it cannot be inferred that the entire night preceding the Sabbath is ordinarily to be devoted to sacred exercises equally as the day. Such sabbatizing would savor of the nocturnal vigils once introduced into the Church ἀλόγως [irrationally] from some extraordinary occasion, and afterward λογίως [rationally] abrogated—the remnants or surrogates of which still survive in Popery today. Concerning which, see Hospinian, On Feasts, chapter 7. [VI.C.2. Objection I: The Commencement of the Sabbath from Evening] But perhaps someone will say:

      1. Objection. The commencement of the Sabbath from the preceding evening was expressly enjoined upon the Israelites; therefore the night is equally the Sabbath of the Lord [Sabbathum Jehova] as the day is the day of the Lord [dies Domini]. Answer:

      1. I grant that rest was enjoined—namely, rest and abstinence from ordinary labor—because this is the conditio sine qua non [condition without which not], or as it were the removing of the impediment to Sabbath preparation and observance. For commonly men through the sleeplessness and labor of that night are rendered unfit for vigorously performing the exercises of piety on the following day, so that the Sabbath is to them more a burden, δύσβατον [hard to walk], than עֹנֶג [oneg], that is, delights (Isaiah 58:13). But I deny that the sleep or rest of sleep was prohibited, and that a vigil and sanctification of that night through labor in divine worship and exercises of piety, both public and private, was enjoined.

      2. Granting that rest itself was, by divine institution, a sacred part or a part of the sanctification of the Israelite Sabbath, and indeed equally through the night destined for sleep as through the day destined for the works of divine worship: yet it does not follow thence that this circumstantial and accessory element pertains to the substance of the weekly Sabbath instituted from the beginning of the world, and consequently is moral and immutable, by which we are bound equally as the Israelites. It suffices that rest from labors be observed by us in general and materially, as a condition without which not—although it be not believed to be formally and properly holy, formally as a sacred rest from ordinary labor both negatively (by ceasing from work) and positively (through sleep) after the manner of an economical sanctity. Whatever may be the case concerning rest under the Old Testament (about which I do not wish here anxiously to inquire), at least under the New Testament I judge that no rest from labour is to be adorned with the name of virtue, good work, and holiness in itself and of itself, but only in order to another thing—namely, that we may wholly and expressly devote ourselves to divine worship and sanctify that day with spiritual exercises. And thus I judge that sufficient provision is made for the practice of Sabbath sanctification against all profanations—in the same manner as we judge, concerning the matter of religious fasting, about abstinence from food. What, moreover, is commanded in the fourth precept concerning the rest of beasts of burden, that is ordered to the rest of men—without which the Sabbath cannot be solemnly sanctified or holily spent with spiritual works. [VI.C.3. Objection II: The Consequence for Nations with Continuous Night] 2. Objection. Hence it would follow that no Sabbath whatsoever is to be kept for certain months by those nations for whom there is then a continuous night. But this is absurd. Answer: This is the objection of Thomas Shepard, who in his English treatise entitled Theses Sabbaticae, pt. 2, inquires into the commencement of the Sabbath beyond other writers. We deny the consequence. For those nations can and ought, just as they separate their working days in those long darknesses from the nights or ordinary time of rest, so also separate and observe the seventh day as free from ordinary works and occupied with divine worship. This simple opinion of mine on this question I think will satisfy those who are solely solicitous about the practice of piety and the Sabbath.</p></blockquote>

hip%3A+yet+it+does+not+follow+thence+that+this+circumstantial+and+accessory+element+pertains+to+the+substance+of+the+weekly+Sabbath+instituted+from+the+beginning+of+the+world%2C+and+consequently+is+moral+and+immutable%2C+by+which+we+are+bound+equally+as+the+Israelites.+It+suffices+that+rest+from+labors+be+observed+by+us+in+general+and+materially%2C+as+a+condition+without+which+not%E2%80%94although+it+be+not+believed+to+be+formally+and+properly+holy%2C+formally+as+a+sacred+rest+from+ordinary+labor+both+negatively+%28by+ceasing+from+work%29+and+positively+%28through+sleep%29+after+the+manner+of+an+economical+sanctity.+Whatever+may+be+the+case+concerning+rest+under+the+Old+Testament+%28about+which+I+do+not+wish+here+anxiously+to+inquire%29%2C+at+least+under+the+New+Testament+I+judge+that+no+rest+from+labour+is+to+be+adorned+with+the+name+of+virtue%2C+good+work%2C+and+holiness+in+itself+and+of+itself%2C+but+only+in+order+to+another+thing%E2%80%94namely%2C+that+we+may+wholly+and+expressly+devote+ourselves+to+divine+worship+and+sanctify+that+day+with+spiritual+exercises.+And+thus+I+judge+that+sufficient+provision+is+made+for+the+practice+of+Sabbath+sanctification+against+all+profanations%E2%80%94in+the+same+manner+as+we+judge%2C+concerning+the+matter+of+religious+fasting%2C+about+abstinence+from+food.+What%2C+moreover%2C+is+commanded+in+the+fourth+precept+concerning+the+rest+of+beasts+of+burden%2C+that+is+ordered+to+the+rest+of+men%E2%80%94without+which+the+Sabbath+cannot+be+solemnly+sanctified+or+holily+spent+with+spiritual+works.+%5BVI.C.3.+Objection+II%3A+The+Consequence+for+Nations+with+Continuous+Night%5D+2.+Objection.+Hence+it+would+follow+that+no+Sabbath+whatsoever+is+to+be+kept+for+certain+months+by+those+nations+for+whom+there+is+then+a+continuous+night.+But+this+is+absurd.+Answer%3A+This+is+the+objection+of+Thomas+Shepard%2C+who+in+his+English+treatise+entitled+Theses+Sabbaticae%2C+pt.+2%2C+inquires+into+the+commencement+of+the+Sabbath+beyond+other+writers.+We+deny+the+consequence.+For+those+nations+can+and+ought%2C+just+as+they+separate+their+working+days+in+those+long+darknesses+from+the+nights+or+ordinary+time+of+rest%2C+so+also+separate+and+observe+the+seventh+day+as+free+from+ordinary+works+and+occupied+with+divine+worship.+This+simple+opinion+of+mine+on+this+question+I+think+will+satisfy+those+who+are+solely+solicitous+about+the+practice+of+piety+and+the+Sabbath.%E2%80%9D%0A%0A%E2%80%94+Gisbertus+Voetius%2C+Select+Theological+Disputations%2C+%28Utrecht%2C+Johannis+%C3%A0+Waesberge%2C+1659%29%2C+vol.+3%2C+%E2%80%98On+the+Sabbath+%26+Feasts%E2%80%99%2C+Problem+III%3A+Whether+the+Christian+Sabbath+Requires+a+Day+of+Twenty-Four+Hours+tr.+AI+by&amp;url=https%3A%2F%2F5solasquotes.github.io%2Fquote%2F78e5d22c91.html&amp;via=5Solas" target="_blank" rel="noopener">Share on X</a><a class="perma" href="../quote/78e5d22c91.html">Permalink</a><a class="src" href="https://reformedbooksonline.com/topics/topics-by-subject/the-lords-day/the-whole-lords-day-is-sanctified/#:~:text=III.%20Whether%20the%20Christian%20Sabbath%20requires,practice%20of%20piety%20and%20the%20Sabbath&amp;text=III.%20Whether%20the%20Christian%20Sabbath%20requires%20a%20day&amp;text=about%20the%20practice%20of%20piety%20and%20the%20Sabbath" rel="noopener" target="_blank">Read it online · Reformed Books Online</a></div>

<blockquote><p>43. There are, however, exceptions. First, all those works are permitted which are part of honorable conduct. At all times we ought to live and act honestly and decently, and especially on the day dedicated to divine worship. All things which look simply to this are clearly allowed. Second, those things are permitted which are imposed upon us by special necessity, Matt. 12:11. We should eliminate all those things which men make or pretend to make necessary. But there are still those which in the providence of God are unexpected, necessary, and unavoidable, e.g., when a necessity allowed by the Scripture is present as a sufficient cause for doing ordinary work. Third, all work is permitted which directly affects the worship and glory of God, Matt. 12:5; John 5:8,9. For such work which of its own nature is servile passes into the nature of a holy work and is not properly our work but God’s.</p></blockquote>

</figure><figure class="quote" id="q-ea6137d763" data-kw="">
<blockquote><p>We think to deny the lawfulness of public fasting on the Lord’s day, as if the Christian Sabbath were a day only of spiritual feasting and rejoicing, because that day Christ ended the work of redemption and second creation, is a wronging of the Christian Sabbath, which is ordained for the whole public worship of God, joying, sorrowing for sin, learning God’s will in all and every point, as the Jewish Sabbath was not ordained only for meditation on the work of creation, but for worships of all kinds: The worship of this day, Acts 20:7, is as large as preaching, and being in the Spirit, on the Lord’s day, and seeing the visions of God, Rev. 1:10-12, and the whole ordinary public worship. It is then too narrow to restrict all our Sabbath-worship to one single act of festival rejoicing.</p></blockquote>

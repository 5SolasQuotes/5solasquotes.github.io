<main class="wrap"><figure class="quote" id="q-fec9bbb050" data-kw="">
<blockquote><p>The fourth commandment commands “to keep holy the day of the Sabbath” (תבש םוי). The Sabbath is rest from work. God commands “to keep holy” and be devoted to the time of that rest by keeping, worshipping, glorifying the holy things of the one true God, and hallowing His name with thoughts and cares. For the Sabbath is necessary to be performed for the Lord (חהיל), for the grace of the honour and worship of the Lord (Ex. 20:8–11; 31:15). Hence, neither is all cessation commanded, nor that from any work that man takes up for the necessity of his life, but from servile work (חכאלמ) (Lev. 23:7).</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/johann-heinrich-heidegger.html">Johann Heinrich Heidegger</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Concise Marrow of Christian Theology</cite>, trans. Casey Carmichael, Classic Reformed Theology, vol. 4 (1697; Grand Rapids MI: Reformation Heritage Books, 2019), XIV.XIII, Kindle Locations 2296-2301.</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/worship.html">Worship</a></span></div>

</figure><figure class="quote" id="q-44ef1964b7" data-kw="">
<blockquote><p>Some people are concerned that the existence of textual variants or passages which are difficult to translate undermines our confidence in the word of God. As James Ussher demonstrates below, such fears are groundless and contrary to common sense. The quote below pretty much sums up my own position:

How can the certain understanding of the Scriptures be taken out of the Original Tongues; considering the difference of Reading, which is in divers Copies both of Hebrew and Greek; as also the difficulty of some Words and Phrases upon which the best Translators cannot agree?

Although in the Hebrew Copies there hath been observed by the Masorites some very few differences of Words, by similitude of Letters and Points; and by the Learned in the Greek Tongue there are like diversities of Reading noted in the Greek Text of the New Testament, which came by fault of the Writers: yet in most by circumstance of the place and conference of other places, the true reading may be discerned. And albeit in all it cannot, nor the Translator in all places determine the true interpretation; yet this diversity or difficulty can make no difference or uncertainty in the sum and substance of Christian Religion; because the Ten Commandments, and the principal Texts of Scripture on which the Articles of our Faith are grounded, the Sacraments instituted, the Form of Prayer taught, (which contain the sum and substance of Christian Religion) are without such diversity of Reading, or difficulty of Translating so plainly set down, and so precisely translated by consent of Learned Men in the Tongues, that no Man can make any doubt of them, or pick any quarrel against them.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/james-ussher.html">James Ussher</a></span><span class="wk"><span class="lbl">Work:</span> <cite>A body of divinity: or, the sum and substance of Christian religion</cite>, ed. Michael Nevarr (1648; Herndon VA, 2007), p. 20.</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/worship.html">Worship</a></span></div>

</figure><figure class="quote" id="q-eb344b1639" data-kw="">
<blockquote><p>36. ‘And kneeling down’. The inward affection is indeed the chiefest thing in prayer; yet the external signs, as kneeling, uncovering of the head, lifting up of the hands, have a double use; the first is, that we exercise all our members to the glory and worship of God; secondly, that by this exercise our sluggishness may be awakened, as it were. There is also a third use in solemn and public prayer, because the children of God do by this means make profession of their godliness, and one of them does provoke another unto the reverence of God. And, as the lifting up of the hands is a token of boldness (fiducia, confidence) and of an earnest desire, so, to testify our humility, we fall down upon our knees.</p></blockquote>

<blockquote><p>1. Observe, It’s a good thing to be studying the Scripture: it’s a mark of the blessed man, Psal. 1. It makes the man of God wise to salvation; and it’s good that those who want the use of reading themselves, make up that want by hearing others: and particularly, it is good to be reading, and hearing this Book read; those that are fitted for reading, let them use it well; and those that have not this benefit, let them take and improve other opportunities that may bring them to the knowledge of Christ’s mind; and the more, that blessedness is given but to six or seven sores in this Book, and twice or thrice over, to those that study it, Rev. 22.7, 14.

2. Observe, That it’s not enough to be given to reading and hearing of the Word: neither would folks rest on it; but join practise with both, Luk. 11.28. Blessed are they that hear the Word of God, and keep it. It is not the reader, or hearer, but the doer, that is the blessed man. Yea, though ye were able to open and unfold all the Mysteries that are in this Book, if ye be not suitable and conform thereto in your practice, ye are but like that man spoken of, Jam. 1.23, 24. who, beholding his natural face in a glass, goeth his way, and forgetteth what manner of man he was. He that is a hearer, and not a doer, deceives his own soul: as much hearing and reading doth you good, as is improven in practice.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/james-durham.html">James Durham</a></span><span class="wk"><span class="lbl">Work:</span> <cite>A Commentary upon the Book of the Revelation</cite>, (1658; Willow Street PA: Old Paths Publications, 2000), p. 4.</span></figcaption>

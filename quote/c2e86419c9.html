<blockquote><p>…his [John Robinson’s] answer is that no parish assemblies [under patrons and bishops] have power of right to choose their ministers. Whereas on the contrary it is most evident that every congregation of Christians has right unto this thing from Christ Himself so inseparably annexed unto it that no external oppression by others or abuse of their own can possibly deprive them of this right, so long as they remain a Christian assembly or congregation. Suppose they be in external bondage, and that in some sense spiritual, yet no matter of fact can take away right, while they abide such as Christ has given that right unto. The whole case may be cleared in this example: two single persons agree on mariage betwixt themselves, with allowance of parents, and have by virtue of that contract mutual right one in other; yet the laws of the place where they live, having ordered that none shall be held for married persons without certain forms which they appoint, they have not external legal power or liberty one in the other before such rites be performed. Even so stands the matter betwixt minister and people in England, they agreeing or contracting betwixt themselves have right one in other: but external legal power or liberty they must receive from others. Another example also I would have considered: the emperor sometime was so subiect unto the pope that he had not liberty of emperial rule until he received his crown from Rome: yet was the emperor then no proper part of the papacy, nor did he take his right from the pope, neither did those that submitted unto him therein communicate with the pope’s authority. So is this in hand.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/william-ames.html">William Ames</a></span><span class="wk"><span class="lbl">Work:</span> <cite>A Second Manuduction for Mr</cite>, [John] Robinson. Or a confirmation of the former in an answer to his manumission (Amsterdam, 1615), pp. 12-13</span></figcaption>

<blockquote><p>…being persuaded in my conscience that the Lord had a true Church in this Realm [of England]… which, being assembled out of all the parts of the land in Parliament, did commit this authority to ordain ministers unto the bishops: and knowing out of the Word of God that every true Church has this power and authority to ordain ministers: I considered with myself that though the Church offended in committing this power and authority unto them that by the Law of God were not capable of it, yet I might without sin seek and take the Church’s ordination at their hands: as I may reverence and take the benefit of the prince’s power and authority, which is of God, though it be committed unto and exercised by men that by the Law of God are not capable of it. Secondly, seeing it is a thing not to be refused if a man entering into the ministry might have the approbation of all and every one of the ministers of the Gospel in the land:¹ it seems unto me the approbation of that bishop, that is also a minister and preacher of the Gospel, cannot be deemed to be merely unlawful.² ¹ [That such makes a valid ordination, see ‘The Implicit or Tacit Consent of Church Governors is Sufficient for the Power of Being an Office-Bearer’ and ‘That Persons who enter Church Office by Corruption, with the Standing Consent of the Rest of the Church Governors, is Valid’.] ² [Samuel Rutherford with much of the reformed likewise rightly argued that, while the office of a regular episcopal bishop is not Scriptural, nor do they have power, nor should be given power so that a single bishop could ordain a minister, yet the bishops did receive and maintain, with corruptions, the nature of the ministerial office: ‘That Episcopal Bishops &amp; Prelates are Unlawful but Valid Gospel Ministers’.] Thirdly, the authority of the Christian Magistrate (without whose liking and allowance a minister cannot be admitted to the ministry in peace) coming [joining] to the bishop by act of Parliament, I may more boldly come to him³ for his approbation in regard of the Law: not looking so much unto the man, [but] as regarding with reverence the power of the law and Christian magistrate.</p></blockquote>

</figure><figure class="quote" id="q-3322f90029" data-kw="">
<blockquote><p>This distinct form of episcopacy appeared to correspond roughly with the superintendents of the post-reformation kirk, who Baillie argued, were temporary and subject to the jurisdiction of presbyteries. This form of episcopacy, for instance, was distinct from the ‘reduced’ episcopacy of James Ussher, which Baillie denounced because it would have established a permanent episcopate… The only ecclesiological tenet that Baillie deemed to be ‘immutable’ was the division of church officers into ministers, elders and deacons. Baillie thus could argue that particulars of an ecclesiological settlement beyond this framework were not explicitly against Goďs word, albeit, as mentioned above, experience may deem particular arrangements inexpedient. Christians could err in ‘the particulars about the nature of Episcopacie, of Presbyteries, Synods, Sessions, ruling Elders,’ as such elements of ecclesiology were unclear in scripture.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/alexander-campbell.html">Alexander Campbell</a></span><span class="wk"><span class="lbl">Work:</span> <cite>‘Episcopacy in the Mind of Robert Baillie</cite>, 1637-1662’ The Scottish Historical Review, vol. 93, no. 236, pt. 1 (April 2014), pp. 29-55, p. 45</span></figcaption>

<blockquote><p>Objection: But we are bound by the canons of the Church which are still in force. Answer:

1. Scripture is the Church’s sufficient rule, and the perfect Law of God.

2. Those things that Scripture has left to occasional determination, no councils must make standing laws for to bind at all times. For if such laws had been fit, God would have made them.

3. It is the present guides of the Church that are upon the place, and see the occasions, that must determine such circumstantials as are of mutable determination. And former Church-governors can no more take away the power of the present, than they can deprive them of their office; it being essential to the office of every pastor to be a guide or ruler of his flock.

4. If you think that all Church canons (yea though it be General Councils) bind, then you are bound to contradictories: for one Council has oft crossed another. And Papists themselves disclaim many things enjoined by canons. The 16th canon of the 4th Council of Carthage requires ministers not to read the books of heathens: Does this bind now? Many the like might be mentioned.</p></blockquote>

3. It is the present guides of the Church that are upon the place, and see the occasions, that must determine such circumstantials as are of mutable determination. And former Church-governors can no more take away the power of the present, than they can deprive them of their office; it being essential to the office of every pastor to be a guide or ruler of his flock.

4. If you think that all Church canons (yea though it be General Councils) bind, then you are bound to contradictories: for one Council has oft crossed another. And Papists themselves disclaim many things enjoined by canons. The 16th canon of the 4th Council of Carthage requires ministers not to read the books of heathens: Does this bind now? Many the like might be mentioned.”

— Richard Baxter, Christian Concord, or the Agreement of the Associated Pastors &amp; Churches of Worcestershire, with Richard Baxter’s Explication &amp; Defence of it, &amp; his Exhortation to Unity, (London: A.M., 1653), ‘Objections Answered’, p. 92">Copy</button><a class="share" href="https://x.com/intent/post?text=%E2%80%9CObjection%3A+But+we+are+bound+by+the+canons+of+the+Church+which+are+still+in+force.+Answer%3A+1.+Scripture+is+the+Church%E2%80%99s+sufficient+rule%2C+and+the+perfect+Law+of+God.+2.+Those+things+that+Scripture+has+left+to+occasional+determination%2C+no+councils+must+make+standing+laws+for+to+bind+at+all+times.+For+if+such+laws+had+been+fit%2C+God+would+have+made+them.+3.+It+is+the+present+guides+of+the+Church+that+are+upon+the+place%2C+and+see+the+occasions%2C+that+must+determine+such+circumstantials+as+are+of+mutable+determination.+And+former+Church-governors+can+no+more+take+away+the+power+of+the+present%2C+than+they+can+deprive+them+of+their+office%3B+it+being+essential+to+the+office+of+every+pastor+to+be+a+guide+or+ruler+of+his+flock.+4.+If+you+think+that+all+Church+canons+%28yea+though+it+be+General+Councils%29+bind%2C+then+you+are+bound+to+contradictories%3A+for+one+Council+has+oft+crossed+another.+And+Papists+themselves+disclaim+many+things+enjoined+by+canons.+The+16th+canon+of+the+4th+Council+of+Carthage+requires+ministers+not+to+read+the+books+of+heathens%3A+Does+this+bind+now%3F+Many+the+like+might+be+mentioned.%E2%80%9D%0A%0A%E2%80%94+Richard+Baxter%2C+Christian+Concord%2C+or+the+Agreement+of+the+Associated+Pastors+%26+Churches+of+Worcestershire%2C+with+Richard+Baxter%E2%80%99s+Explication+%26+Defence+of+it%2C+%26+his+Exhortation+to+Unity%2C+%28London%3A+A.M.%2C+1653%29%2C+%E2%80%98Objections+Answered%E2%80%99%2C+p.+92&amp;url=https%3A%2F%2F5solasquotes.github.io%2Fquote%2Ff03e333876.html&amp;via=5Solas" target="_blank" rel="noopener">Share on X</a><a class="perma" href="../quote/f03e333876.html">Permalink</a><a class="src" href="https://reformedbooksonline.com/on-church-ordinances/#:~:text=Objection%3A%20But%20we%20are%20bound%20by,Many%20the%20like%20might%20be%20mentioned&amp;text=Objection%3A%20But%20we%20are%20bound%20by%20the%20canons&amp;text=bind%20now%3F%20Many%20the%20like%20might%20be%20mentioned" rel="noopener" target="_blank">Read it online · Reformed Books Online</a></div>
</figure><figure class="quote" id="q-f2fe5b8374" data-kw="">
<blockquote><p>…therefore all the former circumstances, as they are clothed with either moral conveniency and expediency, or with some religious positive goodness, must be warranted by the Word of God, or the rules of sinless and spiritual prudence, which cannot deviate from the Word of God… And as touching things of prudence, they are things properly mixed, as at what hour sermon shall begin in such a church, at eight, or nine, or ten of the clock; how the worship shall be ordered, whether you should begin the worship with a word of prayer, or a word of praising, or a word of exhorting to stir up for the duty of the day, is a matter of prudence; and because God has not laid the band of a precept on us, to begin with either of the three; therefore it would seem, that though the things themselves be moral, and must be warranted by a Word of God; yet the order is not moral, but prudential, and so cannot fall under a command of the Church; For to me it is hard that men and the Church should lay on a tie or bond of a precept where God has laid on no such bond; The Church, in these mixed things, where the morality is not clear, at farthest can but go on to directive advices, as Paul does, 1 Cor. 7:6,12, not to [the] imposing of laws, nor to injunctions or commandments under the pain of Church-censures; for Christ must bind and ratify in Heaven all Church-censures on earth, and so the Church cannot command nor censure but as Christ Himself would command or censure.</p></blockquote>

<blockquote><p>…these were to be offered continually as a burnt offering upon the altar, which law was not to take place until they came into the [Promised] Land, as we heard before in the like case, [Num.] ch. 15:2, because in the desert they wanted many things necessary, Dt. 12:8, which was a sufficient dispensation for the omitting of them: For when God does require anything, He gives means to perform it; and did never impute it as a sin unto them when an inevitable necessity did hinder them, and the desire to obey is no less accepted than obedience itself.</p></blockquote>

<blockquote><p>XXVIII… Gathering new churches by way of separation from others, or gathering assemblies without the consent of the lawful pastors who had the charge of the people of those assemblies, is a sin and schism in all these cases following:

1. In general, when the laws, practices or persons of the church which they separate from give them no sufficient cause of a departure.

2. In general, when in the judgment of true reason, according to the notable evidence of the case, the said assemblies are likely to do more hurt than good.

3. When such assemblies are gathered in opposition to some truth which the separaters would thereby disown (e.g. infant-baptism, the lawfulness of [some] set-forms of praise or prayer, or any sound doctrine) or [they are gathered] for the profession and propagation of some heresy or error (as Antinomianism, Popery, etc.).

4. When such churches are gathered by men that have no true fitness and calling for the sacred ministry or the work which they undertake.

5. When they are gathered by the pride of the ministers that would thereby unduly set up themselves and draw away disciples after them, or by their covetousness, seeking not the good of the flock, but the fleece, not them, but theirs, not serving the Lord Jesus, but their own bellies: or when gathered, by the pride of the people that unjustly think those that they separate from [are] men unworthy of their communion, and say to them, ‘Come not near to us; we are holier than you,’ Isa. 65:5.

6. When they are gathered by a quarrelsome passion, falling out with the pastors and people whom they separate from. The parting of Paul and Barnabas [Acts 15:36-40] had some evil in it.

7. When they are gathered to encourage and strengthen a sinful faction or party, or when men separate from others for fear of being censured by such a party, as Peter did withdraw from the gentile Christians lest he should displease the erroneous Jews, Gal. 2.

8. When it is done out of a proud overvaluing of men’s own opinions, or some odd singularity whereby men cannot bear those that are not of their mind, or whereby they would fain be more conspicuous as more orthodox and wise than others.

9. When it is done mistakingly to set up some wrong course of Church government or worship (as that the people may have the power of the keys or of examining and judging all admitted members, or that Papal government or the mass may be introduced, [or for] enthusiastical disorderly talking by pretended inspiration, by ignorant uncalled men, or to introduce such traditions and superstitions as the Papists use, etc.).

10. When it is done upon a false conceit that a man’s presence with any Church that has known error or faults in doctrines or worship is guilty [of] approving them; and therefore that they must separate from all such.

11. When they separate out of an unruliness of spirit, because they will not be governed by their lawful pastors in lawful things, as time, place, order, etc. or because a minor part in elections is over-voted by the major part and cannot have their wills.

12. When they separate out of a profaneness of mind, not enduring the power of the preacher’s doctrine or the holiness and discipline of the Church, but would be licentious, while they would be called religious. All these are unlawful separations and assemblings.

13. Yet that which is unlawful as to the principle, end and manner secundum quid [‘according to that’], is not always unlawful simply and in the thing itself, for a proud, covetous, turbulent person may sinfully do a lawful thing. XXIX… When pastors by concord or magistrates by laws have settled lawful circumstances or accidents of Church order or worship, or discipline, though they be in particular but human institutions, it is sinful disobedience to violate them without necessary reason, e.g. parochial order, associations, times, places, ministers, maintenance, Scripture-translations, etc. XXX… When able, faithful pastors are lawfully set over the assemblies by just election and ordination, if any will causelesly and without right silence them, and command the people to desert them, and to take others for their pastors in their stead, of whom they have no such knowledge as may encourage them to such a change, we cannot defend this from the charge of schism, which puts a congregation on so hard a means of concord as to judge whether they are bound to that pastor that was set over them as Christ appointed, or must renounce him and take the other when they are commanded. So Cyprian in the case of Novatian says that he could be no bishop because another was rightful bishop before.</p></blockquote>

<blockquote><p>Again, your subjoined text of Scripture [to your book], ‘If the Lord be God, follow Him; but if Baal’—for what purpose was it set there? What? to signify that the God of the dissenters and of the Established Church differ as the living God and Baal?… It was uncharitable. Uncharitable? That is a trifle in comparison; it was profane and most impious wit: yet you are mighty fond of the conceit and we have it over and over in the book that the conformists and dissenters serve two Gods—as the one of them is miscalled—and have two religions!… and, for aught appears you intend, in most of them [established churches], you blaspheme as a senseless idol—rebuke, and forgive you!</p></blockquote>

— John Howe, ‘Some Consideration of a Preface to an Inquiry Concerning the Occasional Conformity of Dissenters, etc.’ in The Works of John Howe, vol. 5, Containing the Treatises: On Divine Prescience and the Trinity… (d. 1705; Religious Tract Society, 1863), p. 284">Copy</button><a class="share" href="https://x.com/intent/post?text=%E2%80%9CAgain%2C+your+subjoined+text+of+Scripture+%5Bto+your+book%5D%2C+%E2%80%98If+the+Lord+be+God%2C+follow+Him%3B+but+if+Baal%E2%80%99%E2%80%94for+what+purpose+was+it+set+there%3F+What%3F+to+signify+that+the+God+of+the+dissenters+and+of+the+Established+Church+differ+as+the+living+God+and+Baal%3F%E2%80%A6+It+was+uncharitable.+Uncharitable%3F+That+is+a+trifle+in+comparison%3B+it+was+profane+and+most+impious+wit%3A+yet+you+are+mighty+fond+of+the+conceit+and+we+have+it+over+and+over+in+the+book+that+the+conformists+and+dissenters+serve+two+Gods%E2%80%94as+the+one+of+them+is+miscalled%E2%80%94and+have+two+religions%21%E2%80%A6+and%2C+for+aught+appears+you+intend%2C+in+most+of+them+%5Bestablished+churches%5D%2C+you+blaspheme+as+a+senseless+idol%E2%80%94rebuke%2C+and+forgive+you%21%E2%80%9D%0A%0A%E2%80%94+John+Howe%2C+%E2%80%98Some+Consideration+of+a+Preface+to+an+Inquiry+Concerning+the+Occasional+Conformity+of+Dissenters%2C+etc.%E2%80%99+in+The+Works+of+John+Howe%2C+vol.+5%2C+Containing+the+Treatises%3A+On+Divine+Prescience+and+the+Trinity%E2%80%A6+%28d.+1705%3B+Religious+Tract+Society%2C+1863%29%2C+p.+284&amp;url=https%3A%2F%2F5solasquotes.github.io%2Fquote%2Fc003f2e045.html&amp;via=5Solas" target="_blank" rel="noopener">Share on X</a><a class="perma" href="../quote/c003f2e045.html">Permalink</a><a class="src" href="https://reformedbooksonline.com/on-impurities-in-worship/#:~:text=Again%2C%20your%20subjoined%20text%20of%20Scripture,a%20senseless%20idol%E2%80%94rebuke%2C%20and%20forgive%20you&amp;text=Again%2C%20your%20subjoined%20text%20of%20Scripture%20%5Bto%20your&amp;text=blaspheme%20as%20a%20senseless%20idol%E2%80%94rebuke%2C%20and%20forgive%20you" rel="noopener" target="_blank">Read it online · Reformed Books Online</a></div>

</figure><figure class="quote" id="q-688bda96f3" data-kw="">
<blockquote><p>Q. 138, ‘How may we know the Fundamentals, Essentials, or what parts are necessary to Salvation? And is the Papists way allowable that (some of them) deny that distinction, and make the difference to be only in the degrees of men’s opportunities of knowledge?’ …And whereas they [Papists] would make all the parts of Christian faith and practice equally necessary, where men have a capacity and ability to know, believe and practice them, it is a gross deceit… And thereby they make all sins and errors as equal as all duties and truths (James 3:2; 1 John 1, end). Whereas:

1. There is no man that has not some error and some sin.

2. There is no man that does all that ever he was able to do to understand all the truth.

3. Therefore there is no man whose errors themselves are not (many of them at least) culpable or sinful.

4. And they that distinguish between mortal and venial sins, and yet will not distinguish between mortal and venial errors, are either blind or would keep others blind. As it is not so damning a sin for a man to think a vain thought, or to speak a vain word, as not to love God or holiness (no though he was more able to have forborne that idle word than to have loved God), so it is not so mortal a sin (that is, inconsistent with a justified state) to mistake in a small matter (as who was the Father of Arphaxad, or what year the world was drowned in, etc.) as to blaspheme the Holy Ghost or deny Jesus Christ to be the Savior of the world, or to deny that there is a God or everlasting life, or a difference between good and evil. All sins are not equal in magnitude or danger. Therefore all errors are not equal in magnitude sinfulness or danger.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/richard-baxter.html">Richard Baxter</a></span><span class="wk"><span class="lbl">Work:</span> <cite>A Christian Directory, or a Sum of Practical Theology</cite>, … (London, 1673), pt. 3, Christian Ecclesiastics, p. 895</span></figcaption>

<main class="wrap"><figure class="quote" id="q-ff83496309" data-kw="">
<blockquote><p>16. And indeed, as among the external instrumental causes of justification there is both the Word of the Gospel, Rom. I.16, and the sacraments, Tit. III.5; 1 Pet. III.21: so the internal instrumental cause is not hope, charity, fear, repentance, etc., but faith alone among causes of its own order — and alone indeed not by reason of its existence, but by reason of its apprehension and the faculty of apprehending — inasmuch as it alone is the analogous instrument suited to the apprehension of the righteousness of Christ.

17. Faith, moreover, is considered in the act of justification neither dispositively, nor habitually, nor formally, nor meritoriously, nor in the genus of a work, but partly organically by reason of its own act, and partly correlatively by reason of its object [i.e. Christ]. Whence the apostle wisely says that we are justified πίστει [pistei, by faith], ἐκ πίστεως [ek pisteōs, out of faith], διὰ τῆς πίστεως [dia tēs pisteōs, through faith] — but never διὰ τὴν πίστιν [dia tēn pistin, on account of faith].</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/friedrich-spanheim.html">Friedrich Spanheim</a></span><span class="wk"><span class="lbl">Work:</span> <cite>‘Disputation on the Justification of Man before God’ in Disputationum Theologicarum Miscellaneorum Pars Prima</cite>, (Geneva: Chouët, 1652), trans. AI by Roman Prestarri at Confessionally Reformed Theology</span></figcaption>

</figure><figure class="quote" id="q-b7b3b35434" data-kw="">
<blockquote><p>By ‘works’ here [Rev. 20:12-13] are we judged and justified, and not by faith only, as also James 2:24 testifies, meaning hereby that of lively faith and of the good works that follow thereupon man is justified, and not of that dead faith that is by itself alone, without any good works: otherwise were the words of Paul (Rom. 3:28) express contrary to this text, and to James; for, says Paul, ‘We are justified by faith, without the works of the Law,’ that is to say, not without good works whatsoever, but meaning that we are justified by lively faith with such small good works as our weak nature will suffer that faith to produce, although it be without the precise works that the Law requires: and for confirmation of this interpretation, and union of these texts, ye shall find both James and Paul agree in diverse places, that faith without works is a dead faith, and serves nothing to justification. And again, they agree both that all works (how good soever they seem) that proceed not from faith, are evil. And so it is all one to say with Saint Paul, We are justified by fruitful faith, or faith that produces good works, although not the works that the Law requires, or to say with James, and here with Saint John, we are justified by faithful works, seeing a working faith and faithful works are inseparable, and none can have the one without the other. So for conclusion, these works, by the which here we are judged, are to be esteemed good or evil, not in themselves, or insofar as they satisfy the Law (for so were all works evil and imperfect), but insofar forth as they have or want faith adjoined with them, they are accounted good or evil only.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/john-napier.html">John Napier</a></span><span class="wk"><span class="lbl">Work:</span> <cite>A Plain Discovery of the Whole Revelation of St. John</cite>, … (Edinburgh: Waldegrave, 1593), ch. 20, pp. 242-43 Napier (1550-1617) was a Scottish mathematician (who discovered logariths), physicist and astronomer in the reformed tradition.</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/justification/nature-of-justification.html">Nature of Justification</a></span></div>

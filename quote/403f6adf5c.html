<blockquote><p>Q. 145. Has God such a will in Him, as He calls a conditional will? as for example, to will all men’s salvation if they repent? Answer: Properly there cannot be a conditional will in God: First, because such a will supposes a superior that may hinder, Acts 18:21. Secondly, it supposes ignorance how things may fall out, as Abraham willed his servant to fetch a wife for Isaac out of the land of his kindred, Gen. 24:4, if she were willing, verse 8. Nevertheless, improperly it may be given to God, not as though his will can have a condition, for that’s the property of a created will, to have a condition of it, Jam. 4:15, but because the thing willed of God may have a condition, Isa. 7:9. Now, that the Lord may be said to have a conditional will in some sense is plain: First, because He is said to will the connection of things when He does not will the things asunder; and therefore He wills them only upon the condition of a connection: God would have all men to repent and come to the knowledge of the truth, 1 Tim. 2:4. Secondly, because He is said to will the salvation of all believers and true penitent persons, and therefore if a reprobate do believe, He wills his salvation, 1 Kn. 11:38. This is true of God towards a reprobate: “If thou wilt obey Me, I will bless thee,” Dt. 7:12-13.</p></blockquote>

<blockquote><p>XXV. Thirdly, it is asked how Christ could offer such prayers to God as openly appear to be repugnant to the divine counsel and will, and thus to the piety and obedience which he most constantly exhibited to the Father? For what? Was he not born and made mediator for this very reason, that he might drink this cup for our salvation? Did he not know that this was the decree of the Father, as he himself testified more than once, that he must suffer many things and be killed? Mt. 16:21. Indeed, when he was being seized by the soldiers, he rebukes Peter for resisting them: “Shall I not drink the cup which my Father hath given me?” How, therefore, is he contrary to himself and to the Father, by requesting with such effort that the cup be transferred from him? Here, indeed, there are many things that can be replied. 1st, We suppose, against the Monothelites, that there was a twofold will in Christ, just as there was a divine and a human nature; these were not indeed adverse and repugnant to one another, but were nevertheless diverse insofar as they were directed toward diverse objects. The divine [will] willed death because it had been so ordained by the Father for our redemption; the human, however, shuddered and prayed against it, because it viewed it as the destruction of nature and the most dire of all evils that could exist; yet the human will is not rightly said to have been repugnant to the divine, because it petitioned not absolutely, but conditionally; not with a deliberate and elective will, but rather with an inefficacious and natural velleity. Therefore, it is to be observed 2nd, that the will can be divided in many ways; for one is called efficacious, another inefficacious; that is called efficacious which is the principle of acting, and which moves and impels a man to execute those things which it wills and to remove, as much as it can, any impediments to operation; [Ineffectual] which is not brought into effect, whether because of impediments arriving from elsewhere, or because it is a simple complacency in the good, or displeasure at evil, and does not proceed further so as to be a principle of operating, nor does it in reality impel one to the execution of the thing, which deserves to be called velleity rather than will. Therefore, when Christ is said to have willed that the cup might pass, this ought not to be understood of an efficacious will which produced in Him any attempt at escaping and extricating Himself from those snares; indeed, we see Him led as a sheep to the slaughter, Isa. LIII:8, so that He in no way resisted, nor attempted to flee from death, but of an ineffectual will which signifies nothing other than a simple displeasure arising from a natural inclination by which the will abhors that which destroys nature. XXVI. The will is either natural and indeliberate, or deliberate and elective. The former is called will by way of nature, the latter by way of reason, thus Thomas, pt. 3, quest. 18, art. 5. Will as nature, or by way of nature, is a physical faculty having a natural inclination toward the preservation of the whole composite, or it is a desire for advantage; it is called indeliberate will because it is borne toward an object considered absolutely without any consideration of circumstances. But will by way of reason is a rational faculty for pursuing the general good of the whole man as he is man, or for following the dictate of the practical intellect advising what is right and just; it is called elective will because it is a desire and affection for justice rather than for one’s own utility; it is also called deliberate will because it regards an object clothed in all its circumstances, and this will is referred to rational cognition as to its cause, because it follows not the instinct of nature but the dictate of reason. The will of nature naturally flees those things which are contrary to nature, such as death, torments, etc. The will by way of reason can be borne even toward those things which are adverse to nature, provided they are just and honorable or necessary; thus, for example, he who by natural will flees and is averse to a bitter potion, nevertheless receives the same by rational will, because he knows there is no other way of recovering health. In the same way, martyrs by nature cannot but shudder at death, but the same persons, nevertheless, approach it eagerly out of reason as the most glorious testimony of the benevolence of God, and glory in it. In clearly the same manner, Christ willed and did not will death, in a different respect. The will by way of nature did not will it, but the same by way of reason willed it; it did not will it insofar as natural appetite was a desire that He might live, and it viewed death absolutely and in itself as the destruction of nature. But insofar as He viewed the same with its circumstances, that is, as decreed by God and necessary for the salvation of the elect, He was borne toward it with a most propense affection, just as He testified elsewhere that this was His food, that He might do the will of His Father. Jn. IV:34; XXVII:4. Will is distinguished into simple and absolute, and hypothetical or conditional. The former is that by which one wills something absolutely and efficaciously, so that he leaves nothing undone so that that will may be brought into effect. The latter in which one wills something under a condition, and which is contained within certain limits. Thus, with an absolute will, the faithful seek the remission of their sins, and whatever things are necessary for their salvation. But with a conditional will, they seek those things which do not pertain to salvation in themselves, nor, whether granted, promote it, or, if denied, remove it—for instance, wealth, health, strength, external peace—in the seeking of which they must always add that condition, expressly or implicitly: “if the will of God so carries it.</p></blockquote>

be+observed+2nd%2C+that+the+will+can+be+divided+in+many+ways%3B+for+one+is+called+efficacious%2C+another+inefficacious%3B+that+is+called+efficacious+which+is+the+principle+of+acting%2C+and+which+moves+and+impels+a+man+to+execute+those+things+which+it+wills+and+to+remove%2C+as+much+as+it+can%2C+any+impediments+to+operation%3B+%5BIneffectual%5D+which+is+not+brought+into+effect%2C+whether+because+of+impediments+arriving+from+elsewhere%2C+or+because+it+is+a+simple+complacency+in+the+good%2C+or+displeasure+at+evil%2C+and+does+not+proceed+further+so+as+to+be+a+principle+of+operating%2C+nor+does+it+in+reality+impel+one+to+the+execution+of+the+thing%2C+which+deserves+to+be+called+velleity+rather+than+will.+Therefore%2C+when+Christ+is+said+to+have+willed+that+the+cup+might+pass%2C+this+ought+not+to+be+understood+of+an+efficacious+will+which+produced+in+Him+any+attempt+at+escaping+and+extricating+Himself+from+those+snares%3B+indeed%2C+we+see+Him+led+as+a+sheep+to+the+slaughter%2C+Isa.+LIII%3A8%2C+so+that+He+in+no+way+resisted%2C+nor+attempted+to+flee+from+death%2C+but+of+an+ineffectual+will+which+signifies+nothing+other+than+a+simple+displeasure+arising+from+a+natural+inclination+by+which+the+will+abhors+that+which+destroys+nature.+XXVI.+The+will+is+either+natural+and+indeliberate%2C+or+deliberate+and+elective.+The+former+is+called+will+by+way+of+nature%2C+the+latter+by+way+of+reason%2C+thus+Thomas%2C+pt.+3%2C+quest.+18%2C+art.+5.+Will+as+nature%2C+or+by+way+of+nature%2C+is+a+physical+faculty+having+a+natural+inclination+toward+the+preservation+of+the+whole+composite%2C+or+it+is+a+desire+for+advantage%3B+it+is+called+indeliberate+will+because+it+is+borne+toward+an+object+considered+absolutely+without+any+consideration+of+circumstances.+But+will+by+way+of+reason+is+a+rational+faculty+for+pursuing+the+general+good+of+the+whole+man+as+he+is+man%2C+or+for+following+the+dictate+of+the+practical+intellect+advising+what+is+right+and+just%3B+it+is+called+elective+will+because+it+is+a+desire+and+affection+for+justice+rather+than+for+one%E2%80%99s+own+utility%3B+it+is+also+called+deliberate+will+because+it+regards+an+object+clothed+in+all+its+circumstances%2C+and+this+will+is+referred+to+rational+cognition+as+to+its+cause%2C+because+it+follows+not+the+instinct+of+nature+but+the+dictate+of+reason.+The+will+of+nature+naturally+flees+those+things+which+are+contrary+to+nature%2C+such+as+death%2C+torments%2C+etc.+The+will+by+way+of+reason+can+be+borne+even+toward+those+things+which+are+adverse+to+nature%2C+provided+they+are+just+and+honorable+or+necessary%3B+thus%2C+for+example%2C+he+who+by+natural+will+flees+and+is+averse+to+a+bitter+potion%2C+nevertheless+receives+the+same+by+rational+will%2C+because+he+knows+there+is+no+other+way+of+recovering+health.+In+the+same+way%2C+martyrs+by+nature+cannot+but+shudder+at+death%2C+but+the+same+persons%2C+nevertheless%2C+approach+it+eagerly+out+of+reason+as+the+most+glorious+testimony+of+the+benevolence+of+God%2C+and+glory+in+it.+In+clearly+the+same+manner%2C+Christ+willed+and+did+not+will+death%2C+in+a+different+respect.+The+will+by+way+of+nature+did+not+will+it%2C+but+the+same+by+way+of+reason+willed+it%3B+it+did+not+will+it+insofar+as+natural+appetite+was+a+desire+that+He+might+live%2C+and+it+viewed+death+absolutely+and+in+itself+as+the+destruction+of+nature.+But+insofar+as+He+viewed+the+same+with+its+circumstances%2C+that+is%2C+as+decreed+by+God+and+necessary+for+the+salvation+of+the+elect%2C+He+was+borne+toward+it+with+a+most+propense+affection%2C+just+as+He+testified+elsewhere+that+this+was+His+food%2C+that+He+might+do+the+will+of+His+Father.+Jn.+IV%3A34%3B+XXVII%3A4.+Will+is+distinguished+into+simple+and+absolute%2C+and+hypothetical+or+conditional.+The+former+is+that+by+which+one+wills+something+absolutely+and+efficaciously%2C+so+that+he+leaves+nothing+undone+so+that+that+will+may+be+brought+into+effect.+The+latter+in+which+one+wills+something+under+a+condition%2C+and+which+is+contained+within+certain+limits.+Thus%2C+with+an+absolute+will%2C+the+faithful+seek+the+remission+of+their+sins%2C+and+whatever+things+are+necessary+for+their+salvation.+But+with+a+conditional+will%2C+they+seek+those+things+which+do+not+pertain+to+salvation+in+themselves%2C+nor%2C+whether+granted%2C+promote+it%2C+or%2C+if+denied%2C+remove+it%E2%80%94for+instance%2C+wealth%2C+health%2C+strength%2C+external+peace%E2%80%94in+the+seeking+of+which+they+must+always+add+that+condition%2C+expressly+or+implicitly%3A+%E2%80%9Cif+the+will+of+God+so+carries+it.%E2%80%9D%0A%0A%E2%80%94+Francis+Turretin%2C+Disputations+on+the+Satisfaction+of+Christ%E2%80%A6+%28Geneva%2C+1666%29%2C+6th+Disputation%2C+which+is+the+Fourth+on+the+Truth+of+Christ%E2%80%99s+Satisfaction%2C+Asserted+from+his+Agony+and+Desertion+tr.+AI+by+The+Received+Faith%2C+sect.+25-29&amp;url=https%3A%2F%2F5solasquotes.github.io%2Fquote%2F88115f67b8.html&amp;via=5Solas" target="_blank" rel="noopener">Share on X</a><a class="perma" href="../quote/88115f67b8.html">Permalink</a><a class="src" href="https://reformedbooksonline.com/on-ineffectual-willings-of-god/#:~:text=XXV.%20Thirdly%2C%20it%20is%20asked%20how,will%20of%20God%20so%20carries%20it." rel="noopener" target="_blank">Read it online · Reformed Books Online</a></div>

<blockquote><p>II. This punishment (this disobedience having been posited) the divine nature first of all requires, for God is a consuming fire who cannot bear sin (Deut 4:24, Hab 1:13). Yet we do not want God to act irrationally (just as elementary fire), but most rationally, concomitantly to his nature but not antecedently, for he is a rational and intelligent fire who, although he can transfer the burning to another combustible thing, yet cannot suspend it totally: 1. Because God hates and abhors sin to the utmost, and hatred (like all affections) belongs to God according to its effects, and signifies in him 1) opposition to the hated thing, 2) rejection and damnation and grave punishment of the one who perpetrates that hated thing, as even Vorstius teaches (Notes on Disp. 10 on God, thesis 20). 2. God as the best being, by necessity of nature is zealous for his own glory, which is the end of all his actions, which does not happen unless by vindicating the contempt of himself which he suffers through sin, which is not expiated except through punishment. 3. The supreme Lord by necessity of nature requires supreme acknowledgment of himself, which is denied to him through sin, which cannot be repaired except through the acknowledgment of the despiser by which he may experience how grave and sad is the contempt of his master. And these things are so true that even in civil affairs, neglect of his majesty cannot consist with the supreme magistrate; nor therefore through this is God rendered impotent, as the Socinian Gitichius deduces from this (Against Lucius, Argument 2). For he cannot deny himself (2 Tim 2:13) nor his glory. Secondly, the truth of the divine threats, by which the highest torments await sinners, demands this punishment (see the previous thesis). III. Hence if any are vindicated from this servitude (as it is certain that all the elect have been and will be vindicated), it is necessary that this acknowledgment, that is, the restitution of honor, be exhibited to the supreme Lord and Ruler injured and offended by our disobedience, and that his laws and exactions be satisfied. But what can man do for this? His demerit is infinite (by the previous thesis)… IV… Hence fall: 1. The mimicry of the Socinians arguing against the satisfaction of Christ from the gratuitous remission made to us, and refuting our arguments for it (see Socinus, De Servatore, part 3, ch. 2, and Praelections ch. 117, §5; Volkelius and Gitichius ibid.). 2. Their argument from Eph 4:32 that we ought to forgive our brothers as God has forgiven us. Right! Gratuitous remission has come about for us, but on account of Christ’s satisfaction “in Christ” (as the Apostle adds there), through whose blood we have remission of sins from the riches of divine grace (Eph 1:7). Indeed, what is clearer for the possibility of composing most strict satisfaction and gratuitous remission than the example of Paul entreating remission for Onesimus and offering his own payment (Philem 10,12,18-19)? 3. Nor is the transfer of our obligation to Christ repugnant to divine justice (as Socinus argues, part 3, ch. 3). It is indeed essential to sin that it be set in order through punishment, but it is not essential that it be vindicated in the very one who sinned. For God is placated provided that esteem is restored to him and his laws satisfied (for in these he was injured, by Thesis 1). But this is done through Jesus Christ; indeed, it can be done through him alone, because he alone has order and proportion with God. 4. Nor does it oppose the truth of [God’s] threats (as Socinus ibid.), since that too is preserved provided that someone sponsors for those who sinned. They indeed have this from transgression, that they are under obligation to punishments, but it is not required that the transgression actually be vindicated in them, as was just said.</p></blockquote>

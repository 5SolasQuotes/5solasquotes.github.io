<main class="wrap"><figure class="quote" id="q-2f36d8f083" data-kw="">
<blockquote><p>…to take a simple bodily action as an example, the intellect and will constitute the formal-cum-final cause of the action, of which the firing of the neurons, flexing of the muscles, and so on are the material-cum-efficient causes. That it is a bodily action is due to its matter and the way the bodily parts interact; that it is a bodily action with a certain specific end in view (rather than an involuntary reflex or an unconscious robotic movement) is due to its form and final cause. There are not (as there are for the Cartesian dualist) two substances with events going on in each that are somehow mysteriously correlated. There is one substance and one set of events having both formal and material, and final- and efficient-causal components.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/edward-feser.html">Edward Feser</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Aquinas: a Beginner’s Guide (OneWorld, 2010), ch. 4, ‘Psychology’ | ‘The Soul’, pp. 114-22 ‘Hylemorphic Dualism’, pp. 138-47</cite>, pp. 141-42</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/theology/faith-and-reason.html">Faith and Reason</a></span></div>

</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-50f44e86d0" data-kw="">
<blockquote><p>But for what reason, then, is eternal punishment due to it? You respond, by the condition of man, who is found without grace; and that this is the doctrine of St. Thomas (Stapleton, Of Original Sin, bk. 1, ch. 1, disp. 1, q. 5). Whatever this may be, it is surely most absurd: that man is punished not because he is stained by original sin, but because he lacks the grace which ought to have been present. Is it thus graver and more repugnant to original justice to lack grace than to be stained with a fault? But this very lack of justice, if it could be separated from stains, would be much lighter than to be stained with sins; for it could happen that someone is held to be unjust, as Pighius thought, on account of a plainly alien offense, of which he himself was never an associate. Then, a stain brings a deformity worthy of hatred and punishment; to lack justice indeed removes a habit, but does not posit the contrary. But Scripture, on the contrary, teaches that nothing but uncleanness and abomination delays entry into heaven (Apoc. 21:27). But from these things it is now sufficiently clear how this error about the punishment of original sin is not undeservedly or falsely imposed upon you. For first you teach that no punishment of sense, neither exterior nor interior, is due to this sin (Thomas, in 2, dist. 33, q. 2, art. 2). For there is a certain eternal punishment, if we believe you, without the sense of pain, and with this original sin, if it is alone, is punished: a mild punishment, I believe, which inflicts no pain either without or within. What is this other than to take away all punishment?</p></blockquote>

</figure><figure class="quote" id="q-f03dd13181" data-kw="">
<blockquote><p>Thus, intellect and reason may not be considered as a basis for, as a rule to go by, or as a touchstone, in determining whether that which God reveals in His Word is truth. We believe this solely … because God declares it to be so. Reason must surrender itself to the Word; the Word must never surrender itself to reason. Reason is to Scripture what Hagar was to Sarah; it is the servant and not the master.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/wilhelmus-a-brakel.html">Wilhelmus à Brakel</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Christian&#x27;s Reasonable Service</cite>, vol. 1, ch. 2, pp. 59–60</span></figcaption>

</figure><figure class="quote" id="q-cb67543f31" data-kw="">
<blockquote><p>It may well be, and I find it convincing, that there is a great deal of continuity between the mainstream of Protestant reformers, especially in the Reformed tradition, and the thought of Thomas Aquinas, on a wide variety of points, some metaphysical, some doctrinal, and some moral and practical. But it is not the case that the Reformers as such were concerned with being faithful Thomists. The teaching of Thomas Aquinas, whether engaged directly or filtered through various traditions and appropriated as such, was of instrumental value to the Reformers. The point for the Reformers in engaging Thomas was not so that they could become more faithful Thomists. Rather, they used Thomas to the extent that they found Thomas and his teachings helpful in clarifying the true teachings of the church and necessary reforms. The same is true, mutatis mutandis, for other predecessors, whether Bernard of Clairvaux, Duns Scotus, or Gregory of Rimini, which explains in part the persistent eclecticism of the Reformers—considered both individually and corporately—even where there is more or less clear dependence or reliance on an earlier authority. In this way, there is the potential for misunderstanding if something identified as Reformed Thomism or Calvinist Thomism is taken to mean that there was a self-styled attempt by Reformed theologians to be Thomists in the sixteenth or seventeenth centuries… The ‘sounder scholastics’ (like Thomas) are put to positive use more often essentially because they are sounder. But where a Reformer thinks that Thomas is mistaken or not helpful, there is little hesitation to depart from (or ignore) his thought.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/jordan-j-ballor.html">Jordan J. Ballor</a></span><span class="wk"><span class="lbl">Work:</span> <cite>‘The Prophetic Role of The Protestant Reformation’ (2024) in Hanover Review, vol. 3, no. 1 (2024)</cite></span></figcaption>
<div class="meta"><span class="t"><a href="../topics/theology/faith-and-reason.html">Faith and Reason</a></span></div>

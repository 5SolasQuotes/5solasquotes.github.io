<main class="wrap"><figure class="quote" id="q-7b60dbb716" data-kw="">
<blockquote><p>Those whom God has adopted as sons, he is said to have elected, not in themselves, but in Christ Jesus (Eph. 1:4); because he could love them only in him, and only as being previously made partakers with him, honor them with the inheritance of his kingdom. But if we are elected in him, we cannot find the certainty of our election in ourselves; and not even in God the Father, if we look at him apart from the Son. Christ, then, is the mirror in which we ought, and in which, without deception, we may contemplate our election. For since it is into his body that the Father has decreed to ingraft those whom from eternity he wished to be his, that he may regard as sons all whom he acknowledges to be his members, if we are in communion with Christ, we have proof sufficiently clear and strong that we are written in the Book of Life.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/john-calvin.html">John Calvin</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Institutes of the Christian Religion</cite>, 3.24.5</span></figcaption>

</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-fd92ded097" data-kw="Assurance Election Holy Spirit">
<blockquote><p>When the Holy Ghost sealeth a man up, the thing he makes known, the thing he sealeth to him is this, that he is in Christ, that he hath been elected in Christ by God the Father from everlasting, that he is one in Christ; he was one with him from everlasting, he was one with him when he hung upon the cross, he is one with him now in heaven.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/thomas-goodwin.html">Thomas Goodwin</a></span><span class="wk"><span class="lbl">Work:</span> <cite>An Exposition of the First Chapter of Ephesians</cite>, Works, vol. 1, Sermon XVI (Eph. 1:13)</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/assurance-peace-and-joy/testimony-of-the-spirit.html">Testimony of the Spirit</a> › <a href="../topics/assurance-peace-and-joy/testimony-of-the-spirit/sealing-of-the-spirit.html">Sealing of the Spirit</a></span><span class="t"><a href="../topics/election/election-in-christ.html">Election in Christ</a> › <a href="../topics/election/election-in-christ/elect-in-the-mediator.html">Elect in the Mediator</a></span></div>

</figure><figure class="quote" id="q-a8ae778da8" data-kw="">
<blockquote><p>Before the foundation of the world, by sheer grace, according to the free good pleasure of his will, God chose in Christ to salvation a definite number of particular people out of the entire human race, which had fallen by its own fault from its original innocence into sin and ruin. Those chosen were neither better nor more deserving than the others, but lay with them in the common misery. God did this in Christ, whom he also appointed from eternity to be the mediator, the head of all those chosen, and the foundation of their salvation. And so God decreed to give to Christ those chosen for salvation, and to call and draw them effectively into Christ’s fellowship through the Word and Spirit. In other words, God decreed to grant them true faith in Christ, to justify them, to sanctify them, and finally, after powerfully preserving them in the fellowship of the Son, to glorify them.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/synod-of-dort.html">Synod of Dort</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Canons of Dort</cite>, Head 1, Art. 7</span></figcaption>

</figure><figure class="quote" id="q-506762ccac" data-kw="">
<blockquote><p>As the godly consideration of predestination and our election in Christ, is full of sweet, pleasant, and unspeakable comfort to godly persons, and such as feel in themselves the working of the Spirit of Christ, mortifying the works of the flesh, and their earthly members, and drawing up their mind to high and heavenly things, as well because it doth greatly establish and confirm their faith of eternal salvation to be enjoyed through Christ, as because it doth fervently kindle their love towards God: so, for curious and carnal persons, lacking the Spirit of Christ, to have continually before their eyes the sentence of God’s predestination is a most dangerous downfall, whereby the devil doth thrust them either into desperation, or into wretchlessness [recklessness] of most unclean living, no less perilous than desperation.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/church-of-england.html">Church of England</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Thirty-Nine Articles</cite>, 1563, Art. 17</span></figcaption>

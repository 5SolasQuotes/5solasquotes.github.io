<main class="wrap"><figure class="quote" id="q-6561d1b4e2" data-kw="">
<blockquote><p>Slightly different, indeed, seems to be the case of those children who live till they are able to exercise their reason. For when they grow up, facts demonstrate how much grace has been bestowed upon them in infancy. It is natural for young people in the transition stage of life to reject the lessons of piety, whether they are or are not baptized. Nor can we at this time discern the difference between elect and non-elect except through the special operation of divine grace.

More correctly, as there are different dispositions and varying temperaments, it sometimes happens that young persons, born within the pale of the covenant, reckoned among the elect and baptized as such, turn out for a time specially intractable and wicked, who yet, afterwards, on arriving at greater maturity, make their calling and election sure. What are we to think of such persons?

One of two things must be supposed. Either that they had been born again in infancy, but that the seed of the new birth had laid hid in the soil for many years, all but choked by the thorns and thistles of youthful lusts, till at length, through the communication of more grace, the opposing influences were vanquished and it broke forth and germinated with greater strength and beauty; or that God, who is tied down to no particular season, communicates the grace of the new birth to the elect whenever he will, and that they, although in the judgment of charity duly baptized, are often left for a considerable number of years in a state of dominant unsubdued corruption before they are renewed by the grace of his Spirit.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/herman-witsius.html">Herman Witsius</a></span><span class="wk"><span class="lbl">Work:</span> <cite>On the Efficacy and Utility of Baptism in the Case of Elect Infants whose Parents are under the Covenant</cite>, (1693), trans. William Marshall, ed. J. Mark Beach in Mid-American Journal of Theology, 17 (2006), pp 148-49.</span></figcaption>

</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-d9eee47935" data-kw="">
<blockquote><p>2. God’s gracious invitation of lost sinners to Christ, which properly is his calling them, is either external or internal; external by the word, internal by his Spirit. [1.] External, by the commands and promises of the word, requiring such duties from them, and assuring them of such blessings upon obedience. Thus Wisdom’s maidens are sent forth to invite guests to her palace, Prov. 4:2; and the king’s servants to call them to the marriage-feast, Matt 22:9; and so far they prevail in their message, that many present themselves. God would not leave us to a book, but has appointed a living ministry, 2 Cor. 6:10. [2.] Internal, not only by the word, but by his Spirit, and the checks of their own conscience, which is a nearer approach of his grace and power to us. By the motions of his Spirit; how else could it be said, Gen. 6:3, ‘My Spirit shall not always strive with man’? and Acts 7:51, ‘Ye do always resist the Holy Ghost’? And also by their consciences soliciting them to the performance of their duty, and challenging them for the neglect of it. It is natural duty: Rom. 2:14,15, ‘The Gentiles do by nature the things contained in the law; these, having not the law, are a law to themselves, which show the works of the law written in their hearts; their consciences also bearing witness, and their thoughts in the meanwhile accusing or excusing one another.’ And for acceptance of the gospel-covenant: 1 John 3:20,21, ‘If our heart condemn us, God is greater than our heart and knows all things; if our heart condemn us not, then have we confidence towards God.’

3. This external and internal calling may be ineffectual or effectual. [1.] The ineffectual call consists in the bare tender and offer of grace, but it is not entertained. God may knock at the door of the heart that does not open to Him; knock by the word, knock by the motions of the Spirit and checks of conscience; so ‘many are called, but few are chosen,’ Matt 22:14. There is not the fruit of election, nor are these the called according to purpose. [2.] The effectual call is when God changes the heart, and brings it home to Himself by Jesus Christ…</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/thomas-manton.html">Thomas Manton</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Works</cite>, (d. 1677; London: J. Nisbet, 1870), vol. 12, Sermons Upon Romans 8, Sermon 8, p. 288</span></figcaption>

</figure><figure class="quote" id="q-eac67bac82" data-kw="">
<blockquote><p>And here is the instrument which Christ makes use of for the drawing of his elect to Himself: the preaching, plain and simple preaching of the Gospel, seemingly a weak and unlikely instrument; thence called the foolishness of preaching (1 Cor. 1:21); Yet by this weak means does Christ effect this great work: Hereby drawing men out of darkness from under the power of Satan. Paul was sent to the gentiles (Acts 26:18) to turn them from darkness to light, and from the power of Satan to God: But how was he to do it? Why, by preaching of the Gospel, by bearing the name of Christ before them (Acts 9:15), hereby drawing them out of the world as fishes out of the sea; hereby drawing them out of themselves, convincing them of their insufficiency and Christs all sufficiency; and so drawing them to Himself; first as to a Savior to believe on Him, working faith in them by this means, ‘Faith comes by hearing, hearing the Word, the word of the Gospel (Rom. 10): Then as to a Lord, to be governed by Him, which is also wrought by the same instrument. (2 Cor. 12:4-5) Here is the outward means, but this often proves ineffectual. Many there are who hear the Word, and hear it powerfully dispensed, who yet are never the better for it; so says the apostle of the Jews: The Word preached did not profit them, not being mixed with faith in them that heard it, Heb. 4:2. And so ineffectual it often proves to many that sit under the sound of it: They are not thereby brought home to Christ. Even as many of the Jews saw Christ lift up, beheld Him crucified, who yet believed not on Him, nay thereby they were hardened-against Him. Even so it is now in the preaching of the Gospel: Many there are before whose eyes Christ is lift up, crucified in the Word and sacraments, who yet are not brought to believe on Him or submit unto Him. 2. To this therefore (in the second place) is joined the Spirit, the Spirit of Christ which He sends forth to accompany his Word and to make it effectual in the hearts of his elect; and by this means He draws men effectually;</p></blockquote>

<blockquote><p>Use 2. Yet let their carelessness make us the more careful… Let us when we look up to God that calls us, remember his greatness. Let us, when we look downward to the misery out of which He has called us, remember the depth of it. Let us when we look forward to the honor unto which He has called us, ponder upon the height of it. Let us when we look backward upon the means whereby He has called us, consider the ineffectualness of them upon others. So shall we find the total sum to be this, That the highest God has called us out of the lowest degree of misery to the greatest step of glory out of his own grace and free mercy.</p></blockquote>

</figure><figure class="quote" id="q-86f281856c" data-kw="">
<blockquote><p>Rest not in baptismal privileges: all are not Israel which are of Israel; what is a man the better to have Christ’s Name upon him, and Satan’s image? What is the advantage to have the Oracles of God, and want the Spirit of God? Think not that an empty profession will save; millions will be sent to hell in Christ’s livery, Matth. 8.12. Oh labour to know the grace of God in truth. The Lord hath been at much cost and charges with you to bring you near to himself; let not God be a loser by you. Pindar saith, it was an opinion of the people in ancient times, that Jupiter rained down gold upon the City of Rhodes:

Give me leave to apply it to you, God hath rained down golden showers upon you. What mercies hath he enriched you with? what talents hath he entrusted you with? your estate is a talent, your health (in these sickly times especially) is a talent, your Sanctuary-blessings are talents, every motion of the Spirit, every opportunity for heaven is a talent, and nothing more sure than that you will be called to an account shortly; now if you have let your talents lie rusting, and done no good with them, the hiding your talents will not hide your sin, expect an heavy doom.

Think not these things impertinences. Be not so evil, as to be too good to be advised. I confess myself with Ignatius, the least of all that labour in God’s vineyard, but though I am with you in weakness, yet as the Apostle saith, in much trembling. I tremble to think how sad it will be, if any of you shall perish in these days of the Gospel, though you have been placed under a trumpet, less shrill and powerful. It shall be my prayer for you all, that you may be fruit-bearing trees, that when the great Vinedresser shall remove you hence by death, he may transplant you into the celestial Paradise.</p></blockquote>

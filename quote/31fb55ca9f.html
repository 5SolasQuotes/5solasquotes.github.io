<main class="wrap"><figure class="quote" id="q-31fb55ca9f" data-kw="">
<blockquote><p>From the points which have been so far upheld against middle knowledge it is clear that the whole difficulty in the present controversy reduces to this one point: Could free conditioned things, from eternity indifferent by nature to futurition or nonfuturition, have passed over into the state of a future event otherwise than by the divine decree? This is the fundamental of fundamentals, on which the whole weight of the case rests. This is that postulate, which both we cannot concede to our adversaries and they cannot prove to us. …Middle knowledge is effective and congruous for any end by its nature. Upon it God is forced to wait in the wise framing of His decrees, which are bound to have a fixed result. The truth or falsity of future conditioned free ones is not known from their causes or from the divine decree, but from the actual occurrence of the thing. Before every act of His will God can see certainty in things quite uncertain by their nature. In short, there is an ens independent of the supreme ens.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/gisbertus-voetius.html">Gisbertus Voetius</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Reformed Dogmatics</cite>, 80ff.</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/attributes-of-god/knowledge-and-wisdom.html">Knowledge and Wisdom</a></span></div>

</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-1ef7d39e09" data-kw="">
<blockquote><p>Are there ideas? It is affirmed. Whether by necessity there are posited ideas in God? It is affirmed. Whether they are in God, or rather outside God? The prior is affirmed. Whether they are things themselves produced by God, so far by the divine intellect, is objected, that is, whether they have the rule of an object, in which, as it were, they are things known in the imagination by a creature? It is denied. Whether they are the effective causes of things, and indeed are first things and principles simply in their genus? It is affirmed. Whether every knowing or cognition of God indicates an idea? It is denied. Whether ideas are rightly divided into speculative and practical? It is denied. Whether ideas pertain to the speculative or rather to practical knowledge? The latter is affirmed. Whether the distinction of ideas into act and potential rightly explained is possible? It is affirmed. Whether all ideas in God are one and really the same with God? It is affirmed. Whether they are really the same amongst themselves or are really and intrinsically one idea? Affirm with a distinction. Whether ideas in God and in themselves are able and ought to be understood or investigated by us? It is denied. Whether ideas which are in the divine mind, through the first thing respect, so far, the singular nature, or the nature of the species? The latter is affirmed. Whether ideas are all which are known by God? It is denied. Whether evil may maintain an idea in God? It is denied with a distinction. [The reason is because evil is not a thing, or the form, species or genus of a thing, but a deficiency therefrom.] Whether impossibilities have ideas in God? It is denied. Whether prime matter [matter without form] has an idea in God? It is affirmed. Whether in God may be the idea of things which neither are, nor were, nor will be? It is affirmed. Whether accidents have an idea in God? It is distinguished. Whether singulars have an idea in God? It is affirmed.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/gisbertus-voetius.html">Gisbertus Voetius</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Appendix 2, ‘The Use of Reason In Matters of Faith’ in Introduction to Reformed Scholasticism</cite>, (Utrecht, 1643), pt. 1, section 1, tract 2, I. ‘Of God’, 2nd Kind, (1) Intellect or Knowledge [Scientia] of God Abbr.</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/attributes-of-god/knowledge-and-wisdom.html">Knowledge and Wisdom</a></span></div>

</figure><figure class="quote" id="q-6df0d8e330" data-kw="">
<blockquote><p>1) A thing is possible because God is able to produce it. It is not, conversely, because it is possible that God is able to produce it. This is proved by God’s priority and independence. 2) Intrinsic possibility is not prior in nature to extrinsic possibility, nor is it the cause of the latter. On the contrary, since a thing can possibly be made by the truly and infinitely powerful God Himself, the source of all being, for that reason [the thing] is also intrinsically possible because the essence of God is the root and rule of all truth.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/melchior-leydekker.html">Melchior Leydekker</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Fax veritatis seu exercitationes ad nonnullas controversias quae hodie in Blegio</cite>, … (Leiden: Gaesbeeck &amp; Lopex, 1677), pp. 242-46 tr. Aza Goudriaan, ch. 8, ‘Samuel Rutherford on the Divine Origin of Possibility’ in ed. Aaron C. Denlinger – Reformed Orthodoxy in Scotland: Essays on Scottish Theology, 1560-1775 (Bloomsbury, T&amp;T Clark, 2016), pt. 2, p. 154 Leydekker followed Rutherford on the subject.</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/attributes-of-god/knowledge-and-wisdom.html">Knowledge and Wisdom</a></span></div>

<blockquote><p>§CCCXXII. God, in knowing Himself, also knows whatever involves no contradiction, that is, what is possible in itself; for that is called possible which involves no contradiction. §CCCXXIII. Things are therefore possible because God represents to Himself in His intellect that they involve no contradiction; consequently, something is possible because God represents it to Himself in His intellect as such. §CCCXXIV. Hence it is evident that all possibility of things is from God, and that His intellect is the fountain or root of all possibility.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/johann-f-stapfer.html">Johann F. Stapfer</a></span><span class="wk"><span class="lbl">Work:</span> <cite>‘On the Attributes Dependent upon the Divine Intellect</cite>, [on God as the Source of Possibility]’ in Universal Institutes of Polemical Theology, vol. 1 4th ed. (1757), section 3, propositions 321-70, pp. 78-90 trans. AI at Reformed Sources Latin</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/attributes-of-god/knowledge-and-wisdom.html">Knowledge and Wisdom</a></span></div>

<blockquote><p>You produce all things from a supernal example, i.e., from a perpetual exemplar: You Yourself most beautiful, elongated from all deformity, bearing in mind, i.e., in full memory, a beautiful world, namely, the archetype, forming it; and producing the sensible world itself in a similar image, as it was present in your mind.</p></blockquote>

<main class="wrap"><figure class="quote" id="q-0c28f715af" data-kw="">
<blockquote><p>We deny that regenerating grace is infused into slothful men, but into souls subdued by God’s Word and law, and after a manner disposed by the foregoing actions; yet we say that even these forgoing actions have their first motions from God; and the question is whether God does not first work a sight and sense of sin and an humiliation for it by his exciting grace, before He comes with his regenerating, quickening and saving grace into the soul; we say He does in his ordinary course of his dispensations. (Only I must here be safely understood that I speak according to man’s apprehension; for in respect of God, nothing is first or last; He works all in an instant, all graces together in the soul; but the question lies not whether God works the habit of repentance before the habit of faith, or no; for without question He works together all his works; but whether God makes humiliation act before faith, which we say he does. Esau and Jacob may be in their mother’s womb together, but Esau may come out and be seen in the world before Jacob: yet not tying up the Almighty to this method, who can and will work any way, even which way it pleases Him:</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/john-collinges.html">John Collinges</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Spouse’s Hidden Glory &amp; Faithful Leaning upon her Well-Beloved, wherein is laid down the soul’s glory in Christ and the way by which the soul comes to Christ, delivered in two lecture sermons</cite>, … (London: 1646), pp. 25-26</span></figcaption>

<blockquote><p>I. Repentance unto life is an evangelical gracea… a. Zec 12:10; Acts 11:18 II. By it a sinner… upon the apprehension of his mercy in Christ to such as are penitent, so grieves for and hates his sins as to turn from them all unto God,a purposing and endeavoring to walk with him in all the ways of his commandments.b a. Ps 51:4; 119:128; Isa 30:22; Jer 31:18-19; Ezek 18:30-31; 36:31; Joel 2:12-13; Amos 5:15; 2 Cor 7:11 b. 2 Kings 23:25; Psa 119:6, 59, 106; Luke 1:6 III. Although repentance be not to be rested in as any satisfaction for sin, or any cause of the pardon thereof,a which is the act of God’s free grace in Christ;b yet is it of such necessity to all sinners that none may expect pardon without it.c a. Eze 16:61-63; 36:31-32 b. Hos 14:2, 4; Rom 3:24; Eph 1:7 c. Luke 13:3, 5; Acts 17:30-31“ . . Articles 1600’s Davenant, John – section 5 in ch. 31, ‘Of the Necessity of Works to Salvation, or Justification’ in A Treatise on Justification: or The Disputatio de justitia habituali et actuali…, vol. 1 trans. Josiah Allport (d. 1641; London: Hamilton, 1844/1846), pp. 299-300 Note that what Davenant says here is substantially the same as what Owen says below, with a bit of difference of some terminology. Davenant would have done better to, instead of using the term “good works” in this context, to use “a certain inherent righteousness,” similar to Goodwin below. Davenant here denies that works are efficient or meritorious causes of justification. Yet he affirms that certain inward works, or a certain inherent righteousness, is necessary as concurrent or preliminary conditions to justification, which accompany it, by way of order, not of causality; and these things “He Himself effects in us.</p></blockquote>

<blockquote><p>Concerning penitence, which embraces in itself the fear of God, and almost all other acts, there occur (as we have shown before) very many passages in Scripture, in which it is set forth as a necessary means through which to obtain pardon of sins, or (what in fact is the same thing) as a condition under which God (ultimately of his own gratuitous promise) forgives sin. Who will deny that these in some sense have the nature of a cause, except he who is more pleased with the pugnacity of disputing, and the desire of cavilling, than with the love of the truth? How often is forgiveness of sins described in Scripture as the effect or fruit of penitence? (Isa. 1:16-19; 56:4-12; Jer. 18:7-8; Joel 2:12-14; Jonah 3:10, etc.)</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/william-forbes.html">William Forbes</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Considerationes Modestae et Pacificae Controversiarum de Justificatione</cite>, ... 4th ed. (d. 1634; 1658; Oxford: Parker, 1850), vol. 1, bk. 1, ch. 3, p. 39</span></figcaption>

<div class="actions"><button class="copy" data-copy="“Concerning penitence, which embraces in itself the fear of God, and almost all other acts, there occur (as we have shown before) very many passages in Scripture, in which it is set forth as a necessary means through which to obtain pardon of sins, or (what in fact is the same thing) as a condition under which God (ultimately of his own gratuitous promise) forgives sin. Who will deny that these in some sense have the nature of a cause, except he who is more pleased with the pugnacity of disputing, and the desire of cavilling, than with the love of the truth? How often is forgiveness of sins described in Scripture as the effect or fruit of penitence? (Isa. 1:16-19; 56:4-12; Jer. 18:7-8; Joel 2:12-14; Jonah 3:10, etc.)”

— William Forbes, Considerationes Modestae et Pacificae Controversiarum de Justificatione... 4th ed. (d. 1634; 1658; Oxford: Parker, 1850), vol. 1, bk. 1, ch. 3, p. 39">Copy</button><a class="share" href="https://x.com/intent/post?text=%E2%80%9CConcerning+penitence%2C+which+embraces+in+itself+the+fear+of+God%2C+and+almost+all+other+acts%2C+there+occur+%28as+we+have+shown+before%29+very+many+passages+in+Scripture%2C+in+which+it+is+set+forth+as+a+necessary+means+through+which+to+obtain+pardon+of+sins%2C+or+%28what+in+fact+is+the+same+thing%29+as+a+condition+under+which+God+%28ultimately+of+his+own+gratuitous+promise%29+forgives+sin.+Who+will+deny+that+these+in+some+sense+have+the+nature+of+a+cause%2C+except+he+who+is+more+pleased+with+the+pugnacity+of+disputing%2C+and+the+desire+of+cavilling%2C+than+with+the+love+of+the+truth%3F+How+often+is+forgiveness+of+sins+described+in+Scripture+as+the+effect+or+fruit+of+penitence%3F+%28Isa.+1%3A16-19%3B+56%3A4-12%3B+Jer.+18%3A7-8%3B+Joel+2%3A12-14%3B+Jonah+3%3A10%2C+etc.%29%E2%80%9D%0A%0A%E2%80%94+William+Forbes%2C+Considerationes+Modestae+et+Pacificae+Controversiarum+de+Justificatione...+4th+ed.+%28d.+1634%3B+1658%3B+Oxford%3A+Parker%2C+1850%29%2C+vol.+1%2C+bk.+1%2C+ch.+3%2C+p.+39&amp;url=https%3A%2F%2F5solasquotes.github.io%2Fquote%2Fddc97a5df0.html&amp;via=5Solas" target="_blank" rel="noopener">Share on X</a><a class="perma" href="../quote/ddc97a5df0.html">Permalink</a><a class="src" href="https://reformedbooksonline.com/on-the-relation-of-repentance-to-saving-faith-justification/#:~:text=Concerning%20penitence%2C%20which%20embraces%20in%20itself,18%3A7%2D8%3B%20Joel%202%3A12%2D14%3B%20Jonah%203%3A10%2C%20etc&amp;text=Concerning%20penitence%2C%20which%20embraces%20in%20itself%20the%20fear&amp;text=56%3A4%2D12%3B%20Jer.%2018%3A7%2D8%3B%20Joel%202%3A12%2D14%3B%20Jonah%203%3A10%2C%20etc" rel="noopener" target="_blank">Read it online · Reformed Books Online</a></div>

<blockquote><p>…take notice of this distinction, as a foundation, viz. that there is in Scripture a twofold repentance or humiliation of the soul for sin: The one antecedent and going before pardon, and this the Scripture requires as a necessary condition, without which forgiveness of sin cannot be obtained: of this repentance the Scripture for the most part speaks, Eze. 18:18, 30; Mt. 3.2; Mk. 6.12; Lk. 13:3; Acts 3:19; and generally in most places of Scripture. In the second place there is an humiliation of heart and brokenness of soul for sin, arising from the apprehension of God’s love in pardoning, whereby we grieve that we should deal so unkindly with so good and gracious a God: this, though more rarely, yet is sometimes spoken of in Scripture, as first in this woman, who out of the apprehension of God’s love in pardoning so much to her did pour out her soul in all ways of thankfulness. After this manner also was David’s repentance, Ps. 51; for he was thus deeply affected after Nathan had told him his sin was taken away; although it does appear by the psalm also that he had not as yet that sense of pardon which did quiet his conscience. This kind of affection was also in Paul, 1 Tim. 1:12–16; 1 Cor. 15:8–9, in which places the apostle, remembering his former sins, confesses them, and acknowledges thereby his unworthiness of all that grace and favour he had received; so that the apostle does not there humble himself that he may obtain mercy, but because he had obtained mercy. The most eminent instance of this kind of sorrow and shame is Eze. 16:62–63, where God promises to establish his covenant with them, and then mark the event of this: ‘That thou mayest remember and be confounded, and never open thy mouth more because of thy shame, when I am pacified toward thee.’ So then both these kinds of humiliations are to be owned and practiced; and therefore it is a false and dangerous error to acknowledge no other kind of repentance than the latter [former]. The Papists will not acknowledge this latter humiliation at all, because they deny all faith and assurance that a believer may have of his sins in particular. And others say that there is only this latter; and therefore the forementioned author, in his treatise of Gospel Repentance, makes this only gospel-repentance. But as gospel-faith is not that reflex act of the soul in a man whereby it is persuaded that Christ is his, but a direct act of taking and receiving Christ to be ours, so a gospel-repentance is not that mainly whereby we are humbled because we receive God’s love to us in pardoning, but principally in that loathing of ourselves to obtain pardon. It is therefore great ignorance in that author, in his treatise of Gospel Repentance, when p. 58, he calls repentance that goes before this faith, viz. that my sins are pardoned, a dead work; as if the faith that justifies, and without which it is impossible to please God, were the believing that my sins are pardoned; whereas the Scripture makes it to be the receiving of Christ and laying hold on Him. And seeing that the object must in order of nature be before the act that is employed about it, it follows infallibly that I must have justification before I can believe I have it. Repentance therefore may be thought to go before a twofold act of faith: first, that whereby Christ is laid hold upon and made ours, and so the repentance that precedes this may be called legal and slavish. Or secondly, before a persuasion that my sins are pardoned; and before this act of faith repentance must necessarily go, because the covenant of grace dispenses pardon only to such.</p></blockquote>

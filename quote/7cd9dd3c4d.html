<main class="wrap"><figure class="quote" id="q-7cd9dd3c4d" data-kw="">
<blockquote><p>Receiving of the Lord’s supper, is a coming to the throne of grace; to feast on the king of grace; to feed on that body broken for us, and that blood shed for us, that is given to us in the word for food to our souls, and is given to us by his command, in bread and wine at his table; that in eating and drinking of them, we may remember him, and shew forth his death till he come; glorying, and avowing, and boasting, that we have our salvation, and all our hopes of it, built and fixed on that man Jesus Christ, that was rejected by the builders in his time, and hath had little better entertainment since, because they knew him not.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/robert-traill.html">Robert Traill</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Sermons Concerning the Throne of Grace</cite>, (1696) in The Works of Robert Traill, A.M. Minister of the Gospel in London (4 vols, Edinburgh: J. Ogle, 1810), 1: 25.</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/the-lords-supper.html">The Lord&#x27;s Supper</a></span></div>

</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-8f9025adaf" data-kw="">
<blockquote><p>The elements of the sacrament are bread and wine. There is controversy between east and west on this point. The Greek Church says the bread must be leavened, the Latin unleavened, making this a point of serious importance. We believe that the bread used was paschal. But it was not Christ’s intention to give ritually a paschal character to the new sacrament; and bread is employed as the material element of nutrition, the one most familiar and universal. Hence, we regard all the disputes as to leaven, and the other minutiae made essential by the Romanist rubric (wheaten, mingled with proper water, not worm–eaten, etc.,) as non–essential.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/robert-l-dabney.html">Robert L. Dabney</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Other citations (work not named)</cite>, 1898 | This quote was compiled by Andy Webb</span></figcaption>

<blockquote><p>Problem: Whether the Lord’s Supper can be said directly and proximately to seal the grace of regeneration? Response: It seals the continuation and excitation of it, or of its terminus, namely, faith (as it is an organ) primarily, and new obedience secondarily. But the grace of regeneration which is the cause of faith it designates consequently and mediately, as something presupposed.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/gisbertus-voetius.html">Gisbertus Voetius</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Disputation 30, ‘On Regeneration’, pt. 2</cite>, (1639) tr. AI by Roman Prestarri in Select Theological Disputations (1655), vol. 2, pp. 447ff. Latin at Confessionally Reformed Theology</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/the-lords-supper/preparation-celebration-reflection.html">Preparation, Celebration, Reflection</a></span></div>

</figure><figure class="quote" id="q-03c0559bd9" data-kw="">
<blockquote><p>Let us, then, lay weight on every effect of the Holy Ghost in any of the particulars before mentioned, on this account, that they are acts of his love and power towards us. This faith will do, that takes notice of his Kindness in all things. Frequently he performs, in sundry particulars, the office of a comforter towards us, and we are not thoroughly comforted,—we take no notice at all of what he doth. Then is he grieved. Of those who do receive and own the consolation he tenders and administers, how few are there that consider him as the Comforter, and rejoice in him as they ought! Upon every work of consolation that the believer receives, this ought his faith to resolve upon,—“This is from the Holy Ghost; he is the Comforter, the God of all consolation; I know there is no joy, peace, hope, nor comfort, but what he works, gives, and bestows; and, that he might give me this consolation, he hath willingly condescended to this office of a comforter. His love was in it, and on that account doth he continue it. Also, he is sent by the Father and Son for that end and purpose. By this means come I to be partaker of my joy,—it is in the Holy Ghost; of consolation,—he is the Comforter. What price, now, shall I set upon his love! how shall I value the mercy that I have received!” This, I say, is applicable to every particular effect of the Holy Ghost towards us; and herein have we communion and fellowship with him, as was in part discovered in our handling the particulars. Doth he shed abroad the love of God in our hearts? doth he witness unto our adoption? The soul considers his presence, ponders his love, his condescension, goodness, and kindness; is filled with reverence of him, and cares [takes care] not to grieve him, and labours to preserve his temple, his habitation, pure and holy. Again: our communion with him causeth in us returning Praise, and thanks, and honour, and glory, and blessing to him, on the account of the mercies and privileges which we receive from him; which are many. Herein consists our next direction. So do we with the Son of God on the account of our redemption: “Unto him that loved us, and washed us from our sins in his own blood, to him be glory and dominion for ever and ever,” Rev. 1:5, 6. And are not the like praises and blessings due to him by whom the work of redemption is made effectual to us? who with no less infinite love undertook our consolation than the Son our redemption. When we feel our hearts warmed with joy, supported in peace, established in our obedience, let us ascribe to him the praise that is due to him, bless his name, and rejoice in him. And this glorifying of the Holy Ghost in thanksgivings, on a Spiritual sence of his consolations, is no small part of our communion with him. Considering his free engagement in this work, his coming forth from the Father to this purpose, his mission by the Son, and condescension therein, his love and kindness, the soul of a believer is poured out in thankful praises to him, and is sweetly affected with the duty. There is no duty that leaves a more heavenly savour in the soul than this doth. Also, in our prayers to him for the carrying on the work of our consolation, which he hath undertaken, lies our communion with him. John prays for grace and peace from the seven Spirits that are before the throne, or the Holy Ghost, whose operations are perfect and complete. This part of his worship is expressly mentioned frequently in Scripture; and all others do necessarily attend it. Let the saints consider what need they stand in of these effects of the Holy Ghost before mentioned, with many such others as might be insisted on; weigh all the privileges which we are made partakers of; remember that he distributes them as he will, that he hath the sovereign disposal of them; and they will be prepared for this duty.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/john-owen.html">John Owen</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Works of John Owen</cite>, ed. William H. Goold, vol. 2 (Edinburgh: T&amp;T Clark, n.d.), 270–72.</span></figcaption>

led+with+reverence+of+him%2C+and+cares+%5Btakes+care%5D+not+to+grieve+him%2C+and+labours+to+preserve+his+temple%2C+his+habitation%2C+pure+and+holy.+Again%3A+our+communion+with+him+causeth+in+us+returning+Praise%2C+and+thanks%2C+and+honour%2C+and+glory%2C+and+blessing+to+him%2C+on+the+account+of+the+mercies+and+privileges+which+we+receive+from+him%3B+which+are+many.+Herein+consists+our+next+direction.+So+do+we+with+the+Son+of+God+on+the+account+of+our+redemption%3A+%E2%80%9CUnto+him+that+loved+us%2C+and+washed+us+from+our+sins+in+his+own+blood%2C+to+him+be+glory+and+dominion+for+ever+and+ever%2C%E2%80%9D+Rev.+1%3A5%2C+6.+And+are+not+the+like+praises+and+blessings+due+to+him+by+whom+the+work+of+redemption+is+made+effectual+to+us%3F+who+with+no+less+infinite+love+undertook+our+consolation+than+the+Son+our+redemption.+When+we+feel+our+hearts+warmed+with+joy%2C+supported+in+peace%2C+established+in+our+obedience%2C+let+us+ascribe+to+him+the+praise+that+is+due+to+him%2C+bless+his+name%2C+and+rejoice+in+him.+And+this+glorifying+of+the+Holy+Ghost+in+thanksgivings%2C+on+a+Spiritual+sence+of+his+consolations%2C+is+no+small+part+of+our+communion+with+him.+Considering+his+free+engagement+in+this+work%2C+his+coming+forth+from+the+Father+to+this+purpose%2C+his+mission+by+the+Son%2C+and+condescension+therein%2C+his+love+and+kindness%2C+the+soul+of+a+believer+is+poured+out+in+thankful+praises+to+him%2C+and+is+sweetly+affected+with+the+duty.+There+is+no+duty+that+leaves+a+more+heavenly+savour+in+the+soul+than+this+doth.+Also%2C+in+our+prayers+to+him+for+the+carrying+on+the+work+of+our+consolation%2C+which+he+hath+undertaken%2C+lies+our+communion+with+him.+John+prays+for+grace+and+peace+from+the+seven+Spirits+that+are+before+the+throne%2C+or+the+Holy+Ghost%2C+whose+operations+are+perfect+and+complete.+This+part+of+his+worship+is+expressly+mentioned+frequently+in+Scripture%3B+and+all+others+do+necessarily+attend+it.+Let+the+saints+consider+what+need+they+stand+in+of+these+effects+of+th

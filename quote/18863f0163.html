<main class="wrap"><figure class="quote" id="q-18863f0163" data-kw="">
<blockquote><p>Loved him. [in Greek] Egapon autou, loved, kissed, or cheerfully and in a friendly manner received him, as truly pitying him who having with so much care outwardly kept the law of God, which many did not; yet did but deceive himself with a vain opinion of righteousness, as if he were perfect, or near thereto; when yet without faith in Christ, he could not possibly be saved.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/john-ley.html">John Ley</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The English Annotations 3rd ed. (1658), on Mk. 10:21, “Then Jesus beholding him loved him, and said unto him, One thing thou lackest…”</cite></span></figcaption>

</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-bcce423899" data-kw="">
<blockquote><p>As we see from the Westminster Confession and the 1689 Baptist Confession the Puritans believed in the doctrines of grace such as election and particular redemption (Rom 8:28-30). They followed Calvin in resisting false human rationalisations. For instance they resisted the idea that God only loves the elect and hates the non-elect. This error is called hyper-Calvinism. It is a very serious error which is recurring today. The Puritans were experts in their understanding of the concept of common grace although they did not use that term.¹ Their teaching accords fully with the way in which the doctrine of Common Grace is expounded by Prof John Murray (cf Works). They believed that the Holy Spirit is constantly active in restraining evil and promoting good throughout society. The Puritans believed in the universal love of God for all mankind (1 Tim 2:1-6; 2 Peter 3:9). They believed in the universal provision of God for all mankind according to the covenant made with Noah as representative of the whole world (Gen 8:20-22 and Ps 145). ¹ [Webmaster’s note: This particular claim is not true. Following Calvin’s use of the term ‘general grace’, the puritans did use the term ‘common grace’, as is affirmed by Dr. Richard Muller below on p. 130, and as is instanced by James Durham (who has a whole section on ‘common grace’ in his Revelation commentary), Stephen Charnock (below), and John Bunyan (below).]</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/erroll-hulse.html">Erroll Hulse</a></span><span class="wk"><span class="lbl">Work:</span> <cite>“The Example of the English Puritans” (Reformation Today 153, Sept/Oct 1996)</cite></span></figcaption>
<div class="meta"><span class="t"><a href="../topics/effectual-calling/common-grace.html">Common Grace</a></span></div>

</figure><figure class="quote" id="q-ff35eaf9cf" data-kw="">
<blockquote><p>We must not view these ways of talking about the love of God as independent, compartmentalized, loves of God… as if each were hermetically sealed off from the other… If you absolutize any one of these ways in which the Bible speaks of the love of God, you will generate a false system that squeezes out other important things the Bible says, thus finally distorting your vision of God.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/d-a-carson.html">D.A. Carson</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Difficult Doctrine of the Love of God (Crossway, 2000), pp. 23, 75, as quoted by Ian Murray, The Cross: the Pulpit of God’s Love (n.d.)</cite>, p. 20</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/effectual-calling/common-grace.html">Common Grace</a></span></div>

</figure><figure class="quote" id="q-dca7db9516" data-kw="">
<blockquote><p>The Lord therefore did raise up his prophet Malachi (who was the last before Christ) sharply to rebuke, and plainly to convict this horrible ingratitude of that unthankful nation, who so shamefully had forgotten those so great benefits recently bestowed upon them. And thus begins he his prophecy: “I have loved you, sayeth the Lord,” in which words he speaks not of a common love, which in preserving and feeding all creatures is common to the reprobate, but of that love by the which he had sanctified and separated them from the rest of nations, to have his glory manifested.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/john-knox.html">John Knox</a></span><span class="wk"><span class="lbl">Work:</span> <cite>“On Predestination” in The Works of John Knox, ed. David Laing (Edinburgh: J. Thin, 1895)</cite>, 5:150-51</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/effectual-calling/common-grace.html">Common Grace</a></span></div>

<main class="wrap"><figure class="quote" id="q-a7b9efe019" data-kw="">
<blockquote><p>By this faith, a Christian believeth to be true whatsoever is revealed in the word, for the authority of God himself speaking therein;[e] and acteth differently upon that which each particular passage thereof containeth; yielding obedience to the commands,[f] trembling at the threatenings,[g] and embracing the promises of God for this life and that which is to come.[h]… [e] John 4:42. 1 Thess. 2:13. 1 John 5:10. Acts 24:14. [f] Rom. 16:26. [g] Isa. 66:2. [h] Heb. 11:13. 1 Tim. 4:8.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/westminster-assembly.html">Westminster Assembly</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Confession of Faith</cite>, ch. 14, ‘Of Saving Faith’</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/repentance-and-conversion/repentance-and-faith.html">Repentance and Faith</a></span></div>

</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-fbb0deff39" data-kw="">
<blockquote><p>I. Repentance unto life is an evangelical gracea… a. Zec 12:10; Acts 11:18 II. By it a sinner… upon the apprehension of his mercy in Christ to such as are penitent, so grieves for and hates his sins as to turn from them all unto God,a purposing and endeavoring to walk with him in all the ways of his commandments.b a. Ps 51:4; 119:128; Isa 30:22; Jer 31:18-19; Ezek 18:30-31; 36:31; Joel 2:12-13; Amos 5:15; 2 Cor 7:11 b. 2 Kings 23:25; Psa 119:6, 59, 106; Luke 1:6 III. Although repentance be not to be rested in as any satisfaction for sin, or any cause of the pardon thereof,a which is the act of God’s free grace in Christ;b yet is it of such necessity to all sinners that none may expect pardon without it.c a. Eze 16:61-63; 36:31-32 b. Hos 14:2, 4; Rom 3:24; Eph 1:7 c. Luke 13:3, 5; Acts 17:30-31“ . . Articles 1600’s Davenant, John – section 5 in ch. 31, ‘Of the Necessity of Works to Salvation, or Justification’ in A Treatise on Justification: or The Disputatio de justitia habituali et actuali…, vol. 1 trans. Josiah Allport (d. 1641; London: Hamilton, 1844/1846), pp. 299-300 Note that what Davenant says here is substantially the same as what Owen says below, with a bit of difference of some terminology. Davenant would have done better to, instead of using the term “good works” in this context, to use “a certain inherent righteousness,” similar to Goodwin below. Davenant here denies that works are efficient or meritorious causes of justification. Yet he affirms that certain inward works, or a certain inherent righteousness, is necessary as concurrent or preliminary conditions to justification, which accompany it, by way of order, not of causality; and these things “He Himself effects in us.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/westminster-assembly.html">Westminster Assembly</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Confession of Faith</cite>, ch. 15</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/repentance-and-conversion/repentance-and-faith.html">Repentance and Faith</a></span></div>

</figure><figure class="quote" id="q-e9c647fea4" data-kw="">
<blockquote><p>CIV… Chamier concedes that a person is justified and sins are forgiven before they believe. But this contradicts the entire Scripture, which consistently teaches that God’s wrath remains on those who do not believe, and faith and repentance are the conditions under which forgiveness of sins is promised to us, without which it cannot be obtained.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/louis-le-blanc.html">Louis Le Blanc</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Theological Theses Published at Various Times</cite>, vol. 2 3rd ed. tr. by AI by Colloquia Scholastica at Discord (1675; London, 1683), ‘On Justifying Faith’, pt. 1, p. 166 Latin</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/repentance-and-conversion/repentance-and-faith.html">Repentance and Faith</a></span></div>
<div class="actions"><button class="copy" data-copy="“CIV… Chamier concedes that a person is justified and sins are forgiven before they believe. But this contradicts the entire Scripture, which consistently teaches that God’s wrath remains on those who do not believe, and faith and repentance are the conditions under which forgiveness of sins is promised to us, without which it cannot be obtained.”

— Louis Le Blanc, Theological Theses, vol. 2 3rd ed. tr. by AI by Colloquia Scholastica at Discord (1675; London, 1683), ‘On Justifying Faith’, pt. 1, p. 166 Latin">Copy</button><a class="share" href="https://x.com/intent/post?text=%E2%80%9CCIV%E2%80%A6+Chamier+concedes+that+a+person+is+justified+and+sins+are+forgiven+before+they+believe.+But+this+contradicts+the+entire+Scripture%2C+which+consistently+teaches+that+God%E2%80%99s+wrath+remains+on+those+who+do+not+believe%2C+and+faith+and+repentance+are+the+conditions+under+which+forgiveness+of+sins+is+promised+to+us%2C+without+which+it+cannot+be+obtained.%E2%80%9D%0A%0A%E2%80%94+Louis+Le+Blanc%2C+Theological+Theses%2C+vol.+2+3rd+ed.+tr.+by+AI+by+Colloquia+Scholastica+at+Discord+%281675%3B+London%2C+1683%29%2C+%E2%80%98On+Justifying+Faith%E2%80%99%2C+pt.+1%2C+p.+166+Latin&amp;url=https%3A%2F%2F5solasquotes.github.io%2Fquote%2Fe9c647fea4.html&amp;via=5Solas" target="_blank" rel="noopener">Share on X</a><a class="perma" href="../quote/e9c647fea4.html">Permalink</a><a class="src" href="https://reformedbooksonline.com/on-the-relation-of-repentance-to-saving-faith-justification/#:~:text=Chamier%20concedes%20that%20a%20person%20is,without%20which%20it%20cannot%20be%20obtained&amp;text=Chamier%20concedes%20that%20a%20person%20is%20justified%20and&amp;text=to%20us%2C%20without%20which%20it%20cannot%20be%20obtained" rel="noopener" target="_blank">Read it online · Reformed Books Online</a></div>
</figure><figure class="quote" id="q-ccc85ca8f2" data-kw="">
<blockquote><p>Now consider we in the next place what manner of preaching our Savior Christ’s was, that collating the Gospel by this man [the Antinomian Saltmarsh] described, with the Gospel that Christ preached, we may see how well they sort and suit the one with the other. ‘I came,’ says our Savior, ‘to call sinners to repentance’ (Mt 3:13): and, ‘Unlesse ye repent, ye shall all perish,’ (Lk. 13:3, 5) and, ‘Verily, I say unto you, Unless ye be converted and become like children, ye shall not enter into the Kingdom of Heaven,’ (Mt. 18:3) and, ‘If a man will come after Me, let him deny himself, and take up his cross and follow Me.’ (Mt. 16:23) And, ‘If any man come to Me, and hate not his father and mother, and wife and children, and brethren and sisters, yea, and his own life also, he cannot be my disciple.’ (Lk. 14:26) And, ‘Whosoever he be of you that forsakes not all that he hath, he cannot be my disciple.’ (Lk. 14:33) Here is no such short work as Mr. Saltmarsh makes of it. Here are conditions, you see, required; and those not of faith alone, but of repentance and humiliation, and self-denial, and conversion, and renouncing of all, in disposition and purpose at least.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/thomas-gataker.html">Thomas Gataker</a></span><span class="wk"><span class="lbl">Work:</span> <cite>A Mistake or Misconstruction Removed</cite>, (Whereby little difference is pretended to have been acknowledged between the Antinomians &amp; us)… (London: Clifton, 1646), pp. 9-10 Note, according to Westminster, “purposing and endeavoring to walk with him in all the ways of his commandments” is part of the definition of repentance; WCF 15.2.</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/repentance-and-conversion/repentance-and-faith.html">Repentance and Faith</a></span></div>

inomians+%26+us%29%E2%80%A6+%28London%3A+Clifton%2C+1646%29%2C+pp.+9-10+Note%2C+according+to+Westminster%2C+%E2%80%9Cpurposing+and+endeavoring+to+walk+with+him+in+all+the+ways+of+his+commandments%E2%80%9D+is+part+of+the+definition+of+repentance%3B+WCF+15.2.&amp;url=https%3A%2F%2F5solasquotes.github.io%2Fquote%2Fccc85ca8f2.html&amp;via=5Solas" target="_blank" rel="noopener">Share on X</a><a class="perma" href="../quote/ccc85ca8f2.html">Permalink</a><a class="src" href="https://reformedbooksonline.com/that-a-certain-inherent-holiness-or-graces-repentance-is-requisite-by-way-of-order-accompaniment-to-faith-in-christ-justification/#:~:text=Now%20consider%20we%20in%20the%20next,in%20disposition%20and%20purpose%20at%20least&amp;text=Now%20consider%20we%20in%20the%20next%20place%20what&amp;text=of%20all%2C%20in%20disposition%20and%20purpose%20at%20least" rel="noopener" target="_blank">Read it online · Reformed Books Online</a></div>
</figure><figure class="quote" id="q-83d9d40e9b" data-kw="">
<blockquote><p>They did not hold that faith was the only thing which invariably accompanies justification, or even that it was the only thing required of men in order to their being justified; for they admitted that repentance was necessary to forgiveness, in accordance with the doctrine of our [Westminster] standards, that, ‘to escape the wrath and curse of God due to us for sin, God requireth of us repentance unto life,’ [WSC #85] as well as ‘faith in Jesus Christ.’</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/william-cunningham.html">William Cunningham</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Historical Theology</cite>, (Edinburgh: T&amp;T Clark, 1863), vol. 2, ch. 21, ‘Justification’, section 1, ‘Popish &amp; Protestant Views’, p. 22</span></figcaption>

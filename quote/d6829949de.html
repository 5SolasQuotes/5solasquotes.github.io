<blockquote><p>If it be said, that God hath forbidden such a forcible resistance by Rom. 13. 1, 2, 3. or the like Scriptures, then it must be affirmed that the Parliament are not the higher powers, which Dr Ferne granteth: for if the Parliament come within the compass of those words (higher Powers) then that Scripture Rom. 13. doth not reach them, but rather requires others to be obedient to them; yea, if by the higher powers is understood only the King, then the two Houses may not make any forcible resistance against any petty Constable that comes in the K[ing’s] authority to do violence to the two Houses.

Surely therefore this and the like Scriptures are much abused, the meaning being only to command obedience to authority in all things that tend to the encouragement of good, and punishment of evil; and therefore there is such a power in the subjects, both by the law of nature, and constitution of the kingdom, to take up Arms when the State or two Houses express it; notwithstanding the expression of any one man to the contrary.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/william-bridge.html">William Bridge</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The truth of the times vindicated whereby the lawfulness of Parliamentary proceedings in taking up of arms, is justified, Doctor Ferne’s reply answered, and the case in question more fully resolved</cite>, (London: Ben. Allen, 1643), pp 17-18.</span></figcaption>

idge-on-romans-13-and-parliament/" rel="noopener" target="_blank">Read it online · Reformed Covenanter</a></div>
</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-1c349bc864" data-kw="">
<blockquote><p>1. There is a subjection in respect of natural being, as the effect to the cause; so, though Adam had never sinned, this morality of the Fifth Command should have stood in vigor, that the son by nature, without any positive law, should have been subject to the father, because from him he has his being, as from a second cause. But I doubt if the relation of a father, as a father, does necessarily infer a royal or kingly authority of the father over the son; or by nature’s law, that the father has a power of life and death over, or above, his children, and the reasons I give are: (1) Because power of life and death is by a positive law, presupposing sin and the fall of man [Gen. 9:5-6]; and if Adam, standing in innocency, could lawfully kill his son, though the son should be a malefactor, without any positive law of God, I much doubt [Gen. 4:14-15]. (2) I judge that the power royal, and the fatherly power of a father over his children, shall be found to be different; and the one is founded on the law of nature, the other, to wit, royal power, on a mere positive law.

2. The degree or order of subjection natural is a subjection in respect of gifts or age. So Aristotle (1 polit., chp. 3) says, “that some are by nature servants.” His meaning is good — that some gifts of nature, as wisdom natural, or aptitude to govern, has made some men of gold, fitter to command, and some of iron and clay, fitter to be servants and slaves… It is possible Plato had a good meaning (Dialogue 3, Of Laws) who made six orders here. “1. That fathers command their sons;

2. The noble the ignoble;

3. The elder the younger;

4. The masters the servants;

5. The stronger the weaker;

6. The wise the ignorant.” Aquinas (22, q. 57, article 3), Driedo (de libert. Christ, bk. 1, p. 8), following Aristotle (polit. bk. 7, ch. 14) hold, though man had never sinned there should have been a sort of dominion of the more gifted and wiser above the less wise and weaker; not antecedent from nature properly, but consequent, for the utility and good of the weaker, in so far as it is good for the weaker to be guided by the stronger, which cannot be denied to have some ground in nature.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/samuel-rutherford.html">Samuel Rutherford</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Lex Rex</cite>, ... (1644; Edinburgh: Ogle, 1843) | question 13, p. 50 rt col</span></figcaption>

<blockquote><p>40. The reformed churches believe also, and openly confess, the power and authority of emperors over their empires, of kings over their kingdoms, of princes and dukes over their dominions, and of other magistrates or states over their commonwealths and cities, to be the ordinances of God Himself appointed as well as to the manifestation of his own glory, as to the singular profit of mankind: and withal, that by reason of the will of God Himself, revealed in his Word, we must not only suffer and be content that those do rule which are set over their own territories, whether by hereditary or elective right, but also to love them, fear them, and with all reverence and honor embrace them as the ambassadors and ministers of the most high and good God, being in his stead, and preferred for the good of their subjects, to pour out prayers for them, to pay tributes to them, and in all business of the commonwealth which is not against the Word of God, to obey their laws and edicts. … 48. For to that end also is the holy Scripture profitable, to show which is the best manner of governing a commonwealth, and that the magistrate, as being Gods minister, may by this guiding star be so directed, as that he may execute the parts of his office according to the will of God and may perfectly be instructed to every good work…</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/george-gillespie.html">George Gillespie</a></span><span class="wk"><span class="lbl">Work:</span> <cite>One Hundred and Eleven Propositions concerning the Ministry and Government of the Church</cite>, (1647; Edinburgh, 1844), p. 12</span></figcaption>

<blockquote><p>Assertion 3. The king is more properly a sort of patron, to defend the people (and therefore has no power given either by God or man to hurt the people) and a minister, or public and honorable servant (Rom. 13:4), for he is the minister of God to thee for good.

1. He is the commonwealth’s servant objectively, because all the king’s service, as he is king, is for the good, safety, peace and salvation of the people, and in this he is a servant.

2. He is the servant of the people representatively, in that the people has impawned in his hand all their power to do royal service.</p></blockquote>

<blockquote><p>It will be necessary, however, to return to the west country [of Scotland], where the invasion of the Highland host [in 1679] was succeeded by oppressions which at length exasperated the country people to resistance. Among these we may notice the imposition of the cess, as it was termed, a tax raised expressly for maintaining the army intended to put down field-conventicles. A more odious tax can hardly be conceived. That they should not only be severely fined and punished for attending these meetings, but compelled to pay for the means of suppressing them, was such an outrage on the feelings of the people, that we might be prepared to hear it would be almost universally resisted. Yet the greater part submitted to the tax, contenting themselves with a protest against its use; thus declaring their readiness to suffer for religion if they should be called to account, and at the same time avoiding even the appearance of evil by refusing the magistrate’s just right to levy cess and custom on the subjects. This, however, proved another “bone of contention;” the stricter and more rigid of the Presbyterians considering that by paying the cess they shared in the guilt of the purpose to which it was avowedly applied. The ministers who were banished to Holland loudly inveighed against the practice; and it was no doubt very easy for them, placed at a distance from the scene of oppression, as it may be for us who are free from all such exactions, to protest against those who yielded to them. But much may be said in behalf of those who submitted against their will to an imposition which they could not resist, and which, had they resisted, would have been wrested from them with the loss of all they possessed. On the other hand, the principles upon which some of the Presbyterians afterwards resisted the impost, and which are vindicated at great length in the Hind let Loose [by the Cameronian Alexander Shields], were founded on the tyrannical character of the governors, and necessarily led to the casting off all allegiance or submission to the civil government.</p></blockquote>

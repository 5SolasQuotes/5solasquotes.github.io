<main class="wrap"><figure class="quote" id="q-1710e393eb" data-kw="">
<blockquote><p>The old Council Gangrense commandeth that none should make such difference between an unmarried priest and a married priest, as he ought to think the one more holy than the other for single life&#x27;s sake. These men put such a difference between them, that they straightway think all their holy service to be defiled if it be done by a good and honest man that hath a wife.</p></blockquote>

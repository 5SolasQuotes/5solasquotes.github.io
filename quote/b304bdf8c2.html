<blockquote><p>As this is a great error [to mingle law and gospel], so it is a very dangerous error. If a man attempts to add any works of his own to the consummate righteousness of Jesus Christ as the ground of his justification before God, Christ profits him nothing. The obedience and death of Christ have “become of no effect” to him. “Behold, I Paul say unto you, that if ye be circumcised, Christ shall profit you nothing. For I testify again to every man that is circumcised, that he is a debtor to do the whole law. Christ is become of no effect unto you, whosoever of you are justified by the law; ye are fallen from grace” (Gal. 5:2–4). If a man tries to connect his own performances with the righteousness of Jesus Christ for the pardon of his sins and the acceptance of his person as righteous in the sight of God, he deprives himself of all benefit from that perfect righteousness. If he relies on his own works of obedience for even the smallest part of his title to eternal life, “he is a debtor to do the whole law” in its covenant form, and he fixes himself under the dreadful curse of it. Christ will profit him nothing unless he relies on His infinitely glorious righteousness only for all his title to justification and eternal life. A sinner depends on the righteousness of Christ for justification to no good purpose if he does not rely on it only, and neither in whole nor in part on his own obedience.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/john-colquhoun.html">John Colquhoun</a></span><span class="wk"><span class="lbl">Work:</span> <cite>A Treatise on the Law and Gospel</cite>, (Grand Rapids: Reformation Heritage Books), 128. Emphasis Added.</span></figcaption>

</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-3b1cfb93cb" data-kw="">
<blockquote><p>Secondly, justification does connote a state and established condition of a man, and therefore is not frequently iterated, although it be continued. A man is not justified many times in a day, though sins be pardoned often in a day. It is true, God does continue to justify those that believe in Him, and if He should cease to do so, they would immediately fall into misery and guilt; but yet God does not renew or revive our justification, as if there were an interruption or intermission of it. That justification does denote an estate is plain by comparing it with all the other privileges God vouchsafes his people: regeneration and vocation denote a state the person is put into, so does glorification. As therefore sanctification is one thing, and those auxiliary actings of God’s grace are another thing, so that though we may say such a man has new quickening grace every day, yet we cannot say he has a new regeneration; so it is here: though we may say that every day the believer, begging the pardon of his daily infirmities, has a new pardon, yet he has not a new justification, because this denominates the state of a man. Neither can it be said that pardon of this sin or that sin puts a man into the state of God’s favor absolutely, but quoad hoc [so far as this]; the pardon of this or that sin does not make that universal righteousness of the person whereby he stands acquitted from all. It is true, some learned men call this daily remission of sin justificatio particularis [a particular justification]; but we are now treating of that universal justification whereby the person of a believer stands acquitted and disobliged from the guilt of all his sins he has committed. And great is the comfort of a Christian in that his justification is a state of favor with God; for hence flow many other inestimable benefits and advantages, which the believer is to study out and improve.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/anthony-burgess.html">Anthony Burgess</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The True Doctrine of Justification Asserted &amp; Vindicated, from the Errours of Papists, Arminians, Socinians &amp; more especially Antinomians in 30 Lectures</cite>, … (London: Underhill, 1654), pt. 2, | sermon 27, ‘That the whole nature of justification is not comprehended in remission and forgiveness of sin’, p. 268</span></figcaption>

</figure><figure class="quote" id="q-fbb9050d7e" data-kw="">
<blockquote><p>The great question is, of which sort is our righteousness whereby we are justified? I answer, of the second sort [Christ’s passive righteousness], which yet is no derogation from it: for though it be not a righteousness so honoring ourselves, yet is it as excellent in Christ, and honorable to Him. And this first kind of righteousness [Christ’s active righteousness] as it is in Christ, cannot, retaining its own form, be made ours. And to that the Papists arguments will hold good. The Law commanded our own personal obedience, and not another for us; We did not so personally obey, we did not really obey in Christ: and God does not judge us to do what we did not; If we had, yet it would not have made us just: for one sin will make us unjust, though we were never so obedient before and after; Therefore if we had obeyed in Christ, and yet sinned in ourselves, we are breakers of the Law still. And so our righteousness cannot be of the first sort. This breach therefore must be satisfied for, and consequently, our righteousness must be of the second sort: seeing both cannot stand in one person as before said. Christ indeed had both these kinds of righteousness, viz. the righteousness of perfect obedience; and the righteousness of satisfaction for disobedience. But the former only was his own personal righteousnes, not communicable to another under that notion, and in that form of ‘a righteousness by obeying’. The latter, was his righteousness, as he stood in our room, and was by imputation a sinner: and so is also our righteousness in and through Him. Yet the former [Christ’s active righteousness] (as I have proved before etc.) is ours too, and our righteousness too (though many divines think otherwise), but how? Not as retaining its form, in the former sense: but as it is also in a further consideration, a part of the righteousness by satisfaction: seeing that Christ’s very personal obediential righteousness was also in a further respect satisfactory.</p></blockquote>

<blockquote><p>4. That the promises concerning perseverance (as has been often intimated) are of two sorts. The first, of the continuance of the favor of God to us, which respects our justification. The other, of the continuance of our obedience unto God, which respects our sanctification… … 2. For those of the first sort, which I shall now handle… I shall propose only some few things unto consideration… … 2. That these promises of God do not properly, and as to their original rise, depend on any conditions in believers or by them to be fulfilled, but are the fountains and springs of all conditions whatever that are required to be in them or expected from them; though the grace and obedience of believers are often mentioned in them, as the means, whereby they are carried on according to the appointment of God unto the enjoyment (or continued in it) of what is promised.</p></blockquote>

<main class="wrap"><figure class="quote" id="q-f8ce0a4d2a" data-kw="">
<blockquote><p>‘Christ, who is our life, shall appear.’ There are two appearings, we know, of Christ; his first appearing and his second appearing. His first appearing was to work our salvation; his second shall be to accomplish and finish what he hath begun to work. His first appearing was to redeem our souls from death, and his second shall redeem our bodies from the corruption of the grave. So his second appearing shall be to accomplish all the good that he came to do and to work by his first. As verily, therefore, as Christ is come in his first appearing, so verily and certainly he shall appear the second time. And as it was the description of holy men before his first coming to wait for him, ‘to wait for the consolation of Israel,’ Luke 2:25, so Christians now. Those blessed souls that have the report of this, they wait for the coming of Christ.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/richard-sibbes.html">Richard Sibbes</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Complete Works of Richard Sibbes</cite>, ed. Alexander Balloch Grosart, vol. 5 (James Nichol et al., 1863), 211–12.</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/worship.html">Worship</a></span></div>

<blockquote><p>Another argument there is taken from them, that ‘they sought the Lord, etc.’ Which seeking of theirs is set out by the manner of it, that they prepared their whole heart to seek Him: Not as if their hearts were so free from sin, or so full of grace as they should have been; but that they were true and plain, and sincere: Not such as had no sin, for it is said, ‘they were not cleansed according to the purification of the sanctuary,’ but that did love no sin: Not such hearts as wanted no grace, or preparation for God’s ordinance: But such as were humbled for the want of grace and of that preparation that they should have made… For it is said, ‘He healed the people,’ that is, gave them that which God does offer unto his people in the sacrament: They received the seal of the Covenant, and He made good the Covenant unto them…</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/john-dod.html">John Dod</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Ten Sermons, Tending Chiefly to the Fitting of Men for the Worthy Receiving of the Lord’s Supper</cite>, (1634), The Fourth Sermon of the Lord’s Supper, on 2 Chron. 30:18-20, p. 112</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/worship/impurities-in-worship.html">Impurities in Worship</a></span></div>

· Reformed Books Online</a></div>
</figure><figure class="quote" id="q-afe51e93d3" data-kw="">
<blockquote><p>A second sort of works allowed to be done on the Lord’s day: are bodily works and labors which are so necessary for the fitting and enabling of Christians to sanctify that day… And because men cannot be so cheerful in the service of God, nor so heartily rejoice before Him, not with strength and delight spend the whole day in Sabbath duties, without warm and wholesome food, and plentiful refreshing of their weak bodies, therefore the dressing, boiling, baking and roasting of meat is lawful on the Lord’s day, so far as it more helps than hinders holy duties and the service of God. This is manifest by the words of the law, Ex. 12:16, where the Lord forbidding all manner of work on his holy Sabbaths, excepts labor and work about that which people were to eat, and which was necessary for the upholding of an holy moderate feasting on those days. This was practised by the Pharisees and by our Savior and his apostles who on the Sabbath day came to a feast to the house of a chief Pharisee, Lk. 14:1-2.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/george-walker.html">George Walker</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Doctrine of the Sabbath</cite>, … (Amsterdam, 1638), ch. 21 Westminster divine, p. 152</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/worship/the-lords-day.html">The Lord&#x27;s Day</a></span></div>

<blockquote><p>DEARLY Beloved in God, after you have heard so eagerly the Gospel and the teachings of the holy Apostles, now for the fourth year, teachings which Almighty God has been merciful enough to publish to you through my weak efforts, the majority of you, thank God, have been greatly fired with the love of God and of your neighbour. You have also begun faithfully to embrace and to take unto yourselves the teachings of the Gospel and the liberty which they give, so that after you have tried and tasted the sweetness of the heavenly bread by which man lives, no other food has since been able to please you. And, as when the children of Israel were led out of Egypt, at first impatient and unaccustomed to the hard journey, they sometimes in vexation wished themselves back in Egypt, with the food left there, such as garlic, onions, leeks, and flesh-pots, they still entirely forgot such complaints when they had come into the promised land and had tasted its luscious fruits: thus also some among us leapt and jumped unseemly at the first spurring—as still some do now, who like a horse neither are able nor ought to rid themselves of the spur of the Gospel;—still, in time they have become so tractable and so accustomed to the salt and good fruit of the Gospel, which they find abundantly in it, that they not only avoid the former darkness, labour, food, and yoke of Egypt, but also are vexed with all brothers, that is, Christians, wherever they do not venture to make free use of Christian liberty. And in order to show this, some have issued German poems, some have entered into friendly talks and discussions in public rooms and at gatherings; some now at last during this fast—and it was their opinion that no one else could be offended by it—at home, and when they were together, have eaten meat, eggs, cheese, and other food hitherto unused in fasts. But this opinion of theirs was wrong; for some were offended, and that, too, from simple good intentions; and others, not from love of God or of his commands (as far as I can judge), but that they might reject that which teaches and warns common men, and they might not agree with their opinions, acted as though they were injured and offended, in order that they might increase the discord. The third part of the hypocrites of a false spirit did the same, and secretly excited the civil authorities, saying that such things neither should nor would be allowed, that it would destroy the fasts, just as though they never could fast, if the poor labourer, at this time of spring, having to bear most heavily the burden and heat of the day, ate such food for the support of his body and on account of his work. Indeed, all these have so troubled the matter and made it worse, that the honourable Council of our city was obliged to attend to the matter. And when the previously mentioned evangelically instructed people found that they were likely to be punished, it was their purpose to protect themselves by means of the Scriptures, which, however, not one of the Council had been wise enough to understand, so that he could accept or reject them. What should I do, as one to whom the care of souls and the Gospel have been entrusted, except search the Scriptures, particularly again, and bring them as a light into this darkness of error, so that no one, from ignorance or lack of recognition, injuring or attacking another come into great regret, especially since those who eat are not triflers or clowns, but honest folk and of good conscience? Wherefore, it would stand very evil with me, that I, as a careless shepherd and one only for the sake of selfish gain, should treat the sheep entrusted to my care, so that I did not strengthen the weak and protect the strong. I have therefore made a sermon about the choice or difference of food, in which sermon nothing but the Holy Gospels and the teachings of the Apostles have been used, which greatly delighted the majority and emancipated them. But those, whose mind and conscience is defiled, as Paul says [Titus, 1:15], it only made mad. But since I have used only the above-mentioned Scriptures, and since those people cry out none the less unfairly, so loud that their cries are heard elsewhere, and since they that hear are vexed on account of their simplicity and ignorance of the matter, it seems to me to be necessary to explain the thing from the Scriptures, so that every one depending on the Divine Scriptures may maintain himself against the enemies of the Scriptures.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/huldrych-zwingli.html">Huldrych Zwingli</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Latin Works and The Correspondence of Huldreich Zwingli: Together with Selections from His German Works</cite>, ed. Samuel Macauley Jackson, trans. Henry Preble, Walter Lichtenstein, and Lawrence A. McLouth, vol. 1 (New York; London: G. P. Putnam’s Sons; Knickerbocker Press, 1912), 71–73.</span></figcaption>

+issued+German+poems%2C+some+have+entered+into+friendly+talks+and+discussions+in+public+rooms+and+at+gatherings%3B+some+now+at+last+during+this+fast%E2%80%94and+it+was+their+opinion+that+no+one+else+could+be+offended+by+it%E2%80%94at+home%2C+and+when+they+were+together%2C+have+eaten+meat%2C+eggs%2C+cheese%2C+and+other+food+hitherto+unused+in+fasts.+But+this+opinion+of+theirs+was+wrong%3B+for+some+were+offended%2C+and+that%2C+too%2C+from+simple+good+intentions%3B+and+others%2C+not+from+love+of+God+or+of+his+commands+%28as+far+as+I+can+judge%29%2C+but+that+they+might+reject+that+which+teaches+and+warns+common+men%2C+and+they+might+not+agree+with+their+opinions%2C+acted+as+though+they+were+injured+and+offended%2C+in+order+that+they+might+increase+the+discord.+The+third+part+of+the+hypocrites+of+a+false+spirit+did+the+same%2C+and+secretly+excited+the+civil+authorities%2C+saying+that+such+things+neither+should+nor+would+be+allowed%2C+that+it+would+destroy+the+fasts%2C+just+as+though+they+never+could+fast%2C+if+the+poor+labourer%2C+at+this+time+of+spring%2C+having+to+bear+most+heavily+the+burden+and+heat+of+the+day%2C+ate+such+food+for+the+support+of+his+body+and+on+account+of+his+work.+Indeed%2C+all+these+have+so+troubled+the+matter+and+made+it+worse%2C+that+the+honourable+Council+of+our+city+was+obliged+to+attend+to+the+matter.+And+when+the+previously+mentioned+evangelically+instructed+people+found+that+they+were+likely+to+be+punished%2C+it+was+their+purpose+to+protect+themselves+by+means+of+the+Scriptures%2C+which%2C+however%2C+not+one+of+the+Council+had+been+wise+enough+to+understand%2C+so+that+he+could+accept+or+reject+them.+What+should+I+do%2C+as+one+to+whom+the+care+of+souls+and+the+Gospel+have+been+entrusted%2C+except+search+the+Scriptures%2C+particularly+again%2C+and+bring+them+as+a+light+into+this+darkness+of+error%2C+so+that+no+one%2C+from+ignorance+or+lack+of+recognition%2C+injuring+or+attacking+another+come+into+great+regret%2C+especially+since+those+who+eat+are+not+triflers+or+clowns%2C+but+honest+folk+and+of+good+conscience%3F+Wherefore%2C+it+would+stand+very+evil+with+me%2C+that+I%2C+as+a+careless+shepherd+and+one+only+for+the+sake+of+selfish+gain%2C+should+treat+the+sheep+entrusted+to+my+care%2C+so+that+I+did+not+strengthen+the+weak+and+protect+the+strong.+I+have+therefore+made+a+sermon+about+the+choice+or+difference+of+food%2C+in+which+sermon+nothing+but+the+Holy+Gospels+and+the+teachings+of+the+Apostles+have+been+used%2C+which+greatly+delighted+the+majority+and+emancipated+them.+But+those%2C+whose+mind+and+conscience+is+defiled%2C+as+Paul+says+%5BTitus%2C+1%3A15%5D%2C+it+only+made+mad.+But+since+I+have+used+only+the+above-mentioned+Scriptures%2C+and+since+those+people+cry+out+none+the+less+unfairly%2C+so+loud+that+their+cries+are+heard+elsewhere%2C+and+since+they+that+hear+are+vexed+on+account+of+their+simplicity+and+ignorance+of+the+matter%2C+it+seems+to+me+to+be+necessary+to+explain+the+thing+from+the+Scriptures%2C+so+that+every+one+depending+on+the+Divine+Scriptures+may+maintain+himself+against+the+enemies+of+the+Scriptures.%E2%80%9D%0A%0A%E2%80%94+Huldrych+Zwingli%2C+The+Latin+Works+and+The+Correspondence+of+Huldreich+Zwingli%3A+Together+with+Selections+from+His+German+Works%2C+ed.+Samuel+Macauley+Jackson%2C+trans.+Henry+Preble%2C+Walter+Lichtenstein%2C+and+Lawrence+A.+McLouth%2C+vol.+1+%28New+York%3B+London%3A+G.+P.+Putnam%E2%80%99s+Sons%3B+Knickerbocker+Press%2C+1912%29%2C+71%E2%80%9373.&amp;url=https%3A%2F%2F5solasquotes.github.io%2Fquote%2F104f30070e.html&amp;via=5Solas" target="_blank" rel="noopener">Share on X</a><a class="perma" href="../quote/104f30070e.html">Permalink</a><a class="src" href="https://heidelblog.net/2018/02/zwingli-on-rejecting-lent-and-protecting-christian-liberty-from-man-made-obligations/" rel="noopener" target="_blank">Read it online · Heidelblog</a></div>
</figure><figure class="quote" id="q-c62361e910" data-kw="">
<blockquote><p>It should always be seen to that the song should not be light and frivolous, but that it have weight and majesty, as saith St. Augustine; and also that there is a great difference between the music that is employed for the enjoyment of men at table, and in their houses, and the psalms which they sing in church in the presence of God and his angels. But when the form here given is rightly judged of, we hope that it will be found holy and pure; seeing that it is simply constructed for the edification of which we have spoken, as well as that the use of singing may be greatly extended. So that even in the houses and in the fields, it may be to us an incitement and an instrument or means to praise God and raise our hearts to him; and to console us in meditating on his power, goodness, wisdom, and justice, which is more necessary for us than we know how to express. …This present book [the Genevan Psalter, 1543], for this cause, besides what otherwise has been said, ought to be particularly acceptable to every one who desires, without reproach, and according to God, to rejoice in seeing his own salvation, and the good of his neighbours; and thus has no need to be much recommended by me, as it carries in itself its own value and praise. Only let the world be well advised, that instead of songs partly vain and frivolous, partly foolish and dull, partly filthy and vile, and consequently wicked and hurtful, which it has heretofore used, it should accustom itself hereafter to sing these heavenly and divine songs, with good king David.</p></blockquote>

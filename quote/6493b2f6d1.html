<main class="wrap"><figure class="quote" id="q-6493b2f6d1" data-kw="">
<blockquote><p>It lies in the very nature of a naturalistic system that it should lay all its stress on the activities of the Christian life. There is nothing else on which it could lay its stress. What man himself does, the influences by which he is brought to do it, and the issue of his activities — this is the circle of topics in which what, by a strange transmutation of meaning, is still called Theology, moves.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/benjamin-b-warfield.html">Benjamin B. Warfield</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Albrecht Ritschl and his Doctrine of Christian Perfection. Article II: Ritschl the Perfectionist in Princeton Theological Review</cite></span></figcaption>
<div class="meta"><span class="t"><a href="../topics/theology.html">Theology</a></span></div>

<blockquote><p>Our intellect understands nothing except in virtue of the first light and truth, so every act of the intellect involved in thinking that something does not exist obtains in virtue of the first light. But it is impossible to think in virtue of the first light, that the first light or truth does not exist. Therefore, it is in no way possible to think that the first truth does not exist.</p></blockquote>

</figure><figure class="quote" id="q-000930b8b9" data-kw="">
<blockquote><p>The theology of Christians approves the teachings of philosophy if they are true, correct, and salutary. It uses them by its own right and makes them catholic. If they are too unclear, it sheds light on them; if they are mixed with harmful errors, it separates the precious from the cheap and keeps the one and destroys the other.</p></blockquote>

</figure><figure class="quote" id="q-8578adbce8" data-kw="">
<blockquote><p>Thesis 2. Lest, however, our disputation be forced to wander and err, I will do that which I think ought to be done at the beginning, middle, and end of all disputations: that first, what it is that is being disputed should be defined; then, the common affections should be subjected to the definition; and finally, a division into parts and species should follow. And so our disputation on original sin will present: 1. its Definition, 2. its common Affections, 3. its Distribution.</p></blockquote>

</figure><figure class="quote" id="q-094b574bde" data-kw="">
<blockquote><p>…the Fifth Way, at least as developed by later Thomists, does indeed plausibly get us to a divine intelligence. By contrast, Paley’s argument is often acknowledged to get us at best to a designer who is extremely powerful and and intelligent, but who for all we know may yet be finite and, thus non-divine. But it is not just that Paley’ s designer may be something other than God as Aquinas understands Him. There is reason to think that Paley’s designer could not be God as Aquinas understands Him. For Aquinas, when we predicate attributes of God, we necessarily do so analogously rather than univocally. But Paley is evidently predicating attributes to his designer and to us in a univocal way, which (for the Thomist at least) entails a radically deficient conception of God.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/edward-feser.html">Edward Feser</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Neo-Scholastic Essays</cite>, (South Bend, IN: St. Augustine’s Press, 2015) | 7. Between Aristotle &amp; William Paley: Aquinas’s Fifth Way 147, p. 83</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/theology/natural-theology.html">Natural Theology</a></span></div>

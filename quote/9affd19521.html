<main class="wrap"><figure class="quote" id="q-9affd19521" data-kw="">
<blockquote><p>For there had not yet been revealed to the Gentiles the heavenly doctrine which should purify their hearts by faith, and transform their natural disposition by humble godliness, and turn them from the service of proud devils to seek the things that are in heaven, or even above the heavens.</p></blockquote>

<div class="meta"><span class="t"><a href="../topics/the-church/creeds-confessions-and-councils.html">Creeds, Confessions and Councils</a></span></div>

</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-9c67a990d8" data-kw="">
<blockquote><p>The requiring subscription to the 39 Articles is a great imposition: I believe them all myself, but as there are some which might be expressed more unexceptionably, so I think it a better way to let such matters continue to be still the standard of doctrine and to censure those who teach any contrary tenets, than to oblige all who serve in the Church to subscribe them. The greater part subscribe without ever examining them, and others do it because they must do it, though they can hardly satisfy their consciences about some things in them. Churches and societies are much better secured by laws than by subscriptions: it is a more reasonable as well as a more easy mode of government.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/gilbert-burnet.html">Gilbert Burnet</a></span><span class="wk"><span class="lbl">Work:</span> <cite>History of his own Time</cite>, … new ed. (London: Orr, 1850), vol. 2, Conclusion, p. 904 Burnet (1643–1715) was a Scottish philosopher and historian, and Bishop of Salisbury.</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/the-church/creeds-confessions-and-councils.html">Creeds, Confessions and Councils</a></span></div>

</figure><figure class="quote" id="q-eab22231a6" data-kw="">
<blockquote><p>The protesters [against mandated subscription] were led by Jonathan Dickinson (1688–1747)… Dickinson shows that he is well acquatined with the debates elsewhere [such as in Ireland]… Notably Dickinson sees it [presbyterianism] not as divinely mandated, but the best of many imperfect options. While acknowledging the usefulness of confessions…</p></blockquote>

<div class="meta"><span class="t"><a href="../topics/the-church/creeds-confessions-and-councils.html">Creeds, Confessions and Councils</a></span></div>
<div class="actions"><button class="copy" data-copy="“The protesters [against mandated subscription] were led by Jonathan Dickinson (1688–1747)… Dickinson shows that he is well acquatined with the debates elsewhere [such as in Ireland]… Notably Dickinson sees it [presbyterianism] not as divinely mandated, but the best of many imperfect options. While acknowledging the usefulness of confessions…”

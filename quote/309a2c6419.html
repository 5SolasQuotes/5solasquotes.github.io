<main class="wrap"><figure class="quote" id="q-309a2c6419" data-kw="">
<blockquote><p>He that leaves sin, but does not endeavour to subdue it, will be content it should be confined, but not crucified; restrained, but not put to death; will have the fury and rage of it curbed, that it do not break out so openly, but will not starve it; kept under, not rooted out. He that will not avoid the occasions of sin, those that nourish it, have drawn him on to act sin formerly. He that truly repents of drunkenness will avoid that company which has tempted him to it. He that repents of uncleanness, will, as Job, make a covenant with his eyes. He that repents of profaneness in words, will set a watch before his mouth.

He that repents of Sabbath breaking, will so dispose of his affairs before, as he may have no occasion to profane it, to absent himself from the public worship. He that repents of wanderings in prayer, will be watchful against distractions, drive them away. He that turns not from occasions turns not from sin, and so is no true penitent. He that is not diligent in the use of mortifying duties to weaken sin, will not apply that word to his conscience which wounds his sin; casts off searching words, words of reproof and terror, as too sharp, painful corroding plasters for his sore; rather be exasperated against him that speaks them, as one that rails, is too strict.</p></blockquote>

</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-d8d0ceedf7" data-kw="">
<blockquote><p>…superstition is the opposite vice to religion, in the excess, as our divines describe it; for it exhibits more in the worship of God than He requires in his worship… We see he [Jonas Porree referencing Zanchi] accounts superstition to be in the addition of ceremonies not instituded by Christ, as well as in the addition of more substantial matters… Now our ceremonies, though they exhibit worship to God, yet this is done inordinately, and they make the worship to be otherwise performed than it should be; for example, though God be worshipped by the administration of the sacraments in private places, yet not so as He should be worshipped… …ceremonies… have no necessary nor profitable use in the Church (as has been proved) which kind of things, cannot be used without superstition.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/george-gillespie.html">George Gillespie</a></span><span class="wk"><span class="lbl">Work:</span> <cite>English Popish Ceremonies</cite>, (1637), pt. 3, ch. 1, pp. 1-2</span></figcaption>

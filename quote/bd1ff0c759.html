<blockquote><p>Some infirmities discover more good than some seeming beautiful actions. Excess of passion in opposing evil, though not to be justified, yet shows a better spirit than a calm temper when there is just cause of being moved. It is better that the water should run somewhat muddily than not run at all. Job had more grace in his ill temper than his friends in their seemingly wise demeanour. Actions soiled with some weaknesses are more accetped than self-righteous performances.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/richard-sibbes.html">Richard Sibbes</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Bruised Reed &amp; Smoking Flax… (1620; Philadelphia; Presbyterian Board of Publication, n.d.)</cite>, ch. 11, p. 76</span></figcaption>

<blockquote><p>In judging of cases of scandal, we are not so much to look at the event, what that is, or may be; as at the cause, [from] whence it comes; for sometimes there is given just cause of scandal, and yet no scandal follows, because it is not taken: sometimes scandal is taken, and yet no just cause given; and sometimes there is both cause of scandal given, and scandal thereat taken; But no man is concerned in any scandal that happens to another by occasion of anything done by him, neither is [he] chargeable with it, farther than he is guilty of having given it. If then we give scandal to others, and they take it not, we are to bear a share in the blame as well as they, and that a deeper share too (‘Vae homini’, ‘Woe to the man by whom the offence cometh,’ Mt. 8:7); but if they take offence when we give none, it is a thing we cannot help; therefore the whole blame must lie upon them. … 4. The third way [in which a man may be guilty of giving scandal] is, when a man does something before another, which in itself is not evil, but indifferent, and so according to the Rule of Christian Liberty, lawful for him to do, or not to do, as he shall see cause (yea, and perhaps otherwise commodious and convenient for him to do), yet whereat he probably foresees the other will take scandal, and be occasioned thereby to do evil. In such case, if the thing to be done, be not in some degree (at least prudentially) necessary for him to do, but that he might without great inconvenience and prejudice to himself and any third person, leave it undone, he is bound in charity and compassion to his brother’s soul (for whom Christ died) and for the avoiding of scandal to abridge himself in the exercise of his Christian Liberty for that time so far, as rather to suffer some inconvenience himself by the not doing of it than by doing of it to cause his brother to offend; the very case which is so often, and so largely, and so earnestly insisted upon by St. Paul, Rom. 14:13,21 and 15:1,3; 1 Cor. 8:7,13 and 9:12,22 and 10:23,33. Here the rule is, Do nothing that may be reasonably forborne, whereat it is like[ly] scandal will be taken. 5. The last way is, when a man does something before another which is not only lawful, but (according to the exigencies of present circumstances pro hic et nunc [for here and now]) very behoveful, and in some sort (prudentially) necessary for him to do, but foresees in the beholder a propension to make an ill use of it and to take encouragement thereby to commit sin; if there be not withal a great care had to prevent, as much as is possible, the scandal that might be taken thereat: for, Qui non prohibet peccare cum potest, jubet [He who does not prohibit sinning when able, enjoins it]. In such case the bare neglect of his brother, and not using his utmost endeavor to prevent the evil that might ensue, making him guilty, upon which consideration stands the equity of the [particular] judicial law given to the Jews, Ex. 21:33,34, which orders that in [the] case a man dig a pit or well for the use of his family, and (looking no farther than his own conveniency) put no cover on it, but leave it open, whereby it happens [that] his neighbor’s beast do fall therein and perish, the owner of the pit is to make it good, inasmuch as he was the occasioner of that loss unto his neighbor, which he might and ought to have prevented: In this last case the thing is not (for the danger of the scandal) to be left undone, supposing it (as we now do) otherwise behoveful to be done; but the action is to be ordered and carried on by us, for the manner of doing, and in all respects and circumstances thereunto belonging, with so much clearness, tenderness, and moderation and wisdom, that so many as are willing to take notice of it may be satisfied that there was on our part a reason of just necessity that the thing should be done;</p></blockquote>

</figure><figure class="quote" id="q-5a2fdbda56" data-kw="">
<blockquote><p>The partial conformist Paul, when he offered animal sacrifices, or arranged such for others (Acts 21:23–26; Num. 6:13–14) after Christ’s death, was, under a certain degree of necessity for a greater good (Acts 21:20–23), fulfilling the good in this deficient, yet lawful worship to God, without approving the deficiencies as best. Note these deficiencies in the material worship were in some ways contrary to Gospel principles (Acts 15:10, 28; Gal. 3:19, 23, 24–25; 4:1–3, 5–7, 9, 24, 30–31; 5:1, 7; Col. 2:14, 17, 20, 22; Tit. 1:14; Heb. 7:16, 27; 8:7–8, 10; 9:9–11, 28; 10:1–2, 10–11; 13:9) and the authorities would not remove them. Many may have accused Paul, knowing his convictions and what he had previously preached (Acts 21:21, albeit in a different context with a different kind of people for different formal reasons, e.g. Gal. 2–4 &amp; Col. 2:8–23), of compromising, conforming, backsliding and having temporizing motives for his own ease, avoiding suffering and of breaking the solemn, Gospel covenant. Ought not one to separate from such a scandalous Christian minister, who, for a time and in the circumstances, materially conformed at the permitted, yet restricting indulgence of the tyrannous authorities over God’s Church (as the rest of the story manifests, Acts 21:26–33)? God forbid.</p></blockquote>

9CA+True+Principle%E2%80%9D%2C+p.+49&amp;url=https%3A%2F%2F5solasquotes.github.io%2Fquote%2F5a2fdbda56.html&amp;via=5Solas" target="_blank" rel="noopener">Share on X</a><a class="perma" href="../quote/5a2fdbda56.html">Permalink</a><a class="src" href="https://reformedbooksonline.com/on-scandal/#:~:text=The%20partial%20conformist%20Paul%2C%20when%20he,story%20manifests%2C%20Acts%2021%3A26%E2%80%9333%29%3F%20God%20forbid&amp;text=The%20partial%20conformist%20Paul%2C%20when%20he%20offered%20animal&amp;text=of%20the%20story%20manifests%2C%20Acts%2021%3A26%E2%80%9333%29%3F%20God%20forbid" rel="noopener" target="_blank">Read it online · Reformed Books Online</a></div>

<blockquote><p>Now Papists confirm many of their superstitions by the English ceremonies… It will be said that Papists have no ground nor reason to confirm any of their superstitions by the English ceremonies. But I answer: 1. If it were so, yet forasmuch as Papists draw them to a confirmation of their superstitions, we should abstain from them as appearances of evil. Eating (at a private banquet) of that which was sacrificed to idols, did confirm an idolater and infidel in his religion, as Pareus notes (Commentary on 1 Cor. 10:28): yet from this the idolater had no reason to confirm himself in his idolatry; but because the idolater seeing it, might draw it to a confirmation, the apostle will have it for that respect foreborn. When the Arians abused trine [three-fold] immersion in baptism to signify three natures of the three persons, Pope Gregory and the Fourth Council of Toledo ordained that in Spain, thrice washing should no longer be used in baptism, but once only. The Arians had no just reason to draw such a signification from the ceremony of trine-immersion: yet was it abolished when those heretics did so abuse it. If any say that we are saved by the blood of the son of man, the phrase is orthodox, because of the communication or rather communion of properties, and the Nestorians cannot with good reason by it confirm their heresy, yet are we to abstain from this form of speech, in Zanchius his judgment, when it is drawn to the confirmation of that error.</p></blockquote>

<blockquote><p>Further, if people are thus unjustly charged, it may be some comfort to consider the best of Christ’s servants have been thus accused, as appears from what the apostle says, 2 Cor. 1:17-18, when it seems such as turned his enemies in that Church had charged him with lightness and changeableness in his doctrine and principles, as well as in his purposes, where, for his own vindication, he is obliged to use a sort of solemn oath, saying, ‘But as God is true, our word,’ or preaching, ‘toward you was not yea and nay.’ And Durham on Scandal (p. 176) instances this as one of the ways whereby the Devil carries on division in the Church, viz. by making people charge ministers with ‘lightness’ and ‘changeableness,’ as if they were of one mind this year and of another the next. As formerly I endeavored to contribute my mite in opposing what I judged amiss in the Church of Scotland, so, through grace, I hope to continue and cannot see a shadow of reason to imagine but it is as acceptable to God, and much more acceptable to Him to oppose what may be amiss in her conduct, in a way of Church-communion, as in a separate state, ‘Separation’ (as the Protesters say) ‘being highly impedimental to reformation.’ (Rep. to Ass., 1652) I know every Christian, and ministers of the Gospel, in a special manner, ought to be very cautious, guarding against giving offense to any of Christ’s little ones, but if they will take offense at doing what is plain present duty, though they are to be pitied and used tenderly, yet they are not to be regarded so as to omit duty for fear they take offense. When the great apostle of the gentiles opposed Peter, and other saints, who pretending greater strictness, did separate from the gentile converts, he knew his conduct in that would offend many who were dear unto the Lord; yet he regarded not their offense, but ‘withstood Peter to the face, because he was to be blamed.’ (Gal. 2:11-14) Our Lord Jesus knew his healing and curing diseased persons on the Sabbath would occasion such as watched him (Mk. 3:2) to take offense; He also knew his familiar converse with publicans and sinners would be stumbling and offensive to sundry; yet he would not forbear it. Sometimes we are called to deny ourselves as to our ease, conveniency, pleasure and satisfaction rather than occasion the offending of such as causelessly take offense, but, according to our Lord’s example, commanded present duty is to be done, let never so many stumble or be offended. Hence [Matthew] Henry says (on Mk. 2:16), ‘Those are too tender of their own good name who, to preserve it with some nice people, will decline a good work; Christ would not do so.’ And tender Christians, who may be ready to take offense, ought to consider what danger there is in being ‘righteous over much.’ If the prophetess Miriam, or Aaron, the saint of God, speak against Moses, his Lord will resent it, asking ‘Wherefore were ye not afraid to speak against my servant Moses?’ (Num. 12:8) Now, for doing what, in my opinion, is plain present duty in this case, viz. the opposing what I take to be sinful schism, though I should further suffer in my reputation from some, yet ’tis some satisfaction to think in this I’m far from being singular; for here I suffer with a cloud of faithful witnesses, as…</p></blockquote>

<main class="wrap"><figure class="quote" id="q-4a95bcc9e0" data-kw="">
<blockquote><p>A religious man, therefore, is practically just a true Christian, one who has acquired so much knowledge of God and of the way of salvation, and of the path of duty, from the Christian revelation, and who is so using and applying this knowledge, as that there is good ground to believe that he is advancing in the way that leadeth to glory, honour, and immortality, and that he will ultimately secure eternal life.

Theology, used subjectively, as descriptive of that in a man which entitles him to be called a theologian, means a full and comprehensive and well-digested knowledge of God, and of everything needful to be known, in order to worshipping and serving him aright, such as may not only avail for the regulation of his own conduct, and the securing of his own personal happiness, but may qualify him for becoming a teacher or instructor of others.

And in accordance with this view of its meaning, it is well known that when we apply the term theologian to one who is not in the office of the ministry, not using it merely as a common designation of a particular profession, we intend to convey the idea that he is possessed of a much fuller and more thorough acquaintance with religious subjects than is usually exhibited by those who have not studied religion professionally; such an acquaintance with these subjects as that he would be fairly entitled to speak or write about them for the instruction or information of others. Theology then used subjectively, and distinguished from religion, is descriptive of a full, comprehensive, well-digested knowledge of God and of divine things, such as may qualify for the instruction of our fellowmen.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/william-cunningham.html">William Cunningham</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Theological Lectures on Subjects Connected with Natural Theology, Evidences of Christianity, the Canon and Inspiration of Scripture</cite>, ed. Thomas Smith (New York: Robert Carter and Brothers, 1878), Lecture I, p. 8.</span></figcaption>

<blockquote><p>24. Applicatory works of grace are either external or internal.

25. External ones are both calling through the Word, partly of Law, partly of gospel, and the sealing of those called through sacraments.

26. Calling through Law is prior, and that partly imperative of obedience, partly declarative of sanction, both promissory and comminatory. …

29. Calling through nature to God the Creator is broader; calling through the Word to God the redeemer is stricter.

30. Universal calling to salvation neither was, nor is, nor will be.

31. That hope of special mercy is shown in nature, or that this is the instrument of gospel-calling, is false, nor can this be said without nature being established as a herald of grace.</p></blockquote>

<blockquote><p>In general, Wittich tried to refute Spinoza’s monism by mobilizing Cartesian principles, which is particularly perspicuous in his discussion of God’s being. However, once he turned to the issue of the divine will, he openly contradicted Descartes’ teaching and approached Spinoza’s necessitarianism. He chose to do so to remain orthodox, evading the accusation of Socinian heresy, which the conservative theologian Petrus van Mastricht had made against his Theologia pacifica (1671). This paper concludes that the widespread fear concerning Socinianism deeply conditioned the way theologians reacted to the Cartesian philosophy in the Netherlands in the late seventeenth century.” – Abstract Sangiacomo, Andrea – ‘Divine Action &amp; God’s Immutability: a Historical Case Study on how to Resist Occasionalism’ European Journal of Philosophy of Religion, 7/4 (Summer 2015), pp. 115-135 Sangiacomo is an associate professor at the faculty of philosophy at the University of Groningen (NL). Abstract: “Today’s debates present ‘occasionalism’ as the position that any satisfying account of divine action must avoid. In this paper I discuss how a leading [French] Cartesian author of the end of the seventeenth century, Pierre-Sylvain Régis [1632–1707], attempted to avoid occasionalism. Régis’s case is illuminating because it stresses both the difficulties connected with the traditional alternatives to occasionalism (so-called ‘concurrentism’ and ‘mere-conservationism’) and also those aspects embedded in the occasionalist position that should be taken into due account. The paper focuses on Régis’s own account of secondary causation in order to show how the challenge of avoiding occasionalism can lead to the development of new accounts of divine action.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/yoshi-kato.html">Yoshi Kato</a></span><span class="wk"><span class="lbl">Work:</span> <cite>‘Between Cartesianism &amp; Orthodoxy</cite>, [1690]’ in Intellectual History Review (2020)</span></figcaption>

<blockquote><p>XIV. Although the philosopher may be allowed to begin with a doubt in order to a safer investigation of natural things, yet this cannot be introduced into subjected of theology and faith. They are founded upon certain and indubitable principles and truths known per se, to doubt concerning which is impious (as concerning the existence of God) unless we wish to strip ourselves of conscience and the moral dependence on the Creator (which cannot be shaken off or for a moment rejected without crime) and thus to introduce philosophical doubt (epochen) into religion and render the whole of theology sceptical.</p></blockquote>

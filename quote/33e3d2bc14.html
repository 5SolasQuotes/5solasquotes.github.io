<main class="wrap"><figure class="quote" id="q-33e3d2bc14" data-kw="">
<blockquote><p>8. They differ [effectis] in the effects of both. The former covenant sheweth what is just, fit, and meet to be done, but ministereth no strength, and therefore man that was under it did not actually keep it; the first covenant never brought salvation to any one soul that was under it; but now this gospel covenant is a quickening spirit, conferreth grace, assisteth all who are under it, and hath brought thousands to heaven, it never faileth of attaining the end, in its own nature it brings life and happiness, 2 Cor. iii. 6—9. Heb. vii. 19. The former is a ministration of condemnation and death, consequentially because man cannot keep it; this other is a ministration of the Spirit, righteousness and salvation; the former never saves, the latter never finally condemns, but always saves such as are sincerely, and perseveringly within the compass of it.

9. They differ [adjuncto durationis] in the adjunct of duration. The former covenant is antiquated and superseded by the latter, and such as are within the new covenant, are “not under the law, but under grace,” and so are “delivered from the curse of the law; those are dead to the law, who are married to Christ.” The new covenant is perpetual and unalterable, it shall continue to the end of time, as it commenced near the beginning of time, as it was designed before all time; “For ever, O Lord, thy word is settled in heaven,” it reacheth from eternity, and to all eternity; it was laid in the eternal councils of God, before the world began, and will continue as to its efficacy, when there will be no world; God hath fixed this way of salvation, and will not repent, or retract it.

10. The old covenant and new differ [sponsore] as to the admission of a surety, the former had none, the latter hath; this indeed is the chief difference betwixt the two covenants. As to the former, the whole weight of this massy fabric of man’s happiness was laid on man’s shoulders, who though he was of a giant strength by creation, yet he was but a creature, and if God put no trust in his servants, yea his angels he charged with folly, how short must man needs be? who though he was perfect in his kind, yet not immutably perfect, and to our sorrow we feel he lost that happiness: but now God hath “laid help upon one that is mighty,” even the right hand of omnipotency hath strengthened him; “I will preserve thee, saith God, and give thee for a covenant of the people, to stablish the earth.”

This, this is the distinguishing characteristic of this glorious dispensation; this forms the Jachin and Boaz of the house of God; this only is the pearl of price that enricheth and adorneth the gold ring of the gospel covenant; this rendereth God approachable by man; this is the rainbow round about the throne; this is what rendereth the state of covenanted souls safe and durable, and elevateth the second covenant so many degrees above the first: “By so much,” saith the apostle, “was Jesus made a surety of a better testament,” Heb vii. 22; and therefore was it better, because it is in Jesus Christ, this better surety; and now the flames of the burning mount are quenched, the piercing sword has lost its edge, the blackness, darkness, and tempests are removed; Moses may draw near, and not exceedingly fear and quake; people may endure that which is commanded, for it is ordained in the hands of a mediator.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/oliver-heywood.html">Oliver Heywood</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Baptismal Bonds Renewed</cite>, (1687) in The Whole Works of the Rev. Oliver Heywood, B.A. (5 vols, Idle: John Vint, 1826), 4: 17-19.</span></figcaption>

</figure><figure class="quote" id="q-d64f9341df" data-kw="">
<blockquote><p>The word Testament is a Latin word, whereby the Greek word Diatheke is rendered, which the Greek Translators use to express the Hebrew word Berith, that is, Covenant. And thereby is properly understood the Covenant itself, which God hath made with mankind upon certain conditions to give them everlasting life: which Covenant is twofold, the Old and the New.

The Old is that which God made with the first man before the fall, wherein eternal life was promised upon condition of a thoroughly perfect, and keeping of the Law; and is therefore called the Legal Covenant, which God again propounded to the Israelites, that from thence they might learn to understand (seeing this condition is transgressed by all men, and can now be fulfilled by no man) that they must seek their salvation in another Covenant, which is called the New [Covenant,] and consisteth in this: That God hath appointed his Son for a Mediator, and promiseth eternal life upon condition that we believe in him; and is called the Covenant of Grace.

And this also in regard of the several administrations thereof unto mankind is called Old and New. The Old is the administration of the Covenant before the coming of the Mediator, which was promised to Abraham and his posterity [to come] of his seed, and prefigured by manifold Ceremonies laid down by Moses. The New is the administration of the same Covenant, since the Son of God, the Mediator of this Covenant came in the flesh, and hath accomplished man’s reconciliation with God. These two Covenants are of one kind as concerning their substance, forasmuch as in both forgiveness of sins, salvation and eternal life are promised upon condition of faith in the Mediator: but are different in respect of their several administrations, which in the New is much clearer, without figures, and extends itself unto all Nations.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/theodore-haak.html">Theodore Haak</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Argument of the New Testament in The Dutch Annotations upon the Whole Bible</cite></span></figcaption>

<blockquote><p>Ye,” says Christ, “who are evil, know how to do good to your children” (Mt. 7:11); what then are we to expect from the very fountain of goodness? As, then, parents are not willingly angry with their children, nor handle them roughly, there is no doubt but that God never punishes men except when He is constrained. There is, as I have said, an impropriety in the expression, but it is enough to know, that God derives no pleasure from the miseries of men, as profane men say, who utter such blasphemies as these, that we are like balls with which God plays, and that we are exposed to many evils, because God wishes to have as it were, a pleasant and delectable spectacle in looking on the innumerable afflictions, and at length on the death of men. That such thoughts, then, might not tempt us to unbelief, the prophet here puts a check on us, and declares that God does not afflict from his heart, that is, willingly, as though He delighted in the evils of men, as a judge, who, when he ascends his throne and condemns the guilty to death, does not do this from his heart, because he wishes all to be innocent, and thus to have a reason for acquitting them; but yet he willingly condemns the guilty, because this is his duty. So also God, when He adopts severity towards men, He indeed does so willingly, because He is the judge of the world; but He does not do so from the heart, because He wishes all to be innocent—for far away from Him is all fierceness and cruelty; and as He regards men with paternal love, so also He would have them to be saved, were they not as it were by force to drive Him to rigor. And this feeling he also expresses in Isaiah, “Ah! I will take consolation from mine adversaries.” (Isa. 1:24) He calls them adversaries who so often provoked Him by their obstinacy; yet He was led unwillingly to punish their sins, and hence He employed a particle expressive of grief, and exclaimed ‘Ah!’ as a father who wishes his son to be innocent, and yet is compelled to be severe with him.</p></blockquote>

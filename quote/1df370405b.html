<main class="wrap"><figure class="quote" id="q-1df370405b" data-kw="">
<blockquote><p>II. Moral actions of God, whose efficiency is metaphorical and are by way of object, by which He objectively moves and intelligibly instructs the elect (namely, adults or those using reason), by setting forth and offering the goods acquired, adjudicated, and assigned by Christ the Redeemer, and thus inviting to the acceptance of them, which happens through the contracting of the covenant. And such a moral action is of one single species, called Calling—calling, I say, to the contracting of the covenant of grace: so that I may distinguish it from the Calling which demands the performance of the law and summons all men to the obedience due to God from the right which He has over rational creatures. Which we also concede is directed to all the reprobate; but we deny that it can properly be called salvific, or a calling to salvation.

III. Real actions operating really or physically (as the more recent speak), and producing a real and inhering change in the subject, are those by which God makes the elect participants of real possession of goods and inhering gifts. And they are: Regeneration; Beatification in the state of grace; Beatification of the soul after this life; Resurrection to glory; Final glorification. Of these, the three latter pertain to the future life; the two former to the present life.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/gisbertus-voetius.html">Gisbertus Voetius</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Disputation 29, ‘On Regeneration’, pt. 1</cite>, (1639) tr. AI by Roman Prestarri in Select Theological Disputations (1655), vol. 2, p. 432 ff. Latin at Confessionally Reformed Theology</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/church-government-and-the-ministry/the-call-to-ministry.html">The Call to Ministry</a></span></div>

</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-a1a4b463fa" data-kw="">
<blockquote><p>And as for the other sort of elders, together with deacons, we judge the ancient order of this Church [of Scotland], to have been most convenient for providing of well-qualified men for those functions and offices. For the eighth head of the First Book of Discipline, touching the election of elders and deacons, ordains that men of best knowledge and cleanest life, be nominat[ed] to be in election, and that their names be publicly read to the whole church by the minister, giving them advertisement, that from among them must be chosen elders and deacons: that if any of these nominat[ed] be noted with public infamy, he ought to be repelled: and that if any man know others of better qualities within the Church than these that be nominat[ed], they should be put in election, that the Church may have the choice.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/george-gillespie.html">George Gillespie</a></span><span class="wk"><span class="lbl">Work:</span> <cite>English Popish Ceremonies</cite>, (1637), pt. 3, ch. 8, Digression 1, p. 163</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/church-government-and-the-ministry/the-call-to-ministry.html">The Call to Ministry</a></span></div>

</figure><figure class="quote" id="q-a860c4a2df" data-kw="">
<blockquote><p>We are all naturally inclined to lean upon man whom we can see, rather than upon God whom we cannot see. We naturally love to lean upon the ministers of the visible Church, rather than upon the Lord Jesus Christ, the great Shepherd and High Priest, who is invisible. We need to be continually warned and set on our guard. I see this tendency to lean on man everywhere. I know no branch of the Protestant Church of Christ which does not require to be cautioned upon the point…. We all naturally love to have a pope of our own. We are far too ready to think, that because some great minister or some learned man says a thing, or because our own minister, whom we love, says a thing—that it must be right, without examining whether it is in Scripture or not. Most men dislike the trouble of thinking for themselves. They like following a leader. They are like sheep, when one goes over the hill all the rest follow.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/j-c-ryle.html">J. C. Ryle</a></span><span class="wk"><span class="lbl">Work:</span> <cite>A Warning to the Churches, ‘The Fallibility of Ministers’</cite></span></figcaption>

</figure><figure class="quote" id="q-479cbfa66b" data-kw="">
<blockquote><p>Ordination is the act of a presbytery.[t] The power of ordering the whole work of ordination is in the whole presbytery, which, when it is over more congregations than one, whether these congregations be fixed or not fixed, in regard of officers or members, it is indifferent as to the point of ordination.[v] [t] 1 Tim. 4:14. [v] 1 Tim. 4:14. It is very requisite, that no single congregation, that can conveniently associate, do assume to itself all and sole power in ordination:

1. Because there is no example in scripture that any single congregation, which might conveniently associate, did assume to itself all and sole power in ordination; neither is there any rule which may warrant such a practice.

2. Because there is in scripture example of an ordination in a presbytery over diverse congregations; as in the church of Jerusalem, where were many congregations: these many congregations were under one presbytery, and this presbytery did ordain. The preaching presbyters orderly associated, either in cities or neighboring villages, are those to whom the imposition of hands doth appertain, for those congregations within their bounds respectively.</p></blockquote>

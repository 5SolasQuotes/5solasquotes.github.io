<main class="wrap"><figure class="quote" id="q-ab8275ceb7" data-kw="">
<blockquote><p>If the doctrine of purgatory is untenable, all offerings and prayers for the dead automatically fall with it. Veneration of the dead by sacrifices and prayers was common among pagans. Intercession for the dead became a practice among the Jews later (2 Macc. 12:40–45) and remains to the present. In the Christian church there soon arose the custom of wishing for the dead to receive peace, light, and refreshment (refrigerium) and remembering them in prayers and at the celebration of the Lord’s Supper. In the early period, this was done with respect to all without distinction who died in the Lord, and these offerings and sacrifices were solely memorial in nature. But gradually a distinction was made between the souls who were immediately taken up into heaven and others who still had to spend time in purgatory. Communion with the first then gradually began to be practiced by invocation and veneration, and with the second by intercessions, good works, indulgences, and Masses for the soul. In the ancient Catholic sense—as prayer to God that he would increase the blessedness of those who died in Christ and hear their prayers for the living, and simultaneously as commemoration of and communion with the dead—intercession for the dead was also approved by the Greeks, the Lutherans, Hugo Grotius, many Anglicans, and certain more-recent theologians. But the Reformed rejected this intercession for the dead on the ground that their lot was unalterably decided at death. The fact is that neither the Old nor the New Testament breathes a word about such intercession. The only passage to which appeal can be made is 1 Cor. 15:29, where Paul mentions those who had themselves baptized ὑπερ νεκρων (hyper nekrōn). However, from this it cannot be inferred that such a baptism was received by the living for the benefit of the dead. There is no evidence whatever that such a practice existed in Paul’s time or later. True, Tertullian and others report that this custom was found among the followers of Cerinthus and Marcion; but in the first place the correctness of this report is subject to doubt and, second, [if it is correct] the implication is that it was a heretical practice that never found acceptance in the Christian church. Those who would use the text to support the right to pray for the dead should first of all begin by baptizing the living on behalf of the dead, so that baptism could benefit them. Paul cites the dead as the reason why the living had themselves baptized. Because those who had died in Christ would rise again, because of what they stood for and on their behalf, the living who were believers had themselves baptized. The apostle here is only expressing the thought that baptism presupposes belief in the resurrection of Christ and of believers. Take away the resurrection, and baptism becomes an empty ceremony. Intercession for the dead, therefore, has no basis whatever in Scripture, as Tertullian for that matter already recognized. For after he had discussed various church practices, including sacrifices for the dead (De corona militus, ch. 3), he added in chapter 4: “If, for these and other such rules, you insist on having positive scriptural injunction, you will find none. Tradition will be held forth to you as the originator of them, custom as their strengthener, and faith as their observer.” Because there is no prescription of [God] the Father, we have to content ourselves with the custom of the mother, that is, the church, which thus again receives a position alongside of and above the Word of God. Since, then, intercession for the dead cannot stand the test of Scripture, the question concerning its utility and comfort is no longer appropriate. All the same, these two things are hardly demonstrable. For though it seems a beautiful thing that the living can help the dead by their intercessions and make up for the wrong they have perhaps done to them during their lifetime, in fact this church practice takes Christian piety in a totally wrong direction. It gives the impression that—contrary to Matt. 8:22—caring for the dead is of greater value than love for the living; it credits one’s own works and prayers with a meritorious, expiatory power that is effective even on the other side of the grave and benefits the dead; it is based on and conducive to the doctrine of purgatory, which, on the one hand, especially among the rich, fosters unconcern and, on the other hand, perpetuates the uncertainty of believers; and in the minds of Christians it weakens confidence in the sufficiency of the sacrifice and intercession of Christ.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/herman-bavinck.html">Herman Bavinck</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Reformed Dogmatics: Holy Spirit, Church, and New Creation</cite>, vol. 4, trans. John Bolt and John Vriend, (Grand Rapids, MI: Baker Academic, 2008), 638–39.</span></figcaption>

<blockquote><p>Here Owen appears to waver. On the one hand he allows that punishments may vary provided that the end of satisfying justice is met. On the other hand he seems to make an exception of the atonement, arguing or rather implying that there could not be another mode of satisfaction for sin than atonement by the God-man, the surety who has substituted himself in the room of sinners. Yet he seems to allow the possibility (though one that we are not in a position to know about) that the manner, time etc. of punishment belongs entirely to God, whose counsel we do not know. Which raises the question of why, if punishments in general, in respect of their nature and circumstances, are in the hand of God, why the punishment for sin may not similarly be. And if it may similarly be, even if we have not a clue about what an alternative mode of punishment may be in this case, then the atonement by Christ is not necessary in even the restricted sense that Owen has argued for earlier.</p></blockquote>

</figure><figure class="quote" id="q-8135c22a45" data-kw="">
<blockquote><p>This intercession consists of various acts. (1) The appearing of Christ for us by which he places himself before God the father as the only satisfier for our sins, representing the blood once shall (i.e., The merit of his death) and asking that at the side of it he would pardon our sins and bestow upon us all blessings necessary to salvation, until he has conducted us into the possession of full felicity: “Father, I will that they also whom thou hast given me, be with me where I am; that they may behold my glory” (Jn. 17:24). Hence the lamb is seen standing in heaven, as if it had been slain (hos esphagmenos, Rev. 5:6) because his blood is ever fresh and living (i.e., of eternal virtue and efficacy). (2) Our defense and protection against the thunderbolts of the law and the accusations of Satan, pleading our cause at the tribunal of God. (3) His suretyship for us by which as he demands grace from the Father and the gifts of the Spirit necessary to our perseverance, so in turn in our name he promises to God obedience and fidelity. (4) The offering of our persons and the sanctification of our prayers and of our entire worship, inasmuch as he presents all our prayers to God as spiritual sacrifices, perfumed with the most fragrant odor of his own sacrifice, so that in and through him they may be pleasing and acceptable to God. (1 Pet. 2:5). Hence he is represented as an angel with a burning censer (Rev 8:3) to whom is given much incense, that he should offer it with the prayers of saints. Elsewhere he is called an altar upon which all our sacrifices must be placed and on which alone the rational worship we render to God can be pleasing to him.</p></blockquote>

<main class="wrap"><figure class="quote" id="q-04a2024a36" data-kw="">
<blockquote><p>This is not a book of Church law. It does not profess, that is, to give the internal or administrative law of any Church, as to its creed or otherwise. It is a book of the civil law of Scotland in its relation to the Church.</p></blockquote>

<div class="meta"><span class="t"><a href="../topics/the-church/creeds-confessions-and-councils.html">Creeds, Confessions and Councils</a></span></div>

<blockquote><p>And so the Temple of God in heaven, is properly taken for his heavenly elect Church upon earth, and for their true doctrine, profession, and religion… the true Christian Churches, professors of Christ his true testimony, were visible and patent, their true doctrine and Christian religion opened up, and the majesty of God thereby made known, and manifested in the days of the apostles:</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/john-napier.html">John Napier</a></span><span class="wk"><span class="lbl">Work:</span> <cite>A Plain Discovery of the Whole Revelation of Saint John</cite>, (Edinburgh: Waldegrave, 1593) Napier (1550–1617) was a Scottish scholar.</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/the-church/creeds-confessions-and-councils.html">Creeds, Confessions and Councils</a></span></div>

</figure><figure class="quote" id="q-1e802c3ba4" data-kw="">
<blockquote><p>2… He testifies that the church is ‘built upon the foundation of the prophets and apostles’ [Eph. 2:20]. If the teaching of the prophets and apostles is the foundation, this must have had authority before the church began to exist… For if the Christian church was from the beginning founded upon the writings of the prophets and the preaching of the apostles, wherever this doctrine is found, the acceptance of it–without which the church itself would never have existed–must certainly have preceded the church.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/john-calvin.html">John Calvin</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Institutes of the Christian Religion</cite>, Institutes Christian Religion, ed. John T. McNeill, tr. Ford Lewis Battles in The Library of Christian Classics, vol. 20 (Philadelphia: Westminster Press, 1960), vol. 1, bk. 1; ch. 7, pp. 76-77</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/the-church/creeds-confessions-and-councils.html">Creeds, Confessions and Councils</a></span></div>
<div class="actions"><button class="copy" data-copy="“2… He testifies that the church is ‘built upon the foundation of the prophets and apostles’ [Eph. 2:20]. If the teaching of the prophets and apostles is the foundation, this must have had authority before the church began to exist… For if the Christian church was from the beginning founded upon the writings of the prophets and the preaching of the apostles, wherever this doctrine is found, the acceptance of it–without which the church itself would never have existed–must certainly have preceded the church.”

— John Calvin, Institutes Christian Religion, ed. John T. McNeill, tr. Ford Lewis Battles in The Library of Christian Classics, vol. 20 (Philadelphia: Westminster Press, 1960), vol. 1, bk. 1; ch. 7, pp. 76-77">Copy</button><a class="share" href="https://x.com/intent/post?text=%E2%80%9C2%E2%80%A6+He+testifies+that+the+church+is+%E2%80%98built+upon+the+foundation+of+the+prophets+and+apostles%E2%80%99+%5BEph.+2%3A20%5D.+If+the+teaching+of+the+prophets+and+apostles+is+the+foundation%2C+this+must+have+had+authority+before+the+church+began+to+exist%E2%80%A6+For+if+the+Christian+church+was+from+the+beginning+founded+upon+the+writings+of+the+prophets+and+the+preaching+of+the+apostles%2C+wherever+this+doctrine+is+found%2C+the+acceptance+of+it%E2%80%93without+which+the+church+itself+would+never+have+existed%E2%80%93must+certainly+have+preceded+the+church.%E2%80%9D%0A%0A%E2%80%94+John+Calvin%2C+Institutes+Christian+Religion%2C+ed.+John+T.+McNeill%2C+tr.+Ford+Lewis+Battles+in+The+Library+of+Christian+Classics%2C+vol.+20+%28Philadelphia%3A+Westminster+Press%2C+1960%29%2C+vol.+1%2C+bk.+1%3B+ch.+7%2C+pp.+76-77&amp;url=https%3A%2F%2F5solasquotes.github.io%2Fquote%2F1e802c3ba4.html&amp;via=5Solas" target="_blank" rel="noopener">Share on X</a><a class="perma" href="../quote/1e802c3ba4.html">Permalink</a><a class="src" href="https://reformedbooksonline.com/on-subscription-to-confessions-by-church-officers/#:~:text=He%20testifies%20that%20the%20church%20is,existed%E2%80%93must%20certainly%20have%20preceded%20the%20church&amp;text=He%20testifies%20that%20the%20church%20is%20%E2%80%98built%20upon&amp;text=never%20have%20existed%E2%80%93must%20certainly%20have%20preceded%20the%20church" rel="noopener" target="_blank">Read it online · Reformed Books Online</a></div>
</figure><figure class="quote" id="q-a7f66a60b5" data-kw="">
<blockquote><p>We, all and every one of us underwritten, protest, that after long and due examination of our own consciences in matters of true and false religion, are now thoroughly resolved in the truth, by the Word and Spirit of God. And, therefore, we believe with our hearts, confess with our mouths, subscribe with our hands, and constantly affirm, before God and the whole world, that this only is the true Christian faith and religion, pleasing God and bringing salvation to man, which is now, by the mercy of God, revealed to the world by the preaching of the blessed Evangel, and is received, believed, and defended by many and sundry notable kirks and realms, but chiefely by the Kirk of Scotland, the king’s Majesty, and three Estates of this realm, as God’s eternal truth, and only ground of our salvation; as more particularly is expressed in the confession of our faith, stablished, and publicly confirmed, by sundry acts of Parliaments and now, of a long time has been openly professed by the king’s Majesty, and whole body of his realm, both in burgh and land. To the which Confession and form of religion we willingly agree in our consciences, in all points, as unto God’s undoubted truth and verity, grounded only upon his written Word. And, therefore, we abhor and detest all contrary religion and doctrine, but chiefly, all kind of Papistry, in general and particular heads, even as they are now damned and confuted by the Word of God, and Kirk of Scotland… We, therefore, willing to take away all suspicion of hypocrisy, and of such double dealing with God and his Kirk, protest, and call the Searcher of all hearts to witness, that our minds and hearts do fully agree with this our confession, promise, oath, and subscription, so that we are not moved for any worldly respect, but are persuaded only in our consciences, through the knowledge and love of God’s true religion, printed in our hearts by the Holy Spirit, as we shall answer to Him in the day when the secrets of all hearts shall be disclosed…</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/david-calderwood.html">David Calderwood</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The History of the Kirk of Scotland</cite>, vol. 3, pp. 501-5</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/the-church/creeds-confessions-and-councils.html">Creeds, Confessions and Councils</a></span></div>

</figure><figure class="quote" id="q-2ad6c74ffd" data-kw="">
<blockquote><p>This presbytery consisting of more pastors is the first ruling and governing Church, having power of the keys in all points of discipline within themselves; They have intensively power of the keys in all points, and equal power, intensive [intensively] with greater synods and assemblies, because ordination of pastors by them, 1 Tim. 4:14, is as valid in the point of Church discipline as the decrees made in the great council convented at Jerusalem, Acts 15:21-22, etc. But provincial synods and national assemblies have greater power than the presbyteries extensive [extensively]; because they have power as a great body to exercise discipline that concerns the whole congregations of all the nation, which power is not in inferior elderships.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/samuel-rutherford.html">Samuel Rutherford</a></span><span class="wk"><span class="lbl">Work:</span> <cite>A Peaceable &amp; Temperate Plea for Paul’s Presbytery in Scotland</cite>, ... (London, 1642), ch. 13, pp. 188-99</span></figcaption>

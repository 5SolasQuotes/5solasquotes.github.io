<main class="wrap"><figure class="quote" id="q-363ccf782c" data-kw="">
<blockquote><p>Therefore, when we say that the proper power of outward baptism resides in being a seal, we mean two things: firstly, that it makes more certain the promised grace that the principal cause has conferred or is to confer, and secondly that it strengthens and increases that grace. But since that promise is not absolute but linked to the condition of faith and repentance, it follows that the grace is sealed only to those who believe and repent, and consequently do not use the signs in a unworthy manner, as the apostle says in 1 Corinthians 11:29. In this regard we grant that this sacrament–just like the other ones–is also exhibitive of the thing that is promised, because in the lawful and worthy use of this sacrament these things that are promised are through the Holy Spirit not merely offered to believers but they are in fact exhibited to and conferred upon them. For God is truthful in sealing his promises, and our sacraments are not supplements of a letter that kills, but of the life-giving Spirit.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/anthony-walaeus.html">Anthony Walaeus</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Synopsis of a Purer Theology</cite>, (Brill, 2020), vol. 3, Disputation 44, ‘On the Sacrament of Baptism’, sections 31-32, p. 155</span></figcaption>

<blockquote><p>30. But those in whom true faith is found are all and only those who are predestined to eternal life. For that faith falls to them from the decree of divine election; and therefore it is called by Paul, “the faith of God’s elect,” Tit. 1:1. Whence it happens that without it no one can be saved, nor does anyone have it who does not obtain salvation. For that assent which imitates true faith in some of the reprobate is temporary faith, about which we spoke above: and it must be distinguished from justifying and saving faith. 31. But as to what is often asked here, whether elect and saved infants also have faith, it is plain indeed that they cannot have actual faith; but nothing prohibits a certain habitual faith, or rather the seed and root of faith, from being infused in them. And certainly it cannot happen that God does not cleanse from every stain of original sin all the infants whom he admits into his heavenly kingdom, into which nothing polluted or defiled enters. Since therefore original sin in infants includes a certain seed of unbelief, just as of all vices, while God cleanses them, He undoubtedly takes away that innate unbelief, and so infuses the principle and a certain seed of faith. For God does not purge his own from vices except by infusing the contrary habits of virtues. 32. Moreover, whatever that may be, whether faith or the root of faith and disposition to faith which can be found in infants, it is beyond controversy that it must be attributed to God alone, and that the offices of man do not concur with it: nor can it be called into doubt by anyone: but Scripture also manifestly teaches that the same must be thought about the faith of adults, for it calls faith the gift of God, Eph. 2:8, “By grace you have been saved through faith, and that not of yourselves, it is the gift of God.” And to the Philippians the apostle says that it was freely given to them to believe in Christ, Phil. 1:29.</p></blockquote>

<main class="wrap"><figure class="quote" id="q-d8d0ccf381" data-kw="">
<blockquote><p>[L]et the name of Comber be identified with the establishment and support of some school in the south and west of Ireland; and with all respect to other denominations of the Church of Christ, I fear not to say to you, Presbyterianize all Ireland if you can, and you will render it happy; make Leinster, Connaught and Munster what your fathers made Ulster, and you will make Ireland loyal, industrious, wealthy and content; give to the people the freedom wherewith Jesus makes his people free, and you give true national greatness, you give what the statesman or politician has it not in his power to bestow.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/isaac-nelson.html">Isaac Nelson</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Belfast News-Letter</cite>, 7 June 1839.</span></figcaption>

</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-ae8af7d3b9" data-kw="">
<blockquote><p>A Church without government must be a Church without order and without power. Even a State, to be powerful and united, must be well governed. If there be government, there must be the rulers and the ruled. If there are no rulers, or if all are rulers, there is no government; and if there is no government, unity breaks up, compactness is gone, discipline is impossible, purity is hopeless.

The moment two or three are gathered together in the name of Jesus, government begins; and when the two or three are multiplied, then government develops itself, and the necessity for the control of law and for the recognition of some to carry out that law becomes indispensable. If all things in the Church are to be done decently and in order, law and administration must step in, otherwise every man will do what is right in his own eyes.

In the Church, as in the State, there have been in all centuries two extremes of rule — despotism and socialism. Did the Head of the Church mean either of these? Do we find, either in His own words or in those of His apostles, any intimation of these? He meant His Church to be governed. Has He anywhere indicated His purpose that it should be governed by one or governed by all?

Perhaps the ecclesiastical tendencies of our day do not favour the former so much as the latter, yet still it is needful that these two opposing governmental systems should be examined. It may be found that there is a more excellent way than either, a way which preserves all that is good in both, and yet exhibits something more perfect, more sufficient, and more scriptural than they.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/horatius-bonar.html">Horatius Bonar</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Government of the Kingdom of Christ. An Inquiry as to the Scriptural, Invincible, and Historical Position of Presbytery. A Prize Essay</cite>, (Edinburgh: Johnstone, Hunter, &amp; Co., 1872), pp 1-2.</span></figcaption>

</figure><figure class="quote" id="q-833dd0b898" data-kw="">
<blockquote><p>PATRONAGE is usually defined to be the exercise of a power of presentation to a Church, which power is held solely in virtue of some secular qualification, such as inheritance or purchase. … In a matter relating to the appointment of the office-bearers of the Church, our ultimate appeal must be “to the law and to the testimony.” Were it true, as some allege, that Scripture lays down no general principles or definite rule, for the guidance of the Church in the election of her office bearers, this matter would fall to be regulated by an enlightened regard to utility; but we trust to make it plain in the course of the following observations, that we are not left by Scripture altogether in the dark, in a matter which so nearly concerns the interests of the Church.

Amid much that is distressing and painful in the circumstances in which the Church of Scotland is now placed in its relations with the Civil Power, it is matter of sincere gratification that these very circumstances are forcing her office-bearers and members back upon first principles—constraining them to abandon all temporizing shifts and expedients, and to take their stand upon the broad and sure basis of the everlasting and unchangeable word of God.

It was a great step in advance towards right principles which the General Assembly made in 1834, when the old doctrine of Non-intrusion was asserted, and effective steps taken to have that principle carried into operation in every case of settlement. It was a still further and more gratifying advance in the same direction, when, five years thereafter, the Assembly took up the language, and resumed the tone of the ancient Assemblies of the Church, and declared the free and unfettered prerogatives which the Lord Jesus Christ, as King and Head of his Church, had conferred upon her.

It is impossible to attach too much importance to this declaration, whether we regard it merely in the light of a testimony in behalf of a great scriptural truth, or as the most healthful indication which could have been afforded, that the Church of Scotland, after a long and dreary period of defalcation, had rid herself of the notion, which lay upon her like an incubus, and paralysed her energies, that she was a mere civil corporation, existing for civil ends.

This idea, fostered under the reign of Moderatism, and forming indeed the very essence of it, had wrought most deadly mischief, not only as regarded the matter of settlement, in which the great thing to be considered was, not the “perfecting of the Saints,” but the following out of the will of the patron; but also as regarded the matter of preaching, in which the great thing to be considered was, not the winning of souls to Christ, but the rearing up of good citizens, on the basis of a cold and secular Morality.

One thing only remains, so far as regards the assertion of principles, to set the Church upon the platform of her ancient standards, and that is, to re-declare the indefeasible right of the members of the Church to elect their own office-bearers. This principle appears necessarily to flow from that of the spiritual independence of the Church, and it is practically one of the most important consequences which result from it.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/william-wilson.html">William Wilson</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Statement of the Scriptural Argument Against Patronage</cite>, (Edinburgh: John Johnstone, 1842), pp 1-2.</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/church-government-and-the-ministry/forms-of-government.html">Forms of Government</a></span></div>

— William Wilson, Statement of the Scriptural Argument Against Patronage, (Edinburgh: John Johnstone, 1842), pp 1-2.">Copy</button><a class="share" href="https://x.com/intent/post?text=%E2%80%9CPATRONAGE+is+usually+defined+to+be+the+exercise+of+a+power+of+presentation+to+a+Church%2C+which+power+is+held+solely+in+virtue+of+some+secular+qualification%2C+such+as+inheritance+or+purchase.+%E2%80%A6+In+a+matter+relating+to+the+appointment+of+the+office-bearers+of+the+Church%2C+our+ultimate+appeal+must+be+%E2%80%9Cto+the+law+and+to+the+testimony.%E2%80%9D+Were+it+true%2C+as+some+allege%2C+that+Scripture+lays+down+no+general+principles+or+definite+rule%2C+for+the+guidance+of+the+Church+in+the+election+of+her+office+bearers%2C+this+matter+would+fall+to+be+regulated+by+an+enlightened+regard+to+utility%3B+but+we+trust+to+make+it+plain+in+the+course+of+the+following+observations%2C+that+we+are+not+left+by+Scripture+altogether+in+the+dark%2C+in+a+matter+which+so+nearly+concerns+the+interests+of+the+Church.%0A%0AAmid+much+that+is+distressing+and+painful+in+the+circumstances+in+which+the+Church+of+Scotland+is+now+placed+in+its+relations+with+the+Civil+Power%2C+it+is+matter+of+sincere+gratification+that+these+very+circumstances+are+forcing+her+office-bearers+and+members+back+upon+first+principles%E2%80%94constraining+them+to+abandon+all+temporizing+shifts+and+expedients%2C+and+to+take+their+stand+upon+the+broad+and+sure+basis+of+the+everlasting+and+unchangeable+word+of+God.%0A%0AIt+was+a+great+step+in+advance+towards+right+principles+which+the+General+Assembly+made+in+1834%2C+when+the+old+doctrine+of+Non-intrusion+was+asserted%2C+and+effective+steps+taken+to+have+that+principle+carried+into+operation+in+every+case+of+settlement.+It+was+a+still+further+and+more+gratifying+advance+in+the+same+direction%2C+when%2C+five+years+thereafter%2C+the+Assembly+took+up+the+language%2C+and+resumed+the+tone+of+the+ancient+Assemblies+of+the+Church%2C+and+declared+the+free+and+unfettered+prerogatives+which+the+Lord+Jesus+Christ%2C+as+King+and+Head+of+his+Church%2C+had+conferred+upon+her.%0A%0AIt+is+impossible+to+attach+too+much+importance+to+this+declaration%2C+whether+we+regard+it+merely+in+the+light+of+a+testimony+in+behalf+of+a+great+scriptural+truth%2C+or+as+the+most+healthful+indication+which+could+have+been+afforded%2C+that+the+Church+of+Scotland%2C+after+a+long+and+dreary+period+of+defalcation%2C+had+rid+herself+of+the+notion%2C+which+lay+upon+her+like+an+incubus%2C+and+paralysed+her+energies%2C+that+she+was+a+mere+civil+corporation%2C+existing+for+civil+ends.%0A%0AThis+idea%2C+fostered+under+the+reign+of+Moderatism%2C+and+forming+indeed+the+very+essence+of+it%2C+had+wrought+most+deadly+mischief%2C+not+only+as+regarded+the+matter+of+settlement%2C+in+which+the+great+thing+to+be+considered+was%2C+not+the+%E2%80%9Cperfecting+of+the+Saints%2C%E2%80%9D+but+the+following+out+of+the+will+of+the+patron%3B+but+also+as+regarded+the+matter+of+preaching%2C+in+which+the+great+thing+to+be+considered+was%2C+not+the+winning+of+souls+to+Christ%2C+but+the+rearing+up+of+good+citizens%2C+on+the+basis+of+a+cold+and+secular+Morality.%0A%0AOne+thing+only+remains%2C+so+far+as+regards+the+assertion+of+principles%2C+to+set+the+Church+upon+the+platform+of+her+ancient+standards%2C+and+that+is%2C+to+re-declare+the+indefeasible+right+of+the+members+of+the+Church+to+elect+their+own+office-bearers.+This+principle+appears+necessarily+to+flow+from+that+of+the+spiritual+independence+of+the+Church%2C+and+it+is+practically+one+of+the+most+important+consequences+which+result+from+it.%E2%80%9D%0A%0A%E2%80%94+William+Wilson%2C+Statement+of+the+Scriptural+Argument+Against+Patronage%2C+%28Edinburgh%3A+John+Johnstone%2C+1842%29%2C+pp+1-2.&amp;url=https%3A%2F%2F5solasquotes.github.io%2Fquote%2F833dd0b898.html&amp;via=5Solas" target="_blank" rel="noopener">Share on X</a><a class="perma" href="../quote/833dd0b898.html">Permalink</a><a class="src" href="https://reformedcovenanter.wordpress.com/2020/07/10/william-wilson-on-the-church-of-scotlands-battle-against-patronage/" rel="noopener" target="_blank">Read it online · Reformed Covenanter</a></div>

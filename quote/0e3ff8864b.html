<main class="wrap"><figure class="quote" id="q-0e3ff8864b" data-kw="">
<blockquote><p>There be wide marches betwixt striving and disputing. ‘Why should we strive? For we are brethren,’ the sons of one father, the born citizens of one mother, Jerusalem. To dispute is not to contend; we strive as we are carnal, we dispute as we are men; we war from our lusts, we dispute from diversity of star-light and day-light; weakness is not wickedness.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/john-currie.html">John Currie</a></span><span class="wk"><span class="lbl">Work:</span> <cite>An Essay on Separation: or a Vindication of the Church of Scotland contra the Seceders</cite></span></figcaption>
<div class="meta"><span class="t"><a href="../topics/the-church/schism-and-separation.html">Schism and Separation</a></span></div>

</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-a19e0e1f64" data-kw="">
<blockquote><p>…yet has there been too much mischief done by these acts, to wit… the barring of hopeful young-men from trials, in order to public preaching, and of able and godly expectants from being called and tried, in order to their entrance in the ministry, because they had no freedom in their consciences to take upon them the bonds required, which we have already set down: for, this act, as it has kept sundry congregations from calling expectants of that judgment, because there was no probable way how they could be tried or admitted to the ministry; So have sundry expectants, being called, been thereby barred from proceeding to their trials…; and sundry hopeful young-men have been necessitated to remove from the presbyteries and provinces wherein they do live, before they could be admitted to give any proof of their gifts for preaching…</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/james-guthrie.html">James Guthrie</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Protesters no Subverters, and presbyterie no papacie; or, A vindication of the protesting brethren, and of the government of the kirk of Scotland from the aspersions unjustly cast upon them</cite>, … (1658), pp. 77-78</span></figcaption>

</figure><figure class="quote" id="q-6add7e7249" data-kw="">
<blockquote><p>Now as concerning the condition of the Church and work of God in that land, ye remember that although I shunned not, according to my poor measure, and as occasion offered, and necessity required, to show my mind of public matters, dangers and duties of the time, yet I used not very much to insist upon such things, as not being much inclined or able for disputing: And, having found by frequent experience, that so soon as any were gained to close indeed with Christ, and lay religion to heart in earnest, these generally, out of a native principle, became presently sound in the controversies of the times.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/john-currie.html">John Currie</a></span><span class="wk"><span class="lbl">Work:</span> <cite>An Essay on Separation: or a Vindication of the Church of Scotland contra the Seceders</cite></span></figcaption>

<blockquote><p>§2. But first I will lay together some propositions for decision of the controversy: How far we are bound to obey men’s precepts about religion, especially in case we doubt of the lawfulness of obeying them, and so cannot obey them in faith? §3. Briefly: 1. We must obey both magistrates and pastors in all things lawful which belong to their offices to command. 2. It belongs not to their office to make God a new worship; but to command the mode and circumstances of worship belongs to their office. For guiding them wherein, God has given them general rules. 3. We must not take the lawful commands of our governors to be unlawful. 4. If we do through weakness or perverseness take lawful things to be unlawful, that will not excuse us in our disobedience. Our error is our sin, and one sin will not excuse another sin. Even as on the other side, if we judge things unlawful to be lawful, that will not excuse us for our disobedience to God in obeying men. 5. As I have before showed, many things that are miscommanded must be obeyed. 6. As an erroneous judgment will not excuse us from obedience to our governors, so much less will a doubtfulness excuse us. 7. As such a doubting, erring judgment cannot obey in (plenary) faith, so much less can he disobey in faith. For it is a known command of God, that we obey them that have the rule over us: but they have no Word of God against the act of obedience now in question. It is their own erring judgment that entangles them in a necessity of sinning (till it be changed). 7. In doubtful cases, it is our duty to use God’s means for our information: and one means is to consult with our teachers and hear their words with teachableness and meekness. 8. If upon advising with them we remain in doubt about the lawfulness of some circumstance of order, if it be such as may be dispensed with, they should dispense with us: if it may not be dispensed with without a greater injury to the Church or cause of God than our dispensation will countervail, then is it our duty to obey our teachers notwithstanding such doubts: For it being their office to teach us, it must be our duty to believe them with a human faith, in cases where we have no evidences to the contrary: And the duty of obeying them being certain, and the sinfulness of the thing commanded being uncertain and unknown, and only suspected, we must go on the surer side. 9. Yet must we in great and doubtful cases, not take up with the suspected judgment of a single pastor, but apply ourselves to the unanimous pastors of other Churches. 10. Christians should not be over-busy in prying into the work of their governors, not too forward to suspect their determinations: But when they know that it is their ruler’s work to guide them by determining of due circumstances of worship, they should without causeless scruples readily obey, till they see just reason to stop them in their obedience; They must not go out of their own places to search into the actions of another man’s office to trouble themselves without any cause.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/richard-baxter.html">Richard Baxter</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Five Disputations on Church Government &amp; Worship (London, 1659) | ch. 15, ‘Reasons for Obedience in Lawfull things’</cite>, pp. 483-85</span></figcaption>

</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-05d57a4ae4" data-kw="">
<blockquote><p>In short, our Reformers [of the Scottish Church, specifically John Knox, c. 1560] maintained: That the doctrine of defensive arms was necessary: that passive obedience or non-resistance was sinful when people had means for resistance (Knox, History, pp. 389, 396, Append. p. 25, 107, Passim.) That Daniel and his fellows did not resist by the sword because God had not given them the power and the means (Ibid., p. 317) That the primitive Christians assisted their preachers, even against the rulers and magistrates, and suppressed idolatry wheresoever God gave them force (Ibid., p. 393). (d) They maintained that the Judicial Laws of Moses (though not adopted into the Christian system) in many considerable instances continued still obligatory; particularly that the laws punishing adultery, murder, idolatry with death, were binding; that in obedience to these laws, that sentence was to be executed not only on subjects, but on sovereigns (Ibid., pp. 391-393; Passim.) That whosoever executes God’s Law, on such criminals, is not only innocent, but in his duty…</p></blockquote>

<blockquote><p>IV. Now this law of God is divided in general into natural and positive. As the right of God is twofold (one natural, founded in the perfectly just and holy nature of God; the other positive, depending on the will of God alone in which He also shows his own liberty), so there is a positive law of God built on the free and positive right of God (with respect to which things are then good because God commands them). Hence God was free either not to give such a law or to institute otherwise (such as the law relating to food and the symbolical law given to Adam [Gen. 2:16-17] and the ceremonial laws of the Old Testament, in which there was no moral goodness or evil per se, but only from the command of God). There is another (natural) founded on the natural right of God, with regard to which things are not called just because they are commanded, but are commanded because they were just and good antecedently to the command of God (being founded on the very holiness and wisdom of God). And such is its nature that (the creation of man being supposed) it must have been given to him, since it prescribes to him indispensable duties to be performed by all, always and everywhere.</p></blockquote>

where" rel="noopener" target="_blank">Read it online · Reformed Books Online</a></div>

<blockquote><p>There are two sorts of laws whereby God requires the obedience of his rational creatures, which are commonly called moral and positive… Positive laws are taken to be such as have no reason for them in themselves – nothing of the matter of them is taken from the things themselves commanded – but do depend merely and solely on the sovereign will and pleasure of God. Such were the laws and institutions of the sacrifices of old; and such are those which concern the sacraments and other things of the like nature under the New Testament. Moral laws are such as have the reasons of them taken from the nature of the things themselves required in them; for they are good from their respect to the nature of God himself, and from that nature and order of all things which he hath placed in creation. So that this sort of laws is but declarative of the absolute goodness of what they do require; the other is constitutive of it, as unto some certain ends. Laws positive, as they are occasionally given, so they are esteemed alterable at pleasure. Being fixed by mere will and prerogative, without respect to any thing that should make them necessary antecedent to their giving, they may by the same authority at any time be taken away and abolished.</p></blockquote>

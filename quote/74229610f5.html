<main class="wrap"><figure class="quote" id="q-74229610f5" data-kw="">
<blockquote><p>The manner of teaching extends itself to public and private doctrines. By public doctrine the pastor either catechizes, that is to say, instructs them that be younglings in religion, or others which are grounded therein. To the younglings or ignorant sort he opens the principles of true religion. For catechesis, or the form of catechising, comprehends the grounds or principles of faith and Christian doctrine, to wit, the chief points of the covenant, the Ten Commandments, the Articles of Faith or Apostles’ Creed, the Lord’s Prayer, and a brief exposition of the sacraments.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/heinrich-bullinger.html">Heinrich Bullinger</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Fifty Godly &amp; Learned Sermons divided into Five Decades</cite>, … (London: 1577), 5th Decade, 4th Sermon, ‘Calling unto the Ministry of God’s Word,’, p. 907</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/the-church/creeds-confessions-and-councils.html">Creeds, Confessions and Councils</a></span></div>

</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-0fe3801e91" data-kw="">
<blockquote><p>I. Doctrine. The foundation whereupon our faith in Christ does stay, are the revelations sent of God to the godly, or the Church. For by this means were taught and instructed the shepherds, Simeon, Anna, Zacharias, Elizabeth and many other more inflamed with the Holy Ghost, which all confessed and testified that Jesus is the promised Messiah and Savior of our souls.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/andreas-hyperius.html">Andreas Hyperius</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Practice of Preaching</cite>, … (d. 1564; London: East, 1577), p. 86</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/the-church/creeds-confessions-and-councils.html">Creeds, Confessions and Councils</a></span></div>

</figure><figure class="quote" id="q-0d5a70fe58" data-kw="">
<blockquote><p>…We have the apostles for authors of our doctrine, says Tertullian (Prescription against Heresies). He says also, It lies not in man’s power to determine any thing (in matters of faith) of his own head. Quamuis sanctus sit aliquis post Apostolos, etc. Howsoever holy, or eloquent a man be, says Jerome in Psalm 86, yet coming after the apostles he deserves no authentical credit. The Lord declares in Scriptures. … The last foundation of Romish faith is the preaching of mass-priests and friars. Quomodo Christus eius(que) doctrina (says Stapleton): Christianae religionis fundamentum est, sic alii nunc a Christo missi, eorumque doctrina, praedicatio, determinatio, fundamenti apud me vim et locum habebunt. As Christ and his doctrine is the foundation of Christian religion: so others now sent of Christ, and their doctrine, preaching, and determination shall in my opinion have the force and place of a foundation, says he. (Praetat ante relect princip. doctrin.)</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/matthew-sutcliffe.html">Matthew Sutcliffe</a></span><span class="wk"><span class="lbl">Work:</span> <cite>A Full &amp; Round Answer to N.D., alias Robert Parsons</cite>, … the First [Book] contains a Defence of Queen Elizabeth’s most pious and happy government… (London: 1604), bk. 2, ch. 3, pp. 137-38</span></figcaption>

<blockquote><p>What do we? what are we about? is it a commendable work? is it agreeable to the Word of God? and suitable to our calling? is it of good report? and all circumstances considered expedient? If so, go on in God’s name and the Lord prosper your handy-works…</p></blockquote>

</figure><figure class="quote" id="q-d1fae8e9d1" data-kw="">
<blockquote><p>First, it is avowed by some that they have not subscribed simply, but with protestations and exceptions, though they be not recorded, which (say they) is not their fault… Others would justify themselves because (as they say) it is not affirmed by their subscription that all things in the Books of Common prayer and of ordaining bishops, priests, and deacons, be agreeable to the Word of God, but [it is] only said that those books contain nothing contrary to the Word of God… A third sort of subscribers would… that of two evils the less is to be chosen: And therefore some things are to be tolerated, rather than the Church should lose the benefit of their ministry… As is evident by these words of the preamble: That the Churches of the Queen’s Majesty’s dominions may be served with pastors of sound religion, Be it enacted, etc. Again, the statute requires subscriprion to the [39] Articles of Religion, and not to all, but such as only concern the confession of the true Christian faith, and the doctrine of the sacraments. Yea that the exception of some articles might be more manifest (and for no other cause) is this word ‘only’ inserted.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/william-bradshaw.html">William Bradshaw</a></span><span class="wk"><span class="lbl">Work:</span> <cite>A Trial of Subscription</cite>, … (1599), no page numbers</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/the-church/creeds-confessions-and-councils.html">Creeds, Confessions and Councils</a></span></div>

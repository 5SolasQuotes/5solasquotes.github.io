<main class="wrap"><figure class="quote" id="q-b7376c167a" data-kw="">
<blockquote><p>The man who believes in the peculiar doctrines, will readily bow to the peculiar demands of Christianity. When he is told to love God supremely, this may startle another; but it will not startle him to whom God has been revealed in peace, and in pardon, and in all the freeness of an offered reconciliation. When told to shut out the world from his heart, this may be impossible with him who has nothing to replace it – but not impossible with him, who has found in God a sure and a satisfying portion.

When told to withdraw his affections from the things that are beneath, this were laying an order of self-extinction upon the man, who knows not another quarter in the whole sphere of his contemplation, to which he could transfer them – but it were not grievous to him whose view has been opened up to the loveliness and glory of the things that are above, and can there find for every feeling of his soul, a most ample and delighted occupation. When told to look not to the things that are seen and temporal, this were blotting out the light of all that is visible from the prospect of him in whose eye there is a wall of partition between guilty nature and the joys of eternity – but he who believes that Christ hath broken down this wall, finds a gathering radiance upon his soul, as he looks onwards in faith to the things that are unseen and eternal.

Tell a man to be holy and how can he compass such a performance, when his alone fellowship with holiness is a fellowship of despair? It is the atonement of the cross reconciling the holiness of the lawgiver with- the safety of the offender, that hath opened the way for a sanctifying influence into the sinner’s heart; and he can take a kindred impression from the character of God now brought nigh, and now at peace with him. – Separate the demand from the doctrine; and you have either a system of righteousness that is impracticable, or a barren orthodoxy. Bring the demand and the doctrine together – and the true disciple of Christ is able to do the one, through the other strengthening him.

The motive is adequate to the movement; and the bidden obedience of the Gospel is not beyond the measure of his strength, just because the doctrine of the Gospel is not beyond the measure of his acceptance. The shield of faith; and the hope of salvation, and the Word of God, and the girdle of truth – these are the armour that he has put on; and with these the battle is won, and the eminence is reached, and the man stands on the vantage ground of a new field, and a new prospect. The effect is great, but the cause is equal to it – and stupendous as this moral resurrection to the precepts of Christianity undoubtedly is, there is an element of strength enough to give it being and continuance in the principles of Christianity.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/thomas-chalmers.html">Thomas Chalmers</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Expulsive Power of a New Affection</cite>, (London: Hatchard and Co., 1861), pp 15-17.</span></figcaption>

</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-59de8675aa" data-kw="">
<blockquote><p>This we owe to the good providence of God, who, I trust, will deliver us from greater evils. (Hear, hear.) I was just going to remark in regard to the extraordinary circumstances in which we have been recently placed. Generation after generation, the Church of Scotland his gloried in maintaining the sole Headship of the Lord Jesus Christ, and in being more freed than any other of the Reformed Churches from every leaven of Erastianism. …

The Church of Scotland, in the days that are past, has frequently been subjected to danger; but in all those cases her people, as now, have rallied nobly around her; and although tempest-tossed, the vessel has weathered the storm. … But should it be otherwise, and should the great Head of the Church see meet that a period of trial awaits us, we shall not even then be case into despair; and I trust that we shall be enabled to rejoice when to us it is given not only to believe in the name of the Lord Jesus Christ, but also to suffer for his sake …

Ladies and Gentlemen, I may be mistaken, but I conceive the effect of the struggle in which we are engaged must have a reach and consequence beyond the limits of our own land, and beyond the period in which we now live. I have ill read the records of the past if I do not perceive that we are now at an era that marks the progress and the lapse of ages; and that we are not come to the solution of the important problem, not whether there shall exist an Established Church – that may continue to exist – but whether there may exist a spiritual Church in the full enjoyment of all the liberties that Christ purchased for his people, and whether such a Church can exist in connexion with the civil power, so as to form an Establishment. This is the great question which I think is now to be resolved …</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/david-welsh.html">David Welsh</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Witness</cite>, 26 February 1840.</span></figcaption>

</figure><figure class="quote" id="q-f6e533dfc7" data-kw="">
<blockquote><p>I alleging, what was wrong in the administration of our laws, either in church or state, is more through the default of some of the administrators, than either to the laws now in being, or yet to the supreme magistrate: from which I see I cannot state my sufferings upon anything amiss, although they are still grievous; neither can I have peace to refuse obedience to the civil magistrate in all things accoding to the Word of God. This my protesting, and refusing to join with them, enraged them exceedingly against me; and as their scourge of tongues was grievously bent against others, so now was it against myself, in a most grievous, unjust and unreasonable manner, and very hypocritically gave it out far and near… Thus I left that party of the dissenters who now commonly go under the name of Mr. M’Millan’s people; for the Quakers, Gibb’s faction, the Harlaw’s faction, and episcopacy by bishops, I had never any thing to do with them in matters of religion, neither directly nor indirectly; yea, my soul abhors all their evil ways: but I lieved retired by myself; all which time the Lord pitied me, and restored me to some measure of communion with Himself. Praise, praise. Amen…</p></blockquote>

<blockquote><p>Hamilton seems to have felt that the tyranny of the times called for more positive action on the part of those who adhered to the [non-conforming, field-preaching] Presbyterian cause, and he is said to have tried, during the summer of 1678, to stir up some of the people in the west into an armed rising against the government [previously the battles had all been defensive]. Whether this allegation is well-founded cannot conclusively be proved… Feelings on the subject [of the Indulgence] ran high, and Cameron and Hamilton were accused of spreading dissension and disunity among the people and of causing disaffection towards ministers who did not share their radical opinions.</p></blockquote>

<main class="wrap"><figure class="quote" id="q-d0607efb97" data-kw="">
<blockquote><p>“I will be yours forever,” says Christ, “and my Spirit shall be yours forever, and my grace yours forever, and my glory yours forever, and my righteousness yours forever; all I am and all I have, shall be yours forever!” O what matchless love is this! Oh! what a Christ is this!</p></blockquote>

<div class="meta"><span class="t"><a href="../topics/union-with-christ/union-and-communion.html">Union and Communion</a> › <a href="../topics/union-with-christ/union-and-communion/communion-with-christ.html">Communion with Christ</a></span></div>

</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-e7011f9b00" data-kw="">
<blockquote><p>We are today accepted in the Beloved, today absolved from sin, today acquitted at the bar of God… We are now pardoned; even now are our sins put away; even now we stand in the sight of God accepted, as though we had never been guilty. “There is therefore now no condemnation to them which are in Christ Jesus.” There is not a sin in the Book of God, even now, against one of His people. Who dares to lay anything to their charge? There is neither speck, nor spot, nor wrinkle, nor any such thing remaining upon any one believer in the matter of justification in the sight of the Judge of all the earth.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/c-h-spurgeon.html">C. H. Spurgeon</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Morning and Evening</cite>, Morning, May 15</span></figcaption>

</figure><figure class="quote" id="q-33e3a0f80d" data-kw="Communion">
<blockquote><p>Christ hath never enough of the soul. He would have them more and more open to him. Our hearts are for Christ, who hath the heaven of heavens, and the soul of a believing Christian for himself to dwell in. He contents not himself to be in heaven alone, but he will have our hearts.</p></blockquote>

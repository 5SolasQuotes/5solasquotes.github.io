<blockquote><p>…let them who commend them [dances] to the Church, see where those sober and modest dances which they speak of can find any place: and to those that expound choreas ducere [to conduct dances], only of lascivious dances, we will in a form of speech commodious enough interpret these dances to be meant of all dancings whatsoever: otherwise St. Cyprian had not affirmed that David danced before God, unless any should think that the Blessed [Peter] Martyr (which never came into his mind) would brand the royal prophet with a mark of lascivious and obscene dancing. And if there be any that think that dancing be sober and modest, they are at their liberty for me to abound in their own sense: at least, with Octavius, that good defender of the Christian religion, and other lights of Reformed Christianity, it seems meet for me to repute them as obscene and evil pleasures. Lastly, let the patrons of those dances which they call sober…</p></blockquote>

</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-bd9b8b3b09" data-kw="">
<blockquote><p>Answer… It is blasphemy to seek this distinction of person and office in the King of kings, because by person in a mortal king, we understand a man that can sin. 1. I am not obliged to obey his [the king’s] personal commandment, except I were his domestic [servant], nor his unlawful personal commandments, because they are sinful. 2. It is false that you obey the king’s law because you obey the king; for then you say but this: ‘I obey the king because I obey the king.’ The truth is, obedience is not formally terminated on the person of the king. Obedience is relative to a precept, and it is men-service to obey a law, not because it is good and just, but upon this formal motive, because it is the will of a mortal man to command it. And reverence, love, fear, being acts of the affection, are not terminated on a law, but properly on the person of the judge; and they are modifications, or laudable qualifications of acts of obedience, not motives, not the formal reason why I obey, but the manner how I obey. And the apostle makes expressly fear of punishment a motive of obedience (Rom. 13:4), while he says, “He beareth not the sword in vain,” therefore be subject to the king; and this hinders not personal resistance to unjust commandments. … Answer. 1. To obey the king’s personal will when it is sinful (as we now suppose), against his legal will, is a sin and a disobedience to God and the king also, seeing the law is the king’s will as king; but to obey his legal will against his sinful personal will (as it must be sinful if contrary to a just law) is obedience to the king as king, and so obedience to God. 2. You take the king’s person to be himself, but you take quid pro quo [this for that]; for his ‘person’ here, you must not take physically for his suppost [agent] of soul and body, but morally: it is the king as a sinful man, doing his worst will against the law, which is his just and best will and the rule of the subjects. And the king’s personal will is so far just and to regulate the subjects insofar as it agrees with his legal will or his law, and this [personal] will can sin, and therefore may be crossed without breach of the Fifth Commandment; but his legal will cannot be crossed without disobedience both to God and the king. … Answer… We are to obey the king’s personal will when the thing commanded is not sin; but his subjects, as subjects, have little to do with his personal will in that notion. It concerns his domestic servant, and is the king’s will as he is the master of servants, not as he is king in relation to subjects; But we speak of the king’s personal will as repugnant to law and contrary to the king’s will as king, and so contrary to the Fifth Commandment; and this [personal will] is attended often not only with passion, but also with prejudice; and we owe no subjection to prejudice and passions, or to actions commanded by these disordered powers, because they are not from God, nor his ordinances, but from men and the flesh, and we owe no subjection to the flesh.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/samuel-rutherford.html">Samuel Rutherford</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Lex Rex… (1644; Edinburgh: Ogle, 1843), p. 150. Rutherford is responding to the royalist, Symmons.</cite></span></figcaption>

<blockquote><p>1. The root of the difference between the Old Nonconformists and the Conformists was that one sort thought they should stick to the mere Scripture rule and simplicity, and go far from all additions which were found invented or abused by the Papists, in doctrine, worship and government; and the other side thought that they should show more reverence to the customs of the ancient Church, and retain that which was not forbidden in the Scripture, which was introduced before the ripeness of the Papacy, or before the year 600 at least, and which was found lawful in the Roman Church, and common to them with the Greek, that we might not seem singular, odd and humorous, or to go further from the Papists than reason and necessity drave us. And the laity seemed nowhere so sensible of the difference as between the way of ceremony and unceremonious simplicity, and the way of our many short liturgic prayers and offices and the way of free-praying from the present sense and habits of the speaker; while pacificators thought both seasonably good.</p></blockquote>

<blockquote><p>This language of ‘authentic’ [WCF 1.8] arose on account of the Roman Catholic assertion that the Latin Vulgate was the authentic standard by which the church should be appealing as authoritative. This was codified by the papists at the Council of Trent… Therefore, the Reformers were required to state unequivocally that the authoritative or authentic Scripture was that in the original Greek and Hebrew Scriptures and not the Latin translation…. It is clear, then, that our own Confession is not using the term “authentic” void of meaning. It is a reference to that which has final authority in matters of religious controversy and to that which the church should appeal. But notice again, it is not a printed text that is the appeal. It is to the original languages of the Hebrew and Greek. Therefore, “authentic” in §1.8 does not have historical connection to a particular printed text… Like Turretin, Owen is speaking of the manuscript tradition of copies rather than a collated, edited, and printed edition of the Greek New Testament.</p></blockquote>

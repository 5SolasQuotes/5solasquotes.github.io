<main class="wrap"><figure class="quote" id="q-a90a40a18e" data-kw="">
<blockquote><p>It is one thing to deny total communion, and another to separate but secundum quid [according to that] for some act or part; And that is either a great and necessary part or some small or indifferent thing or ceremony.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/richard-baxter.html">Richard Baxter</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Nonconformists’ Plea for Peace, or an Account of their Judgment in Certain Things in which they are Misunderstood</cite>, … (London, 1679), sect. 6, pp. 38-39</span></figcaption>

</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-9c640a9d24" data-kw="">
<blockquote><p>…although the name of ‘priests’ belong not to the true ministers of the Gospel, because it has been generally in our language given to the popish sacrificers: and although there be sundry circumstances and ceremonies appointed by the law to be used at their ordination, which I cannot justify, and many of those good orders [are] neglected which the Scripture prescribes in this case: Yet is that office which the laws of our land call the office of the ‘priesthood,’ the very same in substance with the pastor’s office described in the Word: and the manner of outward calling unto that office which the Law allows is the very same in substance with that which is set down in the Word.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/arthur-hildersham.html">Arthur Hildersham</a></span><span class="wk"><span class="lbl">Work:</span> <cite>A Treatise of the Ministry of the Church of England, wherein is handled this Question: Whether it be to be separated from, or joined unto. Which is discussed in Two Letters, the one</cite>, [for joining] written for it [by Hildersham], the other against it [by Francis Johnson] (Low Countries, 1595), section 6, p. 79</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/worship/impurities-in-worship.html">Impurities in Worship</a></span></div>

0not%20to&amp;text=that%20which%20is%20set%20down%20in%20the%20Word" rel="noopener" target="_blank">Read it online · Reformed Books Online</a></div>
</figure><figure class="quote" id="q-b0ac55f2ac" data-kw="">
<blockquote><p>As the goodness of outward acts consists not in the acts themselves, so the acceptableness of them results not from the acts themselves but from the inward frame animating and quickning those acts, as blood and spirits running through the veins of a duty to make it a living service in the sight of God. Imperfections in worship hinder not God’s acceptation of it, if the heart spirited by grace be there to make it a sweet savour. The stench of burning flesh and fat in the legal sacrifices might render them noisome to the outward senses; but God smelt a sweet savour in them, as they respected Christ. When the heart and spirit are offered up to God, it may be a savory duty, though attended with unsavory imperfections.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/stephen-charnock.html">Stephen Charnock</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Several Discourses upon the Existence &amp; Attributes of God</cite>, (London, 1682) | ‘Of Spiritual Worship’, p. 169</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/worship/impurities-in-worship.html">Impurities in Worship</a></span></div>

</figure><figure class="quote" id="q-6e7dc48603" data-kw="">
<blockquote><p>That which is lawful for them to do… that is lawful for others to join with them in: for that which is no sin in the principal is none in the accessory, ceteris paribus [other things being equal]. And it cannot be simply unlawful to join in any action that is lawful, quatenus talis [so far as it is such].</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/william-ames.html">William Ames</a></span><span class="wk"><span class="lbl">Work:</span> <cite>‘Letter to John Robinson’</cite>, (1611) in The Works of John Robinson (London: Snow, 1851), 3.86</span></figcaption>

</figure><figure class="quote" id="q-e4fbc8bf29" data-kw="">
<blockquote><p>Though God in mercy can distinguish between his own and ours, and does not count the whole worship to be in vain where any degree of superstition is mixed (for then most zealous persons were undone), yet the superstitious part of worship is always in vain; And all the rest is made as vain where that is the predominant and denominating part. Thus overdoing is undoing, and thus the superstitious are (materially) righteous overmuch.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/richard-baxter.html">Richard Baxter</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Cure of Church Divisions</cite>, (London: Symmons, 1670), pt. 1 | Direction 58, p. 284</span></figcaption>

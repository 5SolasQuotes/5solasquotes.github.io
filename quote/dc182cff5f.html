<main class="wrap"><figure class="quote" id="q-dc182cff5f" data-kw="Keys Peter">
<blockquote><p>Secondly, That authority of the keys was not committed to Peter alone, but to the rest of the apostles also. For in this place he did not give the keys, but only promised that he would give them: but afterwards, when he actually gives them (Matthew 28:18, 19; John 20:21, 22, 23), he addresses all the apostles equally. Therefore, if the pope have the authority of interpreting the scriptures, because the keys were given to Peter, then also other bishops and ministers, who were successors of the rest of the apostles, received the same authority, because the keys were given to the rest of the apostles as well as to Peter. Thirdly, Augustine says in his 124th Tractate upon John, as in many other places, that “Peter signified the universal church,” when the keys were given to him: therefore this power of the keys was given not to the pope alone, but to the whole church.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/william-whitaker.html">William Whitaker</a></span><span class="wk"><span class="lbl">Work:</span> <cite>A Disputation on Holy Scripture</cite>, Question 5, ch. 5</span></figcaption>

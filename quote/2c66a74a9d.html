<blockquote><p>Now in this object of our love, proximus, our neighbour, there are two things to be 〈◊〉: 1. That we must beware we take not the sin of our neighbor, for our neighbour; for that which has interposed itself, and indeed is not de 〈◊〉, is sin, and 〈◊〉 proximus, a sinner. It is sure that, Omnis peccator, quatenus peccator, odio habendus est, ‘every sinner, as he is a sinner, is to be hated;’ and omnis 〈◊〉, quatenus 〈◊〉, diligendus, ‘every man as he is a man is to be beloved.’ Therefore, Sic homines diligendi, ut non errores diligamus, diligendi quia facti sunt, non quia fecerunt; ‘We are to love men so, as not to love their errors, and so to love them that are made, as that we love not that they do;’ so to love that which God made them, as not to love what by sin they made themselves. The reason is, because we have all one 〈◊〉, or end: we do therefore love one another, because we [Christians] shall be partakers of the same sovereign good of eternal happiness; and sin being a hindrance or obstacle to that end, how can we love that which hinders from that whereto we tend? He that loves iniquity, hates his own soul. And so we may say, he that loves the sin of his brother, hates his soul.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/lancelot-andrewes.html">Lancelot Andrewes</a></span><span class="wk"><span class="lbl">Work:</span> <cite>A Pattern of Catechistical Doctrine at Large; or a Learned &amp; Pious Exposition of the 10 Commandments</cite>, (d. 1626; 1675), 5th Commandment, p. 315 ff.</span></figcaption>

<blockquote><p>5. A peaceable spirit must have a high esteem of peace, and be zealous for it, and industrious to obtain it. Only against ungodliness and unpeaceableness must he be unpeaceable. Many have a good wish and a good word for peace, as hypocrites have for godliness, but this will not serve the turn. He that is not for us is against us, and he that gathers not with us, and he that gathers not with us, scatters abroad. The wicked and unpeaceable are zealous and industrious against peace; and those that are for peace are cold and indifferent for the greater part; and the zealous and industrious are so few that their voices cannot be heard in the contentious crowd. The unpeaceable are commonly the loudest and are actuated by a fervent zeal, which nature agrees with and Satan cherishes and excites: such will even as the Quakers, go up and down from one assembly to another, and in the market-places and other places of concourse, revile and rail, and reproach the ministry, and speak as earnestly as if they were the agents of Christ. And others are busy in secret, that will not incur the disgrace of such visible impiety. And when the enemies of unity and peace are many, and hot and loud, and the friends of unity and peace are either few or cold and dull and silent, what’s like to be the issue, but even the mischiefs which we feel? Forsooth, some dare not be fervent for peace, lest they be censured for their fervor to be unpeaceable: These show how much they love the praise of men and stick yet in the power of self. There’s need of zeal for peace, as well as for other parts of holiness. All the resistance that the enemies of Hell and earth can make, will be made against it: And will it be carried on against all by sleepy wishes and sitting still? I am sure this agrees not with the precepts of the Spirit. ‘Follow peace with all men,’ Heb. 12:14. If it be possible, as much as in you lies, live peaceably with all men, Rom. 12:18. It’s a sorry surgeon, or physician that will think it enough to wish well to their patient: the House of God will be neither built, nor repaired without zeal and industry and patience in the work. If men’s hearts were set upon the Church’s peace, and they did but feel the disjoiting of her members, the breaking of her bones, and the smart of her wounds, as sensibly as they feel the like in their own bodies; and if ministers and other Christians were as sensible of the evil of divisions as they are of drunkenness, and whoredom, and such other sins, and if we were all awakened to quench the flames of the Church, as earnestly as we would do the fire in our houses, and would preach for peace and pray for peace, and plead and labor and suffer for peace, then some good might be done on it, against the rage and multitude of dividers. … 8. Another hindrance of unity and peace is a carnal zeal in matters of religion, which is frequently mistaken for the true zeal of the saints. When men are confident that their opinions are the truth, and overvalue them as to the necessity (because they are their own, though they observe not the reason), they presently think they must be hot against all the gainsayers of their opinions; and herein they place the most, or at least too much, of their religion. There’s not one of many that has this zeal but thinks it is of God and is part of their holiness, when as it is often from the Devil and the flesh, even when the doctrine is true which they contend for. You may know it from true zeal by these following marks: 1. It is more for controversies and speculations than for practical holiness. 2. It is selfish and kindled by an overvaluing their own conceits or ways. 3. It is private and would promote a lower truth to the loss of a greater, or a doubtful point, to the loss of undoubted truth; or a single truth, to the loss or hindrance of the body of common truth; and it is hotter for a party than for the catholic Church, and will promote the interest of an opinion or purity to the wrong of the common interest of the Church. 4. It is blind and carries men to sinful means, as resisting authority, order or ordinances, or the like. 5. It is unmerciful and unpeaceable, and little sensible of the case of others or smart of the divided Church. Many are calling for fire from Heaven for the cause of Christ, that little know what spirit they are of, Lk. 9:55. O how true is this of many that think they excel in knowledge or zeal and are but defending the truth against erroneous adversaries. But ‘who is the wise man and endued with knowledge among you? let him show out of a good conversation, his works with meekness of wisdom: But if you have bitter envying and strife in your hearts, glory not, and lie not against the truth: This wisdom descends not from above, but is earthly, sensual, devilish: For where envying and strife is, there is confusion, and every evil work: But the wisdom that is from above, is first pure, then peaceable, gentle, and easy to be entreated, full of mercy and good fruits, without partiality, without hypocrisy; And the fruit of righteousness is sown in peace of them that make peace.’ Jam. 3:13 to the end. But of this I have formerly spoken at large in many sermons on these words of James. Dividing zeal is a grievous distracter of the Church’s peace.</p></blockquote>

terest of an opinion or purity to the wrong of the common interest of the Church. 4. It is blind and carries men to sinful means, as resisting authority, order or ordinances, or the like. 5. It is unmerciful and unpeaceable, and little sensible of the case of others or smart of the divided Church. Many are calling for fire from Heaven for the cause of Christ, that little know what spirit they are of, Lk. 9:55. O how true is this of many that think they excel in knowledge or zeal and are but defending the truth against erroneous adversaries. But ‘who is the wise man and endued with knowledge among you? let him show out of a good conversation, his works with meekness of wisdom: But if you have bitter envying and strife in your hearts, glory not, and lie not against the truth: This wisdom descends not from above, but is earthly, sensual, devilish: For where envying and strife is, there is confusion, and every evil work: But the wisdom that is from above, is first pure, then peaceable, gentle, and easy to be entreated, full of mercy and good fruits, without partiality, without hypocrisy; And the fruit of righteousness is sown in peace of them that make peace.’ Jam. 3:13 to the end. But of this I have formerly spoken at large in many sermons on these words of James. Dividing zeal is a grievous distracter of the Church’s peace.”

— Richard Baxter, The True Catholic, &amp; Catholic Church Described… (London: A.M., 1660), pp. 158-62 &amp; 184-87">Copy</button><a class="share" href="https://x.com/intent/post?text=%E2%80%9C5.+A+peaceable+spirit+must+have+a+high+esteem+of+peace%2C+and+be+zealous+for+it%2C+and+industrious+to+obtain+it.+Only+against+ungodliness+and+unpeaceableness+must+he+be+unpeaceable.+Many+have+a+good+wish+and+a+good+word+for+peace%2C+as+hypocrites+have+for+godliness%2C+but+this+will+not+serve+the+turn.+He+that+is+not+for+us+is+against+us%2C+and+he+that+gathers+not+with+us%2C+and+he+that+gathers+not+with+us%2C+scatters+abroad.+The+wicked+and+unpeaceable+are+zealous+and+industrious+against+peace%3B+and+those+that+are+for+peace+are+cold+and+indifferent+for+the+greater+part%3B+and+the+zealous+and+industrious+are+so+few+that+their+voices+cannot+be+heard+in+the+contentious+crowd.+The+unpeaceable+are+commonly+the+loudest+and+are+actuated+by+a+fervent+zeal%2C+which+nature+agrees+with+and+Satan+cherishes+and+excites%3A+such+will+even+as+the+Quakers%2C+go+up+and+down+from+one+assembly+to+another%2C+and+in+the+market-places+and+other+places+of+concourse%2C+revile+and+rail%2C+and+reproach+the+ministry%2C+and+speak+as+earnestly+as+if+they+were+the+agents+of+Christ.+And+others+are+busy+in+secret%2C+that+will+not+incur+the+disgrace+of+such+visible+impiety.+And+when+the+enemies+of+unity+and+peace+are+many%2C+and+hot+and+loud%2C+and+the+friends+of+unity+and+peace+are+either+few+or+cold+and+dull+and+silent%2C+what%E2%80%99s+like+to+be+the+issue%2C+but+even+the+mischiefs+which+we+feel%3F+Forsooth%2C+some+dare+not+be+fervent+for+peace%2C+lest+they+be+censured+for+their+fervor+to+be+unpeaceable%3A+These+show+how+much+they+love+the+praise+of+men+and+stick+yet+in+the+power+of+self.+There%E2%80%99s+need+of+zeal+for+peace%2C+as+well+as+for+other+parts+of+holiness.+All+the+resistance+that+the+enemies+of+Hell+and+earth+can+make%2C+will+be+made+against+it%3A+And+will+it+be+carried+on+against+all+by+sleepy+wishes+and+sitting+still%3F+I+am+sure+this+agrees+not+with+the+precepts+of+the+Spirit.+%E2%80%98Follow+peace+with+all+men%2C%E2%80%99+Heb.+12%3A14.+If+it+be+possible%2C+as+much+as+in+you+lies%2C+live+peaceably+with+all+men%2C+Rom.+12%3A18.+It%E2%80%99s+a+sorry+surgeon%2C+or+physician+that+will+think+it+enough+to+wish+well+to+their+patient%3A+the+House+of+God+will+be+neither+built%2C+nor+repaired+without+zeal+and+industry+and+patience+in+the+work.+If+men%E2%80%99s+hearts+were+set+upon+the+Church%E2%80%99s+peace%2C+and+they+did+but+feel+the+disjoiting+of+her+members%2C+the+breaking+of+her+bones%2C+and+the+smart+of+her+wounds%2C+as+sensibly+as+they+feel+the+like+in+their+own+bodies%3B+and+if+ministers+and+other+Christians+were+as+sensible+of+the+evil+of+divisions+as+they+are+of+drunkenness%2C+and+whoredom%2C+and+such+other+sins%2C+and+if+we+were+all+awakened+to+quench+the+flames+of+the+Church%2C+as+earnestly+as+we+would+do+the+fire+in+our+houses%2C+and+would+preach+for+peace+and+pray+for+peace%2C+and+plead+and+labor+and+suffer+for+peace%2C+then+some+good+might+be+done+on+it%2C+against+the+rage+and+multitude+of+dividers.+%E2%80%A6+8.+Another+hindrance+of+unity+and+peace+is+a+carnal+zeal+in+matters+of+religion%2C+which+is+frequently+mistaken+for+the+true+zeal+of+the+saints.+When+men+are+confident+that+their+opinions+are+the+truth%2C+and+overvalue+them+as+to+the+necessity+%28because+they+are+their+own%2C+though+they+observe+not+the+reason%29%2C+they+presently+think+they+must+be+hot+against+all+the+gainsayers+of+their+opinions%3B+and+herein+they+place+the+most%2C+or+at+least+too+much%2C+of+their+religion.+There%E2%80%99s+not+one+of+many+that+has+this+zeal+but+thinks+it+is+of+God+and+is+part+of+their+holiness%2C+when+as+it+is+often+from+the+Devil+and+the+flesh%2C+even+when+the+doctrine+is+true+which+they+contend+for.+You+may+know+it+from+true+zeal+by+these+following+marks%3A+1.+It+is+more+for+controversies+and+speculations+than+for+practical+holiness.+2.+It+is+selfish+and+kindled+by+an+overvaluing+their+own+conceits+or+ways.+3.+It+is+private+and+would+promote+a+lower+truth+to+the+loss+of+a+greater%2C+or+a+doubtful+point%2C+to+the+loss+of+undoubted+truth%3B+or+a+single+truth%2C+to+the+loss+or+hindrance+of+the+body+of+common+truth%3B+and+it+is+hotter+for+a+party+than+for+the+catholic+Church%2C+and+will+promote+the+interest+of+an+opinion+or+purity+to+the+wrong+of+the+common+interest+of+the+Church.+4.+It+is+blind+and+carries+men+to+sinful+means%2C+as+resisting+authority%2C+order+or+ordinances%2C+or+the+like.+5.+It+is+unmerciful+and+unpeaceable%2C+and+little+sensible+of+the+case+of+others+or+smart+of+the+divided+Church.+Many+are+calling+for+fire+from+Heaven+for+the+cause+of+Christ%2C+that+little+know+what+spirit+they+are+of%2C+Lk.+9%3A55.+O+how+true+is+this+of+many+that+think+they+excel+in+knowledge+or+zeal+and+are+but+defending+the+truth+against+erroneous+adversaries.+But+%E2%80%98who+is+the+wise+man+and+endued+with+knowledge+among+you%3F+let+him+show+out+of+a+good+conversation%2C+his+works+with+meekness+of+wisdom%3A+But+if+you+have+bitter+envying+and+strife+in+your+hearts%2C+glory+not%2C+and+lie+not+against+the+truth%3A+This+wisdom+descends+not+from+above%2C+but+is+earthly%2C+sensual%2C+devilish%3A+For+where+envying+and+strife+is%2C+there+is+confusion%2C+and+every+evil+work%3A+But+the+wisdom+that+is+from+above%2C+is+first+pure%2C+then+peaceable%2C+gentle%2C+and+easy+to+be+entreated%2C+full+of+mercy+and+good+fruits%2C+without+partiality%2C+without+hypocrisy%3B+And+the+fruit+of+righteousness+is+sown+in+peace+of+them+that+make+peace.%E2%80%99+Jam.+3%3A13+to+the+end.+But+of+this+I+have+formerly+spoken+at+large+in+many+sermons+on+these+words+of+James.+Dividing+zeal+is+a+grievous+distracter+of+the+Church%E2%80%99s+peace.%E2%80%9D%0A%0A%E2%80%94+Richard+Baxter%2C+The+True+Catholic%2C+%26+Catholic+Church+Described%E2%80%A6+%28London%3A+A.M.%2C+1660%29%2C+pp.+158-62+%26+184-87&amp;url=https%3A%2F%2F5solasquotes.github.io%2Fquote%2F6f64231e22.htm <blockquote><p>We do observe beautiful things through our senses, but the property by which they are beautiful is not perceivable through the senses. Animals have perceptions and representations of beautiful things, but they do not know the beautiful. They know only the useful and the pleasant. For that reason, the perception and recognition of the beautiful, also in sensory things, belongs to the higher faculty of knowing, to reason… Beauty is something that the beholding of which delights a person. Something is good insofar as it, when it is recognized by us, is desirable to our will. But beauty is what stimulates not our desire in a narrow sense, but our pleasure.</p></blockquote>

<blockquote><p>To you now therefore young men, I speak that be christened. Your parents whether they be alive or dead, brought you of a good and a christen mind to be christened, that ye might be dead from this world and sin. Remember wherefore God did call you to that life not that you should live here and heap up riches in this world, but that you should inherit the kingdom of heaven. The which kingdom shall be given only to them that fear God, &amp; works righteousness, if we live wickedly and continue in sins, so as the fashion of young men and maids is to doo, perpetual damnation and fire everlasting shall follow, for God is a just judge.

Again if we will walk in the commandments of the Lord we shall find joy and life everlasting, in heaven with the Angels and all godly saints. But if you will not cease from your sins &amp; wickedness but still remain and wallow in your naughtiness, look for nothing else but everlasting fire with the devil. You young persons you be bound to be obedient to your Parents in all things save only such as pertains to God and your soul ward, in all other matters if you live not obedient to them, ye have no excuse before God the first and principal honour must be to God, the next after to our parents what profit is it, if thy parents do tender the never so much, make thee their heir of all they have, and pamper the up with all manner of delicates. And though to lose the favour of God, with out the which, there is no health no quietness, even as though a man for one little peace of land full of wides and briers, should for sake all the whole riches and treasure of the world.

And at length the Lord shall also find these out when he shall judge the world. All ought for the most part follow the common sort of people having no difference betwixt good and bad, and other not knowing things spiritual, or else not regarding them, first look ye be obedient to the word of God, and harken to it daily and diligently. And if your parents do grudge therewith or be offended, do you rather fear and regard your heavenly father which hath both power of body &amp; soul, than your fleshly parents which have no power over you but only inwardly things which is rather then to be esteemed, God which is almighty &amp; which hath promised here, or your parents here which give you but earthly things and such as be transitory &amp; casual to every blast of fortune, Truly God I know undoubted some parents which do all they can that there children, should not hear the word of God, O fools and perverse people, unworthy to be named christen men.

Man must needs here in this world have some god to serve, other the God of heaven or else the devil the great adversary of mankind, it must needs follow, for so saith Christ that no man can serve two lords at once. They which will not serve God, do serve the devil, &amp; be all the ministers of the devil which do not lead a Christian life, And for this cause christen men’s children whom they be christened be told to renounce all the works of the devil, and so they promise hereafter if the live, to lead a christian life to follow what so ever Christ commandeth to eschew what so ever God forbiddeth. And this vow pleaseth god right well. Perjured and forsworn you be if ye break your vow, say not now. I made no promise at my baptism.

Thy parents &amp; thy godfathers promised in thy be half, whom also here I charge and warn, that this vow be performed and discharged. It hath been taken for an high matter of godliness if a young man had vowed himself into some monastery there to remain in service of God &amp; perpetual poverty. but unless they had been enticed in with promises and fair flattery words, they would never have consented to that wicked madness, to bind them selves in abbeys, whereas was nothing less than the service of god exercised.</p></blockquote>

<blockquote><p>Undoubtedly ζητήσεις μωραὶ καὶ ἀπαίδευτοι, foolish questions as well as those that are ignorant or unlearned, greatly block the path to piety. The former concern matters that accomplish nothing for piety. The latter arise from ignorance of the doctrine of righteousness, arguments against the faith, or even το‹ς ἅ μὴ ἑωράκασιν ἐμβατεύουσιν (from those who take their stand) on what they have not seen, who have neither seen nor heard anything in the Word of God, but who habitually appear and rear up with profane feet. Therefore, κενοφωνίαι and λογομαχίαι, foolish talk and quarrels about words, greatly hinder edification. Indeed, into what sordid conditions men will fall, who understand neither Scripture nor its substance! With all their might they furnish obscure, new, erratic, and suspect ideas as ends for religion, reduce the faith to tragedy, or transform the words of God into dross as amid a fire, thereby weakening and emptying them.

Contrarily, those things necessary for piety include the thorough examination of the Word of God, comparison of spiritual matters with spiritual matters, demonstration of the truth that accords with piety, conscience, the foundation of religion and the ἀναλογίας τῆς πίστεως (analogy of faith)—the harmony and conformity of all that must be believed from the uniform witness of God through σύνεσιν (conscience) and ἐπίστασιν (care). Also necessary for piety is the serious examination and proper consideration of the weight of God’s Word, as well as the disciplined and careful comparison of the product of all these practices. The end of all this is to subject the mind to the divine witness and the ἀποδείξιν τοῦ Πνεύματος, demonstration of the Spirit.

The devil very much hates this greatest means of increasing and strengthening true religion and destroying wickedness. Therefore, he corrupts the minds of men, so that they do not give heed to sound doctrine and the force of Scripture. Although these men have the μόρφωσιν (form) and precise outline of piety, they deny it, with both παραδιατριβὰς (idle occupation) and leisure spent for gain. Instead, they pursue ἀντιθέσεις ψευδωνύμου γνώσεως, contradictions falsely called knowledge, preferring this account to the opinion of the πολυμαθείας (very learned), experience, and common sense. Full of zeal, these men multiply their wickedness in numerous schools and seminaries.

In contrast, when Scripture is taken as the standard, there is nothing that is a greater threat, is more insidious, opposes, and tears down ἐπισυναγωγα‹ς, congregations, more than τῶν σχολαζόντων τῇ μαθήσιν, those who lack devotion to the sacred truth. After that danger is the one in which students, in the face of the trials of this life, only have knowledge of the truth as it suits them to listen to or talk about it. These follies, which are inappropriate to those who are and are called brothers, must cause harm.

For this reason, those who have been appointed to the sacred ministry to shepherd the flocks by the consensus and recommendation of the church and called by the authority of the elders must devote themselves with more anxious care so that they are found diligent and active not only in the explanation and presentation of the main points of doctrine but also in discussions about the mystery of piety according to its revelation in the Scriptures, together with the refutation of errors and restraint of corruptions, fruitless questions, and unhelpful assertions about the Word of God.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/johannes-cocceius.html">Johannes Cocceius</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Summa Doctrinæ de Fœdere et Testamento Dei: The Doctrine of the Covenant and Testament of God</cite>, trans. Casey Carmichael (1660; Grand Rapids MI: Reformation Heritage Books, 2016), preface to the reader, pp 1-2.</span></figcaption>

The devil very much hates this greatest means of increasing and strengthening true religion and destroying wickedness. Therefore, he corrupts the minds of men, so that they do not give heed to sound doctrine and the force of Scripture. Although these men have the μόρφωσιν (form) and precise outline of piety, they deny it, with both παραδιατριβὰς (idle occupation) and leisure spent for gain. Instead, they pursue ἀντιθέσεις ψευδωνύμου γνώσεως, contradictions falsely called knowledge, preferring this account to the opinion of the πολυμαθείας (very learned), experience, and common sense. Full of zeal, these men multiply their wickedness in numerous schools and seminaries.

In contrast, when Scripture is taken as the standard, there is nothing that is a greater threat, is more insidious, opposes, and tears down ἐπισυναγωγα‹ς, congregations, more than τῶν σχολαζόντων τῇ μαθήσιν, those who lack devotion to the sacred truth. After that danger is the one in which students, in the face of the trials of this life, only have knowledge of the truth as it suits them to listen to or talk about it. These follies, which are inappropriate to those who are and are called brothers, must cause harm.

For this reason, those who have been appointed to the sacred ministry to shepherd the flocks by the consensus and recommendation of the church and called by the authority of the elders must devote themselves with more anxious care so that they are found diligent and active not only in the explanation and presentation of the main points of doctrine but also in discussions about the mystery of piety according to its revelation in the Scriptures, together with the refutation of errors and restraint of corruptions, fruitless questions, and unhelpful assertions about the Word of God.”

— Johannes Cocceius, Summa Doctrinæ de Fœdere et Testamento Dei: The Doctrine of the Covenant and Testament of God, trans. Casey Carmichael (1660; Grand Rapids MI: Reformation Heritage Books, 2016), preface to the reader, pp 1-2.">Copy</button><a class="share" href="https://x.com/intent/post?text=%E2%80%9CUndoubtedly+%CE%B6%CE%B7%CF%84%CE%AE%CF%83%CE%B5%CE%B9%CF%82+%CE%BC%CF%89%CF%81%CE%B1%E1%BD%B6+%CE%BA%CE%B1%E1%BD%B6+%E1%BC%80%CF%80%CE%B1%E1%BD%B7%CE%B4%CE%B5%CF%85%CF%84%CE%BF%CE%B9%2C+foolish+questions+as+well+as+those+that+are+ignorant+or+unlearned%2C+greatly+block+the+path+to+piety.+The+former+concern+matters+that+accomplish+nothing+for+piety.+The+latter+arise+from+ignorance+of+the+doctrine+of+righteousness%2C+arguments+against+the+faith%2C+or+even+%CF%84%CE%BF%E2%80%B9%CF%82+%E1%BC%85+%CE%BC%E1%BD%B4+%E1%BC%91%CF%89%CF%81%CE%AC%CE%BA%CE%B1%CF%83%CE%B9%CE%BD+%E1%BC%90%CE%BC%CE%B2%CE%B1%CF%84%CE%B5%E1%BD%BB%CE%BF%CF%85%CF%83%CE%B9%CE%BD+%28from+those+who+take+their+stand%29+on+what+they+have+not+seen%2C+who+have+neither+seen+nor+heard+anything+in+the+Word+of+God%2C+but+who+habitually+appear+and+rear+up+with+profane+feet.+Therefore%2C+%CE%BA%CE%B5%CE%BD%CE%BF%CF%86%CF%89%CE%BD%CE%AF%CE%B1%CE%B9+and+%CE%BB%CE%BF%CE%B3%CE%BF%CE%BC%CE%B1%CF%87%CE%AF%CE%B1%CE%B9%2C+foolish+talk+and+quarrels+about+words%2C+greatly+hinder+edification.+Indeed%2C+into+what+sordid+conditions+men+will+fall%2C+who+understand+neither+Scripture+nor+its+substance%21+With+all+their+might+they+furnish+obscure%2C+new%2C+erratic%2C+and+suspect+ideas+as+ends+for+religion%2C+reduce+the+faith+to+tragedy%2C+or+transform+the+words+of+God+into+dross+as+amid+a+fire%2C+thereby+weakening+and+emptying+them.%0A%0AContrarily%2C+those+things+necessary+for+piety+include+the+thorough+examination+of+the+Word+of+God%2C+comparison+of+spiritual+matters+with+spiritual+matters%2C+demonstration+of+the+truth+that+accords+with+piety%2C+conscience%2C+the+foundation+of+religion+and+the+%E1%BC%80%CE%BD%CE%B1%CE%BB%CE%BF%CE%B3%E1%BD%B7%CE%B1%CF%82+%CF%84%E1%BF%86%CF%82+%CF%80%E1%BD%B7%CF%83%CF%84%CE%B5%CF%89%CF%82+%28analogy+of+faith%29%E2%80%94the+harmony+and+conformity+of+all+that+must+be+believed+from+the+uniform+witness+of+God+through+%CF%83%E1%BD%BB%CE%BD%CE%B5%CF%83%CE%B9%CE%BD+%28conscience%29+and+%E1%BC%90%CF%80%E1%BD%B7%CF%83%CF%84%CE%B1%CF%83%CE%B9%CE%BD+%28care%29.+Also+necessary+for+piety+is+the+serious+examination+and+proper+consideration+of+the+weight+of+God%E2%80%99s+Word%2C+as+well+as+the+disciplined+and+careful+comparison+of+the+product+of+all+these+practices.+The+end+of+all+this+is+to+subject+the+mind+to+the+divine+witness+and+the+%E1%BC%80%CF%80%CE%BF%CE%B4%CE%B5%E1%BD%B7%CE%BE%CE%B9%CE%BD+%CF%84%CE%BF%E1%BF%A6+%CE%A0%CE%BD%CE%B5%E1%BD%BB%CE%BC%CE%B1%CF%84%CE%BF%CF%82%2C+demonstration+of+the+Spirit.%0A%0AThe+devil+very+much+hates+this+greatest+means+of+increasing+and+strengthening+true+religion+and+destroying+wickedness.+Therefore%2C+he+corrupts+the+minds+of+men%2C+so+that+they+do+not+give+heed+to+sound+doctrine+and+the+force+of+Scripture.+Although+these+men+have+the+%CE%BC%E1%BD%B9%CF%81%CF%86%CF%89%CF%83%CE%B9%CE%BD+%28form%29+and+precise+outline+of+piety%2C+they+deny+it%2C+with+both+%CF%80%CE%B1%CF%81%CE%B1%CE%B4%CE%B9%CE%B1%CF%84%CF%81%CE%B9%CE%B2%E1%BD%B0%CF%82+%28idle+occupation%29+and+leisure+spent+for+gain.+Instead%2C+they+pursue+%E1%BC%80%CE%BD%CF%84%CE%B9%CE%B8%E1%BD%B3%CF%83%CE%B5%CE%B9%CF%82+%CF%88%CE%B5%CF%85%CE%B4%CF%89%CE%BD%CF%8D%CE%BC%CE%BF%CF%85+%CE%B3%CE%BD%CF%8E%CF%83%CE%B5%CF%89%CF%82%2C+contradictions+falsely+called+knowledge%2C+preferring+this+account+to+the+opinion+of+the+%CF%80%CE%BF%CE%BB%CF%85%CE%BC%CE%B1%CE%B8%CE%B5%E1%BD%B7%CE%B1%CF%82+%28very+learned%29%2C+experience%2C+and+common+sense.+Full+of+zeal%2C+these+men+multiply+their+wickedness+in+numerous+schools+and+seminaries.%0A%0AIn+contrast%2C+when+Scripture+is+taken+as+the+standard%2C+there+is+nothing+that+is+a+greater+threat%2C+is+more+insidious%2C+opposes%2C+and+tears+down+%E1%BC%90%

<blockquote><p>Surely it is the voice of the glorious Trinity that calls it “my holy day;” God the Father by creation, God the Son by redemption, and God the Holy Ghost by sanctification, sending down a rich and plentiful effusion of gifts and graces upon the apostles, for the enabling them to go forth and convert the Gentiles, by the preaching of the gospel. To deny God his own right is sacrilege and atheism.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/thomas-case.html">Thomas Case</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Sermon VI. Of Sabbath Sanctification in Puritan Sermons 1659-1689: Being the Morning Exercises at Cripplegate, St. Giles in the Fields and in Southwark</cite></span></figcaption>

</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-85c0a211aa" data-kw="">
<blockquote><p>I beseech you therefore, brethren, by the mercies of God, that ye present your bodies a living sacrifice, holy, acceptable unto God, which is your reasonable service. (Romans 12:1)

Hitherto the apostle hath discoursed of matters of faith; in this and the following chapters he sets down precepts of holy life. By the mercies of God: he useth the word in the plural number, to amplify and set forth the manifold mercies of God, in election, justification, adoption, &amp;c.: … Seeing you Gentiles have received so many and so great mercies from God; seeing he hath preferred you to his ancient people the Jews, and hath chosen and called you, when he hath rejected them; as you value these mercies, let the consideration of them engage you to all manner of holiness and new obedience.

That ye present; that you give, dedicate, and offer up, as spiritual priests. Your bodies; yourselves, or, your whole man; a part is put for the whole; the body is named, because it is the soul’s instrument in the service of God. A living sacrifice; the sacrifices of old were presented alive to God, and their blood was shed at the feet of the altar: a beast that died of itself, or was torn by wild beasts, was not so much as to be eaten, Exodus 22:31 Leviticus 22:8. Conformable hereunto, God will have us offer up ourselves a living sacrifice; i.e. we must be quickened and alive to God, and not dead in sins and trespasses. Holy; as the sacrifices under the law were to be without blemish or defect, Exodus 12:5 Leviticus 1:10 Deut. 15:21. Acceptable unto God; or, well pleasing unto God. So were the appointed sacrifices under the law, Leviticus 1:9; so was the sacrifice of Christ the Lamb of God, Ephesians 5:2; and so are all spiritual sacrifices under the gospel, Philippians 4:18 Hebrews 13:16.

Which is your reasonable service; or, which is agreeable to reason; nothing is more reasonable, than that you should devote yourselves to God in this manner. Some think this is added, to show a difference between the sacrifice here required, and that of the Jews, which was of unreasonable beasts. Others, by reasonable service, understand spiritual service, and expound this place by 1 Peter 2:5, where you read of spiritual sacrifices acceptable to God by Jesus Christ. Others think, that by reasonable you must understand such service as is according to the word of God; and this suits best with the Greek phrase in the text, λογικὴν λατρείαν. The same word is used, 1 Peter 2:2, and there it is rendered the milk of the word, and not reasonable milk. And so the service or worship here spoken of is opposed to that will worship, of which you read in Colossians 2:23.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/matthew-poole.html">Matthew Poole</a></span><span class="wk"><span class="lbl">Work:</span> <cite>A Commentary on the Holy Bible</cite>, (1685; London: Banner of Truth, 1963), 3: 521.</span></figcaption>

</figure><figure class="quote" id="q-38c0a45750" data-kw="">
<blockquote><p>2. Though it be not simply unlawful to express in painting the visible shapes that were showed in vision to the prophets, if it be only for use and signification of the history, or if there be any other commendable use: yet to make those shapes for any use of religion, or service of God, is abominable idolatry. Fulke, ibid.: Epiphanius saw in a Church at Anablatha, an image painted in a table, as it had been of Christ or a saint; he took it down and cut it in pieces: affirming that it was contrary to the Scripture for any image of a man to hang in the Church of Christ. The Elibertine Council, Canon 36 decreed that no pictures should be made in Churches. If no pictures, much less carved images, which are a more strong provocation to idolatry. Augustine renders a reason why it is dangerous to have images in Churches, where there is yea but the least fear of superstition: Quis orat intuens simulachrum, qui non sic afficitur, vt ab eo se exaudiri putet, nec ab eo sibi praestari, quod desideret, putet? Who (sayth he) prayeth beholding an image, and is not so affected as though he were heard of it, and hopeth not to have that performed by it which he desireth? Ps. 113.</p></blockquote>

<blockquote><p>Furthermore, for Christ, our Lord and very God, though he have taken on him the nature of us men, yet, notwithstanding, there ought no image to be erected. For he did not become man to that intent; but he drew up his humanity into heaven, and therewithal gave us a charge, that, so often as we pray, we should lift up the eyes of our mind and bodies into heaven above.

Moreover, being once ascended, he sent his Spirit instead of himself unto the church, wherein he hath a spiritual kingdom, and needeth not any bodily or corruptible things. For he commanded that, if we would bestow any thing on him or for his sake, we should bestow it on the poor, and not on his picture or image. And now since, without all controversy, our Christ is the very true God, and that the very true God doth forbid to hallow to him any likeness of man, that is, to represent God in the shape of a man; it followeth consequently, that to Christ no image is to be dedicated, because he is the true and very God and life everlasting.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/heinrich-bullinger.html">Heinrich Bullinger</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Fifty Godly and Learned Sermons Divided into the Five Decades containing the Chief and Principal Points of Christian Religion</cite>, ed. Thomas Harding (1849-52 Parker edn; 4 vols, Grand Rapids MI: Reformation Heritage Boos, 2004), 1: 230-31.</span></figcaption>

<div class="actions"><button class="copy" data-copy="“Furthermore, for Christ, our Lord and very God, though he have taken on him the nature of us men, yet, notwithstanding, there ought no image to be erected. For he did not become man to that intent; but he drew up his humanity into heaven, and therewithal gave us a charge, that, so often as we pray, we should lift up the eyes of our mind and bodies into heaven above.

Moreover, being once ascended, he sent his Spirit instead of himself unto the church, wherein he hath a spiritual kingdom, and needeth not any bodily or corruptible things. For he commanded that, if we would bestow any thing on him or for his sake, we should bestow it on the poor, and not on his picture or image. And now since, without all controversy, our Christ is the very true God, and that the very true God doth forbid to hallow to him any likeness of man, that is, to represent God in the shape of a man; it followeth consequently, that to Christ no image is to be dedicated, because he is the true and very God and life everlasting.”

— Heinrich Bullinger, Fifty Godly and Learned Sermons Divided into the Five Decades containing the Chief and Principal Points of Christian Religion, ed. Thomas Harding (1849-52 Parker edn; 4 vols, Grand Rapids MI: Reformation Heritage Boos, 2004), 1: 230-31.">Copy</button><a class="share" href="https://x.com/intent/post?text=%E2%80%9CFurthermore%2C+for+Christ%2C+our+Lord+and+very+God%2C+though+he+have+taken+on+him+the+nature+of+us+men%2C+yet%2C+notwithstanding%2C+there+ought+no+image+to+be+erected.+For+he+did+not+become+man+to+that+intent%3B+but+he+drew+up+his+humanity+into+heaven%2C+and+therewithal+gave+us+a+charge%2C+that%2C+so+often+as+we+pray%2C+we+should+lift+up+the+eyes+of+our+mind+and+bodies+into+heaven+above.%0A%0AMoreover%2C+being+once+ascended%2C+he+sent+his+Spirit+instead+of+himself+unto+the+church%2C+wherein+he+hath+a+spiritual+kingdom%2C+and+needeth+not+any+bodily+or+corruptible+things.+For+he+commanded+that%2C+if+we+would+bestow+any+thing+on+him+or+for+his+sake%2C+we+should+bestow+it+on+the+poor%2C+and+not+on+his+picture+or+image.+And+now+since%2C+without+all+controversy%2C+our+Christ+is+the+very+true+God%2C+and+that+the+very+true+God+doth+forbid+to+hallow+to+him+any+likeness+of+man%2C+that+is%2C+to+represent+God+in+the+shape+of+a+man%3B+it+followeth+consequently%2C+that+to+Christ+no+image+is+to+be+dedicated%2C+because+he+is+the+true+and+very+God+and+life+everlasting.%E2%80%9D%0A%0A%E2%80%94+Heinrich+Bullinger%2C+Fifty+Godly+and+Learned+Sermons+Divided+into+the+Five+Decades+containing+the+Chief+and+Principal+Points+of+Christian+Religion%2C+ed.+Thomas+Harding+%281849-52+Parker+edn%3B+4+vols%2C+Grand+Rapids+MI%3A+Reformation+Heritage+Boos%2C+2004%29%2C+1%3A+230-31.&amp;url=https%3A%2F%2F5solasquotes.github.io%2Fquote%2Ffba2aca988.html&amp;via=5Solas" target="_blank" rel="noopener">Share on X</a><a class="perma" href="../quote/fba2aca988.html">Permalink</a><a class="src" href="https://reformedcovenanter.wordpress.com/2012/12/01/henry-bullinger-on-images-o

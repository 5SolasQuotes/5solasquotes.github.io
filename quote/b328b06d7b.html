<blockquote><p>Quest. II. If Peace-makers be blessed, how can any Nation with good conscience make war?

Answ. The Lord’s commandment to have peace with all men, doth not bind men simply, but with this condition, if it be possible, and as much as in us lieth: but when there is no hope of maintaining peace, then the Lord alloweth a lawful war, such as is for just defence, or claim of our needful due and right: for herein the case standeth with the body politick, as it doth with the natural body; while there is hope of health and safety, the Physician useth gentle means; but when the case is desperate, then he useth desperate means, and sometimes gives rank poison, to try if by any means life may be saved. And so may the safety of a State be sought by war, when Motions of peace will not take place.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/william-perkins.html">William Perkins</a></span><span class="wk"><span class="lbl">Work:</span> <cite>A godly and learned exposition of Christ’s Sermon in the Mount</cite>, (Cambridge: University of Cambridge, 1608), pp 35-36.</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/civil-government-and-society.html">Civil Government and Society</a></span></div>

<blockquote><p>That children ought not to dispose of themselves in marriage without the consent of parents, is the constant doctrine of the Protestant churches. And the reasons are these: (1) The scripture gives the power of making marriages for children to the parents, Deut. 7:3; Jer. 29:6; 1 Cor. 7:37, 38. Yea, even after parties have consented, it is left to the parent, whether to give his abused daughter to him that has been guilty with her, Ex. 22:16, 17. (2) The most approved examples of marriage in scripture go this way, Gen. 24:3, 4; 28:1, 2; and 29:19; Judg. 14:2. (3) Lastly, The reason is plain; for the child cannot give away any thing that is his parents’ against their will. Now, the child himself is the parents’, a part of their self-moving substance, in which they have a most undoubted property. So, when the devil was permitted to fall upon what was Job’s, he fell upon his children, and killed them in the first place. Yet, upon the other hand, no parent can force a child to marry such and such a person; for consent makes marriage, and that which is forced is no consent. The child must be satisfied as well as the parent, Gen. 24:57. So the short of it is, that the consent of both is necessary, and that the parent must neither force the child, nor the child rob the parent.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/thomas-boston.html">Thomas Boston</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Thomas Boston, Works</cite>, 2:221:</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/civil-government-and-society/marriage-and-family.html">Marriage and Family</a></span></div>

<blockquote><p>And the truth is, that, besides many other evils, the iniquity and unhappiness of such oaths and covenants [such as the SL&amp;C, which he was just examining] lie much in this, that being commonly framed by persons that even, amongst themselves, are not fully of one mind, but have their different opinions and interests to serve, (and it was so even in this) they commonly patch up so many several articles and clauses, and those too of so versatile and ambiguous terms, that they prove most wretched snares and thickets of briers and thorns to the consciences of those who are engaged in them, and matter of endless contentions and disputes amongst them, about the true sense and intendment, and the ties and obligations of those doubtful clauses: especially in such alterations and revolutions of affairs as always may, and often do, even within few years, follow after them; for the models and productions of such devices are not usually long-lived. And whatsoever may be said for their excuse in whole or in part, who, in yielding to the power that pressed it, and the general opinion of this Church at that time, did take that [Solemn League and] Covenant [1643] in the most moderate and least schismatical sense that the terms can admit; yet, I know not what can be said to clear them of a very great sin, that not only framed such an engine, but violently imposed it upon all ranks of men; not ministers and other public persons only, but the whole body and community of the people, thereby engaging such droves of poor ignorant persons to they knew not what, and (to speak freely) to such a hodge-podge of things of various concernments, religious and civil, as church discipline and government, the privileges of parliaments, and liberties of subjects, and condign punishment of malignants— things hard enough for the wisest and learnedest to draw the just lines of, and to give plain definitions and decisions of them, and therefore certainly as far off from the reach of poor country people’s understanding as from the true interest of their souls. And yet to tie them by a religious oath, either to know all, or to contend for them blindfold, without knowing of them, where will there be instanced a greater oppression and tyranny over consciences than this? Certainly, they that now govern in this Church cannot be charged with anything near or like unto it; for whatsoever they require of entrants to the ministry, they require neither subscriptions nor oaths of ministers already entered, and far less of the whole body of the people.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/robert-leighton.html">Robert Leighton</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Whole Works new</cite>, ed. (London: Duncan, 1830), vol. 4, ‘A Modest Defence of Moderate Episcopacy, as Established in Scotland at the Restoration of King Charles II [1660]’, pp. 391-92</span></figcaption>

<blockquote><p>Seeing therefore that God will not princes commandments should be obeyed in all things, but will have his rather suffer a thousand deaths, than do any thing that is evil: and sense also so many evils and mischiefs may follow in this life, where wicked princes wills may stand for laws, men ought both for God’s sake and commandment abstain to obey such commandments, and cleave unto this Maxim: we must obey God rather than man, for whose sake if we lose both goods and life, we ought to rejoice, that we be called to serve him, and not doubt, but as he is able to recompense it, so will he (according to his promise) reward it.

And besides also they ought to consider, that princes be ordained for the wealth and benefit of the people, and not to their destruction: to maintain common wealths, and not to subvert them: which rather than any man should consent unto, he ought (being a faithful man to his country) to abide all losses, both of body and goods. For next after God, men be borne to love, honour, and maintain their country.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/john-ponet.html">John Ponet</a></span><span class="wk"><span class="lbl">Work:</span> <cite>A short treatise of politick power and of the true obedience which subjects owe to kings and other civil governors, with an exhortation to all true natural English men</cite>, (Strasbourg: The heirs of W. Köpfel, 1556), unpaginated.</span></figcaption>

— John Ponet, A short treatise of politick power and of the true obedience which subjects owe to kings and other civil governors, with an exhortation to all true natural English men, (Strasbourg: The heirs of W. Köpfel, 1556), unpaginated.">Copy</button><a class="share" href="https://x.com/intent/post?text=%E2%80%9CSeeing+therefore+that+God+will+not+princes+commandments+should+be+obeyed+in+all+things%2C+but+will+have+his+rather+suffer+a+thousand+deaths%2C+than+do+any+thing+that+is+evil%3A+and+sense+also+so+many+evils+and+mischiefs+may+follow+in+this+life%2C+where+wicked+princes+wills+may+stand+for+laws%2C+men+ought+both+for+God%E2%80%99s+sake+and+commandment+abstain+to+obey+such+commandments%2C+and+cleave+unto+this+Maxim%3A+we+must+obey+God+rather+than+man%2C+for+whose+sake+if+we+lose+both+goods+and+life%2C+we+ought+to+rejoice%2C+that+we+be+called+to+serve+him%2C+and+not+doubt%2C+but+as+he+is+able+to+recompense+it%2C+so+will+he+%28according+to+his+promise%29+reward+it.%0A%0AAnd+besides+also+they+ought+to+consider%2C+that+princes+be+ordained+for+the+wealth+and+benefit+of+the+people%2C+and+not+to+their+destruction%3A+to+maintain+common+wealths%2C+and+not+to+subvert+them%3A+which+rather+than+any+man+should+consent+unto%2C+he+ought+%28being+a+faithful+man+to+his+country%29+to+abide+all+losses%2C+both+of+body+and+goods.+For+next+after+God%2C+men+be+borne+to+love%2C+honour%2C+and+maintain+their+country.%E2%80%9D%0A%0A%E2%80%94+John+Ponet%2C+A+short+treatise+of+politick+power+and+of+the+true+obedience+which+subjects+owe+to+kings+and+other+civil+governors%2C+with+an+exhortation+to+all+true+natural+English+men%2C+%28Strasbourg%3A+The+heirs+of+W.+Ko%CC%88pfel%2C+1556%29%2C+unpaginated.&amp;url=https%3A%2F%2F5solasquotes.github.io%2Fquote%2F3aad0cb13f.html&amp;via=5Solas" target="_blank" rel="noopener">Share on X</a><a class="perma" href="../quote/3aad0cb13f.html">Permalink</a><a class="src" href="https://reformedcovenanter.wordpress.com/2021/03/11/john-ponet-on-obeying-god-and-honouring-your-country-rather-than-a-tyrant/" rel="noopener" target="_blank">Read it online · Reformed Covenanter</a></div>

<blockquote><p>It was made very clear, however, by other statutes on this subject, that when actual murder had been committed, no advantage was to accrue to the perpetrator from the cities of refuge; though he might have fled thither, he was, on the proof of his guilt, to be delivered up to the Goel for summary execution. Nor was the altar of God – a still more sacred place than the cities of refuge, and in ancient times almost universally regarded as an asylum for criminals – to be permitted in such cases to afford protection; from this also the murderer was to be dragged to his deserved doom. In short, deliberate murder was to admit of no compromise and no palliation: the original law, ‘whoso sheddest man’s blood by man shall his blood be shed,’ must be rigorously enforced; and, doubtless, mainly also on the original ground, ‘because in the image of God made He him.’

To disregard the sanctity of human life, and tread it vilely in the dust, was like aiming a thrust at God Himself, disparaging His noblest work in creation, and the one that stood in peculiar relationship to His own spiritual being. Therefore, the violation of the sixth command by deliberate murder involved also a kind of secondary violation of the first; and to suffer the blood of the innocent to lie unavenged, was, in the highest sense, to pollute the land; it was to render it unworthy of the name of God’s inheritance.

So great was the horror entertained of this unnatural crime, and so anxious was the Lawgiver to impress men with the feeling of its contrariety to the whole spirit and object of the law, that, even in the case of an uncertain murder, there was a cry of blood which could not be disregarded; and when every effort had failed to discover the author of the deed, the elders of the city which lay nearest to the corpse were to regard themselves as in a manner implicated; they had to come publicly forward, and not only protest their innocence of the crime, and their ignorance of the manner in which it had been committed, but also to go through a process of purification by blood and water, that the charge of blood-guiltiness might not rest upon them and their land.</p></blockquote>

</figure><figure class="quote" id="q-8f22801caf" data-kw="">
<blockquote><p>In case it should appear that any have committed the irremissible blasphemy against the Holy Ghost, and the total apostasy from the illuminating convictive powers of the Christian religion, it should seem that they are not to be prayed for at all. ‘For what remains but a certain fearful expectation of judgment, to consume such adversaries?’ Hebrews 10:27. And these last seem to be the sins chiefly intended by the apostle by the name of sins unto death.</p></blockquote>

</figure><figure class="quote" id="q-430dc08f14" data-kw="">
<blockquote><p>…the work of the Spirit, or the Holy Ghost, [is] to sanctify. And hereupon some have thought that opposition unto holiness is the sin against the Holy Ghost: But you find here it is a ‘blasphemy,’ therefore not every opposition [is such]. And if you look into Acts 7, you find that Stephen speaking of the Jews says at verse 51, ‘Ye stiff-necked and uncircumcised in heart and ear, ye do always resist the Holy Ghost;’ yet they did not sin this sin against the Holy Ghost. Why? For Stephen prays for them, at the last verse, ‘Lord, lay not this sin to their charge.’ But now says the apostle John, in 1 John, 5:16, ‘There is a sin unto death, I do not say that ye shall pray for it.’ Had they in Stephen’s account sinned this sin unto death, he would not have prayed for them; but he did pray for them. So that this sin against the Holy Ghost does not consist in every opposition unto the work of the Holy Ghost, as it is distinct from the Father and the Son.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/william-bridge.html">William Bridge</a></span><span class="wk"><span class="lbl">Work:</span> <cite>I. Scripture-Light the most sure Light… delivered in three Sermons on 2 Pet. 1:19; II. Christ in Travail... (London: Cole, 1656), ‘Of the Sin Against the Holy Ghost,’</cite>, p. 356</span></figcaption>

ather%20and%20the%20Son." rel="noopener" target="_blank">Read it online · Reformed Books Online</a></div>
</figure><figure class="quote" id="q-e4e257a4d2" data-kw="">
<blockquote><p>Hence also is the difference between sin pardonable and unpardonable, whereof the one is said to be a sin which is committed against the Father and the Son, that is every transgression of God’s law, whereunto repentance belongs, and therefore that which is pardonable not by the properties of it own nature, but by the grace and mercy of him against whom it is committed; the other is said to be a sin which is committed against the Holy Ghost, and therefore is called by an excellency in Scriptures the blasphemy of the Spirit and a sin unto death. Now, for the making of this sin, three things concur: First, the denial of the truth against knowledge and conscience. Secondly, a universal backsliding from God, and not a particular sin against the first or second table of the law. Thirdly, a rebellion sprung from a hatred of the truth, conjoined with a tyrannical, sophistical, and hypocritical oppugning (or withstanding). And of these conditions, there is a mutual knitting and sequel of the one with, and after the other. Further, it is called a sin against the Holy Ghost, not in respect of the divine essence, and person of the Spirit, but in respect of his office – that is, of grace, and illumination – whereof the Holy Ghost is properly the worker (or effecter); but it is said to be unpardonable for three causes: first, because of the just judgment of God, who suffers not his Spirit, which is the Spirit of truth, to be reproved of a lie. Secondly, because of impenitency, or the hardness to repent. Thirdly, because of the truth and the dignity of redemption, purchased by Christ. For there remains no other sacrifice after men have forsaken the sacrifice of Christ.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/lucas-trelcatius-jr.html">Lucas Trelcatius Jr.</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Institutes</cite></span></figcaption>

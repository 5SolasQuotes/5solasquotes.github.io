<main class="wrap"><figure class="quote" id="q-c1858c9af8" data-kw="">
<blockquote><p>But if no man ought to be compelled to goodness, to what intent doth Solomon (the wisest of all men) so many times command to chastise children? “He that spareth the rod hateth the child,” saith he; “Thou indeed dost strike him, but with the rod thou deliverest his soul from death [Prov. 13:24; 22:14].” Daily experience, and the disposition of men, do plainly teach, that in men there are most vehement affections, which, unless they be remedied and bridled betimes, do both destroy them in whom they be, and other men too, who at the first might easily with light punishment have been preserved. Men in their madness despise compulsion and chastising punishment; but, when they come to themselves again, and see how great evils they are delivered by those that compelled them, then they rejoice that to their health they were chastised, and praise the compulsion which before they despised.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/heinrich-bullinger.html">Heinrich Bullinger</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Fifty godly and learned sermons divided into the five decades containing the chief and principal points of Christian religion</cite>, ed. Thomas Harding (1849-52 Parker edn; 4 vols, Grand Rapids, 2004), i, 364.</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/civil-government-and-society.html">Civil Government and Society</a></span></div>

<blockquote><p>He that being in health or [is] sick, shall contemn physic, let him be condemned of stubbornness and counted as an heretic: unto whom also afterwards, less benefit and duty is due from others; nay, he shall be counted unworthy [of] the fellowship of citizens. For he has tempted God and with the rebellious Jews required miracles, when as without miracles he might have had experience of the grace of God. Whosoever shall affirm that it is lawful for Christians in the time of the plague, without a lawful cause and consent of the rulers, to leave his city and church, he is worthy [of] the name of a schismatic… And he that shall hold every plague to be as an immediate punishment from God, is to be condemned of ignorance and to be despised as an evil speaker: as one that lays upon God his own rashness and blame of his own reckless negligence.</p></blockquote>

<blockquote><p>Since these principles which were demonstrated above concerning the origin of kings and other rulers have been established, it follows that they are not legitimate rulers who by force or deceit usurp that authority which by no right belongs to them. Of such tyrants there are two kinds: for some, in violation of the laws laid down and received, usurp tyranny over their fellow-citizens, as Julius Caesar under the feigned title of perpetual dictator took possession of the Roman commonwealth; and many other tyrants, particularly in Greece, crushed the liberty of their country.

Others however, not content with that absolute power which they rightfully acquire over their own people, extend their dominions at the cost of their neighbours’ liberty and increase them by means of fortified boundary-lines; for this reason have monarchies ever since the origin of the world achieved such wide dominions; of this the sacred writings offers us an example in Nimrod, as we also see that in this way the Israelites were generally oppressed by the neighbouring peoples.

Hence since those tyrants had no lawful right over the people of God, I maintain that the Israelites were free not merely to disobey the sinful commands of these peoples but even to set a just defense against their unjust violence, and that therefore the leaders of the tribes (of Israel) did a grievous wrong whenever they omitted to oppose the foreign foe with united courage and strength in defense of the liberty of their country, provided that the occasion for opposing him presented itself; for it admits of no doubt that even private individuals are bound by the law of both God and men to succour with all their power their country when oppressed and in distress, especially however when its religion and liberty are simultaneously endangered. For it was a true remark which the captive pirate dared to utter when he was dragged before Alexander; he declared that he differed in no way from (the king) but that the latter plundered the world with a multitude of ships whereas he did so with but a single vessel.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/theodore-beza.html">Theodore Beza</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Concerning the Rights of Rulers over their Subjects and the Duty of Subjects Towards their Rulers: A Brief and Clear Treatise Particularly Indispensable to Either Class in these Troubled Times</cite>, (1572), trans. Henry Louis Gonin, ed. Patrick S. Poole in Journal of Christian Reconstruction, 14.1 (1996), pp 110-11.</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/civil-government-and-society/resistance-to-tyranny-and-lawful-authority.html">Resistance to Tyranny and Lawful Authority</a></span></div>

Hence since those tyrants had no lawful right over the people of God, I maintain that the Israelites were free not merely to disobey the sinful commands of these peoples but even to set a just defense against their unjust violence, and that therefore the leaders of the tribes (of Israel) did a grievous wrong whenever they omitted to oppose the foreign foe with united courage and strength in defense of the liberty of their country, provided that the occasion for opposing him presented itself; for it admits of no doubt that even private individuals are bound by the law of both God and men to succour with all their power their country when oppressed and in distress, especially however when its religion and liberty are simultaneously endangered. For it was a true remark which the captive pirate dared to utter when he was dragged before Alexander; he declared that he differed in no way from (the king) but that the latter plundered the world with a multitude of ships whereas he did so with but a single vessel.”

him+presented+itself%3B+for+it+admits+of+no+doubt+that+even+private+individuals+are+bound+by+the+law+of+both+God+and+men+to+succour+with+all+their+power+their+country+when+oppressed+and+in+distress%2C+especially+however+when+its+religion+and+liberty+are+simultaneously+endangered.+For+it+was+a+true+remark+which+the+captive+pirate+dared+to+utter+when+he+was+dragged+before+Alexander%3B+he+declared+that+he+differed+in+no+way+from+%28the+king%29+but+that+the+latter+plundered+the+world+with+a+multitude+of+ships+whereas+he+did+so+with+but+a+single+vessel.%E2%80%9D%0A%0A%E2%80%94+Theodore+Beza%2C+Concerning+the+Rights+of+Rulers+over+their+Subjects+and+the+Duty+of+Subjects+Towards+their+Rulers%3A+A+Brief+and+Clear+Treatise+Particularly+Indispensable+to+Either+Class+in+these+Troubled+Times%2C+%281572%29%2C+trans.+Henry+Louis+Gonin%2C+ed.+Patrick+S.+Poole+in+Journal+of+Christian+Reconstruction%2C+14.1+%281996%29%2C+pp+110-11.&amp;url=https%3A%2F%2F5solasquotes.github.io%2Fquote%2Fd62591d9b1.html&amp;via=5Solas" target="_blank" rel="noopener">Share on X</a><a class="perma" href="../quote/d62591d9b1.html">Permalink</a><a class="src" href="https://reformedcovenanter.wordpress.com/2019/03/13/theodore-beza-on-the-right-of-the-people-to-resist-a-foreign-usurper/" rel="noopener" target="_blank">Read it online · Reformed Covenanter</a></div>

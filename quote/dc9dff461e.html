<main class="wrap"><figure class="quote" id="q-dc9dff461e" data-kw="">
<blockquote><p>The Discourse of Albertus Pighius… shall be once again repeated, both for its Worth and Truth…: ‘…God therefore does justify us by his free grace or goodness wherewith he embraces us in Christ Jesus, when he clothes us with his innocency and righteousness as we are ingrafted into Him; for as that alone is true and perfect which only can endure in the sight of God, so that alone ought to be presented and pleaded for us before the divine tribunal, as the advocate of, or plea in our cause; resting hereon, we here obtain the daily pardon of sin; with whose purity being covered, our filth and the uncleanness of our imperfections are not imputed unto us, but are covered as if they were buried, that they may not come into the Jugdment of God; until the old man being destroyed and slain in us, divine Goodness receives us into peace with the second Adam.&#x27;</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/john-owen.html">John Owen</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Doctrine of Justification by Faith… (London: Boulter, 1677)</cite></span></figcaption>

</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-8f093ce78a" data-kw="">
<blockquote><p>…this is not to be conceived in the way of some transient actions that pass away and leave not so much as a relative change. No, for when God does justify us at first, we are upon our believing put into a state and a fixed condition of peace with God. Thus the Scripture speaks of it as a state, like that of sanctification and glorification; so that while we are sleeping we are justified, because put into that estate, although we do not then actually believe. The first act therefore of faith receiving Christ, in whom we are justified, is like the putting of one into a state of marriage, or of magistracy: Though the first act pass away, yet the relative change it has made continues always; We are not justified by the habit of faith, but by the act, and yet after the first act we stand justified, though we are not all the day long actually believing. Its true, many learned divines say justification is a continued action, and it may be granted in this sense, that God does daily justify believers, even as He constantly preserves them in their natural being; but it is not true in this sense, as if we were put into a new state of justification every day. This is not only to make a first and a second justification, but a thousand justifications; remission of sins and imputation of Christ’s righteousness are reiterated; but justification besides these does connote a fixed estate of the justified person, which is but once, and the Mediator of the Covenant of grace does so firmly uphold this privilege, that there shall never be any total intercission of it, neither do ever any plenarily apostatize from this wonderful favor, that once received it.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/anthony-burgess.html">Anthony Burgess</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The True Doctrine of Justification… (London: Underhill, 1654), pt. 2, | sermon 13, n.p.</cite></span></figcaption>

<blockquote><p>…a man may be said to be justified either intentionally, or virtually, or actually; either in God, or in Christ, or in himself. 1. Intentionally in God in God’s purpose and decree: This is from all eternity, but this decree and intention does not put anything into a state of actual being, but in the fulness of time. 2. Virtually in Christ: And this is from the day of Christ’s passion, and in the virtue of his satisfaction; yet this intends no more but that satisfaction is made and remission purchased by the blood of Christ. 3. Actually in himself: When a man has the possession of justification, immediately after his union with the Lord Jesus Christ. Now this justification considered as it is a state of favor, a covenant state with God, which a man at his first believing is put into, is not reiterated, no more than a wife, after that first entrance into the relation, is frequently made a wife; yet the particular acts of pardon, and imputation of Christ’s righteousness, are continually by God communicated unto the believer. In this respect this actual justification (or particular acts of pardon) has its degrees of progression: The beginning thereof is laid in our first union and incorporation into Christ; the consummation of it is not till the Judge at the latter day has solemnly pronounced the sentence of final absolution, and so set us in full possession of entire remission: Between both these, there is a progressive work of justification, by the constant actings of the Spirit, applying the blood of Christ by the hand of faith, to the quiet and comfort of the soul: The first we may term initial justification, the second progressive, the last perfective; the second is the fruit of the first, and the preludial assurance of the last: The first is wrought and sealed in the first sacrament, the second is wrought and sealed in the second sacrament; and both these branches of sacramental justification, are to us the pre-assurance of that complemental and perfective justification, the sentence whereof puts an end to all fears, changing our faith and hope into fruition and full possession. It has been commonly said by some of our best divines that justification is transacted in our first union and incorporation into Christ; at which time it is conceived that the pardon of all sin is sealed to the believer at once. But I fear the misunderstanding of this point (not untrue in itself, if not mistaken and misapprehended) has laid the ground upon which some build that unhappy structure which turns the grace of God into wantonness: who knows not that justification in the proper acceptation of the word, according to the Scripture phrase, is the act of a judge pronouncing a judicial sentence, wherein he absolves the person of the sinner from all sin and punishment due to him for sin, and that for the alone righteousness of the surety Christ freely imputed, and by faith received of him. And according to this, I suppose we shall not err from the truth, if we say: 1. That the main work of justification, is even as yet to us future, viz. at the great and last day of Judgment, when we shall receive a final quietus est, and discharge, and when God shall wipe away all tears from our eyes: And yet 2. That in our first union with Christ there is a work of justification, viz. actual imputation of Christ’s righteousness, and actual remission of what sin for the present the soul stands guilty of, at that time when it is first united to Christ. I dare not say that justification, quatenus [so far as] it comprehends imputation and remission of sin, is one individual act; or that all sins, past, present and to come are remitted to the believer at once; but this I say, that in our first union, all our sins past and present are actually pardoned; and this favor received is a pledge of assurance that in future also, by applying ourselves to Christ, we may and shall receive the forgiveness of our daily sins, and that at the Last Day we shall at once be absolved from all accusations and charges laid in against us; and that justification (besides those particular acts of pardon, and imputation of Christ’s righteousness) does connote a state that the subject at his first believing is put into, viz. a state of grace, and favor, and reconciliation with God for the imputed righteousness of Christ, without apostasy from it, either total or final.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/isaac-ambrose.html">Isaac Ambrose</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Media: the Middle Things… (London: Field, 1649), ch. 1, 2. ‘First Privilege: Justification’, pp. 2-3 Bedford and Ambrose were sharing some notes one way or the other.</cite></span></figcaption>

d+remission+of+sin%2C+is+one+individual+act%3B+or+that+all+sins%2C+past%2C+present+and+to+come+are+remitted+to+the+believer+at+once%3B+but+this+I+say%2C+that+in+our+first+union%2C+all+our+sins+past+and+present+are+actually+pardoned%3B+and+this+favor+received+is+a+pledge+of+assurance+that+in+future+also%2C+by+applying+ourselves+to+Christ%2C+we+may+and+shall+receive+the+forgiveness+of+our+daily+sins%2C+and+that+at+the+Last+Day+we+shall+at+once+be+absolved+from+all+accusations+and+charges+laid+in+against+us%3B+and+that+justification+%28besides+those+particular+acts+of+pardon%2C+and+imputation+of+Christ%E2%80%99s+righteousness%29+does+connote+a+state+that+the+subject+at+his+first+believing+is+put+into%2C+viz.+a+state+of+grace%2C+and+favor%2C+and+reconciliation+with+God+for+the+imputed+righteousness+of+Christ%2C+without+apostasy+from+it%2C+either+total+or+final.%E2%80%9D%0A%0A%E2%80%94+Isaac+Ambrose%2C+Media%3A+the+Middle+Things%E2%80%A6+%28London%3A+Field%2C+1649%29%2C+ch.+1%2C+2.+%E2%80%98First+Privilege%3A+Justification%E2%80%99%2C+pp.+2-3+Bedford+and+Ambrose+were+sharing+some+notes+one+way+or+the+other.&amp;url=https%3A%2F%2F5solasquotes.github.io%2Fquote%2F5ccdcde87d.html&amp;via=5Solas" target="_blank" rel="noopener">Share on X</a><a class="perma" href="../quote/5ccdcde87d.html">Permalink</a><a class="src" href="https://reformedbooksonline.com/on-the-continuation-of-justification/#:~:text=%E2%80%A6a%20man%20may%20be%20said%20to,from%20it%2C%20either%20total%20or%20final." rel="noopener" target="_blank">Read it online · Reformed Books Online</a></div>

<blockquote><p>4. That the promises concerning perseverance (as has been often intimated) are of two sorts. The first, of the continuance of the favor of God to us, which respects our justification. The other, of the continuance of our obedience unto God, which respects our sanctification… … 2. For those of the first sort, which I shall now handle… I shall propose only some few things unto consideration… … 2. That these promises of God do not properly, and as to their original rise, depend on any conditions in believers or by them to be fulfilled, but are the fountains and springs of all conditions whatever that are required to be in them or expected from them; though the grace and obedience of believers are often mentioned in them, as the means, whereby they are carried on according to the appointment of God unto the enjoyment (or continued in it) of what is promised.</p></blockquote>

</figure><figure class="quote" id="q-3403251ace" data-kw="">
<blockquote><p>I find ground to assert a twofold justification. First, a general and first-justification (which most places before-mentioned speak of), when a person passes from an unjustified to a justified estate. This is owned by all, and therefore I shall say no more of it. Secondly, a particular, renewed, repeated and after-justification, when any particular act is approved by God and a person is accounted righteous in reference unto that. This kind of justification must needs be understood in that place where this phrase is first used, Gen. 15:6, ‘Abraham believed God, and He counted it to him for righteousness.’ Here it relates to his faith in that particular promise of God, concerning an heir to be born of his own body, and the numerousness of his seed by him, verses 4-5; and so must be meant of God’s approbation of that particular act of faith as a righteous act, or his accounting him righteous in that particular act… ‘Tis but as he [Paul] gathers and infers the general from one particular, that if Abraham were justified by faith and not by such [legal] works, whereof he might glory, then all others are justified so too, he being the father of all that believe, verse 11. i.e. an eminent example or pattern of the justification of believers. I say, it must needs be understood of a particular justification, with reference to that particular act, and not of his first and general justification; for he [Abraham] was a justified person long before that, as appears in that when he was called out of his own country, Gen. 12:1, 3, he obeyed that call, verse 4, and so became the friend of God [Jm. 2:23], who blessed him, [Gen. 12] verses 2-3, and appeared unto him, verse 7, by which, and all the following story, it is evident, that he was a good, righteous and holy man long before those words were spoken of him, ch. 15:6.</p></blockquote>

<blockquote><p>The sins forbidden in the ninth commandment are, all prejudicing the truth, and the good name of our neighbours, as well as our own,[b]… giving false evidence,[d]… out-facing and over-bearing the truth;[f] passing unjust sentence,[g] calling evil good, and good evil; rewarding… the righteous according to the work of the wicked;[h] forgery,[i] concealing the truth, undue silence in a just cause,[k] and holding our peace when iniquity calleth for either a reproof from ourselves,[l] or complaint to others;[m]… or perverting it [truth] to a wrong meaning,[p] or in doubtful or equivocal expressions, to the prejudice of truth or justice;[q] speaking untruth,[r]… rash,[b] harsh,[c] and partial censuring;[d] misconstructing intentions, words, and actions;[e] flattering,[f] vain-glorious boasting,[g] thinking or speaking too highly or too meanly of ourselves or others,[h] denying the gifts and graces of God;[i] aggravating smaller faults;[k]… raising false rumours,[n] receiving and countenancing evil reports,[o] and stopping our ears against just defence;[p] evil suspicion;[q] envying or grieving at the deserved credit of any,[r]… scornful contempt,[v] fond admiration;[w]… neglecting such things as are of good report,[y]… [b] 1 Sam. 17:28. 2 Sam. 16:3. 2 Sam. 1:9,10,15,16. [c] Lev. 19:15. Hab. 1:4. [d] Prov. 19:5. Prov. 6:16,19. [e] Acts 6:13. [f] Jer. 9:3,5. Acts 24:2,5. Ps. 12:3,4. Ps. 52:1-4. [g] Prov. 17:15. 1 Kings 21:9-14. [h] Isa. 5:23. [i] Ps. 119:69. Luke 19:8. Luke 16:5-7. [k] Lev. 5:1. Deut. 13:8. Acts 5:3,8,9. 2 Tim. 4:6. [l] 1 Kings 1:6. Lev. 19:17. [m] Isa. 59:4. [n] Prov. 29:11. [o] 1 Sam. 22:9,10 compared with Ps. 52:title,1-5. [p] Ps. 56:5. John 2:19 compared with Matt. 26:60,61. [q] Gen. 26:7,9. [r] Isa. 59:13. [s] Lev. 19:11. Col. 3:9. [t] Ps. 50:20. [v] Ps. 15:3. [w] James 4:11. Jer. 38:4. [x] Lev. 19:16. [y] Rom. 1:29,30. [z] Gen. 21:9 compared with Gal. 4:29. [a] 1 Cor. 6:10. [b] Matt. 7:1. [c] Acts 28:4. [d] Gen. 38:24. Rom. 2:1. [e] Neh <blockquote><p>May the lies you believed make you wise to achieve The aims broken trust tried to steal. May the watches you keep in the sloughs where you weep Remind you that truth remains real. May integrity bless you while deceits that distress you Unravel as they strive to conceal. May fears that devour you unwillingly empower you As endurance adds knowledge to zeal. May hope now deferred and vision now blurred Behold, in tear-stained time, a heart that is ready to heal.</p></blockquote>

<blockquote><p>That which in sobriety is righteousness often carries its name beyond the true boundary. It includes — what the heavenly Martyn dreaded in himself — ‘ talking much, and appearing to be somebody in religion.’ Details may be easily multiplied. Religion is made to consist mainly in externals. Self-conceited professors insist upon their own shibboleth, without regard to the different judgments of their brethren. Christian duties are pressed beyond their due proportion, interfering with immediate obligations, and making sins, where God has not made them. Scrupulosity in matters indifferent takes the place of the free obedience of the Gospel. In the exercise also of Christian graces there may be danger of extremes. Boldness may verge to rashness, benevolence into indiscriminate waste, candor into weakness. In all these and many other details the Scriptural line seems to be passed, and the warning is justly applied — ‘Be not righteous over-much.’ Even ‘in well-doing there may be over-doing,’ and this over-doing may inadvertently progress towards undoing. lndeed much of this is not religion, but superstition, which ‘is not the excess of godliness’ (as Abp. Whately remarks) ‘but the misdirection of it — the exhausting of it in the vanity of man’s devising.’ It is important that our religion should be reasonable, consistent, uniform — not a matter of opinion, but of the heart. Great indeed is our need, and constant should be our prayer — “let me have understanding in the way of godliness.” (Ps. 101:2) But we are warned against another extreme. Neither make thyself overmuch wise — a wholesome practical rule! Avoid all affectation or high pretensions to superior wisdom. Guard against that opinionative confidence, which seems to lay down the law, and critically finds fault with every judgment differing from our own. The apostle gives this warning with peculiar emphasis and solemnity — ‘This I say, through the grace given unto me, to every man that is among you, not to think of himself more highly than he ought to think, but to think soberly, according as God has dealt to every man the measure of faith.’ The more humble thou art, the more wary and circumspect thou wilt be; and the more wary the more safe.’</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/charles-bridges.html">Charles Bridges</a></span><span class="wk"><span class="lbl">Work:</span> <cite>An Exposition of the Book of Ecclesiastes</cite>, (NY: Robert Carter, 1860), on Eccl. 7:16, pp. 207-8</span></figcaption>

<blockquote><p>A clear indicator of shunning is that the evidence of the ‘sins’ of the shunned person will be thin. Instead, insinuations will be made about a person’s character and rarely will there be something concrete. If there is, it won’t rise to the level of a chargeable offense, although the leadership may greatly exaggerate it. The ‘sin’ actually consists of disagreement with the leadership… Shunning at its root is a ‘good riddance.’ It is to discard someone. The coldness of it will be evident over time with repetition of occurrences. Rather than the love which ‘always hopes,’ there is a sentiment more like, ‘you have to be willing to pull the trigger.’… …with shunning, often there will be no church discipline involved; a process demanding the rigor of due process, true shepherding, time, and layers of accountability due to the gravity of what is at stake… the leadership simply communicates to the church in various ways that certain people are to be totally avoided because they pose a ‘danger’ to the church. People disappear with little discussion or invitation for questions, except for insinuation about them… First, those who are perceived as a ‘threat’ to power and control of the spiritually abusive leadership are marked… It may take place in the context of a controversy where leadership is domineering and anyone who questions is therefore marked… Second, the abusive leadership moves to push out the perceived threat… It can be as simple as a cold shoulder: the person receives nonverbal cues that they are not wanted by the leadership. Exclusion may be accomplished by veiled references with criticisms from the pulpit where the victim and others know who is being described… Pastoral knowledge of their lives or weaknesses may be marshaled against them abusively… Victims may find themselves berated, facing tremendous anger and rage designed to cow them into submission… the collective power of a body of complicit leaders may convince them that the problem is indeed themselves. This may be the worst scenario, as the victim finds himself under the terror of condemnation, believing that the anger he is receiving is the anger of God… The psychological toll is terrible. But this tactic is effective: such persons are neutralized as a ‘threat’… Third, in order to minimize any potential damage to the leadership’s reputation and maintain control, individuals must be discredited. Here is where the real work must be done upon a congregation to get them on board. Those who have been marked and excluded continue to pose a threat because they may speak with persons in the congregation. The more godly and mature the excluded person is, the more intently the leadership will have to work to discredit them. This results in demonization. The words of the Pharisees whose control was challenged by the formerly blind man are pertinent: “You were born in utter sin, and would you teach us?” And they cast him out (John 9:34)… Full Shunning… It takes place incrementally, with exhortations of ‘protecting the flock from dangerous people,’… ‘exerting tough love toward unrepentant people,’ and ‘not allowing Satan a foothold’ at the forefront. These are convincing themes for biblical Christians who trust their leaders. Although there may be no formal discipline, the character of the person is so slandered that others conclude they have reason to withdraw from them, and even a moral obligation… The pulpit, private conversations, committee meetings, and public prayers become useful for insinuations… …the pattern will easily be replicated and expanded. The leader therefore begins with strong pressure on the other leaders to do this. Other involved members will pick up on the practice as it is now reinforced from multiple people. Once the principles are inculcated with a core, it will spread. It becomes a powerful tool for control as well as instilling fear of disagreeing and being among ‘those compromised people’ whose eternal destiny is called into question. When it is leaders who step out of line and are excluded, they will quickly be erased… Long standing close relationships are ruptured… The closer the remaining individuals are to the core leadership, the more severe the pressure will be. Victims multiply. In biblically orthodox contexts, often at the root of abusive leadership and shunning is the sort of self-idolatry commonly described as narcissism. This takes the shape again and again of a charismatic figure, compelling in his leadership, capable in his use of scripture, remarkably gifted in different ways, yet underneath gripped by sins of great spiritual pride and need for control. He labors to hide these from all people and especially from himself with ministerial activity and forms of piety. He views himself as fundamentally different and above others and unable to begin to consider the possibility of something being so wrong within. This leaves him with great insecurity and unable to receive criticism or be questioned in his judgment. He excels in gathering others around him by flattery to serve as supporters, training and convincing them of his ways, but will swiftly crush them if he detects disloyalty… If you have concerns that such tendencies may be present in your church, read further resources on the topic and seek objective counsel and prayer from other Christians outside of your church.</p></blockquote>

— Steven Light, ‘Unmasking Abusive Spiritual Leadership Part I: Shunning’ (2023) 23 paragraphs at Aquila Report">Copy</button><a class="share" href="https://x.com/intent/post?text=%E2%80%9CA+clear+indicator+of+shunning+is+that+the+evidence+of+the+%E2%80%98sins%E2%80%99+of+the+shunned+person+will+be+thin.+Instead%2C+insinuations+will+be+made+about+a+person%E2%80%99s+character+and+rarely+will+there+be+something+concrete.+If+there+is%2C+it+won%E2%80%99t+rise+to+the+level+of+a+chargeable+offense%2C+although+the+leadership+may+greatly+exaggerate+it.+The+%E2%80%98sin%E2%80%99+actually+consists+of+disagreement+with+the+leadership%E2%80%A6+Shunning+at+its+root+is+a+%E2%80%98good+riddance.%E2%80%99+It+is+to+discard+someone.+The+coldness+of+it+will+be+evident+over+time+with+repetition+of+occurrences.+Rather+than+the+love+which+%E2%80%98always+hopes%2C%E2%80%99+there+is+a+sentiment+more+like%2C+%E2%80%98you+have+to+be+willing+to+pull+the+trigger.%E2%80%99%E2%80%A6+%E2%80%A6with+shunning%2C+often+there+will+be+no+church+discipline+involved%3B+a+process+demanding+the+rigor+of+due+process%2C+true+shepherding%2C+time%2C+and+layers+of+accountability+due+to+the+gravity+of+what+is+at+stake%E2%80%A6+the+leadership+simply+communicates+to+the+church+in+various+ways+that+certain+people+are+to+be+totally+avoided+because+they+pose+a+%E2%80%98danger%E2%80%99+to+the+church.+People+disappear+with+little+discussion+or+invitation+for+questions%2C+except+for+insinuation+about+them%E2%80%A6+First%2C+those+who+are+perceived+as+a+%E2%80%98threat%E2%80%99+to+power+and+control+of+the+spiritually+abusive+leadership+are+marked%E2%80%A6+It+may+take+place+in+the+context+of+a+controversy+where+leadership+is+domineering+and+anyone+who+questions+is+therefore+marked%E2%80%A6+Second%2C+the+abusive+leadership+moves+to+push+out+the+perceived+threat%E2%80%A6+It+can+be+as+simple+as+a+cold+shoulder%3A+the+person+receives+nonverbal+cues+that+they+are+not+wanted+by+the+leadership.+Exclusion+may+be+accomplished+by+veiled+references+with+criticisms+from+the+pulpit+where+the+victim+and+others+know+who+is+being+described%E2%80%A6+Pastoral+knowledge+of+their+lives+or+weaknesses+may+be+marshaled+against+them+abusively%E2%80%A6+Victims+may+find+themselves+berated%2C+facing+tremendous+anger+and+rage+designed+to+cow+them+into+submission%E2%80%A6+the+collective+power+of+a+body+of+complicit+leaders+may+convince+them+that+the+problem+is+indeed+themselves.+This+may+be+the+worst+scenario%2C+as+the+victim+finds+himself+under+the+terror+of+condemnation%2C+believing+that+the+anger+he+is+receiving+is+the+anger+of+God%E2%80%A6+The+psychological+toll+is+terrible.+But+this+tactic+is+effective%3A+such+persons+are+neutralized+as+a+%E2%80%98threat%E2%80%99%E2%80%A6+Third%2C+in+order+to+minimize+any+potential+damage+to+the+leadership%E2%80%99s+reputation+and+maintain+control%2C+individuals+must+be+discredited.+Here+is+where+the+real+work+must+be+done+upon+a+congregation+to+get+them+on+board.+Those+who+have+been+marked+and+excluded+continue+to+pose+a+threat+because+they+may+speak+with+persons+in+the+congregation.+The+more+godly+and+mature+the+excluded+person+is%2C+the+more+intently+the+leadership+will+have+to+work+to+discredit+them.+This+results+in+demonization.+The+words+of+the+Pharisees+whose+control+was+challenged+by+the+formerly+blind+man+are+pertinent%3A+%E2%80%9CYou+were+born+in+utter+sin%2C+and+would+you+teach+us%3F%E2%80%9D+And+they+cast+him+out+%28John+9%3A34%29%E2%80%A6+Full+Shunning%E2%80%A6+It+takes+place+incrementally%2C+with+exhortations+of+%E2%80%98protecting+the+flock+from+dangerous+people%2C%E2%80%99%E2%80%A6+%E2%80%98exerting+tough+love+toward+unrepentant+people%2C%E2%80%99+and+%E2%80%98not+allowing+Satan+a+foothold%E2%80%99+at+the+forefront.+These+are+convincing+themes+for+biblical+Christians+who+trust+their+leaders.+Although+there+may+be+no+formal+discipline%2C+the+character+of+the+person+is+so+slandered+that+others+conclude+they+have+reason+to+withdraw+from+them%2C+and+even+a+moral+obligation%E2%80%A6+The+pulpit%2C+private+conversations%2C+committee+meetings%2C+and+public+prayers+become+useful+for+insinuations%E2%80%A6+%E2%80%A6the+pattern+will+easily+be+replicated+and+expanded.+The+leader+therefore+begins+with+strong+pressure+on+the+other+leaders+to+do+this.+Other+involved+members+will+pick+up+on+the+practice+as+it+is+now+reinforced+from+multiple+people.+Once+the+principles+are+inculcated+with+a+core%2C+it+will+spread.+It+becomes+a+powerful+tool+for+control+as+well+as+instilling+fear+of+disagreeing+and+being+among+%E2%80%98those+compromised+people%E2%80%99+whose+eternal+destiny+is+called+into+question.+When+it+is+leaders+who+step+out+of+line+and+are+excluded%2C+they+will+quickly+be+erased%E2%80%A6+Long+standing+close+relationships+are+ruptured%E2%80%A6+The+closer+the+remaining+individuals+are+to+the+core+leadership%2C+the+more+severe+the+pressure+will+be.+Victims+multiply.+In+biblically+orthodox+contexts%2C+often+at+the+root+of+abusive+leadership+and+shunning+is+the+sort+of+self-idolatry+commonly+described+as+narcissism.+This+takes+the+shape+again+and+again+of+a+charismatic+figure%2C+compelling+in+his+leadership%2C+capable+in+his+use+of+scripture%2C+remarkably+gifted+in+different+ways%2C+yet+underneath+gripped+by+sins+of+great+spiritual+pride+and+need+for+control.+He+labors+to+hide+these+from+all+people+and+especially+from+himself+with+ministerial+activity+and+forms+of+piety.+He+views+himself+as+fundamentally+different+and+above+others+and+unable+to+begin+to+consider+the+possibility+of+something+being+so+wrong+within.+This+leaves+him+with+great+insecurity+and+unable+to+receive+criticism+or+be+questioned+in+his+judgment.+He+excels+in+gathering+others+around+him+by+flattery+to+serve+as+supporters%2C+training+and+convincing+them+of+his+ways%2C+but+will+swiftly+crush+them+if+he+detects+disloyalty%E2%80%A6+If+you+have+concerns+that+such+tendencies+may+be+present+in+your+church%2C+read+further+resources+on+the+topic+and+seek+objective+counsel+and+prayer+from+other+Christians+outside+of+your+church.%E2%80%9D%0A%0A%E2%80%94+Steven+Light%2C+%E2%80%98Unmasking+Abusive+Spiritual+Leadership+Part+I%3A+Shunning%E2%80%99+%282023%29+23+paragraphs+at+Aquila+Report&amp;url=https%3A%2F%2F5solasquotes.github.io%2Fquote%2Fd312505452.html&amp;via=5Solas" target="_blank" rel="noopener">Share on X</a><a class="perma" href="../quote/d312505452.html">Permalink</a><a class="src" href="https://reformedbooksonline.com/on-spiritual-abuse/#:~:text=A%20clear%20indicator%20of%20shunning%20is,other%20Christians%20outside%20of%20your%20church&amp;text=A%20clear%20indicator%20of%20shunning%20is%20that%20the&amp;text=prayer%20from%20other%20Christians%20outside%20of%20your%20church" rel="noopener" target="_blank">Read it online · Reformed Books Online</a></div>

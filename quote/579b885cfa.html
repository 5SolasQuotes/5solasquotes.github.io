<blockquote><p>Thirdly, According to some there is this Third Office in the Church of Christ, namely, that of Lay-Elders, and their Foundation for it is in Rom. 12.8. He that ruleth with Diligence; where he that ruleth is distinguished from him that teacheth and exhorteth, and therefore they say he is a different Officer, and they observe that he comes after him that teacheth and exhorteth, which shews, that he is an Officer inferior to the Teacher and Exhorter. And therefore there is Reason to infer, that ὁ προϊστάμενος, he that ruleth, is the Lay-Presbyter, whose peculiar business it is to be an Overseer and Censor of the Manners of those ‘who belong to the Christian Congregation.

So it is thought to be clear from that other Text, I Cor. 12. 28. which mentions Helps and Governments, that by them are meant Ruling Elders in the Church, who are not Pastors or Teachers (for they are distinguished from them) but are helpful and serviceable in the Governing of the Church, by taking care of the outward Behaviour of its Members. And as before he that ruleth was placed after the Teacher and Exhorter, so here they observe, that Helps and Governments are placed after Teachers, to let us know that they are not the Preaching for Teaching Governors, nor Bishops of the Church.

That is looked upon another plain Text, I Tim. 5. 17. Let the Elders that rule well be counted worthy of double Honour, especially those that labour in the Word and Doctrine. Where are two Sorts of Elders, those that Rule, and those that both Rule and do other Offices in the Church. The Lay-Seniors that are appointed to keep Things in good Order, and to assist in the Governing and Disciplinary Part, are said to Rule well, and therefore deserve a high Degree of Honour and Praise; but there is another Rank of Elders, who labour in the Word and Doctrine, whose Office it is to instruct and guide Men as to all Spiritual Affairs, and these are especially worthy of double Honour. The Emphasis lies in the Word μάλιστα, especially, which, where-ever it is used in the New Testament, signifies another Thing, or Person, different from what was before-mentioned in the Place. So here it makes a Distinction between Elders, between the Ruling and the Teaching Elder.

But here some Object (and with great Weight and Reason) that the καλῶς προεστῶτες are the same with προϊσταμένους, I Thess. 5. 12. who are acknowledged to be Bishops, or else Preaching Elders. But the Answer that is given to this Objection is this, That to Rule, or to be set over others is applicable to both that sort of Elders I’m now speaking of, and to the others. The Lay-Elder is said to Rule, not because the others do not Rule, but because he doth nothing else but Rule, he doth not Preach or Perform any Office that belongs to the Ministry.

Besides, if by ruling Elders in this Place he mean Bishops or Preaching Ministers, then the Apostle here would have those who take no Pains and Care in the Word and Doctrine, to have Honour, yea, and he lets us know that they are worthy of it; which is a Meaning unworthy of the Apostle. For the Pastoral Office requires Pains and Labour, and therefore it is certain the Apostle would not speak thus concerning those that labour not: Whence some conclude, that by the Ruling Elders here we are not to understand the Teachers of the Church, but that the plain Interpretation is this, To labour in the Word and Doctrine is here the Periphrasis of a Preaching Elder or Minister, and so it is opposed to that other Office, which consists only in Ruling. …

The short is, that some are of Opinion that labouring in the Word and Doctrine comprehends here the whole Ministerial Employment, as it is usual to express the whole by a Principal Part, and it is contradistinguished from, and preferred to the ruling well, that is, the bare Office of those who were Lay-Men, but appointed by the Church to look into the Manners of the People, and so to govern and preside over the congregation. Whence it is inferred by some, that Lay-Elders are an Evangelical Appointment in the Church.

And they tell us moreover, that this Office of a Ruling Elder is according to the Practice of the Church of God among the Jews, his own People. It is certain that there was this kind of Elders under that Oeconomy. The Sanhedrim was compounded of Priests and Lay-Elders, as is evident from Num. 11.16. 24, 25-33. 16. Deut. 17. 8, 9. as well as from other Jewish Writers since, who acquaint us that there were two Sorts of Elders among the Jews, the Ruling ones, who governed in their Assemblies and Synagogues, and the Teaching ones, who read and expounded the Scriptures. Accordingly Dr. [John] Lightfoot in his Harmony of the New Testament inclines to interpret 1 Tim. 5. 17. of the Elders in the Christian Congregations, who answer to the Lay-Elders in the Jewish Synagogue. For this Learned Writer, who was well versed in the Jewish Customs and Practices, tells us, that in every Synagogue among the Jews there were Elders that ruled chiefly in the Affairs of the Synagogue, and other Elders that labour d in the Word and Doctrine.

And so it was in the Christian Church, there was a Mixture of Clergy and Laity in their Consults about Church-Matters, as we lee frequently in the Ails of the Apostles. The concurrence of the People was thought necessary in the Apostles Times in the public Censures of the Church, in Election of Pastors, and in all Ecclesiastical Concerns. But more particularly the Practice of those Times with regard to Lay-Elders, is said to be manifest from what is recorded in the Apostolical Epistles, which hath been already produced to confirm this Office in the Church. Perhaps that Text (which is not thought of in Acts 20. 17, 20, doth the fame, for ’tis said that St. Paul called the Elders of the Church of Ephesus; and ’tis said farther, that St. Paul taught them publicly, and from House to House, whence it maybe gathered, that among those Elders some of them were Lay-Men, for some of them were not Teachers, but were taught, and these were those that we call Lay-Elders.

And afterwards the Christian Church retained this Usage, for which they quote St. Augustine’s 137th Epistle, where he motions the Clergy, and the Elders and the People. So in his 3d. Book against Cresconius he mentions Deacons and Seniors, that is, Lay-Elders, for he distinguishes them from other Presbyters. One of his Epistles to his Church of Hippo, is thus superscribed. To the Clergy and the Elders. See chap. 56. in the fore-named Book against Cresconius, where he mentions Peregrinus the Presbyter, and the Seniors. … Thus it appears, that this was an Ancient Office in the Church, and not invented by Calvin, as some have thought and writ.

And then, as to the Reason of the Thing, some think there should be no Ground of Quarrelling with this Office in the Church, seeing it is so Useful. For it was Instituted for the Ease of the Preaching Elders, that they might not be over-burdened with Business, and that they might more conveniently apply themselves to that Employment which is purely Ecclesiastical and Spiritual. And it was wisely appointed to take off the Envy and Odium from the Ministers, which would be their Lot if they intermeddled too much with Affairs. And it is a Way to cement the Clergy and Laity, and to bring them to a Friendly and Christian Correspondence, and to unite them firmly in the same great Interest, that of Religion.

It might here be remembered, that they had a very great Opinion of Laymen in the former and best Times of the Christian Church, for they were admitted to Synods and Councils, and they were advanced to the highest Ecclesiastical Dignities. Thus Spyridion, tho’ a plain Countryman and a Shepherd, was made a Bishop. Ambrose, a Secular Magistrate, and Governour of Milan, was chosen Bishop of that Place by the People. Nectarius a Layman was put into the fame Office at Constantinople. Sidonius, a French Soldier was made Bishop of Auvergne in France. And if Laymen were admitted to Bishopricks, it can’t be thought indecorous that they are placed in a much lower Station in the Church, than that of Ruling Elders.

These seem to have been allowed of by our Reformers, as is evident from the Injunctions which were given by King Edward the VIth. to those Persons who were to take care of Reforming and Settling Ecclesiastical Affairs in his Reign. See the Chapter de Divinis Officits, where the Minister and the Elders are particularly mentioned, and are commanded to look after the Discipline of the Church. See the Reverend Bishop [Gilbert] Burnet’s History of the Reformation.

Nor is this esteemed by some to be against the Genius of the Evangelical Administration, which suffers not Secular Men to discharge Spiritual Offices; for the Lay-Elders Office is not properly and strictly such, they take care only of the External Matters of the Church, and are only Assistants in the outward administering of Discipline, and look into the Manners and Carriage of the Christians belonging to such or such an Assembly. But they excuse no part of the Ecclesiastical Ministry, which properly appertains to the Ministers of the Gospel.</p></blockquote>

+their+Consults+about+Church-Matters%2C+as+we+lee+frequently+in+the+Ails+of+the+Apostles.+The+concurrence+of+the+People+was+thought+necessary+in+the+Apostles+Times+in+the+public+Censures+of+the+Church%2C+in+Election+of+Pastors%2C+and+in+all+Ecclesiastical+Concerns.+But+more+particularly+the+Practice+of+those+Times+with+regard+to+Lay-Elders%2C+is+said+to+be+manifest+from+what+is+recorded+in+the+Apostolical+Epistles%2C+which+hath+been+already+produced+to+confirm+this+Office+in+the+Church.+Perhaps+that+Text+%28which+is+not+thought+of+in+Acts+20.+17%2C+20%2C+doth+the+fame%2C+for+%E2%80%99tis+said+that+St.+Paul+called+the+Elders+of+the+Church+of+Ephesus%3B+and+%E2%80%99tis+said+farther%2C+that+St.+Paul+taught+them+publicly%2C+and+from+House+to+House%2C+whence+it+maybe+gathered%2C+that+among+those+Elders+some+of+them+were+Lay-Men%2C+for+some+of+them+were+not+Teachers%2C+but+were+taught%2C+and+these+were+those+that+we+call+Lay-Elders.%0A%0AAnd+afterwards+the+Christian+Church+retained+this+Usage%2C+for+which+they+quote+St.+Augustine%E2%80%99s+137th+Epistle%2C+where+he+motions+the+Clergy%2C+and+the+Elders+and+the+People.+So+in+his+3d.+Book+against+Cresconius+he+mentions+Deacons+and+Seniors%2C+that+is%2C+Lay-Elders%2C+for+he+distinguishes+them+from+other+Presbyters.+One+of+his+Epistles+to+his+Church+of+Hippo%2C+is+thus+superscribed.+To+the+Clergy+and+the+Elders.+See+chap.+56.+in+the+fore-named+Book+against+Cresconius%2C+where+he+mentions+Peregrinus+the+Presbyter%2C+and+the+Seniors.+%E2%80%A6+Thus+it+appears%2C+that+this+was+an+Ancient+Office+in+the+Church%2C+and+not+invented+by+Calvin%2C+as+some+have+thought+and+writ.%0A%0AAnd+then%2C+as+to+the+Reason+of+the+Thing%2C+some+think+there+should+be+no+Ground+of+Quarrelling+with+this+Office+in+the+Church%2C+seeing+it+is+so+Useful.+For+it+was+Instituted+for+the+Ease+of+the+Preaching+Elders%2C+that+they+might+not+be+over-burdened+with+Business%2C+and+that+they+might+more+conveniently+apply+themselves+to+that+Employment+which+is+purely+Ecclesiastical+and+Spiritual.+And+it+was+wisely+appointed+to+take+off+the+Envy+and+Odium+from+the+Ministers%2C+which+would+be+their+Lot+if+they+intermeddled+too+much+with+Affairs.+And+it+is+a+Way+to+cement+the+Clergy+and+Laity%2C+and+to+bring+them+to+a+Friendly+and+Christian+Correspondence%2C+and+to+unite+them+firmly+in+the+same+great+Interest%2C+that+of+Religion.%0A%0AIt+might+here+be+remembered%2C+that+they+had+a+very+great+Opinion+of+Laymen+in+the+former+and+best+Times+of+the+Christian+Church%2C+for+they+were+admitted+to+Synods+and+Councils%2C+and+they+were+advanced+to+the+highest+Ecclesiastical+Dignities.+Thus+Spyridion%2C+tho%E2%80%99+a+plain+Countryman+and+a+Shepherd%2C+was+made+a+Bishop.+Ambrose%2C+a+Secular+Magistrate%2C+and+Governour+of+Milan%2C+was+chosen+Bishop+of+that+Place+by+the+People.+Nectarius+a+Layman+was+put+into+the+fame+Office+at+Constantinople.+Sidonius%2C+a+French+Soldier+was+made+Bishop+of+Auvergne+in+France.+And+if+Laymen+were+admitted+to+Bishopricks%2C+it+can%E2%80%99t+be+thought+indecorous+that+they+are+placed+in+a+much+lower+Station+in+the+Church%2C+than+that+of+Ruling+Elders.%0A%0AThese+seem+to+have+been+allowed+of+by+our+Reformers%2C+as+is+evident+from+the+Injunctions+which+were+given+by+King+Edward+the+VIth.+to+those+Persons+who+were+to+take+care+of+Reforming+and+Settling+Ecclesiastical+Affairs+in+his+Reign.+See+the+Chapter+de+Divinis+Officits%2C+where+the+Minister+and+the+Elders+are+particularly+mentioned%2C+and+are+commanded+to+look+after+the+Discipline+of+the+Church.+See+the+Reverend+Bishop+%5BGilbert%5D+Burnet%E2%80%99s+History+of+the+Reformation.%0A%0ANor+is+this+esteemed+by+some+to+be+against+the+Genius+of+the+Evangelical+Administration%2C+which+suffers+not+Secular+Men+to+discharge+Spiritual+Offices%3B+for+the+Lay-Elders+Office+is+not+properly+and+strictly+such%2C+they+take+care+only+of+the+External+Matters+of+the+Church%2C+and+are+only+Assistants+in+the+outward+administering+of+Discipline%2C+and+look+into+the+Manners+and+Carriage+of+the+Christians+belonging+to+such+or+such+an+Assembly.+But+they+excuse+no+part+of+the+Ecclesiastical+Ministry%2C+which+properly+appertains+to+the+Ministers+of+the+Gospel.%E2%80%9D%0A%0A%E2%80%94+John+Edwards%2C+Theologia+Reformata%3A+or%2C+The+Body+and+Substance+of+the+Christian+Religion%2C+Comprised+in+distinct+Discourses+or+Treatises+upon+the+Apostles+Creed%2C+the+Lord%E2%80%99s+Prayer%2C+and+the+Ten+Commandments%2C+%282+vols%2C+London%3A+John+Lawrence%2C+1713%29%2C+1%3A+525-28.&amp;url=https%3A%2F%2F5solasquotes.github.io%2Fquote%2F579b885cfa.html&amp;via=5Solas" target="_blank" rel="noopener">Share on X</a><a class="perma" href="../quote/579b885cfa.html">Permalink</a><a class="src" href="https://reformedcovenanter.wordpress.com/2020/02/07/john-edwards-on-the-office-of-ruling-elder/" rel="noopener" target="_blank">Read it online · Reformed Covenanter</a></div>
</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-bde90d2692" data-kw="">
<blockquote><p>In the Roman, yea in prelatical Churches there are scarce any footsteps at all of the offices of preaching presbyters and deacons as they were instituted by the apostles. The apostles ordained presbyters to preach the Word, to minister the sacraments, to govern the Church and to make use of the keyes. But the Popish and prelatical presbyters have not the power of the keys, nor the power of Church government, for it is proper to their prelates; as for the other two, they are common to their deacons, for they also do preach and baptize… As touching deacons, they were ordained by the apostles for collecting receiving, keeping and distributing of ecclesiastical goods, for maintaining of ministers, schools, churches, the sick, stranger, and poor. The Popish and prelatical deacons have no such office, but an office which the apostles never appointed to them, for they had no preaching nor baptizing deacons. Philip preached [Acts 8:5, 12] and baptized [Acts 8:12-13, 38], not as a deacon [Acts 6:5], but as an evangelist, Acts 21:8. Besides, at the time of his preaching and baptizing, he could not have exercised the office of his deaconship by reason of the persecution, which scattered rich and poore and all, Acts 8:1. That which Stephen [a deacon, Acts 6:5] did, Acts 7, was no more then every believer was bound to do when he is called to give a testimony to the truth and to give a reason of his faith and practice.</p></blockquote>

<blockquote><p>In giving the name of bishops, presbyters, and pastors, indiscriminately to those who govern churches, I have done it on the authority of Scripture, which uses the words as synonymous. To all who discharge the ministry of the word it gives the name of bishops. Thus Paul, after enjoining Titus to ordain elders in every city, immediately adds, &quot;A bishop must be blameless,&quot; &amp;c., (Tit. 1: 5, 7.) So in another place he salutes several bishops in one church, (Phil. 1: 1.) And in the Acts, the elders of Ephesus, whom he is said to have called together, he, in the course of his address, designates as bishops, (Acts 20: 17.)</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/john-calvin.html">John Calvin</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Institutes of the Christian Religion</cite>, 4.3.8</span></figcaption>

</figure><figure class="quote" id="q-da4e78acf0" data-kw="">
<blockquote><p>It is the height of this bitter tyranny to act cruelly towards the wife by stripes or blows, which we do not read that any one among the heathen did unless he was drunk or mad. Hence the civil law [of England] permits the wife to avail herself of a divorce if she can prove that her husband has beaten her: and it gives as a reason that blows are foreign to a state of freedom, Cod. lib. 5, tit. 17, De repudiis and in Novell, Constit. 117. For no superiority whatever gives the power of coercing the inferior by blows. If two persons enter into a league of friendship on the condition that the younger shall obey the elder, and be directed in all things by his wisdom and discretion; he is bound to obedience by virtue of this contract: but if he refuse to do that, he cannot be forced to his duty by blows. The same must be said with regard to the matrimonial contract: for in this the husband and wife agree to a certain amicable fellowship in life, so that the wife is to be subject to her husband and directed by him; but as a companion, not as a slave; by advice, not by stripes. Aristotle gives this reason, because it is not ft to instil such fear into the wife, which may be injurious both to respect and love: but that servile fear which is instilled by blows is subversive of both. Neither is it fit that anyone should exercise power over another by constraint supported by no law; but that power of chastising a wife by stripes is supported by no law either divine or human. Finally add, that is not to be done which cannot be done without sin and what always derives its origin from this sin of bitterness. For although parents often chastise their children from love; yet both the experience and conscience of everyone will testify that no one proceeds to beat his wife except from anger, bitterness or hatred; all which are unlawful things and diametrically opposite to the matrimonial state. Therefore, let all bitterness be done away.</p></blockquote>

<div class="actions"><button class="copy" data-copy="“It is the height of this bitter tyranny to act cruelly towards the wife by stripes or blows, which we do not read that any one among the heathen did unless he was drunk or mad. Hence the civil law [of England] permits the wife to avail herself of a divorce if she can prove that her husband has beaten her: and it gives as a reason that blows are foreign to a state of freedom, Cod. lib. 5, tit. 17, De repudiis and in Novell, Constit. 117. For no superiority whatever gives the power of coercing the inferior by blows. If two persons enter into a league of friendship on the condition that the younger shall obey the elder, and be directed in all things by his wisdom and discretion; he is bound to obedience by virtue of this contract: but if he refuse to do that, he cannot be forced to his duty by blows. The same must be said with regard to the matrimonial contract: for in this the husband and wife agree to a certain amicable fellowship in life, so that the wife is to be subject to her husband and directed by him; but as a companion, not as a slave; by advice, not by stripes. Aristotle gives this reason, because it is not ft to instil such fear into the wife, which may be injurious both to respect and love: but that servile fear which is instilled by blows is subversive of both. Neither is it fit that anyone should exercise power over another by constraint supported by no law; but that power of chastising a wife by stripes is supported by no law either divine or human. Finally add, that is not to be done which cannot be done without sin and what always derives its origin from this sin of bitterness. For although parents often chastise their children from love; yet both the experience and conscience of everyone will testify that no one proceeds to beat his wife except from anger, bitterness or hatred; all which are unlawful things and diametrically opposite to the matrimonial state. Therefore, let all bitterness be done away.”

— John Davenant, An Exposition of, … Colossians tr. Josiah Allport (London: Hamilton, Adams, 1831), vol. 2, on Col. 3:19, pp. 167-68">Copy</button><a class="share" href="https://x.com/intent/post?text=%E2%80%9CIt+is+the+height+of+this+bitter+tyranny+to+act+cruelly+towards+the+wife+by+stripes+or+blows%2C+which+we+do+not+read+that+any+one+among+the+heathen+did+unless+he+was+drunk+or+mad.+Hence+the+civil+law+%5Bof+England%5D+permits+the+wife+to+avail+herself+of+a+divorce+if+she+can+prove+that+her+husband+has+beaten+her%3A+and+it+gives+as+a+reason+that+blows+are+foreign+to+a+state+of+freedom%2C+Cod.+lib.+5%2C+tit.+17%2C+De+repudiis+and+in+Novell%2C+Constit.+117.+For+no+superiority+whatever+gives+the+power+of+coercing+the+inferior+by+blows.+If+two+persons+enter+into+a+league+of+friendship+on+the+condition+that+the+younger+shall+obey+the+elder%2C+and+be+directed+in+all+things+by+his+wisdom+and+discretion%3B+he+is+bound+to+obedience+by+virtue+of+this+contract%3A+but+if+he+refuse+to+do+that%2C+he+cannot+be+forced+to+his+duty+by+blows.+The+same+must+be+said+with+regard+to+the+matrimonial+contract%3A+for+in+this+the+husband+and+wife+agree+to+a+certain+amicable+fellowship+in+life%2C+so+that+the+wife+is+to+be+subject+to+her+husband+and+directed+by+him%3B+but+as+a+companion%2C+not+as+a+slave%3B+by+advice%2C+not+by+stripes.+Aristotle+gives+this+reason%2C+because+it+is+not+ft+to+instil+such+fear+into+the+wife%2C+which+may+be+injurious+both+to+respect+and+love%3A+but+that+servile+fear+which+is+instilled+by+blows+is+subversive+of+both.+Neither+is+it+fit+that+anyone+should+exercise+power+over+another+by+constraint+supported+by+no+law%3B+but+that+power+of+chastising+a+wife+by+stripes+is+supported+by+no+law+either+divine+or+human.+Finally+add%2C+that+is+not+to+be+done+which+cannot+be+done+without+sin+and+what+always+derives+its+origin+from+this+sin+of+bitterness.+For+although+parents+often+chastise+their+children+from+love%3B+yet+both+the+experience+and+conscience+of+everyone+will+testify+that+no+one+proceeds+to+beat+his+wife+except+from+anger%2C+bitterness+or+hatred%3B+all+which+are+unlawful+things+and+diametrically+opposite+to+the+matrimonial+state.+Therefore%2C+let+all+bitterness+be+done+away.%E2%80%9D%0A%0A%E2%80%94+John+Davenant%2C+An+Exposition+of%2C+%E2%80%A6+Colossians+tr.+Josiah+Allport+%28London%3A+Hamilton%2C+Adams%2C+1831%29%2C+vol.+2%2C+on+Col.+3%3A19%2C+pp.+167-68&amp;url=https%3A%2F%2F5solasquotes.github.io%2Fquote%2Fda4e78acf0.html&amp;via=5Solas" target="_blank" rel="noopener">Share on X</a><a class="perma" href="../quote/da4e78acf0.html">Permalink</a><a class="src" href="https://reformedbooksonline.com/topics/ladies/#:~:text=It%20is%20the%20height%20of%20this,let%20all%20bitterness%20be%20done%20away&amp;text=It%20is%20the%20height%20of%20this%20bitter%20tyranny&amp;text=state.%20Therefore%2C%20let%20all%20bitterness%20be%20done%20away" rel="noopener" target="_blank">Read it online · Reformed Books Online</a></div>

<blockquote><p>Discoursing of Bishops, and having described their character, and the qualities which they ought to possess, and having passed over the order of Presbyters, he proceeds to that of Deacons. The reason of this omission was, that between Presbyters and Bishops there was no great difference. Both had undertaken the office of Teachers and Presidents in the Church, and what he has said concerning Bishops is applicable to Presbyters. For they are only superior in having the power of ordination, and seem to have no other advantage over Presbyters.</p></blockquote>

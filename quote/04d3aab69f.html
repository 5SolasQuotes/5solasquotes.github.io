<blockquote><p>And this disease [depression] is more formidable than any other because it commonly lasts very long. It is a long time before it has come to its height, and usually as long ere it declines again; and all this long season of its continuance is full of fear and torment, of horror and amazement. It is in every respect sad and overwhelming; it is a state of darkness that has no discernible beams of light. It is a land of darkness on which no sun at all seems to shine.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/timothy-rogers.html">Timothy Rogers</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Trouble of the Mind and the Disease of Melancholy</cite>, (1691; Morgan PA: Soli Deo Gloria, 2004), xxv.</span></figcaption>

<blockquote><p>This separation in Corinth was in a Church from the idolatry in it; which separation we allow, but not a separation out of a Church, else the words would bear that Paul will have them to forsake the Church of Corinth for idolatrous tables in it and set up a new Church of their own, which the Separatists dare not say, and is contrary to other places, 1 Cor. 5:4; chs. 11 &amp; 14, where he commands and allows their meetings and public Church-communion: Therefore this place proves not their point. What logic is this? Separate from idols, therefore separate from a Church where the true worship of God is professed and taught.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/john-currie.html">John Currie</a></span><span class="wk"><span class="lbl">Work:</span> <cite>An Essay on Separation</cite></span></figcaption>

</figure><figure class="quote" id="q-b9f6791d87" data-kw="">
<blockquote><p>I. We do each one for himself, profess our resolution, in the strength of Christ, to be faithful and diligent in the works of our ministry; and to live an holy and exemplary life, in piety, justice and charity, according to the measure of our abilities: Especially watching against those sins that tend to the corrupting or dividing of the Church, and to the hindering of our ministry; and to the dishonor of the Gospel, and of our holy profession.

II. We do profess our agreement and resolution in the strength of Christ, to be faithful and diligent in public preaching the Gospel: And in the personal instructing of all in our parishes, or undertaken limits, that will submit thereto; teaching the ignorant the principles of religion; endeavoring in love, compassion and meekness, and yet with seriousness and zeal, to convince the erroneous and opposers, to awaken the presumptuous and secure, and help them to try the state of their souls, and to see and feel their sin and misery, and return to God by Christ that they may live: to strengthen the weak; to raise the fallen; to edify and confirm the strong; and to comfort such as need consolation; and to help them all to prepare for death and judgment, and for everlasting life: And all this, as frequently, constantly and orderly, as our strength, and time, and greater duties will permit.

III. That the churches may be capable of the discipline of Christ, and constituted and ruled according to the Word of God, and the ends of our office and labors may be attained, we are agreed and resolved to take none for adult members of the churches committed to our special charge, nor admit them, as such, to church-communion and privileges, but those that have first made some personal credible profession of true Christianity, that is, of faith and obedience, and as members of those churches, submit to our pastoral oversight according to the Word of God. But all that make this profession of Christianity and consent to live in communion with the church, and under the ministry and discipline of Christ, we shall receive, though they be weak in knowledge, and utterance, and duties; and shall faithfully employ our ministerial abilities and care for their edification and salvation.

IV. We are agreed and resolved in the strength of Christ, while we have ability and opportunity, to congregate the people and hold constant assemblies, especially on the Lord’s Days; and therein faithfully to perform the works of our office, in reading the holy Scripture, preaching, praying, baptizing, praising God, celebrating the sacrament of the Lord’s Supper, and guiding the people in the whole public worship of God: And to manage our work with as much prudence, and reverence, and love, and compassion to the people’s souls, and with as much plainness and convincing evidence, authority, seriousness, and zealous importunity as we can: Avoiding as far as we are able, such things as corrupt and dishonor God’s ordinances, and tend to corrupt the people’s minds with error, presumption, deadness, negligence, or other distempers, displeasing to the Lord.

V. For the ends of our office, in obedience to the Lord, we agree and resolve in the strength of Christ, to exercise so much of church government and discipline, in the churches committed to our charge, as we discern to be our certain duty; that is, to keep order and decency in the holy assemblies, and see that all be done to edification: convicting seducers, and stopping the mouths of perverse gainsayers; overseeing the several members of our charge; and requiring them to walk obediently to Christ, and do their duties towards each other: to reprove the gross and scandalous offenders: and if they continue impenitent or unreformed, to tell the Church, or rebuke them before all; (and publicly pray for their recovery): And if they hear not the Church, but remain impenitent and unreformed, after sufficient reproof and patience, to put away such persons from among us, declaring against them the threatenings of the Lord, and requiring them to forbear communion with the Church, and requiring the church to avoid them, and have no familiarity or communion with them, as persons unmeet for the communion of saints. And those that credibly profess repentance, we are to absolve ministerially in the name of Christ, and comfort with the promises of grace; receiving them, and requiring the people to receive them, as brethren, into their communion: but warning them to watch and sin so no more, lest worse befall them. This holy discipline, by the help of God, we shall exercise faithfully and impartially, but yet with caution and moderation; neglecting no necessary consultations with other pastors, or concurrence of the Church: and consenting to be responsible for mal-administrations.

VI. For the communion of churches, and the strengthening ourselves for the work of God, and helping one another therein, and maintaining unity, love and concord, we do consent to hold a brotherly communion and correspondency: And to that end, when necessity or greater duty hinders us not, we shall meet at such convenient times and places, as shall be appointed or agreed on from time to time; and shall labor to improve these meetings to our mutual edification, in such consultations, conferences or other holy exercises, as our present case shall most require. And we consent to deal faithfully in advising and admonishing one another; and for the satisfaction of the brethren (to the forementioned ends) to be responsible, if any shall charge us with heresy, scandal, schism, or mal-administration: And forbearing matters without our line, to study and endeavor the promoting of truth, and holiness, and unity among ourselves, and with other churches, as we have a call. And also we agree by communicatory letters upon all needful occasions, to certify our brethren and other churches of the state of our affairs, and of particular members, that those that justly have communion in one church, or are excluded, may have communion with other churches, or be refused by them accordingly, when there is just occasion. And if any brethren or Churches be prevailed over so far by temptation, as unjustly to deny us their communion, in this way of Association, assemblies, or correspondency, we shall not therefore deny them to be our brethren, or churches of Christ, but shall love and own them, and have so much communion with them as their distance shall leave them capable of, if they join with us in the profession and practice of true Christianity, and of the points that are necessary to church-constitution and communion, and are not proved guilty of heresy, ungodliness, or such kind of schism or scandalous sins for which the Scripture commands us to reject men and avoid them. But such as are thus guilty (though they offer themselves to associate with us) we shall refuse to hold communion with, till they credibly profess repentance, and manifest a reformation.

VII. Because it is a matter of great concernment to the honor of Christ, the propagation of the Gospel, and the increase and welfare of the Church, that there be a provision of able, faithful ministers, and that unworthy persons be kept out; and because deceivers and unworthy men are forward to intrude, and the people ordinarily are insufficient of themselves to make such trial of men’s ability and soundness as is requisite to the safety of the Church; and the Church in all ages has received ministers by the ordination of other ministers of Christ: We do therefore agree to be careful and faithful in the discharge of our duties hereabout, so far as we can discern them, resolving that if any vacant church desire us to recommend a fit person to be their pastor, or to judge of any recommended to them, we will not recommend or approve of any, but such as we judge most agreeable to the will of Christ; nor will we prefer less fit and worthy men, for friendship or any carnal interest or respect. And if any intollerably unworthy person be about to intrude, or have intruded, or any neighbor church be about to choose, or have chosen such, if we have opportunity, we shall faithfully acquaint them with their sin and danger, and persuade them to a better course. And if we shall be called to invest any by solemn ordination in the sacred office of the ministry, we shall perform it, as near as we are able, according to the directions of the Word of God; admitting none that Christ excludes: And if it may be, we shall do it in that congregation which the person is to oversee, that so we may the better discern their mutual consent, inculcate their duties and engage them to a faithful performance thereof. And whereas it is much controverted of late whether the power of Ordination be given to the people or the pastors of a particular church, or the Associated neighbor pastors, and whether a stated president among these should not have a negative voice herein, we are agreed that leaving the people their due liberty of consent in the reception of their proper pastors, we will none of us singly ordain, without the assistance of other pastors: Nor will we join with any heretics or others, in unjust and impious ordinations that tend to the corrupting or dividing of the churches. And to avoid division upon a tolerable difference of opinions, where we may agree in practice, we consent that the Associations that have no stated presidents, or that give not to such a negative voice, shall receive into their communion those that are of the contrary opinion; giving them leave, if they desire it, to profess or record their opinion in that particular, so they will afterward walk among them in love and peace. And that the Associations that choose a stated president, and give him a negative voice in ordination, shall in like manner, and on like terms, receive into their communion, such as dissent in that particular, and having professed or recorded their dissent, will walk submissively in love and peace. Which liberty also of professing and recording their different principles, we desire may be allowed them, that join in synods, as being only for communion of churches, and them that join in them, as having a direct superior governing power over the particular pastors of the churches.

VIII. Though it be the surest way to peace and concord to take up with these necessary things, and we cannot approve of the narrow dividing principles of those men that will impose things unnecessary, to the excluding of the necessary, yet if our lawful rulers shall command it, or the peace of the Church through the distempers of the brethren shall require it, we shall obey, and consent in things that God has not forbidden; and if we suffer for well-doing, and for obeying God rather than men, we shall endeavor to imitate our Lord, who being reviled, reviled not again, and when he suffered, threatened not; but committed all to Him that judges righteously, 1 Pet. 2:23.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/richard-baxter.html">Richard Baxter</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Other citations (work not named)</cite>, The Christian Religion expressed: I. briefly in the Ancient Creeds, the Ten Commandments &amp; the Lord’s Prayer, and, II. more largely in a Profession taken out of the Holy Scriptures, containing 1. the articles of the Christian Belief, 2. our consent to the Gospel Covenant, 3. the Sum of Christian Duty according to the primitive simplicity, purity, and practice, fitted to the right instruction of the ignorant, the promoting of holiness, and the charitable concord of all true believers… (London: 1660) | The Agreement of the Associated Pastors</span></figcaption>

ently%2C+constantly+and+orderly%2C+as+our+strength%2C+and+time%2C+and+greater+duties+will+permit.+III.+That+the+churches+may+be+capable+of+the+discipline+of+Christ%2C+and+constituted+and+ruled+according+to+the+Word+of+God%2C+and+the+ends+of+our+office+and+labors+may+be+attained%2C+we+are+agreed+and+resolved+to+take+none+for+adult+members+of+the+churches+committed+to+our+special+charge%2C+nor+admit+them%2C+as+such%2C+to+church-communion+and+privileges%2C+but+those+that+have+first+made+some+personal+credible+profession+of+true+Christianity%2C+that+is%2C+of+faith+and+obedience%2C+and+as+members+of+those+churches%2C+submit+to+our+pastoral+oversight+according+to+the+Word+of+God.+But+all+that+make+this+profession+of+Christianity+and+consent+to+live+in+communion+with+the+church%2C+and+under+the+ministry+and+discipline+of+Christ%2C+we+shall+receive%2C+though+they+be+weak+in+knowledge%2C+and+utterance%2C+and+duties%3B+and+shall+faithfully+employ+our+ministerial+abilities+and+care+for+their+edification+and+salvation.+IV.+We+are+agreed+and+resolved+in+the+strength+of+Christ%2C+while+we+have+ability+and+opportunity%2C+to+congregate+the+people+and+hold+constant+assemblies%2C+especially+on+the+Lord%E2%80%99s+Days%3B+and+therein+faithfully+to+perform+the+works+of+our+office%2C+in+reading+the+holy+Scripture%2C+preaching%2C+praying%2C+baptizing%2C+praising+God%2C+celebrating+the+sacrament+of+the+Lord%E2%80%99s+Supper%2C+and+guiding+the+people+in+the+whole+public+worship+of+God%3A+And+to+manage+our+work+with+as+much+prudence%2C+and+reverence%2C+and+love%2C+and+compassion+to+the+people%E2%80%99s+souls%2C+and+with+as+much+plainness+and+convincing+evidence%2C+authority%2C+seriousness%2C+and+zealous+importunity+as+we+can%3A+Avoiding+as+far+as+we+are+able%2C+such+things+as+corrupt+and+dishonor+God%E2%80%99s+ordinances%2C+and+tend+to+corrupt+the+people%E2%80%99s+minds+with+error%2C+presumption%2C+deadness%2C+negligence%2C+or+other+distempers%2C+displeasing+to+the+Lord.+V.+For+the+ends+of+our+office%2C+in+obedience+to+the+Lord%2C+we+agree+and+resolve+in+the+strength+of+Christ%2C+to+exercise+so+much+of+church+government+and+discipline%2C+in+the+churches+committed+to+our+charge%2C+as+we+discern+to+be+our+certain+duty%3B+that+is%2C+to+keep+order+and+decency+in+the+holy+assemblies%2C+and+see+that+all+be+done+to+edification%3A+convicting+seducers%2C+and+stopping+the+mouths+of+perverse+gainsayers%3B+overseeing+the+several+members+of+our+charge%3B+and+requiring+them+to+walk+obediently+to+Christ%2C+and+do+their+duties+towards+each+other%3A+to+reprove+the+gross+and+scandalous+offenders%3A+and+if+they+continue+impenitent+or+unreformed%2C+to+tell+the+Church%2C+or+rebuke+them+before+all%3B+%28and+publicly+pray+for+their+recovery%29%3A+And+if+they+hear+not+the+Church%2C+but+remain+impenitent+and+unreformed%2C+after+sufficient+reproof+and+patience%2C+to+put+away+such+persons+from+among+us%2C+declaring+against+them+the+threatenings+of+the+Lord%2C+and+requiring+them+to+forbear+communion+with+the+Church%2C+and+requiring+the+church+to+avoid+them%2C+and+have+no+familiarity+or+communion+with+them%2C+as+persons+unmeet+for+the+communion+of+saints.+And+those+that+credibly+profess+repentance%2C+we+are+to+absolve+ministerially+in+the+name+of+Christ%2C+and+comfort+with+the+promises+of+grace%3B+receiving+them%2C+and+requiring+the+people+to+receive+them%2C+as+brethren%2C+into+their+communion%3A+but+warning+them+to+watch+and+sin+so+no+more%2C+lest+worse+befall+them.+This+holy+discipline%2C+by+the+help+of+God%2C+we+shall+exercise+faithfully+and+impartially%2C+but+yet+with+caution+and+moderation%3B+neglecting+no+necessary+consultations+with+other+pastors%2C+or+concurrence+of+the+Church%3A+and+consenting+to+be+responsible+for+mal-administrations.+VI.+For+the+communion+of+churches%2C+and+the+strengthening+ourselves+for+the+work+of+God%2C+and+helping+one+another+therein%2C+and+maintaining+unity%2C+love+and+concord%2C+we+do+consent+to+hold+a+brotherly+communion+and+correspondency%3A+And+to+that+end%2C+when+necessity+or+greater+duty+hinders+us+not%2C+we+shall+meet+at+such+convenient+times+and+places%2C+as+shall+be+appointed+or+agreed+on+from+time+to+time%3B+and+shall+labor+to+improve+these+meetings+to+our+mutual+edification%2C+in+such+consultations%2C+conferences+or+other+holy+exercises%2C+as+our+present+case+shall+most+require.+And+we+consent+to+deal+faithfully+in+advising+and+admonishing+one+another%3B+and+for+the+satisfaction+of+the+brethren+%28to+the+forementioned+ends%29+to+be+responsible%2C+if+any+shall+charge+us+with+heresy%2C+scandal%2C+schism%2C+or+mal-administration%3A+And+forbearing+matters+without+our+line%2C+to+study+and+endeavor+the+promoting+of+truth%2C+and+holiness%2C+and+unity+among+ourselves%2C+and+with+other+churches%2C+as+we+have+a+call.+And+also+we+agree+by+communicatory+letters+upon+all+needful+occasions%2C+to+certify+our+brethren+and+other+churches+of+the+state+of+our+affairs%2C+and+of+particular+members%2C+that+those+that+justly+have+communion+in+one+church%2C+or+are+excluded%2C+may+have+communion+with+other+churches%2C+or+be+refused+by+them+accordingly%2C+when+there+is+just+occasion.+And+if+any+brethren+or+Churches+be+prevailed+over+so+far+by+temptation%2C+as+unjustly+to+deny+us+their+communion%2C+in+this+way+of+Association%2C+assemblies%2C+or+correspondency%2C+we+shall+not+therefore+deny+them+to+be+our+brethren%2C+or+churches+of+Christ%2C+but+shall+love+and+own+them%2C+and+have+so+much+communion+with+them+as+their+distance+shall+leave+them+capable+of%2C+if+they+join+with+us+in+the+profession+and+practice+of+true+Christianity%2C+and+of+the+points+that+are+necessary+to+church-constitution+and+communion%2C+and+are+not+proved+guilty+of+heresy%2C+ungodliness%2C+or+such+kind+of+schism+or+scandalous+sins+for+which+the+Scripture+commands+us+to+reject+men+and+avoid+them.+But+such+as+are+thus+guilty+%28though+they+offer+themselves+to+associate+with+us%29+we+shall+refuse+to+hold+communion+with%2C+till+they+credibly+profess+repentance%2C+and+manifest+a+reformation.+VII.+Because+it+is+a+matter+of+great+concernment+to+the+honor+of+Christ%2C+the+propagation+of+the+Gospel%2C+and+the+increase+and+welfare+of+the+Church%2C+that+there+be+a+provision+of+able%2C+faithful+ministers%2C+and+that+unworthy+persons+be+kept+out%3B+and+because+deceivers+and+unworthy+men+are+forward+to+intrude%2C+and+the+people+ordinarily+are+insufficient+of+themselves+to+make+such+trial+of+men%E2%80%99s+ability+and+soundness+as+is+requisite+to+the+safety+of+the+Church%3B+and+the+Church+in+all+ages+has+received+ministers+by+the+ordination+of+other+ministers+of+Christ%3A+We+do+therefore+agree+to+be+careful+and+faithful+in+the+discharge+of+our+duties+hereabout%2C+so+far+as+we+can+discern+them%2C+resolving+that+if+any+vacant+church+desire+us+to+recommend+a+fit+person+to+be+their+pastor%2C+or+to+judge+of+any+recommended+to+them%2C+we+will+not+recommend+or+approve+of+any%2C+but+such+as+we+judge+most+agreeable+to+the+will+of+Christ%3B+nor+will+we+prefer+less+fit+and+worthy+men%2C+for+friendship+or+any+carnal+interest+or+respect.+And+if+any+intollerably+unworthy+person+be+about+to+intrude%2C+or+have+intruded%2C+or+any+neighbor+church+be+about+to+choose%2C+or+have+chosen+such%2C+if+we+have+opportunity%2C+we+shall+faithfully+acquaint+them+with+their+sin+and+danger%2C+and+persuade+them+to+a+better+course.+And+if+we+shall+be+called+to+invest+any+by+solemn+ordination+in+the+sacred+office+of+the+ministry%2C+we+shall+perform+it%2C+as+near+as+we+are+able%2C+according+to+the+directions+of+the+Word+of+God%3B+admitting+none+that+Christ+excludes%3A+And+if+it+may+be%2C+we+shall+do+it+in+that+congregation+which+the+person+is+to+oversee%2C+that+so+we+may+the+better+discern+their+mutual+consent%2C+inculcate+their+duties+and+engage+them+to+a+faithful+performance+thereof.+And+whereas+it+is+much+controverted+of+late+whether+the+power+of+Ordination+be+given+to+the+people+or+the+pastors+of+a+particular+church%2C+or+the+Associated+neighbor+pastors%2C+and+whether+a+stated+president+among+these+should+not+have+a+negative+voice+herein%2C+we+are+agreed+that+leaving+the+people+their+due+liberty+of+consent+in+the+reception+of+their+proper+pastors%2C+we+will+none+of+us+singly+ordain%2C+without+the+assistance+of+other+pastors%3A+Nor+will+we+join+with+any+heretics+or+others%2C+in+unjust+and+impious+ordinations+that+tend+to+the+corrupting+or+dividing+of+the+churches.+And+to+avoid+division+upon+a+tolerable+difference+of+opinions%2C+where+we+may+agree+in+practice%2C+we+consent+that+the+Associations+that+have+no+stated+presidents%2C+or+that+give+not+to+such+a+negative+voice%2C+shall+receive+into+their+communion+those+that+are+of+the+contrary+opinion%3B+giving+them+leave%2C+if+they+desire+it%2C+to+profess+or+record+their+opinion+in+that+particular%2C+so+they+will+afterward+walk+among+them+in+love+and+peace.+And+that+the+Associations+that+choose+a+stated+president%2C+and+give+him+a+negative+voice+in+ordination%2C+shall+in+like+manner%2C+and+on+like+terms%2C+receive+into+their+communion%2C+such+as+dissent+in+that+particular%2C+and+having+professed+or+recorded+their+dissent%2C+will+walk+submissively+in+love+and+peace.+Which+liberty+also+of+professing+and+recording+their+different+principles%2C+we+desire+may+be+allowed+them%2C+that+join+in+synods%2C+as+being+only+for+communion+of+churches%2C+and+them+that+join+in+them%2C+as+having+a+direct+superior+governing+power+over+the+particular+pastors+of+the+churches.+VIII.+Though+it+be+the+surest+way+to+peace+and+concord+to+take+up+with+these+necessary+things%2C+and+we+cannot+approve+of+the+narrow+dividing+principles+of+those+men+that+will+impose+things+unnecessary%2C+to+the+excluding+of+the+necessary%2C+yet+if+our+lawful+rulers+shall+command+it%2C+or+the+peace+of+the+Church+through+the+distempers+of+the+brethren+shall+require+it%2C+we+shall+obey%2C+and+consent+in+things+that+God+has+not+forbidden%3B+and+if+we+suffer+for+well-doing%2C+and+for+obeying+God+rather+than+men%2C+we+shall+endeavor+to+imitate+our+Lord%2C+who+being+reviled%2C+reviled+not+again%2C+and+when+he+suffered%2C+threatened+not%3B+but+committed+all+to+Him+that+judges+righteously%2C+1+Pet.+2%3A23.%E2%80%9D%0A%0A%E2%80%94+Richard+Baxter%2C+Other+citations+%28work+not+named%29%2C+The+Christian+Religion+expressed%3A+I.+briefly+in+the+Ancient+Creeds%2C+the+Ten+Commandments+%26+the+Lord%E2%80%99s+Prayer%2C+and%2C+II.+more+largely+in+a+Profession+taken+out+of+the+Holy+Scriptures%2C+containing+1.+the+articles+of+the+Christian+Belief%2C+2.+our+consent+to+the+Gospel+Covenant%2C+3.+the+Sum+of+Christian+Duty+according+to+the+primitive+simplicity%2C+purity%2C+and+practice%2C+fitted+to+the+right+instruction+of+the+ignorant%2C+the+promoting+of+holiness%2C+and+the+charitable+concord+of+all+true+believers%E2%80%A6+%28London%3A+1660%29+%7C+The+Agreement+of+the+Associated+Pastors&amp;url=https%3A%2F%2F5solasquotes.github.io%2Fquote%2Fb9f6791d87.html&amp;via=5Solas" target="_blank" rel="noopener">Share on X</a><a class="perma" href="../quote/b9f6791d87.html">Permalink</a><a class="src" href="https://reformedbooksonline.com/that-union-in-at-least-christianitys-fundamentals-is-obliging/#:~:text=I.%20We%20do%20each%20one%20for,that%20judges%20righteously%2C%201%20Pet.%202%3A23&amp;text=I.%20We%20do%20each%20one%20for%20himself%2C%20profess&amp;text=to%20Him%20that%20judges%20righteously%2C%201%20Pet.%202%3A23" rel="noopener" target="_blank">Read it online · Reformed Books Online</a></div>

<blockquote><p>Doctrine: We must if occasion require commend good Christians to others. So does Paul Phoebe here, and many others in his epistles. So did the brethren at Lystra and Iconium commend Timothy to Paul, Acts 16:2. So did the Brethren commend Gaius to John, 3 Jn. v. 3, and John, Demetrius, 3 Jn. 12. And in the primative Church it was so ordinary to give Christians letters of commendations, that he which acknowledged them not, was taxed as if he had denyed the faith. And there is great reason for it: For first it concerns them which are requested to commend, that they may show their charity: Secondly, the commended, that they may bee holpen. Thirdly, them to whom, that they may do good to the worthy, and not be deceived by the unworthy.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/elnathan-parr.html">Elnathan Parr</a></span><span class="wk"><span class="lbl">Work:</span> <cite>A Plain Exposition upon the Whole Thirteenth, Fourteenth, Fifteenth &amp; Sixteenth Chapters of the Epistle of Saint Paul to the Romans</cite>, … (London: Eld, 1622), on Rom. 16:1-2, p. 314 Parr makes letters of commendation a duty of common Christian charity.</span></figcaption>

<div class="actions"><button class="copy" data-copy="“Doctrine: We must if occasion require commend good Christians to others. So does Paul Phoebe here, and many others in his epistles. So did the brethren at Lystra and Iconium commend Timothy to Paul, Acts 16:2. So did the Brethren commend Gaius to John, 3 Jn. v. 3, and John, Demetrius, 3 Jn. 12. And in the primative Church it was so ordinary to give Christians letters of commendations, that he which acknowledged them not, was taxed as if he had denyed the faith. And there is great reason for it: For first it concerns them which are requested to commend, that they may show their charity: Secondly, the commended, that they may bee holpen. Thirdly, them to whom, that they may do good to the worthy, and not be deceived by the unworthy.”

— Elnathan Parr, A Plain Exposition upon the Whole Thirteenth, Fourteenth, Fifteenth &amp; Sixteenth Chapters of the Epistle of Saint Paul to the Romans, … (London: Eld, 1622), on Rom. 16:1-2, p. 314 Parr makes letters of commendation a duty of common Christian charity.">Copy</button><a class="share" href="https://x.com/intent/post?text=%E2%80%9CDoctrine%3A+We+must+if+occasion+require+commend+good+Christians+to+others.+So+does+Paul+Phoebe+here%2C+and+many+others+in+his+epistles.+So+did+the+brethren+at+Lystra+and+Iconium+commend+Timothy+to+Paul%2C+Acts+16%3A2.+So+did+the+Brethren+commend+Gaius+to+John%2C+3+Jn.+v.+3%2C+and+John%2C+Demetrius%2C+3+Jn.+12.+And+in+the+primative+Church+it+was+so+ordinary+to+give+Christians+letters+of+commendations%2C+that+he+which+acknowledged+them+not%2C+was+taxed+as+if+he+had+denyed+the+faith.+And+there+is+great+reason+for+it%3A+For+first+it+concerns+them+which+are+requested+to+commend%2C+that+they+may+show+their+charity%3A+Secondly%2C+the+commended%2C+that+they+may+bee+holpen.+Thirdly%2C+them+to+whom%2C+that+they+may+do+good+to+the+worthy%2C+and+not+be+deceived+by+the+unworthy.%E2%80%9D%0A%0A%E2%80%94+Elnathan+Parr%2C+A+Plain+Exposition+upon+the+Whole+Thirteenth%2C+Fourteenth%2C+Fifteenth+%26+Sixteenth+Chapters+of+the+Epistle+of+Saint+Paul+to+the+Romans%2C+%E2%80%A6+%28London%3A+Eld%2C+1622%29%2C+on+Rom.+16%3A1-2%2C+p.+314+Parr+makes+letters+of+commendation+a+duty+of+common+Christian+charity.&amp;url=https%3A%2F%2F5solasquotes.github.io%2Fquote%2Ff3f8d866d3.html&amp;via=5Solas" target="_blank" rel="noopener">Share on X</a><a class="perma" href="../quote/f3f8d866d3.html">Permalink</a><a class="src" href="https://reformedbooksonline.com/on-leaving-a-congregation/#:~:text=Doctrine%3A%20We%20must%20if%20occasion%20require,not%20be%20deceived%20by%20the%20unworthy&amp;text=Doctrine%3A%20We%20must%20if%20occasion%20require%20commend%20good&amp;text=worthy%2C%20and%20not%20be%20deceived%20by%20the%20unworthy" rel="noopener" target="_blank">Rea

<main class="wrap"><figure class="quote" id="q-987794b041" data-kw="">
<blockquote><p>V. The notion of regeneration broadly taken is distinguished from the event into ἀργόν [argon, inactive] and ἐνεργῆ [energē, active]. The former is of infants dying before the use of reason. The latter is of adults. Which again is distinguished into that of the first and second moment. The former is that which has for its terminus and formal effect the new creature in the first act, or the spiritual man. The latter is that which has for its terminus and formal effect the second acts of the new creature, or the regenerate man actually exercising and eliciting the motions of faith, repentance, etc. The cause of the former is operating, preventing, or first grace; of the latter, cooperating, second, or subsequent grace. The former impresses new habits or faculties, namely, by informing the mind and will with them and rendering them fit; the latter impresses new motions or acts, namely, by applying the will to them and premoving and preceding it and influencing into it, and thus concurring with it to one and the same effect, and efficiently influencing into the same effect, that is, co-producing it. The former is simply instantaneous; the latter, as to its whole complex, successive.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/gisbertus-voetius.html">Gisbertus Voetius</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Disputation 30, ‘On Regeneration’, pt. 2 (1639) tr. AI by Roman Prestarri in Select Theological Disputations (1655), vol. 2, pp. 447ff. Latin at Confessionally Reformed Theology</cite></span></figcaption>

</figure><figure class="quote" id="q-cb745e6f1b" data-kw="">
<blockquote><p>13. There is therefore some notable difference between that work of the Spirit by which we first repent and believe, and so have our title to the promise of the Spirit, and that gift of the Spirit which is promised to believers: which is not only the Spirit of miracles given in the first times, but some notable degree of love to our reconciled Father, suitable to the grace and Gospel of redemption and reconciliation, and is called the Spirit of Christ, and the Spirit of adoption (Rom. 8:9, 16, •5.), which the apostles themselves seem not to have received till Christ’s ascension: And this seems to be not only different from the gifts of the Spirit common to hypocrites and unbelievers, but also from the special gift of the Spirit which makes men believers: So that Mr. Thomas Hooker says truer than once I understood, that vocation is a special grace of the Spirit, distinct from common grace on one side, and from sanctification on the other side. Whether it be the same degree of the Spirit which the faithful had before Christ’s incarnation, which causes men first to believe, distinct from the higher following degree, I leave to enquiry: But the certainest distinction is from the different effects.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/richard-baxter.html">Richard Baxter</a></span><span class="wk"><span class="lbl">Work:</span> <cite>A Christian Directory... (London: 1673), Question 42, ‘But the great question is, How the Holy Ghost is given to infants in baptism?…’</cite>, p. 819</span></figcaption>

<blockquote><p>3… Next, man’s mind is moved toward God by the Holy Spirit through Christ and this movement is through faith. Through this [faith] man’s mind believes with certainty all that God has transmitted [tradita], and also with full certainty and without doubt assents to the promises made to us by God who, as stated in the psalm [144:13], is faithful in all his words. From there he acquires confidence [fiduciam] on account of God’s promise, by which he has pledged that he will remit sins freely and that he will adopt as children those who believe in Christ, those I say who repent of their former life. By this faith, he is lifted up to God by the Holy Spirit and so he receives the Holy Spirit, remission of sins, imputation of righteousness and countless other gifts.</p></blockquote>

<main class="wrap"><figure class="quote" id="q-a2de629b3f" data-kw="">
<blockquote><p>Did God then before he made man, determine to save some, &amp; reject others?

Ans. Yes surely, before they had done either good or evil, God in his eternal counsel set some apart, upon whom he would in time shew the riches of his mercy, and determined to withhold the same from others, on whom he would shew the severity of his wrath.

What should move God to make this difference between Man and Man?

Ans. Only his own pleasure, whereby having purposed to create man for his own Glory, forasmuch as he was not bound to shew mercy unto any, and his Glory should appear as well in executing of justice, as in shewing mercy; It seemed good unto His Heavenly wisdom to chose out a certain number towards whom he would extend his undeserved mercy, leaving the rest to be spectacles of his justice.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/james-ussher.html">James Ussher</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Principles of Christian Religion Summarily set down according to the Word of God: together with A Brief Epitome of the Body of Divinity</cite>, (London: Geo. Badger, 1645), pp 58-60.</span></figcaption>

</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-c9e0c178a3" data-kw="">
<blockquote><p>In election, believers were from all eternity given to Jesus Christ. As believers were chosen from all eternity, so Christ was from eternity chosen and appointed to be their redeemer, and he undertook the work of redeeming them. But there was a covenant about it between the Father and Son. Christ, as we have already observed, loved them. This is the account he gives of himself, how it was with him before the world, and one thing is that then he rejoiced in the habitable parts of God’s earth and his delights were with the sons of men [Proverbs 8:31].

And when he undertook for them, he knew what success he should have. God promised him a certain number, and he had their names, as it were, written in a book; and therefore the book of life is called the Lamb’s book; Revelation 21:27, “but they that are written in the Lamb’s book of life.” And he bears their names upon his heart, as the high priest of old did the names of the tribes of the children of Israel on his breastplate [Exodus 28:29].

Christ often calls the elect those that God had given him; John 17:2, “As thou hast given him power over all flesh, that he should give eternal life to as many as thou hast given him”; and again, in John 17:9, “I pray not for the world, but for them which thou hast given me”; John 17:11, “Keep through thy name those whom thou hast given me.</p></blockquote>

</figure><figure class="quote" id="q-5959a001fb" data-kw="">
<blockquote><p>In the following extract, John Knox explains that the civil magistrate is to rule according to scripture alone. Libertarian Theologians and the advocates of Two-Kingdoms establishmentarianism agree that the role of the state is determined by the word of God. They differ, however, when it comes to determining precisely what the role of the state is. Upon first reading, we might be tempted to think that Knox’s argument supports Libertarian Theology; for this reason, footnotes have been added to elucidate Knox’s meaning:

St Paul in few words declareth the end wherefore the sword is committed to the powers, saying, it is ‘to the punishment of the the wicked doers, and to the praise of such as do well’ (Rom. 13). Of which words it is evident, that the sword of God is not committed to the hand of man, to use as it pleaseth him; but only, to punish vice, maintain virtue,[1] that men may live in such society as before God is acceptable. And this is the very and only cause why God hath appointed powers in this earth. For such is the furious rage of man’s corrupt nature, that unless severe punishment were appointed, and put in execution upon malefactors, better it were that man should live among brute and wild beasts, than among men. But at present, I dare not enter into the description of this common-place, for so should I not satisfy the text, which by God’s grace I purpose to absolve [open up]. This only by the way I would, that such as are placed in authority, should consider, whether they reign and rule by God, so that God ruleth them; or, if they rule without, besides, and against God; of whom our prophet here doth complain.

If any lust to take trial of this point, it is not hard; for Moses in the election of judges, and of a king, describeth not only what persons shall be chosen to that honour, but doth also give to him that is elected and chosen, the rule, by the which he shall try himself whether God reign in him or not; saying, ‘When he shall sit upon the throne of his kingdom, he shall write to himself an exemplar of this law in a book, but the priests the Levites: it shall be with him, and he shall read therein all the days of his life, that he may learn to fear the Lord his God, and to keep all the words of this law, and these statutes, that he may do them; that his heart be not lifted up above his brethren, and that he turn not from the commandment, to the right hand, or to the left (Deut. 17). The same is repeated to Joshua, in his inauguration to the government of the people, by God himself, saying, ‘Let not the book of this law depart from thy mouth, but mediate in it day and night, that thou mayest keep and do all that which is written in it. For then shall thy way be prosperous, and thou shalt do prudently’ (Josh. 1).[2]

The first thing then that God craveth of him that is called to the honour of a king, is, the knowledge of his will revealed in his Word: the second, is an upright and willing mind to put in execution such things as God commandeth in his law, without declining either to the right hand or to the left.

Kings then have not absolute power to do in their regiment what pleaseth them; but their power is limited by God’s Word. So that if they strike where God commandeth not, they are but murderers; and if, they spare, where God commandeth to strike, they and their throne are criminal, and guilty of the wickedness that aboundeth upon the face of the earth for lack of punishment. Oh, if kings and princes would consider what account shall be craved of them, as well of their ignorance and misknowledge of God’s will, as for the neglecting of their office!</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/john-knox.html">John Knox</a></span><span class="wk"><span class="lbl">Work:</span> <cite>A sermon preached by John Knox, minister of Christ Jesus, in the church of Edinburgh, upon Sunday, August 19, 1565, for the which he has forbidden to preach for a season in R. S. Candlish (ed.), Select practical writings of John Knox</cite></span></figcaption>

— John Knox, A sermon preached by John Knox, minister of Christ Jesus, in the church of Edinburgh, upon Sunday, August 19, 1565, for the which he has forbidden to preach for a season in R. S. Candlish (ed.), Select practical writings of John Knox">Copy</button><a class="share" href="https://x.com/intent/post?text=%E2%80%9CIn+the+following+extract%2C+John+Knox+explains+that+the+civil+magistrate+is+to+rule+according+to+scripture+alone.+Libertarian+Theologians+and+the+advocates+of+Two-Kingdoms+establishmentarianism+agree+that+the+role+of+the+state+is+determined+by+the+word+of+God.+They+differ%2C+however%2C+when+it+comes+to+determining+precisely+what+the+role+of+the+state+is.+Upon+first+reading%2C+we+might+be+tempted+to+think+that+Knox%E2%80%99s+argument+supports+Libertarian+Theology%3B+for+this+reason%2C+footnotes+have+been+added+to+elucidate+Knox%E2%80%99s+meaning%3A%0A%0ASt+Paul+in+few+words+declareth+the+end+wherefore+the+sword+is+committed+to+the+powers%2C+saying%2C+it+is+%E2%80%98to+the+punishment+of+the+the+wicked+doers%2C+and+to+the+praise+of+such+as+do+well%E2%80%99+%28Rom.+13%29.+Of+which+words+it+is+evident%2C+that+the+sword+of+God+is+not+committed+to+the+hand+of+man%2C+to+use+as+it+pleaseth+him%3B+but+only%2C+to+punish+vice%2C+maintain+virtue%2C%5B1%5D+that+men+may+live+in+such+society+as+before+God+is+acceptable.+And+this+is+the+very+and+only+cause+why+God+hath+appointed+powers+in+this+earth.+For+such+is+the+furious+rage+of+man%E2%80%99s+corrupt+nature%2C+that+unless+severe+punishment+were+appointed%2C+and+put+in+execution+upon+malefactors%2C+better+it+were+that+man+should+live+among+brute+and+wild+beasts%2C+than+among+men.+But+at+present%2C+I+dare+not+enter+into+the+description+of+this+common-place%2C+for+so+should+I+not+satisfy+the+text%2C+which+by+God%E2%80%99s+grace+I+purpose+to+absolve+%5Bopen+up%5D.+This+only+by+the+way+I+would%2C+that+such+as+are+placed+in+authority%2C+should+consider%2C+whether+they+reign+and+rule+by+God%2C+so+that+God+ruleth+them%3B+or%2C+if+they+rule+without%2C+besides%2C+and+against+God%3B+of+whom+our+prophet+here+doth+complain.%0A%0AIf+any+lust+to+take+trial+of+this+point%2C+it+is+not+hard%3B+for+Moses+in+the+election+of+judges%2C+and+of+a+king%2C+describeth+not+only+what+persons+shall+be+chosen+to+that+honour%2C+but+doth+also+give+to+him+that+is+elected+and+chosen%2C+the+rule%2C+by+the+which+he+shall+try+himself+whether+God+reign+in+him+or+not%3B+saying%2C+%E2%80%98When+he+shall+sit+upon+the+throne+of+his+kingdom%2C+he+shall+write+to+himself+an+exemplar+of+this+law+in+a+book%2C+but+the+priests+the+Levites%3A+it+shall+be+with+him%2C+and+he+shall+read+therein+all+the+days+of+his+life%2C+that+he+may+learn+to+fear+the+Lord+his+God%2C+and+to+keep+all+the+words+of+this+law%2C+and+these+statutes%2C+that+he+may+do+them%3B+that+his+heart+be+not+lifted+up+above+his+brethren%2C+and+that+he+turn+not+from+the+commandment%2C+to+the+right+hand%2C+or+to+the+left+%28Deut.+17%29.+The+same+is+repeated+to+Joshua%2C+in+his+inauguration+to+the+government+of+the+people%2C+by+God+himself%2C+saying%2C+%E2%80%98Let+not+the+book+of+this+law+depart+from+thy+mouth%2C+but+mediate+in+it+day+and+night%2C+that+thou+mayest+keep+and+do+all+that+which+is+written+in+it.+For+then+shall+thy+way+be+prosperous%2C+and+thou+shalt+do+prudently%E2%80%99+%28Josh.+1%29.%5B2%5D%0A%0AThe+first+thing+then+that+God+craveth+of+him+that+is+called+to+the+honour+of+a+king%2C+is%2C+the+knowledge+of+his+will+revealed+in+his+Word%3A+the+second%2C+is+an+upright+and+willing+mind+to+put+in+execution+such+things+as+God+commandeth+in+his+law%2C+without+declining+either+to+the+right+hand+or+to+the+left.%0A%0AKings+then+have+not+absolute+power+to+do+in+their+regiment+what+pleaseth+them%3B+but+their+power+is+limited+by+God%E2%80%99s+Word.+So+that+if+they+strike+where+God+commandeth+not%2C+they+are+but+murderers%3B+and+if%2C+they+spare%2C+where+God+commandeth+to+strike%2C+they+and+their+throne+are+criminal%2C+and+guilty+of+the+wickedness+that+aboundeth+upon+the+face+of+the+earth+for+lack+of+punishment.+Oh%2C+if+kings+and+princes+would+consider+what+account+shall+be+craved+of+them%2C+as+well+of+their+ignorance+and+misknowledge+of+God%E2%80%99s+will%2C+as+for+the+neglecting+of+their+office%21%E2%80%9D%0A%0A%E2%80%94+John+Knox%2C+A+sermon+preached+by+John+Knox%2C+minister+of+Christ+Jesus%2C+in+the+church+of+Edinburgh%2C+upon+Sunday%2C+August+19%2C+1565%2C+for+the+which+he+has+forbidden+to+preach+for+a+season+in+R.+S.+Candlish+%28ed.%29%2C+Select+practical+writings+of+John+Knox&amp;url=https%3A%2F%2F5solasquotes.github.io%2Fquote%2F5959a001fb.html&amp;via=5Solas" target="_blank" rel="noopener">Share on X</a><a class="perma" href="../quote/5959a001fb.html">Permalink</a><a class="src" href="https://reformedcovenanter.wordpress.com/2012/06/06/john-knox-on-sola-scriptura-and-the-state/" rel="noopener" target="_blank">Read it online · Reformed Covenanter</a></div>

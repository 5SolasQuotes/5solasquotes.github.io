<blockquote><p>I confess that we being free in Christ, are not bound to the Civil Laws of Moses in every circumstance; yet seeing no laws can be more honest, just and wholesome, than those which God Himself gave, who is eternal Wisdom and Goodness, I see not why Christians, in things which no less appertain to them, ought not to follow the Law of God, rather than of any men…</p></blockquote>

</figure><figure class="quote" id="q-9cdcbe8cb2" data-kw="">
<blockquote><p>Now all this being unquestionably true of the Jewish Sanhedrin: if we should suppose, that they had no supreme Sanhedrin but that which had the power of civil Magistracy, then I ask where is that Christian State, which was, or is, or ought to be molded according to this pattern. Must ministers have vote in parliament? Must they be civil lawyers? Must all criminal and capital judgments be according to the Judicial Law of Moses, and none otherwise? Must there be no civil punishment, without previous admonition of the offender? Must Parliaments sit, as it were in the Temple of God, and interpret Scripture, which sense is true, and which false, and determine controversies of faith and cases of conscience, and judge of all false doctrines? Yet all this must be if there be a parallel made with the Jewish Sanhedrin. I know some divines hold, that the Judicial Law of Moses, so far as concerns the punishments of sins against the moral Law, idolatry, blasphemy, Sabbath-breaking, adultery, theft, etc. ought to be a rule to the Christian Magistrate. and for my part, I wish more respect were had to it, and that it were more consulted with.</p></blockquote>

<blockquote><p>The enactment of law is the process by which the magistrate, with the consent of the optimates and estates of his imperium and realm, legislates what is fair, useful, and necessary to the commonwealth.4 The magistrate shall especially see that the customs, temperament, and ancient rights of the nation are respected, and that new laws are accommodated to them.</p></blockquote>

</figure><figure class="quote" id="q-020063863f" data-kw="">
<blockquote><p>Answer: Though the violation of the general [moral] law hurts the conscience, it being against the Fifth Commandment; it follows not that the violation of every particular law, even that that is merely positive, hurts the conscience before God: For then the carrying of armor in the night [which is suspicious of violence and may be dangerous to a town], suppose no ruler on earth make a law there anent, should be a sin before God, which no wise-man can say. 2. The other reason is more important, and draws with it that school-question agitated by [civil] jurists also and [ecclesiastical] canonists, An ulla detur lex pure paenalis; ‘If there be a law purely penal,’ without sin in it: And if the law of rulers in things merely positive be merely penal and co-active, and not formally obliging [connected] to sin. But I Answer: Rulers do justly punish the transgression of a positive law, not as particularly human and positive: But as:

1. It has connection with the moral reason of the law.

2. As the particular transgression is scandalous and against order, in which case the formal object of the just punishment inflicted by the ruler, is in very deed not the simple omission of the positive act of a particular human law, but the violation of the moral goodness annexed to it, and of the scandal given. Now in this meaning, the transgression of the positive human law is not kindly [in its kind], per se, of itself punishable, but by accident, and so it binds the conscience by accident; and in this sense, great doctors, as Ambrose, Anselm, Theodoret, Chrysostom, Navarra, Felinus, Taraquel, say that human laws oblige the conscience. But the most learned of the [ecclesiastical] canonists aver that not to obey civil laws, laying aside the evil of scandal, is no mortal sin, and so does not involve the conscience in guiltiness before God.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/samuel-rutherford.html">Samuel Rutherford</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Divine Right of Church Government</cite>, … (1646), ch. 2, pp. 216-9</span></figcaption>

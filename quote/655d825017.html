<main class="wrap"><figure class="quote" id="q-655d825017" data-kw="">
<blockquote><p>‘Ye shall not do’ (says Moses) ‘after all things, which we do here this day, every man, all that is right in his own eyes.’ [Dt. 12:8]… And the speech of Moses seems to mean the true service of God, which was not yet perfected, neither could be in their travels, as it was after in Canaan, vv. 10-11. Not that they sacrificed after their fancy (says the Geneva notes) but that God would be served more purely in the land of Canaan. Junius upon this place notes: ‘Etsi oblationum lex una semper fuit ab initi• praescripta a Deo, non potuit tamen usque adeo in ambulatoriis Israelitarum castris observari, ant summo jure ab illis exigi, prout ostendit; Antithesis, verse 11; vide Num, 28:6.’ The [Romanist] Douay divines, on the place, give this observation, ‘In the desert they could not observe the ceremonies of the Law, but coming to rest, they were bound to keep all one set form of holy rites.’ The conclusion from this text is that God is pleased to dispense with his people in his own prescribed worship, until, if He has appointed, determined, or appropriated a certain form, time and place, they have opportunity to serve Him at that time, in that place, and after that form.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/john-ball.html">John Ball</a></span><span class="wk"><span class="lbl">Work:</span> <cite>An Answer to Two Treatises of Mr. John Can, the Leader of the English Brownists in Amsterdam</cite>, … (London: R.B., 1642), ch. 1, section 4, p. 51</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/church-government-and-the-ministry/forms-of-government.html">Forms of Government</a></span><span class="t"><a href="../topics/worship/impurities-in-worship.html">Impurities in Worship</a></span></div>

</figure><figure class="quote" id="q-d437824128" data-kw="">
<blockquote><p>The analogy which I understand is to hold between the Jewish and Christian Church is this: As profane persons were forbidden to enter into the Temple because of the sacramental and typical holiness thereof (for the Temple was a type of Christ), so profane persons are now much more to be kept back from the sacrament of the Lord’s Supper, which has more of sacramental signification, mystery and holiness in it than the temple of Jerusalem had, and whereby more ample evangelical promises are set forth and sealed unto us. And as profane persons might of old come into the court of the gentiles, and there hear the Word preached in Solomon’s porch (where both Christ and his apostles did preach, Jn. 10:23; Acts 3:11; 5:12, which porch was in the utmost court, that is, the court of the gentiles: of which elsewhere out of Josephus), but might not come into the court of Israel, nor have communion in the sacrifices: so profane, obstinate sinners are to be excluded for their impiety from the Church-communion of saints, though they may hear the Word, as heathens also may do.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/george-gillespie.html">George Gillespie</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Aaron’s Rod Blossoming</cite>, bk. 1 ToC of Aaron’s Rod Blossoming, or the Divine Ordinance of Church Government Vindicated… (Edinburgh: Ogle, Oliver &amp; Boyd, 1844), | 9. Whether in the Jewish Church there was any suspension or exclusion of profane, scandalous, notorious sinners, from partaking in the public ordinances with the rest of the children of Israel in the temple 41, pp. 46-47</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/church-government-and-the-ministry/forms-of-government.html">Forms of Government</a></span></div>

</figure><figure class="quote" id="q-69b5376adb" data-kw="">
<blockquote><p>[It is superstition] that all the pastors of the protestant Churches abroad, who had only the election of the people and the ordination of parochial pastors, and not of diocesan bishops, are no true ministers of Christ, but laymen. That therefore those Churches are no true Churches (in a political sense and as organized). That therefore their baptism is unlawful and a nullity, and all those nations are no baptized Christians (though the Papists who hold the validity of laymen’s baptizing do here censure [these protestant episcopal men] more easily). That it is not lawful to communicate in such Churches and receive the sacrament of the Lords supper from such ministers. That those countries which are baptized by such should be rebaptized. That those ministers who are ordained by such should be re-ordained.</p></blockquote>

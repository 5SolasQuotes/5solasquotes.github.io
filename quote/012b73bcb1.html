<main class="wrap"><figure class="quote" id="q-012b73bcb1" data-kw="">
<blockquote><p>As for types, allegories, mystical stories, and obscure predictions, he made use of them under the Old Testament on purpose to exercise the faith of the church in the discovery of the mystery of grace which was contained in them. And whatever of that nature is contained in the Scripture, being interpreted by the light of the gospel, is clear and plain unto them who are taught of God.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/john-owen.html">John Owen</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Causes, Ways, and Means of Understanding the Mind of God</cite>, Works (Goold), vol. 4</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/holy-scripture/perspicuity.html">Perspicuity</a> › <a href="../topics/holy-scripture/perspicuity/clarity.html">Clarity</a></span><span class="t"><a href="../topics/holy-scripture/interpretation.html">Interpretation</a> › <a href="../topics/holy-scripture/interpretation/literal-and-spiritual-sense.html">Literal and spiritual sense</a></span></div>

</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-09f8fd9819" data-kw="Laity reading Scripture">
<blockquote><p>Our opinion is, that the scriptures are not so difficult, but that those who read them attentively may receive from thence advantage and the greatest edification, even laymen, plebeians and the common mass of mankind. … But we affirm that it may be understood by all who desire to know it, and bestow the pains they ought; even as a lamp may be seen by all who choose to open their eyes.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/william-whitaker.html">William Whitaker</a></span><span class="wk"><span class="lbl">Work:</span> <cite>A Disputation on Holy Scripture</cite>, Question 4, ch. 4</span></figcaption>

</figure><figure class="quote" id="q-8308d30dc9" data-kw="">
<blockquote><p>Secondly, The Holy Spirit hath so disposed of the Scripture that the mind of God in all things concerning our faith and obedience, which are of necessity for us to know, might be clearly and distinctly understood. … [1.] In that whatever is necessary for us to believe concerning these things is plainly and clearly revealed in the Scripture, and that in sundry places.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/john-owen.html">John Owen</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Causes, Ways, and Means of Understanding the Mind of God</cite>, Works (Goold), vol. 4</span></figcaption>

</figure><figure class="quote" id="q-9d4abd4aee" data-kw="">
<blockquote><p>That Scripture has this perspicuity is plain (1) from Scripture itself, which proclaims its lucidity. &quot;The testimony of Jehovah is sure, enlightening the eyes&quot; (Ps. 19:8). &quot;Thy words are a lamp to my feet&quot; (Ps. 119:105). &quot;A light shining in the darkness&quot; (II Peter 1:19). &quot;The law is a lamp&quot; (Prov. 6:23). … For Scripture is called &quot;clear&quot; (lucidus) not only because it throws light upon the matters that are understood, but also because it is clear in itself and has been made suitable for throwing light on these matters, if used by people with the eyes of faith.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/francis-turretin.html">Francis Turretin</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Institutes of Elenctic Theology</cite>, 2.17.8</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/holy-scripture/perspicuity.html">Perspicuity</a> › <a href="../topics/holy-scripture/perspicuity/clarity.html">Clarity</a></span></div>

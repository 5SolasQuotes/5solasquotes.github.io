<main class="wrap"><figure class="quote" id="q-e077c6f7f7" data-kw="">
<blockquote><p>The Lord God having entered into a covenant of life with the first Adam, for himself and all mankind in him, this covenant has been broken, whereby sin hath entered, and death by sin; and all the world being now become guilty before God, bound over to the vengeance of eternal fire, and under an utter impossibility of recovery by aught which that covenant can do, God has out of his abundant grace made a new covenant, on which whosoever shall lay hold, shall be delivered out of the state of death and wrath into a state of life and blessedness. What the law could not do, being weak through the flesh, God sent his Son in the likeness of sinful flesh to accomplish; and with him this gracious grant, that whosoever believeth in him, shall not perish, but have everlasting life. John 3:16. And this is the covenant which has been declared unto you.

This new covenant is a marriage covenant: I will betroth thee unto me for ever, yea, I will betroth thee to me in righteousness, and in loving-kindness, and in mercies. Hos. 2:20. In it the Lord makes offer, and invites you to accept of a husband and a dower: the husband is the King’s Son, the Lord Jesus Christ, and with him the lost kingdom, and all that belongs to the kingdom of God, for a dower. Liberty for the captives, the opening of the prison to them that are bound; riches to the poor, eyes to the blind, feet to the lame, healing to the diseased, and life to the dead.

And whoever among you all, who are persons under the law, held by the cords of your sins, whose souls are fast bound in fetters of iron, who are willing that your covenant with death be made void and your agreement with hell be disannulled, and will join yourselves to the Lord and be brought within the bonds of this covenant, all the blessings of this covenant are made over and stand sure unto you. The grant is made, the deed is drawn and sealed; the Lord hath set to his seal — come you in and seal the counterpart; set to it your seal, and the match is made up. Christ, and with him all things, are yours, and you are his. Accept, and live; refuse, and die forever.

Come then, sinner; what sayest thou? Dost thou consent? Dost thou accept? Or, as Laban to Rebekah, Wilt thou go with this man? Let me espouse thee to this one Husband; only let me first tell thee, the matter is solemn, and thou must be serious. It is for life, it is for eternity. Consider therefore, and let thy heart, lying prostrate before the Almighty, come in and make answer to these demands, which from him, and in his great and dreadful name, I make unto thee.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/richard-alleine.html">Richard Alleine</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Heaven Opened; or, A Brief and Plain Discovery of the Riches of God’s Covenant of Grace</cite>, (1665; New York: American Tract Society, 1838), pp 333-35.</span></figcaption>

</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-56f3aee1cf" data-kw="">
<blockquote><p>Although a native-born Scot, John Cameron (1579-1625) was a noted theologian among the French Huguenots. The English Puritan, Samuel Bolton published Cameron’s Certain Theses on covenant theology as an appendix to his famous book The True Bounds of Christian Freedom:

I Thesis

Covenant in Scripture, doth sometimes signify the absolute Promise of God without any restipulation; as what that Covenant which God made with Noah presently after the Flood, freely promising never to destroy the world again by water; of this kind is that Covenant, in which God promiseth to give unto his Elect, faith and perseverance: to which promise there cannot be conceived any condition to be annexed, which is not comprehended in the promise it self.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/john-cameron.html">John Cameron</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Certain Theses, or, Positions Concerning the Three-Fold Covenant of God with Man</cite>, in Samuel Bolton, The True Bounds of Christian Freedom (London, 1656), p. 353.</span></figcaption>

</figure><figure class="quote" id="q-9e10921dfd" data-kw="">
<blockquote><p>I. How God delights not in the death of a sinner… If God has more pleasure in the conversion of sinners than their destruction, why are there not more converted than we find to be? The greatest part of mankind are perishing in their unbelief and impenitency. Answer: (1) I might answer, that this text speaks not absolutely, but comparatively. God rejoices in the execution of his justice, as well as in all his other works; but if you compare things with things, He rejoices rather in acts of mercy than in acts of vengeance. His disposition inclines Him to mercy rather than to wrath: ‘Mercy pleases Him,’ Mic. 7:18; and mercy rejoices over judgment in the conflict. Justice is alienum opus, ‘his strange work,’ Isa. 28:21; Lam. 3:33, ‘He does not afflict willingly, nor grieve the children of men;’ not with his heart. Mercy, like live honey, drops of its own accord. He is forced to the other [judgment]; it [judgment] is wrested from Him. Though the properties are equally infinite in God, yet they do diversely exert themselves towards men as to the effects. Now the world is upon its trial. God’s primary end is the conversion of a sinner; his secondary end the honor of his vindictive justice.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/thomas-manton.html">Thomas Manton</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Works</cite>, vol. 21, Two sermons on Eze. 18:23, pp. 463-79</span></figcaption>

<blockquote><p>If the things themselves are promised in the covenant, then all those with whom this covenant is made must be really and effectually made partakers of them. But this is not so; they are not all actually sanctified, pardoned, and saved, which are the things here promised.&#x27; Ans. The making of this covenant may be considered two ways:

1. As unto the preparation and proposition of its terms and conditions.

2. As unto the internal stipulation between God and the souls of men. In this sense alone God is properly said to make this covenant with any. The preparation and proposition of laws are not the making of the covenant. And therefore all with whom this covenant is made are effectually sanctified, justified, and saved.</p></blockquote>

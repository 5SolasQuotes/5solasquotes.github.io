<main class="wrap"><figure class="quote" id="q-3a911fc282" data-kw="">
<blockquote><p>Fifthly, when you are to choose what minister or church you will statedly have your ordinary communion with, you should not prefer a less reformed church or a less worthy pastor, or one that is erroneous, before a better, but choose that which is most to your true edification. Sixthly, if you live under a worse and unreformed Church, or unprofitable minister, if necessity hinder not, you may remove your dwelling to a better. Seventhly, and where churches are near and there is no great hurt or disorder [that] will follow it, you may join with another church without removing your dwelling: But this you may not do when the hurt to the public is like to be greater than the good to you. Eighthly, and you must not conclude that the more faulty church and minister may not lawfully be communicated with though for your benefit you choose a better, for this is the true crime of sinful separation. But surely a man’s soul is so precious that all men should prefer the greatest helps for their salvation before the less; and think no just means too dear to purchase them.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/richard-baxter.html">Richard Baxter</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Cure of Church Divisions</cite>, … (London, 1670) | pt. 1, Direction 36, p. 204</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/the-church/schism-and-separation.html">Schism and Separation</a></span></div>

</figure><figure class="quote" id="q-d6edf4bb27" data-kw="">
<blockquote><p>For some say they [presbyterians] are not to do so [practice occasional communion] because we are bound always to do that in the worship of God which is best, and there cannot be two bests. Therefore since they judge their own way to be best, they ought always to go in it and never to join with any others, neither with the Church by law established [in England], or any others. This is somewhat plausible, seems a strong argument to some, but is far from it. For persons and churches that are better than others are to own others, if built on the true foundation, and [are] to impose no intolerable things for true, though [on] distempered churches, and to strive to hold an outward communion with them, the stronger and better with the weaker, and (much more) the weaker [ought to hold outward communion] with the better and stronger. Therefore the presbyterians think themselves bound to join sometimes with the conformists, though they judge their own way better than theirs; and that in doing so sometimes, they do that which is best.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/francis-tallents.html">Francis Tallents</a></span><span class="wk"><span class="lbl">Work:</span> <cite>A Short History of Schism</cite>, (London: Parkhurst, 1705) 128 pp. ToC, p. 110</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/the-church/schism-and-separation.html">Schism and Separation</a></span></div>

<main class="wrap"><figure class="quote" id="q-e326985a4c" data-kw="">
<blockquote><p>In his twelfth chapter he saith, [That many revolted from the Church of Rome, because the Schoolmen brought in Philosophy, and Aristotle’s doctrine into Religion; whence arose contradictions and absurdities, as brought the Clergy into a reputation of ignorance.] It is strange that Philosophy should make the Clergy reputed ignorant, whereas it contains the knowledge both of divine and human things: and it is one of the chief blessings of Almighty God, bestowed upon mankind, by which his image lost in Adam is repaired; for the understanding is enlightened by the speculative, and the will is regulated by the practical parts thereof: and Philosophy is so far from causing peoples revolt from that Church; that on the contrary, it is one of the main supporters and pillars thereof: I am afraid that it was not Philosophy which brought a reputation of ignorance upon that Church, but rather their want of it, which also will occasion much ignorance, stupidity, and darkness in our Church: And I pray you good Mr. Hobbs, what hurt hath Divinity received from Philosophy, or Aristotle’s doctrine.

Hath it caused contradictions, and absurdities; (as you say) sure, you are widely mistaken: for by Philosophy contradictions and absurdities are avoided, into which those ignorant souls do fall, who want it, as we find at this time by woeful experience, there being more absurd and contradictory opinions among the people of this Nation, now, in a few years since Aristotle’s doctrine hath been discouraged, then were all the time hitherto since Christianity was embraced. And what wonder is it if they that walk in darkness stumble: How should we come to know the heavens, the earth, the seas, the fire, the air, the beasts, fishes, and fowls, the herbs, trees, plants, precious stones, all which physical bodies, with divers others are mentioned in Scripture: besides, Spirits, Angels, and other Metaphysical entities: without Philosophy, how should we define, divide, dispute, speak or write methodically or syllogistically without this.

I will say nothing of the benefit we receive by moral, political, and economical Philosophy: How shall we dispute against Heretics, and refel their subtle arguments without it. Justin Martyr, and many other Greek and Latin Fathers, fought against the Gentles, Jews, and Heretics, with this sword, and beat them with their own weapons; therefore to condemn Philosophy, is to condemn the minister and handmaid of divinity; between which there can be no more repugnancy, then there is between the principal and subordinate cause, between two lights, two truths, or between the body and the soul.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/alexander-ross.html">Alexander Ross</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Leviathan drawn out with a hook, or, Animadversions upon Mr. Hobbs his Leviathan. Together with some observations upon Sir Walter Raleigh’s History of the World</cite>, (London: Richard Royston, 1653), pp 17-18.</span></figcaption>

</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-e59b32ddfd" data-kw="">
<blockquote><p>Metaphysics is defined as the science of being qua [as] being… Metaphysics can, therefore, be described as the first real speculative science. It is a science because it is a body of demonstrated truths about a single formal object… Insofar as it is a science, metaphysics differs from sacred theology because the latter is not a science in the strict Aristotelian sense for its principles are not evident but revealed. Metaphysics is a real science, as is plain from its definition. For being signifies the same as thing or what actually exists or is at least capable of such existence. Therefore metaphysical notions are first intentions, or concepts that are predicated immediately of things themselves. So metaphysics differs from the logical sciences which deal with second intentions, that is, with concepts that are predicated immediately of other concepts or of beings of reason. Metaphysics indeed is the first or supreme real science, and so differs from other less universal real things, as physics, cosmology, psychology; for it does not just consider one or other part of reality, as these sciences do, but with the totality of things. Therefore, by reason of its material object, metaphysics is equivalent to all the real sciences taken together. Further, it is first by reason of its formal object; for the other sciences consider real things in some narrower respect, as physics considers things as changeable, cosmology things as bodily, etc. But metaphysics considers them precisely as they are real. Hence other real sciences, as cosmology, philosophy of man, presuppose metaphysics and use its conclusions as their principles. But metaphysics does not use the conclusions of any other real science, physics or natural philosophy, as principles. Metaphysics is a speculative and not practical science, because it does not tend toward any other operation but speculation. Hence it differs from ethics, which is practical.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/allan-b-wolter.html">Allan B. Wolter</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Little Summary of Metaphysics</cite>, (Milwaukee: Bruce Publishing Co., 1958), Intro, pp. 7-8</span></figcaption>

<blockquote><p>1. WHY THE WOMAN WAS FORMED FROM THE SIDE OF THE MAN. And because she is not given as slave-girl or as one to lord it over him, in the beginning she was not formed either from the highest part, nor from the lowest, but from the side of man, for the sake of conjugal partnership.

If she had been made from the highest, as from the head, she might seem created for domination; but if from the lowest, as from the feet, she might seem to be created for subjection to slavery. But because she is taken neither as mistress, nor as [a] slave-girl, she is made from the middle, that is, from the side, because she is taken for conjugal partnership.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/peter-lombard.html">Peter Lombard</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Sentences</cite>, trans. Giulio Silano (1150; 4 vols, Toronto, 2007), IV, d. 28, c. 4, a. 1.</span></figcaption>

<blockquote><p>1. Theology is usually divided into the Theology of the Laity and the Theology of the Doctors, which they call argumentative and Scholastic. The former is a bare knowledge of the credibilia (as they call them) necessary for salvation. The latter is not a bare knowledge of the credibilia, but is the faculty by which we are able to explain, defend, and confirm the articles of faith, and to instruct others concerning their truth.

2. Argumentative or Scholastic Theology is said to exceed the Theology of the Laity in a twofold respect: first, because it extends itself to more credibilia; for learned men in spiritual matters understand more than the Laity and the simple. Secondly, because it is able to explain to others those things which are to be believed, and to defend and confirm them against Atheists, Jews, Mohammedans, and Pagans.</p></blockquote>

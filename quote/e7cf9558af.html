<main class="wrap"><figure class="quote" id="q-e7cf9558af" data-kw="">
<blockquote><p>God will manifest that He is displeased with such duties that thou doest perform; He will manifest it one way or other that He is a holy God, and He does not accept of such unholy things as thou doest tender up to Him; for the truth is, if God should accept of such unholy things from men, God may be said to be like unto themselves. As a man if he does entertain any as his familiar friend that is naught and wicked, it is his disgrace and dishonour… So God may employ the most wicked men in the world in some outward services, but if He should accept of them in his worship, it would be a dishonour to God, and therefore God, that He might sanctify his own name, He will manifest his displeasure at one time or other against such duties of worship you that perform worship in a formal manner and with unclean, vile hearts;</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/jeremiah-burroughs.html">Jeremiah Burroughs</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Gospel Worship... (London: 1647), Sermon 7</cite>, p. 116</span></figcaption>

</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-50e9332d21" data-kw="">
<blockquote><p>My partaking in any divine worship which is holy and good for the matter, and allowable or passable for the mode in the main, does not involve me in the blame of some sinful defects therein, to which I consent not, and which I cannot redress. 2. I do not acquiesce in this form of worship only, nor do I by my example induce others so to do, seeing in other congregations I both dispense and attend upon the Word and prayer in another form, and judge it necessary for me so to do. 3. It is to me indubitable that this form is so far profitable and edifying, as that merely for the defects found therein, there is no cause of renouncing it or the communion of the Churches for its sake, especially while other prayer and the preaching of the Word is not there by excluded. … I would give no occasion to any of disowning or reproaching a form of divine worship which is sound in the substance thereof, and accepted of God from the sincere, though it be less perfect in diverse material points and less convenient for the mode.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/john-corbet.html">John Corbet</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Nonconformist’s Plea for Lay-Communion with the Church of England, together with a Modest Defense of Ministerial Nonconformity... (London: 1683), The Nonconformists Plea for Lay-Communion with the Church of England</cite>, pp. 6-7, 10</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/worship/impurities-in-worship.html">Impurities in Worship</a></span></div>

</figure><figure class="quote" id="q-ae789c31cd" data-kw="">
<blockquote><p>Beside publick reading of the holy scriptures, every person that can read, is to be exhorted to read the scriptures privately, (and all others that cannot read, if not disabled by age, or otherwise, are likewise to be exhorted to learn to read,) and to have a Bible.</p></blockquote>

</figure><figure class="quote" id="q-374878614f" data-kw="">
<blockquote><p>About receiving the Lord’s Supper with inconvenient ceremonies and persons in differing doctrine: Peter Martyr, when he came into England first, and the opinion of the corporal presence of Christ in the Lord’s Supper was in force, and when the ministers, albeit differing from him in judgment, yet did not refuse to admit him with open confession of [the] contrary judgment, he joined with them and received the Lord’s Supper, Non obstantibus illorum ceremonijs sibilicet ipsi molestis, ‘notwithstanding the ceremonies, though very much troubling him.’ This counsel did P. Martyr give to [Zachary] Ursinus and to other Christians in Germany; Ursinus, Exercitat., lib 2, fol. 840.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/john-sprint.html">John Sprint</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Cassander Anglicanus, showing the Necessity of Conformity to the Prescribed Ceremonies of our Church in Case of Deprivation (London: Bill, 1623) | ‘Reformed Practices’</cite>, p. 162</span></figcaption>

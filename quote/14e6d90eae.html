<main class="wrap"><figure class="quote" id="q-14e6d90eae" data-kw="">
<blockquote><p>…we must prove ourselves the true Church of God: Thus we do it: We are true Christians, for we were baptized into the name of Christ; we truly profess our continuance in the same faith, into which we were baptized: we join together in the public services of God: we maintain every point of the most ancient Creeds: we overthrow not the foundation by any consequence; Therefore whateuer is wanting to us, whatever is superfluous, in spite of all the gates of Hell, we are the true Church of God.</p></blockquote>

</figure><figure class="quote" id="q-2c8bcddfb8" data-kw="">
<blockquote><p>Those articles of religion wherein the divines of both sides [of the reformed and Lutherans] do fully agree are abundantly sufficient, both for a Christian man’s salvation and likewise for the establishing of a firm and lasting peace in the Churches of God. As for the rest… they are such as may perhaps not unfitly be sent to the divinity-schools, there to be thoroughly discussed: but by no means ought they to disquiet the peace either of any Christian soul or of God’s holy Church… our good and gracious Savior passed over with silence and toleration great and grievous errors in comparison of these… and that too even in such as were of his own household and retinue.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/joseph-hall.html">Joseph Hall</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Opinions of Certain Reverend &amp; Learned Divines concerning the Fundamental Points of the True Protestant Religion, &amp; the Right Government of Reformed Churches</cite>, ([Oxford] Downes, 1643), “Opinion of Joseph Hall,”, pp. 1–2</span></figcaption>

<blockquote><p>I am first a Christian, next a catholic, then a Calvinist, fourth a paedobaptist, and fifth a Presbyterian. I cannot reverse this order.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/john-rabbi-duncan.html">John Rabbi Duncan</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Colloquia Peripatetica</cite></span></figcaption>

— John Rabbi Duncan, Colloquia Peripatetica">Copy</button><a class="share" href="https://x.com/intent/post?text=%E2%80%9CI+am+first+a+Christian%2C+next+a+catholic%2C+then+a+Calvinist%2C+fourth+a+paedobaptist%2C+and+fifth+a+Presbyterian.+I+cannot+reverse+this+order.%E2%80%9D%0A%0A%E2%80%94+John+Rabbi+Duncan%2C+Colloquia+Peripatetica&amp;url=https%3A%2F%2F5solasquotes.github.io%2Fquote%2Fd906864326.html&amp;via=5Solas" target="_blank" rel="noopener">Share on X</a><a class="perma" href="../quote/d906864326.html">Permalink</a><a class="src" href="https://reformedbooksonline.com/on-fundamental-secondary-tertiary-teachings-of-christianity/#:~:text=I%20am%20first%20a%20Christian%2C%20next,Presbyterian.%20I%20cannot%20reverse%20this%20order&amp;text=I%20am%20first%20a%20Christian%2C%20next%20a%20catholic&amp;text=fifth%20a%20Presbyterian.%20I%20cannot%20reverse%20this%20order" rel="noopener" target="_blank">Read it online · Reformed Books Online</a></div>
</figure><figure class="quote" id="q-e7427f35bb" data-kw="">
<blockquote><p>And indeed there is no possibility of making an actual agreement in those lesser points, because of the different capacities and degrees of faith: And God in the Scripture has not promised such an actual agreement to all the members of the Church in all lesser points of doctrine; for He has not promised a full and uniform discovery of them to all: Yea, it has been showed out of your own great Doctor Stapleton (Ex. pacif. ch. 3), by a Roman Catholic, that in the discovery of small points the Church is not infallibly directed… And thus may we come to a sight of the unity of faith in the Church; For in the explicits, that is, in fundamentals of absolute necessity which knit unto Christ the foundation, there is and ought to be an unity; and this substantial unity may cover the incurable differences in the lesser implicit points being held by infirmity, and not with contention, scandal, and schism: For unity in fundamentals does take away the damning censure of differences in lesser points when there is a will of believing right in these points, but a want of power to attain this belief. And so these differences in lesser points not being put upon account for the will of unity in them, and for the real unity in fundamentals, this real unity in fundamentals is accounted an entire, or at least a solid and saving unity: So that the unity is not to be reckoned from this, that all do actually agree in this belief of all lesser points (for in diverse of these points diverse do necessarily differ) but because their unity in fundamentals, and a will of unity in these lesser points wherein they differ (the imputation of smaller differences being thus taken away) are accounted to them for an entire, or at least for a sufficient unity. And this truth is in not much unlike terms to be seen in Tertullian (Of the Veiling of Virgins, ch. 1): Regula quidem fidei una omninò est, sola immobilis, et irreformabilis, credendi scilicet in unicum Deum, omnipotentem mundi conditorem, et Filium ejus Jesum Christum, etc. ‘The rule of faith is only unmoveable.’ And De Praes., ch. 12: Quaeramus ergò in nostro et à nostris et de nostro, id(que) duntaxat quod salva regula fidei potest in quaestionem devenire. ‘Let us inquire or dispute of that which may come into question without hurting the rule of faith.&#x27;</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/francis-rouse.html">Francis Rous</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Catholic Charity Complaining &amp; Maintaining that Rome is Uncharitable to sundry eminent parts of the catholic Church, and especially to Protestants, and is therefore Uncatholic</cite>, (London: 1641), ch. 9, sect. 3, pp. 231-34 Rous was a Westminster divine.</span></figcaption>

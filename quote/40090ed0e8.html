<main class="wrap"><figure class="quote" id="q-40090ed0e8" data-kw="">
<blockquote><p>It should be carefully noted that our criticism of this procedure does not imply that we hold it to be wrong for the Christian church to make formal use of the categories of thought discovered by Aristotle or any other thinker. On the contrary, we believe that in the Providence of God, Aristotle was raised up of God so that he might serve the church of God by laying at its feet the measures of his brilliant intellect. When Solomon built the temple of God he was instructed to make use of the peculiar skill and the peculiar gifts of the pagan nation that was his neighbor. But this was something quite different than to build together with pagan nations. The Samaritans wanted to help the Jews construct the city and the temple. Hence they were rejected by the true Jews. The Phoenicians merely wanted to bring their treasures to Solomon and let him construct the way he saw fit. Hence they were gladly received by Solomon.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/cornelius-van-til.html">Cornelius Van Til</a></span><span class="wk"><span class="lbl">Work:</span> <cite>A Survey of Christian Epistemology</cite>, (The Presbyterian and Reformed Publishing Company: Phillipsburg, NJ, 1969).</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/theology/faith-and-reason.html">Faith and Reason</a></span></div>

<blockquote><p>XIV. Although the philosopher may be allowed to begin with a doubt in order to a safer investigation of natural things, yet this cannot be introduced into subjected of theology and faith. They are founded upon certain and indubitable principles and truths known per se, to doubt concerning which is impious (as concerning the existence of God) unless we wish to strip ourselves of conscience and the moral dependence on the Creator (which cannot be shaken off or for a moment rejected without crime) and thus to introduce philosophical doubt (epochen) into religion and render the whole of theology sceptical.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/francis-turretin.html">Francis Turretin</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Institutes of Elenctic Theology</cite>, (P&amp;R), vol. 1, 1st Topic, Q. 13, ‘Is there any use of Philosophy in Theology? We Affirm’, section 14, pp. 47</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/theology/faith-and-reason.html">Faith and Reason</a></span></div>

<blockquote><p>16… This can be illustrated by the likeness of the soul. For the soul, which is whole in the whole body and whole in each part of the body, as to essence, is not more in the heart or brain than in the feet; for equally, as far as essence is concerned, it is in each part of the human body: yet it is said to be especially in the head, as to the effects which it produces more excellently and preeminently in the head than in the rest of the body. For indeed it diffuses the power of sensing throughout the whole body: but in the head, it effects the power of hearing, seeing, smelling, tasting: indeed, also of speaking, thinking, remembering, understanding, which powers it does not exert in other members.</p></blockquote>

</figure><figure class="quote" id="q-77bbf58820" data-kw="">
<blockquote><p>As domestic society is by nature’s instinct, so is civil society natural, in radice, ‘in the root’, and voluntary, in modo, ‘in the manner’ of coalescing. Politic power of government agrees not to man, singly, as one man, except in that root of reasonable nature; but supposing that men be combined in societies, or that one family cannot contain a society, it is natural that they join in a civil society, though the manner of union in a politic body, as Bodine says, be voluntary, Gen. 10:10; 15:7 and Suarez says (tome 1, On Laws, bk. 3, ch. 3), That a power of making laws is given by God as a property flowing from nature, Qui dat formam, dat consequentia ad formam, Not by any special action or grant different from creation; nor will he have it to result from nature while men be united into one politic body: which union being made, that power follows without any new action of the will.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/samuel-rutherford.html">Samuel Rutherford</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Lex Rex</cite>, … (London: Field, 1644), Question 2, ‘Whether or not government be warranted by the Law of nature’, p. 2</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/theology/faith-and-reason.html">Faith and Reason</a></span></div>

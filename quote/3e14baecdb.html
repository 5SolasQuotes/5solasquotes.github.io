<main class="wrap"><figure class="quote" id="q-3e14baecdb" data-kw="">
<blockquote><p>Are those who do not have the gift of continence therefore unable to please God and to cling to Him? No, what Paul is driving at is that each according to the nature of his gift and calling should choose a kind of life for himself in which he can with a good conscience please God and remain faithful to Him. … He declares that marriage is the proper gift and particular vocation from God in which those who do not have the strength to be continent in celibacy are able to serve God with a good conscience in righteousness and holiness, please Him, take thought for the things that are His, and cling to Him by means of His divine gift and blessing.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/martin-chemnitz.html">Martin Chemnitz</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Examination of the Council of Trent</cite>, Part III, First Topic (Chastity, Celibacy, and Virginity), Sec. II, ch. IV</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/rome/worship.html">Rome: Worship</a> › <a href="../topics/rome/worship/celibacy.html">Celibacy</a></span><span class="t"><a href="../topics/rome/worship.html">Rome: Worship</a> › <a href="../topics/rome/worship/monasticism.html">Monasticism</a></span></div>

</figure><figure class="quote" id="q-9a269bb602" data-kw="">
<blockquote><p>We say that matrimony is holy and honourable in all sorts and states of persons, in the patriarchs, in the Prophets, in the Apostles, in holy martyrs, in the ministers of the Church, and in bishops; and that it is an honest and lawful thing (as Chrysostom saith) for a man, living in matrimony, to take upon him therewith the dignity of a bishop. And as Sozomenus saith of Spiridion; and as Nazianzen saith of his own father, that a good and diligent bishop doth serve in the ministry never the worse for that he is married, but rather the better, and with more ableness to do good.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/john-jewel.html">John Jewel</a></span><span class="wk"><span class="lbl">Work:</span> <cite>An Apology of the Church of England</cite>, Part 2</span></figcaption>

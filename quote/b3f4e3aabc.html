<main class="wrap"><figure class="quote" id="q-b3f4e3aabc" data-kw="">
<blockquote><p>Baxter argued persuasively in detail in this era in England that it may be moral and for the greater good (and even necessary) to tolerate receding to a lesser state of past reformation for a time and in the circumstances while the previous or a greater reformation cannot be sustained or made without greater harm than good. Samuel Bolton (a Westminster divine) and other puritans concurred. Anyone experienced in Church government will agree.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/travis-fentiman.html">Travis Fentiman</a></span><span class="wk"><span class="lbl">Work:</span> <cite>“Editor’s Extended Introduction” in English Puritans, A Refutation of the Errors of Separatists</cite>, (1604; RBO, 2025), p. 102</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/the-christian-life/ethics-and-virtue.html">Ethics and Virtue</a></span></div>

</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-a70f4018d9" data-kw="">
<blockquote><p>Question 1. Whether in a good or evil act there be necessarily required an inclination of the will? 1st Answer. First, the will is the principle and the first cause of all human operation in regard of the exercise of the act. For we therefore do this or that rather than another thing, because we will; As God Himself is said to do all things of his own Will, Eph. 1:11. So also does man who is made after the Image of God. The first cause therefore of the goodness or sinfulness of any act of man, is in the will.

2. Secondly, liberty also of election is formally in the will: that therefore anyone does yield obedience to God, or refuses to do so, proceeds from the will.

3. Lastly, our obedience stands in our conformity to the Will of God, and the disobedience, in our unconformity thereunto. Now our conformity with the Will of God is first and principally in our will, Apoc. 2:6.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/william-ames.html">William Ames</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Conscience with the Power &amp; Cases Thereof</cite>, (1639), bk. 3, ch. 19, ‘Of a Voluntary Act’, pp. 92-3</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/the-christian-life/ethics-and-virtue.html">Ethics and Virtue</a></span></div>

</figure><figure class="quote" id="q-97113abe63" data-kw="">
<blockquote><p>But if a governor so mis-determine but a mode or circumstance as will overthrow the substance and ends of the worship, I would not obey, except some greater evil were likely to follow my not obeying at that particular season than the frustrating of the duty itself would come to… An unhandsome vesture I would use in obedience to a lawful governor and to avoid a greater evil: but not so ridiculous a vesture as would set all the people on laughing so as to frustrate the work that we assemble for.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/richard-baxter.html">Richard Baxter</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Five Disputations of Church-Government &amp; Worship</cite>, (London, 1659), 5th Disputation, ch. 12,; p. 463</span></figcaption>

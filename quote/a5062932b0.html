<main class="wrap"><figure class="quote" id="q-a5062932b0" data-kw="">
<blockquote><p>If some admirer of the sky and the stars – and what can one think of that is more beautiful than these bodies? – wanted to remove water from the nature of things, because it is no match for the brightness of the stars, would we not say that he is mad? If someone, out of admiration for the teachings of religion, ordered us to remove from our lives all laws and precepts of the state and all links of domestic life, would not all sane men judge it necessary for him to be suppressed by force and by the use of weapons?

And in these recent years we have seen some who were practising theology in an unholy way, madmen with fanatical opinions, punished for their errors. For you will remember Müntzer and the Anabaptists and other monsters of that kind. Consider those mad in the same way, who disturb the chorus and the harmony of the arts by neglect of, and contempt for, the lower arts. Therefore, just as when you think of the elements of writing you believe that the entire alphabet is necessary for discourse, so you will consider all the disciplines that are taught in the schools necessary for life.

For only he can have the right feelings about the arts, who, when he has noticed their order, understands that each art has been devised because of its certain usefulness. I have said this to remind young men of it, many of whom we see rushing unrestrainedly towards the higher disciplines, not only to their own detriment, but also to that of the state. For your studies do not concern only you, but also the state.

And you ought to keep in view the purpose of your studies, and decide that they are provided for giving of advice for the state, for teaching in the churches and for upholding the doctrine of religion. You will not be able to excel in any of those without perfect doctrine, and perfect doctrine is not granted to anyone without the lower disciplines.</p></blockquote>

</figure><figure class="quote" id="q-c308458db3" data-kw="">
<blockquote><p>That infant baptism is the practice of all branches of the Christian church, with one solitary exception, is a well-known fact. That it has been the practice of the church of God for eighteen centuries is also beyond dispute. When one sect, therefore, ventures to differ in opinion from all other Christian churches, it should have very strong reasons to support it. But I was considering the objections which the Anabaptists advance against the administration of the ornaments, and then let all men judge whether they are sound and conclusive.

1. The first of these objections is founded on the baptism of Christ (Matt. 3:13–17). The fact that Christ was not baptized in childhood, but only when he entered on his ministry, some thirty years afterwards, is considered by many of the more ignorant class a strong proof against infant baptism. This will be short. At the time of Christ’s birth, the ordinance of baptism did not exist in the church of God. Circumcision was then the initiatory right, and Christ was circumcised (Luke 2:21). Thirty years afterwards, John was sent to baptize, and so soon as the opportunity presented itself, Christ submitted to the rite. But although His own disciples baptized during the Savior’s lifetime (John 4:1–2), yet it was not until the Lord had risen from the dead that Christian baptism was instituted (Matt. 28:19). The mere fact, therefore, that the Lord Jesus did not receive, infancy, an ordinance that did not exist until after his death and resurrection, is no argument against infant baptism. One might as well argue against the circumcision of infants, on the ground that Abraham was not circumcised until he was 100 years of age.

2. Again, it is said that an infant cannot understand baptism, and eloquent pictures are sometimes drawn of the wrong inflicted on the poor unconscious babe which receives an ordinance of which it knows nothing, and is made party to a solemn transaction without any consent of its own. It is admitted, readily, that a child at baptism does not understand the nature of the ordinance of which it is the subject, but that is no reason why it should not drive benefit thereby. He does not know the texture of the clothes that cover it, and yet these clothes keep it warm. It does not understand the nature of its mother’s milk, and yet that milk sustains its life. The children that were brought to Jesus that he might touch them (Mark 10:13–16) did not understand the ceremony that was gone through on that occasion, and yet we cannot but believe that Christ did them good. An Anabaptist might have rebuked those mothers, and said to them, “take your children home, what is the good of it? What can they know about Christ blessing?” But Jesus would have shown him, what he did show the ignorant disciples, that with such conduct “he was indignant.” A divine purpose may be served, and good, by the administration of baptism to a child, while, at the same time, the child does not understand the ordinance. If our Anabaptist friends had seen a Jew, with a knife in hand, ready to perform on an infant of eight days old the right of circumcision, they would have attempted to dissuade him from his bloody work in some such way as this: “How can this poor babe know anything of a covenant made so many years ago? Why administer to it an ordinance that it does not understand? Why make it a party to such a solemn transaction without any consent of its own?” The Jew could scarcely hide his contempt for one so ignorant of the law and the prophets, as he would reply: “Beautiful reasoning, indeed, Gentile unbeliever! But with me it does not weigh one feather against the appointment of God.” Now we say the same. The baptized infant may be ignorant of the ordinance, but that does not, with us, weigh one feather against the appointment of God. Alexander Carson, an Anabaptist writer, says, “I would baptize Satan himself, without the smallest scruple, had I a divine warrant.” Possessing, as we do, a divine warrant for baptizing the children of believers, we hesitate still less to administer the ordinance to an unconscious babe.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/thomas-witherow.html">Thomas Witherow</a></span><span class="wk"><span class="lbl">Work:</span> <cite>I Will Build My Church</cite>, ed. Jonathan Gibson. Philadelphia: Westminster Seminary Press, 2021), 179–81.</span></figcaption>

<blockquote><p>VI. It is asked, must theology be taught according to a certain method? As an example of excess, the [medieval] Scholastics, according to their philosophical theology, loved the philosophical method of Aristotle – whether it was his analytic or synthetic method – to the point of distraction.

As an example of deficiency, the Anabaptists, enthusiasts, and fanactics, due to ignorance and hatred of philosophy, reckon that all method should be eliminated from theological matters. One after another of our Reformed theologians, in proving their own points, opposed such persons.

The Reformed, against the Anabaptists and enthusiasts, demand a method, but not, precisely speaking, a philosophical one. They demand a natural method, that is, a method that is suitable for theological matters, and for assisting the judgment and strengthening the memory – however much that method might otherwise depend on the discretion of the writer.</p></blockquote>

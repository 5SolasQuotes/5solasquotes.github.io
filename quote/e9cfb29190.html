<blockquote><p>While Rutherford in questions one to seven of his ‘Disuisitiones metaphysicae’ quoted Bradwardine without expressing any criticism, Leydekker distanced himself from what he considered to be Bradwardine’s voluntarism. According to Leydekker, Bradwardine grounded impossibility in the will of God. Leydekker preferred instead to view the power of God, not His will, as the foundation of possibility and impossibility… Voetius had been more cautious about ascribing a voluntarist position to Bradwardine.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/thomas-bradwardine.html">Thomas Bradwardine</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Other citations (work not named)</cite>, Of the Cause of God</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/attributes-of-god/knowledge-and-wisdom.html">Knowledge and Wisdom</a></span></div>

</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-addf886a5b" data-kw="">
<blockquote><p>I will make your cause better than you have made it, but not by making other men’s worse, but by opening the reconciling truth. I. I shall tell you in what sense God’s will and decrees may and must be said to have an extrinsic cause, without change in God. (Predestinatio nihil ponit in praedestinato inquit [Predestination places nothing in the one who is predestined]; Aquinas, pt. 1, q. 23, art. 2) 1. Know therefore that God’s essence is his will, but not as essence. To say that God is God, and that God wills this or that, are not terms of the same signification. 2. God’s will is his essence denominated from some amiable good as the object; and so there is ever quid respectivum [in that respect] in the notion of will. 3. As God wills Himself, the act being perfectly immanent, his will is called Himself much more properly than his will of things extrinsic (which is ever either effectively, or at least objectively transient), because it is God that wills, and that is willed or loved (which made many ancients say that this was the Third Person in the Trinity). 4. But as God wills things ad extra [to things outside Himself], though it is his essence that so wills them, yet it is unfit to say simply that this will is God; e.g. that to will Peter’s salvation is God, because the name ‘will’ here includes the thing willed. 5. And therefore when we speak of God’s will in the universal notion, as abstracted from all particular objects and acts, it is less inconvenient to say simply that this will is God than when we speak of his will in act ad extra. By this time you may see that though God’s will, as his essence, has no cause, yet his will as denominated extrinsically from the object may have some kind of cause, that is objective, which is quasi materia actus [the matter of the act, as it were], and the terminus sine quo non [end-without-which-nothing] (Alvarez himself says that by a ’cause’ he means also any objective condition or reason of the act); that is, God’s will is not denominated a complacency in Christ existent or in Peter regenerate, or his understanding a seeing that the world was good before any of these things did exist. (This is all that Ruiz’s reasons prove, Of the Will of God, disp. 115, sect. 4, p. 102, who says that there is more than extrinsic denomination; et relatio rationis quam realis formalitas [and a relation of reason rather than a real formality]. But he does but show by his quodammodo [in some way], that he knows not what to say.) So that by extrinsic denomination, without any change in God, He may and should be said de novo [of new] to know things to be existent, to be past, to will things as existent with complacency or will them with displicency: But not to will the futurity of men’s damnation de novo; but yet his will of the futurity of men’s damnation has several degrees of the objective cause, from whence it is denominated: As in esse cognito [known being], the person who is the object is in order of nature first a man, a subject, and then a sinner, and a despiser of mercy, and then a damnable sinner. And so these are indeed conditions in the object, or causae sine quibus non [causes without which nothing], or objective material-constituent causes, not in themselves, but the foresight of them, not of God’s will as his essence, nor of his will as a will, but of his will as extrinsically denominated: a decree to damn Judas, e.g. because no otherwise is Judas an object capable of giving such an extrinsic denomination to God’s will.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/richard-baxter.html">Richard Baxter</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Catholic Theology Plain, Pure, Peaceable, for pacification of the dogmatical Word-Warriors who</cite>, (London: White, 1675), pt. 2, 1st Day’s Conference, about Predestination, pp. 8-9</span></figcaption>

</figure><figure class="quote" id="q-f2494a6812" data-kw="Contentment Wisdom">
<blockquote><p>We, indeed, look at things by pieces, we look at one detail and do not consider the relation that one thing has to another, but God looks at all things at once, and sees the relation that one thing has to another. When a child looks at a clock, it looks first at one wheel, and then at another wheel: he does not look at them all together or the dependence that one has upon another; but the workman has his eyes on them all together and sees the dependence of all, one upon another: so it is in God&#x27;s providence. Now notice how this works to contentment: when a certain passage of providence befalls me, that is one wheel, and it may be that if this wheel were stopped, a thousand other things might come to be stopped by this. In a clock, stop but one wheel and you stop every wheel, because they are dependant upon one another. So when God has ordered a thing for the present to be thus and thus, how do you know how many things depend upon this thing? God may have some work to do twenty years hence that depends on this passage of providence that falls out this day or this week.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/jeremiah-burroughs.html">Jeremiah Burroughs</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Rare Jewel of Christian Contentment</cite>, ch. 3, Lesson 9 (variety and order of providence)</span></figcaption>

<blockquote><p>rather than basing possibility and impossibility on repugnance and non-repugnance to being as such, Bradwardine based it on repugnance and non-repugnance to necessary being… while Bradwardine thought that God was the ontological source of necessity, possibility and impossibility, he did not think that God freely decided the modal status of propositions.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/gloria-ruth-frost.html">Gloria Ruth Frost</a></span><span class="wk"><span class="lbl">Work:</span> <cite>‘Thomas Bradwardine on God &amp; the Foundations of Modality’ in British Journal of the History of Philosophy 21</cite>, (2013), pp. 368-80, p. 378</span></figcaption>

<blockquote><p>In the Reformed view, both Catholic Counter-Reformation (L. Molina) and Remonstrant theology (Arminius) had modified this ‘will-based-theology’ [of Augustine and the Reformed] by their adaptation of middle knowledge (scientia media), resulting in a ‘knowledge-based-theology’ in which there is no room for real contingency (Maccovius 1641b, 103-4; Bac 2010). For Maccovius and most of seventeenth-century Reformed theologians, the main problem of the concept of middle knowledge is that it undermines the fundamental distinction between Creator and creature. Middle knowledge, used to describe a category of divine knowledge structurally or logically antecedent to God’s will, implies a necessity of the objects of divine knowledge (Maccovius 1641a, 25-26). Because middle knowledge postulates objects extra Deum [outside God] that precede his will, a logical contradiction is involved: objects outside God always presuppose the divine will. Finally. if God’s middle knowledge also contains his decree, then this would imply that it is impossible for God to choose an alternative (Maccovius 1641a, 25). Middle knowledge, then, approximates Stoic fate (fatum Stoicum), a natural or absolute necessity so inherent in the essential nature of things that even God is made dependent, like Homer’s Jupiter [who was constrained by nature] (Maccovius 1641b, 253).</p></blockquote>

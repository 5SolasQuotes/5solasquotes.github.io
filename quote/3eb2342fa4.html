<blockquote><p>The king receives royal power with the states to make good laws, and power by his royalty to execute those laws, and this power the community has devolved in the hands of the king and states of parliament; but the community keeps to themselves a power to resist tyranny, and to coerce it, and eatenus, ‘in so far’ is Saul subject, that David is not to compear before him, nor to lay down Goliah’s sword, nor disband his army of defence, though the king should command him so to do.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/samuel-rutherford.html">Samuel Rutherford</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Lex Rex</cite>, ... (1644; Edinburgh: Ogle, 1843), p. 35</span></figcaption>

<blockquote><p>Throughout August London suffered a grievous destruction of its citizens although a large part of its inhabitants had deserted it. On the 4th Bartholomew and Sturbridge Fairs were cancelled, and the preamble to an Order in [the civil town] Council published on the 5th records ‘the lamentable informations which we daily receive of the great spreading of the contagion of the plague through the Kingdom’. This order requested the Archbishops of Canterbury and York to instruct their bishops to notify the churchwardens [church grounds-keepers] of infected parishes to stop public assemblies and exhort their parishoners to observe the public fast… privately in their own homes.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/j-f-d-shrewsbury.html">J.F.D. Shrewsbury</a></span><span class="wk"><span class="lbl">Work:</span> <cite>A History of the Bubonic Plague in the British Isles Pre</cite>, (Cambridge, 1970), p. 323</span></figcaption>

</figure><figure class="quote" id="q-e3a561d997" data-kw="">
<blockquote><p>The sting was in the tail of Scotland’s experience of epidemic disease, for the last major outbreak, in 1644-1649, was the most devastating since the 1430’s. Contemporary accounts and modern assessments suggest that around one-fifth of the urban population perished.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/richard-oram.html">Richard Oram</a></span><span class="wk"><span class="lbl">Work:</span> <cite>‘”It cannot be decernit quha are clean and quha are foul”</cite>, vol. 30, No. 4, Special issue, Transformative Disorder: Scotland, 1550–1650 (Fall 2006/2007), pp. 13-39, p. 21</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/civil-government-and-society/plague-quarantine-and-public-health.html">Plague, Quarantine and Public Health</a></span></div>
<div class="actions"><button class="copy" data-copy="“The sting was in the tail of Scotland’s experience of epidemic disease, for the last major outbreak, in 1644-1649, was the most devastating since the 1430’s. Contemporary accounts and modern assessments suggest that around one-fifth of the urban population perished.”

— Richard Oram, ‘”It cannot be decernit quha are clean and quha are foul”: Responses to Epidemic Disease in Sixteenth and Seventeenth-Century Scotland’ Renaissance and Reformation, vol. 30, No. 4, Special issue, Transformative Disorder: Scotland, 1550–1650 (Fall 2006/2007), pp. 13-39, p. 21">Copy</button><a class="share" href="https://x.com/intent/post?text=%E2%80%9CThe+sting+was+in+the+tail+of+Scotland%E2%80%99s+experience+of+epidemic+disease%2C+for+the+last+major+outbreak%2C+in+1644-1649%2C+was+the+most+devastating+since+the+1430%E2%80%99s.+Contemporary+accounts+and+modern+assessments+suggest+that+around+one-fifth+of+the+urban+population+perished.%E2%80%9D%0A%0A%E2%80%94+Richard+Oram%2C+%E2%80%98%E2%80%9DIt+cannot+be+decernit+quha+are+clean+and+quha+are+foul%E2%80%9D%3A+Responses+to+Epidemic+Disease+in+Sixteenth+and+Seventeenth-Century+Scotland%E2%80%99+Renaissance+and+Reformation%2C+vol.+30%2C+No.+4%2C+Special+issue%2C+Transformative+Disorder%3A+Scotland%2C+1550%E2%80%931650+%28Fall+2006%2F2007%29%2C+pp.+13-39%2C+p.+21&amp;url=https%3A%2F%2F5solasquotes.github.io%2Fquote%2Fe3a561d997.html&amp;via=5Solas" target="_blank" rel="noopener">Share on X</a><a class="perma" href="../quote/e3a561d997.html">Permalink</a><a class="src" href="https://reformedbooksonline.com/on-spreading-diseases-and-plagues/#:~:text=The%20sting%20was%20in%20the%20tail,one%2Dfifth%20of%20the%20urban%20population%20perished&amp;text=The%20sting%20was%20in%20the%20tail%20of%20Scotland%E2%80%99s&amp;text=that%20around%20one%2Dfifth%20of%20the%20urban%20population%20perished" rel="noopener" target="_blank">Read it online · Reformed Books Online</a></div>
</figure><figure class="quote" id="q-a35304f3a9" data-kw="">
<blockquote><p>Though the prospect of a congregation gathering during times of contagion, whether led by the state church or a dissenting minister, is harrowing in and of itself, this did not stop such gatherings taking place. Plague services were one of the few gatherings of the public allowed, with some pulpits occupied by figures filling in for clergy who fled and room made for certain ejected ministers [from 1662] to take up their pulpits once more.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/civil-examples.html">Kathleen Miller</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Literary Culture of Plague in Early Modern England Pre</cite>, (Palgrave, 2016), p. 98</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/civil-government-and-society/plague-quarantine-and-public-health.html">Plague, Quarantine and Public Health</a></span></div>

</figure><figure class="quote" id="q-21f77d1305" data-kw="">
<blockquote><p>If it be said, That it seems sufficient for the Magistrate to maintain civil peace, and to restrain civil disturbances [in exclusion to restraining spiritual seducers]: We may look to these considerations in answer to this: …

3. Is it possible to separate growth in delusions and variety of absurd errors, and civil faction and discord? or, in experience have they ever been separated? We see they made men carnal in Corinth, they made them bite and devour one another in Galatia, as, ch. 5 of that epistle to them; yea, provoked to debates, envying, wraths, strifes, back-bitings, whisperings, swellings, tumults, 2 Cor. 12:20, and can such things be with the entertaining of civil peace? For, does not the interruption of civil peace flow from hatred, bitterness, alienation of mind, envy contradictions, and such like? And do not these necessarily wait on debates, and diversities of opinions? For, it is not to be supposed that such differences, proceeding from want of light, can be in men that are altogether mortified and without corruption: Therefore, may it be expected that that corruption will flame out upon such occasions; and that order is observable which the apostle has, 2 Cor. 12, just now cited, where he begins with debates, and proceeds by diverse steps, till it close with tumults: and these who are acquainted with the histories of older and latter times, will acknowledge this to be a truth.

4. There is almost but very little in the foregoing particulars mentioned, but what is necessary for the preserving and restoring of civil peace, or the preventing or censuring of the disturbance thereof, seeing there can be no solid ground whereupon to maintain peace, except the springs of debates and tumults be stopped, and such distempers from which they spring, be either cured and purged away, or restrained. … Or, in the last place, it may be considered, if ever it has done good to the State, wherein it was permitted, or to the magistrates who did permit the same; or, if thereby secret jealousies, heart-burnings, divisions and factions have not been fostered and brought up to such height as has proven dangerous to the body, and has hazarded the eating out of the belly, where it was bred, or the stinging of the bosom that did give it heat.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/james-durham.html">James Durham</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Dying Man’s Testament to the Church of Scotland</cite>, ... (1659) | Ch. 14, ‘What may be justly Acknowledged to be within the Reach and Power of the Magistrate in such a case, and so, what is his Duty?’</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/civil-government-and-society/plague-quarantine-and-public-health.html">Plague, Quarantine and Public Health</a></span></div>

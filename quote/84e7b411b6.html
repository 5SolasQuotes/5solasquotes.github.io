<main class="wrap"><figure class="quote" id="q-84e7b411b6" data-kw="">
<blockquote><p>Suppose some persons laugh. You weep on the other hand for their transgression! Many also once laughed at Noah while he was preparing the ark; but when the flood came, he laughed at them; or rather, the righteous man never laughed at them at all, but wept and bewailed! When therefore you see persons laughing, reflect that those teeth, that grin now, will one day have to sustain that most dreadful wailing and gnashing, and that they will remember this same laugh on That Day while they are grinding and gnashing! Then you too shall remember this laugh! How did the rich man laugh at Lazarus! But afterwards, when he beheld him in Abraham’s bosom, he had nothing left to do but to bewail himself!</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/john-chrysostom.html">John Chrysostom</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Homilies on the Statues, in Saint Chrysostom: On the Priesthood, Ascetic Treatises, Select Homilies and Letters, Homilies on the Statues</cite>, ed. Philip Schaff, trans. W. R. W. Stephens, vol. 9, A Select Library of the Nicene and Post-Nicene Fathers of the Christian Church, First Series (New York: C</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/the-church.html">The Church</a></span></div>

</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-4c74426e65" data-kw="">
<blockquote><p>The [opposing] author expresses what his meaning is in the other part of this book: for he describes these [church] officers and these laws, what they are: Concerning all which this I say in general, that here is nothing but palpable ignorance to be found, for first these governing officers, pastors, doctors, elders, deacons and relievers, being five in number, are so necessarily required that the want [lack] of these or any of these in a congregation, causes it to be no Church apparant… Secondly, that the want of elders takes not away the esse or being of the church, considering that Christ and his disciples which joined with Him were the apparant Church, and yet during the time of his humiliation these officers were not erected. And when many revolted, as is to be seen, Jn. 6, Christ asking the twelve if they also would go away, Peter answered in the name of the rest, ‘Master to whom shall we go, Thou hast the words of eternal life?’ so that Peter accounts the Word a sufficient warrant for his continuing with Christ, howsoever these men though they confess that the Word of God is to be heard, yet deny the hearing of it at their mouths which have not ordained elders among them. But this may seem no sufficient proof which is taken from Christ and his disciples forasmuch as this discipline was not then commanded. I answer that if there were a time when the Church of Christ was without this government, and forasmuch as it received not the government of the Jews, it is not a perpetual rule that outward government should be the life of the Church. But I will not hold them in this straight: they ask where we can find a Church without this government after that Christ had sent his Spirit upon the disciples. I answer that as Timothy was left at Ephesus, so was Titus in Crete, I mean in the House of God, which is the Church of the living God. And yet at that time elders were not appointed in that Church before Titus had ordained them: not to speak of the Church of Jerusalem, which made choice of deacons, but not of elders. Also it is plain that the elders which were appointed in the churches by the apostles were for the most part such as dealt in the Word, and not in goverment only, as hereafter shall be made more manifest in his due place.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/richard-alison.html">Richard Alison</a></span><span class="wk"><span class="lbl">Work:</span> <cite>A Plain Confutation of a Treatise of Brownism</cite>, (London: Scarlet,1590), A Plain Confutation, pp. 24-26</span></figcaption>

</figure><figure class="quote" id="q-7a1a4f739d" data-kw="">
<blockquote><p>It is the complaint of not a few of such who were in Christ before me, that most of us inhabit and dwell in a parched land; the people of the Lord are like a land not rained upon. Though some dare not deny but this is the garden of the Beloved, and the vineyard which the Lord does keep and water every moment; Yet, O where are the sometimes quickening breathings and influences from Heaven that have refreshed his hidden ones! The causes of his withdrawings are unknown to us.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/john-currie.html">John Currie</a></span><span class="wk"><span class="lbl">Work:</span> <cite>An Essay on Separation: or a Vindication of the Church of Scotland contra the Seceders</cite></span></figcaption>

<blockquote><p>Whether may that baptism be allowed which is administered by heretics or Papists? If it be meant of such heretics as deny the principles of heavenly doctrine and utterly corrupt the essential form of baptism (as the Arians, Samosatians, Manichaeans and Macedonians) which are not sincere in the doctrine of the Trinity, baptizing so in the name of the Father, of the Son and of the Holy Ghost, that they deny nevertheless that the Son and Holy Ghost are coeternal, coessential and of equal honor with the Father, or that the Son of God did truly assume the human nature; then such baptism is not to be ratified, but to be accursed. For the essential form being once taken away, the matter itself is also taken away. And therefore it is to be thought that such are not so much to be rebaptized, but as that indeed they should rather be first consecrated with true baptism, who being converted to the knowledge of the truth, desire to be engrafted into the orthodox Church. And this agrees with the decree of the Nicene Council. But we must judge otherwise of the baptism of some other heretics: as the Novatians and Donatists, who delivered the true doctrine of the Trinity, or of Papists (who are out of the way of truth in some part of doctrine, and who possess the place of pastors and use the public ministery, either by common error, by long sufferance or by force, though they be not to be accounted as truly called). Wherein, although there be many things needless and superstitious, yet still Christ is retained and held, at least in title, to be the matter itself, the chief head and essential form of the institution, and the native meaning (without idolatry) of the words of baptism, “I baptize thee in the name of the Father, and of the Son and of the Holy Ghost,” is retained. Moreover it pleased God in mercy to conserve a remnant of his Church in the midst of Popery itself, even as the Israelites continued the use of circumcision though they embraced a false and impious service of God; and the vows are made in the name of Christ and not of Antichrist, or of any idol. Therefore that baptism is not void, but of value and force: for it is the ministry of those person, but of the Church as yet covered or hidden in Popery. They, I grant, did sprinkle the head or body, but Christ baptized inwardly. And therefore such baptism [is] neither to be annihilated, neither does it require Anabaptistical rebaptizing. But, forasmuch as they teach wickedly in other matters, they give just cause why the faithful should necessarily depart from them, as it is written, 1 John 5:21, “Flee idols.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/william-bucan.html">William Bucan</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Institutions of the Christian Religion</cite>, pp. 704-6, 714, 738-39</span></figcaption>

host%2C%E2%80%9D+is+retained.+Moreover+it+pleased+God+in+mercy+to+conserve+a+remnant+of+his+Church+in+the+midst+of+Popery+itself%2C+even+as+the+Israelites+continued+the+use+of+circumcision+though+they+embraced+a+false+and+impious+service+of+God%3B+and+the+vows+are+made+in+the+name+of+Christ+and+not+of+Antichrist%2C+or+of+any+idol.+Therefore+that+baptism+is+not+void%2C+but+of+value+and+force%3A+for+it+is+the+ministry+of+those+person%2C+but+of+the+Church+as+yet+covered+or+hidden+in+Popery.+They%2C+I+grant%2C+did+sprinkle+the+head+or+body%2C+but+Christ+baptized+inwardly.+And+therefore+such+baptism+%5Bis%5D+neither+to+be+annihilated%2C+neither+does+it+require+Anabaptistical+rebaptizing.+But%2C+forasmuch+as+they+teach+wickedly+in+other+matters%2C+they+give+just+cause+why+the+faithful+should+necessarily+depart+from+them%2C+as+it+is+written%2C+1+John+5%3A21%2C+%E2%80%9CFlee+idols.%E2%80%9D%0A%0A%E2%80%94+William+Bucan%2C+Institutions+of+Christian+Religion%2C+pp.+704-6%2C+714%2C+738-39&amp;url=https%3A%2F%2F5solasquotes.github.io%2Fquote%2Fd6ef552cca.html&amp;via=5Solas" target="_blank" rel="noopener">Share on X</a><a class="perma" href="../quote/d6ef552cca.html">Permalink</a><a class="src" href="https://reformedbooksonline.com/is-roman-catholic-baptism-valid/#:~:text=Whether%20may%20that%20baptism%20be%20allowed,written%2C%201%20John%205%3A21%2C%20%E2%80%9CFlee%20idols&amp;text=Whether%20may%20that%20baptism%20be%20allowed%20which%20is&amp;text=it%20is%20written%2C%201%20John%205%3A21%2C%20%E2%80%9CFlee%20idols" rel="noopener" target="_blank">Read it online · Reformed Books Online</a></div>

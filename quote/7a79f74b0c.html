<main class="wrap"><figure class="quote" id="q-7a79f74b0c" data-kw="">
<blockquote><p>Where these Forms are contended for by men, with respect unto their own use and practice only, as suitable to their experience, and judged by them a serving of God with the best that they have; I shall not take the least notice of them, nor of any dissent about them. But whereas a persuasion not only of their lawfulness but of their necessity is made use of unto other ends and purposes, wherein the peace and edification of believers is highly concerned, it is necessary we should make some inquiry thereinto.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/john-owen.html">John Owen</a></span><span class="wk"><span class="lbl">Work:</span> <cite>A Discourse of the Work of the Holy Spirit in Prayer with a Brief Inquiry into the Nature and Use of Mental Prayer and Forms</cite>, (London, 1682) being Book 7 of Pneumatologia: or a Discourse concerning the Holy Spirit in Works, 4.235-350, Ch. 11, ‘Prescribed forms of Prayer Examined’; p. 212</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/worship/public-worship.html">Public Worship</a></span></div>
<div class="actions"><button class="copy" data-copy="“Where these Forms are contended for by men, with respect unto their own use and practice only, as suitable to their experience, and judged by them a serving of God with the best that they have; I shall not take the least notice of them, nor of any dissent about them. But whereas a persuasion not only of their lawfulness but of their necessity is made use of unto other ends and purposes, wherein the peace and edification of believers is highly concerned, it is necessary we should make some inquiry thereinto.”

— John Owen, A Discourse of the Work of the Holy Spirit in Prayer with a Brief Inquiry into the Nature and Use of Mental Prayer and Forms (London, 1682) being Book 7 of Pneumatologia: or a Discourse concerning the Holy Spirit in Works, 4.235-350, Ch. 11, ‘Prescribed forms of Prayer Examined’; p. 212">Copy</button><a class="share" href="https://x.com/intent/post?text=%E2%80%9CWhere+these+Forms+are+contended+for+by+men%2C+with+respect+unto+their+own+use+and+practice+only%2C+as+suitable+to+their+experience%2C+and+judged+by+them+a+serving+of+God+with+the+best+that+they+have%3B+I+shall+not+take+the+least+notice+of+them%2C+nor+of+any+dissent+about+them.+But+whereas+a+persuasion+not+only+of+their+lawfulness+but+of+their+necessity+is+made+use+of+unto+other+ends+and+purposes%2C+wherein+the+peace+and+edification+of+believers+is+highly+concerned%2C+it+is+necessary+we+should+make+some+inquiry+thereinto.%E2%80%9D%0A%0A%E2%80%94+John+Owen%2C+A+Discourse+of+the+Work+of+the+Holy+Spirit+in+Prayer+with+a+Brief+Inquiry+into+the+Nature+and+Use+of+Mental+Prayer+and+Forms+%28London%2C+1682%29+being+Book+7+of+Pneumatologia%3A+or+a+Discourse+concerning+the+Holy+Spirit+in+Works%2C+4.235-350%2C+Ch.+11%2C+%E2%80%98Prescribed+forms+of+Prayer+Examined%E2%80%99%3B+p.+212&amp;url=https%3A%2F%2F5solasquotes.github.io%2Fquote%2F7a79f74b0c.html&amp;via=5Solas" target="_blank" rel="noopener">Share on X</a><a class="perma" href="../quote/7a79f74b0c.html">Permalink</a><a class="src" href="https://reformedbooksonline.com/on-the-use-of-forms-of-prayer/#:~:text=Where%20these%20Forms%20are%20contended%20for,we%20should%20make%20some%20inquiry%20thereinto&amp;text=Where%20these%20Forms%20are%20contended%20for%20by%20men&amp;text=is%20necessary%20we%20should%20make%20some%20inquiry%20thereinto" rel="noopener" target="_blank">Read it online · Reformed Books Online</a></div>
</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-07a400f136" data-kw="">
<blockquote><p>1. Our [Independent] Brethren say [that] it is… another thing to say [as the presbyterians] that it was impossible that they [the Christians in Jerusalem in Acts] could be one congregation and meet in one place… [Rutherford’s] Answer: …now the question then is… whether or no[t] was the Church at Jerusalem of such a competent number, only as that they could meet not only occasionally to hear a sermon, but in an ordinary Church-meeting, to hear the Word and communicate in the breaking of bread and seals of the Covenant; and though the want [lack] of a capacious house be also an extrinsic impediment why they could not meet… but it cannot be said that they wanted a capacious house for the ordinary meeting of a congregation, the ordinary and genuine use whereof is to be edified by the Word and sacraments; and that an ordinary house could contain such a number of thousands and multitudes as can be edified in a congregational way is denied.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/samuel-rutherford.html">Samuel Rutherford</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Due Right of Presbyteries, ‘Acts 15, A Pattern of a Juridicial Synod’</cite>, … (1644), pt. 1, pp. 426-27</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/worship/public-worship.html">Public Worship</a></span></div>

 Books Online</a></div>
</figure><figure class="quote" id="q-35a782281e" data-kw="">
<blockquote><p>4. For your ‘Amen’, as I am certain, that the Apostle’s words may be understood of a consentient, though silent, ‘Amen’; so it is evident that even in the point of order, your so frequently repeated ‘Amen’ is superfluous and vain: but if you will reduce your practice to a decent use, seeing the matter appears to be indifferent, if you love to express it, use your liberty, only permit us the like favor of ours.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/robert-macward.html">Robert MacWard</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The True Non-Conformist</cite>, (1671), p. 287. Against the English Liturgy’s over use of a congregational ‘Amen’:</span></figcaption>

<main class="wrap"><figure class="quote" id="q-84db231a43" data-kw="">
<blockquote><p>[T]he world will not come to an end until the number of the elect is complete, which completion is as it were the fulfilment of the whole of divine predestination; wherefore it is not fitting that the end of the world should be revealed except to him who has received the revelation of the whole of divine predestination, that is to Christ as man, through whom the whole predestination of the human race is in a manner fulfilled.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/thomas-aquinas.html">Thomas Aquinas</a></span><span class="wk"><span class="lbl">Work:</span> <cite>On the Power of God</cite>, (c. 1266), Q. 5, Art. 6, co.</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/theology/faith-and-reason.html">Faith and Reason</a></span></div>

</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-5d4f703ef3" data-kw="">
<blockquote><p>Why have any religion at all? Is it not enough to have a good, sensible philosophy?” No. If this had been enough, clericalism would have been driven to the wall long ago. The experiment has been thoroughly tried in France for eighty years, and has failed. The power of the priesthood tends to increase, and the superstitions of the Roman church grow worse and worse.

No doubt atheism in its various forms — materialism, pantheism, positivism has advanced and spread; but the bourgeoisie — the bulk of the well-to-do citizens — have a horror and dread of atheism, and by this very fact are impelled to support the only church they know of; and so superstition is made fashionable. “Man cannot live by bread alone.” All his higher cravings are famished when he attempts to subsist only on what he can find in atheism.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/leonard-woolsey-bacon.html">Leonard Woolsey Bacon</a></span><span class="wk"><span class="lbl">Work:</span> <cite>God’s Wonderful Work in France: An Introduction of the Deputation from the Protestants of France to the American Churches</cite>, (New York: American Tract Society, 1880), pp 17-18.</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/theology/faith-and-reason.html">Faith and Reason</a></span></div>

</figure><figure class="quote" id="q-439c4aef4d" data-kw="">
<blockquote><p>XIII… And a little later: “As the soul is in the body, so Christians are in the world.” The soul, although dispersed throughout all the members of the body, is nonetheless present in it; likewise, Christians, though they dwell in the world, are not of the world. The invisible soul is established as if in a garrison within the visible body; similarly, Christians are recognized while they sojourn in the world, but their divine worship is invisible. And a little later: Although the soul is enclosed in the body, it still preserves the body; likewise, although Christians are detained in the world as if in custody, they also preserve the world.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/amandus-polanus.html">Amandus Polanus</a></span><span class="wk"><span class="lbl">Work:</span> <cite>‘Analytical Theses on Colossians</cite>, (on Col. 1:1-11) $3 Download tr. Jonathan Tomes (Basel: Johannes Schroeter, 1601)</span></figcaption>

</figure><figure class="quote" id="q-6c602e8f74" data-kw="">
<blockquote><p>Our intellect understands nothing except in virtue of the first light and truth, so every act of the intellect involved in thinking that something does not exist obtains in virtue of the first light. But it is impossible to think in virtue of the first light, that the first light or truth does not exist. Therefore, it is in no way possible to think that the first truth does not exist.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/bonaventure.html">Bonaventure</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Other citations (work not named)</cite>, In Sententiarum 2.8.1.1.2 (d. 1274; Quaracchi 1:153)</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/theology/faith-and-reason.html">Faith and Reason</a></span></div>

</figure><figure class="quote" id="q-f0599d8897" data-kw="">
<blockquote><p>Add, that Possevinus [d. 1611] in his Sacred Apparatus under the entry “Gilbert Genebrard” judges that the no less harsh phrases of Augustine, Jerome and all the other phrases of the fathers, by which they call God the cause of Himself, must be so expounded with Suarez, that He is ‘from Himself’ and ‘Autotheos’, negatively, that is, having being without emanation from another: so that through that negation the positive and simple perfection of that being is declared, which so in itself and in its essence includes existence itself, that it receives it from no one: which perfection that being does not have, which does not have being, unless it receives it from another.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/gisbertus-voetius.html">Gisbertus Voetius</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Select Theological Disputations</cite>, vol. 1, pt. 2 tr. by AI by Onku (Utrecht: Johannes a Waesberg, 1648) | ‘Francis Gomarus’s Treatise on Christ, Autotheos, with Notes’, ‘Notes on the Preceding Diatribe’, p. 30 Latin</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/theology/faith-and-reason.html">Faith and Reason</a></span></div>

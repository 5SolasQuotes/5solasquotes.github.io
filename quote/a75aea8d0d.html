<main class="wrap"><figure class="quote" id="q-a75aea8d0d" data-kw="">
<blockquote><p>It is often said that the divided condition of Christendom is an evil, and so it is. But the evil consists in the existence of the errors which cause the divisions and not at all in the recognition of those errors when once they exist.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/j-gresham-machen.html">J. Gresham Machen</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Christianity and Liberalism, New Edition</cite>, p. 50</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/the-church/church-unity-and-fundamentals.html">Church Unity and Fundamentals</a></span></div>

</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-587b900ea0" data-kw="">
<blockquote><p>For profession brings a Church into outward fellowship with Christ’s body (as bad servants with a good master) and so into the way of being savingly of the body of Christ if they resist not, grieve not, quench not, or despise not the Spirit of grace. Secondly, for the form of a true Church, that is Christ united unto the persons professing his saving truth. For as the form of a man is his soul united to his body, so the form of a Church, which is the body of Christ, is Christ united unto it. Now, that Christ is united unto our Church is proved thus: because He gives the law of union to us as to the body, and makes it effectuall for conviction, or conversion, to serve the living and true God. As a king is united to his subjects by his laws, and executions of them for rewards and punishments: so is Jesus Christ to our Church. As the head united gives laws to the body for safety: so does Christ give laws to us for our salvation in his Word.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/robert-abbot.html">Robert Abbot</a></span><span class="wk"><span class="lbl">Work:</span> <cite>A Trial of our Church-Forsakers. Or A Meditation Tending to still the Passions of Unquiet Brownists, upon Heb. 10:25</cite>, ... (London: Payne, 1639) Abbot (c. 1588 – c. 1662) was a partially conforming English, puritan divine., sect. 6; pp. 30-31</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/the-church/church-unity-and-fundamentals.html">Church Unity and Fundamentals</a></span></div>

0Word" rel="noopener" target="_blank">Read it online · Reformed Books Online</a></div>
</figure><figure class="quote" id="q-aedb36876d" data-kw="">
<blockquote><p>Now of Churches faulty and corrupted, some raze the foundation; others, on the true foundation build timber, hay, stubble. From those we must separate; from these we may not. Peter’s is eternal, ‘Whither shall we go from Thee; Thou hast the words of eternal life.’ (Jn. 6:68) Where these words are found, woe be to us if we be not found. Amongst many good separations then, yours cannot be separated from evil, for that we should so far separate from the evil that therefore we should separate from God’s children in the communion of the holy things of God, that for some (after your worst done) not-fundamental corruptions, we should separate from that Church in whose womb we were conceived, and from betwixt whose knees we fell to God: in a word (as one of yours once said) to separate not only from visible evil, but from visible good, as all Antichristian: who but yours can think less than absurd and impious? Grant we should be clean separated from the world, yet if we be not, must you be separated from us?¹ ¹ Neque propter paleam relinquim are am Domini, neque propter pisces malos rumpimus retia Domini. Augustine, Epistle 48 Do but stay till God have separated us from Himself: will the wise husbandman cast away his corn-heap for the chaff and dust? Shall the fisher cast away a good draught because his drag-net has weeds? Does God separate from the faithful soul, because it has some corruptions, her inmates, though not her commanders?</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/joseph-hall.html">Joseph Hall</a></span><span class="wk"><span class="lbl">Work:</span> <cite>A Common Apology of the Church of England against the Unjust Challenges of the over-just Sect, commonly called Brownists</cite>, … (London: Macham, 1610), sect. 4, pp. 10-11</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/the-church/church-unity-and-fundamentals.html">Church Unity and Fundamentals</a></span></div>

</figure><figure class="quote" id="q-5c87d81f26" data-kw="">
<blockquote><p>The catholic or universal visible Church is the assembly of all those which make profession of the Gospel of Jesus Christ throughout the whole world, distinguished (as we have said) into many particular Churches, all which do make but one body. Of all these particular, as members and parts of one and the self-same body, some are pure, other some are impure, some more, and some less sound, and some at this day are sick even unto death… Those that are of the purer and sounder Churches, we call them sound and true Churches, consenting to the true doctrine, which is the name, that for the most part, the ancient fathers have given them. The others we call the erring, heretical or schismatical Churches, according as they err, either in faith or in charity, against the square and right rule of Christ, or against the rule of his Church, either in the one or in the other, notwithstanding every one in his degree.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/philip-mornay.html">Philippe de Mornay</a></span><span class="wk"><span class="lbl">Work:</span> <cite>A Notable Treatise of the Church in which are handled all the Principal Questions that have been moved in our Time concerning that matter</cite>, [in controversy with Romanism] (London: Barker, 1579), ch. 2, n.p.</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/the-church/church-unity-and-fundamentals.html">Church Unity and Fundamentals</a></span></div>

</figure><figure class="quote" id="q-85e9dc4a2c" data-kw="">
<blockquote><p>We acknowledge separation from corruption, but not from the worship of corrupters, when they keep the foundation; the Samaritan-Church had not the foundation, but worshipped they knew not what, neither was there salvation in their Church, Jn. 4:2; but there was the true God worshipped among the Jews and salvation amongst them.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/samuel-rutherford.html">Samuel Rutherford</a></span><span class="wk"><span class="lbl">Work:</span> <cite>A Peaceable &amp; Temperate Plea for Paul’s Presbytery in Scotland</cite>, … (London: Bartlet, 1642), ch. 10, ‘Whether or not it be lawful to separate from a true Church visible, for the corruption of teachers… where faith is begotten by the preaching of professed truth?’, p. 133</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/the-church/church-unity-and-fundamentals.html">Church Unity and Fundamentals</a></span></div>

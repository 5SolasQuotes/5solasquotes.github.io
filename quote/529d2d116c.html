<main class="wrap"><figure class="quote" id="q-529d2d116c" data-kw="">
<blockquote><p>From this it is clear that the reason for knowing a future sin of commission is the concurrence to be exhibited, and for a sin of omission the concurrence not exhibited — or the negation of concurrence. Yet it does not appear how God concurs toward that act of commission: whether antecedently or concomitantly. For Scotus says only that God knows that he will not cooperate — by which word a simultaneous concurrence is suggested, not a preceding one with any priority. And therefore the sinning will would not be predetermined in any antecedent manner by God.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/francisco-macedo.html">Francisco Macedo</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Collations of the Teachings of St. Thomas &amp; Scotus, with the Differences between the Two: with the Texts of Both Faithfully Presented, and the Sentences Subtly Examined, with the Commentaries of the Interpreters… vol. 2 tr. AI by Vertias (Padua: Frambotti, 1671), , bk. 2, Collation 9, pp. 361-429 | Concurrence with Evil Actions | God’s Knowledge of Sin</cite>, p. 418</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/providence/concurrence.html">Concurrence</a></span></div>

</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-ba2904b67e" data-kw="">
<blockquote><p>It is first established that God neither is nor can be the author of sin… With this truth asserted, the question is: whether and how God concurs with the free cause toward the act of sin?… the common sense of all is that God does not concur with the formal element of sin, whatever that is, but only with the material and the substrate of the formal… For even the heretics do not say that God formally determines toward formal malice; indeed, Calvin explicitly says at (bk. 1, Institutes, ch. 18) that God does not will the treachery.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/francisco-macedo.html">Francisco Macedo</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Collations of the Teachings of St. Thomas &amp; Scotus, with the Differences between the Two: with the Texts of Both Faithfully Presented, and the Sentences Subtly Examined, with the Commentaries of the Interpreters… vol. 2 tr. AI by Vertias (Padua: Frambotti, 1671), , bk. 2, Collation 9, pp. 361-429 | Concurrence with Evil Actions | Intro</cite>, pp. 415-16</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/providence/concurrence.html">Concurrence</a></span></div>

ner" target="_blank">Read it online · Reformed Books Online</a></div>
</figure><figure class="quote" id="q-e2c0347ac9" data-kw="">
<blockquote><p>I first note that Thomas in this matter taught exactly the same as Scotus with regard to premotion and the determination of the secondary cause by the first, in general. In particular, however, Scotus expressly rejected that physical predetermining quality and a similar influence through something else impressed antecedently in the free will — which many Thomists posited, because Thomas manifestly neither posited nor rejected it, from which they took occasion to introduce it. But Thomas, if my judgment carries any weight, never required it; nor could I find a place in him where he would admit it. And this I have often publicly affirmed in the very presence of Thomists. Therefore I hold that Thomas and Scotus are in agreement on excluding that quality.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/francisco-macedo.html">Francisco Macedo</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Collations of the Teachings of St. Thomas &amp; Scotus, with the Differences between the Two: with the Texts of Both Faithfully Presented, and the Sentences Subtly Examined, with the Commentaries of the Interpreters… vol. 2 tr. AI by Vertias (Padua: Frambotti, 1671), , bk. 2, Collation 9, pp. 361-429 | Macedo’s Judgment</cite></span></figcaption>
<div class="meta"><span class="t"><a href="../topics/providence/concurrence.html">Concurrence</a></span></div>

ty&amp;text=I%20first%20note%20that%20Thomas%20in%20this%20matter&amp;text=Scotus%20are%20in%20agreement%20on%20excluding%20that%20quality" rel="noopener" target="_blank">Read it online · Reformed Books Online</a></div>
</figure><figure class="quote" id="q-aac5bc0451" data-kw="">
<blockquote><p>For they [Suarezians] place it [the will] in every state always in a certain citadel of integral power, constituted in an equilibrium with full capacity for either side, deflected by no inclination — altogether its own master and arbiter, as it were giving laws to causes and circumstances as they present themselves, commanding them to comply with its nod and to await its direction. Yet the matter is very different. For our will in this state of fallen nature, in which it exists, has greatly weakened and declined from that first state of integrity and innocence, as the Second Council of Orange and the Council of Trent teach us. Moreover, it depends greatly upon the knowledge and presentation of objects and follows the intellect leading it, accommodating itself to it rather than the intellect to it. In addition, it is disturbed by concupiscence — both irascible and concupiscible — by which it is often displaced from its position and dislodged from its right station. It is marvelously and variously affected by movements and perturbations of the soul; sometimes it is pressed and driven by appetite, and sometimes enticed and drawn by pleasure it serves lust. On another side, it is shaken from the movement of appetite and terror, and in its own station it wavers and scarcely maintains its integral liberty. And again — how often is it seized by ignorance and blindness of the mind, and deviates from the straight path of reason? How often, burning with the heat of lust and without a bridle, does it run headlong and is immersed in the mire of pleasures, from which not without sorrow and groaning does it drag itself out defiled? Not rarely do inveterate habits so incline it that it resists them with difficulty. Even the domestic familiarity of custom makes it live with custom as if at home, and causes it to neglect new things, however excellent, as though foreign. Indeed, I have seen nothing more volatile than the will when it is free from affection, nothing more constant when occupied with affection. Nor is it so powerful and mistress of itself as is imagined; since in its first primary acts it is desired and wholly occupied, and suffers involuntarily the assaults of those acts and their concomitant effects. It is bent by counsels, warnings, prayers, threats, loves, terrors, simulations, flatteries, titillations, jests, laughter, applause — by these it is led and drawn, so that it seems to do nothing other than what those authors call the mistress — namely, to serve everyone. And yet even then, when it is affected in so many ways, shaken, changed, drawn, and bent, it preserves its liberty… The will, inclined toward lust, can enjoy a woman and be led by that pleasure and remain free. Will it not be able to remain free when inclined and premoved by God?</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/francisco-macedo.html">Francisco Macedo</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Collations of the Teachings of St. Thomas &amp; Scotus, with the Differences between the Two: with the Texts of Both Faithfully Presented, and the Sentences Subtly Examined, with the Commentaries of the Interpreters… vol. 2 tr. AI by Vertias (Padua: Frambotti, 1671), , bk. 2, Collation 9, pp. 361-429 | Factors upon the Will</cite>, pp. 376-77</span></figcaption>

<blockquote><p>Though the natural virtue of doing a sinful action be from God, and supported by him, yet this doth not blemish the holiness of God. While God concurs with them in the act, he instills no evil into men. … The physical goodness of the action depends on God, the moral evil on the creature.</p></blockquote>

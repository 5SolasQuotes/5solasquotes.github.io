<blockquote><p>Proposition 2. The faith which Paul speaks of is not the same with that which James speaks of. What kind of faith that is which Paul speaks of appears by the description which he himself gives us of it, Gal. 5. He is there speaking of justification, verse 4, and of the righteousness of faith, verse 5. And then tells us what kind of faith it is, verse 6, a faith working by love, a faith which shows itself to be a living faith by the fruit it brings forth… Faith is never opposed in Scripture to Gospel-works; because it is inclusive of ’em, and they can’t be divided, but always go together. This is faith in Paul’s sense: the tree with it’s fruit hanging on it: a living, working, fruit-bearing faith. But now the faith that James speaks of [in ch. 2], is such a faith as is alone, verse 17, without works, verse 20, and therefore is dead, verse 17. … Proposition 4. They both speak of the same justification. This is undeniably evident, because they both produce the same Scripture for the proof of their distinct positions, or assertions. James proves that Abram was justified by works because by his offering up Isaac, that Scripture was fulfilled which says, ‘Abram believed God, and it was counted to him for righteousness,’ verse 23. And Paul proves that Abram was justified by faith, and not by works, because the Scripture saith, Abram believed God, and it was counted to him for righteousness, Rom. 4:2-3… But the same Scripture proves that Abram was justified both by faith and by works; and therefore faith, and such works as are the fruit of faith are all one in Scripture-account. They are materially the same, though there may be some formal difference between ’em. And therefore, to be justified by faith, according to Paul, and by works according to James, are all one… (2) This justification he [James] speaks of was before God: For he produces that passage of Scripture for the proof of what he asserts, which all acknowledge does refer to a man’s justification before God, viz. that Abraham believed God, and it was counted to him for righteousness, verse 23. … (1) ‘Tis only the Works of the Law, that the apostle Paul opposes and rejects in this point of justification. This has been fully proved already, ch. 9, §2. (2) The Hebrew Word [Hebrew] signifies to be righteous, as well as to justify, as was showed at first setting out. (3) To justify is to account righteous, and treat as such. (4) The Scripture does expresly define being righteous by doing righteousness, and that with a special remark and observable caution prefixed, 1 Jn. 3:7, ‘Little children, let no man deceive you: He that does righteousness is righteous, even as He is righteous.’… (5) Abraham’s obedience, and Phineas’s zeal, were reckoned to them for righteousness, Jm. 2:21, 23; Ps. 106:31, and Abel by his sacrifice obtained witness that he was righteous, Heb. 11:4… (6) Whatsoever is required to pardon is required to justification; for though the formal, precise notion of justification does not consist in pardon, yet pardon is included in it taken largely, as being the inseparable adjunct and undivided companion thereof (as has been showed, ch. 4, §5). But repentance, confession, forgiveness of others, and the like, are required to pardon… (7) The Scripture frequently uses the Word [Faith] in a large Sense, so as to comprehend Obedience too, as was show’d, ch. 11. §. 2. (8) We are expresly said, to be justified by Works. To all which I add by way of Antidote. §5. (9) The admitting of gospel-works or holiness to have an interest in justification, and to be an ingredient thereof, is not inconsistent with, nor derogatory to free-grace… (10) And lastly, this doctrine has no bad influence upon practice, but is less subject to abuse in this respect than the other… … §9… I shall extract the spirits and quintessence of all in the following description of justification with the Scriptures, that proves every part of it: Justification is an act (Rom. 8:33) of God’s (Rom. 3:24) free-grace, whereby for the sake of Christ (1 Cor. 6:11), that is, for the merit of his obedience (Rom. 5:19), or, upon consideration of Christ’s righteousness (Rom. 5:18), or his blood (Rom. 5:9), that is, his suffering the punishment (Isa. 53:11) due to us for our sins, He at present counts (Rom. 4:3) righteous all true believers (Acts 13:39; Rom. 5:1), who are endued with living (Jm. 2:20), working faith (Gal. 5:6; Jm. 2:24), and deals with ’em as such, by discharging (Gal. 3:13) ’em from the curse of the Law, and eternal condemnation (Rom. 5:9; 8:33-34) (which is pardon in the most proper and famous sense) and bestowing upon ’em those privileges and benefits which belong to righteous persons, viz. reconciliation (Rom. 5:1), and adoption (Tit. 3:7), and then at last will solemnly declare and pronounce (Rom. 5:18) ’em righteous at the Day of Judgment, and bestow upon ’em eternal life (Acts 3:19; Mt. 12:36-37).</p></blockquote>

<blockquote><p>20. Justification does not free from sin and death directly by taking away the blame or stain or all the effects of sin; rather it removes the guilty obligation to undergo eternal death. Rom. 8:1, 33-34, ‘There is no condemnation… Who shall lay anything to their charge?… who shall condemn? 21. Nor does it take away guilt so that the deserving of punishment is removed from sin. This cannot be taken away as long sin itself remains. But justification does take away guilt so that its haunting or deadly effects vanish. … 23. Not only are past sins of justified persons remitted but also those to come, Num. 23:25. God sees no iniquity in Jacob or perverseness in Israel. Justification has left no place for condemnation. John 5:24, ‘He who believes has eternal life and shall not come into condemnation’ — justification gives eternal life surely and immediately. It also makes the whole remission obtained for us in Christ actually ours. Neither past or present sins can be altogether fully remitted unless sins to come are in some way remitted. 24. The difference is that past sins are remitted specifically and sins to come potentially. Past sins are remitted in themselves, sins to come in the subject or the person sinning. 25. Yet those who are justified need daily the forgiveness of sins. This is true because the continuance of grace is necessary to them; the consciousness and manifestation of forgiveness increases more and more as individual sins require it; and the execution of the sentence which is pronounced in justification may thus be carried out and completed.</p></blockquote>

<div class="actions"><button class="copy" data-copy="“20. Justification does not free from sin and death directly by taking away the blame or stain or all the effects of sin; rather it removes the guilty obligation to undergo eternal death. Rom. 8:1, 33-34, ‘There is no condemnation… Who shall lay anything to their charge?… who shall condemn? 21. Nor does it take away guilt so that the deserving of punishment is removed from sin. This cannot be taken away as long sin itself remains. But justification does take away guilt so that its haunting or deadly effects vanish. … 23. Not only are past sins of justified persons remitted but also those to come, Num. 23:25. God sees no iniquity in Jacob or perverseness in Israel. Justification has left no place for condemnation. John 5:24, ‘He who believes has eternal life and shall not come into condemnation’ — justification gives eternal life surely and immediately. It also makes the whole remission obtained for us in Christ actually ours. Neither past or present sins can be altogether fully remitted unless sins to come are in some way remitted. 24. The difference is that past sins are remitted specifically and sins to come potentially. Past sins are remitted in themselves, sins to come in the subject or the person sinning. 25. Yet those who are justified need daily the forgiveness of sins. This is true because the continuance of grace is necessary to them; the consciousness and manifestation of forgiveness increases more and more as individual sins require it; and the execution of the sentence which is pronounced in justification may thus be carried out and completed.”

<blockquote><p>10. What all the more rigid Protestants affirm for certain, that God, though not in time, yet in the order of nature, first justifies the sinner, or forgives his sins, and afterwards makes him just, or sanctifies him, let them look well to it, I pray, lest perchance they too audaciously and rashly define the order of the divine actions, which has not been manifestly revealed in the Scriptures. In the [Romanist] schools themselves there has been no small contention on this subject, nor is it yet decided: ‘Whether the infusion of grace,’ says [Thomas] Stapleton (Of Justification, bk. 5, ch. 8, sect. Rursum), ‘precedes the forgiveness of sins in the order of nature, as St. Thomas lays down… or whether the contrary be true, as others most strenuously maintain, is rather a scholastic question than one now-a-days controverted, and is one on which neither formerly nor now has the Church defined anything on either side.’ The moderation of Theodore Beza in this matter, in other respects sufficiently rigid, is much to be approved of. He thus writes (Demonstrations against Flacius Illyricus and his Apology, sect. 22, Rursum quaero, tome 2, p. 218 (or p. 171)): ‘If you take justification in a general sense, as it is sometimes used by the apostle, sanctification will not be an effect, but a part or species of it; but if merely for the gift of imputed justice, or the gratuitous forgiveness of sins, than sanctification will be another gift, which always follows that first gift, since whoever is justified gratis in Christ is also sanctified by His Spirit… Nor need we here contend much which of the two precedes in order, since in one and the same moment Christ… justifies us, and by his Spirit begins to sanctify us.’ and (p. 237, sect. 23, Praeterea quum (or p. 185)): ‘When I had said what is quite true, that, provided it is allowed that we must first of all be made partakers of Christ Himself, that in Him we may be justified and sanctified, we need not labor much to find which of these two precedes in order. lIllyricus brings forward against me Calvin, who says (Antidote to the Council of Trent, sess. 6, sect. Neque tamen interea, tome 8, p. 241) that, ‘as soon as any one is justified, renewal also necessarily follows.’ But Calvin here refuting the decisions of the Council of Trent, by which justification is confounded with the gift of sanctification, is not disputing about the order or series of these two, but of their connection; and therefore says, that ‘if anyone is justified renewal also follows, i.e., that it is necessarily concluded that, if any one be justified, he may also be said to be sanctified. But, I pray you, if I say, ‘If anyone lives, it follows that he is endowed with a soul,’ will it be rightly concluded from thence that I make the being endowed with a soul something posterior to life?’ and (p. 238 (or p. 186) around the end, sect. Ego vero inhabitationem) ‘I say that we are simultaneously justified and renewed in Christ, united and applied to us by faith; and I think that we need not trouble ourselves in anyway to determine whether this one or that precedes in order, since we never receive the one without the other, etc.’ Would that this moderation were religiously followed, not only by the more rigid Protestants, but also by very many other theologians of both parties, who now-a-days excite so many and so great disturbanees in the Church about the mode and order of the divine operations.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/agnostic.html">Agnostic</a></span><span class="wk"><span class="lbl">Work:</span> <cite>On Theodore Beza | William Forbes, Considerationes Modestae et Pacificae Controversiarum de Justificatione... 4th ed. (d. 1634; 1658; Oxford: Parker, 1850), vol. 1, bk. 2, ch. 4</cite>, pp. 171-73</span></figcaption>

<blockquote><p>(2) Works required by the Law are either wrought before faith, without the aid of grace; or after believing, by the help of the Holy Ghost. The former are excluded from our justification, but not the latter. (3) Works of Obedience wrought after grace received, may be considered either as sincere only, or absolutely perfect according to what was originally required in the Covenant of Works. Those of the latter sort are excluded from any place in our justification, but not those of the former. … (5) Justification may be considered either as to its beginning or as unto its continuation, and so it has diverse causes under these diverse respects. (6) Works may be considered either as meritorious ex condigno, so as their merit should arise from their own intrinsic worth, or ex congruo only with respect unto the Covenant and promise of God. Those of the first sort are excluded at least from the first justification; the latter may have place both in the first and second. (7) Moral causes may be of many sorts; preparatory, dispository, meritorious, conditionally efficient, or only sine quibus non [without which nothing]. And we must diligently inquire in what sense, under the notion of what cause or causes, our works are excluded from our justification and under what notions they are necessary thereunto. And there is no one of these distinctions but it needs many more to explain it, which accordingly are made use of by learned men.</p></blockquote>

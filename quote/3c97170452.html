<blockquote><p>That thereby, instead of reformation, they shall have deformation; instead of the power of godliness, they shall have vain janglings; instead of love, bitter heart-burnings and jealousies; instead of union, schism and division; instead of peace, contention and strife; instead of order and government, anarchy and confusion.</p></blockquote>

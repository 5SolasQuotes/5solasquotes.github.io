<main class="wrap"><figure class="quote" id="q-361678f0fc" data-kw="">
<blockquote><p>1. That justifying faith, or that faith whereby we are justified, is our receiving of Christ as our Lord and Saviour, trusting in him and yielding obedience to him. 2. That faith, in justifying, is not to be considered as a hand whereby we lay hold on the righteousness of another, or as an instrument, as though righteousness were provided for us and tendered unto us; which would overthrow all necessity of being righteous in ourselves. 3. Nor yet doth faith, repentance, or obedience, procure our justification, or is the efficient or meritorious cause thereof. 4. But the true use of our faith (and repentance), as to our justification before God, is that they are the “causa sine qua non,” or the condition whereby, according to the appointment of God, we come to be justified; and so is imputed to us. 5. That our justification is our absolution from the guilt of sin, and freedom from obnoxiousness unto punishment for it, and nothing else. Our regeneration is the condition of our absolution, and in them both, in several respects, is our righteousness. 6. That the way whereby we come to obtain this absolution is this: Jesus Christ, the only Son of God, being sent by him to reveal his love and grace to lost, sinful mankind, in that work yielding obedience unto God even unto death, was, for a reward of that obedience, exalted, and had divine authority over them for whom he died committed to him to pardon and save them; which accordingly he doth, upon the performance of the condition of faith and obedience by him prescribed to them, at once effecting a universal conditional application of all actually justifying every individual upon the performance of the condition. 7. That as to good works, and their place in this business, Paul speaks of the perfect works of the law and legal manner of justifying, which leave no place for grace or pardon; James, of gospel works of new obedience, which leave place for both. 8. That the denial of our faith and obedience to be the condition of our justification, or the asserting that we are justified by the obedience of Christ imputed to us, is the ready way to overthrow all obedience, and drive all holiness and righteousness out of the world. 9. That, as the beginning, so the continuance of our justification depends on the condition of our faith, repentance, and obedience, which are not fruits consequent of it, but conditions antecedent to it, Socin. Thes. de Justificat. p. 18; Fragm. de Justificat. p. 113. And therefore, in the first place, we are to be solicitous about what is within us, about our sanctification, before our absolution or justification, Socin. Ep. ad Ch. MN. de Fide et Operibus. 10. As to the death of Christ, our sins were the impulsive cause of it, and it was undergone for the forgiveness of sins, and occasioned by them only, and is in some sense the condition of our forgiveness. 11. That absolution and pardon of sin are by no means the immediate effects of the death of Christ.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/john-owen.html">John Owen</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Works of John Owen</cite>, ed. William H. Goold, vol. 12 (Edinburgh: T&amp;T Clark, n.d.), 597–601.</span></figcaption>

</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-59df0fff9d" data-kw="">
<blockquote><p>Precisely because we are justified in Him – that is, in His justification – our justification is also final and irreversible. Indeed we can be so bold as to say that we are as fully justified before God as our Lord Jesus is. We are as finally justified as our Lord Jesus is. We are as irreversibly justified as our Lord Jesus is. The only justification we have – our only righteousness – is that of the Lord Jesus. We are justified with His justification.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/sinclair-ferguson.html">Sinclair Ferguson</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Assured by God</cite>, p. 91</span></figcaption>

</figure><figure class="quote" id="q-08f2c04b0b" data-kw="">
<blockquote><p>But I fear the sense of this [said by antinomians], that ‘Christ repents for us, and obeys for us, He being the end of the Law to overy one that believes,’ be far otherwise, to wit, that Christ’s obedience of the Law, He being the end of the Law, as also his passive obedience is ours. If this be the intended sense, then: [1.] All our sanctification is nothing but the sanctification and holy active obedience of Christ. I yield this to be a broad, a fair and easy way to heaven. Christ does all for us [according to antinomians:], Christ weeped for my sins, and that is all the repentance required in me, if I believe that Christ was mortified and dead to the world for me, that is my mortification; and if I believe that the change of the whole man was truly in Christ, this is my true holiness: then my walking in holiness cannot be rewarded with life eternal, nor have any influence as a way or means leading to the kingdom. 2. Christ’s active obedience imputed to the sinner can be no evidence of justification, because it is in Christ, not in me; any evidence or mark of justification must be inherent in the believer, not in Christ. 3. And one and the same thing cannot be a mark and a sign of itself. Now the active obedience of Christ imputed to the sinner is holden [by antinomians] to be a part of justification [and therefore it cannot be a sign of justification].</p></blockquote>

nline.com/the-active-obedience-of-christ#:~:text=But%20I%20fear%20the%20sense%20of,cannot%20be%20a%20sign%20of%20justification&amp;text=But%20I%20fear%20the%20sense%20of%20this%20%5Bsaid&amp;text=therefore%20it%20cannot%20be%20a%20sign%20of%20justification" rel="noopener" target="_blank">Read it online · Reformed Books Online</a></div>
</figure><figure class="quote" id="q-b329a10ff6" data-kw="">
<blockquote><p>Justification therefore is properly a free judicial action of God, whereby He iudges the elect in themselves subject to the accusation and malediction of the Law, to be just by faith, through Christ by imputation of his righteousness, unto the praise of the glory of his grace, and their own salvation. That this definition might be rightly understood, it is needful that the causes, which are orderly noted in the same, be two ways considered, according as justification is taken, either actively, in respect of God, who justifies, or passively in respect of man, who is justified.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/lucas-trelcatius.html">Lucas Trelcatius</a></span><span class="wk"><span class="lbl">Work:</span> <cite>A Brief Institution of the Common Places of Sacred Divinity</cite>, ch. 9, ‘Of Man’s Justification before God’ in A Brief Institution of the Common Places of Sacred Divinity… (London: Francis Burton, 1610), pp. 222-76 The causes are succinctly stated on pp. 227-38, and then defended afterwards.</span></figcaption>

</figure><figure class="quote" id="q-51637e0443" data-kw="">
<blockquote><p>We affirm on the other side [from the Papists], that the testimony of the Spirit of God in the Word itself–witnessing it to be of God, by that stamp and impress, or, which comes to the same, by those notes and marks of divinity, which everywhere appear in it–is the immediate and principal, and a sufficient, reason of our believing it to be the Word of God, and the medium [which] the Spirit, working inwardly in our hearts, moves as the efficient of our faith, so the Scripture itself, in its own intrinsical beauty, luster, power and excellency, is that which moves us, in the way of an object or medium, to yield our assent to its being of God. By this the Spirit of God; and, by an internal application of this to our minds, induceth us to assent to its so being…. This they [the Papists] deny; and this we shall first, though more briefly prove…</p></blockquote>

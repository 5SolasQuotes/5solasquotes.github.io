<blockquote><p>4. Some things are not matters of worship at all, but of goods, as the community of goods, love-feasts, matters of civil conversation, these are only in their morality (as touching distribution to the necessities of the saints, and brotherly kindness) unalterable, and no otherwise.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/samuel-rutherford.html">Samuel Rutherford</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Divine Right of Church Government</cite>, … (1646), Intro, section 3, p. 64</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/worship/ceremonies-and-things-indifferent.html">Ceremonies and Things Indifferent</a></span></div>

</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-915e624165" data-kw="">
<blockquote><p>Things inconvenient even in matters of religion may be commanded in some cases (Circumcision was a burden, Acts 15:10, and these burdens called ‘necessary things,’ v. 28, and they were said to do well if they observe them, v. 29.): as when it is to redeem a far worse inconvenience. For of two evils of punishments, the magistrate may take the less, as well as any other private man. And if that subjects, to prevent worse inconveniences, may use inconvenient ceremonies, then may the magistrate, to preuent worse inconveniences, command inconvenient ceremonies. If the apostles may use the inconvenient Jewish ceremonies, then the apostles may enjoin for a time the use of inconvenient ceremonies: as they did make ordinances about things which yet they called burdens, Acts 15.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/nicholas-byfield.html">Nicholas Byfield</a></span><span class="wk"><span class="lbl">Work:</span> <cite>A Commentary: or Sermons upon the Second Chapter of the First Epistle of Saint Peter</cite>, pp. 586-98 on 1 Pet. 2:13 in A Commentary: or Sermons upon the Second Chapter of the First Epistle of Saint Peter... (London, 1623), pp. 590-91</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/worship/ceremonies-and-things-indifferent.html">Ceremonies and Things Indifferent</a></span></div>

</figure><figure class="quote" id="q-035d8f0bf3" data-kw="">
<blockquote><p>Here it may be considered whether every adjunct of worship instituted of God does by that institution become a matter or part of worship, which otherwise it would not be. Some say that in the old Law the least ceremony prescribed of God was a part of worship, which assertion I do not now so far examine as to declare my assent or dissent. But if it were so, I think it was not merely as prescribed of God, but upon some further reason. For I do not see that God cannot prescribe a mere adjunct of worship, but it must thereby lose its formal state, or become formally another thing, viz. a matter of worship, but think it may remain in its own state, a mere adjunct still. Nevertheless, the observation of that divinely prescribed adjunct may be an act of worship so far as every act of obedience to God as such may be so called. But here we speak of worship, not in so large, but in the stricter sense.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/john-corbet.html">John Corbet</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Remains of the Reverend &amp; Learned Mr. John Corbet</cite>, (London, 1684), Of Divine Worship, pt. 1, §16. ‘Of Time &amp; Place considered as Adjuncts, or as Matter of Worship’, pp. 184-85.</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/worship/ceremonies-and-things-indifferent.html">Ceremonies and Things Indifferent</a></span></div>

ad it online · Reformed Books Online</a></div>
</figure><figure class="quote" id="q-cc7ada14c0" data-kw="">
<blockquote><p>And the Houshold of Onesiphorus. …As the apostle before, [2 Tim.] Ch. 1:16, prayed for the house of Onesiphorus, so here [2 Tim. 4:19] he salutes them. By ‘house’ here is meant (by a metonymy of the subject very frequent in Scripture) the people in the house, as wife, children, servants; which may serve as an answer to that cavil of the sottish illiterate Quakers who revile us for calling the place where the Church meets, ‘The Church’; when this metonymy is so frequent in Scripture, ‘The house’ for the people in the house, and ‘the Church’ for the people that meet in the church. The Apostle uses the very word Church in this very sense, 1 Cor. 14:28,35, ‘It is a shame for a woman to speak in the Church.&#x27;</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/thomas-hall.html">Thomas Hall</a></span><span class="wk"><span class="lbl">Work:</span> <cite>A Practical &amp; Polemical Commentary, or, Exposition upon the Third &amp; Fourth Chapters of the Latter Epistle of Saint Paul to Timothy</cite>, Question 55, ‘Whether we may call the Meeting-Place a Church?’ in A Practical &amp; Polemical Commentary, or, Exposition upon the Third &amp; Fourth Chapters of the Latter Epistle of Saint Paul to Timothy… (London, 1658), on 2 Tim. 4:19, p. 460. Hall (1610–1665) was an English, presbyterian puritan who was ejected at the Great Ejection of 1662.</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/worship/ceremonies-and-things-indifferent.html">Ceremonies and Things Indifferent</a></span></div>

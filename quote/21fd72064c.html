<main class="wrap"><figure class="quote" id="q-21fd72064c" data-kw="">
<blockquote><p>Surely such a Testimony or voice in the soul [as claimed by Gillespie’s opponent], as the soul sits down satisfied with before ever any work of sanctification can possibly give any evidence, is not an evidence according to the word, but contrary to the word, and therefore not the revealing evidence of the spirit of God, so that in this I must needs dissent from him, for he casts the soul upon a most dangerous precipice, neither is the danger helped, but rather increased by that posterior evidence, or after comfort of sanctification, which he speaks of, for the soul being before set down satisfied with the Testimony of the spirit of the Lord, and Faith receiving that Testimony (so he supposes) it cannot now examine whether its sanctification be sound or not sound, whether its graces be common or special, seeming or real:…</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/george-gillespie.html">George Gillespie</a></span><span class="wk"><span class="lbl">Work:</span> <cite>A Treatise of Miscellany Questions</cite>, ch. 21</span></figcaption>

</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-bcce423899" data-kw="">
<blockquote><p>As we see from the Westminster Confession and the 1689 Baptist Confession the Puritans believed in the doctrines of grace such as election and particular redemption (Rom 8:28-30). They followed Calvin in resisting false human rationalisations. For instance they resisted the idea that God only loves the elect and hates the non-elect. This error is called hyper-Calvinism. It is a very serious error which is recurring today. The Puritans were experts in their understanding of the concept of common grace although they did not use that term.¹ Their teaching accords fully with the way in which the doctrine of Common Grace is expounded by Prof John Murray (cf Works). They believed that the Holy Spirit is constantly active in restraining evil and promoting good throughout society. The Puritans believed in the universal love of God for all mankind (1 Tim 2:1-6; 2 Peter 3:9). They believed in the universal provision of God for all mankind according to the covenant made with Noah as representative of the whole world (Gen 8:20-22 and Ps 145). ¹ [Webmaster’s note: This particular claim is not true. Following Calvin’s use of the term ‘general grace’, the puritans did use the term ‘common grace’, as is affirmed by Dr. Richard Muller below on p. 130, and as is instanced by James Durham (who has a whole section on ‘common grace’ in his Revelation commentary), Stephen Charnock (below), and John Bunyan (below).]</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/erroll-hulse.html">Erroll Hulse</a></span><span class="wk"><span class="lbl">Work:</span> <cite>“The Example of the English Puritans”</cite>, (Reformation Today 153, Sept/Oct 1996)</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/effectual-calling/common-grace.html">Common Grace</a></span></div>

<blockquote><p>8. The application [of redemption] plainly has the same latitude as redemption itself, i.e., redemption applies to all those and only to those for whom it was obtained by the intention of Christ and the Father. Yet because of them the same temporal benefits of Christ overflow also to others.

9. As for the intention of application, it is rightly said that Christ made satisfaction only for those whom He saved, though in regard to the sufficiency in the mediation of Christ it may also rightly be said that Christ made satisfaction for each and all. Because these counsels of God are hidden to us, it is the part of charity to judge well of every one, although we may not say of all collectively that Christ equally pleads the cause of each before God.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/william-ames.html">William Ames</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Marrow of Theology 3rd</cite>, tr. John D. Eusden (1623; Baker, 1997), bk. 1, ch. 24, ‘The Application of Christ’, p. 150</span></figcaption>

</figure><figure class="quote" id="q-bdf68e8002" data-kw="">
<blockquote><p>Many blessings flow to mankind at large from the death of Christ, collaterally and incidentally, in consequence of the relation in which men, viewed collectively, stand to each other.” [Historical Theology, vol. 2, p. 333] And it is but natural that this should be so. If Christ was to save an elect race, gradually called out of the world of humanity in the course of centuries, it became necessary for God to exercise forbearance, to check the course of evil, to promote the development of the natural powers of man, to keep alive within the hearts of men a desire for civil righteousness, for external morality and good order in society, and to shower untold blessings upon mankind in general. Dr. [Charles] Hodge expresses it thus: ‘It is very plain that any plan designed to secure the salvation of an elect portion of a race propagated by generation and living in association, as is the case with mankind, cannot secure its end without greatly affecting, for better or for worse, the character and destiny of all the rest of the race not elected.’ He quotes Dr. [Robert] Candlish to the effect that ‘the entire history of the human race, from the apostasy to the final judgment, is a dispensation of forbearance in respect to the reprobate, in which many blessings, physical and moral, affecting their characters and destinies forever, accrue even to the heathen, and many more to the educated and refined citizens of Christian communities. These come to them through the mediation of Christ, and coming to them now, must have been designed for them from the beginning.’ [The Atonement, pp. 358 ff.] These general blessings of mankind, indirectly resulting from the atoning work of Christ, were not only foreseen by God, but designed by Him as blessings for all concerned. It is perfectly true, of course, that the design of God in the work of Christ pertained primarily and directly, not to the temporal well-being of men in general, but to the redemption of the elect; but secondarily and indirectly it also included the natural blessings bestowed on mankind indiscriminately. All that the natural man receives other than curse and death is an indirect result of the redemptive work of Christ. [Cf Turretin, Opera, Locus XIV, Q. XIV, par. XI; Witsius, De Verbonden, B. II, Kap. 9, s. 4; Cunningham, Hist. Theol. II, p. 332; Symington, Atonement and Intercession, p. 255; Bavinck, Geref. Dogm. III, p. 535; Vos, Ger. Dogm. III, p. 150.]</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/louis-berkhof.html">Louis Berkhof</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Systematic Theology</cite>, (1950) | “C. COMMON GRACE AND THE ATONING WORK OF CHRIST. | Reformed theologians generally hesitate to say that Christ by His atoning blood merited these blessings for the impenitent and reprobate. At the same time they do believe that important natural benefits accrue to the whole human race from the death of Christ, and that in these benefits the unbelieving, the impenitent, and the reprobate also share. In every covenant transaction recorded in Scripture it appears that the covenant of grace carries with it not only spiritual but also material blessings, and those material blessings are generally of such a kind that they are naturally shared also by unbelievers. Says [William] Cunningham:</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/effectual-calling/common-grace.html">Common Grace</a></span></div>

— Louis Berkhof, Systematic Theology (1950) | “C. COMMON GRACE AND THE ATONING WORK OF CHRIST. | Reformed theologians generally hesitate to say that Christ by His atoning blood merited these blessings for the impenitent and reprobate. At the same time they do believe that important natural benefits accrue to the whole human race from the death of Christ, and that in these benefits the unbelieving, the impenitent, and the reprobate also share. In every covenant transaction recorded in Scripture it appears that the covenant of grace carries with it not only spiritual but also material blessings, and those material blessings are generally of such a kind that they are naturally shared also by unbelievers. Says [William] Cunningham:">Copy</button><a class="share" href="https://x.com/intent/post?text=%E2%80%9CMany+blessings+flow+to+mankind+at+large+from+the+death+of+Christ%2C+collaterally+and+incidentally%2C+in+consequence+of+the+relation+in+which+men%2C+viewed+collectively%2C+stand+to+each+other.%E2%80%9D+%5BHistorical+Theology%2C+vol.+2%2C+p.+333%5D+And+it+is+but+natural+that+this+should+be+so.+If+Christ+was+to+save+an+elect+race%2C+gradually+called+out+of+the+world+of+humanity+in+the+course+of+centuries%2C+it+became+necessary+for+God+to+exercise+forbearance%2C+to+check+the+course+of+evil%2C+to+promote+the+development+of+the+natural+powers+of+man%2C+to+keep+alive+within+the+hearts+of+men+a+desire+for+civil+righteousness%2C+for+external+morality+and+good+order+in+society%2C+and+to+shower+untold+blessings+upon+mankind+in+general.+Dr.+%5BCharles%5D+Hodge+expresses+it+thus%3A+%E2%80%98It+is+very+plain+that+any+plan+designed+to+secure+the+salvation+of+an+elect+portion+of+a+race+propagated+by+generation+and+living+in+association%2C+as+is+the+case+with+mankind%2C+cannot+secure+its+end+without+greatly+affecting%2C+for+better+or+for+worse%2C+the+character+and+destiny+of+all+the+rest+of+the+race+not+elected.%E2%80%99+He+quotes+Dr.+%5BRobert%5D+Candlish+to+the+effect+that+%E2%80%98the+entire+history+of+the+human+race%2C+from+the+apostasy+to+the+final+judgment%2C+is+a+dispensation+of+forbearance+in+respect+to+the+reprobate%2C+in+which+many+blessings%2C+physical+and+moral%2C+affecting+their+characters+and+destinies+forever%2C+accrue+even+to+the+heathen%2C+and+many+more+to+the+educated+and+refined+citizens+of+Christian+communities.+These+come+to+them+through+the+mediation+of+Christ%2C+and+coming+to+them+now%2C+must+have+been+designed+for+them+from+the+beginning.%E2%80%99+%5BThe+Atonement%2C+pp.+358+ff.%5D+These+general+blessings+of+mankind%2C+indirectly+resulting+from+the+atoning+work+of+Christ%2C+were+not+only+foreseen+by+God%2C+but+designed+by+Him+as+blessings+for+all+concerned.+It+is+perfectly+true%2C+of+course%2C+that+the+design+of+God+in+the+work+of+Christ+pertained+primarily+and+directly%2C+not+to+the+temporal+well-being+of+men+in+general%2C+but+to+the+redemption+of+the+elect%3B+but+secondarily+and+indirectly+it+also+included+the+natural+blessings+bestowed+on+mankind+indiscriminately.+All+that+the+natural+man+receives+other+than+curse+and+death+is+an+indirect+result+of+the+redemptive+work+of+Christ.+%5BCf+Turretin%2C+Opera%2C+Locus+XIV%2C+Q.+XIV%2C+par.+XI%3B+Witsius%2C+De+Verbonden%2C+B.+II%2C+Kap.+9%2C+s.+4%3B+Cunningham%2C+Hist.+Theol.+II%2C+p.+332%3B+Symington%2C+Atonement+and+Intercession%2C+p.+255%3B+Bavinck%2C+Geref.+Dogm.+III%2C+p.+535%3B+Vos%2C+Ger.+Dogm.+III%2C+p.+150.%5D%E2%80%9D%0A%0A%E2%80%94+Louis+Berkhof%2C+Systematic+Theology+%281950%29+%7C+%E2%80%9CC.+COMMON+GRACE+AND+THE+ATONING+WORK+OF+CHRIST.+%7C+Reformed+theologians+generally+hesitate+to+say+that+Christ+by+His+atoning+blood+merited+these+blessings+for+the+impenitent+and+reprobate.+At+the+same+time+they+do+believe+that+important+natural+benefits+accrue+to+the+whole+human+race+from+the+death+of+Christ%2C+and+that+in+these+benefits+the+unbelieving%2C+the+impenitent%2C+and+the+reprobate+also+share.+In+every+covenant+transaction+recorded+in+Scripture+it+appears+that+the+covenant+of+grace+carries+with+it+not+only+spiritual+but+also+material+blessings%2C+and+those+material+blessings+are+generally+of+such+a+kind+that+they+are+naturally+shared+also+by+unbelievers.+Says+%5BWilliam%5D+Cunningham%3A&amp;url=https%3A%2F%2F5solasquotes.github.io%2Fquote%2Fbdf68e8002.html&amp;via=5Solas" target="_blank" rel="noopener">Share on X</a><a class="perma" href="../quote/bdf68e8002.html">Permalink</a><a class="src" href="https://reformedbooksonline.com/topics/topics-by-subject/atonement/redemptive-benefits-for-the-reprobate/#:~:text=Many%20blessings%20flow%20to%20mankind%20at,Vos%2C%20Ger.%20Dogm.%20III%2C%20p.%20150&amp;text=Many%20blessings%20flow%20to%20mankind%20at%20large%20from&amp;text=p.%20535%3B%20Vos%2C%20Ger.%20Dogm.%20III%2C%20p.%20150" rel="noopener" target="_blank">Read it online · Reformed Books Online</a></div>

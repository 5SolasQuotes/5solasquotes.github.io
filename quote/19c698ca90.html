<blockquote><p>3. The revelation alone exhibited in the sphere of nature cannot be salutary, nor has any mortal through it alone either been led to salvation or been able to be led.

4. To those therefore to whom the grace of superior revelation in the sphere of grace after sin introduced into the world has not been made, salvation was never destined by God: for the wise one does not will the end for him to whom he by no means grants the necessary means, without which it cannot come to pass that he should attain the end, when those can be had only by his giving.

5. And since the sphere of nature exhibits only τὸ γνωστὸν τοῦ θεοῦ [the knowledge of God], by no means indeed σοφίαν τοῦ θεοῦ ἐν μυστηρίῳ [the wisdom of God in mystery], that is, the Gospel, and doctrine concerning Christ the Savior and faith in him, who, without knowledge of Him who alone is the way, can come to life?

6. Therefore the revelation alone exhibited to sinners in the sphere of grace through God’s word can be salutary, which reveals both the actual expiation of sin, and the mode of it, and Him through whom it is expiated, and the means of applying that expiation to us.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/sr-friedrich-spanheim.html">Friedrich Spanheim the Elder</a></span><span class="wk"><span class="lbl">Work:</span> <cite>‘Miscellaneous Theological Disputation exhibiting a Theological Compendium’ in Disputationum Theologicarum Miscellaneorum Pars Prima</cite>, (d. 1649; Geneva: Chouët, 1652), trans. AI by Roman Prestarri at Confessionally Reformed Theology Latin</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/church-government-and-the-ministry/the-call-to-ministry.html">The Call to Ministry</a></span></div>

<blockquote><p>4. In this expression of ‘the Covenant,’ the spiritual good things promised therein are limited to Abraham and to his seed. But all infants whatsoever are not comprehended under the seed of Abraham. To say many thousands are excluded from the seals and outward administration of the Covenant, when yet everyone is partaker of the good promised in the Covenant, is to speak of ourselves, and not according to the Word of God. We will not tie the grace of God to outward means: but ordinarily we cannot affirm they pertain to the Covenant of Grace, and obtain the highest blessings promised therein, whom God does not vouchsafe so much as outwardly to receive into Covenant.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/john-ball.html">John Ball</a></span><span class="wk"><span class="lbl">Work:</span> <cite>A Treatise of the Covenant of Grace</cite>, … (London: 1645), ch. 6, ‘Of the Covenant of Grace as it was made and manifested to Abraham’, p. 92</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/church-government-and-the-ministry/the-call-to-ministry.html">The Call to Ministry</a></span></div>

<blockquote><p>…the sign of imposition of hands helps not the cause of our Opposites, because it’s the example of Christ and the apostles, and their disciples, which our [imposed] ceremonies have not: yet we think not imposition of hands to be any sacred or mystical sign, but only a moral [sign], for designation of a person: let them who think more highly or honorably of it, look to their warrants.</p></blockquote>

<blockquote><p>4th Distinction. A calling may be expressly and formally corrupt in respect of the particular intention of the ordainers and of the particular Church, ex intentione ordinanris &amp; operantis [out of the intention of the ordainers and of the one working]. Thus Luther’s calling to be a monk was a corrupt calling, and eatenus, and ‘in that respect’ he could not give a calling to others. But that some calling may be implicitly and virtually good and lawful in respect of the intention of the Catholic Church and ex intentione operis &amp; ipsius ordinationis [out of the intention of the work and the ordination itself], he was called to preach the Word of God. …

7. A calling to the ministry is either such [1.] as wants the essentials, as gifts in any messenger and the Church’s consent, or these who occupy the room of the Church, the Church consenting: such a minister is to be reputed for no minister; or 2. an entry to a calling, or a calling where diverse of the apostles’ requisites are wanting, may be a valid calling, as if one enter as Caiphas, who entered by favor and money and contrary to the Law, was High-Priest but for a year: yet was a true High-Priest and prophesied as the High-priest [Jn. 11:49-51].

8. If the Church approve by silence, or countenance the ministry of a man who opened the Church door to himself, by a silver key, having given the prelate a bud. The ordinance of God is conferred upon him, and his calling ceases not to be God’s calling because of the sins of the instruments both taking and giving.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/samuel-rutherford.html">Samuel Rutherford</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Due Right of Presbyteries, ‘Acts 15, A Pattern of a Juridicial Synod’</cite>, 1st Part, pp. 203-8</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/church-government-and-the-ministry/the-call-to-ministry.html">The Call to Ministry</a></span></div>

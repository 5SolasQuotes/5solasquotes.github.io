<main class="wrap"><figure class="quote" id="q-bde91c87e8" data-kw="">
<blockquote><p>The wicked shall be raised by the power of Christ as a just Judge. The divine power that shut them up in the grave as in a prison, will bring them out, in order to their receiving the last sentence, to enter into the prison of hell. But the godly shall be raised by virtue of the Spirit of Christ, that bond of union betwixt Christ and those blessed bodies; so that it shall be to them as a pleasant awakening out of sleep.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/thomas-boston.html">Thomas Boston</a></span><span class="wk"><span class="lbl">Work:</span> <cite>An Illustration of the Doctrines of the Christian Religion</cite>, Of Benefits at the Resurrection (Heb. 11:35)</span></figcaption>

</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-bf5c30a0dc" data-kw="same body identity">
<blockquote><p>Are the same bodies numerically which have died to be raised again? We affirm against the Socinians. It is not inquired whether they will be the same bodies as to qualities and conditions. For we confess that they will undergo a great change so as to be no longer animal, corruptible, weak, miserable and mortal, but spiritual, incorruptible, strong, glorious and immortal. But concerning numerical identity of substance—whether the same flesh which was dissolved by death will rise again—this we affirm.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/francis-turretin.html">Francis Turretin</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Institutes of Elenctic Theology</cite>, 20.2.1–2</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/resurrection/resurrection-of-the-body.html">Resurrection of the Body</a> › <a href="../topics/resurrection/resurrection-of-the-body/identity-of-the-body.html">Identity of the body</a></span><span class="t"><a href="../topics/resurrection/the-resurrection-body.html">The Resurrection Body</a> › <a href="../topics/resurrection/the-resurrection-body/spiritual-body.html">Spiritual body</a></span><span class="t"><a href="../topics/resurrection/the-resurrection-body.html">The Resurrection Body</a> › <a href="../topics/resurrection/the-resurrection-body/glorified-body.html">Glorified body</a></span></div>

— Francis Turretin, Institutes of Elenctic Theology, 20.2.1–2">Copy</button><a class="share" href="https://x.com/intent/post?text=%E2%80%9CAre%20the%20same%20bodies%20numerically%20which%20have%20died%20to%20be%20raised%20again%3F%20We%20affirm%20against%20the%20Socinians.%20It%20is%20not%20inquired%20whether%20they%20will%20be%20the%20same%20bodies%20as%20to%20qualities%20and%20conditions.%20For%20we%20confess%20that%20they%20will%20undergo%20a%20great%20change%20so%20as%20to%20be%20no%20longer%20animal%2C%20corruptible%2C%20weak%2C%20miserable%20and%20mortal%2C%20but%20spiritual%2C%20incorruptible%2C%20strong%2C%20glorious%20and%20immortal.%20But%20concerning%20numerical%20identity%20of%20substance%E2%80%94whether%20the%20same%20flesh%20which%20was%20dissolved%20by%20death%20will%20rise%20again%E2%80%94this%20we%20affirm.%E2%80%9D%0A%0A%E2%80%94%20Francis%20Turretin%2C%20Institutes%20of%20Elenctic%20Theology%2C%2020.2.1%E2%80%932&amp;url=https%3A%2F%2F5solasquotes.github.io%2Fquote%2Fbf5c30a0dc.html&amp;via=5Solas" target="_blank" rel="noopener">Share on X</a><a class="perma" href="../quote/bf5c30a0dc.html">Permalink</a><span class="src none">No free online copy linked</span></div>
</figure><figure class="quote" id="q-68ca6aa5c2" data-kw="">
<blockquote><p>XXVI. Although the wicked as well as the pious will rise again, still the resurrection of each will be diverse as to cause as well as with regard to manner. The latter, indeed, will be made by Christ the Mediator, as head, by the efficacy of his quickening Spirit (Rom. 8:11), to an immortality of glory. But the former by Christ as the Son of God, the Lord and Judge, by virtue of his omnipotence and justice, to eternal punishment, in which the wicked will acquire a physical immortality and incorruptibility, but in order to greater punishment—that they may suffer for ever and thus feel that they die, so as never to die; not only by a punishment of loss, but also by the severest punishment of sense, of which there will be no end.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/francis-turretin.html">Francis Turretin</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Institutes of Elenctic Theology</cite>, 20.1.26</span></figcaption>

</figure><figure class="quote" id="q-b739b4f72c" data-kw="">
<blockquote><p>They further argue, that Christ is the meritorious cause of the resurrection; and since he has merited nothing for the wicked or reprobate they shall not be raised. The answer to which is, that Christ is the meritorious cause of the resurrection of life, but not of the resurrection of damnation; the saints will rise to life by virtue of union to Christ, through his merit, and the power of his resurrection: not so the wicked; they will rise, not through his merit, and by virtue of union to him, but by his almighty power.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/john-gill.html">John Gill</a></span><span class="wk"><span class="lbl">Work:</span> <cite>A Body of Doctrinal Divinity</cite>, bk. 7, ch. 4 (Of the Resurrection of the Body)</span></figcaption>

</figure><figure class="quote" id="q-a974238fb8" data-kw="">
<blockquote><p>Besides, he is just as well as merciful; and it is necessary from the justice of God, as will be observed hereafter, that the bodies of the wicked be raised, not merely to be tormented, but that his justice might be glorified in the righteous punishment of them.</p></blockquote>

<blockquote><p>What are the fruits of this free grace of God with respect to the gift of Christ for us and to us, as related in this scripture-testimony… [3.] That God had made Him a little lower than the angels, in his being made man, that He might suffer and humble Himself to death. [4.] That God crowned the human nature of Christ with glory and honour… that by his sufferings He might make satisfaction, tasting death for every man, sensibly feeling and undergoing the bitter agonies of that shameful, painful, and cursed death of the cross, hereby putting all mankind into a new state of trial.</p></blockquote>

</figure><figure class="quote" id="q-c95490c981" data-kw="">
<blockquote><p>Unto whom is the death and passion of Christ profitable? Although He might have been a sufficient price for the sins for all men, yet actually and effectually he died for his elect only, who receive Him and believe Him, Matt 1:21. “He will deliver his people from their sins.” John 10:15. “I lay down my life for my sheep.” and Chap. 17:19 “I sanctify myself,” for otherwise it would follow that Christ died [without] profit, and to no purpose in regard of many, and that the efficacy of Christ’s death could be made void by men.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/william-bucanus.html">William Bucanus</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Institutions of Christian Religion Framed out of God’s Word, &amp; the Writings of the Best Divines</cite>, (London, 1606), p. 235</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/priestly-office-satisfaction-and-atonement/extent-of-the-atonement.html">Extent of the Atonement</a></span></div>

</figure><figure class="quote" id="q-bb7c5b46b9" data-kw="">
<blockquote><p>Is not Christ the Redeemer of all men? No: for He is a Redeemer neither to Pharaoh, nor Judas, neither unto Ciaphas, nor Herod, neither unto Julian, not in brief to all those that are damned or without hope, for whom they neither He died. Did Christ die for all men? His death was sufficient for all, say the Schoolmen, but effectual only for the Elect and them that are faithful. If we respect the virtue and force of Christ’s blood, it is sufficient for the redemption of all: but if we look upon the purpose and eternal counsel of God, and the goodwill of the Mediator, he died for the elect only. John 10:15, I lay down my life for my sheep, says Christ, and 17:9, I pray not for the world, but I pray for them whom thou have given me. Therefore He neither offered sacrifice for it, neither did He redeem it. And verse 19, For their sakes who believe, and whom the Father has given Me, I sanctify Myself. And Matt 26:28, My blood which is shed for many for the remission of sins.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/william-bucanus.html">William Bucanus</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Institutions of Christian Religion Framed out of God’s Word, &amp; the Writings of the Best Divines</cite>, (London, 1606), pp. 433-34</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/priestly-office-satisfaction-and-atonement/extent-of-the-atonement.html">Extent of the Atonement</a></span></div>

— William Bucanus, Institutions of Christian Religion (London, 1606), pp. 433-34">Copy</button><a class="share" href="https://x.com/intent/post?text=%E2%80%9CIs+not+Christ+the+Redeemer+of+all+men%3F+No%3A+for+He+is+a+Redeemer+neither+to+Pharaoh%2C+nor+Judas%2C+neither+unto+Ciaphas%2C+nor+Herod%2C+neither+unto+Julian%2C+not+in+brief+to+all+those+that+are+damned+or+without+hope%2C+for+whom+they+neither+He+died.+Did+Christ+die+for+all+men%3F+His+death+was+sufficient+for+all%2C+say+the+Schoolmen%2C+but+effectual+only+for+the+Elect+and+them+that+are+faithful.+If+we+respect+the+virtue+and+force+of+Christ%E2%80%99s+blood%2C+it+is+sufficient+for+the+redemption+of+all%3A+but+if+we+look+upon+the+purpose+and+eternal+counsel+of+God%2C+and+the+goodwill+of+the+Mediator%2C+he+died+for+the+elect+only.+John+10%3A15%2C+I+lay+down+my+life+for+my+sheep%2C+says+Christ%2C+and+17%3A9%2C+I+pray+not+for+the+world%2C+but+I+pray+for+them+whom+thou+have+given+me.+Therefore+He+neither+offered+sacrifice+for+it%2C+neither+did+He+redeem+it.+And+verse+19%2C+For+their+sakes+who+believe%2C+and+whom+the+Father+has+given+Me%2C+I+sanctify+Myself.+And+Matt+26%3A28%2C+My+blood+which+is+shed+for+many+for+the+remission+of+sins.%E2%80%9D%0A%0A%E2%80%94+William+Bucanus%2C+Institutions+of+Christian+Religion+%28London%2C+1606%29%2C+pp.+433-34&amp;url=https%3A%2F%2F5solasquotes.github.io%2Fquote%2Fbb7c5b46b9.html&amp;via=5Solas" target="_blank" rel="noopener">Share on X</a><a class="perma" href="../quote/bb7c5b46b9.html">Permalink</a><a class="src" href="https://reformedbooksonline.com/on-the-sufficiency-of-the-atonement/#:~:text=Is%20not%20Christ%20the%20Redeemer%20of,many%20for%20the%20remission%20of%20sins&amp;text=Is%20not%20Christ%20the%20Redeemer%20of%20all%20men&amp;text=shed%20for%20many%20for%20the%20remission%20of%20sins" rel="noopener" target="_blank">Read it online · Reformed Books Online</a></div>
</figure><figure class="quote" id="q-3060066d73" data-kw="">
<blockquote><p>VIII. …We acknowledge that Christ died for all; but we deny that by his death salvation and forgiveness of sin is obtained for all men: or that reconciliation is made for Cain, Pharaoh, Saul, Judas, etc. Neither do we think that remission of sins is obtained for anyone whose sins are not remitted; or that salvation was purchased for him, whom God from eternity hath decreed to condemn: for this were a vain purchase… IX. And when we say that Christ died for all, we take it thus, to wit, that the death of Christ is sufficient to save whosoever do believe, yea, and that it is sufficient to save all men, if all men in the whole world did believe in Him: and that the cause why all men are not saved, is not in the insufficiency of the death of Christ, but in the wickedness and incredulity of man. Finally, Christ may be said to reconcile all men to God by his death, after the same manner, that we say that the sun doth enlighten the eyes of all men, although many are blind, many sleep, and many are hid in darkness: Because if all and several men had their eyes, and were awake, and were in the midst of the light, the light of the sun were sufficient to enlighten them. Neither is it any doubt but that it may be said, not only that Christ died for all men, but also that all men are saved by Christ, because among men, there is none saved but by Christ: after the same manner that the apostle saith, 1 Cor. 15:20, that ‘all men are made alive by Christ’, because no man is made alive but by Him.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/pierre-du-moulin.html">Pierre Du Moulin</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Anatomy of Arminianism</cite>, ch. 27, ‘How Far, &amp; in What Sense Christ Died for All? The Opinions of the Parties’ in The Anatomy of Arminianism… (1619; London, 1635), p. 196 ff. | Moulin first surveys the opinions and statements of the Arminians and then concludes the chapter with a positive statement of his (and others’) position:, pp. 198-199</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/priestly-office-satisfaction-and-atonement/extent-of-the-atonement.html">Extent of the Atonement</a></span></div>

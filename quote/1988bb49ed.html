<main class="wrap"><figure class="quote" id="q-1988bb49ed" data-kw="">
<blockquote><p>The laws of God are usually regarded as of two kinds—moral and positive. By a moral law, we are to understand a law which enjoins something in itself necessarily and eternally right, and which would be binding on God’s rational creatures, even though it had not been enjoined by an express commandment. Of this kind is the law which requires us to worship the true God only, to obey our parents, to abstain from murder, and many others which will readily occur to everyone.

A positive law, on the other hand, is a law enjoining something which is not necessarily binding on men, and which becomes binding only in consequence of being commanded—such as the ceremonial observances which were imposed on the people of Israel, but which are no longer binding on the Church.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/robert-gordon.html">Robert Gordon</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Sanctification of the Sabbath: A Discourse in Christian Miscellany</cite></span></figcaption>
<div class="meta"><span class="t"><a href="../topics/civil-government-and-society/natural-law-and-civil-law.html">Natural Law and Civil Law</a></span></div>

</figure><figure class="quote" id="q-7ac5fe6039" data-kw="">
<blockquote><p>It has sometimes been assumed that the Westminster divines formulated the Lex Triplex, or, the threefold division of the law into the moral, judicial, and ceremonial categories. This is not the case, as Henry Bullinger affirmed such a division long before the Westminster Assembly met (I have heard it said that the idea actually comes from the medieval theologian, Thomas Aquinas):

This law is divided into the moral, ceremonial, and judicial laws: all which parts, and every point whereof, Moses hath very exquisitely written, and diligently expounded. The moral law is that which teacheth men manners, and layeth down before us the shape of virtue; declaring therewithal how great righteousness, godliness, obedience, and perfectness God looketh for at the hands of us mortal men. The ceremonial laws are they which are given concerning the order of holy and ecclesiastical rites and ceremonies, and also touching the ministers and things assigned to the ministry and other holy uses. Last of all, the judicial laws give rules concerning matters to be judged between man and man, for the preservation of public peace, equity, and civil honesty.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/heinrich-bullinger.html">Heinrich Bullinger</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Fifty godly and learned sermons divided into the five decades containing the chief and principal points of Christian religion</cite>, ed. Thomas Harding (1849-52 Parker edn; 4 vols, Grand Rapids, 2004), i, 210.</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/civil-government-and-society/natural-law-and-civil-law.html">Natural Law and Civil Law</a></span></div>

</figure><figure class="quote" id="q-bc18f87869" data-kw="">
<blockquote><p>The traditional Covenanter view of the Old Testament’s penal sanctions is that the majority of them remain binding today, as they have not been abrogated in the New Testament. Samuel B. Wylie, an American Reformed Presbyterian, explains this position below:

It may perhaps be inquired, what are those things which he [the civil magistrate] may lawfully command? To this I answer, he may lawfully command whatever is contained in the constitution prescribed by him whom he represents. Deut. 17:18, we are told what this is, namely, the Divine Law. Whatever penalties are specified in that law, and nowhere either repealed or mitigated, should be duly inflicted, in case of disobedience. Where the law is silent or indefinite, with respect to particular crimes, against any precept of the Decalogue, and the punishment due thereto, great prudence and discretion will be necessary to ascertain whether said crimes are punishable by civil pains, as there are many violations of the moral law to which no particular civil penalty can attach.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/s-b-wylie.html">S. B. Wylie</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The two sons of oil; or, the faithful witness for magistracy and ministry upon a scriptural basis</cite>, (1803; York PA, 2002), p. 22.</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/civil-government-and-society/natural-law-and-civil-law.html">Natural Law and Civil Law</a></span></div>

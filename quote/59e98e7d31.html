<blockquote><p>The 37. Art. of the Church of England’s Confession, is so far from erecting an absolute power in the King, that they expressly bring down the Royal Prerogative from the high seat and transcendent superlative power above the Law; and expone the Prerogative to be nothing but mere Law-power. We only (say they) ascribe that Prerogative to the King, which the Scripture doth ascribe to all Godly Princes, that is, that they cause all committed to their trust, whether Ecclesiastical or Civil persons, do their duty; and punish with the Civil sword, all disobedient offenders.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/samuel-rutherford.html">Samuel Rutherford</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Lex, Rex: The Law and the Prince</cite>, (London: John Field, 1644), Q. XLIII, p. 444.</span></figcaption>

</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-2e35992882" data-kw="">
<blockquote><p>Fifth, the various absurdities by which the opposite opinion is pressed [the opinion that there is no such thing as natural law]. For if nothing is just by nature, but that only which can be made to minister to human advantage, it follows that men are born for themselves and not for the glory of God or for the good of society (of which there is by nature in them an earnest desire), which the wiser heathen themselves acknowledge could not be said.

(2) All things would be equally lawful: to hate God as well as to love him; to kill parents as well as to honour them; and each one’s own will would be to him for a reason and a law, so that he might do whatever he pleased (whether this does not pave the way to atheism, anyone can readily understand).

(3) This moral right and government of God being taken away, all the foundations of right will be removed; all the laws of men which could have flowed from no other source, and thus all government, honesty and order in human society will perish and the world be turned into mere confusion and villainy.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/francis-turretin.html">Francis Turretin</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Institutes of Elenctic Theology</cite>, trans. George M. Giger, ed. James T. Dennison (1679; 3 vols, Phillipsburg NJ: Presbyterian &amp; Reformed, 1992), 11.1.16.</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/civil-government-and-society/natural-law-and-civil-law.html">Natural Law and Civil Law</a></span></div>

<blockquote><p>But let them arm themselves with the divine law which says: “What God has joined together, let no man put asunder” [Matt. 19:6]. For the joining together of a man and a woman is of divine law and is binding, however much it may conflict with the laws of men; the laws of men must give way before it without any hesitation. For if a man leaves father and mother and cleaves to his wife [Matt. 19:5], how much more will he tread underfoot the silly and wicked laws of men, in order to cleave to his wife! And if pope, bishop, or official should annul any marriage because it was contracted contrary to the laws of men, he is Antichrist, he does violence to nature, and is guilty of treason against the Divine Majesty, because this word stands: “What God has joined together, let no man put asunder” [Matt. 19:6].

Besides this, no man had the right to frame such laws, and Christ has granted to Christians a liberty which is above all the laws of men, especially where a law of God conflicts with them. … Moreover, such laws were condemned beforehand by Paul when he foretold that there would be men forbidding to marry [I Tim. 4:3]. Here, therefore, those inflexible impediments derived from affinity, by spiritual or legal relationship, and from blood relationship must give way, so far as the Scriptures permit, in which the second degree of consanguinity alone is prohibited.

Thus it is written in Lev. 18[:6-18], where there stepmother, full sister, half-sister by either parent, granddaughter, father’s or mother’s sister, half-sister by either parent, granddaughter, father’s or mother’s sister, daughter-in-law, brother’s wife, wife’s sister, stepdaughter, and his uncle’s wife. Here only the first degree of affinity and the second degree of consanguinity are forbidden; yet not without exception, as will appear on closer examination, for the brother’s or sister’s daughter – the niece – is not included in the prohibition, although she is in the second degree. Therefore, if a marriage has been contracted outside of these degrees, which are the only ones which have been prohibited by God’s appointment, it should by no means be annulled on account of the laws of men. For marriage itself, being a divine institution, is incomparably superior to any laws, so that marriage should not be annulled for the sake of the law, rather the laws should be broken for the sake of marriage.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/martin-luther.html">Martin Luther</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Babylonian Captivity of the Church</cite>, (1520) in Luther’s Works, trans. A. T. Steinhauser, ed. A. R. Wentz (55 vols, Philadelphia PA: Fortress Press, 1959), 36: 98-99.</span></figcaption>

<blockquote><p>In this extract from The two sons of oil, Samuel B. Wylie explains how the civil government is to extend care and protection to the church. His application of Matthew 25:42, 45 to the state is a significant blow against Libertarian Theology, and suggests that the concept of the state not intervening in relief for the afflicted is an ungodly idea (but this is an aside):

The civil magistrate ought to defend and protect the Church of Christ. Isa. 49:23: “Kings shall be thy nursing fathers, and their queens thy nursing mothers,” &amp;c. Does not this imply protection? The metaphors selected by the Spirit of God, involve the highest possible care and tenderness. I know it has been objected by some, that the tender care and concern here intended is not official, but merely personal, as an individual member of the church. The reason assigned is, that the epithet involving concern is not confined to kings, but is common to all their queens: and this must be acknowledged to be unofficial. Sure none are exempted from being concerned about the interests of religion. The irrelevancy of the objection will appear, by attending to an observation formerly made, viz. that the commands of God are obligatory upon every one, in his respective station and department of life. Queens are bound to exercise all the influence, which in the providence of God is conferred upon them, in promoting the religion of Jesus. Kings, or civil magistrates, in like manner, are indispensably bound to exercise all the power which they possess in their stations, to promote the same desirable end. Whatever quantity of this power is kept back, is so much unliquidated debt due to the Messiah, by the express command of that God whom magistrates represent. Ps. 2:12: “Kiss ye the Son lest he be angry.” When Christ’s mystical body needs this power, and the magistrate withholds the benefit of it, does he not run the risk of being charged by Jesus at the last day, as we read, Matt. 25:42, 45 “I was an hungered, and ye gave me no meat; I was thirsty, and ye gave me no drink, &amp;c. Inasmuch as ye did it not unto one of the least of these my brethren, ye did it not to me.”

This same idea of protection, tenderness, and care, as a blessing to be expected in New Testament times, is held out, Isa. 60:10,16: “Kings shall minister unto thee,” and “thou shalt suck the breasts of kings.” All these passages evidently intimate, that the civil power shall be exercised in administering officially to the church, every comfort which may be expected to result from the union of magistratical authority and paternal care; such as defending her from her enemies, and securing to her all her privileges.

Moreover, when in 1 Tim. 2:2, we are commanded to pray for magistrates, the end proposed is, that the church and people of God, under the wing of their protection, “may lead quiet and peaceable lives in all godliness and honesty.” Either indifference, therefore, on the part of the state, toward the church, or an equal protection to her enemies, is notoriously incompatible with the ideas obviously contained in these sacred passages.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/s-b-wylie.html">S. B. Wylie</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The two sons of oil; or, the faithful witness for magistracy and ministry upon a scriptural basis</cite>, (1803; York PA, 2002), pp 19-20.</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/civil-government-and-society/church-and-state.html">Civil Government and Society: Church and State</a></span></div>

— S. B. Wylie, The two sons of oil; or, the faithful witness for magistracy and ministry upon a scriptural basis, (1803; York PA, 2002), pp 19-20.">Copy</button><a class="share" href="https://x.com/intent/post?text=%E2%80%9CIn+this+extract+from+The+two+sons+of+oil%2C+Samuel+B.+Wylie+explains+how+the+civil+government+is+to+extend+care+and+protection+to+the+church.+His+application+of+Matthew+25%3A42%2C+45+to+the+state+is+a+significant+blow+against+Libertarian+Theology%2C+and+suggests+that+the+concept+of+the+state+not+intervening+in+relief+for+the+afflicted+is+an+ungodly+idea+%28but+this+is+an+aside%29%3A%0A%0AThe+civil+magistrate+ought+to+defend+and+protect+the+Church+of+Christ.+Isa.+49%3A23%3A+%E2%80%9CKings+shall+be+thy+nursing+fathers%2C+and+their+queens+thy+nursing+mothers%2C%E2%80%9D+%26c.+Does+not+this+imply+protection%3F+The+metaphors+selected+by+the+Spirit+of+God%2C+involve+the+highest+possible+care+and+tenderness.+I+know+it+has+been+objected+by+some%2C+that+the+tender+care+and+concern+here+intended+is+not+official%2C+but+merely+personal%2C+as+an+individual+member+of+the+church.+The+reason+assigned+is%2C+that+the+epithet+involving+concern+is+not+confined+to+kings%2C+but+is+common+to+all+their+queens%3A+and+this+must+be+acknowledged+to+be+unofficial.+Sure+none+are+exempted+from+being+concerned+about+the+interests+of+religion.+The+irrelevancy+of+the+objection+will+appear%2C+by+attending+to+an+observation+formerly+made%2C+viz.+that+the+commands+of+God+are+obligatory+upon+every+one%2C+in+his+respective+station+and+department+of+life.+Queens+are+bound+to+exercise+all+the+influence%2C+which+in+the+providence+of+God+is+conferred+upon+them%2C+in+promoting+the+religion+of+Jesus.+Kings%2C+or+civil+magistrates%2C+in+like+manner%2C+are+indispensably+bound+to+exercise+all+the+power+which+they+possess+in+their+stations%2C+to+promote+the+same+desirable+end.+Whatever+quantity+of+this+power+is+kept+back%2C+is+so+much+unliquidated+debt+due+to+the+Messiah%2C+by+the+express+command+of+that+God+whom+magistrates+represent.+Ps.+2%3A12%3A+%E2%80%9CKiss+ye+the+Son+lest+he+be+angry.%E2%80%9D+When+Christ%E2%80%99s+mystical+body+needs+this+power%2C+and+the+magistrate+withholds+the+benefit+of+it%2C+does+he+not+run+the+risk+of+being+charged+by+Jesus+at+the+last+day%2C+as+we+read%2C+Matt.+25%3A42%2C+45+%E2%80%9CI+was+an+hungered%2C+and+ye+gave+me+no+meat%3B+I+was+thirsty%2C+and+ye+gave+me+no+drink%2C+%26c.+Inasmuch+as+ye+did+it+not+unto+one+of+the+least+of+these+my+brethren%2C+ye+did+it+not+to+me.%E2%80%9D%0A%0AThis+same+idea+of+protection%2C+tenderness%2C+and+care%2C+as+a+blessing+to+be+expected+in+New+Testament+times%2C+is+held+out%2C+Isa.+60%3A10%2C16%3A+%E2%80%9CKings+shall+minister+unto+thee%2C%E2%80%9D+and+%E2%80%9Cthou+shalt+suck+the+breasts+of+kings.%E2%80%9D+All+these+passages+evidently+intimate%2C+that+the+civil+power+shall+be+exercised+in+administering+officially+to+the+church%2C+every+comfort+which+may+be+expected+to+result+from+the+union+of+magistratical+authority+and+paternal+care%3B+such+as+defending+her+from+her+enemies%2C+and+securing+to+her+all+her+privileges.%0A%0AMoreover%2C+when+in+1+Tim.+2%3A2%2C+we+are+commanded+to+pray+for+magistrates%2C+the+end+proposed+is%2C+that+the+church+and+people+of+God%2C+under+the+wing+of+their+protection%2C+%E2%80%9Cmay+lead+quiet+and+peaceable+lives+in+all+godliness+and+honesty.%E2%80%9D+Either+indifference%2C+therefore%2C+on+the+part+of+the+state%2C+toward+the+church%2C+or+an+equal+protection+to+her+enemies%2C+is+notoriously+incompatible+with+the+ideas+obviously+contained+in+these+sacred+passages.%E2%80%9D%0A%0A%E2%80%94+S.+B.+Wylie%2C+The+two+sons+of+oil%3B+or%2C+the+faithful+witness+for+magistracy+and+ministry+upon+a+scriptural+basis%2C+%281803%3B+York+PA%2C+2002%29%2C+pp+19-20.&amp;url=https%3A%2F%2F5solasquotes.github.io%2Fquote%2F3641a8235e.html&amp;via=5Solas" target="_blank" rel="noopener">Share on X</a><a class="perma" href="../quote/3641a8235e.html">Permalink</a><a class="src" href="https:/ <blockquote><p>Our fathers were exposed to great peril, when they entered into covenant with God, 1643, London, in that immortal bond, known as the Solemn League and Covenant. The Pope, Urban VIII, had engaged all the Roman Catholic powers of Continental Europe in an impious confederacy against the Protestant church, and the cause of liberty in Britain. God blessed the Solemn League and Covenant to defeat their plans.

Our own times are fraught with danger to the church. The complexion, animating spirit, and administration of every civil government in the world is adverse to the government of Messiah, the Prince of the kings of the earth. “The Devil has come down, having great wrath, for he knoweth he hath but a short time.” All the organized systems of worship, as systems which are confederated with these bad thrones, give their power to the beast, in the war which the dragon wages with’ the Lamb. Messiah calls on all his followers to unite in solemn covenanting for the city of our God.</p></blockquote>

<main class="wrap"><figure class="quote" id="q-ee9c14edcf" data-kw="">
<blockquote><p>Herein it [the 2nd Commandment] differs from the First Commandment, that commanded the worship of God which is natural, this the worship which is by divine institution. Downame Sum of Divinity. Cultus naturalis [natural worship] is that which nature directs all people to, or which arises from the nature of God. This belongs to all reasonable creatures. He that acknowledges there is a God, will acknowledge that He is to be be believed, feared, trusted, loved and prayed to: this was performed by Adam in Paradise and by the angels in Heaven, Isa. 6:3; Heb. 1:6. Cultus institutus, ‘instituted worship’ depends on the revelation of the will of God, this was commanded Adam in his innocency, as the Tree of Knowledge of Good and Evil, and the Tree of Life show. Natural worship is the chief, instituted worship may be interrupted. A time of worship is juris naturalis [of the law of nature], the seventh day juris positivi [of positive law]. Some in these days say all institutions are mere forms, and men may use or not use them at their pleasure according to their light: Qui non est religiosus non est Christianus. Cultus institutus est medium ex Dei voluntate ordinatum, ad cultum naturalem exercendum et pro nov•ndum. indica•tur hujusmodi media omnia à Deo instituta, in secundò praecepto per prohibitionem oppositorum mediorum omnium cultus ab hominibus excogitatorum, sub titulo sculptilis et imaginis, que cum praecipua fuerunt olim▪ hominum inventa, cultum Dei depravantia, aptissimè proponuntur (per Syn••dochen in Decalogo praecipuam) loco omnium humani ingenii commentorum ad cu••um spectantium. Ames, Marrow of Theology, bk. 2, ch. 13.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/edward-leigh.html">Edward Leigh</a></span><span class="wk"><span class="lbl">Work:</span> <cite>A System or Body of Divinity</cite>, … (London: A.M., 1654), bk. 9, ch. 3, ‘2nd Commandment’, p. 767 margin note on Dt., 4:15-19</span></figcaption>

<blockquote><p>Let every one of you, brethren, give thanks to God in his own order, living in all good conscience, with becoming gravity, and not going beyond the rule of the ministry prescribed to him. Not in every place, brethren, are the daily sacrifices offered, or the peace-offerings, or the sin-offerings and the trespass-offerings, but in Jerusalem only. And even there they are not offered in any place, but only at the altar before the temple, that which is offered being first carefully examined by the high priest and the ministers already mentioned. Those, therefore, who do anything beyond that which is agreeable to His will, are punished with death [Lev. 10]. You see, brethren, that the greater the knowledge that has been vouchsafed to us, the greater also is the danger to which we are exposed.</p></blockquote>

</figure><figure class="quote" id="q-f64932c74e" data-kw="">
<blockquote><p>Thus there are certain devout Jews, so called, yet they stirred up persecution against Paul, Acts 13:50; 17:17. They were exceedingly affectionate and devout in their traditional worship they had of God; and so none [were] greater enemies to spiritual worship than they: So true is that of the apostle: ‘The wisdom of the flesh is enmity to God; and it is not, nor can be subject to Him,’ Rom. 8:7. [There is] No greater adversary in the world to the pure worship of God, than a man’s natural reason and carnal apprehensions, destitute of Scripture directions; all the false and superstitious worship which ever came into the Church (and she was scarce ever free) did flow from this fountain: a carnal and human judgment [about] what was fit and orderly, what was pleasing to God and what was displeasing. Austin observed this long ago; and certainly, the simplicity, and pure spiritual worship of God is very offensive and troublesome to carnal apprehensions. When therefore thou art to judge what is the best worship pleasing to God, and wherein He does most delight, do not consult with thy own methinks, or what custom and education has engaged thee to, but to what the Scripture informs therein.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/anthony-burgess.html">Anthony Burgess</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Spiritual Refining: or A Treatise of Grace and Assurance</cite>, … (London, 1652) | section 7, sermon 57</span></figcaption>

<blockquote><p>§65. The sum of all that I have said is this, that man may determine of modes and circumstances of worship, necessary and commanded in genere, but not determined by God in specie. But to make new worship-ordinances, or institute sacraments, or sacramental signs, or any thing else, for which in genere he has no commission, this is simply unlawful. §66. But this is not all: There is a second thing unlawful also; and that is the misdetermining of those same modes and circumstances, which he is authorized to determine. For he is (as is said) to do it by God’s General Rule. Here therefore we must thus conclude:

1. That every misordering of such great affairs is the sin of them that do it.

2. But yet that the subject is not exempted from obedience by every such mistake of the governor: but by some, he is.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/richard-baxter.html">Richard Baxter</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Five Disputations of Church-Government &amp; Worship</cite>, (London: R.W., 1659), 5th Disputation, ch. 2, p. 422</span></figcaption>

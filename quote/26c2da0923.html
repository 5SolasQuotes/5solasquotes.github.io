<main class="wrap"><figure class="quote" id="q-26c2da0923" data-kw="">
<blockquote><p>Though the Old Testament rites after Christ’s death were called “the commandments and doctrines of men” (Col. 2:22), just as the sort that Jesus condemns in Mt. 15:2–9, yet Paul and the Christians did not put any opinion of holiness in these rites or opinion of necessity beyond their nature or what derived from the circumstances (though others did). Paul and the Christians used these material, inconvenient and scandalous (in some way) ceremonies in accord with nature’s light, Christian prudence and the Word’s general rules for the greater good: “Unto the pure all things are pure” (Tit. 1:15).</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/travis-fentiman.html">Travis Fentiman</a></span><span class="wk"><span class="lbl">Work:</span> <cite>“Editor’s Extended Introduction” in English Puritans, A Refutation of the Errors of Separatists</cite>, (1604; RBO, 2025), p. 32</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/the-christian-life/ethics-and-virtue.html">Ethics and Virtue</a></span></div>

<blockquote><p>3rd Caution. One and the same commandment in some things binds the conscience more straitly, and in doing some other things less: Gal. 6:10, ‘Do good to all men, but specially them that be of the household of faith.’ Hence it arises that though all sins be mortal and deserve eternal death, yet all are not equal, but some more grievous than others.</p></blockquote>

</figure><figure class="quote" id="q-f194c6ee17" data-kw="">
<blockquote><p>However, “evil” is an ambiguous term and may stand for miserable or moral evils. One may morally choose to undergo and suffer certain miserable (though not moral) evils in necessity, other alternatives not being available, likely, reasonable or best. Choosing to eat expired food rather than starve is not wrong, though starving would be. That one must have the best or none at all, is against the greater good; miserable evils often contain a significant degree of good, and we ought not to choose the worst.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/travis-fentiman.html">Travis Fentiman</a></span><span class="wk"><span class="lbl">Work:</span> <cite>“Editor’s Extended Introduction” in English Puritans, A Refutation of the Errors of Separatists</cite>, (1604; RBO, 2025), p. 139</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/the-christian-life/ethics-and-virtue.html">Ethics and Virtue</a></span></div>

</figure><figure class="quote" id="q-d516705aa9" data-kw="">
<blockquote><p>But the translation we read from is the best we have, or in cases where it is not, we are helpless to publicly change it when our authorities so impose it according to their office and (erroneous) discretion. If these acts are sinful, we would have to not read God’s Word at all and forfeit his worship ordinance of public Scripture reading, despite his command to maintain such (1 Tim. 4:13). Yet it is better to worship approximately, though defectively, yet in real participation (though only by a certain degree) with God’s ordinance, than not at all, and it is necessary for the higher good of our well-being and salvation to do these inconvenient, impure and scandalous actions and ceremonies under necessity as a requisite for the good that cannot be brought about without them.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/travis-fentiman.html">Travis Fentiman</a></span><span class="wk"><span class="lbl">Work:</span> <cite>“Editor’s Extended Introduction” in English Puritans, A Refutation of the Errors of Separatists</cite>, (1604; RBO, 2025) | …An easy way to see the truth of it is to consider the following example (which [George] Gillespie practiced): To read a Bible translation as the Word of God from the pulpit which has wrong readings, bad translations and mistranslations in it (and hence to call those things God’s Word and for people to believe they are God’s Word when they are not) is inconvenient, impure and scandalous. Yet the KJV, NKJV, ESV, NASB, NRSV, ASV and the Bible version your church uses, and you use personally, all have wrong readings, bad translations and mistranslations in them. One might respond:, pp. 48-49</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/the-christian-life/ethics-and-virtue.html">Ethics and Virtue</a></span></div>

<main class="wrap"><figure class="quote" id="q-72afa8535e" data-kw="">
<blockquote><p>The time of this first darkeness, and the first continuance of the light following, made the first natural day: The darkeness being called Night, and the Light, Day: which light went and returned by the wonderful appointment of God, till the fourth day; when the order of day and night was to be disposed by the sun.</p></blockquote>

<div class="meta"><span class="t"><a href="../topics/creation/the-six-days.html">The Six Days</a></span></div>

</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-bb7c6bef38" data-kw="">
<blockquote><p>1. Man is to be considered as a creature [and] 2. as such a creature, to wit, endued with reason and the Image of God; in either considerations, especially in the former, all that are created are obliged to do and suffer the will of God though they never sinned. It’s not enough to say that sun, moon, trees, herbs, vines, earth, beasts, birds and fishes cannot suffer the ill of punishment which is relative to the break of a Law, for the whole creation is subject to vanity for our sins, Rom. 8:20-21. The servant is smitten and sickened for the master’s sake, and God may take from them what He gave them, [even] their lives without sense of pain and dolor, for all beings, yea [even] defects and privations, are debtors to the glory-declarative of God, Prov. 16:4; Rom. 11:36; yea, and no-beings [things that could be, but are not,] are under this debt.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/samuel-rutherford.html">Samuel Rutherford</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Covenant of Life Opened… (1655)</cite>, p. 17</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/creation/the-six-days.html">The Six Days</a></span></div>

</figure><figure class="quote" id="q-996bcdaf99" data-kw="">
<blockquote><p>Perfection is God all-sufficient and all-excellent: not having need of any thing, giving sufficience unto and having in Him the perfection of all things, Gen. 17:1-2; Ex. 6:3. This attribute renders God as that infinite Sea of all happiness. Perfection is increated [uncreated] glory: that is, all the attributes in one word; as happiness is the sum of man’s good, so glory is the sum of all God’s attributes. The perfection of God is essential, independent, unlimited, without increase or decrease: As the power of subordinate causes is contained in the first cause virtually: and as the authority of under-officers is in the prince after a more excellent manner, so the virtue of all second causes is contained in the first cause eminently. The word ’eminently,’ taken in its strict and proper sense, seems to intend the effect to be in the cause, not only in a more excellent manner than in itself, but also in a super-created manner. Things are in God agreeable to the nature of God: in themselves according to their proper natures. Eminential continency, and virtual continency (that is, for one thing to be contained in another eminently, as the excellency of the creature is in the Creator: or virtually, as all things saleable are in money, Eccl. 10:9) are not the same: the first is proper to the Creator; the second is found in the creature.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/john-norton.html">John Norton</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Orthodox Evangelist… (London: Macock, 1654), ch. 1, ‘Of the Divine Essence’</cite>, p. 20</span></figcaption>

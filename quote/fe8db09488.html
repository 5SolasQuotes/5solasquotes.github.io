<main class="wrap"><figure class="quote" id="q-fe8db09488" data-kw="">
<blockquote><p>Problem I. Whether those habits are augmented through actions, or rather through infusion or impression of augmentation? Response: Affirmative to the former. Problem II. Whether therefore those habits, or spiritual qualities, are to be called acquired or rather infused? Response: As to their essence, form, and species, and thus the first being of themselves, they are properly infused; as to degrees or increments, acquired.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/gisbertus-voetius.html">Gisbertus Voetius</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Disputation 30, ‘On Regeneration’, pt. 2</cite>, (1639) tr. AI by Roman Prestarri in Select Theological Disputations (1655), vol. 2, pp. 447ff. Latin at Confessionally Reformed Theology</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/sanctification/nature-of-sanctification.html">Nature of Sanctification</a></span></div>

</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-4ad1a0aac9" data-kw="">
<blockquote><p>7th Problem: Whether unregenerate or regenerate man sanctifies himself, or actively concurs to it? I respond: concerning the former, negatively; concerning the latter, affirmatively, if indeed sanctification in the moment and in the second act is understood, that is, its excitation and ἐνέργεια [energeia, energy/activity], or continuation. And thus the sayings 2 Cor. 7:1; 1 Jn. 3:3 are to be understood.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/gisbertus-voetius.html">Gisbertus Voetius</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Disputation 29, ‘On Regeneration’, pt. 1</cite>, (1639) tr. AI by Roman Prestarri in Select Theological Disputations (1655), vol. 2, pp. 432-65 Latin at Confessionally Reformed Theology</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/sanctification/nature-of-sanctification.html">Nature of Sanctification</a></span></div>

</figure><figure class="quote" id="q-39a2584e2a" data-kw="">
<blockquote><p>4. [God justifies] By way of Execution, when the sentence is executed. This is in part done here, as God takes off the penalties and fruits of sin, either in the way of his internal or external government, and gives us many blessings, as the pledge of his love, and above all, the gift of the Holy Spirit, whereby He sanctifies us more thoroughly, and works in us that which is pleasing in his sight: This He gives as the God of peace, as reconciled to us in Christ, Heb. 13:20-21: ‘Now the God of peace that brought again from the dead our Lord Jesus, that great shepherd of the sheep, through the blood of the everlasting Covenant, make you perfect in every good work, to do his will, working in you that which is pleasing in his sight, through Jesus Christ.’ 1 Thess. 5:23: ‘And the very God of peace sanctify you wholly: and I pray God your whole spirit, and soul, and body, be preserved blameless unto the coming of our Lord Jesus Christ;’ Faithful is he that calls you, who will do it: but more fully at the Last Day, when we enter into everlasting glory; and the wicked are turned into Hell with the Devil and his angels, Mt. 25:46, ‘And these shall go into everlasting punishment; but the righteous into life eternal’: then is the full and final execution, a perfect freedom from all misery, and a possession of all happiness.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/thomas-manton.html">Thomas Manton</a></span><span class="wk"><span class="lbl">Work:</span> <cite>A Second Volume of Sermons preached by the late reverend and learned Thomas Manton</cite>, … (London: Astwood, 1684), Sermons on Rom. 8, Sermon 43, on Rom. 8:33, p. 334</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/sanctification/nature-of-sanctification.html">Nature of Sanctification</a></span></div>

584e2a.html">Permalink</a><a class="src" href="https://reformedbooksonline.com/topics/topics-by-subject/sanctification#:~:text=4.%20%5BGod%20justifies%5D%20By%20way%20of,and%20a%20possession%20of%20all%20happiness&amp;text=4.%20%5BGod%20justifies%5D%20By%20way%20of%20Execution%2C%20when&amp;text=all%20misery%2C%20and%20a%20possession%20of%20all%20happiness" rel="noopener" target="_blank">Read it online · Reformed Books Online</a></div>
</figure><figure class="quote" id="q-f2cd2fb423" data-kw="">
<blockquote><p>[The gospel according to Romanism] overturns the nature of justification, and at best it does put in sanctification in the room thereof; and there is never any distinct ground laid, by which a sinner may come to receive a sentence of absolution before God, but this, to wit, justification, is lost by the former doctrine; and they acknowledge no such thing distinct from regeneration or sanctification, as if no such act as justification were needful or mentioned in Scripture, as distinct from these; and, in effect, it leaves a sinner to a way of salvation that wants [lacks] justification in it: and therefore cannot profit him. For by denying that which is the formal cause of justification, they deny itself, seeing that gives it a being.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/james-durham.html">James Durham</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Commentary on Revelation</cite>, (Naphtali Press) vol. 3, p. 198</span></figcaption>

<main class="wrap"><figure class="quote" id="q-338a4dba70" data-kw="">
<blockquote><p>Drawing when he is on the Crosse, doth most extoll Christs love: death parteth company amongst men, and often parteth loves; but Christ dying draweth his Church into his bosome and heart, as not willing that the grave should part them and him … Christ dyed loving, and dyed drawing.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/samuel-rutherford.html">Samuel Rutherford</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Christ Dying and Drawing Sinners to Himself</cite>, London, 1647, p. 532</span></figcaption>

</figure><figure class="quote" id="q-98ebf40a4f" data-kw="">
<blockquote><p>In reference to grateful love, nothing so much tends to fill the heart with this emotion as the believing realization of Christ’s redemption work—nothing so melts the heart; and no purer love to God can be imbibed. … There is no motive to a holy life so powerful and efficacious as that which is drawn from the propitiatory work of Christ, who, after meeting the demands of the law and bearing its curse, makes that same law a rule to direct our steps; and Christians learn to take it from the Mediator’s hand.</p></blockquote>

</figure><figure class="quote" id="q-0bc84a0fa8" data-kw="">
<blockquote><p>The great question is, What constitutes a Christian? It is being so constrained by a sense of the love of our divine Lord to us, that we consecrate our lives to him. Hence, faith in his divinity, faith in his love, faith in his having died for us, is the principle or source of the Christian life. And this is the only form in which true religion can now exist. That is, the only true religion now possible is, the worship, love, and service of the Lord Jesus Christ.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/charles-hodge.html">Charles Hodge</a></span><span class="wk"><span class="lbl">Work:</span> <cite>An Exposition of the Second Epistle to the Corinthians</cite>, on 5:14</span></figcaption>

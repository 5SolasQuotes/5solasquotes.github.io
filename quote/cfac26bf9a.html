<main class="wrap"><figure class="quote" id="q-cfac26bf9a" data-kw="">
<blockquote><p>I told you but now that they of the King’s army had this winter sent three times to Mansoul to submit herself. The first time the trumpeter went, he went with words of peace, telling them that the captains, the noble captains of Shaddai, did pity and bewail the misery of the now perishing town of Mansoul, and were troubled to see them so much to stand in the way of their own deliverance. He said, moreover, that the captains bid him tell them, that if now poor Mansoul would humble herself and turn, her former rebellions and most notorious treasons should by their merciful King be forgiven them, yea, and forgotten too. And having bid them beware that they stood not in their own way, that they opposed not themselves, nor made themselves their own losers, he returned again into the camp. The second time the trumpeter went, he did treat them a little more roughly; for, after sound of trumpet, he told them that their continuing in their rebellion did but chafe and heat the spirit of the captains, and that they were resolved to make a conquest of Mansoul, or to lay their bones before the town walls. He went again the third time, and dealt with them yet more roughly; telling them that now, since they had been so horribly profane, he did not know, not certainly know, whether the captains were inclining to mercy or judgment. ‘Only,’ said he, ‘they commanded me to give you a summons to open the gates unto them.’</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/john-bunyan.html">John Bunyan</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Holy War: the Battle For Mansoul</cite>, (1682; Monergism) 245 pp., pp. 58-59</span></figcaption>

</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-ffa773a8f2" data-kw="">
<blockquote><p>But alas, how should Christ come in power to help us, whom we have rejected comming in power to convert us! Does He come now, and we will not know Him; and can we hope He will come then when we call Him? Open your hearts, all ye that fear the Lord, and let Him in… and has the Gospel of Christ lost the powerfulness? No, if it have not power to convert us, it will have power to confound us. If Christ be not suffered to come unto us, He will not be hindered from coming against us. Oh let us come unto Him, that He may come unto us: subject we our hearts and lives to the obedience of his Gospel… Let us now honor Him when He comes in grace, that He may honor us when He comes in glory.</p></blockquote>

</figure><figure class="quote" id="q-1cfa5d17ab" data-kw="">
<blockquote><p>He does not knock at the door of his friends merely, but at the door of his enemies. He knocks at the door of the vilest of sinners… 3. Behold the extent of his willingness to receive sinners. The sinner sometimes says, ‘I am willing to receive Christ, but He is not willing to receive me.’ But what says the text? ‘Behold I stand at the door and knock.’ Does not this imply his readiness and willingness to come in? Nor is this all—He calls, ‘Open unto Me—open unto Me.’ Nor is this all—He says, ‘if any man hear my voice and open the door, I will come in.’ He positively declares that He is willing. Nor is this all—you may say, I am such a great sinner—I have rejected him so long, that He will not receive me now. But what says the Savior? ‘If any man hear my voice’—vile as he may be, if he is on the side of hell—‘if any man hear my voice and open the door, I will come in to him, and sup with him, and he with Me.’ If you are not now a Christian, permit me to say that you have never heard his voice, nor opened the door, nor been willing to receive Him. You have never complied with the invitation in the text. The Savior is ready and willing, but you will not come to Him that you might have life. [Jn. 5:40] 4. Behold your danger. The Savior stands at your door. He does not sit. He stands ready to enter or ready to depart… He may say, as he once said to the Jews, ‘I go my way. Ye shall see me, and shall die in your sins.’ How often ‘I would,’ and ‘ye would not.&#x27;</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/asahel-nettleton.html">Asahel Nettleton</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Remains of the Late Rev. Asahel Nettleton</cite>, ed. B. Tyler (Hartford: Robins &amp; Smith, 1845), Sermon 25, ‘Christ Standing at the Door’, pp. 300-302</span></figcaption>

<blockquote><p>And he ran before, and climbed up into a sycomore tree to see him: for he was to pass that way. And when Jesus came to the place, he looked up, and saw him, and said unto him, ‘Zacchaeus, make haste, and come down; for to day I must abide at thy house.’ And he made haste, and came down, and received Him joyfully. And when they saw it, they all murmured, saying, That he was gone to be guest with a man that is a sinner. And Zacchaeus stood, and said unto the Lord: Behold, Lord, the half of my goods I give to the poor; and if I have taken any thing from any man by false accusation, I restore him fourfold. And Jesus said unto him, ‘This day is salvation come to this house, forsomuch as he also is a son of Abraham. For the Son of man is come to seek and to save that which was lost.&#x27;</p></blockquote>

<main class="wrap"><figure class="quote" id="q-872ce39473" data-kw="">
<blockquote><p>There is no universal redemption, nor universal atonement. Jesus Christ died not for all and every individual person of mankind; but for the elect only. The contrary doctrine may consist with the opinion which holds the covenant of redemption, and the covenant of grace, to be two distinct covenants; the former made with Christ, and the latter with believers; the condition of the one undertaken and performed by him, the condition of the other undertaken and performed by us. Accordingly that opinion concerning the covenant, is readily embraced by Universalists of different denominations.

But that doctrine is utterly inconsistent with this account of the covenant, which doth at once overthrow universal redemption or atonement, together with the federal conditionality of our holiness and good works, in the covenant of grace. For if the covenant of grace was made with Christ as a representative, and the elect only were the party represented by him in it; then surely the conditions of the covenant, his doing and dying, were accomplished for them only; and he died for no other: as when one hath entered into a bond of suretyship, his payment of that bond can never be reckoned a payment of their debt, whose names were not in the bond, and whom he was not surety for.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/thomas-boston.html">Thomas Boston</a></span><span class="wk"><span class="lbl">Work:</span> <cite>A View of the Covenant of Grace, from the Sacred Records</cite>, (1734) in The Works of Thomas Boston, ed. Samuel McMillan (12 vols, London, 1853), viii, 404-05.</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/election.html">Election</a></span></div>

</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-c6dad495f3" data-kw="">
<blockquote><p>And what shall we say to this; that without this Doctrine, due honour cannot be given to God, nor our faith made stable? For by the Doctrine of Predestination, that immeasurable heap of the goodness and love of God towards us, by which he loved us and respected us, before the foundations of the world were laid, doth enter into our minds. Also whatsoever light or grace God doth measure to us, is acknowledged to be a river flowing from that eternal love. By this doctrine man’s merits do fall to the ground; and the imaginary faculty of free-will in things pertaining to salvation, doth vanish away. The confidence of our salvation will also stagger, unless it be upholden by the immutable decree of God, and not by man’s free-will.

This doctrine also is a great lightning of our sorrows, and mitigation of all bitterness: while we consider that all things, even those that are most grievous, turn to the good of them, who are called by the purpose of God. Neither is there any more forcible instigation to good works, than the acknowledgement of that eternal love, wherewith God, in Christ, hath loved us before all worlds. Finally, by this doctrine we are taught to search into our selves and to try our own consciences, to find in us, and to stir up the testimonies of our election; knowing that our own endeavour and care ought to further the election of God, and that by the way of hell, that is by impenitency and unbelief it is impossible to come to heaven.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/pierre-du-moulin.html">Pierre Du Moulin</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Anatomy of Arminianism: Or, The Opening of the Controversies of These Times (Formerly Handled in the Low-Countries) Concerning the Doctrine of Providence, of Predestination, of the Death of Christ, of Nature and Grace, &amp;c</cite>, (1619; London: Nathanael Newbery, 1635), 2, p. 4.</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/election.html">Election</a></span></div>

</figure><figure class="quote" id="q-643aef881b" data-kw="preceptive will gospel offer">
<blockquote><p>Conditional promises and threatenings do not favor conditional decrees because they do not pertain to the decreeing will, but to the preceptive will and are appendages to the divine commands, added to stimulate and excite men. … Hence such promises and threats show only the necessary connection of the condition with the thing conditioned, but involve no futurition of the thing.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/francis-turretin.html">Francis Turretin</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Institutes of Elenctic Theology</cite>, 4.3.10</span></figcaption>

</figure><figure class="quote" id="q-cdb11597b3" data-kw="">
<blockquote><p>Nay, brethren, ye are ordained of God to rule and govern your own houses in God’s true fear, and according to his holy Word – within your own houses, I say, in some cases ye are bishops and kings; your wives, children, and family are your bishopric and charge; of you it shall be required how carefully and diligently ye have instructed them in God’s true knowledge; how ye have studied, in them to plant virtue, and to repress vice. And therefore I say, ye must make them partakers in reading, exhortation, and in making common prayers; which I would, in every house were used once a day at least. But above all things, dear brethren, study to practise in life that which the Lord commands, and then ye assured, that ye shall never hear nor read the same without fruit. And this much for the exercises within your houses.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/john-knox.html">John Knox</a></span><span class="wk"><span class="lbl">Work:</span> <cite>A most wholesome counsel how to behave ourselves in the midst of this wicked generation, touching the daily exercise of God s most holy and sacred word (1556)’ in R. S. Candlish (ed.), Select practical writings of John Knox</cite></span></figcaption>

</figure><figure class="quote" id="q-49d3983410" data-kw="unconditional election good pleasure">
<blockquote><p>Election was made from God’s mere good pleasure; therefore, not on account of Christ [as antecedent cause] because good pleasure excludes every cause out of God upon which election may depend. … “That the purpose of God according to election might stand, not of works, but of him that calleth” (Rom. 9:11); “It is not of him that willeth, nor of him that runneth, but of God that sheweth mercy” (Rom. 9:16).</p></blockquote>

</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-7c90655911" data-kw="providence sin mean">
<blockquote><p>The orthodox hold the mean between these extremes, maintaining that the providence of God is so occupied about sin as neither idly to permit it (as the Pelagians think) nor efficiently to produce it (as the Libertines suppose), but efficaciously to concur about it, so that he is neither the author of sin nor a mere idle spectator of it.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/francis-turretin.html">Francis Turretin</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Institutes of Elenctic Theology</cite>, 6.7.2</span></figcaption>

</figure><figure class="quote" id="q-710f501986" data-kw="">
<blockquote><p>IX. Wherefore this [original] sin is not something positive, that is, a certain subsisting thing created by God, nor is it simply nothing, nor a simple and pure privation, as death is the privation of life, or darkness is the privation of light; but it is that which is at the same time a defect and a destruction of a positive thing, namely of the work and divine order by which all our powers and inclinations ought to have been ruled, and therefore a vicious habit exciting and begetting internal and external motions, which, straying from the law of God, are displeasing to God.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/theodore-tronchin.html">Theodore Tronchin</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Theological Theses on Original Sin</cite>, trans. AI (Geneva: de la Planche, 1625), p. 4 Tronchin (1582-1657) was a professor of Hebrew and theology at Geneva.</span></figcaption>

</figure><figure class="quote" id="q-6650e8cc1e" data-kw="">
<blockquote><p>Thesis XXI… yet properly the substance itself, or the nature, or the action of a rational creature is not sin, but is infected by sin. Sin, however, is the lawlessness (ἀνομία) itself, that is, the defect and privation of due righteousness in the action itself, or in the rational substance, according to the law of God. Therefore, the apostle rightly did not say that sin is an unjust thing, or an evil action, but ἀνομία, that is, that by which a nature or action is, and is called unjust. So that the nature and the action, which are good in themselves and of which God is the author, must be entirely distinguished from the iniquity, by which they are unjust, and of which God cannot be the author.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/christoph-luthard.html">Christoph Luthard</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Theological Disputation on Original Sin</cite>, (Bern: Fabricius, 1637), p. 9 Lüthardt (1590-1663) was a Swiss reformed professor of philosophy and theology at Bern.</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/providence/providence-and-evil.html">Providence and Evil</a></span></div>

</figure><figure class="quote" id="q-9d7b8126b5" data-kw="">
<blockquote><p>Things inconvenient, even in matters of religion, may be commanded in some cases: as when it is to redeem a far worse inconvenience. For of two evils of punishments [cf. 2 Sam. 24:10–17], the magistrate may take the less, as well as any other private man. And if that subjects, to prevent worse inconveniences, may use inconvenient ceremonies, then may the magistrate, to prevent worse inconveniences, command inconvenient ceremonies. If the apostles may use the inconvenient Jewish ceremonies, then the apostles may enjoin for a time the use of inconvenient ceremonies: as they did make ordinances about things which yet they called “burdens,” Acts 15 [v. 28]. And Moses may make an ordinance about the use of a bill of divorcement which yet was a grievous inconvenience to redeem a worse inconvenience. But if magistrates do appoint inconvenient things and burden the Church with them, when there would be no great inconvenience to the Church if such things were not, then such magistrates must give their account to Christ for so doing; but yet the people are bound to obey still, because we cannot be freed from our subjection laid upon us by God except it appear to us that they command not only an inconvenience, but a sin, as all sound divines confess.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/nicholas-byfield.html">Nicholas Byfield</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Commentary on 1 &amp; 2 Peter</cite>, (London: Flesher, 1637), on 1 Pet. 2:13, pp. 434–35</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/providence/providence-and-evil.html">Providence and Evil</a></span></div>

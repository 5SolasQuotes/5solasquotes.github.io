<blockquote><p>Ye are in heaviness.] This the Apostle blames not, but aims at the moderating of it. Seek not altogether to dry up this stream, but to bound it, and keep it within its banks. Grace doth not destroy the life of nature, but adds to it a life more excellent; yea grace doth not only permit, but requires some feeling of afflictions.

There is an affected pride of spirit in some men, instead of patience, suitable only to the doctrine of the Stoics as it is usually taken: they strive not to feel at all the afflictions that are on them; but this is to despise the correction of the Lord, which is alike forbidden with fainting under it. Heb. xii. 5. We should not stop our ears, but hear the rod, and him that hath appointed it, as the prophet speaks, Mic. vi. 9. Where there is no feeling- at all, there can be no patience.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/robert-leighton.html">Robert Leighton</a></span><span class="wk"><span class="lbl">Work:</span> <cite>A Practical Commentary upon the First Epistle General of Saint Peter</cite>, (1693-94) in The Whole Works of the Most Reverend Father in God, Robert Leighton, D.D., Archbishop of Glasgow (2 vols, London: James Duncan, 1828), 1: 143-44.</span></figcaption>

<blockquote><p>Now of all other temptations, it pleaseth God to suffer his church to be tempted with afflictions. It is never free either from the sword of Ishmael; which is a reviling tongue: or the sword of Esau, a persecuting hand. Neither was there yet ever Christian man found, who had not his part in the cup of affliction. We must drink of the same cup our master did: the disciple is not about his master.

The reasons why God doth visit vs thus with afflictions, are: 1. To humble us. 2. To wean us. 3. To winnow us. 4. To prevent us. 5. To teach us. 6. To enlighten us. 7. To honour us. 8. To cure us. 9. To crown us. 10. To comfort us. 11. To protect us. 12. To adopt us. And last of all, to teach and comfort others.

To humble us, that we be not proud: to wean us, that we love not his world: to winnow us, that we be not chaff: to prevent us, that we do not sin: to teach us, that we be patient in adversity: to enlighten us, that we see our errors: to honour us, that our faith may be manifest: to cure us, that we surfeit not of security: to crown us, that we may live eternally: to comfort us, that he may send his spirit: to protect us, that he may guide us by his Angels: to adopt us, that we may be his sons: and to teach others, that they seeing how sin is punished in us, they may take heed it be not found in them: that they seeing our comforts in troubles, may not be discouraged in the like trials.</p></blockquote>

<blockquote><p>Suffering especially tests and strengthens hope. Paul teaches that discovering God’s help increases our hope (Rom. 5:5). Because God enables us to experience his goodness, power, and faithfulness when we are in need, because he strengthens us against every temptation and safeguards us against every attack, and because he delivers us from all our fears, he in all these ways so establishes and guarantees in us the truth of his promises that whoever calls on him will be saved and whoever trusts in him will never be put to shame. …

By means of trials God puts our obedience to the test. When all goes well according to the flesh, it is not difficult for us to yield to his will and to recognize his goodness and love towards us. But when he visits us with sickness, poverty, reproach, or some other misery, it is then true obedience to feel that he loves us, to embrace his divine guidance, and to submit to his will. …

How shabbily we treat this one, true, and heavenly Father when in days of oppression we fail to hallow his name, to conform our will to his, and to confess that all things proceed from his goodness and love – all of which serves his praise as well as our salvation.

So we see how in the school of we learn what it actually means to be obedient to God. We need this education. For as Jesus Christ, even though he was God’s Son, nevertheless “learned obedience from what he suffered” (Heb. 5:8), how much more necessary it is for us in days of persecution to learn to submit our heads and our hearts to God’s leading.</p></blockquote>

<blockquote><p>In the Sufferings of Christ. Here is a Glass, O Criminals, wherein you may fee your own Face. You think it a little Thing that you have sinned; nay, it may be, you roll Sin at a sweet Morsel under your Tongues. But come here, and see what a Thing it is which you thus dreadfully mistake! Come see it holding the Sword; O strange! Nay more, thrusting it into Christ’s Side! Here, Sinners, is a Sight that made the Earth to tremble, and the Sun to hide his Face, as we see Matth. xxvii. ix. Luke xxiii. 45.

In this Glass you may see, (1.) What GOD’s Thoughts of Sin are. So highly opposite to his Nature is it, that the Bowels of Affection he had to the Son of his Love, whom he so highly honoured, when the Voice came from the excellent Glory, saying, This is my beloved Son in whom I am well pleased, were not able to hold up the Hand of inexorable Justice from striking at him, nay, striking him dead for the Sin of the elect World. Would hot that be a great Proof, think ye, of the Aversion of a Parent to any Thing, if he would rather choose to slay his Son, nay, his only Son, his Son whom he loved most tenderly, than it should escape a Mark of his Displeasure?

(2.) Here you may see more of the Pollution of Sin than any where else. Never was there anything that gave so just Apprehensions of the Stain of Sin, as the Death of Christ. An ingrained Pollution it must indeed be, if no less will wash it out than the Blood of GOD. (3.) Here is a dreadful Evidence of the Power of Sin. Never did this more appear, than when it blinded the Eyes of the degenerate Sons of Men so far, that they could not discern the Glory of the only begotten of the Father, who was so full of Grace and of Truth, whose divine Nature daily beamed, as it were, through that of his human, in miraculous Operations, Works, and Words, which none but GOD could do, none but GOD could speak. And no less was the Power of Sin seen, when it hurried Men headlong into that Heaven-daring Pitch of Impiety, to imbrue their Hands in the Blood of GOD. O Sinners, would you fee what Sin is? look at it with its Hands reeking in the Gore and Blood of GOD, and tell what you think of it.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/thomas-halyburton.html">Thomas Halyburton</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Great Concern of Salvation</cite>, (Edinburgh, 1721), pp 54-55.</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/trials-the-cross-and-comfort/suffering-and-the-cross.html">Suffering and the Cross</a></span></div>

(2.) Here you may see more of the Pollution of Sin than any where else. Never was there anything that gave so just Apprehensions of the Stain of Sin, as the Death of Christ. An ingrained Pollution it must indeed be, if no less will wash it out than the Blood of GOD. (3.) Here is a dreadful Evidence of the Power of Sin. Never did this more appear, than when it blinded the Eyes of the degenerate Sons of Men so far, that they could not discern the Glory of the only begotten of the Father, who was so full of Grace and of Truth, whose divine Nature daily beamed, as it were, through that of his human, in miraculous Operations, Works, and Words, which none but GOD could do, none but GOD could speak. And no less was the Power of Sin seen, when it hurried Men headlong into that Heaven-daring Pitch of Impiety, to imbrue their Hands in the Blood of GOD. O Sinners, would you fee what Sin is? look at it with its Hands reeking in the Gore and Blood of GOD, and tell what you think of it.”

<main class="wrap"><figure class="quote" id="q-b45e764ede" data-kw="">
<blockquote><p>This oath is such, and, in the matter and consequence of it, of such concernment, as I can truly say, It is worthy of us; yea, of all these kingdoms; yea, of all the kingdoms of the world; for it is swearing fealty and allegiance unto Christ, the King of kings; and giving up of all these kingdoms which are in His inheritance, to be subdued more to His throne, and ruled more by His sceptre, upon whose shoulders the government is laid, and “of the increase of whose government and peace there shall be no end.”

Yea, we find this very thing in the utmost accomplishment of it, to have been the oath of the greatest angel that ever was, who setting his feet upon two of God’s kingdoms, the one upon the sea, the other upon the earth, lifting up his hand to heaven, as you are to do this day, and so swearing. The effect of that oath you shall find to be this, “That the kingdoms of the world become the kingdoms of the Lord and His Christ, and He shall reign forever.” His oath was for the full and final accomplishment, this of yours for a gradual, yet a great performance towards it.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/philip-nye.html">Philip Nye</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Solemn League and Covenant. Exhortation at Westminster (1643) in James Kerr (ed.), The Covenants and the Covenanters: Covenants, Sermons, and Documents of the Covenanted Reformation</cite></span></figcaption>
<div class="meta"><span class="t"><a href="../topics/worship.html">Worship</a></span></div>

</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-c461bfde6e" data-kw="">
<blockquote><p>…as to the duties wherein the Sabbath is to be spent, which are shortly, all duties of immediate worship, whether they be inward, as meditation, self-examination, heart-prayer, either ejaculatory or more continued, heart-sorrow for sins, etc. or outward, as vocal prayer and singing of psalms, reading the Scriptures and other pious books, hearing the Word, etc.; or whether they be secret which may be both inward and outward, or private in families, as reading of the Word, confering on it, repeating sermons, praying together, etc. or public, as joining with the congregation in prayers and praises, hearing the Word read and the sense given, hearing of sermons, participating of the sacraments when dispensed, joining in solemn humiliations and thanksgivings when they fall necessarily or more conveniently to be on the Sabbath; All which and such like are proper duties for that day; to which liberal laying up and giving for the relief of the poor according to ability and as God blesses every man would be added as a suitable duty of it, though it be no duty of immediate worship.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/james-durham.html">James Durham</a></span><span class="wk"><span class="lbl">Work:</span> <cite>A Practical Exposition of the Ten Commandments</cite>, … (London: Newman, 1675), 4th Commandment, Sanctification of, pp. 289-90</span></figcaption>

<blockquote><p>[A]ll ceremonies and observances instituted by the invention of man to form part of the worship of God are so many sacrileges against Him. For, in the same way as it belongs to Him alone to make the promise, so also to Him alone to choose the seal and to affix it to His promises (Gal 1:8, 9; 1 Cor 11:23-25).

That is why all those who have had the presumption to make new Sacraments or who have added to those which He has established in His Church by His written Word, or have subtracted from them, have falsified the seals of His majesty. As for ourselves, we are satisfied in our Churches with those which God has appointed by His Word.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/theodore-beza.html">Theodore Beza</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Christian Faith</cite>, trans. James Clark (1558; Edinburgh, 2016), 4.33, p. 47.</span></figcaption>

<blockquote><p>That it is the property of the faithful man to be fully persuaded of the truth of those things that are delivered in the holy scripture, and not to dare either to reject or add any thing thereunto . For if whatsoever is not of faith be sin, as the Apostle saith, and faith is by hearing, and hearing by the word of God; then whatsoever is without the holy scripture, being not of faith, must needs be sin.</p></blockquote>

<blockquote><p>II. We believe also that this death of Christ alone, is a perfect and sufficient ransom, to expiate and abolish all the sins of the whole world, that the merit of his justice is immense, that the medicine of his death is universal, the ever-flowing and inexhausted spring of life eternal.</p></blockquote>

<blockquote><p>31. But the sense of these places [1 Jn. 2 and 2 Pet. 2] is that Christ gave Himself (which we easily acknowledge) as a sufficient price for the whole world and for the false teachers themselves. Even so, those alone are effectually redeemed who acknowledge this grace; not those who delight themselves in their own captivity, and are rejecters of Christ, such as are the reprobate.

32. We have already warned above about those universal passages that they ought to be, in certain places, restricted to all the elect, whom the Lord has [as his own], not only in Judea but also in all parts of the world, in which sense it may also be said that “the blood of Christ is a propitiation for the whole world”—although this text we freely acknowledge to be about sufficiency. … 37. However, it is incredible shamelessness of those critics which drives them to write that our church doctrine about the death of Christ, and its efficacy being limited to the elect and believers alone, leads people to despair, because one cannot deduce anything certain from mere particular propositions. …

9. We accordingly conclude with the Scriptures that all the elect or believers in Christ are saved by Christ…

10. But as one error begets another, our adversaries claiming that God equally loves all and that Christ died effectually for all, although they nominally admit there to be a certain number of the elect, nevertheless they undermine the whole force of divine election, and instead they move into the military camp of the Pelagians, who make foreseen faith and [foreseen] unbelief the cause of salvation and death, of election and reprobation.</p></blockquote>

<blockquote><p>IX. Thus, besides the Schoolmen, the orthodox fathers also teach: so Prosper Aquitanicus, in the year of Christ 460, Response to the Objections of Vincent., Objection 1: Whereas it is rightly said that our Savior was crucified for the redemption of all the world, for undertaking the affairs of human nature, and for the common loss in Adam: yet it may be said that He died only for these to whom his death was profitable. And Cyril on John l. 11, ch. 19, says, That Christ is an advocate for the sins of all the world: that is, not only for the Jews, but also for other nations; or, for all who, being called by faith, attain to righteousness and sanctification; so that the benefit of a mediator, not without cause, belongs only to them whose mediator and high-priest He is.

X. But, of all men, Augustine speaks most clearly, whose opinion (because it is altogether ours) I thought to set in opposition to some sycophants. Thus he speaks (tome 1, ad Art. falso imp., article 1): If we consider the greatness and power of the price, and that it belongs to the only cause of mankind, the blood of Christ is the redemption of the whole world; but they that pass out of this life without faith and the sacrament of regeneration, they are not partakers of redemption. Whereas then by reason of that one nature of all, and the one cause of all, undertaken by our Lord truly, all are said to be redeemed, and yet not all are delivered from captivity, doubtless the property of redemption is in them out of whom the prince of this world is ejected: and now they are no more the vessels of Satan, but the members of Christ. Whose death is not so spent upon mankind that they also who are not regenerated should appertain to his redemption; but so, that what by one example is done for all, by a particular sacrament should be celebrated in each one: for that cup of immortality, which was composed of our infirmity, and of our verity, and of divine verity, it has in itself that which may benefit all, but if it be not drunk, it does not cure.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/david-pareus.html">David Pareus</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Other citations (work not named)</cite>, Article 2, ‘Of Christ’s Death &amp; Merit’ in Aphorisms of the Orthodox Doctrine of the Reformed Churches in Zachary Ursinus, The Sum of Christian Religion… (London: Young, 1645), pp. 694-98</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/priestly-office-satisfaction-and-atonement/extent-of-the-atonement.html">Extent of the Atonement</a></span></div>

<blockquote><p>The second sort of divines (Contra-Remonstrants) [those against the Arminians] distinguish the sufficiency and efficiency of Christ’s death. In respect of the worth and greatness of the price, He died for all men: because it was sufficient for the redemption of every man in the world if they did repent and believe; and God might, without impeachment of justice, have offered salvation to every man in the world had it been his pleasure. In the efficiency, as every man or any man has fruit by the death of Christ, so Christ died for him. But this is not of one kind: some fruit is common to every man; for as Christ is lord of all things in heaven and earth, even the earthly blessings which infidels enjoy may be termed fruits of Christ’s death. Others proper to the members of the visible Church, and common to them, as to be called by the word, enjoy the ordinances of grace, live under the covenant, partake of some graces that come from Christ, which, through their fault, be not saving; and in this sense Christ died for all that be under the covenant. But other fruits of Christ’s death, according to the will of God and intention of Christ as Mediator, be peculiar to the sheep of Christ, his brethren, them that be given unto him of the Father, as faith unfeigned, regeneration, pardon of sin, adoption, etc.; and so they hold Christ died efficiently for his people only, in this sense,–namely, so as to bring them effectually to faith, grace, and glory.</p></blockquote>

<div class="actions"><button class="copy" data-copy="“The second sort of divines (Contra-Remonstrants) [those against the Arminians] distinguish the sufficiency and efficiency of Christ’s death. In respect of the worth and greatness of the price, He died for all men: because it was sufficient for the redemption of every man in the world if they did repent and believe; and God might, without impeachment of justice, have offered salvation to every man in the world had it been his pleasure. In the efficiency, as every man or any man has fruit by the death of Christ, so Christ died for him. But this is not of one kind: some fruit is common to every man; for as Christ is lord of all things in heaven and earth, even the earthly blessings which infidels enjoy may be termed fruits of Christ’s death. Others proper to the members of the visible Church, and common to them, as to be called by the word, enjoy the ordinances of grace, live under the covenant, partake of some graces that come from Christ, which, through their fault, be not saving; and in this sense Christ died for all that be under the covenant. But other fruits of Christ’s death, according to the will of God and intention of Christ as Mediator, be peculiar to the sheep of Christ, his brethren, them that be given unto him of the Father, as faith unfeigned, regeneration, pardon of sin, adoption, etc.; and so they hold Christ died efficiently for his people only, in this sense,–namely, so as to bring them effectually to faith, grace, and glory.”

— John Ball, Treatise of the Covenant of Grace (1645), pp. 205-6, According to Mitchell and Struthers, who compiled the 1800’s edition of the Notes to the Westminster Assembly, Ball’s work “was held in high esteem by the Puritans, and [was] recommended by Reynolds, as well as Calamy and several other members of the Westminster Assembly.”">Copy</button><a class="share" href="https://x.com/intent/post?text=%E2%80%9CThe+second+sort+of+divines+%28Contra-Remonstrants%29+%5Bthose+against+the+Arminians%5D+distinguish+the+sufficiency+and+efficiency+of+Christ%E2%80%99s+death.+In+respect+of+the+worth+and+greatness+of+the+price%2C+He+died+for+all+men%3A+because+it+was+sufficient+for+the+redemption+of+every+man+in+the+world+if+they+did+repent+and+believe%3B+and+God+might%2C+without+impeachment+of+justice%2C+have+offered+salvation+to+every+man+in+the+world+had+it+been+his+pleasure.+In+the+efficiency%2C+as+every+man+or+any+man+has+fruit+by+the+death+of+Christ%2C+so+Christ+died+for+him.+But+this+is+not+of+one+kind%3A+some+fruit+is+common+to+every+man%3B+for+as+Christ+is+lord+of+all+things+in+heaven+and+earth%2C+even+the+earthly+blessings+which+infidels+enjoy+may+be+termed+fruits+of+Christ%E2%80%99s+death.+Others+proper+to+the+members+of+the+visible+Church%2C+and+common+to+them%2C+as+to+be+called+by+the+word%2C+enjoy+the+ordinances+of+grace%2C+live+under+the+covenant%2C+partake+of+some+graces+that+come+from+Christ%2C+which%2C+through+their+fault%2C+be+not+saving%3B+and+in+this+sense+Christ+died+for+all+that+be+under+the+covenant.+But+other+fruits+of+Christ%E2%80%99s+death%2C+according+to+the+will+of+God+and+intention+of+Christ+as+Mediator%2C+be+peculiar+to+the+sheep+of+Christ%2C+his+brethren%2C+them+that+be+given+unto+him+of+the+Father%2C+as+faith+unfeigned%2C+regeneration%2C+pardon+of+sin%2C+adoption%2C+etc.%3B+and+so+they+hold+Christ+died+efficiently+for+his+people+only%2C+in+this+sense%2C%E2%80%93namely%2C+so+as+to+bring+them+effectually+to+faith%2C+grace%2C+and+glory.%E2%80%9D%

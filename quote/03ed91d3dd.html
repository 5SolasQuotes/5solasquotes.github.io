<main class="wrap"><figure class="quote" id="q-03ed91d3dd" data-kw="">
<blockquote><p>Christ is Light of himself, and originally; he is the Fountain and everlasting Spring of all the Light of Grace and Glory, both in Heaven and Earth; He is called, The Sun of Righteousness. The Sun, you know, hath his Light rooted in his own fair Body, and receives that from none other; and with that, he enlightens the Moon, the Stars, the Air, the Earth, &amp; all the World: Even so the blessed Son of God, the Sun of Righteousness, hath in himself, and from himself, the Light of all Wisdom and Knowledge, Mercy and Comfort; and from him floweth and springeth whatsoever Light of Glory is revealed unto his blessed Saints and Angels in Heaven, or whatsoever Light of Grace is shed into the hearts of his sons and servants here upon Earth.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/robert-bolton.html">Robert Bolton</a></span><span class="wk"><span class="lbl">Work:</span> <cite>A three-fold treatise containing the saints’ sure and perpetual guide. Self-enriching examination. Soul-fattening fasting. Or, meditations, concerning the word, the sacrament of the Lord’s Supper, and fasting</cite>, (London: E. Purslow, 1634), p. 16.</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/creation.html">Creation</a></span></div>

<blockquote><p>Sciences are differentiated according to the various means through which knowledge is obtained. For the astronomer and the physicist both may prove the same conclusion: that the earth, for instance, is round: the astronomer by means of mathematics (i.e. abstracting from matter), but the physicist by means of matter itself.</p></blockquote>

</figure><figure class="quote" id="q-9cd64d98f7" data-kw="">
<blockquote><p>‘In the beginning God created.’ It is absolutely necessary that things begun in time be also brought to an end in time. If they have a beginning in time, have no doubt about the end. Really, to what end are geometry and arithmetical investigations, the diligent study of solids and the much-discussed astronomy all very laborious vanity directed, if those who pursue them have believed that this visible world is co-eternal with God, the Creator of all things; if they attribute to a circumscribed world which possesses a material body the same glory as to the limitless and invisible Nature; and if they are not able to understand even this much, that the whole of anything whatsoever, whose parts are subject to corruption and change, must also at some time submit to the same changes as its parts?

But, to such an extent ‘they have become vain in their reasonings, and their senseless minds have been darkened, and while professing to be wise, they have become fools’ that some have declared that heaven is co-existent with God from eternity; others, that it is God Himself without beginning and without end, and that it is responsible for the arrangement of every individual thing.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/st-basil.html">Basil of Caesarea</a></span><span class="wk"><span class="lbl">Work:</span> <cite>On the Hexaemeron</cite>, (379), 1.3 in Saint Basil’s Exegetic Homilies, trans. Agnes Clare Way in The Fathers of the Church: A New Translation, Volume 46 (Washington DC, 1963), pp 7-8.</span></figcaption>

<blockquote><p>4. Newness of being is essential to it [created being], or of its notion…

5. As also assiduous dependence on the First Being and containment or inexistence in it. But its being in God is threefold: eminent, ideal, intelligible. In that way it is in his power as in an efficient cause, conserving and governing: in that [ideal way] in the idea as in an exemplary cause: in this [intelligible way] in knowledge as in the knower, the most beautiful Himself bearing the beautiful world in mind, etc., Boethius sings. And divinely the apostle, Acts 17: ‘In Him we live, and move, and are:’ and, τοῦ γὰρ καὶ γένος ἐσμέν, as the apostle [cites] there from Aratus. [This is] Against Durandus and those of whom Augustine makes mention, bk. 5, On the Literal Meaning of Genesis, who denied concourse.</p></blockquote>

<blockquote><p>§XLVI. From the soul and body joined consists man, Adam, whom Isaac Peyrerius, a Frenchman and founder of the Pre-Adamites, denied to be the first man, against the consensus of theologians. He imagines two Adams, of whom the first, whose formation is described in Gen. 1:26 ff., was the sower of the gentiles, the Pre-Adamites; the latter, whose formation is related in Gen. 2:7-15 ff., was the author and father of the Jews. But the origin of the same Adam is narrated in both places: (1) Because in both places the same name occurs and the same reason for the name is given, namely, production from the earth; which could not happen if two different men were being discussed. (2) If two were being discussed, it could be doubted of the latter whether he was created in the image of God, or whether he was endowed with a rational soul, because the breathing-in of the soul is read to have happened only in ch. 2:7. (4) Because of the same ones to whom it was commanded in ch. 1:28, “Increase and multiply,” it is also said in ch. 2:24, “a man shall leave his father and mother, and shall cleave unto his wife: and they shall be two in one flesh.” (see Mt. 19:45). (5) Because to the same ones was given dominion over the animals (ch. 1:28 and ch. 2:19). (6) Because, before Adam was created, there was no one to cultivate the earth (Gen. 2:5). (7) Because in 1 Cor. 15:45-47, Adam is called the “first man,” “made a living soul,” the “first… of the earth, earthy.” Hence in Wisdom 7:1 and ch. 10:1, he is called the “first father of the world,” “created alone.</p></blockquote>

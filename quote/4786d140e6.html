<main class="wrap"><figure class="quote" id="q-4786d140e6" data-kw="">
<blockquote><p>God calleth himself to Moses, I am, and, I am that I am, as the fountain of being, and being by nature, and the alone infinite, only wise, happy being, as all Scriptures clear, Creatures, even Angels are in their essence, but time-dependencies, created results of God, Lame-nothings, frothy yesterday start-ups, poor time-accidents, branches budding out of mere mother-nothing, by the alone will and goodness of God, there was folly found in these Sons of the morning, the head-pieces and master-creatures, the Angels, Job 40.18, 19. …

[N]othing is a being of itself, by heritage, essentially, and without dependence on another, as its father, cause, Author, Creator, but God; and nothing lives, worketh, doth good, independently, infinitely, immutably, from and of itself, but God only. And all Creatures, Angels, and Men, are but borrowed beings, beings by adoption, gift, loan, and little shadows, remaining shadows, by the essence, goodness, and free pleasure of God.

And as their being is dependent, so are they God’s dependent tools, and instruments of working, they do, and do good, but dependently and so as both power and actual doing, and doing good is from God principally, by moving, exciting, and determinating them to do, and from, ego, egoitas, ipseitas, from themselves actively as instruments and tools in God’s hand, if the creature seek a world of its own, in being and working without God, that egoitas, that I, that my self, is the great Lord of pride, but otherwise the creature is not in its essence God.

There was a comparative self-denial required in Adam, and is in the man Christ and the elect Angels, though no sinful self was in any of these three, and it is that the sinless creature should yield its being, lust, will and desires, rather to be trampled on, despised, or turned to nothing, before God be dishonoured; All the essential attributes of goodness, holiness, wisdom, grace, justice, power, sovereignty, &amp;c. that are all infinite in God, proclaim that there is an infinite distance between the Creature and the Creator, but if we speak of a borrowed being, and a borrowed working, at the second hand, and by loan, then it is no sin, for creatures to say they are creatures, for the Holy Ghost saith it, and biddeth man say, that he is clay, and a living soul, nor is it sin to the Creature to ascribe doing of good to itself, as the Church saith, I have sought thee, O Lord, Isa. 26. and David, I love thee, O Lord; and Paul, I have laboured more abundantly then they all; though it was a labouring borrowed from grace, and sure the Creature acts sin and against a law, and not in subordination to God as Law-giver acting him against a Law.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/samuel-rutherford.html">Samuel Rutherford</a></span><span class="wk"><span class="lbl">Work:</span> <cite>A survey of the spiritual antichrist</cite>, (London: Andrew Crooke, 1648), Part 1.14, pp 165, 166.</span></figcaption>

<blockquote><p>One difference between Libertarian Theology (American Theonomy) and Reformed political theology (Scottish Theonomy) is that the former thinks that the magistrate should not suppress acts of gross immorality, unless it can be proved that the state has been commanded to punish that particular sin (that is why they often conclude that adultery should be punished, but pornography should not be). The Westminster divines, however, would have viewed Libertarian Theology as a system calculated to call down God’s wrath. They recognised that God’s natural-moral law is binding upon society; hence the Kuyperian-inspired attempt to limit the magistrate to punishing a very select range of vices would have been considered contrary to their world-view. In the petition to the Houses of Parliament cited below, we clearly see that they believed the civil ruler was to suppress all public vice lest the wrath of God fall upon the nation:

To the Right honourable the Lords assembled in Parliament.

The humble Message &amp; peticion of the Assembly of Divines.

The Assembly of Divines, in all humility &amp; in discharge of their duty to God &amp; to this Honourable House, do inform your Lordships of the sad Compl[ain]ts brought unto them from many Godly &amp; Reverend Divines in &amp; about London, touching the dayly increase &amp; growth of all manner of outrageous and intollerable abominations, such as are drunkennes, swearing, uncleanenes, &amp; other crying sins in very many places of this Kingdome, for want of Godly and zealous Magistrates to represse the same, which cannot but highly provoke the Lord to more wrath against this Kingdome in this Day of his wrath already broken out upon his people, and render fruitlesse all your pious endeavours for Reformation &amp; the Weale of the Kingdome, unless it bee effectually &amp; speedily cured.

The Assembly therefore humbly prayeth that according to your great wisdome and zeale for the Publique, there may bee a speedy appointing &amp; setling of some able godly prudent Magistrates that may reside in all places of the Kingdome, where your wisdome shall find it necessary, to give a speedy stopp to those high provocacions of Almighty God &amp; the most dangerous supplanters of all our hopes of Good from the Parliament or the Assembly. […]</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/petition.html">Petition</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Letter to both houses of parliament about godly magistrates and an additional scribe 30 November and 18 December 1643 in The minutes and papers of the Westminster Assembly 1643-1652, ed. Chad VanDixhoorn (5 vols, Oxford, 2012), v, 27-8.</cite></span></figcaption>

+more+wrath+against+this+Kingdome+in+this+Day+of+his+wrath+already+broken+out+upon+his+people%2C+and+render+fruitlesse+all+your+pious+endeavours+for+Reformation+%26+the+Weale+of+the+Kingdome%2C+unless+it+bee+effectually+%26+speedily+cured.%0A%0AThe+Assembly+therefore+humbly+prayeth+that+according+to+your+great+wisdome+and+zeale+for+the+Publique%2C+there+may+bee+a+speedy+appointing+%26+setling+of+some+able+godly+prudent+Magistrates+that+may+reside+in+all+places+of+the+Kingdome%2C+where+your+wisdome+shall+find+it+necessary%2C+to+give+a+speedy+stopp+to+those+high+provocacions+of+Almighty+God+%26+the+most+dangerous+supplanters+of+all+our+hopes+of+Good+from+the+Parliament+or+the+Assembly.+%5B%E2%80%A6%5D%E2%80%9D%0A%0A%E2%80%94+Petition%2C+Letter+to+both+houses+of+parliament+about+godly+magistrates+and+an+additional+scribe+30+November+and+18+December+1643+in+The+minutes+and+papers+of+the+Westminster+Assembly+1643-1652%2C+ed.+Chad+VanDixhoorn+%285+vols%2C+Oxford%2C+2012%29%2C+v%2C+27-8.&amp;url=https%3A%2F%2F5solasquotes.github.io%2Fquote%2Fd73bb12b4d.html&amp;via=5Solas" target="_blank" rel="noopener">Share on X</a><a class="perma" href="../quote/d73bb12b4d.html">Permalink</a><a class="src" href="https://reformedcovenanter.wordpress.com/2012/10/12/the-westminster-divines-on-the-duty-of-godly-magistrates-to-suppress-crying-sins/" rel="noopener" target="_blank">Read it online · Reformed Covenanter</a></div>

<main class="wrap"><figure class="quote" id="q-b869d84c47" data-kw="">
<blockquote><p>We hold all who profess faith in Christ to be members of the visible Church, though they be not members of a visible congregation, and that the seals of the Covenant [of Grace] should not be denied to them. And for [the] more full clearing of the question, let these considerations be observed: First Distinction: All believers, as believers, in foro Dei, ‘before God’ have right to the seals of the Covenant [of Grace], these to whom the Covenant and body of the Charter belongs, to these the seal belongs, but in foro Ecclesiastico [in the sight of the Church], and in an orderly Church-way, the seals are not to be conferred by the Church upon persons because they believe, but because they profess their believing: therefore the apostles never baptized pagans, but upon profession of their faith. Second Distinction: Faith in Christ truly gives right to the seals of the Covenant [of Grace], and in God’s intention and decree, called voluntas beneplaciti [will of good-pleasure], they belong only to the invisible Church; but the orderly way of the Churches’ giving the seals is because such a society is a professing or visible Church, and [the] orderly giving of the seals according to God’s approving will, called, voluntas signi et revelata [the signified and revealed will], belongs to the visible Church. Third Distinction: The Church may orderly and lawfully give the seals of the Covenant to those to whom the Covenant and promises of grace do not belong in God’s decree of election. Fourth Distinction: The Church may lawfully add to the Church visible such as God adds not to the Church invisible, as they may add Simon Magus; and the Church may lawfully cast out of the visible Church, such as Christ has not cast out of the invisible Church, as the Church may excommunicate regenerate persons for scandalous sins. Fifth Distinction: Then the regenerate-excommunicated have right to the seals of the Covenant, as they have to the Covenant, and yet the Church does lawfully debar them, hic et nunc [here and now], in such a scandalous case, from the seals of the Covenant. We hold that those who are not members of a particular congregation may lawfully be admitted to the seals of the Covenant: First, Because those to whom the promises are made, and profess the Covenant, these should be baptized. But men of approved piety are such, though they be not members of a particular parish. The proposition is Peter’s argument, Acts 2:38. Secondly, Those who are not members of a particular church may be visible professors, and so members of a visible Church. Therefore, the seals of the Covenant belong to them. Thirdly, The contrary opinion has no warrant in God’s Word. Fourthly, The apostles required no more of those whom they baptized but profession of belief, as Acts 10:47, ‘Can any forbid water that these should not be baptized, who have received the Holy Ghost, as well as we?’ Acts 8:37, ‘If thou believest with all thy heart, thou mayest be baptized:’ no more is sought of the jailor, Acts 16:31,34.</p></blockquote>

<blockquote><p>10th Question: Is the profession of faith and promise—that is, this sacred covenant—required to be confirmed by solemn oath and subscription? Response: Conclusion: This is not simply, nor everywhere or always, necessary; nor does apostolic practice teach this. For it could ordinarily suffice if that solemn promise is made in the presence of the whole Church, or before a synod with many witnesses. Especially when it pertains to matters of God, before his eyes and in his house, namely the Church. An oath is the end of all contradiction, introduced because of human wickedness. Because we must greatly distance ourselves from the evil practice of Papal clerics, who too rashly confirm their causes with dire oaths, curses, and the pledging of souls. Because it is proper for the faithful to be earnest, sincere, and simple, like sheep and doves. Therefore, care must be taken that this abundant caution does not, in some way, seem to cast doubt on their proper fourth way. Conclusion: Nevertheless, it is not illicit to take extra caution, whether for adversaries, or for extraordinary wickedness, frauds and deceptions of men, or for any other just cause. Because, in the renewal and restatement of the sacred covenant, such was done (see 2 Chron. 15:12-15; Neh. 9:38 and 10:1). Therefore, why could this not be done in some case at the first institution of the covenant? Because an oath may be declaratory and promissory in the matter of confession, profession of faith, and embracing the Church and its cause, as Paul’s example teaches (see 2 Cor. 1:23; Rom. 9:1). This, combined with the example of God’s people (see 2 Chron. 15; Neh. 9-10), was imitated by the king and nobility in Scotland in 1581, and by the French Church in the National Synod of Alès in 1619, where they received and confirmed the doctrine of the National Synod of Dordrecht against today’s Pelagians. Furthermore, in Scotland in 1638 and recently in 1643, the nobility, ministers, and people in Scotland and England were united in a solemn confederation. Here, compare what has been said elsewhere about the pledging of souls for their doctrine and cause, and about oaths in public form or church confessions. Part 3, Selected Dissertation on the Oath of Religion. Because not only are oral declarations before the whole Church required, but also subscriptions by the ordinary ministers, elders, and deacons among us are not without reason expected… …it would not be absurd or illicit if, in some case, and for the reasons previously mentioned, a subscription from the members of the Church were required. 4. Because oaths and subscriptions hold a significant place in any confederations and assemblies, and why not in sacred and ecclesiastical matters, if necessity demands it. Conclusion: We reject here oaths of obedience to the Pope, those concerning the Council of Trent; also, the abjurations of reformed doctrine and Church; furthermore, inquisitorial oaths and those arising ex officio [“from duty” unto self-incrimination]. In brief, all oaths and all sacred subscriptions that are not made in injustice, but in truth and judgment.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/gisbert-voetius.html">Gisbert Voetius</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Ecclesiastical Politics</cite>, tr. by AI (Amsterdam: Joannes à Waesberge, 1663–1676), vol. 1, ‘The Nature of the Instituted Church’, pp. 52-53 (PDF pp. 49-50)</span></figcaption>

Chron.+15%3B+Neh.+9-10%29%2C+was+imitated+by+the+king+and+nobility+in+Scotland+in+1581%2C+and+by+the+French+Church+in+the+National+Synod+of+Al%C3%A8s+in+1619%2C+where+they+received+and+confirmed+the+doctrine+of+the+National+Synod+of+Dordrecht+against+today%E2%80%99s+Pelagians.+Furthermore%2C+in+Scotland+in+1638+and+recently+in+1643%2C+the+nobility%2C+ministers%2C+and+people+in+Scotland+and+England+were+united+in+a+solemn+confederation.+Here%2C+compare+what+has+been+said+elsewhere+about+the+pledging+of+souls+for+their+doctrine+and+cause%2C+and+about+oaths+in+public+form+or+church+confessions.+Part+3%2C+Selected+Dissertation+on+the+Oath+of+Religion.+Because+not+only+are+oral+declarations+before+the+whole+Church+required%2C+but+also+subscriptions+by+the+ordinary+ministers%2C+elders%2C+and+deacons+among+us+are+not+without+reason+expected%E2%80%A6+%E2%80%A6it+would+not+be+absurd+or+illicit+if%2C+in+some+case%2C+and+for+the+reasons+previously+mentioned%2C+a+subscription+from+the+members+of+the+Church+were+required.+4.+Because+oaths+and+subscriptions+hold+a+significant+place+in+any+confederations+and+assemblies%2C+and+why+not+in+sacred+and+ecclesiastical+matters%2C+if+necessity+demands+it.+Conclusion%3A+We+reject+here+oaths+of+obedience+to+the+Pope%2C+those+concerning+the+Council+of+Trent%3B+also%2C+the+abjurations+of+reformed+doctrine+and+Church%3B+furthermore%2C+inquisitorial+oaths+and+those+arising+ex+officio+%5B%E2%80%9Cfrom+duty%E2%80%9D+unto+self-incrimination%5D.+In+brief%2C+all+oaths+and+all+sacred+subscriptions+that+are+not+made+in+injustice%2C+but+in+truth+and+judgment.%E2%80%9D%0A%0A%E2%80%94+Gisbert+Voetius%2C+Ecclesiastical+Politics+tr.+by+AI+%28Amsterdam%3A+Joannes+%C3%A0+Waesberge%2C+1663%E2%80%931676%29%2C+vol.+1%2C+%E2%80%98The+Nature+of+the+Instituted+Church%E2%80%99%2C+pp.+52-53+%28PDF+pp.+49-50%29&amp;url=https%3A%2F%2F5solasquotes.github.io%2Fquote%2F4441258a37.html&amp;via=5Solas" target="_blank" rel="noopener">Share on X</a><a class="perma" href="../quote/4441258a37.html">Permalink</a><a class="src" href="https://reformedbooksonline.com/topics/topics-by-subject/the-church/church-membership#:~:text=10th%20Question%3A%20Is%20the%20profession%20of,injustice%2C%20but%20in%20truth%20and%20judgment&amp;text=10th%20Question%3A%20Is%20the%20profession%20of%20faith%20and&amp;text=made%20in%20injustice%2C%20but%20in%20truth%20and%20judgment" rel="noopener" target="_blank">Read it online · Reformed Books Online</a></div>

</figure><figure class="quote" id="q-d4defa13d0" data-kw="">
<blockquote><p>Profession of Christianity is every man’s Church-title. No man is to prove the sincerity of his own profession; nor may the Church require such proof at his hands; For how can a man prove to another the sincerity of his own heart? But the fuller testimony he gives of it, the better it is: And therefore none should refuse to make his own profession, as fully credible to the church as he is able; nor is the church to be blamed for enquiring after the fullest credibility, so be it they do it but ad melius esse [to the better existence], and not ad esse [to the existence of it]; not laying his title upon it, nor refusing him for want [lack] of it. But every profession as such is credible in some degree, which is not disproved. Because men are, under God, the only competent judges of their own hearts: and the belief of one another is the ground of human converse: And it is an injury to any man to account him a liar, without sufficient proof. He that will disprove a man’s profession must prove first that he does not tolerably understand what he says; secondly, or that he speaks not seriously, but in jest; or not voluntarily, but in hypocrisy by constraint, or for some by end: Thirdly, or that he contradicts his own words by some more credible words or deeds. And if you never yet thus disproved men’s profession of Christianity before the pastors of the church and yet cry out against the pastors for admitting them, you are not true reformers, but disorderly mutineers and peevish censurers in the Church of Christ. Christ’s orders and men’s right, and all church-justice, must not be trodden down and sacrificed to your humor and arbitrary way.</p></blockquote>

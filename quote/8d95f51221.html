<main class="wrap"><figure class="quote" id="q-8d95f51221" data-kw="">
<blockquote><p>…for the power is either a power to rule according to God’s law, as he is commanded (Dt. 17) and this is the very office or official power which the King of kings has given to all kings under him, and this is a power of the royal office of a king, to govern for the Lord his Maker; or this is a power to do ill and tyrannize over God’s people; but this is accidental to a king and the character of a tyrant, and is not from God… If then the judge and the king be both lawful ordinances, and if they differ essentially, as Barclay [a Romanist] says, then that specific form which distinguishes the one from the other [according to Barclay], to wit, domination and a power to destroy the subject, must be from God; which is blasphemous: for God can give no moral power to do wickedly; for that is licence, and a power to sin against a law of God, which is absolutely inconsistent with the holiness of God; for so the Lord might deny Himself, and dispense with sin. God avert such blasphemies!</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/samuel-rutherford.html">Samuel Rutherford</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Lex Rex</cite>, … (1644; Edinburgh: Ogle, 1843), p. 72 rt col top</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/civil-government-and-society/resistance-to-tyranny-and-lawful-authority.html">Resistance to Tyranny and Lawful Authority</a></span></div>

</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-4abf76940e" data-kw="">
<blockquote><p>Assertion 2 – This title by conquest, through the people’s after consent, may be turned into a just title, as in the case of the Jews in Caesar’s time, for which cause our Savior commanded to obey Caesar, and to pay tribute unto him, as Dr. Ferne [a royalist] confesses, (sec. vii, p. 30)… …2. Though the consent be some way over-awed [by intimidation], yet is it a sort of contract and covenant of loyal subjection made to the conqueror, and therefore sufficient to make the title just; otherwise, if the people never give their consent, the conqueror, domineering over them by violence, has no just title to the crown.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/samuel-rutherford.html">Samuel Rutherford</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Lex Rex</cite>, Question 12, ‘Whether or not a Kingdom may Lawfully be Purchased by the Sole Title of Conquest?’, p. 47</span></figcaption>

</figure><figure class="quote" id="q-900ae0fb00" data-kw="">
<blockquote><p>XVII. The consideration of this, that magistracy is an ordinance of the only wise God, and that such as are in authority are warranted of Him, and have commission from Him, should move Christians to carry themselves under them in the exercise of their power, as loyal, dutiful subjects, whatever their persons be, tho’ heathens and strangers to Christ, and enemies to his kingdom; for He would have the Christian Romans live in subjection unto their heathen magistrates, emperors, consul or senate, upon this motive, that there is no power but of God; and the powers that be, are ordained of God [Rom. 13].</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/john-brown-of-wamphray.html">John Brown of Wamphray</a></span><span class="wk"><span class="lbl">Work:</span> <cite>An Exposition of Romans</cite>, (Edinburgh: Paterson, 1766), ch. 13, p. 505 Wamphray was an influential and leading Scottish covenanter.</span></figcaption>

</figure><figure class="quote" id="q-4a048d1f58" data-kw="">
<blockquote><p>Tis certainly as much a Treason and Rebellion against this constitution, and the known Laws, in a Prince to endeavour to break through them, as ’tis in the People to rise against him, whilst he keeps within their Bounds and does his Duty. Our Constitution is a Government of Laws, not of Persons. Allegiance and Protection are Obligations that cannot subsist separately; when one fails, the other falls of Course. The true Etymology of the word ‘Loyalty’ (which has been so strangely wrested in the late Reigns ) is an entire Obedience to the Prince in all his Commands according to Law; that is, to the Laws themselves, to which we owe both an active and passive Obedience. By the old and true Maxim, that the King can do no Wrong, no body is so foolish as to conclude, that he has not strength to murder, to offer violence to women, or power enough to dispossess a man wrongfully of his Estate, or that whatever he does (how wicked soever) is just: but the meaning is, he has no lawful Power to do such things; and our Constitution considers no power as irresistible, but what is lawful.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/francis-hotman.html">Francis Hotman</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Franco-Gallia: Or an Account of the Ancient Free State of France and most other Parts of Europe before the Loss of their Liberties</cite>, 1573 | From the Translator’s Preface:</span></figcaption>

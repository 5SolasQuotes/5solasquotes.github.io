<blockquote><p>Argument 4 — [If the king properly owned all of his subjects’ property, then] Subjects under a monarch could not give alms, nor exercise works of charity, for charity must be my own, Isa. 58:7, “Is it not to deal thy bread to the hungry;” etc; Eccl. 11:1, “Cast thy bread upon the waters;” and the law says, “It is theft to give of another man’s to the poor;”…</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/samuel-rutherford.html">Samuel Rutherford</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Lex Rex... (1644; Edinburgh: Ogle, 1843)</cite>, p. 68 lt col bot</span></figcaption>

<blockquote><p>77. It is certain that we must attempt nothing in all our actions whereof we are not certain that it pleases God: whatsoever is done otherwise, does make us guilty before God. The apostle says, ‘Blessed is he that condemneth not himself in that which he alloweth.’ Whereupon it comes to pass that he that judges and condemns anything, and yet admits it, or puts it in practice, he is damned [condemned], because he does it not of faith. 78. Conscience has that virtue and power that if some work being of it own nature indifferent, if the conscience be good, it makes the work also to be good: and contrariwise, if the conscience be evil, it makes the work also evil. 79. But yet nevertheless it cannot be that any work, being evil in its own nature, may by our conscience be made good. For whatsoever conscience thou hast, yet when thou doest forswear thyself, or when thou committest adultery, thou doest grievously sin. Wherefore the force of conscience has power only in things indifferent, and also in those actions, which of their own nature are good. 80. And amongst these things, somewhat may seem to be against a man’s conscience, or unlawful two ways. First, uncertainly and doubtfully, without full assent, persuasion or resolution; namely, when a man doubts or is uncertain, whether something be lawful, or not. Secondly, determinately and absolutely with a resolved persuasion, to wit, when a man is certainly persuaded that something is simply lawful, albeit by error of conscience, or upon false and erroneous grounds. 81. If anything appears to be unlawful unto a man uncertainly and doubtfully, he is to abstain from doing of it of himself, so long as he is at his owne free choice and liberty, till his doubts be removed.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/gabriel-powel.html">Gabriel Powel</a></span><span class="wk"><span class="lbl">Work:</span> <cite>De adiaphoris, Theological &amp; Scholastical Positions concerning the Nature &amp; Use of Things Indifferent… (London, 1607), ch. 11, ‘A Solution of the Objections opposed by the Refractary Ministers’, p. 86 Powel (baptised 1576–1611) was a Welsh Anglican minister.</cite></span></figcaption>
<div class="meta"><span class="t"><a href="../topics/the-christian-life/christian-liberty-and-conscience.html">Christian Liberty and Conscience</a></span></div>

</figure><figure class="quote" id="q-d1674f7d7e" data-kw="">
<blockquote><p>The mentioning of these two duties meeting together at one time in our practise does not intend that they do both of them bind the conscience at the same instant, but they are called duties as they are considered apart; being both works are commanded of God in two several commandments: Which two works being duties considered apart, do sometimes offer themselves to our practise at one instant; As to hear a sermon at the church on the Sabbsth, and to tend a sick person ready to die at home at the same time, both are duties being considered apart, but meeting together, and offering themselves to our practise at one time, there is indeed but one duty, because both cannot be performed in one instant; In which case the greater work is the duty, the lesser binds not for that present…</p></blockquote>

</figure><figure class="quote" id="q-46ea3c98db" data-kw="">
<blockquote><p>3. Magistrates as magistrates hold forth in their Law abstinence from these sins [of adultery, incest, murder, etc.], not as the ambassadors of Christ, craving subjection of conscience and divine faith to those charges, but only external obedience: For though ministers as ministers crave faith and subjection of conscience to all commandments and inhibitions, as in Christ’s stead, 2 Cor. 5:19-20, yet the magistrate as the magistrate does not crave either faith or subjection of conscience, nor is he in Christ’s stead to lay divine bands on the conscience to submit the soul and conscience to believe and abstain; he is the deputy of God as the God of Order and as the Creator, and Founder, and another of human societies and of peace, to exact external obedience and to lay bands on your hands, not to shed innocent blood, and on your body not to defile it with adultery or incest, nor to violate the chastity of your brother; Hence it is evident that the adversaries are far out who would have ministers who do hold forth commands that lay hold on the conscience and crave faith and soul-submission under the pain of eternal wrath, to do and act as the deputies and vicars of those who have nothing to do with the conscience [such as prelates who simultaneously held civil offices], and have neither office nor authority to crave soul submission or to threaten or inflict any punishment but such as is circumscribed within the limits of time and which the body of clay is capable of; yea, when the magistrate punishes spiritual sins, heresy, idolatry, he punishes them only with temporary punishment.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/samuel-rutherford.html">Samuel Rutherford</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Divine Right of Church Government… (1646)</cite>, pp. 550-51</span></figcaption>

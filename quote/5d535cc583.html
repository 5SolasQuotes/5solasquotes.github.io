<blockquote><p>Popery requires allegiance, in its highest degree, to the Roman Pontiff, thereby rendering undivided allegiance to the British Sovereign absolutely impossible. A Papist cannot be a true and trustworthy British citizen.

The peculiar constitution of the Romish system forms a distinction between it and all true Christian Churches; for since the Pope, its supreme head, is both ecclesiastically a priest and civilly a king, the allegiance which the members of that system are bound to render him is not, and cannot be merely ecclesiastical, but must be civil also, and consequently incompatible with supreme allegiance to any other sovereign.

To whatsoever extent the allegiance due to the Pope constrains a Papist to hold principles and be ready to perform acts contrary to British law, to that extent he is not and cannot become a British citizen. And since it is necessarily possible that the Papal claim may in any special emergency be so put forth as to constrain its adherents to engage in acts of direct hostility against the Government, it must be possible that he may at any moment, become not only not a true British citizen, but a direct enemy.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/william-hetherington.html">William Hetherington</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Toleration, or The Law of Religious Liberty in J. A. Wylie (ed.), Ter-Centenary of the Scottish Reformation, as Commemorated at Edinburgh, August 1860</cite></span></figcaption>
<div class="meta"><span class="t"><a href="../topics/civil-government-and-society.html">Civil Government and Society</a></span></div>

 target="_blank">Read it online · Reformed Covenanter</a></div>
</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-29c5cb36c2" data-kw="">
<blockquote><p>Now there were three kinds of laws given through Moses – the moral law, which lays down man’s duty towards God and his neighbour – the ceremonial, which lays down the rites or ceremonies of the religion observed under the Old Testament – the judicial, which established the civil government of the Jewish people. The moral law had respect to the Israelites as men; the ceremonial respected them, as under the Old Testament, waiting for the promised Messiah; the judicial, as a peculiar people.

There is a very great difference between these three laws. The moral law is founded, at least in a very great measure, on the natural right of God; by which we mean that which rests upon the most pure and holy nature of God himself; for instance, this precept, which is the sum of the law, – Thou shalt love the Lord thy God, is founded on the very nature of God; otherwise God could command himself, who is the supreme good, to be hated.

Whereas other laws are founded on the positive right of God, by which we mean that which depends on the mere will and pleasure of God. This law is known from nature; hence the Gentiles themselves were not ignorant of it, although it was far more clearly known when divinely revealed. The ceremonial law does not come under the natural understanding of man; and as to the judicial law, although in its general precepts it is founded on natural reason, yet with regard to its particular conclusions it depends entirely on the will of God.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/benedict-pictet.html">Benedict Pictet</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Christian Theology</cite>, trans. Frederick Reyroux (1696; London, 1834), 6.2, pp 259-60.</span></figcaption>

</figure><figure class="quote" id="q-95d94da83a" data-kw="">
<blockquote><p>Josiah … did not only restore the religion, but did further destroy all monuments of idolatry which of long time had remained … not only in Judah, but also in Bethel where Jeroboam had erected his idolatry. Yea, he further proceeded and did kill the priests of the high places who were idolaters and had deceived the people; he did kill them, I say, and did burn their bones upon their own altars, and so returned to Jerusalem. This reformation made Josiah, and for the same obtained this testimony of the Holy Ghost, that neither before him neither after him was there any such king who returned to God with his whole soul and with all his strength according to all the law of Moses.

Of which histories it is evident that the reformation of religion in all points, together with the punishment of false teachers, doth appertain to the power of the civil magistrate. For what God required of them, His justice must require of others having the like charge and authority; what He did approve in them, He cannot but approve in all others who with like zeal and sincerity do enterprise to purge the Lord’s temple and sanctuary. What God required to them, it is before declared, to wit, that most diligently they should observe His law, statutes and ceremonies.

[…] And therefore of necessity it is speedily ye provide for reformation or else ye declare yourselves not only void of love towards your subjects, but also to live without care of your own salvation, yea, without all fear and true reverence of God.</p></blockquote>

</figure><figure class="quote" id="q-4a048d1f58" data-kw="">
<blockquote><p>Tis certainly as much a Treason and Rebellion against this constitution, and the known Laws, in a Prince to endeavour to break through them, as ’tis in the People to rise against him, whilst he keeps within their Bounds and does his Duty. Our Constitution is a Government of Laws, not of Persons. Allegiance and Protection are Obligations that cannot subsist separately; when one fails, the other falls of Course. The true Etymology of the word ‘Loyalty’ (which has been so strangely wrested in the late Reigns ) is an entire Obedience to the Prince in all his Commands according to Law; that is, to the Laws themselves, to which we owe both an active and passive Obedience. By the old and true Maxim, that the King can do no Wrong, no body is so foolish as to conclude, that he has not strength to murder, to offer violence to women, or power enough to dispossess a man wrongfully of his Estate, or that whatever he does (how wicked soever) is just: but the meaning is, he has no lawful Power to do such things; and our Constitution considers no power as irresistible, but what is lawful.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/francis-hotman.html">Francis Hotman</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Franco-Gallia: Or an Account of the Ancient Free State of France and most other Parts of Europe before the Loss of their Liberties</cite>, 1573 | From the Translator’s Preface:</span></figcaption>

<div class="actions"><button class="copy" data-copy="“Tis certainly as much a Treason and Rebellion against this constitution, and the known Laws, in a Prince to endeavour to break through them, as ’tis in the People to rise against him, whilst he keeps within their Bounds and does his Duty. Our Constitution is a Government of Laws, not of Persons. Allegiance and Protection are Obligations that cannot subsist separately; when one fails, the other falls of Course. The true Etymology of the word ‘Loyalty’ (which has been so strangely wrested in the late Reigns ) is an entire Obedience to the Prince in all his Commands according to Law; that is, to the Laws themselves, to which we owe both an active and passive Obedience. By the old and true Maxim, that the King can do no Wrong, no body is so foolish as to conclude, that he has not strength to murder, to offer violence to women, or power enough to dispossess a man wrongfully of his Estate, or that whatever he does (how wicked soever) is just: but the meaning is, he has no lawful Power to do such things; and our Constitution considers no power as irresistible, but what is lawful.”

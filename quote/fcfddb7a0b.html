<main class="wrap"><figure class="quote" id="q-fcfddb7a0b" data-kw="Author of sin|Permission" data-pol="">
<blockquote><p>God doth not infuse the lust, or excite it, though he doth present the object about which the lust is exercised. God delivered up Christ to the Jews, he presented him to them, but never commanded them to crucify him, nor infused that malice into them, nor quickened it; but he, seeing such a frame, withdrew his restraining grace, and left them to the conduct of their own vitiated wills. … God created the grape, and filled the vine with a sprightliness, but he doth never infuse a drunken frame into a man, or excite it. … In short, though it be by God&#x27;s permission that we can do evil, yet it is not by his inspiration that we will to do evil; that is wholly from ourselves.</p></blockquote>
<figcaption>— <a href="../authors/stephen-charnock.html">Stephen Charnock</a>, <cite>A Treatise on Divine Providence</cite></figcaption>

</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-12a63f8296" data-kw="Author of sin|Depravity" data-pol="">

<figcaption>— <a href="../authors/francis-turretin.html">Francis Turretin</a>, <cite>Institutes of Elenctic Theology</cite>, 6.7.15</figcaption>

</figure><figure class="quote" id="q-a923204566" data-kw="Permission|Author of sin|The Fall" data-pol="">
<blockquote><p>God acted nothing, but only ceased to act, and therefore could not be the efficient cause of man’s sin. As God is not the author of good but by willing and effecting it, so he is not the author of evil but by willing and effecting it. But he doth not positively will evil, nor effect it by any efficacy of his own. Permission is no action, nor the cause of that action which is permitted, but the will of that person who is permitted to do such an action is the cause.</p></blockquote>
<figcaption>— <a href="../authors/stephen-charnock.html">Stephen Charnock</a>, <cite>The Existence and Attributes of God</cite>, Discourse on the Holiness of God</figcaption>
<div class="meta"><a class="tag" href="../topics/decrees-and-providence/permission-and-hardening.html">Permission &amp; Hardening</a><a class="tag" href="../topics/decrees-and-providence/god-and-evil.html">God &amp; Evil</a><a class="tag" href="../topics/fall-and-sin/the-fall.html">The Fall</a><a class="tag" href="../topics/fall-and-sin/original-sin.html">Original Sin &amp; Imputation</a></div>

</figure><figure class="quote" id="q-52550c975a" data-kw="Hardening|Author of sin" data-pol="">
<blockquote><p>When God is here spoken of as hardening some of the children of men, it is not to be understood that God by any positive efficiency hardens any man&#x27;s heart. There is no positive act in God, as though he put forth any power to harden the heart. To suppose any such thing would be to make God the immediate author of sin. God is said to harden men in two ways: by withholding the powerful influences of his Spirit, without which their hearts will remain hardened, and grow harder and harder; in this sense he hardens them, as he leaves them to hardness. And again, by ordering those things in his providence which, through the abuse of their corruption, become the occasion of their hardening.</p></blockquote>
<figcaption>— <a href="../authors/jonathan-edwards.html">Jonathan Edwards</a>, <cite>God&#x27;s Sovereignty</cite>, sermon on Romans 9:18</figcaption>
<div class="meta"><a class="tag" href="../topics/decrees-and-providence/permission-and-hardening.html">Permission &amp; Hardening</a><a class="tag" href="../topics/decrees-and-providence/god-and-evil.html">God &amp; Evil</a><a class="tag" href="../topics/decrees-and-providence/providence.html">Providence &amp; Government</a></div>

</figure><figure class="quote" id="q-19b30684ec" data-kw="Permission|Author of sin" data-pol="">
<blockquote><p>He wills it not by his effective will, but by his permissive will; and therefore cannot be chargeable with being the author of sin; since there is a wide difference between doing it himself, and doing it by others, or ordering it to be done, which only can make him the author of sin; and voluntarily permitting or suffering it to be done by others.</p></blockquote>
<figcaption>— <a href="../authors/john-gill.html">John Gill</a>, <cite>A Body of Doctrinal Divinity</cite>, bk. 1, ch. 11 (Of the Will of God)</figcaption>

<main class="wrap"><figure class="quote" id="q-653d7cb5f9" data-kw="">
<blockquote><p>It appertains to the policy of the church to appoint the times when the sacraments shall be ministered. Baptism may be ministered whensoever the word is preached; but we think it more expedient that it be ministered upon the Sunday, or upon the [mid-week] day of prayers, only after the sermon; partly to remove this gross error by the which many deceived think that children are damned if they die without baptism; and partly to make the people assist the administration of that sacrament with greater reverence than they do. For we do see the people begin already to wax weary by reason of the frequent repetition of those promises.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/first-scottish-book-of-discipline.html">First Scottish Book of Discipline</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Other citations (work not named)</cite>, 9th Head, Concerning the Policy of the Church</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/the-sacraments-in-general/minister-and-intention.html">Minister and Intention</a></span></div>

</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-cf88aec55f" data-kw="">
<blockquote><p>Many and weighty reasons move me to think that the Lord’s Supper ought not to be denied to the sick. Meanwhile, I see how very easily this practice has fallen into many abuses, which ought prudently and diligently to be prevented. For unless there be a true communion, it departs wrongly from the sacred institution of Christ. Therefore, there ought to be some gathering of persons — of relatives, friends, and neighbors — so that the distribution may be made according to the command of Christ; then the action should be joined with an explanation of the mystery, and nothing should be done that differs from the ordinary order of the Church. To carry it about here and there indiscriminately is also very dangerous. And here it is most difficult to guard against the danger, lest superstition move some, and ambition or vain display move others, to request it. Therefore there is need of judgment and discretion, that it be given to none except in great peril of life. To bring bread from the temple as if it were sacred is a perverse inversion; and to carry it in procession is in no way to be tolerated.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/john-calvin.html">John Calvin</a></span><span class="wk"><span class="lbl">Work:</span> <cite>‘On the Question of some Ecclesiastical Rites’</cite>, (1561) in Opera, vol. 10, pt. 1, Consilia, col. 213 tr. ChatGPT-5</span></figcaption>

</figure><figure class="quote" id="q-1dc5a90de5" data-kw="">
<blockquote><p>But dost thou think that nothing ought to be determined concerning the place [for baptism]? Answer: Yea, seeing all things must be done in the Church comely and in order: and forasmuch as baptism is a part of the ministry of the Gospel, I think that one and the same place is to be used both for the Word and sacraments, so as baptism be ministered in the public congregation of the Church and with common prayer [mid-week], neither will I rashly admit those, I cannot tell what, cases of necessity, that some allege to the contrary.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/theodore-beza.html">Theodore Beza</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Other Part of Christian Questions &amp; Answers, which is concerning the Sacraments</cite>, … (London, 1580), 151st Question</span></figcaption>

</figure><figure class="quote" id="q-2a2fa673ee" data-kw="">
<blockquote><p>In the time of Justin the Deacon some did carry that which was left of the Communion, at what time the Lord’s Supper was celebrated, to them which were absent by reason of their disease, from the public assembly or unto strangers, and outlandish bishops into their inn. And as Eusebius reports (Church History, Ch. 5, bk. 24), the bishop of Rome was wont to do so, but without superstition, and for no other end but for a token of concord and consent in doctrine and in the whole profession: but because we say that we must not so much enquire whether those fragments were sent, or but whether they were well sent. And that custom has degenerated into superstition, whereby at this day the host is carried to them alone which are about to die, and that for certain gain and advantage, as also in a vain persuasion of a certain necessary provision for their journey, that custom of carrying the Supper to the absent, is worthily taken away in our Churches. Cyprian in the administration of this sacrament, ‘We ought to do no other thing than that which Christ did.&#x27;</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/william-bucanus.html">William Bucanus</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Other citations (work not named)</cite>, In what place is it to be administered?’ in Institutions of Christian Religion… (London, 1601), 48th Place, ‘Of the Supper of the Lord’, p. 931</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/the-sacraments-in-general/minister-and-intention.html">Minister and Intention</a></span></div>

<main class="wrap"><figure class="quote" id="q-cb6006cb72" data-kw="">
<blockquote><p>If, therefore, the Christian Churches had had images from the very first times, if they had paid them the same cult and the same veneration that now obtains in the Roman rite, there is no doubt that the most bitter and implacable enemies of our discipline, the Jews, would have seized upon this, and would have accused it as some unspeakable impiety.</p></blockquote>
<figcaption>— <a href="../authors/jean-daille.html">Jean Daillé</a>, <cite>Four Books on Images</cite>, p. 41</figcaption>
<div class="meta"><span class="t">Idolatry and Images</span><span class="t">Rome: Worship</span></div>

</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-1adee36587" data-kw="">
<blockquote><p>Again, their idolatry is manifest, in that they worship God in, at, or before images; having no commandment so to do, but the contrary. They allege that they use and worship images only in a remembrance of God. But this is all one as if an unchaste wife should receive many lovers into her house in the absence of her husband and, being reproved, should answer that they were the friends of her husband and that she kept them only in remembrance of him.</p></blockquote>
<figcaption>— <a href="../authors/william-perkins.html">William Perkins</a>, <cite>A Reformed Catholic</cite>, p. 197</figcaption>
<div class="meta"><span class="t">Idolatry and Images</span><span class="t">Rome: Worship</span></div>

</figure><figure class="quote" id="q-bf239b6292" data-kw="Mary Queen of Heaven Mediator Idolatry Invocation of saints">
<blockquote><p>Yes, they transform some of them into detestable idols, making them in truth mediators of redemption, especially the virgin Mary, whom they call &quot;a Lady, a Goddess, a Queen, whom Christ her Son obeys in heaven, a mediatress: or life, hope, the medicine of the diseased.&quot;</p></blockquote>

</figure><figure class="quote" id="q-fecc17f84e" data-kw="Mary Mediator Invocation of saints Idolatry">
<blockquote><p>It may be added also that the doctrine of the Papists that the saints or the Virgin Mary may act as mediators to procure blessings for us, is false. There is but &quot;one Mediator;&quot; and but one is necessary. Prayer offered to the &quot;saints,&quot; or to the &quot;Virgin,&quot; is idolatry, and at the same time removes the one great Mediator from the office which he alone holds, of making intercession with God.</p></blockquote>
<figcaption>— <a href="../authors/albert-barnes.html">Albert Barnes</a>, <cite>Notes on the Bible</cite>, 1 Timothy 2:5</figcaption>

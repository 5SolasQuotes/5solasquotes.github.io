<main class="wrap"><figure class="quote" id="q-fbf1d30788" data-kw="">
<blockquote><p>The righteousness Paul is speaking about here is external and comes from Christ living in us. It’s not internal, and it doesn’t come from ourselves. So if we are concerned about Christian righteousness, we must completely set aside the self. If I focus on myself, then I become concerned about works and become subject to the law—whether I intend to or not. Instead, Christ and my conscience must become one so that I see nothing else except the crucified and risen Christ. If I ignore Christ and look only at myself, then I am ruined. Soon I begin thinking, “Christ is in heaven; I am on earth. How can I come to him? I will try to live a holy life and do what the law requires so that I will find eternal life.” If I consider myself—my condition and what I should be doing—then I will always lose sight of Christ. He alone is my righteousness and my life. If I lose him, no one else will be able to help me. Despair and condemnation will certainly follow. Unfortunately, this happens all the time. When facing temptation or death, it’s natural for us to ignore Christ and look at our own lives. If we aren’t strengthened through faith during those times, we will perish. So during these struggles of conscience, we must learn to let go of ourselves. We must forget about the law and works. They only drive us to look at ourselves. Instead, we must turn our eyes directly toward the bronze snake, Christ, the one nailed to the cross (John 3:14). We must fix our gaze upon him.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/martin-luther.html">Martin Luther</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Faith Alone: A Daily Devotional</cite>, (p. 267). Zondervan. Kindle Edition.</span></figcaption>

</figure><figure class="quote" id="q-f252f7fcdf" data-kw="">
<blockquote><p>In verse 27 of chapter 3, after he dwells for a little while on the conclusion of the demonstration and has preached a little more fully about the righteousness of faith, he connects the two parts of the principal syllogism and gathers them into one, and after denying the contrary manner of justifying, which is by works, he concludes the manner of justifying that is true and singular, namely, which is by faith. He also concludes the universality of those justified by faith. For as he shows the universality of sinful men, so he also teaches the universality of men who are justified.</p></blockquote>

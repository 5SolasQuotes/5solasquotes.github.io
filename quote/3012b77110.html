<main class="wrap"><figure class="quote" id="q-3012b77110" data-kw="">
<blockquote><p>All Scripture is profitable, and conduces to the growth of the Christian. But some portions of it seem to be more particularly adapted than others to certain stages of his growth in the divine life, and certain experiences in his history. In the season of affliction, the heart loves to give itself utterance in the mourning and plaints of the afflicted Psalmist. In the hour of joy, it pours forth the flood of its thanksgiving and praise in the songs and anthems of the joyful Psalmist.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/william-g-t-shedd.html">William G.T. Shedd</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Letter to the Spiritual Man (New York: Charles Scribner’s Sons, 1884), p. 167.</cite></span></figcaption>
<div class="meta"><span class="t"><a href="../topics/worship.html">Worship</a></span></div>

</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-9bc4e2cbaa" data-kw="">
<blockquote><p>10. The true and the lawful inward service of God is especially contained in the First Commandment, which is nothing else but the worshipping of the true God according unto the prescript of his Law.

11. The end of the First Commandement… He enjoins Himself to be worshipped and adored of us in the true practice of godliness.

12. Furthermore, although that the duties which we owe unto God be innumerable, yet they may be not unproperly referred unto four heads: The first is the inward acknowledging, whereunto is joined as an addition, the spiritual obedience of the conscience: the second is an assured trust: the thrid is, invocation, or prayer. The fourth and last, is thanksgiving.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/theodore-beza.html">Theodore Beza</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Propositions &amp; Principles of Divinity Propounded and Disputed</cite>, (London: 1591), ch. 29, pp. 67-68</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/worship/nature-of-worship.html">Nature of Worship</a></span></div>

<blockquote><p>Christian mildness and mercy must be exhibited to the sheep of Christ in order to protect them from the wolves, and not to the wolves that they may scatter and destroy the sheep.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/martin-bucer.html">Martin Bucer</a></span><span class="wk"><span class="lbl">Work:</span> <cite>De Regno Christi</cite>, (1550) in Wilhelm Pauck (ed.), The library of Christian classics: Melanchthon and Bucer (Philadelphia, 1969), p. 277.</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/worship.html">Worship</a></span></div>
<div class="actions"><button class="copy" data-copy="“Christian mildness and mercy must be exhibited to the sheep of Christ in order to protect them from the wolves, and not to the wolves that they may scatter and destroy the sheep.”

— Martin Bucer, De Regno Christi, (1550) in Wilhelm Pauck (ed.), The library of Christian classics: Melanchthon and Bucer (Philadelphia, 1969), p. 277.">Copy</button><a class="share" href="https://x.com/intent/post?text=%E2%80%9CChristian+mildness+and+mercy+must+be+exhibited+to+the+sheep+of+Christ+in+order+to+protect+them+from+the+wolves%2C+and+not+to+the+wolves+that+they+may+scatter+and+destroy+the+sheep.%E2%80%9D%0A%0A%E2%80%94+Martin+Bucer%2C+De+Regno+Christi%2C+%281550%29+in+Wilhelm+Pauck+%28ed.%29%2C+The+library+of+Christian+classics%3A+Melanchthon+and+Bucer+%28Philadelphia%2C+1969%29%2C+p.+277.&amp;url=https%3A%2F%2F5solasquotes.github.io%2Fquote%2F20d3699fd1.html&amp;via=5Solas" target="_blank" rel="noopener">Share on X</a><a class="perma" href="../quote/20d3699fd1.html">Permalink</a><a class="src" href="https://reformedcovenanter.wordpress.com/2012/07/10/martin-bucer-on-scattering-wolves/" rel="noopener" target="_blank">Read it online · Reformed Covenanter</a></div>
</figure><figure class="quote" id="q-4d7b72c231" data-kw="">
<blockquote><p>But the church of God is in God the Father, and in the Lord Jesus Christ; it is the company of the faithful, whom God hath gathered together in Christ by his word and by the Holy Ghost, to honour him, as he himself hath appointed. This church heareth the voice of the Shepherd; it will not follow a stranger, but flieth from him; for it knoweth not the voice of strangers. Of this church St. Jerome saith, “The church of Christ, which containeth the churches through all the world, is joined together in the unity of the spirit, and hath the cities of the law, of the Prophets, of the Gospel, and of the Apostles. This church goeth not forth, or beyond her bounds, that is, the holy Scriptures.”

It is the pillar of the truth, the body, the fulness, and the spouse of Christ; it is the vine, the house, the city, and the kingdom of God; they which dwell in it, are no more strangers and foreigners, but citizens with the saints, and of the household of God, and are built upon the foundation of the Apostles and Prophets; Jesus Christ himself being the head corner-stone, in whom all the building coupled together, groweth into an holy temple in the Lord. This church Christ loved, and gave himself for it, that he might sanctify it, and cleanse it by the washing of water through the word; that he might make it unto himself a glorious church, not having spot or wrinkle, or any such thing, but that it should be holy, and without blame. (Eph. v.)

Such a church was the church of God at Thessalonica; such a church are they, whosoever in any place of the world fear the Lord, and call upon his name; their names are written in the book of life; they have received the spirit of adoption, by which they cry Abba, Father; they grow from grace to grace, and abound more and more in knowledge and in judgment; they cast away the works of darkness, and put on the armour of light; they are made absolute and perfect unto all good works; they are evermore comforted in the mercies of God, both by the holy Scriptures, wherein God declareth his gracious goodness towards them, and by the sacraments, which are left unto the church to be witnesses and assured pledges for performance of the promises of God’s good will and favour towards them.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/john-jewel.html">John Jewel</a></span><span class="wk"><span class="lbl">Work:</span> <cite>An Exposition upon the Two Epistles of the Apostle St. Paul to the Thessalonians</cite>, (1584; London: John Hatchard, 1811), pp 10-11.</span></figcaption>

<blockquote><p>§10. Of the vices contrary to children’s reverend gesture towards their parents. … 2. Disdainful stateliness, when they think [it too] much to stand bare-headed any while in their parents’ presence. It falls out many times, that when parents and children are together before their betters, they will show more reverence than these: for the father will stand, and be uncovered, when the son sits down and puts on his hat, upon conceit that his father does more reverence than is meet: but if it were so, yet the son for the father’s sake should stoop somewhat the lower.</p></blockquote>

</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-87a9dd8be8" data-kw="">
<blockquote><p>Paul, when writing to the Corinthians who were Greeks, gives the preference to that [Greek] custom [of men having an uncovered head in worship]. In doing so, he did not intend to lay down a universal law which should be everywhere observed. He merely accommodated himself to a custom of civil life observed, at that time, by those to whom he was writing. This is admirably, I think, explained by [Johann H.] Altingius in a discourse already quoted… It must not be supposed that the same rule which he had given to the Corinthians from a regard to their customs would have been invariably given to Jews dwelling in their own country, or to Egyptians or Arabians, who followed a different custom. The usages of civil life are endlessly varied by place and time. Consequently what, at one place and time, is sufficiently becoming, would be, at anotlier place and time highly unbecoming. Yet the apostolic rule has been in force, since that time, among almost all Christians. Is it because keeping the head uncovered is universally regarded by them as a token of reverence? I hardly think so. It has spread widely in the north, through the nations of France and Germany. But among the Jews, the Greeks, ancient Italy, and the whole of the East, the custom is wholly unknown. It appears, therefore, to belong to the liberty of the New Testament. ‘With uncovered head,’ says Tertullian, ‘because we are not ashamed.&#x27;</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/herman-witsius.html">Herman Witsius</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Other citations (work not named)</cite>, pp. 84-90 of Dissertation 4, ‘On Gestures in Prayer’ in Sacred Dissertations on the Lord’s Prayer (1689; Edinburgh: Thomas Clark, 1708)</span></figcaption>

</figure><figure class="quote" id="q-377ce1470e" data-kw="">
<blockquote><p>A wive’s outward reverence consists in her reverend gesture, speech. For the first, that a reverend gesture and carriage of herself to her husband, and in her husband’s presence, beseems a wife, was of old implied by the vail which the woman used to put on, when she was brought unto her husband, as is noted in the example of Rebekah (Gen. 24:65): whereunto the apostle alludes in these words, ‘the woman ought to have power on her head.’ (1 Cor. 11:10) That cover on the woman’s head, as in general it implied subjection, so in particular this kind of subjection, viz. a reverend carriage and gesture. But most expressly is this duty set down by Saint Peter who exhorts wives to order their conversation [conduct] before their husbands, so as it be pure, with reverence. This reverend conversation [conduct] consists in a wive-like sobriety, mildness, courtesy and modesty. [Gouge does not go on to mention veils]</p></blockquote>

</figure><figure class="quote" id="q-6b695031cf" data-kw="">
<blockquote><p>First, their head [of the idolaters in Ahab’s time]; they prayed before their idols with their heads covered, because the people of the East worshipped their great men with their heads covered; therefore they prayed after the same manner, and honored their idols standing before them with their heads covered. Maimonides says that religious outward worship should be given after the same manner as they worshipped great men, and he adds, nisi forte sit mos illius loci, ut quis stet coram magnatibus aperto capite, that is, ‘unless it be the manner of men in that place to stand bare-headed, when they do reverence to great men’; where we see that the gesture and the manner of praying is to be accommodated to the custom of the place where one lives, and they should testifie their outward reverence by such signs as men testify their reverence to great men. This manner of worship varies in sundry parts. Maimonides wrote his Mishna in Egypt, and amongst the Mahometans who uncover not their heads before great men, but bow only their head before them; and therefore when they pray they uncover not their head: So the Jews both the priests and people uncover not the head in time of divine service. The priests had such bonnets upon their heads which could not easily be taken off and put on as ours, and when they came abroad they never uncovered their heads; but when they made great lamentation they uncovered their heads, and cast ashes upon them: But the Christians in the West, when they do reverence to their superiors, they always uncover their heads; and therefore it is the fittest gesture for us to uncover our heads when we pray. The Jews who live here in Europe, when they are in their synagogues, they never uncover their heads, which is altogether contrary to the custom of Europe: They salute great men here uncovering their heads, and so should they pray according to the canon of Maimonides; but they do this in despite of the Christians: The apostle, 1 Cor. 11, wills men to be uncovered, and women to be covered, when they pray, because that was the usual form amongst the Grecians, for the men did uncover their heads, when they did any reverence to their superiours; and the women had vails which covered their heads and faces when they came abroad: therefore he would not have them uncovered in time of prayer.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/john-weemes.html">John Weemes</a></span><span class="wk"><span class="lbl">Work:</span> <cite>A Treatise of the Four Degenerate Sons</cite>, … wherein are handled many… sundry places of Scripture, cleared out of the original tongues. Being the fourth volume, of the Works… (London, 1636), On the 3rd Degenenerate Son, the Idolater, section 6, pp. 264-65</span></figcaption>

+the+fittest+gesture+for+us+to+uncover+our+heads+when+we+pray.+The+Jews+who+live+here+in+Europe%2C+when+they+are+in+their+synagogues%2C+they+never+uncover+their+heads%2C+which+is+altogether+contrary+to+the+custom+of+Europe%3A+They+salute+great+men+here+uncovering+their+heads%2C+and+so+should+they+pray+according+to+the+canon+of+Maimonides%3B+but+they+do+this+in+despite+of+the+Christians%3A+The+apostle%2C+1+Cor.+11%2C+wills+men+to+be+uncovered%2C+and+women+to+be+covered%2C+when+they+pray%2C+because+that+was+the+usual+form+amongst+the+Grecians%2C+for+the+men+did+uncover+their+heads%2C+when+they+did+any+reverence+to+their+superiours%3B+and+the+women+had+vails+which+covered+their+heads+and+faces+when+they+came+abroad%3A+therefore+he+would+not+have+them+uncovered+in+time+of+prayer.%E2%80%9D%0A%0A%E2%80%94+John+Weemes%2C+A+Treatise+of+the+Four+Degenerate+Sons%E2%80%A6+wherein+are+handled+many%E2%80%A6+sundry+places+of+Scripture%2C+cleared+out+of+the+original+tongues.+Being+the+fourth+volume%2C+of+the+Works%E2%80%A6+%28London%2C+1636%29%2C+On+the+3rd+Degenenerate+Son%2C+the+Idolater%2C+section+6%2C+pp.+264-65&amp;url=https%3A%2F%2F5solasquotes.github.io%2Fquote%2F6b695031cf.html&amp;via=5Solas" target="_blank" rel="noopener">Share on X</a><a class="perma" href="../quote/6b695031cf.html">Permalink</a><a class="src" href="https://reformedbooksonline.com/the-post-reformation-scottish-church-on-head-coverings-in-public-worship/#:~:text=First%2C%20their%20head%20%5Bof%20the%20idolaters,them%20uncovered%20in%20time%20of%20prayer&amp;text=First%2C%20their%20head%20%5Bof%20the%20idolaters%20in%20Ahab%E2%80%99s&amp;text=not%20have%20them%20uncovered%20in%20time%20of%20prayer" rel="noopener" target="_blank">Read it online · Reformed Books Online</a></div>

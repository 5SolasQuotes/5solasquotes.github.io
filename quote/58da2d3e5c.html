<main class="wrap"><figure class="quote" id="q-58da2d3e5c" data-kw="">
<blockquote><p>Furthermore, our theologians believe that churches should be free to send and delegate to councils even private individuals, provided they are pious, learned, and knowledgeable in ecclesiastical matters, and these, in such a case, can give their vote on proposed matters in common with the pastors and elders. This is also taught and believed by Whitaker in Controversy 3, On Councils, question 3, the illustrious Moses Amyraut in his Theses on Councils, part 2, Wendelin in Christian Theology, book 1, chapter 28, thesis 31, Bucanus in place 43, number 23, and Tilenus in Disputations on Councils, 1, and many others. Hence, it is evident what the status of this controversy with the modern Pontiffs is, namely, whether only bishops have a decisive vote in councils, which the Pontiffs affirm, or whether the same right belongs to any delegates of the churches, whether they are pastors or from other governors of the Church, or even otherwise private individuals, which our theologians teach.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/louis-le-blanc.html">Louis Le Blanc</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Theological Theses Published at Various Times</cite>, 2. ‘Who are to be called to councils, and of what kind of persons they should consist’ in Theological Theses Published at Various Times in the Academy of Sedan 3rd ed. tr. by AI by Colloquia Scholastica (1675; London, 1683), Posthumous Works, 4. Controversies on Councils, pp. 1029-31 Latin, p. 1,031</span></figcaption>

</figure><figure class="quote" id="q-56c9eecbf0" data-kw="">
<blockquote><p>They [Brownists] except against our ministers because they receive their ordination from bishops. To which I answer: We have our ordination from Christ by bishops and clergymen; and for this kind of ordination by bishops and presbyters we have the universal consent of the primitive Church; by St. Paul, Timothy, and Titus were ordained. And this has been the practice of all the Christian Churches of the universe until the time that Anabaptists crept into the world. But they will allege that we have been ordained by Antichristian bishops, and therefore they conclude every action done by our ministers to be Antichristian. To which I answer: Why is not the ordination that our forefathers had from Antichristian bishops as effectual as the baptism that was administered by them to our forefathers? Did ever any Reformed Church rebaptize them that were baptized by them? And why should our ministers be reordained more than rebaptized? Indeed our ministers being ordained by bishops and that by Protestant bishops, such as Cranmer, Latimer and Ridley, who were holy martyrs, who renounced all superstition; what exceptions can be taken against them? Neither can they find any shelter under that noted text, ‘neglect not the gift that is in thee by the imposition of the hands of the presbytery,’ which learned Mr. [John] Calvin expounds not of the men, but of the office, following herein Jerome, Anselm, Haimo, Lyra, referring it to the gift given him and to the bishops and presbyters, which has been the practice of the Church of England and all Christian Churches in the world until the Anabaptists. To conclude, let the Brownists confess our bishops to be but Christians, which they cannot deny, and the ordination of our ministers will be lawful by their own rules: for if the ordination of their ministers by plebeian artificers be lawful, how much more is the ordination of our ministers by bishops and learned ministers, qualified with learning and wisdom and set apart to do the same?</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/ephraim-pagitt.html">Ephraim Pagitt</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Heresiography, or a Description of the Heretics &amp; Sectaries of these Latter Times</cite>, (London: Wilson, 1645), ‘Of the Brownists’, 15. ‘Except against our Ordination’, p. 60</span></figcaption>

</figure><figure class="quote" id="q-3eb9fdb2ac" data-kw="">
<blockquote><p>Whether by ‘the sinful evil of those corruptions, in the public worship and government of this Church,’ you [Independent divines at Westminster] understand… the Book of Common Prayer, the entrance into our ministry by ordination of bishops and living under the episcopal government?… Now if you mean… [this], that which usually was called, Old conformity, in opposition to the New [under Archbishop Laud]: So I deny that all do now generally acknowledge and decry that as sinfully evil; which appears thus: Because that remonstrance presented to the House of Commons in the beginning of the Parliament, subscribed by many hundred godly ministers, conformists, and non-conformists for reformation in worship, doctrine, government and discipline: The government, worship and ceremonies were impleaded, in respect of many inconveniences and evil consequents; but petitioning against them as sinfully evil and absolutely unlawful was declined: And there are many parliament men and ministers who have a great zeal to the present reformation in casting out the hierarchy and ceremonies, who are not yet convinced that all their former practice in the way of old conformity was sinful: But as those times were, do judge they did lawfully continue their standing in their places and in this Church: much less are they satisfied that either Episcopal government, or the Liturgy were sufficient grounds of forsaking our public assemblies and erecting new. Amongst a cloud of learned and godly men, take the testimony of Gerson Bucerus in his learned answer to Doctor Downame (Dissert. de Guber. Eccl., p. 620), who for the point of Episcopacy allows not of schism in the Church, but vindicates himself and others who keep within the bounds of his opinion from being guilty in that kind. Which answer… is not here given by me in the least to plead for the hierarchy, ceremonies or present Liturgy (for I heartily desire their removal), but only to show the Apologists’ mistake in asserting that all do now so generally acknowledge and decry them as sinfully evil… We [be] as much abhorring bowing to altars, publishing the Declaration for Sports, etc. as you: and witnessing more frequently against them in our ministry than some of you.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/thomas-edwards.html">Thomas Edwards</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Antapologia, or, A Full Answer to the Apologetical Narration of Mr. Goodwin, Mr. Nye, Mr. Sympson, Mr. Burroughs, Mr. Bridge, members of the Assembly of Divines wherein is Handled Many of the Controversies of These Times</cite>, (London: G.M., 1644), pp. 15-16</span></figcaption>

hers+who+keep+within+the+bounds+of+his+opinion+from+being+guilty+in+that+kind.+Which+answer%E2%80%A6+is+not+here+given+by+me+in+the+least+to+plead+for+the+hierarchy%2C+ceremonies+or+present+Liturgy+%28for+I+heartily+desire+their+removal%29%2C+but+only+to+show+the+Apologists%E2%80%99+mistake+in+asserting+that+all+do+now+so+generally+acknowledge+and+decry+them+as+sinfully+evil%E2%80%A6+We+%5Bbe%5D+as+much+abhorring+bowing+to+altars%2C+publishing+the+Declaration+for+Sports%2C+etc.+as+you%3A+and+witnessing+more+frequently+against+them+in+our+ministry+than+some+of+you.%E2%80%9D%0A%0A%E2%80%94+Thomas+Edwards%2C+Antapologia%2C+or+a+Full+Answer+to+the+Apologetical+Narration+%28London%3A+G.M.%2C+1644%29%2C+pp.+15-16&amp;url=https%3A%2F%2F5solasquotes.github.io%2Fquote%2F3eb9fdb2ac.html&amp;via=5Solas" target="_blank" rel="noopener">Share on X</a><a class="perma" href="../quote/3eb9fdb2ac.html">Permalink</a><a class="src" href="https://reformedbooksonline.com/topics/topics-by-subject/church-government/prelacy#:~:text=Whether%20by%20%E2%80%98the%20sinful%20evil%20of,our%20ministry%20than%20some%20of%20you&amp;text=Whether%20by%20%E2%80%98the%20sinful%20evil%20of%20those%20corruptions&amp;text=them%20in%20our%20ministry%20than%20some%20of%20you" rel="noopener" target="_blank">Read it online · Reformed Books Online</a></div>

<blockquote><p>When the congregation is dissolved by persecution, the godly pastor [on the supposition of congregationalism] is cast out of his Master’s service by the nature of this [local-church] covenant [of the congregationalists], because he is faithful to Christ, and that by Christ Himself.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/samuel-rutherford.html">Samuel Rutherford</a></span><span class="wk"><span class="lbl">Work:</span> <cite>A Survey of the Survey of that Sum of Church-Discipline Penned by Mr. Thomas Hooker</cite>, (1658) Rutherford in these passages is arguing against Congregationalism. | [If losing membership in a local congregation makes one not to be a member of the visible Church, then a pastor ceasing to be a pastor of a dissolved congregation would defrock him, as congregationalists held. Yet:], Bk. 1; ch. 26, p. 164</span></figcaption>

</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-44f3e13535" data-kw="">
<blockquote><p>3. But ordinarily no man ought to be excommunicate[d] for any sin whatsoever, unless impenitence be added to the sin. Because he is first to be admonished to repent, Mt. 18:15-16; Tit. 3:10; and repentance is the Gospel condition of pardon to believers.

4. A man is not to be excommunicated for every sin which he repents not of, because:

1. Else all men should be excommunicated. For there are in all men some errors about sin and duty, and so some sins which men cannot yet perceive to be sins.

2. And ministers are not infallible, and may take that for a sin which is no sin, and so should excommunicate the innocent.

3. And daily unavoidable infirmities, though repented of, yet awaken not the soul sometimes to a notable contrition; nor are they fit matter for the Church’s admonition. A man is not to be called openly to repentance before the Church for every idle word, or hour.

5. Therefore, to excommunication these two must concur:

1. A heinousness in the sin;

2. Impenitence after due admonition and patience.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/richard-baxter.html">Richard Baxter</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Other citations (work not named)</cite>, Part 3, Question 94, ‘For what sins may a man be denied communion or [be] excommunicated? Whether for impenitence in every little sin? Or for great sin without impenitence?’ in A Christian Directory: a Sum of Practical Theology and Cases of Conscience (1673)</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/church-discipline/excommunication.html">Excommunication</a></span></div>

f3e13535.html">Permalink</a><a class="src" href="https://reformedbooksonline.com/on-excommunication/#:~:text=3.%20But%20ordinarily%20no%20man%20ought,Impenitence%20after%20due%20admonition%20and%20patience&amp;text=3.%20But%20ordinarily%20no%20man%20ought%20to%20be&amp;text=sin%3B%202.%20Impenitence%20after%20due%20admonition%20and%20patience" rel="noopener" target="_blank">Read it online · Reformed Books Online</a></div>
</figure><figure class="quote" id="q-36a84597f2" data-kw="">
<blockquote><p>5. All our divines, standing for the certainty of the perseverance of the regenerated, answer Papists and Arminians alleging for the apostasy of the saints, the example of the regenerated who may be excommunicated, that excommunication does never evince [prove] that the person excommunicated is out of the state of grace, but only that he has fallen into a scandalous external fact, which deserves that he should be delivered to Satan; and that one may be a member [in some way] of the visible Church and converted to God, who is excommunicated.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/samuel-rutherford.html">Samuel Rutherford</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Due Right of Presbyteries, ‘Acts 15, A Pattern of a Juridicial Synod’</cite>, (1644), p. 278</span></figcaption>

</figure><figure class="quote" id="q-546308854b" data-kw="">
<blockquote><p>Therefore, he [the one that has been greater-excommunicated] is not altogether cut off from the Church, for delivering to Satan is medicinal, not vindictive, as the Great Excommunication is which is called Anathema Maranatha, which we cannot use but against such as have sinned the sin against the Holy Ghost, and is hardly discerned, and I would think such an one as Julian the Apostate should be debarred from the communion of the Word preached [unlike in greater-excommunication]. But these who are ordinarily excommunicated for contumacy and particular faults, and not for universal apostasy, are not altogether excluded from all brotherhood of the Church.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/samuel-rutherford.html">Samuel Rutherford</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Due Right of Presbyteries, ‘Acts 15, A Pattern of a Juridicial Synod’</cite>, (1644), pt. 1, p. 273</span></figcaption>

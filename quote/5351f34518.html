<main class="wrap"><figure class="quote" id="q-5351f34518" data-kw="">
<blockquote><p>In Latin children are called pignora, that is pledges, as if I should say, a pledge of the husbands love to the wife, and a pledge of the wife’s love toward the husband: for there is nothing which does so knit love between the man and the wife, as the fruit of the womb… If a woman have many defects (as Leah had) yet this is the mends which she makes her husband to bring him children, which is the right wedding ring that seals and makes up as it were the marriage.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/henry-smith.html">Henry Smith</a></span><span class="wk"><span class="lbl">Work:</span> <cite>A Preparative to Marriage</cite>, (1591), pp. 97-98</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/civil-government-and-society/marriage-and-family.html">Marriage and Family</a></span></div>

</figure><figure class="quote" id="q-2476d15112" data-kw="">
<blockquote><p>You will learn from our brother, master Butler, by what circumstances I am hindered and with whom I have to contend within these two days on the subject of divorce. In the commentaries¹ which I lately wrote on the decalogue, I allowed both to the man and his wife an equal liberty of divorce on account of adultery, if they are disposed to use that liberty which Christ has permitted in the gospel of his Church, where the marriage contract is dissolved by adultery. ¹ See a Declaration of the ten holy Commandments of Almighty God, in Hooper’s early writings, Parker Society edition. The passage here referred to will be found in pp. 378, 379, where Hooper complains of the uncharitable construction put upon it. My opponents allow the husband to divorce his wife by reason of adultery, and to marry another; but they do not allow the same liberty to the wife. In your next letter, as you love me, either confirm my opinion, or correct my error.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/john-hooper.html">John Hooper</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Original Letters relative to the English Reformation</cite>, ed. Hastings Robinson for the Parker Society (Cambridge Univ. Press, 1846), vol. 1, Letter 32, Hooper to Bullinger, p. 64</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/civil-government-and-society/marriage-and-family.html">Marriage and Family</a></span></div>

 rel="noopener" target="_blank">Read it online · Reformed Books Online</a></div>
</figure><figure class="quote" id="q-4ef8944025" data-kw="">
<blockquote><p>But perhaps they will object the apostles determination (Acts 15) concerning the Gentiles newly converted to Christianity, that they should abstain from eating of blood and things strangled, which was a Mosaical rite. To which I answer: First, that the apostles in the same place (v. 10) do show, that that burden of legal ceremonies was removed by the death of Christ and buried in his grave. Secondly, they did this in regard of the Jews which dwelt among those Christians for the time, being for peace’s sake, until the Christian Jews were better confirmed in the faith and knowledge of Christ (v. 21). Thirdly, they did it by the special direction of the Holy Ghost (v. 28), for the reason alleged. So as that example being extraordinary, and for the time of the infancy of the Gospel, it is no rule for us to follow now after so long a shining forth of the Gospel. And I might add this moreover, that the apostles did not this alone, but with the whole congregation, the presbyters, or elders, and brethren being joined with them. Whereas our prelates, though, they confess that a General Council has no immediate institution from Christ to determine controversies; but that it was prudently taken up in the Church from the apostles’ example, Acts 15. Yet for all their prudence in taking up that which belongs not unto them, they shew themselves very unfaithful, while they follow not the example of the apostles in determining alone, and not with the whole congregation; and therefore Christians have the less reason to captivate their faith to prelatical decrees, either in a General Council where the Pope of Rome and of Canterbury are the rulers of the rost, or in a convocation, where the Pope of Canterbury is Prime, Primate, Metropolitan, and All, who without the Holy Ghost (which is never given to any such Antichristian assemblies) whatever they decree in point of faith or otherwise, be it never so erroneous, yet they enjoin obedience thereunto by all men, as our Prelate affirms.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/william-prynne.html">William Prynne</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Lord Bishops, None of the Lord’s Bishops. Or A Short Discourse, wherein is Proved that Prelatical Jurisdiction is Not of Divine Institution, but forbidden by Christ Himself</cite>, (1640), ch. 7. Prynne was a prominent Erastian.</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/civil-government-and-society/marriage-and-family.html">Marriage and Family</a></span></div>

</figure><figure class="quote" id="q-5f8500454e" data-kw="">
<blockquote><p>The donation of Ananias and Sapphira was made to God for the use of the poor, it lay not now in their power nor in the Churches to revoke and reverse that grant, wherein God became now to be interessed. We see this in marriage, published in the face of the Church, solemnized by consent of parties and parents, ratified by the action of the minister, and celebrated in the presence of many friends; the knot cannot be untied, no not by agreement of the parents, of the parties, of the minister, of the friends, and of the whole congregation, because marriage is not of the nature of a civil contract, but God is a party and hath a special hand in it, and whom God hath joined together let no man put asunder, or separate again without his consent. (Mt. 19:6)</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/william-attersoll.html">William Attersoll</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Commentary on Numbers</cite>, (London, 1618), pp. 704-705</span></figcaption>

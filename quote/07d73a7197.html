<blockquote><p>…those works of preventing grace, whereby out of the general apprehension of faith, God works in us dislike of our former condition, desire to be reconciled to God, to have remission of that [which] is past, and grace hereafter to decline the like evils, and to do contrary good things. For by these we are prepared, disposed and fitted for justification; without these none are justified. And in this sense, and to imply a necessity of these to be found in us, sometimes the Fathers and others say that we are not justified by faith only. And we all agree, that it is not our conversion to God, nor the change we find in ourselves, that can any way make us stand in judgment without fear, and look for any good from God, otherwise than in that we find ourselves so disposed and fitted, as is necessary for justification, whence we assure ourselves God will in mercy accept us for Christs sake.</p></blockquote>

<blockquote><p>By these and other Scripture-sentences, everyone easily sees that there are two conditions given man that he may escape the judgment of God’s justice and obtain the promise of mercy. One is the blessed seed, Christ, and his death and sacrifice. The other is faith in Christ and repentance. There is great difference between these conditions: one is simple, not conditionate, and (as they say) simply given, without respect to another dignity (or worthiness); but the other is conditionate, and given secundum quid [in a certain way], that is, receiving all its authority and certainty from the former: to wit, repentance and faith in Christ. The first condition depends on no other, but is of itself, and from itself, authentical, and gives from itself to the other all its force, virtue, and dignity. Hence the first is more principal and the chief; but the other is less principal and viler. This greater or less principality consists in this, that the first is the cause-efficient of expiation and security from God’s justice, and of obtaining mercy. And the latter is an instrumental cause, or organ of acceptance, applying reconciliation and mercy obtained. That respects justice; this mercy. By that satisfaction is given to the just Judge, without the hurt or diminution of his justice, as Himself proclaims from heaven, Mt. 3:17 and 17:5, “in whom I am well pleased,” or “in whom I am appeased,” or rest satisfied. But by that other, to wit, faith and repentance, man satisfies himself in his own conscience, that he may consist without any offence from the justice of God. As therefore it is a heinous error of them who confound these conditions in the business of justification, so peculiarly does Socinus err and break forth into blasphemy, while, turning his eye to this condition—to wit, faith and repentance, which is the less principal—and resting on this alone, he affirms it to be the efficient and meritorious cause of obtaining mercy. But the other more principal, without which this would be as a body without a soul, or a shell without a kernel, he blindly passes over and neglects, as if he saw it not. For if only bare faith in Christ and repentance would suffice to obtain God’s mercy, of what use, I pray you, was that former condition premised to this? to wit, the promise and exhibition of the Holy One, and of his death and sacrifice, and the express injunction that men’s eyes and faith be directed to this holy seed. Socinus therefore does violence to God, disjoining what He has conjoined; and that which God would have put first, he does not so much as let it follow after, but endeavours wholly to remove and blot it out of the memory of men.” – pp. 53-54, trans. Baxter, Baxter’s Confession (1655), ch. 10, sect. 3, pp. 388-90 Lubbertus, Sibrandus – De Iesu Christo servatore, hoc est, cur et qua ratione Jesus Christus noster servator sit, libri quatuor. Contra Faustum Socinum (Franeker, 1611) 650 pp. This was the first-scale reply to Socinus’s De Servatore. Hoornbeek, Johannes – Socinianism Confuted, vol. 1, 2 (Amsterdam, 1650/62) ToC 1, 2 Hoornbeek goes through the whole system of Socinianism; hence this work is virtually a polemical systematic theology. Table of Contents vol. 1 Bk. 1 1. Whether in sacred Scripture there is truly any disagreement and contradiction 1 2. Whether the authentic text of sacred Scripture in many places has been changed and corrupted 28 3. Whether some of the sacred books of the O.T. have perished 48 4. Whether under the New Testament, the reading of the O.T. is not necessary and of great moment 56 … Bk. 2 10. Whether the eternity of God has temporal parts and succession, through what is before and that which follows 262 11. Whether God, his presence, is omnipresent 285 12. Whether God has all knowledge [scientiam], even of future contingencies 319 13. Whether attributes, or properties in God are accidents or qualities really different from God and really different between themselves 367 14. Whether — Gregorius Zarnovecius, Apokatastasis, sive vindiciae pro articulo plane fundamentali religionis Christianae de planissima satisfactione (Danzig, 1607)">Copy</button><a class="share" href="https://x.com/intent/post?text=%E2%80%9CBy+these+and+other+Scripture-sentences%2C+everyone+easily+sees+that+there+are+two+conditions+given+man+that+he+may+escape+the+judgment+of+God%E2%80%99s+justice+and+obtain+the+promise+of+mercy.+One+is+the+blessed+seed%2C+Christ%2C+and+his+death+and+sacrifice.+The+other+is+faith+in+Christ+and+repentance.+There+is+great+difference+between+these+conditions%3A+one+is+simple%2C+not+conditionate%2C+and+%28as+they+say%29+simply+given%2C+without+respect+to+another+dignity+%28or+worthiness%29%3B+but+the+other+is+conditionate%2C+and+given+secundum+quid+%5Bin+a+certain+way%5D%2C+that+is%2C+receiving+all+its+authority+and+certainty+from+the+former%3A+to+wit%2C+repentance+and+faith+in+Christ.+The+first+condition+depends+on+no+other%2C+but+is+of+itself%2C+and+from+itself%2C+authentical%2C+and+gives+from+itself+to+the+other+all+its+force%2C+virtue%2C+and+dignity.+Hence+the+first+is+more+principal+and+the+chief%3B+but+the+other+is+less+principal+and+viler.+This+greater+or+less+principality+consists+in+this%2C+that+the+first+is+the+cause-efficient+of+expiation+and+security+from+God%E2%80%99s+justice%2C+and+of+obtaining+mercy.+And+the+latter+is+an+instrumental+cause%2C+or+organ+of+acceptance%2C+applying+reconciliation+and+mercy+obtained.+That+respects+justice%3B+this+mercy.+By+that+satisfaction+is+given+to+the+just+Judge%2C+without+the+hurt+or+diminution+of+his+justice%2C+as+Himself+proclaims+from+heaven%2C+Mt.+3%3A17+and+17%3A5%2C+%E2%80%9Cin+whom+I+am+well+pleased%2C%E2%80%9D+or+%E2%80%9Cin+whom+I+am+appeased%2C%E2%80%9D+or+rest+satisfied.+But+by+that+other%2C+to+wit%2C+faith+and+repentance%2C+man+satisfies+himself+in+his+own+conscience%2C+that+he+may+consist+without+any+offence+from+the+justice+of+God.+As+therefore+it+is+a+heinous+error+of+them+who+confound+these+conditions+in+the+business+of+justification%2C+so+peculiarly+does+Socinus+err+and+break+forth+into+blasphemy%2C+while%2C+turning+his+eye+to+this+condition%E2%80%94to+wit%2C+faith+and+repentance%2C+which+is+the+less+principal%E2%80%94and+resting+on+this+alone%2C+he+affirms+it+to+be+the+efficient+and+meritorious+cause+of+obtaining+mercy.+But+the+other+more+principal%2C+without+which+this+would+be+as+a+body+without+a+soul%2C+or+a+shell+without+a+kernel%2C+he+blindly+passes+over+and+neglects%2C+as+if+he+saw+it+not.+For+if+only+bare+faith+in+Christ+and+repentance+would+suffice+to+obtain+God%E2%80%99s+mercy%2C+of+what+use%2C+I+pray+you%2C+was+that+former+condition+premised+to+this%3F+to+wit%2C+the+promise+and+exhibition+of+the+Holy+One%2C+and+of+his+death+and+sacrifice%2C+and+the+express+injunction+that+men%E2%80%99s+eyes+and+faith+be+directed+to+this+holy+seed.+Socinus+therefore+does+violence+to+God%2C+disjoining+what+He+has+conjoined%3B+and+that+which+God+would+have+put+first%2C+he+does+not+so+much+as+let+it+follow+after%2C+but+endeavours+wholly+to+remove+and+blot+it+out+of+the+memory+of+men.%E2%80%9D+%E2%80%93+pp.+53-54%2C+trans.+Baxter%2C+Baxter%E2%80%99s+Confession+%281655%29%2C+ch.+10%2C+sect.+3%2C+pp.+388-90+Lubbertus%2C+Sibrandus+%E2%80%93+De+Iesu+Christo+servatore%2C+hoc+est%2C+cur+et+qua+ratione+Jesus+Christus+noster+servator+sit%2C+libri+quatuor.+Contra+Faustum+Socinum+%28Franeker%2C+1611%29+650+pp.+This+was+the+first-scale+reply+to+Socinus%E2%80%99s+De+Servatore.+Hoornbeek%2C+Johannes+%E2%80%93+Socinianism+Confuted%2C+vol.+1%2C+2+%28Amsterdam%2C+1650%2F62%29+ToC+1%2C+2+Hoornbeek+goes+through+the+whole+system+of+Socinianism%3B+hence+this+work+is+virtually+a+polemical+systematic+theology.+Table+of+Contents+vol.+1+Bk.+1+1.+Whether+in+sacred+Scripture+there+is+truly+any+disagreement+and+contradiction+1+2.+Whether+the+authentic+text+of+sacred+Scripture+in+many+places+has+been+changed+and+corrupted+28+3.+Whether+some+of+the+sacred+books+of+the+O.T.+have+peri <blockquote><p>Now to make application of this to our inquiry touching the original of faith, you may perceive by what is spoken, whereof faith is a part, and when faith is wrought in the soule: namely, that faith is a part of our sanctification, that faith is wrought in the soul then when we are regenerate by the infusion of the habit [inward power] of grace into our whole man. This will appear if we distinguish between: 1. The habit of faith, which is in general the renewed quality of the soul, whereby it is made able to discern and yield assent unto, and also willing to put affiance in all divine truth revealed. 2. The act of faith, when the understanding and will do actually know and rely upon God’s truth and goodness. This is a fruit of the former, and follows it in time; the former is a branch of the image of God restored unto us, a stream of the common fountain of sanctification, whence all graces flow, a part of our inherent righteousness, as is most apparant: It being impossible that the understanding and will of man should be effectually inclined towards their spiritual and supernatural object, to give credence and put confidence in it, until such time as they be first rectified by grace and purged from their habitual inbred blindness and rebellion: Which change when it is wrought in the soul by the Spirit of grace, sanctifying and quickening it in all the powers thereof with spiritual life: then follow those living actions of faith, hope, love, etc. performed by the strength of inherent and assisting grace. Wherefore we are not to imagine that faith is infused either before or without other graces, or that the soul is not at the same time and as soon disposed to love and fear God as to believe in Him, or to humility, to patience, to charity, to repentance, as for faith. The seed of all these graces is sown at once; and for their habits they are coeval stems of one common root of inherent sanctity: though yet some of them shoot up faster and bear fruit sooner than other. … Hence this conclusion is to be observed: 1. That faith properly is not the root of all other graces, nor the first degree of our sanctification and spiritual life. Take faith in which sense we please, for the act or for the habit: If for the act, the habit [inward power] is before that, and the root of it; If for the habit, that is not before, but a part of our sanctification, nor yet a solitary habit infused alone by itself, but together with the actus primi [first act], or habits of all supernatural graces whatsoever. Tis true in some sense that before faith, there is no life nor sanctity in the soul: because faith is a part of our life of grace and of sanctity. But there are other parts too, hope, charity, etc. and of these it may be said as well as of faith, there’s no grace in the soul till hope and charity be wrought in it. All are parts of our spiritual life wrought together. For as the corporal, so the spiritual life is not one distinct, but omnes actus primi, of every faculty whereby it can work regularly. And though in the body some part may live alone, and others be dead, yet in our spiritual life tis far otherwise, all powers are quickened and live together: where the habit of one grace is, there are all, and as soon all, as one, every faculty being rectified as well as any: and all the operations of each faculty tending to all its objects, renewed as well as any one operation directed to some one object. Wherefore I see not, under correction of quick eyes, how faith can be accounted the root whence spring all other fruits of righteousness, the efficient cause of our sanctification, the only pipe through which the waters of life flow into the soul, that firstborn grace in our spiritual regeneration, so much that before its actual operation there is no jot of spiritual life and sanctity in our hearts. Many divine eulogies are given to faith in the Scriptures, but none such as to cause us to make it the fountain of all graces. That the heart is regenerate before the act of believing and other graces wrought therein, together with the habit of faith, may appear by these reasons: 1. It is the true and general doctrine of all divines, that actual faith is never wrought in the soul till, besides the supernatural illumination of the understanding, the will be also changed and freed in part from its natural perversness: For till this be done, tis utterly impossible it should ever embrace the promise. Now the doing away of this ignorance and rebellion, what is it but an effect of the grace of sanctification implanted in the soul, by which it is sweetly and freely inclined to all heavenly things? 2. To believe is an action of a man living by grace, not dead in sin. The soul therefore is first endued with the life of grace before it can perform this living action. 3. There can be no reason given why in our regeneration it should be necessary first to have faith before we can have any other grace of sanctification, no more than that it should be needful to have some other grace before we can have faith; or, why we are more fit being unconverted to receive the grace of faith rather than any other grace, as of repentance, etc. A man unregenerate, having no preparations at all to any grace, is alike disposed to receive every one: and so there is no difference on man’s part. If any say that the Spirit, which must work other graces, is not received till we do actually believe: in so saying he confutes himself, it being most apparant that the Spirit is given to men incredulous [unbelieving], to the end to make them believers: and no man should ever be converted were not the Holy Ghost given to him whilst he is unconverted, to work his conversion. Now God, that for Christ’s sake gives faith unto us when we had none, without any predisposition in us to receive it, can and does for the same Christ’s sake give us all other graces as well at the same time. 4. It cannot well be shown how faith produces all other virtues in us, seeing that all habits of grace are infused, not acquired; and one habit cannot produce another, nor does one habit bring forth the operations of another. Tis true that faith lends a hand to help forward all gracious actions, and does much in their guidance and direction; but tis like as the understanding guides the actions of the will and inferiour faculties, or as prudence moderates the actions of all other moral virtues; which actions notwithstanding come from their proper faculties and habits as their immediate principia and fountains. But of this point more at large when we come to show the dependance that obedience has upon faith. Against this may be objected that: We live by faith, Gal. 2:20, that by faith Christ dwells in our hearts, Eph. 3:17, that through faith we are risen with Christ, Col. 2:12, that by faith we receive the Holy Ghost, Jn. 7:38-39; Eph. 1:13, so that we have no life till we be in Christ, no being in Him till we have faith to believe on Him, no sap from the vine, no virtue from the body till we be united as branches, as members, which union is by faith only; no Spirit of grace to give us life till we have faith to receive it. In briefe thus: Christ by his Spirit is the author of all our spiritual life and sanctification. But till we believe we have no participation nor fellowship with Christ and his Spirit. Therefore till we believe we have in us no life at all, and consequently by faith we are made partakers of all life and grace. To which I answer: We must carefully distinguish between a twofold union and communion we have with Christ: 1. By the Spirit on his part: for Christ as by his death, he is the meritorious cause of life and grace unto the elect, so by his Spirit He is the only efficient of life and grace in the regenerate. To whom, whilst they are yet dead in sin and destitute of all grace, so as they neither do nor possibly can believe, Christ sends his Spirit which breathes life into them, changes and purifies their nature by working all holy and rectified abilities in every part. Now this first work of the Spirit, creating of grace in the soul, does most apparantly precede not only the act of believing, but the habit also: for the habit itself is infused by this work. And therefore it is also manifest that before all faith we have and must have some participation with Christ, even to this end that we may have faith. But this union with Him is wrought merely by the Holy Spirit, which is that band whereby Christ knits Himself to us, communicating all gracious and quickening virtue from Himself to us, and thereby making us living members of his body. 2. By our faith on our parts: when being quickened by infused grace we actually apply ourselves to embrace the promise and to rely upon Christ only. And here we knit ourselves to Christ, resting upon Him alone for all comfort. By which uniting of ourselves to Christ we receive a greater increase and larger measure of grace from Him. In the first union we were insensible of it, and grace is given to us non petentibus, that asked not after it: in this second union we are most sensible of its comfort and benefit; and here an augmentation of grace is bestowed on us petentes, earnestly suing for it, and by faith expecting the receiving of it. Wherefore I conclude, all grace and virtue whatsoever in us is given us from the fulness of Christ, the fountain of all supernatural life; but yet all is not wrought by Christ embraced by our faith, but by Christ conveying his grace unto us by his Spirit. This first quickens us: we then with Lazarus after life put into us, can awake, stand up, come forth, and by faith look on Him that raised us, fall down, worship and believe in Him as our Lord and God. The places alleged either touch not our sanctification at all, or speak only of the increase of grace, not of its first infusion, faith being a means of that, but no efficient or instrument of this.</p></blockquote>

the fountain of all graces. That the heart is regenerate before the act of believing and other graces wrought therein, together with the habit of faith, may appear by these reasons: 1. It is the true and general doctrine of all divines, that actual faith is never wrought in the soul till, besides the supernatural illumination of the understanding, the will be also changed and freed in part from its natural perversness: For till this be done, tis utterly impossible it should ever embrace the promise. Now the doing away of this ignorance and rebellion, what is it but an effect of the grace of sanctification implanted in the soul, by which it is sweetly and freely inclined to all heavenly things? 2. To believe is an action of a man living by grace, not dead in sin. The soul therefore is first endued with the life of grace before it can perform this living action. 3. There can be no reason given why in our regeneration it should be necessary first to have faith before we can have any other grace of sanctification, no more than that it should be needful to have some other grace before we can have faith; or, why we are more fit being unconverted to receive the grace of faith rather than any other grace, as of repentance, etc. A man unregenerate, having no preparations at all to any grace, is alike disposed to receive every one: and so there is no difference on man’s part. If any say that the Spirit, which must work other graces, is not received till we do actually believe: in so saying he confutes himself, it being most apparant that the Spirit is given to men incredulous [unbelieving], to the end to make them believers: and no man should ever be converted were not the Holy Ghost given to him whilst he is unconverted, to work his conversion. Now God, that for Christ’s sake gives faith unto us when we had none, without any predisposition in us to receive it, can and does for the same Christ’s sake give us all other graces as well at the same time. 4. It cannot well be shown how faith produces all other virtues in us, seeing that all habits of grace are infused, not acquired; and one habit cannot produce another, nor does one habit bring forth the operations of another. Tis true that faith lends a hand to help forward all gracious actions, and does much in their guidance and direction; but tis like as the understanding guides the actions of the will and inferiour faculties, or as prudence moderates the actions of all other moral virtues; which actions notwithstanding come from their proper faculties and habits as their immediate principia and fountains. But of this point more at large when we come to show the dependance that obedience has upon faith. Against this may be objected that: We live by faith, Gal. 2:20, that by faith Christ dwells in our hearts, Eph. 3:17, that through faith we are risen with Christ, Col. 2:12, that by faith we receive the Holy Ghost, Jn. 7:38-39; Eph. 1:13, so that we have no life till we be in Christ, no being in Him till we have faith to believe on Him, no sap from the vine, no virtue from the body till we be united as branches, as members, which union is by faith only; no Spirit of grace to give us life till we have faith to receive it. In briefe thus: Christ by his Spirit is the author of all our spiritual life and sanctification. But till we believe we have no participation nor fellowship with Christ and his Spirit. Therefore till we believe we have in us no life at all, and consequently by faith we are made partakers of all life and grace. To which I answer: We must carefully distinguish between a twofold union and communion we have with Christ: 1. By the Spirit on his part: for Christ as by his death, he is the meritorious cause of life and grace unto the elect, so by his Spirit He is the only efficient of life and grace in the regenerate. To whom, whilst they are yet dead in sin and destitute of all grace, so as they neither do nor possibly can believe, Christ sends his Spirit which breathes life into them, changes and purifies their nature by working all holy and rectified abilities in every part. Now this first work of the Spirit, creating of grace in the soul, does most apparantly precede not only the act of believing, but the habit also: for the habit itself is infused by this work. And therefore it is also manifest that before all faith we have and must have some participation with Christ, even to this end that we may have faith. But this union with Him is wrought merely by the Holy Spirit, which is that band whereby Christ knits Himself to us, communicating all gracious and quickening virtue from Himself to us, and thereby making us living members of his body. 2. By our faith on our parts: when being quickened by infused grace we actually apply ourselves to embrace the promise and to rely upon Christ only. And here we knit ourselves to Christ, resting upon Him alone for all comfort. By which uniting of ourselves to Christ we receive a greater increase and larger measure of grace from Him. In the first union we were insensible of it, and grace is given to us non petentibus, that asked not after it: in this second union we are most sensible of its comfort and benefit; and here an augmentation of grace is bestowed on us petentes, earnestly suing for it, and by faith expecting the receiving of it. Wherefore I conclude, all grace and virtue whatsoever in us is given us from the fulness of Christ, the fountain of all supernatural life; but yet all is not wrought by Christ embraced by our faith, but by Christ conveying his grace unto us by his Spirit. This first quickens us: we then with Lazarus after life put into us, can awake, stand up, come forth, and by faith look on Him that raised us, fall down, worship and believe in Him as our Lord and God. The places alleged either touch not our sanctification at all, or speak only of the increase of grace, not of its first infusion, faith being a means of that, but no efficient or instrument of this.”

— William Pemble, Vindiciæ gratiæ. = A Plea for Grace, More especially the Grace of Faith… (London: 1627), pp. 11-16">Copy</button><a class="share" href="https://x.com/intent/post?text=%E2%80%9CNow+to+make+application+of+this+to+our+inquiry+touching+the+original+of+faith%2C+you+may+perceive+by+what+is+spoken%2C+whereof+faith+is+a+part%2C+and+when+faith+is+wrought+in+the+soule%3A+namely%2C+that+faith+is+a+part+of+our+sanctification%2C+that+faith+is+wrought+in+the+soul+then+when+we+are+regenerate+by+the+infusion+of+the+habit+%5Binward+power%5D+of+grace+into+our+whole+man.+This+will+appear+if+we+distinguish+between%3A+1.+The+habit+of+faith%2C+which+is+in+general+the+renewed+quality+of+the+soul%2C+whereby+it+is+made+able+to+discern+and+yield+assent+unto%2C+and+also+willing+to+put+affiance+in+all+divine+truth+revealed.+2.+The+act+of+faith%2C+when+the+understanding+and+will+do+actually+know+and+rely+upon+God%E2%80%99s+truth+and+goodness.+This+is+a+fruit+of+the+former%2C+and+follows+it+in+time%3B+the+former+is+a+branch+of+the+image+of+God+restored+unto+us%2C+a+stream+of+the+common+fountain+of+sanctification%2C+whence+all+graces+flow%2C+a+part+of+our+inherent+righteousness%2C+as+is+most+apparant%3A+It+being+impossible+that+the+understanding+and+will+of+man+should+be+effectually+inclined+towards+their+spiritual+and+supernatural+object%2C+to+give+credence+and+put+confidence+in+it%2C+until+such+time+as+they+be+first+rectified+by+grace+and+purged+from+their+habitual+inbred+blindness+and+rebellion%3A+Which+change+when+it+is+wrought+in+the+soul+by+the+Spirit+of+grace%2C+sanctifying+and+quickening+it+in+all+the+powers+thereof+with+spiritual+life%3A+then+follow+those+living+actions+of+faith%2C+hope%2C+love%2C+etc.+performed+by+the+strength+of+inherent+and+assisting+grace.+Wherefore+we+are+not+to+imagine+that+faith+is+infused+either+before+or+without+other+graces%2C+or+that+the+soul+is+not+at+the+same+time+and+as+soon+disposed+to+love+and+fear+God+as+to+believe+in+Him%2C+or+to+humility%2C+to+patience%2C+to+charity%2C+to+repentance%2C+as+for+faith.+The+seed+of+all+these+graces+is+sown+at+once%3B+and+for+their+habits+they+are+coeval+stems+of+one+common+root+of+inherent+sanctity%3A+though+yet+some+of+them+shoot+up+faster+and+bear+fruit+sooner+than+other.+%E2%80%A6+Hence+this+conclusion+is+to+be+observed%3A+1.+That+faith+properly+is+not+the+root+of+all+other+graces%2C+nor+the+first+degree+of+our+sanctification+and+spiritual+life.+Take+faith+in+which+sense+we+please%2C+for+the+act+or+for+the+habit%3A+If+for+the+act%2C+the+habit+%5Binward+power%5D+is+before+that%2C+and+the+root+of+it%3B+If+for+the+habit%2C+that+is+not+before%2C+but+a+part+of+our+sanctification%2C+nor+yet+a+solitary+habit+infused+alone+by+itself%2C+but+together+with+the+actus+primi+%5Bfirst+act%5D%2C+or+habits+of+all+supernatural+graces+whatsoever.+Tis+true+in+some+sense+that+before+faith%2C+there+is+no+life+nor+sanctity+in+the+soul%3A+because+faith+is+a+part+of+our+life+of+grace+and+of+sanctity.+But+there+are+other+parts+too%2C+hope%2C+charity%2C+etc.+and+of+these+it+may+be+said+as+well+as+of+faith%2C+there%E2%80%99s+no+grace+in+the+soul+till+hope+and+charity+be+wrought+in+it.+All+are+parts+of+our+spiritual+life+wrought+together.+For+as+the+corporal%2C+so+the+spiritual+life+is+not+one+distinct%2C+but+omnes+actus+primi%2C+of+every+faculty+whereby+it+can+work+regularly.+And+though+in+the+body+some+part+may+live+alone%2C+and+others+be+dead%2C+yet+in+our+spiritual+life+tis+far+otherwise%2C+all+powers+are+quickened+and+live+together%3A+where+the+habit+of+one+grace+is%2C+there+are+all%2C+and+as+soon+all%2C+as+one%2C+every+faculty+being+rectified+as+well+as+any%3A+and+all+the+operations+of+each+faculty+tending+to+all+its+objects%2C+renewed+as+well+as+any+one+operation+directed+to+some+one+object.+Wherefore+I+see+not%2C+under+correction+of+quick+eyes%2C+how+faith+can+be+accounted+the+root+whence+spring+all+other+fruits+of+righteousness%2C+the+efficient+cause+of+our+sanctification%2C+the+only+pipe+through+which+the+waters+of+life+flow+into+the+soul%2C+that+firstborn+grace+in+our+spiritual+regeneration%2C+so+much+that+before+its+actual+operation+there+is+no+jot+of+spiritual+life+and+sanctity+in+our+hearts.+Many+divine+eulogies+are+given+to+faith+in+the+Scriptures%2C+but+none+such+as+to+cause+us+to+make+it+the+fountain+of+all+graces.+That+the+heart+is+regenerate+before+the+act+of+believing+and+other+graces+wrought+therein%2C+together+with+the+habit+of+faith%2C+may+appear+by+these+reasons%3A+1.+It+is+the+true+and+general+doctrine+of+all+divines%2C+that+actual+faith+is+never+wrought+in+the+soul+till%2C+besides+the+supernatural+illumination+of+the+understanding%2C+the+will+be+also+changed+and+freed+in+part+from+its+natural+perversness%3A+For+till+this+be+done%2C+tis+utterly+impossible+it+should+ever+embrace+the+promise.+Now+the+doing+away+of+this+ignorance+and+rebellion%2C+what+is+it+but+an+effect+of+the+grace+of+sanctification+implanted+in+the+soul%2C+by+which+it+is+sweetly+and+freely+inclined+to+all+heavenly+things%3F+2.+To+believe+is+an+action+of+a+man+living+by+grace%2C+not+dead+in+sin.+The+soul+therefore+is+first+endued+with+the+life+of+grace+before+it+can+perform+this+living+action.+3.+There+can+be+no+reason+given+why+in+our+regeneration+it+should+be+necessary+first+to+have+faith+before+we+can+have+any+other+grace+of+sanctification%2C+no+more+than+that+it+should+be+needful+to+have+some+other+grace+before+we+can+have+faith%3B+or%2C+why+we+are+more+fit+being+unconverted+to+receive+the+grace+of+faith+rather+than+any+other+grace%2C+as+of+repentance%2C+etc.+A+man+unregenerate%2C+having+no+preparations+at+all+to+any+grace%2C+is+alike+disposed+to+receive+every+one%3A+and+so+there+is+no+difference+on+man%E2%80%99s+part.+If+any+say+that+the+Spirit%2C+which+must+work+other+graces%2C+is+not+received+till+we+do+actually+believe%3A+in+so+saying+he+confutes+himself%2C+it+being+most+apparant+that+the+Spirit+is+given+to+men+incredulous+%5Bunbelieving%5D%2C+to+the+end+to+make+them+believers%3A+and+no+man+should+ever+be+converted+were+not+the+Holy+Ghost+given+to+him+whilst+he+is+unconverted%2C+to+work+his+conversion.+Now+God%2C+that+for+Christ%E2%80%99s+sake+gives+faith+unto+us+when+we+had+none%2C+without+any+predisposition+in+us+to+receive+it%2C+can+and+does+for+the+same+Christ%E2%80%99s+sake+give+us+all+other+graces+as+well+at+the+same+time.+4.+It+cannot+well+be+shown+how+faith+produces+all+other+virtues+in+us%2C+seeing+that+all+habits+of+grace+are+infused%2C+not+acquired%3B+and+one+habit+cannot+produce+another%2C+nor+does+one+habit+bring+forth+the+operations+of+another.+Tis+true+that+faith+lends+a+hand+to+help+forward+all+gracious+actions%2C+and+does+much+in+their+guidance+and+direction%3B+but+tis+like+as+the+understanding+guides+the+actions+of+the+will+and+inferiour+faculties%2C+or+as+prudence+moderates+the+actions+of+all+other+moral+virtues%3B+which+actions+notwithstanding+come+from+their+proper+faculties+and+habits+as+their+immediate+principia+and+fountains.+But+of+this+point+more+at+large+when+we+come+to+show+the+dependance+that+obedience+has+upon+faith.+Against+this+may+be+objected+that%3A+We+live+by+faith%2C+Gal.+2%3A20%2C+that+by+faith+Christ+dwells+in+our+hearts%2C+Eph.+3%3A17%2C+that+through+faith+we+are+risen+with+Christ%2C+Col.+2%3A12%2C+that+by+faith+we+receive+the+Holy+Ghost%2C+Jn.+7%3A38-39%3B+Eph.+1%3A13%2C+so+that+we+have+no+life+till+we+be+in+Christ%2C+no+being+in+Him+till+we+have+faith+to+believe+on+Him%2C+no+sap+from+the+vine%2C+no+virtue+from+the+body+till+we+be+united+as+branches%2C+as+members%2C+which+union+is+by+faith+only%3B+no+Spirit+of+grace+to+give+us+life+till+we+have+faith+to+receive+it.+In+briefe+thus%3A+Christ+by+his+Spirit+is+the+author+of+all+our+spiritual+life+and+sanctification.+But+till+we+believe+we+have+no+participation+nor+fellowship+with+Christ+and+his+Spirit.+Therefore+till+we+believe+we+have+in+us+no+life+at+all%2C+and+consequently+by+faith+we+are+made+partakers+of+all+life+and+grace.+To+which+I+answer%3A+We+must+carefully+distinguish+between+a+twofold+union+and+communion+we+have+with+Christ%3A+1.+By+the+Spirit+on+his+part%3A+for+Christ+as+by+his+death%2C+he+is+the+meritorious+cause+of+life+and+grace+unto+the+elect%2C+so+by+his+Spirit+He+is+the+only+efficient+of+life+and+grace+in+the+regenerate.+To+whom%2C+whilst+they+are+yet+dead+in+sin+and+destitute+of+all+grace%2C+so+as+they+neither+do+nor+possibly+can+believe%2C+Christ+sends+his+Spirit+which+breathes+life+into+them%2C+changes+and+purifies+their+nature+by+working+all+holy+and+rectified+abilities+in+every+part.+Now+this+first+work+of+the+Spirit%2C+creating+of+grace+in+the+soul%2C+does+most+apparantly+precede+not+only+the+act+of+believing%2C+but+the+habit+also%3A+for+the+habit+itself+is+infused+by+this+work.+And+therefore+it+is+also+manifest+that+before+all+faith+we+have+and+must+have+some+participation+with+Christ%2C+even+to+this+end+that+we+may+have+faith.+But+this+union+with+Him+is+wrought+merely+by+the+Holy+Spirit%2C+which+is+that+band+whereby+Christ+knits+Himself+to+us%2C+communicating+all+gracious+and+quickening+virtue+from+Himself+to+us%2C+and+thereby+making+us+living+members+of+his+body.+2.+By+our+faith+on+our+parts%3A+when+being+quickened+by+infused+grace+we+actually+apply+ourselves+to+embrace+the+promise+and+to+rely+upon+Christ+only.+And+here+we+knit+ourselves+to+Christ%2C+resting+upon+Him+alone+for+all+comfort.+By+which+uniting+of+ourselves+to+Christ+we+receive+a+greater+increase+and+larger+measure+of+grace+from+Him.+In+the+first+union+we+were+insensible+of+it%2C+and+grace+is+given+to+us+non+petentibus%2C+that+asked+not+after+it%3A+in+this+second+union+we+are+most+sensible+of+its+comfort+and+benefit%3B+and+here+an+augmentation+of+grace+is+bestowed+on+us+petentes%2C+earnestly+suing+for+it%2C+and+by+faith+expecting+the+receiving+of+it.+Wherefore+I+conclude%2C+all+grace+and+virtue+whatsoever+in+us+is+given+us+from+the+fulness+of+Christ%2C+the+fountain+of+all+supernatural+life%3B+but+yet+all+is+not+wrought+by+Christ+embraced+by+our+faith%2C+but+by+Christ+conveying+his+grace+unto+us+by+his+Spirit.+This+first+quickens+us%3A+we+then+with+Lazarus+after+life+put+into+us%2C+can+awake%2C+stand+up%2C+come+forth%2C+and+by+faith+look+on+Him+that+raised+us%2C+fall+down%2C+worship+and+believe+in+Him+as+our+Lord+and+God.+The+places+alleged+either+touch+not+our+sanctification+at+all%2C+or+speak+only+of+the+increase+of+grace%2C+not+of+its+first+infusion%2C+faith+being+a+means+of+that%2C+but+no+efficient+or+instrument+of+this.%E2%80%9D%0A%0A%E2%80%94+William+Pemble%2C+Vindici%C3%A6+grati%C3%A6.+%3D+A+Plea+for+Grace%2C+More+especially+the+Grace+of+Faith%E2%80%A6+%28London%3A+1627%29%2C+pp.+11-16&amp;url=https%3A%2F%2F5solasquotes.github.io%2Fquote%2F55961cc683.html&amp;via=5Solas" target="_blank" rel="noopener">Share on X</a><a class="perma" href="../quote/55961cc683.html">Permalink</a><a class="src" href="https://reformedbooksonline.com/that-a-certain-inherent-holiness-or-graces-repentance-is-requisite-by-way-of-order-accompaniment-to-faith-in-christ-justification/#:~:text=Now%20to%20make%20application%20of%20this,no%20efficient%20or%20instrument%20of%20this&amp;text=Now%20to%20make%20application%20of%20this%20to%20our&amp;text=that%2C%20but%20no%20efficient%20or%20instrument%20of%20this" rel="noopener" target="_blank">Read it online · Reformed Books Online</a></div>

<blockquote><p>Assertion 11. That the promises of the Gospel are holden forth to sinners, as sinners, has a twofold sense: 1. As that they be sinners and all [be] in a sinful condition to whom the promises are holden forth. This is most true and sound. The Kingdom of grace is an hospital and guest-house of sick ones, fit for the art and mercy of the Physician Christ. 2. So as they are all immediately to believe and apply Christ and the promises, who are sinners; and there be nothing required of sinners but that they may all immediately challenge interest in Christ, after their own way and order, without humiliation or any Law-work. In this sense it is most false that the promises are holden forth to sinners as sinners, because then Christ should be holden forth to all sinners, Americans, Indians and sinners who never by the least rumor heard one word of Christ. 2. Peter desires not Simon Magus to believe that God had loved him in Christ Jesus with an everlasting love, nor does the Gospel-promise offer immediately soul-rest to the hardened and proud sinner wallowing in his lusts, as he is a hardened sinner; nor is the acceptable year of the Lord proclaimed, nor beauty and the oil of joy offered immediately to any but to those who are weary and laden and who mourn in Zion and wallow in ashes, Mt. 11:28-30; Isa. 61:1-3. It’s true, to all within the visible Church Christ is offered without price or money, but to be received after Christ’s fashion and order, not after our order; that is, after the soul is under self-despair of salvation and in the sinner’s month, when he has been with child of hell. I grant, in regard of time, sinners cannot come too soon to Christ, nor too early to wisdom; but in regard of order, many come too soon and unprepared. Simon Magus too soon believed. Saltmarsh says He misbelieved too soon, for he falsely believed: none can believe too soon. Answer: To believe too soon is to misbelieve, and Saltmarsh and Antinomians teach us the method of false-believing when they teach us too soon to believe; that is, to believe that God has loved you (be ye what ye will, Simon Magus, Judas or others) with an everlasting love, for that is the Antinomian Faith. Simon Magus is without any foregoing humiliation or sense of sin, or self-despair, to believe he was no less written in the Lamb’s book of life from eternity than Peter; and this he cannot believe soon enough. I say, neither soon or late ought a reprobate to believe any such thing. A covetous man who had great possessions [the rich young ruler] had not yet bidden farewell to his old god mammon when he came to Christ; therefore he departed sad from Christ. Another came before he had buried his father; and some come, Lk. 14:28-29, before they advise with their strength and what Christ will cost them. I desire I be not mistaken: none can be thoroughly fitted for Christ before he come to Christ; but it is as true some would buy the pearl before they sell all they have, which is not the wise merchant’s part: and they err foully who argue thus, If I were not a sinner, or if my sins were less heinous, and so I were less unworthy, I would come to Christ and believe; but ah, I am so grievous an offender and so unworthy that I cannot go. Their antecedent is true, but the consequence is naught and wicked. It is true, I am sick, and [it is] good that I both say and feel that I am sick; but, therefore, I cannot, I will not go to the Physician: that is wicked logic and the contrary consequence is good: whereas the other consequence is a seeking of righteousness in ourselves.</p></blockquote>

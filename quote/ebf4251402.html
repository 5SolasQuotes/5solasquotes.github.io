<main class="wrap"><figure class="quote" id="q-ebf4251402" data-kw="">
<blockquote><p>We maintain to start with that, when God raised up Luther and others, who held forth a torch to light us into the way of salvation on on whose ministry our churches are founded and built, those heads of doctrine in which the truth of our religion, those in which the pure and legitimate worship of God, and those in which the salvation of man are comprehended, were in a great measure obsolete.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/john-calvin.html">John Calvin</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Necessity of Reforming the Church</cite>, from his Supplex Exhortatio (1543; The Necessity of Reforming the Church) written at the request of Martin Bucer and written for Charles V and the Diet of Spire to clarify the state of the question between the Protestants and Rome.</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/the-church.html">The Church</a></span></div>

</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-7c9d5dcde2" data-kw="">
<blockquote><p>…to speak somewhat of doctrine. I doubt not but you know how necessary a thing the knowledge of Christ’s doctrine is. For if the mind be stirred up with lively teachng, to put full confidence in Christ, and is after this confidence fully inflamed with the love of religion, honesty, and goodness, it is almost necessary all kinds of vices to reign there where no voice instructed with godly sentences is heard, Christ must needs be unknown there, where his benefits with all his acts lie unspoken of… You amongst all men are chosen for great causes, your honour is to restore Christ’s doctrine, and to appoint such as will and shall be able to teach the gospel, to amend the ceremonies, and to put a difference between the ministers of the Church.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/johannes-sturm.html">Johannes Sturm</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Epistle that Johan Sturmius</cite>, … sent to the Cardinals and Prelates that were chosen and appointed by the Bishop of Rome, to search out the Abuses of the Church (London, 1538), no page number Sturm (1507–1589) was a German educator and Protestant reformer.</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/the-church/creeds-confessions-and-councils.html">Creeds, Confessions and Councils</a></span></div>

%20the%20Church" rel="noopener" target="_blank">Read it online · Reformed Books Online</a></div>
</figure><figure class="quote" id="q-cc2bc892b1" data-kw="">
<blockquote><p>Sacraments are holy signs and seals of the covenant of grace, immediately instituted by God, to represent Christ and his benefits, and to confirm our interest in him; as also, to put a visible difference between those that belong unto the church and the rest of the world; and solemnly to engage them to the service of God in Christ, according to his Word.</p></blockquote>

<main class="wrap"><figure class="quote" id="q-6a15cfada7" data-kw="">
<blockquote><p>27. But ordinances about such circumstances as place, time and the like are rightly said by the best authorities to be partly divine and partly human. They are grounded in part upon the will of God because of their chief and primary purpose, and partly upon man’s prudence, insofar as a special observation agreeable to God’s will is concerned. If no human error is made in this matter, the ordinance is to be held as wholly divine. It is the will of God that the church meet at the most convenient hour of the day, all circumstances considered. If, therefore, no error occurs in estimating the circumstances, the hour assigned for meeting after due consideration must be acknowledged as if appointed by God.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/william-ames.html">William Ames</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Marrow of Theology 3rd</cite>, tr. John D. Eusden (1623; Baker, 1997), bk. 2, in ch. 14, ‘The Manner of Divine Worship’, section 27, p. 286</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/church-government-and-the-ministry/forms-of-government.html">Forms of Government</a></span></div>

<blockquote><p>16. If the power of the keys be given to believers, as believers [as congregationalists say], because Christ is their King, Priest and Prophet, and all things are theirs, Paul, Apollo, Cephas, the world? 1. It is asked, if none have the power of the keys, but believers, and if all acts pastoral of preaching, binding and loosing, excommunicating performed by unbelieving ministers and professors be not hence made null, as performed à non habentibus potestatem, as if Turks and pagans had performed these? We think they must be null. 2. We think children baptized by unbelieving ministers not baptized. 3. An unbelieving pastor not essentially a pastor. 4. If, because Christ is given to the elect, and all things are theirs, and so all ministerial power of the keys, it is questioned, if amongst these all things given to the believers, we may not include the magistrate’s sword, the king’s power, the master’s power over the servant, the captain’s power over the soldier, so that by that same reason there be no kings, no judges, no masters, no captains, save only believers, we see not how this follows not, as well as that the power of the keys, and all things are given to believers, because Christ is given to them.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/samuel-rutherford.html">Samuel Rutherford</a></span><span class="wk"><span class="lbl">Work:</span> <cite>A Peaceable &amp; Temperate Plea for Paul’s Presbytery in Scotland</cite>, … (1642), ch. 18, p. 276</span></figcaption>

</figure><figure class="quote" id="q-e23ee680bb" data-kw="">
<blockquote><p>So may we say, can any man forbid bread and wine, that these should not receive the Lord’s Supper, which have received the Holy Ghost; and have in some degree all spiritual qualifications requisite in communicants. They have the word of promise, which is the greater; who can inhibit the sign which is the less? They are Mr. Geree his words for the baptism of infants. They are faederati, therefore they must be signati. It is Mr. Marshal’s argument upon the same subject; and mutatis mutandis applyable to our purpose. Perhaps you will say, you would willingly give believers their right, but prophane and scandalous persons will also intrude [into the Supper] who have no right: What if they do? If you have no power or authority from Christ to keep them back by yourself; If you have used the utmost of your power to erect an eldership in the congregation; if you have used your power of order to the utmost for keeping them back by exhortation, if you mourn for their intrusion, wherein are you to be blamed? Because they do wrong, will you do no right? And shall the saints be debarred their dues, because these wretches without your allowance, sieze upon what is undue, that unto which they have no right?</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/henry-jeanes.html">Henry Jeanes</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Want of Church-Government</cite>, … (London, 1650) Jeanes was an English presbyterian., pp. 35-36</span></figcaption>

<blockquote><p>In England it [civilly] belongs: 1. to the patron to present; 2. to the bishop to ordain and institute, and therefore to approve and invest; 3. to the people jure divino to be free consenters; 4. and to the magistrate to protect and to judge who shall be protected or tolerated under him. If now these four parties be for four ministers or for three, or two several men, and cannot agree in one, the culpable dissenters will be the causes of the schism.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/richard-baxter.html">Richard Baxter</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Nonconformists’ Plea for Peace, or an Account of their Judgment in Certain Things in which they are Misunderstood</cite>, … (London, 1679), sect. 6, p. 50</span></figcaption>

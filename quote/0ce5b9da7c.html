<main class="wrap"><figure class="quote" id="q-0ce5b9da7c" data-kw="">
<blockquote><p>We are under so gracious a covenant that all our services are accepted; not only our honey, but honeycomb; not only our wine, but our milk; our weak services as well as our strong; because the Spirit which we have from him sweeteneth all.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/richard-sibbes.html">Richard Sibbes</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Love of Christ</cite>, (1639; Edinburgh: Banner of Truth, 2011), p. 49.</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/the-covenant-of-grace.html">The Covenant of Grace</a></span></div>
<div class="actions"><button class="copy" data-copy="“We are under so gracious a covenant that all our services are accepted; not only our honey, but honeycomb; not only our wine, but our milk; our weak services as well as our strong; because the Spirit which we have from him sweeteneth all.”

— Richard Sibbes, The Love of Christ, (1639; Edinburgh: Banner of Truth, 2011), p. 49.">Copy</button><a class="share" href="https://x.com/intent/post?text=%E2%80%9CWe+are+under+so+gracious+a+covenant+that+all+our+services+are+accepted%3B+not+only+our+honey%2C+but+honeycomb%3B+not+only+our+wine%2C+but+our+milk%3B+our+weak+services+as+well+as+our+strong%3B+because+the+Spirit+which+we+have+from+him+sweeteneth+all.%E2%80%9D%0A%0A%E2%80%94+Richard+Sibbes%2C+The+Love+of+Christ%2C+%281639%3B+Edinburgh%3A+Banner+of+Truth%2C+2011%29%2C+p.+49.&amp;url=https%3A%2F%2F5solasquotes.github.io%2Fquote%2F0ce5b9da7c.html&amp;via=5Solas" target="_blank" rel="noopener">Share on X</a><a class="perma" href="../quote/0ce5b9da7c.html">Permalink</a><a class="src" href="https://reformedcovenanter.wordpress.com/2019/10/25/richard-sibbes-on-the-covenant-of-grace-and-gods-acceptance-of-our-imperfect-good-works/" rel="noopener" target="_blank">Read it online · Reformed Covenanter</a></div>
</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-7302550d0c" data-kw="">
<blockquote><p>Ye,” says Christ, “who are evil, know how to do good to your children” (Mt. 7:11); what then are we to expect from the very fountain of goodness? As, then, parents are not willingly angry with their children, nor handle them roughly, there is no doubt but that God never punishes men except when He is constrained. There is, as I have said, an impropriety in the expression, but it is enough to know, that God derives no pleasure from the miseries of men, as profane men say, who utter such blasphemies as these, that we are like balls with which God plays, and that we are exposed to many evils, because God wishes to have as it were, a pleasant and delectable spectacle in looking on the innumerable afflictions, and at length on the death of men. That such thoughts, then, might not tempt us to unbelief, the prophet here puts a check on us, and declares that God does not afflict from his heart, that is, willingly, as though He delighted in the evils of men, as a judge, who, when he ascends his throne and condemns the guilty to death, does not do this from his heart, because he wishes all to be innocent, and thus to have a reason for acquitting them; but yet he willingly condemns the guilty, because this is his duty. So also God, when He adopts severity towards men, He indeed does so willingly, because He is the judge of the world; but He does not do so from the heart, because He wishes all to be innocent—for far away from Him is all fierceness and cruelty; and as He regards men with paternal love, so also He would have them to be saved, were they not as it were by force to drive Him to rigor. And this feeling he also expresses in Isaiah, “Ah! I will take consolation from mine adversaries.” (Isa. 1:24) He calls them adversaries who so often provoked Him by their obstinacy; yet He was led unwillingly to punish their sins, and hence He employed a particle expressive of grief, and exclaimed ‘Ah!’ as a father who wishes his son to be innocent, and yet is compelled to be severe with him.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/john-calvin.html">John Calvin</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Commentary on Lamentations</cite>, 3 | verse 33, “For he doth not afflict willingly nor grieve the children of men.”</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/the-covenant-of-grace/the-gospel-offer.html">The Gospel Offer</a></span></div>

</figure><figure class="quote" id="q-ec33576fe8" data-kw="">
<blockquote><p>God’s effectual calling is that, whereby God calleth out of darkness into his admirable light, from the power of Satan unto God, in Christ Jesus, those whom he knew from eternity, and predestinated unto life, of his mere favour, by the promulgation of the covenant of grace, or preaching of the Gospel.

Such also as be called by the same grace of God, answer, and believe in him through Jesus Christ. This answer is of faith, which is, in very truth, the condition of the promise which is in the covenant of grace. Wherefore our effectual calling doth consist of the promise of the covenant (which is under condition of faith) and in faith also, which is nothing else but the fulfilling of the condition.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/robert-rollock.html">Robert Rollock</a></span><span class="wk"><span class="lbl">Work:</span> <cite>A treatise of God’s effectual calling</cite>, trans. Henry Holland (London: Felix Kingston, 1603), p. 1.</span></figcaption>

<blockquote><p>13. …There is all in God that is good, and perfect, and excellent in our desires and wishes for the conversion and salvation of wicked men. As, for instance, there is a love to holiness, absolutely considered, or an agreeableness of holiness to his nature and will; or, in other words, to his natural inclination. The holiness and happiness of the creature, absolutely considered, are things that he loves. These things are infinitely more agreeable to his nature than to ours. There is all in God that belongs to our desire of the holiness and happiness of unconverted men and reprobates, excepting what implies imperfection. All that is consistent with infinite knowledge, wisdom, power, self-sufficience, infinite happiness, and immutability. Therefore, there is no reason that his absolute prescience, or his wise determination and ordering what is future, should hinder his expressing this disposition of his nature, in like manner as we are wont to express such a disposition in ourselves, viz. by calls and invitations, and the like.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/jonathan-edwards.html">Jonathan Edwards</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Remarks on Important Theological Controversies</cite>, ch. 3, “Concerning the Divine Decrees in General, &amp; Election in Particular,” from paragraphs 9 &amp; 13, in The Works of Jonathan Edwards, ed. Edward Hickman (†1758), vol. 2, pp. 527-28 and in Select Works (Banner of Truth), 2:528</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/the-covenant-of-grace/the-gospel-offer.html">The Gospel Offer</a></span></div>

<blockquote><p>But the truth is, the Law as pressed upon Israel was not a Covenant of Works. 1. The Law as the Law or as a Covenant of Works is made with perfect men who need no mercy; But this Covenant is made with sinners, with an express preface of mercy: I am the Lord thy God that brought thee out of the land of Egypt, etc. It is made with stiff-necked Israel, Deuteronomy 29; Deuteronomy 30-32, and that is called a Covenant from the end and object, as motions are denominate from their end: for the end of the Lord’s pressing the Law upon them was to bring them under a blessed necessity to seek salvation in their true City of Refuge Christ Jesus, who redeemed them out of the spiritual bondage of sin.

2. It was the Covenant made with Abraham, which was a Covenant of Grace: and though it be called, Deuteronomy 29:1, a Covenant beside that which was made in Horeb: Because 1) Renewed again after their breach. 2) Repeated a little before the death of Moses, Deuteronomy 31:28-30. 3. Because there were some additions of special blessings, cursings, Ceremonial Commands, that were not in the formerly proposed Covenant, Exodus 20, yet the same it was in substance, to love the Lord with all the heart, Deuteronomy 2:10, 12-14. The same with that of Abraham, Deuteronomy 8:18. That he may establish his Covenant, which he sware unto thy fathers, as it is this day. When he is to deliver them out of Egypt, Exodus 2:24. And God heard their groaning, and remembered his covenant with Abraham and Isaac and Jacob. So the Lord expounds it in his appearing to Moses, Exodus 3:6; Jeremiah 31; 32. Not according to the Covenant which I made with their fathers, in the day that I took them by the hand, to bring them out of the Land of Egypt. Now that was the Covenant which God made with Abraham, of which circumcision was a seal, Genesis 17, not of a temporary Canaan only, but of heart Circumcision, Colossians 2:11. For the Lord expressly tells them, when he took them by the hand as his married people, to bring them out of the Land of Egypt, and out of the house of bondage, Exodus 20.

He meant no other covenant then he made with Abraham, of believing, Genesis 15, and of walking before him and being perfect, Genesis 17:1, 2, which is somewhat more legal, as Moses, and the Lord himself expounds it, Exodus 2:24; Exodus 3:6; Exodus 20:1-2. And he shows them, Leviticus 26, if in their enemy’s land they repent and shall come out and meet the rod, and their uncircumcised hearts shall willingly accept of the punishment of their iniquity: Leviticus 26:42. Then (saith the Lord) I will remember, Beside there are not here three Covenants, but one, there is no word of the subservient Covenant with Israel in Sinai. Except that when he mentions the one, he excludes not the other. For to walk before the Lord required in Abraham’s Covenant, Genesis 17:1, is to walk in all the ways of the Lord, to fear and love him, (Deuteronomy 10:12, 13) and Samuel (1 Samuel 12:22), Joshua (Joshua 24:22-25). And Mary (Luke 1:55) and Zachariah (Luke 1:70, 72-73) refer to the Covenant made with Abraham to give Canaan to his seed, verse 10, Deuteronomy 7:12. If thou hearken to these judgments to do them, it shall come to pass that the Lord thy God will keep unto thee the Covenant of mercy that he sware unto thy fathers, etc.</p></blockquote>

<div class="meta"><span class="t"><a href="../topics/the-covenant-of-grace.html">The Covenant of Grace</a></span></div>
<div class="actions"><button class="copy" data-copy="“But the truth is, the Law as pressed upon Israel was not a Covenant of Works. 1. The Law as the Law or as a Covenant of Works is made with perfect men who need no mercy; But this Covenant is made with sinners, with an express preface of mercy: I am the Lord thy God that brought thee out of the land of Egypt, etc. It is made with stiff-necked Israel, Deuteronomy 29; Deuteronomy 30-32, and that is called a Covenant from the end and object, as motions are denominate from their end: for the end of the Lord’s pressing the Law upon them was to bring them under a blessed necessity to seek salvation in their true City of Refuge Christ Jesus, who redeemed them out of the spiritual bondage of sin.

2. It was the Covenant made with Abraham, which was a Covenant of Grace: and though it be called, Deuteronomy 29:1, a Covenant beside that which was made in Horeb: Because 1) Renewed again after their breach. 2) Repeated a little before the death of Moses, Deuteronomy 31:28-30. 3. Because there were some additions of special blessings, cursings, Ceremonial Commands, that were not in the formerly proposed Covenant, Exodus 20, yet the same it was in substance, to love the Lord with all the heart, Deuteronomy 2:10, 12-14. The same with that of Abraham, Deuteronomy 8:18. That he may establish his Covenant, which he sware unto thy fathers, as it is this day. When he is to deliver them out of Egypt, Exodus 2:24. And God heard their groaning, and remembered his covenant with Abraham and Isaac and Jacob. So the Lord expounds it in his appearing to Moses, Exodus 3:6; Jeremiah 31; 32. Not according to the Covenant which I made with their fathers, in the day that I took them by the hand, to bring them out of the Land of Egypt. Now that was the Covenant which God made with Abraham, of which circumcision was a seal, Genesis 17, not of a temporary Canaan only, but of heart Circumcision, Colossians 2:11. For the Lord expressly tells them, when he took them by the hand as his married people, to bring them out of the Land of Egypt, and out of the house of bondage, Exodus 20.

He meant no other covenant then he made with Abraham, of believing, Genesis 15, and of walking before him and being perfect, Genesis 17:1, 2, which is somewhat more legal, as Moses, and the Lord himself expounds it, Exodus 2:24; Exodus 3:6; Exodus 20:1-2. And he shows them, Leviticus 26, if in their enemy’s land they repent and shall come out and meet the rod, and their uncircumcised hearts shall willingly accept of the punishment of their iniquity: Leviticus 26:42. Then (saith the Lord) I will remember, Beside there are not here three Covenants, but one, there is no word of the subservient Covenant with Israel in Sinai. Except that when he mentions the one, he excludes not the other. For to walk before the Lord required in Abraham’s Covenant, Genesis 17:1, is to walk in all the ways of the Lord, to fear and love him, (Deuteronomy 10:12, 13) and Samuel (1 Samuel 12:22), Joshua (Joshua 24:22-25). And Mary (Luke 1:55) and Zachariah (Luke 1:70, 72-73) refer to the Covenant made with Abraham to give Canaan to his seed, verse 10, Deuteronomy 7:12. If thou hearken to these judgments to do them, it shall come to pass that the Lord thy God will keep unto thee the Covenant of mercy that he sware unto thy fathers, etc.”

— Samuel Rutherford, The Covenant of Life Opened; or, a Treatise of the Covenant of Grace, ed. C. M. McMahon (1654; New Lennox IL, 2005), pp 110-11.">Copy</button><a class="share" href="https://x.com/intent/post?text=%E2%80%9CBut+the+truth+is%2C+the+Law+as+pressed+upon+Israel+was+not+a+Covenant+of+Works.+1.+The+Law+as+the+Law+or+as+a+Covenant+of+Works+is+made+with+perfect+men+who+need+no+mercy%3B+But+this+Covenant+is+made+with+sinners%2C+with+an+express+preface+of+mercy%3A+I+am+the+Lord+thy+God+that+brought+thee+out+of+the+land+of+Egypt%2C+etc.+It+is+made+with+stiff-necked+Israel%2C+Deuteronomy+29%3B+Deuteronomy+30-32%2C+and+that+is+called+a+Covenant+from+the+end+and+object%2C+as+motions+are+denominate+from+their+end%3A+for+the+end+of+the+Lord%E2%80%99s+pressing+the+Law+upon+them+was+to+bring+them+under+a+blessed+necessity+to+seek+salvation+in+their+true+City+of+Refuge+Christ+Jesus%2C+who+redeemed+them+out+of+the+spiritual+bondage+of+sin.%0A%0A2.+It+was+the+Covenant+made+with+Abraham%2C+which+was+a+Covenant+of+Grace%3A+and+though+it+be+called%2C+Deuteronomy+29%3A1%2C+a+Covenant+beside+that+which+was+made+in+Horeb%3A+Because+1%29+Renewed+again+after+their+breach.+2%29+Repeated+a+little+before+the+death+of+Moses%2C+Deuteronomy+31%3A28-30.+3.+Because+there+were+some+additions+of+special+blessings%2C+cursings%2C+Ceremonial+Commands%2C+that+were+not+in+the+formerly+proposed+Covenant%2C+Exodus+20%2C+yet+the+same+it+was+in+substance%2C+to+love+the+Lord+with+all+the+heart%2C+Deuteronomy+2%3A10%2C+12-14.+The+same+with+that+of+Abraham%2C+Deuteronomy+8%3A18.+That+he+may+establish+his+Covenant%2C+which+he+sware+unto+thy+fathers%2C+as+it+is+this+day.+When+he+is+to+deliver+them+out+of+Egypt%2C+Exodus+2%3A24.+And+God+heard+their+groaning%2C+and+remembered+his+covenant+with+Abraham+and+Isaac+and+Jacob.+So+the+Lord+expounds+it+in+his+appearing+to+Moses%2C+Exodus+3%3A6%3B+Jeremiah+31%3B+32.+Not+according+to+the+Covenant+which+I+made+with+their+fathers%2C+in+the+day+that+I+took+them+by+the+hand%2C+to+bring+them+out+of+the+Land+of+Egypt.+Now+that+was+the+Covenant+which+God+made+with+Abraham%2C+of+which+circumcision+was+a+seal%2C+Genesis+17%2C+not+of+a+temporary+Canaan+only%2C+but+of+heart+Circumcision%2C+Colossians+2%3A11.+For+the+Lord+expressly+tells+them%2C+when+he+took+them+by+the+hand+as+his+married+people%2C+to+bring+them+out+of+the+Land+of+Egypt%2C+and+out+of+the+house+of+bondage%2C+Exodus+20.%0A%0AHe+meant+no+other+covenant+then+he+made+with+Abraham%2C+of+believing%2C+Genesis+15%2C+and+of+walking+before+him+and+being+perfect%2C+Genesis+17%3A1%2C+2%2C+which+is+somewhat+more+legal%2C+as+Moses%2C+and+the+Lord+himself+expounds+it%2C+Exodus+2%3A24%3B+Exodus+3%3A6%3B+Exodus+20%3A1-2.+And+he+shows+them%2C+Leviticus+26%2C+if+in+their+enemy%E2%80%99s+land+they+repent+and+shall+come+out+and+meet+the+rod%2C+and+their+uncircumcised+hearts+shall+willingly+accept+of+the+punishment+of+their+iniquity%3A+Leviticus+26%3A42.+Then+%28saith+the+Lord%29+I+will+remember%2C+Beside+there+are+not+here+three+Covenants%2C+but+one%2C+there+is+no+word+of+the+subservient+Covenant+with+Israel+in+Sinai.+Except+that+when+he+mentions+the+one%2C+he+excludes+not+the+other.+For+to+walk+before+the+Lord+required+in+Abraham%E2%80%99s+Covenant%2C+Genesis+17%3A1%2C+is+to+walk+in+all+the+ways+of+the+Lord%2C+to+fear+and+love+him%2C+%28Deuteronomy+10%3A12%2C+13%29+and+Samuel+%281+Samuel+12%3A22%29%2C+Joshua+%28Joshua+24%3A22-25%29.+And+Mary+%28Luke+1%3A55%29+and+Zachariah+%28Luke+1%3A70%2C+72-73%29+refer+to+the+Covenant+made+with+Abraham+to+give+Canaan+to+his+seed%2C+verse+10%2C+Deuteronomy+7%3A12.+If+thou+hearken+to+these+judgments+to+do+them%2C+it+shall+come+to+pass+that+the+Lord+thy+God+will+keep+unto+thee+the+Covenant+of+mercy+that+he+sware+unto+thy+fathers%2C+etc.%E2%80%9D%0A%0A%E2%80%94+Samuel+Rutherford%2C+The+Covenant+of+Life+Opened%3B+or%2C+a+Treatise+of+the+Covenant+of+Grace%2C+ed.+C.+M.+McMahon+%281654%3B+New+Lennox+IL%2C+2005%29%2C+pp+110-11.&amp;url=https%3A%2F%2F5solasquotes.github.io%2Fquote%2Fb5462ddb6d.html&amp;via=5Solas" target="_blank" rel="noopener">Share on X</a><a class="perma" href="../quote/b5462ddb6d.html">Permalink</a><a class="src" href="https://reformedcovenanter.wordpress.com/2018/11/20/samuel-rutherford-on-the-mosaic-covenant-and-the-covenant-of-grace-1/" rel="noopener" target="_blank">Read it online · Reformed Covenanter</a></div>

<blockquote><p>III. The same controversy was afterwards renewed among the Romanists, some of whom defended the universality of redemption (with the Semipelagians), others its particularity (with Augustine and his genuine disciples). This controversy lay principally between the Jesuits and Jansenists, of whom the former (an offshoot of the Pelagians) warmly contend for the universality of Christ’s death, while the latter with great firmness defend its particularity, following their founder, Jansen, who has argued this subject very largely and with great solidity in his Augustinus (‘De Gratia Christi Salvatoris,’ 3.20 [1640/1964]. pp. 369-80), his Apologia Jansenii published in 1644, Art. 17,19,20+ and in Catechismo de Gratia, c. 7, de Predesti. q. 65+.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/francis-turretin.html">Francis Turretin</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Institutes, vol. 2, Question 14</cite>, p. 456</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/priestly-office-satisfaction-and-atonement/extent-of-the-atonement.html">Extent of the Atonement</a></span></div>

</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-b852c57569" data-kw="">
<blockquote><p>Futher, though all men are not brought to salvation, yet the merit and grace of Christ, was of itself sufficient for all men.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/peter-martyr-vermigli.html">Peter Martyr Vermigli</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Most Learned &amp; Fruitful Commentaries… upon… Romans… (London: Iohn Daye, 1558)</cite>, p. 116b</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/priestly-office-satisfaction-and-atonement/extent-of-the-atonement.html">Extent of the Atonement</a></span></div>
<div class="actions"><button class="copy" data-copy="“Futher, though all men are not brought to salvation, yet the merit and grace of Christ, was of itself sufficient for all men.”

— Peter Martyr Vermigli, Most Learned &amp; Fruitful Commentaries… upon… Romans… (London: Iohn Daye, 1558), p. 116b">Copy</button><a class="share" href="https://x.com/intent/post?text=%E2%80%9CFuther%2C+though+all+men+are+not+brought+to+salvation%2C+yet+the+merit+and+grace+of+Christ%2C+was+of+itself+sufficient+for+all+men.%E2%80%9D%0A%0A%E2%80%94+Peter+Martyr+Vermigli%2C+Most+Learned+%26+Fruitful+Commentaries%E2%80%A6+upon%E2%80%A6+Romans%E2%80%A6+%28London%3A+Iohn+Daye%2C+1558%29%2C+p.+116b&amp;url=https%3A%2F%2F5solasquotes.github.io%2Fquote%2Fb852c57569.html&amp;via=5Solas" target="_blank" rel="noopener">Share on X</a><a class="perma" href="../quote/b852c57569.html">Permalink</a><a class="src" href="https://reformedbooksonline.com/on-the-sufficiency-of-the-atonement/#:~:text=Futher%2C%20though%20all%20men%20are%20not,of%20itself%20sufficient%20for%20all%20men." rel="noopener" target="_blank">Read it online · Reformed Books Online</a></div>
</figure><figure class="quote" id="q-e320c2c7f1" data-kw="">
<blockquote><p>Hence in vain is alleged [by Socinians]: 1. The innocence of Christ, as if it impeded his right of bearing our punishments (Socinus, part 3, ch. 9). For Christ himself professes that he has the right of laying down his life and that he lays it down for his sheep (John 10:15,18). But it rests on this, that God made him, our sponsor (Heb 7:22), to be sin for us, imputatively, that he might be pressed by the exactions of our debts (as the word אָשָׁם indicates), that is, that he might pay our penalties (Isa 53:7), which same thing is most clearly suggested when Christ is said to have suffered ὑπὲρ ἡμῶν, that is, in our place and stead. When therefore he is said to have been made a curse for us in order to remove the curse from us (Gal 3:13), why should we doubt his most rigid and strict satisfaction in our place? I admit indeed that the word ὑπὲρ sometimes has a wider sense and is joined with such a verb by which some benefit is said to be procured for another, as Paul says that he suffered for (ὑπὲρ) the church of God (Eph 3:1,13, Col 1:24), which Volkelius objects to (ibid.). But I say that when Scripture speaks of the sufferings of Christ, it indicates by it such a substitution by which Christ took upon himself the punishments to be borne by us, concerning which Paul, discussing them, denies that he [Paul] was crucified for the Corinthians (1 Cor 1:13). And certainly Socinus himself (ibid.) says that God manifested true justice concerning the innocent Christ, and Scripture says that peace and salvation flow to us from his sufferings (Isa 53:5). Let the good man explain to us here punishment without respect to sin, and free God from cruelty according to his view, [God] who burdened his most beloved and innocent Son with such great and dire torments, and indeed with justice administering it, if to punish the innocent for the guilty is a sign of utmost cruelty, as the Socinian axiom has it.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/johannes-hoornbeeck.html">Johannes Hoornbeeck</a></span><span class="wk"><span class="lbl">Work:</span> <cite>‘Theological Disputation on the Satisfaction of Christ’ tr. by AI by Onku (Utrecht, 1650) Latin</cite></span></figcaption>
<div class="meta"><span class="t"><a href="../topics/priestly-office-satisfaction-and-atonement/extent-of-the-atonement.html">Extent of the Atonement</a></span></div>

</figure><figure class="quote" id="q-a1e1024785" data-kw="">
<blockquote><p>VIII. We do very much differ from this opinion [of Arminians]: We acknowledge that Christ died for all; but we deny that by his death salvation and forgiveness of sin is obtained for all men: or that reconciliation is made for Cain, Pharaoh, Saul, Judas, etc. Neither do we think that remission of sins is obtained for anyone whose sins are not remitted, or that salvation was purchased for him, whom God from eternity has decreed to condem: For this were a vaine purchase. We deny that election is after the death of Christ, as for many other causes, so also because Christ in the very agony of death gave a notable proof of election in the thief, whose heart He affected, and enlightned his mind after an unutterable manner; the other thief being left and neglected. And seeing Christ does everywhere say that He died for his sheep, and for those whom his Father gave Him, He does sufficiently declare that He died for the elect. IX. And when we say that Christ died for all, we take it thus, to wit, that the death of Christ is sufficient to save whosoever do believe, yea, and that it is sufficient to save all men, if all men in the whole world did believe in Him: And that the cause why all men are not saved, is not in the insufficiency of the death of Christ, but in the wickedness and incredulity of man. Finally Christ may be said to reconcile all men to God by his death after the same manner that we say that the sun does enlighten the eyes of all men, although many are blind, many sleep, and many are hid in darkeness: Because if all and several men had their eyes and were awake, and were in the midst of the light, the light of the sun were sufficient to enlighten them. Neither is it any doubt but that it may be said, not only that Christ died for all men, but also that all men are saved by Christ, because among men, there is none saved but by Christ: After the same manner that the apostle says, 1 Cor. 15:20, that all men are made alive by Christ, because no man is made alive but by Him.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/pierre-du-moulin.html">Pierre Du Moulin</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Anatomy of Arminianism… (1619; London, 1635), ch. 27, ‘How far, and in what sense Christ died for all’</cite>, pp. 226-28</span></figcaption>

<blockquote><p>9. The object of this wrath was not Christ as such. It was connected only with that punishment which He underwent as our surety.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/william-ames.html">William Ames</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Marrow of Theology tr. John D. Eusden (1623; Baker, 1997), ch. 22, ‘The Death of Christ’</cite>, p. 142</span></figcaption>

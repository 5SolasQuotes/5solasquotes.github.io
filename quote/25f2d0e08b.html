<main class="wrap"><figure class="quote" id="q-25f2d0e08b" data-kw="">
<blockquote><p>There are two sorts of things belonging to the church. Some which are intrinsical, and belonging to the soul or inward man, directly and primarily. Such things are not to be dispensed and administered by the civil magistrate:

I mean the word and sacraments, the keys of the kingdom of heaven, the suspension or excommunication of church officers or members, the ordination or deposition of officers, the determination and resolution from Scripture of controversies concerning the faith, the worship of God, the government of the church, cases of conscience.

These being in their nature, end, and use, merely spiritual, and belonging not to the outward man, but to the inward man or soul, are committed and entrusted to the pastors and other ruling officers of the church, and are not of civil and extrinsical, but of ecclesiastical and intrinsical cognisance and judgment.

There are other things belonging to the church, which are extrinsical, and do properly belong to the outward man, and are common to the church with other human societies or corporations: things of this kind fall within the civil jurisdiction; for the churches of Christ, being societies of men and women, and parts of commonwealths, are accountable unto and punishable by the civil magistrate, in their bodies, lives, civil liberties, and temporal estates, for trespasses against the law of God or the law of the land.

By the law of God I understand here jus divinum naturale, that is, the moral law or Decalogue, as it bindeth all nations (whether Christians or infidels), being the law of the Creator and King of nations. The magistrate, by his authority, may, and in duty ought, to keep his subjects within the bounds of external obedience to that law, and punish the external man with external punishments for external trespasses against that law.

From this obligation of the law, and subjection to the corrective power of the magistrate, Christian subjects are no more exempted than heathen subjects, but rather more straitly obliged. So that if any such trespass is committed by church officers or members, the magistrate hath power and authority to summon, examine, judge, and (after just conviction and to punish these, as well as other men. We do therefore abominate the disloyal papal tenet, that clergymen are not to be examined and judged by civil, but by ecclesiastical courts only, even in causes civil and criminal.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/george-gillespie.html">George Gillespie</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Aaron’s Rod Blossoming; or, The Divine Ordinance of Church Government Vindicated</cite>, (1646; Edinburgh: Robert Ogle, and Oliver &amp; Boyd, 1844), Book 2.8, p. 121.</span></figcaption>

<blockquote><p>Query 1. Are believers freed from obedience to the Moral Law; or from the Moral Law as a Rule of obedience? There are some who positively or peremptorily affirm that we are freed from the Law as a Rule, and we are not, since Christ, tied to the obedience of it. Others say it still remains in force as a Rule of Obedience, though it is abolished in other respects. We are still under the conduct and commands of the Law, though not under the curses and penalties of it. Others say, again, that we are freed from the law as given by Moses, and are only tied to the obedience of it as it is given by Christ. And though they are subject to those commands, and that Law which Moses gave, yet not as he gave it, but as Christ renews it; and as it comes out of the hand, and from the authority of Christ. Joh 13.34, A new commandment I give you, that you love one another. This is a commandment, for Christ is both a Savior and a Lord; and it is a new one — not that it didn’t exist before; but because it is now renewed, and we have it immediately from the hands of Christ. I will not dislike this much; I acknowledge the Moral Law as a Rule of obedience and of Christian walking; and there will be no falling out, whether you take it as promulgated by Moses, or as handed to you and renewed by Christ. Indeed, the Law as it is considered as a Rule, can no more be abolished or changed, than the nature of good and evil can be abolished and changed. The substance of the Law is the sum of doctrine concerning piety towards God, charity towards our neighbors, temperance and sobriety towards ourselves. And for the substance of it, it is Moral and Eternal, and cannot be abrogated. We grant the circumstances, that they were but temporary and changeable, and we now have nothing to do with the Promulgator, Moses; nor the place, Mount Sinai; nor the time, fifty days after they came out of Egypt; nor yet that it was written on Tablets of stone, delivered with thunder and lightning, etc. We don’t look to Sinai the hill of bondage, but to Zion the mountain of Grace. And we take the Law as the Image of the divine Will of God, which we desire to obey, but from which we do not expect life and favor, nor fear death and rigor. And this, I conceive, is the concurrent opinion of all Divines. The Law is abrogated in respect to its power to justify or condemn; but it still remains in force to direct us in our lives. It condemns sin in the faithful, though it cannot condemn the faithful for sin. Far be that profane opinion from us, to take away the Law as a Rule, which is an inflexible rule of living. By teaching, admonishing, chiding, and reproving, it prepares us for every good work, as Calvin says. The Law is void for its damnatory power, not its directory power; we are not under its curse, but we are still under its commands.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/samuel-bolton.html">Samuel Bolton</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The True Bounds of Christian Freedom</cite>, (London, 1545; 1656), 31.</span></figcaption>

</figure><figure class="quote" id="q-aca7e1212a" data-kw="images worship denied">
<blockquote><p>The question is not whether images may be made which ought to be valued by us (whether we regard the artist, material or antiquity, or even on account of the prototype, if he is a man of some reputation, dear to us). Rather the question is: Should any religious worship (whether called adoration or veneration) be paid to images of God and the saints made by the hand of men? Among our opponents, there is no agreement on this point, some roundly showing adoration, others however, to avoid odium, urging only veneration. But this is an empty distinction. Since religious worship is only one and does not admit of various species, it is equally such by whatever name it may be designated.</p></blockquote>

<blockquote><p>Q. What is the third rule?

A. When the Law forbiddeth or commandeth any thing, it forbiddeth and commandeth all means, occasions, and provocations thereunton.

Q. What is the fourth rule?

A. Whatsoever the Law commands, it forbids the contrary; whatsoever it forbids, it commandeth the contrary. […]

Q. Why are all the Commandments (except two) set down negatively?

A. Because the Negative bindeth more strongly: for the Negative precept bindeth always, and to all moments of time; the Affirmative bindeth always, but not to all moments of time.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/thomas-cartwright.html">Thomas Cartwright</a></span><span class="wk"><span class="lbl">Work:</span> <cite>A treatise of Christian religion. Or the whole body and substance of divinity</cite>, (London, 1616), p. 88.</span></figcaption>

<main class="wrap"><figure class="quote" id="q-7767b7e4ca" data-kw="">
<blockquote><p>A Shorter Prayer to use a little before the Communion.

O Lord Jesu, who callest me to thy Table, be pleased to meet me, and bring me to it thy self. Give me the two wings of faith and love to raise my heart to thee. O Son of God, who hast given thy self for me, and dost at this time give thy self to me, open thou my heart to receive thee, give me holy affections to entertain thee. That with a confidence tempered with humility and a joy full of holy trembling, I receive this high mystery of my salvation, yea, that I enjoy thine own self really and truly.

O thou that wouldst be conceived in the Virgin’s womb, be conceived again in my heart, that hereafter I may live with thy life. O thou that wouldst die for me, make me now feel the efficacy of thy death in the comfort of my soul and the mortification of my sinful affections.

O thou that art risen from the dead, and ascended to heaven, work a resurrection of holiness in my heart, and a lively faith to ascend to heaven after thee. There to embrace thee, and hold thee, while I take with my hand the outward elements of bread and wine. O bread of life come feed my soul. O holy Ghost give me the true taste of these great mercies. And for the fruits of thy bounty let me ever return the fruits of my love and thankfulness.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/peter-du-moulin.html">Peter Du Moulin</a></span><span class="wk"><span class="lbl">Work:</span> <cite>A week of soliloquies and prayers. With a preparation for the Holy Communion</cite>, (London: H. Moseley, 1657), pp 256-58.</span></figcaption>

</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-ca0fc6eac3" data-kw="">
<blockquote><p>The posture of kneeling in the receiving of this sacrament is a peculiar act of religious adoration, which hath no divine institution or warranty; and is therefore at best an act of will-worship, not to be complied withal.

It is said that “kneeling is required not as an act of worship or religious adoration; but only as a posture decent and comely, because the sacrament is delivered with a prayer unto every one.” But,—

(1.) That delivery of it with a prayer unto every one is uninstituted, without primitive example, contrary to the practice at the first institution of the ordinance, unsuited to the nature of the communion required, and a disturbance of it.

(2.) He that prays stands, and he that doth not pray kneels, which must be another consideration; for,—

(3.) Prayer is not the proper exercise of faith in the instant of receiving of this sacrament, as is evident from the nature and use of it.

(4.) The known original of this rite doth render it not only justly to be suspected, but to be avoided.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/john-owen.html">John Owen</a></span><span class="wk"><span class="lbl">Work:</span> <cite>An Answer unto Two Questions: with Twelve Arguments against any Conformity to Worship not of Divine Institution</cite>, (1720) in William H. Goold (ed.), The Works of John Owen, D.D. (24 vols, Edinburgh: T. &amp; T. Clark, 1850-53), 16: 247.</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/the-lords-supper.html">The Lord&#x27;s Supper</a></span></div>

</figure><figure class="quote" id="q-2ae291e61b" data-kw="">
<blockquote><p>Christ hath ordained the holy Communion in remembrance of himself: men do neither retain any remembrance of Christ, nor yet Communion, but have changed all the whole matter into a gay shew, and almost a stage play. Christ saith, Ye shall have the poor always with you, but me ye shall not have always, I leave the world and go to my father: It is expedient for you that I go away: and Christ spake this, not of his Godhead, wherewith he was equal to the father, or of his heavenly nature, but of his body:

Men say, that Christ neither hath with his body left the world, nor yet gone from hence to his father. Paul saith that Christ is in heaven at the right hand of the father, Peter saith in the Acts of the Apostles, Heaven must hold him until the time that all things are restored: Men say, That the body of Christ is in heaven and in earth both at once, and is dispersed into an infinite multitude of places at one time. Paul saith, yet Christ hath once entered into the holy places, &amp; hath with one only sacrifice, &amp; one oblation, made perfect all things: Men say, that they can sacrifice Christ himself again every day, not only for remembrance sake, but in very deed, and that in infinite places.

Christ saith, Thou shalt worship the Lord thy God, and him only shalt thou serve: Men worship the Eucharist, a lack the while, being neither Lord nor God, but a sacrament of the Lord, without authority of the scriptures, or example of the Apostles, and that as God. For, by the living God I beseech you, consider in your minds brethren, who ever, I will not say of the Apostles, but of the holy fathers hath either worshipped the Sacrament himself, or hath shewed it forth to be worshipped of others?

I see that I speak these things not before the common sort of men, but before them who are profoundly learned, I appeal to all your consciences, I will use in this matter your own testimony. Christ hath commanded the Sacrament to be delivered whole: Men have torn the same after a miserable manner, Christ willed that nothing should be added to his law: Men do not only add many things, but the same they prefer before the word of God. But why should I reckon up more?

This only will I speak, and that in a word, they which brought in transubstantiations, masses, calling upon saints, sole life, purgatory, images, vows, trifles, follies, babbles, into the Church of God, have delivered new things, and which the scriptures never heard of. Whatsoever they cry or crake, they bring not an iota out of the word of God.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/john-jewell.html">John Jewell</a></span><span class="wk"><span class="lbl">Work:</span> <cite>A sermon made in Latin in Oxford in the reign of King Edward the sixth, by the learned and godly father John Jewel, late Bishop of Salisbury, and translated into English, by R.V. Dedicated unto the Bishop of London, as appeareth in the Commentary of Ma. Calvin, upon the Galatians, in English</cite>, (London, [1581]), unpaginated.</span></figcaption>

<blockquote><p>I hope no length of time, or change of circumstances, shall cause you to forget those solemn views of eternity, and impressions of your misery as a sinner, and those beginnings of the knowledge of the glory and love of Christ, which so deeply engaged your thoughts while with us. These gifts and callings of God, being according to the counsel of his eternal love, are without repentance on his part.

And though we, in ourselves, are unstable as water, and would soon mar the work, and cast away the charters of our eternal inheritance, he is the Rock, he changeth not, and will not suffer us essentially to change; but will bring judgment unto victory—bringing light out of our wretched darkness, order out of our confusion, and establishment and fresh displays of his power and love out of our faintings and backslidings.</p></blockquote>

<div class="actions"><button class="copy" data-copy="“I hope no length of time, or change of circumstances, shall cause you to forget those solemn views of eternity, and impressions of your misery as a sinner, and those beginnings of the knowledge of the glory and love of Christ, which so deeply engaged your thoughts while with us. These gifts and callings of God, being according to the counsel of his eternal love, are without repentance on his part.

And though we, in ourselves, are unstable as water, and would soon mar the work, and cast away the charters of our eternal inheritance, he is the Rock, he changeth not, and will not suffer us essentially to change; but will bring judgment unto victory—bringing light out of our wretched darkness, order out of our confusion, and establishment and fresh displays of his power and love out of our faintings and backslidings.”

<blockquote><p>1. In all three Gospels what Jesus gave the disciples is [in Greek] “artos,” meaning simply “bread.” It is striking that He is not said to have given them “azumos” or “azuma” which are the proper words for unleavened bread, AND which are clearly available since they are used in each of the Gospels in the context to refer to the Passover. In other words, the use of “artos” by Matthew, Mark and Luke to tell us what Jesus gave the disciples makes the fact that this may have been unleavened bread of NO importance. At the same time we also must recognize that because the Scripture NOWHERE calls it “unleavened bread,” we cannot at all be sure that it was (throughout the NT “artos” is used for common or leavened bread). We simply may not base our teaching on the silence of Scripture because then we are really basing our teaching on a human conjecture. So, the fundamental argument, “Jesus used unleavened bread, therefore we should too,” is in fundamental error. This should close the case, but there is more.

2. To use unleavened bread in the Lord’s Supper is to commemorate the wrong thing. The purpose of unleavened bread in the Passover is to commemorate the haste with which Israel left Egypt; there was not even enough time to put yeast into the bread dough. In the Lord’s Supper we are NOT commemorating the Exodus from Egypt where unleavened bread makes sense. In the Lord’s Supper we are commemorating the sacrifice of Christ for our sins. In the Supper the bread is broken to recall Christ’s suffering and death, the breaking of His body. Other things could be said, but there is nothing in unleavening the bread of the Supper that would commemorate anything in the death of Christ that is taught in Scripture (unless we really let our imaginations run loose here – and then we are back to conjecture).

3. Thus using unleavened bread in the Supper is an unwarranted return to Old Testament shadows (commemorating the Passover instead of Christ’s death) and therefore ought to be resisted. The historic Reformed characterization of the Mass as a return to OT shadows of pictorial ceremonialism is common and fits here.

4. “The kingdom of heaven is not food and drink, but righteousness and joy and peace in the Holy Spirit” (Romans 10). This teaches us that an emphasis on a detail of food is not characteristic of the New Testament, quite in contrast with the Old. Thus the insistence on unleavened bread in the Supper is more typical of an OT ceremony than an NT one. Ah, you say, this also applies to the wine. Indeed it does. None, I hope, would claim that those who use grape juice are celebrating something else than the Lord’s Supper. Nevertheless there is a positive argument to use wine in Christ’s words found in all three Gospels, “I will not eat of this fruit of the vine from now on, until I eat it new with you in the Kingdom of God.” The proper understanding of this “fruit of the vine” is wine. So we drink wine, looking forward to the heavenly supper in Christ’s presence where He will drink it with us.

5. Another old Reformed argument is that if Christ used unleavened bread, He was using the bread at hand in the Passover not out of symbolism but out of convenience. He did not go out of the way to obtain leavened bread. In the same way, runs the argument, we too should use our common bread (which IS leavened) and not go out of our way to obtain something special. This argument stands alongside one that says that in order to preserve the meaning of the Supper that we are nourished spiritually by Christ’s body, we should use the bread that we ordinarily use to nourish our bodies, and that would, of course, be leavened bread. These are theological arguments, not directly biblical, but I do think that they do carry the analogy of Scripture, especially in light of the very biblical fact that the kingdom of God is NOT details of food, as we noted above. 6. 1 Cor. 5:8 is not talking about WHAT we eat, but HOW we eat the Lord’s supper. It speaks of unleavened people, not about going back to replaying the Passover with its use of unleavened bread. The unleavened bread in the Passover reflects the haste with which Israel left Egypt, without time to even put yeast into their bread. The Lord’s supper reflects not on a hasty exit from Egypt, but on the death of Christ for our sins, which makes HIM “our passover.” The bread represents the body of Christ in the Lord’s Supper, unleavening the bread in the Supper has no significance with respect to Christ’s sacrifice. Thus using unleavened bread would, as mentioned above, be going back to the OT Passover as though we were still celebrating the Exodus from Egypt in the Supper, rather than Christ’s sacrifice for our sins. 7. In the rest of the New Testament the Lord’s Supper is often called “breaking bread,” the same language that is used for ordinary meals (Acts 2:42 for example is most likely speaking of fellowship in a meal rather than the Lord’s Supper because in the immediate context they “ate their bread from house to house.”) In any case, the word “artos” is used for what is broken. There is never a description of the Supper in the NT in which that which is broken or eaten is called anything but “artos.” This argues quite strongly against requiring unleavened bread in the Supper because “artos” in a general use would simply mean ordinary bread.</p></blockquote>

<main class="wrap"><figure class="quote" id="q-4112fbcb1a" data-kw="">
<blockquote><p>Against the learning of the Times, they make large Invectives; the Universities, and all the Colleges in them, they will have razed to the ground; they profess them to be worse than Monasteries that justly were abolished: whatever Arts and Sciences are taught in the Christian Schools, they count them idle and vain: Grammar, Rhetoric, Logic, Philosophy, are all unlawful Arts.

The Heathen Writers which are used in any Faculty, such as Aristotle, Plato, Cicero, and the like, they would have them all burnt, as the Authors of unlawful Arts. They reject all School-Degrees, such as Bachelors, Masters of Art, Doctors of any faculty. They will have no Students of Divinity. They tell us that youths mis-spend their time, and exceedingly abuse themselves, by studying of those things which usually are recommended unto them as preparations for the Ministry, whether Common places, Commentaries upon Scripture, or Protestant writers of Controversies; all such Books they will have laid aside; yea, it is their advice to reject all Books but the Bible alone.

As for Divinity-Disputations, they make large Invectives against them, as Paganish and very sinful Exercises; notwithstanding all this, they proclaim themselves great Patrons of all true Learning; albeit, as yet they have not been pleased to let the world know what kind of Letters and Books they will be pleased with, when all that hitherto have been known, are laid aside by their persuasion.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/robert-baillie.html">Robert Baillie</a></span><span class="wk"><span class="lbl">Work:</span> <cite>A dissuasive from the errors of the time</cite>, (London, 1645), p. 32.</span></figcaption>

</figure><figure class="quote" id="q-3257a990ce" data-kw="">
<blockquote><p>4. Mr. Hooker [a congregationalist] will not say all that were scattered, Acts 8[:4] (for they were all scattered, except the apostles, verse 1) did preach the Gospel, for there were of them women, verse 3; then some of them only preached. And if Mr. Hooker say they were not officers, Mr. Rutherford says they were officers, and that the extraordinariness of their condition supplied the want of a Church-calling, and let Mr. Hooker but attempt to bring a proof for it.

5. If nothing extraordinary was here, l […]t Mr. Hooker or any for him vindicate the place, Acts 8, from Anabaptists who allege the same place, Acts 8, to destroy the standing ordinance of the ministry: and read the judicious Tractate of the Ministers of London, of Mr. Collings.</p></blockquote>

</figure><figure class="quote" id="q-6220ca2321" data-kw="">
<blockquote><p>There is no hierarchy in the church of Christ (Luke 22:25–26; 2 Cor. 1:24; 1 Pet. 5:3). There is no such thing as a diocesan, cathedral, patriarchal, or metropolitan church, for in the New Testament all churches are equal and all have their own ἐπισκοποι; and believers are nowhere instructed to inquire into the legitimate succession of their ministers, but rather to examine the Scriptures and to remain in the teaching [handed down to them] (John 5:39; Acts 17:11; 1 Tim. 4:13–16; 2 Tim. 1:13–14; 3:14–17). Neither does legitimate succession guarantee purity of doctrine (John 8:39; Rom. 2:28; 9:6). [Such succession] would sooner make salvation dependent on certain specific persons and on impracticable, fallible, and often even impossible historical research.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/herman-bavinck.html">Herman Bavinck</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Reformed Dogmatics: God and Creation</cite>, vol. 4, §502</span></figcaption>

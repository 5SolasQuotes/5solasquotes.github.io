<blockquote><p>In his comprehensive series of disputations on creation that were originally held in 1638-1639, Voetius does not omit a discussion on how creation took place. In this context not much attention is given to the issue of the six days as such (although the work of creation is explained in its six days order), but Voetius maintains that creation took place in six days. He therefore rejects the ancient theory that the world was created at once (in instanti).</p></blockquote>

</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-4c5e512b11" data-kw="">
<blockquote><p>And once you have allowed yourself to see the truth that reason leads you to, what reason apprehends is (given the convertibility of the transcendentals) as good and beautiful as it is real. If you find yourself intellectually convinced that there is a divine Uncaused Cause who sustains the world and you in being at every instant, and don’t find this conclusion extremely strange and moving, something that leads you to a kind of reverence, then I dare say you haven’t understood it. Of course, there are those whose heads and hearts are so out of sync that they cannot follow both at the same time. But we shouldn’t mistake this pathology for an insight into human nature.</p></blockquote>

<blockquote><p>1st Conclusion. The relative expression of God which is in the works of God, is no formal ground of any adoration of the creatures. 1. Because adoration upon this ground, though the creatures, the host of heaven be excellent, is forbidden, Dt. 4:19. 2. [If it were the case, then] Not only images (which cannot represent God) and the sacraments, but all the creatures, even, rats, mice, flies, frogs, worms, Judas and wicked men, yea, and devils are to be worshipped, because all things having being are shadows and footsteps of God, their cause, first author and last end, Ps. 19:1; 103:22; Rom. 1:19-20; Acts 17:27-28; Prov. 16:4; Rev. 4:11; Rom. 11:36-37. 3. Because God is really, and by the diffusion of his blessed essence, present in all creatures, it follows not that we should adore them: The Formalists upon this ground, that Christ is really present in the sacrament, though the manner we know not, think that Christ should be adored in the sacrament, according to that, Verbum audimus, motum sentimus, modum nescimus. But if this be good logic, because we know not the way of the Spirit and how the bones grow in a woman with child, Eccl. 11:5, and God, where he works, is present by the immediation of essence and power, though we know not the way of his presence, we are to adore the soul of man and the bones of a young child in a woman’s belly; and though they should say that God-man Christ is in a more powerful and efficacious manner present in the sacrament than in the works of nature; yet should it follow that God is to be worshipped in the works of nature also, for magis et minus non variant speciem [greater or less does not vary the species]; for then we could not conclude any thing but this: Though there be not so real a ground of adoring lice and frogs as adoring of the sacrament, yet there is a ground, seeing God is, in the reality of his blessed essence, present in all creatures.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/samuel-rutherford.html">Samuel Rutherford</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Divine Right of Church Government</cite>, … (London, 1646) | section 2, p. 151, ch. 1, Question 5</span></figcaption>

<blockquote><p>It must first be reiterated that with extraordinary few exceptions no educated person in the history of Western Civilization from the third century B.C. onward believed that the earth was flat. A round earth appears at least as early as the sixth century BC with Pythagoras, who was followed by Aristotle, Euclid, and Aristarchus, among others in observing that the earth was a sphere. Although there were a few dissenters–Leukippos and Demokritos for example–by the time of Eratosthenes (3 c. BC), followed by Crates(2 c. BC), Strabo (3 c. BC), and Ptolemy (first c. AD), the sphericity of the earth was accepted by all educated Greeks and Romans. Nor did this situation change with the advent of Christianity. A fewóat least two and at most five–early Christian fathers denied the spherically of earth by mistakenly taking passages such as Ps. 104:2-3 as geographical rather than metaphorical statements. On the other side tens of thousands of Christian theologians, poets, artists, and scientists took the spherical view throughout the early, medieval, and modern church… No one before the 1830s believed that medieval people thought that the earth was flat… But now, why did the false accounts of Letronne and Irving become melded and then, as early as the 1860s, begin to be served up in schools and in schoolbooks as the solemn truth? The answer is that the falsehood about the spherical earth became a colorful and unforgettable part of a larger falsehood: the falsehood of the eternal war between science (good) and religion (bad) throughout Western history… The reason for promoting both the specific lie about the sphericity of the earth and the general lie that religion and science are in natural and eternal conflict in Western society, is to defend Darwinism. The answer is really only slightly more complicated than that bald statement. The flat-earth lie was ammunition against the creationists. The argument was simple and powerful, if not elegant: “Look how stupid these Christians are. They are always getting in the way of science and progress.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/j-b-russell.html">J.B. Russell</a></span><span class="wk"><span class="lbl">Work:</span> <cite>‘The Myth of the Flat Earth’</cite>, (1997) at The American Scientific Affiliation</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/creation/the-six-days.html">The Six Days</a></span></div>
<div class="actions"><button class="copy" data-copy="“It must first be reiterated that with extraordinary few exceptions no educated person in the history of Western Civilization from the third century B.C. onward believed that the earth was flat. A round earth appears at least as early as the sixth century BC with Pythagoras, who was followed by Aristotle, Euclid, and Aristarchus, among others in observing that the earth was a sphere. Although there were a few dissenters–Leukippos and Demokritos for example–by the time of Eratosthenes (3 c. BC), followed by Crates(2 c. BC), Strabo (3 c. BC), and Ptolemy (first c. AD), the sphericity of the earth was accepted by all educated Greeks and Romans. Nor did this situation change with the advent of Christianity. A fewóat least two and at most five–early Christian fathers denied the spherically of earth by mistakenly taking passages such as Ps. 104:2-3 as geographical rather than metaphorical statements. On the other side tens of thousands of Christian theologians, poets, artists, and scientists took the spherical view throughout the early, medieval, and modern church… No one before the 1830s believed that medieval people thought that the earth was flat… But now, why did the false accounts of Letronne and Irving become melded and then, as early as the 1860s, begin to be served up in schools and in schoolbooks as the solemn truth? The answer is that the falsehood about the spherical earth became a colorful and unforgettable part of a larger falsehood: the falsehood of the eternal war between science (good) and religion (bad) throughout Western history… The reason for promoting both the specific lie about the sphericity of the earth and the general lie that religion and science are in natural and eternal conflict in Western society, is to defend Darwinism. The answer is really only slightly more complicated than that bald statement. The flat-earth lie was ammunition against the creationists. The argument was simple and powerful, if not elegant: “Look how stupid these Christians are. They are always getting in the way of science and progress.”

— J.B. Russell, ‘The Myth of the Flat Earth’ (1997) at The American Scientific Affiliation">Copy</button><a class="share" href="https://x.com/intent/post?text=%E2%80%9CIt+must+first+be+reiterated+that+with+extraordinary+few+exceptions+no+educated+person+in+the+history+of+Western+Civilization+from+the+third+century+B.C.+onward+believed+that+the+earth+was+flat.+A+round+earth+appears+at+least+as+early+as+the+sixth+century+BC+with+Pythagoras%2C+who+was+followed+by+Aristotle%2C+Euclid%2C+and+Aristarchus%2C+among+others+in+observing+that+the+earth+was+a+sphere.+Although+there+were+a+few+dissenters%E2%80%93Leukippos+and+Demokritos+for+example%E2%80%93by+the+time+of+Eratosthenes+%283+c.+BC%29%2C+followed+by+Crates%282+c.+BC%29%2C+Strabo+%283+c.+BC%29%2C+and+Ptolemy+%28first+c.+AD%29%2C+the+sphericity+of+the+earth+was+accepted+by+all+educated+Greeks+and+Romans.+Nor+did+this+situation+change+with+the+advent+of+Christianity.+A+few%C3%B3at+least+two+and+at+most+five%E2%80%93early+Christian+fathers+denied+the+spherically+of+earth+by+mistakenly+taking+passages+such+as+Ps.+104%3A2-3+as+geographical+rather+than+metaphorical+statements.+On+the+other+side+tens+of+thousands+of+Christian+theologians%2C+poets%2C+artists%2C+and+scientists+took+the+spherical+view+throughout+the+early%2C+medieval%2C+and+modern+church%E2%80%A6+No+one+before+the+1830s+believed+that+medieval+people+thought+that+the+earth+was+flat%E2%80%A6+But+now%2C+why+did+the+false+accounts+of+Letronne+and+Irving+become+melded+and+then%2C+as+early+as+the+1860s%2C+begin+to+be+served+up+in+schools+and+in+schoolbooks+as+the+solemn+truth%3F+The+answer+is+that+the+falsehood+about+the+spherical+earth+became+a+colorful+and+unforgettable+part+of+a+larger+falsehood%3A+the+falsehood+of+the+eternal+war+between+science+%28good%29+and+religion+%28bad%29+throughout+Western+history%E2%80%A6+The+reason+for+promoting+both+the+specific+lie+about+the+sphericity+of+the+earth+and+the+general+lie+that+religion+and+science+are+in+natural+and+eter

<main class="wrap"><figure class="quote" id="q-a41ac9b02a" data-kw="">
<blockquote><p>As for Josh. 22:10, etc. [about the altar of Ed], it makes for the Common-Prayer-Book, not against it: since that altar was allowed of, though it were for religious signification, and yet not by Divine institution; and therefore proves, that all inventions of men, whereby our worship of God is signified, are not unlawful, if they be not made necessary, nor the worship of God placed in the things so invented, or their use.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/john-tombes.html">John Tombes</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Theodulia, or a Just Defence of Hearing the Sermons &amp; other teaching of the present Ministers of England against a book unjustly entitled, A Christian testimony against them that serve the image of the beast</cite>, … (London: E. Cotes, 1667), ch. 7, sect. 6, p. 231</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/worship/ceremonies-and-things-indifferent.html">Ceremonies and Things Indifferent</a></span></div>
<div class="actions"><button class="copy" data-copy="“As for Josh. 22:10, etc. [about the altar of Ed], it makes for the Common-Prayer-Book, not against it: since that altar was allowed of, though it were for religious signification, and yet not by Divine institution; and therefore proves, that all inventions of men, whereby our worship of God is signified, are not unlawful, if they be not made necessary, nor the worship of God placed in the things so invented, or their use.”

</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-1e7198fc15" data-kw="">
<blockquote><p>First of all, I hold that it is proper for the ceremonies in the church to be absolutely as few and as pure as possible. For besides the fact that we must now worship the Lord in Spirit and truth, even plain experience, that teacher of fools, ought to warn us not to imitate the example of those who–while setting no limit on their ceremonies–do not increase the worship of God, but completely undermine it. And so we determined that we should take thought how to do away with ceremonies rather than establishing them.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/theodore-beza.html">Theodore Beza</a></span><span class="wk"><span class="lbl">Work:</span> <cite>A Clear &amp; Simple Treatise on the Lord’s Supper</cite>, (RHB, 2016), p. 143</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/worship/ceremonies-and-things-indifferent.html">Ceremonies and Things Indifferent</a></span></div>

<blockquote><p>§50. And whereas the king’s party usually say that it was the seditious preachers that stirred up the people, and were the cause of all this, I answer:

1. It is partly true and partly not: It is not true that they stirred them up to war (except an inconsiderable number of them, one perhaps in a county, if so much). But it is true that they discovered their dislike of the Book of Sports and bowing to altars, and diminishing preaching, and silencing ministers and such like; and were glad that the parliament attempted a reformation of them.

2. But then it is as true that almost all these were conformable ministers, the laws and bishops having cast out the nonconformists long enough before; insomuch that I know not of two nonconformists in a county. But those that made up the Assembly at Westminster, and that through the land were the honor of the parliament’s party, were almost all such as had till then conformed and took those things to be lawful in case of necessity, but longed to have that necessity removed.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/richard-baxter.html">Richard Baxter</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Reliquiæ Baxterianæ: or, Mr. Richard Baxter’s Narrative of the most Memorable Passages of his Life &amp; Times</cite>, (London: Parkhurst, 1696), bk. 1, pt. 1, p. 34</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/worship/ceremonies-and-things-indifferent.html">Ceremonies and Things Indifferent</a></span></div>

</figure><figure class="quote" id="q-120724e25c" data-kw="">
<blockquote><p>Question 6. Whether absolute and unlimited power of royalty be a ray and beam of divine majesty immediately derived from God? Answer. Not at all. Such a creature is not in the world of God’s creation. Royalists and flatterers of kings are parents to this prodigious birth. There is no shadow of power to do ill in God. An absolute power is essentially a power to do without or above law, and a power to do ill, to destroy; and so it cannot come from God as a moral power by institution, though it come from God by a flux of permissive providence; but so things unlawful and sinful come from God.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/samuel-rutherford.html">Samuel Rutherford</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Lex Rex</cite>, ... (1644), p. 228</span></figcaption>

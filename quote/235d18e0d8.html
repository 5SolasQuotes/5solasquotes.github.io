<main class="wrap"><figure class="quote" id="q-235d18e0d8" data-kw="">
<blockquote><p>20. Q. Doth the Holy Ghost proceed only from the Father?

A. No: But also from the Son, he is therefore called the Spirit of Christ. Rom. 8.9. But ye are not in the Flesh, but in the Spirit, if so be that the Spirit of God dwell in you. Now if any Man have not the Spirit of Christ, he is none of his. AND THE SPIRIT OF THE SON. Gal. 4.6. And because ye are Sons, God hath sent forth the Spirit of his Son into your Hearts, crying, Abba, Father.

21. Q. Is not the Holy Ghost, only a Power, or Attribute of God?

A. No: But an actual Person, having Understanding and Will. 1 Cor. 2.10. For the Spirit searcheth all Things, yea the deep Things of God. Chap. 12.11. But all these worketh that one and the self-same Spirit, dividing to every Man severally as he will. He also appeared at the Baptism of Christ, Matt. 3.16. And Jesus when he was baptized, went up straightway out of the Water: And lo, the Heavens were opened unto him, and be saw the SPIRIT of GOD descending like a Dove, and lighting upon him.

22. Q. Is he also a distinct Person?

A. Yes; He is expressly called, another, John 14.16, 17. And I will pray the Father, and he shall give you another Comforter that he may abide with you for ever; even the Spirit of Truth.</p></blockquote>

</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-fdb18aed36" data-kw="Filioque from Son">
<blockquote><p>Although the Greeks ought not to have been charged with heresy on account of their opinion … still the opinion of the Latins may be properly retained as more agreeable to the words of Scripture and the truer. (1) The Holy Spirit is sent from the Son as well as from the Father (Jn. 16:7). He therefore ought to proceed from him because he cannot be sent by the Son unless he proceeds from him. (2) He is called the Spirit of the Son as well as the Father (Gal. 4:6).</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/francis-turretin.html">Francis Turretin</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Institutes of Elenctic Theology</cite>, 3.31.5</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/the-trinity/the-holy-spirit.html">The Holy Spirit</a> › <a href="../topics/the-trinity/the-holy-spirit/the-filioque.html">The Filioque</a></span></div>

</figure><figure class="quote" id="q-fda756477c" data-kw="">
<blockquote><p>For what reason does God send the Spirit of his Son into our hearts after we have become children of God? He does this in order to reveal to our hearts that we are indeed his children, in order to confirm and make us certain of that fact, in order to bear witness to it, in order to expel every doubt and uncertainty and in order to seal us in our sonship and inheritance. For this reason Scripture calls the Holy Spirit the first fruits of our inheritance. Note that the invocation of God the Father that comes from the heart is the expression of a mind that the Holy Spirit has made sure and certain of the fact that the Father has been placated by Christ the Son.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/erasmus-sarcerius.html">Erasmus Sarcerius</a></span><span class="wk"><span class="lbl">Work:</span> <cite>In Epistolas Divi Pauli ad Galatas et Ephesios Annotationes</cite>, (Frankfurt, 1542). Quoted in Gerald L. Bray, Timothy F. George, Scott M. Manetsch (eds), Reformation Commentary on Scripture X: Galatians, Ephesians (Downers Grove IL: IVP Academic, 2011), p. 138.</span></figcaption>

</figure><figure class="quote" id="q-8d5cf3a7cf" data-kw="Spirit of both Filioque">
<blockquote><p>Scripture teaches that the Spirit proceeds from both the Father and the Son, in passages where He is called the Spirit of both. In Romans 8:9, He is called both the Spirit of God and the Spirit of Christ in the same verse. The Spirit is said to be sent by both the Father and the Son (John 15:26): &quot;The Comforter, whom I will send to you from the Father, the Spirit of truth, who proceeds from the Father.&quot; And in John 16:14: &quot;He will take what is mine and declare it to you.&quot; Reason also supports this.</p></blockquote>

</figure><figure class="quote" id="q-fde3152e82" data-kw="">
<blockquote><p>We shouldn’t doubt that the Holy Spirit lives in us, but we should certainly recognize that we are temples of the Holy Spirit, as Paul says in 1 Corinthians 6:19. If someone feels a love for God’s Word and gladly hears, speaks, thinks, teaches, and writes about Christ, you should know that this comes, not from a person’s will or reason, but from the Holy Spirit. It’s impossible for this to happen without the Holy Spirit. On the other hand, where there is hatred and contempt for the Word, we should know that the devil, the ruler of this world, blinds the hearts of the people and holds them captive so that the light of the gospel, the glory of Christ, can’t shine on them. We see this today in the masses who are not moved by the Word but despise it as if it has nothing to do with them. But those who have any kind of love and desire for the Word should gratefully acknowledge that these attitudes are poured into them by the Holy Spirit. For we are not born with these attitudes and cannot acquire them through the law. This transformation rests completely and absolutely in the hand of the Almighty. So when we eagerly listen to preaching about Jesus Christ, the Son of God—who for our sakes became a human being and subjected himself to the law to save us—then God sends the Holy Spirit into our hearts through this preaching. Therefore, it’s very useful for us to remember that we have the Holy Spirit.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/martin-luther.html">Martin Luther</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Faith Alone: A Daily Devotional</cite>, (p. 292). Zondervan. Kindle Edition.</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/the-trinity/the-holy-spirit.html">The Holy Spirit</a></span></div>

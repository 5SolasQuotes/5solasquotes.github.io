<main class="wrap"><figure class="quote" id="q-ef795438c9" data-kw="">
<blockquote><p>69… Therefore, I hold a middle way, that both the will and the object concur for causing an act of willing, so that the act of willing is from the will and from the object known, as from effective cause… 70… Therefore I say that with the will, in idea of effective cause, the intellect, actually understanding the object, concurs for causing the act of willing, as briefly thus: ‘nature in act, understanding the object, and free,’ is cause of willing and refusing; and in this consists free choice, whether in us or in angels.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/john-duns-scotus.html">John Duns Scotus</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Other citations (work not named)</cite>, 25th Distinction, Question: ‘Whether an act of will is caused in the will by the object moving it, or by the will moving itself’ in Ordinatio, bk. 2, dist. 15-25 tr. Peter Simpson (2025), pp. 58-71, p. 66</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/free-will-and-inability/liberty-and-necessity.html">Liberty and Necessity</a></span></div>

</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-5254a69952" data-kw="">
<blockquote><p>A will that was not of its nature directed toward what the intellect takes to be good would be like an acorn that was not of its nature directed toward becoming an oak. The latter just wouldn’t really be an acorn, and the former just wouldn’t really be a will.¹ ¹ For further discussion and defense of the thesis that the will always aims at what the intellect takes to be good, see Edward Feser, ‘Being, the Good, and the Guise of the Good,’ in Daniel D. Novotny and Lukas Novak, eds., Neo-Aristotelian Perspectives in Metaphysics (London: Routledge, 2012). …A tree that did not aim at getting its branches toward the sun would not be a freer tree, but just a defective tree. And a will that did not aim at the good would not be a freer will, but just a defective will.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/edward-feser.html">Edward Feser</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Immortal Souls: a Treatise on Human Nature</cite>, (Editiones Scholastica, 2024), ch. 4, ‘The Will’, pp. 137-38</span></figcaption>

</figure><figure class="quote" id="q-ff4234ad2b" data-kw="">
<blockquote><p>The Disposition of Man to Grace l. Since the necessary conditions for salvation are impossible for the reprobates, God does not intend to give them salvation, conditionally if they believe and repent, unless one supposes that there is in God some vain, frustrated, and useless intention and will. 2. A good use of natural light, either subjective or objective, cannot lead man to salvation, nor obtain from God any other degree of light destined to salvation. Rejection of the error of those:

1. Who teach a universal and common call to all men to salvation and to the author of salvation, and that each and every man can believe and be saved if he wants.

2. Who teach that God, by his revealed will, wants the salvation of each and everyone.</p></blockquote>

<blockquote><p>5. Augustine professes, bk. 1, De Gen. contr. Manich., ch. 3, that all men may believe if they will, and justifies it in his Retractations. But if the will of man be corrupt, and averse from believing, we justly say such a man cannot believe, as our Savior says, ‘How can you believe that receive honor one of another, and seek not the honor that comes of God alone.’ Jn. 5:44 Yet this is an impotency moral only, which is to be distinguished from impotency natural. For notwithstanding this, it may be truly said that, All men may believe if they will, and herein consists the natural liberty of the will. The moral liberty consists, rather in a sanctified inclination unto that which is good, whereby it is freed from the power of sin and Satan; then in a power to do good if they will, and not otherwise. But I never find that Arminians do distinguish these.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/william-twisse.html">William Twisse</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Riches of God’s Love unto the Vessels of Mercy, consistent with his absolute Hatred or Reprobation of the Vessels of Wrath, or an answer unto a book entitled, God’s Love unto Mankind</cite>, … (d. 1646; Oxford, 1653), bk. 1, pt. 1, II. The Discourse Itself, p. 72</span></figcaption>

<blockquote><p>I answer that immortality indicates a certain potential to live forever and not die. But this potential is not found in human nature on the side of the body, except imperfectly, as if by obediential potency alone, since everlasting life cannot be had through the principles of nature. Rather, the completion of this potency comes from a divine gift gratuitously conferred. And so, immortality can be considered in two ways: either with regard to incomplete natural potency, and in this way, there is one and the same immortality just as there is one and the same nature; or with regard to the gift of grace, which is like the formal element completing the aforementioned potency. And in this way, we find a difference between the two immortalities and impassibilities, since the first was through the grace of innocence whereas the final will be through the gift of glory. For in the first state the soul’s dominance over the body was such that nothing in the body could happen that would be adverse to the soul. But in the last state the dominance will be greater, inasmuch as the properties of the soul will in a certain way overflow into the body such that the body will be rendered agile, bright, and spiritual, as well as impassible.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/thomas-aquinas.html">Thomas Aquinas</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Commentary on the Sentences</cite>, distinction 19, Immortality in the Original State of Man, quest. 1, art. 5, Whether the immoratlity of Adam was the same as the immortality of the resurrected, I answer that, bk. 2</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/free-will-and-inability/liberty-and-necessity.html">Liberty and Necessity</a></span></div>

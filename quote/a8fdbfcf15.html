<main class="wrap"><figure class="quote" id="q-a8fdbfcf15" data-kw="">
<blockquote><p>The apostle says, ‘If meat make my brother to offend, I will eat no flesh while the world standeth.’ (1 Cor. 8:13) Now put the case the apostle had been hindered from preaching the Gospel for his precise abstaining from those meats whereat his brother would be offended, would he in that case have eaten? Nay, he says peremptorily that whiles the world stands, he would not eat.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/george-gillespie.html">George Gillespie</a></span><span class="wk"><span class="lbl">Work:</span> <cite>English Popish Ceremonies (1637), pt. 2, ch. 1</cite>, p. 10</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/the-lords-supper/preparation-celebration-reflection.html">Preparation, Celebration, Reflection</a></span></div>

</figure><figure class="quote" id="q-ffa696fb07" data-kw="">
<blockquote><p>Mr. Sprint [an opponent] himself lays down one ground which proves the refusing of inconvenient ceremonies to be a greater duty than the preaching of the Word: for he holds that the substantials of the Second Table do overrule the ceremonials of the First Table, according to that which God says, ‘I will have mercy and not sacrifice,’ (Mt. 12:7). And elsewhere he teaches that to tend a sick person ready to die is a greater duty than the hearing of the Word. Now to practice inconvenient and scandalous ceremonies is to commit soul-murder, and so to break one of the most substantial duties of the Second Table. Therefore, according to Mr. Sprint’s own ground, the refusing of inconvenient and scandalous ceremonies is a greater duty than the preaching of the Word, which is but a ceremonial of the First Table, and if the neglect of tending a sick person’s body be a greater sin than to omit the hearing of many sermons, much more to murder the souls of men by practicing inconvenient and scandalous ceremonies, is a greater sin than to omit the preaching of many sermons, which is all the omission (if there be any) of those who suffer deprivation for refuising to conform unto inconvenient ceremonies.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/george-gillespie.html">George Gillespie</a></span><span class="wk"><span class="lbl">Work:</span> <cite>English Popish Ceremonies (1637), pt. 2, ch. 1</cite>, p. 4</span></figcaption>

%20himself%20lays%20down%20one&amp;text=deprivation%20for%20refuising%20to%20conform%20unto%20inconvenient%20ceremonies" rel="noopener" target="_blank">Read it online · Reformed Books Online</a></div>
</figure><figure class="quote" id="q-94c732a7ae" data-kw="">
<blockquote><p>…understanding that of the prayer and communion in the sacraments, it [communicating with infidels and unbelievers] does admit exception: for notwithstanding if it were in my choice to avoid them, I ought not to join with them, yet having no authority, or no strength and power to make good the authority of separating of them, I ought not therefore to cease the service of God which is commanded. … Howbeit there is here [in 1 Cor. 5] to be considered that one which avoids such a man’s company at the table ordained for the belly, shall not therefore be bound to abstain from the Lord’s table prepared for the spiritual nourishment. Because although it be in him to deprive him from his own table, yet is it not so in his power to put him from the table of the Lord. And if the case were so that the person excommunicated were placed at your table by the prince whose authority in such a case you cannot avoid, and order taken that you should never eat but he should eat with you, I ask you herein whether you think that you should rather famish yourself than take of the same table with him. And if you esteem that you ought rather to eat of the same dish with him than pine to death, much more ought you to take at the Lord’s table with him rather than by abstaining run in danger of a spiritual famine. So that when a Christian is forbidden to forbear to eat with an excommunicated person one way or other, it is with this caution, so far forth as by abstaining from his necessary nourishment inward or outward he become not a murderer of his own person, which is so often as for the presence of the wicked (whom he is not able to decline) he hinders the good estate of himself either bodily or ghostly [spiritually]. Where if you say that these are cases supposed and which never come to practice, it is sufficient answer that they may come to practice if they never did, and therefore have the same strength of reason as if they were of continual experience. Howbeit you may consider this more apparently in a faithful woman, whose husband being excommunicated commands her to bear him company at the table. And forasmuch as the Church discipline does not overthrow the authority of the husband in his house, which is of God as well as the other, the wife is to yield unto her husband, although it be not without testimony of grief in that behalf. How much more should she so do, if her husband would be so froward as not to let her have any nourishment but at his board [table].</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/thomas-cartwright.html">Thomas Cartwright</a></span><span class="wk"><span class="lbl">Work:</span> <cite>eds. Peel &amp; Carlson, Cartwrightiana (London: Halley Stewart, 1951), ‘Letter to Mrs. Stubbes his sister-in-law to persuade her from Brownism’</cite>, pp. 72-73</span></figcaption>

<blockquote><p>II. Who Should be Admitted to the Lord’s Table? Second Conclusion: These only are to be admitted to the Supper of the Lord, whom in charity we judge, can and do try and examine themselves, rightly discern the Lord’s body, and who in faith can enunciate the Lord’s death unto his second coming again. And therefore children, infants, ignorants, scandalously flagitious persons, and mad [mentally insane] persons are to be debarred.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/samuel-rutherford.html">Samuel Rutherford</a></span><span class="wk"><span class="lbl">Work:</span> <cite>p. 28 of ‘On the Baptism of the Children of Adherents’ being ch. 12 of his A Peaceable and Temperate Plea for Paul’s Presbytery in Scotland… (1642)</cite></span></figcaption>

<main class="wrap"><figure class="quote" id="q-a3d5d90e7d" data-kw="">
<blockquote><p>5. Are we justified on account of the essential righteousness of Christ’s divine nature? XXIII. Fifth, it is asked whether the dikaioma [righteousness] on account of which we are justified is the essential righteousness of Christ’s divine nature. Andreas Osiander [a Lutheran], as we have often said, affirms it, because he rejected the procured righteousness of Christ, which nonetheless his son Lucas Osiander, a professor at Tübingen, does not acknowledge; at least it is certain that he has to reject it, from his hypotheses, because: (1) this essential righteousness of the divine nature, through its infinite value, would be so sufficient that it would make the other undoubtedly void. This is not even to mention that (2) the essential union of believers with Christ (which he presupposes) is blasphemous in not just one way, as we taught elsewhere (1.6.5 §XX). And (3) it is false that he is the Messiah only according to the divine nature. Moreover, (4) that the fellowship of that essential righteousness is understood (2 Peter 1:4), we have already shown to be absurd (cf. bk. 5, ch. 2 §XXII; ch. 18, §§XIV, XXXVI; ch. 5 of this book, §XX; likewise §XI of this chapter.) Nor does there remain anything that they may say for themselves, except that the righteousness on account of which we are justified is called the righteousness of God (Rom. 1:17; 3:21–22; 10:3; 2 Cor. 5:21; 2 Peter 1:1). To which we respond that: (1) the [Greek; dikaiosune theou], ‘the righteousness of God’, sometimes designates procured righteousness (James 1:20). (2) Christ’s procured righteousness is the righteousness of God, insofar as the one who procured it is the God man, and thus is God (Acts 20:28). (3) The procured righteousness of Christ is called the righteousness of God because it was constituted by God, and is admitted for us by God (Rom. 3:25; 2 Cor. 5:21). … XXV… Protestants, although they leave essential righteousness to Christ alone, as a prerequisite for his mediatorial function, yet affirm that the righteousness that was procured by his satisfaction and merit (insofar as they teach that on account of it we are delivered from our guilt and obtain the right to life) is altogether imputed to us, or transferred to our account.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/petrus-van-mastricht.html">Petrus van Mastricht</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Theoretical Practical Theology</cite>, (2nd ed. 1698; RHB), vol. 5, pt. 1, bk. 6, ch. 6, ‘The Justification of those to be Redeemed’, p. 131</span></figcaption>

</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-7c4489d22d" data-kw="">
<blockquote><p>For remission of sins does not only deliver from pain, to wit, eternal death; but also brings glory or eternal life. The reason of which thing is this, that remission of sins, wherein man’s justification consists, is remission of all sins: and therefore not only of sins of committing, but also of sins of omitting: whereby it comes that he to whom God forgives sins, is so accounted of, as if he had not only committed nothing which God has forbidden in his law: but also, omitted nothing of that which he has commanded: and therefore, as if he had perfectly fulfilled the law of God. Now where the perfect fulfilling of the law is, there also is life, according to that, ‘The man that doeth these things shall live in them.’ Moreover, the example of civil judgment which Bellarmine brings, proves not his assumption: because that absolution is unlike to the absolution of God. For this is universal, to wit from all sins against the law of God: but that is particular or special; to wit, from some certain crime or crimes, against the politic laws. Notwithstanding, the civil judge gives unto him whom he has quitted from certain crimes those rewards which he has promised to the innocent, namely, preservation in life and defence; although he give him no new and singular rewards which he has promised only to certain virtuous exploits. And so God gives eternal life as a reward to those unto whom He has promised it, to wit, unto those that keep his law: such as He accounts all those whose sins He has forgiven.</p></blockquote>

<blockquote><p>XVII. (2) The adjudication of eternal life, with respect to its right (Rom. 6:22; Jn. 3:16), for when the guilt of eternal death is taken away through absolution, the right of eternal life cannot but follow it. So that from this, it is perceived with no trouble that there is not a real distinction between absolution from eternal death and adjudication of eternal life. For just as there is also not a real difference between satisfaction and merit, such that absolution must be sought in only satisfaction and the right to eternal life in only merit, and then the former, that is, satisfaction, in only passive righteousness, and the latter in only active. For the dikaioma on account of which we are justified, as it includes without division both forms of the righteousness of Christ, so also it provides without division the cause on account of which also we are freed from the guilt of sin, and receive the right to every good, just as we taught elsewhere explicitly (1.5.18 §XIV; §XI, above).</p></blockquote>

<blockquote><p>10. The form of active justification we hold to be both the plenary remission of sins and the imputation of the righteousness of Christ; nor do we hold that these phrases ought to be either equated or confounded. The form of passive justification we constitute in the apprehension and sense of both in subjects who are capable thereof.</p></blockquote>

<main class="wrap"><figure class="quote" id="q-3d2019ef10" data-kw="">
<blockquote><p>The Judicial Law concerning the punishments of likedness, for the substance, viz. that it should be punished remains under the Gospel, because it comes within the nature of the Moral Law, and was prescribed to the Jews, not quae [as] Jews or a people peculiarly taken into Covenant, but qua [as] men subject to the Law of nature as other nations were… The Judicial laws may be considered according to their substance and equity, or according to many accessories, circumstances, forms and manner of them. Now though the magistrate under the Gospel is not bound unto these laws simply, that is, to every circumstance and particular of them for form, manner, time and place; as for example, not to the same kinds and formality of punishments set down in those laws; for those forms are accessions of the law; and therefore out of the nature of persons, times, places, and constitution of commonwealths, mutable: Yet he is bound to the substance and equity of them, so as not to derogate from the right of those laws… Now though to the degrees and measures of punishment, the severity and utmost rigor the Magistrate is not now tied, yet to the thing in cases of idolatry, seduction, false prophesying, speaking lies in the name of the Lord he is bound, and in some cases of gross and high idolatry and blasphemy committed presumptuously, to inflict capital punishment.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/thomas-edwards.html">Thomas Edwards</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Casting Down of the Last &amp; Strongest Hold of Satan, or a Treatise Against Toleration &amp; Pretended Liberty of Conscience</cite>, pp. 50, 54-55</span></figcaption>

<blockquote><p>5. Where it is said [in the Westminster Confession of Faith], ch. 21, sect. 7, that: ‘by a positive, moral and perpetual commandment, binding all men in all ages, He has particularly appointed one day in seven for a Sabbath,’ I understand it only of a virtual obligation, as much as belongs to the Law, as enacted before promulgation, but not of a true actual obligation. For no law can bind till it is promulgated; and positives are not promulgated by nature; therefore not to all men in all ages; therefore they bind not all men in all ages.</p></blockquote>

<blockquote><p>2. We must believe none that speak against the Light of Nature and common notices of all mankind: for that were to renounce humanity: And the Law of Nature is God’s first Law. But it is not the sentiments of nature as depraved which is this Law. 3. We must believe no men against the common senses of mankind, exercised on their duly qualified objects. Faith contradicts not common sense, though it go above it. We are men before we are Christians, and sense and reason are presupposed to faith… For if sense be not to be trusted, we know not that there is a Church, or a man, or a Bible or any thing in the world, and so nothing can be believed. Whether all sound senses may be deceived or not, God has given us no surer way of certainty. 4. Nothing is to be believed against the certain interest of all mankind and tending to their destruction; That which would damn souls, or deny their immortality and future hope, or ruin the Christian world or nations, is not to be believed to be duty or lawful: For truth is for good, and faith is for felicity; and no man is bound to such destructive things. 5. Nothing is to be believed as absolutely certain which depends on the mere honesty of the speakers: For all men are liable to mistake or lie. 6. The more ignorant, malicious, unconscionable, factious, siding, any man is, the less credible he is. And the wiser and nearer to the action any man is, and the more conscionable, peaceable and impartial he is, the more credible he is. An enemy speaking well of a man, is so far more credible than a friend: Multitudes, as capable and honest, are more credible than one. 7. As that certainty which is called moral, as depending on men’s free-will, is never absolute, but has many degrees, as the witness is more or less credible; so there is a certainty by men’s report, tradition or history which is physical and wholly infallible: As that there is such a place as Rome, Paris, etc. and that the statutes of the land were made by such kings and parliaments to whom they are ascribed; and that there have been such kings, etc. For proof of which know: 1. That besides the free acts, the will has some acts as necessary as it is to the fire to burn, viz. To Love ourselves and felicity, and more such. 2. That when all men of contrary interest, friends and foes, agree in a matter that has sensible evidence, it is the effect of such a necessitating cause. 3. And there is no cause in nature that can make them so agree in a lie. Therefore it is a natural certainty. Look back to the sixth chapter.</p></blockquote>

+many+degrees%2C+as+the+witness+is+more+or+less+credible%3B+so+there+is+a+certainty+by+men%E2%80%99s+report%2C+tradition+or+history+which+is+physical+and+wholly+infallible%3A+As+that+there+is+such+a+place+as+Rome%2C+Paris%2C+etc.+and+that+the+statutes+of+the+land+were+made+by+such+kings+and+parliaments+to+whom+they+are+ascribed%3B+and+that+there+have+been+such+kings%2C+etc.+For+proof+of+which+know%3A+1.+That+besides+the+free+acts%2C+the+will+has+some+acts+as+necessary+as+it+is+to+the+fire+to+burn%2C+viz.+To+Love+ourselves+and+felicity%2C+and+more+such.+2.+That+when+all+men+of+contrary+interest%2C+friends+and+foes%2C+agree+in+a+matter+that+has+sensible+evidence%2C+it+is+the+effect+of+such+a+necessitating+cause.+3.+And+there+is+no+cause+in+nature+that+can+make+them+so+agree+in+a+lie.+Therefore+it+is+a+natural+certainty.+Look+back+to+the+sixth+chapter.%E2%80%9D%0A%0A%E2%80%94+Richard+Baxter%2C+The+Catechizing+of+Families...+%28London%2C+1683%29%2C+ch.+42%2C+%E2%80%98Of+the+9th+Commandment%E2%80%99%2C+pp.+361-62&amp;url=https%3A%2F%2F5solasquotes.github.io%2Fquote%2F52baa4154a.html&amp;via=5Solas" target="_blank" rel="noopener">Share on X</a><a class="perma" href="../quote/52baa4154a.html">Permalink</a><a class="src" href="https://reformedbooksonline.com/topics/natural-law/#:~:text=2.%20We%20must%20believe%20none%20that,Look%20back%20to%20the%20sixth%20chapter&amp;text=2.%20We%20must%20believe%20none%20that%20speak%20against&amp;text=natural%20certainty.%20Look%20back%20to%20the%20sixth%20chapter" rel="noopener" target="_blank">Read it online · Reformed Books Online</a></div>

<main class="wrap"><figure class="quote" id="q-eb7595389b" data-kw="">
<blockquote><p>Carnal sports and pleasures are as great a profanation of the sabbath, as the most servile labour and drudgery in the world. Dicing and card-playing do as much violate the law of the sabbath, as digging and carting; playing, as much as ploughing; dancing and morrice-games, as much as working in the smith’s forge; bowling and shooting, as well as hewing of wood and drawing of water.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/thomas-case.html">Thomas Case</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Sermon VI. Of Sabbath Sanctification in Puritan Sermons 1659-1689: Being the Morning Exercises at Cripplegate, St. Giles in the Fields and in Southwark</cite></span></figcaption>
<div class="meta"><span class="t"><a href="../topics/worship.html">Worship</a></span></div>

</figure><figure class="quote" id="q-da1298814a" data-kw="">
<blockquote><p>When we were sat in Assembly, the three creeds were read, and many debates were held upon them, but especially about this word, in the eighth article, “they ought thoroughly to be received,” as if it set them in too high a place, in an equality with Scripture. At last it was resolved, that that article should be tendered to the Parliament, by way of humble advice, to be read thus, ‘The Creeds that go under the name of the Nice Creed, Athanasian Creed, and that which is commonly called the Apostles’ Creed, are thoroughly to be received and believed, for that the matter of them may be proved by most certain warrants of holy Scripture.’ Then was there a long agitation about translating the creeds anew, and about setting some gloss upon the preface and conclusion of Athanasius’ Creed, which seems to be something harsh; but at last it was concluded, that the creeds should be printed, at the end of the thirty-nine articles; so the determining of these matters referred thither.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/john-lightfoot.html">John Lightfoot</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Journal of the Proceedings of the Assembly of Divines, from July 1, 1643, to December 31, 1644</cite>, ed. John Rogers Pitman (London: J. F. Dove, 1824), 18 August 1643, p. 10.</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/worship/public-worship.html">Public Worship</a></span></div>

</figure><figure class="quote" id="q-5028655d17" data-kw="">
<blockquote><p>Q. What is the fourth Commandment?

A. Remember, &amp;c.

Q. What is the general meaning of the 4. Commandment?

2 A. The general meaning of the fourth Commandment, is that solemn times of worship, necessary to Religion at God’s own appointment, and chiefly a standing day in the week, free from worldly business to attend on God.

Is it not the solemn times of worship, necessary to Religion, at God’s own appointment, and chiefly, a standing day in the week, of rest from worldly business to attend on God?

Yes.

Or, May men of themselves appoint any days or times, as necessary to Religion?

No.

Or, May we unnecessarily spend God’s Day upon our selves?

No.

Or, Upon any worldly matters?

No.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/herbert-palmer.html">Herbert Palmer</a></span><span class="wk"><span class="lbl">Work:</span> <cite>An endeavour of making the principles of Christian religion, namely the Creed, the Ten Commandments, the Lord’s prayer, and the Sacraments, plain and easy tending to the more speedy instruction of the meanest capacities, and weakest memories, and for the making trial also of their understandings, wh</cite>, (3rd edn, London: Thomas Underhill, 1644), p. 26.</span></figcaption>

<main class="wrap"><figure class="quote" id="q-cdcac0f5d7" data-kw="">
<blockquote><p>When love is attributed to God in Scripture, it does not mean a passion or an affect, for God is dispassionate [ἀπαθής], the freest, the most blissful, the most blessed, the most perfect. Nothing slavish happens to Him, nothing lowly, and finally nothing that indicates any imperfection. But God’s love denotes three completely, perfect things: eternal benevolence, actual beneficence, and actual delight in the thing loved. For he who loves something is well-disposed towards it, does it whatever good he is capable of, and delights in it. These three things are found in the love of God. Now this love is first the love of God in Himself, and then towards his creatures. For God loves Himself and above all things: the Father: the Son and the Holy Spirit; the Son: the Father and the Holy Spirit, and the Holy Spirit: the Father and the Son. God’s love for his creatures is first general and then special. That general love is the one by which He fully embraces all things created by Him, blesses them, and preserves and sustains them. In this way there is no one, no man, and no devil either, who can say that He is not loved by God. The special love is that by which alone He leads the elect to eternal life, as He acknowledges them to be his own children in Christ: this passage [Mal. 1:2] here must be understood from this special love.</p></blockquote>

<blockquote><p>If God’s love is known by what it hates, it is also known by what it loves or inclines toward. First, in a sense, it extends to all creatures. All creatures have some good from God.136 Even the wicked share in this benevolence. “God is kind to the unthankful and evil.”137 Man is now naturally contrary to God and positively evil, but the Luke 6:35 sermon shows that God still loves him in some ways. Indeed, Edwards goes on to say in another sermon: “even in damnation.”138 Yet, fundamentally, “holy persons love holy things for their holiness.”139 136. Unpublished MS sermon on Ps. 145:15–21, “All creatures in heaven and earth have their good things from God,” p. 1, St. Ind., Nov. 1, 1753. 137. Unpublished MS sermon on Lk. 6:35. 138. Unpublished MS sermon on Eph. 4:15–16, “In a company of Christians among whom Christianity has its genuine effect, love is the beginning and love is the middle and love is the end of all their affairs,” p. 2, May 1743. 139. Unpublished MS sermons on Ps. 119:[1]40.</p></blockquote>

<blockquote><p>The Reformed orthodox describe God’s love as an act of the divine will or a movement toward the good–both toward the good in itself and toward the good as it is embodied in the creature. Indeed, the predications of will, love, and goodness conjoin in the basic definition, granting that the divine will is God’s propensity for the good that is ultimately the divine essence itself as the source of all good–and amor [love], strictly defined, is a propensity for the good (Mastricht, Theoretico-practica theol., II.xvii.3, 4, 6; cf. Brakel, Redelijke Godsdienst, I.iii.33. Note the similar definitions in Arminius, Disputationes privatae, XX.iii-iv.), or a desire or ‘appetite for union.’ (Heidanus, Corpus theol., II (p. 172).)</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/richard-muller.html">Richard Muller</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Post-Reformation Reformed Dogmatics (Baker Academic, 2003), vol. 3</cite>, pp. 564-65</span></figcaption>

<div class="actions"><button class="copy" data-copy="“The Reformed orthodox describe God’s love as an act of the divine will or a movement toward the good–both toward the good in itself and toward the good as it is embodied in the creature. Indeed, the predications of will, love, and goodness conjoin in the basic definition, granting that the divine will is God’s propensity for the good that is ultimately the divine essence itself as the source of all good–and amor [love], strictly defined, is a propensity for the good (Mastricht, Theoretico-practica theol., II.xvii.3, 4, 6; cf. Brakel, Redelijke Godsdienst, I.iii.33. Note the similar definitions in Arminius, Disputationes privatae, XX.iii-iv.), or a desire or ‘appetite for union.’ (Heidanus, Corpus theol., II (p. 172).)”

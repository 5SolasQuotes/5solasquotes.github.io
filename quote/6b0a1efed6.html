<blockquote><p>IV. Although then this most divine panace or catholic remedy is proposed to all in the Gospel, yet we believe that no efficacy of it can be transfused, except there be an applying of this by faith in the Son of God, even as there can be no efficacy in physic or medicaments, except the sick patient hearken to the physician, and apply his medicines; which metaphor the Holy Ghost uses in this case.</p></blockquote>

<blockquote><p>VIII. Hence is that received and fit distinction, that Christ died for all men, in respect of the sufficiency of his merit, or the greatness of the price: but in respect of the efficacy and fruit of his death, he died for all, and only for the believers; seeing not all, but only the faithful receive him: but the rest reject him through infidelity.</p></blockquote>

</figure><figure class="quote" id="q-656fe32bd6" data-kw="">
<blockquote><p>Concerning the story and benefit of our Lord’s resurrection… directing our course as it were by the loadstar of scripture we pronounce by virtue and authority thereof that so precious and inestimable a benefit belongs unto all the faithful, and to them alone; and we exclude the wicked and unbelievers, as long as they remain such, from having any interest therein… The answer hereunto is twofold, either of which is true and sound. First, as often as the Gospel extends the fruit of Christ’s merits and benefits unto all, it must be understood (as says Saint Ambrose) of the whole number of the faithful and elect. For this is the usual and common voice found everywhere throughout the whole course of the gospel… Howbeit there is another answer no less true, wherewith we may satisfy the most contentious wranglers; that Christ died for all men absolutely and without exception to wit, if you respect the sufficiency of the merit, and the price which He paid. It is out of all doubt and controversy that the death of the Son of God is of such weight and worth that it may serve to purge and cleanse the sins not of one world only, but thousands of worlds; if at least all men would apprehend by faith this salve of sin. But the question concerns the efficacy and participation itself of the fruits which we mainly deny to be common to the believing, and unbelieving, or to be generally promised or given in the〈…〉; and we hold it no sound doctrine to 〈…〉 in this respect Christ died alike for all ???? and reprobate… For what slander is there, if this be none. When we distinguish the worth of the merue from the efficacy and participating of the benefits, and restrain according to Scripture and the judgement of the soundest Fathers this participation to the whole number of the faithful alone gathered from amongst the Jews and Gentiles; do we then deny that Christ died for all?… They [opponents] run on still, and say He died for all and every of these not only in respect of the sufficiency of his sacrifice and satisfaction, but also in regard of the efficacy of the same. What means this new device I pray? That forsooth Christ by his death and bloodshedding has truly and effectually delivered from death, purged from sin, sanctified, reconciled unto God, and restored unto his grace and favor by his death and bloodshedding all and every single man, yea even those who are not saved, but have been ever since Caine, etc. are at this day, and shall be hereafter damned… they neither perished, nay perish, nor shall perish, for their sins (whereas they are washed away by the blood of Christ Jesus) but for unbelief alone.</p></blockquote>

0alone&amp;text=Concerning%20the%20story%20and%20benefit%20of%20our%20Lord%E2%80%99s&amp;text=blood%20of%20Christ%20Jesus%29%20but%20for%20unbelief%20alone" rel="noopener" target="_blank">Read it online · Reformed Books Online</a></div>

<blockquote><p>In his larger Concerning the Redemption of Mankind, Kimedoncius… appealed again to the sufficient-efficient distinction. ‘The blood of Christ was shed for those only that are predestinated, as touching efficacy: but for all men as touching sufficiency.’ Kimedoncius was sensitive to Huber’s charge that limited redemption was a novelty introduced by Beza at Montbeliard, and cited fathers and schoolmen to ‘prove’ the antiquity of the position. Calvin, Beza Grynaeus and other Reformed leaders were also cited as favoring the sufficient-efficient distinction. According to Kimedoncius, when the Reformed have said that Christ did not die for all, and Beza is specially singled out for this ‘defence’, they are not to be taken ‘absolutely and without restraint’ but as following ‘the old distinction’. The Reformed, Kimedoncius maintained, agree that if all would believe, all would be saved… As well as acknowledging universal sufficiency, Kimedoncius indicated other legitimate understandings of universal redemption. It is universal in the sense that the whole church is redeemed, and that all who are saved are saved only through Christ, and that Christ is a ransom for all classes.” – G. Michael Thomas, The Extent of the Atonement… (Paternoster/Wipf &amp; Stock, 1997), pp. 117-8 . 1600’s Stalham, John – Vindiciæ Redemptionis: In the Fanning &amp; Sifting of Samuel Oates’ Exposition upon Mt. 13:44. With a Faithful Search After Our Lord’s Meaning in His Two Parables, the Treasure &amp; the Pearl. Endeavored in Several Sermons upon Mt. 13.:44-45. Where in the Former Part, Universal Redemption is Discovered to be a Particular Error. (Something Here is Inserted in Answer to Paulus Testardus, Touching that Tenet) And in the Later Part, Christ the Peculiar Treasure &amp; Pearl of God’s Elect is Laid as the Sole Foundation; and the Christian’s Faith &amp; Joy in Him &amp; Self-Denial for Him, is Raised as a Sweet &amp; Sure Superstructure (1647) 182 pp. Stalham (d. 1681) was a puritan clergyman, minister and divine who was ejected in 1662. He then pastored a congregationalist church till his death. According to Calamy, he was ‘of strict congregational principles.’ He dedicated one work of his to the Westminster Assembly. He wrote numerous works against the Quakers. This work is commended by John Owen in his preface to The Death of Death. Howe, Obadiah – The Universalist Examined &amp; Convicted, Destitute of Plain Sayings of Scripture or evidence of Reason, in Answer to a treatise entitled, The University of God’s Free Grace in Christ to Mankind (London: Rothwell, 1648) 223 pp. ToC Howe (1616?–1683) was an English clergyman who sided with Parliament, but conformed in 1662. This treatise about the extent of Christ’s atonement, against Arminians, is learned. Chapter 1 gives a full survey of the many varying views on the extent of the atonement in that era, via the words of Howe’s opponent. Howe: “But the full state of the question arises out of these particulars thus: Whether Christ by his death did intend or purpose to procure remission of sins, and eternal life for every man either absolutely, or upon any condition. The affirmative is the judgment of Arminius and his followers; the negative of the contra-Remonstrants and their followers.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/jacobus-kimedoncius.html">Jacobus Kimedoncius</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Other citations (work not named)</cite>, Of the Redemption of Mankind, Three Books, wherein the Controversy of the Universality of Redemption &amp; Grace by Christ, &amp; of his Death for all Men, is Largely Handled. Hereunto is Annexed a Treatise of God’s Predestination in One Book (London, 1598) In Latin (1592), ch. 1, end, n.p.</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/priestly-office-satisfaction-and-atonement/extent-of-the-atonement.html">Extent of the Atonement</a></span></div>
<div class="actions"><button class="copy" data-copy="“In his larger Concerning the Redemption of Mankind, Kimedoncius… appealed again to the sufficient-efficient distinction. ‘The blood of Christ was shed for those only that are predestinated, as touching efficacy: but for all men as touching sufficiency.’ Kimedoncius was sensitive to Huber’s charge that limited redemption was a novelty introduced by Beza at Montbeliard, and cited fathers and schoolmen to ‘prove’ the antiquity of the position. Calvin, Beza Grynaeus and other Reformed leaders were also cited as favoring the sufficient-efficient distinction. According to Kimedoncius, when the Reformed have said that Christ did not die for all, and Beza is specially singled out for this ‘defence’, they are not to be taken ‘absolutely and without restraint’ but as following ‘the old distinction’. The Reformed, Kimedoncius maintained, agree that if all would believe, all would be saved… As well as acknowledging universal sufficiency, Kimedoncius indicated other legitimate understandings of universal redemption. It is universal in the sense that the whole church is redeemed, and that all who are saved are saved only through Christ, and that Christ is a ransom for all classes.” – G. Michael Thomas, The Extent of the Atonement… (Paternoster/Wipf &amp; Stock, 1997), pp. 117-8 . 1600’s Stalham, John – Vindiciæ Redemptionis: In the Fanning &amp; Sifting of Samuel Oates’ Exposition upon Mt. 13:44. With a Faithful Search After Our Lord’s Meaning in His Two Parables, the Treasure &amp; the Pearl. Endeavored in Several Sermons upon Mt. 13.:44-45. Where in the Former Part, Universal Redemption is Discovered to be a Particular Error. (Something Here is Inserted in Answer to Paulus Testardus, Touching that Tenet) And in the Later Part, Christ the Peculiar Treasure &amp; Pearl of God’s Elect is Laid as the Sole Foundation; and the Christian’s Faith &amp; Joy in Him &amp; Self-Denial for Him, is Raised as a Sweet &amp; Sure Superstructure (1647) 182 pp. Stalham (d. 1681) was a puritan clergyman, minister and divine who was ejected in 1662. He then pastored a congregationalist church till his death. According to Calamy, he was ‘of strict congregational principles.’ He dedicated one work of his to the Westminster Assembly. He wrote numerous works against the Quakers. This work is commended by John Owen in his preface to The Death of Death. Howe, Obadiah – The Universalist Examined &amp; Convicted, Destitute of Plain Sayings of Scripture or evidence of Reason, in Answer to a treatise entitled, The University of God’s Free Grace in Christ to Mankind (London: Rothwell, 1648) 223 pp. ToC Howe (1616?–1683) was an English clergyman who sided with Parliament, but conformed in 1662. This treatise about the extent of Christ’s atonement, against Arminians, is learned. Chapter 1 gives a full survey of the many varying views on the extent of the atonement in that era, via the words of Howe’s opponent. Howe: “But the full state of the question arises out of these particulars thus: Whether Christ by his death did intend or purpose to procure remission of sins, and eternal life for every man either absolutely, or upon any condition. The affirmative is the judgment of Arminius and his followers; the negative of the contra-Remonstrants and their followers.”

— Jacobus Kimedoncius, Of the Redemption of Mankind, Three Books, wherein the Controversy of the Universality of Redemption &amp; Grace by Christ, &amp; of his Death for all Men, is Largely Handled. Hereunto is Annexed a Treatise of God’s Predestination in One Book (London, 1598) In Latin (1592), ch. 1, end, n.p.">Copy</button><a class="share" href="https://x.com/intent/post?text=%E2%80%9CIn+his+larger+Concerning+the+Redemption+of+Mankind%2C+Kimedoncius%E2%80%A6+appealed+again+to+the+sufficient-efficient+distinction.+%E2%80%98The+blood+of+Christ+was+shed+for+those+only+that+are+predestinated%2C+as+touching+efficacy%3A+but+for+all+men+as+touching+sufficiency.%E2%80%99+Kimedoncius+was+sensitive+to+Huber%E2%80%99s+charge+that+limited+redemption+was+a+novelty+introduced+by+Beza+at+Montbeliard%2C+and+cited+fathers+and+schoolmen+to+%E2%80%98prove%E2%80%99+the+antiquity+of+the+position.+Calvin%2C+Beza+Grynaeus+and+other+Reformed+leaders+were+also+cited+as+favoring+the+sufficient-efficient+distinction.+According+to+Kimedoncius%2C+when+the+Reformed+have+said+that+Christ+did+not+die+for+all%2C+and+Beza+is+specially+singled+out+for+this+%E2%80%98defence%E2%80%99%2C+they+are+not+to+be+taken+%E2%80%98absolutely+and+without+restraint%E2%80%99+but+as+following+%E2%80%98the+old+distinction%E2%80%99.+The+Reformed%2C+Kimedoncius+maintained%2C+agree+that+if+all+would+believe%2C+all+would+be+saved%E2%80%A6+As+well+as+acknowledging+universal+sufficiency%2C+Kimedoncius+indicated+other+legitimate+understandings+of+universal+redemption.+It+is+universal+in+the+sense+that+the+whole+church+is+redeemed%2C+and+that+all+who+are+saved+are+saved+only+through+Christ%2C+and+that+Christ+is+a+ransom+for+all+classes.%E2%80%9D+%E2%80%93+G.+Michael+Thomas%2C+The+Extent+of+the+Atonement%E2%80%A6+%28Paternoster%2FWipf+%26+Stock%2C+1997%29%2C+pp.+117-8+.+1600%E2%80%99s+Stalham%2C+John+%E2%80%93+Vindici%C3%A6+Redemptionis%3A+In+the+Fanning+%26+Sifting+of+Samuel+Oates%E2%80%99+Exposition+upon+Mt.+13%3A44.+With+a+Faithful+Search+After+Our+Lord%E2%80%99s+Meaning+in+His+Two+Parables%2C+the+Treasure+%26+the+Pearl.+Endeavored+in+Several+Sermons+upon+Mt.+13.%3A44-45.+Where+in+the+Former+Part%2C+Universal+Redemption+is+Discovered+to+be+a+Particular+Error.+%28Something+Here+is+Inserted+in+Answer+to+Paulus+Testardus%2C+Touching+that+Tenet%29+And+in+the+Later+Part%2C+Christ+the+Peculiar+Treasure+%26+Pearl+of+God%E2%80%99s+Elect+is+Laid+as+the+Sole+Foundation%3B+and+the+Christian%E2%80%99s+Faith+%26+Joy+in+Him+%26+Self-Denial+for+Him%2C+is+Raised+as+a+Sweet+%26+Sure+Superstructure+%281647%29+182+pp.+Stalham+%28d.+1681%29+was+a+puritan+clergyman%2C+minister+and+divine+who+was+ejected+in+1662.+He+then+pastored+a+congregationalist+church+till+his+death.+According+to+Calamy%2C+he+was+%E2%80%98of+strict+congregational+principles.%E2%80%99+He+dedicated+one+work+of+his+to+the+Westminster+Assembly.+He+wrote+numerous+works+against+the+Quakers.+This+work+is+commended+by+John+Owen+in+his+preface+to+The+Death+of+Death.+Howe%2C+Obadiah+%E2%80%93+The+Universalist+Examined+%26+Convicted%2C+Destitute+of+Plain+Sayings+of+Scripture+or+evidence+of+Reason%2C+in+Answer+to+a+treatise+entitled%2C+The+University+of+God%E2%80%99s+Free+Grace+in+Christ+to+Mankind+%28London%3A+Rothwell%2C+1648%29+223+pp.+ToC+Howe+%281616%3F%E2%80%931683%29+was+an+English+clergyman+who+sided+with+Parliament%2C+but+conformed+in+1662.+This+treatise+about+the+extent+of+Christ%E2%80%99s+atonement%2C+against+Arminians%2C+is+learned.+Chapter+1+gives+a+full+survey+of+the+many+varying+views+on+the+extent+of+the+atonement+in+that+era%2C+via+the+words+of+Howe%E2%80%99s+opponent.+Howe%3A+%E2%80%9CBut+the+full+state+of+the+question+arises+out+of+these+particulars+thus%3A+Whether+Christ+by+his+death+did+intend+or+purpose+to+procure+remission+of+sins%2C+and+eternal+life+for+every+man+either+absolutely%2C+or+upon+any+condition.+The+affirmative+is+the+judgment+of+Arminius+and+his+followers%3B+the+negative+of+the+contra-Remonstrants+and+their+followers.%E2%80%9D%0A%0A%E2%80%94+Jacobus+Kimedoncius%2C+Of+the+Redemption+of+Mankind%2C+Three+Books%2C+wherein+the+Controversy+of+the+Universality+of+Redemption+%26+Grace+by+Christ%2C+%26+of+his+Death+for+all+Men%2C+is+Largely+Handled.+Hereunto+is+Annexed+a+Treatise+of+God%E2%80%99s+Predestination+in+One+Book+%28London%2C+1598%29+In+Latin+%281592%29%2C+ch.+1%2C+end%2C+n.p.&amp;url=https%3A%2F%2F5solasquotes.github.io%2Fquote%2F46a4ed0f80.html&amp;via=5Solas" target="_blank" rel="noopener">Share on X</a><a class="perma" href="../quote/46a4ed0f80.html">Permalink</a><a class="src" href="https://reformedbooksonline.com/limited-atonement/#:~:text=In%20his%20larger%20Concerning%20the%20Redemption,of%20the%20contra%2DRemonstrants%20and%20their%20followers&amp;text=In%20his%20larger%20Concerning%20the%20Redemption%20of%20Mankind&amp;text=the%20negative%20of%20the%20contra%2DRemonstrants%20and%20their%20followers" rel="noopener" target="_blank">Read it online · Reformed Books Online</a></div>

<blockquote><p>Though I yield some degree of eﬃcacy in Christ’s death unto all; yet I conceive it far short, both of impetration [legal undertaking and payment of sins] and application of that gracious atonement, which is thereby wrought to the elect of God; whence also it is that I dare not preach the Gospel indifferently unto all, before the Law; nor the worth of Christ, before the need of Christ. Children’s bread is not meet for whelps; and full souls will despise honey-combs.</p></blockquote>

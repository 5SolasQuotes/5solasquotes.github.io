<main class="wrap"><figure class="quote" id="q-40b8ff80dd" data-kw="">
<blockquote><p>The observance of uncommanded holy-days is ever found to interfere with the due sanctification of the Lord’s day. Adding to the appointments of God is superstition. And superstition has ever been found unfriendly to genuine obedience. Its votaries, like the Jews of old, have ever been found more tenacious of their own inventions, of traditionary dreams, than of God’s revealed code of duty. Accordingly, there is, perhaps, no fact more universal and unquestionable, than that the zealous observers of stated fasts and festivals are characteristically lax in the observance of that one day which God has eminently set apart for himself, and on the sanctification of which all the vital interests of practical religion are suspended. So it was among the Israelites of old.

As early as the fifth century, Augustine complains that the superstitious observance of uncommanded rites, betrayed many in his time, into a spirit of irreverence and neglect towards those which were divinely appointed. So it is, notoriously, among the Romanists at the present day. And so, without any breach of charity, it maybe said to be in every religious community in which zeal for the observance of uncommanded holy-days prevails. It is true, many in those communities tell us, that the observance of holy-days, devoted to particular persons and events in the history of the Church, has a manifest and strong tendency to increase the spirit of piety. But if this be so, we might expect to find much more scriptural piety in the Romish Church than in any other, since holy-days are ten times more numerous in that denomination than in the system of any Protestant Church. But is it so? Let those who have eyes to see, and ears to hear, decide.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/samuel-miller.html">Samuel Miller</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Presbyterianism: The Truly Primitive and Apostolic Constitution of the Church of Christ</cite>, (Philadelphia PA: Presbyterian Tract and Sunday School Society, 1836), pp 77-78.</span></figcaption>

</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-904755a747" data-kw="">
<blockquote><p>Objection 17: But the particulars of your [Westminster] Directory of worship are not in Scripture, how then can the magistrate punish for not following the Directory? Answer: That there should be prayers, preaching, reading, praising of God, sacraments in the public worship, is evident by the Scripture, but for the ordering of these worships secundum prius &amp; posterius [according to what is first and that which follows] the words of prayer (so they be according to the pattern of sound doctrine) the Preface of the Directory is clear, that no man is therein to be compelled, though to transgress the Holy Ghost’s express order in the celebration of the Lord’s Supper and to break bread and eat first, and that before any of the words of institution be mentioned, or any blessing of the elements, must be a manifest breach of the directory of Jesus Christ which sure holds forth to us a twofold ordering of acts of worship, one divine, which we must peremptorily follow, another prudential and human in circumstances which concern both the worship of God and civil assemblies, as time, place, persons, etc. and in the latter we are no further to be commanded in point of uniformity than the general rules of the Word lead us; and compulsion, where God has no compelling commandment going before in an exact uniformity, we utterly disclaim, nor can men, or Church, or all the assemblies on earth make laws in matters of God’s worship where the Supreme Lawgiver has made none, and the Preface of the Directory is so clear in this that we trust we shall quickly agree with the godly and sound in judgment in this.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/samuel-rutherford.html">Samuel Rutherford</a></span><span class="wk"><span class="lbl">Work:</span> <cite>A Free Disputation Against Pretended Liberty of Conscience</cite>, … (London, 1649), pp. 372-3</span></figcaption>

</figure><figure class="quote" id="q-c31677d109" data-kw="">
<blockquote><p>As I am not willing to thrust any man into extremes, nor to trouble men with calling those sins which God has not forbidden…

1. It is not absolutely unlawful to personate another man, nor does the Second Commandment forbid such living images in this extent…

2. To personate good men in good actions, is not simply unlawful…

3. To personate a bad man, in a bad action, is more dubious; but seems not to be in all cases unlawful…

4. I think it possible to devise and act a comedy or tragedy which should be lawful and very edifying. It might be so ordered by wise men…

5. I think I never knew or heard of a lawful stage-play, comedy or tragedy in the age that I have lived in: And that those now commonly used, are not only sins, but heinous aggravated sins, for these reasons:</p></blockquote>

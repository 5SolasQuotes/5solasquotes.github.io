<blockquote><p>…where both [both things to be preserved] cannot be jointly put out of danger: but all this amounts not to a disobligement from the endeavor of preserving them all; nor to a liberty upon any emergency of active, direct and purposed making away or removing of any of them, though under pretense of securing the other. I have read of one Alcon, who finding his son fast on sleep upon the grass, and a serpent creeping upon his breast, he not apprehending how otherwise it was possible to save his son, took his bow and shot at the serpent upon the boys breast, which (though to the manifest endangering of his life) yet he chose rather to take that course than by suffering the serpent to leave his life to a more certain destruction; And either his art or good hap was such as that he prevented and slew the serpent and preserved his son: those whom we are bound and most solicitous to preserve, we may upon an extreme exigence put in some hazard that we may preserve them…</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/edward-gee.html">Edward Gee</a></span><span class="wk"><span class="lbl">Work:</span> <cite>An Exercitation concerning Usurped Powers: wherein the Difference betwixt Civil Authority &amp; Usurpation is Stated. That the obedience due to lawful magistrates, is not owing, or payable, to usurped powers, is maintained. The obligation of oaths and other sanctions to the former, notwithstanding the antipolity of the latter is asserted. And the arguments urged on the contrary part in diverse late printed discourses are answered</cite>, … (London, 1650), ch. 4, pp. 30-31</span></figcaption>

</figure><figure class="quote" id="q-ba1a071221" data-kw="">
<blockquote><p>The third consolation which Moses here describes is gladness at beauty bestowed — ‘Let the beauty of the Lord our God be upon us.’ Sorrow mars the countenance and clothes the body with sackcloth; but if the Lord will come to us and adorn us with his beauty, then the stains of mourning will speedily disappear. Brethren, what a beauty is this which the Lord giveth— ‘the beauty of the Lord our God!’ This comeliness is the beauty of his grace; for our covenant God is the God of all grace. If the Lord makes us to know that we are his our faces shine. If He fills us with his life and love, then brightness flashes from the eyes, and there is a grace about every movement. This ‘beauty’ means holiness; for holiness is the beauty of God. If the Holy Spirit works in you the beauty of holiness, you will rise superior to your afflictions. If this church shall be made the holier by its bereavements, we shall gain much by our losses. This beauty of the Lord must surely mean his presence with us. As the sun beautifies all things, so does God’s presence. When we know that Jesus is with us, when we feel that he is our helper, when we bask in his love, when he abides with us in power, this is the beauty of the saints. If we have Christ in us, Christ with us, we can bear any amount of trouble. ‘I can do all things, or can bear All suffering if my Lord be there.’ This beauty gives to the believer an attractiveness in the eyes of men: they perceive that we have been with Jesus, and they behold our faces shining like the faces of angels. It is a great thing when a Christian is so happy, so holy, and so heavenly that he attracts others to Christ, and people seek his company because they perceive that he has been in the company of the blessed Lord. God give you this, and if you have it, dear friend, you may forget your sorrows: they are transfigured into joy.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/charles-h-spurgeon.html">Charles H. Spurgeon</a></span><span class="wk"><span class="lbl">Work:</span> <cite>‘Gladness for Sadness’ on Ps. 90:15-17</cite>, (Jan. 14, 1883) in Metropolitan Tabernacle Pulpit, vol. 29</span></figcaption>

<main class="wrap"><figure class="quote" id="q-a4cc6d4d11" data-kw="">
<blockquote><p>If by ‘thinking’ we mean the capacity for what Bermudez calls direct belief modification, goal-desires, simple seeing, dispositions to form beliefs about things of a general type, and so forth, then non-linguistic animals are capable of thinking. But all of this falls within the range of capacities made possible by what Aristotelians traditionally call the ‘internal senses’. It doesn’t follow that non-linguistic animals are capable of what Bermudez calls second-order cognition, higher-order desires, the attribution to others of propositional attitudes, reflective belief modification, a grasp of compound, modal, tensed and general propositions, situation-desires and epistemic seeing, and so forth… If that is the sort of thing we mean by ‘thinking,’ then there is good reason to conclude that non-linguistic animals are not capable of thinking… Karl Popper drew a distinction between four main functions of language. The first is the expressive function, which involves the outward expression of an inward state… The second is the signaling function, which adds to the expressive function the generation of a reaction in others. Popper compares it to the dange signals an animal might send out in order to alert other animals… The third is the descriptive function, which involves the expression of a proposition, something that can be either true or false… The fourth is the argumentative function, which involves the expression of an inference from one or more propositions to another in a manner that can be said to be either valid or invalid… While the most primitive animals may be incapable of behavior that performs even the first two of these functions, there are also obviously animals that can perform them, and in that sense they can be said to have language. But… [this] does not entail being capable of the descriptive and argumentative functions… Whether animals lacking that particular sort of language, can be said to think in the sense of entertaining concepts, propositions, and logical inferences… the answer must be in the negative.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/edward-feser.html">Edward Feser</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Immortal Souls: a Treatise on Human Nature (Editiones Scholasticae, 2024) | pt. 1, ‘What is Mind?’ | ‘Thought &amp; Language’, pp. 99-102</cite>, ch. 3 ‘The Intellect’</span></figcaption>

</figure><figure class="quote" id="q-9620be16ed" data-kw="">
<blockquote><p>The short answer is that the will is the power or capacity of a rational substance to pursue what the intellect judges to be good. (Not necessarily morally good, but at least good in the broad sense of being suitable or desirable in some way.) It is also traditionally known as the ‘rational appetite.’ It is an appetite insofar as it involves an inclination or tendency toward some object or end. It is a rational appetite insofar as the object is pursued as something conceptualized in a certain way, and thus as something about which we might reason and come to know true propositions. This distinguishes the will from the appetites that non-human animals possess, which involve inclinations toward non-conceptualized objects of sensory perception; and from the sorts of inclinations or tendencies that a plant or an inanimate substance might exhibit, which are not even conscious, let alone conceptualized… A human being, by contrast, can not only perceive and desrie water, but can know that it is water and desire it precisely as something conceptualized… To be able to do that sort of thing is just what it is to have a will. This is, in any even, the account fo the will famously associated with Aquinas…</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/edward-feser.html">Edward Feser</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Immortal Souls: a Treatise on Human Nature (Editiones Scholasticae, 2024), pt. 1</cite>, ch. 4, ‘The Will’; p. 111</span></figcaption>

ociated%20with%20Aquinas&amp;text=The%20short%20answer%20is%20that%20the%20will%20is&amp;text=account%20fo%20the%20will%20famously%20associated%20with%20Aquinas" rel="noopener" target="_blank">Read it online · Reformed Books Online</a></div>
</figure><figure class="quote" id="q-6ea1dd5eff" data-kw="">
<blockquote><p>Therefore choice, arbitrium (an excessively proud term, in Greek αὐτεξούσιον), naturally considered, is the faculty of intellect and will by which we do what we want, by preceding counsel and judgment, such that we are not determined by any other created cause. It pertains to the intellect and will in such a way that the intellect judges and shows what should be done, but the will commands what is shown and judged, and thus at root it has reference to the intellect, but formally it has reference to the will. This certainly implies some indifference, in a divided sense, as they say, by which, with the consideration of the divine decree and predetermination set aside, man is indifferent at least by nature to acting or not acting; yet he is not indifferent in a composite sense, with regard to the divine decree and its predetermining providence, but is already determined virtually to one or the other; much less does choice consist in indifference itself. For in this way neither God, nor angel, nor any man, regenerate or unregenerate, would possess free choice, and consequently free choice would be a non-entity. For God is determined to good… And so arbitrium, choice, is more correctly said to consist in the power of acting from counsel and προαίρεσις, free choosing, or what is the same thing, in rational complacency.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/petrus-van-mastricht.html">Petrus van Mastricht</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Theoretical Practical Theology (RHB), vol. 3, bk. 4, ch. 4, ‘The Penalty &amp; State of Sin’, section 10</cite>, p. 526</span></figcaption>

<blockquote><p>Definition [of Ontological Goodness] Just as ontological truth states the relation of being to the cognitive faculty, so goodness involves a relation to the appetitive faculty or the will. Just as the former consists in the knowability of being, so the latter consists in being’s appetibility. Hence it is defined as the property of being whereby it is made appetible or willable or, more briefly, it is appetibility or willability. On other interpretations of ontological goodness see what I wrote elsewhere (Wolter, Transcendentals, p.199 ff.). On the Convertibility of Ontological Goodness Conclusion 29: Every being is good, or being and good convert. The appetite or will tends to its object either because the object is perfect for it, namely insofar as it has the being-ness and perfection due to it (love of benevolence), or because the object confers perfection on another (love of concupiscence). As far as God is concerned, it is plain that he is altogether perfect and so supremely appetible both to himself and to another. As far as creatures are concerned, one must say that they are truly loved or willed by God himself, otherwise they would not exist; therefore they are lovable or willable. Further, creatures are also good for other creatures; for example substance upholds accidents, accidents give further perfection to substance, etc.</p></blockquote>

<div class="actions"><button class="copy" data-copy="“Definition [of Ontological Goodness] Just as ontological truth states the relation of being to the cognitive faculty, so goodness involves a relation to the appetitive faculty or the will. Just as the former consists in the knowability of being, so the latter consists in being’s appetibility. Hence it is defined as the property of being whereby it is made appetible or willable or, more briefly, it is appetibility or willability. On other interpretations of ontological goodness see what I wrote elsewhere (Wolter, Transcendentals, p.199 ff.). On the Convertibility of Ontological Goodness Conclusion 29: Every being is good, or being and good convert. The appetite or will tends to its object either because the object is perfect for it, namely insofar as it has the being-ness and perfection due to it (love of benevolence), or because the object confers perfection on another (love of concupiscence). As far as God is concerned, it is plain that he is altogether perfect and so supremely appetible both to himself and to another. As far as creatures are concerned, one must say that they are truly loved or willed by God himself, otherwise they would not exist; therefore they are lovable or willable. Further, creatures are also good for other creatures; for example substance upholds accidents, accidents give further perfection to substance, etc.”

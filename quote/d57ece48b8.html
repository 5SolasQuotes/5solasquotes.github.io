<blockquote><p>But, are not the knowledge of God and the principles, like the common sentences, imprinted in the nature of man, even though it is so corrupted?

They obviously are, though they are like the ruins of a magnificent building. Most importantly I say that this [saving] faith does not consist of natural knowledge, but it is necessary to add that which God particularly revealed to the world through the Prophets &amp; Apostles, which flesh and blood could never deduce. This final point must be noted, that in which we find the special difference between faith and natural knowledge, that is, that each believer particularly applies to himself the promise of eternal life, whose testimony the Scriptures call certainty.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/theodore-beza.html">Theodore Beza</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Questions et r</cite>, éponses Chrestiennes (Eustace Vignon, 1584), 38-39. Translated in David Haines, Without Excuse: Scripture, Reason, and Presuppositional Apologetics (Lincoln NE: The Davenant Press, Kindle Edition, 2020), pp 225-26.</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/theology/natural-theology.html">Natural Theology</a></span></div>

</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-4f63c5d071" data-kw="">
<blockquote><p>So the apostle in these two verses is shewing what that knowledge of God was which the Heathens had, and how they came by it. God’s eternal power and Godhead, which are in themselves invisible, was a thing the knowledge whereof was attainable by the light of nature. They had common principles of knowledge given them of God, whereby, looking upon the works of creation, they might safely and solidly gather, what a God he was and what was his due; so that they were rendered inexcusable in abusing this light; and their mouths were stopped, so that they had nothing to say for themselves, why they lived in ungodliness and unrighteousness. …

However the Lord Jehovah be it himself unsearchable, yet hath he left at much light in folks, that were they desirous, by the very principles of natural knowledge, they might see as much of God as might convince them that he only is to be worshipped, loved, and feared for it pleased the Lord that as much as might be sufficient for this end, should remain attainable by sand-blind nature; that is it that might be known.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/john-brown-of-wamphray.html">John Brown of Wamphray</a></span><span class="wk"><span class="lbl">Work:</span> <cite>An Exposition of the Epistle of Paul the Apostle to the Romans, with Large Practical Observations; Delivered in Several Lectures</cite>, (Edinburgh: David Paterson, 1766), p. 34.</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/theology/natural-theology.html">Natural Theology</a></span></div>

ormed Covenanter</a></div>
</figure><figure class="quote" id="q-ca2b4e9223" data-kw="">
<blockquote><p>As now for instance; The light of Nature that will teach this: That we are to worship God: the Heathens have worshiped God in their way. … Yea, the light of Nature will teach, That we must live justly among men, yea, and that we must do as we would be done to: This the light of Nature will teach.

Many of the Heathens have had that principle, to be just with men, to do as we would be done by. The light of Nature condemns gross sins, of Drunkenness, Adultery, Swearing &amp;c. I could give you many instances in the Laws of Heathens, punishing those sins very severely, and some of them with death. …

Yea the light of Nature will rise thus high, That a man should be conscientious, should make conscience of secret sins, of sins that none in the world could know of, or are ever like to know of. As I remember sometimes I have told you of one of the Heathens that did but owe for a pair of shoes to a Shoe maker, and nobody knew it but only the Shoe-maker himself; the Shoe-maker dies, nobody could challenge this of him, yet his conscience would never let him be at quiet, until he ran and threw the money into the shop, and said, Though he be dead to others, yet he is not dead to me: whereas he had a temptation to have kept it because nobody could challenge it; he knew it was not his, he knew it was either the Children’s, or Executors, and so he restored it.

Many particulars might be named to shew how far we might go by the light of Nature; but now I only bring it in to this end, to shew that if we would have our Conversations such as becomes the Gospel of Christ, we must go beyond what ever any have done by the light of Nature: and yet Oh Lord how short do many Professors of Religion come of this! How many that will profess they hope to be saved by Christ!</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/jeremiah-burroughs.html">Jeremiah Burroughs</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Gospel-conversation: wherein is shewed, I. How the conversation of believers must be above what could be by the light of nature. II. Beyond those that lived under the law. III. And suitable to what truths the Gospel holds forth</cite>, (London: Peter Cole, 1650), pp 33-34.</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/theology/natural-theology.html">Natural Theology</a></span></div>

</figure><figure class="quote" id="q-7c1020566f" data-kw="">
<blockquote><p>What are the outward things which God has given to call us by? They are either common to the whole world, or proper to the Church. What are the things common to the whole world? God’s works not unprofitably given, although not sufficient to salvation. Is not the knowledge of the wisdom, power and goodness of God in the creation and government of the heaven and earth, with the things that are in them, sufficient to make us wise to salvation? No: First, it serves rather for further condemnation without the Word, Rom. 1:19-21. Secondly, as by and with the Word, the due meditation and consideration of God’s works is a good help to further us in religion and in the graces of God’s Spirit, 1 Cor. 1:21-22.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/james-ussher.html">James Ussher</a></span><span class="wk"><span class="lbl">Work:</span> <cite>A Body of Divinity</cite>, … (London: M.F., 1645), ‘Hitherto we have treated of the rule and square of our sanctification…’, pp. 394-96</span></figcaption>

<blockquote><p>It is very true, that things subordinate are not at variance. There is a natural end. As nature is subordinate to God, so natural ends are subordinate to those which are supernatural and divine. The end of our nature, so far as it is natural, is this, that it should approach very near to the Divine; so far as it is supernatural, it is that man may be united to God.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/francis-junius.html">Francis Junius</a></span><span class="wk"><span class="lbl">Work:</span> <cite>A Discussion on the Subject of Predestination between James Arminius &amp; Francis Arminius in The Works of James Arminius</cite>, … trans. Nichols &amp; Bagnall (Auburn: Derby &amp; Miller, 1853), vol. 3, pp. 149-150</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/theology/natural-theology.html">Natural Theology</a></span></div>

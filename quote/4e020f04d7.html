<main class="wrap"><figure class="quote" id="q-4e020f04d7" data-kw="">
<blockquote><p>It cannot be concluded that sufferings are not for God, because those who profess themselves to be the people of God are the instruments of them; or that it is not the cross of Christ which is borne, because it is laid on by those who profess Christ. Abel is called the protomartyr, the first sufferer for God; and he suffered by the hand of one who worshipped the same God, with the same kind of worship: both Abel and his persecutor offered sacrifice. Isaac suffered by Ishmael, Gal. iv. 29; yet Ishmael was Abraham’s son, and by him circumcised, and so admitted to the church and its privileges.

Who were those that persecuted the prophets of old, but they who professed themselves to be the peculiar people, and true worshippers of the true God? Jerusalem, the chosen city, killed the prophets, and stoned God’s messengers, Mat. xxiii. 37. Amongst this people, though there was no other people that owned the true God in the world, some persecutors were found in every generation. Even when they utterly disclaimed this, as thinking themselves far enough from being persecutors, yet then are they charged with this guilt by Christ himself, ver. 30, 31. Christ himself suffered by those who took themselves peculiarly to be the people of God. And since the profession of Christ became general, ordinarily a man’s enemies are those of his own house. The bitterest persecutors are those of the same profession.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/david-clarkson.html">David Clarkson</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Of Taking up the Cross in The Practical Works of David Clarkson, B.D., Fellow and Tutor of Clare Hall, Cambridge</cite></span></figcaption>
<div class="meta"><span class="t"><a href="../topics/trials-the-cross-and-comfort/suffering-and-the-cross.html">Suffering and the Cross</a></span></div>

</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-f70dbdf172" data-kw="">
<blockquote><p>It is observable in the Revolution, that the People of Scotland came all into the Principles of the suffering sincere Party, the suffering Party kept their own footing, and did not go over to them; those that had thro’ Fear, or from Time-serving Principles, or from what of Zeal, or from any other weak Reason consented, and, as I may call it, taken so low a Step, as to accept of Licenses from God’s Enemies to serve Christ; asking leave of Men to Worship God; a Duty and a Debt which they had a Natural and Divine Right to, without bowing the Knee to Baal for it; I say, THESE, for from justifying or recommending the Practice, openly recognized the Zeal, Courage and Sincerity of the Sufferers, honoured them for it, and rather desired to bury their own Compliances in Silence and Forgetfulness, than to have it mentioned or remembered.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/daniel-defoe.html">Daniel Defoe</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Memoirs of the Church of Scotland, In Four Periods</cite>, (London: Eman. Matthews, 1717), p. 300.</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/trials-the-cross-and-comfort/suffering-and-the-cross.html">Suffering and the Cross</a></span></div>

</figure><figure class="quote" id="q-e540b2a3ed" data-kw="">
<blockquote><p>When the affliction is of long continuance. Some afflictions are like a summer-shower, heavy in their time, but soon over, and it grows fair again: but the most trying are the continuing afflictions, that are like a stormy winter, that blows hard day after day. Many times deliverance is looked for, but it comes not. Any promising signs that appear at any time do misgive: and the storm is renewed, and grows ever the longer the more hopeless. Here is a sore shock to abide, which requires to fight in faith,

1st, Believing that this is a part of the discipline of God’s house, whereby he exercises his own children. Hence says the prophet, Jer. viii. 20, “The harvest is past, the summer is ended, and we are not saved.” David complains, Psal. Ixix. 3. of his being weary of his crying, of his throat’s being dried; of his eyes failing while he waited for his God. The church was so long continued in affliction, that she forgot prosperity, Lam. iii. 17. Many of the Lord’s people have been kept so long under the hatches, that they have hung up their harps on the willows, so as to have no more use for them; and yet have been delivered.

2dly, Believing that the longest and blackest night will have a morning; and that though the affliction continue long, it will not continue always. Hence says the Psalmist, Psal. ciii. 9, “The Lord will not always chide: neither will he keep his anger for ever.” If the question be, “Watchman, what of the night? watch man, what of the night?” Is. xxi. 11. the answer is, ver. 12, “The morning cometh, and also the night: if ye will inquire, inquire ye: return, come.” The sky that has long lowered, may clear ere night: the wound may be looked on as incurable, that yet will be fairly healed, Jer. xv. 18, 20. And if it should not be removed in time, yet the faith of a blessed eternity may keep up the heart, when “God shall wipe away all tears from the eyes; and there shall be no more death, neither sorrow, nor crying, neither shall there be any more pain: for the former things are passed away,” Rev. xxi. 4.

3dly, Believing that God knows the fittest season for removing the affliction, and not we. Hence said our Lord to his brethren, in another case, John vii. 6, “My time is not yet come: but your time is always ready.” He keeps times and seasons in his own hand, and at the fit time he will remove it, Hab. ii. 3. but not before, if it is to be removed in mercy. Men’s hearts must abide much hewing, and God may have much ado with an affliction that is not soon done. The affliction is too soon over, that is removed ere the design of it be answered, Psal. x. 17. None blames the husbandman, that he sows not his seed, before the ground be fit to receive it.

Lastly, Believing that the more we are resigned to the Lord as to the time and method of deliverance, the nearer we are to it, the fairer we lie for it. Hence says the Psalmist, Psal. x. 17, “Lord, thou hast heard the desire of the humble: thou wilt prepare their heart, thou wilt cause thine ear to hear.” Man’s extremity is God’s opportunity, Dent. xxxii. 36. Witness Abraham on the mount, the disciples at sea, the Israelites at the Red sea. Happy should they be, who leaving the deliverance on the Lord, should make it their main care to answer the calls of providence by the affliction while it is continued.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/thomas-boston.html">Thomas Boston</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Christian Warfare: or, The Good Fight of Faith. Several Sermons, Preached at Ettrick, in the year 1723</cite>, in The Complete Works of the Late Rev. Thomas Boston, Ettrick, ed. Samuel McMillan (12 vols, London, 1853), 6: 651-52.</span></figcaption>

<blockquote><p>…the proximate cause of the [first, original] sin was the free will of our parents, who, turning themselves from the true good to a fictitious appearance of good, fell into the snares of Satan beyond their expectation.</p></blockquote>

<blockquote><p>&quot;You have chastised me, and I was chastised, as a bullock unaccustomed to the yoke; turn me and l shall be turned.&quot; &amp;c. And it is for the breaking down of the weight of one&#x27;s spirit that God lays it on: for which cause it is declared to be a good thing to bear it, that being the way to make one at length as a weaned child. Secondly, A strong desire to have the cross removed, and to have matters in that part going according to our inclinations. This is very natural, nature desiring to be freed from everything that is burdensome or cross to it; and if that desire is kept in a due subordination to the will of God, and it is not too pre-emptory, it is not sinful. &quot;If it is possible, let this cup pass from me; nevertheless, not as I will.&quot; &amp;c.</p></blockquote>

<main class="wrap"><figure class="quote" id="q-e005d76e50" data-kw="">
<blockquote><p>Another question is, whether that baptism is lawful, which is administered by heretics. We reply, that a distinction must be made between those heretics who corrupt the substance of baptism, and omit or alter the form of the institution, and those who retain the essentials, and maintain the true doctrine of the Trinity, though they err in other points of doctrine, as did formerly the Novatians and Donatists, and in the present age, the papists.

With respect to the former class of heretics, we say that baptism administered by them is not lawful: for this reason the baptism of those Arians was rejected, who baptized in the name of the Father, as the true God, of Jesus Christ, as the Saviour, and a creature, and in the Holy Ghost, as the servant of both; though indeed learned men doubt whether the Arians did baptize in this form or not. The baptism of the Eunomians was equally to be disallowed, which was performed, according to Epiphanius, in the name of the uncreated God, of the created Son, and the sanctifying Spirit, created by the Son. The council of Nice also required the disciples of Paul of Samosata to be rebaptized.

But here we must remark, that the question is not concerning baptism administered by a pastor, who is heretical indeed, but secretly, in an orthodox church; for in this case baptism is lawful. With respect to the other class of heretics, who retain the essentials of baptism, not changing or corrupting the form, we maintain that baptism administered by these, is valid and lawful: for, although they are not true members of the church, this does not prevent them from lawfully baptizing, provided they retain the essentials of the ordinance; since in the performance of the rite, they merely lend their hand and tongue to the Lord, who himself baptizes, and works through their instrumentality.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/benedict-pictet.html">Benedict Pictet</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Christian Theology</cite>, trans. Frederick Reyroux (1696; London, 1834), 11.4, pp 490-91.</span></figcaption>

</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-fea8c552e5" data-kw="">
<blockquote><p>But if your meaning be, (as I strongly suspect it is) that we must not expect to be owned by Christ, except we give up infants baptism; then, I say, it is the most uncharitable, as well as unwarrantable, and dangerous censure that ever dropt from the pen of a sober Christian. It is certainly your great evil to lay salvation itself on such a point as the proper subject of baptism, and to make it articulus stantis vel cadentis religionis [the article of the standing or falling of the church], the very basis on which the whole Christian religion, audits professors salvation must stand. I hope the rest of your brethren are more charitable than yourself; but however it be, I do openly profess, that I ever have, and still do own you, and many more of your persuasion, for my brethren in Christ, and am persuaded Christ will own you too, notwithstanding your many errors and mistakes about the lesser and lower matters of religion. Nor need your censure much to affect us, as long as we are satisfied you have neither a faculty nor commission thus solemnly to pronounce it upon us. But what is the condition upon which this dreadful sentence depends? why, it is our attendance or non-attendance to the primitive purity of the gospel-doctrine. Sir, I hope we do attend it, and, in some respects, better than some great pretenders to primitive purity, who have cast off not only the initiating sign of God’s covenant, (this did not Abraham) but also that most comfortable and ancient ordinance of singing Psalms: and what other primitive ordinance of God may be cashiered next, who can tell? We have a witness in our bosom, that the defence of Christ’s pure worship and institution hath cost us something; and as for me, were I convinced by all that you have here said, or any of your friends, that in baptizing the infants of believers, we did really depart from the primitive purity, I would renounce it, and turn Anabaptist the same day.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/john-flavel.html">John Flavel</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Whole Works of the Reverend John Flavel</cite>, vol. 6 (London; Edinburgh; Dublin: W. Baynes and Son; Waugh and Innes; M. Keene, 1820), 328.</span></figcaption>

</figure><figure class="quote" id="q-1e4e9a1415" data-kw="">
<blockquote><p>The Argument from Act. 2.38, 39. may be thus formed: To whom the promise is made, they may be baptized; but to the Infants of Believers the promise is made; therefore they may be baptized.

The Minor is proved from the words of vers. 39. for the promise is made to you and to your children.

That an answer may be fitted to this Argument:

With the 1. Observation of Master T. in this Answer we close, that the promise meant here, is that which was made to Abraham, hinted Gen. 12. Enlarged and confirmed, Gen. 17. Illustrated, Gen. 22. According to Act. 3, 25.26. Act. 13.32, 33. Rom. 15.8, 9. provided that Mr. [John] T[omes]. take the 26. Verse of Act. 33. duly according to the Exposition of the 25. Verse. The 26. v. is, Unto you first God having raised up his Son Jesus Christ, sent him to bless you, in turning away every one of you from his Iniquities. The due genuine sense of which words according to Verse 25. is this: These to whom the Apostle speaks were children of the Covenant which God made with their Fathers, saying unto Abraham, And in thy seed shall all kindreds of the Earth be blessed. According to Gen. 12.3. Gen. 17.7. Gen. 22.18. which Texts do write it as clearly as the sun beams.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/nathanael-holmes.html">Nathanael Holmes</a></span><span class="wk"><span class="lbl">Work:</span> <cite>A vindication of baptizing believers infants: In some animadversions upon Mr. Tombes his Exercitations about infant baptism; as also upon his Examen, as touching the antiquities and authors by him alleged or contradicted that concern the same. Humbly submitted to the judgement of all candid Christia</cite>, (London: M. Simmons, 1646), pp 41-42.</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/baptism.html">Baptism</a></span></div>

<blockquote><p>If anyone shall assert that with persons in covenant God’s grace never precedes the sign nor bestows inwardly what is simply essential to salvation, he puts forth a heresy utterly unsupported by Scripture.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/andre-rivet.html">André Rivet</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Le catholique orthodoxe opposé au catholique papiste, en IV traitez</cite>, … (Saumur, 1616), Tract 3rd, quest. 3, sect. 2. Quoted in Herman Witsius, On the Efficacy and Utility of Baptism in the Case of Elect Infants whose Parents are under the Covenant (1693), trans. William Marshall, ed. J. Mark Beach in Mid-American Journal of Theology, 17 (2006), p. 146.</span></figcaption>

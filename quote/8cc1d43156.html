<blockquote><p>Some that live in countries where none in twenty miles openly use the New one, come to Richard Baxter for counsel; he desires them to bring one of the contrary judgment and judge when they hear both: He tells them that:

1. They should keep up the New Translation as far as they can in God’s public worship, while the hurt will not be greater than the benefit.

2. That when they have no public church or worship to join with, but what uses the Old one, they should rather join with such than none, as also when they cannot have the New one without more hurt than benefit.

3. And that while they can have the New one, they should not renounce communion with the churches that use the Old one, as separating from it as unlawful, but only disown the faults of the Old one, while they disown not the communion of the churches in the use of it. The other says:

1. That it is a cursed thing to offer God a worse [worship] while we have better.

2. That we are sworn [by the SL&amp;C] against it.¹ ¹ [The SL&amp;C does not mention the KJV, but the argument is that the KJV is held (by them) to be part of the reformation, or the reforming process, that the SL&amp;C binds to.]

3. That it is false worship and obeying man before God.

4. That we [the ones who only use the New translation] do but keep our possession, which they would put us out of, and it’s they that separate from us, and not we from them.

5. That we keep to God’s Word, which is the only rule. And therefore communion with the Old Translation is unlawful, and we should rather suffer death. Baxter answers:

I. (1) That it is a cursed thing to give God no public worship because we cannot have the New Translation, and to live like atheists if we cannot have what we would. None is worse than the Old. Family worship without church worship is worse than an Old Translation. (2) And that it is not we that offer God the worse before the better; it is they that exclude the better, which we protest against, having not our choice.

II. That he that sware [1.] to give over all church worship unless he have the New Translation, swore wickedly like an atheist; and he that swore [2.] to communicate with no church that used the Old Translation, swore wickedly like a schismatic; and he that swore [3.] that God’s providence should never return him to a necessity of using the Old,¹ swore blasphemously, as if he could have governed the world against God. ¹ [Note that such conditions are not in the SL&amp;C. See also ‘All Vows are Qualified’ and ‘Vows can Never Bind Beyond God’s Law’.]

III. That all worship is so far false as it is faulty; That to forsake all public worship when we cannot have the better translation is to be righteous, unrighteously, over much [Eccl. 7:16], and too little [righteous], and to disobey both God and man.

IV. Keep your possession as long as you can without more hurt than good. I am not one that ever strove to take it from you. But do your brethren in prison enjoy public worship? You’ll say, ‘They do better. It’s easier bearing their imprisonment, poverty and death than your own.’ But what shall ten parts of the kingdom do that must have the Old Translation or none? You’ll say, ‘I suppose, they may give over all church worship as impossible and take up with family worship.’ But stay:

      1. Must you not first prove the Old so bad as that no-church worship is better? Have you proved this?

      2. Will not your reason prove that we must also separate from you? Have not weak ministers as bad faults as a weak translation?

      3. What’s become then of your saying, ‘We had possession’? Have they possession of better that have none at all? Or will you be without all, because you had once possession of better? And will it excuse your ungodliness that you can lay the blame on them that dispossessed you? Or if they be schismatics for so using you, does it follow that you are none, if you persuade all to separate from all God’s Church worship rather than join where the Old Translation is used?

V. God’s Word is the rule, but only a general rule for words, modes and circumstances. To love God and our neighbour and the unity of the Church are his greatest commands. Go learn what these mean. To violate these and forsake all Church worship, if you cannot have the best translation, is not to keep to the rule, but most grossly to violate it in the greatest commands against many Scripture admonitions which vehemently urge you to love and unity.</p></blockquote>

<blockquote><p>Moreover, when a magistrate is not able to do some part of his office, as for example, being able to do the duties which are to be performed in peace, is insufficient for martial affair, yet no man refuses that which he is able to give because he is not able to do all that is required: Even so, endeavoring to our uttermost a sufficient ministry, I would think in the mean season that the good things they are able to give us may be taken at their hands.</p></blockquote>

<blockquote><p>Section 5. Note that things not determined of God [for public worship] and left to the determination of men must be such as are necessary in genere, and not things idle and superfluous. A superior may not institute a superfluous thing that is not simply evil, though sometimes the inferior may lawfully obey therein; or to speak more properly, [the inferior may] lawfully do the thing to avoid inconvenience, or to testify respect to the superior, though in that particular he has no lawful power to command. Note also, that of things necessary in genere, the superior may not lawfully determine for such species, as, though not simply evil, may have a tendency to evil or be evil in the consequence, when he may determine that which will not be evil in the consequence. Yet the inferior may obey, or rather observe the thing commanded, when the evil consequence of non-observance will be greater than the evil consequence of observance. Section 6. If superiors command that which is above their sphere to command [for public worship], namely, things not necessary in genere [by its kind], yet if they be not simply evil, subjects may¹ do those things, unless they be evil in their consequence to a higher degree than the not doing of them would be.² In this case it is not formal obedience,³ but they are done for the end’s sake and to avoid evil.</p></blockquote>

— John Corbet, Of Divine Worship… in The Remains of the Reverend &amp; Learned Mr. John Corbet… (London: Thomas Parkhurst, 1684), pt. 3 Corbet (d. 1680) was an English, congregationalist puritan.">Copy</button><a class="share" href="https://x.com/intent/post?text=%E2%80%9CSection+5.+Note+that+things+not+determined+of+God+%5Bfor+public+worship%5D+and+left+to+the+determination+of+men+must+be+such+as+are+necessary+in+genere%2C+and+not+things+idle+and+superfluous.+A+superior+may+not+institute+a+superfluous+thing+that+is+not+simply+evil%2C+though+sometimes+the+inferior+may+lawfully+obey+therein%3B+or+to+speak+more+properly%2C+%5Bthe+inferior+may%5D+lawfully+do+the+thing+to+avoid+inconvenience%2C+or+to+testify+respect+to+the+superior%2C+though+in+that+particular+he+has+no+lawful+power+to+command.+Note+also%2C+that+of+things+necessary+in+genere%2C+the+superior+may+not+lawfully+determine+for+such+species%2C+as%2C+though+not+simply+evil%2C+may+have+a+tendency+to+evil+or+be+evil+in+the+consequence%2C+when+he+may+determine+that+which+will+not+be+evil+in+the+consequence.+Yet+the+inferior+may+obey%2C+or+rather+observe+the+thing+commanded%2C+when+the+evil+consequence+of+non-observance+will+be+greater+than+the+evil+consequence+of+observance.+Section+6.+If+superiors+command+that+which+is+above+their+sphere+to+command+%5Bfor+public+worship%5D%2C+namely%2C+things+not+necessary+in+genere+%5Bby+its+kind%5D%2C+yet+if+they+be+not+simply+evil%2C+subjects+may%C2%B9+do+those+things%2C+unless+they+be+evil+in+their+consequence+to+a+higher+degree+than+the+not+doing+of+them+would+be.%C2%B2+In+this+case+it+is+not+formal+obedience%2C%C2%B3+but+they+are+done+for+the+end%E2%80%99s+sake+and+to+avoid+evil.%E2%80%9D%0A%0A%E2%80%94+John+Corbet%2C+Of+Divine+Worship%E2%80%A6+in+The+Remains+of+the+Reverend+%26+Learned+Mr.+John+Corbet%E2%80%A6+%28London%3A+Thomas+Parkhurst%2C+1684%29%2C+pt.+3+Corbet+%28d.+1680%29+was+an+English%2C+congregationalist+puritan.&amp;url=https%3A%2F%2F5solasquotes.github.io%2Fquote%2F30fb86e05a.html&amp;via=5Solas" target="_blank" rel="noopener">Share on X</a><a class="perma" href="../quote/30fb86e05a.html">Permalink</a><a class="src" href="https://reformedbooksonline.com/on-impurities-in-worship/#:~:text=Section%205.%20Note%20that%20things%20not,end%E2%80%99s%20sake%20and%20to%20avoid%20evil&amp;text=Section%205.%20Note%20that%20things%20not%20determined%20of&amp;text=for%20the%20end%E2%80%99s%20sake%20and%20to%20avoid%20evil" rel="noopener" target="_blank">Read it online · Reformed Books Online</a></div>
</figure><figure class="quote" id="q-7b93b1b030" data-kw="">
<blockquote><p>Will any object unto us the profaneness of the ministers, rudeness and disorder of the ministration of God’s worship, we yield it is too visibly true; but more vile administrators, or irregular administrations cannot be than were the sons of Eli in their service, who made the people to loathe the offerings of the Lord, and were rebuked, and described by Samuel in 1 Sam. 2:12-17… O horrid uncleanness, most heaven-daring villany! Yet I find not that any God-fearing-Israelite forsook the sanctuary, or durst forbear their sacrifice; nor did Samuel (who reproved, and denounced God’s judgment against this profaneness) ever advise or direct the same.</p></blockquote>

<blockquote><p>…these were to be offered continually as a burnt offering upon the altar, which law was not to take place until they came into the [Promised] Land, as we heard before in the like case, [Num.] ch. 15:2, because in the desert they wanted many things necessary, Dt. 12:8, which was a sufficient dispensation for the omitting of them: For when God does require anything, He gives means to perform it; and did never impute it as a sin unto them when an inevitable necessity did hinder them, and the desire to obey is no less accepted than obedience itself.</p></blockquote>

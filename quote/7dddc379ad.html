<main class="wrap"><figure class="quote" id="q-7dddc379ad" data-kw="">
<blockquote><p>…for no less will God call civil magistrates to an account for their negligence and maladministrations than Church pastors and ministers; therefore both should amicably correspond and cordially concur for advancing the peace and purity of the Church, for which purpose it is our hearty vote that God would pour forth a spirit of wisdom, zeal and holiness upon magistrates, ministers and all ranks and degrees of persons, Amen.</p></blockquote>

<blockquote><p>Every secesion is not evil and schismatical, but only that which is made rashly and unjustly. Since this cannot be said of ours [from Rome] (which had the most weighty and highly necessary causes), schism cannot be charged upon us…</p></blockquote>

</figure><figure class="quote" id="q-c504ac76a8" data-kw="">
<blockquote><p>[Margin note:] Schism and actual gathering of churches out of churches cannot be tolerated. 3. Such opinions and practice as make an evident schism in a Church and set up two distinct Churches of different forms of government, and pretending to different institutions of Christ, of which the one must by the nature of their principles labor the destruction of the other, cannot be tolerated, etc. for each pretending their fellow Churches to be of man, and so of the devil, though they should both make one true invisible Church, agreeing in all fundamentals and many other truths, yet sure the whole should be a kingdom divided against itself, and this destroys peace and unity. And if Paul could not endure the divisions of one and the same Church of Corinth, though they pretended not to be different Churches, for those that said they were of Paul professed they could not be disciples of Peter, but he sharply rebuked them as carnal men and such as divided Christ, and by consequence must say Paul was crucified for them and was their redeemer, and so, if obstinately they had proceeded in that separation, Paul would have gone on to higher censures of the Church: far more could he not endure gathering of true Churches out of true Churches, which is the professed practice of Independents: And yet both sides pretending the spirit of discerning could say, ‘The Spirit testifies to my soul that Paul is the only called preacher,’ and the other, ‘Nay but to my discerning, Cephas or Peter is the only man that I can hear or follow.’ And a third, ‘Nay, not any on earth, nor any ministry will I acknowledge but Jesus Christ, whom the heavens must contain till the last day is my only, only preacher.’ Now if a Jezabel come in and say no ministry is to be heard but Christ and turn away all from hearing the Word, and not suffer Sergius Paulus or any other to hear Paul or any godly minister, sure Jezabel should be a perverter of the right ways of the Lord and so not suffered.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/samuel-rutherford.html">Samuel Rutherford</a></span><span class="wk"><span class="lbl">Work:</span> <cite>A Free Disputation against Pretended Liberty of Conscience... (London: 1649), ch. 7, ‘What Opinions’</cite>, pp. 98-99</span></figcaption>

</figure><figure class="quote" id="q-6fde623784" data-kw="">
<blockquote><p>(1.) It is clear that the specific and essential form of a fundamental article is not taken from the authority of God speaking in the Word (seeing God’s authority is one and the same in all that He speaks), but from the influence that the knowledge of an article has to unite us to God in Christ, and bring us to salvation. (2.) And secondly, it will follow that this, Thou shalt not by the use of things indifferent kill him for whom Christ died, and the like is no less fundamental, by evident consequence, in respect it is spoken by God’s own authority, than articles of our faith. (3.) It follows that formalists ignorantly divide matters of God’s worship, into matters of faith, or points fundamental, and things indifferent, as if many scriptural truths were not to be found in God’s Word, such as the miracles of Moses, and Elias, the journeys of Paul, which are neither matters fundamental, nor yet things indifferent. (4.) Many things may be fundamental, by consequence, to one who can read the Word, and hear it read, which is not by consequence fundamental to a rude and ignorant man.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/rutherford-s-distinctions.html">Rutherford’s Distinctions</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Due Right of Presbyteries… (1644), pt. 2, ch. 4, section 5, p. 221 ff. | 4 Distinctions about Fundamentals</cite></span></figcaption>

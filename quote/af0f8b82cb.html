<main class="wrap"><figure class="quote" id="q-af0f8b82cb" data-kw="">
<blockquote><p>The Spouse of Christ Jesus, when she shines in Love, she is amiable in Beauty; precious in the eye of her Husband, powerful with God her Father, prosperous in her own spiritual health and vigour, and prepared for her consummate marriage in celestial glory. Her husband is God, and God is love, and God cannot but love that love which is like himself. And that they may love his Spouse for her love, when she becomes one Spirit with him, by this unity of Spirit he gives her an uniformity of love; the ointment of Christ Jesus, the Head, floweth down into all his members, and breatheth love into them; and as far as his life goes, so far goeth his love: therefore no love, no life in Christ Jesus. Agreeably, the beloved Disciple, and an especial Teacher of love, having shewed that the New-birth brings love with life, he fitly addeth, He that loveth not, abideth in death. No wonder then, if the great Master and lover of this Disciple, make love the mark of his true Disciples, seeing those are only Christ’s true Disciples, which so learn Christ, as they draw that spirit from him, which teacheth them love, and breatheth it into them.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/francis-rouse.html">Francis Rous</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The balm of love: To heal divisions, and the wounds made by them, and to make the body of Christ whole and entire for its own beauty, strength, and safety. Partly presented in a former discourse, when it might have prevented, and now after many evils for want of prevention re-enforced in a second</cite>, (London: John Wright, 1648), pp 1-2.</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/the-christian-life.html">The Christian Life</a></span></div>

<blockquote><p>IT is the Apostle’s Precept that we should stand fast in the liberty with which Christ hath made us free; and doubtless we are no more to deprive our selves of that liberty which our great Creator hath indulged us, than to throw away the life, health or estate with which he hath blessed us.

It is one thing for us as our free-will offering to set apart one of the days which God hath given us for our own occasions, for the service of God; another thing for us to think our selves obliged to do this, and to do it in a pretended Conscience to a command, when we have no such command.</p></blockquote>

</figure><figure class="quote" id="q-b5f73bdc49" data-kw="">
<blockquote><p>That which is the sum of religion, sincerity, and a correspondency between profession and practice, is confirmed by reason, and much strengthened by nature itself; so that religion, reason, and nature, conspire in one, to hold out the beauty and comeliness of sincerity, and to put a note and character of infamy and deformity upon all hypocrisy and deceit, especially in the matters of religion.

There is nothing so contrary to religion, as a false appearance, a shew of that which is not: for religion is a most entire and equable thing, like itself, harmonious in all parts of it, the same within and without, in expression and action, all correspondent together. Now, to mar this harmony, and to make it up of unequal, dissimilar parts, and to make one part give the lie to the other, the course of a man’s life, in ignorance, negligence, and sin, proclaiming contrary to the profession of Christianity: this is to make religion a monstrous thing, to deny the nature of it, and in our imaginations to contrive an impossible union of inconsistent things.

It is a creature made up of contradictions, which can have no subsistence in the truth, but only in the fancies of deluded souls; one professing Christianity, and so by consequence fellowship with the original light, the Sun of Righteousness, and yet darkness of ignorance possessing the mind, and the heart carried away in the ways of the lusts of ignorance, and walking in that darkness.

This is a monster in Christianity, one so far misshapen, that the very outward form and visage of it doth not remain. But I told you, reason confirms this; for what more suitable to the very natural frame and constitution of a reasonable being, than that the outward man should be the image and expression of the inward, and that they should answer one another, as face answers face in the water; that the tongue should be the interpreter of the mind, and the actions of a man’s life the interpreter of his tongue ?</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/hugh-binning.html">Hugh Binning</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Fellowship with God, or Twenty-Eight Sermons on the First and Second Chapters of the First Epistle of John</cite>, (1671) in The Works of Hugh Binning, ed. James Cochrane (3 vols, Edinburgh: William Whyte, 1839), 2: 258-60.</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/the-christian-life/obedience-and-profession.html">Obedience and Profession</a></span></div>

</figure><figure class="quote" id="q-d76ea58305" data-kw="">
<blockquote><p>…let us note that God will have every of us nowadays for his own part to do his endeavor to multiply the church… And when God vouchsafeth us his grace to win any man, and to bring him into his flock, then are we as spiritual fathers… Now albeit that all have not that office of preaching the Word of God, yet a private person being a member of the Church, may beget spiritual children unto God, if he have occasion and ability to win a poor soul and to enlighten him with the faith of the gospel. Let us then bestow our pains to this end, knowing that if the carnal marriage was so precious under the law in the sight of God: Surely the mean whereby we be made members of our Lord Jesus Christ, is a thing now far dearer and of greater estimation with Him. And therefore let every man employ himself that way to the uttermost of his poor. For here is no forcing of us to marry against our wills, but of the winning of wives unto our Lord Jesus Christ, that by the multiplying of the Church, we may always be the more firmly linked unto Him. Seeing then that our condition is more gentle and sweet than that which was under the law, we ought to be stirred up so much the more to the discharging of that duty, and we shall have so much the less excuse if we be careless and negligent therein.</p></blockquote>

<div class="actions"><button class="copy" data-copy="“…let us note that God will have every of us nowadays for his own part to do his endeavor to multiply the church… And when God vouchsafeth us his grace to win any man, and to bring him into his flock, then are we as spiritual fathers… Now albeit that all have not that office of preaching the Word of God, yet a private person being a member of the Church, may beget spiritual children unto God, if he have occasion and ability to win a poor soul and to enlighten him with the faith of the gospel. Let us then bestow our pains to this end, knowing that if the carnal marriage was so precious under the law in the sight of God: Surely the mean whereby we be made members of our Lord Jesus Christ, is a thing now far dearer and of greater estimation with Him. And therefore let every man employ himself that way to the uttermost of his poor. For here is no forcing of us to marry against our wills, but of the winning of wives unto our Lord Jesus Christ, that by the multiplying of the Church, we may always be the more firmly linked unto Him. Seeing then that our condition is more gentle and sweet than that which was under the law, we ought to be stirred up so much the more to the discharging of that duty, and we shall have so much the less excuse if we be careless and negligent therein.”

<main class="wrap"><figure class="quote" id="q-4ab11a288f" data-kw="">
<blockquote><p>For his heart would have served him too seduce all nations, and to hold them still in the pestilent errors of idolatry, yea and in all kind of horrible misdeeds. But God has plucked them out of the power of darkness, and removed them into the kingdom of his dear beloved Son, Col. …13, till the thousand years be fulfilled. That is to say, till Antichrist be come. And after that he must be let loose. This thing came to pass after that the dominion as well of Mahumet as of the Romish bishop was so increased in strength that they became terrible to all kings and princes of the earth, for as much as they were able, not only to grieve them when they listed, but also to cast them from their seats, and to tread them quite under foot, until they submitted their necks to false religion and rightless laws: which thing is done yet still at this day, according as Paul foretold. 2. Thess. 2. b. 11.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/augustine-marlorat.html">Augustine Marlorat</a></span><span class="wk"><span class="lbl">Work:</span> <cite>A Catholic Exposition upon the Revelation</cite>, … ([London] Binneman [1574]), on Rev. 20, p. 274</span></figcaption>

<blockquote><p>The issue of millennial debate among the Reformed is both highly complicated and rather uniquely related to the confessional issue. The new eschatologies of a future millennium ran counter to the eschatologies of the sixteenth-century Reformed which, from Bullinger’s commentary on the Apocalypse to Franciscus Junius’ annotations, as ensconced in the margins of later editions the Geneva Bible, understood the millennium as past. Although, moreover, the major Reformed confessions had tended to tread lightly concerning the last things, two of them, the Forty-two Articles of Edward VI and the Second Helvetic Confession, had strongly argued against “the fable of the millennium” and notions of a “golden age” on earth prior to the final judgment. What is rather remarkable, then, is the vast revision of Reformed eschatology that took place in the seventeenth century both in England and on the continent without yielding a major confessional confrontation – in fact, both witnessing an increased diversity in the tradition, a significant break with the views of the Reformers on the part of many orthodox Reformed writers evidenced by their acceptance of a doctrine of a future millennium. The spectrum of opinion among the continental Reformed, similar to what Gribben has identified among the English, is evidenced by the millennialism of Wilhelmus à Brakel on the one hand and the anti-millennial views of Francis Turretin on the other. Turretin, significantly, distinguished between the “crass” chiliasm of various heretics and the highly objectionable but not heretical “subtle” chiliasm of Piscator, Alsted, Mede, and Launaeus – an approach parallel to his objection to Amyraldianism.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/richard-muller.html">Richard Muller</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Other citations (work not named)</cite>, ch. 1, “Diversity in the Reformed Tradition: a Historiographical Introduction” in eds. Haykin &amp; Jones, Drawn into Controversie: Reformed Theological Diversity &amp; Debates within Seventeenth-Century British Puritanism (V&amp;R, 2011), pp. 21-22</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/the-return-of-christ-antichrist-and-the-millennium/second-coming.html">Second Coming</a></span></div>

<blockquote><p>II. Where these thousand yeers have their beginning and ending. Such as understand the thousand yeers definitely are diversly minded about their beginning, as by and by I will show. I suppose it best to take their beginning from the angel’s descension: because otherwise the determination of the thousand yeers, so often repeated, should be uncertain and vain: I say, in case they should have an indeterminated beginning elsewhere: Now the descension of the angel was in the incarnation of the Son of God, as before we showed. Notwithstanding Satan was not bound presently upon his nativity: because the Son of God did not immediatly exercise his power in his childhood. But the true beginning is understood from the cause why the dragon should be bound: which was that he should deceive the nations no more: to wit, by keeping them in paganism and turning them from the Gospel of Christ. Therefore when the Dragon began to desist from deceiving the nations, then he was bound. Now he desisted from seducing the nations any longer, not presently, at the beginning of the ministry, or resurrection of Christ, or of the preaching of the apostles (although the angel did then begin to cast the great chain upon the dragon) but especially after the dispersion of the Jews and the destruction of the Jewish temple, and worship by the Romans: for before that time, the beginnings of the gentiles’ conversion to Christ were but small: because the dragon never ceased to hinder the gentiles from the Gospel of Christ by means of the turbulent Jews, as the history of the Acts of the Apostles testifies. But afterward, Jerusalem being destroyed, the Jews were rejected and dissipated, and in their room the Gentiles were called and added to the Church, as Paul teaches, Acts 13:46; Rom. 11:11, etc. Then at length it appeared that Satan was bound, because he was not able to seduce the nations any longer or uphold paganism. But that was in the year of our Lord 73. This year therefore we make the beginning of the thousand years of Satan’s binding. From hence unto the year of our Lord 1073 are a thousand years, at which time Pope Gregory VII, a Celtiberian monk, and diabolical juggler, poisoning Alexander II, invaded the Papacy by most wicked arts: who sitting on the papal chair, the devill began again to be loosed and to rage tumultuously, filling the Christian world in a horrible manner with wars and slaughters by the means of this his cursed instrument…. … Thus I have laid down my judgement, agreeing with other most learned interpreters before me, as Bullinger, Junius, etc. not that I do tie any man unto it, but leave it to consideration: but they who begin the thousand years from Christ’s nativity, as Aretius, or from his resurrection, as Chytraeus [a Lutheran]: or from the time of universal Christianism under Constantine the Great, as Brightman, Napier, etc. although they differ a little in the terms, yet all have this common with us, that the first thousand years from Christ’s birth is to be ascribed to Satan’s imprisonment and that the dragon is now long ago loosed out of prison.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/david-pareus.html">David Pareus</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Commentary on Revelation and John</cite>, tr. Elias Arnold (d. 1622; Amsterdam: C.P., 1644), ch. 20, pp. 508 &amp; 510</span></figcaption>

<blockquote><p>Therefore, we dismiss these [previously mentioned] opinions, while holding firmly to the popular and more commonly accepted view which maintains that the Pontiff, his rank and his rule, are correctly described by this prophecy. In fact, we may compute his name in either Greek or Hebrew, the two languages by which God gave his oracles and prophecies (shrouding them in mystery), yet the sum of their letters will yield the same result. For, if the computation be made in Greek, which is quite appropriate considering the Revelation was written in Greek to Greeks, no other suitable name occurs than the name Lateinos, as Irenaeus [A.D. 130-202] conjectured. And, if the name Romanus should be counted in the Hebrew characters, it will mean either Roman seat or Roman, as John Foxe [1516-1587] determined. Moreover, the Hebrew term comprises the same meaning as that of the Greek term. For Romanus or Lateinos is the name of the aforementioned Beast and is that name which the Pope imposes on all his disciples [that is, Roman Catholic]. It is on this self-same Beast that all these and additional marks of Antichrist converge; i.e., such marks as causing the whole earth, which follows him, to wonder; his blaspheming the name of God; and the great power he holds over the heads of all people and tongues, etc. That this name contains the number 666 in both Greek and Hebrew is not a point of dispute [the following is in the Greek alphabet]: L – λ – 30 a – α – 1 t – τ – 300 e – ε – 5 i – ι – 10 n – ν – 50 o – ο – 70 s – ς – 200 = 666 Thus the Roman Pontiff and his Seat is undoubtedly indicated. For he is truly Latin who holds the remains of the Latin empire and the ancient seat. By no small coincidence, he does not allow public worship to be conducted in any other language than Latin; nor does he publish his official documents and decrees in any other language. Also, the Eastern Orthodox call the Roman Church by the name Latin Church, as seen in the general councils where this distinction was meticulously made between the western fathers or bishops, called Latins, while the rest were called Greeks. Therefore, the name Lateinos (in Greek) or Romanus (in Hebrew) is fully consistent with the fulfillment of this prophecy, in that it predicts the seat of the Beast to be Rome, where it remains to this day. The truth is out in the open.</p></blockquote>

<blockquote><p>I. On the recovery of fallen believers.

1. I begin by remarking that true believers, as well as others, are liable to fall into sin. This is implied in all the warnings which the Scriptures give on this head. “Let him that thinketh he standeth take heed lest he fall.” “Take heed, brethren, lest there be in any of you an evil heart of unbelief.” “Let us labour — lest any man fall after the same example of unbelief.” It is also evident from Scripture example, of which that of Peter is instead of a thousand.

As some professors of religion may fall totally and irrecoverably from Christ, after very high and specious attainments, so genuine Christians may fall very foully, and, for a time, may remain in a desperate like condition. The promises and provisions of the covenant of grace secure all those who are vitally united to Christ from total and final apostasy, but there is no arrangement made securing that they shall not sin, and by their sin grievously dishonour God, wound their own consciences, lay a stumbling-block before others, and subject themselves to severe chastisement.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/thomas-m-crie-sr.html">Thomas M’Crie Sr.</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Recovered Disciple in Sermons</cite></span></figcaption>

<blockquote><p>(2) There is more goodwill in his heart than is visible in his dealings. The merciful nature of God should be a support to us, though we see nothing of the effects of it in his providence. Job 10:13, ‘These things hast Thou hid in thine heart; I know that it is with Thee.’ He speaks of his favourable inclination to show pity to distressed creatures. We are not able always to reconcile his present dispensations with his gracious nature, yet faith must not quit its holdfast: We must see what is hid in God’s heart and comfort ourselves with that favor and mercy which we know to be essential to Him: Though the mercy and pity be not visible and obvious to sense, the disposition and inclination abides in God unchangeable and sure. God is a merciful God still, and Christ a compassionate Savior, though the effects be suspended to try and sharpen our faith.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/thomas-manton.html">Thomas Manton</a></span><span class="wk"><span class="lbl">Work:</span> <cite>A Fourth Volume containing One Hundred &amp; Fifty Sermons on Several Texts of Scripture</cite>, … (London: J.D., 1693) | A Sermon on Mt. 15:21-28, p. 472</span></figcaption>

<blockquote><p>[Margin:] (What mercy is in God: Miseri cordia est voluntas Dei qua ad succurrendum miseris et propensus [Mercy is the will of God by which He is inclined to succor the miserable.]; [Johannes] Sharpius. The mercy of God some call the property or attribute of his nature, inclining Him to relieve the misery of his creature; some the essence of God showing mercy. [William] Sclater on the 117th Psalm: Ira dicitur esse in Deo non ut turbidus motus animi sed simplex voluntas ad ultionem.) But mercy in God is his very essence whereby He is infinitely disposed to help succour and comfort such as be in any miserable condition. Those expressions in Scripture: ‘In their afflictions He was afflicted’; and ‘Mine heart is turned within Me, my repentings are kindled together,’ are borrowed phrases, as from the turning of the bowels in men at the sight of an object of pity. And yet in men this is not mercy itself but a companion of pity. Yet because by it our mercy is made known, we call it by the name of ‘mercy’. We call rolling of bowels mercy, and mercy rolling of bowels, which yet is but a companion of it, and that in men only and not in God. Mercy may be without it, and in God always is; because God has no bowels to be turned, God is one most simple essence, and has no qualities. And therefore when we say God is merciful, we speak of Him metaphorically, as when we say God is angry. Anger is a turbulency of spirit, but there is no such thing in God. The effects of that which is called anger in God are often put for anger: as when we see the punishment and scourges on the backs of wicked men we conclude that God is angry. In like manner when we see the [hurtful] rod taken of and cast into the fire (which is an effect of mercy) we say God is merciful. But mercy in God signifies two things: First, an inclination in his heavenly Majesty to show mercy. Secondly, the effects of his supposed affection, which is his helping of the miserable creature, or a making out of God to such as have need of help and pity. The affection of mercy in men is known by that grief that accompanies it (Tanquam a nobis notiori vertus ipsa nomen traxit), but such a companion of mercy cannot be in God. O mercy is a glorious attribute of God, He is a very sea of mercy, He is never dry. Amongst men he that is fullest of pity is but a drop of it. Their pity falls infinitely short of what is in God. And this mercy of God is either general to all his creatures or special unto mankind or more special and peculiar: that whereby He is said to be merciful to his elect unto eternal life and [gives] freedom from the wrath to come.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/thomas-larkham.html">Thomas Larkham</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Attributes of God Unfolded &amp; Applied</cite>, ... (London: Eglesfield, 1656) Larkham (1602–1669) was an English puritan clergyman and settler in New England., pp. 103-4</span></figcaption>

<blockquote><p>The architectonic principle of the Westminster Confession is supplied by the schematization of the Federal theology, which had obtained by this time in Britain, as on the Continent, a dominant position as the most commodious mode of presenting the corpus of Reformed doctrine (so e.g. Rollock, Howie, Cartwright, Preston, Perkins, Ames, Ball, and cf. Dickson’s “Sum of Saving Knowledge” and Fisher’s “Marrow of Modern Divinity,” both of which emanated from this period and were destined to a career of great influence in the Scottish theology).</p></blockquote>

</figure><figure class="quote" id="q-bfe47d0801" data-kw="">
<blockquote><p>We reject likewise the fictions of the Pelagianizers: Concerning the conditioned will, concerning the decree of velleity or desire. Concerning Middle or conditioned Knowledge, by which that desired determination is said to be foreseen. Concerning the intention of conditioned concourse concomitantly into the effect—and consequently concerning the simultaneous concourse and egress of grace and free will, which is really independence and primacy, pre-running and predetermination of the second cause. Concerning universal sufficient grace, and according to it a salvific calling, whose presupposition is the grace of universal redemption, reconciliation, and confederation. Which fictions have been sufficiently sifted by the authors just cited, partly also by the Dominican theologians and other genuine followers of Thomas, whom you will see alleged in those authors passim [throughout], and especially in Sylvius the Douai theologian, in his treatise On the Motion of the First Mover. Of our men, Ferri in his Orthodox Scholastic and its Defense against the Jesuit Perrin has rendered most useful service here. The Various Dissertations on the [End] Term of Life edited by Beverovicio can also be compared.</p></blockquote>

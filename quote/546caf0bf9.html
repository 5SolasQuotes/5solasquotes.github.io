<main class="wrap"><figure class="quote" id="q-546caf0bf9" data-kw="">
<blockquote><p>and upon what Scripture can we pitch for such extraordinary prophets, if not upon those Scriptures…?</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/george-gillespie.html">George Gillespie</a></span><span class="wk"><span class="lbl">Work:</span> <cite>ch. 5, ‘Whether these prophets and prophesyings in the primitive church, 1 Cor. 14; 12:28; eph. 4:11; were extraordinary and not so to continue; or whether they are precedents for the preaching or prophesying of such as are neither ordained ministers nor probationers for the ministry’ in A Treatise of Miscellany Questions | As Gillespie regards the phenomenon as extraordinary and ceased in most periods of the church, his view is very different than that of most Continuationists. Gillespie, while using the NT verses of ‘prophets’ as proof-texts for cessationism in other parts of his writings, wonders here whether these Scriptures may bear the additional nuance of including the non-inspired, modern, Reformation ‘prophets’ that Gillespie cites:</cite></span></figcaption>
<div class="meta"><span class="t"><a href="../topics/modern-errors.html">Modern Errors</a></span></div>

</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-4f9f5bf5fb" data-kw="">
<blockquote><p>Moreover, God permits: (1) sometimes in express terms (Col. 2:16, 20–21; Gen. 2:16–17; Lev. 11:2–4), when he removes these or those things from among things prohibited; (2) sometimes only by nowhere prohibiting (cf. Rom. 14:14; Acts 10:15); (3) sometimes also in terms of commanding (Deut. 23:20; Gen. 1:28), just as in the same terms of commanding he sometimes expressly prohibits (Num. 22:20; John 13:27).</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/peter-mastricht.html">Peter Mastricht</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Theoretical Practical Theology (RHB), vol. 3, bk. 3</cite>, ch. 11, section 4, pp. 356-57</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/modern-errors.html">Modern Errors</a></span></div>

</figure><figure class="quote" id="q-75bb75dfa8" data-kw="">
<blockquote><p>7. Yet we say, that as God by gifts may furnish some in a more than ordinary way; so may He, and uses He to thrust them out in a mixed way to the exercise of these for the edification of His Church, and make the seal of his call extraordinarily ratify his sending of them, that is, as He may furnish men partly by means, and especially by his blessing extraordinarily accompanying them, so may He send them out partly in a mediate way by men’s opening of the door, partly by his more than ordinary thrusting of them out, making up so what was defective in the mediate call by some extraordinary concurrences of impulse and gifts within, of circumstances of providence without, and of efficacy upon, and acception of it amongst others, whereby it cometh to be ratified. This the Lord fulfilled at the entry of the Reformation, raising up men comparatively extraordinarily furnished and commissionated for his work, yet still ministers of the same Gospel, and walking according to the common rule with others in their ministerial charge. This is not ordinarily to be imitated, but where the like cases, call, and circumstances concur…</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/james-durham.html">James Durham</a></span><span class="wk"><span class="lbl">Work:</span> <cite>ch. 10, ‘Concerning Prophesying’ in A Commentary upon the Book of the Revelation… (Edinburgh, 1658)</cite>, pp. 469-72</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/modern-errors.html">Modern Errors</a></span></div>

<blockquote><p>3. Prophesy taken for an immediate revealing of Gospel truths and mysteries, such as that, 1 Cor. 14, and what was frequent in the apostolick times, is now ceased; and there is neither such a gift, nor such an office.</p></blockquote>

</figure><figure class="quote" id="q-b0db1f5df1" data-kw="">
<blockquote><p>22. The Spirit is not given to ordinary Christians (though it be to prophets) to bring them from God new doctrines, or laws; nor to make any supplements to the Gospel already revealed, as if it was not sufficient in its kind; nor yet to reveal the matter of Christ’s Gospel immediately to the intellect or phantasy within by way of inspiration, visions or intuitions without an external Word or revelation; nor yet to cause them to work miracles themselves. But He is given to enable, dispose and help us to understand, believe, love and practice the doctrine and Law already, by the same Spirit given to the Church, by sanctifying our power, our reason, and our wills, by holy life and light, and love… Illuminating and sanctifying is not making us prophets or apostles, nor equal to them, as not being called to their works.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/thomas-edwards.html">Thomas Edwards</a></span><span class="wk"><span class="lbl">Work:</span> <cite>English Puritans | Manton, Bates, Case, Baxter, Fairclough, et al. | The Judgment of Non-Conformists of the Interest of Reason in Matters of Religion in which it is Proved against Make-Baits that both Conformists &amp; Non-Conformists, &amp; All Parties of true Protestants are herein really agreed, though unskilful speakers differ in words (London: 1676), p. 12 This was signed by 15 non-conformist English puritans.</cite></span></figcaption>

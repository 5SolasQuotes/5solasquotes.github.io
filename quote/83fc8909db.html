<main class="wrap"><figure class="quote" id="q-83fc8909db" data-kw="">
<blockquote><p>The world is soaked with mutual blood, and when individuals commit homicide, it is a crime; it is called a virtue when it is done in the name of the state. Impunity is acquired for crimes not by reason of innocence but by the magnitude of the cruelty.

Now if you turn your eyes and face toward the cities themselves, you will find a multitude sadder than any solitude. A gladitorial combat is being prepared that blood may delight the lust of cruel eyes. The body is filled up with stronger foods, and the robust mass of flesh grows fat with bulging muscles, so that fattened for punishment it may perish more dearly. Man is killed for the pleasure of man, and to be able to kill is a skill, is an employment, is an art. Crime is not only committed but is taught. What can be called more inhuman, what more repulsive? It is a training that one may be able to kill, and that he kills is a glory.

What is this, I ask you, of what nature is it, where those offer themselves to wild beasts, whom no one has condemned, in the prime of life, of a rather beautiful appearance, in costly garments? While still alive they adorn themselves for a voluntary death, wretched they even glory in their wicked deeds. They fight with beasts not because they are convicts but because they are mad. Fathers look upon their own sons; a brother is in the arena and his sister nearby, and, although the more elaborate preparation of the exhibition increases the price of the spectacle, oh shame! the mother also pays this price that she may be present at her own sorrows. And at such impious and terrible spectacles they do not realize that with their eyes they are parricides.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/cyprian-of-carthage.html">Cyprian of Carthage</a></span><span class="wk"><span class="lbl">Work:</span> <cite>To Donatus</cite>, (c. 246), 6, 7 in Saint Cyprian: Treatises, trans. and ed. Roy. J Deferrrari, The Fathers of the Church. A New Translation: Volume 36 (New York: Fathers of the Church, 1958), pp 12-13.</span></figcaption>

</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-b2c1af29f7" data-kw="">
<blockquote><p>Whenever I read this passage, I am forcibly reminded of a similar instance, resembling it indeed more closely than any other, that of Thomas More, who held the same office as Shebna; for it is well known that he was Lord Chancellor to the king of England. Having been a very bitter enemy of the gospel, and having persecuted good men by fire and sword, he wished that on this account his reputation should be extensive, and his wickedness and cruelty permanently recorded. He therefore ordered the praises of his virtue to be inscribed on a tomb which he had caused to be built with great cost and splendor, and sent his epitaph, which he had drawn up, to Basle, to Erasmus, along with a palfrey which he gave him as a present, to get it printed.

He was so desirous of renown, that he wished to obtain during his life the reputation and praises which he hoped to enjoy after his death. Among other applauses the most conspicuous was, that he had been a very great persecutor of the Lutherans, that is, of the godly. What happened? He was accused of treason, condemned, and beheaded; and thus he had a gibbet for his tomb. Do we ask more manifest judgments of God, by which he punishes the pride, the unbounded eagerness for renown, and the blasphemous vaunting, of wicked men? In this inveterate enemy of the people of God, not less than in Shebna, we ought undoubtedly to acknowledge and adore God’s overruling providence.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/john-calvin.html">John Calvin</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Commentary on the Book of the Prophet Isaiah: Volume Second</cite>, trans. William Pringle (Geneva, 1551) in Calvin’s Commentaries (22 vols, Grand Rapids: Baker, 1993), vii, 131-32.</span></figcaption>

<blockquote><p>Ingrossers; that hoard up commodities, and by stopping their propagation raise the price; these are thieves. Many Block-houses in the city, monopolies in the court, garners in the country, can testify, there are now such thieves abroad: we complain of a dearth; sure the heavens are too merciful to us, that are so unmerciful one to another: scarcity comes without God’s sending: who brings it then? even the Devil and his brokers, engrossing misers.

The Common-wealth may often blow her nails, unless she sit by an engrossers fire: her limbs may be faint with hunger, unless she buy graine at an engrosses price. I confess, this is a sin, which the Law takes notice of, but not in the full nature, as theft. The pick-purse (in my opinion) doth not so much hurt, as this general robber; for they rob millions.

These do not with Joseph, buy up the superfluity of plenty, to prevent a dearth; but hoard up the store of plenty, to procure a dearth. Rebels to God, trespassers to nature, thieves to the Common-wealth: if these were apprehended and punished, neither City nor Country should complain as they do. Mean time, the people’s curse is upon them, and I doubt not but God’s plague will follow it; if repentance turn it not away: till when, they are private thieves.</p></blockquote>

— Thomas Adams, The white devil, or The hypocrite uncased: In a sermon preached at Paul’s Cross, March 7. 1612, (London: Melchisedech Bradwood, 1613), p. 46.">Copy</button><a class="share" href="https://x.com/intent/post?text=%E2%80%9CIngrossers%3B+that+hoard+up+commodities%2C+and+by+stopping+their+propagation+raise+the+price%3B+these+are+thieves.+Many+Block-houses+in+the+city%2C+monopolies+in+the+court%2C+garners+in+the+country%2C+can+testify%2C+there+are+now+such+thieves+abroad%3A+we+complain+of+a+dearth%3B+sure+the+heavens+are+too+merciful+to+us%2C+that+are+so+unmerciful+one+to+another%3A+scarcity+comes+without+God%E2%80%99s+sending%3A+who+brings+it+then%3F+even+the+Devil+and+his+brokers%2C+engrossing+misers.%0A%0AThe+Common-wealth+may+often+blow+her+nails%2C+unless+she+sit+by+an+engrossers+fire%3A+her+limbs+may+be+faint+with+hunger%2C+unless+she+buy+graine+at+an+engrosses+price.+I+confess%2C+this+is+a+sin%2C+which+the+Law+takes+notice+of%2C+but+not+in+the+full+nature%2C+as+theft.+The+pick-purse+%28in+my+opinion%29+doth+not+so+much+hurt%2C+as+this+general+robber%3B+for+they+rob+millions.%0A%0AThese+do+not+with+Joseph%2C+buy+up+the+superfluity+of+plenty%2C+to+prevent+a+dearth%3B+but+hoard+up+the+store+of+plenty%2C+to+procure+a+dearth.+Rebels+to+God%2C+trespassers+to+nature%2C+thieves+to+the+Common-wealth%3A+if+these+were+apprehended+and+punished%2C+neither+City+nor+Country+should+complain+as+they+do.+Mean+time%2C+the+people%E2%80%99s+curse+is+upon+them%2C+and+I+doubt+not+but+God%E2%80%99s+plague+will+follow+it%3B+if+repentance+turn+it+not+away%3A+till+when%2C+they+are+private+thieves.%E2%80%9D%0A%0A%E2%80%94+Thomas+Adams%2C+The+white+devil%2C+or+The+hypocrite+uncased%3A+In+a+sermon+preached+at+Paul%E2%80%99s+Cross%2C+March+7.+1612%2C+%28London%3A+Melchisedech+Bradwood%2C+1613%29%2C+p.+46.&amp;url=https%3A%2F%2F5solasquotes.github.io%2Fquote%2Fcd794d0d80.html&amp;via=5Solas" target="_blank" rel="noopener">Share on X</a><a class="perma" href="../quote/cd794d0d80.htm

<blockquote><p>1. A different rationale belongs to Theology and to the other disciplines which we have just mentioned: α. Theology, having God Himself as its object, in dignity far excels the remaining disciplines, and pertains to the Image of God primarily; the remaining disciplines only secondarily. β. God has not to such an extent delineated to us an express type of the other disciplines, as He has in the case of Theology, especially as it is revealed in His Word, unto which norm our Knowledge ought to be conformed.

2. Nevertheless, if anyone should wish to recognize a certain Archetypal Knowledge in God, and Ectypal in creatures, in the other arts and sciences also; it would be allowed by us, although in a less emphatic sense.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/bernard-de-moor.html">Bernardinus de Moor</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Continuous Commentary on Johannes Marckius’ Didactico-Elenctic Compendium of Christian Theology. Volume 1: Concerning the Word and Definition of Theology</cite>, trans. Steven Dilday (1761; Central SC: From Reformation to Reformation Translations, 2017), Ch. 1, § 7, p. 87.</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/theology/faith-and-reason.html">Faith and Reason</a></span></div>

</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-b5af543c30" data-kw="">
<blockquote><p>Nor does the tyrant merely oppress his subjects in corporal things but he also hinders their spiritual good. Those who seek more to use, than to be of use to, their subjects prevent all progress, suspecting all excellence in their subjects to be prejudicial to their own evil domination. For tyrants hold the good in greater suspicion than the wicked, and to them the valour of others is always fraught with danger. So, the above-mentioned tyrants strive to prevent those of their subjects who have become virtuous from acquiring valour and high spirit in order that they may not want to cast off their iniquitous domination.

They also see to it that there be no friendly relations among these so that they may not enjoy the benefits resulting from being on good terms with one another, for as long as one has no confidence in the other, no plot will be set up against the tyrant’s domination. Wherefore they sow discords among the people, foster any that have arisen, and forbid anything which furthers society and co-operation among men, such as marriage, banquets, and anything of like character, through which familiarity and confidence are engendered among men.

They moreover strive to prevent their subjects from becoming powerful and rich, since, suspecting these to be as wicked as themselves, they fear their power and wealth; for the subjects might become harmful to them even as they are accustomed to use power and wealth to harm others. Hence Job 15:21 says of the tyrant: The sound of dread is always in his ears and when there is peace, that is, when there is no one to harm him, he always suspects treason.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/thomas-aquinas.html">Thomas Aquinas</a></span><span class="wk"><span class="lbl">Work:</span> <cite>De Regno Ad Regem Cypri</cite>, (1266-67), Book 1, C. 3.</span></figcaption>

<blockquote><p>A controversy respecting the atonement sprang up between Duns Scotus and the followers of Aquinas, which involved fundamental principles in ethics and religion, and divided the Romish Church into two great parties of Thomists and Scotists. Duns Scotus denied the Anselmic doctrine that sin is of infinite demerit, and consequently denied that the suffering of Christ is of infinite value. The relation of the atonement of the Son of God to the sin of mankind, he maintained, is merely an arbitrary and constituted one. The principle upon which he founded his theory was: “Tantum valet omne creatum oblatum, pro quanto acceptat Deus illud, et non plus.” There is no interior fitness and adaptation between Christ’s atonement and man’s sin. God was pleased to accept this particular sacrifice as an offset and equivalent for human transgression, not from any intrinsic value in it, but because he so pleased. He might have accepted any other substitute, or he might have dispensed with accepting any substitute at all. In opposition to this view, the followers of Aquinas maintained the old Anselmic theory of the infinite demerit of sin, and the infinite and objective value of Christ’s satisfaction. In this controversy, the soteriology of the adherents of Aquinas is more in harmony with the Protestant view and feeling; so that we might reverse what Melanchthon remarks of Augustine, and say, that “the opinion of Aquinas is more pertinent, fit and convenient when he disputed than it was when not disputing.” And yet it would be difficult to see how the followers of Aquinas could in the end avoid the conclusions of Duns Scotus, if they started from that doctrine of a relative necessity of satisfying justice which we have seen Aquinas held, in common with all the Schoolmen excepting Anselm. If omnipotence and bare will are more ultimate in the Divine Nature than justice and truth are, then it is difficult to see how Scotus can be censured for holding, that in the last analysis God can dispense with an atonement altogether, and that whatever value the existing judicial provision possesses in the divine plan, it possesses not in itself, but solely by virtue of its optional acceptance by the Omnipotent One who is not limited by anything, not even by his own moral attributes. The controversy, however, ran high between the adherents of Aquinas and Scotus,—the Dominican order generally siding with the former, and the Franciscan with the latter. The Nominalists in philosophy also naturally favoured the views of Scotus, as his theory was that of a nominal and putative satisfaction, in distinction from a real and objective one. The extravagantly speculative minds of the age, those who have given the reputation of hair-splitting and excessive dialectics to Scholasticism, also adopted the positions of Scotus.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/william-g-t-shedd.html">William G.T. Shedd</a></span><span class="wk"><span class="lbl">Work:</span> <cite>A History of Theology</cite>, (New York: Scribners) 2.315</span></figcaption>

</figure><figure class="quote" id="q-b09d277033" data-kw="">
<blockquote><p>The relation of events, causal and successive, in the pre-millenarian eschatology, while a favourite with many, and to some minds a very fascinating one, is not that usually held among Protestant Christians. It is not the prevalent view among Presbyterians. It is not the view taught in the Catechisms or in the Confession of Faith of our church. On the other hand it is there expressly disavowed. Standard writers on systematic theology, who necessarily take the comprehensive view of God’s gracious plan, almost to a man discard this order as one which cannot be made, in its varied elements, to square with itself or with the most definite teachings of Scripture.

It assumes that the second advent will usher in the millennium, when our Lord will reign on the throne of Israel in Jerusalem as did King David. It foresees a brilliant reign whose splendours are to be sensuous and Jewish. It avoids those passages of Scripture which connect immediately the coming of Christ and the final judgment of all the world, and which affirms that this coming is a coming to judge. It holds to a separate resurrection of the righteous and the wicked, one at either end of the millennium, a doctrine that rests on one verse in the midst of a mysterious and symbolical passage, and on a construction of that verse that is not only not necessary but is in the highest degree improbable; since, in addition to being out of analogy with the rest of Scripture, it assumes without proof that the resurrection of the souls there spoken of is a resurrection of the body, and further, that it is a resurrection of all the righteous dead; a meaning not only not in the passage but expressly precluded by the fact that it is of certain martyrs who had been beheaded for the witness of Jesus that the evangelist in writing.

The theory of two resurrections, that apex upon which the whole millenarian scheme, as an inverted pyramid, rests, is not an affirmation of Scripture but an unwarranted inference. The closing verses of the twentieth chapter of Revelation describe a general judgment of all the dead, small and great, as they stand before God and the great white throne, and a general resurrection of all the dead, to the end that they appear before that august tribunal. Now, I cannot place these events nor can I know what is meant by the last ” great day,” if I postulate the theory of two resurrections as it is usually held.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/william-addison-alexander.html">William Addison Alexander</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Latter-Day Judaism in Presbyterian Quarterly</cite></span></figcaption>
<div class="meta"><span class="t"><a href="../topics/theology/faith-and-reason.html">Faith and Reason</a></span></div>

It assumes that the second advent will usher in the millennium, when our Lord will reign on the throne of Israel in Jerusalem as did King David. It foresees a brilliant reign whose splendours are to be sensuous and Jewish. It avoids those passages of Scripture which connect immediately the coming of Christ and the final judgment of all the world, and which affirms that this coming is a coming to judge. It holds to a separate resurrection of the righteous and the wicked, one at either end of the millennium, a doctrine that rests on one verse in the midst of a mysterious and symbolical passage, and on a construction of that verse that is not only not necessary but is in the highest degree improbable; since, in addition to being out of analogy with the rest of Scripture, it assumes without proof that the resurrection of the souls there spoken of is a resurrection of the body, and further, that it is a resurrection of all the righteous dead; a meaning not only not in the passage but expressly precluded by the fact that it is of certain martyrs who had been beheaded for the witness of Jesus that the evangelist in writing.

ting.%0A%0AThe+theory+of+two+resurrections%2C+that+apex+upon+which+the+whole+millenarian+scheme%2C+as+an+inverted+pyramid%2C+rests%2C+is+not+an+affirmation+of+Scripture+but+an+unwarranted+inference.+The+closing+verses+of+the+twentieth+chapter+of+Revelation+describe+a+general+judgment+of+all+the+dead%2C+small+and+great%2C+as+they+stand+before+God+and+the+great+white+throne%2C+and+a+general+resurrection+of+all+the+dead%2C+to+the+end+that+they+appear+before+that+august+tribunal.+Now%2C+I+cannot+place+these+events+nor+can+I+know+what+is+meant+by+the+last+%E2%80%9D+great+day%2C%E2%80%9D+if+I+postulate+the+theory+of+two+resurrections+as+it+is+usually+held.%E2%80%9D%0A%0A%E2%80%94+William+Addison+Alexander%2C+Latter-Day+Judaism+in+Presbyterian+Quarterly&amp;url=https%3A%2F%2F5solasquotes.github.io%2Fquote%2Fb09d277033.html&amp;via=5Solas" target="_blank" rel="noopener">Share on X</a><a class="perma" href="../quote/b09d277033.html">Permalink</a><a class="src" href="https://reformedcovenanter.wordpress.com/2022/11/29/william-addison-alexander-on-premillennialism-and-systematic-theology/" rel="noopener" target="_blank">Read it online · Reformed Covenanter</a></div>

<blockquote><p>Wisdom is an architectonic system commanding and directing all others. Now this is most peculiar to theology, which is so far the arbiter and mistress of all sciences that it judges of them and cannot itself by judged by another. For all other systems must be referred to it as a standard, and whatever does not agree with theology must be rejected from them. So although it does not prescribe to other systems principles and objects, yet it so far rules over them (because it establishes their limits) that they neither dare hold to any object opposed to theology, nor to use their principles against it. And also with respect to the ultimate end (viz., the glory of God) which although they do not immediately attain, yet they are bound to have such a direction. […]

If theology takes some things from other systems, it is not as an inferior from superiors, but as a superior from inferiors (as a mistress freely using her handmaids). Theology does not so much take from others, as presupposes certain previously known things upon which it builds revelation.</p></blockquote>

<main class="wrap"><figure class="quote" id="q-02a08b0695" data-kw="">
<blockquote><p>[W]e confess both one Christ, one Son, and one Lord. And according to this understanding of the unconfounded unity, we acknowledge the holy virgin to be the mother of God, because that God the Word was incarnate and made man, and by the very conception gathered to himself a body taken of her.</p></blockquote>

<div class="meta"><span class="t"><a href="../topics/rome.html">Rome</a></span></div>

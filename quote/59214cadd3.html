<main class="wrap"><figure class="quote" id="q-59214cadd3" data-kw="">
<blockquote><p>1. Justification is an action, by which God makes an ungodly man righteous, according to the good pleasure of his will, and without any merit of his own for salvation… 9. Therefore, although it is said figuratively, yet fittingly and truly, we say that we are justified by faith alone, comparing it with works and merits, and not by the works of the law, but by faith freely in our Lord Jesus Christ.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/francis-junius.html">Francis Junius</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Introduction: On Justification by Faith in Theological Theses for Exercises in Public Disputations in the Famous Academy at Leiden</cite>, (1584) at ReformedOrthodoxy.org The relevance here is Junius defining the issue as one of merit and saying that Justification by faith is a figurative expression.</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/repentance-and-conversion/repentance-and-faith.html">Repentance and Faith</a></span></div>
<div class="actions"><button class="copy" data-copy="“1. Justification is an action, by which God makes an ungodly man righteous, according to the good pleasure of his will, and without any merit of his own for salvation… 9. Therefore, although it is said figuratively, yet fittingly and truly, we say that we are justified by faith alone, comparing it with works and merits, and not by the works of the law, but by faith freely in our Lord Jesus Christ.”

— Francis Junius, Introduction: On Justification by Faith in Theological Theses for Exercises in Public Disputations in the Famous Academy at Leiden (1584) at ReformedOrthodoxy.org The relevance here is Junius defining the issue as one of merit and saying that Justification by faith is a figurative expression.">Copy</button><a class="share" href="https://x.com/intent/post?text=%E2%80%9C1.+Justification+is+an+action%2C+by+which+God+makes+an+ungodly+man+righteous%2C+according+to+the+good+pleasure+of+his+will%2C+and+without+any+merit+of+his+own+for+salvation%E2%80%A6+9.+Therefore%2C+although+it+is+said+figuratively%2C+yet+fittingly+and+truly%2C+we+say+that+we+are+justified+by+faith+alone%2C+comparing+it+with+works+and+merits%2C+and+not+by+the+works+of+the+law%2C+but+by+faith+freely+in+our+Lord+Jesus+Christ.%E2%80%9D%0A%0A%E2%80%94+Francis+Junius%2C+Introduction%3A+On+Justification+by+Faith+in+Theological+Theses+for+Exercises+in+Public+Disputations+in+the+Famous+Academy+at+Leiden+%281584%29+at+ReformedOrthodoxy.org+The+relevance+here+is+Junius+defining+the+issue+as+one+of+merit+and+saying+that+Justification+by+faith+is+a+figurative+expression.&amp;url=https%3A%2F%2F5solasquotes.github.io%2Fquote%2F59214cadd3.html&amp;via=5Solas" target="_blank" rel="noopener">Share on X</a><a class="perma" href="../quote/59214cadd3.html">Permalink</a><a class="src" href="https://reformedbooksonline.com/that-a-certain-inherent-holiness-or-graces-repentance-is-requisite-by-way-of-order-accompaniment-to-faith-in-christ-justification/#:~:text=1.%20Justification%20is%20an%20action%2C%20by,freely%20in%20our%20Lord%20Jesus%20Christ&amp;text=1.%20Justification%20is%20an%20action%2C%20by%20which%20God&amp;text=by%20faith%20freely%20in%20our%20Lord%20Jesus%20Christ" rel="noopener" target="_blank">Read it online · Reformed Books Online</a></div>
</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-a4ee6cd852" data-kw="">
<blockquote><p>Faith sanctifies not as a cause, but as a part of infused grace: and such a part as goes not alone, but accompanied with all other graces of love, fear, zeal, hope, repentance, etc., inasmuch as man’s regeneration is not the infusion of one, but of the habit of all graces. Again, tis not the virtue of faith that justifies us; The grace of justification is from God; He works it: but tis our faith applies it and makes it ours. The act of justification is God’s mere work; but our faith only brings us the benefit and assurance of it.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/william-pemble.html">William Pemble</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Vindiciae fidei, or A Treatise of Justification by Faith</cite>, … (Oxford, 1625) | section 2, ch. 3, p. 49</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/repentance-and-conversion/repentance-and-faith.html">Repentance and Faith</a></span></div>

<blockquote><p>4. For to your first demand, ‘Is this free grace?’ I shall crave leave to return you a counter-demand: Suppose a king be content at the suit either of the parties themselves or some friend of theirs, to grant his gracious pardon to a company of notorious rebels that had risen against him, set up some base desperate rogue in his room, done him all the despight and mischeif they were able to do; and being apprehended, arraigned and condemned to such death as by their wicked demerits they had most justly deserved, upon condition that they aknowledge their offence and their sorrow for it, with purpose and promise of living loyally for time to come; whether you would deem this to be free grace, or no? …refer it to any indifferent reader whatsoever to determine, whether he were not a most ungracious wretch, that having his pardon on such terms granted and signed him, should in regard of those conditions, deny it to be of free grace: and whether they do not blaspheme God’s free-grace that deny it to be free grace, if it be propounded on terms of belief, repentance and amendement of life. Sir, whatsoever you say of us, take heed how you tell Christ that He does not freely save you if He will not save you unless you believe.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/thomas-gataker.html">Thomas Gataker</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Shadows without Substance, or Pretended New Lights: together with the impieties and blasphemies that lurk under them, further discovered and drawn forth into the light: in way of rejoinder unto Mr. John Saltmarsh’s Reply entitled Shadows Flying Away</cite>, Shadows without Substance, or Pretended New Lights: together with the impieties and blasphemies that lurk under them, further discovered and drawn forth into the light: in way of rejoinder unto Mr. John Saltmarsh’s Reply entitled Shadows Flying Away… (London: Bostock, 1646), p. 48</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/repentance-and-conversion/repentance-and-faith.html">Repentance and Faith</a></span></div>

</figure><figure class="quote" id="q-66582792bd" data-kw="">
<blockquote><p>The second head is the will of God, who will have us justified with the alone condition of faith. The Adversary [Bellarmine] answers that it contradicts the Scripture, which lays down also the condition of repentance. Answer: 1. Repentance is the condition of faith and of the person justified, but not properly of justification. 2. It is one thing to treat of the condition of justification, but another thing of the cause and instrument thereof: for a condition notes a consequent, or effect: but a cause, the antecedent or efficient.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/lucas-trelcatius.html">Lucas Trelcatius</a></span><span class="wk"><span class="lbl">Work:</span> <cite>A Brief Institution of the Common Places of Sacred Divinity 2nd</cite>, ed. (London, 1610), bk. 2, Justification, Confuting Part, 3rd Argument, p. 251</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/repentance-and-conversion/repentance-and-faith.html">Repentance and Faith</a></span></div>

</figure><figure class="quote" id="q-ccc85ca8f2" data-kw="">
<blockquote><p>Now consider we in the next place what manner of preaching our Savior Christ’s was, that collating the Gospel by this man [the Antinomian Saltmarsh] described, with the Gospel that Christ preached, we may see how well they sort and suit the one with the other. ‘I came,’ says our Savior, ‘to call sinners to repentance’ (Mt 3:13): and, ‘Unlesse ye repent, ye shall all perish,’ (Lk. 13:3, 5) and, ‘Verily, I say unto you, Unless ye be converted and become like children, ye shall not enter into the Kingdom of Heaven,’ (Mt. 18:3) and, ‘If a man will come after Me, let him deny himself, and take up his cross and follow Me.’ (Mt. 16:23) And, ‘If any man come to Me, and hate not his father and mother, and wife and children, and brethren and sisters, yea, and his own life also, he cannot be my disciple.’ (Lk. 14:26) And, ‘Whosoever he be of you that forsakes not all that he hath, he cannot be my disciple.’ (Lk. 14:33) Here is no such short work as Mr. Saltmarsh makes of it. Here are conditions, you see, required; and those not of faith alone, but of repentance and humiliation, and self-denial, and conversion, and renouncing of all, in disposition and purpose at least.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/thomas-gataker.html">Thomas Gataker</a></span><span class="wk"><span class="lbl">Work:</span> <cite>A Mistake or Misconstruction Removed</cite>, (Whereby little difference is pretended to have been acknowledged between the Antinomians &amp; us)… (London: Clifton, 1646), pp. 9-10 Note, according to Westminster, “purposing and endeavoring to walk with him in all the ways of his commandments” is part of the definition of repentance; WCF 15.2.</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/repentance-and-conversion/repentance-and-faith.html">Repentance and Faith</a></span></div>
<div class="actions"><button class="copy" data-copy="“Now consider we in the next place what manner of preaching our Savior Christ’s was, that collating the Gospel by this man [the Antinomian Saltmarsh] described, with the Gospel that Christ preached, we may see how well they sort and suit the one with the other. ‘I came,’ says our Savior, ‘to call sinners to repentance’ (Mt 3:13): and, ‘Unlesse ye repent, ye shall all perish,’ (Lk. 13:3, 5) and, ‘Verily, I say unto you, Unless ye be converted and become like children, ye shall not enter into the Kingdom of Heaven,’ (Mt. 18:3) and, ‘If a man will come after Me, let him deny himself, and take up his cross and follow Me.’ (Mt. 16:23) And, ‘If any man come to Me, and hate not his father and mother, and wife and children, and brethren and sisters, yea, and his own life also, he cannot be my disciple.’ (Lk. 14:26) And, ‘Whosoever he be of you that forsakes not all that he hath, he cannot be my disciple.’ (Lk. 14:33) Here is no such short work as Mr. Saltmarsh makes of it. Here are conditions, you see, required; and those not of faith alone, but of repentance and humiliation, and self-denial, and conversion, and renouncing of all, in disposition and purpose at least.”

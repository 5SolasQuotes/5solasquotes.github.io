<blockquote><p>Where is now our gay and gorgeous apparel?… our pompous shows? our various delights and pastimes? our riotous banquets? our effeminate songs? our melodious music? our lascivious dancing? our amorous embracings? All these things are vanished like shadows; but our sorrows come upon us thick…</p></blockquote>

</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-6a58cb5668" data-kw="">
<blockquote><p>…judge now whether all the ill effects have come from one extreme [side of the parties, and not the other]. The truth is, having impartially observed the mischiefs of the age in which I have lived, I have found that both the extremes have been the chief causes and the peacemakers both the most understanding and the most innocent; and the nearer any of the several parties have come to them, the more innocent they have been. It is not mere episcopacy or liturgies that have done the mischief, for such excellent men as Cranmer, Ridley, Hooper, Farrar, Parker, Jewel, Grindal, Davenant, Ussher, etc. could use both profitably. It’s not mere presbytery, for such as Calvin, Beza, Daneau, Sadeel, Rivet, Chamier, Daille, Blondel have been excellent lights in the Church. It is not mere Independency, for Ramus, Ames, Henry Jacob, Jeremiah Burroughs and many others of that mind have been excellent, peaceable men. It is not mere Anabaptistry [baptists], for there have been many peaceable worthy men against infant baptism (and some bishops thought it not of divine institution); and when they were rebaptized, continued in love and communion with others. But it is proud ignorance and lack of Christian love causing excommunicating, persecuting, Separation or schism in some, and withdrawing censorious Separation in others, who (neither party) understand the truth nor ever loved their neighbors as themselves, nor learned to do as they would be done by. The worldly PR. IGs.¹ and the unruly PR. IGs. by persecution and by causeless Separation and alienation have done the hurt. ¹ [This may likely mean “Proud Ignorants”, as a contemporary critic of Baxter, who was unsure, so inferred… This is confirmed by Baxter’s anti-party spirit and morally adjudged perspective in the immediate context. Another option is “Presbyterians and Independents” as “G” may stand for “Gatherers”, as Independents were sometimes called; yet much of the persecution was done by bishops, prelates and Formalists, as Baxter notes, so this alternative seems less likely. Baxter though may have meant both, or left his meaning ambiguous so as not to be able to be blamed for it by the named parties (note that he was reckoned an Independent by some, though he called himself a presbyterian at times). It is not to be missed that the abbreviations spell “prigs”, which word was current in that era with its current meaning.]</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/richard-baxter.html">Richard Baxter</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Richard Baxter on Worship &amp; Catholicity against Separatism &amp; John Owen</cite>, (1684; RBO, 2024), pp. 59-60</span></figcaption>

</figure><figure class="quote" id="q-5f4303d9a9" data-kw="">
<blockquote><p>In the Law or priesthood of Aaron there were:

1. Sacraments, whereby it pleased God to confirm and seal the promises of Christ to come, all which I know are abolished and that we must believe that Christ is already given, not to be given: And seeing other seals of God’s promises are under the Gospel given by our Lord Himself, namely, bread and wine, we ought not to recall the antiquated signs.

2. Howbeit, there were some actions in the law of that nature that properly they may not be said to be sacraments: For they made to decency, to order and some benefit, which I do judge may be recalled and retained as agreeable to the light of nature, and furthering some profit to ourselves… no man is ignorant that tithes are enjoined in innumerable places for the maintenance of ministers: besides, if I might more diligently search and consider, as the time now will not permit me, I could find out not a few things which our Church has borrowed out of the law of Moses, and that from the first beginning of the Church…</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/peter-martyr-vermigli.html">Peter Martyr Vermigli</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Epistle to Hooper, fol. 1087 in John Sprint, assander Anglicanus, showing the Necessity of Conformity to the Prescribed Ceremonies of our Church in Case of Deprivation</cite>, (London: Bill, 1623), ‘Reformed Practices’, pp. 180-81</span></figcaption>

<blockquote><p>Yea further, times and places which are applied to the worship of God as circumstances only for outward order and policy may be by a private Christian applied to a civil use, for in so doing he breaks not the ordinance of the Church: For example, material churches are appointed to be the receptacles of Christian assemblies, and that only for such common commodity and decency, which has place as well in civil as in holy meetings, and not for any holiness conceived to be in them more than in other houses. Now if I be standing in a churchyard when it rains, may not I go into the church that I may be defended from the injury of the weather? If I must meet with certain men for putting order to some of my worldly affairs, and it fall out that we cannot conveniently meet in any part but in the church, may we not there keep our tryst? A material church then may serve for a civil use, the same way that it serves to a holy use.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/george-gillespie.html">George Gillespie</a></span><span class="wk"><span class="lbl">Work:</span> <cite>English Popish Ceremonies</cite>, (1637), pt. 3, ch. 1, ‘That the Ceremonies are Unlawful, because superstitious…’, pp. 11-12</span></figcaption>

<blockquote><p>Concerning the kiss of charity used in those times, 2 Cor. 13:22, we say in like manner, that it was but a moral sign of that reconciliation, friendship and amity which show itself as well at holy assemblies as other meetings, in that kind and courtesy, but with all chaste salutation, which was then in use.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/george-gillespie.html">George Gillespie</a></span><span class="wk"><span class="lbl">Work:</span> <cite>A Dispute Against the English-Popish Ceremonies</cite>, … (1637), pt. 3, ch. 5, p. 90</span></figcaption>

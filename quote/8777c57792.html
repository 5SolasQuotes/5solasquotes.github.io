<blockquote><p>God who is the Creator of all things is also the sovereign and perpetual Lord; he can never set aside his right. And when he distributes to men he always reserves for himself the power and authority to take them away and transfer them to whomever he please. This is the reason that Job, after having gone through so many losses, said, “The Lord has given, and the Lord has taken way; blessed be the name of the Lord.” He recognized that everything is at God’s disposition, and that whatever way he may use it, he never does us any wrong.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/jean-claude.html">Jean Claude</a></span><span class="wk"><span class="lbl">Work:</span> <cite>A Sermon on Ecclesiastes 7:14: Delivered during a Fast Day at The Hague, the Netherlands, on November 21, 1681 , trans. Charles K. Telfer in Mid-American Journal of Theology</cite></span></figcaption>
<div class="meta"><span class="t"><a href="../topics/worship.html">Worship</a></span></div>

<blockquote><p>[Margin Note:] The uncovering of the head not like kneeling We uncover our heads, say they, when we receive the elements, why may we not also kneel? I answer: First, the uncovering of the head is a gesture of reverence only, and that only among some nations, but not of adoration. The Jews, Turks and Mahometans pray with their heads covered. The Grecians and Romans of old, howbeit they walked in public with uncovered heads, except in rain, great heat or mourning, yet in the service of their gods, they had their heads covered. The Europeans this day uncover their heads when they are praying. Kneeling is a gesture of adoration among all nations, either in civil or religious use. Augustine says: ‘Honorat emnis qui adorat, no autem adorat omnes quid onorat;’ ‘Every one that does adore, does honor, but not every one that honors, adores.’ Contra Serm. Arian., ch. 23 I will not kneel to every one to whom I uncover my head civilly. Everyone that stands with his head uncovered in presence of the king is not adoring, as he is who is presenting his petition to the king upon his knee in their sight. A provincial synod holden at London (anno 1603) ordained the head to be uncovered when their service is read in the Church, yet I think they would not have enjoined kneeling. We [the Scots] hear the canonical scripture read [in the administration of the Lord’s Supper] with uncovered heads, but yet we kneel not. The words of Christ, which He uttered at the institution are still and often uttered; that same voice sounds through all the tables of the world; his actions, which were divine and holy, are reiterat[ed]. In Gratian’s decree (De consecrat. dist. 1, ch. 68) we have a superstitious direction of Pope Anastasius, that when the Gospel is read in the Church, those that are present shall not sit, but stand, venerabiliter curvi, bowing reverently, hearken and adore. Wherefore more at the hearing of the Gospel than the [reading of the] Epistle[s], which is also Evangelical? Yet you see, howbeit that standing with bowing be more than to have the head uncovered, it was but veneration. And, whereas he says, Et fideliter adorent, the gloss has, id est venerentur, because the word ‘adoring’ is taken there in a large sense, as ye may see [in] sundry places above cited, not for that which is in a strict sense called adoration. Adoration in strict sense is kneeling or prostration. Whereas Matthew says, ch. 8, of the leprous man, that he worshipped Christ, or adored Christ, as the Latin translation has according to the original, Mk. 1:40, He kneeled down to Him, and Luke 5:12, that he fell in his face. Suchlike, where it is said of the Cananitish woman, Mt. 15:25, that she worshipped, or adored Him: et adoravit eum, Mk. 7:25, it is said that she fell at his feet. The Greek word [Greek], signifies to fall down like a dog o••whelp at the feet of another, as our Lord. Further, our heads are not other way uncovered in the act of receiving than in the rest of the time of the celebration when we are not near the elements. And thirdly, the uncovering of our head is compatible with the variety of actions in time of celebration: praying, singing, the words of the institution, and chapters read, but adoration directed, as they pretend to God, cannot be without presenting our petitions and thanks to God, which requires a several part of the action by itself.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/david-calderwood.html">David Calderwood</a></span><span class="wk"><span class="lbl">Work:</span> <cite>A Re-examination of the Five Articles enacted at Perth, anno 1618</cite>, … (1636), Of the Communicants’ gesture in the act of receiving, eating and drinking’, 4th Part, ch. 5, ‘Kneeling in the act of receiving the sacramental elements of the supper is idolatry’, pp. 104-6</span></figcaption>

<blockquote><p>Section 7. Third part of liberty, viz., the free rise of things indifferent. The knowledge of this part necessary to remove despair and superstition. Superstition described… The third part of this liberty is that we are not bound before God to any observance of external things which are in themselves indifferent, (“adiafora”) but that we are now at full liberty either to use or omit them. The knowledge of this liberty is very necessary to us; where it is wanting our consciences will have no rest, there will be no end of superstition. In the present day many think us absurd in raising a question as to the free eating of flesh, the free use of dress and holidays, and similar frivolous trifles, as they think them; but they are of more importance than is commonly supposed. For when once the conscience is entangled in the net, it enters a long and inextricable labyrinth, from which it is afterwards most difficult to escape. When a man begins to doubt whether it is lawful for him to use linen for sheets, shirts, napkins, and handkerchiefs, he will not long be secure as to hemp, and will at last have doubts as to tow; for he will revolve in his mind whether he cannot sup without napkins, or dispense with handkerchiefs. Should he deem a daintier food unlawful, he will afterwards feel uneasy for using loafbread and common eatables, because he will think that his body might possibly be supported on a still meaner food. If he hesitates as to a more genial wine, he will scarcely drink the worst with a good conscience; at last he will not dare to touch water if more than usually sweet and pure. In fine, he will come to this, that he will deem it criminal to trample on a straw lying in his way. For it is no trivial dispute that is here commenced, the point in debate being, whether the use of this thing or that is in accordance with the divine will, which ought to take precedence of all our acts and counsels. Here some must by despair be hurried into an abyss, while others, despising God and casting off his fear, will not be able to make a way for themselves without ruin. When men are involved in such doubts whatever be the direction in which they turn, every thing they see must offend their conscience.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/john-calvin.html">John Calvin</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Institutes of the Christian Religion</cite>, 4.10.7</span></figcaption>

<blockquote><p>It may seem to cursory readers of the New Testament, that our Lord abrogated the sabbath, and in his own conduct disregarded it. But this is far from being a correct view of the fact. The Pharisees insisted on such a rigid observation of the day of rest, as to prohibit works of real necessity and mercy. This superstitious and over-scrupulous opinion, our Saviour denounced, and showed, that healing the sick, and satisfying the cravings of hunger, were things lawful to be done on the sabbath.

And what renders it certain that this is a correct view of the matter is, that our Lord justifies his conduct by the practice of the saints in ancient times, when the sabbath was in full force by the acknowledgment of all, and by the provisions of the Levitical law itself, which required the priests to perform double labour on the sabbath. And he, moreover, showed, that the accusation against him, for a violation of the sabbath, was hypocritical; because, the very persons who made it, would pull an ox or sheep out of a pit into which it had fallen, on the sabbath day; and also, because they thought it no violation of the sacredness of the sabbath, to lead an ox or ass to watering, though they objected to the disciples satisfying their hunger on that day.

Our Lord was as much opposed to the perversion of the commandment as to disobedience. He had no respect for the superstitious and unduly rigorous opinions and practices of the self-righteous Pharisees. He taught—and exemplified it in his own conduct—that “the sabbath was made for man, and not man for the sabbath.” One of his expressions has evidently been misunderstood, by some interpreters. It is where he says, that “the Son of man is Lord also of the sabbath.” They have interpreted this to mean, that Christ claimed the right to do those things on the sabbath, which would be unlawful to others on that day. But this cannot be the meaning; for Christ was made under the law, and had bound himself to obey it. He came not to destroy the law, but to fulfil it. A breach of the fourth commandment would have been sin in him, as much as in any other. I take the meaning to be, that as he appointed the sabbath, so he best knew how to interpret his own law.

There is a text in Paul’s epistle to the Romans, which has been supposed to teach that it is a matter of indifference whether we observe the sabbath or not. — “One man esteemeth one day above another: another esteemeth every day alike. Let every man be fully persuaded in his own mind.” But evidently, the question here discussed relates to the ceremonial law. It relates not to the sabbath; which, as we have seen, was no part of the ceremonial law, but belonged to the moral code. The ceremonial law was virtually abrogated by the death of Christ; but all Christians were not yet enlightened to understand their Christian liberty; and such were indulged in their continued observance of these rites. The apostle is treating here of meats and drinks and festival days, the binding obligation of which had ceased.

But in the epistle to the Colossians, Paul says, “Let no man, therefore, judge you, in meat or drink, or in respect of a holy day, or of the new moon, or the sabbath days.” Here, again, the ceremonial law is obviously the subject of discourse. He is speaking of “meats,” “drinks,” “new moons,” and “sabbath days.” And the word sabbath relates to the numerous sabbaths of the ceremonial law, distinct from the weekly sabbath. Whenever a festival of the law continued eight days, the first and last were always kept as sabbaths. Or the reference might be to the sabbatical year, for the word days is not in the original.

But on supposition that the weekly sabbath was intended, the meaning might be that the Jewish sabbath, namely, the seventh day of the week, was no longer obligatory on Christians, since they had, by divine direction, adopted the first day for their day of sacred rest and of holding public assemblies for the worship of God. This leads to the inquiry, what evidence have we that such a change was ever made by divine authority?

The uniform practice of Christians, to meet on the first day of the week, from the very time of Christ’s resurrection, is strong evidence that this change was introduced by Christ and the apostles. It was suitable, that as the worship of God by his people, would have principally respect to the work of redemption, it should be celebrated on that day on which it was made manifest that this glorious work was completed. Accordingly, Christ having risen from the dead, always met his disciples on this day. And afterwards, the apostles and the churches were accustomed to come together on this day, “to break bread,” that is to celebrate the Lord’s supper. And when the apostle wrote his first epistle to the Corinthians, it was already established as a custom, not only in the church of Corinth, but in the churches of Macedonia and Galatia, that their contributions for the poor, should be collected on this day. From the apostolical practice, we rightly infer the divine authority for this change.

So generally was the first day of the week observed, in commemoration of Christ’s resurrection, and for the celebration of religious worship, that in the times of the apostles, it had obtained the significant denomination of the Lord’s Day. That this appellation really was applied to the first day of the week by the apostle John, in the Apocalypse, is evident, because it can, with no appearance of reason, be applied to any other day; and also, because this became a common appellation of that day among Christians in all subsequent ages to this time, as appears by the testimony of Justin Martyr, and others.</p></blockquote>

<blockquote><p>Honest recreation: a thing that fitteth us for the service of God, and of every good duty; as Shooting, Music, putting forth of Riddles, and the like: for these the Word of God doth by name speak of. So David, 2. Sam. 1. 18. to teach the children of Judah to handle the Bow, uttered that Lamentation which is there extant of Saul and Jonathan. And himself, by the sweetness of his Music, refreshed the troubled heart of Saul, 1. Sam. 16. 24. Of the other we have an Example in the Riddle put forth by SAMSON, Judges 14. 14. Out of the eater came meat, and out of the strong came sweetness. The contrary whereof is, first, the dulling of our selves by a continual wearying of the mind and body, without intermission.</p></blockquote>

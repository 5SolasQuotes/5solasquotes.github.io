</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-f0c8aa1355" data-kw="">
<blockquote><p>Whereby He signifies that He has long ago looked that they should repent from the bottom of their heart and receive his grace into their heart. Moreover this place does plainly teach us that we cannot rightly receive Christ before He first offer Himself to be received of us. ‘I will enter in unto him and will sup with him, etc.’ The gentleness and mercy of the Lord is marvelous, which so willingly pardons so great injuries done unto Him by his servant, that forgetting all injuries, He does of his own accord offer pardon, and in sign of perfect reconciliation, He will gently come and sup with him. For men are wont by such tokens to renew friendship that is broken between them. But those whom Christ vouchsafes to be partakers of his table (as He vouchsafes all the faithful) He feeds their minds with spiritual dainties, whereby they shall be nourished unto eternal life, namely with righteousness freely given, quietness of conscience, and unspeakable joy, where with the godly are fed by the Holy Ghost, whereof also He has given a most excellent pledge, the holy comunion of his body and blood, which when we receive by faith, we have Him everlastingly dwelling with us.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/william-fulke.html">William Fulke</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Prælections upon the Sacred &amp; Holy Revelation of St. John</cite>, (1573), ch. 3, on verse 20, p. 25</span></figcaption>

<blockquote><p>3. Behold I stand at the door of thy heart as one ready to help thy weakness. (2 Thess. 2; Ps. 106) And I knock at the portal of thy conscience as one that would gladly comfort thee, I send forth my heavenly Word to succour thee, lighten thee, raise thee up and save thee. 4. If any man with a glad heart will hear my voice, or the true preaching of my Word (Jn. 10; Mk. 16; Gal. [?]; Lk. [?]) and open the door of his faith, thankfully to receive it, I will come in unto him, enduing with all spiritual delights, as righteousness, peace, love and joy in the Holy Ghost. 5. Yea to him shall I make manifest as to my friend the hidden mysteries of the Scripture (Jn. 15; Lk. 14; Mt. 8; [?] Cor. 2) and secret counsels of my Father. And he shall finally sup with Me and I with him in the eternal habitacle of God, where no heart can esteem what He has prepared for them that love Him.</p></blockquote>

<blockquote><p>‘I stand.’ Christ expresses his mind by borrowed speeches: for in this verse [Rev. 3:20] He compares every man to a house or householder, and our hearts to doors by which an entrance is made: and Himself to a guest or stranger which comes to the house, and desires to be let in and entertained: yet not so much to look for kindness to be shown [to] Him, as to show favor to us. By this similitude Christ purposes to show this Church, what his mind is toward it: and He expresses it by two signs here set down: first, a desire of their conversion, which He heartily seeks and looks for, ‘I stand and knock.’ Secondly, his promise after their conversion, ‘If any, etc.’ He will have fellowship, even mutual fellowship with them. Now of the words in order as they lie. The scope and substance of them being thus first thus generally propounded, I here note two things. First, that this Church (if we regard the greater part of it) had no true fellowship with Christ as yet, nor Christ with them: because He was not yet received into their houses, but stood at their doors which were shut. This may seem strange: but the cause is evident; the truth is, there were many good things in them: for they knew the Gospel and liked it, and professed it, and were partakers of the seals of the covenant: and yet they were tainted with one great sin of lukewarmness, which closed up the door of their hearts, so that though they had many good things, yet this one sin kept out Christ. By which we see, that one sin, in a man endued with many good graces, keeps out Christ, and bars Him from all fellowship and society with Him… … Seeing then Christ standing at the door of men’s hearts knocks so earnestly to save men’s souls, we again ought to be earnest to receive and embrace the Gospel. He knocks in good earnest, and we must accordingly by God’s grace be as earnest. So much for the first token of Christs love, his desire of their conversion, which He shows by two signs; first his waiting, secondly his knocking, and that joined with crying.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/william-perkins.html">William Perkins</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Lectures Upon the Three First Chapters of the Revelation</cite>, … (1595; London: Field, 1604), pp. 331–34</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/effectual-calling/means-of-calling.html">Means of Calling</a></span></div>

<blockquote><p>The mighty God who fills all space and reigns in majesty over all worlds, standing at the door of the sinner’s heart, humbling Himself to the language of entreaty, beseeching the sinner to come and be reconciled to Him, begging for admittance, and protesting that if you only come unto Him through Christ, He is willing to forgive all, and to forget all. Oh! my brethren, ought not this to encourage you? Yes! and if you refuse the encouragement, it ought also to fill you with terror.</p></blockquote>

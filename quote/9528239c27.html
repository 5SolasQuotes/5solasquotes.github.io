<blockquote><p>You will reply: It is because they are ministers ordained by antichristian bishops; and therefore, before they have renounced their false ministry we cannot with a safe conscience hear them, nor expect a blessing from their ministry. This reply is, we confess, a great stumbling block to many godly people in this kingdom. For satisfaction to it we offer these particulars: 1. Many of you [congregationalists] that make this reply hold that the election of the people is by God’s Word sufficient to make a man a true minister without ordination. Now it is certain that many public [Anglican] ministers have been chosen by the free and full consent of their congregations; and most of them have had an after consent, which was sufficient to make Leah Jacob’s wife (Subsequens consensus Jacobi in Leam, fecit eos conjuges. [David] Pareus, etc.), and why not (to use your own words) to marry a man to a people; and therefore according to your own judgments all such are lawful ministers. For sinful superadditions do not nullify divine institutions. 2. Some of you that, besides election, require ordination for the making of a minister, yet say that this ordination must be by the people of the congregation; and thus are your ministers ordained. Now we find neither precept nor precedent for this in all the Scripture: We find ordination by the laying on of the hands of the presbytery (1 Tim. 4:14), but never of the laying on of the hands of the people. We find the apostles, Timothy and Titus ordaining (Acts 14:23; 1 Tim. 5:22; Tit. 1:5), but never the people ordaining; and for private persons to assume the power of ordination (that is, a power to send men to preach the Gospel and administer the sacraments) is a sin like unto the sin of Uzzah and of Korah and his company. Therefore we say to you as Christ does, Mt. 6, ‘First pluck the beam out of thine own eye, and then, etc.’ First justify the ordination of your own ministers by private persons and then you will see better to find fault with the ordination of our ministers. 3. We distinguish between a defective ministry and a false ministry, as we do between a man that is lame or blind and a man that is but the picture of a man. We do not deny but that the way of ministers entering into the ministry by the bishops had many defects in it, for which they ought to be humbled. But we add that, notwithstanding all the accidental corruptions, yet it is not substantially and essentially corrupted, as it is with baptism [not being substantially and essentially corrupted] in the Popish Church. All orthodox divines account it valid, though mingled with much dross, because the party baptized is baptized in the name of the Father, Son, and Holy Ghost. And therefore, when a Papist turns protestant, he is not baptized again, because the substance of baptism is preserved in Popery under many defects. The like and much more may be said for the ordination of our ministers by bishops: It is lawful and valid for the substance of it, though mingled with many circumstantial defects. And this appears: 1. Because when they were ordained, they were designed to no other office but to preach the Word and administer the sacraments according to the will of Christ. 2. Because since their ordination God has sealed the truth of their ministry (as has been said) by his blessing upon it. If they be antichristian ministers, how is your conversion Christian? 3. Because they were ordained by bishops, not as lord bishops or as a superior order by divine right above a presbyter, but as they were presbyters. For the understanding of which you must know: 1. That by Scripture a bishop and presbyter is all one, as appears by Acts 10:27-28; Tit. 1:5-8; Phil. 1:1; 1 Tim. 3:1-2, etc. 1 Pet. 5:1-2, and by what is said by the authors quoted in the margin. (Smectymnuus, The Answer of Mr. Marshal, Mr. Vines, Mr. Caryl, Mr. Seaman returned to the late King in the Treaty at the Isle of Wight) 2. That the lordly dignities of bishops were mere civil additaments annexed to their bishoprics by kingly favor. 3. That this opinion, that bishops are a superior order of ministry by divine right above a presbyter is a late upstart opinion contrary to antiquity, as appears by the authors quoted in the margin. (Ambrose in ch. 4 to the Ephesians and in 1 Tim. 3; Jerome in Tit. 1 and to Evagrius; Augustine, Epistle 19; Chrysostom in 1 Tim. 3) 4. That the laws of this realm do account nothing divine in a bishop but his being a presbyter; and therefore the parliament in their ordinance for ordination tells us that they did ordain [them] as presbyters, not as bishops, much less as lord bishops. As for their usurpation of the sole power of jurisdiction together with their lordly titles and dignities and dependances, we have renounced them in our Solemn League and Covenant [1643]. But we never did, nor never shall renounce them as presbyters, which by the consent of all sides are by divine right. 4. We shall add one thing more, that ministers do not receive their ministry from the people, or bishops, but immediately from Jesus Christ. For they are ministers and ambassadors of Christ, not of the people. Indeed they are ambassadors for the good of the people, but not ambassadors of the people. All that the people or bishop does is but to choose and ordain a man, but it is Christ that gives him his power and authority, as when a wife chooses a husband and a town a mayor: the town does not give the mayor, nor the wife the husband the power they have, but the laws of God the one, and of man the other. So it is here, it is Christ that gives the office and the call to the ministry; they are his servants and in his name execute their function. It is He that fits them with ability for their work; the people they consent, and the bishop as a presbyter with other presbyters ordain him; which though it had many corruptions mingled with it, when the bishop was in all his pomp and lordliness, yet for the substance of it, it was lawful and warrantable and therefore cannot without sin be renounced and abjured.</p></blockquote>

<blockquote><p>Many at this day can scarce digest it, that He sent forth a Judas to preach the Gospel, when He knew that he was a thief and a hypocrite, and foreknew that he was a son of perdition and would betray Him, and that the Devil would enter into him; yea, knew that he was a devil, Jn. 6:70 &amp; 13:2, yet that this Judas should be one of the twelve select apostles and one of the family of Christ. Yet Christ repulsed him not; and if he did not partake of the sacrament at his last Supper, it was not because Christ did turn him out, but because he went away himself.</p></blockquote>

</figure><figure class="quote" id="q-a1a4b463fa" data-kw="">
<blockquote><p>And as for the other sort of elders, together with deacons, we judge the ancient order of this Church [of Scotland], to have been most convenient for providing of well-qualified men for those functions and offices. For the eighth head of the First Book of Discipline, touching the election of elders and deacons, ordains that men of best knowledge and cleanest life, be nominat[ed] to be in election, and that their names be publicly read to the whole church by the minister, giving them advertisement, that from among them must be chosen elders and deacons: that if any of these nominat[ed] be noted with public infamy, he ought to be repelled: and that if any man know others of better qualities within the Church than these that be nominat[ed], they should be put in election, that the Church may have the choice.</p></blockquote>

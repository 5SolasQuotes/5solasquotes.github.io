<main class="wrap"><figure class="quote" id="q-6c528061e3" data-kw="">
<blockquote><p>4. Yet if we take prophesy for the understanding of God’s mind, and for attaining to be well acquainted with the mysteries of God, by a mediate way; yea, and that beyond the applied means, or to have a gift and capacity for discerning of these things with little pains, and that beyond what some others can attain unto by any labor, we conceive that in this sense prophesy and prophets may be said to be continued in the Church; and such God raised up in the time of Reformation, men singularily gifted with a prophetical spirit in this sense…</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/james-durham.html">James Durham</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Other citations (work not named)</cite>, ch. 10, ‘Concerning Prophesying’ in A Commentary upon the Book of the Revelation… (Edinburgh, 1658), pp. 469-72</span></figcaption>

</figure><figure class="quote" id="q-75bb75dfa8" data-kw="">
<blockquote><p>7. Yet we say, that as God by gifts may furnish some in a more than ordinary way; so may He, and uses He to thrust them out in a mixed way to the exercise of these for the edification of His Church, and make the seal of his call extraordinarily ratify his sending of them, that is, as He may furnish men partly by means, and especially by his blessing extraordinarily accompanying them, so may He send them out partly in a mediate way by men’s opening of the door, partly by his more than ordinary thrusting of them out, making up so what was defective in the mediate call by some extraordinary concurrences of impulse and gifts within, of circumstances of providence without, and of efficacy upon, and acception of it amongst others, whereby it cometh to be ratified. This the Lord fulfilled at the entry of the Reformation, raising up men comparatively extraordinarily furnished and commissionated for his work, yet still ministers of the same Gospel, and walking according to the common rule with others in their ministerial charge. This is not ordinarily to be imitated, but where the like cases, call, and circumstances concur…</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/james-durham.html">James Durham</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Other citations (work not named)</cite>, ch. 10, ‘Concerning Prophesying’ in A Commentary upon the Book of the Revelation… (Edinburgh, 1658), pp. 469-72</span></figcaption>

text=where%20the%20like%20cases%2C%20call%2C%20and%20circumstances%20concur" rel="noopener" target="_blank">Read it online · Reformed Books Online</a></div>
</figure><figure class="quote" id="q-5240ad4d2c" data-kw="">
<blockquote><p>Now Libertines turn all our faith in a topic and conjectural opinion, so most of them are turned sceptics and affirm that we know nothing with any certainty; yea the more supernatural and sublime that fundamentals of salvation are, the more indulgence and latitude of liberty is to be yielded to the consciences of all men, because the higher the subject is, the ranker is our propension to err, God having given a thinner and more scarce measure of knowledge in supernaturall things, that do so far transcend the sphere and orb of natural reason, than of knowledge in natural things, our minds being in their own element, and in a capacity to reach their connatural and proper object when they are among natural things knowable by the light of nature; Hence that opinion now so prevailing that all and every religion is to be tolerated, and an indulgence yielding to all in superstructures in fundamentals, though a man should deny that Christ is the Saviour of the world; therefore Saltmarsh takes on him (Sparkles of Glory as pp. 185-188) to reckon out the articles of our faith, especially concerning the first Adam’s sin, sin-original, of Christ born of the virgin Mary, made under the Law, bearing our sins, dead, buried, ascended into Heaven, siting at the right hand etc. and speaks of the highest attaintments of the protestants generally in the mystery of salvation. but speaks not one word of the general resurrection of our bodies, of Christ coming to judge all men, of a Heaven and Hell after this life, as if these were none of the highest attaintments of the protestants generally in the mystery of salvation. And Saltmarsh, as I conceive with Hymeneus and Philetus and other Libertines in the [English] army, doubt of or deny these…</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/samuel-rutherford.html">Samuel Rutherford</a></span><span class="wk"><span class="lbl">Work:</span> <cite>A Survey of the Spiritual Antichrist, Opening the Secrets of Familism &amp; Antinomianism</cite>, ... (London, 1648) | pt. 1 | ch. 32, ‘What Certainty of Faith the Saints may Attain to Beyond the Familists’ Fluctuation of Faith: of Heresie &amp; Schism’, pp. 274-5</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/modern-errors.html">Modern Errors</a></span></div>

</figure><figure class="quote" id="q-d2c06fc13a" data-kw="">
<blockquote><p>The extraordinary gifts of the Spirit, such as the gift of tongues, of miracles, of prophecy, etc., are called extraordinary, because cause they are such as are not given in the ordinary course of God’s providence. They are not bestowed in the way of God’s ordinary providential dealing with his children, but only on extraordinary occasions, as they were bestowed on the prophets and apostles to enable them to reveal the mind and will of God before the canon of Scripture was complete, and so on the primitive Church, in order to the founding and establishing of it in the world. But since the canon of the Scripture has been completed, and the Christian Church fully founded and established, these extraordinary gifts have ceased.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/jonathan-edwards.html">Jonathan Edwards</a></span><span class="wk"><span class="lbl">Work:</span> <cite>‘Love More Excellent than the Extraordinary Gifts of the Spirit’ on 1 Cor</cite>, 13:1-2</span></figcaption>

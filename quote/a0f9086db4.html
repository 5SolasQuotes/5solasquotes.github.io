<main class="wrap"><figure class="quote" id="q-a0f9086db4" data-kw="">
<blockquote><p>The Christian Magistrate ought to protect the Elders, that they may peaceably exercise that Church-power which is committed to them by Jesus Christ, for the Christian Magistrate doth owe a spiritual subjection to all the ordinances of Jesus Christ […] It will be very dangerous for a Magistrate to do any thing of his own head about Church affairs, and it will be as dangerous for Ministers to complement in this weighty point; all power that a Magistrate hath settled upon him in Rom. 13 is settled on him as he is a Minister of God, and therefore they who teach Magistrates to despise the Authority of Ministers, because they are but Ministers of God, teach the Magistrates to despise their own authority. Officers of Christ’s instituting, and powers of God’s ordaining, must agree together, and uphold one another, or else both will be vilified: Ministers must not usurp a civil power, nor Magistrates lay claim to any Spiritual power properly so called: if a man go about to thrust two swords into one scabbard, let him take heed he doth not split the scabbard, and cut his fingers.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/francis-cheynell.html">Francis Cheynell</a></span><span class="wk"><span class="lbl">Work:</span> <cite>A plot for the good of posterity communicated in a sermon to the honourable House of Commons for the sanctifying of the monthly fast. March 25, 1646</cite>, (London, 1646), Epistle dedicatory.</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/civil-government-and-society.html">Civil Government and Society</a></span></div>

<blockquote><p>Being though divine, yet possessed of a real and true humanity, it is easy for men, by consulting their familiar experience, to perceive clear the connection betwixt this cause and this consequence in his gracious soul. He is the grand exemplification — the noblest practical exhibition of that standing maxim, that by being ourselves intimate with grief, we learn to succour the wretched; as, if he had never tasted pain, we could hardly have been prevented from a plying to him more than to any other, the reverse of that maxim which is of equal authority, — that those can never enter fully it our sorrow, who have felt nothing like it themselves.

This reference of the inspired writer to a well-known law of our nature gives additional clearness and force to that delightful truth which is I sides so plainly expressed in the former clause of the text, viz: to the compassion of Christ for our afflictions is not the result of merely rational conjecture or estimate of their severity, founded observation of their natural symptoms or effects, as one who has never known ill health may Judge of the violence of another man’s fever:– but that it proceeds from that quick, tender, penetrating thorough sense of our trials, which perfect manhood could not to acquire, by experiencing personally, as tests of his own obedience, the keenness of bodily pain, and the anguish of a wounded spirit.</p></blockquote>

</figure><figure class="quote" id="q-3a8f50205d" data-kw="">
<blockquote><p>Do magistrates seriously perform their work? Are they zealous for God? Do they build up his house? Are they tender of his honour? Do they second the word? and fly in the face of sin and sinners, as the disturbers of our peace, and the only cause of all our miseries? Do they improve all their power, wealth, and honour, and all their influence, for the greatest advantage to the kingdom of Christ, as men that must shortly give an account of their stewardship?</p></blockquote>

</figure><figure class="quote" id="q-eab71e3b1a" data-kw="">
<blockquote><p>Now for the good election of magistrates, the Lord himself declareth whom and what kind of men he will have to be chosen, in these very words: “Look over all the people, consider them diligently, and choose from among them men of courage, such as fear God, speakers of truth, and haters of covetousness, and make them rulers over thousands, rulers of hundreds, rulers of fifties, and rulers of tens, to judge the people at all seasons.” [Exodus 18:21] Four things the Lord requireth in a good governor. First, that he be a man of courage, of strength or force, that is, which hath ability to do the thing whereunto he is appointed. That ability consisteth in mind rather than in body. For it is required, that he be not a fool, but wise and skilful in that which he hath to do […]

In the second place that is set down, which indeed is the first; let him fear God, let him be religious, and not superstitious. No idolater preserveth the commonweal, but rather destroyeth it; and a wicked man defendeth not truth and true religion, but persecuteth and driveth them out of his jurisdiction. Let this magistrate of ours therefore be of the right religion, sound in faith, believing the word of God, and knowing that God is present among men and doth repay to whom he list according to their deserts. And for that cause Justinian, the emperor, in Novellis Constitutionib. 109, doth freely confess that all his help is of God; and that therefore it is convenient, that the making of all laws should depend upon him alone. […] And where the princes are God’s friends, and have often conference with God, there is hope that those commonwealths shall prosper and flourish. But, on the other side, there must needs be feared an unhappy end of that commonweal, where the enemies of God have the pre-eminence. Thirdly, there is required of him, which must be chosen and called to be magistrate, that he be true in word and deed, so that he be not found to be an hypocrite, a liar, a deceiver, a turncoat, nor one which out of one mouth doth blow both hot and cold; but faithful, simple, a plain dealer, and blameless. […]

Covetousness and greedy desire of bribes are the very plagues that choke good magistrates. By covetous men and takers of bribes law, judgment, liberty, justice, and the country itself, is set to sale and sold to the devil for money. And now, though in this place the Lord hath named only the most pestilent mischief of all other, yet there is no doubt but that he doth inclusively debar all other vices and evils of that sort, commanding them to be strange and far off from the good magistrate and godly governor. Those vices are pride, envy, anger, dicing, surfeiting, drunkenness, whoredom, adultery, and whatsoever else is like to these.

This place is made more manifest by conferring it with other places in the law of God. Moses, in Deuteronomy, saith to the people: “Bring men of wisdom, of understanding, and of an honest life, according to your tribes.” [Deuteronomy 1:13] Three things here again doth the wise man, Moses, require in them that are to be appointed magistrates in his commonweal. First, saith he, let them be wise. But the beginning of wisdom is the fear of the Lord. Let them therefore be ordained as magistrates, that are friends to God and true religion; let them be wise, and not foolish idiots. Secondarily, they must be men of understanding; that is, men of experience, who by long and continual exercise in handling of matters are able at the first brunt to deal in all cases according to the law. Lastly, they must be men of honest report, whose life and sound conversation are by their deeds perfectly tried and sufficiently witnessed of unto the people: and finally, they must be such as bear authority, and not be despised as rascal and vile knaves.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/heinrich-bullinger.html">Heinrich Bullinger</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Fifty godly and learned sermons divided into the five decades containing the chief and principal points of Christian religion</cite>, ed. Thomas Harding (1849-52 Parker edn; 4 vols, Grand Rapids, 2004), i, 319-21.</span></figcaption>

Covetousness and greedy desire of bribes are the very plagues that choke good magistrates. By covetous men and takers of bribes law, judgment, liberty, justice, and the country itself, is set to sale and sold to the devil for money. And now, though in this place the Lord hath named only the most pestilent mischief of all other, yet there is no doubt but that he doth inclusively debar all other vices and evils of that sort, commanding them to be strange and far off from the good magistrate and godly governor. Those vices are pride, envy, anger, dicing, surfeiting, drunkenness, whoredom, adultery, and whatsoever else is like to these.

This place is made more manifest by conferring it with other places in the law of God. Moses, in Deuteronomy, saith to the people: “Bring men of wisdom, of understanding, and of an honest life, according to your tribes.” [Deuteronomy 1:13] Three things here again doth the wise man, Moses, require in them that are to be appointed magistrates in his commonweal. First, saith he, let them be wise. But the beginning of wisdom is the fear of the Lord. Let them therefore be ordained as magistrates, that are friends to God and true religion; let them be wise, and not foolish idiots. Secondarily, they must be men of understanding; that is, men of experience, who by long and continual exercise in handling of matters are able at the first brunt to deal in all cases according to the law. Lastly, they must be men of honest report, whose life and sound conversation are by their deeds perfectly tried and sufficiently witnessed of unto the people: and finally, they must be such as bear authority, and not be despised as rascal and vile knaves.”

— Heinrich Bullinger, Fifty godly and learned sermons divided into the five decades containing the chief and principal points of Christian religion, ed. Thomas Harding (1849-52 Parker edn; 4 vols, Grand Rapids, 2004), i, 319-21.">Copy</button><a class="share" href="https://x.com/intent/post?text=%E2%80%9CNow+for+the+good+election+of+magistrates%2C+the+Lord+himself+declareth+whom+and+what+kind+of+men+he+will+have+to+be+chosen%2C+in+these+very+words%3A+%E2%80%9CLook+over+all+the+people%2C+consider+them+diligently%2C+and+choose+from+among+them+men+of+courage%2C+such+as+fear+God%2C+speakers+of+truth%2C+and+haters+of+covetousness%2C+and+make+them+rulers+over+thousands%2C+rulers+of+hundreds%2C+rulers+of+fifties%2C+and+rulers+of+tens%2C+to+judge+the+people+at+all+seasons.%E2%80%9D+%5BExodus+18%3A21%5D+Four+things+the+Lord+requireth+in+a+good+governor.+First%2C+that+he+be+a+man+of+courage%2C+of+strength+or+force%2C+that+is%2C+which+hath+ability+to+do+the+thing+whereunto+he+is+appointed.+That+ability+consisteth+in+mind+rather+than+in+body.+For+it+is+required%2C+that+he+be+not+a+fool%2C+but+wise+and+skilful+in+that+which+he+hath+to+do+%5B%E2%80%A6%5D%0A%0AIn+the+second+place+that+is+set+down%2C+which+indeed+is+the+first%3B+let+him+fear+God%2C+let+him+be+religious%2C+and+not+superstitious.+No+idolater+preserveth+the+commonweal%2C+but+rather+destroyeth+it%3B+and+a+wicked+man+defendeth+not+truth+and+true+religion%2C+but+persecuteth+and+driveth+them+out+of+his+jurisdiction.+Let+this+magistrate+of+ours+therefore+be+of+the+right+religion%2C+sound+in+faith%2C+believing+the+word+of+God%2C+and+knowing+that+God+is+present+among+men+and+doth+repay+to+whom+he+list+according+to+their+deserts.+And+for+that+cause+Justinian%2C+the+emperor%2C+in+Novellis+Constitutionib.+109%2C+doth+freely+confess+that+all+his+help+is+of+God%3B+and+that+therefore+it+is+convenient%2C+that+the+making+of+all+laws+should+depend+upon+him+alone.+%5B%E2%80%A6%5D+And+where+the+princes+are+God%E2%80%99s+friends%2C+and+

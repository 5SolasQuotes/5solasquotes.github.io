<blockquote><p>Protestants have always been accustomed to meet these views, whether put forth by Roman Catholics or Anglo-Catholics, by establishing the sufficiency and perfection of the sacred Scriptures as the only rule of faith, and by proving that we have not in point of fact, any certain means of knowing accurately what was declared and prescribed by the apostles, except from the writings of the New Testament.</p></blockquote>

</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-8fd989b3de" data-kw="">
<blockquote><p>By contrast, the Reformation asserted that a church, however venerable, can still err. … Even the most simple believer can and may if necessary, Bible in hand, stand up to an entire church, as Luther did to Rome. Only thus the freedom of the Christian, and simultaneously the sovereignty of God, is maintained. There is no higher appeal from Scripture. It is the supreme court of appeal. No power or pronouncement stands above it.</p></blockquote>

</figure><figure class="quote" id="q-c00aba9715" data-kw="">
<blockquote><p>Both Roman Catholicism and liberal modernism, though fiercely opposed to each other through much of their history, draw from the same poisoned well: the exaltation of man over the Word of God. One exalts church leaders, especially the pope, as its divinely reliable guide. The other exalts human reasoning and/or feelings as the supreme judge of religion.</p></blockquote>

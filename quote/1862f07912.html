<main class="wrap"><figure class="quote" id="q-1862f07912" data-kw="">
<blockquote><p>4. …In the art of painting, ye may abstract that which is moral from that which is artificial; but in a King as a King, there is nothing artificial, or which is to be abstracted from justice and piety; for all the acts of kingly authority as kingly, are moral acts of justice, and of piety in preserving both the Tables of the Law (if a King command a stratagem of war, that which is merely artificial is not from the King as King, but from a principle of military art in him, as an expert soldier)…</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/samuel-rutherford.html">Samuel Rutherford</a></span><span class="wk"><span class="lbl">Work:</span> <cite>A Peaceable &amp; Temperate Plea for Paul’s Presbytery in Scotland</cite>, (1642), ch. 19, p. 307</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/civil-government-and-society/the-civil-magistrate.html">The Civil Magistrate</a></span></div>
<div class="actions"><button class="copy" data-copy="“4. …In the art of painting, ye may abstract that which is moral from that which is artificial; but in a King as a King, there is nothing artificial, or which is to be abstracted from justice and piety; for all the acts of kingly authority as kingly, are moral acts of justice, and of piety in preserving both the Tables of the Law (if a King command a stratagem of war, that which is merely artificial is not from the King as King, but from a principle of military art in him, as an expert soldier)…”

— Samuel Rutherford, A Peaceable and Temperate Plea (1642), ch. 19, p. 307">Copy</button><a class="share" href="https://x.com/intent/post?text=%E2%80%9C4.+%E2%80%A6In+the+art+of+painting%2C+ye+may+abstract+that+which+is+moral+from+that+which+is+artificial%3B+but+in+a+King+as+a+King%2C+there+is+nothing+artificial%2C+or+which+is+to+be+abstracted+from+justice+and+piety%3B+for+all+the+acts+of+kingly+authority+as+kingly%2C+are+moral+acts+of+justice%2C+and+of+piety+in+preserving+both+the+Tables+of+the+Law+%28if+a+King+command+a+stratagem+of+war%2C+that+which+is+merely+artificial+is+not+from+the+King+as+King%2C+but+from+a+principle+of+military+art+in+him%2C+as+an+expert+soldier%29%E2%80%A6%E2%80%9D%0A%0A%E2%80%94+Samuel+Rutherford%2C+A+Peaceable+and+Temperate+Plea+%281642%29%2C+ch.+19%2C+p.+307&amp;url=https%3A%2F%2F5solasquotes.github.io%2Fquote%2F1862f07912.html&amp;via=5Solas" target="_blank" rel="noopener">Share on X</a><a class="perma" href="../quote/1862f07912.html">Permalink</a><a class="src" href="https://reformedbooksonline.com/contra-socialism-communism-etc/#:~:text=In%20the%20art%20of%20painting%2C%20ye,in%20him%2C%20as%20an%20expert%20soldier&amp;text=In%20the%20art%20of%20painting%2C%20ye%20may%20abstract&amp;text=military%20art%20in%20him%2C%20as%20an%20expert%20soldier" rel="noopener" target="_blank">Read it online · Reformed Books Online</a></div>
</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-1e1630c6fb" data-kw="">
<blockquote><p>1 Cor. 6:12, ‘All things (indifferent) are lawful in themselves, but they are not expedient,’ if we be brought under the power or band of them by law. Therefore, in the means of worship, not only must we see what is lawful, but also what is profitable and conducing to the end… 1 Cor. 7:6, ‘But this I speak by permission, not of commandment.’ Therefore in things in which God has granted us liberty, to do or not to do, permission has place, not obliging necessity or penal laws. 13th Proposition. There cannot be commanding laws in things that are politicly good or evil according to the individual complexion, temperature, or gifts of singular men: [for example] to marry or not to marry, cannot be commanded, for where God looses, no power on earth can bind, v. 33. 1 Cor. 8:7, Paul condemns them in the use of their Christian liberty, ‘Howbeit there be not in every man this knowledge;’ then that rulers may make laws in things indifferent, without scandal, they must remove ignorance. 2. If there be but one person weak in knowledge (there is not in every man that knowledge), a law obliging all in things indifferent cannot be made.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/samuel-rutherford.html">Samuel Rutherford</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Divine Right of Church Government</cite>, … (London, 1646), Appendix, Question 1, pp. 6-7</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/civil-government-and-society/the-civil-magistrate.html">The Civil Magistrate</a></span><span class="t"><a href="../topics/church-government-and-the-ministry/synods-and-assemblies.html">Synods and Assemblies</a></span></div>
<div class="actions"><button class="copy" data-copy="“1 Cor. 6:12, ‘All things (indifferent) are lawful in themselves, but they are not expedient,’ if we be brought under the power or band of them by law. Therefore, in the means of worship, not only must we see what is lawful, but also what is profitable and conducing to the end… 1 Cor. 7:6, ‘But this I speak by permission, not of commandment.’ Therefore in things in which God has granted us liberty, to do or not to do, permission has place, not obliging necessity or penal laws. 13th Proposition. There cannot be commanding laws in things that are politicly good or evil according to the individual complexion, temperature, or gifts of singular men: [for example] to marry or not to marry, cannot be commanded, for where God looses, no power on earth can bind, v. 33. 1 Cor. 8:7, Paul condemns them in the use of their Christian liberty, ‘Howbeit there be not in every man this knowledge;’ then that rulers may make laws in things indifferent, without scandal, they must remove ignorance. 2. If there be but one person weak in knowledge (there is not in every man that knowledge), a law obliging all in things indifferent cannot be made.”

</figure><figure class="quote" id="q-a9c679b4da" data-kw="">
<blockquote><p>For we nowhere teach that the sword is a means of converting, but the just vengeance that is inflicted by the minister of God upon false teachers, as upon other evil-doers, so it is not destinated by God for spiritual gaining and reducing of heretics that may repent, but for judicial expiation of wrongs done to the flock and Christian society.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/samuel-rutherford.html">Samuel Rutherford</a></span><span class="wk"><span class="lbl">Work:</span> <cite>A Free Disputation Against Pretended Liberty of Conscience</cite>, … (1649), Ch. 11, p. 139</span></figcaption>

</figure><figure class="quote" id="q-64b47022e7" data-kw="">
<blockquote><p>Argument 5— When Paul commands us to pay tribute to princes (Rom. 13:6) because they are the ministers of God, he lays this ground, that the king has not all, but that the subjects are to give to him of their goods.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/samuel-rutherford.html">Samuel Rutherford</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Lex Rex</cite>, ... (1644; Edinburgh: Ogle, 1843), p. 68 rt col top</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/civil-government-and-society/the-civil-magistrate.html">The Civil Magistrate</a></span></div>
<div class="actions"><button class="copy" data-copy="“Argument 5— When Paul commands us to pay tribute to princes (Rom. 13:6) because they are the ministers of God, he lays this ground, that the king has not all, but that the subjects are to give to him of their goods.”

— Samuel Rutherford, Lex Rex... (1644; Edinburgh: Ogle, 1843), p. 68 rt col top">Copy</button><a class="share" href="https://x.com/intent/post?text=%E2%80%9CArgument+5%E2%80%94+When+Paul+commands+us+to+pay+tribute+to+princes+%28Rom.+13%3A6%29+because+they+are+the+ministers+of+God%2C+he+lays+this+ground%2C+that+the+king+has+not+all%2C+but+that+the+subjects+are+to+give+to+him+of+their+goods.%E2%80%9D%0A%0A%E2%80%94+Samuel+Rutherford%2C+Lex+Rex...+%281644%3B+Edinburgh%3A+Ogle%2C+1843%29%2C+p.+68+rt+col+top&amp;url=https%3A%2F%2F5solasquotes.github.io%2Fquote%2F64b47022e7.html&amp;via=5Solas" target="_blank" rel="noopener">Share on X</a><a class="perma" href="../quote/64b47022e7.html">Permalink</a><a class="src" href="https://reformedbooksonline.com/on-paying-taxes/#:~:text=Argument%205%E2%80%94%20When%20Paul%20commands%20us,give%20to%20him%20of%20their%20goods&amp;text=Argument%205%E2%80%94%20When%20Paul%20commands%20us%20to%20pay&amp;text=are%20to%20give%20to%20him%20of%20their%20goods" rel="noopener" target="_blank">Read it online · Reformed Books Online</a></div>
</figure><figure class="quote" id="q-4698f1b8ef" data-kw="">
<blockquote><p>And because the king being made a king leaves not off to be a reasonable creature, he must be under a law, and so his will and lust cannot be the rule of his power and dominion, but law and reason must regulate him. Now if God had given to the king a dominion over men as reasonable creatures, his power and dominion which by royalists is conceived to be above law, should be a rule to men as reasonable men, which would make men under kings no better than brute beasts, for then should subjects exercise acts of reason, not because good and honest, but because their prince commands them so to do; and if this cannot be said, none can be at the disposing of kings in politic acts liable to royal government, that way that the slave is in his actions under the dominion of his master.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/samuel-rutherford.html">Samuel Rutherford</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Lex Rex</cite>, ... (1644; Edinburgh: Ogle, 1843), p. 65 rt col</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/civil-government-and-society/the-civil-magistrate.html">The Civil Magistrate</a></span></div>

<blockquote><p>Yet with these heretics and schismatics [the Donatists], our Jacobites, Brownists and Barrowsts symbolize; for, as the Donatists refused communion with the catholic Church in regard of some scandals they observed in it, so do these separate from the true Church of England in regard of some abuses, and, as they term them, popish corruptions in it. As they excluded all from hope of salvation who were not of their pure precise sect, so these go not much behind them in their uncharitable censures of all those who are not of their fraternity…</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/daniel-featley.html">Daniel Featley</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Dippers Dipped, or, the Anabaptists Ducked &amp; Plunged</cite>, … (London: Bourne, 1645), ch. 1, p. 27 Featley was a Westminster divine.</span></figcaption>

</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-13cadfdfe6" data-kw="">
<blockquote><p>To conclude this, separation from Churches, from which Christ does not separate, is schismatical; now it’s clear in the Scripture that Christ owns churches where faith is sound for the substance, and their worship, Gospel-worship, though there be many defects and sinful mixtures among them. And what I have said concerning the schismaticalness of separation because of the sinful mixtures of those who are wicked in practice, is as true concerning separation from them who are erroneous in judgment; if the errors of those from whom the separation is made, be not fundamental, and hinder communion with Christ the head. And much more clear (if clearer can be) is the schismaticalness of those who separate from and renounce all communion with those churches which are not of their own manner of constitution and modelled according to the platform of their own particular church-order. To refrain fellowship and communion with such Churches who profess Christ their Lord, whose faith is sound, whose worship is Gospel-worship, whose lives are holy, because they come not into that particular way of church-order which we have pitched upon, is a schismatical rending of the Church of Christ to pieces… Herein likewise those separatists among ourselves are heinously faulty who censure and condemn all other churches, though their faith, worship and conversation be never so scriptural, merely because they are not gathered into church order according to their own patterns. In Scripture, Churches are commended and dignified, according as their fundamental faith was sound and their lives holy; not according to the regularity of their first manner of gathering.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/william-jenkyn.html">William Jenkyn</a></span><span class="wk"><span class="lbl">Work:</span> <cite>An Exposition of the Epistle of Jude</cite>, ... (London: Maxey, 1654), on verse 19, Observations, p. 593</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/the-church/church-unity-and-fundamentals.html">Church Unity and Fundamentals</a></span></div>

</figure><figure class="quote" id="q-fb014038e0" data-kw="">
<blockquote><p>I shall recommend to you Mr. [William] Perkins’ Exposition of this [Scripture] testimony (on Jude 19), comparing it with his comment to the same effect on the first chapter of the Epistle to the Galatians, the 2nd verse, and his doctrinal observation is this (I shall only abbreviate that descant he has enlarged): It is a great sin for a man to separate himself from the assembly of God’s people, Heb. 10:25. It is our duty to keep unity, Eph. 4:3. Upon this occasion he starts this question: Whether if there be errors in the Church, we may separate ourselves? His judicious resolution is this: Errors are either practical in manners or doctrinal in tenets. For vicious manners we may not separate; Lot did it not. The Jews might not do it from the scribes and Pharisees, because they sat in Moses’s chair. Though we may not separate from such corrupt persons in the public assemblies, yet we may in private conversation, 1 Cor. 5:11. If the Church err in doctrine, it is to be considered whether the error be in a point substantial, fundamental or not? if in a point substantial, fundamental, whether upon infirmity, or obstinacy? if of frailty, we may not separate, as in Corinth and Galatia. If a Church err in the foundation openly, obstinately, a separation may be made, 1 Tim. 4:5 (yet the error being in some, not in all, it remains a Church, as Corinth did). If the error be in smaller points, not fundamental, we may not separate: They which build upon the foundation of hay and stubble of erroneous opinon, may be saved, 1 Cor. 3:25. Mr. Perkins concludes that no man can separate from the Church of England with a good conscience, since it teaches, obeys, believes the doctrine of the prophets and apostles. In the most justifiable cause of separation he requires examination, conviction, censure (or condemnation). To separate without examination is not piety, but frenzy. No man can judge aright of that (says the Philosopher, Aristotle, bk. 1, Ethics) whereof he is ignorant. No man can well determine, what he does not well discuss. Qui ad pauca respicit de facili pronunciat.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/william-thomas.html">William Thomas</a></span><span class="wk"><span class="lbl">Work:</span> <cite>An Apology for the Church of England, in Point of Separation from it</cite>, (London: Leach, 1679), pp. 80-82 Thomas (d. 1689) was a Welsh Anglican bishop.</span></figcaption>

</figure><figure class="quote" id="q-a5521c7827" data-kw="">
<blockquote><p>Are the wicked intermixed with true and zealous professors? What shall we then say to the old Donatists (Socrates, Ecclesiastical History, bk. 1, ch. 7), and the Brownists, and Anabaptists, which separate themselves from the true Church, say with those in the prophet, ‘Come not near us for we are holier then ye.’ Me thinks I may say unto them as Constantine said to Acesius, a Novatian Bishop: Let them make a ladder for themselves to ascend into heaven, here is no place for them on earth, as long as this world shall last, the Lord’s wheat shall grow up with the tares.(Mt. 13:29) Christ has spoken it, and Christ is truth, ‘if there be in them any charity, they will assent to this verity’ (Sit in illis charitas et congaudeant veritate, Augustine, Cor. 2:6). ‘Yea but light has no communion with darkness, nor bitterness with honey, nor life with death, nor the unbeliever with the infidel.’ It is the objection of Petilian the Donatist against Augustine. But his answer is that when they eschew the darkness, they forsake the light: when they flee from death they flee from life also: Attendis Zizania per mundum, &amp; triticum non attendis, cum per totum vtraque sint iussa crescere? attendis semen maligni, quod ad finem messis separabitur; et non attendis semen Abrahae, in quo benedicentur omnes gentes? Dost thou mark the darnel, and dost thou not remember the wheat? Dost thou think upon the seed of the serpent, whose head shall be crushed; and dost thou not think upon the seed of Abraham, in whom all the nations of the earth shall be blessed? When thou fleest from the chaff, thou forsakest the good wheat, which is mingled with it. When thou separatest thyself from the seed of the wicked, thou seperatest thyself from the seed of Abraham. When thou thus dividest thyself from the hypocrites that are in the true Church, thou cuttest thyself from the Church, and a member taken from the whole must needs perish. If thou wilt think upon this with that heedfulness that thou shouldst, thou wilt not forsake the green pastures of the Lord that are besides the waters of comfort (Ps. 23) because of the goats; nor leave God’s house because of the vessels of dishonor; nor run out of the Lord’s floor, because of the chaff; nor separate thyself from the wheat because of the tares, which shall at length be bound in a bundle and cast into the fire; nor burst the unity of the Lord’s net because of the bad fish, which swim in it, (which, when the net is brought to land, shall be cast away), but as a father speaks: tolerare potiùs propter bonos cōmixtionem malorum, quam violare propter malos charitatem bonorum; rather for the good to tolerate the bad than for the bad to forsake the good. (Augustine, bk. 3, Contra litt. Petit., ch. 3)</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/lancelot-dawes.html">Lancelot Dawes</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Two Sermons preached at the Assizes holden at Carlile touching sundry Corruptions of these Times</cite>, (Oxford: Barnes, 1614), 1st Sermon, pp. 32-34 Dawes (1580–1653) was an Anglican clergyman.</span></figcaption>

<div class="actions"><button class="copy" data-copy="“Are the wicked intermixed with true and zealous professors? What shall we then say to the old Donatists (Socrates, Ecclesiastical History, bk. 1, ch. 7), and the Brownists, and Anabaptists, which separate themselves from the true Church, say with those in the prophet, ‘Come not near us for we are holier then ye.’ Me thinks I may say unto them as Constantine said to Acesius, a Novatian Bishop: Let them make a ladder for themselves to ascend into heaven, here is no place for them on earth, as long as this world shall last, the Lord’s wheat shall grow up with the tares.(Mt. 13:29) Christ has spoken it, and Christ is truth, ‘if there be in them any charity, they will assent to this verity’ (Sit in illis charitas et congaudeant veritate, Augustine, Cor. 2:6). ‘Yea but light has no communion with darkness, nor bitterness with honey, nor life with death, nor the unbeliever with the infidel.’ It is the objection of Petilian the Donatist against Augustine. But his answer is that when they eschew the darkness, they forsake the light: when they flee from death they flee from life also: Attendis Zizania per mundum, &amp; triticum non attendis, cum per totum vtraque sint iussa crescere? attendis semen maligni, quod ad finem messis separabitur; et non attendis semen Abrahae, in quo benedicentur omnes gentes? Dost thou mark the darnel, and dost thou not remember the wheat? Dost thou think upon the seed of the serpent, whose head shall be crushed; and dost thou not think upon the seed of Abraham, in whom all the nations of the earth shall be blessed? When thou fleest from the chaff, thou forsakest the good wheat, which is mingled with it. When thou separatest thyself from the seed of the wicked, thou seperatest thyself from the seed of Abraham. When thou thus dividest thyself from the hypocrites that are in the true Church, thou cuttest thyself from the Church, and a member taken from the whole must needs perish. If thou wilt think upon this with that heedfulness that thou shouldst, thou wilt not forsake the green pastures of the Lord that are besides the waters of comfort (Ps. 23) because of the goats; nor leave God’s house because of the vessels of dishonor; nor run out of the Lord’s floor, because of the chaff; nor separate thyself from the wheat because of the tares, which shall at length be bound in a bundle and cast into the fire; nor burst the unity of the Lord’s net because of the bad fish, which swim in it, (which, when the net is brought to land, shall be cast away), but as a father speaks: tolerare potiùs propter bonos cōmixtionem malorum, quam violare propter malos charitatem bonorum; rather for the good to tolerate the bad than for the bad to forsake the good. (Augustine, bk. 3, Contra litt. Petit., ch. 3)”

— Lancelot Dawes, Two Sermons preached at the Assizes holden at Carlile touching sundry Corruptions of these Times (Oxford: Barnes, 1614), 1st Sermon, pp. 32-34 Dawes (1580–1653) was an Anglican clergyman.">Copy</button><a class="share" href="https://x.com/intent/post?text=%E2%80%9CAre+the+wicked+intermixed+with+true+and+zealous+professors%3F+What+shall+we+then+say+to+the+old+Donatists+%28Socrates%2C+Ecclesiastical+History%2C+bk.+1%2C+ch.+7%29%2C+and+the+Brownists%2C+and+Anabaptists%2C+which+separate+themselves+from+the+true+Church%2C+say+with+those+in+the+prophet%2C+%E2%80%98Come+not+near+us+for+we+are+holier+then+ye.%E2%80%99+Me+thinks+I+may+say+unto+them+as+Constantine+said+to+Acesius%2C+a+Novatian+Bishop%3A+Let+them+make+a+ladder+for+themselves+to+ascend+into+heaven%2C+here+is+no+place+for+them+on+earth%2C+as+long+as+this+world+shall+last%2C+the+Lord%E2%80%99s+wheat+shall+grow+up+with+the+tares.%28Mt.+13%3A29%29+Christ+has+spoken+it%2C+and+Christ+is+truth%2C+%E2%80%98if+there+be+in+them+any+charity%2C+they+will+assent+to+this+verity%E2%80%99+%28Sit+in+illis+charitas+et+congaudeant+veritate%2C+Augustine%2C+Cor.+2%3A6%29.+%E2%80%98Yea+but+light+has+no+communion+with+darkness%2C+nor+bitterness+with+honey%2C+nor+life+with+death%2C+nor+the+unbeliever+with+the+infidel.%E2%80%99+It+is+the+objection+of+Petilian+the+Donatist+against+Augustine.+But+his+answer+is+that+when+they+eschew+the+darkness%2C+they+forsake+the+light%3A+when+they+flee+from+death+they+flee+from+life+also%3A+Attendis+Zizania+per+mundum%2C+%26+triticum+non+attendis%2C+cum+per+totum+vtraque+sint+iussa+crescere%3F+attendis+semen+maligni%2C+quod+ad+finem+messis+separabitur%3B+et+non+attendis+semen+Abrahae%2C+in+quo+benedicentur+omnes+gentes%3F+Dost+thou+mark+the+darnel%2C+and+dost+thou+not+remember+the+wheat%3F+Dost+thou+think+upon+the+seed+of+the+serpent%2C+whose+head+shall+be+crushed%3B+and+dost+thou+not+think+upon+the+seed+of+Abraham%2C+in+whom+all+the+nations+of+the+earth+shall+be+blessed%3F+When+thou+fleest+from+the+chaff%2C+thou+forsakest+the+good+wheat%2C+which+is+mingled+with+it.+When+thou+separatest+thyself+from+the+seed+of+the+wicked%2C+thou+seperatest+thyself+from+the+seed+of+Abraham.+When+thou+thus+dividest+thyself+from+the+hypocrites+that+are+in+the+true+Church%2C+thou+cuttest+thyself+from+the+Church%2C+and+a+member+taken+from+the+whole+must+needs+perish.+If+thou+wilt+think+upon+this+with+that+heedfulness+that+thou+shouldst%2C+thou+wilt+not+forsake+the+green+pastures+of+the+Lord+that+are+besides+the+waters+of+comfort+%28Ps.+23%29+because+of+the+goats%3B+nor+leave+God%E2%80%99s+house+because+of+the+vessels+of+dishonor%3B+nor+run+out+of+the+Lord%E2%80%99s+floor%2C+because+of+the+chaff%3B+nor+separate+thyself+from+the+wheat+because+of+the+tares%2C+which+shall+at+length+be+bound+in+a+bundle+and+cast+into+the+fire%3B+nor+burst+the+unity+of+the+Lord%E2%80%99s+net+because+of+the+bad+fish%2C+which+swim+in+it%2C+%28which%2C+when+the+net+is+brought+to+land%2C+shall+be+cast+away%29%2C+but+as+a+father+speaks%3A+tolerare+poti%C3%B9s+propter+bonos+co%CC%84mixtionem+malorum%2C+quam+violare+propter+malos+charitatem+bonorum%3B+rather+for+the+good+to+tolerate+the+bad+than+for+the+bad+to+forsake+the+good.+%28Augustine%2C+bk.+3%2C+Contra+litt.+Petit.%2C+ch.+3%29%E2%80%9D%0A%0A%E2%80%94+Lancelot+Dawes%2C+Two+Sermons+preached+at+the+Assizes+holden+at+Carlile+touching+sundry+Corruptions+of+these+Times+%28Oxford%3A+Barnes%2C+1614%29%2C+1st+Sermon%2C+pp.+32-34+Dawes+%281580%E2%80%931653%29+was+an+Anglican+clergyman.&amp;url=https%3A%2F%2F5solasquotes.github.io%2Fquote%2Fa5521c7827.html&amp;via=5Solas" target="_blank" rel="noopener">Share on X</a><a class="perma" href="../quote/a5521c7827.html">Permalink</a><a class="src" href="https://reformedbooksonline.com/that-union-in-at-least-christianitys-fundamentals-is-obliging/#:~:text=Are%20the%20wicked%20intermixed%20with%20true,3%2C%20Contra%20litt.%20Petit.%2C%20ch.%203&amp;text=Are%20the%20wicked%20intermixed%20with%20true%20and%20

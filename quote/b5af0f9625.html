<main class="wrap"><figure class="quote" id="q-b5af0f9625" data-kw="">
<blockquote><p>It is true that Calvin has intimated more than once his con- viction, that the position laid down by some of the schoolmen, viz. that Christ died ” sufficienter pro omnibus, efficaciter pro electis,” is sound and orthodox in some sense. But then he has never, so far as we remember or have seen proved, explained precisely in what sense he held it, and there is a sense in which the advocates of particular redemption can consistently admit and adopt it.† † When the subject of the extent of the atonement came to be more fully and exactly discussed, orthodox Calvinists generally objected to adopt this scholastic position, on the ground that it seemed to imply an ascription to Christ of a, purpose or intention of dying in some sense for all men. For this reason they usually declined to adopt it as it stood, or they proposed to alter it into this form, — Christ’s death was sufficient for all, efficacious for the elect. By this change in the position, the question was made to turn, not on what Christ did, but on what His death was; and thus the appearance of ascribing to Him personally a purpose or intention of dying, in some sense, for all men, was removed.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/david-ponter.html">David Ponter</a></span><span class="wk"><span class="lbl">Work:</span> <cite>‘The Classic “Sufficient for all, Efficient for the elect” and its Revision’ at Calvin &amp; Calvinism The webmaster is a hypothetical universalist</cite>, This historical development of the interpretation of the Lombardian formula is partially confirmed by William Cunningham, The Reformers &amp; the Theology of the Reformation (Edinburgh: T&amp;T Clark, 1866), Essay 7, ‘Calvin &amp; Beza’, p. 397:</span></figcaption>

<blockquote><p>Again, that these same men admit in God a certain antecedent will of the salvation of all, he himself also acknowledges. From which it follows that, with much greater right, it is admitted in Christ. Moreover, this antecedent will does not pertain only to this: that God, abstracting from the fall of man, is said to desire the salvation of all, insofar as they are men; but, generally, the antecedent will of God is directed toward that which is right, that which is just, that which is good in itself. Thus, because it is right for man to be converted, to do penance, not to despise the goodness of God, not to reject his graces, to approach the Sacraments—God is considered to will all these things by an antecedent will, although, when the individual circumstances are considered, he has not decreed to confer upon each individual efficacious graces by which they certainly arrive at salvation, without which they certainly fall away from salvation. Therefore God does not desire, by an antecedent will, the salvation of all men merely on this account, that he made all rational creatures for blessedness; but also because, since he diffuses very many graces, both external and internal, among the reprobate, which it is unjust for them to abuse, and since he wills that an entrance into his Church should likewise be open to them, he is considered, by an antecedent will, to will that all arrive at salvation, because he would will that they not remain obstinate in wickedness, and that they make good use of the helps offered to them; although, on the other hand, by a will of justice, when all the circumstances are considered, he judged it better to leave them to their wickedness, and not to grant efficacious aids, by which alone the depravity of the human heart is overcome. Hence it is evident that God wills, by an antecedent will, the salvation both of the demons and of reprobate men; nevertheless, in a very different way in the case of men than in that of demons. For since he now offers no helps of grace to demons, nor wills that an entrance into the Church, or the aid of the sacraments, be open to them, consequently neither does he will them to make good use of his grace, which he now grants none to them. But, on the contrary, since men are still on the way, he must be thought, by an antecedent will, to desire for them conversion and a sincere return to himself and a good use of his graces, from which he by no means bars them—none of which he provides toward demons. That antecedent will, moreover, often seems to have been in Christ, as when he wept over Jerusalem and lamented its coming calamities in these words: “Luke says, ‘He wept over it, saying, If you also had known, and indeed in this your day, the things which are for your peace! But now they are hidden from your eyes, because days will come upon you, and your enemies will surround you with a rampart,’ etc.</p></blockquote>

</figure><figure class="quote" id="q-2382ecf531" data-kw="">
<blockquote><p>For the transgression of my people was he stricken” (lsa. 53:8). “Thou shalt call his name JESUS: for he shall save his people from their sins” (Matt. 1:21). “The Son of man came not to be ministered unto, but to minister, and to give his life a ransom for many” (Matt. 20:28). “The good Shepherd giveth his life for the sheep” (John’ 10:11). “Christ also loved the church and gave himself for it” (Eph. 5: 25). “Who gave himself for us, that he might redeem us from all iniquity, and purify unto himself a peculiar people” (Titus 2: 14). “To make propitiation for the sins of the people” (Heb. 2: 17). Here are seven passages which gave a clear and simple answer to our question, and their testimony, both singly and collectively, declare plainly that the death of Christ was not an atonement for sin abstractedly, nor a mere expression of Divine displeasure against iniquity, nor an indefinite satisfaction of Divine justice, but instead, a ransom-price paid for the eternal redemption of a certain number of sinners, and a plenary satisfaction for their particular sins. It is the glory of redemption that it does not merely render God placable and man pardonable, but that it has reconciled sinners to God, put away their sins, and forever perfected His set-apart ones.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/arthur-w-pink.html">Arthur W. Pink</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Exposition of the Gospel of John</cite>, (Zondervan, 1962), 2.219-22 This is early Pink, at his worst. HT: David Ponter | Whenever the Holy Scriptures speak of the sufficiency of redemption, they always place it in the certain efficacy of redemption. The atonement of Christ is sufficient because it is absolutely efficacious, and because it effects the salvation of all for whom it was made. Its sufficiency lies not in affording man a possibility of salvation, but in accomplishing their salvation with invincible power. Hence the Word of God never represents the sufficiency of the atonement as wider than the design of the atonement. How different is the salvation of God from the ideas now popularly entertained of it! “As for thee also, by the blood of thy covenant I have sent forth thy prisoners out of the pit wherein is no water” (Zech. 9:11). Christ, by his death paid the ransom, and made sin’s captives his own. He has a legal right to all of the persons for whom He paid that ransom price, and therefore with God’s own right arm they are brought forth. For whom did Christ die?</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/priestly-office-satisfaction-and-atonement/extent-of-the-atonement.html">Extent of the Atonement</a></span></div>
<div class="actions"><button class="copy" data-copy="“For the transgression of my people was he stricken” (lsa. 53:8). “Thou shalt call his name JESUS: for he shall save his people from their sins” (Matt. 1:21). “The Son of man came not to be ministered unto, but to minister, and to give his life a ransom for many” (Matt. 20:28). “The good Shepherd giveth his life for the sheep” (John’ 10:11). “Christ also loved the church and gave himself for it” (Eph. 5: 25). “Who gave himself for us, that he might redeem us from all iniquity, and purify unto himself a peculiar people” (Titus 2: 14). “To make propitiation for the sins of the people” (Heb. 2: 17). Here are seven passages which gave a clear and simple answer to our question, and their testimony, both singly and collectively, declare plainly that the death of Christ was not an atonement for sin abstractedly, nor a mere expression of Divine displeasure against iniquity, nor an indefinite satisfaction of Divine justice, but instead, a ransom-price paid for the eternal redemption of a certain number of sinners, and a plenary satisfaction for their particular sins. It is the glory of redemption that it does not merely render God placable and man pardonable, but that it has reconciled sinners to God, put away their sins, and forever perfected His set-apart ones.”

<blockquote><p>Whether Christ actually expiated and satisfied for our sins? It is affirmed contra the Socinians. Whether such an expiation was necessary? It is affirmed contra the Socinians. Whether it was a full and total expiation? It is affirmed. Whether it is able to be said Christ according to each nature was a sacrifice and victim? It is denied. Whether his oblation of Himself was properly a victim? It is affirmed. Whether therefore passions ought not to be referred to the sacrifice and victim? It is affirmed. Whether the whole passive obedience of Christ is able to be called a victim and sacrifice? It is denied with a distinction. Whether that dignity, by which the death of Christ redounds dignity and efficacy, so it is a ransom (lutron), is able to be called part of the victim? It is distinguished. Whether the divine nature was the altar, or indeed the sign of the cross was? The former is affirmed.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/gisbertus-voetius.html">Gisbertus Voetius</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Syllabus of Theological Problems</cite>, (Utrecht, 1643), pt. 1, section 2 Abbr. | tract 2 | Of the First Part, or of the Act: The Sacrifice of the Priestly Office, even the Full Satisfaction &amp; Expiation</span></figcaption>

<main class="wrap"><figure class="quote" id="q-0c328527eb" data-kw="">
<blockquote><p>They, in their Apologetical Narration, had asserted that they gave as much, or, as they thought, more, power to the civil magistrate in religious matters than the principles of Presbyterians would allow them to do, a declaration which, whether it be regarded as made honestly or hypocritically, has been very galling to those who have succeeded them in the maintenance of Congregational principles.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/william-cunningham.html">William Cunningham</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Historical Theology, vol. 2 (Edinburgh, 1870)</cite>, p. 580</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/civil-government-and-society/church-and-state.html">Civil Government and Society: Church and State</a></span></div>

</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-8d902ff6ba" data-kw="">
<blockquote><p>…it appears to me that no objection can be made to admitting into the consistory officers of justice and chiefs of police, provided they sit in it in the capacity of magistrates. But always let there be a due distinction observed between the two functions and conditions. To exclude persons that belong to the civil government from all superintendence in the spiritual administration, seems to me contrary to reason. What is essential is that when fitting persons shall have been elected to such an office, there should be no blending of their functions, nor the power of the sword confounded with what ought to be carefully kept distinct from it.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/john-calvin.html">John Calvin</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Letters, #620 (1562)</cite></span></figcaption>
<div class="meta"><span class="t"><a href="../topics/civil-government-and-society/church-and-state.html">Civil Government and Society: Church and State</a></span></div>

</figure><figure class="quote" id="q-f2d5d7b1c4" data-kw="">
<blockquote><p>All the question is concerning the imperated [commanded] acts and these external, that is not touching opinions and acts of the mind, but that which is visible and audible in these opinions, to wit, the speaking, professed holding of them, publishing, teaching, printing, and known external persuading of others to be of our mind. So that the question will come to this, whether the Magistrate’s sword be to regulate our words that concerns our neighbor, as that we lie not, we forswear not, to the hurt of the life and credit of our neighbor, that we slander not, rail upon no man, far less against the prince and ruler of the people, but whether the words we utter or publish of God though never such blasphemies, and lies, because they come from the conscience (as is truths or words we speak for or against our neighbor did not flow from a conscience either good or ill) be above or beyond all swords or coercive power of men. It is clear the question must be thus stated, for all the laws of the Old Testament (which we hold in their moral equity to be perpetual) that are touching blasphemies, heresies, solicitation to worship false gods and the breach of which the godly magistrate was to punish, command or forbid only such things as may be proved by two or three witnesses, and which husband and wife are not to conceal, and from which all Israel must abstain for fear of the like punishment, Dt. 13:8-11; 17:5-6; Lev. 20:1-5. But opinions in the mind, acts of the understanding, can never be proved by witnesses and such as neither Magistrate nor Church can censure.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/samuel-rutherford.html">Samuel Rutherford</a></span><span class="wk"><span class="lbl">Work:</span> <cite>A Free Disputation Against Pretended Liberty of Conscience (1649), ch. 4</cite>, pp. 46-47</span></figcaption>

</figure><figure class="quote" id="q-95271cf080" data-kw="">
<blockquote><p>6. The object of the king’s power is not simply a peaceable life, and external peace of human societies, but also honesty and godliness, but to be procured by a civil, politic, regal and coactive way, by the sword of the secular arm, as the object of the Church power is honesty and godliness to be procured by a ministerial, ecclesiastical, and spiritual power, without any forcing of men by external power.</p></blockquote>

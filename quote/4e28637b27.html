<main class="wrap"><figure class="quote" id="q-4e28637b27" data-kw="">
<blockquote><p>For your selves you confess to me that you have long thought that Infant-Baptism was an error, and that now you think the Quakers are in the right; and yet you neither did once read any one of those Books which we have written to prove Infant-Baptism to be a duty, nor did once seriously and impartially lay open your doubts to your Teacher, nor ask his advice, as if you were even then too good to enquire, and would venture your soul to save you a little labour, yet are you now confident that you are in the right, and he and all of his mind are in the wrong.

You know you are a young man, and have had little opportunity to be acquainted with the Word of God, in comparison of what your Teacher hath had: If you presume that you are so much more beloved of God then he, that God will reveal that to you without seeking and study, which upon the greatest diligence he will not reveal to him; what can this conceit proved from but pride?

God commandeth study and meditating day and night in his Laws; Your Teacher hath spent twenty, if not an hundred hours in such Meditation where you have spent one: He hath spent twenty if not an hundred hours in prayer to God for his spirit of Truth and Grace, where you have spent one: His prayers are as earnest as yours: His life is much more holy and heavenly then yours; His Office is to teach, and therefore God is as it were more engaged to be his Teacher, and to make known his Truth to him than to you[.]

Is it not then apparent pride for you to be confident that you are so much wiser then he, and that you are so much more lovely in God’s eyes, that he will admit you more into the knowledge of his Mysteries, then those that have better used his own appointed means to know them? and for you, in ignorance to run about with the Shell on your head, exclaiming to the world of the ignorance of your late Teachers? I say not that you do so; But the Quakers whom you approve of do so, and much more.

I pray you tell me, Did you ever study well what Paul meant. 1 Tim. 3. 5. where he requireth that he that is Ordained should [not be a Novice, lest being lifted up with pride he fall into the Condemnation of the devil;] The Word translated a Novice signifieth a New Plant, a late Convert, or new or young Christian; You see here that such are in most danger of being lifted up with pride, and why so? but because 1. They have not yet knowledge enough to acquaint them with their ignorance and great weaknesses. 2. Nor have they yet grown to a just degree of humility and other establishing preserving graces; You see also that to fall into Pride, is to fall into the condemnation of the devil.

You know sure that it is no wrong to you to say that you are but a Novice or raw Christian, for it is but a few years since you came out of utter ignorance and carnality; and therefore that you have reason to be very watchful against this sin, yea, by the evidence that you give in against your selves, you might see that you are too far ensnared in it already.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/richard-baxter.html">Richard Baxter</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Quakers catechism, or, The Quakers questioned, their questions answered, and both published for the sake of those of them that have not yet sinned unto death and of those ungrounded novices that are most in danger of their seduction</cite>, (London: Thomas Underhill and Francis Tyton, 1655), unpaginated.</span></figcaption>

<blockquote><p>…and their fear toward me is taught by the precept of men: therefore, behold, I will proceed to do a marvellous work among the people, even a marvellous work and a wonder; for the wisdom of their wise men shall perish, and the understanding of their prudent men shall be hid” (Isa. 29:13-14). And in another place, “But in vain do they worship Me, teaching for doctrines the commandments of men” (Mt. 15:9)… pious princes are repeatedly praised (2 Kings 22:1, etc.) for acting according to all his precepts, and not declining either to the right hand or the left. I go further: although there be no open manifestation of impiety in fictitious worship, it is strictly condemned by the Spirit, inasmuch as it is a departure from the command of God… And the more clearly the will of God has been manifested to us, the less excusable is our petulance in attempting anything.</p></blockquote>

</figure><figure class="quote" id="q-34b5e65b7d" data-kw="against invocation of saints">
<blockquote><p>The question is not whether the saints piously dying in the Lord are to be held in any respect and honor. We do not deny that they are to be honored by us according to the degree of their excellence, both by thinking highly of them as servants of God most happy and admitted into the fellowship of the Lord and by cherishing their memory with a grateful and pleasant recollection, extolling their conflicts and victories, preserving their doctrine, celebrating and imitating their virtues (Heb. 12:1), praising God in and for them. Rather the question is whether they are to be reverenced with religious worship properly so called. This our opponents wish; we deny.</p></blockquote>

<blockquote><p>Whenever therefore men prefer their own inventions to the ordinances and commandments of God, they openly despise God, to whose will they ought to have yielded. This is especially the case when there is added such obstinate hardness of heart as shuts the door against holy warnings, and it is vain for them to allege that they cannot displease God by doing that which they undertake for the purpose of worshipping him; for all that men, by neglecting the word, choose and follow, the Lord rejects and abhors.</p></blockquote>

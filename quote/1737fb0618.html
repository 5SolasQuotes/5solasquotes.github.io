</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-508fcbbc57" data-kw="">
<blockquote><p>2. He that is justified falls into daily transgressions, therefore there must be a daily imputation and application of the death of Christ, Jn. 13:10. 3. There is a high act of justification after great and eminent falls, though there be not an intercission, yet there is a sequestration, such cannot then plead their right. (A leper could not make use of his house, though he had a right to it.) David’s sin of adultery and murder made a great breach upon his justification, therefore he prays God, Ps. 51, to purge him with hyssop, to apply anew the blood of Christ.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/edward-leigh.html">Edward Leigh</a></span><span class="wk"><span class="lbl">Work:</span> <cite>A System or Body of Divinity… (London, A.M., 1654), bk. 7, ch. 6. Of Justification</cite>, p. 515</span></figcaption>

<blockquote><p>We must here observe, that not only are corrupt and disordered inclinations sins, but the thinking of evil, in as far as it is connected with an inclination and propensity to pursue it, or with a desire to practice it, is sin.</p></blockquote>

</figure><figure class="quote" id="q-b2e530e092" data-kw="">
<blockquote><p>If he take vincible, as opposed to invincible ignorance, he Popishly then says that the Scripture offers to us many things whereof we may be invincibly ignorant. Now invincible ignorance, Protestants acknowledge only in matters of fact, or of gospel-truths never so much as in the letter revealed, as heathens may be invincibly ignorant of Christ, and their ignorance not be sinful, as John 15:22, and Jacob was invincibly ignorant in lying with Leah instead of Rachel. There can be no such vincibleness, or invincibleness, in an heretic that hears the Gospel, for whoever hear the Gospel and yet remain ignorant, their ignorance is not invincible, Nulla est invincibilis ignorantia juris [Nothing is invincible ignorance in law].</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/samuel-rutherford.html">Samuel Rutherford</a></span><span class="wk"><span class="lbl">Work:</span> <cite>A Free Disputation Against Pretended Liberty of Conscience… (1649)</cite>, p. 343</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/sin/concupiscence.html">Concupiscence</a></span></div>
<div class="actions"><button class="copy" data-copy="“If he take vincible, as opposed to invincible ignorance, he Popishly then says that the Scripture offers to us many things whereof we may be invincibly ignorant. Now invincible ignorance, Protestants acknowledge only in matters of fact, or of gospel-truths never so much as in the letter revealed, as heathens may be invincibly ignorant of Christ, and their ignorance not be sinful, as John 15:22, and Jacob was invincibly ignorant in lying with Leah instead of Rachel. There can be no such vincibleness, or invincibleness, in an heretic that hears the Gospel, for whoever hear the Gospel and yet remain ignorant, their ignorance is not invincible, Nulla est invincibilis ignorantia juris [Nothing is invincible ignorance in law].”

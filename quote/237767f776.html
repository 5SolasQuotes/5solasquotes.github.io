<blockquote><p>Thesis 10. And it also follows from this that the word ‘to be justified’ in this argument in no way should be thus understood as if that righteousness of Christ were infused into us. Rather, it is thus declared that, having seized Christ Himself together with His righteousness by faith, we are absolved from all our sins and death, and through the one same Christ Himself we are declared worthy of eternal life in the one same Christ. But one also speaks of a wider meaning of the term ‘righteousness’, as about that most perfect, which is subjectively in Christ alone according to the flesh and which alone, imputed to us by faith, pacifies our consciences before the tribunal of God. This concerning holiness within us is applied and inchoate in another gift of God. Thus, if ‘justification’ is taken as the free application of the latter rather than the former benefit, Christ having been seized by faith, we do not deny that the term ‘justification’ is comprehended as much as that benefit of that imputed and most perfect righteousness as the benefit of sanctification inchoate in us is. Yet we say that careful and painstaking care must be applied in order that one may not be confounded with the other and that we may know that the part first in order pleases and is accepted by God on account of Christ and in Christ alone is seized by faith, and that second gift of regeneration follows later.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/theodore-beza.html">Theodore Beza</a></span><span class="wk"><span class="lbl">Work:</span> <cite>‘Theses Written Out in Full with the Unanimous Consent of the Pastors of the Swiss Churches by the Authority of the Very Distinguished Senate of Bern in the General Synod on AD April 23, 1588’ in Justification by Faith Alone: Selected Writings from Theodore Beza (1519-1605), Amandus Polanus (1561-1610), Francis Turretin (1623-1687), trans. Casey Carmichael in Classic Reformed Theology (RHB, 2023)</cite>, pp. 113-14</span></figcaption>

</figure><figure class="quote" id="q-f6b0d135b8" data-kw="">
<blockquote><p>So in treating of our restoration, Paul intimates in close connection issuing from our very justification before God–provided conviction of it is ours–the immediate presence in believers of the Spirit, the fashioner of all the righteousness we are to display in our lives. Hence he never uses the word ‘justify’ in this way without appearing to speak no less of this imparting of true righteousness than of the round and head of our entire salvation, the forgiveness of sins. In chapter 3 (verse 25) [of Romans] after saying that righteousness is revealed in the era of the unveiling of the gospel, that is to say, is so clearly manifested in the lives of believers that the world now acknowledges these alone to be capable of true righteousness, and after saying secondly, that Christ came to introduce to the world an endeixis, a demonstration of divine righteousness unmistakable to all, he then added, ‘that God himself might be righteous, and the justifier of him who has faith in Jesus Christ’. Here without a doubt he includes at the same time in the word ‘justify’ that righteousness which God produces by his Spirit in those who believe in Christ, and which he intends to be his attestation to the effect that he has now forgiven their sins and counts them among those he resolved to justify, that is, to count among the righteous not only by pardoning their sin but also by conforming them to the image of his Son. The apostle always speaks about our justification in this fashion, never failing to comprehend the summit of our salvation, for which he prayed for the Philippians as follows: ‘It is my prayer that your love may abound more and more in knowledge and all aesthesis (that is, a quality of discernment) whereby you may be able to approve with certainty what is excellent, and to this end, that you may be pure and give offence to no one, thus being equipped for the day of Christ, and filled with the fruits of righteousness which are produced through Jesus Christ to the glory and praise of God.’ [1:9-11] Consequently, since Paul is accustomed to speaking in this way, denoting by the word ‘justification’ first of course the remission of sins, yet at the same time always indicating in addition that imparting of righteousness which God proceeds to work in us by the Spirit, the same Spirit by whom he grants us assurance of the pardon of our sins and of his goodwill towards us, and whom he has established the seal (sphragis) of that pardon–because, I say, Paul customarily speaks in these terms, the majority of the holy Fathers, bearing in mind no doubt the more visible aspect of justification, have taken dikaiousthai, ‘to be justified’, in the sense of ‘to be made righteous… It goes without saying that however great a degree of righteousness the Spirit of Christ might effect in us when we believe, it will nonetheless [not?] be sufficient to merit our being regarded as righteous in God’s sight, for we remain unprofitable servants even when we have fulfilled all his bidding. It was with this in mind that Philip Melanchthon in his highly erudite and devout Commentary on this Epistle rightly condemns those who want to make, “We are justified by faith,’ mean, “Faith is the source or cause that produces other virtues for whose sake we are pronounced righteous,’ or ‘Faith itself is in us a virtue, deserving of God’s approval.’ And he subjoins these godly words: ‘“We are justified by faith,” should be transposed in[to] this sentence: “We are reckoned righteous by mercy.” Similarly, “we are justified by faith alone” means, “We are pronounced righteous by trusting in mercy alone”–so it is only for us to add, ‘as we are given the assurance that we are so pronounced, and thus know by experience this merciful favour of God.’ Surely no godly soul can doubt for a moment that it is through God’s mercy alone and for the sake of Christ’s merit alone that we are justified, pronounced righteous before God, and not because of anything in us at all, however many works of holiness, however genuine our fruits of the Spirit. For who is ignorant of the Scripture, ‘Enter not into judgment with thy servant, for no man living will be justified before thee’? [Ps. 143:2] And in Isaiah, ‘In the Lord shall all the seed of Israel be justified and praised’. [Isa. 45:25]</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/martin-bucer.html">Martin Bucer</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Common Places, pp. 162–64 in Steven Wedgeworth, ‘Bucer on Double Justification’ (2008) at Wedgewords</cite></span></figcaption>

that+is%2C+a+quality+of+discernment%29+whereby+you+may+be+able+to+approve+with+certainty+what+is+excellent%2C+and+to+this+end%2C+that+you+may+be+pure+and+give+offence+to+no+one%2C+thus+being+equipped+for+the+day+of+Christ%2C+and+filled+with+the+fruits+of+righteousness+which+are+produced+through+Jesus+Christ+to+the+glory+and+praise+of+God.%E2%80%99+%5B1%3A9-11%5D+Consequently%2C+since+Paul+is+accustomed+to+speaking+in+this+way%2C+denoting+by+the+word+%E2%80%98justification%E2%80%99+first+of+course+the+remission+of+sins%2C+yet+at+the+same+time+always+indicating+in+addition+that+imparting+of+righteousness+which+God+proceeds+to+work+in+us+by+the+Spirit%2C+the+same+Spirit+by+whom+he+grants+us+assurance+of+the+pardon+of+our+sins+and+of+his+goodwill+towards+us%2C+and+whom+he+has+established+the+seal+%28sphragis%29+of+that+pardon%E2%80%93because%2C+I+say%2C+Paul+customarily+speaks+in+these+terms%2C+the+majority+of+the+holy+Fathers%2C+bearing+in+mind+no+doubt+the+more+visible+aspect+of+justification%2C+have+taken+dikaiousthai%2C+%E2%80%98to+be+justified%E2%80%99%2C+in+the+sense+of+%E2%80%98to+be+made+righteous%E2%80%A6+It+goes+without+saying+that+however+great+a+degree+of+righteousness+the+Spirit+of+Christ+might+effect+in+us+when+we+believe%2C+it+will+nonetheless+%5Bnot%3F%5D+be+sufficient+to+merit+our+being+regarded+as+righteous+in+God%E2%80%99s+sight%2C+for+we+remain+unprofitable+servants+even+when+we+have+fulfilled+all+his+bidding.+It+was+with+this+in+mind+that+Philip+Melanchthon+in+his+highly+erudite+and+devout+Commentary+on+this+Epistle+rightly+condemns+those+who+want+to+make%2C+%E2%80%9CWe+are+justified+by+faith%2C%E2%80%99+mean%2C+%E2%80%9CFaith+is+the+source+or+cause+that+produces+other+virtues+for+whose+sake+we+are+pronounced+righteous%2C%E2%80%99+or+%E2%80%98Faith+itself+is+in+us+a+virtue%2C+deserving+of+God%E2%80%99s+approval.%E2%80%99+And+he+subjoins+these+godly+words%3A+%E2%80%98%E2%80%9CWe+are+justified+by+faith%2C%E2%80%9D+should+be+transposed+in%5Bto%5D+this+sentence%3A+%E2%80%9CWe+are+reckoned+righteous+by+mercy.%E2%80%9D+Similarly%2C+%E2%80%9Cwe+are+justified+by+faith+alone%E2%80%9D+means%2C+%E2%80%9CWe+are+pronounced+righteous+by+trusting+in+mercy+alone%E2%80%9D%E2%80%93so+it+is+only+for+us+to+add%2C+%E2%80%98as+we+are+given+the+assurance+that+we+are+so+pronounced%2C+and+thus+know+by+experience+this+merciful+favour+of+God.%E2%80%99+Surely+no+godly+soul+can+doubt+for+a+moment+that+it+is+through+God%E2%80%99s+mercy+alone+and+for+the+sake+of+Christ%E2%80%99s+merit+alone+that+we+are+justified%2C+pronounced+righteous+before+God%2C+and+not+because+of+anything+in+us+at+all%2C+however+many+works+of+holiness%2C+however+genuine+our+fruits+of+the+Spirit.+For+who+is+ignorant+of+the+Scripture%2C+%E2%80%98Enter+not+into+judgment+with+thy+servant%2C+for+no+man+living+will+be+justified+before+thee%E2%80%99%3F+%5BPs.+143%3A2%5D+And+in+Isaiah%2C+%E2%80%98In+the+Lord+shall+all+the+seed+of+Israel+be+justified+and+praised%E2%80%99.+%5BIsa.+45%3A25%5D%E2%80%9D%0A%0A%E2%80%94+Martin+Bucer%2C+Common+Places%2C+pp.+162%E2%80%9364+in+Steven+Wedgeworth%2C+%E2%80%98Bucer+on+Double+Justification%E2%80%99+%282008%29+at+Wedgewords&amp;url=https%3A%2F%2F5solasquotes.github.io%2Fquote%2Ff6b0d135b8.html&amp;via=5Solas" target="_blank" rel="noopener">Share on X</a><a class="perma" href="../quote/f6b0d135b8.html">Permalink</a><a class="src" href="https://reformedbooksonline.com/on-a-twofold-justification/#:~:text=So%20in%20treating%20of%20our%20restoration%2C,be%20justified%20and%20praised%E2%80%99.%20%5BIsa.%2045%3A25%5D" rel="noopener" target="_blank">Read it online · Reformed Books Online</a></div>

<blockquote><p>The sum of my doctrine which I bring them [Scriptures] to confirm, I contract into these heads. 1. That faith justifies not as an instrumental efficient cause, but as conditio applicans et disponens, the applying and disposing condition: its applicatory nature being the aptitude to the office, and its being the condition of the promise being the formal or nearest reason of its interest. 2. That repentance is conditio disponens, a dispositive condition of our first justification. 3. That Covenant-keeping by sincere love, thankfulness and obedience to God▪ Redeemer is a condition of the continuing, or not-losing our state of justification. 4. That the renewal of our faith and repentance, upon our lapses into discerned wounding sins, is a condition of the particular pardon of those sins, and our discharge or justification from the guilt of them. 5. That all the foresaid conditions, faith, repentance, love, thankfulness, sincere obedience, together with final perseverance, do make up the condition of our final absolution in judgment, and our eternal glorification. 6. That in the Day of Judgement, seeing we must be Judged by the Gospel or New Covenant, and it will be no small part of the work of the day to enquire whether we have performed the conditions of that Covenant which gives us Christ, and life and pardon, or not; we must therefore against the accusation of non-performance (real or supposed) be justified by our own performance as our particular righteousness: and this is the judging or jusiifying us according to our works, which Scripture mentions. And upon this will our universal and final justification depend, as upon its condition. And therefore whoever will be justified at that day, must have a Justitia prolegalis or a righteousness of remission of sin through the blood of Christ, to plead against the Law, and also a personal evangelical righteousness, consisting in a performance of the conditions of the Gospel or new Covenant, which is the condition of our interest in the first; or else he cannot be justified (yet is this latter but subordinate to the former, as to that sentential absolution). 7. Seeing this twofold righteousness is necessary to our justification in judgment, therefore it must needs follow that it is necessary to the making us righteous, or our constitutive justification in this life (in the order before laid down): For the Law is the rule of judgment; and God judges men to be as they are; and therefore He makes them righteous, both by remission of all sin and by giving them to perform the conditions of the New Covenant, before He judge them so.</p></blockquote>

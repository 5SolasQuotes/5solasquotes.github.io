<blockquote><p>The improper binder [of the conscience] is that which has no power or virtue in itself to bind conscience: but does it only by virtue of God’s Word or of some part of it. It is threefold: human laws, an oath, a promise.</p></blockquote>

</figure><figure class="quote" id="q-057c8549ea" data-kw="">
<blockquote><p>Besides the moral law, God gave to Israel ceremonial and judicial laws; the two latter are of limited and temporary use; the former is of universal and perpetual obilgation. … 2. The judicial law respected the Jews in their political capacity, or as a nation, and consisted of those institutions which God prescribed to them for their civil government. This law, as far as the Jewish polity was peculiar, has also been entirely abolished; but as far as it contains any statute founded in the law of nature common to all nations, it is still obligatory.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/robert-shaw.html">Robert Shaw</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Commentary on the Confession of Faith</cite>, 19.4</span></figcaption>

</figure><figure class="quote" id="q-1926b08cf8" data-kw="">
<blockquote><p>I respond [to an Arminian]: Be it so, that the precept “Repent and believe the Gospel” binds all and every man; be it so, that that precept is proclaimable to all men by the will of God; yet since in fact it is not announced to all, and that by a special dispensation of God, such are excused by invincible ignorance, so that they do not exercise supernatural acts concerning supernatural objects. For invincible ignorance on this part rightly excuses. For positive precepts do not bind those to whom they are not promulgated. And therefore, such a one, as he can have no knowledge of any obligation, so he can be conscious to himself of no prevarication. (See Puteanus on pt. 1 of 2, q. 90, art. 4, concl. 1). 2… But for something to be imputed to a man as a fault, it must in some way be avoidable, voluntary, and known.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/samuel-ward.html">Samuel Ward</a></span><span class="wk"><span class="lbl">Work:</span> <cite>‘Negative Infidelity</cite>, [of the Gospel] Condemns No One [due to Invincible Ignorance]’ in Theological Determinations in Works of Samuel Ward, ed. Seth Ward (d. 1643; Gallibrand, 1658), pp. 55-56</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/civil-government-and-society/natural-law-and-civil-law.html">Natural Law and Civil Law</a></span></div>
<div class="actions"><button class="copy" data-copy="“I respond [to an Arminian]: Be it so, that the precept “Repent and believe the Gospel” binds all and every man; be it so, that that precept is proclaimable to all men by the will of God; yet since in fact it is not announced to all, and that by a special dispensation of God, such are excused by invincible ignorance, so that they do not exercise supernatural acts concerning supernatural objects. For invincible ignorance on this part rightly excuses. For positive precepts do not bind those to whom they are not promulgated. And therefore, such a one, as he can have no knowledge of any obligation, so he can be conscious to himself of no prevarication. (See Puteanus on pt. 1 of 2, q. 90, art. 4, concl. 1). 2… But for something to be imputed to a man as a fault, it must in some way be avoidable, voluntary, and known.”

 it online · Reformed Books Online</a></div>
</figure><figure class="quote" id="q-6e117aa3e3" data-kw="">
<blockquote><p>Order is an excellent means of edification and of preserving truth, charity and peace, but it is but a means to the ends of the things ordered and the public good. Therefore if order should be made the advantage of heresy, Church-tyranny or iniquity, and be turned against the good of Church and souls (as it is in the policy of the Roman Church and in well ordered armies of rebels or such as have unlawful wars), this would make it no schism or sin to break such order.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/richard-baxter.html">Richard Baxter</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Nonconformists’ Plea for Peace, or an Account of their Judgment in Certain Things in which they are Misunderstood</cite>, … (London, 1679), sect. 6, p. 58</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/civil-government-and-society/natural-law-and-civil-law.html">Natural Law and Civil Law</a></span></div>

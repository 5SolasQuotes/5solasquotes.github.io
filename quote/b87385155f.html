<blockquote><p>Divines hold absolutely that inter duo vel plura mala culpae [between two or more culpable evils] (such as things scandalous and inconvenient) nullum est eligendum [none are to be chosen]. (Alsted, Theol. Cas., ch. 12, p. 199) That though in evils of punishment we may choose a lesser to shun a greater, yet in evils of fault, election [choosing] has no place, neither may we do a lesser fault to shun a greater: nec ullum admittendum malum, ut eveniat aliquod bonum, sive per se sive per accidens. [Neither ought any evil to be accepted so that it may bring forth some good, either through it or by the occasion of it.] (Paraeus on Rom. 3:8)</p></blockquote>

</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-dc3463036d" data-kw="">
<blockquote><p>This example illustrates how an entity can count as an instance of a certain type of thing even if it fails perfectly to instantiate the essence of that type of thing; a badly drawn triangle is not a non-triangle, but rather a defective triangle. It illustrates at the same time how there can be a completely objective, factual standard of goodness and badness, better and worse. To be sure, the standard in question in this example is not a moral standard. But from an Aristotelian-Thomistic point of view, it illustrates a general notion of goodness of which moral goodness is a special case. What is true of animals in general is true of human beings. Like the other, non-rational animals, we have various ends inherent in our nature, and these determine what is good for us. In particular, Aquinas tells us, “all those things to which man has a natural inclination, are naturally apprehended by reason as being good, and consequently as objects of pursuit, and their contraries as evil, and objects of avoidance” (Summa Theologiae I-II.94.2). It is crucial not to misunderstand the force of Aquinas’s expression “natural inclination” here. By “inclination” he does not necessarily mean something consciously desired, and by “natural” he doesn’t mean something merely psychologically deep-seated, or even, necessarily, something genetically determined. What he has in mind is rather the natural teleology of our capacities, their inherent “directedness” toward certain ends. Of course, there is often a close correlation between what nature intends and what we desire… Desires are nature’s way of prodding us to do what is good for us, but like everything else in the natural order, they are subject to various imperfections and distortions… …’Natural’ for the Aristotelian-Thomistic philosopher does not mean merely “deeply ingrained,” “in accordance with the laws of physics,” “having a genetic basis,”… It has instead to do with the final causes inherent in a thing by virtue of its essence, and which it possesses whether or not it ever realizes them or consciously wants to realize them. What is genuinely good for someone, accordingly, may in principle be something he or she does not consciously want, like children who refuse to eat their vegetables, or an addict convinced that it would be bad to stop taking drugs. For the “old” natural law theory, knowing what is truly good for us requires taking an external, objective, “third-person” point of view on our- selves rather than a subjective “first-person” view; it is a matter of determining what fulfills our nature, not our contingent desires. Aquinas identifies three general categories of goods inherent in our nature. First are those we share with all living things, such as the preservation of our existence. Second are those common to animals specifically, such as sexual intercourse and the child-rearing activities that naturally follow upon it. Third are those peculiar to us as rational animals, such as “to know the truth about God, and to live in society,” “to shun ignorance,” and “to avoid offending those among whom one has to live” (Summa Theologiae I-II.94.2). These goods are ordered in a hierarchy corresponding to the traditional Aristotelian hierarchy of living things (viz. the vegetative, sensory, and rational forms of life, respectively). The higher goods presuppose the lower ones; for example, one cannot pursue truth if one is not able to conserve oneself in existence. But the lower goods are subordinate to the higher ones in the sense that they exist for the sake of the higher ones. The point of fulfilling the vegetative and sensory aspects of our nature is, ultimately, to allow us to fulfill the defining rational aspect of our nature. Now these various goods have moral significance for us because, unlike other animals, we are capable of intellectually grasping what is good and freely choosing whether or not to pursue it. And that brings us from “natural goodness” (as Foot calls it) to natural law. Aquinas famously held that the fundamental principle of natural law is that “good is to be done and pursued, and evil is to be avoided. All other precepts of the natural law are based upon this,” where the content of those precepts is determined by the goods falling under the three main categories just mentioned (Summa Theologiae I-II.94.2)… Properly understood, however, Aquinas’s principle is not only not difficult to justify, but is so obviously correct that it might seem barely worth asserting. Aquinas is not saying that it is self-evident that we ought to be morally good. Rather, he is saying that it is self-evident that whenever we act we pursue something that we take to be good in some way and/or avoid what we take to be in some way evil or bad. And he is clearly right. Even someone who does what he believes to be morally bad does so only because he is seeking something he takes to be good in the sense of worth pursuing… …For like every other natural phenomenon, practical reason has a natural end or goal toward which it is ordered, and that end or goal is just whatever it is the intellect perceives to be good or worth pursuing. Now given what has already been said, human beings, like everything else in nature, have various capacities and ends the fulfillment of which is good for them and the frustrating of which is bad, as a matter of objective fact. A rational intellect apprised of the facts will therefore perceive that it is good to realize these ends and bad to frustrate them. It follows, then, that a rational person will pursue the realization of these ends and avoid their frustration. In short, practical reason is directed by nature toward the pursuit of what the intellect perceives to be good; what is in fact good is the realization of the various ends inherent in human nature; and thus a rational and correctly informed person will perceive this and, accordingly, direct his actions towards the realization or fulfillment of those ends. In this sense, good action is just that which is “in accord with reason” (Summa Theologiae I-II.21.1; cf. Summa Theologiae I-II.90.1), and the moral skeptic’s question “Why should I do what is good?” has an obvious answer: Because to be rational just is (in part) to do what is good, to fulfill the ends set for us by nature. Natural law ethics as a body of substantive moral theory is the formulation of general moral principles on the basis of an analysis of the various human capacities and ends and the systematic working out of their implications. So, to take just one example, when we consider that human beings have intellects and that the natural end or function of the intellect is to grasp the truth about things, it follows that it is good for us—it fulfills our nature—to pursue truth and avoid error… …But that (2) ‘I do want what is good for me’ is something true of all of us by virtue of our nature as human beings, and is in any case self-evident, being just a variation on Aquinas’s fundamental principle of natural law. These premises yield the conclusion (3) I ought to pursue what realizes my natural ends and avoid what frustrates them… it cannot be otherwise given our nature. Not only the content of our moral obligations but their obligatory force are thus determined by natural teleology. As the Neo-Scholastic natural law theorist Michael Cronin (whose account of obligation has influenced my own presentation) writes, ‘In the fullest sense of the word, then, moral duty is natural. For not only are certain objects natural means to man’s final end, but our desire of that end is natural also, and, therefore, the necessity of the means is natural’…</p></blockquote>

o+do+what+is+good+for+us%2C+but+like+everything+else+in+the+natural+order%2C+they+are+subject+to+various+imperfections+and+distortions%E2%80%A6+%E2%80%A6%E2%80%99Natural%E2%80%99+for+the+Aristotelian-Thomistic+philosopher+does+not+mean+merely+%E2%80%9Cdeeply+ingrained%2C%E2%80%9D+%E2%80%9Cin+accordance+with+the+laws+of+physics%2C%E2%80%9D+%E2%80%9Chaving+a+genetic+basis%2C%E2%80%9D%E2%80%A6+It+has+instead+to+do+with+the+final+causes+inherent+in+a+thing+by+virtue+of+its+essence%2C+and+which+it+possesses+whether+or+not+it+ever+realizes+them+or+consciously+wants+to+realize+them.+What+is+genuinely+good+for+someone%2C+accordingly%2C+may+in+principle+be+something+he+or+she+does+not+consciously+want%2C+like+children+who+refuse+to+eat+their+vegetables%2C+or+an+addict+convinced+that+it+would+be+bad+to+stop+taking+drugs.+For+the+%E2%80%9Cold%E2%80%9D+natural+law+theory%2C+knowing+what+is+truly+good+for+us+requires+taking+an+external%2C+objective%2C+%E2%80%9Cthird-person%E2%80%9D+point+of+view+on+our-+selves+rather+than+a+subjective+%E2%80%9Cfirst-person%E2%80%9D+view%3B+it+is+a+matter+of+determining+what+fulfills+our+nature%2C+not+our+contingent+desires.+Aquinas+identifies+three+general+categories+of+goods+inherent+in+our+nature.+First+are+those+we+share+with+all+living+things%2C+such+as+the+preservation+of+our+existence.+Second+are+those+common+to+animals+specifically%2C+such+as+sexual+intercourse+and+the+child-rearing+activities+that+naturally+follow+upon+it.+Third+are+those+peculiar+to+us+as+rational+animals%2C+such+as+%E2%80%9Cto+know+the+truth+about+God%2C+and+to+live+in+society%2C%E2%80%9D+%E2%80%9Cto+shun+ignorance%2C%E2%80%9D+and+%E2%80%9Cto+avoid+offending+those+among+whom+one+has+to+live%E2%80%9D+%28Summa+Theologiae+I-II.94.2%29.+These+goods+are+ordered+in+a+hierarchy+corresponding+to+the+traditional+Aristotelian+hierarchy+of+living+things+%28viz.+the+vegetative%2C+sensory%2C+and+rational+forms+of+life%2C+respectively%29.+The+higher+goods+presuppose+the+lower+ones%3B+for+example%2C+one+cannot+pursue+truth+if+one+is+not+able+to+conserve+oneself+in+existence.+But+the+lower+goods+are+subordinate+to+the+higher+ones+in+the+sense+that+they+exist+for+the+sake+of+the+higher+ones.+The+point+of+fulfilling+the+vegetative+and+sensory+aspects+of+our+nature+is%2C+ultimately%2C+to+allow+us+to+fulfill+the+defining+rational+aspect+of+our+nature.+Now+these+various+goods+have+moral+significance+for+us+because%2C+unlike+other+animals%2C+we+are+capable+of+intellectually+grasping+what+is+good+and+freely+choosing+whether+or+not+to+pursue+it.+And+that+brings+us+from+%E2%80%9Cnatural+goodness%E2%80%9D+%28as+Foot+calls+it%29+to+natural+law.+Aquinas+famously+held+that+the+fundamental+principle+of+natural+law+is+that+%E2%80%9Cgood+is+to+be+done+and+pursued%2C+and+evil+is+to+be+avoided.+All+other+precepts+of+the+natural+law+are+based+upon+this%2C%E2%80%9D+where+the+content+of+those+precepts+is+determined+by+the+goods+falling+under+the+three+main+categories+just+mentioned+%28Summa+Theologiae+I-II.94.2%29%E2%80%A6+Properly+understood%2C+however%2C+Aquinas%E2%80%99s+principle+is+not+only+not+difficult+to+justify%2C+but+is+so+obviously+correct+that+it+might+seem+barely+worth+asserting.+Aquinas+is+not+saying+that+it+is+self-evident+that+we+ought+to+be+morally+good.+Rather%2C+he+is+saying+that+it+is+self-evident+that+whenever+we+act+we+pursue+something+that+we+take+to+be+good+in+some+way+and%2For+avoid+what+we+take+to+be+in+some+way+evil+or+bad.+And+he+is+clearly+right.+Even+someone+who+does+what+he+believes+to+be+morally+bad+does+so+only+because+he+is+seeking+something+he+takes+to+be+good+in+the+sense+of+worth+pursuing%E2%80%A6+%E2%80%A6For+like+every+other+natural+phenomenon%2C+practical+reason+has+a+natural+end+or+goal+toward+which+it+is+ordered%2C+and+that+end+or+goal+is+just+whatever+it+is+the+intellect+perceives+to+be+good+or+worth+pursuing.+Now+given+what+has+already+been+said%2C+human+beings%2C+like+everything+else+in+nature%2C+have+various+capacities+and+ends+the+fulfillment+of+which+is+good+for+them+and+the+frustrating+of+which+is+bad%2C+as+a+matter+of+objective+fact.+A+rational+intellect+apprised+of+the+facts+will+therefore+perceive+that+it+is+good+to+realize+these+ends+and+bad+to+frustrate+them.+It+follows%2C+then%2C+that+a+rational+person+will+pursue+the+realization+of+these+ends+and+avoid+their+frustration.+In+short%2C+practical+reason+is+directed+by+nature+toward+the+pursuit+of+what+the+intellect+perceives+to+be+good%3B+what+is+in+fact+good+is+the+realization+of+the+various+ends+inherent+in+human+nature%3B+and+thus+a+rational+and+correctly+informed+person+will+perceive+this+and%2C+accordingly%2C+direct+his+actions+towards+the+realization+or+fulfillment+of+those+ends.+In+this+sense%2C+good+action+is+just+that+which+is+%E2%80%9Cin+accord+with+reason%E2%80%9D+%28Summa+Theologiae+I-II.21.1%3B+cf.+Summa+Theologiae+I-II.90.1%29%2C+and+the+moral+skeptic%E2%80%99s+question+%E2%80%9CWhy+should+I+do+what+is+good%3F%E2%80%9D+has+an+obvious+answer%3A+Because+to+be+rational+just+is+%28in+part%29+to+do+what+is+good%2C+to+fulfill+the+ends+set+for+us+by+nature.+Natural+law+ethics+as+a+body+of+substantive+moral+theory+is+the+formulation+of+general+moral+principles+on+the+basis+of+an+analysis+of+the+various+human+capacities+and+ends+and+the+systematic+working+out+of+their+implications.+So%2C+to+take+just+one+example%2C+when+we+consider+that+human+beings+have+intellects+and+that+the+natural+end+or+function+of+the+intellect+is+to+grasp+the+truth+about+things%2C+it+follows+that+it+is+good+for+us%E2%80%94it+fulfills+our+nature%E2%80%94to+pursue+truth+and+avoid+error%E2%80%A6+%E2%80%A6But+that+%282%29+%E2%80%98I+do+want+what+is+good+for+me%E2%80%99+is+something+true+of+all+of+us+by+virtue+of+our+nature+as+human+beings%2C+and+is+in+any+case+self-evident%2C+being+just+a+variation+on+Aquinas%E2%80%99s+fundamental+principle+of+natural+law.+These+premises+yield+the+conclusion+%283%29+I+ought+to+pursue+what+realizes+my+natural+ends+and+avoid+what+frustrates+them%E2%80%A6+it+cannot+be+otherwise+given+our+nature.+Not+only+the+content+of+our+moral+obligations+but+their+obligatory+force+are+thus+determined+by+natural+teleology.+As+the+Neo-Scholastic+natural+law+theorist+Michael+Cronin+%28whose+account+of+obligation+has+influenced+my+own+presentation%29+writes%2C+%E2%80%98In+the+fullest+sense+of+the+word%2C+then%2C+moral+duty+is+natural.+For+not+only+are+certain+objects+natural+means+to+man%E2%80%99s+final+end%2C+but+our+desire+of+that+end+is+natural+also%2C+and%2C+therefore%2C+the+necessity+of+the+means+is+natural%E2%80%99%E2%80%A6%E2%80%9D%0A%0A%E2%80%94+Edward+Feser%2C+Neo-Scholastic+Essays+%28South+Bend%2C+IN%3A+St.+Augustine%E2%80%99s+Press%2C+2015%29%2C+ch.+16%2C+%E2%80%98In+Defense+of+the+Perverted+Faculty+Argument%E2%80%99%2C+pp.+383-87&amp;url=https%3A%2F%2F5solasquotes.github.io%2Fquote%2Fdc3463036d.html&amp;via=5Solas" target="_blank" rel="noopener">Share on X</a><a class="perma" href="../quote/dc3463036d.html">Permalink</a><a class="src" href="https://reformedbooksonline.com/topics/ethics#:~:text=This%20example%20illustrates%20how%20an%20entity,necessity%20of%20the%20means%20is%20natural&amp;text=This%20example%20illustrates%20how%20an%20entity%20can%20count&amp;text=therefore%2C%20the%20necessity%20of%20the%20means%20is%20natural" rel="noopener" target="_blank">Read it online · Reformed Books Online</a></div>

</figure><figure class="quote" id="q-260ed823a9" data-kw="">
<blockquote><p>When you accommodate your boss’s unnecessary restrictions at work for the greater good, are you sacrificing God’s divine-right of governance over you and you are guilty of your boss’s errors? Are you divinely obliged to suffer the consequences of getting fired and hazarding your family’s survival every time your company wants you to do something not fully in accord with God-prescribed, right reason?</p></blockquote>

</figure><figure class="quote" id="q-5468f6d032" data-kw="">
<blockquote><p>Paul and the Christians used these material, inconvenient and scandalous (in some way) ceremonies [of Moses in the New Testament] in accord with nature’s light, Christian prudence and the Word’s general rules for the greater good: “Unto the pure all things are pure” (Tit. 1:15). All this was but a light sacrifice for Paul who was willing to go much further, and did: “unto the Jews I became as a Jew, that I might gain the Jews; to them that are under the law, as under the law, that I might gain them that are under the law” (1 Cor. 9:20). He also did it to seek to avoid persecution, tumult and imprisonment (Acts 21:22–33). Or it can be done for the peace of the Church (Acts 15:19–21; 16:1–5), even in light of the presence of ignorant civil and religious authorities (such as the Jewish authorities in Jerusalem, so as not to scandalize them, even for the longterm). Onlooking Christians receiving passive scandal thereby, as undoubtedly some did, so far from suspecting, despising, judging and setting at nought (Rom. 14:3–4, 10) the Christian ministers, ought to realize that such material things and actions may be needful for ministers to do for the sake of the message of spiritual salvation. Ministers ought to teach the people the spiritual truth about these inconvenient, material ceremonies (as the early Christian officers did: Acts 15:11, 17, 32, 35) so that the ceremonies be less of a burden and the people may keep and tolerate them (Acts 15:20, 23, 28–29; 16:4) for the right reasons until they can be put aside when the necessity is alleviated, as Beza advised ministers in order to avoid the greater harm of ministerial deposition.¹ ¹ Sprint: “Beza in a case of [the threat of ministerial] deprivation advises to conform; yet before they conform he thus counsels them: That both the pastor and the flock sin not against their conscience (presupposing the purity of doctrine to be left entire): We persuade the pastors that after they have freed their conscience, both before the King’s Majesty and the bishops, by a modest (as it becomes Christians to be free from all tumult and sedition) and yet weighty protestation (according as the greatness of the case requires): they then do openly press unto their flocks those things which do tend to take away the offence arising from conformity, and do withal discreetly and peaceably give diligent endeavor for the amendment of these abuses, as the Lord shall offer occasion (and so to conform); Epistle 12, fol. 99.” Cassander Anglicanus, “Reformed Practices,” “Practice,” p. 196.</p></blockquote>

+advised+ministers+in+order+to+avoid+the+greater+harm+of+ministerial+deposition.%C2%B9+%C2%B9+Sprint%3A+%E2%80%9CBeza+in+a+case+of+%5Bthe+threat+of+ministerial%5D+deprivation+advises+to+conform%3B+yet+before+they+conform+he+thus+counsels+them%3A+That+both+the+pastor+and+the+flock+sin+not+against+their+conscience+%28presupposing+the+purity+of+doctrine+to+be+left+entire%29%3A+We+persuade+the+pastors+that+after+they+have+freed+their+conscience%2C+both+before+the+King%E2%80%99s+Majesty+and+the+bishops%2C+by+a+modest+%28as+it+becomes+Christians+to+be+free+from+all+tumult+and+sedition%29+and+yet+weighty+protestation+%28according+as+the+greatness+of+the+case+requires%29%3A+they+then+do+openly+press+unto+their+flocks+those+things+which+do+tend+to+take+away+the+offence+arising+from+conformity%2C+and+do+withal+discreetly+and+peaceably+give+diligent+endeavor+for+the+amendment+of+these+abuses%2C+as+the+Lord+shall+offer+occasion+%28and+so+to+conform%29%3B+Epistle+12%2C+fol.+99.%E2%80%9D+Cassander+Anglicanus%2C+%E2%80%9CReformed+Practices%2C%E2%80%9D+%E2%80%9CPractice%2C%E2%80%9D+p.+196.%E2%80%9D%0A%0A%E2%80%94+Travis+Fentiman%2C+%E2%80%9CEditor%E2%80%99s+Extended+Introduction%E2%80%9D+in+English+Puritans%2C+A+Refutation+of+the+Errors+of+Separatists+%281604%3B+RBO%2C+2025%29%2C+pp.+32-33&amp;url=https%3A%2F%2F5solasquotes.github.io%2Fquote%2F5468f6d032.html&amp;via=5Solas" target="_blank" rel="noopener">Share on X</a><a class="perma" href="../quote/5468f6d032.html">Permalink</a><a class="src" href="https://reformedbooksonline.com/topics/ethics#:~:text=Paul%20and%20the%20Christians%20used%20these,Anglicanus%2C%20%E2%80%9CReformed%20Practices%2C%E2%80%9D%20%E2%80%9CPractice%2C%E2%80%9D%20p.%20196&amp;text=Paul%20and%20the%20Christians%20used%20these%20material%2C%20inconvenient&amp;text=99.%E2%80%9D%20Cassander%20Anglicanus%2C%20%E2%80%9CReformed%20Practices%2C%E2%80%9D%20%E2%80%9CPractice%2C%E2%80%9D%20p.%20196" rel="noopener" target="_blank">Read it online · Reformed Books Online

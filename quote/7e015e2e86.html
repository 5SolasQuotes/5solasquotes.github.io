<main class="wrap"><figure class="quote" id="q-7e015e2e86" data-kw="">
<blockquote><p>As for the rest of the testimonies Dr. Burgess produces out of the Fathers for kneeling, I need not insist upon them for either they speak of the inward adoration of the heart, which we ought to direct unto Christ when we receive the Sacrament (and this none of us denies), or else they speak of adoring the sacrament: where by the word ‘adoration’ we may not understand any divine worship, inward or outward, but a reverence of another nature, called veneration. That this (which we deny not neither) and no more is meant by the Fathers when they speak of the adoration of the sacrament, Antonius de Dominis shows more copiously (Rep. Eccl., bk. 5, ch. 6).</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/george-gillespie.html">George Gillespie</a></span><span class="wk"><span class="lbl">Work:</span> <cite>English Popish Ceremonies</cite>, (1637), 3rd Part, ‘Against the Lawfulness of the Ceremonies’, ch. 4, ‘That the Ceremonies are Idols among Formalists themselves; &amp; that kneeling in the Lord’s Supper before the Bread &amp; Wine in the act of receiving them is formally Idolatry’, p. 79</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/the-lords-supper/preparation-celebration-reflection.html">Preparation, Celebration, Reflection</a></span></div>
<div class="actions"><button class="copy" data-copy="“As for the rest of the testimonies Dr. Burgess produces out of the Fathers for kneeling, I need not insist upon them for either they speak of the inward adoration of the heart, which we ought to direct unto Christ when we receive the Sacrament (and this none of us denies), or else they speak of adoring the sacrament: where by the word ‘adoration’ we may not understand any divine worship, inward or outward, but a reverence of another nature, called veneration. That this (which we deny not neither) and no more is meant by the Fathers when they speak of the adoration of the sacrament, Antonius de Dominis shows more copiously (Rep. Eccl., bk. 5, ch. 6).”

</figure><figure class="quote" id="q-816ed4b644" data-kw="">
<blockquote><p>5. We know the Tabernacle and Temple were corporal things made with hands and that they are things different from the spiritual things that they signify, as the sign and the thing signified; as therefore the Lord is express in the elements and rites of the Supper of the Lord, because all of them, bread, wine, taking, eating, breaking, pouring out the wine, drinking, are teaching and edifying signs; and our Lord never left it to the wisdom of men to devise signes to teach themselves: So in like manner, should the Lord expressly specify all the teaching and signifying signs in the Old Testament; and as Moses might devise none of his own, but was tied to follow the pattern which the Lord Himself showed to him in the mount: So are we now under the New Testament tied to the pattern of that same will revealed in the Word; and it is laid on us not to be wise above that which was written; and it is of perpetual equity: The supreme Lawgiver never left it to the wisdom of angels, or men, or prophet, apostle or Church, to serve and worship God as they thought good: But He Himself particularly prescribed the way, signs, and means: And because God has not been pleased in the New Testament to specify types of Christ incarnate, and come in the flesh already; therefore are we obliged in conscience to believe, and practise no more, either in doctrinals, or teaching types, or positives of Church-policy, than our pattern in the mount, the Scripture has warranted to us, to be the will of God…</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/samuel-rutherford.html">Samuel Rutherford</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Divine Right of Church Government</cite>, (1646), pp. 49-50</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/the-lords-supper/preparation-celebration-reflection.html">Preparation, Celebration, Reflection</a></span></div>

uote/816ed4b644.html">Permalink</a><a class="src" href="https://reformedbooksonline.com/topics/topics-by-subject/the-lords-supper/the-administration-of-the-lords-supper/#:~:text=5.%20We%20know%20the%20Tabernacle%20and,to%20be%20the%20will%20of%20God&amp;text=5.%20We%20know%20the%20Tabernacle%20and%20Temple%20were&amp;text=to%20us%2C%20to%20be%20the%20will%20of%20God" rel="noopener" target="_blank">Read it online · Reformed Books Online</a></div>
</figure><figure class="quote" id="q-94c732a7ae" data-kw="">
<blockquote><p>…understanding that of the prayer and communion in the sacraments, it [communicating with infidels and unbelievers] does admit exception: for notwithstanding if it were in my choice to avoid them, I ought not to join with them, yet having no authority, or no strength and power to make good the authority of separating of them, I ought not therefore to cease the service of God which is commanded. … Howbeit there is here [in 1 Cor. 5] to be considered that one which avoids such a man’s company at the table ordained for the belly, shall not therefore be bound to abstain from the Lord’s table prepared for the spiritual nourishment. Because although it be in him to deprive him from his own table, yet is it not so in his power to put him from the table of the Lord. And if the case were so that the person excommunicated were placed at your table by the prince whose authority in such a case you cannot avoid, and order taken that you should never eat but he should eat with you, I ask you herein whether you think that you should rather famish yourself than take of the same table with him. And if you esteem that you ought rather to eat of the same dish with him than pine to death, much more ought you to take at the Lord’s table with him rather than by abstaining run in danger of a spiritual famine. So that when a Christian is forbidden to forbear to eat with an excommunicated person one way or other, it is with this caution, so far forth as by abstaining from his necessary nourishment inward or outward he become not a murderer of his own person, which is so often as for the presence of the wicked (whom he is not able to decline) he hinders the good estate of himself either bodily or ghostly [spiritually]. Where if you say that these are cases supposed and which never come to practice, it is sufficient answer that they may come to practice if they never did, and therefore have the same strength of reason as if they were of continual experience. Howbeit you may consider this more apparently in a faithful woman, whose husband being excommunicated commands her to bear him company at the table. And forasmuch as the Church discipline does not overthrow the authority of the husband in his house, which is of God as well as the other, the wife is to yield unto her husband, although it be not without testimony of grief in that behalf. How much more should she so do, if her husband would be so froward as not to let her have any nourishment but at his board [table].</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/thomas-cartwright.html">Thomas Cartwright</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Other citations (work not named)</cite>, eds. Peel &amp; Carlson, Cartwrightiana (London: Halley Stewart, 1951), ‘Letter to Mrs. Stubbes his sister-in-law to persuade her from Brownism’, pp. 72-73</span></figcaption>

state+of+himself+either+bodily+or+ghostly+%5Bspiritually%5D.+Where+if+you+say+that+these+are+cases+supposed+and+which+never+come+to+practice%2C+it+is+sufficient+answer+that+they+may+come+to+practice+if+they+never+did%2C+and+therefore+have+the+same+strength+of+reason+as+if+they+were+of+continual+experience.+Howbeit+you+may+consider+this+more+apparently+in+a+faithful+woman%2C+whose+husband+being+excommunicated+commands+her+to+bear+him+company+at+the+table.+And+forasmuch+as+the+Church+discipline+does+not+overthrow+the+authority+of+the+husband+in+his+house%2C+which+is+of+God+as+well+as+the+other%2C+the+wife+is+to+yield+unto+her+husband%2C+although+it+be+not+without+testimony+of+grief+in+that+behalf.+How+much+more+should+she+so+do%2C+if+her+husband+would+be+so+froward+as+not+to+let+her+have+any+nourishment+but+at+his+board+%5Btable%5D.%E2%80%9D%0A%0A%E2%80%94+Thomas+Cartwright%2C+eds.+Peel+%26+Carlson%2C+Cartwrightiana+%28London%3A+Halley+Stewart%2C+1951%29%2C+%E2%80%98Letter+to+Mrs.+Stubbes+his+sister-in-law+to+persuade+her+from+Brownism%E2%80%99%2C+pp.+72-73&amp;url=https%3A%2F%2F5solasquotes.github.io%2Fquote%2F94c732a7ae.html&amp;via=5Solas" target="_blank" rel="noopener">Share on X</a><a class="perma" href="../quote/94c732a7ae.html">Permalink</a><a class="src" href="https://reformedbooksonline.com/topics/the-lords-supper#:~:text=understanding%20that%20of%20the%20prayer%20and,nourishment%20but%20at%20his%20board%20%5Btable&amp;text=understanding%20that%20of%20the%20prayer%20and%20communion%20in&amp;text=have%20any%20nourishment%20but%20at%20his%20board%20%5Btable" rel="noopener" target="_blank">Read it online · Reformed Books Online</a></div>

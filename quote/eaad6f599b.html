<main class="wrap"><figure class="quote" id="q-eaad6f599b" data-kw="">
<blockquote><p>…the Protestant Reformation marked a sharp break in the pattern of ecclesiastical finance wherever it took root… by the end of 1525, however, he [Martin Luther] was assuring the elector of Saxony that the revenues of the church belonged to the state, and that after proper payments to clergy, schools and charity, the surplus could be employed by the prince. Huldrych Zwingli and Martin Bucer, on the other hand, held that church property belonged to the religious community and that the secular ruler merely administered it. … The Calvinist church was more fully separated from past modes of finance than its Lutheran and Anglican counterparts… Elsewhere [other than Geneva], Calvinism was often a minority faith and had to depend on the voluntary support of its members… The Dutch Reformed Church was funded by the magistracy after several false starts in the 1570’s, but not at a particularly generous level.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/felicity-heal.html">Felicity Heal</a></span><span class="wk"><span class="lbl">Work:</span> <cite>‘Church Finances’ in The Oxford Encyclopedia of the Reformation, vol. 1</cite>, pp. 329-31</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/worship/public-worship.html">Public Worship</a></span></div>

<blockquote><p>[1.] Our brother Mr. [George] Gillespie (Assertion of the Government of the Church of Scotland, pt. 2, ch. 3, p. 141-42) says many interpreters expound [in Greek, Acts 2:44], ‘they were together’, that is, of one accord in love and amity: and also [physical] churches not being builded, and they meeting in private houses, as in Mary’s house, Acts 12, school of Tyrranus, Acts 19:9, in an upper chamber, Acts 20:8, Paul’s lodging at Rome, Acts 28:13. What private houses (Acts 10:9) could ordinarily contain so many thousands?</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/samuel-rutherford.html">Samuel Rutherford</a></span><span class="wk"><span class="lbl">Work:</span> <cite>A Peaceable &amp; Temperate Plea… (1642), ch. 7, ‘If there be No True Visible Church in the New Testament, but Only a Congregation Meeting in One Place, &amp; No Presbyterial or Representative Church (as They Call it) at All’, p. 81 Rutherford is arguing against the novel Independent Church government. See also the chapter at large.</cite></span></figcaption>

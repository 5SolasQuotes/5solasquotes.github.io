<main class="wrap"><figure class="quote" id="q-be1bfa0f0d" data-kw="">
<blockquote><p>For their very doctrine, after comparison with that of the apostles, will declare, by its own diversity and contrariety, that it had for its author neither an apostle nor an apostolic man; because, as the apostles would never have taught things which were self-contradictory, so the apostolic men would not have inculcated teaching different from the apostles, unless they who received their instruction from the apostles went and preached in a contrary manner. To this test, therefore will they be submitted for proof by those churches, who, although they derive not their founder from apostles or apostolic men (as being of much later date, for they are in fact being founded daily), yet, since they agree in the same faith, they are accounted as not less apostolic because they are akin in doctrine.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/tertullian.html">Tertullian</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Prescription Against Heretics</cite>, ch. 32</span></figcaption>

</figure><figure class="quote" id="q-373f952ee3" data-kw="">
<blockquote><p>From all such persons, therefore, it behooves us to keep aloof, but to adhere to those who, as I have already observed, do hold the doctrine of the apostles, and who, together with the order of priesthood (presbyterii ordine), display sound speech and blameless conduct for the confirmation and correction of others.</p></blockquote>

</figure><figure class="quote" id="q-cea8c0fef0" data-kw="Apostolic succession">
<blockquote><p>Here we must distinguish succession: one is personal and local, as to persons and places; another is doctrinal, as to faith. We do not deny that the latter is a mark and thus it coincides with ours. But the former (of which we treat here) cannot be a mark. (a) It is merely contingent and aside from the nature of the church, unless it is founded on unity of sound doctrine and true faith (Eph. 4:4, 5, 11, 12). … For the church is not to be sought in walls and temples, but in doctrines. The church is where true faith is. “They do not have the inheritance of Peter, who have not the faith of Peter” (Ambrose).</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/francis-turretin.html">Francis Turretin</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Institutes of Elenctic Theology</cite>, 18.13.28</span></figcaption>

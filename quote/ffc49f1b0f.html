<main class="wrap"><figure class="quote" id="q-ffc49f1b0f" data-kw="">
<blockquote><p>Every once in a while it is said that the present world war is a war of democracy against state totalitarianism. No doubt that assertion contains a considerable element of truth, but it should not be taken without several grains of salt. The fact that totalitarian Russia is fighting on the side of the allies may well give pause. So may the expressed conviction of many thoughtful Americans that for some years already there has been in evidence in the government of our own land a totalitarian trend.

And it goes without saying that the desire, however foolish, on the part of the citizens of one country to live under a totalitarian regime is no good reason for another nation to issue a declaration of war. The undersigned prefers to think of the present conflict as a war, by nations which themselves have transgressed God’s law in many ways, on wanton international aggression, flagrant international lawlessness, brazen international piracy, blatant international nihilism. Even that conception is not without its difficulties and, no doubt, suffers from oversimplification, but it does seem to name the chief factor in a highly complex situation.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/r-b-kuiper.html">R. B. Kuiper</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Christianity and State Totalitarianism in Presbyterian Guardian</cite></span></figcaption>
<div class="meta"><span class="t"><a href="../topics/civil-government-and-society.html">Civil Government and Society</a></span></div>

<blockquote><p>In midst of pointing to the Erastians that the logic of one of their arguments would require them to believe that the punishments of the judicial law remained valid (a view many Erastians rejected), George Gillespie, in an aside, pointed out that he sympathised with the English divines who held that the penal sanctions remained obligatory:

I know some divines hold that the judicial law of Moses, so far as concerneth the punishments of sins against the moral law, idolatry, blasphemy, Sabbath-breaking, adultery, theft, &amp;c., ought to be a rule to the Christian magistrate; and, for my part, I wish more respect were had to it, and that it were more consulted with. This is by the way.</p></blockquote>

</figure><figure class="quote" id="q-1c7f1ad299" data-kw="">
<blockquote><p>Magistracy (saith he, p. 135.) is a power ordained of God, an Image of the power and judgement committed to Christ; Scripture and the gift of wisdom, justice and righteousness, are his unction now. Page 138. They are set up more specially to minister peace and judgement to Gods people in the flesh.

Then Nero, the great Turk, the Indian Kings, being ordained of God, Rom. 3.1. as the image of Christ, must be his submediators and under Deputies, little spiritual Kings, and Prophets, and Priests under Christ as Mediator. And who gave the Scriptures, the Law, written Gospel, and such an unction to the Indian Kings? for they are Magistrates. The man cannot speak of Christian Magistrates; for Rom. 13. which he citeth, speaketh of Nero, whose head was dry from all unction of the Gospel, or new Testament.

If the Magistrate be an Image of Christ’s power, and that power committed to him; they may under the Mediator Christ, ministerially judge of the doctrine preached by Ministers, if true or false. And if they be set up to minister justice more specially to God’s people in the flesh; then the people of God in the Spirit, and in all Spirit, as Saltmarsh saith most of them all are, shall be under no Magistrate; but this he saith of all, page 288, 293, 200, 201, 202, &amp;c. And by this every Magistrate must be a Christian of an image of the Mediator’s power; or then no Christian, or spiritual man can be a Magistrate.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/samuel-rutherford.html">Samuel Rutherford</a></span><span class="wk"><span class="lbl">Work:</span> <cite>A survey of the spiritual antichrist</cite>, (London: Andrew Crooke, 1648), Part 1.21, pp 215-16.</span></figcaption>

</figure><figure class="quote" id="q-2b6ae35036" data-kw="">
<blockquote><p>First, consider the care of keeping Religion pure in a Nation, is part of the Christian Magistrates charge, and not the least the Kings of Israel were commanded to keep by them the Book of the Law that they might learn to fear the Lord, and keep all the words of this Law, Deut. 17, 18. which was not meant only personally (that was to be the endeavour of every private Israelite) but as a Ruler to see the Law of God kept, and the true Religion there commanded, preserved in their Kingdom.

Hence we find those Kings sharply reproved, that did either set up, or connive at idolatry in their reign; and those commended who removed the Monuments of idolatry, and restored the Worship of God to its purity. Thus we find of Hezekiah, the most famous Reformer of them all, a large testimony is given by God to him, for his zeal therein; That he cleaved to the Lord, and kept his Commandments, which the Lord commanded Moses. And truly, if it were the Magistrates work then, it continues to be so now, except we can find that Christ hath retrenched their power in matters of Religion, which he hath not …</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/william-gurnall.html">William Gurnall</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Magistrate’s Portraiture drawn from the Word, and Preached in a Sermon at Stowe-Market in Suffolk, upon August, the 20. 1656. before the Election of Parliament-men for the same County</cite>, (London: Ralph Smith, 1656), pp 31-32.</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/civil-government-and-society.html">Civil Government and Society</a></span></div>

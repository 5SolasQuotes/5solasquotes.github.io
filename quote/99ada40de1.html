<blockquote><p>We cannot pass from this subject without expressing our gratification with the remarks made by Dr. [Robert Lewis] Dabney, of Virginia, upon the low standard of qualifications for the ministry practically established by too many of our presbyteries, or, in other words, upon the easy admission of candidates to the privileges of the ministry. He showed that the effect of slight and merely nominal examinations was to degrade the whole office in the eyes of that very class of young men whom we should be most anxious to get into it.

What anybody can get is not worth anybody’s striving for. The wider we open the door, the fewer men of generous minds will come in. In our anxiety to increase the number of ministers, we should beware of degrading the office in such a manner as to discourage any but ordinary men from seeking it.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/thomas-peck.html">Thomas Peck</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The General Assembly of 1856 (1856) in Miscellanies of Rev. Thomas E. Peck, D.D., LL.D., Professor of Theology in the Union Theological Seminary in Virginia</cite></span></figcaption>

</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-3c3daabd84" data-kw="">
<blockquote><p>5. Having seen that the infant seed of the professing people of God were members of the church under the Old Testament economy; and having seen also that the church under that dispensation and the present is the same; we are evidently prepared to take another step, and to infer, that if infants were once members, and if the church remains the same, they undoubtedly are still members, unless some positive divine enactment excluding them can be found. As it was a positive divine enactment which brought them in, and gave them a place in the church, so it is evident that a divine enactment as direct and positive, repealing their old privilege, and excluding them from the covenanted family, must be found, or they are still in the church. But can such an act of repeal and exclusion, I ask, be produced? It cannot. It never has been, and it never can be.

The introduction of infants into the church by divine appointment, is undoubted. The identity of the church, under both dispensations, is undoubted. The perpetuity of the Abrahamic covenant, in which not merely the lineal descendants of Abraham, but “all the nations of the earth were to be blessed,” is undoubted (Gen. 18:18; 22:18; 26:4). And we find no hint in the New Testament of the high privileges granted to the infant seed of believers being withdrawn. Only concede that it has not been formally withdrawn, and it remains of course. The advocates of infant baptism are not bound to produce from the New Testament an express warrant for the membership of the children of believers. The warrant was given most expressly and formally, two thousand years before the New Testament was written; and having never been revoked remains firmly and indisputably in force.

It is deeply to be lamented that our Baptist brethren cannot be prevailed upon to recognize the length and breadth, and bearing of this great ecclesiastical fact. Here were little children eight days old, acknowledged as members of a covenanted society­ a society consecrated to God for spiritual as well as temporal benefits and stamped with a covenant seal, by which they were formally bound, as the seed of believers, to be entirely and forever the Lord’s. Can infant membership be ridiculed, as it often is, without lifting the puny arm against him who was with his “church in the wilderness” (Acts 7:38), and whose ways are all wise and righteous?</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/samuel-miller.html">Samuel Miller</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Infant Baptism Scriptural and Reasonable: And Baptism by Sprinkling or Affusion the Most Suitable and Edifying Mode: In Four Discourses</cite>, (Philadelphia: Joseph Whetman, 1835), pp 21-22.</span></figcaption>

<blockquote><p>§40.

II. It is greatly needful to the well-being of the ministry and the success that doctrine be kept sound: And therefore:

      1. That the Christian simplicity be retained, and many subtle and curious decisions be not made necessary: A few great, necessary certain truths are easilier preserved than multitudes of uncertain controverted niceties.

      2. It is needful that such as are ordained ministers, be tried men, of sound understanding in that which they must teach and do, and therefore that both the ordainers and the hearers try them. This account of their understanding is better than the imposing of human forms upon them for subscription: Not but that teachers should know more than the flock, that is, than the essentials; nor that I presume to condemn all the Churches that impose their confessions to be subscribed in their own and not in Scripture-words, while they keep only to necessary, certain things: But I shall afterward prove that this way, though tolerable, is not best, but unnecessary and dangerous: 1. The Scripture affording us apt words enough to form our confessions in, which are past controversy; 2. and there being no probability of bounding men’s impositions of this kind, when once they set upon this way; 3. and most confessions of that nature now extant, having some needless words which other Churches or good Christians do dissent from:

      4. And the ancient Creeds understood (which the ordainers must try) and the old catechistical verities being sufficient to this use.

      5. And there being means of restraining men from preaching and vending heresies which are more safe and congruous.

      3. I add therefore that a certain confession containing the certainest and needfulest integrals of religion should or may well be drawn up as a law, forbidding all upon meet penalties to preach or speak against them, without any subscribing, promising or professing.

      4. And upon proof of the violating of such a law, and preaching against such articles it is sufficient that both the Church and the Christian magistrate in their several ways may judge them and by just penalties correct them (of which more after in due place). For it is very hard so to form long confessions (beyond the old creeds, Lord’s Prayer, Decalogue, and the general belief of Scripture) and this not in Scripture-terms, which shall not have some words which sound and honest Ministers cannot assent to (without lying, which they will not do): But to silence many words which yet we conceive true, and forbear speaking against some things which yet he cannot profess assent to, there are very few sober men but will do. And an error never spoken or written hurts not others, nor is to be judged, being not known; Non apparere here is as non esse. And if it be vended, the person may be judged as well as if he had sworn, subscribed or promised. And they that will tell us yet what evil may befall secret whispering errors without such oaths, subscriptions or promises, do by this over-doing dangerously undo; and lest man should be man and the Church imperfect, on pretence of avoiding a possible unavoidable hurt, they will set up knaves that will say any thing, shut out honest men, and necessitate divisions, confusions and persecutions, where they can never stop on this side banishing or killing or continued imprisoning multitudes of faithful men, and never the more attain their ends. Sound doctrine may be kept up as far as is to be hoped by the aforesaid means.</p></blockquote>

ding+heresies+which+are+more+safe+and+congruous.+3.+I+add+therefore+that+a+certain+confession+containing+the+certainest+and+needfulest+integrals+of+religion+should+or+may+well+be+drawn+up+as+a+law%2C+forbidding+all+upon+meet+penalties+to+preach+or+speak+against+them%2C+without+any+subscribing%2C+promising+or+professing.+4.+And+upon+proof+of+the+violating+of+such+a+law%2C+and+preaching+against+such+articles+it+is+sufficient+that+both+the+Church+and+the+Christian+magistrate+in+their+several+ways+may+judge+them+and+by+just+penalties+correct+them+%28of+which+more+after+in+due+place%29.+For+it+is+very+hard+so+to+form+long+confessions+%28beyond+the+old+creeds%2C+Lord%E2%80%99s+Prayer%2C+Decalogue%2C+and+the+general+belief+of+Scripture%29+and+this+not+in+Scripture-terms%2C+which+shall+not+have+some+words+which+sound+and+honest+Ministers+cannot+assent+to+%28without+lying%2C+which+they+will+not+do%29%3A+But+to+silence+many+words+which+yet+we+conceive+true%2C+and+forbear+speaking+against+some+things+which+yet+he+cannot+profess+assent+to%2C+there+are+very+few+sober+men+but+will+do.+And+an+error+never+spoken+or+written+hurts+not+others%2C+nor+is+to+be+judged%2C+being+not+known%3B+Non+apparere+here+is+as+non+esse.+And+if+it+be+vended%2C+the+person+may+be+judged+as+well+as+if+he+had+sworn%2C+subscribed+or+promised.+And+they+that+will+tell+us+yet+what+evil+may+befall+secret+whispering+errors+without+such+oaths%2C+subscriptions+or+promises%2C+do+by+this+over-doing+dangerously+undo%3B+and+lest+man+should+be+man+and+the+Church+imperfect%2C+on+pretence+of+avoiding+a+possible+unavoidable+hurt%2C+they+will+set+up+knaves+that+will+say+any+thing%2C+shut+out+honest+men%2C+and+necessitate+divisions%2C+confusions+and+persecutions%2C+where+they+can+never+stop+on+this+side+banishing+or+killing+or+continued+imprisoning+multitudes+of+faithful+men%2C+and+never+the+more+attain+their+ends.+Sound+doctrine+may+be+kept+up+as+far+as+is+to+be+hoped+by+the+aforesaid+means.%E2%80%9D%0A%0A%E2%80%94+Richard+Baxter%2C+The+True+%26+only+Way+of+Concord+of+all+the+Christian+Churches%2C+the+Desirableness+of+it+%26+the+Detection+of+False+Dividing+Terms%2C+%28London%3A+Hancock%2C+1680%29%2C+pt.+2%2C+ch.+5%2C+%E2%80%98What+are+the+terms+necessary+to+the+office+and+exercise+of+the+sacred+ministry%3F%E2%80%99%2C+pp.+222-23&amp;url=https%3A%2F%2F5solasquotes.github.io%2Fquote%2Ff861c3603b.html&amp;via=5Solas" target="_blank" rel="noopener">Share on X</a><a class="perma" href="../quote/f861c3603b.html">Permalink</a><a class="src" href="https://reformedbooksonline.com/on-subscription-to-confessions-by-church-officers/#:~:text=40.%20II.%20It%20is%20greatly%20needful,be%20hoped%20by%20the%20aforesaid%20means&amp;text=40.%20II.%20It%20is%20greatly%20needful%20to%20the&amp;text=is%20to%20be%20hoped%20by%20the%20aforesaid%20means" rel="noopener" target="_blank">Read it online · Reformed Books Online</a></div>
</figure><figure class="quote" id="q-d136827407" data-kw="">
<blockquote><p>First of all, we have to realize that the ministry of the Word is something full of hard work and trouble. Just as a mother carries a fetus in her womb with great effort, losing her appetite for food and appealing to others for help, and just as she gives birth in great pain and then feeds and educates her child with enormous effort, so the trials laid on the backs of ministers of the Word are infinite, and those who risk their reputations in order to win others for Christ have to suffer great trouble (as we are taught by the example of Elijah).

The innate depravity of our mind and nature does not accept that we are children of God. The world is against them, because it does not let people escape from its clutches. What grieves ministers the most is that those for whose salvation they sacrifice everything are often not only ungrateful to them for their efforts but even hostile to them. But just as a mother’s love conquers everything and turns sorrow and trouble into joy, sustaining her through the birth process and the education of her children, so ministers should burn with unquenched love for Christ and the church, so that however hard the going may be, nothing will overpower the joy and delight that they get from fulfilling their ministry.</p></blockquote>

<main class="wrap"><figure class="quote" id="q-1219b1eb93" data-kw="">
<blockquote><p>Pedagogically the church is prior to Scripture. But in the logical order Scripture is the sole foundation (principium unicum) of church and theology. In case of conflict between them, the possibility of which can never be denied on a Reformational view, church and confession must yield to Scripture. … Nothing may be put on a level with Scripture. Church, confession, tradition—all must be ordered and adjusted by it and submit themselves to it.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/herman-bavinck.html">Herman Bavinck</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Reformed Dogmatics</cite>, vol. 1: Prolegomena, ch. 2</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/holy-scripture/sufficiency.html">Sufficiency</a> › <a href="../topics/holy-scripture/sufficiency/scripture-alone.html">Scripture alone</a></span><span class="t"><a href="../topics/rome/the-rule-of-faith.html">Rome: The Rule of Faith</a> › <a href="../topics/rome/the-rule-of-faith/scripture-vs-tradition.html">Scripture vs tradition</a></span></div>

</figure><figure class="quote" id="q-a9307165a8" data-kw="">
<blockquote><p>The Scripture is the best interpreter of Scripture, or the Spirit of God therein; nor are the church or its pastors, nor councils and popes, the infallible interpreters thereof; there is a private interpretation of Scripture, which every Christian may make, according to his ability and light; and there is a public one, by the preacher of the word but both are subject to, and to be determined by the Scripture itself, which is the only certain and infallible rule of faith and practice.</p></blockquote>

</figure><figure class="quote" id="q-57765b3c9f" data-kw="">
<blockquote><p>The sufficiency of the Bible means its sole sufficiency. It is sufficient to achieve the purposes of redemptive revelation without supplementation by new revelations (claimed by some Anabaptists and others) or traditions of men (like those extra-biblical traditions claimed by the Roman Catholic church). It is this and no other view of the sufficiency of the Scriptures which must now be demonstrated.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/samuel-e-waldron.html">Samuel E. Waldron</a></span><span class="wk"><span class="lbl">Work:</span> <cite>A Modern Exposition of the 1689 Baptist Confession of Faith</cite>, ch. 1, p. 53</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/holy-scripture/sufficiency.html">Sufficiency</a> › <a href="../topics/holy-scripture/sufficiency/scripture-alone.html">Scripture alone</a></span><span class="t"><a href="../topics/rome/the-rule-of-faith.html">Rome: The Rule of Faith</a> › <a href="../topics/rome/the-rule-of-faith/scripture-vs-tradition.html">Scripture vs tradition</a></span></div>
<div class="actions"><button class="copy" data-copy="“The sufficiency of the Bible means its sole sufficiency. It is sufficient to achieve the purposes of redemptive revelation without supplementation by new revelations (claimed by some Anabaptists and others) or traditions of men (like those extra-biblical traditions claimed by the Roman Catholic church). It is this and no other view of the sufficiency of the Scriptures which must now be demonstrated.”

— Samuel E. Waldron, A Modern Exposition of the 1689 Baptist Confession of Faith, ch. 1, p. 53">Copy</button><a class="share" href="https://x.com/intent/post?text=%E2%80%9CThe+sufficiency+of+the+Bible+means+its+sole+sufficiency.+It+is+sufficient+to+achieve+the+purposes+of+redemptive+revelation+without+supplementation+by+new+revelations+%28claimed+by+some+Anabaptists+and+others%29+or+traditions+of+men+%28like+those+extra-biblical+traditions+claimed+by+the+Roman+Catholic+church%29.+It+is+this+and+no+other+view+of+the+sufficiency+of+the+Scriptures+which+must+now+be+demonstrated.%E2%80%9D%0A%0A%E2%80%94+Samuel+E.+Waldron%2C+A+Modern+Exposition+of+the+1689+Baptist+Confession+of+Faith%2C+ch.+1%2C+p.+53&amp;url=https%3A%2F%2F5solasquotes.github.io%2Fquote%2F57765b3c9f.html&amp;via=5Solas" target="_blank" rel="noopener">Share on X</a><a class="perma" href="../quote/57765b3c9f.html">Permalink</a><span class="src none">No free online copy linked</span></div>
</figure><figure class="quote" id="q-942957c3d0" data-kw="">

<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/john-calvin.html">John Calvin</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Acts of the Council of Trent with the Antidote</cite>, On the Decree concerning Residences</span></figcaption>

<blockquote><p>II. Whether Christ died for all men universally? Arminians. Christ underwent death for all individuals both of the perishing and of those to be saved, as to the obtaining of salvation, as much for Cain and Judas, as for Abel and Peter: not however for the former, as such or about to perish, nor for the latter, as believers; but indiscriminately for these and those considered in the common lot of the fall and sin.. Censure. Christ is the expiation for the sins of the whole world, as to the worth and sufficiency of the λύτρον [ransom]. But by reason of efficacy, and the application of faith by him, according to the gratuitous election of God, He is the Savior of the elect only. Jn. 10:15. But in Scripture Christ is said to have died for all, 1 Tim. 2:6, Heb. 2:9, and for many, namely the elect, sons of God and believers. Mt. 20:28, Jn. 17:9, 19, Rom. 3:22. Which ἐναντιοφανές [seeming contradiction] that it may be taken away, it is to be held, that Christ is said to have died for all in three ways: In the beginning He died efficaciously for all his sheep. Jn. 10:15. And in these all and alone there is a certain special universality, as is in Ambrose, bk. 1, Of the Calling of the Gentiles, ch. 3. The Apostle expresses that universality of believers in Rom. 3:22. Then in certain places of Scripture by the word “all” is understood the indeterminate and universal object of the death of Christ: which are all men, without exception of peoples, condition and sex: so that by this phrase the amplitude of grace in the New Testament is signified. Finally Christ is said to have died for all, if the sufficiency or magnitude of the price is regarded. For indeed the death of the Son of God, and of the immaculate lamb, is the one, perfect, and sufficient λύτρον [ransom], sufficient for expiating and deleting all the sins of the whole world: by which sufficiency all the reprobate are rendered inexcusable.</p></blockquote>

</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-96b8ef64dd" data-kw="">
<blockquote><p>Hence, it is not allowed that Christ has died for the reprobate, yet by the death of Christ they have been made reconciliable in this sense: 1. Because Christ assumed the nature which is common; it is not conceded that it was common to all, but it was the nature of Abraham, the father of the believing (Heb. 2:16). Hence, the devils are not at all made salvable by Christ, of course, as the angelic nature has not itself been united to his person. 2. Because Christ has expiated the common sin of Adam on the tree of the cross, though it is not conceded that it was as common, but as it was in the elect and the believing. 3. Because the grace of the preaching of the Gospel has been procured [impetrata est] by the death of Christ to reprobates born in the visible Church, and the sacrifice of Christ has been made approved and of simple complacency to them. Wherefore they are called to the Supper (Mt. 22; Lk. 14:16) and are called to Christ (Mt. 11:16; 23:37-38; 1 Cor. 1:18,23; [sic] Acts 14:46; Prov. 1:24-25; Isa. 6:10-11; 65:2-3). These previous things cannot be said of devils.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/samuel-rutherford.html">Samuel Rutherford</a></span><span class="wk"><span class="lbl">Work:</span> <cite>‘Whether the Reprobate are made Reconcilable by the Death of Christ?’ [Distinguish] in Rutherford’s Examination of Arminianism: The Tables of Contents with Excerpts from Every Chapter, trans. T. Fentiman &amp; C. Johnson (RBO, 2019)</cite>, pp. 90-92</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/priestly-office-satisfaction-and-atonement/extent-of-the-atonement.html">Extent of the Atonement</a></span></div>

</figure><figure class="quote" id="q-19c4498eb6" data-kw="sufficient efficient">
<blockquote><p>It is not asked with respect to the value and sufficiency of the death of Christ—whether it was in itself sufficient for the salvation of all men. For it is confessed by all that since its value is infinite, it would have been entirely sufficient for the redemption of each and every one, if God had seen fit to extend it to the whole world. And here belongs the distinction used by the fathers and retained by many divines—that Christ “died sufficiently for all, but efficiently for the elect only.” For this being understood of the dignity of Christ’s death is perfectly true (although the phrase would be less accurate if referred to the will and purpose of Christ).</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/francis-turretin.html">Francis Turretin</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Institutes of Elenctic Theology</cite>, 14.14.9</span></figcaption>

<blockquote><p>At the end of the 17th century, in the so-called Third Antinomian Controversy English and Dutch Reformed theologians discussed the concept of imputation in its interrelationship with forgiveness, punishment, and justice… these same themes had already been extensively discussed in the preceding century in the context of debates against Socinianism, the Antinomian Controversy is framed within an interconfessional and international context, highlighting the significance of Socinians and Hugo Grotius.</p></blockquote>

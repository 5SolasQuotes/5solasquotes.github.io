<main class="wrap"><figure class="quote" id="q-f57a940b0e" data-kw="">
<blockquote><p>For our purposes, what is relevant here is passive obediential potency, which [the reformed] Senguerdius defines as: ‘[That] whereby a subject can receive an act beyond its nature, that is, to which it is not ordained by nature and would not naturally receive, such as the potency obediential passive given in stones to become sons of Abraham, or in water to be turned into wine.’ The idea here is simple. There is a sense in which you and I are perfectly capable of performing miracles. By this, I do not mean that we currently possess the active and formal power to perform miracles. Nor do I mean that we can affect them by our own natural powers. I only mean that you and I are the sort of beings that have the capacity to be raised by an agent superior to ourselves to perform miracles. … In this sense, man’s ordering to the beatific vision is an end superadded to his nature. When we speak about something being “supernatural,” strictly speaking, we mean that it is above the power of all created nature. The beatific vision clearly belongs to this category, since, as Thomas argues, no created effect of God is proportionate to his essence. Therefore, the beatific vision cannot be man’s intrinsic and natural end. Nevertheless, man’s rational nature entails an obediential potency for this vision, since his intellect and will make him the sort of creature capable of enjoying it, should God will to grant it. This is not because man’s nature is proportioned to that vision by nature, but only because it is not intrinsically repugnant to it as, for instance, would be the case of a stone, which lacks even the obediential potency to enjoy the beatific vision inasmuch as it is irrational. Thus man’s nature is not ‘closed off’ to grace even though it is not naturally ordered to it.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/brandon-corley.html">Brandon Corley</a></span><span class="wk"><span class="lbl">Work:</span> <cite>‘The Natural End of Man’</cite>, (2026) at American Reformer</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/free-will-and-inability/liberty-and-necessity.html">Liberty and Necessity</a></span></div>

</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-362c22aa28" data-kw="">
<blockquote><p>Scotus has well observed that the ultimate root of contingency is free will, for, in the system of absolute determinism, whatever happened would be necessary in its causes. It is plain that the opposite of something could only be when that something in fact comes to be if it depends immediately or at least mediately on a free cause, name on a cause that, when everything is given for acting that must be given, has it in its own power to act or not to act, or to act in this way or in some other way. Hence let a free cause be defined as a cause that in acting is undetermined either by anything outside itself and by its own nature as a being. Therefore, when all conditions outside it for acting are given, it has within it the power to act rather than not to act (liberty of contradictories), or to act in one rather than in another (liberty of contraries). So for us free cause is by definition the same as free will. A cause, therefore, that contingently causes is either such a free cause or is a non-free cause that truly depends for its existing or its causing on a free cause. So we can distinguish between a free cause and a contingently causing cause.¹ For even if a cause depends on a free first cause and thus is a contingent causer, it can be a non-free cause. Such a cause is even called by Scotus a natural cause or a cause that acts by way of nature; for any cause is a natural one that is determined by its nature to one way of acting when all necessary givens are given. It is also called a cause that is hypothetically or in a certain respect necessary. ¹ [Editor:] A cause is a contingently causing cause if it be able not to cause in the moment when it does in fact cause. As such it is opposed to a cause that causes necessarily.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/allan-b-wolter.html">Allan B. Wolter</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Little Summary of Metaphysics</cite>, (Milwaukee: Bruce Publishing Co., 1958), ch. 5, ‘On Contingent &amp; Necessary’ | Article 2, ‘On the Existence of the Contingent and of its Ultimate Cause’, p. 49</span></figcaption>

</figure><figure class="quote" id="q-5b21e4c107" data-kw="">
<blockquote><p>Inability deals with the fact that our own depravity is humanly irremediable. Man is totally unable to change his character or act in a way that is different from it. Definition Negatively, it is not:

1. Metaphysical; it is not due to the loss or absence of any component element of our being, nor to any incompatibility between the component elements in our being, nor to any limitation belonging to our being as creatures.

2. It did not belong to man originally. We must distinguish between what man is unable to be, become, or do because of his finitude, and the moral inability arising from sin. In his original state man had plenary ability to fullfil all of God’s demands. To maintain otherwise would mean that sin was a necessity of the condition in which he was created. For all failure to meet the full demands of God is sin.

3. Inability does not mean the loss of natural liberty. This refers to free agency, namely, that man exercises volition according to his character. Inability presupposes liberty.

4. Inability does not deny the possibility of Justitia civilis, that is natural and social virtue. Positively, inability means that in sin man is not only indisposed and made opposite to all good but that he is totally unable to be otherwise. It is inability to discern, love, or choose the things that are well pleasing to God. He cannot know them because they are spiritually discerned; he cannot love them because his mind is enmity against God; he cannot choose them because those in the flesh cannot please God. It is the [in Greek] ou dunatai (cannot) of the natural man.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/john-murray.html">John Murray</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Collected Writings of John Murray</cite>, vol. 2, ch. 9, ‘Inability’, p. 83</span></figcaption>

<blockquote><p>§XXIII. The opposite of liberty is necessity; yet not just any. Not: (1) the Necessity of Servitude, which is the state of man after the Lapse, in which man is subject to the yoke of sin and the misery flowing from it; whence the will of men has become a servant of sin, from Jn. 8:34; 2 Pet. 2:19; Rom. 7:14, without the destruction of natural liberty, which a servant exercises just as freely in things pertaining to his own sphere as a master does in those that pertain to his sphere; since, notwithstanding the servitude of sin, free will has remained immune from the necessity of this or that crime, and is free in animal, economic, civil, and moral matters of the natural order. … Nor (3) the Necessity of Dependence on God in becoming and being, and in operating; as that which is common to all creatures, not only the irrational, but also the rational; since, this dependence being saved, the mode of dependence is and remains various or diverse for the variety of creatures and agents: for intellectual creatures and free agents do not depend on God in the manner of stupid brutes, much less in the manner of statues or of turning metal plates, but as intellectual and free agents, which, being endowed with an internal active principle, exercise and determine their own acts under divine providence and grace, and are thence capable of a gratuitous reward or a just punishment.</p></blockquote>

<div class="actions"><button class="copy" data-copy="“§XXIII. The opposite of liberty is necessity; yet not just any. Not: (1) the Necessity of Servitude, which is the state of man after the Lapse, in which man is subject to the yoke of sin and the misery flowing from it; whence the will of men has become a servant of sin, from Jn. 8:34; 2 Pet. 2:19; Rom. 7:14, without the destruction of natural liberty, which a servant exercises just as freely in things pertaining to his own sphere as a master does in those that pertain to his sphere; since, notwithstanding the servitude of sin, free will has remained immune from the necessity of this or that crime, and is free in animal, economic, civil, and moral matters of the natural order. … Nor (3) the Necessity of Dependence on God in becoming and being, and in operating; as that which is common to all creatures, not only the irrational, but also the rational; since, this dependence being saved, the mode of dependence is and remains various or diverse for the variety of creatures and agents: for intellectual creatures and free agents do not depend on God in the manner of stupid brutes, much less in the manner of statues or of turning metal plates, but as intellectual and free agents, which, being endowed with an internal active principle, exercise and determine their own acts under divine providence and grace, and are thence capable of a gratuitous reward or a just punishment.”

— Barthold Holtzfus, ‘Theological Dissertation on the Free Will of Man’ trans. AI by Nosferatu (Frankfurt: Zeitler, 1707) Latin Holtzfus was a German reformed divine., ch. 1, p. 17">Copy</button><a class="share" href="https://x.com/intent/post?text=%E2%80%9C%C2%A7XXIII.+The+opposite+of+liberty+is+necessity%3B+yet+not+just+any.+Not%3A+%281%29+the+Necessity+of+Servitude%2C+which+is+the+state+of+man+after+the+Lapse%2C+in+which+man+is+subject+to+the+yoke+of+sin+and+the+misery+flowing+from+it%3B+whence+the+will+of+men+has+become+a+servant+of+sin%2C+from+Jn.+8%3A34%3B+2+Pet.+2%3A19%3B+Rom.+7%3A14%2C+without+the+destruction+of+natural+liberty%2C+which+a+servant+exercises+just+as+freely+in+things+pertaining+to+his+own+sphere+as+a+master+does+in+those+that+pertain+to+his+sphere%3B+since%2C+notwithstanding+the+servitude+of+sin%2C+free+will+has+remained+immune+from+the+necessity+of+this+or+that+crime%2C+and+is+free+in+animal%2C+economic%2C+civil%2C+and+moral+matters+of+the+natural+order.+%E2%80%A6+Nor+%283%29+the+Necessity+of+Dependence+on+God+in+becoming+and+being%2C+and+in+operating%3B+as+that+which+is+common+to+all+creatures%2C+not+only+the+irrational%2C+but+also+the+rational%3B+since%2C+this+dependence+being+saved%2C+the+mode+of+dependence+is+and+remains+various+or+diverse+for+the+variety+of+creatures+and+agents%3A+for+intellectual+creatures+and+free+agents+do+not+depend+on+God+in+the+manner+of+stupid+brutes%2C+much+less+in+the+manner+of+statues+or+of+turning+metal+plates%2C+but+as+intellectual+and+free+agents%2C+which%2C+being+endowed+with+an+internal+active+principle%2C+exercise+and+determine+their+own+acts+under+divine+providence+and+grace%2C+and+are+thence+capable+of+a+gratuitous+reward+or+a+just+punishment.%E2%80%9D%0A%0A%E2%80%94+Barthold+Holtzfus%2C+%E2%80%98Theological+Dissertation+on+the+Free+Will+of+Man%E2%80%99+trans.+AI+by+Nosferatu+%28Frankfurt%3A+Zeitler%2C+1707%29+Latin+Holtzfus+was+a+German+reformed+divine.%2C+ch.+1%2C+p.+17&amp;url=https%3A%2F%2F5solasquotes.github.io%2Fquote%2F781ab26b65.html&amp;via=5Solas" target="_blank" rel="noopener">Share on X</a><a class="perma" href="../quote/781ab26b65.html">Permalink</a><a class="src" href="https://reformedbooksonline.com/the-reformed-freedom-of-the-will-vs-philosophical-necessity/#:~:text=XXIII.%20The%20opposite%20of%20liberty%20is,gratuitous%20reward%20or%20a%20just%20punishment&amp;text=XXIII.%20The%20opposite%20of%20liberty%20is%20necessity%3B%20yet&amp;text=of%20a%20gratuitous%20reward%20or%20a%20just%20punishment" rel="noopener" target="_blank">Read it online · Reformed Books Online</a></div>

<blockquote><p>§XXXIV. Scotus and the Scotists, after Hales, Bonaventure, and Richard, also rightly state that the will, with respect to its acts, is more excellent than the intellect, for:

1. The Intellect is a merely natural and necessary faculty, which only represents and shows to the will things to be done and chosen, but does not command them; whereas the will determines the intellect to speculate on this or that, and often commands it to consider this and not that, and to judge in this way and not another. But it is more noble to command than to do or execute what is commanded.

2. Liberty, which is the highest perfection of an intellectual nature, inheres in the will, at whose nod the other faculties act or cease; from this, then, shines the nobility of the will.</p></blockquote>

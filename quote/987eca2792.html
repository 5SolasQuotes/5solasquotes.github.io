<main class="wrap"><figure class="quote" id="q-987eca2792" data-kw="">
<blockquote><p>5. If there be nothing taken from the parents of which the soul is formed, then it is not traduced by natural generation: but there is nothing taken from the parents by which the soul is formed; for [otherwise] then in all abortions and miscarrying conceptions the seed of the soul would perish, and by consequence the soul itself would be corruptible, as having its original from corruptible seed. These and diverse other the like arguments are used to confirm the doctrine touching the creation of the reasonabl soul.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/edward-reynolds.html">Edward Reynolds</a></span><span class="wk"><span class="lbl">Work:</span> <cite>A Treatise of the Passions &amp; Faculties of the Soul of Man (London, 1640), ch. 32</cite>, p. 394</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/civil-government-and-society/life-birth-and-medical-ethics.html">Life, Birth and Medical Ethics</a></span></div>

</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-a937edf31a" data-kw="">
<blockquote><p>But we can hardly say the physical fact of the genetic uniqueness of human fetal tissue is the basis of all the anxious inquiry, for the same uniqueness prevails in the animal world…. …when the fetus becomes a human being… the “breath of life” and the “blood which is the life” are applicable to animals as well as men. The biblical description of man’s distinctive creation “in the divine image” refers to a quality of life that, though it depends upon breath and blood, is not equated with them… although Augustine and Thomas condemned deliberate interference with the life of the fetus, they considered it homicide only when the fetus was possessed of a human soul.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/paul-k-jewett.html">Paul K. Jewett</a></span><span class="wk"><span class="lbl">Work:</span> <cite>‘The Relation of the Soul to the Fetus: Tracing the Development of a Human Being’ Christianity Today, vol. 13 (Nov. 1968)</cite></span></figcaption>
<div class="meta"><span class="t"><a href="../topics/civil-government-and-society/life-birth-and-medical-ethics.html">Life, Birth and Medical Ethics</a></span></div>

</figure><figure class="quote" id="q-30b52f2456" data-kw="">
<blockquote><p>Nor is it of importance to inquire curiously at what time the soul was united to the body, the Logos (Logos) to the flesh. It is enough for us to believe that the human nature from the time it began to be never existed apart from the Logos (Logo), but was assumed by and hypostatically united to him. And if the soul could not be poured into the body unless already organized and completely formed (a point on which physicians are not agreed among themselves), it does not follow that the Logos (Logon) could not at once unite the flesh to himself, since his work could not be constrained either with the soul present or absent. Nor is it more absurd for the body of Christ (not as yet animated) to be united to the Logos (Logo), then for the same (when lifeless in the sepulcher) to remain conjoined with the same (as theologians acknowledge was done in the death of Christ).</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/francis-turretin.html">Francis Turretin</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Institutes, vol. 2, 13th Topic, ‘Person &amp; State of Christ’, 11th Question, ‘The Conception &amp; Nativity of Christ…’, section 14</cite>, p. 343</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/civil-government-and-society/life-birth-and-medical-ethics.html">Life, Birth and Medical Ethics</a></span></div>

</figure><figure class="quote" id="q-40ee2b704f" data-kw="">
<blockquote><p>From this miraculous creation of the body of Christ, by the immediate power of the Holy Ghost, did it become a meet habitation for his holy soul, every way ready and complying with all actings of grace and virtue… But the body of Christ being formed pure and exact by the Holy Ghost, there was no disposition or tendency in his constitution to the least deviation from perfect holiness in any kind.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/john-owen.html">John Owen</a></span><span class="wk"><span class="lbl">Work:</span> <cite>A Discourse concerning the Holy Spirit, bk. 2 in Works (Philadelphia: Protestant Episcopal Book Soceity, 1862), vol. 3</cite>, p. 167</span></figcaption>

</figure><figure class="quote" id="q-c446ff7b41" data-kw="">

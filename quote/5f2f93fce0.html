<main class="wrap"><figure class="quote" id="q-5f2f93fce0" data-kw="">
<blockquote><p>We must needs assert that in God there is love: because love is the first movement of the will and of every appetitive faculty. For since the acts of the will and of every appetitive faculty tend towards good and evil, as to their proper objects: and since good is essentially and especially the object of the will and the appetite, whereas evil is only the object secondarily and indirectly, as opposed to good; it follows that the acts of the will and appetite that regard good must naturally be prior to those that regard evil; thus, for instance, joy is prior to sorrow, love to hate: because what exists of itself is always prior to that which exists through another. Again, the more universal is naturally prior to what is less so. Hence the intellect is first directed to universal truth; and in the second place to particular and special truths. Now there are certain acts of the will and appetite that regard good under some special condition, as joy and delight regard good present and possessed; whereas desire and hope regard good not as yet possessed. Love, however, regards good universally, whether possessed or not. Hence love is naturally the first act of the will and appetite; for which reason all the other appetite movements presuppose love, as their root and origin. For nobody desires anything nor rejoices in anything, except as a good that is loved: nor is anything an object of hate except as opposed to the object of love. Similarly, it is clear that sorrow, and other things like to it, must be referred to love as to their first principle. Hence, in whomsoever there is will and appetite, there must also be love: since if the first is wanting, all that follows is also wanting. Now it has been shown that will is in God (Q[19], A[1]), and hence we must attribute love to Him.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/thomas-aquinas.html">Thomas Aquinas</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Summa</cite>, (d. 1274), pt. 1, quest. 20, art. 1, I answer that</span></figcaption>

</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-067bfa5580" data-kw="">
<blockquote><p>‘And it repented the Lord that He had made man on the earth, and it grieved Him at his heart’ ([Genesis] 6:6). This, of course, is anthropomorphic language; it speaks of God as if He were a man. Actually, God does not repent (1 Sam. 15:29); God does not change His mind; He has a single, consistent purpose that He follows from eternity to eternity. When the Bible speaks of God as ‘repenting’ or changing His mind, this means that He changed His attitude toward some of His creatures. The change of attitude itself was part of the original purpose of God and was planned from eternity. So, in the present passage, the truth is expressed that God changed His attitude toward the human race. Human sin had developed to such an extreme degree that the purpose for which man had been created could no longer be accomplished. A new beginning had to be made with the godly remnant of the race, while the mass of the wicked had to be destroyed. This, of course, was known and planned by God from eternity; the change was in God’s attitude toward man, not in God’s own intentions and purposes.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/johannes-g-vos.html">Johannes G. Vos</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Genesis</cite>, (Pittsburgh, PA: Crown &amp; Covenant, 2006), p. 124</span></figcaption>

<blockquote><p>Hence although love considered affectively and on the part of the internal act is equal in God (because it does not admit of increase and diminution), yet regarded effectively (or on the part of the good which He wills to anyone) it is unequal because some effects of love are greater than others.</p></blockquote>

</figure><figure class="quote" id="q-dee57a070d" data-kw="">
<blockquote><p>Some [attributes] are said absolutely concerning God, as all the preceding attributes. Others relatively, which relation is two-fold: either with respect to the persons among themselves, as the Father, the Son, and the Holy Spirit, or with respect of the creatures to God, as Creator, Savior, Lord, King, etc. Here it is asked, whether all these things were in God from eternity past. Response: All those things that are attributed to God absolutely are eternal, even those that are spoken relative to the very persons, as shall be proven afterwards against the heretics – Arians, Samosatensians, etc. The difficulty, therefore, remains only in those which are spoken concerning God with respect to the creatures, concerning which we respond, if we consider the foundation of the relation, such as the power to create, to conserve, to reign, etc, this also is eternal, because it is referred to the absolute: but if we consider the formal relation, that is added in time: for God was not an actual creator until he had created things. Objection: But then it is stated that something was added to God; and therefore, some change was also done in Him. Response: That relation, with respect to God, is not real; but it is only so with respect to the creature. For to the creature, something real is added, and not to God; but only some notional concept. Augustine compares it to a coin: when it becomes a pledge, nothing is really added to the coin; but to the man who accepts it, something is really added. Thomas compares it to a column, which is to my right: when I turn to that side, still nothing is really added to the column; but only to the man, who turns himself toward it in this or that way, does any change take place.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/anthony-walaeus.html">Antonius Walaeus</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Institutes</cite>, As quoted in Johannes Hornbeek, 3.9 trans. Charles Johnson</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/attributes-of-god/affections-and-passions-in-god.html">Affections and Passions in God</a></span></div>

<blockquote><p>As in the case of the other divine affections, the Reformers identify such negative attributes as anger, hate, scorn, or jealousy as metaphoes and anthropopathisms, applied to God or even in the sense ‘assumed’ by God by way of revelation and accommodation to us…</p></blockquote>

<blockquote><p>It was in itself of infinite value and sufficiency to have been made a price to have bought and purchased all and every man in the world. That it did formally become a price for any is solely to be ascribed to the purpose of God, intending their purchase and redemption by it. The intention of the offerer and accepter that it should be for such, some, or any, is that which gives the formality of a price unto it; this is external. But the value and fitness of it to be made a price arises from its own internal sufficiency. Hence may appear what is to be thought of… [the statement] “The blood of Christ was a sufficient price for the sins of all the world;” –which last expression is corrected by some, and thus asserted, “That the blood of Christ was sufficient to have been made a price for all;” which is most true, as was before declared: for its being a price for all or some does not arise from its own sufficiency, worth, or dignity, but from the intention of God and Christ using it to that purpose, as was declared; and, therefore, it is denied that the blood of Christ was a sufficient price and ransom for all and every one, not because it was not sufficient, but because it was not a ransom. And so it easily appears what is to be owned in the [Lombardian] distinction itself before expressed. If it intend no more but that the blood of our Savior was of sufficient value for the redemption of all and every one, and that Christ intended to lay down a price which should be sufficient [emphasis added; note this is consistent with being in the realm of hypothesis] for their redemption, it is acknowledged as most true.</p></blockquote>

</figure><figure class="quote" id="q-96b8ef64dd" data-kw="">
<blockquote><p>Hence, it is not allowed that Christ has died for the reprobate, yet by the death of Christ they have been made reconciliable in this sense: 1. Because Christ assumed the nature which is common; it is not conceded that it was common to all, but it was the nature of Abraham, the father of the believing (Heb. 2:16). Hence, the devils are not at all made salvable by Christ, of course, as the angelic nature has not itself been united to his person. 2. Because Christ has expiated the common sin of Adam on the tree of the cross, though it is not conceded that it was as common, but as it was in the elect and the believing. 3. Because the grace of the preaching of the Gospel has been procured [impetrata est] by the death of Christ to reprobates born in the visible Church, and the sacrifice of Christ has been made approved and of simple complacency to them. Wherefore they are called to the Supper (Mt. 22; Lk. 14:16) and are called to Christ (Mt. 11:16; 23:37-38; 1 Cor. 1:18,23; [sic] Acts 14:46; Prov. 1:24-25; Isa. 6:10-11; 65:2-3). These previous things cannot be said of devils.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/samuel-rutherford.html">Samuel Rutherford</a></span><span class="wk"><span class="lbl">Work:</span> <cite>‘Whether the Reprobate are made Reconcilable by the Death of Christ?’</cite>, [Distinguish] in Rutherford’s Examination of Arminianism: The Tables of Contents with Excerpts from Every Chapter, trans. T. Fentiman &amp; C. Johnson (RBO, 2019), pp. 90-92</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/priestly-office-satisfaction-and-atonement/extent-of-the-atonement.html">Extent of the Atonement</a></span></div>

<blockquote><p>Unto whom is the death and passion of Christ profitable? Although He might have been a sufficient price for the sins for all men, yet actually and effectually he died for his elect only, who receive Him and believe Him, Matt 1:21. “He will deliver his people from their sins.” John 10:15. “I lay down my life for my sheep.” and Chap. 17:19 “I sanctify myself,” for otherwise it would follow that Christ died [without] profit, and to no purpose in regard of many, and that the efficacy of Christ’s death could be made void by men.</p></blockquote>

<blockquote><p>XXIX. Therefore the end of satisfaction, to whom, or the object, is solely the elect and true believers of both the Old and New Testament. For although it could extend itself to all men with respect to the greatness, dignity, and sufficiency of the price considered in itself, nevertheless it was particularly expended for those whom the Father elected and gave to the Son, and who by God’s gift would believe in God and His Son. Whence Scripture repeatedly says that He gave Himself for His own, and for us, for the sheep, and for the Church. Mt. 20:7, 28 and 26 [i.e. Mt. 26:28]; 1 Jn. 3:16; Acts 20:28, etc.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/antonius-thysius.html">Antonius Thysius</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Disputation 29, ‘On the Satisfaction of Jesus Christ’ in Synopsis of Pure Theology</cite>, (1625), trans. AI at Confessionally Reformed Theology</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/priestly-office-satisfaction-and-atonement/extent-of-the-atonement.html">Extent of the Atonement</a></span></div>
<div class="actions"><button class="copy" data-copy="“XXIX. Therefore the end of satisfaction, to whom, or the object, is solely the elect and true believers of both the Old and New Testament. For although it could extend itself to all men with respect to the greatness, dignity, and sufficiency of the price considered in itself, nevertheless it was particularly expended for those whom the Father elected and gave to the Son, and who by God’s gift would believe in God and His Son. Whence Scripture repeatedly says that He gave Himself for His own, and for us, for the sheep, and for the Church. Mt. 20:7, 28 and 26 [i.e. Mt. 26:28]; 1 Jn. 3:16; Acts 20:28, etc.”

<main class="wrap"><figure class="quote" id="q-8c9a5919f4" data-kw="Temptation">
<blockquote><p>First, therefore, we must resist suggestion, or thoughts: which are either ascending, from the tinder of concupiscence, or descending, suggested from elsewhere. The former are not without fault; the latter, even if they are cast in by Satan, but fly past and are not received by you, are not sins.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/johannes-wollebius.html">Johannes Wollebius</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Compendium of Christian Theology</cite>, 2.14</span></figcaption>

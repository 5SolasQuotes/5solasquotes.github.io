<main class="wrap"><figure class="quote" id="q-6df0d8e330" data-kw="">
<blockquote><p>1) A thing is possible because God is able to produce it. It is not, conversely, because it is possible that God is able to produce it. This is proved by God’s priority and independence. 2) Intrinsic possibility is not prior in nature to extrinsic possibility, nor is it the cause of the latter. On the contrary, since a thing can possibly be made by the truly and infinitely powerful God Himself, the source of all being, for that reason [the thing] is also intrinsically possible because the essence of God is the root and rule of all truth.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/melchior-leydekker.html">Melchior Leydekker</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Fax veritatis seu exercitationes ad nonnullas controversias quae hodie in Blegio</cite>, … (Leiden: Gaesbeeck &amp; Lopex, 1677), pp. 242-46 tr. Aza Goudriaan, ch. 8, ‘Samuel Rutherford on the Divine Origin of Possibility’ in ed. Aaron C. Denlinger – Reformed Orthodoxy in Scotland: Essays on Scottish Theology, 1560-1775 (Bloomsbury, T&amp;T Clark, 2016), pt. 2, p. 154 Leydekker followed Rutherford on the subject.</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/attributes-of-god/knowledge-and-wisdom.html">Knowledge and Wisdom</a></span></div>

</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-5cdc07d4df" data-kw="Wisdom">
<blockquote><p>It is a marked proof of the wisdom of God that he can so direct all the affairs of the universe as, without need of special action, to accomplish all the events he chooses. All providence, therefore, is general, because operated through general laws. It is also special, because every individual event comes to pass under God&#x27;s own inspection, and through his own will and work.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/james-petigru-boyce.html">James Petigru Boyce</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Abstract of Systematic Theology</cite>, ch. XXI, “Providence,” §IV.1</span></figcaption>

</figure><figure class="quote" id="q-dd70aeaad2" data-kw="scientia media">
<blockquote><p>Besides these two species of divine knowledge, a third was devised by the Jesuits, Fonseca, Lessius, Molina, which they called “middle knowledge.” Is there a middle knowledge in God between the natural and the free? We deny against the Jesuits, Socinians and Remonstrants. The free knowledge depends upon his will and decree by which things pass from a state of possibility to a state of futurition.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/francis-turretin.html">Francis Turretin</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Institutes of Elenctic Theology</cite>, 3.13.1–2</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/attributes-of-god/knowledge-and-wisdom.html">Knowledge and Wisdom</a> › <a href="../topics/attributes-of-god/knowledge-and-wisdom/middle-knowledge-scientia-media.html">Middle knowledge (scientia media)</a></span></div>
<div class="actions"><button class="copy" data-copy="“Besides these two species of divine knowledge, a third was devised by the Jesuits, Fonseca, Lessius, Molina, which they called “middle knowledge.” Is there a middle knowledge in God between the natural and the free? We deny against the Jesuits, Socinians and Remonstrants. The free knowledge depends upon his will and decree by which things pass from a state of possibility to a state of futurition.”

— Francis Turretin, Institutes of Elenctic Theology, 3.13.1–2">Copy</button><a class="share" href="https://x.com/intent/post?text=%E2%80%9CBesides%20these%20two%20species%20of%20divine%20knowledge%2C%20a%20third%20was%20devised%20by%20the%20Jesuits%2C%20Fonseca%2C%20Lessius%2C%20Molina%2C%20which%20they%20called%20%E2%80%9Cmiddle%20knowledge.%E2%80%9D%20Is%20there%20a%20middle%20knowledge%20in%20God%20between%20the%20natural%20and%20the%20free%3F%20We%20deny%20against%20the%20Jesuits%2C%20Socinians%20and%20Remonstrants.%20The%20free%20knowledge%20depends%20upon%20his%20will%20and%20decree%20by%20which%20things%20pass%20from%20a%20state%20of%20possibility%20to%20a%20state%20of%20futurition.%E2%80%9D%0A%0A%E2%80%94%20Francis%20Turretin%2C%20Institutes%20of%20Elenctic%20Theology%2C%203.13.1%E2%80%932&amp;url=https%3A%2F%2F5solasquotes.github.io%2Fquote%2Fdd70aeaad2.html&amp;via=5Solas" target="_blank" rel="noopener">Share on X</a><a class="perma" href="../quote/dd70aeaad2.html">Permalink</a><span class="src none">No free online copy linked</span></div>
</figure><figure class="quote" id="q-0afca7c940" data-kw="">
<blockquote><p>The doctrine of middle knowledge, however, represents contingent future events as contingent and free also in relation to God. This is with reference not only to God’s predestination but also his foreknowledge, for just as in Origen, things do not happen because God knows them, but God foreknows them because they are going to happen. Hence, the sequence is not necessary knowledge, the knowledge of vision, the decree to create (etc.); instead, it is necessary knowledge, middle knowledge, decree to create (etc.), and the knowledge of vision. God does not derive his knowledge of the free actions of human beings from his own being, his own decrees, but from the will of creatures. God, accordingly, becomes dependent on the world, derives knowledge from the world that he did not have and could not obtain from himself, and hence, in his knowledge, ceases to be one, simple, and independent – that is, God. Conversely, the creature in large part becomes independent vis-a-vis God. It did indeed at one time receive “being” (esse) and “being able” (posse) from God but now it has the “volition” (velle) completely in its own hand. It sovereignly makes it own decisions and either accomplishes something or does not accomplish something apart from any preceding divine decree. Something can therefore come into being quite apart from God’s will. The creature is now creator, autonomous, sovereign; the entire history of the world is taken out of God’s controlling hands and placed into human hands. First, humans decide; then God responds with a plan that corresponds to that decision.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/herman-bavinck.html">Herman Bavinck</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Reformed Dogmatics: God and Creation</cite></span></figcaption>
<div class="meta"><span class="t"><a href="../topics/attributes-of-god/knowledge-and-wisdom.html">Knowledge and Wisdom</a></span></div>

a=5Solas" target="_blank" rel="noopener">Share on X</a><a class="perma" href="../quote/0afca7c940.html">Permalink</a><a class="src" href="https://reformedbooksonline.com/middle-knowledge/#:~:text=The%20doctrine%20of%20middle%20knowledge%2C%20however,plan%20that%20corresponds%20to%20that%20decision&amp;text=The%20doctrine%20of%20middle%20knowledge%2C%20however%2C%20represents%20contingent&amp;text=with%20a%20plan%20that%20corresponds%20to%20that%20decision" rel="noopener" target="_blank">Read it online · Reformed Books Online</a></div>
</figure><figure class="quote" id="q-46a7da57f9" data-kw="">
<blockquote><p>Wisdom is God understanding all things intelligible by his essence, 1 Tim. 1:17; Acts 15:18; 1 Jn. 3:20. God comprehending his own essence sees all things, because all possibilities, futuritions and beings, that is, all things that might have been, shall be or actually be, are eminently contained in the divine essence. Whence, by the way it may appear that the divine essence as willing the futurition of things, is that increated idea of all things: which God comprehending, understands the creature better in Himself than it is to be understood in itself. God seeing Himself, sees all things, without exemption of any; always, without intermission; perfectly, without defect: at once, without succession. He is all eye, yet without an eye: all memory, yet without a memory. God understands all things by his essence; angels are thought to understand by an infused habit of the species or images of things concreated with their nature. Men understand by the species or images of things abstracted and received from their objects. Men understand by way of syllogistical discourse, viz. by reasoning; that is, by deducing and gathering conclusions from principles by several acts of their understanding: and by compounding and dividing: that is, by laying the subject and predicate together, or by taking them asunder: and thereby collecting what may be said, or not said truly concerning such a subject. Those truths which men, by reason of the weakness of their understanding, apprehend not without discourse and by compounding and dividing (Thomas, pt. 1, quest. 58, art. 3-4; Polanus, Syntagma, bk. 5, ch. 11): Angels by reason of the quickness and strength of their understanding apprehend readily and as it were at first sight. Whence albeit they understand syllogistical discourse, composition and division, yet (at least compared with men) they may be said not to understand by discourse, nor by composition and division, but intuitively and as it were at first sight.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/john-norton.html">John Norton</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Orthodox Evangelist</cite>, … (London, 1654), ch. 1, Of the Divine Essence, pp. 16-17</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/attributes-of-god/knowledge-and-wisdom.html">Knowledge and Wisdom</a></span></div>

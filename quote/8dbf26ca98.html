<blockquote><p>Regarding the entry in the Liddell-Scott lexion, which quotes Orphic Fragments 21a [pre-4th century BC, which has textual variant] as the only evidence for the general meaning ‘source, origin,’ it would be more accurate if the entry were classified under the category ‘starting-point.’ Indeed, that would allow the entry to fit more easily under the general category in which the editors have placed it, ‘of things, extremity,’ for in this case the thing referred to is a period of time.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/wayne-grudem.html">Wayne Grudem</a></span><span class="wk"><span class="lbl">Work:</span> <cite>‘Does Kefale</cite>, (‘Head’) Mean ‘Source’ Or ‘Authority Over’ in Greek Literature?: a Survey of 2,336 Examples’ Trinity Journal, no. 6.1 (Spring 1985), pp. 38-59, p. 46</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/worship/head-coverings-in-worship.html">Head Coverings in Worship</a></span></div>

<blockquote><p>[Margin Note:] The uncovering of the head not like kneeling We uncover our heads, say they, when we receive the elements, why may we not also kneel? I answer: First, the uncovering of the head is a gesture of reverence only, and that only among some nations, but not of adoration. The Jews, Turks and Mahometans pray with their heads covered. The Grecians and Romans of old, howbeit they walked in public with uncovered heads, except in rain, great heat or mourning, yet in the service of their gods, they had their heads covered. The Europeans this day uncover their heads when they are praying. Kneeling is a gesture of adoration among all nations, either in civil or religious use. Augustine says: ‘Honorat emnis qui adorat, no autem adorat omnes quid onorat;’ ‘Every one that does adore, does honor, but not every one that honors, adores.’ Contra Serm. Arian., ch. 23 I will not kneel to every one to whom I uncover my head civilly. Everyone that stands with his head uncovered in presence of the king is not adoring, as he is who is presenting his petition to the king upon his knee in their sight. A provincial synod holden at London (anno 1603) ordained the head to be uncovered when their service is read in the Church, yet I think they would not have enjoined kneeling. We [the Scots] hear the canonical scripture read [in the administration of the Lord’s Supper] with uncovered heads, but yet we kneel not. The words of Christ, which He uttered at the institution are still and often uttered; that same voice sounds through all the tables of the world; his actions, which were divine and holy, are reiterat[ed]. In Gratian’s decree (De consecrat. dist. 1, ch. 68) we have a superstitious direction of Pope Anastasius, that when the Gospel is read in the Church, those that are present shall not sit, but stand, venerabiliter curvi, bowing reverently, hearken and adore. Wherefore more at the hearing of the Gospel than the [reading of the] Epistle[s], which is also Evangelical? Yet you see, howbeit that standing with bowing be more than to have the head uncovered, it was but veneration. And, whereas he says, Et fideliter adorent, the gloss has, id est venerentur, because the word ‘adoring’ is taken there in a large sense, as ye may see [in] sundry places above cited, not for that which is in a strict sense called adoration. Adoration in strict sense is kneeling or prostration. Whereas Matthew says, ch. 8, of the leprous man, that he worshipped Christ, or adored Christ, as the Latin translation has according to the original, Mk. 1:40, He kneeled down to Him, and Luke 5:12, that he fell in his face. Suchlike, where it is said of the Cananitish woman, Mt. 15:25, that she worshipped, or adored Him: et adoravit eum, Mk. 7:25, it is said that she fell at his feet. The Greek word [Greek], signifies to fall down like a dog o••whelp at the feet of another, as our Lord. Further, our heads are not other way uncovered in the act of receiving than in the rest of the time of the celebration when we are not near the elements. And thirdly, the uncovering of our head is compatible with the variety of actions in time of celebration: praying, singing, the words of the institution, and chapters read, but adoration directed, as they pretend to God, cannot be without presenting our petitions and thanks to God, which requires a several part of the action by itself.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/david-calderwood.html">David Calderwood</a></span><span class="wk"><span class="lbl">Work:</span> <cite>A Re-examination of the Five Articles enacted at Perth, anno 1618</cite>, … (1636), Of the Communicants’ gesture in the act of receiving, eating and drinking’, 4th Part, ch. 5, ‘Kneeling in the act of receiving the sacramental elements of the supper is idolatry’, pp. 104-6</span></figcaption>

</figure><figure class="quote" id="q-3f89644db8" data-kw="">
<blockquote><p>It is partly true, that ‘the men’ were peculiar in their dress, but it is not at all true, that they adopted any kind of badge, or that they wore a uniform that distinguished them as a class. In the circle in which they moved, there were attempts made, by the careless and worldly, to follow, at a distance, the mutations of fashion in their attire. The men would not, and, merely, on that account, their dress was peculiar. It was often the case, that they wore long hair, partly, because a regard to appearances did not remind them of cutting it, and, partly, that they might discountenance the attempts at clipping and combing ‘after the fashion,’ by which many around them evidenced their conformity to the world. It is true, also, that they often appeared with a handkerchief on their heads, but so did many besides them, who met to worship under a scorching sun, and regarded it as unbecoming to have a hat or a bonnet on their heads. If their dress seemed peculiar, it was only because it was old-fashioned, even in the highlands. Its singularity was not owing to any affectation, or to an undue regard to what was external and trivial.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/john-kennedy.html">John Kennedy</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Days of the Fathers in Ross-Shire 4th</cite>, ed. (Toronto: James Campbell &amp; Son, 1867), pp. 87-88</span></figcaption>

<blockquote><p>For if one ought not to have the head bare, but everywhere to carry about the token of subjection, much more is it becoming to exhibit the same in our deeds.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/john-chrysostom.html">John Chrysostom</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Homily 26, on 1 Cor. 11:2 ff. in The Homilies of S. John Chrysostom</cite>, … on the First Epistle of St. Paul the Apostle to the Corinthians, Part I, Homilies I-XXIV (Oxford, 1839), pp. 348-68 | The following shows that Chrysostom understood the veil to be on par with other regular garments, taught by the light of nature, it not being a religiously appointed rite:, p. 361</span></figcaption>

<div class="actions"><button class="copy" data-copy="“For if one ought not to have the head bare, but everywhere to carry about the token of subjection, much more is it becoming to exhibit the same in our deeds.”

<blockquote><p>Paul… his traditions were the Gospel of Christ and honest manners and living, and such a good order as becomes the doctrine of Christ. As that a woman obey her husband, have her head covered, keep silence, and go womanly and christianly apparelled: that children and servants be in subjection: and that the young obey their elders, that no man eat but he that labours and works, and that men make an earnest thing of God’s Word, and of his holy Sacraments: and to watch, fast, and pray, and such like, as the Scripture commands. Which things he that would break were no christian man… There were also certain customs alway which were not commanded in pain of hell or everlasting damnation, as to watch all night, and to kiss one another: which as soon as the people abused, then they brake them. For which cause the bishops might break many things now in like manner. Paul also in many things which God had made free, gave pure and faithful counsel without tangling of any man’s conscience, and without all manner commanding under pain of cursing, pain of excommunication, pain of heresy, pain of burning, pain of deadly sin, pain of hell, and pain of damnation. As thou mayst see. 1 Cor. 7.</p></blockquote>

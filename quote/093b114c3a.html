<main class="wrap"><figure class="quote" id="q-093b114c3a" data-kw="">
<blockquote><p>There is yet something more required; it is not enough that we are not guilty, we must also be actually righteous,—not only all sin is to be answered for, but all righteousness is to be fulfilled. By taking away the guilt of sin, we are as persons innocent; but something more is required to make us to be considered as persons obedient. I know nothing to teach me that an innocent person shall go to heaven, be rewarded, if he be no more but so. Adam was innocent at his first creation, but he was to ‘do this,’ to ‘to keep the commandments,’ before he entered into ‘life:’ he had no title to life by innocency. This, then, moreover, is required, that the whole law be fulfilled, and all the obedience performed that God requires at our hands. This is the soul;s second inquiry; and it finds a resolution only in the Lord Christ: “For if, when we were enemies, we were reconciled to God by the death of his Son, much more, being reconciled, we shall be saved by his life,’ Rom v. 10. His death reconciled us; then we are saved by his life. The actual obedience which he yielded to the whole law of God, is that righteousness whereby we are saved; if so be we found in him, not having on our own righteousness which is of the law, but the righteousness which is of God by faith. Phil. iii. 9. This I shall have occasion to hand more at large hereafter.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/john-owen.html">John Owen</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Works</cite>, 2.105.</span></figcaption>

/" rel="noopener" target="_blank">Read it online · Heidelblog</a></div>
</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-b304bdf8c2" data-kw="">
<blockquote><p>As this is a great error [to mingle law and gospel], so it is a very dangerous error. If a man attempts to add any works of his own to the consummate righteousness of Jesus Christ as the ground of his justification before God, Christ profits him nothing. The obedience and death of Christ have “become of no effect” to him. “Behold, I Paul say unto you, that if ye be circumcised, Christ shall profit you nothing. For I testify again to every man that is circumcised, that he is a debtor to do the whole law. Christ is become of no effect unto you, whosoever of you are justified by the law; ye are fallen from grace” (Gal. 5:2–4). If a man tries to connect his own performances with the righteousness of Jesus Christ for the pardon of his sins and the acceptance of his person as righteous in the sight of God, he deprives himself of all benefit from that perfect righteousness. If he relies on his own works of obedience for even the smallest part of his title to eternal life, “he is a debtor to do the whole law” in its covenant form, and he fixes himself under the dreadful curse of it. Christ will profit him nothing unless he relies on His infinitely glorious righteousness only for all his title to justification and eternal life. A sinner depends on the righteousness of Christ for justification to no good purpose if he does not rely on it only, and neither in whole nor in part on his own obedience.</p></blockquote>

</figure><figure class="quote" id="q-6d89d98014" data-kw="">
<blockquote><p>It ought to be the primary goal of every Christian to put aside confidence in works and grow stronger in the belief that we are saved by faith alone. Through this faith the Christian should increase in knowledge not of works but of Christ Jesus and the benefits of his death and resurrection.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/martin-luther.html">Martin Luther</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Freedom of a Christian</cite></span></figcaption>

</figure><figure class="quote" id="q-b4fd6cf121" data-kw="">
<blockquote><p>May faith be properly called a condition The question has been keenly agitated between Calvinists, whether faith itself should be spoken of as a condition of the covenant. One party has denied it, because they supposed that the language which represented man as performing a condition of his own salvation would make an inlet for human merit. But it is most manifest that there is a sense in which faith is the condition, in all such passages as Jn. 3:16; Acts 8:37; Jn. 11:26; Mk. 16:16. No human wit can evade the fact, that here God proposes to man a something for him to do, which, if done, will secure redemption; if neglected, will ensure damnation—and that something is in one sense a condition. But of what kind? Paul everywhere contrasts the condition of works, and the condition of faith. This contrast will be sufficiently established, and all danger of human merits being intruded will be obviated, if it be observed that faith is only the appointed instrument for receiving free grace purchased by our Surety. It owes its organic virtue as such, to God’s mere appointment, not to the virtue of its own nature. In the Covenant of Works, the fulfilment of the condition on man’s part earned the result, justification by its proper moral merit. In the Covenant of Grace, the condition has no moral merit to earn the promised grace, being merely an act of receptivity. In the Covenant of Works, man was required to fulfil the condition in his own strength. In the Covenant of Grace, strength is given to him to believe, from God.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/robert-l-dabney.html">Robert L. Dabney</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Syllabus &amp; Notes of the Course of Systematic &amp; Polemic Theology</cite>, 2nd ed. (St. Louis: Presbyterian Publishing Company, 1878), pp. 438–39</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/justification/faith-alone.html">Instrumental Cause: Faith Alone</a></span></div>

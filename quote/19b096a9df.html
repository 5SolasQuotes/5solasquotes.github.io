<main class="wrap"><figure class="quote" id="q-19b096a9df" data-kw="">
<blockquote><p>Although the oath which Joshua and the princes of Israel made to the Gibeonites was made unadvisedly, and without asking counsel from the mouth of the Lord, yet, some hundred years after, being broken, that breach brought a national judgment, till justice was done upon the offenders. How much more may a national judgment be feared, if even in our days the contempt and violation of a most lawful and sacred oath be winked at? Surely God will not wink at their sin who wink at his dishonour. Better not to have vowed than not to pay and perform.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/george-gillespie.html">George Gillespie</a></span><span class="wk"><span class="lbl">Work:</span> <cite>A treatise of miscellany questions</cite>, (1649; Edinburgh, 1844), p. 86.</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/worship/oaths-and-vows.html">Oaths and Vows</a></span></div>

</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-a23ef92dc8" data-kw="">
<blockquote><p>I am neither so blind, wicked or singular as to deny the common doctrine of casuists, protestants and Papists, that though a vow be both sinfully imposed and sinfully taken, yet it binds in materia necessaria et licita [in necessary and lawful matter]. Yea, that if part of the matter be unlawful, yet it binds to that part which is lawful. Else a knave might exempt himself from the performance of all his vows by foisting in some unlawful matter or by making them in an unlawful manner.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/richard-baxter.html">Richard Baxter</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The English Nonconformity as under King Charles II &amp; King James II Truly Stated &amp; Argued</cite>, (1683; London: Parkhurst, 1689), ch. 37, pp. 126-27</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/worship/oaths-and-vows.html">Oaths and Vows</a></span></div>

— Richard Baxter, The English Nonconformity as under King Charles II &amp; King James II Truly Stated &amp; Argued, (1683; London: Parkhurst, 1689), ch. 37, pp. 126-27">Copy</button><a class="share" href="https://x.com/intent/post?text=%E2%80%9CI+am+neither+so+blind%2C+wicked+or+singular+as+to+deny+the+common+doctrine+of+casuists%2C+protestants+and+Papists%2C+that+though+a+vow+be+both+sinfully+imposed+and+sinfully+taken%2C+yet+it+binds+in+materia+necessaria+et+licita+%5Bin+necessary+and+lawful+matter%5D.+Yea%2C+that+if+part+of+the+matter+be+unlawful%2C+yet+it+binds+to+that+part+which+is+lawful.+Else+a+knave+might+exempt+himself+from+the+performance+of+all+his+vows+by+foisting+in+some+unlawful+matter+or+by+making+them+in+an+unlawful+manner.%E2%80%9D%0A%0A%E2%80%94+Richard+Baxter%2C+The+English+Nonconformity+as+under+King+Charles+II+%26+King+James+II+Truly+Stated+%26+Argued%2C+%281683%3B+London%3A+Parkhurst%2C+1689%29%2C+ch.+37%2C+pp.+126-27&amp;url=https%3A%2F%2F5solasquotes.github.io%2Fquote%2Fa23ef92dc8.html&amp;via=5Solas" target="_blank" rel="noopener">Share on X</a><a class="perma" href="../quote/a23ef92dc8.html">Permalink</a><a class="src" href="https://reformedbooksonline.com/on-oaths-vows/#:~:text=I%20am%20neither%20so%20blind%2C%20wicked,making%20them%20in%20an%20unlawful%20manner&amp;text=I%20am%20neither%20so%20blind%2C%20wicked%20or%20singular&amp;text=or%20by%20making%20them%20in%20an%20unlawful%20manner" rel="noopener" target="_blank">Read it online · Reformed Books Online</a></div>
</figure><figure class="quote" id="q-49f1b34636" data-kw="">
<blockquote><p>§44. 4. And though the taking of an oath be a sort of worship, yet not the natural worship of the First Commandment, nor the instituted of the Second, but the reverent use of his name in the third; so that it is not primarily an act of worship, but reductively and consequentially: It being the principal use of an oath to confirm the truth and end strife, by appealing to God, which appellation is indeed an acknowledgment of his government and justice. And the laying the hand upon the book, or kissing it, is but a professing sign of my own intentions, such as my words themselves are: and therefore is left to human choice, and a lawful thing. And I have met but with very few [non-conformists], among all our ceremonies, that questioned this.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/richard-baxter.html">Richard Baxter</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Five Disputations of Church-Government &amp; Worship</cite>, (London: R.W., 1659), 5th Disputation, ch. 2, pp. 411-12</span></figcaption>

</figure><figure class="quote" id="q-0e46a7aa42" data-kw="">
<blockquote><p>But if they [the Resolutioners] will extend it [the ordination vows] further, and say that it is meaned of absolute subjection to the sentence of his brethren, whether he have offended or not, they may as well, and with more color of reason, say that he is bound by his oath, not only to give subjection, but also obedience† to all their admonitions, whether just or unjust, lawful or unlawful; because there is no express limitation in the words of the oath, these qualifications, being as we said before, amongst the praecognita [assumptions] and praesupposita [presuppositions] of all such questions and answers, and there being no need to express them, except where there are grounds of jealousy.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/james-guthrie.html">James Guthrie</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Protesters no Subverters, and presbyterie no papacie</cite>, … (1658), p. 60</span></figcaption>

<blockquote><p>II. Although, in relation to the foreknowledge and decree of God, the first cause, all things come to pass immutably and infallibly:[h] yet, by the same providence, he ordereth them to fall out, according to the nature of second causes, either necessarily, freely, or contingently.[i] [h] Acts 2:23. [i] Gen. 8:22. Jer. 31:35. Exod. 21:13 with Deut. 19:5. 1 Kings 22:28,34. Isa. 10:6,7.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/westminster-assembly.html">Westminster Assembly</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Confession of Faith</cite>, 5.2</span></figcaption>

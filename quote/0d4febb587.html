<main class="wrap"><figure class="quote" id="q-0d4febb587" data-kw="">
<blockquote><p>Anyone would think that the deceased has been given enough praises, after we have celebrated his country, lineage, age, honours, and erudition, but these are merely disgraces and splendid vices if to them is not added an unfeigned love of God and neighbour. What good is proven argument concerning secret and obscure matters, the ignorance of which will not harm us in the last judgment? What good is it to be most diligent in asking questions but most negligent in rooting out vices and cultivating virtues? What good is arduous disputation about the Trinity if we lack submission and displease the Trinity?

One day before the divine tribunal the doctor of theology will not be asked so much what he read and how elegantly and neatly he spoke and wrote, but what he did and how he lived. O how greatly on that fearful day will he excel in understanding the penalty due to sinners, how well will he grasp its most accurate definition!

All those who are swollen with the vanity of knowledge and seek to be called doctors, magistrates, and great, illustrious, and honoured men, but are devoid of Christian charity, are the most foolish of all mortals and will be rejected and mocked by God and the inhabitants of heaven. That man alone is great who thinks often of his own smallness, and has great charity. That man is truly learned who pursues the will of God and neglects his own. The only knowledge worthy of love is to know and esteem Christ and him crucified, and to condemn all earthly things as loss and dung. To fear Jehovah, that alone is wisdom, and to depart from evil, that alone is understanding.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/henricus-pontanus.html">Henricus Pontanus</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Funeral Oration on the Death of Pieter van Mastricht, 24 February 1706 in Pieter van Mastricht, Theoretical-Practical Theology Volume 1: Prolegomena</cite></span></figcaption>

</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-2954cf3d83" data-kw="">
<blockquote><p>Christ preached the Gospel to those that He knew sinned against the Holy Ghost, to the Pharisees who persecuted Christ to death and others, Mt. 12:31-34; Jn. 15:22-25; Jn. 7:28-29; Jn. 12:35-38; Jn. 10:31-32; Jn. 11:47-48… the word is a converting ordinance out of question, and preached to heathen and to the non-converted, though they refuse to embrace and believe the Gospel, and refuse to entertain the preachers of it: as is clear, Acts 19:22-25; Tit. 1:10-13; 2 Tim. 3:25-27. The texts that Master Prynne alledges, that the Gospel should not be preached to heathen who refuse to embrace and believe the Gospel, to wit, Mt. 10:14-15; Lk. 9:5; Acts 13:46, are to no purpose, for Mt. 10; Lk. 9, is but a temporary commandment, given for a time, that the disciples should depart from those houses of Judea (there is nothing of the heathen; but by the contrary the apostles are forbidden to go to Samaritans or gentiles at all, Mt. 10:5-6 [which was unique to those circumstances]) who would not receive the peace of God in the Gospel, which precept the apostles in the story of the Acts did not observe, but preached the Gospel to many heathen who refused to embrace and believe the Gospel: As Acts 16 and 17, and 19:2. The place Acts 13:15 is meant of the blaspheming Jews, to whom Paul preached long after they persecuted and stoned the prophets, and had killed the Lord of life, Acts▪2 and 4, and 8, and 9; Mt. 23:37-38. 3. Those places, are to better color of purpose brought by Arminians and Socinians to prove that the Gospel is preached to people for their good entertainment thereof, and denied to others for their unworthiness, and because they will not welcome it; So the Arminians in the conference at Hague, pp. 87-89, God sends the Gospel not according to his absolute will, sed ob alias causas in homine latent•s, for secret causes in man. Arminius, Against Perkins, p. 199, ‘The will of God in sending the Gospel has causes in the will of man according to that,’ habenti dabitur: So Corvinus, Ad Wallachros, p. 44. Socinus, Commentary on 1 Jn. 4, p. 307 says the same: and Mr. Prynne is pleased in the same sense to cite them, I conceive imprudently, for I believe that Reverend and learned man does hate those impious sects, the enemies of the grace of God; but truly if this be a rule to pastors to spread the Gospel, that they are to offer and give the pearl of the preached Gospel to those that willingly receive it and harbour the preachers, and presently to depart and preach no more the Word of the Kingdom to those who refuse it, as the places Mt. 10:14 and Lk. 9:5 carry that sense, because they are heathens who refuse to embrace and believe the Gospel, and harbor the preachers, as (the worthy divine says) conceiving that to be a casting of pearls to dogs and swine; I see not how the preachers and spreaders of the Gospel to the heathen are to believe that God out of mere grace and the good pleasure of his will, without respect to good or bad deserving, sends the Gospel to some and denies it to others.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/samuel-rutherford.html">Samuel Rutherford</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Divine Right of Church Government</cite>, (London, 1646), ch. 23, pp. 516-18</span></figcaption>

<blockquote><p>We receive frequent and mournful relations of that accursed practice of duels, yea and among persons of our religion; and though we believe this violent and brutish sin is so strongly rooted, as to elude and reject all remedies, yet because of its atrociousness and enormity, we desire your holy synod to consuls of the last and sovereign remedy, even that dreadful power which the word of God has given unto his Church to draw out the spiritual sword against such notorious delinquents, without connivency, dispensation, or respect of persons, that by its implacable severity against those daring rebels, the Lord blessing his own ordinance, their feet which ran swiftly to shed innocent blood may be hereafter stopped and restrained. At least, let us weep and groan before the Lord that this evil may never be imputed to us, that we may be delivered from the guilt of so much blood as has been wickedly spilt among us, that it may never lie at our doors, nor our consciences may ever reproach us for having lent our heart or hands unto that murdering spirit, and that we may never be marked with this brand of infamy which is peculiar to the enemies of God, to have been executioners of his vengeance upon themselves.</p></blockquote>

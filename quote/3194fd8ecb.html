<main class="wrap"><figure class="quote" id="q-3194fd8ecb" data-kw="">
<blockquote><p>14. Nor do we take ourselves bound by Christ to one place or one time, or manner of teaching, or to speak always to a great assembly. But all these are circumstances which we must fit to the end and success of our work, and must take that course, and with that variation which tends to the Church’s good. Christ, that bid his apostles when they were persecuted in one city, fly to another, allows us to be where we may serve Him best. If forbearing all preaching for some days or weeks would tend to the Church’s good (as by procuring us liberty afterward, etc.) it is lawful to forbear. If preaching often to a few be more for the Church’s good than to preach but once or twice to many, we may then lawfully choose the smaller number. So that in such circumstances, that may be one man’s duty which is anothers sin.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/richard-baxter.html">Richard Baxter</a></span><span class="wk"><span class="lbl">Work:</span> <cite>An Apology for the Nonconformists’ Ministry… (1668-1669; 1675; London: 1681)</cite>, p. 16</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/church-government-and-the-ministry/the-call-to-ministry.html">The Call to Ministry</a></span></div>

</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-95255754b2" data-kw="">
<blockquote><p>When subsequently one presbyter was chosen to preside over the rest, this was done to remedy schism and to prevent each individual from rending the church of Christ by drawing it to himself. For even at Alexandria from the time of Mark the Evangelist until the episcopates of Heraclas and Dionysius the presbyters always named as bishop one of their own number chosen by themselves and set in a more exalted position, just as an army elects a general, or as deacons appoint one of themselves whom they know to be diligent and call him archdeacon. For what function, excepting ordination, belongs to a bishop that does not also belong to a presbyter?</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/jerome.html">Jerome</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Letter 146 (to Evangelus)</cite>, §1</span></figcaption>

</figure><figure class="quote" id="q-73e5398435" data-kw="">
<blockquote><p>VIII Rule. We must give place to the sway of the times wherein we live, so far forth as may stand with keeping faith and a good conscience. We may not be temporizers and change our religion with the times: but yet we may and must give place to times as we give place to the stream, so that it be done with keeping of true religion and good conscience. This rule was practiced by Paul… he was three years in Ephesus, an idolatrous place, where the great goddess Diana was worshipped; yet in all that time he contained himself and spake nothing in particular against Diana, but ony in general against false gods, saying that ‘they be no gods that are made with hands,’ v. 26. Nay, Alexander could not charge him with this, that he had in all that while blasphemed their goddess Diana. Paul therefore was feign to yield to the sway of those times that so he might do some good in Ephesus by his ministry. Whereas, if he had spoken against Diana directly, it had not been possible for him to have done that good by preaching which otherwise he did.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/william-perkins.html">William Perkins</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Cases of Conscience (Cambridge. 1606), bk. 3, ch. 2</cite>, pp. 481-84</span></figcaption>

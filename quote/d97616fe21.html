<main class="wrap"><figure class="quote" id="q-d97616fe21" data-kw="">
<blockquote><p>Jesus Christ, our Saviour, full of grace and truth, is the chief character found in the Book of Psalms. He never poses, but is seen in multiform activities and appearances. His personal traits are graceful and symmetrical; His attributes and moral qualities show exquisite perfection. Jesus frequently mentioned the Psalms as containing the things concerning Himself. In the inspired Psalter we have an account of Christ’s commission, ministry, sacrifice, victory and exaltation. He is seen with no inequality of features or disparity of powers, such as of necessity appear in all sectarian hymnbooks; without atrophied or overgrown faculties and attributes so prominent in man-made manuals of praise.

In the Psalms, Jesus arises in solitary greatness and superlative dignity. “He is fairer than the children of men”; “mighty with glory and majesty”; “anointed with the oil of joy above His fellows”; “great in power, and terrible in His doings”; “the Lord strong and mighty in battle”; “the King of glory,” scaling the heights of heaven, and entering into the eternal city in triumph. Jesus in the Psalms reaches the utmost extremes of life, and fills all the space between. He is matchless in greatness and meekness; in majesty and humility; in mightiness and gentleness; in the execution of judgment, and in compassion for sinners. Jesus ascended up on high and occupies the loftiest seat in glory; yet regards with loving favour all who are lowly and contrite. Jesus makes the great sun to rise each morning, rejoicing as a strong man to run his race; yet forgets not to light the candle of him who sits in darkness and distress. Jesus calls out the stars nightly, as His unfailing choir to sing His glory; yet takes pleasure in listening to praise offered by the infant on the mother’s breast.

Jesus speaks with a powerful voice that breaks the cedar, and makes the mountain tremble; yet softly whispers comfort in the ears of those who walk in the valley of the shadow of death. Jesus, with imperial authority, commands twenty thousand chariots, and thousands of angels; yet receives the trembling soul into His presence, and entertains the lowliest in His pavilion. Jesus is wroth with sinners every day; fire goes before Him and burns up His foes round about; the glory of His face is to them a consuming flame; yet He always has a pleasant countenance for the upright.

Jesus, with uplifted hand, solemnly swears that the stubborn and rebellious shall not enter into His rest; yet opens wide the gate through which the righteous shall enter in, and dwell with God. Jesus opens the windows of heaven; the clouds pour out water; the skies sound loudly; the earth is deluged for the sins of the people; yet He carefully treasures up the tear-drops of the penitent in His bottle. Jesus has the mighty hosts of the universe at His command and in His service; yet girds himself as a nurse and smoothes the bed of His sick servant.

O this blessed Jesus! this matchless Jesus, thoroughly accomplished for His redemption work, glorious in all His attributes and activities! How His presence lights up the Psalms! The Psalms are vibrant with the energy of Jesus, and brilliant with the brightness of His Person. They are tender with the sympathy of His heart, and awe-inspiring with flashes of His majesty. They voice His messages of peace, and echo His reproofs against sin. This great Psalter of God is the ivory Palace of Praise, where Jesus is enthroned in the presence of His devout worshippers. His garments smell of myrrh, aloes, and cassia, the rich varieties of grace by the anointing of the Holy Spirit.</p></blockquote>

</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-0374cb9c06" data-kw="">
<blockquote><p>In the point of excellency, no other form of psalmody can bear a comparison with the songs of inspiration. Imperfection is stamped upon all the works of man; the most highly finished pieces of sacred poetry frequently discover weakness of sentiment, or are marred by improper figures and allusion. Of the Psalms alone, it can be truly declared that they are perfect. The Holy Spirit has transcribed his own character of purity, wisdom and love, in these unrivalled compositions. This excellence they claim above every rival, that, as the words of God, they are of tried power to enlighten the mind, purify the affections, subjugate the will, and transform the whole inner man. It accords with the experience of the saints in every age to believe that the Spirit’s hallowed influences descend most copiously upon his own words: the most sensible relief, encouraging counsel, and abounding comfort are experienced in calling them to remembrance, and by faith applying them. As the design of singing praise is evidently to elevate the affections, and to excite the hope and peace and joy, the believer has reason to expect that, in using the inspired Psalms, which are the immediate productions of the Holy Spirit, these spiritual emotions will be awakened, and the enjoyment of their appropriate objects realized; the same confidence, in an equal measure, he has no ground to entertain from the use of uninspired psalmody.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/covenanter.html">Covenanter</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Covenanter</cite>, Jan. 1835, p. 4</span></figcaption>

</figure><figure class="quote" id="q-c802b39c4c" data-kw="">
<blockquote><p>I say, we close our prayers ordinarily with praise and glory to the Father, the Son, and the Holy Ghost; because it is warrantable from Scripture-practice, to wit, in blessing; and agreeable to the truth and liberty of Gospel-worship; and yet we refuse it in singing (mark it, not in praising), because, for that exercise, the Lord having instructed us with a sufficient plenty of Divine composures, we think it neither needful nor acceptable that we should gratify an arbitrary imposition in receiving the supplement of a human addition: It is true, the words are Scriptural, but can you say that the Scripture bears any such allowance for their use in singing as it doth for the Psalms of David? Yea and many other spiritual songs in Scripture, whereof you might indeed with some reason reprehend our too great disuse:</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/robert-macward.html">Robert MacWard</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The True Non-Conformist</cite>, … ([Amsterdam], 1671), The Fifth Dialogue Answered. MacWard was the protege of Samuel Rutherford. He does not explicitly cite Eph. 5:19 &amp; Col. 3:16 below, but the allusions to those passages are obvious. He appears to allow for singing Scripture songs in some respect., p. 279-80</span></figcaption>

<div class="actions"><button class="copy" data-copy="“I say, we close our prayers ordinarily with praise and glory to the Father, the Son, and the Holy Ghost; because it is warrantable from Scripture-practice, to wit, in blessing; and agreeable to the truth and liberty of Gospel-worship; and yet we refuse it in singing (mark it, not in praising), because, for that exercise, the Lord having instructed us with a sufficient plenty of Divine composures, we think it neither needful nor acceptable that we should gratify an arbitrary imposition in receiving the supplement of a human addition: It is true, the words are Scriptural, but can you say that the Scripture bears any such allowance for their use in singing as it doth for the Psalms of David? Yea and many other spiritual songs in Scripture, whereof you might indeed with some reason reprehend our too great disuse:”

rayers,reason%20reprehend%20our%20too%20great%20disuse&amp;text=I%20say%2C%20we%20close%20our%20prayers%20ordinarily%20with&amp;text=with%20some%20reason%20reprehend%20our%20too%20great%20disuse" rel="noopener" target="_blank">Read it online · Reformed Books Online</a></div>

<blockquote><p>Those who wish to know the bearing of Scripture on human hymns as matter of God’s worship should read the two excellent little treatises, respectively entitled, The True Psalmody, and The Public Worship of God, the first of which is an American publication, and the other was penned by the late Dr. [James] Gibson.

It is enough to state here that the Psalms are as much superior to uninspired hymns as God’s Word is to man’s word, and we ought to serve God with the best; that there is no warrant for worshipping God with human hymns, and therefore we have no ground for hoping that such praise will be accepted; and, further, while admitting that metrical translations of other portions of the Bible are not to be compared with mere human hymns, the fact of God’s having gathered the Psalms, Songs and Hymns of various inspired writers into one Book of Psalms, seems conclusively to show that that Book alone was meant to serve as our manual of praise.

Christ specially referred to “the Book of Psalms,” and Paul, quoting the words, “Thou art my Son, this day have I begotten thee,” says they are “ written in the second Psalm,” thus indicating that they were then arranged in their present order. There must be some reason why the Prayer or Psalm of Moses in the 90th Psalm found a place in that Book, though his Song in the 15th chapter of Exodus did not; why David’s Psalm of thanksgiving, when the ark was brought to Zion, is reproduced in the 105th, 96th, and 106th Psalms; why the 14th and 53rd Psalms are almost exactly the same; and why the 108th Psalm is embodied in the 57th and 60th. The reason given above seems the most satisfactory.</p></blockquote>

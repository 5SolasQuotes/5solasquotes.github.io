<main class="wrap"><figure class="quote" id="q-973f800a2f" data-kw="">
<blockquote><p>The will of God is also to be viewed in the light of the various ‘affections’ attributed to God. these ‘affections’ are, in man, termed emotions or passions and are associated with human weakness and mutability. In relation to God, however, the ‘affections’: ‘do not designate any passions or emotions, nor are to be understood as diverse divine wills, for this would imply mutation in God, but as acts of the same will, indicating its different relations.’ (Pictet, Theol. chr. I.vii.1) Of course, the immutability of God, like his being unmoved, describes a God who is also actus purus [pure act]: thus neither concept indicates a divine immobility or quiescence.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/richard-muller.html">Richard Muller</a></span><span class="wk"><span class="lbl">Work:</span> <cite>PRRD</cite>, (Baker, 2003), vol. 3, pt. 2, ch. 5.4, D. The ad intra Distinctions, p. 454</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/attributes-of-god/affections-and-passions-in-god.html">Affections and Passions in God</a></span></div>

</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-067bfa5580" data-kw="">
<blockquote><p>‘And it repented the Lord that He had made man on the earth, and it grieved Him at his heart’ ([Genesis] 6:6). This, of course, is anthropomorphic language; it speaks of God as if He were a man. Actually, God does not repent (1 Sam. 15:29); God does not change His mind; He has a single, consistent purpose that He follows from eternity to eternity. When the Bible speaks of God as ‘repenting’ or changing His mind, this means that He changed His attitude toward some of His creatures. The change of attitude itself was part of the original purpose of God and was planned from eternity. So, in the present passage, the truth is expressed that God changed His attitude toward the human race. Human sin had developed to such an extreme degree that the purpose for which man had been created could no longer be accomplished. A new beginning had to be made with the godly remnant of the race, while the mass of the wicked had to be destroyed. This, of course, was known and planned by God from eternity; the change was in God’s attitude toward man, not in God’s own intentions and purposes.</p></blockquote>

<blockquote><p>Helm (1990) urged the coining of an entirely new term, ‘theomotions’, to express divine affect in contradistinction to human varieties [Helm, ‘The Impossibility of Divine Passibility’ in ed. N.M. de S. Cameron, The Power &amp; Weakness of God (Edinburgh: Rutherford House, 1990), pp. 119-140]. And Scrutton (2005) suggested that differentiating ‘passions’ from ‘affections’, a la Augustine and Aquinas, would move the conversation forward.</p></blockquote>

</figure><figure class="quote" id="q-05df01efa5" data-kw="">
<blockquote><p>We may be reminded that the [Westminster] Confession declares God to be ‘without passions.’ So the theologians tell us that we must ascribe to Him no ‘passive powers’; for then He would not be immutable. He acts on everything, but is acted on by none. He is the source, but not the recipient of effects. This is indisputable. But we should not so overstrain the truth as to reject two other truths. One is, that while God has no passions, while He has no mere susceptibility such that his creature can cause an effect upon it irrespective to God’s own will and freedom, yet He has active principles. These are not passions, in the sense of fluctuations or agitations, but none the less are they affections of his will, actively distinguished from the cognitions in his intelligence. They are true optative functions of the divine Spirit. However anthropopathic may be the statements made concerning God’s repentings, wrath, pity, pleasure, love, jealousy, hatred, in the Scriptures, we should do violence to them if we denied that He here meant to ascribe to Himself active affections in some mode suitable to his nature. And it is impossible for us to suppose an agent without active principles, as well as cognitive, as we could not believe that the compass could move the ship without any motive power. The other truth is, that objective beings and events are the real occasions, though not efficient causes, of the action both of the divine affections and will. Are not many divines so much afraid of ascribing to God any ‘passive powers,’ or any phase of dependence on the creature, that they hesitate even to admit that scriptural fact? But why should they recoil from the simple statements of his Word on this point, unless they were confused or misled by the old sensualistic view, which regarded the objective impression as somehow the efficient, instead of the mere occasion, of the following activities of the percipient soul: “God is angry with the wicked every day” (Ps. 7:11); “But the thing that David had done displeased the Lord;” “My delight is in her” (Is. 62:4); “In these things I delight, saith the Lord” (Jer. 9:24). Is all this so anthropopathic as not even to mean that God’s active principles here have an objective? Why not let the Scriptures mean what they so plainly strive to declare? But some seem so afraid of recognizing in God any susceptibility of a passive nature that they virtually set Scripture aside, and paint a God whose whole activities of intelligence and will are so exclusively from Himself that even the relation of objective occasion to Him is made unreal, and no other is allowed than a species of coincidence or preëstablished harmony. They are chary of conceding (what the Bible seems so plainly to say) that God is angry because men sin; and would go no farther than to admit that somehow He is angry when men sin, yet, because absolutely independent, angry only of Himself.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/robert-l-dabney.html">Robert L. Dabney</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Discussions</cite>, vol 1, ‘God’s Indiscriminate Proposals of Mercy’</span></figcaption>

<main class="wrap"><figure class="quote" id="q-b219a92395" data-kw="">
<blockquote><p>Jesus willingly suffered to save us from eternal suffering. He warns us, however, that as long as we are in this fallen world we will undergo temporal suffering, especially at the hands of the wicked. Self-denial and a willingness to suffer is, therefore, key to following Christ.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/conrad-mbewe.html">Conrad Mbewe</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Post on X (@ConradMbewe)</cite>, Oct 23, 2020</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/trials-the-cross-and-comfort/suffering-and-the-cross.html">Suffering and the Cross</a></span></div>

</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-eb60913018" data-kw="Contentment">
<blockquote><p>Q. 86. What is forbidden in the tenth commandment? A. The tenth commandment forbids all discontentment with our own estate (1 Kings 21:4; Est. 5:13; 1 Cor. 10:10), envying or grieving at the good of our neighbor (Gal. 5:26; James 3:14, 16), and all inordinate motions and affections to anything that is his (Rom. 7:7–8; 13:9; Deut. 5:21).</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/benjamin-keach.html">Benjamin Keach</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Baptist Catechism</cite>, Q. 86</span></figcaption>

</figure><figure class="quote" id="q-9306f26ff2" data-kw="Affliction Comfort">
<blockquote><p>As all good things, so all bad things are ordered by providence for the good of the church. That which in its own nature is an injury, by God&#x27;s ordering puts on the nature of a mercy; and what is poison in itself, by the almighty art becomes a sovereign medicine. Are God&#x27;s dispensations in their own nature destructive? That wise physician knows how to make poisons work the effect of purges. Are they sharp? It is to humble and purge the church. As shadows serve to set out the pictures, so the darkest passages of providence are made by God to commend the beauty of those glorious things he works for his church.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/stephen-charnock.html">Stephen Charnock</a></span><span class="wk"><span class="lbl">Work:</span> <cite>A Treatise on Divine Providence</cite>, Discourse on 2 Chron. 16:9, Doct. 2 (all providences for the good of the church)</span></figcaption>

</figure><figure class="quote" id="q-3abe7adc35" data-kw="">

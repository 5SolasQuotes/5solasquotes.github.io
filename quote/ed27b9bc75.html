<blockquote><p>For what is vainer than regarding someone as righteous who has not kept the law? Yet the law not only forbids that anything be done which it condemns (to which is attached a threatening with death) but also prescribes the outcome of what it enjoins (to which is attached the promise of life). Thus, whoever in Christ is judged to be ‘no sinner’ has indeed evaded death; but on the grounds of what other right would anyone demand life, other than that he has in Christ fulfilled all the righteousness of the law?</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/theodore-beza.html">Theodore Beza</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Epistolae theologicae: liber unus</cite>, (Geneva: Vignon, 1573), Epistle 35, to Olevianus (1560), p. 200 as trans. G.A. van den Brink, The Transfer of Sin… (Brill, 2024), p. 219 cf. Epistle 45, p. 228</span></figcaption>

<blockquote><p>[Margin Note:] It’s false that Christ so died for us, that is, in our stead, as that in our stead He fulfilled the Law and performed all active obedience and passive by doing and dying that God can require of us. 2. Christ may be said to die for us, as if we had substituted Him in our place, in so rigid a sense as if He had been made our surety to fulfill both the preceptive and active, and also the satisfying and suffering part of the Law in our room. This may please Antinomians, but a doubt it is, if it stand with the truth: For then whatever we, yea all mortal men be (for Christ died for them all, as many teach) most wicked, yet Christ’s active and surety, and cautionary righteousness should be ours; and though we should never believe, yet Christ who fulfilled the Law, and preceptive as well as the threatening part, must have believed for all that He died for, and what need we then in our persons either [to] believe or repent? It’s true, we need not perform any active obedience, as a part of active fulfilling of that Covenant of Works, which either must have all or no obedience. If it be said that alio titulo, ‘upon another account’ of thankfulness to our ransom-payer we owe active obedience: Yet all [persons] that Christ died for, both actively and passively, must be perfectly righteous and justified, [He] having paid the most perfect active and passive obedience that the Law required, though we never believe, and Christ must have paid the active part of justifying faith for us. And why, but we should be formally justified in Him without faith also? As also, God, not we, laid our sins upon Christ, Isa. 53:6; 2 Cor. 5:21, and therefore we did commissionate and substitute Christ to die in our room.</p></blockquote>

<blockquote><p>5. Are we justified on account of the essential righteousness of Christ’s divine nature? XXIII. Fifth, it is asked whether the dikaioma [righteousness] on account of which we are justified is the essential righteousness of Christ’s divine nature. Andreas Osiander [a Lutheran], as we have often said, affirms it, because he rejected the procured righteousness of Christ, which nonetheless his son Lucas Osiander, a professor at Tübingen, does not acknowledge; at least it is certain that he has to reject it, from his hypotheses, because: (1) this essential righteousness of the divine nature, through its infinite value, would be so sufficient that it would make the other undoubtedly void. This is not even to mention that (2) the essential union of believers with Christ (which he presupposes) is blasphemous in not just one way, as we taught elsewhere (1.6.5 §XX). And (3) it is false that he is the Messiah only according to the divine nature. Moreover, (4) that the fellowship of that essential righteousness is understood (2 Peter 1:4), we have already shown to be absurd (cf. bk. 5, ch. 2 §XXII; ch. 18, §§XIV, XXXVI; ch. 5 of this book, §XX; likewise §XI of this chapter.) Nor does there remain anything that they may say for themselves, except that the righteousness on account of which we are justified is called the righteousness of God (Rom. 1:17; 3:21–22; 10:3; 2 Cor. 5:21; 2 Peter 1:1). To which we respond that: (1) the [Greek; dikaiosune theou], ‘the righteousness of God’, sometimes designates procured righteousness (James 1:20). (2) Christ’s procured righteousness is the righteousness of God, insofar as the one who procured it is the God man, and thus is God (Acts 20:28). (3) The procured righteousness of Christ is called the righteousness of God because it was constituted by God, and is admitted for us by God (Rom. 3:25; 2 Cor. 5:21). … XXV… Protestants, although they leave essential righteousness to Christ alone, as a prerequisite for his mediatorial function, yet affirm that the righteousness that was procured by his satisfaction and merit (insofar as they teach that on account of it we are delivered from our guilt and obtain the right to life) is altogether imputed to us, or transferred to our account.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/petrus-van-mastricht.html">Petrus van Mastricht</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Theoretical Practical Theology</cite>, (2nd ed. 1698; RHB), vol. 5, pt. 1, bk. 6, ch. 6, ‘The Justification of those to be Redeemed’, p. 131</span></figcaption>

</figure><figure class="quote" id="q-ff21275831" data-kw="">
<blockquote><p>God demanded this perfect obedience from a man that was perfect in every way, and equal to the stipulated duty, for indeed: (1) through the image of God conferred upon Him, and in that image, original righteousness, He was blessed with spiritual wisdom… (2) He was to that point without any vice or sin (as much original as actual), through which alone his whole posterity was incapable of rendering to God his due (Rom. 8:3). Thus: (3) intrinsically, he was equipped with a perfect principle of obeying, namely, original righteousness; extrinsically, there was before him a perfect norm of obeying, nor did anything hinder that obedience.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/petrus-van-mastricht.html">Petrus van Mastricht</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Theoretical Practical Theology</cite>, (RHB) | vol. 3, Bk. 3, ch. 12, section 19, ‘The man who was to render perfect obedience to God was perfect in every way’</span></figcaption>

<blockquote><p>15. Argument 9 [of Rutherford against an Arminian conception of the antecedent will of God]: If such an antecedent will, by which He naturally wills good to the creature, belongs to God, then by the same reasoning God by an antecedent will willed the existence of the creature and from eternity willed the creation of the world by the impulse of nature. But then why did God for infinite ages before the creation of the world not satisfy that natural volition? What resisted God here? Not the world, not men, not a defect of matter. They will say that God’s absolute will resisted the natural will: But how absurd? Christians argue against Aristotle, Proclus and others that God created the world freely. Therefore He could have from eternity not have created, and such a will was in vain for eternity; and by equal reasoning God eternally wills the τὸ esse [being] of infinite worlds and of infinite men and angels… Indeed, because attributes in God are necessary and eternal, they never begin, they never cease; from eternity God naturally willed all men to be saved, and indeed naturally, and consequently by necessity of nature He created the world and could not have not created it.</p></blockquote>

<blockquote><p>9. Ninth [Objection to the simplicity of God]: God is in all things, and all things are in God. To which pertain those monstrous statements that God is prime matter, that man’s soul is a particle of divine breath and that God is the soul of the world; that God communicates Himself to us and we are so partakers of his divine nature that men, having been deified and transformed into God, are to be said to be essentially united with him – such as occur in the fanatics and Enthusiasts, the Henric-Nicolaitans, Weigelians, etc., about whom elsewhere. Meanwhile the treatise of the most noble Lord of Mont Saint-Aldegonde against the Libertines can be consulted, and Stegmann in the 2nd appendix of his Photianism, On True Christianity, with which compare Thomas, Summa Theologiae, pt. I, question 3, article 8, and Against the Gentiles, bk. 1, ch. 17, 20, 26-27. Response: Let those of that type briefly take these sources of solutions, thence let them apply them to those petty reasons or rather insanities. 1. God is in all things not as an essential or integral part in the whole, or as the contained in its containing, or as a subject under its accident, or as an accident in its subject, but as a cause is present to that on which it immediately acts. God is present, I say, to all things by essence, not because he is of the essence of things or something of their essence – whether as transient or constituent matter, or as informing form, or as perfecting accident. For he is most one, alone, divided, distinct from all – which also some think can not badly be intimated in Scripture by the attribute of holiness. In addition, if he came into composition with something, that would be more perfect than God, because every composite is more perfect than the compounding parts or principles. See the special reasons in Thomas and his commentator Ferrariensis in the cited place, and Summa Theologiae I, question 8, article 1. 2. All things are in God in three ways: in his power as in an efficient cause, in his idea as in an exemplar cause, in his knowledge as in one knowing. Whence the threefold being of creatures in God: eminent, ideal, intelligible. But this whole being is objective, without any composition or commingling, just as light is in air and air in light: Augustine, On the Literal Interpretation of Genesis, bk. 4, ch. 12, and On the Trinity, bk. 14, ch. 12; Cyril of Alexandria on John, bk. 9, ch. 40. See further the Scholastics on Summa Theologiae, pt. I, quest. 18, art. 4; Suárez, On God, bk. 2, ch. 2; and the commentators on Acts 17:28; 2 Pet. 1:4. And the philosophers explaining that axiom: ‘In a certain way, all things are four: God, heaven, prime matter, intellect.’ 3. God communicates his essence, life, goodness outside Himself, or ad extra, in the genus of efficient, exemplar, final cause, and indeed not naturally but freely, not through essence but through grace, so that for example all things participate of his goodness and are good by it extrinsically and causally, but by their proper goodnesses formally: Thomas, Summa Theologiae, pt. I, quest. 7, art. 4. Meanwhile they remain most distinct in individual and in species or univocal genus: the essence or goodness of God, and the essence or goodness produced in creatures to the likeness or image of the divine. But that communication of the divine essence is fivefold: 1. through creation, 2. through the grace of adoption, 3. through glory and beatitude, 4. through love and desire, 5. through incarnation;</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/gisbertus-voetius.html">Gisbertus Voetius</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Select Theological Disputations, vol. 1 tr. AI by Onku (Utrecht: Johannes a Waesberg, 1648), pt. 1, On the One &amp; Most Simple Essence of God</cite>, pp. 233-34 Latin</span></figcaption>

<blockquote><p>§ 5. I have moreover insisted on the different apprehensions the old philosophers entertain concerning those insuperable difficulties that are about predetermination, etc. thereby to intimate that the confident [Medieval] schoolmen and their several sectators do but actum agere, and consume their strength on needless controversies, to the great disadvantage of true religion. These acting in divinity, as our virtuosi do in philosophy, who, by a zealous attempt to establish their new dogmata [dogmas] (as they call them) do not walk in any untrodden paths; The Copernican Hypothesis about the motion of the earth, as also the learned fancies about the earth, and inhabitants that are said to be in the moon, as well as that solid truth about the Antipodes, so much reproached by Lactantius [early Church father, c. 250 – c. 325, in The Divine Institutes, Bk. 3, ch. 24 in ANF 7.94-95], were all known in Cicero‘s, if not in Plato‘s, or Pythagoras‘s days. For this, consult Cicero, Quaest. Acad. l. 2: ‘Habitari ait Xenophanes in Luna, eamque esse terram multarum urbium, &amp; montium. Portenta videntur: sed tamen neque ille qui dixit jurare posset ita se rem habere, neque ego. Nonne etiam dicitis, esse è regione nobis, è contraria parte terrae, qui adversis vestigiis stent contra vestigia nostra, quos Antipodas vocatis? Cur mihi magis succensetis, qui ista non aspernor, quam eis, qui quum audiunt, desipere vos arbitrantur? Nicetas Syracusius, ut ait Theophrastus, Coelum, Solem, Lunam, Stellas, supera denique omnia stare censet, neque praeter terram rem ullam in mundo moveri: quae cùm circum axem se summa celeritate convertat, &amp; torqueat, eâdem effici omnia, quae si stante terra, Coelum moveretur. Atque hoc etiam Platonem in Timaeo dicere quidam arbitrantur, sed paulò obscuriùs.’ Thus both our New Philosophers, and the Old Schoolmen, do but trace the ancient heathen in their particular fancies, concerning things not only unrevealed, but moreover, too high for vain mortals to reach unto. The New Philosophers confidently solve, as they say, the insolvable phaenomena in the natural world… for the Schoolmen are as vain, and consequently as liable unto just rebukes, as are the New Philosophers; Do the New Philosophers revive the old dogmata of the heathen? so do the schoolmen: Do the New Philosophers disturb the world with their learned folly? so do the schoolmen. And must the New Philosopher be severely checked for his presumption in philosophy? then surely, much more so must the schoolman…</p></blockquote>

<div class="actions"><button class="copy" data-copy="“§ 5. I have moreover insisted on the different apprehensions the old philosophers entertain concerning those insuperable difficulties that are about predetermination, etc. thereby to intimate that the confident [Medieval] schoolmen and their several sectators do but actum agere, and consume their strength on needless controversies, to the great disadvantage of true religion. These acting in divinity, as our virtuosi do in philosophy, who, by a zealous attempt to establish their new dogmata [dogmas] (as they call them) do not walk in any untrodden paths; The Copernican Hypothesis about the motion of the earth, as also the learned fancies about the earth, and inhabitants that are said to be in the moon, as well as that solid truth about the Antipodes, so much reproached by Lactantius [early Church father, c. 250 – c. 325, in The Divine Institutes, Bk. 3, ch. 24 in ANF 7.94-95], were all known in Cicero‘s, if not in Plato‘s, or Pythagoras‘s days. For this, consult Cicero, Quaest. Acad. l. 2: ‘Habitari ait Xenophanes in Luna, eamque esse terram multarum urbium, &amp; montium. Portenta videntur: sed tamen neque ille qui dixit jurare posset ita se rem habere, neque ego. Nonne etiam dicitis, esse è regione nobis, è contraria parte terrae, qui adversis vestigiis stent contra vestigia nostra, quos Antipodas vocatis? Cur mihi magis succensetis, qui ista non aspernor, quam eis, qui quum audiunt, desipere vos arbitrantur? Nicetas Syracusius, ut ait Theophrastus, Coelum, Solem, Lunam, Stellas, supera denique omnia stare censet, neque praeter terram rem ullam in mundo moveri: quae cùm circum axem se summa celeritate convertat, &amp; torqueat, eâdem effici omnia, quae si stante terra, Coelum moveretur. Atque hoc etiam Platonem in Timaeo dicere quidam arbitrantur, sed paulò obscuriùs.’ Thus both our New Philosophers, and the Old Schoolmen, do but trace the ancient heathen in their particular fancies, concerning things not only unrevealed, but moreover, too high for vain mortals to reach unto. The New Philosophers confidently solve, as they say, the insolvable phaenomena in the natural world… for the Schoolmen are as vain, and consequently as liable unto just rebukes, as are the New Philosophers; Do the New Philosophers revive the old dogmata of the heathen? so do the schoolmen: Do the New Philosophers disturb the world with their learned folly? so do the schoolmen. And must the New Philosopher be severely checked for his presumption in philosophy? then surely, much more so must the schoolman…”

— Stephen Lobb, The Glory of Free Grace Displayed… (London, 1680), pp. x-xi. Lobb (c. 1647–1699) was an English, calvinistic, indpendent minister. He was prominent in the 1680’s as a court representative of the Independents to James II, and in the 1690s in polemics between the Presbyterian and Independent groups of nonconformists. His church in London is supposed to be the successor to the congregation of Thomas Goodwin.">Copy</button><a class="share" href="https://x.com/intent/post?text=%E2%80%9C%C2%A7+5.+I+have+moreover+insisted+on+the+different+apprehensions+the+old+philosophers+entertain+concerning+those+insuperable+difficulties+that+are+about+predetermination%2C+etc.+thereby+to+intimate+that+the+confident+%5BMedieval%5D+schoolmen+and+their+several+sectators+do+but+actum+agere%2C+and+consume+their+strength+on+needless+controversies%2C+to+the+great+disadvantage+of+true+religion.+These+acting+in+divinity%2C+as+our+virtuosi+do+in+philosophy%2C+who%2C+by+a+zealous+attempt+to+establish+their+new+dogmata+%5Bdogmas%5D+%28as+they+call+them%29+do+not+walk+in+any+untrodden+paths%3B+The+Copernican+Hypothesis+about+the+motion+of+the+earth%2C+as+also+the+learned+fancies+about+the+earth%2C+and+inhabitants+that+are+said+to+be+in+the+moon%2C+as+well+as+that+solid+truth+about+the+Antipodes%2C+so+much+reproached+by+Lactantius+%5Bearly+Church+father%2C+c.+250+%E2%80%93+c.+325%2C+in+The+Divine+Institutes%2C+Bk.+3%2C+ch.+24+in+ANF+7.94-95%5D%2C+were+all+known+in+Cicero%E2%80%98s%2C+if+not+in+Plato%E2%80%98s%2C+or+Pythagoras%E2%80%98s+days.+For+this%2C+consult+Cicero%2C+Quaest.+Acad.+l.+2%3A+%E2%80%98Habitari+ait+Xenophanes+in+Luna%2C+eamque+esse+terram+multarum+urbium%2C+%26+montium.+Portenta+videntur%3A+sed+tamen+neque+ille+qui+dixit+jurare+posset+ita+se+rem+habere%2C+neque+ego.+Nonne+etiam+dicitis%2C+esse+%C3%A8+regione+nobis%2C+%C3%A8+contraria+parte+terrae%2C+qui+adversis+vestigiis+stent+contra+vestigia+nostra%2C+quos+Antipodas+vocatis%3F+Cur+mihi+magis+succensetis%2C+qui+ista+non+aspernor%2C+quam+eis%2C+qui+quum+audiunt%2C+desipere+vos+arbitrantur%3F+Nicetas+Syracusius%2C+ut+ait+Theophrastus%2C+Coelum%2C+Solem%2C+Lunam%2C+Stellas%2C+supera+denique+omnia+stare+censet%2C+neque+praeter+terram+rem+ullam+in+mundo+moveri%3A+quae+c%C3%B9m+circum+axem+se+summa+celeritate+convertat%2C+%26+torqueat%2C+e%C3%A2dem+effici+omnia%2C+quae+si+stante+terra%2C+Coelum+moveretur.+Atque+hoc+etiam+Platonem+in+Timaeo+dicere+quidam+arbitrantur%2C+sed+paul%C3%B2+obscuri%C3%B9s.%E2%80%99+Thus+both+our+New+Philosophers%2C+and+the+Old+Schoolmen%2C+do+but+trace+the+ancient+heathen+in+their+particular+fancies%2C+concerning+things+not+only+unrevealed%2C+but+moreover%2C+too+high+for+vain+mortals+to+reach+unto.+The+New+Philosophers+confidently+solve%2C+as+they+say%2C+the+insolvable+phaenomena+in+the+natural+world%E2%80%A6+for+the+Schoolmen+are+as+vain%2C+and+consequently+as+liable+unto+just+rebukes%2C+as+are+the+New+Philosophers%3B+Do+the+New+Philosophers+revive+the+old+dogmata+of+the+heathen%3F+so+do+the+schoolmen%3A+Do+the+New+Philosophers+disturb+the+world+with+their+learned+folly%3F+so+do+the+schoolmen.+And+must+the+New+Philosopher+be+severely+checked+for+his+presumption+in+philosophy%3F+then+surely%2C+much+more+so+must+the+schoolman%E2%80%A6%E2%80%9D%0A%0A%E2%80%94+Stephen+Lobb%2C+The+Glory+of+Free+Grace+Displayed%E2%80%A6+%28London%2C+1680%29%2C+pp.+x-xi.+Lobb+%28c.+1647%E2%80%931699%29+was+an+English%2C+calvinistic%2C+indpendent+minister.+He+was+prominent+in+the+1680%E2%80%99s+as+a+court+representative+of+the+Independents+to+James+II%2C+and+in+the+1690s+in+polemics+between+the+Presbyterian+and+Independent+groups+of+nonconformists.+His+church+in+London+is+supposed+to+be+the+successor+to+the+congregation+of+Thomas+Goodwin.&amp;url=https%3A%2F%2F5solasquotes.github.io%2Fquote%2Fc37d0825be.html&amp;via=5Solas" target="_blank" rel="noopener">Share on X</a><a class="perma" href="../quote/c37d0825be.html">Permalink</a><a class="src" href="https://reformedbooksonline.com/o

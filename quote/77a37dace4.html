<main class="wrap"><figure class="quote" id="q-77a37dace4" data-kw="">
<blockquote><p>The purposes of Deity are not lawless and arbitrary. His will is determined by the perfections of His nature. To say, therefore, that there are things which He cannot do, is simply to affirm that He cannot will them, and to say that He cannot will them, is just to assert that they are inconsistent with the perfections of His Being. In such cases, consequently, we do not limit, we only define the power of God …

It is His glory to be what He is. The possession of infinite perfections and the enjoyment within Himself of unchanging blessedness, independence and self-sufficiency, are characteristics of the Deity which render it impossible that His manifold works should spring from any other motive but the counsel of His Own will.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/james-henley-thornwell.html">James Henley Thornwell</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Necessity of the Atonement</cite>, (Columbia SC: Samuel Weir, 1845), pp 11, 28.</span></figcaption>

<blockquote><p>…in a man regenerate, there are two contrary qualities inherent in every faculty:

1. Grace, in a rectified holy inclination to goodness, infused into it.

2. Corruption in a vitious quality disposing it to evil. These two qualities abide in the regenerate, and oppose one another… let us proceed to declare what is a regenerate man’s resistance that he makes against the working of grace in hindering the performance of any good work: which you shall perceive by these two conclusions:

1. A man regenerate so far forth as he is Spiritual, never resists the work of grace, but is constantly most willing and forward to the performance of all holy actions. …

2. That a man regenerate, so far forth as he is carnal, does always resist the work of grace, being unwilling and backward to perform any holy action. … To conclude this point, there is in every regenerate man a possibility or power of resistence always remaining so long as any corruption abides in him, which will perpetually make some opposition more or less in the performance of every good work. But for the prevailing act of resistency whereby such good works might be quite hindered, we affirm that by the power of assisting grace effectually aiding the regenerate faculties, that act is taken away. The flesh may strive, but the Spirit does overcome… a victory indeed certain in regard of the event, but with some uncertainty in the combat, wherein Israel is sometime put unto the worst. For you are to note that albeit in the general as touching those main and principal acts of beleeving, repenting, persevering in obedience, etc. grace does work so effectually with man’s regenerate will that corruption cannot hinder it in the exercise of those acts: nevertheless, in many particular actions after his first conversion in the continued practice of sanctification, he may obey the enticings of his corrupt concupiscence, against the motions of the Spirit of grace. For many times in sundry particulars of Christian practice God is pleased to deny that effectual assistance which at other times He affords, and then He leaves us unto our own strength, for experiment to try what is in us, for humiliation in discovery of our weakness unto us, for exercise of Christian watchfulness in making diligent use of all gracious helps, and the like good purposes. … But these desertions are not perpetual: corruption may for a time let [prevent] the exercise of some particular graces, but in all and always it shall never hinder: God who has given unto a regenerate man a power to believe by the changing of his will through the infusion of a constant inclination to all spiritual good, will also cause the act of believing infallibly to ensue, by the assistance of cooperating grace, so powerfully strengthening the regenerate will, and so effectually restraining the rebellious motions of corruption that the will shall not choose but do that which above all things in the world it most desires to do, namely, believe and obey the Gospel.</p></blockquote>

<blockquote><p>[The gospel according to Romanism] overturns the nature of justification, and at best it does put in sanctification in the room thereof; and there is never any distinct ground laid, by which a sinner may come to receive a sentence of absolution before God, but this, to wit, justification, is lost by the former doctrine; and they acknowledge no such thing distinct from regeneration or sanctification, as if no such act as justification were needful or mentioned in Scripture, as distinct from these; and, in effect, it leaves a sinner to a way of salvation that wants [lacks] justification in it: and therefore cannot profit him. For by denying that which is the formal cause of justification, they deny itself, seeing that gives it a being.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/james-durham.html">James Durham</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Commentary on Revelation</cite>, (Naphtali Press) vol. 3, p. 198</span></figcaption>

</figure><figure class="quote" id="q-d2e4f6dd17" data-kw="">
<blockquote><p>Another way we have of apprehending him, by way of negation, denying all the imperfections of the creatures, and removing them at an infinite distance from him; and truly, though this be an imperfection in knowledge, yet it is the greatest knowledge we can attain to, to know rather what he is not, than what he is.

He is not limited to any place, nor bounded with any measures and degrees of perfection, as creatures are; therefore we call him infinite: he is not comprehended within the limits of time, but comprehends all within himself; therefore he is eternal: he is not subject to changes and alterations; therefore called immutable: he is not compounded, as a result of divers parts; therefore he is most purely simple, and one: he is not like those things we see and hear, that fall under our senses; therefore we call him a Spirit, or a spiritual Being.

Now, in all these weak endeavours of man, to detain and fix his own spirit in the contemplation of God, if he cannot reach the understanding of what God is, yet certainly he will attain this great point of wisdom, — not to be ignorant of his own ignorance. And truly, my beloved, this is the thing I would have us to learn to know, that the admiration of God in silence is the best expression of him.

We would not search into these mysteries, to satisfy our curiosity, but rather compose our hearts to a continual silent wondering before him; for where our understandings are confounded, and our minds overwhelmed with the infiniteness of that glory, so that we can see nothing but our ignorance of all, this should certainly compose all to quiet admiration, for silence and wonder is the proper and natural posture of a soul that is at a stand, and can neither win [i.e. get] forward for inaccessible light, nor will retire backward, for that it apprehends already.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/hugh-binning.html">Hugh Binning</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Fellowship with God, or Twenty-Eight Sermons on the First and Second Chapters of the First Epistle of John</cite>, (1671) in The Works of Hugh Binning, ed. James Cochrane (3 vols, Edinburgh: William Whyte, 1839), 2: 241-42.</span></figcaption>

mpose+all+to+quiet+admiration%2C+for+silence+and+wonder+is+the+proper+and+natural+posture+of+a+soul+that+is+at+a+stand%2C+and+can+neither+win+%5Bi.e.+get%5D+forward+for+inaccessible+light%2C+nor+will+retire+backward%2C+for+that+it+apprehends+already.%E2%80%9D%0A%0A%E2%80%94+Hugh+Binning%2C+Fellowship+with+God%2C+or+Twenty-Eight+Sermons+on+the+First+and+Second+Chapters+of+the+First+Epistle+of+John%2C+%281671%29+in+The+Works+of+Hugh+Binning%2C+ed.+James+Cochrane+%283+vols%2C+Edinburgh%3A+William+Whyte%2C+1839%29%2C+2%3A+241-42.&amp;url=https%3A%2F%2F5solasquotes.github.io%2Fquote%2Fd2e4f6dd17.html&amp;via=5Solas" target="_blank" rel="noopener">Share on X</a><a class="perma" href="../quote/d2e4f6dd17.html">Permalink</a><a class="src" href="https://reformedcovenanter.wordpress.com/2021/08/14/hugh-binning-on-negation-and-the-divine-perfections/" rel="noopener" target="_blank">Read it online · Reformed Covenanter</a></div>

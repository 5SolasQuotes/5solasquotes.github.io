<main class="wrap"><figure class="quote" id="q-92dfbb46a5" data-kw="">
<blockquote><p>Was it not for the strait the Church is in from the grievance of patronages, which they profess is a grievance to them as well as others, they had been as averse from countenancing such settlements as any.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/john-currie.html">John Currie</a></span><span class="wk"><span class="lbl">Work:</span> <cite>An Essay on Separation: or a Vindication of the Church of Scotland contra the Seceders</cite></span></figcaption>

</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-796a2944fa" data-kw="">
<blockquote><p>Though in some cases as we are warranted, so we are necessitated to withdraw, yet neither do we allow it upon slight or slender grounds; nor can any tender soul be forced to discountenance the ministers of Christ (I do not speak here of the prelatic curates) without great reluctancy and grief of heart, even when the grounds of it are solid and valid, and the necessity unavoidable: Therefore we reject these as insufficient grounds, besides what are given already: 1. We cannot withdraw from a minister for his infirmities and weaknesses, natural, spiritual or moral. 2. Neither for personal faults and escapes; we expect a faithful but not a sinless ministry. 3. Nor for every defect in faithfulness through ignorance, want of courage, misinformation, or being biased with affection for particular persons. We do not hold that faults in members, or defects in ministers do pollute the ordinances, and so necessitate a separation; but agree with what Mr. Durham says on Revelation, ch. 2, lect. 6, ‘Sincerity discovered will cover many faults.’ 4. Nor for every discovery of hypocrisy: Though we may have ground to suspect a man’s principle and motive be not right, yet if he be following duty unblameably, and have a lawful call, what then? “Notwithstanding every way, whether in pretense or in truth, Christ is preached; therein we may rejoice,” Phil. 1:18. 5. Nor yet for real scandals not attended with obstinacy, if ministers will take reproof and admonition, and at least by doctrinal confessing, and practical forsaking them, satisfy the offended, etc.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/john-currie.html">John Currie</a></span><span class="wk"><span class="lbl">Work:</span> <cite>An Essay on Separation: or a Vindication of the Church of Scotland contra the Seceders</cite></span></figcaption>

</figure><figure class="quote" id="q-75aa907c5f" data-kw="">
<blockquote><p>V. When I can have better, caeteris paribus [other things being equal], without greater hurt than good, I prefer it; and only use occasional local communion with the [Anglican] liturgy-churches, as I would do with strangers were I in foreign lands. VI. Where I can have no better without more hurt than good, I communicate constantly and only with the parish-church where I live, as to local-communion.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/richard-baxter.html">Richard Baxter</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The English Nonconformity as under King Charles II &amp; King James II Truly Stated &amp; Argued (1683; London: Parkhurst, 1689), ch. 58, ‘Whether Communion with so Faulty a Church be Lawful’</cite>, pp. 225-26</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/the-church/schism-and-separation.html">Schism and Separation</a></span></div>

<blockquote><p>…the Learned Bishop of Worcester, in his Irenic. p. 109… he tells us, that where soundness of doctrine is retained, but some corruptions in practice are tolerated, but not imposed, separation is unlawful on that account… Against which I have nothing to object…</p></blockquote>

</figure><figure class="quote" id="q-6894577b59" data-kw="">
<blockquote><p>…we know no external lawful calling that kings have now, or their family, to the crown, but only the call of the people. All other calls to us are now invisible and unknown; and God would not command us to obey kings and leave us in the dark that we shall not know who is the king.” Lex Rex, p. 33 (rt col, bot). ² Cameron, Dictionary, p. 745. Rutherford: “Any tyrant stands in titulo [in the title], so long as the people and the estates who make him king have not recalled their grant; so as neither David, nor any single man, though six hundred with him [1 Sam. 23:13; 30:9], may un-king him or detract obedience from him as king…” Lex Rex, p. 59 (lt col, top)… As Rutherford argued during the Westminster era in Lex Rex (1644), that magnum opus of puritan political thought, the power of governing is retained in root in the commonality of the people³ and conferred on governors by the community’s consent. Hence by natural law the community’s consent is more fundamental than changeable positive laws and constitutions. ³ Lex Rex, pp. 1–2, 6, 29, 34, 123–24. … As the puritan political tradition was summed up and delineated by Rutherford, while a material tyrant with grounds for deposition may continue for a long time, he formally remains the valid, civil, God-recognized ruler, continuing to bear God’s authority in all lawful things, until the consent of the community (which had been given to him, legitimizing him as their ruler) is removed from him, normally by the publicly recognized and accepted civil procedure (that is, by the official bodies and in due order).</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/travis-fentiman.html">Travis Fentiman</a></span><span class="wk"><span class="lbl">Work:</span> <cite>“Civil Authority, Dethronement &amp; Cameronianism” in “Editor’s Extended Introduction”, 3. “Principled Partial Conformity in Government: The Church of Scotland under Erastianism &amp; Episcopacy (1660–1688)” in English Puritans, A Refutation of the Errors of Separatists (1604; RBO, 2025), pp. 95-103 | “Not till 1679 (with increasing sanctions on the non-conformists) did a minority of these covenanters split away from the rest, coming to believe Charles II had lost his valid civil authority due to his despotism… The Cameronians, contrary to the principles and ethos of the Scottish Reformation and the Westminster era covenanters,¹ and nearly all reformed theology before them, in a public declaration in 1680 at Sanquhar with around twenty men,² “disowned” Charles II as king… | … Rutherford:</cite>, pp. 96-100</span></figcaption>

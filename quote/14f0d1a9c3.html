<main class="wrap"><figure class="quote" id="q-14f0d1a9c3" data-kw="">
<blockquote><p>Moreover, when the faithful soul thus receives Christ and rests upon Him, it doth not consider Christ as its Saviour only, but as its Lord. For it receiveth a whole Christ, and receiveth Him just as he is: and He is not less a Lord than a Saviour. Indeed he cannot be a Saviour, unless He be also Lord. In that doth our salvation consist, not that we are our own, or any creature’s, but Christ the Lord’s. Faith therefore receiveth Christ the Lord, Coloss. ii. 6.

Nor doth Christ any otherwise offer himself as a spouse to the soul, than under this condition, that she shall acknowledge Him for her Lord, Ps. xlv. 11. And when the soul casts herself upon Christ, she renounceth her own will, and giveth herself up to the will of Jesus, to be ordered by Him, as He shall please.

Hence there is in faith an humble giving and delivering up of self, by which the believer, as much as in him lies, as an act he is in duty bound to, makes a return of himself to Christ, who was so freely given to him. I am my Beloved’s, and my Beloved is mine, Cant. vi. 3. They gave their own selves to the Lord, 2 Cor. viii. 5.

Something like the form in which Amasai gave himself, with his companions, to David. 1 Chro. xii. 18. Thine are we, David, and on thy side, thou son of Jesse. And this giving up ourselves to Christ, which we set down as the seventh act of faith, is the continual spring and fountain of all true obedience, which is therefore called the obedience of faith, Rom. i. 5.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/herman-witsius.html">Herman Witsius</a></span><span class="wk"><span class="lbl">Work:</span> <cite>A Treatise on Christian Faith</cite>, trans. Martin Madan (London: E. Dilly, 1761), pp 21-22.</span></figcaption>

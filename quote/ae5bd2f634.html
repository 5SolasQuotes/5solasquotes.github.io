<main class="wrap"><figure class="quote" id="q-ae5bd2f634" data-kw="">
<blockquote><p>Be not sinfully discontented, for God can make the errors of the Church advantageous to truth. Thus the truths of God have come to be more beaten out and confirmed; as it is in Law, one man laying a false title to a piece of land, the true title hath by this means been the more searched into and ratified: some had never so studied to defend the truth by Scripture, if others had not endeavoured to overthrow it by Sophistry; all the mists and fogs of Error that have risen out of the bottomless pit, have made the glorious Sun of truth to shine so much the brighter.

Had not Arius and Sabellius broached their damnable Errors, the truth of those questions about the blessed Trinity had never been so discussed and defended by Athanasius, Augustine, and others; had not the Devil brought in so much of his princely darkness, the Champions for Truth had never run so fast to Scripture to light their Lamps. So that God who hath a wheel within a wheel, over-rules these things wisely, and turns them to the best. Truth is an heavenly plant that settles by shaking.

… God raiseth the price of his truth the more; the very shreds and filings of truth are venerable. When there is much counterfeit metal abroad, we prize the true Gold the more: the pure wine of Truth is never more precious then when unsound doctrines are broached and vented.

… Error makes us more thankful to God for the jewel of Truth. When you see another infected with the Plague, how thankful are you, that God hath freed you from the infection? when we see others have the Leprosy in the head, how thankful are we to God that he hath not given us over to believe a lie, and so be damned? It is a good use that may be made even of the Error of the times, when it makes us more humble and thankful, adoring the free grace of God who hath kept us from drinking of that deadly poison.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/thomas-watson.html">Thomas Watson</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Autarkeia, or, The art of divine contentment</cite>, (2nd edn, London: Ralph Smith, 1654), pp 103-05.</span></figcaption>

</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-0f2cdba7fc" data-kw="">
<blockquote><p>It is a noble temper to be afraid of sin. If a person pretends conscience for a particular opinion and practice, and in the mean time be a common drunkard, swearer, liar, blasphemer, unclean person, one that lives as it were without God in the World, making no conscience of reading the Scripture, praying, bringing up and governing his Family in the nurture and fear of the Lord, only pretends conscience as to baptizing of Children, keeping the Seventh day Sabbath; this man is an hypocrite, and dissembles with God and men for there is an uniformity in conscience, and it would certainly oblige him to avoid known and confessed sins, as much as what he doth fancy is a sin, and as much oblige him to all, as to any known duty.

But where I see a Christian walking close with God in the general of his conversation, and differing from me in this or that point, because he thinks he cannot without sin believe and practise what I do; I cannot but love and honour him, and be very far from their Religion who think it the best and most Gospel way to cudgel him into my Persuasion: A Gaol, or a Fire and Faggots never yet cured an erring Conscience. Such Brethren though overtaken with a fault are certainly (according to the Apostle’s counsel) to be restored in the spirit of meekness, and to be dealt with, (like rational Creatures) argued, and treated, and persuaded out of their mistakes, not cudgelled out of them.</p></blockquote>

<blockquote><p>He that despaireth of the forgiveness of his sins, denieth GOD to be merciful, yea he denieth as much as lieth in him that GOD hath love, truth and power, in which three all my comfort consisteth, to wit, in the love of his adoption, in the truth of his promise, and in his power to perform. Let my foolish Cogitation then mutter what it listeth within me, saying, who art thou? or by what merit or worthiness doest thou hope to obtain such great glory? I comfortably will answer I know whom I have believed, and I am sure that in love he hath adopted mee to be his Child, that he is true in his promise, and powerful in performance. And these three so strengthen my heart, that no want of merit, no consideration of my own vileness, no greatness of the future blessedness can cast me down from the height of hope, wherein I am soundly rooted.</p></blockquote>

<blockquote><p>Why should I deny that I fear for the Netherlands, and for the Church and Reformed truth, if we embrace a common principium with the Socinians, indeed, if we commend it more than those. Our interests have fallen to such an extent that Reason, as an Oracle, infallible, to be heard and adored with a humble and obsequious mind not otherwise than as the word of God Himself, is set forth openly, which it is not far from blasphemy to argue is of a lie; and at the same time are ridiculed those that admonish out of Clement that Hagar ought to be made subject to Sarah or to be ejected.

We have come to such a point that there are those that defend that those things that by reason are indubitable to us are not to be denied, even if we are not able to reconcile those things with Scripture; that those that, with their reason captivated, believe the Scripture are become beasts; that Theologians that, finding themselves to be no match for reasons, invoke the Scripture for help act incorrectly; that reason is not to be reconciled with Scripture, but Scripture with reason; that untroubled philosophizing is a must, and concerning the rest one must sleep idly upon either ear; that the infallibility of Reason is to be embraced, so that the authority of Scripture might be certain, because this is not able to be constructed from any other source than Reason.

The Doctors have advanced to such a point that they hold Reason to be the sole principium of all truth; that all love of God, reverence, obedience, and faith is derived from this source, and ought to be reduced to it; that here, and not elsewhere, the hope of blessedness finds its sacred anchor; that in fact, if even a bit be added to or subtracted from the dictate of Reason, its authority is injured. Why are you astonished, as if you have not confidence in the one narrating? You have undoubtedly read, or you all are able to read, almost all the words which I have recited, very recently written, and have known those that foster these hypotheses in their souls, and from time to time speak similar things.

But it is better that you be astonished at me, than that Socinian principia be heard in the Reformed Schools without restraint, the hurt of which the Church shall hereafter lament sooner or later. For you will not be able to give to me, nor I to name, anyone from the impure flock, who might not speak more reverently concerning Revelation, and more modestly concerning Reason. But even now the pious and true lovers are able to understand, indeed, all that do not close their eyes in the midst of light, what unwholesome fruit that bitter root of Reason will bear.

The Christian Religion, before its truth is made evident by particular and most certain arguments (how many and who, I ask, of children, foolish women, and private men, arrive at that?),is said to be held in no better position that the Turkish, or Pagan, or Jewish. The single Omnipresence of God is learned from chimeras of the Scholastics, and is a fictitious attribute; the simplicity of God is called into doubt; the liberty of God and the eternity of the Decrees of God are set against each other; arguments for Deity, if they be disjoined from our idea of God, are invalid; miracles are attributed to natural causes; rational creatures are judged to be masters of their own actions; nothing ought to be placed outside of the will that might determine it; the working of God is not to be understood as through the mode of predetermination; the mysteries of the Trinity and of the Incarnation are to be removed from the fundamentals; the corruption of the human nature does not pertain to the mind or its faculties, but unto its use, act and habit; the activities of angels, by which their existence most forcefully demonstrated from the earliest times, are fabricated fables; the state of souls is changed in death, but they do not exchange the dwelling of earth with heaven; a disputation is brought against the infernal region, neither from any appearance of truth is it thought to be unsuitable that after the day of judgment the impious are going to dwell on this earth, and perhaps are going to abound in external goods.

Rejoice, ye impious, and let Epicurus be held as vile among you, who did not promise such things. But what do these and all similar things elicit from me and from all good men, except the most ardent sighings after God, that He might be willing to take pity on Zion, and to attend upon His own glorious name; except supplications to you, Most Distinguished Nobles, that you from your chairs of authority might prevent the dictate of proud reason; except fraternal rousing to you, Most Illustrious Colleagues and Reverend Co-laborers in the Lord, that we might together oppose the advancing madness, etc.</p></blockquote>

<main class="wrap"><figure class="quote" id="q-766a5a5f6c" data-kw="">
<blockquote><p>Two centuries ago, in the days of the Stuarts, it would have been impossible for the Church to purchase her freedom even at this cost. On the 1st November 1662, four hundred ministers of the Church of Scotland, substantially for the same principle of Christ’s sole kingly authority in his Church, left their churches and pleasant homes, and cast themselves and their families on the world. But it was not to poverty only, with its manifold hardships, they thus committed themselves, but, as every reader of his country’s history knows, to all manner of sufferings even unto death. And they deemed the principle worth suffering for even to death.

Well it was for the liberties of all Great Britain, as the issue proved, that they did, that they had no sympathy with those in our time who say—it is but a question about external things after all, not touching doctrine, not affecting the truths on which salvation depends. Indeed? Christ’s sole kingly authority in his Church not a matter of vital doctrine! It was well, at least, that our martyr-forefathers thought otherwise, thought that if the shepherds’ consent to the pulling down of the fence which protects the flock, and the wolf thus get in among them, it is small consolation for the sheep that it was only the fence the shepherds suffered to be broken down.

With John Knox, a hundred years before, they judged, “Take from us our assemblies, and take from us the gospel” And thus were they willing, for Christ’s sole regal authority in his kingdom, to surrender, not their livings only, but their lives. The difference in our happier times simply is, that we were able to secure our freedom by parting, not with our lives, but with our livings only. Hence the Disruption of 1843.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/charles-j-brown.html">Charles J. Brown</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Disruption Question Stated. Reprinted (with some additions) from the Free Church Record, at the request of the Free Presbytery of Edinburgh</cite>, (Edinburgh: T. Nelson and Sons, 1863), p. 12.</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/trials-the-cross-and-comfort/suffering-and-the-cross.html">Suffering and the Cross</a></span></div>

</figure><figure class="quote" id="q-0aae216358" data-kw="">
<blockquote><p>Suffering especially tests and strengthens hope. Paul teaches that discovering God’s help increases our hope (Rom. 5:5). Because God enables us to experience his goodness, power, and faithfulness when we are in need, because he strengthens us against every temptation and safeguards us against every attack, and because he delivers us from all our fears, he in all these ways so establishes and guarantees in us the truth of his promises that whoever calls on him will be saved and whoever trusts in him will never be put to shame. …

By means of trials God puts our obedience to the test. When all goes well according to the flesh, it is not difficult for us to yield to his will and to recognize his goodness and love towards us. But when he visits us with sickness, poverty, reproach, or some other misery, it is then true obedience to feel that he loves us, to embrace his divine guidance, and to submit to his will. …

How shabbily we treat this one, true, and heavenly Father when in days of oppression we fail to hallow his name, to conform our will to his, and to confess that all things proceed from his goodness and love – all of which serves his praise as well as our salvation.

So we see how in the school of we learn what it actually means to be obedient to God. We need this education. For as Jesus Christ, even though he was God’s Son, nevertheless “learned obedience from what he suffered” (Heb. 5:8), how much more necessary it is for us in days of persecution to learn to submit our heads and our hearts to God’s leading.</p></blockquote>

</figure><figure class="quote" id="q-01179f2d0a" data-kw="">
<blockquote><p>That God may, and sometimes doth afflict, yet not in reference to sin. Thus God doth exercise Job, who though he was not without sin, yet God seemeth not to do it for sin: Therefore such calamities were rather exercises of his graces, then correctives of his sins: they were to him, what a storm, or a tempest is to a skilful Pilate, what a valiant adversary is to a stout Champion; and to this purpose is that answer of our Saviour, when the question was, Whether the parents, or the blind man himself had sinned, that he should be born blind? (speaking according to the opinion of some Philosophers, that was now also received among the Jews (as learned men think) viz. That there was a prexistency of the souls before they were united to their bodies) our Saviour returneth this answer, Neither hath this man sinned (because he had no being before his birth) nor his parents (viz. some grievous sin, for which God would punish the child) but only that the works of God may be made manifest. This also must be granted.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/anthony-burgess.html">Anthony Burgess</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The true doctrine of justification asserted and vindicated, from the errors of Papists, Arminians, Socinians, and more especially Antinomians in XXX lectures preached at Lawrence-Jury, London</cite>, (2nd edn, London: Tho. Underhill, 1651), p. 28.</span></figcaption>

<blockquote><p>First; an earnest deprecation of an impending Judgment, is reconcilable with our Submission to the pleasure of God, declared by the Event. Our Saviour with humility and importunity desired the removing of the Cup of Bitterness. We must distinguish between God’s Law, and his Decree and Counsel; The Law is the Rule of our Duty, and requires an entire exact subjection in all our Faculties, even in our internal Desires, in the first motions of the Will; the least velleity, or rising of the Heart against the Divine Command, is irregular and culpable; for not only the acts of Sin are forbidden in every Command respectively, but all the incitations of Concupiscence, before the deliberate judgment of the Mind, or the actual consent of the Will. But the Decree of God is not the Rule of our Duty, and Secret, till manifested by the event of things. This being premised, the Reasons are evident why we may pray against an Affliction that threatens us, without violating our Duty.

First; Because Afflictions are Evils which the Will naturally declines, and are not desirable things in themselves. They are not beneficial and productive of our good by any proper efficacy and operation, but by the over-ruling Providence of God, and the gracious assistance of his Spirit. When Aaron‘s Rod was put into the Sanctuary, and became green and flourishing with Blossoms and Almonds, ’twas not from any inherent virtue of its own, but from the special influence of the Divine Power; for the other Rods remained dead and dry: thus the happy effects of the Afflicting Rod are from Divine Grace.

Secondly; There are proper Temptations that attend the afflicted State. Many are encompassed in a sad Circle, their Sins procure Afflictions, and their Afflictions occasion many Sins. Indeed, Tribulation that is sanctified, by a happy gradation worketh Patience; and Patience, Experience of the Divine Mercy; and Experience, Hope, and Hope maketh not ashamed. But when it meets with a stubborn Spirit, there are fearful descents of Sin: Tribulation excites Impatience, and Impatience causeth Perplexity, and that Despair, and Despair Confusion.

The Devil lays his trains in every condition, and sometimes by immoderate Sorrow, sometimes by inordinate Joy, doth mischief to the Soul. And as more perish by Surfeits than Abstinence, yet the Diseases that are caused by emptiness, are more dangerous and incurable than those that proceed from fullness: So more are ruined by Prosperity than Adversity: But the guilty Passions that ferment and rage in Adversity, are more pernicious, and more hardly tempered and subdued, than the Luxurious Appetites that are fomented and drawn forth by Prosperity. We are directed by our Saviour to pray, that we may not be led into Temptation, and to be delivered from all Evil.</p></blockquote>

<div class="actions"><button class="copy" data-copy="“First; an earnest deprecation of an impending Judgment, is reconcilable with our Submission to the pleasure of God, declared by the Event. Our Saviour with humility and importunity desired the removing of the Cup of Bitterness. We must distinguish between God’s Law, and his Decree and Counsel; The Law is the Rule of our Duty, and requires an entire exact subjection in all our Faculties, even in our internal Desires, in the first motions of the Will; the least velleity, or rising of the Heart against the Divine Command, is irregular and culpable; for not only the acts of Sin are forbidden in every Command respectively, but all the incitations of Concupiscence, before the deliberate judgment of the Mind, or the actual consent of the Will. But the Decree of God is not the Rule of our Duty, and Secret, till manifested by the event of things. This being premised, the Reasons are evident why we may pray against an Affliction that threatens us, without violating our Duty.

First; Because Afflictions are Evils which the Will naturally declines, and are not desirable things in themselves. They are not beneficial and productive of our good by any proper efficacy and operation, but by the over-ruling Providence of God, and the gracious assistance of his Spirit. When Aaron‘s Rod was put into the Sanctuary, and became green and flourishing with Blossoms and Almonds, ’twas not from any inherent virtue of its own, but from the special influence of the Divine Power; for the other Rods remained dead and dry: thus the happy effects of the Afflicting Rod are from Divine Grace.

Secondly; There are proper Temptations that attend the afflicted State. Many are encompassed in a sad Circle, their Sins procure Afflictions, and their Afflictions occasion many Sins. Indeed, Tribulation that is sanctified, by a happy gradation worketh Patience; and Patience, Experience of the Divine Mercy; and Experience, Hope, and Hope maketh not ashamed. But when it meets with a stubborn Spirit, there are fearful descents of Sin: Tribulation excites Impatience, and Impatience causeth Perplexity, and that Despair, and Despair Confusion.

The Devil lays his trains in every condition, and sometimes by immoderate Sorrow, sometimes by inordinate Joy, doth mischief to the Soul. And as more perish by Surfeits than Abstinence, yet the Diseases that are caused by emptiness, are more dangerous and incurable than those that proceed from fullness: So more are ruined by Prosperity than Adversity: But the guilty Passions that ferment and rage in Adversity, are more pernicious, and more hardly tempered and subdued, than the Luxurious Appetites that are fomented and drawn forth by Prosperity. We are directed by our Saviour to pray, that we may not be led into Temptation, and to be delivered from all Evil.”

— William Bates, The great duty of resignation to the divine will in afflictions, enforced from the example of our suffering Saviour, (London: Brabazon Aylmer, 1684), pp 6-9.">Copy</button><a class="share" href="https://x.com/intent/post?text=%E2%80%9CFirst%3B+an+earnest+deprecation+of+an+impending+Judgment%2C+is+reconcilable+with+our+Submission+to+the+pleasure+of+God%2C+declared+by+the+Event.+Our+Saviour+with+humility+and+importunity+desired+the+removing+of+the+Cup+of+Bitterness.+We+must+distinguish+between+God%E2%80%99s+Law%2C+and+his+Decree+and+Counsel%3B+The+Law+is+the+Rule+of+our+Duty%2C+and+requires+an+entire+exact+subjection+in+all+our+Faculties%2C+even+in+our+internal+Desires%2C+in+the+first+motions+of+the+Will%3B+the+least+velleity%2C+or+rising+of+the+Heart+against+the+Divine+Command%2C+is+irregular+and+culpable%3B+for+not+only+the+acts+of+Sin+are+forbidden+in+every+Command+respectively%2C+but+all+the+incitations+of+Concupiscence%2C+before+the+deliberate+judgment+of+the+Mind%2C+or+the+actual+consent+of+the+Will.+But+the+Decree+of+God+is+not+the+Rule+of+our+Duty%2C+and+Secret%2C+till+manifested+by+the+event+of+things.+This+being+premised%2C+the+Reasons+are+evident+why+we+may+pray+against+an+Affliction+that+threatens+us%2C+without+violating+our+Duty.%0A%0AFirst%3B+Because+Afflictions+are+Evils+which+the+Will+naturally+declines%2C+and+are+not+desirable+things+in+themselves.+They+are+not+beneficial+and+productive+of+our+good+by+any+proper+efficacy+and+operation%2C+but+by+the+over-ruling+Providence+of+God%2C+and+the+gracious+assistance+of+his+Spirit.+When+Aaron%E2%80%98s+Rod+was+put+into+the+Sanctuary%2C+and+became+green+and+flourishing+with+Blossoms+and+Almonds%2C+%E2%80%99twas+not+from+any+inherent+virtue+of+its+own%2C+but+from+the+special+influence+of+the+Divine+Power%3B+for+the+other+Rods+remained+dead+and+dry%3A+thus+the+happy+effects+of+the+Afflicting+Rod+are+from+Divine+Grace.%0A%0ASecondly%3B+There+are+proper+Temptations+that+attend+the+afflicted+State.+Many+are+encompassed+in+a+sad+Circle%2C+their+Sins+procure+Afflictions%2C+and+their+Afflictions+occasion+many+Sins.+Indeed%2C+Tribulation+that+is+sanctified%2C+by+a+happy+gradation+worketh+Patience%3B+and+Patience%2C+Experience+of+the+Divine+Mercy%3B+and+Experience%2C+Hope%2C+and+Hope+maketh+not+ashamed.+But+when+it+meets+with+a+stubborn+Spirit%2C+there+are+fearful+descents+of+Sin%3A+Tribulation+excites+Impatience%2C+and+Impatience+causeth+Perplexity%2C+and+that+Despair%2C+and+Despair+Confusion.%0A%0AThe+Devil+lays+his+trains+in+every+condition%2C+and+sometimes+by+immoderate+Sorrow%2C+sometimes+by+inordinate+Joy%2C+doth+mischief+to+the+Soul.+And+as+more+perish+by+Surfeits+than+Abstinence%2C+yet+the+Diseases+that+are+caused+by+emptiness%2C+are+more+dangerous+and+incurable+than+those+that+proceed+from+fullness%3A+So+more+are+ruined+by+Prosperity+than+Adversity%3A+But+the+guilty+Passions+that+ferment+and+rage+in+Adversity%2C+are+more+pernicious%2C+and+more+hardly+tempered+and+subdued%2C+than+the+Luxurious+Appetites+that+are+fomented+and+drawn+forth+by+Prosperity.+We+are+directed+by+our+Saviour+to+pray%2C+that+we+may+not+be+led+into+Temptation%2C+and+to+be+delivered+from+all+Evil.%E2%80%9D%0A%0A%E2%80%94+William+Bates%2C+The+great+duty+of+resignation+to+the+divine+will+in+afflictions%2C+enforced+from+the+example+of+our+suffering+Saviour%2C+%28London%3A+Brabazon+Aylmer%2C+1684%29%2C+pp+6-9.&amp;url=https%3A%2F%2F5solasquotes.github.io%2Fquote%2F3bd7c96cb1.html&amp;via=5Solas" target="_blank" rel="noopener">Share on X</a><a class="perma" href="../quote/3bd7c96cb1.html">Permalink</a><a class="src" href="https://reformedcovenanter.wordpress.com/2023/02/25/william-bates-on-praying-for-the-removal-of-afflictions/" rel="noopener" target="_blank">Read it online · Reformed Covenanter</a></div>

<main class="wrap"><figure class="quote" id="q-540fca7fa1" data-kw="">
<blockquote><p>…nor was it ever in our heart to teach that the Christian magistrate is with blind obedience to execute the decrees of the Church; for this poor argument, if it have any nerves, as it would cast upon us the doctrine of Papists and Jesuits to make the ways of Christ odious, it has as great strength against the preaching of the Gospel; for if Paul or any faithful pastor preach to the magistrates of Berea that Christ, whom the Jews crucified, is the only Redeemer and Saviour of the world, and that therefore they are, as nurse-fathers, to give liberty to the servants of God, to preach this doctrine and to hinder any to persecute such as shall preach this doctrine, yet by their civil authority, and ex officio [out of their office], they are not for that, with blind obedience to receive it and not to search the Scriptures to try whether that which is preached be agreeable to the Scriptures, nor to take it upon the bare authority of the preacher, but they are to search the Scriptures and obliged to believe the preached Gospel. But not as magistrates [are they] either to preach themselves, or to judge authoritatively by virtue of their office, whether the preacher’s doctrine be the Gospel of Christ or no[t]: so if a synod, by the Holy Ghost and the light of Scriptures, determine anything for discipline or censure, the magistrate, as he may as a Christian, try the word preached, so may he the same way try the decrees and determinations of the Church, and not take them upon blind trust and accordingly punish the contraveners [to the Church’s decrees] as a magistrate, and as he is the minister of God that bears his sword; but yet he can no more as a magistrate, and by his office, prescribe such ecclesiastic laws (as wee have [in] Acts 15:28; 16:4) unto the Churches of God, or as a magistrate and by his office judge them unlawful and forbid them, than he can preach the word, or say it seemed good to the Holy Ghost [Acts 15:28] and to me who bears the sword, to command that the Churches observe such and such laws.</p></blockquote>

</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-4a2f105d7d" data-kw="">
<blockquote><p>Moreover, as we may not use any indifferent thing at our own pleasure; so neither may the Church at her will and pleasure command the use of it: but as our practice, so the Church’s injunction must be determined and squared according to the former [three] rules [of using indifferent things (1) to the glory of God, (2)according to the law of charity and (3) purity of conscience]. And if any man think, that in the use of things indifferent he may be led and ruled by the Church’s determination without examining any further, let him understand that the Church’s determination is but a subordinate rule, or a rule ruled by higher rules. … He [Dr. Forbes] has been speaking of the rules which God’s Word gives us concerning the use of things indifferent, and all of them he comprehends under this rule, that we should hear the Church and obey them who are set over us, as if God’s rules were subordinate to men’s rules and not theirs to his. We say not that every man may use things indifferent suo arbitratu [according to his judgment]: but we say withal that neither may the Church command the use of things indifferent, suo arbitratu. Both, she in commanding and we in obeying, must be guided by the rules of Scripture. They who are set over us in the Church have no power given them of Christ which is not for edifying, Eph. 4:12. The council of the apostles and elders at Jerusalem (which is a lively pattern of a lawful synod to the world’s end) professed they would lay no other burden upon the disciples except such things as the law of charity made necessary for shunning of scandal: and so that which they decreed had force and strength to bind, a Charitate propter Scandalum [from charity due to scandal], says Sanctius. But suo arbitratu [by their (mere) judgment] they enjoined nothing. It appears by this place (says [Thomas] Cartwright) that there may be no abridgment of liberty simply decreed, but in regard of circumstance, according to the rule of edification. And if the Church’s decrees and canons be not according to the rules of the Word, yet forasmuch as everyone of us shall give account of himself and his own deed, we must look that whatsoever the Church decree, yet our practice in the use or omission of a thing indifferent, be according to the foresaid rules. We may not for the commandment of men transgress the rule of piety by doing anything which is not for God’s glory and ordered according to his will; neither ought any of us to obey men, except for the Lord’s sake and as the servants of Christ, doing the will of God; which teaches us the manner how we ought to obey men, namely, propter Christum et sicut Christus praecipit [for Christ, as Christ commands]. For if we should know no more but the will of man for that which we do, then we should be the servants of men, not the servants of Christ. Neither yet may we for any human ordinance break the rule of charity: but whatsoever either would weaken or not edify our brother, be it never so lawful, never so profitable to ourselves, never so powerfully by earthly authority enjoined, Christians, who are not born unto themselves, but unto Christ, unto his Church and unto the fellow members, must not dare to meddle with it. Nor lastly may we obey men so as to break the Law of Purity, and perform any action with a doubtful conscience, that is, whereof either the Word has not, or we out of it have no warrant: in which case tender consciences must be tendered, rather than be racked by authority: for be the things in themselves never so lawful, etc., they are utterly unlawful to me without such information. Whereas therefore some say that in the use of matters indifferent, the laws of those who are set over us ought to rule us; we still answer that our practice may not be ruled by any law of man except it be according to the rules of the Word; whereof one is this: Tantum oportere esse obedientiae studium in Christianis, ut nihil agant, quod non existiment vel potius certi sint placere Deo (Calvin on Rom. 14:5).</p></blockquote>

<blockquote><p>When we kneel to kings, we signify by that gesture that we submit ourselves to higher powers, not simply (says Peter Martyr) but insofar as they command not things against the Word of the Lord. When we adore God, we adore Him as the Supreme Majesty, being ready to obey Him in what He shall command, without any exception…</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/samuel-rutherford.html">Samuel Rutherford</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Divine Right of Church Government</cite>, (1646), Introduction, section 6, p. 86</span></figcaption>

<div class="actions"><button class="copy" data-copy="“When we kneel to kings, we signify by that gesture that we submit ourselves to higher powers, not simply (says Peter Martyr) but insofar as they command not things against the Word of the Lord. When we adore God, we adore Him as the Supreme Majesty, being ready to obey Him in what He shall command, without any exception…”

<blockquote><p>Objection 4. The causes of war (says Mr. Simmons, sect. 4, p. 9) should not be made known to the subjects, who are to look more to the lawful call to war from the prince than to the cause of the war. [Rutherford’s] Answer: [1.] The parliament and all the judges and nobles are subjects to Royalists, if they should make war and shed blood upon blind obedience to the king, not inquiring either in causes of law or fact; they must resign their consciences to the king. 2. The king cannot make unlawful war to be lawful by any authority-royal, except he could raze out the Sixth Commandment [of the Decalogue]: therefore subjects must look more to the causes of war than to the authority of the king; and this were a fair way to make parliaments of both kingdoms [England and Scotland] set up Popery by the sword, and root out the Reformed religion upon the king’s authority [as was being done at the time of Rutherford writing], as the lawful call to war, not looking to the causes of war.</p></blockquote>

<blockquote><p>…turbulent spirits do not love to examine things by rule, to call things to account, but follow their own fiery humor and set upon their own will with violence: but godliness takes off men from this ruggedness and turbulency of spirit and makes them gentle and peaceable: let them be never so active, never so forward, never so zealous in any thing, yet if you will call them to examine things by rule, they will meekly and patiently hear you; yea, a child shall lead them, Isa. 11:6. And yet further; turbulent they are not, for none [are] more obedient to authority than they; none see that majesty of God in authority as they do; none obey authority out of conscience so as they do. If the will of men in authority, rather than authority, shall require anything that the authority of Heaven forbids, that they do not; because they cannot obey, for conscience sake: And so sacred do they account authority, that they would have no obedience performed to it, but obedience for conscience sake. Blind obedience the Church of God has long ago exploded as too servile for Christian spirits: this were more servile than selling men’s bodies in the market for slaves, which Christianity abhors. It were too uncharitable a conceit of Christian magistrates, to think that they should require of, or expect from any other obedience than in, and for the Lord; and in this obedience, those who are godly, are so forward…</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/jeremiah-burroughs.html">Jeremiah Burroughs</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Excellency of a Gracious Spirit</cite>, … (1639), p. 138-9</span></figcaption>

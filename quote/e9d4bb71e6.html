</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-7ed22f2a08" data-kw="">
<blockquote><p>For Jeremiah, from the Lord, expressly forbade to fight against Nebuchadnezzar; show us the like for not defending ourselves against bloody papists and Irish cut-throats; for that example may as well prove (if it be a binding law to us) that our king should not raise his subjects to fight against a Spanish armada and a foreign prince; for before ever Nebuchadnezzar subdued the kingdom of Judah (Jer. 27:1) in the beginning of the reign of Jehoiakim (Jer. 36-37) the king of Judah is from the Lord commanded not to draw a sword against the king of Babylon. I hope this will not tie us and our king not to fight against foreign princes or against the great Turk, if they shall unjustly invade us and our king; and this example is against the king’s resisting of a foreign prince unjustly invading him as much as against us, for Nebuchadnezzar was a tyrannous invader and the king of Judah, the Lord’s anointed.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/samuel-rutherford.html">Samuel Rutherford</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Lex Rex</cite>, ... (1644; Edinburgh: Ogle, 1843), p. 180</span></figcaption>

</figure><figure class="quote" id="q-cee0d0c6a9" data-kw="">
<blockquote><p>In the siege of Leyden we have a thrilling example of their sufferings and heroism. Three months after the commencement of the siege the food-supply was exhausted. A fearful famine began to rage. For seven weeks the inhabitants had no bread to eat and multitudes perished of hunger. On the heels of the famine came the plague or black death, which carried off a third part of the citizens. The apparently doomed survivors subsisted on dogs and cats. To the summons to surrender, they replied: ” As long as you hear the mew of a cat or the bark of a dog you may know that the city holds out. And when all have perished but ourselves, we will devour our left arms, retaining our right to defend our women, our liberty, and our religion against the foreign tyrant.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/netherlands-leiden.html">Egbert Watson Smith</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Creed of the Presbyterians</cite></span></figcaption>
<div class="meta"><span class="t"><a href="../topics/civil-government-and-society/plague-quarantine-and-public-health.html">Plague, Quarantine and Public Health</a></span></div>

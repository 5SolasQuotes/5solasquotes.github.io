<blockquote><p>For the receiving of the sacrament being a mediate worship of God, wherein the elements come between God and us, in such sort that they belong to the substance of the worship (for without the elements, the sacrament is not a sacrament)… for as much as in the act of receiving, both our minds, and our external senses are and should be fastened upon them… For in every mediate worship, wherein some creature is purposely set between God and us to have state in the same, it is idolatry to kneel before such a creature, whiles both our minds and senses are fastened upon it.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/george-gillespie.html">George Gillespie</a></span><span class="wk"><span class="lbl">Work:</span> <cite>English Popish Ceremonies</cite>, (1637), pt. 3, ch. 4; pp. 68-69</span></figcaption>

<blockquote><p>5. The Efficient Cause, I mean the first and Principal Efficient of true worship, is the Holy Ghost, by whom we are moved and stirred up to worship and honor God.

6. For the Spirit is He which gives us faith itself from whence flows worship, and excites us to do the works of piety, both internal and external. He works in us both the will and the deed, after the good pleasure of his will, as the apostle speaks.

7. The Secondary and Less Principal Efficient Cause of worship, are we ourselves, who adore and honor God.

8. The Material Cause is the work itself commanded by God, whereby we serve Him, adoring Him with the greatest reverence we possibly may: for no creature has any right of instituting the worship of God.

9. Hereupon is excluded all will-worship, and the figment of good intention, to wit, when men do evil, that good may come thereof, or when they themselves do invent works, which they obtrude unto God for worship, not works evil in themselves, but yet not commanded by God, 1 Sam. 15:22; Eze. 20:19; Mt. 15:9; Isa. 29:13.

10. For it is not sufficient, for worship that some work be not evil, or not forbidden, but it ought to be commanded by God, 1 Sam. 15:22; Eze. 20:19; Mt. 15:9; Isa. 29:13.

11. The Formal Cause is faith. For good works and just actions do not only flow from faith as from the Efficient Cause; even as all human actions proceed from the soul: but also those works have their being from faith, as from a form, whereby they are godly, holy and therefore acceptable unto God.

12. The Final Cause is the glory of God, whereunto must be referred all the whole worship of God.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/gabriel-powel.html">Gabriel Powel</a></span><span class="wk"><span class="lbl">Work:</span> <cite>De adiaphoris, Theological &amp; Scholastical Positions concerning the Nature &amp; Use of Things Indifferent. Where also is Methodically &amp; Briefely Handled, of Civil &amp; Ecclesiastical Magistrates, of Human Laws, of Christian Liberty, of Scandal &amp; of the Worship of God</cite>, De adiaphoris, Theological &amp; Scholastical Positions concerning the Nature &amp; Use of Things Indifferent. Where also is Methodically &amp; Briefely Handled, of Civil &amp; Ecclesiastical Magistrates, of Human Laws, of Christian Liberty, of Scandal &amp; of the Worship of God (London, 1607), ch. 10, ‘Of the Worship of God…’, pp. 65-66 Powel (baptised 1576–1611) was a Welsh Anglican minister.</span></figcaption>

</figure><figure class="quote" id="q-74390f58c1" data-kw="">
<blockquote><p>§5. What things of or belonging to divine worship, may be devised or instituted by man. The things set down under the former head as forbidden, are such new ordinances of worship as are coordinate with the divine ordinances, and are in proper sense additions, pretending, or in themselves expressing the same nature, reason, end and use that the divine ordinances have, and consequently importing an insufficiency in them. But there are such institutions of men in subordination to the divine institutions as serve for the more convenient modifying and ordering of the same. And they are not proper additions, because they are not of the same nature and use: and these are unlawful.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/john-corbet.html">John Corbet</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Remains of</cite>, Of Divine Worship, 2nd Part in The Remains of… John Corbet… (London: Parkhurst, 1684), pt. 3, ch. 5, pp. 213-14</span></figcaption>

</figure><figure class="quote" id="q-bb50f85b0d" data-kw="">
<blockquote><p>Doctrine 9. Godliness is the chief and most necessary of all virtues. By godliness we mean true religion towards God, and a mind wholly given to the true worship of God. Reason 1. Because it has the noblest object, that is, God Himself. 2. Because it does most of all perfect all other virtues, while it refers them and all their acts to a divine beginning and a divine end. For godliness subjects the mind to God in all things, so that it acknowledges God to be the author of all good, from whom every good and perfect gift comes, and makes Him the chiefest good and the last end to whom all our actions are to be directed.</p></blockquote>

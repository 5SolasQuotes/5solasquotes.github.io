<main class="wrap"><figure class="quote" id="q-1057e41071" data-kw="">
<blockquote><p>All things which are necessary to salvation are contained in the Scriptures, and also all those things which are necessarily required to the instruction and edification of the Church. … Hence the Scripture is not a partial, but a perfect rule of Faith, and manners: neither is here any thing that is constantly and every where necessary to be observed in the Church of God, which depends either upon any tradition, or upon any authority whatsoever and is not contained in the Scriptures.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/william-ames.html">William Ames</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Marrow of Theology</cite>, Book I, ch. XXXIV, theses 15–16</span></figcaption>

</figure><figure class="quote" id="q-a94e564bfc" data-kw="Mary Queen of Heaven King">
<blockquote><p>We acknowledge the Blessed virgin to be the most excellent member of this spouse; and that, in this sense, she reigns with Christ, and with all the faithful. But that Christ administers his kingdom through her, as through the Queen of heaven, or that he has constituted her to have Dominion over all creatures with Royal power, since this is not proved from scripture; but is only fashioned by the most audacious men, she will never receive it; … nor can we defer it to her.</p></blockquote>

</figure><figure class="quote" id="q-738aac8891" data-kw="">
<blockquote><p>As we believe and confess the Scriptures of God sufficient to instruct and make the man of God perfect; 2 Tim. iii. 16, 17. so do we affirm and avow the authority of the same to be of God, and neither to depend on men nor angels. We affirm, therefore, that such as allege the Scripture to have no other authority but that which it hath received from the Church, are blasphemous against God, and injurious to the true church; which always heareth and obeyeth the voice of her own Spouse and pastor (John 10), but takes not upon her to be mistress over the same.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/scottish-reformers.html">Scottish Reformers</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Scots Confession</cite>, 1560, Art. 19</span></figcaption>

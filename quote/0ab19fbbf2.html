<main class="wrap"><figure class="quote" id="q-0ab19fbbf2" data-kw="unity one God">
<blockquote><p>Is God one? We affirm against the heathen and Tritheists. God is so one affirmatively as to indivision that he is also one as to the exclusion of others. The question concerns the essential numerical unity: whether God is one numerically as to essence. We defend this against the polytheism of the heathen and the error of the Tritheists.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/francis-turretin.html">Francis Turretin</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Institutes of Elenctic Theology</cite>, 3.3.2–3</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/attributes-of-god/unity.html">Unity</a> › <a href="../topics/attributes-of-god/unity/one-god.html">One God</a></span><span class="t"><a href="../topics/attributes-of-god/unity.html">Unity</a> › <a href="../topics/attributes-of-god/unity/against-polytheism.html">Against polytheism</a></span></div>

</figure><figure class="quote" id="q-068f6eb218" data-kw="unchangeable essence">
<blockquote><p>God is unchangeable in his essence, nature, and perfections. Immutability and eternity are linked together; and indeed true eternity is true immutability, whence eternity is defined the possession of an immutable life. It is the essential property of God, not to have any change in his being, or any alteration by any thing without him or within him.</p></blockquote>

</figure><figure class="quote" id="q-347ef5d07d" data-kw="">
<blockquote><p>Love of necessity involves feeling, and if there be no feeling in God, there can be no love. That He produces happiness is no proof of love. The earth does that unconsciously and without design. … He may be cold, insensible, indifferent, or even unconscious; He ceases to be God in the sense of the Bible, and in the sense in which we need a God, unless He can love as well as know and act. … We must adhere to the truth in its Scriptural form, or we lose it altogether. We must believe that God is love in the sense in which that word comes home to every human heart.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/charles-hodge.html">Charles Hodge</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Systematic Theology</cite>, vol. 1, pt. 1, ch. 5, § 13, “The Goodness of God” (“Love”)</span></figcaption>

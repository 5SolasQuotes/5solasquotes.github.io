<main class="wrap"><figure class="quote" id="q-87a9dd8be8" data-kw="">
<blockquote><p>Paul, when writing to the Corinthians who were Greeks, gives the preference to that [Greek] custom [of men having an uncovered head in worship]. In doing so, he did not intend to lay down a universal law which should be everywhere observed. He merely accommodated himself to a custom of civil life observed, at that time, by those to whom he was writing. This is admirably, I think, explained by [Johann H.] Altingius in a discourse already quoted… It must not be supposed that the same rule which he had given to the Corinthians from a regard to their customs would have been invariably given to Jews dwelling in their own country, or to Egyptians or Arabians, who followed a different custom. The usages of civil life are endlessly varied by place and time. Consequently what, at one place and time, is sufficiently becoming, would be, at anotlier place and time highly unbecoming. Yet the apostolic rule has been in force, since that time, among almost all Christians. Is it because keeping the head uncovered is universally regarded by them as a token of reverence? I hardly think so. It has spread widely in the north, through the nations of France and Germany. But among the Jews, the Greeks, ancient Italy, and the whole of the East, the custom is wholly unknown. It appears, therefore, to belong to the liberty of the New Testament. ‘With uncovered head,’ says Tertullian, ‘because we are not ashamed.&#x27;</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/herman-witsius.html">Herman Witsius</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Other citations (work not named)</cite>, pp. 84-90 of Dissertation 4, ‘On Gestures in Prayer’ in Sacred Dissertations on the Lord’s Prayer (1689; Edinburgh: Thomas Clark, 1708)</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/worship/head-coverings-in-worship.html">Head Coverings in Worship</a></span></div>

</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-00a419400e" data-kw="">
<blockquote><p>I rather think, with the learned Cappellus, that this apostolical prescript or canon of good order was founded upon some civil custom then obtaining among the Corinthians and elsewhere; from whence he concludes that according to the difference of several countries, such an habit and deportment is to be used in divine service which is commonly used to express reverence and decency in conversation. … (He, that will see the different customs of nations in this matter, both in and out of sacred uses, may consult Grotius and Cappellus at large on the place.)</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/france.html">Samuel Thomas</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Animadversions upon a Late Treatise, entitled, The Protestant Reconciler</cite>, (London, 1683), section 8, pp. 110-12 (on Louis Cappel)</span></figcaption>

</figure><figure class="quote" id="q-634c57d18f" data-kw="">
<blockquote><p>Modest women were supposed to keep their heads covered when out of doors, but this generally took the form of draping their mantle over their head rather than wearing a hat, since the elaborate hairstyles frequently made hats impossible. In the first centuries BC and AD, there are some references to the turban (mitra) being worn by rich women, and it is possible this is the cloth wrapped round the head like a headscarf seen on women in Hellenistic paintings. Catacomb paintings of Christian women praying sometimes show them with a veil covering their head and hanging down their back or over their shoulders, but rarely crossed over like a shawl round the neck… The freedman’s cap could also be worn by women on occasion;</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/alexandra-t-croom.html">Alexandra T. Croom</a></span><span class="wk"><span class="lbl">Work:</span> <cite>‘Hairstyles &amp; Hats’ &amp; ‘Hairnets &amp; Coverings’ in Roman Clothing &amp; Fashion Pre</cite>, (Stroud: Tempus, 2000), pp. 139-55, pp. 151-52</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/worship/head-coverings-in-worship.html">Head Coverings in Worship</a></span></div>

<blockquote><p>All adult women would have had long hair, the only exceptions being women who habitually wore wigs, slaves who had had their own hair cut off to provide the hair for such wigs and possibly some priestesses, as well as women who had been ill… Women would not have appeared in public with short hair from choice. The hair was always worn pinned up, unless the woman wanted to show distress by not taking care of her appearance, such as at funerals.</p></blockquote>

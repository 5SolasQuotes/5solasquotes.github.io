<blockquote><p>Now if Pighius do feign that God created in us these lusts and wicked affections, then is he blasphemous and contumelious against him: which faults he unworthily goeth about to lay to our charge. For forasmuch as God is good, and most wise, and most just, and hath also created man unto the highest felicity, he would not have given him those things, whereby he should be withdrawn from that felicity: which should entice him to do against his commandments: which of their own accord are filthy, and should lead us captives into the law of sin &amp; of death. For these things if they ought to be mortified and crucified, as undoubtedly they ought, we must needs grant, that they are vices and hateful unto God.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/peter-martyr-vermigli.html">Peter Martyr Vermigli</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Most learned and fruitful commentaries of D. Peter Martir Vermilius Florentine, professor of divinity in the school of Tigure, upon the Epistle of S. Paul to the Romans wherein are diligently [and] most profitably entreated all such matters and chief common places of religion touched in the same Epi</cite>, trans. Henry Billingsley (London: John Day, 1568), p. 121.</span></figcaption>

</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-9cdcbe8cb2" data-kw="">
<blockquote><p>Now all this being unquestionably true of the Jewish Sanhedrin: if we should suppose, that they had no supreme Sanhedrin but that which had the power of civil Magistracy, then I ask where is that Christian State, which was, or is, or ought to be molded according to this pattern. Must ministers have vote in parliament? Must they be civil lawyers? Must all criminal and capital judgments be according to the Judicial Law of Moses, and none otherwise? Must there be no civil punishment, without previous admonition of the offender? Must Parliaments sit, as it were in the Temple of God, and interpret Scripture, which sense is true, and which false, and determine controversies of faith and cases of conscience, and judge of all false doctrines? Yet all this must be if there be a parallel made with the Jewish Sanhedrin. I know some divines hold, that the Judicial Law of Moses, so far as concerns the punishments of sins against the moral Law, idolatry, blasphemy, Sabbath-breaking, adultery, theft, etc. ought to be a rule to the Christian Magistrate. and for my part, I wish more respect were had to it, and that it were more consulted with.</p></blockquote>

</figure><figure class="quote" id="q-f0d76de26a" data-kw="">
<blockquote><p>A fourth reason for obeying the injunction of the text [Jeremiah 45:5] is found in the fact, that great sorrow springs from great aspirations, when those aspirations are unattained. There is only one species of aspiration that does not weary and wear the soul, and that is, the craving and cry of the soul after God. “As the hart panteth after the water brooks, so panteth my soul after thee O God.” The desire expressed in these words of the Psalmist can never satiate, or disgust the human spirit, for the reason that God is the real and true portion, the substantial, eternal good of the creature. But all other aspirations dispirit and discourage in the end. “He that increaseth knowledge increaseth sorrow.”

The sadness and melancholy of the man of letters is well known. One of the most equable minds in literary history, singularly calm and balanced by nature, and remarkably free from passionate and stormy impulses, confessed at the close of a long life of eighty years that he had never experienced a moment of genuine repose. Humboldt, who had surveyed the cosmos, and who had devoted a long existence to placid contemplation of the processes of nature, and had kept aloof from the exciting and passionate provinces of human literature, said in his eightieth year: “I live without hope, because so little of what I have undertaken yields a satisfactory result.”

This is the penalty which ambitious minds pay for seeking “great things.” There is an infinite aspiration, and an infinitesimal performance. The hour of death, and the falling shadows of an everlasting existence, and an everlasting destiny, bring the aspiration and the performance into terrible contrast. Most impressively do such facts and experiences in the history of marked men reiterate the prophet’s injunction: “Seekest thou great things for thyself? seek them not.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/william-g-t-shedd.html">William G.T. Shedd</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Letter to the Spiritual Man (New York: Charles Scribner’s Sons, 1884), pp 380-81.</cite></span></figcaption>

<blockquote><p>Absolute censorship of the Nazi data does not seem proper, especially when the secrets of saving lives may lie solely in its contents… When the value of the Nazi data is of great value to humanity, then the morally appropriate policy would be to utilize the data, while explicitly condemning the atrocities… To further justify its use, the scientific validity of the experiment must be clear; there must be no other alternative source from which to gain that information, and the capacity to save lives must be evident. …it must not be included as ordinary scientific research, just to be cited and placed in a medical journal… citation of the data must contain a thorough expose’ of exactly what tortures and atrocities were committed for that experiment… [and it] must be accompanied with the author’s condemnation of the data… as medical evil, never to be repeated.</p></blockquote>

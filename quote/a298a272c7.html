<main class="wrap"><figure class="quote" id="q-a298a272c7" data-kw="">
<blockquote><p>He [an Independent, separatist schismatic] condemns Presbyterians, Independents, Anabaptists and all Dissenters that are here called Protestants. For they have all many of the foresaid uninstituted things: They put off the hat in Church at prayer.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/richard-baxter.html">Richard Baxter</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Schism Detected in both Extremes, or Two Sorts of Sinful Separation</cite>, … (London: 1684), pt. 2, p. 16</span></figcaption>

</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-3f89644db8" data-kw="">
<blockquote><p>It is partly true, that ‘the men’ were peculiar in their dress, but it is not at all true, that they adopted any kind of badge, or that they wore a uniform that distinguished them as a class. In the circle in which they moved, there were attempts made, by the careless and worldly, to follow, at a distance, the mutations of fashion in their attire. The men would not, and, merely, on that account, their dress was peculiar. It was often the case, that they wore long hair, partly, because a regard to appearances did not remind them of cutting it, and, partly, that they might discountenance the attempts at clipping and combing ‘after the fashion,’ by which many around them evidenced their conformity to the world. It is true, also, that they often appeared with a handkerchief on their heads, but so did many besides them, who met to worship under a scorching sun, and regarded it as unbecoming to have a hat or a bonnet on their heads. If their dress seemed peculiar, it was only because it was old-fashioned, even in the highlands. Its singularity was not owing to any affectation, or to an undue regard to what was external and trivial.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/john-kennedy.html">John Kennedy</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Days of the Fathers in Ross-Shire 4th</cite>, ed. (Toronto: James Campbell &amp; Son, 1867), pp. 87-88</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/worship/head-coverings-in-worship.html">Head Coverings in Worship</a></span></div>

</figure><figure class="quote" id="q-e0af007caa" data-kw="">
<blockquote><p>Divine Apostolical Institutions (that we may draw to our purpose) were again of two sorts: First, variable, or temporary, which were such injunctions as were prescribed, either for some special ends, as that law for abstaining from blood, and things strangled, Acts 15:1, for avoiding offence to the Jews, or to some special nations, or persons, as agreeable to the customs of those places and times, as that of women being vailed in the congregations, and some other the like. Secondly, invariable and perpetual: such as concerned the whole Church: This distinction we received from that learned and Professor [John Prideaux, d. 1650];</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/westminster-divines.html">Westminster Divines</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Daniel Cawdrey &amp; Herbert Palmer</cite>, Sabbatum Redivivum: or, The Christian Sabbath Vindicated (London, 1645), fourth part, ch. 1, ‘The Lord’s Day is of Divine Institution’, p. 463 Irregular page numbering Westminster divines</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/worship/head-coverings-in-worship.html">Head Coverings in Worship</a></span></div>

</figure><figure class="quote" id="q-0d68aa6d6c" data-kw="">
<blockquote><p>To those who, in a narrow spirit, insist on having divine prescription for the most insignificant details of religious life and public worship, this appeal to ‘nature itself,’ [v. 14] as a great guide in relation to the decencies of public worship, should read a wholesome lesson. Nature, though uniform in its essential features, varies in all that is subordinate in different regions and at different periods. In matters of feeling, taste, and decorum, as to the way in which the relation of the sexes should be expressed, eastern and western ideas notoriously and widely differ, and they should be allowed their natural and proper development.</p></blockquote>

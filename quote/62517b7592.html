<blockquote><p>…a rigid application of Canon #1 [older being better] would automatically give preference to the Dead Sea Scroll of Isaiah as over against the MT in every case of disagreement. But a careful study of the entire scroll indicates that the copyist followed far lower standards of scribal fidelity than those of the official recension on which the MT itself was based.</p></blockquote>

<div class="meta"><span class="t"><a href="../topics/holy-scripture/inerrancy-and-infallibility.html">Inerrancy and Infallibility</a></span></div>

</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-8ac7680810" data-kw="vowels">
<blockquote><p>Again, the authority of an authentic writing is twofold: the one is founded upon the things themselves of which it treats and has relation to the men to whom the writing is directed; the other is occupied with the treatise itself and the writing and refers to the copies and translations made from it. Over all these this law obtains—that they ought to be referred to the authentic writing and if they vary from it, to be corrected and emended. The former authority may be either greater or lesser according to the authority of him from whom the writing comes and in proportion to the power which he has over the persons to whom he directs his writing. But in the sacred Scriptures this authority is the very highest, such as can be in no other writing, since we are bound straightway to believe God for that supreme power which he has over men as over all other things, and for that highest truth and wisdom distinguishing him, and to obey in all things which his most sacred word (contained in the authentic Scripture) enjoins for belief or practice. But the latter consists in this, that the autographs and also the accurate and faithful copies may be the standard of all other copies of the same writing and of its translations.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/francis-turretin.html">Francis Turretin</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Institutes of Elenctic Theology</cite>, 2.11</span></figcaption>

</figure><figure class="quote" id="q-281f1ebbf1" data-kw="">
<blockquote><p>From this discrepancy between the Hebrew [Jews’] books [i.e. the Septuagint] and our own arises the well-known question as to the age of Methuselah; for it is computed that he lived for fourteen years after the deluge, though Scripture relates that of all who were then upon the earth only the eight souls in the ark escaped destruction by the flood, and of these Methuselah was not one… …that they may not cast a slight on the trustworthiness of versions which the Church has received into a position of high authority, and because they believe that the Jewish manuscripts rather than our own are in error. For they do not admit that this is a mistake of the [Septuagint] translators, but maintain that there is a falsified statement in the original, from which, through the Greek, the Scripture has been translated into our own tongue. They say that it is not credible that the seventy translators, who simultaneously and unanimously produced one rendering, could have erred, or, in a case in which no interest of theirs was involved, could have falsified their translation; but that the Jews, envying us our translation of their Law and Prophets, have made alterations in their texts so as to undermine the authority of ours. This opinion or suspicion let each man adopt according to his own judgment. Certain it is that Methuselah did not survive the flood, but died in the very year it occurred, if the numbers given in the Hebrew manuscripts are true. My own opinion regarding the seventy translators I will, with God’s help, state more carefully in its own place, when I have come down (following the order which this work requires) to that period in which their translation was executed.</p></blockquote>

</figure><figure class="quote" id="q-f06f0da33b" data-kw="hebrew greek">
<blockquote><p>The following arguments prove that the sources have not been corrupted. (1) The providence of God which could not permit books which it willed to be written by inspiration (theopneustois) for the salvation of men (and to continue unto the end of the world that they might draw from them waters of salvation) to become so corrupted as to render them unfit for this purpose. And since new revelations are not to be expected (after God has recorded in the Scriptures his entire will concerning the doctrine of salvation), what can be more derogatory to God (who has promised his constant presence with the church) than to assert that he has permitted the books containing this doctrine to become so corrupt that they cannot serve as a canon of faith? (2) The fidelity of the Christian church and unceasing labor in preserving the manuscripts; for since Christians have always labored with great zeal to keep this sacred deposit uncorrupted, it is not credible that they would either corrupt it themselves or suffer it to be corrupted by others. (3) The religion of the Jews who have bestowed upon the sacred manuscripts great care and labor amounting even to superstition.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/francis-turretin.html">Francis Turretin</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Institutes of Elenctic Theology</cite>, 2.10</span></figcaption>

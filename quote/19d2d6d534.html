<blockquote><p>What kind of Mortification is most requisite, so as in more measure to free the heart from doubtings? In a word, this; be sure the mortifying be

1. Radical: lay the axe to the root: As all Graces thrive most when their springs are quickened, so all sins decay most when their roots are mortified. Corrupt acts will fall quickly, if a corrupt heart were more sanctified. The strength of sin is inward, there are the strong holds which need most to be cast down: By all means set up a crucifying Christ in thy bosom.

2. Impartial. It is true, one sin may trouble more then another, but it will be thy wisdom to trouble all sin: Sins are chained together as well as Graces; and one sin serves to help another, and the neglected sin may perhaps suddenly wound thee, and make thee to stagger. The whole body of sin in every member of it, must be the object of thy mortifying work: This will testify the truth of Grace received, and the sincerity of thy conscience, and consequently will remove many bottoms of fears and doubtings.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/obadiah-sedgwick.html">Obadiah Sedgwick</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Doubting Believer</cite>, (London: Thomas Nicols, 1641), pp 118-19.</span></figcaption>

</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-cedf944e34" data-kw="privation">
<blockquote><p>Hence it follows that the formal reason of sin consists in anomia and privation, denoting the want of the rectitude or goodness which ought to be in the rational creature according to the prescription of the law (whether it belongs to the nature or qualities or actions themselves, for it deprives all these of conformity with the law and so constitutes them guilty of sin). But this privation is not pure or simple, but corrupting; not idle, but energetic; not of pure negation, but of depraved disposition, by which not only is the due rectitude taken away, but also an undue unrectitude and a depraved quality laid down, infecting all the faculties. Just as a physical disease is not only a removal of the temper of the humors, but also a corrupt disposition and disorder (dyskrasia) of them, so sin (which holds the relation of a moral disease of the soul) is not only the negation of a good, but the position of a corrupt disposition.</p></blockquote>

<blockquote><p>11. There are two parts of this [original] sin: the former is the defection from God in the loins of Adam; the latter is the pravitas (depravity) that followed that defection. Hence it happens that original sin is said to be both inherent and imputed.

12. Imputed sin is that disobedience or defection of Adam, which was imputed to all his posterity who were in his loins, because they were in Adam as in their stock and root. For it is most just before God, and indeed it is received among all nations, that what the head does is deservedly imputed to the whole body, and that children are despoiled of all paternal goods on account of the father’s rebellion. But the case is not the same for other sins of parents, which, because they are truly personal, are therefore not transfused into their children.

13. The sin of Adam in the very act of his sinning is indeed alien from us, because we were not yet in act, but only in potentiality (δυνάμει) and originally in his loins; but with respect to the nature common to us and to him, it is proper to each. Therefore, we are punished not on account of the sin of Adam, but on account of our own which is in reality inherent in us. Just as someone infected in a time of contagion infects others, and the infected die; he who dies, dies not on account of the plague of another, but on account of his own. …

23. As to the mode by which this sin is derived into posterity, we confess that this cannot be explained with sufficient precision. Augustine advises that nothing should be rashly asserted in such a question; and certainly, one should rather ask by what way we can escape from that evil, than how it has come down to us.

24. It must be known, however, that it is not transferred to us only by custom or by example and imitation of the sin of the first parents, as the Pelagians contended, for those who cannot imitate the sins of others also die and are judged (Rom. 5:14); but by propagation and natural traduction, we who are born such as Adam was after the sin.</p></blockquote>

<blockquote><p>[After quoting Mt. 12:31-32] For in reality there is no difference between the sin from which one is never granted truly to repent— for which no sacrifice remains, but only certain and severe vengeance, and which will never be forgiven— and that which is, and is called, ‘unto death.’ In this view not only have the greatest of our theologians gone before, but many others also, both of the ancients and of the Papists, who, however, have expressed their opinion less fully by various phrases, indeed interpreting somewhat differently the blasphemy against the Holy Spirit, and trying to distinguish this sin just as much as the one Paul [in Hebrews] describes from it.</p></blockquote>

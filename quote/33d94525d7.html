<blockquote><p>A warmly devotional exposition.” – Cyril Barber Smith, George Adam – Four Psalms: 23, 36, 52, 121, Interpreted for Practical Use (London: Hodder &amp; Stoughton, 1896) 140 pp. ToC Smith (1856–1942) was a professor in the Free Church of Scotland and then the United Free Church of Scotland, who had some liberal tendencies. Miller, J.R. – By the Still Waters: a Meditation on the Twenty-Third Psalm (NY: Crowell, 1898) 32 pp. no ToC . 1900’s Smith, Mrs. J. Hal – Sweet P’s from the Twenty-Third Psalm (1900) 18 pp. no ToC This brief, devotional and edifying work outlines and elaborates on the psalm with these headings: Position, Possession, Provision, Progress, Protection, Preparation, Privilege &amp; Prospect. Brown, Elijah –Lifting the Latch: an Hour with the Twenty-Third Psalm: New Thoughts on an Old Theme (Cincinnati: Jennings, 1907) 90 pp. ToC This is written in a popular style and is edifying. McFadyen, John E. – Study 3, The Twenty-Third Psalm in Ten Studies in the Psalms (NY: Young Men’s Christian Association Press, 1907) McFadyen (1870–1933) was a Scottish professor of language, literature and Old Testament theology in the University of Glasgow. Stalker, James – The Psalm of Psalms: being an Exposition of the 23rd Psalm (NY: Charles Scribner’s Sons, 1913) 140 pp. ToC Stalker was a minister of the United Free Church of Scotland. Torrey, R.A. – The Shepherd Psalm (1915) 16 pp. Reisner, Christian F. – Comfort &amp; Strength from the Shepherd Psalm: a Devotional Study of the Twenty-Third Psalm (Methodist Book Concern, 1918) 235 pp. ToC Reisner (1872-1940) McNeill, John – The Twenty-Third Psalm (Revell, 1927) 95 pp. ToC McNeill (1854–1933) was a Scottish presbyterian minister and evangelist, at this time in Los Angeles, CA. Evans, William – The Shepherd Psalm &amp; Looking Beyond (Moody Press, 1932) 120 pp. ToC Devotional. Morgan, G. Campbell – Notes on the Psalms (Revell, 1947) ToC ‘Valuable for Morgan’s handling of Psalms 22-24 with Christ as Savior, Shepherd, and Sovereign.’ – Cyril J. Barber Owen, George Frederick – The Shepherd Psalm of Palestine (Eerdmans, 1958) 84 pp. ToC ‘Rich and rewarding, and vividly recreates the historic setting which gave rise to this psalm.’ – Cyril J. Barber Keller, Phillip – A Shepherd Looks at Psalm 23 (Billy Graham Evangelistic Association, 1970) 150 pp. ToC Popularly written, it has often been reprinted as a classic. Barclay, Ian – He is Everything to Me: an Exposition of Psalm 23 (Falcon Books: 1972) 90 pp. ToC Barclay (1907–1978) was a Scottish author, radio and television presenter, Church of Scotland minister, and Professor of Divinity and Biblical Criticism at the University of Glasgow. He was a popular Bible commentator. He has described himself as a “liberal evangelical”. Beeke, Joel – The Lord Shepherding his Sheep Buy (Evangelical Press, 1993) 304 pp. ToC . 2000’s Herrick, Greg – ‘An Exposition of Psalm 23’ (2004) at Bible.org Rose Publishing – Psalm 23: The Beloved Psalm Brought to Life for Today’s Readers (Rose Publishing, 2008) 16 pp. This pamphlet is a word-by-word study providing a meaning and an application for each phrase, as well as related Bible passages. Table Talk – Psalm 23 (Aug. 2018) Briggs, Richard S. – The Lord Is My Shepherd: Psalm 23 for the Life of the Church (Baker Academic, 2021) 224 pp. About Blurb: “Internationally recognized Old Testament scholar Richard Briggs helps readers understand the power and vision of Psalm 23. He offers a close word-by-word and phrase-by-phrase reading… showing how it can speak afresh to the life of the church today. Briggs explores the reception of Psalm 23 down through the ages, covers background issues, and examines the ways the psalm addresses practical issues such as stress, death, enemies, and hope.</p></blockquote>

</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-629728bd23" data-kw="">
<blockquote><p>By psalms are meant the Psalms of David, and others that compose the book that goes with that name; and by hymns we are to understand, not such as are made by good men, without the inspiration of the Spirit of God; since they are placed between psalms and spiritual songs, made by men inspired by the Holy Ghost… but these are only another name for the book of Psalms, the running title of which may as well be the book of Hymns, as it is rendered by Ainsworth… and by ‘spiritual songs’ are meant the same Psalms of David, Asaph, etc. and the titles of many of them are songs… These three words answer to Mizmorim, Tehillim, and Shirim, the several titles of David’s Psalms…</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/john-gill.html">John Gill</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Commentary on Ephesians</cite>, 5:19.Gill (1697-1771) was an English particular Baptist.</span></figcaption>

</figure><figure class="quote" id="q-394b30f141" data-kw="">
<blockquote><p>Wicked men cry out of bands and cords in religion… Away with this strictness and preciseness, it extinguishes the joy and pleasure of our lives; give us our cups instead of bibles, our profane songs instead of spiritual psalms, our sports and pastimes instead of prayers and sermons.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/john-flavel.html">John Flavel</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Flavel on the Content of Singing Public Praise to God</cite>, vol. 1; vol. 4, ‘England’s Duty’, p. 557</span></figcaption>

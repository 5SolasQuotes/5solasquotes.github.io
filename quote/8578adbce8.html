<main class="wrap"><figure class="quote" id="q-8578adbce8" data-kw="">
<blockquote><p>Thesis 2. Lest, however, our disputation be forced to wander and err, I will do that which I think ought to be done at the beginning, middle, and end of all disputations: that first, what it is that is being disputed should be defined; then, the common affections should be subjected to the definition; and finally, a division into parts and species should follow. And so our disputation on original sin will present: 1. its Definition, 2. its common Affections, 3. its Distribution.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/christoph-luthard.html">Christoph Luthard</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Theological Disputation on Original Sin</cite>, (Bern: Fabricius, 1637), p. 2 Lüthardt (1590-1663) was a Swiss reformed professor of philosophy and theology at Bern.</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/theology/faith-and-reason.html">Faith and Reason</a></span></div>

</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-ea060bdf15" data-kw="">
<blockquote><p>Reason cannot and ought not to bring forth any mysteries, as it were, out of its own storehouse; for this is the prerogative of scripture only. Also, that reason is not to be heard when complaining of its incapacity to comprehend the mysteries of faith: for, being finite, it is no wonder that reason should not comprehend many things that relate to what is infinite; and to reject a mystery because it is incomprehensible to reason, is to offend against reason itself. Neither is reason to be listened to whenever, under cover of holding the mysteries of faith, it aims at setting up its own errors. On the very same grounds we can not call philosophy any rule of faith, although we again concede that it is of no little use, provided it assume not to itself the power of dictating in articles of faith. True philosophy indeed serves very much both to convince men and to prepare their minds; and there is a wonderful harmony between sound philosophy and divinity: for truth is not contrary to truth, nor light to light; only we must not imagine that the former is the rule by which the sense of scripture must be tried and examined.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/benedict-pictet.html">Benedict Pictet</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Christian Theology</cite>, p. 54</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/theology/faith-and-reason.html">Faith and Reason</a></span></div>

</figure><figure class="quote" id="q-ccb43f1a89" data-kw="">
<blockquote><p>…as the soul of man is said to be in the head or heart, so conceive of God’s being in Heaven. The soul (we know) animates the whole body of man, and by the presence of it in every member communicates life to the whole: yet by way of preeminency and excellency it is said to be in the head or heart of man, because in these two parts of man, and from thence she exercises her cheifest functions, and derives her cheifest influence.</p></blockquote>

</figure><figure class="quote" id="q-00fdb6afba" data-kw="">
<blockquote><p>We call principles those things which are known per se by the light of nature, which are known immediately, and which are unmoved or immutable, such that from them at last definite knowledge arises. From these principles the faculty of reason deduces fixed processes, like rivulets from springs. It compares the principles of nature with the truth of reality or separates them from one another. It joins causes with effects and from these forms conclusions. It decides which things are common and which unique. Finally, it so orders everything that it acquires knowledge of all those things which the reason of a person can trace down and follow.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/francis-junius.html">Francis Junius</a></span><span class="wk"><span class="lbl">Work:</span> <cite>A Treatise on True Theology</cite>, trans. David Noe (1592?; RHB, 2014), ch. 10, ‘Natural Theology’, p. 146</span></figcaption>

</figure><figure class="quote" id="q-439c4aef4d" data-kw="">
<blockquote><p>XIII… And a little later: “As the soul is in the body, so Christians are in the world.” The soul, although dispersed throughout all the members of the body, is nonetheless present in it; likewise, Christians, though they dwell in the world, are not of the world. The invisible soul is established as if in a garrison within the visible body; similarly, Christians are recognized while they sojourn in the world, but their divine worship is invisible. And a little later: Although the soul is enclosed in the body, it still preserves the body; likewise, although Christians are detained in the world as if in custody, they also preserve the world.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/amandus-polanus.html">Amandus Polanus</a></span><span class="wk"><span class="lbl">Work:</span> <cite>‘Analytical Theses on Colossians, containing the Exordium of the Epistle’, pt. 1</cite>, (on Col. 1:1-11) $3 Download tr. Jonathan Tomes (Basel: Johannes Schroeter, 1601)</span></figcaption>

<main class="wrap"><figure class="quote" id="q-f4be480ae6" data-kw="">
<blockquote><p>The Covenant of Grace before Christ’s coming was administered under the Law. And here of the LAWS of GOD. Rom. 7.12. Wherefore the Law is holy, and the Commandment holy, just and good.

Princ. The Will of God revealed in his Law, was Holy Just and Good.

1. God hath revealed his Will. 1. By his Law ingraven in Man’s Heart. 2. By the Law Written, which is either Moral, or Mosaical; and This Ceremonial and Judicial. 2. An Abstract of these Laws. 1. Of the Ceremonial in Sacred Persons, and Sacred Things, and Sacred Times. 2. Of the Judicial, being reducible to the Commandments, which do make up 3. The Moral. 3. [sic] The use of these Laws severally. 4. The Excellency of them: Holy, Just, Good. 5. Duration of them. The Ceremonial, to the Death of Christ; The Judicial, to the destruction of Jerusalem; The Moral, to the end of the World.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/richard-steele.html">Richard Steele</a></span><span class="wk"><span class="lbl">Work:</span> <cite>A scheme and abstract of the Christian religion. Comprized in fifty two heads, with the texts of scripture, on which they are grounded. And some short indications, how they were more largely handled. By a lover of truth and peace</cite>, (London: Samuel Sprint, 1684), pp 8-9.</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/civil-government-and-society/natural-law-and-civil-law.html">Natural Law and Civil Law</a></span></div>

<blockquote><p>I conceive, though the State make a positive law, for order’s cause, that the king ordinarily convene parliaments; yet, if we dispute the matter in the court of conscience, the [parliamentary] estates have intrinsically (because they are the estates, and essentially judges of the land) ordinary power to convene themselves.</p></blockquote>

</figure><figure class="quote" id="q-d330f3a329" data-kw="">
<blockquote><p>§ 10, Direction 7. Meddle not with lawsuits till you have offered an equal arbitration of indifferent men, or used all possible means of love to prevent them. Lawsuits are not the first, but the last remedy. Try all others before you use them. § 11, Direction 8. When you must needs go to law, compose your minds to unfeigned love towards him that you must contend with, and watch over your hearts with suspicion and the strictest care, lest secret disaffection get advantage by it; And go to your neighbor and labor to possess his heart also with love, and to demulce [pacify] his mind, that you may not use the courts of justice as soldiers do their weapons, to do the worst they can against another, as an enemy: but as loving friends do use an amicable arbitration, resolving contentedly to stand to what the judge determines, without any alienation of mind or abatement of brotherly love. § 12, Direction 9. Be not too confident of the righteousness of your own cause, but ask counsel of some understanding, godly and impartial men; and hear all that can be said, and patiently consider of the case, and do as you would have others do by you.</p></blockquote>

<blockquote><p>4. He [Parker] makes a distinction betwixt the case of appellation and the case de nulla administratione mala praesumpta. Though the particular eldership has proceeded aright, though it consist of able and sufficient men, and though it be in re propria [in a proper thing], yet if one think himself wronged, and so appeal, then is it made obnoxious to a higher consistory, for says Parker, as the Council of Sardis ordains, audience must not be denied to him who entreats for it. So says Zepperus, speaking of the same purpose: ‘cuivis integrum quoque sit ad superiores gradus provocare, si in inferioris gradus sententia aut decreto aliquid desideret.’ (de Pol. Eccl., bk. 3, ch. 2)</p></blockquote>

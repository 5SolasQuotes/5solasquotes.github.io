<main class="wrap"><figure class="quote" id="q-d5c862daf2" data-kw="">
<blockquote><p>10. If after this public admonition the sinner shall obstinately refuse to manifest repentance, or to reform; it is the duty of the ministers to make a personal application to him of those threatenings which Christ has denounced in Scripture against such as he is; and especially to declare in the name of Christ, that he is one whose communion the church is bound to avoid; and to require him to forbear usurping that communion, and to charge the chuch in Christ’s name to avoid all familiarity with him, not only in God’s worship, but in common conversation, further than natural and civil relations bind us.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/richard-baxter.html">Richard Baxter</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Christian Concord, or the Agreement of the Associated Pastors &amp; Churches of Worcestershire, with Richard Baxter’s Explication &amp; Defence of it, &amp; his Exhortation to Unity</cite>, (London: A.M., 1653) | The Propositions agreed on by the Associated Ministers of the County of Worcester and some Adjacent Parts, n.p.</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/church-discipline/excommunication.html">Excommunication</a></span></div>

</figure><figure class="quote" id="q-90684a6b60" data-kw="">
<blockquote><p>12. They [congregationalist puritans] hold that if any member of the congregation having committed a scandalous sin, shall of self forsake the worship of God and the spiritual communion with the Church, that the Church shall then send for the said person, and if he refuse to come they shall (after much seeking and long patience) openly declare that he has no part nor portion in the holy things of God among them; that then the ecclesiastical officers have no authority or jurisdiction over him, but only the civil magistrate, and those unto whom he owes civil subjection, as parents, masters, landlords, etc.</p></blockquote>

</figure><figure class="quote" id="q-2f3703fa20" data-kw="">
<blockquote><p>8. By forgetting that God has not left the Church at arbitrary liberty to judge any godly or ungodly at their pleasure; But has given us a set test or rule to judge them by, which is their sober profession of consent to the baptismal Covenant, upon which the adult and their infants have right to baptism; and being baptized have right to Church-communion in all the acts which their age and understanding makes them capable of: And it is Church-tyranny to refuse such as show this title, till they are openly proved to forfeit it, by impenitency in gross sin after public admonition and due means. This is the truth, and the method of Christ’s discipline, and the rule of our communion.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/richard-baxter.html">Richard Baxter</a></span><span class="wk"><span class="lbl">Work:</span> <cite>A Second Admonition to Mr. Edward Bagshaw</cite>, (London: Simmons, 1671), ‘To those Readers…’, p. 3</span></figcaption>

</figure><figure class="quote" id="q-10e7eb0cf1" data-kw="">
<blockquote><p>It is uncharitable, and against the Word, to teach that when a church is dissolved, by no sin and scandal-visible, but by persecution or pestilence, that the dissolved members, though both real and visible converts, have no right to the ordinances: for if the formal cause, to wit, their confederacy into one visible body, as Mr. [Thomas] Hooker [a congregationalist] says, be removed, their visible and external right is removed. The like is to be said of visible professors, and of members of another congregation, and known godly sojourners [travelers]; these Mr. Hooker [by implication] excommunicates for no scandal, visible and invisible: for impossible it is that they can meet together in one place with their own church…</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/samuel-rutherford.html">Samuel Rutherford</a></span><span class="wk"><span class="lbl">Work:</span> <cite>A Survey of the Survey of that Sum of Church-Discipline Penned by Mr. Thomas Hooker</cite>, … (London, 1658), bk. 1 | ch. 19, ‘Mr. [Thomas] Hooker [a congregationalist], his formal cause of a Church visible, or Church confederating, is considered’, pp. 96-104, p. 96</span></figcaption>

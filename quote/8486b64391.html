<main class="wrap"><figure class="quote" id="q-8486b64391" data-kw="">
<blockquote><p>You [John Robinson] will happily say [Rutherford approving], there is no such necessity of baptizing as of ordination of ministers; and baptizing is incommunicable, because we read not that any in the apostolic Church baptized but pastors.</p></blockquote>

</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-b9d7f68c1a" data-kw="">
<blockquote><p>(1) All covenanted with God are to be baptized. But the children too are included in the covenant of grace, 1 Cor. 7:14 (the unbelieving husband is sanctified in the wife, and the unbelieving wife is sanctified in the brother: else were your children unclean; but now are they holy). The universal command to baptize all those covenanted with God includes the particular command regarding the baptism of children who are within the covenant. What belongs equally to all is not to be restricted to the adult pert of the seed;–and (2) even under the old covenant children were circumcised.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/amandus-polanus.html">Amandus Polanus</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Syntagma</cite>, Book 6, ch. 55 as translated in Heppe, Reformed Dogmatics ed. Bizer, trans. Thompson (1950; rep. Wipf &amp; Stock, 2007), pp. 623-24</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/baptism/subjects-of-baptism.html">Subjects of Baptism</a></span></div>

</figure><figure class="quote" id="q-99709e246d" data-kw="">
<blockquote><p>Hence baptism is a seal of our incorporation in Christ’s visible Church;” Rutherrford cites 1 Cor. 12:13; Acts 2:41; Mt. 28:19; Acts 8:38; 10:47; 16:15,23. His 4 considerations are:

1. Baptism is not that whereby we are entered into Christ’s mystical and invisible body as such, for it is presupposed we be members of Christ’s body, and our sins pardoned already, before baptism come to be a seal of sins pardoned; but baptism is a seal of our entry in Christ’s visible body, as swearing to the colors is that which enters a soldier to be a member of such an army, whereas before his oath, he was only a heart friend to the army and cause.

2. Baptism as it is such is a seal, and a seal as a seal adds no new lands or goods to the man to whom the charter and seal is given, but only does legally confirm him in the right of such lands given to the man by the prince or state; yet this hinders not but baptism is a real, legal seal, legally confirming the man in his actual and visible profession of Christ, remission of sins, regeneration, so as though before baptism he was a member of Christ’s body, yet quoad nos [as far as us], he is not a member of Christ’s body visible until he be made such by baptism.

3. On the controversy anent the efficiency, working and operation of the Sacraments</p></blockquote>

<div class="meta"><span class="t"><a href="../topics/baptism/subjects-of-baptism.html">Subjects of Baptism</a></span></div>

2. Baptism as it is such is a seal, and a seal as a seal adds no new lands or goods to the man to whom the charter and seal is given, but only does legally confirm him in the right of such lands given to the man by the prince or state; yet this hinders not but baptism is a real, legal seal, legally confirming the man in his actual and visible profession of Christ, remission of sins, regeneration, so as though before baptism he was a member of Christ’s body, yet quoad nos [as far as us], he is not a member of Christ’s body visible until he be made such by baptism.

</figure><figure class="quote" id="q-da3711feeb" data-kw="">
<blockquote><p>V. Those parishioners that desire us to baptize their children, or to be themselves admitted to the Lord’s Supper, and are not members of this church (because they will not), we desire to come to us, some days before that so we may be satisfied of their faith and life: And if they seem true Christians, and either bring a certificate that they are members of any other church, with (which we are to hold communion, or show that it is not from ungodliness that they refuse to live under order and discipline, we shall baptize their children, and occasionally admit them to our communion. But if they are scandalous, we shall require them first to profess their serious repentance: And if they return to scandal, we shall after stay till we see their reformation (or of one of the parents in case of baptism).</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/richard-baxter.html">Richard Baxter</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Christian Religion expressed</cite>, The Christian Religion expressed: I, briefly in the Ancient Creeds, the Ten Commandments &amp; the Lord’s Prayer, and, II, more largely in a Profession taken out of the Holy Scriptures, containing 1, the articles of the Christian Belief, 2, our consent to the Gospel Covenant, 3, the Sum of Christian Duty according to the primitive simplicity, purity, and practice, fitted to the right instruction of the ignorant, the promoting of holiness, and the charitable concord of all true believers… (London: 1660), The Order &amp; Discipline of this Church, agreeable to the Word of God</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/baptism/subjects-of-baptism.html">Subjects of Baptism</a></span></div>

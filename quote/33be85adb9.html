<main class="wrap"><figure class="quote" id="q-33be85adb9" data-kw="">
<blockquote><p>His profound feeling of dependence on God, for example, is illustrated in every conceivable way, not least strikingly in the constant habit of prayer which the Evangelists ascribe to him. But we are never directly told that he felt this dependence on God or “feared God”, or felt the emotions “of reverence and awe in the divine presence…¹ The narrative brings Jesus before us as acting under the impulse of all the religious emotions; but it does not stop to comment upon the emotions themselves. ¹ Cf. Heb. v. 7: “having been heard for his godly fear ([Greek] Eulabeia)”, i.e. for his reverent and submissive awe,” that religious fear of God and anxiety not to offend Him which manifests itself in voluntary and humble submission to his will” (Delitzsch in loc.). Davidson in loc: “The clause throws emphasis on the Son’s reverent submission.” Humanitarian writers debate whether “fear” of God is to be attributed to Jesus. Wellhausen (Israel, und jud. Geschichte, p. 383, expanded in Skizzen und Vorarbeiten, i. 1884, p. 98) represents him as passing his life in fear of the judge of all: “He feels the reality of God dominating life, he breathes in the fear of the Judge who demands account of every idle word and has power to destroy body and soul in hell.” Similarly Bousset (Jesus, 1904, pp. 54, 99, E. T. pp. 112, 203) speaks of him as learning by his own experience” that God is terrible (furchtbar) and that an awful darkness and dread encircles him even for those who stand nearest to him,” and as “sharing to the bottom of his soul” “the fear of that almighty God who has power to damn body and soul together,” which he “has stamped upon the hearts of his disciples with such marvellous energy.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/b-b-warfield.html">B. B. Warfield</a></span><span class="wk"><span class="lbl">Work:</span> <cite>‘On the Emotional Life of our Lord’ (1912)</cite>, pp. 80-81</span></figcaption>

</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-b402491f0d" data-kw="">
<blockquote><p>I will speak distinctly… how to understand his being forsaken of God, which is not to be understood: 1. As if the union of the Godhead with the human nature had been dissolved, but so as it might still be compatible, and rightly stand with it. For it was not a forsaking in respect of the essence of the Godhead, but of his presence, and so in a way of sense. The Godhead was not separated, though the operation of comfort from the Godhead were sequestered. The union hypostatical continued still with his soul, now filled with the sorrows of death, as well as it did with his body when He lay in the grave. And so as although his body was united to the fountain of life, yet it might die in respect of a natural life: so his soul, although the hypostatical union continued, might yet want [lack] comfort, which is life.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/thomas-goodwin.html">Thomas Goodwin</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Christ the Mediator, bk. 5, ch. 13</cite>, p. 279 in Works, vol. 5</span></figcaption>

</figure><figure class="quote" id="q-43b03abd6f" data-kw="">
<blockquote><p>Controversy 3 – Was Christ on account of the personal union so holy that He was not able to sin? We affirm against the scholastics and Arminians. Arguments 1. The devil could not do anything against Him (Jn. 14:30). 2. Everything He does, He does by the person (hypstasi) of the divine nature, although the actions are of the natures (suppositorum) (Acts 20:28), but that person cannot sin. 3. Then the union could be dissolved, since God has no communion with sin (Is. 59:2, 2 Cor. 6:14). 4. Christ, as a sinner, could be damned (Gal. 3:10). 5. Then God could lie in promises and predictions contrary to Heb. 6:17. 6. Then Christ could be cut off from the mediatorial office, and thus the foundation of salvation could be overturned contrary to Acts 2:25. Objection 1. He was free; therefore He was able to sin. Reply. So God and the angels in heaven are free, and we will be free after the judgment.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/leonard-riissen.html">Leonard Riissen</a></span><span class="wk"><span class="lbl">Work:</span> <cite>A Complete Summary of Elenctic Theology &amp; of as Much Didactic Theology as is Necessary trans. J. Wesley White MTh thesis (Bern, 1676; GPTS, 2009), ch. 11, ‘Christ’</cite>, pp. 121-22</span></figcaption>

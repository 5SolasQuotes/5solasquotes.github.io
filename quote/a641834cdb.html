<main class="wrap"><figure class="quote" id="q-a641834cdb" data-kw="">
<blockquote><p>Those, therefore, undoubtedly profane the Lord’s Day, who absent themselves from the public worship of God, either the former or the latter part of the day, that they may underhandedly follow their callings, settle their accounts, drive bargains, push on journeys, make visits, or the like, unless when the occasion is urgent, and mercy comes to take place of sacrifice (Matthew 12:7).

Yet, not they only are guilty of the breach of the Sabbath rest, who spend that part of the day, which we call “church time,” in worldly employments and recreations; but they also who spend the time before, between, and after public worship, so as either to entrench upon that full scope of time that they ought to take on that day, for their secret and family worship, and to abridge themselves of that, or so as to unfit themselves and put themselves out of frame for holy duties, or obstruct their profiting by them, do violate the Sabbath rest.

Works of necessity, which yet ought not to be a selfcreated necessity, we are allowed time for: the body must be fed, and clothed, and rested, that it may be fit to serve the soul in the service of God on this day. But no more of the time than is convenient for these must be alienated from the business of the day; if it be, we break in upon the appointed rest.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/matthew-henry.html">Matthew Henry</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Sabbath: A Serious Address to those that Profane the Lord’s Day</cite>, (1713; Grand Rapids MI: Torwood Press, 2013), pp 7-8.</span></figcaption>

<blockquote><p>Now when we hear of as strange a thing as this to have fallen out not long since in Bedfordshire; as namely, a match at Foot-ball, being appointed on the Lord’s Day in the afternoon; while two were in the Belfry, and one of them tolling a bell to call the company together, there was heard a clap of thunder and lightning, seen by some sitting in the Church-porch, as it came thorow a dark lane towards the Church and flashed in their faces who sate in the Church-porch, and seared them; thence it went into the Church, and turning into the Belfry, tripped up his heels who was tolling the bell, and struck him stark dead; and the other with him blasted in such manner, that shortly after he died; we do not call this a miracle, though we count it a remarkable judgement of God, and such as deserves to be considered, and seriously laid to heart by all, to admonish them to take heed, that they may be not found in like manner profaners of the Lord’s day.

In like sort when upon fresh relation we hear of the like sport at Foot-ball on the Lord’s day, at a place called Tidworth, after Evening prayer in the Church-yard, and that therein one had his leg broken, which thereupon gangrened, so that forthwith he died thereof; we do not call this a miracle; only it calls to our mind that of the Prophet, The Lord hath so done his marvellous works, that they ought to be had in remembrance.</p></blockquote>

<blockquote><p>Did the [Solemn League and] Covenant or our Profession [of Christianity] ever bind us to take the [Anglican] Liturgy, to be worse than it is, or the parish churches to be [considered] no churches, or their communion utterly unlawful? Or did it bind us to prefer a desertion of all public communion before it? No, it did not; but if it had, it had been sinful, and to be repented of. But, 1. We were bound by God’s word (and no covenant, or practices bind us to any more than Scripture binds us to) to avoid all that is sin. 2. And when we have our choice to prefer the best; he that does either turn to sin, or prefer a less good, when it is so, before a greater, goes back; but he that prefers no public worship before the parish worship goes back indeed and breaks the Covenant, by profaneness and schism. God’s Word is a clearer and surer test of our duty and controversies than any human covenants. When ministers were changed [in] 1647, many places got out [of the church] some tolerable weak ministers to get in abler men in [the churches in] great towns. When the bishops returned, their abler ministers being dead or ejected, they took the old ones again. Did these go back from Covenant Reformation or duty when they could have no better? Had not those been the revolters [to the Covenant] that would rather have had none?</p></blockquote>

<div class="meta"><span class="t"><a href="../topics/worship/oaths-and-vows.html">Oaths and Vows</a></span></div>
<div class="actions"><button class="copy" data-copy="“Did the [Solemn League and] Covenant or our Profession [of Christianity] ever bind us to take the [Anglican] Liturgy, to be worse than it is, or the parish churches to be [considered] no churches, or their communion utterly unlawful? Or did it bind us to prefer a desertion of all public communion before it? No, it did not; but if it had, it had been sinful, and to be repented of. But, 1. We were bound by God’s word (and no covenant, or practices bind us to any more than Scripture binds us to) to avoid all that is sin. 2. And when we have our choice to prefer the best; he that does either turn to sin, or prefer a less good, when it is so, before a greater, goes back; but he that prefers no public worship before the parish worship goes back indeed and breaks the Covenant, by profaneness and schism. God’s Word is a clearer and surer test of our duty and controversies than any human covenants. When ministers were changed [in] 1647, many places got out [of the church] some tolerable weak ministers to get in abler men in [the churches in] great towns. When the bishops returned, their abler ministers being dead or ejected, they took the old ones again. Did these go back from Covenant Reformation or duty when they could have no better? Had not those been the revolters [to the Covenant] that would rather have had none?”

— Richard Baxter, The English Nonconformity as under King Charles II &amp; King James II Truly Stated &amp; Argued, (1683; London: Parkhurst, 1689), ch. 58, p. 232">Copy</button><a class="share" href="https://x.com/intent/post?text=%E2%80%9CDid+the+%5BSolemn+League+and%5D+Covenant+or+our+Profession+%5Bof+Christianity%5D+ever+bind+us+to+take+the+%5BAnglican%5D+Liturgy%2C+to+be+worse+than+it+is%2C+or+the+parish+churches+to+be+%5Bconsidered%5D+no+churches%2C+or+their+communion+utterly+unlawful%3F+Or+did+it+bind+us+to+prefer+a+desertion+of+all+public+communion+before+it%3F+No%2C+it+did+not%3B+but+if+it+had%2C+it+had+been+sinful%2C+and+to+be+repented+of.+But%2C+1.+We+were+bound+by+God%E2%80%99s+word+%28and+no+covenant%2C+or+practices+bind+us+to+any+more+than+Scripture+binds+us+to%29+to+avoid+all+that+is+sin.+2.+And+when+we+have+our+choice+to+prefer+the+best%3B+he+that+does+either+turn+to+sin%2C+or+prefer+a+less+good%2C+when+it+is+so%2C+before+a+greater%2C+goes+back%3B+but+he+that+prefers+no+public+worship+before+the+parish+worship+goes+back+indeed+and+breaks+the+Covenant%2C+by+profaneness+and+schism.+God%E2%80%99s+Word+is+a+clearer+and+surer+test+of+our+duty+and+controversies+than+any+human+covenants.+When+ministers+were+changed+%5Bin%5D+1647%2C+many+places+got+out+%5Bof+the+church%5D+some+tolerable+weak+ministers+to+get+in+abler+men+in+%5Bthe+churches+in%5D+great+towns.+When+the+bishops+returned%2C+their+abler+ministers+being+dead+or+ejected%2C+they+took+the+old+ones+again.+Did+these+go+back+from+Covenant+Reformation+or+duty+when+they+could+have+no+better%3F+Had+not+those+been+the+revolters+%5Bto+the+Covenant%5D+that+would+rather+have+had+none%3F%E2%80%9D%0A%0A%E2%80%94+Richard+Baxter%2C+The+English+Nonconformity+as+under+King+Charles+II+%26+King+James+II+Truly+Stated+%26+Argued%2C+%281683%3B+London%3A+Parkhurst%2C+1689%29%2C+ch.+58%2C+p.+232&amp;url=https%3A%2F%2F5solasquotes.github.io%2Fquote%2Fd4d6caafe5.html&amp;via=5Solas" target="_blank" rel="noopener">Share on X<

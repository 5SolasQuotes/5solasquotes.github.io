<blockquote><p>Remedy (1). The first remedy against this device of Satan is, solemnly to consider, That there may be true faith, yea, great measures of faith, where there is no assurance. The Canaanite woman in the Gospel had strong faith, yet no assurance that we read of. ‘These things have I written unto you,’ saith John, ‘that believe on the name of the Son of God, that ye may know that ye have eternal life, and that ye may believe on the name of the Son of God,’ 1 John v. 13.

In these words you see that they did believe, and had eternal life, in respect of the purpose and promise of God, and in respect of the seeds and beginnings of it in their souls, and in respect of Christ their head, who sits in heaven as a public person, representing all his chosen ones, ‘Who hath raised us up together, and made us sit together in heavenly places in Christ Jesus,’ Eph. ii. 6; and yet they did not know that they had eternal life. It is one thing to have a right to heaven, and another thing to know it; it is one thing to be beloved, and another thing for a man to know that he is beloved.

It is one thing for God to write a man’s name in the book of life, and another thing for God to tell a man that his name is written in the book of life; and to say to him, Luke x. 20, ‘Rejoice, because thy name is written in heaven.’ So Paul, ‘In whom ye also trusted, after ye heard the word of truth, the gospel of your salvation: in whom also, after ye believed, ye were sealed with that Holy Spirit of promise,’ Eph. i. 1 3. So Micah: ‘Rejoice not against me, O my enemy: for when I shall fall, I shall rise; when I shall sit in darkness, the Lord shall be a light unto me. I will bear the indignation of the Lord, because I have sinned,’ &amp;c., or, ‘the sad countenance of God,’ as the Hebrew hath it, Micah vii. 8, 9. This soul had no assurance, for he sits in darkness, and was under the sad countenance of God; and yet had strong faith, as appears in those words, ‘ When I fall, I shall rise; when I sit in darkness, the Lord shall be a light unto me.’ He will bring me forth to the Light, and I shall behold his righteousness. And let this suffice for the first answer.

Remedy (2). The second remedy against this device of Satan is, solemnly to consider, That God in the Scripture doth define faith otherwise. God defines faith to be a receiving of Christ—’As many as received him, to them he gave this privilege, to be the sons of God,’ John i. 12. ‘To as many as believed on his name,’ Acts xi. 23 — to be a cleaving of the soul unto God, though no joy, but afflictions, attend the soul. Yea, the Lord defines faith to be a coming to God in Christ, and often to a resting and staying, rolling of the soul upon Christ. It is safest and sweetest to define as God defines, both vices and graces. This is the only way to settle the soul, and to secure it against the wiles of men and devils, who labour, by false definitions of grace, to keep precious souls in a doubting, staggering, and languishing condition, and so make their lives a burden, a hell, unto, them.

Remedy (3). The third remedy against this device of Satan is, seriously to consider this, That there may be true faith where there is much doublings. Witness those frequent sayings of Christ to his disciples, ‘Why are ye afraid, O ye of little faith?’ Persons may be truly believing who nevertheless are sometimes doubting. In the same persons that the fore-mentioned scriptures speak of, you may see their faith commended and their doubts condemned, which doth necessarily suppose a presence of both.

Remedy (4). The fourth remedy against this device of Satan is, solemnly to consider, That assurance is an effect of faith; therefore it cannot be faith. The cause cannot be the effect, nor the root the fruit. As the effect flows from the cause, the fruit from the root, the stream from the fountain, so doth assurance flow from faith. This truth I shall make good thus: The assurance of our salvation and pardon of sin doth primarily arise from the witness of the Spirit of God that we are the children of God, Eph. i. 13; and the Spirit never witnesseth this till we are believers: ‘For we are sons by faith in Christ Jesus,’ Gal. iv. 6. Therefore assurance is not faith, but follows it, as the effect follows the cause. Again, no man can be assured and persuaded of his salvation till he be united to Christ, till he be ingrafted into Christ; and a man cannot be ingrafted into Christ till he hath faith. He must first be ingrafted into Christ by faith before he can have assurance of his salvation; which doth clearly evidence, that assurance is not faith, but an effect and fruit of faith, &amp;c.

Again, faith cannot be lost, but assurance may; therefore assurance is not faith. 1 Though assurance be a precious flower in the garden of a saint, and is more infinitely sweet and delightful to the soul than all outward comforts and contents; yet it is but a flower that is subject to fade, and to lose its freshness and beauty, as saints by sad experience find, &amp;c.

Again, a man must first have faith before he can have assurance, therefore assurance is not faith. And that a man must first have faith before he can have assurance, is clear by this, a man must first be saved before he can be assured of his salvation; for he cannot be assured of that which is not. And a man must first have a saving faith before he can be saved by faith, for he cannot be saved by that which he hath not; therefore a man must first have faith before he can have assurance, and so it roundly follows that assurance is not faith, &amp;c.</p></blockquote>

<blockquote><p>Hence we conclude that the knowledge of faith consists more of certainty than discernment. … We add, that it is sure and firm, the better to express strength and constancy of persuasion. For as faith is not contented with a dubious and fickle opinion, so neither is it contented with an obscure and ill-defined conception.</p></blockquote>

— John Calvin, Institutes of the Christian Religion, 3.2.14–15">Copy</button><a class="share" href="https://x.com/intent/post?text=%E2%80%9CHence%20we%20conclude%20that%20the%20knowledge%20of%20faith%20consists%20more%20of%20certainty%20than%20discernment.%20%E2%80%A6%20We%20add%2C%20that%20it%20is%20sure%20and%20firm%2C%20the%20better%20to%20express%20strength%20and%20constancy%20of%20persuasion.%20For%20as%20faith%20is%20not%20contented%20with%20a%20dubious%20and%20fickle%20opinion%2C%20so%20neither%20is%20it%20contented%20with%20an%20obscure%20and%20ill-defined%20conception.%E2%80%9D%0A%0A%E2%80%94%20John%20Calvin%2C%20Institutes%20of%20the%20Christian%20Religion%2C%203.2.14%E2%80%9315&amp;url=https%3A%2F%2F5solasquotes.github.io%2Fquote%2Fe401e1a03f.html&amp;via=5Solas" target="_blank" rel="noopener">Share on X</a><a class="perma" href="../quote/e401e1a03f.html">Permalink</a><a class="src" href="https://ccel.org/ccel/calvin/institutes" rel="noopener" target="_blank">Read it online · CCEL</a></div>
</figure><figure class="quote" id="q-0f89033f49" data-kw="">
<blockquote><p>These things thus premised, I come to show the grounds or particulars wherein our pardon of sin is thus completed. And first, in our sense and feeling: for howsoever God pardon a sin perfectly, yet our faith which receives it is weak. This jewel is taken with a trembling and shaking hand. Hence it is that we have not full faith and confidence in our spirits. We may see this in David; though Nathan told him his sins were forgiven him, yet his faith was not so vigorous and powerful as wholly to apply this to his own soul, and therefore he had much anguish and trouble of heart afterwards. But now, at the last day, all these fears, diffidence and darkness will be quite removed out of our hearts. There shall be no more disturbance in our souls than there can be corruption in the highest heavens; we shall then have such a gourd as no worm can devour. Our souls shall not then know the meaning of sitting in darkness, and wanting God’s favour. There will then be no complaints, ‘Why has the Lord forsaken me?’ Well may God’s children be called upon to lift up their heads, when such a redemption draws nigh; and well may that day be called the times of refreshment, seeing the people of God are so often scorched with the fiery darts of Satan. Secondly, pardon of sin will at that day be perfected. Because all the effects of pardon will then be accomplished and not so much as any scars remain, the wound will be so fully healed. Although God does fully pardon sin, yet the effects of this are delayed; many chastisements and sad afflictions are to be undergone: howsoever, death itself, and the corruption in the grave must seize upon justified persons; now these are the fruit of sin, and howsoever the sting of these be taken away, yet they are not wholly conquered till that Last Day. Then therefore may we justly say, sin is pardoned, when there shall be no more grave, no more death, no more corruption, but all shall be swallowed up in immortality and glory. Thirdly, then, and not till then may we say remission of sins will be completed, because then shall no more iteration of pardon be. Here in this life, because the root of corruption abides in us, there are daily pullulant [sprouting] branches of sins, and so frequent guilt is contracted; whereby as we have daily sores, so we need daily plasters. It is with original corruption in us, as in that tree in Dan. 4:14-15; although the branches be cut off, yet the stump is still in the earth, and that sprouts out too fast by the temptations that are always by it. Hence it is that we always pray, ‘Forgive us our sins;’ and because of these failings the apostle, 2 Cor. 5:20, writes to, and exhorts the godly Corinthians, who were already reconciled to God, to be further reconciled to Him. But then this petition shall wholly cease; then there will be no serpent to sting us, nor will the eye of justifying faith to look upon the brazen serpent exalted be necessary any more. The Lord will not only wipe away the tear of worldly grief, but also of godly sorrow at that time. Then, and not till then, will it be true, that God sees no sin in his children. Then will the Church be without wrinkles, or any spot within her. In this respect it is, the Church of God prays so earnestly for the Bridegroom’s coming. For this it is they look for and hasten in their prayers that day. Fourthly, at that day will pardon of sin only be completed, if you consider the nature of justification. For what is that, but an overcoming the accusing adversary, and clearing of us against every charge? Now this is most eminently and fully done in those last assizes. The Syriac word to justify is also to conquer and overcome, because when a man is justified, he overcomes all those bills and indictments which were brought in against him; now this is manifestly done in the Day of Judgment, when God shall before men and angels acquit and absolve his people: and if the apostle say in this life, Rom. 6:7, of a godly man dead in Christ, he is justified from his sins, in respect of sanctification, that sin does not conquer him, but he sin, how much more will this be true at that day, when all the guilt and filth of sin shall be totally removed? Oh what a glorious conquest will that be over sin, hell, and the devil, when the Judge of the whole world shall pronounce them free from all sin, and command them to enter into his glorious rest!</p></blockquote>

<blockquote><p>Give me some guidance as to what I should do to derive a firm confidence and sure comfort from the articles of faith. A. First of all, for each and every article of faith think about God’s promise that if you believe it in your heart and confess it with your mouth [Rom. 10:9, 10], God promises and gives you what is stated in that article. For example, when you confess, “He suffered under Pontius Pilate,” you must not only remember the Passion story (for the Evil One knows it as well) but also believe that in this article God promises and assures you that He suffered for you and that it belongs to you as much as if you yourself had suffered. Or when you confess, “Was crucified” (namely, for me), God promises you that He had His Son suffer for you (as Paul says in Galatians 2[:20], “Who loved me and gave himself for me”) and that this, therefore, belongs to you no less than if you yourself had been nailed to the cross when Christ was, to pay for your sins. In sum, always remember that what is stated in each article is promised and given to you for salvation. That is why you also say, “I believe,” namely, that all this has happened also for my good and is promised and given by God to me as much as to the greatest of saints. In fact, you should be very certain that if you, poor sinner, had been all by yourself on the earth like a lone little sheep, nevertheless Christ would have left the ninety and nine already in heaven and come down to you from His heavenly glory to find you, put you on His back, and save you, as He Himself teaches in the gospel [Luke 15:3–7].</p></blockquote>

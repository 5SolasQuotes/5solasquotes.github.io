<main class="wrap"><figure class="quote" id="q-3eda47bbc3" data-kw="">
<blockquote><p>Our election … consisteth not in ourselves, but in the eternal and immutable good pleasure of God, and that in such absolute authority that it cannot be overthrown, neither by the raging storms of the world, nor by the assaults of Satan; neither yet by the wavering and weakness of our own flesh. Then only is our salvation in assurance, when we find the cause of the same in the bosom and counsel of God.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/john-knox.html">John Knox</a></span><span class="wk"><span class="lbl">Work:</span> <cite>On Predestination</cite>, p. 33</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/election/ground-of-election.html">Ground of Election</a> › <a href="../topics/election/ground-of-election/gods-good-pleasure.html">God&#x27;s good pleasure</a></span><span class="t"><a href="../topics/election/ground-of-election.html">Ground of Election</a> › <a href="../topics/election/ground-of-election/not-foreseen-faith-or-works.html">Not foreseen faith or works</a></span></div>

</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-6e0adc620a" data-kw="Love Wisdom Election">
<blockquote><p>That the great God purposed and designed an union with himself of those whom in a special manner he had set himself to love; and that this union is the deepest and furthest design of his heart, of any he hath toward them, or the whole creation. The full demonstration of his manifold wisdom and power moved him to make a variety of persons, things, yea, of worlds; but then his goodness and his love moved him to reduce out of that variety an all out of every sort, as a pledge of his respect to all, unto an unity again, and that with himself; and this union is the top perfection of all his works, as that, John 17:23, ‘I in them, and they in me, that they may be made perfect in one.’ It is the perfection of the creature, whereof the unity of the three Persons is the pattern, and the perfection of God’s design.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/thomas-goodwin.html">Thomas Goodwin</a></span><span class="wk"><span class="lbl">Work:</span> <cite>An Exposition of the First Chapter of Ephesians</cite>, Works, vol. 1, Sermon X (Eph. 1:10)</span></figcaption>

</figure><figure class="quote" id="q-1ef2c0c632" data-kw="">
<blockquote><p>The elect in due time, though in various degrees and in different measures, attain the assurance of this their eternal and unchangeable election, not by inquisitively prying into the secret and deep things of God, but by observing in themselves with a spiritual joy and holy pleasure the infallible fruits of election pointed out in the Word of God—such as, a true faith in Christ, filial fear, a godly sorrow for sin, a hungering and thirsting after righteousness, etc.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/synod-of-dort.html">Synod of Dort</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Canons of Dort</cite>, Head 1, Art. 12</span></figcaption>

</figure><figure class="quote" id="q-7dc5b5cb68" data-kw="">
<blockquote><p>Holy Scripture most especially highlights this eternal and undeserved grace of our election and brings it out more clearly for us, in that it further bears witness that not all people have been chosen but that some have not been chosen or have been passed by in God’s eternal election—those, that is, concerning whom God, on the basis of his entirely free, most just, irreproachable, and unchangeable good pleasure, made the following decree: to leave them in the common misery into which, by their own fault, they have plunged themselves; not to grant them saving faith and the grace of conversion; but finally to condemn and eternally punish those who have been left in their own ways and under God’s just judgment, not only for their unbelief but also for all their other sins, in order to display his justice.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/synod-of-dort.html">Synod of Dort</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Canons of Dort</cite>, Head 1, Art. 15</span></figcaption>

</figure><figure class="quote" id="q-1602862aa3" data-kw="">

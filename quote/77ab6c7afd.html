<main class="wrap"><figure class="quote" id="q-77ab6c7afd" data-kw="">
<blockquote><p>The magistrate as such has nothing to do with the spirit, nor can he command the sincerity of the worship; his care is that there be a divine worship, that is, materially and externally right and consonant, externally to the rules of the word; and for this cause learned divines make the external man the object of the magistrates office;</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/samuel-rutherford.html">Samuel Rutherford</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Divine Right of Church Government (1646), ch. 24</cite></span></figcaption>
<div class="meta"><span class="t"><a href="../topics/worship/nature-of-worship.html">Nature of Worship</a></span></div>

<blockquote><p>As we deny not those things that are written, so we refuse those things that are not written. That God was born of a virgin we believe, because we read it: that Mary did marry after she was delivered, we believe not, because we read it not.</p></blockquote>

</figure><figure class="quote" id="q-b832562738" data-kw="">
<blockquote><p>What holy invectives does Paul in his epistles make against superstitious worship? Yet how few are the men that mind the pure instituted worship of God, that would have the fountains of Israel without the mixture of any mud in them? Outward oppressions in Popery were nothing so heavy upon the godly as the corrupt mixtures in God’s worship; but if you observe the general disposition of men, they are wholly carried out to some sensible superstitious ways of worship. They love not the simplicity and purity of God’s worship. It is great proficiency in Christianity not to have our minds corrupted herein. As children delight in babies, so do men [delight] in some worships of their own that they have made. What is Popery but a mere stage-play in the worship of God? And if you ask of hundreds of ceremonies they have: ‘Whose image and superscription is upon them?’ You shall find none of God’s imprinted on them. There were the statutes of the heathens (Lev. 20) and these the people must not go in (Eze. 20). There are statutes of our fathers we must not walk in: Oh there is too much of this superstition still in men! Men by false worship manifest they have not spiritual hearts.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/anthony-burgess.html">Anthony Burgess</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Spiritual Refining… (London, 1652) | section 11, sermon 95</cite>, pp. 563-64</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/worship/nature-of-worship.html">Nature of Worship</a></span></div>

</figure><figure class="quote" id="q-748db3f4cb" data-kw="">
<blockquote><p>And thus have we made good our argument that the lawfulnss of the ceremonies cannot be warranted by any ecclesiastical law. If we had no more against them, this were enough, that they are but human additions and want the warrant of the Word. When Nadab and Abihu offered strange fire before the Lord (Lev. 10:1), and when the Jews burnt their sons and their daughters in the valley of the son of Hinnon, howsoever manifold wickedness might have been challenged in that which they did, yet if any would dispute with God upon the matter, He stops their mouths with this one answer, ‘I commanded it not, neither came it into my heart.’ (Jer. 7:31)</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/george-gillespie.html">George Gillespie</a></span><span class="wk"><span class="lbl">Work:</span> <cite>English-Popish Ceremonies (1637), bk. 3, ch. 7, section 14</cite>, p. 122</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/worship/nature-of-worship.html">Nature of Worship</a></span></div>

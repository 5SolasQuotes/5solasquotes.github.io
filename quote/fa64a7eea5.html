</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-0ca8881730" data-kw="">
<blockquote><p>Yea, Dr. Ursinus, in his Judicium de Disciplina Ecclesiastica et Excommunicatione, exhibited to the Prince Elector Palatine Frederick III (who had required him to give his judgment concerning Erastus’ theses), does once and again observe, that all the reformed churches and divines, as well as those that did not practice excommunication as those who did practice it, agree, notwithstanding, in this principle, that excommunication ought to be in the church; which is a mighty advantage against Erastianism.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/zacharias-ursinus.html">Zacharias Ursinus</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Judgment Concerning Ecclesiastical Discipline &amp; Excommunication 1569 17 pp. in Works, vol. 3</cite>, pp. 801-18</span></figcaption>

</figure><figure class="quote" id="q-9cdcbe8cb2" data-kw="">
<blockquote><p>Now all this being unquestionably true of the Jewish Sanhedrin: if we should suppose, that they had no supreme Sanhedrin but that which had the power of civil Magistracy, then I ask where is that Christian State, which was, or is, or ought to be molded according to this pattern. Must ministers have vote in parliament? Must they be civil lawyers? Must all criminal and capital judgments be according to the Judicial Law of Moses, and none otherwise? Must there be no civil punishment, without previous admonition of the offender? Must Parliaments sit, as it were in the Temple of God, and interpret Scripture, which sense is true, and which false, and determine controversies of faith and cases of conscience, and judge of all false doctrines? Yet all this must be if there be a parallel made with the Jewish Sanhedrin. I know some divines hold, that the Judicial Law of Moses, so far as concerns the punishments of sins against the moral Law, idolatry, blasphemy, Sabbath-breaking, adultery, theft, etc. ought to be a rule to the Christian Magistrate. and for my part, I wish more respect were had to it, and that it were more consulted with.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/george-gillespie.html">George Gillespie</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Please enjoy Aaron’s Rod (reprint, Sprinkle) p. 2. Gillespie is arguing against an Erastian:</cite></span></figcaption>

<blockquote><p>I own the king’s authority, since he has it not only by God’s providence, but by the consent of the Estates of the Land, who have determined that he is the lawful successor: And it is a question if he be worse than those whom the prophets have been subject unto under the Old Testament, and those to whom the apostle commands subjection under the New.</p></blockquote>

<blockquote><p>Schism is either a rash or an unjust separation upon the account of religion. It is with schism, as with error: a light error continued in with obstinacy becomes heresy. So there is a schism which may not be called unjust, but only rash, being grounded on a light cause; but if pertinacy be added, when the levity of the cause does appear, it becomes truly, and [Greek] an eminent schism. This rash schism may be known, either (à priori) from its previous cause, for no man being compelled to it (if we will speak the truth), it proceeds from self-love, therefore also hatred follows upon it. Nor would any rash schism be made if we had charity, which is the most perfect bond and is not easily provoked, and thinks no evil. It is therefore a manifest note of hatred, which hatred may arise either from an offence really given or only taken; as when a man is grieved that another is preferred before him. Again, a schism is made rashly either by the chief authors upon a light occasion, as if when an ulcer does appear upon any member, the surgeon should presently think of cutting off that member without applying other means, or expecting what nature may do. But we may suppose that the schism be made upon the occasion of heresy, and then the separation may be thought to be just and not rash. To which I answer: That as judges, who in too great passion do condemn a malefactor that is really guilty, may be unjust, because they are acted rather by a certain ferity of mind than by the love of justice: so that separation, which proceeds from hatred, though it may have just causes, yet is unjust. Again, the rashness of separation appears, à posteriori, when it is made on a light occasion, that is, where there is not a great and intolerable persecution, nor heresie, nor idolatry. For, first, if the persecution be tolerable, that is, if it do not concern our lives or things necessary thereunto, we may not catch at an opportunity of departing: for as they that delight in a civil war, though they have the better cause, and just occasions, yet because they are glad of such occasions, they are murderers and enemies of their country. 2ly, separation is rash if the error in the Church from which he departs be neither heresie, nor superstition: for if the error be tolerable, as a superstitious rite may be, we may not separate; as a sick man is not to be forsaken unless his disease be deadly and contagious, and then not without grief. Lastly, separation is rash when it is made because of corruption of manners, to which purpose our Savior said, ‘They sit in Moses’s chair, therefore do whatever they say unto you.’ [Mt. 23:1-3] This is the meaning of our Savior: Wherever the purity of doctrine does remain, there God has a Church, though overspread with many scandals. Now an unjust Schism is that, which is made where there is no persecution or heresy, no error, superstition, or idolatry, none, or but few scandals; such was the schism of the Donatists. And this is the greatest degree of schism: and it is either negative, which is a bare departure only, without gathering of new congregations; or positive, when another Church is erected, which does separately use ecclesiastical laws, and the administration of the Word of God and sacraments, which the Scripture calls setting up of altar against altar [2 Kn. 16:10-16; Hos. 8:11; 10:1-2]; for, though a peaceable departure from the Church may be lawful and just, yet if new associations be entred into, it is unjust; for this cannot be done unless there be real hatred between brethren, contrary to Christianity; for the end of the commandment is charity. It must therefore be considered again and again whether the cause of this separation be of so great moment as that the glory of God and salvation depends upon it.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/john-cameron.html">John Cameron</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Other citations (work not named)</cite>, On Schism, p. 322 in The Character of a Separatist, or Sensuality the ground of Separation… (London, 1677), Picture &amp; Character of a Separatist, pp. 23-25 Cameron (c. 1579 – 1625) was a Scottish theologian, professor and formalist.</span></figcaption>

<blockquote><p>If any person walk unworthy of the Gospel or commit any trespass, he is (unless the scandal be public and notorious) admonished first: secretly by one, next by two or three more. And thirdly, if he contemn both, then according to the order prescribed by our Savior (Matt 18), the matter is brought before the minister and elders where he is accused both of the trespass and of the contempt. If he cannot yet be brought to repentance, then is the matter in some measure made known unto the congregation and he is called before the greater presbytery, where, if he give signs of his repentance, he is remitted to satisfy his own session. But if he persist in his obstinacy, then by the ordinance of the presbytery, the particular eldership is to proceed against him with the censures of the church even to excommunication. The matter being thus heard, known and judged, and the whole process revised by the greater presbytery, the next Sabbath (without delay) the trespass and order of admonitions are declared to the congregation and the person (without specification of his name) is admonished yet to satisfy. Which, if he still refuse to do, the next Sabbath his name, with his offence and contempt, are published. If he yet continue obstinate, then on the next Sabbath (which is the third), he is charged publicly to satisfy for his offence and contempt under the pain of excommunication. If now he offer himself to the particular presbytery, then do they (at the appointment of the presbytery) give order for his public repentance, the removing of the scandal, and his reconcilement to the church. Otherwise the minister proceeds in this order: … As the presbytery excommunicates profane professors, so does it also depose preachers… … The subject and matters treated in the presbytery are all the ecclesiastical matters of weight which concern the particular churches there represented, as: the examination, ordination, suspension and deposition of ministers, scandals of ministers in doctrine, life, or any part of their calling, the decerning [decreeing] of excommunication…</p></blockquote>

— Alexander Henderson, The Government &amp; Order of the Church of Scotland">Copy</button><a class="share" href="https://x.com/intent/post?text=%E2%80%9CIf+any+person+walk+unworthy+of+the+Gospel+or+commit+any+trespass%2C+he+is+%28unless+the+scandal+be+public+and+notorious%29+admonished+first%3A+secretly+by+one%2C+next+by+two+or+three+more.+And+thirdly%2C+if+he+contemn+both%2C+then+according+to+the+order+prescribed+by+our+Savior+%28Matt+18%29%2C+the+matter+is+brought+before+the+minister+and+elders+where+he+is+accused+both+of+the+trespass+and+of+the+contempt.+If+he+cannot+yet+be+brought+to+repentance%2C+then+is+the+matter+in+some+measure+made+known+unto+the+congregation+and+he+is+called+before+the+greater+presbytery%2C+where%2C+if+he+give+signs+of+his+repentance%2C+he+is+remitted+to+satisfy+his+own+session.+But+if+he+persist+in+his+obstinacy%2C+then+by+the+ordinance+of+the+presbytery%2C+the+particular+eldership+is+to+proceed+against+him+with+the+censures+of+the+church+even+to+excommunication.+The+matter+being+thus+heard%2C+known+and+judged%2C+and+the+whole+process+revised+by+the+greater+presbytery%2C+the+next+Sabbath+%28without+delay%29+the+trespass+and+order+of+admonitions+are+declared+to+the+congregation+and+the+person+%28without+specification+of+his+name%29+is+admonished+yet+to+satisfy.+Which%2C+if+he+still+refuse+to+do%2C+the+next+Sabbath+his+name%2C+with+his+offence+and+contempt%2C+are+published.+If+he+yet+continue+obstinate%2C+then+on+the+next+Sabbath+%28which+is+the+third%29%2C+he+is+charged+publicly+to+satisfy+for+his+offence+and+contempt+under+the+pain+of+excommunication.+If+now+he+offer+himself+to+the+particular+presbytery%2C+then+do+they+%28at+the+appointment+of+the+presbytery%29+give+order+for+his+public+repentance%2C+the+removing+of+the+scandal%2C+and+his+reconcilement+to+the+church.+Otherwise+the+minister+proceeds+in+this+order%3A+%E2%80%A6+As+the+presbytery+excommunicates+profane+professors%2C+so+does+it+also+depose+preachers%E2%80%A6+%E2%80%A6+The+subject+and+matters+treated+in+the+presbytery+are+all+the+ecclesiastical+matters+of+weight+which+concern+the+particular+churches+there+represented%2C+as%3A+the+examination%2C+ordination%2C+suspension+and+deposition+of+ministers%2C+scandals+of+ministers+in+doctrine%2C+life%2C+or+any+part+of+their+calling%2C+the+decerning+%5Bdecreeing%5D+of+excommunication%E2%80%A6%E2%80%9D%0A%0A%E2%80%94+Alexander+Henderson%2C+The+Government+%26+Order+of+the+Church+of+Scotland&amp;url=https%3A%2F%2F5solasquotes.github.io%2Fquote%2Fbf446c742e.html&amp;via=5Solas" target="_blank" rel="noopener">Share on X</a><a class="perma" href="../quote/bf446c742e.html">Permalink</a><a class="src" href="https://reformedbooksonline.com/topics/topics-by-subject/church-government/the-ruling-of-the-church/independent-churches-do-not-have-the-authority-for-greater-excommunication/#:~:text=If%20any%20person%20walk%20unworthy%20of,calling%2C%20the%20decerning%20%5Bdecreeing%5D%20of%20excommunication&amp;text=If%20any%20person%20walk%20unworthy%20of%20the%20Gospel&amp;text=of%20their%20calling%2C%20the%20decerning%20%5Bdecreeing%5D%20of%20excommunication" rel="noopener" target="_blank">Read it online · Reformed Books Online</a></div>

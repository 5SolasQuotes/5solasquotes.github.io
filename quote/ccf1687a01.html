<blockquote><p>But where find we that women which were prophetesses and immediately inspired were allowed to deliver their prophesy in the Church [according to Gillespie’s objector]? I suppose he had a respect to 1 Cor: 11:5, ‘But every woman that prayeth or prophesieth with her head covered, dishonoureth her head,’ which is meaned of the public assembly, for the apostle is speaking of covering or uncovering the head in the Church. [The argument of the last statement is that one can know that the context in 1 Cor. 11 is of public assemblies of the Church (as opposed to private) because it mentions the practice of headcoverings. That is, headcoverings had a distinctively public function, likely to all such societal, public functions. This is confirmed below.] But diverse interpreters understand here by a woman that prays or prophesies, a woman that joins as a hearer in the public assembly: and so verse 4, by a man that prays or prophesies [signifies] a man that is a hearer and joins in the ordinances. So that the Geneva annotation upon verse 5 gives a good sense of that text: that women which show themselves in public and ecclesiastical assemblies without the sign and token of their subjection, that is to say, uncovered, shame themselves. See more for this in Junius, his annotations on the Arabic version in that place. If the apostle by ‘prophesying’, 1 Cor. 11:4-5, understand prophesying by immediate inspiration, then the objection may be retorted and turned into an argument against the objectors [who advocated for regular lay preaching]: For the sense of the word ‘prophesying’ in the 11th chapter may give light to the word prophesying in the 14th chapter, verse 3. Peter Martyr (Common Places, eccles. 4, ch. 1) is indeed of opinion that women which were prophetesses and extraordinarily inspired might speak in the Church, provided that their heads were covered, in token of feminine subjection, and that the forbidding of women to speak in the Church extends to such, and so he reconciles, 1 Cor. 14:34; 1 Tim. 2:13 with 2 Cor. 11:5. I doubt his opinion in this particular is not well grounded, only so far I make use of it: that if 1 Cor. 11:5 be meant of prophetesses praying or prophesying in the Church (which the Objector has to prove). Then certainly the forbidding of women to speak in the Church cannot be understood universally, but with a reserve and exception of extraordinary cases. But how can this exception of prophetesses consist with the text, ‘Let your women keep silence in the Church,’ Why [Greek] your women, they had prophesying women, as is supposed by these of the other opinion, from 1 Cor. 11:5. Nay, even your women must be silent says the apostle; and the reasons which he adds are so universal as to comprehend even prophetesses, they are commanded to be under obedience, and to be in subjection (which Martyr himself notes), holds true of prophesying women as well as others; and that for that cause their heads were to be covered. Another reason is added, 1 Tim. 2:14, Adam was not deceived; but the woman being deceived, was in the transgression. It might be feared, says Peter Martyr, if women were permitted to speak in the Church, Satan should return to his first wile and deceive the man by the woman. Surely he that made use of Eve might also make use of a prophesying woman to deceive, and so much the more, because, now since the fall, both man and woman are more subject to tentation. So that both the apostle’s command and the reasons of it seem plainly to exclude even prophesying women from speaking in the Church; and if they be allowed to deliver extraordinary prophesies and revelations in the Church, why not also to prophesy as other gifted members? If that which is greater be allowed them, why not that which is less? And if prophetesses be excepted from the rule, 1 Cor. 14:34, why not also other women of excellent gifts?</p></blockquote>

<blockquote><p>[Margin Note:] The uncovering of the head not like kneeling We uncover our heads, say they, when we receive the elements, why may we not also kneel? I answer: First, the uncovering of the head is a gesture of reverence only, and that only among some nations, but not of adoration. The Jews, Turks and Mahometans pray with their heads covered. The Grecians and Romans of old, howbeit they walked in public with uncovered heads, except in rain, great heat or mourning, yet in the service of their gods, they had their heads covered. The Europeans this day uncover their heads when they are praying. Kneeling is a gesture of adoration among all nations, either in civil or religious use. Augustine says: ‘Honorat emnis qui adorat, no autem adorat omnes quid onorat;’ ‘Every one that does adore, does honor, but not every one that honors, adores.’ Contra Serm. Arian., ch. 23 I will not kneel to every one to whom I uncover my head civilly. Everyone that stands with his head uncovered in presence of the king is not adoring, as he is who is presenting his petition to the king upon his knee in their sight. A provincial synod holden at London (anno 1603) ordained the head to be uncovered when their service is read in the Church, yet I think they would not have enjoined kneeling. We [the Scots] hear the canonical scripture read [in the administration of the Lord’s Supper] with uncovered heads, but yet we kneel not. The words of Christ, which He uttered at the institution are still and often uttered; that same voice sounds through all the tables of the world; his actions, which were divine and holy, are reiterat[ed]. In Gratian’s decree (De consecrat. dist. 1, ch. 68) we have a superstitious direction of Pope Anastasius, that when the Gospel is read in the Church, those that are present shall not sit, but stand, venerabiliter curvi, bowing reverently, hearken and adore. Wherefore more at the hearing of the Gospel than the [reading of the] Epistle[s], which is also Evangelical? Yet you see, howbeit that standing with bowing be more than to have the head uncovered, it was but veneration. And, whereas he says, Et fideliter adorent, the gloss has, id est venerentur, because the word ‘adoring’ is taken there in a large sense, as ye may see [in] sundry places above cited, not for that which is in a strict sense called adoration. Adoration in strict sense is kneeling or prostration. Whereas Matthew says, ch. 8, of the leprous man, that he worshipped Christ, or adored Christ, as the Latin translation has according to the original, Mk. 1:40, He kneeled down to Him, and Luke 5:12, that he fell in his face. Suchlike, where it is said of the Cananitish woman, Mt. 15:25, that she worshipped, or adored Him: et adoravit eum, Mk. 7:25, it is said that she fell at his feet. The Greek word [Greek], signifies to fall down like a dog o••whelp at the feet of another, as our Lord. Further, our heads are not other way uncovered in the act of receiving than in the rest of the time of the celebration when we are not near the elements. And thirdly, the uncovering of our head is compatible with the variety of actions in time of celebration: praying, singing, the words of the institution, and chapters read, but adoration directed, as they pretend to God, cannot be without presenting our petitions and thanks to God, which requires a several part of the action by itself.</p></blockquote>

<blockquote><p>2. I hope it will be granted me too, without much begging, that for the woman to come into the congregation of God’s worshippers with her head uncovered, or attired after the manner of the man, is a very uncomely and unchristian-like thing…

3. And I presume upon the observation of all that I have had to do with, that it will not be denied that in praying and in singing of psalms, the man ought to have his head uncovered. I met with none that own these ordinances, but are ready to own it to be their duty to be uncovered in them, and take it as a piece of profane irreverence and contempt of God’s ordinance to be otherwise. Though indeed there be some, who of late have learnt a new fashion of uncovering the head, by hanging their hats half way on one side, or on their brows; these are uncovered by a synecdoche partis, and show their readiness to keep them quite on, if it were but the fashion; as if they were afraid of too much reverence, or of abasing themselves too much in the sight of God. Of whom this fantastical fashion was first learnt, I know not; yet thus much even these seem to grant by that little they do, that in these duties the head ought to be uncovered in whole or in part. And being thus far agreed, that which remains to be tried, is only this: Whether it be the duty of the man to have his head uncovered, while the word of God is read or preached in the congregation of his people?… Objection 1: I hear some allege thus, That it is in itself a matter of indifferency, and to be determined by the custom of those particular churches or people, where any one has his conversation, and not to be positively asserted for a general duty… Objection 2: Others object, That the Reformed Churches in other countries observe no such thing, but generally practice the contrary in their assemblies; but if it were a duty, why should not they practice it as well as we?… Objection 4: Others there be that will allow it to be necessary, by the rules of decency and reverence, to be uncovered in prayer, and in singing and perhaps in reading of the Scriptures too, but not in preaching: And their reason is because in preaching we have not the pure word of God, but mixed with men’s own private opinions and improvements… Objection 5: Others, it seems, argue after this fashion: This uncovering of the head in divine worship, is a thing that has been so abused, and rested in by a company of dead formalists, and so zealously affected by such as dote on foolish and superstitious ceremonies, that to show our dislike of their ways, we think it expedient to act contrary to them in this thing also, and not to symbolize with their superstitions. Answer: Had I not heard it from some that pretended to sobriety… Objection 6: But there are yet others that think they have more to say than all this. Their bodily infirmities are such as that they cannot bear it to be so long uncovered, without hazard of their health: But God will have mercy, and not sacrifice… Objection 7: Others think to say something in this, if this had been such a duty; wherefore have our teachers been so long silent, Why had we not heard of this sooner?</p></blockquote>

<blockquote><p>First, their head [of the idolaters in Ahab’s time]; they prayed before their idols with their heads covered, because the people of the East worshipped their great men with their heads covered; therefore they prayed after the same manner, and honored their idols standing before them with their heads covered. Maimonides says that religious outward worship should be given after the same manner as they worshipped great men, and he adds, nisi forte sit mos illius loci, ut quis stet coram magnatibus aperto capite, that is, ‘unless it be the manner of men in that place to stand bare-headed, when they do reverence to great men’; where we see that the gesture and the manner of praying is to be accommodated to the custom of the place where one lives, and they should testifie their outward reverence by such signs as men testify their reverence to great men. This manner of worship varies in sundry parts. Maimonides wrote his Mishna in Egypt, and amongst the Mahometans who uncover not their heads before great men, but bow only their head before them; and therefore when they pray they uncover not their head: So the Jews both the priests and people uncover not the head in time of divine service. The priests had such bonnets upon their heads which could not easily be taken off and put on as ours, and when they came abroad they never uncovered their heads; but when they made great lamentation they uncovered their heads, and cast ashes upon them: But the Christians in the West, when they do reverence to their superiors, they always uncover their heads; and therefore it is the fittest gesture for us to uncover our heads when we pray. The Jews who live here in Europe, when they are in their synagogues, they never uncover their heads, which is altogether contrary to the custom of Europe: They salute great men here uncovering their heads, and so should they pray according to the canon of Maimonides; but they do this in despite of the Christians: The apostle, 1 Cor. 11, wills men to be uncovered, and women to be covered, when they pray, because that was the usual form amongst the Grecians, for the men did uncover their heads, when they did any reverence to their superiours; and the women had vails which covered their heads and faces when they came abroad: therefore he would not have them uncovered in time of prayer.</p></blockquote>

<div class="actions"><button class="copy" data-copy="“First, their head [of the idolaters in Ahab’s time]; they prayed before their idols with their heads covered, because the people of the East worshipped their great men with their heads covered; therefore they prayed after the same manner, and honored their idols standing before them with their heads covered. Maimonides says that religious outward worship should be given after the same manner as they worshipped great men, and he adds, nisi forte sit mos illius loci, ut quis stet coram magnatibus aperto capite, that is, ‘unless it be the manner of men in that place to stand bare-headed, when they do reverence to great men’; where we see that the gesture and the manner of praying is to be accommodated to the custom of the place where one lives, and they should testifie their outward reverence by such signs as men testify their reverence to great men. This manner of worship varies in sundry parts. Maimonides wrote his Mishna in Egypt, and amongst the Mahometans who uncover not their heads before great men, but bow only their head before them; and therefore when they pray they uncover not their head: So the Jews both the priests and people uncover not the head in time of divine service. The priests had such bonnets upon their heads which could not easily be taken off and put on as ours, and when they came abroad they never uncovered their heads; but when they made great lamentation they uncovered their heads, and cast ashes upon them: But the Christians in the West, when they do reverence to their superiors, they always uncover their heads; and therefore it is the fittest gesture for us to uncover our heads when we pray. The Jews who live here in Europe, when they are in their synagogues, they never uncover their heads, which is altogether contrary to the custom of Europe: They salute great men here uncovering their heads, and so should they pray according to the canon of Maimonides; but they do this in despite of the Christians: The apostle, 1 Cor. 11, wills men to be uncovered, and women to be covered, when they pray, because that was the usual form amongst the Grecians, for the men did uncover their heads, when they did any reverence to their superiours; and the women had vails which covered their heads and faces when they came abroad: therefore he would not have them uncovered in time of prayer.”

— John Weemes, A Treatise of the Four Degenerate Sons… wherein are handled many… sundry places of Scripture, cleared out of the original tongues. Being the fourth volume, of the Works… (London, 1636), On the 3rd Degenenerate Son, the Idolater, section 6, pp. 264-65">Copy</button><a class="share" href="https://x.com/intent/post?text=%E2%80%9CFirst%2C+their+head+%5Bof+the+idolaters+in+Ahab%E2%80%99s+time%5D%3B+they+prayed+before+their+idols+with+their+heads+covered%2C+because+the+people+of+the+East+worshipped+their+great+men+with+their+heads+covered%3B+therefore+they+prayed+after+the+same+manner%2C+and+honored+their+idols+standing+before+them+with+their+heads+covered.+Maimonides+says+that+religious+outward+worship+should+be+given+after+the+same+manner+as+they+worshipped+great+men%2C+and+he+adds%2C+nisi+forte+sit+mos+illius+loci%2C+ut+quis+stet+coram+magnatibus+aperto+capite%2C+that+is%2C+%E2%80%98unless+it+be+the+manner+of+men+in+that+place+to+stand+bare-headed%2C+when+they+do+reverence+to+great+men%E2%80%99%3B+where+we+see+that+the+gesture+and+the+manner+of+praying+is+to+be+accommodated+to+the+custom+of+the+place+where+one+lives%2C+and+they+should+testifie+their+outward+reverence+by+such+signs+as+men+testify+their+reverence+to+great+men.+This+manner+of+worship+varies+in+sundry+parts.+Maimonides+wrote+his+Mishna+in+Egypt%2C+and+amongst+the+Mahometans+who+uncover+not+their+heads+before+great+men%2C+but+bow+only+their+head+before+them%3B+and+therefore+when+they+pray+they+uncover+not+their+head%3A+So+the+Jews+both+the+priests+and+people+uncover+not+the+head+in+time+of+divine+service.+The+priests+had+such+bonnets+upon+their+heads+which+could+not+easily+be+taken+off+and+put+on+as+ours%2C+and+when+they+came+abroad+they+never+uncovered+their+heads%3B+but+when+they+made+great+lamentation+they+uncovered+their+heads%2C+and+cast+ashes+upon+them%3A+But+the+Christians+in+the+West%2C+when+they+do+reverence+to+their+superiors%2C+they+always+uncover+their+heads%3B+and+therefore+it+is+the+fittest+gesture+for+us+to+uncover+our+heads+when+we+pray.+The+Jews+who+live+here+in+Europe%2C+when+they+are+in+their+synagogues%2C+they+never+uncover+their+heads%2C+which+is+altogether+contrary+to+the+custom+of+Europe%3A+They+salute+great+men+here+uncovering+their+heads%2C+and+so+should+they+pray+according+to+the+canon+of+Maimonides%3B+but+they+do+this+in+despite+of+the+Christians%3A+The+apostle%2C+1+Cor.+11%2C+wills+men+to+be+uncovered%2C+and+women+to+be+covered%2C+when+they+pray%2C+because+that+was+the+usual+form+amongst+the+Grecians%2C+for+the+men+did+uncover+their+heads%2C+when+they+did+any+reverence+to+their+superiours%3B+and+the+women+had+vails+which+covered+their+heads+and+faces+when+they+came+abroad%3A+therefore+he+would+not+have+them+uncovered+in+time+of+prayer.%E2%80%9D%0A%0A%E2%80%94+John+Weemes%2C+A+Treatise+of+the+Four+Degenerate+Sons%E2%80%A6+wherein+are+handled+many%E2%80%A6+sundry+places+of+Scripture%2C+cleared+out+of+the+original+tongues.+Being+the+fourth+volume%2C+of+the+Works%E2%80%A6+%28London%2C+1636%29%2C+On+the+3rd+Degenenerate+Son%2C+the+Idolater%2C+section+6%2C+pp.+264-65&amp;url=https%3A%2F%2F5solasquotes.github.io%2Fquote%2F6b695031cf.html&amp;via=5Solas" target="_blank" rel="noopener">Share on X</a><a class="perma" href="../quote/6b695031cf.html">Permalink</a><a class="src" href="https://reformedbooksonline.com/the-post-reformation-scottish-church-on-head-coverings-in-public-worship/#:~:text=First%2C%20their%20head%20%5Bof%20the%20idolaters,them%20uncovered%20in%20time%20of%20prayer&amp;text=First%2C%20their%20head%20%5Bof%20the%20idolaters%20in%20Ahab%E2%80%99s&amp;text=not%20have%20them%20uncovered%20in%20time%20of%20prayer" rel="noopener" target="_blank">Read it online · Reformed Books Online</a></div>

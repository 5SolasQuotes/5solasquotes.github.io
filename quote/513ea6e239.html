<main class="wrap"><figure class="quote" id="q-513ea6e239" data-kw="">
<blockquote><p>10. The form of active justification we hold to be both the plenary remission of sins and the imputation of the righteousness of Christ; nor do we hold that these phrases ought to be either equated or confounded. The form of passive justification we constitute in the apprehension and sense of both in subjects who are capable thereof.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/friedrich-spanheim.html">Friedrich Spanheim</a></span><span class="wk"><span class="lbl">Work:</span> <cite>‘Disputation on Justification’ in Disputationum Theologicarum Miscellaneorum Pars Prima</cite>, (Geneva: Chovet, 1652), trans. AI by Roman Prestarri at Confessionally Reformed Theology Latin</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/justification/active-and-passive-obedience-imputed.html">Active and Passive Obedience Imputed</a></span><span class="t"><a href="../topics/justification/nature-of-justification.html">Nature of Justification</a></span></div>

— Friedrich Spanheim, ‘Disputation on Justification’ in Disputationum Theologicarum Miscellaneorum Pars Prima (Geneva: Chovet, 1652), trans. AI by Roman Prestarri at Confessionally Reformed Theology Latin">Copy</button><a class="share" href="https://x.com/intent/post?text=%E2%80%9C10.+The+form+of+active+justification+we+hold+to+be+both+the+plenary+remission+of+sins+and+the+imputation+of+the+righteousness+of+Christ%3B+nor+do+we+hold+that+these+phrases+ought+to+be+either+equated+or+confounded.+The+form+of+passive+justification+we+constitute+in+the+apprehension+and+sense+of+both+in+subjects+who+are+capable+thereof.%E2%80%9D%0A%0A%E2%80%94+Friedrich+Spanheim%2C+%E2%80%98Disputation+on+Justification%E2%80%99+in+Disputationum+Theologicarum+Miscellaneorum+Pars+Prima+%28Geneva%3A+Chovet%2C+1652%29%2C+trans.+AI+by+Roman+Prestarri+at+Confessionally+Reformed+Theology+Latin&amp;url=https%3A%2F%2F5solasquotes.github.io%2Fquote%2F513ea6e239.html&amp;via=5Solas" target="_blank" rel="noopener">Share on X</a><a class="perma" href="../quote/513ea6e239.html">Permalink</a><a class="src" href="https://reformedbooksonline.com/the-active-obedience-of-christ#:~:text=10.%20The%20form%20of%20active%20justification,in%20subjects%20who%20are%20capable%20thereof&amp;text=10.%20The%20form%20of%20active%20justification%20we%20hold&amp;text=of%20both%20in%20subjects%20who%20are%20capable%20thereof" rel="noopener" target="_blank">Read it online · Reformed Books Online</a></div>
</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-f980f0e3eb" data-kw="">
<blockquote><p>God freely justifies the persons whom he effectually calls. He does this, not by infusing righteousness into them but by pardoning their sins and by accounting them, and accepting them as righteous. This He does for Christ’s sake alone and not for anything wrought in them or done by them. The righteousness which is imputed to them, that is, reckoned to their account, is neither their faith nor the act of believing nor any obedience to the gospel which they have rendered, but Christ’s obedience alone. Christ’s one obedience is twofold – His active obedience rendered to the entire divine law, and His passive obedience rendered in his death.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/westminster-assembly.html">Westminster Assembly</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Westminster Confession of Faith</cite>, 11.1 (modern English)</span></figcaption>

</figure><figure class="quote" id="q-f8a786cf96" data-kw="">
<blockquote><p>It is a question, the threatening standing, Gen. 2:17, how the active righteousness of Christ can be a cause meriting to us life and satisfying the Law when there is no suffering for the breach of the Law, which expressly required death in the sinner: Not to say that it seems too near to make Christ’s dying needless if his active holiness do the business; Nay we cannot so teach.</p></blockquote>

</figure><figure class="quote" id="q-6b0386e2f3" data-kw="">
<blockquote><p>XXX. We are justified by that righteousness alone by which our Surety was freed from our guilt. But He was fully freed from our guilt by the power of the satisfaction which He rendered on our behalf; therefore, by that same righteousness alone, we too are fully justified. Who would deny that, when the debt owed by us is paid, the handwriting that was against us (Col. 2:14) is erased, and we are no longer liable to our creditor? That by the same righteousness by which we are redeemed from condemnation and the curse of the law (Gal. 3:13), we are also justified? That by the same satisfaction by which divine justice was perfectly satisfied for us, and by which we were so reconciled to God that He adopted us as sons and heirs, God is now completely propitiated toward us? That by the same propitiation by which our sins were fully expiated and cleansed, we now obtain the right of access into the Temple of God?</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/joshua-placeus.html">Joshua Placeus</a></span><span class="wk"><span class="lbl">Work:</span> <cite>‘Theological Theses on the Justification of Man before God’</cite>, (1634), p. 6</span></figcaption>

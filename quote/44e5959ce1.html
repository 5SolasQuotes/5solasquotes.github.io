<blockquote><p>50. Being is divided into substance and accident. … About knowledge of the formal idea of accident one must note that ‘in another’ or ‘in-anotherness’ is correlative, for it involves something in which it is. But to perceive some relation, there is need of knowledge of the terms of the relation in themselves. Our first knowledge of reality, therefore, seems to be knowledge of things as absolute objects and not in their relation to other beings. But when we say that accidents are immediately experienced as beings in another the sense is: this knowledge is not by way of reasoning out but, from phenomenological analysis of the givens of experience, we perceive through simple apprehension this relation of ‘in-anotherness’. Shape, for instance, is not only perceived in itself and as something absolute but also in its relation to extension and color, namely as the limit of a colored expanse. But in other cases it seems we do not immediately perceive the idea of ‘in-anotherness’, but rather we infer it by reasoning out. This happens, for example, with quantity. No wonder then that some, as Descartes, identified extension with material substance as such. … Relative Being to Absolute Being [see pp. 69-72 of the Summary] 52. If there is relative being, absolute being must exist. For once the existence of a purely relative being has been admitted, some other beings must exist, namely subject, term and foundation [p. 69]. But all these are as it were the matter of relation and so are not formally the relation, nor formally ‘existing-to’; therefore they are absolute beings. But even on the other opinion, this proposition can in some way be saved. For if relative being is formally a being of reason with a foundation in the thing, something truly real and therefore absolute is required, namely the foundation itself. 53. From the nature of relation, it is plain that relation cannot be found, nor be known, unless subject, term, and foundation are present and known respectively at the same time. And in this sense can the Aristotelian-Scholastic dictum be understood: ‘relatives are simultaneous in nature and in understanding’. … Proof of God … 7. God knows all individuals, not only as absolute beings and in themselves, but also knows them according to all the relations that one has to all the others. This conclusion too is plain from the perfection of God’s knowledge. … Conclusions Respecting Reality … 29. Every being is good, or being and good convert. Just as ontological truth states the relation of being to the cognitive faculty, so goodness involves a relation to the appetitive faculty, or the will…</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/allan-b-wolter.html">Allan B. Wolter</a></span><span class="wk"><span class="lbl">Work:</span> <cite>‘Allan Wolter’s Conclusions respecting Reality, Proving God’</cite>, (1958), ‘Conclusions respecting Reality’</span></figcaption>

<blockquote><p>I say that although things other than God are in fact contingent in respect of actual being, they are not so in respect of potential being. So things that are contingent with respect to actual existence are necessary with respect to possible existence, as that although it is contingent that man exists yet that his existence is possible is necessary.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/allan-b-wolter.html">Allan B. Wolter</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Little Summary of Metaphysics</cite>, (Milwaukee: Bruce Publishing Co., 1958), Intro, p. 9 | This very evident proposition, although it is in itself a necessary one (as will be shown later), is yet a proposition that for us is purely contingent. Hence, in order to preserve the condition of Aristotelian science that the principles be necessary, we can infer something necessary from the contingent proposition ‘something is’, namely the proposition that ‘the existence of something is possible’ or that ‘there is no repugnance between something and existence’. For as Scotus well observes (Lectura 1)</span></figcaption>

<blockquote><p>7. …Indeed the soul (as is aforesaid) is wholly hypostasis to the head, giving life to it and sustaining it: but where? not in every part of the body, but only in that where the head itself is: and out of the head [the soul] is also wholly hypostasis to the feet, sustaining them too: not where the head is, but where the feet themselves are. Is then the union which the soul has with the head dissolved because out of the head it is wholly also in the feet? 8. Finally, that all things which have been spoken of this personal union [of Christ in two natures], may more plainly be declared, I add these also: The soul is hypostasis to the eyes: to what eyes? such as they are: namely instruments used for sight, not for hearing: on the other side, to the ears, for hearing, not for seeing. So the Word was hypostasis to the human nature, not to destroy death, which was a property of the Word: but to suffer death, which was a property of the flesh.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/jerome-zanchi.html">Jerome Zanchi</a></span><span class="wk"><span class="lbl">Work:</span> <cite>H. Zanchius his Confession of Christian Religion</cite>, … (d. 1590; Cambridge, 1599), ‘Observations of the same Zanchius upon his Own Confession’, pp. 289-90 The context in point 7 is Zanchi arguing the validity of the extra Calvinisticum, that they person, or hypostasis of the Son exists outside of the human flesh according to his divinity. In point 8 it is the denial of the real communication of properties, via the Person, of the natures (contra the Lutherans).</span></figcaption>

<div class="actions"><button class="copy" data-copy="“7. …Indeed the soul (as is aforesaid) is wholly hypostasis to the head, giving life to it and sustaining it: but where? not in every part of the body, but only in that where the head itself is: and out of the head [the soul] is also wholly hypostasis to the feet, sustaining them too: not where the head is, but where the feet themselves are. Is then the union which the soul has with the head dissolved because out of the head it is wholly also in the feet? 8. Finally, that all things which have been spoken of this personal union [of Christ in two natures], may more plainly be declared, I add these also: The soul is hypostasis to the eyes: to what eyes? such as they are: namely instruments used for sight, not for hearing: on the other side, to the ears, for hearing, not for seeing. So the Word was hypostasis to the human nature, not to destroy death, which was a property of the Word: but to suffer death, which was a property of the flesh.”

— Jerome Zanchi, H. Zanchius his Confession of Christian Religion… (d. 1590; Cambridge, 1599), ‘Observations of the same Zanchius upon his Own Confession’, pp. 289-90 The context in point 7 is Zanchi arguing the validity of the extra Calvinisticum, that they person, or hypostasis of the Son exists outside of the human flesh according to his divinity. In point 8 it is the denial of the real communication of properties, via the Person, of the natures (contra the Lutherans).">Copy</button><a class="share" href="https://x.com/intent/post?text=%E2%80%9C7.+%E2%80%A6Indeed+the+soul+%28as+is+aforesaid%29+is+wholly+hypostasis+to+the+head%2C+giving+life+to+it+and+sustaining+it%3A+but+where%3F+not+in+every+part+of+the+body%2C+but+only+in+that+where+the+head+itself+is%3A+and+out+of+the+head+%5Bthe+soul%5D+is+also+wholly+hypostasis+to+the+feet%2C+sustaining+them+too%3A+not+where+the+head+is%2C+but+where+the+feet+themselves+are.+Is+then+the+union+which+the+soul+has+with+the+head+dissolved+because+out+of+the+head+it+is+wholly+also+in+the+feet%3F+8.+Finally%2C+that+all+things+which+have+been+spoken+of+this+personal+union+%5Bof+Christ+in+two+natures%5D%2C+may+more+plainly+be+declared%2C+I+add+these+also%3A+The+soul+is+hypostasis+to+the+eyes%3A+to+what+eyes%3F+such+as+they+are%3A+namely+instruments+used+for+sight%2C+not+for+hearing%3A+on+the+other+side%2C+to+the+ears%2C+for+hearing%2C+not+for+seeing.+So+the+Word+was+hypostasis+to+the+human+nature%2C+not+to+destroy+death%2C+which+was+a+property+of+the+Word%3A+but+to+suffer+death%2C+which+was+a+property+of+the+flesh.%E2%80%9D%0A%0A%E2%80%94+Jerome+Zanchi%2C+H.+Zanchius+his+Confession+of+Christian+Religion%E2%80%A6+%28d.+1590%3B+Cambridge%2C+1599%29%2C+%E2%80%98Observations+of+the+same+Zanchius+upon+his+Own+Confession%E2%80%99%2C+pp.+289-90+The+context+in+point+7+is+Zanchi+arguing+the+validity+of+the+extra+Calvinisticum%2C+that+they+person%2C+or+hypostasis+of+the+Son+exists+outside+of+the+human+flesh+according+to+his+divinity.+In+point+8+it+is+the+denial+of+the+real+communication+of+properties%2C+via+the+Person%2C+of+the+natures+%28contra+the+Lutherans%29.&amp;url=https%3A%2F%2F5solasquotes.github.io%2Fquote%2F32e424346d.html&amp;via=5Solas" target="_blank" rel="noopener">Share on X</a><a class="perma" href="../quote/32e424346d.html">Permalink</a><a class="src" href="https://reformedbooksonline.com/on-hylemorphism/#:~:text=Indeed%20the%20soul%20%28as%20is%20aforesaid,was%20a%20property%20of%20the%20flesh&amp;text=Indeed%20the%20soul%20%28as%20is%20aforesaid%29%20is%20wholly&amp;text=death%2C%20which%20was%20a%20property%20of%20the%20flesh" rel="noopener" target="_blank">Read it online · Reformed Books Online</a></div>

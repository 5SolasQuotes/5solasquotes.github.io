<main class="wrap"><figure class="quote" id="q-ac5c0fe7a6" data-kw="">
<blockquote><p>But if we love Christ and our souls better then our lives, let us resolve never to embrace any conditions of Peace which mingle the Inventions of men with the truth of God: Let us maintain the Doctrine of free Justification, our Salvation depends upon it, and let us preserve the Worship of God entire and pure; for saith he, if we look only to matters of Faith, and contend not for purity of Worship, we seem to have less care of God’s honour, then of our Salvation.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/francis-cheynell.html">Francis Cheynell</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Sion’s memento, and Gods alarm. In a sermon at Westminster, before the Honourable House of Commons, on the 31. of May 1643. the solemn day of their monthly fast</cite>, (London: Samuel Gellibrand, 1643), epistle dedicatory.</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/worship.html">Worship</a></span></div>

<blockquote><p>In 1643, White was chosen to serve among the Westminster Assembly of Divines. When the Assembly swore to uphold the Solemn League and Covenant on September 25, 1643, John Lightfoot recorded in his Journal that “Mr. White prayed near upon an hour.” White attended faithfully and contributed diligently to the work of the Assembly, and was in fact married to the sister of Cornelius Burgess, his co-assessor at the Assembly. While the Assembly was engaged in a battle over whose metrical Psalter would be chosen to serve as the instrument of uniformity and “get the civil sanction,” the leading candidates being Francis Rous and William Barton. White, who had prepared his own version of the metrical Psalms, preferred not to publish it while the debate was going on, in the interests of harmony. It was published posthumously with the permission of his son under the title David’s Psalms in Metre, agreeable to the Hebrew. To be sung in usual Tunes To the benefit of the Churches of Christ (1655) and shows his poetic skills.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/john-white.html">John White</a></span><span class="wk"><span class="lbl">Work:</span> <cite>David’s Psalms in meter. Agreeable to the Hebrew</cite>, 1655 | Background to White’s psalter by Andrew Myers:</span></figcaption>

<blockquote><p>Objection 2. Ordination and conformity, and common-prayers and ceremonies are connected with preaching, as one entire service; by partaking therefore of the one we contract the pollution of the other. Answer 1: What God Himself in a moral way joins together, no man may separate, only God Himself: But what God in nature has joined together, He gives us leave to separate, as chaff from wheat, etc. And so likewise for what man joins together, especially in the service of God and such matters thereof as God has not required; A set liturgy or stinted form of prayer for matter and words to be used (much less to be inseparably joined with preaching) is not required by the Lord, nor indeed is there any such necessary dependance by our laws… Answer 2… Nor are they so inseparably joined by our laws: But if they were, it is sufficient to my conscience that God has not so joined them. Our actings, and the reasons or grounds of them, are not to be interpreted in Church-matters by human laws; If they were, it would be difficult to inhabit in some commonwealths with a good conscience. Our living within the precincts of such a parish, our laws interpret as being of the same particular church with them for all Church-ordinances: but this being man’s law only, we judge ourselves not so necessarily involved by our habitation. A Church according to Scripture is a spiritual body: The limits are part of the essence and constitution of such a body, and therefore ought to be spiritual and of the same nature, and not merely human, as is the division of parishes.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/philip-nye.html">Philip Nye</a></span><span class="wk"><span class="lbl">Work:</span> <cite>A Case of Great &amp; Present Use</cite>, [Solemn League &amp;] Covenant &amp; Some of them [are] Supposed to be Scandalous in their Lives, Considered &amp; Affirmatively Resolved (1672; 1677), Consideration 3, pp. 20-22</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/worship/impurities-in-worship.html">Impurities in Worship</a></span></div>

</figure><figure class="quote" id="q-eb4ed9ad21" data-kw="">
<blockquote><p>It is a very evil thing to halt in Religion. It is a very evil thing to be either a Neuter, or an Uterque, or a Waverer in Religion. Neutrality, without controversy, is not to be endured. The Prophet in his Dilemma takes it for granted, that there is no colourable plea for neutrality. If the Lord be God, follow him, &amp;c. he takes it for granted, that one of them must be worshipped; otherwise his reasoning had not been cogent: for they might have replied, Nay, but we will suspend, we perceive that we are in a snare. If we Serve Jehovah, we shall displease Ahab; and if we worship Baal, we shall offend you: it will be our wisdom to serve neither.

Honourable, and Beloved, in matters civil we have sometimes a latitude, and liberty of suspension: but in Religion there is a necessity of determination, and resolution.

The Scripture speaks out: Thou shalt fear the Lord thy God, and serve him, Deut. 6.13. As I live, saith the Lord, every knee shall bow to me, Isa. 45.23. As the Neuter is abominable, so the halting Uterque is not to be endured, that divideth between God, and Baal: God will not allow of any dividing either in the Object, or Terminus of worship: as he will be worshipped; so he will be worshipped solely. Thou shalt have no other Gods but me. The Lord is a jealous God, and will endure no co-rival. Jealousy is the rage of a man, and he will not spare in the day of his wrath, Prov. 6.34.35. God looks upon divided worship, as no worship. It is said of those Idolaters spoken of, 2 King. 17. in one vers. that they feared God, and worshipped their Idols: and in the vers. immediately following, That they feared not God, 2 King. 17.33.34. and 1 Zeph. 5. The Lord severely threatened such as did swear by the Lord, and by Malcham.

As the Lord cannot endure dividing in the Terminus of worship, so he hates dividing in the rule of worship, and the worship it self. The halting Uterque that makes the Scripture a partial rule of worship, that worshippeth God partly after the prescript of the word, and partly according to the Dictates of his own carnal reason, cannot perform any acceptable service to Almighty God. See thou do all things according to the pattern, was the command of God unto Moses, Heb. 8.5. Will-worship is vain worship. In vain do they worship me, teaching for doctrines, the commandments of men, Matth. 15.9. This corrupt mingling in Gods worship was prohibited, Levit. 19.19.

As God will be worshipped solely, and wholly, so he will be worshipped constantly: as he hates a Neuter, and Uterque, so he cannot endure a Waverer. The Lord commands us to hold fast our profession without wavering, Heb. 10.23. When we have proved all things, we must hold fast that which is good, 1 Thes. 5.21. Inconstancy in Religion is a very evil thing, whether you consider the sin of it, or the punishment which is due to it. It cometh from evil, it tends to evil. It cometh from evil, as from the general fountain of all actual sins; original corruption: so particularly from that evil heart of unbelief whereby we depart from the living God, Heb. 3.12.

It tends to evil both in respect of sin, and punishment. It is dishonourable unto God. It is a high impeachment of his glorious attributes. It wrongs God in his wisdom, justice, mercy, power, goodness, faithfulness, as if God were not worthy of our firmest resolutions, and most constant adherence; in a word, of our poor All; or, as if he were either unable, or unwilling to revenge himself upon inconstant halters. As it dishonours God, so it discredits Religion, it brings an ill report upon the holy ways of God, as those Spies brought an ill report upon the good Land of Canaan, as if the ways of God were unpleasant, or his service unprofitable.

As it is dishonourable unto God, and unto Religion, so it is hurtful unto themselves. It hurts the Wavering Christian in his conscience, if conscience be not in a dead sleep, it will speak bitter things unto the backslider: it will say unto him. If the Lord be not God, why dost thou serve him at all? and if he be God, and worthy of thy service, why dost thou not serve him always? The backslider in heart shall be filled with his own ways, Prov. 14.14. When (I say) conscience is thoroughly awakened, it will fill the soul with most exquisite torments.

It hurts us in our credits; what greater ignominy, then the brand of inconstancy? There goes a shifter, a turncoat, an Apostatizing hypocrite: what can render a man more stigmatically odious? what makes the devil so black, but his Apostasy? In a word, it hurts us temporally, and eternally: It subjects us to a thousand miseries in this life, and to everlasting punishment in the world to come. What are the causes of so many sad changes in our present outward condition? surely, this is not the least, even our changeableness in Religion: When they chose new Gods, then was war in the gates, Judg. 5.8. It subjects the soul, and body unto everlasting perdition in hell, there to endure the punishments both of loss, and sense.

It is a fearful thing to fall into the hands of the living God, who is a jealous God, and a consuming fire: such as draw back to unbelief, they do it to the perdition of their souls, Heb. 10.23.26.27.39. Nothing is more just then that Jesus Christ should deny us before God his Father, and all his holy Angels, and blessed Saints; if we deny him before men. The fearful and unbelieving shall be cast into the lake which burns with fire, and brimstone, which is the second death, Revel. 21.8.</p></blockquote>

It is a fearful thing to fall into the hands of the living God, who is a jealous God, and a consuming fire: such as draw back to unbelief, they do it to the perdition of their souls, Heb. 10.23.26.27.39. Nothing is more just then that Jesus Christ should deny us before God his Father, and all his holy Angels, and blessed Saints; if we deny him before men. The fearful and unbelieving shall be cast into the lake which burns with fire, and brimstone, which is the second death, Revel. 21.8.”

— Arthur Salwey, Halting stigmatized in a sermon preached to the Honorable House of Commons on the monthly fast day, Octob. 25. 1643. at Margaret’s Westminster, (London: Christopher Meredith, 1644), pp 8-12.">Copy</button><a class="share" href="https://x.com/intent/post?text=%E2%80%9CIt+is+a+very+evil+thing+to+halt+in+Religion.+It+is+a+very+evil+thing+to+be+either+a+Neuter%2C+or+an+Uterque%2C+or+a+Waverer+in+Religion.+Neutrality%2C+without+controversy%2C+is+not+to+be+endured.+The+Prophet+in+his+Dilemma+takes+it+for+granted%2C+that+there+is+no+colourable+plea+for+neutrality.+If+the+Lord+be+God%2C+follow+him%2C+%26c.+he+takes+it+for+granted%2C+that+one+of+them+must+be+worshipped%3B+otherwise+his+reasoning+had+not+been+cogent%3A+for+they+might+have+replied%2C+Nay%2C+but+we+will+suspend%2C+we+perceive+that+we+are+in+a+snare.+If+we+Serve+Jehovah%2C+we+shall+displease+Ahab%3B+and+if+we+worship+Baal%2C+we+shall+offend+you%3A+it+will+be+our+wisdom+to+serve+neither.%0A%0AHonourable%2C+and+Beloved%2C+in+matters+civil+we+have+sometimes+a+latitude%2C+and+liberty+of+suspension%3A+but+in+Religion+there+is+a+necessity+of+determination%2C+and+resolution.%0A%0AThe+Scripture+speaks+out%3A+Thou+shalt+fear+the+Lord+thy+God%2C+and+serve+him%2C+Deut.+6.13.+As+I+live%2C+saith+the+Lord%2C+every+knee+shall+bow+to+me%2C+Isa.+45.23.+As+the+Neuter+is+abominable%2C+so+the+halting+Uterque+is+not+to+be+endured%2C+that+divideth+between+God%2C+and+Baal%3A+God+will+not+allow+of+any+dividing+either+in+the+Object%2C+or+Terminus+of+worship%3A+as+he+will+be+worshipped%3B+so+he+will+be+worshipped+solely.+Thou+shalt+have+no+other+Gods+but+me.+The+Lord+is+a+jealous+God%2C+and+will+endure+no+co-rival.+Jealousy+is+the+rage+of+a+man%2C+and+he+will+not+spare+in+the+day+of+his+wrath%2C+Prov.+6.34.35.+God+looks+upon+divided+worship%2C+as+no+worship.+It+is+said+of+those+Idolaters+spoken+of%2C+2+King.+17.+in+one+vers.+that+they+feared+God%2C+and+worshipped+their+Idols%3A+and+in+the+vers.+immediately+following%2C+That+they+feared+not+God%2C+2+King.+17.33.34.+and+1+Zeph.+5.+The+Lord+severely+threatened+such+as+did+swear+by+the+Lord%2C+and+by+Malcham.%0A%0AAs+the+Lord+cannot+endure+dividing+in+the+Terminus+of+worship%2C+so+he+hates+dividing+in+the+rule+of+worship%2C+and+the+worship+it+self.+The+halting+Uterque+that+makes+the+Scripture+a+partial+rule+of+worship%2C+that+worshippeth+God+partly+after+the+prescript+of+the+word%2C+and+partly+according+to+the+Dictates+of+his+own+carnal+reason%2C+cannot+perform+any+acceptable+service+to+Almighty+God.+See+thou+do+all+things+according+to+the+pattern%2C+was+the+command+of+God+unto+Moses%2C+Heb.+8.5.+Will-worship+is+vain+worship.+In+vain+do+they+worship+me%2C+teaching+for+doctrines%2C+the+commandments+of+men%2C+Matth.+15.9.+This+corrupt+mingling+in+Gods+worship+was+prohibited%2C+Levit.+19.19.%0A%0AAs+God+will+be+worshipped+solely%2C+and+wholly%2C+so+he+will+be+worshipped+constantly%3A+as+he+hates+a+Neuter%2C+and+Uterque%2C+so+he+cannot+endure+a+Waverer.+The+Lord+commands+us+to+hold+fast+our+profession+without+wavering%2C+Heb.+10.23.+When+we+have+proved+all+things%2C+we+must+hold+fast+that+which+is+good%2C+1+Thes.+5.21.+Inconstancy+in+Religion+is+a+very+evil+thing%2C+whether+you+consider+the+sin+of+it%2C+or+the+punishment+which+is+due+to+it.+It+cometh+from+evil%2C+it+tends+to+evil.+It+cometh+from+evil%2C+as+from+the+general+fountain+of+all+actual+sins%3B+original+corruption%3A+so+particularly+from+that+evil+heart+of+unbelief+whereby+we+depart+from+the+living+God%2C+Heb.+3.12.%0A%0AIt+tends+to+evil+both+in+respect+of+sin%2C+and+punishment.+It+is+dishonourable+unto+God.+It+is+a+high+impeachment+of+his+glorious+attributes.+It+wrongs+God+in+his+wisdom%2C+justice%2C+mercy%2C+power%2C+goodness%2C+faithfulness%2C+as+if+God+were+not+worthy+of+our+firmest+resolutions%2C+and+most+constant+adherence%3B+in+a+word%2C+of+our+poor+All%3B+or%2C+as+if+he+were+either+unable%2C+or+unwilling+to+revenge+himself+upon+inconstant+halters.+As+it+dishonours+God%2C+so+it+discredits+Religion%2C+it+brings+an+ill+report+upon+the+holy+ways+of+God%2C+as+those+Spies+brought+an+ill+report+upon+the+good+Land+of+Canaan%2C+as+if+the+ways+of+God+were+unpleasant%2C+or+his+service+unprofitable.%0A%0AAs+it+is+dishonourable+unto+God%2C+and+unto+Religion%2C+so+it+is+hurtful+unto+themselves.+It+hurts+the+Wavering+Christian+in+his+conscience%2C+if+conscience+be+not+in+a+dead+sleep%2C+it+will+speak+bitter+things+unto+the+backslider%3A+it+will+say+unto+him.+If+the+Lord+be+not+God%2C+why+dost+thou+serve+him+at+all%3F+and+if+he+be+God%2C+and+worthy+of+thy+service%2C+why+dost+thou+not+serve+him+always%3F+The+backslider+in+heart+shall+be+filled+with+his+own+ways%2C+Prov.+14.14.+When+%28I+say%29+conscience+is+thoroughly+awakened%2C+it+will+fill+the+soul+with+most+exquisite+torments.%0A%0AIt+hurts+us+in+our+credits%3B+what+greater+ignominy%2C+then+the+brand+of+inconstancy%3F+There+goes+a+shifter%2C+a+turncoat%2C+an+Apostatizing+hypocrite%3A+what+can+render+a+man+more+stigmatically+odious%3F+what+makes+the+devil+so+black%2C+but+his+Apostasy%3F+In+a+word%2C+it+hurts+us+temporally%2C+and+eternally%3A+It+subjects+us+to+a+thousand+miseries+in+this+life%2C+and+to+everlasting+punishment+in+the+world+to+come.+What+are+the+causes+of+so+many+sad+changes+in+our+present+outward+condition%3F+surely%2C+this+is+not+the+least%2C+even+our+changeableness+in+Religion%3A+When+they+chose+new+Gods%2C+then+was+war+in+the+gates%2C+Judg.+5.8.+It+subjects+the+soul%2C+and+body+unto+everlasting+perdition+in+hell%2C+there+to+endure+the+punishments+both+of+loss%2C+and+sense.%0A%0AIt+is+a+fearful+thing+to+fall+into+the+hands+of+the+living+God%2C+who+is+a+jealous+God%2C+and+a+consuming+fire%3A+such+as+draw+back+to+unbelief%2C+they+do+it+to+the+perdition+of+their+souls%2C+Heb.+10.23.26.27.39.+Nothing+is+more+just+then+that+Jesus+Christ+should+deny+us+before+God+his+Father%2C+and+all+his+holy+Angels%2C+and+blessed+Saints%3B+if+we+deny+him+before+men.+The+fearful+and+unbelieving+shall+be+cast+into+the+lake+which+burns+with+fire%2C+and+brimstone%2C+which+is+the+second+death%2C+Revel.+21.8.%E2%80%9D%0A%0A%E2%80%94+Arthur+Salwey%2C+Halting+stigmatized+in+a+sermon+preached+to+the+Honorable+House+of+Commons+on+the+monthly+fast+day%2C+Octob.+25.+1643.+at+Margaret%E2%80%99s+Westminster%2C+%28London%3A+Christopher+Meredith%2C+1644%29%2C+pp+8-12.&amp;url=https%3A%2F%2F5solasquotes.github.io%2Fquote%2Feb4ed9ad21.html&amp;via=5Solas" target="_blank" rel="noopener">Share on X</a><a class="perma" href="../quote/eb4ed9ad21.html">Permalink</a><a class="src" href="https://reformedcovenanter.wordpress.com/2021/11/24/arthur-salwey-on-the-evil-of-neutrality-in-religion/" rel="noopener" target="_blank">Read it online · Reformed Covenanter</a></div>

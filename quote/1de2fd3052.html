<blockquote><p>Q. Is it unlawful to make an image of the Trinity, or of any Person in the Godhead? It is utterly unlawful, and a great dishonor to figure the incorruptible God by the shape of a base and corruptible man or bird, or other creature. Dt. 4:15-18; Rom. 1:23; Acts 17:24, 29; Isa. 40:15, 18-19; Hab. 2:8. It abuses our understandings: the party thinks there is some good in an image, else he would not make it; and that’s a lie: He lies that shows me a toad and says it is the picture of an angel; so, etc. All the pictures of Christ in the flesh, as that on Christ on the cross and resurrection are lies, false in their representations and false in the conceit of any good by them.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/william-lyford.html">William Lyford</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Principle[s] of Faith &amp; Good Conscience Digested into a Catechetical Form</cite>, … (Oxford: Hall, 1665), ch. 30, pp. 132-33</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/worship/idolatry-and-images.html">Idolatry and Images</a></span></div>

</figure><figure class="quote" id="q-1077272675" data-kw="">
<blockquote><p>6. The goodness of God is seen in bearing with the infirmities of his people and accepting imperfect obedience. Though Asa had many blots in his escutcheon [a coat of arms as an emblem], yet they are over-looked, and this note set upon record by divine goodness, that his heart was perfect towards the Lord all his days: ‘But the high places were not removed, nevertheless Asa’s heart was perfect with the Lord all his days.’ (1 Kings 15:14) He takes notice of a sincere, though chequered obedience, to reward it, which could claim nothing but a slight from Him if he were extreme to mark what is done amiss. When there is not an opportunity to work, but only to will, He accepts the will, as if it had passed into work and act. He sees ‘no iniquity in Jacob,’ (Num. 23:21) i.e. He sees it not so as to cast off a respect to their persons and the acceptance of their services: His omniscience knows their sins, but his goodness does not reject their persons. He is of so good a disposition that He delights in a weak obedience of his servants, not in the imperfection but in the obedience: ‘He delights in the way of a good man,’ (Ps. 37:23) though he sometimes slips in it: He accepts a poor man’s pigeon as well as a rich man’s ox; He has a bottle for the tears and a book for the services of the upright (Ps. 56:8), as well as for the most perfect obedience of angels. He preserves their tears as if they were a rich and generous wine, as the vine-dresser does the expressions [pressed out flowings] of the grape.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/stephen-charnock.html">Stephen Charnock</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Several Discourses upon the Existence &amp; Attributes of God</cite>, (London, 1682) | ‘On the Goodness of God’, pp. 656-57</span></figcaption>

</figure><figure class="quote" id="q-729868d934" data-kw="">
<blockquote><p>And to be precise, [Christ instituted the sacrament] ‘after washing their feet,’ as many [sources] say. For when the meal was begun (John 13:2), He rose from the table (verse 4) and washed the feet of his disciples, as was the customary practice of eastern peoples (Luke 7:44). He did so in order that by this exemplary action He might show them the way to humility and love, and testify his favor towards those who are his–that He is certainly the one who cleanses his people from their uncleanness (John 13:8-10, 14). And He did so in order to teach them by means of a comparison (and not a sacrament) with what frame of mind they ought to approach these sacred things. Even so the western church has, elsewhere and sometimes not without abuse, adopted the practice as a sacrament. … Nor do the following facts have any force of being required or observed: that the supper was given to them… after their feet had been washed… (some [things] of which were observed for some time in the early church).</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/antonius-thysius.html">Antonius Thysius</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Synopsis of a Purer Theology</cite>, ... (1625; Brill), vol. 3, Disputation 45, ‘On the Lord’s Supper’, pp. 183-85 &amp; 187</span></figcaption>

<main class="wrap"><figure class="quote" id="q-e26a63fd4a" data-kw="">
<blockquote><p>Alas, even sabbath-time, the purest, the most refined part of time, a creation out of a creation, time consecrated by Divine sanction, how cheap and common is it in most men’s eyes, while many do sin away, and the most do idle away those hallowed hours!

Seneca was wont to jeer the Jews for their ill husbandry, in that they lost one day in seven, meaning their sabbath: truly it is too true of the most of christians, they lose one day in seven, whatever else; the sabbath for the most part is but a lost day; while some spend it totally upon their lusts, and the most, I had almost said the best, do fill up the void spaces and intervals of the sabbath from public worship, with idleness and vanity!</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/thomas-case.html">Thomas Case</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Correction, Instruction; or A Treatise of Afflictions</cite>, (1671; London: Religious Tract Society, 1836), p. 72.</span></figcaption>

<blockquote><p>This gospel holiness respects Jesus Christ as its pattern. It proposeth no lower pattern for imitation, then to be conform to his image; he that is begotten again unto a lively hope, by the resurrection of Christ from the dead, girds up the loins of his mind (which are the affections of his soul, lest by falling flat upon the earth he be hindered in running the race set before him, as looking to the forerunner his pattern) in this girdle of hope, that he may be holy in all manner of conversation, keeping his eye upon the precept and pattern, that his practice may be conform[ed].

It is written, saith he, Be ye holy for I am holy, the hope of seeing God, and being ever with him imposeth a necessity upon him who hath it, to look no lower, then at him, who is glorious in holiness; and therefore he is said to purify himself, even as he is pure; and knowing that this is the end of their being quickened together with Christ, that they may walk even as he walked; they, in their working and walking, aim at no less then to be like him; and therefore never sit down upon any attained measure, as if they were already perfect: the spotless purity of God expressed in his laws, is that whereto they study assimilation; therefore they are still in motion towards this mark, and are changed from one degree of glorious grace into another, into the same image, even as by the Spirit of the Lord, who never gives over his putting them to cleanse from all filthiness of the flesh and of the Spirit, till that be true in the truest sense, thou art all fair, my love, there is no spot in thee.

And knowing that perfect fruition of him cannot be without perfect conformity to him, herein do they exercise themselves, to grow in grace, and to be still advancing towards some more likeness to his image, forgetting all their attainments, as things that are behind, and by their reachings forth unto that which is before, make it evident, that they make every begun degree of grace and conformity to God, a prevenient capacity for a new degree, which yet they have not attained.

I know, our moralists look upon themselves as matchless, in talking of following his steps, as he hath left us an example: in this they make a flourish with flaunting effrontery, but for all their boasting of wisdom, such a poor simple man as I, am made to wonder at their folly, who proposing, as they say, the purity of Christ for their pattern, are not even thence convinced, that in order to a conformity thereto, there is a simple &amp; absolute necessity of the mighty operations of that Spirit of God, whereby this end can be reached; but while they flout at the Spirit’s working, as a melancholy fancy, whereby the soul is garnished with the beauty of holiness, and made an habitation for God, I doubt not to say of these great sayers, that they understand neither what they say, nor whereof they affirm: nay doth not their talking of the one, not only without seeing the necessity of the other, but speaking against it, say in the heart of every one, (who hath not the heart of a beast) that they have never yet got a sight of the holiness of that pattern, nor of their own pollutions and impotency; for if they had, they would give themselves up to Jesus Christ to be washed by him, without which they can have no part with him.

O there will be a vast difference, at the latter day, betwixt them who have given their black souls to Jesus Christ to bleach, when he shall present them without spot, not only clothed with wrought gold, but all glorious within, and these who have never dipped, yea who have despised to dip their defiled souls in any other fountain, save in the impure puddle of their own performances: this will make them loathsome in his sight, and cause his soul abhor those, who have done this despite unto the Spirit of grace, as to slight that blessed fountain, opened for sin &amp; for uncleanness, let them pretend as high as they will, to look to him, as a pattern, while (because the plague sore is got up in their eye) they look not to him as a price, not to the grace of Jesus Christ, as that which can only principle any acceptable performance of duty, he will plunge them in the ditch, and it Will cost them their souls, for rejecting the counsel of God against themselves, in not making use of him who came by water, as well as by blood.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/robert-macward.html">Robert MacWard</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Letter to John Brown of Wamphray, Christ, the way, and the truth, and the life. Or, A short discourse pointing forth the way of making use of Christ for justification and especially and more particularly for sanctification in all its parts, from Johan. XIV: vers. VI. Wherein several cases of conscie</cite></span></figcaption>

est+sense%2C+thou+art+all+fair%2C+my+love%2C+there+is+no+spot+in+thee.%0A%0AAnd+knowing+that+perfect+fruition+of+him+cannot+be+without+perfect+conformity+to+him%2C+herein+do+they+exercise+themselves%2C+to+grow+in+grace%2C+and+to+be+still+advancing+towards+some+more+likeness+to+his+image%2C+forgetting+all+their+attainments%2C+as+things+that+are+behind%2C+and+by+their+reachings+forth+unto+that+which+is+before%2C+make+it+evident%2C+that+they+make+every+begun+degree+of+grace+and+conformity+to+God%2C+a+prevenient+capacity+for+a+new+degree%2C+which+yet+they+have+not+attained.%0A%0AI+know%2C+our+moralists+look+upon+themselves+as+matchless%2C+in+talking+of+following+his+steps%2C+as+he+hath+left+us+an+example%3A+in+this+they+make+a+flourish+with+flaunting+effrontery%2C+but+for+all+their+boasting+of+wisdom%2C+such+a+poor+simple+man+as+I%2C+am+made+to+wonder+at+their+folly%2C+who+proposing%2C+as+they+say%2C+the+purity+of+Christ+for+their+pattern%2C+are+not+even+thence+convinced%2C+that+in+order+to+a+conformity+thereto%2C+there+is+a+simple+%26+absolute+necessity+of+the+mighty+operations+of+that+Spirit+of+God%2C+whereby+this+end+can+be+reached%3B+but+while+they+flout+at+the+Spirit%E2%80%99s+working%2C+as+a+melancholy+fancy%2C+whereby+the+soul+is+garnished+with+the+beauty+of+holiness%2C+and+made+an+habitation+for+God%2C+I+doubt+not+to+say+of+these+great+sayers%2C+that+they+understand+neither+what+they+say%2C+nor+whereof+they+affirm%3A+nay+doth+not+their+talking+of+the+one%2C+not+only+without+seeing+the+necessity+of+the+other%2C+but+speaking+against+it%2C+say+in+the+heart+of+every+one%2C+%28who+hath+not+the+heart+of+a+beast%29+that+they+have+never+yet+got+a+sight+of+the+holiness+of+that+pattern%2C+nor+of+their+own+pollutions+and+impotency%3B+for+if+they+had%2C+they+would+give+themselves+up+to+Jesus+Christ+to+be+washed+by+him%2C+without+which+they+can+have+no+part+with+him.%0A%0AO+there+will+be+a+vast+difference%2C+at+the+latter+day%2C+betwixt+them+who+have+given+their+black+souls+to+Jesus+Christ+to+bleach%2C+when+he+shall+present+them+without+spot%2C+not+only+clothed+with+wrought+gold%2C+but+all+glorious+within%2C+and+these+who+have+never+dipped%2C+yea+who+have+despised+to+dip+their+defiled+souls+in+any+other+fountain%2C+save+in+the+impure+puddle+of+their+own+performances%3A+this+will+make+them+loathsome+in+his+sight%2C+and+cause+his+soul+abhor+those%2C+who+have+done+this+despite+unto+the+Spirit+of+grace%2C+as+to+slight+that+blessed+fountain%2C+opened+for+sin+%26+for+uncleanness%2C+let+them+pretend+as+high+as+they+will%2C+to+look+to+him%2C+as+a+pattern%2C+while+%28because+the+plague+sore+is+got+up+in+their+eye%29+they+look+not+to+him+as+a+price%2C+not+to+the+grace+of+Jesus+Christ%2C+as+that+which+can+only+principle+any+acceptable+performance+of+duty%2C+he+will+plunge+them+in+the+ditch%2C+and+it+Will+cost+them+their+souls%2C+for+rejecting+the+counsel+of+God+against+themselves%2C+in+not+making+use+of+him+who+came+by+water%2C+as+well+as+by+blood.%E2%80%9D%0A%0A%E2%80%94+Robert+MacWard%2C+Letter+to+John+Brown+of+Wamphray%2C+Christ%2C+the+way%2C+and+the+truth%2C+and+the+life.+Or%2C+A+short+discourse+pointing+forth+the+way+of+making+use+of+Christ+for+justification+and+especially+and+more+particularly+for+sanctification+in+all+its+parts%2C+from+Johan.+XIV%3A+vers.+VI.+Wherein+several+cases+of+conscie&amp;url=https%3A%2F%2F5solasquotes.github.io%2Fquote%2F0dc7cc87b1.html&amp;via=5Solas" target="_blank" rel="noopener">Share on X</a><a class="perma" href="../quote/0dc7cc87b1.html">Permalink</a><a class="src" href="https://reformedcovenanter.wordpress.com/2020/11/11/robert-mcward-on-christ-as-the-pattern-for-gospel-holiness/" rel="noopener" target="_blank">Read it online · Reformed Covenanter</a></div>

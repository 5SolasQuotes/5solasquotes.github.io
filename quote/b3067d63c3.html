<main class="wrap"><figure class="quote" id="q-b3067d63c3" data-kw="">
<blockquote><p>I said, moreover, in the proposition laid down, that supernatural revelation was given in human forms of speech. This is one significant proof of the divine condescension of the Holy Spirit, that instead of speaking in an elevated style of diction, and in the communication only of ideas above the capacity or range of the bulk of mankind, or merely for cultured and philosophic minds, He speaks from one mind to another in easy, clear, and perspicuous language, level to the apprehension of all tribes and nations. This is the glory of the Spirit’s work of revelation, however profound the things themselves may be to which the revelation refers.

It is not necessary to define the MODE OF INSPIRATION, but only to assert the divine fact. We take the historic fact; but we decline every attempt to explain the inscrutable mode. That the theopneustic gift was imparted, is evident from the explicit statement that all Scripture is Godinspired (2 Tim. 3.16), and that holy men of God spoke as they were moved by the Holy Ghost (2 Pet. 1.21). But no finite mind can venture, without presumption, to say how the human faculties concurred and acted with the Spirit’s activity in the expression of a divine oracle.

So various, in fact, was the mode of His divine communications, that it is impossible to frame a theory which either takes in all the facts or exhibits the manifold variety of ways in which the Almighty Spirit, who alone has the key to the human heart and to all its powers, was pleased to communicate His will. We repudiate all attempts to explain the mode in which revelation was conveyed to the human mind, or by inspired men to the mind of others. We conserve the miracle and the mystery.

All such theories as the suggestion, elevation, and guidance or superintendence, propounded by [Philip] Doddridge and others, only darken counsel by words without knowledge. With Dr. [Thomas] Chalmers we fully agree when he says: “The important question with us is not the process of the manufacture, but the qualities of the resulting commodity. The former we hold not to be a relevant, and we are not sure that it is a legitimate inquiry.” Our system is to have no system. We maintain the fact and leave the mode untouched, because beyond our ken. The French writers, such as [Louis] Gaussen, M. d’Aubigne, [Adolphe] Monod, Jalaquier, and Remond, write with more reserve and caution than any other class of theologians in modern times. Thus Gaussen, in the same spirit with Chalmers, said, when taken to task for his admirable book: “My theory,” said he, “is to have no theory.”

While repudiating the notion that the human element absorbed the divine, and the theory that every word was given by direct dictation, we hold that the only safe and judicious ground to occupy is to maintain the fact, and to regard the mode as inexplicable. The Scripture, with that reticence which is one of its marked peculiarities, gives no disclosure of the mode which the Holy Ghost adopted. And on this whole subject, enveloped as it is in mystery, we may affirm with confidence that the facts are so various as to be incapable of classification by any investigator; that the message came in the Old Testament in audible words, in dreams, in visions, in ecstasies or raptures, and in the New Testament by the Spirit’s recalling the things spoken by Christ to memory, and by showing the apostles many things which they could not bear while Christ was with them. But our ignorance of the method not only disqualifies us from forming a consistent theory, but actually supplies a source of security and satisfaction.

The Scripture is the word of God, inspired throughout by the Spirit of God in every part, and given in human forms of expression. We must by no means maintain that the sacred writers were nothing but machines — nay, must be upon our guard against the attempt to define the undefinable. That a supernatural and miraculous operation prompted holy men to speak as they were moved by the Holy Ghost, and that the mental peculiarity of the writers was not suppressed by the theopneustic gift, as appears from their peculiar style and expression, must be accepted as the two sides of a great truth, which some have attempted to explain by immediate suggestion or dictation.

But it is better not to attempt to explain the inexplicable. We define not the nature or mode of the miracle or divine intervention; for miracle it was; and Scripture omits all more particular definition beyond the fact that holy men were wrought upon and moved by the Holy Ghost (2 Pet. 1.21). And we accept its silences as well as its disclosures. When Scripture stops, we stop.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/george-smeaton.html">George Smeaton</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Doctrine of the Holy Spirit. The Ninth Series of the Cunningham Lectures, 1882</cite>, (Edinburgh: T. &amp; T. Clark, 1882), pp 155-57.</span></figcaption>

<blockquote><p>Let this point therefore stand: that those whom the Holy Spirit has inwardly taught truly rest upon Scripture, and that Scripture indeed is self-authenticated; hence, it is not right to subject it to proof and reasoning. And the certainty it deserves with us, it attains by the testimony of the Spirit. … For as God alone is a fit witness of himself in his Word, so also the Word will not find acceptance in men&#x27;s hearts before it is sealed by the inward testimony of the Spirit.</p></blockquote>

<blockquote><p>7. That Word of God was first ἄγραφον [unwritten], afterward ἔγγραφον [enscripturated], materially the same in both cases, even if not formally; [it was the same] intensively, even if not extensively.

8. It alone today is the rule of things to be believed and done, and therefore adequate to its regulated object.

9. As it has its authority comparatively from itself, so also it has it in itself, and although it can be persuaded to us through other means, yet it cannot be persuaded except through that very light which it has in itself, just as also the sun can be seen only by its own light.

10. The authority of the Church, whatever it may be, can be here εἰσαγωγική [introductory] and διηγητική [expository], but cannot be αὐθεντική [self-authorizing] or αὐτοπιστική [self-credentialing]; for although the Holy Spirit uses both the intrinsic light of Scripture and the extrinsic light of the Church in impressing faith concerning Scripture upon us, yet the former is the primary medium and motive, the latter only secondary.

11. The Church can use unwritten traditions whether public of councils or private of fathers, but ought not to rely upon them. And traditions subalternate to Scripture must always be distinguished from those opposed to it; the former to be admitted, the latter to be rejected.

12. All dogmatic traditions of the Roman Church fabricated outside God’s word are opposed to God’s word, ritual ones for the greatest part of them.

13. Neither the constitution of the [Biblical] canon nor the interpretation of the constituted canon ultimately rests on the authority of the Church.

14. The αὐτοκρατορικός [absolute ruler], judge of controversies, is the one Spirit of God, the κανονικός [normative] judge is sacred Scripture, the ὀργανικός [instrumental] or λειτουργικός [ministerial] judge is the Church, but the one which is true, not the one which merely professes itself to be true.

15. But Scripture is a real Judge, not personal, whence vain are the argumentations which are drawn against the real judge from the characteristics of a personal judge.</p></blockquote>

— Friedrich Spanheim the Elder, ‘Miscellaneous Theological Disputation exhibiting a Theological Compendium’ in Disputationum Theologicarum Miscellaneorum Pars Prima, (d. 1649; Geneva: Chouët, 1652), trans. AI by Roman Prestarri at Confessionally Reformed Theology">Copy</button><a class="share" href="https://x.com/intent/post?text=%E2%80%9C7.+That+Word+of+God+was+first+%E1%BC%84%CE%B3%CF%81%CE%B1%CF%86%CE%BF%CE%BD+%5Bunwritten%5D%2C+afterward+%E1%BC%94%CE%B3%CE%B3%CF%81%CE%B1%CF%86%CE%BF%CE%BD+%5Benscripturated%5D%2C+materially+the+same+in+both+cases%2C+even+if+not+formally%3B+%5Bit+was+the+same%5D+intensively%2C+even+if+not+extensively.+8.+It+alone+today+is+the+rule+of+things+to+be+believed+and+done%2C+and+therefore+adequate+to+its+regulated+object.+9.+As+it+has+its+authority+comparatively+from+itself%2C+so+also+it+has+it+in+itself%2C+and+although+it+can+be+persuaded+to+us+through+other+means%2C+yet+it+cannot+be+persuaded+except+through+that+very+light+which+it+has+in+itself%2C+just+as+also+the+sun+can+be+seen+only+by+its+own+light.+10.+The+authority+of+the+Church%2C+whatever+it+may+be%2C+can+be+here+%CE%B5%E1%BC%B0%CF%83%CE%B1%CE%B3%CF%89%CE%B3%CE%B9%CE%BA%CE%AE+%5Bintroductory%5D+and+%CE%B4%CE%B9%CE%B7%CE%B3%CE%B7%CF%84%CE%B9%CE%BA%CE%AE+%5Bexpository%5D%2C+but+cannot+be+%CE%B1%E1%BD%90%CE%B8%CE%B5%CE%BD%CF%84%CE%B9%CE%BA%CE%AE+%5Bself-authorizing%5D+or+%CE%B1%E1%BD%90%CF%84%CE%BF%CF%80%CE%B9%CF%83%CF%84%CE%B9%CE%BA%CE%AE+%5Bself-credentialing%5D%3B+for+although+the+Holy+Spirit+uses+both+the+intrinsic+light+of+Scripture+and+the+extrinsic+light+of+the+Church+in+impressing+faith+concerning+Scripture+upon+us%2C+yet+the+former+is+the+primary+medium+and+motive%2C+the+latter+only+secondary.+11.+The+Church+can+use+unwritten+traditions+whether+public+of+councils+or+private+of+fathers%2C+but+ought+not+to+rely+upon+them.+And+traditions+subalternate+to+Scripture+must+always+be+distinguished+from+those+opposed+to+it%3B+the+former+to+be+admitted%2C+the+latter+to+be+rejected.+12.+All+dogmatic+traditions+of+the+Roman+Church+fabricated+outside+God%E2%80%99s+word+are+opposed+to+God%E2%80%99s+word%2C+ritual+ones+for+the+greatest+part+of+them.+13.+Neither+the+constitution+of+the+%5BBiblical%5D+canon+nor+the+interpretation+of+the+constituted+canon+ultimately+rests+on+the+authority+of+the+Church.+14.+The+%CE%B1%E1%BD%90%CF%84%CE%BF%CE%BA%CF%81%CE%B1%CF%84%CE%BF%CF%81%CE%B9%CE%BA%CF%8C%CF%82+%5Babsolute+ruler%5D%2C+judge+of+controversies%2C+is+the+one+Spirit+of+God%2C+the+%CE%BA%CE%B1%CE%BD%CE%BF%CE%BD%CE%B9%CE%BA%CF%8C%CF%82+%5Bnormative%5D+judge+is+sacred+Scripture%2C+the+%E1%BD%80%CF%81%CE%B3%CE%B1%CE%BD%CE%B9%CE%BA%CF%8C%CF%82+%5Binstrumental%5D+or+%CE%BB%CE%B5%CE%B9%CF%84%CE%BF%CF%85%CF%81%CE%B3%CE%B9%CE%BA%CF%8C%CF%82+%5Bministerial%5D+judge+is+the+Church%2C+but+the+one+which+is+true%2C+not+the+one+which+merely+professes+itself+to+be+true.+15.+But+Scripture+is+a+real+Judge%2C+not+personal%2C+whence+vain+are+the+argumentations+which+are+drawn+against+the+real+judge+from+the+characteristics+of+a+personal+judge.%E2%80%9D%0A%0A%E2%80%94+Friedrich+Spanheim+the+Elder%2C+%E2%80%98Miscellaneous+Theological+Disputation+exhibiting+a+Theological+Compendium%E2%80%99+in+Disputationum+Theologicarum+Miscellaneorum+Pars+Prima%2C+%28d.+1649%3B+Geneva%3A+Chou%C3%ABt%2C+1652%29%2C+trans.+AI+by+Roman+Prestarri+at+Confessionally+Reformed+Theology&amp;url=https%3A%2F%2F5solasquotes.github.io%2Fquote%2F481419e3f6.html&amp;via=5Solas" target="_blank" rel="noopener">Share on X</a><a class="perma" href="../quote/481419e3f6.html">Permalink</a><a class="src" href="https://reformedbooksonline.com/the-authority-of-the-bible/#:~:text=7.%20That%20Word%20of%20God%20was,the%20characteristics%20of%20a%20personal%20judge&amp;text=7.%20That%20Word%20of%20God%20was%20first%20%E1%BC%84%CE%B3%CF%81%CE%B1%CF%86%CE%BF%CE%BD&amp;text=judge%20from%20the%20characteristics%20of%20a%20personal%20judge" rel="noopener" target="_blank">Read it online · Reformed Books Online</a></div>

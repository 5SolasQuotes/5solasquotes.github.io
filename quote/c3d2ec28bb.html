</figure><figure class="quote" id="q-c4d6862443" data-kw="">
<blockquote><p>Now, if these authorities, strengthened by those of the most rigid divines and moralists among the first reformers, such as Wyckliff, Luther, Melancthon, Erasmus, and a long train of divines, civilians and canonists, down to [Hugo] Grotius himself; I say, if these authorities will justify the setting aside that of Justinian and the Popish decretals, in favor of Valentinian and Theodosius, supported by almost all the primitive Fathers, the modern [Anglican] practice of refusing a divorce in cases of adultery must be allowed to be a barbarous and oppressive instance of the remains of priestcraft and popery…</p></blockquote>

</figure><figure class="quote" id="q-c7d77a0489" data-kw="">
<blockquote><p>That power is given by the Presbyteries’ act of ordination, by order of nature, before the people’s formal act of election: As the husband who in a lapidaries shop chooses a gold ring for his wife, and puts it on her finger, presupposes it was a gold ring before his choosing thereof, neither does his choosing thereof make it a gold ring, but only makes it his wife’s gold ring by application to her: Just so, peoples election appropriates such a man who is already a pastor to such a charge, but does not make the pastor a pastor, but chooses him only to be their pastor.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/samuel-rutherford.html">Samuel Rutherford</a></span><span class="wk"><span class="lbl">Work:</span> <cite>A Peaceable &amp; Temperate Plea for Paul’s Presbytery in Scotland</cite>, (1642), ch. 17, p. 267</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/civil-government-and-society/marriage-and-family.html">Marriage and Family</a></span></div>

</figure><figure class="quote" id="q-1d8c041065" data-kw="">
<blockquote><p>Some have upon these words made a question whether it be lawful for the husband or the wife separated for adultery to marry again while each other lives. As to the party offending, it may be a question; but as to the innocent person offended, it is no question, for the adultery of the person offending has dissolved the knot of marriage by the Divine law. It is true that the knot cannot be dissolved without the freedom of both persons each from another, but yet it seemeth against reason that both persons should have the like liberty to a second marriage. For:

1. The adulteress is by God’s law a dead woman, and so in no capacity to a second marriage.

2. It is unreasonable that she should make an advantage of her own sin and error.

3. This might be the occasion of adultery, to give a wicked person a legal liberty to satisfy an extravagant lust. But for the innocent person, it is as unreasonable that he or she should be punished for the sin of another.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/matthew-poole.html">Matthew Poole</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Annotations on Matthew</cite>, ch. 19, v. 9</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/civil-government-and-society/marriage-and-family.html">Marriage and Family</a></span></div>

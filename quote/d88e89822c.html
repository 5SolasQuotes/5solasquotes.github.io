<main class="wrap"><figure class="quote" id="q-d88e89822c" data-kw="">
<blockquote><p>16. God’s providence extensively is occupied concerning all both entities and acts of entities, and intensively is partly effective, partly permissive, partly directive. 17. Works of grace are either preparatory of it [i.e. decrees] or applicatory. 18. Secondary preparatory works of grace [such as infra decrees] can be given; primary ones [such as supra decrees] cannot be given. 19. Secondary preparatory works of grace are the eternal destination of the Mediator, and his temporal mission, and the obedience of the one sent, consisting both in his appearance and in the execution of the threefold office undertaken by him. … 24. Applicatory works of grace are either external or internal. 25. External ones are both calling through the Word partly of law, partly of gospel, and the sealing of those called through sacraments.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/spanheim-sr-friedrich.html">Spanheim, Sr., Friedrich</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Disputationum Theologicarum Miscellaneorum Pars Prima</cite>, (d. 1649; Geneva: Chouët, 1652), ‘Miscellaneous Theological Disputation’, trans. AI by Roman Prestarri at Confessionally Reformed Theology Latin</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/election/nature-of-election.html">Nature of Election</a></span></div>

<blockquote><p>17. It is mercy that there is a possibility of happiness, and that upon our pain’s taking, we may have a Kingdom; by our Fall in Adam we forfeited Heaven; why might not God have dealt with us as with the lapsed angels? they had no sooner sinned but were expelled Heaven never to come thither more; we may say as the apostle, Rom. 11:22, ‘Behold the goodness and severity of God.’ To the apostate angels behold the severity of God that He should throw them down to Hell forever; to us behold the goodness of God, that He has put us into a possibility of mercy, and if we do but take pains, there is a Kingdom stands ready for us; how may this whet and sharpen our industry, that we are in a capacity of salvation; and if we do but what we are able, we shall receive an eternal weight of glory.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/thomas-watson.html">Thomas Watson</a></span><span class="wk"><span class="lbl">Work:</span> <cite>A Body of Practical Divinity</cite>, (d. 1686; London: Parkhurst, 1692), The Lord’s Prayer, ‘Thy Kingdom Come’, p. 507</span></figcaption>

</figure><figure class="quote" id="q-c8a0ce7831" data-kw="">
<blockquote><p>II. Both you and I hold, and must hold, that God decrees to damn all that shall be damned. But it is false that we hold that He does it without any respect to foreseen sin. (Vasquez on Thomas, pt. 1, quest. 23, art. 3, p. 709, Conclusio (quod Deus aliquos reprobat) est de fide constat enim ex scriptura multos a Deo reprobari [The conclusion (that God reprobates some) is of the Faith, for it is evident from Scripture that many are reprobated by God.”]. See Ruiz, On Predestination, tract. 2 through the whole) For: 1. He foresees this sin as the only meritorious cause of their damnation; what He does in time, that is it which He decreed to do from eternity: But in time He damns no man but for sin; therefore from eternity He decreed to damn no man but for sin: For sin, I say, as the cause of damnation, which Dr. Twisse does frequently profess. 2. And though this sin can be no proper efficient cause of God’s volition or decree, yet it is a presupposed necessary qualification in the object, as foreseen in the mind of God, and so, as aforesaid, is an objective cause as foreseen.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/richard-baxter.html">Richard Baxter</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Catholic Theology Plain, Pure, Peaceable, for pacification of the dogmatical Word-Warriors who</cite>, (London: White, 1675), pt. 2, 1st Day’s Conference, about Predestination, p. 9</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/election/nature-of-election.html">Nature of Election</a></span></div>

<main class="wrap"><figure class="quote" id="q-6ab06d3655" data-kw="">
<blockquote><p>But let us suppose, for I shall not contradict it, that the common determination is right, that God created the world, not necessarily, but freely; not only as freedom is opposite to coaction, and to any extrinsic, imposed necessity, which are unquestionable, but also to an intrinsical necessity, so that his wisdom, and communicative nature, or glory, did not necessitate the creation of the world, but that he so willed to create it, that consideratis considerandis, he might have nilled it, and in this sense did freely create it. I say on this common ground supposed we shall proceed, though I fear such high inquiries myself.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/richard-baxter.html">Richard Baxter</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Unreasonableness of Infidelity (London: R.W., 1655), An Advertisement Explicatory</cite>, pp. ix-x</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/creation/the-six-days.html">The Six Days</a></span></div>

</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-dc7a50961f" data-kw="">
<blockquote><p>The time of the creation, as here I take it in general, is not only the first moment of time, as in this [first] verse it signifies, but also the six days mentioned distinctly in the rest of the chapter. For the highest heaven, and the rude matter, the earth, were created in the first moment of time, and all other things in the space of six days, as the history most plainly teaches… …or if I incline to any opinion concerning the time of the year, it is that the world was created in the Spring, when the day and night are equal and both of one length in all the world, that is, in the month [Hebrew] Abib, which is part of March and part of April.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/george-walker.html">George Walker</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The History of the Creation as it is Written by Moses in the First &amp; Second Chapters of Genesis: Plainly Opened &amp; Expounded in Several Sermons… (London: Barlet, 1641), Of the Creation of the World</cite>, ch. 1, pp. 7-8. See also p. 6 for more similar context.</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/creation/the-six-days.html">The Six Days</a></span></div>
<div class="actions"><button class="copy" data-copy="“The time of the creation, as here I take it in general, is not only the first moment of time, as in this [first] verse it signifies, but also the six days mentioned distinctly in the rest of the chapter. For the highest heaven, and the rude matter, the earth, were created in the first moment of time, and all other things in the space of six days, as the history most plainly teaches… …or if I incline to any opinion concerning the time of the year, it is that the world was created in the Spring, when the day and night are equal and both of one length in all the world, that is, in the month [Hebrew] Abib, which is part of March and part of April.”

<blockquote><p>43. Potential being considered in itself is not simply real, that is, does not really exist save virtually in its causes. But it differs conceptually from the absolutely nothing and from being of reason; for the idea of a possible quiddity involves the relation of non-repugnance to existence, while the others do not.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/alan-b-wolter.html">Alan B. Wolter</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Little Summary of Metaphysics (Milwaukee: Bruce Publishing Co., 1958)</cite>, pp. 55-56</span></figcaption>

<blockquote><p>Of all the creatures in it, it may be truly said that they are but of yesterday, Job. 8:9, if we measure them according to God’s (that is according to the true) account, to whom a thousand years are but as yesterday, Ps. 90:4, in which estimation the world is not yet six days old… What are five or six thousand years to eternity? which God enjoys, who is from everlasting to everlasting, Ps. 90:2.</p></blockquote>

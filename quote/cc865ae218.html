<blockquote><p>Those attributes which God accounts his greatest riches and greatest glory, Rom. 9:23, even his mercy and free grace, which he intends most to exalt, never saw light till now; the doctrine of salvation by Christ being the stage, wherein only it is represented, and elsewhere it is not to be seen, and upon it acts the greatest part, for all passages in it tend to this, to shew, as Eph. 2:5, that ‘by grace we are saved;’ and therefore, 1 Peter 2:10, the whole work of salvation is called ‘mercy,’ all God’s ways to his people are mercy, Ps. 25:10, the whole plot and frame of it is made of mercy, and therefore the doctrine of the gospel is called grace, Titus 2:10, 11. Mercy manageth the plot, gives all other attributes, as it were, their parts to act; mercy enters in at the beginning, acts the prologue in election; and, giving Christ, continues every part of it, sets all a-work, ends the whole in glory…</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/thomas-goodwin.html">Thomas Goodwin</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Sermon</cite>, 1</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/effectual-calling.html">Effectual Calling</a></span></div>

</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-76f5cff49e" data-kw="">
<blockquote><p>…our Lord also taught the universality of the love of God in the numerical sense of appropriating it to every individual man… …in the second place, that the work of redemption itself bears in our Lord’s representation a broad cosmical character… Especially the doctrine of the kingdom in its eschatological aspect clearly reveals that the divine love sets for its goal not the saving of isolated individuals out of the world, but the salvation of the world as an organic whole… There is, however, still a third sense, in which Jesus leads us to ascribe universality to the divine love. This is done not so much in explicit form as by the implications of His attitude toward sinful men in general.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/geerhardus-vos.html">Geerhardus Vos</a></span><span class="wk"><span class="lbl">Work:</span> <cite>“The Scriptural Doctrine of the Love of God” in The Presbyterian &amp; Reformed Review</cite>, pp. 13-14 of “The Scriptural Doctrine of the Love of God” in The Presbyterian &amp; Reformed Review, no. 13 (1902)</span></figcaption>

</figure><figure class="quote" id="q-13bbb190bd" data-kw="">
<blockquote><p>20. ‘Behold, I stand at the door, and knock: if any man hear my voice, and open the door, I will come in to him, and will sup with him, and he with Me.’ 20. I have my time of offering mercy, and desiring you to entertain it: And if any man hear and obey this call, I will come in by my Spirit, and take habitual possession of him, and have spiritual communion with him, and he with Me. Note: Though it be not without the grace of Christ that we open to him when He knocks, and receive his offered special grace, yet, in this, He lays so much on man as to make our opening, that is, our accepting-faith, the condition of his entering for a fixed habitation by habitual love and holiness. On which account divines used to say that faith and repentance, wrought first in conversion, are the conditions or qualifications for consequent justification and sanctification.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/richard-baxter.html">Richard Baxter</a></span><span class="wk"><span class="lbl">Work:</span> <cite>A Paraphrase on the New Testament with Notes, Doctrinal &amp; Practical</cite>, ... (1685), on Rev. 3, verse 20</span></figcaption>

</figure><figure class="quote" id="q-bcce423899" data-kw="">
<blockquote><p>As we see from the Westminster Confession and the 1689 Baptist Confession the Puritans believed in the doctrines of grace such as election and particular redemption (Rom 8:28-30). They followed Calvin in resisting false human rationalisations. For instance they resisted the idea that God only loves the elect and hates the non-elect. This error is called hyper-Calvinism. It is a very serious error which is recurring today. The Puritans were experts in their understanding of the concept of common grace although they did not use that term.¹ Their teaching accords fully with the way in which the doctrine of Common Grace is expounded by Prof John Murray (cf Works). They believed that the Holy Spirit is constantly active in restraining evil and promoting good throughout society. The Puritans believed in the universal love of God for all mankind (1 Tim 2:1-6; 2 Peter 3:9). They believed in the universal provision of God for all mankind according to the covenant made with Noah as representative of the whole world (Gen 8:20-22 and Ps 145). ¹ [Webmaster’s note: This particular claim is not true. Following Calvin’s use of the term ‘general grace’, the puritans did use the term ‘common grace’, as is affirmed by Dr. Richard Muller below on p. 130, and as is instanced by James Durham (who has a whole section on ‘common grace’ in his Revelation commentary), Stephen Charnock (below), and John Bunyan (below).]</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/erroll-hulse.html">Erroll Hulse</a></span><span class="wk"><span class="lbl">Work:</span> <cite>“The Example of the English Puritans”</cite>, (Reformation Today 153, Sept/Oct 1996)</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/effectual-calling/common-grace.html">Common Grace</a></span></div>

</figure><figure class="quote" id="q-c8169f3d76" data-kw="">
<blockquote><p>All infants of Christians, even before baptism are holy, with a federal and external holiness, on account of which they ought to be reputed a part of the visible Church and people of God, and as federates be admitted to the seal of the Covenant. Some infants of Christians, even before Baptism, nay even in their mother’s womb, not indeed by nature, but by grace, are holy with an internal sanctity, and these infants are believers and regenerate… The internal sanctity is not necessarily conjoined with the federal, but in many infants and adults is separated from it. This we learn from the event; for those who were once sanctified never wholly lose their sanctity. … There is no need here of inferences or citations, to convince me. Of my own accord, and freely and expressly I confess, with [Zacharias] Ursinus and our other teachers, that not all who are baptized, whether adults or infants, become participants of the grace of Christ, for the election of God is most free: it is therefore a prerogative of the elect alone, which baptism seals.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/marcus-friedrich-wendelin.html">Marcus Friedrich Wendelin</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Theological Exercitations</cite>, 37.1,18-19 as translated in Charles P. Krauth, Infant Baptism and Infant Salvation in the Calvinistic system. A Review of Dr. Hodge’s Theology (Philadelphia: Lutheran Books Store, 1874), p. 16</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/effectual-calling/salvation-of-infants-and-heathen.html">Salvation of Infants and Heathen</a></span></div>
<div class="actions"><button class="copy" data-copy="“All infants of Christians, even before baptism are holy, with a federal and external holiness, on account of which they ought to be reputed a part of the visible Church and people of God, and as federates be admitted to the seal of the Covenant. Some infants of Christians, even before Baptism, nay even in their mother’s womb, not indeed by nature, but by grace, are holy with an internal sanctity, and these infants are believers and regenerate… The internal sanctity is not necessarily conjoined with the federal, but in many infants and adults is separated from it. This we learn from the event; for those who were once sanctified never wholly lose their sanctity. … There is no need here of inferences or citations, to convince me. Of my own accord, and freely and expressly I confess, with [Zacharias] Ursinus and our other teachers, that not all who are baptized, whether adults or infants, become participants of the grace of Christ, for the election of God is most free: it is therefore a prerogative of the elect alone, which baptism seals.”

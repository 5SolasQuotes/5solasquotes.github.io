<main class="wrap"><figure class="quote" id="q-6a3f19b66b" data-kw="">
<blockquote><p>When God had caused his everlasting decree to fall in labour, and had delivered it by giving the world a being, and upon infinite consultation had formed man to be his viceroy over all the works of his hands, he embarked him, with all abilities needful for such a voyage, in the bottom of the covenant of works.

Adam set forth fully furnished with skill, and richly fraught with all the fortunes, hopes, and happiness of mankind; but he had scarce launched out of sight, before Satan, who knew very well the worth of the prize, envying man the haven of bliss to which he was sailing, and envying God, who was the owner, the honour of such a venture, raised a storm, whereby the vessel, through the unfaithfulness of Adam, the pilot, ran upon a rock and miscarried. Oh what a joyful spectacle was that to Satan!

What a doleful sight to Adam, to behold himself, and all his posterity, sinking into the boundless, bottomless ocean of destruction and misery, through his falseness and treachery! when, lo, on a sudden the glorious God, out of the superabundant riches of his mercy, resolving that the devil should never rob him of the honour of that manifold wisdom, unsearchable goodness, and almighty power, which had been manifested in the work of creation, did provide and cast out the covenant of grace, a plank sufficient for his poor shipwrecked creature to swim safe to shore on.

As all the rivers meet in the sea, and all the lines in the centre, so do all the comforts of mankind meet in this covenant. The whole Scripture is ‘sincere milk,’ but this covenant is the cream of it: all our mercies are contained in it, all our hopes are sustained by it, and our heaven is at last attained through it.

The blessed God doth not only enter into a covenant of mercy, but out of compassion to our infirmities, hath been pleased to confirm it by his hand and seal: by his hand in his word, by his seals, by the privy-seal of his Spirit, and by the broad seals of the sacraments, that by these ‘immutable things, in which it is impossible for God to lie, we might have strong consolation, who have fled for refuge, to lay hold upon the hope set before us,’ Heb. vi. 18.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/george-swinnock.html">George Swinnock</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Christian Man’s Calling</cite>, (1661-65) in The Works of George Swinnock, M.A. (5 vols, Edinburgh: James Nichol, 1868), 1: 172.</span></figcaption>

</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-4ddb9747d0" data-kw="covenant of grace">
<blockquote><p>Reply; How often have we shewed that this Text proves not that any Children, quatenus as such, should be baptized, nor, as such, that they are in the Covenant of Grace, or have the Promise made to them; the Promise runs to the Jews and to their Offspring, and not to them only, but to Gentiles also, who were said to be afar off: But pray observe, &#x27;tis to no more of the Jews and their Children or Offspring, and such who were afar off, than the Lord shall call or make Disciples by the Word and effectual Operations of the Holy Spirit. My Sons and Daughters are as much my Children when they are twenty or thirty Years old, as well as when Babes. Dr. Hammond also grants, Children in this Text doth not refer to Insants as such, but to the Posterity of the Jews, p. 490. Sect. 81. If ye be Christ&#x27;s, then you are Abraham&#x27;s Seed, and Heirs according to the Promise.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/benjamin-keach.html">Benjamin Keach</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Pedo-Baptism Disproved</cite></span></figcaption>

</figure><figure class="quote" id="q-a2589ed117" data-kw="">
<blockquote><p>It is very plain that any plan designed to secure the salvation of an elect portion of a race propagated by generation and living in association, as is the case with mankind, cannot secure its end without greatly affecting, for better or for worse, the character and destiny of all the rest of the race not elected.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/start-here.html">Reformed Books Online</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Common Grace (outline)</cite>, C. COMMON GRACE AND THE ATONING WORK OF CHRIST, And it is but natural that this should be so. If Christ was to save an elect race, gradually called out of the world of humanity in the course of centuries, it became necessary for God to exercise forbearance, to check the course of evil, to promote the development of the natural powers of man, to keep alive within the hearts of men a desire for civil righteousness, for external morality and good order in society, and to shower untold blessings upon mankind in general. Dr. [Charles] Hodge expresses it thus:</span></figcaption>

</figure><figure class="quote" id="q-87a1170a38" data-kw="">
<blockquote><p>While the non-elect may belong to the external administration of the covenant of grace, only the elect are, properly speaking, in the covenant of grace (cf. Galatians 3:16, Romans 5:15-21, Isaiah 53:10, 11). This view is not a “Reformed Baptist” notion but is the official position of the Westminster Standards (see Larger Catechism 31). Moreover, we find the Westminster divine, Edmund Calamy, arguing for this position:

[A]ll men enter into Adam’s covenant by nature, but the Elect only enter into Christ’s covenant by grace …</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/edmund-calamy.html">Edmund Calamy</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Two solemn covenants made between God and man: viz. the covenant of works and the covenant of grace</cite>, (London: Thomas Banks, 1647), p. 6.</span></figcaption>

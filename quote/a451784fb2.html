<main class="wrap"><figure class="quote" id="q-a451784fb2" data-kw="">
<blockquote><p>Not only few, and uncertain, but Evil likewise are the days of the Years of my Life, may every one say, with the Patriarch Jacob. A sufficient portion of Evil for every year may well be expected, when our Lord tells us, there is a certain measure allotted for every day. Sufficient to the day is the evil of it. Not only is our Life short, but troublesome, full of vexatious Mixtures. We cannot sing a Requiem to our Souls, when one great Calamity is past; for we know not, in this Region of Changes, but another, a greater may be at hand. One Messenger of ill News may succeed and out-do another, as it was with Job. We come weeping into the World in a most helpless forlorn state; and if we escape the dangers of Infancy, and the casualties of Childhood; and after that, out-live the Snares and Follies of Youth, We are tost upon the Pikes of Time and Chance, and sadden and disquiet our selves with a thousand Griefs and Sorrows, by inevitable and unexpected occasions; though we increase the number of needless Cares and Fears, and Discontents; Till at length a sudden stroke arrests us, we fetch a groan, and die.

Who can give a Catalogue of the Afflictions and Calamities, Perplexities and Disappointments, Incumbrances, Crosses, and evil Accidents of Humane Life? By means whereof Millions are disconsolate and sad, mourn and complain, weep and sigh, and from day to day are fed with the Bread of Affliction, and the water of Adversity. Not to mention men’s fluctuating restless Thoughts of Heart, importunate Desires, baffled Projects, defeated Purposes, which suppose or bring vexation. A good share of these is not to be avoided; and yet very few can be particularly foreseen. Who could prognosticate a year ago the Mercies or the Evils, which have happened since?

Public and private, personal and relative, to the Countries, Cities, Families and Persons we are concerned for? And who can certainly foretell the Events of this ensuing Year? God hath intermixt Good and Evil in the Life of Man: He hath set Prosperity against Adversity, saith Solomon, to the end, that Man should find nothing after him. Eccles. 7.14. that he may not know what shall come next, whether a Prosperous or a Calamitous Event. What a change may be made in a year by the mere Casualty of human Events? by the treachery of Friends, or the malice of Enemies, or the more immediate Hand of God?

We know not what shall be on the Morrow, much less what a twelve Month may produce. Because whatever may be disposed to happen, from natural causes, or civil counsels, may be altered by a particular decree of Providence. Prepare me Lord! and every of those in whose Felicity I more especially take part, for all the Calamities and Sorrows, thine infinite Wisdom shall think fit to exercise us with, this following year: and by thy merciful Providence, and gracious Conduct, cause them to work for Good: Furnishing us with suitable strength and wisdom, to acquiesce in thy good Pleasure, and obey thy Will. Let me follow thee, as the Father of the Faithful, ‘tho I know not whither thou wilt lead me. Knowing the wisdom and faithfulness of my Pilot, let me therein be satisfied, though I know not particularly what course he will steer. I thank thee, O Heavenly Father! that thou hast reserved the knowledge of future Times and Seasons to thy self, and hid Events from Men; Lest by considering them Certain, we should presume in case they are Good; or should despairingly afflict our selves, by foreseeing the Evil we know, to be inevitable.

Did we certainly foreknow the Good that would befall us, we should not Trust in thee to bring it to pass, or heartily implore thy Care and Conduct. Did we foresee the Evils we shall suffer, before they overtake us, we should be overwhelmed with diffidence and Despair. Many a Mother who rejoiceth at the Birth of a Son, would mourn to foresee what a Man, what a Son he will prove. Such an increase of Knowledge would increase our Sorrow; such a Prescience would transport and discompose us, by unseasonable Joys and Sorrows, born out of Time; make us remiss in our Duty to Thee; and weaken our Dependence on thine own unerring Wisdom, Truth, and Power.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/john-shower.html">John Shower</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Serious reflections on time and eternity with some other subjects, moral and divine. To which is prefixed an introduction concerning the first day of the year, how observed by the Jews, and may best be employed by a serious Christian</cite>, (London: Joseph Watts, 1689), pp 50-53.</span></figcaption>

<blockquote><p>In context, Samuel Rutherford is discussing the question as to whether or not the reprobates have lost all right to the use of God’s creation as a result of Adam’s fall. In the midst of this, he raises a question concerning thieves being required to make restitution for goods that they have stolen, and he answers in the affirmative. Although I am not sure if this is enough to indicate a change in position from that which he took in his earlier work, A Free Disputation (where he argued that restitution for theft was not among the Mosaic laws of common equity), the reference to the case laws in Exodus 22 implies that the marrow of the laws concerning restitution are still binding:

[A] thief is obliged to restore stolen goods […] They who enjoy that which they may and ought by their own private power, restore, such as ill conquered goods. They sin in using that, true, Proverbs 3:27; Exodus 22:26, 27; Luke 19:8. It’s a sin to withhold the raiment though laid in pawned, which should cover the poor man’s skin in the night, and they have no right to enjoy that.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/samuel-rutherford.html">Samuel Rutherford</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The covenant of life opened; or, a treatise of the covenant of grace</cite>, ed. C. M. McMahon (1654; New Lennox IL, 2005), pp 98-9.</span></figcaption>

<blockquote><p>It’s now high time that every crime be brought to punishment: Wrath long contained, and oft refrained, at last must have a vent. Justice severe cannot forbear to plague sin any longer; But must inflict with hand most strict mischief upon the wronger. … Eternal smart is the desert ev’n of the least offence; Then wonder not if I allot to you this recompence: But wonder more that, since so sore and lasting plagues are due To every sin, you liv’d therein, who well the danger knew. .. Die feign they would, if die they could but death will not be had; God’s direful wrath their bodies hath for ev’r immortal made. They live to lie in misery. and bear eternal woe: And live they must whil’st God is just, that He may plague them so. … O love the Lord, all ye his saints, who hath Redeemed you from everlasting wrath: Who hath by dying made your souls to live, And what He dearly bought doth freely give. Give up your selves to walk in all his ways, And study how to live unto his praise. The time is short you have to serve Him here: The day of your deliverance draweth near. Lift up your heads, ye upright ones in heart, Who in Christ’s Purchase have obtain’d a part; Behold! He rides upon a shining cloud, With angel’s voice, and trumpet sounding loud. He comes to save his folk from all their foes, And plague the men that holiness oppose. So come, Lord Jesus, quickly come we pray, Yea come and hasten our Redemption Day.</p></blockquote>

<blockquote><p>XVIII. The natural law cannot be said to have undergone a change by the division of lands and the ownership of possessions and goods introduced by the law of nations. No natural law commands a community of goods or prohibits their distribution. If all things are said to have been common from the beginning, this is to be understood not so much positively (as if God had enacted a law making all things common) as negatively (because nothing was expressly determined concerning it, since there was as yet no necessity for it). Afterwards a distinction and ownership of goods was justly introduced with the authority of God, to prevent controversies, to restrain external violence and to afford certainty to inheritances and make a distinction in conditions (without which human society could not exist).</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/francis-turretin.html">Francis Turretin</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Institutes of Elenctic Theology</cite>, vol. 2, 11th Topic, 2nd Question, ‘The Nature of the Moral Law’, section 18, pp. 12</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/civil-government-and-society/natural-law-and-civil-law.html">Natural Law and Civil Law</a></span></div>

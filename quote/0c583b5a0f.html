<main class="wrap"><figure class="quote" id="q-0c583b5a0f" data-kw="">
<blockquote><p>VIII. Hence is that received and fit distinction, that Christ died for all men, in respect of the sufficiency of his merit, or the greatness of the price: but in respect of the efficacy and fruit of his death, he died for all, and only for the believers; seeing not all, but only the faithful receive him: but the rest reject him through infidelity.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/david-pareus.html">David Pareus</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Article 2, ‘Of Christ’s Death &amp; Merit’ in Aphorisms of the Orthodox Doctrine of the Reformed Churches in Zachary Ursinus, The Sum of Christian Religion… (London: Young, 1645)</cite>, pp. 694-98</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/priestly-office-satisfaction-and-atonement/extent-of-the-atonement.html">Extent of the Atonement</a></span></div>
<div class="actions"><button class="copy" data-copy="“VIII. Hence is that received and fit distinction, that Christ died for all men, in respect of the sufficiency of his merit, or the greatness of the price: but in respect of the efficacy and fruit of his death, he died for all, and only for the believers; seeing not all, but only the faithful receive him: but the rest reject him through infidelity.”

— David Pareus, Article 2, ‘Of Christ’s Death &amp; Merit’ in Aphorisms of the Orthodox Doctrine of the Reformed Churches in Zachary Ursinus, The Sum of Christian Religion… (London: Young, 1645), pp. 694-98">Copy</button><a class="share" href="https://x.com/intent/post?text=%E2%80%9CVIII.+Hence+is+that+received+and+fit+distinction%2C+that+Christ+died+for+all+men%2C+in+respect+of+the+sufficiency+of+his+merit%2C+or+the+greatness+of+the+price%3A+but+in+respect+of+the+efficacy+and+fruit+of+his+death%2C+he+died+for+all%2C+and+only+for+the+believers%3B+seeing+not+all%2C+but+only+the+faithful+receive+him%3A+but+the+rest+reject+him+through+infidelity.%E2%80%9D%0A%0A%E2%80%94+David+Pareus%2C+Article+2%2C+%E2%80%98Of+Christ%E2%80%99s+Death+%26+Merit%E2%80%99+in+Aphorisms+of+the+Orthodox+Doctrine+of+the+Reformed+Churches+in+Zachary+Ursinus%2C+The+Sum+of+Christian+Religion%E2%80%A6+%28London%3A+Young%2C+1645%29%2C+pp.+694-98&amp;url=https%3A%2F%2F5solasquotes.github.io%2Fquote%2F0c583b5a0f.html&amp;via=5Solas" target="_blank" rel="noopener">Share on X</a><a class="perma" href="../quote/0c583b5a0f.html">Permalink</a><a class="src" href="https://reformedbooksonline.com/on-the-sufficiency-of-the-atonement/#:~:text=VIII.%20Hence%20is%20that%20received%20and,the%20rest%20reject%20him%20through%20infidelity." rel="noopener" target="_blank">Read it online · Reformed Books Online</a></div>
</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-cec55288b5" data-kw="">
<blockquote><p>Rejection of the errors of those: Who teach that Christ died for each and everyone sufficiently not only with regard to the worth, but even by reason of the intention, or for all conditionally if they believe; or who assert that Scripture teaches that Christ died for all men in general, and particularly that the Scripture passages Ezek. 18:21, etc., and 33:11; John 3:16; I Tim. 2:4; II Pet. 3:9 ought to extend to each and every man, and that the universality of love and grace is proved by them.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/genevan.html">Genevan</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Donald D. Grohman, The Genevan Reactions to the Saumur Doctrines of Hypothetical Universalism: 1635-1685 Th.D. diss (Knox College in cooperation with Toronto School of Theology. 1971), pp. 231-35 For context see ‘Donald Grohman on Dort and the 1649 Genevan Articles’ at Calvin &amp; Calvinism and Grohman.</cite></span></figcaption>
<div class="meta"><span class="t"><a href="../topics/priestly-office-satisfaction-and-atonement/extent-of-the-atonement.html">Extent of the Atonement</a></span></div>

</figure><figure class="quote" id="q-57b9d0e0cb" data-kw="">
<blockquote><p>Mr. Reynolds–The Synod [of Dort] intended no more than to declare the sufficiency of the death of Christ; it is pretium in se [valuable in itself], of sufficient value to all, nay, ten thousand worlds. There are two Adams, one a fountain of misery, and the other of mercy… To be salvable is a benefit, and therefore belongs only to them that have interest in Christ.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/edward-reynolds.html">Edward Reynolds</a></span><span class="wk"><span class="lbl">Work:</span> <cite>eds. Alexander Mitchell &amp; John Struthers, Minutes of the Sessions of the Westminster Assembly of Divines (London: Blackwood &amp; Sons, 1874)</cite>, pp. 153-54</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/priestly-office-satisfaction-and-atonement/extent-of-the-atonement.html">Extent of the Atonement</a></span></div>

<blockquote><p>Lastly, let us diligently consider the judgement of ancient writers… Aquinas says (Summa de verit. Mt. 26, q. 7), ‘Christ’s merit, according to the sufficiency, carries itself indifferently to all, but not according to the efficacy.&#x27;</p></blockquote>

</figure><figure class="quote" id="q-764260c473" data-kw="">
<blockquote><p>Fourthly, we deny that all mankind is the object of that love of God which moved Him to send his Son to die: God having made some for the day of evil, Prov. 16:4; hated them before they were born, Rom. 9:12; before of old ordained them to condemnation, Jude 4; being fitted for destruction, Rom. 9:22; made to be taken and destroyed, 2 Pet. 2:12; appointed to condemnation, 1 Thess. 5:9; to go to their own place, Acts 1:25.</p></blockquote>

<main class="wrap"><figure class="quote" id="q-bb928bfd8e" data-kw="">
<blockquote><p>To destroy our own lives is A SIN AGAINST GOD. That God is the Author of our existence; that he sent us into the world; and that our time and talents, as well as our persons, are his property, are self-evident propositions, which none but an atheist will deny. … But if there be a God who made us, who has a right to our services, and whose Providence extends to all his creatures and all their actions, then there is an end for which we were made, a task which we are bound to accomplish, a term of service which it is our duty to fulfil; and, of course, he alone who placed us here, has a right to decide when this task is done, to judge when this term of service ought to close, and, in a word, to dispose of the life and the talents which his power has bestowed.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/samuel-miller.html">Samuel Miller</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Guilt, Folly, and Sources of Suicide: Two Discourses, Preached in the City of New-York, February, 1805</cite>, (New York: T. and J. Swords, 1805), pp 15-16.</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/civil-government-and-society/life-birth-and-medical-ethics.html">Life, Birth and Medical Ethics</a></span></div>

<blockquote><p>(4) The formation of the foetus in the Virgin’s womb had its stages and processes, as is usual in the formation of other foetuses and which are usually completed in the space of 9 months. It was right that Christ should be made like us in this too, namely in not being formed and born in a moment, but being completed in a matrix suited to the order and processes of nature, the operation of the H. Spirit thus accommodating its process of quickening. (5) The union of the divine nature with the human began the moment the formation of the human nature was completed, so that it would be said to have been composed of human matter and form.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/bartholomaus-keckermann.html">Bartholomaus Keckermann</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Reformed Dogmatics, Person of Christ</cite>, As quoted in Heinrich Heppe, section 12, p. 425</span></figcaption>

<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/john-trapp.html">John Trapp</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Commentary on the Bible</cite>, on 2 Pet, (d. 1669) on Ex. ch. 21, v. 22</span></figcaption>

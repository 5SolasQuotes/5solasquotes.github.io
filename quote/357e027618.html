<blockquote><p>III Rule. Every man must measure himself by his own strength and do nothing beyond his ability. This rule is set down, though expressed in other terms, Rom. 12:3, ‘No man must presume to understand above that which is meet to understand, but ought to be wise according to sobriety as God hath dealt to every man the measure of faith.’ An example of the transgression of this rule we have in David’s three worthies who break into the host of the Philistines to fetch David the king water from the well of Bethleham, 2 Sam. 23:16, which act of theirs was a rash enterprise and such a one as David himself condemns in that chapter, because they went beyond their strength to encounter with a whole garrison of men, they being themselves but few, namely three in number. IV Rule. We must distinguish between the necessary works of our callings that pertain to us and other works that are out of our callings and pertain not unto us: and we must do the other though we leave these undone. This rule is propounded in 1 Thess. 4:11, ‘Meddle with your own business.’ That is, do the necessary works of your callings that belong to you though you leave the other for the time undone. The contrary to it is to live or to behave himself inordinately, 2 Thess. 3:7. And we have an example of the transgression hereof in Peter, Jn. 21:21, whom when Christ had commanded to follow Him, he would needs ask Him what John should do; Christ gives him this answer: ‘What is that to thee?’ In which words He teaches that not only Peter, but also every man must attend upon the necessary and proper works of his own vocation and not deal with other men’s business, which, because Peter did, he is by that answer secretly reproved and justly condemned of curiosity in that behalf. … VIII Rule. We must give place to the sway of the times wherein we live so far forth as may stand with keeping faith and a good conscience. We may not be temporizers and change our religion with the times, but yet we may and must give place to times as we give place to the stream, so that it be done with keeping of true religion and good conscience. This rule was practiced by Paul, who, living among the heathen (Acts 19:10), was constrained to speak as they; and therefore he says that he departed in a ship to Rome whose badge was [of the heathen gods] Castor and Pollux. (Acts 28:11) Again, he was three years in Ephesus, an idolatrous place, where the great goddess Diana was worshipped; yet in all that time he contained himself and spake nothing in particular against Diana, but only in general against false gods, saying that ‘they be no gods that are made with hands,’ [ch. 19] v. 26. Nay, Alexander could not charge him with this, that he had in all that while blasphemed their goddess Diana. Paul therefore was feign to yield to the sway of those times that so he might do some good in Ephesus by his ministry. Whereas, if he had spoken against Diana directly, it had not been possible for him to have done that good by preaching which otherwise he did. Again, in the primitive Church, the apostles for the weakness of the Jews, did yield to the use of circumcision [Acts 16:1-5] and permitted abstinence from blood and that which was strangled, etc. so far forth as it stood with pure religion and good conscience: and if they had not so done they should not have won the Jews to the faith as they did. IX Rule. If we cannot do the good things that we desire in that exquisite manner that we would, we must content ourselves with the mean; and in things which are good, and to be done, it is the safest course to satisfy ourselves in doing the less, least in venturing to do the more, which cannot be, we grow to the extremity, and so fail or offend in our action. It is a good and wise counsel of the Preacher to this purpose, Eccl. 7:16, ‘Be not just overmuch:’ and his meaning may be this; Be not too strict or curious in effecting that which thou intendest, exactly, when thou canst not; but rest contented in this, that thou hast done thine endeavor; and take to the less when the greater cannot be effected. In some countries Popish images erected in Churches do stand undefaced. The good desire of the people is that they may be pulled down, but this cannot be brought to pass. What then are they to do in this case? They must not grow to extremity and pull them down themselves, but they must entreat the lawful magistrate for their removal and pray to God that He may be moved so to do; and in the meantime, rest content with that [which] they have done and wait the magistrates’ pleasure. In the judicial law, by reason of the hardness of the Jews’ hearts, sundry sins could not utterly be taken away, as divorcements, polygamy, usury. Hereupon the Lord makes a law of toleration, without approbation, and did not remove them quite away, for that was not possible in regard of man for the time; but [He] restrained the evil that could not be quite off and abolished otherwise. And herein appeared the great wisdom of God in making a law not to allow of, nor yet utterly to take away, but to moderate the practice of these sins in the Jews, for the hardness of their hearts. In like manner, in this our land there is the practice of usury, a sin that cannot, nor ever shall be rooted out utterly. For this cause the States of this [English] kingdom have out of their wisdom provided a Law for the toleration thereof after a sort, and that upon special cause. For if the magistrate should have enacted a Law utterly to abolish it, it would before this (in likelihood) have grown to great extremity. The same was the practice of the apostles in their times, who yielded to bear with the use of circumcision for a time when they could not otherwise utterly cut it off. [Acts 16:1-5]</p></blockquote>

<blockquote><p>I now come to that which you yourself also acknowledge, that all human inventions are not at once to be condemned. For it was clearly a human invention that we communicate [in the Lord’s Supper] in the morning, rather than after dinner: and it was a human invention that the prices of things that were sold in the primitive Church were laid at the apostles’ feet… I pass over that they who defend these things will be able to put forward some honest and just meaning not alien from the Scripture… But, if by this there is given occasion of error to the weak, let them be advised to regard these things as indifferent; let them be taught by sermons, not to judge the worship of God as placed in these things… Neither do I think that tyranny is instantly brought in if any indifferent thing be appointed to be done in the Church and be constantly performed by many. At this day we so administer the Eucharist in the morning time, that after dinner we will not have the communion in the sacred assembly [In the New Testament the Eucharist was always administered in the evening]. But who will say, that this, which we all do with the like will and consent is tyrannical? To myself truly, as I have now often mentioned, it would be more agreeable that we should only do what Christ did and delivered to his apostles. But, if any indifferent things have been added, I would not now sharply strive on this account; especially when we see that they by whom the light of the Gospel has been greatly promoted in England, and can be yet more promoted, oppose themselves to us. I acknowledge indeed with you that ‘whatsoever is not of faith is sin.’ (Rom. 14:23). But what the apostle wrote to Titus seems, above all things, to promote our having a quiet conscience in our actions: ‘Unto the pure all things are pure;” and to Timothy, “Every creature of God is good.” But it is not necessarily required that we should show express mention in holy Scripture of the particular things which we use: this is enough to know by faith, on the whole— that indifferent things cannot defile those who live with a pure and sincere mind and conscience… but I yet thought that the use of these differences was not in itself or its own nature ungodly or of fatal consequence, provided other things which are prescribed to us by the Word of God remain sound.</p></blockquote>

— Peter Martyr Vermigli, Gorham, Gleanings of a few scattered ears during the period of the Reformation in England (London, 1857), Letter 53, ‘Martyr to Bishop [John] Hooper’, Nov. 4, 1550, pp. 189-90, 92, 94-96">Copy</button><a class="share" href="https://x.com/intent/post?text=%E2%80%9CI+now+come+to+that+which+you+yourself+also+acknowledge%2C+that+all+human+inventions+are+not+at+once+to+be+condemned.+For+it+was+clearly+a+human+invention+that+we+communicate+%5Bin+the+Lord%E2%80%99s+Supper%5D+in+the+morning%2C+rather+than+after+dinner%3A+and+it+was+a+human+invention+that+the+prices+of+things+that+were+sold+in+the+primitive+Church+were+laid+at+the+apostles%E2%80%99+feet%E2%80%A6+I+pass+over+that+they+who+defend+these+things+will+be+able+to+put+forward+some+honest+and+just+meaning+not+alien+from+the+Scripture%E2%80%A6+But%2C+if+by+this+there+is+given+occasion+of+error+to+the+weak%2C+let+them+be+advised+to+regard+these+things+as+indifferent%3B+let+them+be+taught+by+sermons%2C+not+to+judge+the+worship+of+God+as+placed+in+these+things%E2%80%A6+Neither+do+I+think+that+tyranny+is+instantly+brought+in+if+any+indifferent+thing+be+appointed+to+be+done+in+the+Church+and+be+constantly+performed+by+many.+At+this+day+we+so+administer+the+Eucharist+in+the+morning+time%2C+that+after+dinner+we+will+not+have+the+communion+in+the+sacred+assembly+%5BIn+the+New+Testament+the+Eucharist+was+always+administered+in+the+evening%5D.+But+who+will+say%2C+that+this%2C+which+we+all+do+with+the+like+will+and+consent+is+tyrannical%3F+To+myself+truly%2C+as+I+have+now+often+mentioned%2C+it+would+be+more+agreeable+that+we+should+only+do+what+Christ+did+and+delivered+to+his+apostles.+But%2C+if+any+indifferent+things+have+been+added%2C+I+would+not+now+sharply+strive+on+this+account%3B+especially+when+we+see+that+they+by+whom+the+light+of+the+Gospel+has+been+greatly+promoted+in+England%2C+and+can+be+yet+more+promoted%2C+oppose+themselves+to+us.+I+acknowledge+indeed+with+you+that+%E2%80%98whatsoever+is+not+of+faith+is+sin.%E2%80%99+%28Rom.+14%3A23%29.+But+what+the+apostle+wrote+to+Titus+seems%2C+above+all+things%2C+to+promote+our+having+a+quiet+conscience+in+our+actions%3A+%E2%80%98Unto+the+pure+all+things+are+pure%3B%E2%80%9D+and+to+Timothy%2C+%E2%80%9CEvery+creature+of+God+is+good.%E2%80%9D+But+it+is+not+necessarily+required+that+we+should+show+express+mention+in+holy+Scripture+of+the+particular+things+which+we+use%3A+this+is+enough+to+know+by+faith%2C+on+the+whole%E2%80%94+that+indifferent+things+cannot+defile+those+who+live+with+a+pure+and+sincere+mind+and+conscience%E2%80%A6+but+I+yet+thought+that+the+use+of+these+differences+was+not+in+itself+or+its+own+nature+ungodly+or+of+fatal+consequence%2C+provided+other+things+which+are+prescribed+to+us+by+the+Word+of+God+remain+sound.%E2%80%9D%0A%0A%E2%80%94+Peter+Martyr+Vermigli%2C+Gorham%2C+Gleanings+of+a+few+scattered+ears+during+the+period+of+the+Reformation+in+England+%28London%2C+1857%29%2C+Letter+53%2C+%E2%80%98Martyr+to+Bishop+%5BJohn%5D+Hooper%E2%80%99%2C+Nov.+4%2C+1550%2C+pp.+189-90%2C+92%2C+94-96&amp;url=https%3A%2F%2F5solasquotes.github.io%2Fquote%2Fc2d3663182.html&amp;via=5Solas" target="_blank" rel="noopener">Share on X</a><a class="perma" href="../quote/c2d3663182.html">Permalink</a><a class="src" href="https://reformedbooksonline.com/on-impurities-in-worship/#:~:text=I%20now%20come%20to%20that%20which,the%20Word%20of%20God%20remain%20sound&amp;text=I%20now%20come%20to%20that%20which%20you%20yourself&amp;text=us%20by%20the%20Word%20of%20God%20remain%20sound" rel="noopener" target="_blank">Read it online · Reformed Books Online</a></div>

<blockquote><p>24. The religion that keeps possession of the parish churches¹ will be the national religion: Mourn therefore before God that ever any men professing godliness should either labor to get all sound Protestants to desert the parish churches or that any such have been against the restoring of nonconformists by that called a ‘comprehension’, which was but the withdrawing of such impositions as these very men thought sinful, and all this, lest it should diminish the number and strength of the private churches. By this we see what we are doing against ourselves, if God save us not.</p></blockquote>

<main class="wrap"><figure class="quote" id="q-a3ca25f93e" data-kw="">
<blockquote><p>XV… 1. As the holy blessing, whose formula is found in Numbers 6, is an invocation of God, from whom all good things are desired for those who receive the blessing, so too is the Christian salutation a prayer, a form of invocation, through which, by faith and charity, we earnestly pray for the best things for others. 2. It is also a support for fellowship and an indication of charity. 3. And it should be done especially for the Holy Church, devout families, and individual believers.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/amandus-polanus.html">Amandus Polanus</a></span><span class="wk"><span class="lbl">Work:</span> <cite>‘Analytical Theses on Colossians, containing the Exordium of the Epistle’, pt. 1 (on Col. 1:1-11) $3 Download tr. Jonathan Tomes (Basel: Johannes Schroeter, 1601)</cite></span></figcaption>
<div class="meta"><span class="t"><a href="../topics/worship/public-worship.html">Public Worship</a></span></div>

</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-7760eefc11" data-kw="">
<blockquote><p>‘Occasional‘, properly, is that which has a reason, not from the nature of the thing itself, but from such occasional occurrences of providence, as God will not alter, and its that which has no moral nor sacred conveniency with the nature of worship, but has only a conveniency for such a time and place, as Christ’s preaching in a ship, when He is at the sea side, and a multitude are to hear Him, the ship has no agreement with the nature of preaching, more than a house has. Time, place, and persons are clearly such as agreed with that [Last] Supper, as [a supper] first, not as a sacred worship; and therefore [these particulars] were merely occasional, and so not imitable [by us]; and though Christ might have altered them, yet had they been occasional, and they have no sacred conveniency with this Supper, as this Supper; and if Christ had altered these for mere will, upon no reasons that concerns all suppers, they had not been occasional, but positive points of worship, and so had obliged us;</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/samuel-rutherford.html">Samuel Rutherford</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Divine Right of Church Government… (1646)</cite>, p. 193</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/worship/public-worship.html">Public Worship</a></span><span class="t"><a href="../topics/worship/ceremonies-and-things-indifferent.html">Ceremonies and Things Indifferent</a></span></div>

iged%20us" rel="noopener" target="_blank">Read it online · Reformed Books Online</a></div>
</figure><figure class="quote" id="q-082206d981" data-kw="">
<blockquote><p>For it is written in the law of Moses, ‘Thou shalt not muzzle the mouth of the ox that treadeth out the corn.’ Doth God take care for oxen?… Do ye not know that they which minister about holy things live of the things of the temple? and they which wait at the altar are partakers with the altar? Even so hath the Lord ordained that they which preach the gospel should live of the gospel.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/start-here.html">Start Here</a></span><span class="wk"><span class="lbl">Work:</span> <cite>At the Reformation Anabaptists, and later Quakers and many Independants, argued that, as the Levitical statutes are done away with, so no law remains to bind persons to systematic giving to the Christian ministry, and that ministers need not, and should not be paid. However, even before the Law with Moses, being yet a gentile, Abraham paid a tithe to the priest Melchizedek (Gen. 14:18-20; Heb. 7:4-9) and Jacob vowed to give a tenth unto God with all that He prospered him with (Gen. 28:20-22). If there were any question about the moral right of ministers to be paid (and the obligation for Christians to pay them), Paul argues this point from the general equity of Old Testament examples (1 Cor. 9:9:13-14):</cite></span></figcaption>
<div class="meta"><span class="t"><a href="../topics/worship/public-worship.html">Public Worship</a></span></div>

</figure><figure class="quote" id="q-39eac37d0e" data-kw="">
<blockquote><p>That he [Paul] did not propose this his practice [of not receiving money from the Christians in Ephesus in Acts 20:33-35] as a precept or precedent law or rule to all ministers, for he had not power to deprive them of what God had given them (Lev. 27:32; Mt. 10:10; Lk. 11:42; Prov. 3:9,10; Mal. 3:9,10). Tithes were paid by Abraham to Melchisedeck long before the Levitical Law: So that there must be a moral equity in this reciprocal duty both before the Law, under the Law, and after the Law under the Gospel. And though Paul did thus in a juncture and case of necessity because of their present poverty (had they been able, more shame would it have been to them to let him labor) and because false teachers were watching all advantages against him, yet does he himself often assert his own privilege (1 Cor. 9:14; Gal. 6:6) and Christ’s words (he urges) might be collected out of Lk. 6:38 and 16:9, etc. yea, the very terms might be spoken by Christ, for all He spake is not writ (Jn. 20:30).</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/christopher-ness.html">Christopher Ness</a></span><span class="wk"><span class="lbl">Work:</span> <cite>A Complete History &amp; Mystery of the Old &amp; New Testament, Logically Discussed &amp; Theologically Improved (1696), p. 457 Ness was an English, Independent puritan.</cite></span></figcaption>

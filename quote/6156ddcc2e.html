<main class="wrap"><figure class="quote" id="q-6156ddcc2e" data-kw="Author of sin|The Fall|Original Sin" data-pol="">
<blockquote><p>It is true that nature has received a mortal wound, but there is a great difference between a wound inflicted from without, and one inherent in our first condition. It is plain that this wound was inflicted by sin; and, therefore, we have no ground of complaint except against ourselves.</p></blockquote>
<figcaption>— <a href="../authors/john-calvin.html">John Calvin</a>, <cite>Institutes of the Christian Religion</cite>, 2.1.10</figcaption>

</figure><figure class="quote" id="q-360e80a51b" data-kw="Author of sin|The Fall|Permission" data-pol="">
<blockquote><p>To make God the author of sin is such foul blasphemy, that it can never enter any Christian man’s mind without a shudder. It is indeed true that God had made man mutably good, had infallibly foreseen his sin, had foreordained the permission of the sin and given man no doubt sufficient strength to shun sin, but inoperable without His influx; that meanwhile He had inflowed into man’s faculties for natural actions by not inflowing into the moral entity of such actions. … But it is not less true, that God neither is nor could in any way become the author of sin.</p></blockquote>
<figcaption>— <a href="../authors/herman-witsius.html">Herman Witsius</a>, <cite>The Economy of the Covenants</cite>, 1.8.28 (as quoted in Heinrich Heppe, Reformed Dogmatics)</figcaption>

<figcaption>— <a href="../authors/theodore-beza.html">Theodore Beza</a>, <cite>The Christian Faith</cite>, ch. 3, art. 7</figcaption>

</figure><figure class="quote" id="q-2dfa75593b" data-kw="Author of sin|Satan" data-pol="">
<blockquote><p>Of the author of sin, we confess that our Lord God, though He is the creator and sustainer of all creatures, yet He is not the author of sin. It is rather the evil will, both in the Devil and in the godless human, that, when he does not obtain help from the Lord God, turns away from God, as Christ speaks in John 8, “When the Devil speaks a lie, he speaks of his own, for he is a liar and the father of lies” (v. 44).</p></blockquote>
<figcaption>— <a href="../authors/bohemian-brethren.html">Bohemian Brethren</a>, <cite>The Bohemian Confession (1575/1609)</cite>, Art. 6</figcaption>

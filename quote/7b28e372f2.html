<main class="wrap"><figure class="quote" id="q-7b28e372f2" data-kw="">
<blockquote><p>Therefore it is a wickedly devised fable-and they cannot quote a single letter to confirm it-that it is for the Pope alone to interpret the Scriptures or to confirm the interpretation of them. They have assumed the authority of their own selves.</p></blockquote>

</figure><figure class="quote" id="q-7469950696" data-kw="">
<blockquote><p>Now we determine that the supreme right, authority, and judgment of interpreting the scriptures, is lodged with the Holy Ghost and the scripture itself: for these two are not mutually repugnant. We say that the Holy Spirit is the supreme interpreter of scripture, because we must be illuminated by the Holy Spirit to be certainly persuaded of the true sense of scripture; otherwise, although we use all means, we can never attain to that full assurance which resides in the minds of the faithful. … As to external persuasion, we say that scripture itself is its own interpreter.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/william-whitaker.html">William Whitaker</a></span><span class="wk"><span class="lbl">Work:</span> <cite>A Disputation on Holy Scripture</cite>, Controversy 1, Q. 5, ch. 3 (p. 415)</span></figcaption>

</figure><figure class="quote" id="q-c7614cee12" data-kw="">
<blockquote><p>There is a twofold trial of doctrine, private and public. The private trial is that by which every one settles his own faith, when he wholly acquiesces in that doctrine which he knows has come from God. … Public trial refers to the common consent and polity of the Church; for as there is danger lest fanatics should rise up, who may presumptuously boast that they are endued with the Spirit of God, it is a necessary remedy, that the faithful meet together and seek a way by which they may agree in a holy and godly manner.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/john-calvin.html">John Calvin</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Commentaries on the Catholic Epistles</cite>, 1 John 4:1</span></figcaption>

<main class="wrap"><figure class="quote" id="q-23c289b122" data-kw="">
<blockquote><p>2. [Hebrew] ‘Holy’: God’s holiness is the same with his universal justice, or righteousness. And as in other things, so much more in God (by Whom all other things are sanctified or made holy) it imports a separation, as of that which is pure and excellent from that which is either unclean and vile, or at the best common and vulgar. Hence God’s holiness and his glory are near akin; and hallowing God’s name is all one with glorifying it, Eze. 36:20 etc. &amp; 38:23 &amp; 28:22; Lev. 10:3; Isa. 6:3 &amp; Ex. 29:43, “it shall be sanctified by my glory.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/richard-sterne.html">Richard Sterne</a></span><span class="wk"><span class="lbl">Work:</span> <cite>A Brief Commentary upon the 103rd Psalm</cite>, … (London, 1649), pp. 7-8</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/existence-and-knowledge-of-god/essence-and-attributes-in-general.html">Essence and Attributes in General</a></span></div>

<blockquote><p>Objection: God might have willed or not willed the being of the creature, else He were not free. He that may both will and not will is mutable. The sum is: the liberty and immutability of God seem not to consist together. Answer: That immutability and liberty consist together is evident from the nature of God, who wills his own being freely. (see [Francis] Smising, [Tract on the One God?] tract 2, disp. 3, quest. 1, num. 23) If he were subject to co-action and mutability, He were not God. If by reason of our weakness we are less able so distinctly to discern the liberty of God as concerning the creature in the act of God willing, yet it is clearly to be seen in the object willed, viz. the creature: because nothing is more manifest then that there is no necessary connection between the being of God and the being thereof. God had been the same, perfect and blessed for ever, though the creature had never been. … God wills Himself freely, yet necessarily; that which acts necessarily, acts with all its might.</p></blockquote>

<blockquote><p>A dispute arises whether freedom is compatible with necessity (that is, unchangeableness and sempiternity) of this act in which God loves himself. According to Scotus, the act is spontaneous and proceeds not by way of nature but freely, that is, [logically] after intellection-cognition. But if anyone can grasp this, let him do so.</p></blockquote>

</figure><figure class="quote" id="q-e84e73952b" data-kw="">
<blockquote><p>There are various entities which, if they exist, would be candidates for necessary beings: God, propositions, relations, properties, states of affairs, possible worlds, and numbers, among others. Note that the first entity in this list is a concrete entity, while the rest are abstract entities. The main question we will address in this article is: Does God ground the existence of necessarily existing abstract objects?</p></blockquote>

</figure><figure class="quote" id="q-40c1c84181" data-kw="">
<blockquote><p>22. And so we must conceive of God by all these following inadequate conceptions, confessing the impropriety, but having no better: I. The essence of God, who in Scripture is called in two words “An Infinite Spirit,” is necessarily conceived of by these three conceptions: 1. [Greek], 2. Vita [life], 3. Perfectio [perfection]. The two first being the substantial conceptus of a spirit, and the third that which answers to all perfective degrees, properties, and accidents in creatures, and comprehends a multitude of perfective attributes; which I express in the abstract, being loath much to use concretes or adjectives of God. Of these, as the first answers to matter in materials and to the genus and substantia abstracte sumpta in spirits, so the second to the form and difference, when yet in God there is no composition or matter. 22. II. And the formal conceptus ‘Vita’ must itself be conceived of in this threefold inadequate conception: 1. Potentia-Actus [power-act], 2. Intellectus [understanding], 3. Voluntas [will]. I call the first Potentia-Actus to avoid concretes, and to signify that as God has no potentia passiva [passive power], so his potentia activa [active power] is not an idle, ceasing power, but in perpetual perfect act; and that act is a most powerful act: so that neither potentia alone, nor actus alone, but both together, are our best conception of this first principle in the Deity. And I take it for granted that even in man’s soul, the potentia vitalis activa [vital active power], the intellect, and the will, are not, as Thomas thought, accidents, but the formal essence of the soul, as the Scotists and Nominalists better say. And I have largely elsewhere proved this, and therefore stand not here upon it. … 25. IV. The essential immanent acts of God are three:

1. Sibi vivere [to live to Himself], or to be essential active life in Himself;

2. Se intelligere [to understand Himself], to know Himself;

3. Se amare [to love Himself], or to be amor sui [self-love].</p></blockquote>

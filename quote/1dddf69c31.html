<main class="wrap"><figure class="quote" id="q-1dddf69c31" data-kw="">
<blockquote><p>21 Thesis.

… The foundation and the Mediator of the Covenant of Grace is our Lord Jesus Christ; but either as one to be incarnate, to be crucified, and to be raised from the dead; or as one being incarnate, being crucified and being truly raised from the dead, for never any had his sins remitted, but in him alone, who is yesterday, and to day and for ever, Jesus Christ, true God and true man. Therefore although he was God only before his incarnation, notwithstanding hitherto he was no other wise a Mediator, then as God about to take upon him our flesh, and if it to perform the whole mystery of our Redemption; and hence it is, he is called the Lamb of God, slain from before the foundations of the world; and the Fathers were saved by his Grace, even as we our selves are.

22 Thesis.

But although the Son of God, before he manifested himself in the flesh, was on God’s account (to whom future things are present) therefore a Mediator because to come, and therefore truly through him were sins remitted; By his Spirit did men both teach, and were taught; the Church by him was rightly governed; howbeit, the way and manner of his mediation was propounded at the first more darkly; afterwards the force and efficacy of it became yet less: and lastly, it redounded but to a very few.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/john-cameron.html">John Cameron</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Certain Theses, or, Positions Concerning the Three-Fold Covenant of God with Man</cite>, in Samuel Bolton, The True Bounds of Christian Freedom (London, 1656), pp 366-67.</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/the-covenant-of-grace.html">The Covenant of Grace</a></span></div>

</figure><figure class="quote" id="q-b0b9a3104d" data-kw="">
<blockquote><p>For here I observe, that men of learning in other respects have stumbled, who, when explaining the nature of those Sacraments, too incautiously blend things belonging to a quite different covenant. Nothing is here to be brought in which does not belong to the covenant of works, the promises of that covenant, and the duties of man under the same; all which are most distinct from the covenant of grace. Here we are to say nothing of Christ, nothing of justifying faith in him, nothing of our ceasing from our own works as impure, nor any thing of that rest after the miseries of this life. All these belong to another covenant. I do not, however, deny, that the unsearchable wisdom of God did appoint and order these symbols in such a manner that the remembrance of them, after the fall, might be able to instruct man in many things relating to the covenant of grace and its mediator. As that, according to Paul, the first Adam himself was a type of the second; Eve, curiously formed out of Adam’s rib while asleep, was a type of the church, as it were, taken from Christ in virtue of his death; and that the first marriage represented that great mystery which regards Christ and the church. These things, however, were neither known nor thought of in a state of nature; nor to be mentioned in a discourse on the Sacraments of the covenant of works. Having premised these things, let us now inquire into each particular with all the care possible, beginning with Paradise.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/herman-witsius.html">Herman Witsius</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Economy of the Covenants between God and Man</cite>, trans. William Crookshank 2 vol (Edinburgh: T. Tegg &amp; Son, 1837), 1.81</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/the-covenant-of-grace.html">The Covenant of Grace</a></span></div>

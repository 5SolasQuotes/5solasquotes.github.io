<main class="wrap"><figure class="quote" id="q-be8b63b848" data-kw="">
<blockquote><p>Asking whether you should listen to God or to reason is like asking whether you should listen to Beethoven’s Fifth Symphony or to the recording you have of it. It’s like asking whether the earth is lit up by the sun or by sunlight. It’s like asking whether you should obey your commanding officer or his commands. The natural law of reason is a participation in the eternal law of God ([Thomas, Summa] I-I,91,2).</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/peter-kreeft.html">Peter Kreeft</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Practical Theology: Spiritual Direction from St. Thomas Aquinas… (Ignatius Press, 2014), ch. 82, ‘Listening to Reason is Listening to God’</cite></span></figcaption>

</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-2f36d8f083" data-kw="">
<blockquote><p>…to take a simple bodily action as an example, the intellect and will constitute the formal-cum-final cause of the action, of which the firing of the neurons, flexing of the muscles, and so on are the material-cum-efficient causes. That it is a bodily action is due to its matter and the way the bodily parts interact; that it is a bodily action with a certain specific end in view (rather than an involuntary reflex or an unconscious robotic movement) is due to its form and final cause. There are not (as there are for the Cartesian dualist) two substances with events going on in each that are somehow mysteriously correlated. There is one substance and one set of events having both formal and material, and final- and efficient-causal components.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/edward-feser.html">Edward Feser</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Aquinas: a Beginner’s Guide (OneWorld, 2010), ch. 4, ‘Psychology’ | ‘The Soul’, pp. 114-22 ‘Hylemorphic Dualism’, pp. 138-47</cite>, pp. 141-42</span></figcaption>

</figure><figure class="quote" id="q-5f865897be" data-kw="">
<blockquote><p>I have often wished that one of the veteran theologians would have developed a form of logic like the one I have outlined here, though I have only sketched rather than fully worked it out. Even though Andreas Hyperius published Theological Topics in the previous century, he did not use the method that scholars desire. A theological logic should be crafted such that it first demonstrates a method of argumentation in general and then provides rules for forming judgments in individual common places of theological debate. Here, I have broken the first ice. Kindly judge, reader, what I have accomplished, and make this handbook richer through your own efforts.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/johann-h-alsted.html">Johann H. Alsted</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Theological Logic, setting forth the Way one ought to Argue Singular Common Places in Most Holy Theology in General &amp; in Specific $5 Downloard tr. Jonathan Tomes (Frankfurt, 1625)</cite></span></figcaption>

</figure><figure class="quote" id="q-a9258de8cc" data-kw="">
<blockquote><p>1. Concerning metaphysics to be produced by the Reformed, long before me the most learned men from all sides have thought much; and who, if even the least leisure had been theirs from their affair, would here easily have borne off the prize. [William] Twisse pities the fate of Christianity that until now the students of our [reformed] academies have used no other instructors but Jesuits: and they hope to be able to aspire to the arduous progress of things where it lies open by natural light by such masters. Yet who would have been more fit than him to undertake this labor for the sake of the theological youth? Who would have more suitably cleansed that Augean stable of the Jesuits; and thus through natural reason would have paved for us the royal way to the innermost parts of sacred theology? lest the enemies of the Orthodox religion through first philosophy, defiled and polluted by them, should make a straight attack on pure and sacred theology. But that most famous man has departed; and what others would have not undeservedly demanded from him, he in vain desired in others. Must therefore so great a work be put off to the coming of Elijah or of Christ the Savior? Not indeed. Provision must especially be made for those who will one day propose the mysteries of God to the people. Provision must be made as quickly as possible, lest like the Israelites the students be perpetually compelled to borrow arms from the Philistines, the enemies of divine truth. I designate the writings of the Jesuits, which certainly are not traversed safely enough by studious youth, because they prepare the way to Pelagianism, Skepticism, Libertinism and many other things.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/paul-voet.html">Paul Voet</a></span><span class="wk"><span class="lbl">Work:</span> <cite>First Philosophy Reformed tr. by AI by Onku (Utrecht: Johann Waesberg, 1657) Latin</cite>, ch. 1 ch. 2, pt. 1, 2; ch. 1</span></figcaption>

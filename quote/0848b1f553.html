<main class="wrap"><figure class="quote" id="q-0848b1f553" data-kw="">
<blockquote><p>Neither are they [Independents] cleared from the blot of schism by their countenancing the English [Church] assemblies, by their preaching and praying therein: for beside that they do no more in this than Mr. [John] Robinson has taught them; They should remember they teach their scholars that preaching, prayer, psalms, and all things they do in the English congregation, are no acts of Church fellowship: that none of them does import any Church membership, nor any ecclesiastic communion: but are such which without scruple they can dispense to very pagans.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/robert-baillie.html">Robert Baillie</a></span><span class="wk"><span class="lbl">Work:</span> <cite>A Dissuasive from the Errors of the Time</cite>, (1645), p. 105</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/worship/preaching.html">Preaching</a></span></div>

</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-1f03c97ff7" data-kw="">
<blockquote><p>The foregoing opinion [that the knowledge of God is self-evident] arose from their being accustomed from the beginning to hear and call upon the name of God. Now custom, especially if it dates from our childhood, acquires the force of nature, from which it happens that the mind holds those things with which it was imbued from childhood as firmly as though they were self-evident.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/thomas-aquinas.html">Thomas Aquinas</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Summa Contra Gentiles</cite>, bk. 1, ch. 11</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/worship/preaching.html">Preaching</a></span></div>

</figure><figure class="quote" id="q-52542a4692" data-kw="">
<blockquote><p>In preaching they [the Independents] differ from the Brownists [Separatists] and us, and join with the Popish monks; they will not be tied to a text of Scripture for the ground of their discourse, but will be at liberty to run out on whatsoever matter they think most fit and expedient for their hearers.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/robert-baillie.html">Robert Baillie</a></span><span class="wk"><span class="lbl">Work:</span> <cite>A Dissuasive from the Errors of the Time</cite>, (1645), ch. 6, p. 118</span></figcaption>

</figure><figure class="quote" id="q-8252d74455" data-kw="">
<blockquote><p>2. It [the form of sound words] is our godly forefathers bequest which they have conveyed to us their posterity; should not our care be alike to transmit it to ours? Ps. 78:3-4.

3. The martyrs have sealed it with their blood, which we shall prove guilty of through our unfaithfulness, as they are accounted to tread underfoot the Son of God, and to account his blood an unholy thing who desert his truth, and despited the spirit of his grace, Heb. 10:29.

4. It will be the best part of our children’s inheritance: as the Law was Jacob’s, Dt. 33:4. Look to it therefore, that at our last reckoning our forefathers be not ashamed of us, and our posterity at the Resurrection do no not rise up, and, I say not, call us blessed, as Prov. 31:28, but curse us for betraying God’s truth, and our trust, and their and our own souls altogether.

5. And remember from this word [Greek] hold fast, that it is not the catching at what we have not, but only the holding fast what through God’s mercy we yet have; and therefore as Christ says to the Church of Philadelphia, ‘Hold fast what thou hast, let no man take away thy crown.&#x27;</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/anthony-tuckney.html">Anthony Tuckney</a></span><span class="wk"><span class="lbl">Work:</span> <cite>‘The Form of Sound Words’ a sermon on 2 Tim. 1:13 in A Good Day well improved</cite>, … to which is annexed a sermon on 2 Tim. 1:13... (London: 1656), pp. 244-319</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/worship/preaching.html">Preaching</a></span></div>

</figure><figure class="quote" id="q-9462578d12" data-kw="">
<blockquote><p>If Paul in preaching had either substituted human wisdom for the doctrine of the cross, or had so presented that doctrine as to turn it into a philosophy, his preaching would have been powerless. It would lose its divine element and become nothing more than human wisdom. Whatever obscures the cross deprives the gospel of its power.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/charles-hodge.html">Charles Hodge</a></span><span class="wk"><span class="lbl">Work:</span> <cite>An Exposition of the First Epistle to the Corinthians</cite>, on 1:17</span></figcaption>

<main class="wrap"><figure class="quote" id="q-b1f5f5dfda" data-kw="">
<blockquote><p>Indeed, there are almost as many Scriptures that speak of the curse of many children (Gen. 3:16; Eccl. 6:3; Is. 49:19-21; Deut. 28:18-19; Ezek. 5:7-8 [KJV]; Jer. 15:9; Job 27:13-15; Luke 23:29) as there are that speak of the blessings of having many children (Gen. 17:2,20; 22:17; 26:24; 28:3; 35:11; 48:4; Ex. 32:13; Deut. 7:14; Ps. 17:14; 113:9; 127:1-5; 128:1-6; Prov. 17:6; 1 Tim. 5:14). The fall has brought about circumstances that certainly lead to great difficulties – so great that the Scripture no longer speaks of those many children as always being a blessing.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/phillip-kayser.html">Phillip Kayser</a></span><span class="wk"><span class="lbl">Work:</span> <cite>‘Conception Control: Avoiding Antinomianism &amp; Legalism’ (2017)</cite></span></figcaption>
<div class="meta"><span class="t"><a href="../topics/civil-government-and-society/life-birth-and-medical-ethics.html">Life, Birth and Medical Ethics</a></span></div>

</figure><figure class="quote" id="q-c459073e43" data-kw="">
<blockquote><p>If by birth control is meant that married couples should use their common sense in spacing births–that with pure and unselfish motives they should strive not to beget children when their physical, financial and other circumstances do not warrant it–we whole heartedly agree that it is permissible. Indeed it is an offence against God, against their offspring and against themselves, if a couple continue to bring forth children when their circumstances do not justify it. When, however, birth control is practiced for selfish reasons and with false motives, it is to be strongly opposed.</p></blockquote>

<blockquote><p>Others… wondered if they were in sin for not having as many children as was physically possible despite overwhelming health issues… Some have wondered if it was wrong to have sexual relations after menopause, when conception was no longer possible, having heard that ‘wasting seed’ was a sin. Others have had the same pangs of conscience with regard to sexual relations during pregnancy.</p></blockquote>

</figure><figure class="quote" id="q-c420c0a129" data-kw="">
<blockquote><p>Thus of the producing of the body of Christ: His soul was produced as the souls of other men are, that is, it was immediately created by the Holy Ghost and infused into his body: only there is difference amongst divines about the time of the infusing of the soul of Christ: for in the ordinary course, nature proceeds in this manner: First, there is the mass of blood or seed received in the womb, but there is no parts of a body framed at the first: after a certain number of weeks, nature forms that substance into the parts of the body distinctly, but yet it is without life: then is the soul infused, when the body is organical, and so it is quickened and a true man; it is not before a man, but embryo as they call it: Now the question is how Christ could receive that imperfect embryo or the flesh at the first conception, seeing it was not a perfect human nature? To this some answer that our Savior did not follow the ordinary course of taking flesh, as other men do, but in the very instant of the conception, his body was made organical, and had perfect members, and the soul infused at that instant also: and their reason is this: Because the Son of God did not become a person to any thing but the manhood of Christ: Now the manhood must needs have a reasonable soul and body formed, and organical: else we must say that something did subsist in the Person of his divine nature that was not man, as embryo or the lump unformed, and not animated was. Besides, when God made a man by the power of the Holy Ghost, without the seed of man, He made him perfect at one instant, and every way formed in all parts: as when He made Adam and Eve, they were in an instant made perfect in soul and body. Other divines conceive that this opinion cannot be true, because Christ was made in all things like unto us, sin only excepted. Now there could be no sin in that ordinary course of nature, if original sin be removed as it was in Christ. Now in the course of nature: first, that which is material is formed, as it were the house of the soul, and then the soul is infused, not only as the guest of it, but as the form and life of it: and so it must be in Christ. Now for the first reason they answer that the hypostatical union in the person of Christ was so made above nature, as withal, Christ assumed that which belonged to the nature of man according to the course of nature: and so first the seed, and then the body formed, and the soul infused according to nature into that body so as that flesh before the coming in of the soul did subsist in the Word, as it did after the soul was infused: for the Word took our nature, which is not hindered by the absence or presence of the soul: as when Christ was dead, his soul was in his Father’s hands, and his flesh was shut up in the grave, and was not quickened then by the soul, yet the flesh of Christ without the soul and life did subsist in the Word, as well as it did before or after: The other reason is of no force, for God did not make our first parents so out of necessity, but out of the good pleasure of his will, not binding himself to that frame of working for all times afterwards.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/nicholas-byfield.html">Nicholas Byfield</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Rule of Faith, or an Exposition of the Apostles’ Creed… (London, 1626), 3rd Article</cite>, pp. 263-64</span></figcaption>

that+this+opinion+cannot+be+true%2C+because+Christ+was+made+in+all+things+like+unto+us%2C+sin+only+excepted.+Now+there+could+be+no+sin+in+that+ordinary+course+of+nature%2C+if+original+sin+be+removed+as+it+was+in+Christ.+Now+in+the+course+of+nature%3A+first%2C+that+which+is+material+is+formed%2C+as+it+were+the+house+of+the+soul%2C+and+then+the+soul+is+infused%2C+not+only+as+the+guest+of+it%2C+but+as+the+form+and+life+of+it%3A+and+so+it+must+be+in+Christ.+Now+for+the+first+reason+they+answer+that+the+hypostatical+union+in+the+person+of+Christ+was+so+made+above+nature%2C+as+withal%2C+Christ+assumed+that+which+belonged+to+the+nature+of+man+according+to+the+course+of+nature%3A+and+so+first+the+seed%2C+and+then+the+body+formed%2C+and+the+soul+infused+according+to+nature+into+that+body+so+as+that+flesh+before+the+coming+in+of+the+soul+did+subsist+in+the+Word%2C+as+it+did+after+the+soul+was+infused%3A+for+the+Word+took+our+nature%2C+which+is+not+hindered+by+the+absence+or+presence+of+the+soul%3A+as+when+Christ+was+dead%2C+his+soul+was+in+his+Father%E2%80%99s+hands%2C+and+his+flesh+was+shut+up+in+the+grave%2C+and+was+not+quickened+then+by+the+soul%2C+yet+the+flesh+of+Christ+without+the+soul+and+life+did+subsist+in+the+Word%2C+as+well+as+it+did+before+or+after%3A+The+other+reason+is+of+no+force%2C+for+God+did+not+make+our+first+parents+so+out+of+necessity%2C+but+out+of+the+good+pleasure+of+his+will%2C+not+binding+himself+to+that+frame+of+working+for+all+times+afterwards.%E2%80%9D%0A%0A%E2%80%94+Nicholas+Byfield%2C+The+Rule+of+Faith%2C+or+an+Exposition+of+the+Apostles%E2%80%99+Creed%E2%80%A6+%28London%2C+1626%29%2C+3rd+Article%2C+pp.+263-64&amp;url=https%3A%2F%2F5solasquotes.github.io%2Fquote%2Fc420c0a129.html&amp;via=5Solas" target="_blank" rel="noopener">Share on X</a><a class="perma" href="../quote/c420c0a129.html">Permalink</a><a class="src" href="https://reformedbooksonline.com/on-when-the-soul-is-joined-to-the-body-in-the-womb/#:~:text=Thus%20of%20the%20producing%20of%20

<main class="wrap"><figure class="quote" id="q-9d4abd4aee" data-kw="">
<blockquote><p>That Scripture has this perspicuity is plain (1) from Scripture itself, which proclaims its lucidity. &quot;The testimony of Jehovah is sure, enlightening the eyes&quot; (Ps. 19:8). &quot;Thy words are a lamp to my feet&quot; (Ps. 119:105). &quot;A light shining in the darkness&quot; (II Peter 1:19). &quot;The law is a lamp&quot; (Prov. 6:23). … For Scripture is called &quot;clear&quot; (lucidus) not only because it throws light upon the matters that are understood, but also because it is clear in itself and has been made suitable for throwing light on these matters, if used by people with the eyes of faith.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/francis-turretin.html">Francis Turretin</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Institutes of Elenctic Theology</cite>, 2.17.8</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/holy-scripture/perspicuity.html">Perspicuity</a> › <a href="../topics/holy-scripture/perspicuity/clarity.html">Clarity</a></span></div>

</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-33fb3b11d1" data-kw="">
<blockquote><p>We make our prayers in that tongue which all our people, as meet is, may understand, to the end they may (as Paul counselleth us) take common commodity by common prayer, even as all the holy fathers and Catholic bishops, both in the Old and New Testament, did used to pray themselves, and taught the people to pray too, lest, as Augustine saith, &quot;like parrots and ousels we should seem to speak that we understand not.&quot; Neither have we any other mediator and intercessor, by whom we may have access to God the Father, than Jesus Christ, in whose only Name all things are obtained at His Father&#x27;s hand.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/john-jewel.html">John Jewel</a></span><span class="wk"><span class="lbl">Work:</span> <cite>An Apology of the Church of England</cite>, Part 2</span></figcaption>

</figure><figure class="quote" id="q-42768689de" data-kw="">
<blockquote><p>Also the will of God is revealed in that manner in the Scriptures, that although, the things themselves are for the most part hard to be conceived, yet the manner of delivering and explaining them, especially in those things which are necessary, is clear and perspicuous. Hence the Scriptures need not especially in necessaries, any such explication whereby light may be brought to it from something else: but they give light to themselves, which is diligently to be drawn out by men, and to be communicated to others according to their calling.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/william-ames.html">William Ames</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Marrow of Sacred Divinity</cite>, Book I, ch. XXXIV, theses 20–21</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/holy-scripture/perspicuity.html">Perspicuity</a> › <a href="../topics/holy-scripture/perspicuity/clarity.html">Clarity</a></span></div>

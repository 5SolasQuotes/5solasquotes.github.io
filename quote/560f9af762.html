<main class="wrap"><figure class="quote" id="q-560f9af762" data-kw="">
<blockquote><p>Conversion, accepted in this notion, is considered either according to the acts of second regenerating grace as they are on the part of God; or according to new and spiritual acts as they are from us, who being acted upon, act. … The acts and progress of regeneration in the second moment (as indeed it is considered in its effect, on our part—namely, insofar as, the divine impression and touch being passively received by us, we simultaneously actively formally work those acts, Phil. 2:12–13)…</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/gisbertus-voetius.html">Gisbertus Voetius</a></span><span class="wk"><span class="lbl">Work:</span> <cite>XI. ‘Appendix concerning the Second Moment of Conversion’ in Disputation 30, ‘On Regeneration’, pt. 2</cite>, (1639) tr. AI by Roman Prestarri in Select Theological Disputations (1655), vol. 2, pp. 447ff. Latin at Confessionally Reformed Theology</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/regeneration/nature-of-regeneration.html">Nature of Regeneration</a></span></div>
<div class="actions"><button class="copy" data-copy="“Conversion, accepted in this notion, is considered either according to the acts of second regenerating grace as they are on the part of God; or according to new and spiritual acts as they are from us, who being acted upon, act. … The acts and progress of regeneration in the second moment (as indeed it is considered in its effect, on our part—namely, insofar as, the divine impression and touch being passively received by us, we simultaneously actively formally work those acts, Phil. 2:12–13)…”

— Gisbertus Voetius, XI. ‘Appendix concerning the Second Moment of Conversion’ in Disputation 30, ‘On Regeneration’, pt. 2 (1639) tr. AI by Roman Prestarri in Select Theological Disputations (1655), vol. 2, pp. 447ff. Latin at Confessionally Reformed Theology">Copy</button><a class="share" href="https://x.com/intent/post?text=%E2%80%9CConversion%2C+accepted+in+this+notion%2C+is+considered+either+according+to+the+acts+of+second+regenerating+grace+as+they+are+on+the+part+of+God%3B+or+according+to+new+and+spiritual+acts+as+they+are+from+us%2C+who+being+acted+upon%2C+act.+%E2%80%A6+The+acts+and+progress+of+regeneration+in+the+second+moment+%28as+indeed+it+is+considered+in+its+effect%2C+on+our+part%E2%80%94namely%2C+insofar+as%2C+the+divine+impression+and+touch+being+passively+received+by+us%2C+we+simultaneously+actively+formally+work+those+acts%2C+Phil.+2%3A12%E2%80%9313%29%E2%80%A6%E2%80%9D%0A%0A%E2%80%94+Gisbertus+Voetius%2C+XI.+%E2%80%98Appendix+concerning+the+Second+Moment+of+Conversion%E2%80%99+in+Disputation+30%2C+%E2%80%98On+Regeneration%E2%80%99%2C+pt.+2+%281639%29+tr.+AI+by+Roman+Prestarri+in+Select+Theological+Disputations+%281655%29%2C+vol.+2%2C+pp.+447ff.+Latin+at+Confessionally+Reformed+Theology&amp;url=https%3A%2F%2F5solasquotes.github.io%2Fquote%2F560f9af762.html&amp;via=5Solas" target="_blank" rel="noopener">Share on X</a><a class="perma" href="../quote/560f9af762.html">Permalink</a><a class="src" href="https://reformedbooksonline.com/only-the-initial-aspect-of-regeneration-is-by-the-lord-working-alone-man-being-wholly-passive-therein/#:~:text=Conversion%2C%20accepted%20in%20this%20notion%2C%20is,formally%20work%20those%20acts%2C%20Phil.%202%3A12%E2%80%9313&amp;text=Conversion%2C%20accepted%20in%20this%20notion%2C%20is%20considered%20either&amp;text=simultaneously%20actively%20formally%20work%20those%20acts%2C%20Phil.%202%3A12%E2%80%9313" rel="noopener" target="_blank">Read it online · Reformed Books Online</a></div>
</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-03be889c9b" data-kw="">
<blockquote><p>He says not: ‘ye are the children of God because ye are circumcised, because ye have heard the law and have done the works thereof’ (as the Jews do imagine, and the false apostles teach): but ‘by faith in Jesus Christ’ [Gal. 3:26]. The law then makes us not the children of God, and much less men’s traditions. It cannot beget us into a new nature or a new birth: but it sets before us that old birth whereby we were born to the kingdom of the Devil: And so it prepares us to a new birth which is by faith in Jesus Christ and not by the law, as Paul plainly witnesses: ‘For ye are all the children of God by faith, etc.&#x27;</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/martin-luther.html">Martin Luther</a></span><span class="wk"><span class="lbl">Work:</span> <cite>A Commentary</cite>, … upon… Galatians… (London: Vautroullier, 1575), on Gal., 3:26</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/regeneration/nature-of-regeneration.html">Nature of Regeneration</a></span></div>

</figure><figure class="quote" id="q-65ea2b7ba1" data-kw="">
<blockquote><p>III. By a true and a real union (but which is only passive on their part) they are united to Christ when his Spirit first takes possession of them and infuses into them a principle of new life: the beginning of which life can be from nothing else but from union with the Spirit of Christ, who is to the soul, but in a far more excellent manner, in respect of spiritual life, what the soul is to the body in respect of animal and human life. As therefore the union of soul and body is in order of nature prior to the life of man, so also the union of the Spirit of Christ and the soul is prior to the life of a Christian. Further, since faith is an act flowing from the principle of spiritual life, it is plain, that in a sound sense, it may be said, an elect person is truly and really united to Christ before actual faith.

IV. But the mutual union (which, on the part of an elect person, is likewise active and operative), whereby the soul draws near to Christ, joins itself to Him, applies, and in a becoming and proper manner closes with him without any distraction, is made by faith only. And this is followed in order by the other benefits of the covenant of grace, justification, peace, adoption, sealing, perseverance, etc. Which if they be arranged in that manner and order, I know not whether any controversy concerning this affair can remain among the brethren.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/herman-witsius.html">Herman Witsius</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Conciliatory or Irenical Animadversions on the Controversies Agitated in Britain</cite>, (1696; Glasgow, 1807), ch. 6, p. 68</span></figcaption>

</figure><figure class="quote" id="q-4dc6be0a97" data-kw="">
<blockquote><p>4. Whether the regenerate soul here [after death in the consummation of regeneration] conducts itself purely passively, or rather actively concurs with the motion of the Spirit, and that by virtue of the new creature implanted in it as the principium quo [principle by which]? Response: The latter can be affirmed.</p></blockquote>

</figure><figure class="quote" id="q-0b2f84960d" data-kw="seed of God habitual actual">
<blockquote><p>From which results an active power of converting himself (such as the Scriptures mean by the “new heart,” the “seed of God,” “eyes,” “ears,” “mind” and the like denoting something inherent and permanent). But because this first degree would be of no avail without the second, habitual is followed by actual conversion (by which man puts forth acts, God drawing forth from the healed and changed will itself the very act of believing and conversion and the soul itself thus moved freely eliciting its own act). In this sense, God is said to give not only the power of believing, but the belief itself (Phil. 1:29) and “to will and to do” (Phil. 2:13).</p></blockquote>

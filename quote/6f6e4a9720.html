<main class="wrap"><figure class="quote" id="q-6f6e4a9720" data-kw="">
<blockquote><p>‘Behold I stand at the door and knock, etc.’ Here is yet further kindness declared: the Lord stands at the door knocking to be let in. He is the Good Shepherd, He seeks up that which goes astray, He stands knocking at the door of man’s heart to enter and to make it his temple to dwell in. Mark here diverse things: As first that the Lord does not only knock and call at the door of man’s heart, but continues the same: for He stands at the door, and has stood at the door, as the word imports. This is much that He must wait upon us, moving us to receive Him: but the truth is, we never have any mind of Him but when He does stand knocking at the door of our heart. Then further behold how difficult a thing it is for the heart of man to receive Christ and to be turned to God… we are so fast asleep that He may knock and knock again, we regard Him not. But let us take heed, for albeit his kindness is marvellous, yet He will not always offer Himself, nor always be found… Be not therefore too bold with Him: if He have by his Word and by the motions of his Spirit, stood daily knocking at the door of thy heart, showing thy sins and moving thee to repentance, and thou hast made light thereof, take heed lest those knockings of his cease and thine heart be more hardened, so that there is no feeling of any godly sorrow unto repentance. Make much of this knocking, make much of these motions of the Spirit, for many that have had great remorse and beginnings for to repent, are now hardened and boldened in sin. Most miserable are they which despise his knocking and drive Him away. On the contrary part, they be a thousand times blessed which open unto Him, and so receive Him. For mark what He says, ‘If any do hear my voice, and open the door, I will come in to him, and will sup with him, and he with Me.’ What more happy guest can be received in? what good thing can be wanting where He is? If Christ dwell in the heart by faith, if the graces and power of Christ be received in, all evil and misery is driven out, and all goodness and felicity do succeed. Darkness is driven out, the Devil is expelled, sin is destroyed and horror of the dreadful judgment does vanish away. There is light, there is God, there is righteousness, and peace and joy of the Holy Ghost. Full notably does the prophet David set forth this, Ps. 24, when he says: ‘Lift up your heads ye gates, and be ye lift up ye everlasting doors, and the king of glory shall come in. Who is the king of glory? The Lord strong and mighty, the Lord mighty in battle.’ …He sets it forth that we shall receive all good things by Him, in these words, that ‘if any open the door, He will come in and sup with him, etc.’ He brings all the dainties with Him, and compares it unto a supper, for we shall be fed with them: we shall be even filled abundantly with all sweet joys: this supper shall never be ended. … If any man will say then, how are those former speeches to be construed? Thus you must understand: First, that God works upon the hearts of men, not as men work upon blocks or stones, which have no sense nor understanding: for man has understanding, he has a will, he has affections. Then secondly, that free is opposed to bond, and free is opposed to compelled. In respect of the [latter] one, man has free will, in respect of the other he has not. Man naturally loves and delights in evil, his will not forced or compelled, does choose the same: man despises and rejects the Gospel of his own will. In this respect his will is free unto all evil, that is, he wills evil not compelled, but carried thereunto with pleasure. …The mark what Christ says, ‘No man comes unto Me, unless the Father that sent Me draw him, John 6. This drawing is not by force, but God reforms the will and the affections, so that a man joyfully receives Christ and therefore is said to open the doors of his heart.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/george-gifford.html">George Gifford</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Sermons upon the Whole Book of the Revelation (London: Field, 1599), Sermon 10, pp. 109-11 Gifford (1547-1600) was a partially-conforming puritan.</cite></span></figcaption>

<blockquote><p>There is a double interpretation of this text, each of them claiming under very valuable interpreters; some making it a declaration of Christ’s readiness to come in to souls, and to give them a spiritual fellowship and communion with Himself; others interpreting it of Christ’s readiness to come to the Last Judgment, and to take his saints into an eternal joyful fellowship and communion with Himself: hence there is a different interpretation of every sentence in the text. I stand at the door; either, in my gospel dispensations, I stand at the door of sinners’ hearts; or, I am ready to come to judge the world. And knock, by the inward monitions and impressions of my Spirit, or my ministers more externally; or, I am about to knock, that is, I am ready to have the last trump sounded. If any man hear my voice, and open the door; that is, if any man will hearken to the counsels and exhortations of my ministers, and to the monitions of my Spirit, and not resist my Holy Spirit; or, if any man has heard my voice, and opened his heart to Me.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/john-collinges.html">John Collinges</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Matthew Poole’s English Annotations on the Holy Bible. Collinges was one of the men who finished Poole’s Commentary after he died, having gotten to Isa. 58. | Rev. 3:20, “Behold, I stand at the door, and knock: if any man hear my voice, and open the door, I will come in to him, and will sup with him, and he with me.”</cite></span></figcaption>

<blockquote><p>3. Behold I stand at the door of thy heart as one ready to help thy weakness. (2 Thess. 2; Ps. 106) And I knock at the portal of thy conscience as one that would gladly comfort thee, I send forth my heavenly Word to succour thee, lighten thee, raise thee up and save thee. 4. If any man with a glad heart will hear my voice, or the true preaching of my Word (Jn. 10; Mk. 16; Gal. [?]; Lk. [?]) and open the door of his faith, thankfully to receive it, I will come in unto him, enduing with all spiritual delights, as righteousness, peace, love and joy in the Holy Ghost. 5. Yea to him shall I make manifest as to my friend the hidden mysteries of the Scripture (Jn. 15; Lk. 14; Mt. 8; [?] Cor. 2) and secret counsels of my Father. And he shall finally sup with Me and I with him in the eternal habitacle of God, where no heart can esteem what He has prepared for them that love Him.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/john-bale.html">John Bale</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Image of both Churches after the most wonderful and heavenly Revelation of St. John... (d. 1563), ch. 3, p. 50 Bale was an Anglican reformer.</cite></span></figcaption>

<blockquote><p>Why, this is it that Christ offers, no less than Himself, to be thine forever. This is it which He offers when He stands and knocks at thy heart: ‘Open to me; I will be thy God, the Lord thy Redeemer. Though thou hast rebelled against Me, and followed after strange gods, yet now renounce those idols; Open to me, I will be thy God, and that by covenant more durable than heaven and earth.’ ‘Open to me, thy Redeemer will be thy husband. Though thou hast played the harlot with many lovers… I will marry thee to Myself in an everlasting covenant that shall never be broken; I will rejoice over thee as a bridegroom over his bride.’ ‘Open to me, I will make over no less than Myself unto thee. Thou shalt have that which it is the glory and happiness of Heaven to have, myself, communion with Me; I will come and sup with thee, and thou with Me. Art thou poor? Open to Me;’ The commander of Heaven and earth will be thine to enrich thee… Thus Christ offers Himself; and oh how wonderful is it, that He should come to vile worms, and knock, and wait, and entreat that Himself may be accepted!</p></blockquote>

<blockquote><p>’If any man hear my voice, and open the door, I will come in and sup with him.’ Rev. 3:20 Great and precious are the promises which Christ makes to them who hearken to his voice in the gospel-offers, and open their heart to receive Him as offered to them in all his offices: I will come in, and bring all the benefits of my purchase with Me, to entertain and feast that soul, even pardon, peace, light, life, grace and glory. 1. Observe, the duty called for is to hear Christ’s voice, and open the door to Him; that is, to accept and embrace the free gospel-offers, and heartily to acquiesce in the gospel-method of a sinner’s reconciliation and sanctification through the righteousness of our glorious Immanuel, and willingly receive and submit to Him as our Prophet, Priest, and King. What is the preaching of the gospel, but Christ’s charming voice calling lost sinners home to Himself? What is it, but Christ’s following them with invitations and entreaties to come to Him and live? This is Christ’s voice which He would have sinners to hear, Come and live; though they generally refuse to hear the voice of his sovereign offering him his life, as condemned sinners do? Jn. 5:40, “Ye will not come to Me that ye may have life.” Yet behold, after many refusals, He follows his offers with arguments, strong arguments, to prevail with sinners; and after the greatest obstinancy He is loth to break off his treaty with them, Hos. 11:8, “How shall I give thee up, Ephraim? Why will ye die?” What reason can you give for refusing life, or for choosing death? 2. Observe who it is that Christ calls to hear his voice and open their doors to Him: It is not this or that man only, or any particular sort of men, it is any man, every man that sits under the gospel. “If any man will hear my voice and open the door, (says Christ), I will come in.” “If any man will open (be he old man or young man), I will come in.” If the greatest sinner, the most crimson-colored sinner, will open, I will come in. “Any man,” if the swearer will open, if the sabbath-breaker, if the murderer, if the drunkard, if the unclean, if the thief, if the cheat, if the liar, if the mocker, if the prayerless man, if the man that hates God and godliness, will open to Me, “I will come in and sup with him.” O what encouragement does this word, “if any man,” give to ever sinner to flee to Christ! If any man, whoever he be, whatever he has done, if he will welcome Me, receive Me in the gospel-offers, I will come in to him. 3. Observe, Christ requires sinners to open the door, that He may come in to teach them; however unable they be, this is their duty; they must mint, and use all means to do it, and look up to Him for strength. He will have the sinner’s consent, and the soul made willing to receive Him. O then cast open the door, open it wide, receive Christ wholly, receive Him without reserve, open before him the “two-leaved gates,” not the wicker, or one leaf only, but both leaves of the door! Let Christ have the full and free consent of the soul, an abundant entrance into it. There are some resolving to open the door to Christ, others perhaps are beginning to open it: O let them not halt in doing it! With some the door is half open, and there they stop. They are almost, but not altogether Christians. O almost Christian! why do you halt? Why would you lose all the pains you have been at? A little more would cast the door wide open, and make you an altogether Christian. Go then a little further, O sinner! to save your soul. Open to Christ all the powers and faculties of your soul. Open to Him fully here, as you would have Him to open freely to you hereafter. Oh! what mean you to open to Christ by halves? Alas! the half open door will be ready to go to again, and if so, it may never open for the future. Let this be your concern then to go a little further than the almost Christian, and rest not in fair beginnings. 4. Observe, how great the advantage is of opening the door to Christ: Why? I will come into the house, says He; even the friend of sinners, the King of glory will come in, the best guest that ever came into a poor man’s house: How honorable, how profitable, how happy and blessed, must such a visit be! Question: For what end will Christ come in? Answer: He will come in to enlighten the house; for the soul is a dark dungeon while Christ is shut out: He will come in to adorn and enrich the soul with the ornaments and treasures of his grace: He will come in to reign in the soul, and pull down the tyrant that has long oppressed you: As in the text, He will come in and sup with you, and cause you to sup with Him: And, because you have no fitting provision in the house, He will bring it with Him. And O how rare are Christ’s dainties, his hidden manna, the fruits of the tree of life, the grapes of Canaan, the bread that comes down from heaven! How excellent is the water of life! One drop of it would be an everlasting spring in your soul, that would keep you from thirsting after the creature anymore. What a rich feast are the graces of the Spirit quickened to a lively exercise! What a blessed feast is pardon of sin, peace with justice, peace with the law, an interest in Christ’s purchase, intimations of Christ’s love, gospel-promises applied, communion with God, views of eternal life, well-grounded hopes of immortal glory! etc. O how precious and delicate are those gospel-rarities which are set before you on the communion-table, and freely tendered to everyone that opens the door to Christ! Who would not welcome such a Guest, that brings such glorious provision with Him? Had poor sinners spiritual appetites sharpened for Christ’s feast, there would not be so many shut doors against Him. 5. Observe, how solemnly Christ offers these gospel-blessings to you, with a Behold I stand, etc. Christ takes witnesses upon it, witnesses against the refusers: Behold, ye angels, and witness for me how kind and bountiful my offers are to Adam’s rebellious children! Behold, ye ministers, and witness against those who shut Me out! Behold, ye stones and timber of the house, ye elements and communion-tables, bear witness for me and against them! Behold, ye fellow-communicants and hearers, bear witness one against another, that I knocked, I called, I knocked loud, I knocked long, but ye kept your doors bolted against Me. \ It is a melancholy thought for those who are ministers to entertain, that they will one day be brought in as witnesses against those who shut out their Savior; but when called, they must witness against such, though never so dear to them now, that Christ called, but they refused; He made kind and large offers, but they regarded them not. O, then, let every soul set about sweeping and washing all the rooms, and case open all the doors, as wide as they can, to the King of Glory, and receive Him with acclamations and praise! Take the crown off the head of self, and put it on the head of Christ, ascribing all the glory of your salvation to Him, and nothing to free-will, or your own doings.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/john-willison.html">John Willison</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Sacramental Meditations, in The Whole Works of John Willison, 1816, vol. 3 | Advice 3</cite>, pp. 317-19</span></figcaption>

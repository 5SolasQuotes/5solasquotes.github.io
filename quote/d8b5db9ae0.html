<main class="wrap"><figure class="quote" id="q-d8b5db9ae0" data-kw="">
<blockquote><p>Now the question may occupy us how Christ could have brothers, since He was the only Son of Mary, and the Virgin Mary bore no children besides Him. Some say that Joseph had been married before his marriage to Mary, and that the children of this first wife were later called Christ’s brothers… Any children born to Joseph by other wives would have been half brothers of Christ. This is the explanation offered by some. But I am inclined to agree with those who declare that “brothers” really means “cousins” here, for Holy Writ and the Jews always call cousins brothers. Be that as it may, it matters little. It neither adds to nor detracts from faith. It is immaterial whether these men were Christ’s cousins or His brothers begotten by Joseph.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/martin-luther.html">Martin Luther</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Sermons on John, chs. 1-4</cite>, (1539) in LW, 22:214-215</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/rome/mary-and-the-saints.html">Rome: Mary and the Saints</a></span></div>

</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-db97f4427b" data-kw="">
<blockquote><p>VII. We believe also that Mary continued a virgin after her childbirth: For her marriage with Joseph did not consist in the generation of children, but in her education and holy conjunction of life with him.

VIII. Although Christ had no other brothers born after Him, yet He is rightly called Mary’s first begotten Son. In Scripture Christ is called the ‘firstborn’ four manner of ways… 4. In respect of his nativity of the Virgin, Lk. 2:7. Now He is not only called firstborn, whom other brothers do follow; but he also who is born before others, although he be indeed the only begotten, or he whom other brothers do not follow; whence such a one, even before he had any brothers, was consecrated to God, as if he had been the firstborn, Num. 18:16.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/johannes-wolleb.html">Johannes Wollebius</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Abridgment of Christian Divinity</cite>, … (d. 1629; London, 1660), pp. 128-9</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/rome/mary-and-the-saints.html">Rome: Mary and the Saints</a></span></div>

</figure><figure class="quote" id="q-f0b36fd5f9" data-kw="">
<blockquote><p>XX. The subject ‘to which’ it [original sin] happens are all men who are brought forth into the light by the common law of birth. And therefore, Christ alone was immune from this sin; and the Virgin Mary was subject to this evil, because she was propagated from Adam naturally. Then, since Holy Scripture convicts all of sin (1 Kn. 8:46; Eccl. 7:21; Rom. 11:32; Gal. 3:22, etc.), who can press forward and give exceptions to the general propositions of the Word of God, besides the Word itself? But it excepts only Jesus.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/theodore-tronchin.html">Theodore Tronchin</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Theological Theses on Original Sin</cite>, trans. AI (Geneva: de la Planche, 1625), p. 6 Tronchin (1582-1657) was a professor of Hebrew and theology at Geneva.</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/rome/mary-and-the-saints.html">Rome: Mary and the Saints</a></span></div>

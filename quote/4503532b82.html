<blockquote><p>Galatia is surrounded by Paphlagonia, Bithynia, Cappadocia, Phrygia, Lycaonia and some other places. Here we have set before us an example of how great God’s wrath can be against those who despise his Word. For these regions where Paul sowed the seeds of the gospel spurned the heavenly teaching and, secure in their pleasures, were the first to be handed over to the barbarous yoke of the Turks and oppressed by them.

The Turks trace their origins to Central Asia and Tataristan. They began by invading the neighboring countries, and in 1335 their second sultan, Orhan, occupied Galatia. We see how from small beginnings, like border raids, the kingdom of the Turks grew into a huge empire in the space of two hundred years, and how horribly God punished so many powerful kingdoms and flourishing cities by this barbaric power and might. … We should be warned by such examples, repent and obey the gospel, lest our country should also be struck with a similar anathema.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/georg-major.html">Georg Major</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Commentarius in Divi Pauli Epistolam ad Ephesios</cite>, (Wittenberg, 1552). Quoted in Gerald L. Bray, Timothy F. George, Scott M. Manetsch (eds), Reformation Commentary on Scripture X: Galatians, Ephesians (Downers Grove IL: IVP Academic, 2011), p. 5.</span></figcaption>

<blockquote><p>And upon these [previously listed] terms I (and I believe everybody else) will willingly consent to their readmission [under a limited-political toleration]. If any desire further satisfaction in this particular, either from civilians, schoolmen, casuists, canonists, historians, or other divines, he may consult these or such like:

I. Justinian Cod. de Judaeis &amp; Caelicolis, bk. 1, title 12 and the gloss there.

II. Codex Theodosianus de Judaeis, Caelicolis &amp; Samaritanis, bk. 16, title 8, p. 515. III. Jacobi Sirmondi, Appendix Cod. Theodosiani, leg. 6. p. 14 &amp; leg. 4, p. 11. IV. Marquardus de Susanis Tractatu de Judaeis, &amp; aliis Infidelibus inter tractatus Illustrium, tome 14, p. 28. See Bernardum, Hieronimum, Alexandrum Iltum, aliosque Auctores ab eo ibidem citatos. V. Mathaeus Wesenbecius in Comentario in Codicem Justinianeum de Judeis, title 9, p. 14. VI. Decretum Gregorii extra de Judaeis, &amp; Saracenis, bk. 6, title 6.

VII. Clementinar. bk. 5, title 2, de Judaeis.

VIII. Corvini Jus Canonicum, tit. de Judaeis, p. 295. IX. Frederick Balduin, Cases of Conscience, bk. 2, ch. 6, case 5, p. 188. X. Capitulare Caroli Magni, bk. 6, ch. 120 &amp; 308. XI. Henry Alting, Problematum Theolog. pt. 2, problem 21, p. 340. XII. Petrus Crespetius in summa Eccles. Disciplinae Verbo Judaeus, p. 520 etc. fuse.

XIII. Philip Melanchthon, Epistles, bk. 1, epistle 68, p. 75 in edit. Corn. Bee.

XIV. Martin Becanus, in compendio manualis, bk. 5, ch. 17, p. 509. XV. Decretum Concilii Viennensis contra Judaeos apud Hen. Canisium Lect. Antiquarum, tome 1, p. 621 &amp; apud Binium, tome 3, parte altera, p. 1,493. XVI. Filiucius, Cases of Conscience, tract 22, ch. 5, p. 40, col. 2, de Judaismo. XVII. Johannes de Lugo, Of the Power of Divine Faith, disp. 22, sect. 4 and authors cited there. XVIII. Bodinus, Of the Republic, bk. 3-4. XIX. Statutum de Judaismo apud D. Edvardum Cooke, Institit. pt. 2, p. 506 &amp; Commentarium ejus in dictum Statutum. XX. Aquinas, [Summa] pt. 2 of 2, quest. 10-11 where various things on the Jews occur. XXI. Erasmus Brockmannus, Systemate Theologiae, universae, art. 41, ch. 2, quest. 9, tome 2, p. 5,043. XXII. Basilica Lenuclavii, bk. 1, title 1, ch. 9, de Judaeis, p. 2. XXIII. Jerome of the Holy Faith, Book contra the Jews. XXIV. Petrus Galatinus, de Arcanis Catholicae veritatis. XXV. Gilbertus Genebrardus, in Symbolae fidei Judeorum è R. Mos. Aegyptio, etc. XXVI. Vide etiam (si placet) Scriptores (innumeros pene) quos exhibet Georgius Draudius in Bibliothea Classica inter Libros Theologicos, pp. 349-50, etc. Alii alios de facili addant.</p></blockquote>

<blockquote><p>Second, it is asked whether their rites are as it were idolatry. That it seems so:

1. From the fact that it is said in Gal. 5:1, on the words, “Do not again be entangled with the yoke of bondage,” the Gloss says: “This bondage is not lighter than that of idolatry,” because the servitude of the legal observances is likened to idolatry in burden.

2. And again, it is said on the words in Gal. 4:9: “To whom do you wish to serve again?” the Gloss says: “The observance of the Law.” From this it is had that the servitude of the Law, to which they were then devoted, was a sin nearly equal to the servitude of idols, to which before their conversion they had been given over, and is as it were idolatry. And this is explained there by what follows: “The Law after Christ does not differ greatly from ancient idolatry”; it is manifestly shown that the servitude of the Law is now as it were idolatry. On the contrary. a. The Law prescribed believing in God and rendering to Him alone latria [worship]; but idolatry requires the contrary: for it rendered latria to the idols themselves; therefore the servitude of the Law is in no way equal to idolatry in sin. [Solution]: 1-2. To this it must be said that it is not an equal sin for the Jews themselves to observe the rite of the legal observances and to commit idolatry; but it is said to be a sin for those themselves who have assumed the Christian Faith, nearly equal because in both cases there is apostasy, though not equal. As to burden also it had likeness: for in both cases the burden was greatest, and therefore the sacrifices of the Jews were rejected just as those of the gentiles were. But it is said not to differ from idolatry because in both cases there was unbelief. For the Galatians, when they were gentiles, served the superstition of idolatry; but when they drew back from the catholic Faith, which forbade it, they again fell into the servitude of the legal observances, as it were into unbelief. Furthermore, by reason of the performed act, namely sacrifices, there was agreement with idolatry; also by reason of the propensity to sacrifice and of the superstition itself in sacrifices. Yet for the Jews it is not so great a sin now to adhere to the Law as was the sin of those who adhered to idols.</p></blockquote>

— Alexander of Hales, Sum of Universal Theology, (Paris, 1230-1245), pt. 2 of 2, inq. 3, tract 8, sect. 1, quest. 1, title 2 | member 1 | ch. 2, ‘Whether the Rite of the Jews is as it were Idolatry’">Copy</button><a class="share" href="https://x.com/intent/post?text=%E2%80%9CSecond%2C+it+is+asked+whether+their+rites+are+as+it+were+idolatry.+That+it+seems+so%3A+1.+From+the+fact+that+it+is+said+in+Gal.+5%3A1%2C+on+the+words%2C+%E2%80%9CDo+not+again+be+entangled+with+the+yoke+of+bondage%2C%E2%80%9D+the+Gloss+says%3A+%E2%80%9CThis+bondage+is+not+lighter+than+that+of+idolatry%2C%E2%80%9D+because+the+servitude+of+the+legal+observances+is+likened+to+idolatry+in+burden.+2.+And+again%2C+it+is+said+on+the+words+in+Gal.+4%3A9%3A+%E2%80%9CTo+whom+do+you+wish+to+serve+again%3F%E2%80%9D+the+Gloss+says%3A+%E2%80%9CThe+observance+of+the+Law.%E2%80%9D+From+this+it+is+had+that+the+servitude+of+the+Law%2C+to+which+they+were+then+devoted%2C+was+a+sin+nearly+equal+to+the+servitude+of+idols%2C+to+which+before+their+conversion+they+had+been+given+over%2C+and+is+as+it+were+idolatry.+And+this+is+explained+there+by+what+follows%3A+%E2%80%9CThe+Law+after+Christ+does+not+differ+greatly+from+ancient+idolatry%E2%80%9D%3B+it+is+manifestly+shown+that+the+servitude+of+the+Law+is+now+as+it+were+idolatry.+On+the+contrary.+a.+The+Law+prescribed+believing+in+God+and+rendering+to+Him+alone+latria+%5Bworship%5D%3B+but+idolatry+requires+the+contrary%3A+for+it+rendered+latria+to+the+idols+themselves%3B+therefore+the+servitude+of+the+Law+is+in+no+way+equal+to+idolatry+in+sin.+%5BSolution%5D%3A+1-2.+To+this+it+must+be+said+that+it+is+not+an+equal+sin+for+the+Jews+themselves+to+observe+the+rite+of+the+legal+observances+and+to+commit+idolatry%3B+but+it+is+said+to+be+a+sin+for+those+themselves+who+have+assumed+the+Christian+Faith%2C+nearly+equal+because+in+both+cases+there+is+apostasy%2C+though+not+equal.+As+to+burden+also+it+had+likeness%3A+for+in+both+cases+the+burden+was+greatest%2C+and+therefore+the+sacrifi <blockquote><p>On occasion of this question it is asked whether those who come to the Faith from the Jews are to be received quickly or not, and similarly it can be asked concerning pagans. And it seems that not: a. from the fact that it is said in dist. 4, On Consecration, Jews, where it is said that for eight months they should enter within the catechumens of the church this threshold, and, if they are known to come with pure faith, only then should they merit the grace of baptism; the same is found there, Lest, which God forbid, where it is said that abstinence for forty days is enjoined. In both places therefore a great space of time is given for probation and for the work of penance to be carried out. But the contrary seems true:

1. From the fact that it is said, Acts 2:38, where Peter speaks to the Jews, saying: ‘Repent, and let each one of you be baptized.’ Since therefore they were baptized quickly, by his example it does not seem that reception into the Faith, or the sacrament of Faith, which is Baptism, should be deferred so long.

2. Likewise it is found, Acts 10:47-48, where it is said by Peter: ‘Can anyone forbid water, so that those who have received the Holy Spirit should not be baptized? And he commanded them to be baptized in the name of Jesus Christ.’ Acts 8:36-38. From these things therefore it seems that so great a delay is not fitting. [Solution]: To which it must be said that things were otherwise in the primitive Church in part and otherwise in the progress of the Church. For in the primitive Church there was the gift of the Holy Spirit, which was also shown in a visible sign in believers; there were also other signs manifesting faith in them; on account of which it was not necessary to defer the sacrament of Faith. But in the progress of the Church, where there were no such signs showing or powerfully proving faith, and hypocrisy of heart was hidden or could be hidden, a delay of time was necessary, so that there might be a testing of faith and catechesis, through which there would be enabling for baptism. And therefore according to the different times a different term was appointed according to earlier and later, so that it might be clear concerning the enabling for faith and that the ease of returning to vomit might be removed in the judgment of a discerning prelate, according as more or less it shall seem expedient. But such a term is left to the judgment of a discerning prelate, according as more or less it shall seem expedient.</p></blockquote>

<blockquote><p>Now the vanity and falsehood of this religion may be proved thus: —

First, By the newness of it; for it is but of late years begun, and there was never any prophecy that did allow of such a prophet, or of the doctrine of such a one; and therefore he cometh in his own name, and so, consequently, not to be received.

Secondly, He did no miracle at his coming, and therefore no reason that any should believe in him. He spake unto the Saracens of himself, non sum miraculis, aut indiciis ad vos missus: I am not sent unto you with miracles and signs. There was no divine power shewed in all his practice.

Thirdly, It is manifest that Mahomet was a false prophet, because he said, that within three days after his death he should ascend into heaven, which was notoriously false, as before appeareth.

Fourthly, The religion of Mahomet is fleshly, consisting in natural delights and corporal pleasures, which shew that man, and not the divine Spirit of God, is the author thereof; for it is permitted the Saracens by that his law to have four wives (though these be of nigh kin), yea, five, marrying them virgins; and to take besides as many of them which they have bought and taken captives, as their ability will serve to maintain.

The paradise likewise promised to his followers is this, namely, they shall have garments of silk, with all sorts of colours; bracelets of gold and amber; parlours and banqueting-houses upon floods and rivers; vessels of gold and silver, angels serving them, bringing in gold, milk, silver, wine; lodgings furnished, cushions, pillows, and down-beds; most beautiful women to accompany them, maidens and virgins with twinkling eyes; gardens and orchards, with arbours, fountains, springs, and all manner of pleasant fruit; rivers of milk, honey, and spiced wine; all manner of sweet odours, perfumes, and fragrant scents; and, to be short, whatsoever the flesh shall desire to eat.

Thus fleshly people have a fleshly religion, and a fleshly paradise to inhabit. But like prophet, like people, and like religion; for Mahomet himself was such a fleshly fellow, as that though modest ears are loath to hear, yet because the filthiness of this prophet may not be concealed, I must utter it. He committed buggery with an ass; Bonfinius writeth it. Again, he committed adultery with another man’s wife, that upon displeasure was from her husband; and when he perceived the murmur of the people, he feigned that he had received a paper from heaven, wherein it was permitted him so to do, to the end he might beget prophets and worthy men.

Again, Mahomet (as Caelius reporteth), had forty wives; and further, he gloried of himself, that it was given him from above to exceed ten men (saith Cleonard), fifty men (saith Antoninus), in carnal lust and venery. Avicenna, one of Mahomet’s own sect, is himself brought in disliking of this religion, for this reason, because Mahomet (saith he) hath given us a law, which sheweth the perfection of felicity to consist in those things which concern the body; whereas the wise and sages of old had a greater desire to express the felicity of the soul than of the body. As for the bodily felicity, though it were granted them, yet they regarded not, neither esteemed it, in comparison of the felicity which the soul requireth. His paradise and doctrine is such, as there seemeth small difference between epicurism, atheism, and Mahometanism.

Fifth, Mahomet’s law is a tyrannical law; for he made it death to dispute of it; and if any man speak against it (saith he), Proditore occidatur, let him be traitorously put to death. And again, Sine audientia occidatur; let him be put to death without coming to his answer. Qua samctione (saith Sabellicus) palam, fecit nihil sinceri in ea lege esse, &amp;c. By which decree he manifested, that there is nothing sincere in that law, &amp;c. Moreover, he wrote in the Arabian tongue, and taught his followers, that his religion, A gladio ccepit, per gladium tenetur, et in gladio terminatur, began by the sword, is holden by the sword, and is finished or ended in the sword; which sheweth that the sword and arm of flesh is all the author and protector that his religion hath. Again, Mahomet made this law amongst them, saying. He that slayeth his enemy, or is slain of his enemy, let him enter and possess paradise. He spake like a man with a carnal spirit; teaching revenge to the uttermost, and promising paradise to such but not proof of a divine Spirit appeareth in him.

Sixth, As Mahomet’s religion is defended by force of sword and fraud, insomuch as he made it death to call it into question; so likewise did it begin, as by the force of sword, so likewise by notable fraud, and was established through wiles, deceit, subtilty, and lies. For, first, he having the falling-sickness, persuaded his wife and others that it was the power of God, and the presence of the angel Gabriel, that caused him to fall down. Sergius the heretical monk was at hand, and bare false witness to the same (saith Zonaras). He told them that the same dove which he taught to feed at his ear, was sometimes an angel, and sometimes the Holy Ghost. He had three companions all of a confederacy, to devise and face out lies with him. When he perceived that men gave ear to him, he feigned that the angel Gabriel had carried him to Jerusalem, and thence to have lifted him up to heaven, and there to have learned his law.

He made the Saracens believe, that before God made the world, there was written in the throne of God, There is no God, but the God of Mahomet. When he had framed his Alcoran, and bound it up fair, he caused secretly a wild ass to be taken, and the book to be bound about his neck; and as he preached unto the people, upon a sudden he stood amazed, as if some great secrecy was revealed to him from above, and brake out, and told the people. Behold, God hath sent you a law from heaven; go to such a desert, there you shall find an ass, and a book tied about his neck. The people ran in great haste, they found it so as he had said; they take the ass, they bring the book, they honour the prophet.

Touching divorced and separated wives, he told the Saracens he had received a paper from heaven. He used soothsaying and divination, the which at Fessa, a city of Mauritania, unto this day is called Zarragia. He persuaded his followers, that at the end of the world he should be transformed into the form of a mighty ram, full of locks and long fleeces of wool; and that all that held of his law, should be as fleas shrouding themselves in his fleeces, and that he would jump into heaven, and so convey them all thither. These, and such like were his flights, to beguile a foolish, rude, and barbarous country people; the foolery, pride, and vanity of whose religion, I trust every one doth sufficiently perceive.

Seventhly, Mahomet’s religion is no true religion, but a mere device of his own, and of three others his false conspirators; for he hath patched together his Alcoran of the doctrine of heathens, Indians, and Arabians; of superstitious Jews, of Rechabites, of false Christians and heretics, as Nestorius, Sabellians, Manichees, Arians, Cerinthians, Macedonians, Eunomians, and Nicolaites, of illusions and inventions of their own; and lastly, for further credit, he borrowed some out of the Old and New Testament. But God will not thus be served; for he delivered his mind of old unto Israel, and he is not changed, but continueth the same God still. ‘Ye shall not,’ saith God, ‘do every man what seemeth him good in his own eyes. Whatsoever I command you, take heed you do it; thou shalt put nothing thereto, nor take aught therefrom,’ Deut. xii.

Satan being conjured to deliver the truth of the Alcoran of Mahomet, said that therein were comprised twelve thousand lies, and the rest was truth; by all likelihood very little. And therefore conclude, that there is no evidence to prove Mahomet a true prophet; many prove him to be a false prophet, and blasphemous, and presumptuous; and his religion to be a wicked, carnal, absurd, and false religion, proceeding from a proud spirit, and human, subtle, and corrupt invention, and even from the devil, the crafty father of lies, a murderer and man-killer from the beginning. And so much hereof may suffice.</p></blockquote>

The paradise likewise promised to his followers is this, namely, they shall have garments of silk, with all sorts of colours; bracelets of gold and amber; parlours and banqueting-houses upon floods and rivers; vessels of gold and silver, angels serving them, bringing in gold, milk, silver, wine; lodgings furnished, cushions, pillows, and down-beds; most beautiful women to accompany them, maidens and virgins with twinkling eyes; gardens and orchards, with arbours, fountains, springs, and all manner of pleasant fruit; rivers of milk, honey, and spiced wine; all manner of sweet odours, perfumes, and fragrant scents; and, to be short, whatsoever the flesh shall desire to eat.

Thus fleshly people have a fleshly religion, and a fleshly paradise to inhabit. But like prophet, like people, and like religion; for Mahomet himself was such a fleshly fellow, as that though modest ears are loath to hear, yet because the filthiness of this prophet may not be concealed, I must utter it. He committed buggery with an ass; Bonfinius writeth it. Again, he committed adultery with another man’s wife, that upon displeasure was from her husband; and when he perceived the murmur of the people, he feigned that he had received a paper from heaven, wherein it was permitted him so to do, to the end he might beget prophets and worthy men.

Again, Mahomet (as Caelius reporteth), had forty wives; and further, he gloried of himself, that it was given him from above to exceed ten men (saith Cleonard), fifty men (saith Antoninus), in carnal lust and venery. Avicenna, one of Mahomet’s own sect, is himself brought in disliking of this religion, for this reason, because Mahomet (saith he) hath given us a law, which sheweth the perfection of felicity to consist in those things which concern the body; whereas the wise and sages of old had a greater desire to express the felicity of the soul than of the body. As for the bodily felicity, though it were granted them, yet they regarded not, neither esteemed it, in comparison of the felicity which the soul requireth. His paradise and doctrine is such, as there seemeth small difference between epicurism, atheism, and Mahometanism.

Fifth, Mahomet’s law is a tyrannical law; for he made it death to dispute of it; and if any man speak against it (saith he), Proditore occidatur, let him be traitorously put to death. And again, Sine audientia occidatur; let him be put to death without coming to his answer. Qua samctione (saith Sabellicus) palam, fecit nihil sinceri in ea lege esse, &amp;c. By which decree he manifested, that there is nothing sincere in that law, &amp;c. Moreover, he wrote in the Arabian tongue, and taught his followers, that his religion, A gladio ccepit, per gladium tenetur, et in gladio terminatur, began by the sword, is holden by the sword, and is finished or ended in the sword; which sheweth that the sword and arm of flesh is all the author and protector that his religion hath. Again, Mahomet made this law amongst them, saying. He that slayeth his enemy, or is slain of his enemy, let him enter and possess paradise. He spake like a man with a carnal spirit; teaching revenge to the uttermost, and promising paradise to such but not proof of a divine Spirit appeareth in him.

Sixth, As Mahomet’s religion is defended by force of sword and fraud, insomuch as he made it death to call it into question; so likewise did it begin, as by the force of sword, so likewise by notable fraud, and was established through wiles, deceit, subtilty, and lies. For, first, he having the falling-sickness, persuaded his wife and others that it was the power of God, and the presence of the angel Gabriel, that caused him to fall down. Sergius the heretical monk was at hand, and bare false witness to the same (saith Zonaras). He told them that the same dove which he taught to feed at his ear, was sometimes an angel, and sometimes the Holy Ghost. He had three companions all of a confederacy, to devise and face out lies with him. When he perceived that men gave ear to him, he feigned that the angel Gabriel had carried him to Jerusalem, and thence to have lifted him up to heaven, and there to have learned his law.

He made the Saracens believe, that before God made the world, there was written in the throne of God, There is no God, but the God of Mahomet. When he had framed his Alcoran, and bound it up fair, he caused secretly a wild ass to be taken, and the book to be bound about his neck; and as he preached unto the people, upon a sudden he stood amazed, as if some great secrecy was revealed to him from above, and brake out, and told the people. Behold, God hath sent you a law from heaven; go to such a desert, there you shall find an ass, and a book tied about his neck. The people ran in great haste, they found it so as he had said; they take the ass, they bring the book, they honour the prophet.

Touching divorced and separated wives, he told the Saracens he had received a paper from heaven. He used soothsaying and divination, the which at Fessa, a city of Mauritania, unto this day is called Zarragia. He persuaded his followers, that at the end of the world he should be transformed into the form of a mighty ram, full of locks and long fleeces of wool; and that all that held of his law, should be as fleas shrouding themselves in his fleeces, and that he would jump into heaven, and so convey them all thither. These, and such like were his flights, to beguile a foolish, rude, and barbarous country people; the foolery, pride, and vanity of whose religion, I trust every one doth sufficiently perceive.

Seventhly, Mahomet’s religion is no true religion, but a mere device of his own, and of three others his false conspirators; for he hath patched together his Alcoran of the doctrine of heathens, Indians, and Arabians; of superstitious Jews, of Rechabites, of false Christians and heretics, as Nestorius, Sabellians, Manichees, Arians, Cerinthians, Macedonians, Eunomians, and Nicolaites, of illusions and inventions of their own; and lastly, for further credit, he borrowed some out of the Old and New Testament. But God will not thus be served; for he delivered his mind of old unto Israel, and he is not changed, but continueth the same God still. ‘Ye shall not,’ saith God, ‘do every man what seemeth him good in his own eyes. Whatsoever I command you, take heed you do it; thou shalt put nothing thereto, nor take aught therefrom,’ Deut. xii.

Satan being conjured to deliver the truth of the Alcoran of Mahomet, said that therein were comprised twelve thousand lies, and the rest was truth; by all likelihood very little. And therefore conclude, that there is no evidence to prove Mahomet a true prophet; many prove him to be a false prophet, and blasphemous, and presumptuous; and his religion to be a wicked, carnal, absurd, and false religion, proceeding from a proud spirit, and human, subtle, and corrupt invention, and even from the devil, the crafty father of lies, a murderer and man-killer from the beginning. And so much hereof may suffice.”

— Henry Smith, God’s Arrow Against Atheism and Irreligion, (1593) in The Works of Henry Smith; Including Sermons, Treatises, Prayers, and Poems, ed. Thomas Fuller (2 vols, Edinburgh: James Nichol, 1866), 2: 409-12.">Copy</button><a class="share" href="https://x.com/intent/post?text=%E2%80%9CNow+the+vanity+and+falsehood+of+this+religion+may+be+proved+thus%3A+%E2%80%94%0A%0AFirst%2C+By+the+newness+of+it%3B+for+it+is+but+of+late+years+begun%2C+and+there+was+never+any+prophecy+that+did+allow+of+such+a+prophet%2C+or+of+the+doctrine+of+such+a+one%3B+and+therefore+he+cometh+in+his+own+name%2C+and+so%2C+consequently%2C+not+to+be+received.%0A%0ASecondly%2C+He+did+no+miracle+at+his+coming%2C+and+therefore+no+reason+that+any+should+believe+in+him.+He+spake+unto+the+Saracens+of+himself%2C+non+sum+miraculis%2C+aut+indiciis+ad+vos+missus%3A+I+am+not+sent+unto+you+with+miracles+and+signs.+There+was+no+divine+power+shewed+in+all+his+practice.%0A%0AThirdly%2C+It+is+manifest+that+Mahomet+was+a+false+prophet%2C+because+he+said%2C+that+within+three+days+after+his+death+he+should+ascend+into+heaven%2C+which+was+notoriously+false%2C+as+before+appeareth.%0A%0AFourthly%2C+The+religion+of+Mahomet+is+fleshly%2C+consisting+in+natural+delights+and+corporal+pleasures%2C+which+shew+that+man%2C+and+not+the+divine+Spirit+of+God%2C+is+the+author+thereof%3B+for+it+is+permitted+the+Saracens+by+that+his+law+to+have+four+wives+%28though+these+be+of+nigh+kin%29%2C+yea%2C+five%2C+marrying+them+virgins%3B+and+to+take+besides+as+many+of+them+which+they+have+bought+and+taken+captives%2C+as+their+ability+will+serve+to+maintain.%0A%0AThe+paradise+likewise+promised+to+his+followers+is+this%2C+namely%2C+they+shall+have+garments+of+silk%2C+with+all+sorts+of+colours%3B+bracelets+of+gold+and+amber%3B+parlours+and+banqueting-houses+upon+floods+and+rivers%3B+vessels+of+gold+and+silver%2C+angels+serving+them%2C+bringing+in+gold%2C+milk%2C+silver%2C+wine%3B+lodgings+furnished%2C+cushions%2C+pillows%2C+and+down-beds%3B+most+beautiful+women+to+accompany+them%2C+maidens+and+virgins+with+twinkling+eyes%3B+gardens+and+orchards%2C+with+arbours%2C+fountains%2C+springs%2C+and+all+manner+of+pleasant+fruit%3B+rivers+of+milk%2C+honey%2C+and+spiced+wine%3B+all+manner+of+sweet+odours%2C+perfumes%2C+and+fragrant+scents%3B+and%2C+to+be+short%2C+whatsoever+the+flesh+shall+desire+to+eat.%0A%0AThus+fleshly+people+have+a+fleshly+religion%2C+and+a+fleshly+paradise+to+inhabit.+But+like+prophet%2C+like+people%2C+and+like+religion%3B+for+Mahomet+himself+was+such+a+fleshly+fellow%2C+as+that+though+modest+ears+are+loath+to+hear%2C+yet+because+the+filthiness+of+this+prophet+may+not+be+concealed%2C+I+must+utter+it.+He+committed+buggery+with+an+ass%3B+Bonfinius+writeth+it.+Again%2C+he+committed+adultery+with+another+man%E2%80%99s+wife%2C+that+upon+displeasure+was+from+her+husband%3B+and+when+he+perceived+the+murmur+of+the+people%2C+he+feigned+that+he+had+received+a+paper+from+heaven%2C+wherein+it+was+permitted+him+so+to+do%2C+to+the+end+he+might+beget+prophets+and+worthy+men.%0A%0AAgain%2C+Mahomet+%28as+Caelius+reporteth%29%2C+had+forty+wives%3B+and+further%2C+he+gloried+of+himself%2C+that+it+was+given+him+from+above+to+exceed+ten+men+%28saith+Cleonard%29%2C+fifty+men+%28saith+Antoninus%29%2C+in+carnal+lust+and+venery.+Avicenna%2C+one+of+Mahomet%E2%80%99s+own+sect%2C+is+himself+brought+in+disliking+of+this+religion%2C+for+this+reason%2C+because+Mahomet+%28saith+he%29+hath+given+us+a+law%2C+which+sheweth+the+perfection+of+felicity+to+consist+in+those+things+which+concern+the+body%3B+whereas+the+wise+and+sages+of+old+had+a+greater+desire+to+express+the+felicity+of+the+soul+than+of+the+body.+As+for+the+bodily+felicity%2C+though+it+were+granted+them%2C+yet+they+regarded+not%2C+neither+esteemed+it%2C+in+comparison+of+the+felicity+which+the+soul+requireth.+His+paradise+and+doctrine+is+such%2C+as+there+seemeth+small+difference+between+epicurism%2C+atheism%2C+and+Mahometanism.%0A%0AFifth%2C+Mahomet%E2%80%99s+law+is+a+tyrannical+law%3B+for+he+made+it+death+to+dispute+of+it%3B+and+if+any+man+speak+against+it+%28saith+he%29%2C+Proditore+occidatur%2C+let+him+be+traitorously+put+to+death.+And+again%2C+Sine+audientia+occidatur%3B+let+him+be+put+to+death+without+coming+to+his+answer.+Qua+samctione+%28saith+Sabellicus%29+palam%2C+fecit+nihil+sinceri+in+ea+lege+esse%2C+%26c.+By+which+decree+he+manifested%2C+that+there+is+nothing+sincere+in+that+law%2C+%26c.+Moreover%2C+he+wrote+in+the+Arabian+tongue%2C+and+taught+his+followers%2C+that+his+religion%2C+A+gladio+ccepit%2C+per+gladium+tenetur%2C+et+in+gladio+terminatur%2C+began+by+the+sword%2C+is+holden+by+the+sword%2C+and+is+finished+or+ended+in+the+sword%3B+which+sheweth+that+the+sword+and+arm+of+flesh+is+all+the+author+and+protector+that+his+religion+hath.+Again%2C+Mahomet+made+this+law+amongst+them%2C+saying.+He+that+slayeth+his+enemy%2C+or+is+slain+of+his+enemy%2C+let+him+enter+and+possess+paradise.+He+spake+like+a+man+with+a+carnal+spirit%3B+teaching+revenge+to+the+uttermost%2C+and+promising+paradise+to+such+but+not+proof+of+a+divine+Spirit+appeareth+in+him.%0A%0ASixth%2C+As+Mahomet%E2%80%99s+religion+is+defended+by+force+of+sword+and+fraud%2C+insomuch+as+he+made+it+death+to+call+it+into+question%3B+so+likewise+did+it+begin%2C+as+by+the+force+of+sword%2C+so+likewise+by+notable+fraud%2C+and+was+established+through+wiles%2C+deceit%2C+subtilty%2C+and+lies.+For%2C+first%2C+he+having+the+falling-sickness%2C+persuaded+his+wife+and+others+that+it+was+the+power+of+God%2C+and+the+presence+of+the+angel+Gabriel%2C+that+caused+him+to+fall+down.+Sergius+the+heretical+monk+was+at+hand%2C+and+bare+false+witness+to+the+same+%28saith+Zonaras%29.+He+told+them+that+the+same+dove+which+he+taught+to+feed+at+his+ear%2C+was+sometimes+an+angel%2C+and+sometimes+the+Holy+Ghost.+He+had+three+companions+all+of+a+confederacy%2C+to+devise+and+face+out+lies+with+him.+When+he+perceived+that+men+gave+ear+to+him%2C+he+feigned+that+the+angel+Gabriel+had+carried+him+to+Jerusalem%2C+and+thence+to+have+lifted+him+up+to+heaven%2C+and+there+to+have+learned+his+law.%0A%0AHe+made+the+Saracens+believe%2C+that+before+God+made+the+world%2C+there+was+written+in+the+throne+of+God%2C+There+is+no+God%2C+but+the+God+of+Mahomet.+When+he+had+framed+his+Alcoran%2C+and+bound+it+up+fair%2C+he+caused+secretly+a+wild+ass+to+be+taken%2C+and+the+book+to+be+bound+about+his+neck%3B+and+as+he+preached+unto+the+people%2C+upon+a+sudden+he+stood+amazed%2C+as+if+some+great+secrecy+was+revealed+to+him+from+above%2C+and+brake+out%2C+and+told+the+people.+Behold%2C+God+hath+sent+you+a+law+from+heaven%3B+go+to+such+a+desert%2C+there+you+shall+find+an+ass%2C+and+a+book+tied+about+his+neck.+The+people+ran+in+great+haste%2C+they+found+it+so+as+he+had+said%3B+they+take+the+ass%2C+they+bring+the+book%2C+they+honour+the+prophet.%0A%0ATouching+divorced+and+separated+wives%2C+he+told+the+Saracens+he+had+received+a+paper+from+heaven.+He+used+soothsaying+and+divination%2C+the+which+at+Fessa%2C+a+city+of+Mauritania%2C+unto+this+day+is+called+Zarragia.+He+persuaded+his+followers%2C+that+at+the+end+of+the+world+he+should+be+transformed+into+the+form+of+a+mighty+ram%2C+full+of+locks+and+long+fleeces+of+wool%3B+and+that+all+that+held+of+his+law%2C+should+be+as+fleas+shrouding+themselves+in+his+fleeces%2C+and+that+he+would+jump+into+heaven%2C+and+so+convey+them+all+thither.+These%2C+and+such+like+were+his+flights%2C+to+beguile+a+foolish%2C+rude%2C+and+barbarous+country+people%3B+the+foolery%2C+pride%2C+and+vanity+of+whose+religion%2C+I+trust+every+one+doth+sufficiently+perceive.%0A%0ASeventhly%2C+Mahomet%E2%80%99s+religion+is+no+true+religion%2C+but+a+mere+device+of+his+own%2C+and+of+three+others+his+false+conspirators%3B+for+he+hath+patched+together+his+Alcoran+of+the+doctrine+of+heathens%2C+Indians%2C+and+Arabians%3B+of+superstitious+Jews%2C+of+Rechabites%2C+of+false+Christians+and+heretics%2C+as+Nestorius%2C+Sabellians%2C+Manichees%2C+Arians%2C+Cerinthians%2C+Macedonians%2C+Eunomians%2C+and+Nicolaites%2C+of+illusions+and+inventions+of+their+own%3B+and+lastly%2C+for+further+credit%2C+he+borrowed+some+out+of+the+Old+and+New+Testament.+But+God+will+not+thus+be+served%3B+for+he+delivered+his+mind+of+old+unto+Israel%2C+and+he+is+not+changed%2C+but+continueth+the+same+God+still.+%E2%80%98Ye+shall+not%2C%E2%80%99+saith+God%2C+%E2%80%98do+every+man+what+seemeth+him+good+in+his+own+eyes.+Whatsoever+I+command+you%2C+take+heed+you+do+it%3B+thou+shalt+put+nothing+thereto%2C+nor+take+aught+therefrom%2C%E2%80%99+Deut.+xii.%0A%0ASatan+being+conjured+to+deliver+the+truth+of+the+Alcoran+of+Mahomet%2C+said+that+therein+were+comprised+twelve+thousand+lies%2C+and+the+rest+was+truth%3B+by+all+likelihood+very+little.+And+therefore+conclude%2C+that+there+is+no+evidence+to+prove+Mahomet+a+true+prophet%3B+many+prove+him+to+be+a+false+prophet%2C+and+blasphemous%2C+and+presumptuous%3B+and+his+religion+to+be+a+wicked%2C+carnal%2C+absurd%2C+and+false+religion%2C+proceeding+from+a+proud+spirit%2C+and+human%2C+subtle%2C+and+corrupt+invention%2C+and+even+from+the+devil%2C+the+crafty+father+of+lies%2C+a+murderer+and+man-killer+from+the+beginning.+And+so+much+hereof+may+suffice.%E2%80%9D%0A%0A%E2%80%94+Henry+Smith%2C+God%E2%80%99s+Arrow+Against+Atheism+and+Irreligion%2C+%281593%29+in+The+Works+of+Henry+Smith%3B+Including+Sermons%2C+Treatises%2C+Prayers%2C+and+Poems%2C+ed.+Thomas+Fuller+%282+vols%2C+Edinburgh%3A+James+Nichol%2C+1866%29%2C+2%3A+409-12.&amp;url=https%3A%2F%2F5solasquotes.github.io%2Fquote%2F72e665b024.html&amp;via=5Solas" target="_blank" rel="noopener">Share on X</a><a class="perma" href="../quote/72e665b024.html">Permalink</a><a class="src" href="https://reformedcovenanter.wordpress.com/2020/03/28/henry-smith-seven-reasons-why-islam-is-a-false-religion/" rel="noopener" target="_blank">Read it online · Reformed Covenanter</a></div>

<main class="wrap"><figure class="quote" id="q-1b9191431a" data-kw="">
<blockquote><p>The Galatians are removed not only from the doctrine of Paul, but also from the grace of God. And the reason is because they joined the works of the law with Christ and His grace in the cause of their justification and salvation. Here it must be observed that they which make a union of grace and works in the cause of justification are separated from the grace of God. Grace admits no partner or fellow. Grace must be freely given every way, or it is no way grace. Hence it follows that the present Church of Rome is departed from the grace of God, because it makes a concurrence of grace and works in the justification of a sinner before God. And we may not make any reconciliation with that church in religion, because it is become an enemy of the grace of God.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/william-perkins.html">William Perkins</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Works of William Perkins: vol. 2: Commentary on Galatians</cite>, ed. Paul M. Smalley, Joel R. Beeke, and Derek W. H. Thomas, vol. 2 (Grand Rapids, MI: Reformation Heritage Books, 2015), 29–30.</span></figcaption>

</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-a8c10b0015" data-kw="">
<blockquote><p>By so doing we by no means establish as the formal cause of our justification that essential righteousness of Christ, which is itself His deity, or the supreme purity and holiness of His humanity, or His sufferings absolutely considered, which ceased together with His earthly life. But we say that the merit of His sufferings (παθημάτων) is the material cause of our justification, which is substituted in place of our guilt, inborn corruption, and all our sins that flow forth from that sewer.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/theodore-beza.html">Theodore Beza</a></span><span class="wk"><span class="lbl">Work:</span> <cite>A Defense of Justification Through The Righteousness of Christ Alone Freely Imputed, Obtained by Living Faith in R. Scott Clark and Casey Carmichael, eds., Justification By Faith Alone: Selected Writings From Theodore Beza, Amandus Polanus, and Francis Turretin</cite>, reply to the Anonymous Man’s Third Argument</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/union-with-christ/osiander.html">Osiander</a> › <a href="../topics/union-with-christ/osiander/essential-righteousness.html">Essential righteousness</a></span><span class="t"><a href="../topics/justification/formal-cause.html">Formal Cause: Imputation</a></span></div>

— Theodore Beza, A Defense of Justification through the Righteousness of Christ Alone, reply to the Anonymous Man’s Third Argument">Copy</button><a class="share" href="https://x.com/intent/post?text=%E2%80%9CBy+so+doing+we+by+no+means+establish+as+the+formal+cause+of+our+justification+that+essential+righteousness+of+Christ%2C+which+is+itself+His+deity%2C+or+the+supreme+purity+and+holiness+of+His+humanity%2C+or+His+sufferings+absolutely+considered%2C+which+ceased+together+with+His+earthly+life.+But+we+say+that+the+merit+of+His+sufferings+%28%CF%80%CE%B1%CE%B8%CE%B7%CE%BC%CE%AC%CF%84%CF%89%CE%BD%29+is+the+material+cause+of+our+justification%2C+which+is+substituted+in+place+of+our+guilt%2C+inborn+corruption%2C+and+all+our+sins+that+flow+forth+from+that+sewer.%E2%80%9D%0A%0A%E2%80%94+Theodore+Beza%2C+A+Defense+of+Justification+through+the+Righteousness+of+Christ+Alone%2C+reply+to+the+Anonymous+Man%E2%80%99s+Third+Argument&amp;url=https%3A%2F%2F5solasquotes.github.io%2Fquote%2Fa8c10b0015.html&amp;via=5Solas" target="_blank" rel="noopener">Share on X</a><a class="perma" href="../quote/a8c10b0015.html">Permalink</a><span class="src none">No free online copy linked</span></div>
</figure><figure class="quote" id="q-f8cccbc26c" data-kw="">
<blockquote><p>In this way we can admit not only that there is a partial righteousness in works (as our adversaries maintain), but that they are approved by God as if they were absolutely perfect. If we remember on what foundation this is rested, every difficulty will be solved. The first time when a work begins to be acceptable is when it is received with pardon. And whence pardon, but just because God looks upon us and all that belongs to us as in Christ? Therefore, as we ourselves when ingrafted into Christ appear righteous before God, because our iniquities are covered with his innocence; so our works are, and are deemed righteous, because every thing otherwise defective in them being buried by the purity of Christ is not imputed. Thus we may justly say, that not only ourselves, but our works also, are justified by faith alone. Now, if that righteousness of works, whatever it be, depends on faith and free justification, and is produced by it, it ought to be included under it and, so to speak, made subordinate to it, as the effect to its cause; so far is it from being entitled to be set up to impair or destroy the doctrine of justification. Thus Paul, to prove that our blessedness depends not on our works, but on the mercy of God, makes special use of the words of David, “Blessed is he whose transgression is forgiven, whose sin is covered;” “Blessed is the man unto whom the Lord imputeth not iniquity.” Should any one here obtrude the numberless passages in which blessedness seems to be attributed to works, as, “Blessed is the man that feareth the Lord;” “He that has mercy on the poor, happy is he;” “Blessed is the man that walketh not in the counsel of the ungodly,” and “that endureth temptation;” “Blessed are they that keep judgment,” that are “pure in heart,” “meek,” “merciful,”, they cannot make out that Paul’s doctrine is not true. For seeing that the qualities thus extolled never all so exist in man as to obtain for him the approbation of God, it follows, that man is always miserable until he is exempted from misery by the pardon of his sins. Since, then, all the kinds of blessedness extolled in the Scripture are vain so that man derives no benefit from them until he obtains blessedness by the forgiveness of sins, a forgiveness which makes way for them, it follows that this is not only the chief and highest, but the only blessedness, unless you are prepared to maintain that it is impaired by things which owe their entire existence to it. There is much less to trouble us in the name of righteous which is usually given to believers. I admit that they are so called from the holiness of their lives, but as they rather exert themselves in the study of righteousness than fulfill righteousness itself, any degree of it which they possess must yield to justification by faith, to which it is owing that it is what it is.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/john-calvin.html">John Calvin</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Institutes of the Christian Religion</cite>, 3.17.10</span></figcaption>

</figure><figure class="quote" id="q-a63c435ec8" data-kw="">

</figure><figure class="quote" id="q-eb39e57352" data-kw="">
<blockquote><p>But (says [John] Cameron) thus ‘to believe’ will be ‘to will’, and so faith must be confounded with love. Answer: The love of complacency is one thing, and the love of benevolence another. Love of complacency is required in faith to its object. Hence [Martin] Chemnitius on Melanchthon’s Common Places, Of Justification, p. 660, says, ‘Faith is such a knowledge in the mind to which follows assent in the will and a motion of the heart apprehending and applying to itself with desire and affiance that object which is manifested to be good, so that it rests in it.</p></blockquote>

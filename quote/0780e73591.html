<blockquote><p>…[the] example of the loaded passenger airplane that gets shot down by an F/A-18 because it was being used by terrorists as a guided missile against civilian targets. Both the pilot and the Joint Chiefs had, as an intended end, ‘to protect Americans on the ground from the attack’ and, as intended means, ‘to remove the plane from the sky by blowing it up,’ because that was the only means at hand.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/pau-agulles-simo.html">Pau Agulles Simo</a></span><span class="wk"><span class="lbl">Work:</span> <cite>‘Cooperation with Evil, the Theory of Action &amp; the Contraception Mandate’ Persona y Bioetica (Enero-Junio, 2018), vol. 22, num. 1, pp. 76-89 | Amongst some other helpful (and also not helpful) distinctions and illustrations, Simo gives this interesting ethical dilemma. What would you do if you were the one calling the shots?:</cite>, pp. 80-81</span></figcaption>

</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-5f89c9779a" data-kw="">
<blockquote><p>The two Demurrers…: ‘Except[ion] against this our present obedience, because the present power is yet new: neither is there a total cessation of all hopes of recovery.’ Philosophers hold that the definition of a man belongs to an infant as well as to one of many years, because after the organization of the parts, he is informed with the same principle of life and reason as a grown man is; and having the same form, is the same thing. Even so the present power has possessed all the parts of this kingdom, gives them life in the administration of public justice and protection, which are the soul of a State, and the power which preceded this, what did it infuse more vital than this? And now that that is taken away, if this other did not presently enter into its place, the commonwealth were dead and each man were left in his naturals to subsist of himself and to cast how he could in such a state of war, defend himself from all the rest of the world, every man in this State having an equal right to everything.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/anthony-ascham.html">Anthony Ascham</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Bounds &amp; Bonds of Public Obedience, or a Vindication of our Lawful Submission to the Present Government… (London, 1649) This was mor than likely written by Ascham despite it being attributed to Rouse.</cite>, p. 27</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/civil-government-and-society/resistance-to-tyranny-and-lawful-authority.html">Resistance to Tyranny and Lawful Authority</a></span></div>

</figure><figure class="quote" id="q-643bfc56c0" data-kw="">
<blockquote><p>A people may be, by God’s special commandment, subject to a conquering Nebuchadnezzar and a Caesar, as to their king, as was Judah commanded by the prophet Jeremiah to submit unto the yoke of the king of Babylon, and to pray for him, and the people of the Jews were to give to Caesar the things of Caesar; and yet both those were unjust conquerors: for those tyrants had no command of God to oppress and reign over the Lord’s people, yet were they to obey those kings; so the passive subjection was just and commanded of God, and the active [subjection], unjust and tyrannous, and forbidden of God.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/samuel-rutherford.html">Samuel Rutherford</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Lex Rex... (1644; Edinburgh: Ogle, 1843)</cite>, p. 47</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/civil-government-and-society/resistance-to-tyranny-and-lawful-authority.html">Resistance to Tyranny and Lawful Authority</a></span></div>

— Samuel Rutherford, Lex Rex... (1644; Edinburgh: Ogle, 1843), p. 47">Copy</button><a class="share" href="https://x.com/intent/post?text=%E2%80%9CA+people+may+be%2C+by+God%E2%80%99s+special+commandment%2C+subject+to+a+conquering+Nebuchadnezzar+and+a+Caesar%2C+as+to+their+king%2C+as+was+Judah+commanded+by+the+prophet+Jeremiah+to+submit+unto+the+yoke+of+the+king+of+Babylon%2C+and+to+pray+for+him%2C+and+the+people+of+the+Jews+were+to+give+to+Caesar+the+things+of+Caesar%3B+and+yet+both+those+were+unjust+conquerors%3A+for+those+tyrants+had+no+command+of+God+to+oppress+and+reign+over+the+Lord%E2%80%99s+people%2C+yet+were+they+to+obey+those+kings%3B+so+the+passive+subjection+was+just+and+commanded+of+God%2C+and+the+active+%5Bsubjection%5D%2C+unjust+and+tyrannous%2C+and+forbidden+of+God.%E2%80%9D%0A%0A%E2%80%94+Samuel+Rutherford%2C+Lex+Rex...+%281644%3B+Edinburgh%3A+Ogle%2C+1843%29%2C+p.+47&amp;url=https%3A%2F%2F5solasquotes.github.io%2Fquote%2F643bfc56c0.html&amp;via=5Solas" target="_blank" rel="noopener">Share on X</a><a class="perma" href="../quote/643bfc56c0.html">Permalink</a><a class="src" href="https://reformedbooksonline.com/on-passive-obedience/#:~:text=A%20people%20may%20be%2C%20by%20God%E2%80%99s,and%20tyrannous%2C%20and%20forbidden%20of%20God." rel="noopener" target="_blank">Read it online · Reformed Books Online</a></div>
</figure><figure class="quote" id="q-cac2629ee6" data-kw="">
<blockquote><p>…and came with his family to Broad Oak… and did not preach for a great while… expecting that God would yet open a door of return to former public liberty, which he much desired and prayed for; and in hopes of that, was backward to fall into the stated exercise of his ministry otherwise, as were all the sober nonconformists generally in those parts, but it was his grief and burden that he had not an opportunity of doing more for God. He has scarce one talent of opportunity, but that one he was very diligent and faithful in the improvement of… ‘I own myself a minister of Christ, yet do nothing as a minister. What will excuse me? Is it enough for me to say, ‘Behold I stand in the market-place, and no man has hired me?’ And he comforts himself with this appeal; ‘Lord, Thou knowest what will I have to thy work, public or private, if I had a call and opportunity. And shall this willing mind be accepted?’… In these circumstances of silence and restraint… It is obvious, he writes, to observe at four several times, and upon four several occasions, ministers have been silenced and turned out of their places; and yet still, after a time, more or less restored again. 1. In Queen Mary’s days, because they would not close with Popery at the return of it. But that interdict lasted under five years, being taken off upon Queen Elizabeth’s coming to the throne. 2. In Queen Elizabeth’s, King James’s and King Charles’s days, because they could not conform to the hierarchy and ceremonies; and this interdict lasted long, even till the long Parliament, A.D. 1640; but it was then taken off. 3. Under the long Parliament many ministers were sequestered and silenced for malignancy and not covenanting [under the Solemn League and Covenant, 1643; Philip Henry did not hold to the SL&amp;C]. 4. Many others, after the King’s death [1649], for not engaging to be true to the Commonwealth [under Oliver Cromwell, 1649-1658], as then established; both which restraints, though much remitted before, yet quite ceased at the coming in of the King [Charles II], A.D. 1660. And now more ministers are silenced, and with more severity than ever, by the Act of August 24 [1662]. And who among us can tell for how long? This only I know, ‘He who hath delivered, doth deliver.’ Script. March 31, 1663.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/reformed-material.html">Reformed Material</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Matthew Henry narrating of his father Philip Henry | On the English Act of Uniformity and the Great Ejection of ministers, 1662, in ed. J.B. Williams, The Lives of Philip &amp; Matthew Henry, Two Volumes in One (Banner of Truth, 1974)</cite>, pp. 101-5</span></figcaption>

<blockquote><p>15. When the [English] Parliament’s armies were worsted and weakened by the King [Charles I], and they found themselves in danger of being overcome, they entreated help from the Scots, who taking the advantage of their straits, brought in the [Solemn League and] Covenant as the condition of their help; which the Parliament rather accepted [in 1643] than they would lose them, which at first was imposed on none by force. But (to pass by all other considerations) was judged by many wise men, to be an occasion of division, as making the opposition to prelacy to be the terms of the kingdom’s unity and concord, when they might know that the king and a great, if not the greatest part of the kingdom, were of the contrary mind; and so it was thought to be (as the Papal terms of unity) a means of unavoidable division: But others thought that because it tied them to no endeavors, but in their places and callings, they might take it. 16. The Assembly of divines at Westminster were men that had lived in conformity, except about eight or nine of them and the Scots: But being such as thought conformity lawful in case of deprivation, but the things imposed to be a snare, which should be removed if it could be lawfully done, they also received the Covenant, but were divided about the sense of the word ‘prelacy,’ many professing their judgment to be for moderate episcopacy; whereupon the describing additions ‘Archbishops, bishops, deans, archdeacons’ were added. And upon such a profession that it disclaimed not all episcopacy, Mr. [Thomas] Coleman is said to have given the Covenant to the House of Lord’s… 17. This Covenant and vow was taken by the Parliament and by their garrisons and soldiers that would voluntarily take it, as a test whom they would trust; the rest being had in suspension: And after the wars, by such as were ordained ministers and by the king’s adherents when they made their compositions: so far was it afterward imposed. But many ministers and gentlemen refused it, and so did Cromwell ‘s soldiers, and in many counties few did take it. … 32. The persons that were silenced [in the Great Ejection of 1662] were not of one mind and measure about all the things imposed on them: 1. Some of them were episcopal, and for as much as Richard Hooker writes for, and were against the Covenant (and never took it) and the Parliament’s War, and were for the liturgy and ceremonies and had conformed had these been all that had been imposed, who yet were cast out of fellowships and ministry: Yea some had suffered for the king, and been ruined in their patrimony, some imprisoned for him, and some had been in arms for him. 2. Besides these, and other episcopal nonconformists, some and very many, and we think the greatest part of any one, were such disengaged pacificators as we before mentioned about associations: 3. Some were for the presbyterian government, and 4. Some for that called Independent, which were comparatively but few. … … 35. As to the late civil wars which some most loudly charge on the nonconformists, this is the truth, that the several parties charge the beginning of that war on one another… The truth is: …3. That some few that had been in the king’s army or cause, and that were sufferers for him, and were against the Covenant and the Parliament’s war, were nonconformists… … 37. The 2,000 silenced [in 1662] were not a quarter of the ministers of England, who were in possession before the return of the bishops: so that it is evident that above three-fourth parts of the ministers that kept in under the Parliament and Protector [Cromwell] (notwithstanding Covenant, [Westminster’s] Directory and all) did prove conformists.</p></blockquote>

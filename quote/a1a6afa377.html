<main class="wrap"><figure class="quote" id="q-a1a6afa377" data-kw="">
<blockquote><p>At a public meeting held at Edinburgh in February 1840 on the church’s spiritual independence, Dr Thomas Chalmers spoke on the Christian’s obedience in both the civil and spiritual kingdoms:

Disrespect to the authorities of the State is no sentiment of ours, any more than disrespect for the authorities of the domestic household was the sentiment of St Paul, when he penned the injunction – “Children obey your parents in the Lord.” We have sworn allegiance to the powers that be, nor shall we break our oath to them. Our religion tells us to honour judges and magistrates; and it grieves us to the very heart, that because of an unexpected conjuncture, we incur even but the semblance of disesteem for either of them.

The obedience we owe to our legal court is a virtue of high place in our moral estimation, and only second to the obedience we owe to the mandates of the Upper Sanctuary. We are the members of a civil and a political community below; and, in all things which belong to this relationship, we profess, and by God’s grace will make it good, an entire subjection to its head on earth. But we are also the members, some of us the ministers, of a Church which holds immediately on a Power that is above; and in all things which belong to this relationship we profess, and by God’s grace will also make it good, an entire subjection to our Head in heaven. …

But let there be no mistake. Should any earthly power – should the Court of Session, vested with legitimate authority in the things of Caesar, stretch forth her hand to intromit or intermeddle with these undoubted things of God, then, if the character of an act is to receive its designation, not from the obstacle over which it has to pass, but from the urgent principle which impels the performance of it, then let our act be named by that which is its actuating motive – obedience to the Head of the Church, rather than by that which is not its actuating motive – disobedience to the Court of Session – (Cheers). Still, whatever imputation be case on our principles, let no ambiguity rest upon our conduct. …</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/thomas-chalmers.html">Thomas Chalmers</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Witness</cite>, 26 February 1840.</span></figcaption>

<blockquote><p>Can anything be more plain than the duty of kings and all in authority to promote among their subjects the advancement of true religion and the glory of God, as that duty is enjoined in the second Psalm; — “Be wise now therefore, O ye kings; be instructed, ye judges of the earth. Serve the Lord with fear, and rejoice with trembling. Kiss the Son, lest he be angry, and ye perish from the way.” So that it is not merely a dictate and a duty of natural religion, but a revealed command, that monarchs should reign for the glory of God; — yea, that His revealed religion — His holy Word, as it declares the religion of Christ, the Son of God — should be honoured by them; that they should “kiss the Son.” For the Father hath set the Son on the holy hill of Zion — made Him “the Prince of the kings of the earth.”

This duty does not, of course, permit them to invade the liberties of Christ’s Church as a divinely-organised and divinely-ordered society, free to obey Christ as her only Head. On the contrary, it is the doctrine we are now maintaining, — the duty of kings to glorify Christ, to consult His Word, and consult for His honour, — it is this that will alone ever effectually prevent them interfering with the prerogatives of His Headship or the liberties of His people. When we maintain, therefore, as the Church to which I have the honour to belong maintains, that the civil magistrate has no jurisdiction within or over the Church, God forbid we should set it on the ground that he has nothing to do with religion, or the Church of Christ, at all.

Poor foundation, indeed, would that be for the principle maintained! He has so much to do with religion, and is so bound in his public capacity to act under religious obligation and duty to Christ, that he is bound to know and recognise Christ’s Church; and then to leave her free to serve Christ in all spiritual things. He is bound to know the truth of Christ; to protect those who maintain the truth of Christ; and to promote by every means in his power their labours to circulate and extend it. He is bound to suppress blasphemy, perjury, Sabbath desecration, and all that necessarily tends to the dishonouring of God and the demoralising of the people. He cannot command or compel man to be religious. No commandment can make man religious — not even God’s commandment can do it. The gospel of the grace of God, rendered effectual by the free and sovereign Spirit of God, can alone renew the heart of man or make him sincerely religious. Spiritual obedience to God neither magistrate nor parent can secure.

But is no authority, on that account, to be exercised? Is no obligation, on that account, to be enforced? Does God’s own authority cease? Is the obligation to obey God’s commandment at an end? His commandment even will never make men religious. Is it, therefore, set aside? No, verily. The assertion of law, obligation, and authority, does not rest upon consequences: whether owned or not, the obligation is the same. And be it remembered that while God uses His own authority and gives forth His own commands as means with which He often sends the accompanying grace and power to obey; so a parent or superior may not only use his entreaty, example, persuasion, and exhortation in the hope that God will accompany them with His blessing; but may specially put forth his authority and peremptory command in the same hope that God will bless them likewise, and secure a true obedience — secure the good and righteous end designed.

Let parents, masters, and all in authority make the 101st Psalm the rubric of their household or public procedure “I will sing of mercy and judgment: unto thee, O Lord, will I sing. I will behave myself wisely in a perfect way. O when wilt thou come unto me? I will “walk within my house with a perfect heart. I will set no wicked thing before mine eyes: I hate the work of them that turn aside; it shall not cleave to me. A froward heart shall depart from me: I will not know a wicked person. . . . Mine eyes shall be upon the faithful of the land, that they may dwell with me: he that walketh in a perfect way, he shall serve me. He that worketh deceit shall not dwell within my house: he that telleth lies shall not tarry in my sight.” “I know Abraham, that he will command his children and his household after him; and they shall keep the way of the Lord to do justice and judgment; that the Lord may bring upon Abraham that which he hath spoken of him.”

It is an evil and a dangerous principle that would exempt the rulers of a kingdom from being in subjection, in their public capacity, to the Word of Christ, and from being under obligation in their government to rule for the promotion of His kingdom. It strikes at the root of all family as well as national religion; and while it would confine Christ to the separate consciences of individual men, it would refuse Him the right to govern the households and communities into which, in Providence, they are combined. Its universal and perpetual prevalence would prevent the fulfilment of the promise that “the kingdoms of the world shall become the kingdoms of Jehovah and His anointed One;” and would subject all nations to the threatening: “The kingdom and nation that will not serve the Church shall perish; yea, those nations shall be utterly wasted” (Isa. lx. 12). Again, we repeat, it was fortunate and good for Nineveh that no such notion prevailed there. Theirs was a national fast, decreed by royal authority.</p></blockquote>

<blockquote><p>First, the state and the Church are essentially different in regard to their origin. The state, or the ordinance of civil government, owes its origin to God as the universal Sovereign and Ruler among the nations.

The Church, as the visible society of professing Christians in the world, with its outward provision of authority and order and government, owes its origin to Christ as Mediator. This difference is a most important one, as it involves and implies other differences characteristic of the two bodies. The civil government is an ordinance of God, founded not in grace, but in nature, and therefore intended for human society as subsisting in all nations, whether Christian or not, and carrying with it the authority and sanction of a Divine appointment wherever human society is found.

As an appointment of God, in His character of universal Sovereign, the authority of the state, and the duty of subjects in regard to it, are entirely independent of the Christianity of rulers or subjects; and the rights and responsibilities of the two parties are as valid and as binding in heathen as in Christian lands.

On the other hand, the Church, as an ordinance of Christ, is founded in grace, not in nature, and is limited to those nations where Christianity is actually professed. As an appointment of the Mediator, in His character of special Ruler or Head over His own people, it carries with it His authority, and is restricted in its jurisdiction to those who profess their subjection to Him, and join themselves to the Christian society which He has established.

Different in their origin, and in the source from which they derive their authority, the state and the Church are thus based on distinct and separate foundations, and are entirely independent of each other. Nor is this fundamental difference cancelled or overruled by the fact that the state or civil government is now put under the dominion of Christ in the character of Mediator, as well as the Church.

It is true that the civil governments of the world, like everything else, are subordinated to the Redeemer, that He may make use of them for promoting His own mediatorial purposes, and that Christ is not only “Head of the Church,” but “Head over all things to the Church.” But this authority of Christ over the civil governments of the earth is a thing superinduced upon their original character as the ordinance of God, in His capacity of universal Sovereign.

It does not in the least affect or supersede that character. The state, although it is now delegated to Christ to be under His authority for the good of His Church, has not ceased to be what it originally was—an appointment of God as the God of nature—any more than the creation of God has ceased to be the creation of God, because it also is now subordinated to the dominion of Christ for the interests of His people. In their origin, and in the basis on which they rest, the civil society and the Christian society are two ordinances essentially independent and distinct. …

In the first place, there is a foundation laid for a friendly alliance between the Church and state, in the fact of the twofold character which Christ sustains of Head of the Church, and also of Head over all things to the Church.

That civil government is an ordinance of God, as the God of nature and not of grace, is a most important truth, and one that lies at the foundation of the essential difference between the state and the Church, which owes its origin to Christ as Mediator. But it is no less true that God has handed over to Christ, as Mediator, the ordinance of civil government, to be employed by Him in subordination to the great purposes of His mediatorial reign.

Among “the all things” over which Christ is now made Head to the Church, is to be numbered the ordinance of magistracy or civil government in this world,—a truth which seems unquestionably to draw with it the conclusion that, in the hands of Christ, and under His control, the civil government of nations may be made instrumental in advancing the interests and promoting the well-being of the Church. …

It is an ordinance of God, both good in itself and appointed for good. The very end for which it has been placed under subjection to the Messiah is, that it may be instrumental, under Him, for securing the spiritual interests and promoting the welfare of His kingdom of grace; and it approaches very nearly to the assertion that Christ has failed in the object for which He has been set over it as Head, to assert that the state, from its nature or constitution, cannot in any manner be converted into a willing and conscious instrument for promoting the prosperity of the Church, and advancing the cause of Christianity. In the common subordination to Christ which the body politic and body ecclesiastical alike underlie, and in the object which is to be promoted by that subordination, we see the foundation laid for a friendly alliance and co-operation between Church and state.

Distinct and separate in their essential character, they are yet brought into one through their mutual subjection to the same Divine Head, and their mutual subserviency to the same gracious purpose. Fundamentally unlike in their character on earth, they are resolved into a higher unity through means of one Head in heaven. The Church and the state, because equally the servants of Christ, are helps made and meet for each other.</p></blockquote>

<blockquote><p>Perhaps it may be thought by some that the Saviour’s declaration, “Render, therefore, unto Caesar the things which are Caesar’s,” (Mat. xxii. 21,) does not seem to coincide with the sentiments now expressed. As this passage has also been impressed into the service of courtly adulation, and been generally applied in support of unqualified subjection to all kinds of taxes and Government-imposts, we must here endeavour to set it in its true light. We affirm, then, in the most unequivocal terms, that the declaration is no direct and positive answer to the question proposed, nor was it understood to be so by the Jews.

As the question stood, it required to be answered thus:- It is lawful, or it is not evident, that the question was captious and ensnaring, since the Saviour said – “Why tempt ye me, ye hypocrites?” The answer, therefore, was evasive and equivocal, and was so understood; otherwise, how should those who proposed it “marvel,” had not their cunning been baffled, and their hopes disappointed? Let it be remarked, that it is no way derogatory to the Saviour’s candour to say, that he is baffled the malice of his enemies by answering the fool according to his folly.

We have an instance of this kind in the decision he gave respecting the woman taken in adultery – “Let him that is without sin among you cast the first stone at her.” So, likewise, when he said – “Destroy this temple, and in three days I will rear it up again,” he gave a practical illustration of the propriety of the precept in these instances which we have adduced. Since the answer, then, was evasive, it must be highly absurd to consider it as direct, and to apply it accordingly, as has been frequently done.

But even although we should allow the question to have been answered in direct terms, which we by no means do, it could never be justly adduced as an example for our imitation, either regarding obedience to civil rulers, or the voluntary payment of government taxes, since our political circumstances, and those of the Jews in the Saviour’s time, are entirely different. They were a conquered nation – and had, by their aggravated sins, given the Gentiles, or Romans, a right over them, which none would have obtained, had they continued to perform their allegiance to God.

Caesar did not govern them, either by their choice or consent; they had no hand in enacting those laws to which they were obliged to submit, nor had any of the Caesars sworn to govern them according to law. They had no political charter, recognizing their rights and liberties; nor had it ever been said to them, in relation to Caesar, “Will ye have this man to reign over you?” They were, therefore, obliged to submit to any imposition, because resistance, at that time, was out of the question.

Our case is entirely different in submitting to the authority of our Caesars or civil magistrates. They have no absolute or dictatorial power over us; nor can they demand a shilling from us, unless it be allowed them by law. Those laws which claim our obedience are not made by the magistrate, but by ourselves, through our representatives; nor are we bound to obey any magistrates, but such as have been legally set up.

Our Caesar swears and engages to rule by law; and all his power is derived from the same law which constitutes him chief magistrate. The law alone sanctions what he is to command, and defines the limits of our obedience. These circumstances, then, can be no just similarity established between Caesar’s arbitrary exactions from the Jews, and our taxation according to law. This text, of course, is grossly abused, when it is applied for the purpose of inculcating submission to the measures of civil government; nor does it tend in the slightest degree, when rightly understood, to invalidate the doctrine advocated in the preceding remarks.</p></blockquote>

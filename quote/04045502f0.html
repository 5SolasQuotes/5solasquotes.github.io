<main class="wrap"><figure class="quote" id="q-04045502f0" data-kw="">
<blockquote><p>First, It was obedience to God merely as Creator, no further; Adam in innocency he looked upon God as Creator of all things, as the First being of all, and so Adam tendered up his service to God merely as the Creator and First-being. That was his obedience. Secondly, The Law to Adam had promise only of natural things, of a natural life to be continued: We do not read of God’s promising Adam to live in Heaven if he had obeyed; but, Do this and live; that was the Tenor of the Covenant with him: that is, he should have continued in Paradise and so have lived a natural life, but yet continued eternally, God would have upheld that natural life of his, that’s all we read of that ever God promised to Adam if he had stood by virtue of that Covenant of the Law:

That’s the second thing considerable in him. so that his obedience was tendered up to God to that end, that he might obtain the continuance of a natural life here in this world, only in order unto that, for we find no more revealed. The first man Adam he was Natural, the second Spiritual, the first of the Earth earthly, the second, the Lord from Heaven. The Apostle. 1 Cor. 15. speaks of Adam in innocency as the common head of al man-kind, he was of the Earth earthly, and in way of distinction the second Adam was the Lord from Heaven; He brings all heavenly glory. Though Adam had stood, yet we never read of any heavenly glory that ever he or his posterity should have had; but the second Adam he is the Lord from Heaven that brings Heavenly glory with him. That’s the second thing considerable in the Law as a Covenant with Adam.

The third thing in the Law as a Covenant with Adam was this, That Adam under the Law he must have wrought by his own strength that he had received. God at first gave man strength for obedience, and he puts his stock into his own hand, and so he must have wrought and continued by the power of the strength that God did at first give him, he had not that fountain to go to for that continual supply of strength as we have, which you shall see presently.

Fourthly, Adam, he was in such a condition, as he was in hazard of his miscarrying for his eternal estate; He was indeed in a way of obedience to the Law that God gave him, but still so as he was in hazard of eternal miscarrying; this was the condition of Adam under the Law.</p></blockquote>

<blockquote><p>7. Lastly, In his person. Being a sinful man under the covenant of works, he is a cursed man; For it is written, “Cursed is every one that continueth not in all things which are written in the book of the law to do them.” The curse fixeth not only on what is his, but on himself; and it is for his sake that it is laid on other things. The curse, as you have heard, is on his soul, and on his body; for wherever sin is found under this covenant, there the curse also is And, (1.) The man is under the power of Satan, Acts 26:18. Into the hand of this enemy man fell, when he broke the covenant of works. Satan having waged war against heaven, set on man, heaven’s confederate, and gained the unhappy victory, gained him by temptation to renounce his allegiance to his rightful Lord by breaking the covenant, and so he fell under his power, as his captive taken in war, Isa. 49:24, was brought under bondage to this worst of masters, 2 Pet. 2:19, and is ruled by him at his pleasure, 2 Tim. 2 ult. The curse of the covenant falling on the covenant-breaker, he is thereby laid under condemnation, and adjudged to death according to the threatening; and so he falls under the power of him that has the power of death, that is the devil, Heb. 2:14. Every natural man is shut up as in a prison, in his natural state; and there he lies in bonds, Isa. 61:1. There are God’s bands on him, the bands of the curse binding him over to death; and the devil’s bands are on him, viz, the bands of strong lusts and corruptions, with which they are laden, as a malefactor in prison is laden with irons. And Satan has the power of gaoler over them. He keeps the keys of the prison, and narrowly watches the prisoners that none of them escape. They are not all kept alike close; but none of them can move beyond the bounds of his jurisdiction, more than the prisoner can get out of the dungeon. Even when the king’s word comes to deliver the elect, he will not yield them up; but the prison doors must be broke open, and they forcibly taken out of his hand by a stronger than he. (3.) The natural man being under the curse is continually in hazard of utter destruction, of having the copestone put on his misery, and being set beyond all possibility of help. If his eyes were opened he would see himself every moment in danger of dropping down into the pit of hell; Psalm 7:12, “If he turn not, he will whet his sword; he hath bent his bow, and made it ready.” The man is constantly standing before God’s bent bow, and has nothing to secure him one moment from the drawing of it. The sentence of death is passed against him, John 3:18, but there is no day intimated for the execution, but every day the dead warrant may be signed against him, and he led forth to death. His name may be “Magor-missabib,” a terror round about, Jer. 20:3. Whither can he look where he will not see his enemies ready to ruin him, on a word of command from that God under whose curse he lies? And what can he do for himself amidst his armed enemies? He is quite naked, Rev. 3:17, and cannot fight them; he is without strength, Rom. 5:6, and cannot wield armour, though he had it; he is bound hand and foot, Isa. 61:1, and cannot flee; and if he could, whither could he flee for safety? Heaven’s gates are shut upon him; in the utmost parts of the earth, or the most remote rock in the sea, God’s hand would find him out. Justice is pursuing the criminals under the curse, crying for vengeance on the traitors, and their foot shall certainly slide in due time; the law is continually throwing the fire-balls of its curses on them, and will at length set them on fire round about; death is on the pursuit after them, and has gained much ground of them already, and the cloud of wrath hangs over their heads continually in the curse, and the small rain of God’s wrath is still falling on them; how soon death may overtake them, they know not; and then the cloud breaks, and the great rain of his strength falls down upon them, and sweeps them away without hope for ever and ever.</p></blockquote>

<blockquote><p>1. This covenant, called “the old covenant,” was never intended to be of itself the absolute rule and law of life and salvation unto the church, but was made with a particular design, and with respect unto particular ends. This the apostle proves undeniably in this epistle, especially in the chapter foregoing, and those two that follow. Hence it follows that it could abrogate or disannul nothing which God at any time before had given as a general rule unto the church. For that which is particular cannot abrogate any thing that was general, and before it; as that which is general doth abrogate all antecedent particulars, as the new covenant doth abrogate the old. And this we must consider in both the instances belonging hereunto. For,— (1.) God had before given the covenant of works, or perfect obedience, unto all mankind, in the law of creation. But this covenant at Sinai did not abrogate or disannul that covenant, nor any way fulfil it. And the reason is, because it was never intended to come in the place or room thereof, as a covenant, containing an entire rule of all the faith and obedience of the whole church. God did not intend in it to abrogate the covenant of works, and to substitute this in the place thereof; yea, in sundry things it re-enforced, established, and confirmed that covenant. For,— [1.] It revived, declared, and expressed all the commands of that covenant in the decalogue; for that is nothing but a divine summary of the law written in the heart of man at his creation. And herein the dreadful manner of its delivery or promulgation, with its writing in tables of stone, is also to be considered; for in them the nature of that first covenant, with its inexorableness as unto perfect obedience, was represented. And because none could answer its demands, or comply with it therein, it was called “the ministration of death,” causing fear and bondage, 2 Cor. 3:7. [2.] It revived the sanction of the first covenant, in the curse or sentence of death which it denounced against all transgressors. Death was the penalty of the transgression of the first covenant: “In the day that thou eatest, thou shalt die the death.” And this sentence was revived and represented anew in the curse wherewith this covenant was ratified, “Cursed be he that confirmeth not all the words of this law to do them,” Deut. 27:26; Gal. 3:10. For the design of God in it was to bind a sense of that curse on the consciences of men, until He came by whom it was taken away, as the apostle declares, Gal. 3:19. [3.] It revived the promise of that covenant,—that of eternal life upon perfect obedience. So the apostle tells us that Moses thus describeth the righteousness of the law, “That the man which doeth those things shall live by them,” Rom. 10:5; as he doth, Lev. 18:5. Now this is no other but the covenant of works revived. Nor had this covenant of Sinai any promise of eternal life annexed unto it, as such, but only the promise inseparable from the covenant of works which it revived, saying, “Do this, and live.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/john-owen.html">John Owen</a></span><span class="wk"><span class="lbl">Work:</span> <cite>An Exposition of the Epistle to the Hebrews</cite>, ed. W. H. Goold, Works of John Owen (Edinburgh: Johnstone and Hunter, 1854), 23.77–78.</span></figcaption>

enant-of-works/" rel="noopener" target="_blank">Read it online · Heidelblog</a></div>
</figure><figure class="quote" id="q-bf77a45789" data-kw="">
<blockquote><p>To say that God carryeth all things by an absolute and unconditional decree of providence, viz. opposing absolute to all conditions presupposed in the creature, in my judgment is neither agreeing to the Doctrine of Scripture, nor of our Divines; who do both teach that as God in the fulness of time doth administer and dispense the way of his providence, so he decreed to dispense them in the same manner from eternity.

Now in dispensing the performance of the Covenant of works, the Lord punisheth and rewardeth the creature according to the condition of obedience or disobedience performed by it, as it is at large described, Levit. 26; Deut. 28. and therefore surely he decreed to carry such works of his providence upon the same conditions.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/william-twisse.html">William Twisse</a></span><span class="wk"><span class="lbl">Work:</span> <cite>A treatise of Mr. Cotton’s, Clearing certain doubts concerning predestination. Together with an examination thereof</cite>, (London: Andrew Crook, 1646), p. 245.</span></figcaption>

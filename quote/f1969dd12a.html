<main class="wrap"><figure class="quote" id="q-f1969dd12a" data-kw="">
<blockquote><p>Now followeth that duty which one day in seven must be given unto the Lord, in the sanctification of his Sabbath. Remember, So he seemeth to speak, because when as this commandment was before given, they had neglected the same. The Sabbath day to sanctify, that is, to separate it from a common use, and dedicate it to a peculiar and holy use unto the Lord. So the gold, the vessels, &amp;c. were said to be holy and dedicated for the holy use of the Temple, and might not be given or put to any other use: To sanctify a Sabbath therefore, is to call our selves, not from our own sinful ways, which we must do every day, but from out honest and lawful callings, that giving our selves to godly and Christianly exercises of our faith, we may be strengthened in the ways of God, and so in thought, word, and deed consecrate a glorious Sabbath unto the Lord.

Therefore it is called the Sabbath of God, Exod. 20. 10. and Levi. 23. 3. He calleth it a holy convocation, that is, dedicated to holy meetings. So Esai 58. 13. Hereby is confuted their opinion that take it a Sabbath kept, if their rest from their labours, so in the mean time they labour in plays, dancings, vain songs and interludes, &amp;c. as though the Lord had called us from our profitable labour commanded, to displease him in these vanities. Again others also who if they be better then the former, abstaining from those things, have notwithstanding their heads, hearts, and mouths, so full of worldly things, as they do not indeed perform the truth of the Sabbath, when as it should be kept as the rest of the Law, not only in action, but also in the thoughts of the heart and words of the mouth. Esa. 58. Amos. 8. 5.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/dudley-fenner.html">Dudley Fenner</a></span><span class="wk"><span class="lbl">Work:</span> <cite>A brief treatise upon the first table of the law orderly disposing the principles of religion, whereby we may examine our selves</cite>, ([Middleburg: R. Schilders, 1588]), unpaginated.</span></figcaption>

<blockquote><p>43. Vocal prayer is either in prose, or in meter.

44. In meter singing is joined, and therefore there must be more care of the speech and tone, then in prose.

45. But the melody of singing is ordained for a certain spiritual delight, whereby the mind is detained in the meditation of the thing that is sung. … 48. But because this religious melody has the respect of prayers: therefore it is not so fit, that the Decalogue, and other such like which do not partake the nature of prayer, be turned into meter and be sung instead of psalms.</p></blockquote>

<blockquote><p>An institution is that which is merely founded upon God’s will, raising up a thing beyond its own natural or moral efficacy, with an efficacy beyond it… Institutions are not only express commands in the letter of them; for examples and promises, hints and implicit intimations may hold forth the will of Christ. Neither is everything that is the will and command of Christ an institution… So also there are means of edification which are providential, and so occasionally will serve… So as the constant setting apart of such a thing, for such an end (though providentially and occasionally, it may serve for such an end) rises up to an institution also. …Institutions are but the will of Christ, declared concerning such things as are exercised above the common nature of them, to a further spiritual end. Therefore the declaring the will of God about them, holds in common with the declaration of God’s will in other commands… We do not make everything a promise is made to an institution… promises are the declaration of God’s will, be they made to what things soever; and if they fall upon such things as are raised up above natural and common efficacy, with promise of a supernatural power to accompany them, then they are institutions…. When there is a commission of power given, there is a declared institution.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/thomas-goodwin.html">Thomas Goodwin</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Works of Thomas Goodwin</cite>, Of the Constitution, Right, Order &amp; Government of the Churches of Christ (London: Snowden, 1696), ch. 4, pp. 17-19 in The Works of Thomas Goodwin… the Fourth Volume (London: Darby, 1697)</span></figcaption>

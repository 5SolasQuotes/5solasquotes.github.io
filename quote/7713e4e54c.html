</figure><figure class="quote" id="q-5fdcc71030" data-kw="">
<blockquote><p>We further confess and acknowledge, that such persons as are placed in authority are to be loved, honored, feared, and holden in most reverend estimation, because they are the lieutenants of God, in whose session God Himself does sit and judge. And further, we affirm that whosoever deny unto them their aid, counsel and comfort, while the princes vigilantly travail in the executing of their office, that the same men deny their help, support and counsel to God, who, by the presence of his lieutenant, craves it of them.</p></blockquote>

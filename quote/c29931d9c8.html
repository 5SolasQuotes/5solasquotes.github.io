<main class="wrap"><figure class="quote" id="q-c29931d9c8" data-kw="">
<blockquote><p>§6. Let no one doubt that the will of God tends toward Himself: 1. Because God, in the genus of being and of goods, is the best and greatest, who adequately and intimately knows Himself as such: which knowledge with consciousness evidently presents to Him as thinking a thing exceedingly pleasing, in which He takes delight and rests—since, seeing that He absolutely possesses every reality, He sees that nothing is lacking to Him which He could desire, and thus He loves Himself, and is conscious to Himself of an acquiescence which expresses the very formal ratio of His blessedness.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/salomon-van-til.html">Salomon Van Til</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Compendium of Both Theologies, even Natural &amp; Revealed</cite>, … (1703; 1719), 1. Nature of God, subsection 4, ‘On the Will of God’ tr. AI by Roman Prestarri Latin</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/creation/the-six-days.html">The Six Days</a></span><span class="t"><a href="../topics/attributes-of-god/will-of-god.html">Will of God</a></span></div>

</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-7ca6866edf" data-kw="">
<blockquote><p>The judgments of God do not always follow crimes, as thunder does lightning, but sometimes the space of many ages coming between. When the sun has shined fair the space of six days upon their tabernacle, we know not what clouds the seventh may bring. And when their punishment does come, let them make their account, in the greatness of their sufferings to pay the interest of that respite which has been given them.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/richard-hooker.html">Richard Hooker</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Works of Mr. Richard Hooker</cite>, … in Eight Books of Ecclesiastical Polity (d. 1600; London: Newcomb, 1666), A Remedy against Sorrow &amp; Fear, delivered in a Funeral Sermon, p. 546 Note Hooker’s use of the phrase here is not limited to natural days.</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/creation/the-six-days.html">The Six Days</a></span></div>

</figure><figure class="quote" id="q-2ca77d58dd" data-kw="">
<blockquote><p>The woman that brings forth a man-child is prohibited her husband the space of seven days; but on the seventh day, at the coming in of the evening, which begins the eighth day [Hebrew], she washes herself, and is allowed to go in unto her husband.</p></blockquote>

</figure><figure class="quote" id="q-b7cd1f6c82" data-kw="">
<blockquote><p>But now let us come to that which is commanded here concerning the Easterday of the Jews [Dt. 16:8], ‘Ye shall eat unleavened bread or cakes’ (says he) ‘by the space of six days, and there shall no leavened bread be found in your houses’… [Note that while the phrase occurs in a translation of a Bible verse, the term “space” is not explicitly in the Hebrew, nor the later KJV. Hence it reflects Calvin’s interpretation and use of that term and concept.] …when God commanded them to eat unleavened bread. And it was his will that this should be done, not only the same night that they ate the pascal lamb: but also that the same ceremony should be continued by the space of six days together.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/john-calvin.html">John Calvin</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Sermons on Deuteronomy</cite>, The Sermons of Mr. John Calvin upon the Fifth Book of Moses called Deuteronomy... (London, 1583), On Tuesday, Nov. 5, 1555, 97th Sermon, first on ch. 16, pp. 598-99</span></figcaption>

</figure><figure class="quote" id="q-a68262c412" data-kw="">
<blockquote><p>7. And lastly, in what time or how many days did God create all things, in six days says the Scripture, and every day some thing says this place, till the seventh day, wherein He rested. Non uno momento, sed sex dierum spatio, ‘not in one moment, but in six days’ space.’ If you happily think or meet with Syrach’s words [in Ecclesiasticus], who says, ‘He that lives made all things together, the Lord who only is iust,’ etc., you must consider that he speaks not of the time, but of the multitude of creatures, meaning that God made them all together before He rested, and gave over creating, but not meaning that He made them all in one moment of time or in one day, for we see both this place and others against it: the Lord’s own commandment written with his own finger gives testimony that in six days the whole was made.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/gervase-babington.html">Gervase Babington</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Certain Plain, Brief &amp; Comfortable Notes upon every Chapter of Genesis</cite>, (London: 1592), ch. 1, p. 6</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/creation/the-six-days.html">The Six Days</a></span></div>

<main class="wrap"><figure class="quote" id="q-87c4c59af5" data-kw="">
<blockquote><p>Reprobation is a preterition or passing by, or a purpose not to have mercy upon some of the lost Sons of Adam, but to leave them to perish in their sins: Our Reformed Divines do warily distinguish of a two-fold Act in Reprobation; the first negative (namely) Propositum non miserendiseu pretereundi, a purpose not to have mercy on them: the other positive (namely) Propositum damnandi, &amp; ordinatio ad exitium, ut justam poenam, a purpose to execute wrath on Transgressors, because of their sins, his Justice so requiring: But these two Acts are not to be severed, forasmuch as those on whom he will not have mercy, he intends to punish for their sins: for to my apprehension there is no other decree of Reprobation, but this purpose of God, to execute that judiciary Sentence of death on all mankind, for breach of the first covenant of Obedience made with Adam, which Covenant, the wicked do proceed to break more and more by their daily sins, and so work out their own Damnation, by their hypocrisy, Disobedience, and wilful contempt of God’s Word.

That first Covenant stands still in force against all the world, All are under it; and God’s justice must be satisfied for all the disobedience of the Sons of Adam; yet with this gracious and blessed difference; God punisheth the sins of the Elect in the person of Christ, but the sins of others in their own persons; on the one sort he shows the severity of his Law and Justice; on the other, the rich mercy of the Gospel. This is the Grace of the Gospel so much magnified by the Apostle, not that the Law is made void by it: But whereas God might have required full payment and satisfaction in our own persons, he doth accept it in the person of Christ, and so we have a protection against the damnatory sentence of sin and the law; which seeing the unregenerate world, being out of Christ, have not, they must answer for themselves.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/william-lyford.html">William Lyford</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The plain man’s senses exercised to discern both good and evil, or, A discovery of the errors, heresies, and blasphemies of these times and the toleration of them, as they are collected and testified against by the ministers of London, in their testimony to the truth of Jesus Christ</cite>, (London: Richard Royston, 1655), p. 189.</span></figcaption>

</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-05ac45d599" data-kw="">
<blockquote><p>Since the creature must pattern his ways after his Creator’s, and since the Creator rested only after he had worked, it was a covenant of works which was proffered to Adam as the means by which to arrive at the consummation. In the sense that it was the door to the consummation, this original Covenant of Creation was eschatological.

That door, however, was never opened. It was not the Fall in itself that delayed the consummation. According to the conditions of the Covenant of Creation the prospective consummation was either/or. It was either eternal glory by covenantal confirmation or original righteousness or eternal perdition by covenant-breaking repudiation of it.

The Fall, therefore, might have been followed at once by a consummation of the curse of the covenant. The delay was due rather to the principle and purpose of divine compassion by which a new way of arriving at the consummation was introduced, the way of redemptive covenant with common grace as its historical corollary.</p></blockquote>

<blockquote><p>First Prop. If we had fulfilled the conditions of the first covenant, we should, by what we did, have obtained eternal life and blessedness.

Man was not made naturally immortal or incapable of death. Every creature is capable of death, and therefore we are told that God only hath immortality (1 Timothy 6:16). Indeed, man when he was first created had no seeds of corruption and death in his nature, no principle of decay that tended gradually to bring him again to the dust, but yet he was not incapable of dying. He was capable of both temporal and eternal death.

This matter therefore must be as God should dispose, whether he should die or live forever. God was not pleased absolutely to promise this to man when he first created him, but he gave him a trial for it. He promised implicitly that if he would approve himself perfectly obedient to Him, after a due time he should have eternal life and blessedness made sure to him.

Though his living forever as yet was not certain to him, yet God gave him a fair opportunity to have it made sure to him afterwards. It depended only on his own fidelity to his Creator. He had a fair opportunity after a while of being called to the tree of life, and so having everlasting life sealed to him, and be put out of all possibility of ever dying either eternally or temporally and, withal, of receiving a great addition of happiness.

Man in the state wherein he was created was in a very happy condition in paradise, as we have already shown. But doubtless, if he had stood, he would have been advanced to a much greater happiness. ‘Tis most reasonable to suppose that the blessedness he enjoyed even while in a state of trial shouldn’t be so great as after he had done his work and come to receive his reward. He now enjoyed life, but if he had stood he would have been called to the tree of life to eat of that, and his life should not only have been ascertained to him forever, but he would have advanced to a higher degree of life.

Eternal life was then, as it is now, the great promise of God. It was the promise of the covenant of works as well as the covenant of grace. And as eternal life don’t now, so it did not then, only denote a continuance of man’s life forever so that he should never die, but it denotes a most glorious and blessed life.

If Adam had stood, the tree of life would have been a tree of life to him these two ways, viz. as upon the eating of it after his trial he was to have a living forever ascertained to him, and was also to be exalted to a more glorious and blessed life.

His time of trial would not have lasted always. After a due time, if man had stood, he was to be confirmed then, and man would have [been] put beyond all possibility of falling. Not beyond a natural possibility—no creature ever was or ever will be naturally impeccable or naturally incapable of sinning—but God would have become engaged for his never sinning or dying, as we have all reason now to conclude that it is with the angels. They had a time of probation as well as man, as is evident because some of ’em fell. But the angels of light are now past their probation and are in a state of confirmed holiness and blessedness.

We have no account how long man was to have been tried before he was to be confirmed, and ’tis not probable that God revealed that to man. But if he proved obedient, after a due time he was to have eat of the tree of life.

The tree of life was a tree that God planted with the rest of the garden, that man might be the more assured of his reward in case of his obedience, and that this consideration might engage his spirit the more earnestly to seek that he might come to taste of it. ‘Tis probable that God told Adam of this tree to encourage his obedience. He might tell him in earnest that man had an opportunity of obtaining the fruit of this tree, and that eternal life and blessedness of which it was a seal, by what he himself did; an obtaining of this blessed reward was in his power.

It was in man’s own power perfectly to obey the law of God, which is not in our power now since the fall, as it was more in man’s power perfectly to obey the law and persevere in it then, than it is for fallen man to perform one act of sincere obedience. And that, upon two accounts, viz.

1. As he had no sin then that he was under the power and dominion of. We can’t obey now because we are dead in trespasses; Ephesians 2:1, “and you hath he quickened, who were dead in trespasses and sins.” We are stones; our hands are pinioned by strong lusts. But our first parents, they were free, not under any such bondage.

2. Adam had a sufficient assistance of God always present with him to have enabled him to have obeyed if he had used his natural abilities in endeavouring it, as he might do, though the assistance was not such as it would have been after he was confirmed to render it impossible for him to sin. Man might be deceived so that he should not be disposed to use his endeavours to persevere, but if he did use his endeavours, there was a sufficient assistance always with him to enable him to persevere. So that man had a very fair opportunity of obtaining eternal life and blessedness under the first covenant, and it was in his power to obtain it by what he did himself.</p></blockquote>

— Jonathan Edwards, East of Eden, (1731) in Mark Valeri (ed.), Sermons and Discourses, 1730-1733: The Works of Jonathan Edwards Volume 17 (New Haven CN: Yale University Press, 2000), pp 337-39.">Copy</button><a class="share" href="https://x.com/intent/post?text=%E2%80%9CFirst+Prop.+If+we+had+fulfilled+the+conditions+of+the+first+covenant%2C+we+should%2C+by+what+we+did%2C+have+obtained+eternal+life+and+blessedness.%0A%0AMan+was+not+made+naturally+immortal+or+incapable+of+death.+Every+creature+is+capable+of+death%2C+and+therefore+we+are+told+that+God+only+hath+immortality+%281+Timothy+6%3A16%29.+Indeed%2C+man+when+he+was+first+created+had+no+seeds+of+corruption+and+death+in+his+nature%2C+no+principle+of+decay+that+tended+gradually+to+bring+him+again+to+the+dust%2C+but+yet+he+was+not+incapable+of+dying.+He+was+capable+of+both+temporal+and+eternal+death.%0A%0AThis+matter+therefore+must+be+as+God+should+dispose%2C+whether+he+should+die+or+live+forever.+God+was+not+pleased+absolutely+to+promise+this+to+man+when+he+first+created+him%2C+but+he+gave+him+a+trial+for+it.+He+promised+implicitly+that+if+he+would+approve+himself+perfectly+obedient+to+Him%2C+after+a+due+time+he+should+have+eternal+life+and+blessedness+made+sure+to+him.%0A%0AThough+his+living+forever+as+yet+was+not+certain+to+him%2C+yet+God+gave+him+a+fair+opportunity+to+have+it+made+sure+to+him+afterwards.+It+depended+only+on+his+own+fidelity+to+his+Creator.+He+had+a+fair+opportunity+after+a+while+of+being+called+to+the+tree+of+life%2C+and+so+having+everlasting+life+sealed+to+him%2C+and+be+put+out+of+all+possibility+of+ever+dying+either+eternally+or+temporally+and%2C+withal%2C+of+receiving+a+great+addition+of+happiness.%0A%0AMan+in+the+state+wherein+he+was+created+was+in+a+very+happy+condition+in+paradise%2C+as+we+have+already+shown.+But+doubtless%2C+if+he+had+stood%2C+he+would+have+been+advanced+to+a+much+greater+happiness.+%E2%80%98Tis+most+reasonable+to+suppose+that+the+blessedness+he+enjoyed+even+while+in+a+state+of+trial+shouldn%E2%80%99t+be+so+great+as+after+he+had+done+his+work+and+come+to+receive+his+reward.+He+now+enjoyed+life%2C+but+if+he+had+stood+he+would+have+been+called+to+the+tree+of+life+to+eat+of+that%2C+and+his+life+should+not+only+have+been+ascertained+to+him+forever%2C+but+he+would+have+advanced+to+a+higher+degree+of+life.%0A%0AEternal+life+was+then%2C+as+it+is+now%2C+the+great+promise+of+God.+It+was+the+promise+of+the+covenant+of+works+as+well+as+the+covenant+of+grace.+And+as+eternal+life+don%E2%80%99t+now%2C+so+it+did+not+then%2C+only+denote+a+continuance+of+man%E2%80%99s+life+forever+so+that+he+should+never+die%2C+but+it+denotes+a+most+glorious+and+blessed+life.%0A%0AIf+Adam+had+stood%2C+the+tree+of+life+would+have+been+a+tree+of+life+to+him+these+two+ways%2C+viz.+as+upon+the+eating+of+it+after+his+trial+he+was+to+have+a+living+forever+ascertained+to+him%2C+and+was+also+to+be+exalted+to+a+more+glorious+and+blessed+life.%0A%0AHis+time+of+trial+would+not+have+lasted+always.+After+a+due+time%2C+if+man+had+stood%2C+he+was+to+be+confirmed+then%2C+and+man+would+have+%5Bbeen%5D+put+beyond+all+possibility+of+falling.+Not+beyond+a+natural+possibility%E2%80%94no+creature+ever+was+or+ever+will+be+naturally+impeccable+or+naturally+incapable+of+sinning%E2%80%94but+God+would+have+become+engaged+for+his+never+sinning+or+dying%2C+as+we+have+all+reason+now+to+conclude+that+it+is+with+the+angels.+They+had+a+time+of+probation+as+well+as+man%2C+as+is+evident+because+some+of+%E2%80%99em+fell.+But+the+angels+of+light+are+now+past+their+probation+and+are+in+a+state+of+confirmed+holiness+and+blessedness.%0A%0AWe+have+no+account+how+long+man+was+to+have+been+tried+before+he+was+to+be+confirmed%2C+and+%E2%80%99tis+not+probable+that+God+revealed+that+to+man.+But+if+he+proved+obedient%2C+after+a+due+time+he+was+to+have+eat+of+the+tree+of+life.%0A%0AThe+tree+of+life+was+a+tree+that+God+planted+with+the+rest+of+the+garden%2C+that+man+might+be+the+more+assured+of+his+reward+in+case+of+his+obedience%2C+and+that+this+consideration+might+engage+his+spirit+the+more+earnestly+to+seek+that+he+might+come+to+taste+of+it.+%E2%80%98Tis+probable+that+God+told+Adam+of+this+tree+to+encourage+his+obedience.+He+might+tell+him+in+earnest+that+man+had+an+opportunity+of+obtaining+the+fruit+of+this+tree%2C+and+that+eternal+life+and+blessedness+of+which+it+was+a+seal%2C+by+what+he+himself+did%3B+an+obtaining+of+this+blessed+reward+was+in+his+power.%0A%0AIt+was+in+man%E2%80%99s+own+power+perfectly+to+obey+the+law+of+God%2C+which+is+not+in+our+power+now+since+the+fall%2C+as+it+was+more+in+man%E2%80%99s+power+perfectly+to+obey+the+law+and+persevere+in+it+then%2C+than+it+is+for+fallen+man+to+perform+one+act+of+sincere+obedience.+And+that%2C+upon+two+accounts%2C+viz.%0A%0A1.+As+he+had+no+sin+then+that+he+was+under+the+power+and+dominion+of.+We+can%E2%80%99t+obey+now+because+we+are+dead+in+trespasses%3B+Ephesians+2%3A1%2C+%E2%80%9Cand+you+hath+he+quickened%2C+who+were+dead+in+trespasses+and+sins.%E2%80%9D+We+are+stones%3B+our+hands+are+pinioned+by+strong+lusts.+But+our+first+parents%2C+they+were+free%2C+not+under+any+such+bondage.%0A%0A2.+Adam+had+a+sufficient+assistance+of+God+always+present+with+him+to+have+enabled+him+to+have+obeyed+if+he+had+used+his+natural+abilities+in+endeavouring+it%2C+as+he+might+do%2C+though+the+assistance+was+not+such+as+it+would+have+been+after+he+was+confirmed+to+render+it+impossible+for+him+to+sin.+Man+might+be+deceived+so+that+he+should+not+be+disposed+to+use+his+endeavours+to+persevere%2C+but+if+he+did+use+his+endeavours%2C+there+was+a+sufficient+assistance+always+with+him+to+enable+him+to+persevere.+So+that+man+had+a+very+fair+opportunity+of+obtaining+eternal+life+and+blessedness+under+the+first+covenant%2C+and+it+was+in+his+power+to+obtain+it+by+what+he+did+himself.%E2%80%9D%0A%0A%E2%80%94+Jonathan+Edwards%2C+East+of+Eden%2C+%281731%29+in+Mark+Valeri+%28ed.%29%2C+Sermons+and+Discourses%2C+1730-1733%3A+The+Works+of+Jonathan+Edwards+Vol

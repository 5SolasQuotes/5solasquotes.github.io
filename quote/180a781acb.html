<main class="wrap"><figure class="quote" id="q-180a781acb" data-kw="">
<blockquote><p>…our causuists… consider of the conception, either as it is before it receive life, or after that it is animated: Before it receive life, they are wont to determine, that howsoever it were no less than mortal sin, in a physician to prescribe a medicinal receit [prescription] to cause abortion, for the hiding of a sin, or any outward secular occasion, yet for the preservation of the life of the mother, in an extreme danger (I say, before animation) it might be lawful: But after life once received, it were an heinous sin to administer any such mortal remedy. The latter casuists are better advised; and justly hold that to give any such expelling or destructive medicine, with a direct intention to work an abortment (whether before or after animation) is utterly unlawful, and highly sinful: And with them I cannot but concur in opinion; For, after conception we know that naturally follows animation, there is only the time that makes the difference, which in this case is not so considerable as to take off a sin… …the Septuagint in their translation (as [Leonardus] Lessius well observes) have rendered that Mosaical law (in Ex. 21[:22-23]) concerning abortions, in these terms: ‘If a man strike a woman that is with child, and she make an abortion, if the child were formed, he shall give his life for the life of the child; if it were not formed, he shall be punished with a pecuniary mulct to her husband,’ applying that to the issue [the fetus] which the Vulgar Latin understands of the mother; and making the supposition to be of a formation and life, which the Latin more agreeably to the [Hebrew] original, makes to be ‘death’; and our English [KJV], with Castalion expresses by ‘mischief’: but whether the mischief be meant of the death of the mother or of the late-living issue, the Scripture has not declared: Cornelius à Lapide taking it expresly of the mother’s death, yet draws the judgement out, in an equal length to the death of the child, once animated; making no difference of the guilt; since the infant’s soul is of no less worth than her’s that beats him.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/joseph-hall.html">Joseph Hall</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Cases of Conscience Practically Resolved… (London, 1654), 2nd Decade, Case 3, ‘Whether may it be lawful, in case of extremity, to procure the abortion of the child for the preservation of the mother?’, pp. 90-91, 93-95. Hall was a godly Anglican bishop.</cite></span></figcaption>
<div class="meta"><span class="t"><a href="../topics/civil-government-and-society/life-birth-and-medical-ethics.html">Life, Birth and Medical Ethics</a></span></div>

</figure><figure class="quote" id="q-cd6d2ebebc" data-kw="">
<blockquote><p>The same command of fruitfulness that was given to man was also given to the land (Gen. 1:11-12; Psalm 107:37; Ezek. 36:29) and was called a blessing (Deut. 7:13; Ezek. 36:19). Is failing to make the land be fruitful every year a “despising of God’s blessings” or a violation of His Dominion Command? Obviously not. The land has been fruitful for six years, and taking a year off (spacing) in no way violates the command. If spacing crops does not violate the identical command to be fruitful and multiply, I fail to see how spacing children (whether by six months, 12 months, or more) violates that command. This is using the analogy of Scripture to understand the command to be fruitful and multiply… the [Levitical] law allowed the land to rest one year in seven… If the woman ‘who has many children has become feeble’ (1 Sam. 2:5), it might be time to let her strengthen… the burden of proof is upon those who say spacing babies is a sin… is it sinful to take days off beyond the Sabbath day in our yearly schedules?… What makes giving a very productive wife some rest from child-bearing a sin? Could this not justify spacing babies by one year or more to provide for the wife’s strength and health, and/or to save up money to be able to pay for the delivery costs of the next baby? Could it not be used to postpone having a child while the wife’s health was in jeopardy? If a woman was having chemotherapy for cancer, the chemo would endanger the baby’s life. This would certainly be a good time to exercise conception control.</p></blockquote>

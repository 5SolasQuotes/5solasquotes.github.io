<main class="wrap"><figure class="quote" id="q-09458604c9" data-kw="">
<blockquote><p>Idolatry is the giving of that honour and glory to any other, which is due only to God. And so, when the flatterers of Herod shouted, “It is the voice of a god and not of a man, immediately the angel of the Lord smote him because he gave not God the glory.” (Acts xii. 22-23.) And this was the very sin of the King of Babylon, and no doubt that which rendered the head of gold a part of the image. (See [Daniel 2] verses 28-30 and 34-37.) And this is the master sin, first of the human heart, then of each family, and lastly of kingdoms and empires, including their laws and customs, and whatever else may direct or control society.

And curious enough it is, that here also the corrupting tendency diverges into two separate currents, the one ending in an entire absence of every thing like an acknowledgment of God, and the other in the embodying of interested and corrupt ends under the cover of divine authority. The latter, as in forms of worship, is greatly more common than the other. Most nations embody their faith in their constitution, and some even allege the authority of the State to be divine; nevertheless that it is in all its leading features opposed to the will of God, and essentially an organized form of oppression, and thus instrumental in promoting rather than in restraining wickedness.

This alliance nevertheless gives stability to such governments, and, on the principle already referred to, namely, that the ends so served are natural to man, and are sought by him. And the analogy holds equally good in the other branch, for what is a government, simply expressive of a nation’s will, and without any acknowledgment of God, or any observance of his laws, but infidel? “The powers that be,” it is said, “are ordained of God.” This undoubted passage of Scripture is freely quoted in support of governments such as we have described; but it will not surely be maintained, that these “are ordained of God” for the purpose of governing independently of God, for the purpose of denying his moral government and enforcing laws in the very face of his express commands. Such a theory will not bear examination on general grounds, and far less can it stand with the express word of revelation. (See Romans xiii. 4, 2 Samuel xxiii. 3-4.)</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/duncan-macfarlan.html">Duncan MacFarlan</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Church and the World in The Free Church Pulpit; Consisting of Discourses by the Most Eminent divines of the Free Church of Scotland. Vol. I.</cite></span></figcaption>

</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-c555918365" data-kw="">
<blockquote><p>The apostle names three sorts of them [i.e. ‘divine canticles’], psalms, hymns, or praises, and odes, or songs… You have various examples of them all in the book of Psalms… It is with these sacred lyres, of which the word of Christ affords us both the matter and the form, that the apostle would have us solace ourselves. St. James gives us orders for it: ‘Is any among you merry? let him sings psalms,’ James 5:13. The apostle calls all these sonnets spiritual, both on account of their author, who is the Holy Spirit, and also of their matter, which concerns only divine and heavenly things, the glory of God, and our salvation…</p></blockquote>

</figure><figure class="quote" id="q-c841efac0c" data-kw="">
<blockquote><p>Therefore we shall learn out of this Scripture what things may lawfully be done of us without the breach of the commandment of rest. First of all such bodily labors are permitted, as do immediately and directly concern the worship of God, and without the which He cannot be served of us according to his Word: For this cause it was permitted unto the priests, nay they were commanded to slay beasts, and to prepare them for sacrifices, and offer them up according to the law, about the which they took so much the more pains upon that day than upon any other [day] of the week by how much the sacrifices were increased: for besides the daily sacrifices, morning and evening, there was a special sacrifice for the Sabbath, and all this being commanded in the law, our Savior Christ says [that] they in doing of it were blameless; therefore, whereas He says that the priests in the Temple break the Sabbath, He does not mean that they did so indeed: (For He affirms that they are blameless), but speaking according to the meaning of the Pharisees, who would condemn the fact of his disciples in gathering the ears of corn to satisfy their hunger, says, if every bodily labor be a breach of the Sabbath, then the priests in the temple brake it, but they are blameless in so doing; therefore they brake it not. Thus we do grant that men may travail [put forth work] to the places of Gods worship, where the public assemblies and meetings of the Church be, because otherwise they cannot join with them in the communion of the Word, sacraments and prayer, and though they be far distant in situation of dwelling from the common place of meeting, yet it is permitted unto them to travail by land, or by water, on horseback, or on foot thereunto; nay they are commanded to do it, and they may not under the color of a long journey tarry at home idly taking their ease. For even as the slaying of beasts is merely in its own nature a worldly and bodily labor, yet the temple which was sanctified did change the nature of it, and made it holy: so to travail and to ride, or go to and fro upon the Sabbath is altogether painful, and laborsome to the body, but to take this pains, to preach or to hear the word, makes it an holy work, and is warranted by the Scripture: as in this very place [Mt. 12:1-9], we see how our Savior Christ and his disciples travail from town to town to preach the Gospel, and take such pains that they are hungry and faint in the way.</p></blockquote>

</figure><figure class="quote" id="q-a3f3ca04c5" data-kw="">
<blockquote><p>Indeed, the true God, who is an infinite and incomprehensible Spirit, and the Persons of the most holy Trinity, whether jointly or separately, must not be fashioned and represented by any visible image, whether of things in heaven, or on earth or in the waters, or of any kind of imagined form whatsoever, either by painting, sculpting, or casting, or any other way, for any end and use, whether political or religious, public or private. But images, appearances, likenesses, figures and forms of this sort are wholly to be foregone, fled from, and abominated, as forbidden by the commandment of God, and contrary to the glory of the divine majesty.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/sebastian-beck.html">Sebastian Beck</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Theological Theses on Images</cite>, (Basil, 1620), thesis 4 Beck (1583-1654) was a reformed professor OT and NT at Basel.</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/worship/idolatry-and-images.html">Idolatry and Images</a></span></div>
<div class="actions"><button class="copy" data-copy="“Indeed, the true God, who is an infinite and incomprehensible Spirit, and the Persons of the most holy Trinity, whether jointly or separately, must not be fashioned and represented by any visible image, whether of things in heaven, or on earth or in the waters, or of any kind of imagined form whatsoever, either by painting, sculpting, or casting, or any other way, for any end and use, whether political or religious, public or private. But images, appearances, likenesses, figures and forms of this sort are wholly to be foregone, fled from, and abominated, as forbidden by the commandment of God, and contrary to the glory of the divine majesty.”

<blockquote><p>Because all the ceremonial law was enjoined to the Jews only, and not to the Gentiles; but this commandment of the holy Sabbath, as matrimony, was instituted of God in the state of innocency, when there was but one state of all men, and therefore enjoined to the Gentiles as well as to the Jews. So that all magistrates and householders were commanded to constrain all strangers, as well as their own subjects and family, to observe the holy Sabbath (Isa. lvi. 6), as appears by the fourth commandment, and the practice of Nehemiah (Neh. xiii. 19, &amp;c.)

All the ceremonies were a partition-wall to separate Jews and Gentiles (Eph. ii. 14;) but seeing the Gentiles are bound to keep this commandment as well as the Jews, it is evident that it is no Jewish ceremony. And seeing the same authority is for the Sabbath that is for marriage, a man may as well say that marriage is but a ceremonial law, as the Sabbath. And remember, that whereas marriage is termed but once the covenant of God (Prov. ii. 17), because instituted by God in the beginning (Matt. xix. 6, 8), the Sabbath is everywhere called “the Sabbath of the Lord thy God,” because ordained by God in the same beginning, both of time, state, and perpetuity: therefore not ceremonial.</p></blockquote>

<blockquote><p>It is a natural indicant sign of peace and reconciliation; used in those parts, as embracing, and shaking of hands, with us. But yet… this gesture is called holy, and the object of it is peace: Tis true: But all our civil actions ought to be such as becomes saints, i.e. so far holy for manner, that they be free from sin; and to the glory of God: many also have peace for their direct object.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/william-ames.html">William Ames</a></span><span class="wk"><span class="lbl">Work:</span> <cite>A Fresh Suit Against Human Ceremonies in God’s Worship, ‘An Addition of the two last reasons of the former reply’</cite>, pp. 340-43</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/worship/ceremonies-and-things-indifferent.html">Ceremonies and Things Indifferent</a></span></div>

<blockquote><p>§50. And whereas the king’s party usually say that it was the seditious preachers that stirred up the people, and were the cause of all this, I answer:

1. It is partly true and partly not: It is not true that they stirred them up to war (except an inconsiderable number of them, one perhaps in a county, if so much). But it is true that they discovered their dislike of the Book of Sports and bowing to altars, and diminishing preaching, and silencing ministers and such like; and were glad that the parliament attempted a reformation of them.

2. But then it is as true that almost all these were conformable ministers, the laws and bishops having cast out the nonconformists long enough before; insomuch that I know not of two nonconformists in a county. But those that made up the Assembly at Westminster, and that through the land were the honor of the parliament’s party, were almost all such as had till then conformed and took those things to be lawful in case of necessity, but longed to have that necessity removed.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/richard-baxter.html">Richard Baxter</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Reliquiæ Baxterianæ</cite>, (London: Parkhurst, 1696), bk. 1, pt. 1, p. 34</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/worship/ceremonies-and-things-indifferent.html">Ceremonies and Things Indifferent</a></span></div>

<blockquote><p>…in case a society of Christians should want [lack] the fruits of the vine of all sorts, I cannot think but it might be supplied by some composure as like unto it as could be made: and if any church labored under that invincible necessity, were it not safer for them to [yet] interpret that as a call and warrant to communicate [in the Supper], though wanting [lacking] the fruit of the wine, than to construct it [as] an authorizing them in a perpetual neglect of that sacrament?</p></blockquote>

<blockquote><p>The [opposing] Doctor takes needless pains to prove sitting in the act of receiving the sacramental elements of bread and wine, not to be necessary. For we hold not sitting in special [to be] absolutely necessary in the act of receiving, but [rather] a table-gesture in general, whether sitting or standing about the table, we hold necessary; howbeit not to the essence, yet to the right ministration of the sacrament. And of these two table gestures, we hold sitting most aggreeable to the institution: for Christ setting down before his apostles, a pattern, conformed whereunto they should celebrate that holy action thereafter, celebrated the same sitting: and this gesture ougt not to be changed, no not in another table gesture without some urgent necessity. To stand at the minister’s hand [giving the elements], or to take in passing by, we account [to be] no table-gesture; for there is no use in that case more of a table-gesture, than if it were a dressor, or cup-board; and that kind of gesture takes away the distribution of the communicants [between themselves], which is not taken away by standing about the table. … Casaubonus does acknowledge the gesture of Christ and his apostles at the Paschal supper to have been not a simple lying, but a gesture consisting partly of sitting, and lying… Seeing therefore the Hebrew, Chaldaic and Rabbinical writers do interpret the one word indifferently by the other [whether sitting or lying], our vulgar translators [of the Bible] have done right in expressing Christ’s gesture by the word ‘sitting’. The Doctor himself at Perth Assembly [1618] confessed that our gesture of upright sitting and his apostles’ gesture at the Paschal supper were analoga [analogous]. If Christ had celebrated the Paschal supper in the days of David [1 Sam. 4:18; 20:25-34] or Solomon [1 Kings 2:19; 10:19; 2 Kings 4:10; 2 Chron. 9:18], before the custom of sitting at table in beds entered among the Jews [as a cultural custom], He had used the gesture of upright sitting, as the Jews did then and as the Jews do at this day when they celebrate the Paschal supper.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/david-calderwood.html">David Calderwood</a></span><span class="wk"><span class="lbl">Work:</span> <cite>A Solution of Doctor Resolutus, his Resolutions for Kneeling</cite>, ([Amsterdam, 1619]), ch. 1, ‘A Table Gesture is Necessary’, pp. 5-6</span></figcaption>

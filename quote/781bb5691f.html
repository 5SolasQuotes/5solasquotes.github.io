<blockquote><p>…things at which offence is taken, first my petitioning for my life to the [usurped] parliament (so called)… to both which I shall give full satisfaction. About my petitioning, a double offence is taken, first at the titles of my petitions… I shall speak briefly to both, to take away any stumbling block out of the way of any. Touching the titles of my four petitions, they run in this form: ‘To the Supreme Authority, the Parliament of the Commonwealth of England’. Although I am far from going about to justify their right to this title to whom I give it, yet I shall justify the lawfulness of my practice in giving them this title which they assume to themselves, especially in a case of life [or death] as mine is: for in trivial matters I had rather lose my own right which belongs to me than give them this title which belongs not to them. The reasons which sway with me why I gave them this title (though I am not satisfied they have a right to it) are these:

1. They would not receive my petitions without giving them their assumed titles; yea to my knowledge they have rejected petitions which have not had these titles.

2. I am upon sure and clear grounds persuaded that giving to men titles they assume to themselves is not a real owning that they have a right to those titles. Titular and real are usually distinguished; by giving them the title of ‘Supreme Authority’ and ‘Parliament,’ I do acknowledge them a titular authority and a titular parliament, but by engaging [by an oath of allegiance] to them (which I have never done and I hope shall never do), I do acknowledge them a real authority and a real parliament. That I may further evince the truth of this second reason, viz. that giving of titles to men they assume to themselves, is not a real owning that they have a real right to those titles, I shall give sundry instances in Scripture to make it good: 2 Sam. 16, Hushai did call Absalom, that notorious usurper, ‘king,’ saying, ‘God save the king, God save the king,’ (an expression the people gave him), yet Hushai knew that David only was (even then) the lawful king of Israel set over him by God, and Absalom only an intruder, and made king by the tumults of the people; yea David himself did bid Hushai call Absalom (that usurper) ‘king,’ 2 Sam. 15:34, ‘Say to Absalom, ‘I will be thy servant O King.’ Yea further, David himself did call Absalom ‘king,’ 2 Sam. 15:19. David said to Hushai, ‘Return to thy place and abide with the king’ (that is with Absalom), yet he knew himself to be the lawful king and did not acknowledge that his son Absalom had any right to the kingdom, though he did give him the title of a king. So Athaliah’s usurping is called by the Spirit of God ‘reigning,’ yet the Spirit of God owns not her right to reign, but approved of the killing of her and the setting up [of] Jehoash, the true and lawful heir in her room. Yea Christ Himself called the Devil ‘the Prince of this World,’ Jn. 12:13 and 16 and 11, yet is it imaginable that Christ thought this title of right belonged to the Devil? Certainly no; Musculus on Jn. 12:31 well observes, non est ille (viz. Satan) Princeps mundi legitimus, sed per rapinam [‘He is not the legitimate prince of the world, but a robber’]. Paul called the devils ‘principalities and power,’ Eph. 6:12, yet none will be so shameless as to say that Paul thought this their rule, dominion and power of right belonged to them, but is merely usurped and intruded into. See annotations on the Bible on Eph. 6:12.

3. Titles are not always approbative, but distinctive; my meaning is that giving of titles to persons or things argues not one’s approving of a just right to those titles, but seems merely to distinguish those persons or things from others that are called by other names or titles, as I call them at Whitehall a ‘Council of State’ to distinguish them from a ‘Council of War’; I call those at Westminster the ‘Parliament of the Commonwealth,’ to distinguish them from the Lords and Commons assembled in Parliament.

4. Titles are giving to things or persons sometimes merely by allusion, not approbation, as in Scripture-phrase sin is said to ‘reign’ and the devils are said to ‘rule’, not that either the one or the other has an approved right to rule over man as a lawful prince has to rule over his subjects, but they are said to reign or rule by way of allusion to the reign of princes in their dominions.

5. Titles may be given without sin to persons or things, though of right they belong not to them, where they are generally received or mentioned by such titles by the people where I live. About names and titles much indulgence is to be given to the common usages and customs of the people; I may call things or persons by such names or titles as I know belongs not of right unto them, because they are ordinarily known and generally received by such names and titles. I could give manifold instances out of Scripture to prove this: David called Absalom ‘king’, not that he thought him so of right, but because he was commonly known and generally received by that title among the people. So Herod was called by the evangelist ‘King of the Jews’, so did the Jews generally call him by that title, yet none but that sect or sort of people called the Herodians did own it as Herod’s right to be the king of the Jews, who were so called because they pleaded for Herod to be the lawful king of the Jews, which the Pharisees and others withstood because he was not one of the Jewish nation as he ought to be, Dt. 17:15. Yet all the Jews called Herod ‘king’, though they did not acknowledge him to be their lawful king; tis manifest giving of titles are but titular acknowledgments and no more.

6. If names may without sin be given to places and things (which belong not to them), I see no reason why they may not be given to persons. There are names and titles given to many places both upon superstitious and idolatrous grounds, yet may without sin be used (I speak not of the first imposers) when those places are so called and commonly known by such names: Luke that writ the Acts of the Apostles, calls a place in Athens ‘Mars-hill’ (as it was commonly called) and this he might do without sin, though this name was originally imposed on that place in honor of Mars, yet he calls the place as it was commonly called, though called so upon an idolatrous ground, Acts 17:22. So for things also we may without sin call them by those names which others give them, though they may deal superstitiously or sinfully in the first imposition of such names. Thus Paul mentions a ship of Alexandria whose sign was Castor and Pollux, names originally imposed by the gentiles upon an idolatrous ground, yet being generally received, Paul calls the ship after this name.

7. It was a matter of absolute necessity (as to my life) for me to petition them, I being condemned to die; tis true for a trivial or ordinary occasion I should never petition them, but in an extraordinary case I might lawfully do it: David in a case of extreme necessity did eat the Show-bread, which in an ordinary case he might not do. Tis true indeed, Cato would not petition Caesar for his life, he had rather die than petition, but that I conceive was rather out of some animosity or height of spirit, or petty discontent, than out of a rectified judgment; for my part I am fully satisfied that I have not sinned in giving them their assumed titles; names and titles do not determine rights, conveniunt rebus nomina saepe suis [‘names often correspond to their things], it is true sometimes, but not always.

8. Titles men assume to themselves, or are generally given by others, may be given them by me without sin or without owning a right to those titles; this I may make appear by sundry late instances: Henry VIII [initially] had this title given him, ‘Defender of the Faith’, yet he had no right to this title, for he [at the beginning of his reign] defended only the Popish religion; he opposed the Faith rather than defended the Faith, and the true reason why the Pope gave him this title, ‘Defender of the Faith’, was because he opposed the doctrine of Luther and wrote against him [in 1521]; yet none scrupled to call him and the succeeding kings of England ‘the Defenders of the Faith’. So the king of Spain is called ‘the Catholic King’, yet he has no true right to this title, for he is not a catholic or universal monarch, yet our new State have lately sent to the king of Spain under this title, ‘The Catholic King’; so the king of France is called ‘the most Christian King’; so the Duke of Bavaria having by arms ejected the Palsgrave writes himself ‘Prince Elector Palatine of the Rhine’; so the King of Poland takes this title to himself, ‘King of Sweden’, yet has no right to that kingdom; yet none that ever I heard of scrupled to give these titles to them, considering that titles do not determine rights, and considering also that no addresses to them will be received by them unless the titles they assume to themselves be given them by those who make applications to them.</p></blockquote>

ge+them+a+real+authority+and+a+real+parliament.+That+I+may+further+evince+the+truth+of+this+second+reason%2C+viz.+that+giving+of+titles+to+men+they+assume+to+themselves%2C+is+not+a+real+owning+that+they+have+a+real+right+to+those+titles%2C+I+shall+give+sundry+instances+in+Scripture+to+make+it+good%3A+2+Sam.+16%2C+Hushai+did+call+Absalom%2C+that+notorious+usurper%2C+%E2%80%98king%2C%E2%80%99+saying%2C+%E2%80%98God+save+the+king%2C+God+save+the+king%2C%E2%80%99+%28an+expression+the+people+gave+him%29%2C+yet+Hushai+knew+that+David+only+was+%28even+then%29+the+lawful+king+of+Israel+set+over+him+by+God%2C+and+Absalom+only+an+intruder%2C+and+made+king+by+the+tumults+of+the+people%3B+yea+David+himself+did+bid+Hushai+call+Absalom+%28that+usurper%29+%E2%80%98king%2C%E2%80%99+2+Sam.+15%3A34%2C+%E2%80%98Say+to+Absalom%2C+%E2%80%98I+will+be+thy+servant+O+King.%E2%80%99+Yea+further%2C+David+himself+did+call+Absalom+%E2%80%98king%2C%E2%80%99+2+Sam.+15%3A19.+David+said+to+Hushai%2C+%E2%80%98Return+to+thy+place+and+abide+with+the+king%E2%80%99+%28that+is+with+Absalom%29%2C+yet+he+knew+himself+to+be+the+lawful+king+and+did+not+acknowledge+that+his+son+Absalom+had+any+right+to+the+kingdom%2C+though+he+did+give+him+the+title+of+a+king.+So+Athaliah%E2%80%99s+usurping+is+called+by+the+Spirit+of+God+%E2%80%98reigning%2C%E2%80%99+yet+the+Spirit+of+God+owns+not+her+right+to+reign%2C+but+approved+of+the+killing+of+her+and+the+setting+up+%5Bof%5D+Jehoash%2C+the+true+and+lawful+heir+in+her+room.+Yea+Christ+Himself+called+the+Devil+%E2%80%98the+Prince+of+this+World%2C%E2%80%99+Jn.+12%3A13+and+16+and+11%2C+yet+is+it+imaginable+that+Christ+thought+this+title+of+right+belonged+to+the+Devil%3F+Certainly+no%3B+Musculus+on+Jn.+12%3A31+well+observes%2C+non+est+ille+%28viz.+Satan%29+Princeps+mundi+legitimus%2C+sed+per+rapinam+%5B%E2%80%98He+is+not+the+legitimate+prince+of+the+world%2C+but+a+robber%E2%80%99%5D.+Paul+called+the+devils+%E2%80%98principalities+and+power%2C%E2%80%99+Eph.+6%3A12%2C+yet+none+will+be+so+shameless+as+to+say+that+Paul+thought+this+their+rule%2C+dominion+and+power+of+right+belonged+to+them%2C+but+is+merely+usurped+and+intruded+into.+See+annotations+on+the+Bible+on+Eph.+6%3A12.+3.+Titles+are+not+always+approbative%2C+but+distinctive%3B+my+meaning+is+that+giving+of+titles+to+persons+or+things+argues+not+one%E2%80%99s+approving+of+a+just+right+to+those+titles%2C+but+seems+merely+to+distinguish+those+persons+or+things+from+others+that+are+called+by+other+names+or+titles%2C+as+I+call+them+at+Whitehall+a+%E2%80%98Council+of+State%E2%80%99+to+distinguish+them+from+a+%E2%80%98Council+of+War%E2%80%99%3B+I+call+those+at+Westminster+the+%E2%80%98Parliament+of+the+Commonwealth%2C%E2%80%99+to+distinguish+them+from+the+Lords+and+Commons+assembled+in+Parliament.+4.+Titles+are+giving+to+things+or+persons+sometimes+merely+by+allusion%2C+not+approbation%2C+as+in+Scripture-phrase+sin+is+said+to+%E2%80%98reign%E2%80%99+and+the+devils+are+said+to+%E2%80%98rule%E2%80%99%2C+not+that+either+the+one+or+the+other+has+an+approved+right+to+rule+over+man+as+a+lawful+prince+has+to+rule+over+his+subjects%2C+but+they+are+said+to+reign+or+rule+by+way+of+allusion+to+the+reign+of+princes+in+their+dominions.+5.+Titles+may+be+given+without+sin+to+persons+or+things%2C+though+of+right+they+belong+not+to+them%2C+where+they+are+generally+received+or+mentioned+by+such+titles+by+the+people+where+I+live.+About+names+and+titles+much+indulgence+is+to+be+given+to+the+common+usages+and+customs+of+the+people%3B+I+may+call+things+or+persons+by+such+names+or+titles+as+I+know+belongs+not+of+right+unto+them%2C+because+they+are+ordinarily+known+and+generally+received+by+such+names+and+titles.+I+could+give+manifold+instances+out+of+Scripture+to+prove+this%3A+David+called+Absalom+%E2%80%98king%E2%80%99%2C+not+that+he+thought+him+so+of+right%2C+but+because+he+was+commonly+known+and+generally+received+by+that+title+among+the+people.+So+Herod+was+called+by+the+evangelist+%E2%80%98King+of+the+Jews%E2%80%99%2C+so+did+the+Jews+generally+call+him+by+that+title%2C+yet+none+but+that+sect+or+sort+of+people+called+the+Herodians+did+own+it+as+Herod%E2%80%99s+right+to+be+the+king+of+the+Jews%2C+who+were+so+called+because+they+pleaded+for+Herod+to+be+the+lawful+king+of+the+Jews%2C+which+the+Pharisees+and+others+withstood+because+he+was+not+one+of+the+Jewish+nation+as+he+ought+to+be%2C+Dt.+17%3A15.+Yet+all+the+Jews+called+Herod+%E2%80%98king%E2%80%99%2C+though+they+did+not+acknowledge+him+to+be+their+lawful+king%3B+tis+manifest+giving+of+titles+are+but+titular+acknowledgments+and+no+more.+6.+If+names+may+without+sin+be+given+to+places+and+things+%28which+belong+not+to+them%29%2C+I+see+no+reason+why+they+may+not+be+given+to+persons.+There+are+names+and+titles+given+to+many+places+both+upon+superstitious+and+idolatrous+grounds%2C+yet+may+without+sin+be+used+%28I+speak+not+of+the+first+imposers%29+when+those+places+are+so+called+and+commonly+known+by+such+names%3A+Luke+that+writ+the+Acts+of+the+Apostles%2C+calls+a+place+in+Athens+%E2%80%98Mars-hill%E2%80%99+%28as+it+was+commonly+called%29+and+this+he+might+do+without+sin%2C+though+this+name+was+originally+imposed+on+that+place+in+honor+of+Mars%2C+yet+he+calls+the+place+as+it+was+commonly+called%2C+though+called+so+upon+an+idolatrous+ground%2C+Acts+17%3A22.+So+for+things+also+we+may+without+sin+call+them+by+those+names+which+others+give+them%2C+though+they+may+deal+superstitiously+or+sinfully+in+the+first+imposition+of+such+names.+Thus+Paul+mentions+a+ship+of+Alexandria+whose+sign+was+Castor+and+Pollux%2C+names+originally+imposed+by+the+gentiles+upon+an+idolatrous+ground%2C+yet+being+generally+received%2C+Paul+calls+the+ship+after+this+name.+7.+It+was+a+matter+of+absolute+necessity+%28as+to+my+life%29+for+me+to+petition+them%2C+I+being+condemned+to+die%3B+tis+true+for+a+trivial+or+ordinary+occasion+I+should+never+petition+them%2C+but+in+an+extraordinary+case+I+might+lawfully+do+it%3A+David+in+a+case+of+extreme+necessity+did+eat+the+Show-bread%2C+which+in+an+ordinary+case+he+might+not+do.+Tis+true+indeed%2C+Cato+would+not+petition+Caesar+for+his+life%2C+he+had+rather+die+than+petition%2C+but+that+I+conceive+was+rather+out+of+some+animosity+or+height+of+spirit%2C+or+petty+discontent%2C+than+out+of+a+rectified+judgment%3B+for+my+part+I+am+fully+satisfied+that+I+have+not+sinned+in+giving+them+their+assumed+titles%3B+names+and+titles+do+not+determine+rights%2C+conveniunt+rebus+nomina+saepe+suis+%5B%E2%80%98names+often+correspond+to+their+things%5D%2C+it+is+true+sometimes%2C+but+not+always.+8.+Titles+men+assume+to+themselves%2C+or+are+generally+given+by+others%2C+may+be+given+them+by+me+without+sin+or+without+owning+a+right+to+those+titles%3B+this+I+may+make+appear+by+sundry+late+instances%3A+Henry+VIII+%5Binitially%5D+had+this+title+given+him%2C+%E2%80%98Defender+of+the+Faith%E2%80%99%2C+yet+he+had+no+right+to+this+title%2C+for+he+%5Bat+the+beginning+of+his+reign%5D+defended+only+the+Popish+religion%3B+he+opposed+the+Faith+rather+than+defended+the+Faith%2C+and+the+true+reason+why+the+Pope+gave+him+this+title%2C+%E2%80%98Defender+of+the+Faith%E2%80%99%2C+was+because+he+opposed+the+doctrine+of+Luther+and+wrote+against+him+%5Bin+1521%5D%3B+yet+none+scrupled+to+call+him+and+the+succeeding+kings+of+England+%E2%80%98the+Defenders+of+the+Faith%E2%80%99.+So+the+king+of+Spain+is+called+%E2%80%98the+Catholic+King%E2%80%99%2C+yet+he+has+no+true+right+to+this+title%2C+for+he+is+not+a+catholic+or+universal+monarch%2C+yet+our+new+State+have+lately+sent+to+the+king+of+Spain+under+this+title%2C+%E2%80%98The+Catholic+King%E2%80%99%3B+so+the+king+of+France+is+called+%E2%80%98the+most+Christian+King%E2%80%99%3B+so+the+Duke+of+Bavaria+having+by+arms+ejected+the+Palsgrave+writes+himself+%E2%80%98Prince+Elector+Palatine+of+the+Rhine%E2%80%99%3B+so+the+King+of+Poland+takes+this+title+to+himself%2C+%E2%80%98King+of+Sweden%E2%80%99%2C+yet+has+no+right+to+that+kingdom%3B+yet+none+that+ever+I+heard+of+scrupled+to+give+these+titles+to+them%2C+considering+that+titles+do+not+determine+rights%2C+and+considering+also+that+no+addresses+to+them+will+be+received+by+them+unless+the+titles+they+assume+to+themselves+be+given+them+by+those+who+make+applications+to+them.%E2%80%9D%0A%0A%E2%80%94+Christopher+Love%2C+A+Clear+%26+Necessary+Vindication+of+the+Principles+%26+Practices+of+me%2C+Christopher+Love%2C+since+my+trial+before%2C+and+condemnation+by+the+High+Court+of+Justice%2C+%28London%2C+1651%29%2C+pp.+1-3&amp;url=https%3A%2F%2F5solasquotes.github.io%2Fquote%2F781bb5691f.html&amp;via=5Solas" target="_blank" rel="noopener">Share on X</a><a class="perma" href="../quote/781bb5691f.html">Permalink</a><a class="src" href="https://reformedbooksonline.com/on-the-ethics-of-usurped-powers/#:~:text=things%20at%20which%20offence%20is%20taken,those%20who%20make%20applications%20to%20them&amp;text=things%20at%20which%20offence%20is%20taken%2C%20first%20my&amp;text=them%20by%20those%20who%20make%20applications%20to%20them" rel="noopener" target="_blank">Read it online · Reformed Books Online</a></div>

<blockquote><p>…and came with his family to Broad Oak… and did not preach for a great while… expecting that God would yet open a door of return to former public liberty, which he much desired and prayed for; and in hopes of that, was backward to fall into the stated exercise of his ministry otherwise, as were all the sober nonconformists generally in those parts, but it was his grief and burden that he had not an opportunity of doing more for God. He has scarce one talent of opportunity, but that one he was very diligent and faithful in the improvement of… ‘I own myself a minister of Christ, yet do nothing as a minister. What will excuse me? Is it enough for me to say, ‘Behold I stand in the market-place, and no man has hired me?’ And he comforts himself with this appeal; ‘Lord, Thou knowest what will I have to thy work, public or private, if I had a call and opportunity. And shall this willing mind be accepted?’… In these circumstances of silence and restraint… It is obvious, he writes, to observe at four several times, and upon four several occasions, ministers have been silenced and turned out of their places; and yet still, after a time, more or less restored again.

1. In Queen Mary’s days, because they would not close with Popery at the return of it. But that interdict lasted under five years, being taken off upon Queen Elizabeth’s coming to the throne.

2. In Queen Elizabeth’s, King James’s and King Charles’s days, because they could not conform to the hierarchy and ceremonies; and this interdict lasted long, even till the long Parliament, A.D. 1640; but it was then taken off.

3. Under the long Parliament many ministers were sequestered and silenced for malignancy and not covenanting [under the Solemn League and Covenant, 1643; Philip Henry did not hold to the SL&amp;C].

4. Many others, after the King’s death [1649], for not engaging to be true to the Commonwealth [under Oliver Cromwell, 1649-1658], as then established; both which restraints, though much remitted before, yet quite ceased at the coming in of the King [Charles II], A.D. 1660. And now more ministers are silenced, and with more severity than ever, by the Act of August 24 [1662]. And who among us can tell for how long? This only I know, ‘He who hath delivered, doth deliver.’ Script. March 31, 1663.</p></blockquote>

<blockquote><p>When our Saviour Christ (who being such an extraordinary Person, might have warrant to do what would have been presumption in any other) was appealed to in a cause that appertained to the civil magistrate’s decision, He refused to deal in it with these words, ‘Who made me a judge or a divider over you?’ according to which words of Him who was the truth, he that may rule must be placed in that office by some body and may not undertake it of himself: no man may take this honor to himself or be his own advancer to the throne; but he must be installed by another: and what other creature, besides the nation itself can challenge a power to appoint over it its rulers is not to me imaginable. Angels are not of this economy, do not intermeddle in this business, and for other people, or foreign states, they are but in an equality, and have no partnership in this matter; they have no more to do to impose governors over their neighbors than they have reciprocally over them… A calling from the people who are to be subject, being so necessary and essential to a humanly constituted magistracy, it is easy to discern what is usurpation, viz: that which is opposite to it, or privative thereof, which is a snatching hold of the scepter and wresting it out of the hands of those who are to dispose of it or have it committed to them…</p></blockquote>

<div class="actions"><button class="copy" data-copy="“When our Saviour Christ (who being such an extraordinary Person, might have warrant to do what would have been presumption in any other) was appealed to in a cause that appertained to the civil magistrate’s decision, He refused to deal in it with these words, ‘Who made me a judge or a divider over you?’ according to which words of Him who was the truth, he that may rule must be placed in that office by some body and may not undertake it of himself: no man may take this honor to himself or be his own advancer to the throne; but he must be installed by another: and what other creature, besides the nation itself can challenge a power to appoint over it its rulers is not to me imaginable. Angels are not of this economy, do not intermeddle in this business, and for other people, or foreign states, they are but in an equality, and have no partnership in this matter; they have no more to do to impose governors over their neighbors than they have reciprocally over them… A calling from the people who are to be subject, being so necessary and essential to a humanly constituted magistracy, it is easy to discern what is usurpation, viz: that which is opposite to it, or privative thereof, which is a snatching hold of the scepter and wresting it out of the hands of those who are to dispose of it or have it committed to them…”

<blockquote><p>Thirdly, it is cleared in this discourse that those who have gotten to be powers (though by force) yet ought to give justice to those whose government they have undertaken. And again, that the people may lawfully demand it. But is it possible that one or a few persons in supreme power can distribute justice to a whole nation without subordinate agents? So that to say, ‘None may lawfully act under the supreme power in distributing of justice, and government,’ were to say upon the matter that he should give no justice, and that the people should have no justice at all. And then how absurd is it to teach that the people may lawfully seek justice of him which they cannot receive? and that he is bound to give justice, but none are allowed by whom he may give it? Fourthly, this doctrine of not acting is the very doctrine of levelling. For when no man may act to give justice, may not every man take freely from his neighbor what he list, and so level the rich with the poor? unless this make it unlikely, because worse than levelling, that those who have most force will have most; yea some all, and others nothing; and so to avoid acting under a supposed tyrannical government unto justice and order; there shall be tyrants in every place or parish, who shall act to disorder and oppression, and no property, justice, nor government at all left amongst us. And surely I think David out of his love to Israel would not have wished such an estate to Israel under Absalom, had he the whole in possession and himself no force on foot to recover it; nor would he have desired such an unsettlement to procure his settlement. And hence arises that which they call an interpretative consent of the people; because it is understood and supposed that every rational man does consent, that there should be order, property and right given to every member of a commonwealth under a tyrant, rather than all to be under confusion oppression, robberies and murders. Fifthly, how could Ezra and Nehemiah justify their acting under the Persian monarch, who had no right to the crown of Judah either by blood or just conquest (Ezra 7:25)? Yet Ezra was authorized by him to set magistrates, fine and imprison and put to death (Ezra 10:7-8); And he exercises authority, in making the people of Israel to swear and to enter into a covenant, and in sending forth a proclamation to all the children of the captivity, that they should gather themselves together to Jerusalem; And that whosoever would not come within three days, all his substance should be forfeited. Nehemiah also acts as governor, and rebukes the nobles and rulers and sets a great assembly against them because of their usury. He also called the priests and took an oath to perform the promise of leaving that usury (Neh. 5. •. etc.). He acknowledges also that he was governor there about twelve years, and he gave his brother Hanani and Hanaiah ruler of the palace charge over Jerusalem (Neh. 7:2). So he did both act himself and others acted under him. We find also that at that time there were rulers of the people that dwelt at Jerusalem, and Nehemiah contended with the rulers and nobles, made treasurers, commanded the gates to be shut before the Sabbath, threatened to lay hands on the merchants that lay at the gates, smote certain of the Jews and plucked off their hair because having married wives of Ashdod, their children spake half in the language of Ashdod (Neh. 13). Sixthly, let us hear what before these times and before our case was in being hath been taught in point of acting; and upon what grounds it has been approved. An author eminently learned and skillful in the doctrine of lawgiving says thus: ‘No man may punish or condemn another even with a just punishment, except he have public power, which a tyrant cannot give. But in this there must be a consideration or subdistinction. For in rigor this is true as to the tyrant’s part; yet it so happens that the commonwealth because it cannot resist him, does tolerate him, and suffers itself to be governed by him; and does tacitly consent, and will that justice be administered by him, for the reason already touched, because it is a less evil to be governed by him, than altogether to want just coaction and direction; and then it shall not be a sin to obey even in the things aforesaid, because the consent of the commonwealth does supply the defect of the tyrant’s power.’ (Suarez, De Leg., bk. 3, ch. 10) Another thus: ‘That his sentences are valid, is proved. Because his sentences, and just commands although they have not force from a tyrannical power, yet they have it from elsewhere. First, and inchoatively from the law of nature, which such a state of things being supposed, does dictate that obedience must be given for the common good, otherwise all will be full of thefts and robberies. Secondly, and completely from the commonwealth; and that either because while that state endures, it gives authority to him by a tacit consent, while it will’s that he administer justice, and use his usurped office in a due manner, or rather because it does tacitly approve his commands, and acts being agreeable to the laws and common good, and will’s that his just sentences, whereby the suites of the people are decided, and the guilty are punished, shall be valid and bind the subjects; for except they were valid and did bind, no man would obey, but only in show but every man would secretly do the contrary with a great inconvenience to the commonwealth. Now the commonwealth may give this force to the sentences, and acts of a tyrant, because it is superior to all single persons, though it be oppressed with tyranny, and may account the just sentence of a tyrant as its own.’ (Lessius, De Justitia &amp; Jure, bk. 2, ch. 25, Dubitat. 9) Thou wilt ask whether a tyrant do sin the sin of murder, and be bound to restitution, if he put to death guilty persons, or deprive them of their goods according to law? I answer negatively; because the commonwealth does tacitly give him authority hereunto, while it does consent and desire that this should be done by him. Thus is the authority of acting in this case grounded upon a tacit or implied consent, which consent is the very dictate of nature or common reason, because it is better to have some justice than none at all, some coercive power and government than that all be left to disorder, violence and confusion.</p></blockquote>

stood+and+supposed+that+every+rational+man+does+consent%2C+that+there+should+be+order%2C+property+and+right+given+to+every+member+of+a+commonwealth+under+a+tyrant%2C+rather+than+all+to+be+under+confusion+oppression%2C+robberies+and+murders.+Fifthly%2C+how+could+Ezra+and+Nehemiah+justify+their+acting+under+the+Persian+monarch%2C+who+had+no+right+to+the+crown+of+Judah+either+by+blood+or+just+conquest+%28Ezra+7%3A25%29%3F+Yet+Ezra+was+authorized+by+him+to+set+magistrates%2C+fine+and+imprison+and+put+to+death+%28Ezra+10%3A7-8%29%3B+And+he+exercises+authority%2C+in+making+the+people+of+Israel+to+swear+and+to+enter+into+a+covenant%2C+and+in+sending+forth+a+proclamation+to+all+the+children+of+the+captivity%2C+that+they+should+gather+themselves+together+to+Jerusalem%3B+And+that+whosoever+would+not+come+within+three+days%2C+all+his+substance+should+be+forfeited.+Nehemiah+also+acts+as+governor%2C+and+rebukes+the+nobles+and+rulers+and+sets+a+great+assembly+against+them+because+of+their+usury.+He+also+called+the+priests+and+took+an+oath+to+perform+the+promise+of+leaving+that+usury+%28Neh.+5.+%E2%80%A2.+etc.%29.+He+acknowledges+also+that+he+was+governor+there+about+twelve+years%2C+and+he+gave+his+brother+Hanani+and+Hanaiah+ruler+of+the+palace+charge+over+Jerusalem+%28Neh.+7%3A2%29.+So+he+did+both+act+himself+and+others+acted+under+him.+We+find+also+that+at+that+time+there+were+rulers+of+the+people+that+dwelt+at+Jerusalem%2C+and+Nehemiah+contended+with+the+rulers+and+nobles%2C+made+treasurers%2C+commanded+the+gates+to+be+shut+before+the+Sabbath%2C+threatened+to+lay+hands+on+the+merchants+that+lay+at+the+gates%2C+smote+certain+of+the+Jews+and+plucked+off+their+hair+because+having+married+wives+of+Ashdod%2C+their+children+spake+half+in+the+language+of+Ashdod+%28Neh.+13%29.+Sixthly%2C+let+us+hear+what+before+these+times+and+before+our+case+was+in+being+hath+been+taught+in+point+of+acting%3B+and+upon+what+grounds+it+has+been+approved.+An+author+eminently+learned+and+skillful+in+the+d lth+may+give+this+force+to+the+sentences%2C+and+acts+of+a+tyrant%2C+because+it+is+superior+to+all+single+persons%2C+though+it+be+oppressed+with+tyranny%2C+and+may+account+the+just+sentence+of+a+tyrant+as+its+own.%E2%80%99+%28Lessius%2C+De+Justitia+%26+Jure%2C+bk.+2%2C+ch.+25%2C+Dubitat.+9%29+Thou+wilt+ask+whether+a+tyrant+do+sin+the+sin+of+murder%2C+and+be+bound+to+restitution%2C+if+he+put+to+death+guilty+persons%2C+or+deprive+them+of+their+goods+according+to+law%3F+I+answer+negatively%3B+because+the+commonwealth+does+tacitly+give+him+authority+hereunto%2C+while+it+does+consent+and+desire+that+this+should+be+done+by+him.+Thus+is+the+authority+of+acting+in+this+case+grounded+upon+a+tacit+or+implied+consent%2C+which+consent+is+the+very+dictate+of+nature+or+common+reason%2C+because+it+is+better+to+have+some+justice+than+none+at+all%2C+some+coercive+power+and+government+than+that+all+be+left+to+disorder%2C+violence+and+confusion.%E2%80%9D%0A%0A%E2%80%94+Francis+Rouse%2C+The+Lawfulness+of+Obeying+the+Present+Government%E2%80%A6+%28London%2C+1649%29%2C+pp.+16-19+Rouse+was+a+Westminster+divine.&amp;url=https%3A%2F%2F5solasquotes.github.io%2Fquote%2F8a06baff06.html&amp;via=5Solas" target="_blank" rel="noopener">Share on X</a><a class="perma" href="../quote/8a06baff06.html">Permalink</a><a class="src" href="https://reformedbooksonline.com/on-the-ethics-of-usurped-powers/#:~:text=Thirdly%2C%20it%20is%20cleared%20in%20this,left%20to%20disorder%2C%20violence%20and%20confusion&amp;text=Thirdly%2C%20it%20is%20cleared%20in%20this%20discourse%20that&amp;text=all%20be%20left%20to%20disorder%2C%20violence%20and%20confusion" rel="noopener" target="_blank">Read it online · Reformed Books Online</a></div>
</figure><figure class="quote" id="q-dbdf8c5578" data-kw="">
<blockquote><p>But this is not all the usurpers that rose up in those days. Eugenius [the usurper] soon becomes more terrible than he (who once was but a schoolmaster). And how does this loyal St. Ambrose carry it? When he had got of Theodosius a pardon for all that took part with Maximus, even his army except two or three, yea and benefits too, yet did not this holy loyal man think it sinful to write thus to the tyrant Eugenius (Epistles, bk. 2, p. 103), Clementissimo Imperatori Eugenio, Ambrosius Episcopus, ‘Bishop Ambrose to the most clement emperor Eugenius.’ And thus concludes: In his vero in quibus vos rogari decet, etiam exhibere sedulitatem potestati debitam▪ sicut et scriptum est, cui honorem, honorem, cui tributum, tributum: Nam cum privato detulerim corde intimo, quomodo non deferrem Imperatori? i.e. ‘But in these matters where it becomes us to petition you, we must also give the diligence due to power: as it is written, honor to whom honor, tribute to whom tribute: For when I honored you, when you were a private man from the inwards of my heart, how should I not honor you an emperor?’</p></blockquote>

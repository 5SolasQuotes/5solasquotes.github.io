<main class="wrap"><figure class="quote" id="q-f7daa124ec" data-kw="">
<blockquote><p>Listen to this: For Christ alone it is proper to help and save others with His merits and works. The works of others are of benefit to no one, not to themselves either; for the statement stands: “The just shall live by faith” (Romans 1:17). For faith grounds us on the works of Christ, without our own works, and transfers us from the exile of our sins into the kingdom of His righteousness. This is faith; this is the Gospel; this is Christ.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/martin-luther.html">Martin Luther</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Day by Day: 365 Devotional Readings with Martin Luther. Concordia Publishing House. Kindle Edition. From Judgment of Martin Luther on Monastic Vows</cite>, (WLS, p. 922, no. 2891)</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/good-works/merit-and-reward.html">Merit and Reward</a></span></div>

</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-652eea1381" data-kw="">
<blockquote><p>The eighth question is, whether Christ by his obedience merited anything for Himself. Here Quenstedt attacks Lombard, Thomas, Socinus, and others, That Christ merited only for us follows not only from the dignity of his Person, but from the communicatio idiomatum, whereby his human nature (except so far as our redemption required) lacked nothing. Besides, if He merited worship for Himself, how then could He have been worshipped in his earthly life? Moreover, as his merit and satisfaction are really one, if He merited for Himself, then He also satisfied for Himself. As to the name above every name, He had it already by right. Quenstedt repeats against the Romanists the argument of Calvin, that they confound the relation of antecedent and consequent with that of cause and effect. To the Socinian argument, that if Christ did not merit for Himself He could not merit for us, he replies that He could do this, just because He was not mere man, but God.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/english.html">Robert Franks</a></span><span class="wk"><span class="lbl">Work:</span> <cite>A History of the Doctrine of the Work of Christ</cite>, On Quenstedt</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/good-works/merit-and-reward.html">Merit and Reward</a></span></div>

</figure><figure class="quote" id="q-9713d497d0" data-kw="">
<blockquote><p>Nor ought it to be doubted that condign merit can vary in these three ways. For if some work were much inferior to the reward promised by agreement—as if the lord of a vineyard hired laborers and promised as wages, not a denarius a day, but a hundred gold pieces—such merit would be ex condigno by reason of the pact, not by reason of the work. Conversely, if the work were really equal to the reward, or perhaps even greater, but no agreement had intervened, then if such merit ought to be called ex condigno, it would have to be called ex condigno by reason of the work, not by reason of the pact. … Finally, if a pact both intervenes and the work is truly equal to the reward, as when laborers are hired for the vineyard for a denarius a day according to the Gospel, that merit will be ex condigno by reason of the work and by reason of the pact.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/robert-bellarmine.html">Robert Bellarmine</a></span><span class="wk"><span class="lbl">Work:</span> <cite>De Justificatione</cite>, 5.17 (translated from the Latin)</span></figcaption>

</figure><figure class="quote" id="q-a702a69ba8" data-kw="">
<blockquote><p>Since the initiative belongs to God in the order of grace, no one can merit the initial grace of forgiveness and justification, at the beginning of conversion. Moved by the Holy Spirit and by charity, we can then merit for ourselves and for others the graces needed for our sanctification, for the increase of grace and charity, and for the attainment of eternal life. Even temporal goods like health and friendship can be merited in accordance with God&#x27;s wisdom.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/catholic-church.html">Catholic Church</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Catechism of the Catholic Church</cite>, §2010</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/good-works/merit-and-reward.html">Merit and Reward</a></span><span class="t"><a href="../topics/good-works/merit-and-reward.html">Merit and Reward</a> › <a href="../topics/good-works/merit-and-reward/merit-of-condignity-and-congruity.html">Merit of condignity and congruity</a></span><span class="t"><a href="../topics/rome/justification.html">Rome: Justification</a> › <a href="../topics/rome/justification/merit.html">Merit</a></span></div>

</figure><figure class="quote" id="q-e7761df9a8" data-kw="">
<blockquote><p>But 2. let us understand that according to works signifies an analogy or measure of good works and of evil, as it may fitly be understood, and we also have elsewhere interpreted. There is then an ambiguity in the word ‘analogy,’ or ‘proportion,’ and we must distinguish between a proportion causal, meritorious, and a proportion-conditional. A causal, meritorious proportion of works and reward is when greater or lesser works are the cause or merit of a greater or lesser reward. A conditional proportion is when greater or lesser works are not the cause or merit, but only the position of the condition under which a greater or lesser reward is to be had. In evil works or sins, there are both proportions, causal or meritorious, and conditional of the works to the reward. Of good works, this proposition is false: ‘According to whose proportion eternal life is promised, that is meritorious of eternal life.’ For here is understood not a causal, but a conditional proportion, etc. For they have not the conditions of merit properly so called; but they are the position (or performing) of the condition on which God does promise and distribute the rewards of eternal life and glory.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/david-pareus.html">David Pareus</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Bellarmine Castigated, ‘On Justification’</cite>, bk. 5, ch. 3, pp. 1245-46 in Richard Baxter’s Confession of his Faith… (London: 1655), ch. 10, sect. 3, p. 405</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/good-works/merit-and-reward.html">Merit and Reward</a></span></div>

<main class="wrap"><figure class="quote" id="q-a3dd9dfdb1" data-kw="">
<blockquote><p>XVI. Fourth, the moral law (which is the pattern of God’s image in man) ought to correspond with the eternal and archetypal law in God, since it is its copy and shadow (aposkimation), in which he has manifested his justice and holiness. Hence we cannot conform ourselves to the image of God (to the imitation of which Scripture so often exhorts us) except by regulating our lives in accordance with the precepts of this law.

So when its observation in enjoined, the voice is frequently heard, “Be ye holy, for I am holy.” Now this law is immutable and perpetual. Therefore the moral law (its ectype) must necessarily also be immutable.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/francis-turretin.html">Francis Turretin</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Institutes of Elenctic Theology</cite>, trans. George M. Giger, ed. James T. Dennison (1679-85; 3 vols, Phillipsburg NJ: Presbyterian &amp; Reformed, 1992), 11.2.16.</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/the-law-of-god.html">The Law of God</a></span></div>

</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-f32f3548f9" data-kw="">
<blockquote><p>The basic principle in application is to know whether the passage is a statement of the law or of the gospel. For when the Word is preached, the law and the gospel operate differently. The law exposes the disease of sin, and as a side-effect, stimulates and stirs it up. But it provides no remedy for it. However the gospel not only teaches us what is to be done, it also has the power of the Holy Spirit joined to it….A statement of the law indicates the need for a perfect inherent righteousness, of eternal life given through the works of the law, of the sins which are contrary to the law and of the curse that is due them…. By contrast, a statement of the gospel speaks of Christ and his benefits, and of faith being fruitful in good works</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/william-perkins.html">William Perkins</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Art of Prophesying</cite>, (1592). Reprinted, Edinburgh: Banner of Truth Trust, 1996, 54-55.</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/the-law-of-god.html">The Law of God</a></span></div>

</figure><figure class="quote" id="q-45975e8e8a" data-kw="">
<blockquote><p>If then a man cannot distinguish aright between the law and the gospel, he cannot rightly understand as much as a single article of divine truth. If he does not have spiritual and just apprehensions of the holy law, he cannot have spiritual and transforming discoveries of the glorious gospel; and on the other hand, if his view of the gospel is erroneous or wrong, his notions of the law cannot be right.</p></blockquote>

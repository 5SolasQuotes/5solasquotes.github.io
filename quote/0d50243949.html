<main class="wrap"><figure class="quote" id="q-0d50243949" data-kw="">
<blockquote><p>But some will say to work righteousness cannot be a work of faith, for the very heathen, which never heard of Christ, by the light of nature have done justice, and are highly commended by heathen writers for the same. Now, that which the heathen can do by the light of nature, is not thus to be extolled as a fruit of faith?

Answer. True it is, the heathen have done many works of justice. But we must wisely consider that every just work is not a fruit of faith, unless it be done by a righteous person in obedience to God and for His glory. But in all these, the heathen failed in their works. For, though the thing they did were good in themselves; yet, seeing the heathen were corrupt trees, remaining in the sinful state of corrupt nature, their works must needs be corrupt fruit, as coming from them. For an evil tree cannot bring forth good fruit.

The heart is the fountain of every action. Now their hearts were corrupt, being destitute of faith which purifies the heart. And therefore their works must needs be sinful. Again, they did not their works in obedience, for they were guided only by the light of nature, and knew not God aright, nor His commandments. And lastly, they propounded not the glory of God, as the end of their works, but the praise of men, their own profit, or some such end. But these worthy persons do not only such things as were just in themselves, but they do them in faith, in obedience, and for God’s glory, and so please God.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/william-perkins.html">William Perkins</a></span><span class="wk"><span class="lbl">Work:</span> <cite>A Cloud of Faithful Witnesses, Leading to the Heavenly Canaan: Or, A Commentary upon the 11th Chapter to the Hebrews</cite>, (1609) in The Works of William Perkins: Volume 3, eds Randall J. Pederson and Ryan M. Hurd (Grand Rapids: Reformation Heritage Books, 2017), p. 353.</span></figcaption>

</figure><figure class="quote" id="q-768697dee9" data-kw="">
<blockquote><p>Although Justification be a Court action, and drawn from judicatories, yet God is not in this action, considered merely as a Judge, but as paternus Judex, a fatherly Judge, having an admirable temperament of justice and mercy, so that God pronounceth this sentence from the Throne of Justice and Mercy also; of Justice, in that he will not absolve, till satisfaction be made, and he will not pronounce righteous, but where there is a perfect righteousness:

Therefore that opinion, of making Faith to be accepted of for righteousness is a dangerous and false assertion. God in this work of Justification, is never described, as accepting of an imperfect righteousness for a perfect. No, God doth not cease to be just, while he is thus gracious.

Again his Justice and righteousness is herein seen, that none shall be Justified, but such sinners who feel their guilt, and desire to be eased of that burden, believing and rolling their souls upon him. It is very hard to give the right order of the benefits of Vocation, Justification, Adoption and Sanctification; but yet this may be made good against the Antinomian, that a man is not Justified, till repenting and believing. Here is Justice then but there is also a great deal of Grace and Mercy[.]

As in the accepting of a surety for us, that he would not keep to the Law, of having us in our own persons to pay the utmost farthing: This was great love; so likewise to find out a way for our reconciliation; that when the devils had no remedy provided for them, we have. Further, that when this price is laid down, we have the application of this benefit, and so many thousands have not. Two in a Bed, in a Family, in a Parish, one Justified, and the other condemned; What Grace is this?</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/anthony-burgess.html">Anthony Burgess</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The true doctrine of justification asserted and vindicated, from the errors of Papists, Arminians, Socinians, and more especially Antinomians in XXX lectures preached at Lawrence-Jury, London</cite>, (2nd edn, London: Tho. Underhill, 1651), p. 12.</span></figcaption>

</figure><figure class="quote" id="q-289bf00ef4" data-kw="">
<blockquote><p>By his good works the just man may merit for himself many graces and favours, not, however, by right and justice (de condigno), but only congruously (de congruo). Most theologians incline to the opinion that the grace of final perseverance is among the objects of congruous merit, which grace, as has been shown above, is not and cannot be merited condignly.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/joseph-pohle.html">Joseph Pohle</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Catholic Encyclopedia</cite>, s.v. “Merit” (1911)</span></figcaption>

</figure><figure class="quote" id="q-6876250b9b" data-kw="">
<blockquote><p>Hence, it is also manifest that if any good quality or work of ours were made the condition of our justification or title to eternal life, this would turn the covenant of grace exhibited in the gospel into a covenant of works. The covenant of grace revealed and offered to sinners in the gospel is the only covenant according to which a sinner can be justified and entitled to life eternal. It is absolutely impossible that he can be justified according to the broken covenant of works. But were any graces, acts, or works of his the proper conditions of his justification, the covenant of grace would be as much a covenant of works as ever the covenant made with Adam was. The condition of Adam’s covenant was perfect obedience, and according to this imaginary law of easier terms, the conditions of the covenant of grace are sincere faith and sincere obedience.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/john-colquhoun.html">John Colquhoun</a></span><span class="wk"><span class="lbl">Work:</span> <cite>A Treatise on the Law and Gospel</cite>, (Grand Rapids: Reformation Heritage Books), 102.</span></figcaption>

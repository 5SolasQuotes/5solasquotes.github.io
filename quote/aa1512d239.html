<blockquote><p>Writing in the late 1820s (the Reformed Presbyterian reprinted his writings much later), William MacKray warned the Scottish Voluntaryists to look to the United States of America as an example of the wickedness that the implementation of Voluntaryism would lead to:

And, my brethren, we are not left on this subject to reasoning of a merely inferential nature. There is one country in which the new scheme has been tried-and not only so, but tried in contrast with the opposite plan. That country you are aware, is America-the region which we now hear so often and ignorantly eulogised, as the land where freedom is triumphing and religion flourishing, and almost every man happy to his heart’s content. The comparative merits of the two systems have been tried there; and the result has been such as to do more than warrant the sentiments I have been expressing; it has been such as ought utterly and for ever to silence the foes of an Establishment; it has been such as, I do hope, will lead the American people themselves to see the duty of renouncing their present infidel atheistical constitution and of adopting another, that will look with a friendly and supporting aspect on the interests of religion and the Church of God. The population of the American states is computed to be at this day twelve millions of human beings.* In almost all the states, the government has made no provision for the religious instruction of the people. The consequence is, that, after the operation of the “Voluntary” system for the space of half a century, there are eight millions of the people who are wholly uninstructed in the religion of Jesus Christ.

I ask you, my brethren, if it is not utterly appalling to think of the government of a land – claiming to be a Christian land – having the means of diffusing religious knowledge to its remotest bounds, nevertheless neglecting to do so; permitting one generation of its subjects after another to live and die in ignorance and heathenism. In how immensely different circumstances might these masses of degraded and perishing immortals have been, if the government, actuated by Christian benevolence, had appropriated a portion of its revenues to provide, throughout the vast tract of its territory, pious and evangelical preachers of the gospel, and instructors of the youth in the knowledge of God’s blessed word! Suppose that, in all the states, there had been adopted the system on this point, which, for many years, has obtained in the state of Connecticut; that is to say, that they had made provision from the public revenue for the support of religion, the consequence would have been, that throughout the American territory, the general population would have been in the same advantageous circumstances, in point of religious instruction, with the people of that state. But how lamentably are matters the reverse of this! It was recorded by Dr. Dwight thirty years ago, that in the territory of Connecticut, every twelve hundred inhabitants enjoyed the privilege of a stated gospel ministry. Nor, so far as I am aware, has the supply of the means of religious instruction in that province, fallen behind the increase of its population. But look abroad over the other states. In some of them, you find only sixty ministers to a population of a million of souls. In others, the supply of religious instruction is still more deficient. Nay, there are whole districts of country, containing from twenty to fifty thousand inhabitants, entirely destitute of the knowledge of Christianity.

This, my brethren, is the state of matters in America at this day; and I appeal to you, if it does not furnish a striking proof of the grievous insufficiency of the voluntary system. Thirty years ago, the people of one state, where the principle which we advocate was acted on, were amply provided with the means of Christian knowledge. Whereas, in the other states, where the opposite principle has been adopted – where the government has made no provision for the support of religion – two thirds of the population, eight out of twelve millions of souls, are entirely destitute of religious instruction — are living and dying in total ignorance of the gospel of salvation! This, I say again, is the melancholy condition of the American states at this day. The principle of non-interference on the part of the state, in any matters connected with religion, has been in operation among them for half a century; and the result of its operation is, that two-thirds of the American continent are in a state of heathenism! This, my friends, is the land to which our Scottish people are desired to look as the scene where the “Voluntary” scheme is displaying its marvellous efficiency, and where we behold a model which we ought to imitate!</p></blockquote>

<blockquote><p>IN WHAT DOES THE CHURCH DIFFER FROM THE STATE? The chief differences between the church and the state are the following:

1. The state is a society which is bound by certain civil laws for the maintenance of external propriety and order, according to each table of the Decalogue. The church consists of those who embrace the gospel, and observe the sacraments according to divine appointment, and is governed by the Spirit and word of God, requiring both internal and external obedience.

2. In the church there are always some holy and godly persons, which is not always true of the state.

3. There are many and different states which are distinguished from each other by locality, time and laws; neither can he who is a citizen of one state, be a citizen of another also, or of all others; nor is there any one universal state of which all others are parts. The church, however, has been, is, and ever will be, one through out all periods, and among all nations. It is for this reason called Catholic, having many parts.

4. The head of the church is one, and in heaven, which head is Christ. The different states have many kings and rulers, and these upon earth.

5. The state has magisterial authority and power to make laws, to which it becomes us to yield obedience for conscience sake. The church is restricted and tied down to the word of God, and has no power to make new articles of faith. It may, indeed, establish “rules of order and propriety, but without binding the conscience; and that not with magisterial authority, but with consent.

6. The state is armed with power to inflict punishment upon obstinate offenders, and to preserve it laws with the sword. The church has merely the sword of the word, which consists in the denunciation of the wrath of God against those who are disobedient. One and the same person, as the prophets and priests of old, may sometimes act both in a civil and ecclesiastical capacity. Hence they ought to be carefully distinguished.</p></blockquote>

<blockquote><p>Do not thou cruelly destroy the image of God. Thou angerest thy Maker, when thou killest his image. Consider with thyself, that thou art sorry for an image of brass. Now it is evident to all men what difference there is betwixt a thing that is dead, and that which hath life and a reasonable soul. Moreover, it is an easy matter instead of one brasen image to set up more: but it is unpossible to restore one hair to them that once are slain. Finally, murder is clean contrary to the nature of man. For man cherisheth himself, and flesh destroyeth not itself, but preserveth and nourisheth itself so much as it may. But all we men, as many as live, are of one lump, and of the same substantial flesh: and to kill a man therefore is against man’s nature.

Furthermore, all men are the children of one father, of one stock, and of the same progeny: murder therefore is directly against civil humanity, and is a plague that reigns among men. And doth not the Lord our Redeemer also require charity of all men, which must so abound, that we may not stick to die for our neighbour? To kill our neighbour, therefore, is flatly repugnant to christian religion. And take this by the way too; that the blood of man, shed by murder, crieth out of the earth to heaven for revengement: for to Cain, when he had slain his brother, it was said, “The voice of thy brother’s blood crieth out of the earth, and is come up to me.” For bloodshed verily polluteth and maketh the ground accursed whereon it is shed, and is not cleansed again, nor easily appeased, until it do also drink the guilty blood of them which spilt before the guiltless blood of innocents.</p></blockquote>

<div class="actions"><button class="copy" data-copy="“Do not thou cruelly destroy the image of God. Thou angerest thy Maker, when thou killest his image. Consider with thyself, that thou art sorry for an image of brass. Now it is evident to all men what difference there is betwixt a thing that is dead, and that which hath life and a reasonable soul. Moreover, it is an easy matter instead of one brasen image to set up more: but it is unpossible to restore one hair to them that once are slain. Finally, murder is clean contrary to the nature of man. For man cherisheth himself, and flesh destroyeth not itself, but preserveth and nourisheth itself so much as it may. But all we men, as many as live, are of one lump, and of the same substantial flesh: and to kill a man therefore is against man’s nature.

Furthermore, all men are the children of one father, of one stock, and of the same progeny: murder therefore is directly against civil humanity, and is a plague that reigns among men. And doth not the Lord our Redeemer also require charity of all men, which must so abound, that we may not stick to die for our neighbour? To kill our neighbour, therefore, is flatly repugnant to christian religion. And take this by the way too; that the blood of man, shed by murder, crieth out of the earth to heaven for revengement: for to Cain, when he had slain his brother, it was said, “The voice of thy brother’s blood crieth out of the earth, and is come up to me.” For bloodshed verily polluteth and maketh the ground accursed whereon it is shed, and is not cleansed again, nor easily appeased, until it do also drink the guilty blood of them which spilt before the guiltless blood of innocents.”

— Heinrich Bullinger, Fifty Godly and Learned Sermons, Divided into the Five Decades Containing the Chief and Principal Points of Christian Religion, trans. H. I. ed. Thomas Harding (1587; 4 vols, Cambridge: The Parker Society, 1849-52), 1: 306-07.">Copy</button><a class="share" href="https://x.com/intent/post?text=%E2%80%9CDo+not+thou+cruelly+destroy+the+image+of+God.+Thou+angerest+thy+Maker%2C+when+thou+killest+his+image.+Consider+with+thyself%2C+that+thou+art+sorry+for+an+image+of+brass.+Now+it+is+evident+to+all+men+what+difference+there+is+betwixt+a+thing+that+is+dead%2C+and+that+which+hath+life+and+a+reasonable+soul.+Moreover%2C+it+is+an+easy+matter+instead+of+one+brasen+image+to+set+up+more%3A+but+it+is+unpossible+to+restore+one+hair+to+them+that+once+are+slain.+Finally%2C+murder+is+clean+contrary+to+the+nature+of+man.+For+man+cherisheth+himself%2C+and+flesh+destroyeth+not+itself%2C+but+preserveth+and+nourisheth+itself+so+much+as+it+may.+But+all+we+men%2C+as+many+as+live%2C+are+of+one+lump%2C+and+of+the+same+substantial+flesh%3A+and+to+kill+a+man+therefore+is+against+man%E2%80%99s+nature.%0A%0AFurthermore%2C+all+men+are+the+children+of+one+father%2C+of+one+stock%2C+and+of+the+same+progeny%3A+murder+therefore+is+directly+against+civil+humanity%2C+and+is+a+plague+that+reigns+among+men.+And+doth+not+the+Lord+our+Redeemer+also+require+charity+of+all+men%2C+which+must+so+abound%2C+that+we+may+not+stick+to+die+for+our+neighbour%3F+To+kill+our+neighbour%2C+therefore%2C+is+flatly+repugnant+to+christian+religion.+And+take+this+by+the+way+too%3B+that+the+blood+of+man%2C+shed+by+murder%2C+crieth+out+of+the+earth+to+heaven+for+revengement%3A+for+to+Cain%2C+when+he+had+slain+his+brother%2C+it+was+said%2C+%E2%80%9CThe+voice+of+thy+brother%E2%80%99s+blood+crieth+out+of+the+earth%2C+and+is+come+up+to+me.%E2%80%9D+For+bloodshed+verily+polluteth+and+maketh+the+ground+accursed+whereon+it+is+shed%2C+and+is+not+cleansed+again%2C+nor+easily+appeased%2C+until+it+do+also+drink+the+guilty+blood+of+them+which+spilt+before+the+guiltless+blood+of+innocents.%E2%80%9D%0A%0A%E2%80%94+Heinrich+Bullinger%2C+Fifty+Godly+and+Learned+Sermons%2C+Divided+into+the+Five+Decades+Containing+the+Chief+and+Principal+Points+of+Christian+Religion%2C+trans.+H.+I.+ed.+Thomas+Harding+%281587%3B+4+vols%2C+Cambridge%3A+The+Parker+Society%2C+1849-52%29%2C+1%3A+306-07.&amp;url=https%3A%2F%2F5solasquotes.github.io%2Fquote%2Fac4418c002.html&amp;via=5Solas" target="_blank" rel="noopener">Share on X</a><a class="perma" href="../quote/ac4418c002.html">Permalink</a><a class="src" href="https://reformedcovenanter.wordpress.com/2021/04/04/henry-bullinger-the-blood-of-innocents-cries-out-for-justice/" rel="noopener" target="_blank">Read it online · Reformed Covenanter</a></div>

<blockquote><p>VI. Besides the uncreated natural divine right (called primary) founded immediately upon the very nature and holiness of God (the contrary of which He could not will nor command without denying Himself), another is granted (created and secondary), founded on the nature of things (according to the constitution established by God and the mutual suitableness or fitness of things to each other). On the hypothesis of the order instituted by God (according to which He willed such to be the nature of things), it is necessary. Still it cannot be regarded as of the same necessity with the first, nor do the duties flowing from it have an equal degree of obligation. For the former is immutably absolute; nor is there any case in which God can relax it because thus He would appear to deny his own nature, on which it is based. Hence He never could command or approve hatred of Himself, idolatry, perjury and falsehood. But the latter (although containing the natural rule of rectitude, because it supposes a certain state of things) could in certain cases (the circumstances of things and persons being altered) be changed, but only by his authority who established it. For example, murder and stealing (forbidden in the sixth and eighth commandments) could become lawful [e.g. possibly Gen. 22 with Abraham being commanded of God to sacrifice Isaac], some circumstance being changed–for instance, a divine command or public authority being given. In this respect, it can be referred to positive right; not indeed absolutely and simply such and merely free (which has no foundation except in the will of God alone), but relatively, inasmuch as (although based upon the order of things and created nature), it can still admit of a change in accordance with the wisdom of the legislator, who established that order. … XXIII. The sixth commandment, about homicide, was not dispensed with when Abraham was ordered to kill his own son. The command was only exploratory, not absolute. Neither if he had killed him by God’s command would he have violated the law concerning homicide because he would have done it empowered by a public authority (to wit, the command of God). However, the law does not condemn homicide of every kind. For the magistrate is bound to punish the guilty…</p></blockquote>

<blockquote><p>Whereas it has pleased the Lord to move the Heart of our dread Sovereign Charles [I] by the Grace of God King etc. to grant license and liberty to sundry of his subjects to plant themselves in the Western parts of America. We… considering with ourselves the holy Will of God and our own Necessity that we should not live without wholesome Laws and Civil Government among us… do in the name of Christ and in the sight of God combine ourselves together to erect and set up among us such Government as shall be to our best discerning agreeable to the Will of God… and binding of ourselves solemnly by the Grace and Help of Christ and in His Name and fear to submit ourselves to such Godly and Christian Laws as are established in the realm of England… which shall… be made and enacted among us according to God that we may live quietly and peaceably together in all godliness and honest.</p></blockquote>

<main class="wrap"><figure class="quote" id="q-ee28a452b6" data-kw="">
<blockquote><p>‘But’ (says he [John Robinson, a Separatist]) ‘the bare profession of fundamentals makes not a Church; they must be a company of faithful people, and if they must not be truly faithful, then they must be falsely faithful; for God requires true and ready obedience in his word, according to which we must define Churches, and not according to casual things.’ [Rutherford’s] Answer: This is a special ground that deceives the Separatists, their ignorance (I mean) of the visible Church, for the visible Church consists essentially neither of such as be truly faithful, nor of such as must be falsely faithful; for the ignorant man sees not that the visible Church includes neither faith, nor unbelief in its essence or definition. It is true, to the end that professors may be members of the invisible Church, they must be believers, and must believe, except they would be condemned eternally; but to make them members of the visible Church, neither believing nor unbelieving is essential, but only a profession ecclesiastically intear[?], that is not scandalous &amp; visibly &amp; apparently lewd and flagitious, such as was the profession of Simon Magus when he was baptized with the rest of the visible Church, Acts 8. And God indeed requires of us true worship and ready obedience, as he says, but not that a visible Church should be defined by true and sincere obedience: for essentials only are taken in a definition, and casual corruptions are only accidental to Churches and fall out through men’s faults, and therefore should not be in the definition either of a visible or an invisible Church; nor should ready and sincere obedience which is a thing invisible to men’s eyes be put in the definition of a visible Church, for it is accidental to a visible Church, and nothing invisible can be essential to that which essentially is visible; the visible Church is essentially visible.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/samuel-rutherford.html">Samuel Rutherford</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Due Right of Presbyteries… (1644), pt. 2, ch. 4, section 5</cite>, pp. 231-32</span></figcaption>

<blockquote><p>[Rutherford’s] Answer: …no godly visible professors can tie themselves by [a] covenant or oath to exercise the common Christian acts of a church-member only to such a [local-church] society, but in an occasional and providential way: for it is as unlawful to tie Church-worship to one society or place under the New Testament, as it was to tie it of old to Bethel and Gilgal, Hos. 4:15 &amp; 9:14 &amp; 12:11; Amos 4:4, which is a demonstration that a godly professor carries about a soul with him, stands in need of Church-feeding by the Lord’s Supper and other Church ordinances in all the Christian world, and that he is to warn, admonish, comfort all Church-members, and to labor to gain a trespassing brother, not of the single congregation only whereof he is a member, Mt. 18, and neither Scriptures, nor sound divinity, nor the Law of Nature (which is not destroyed by the Gospel) will warrant to limit the word, ‘brother’, as Mr. [Thomas] Hooker does, and his Brethren, Mt. 18:15, ‘If thy brother trespass, if he hear thee, thou hast gained thy brother;’ to a brother only of the congregation of which the offended brother is a member…</p></blockquote>

</figure><figure class="quote" id="q-3f44fc0ca5" data-kw="">
<blockquote><p>As your baptism makes you members of the universal Church, in order of nature before you are members of a particular church, so your relation to the universal Church is more noble, more necessary and more durable than your relation to any particular church. It is more noble, because the society is more noble. The whole is more excellent than a little part: It is more necessary because you cannot be saved and be Christians without being members of the universal Church: But you may be Christians and be saved without being a member of any stated particular church. It is more durable because you can never separate from the universal Church or cease to be a member of it without being separated from Christ: but diverse occasions may warrant your removal from a particular church. Live not therefore in those narrow and dangerous principles as if your congregation or your party were all the Church of Christ, or as if you had no Christian relation to any other ministers or people, nor owed any duty to them as members of the same Body. But remember that all Christians, persons and congregations are but the members of the Kingdom of Christ.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/richard-baxter.html">Richard Baxter</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Cure of Church Divisions… (London, 1670), pt. 1, Direction 18, ‘Understand well the necessity of your Communion with all the Universal Church, and wherein it consists, and how far to be preferred before your Communion with any particular Church’</cite>, pp. 115-18</span></figcaption>

<blockquote><p>Sixthly, the ministers are primarily ministers of the Church catholic; secondarily, of this or that particular flock or congregation: and therefore the catholic is the prime Church. And this appears by this demonstration: That Church to the which the donation of the ministry was first made, is the first subject thereof, but that was the Church catholic, therefore. For proof hereof see 1 Cor. 12:28-29, ‘God hath set some in the Church, first apostles, secondarily prophets, thirdly teachers.’ Now this Church was the Church catholic, and not any particular congregation, for it is the Church to which the Lord gave apostles. Note also from hence, that the same Church to which God gave apostles, and prophets, to the same He gave teachers also. Bishop and pastor may seem to be in respect to the particular relation to some particular place, wherein by the polity of the Church a particular minister is set, but presbyter, minister, and teacher, more general, extending to the whole Church catholic. Paul an apostle calls himself a teacher and preacher, 2 Tim. 1:11. Peter also and John the apostles call themselves presbyters, 1 Pet. 5:1-2; Ep. John 1; 3 John 1, we find also that ministers are in Scripture spoken of under a general notion. They are called ministers of the Word, Luke 1:2, and ministers of God, 2 Cor. 6:4, and ministers of Christ, 1 Cor. 4:1, and ministers of the New Testament, 2 Cor. 3:6, and ministers of the Gospel, 1 Thess. 3:2, and ministers of the Lord, Eph. 6:21, where the ministerial office is noted by the reference thereof to the author that employs them, and the subject about which they are employed, and not by the object to whom they preached; They are not called ministers of the people, but their teachers, rulers, pastors, overseers, or ministers for them, Col. 1:7. And if a minister of this or that congregation were not a minister of the Church catholic visible, then he were no minister out of his own congregation, and therefore could not preach, or administer any sacrament, as a minister, out of his own congregation.</p></blockquote>

<div class="actions"><button class="copy" data-copy="“Sixthly, the ministers are primarily ministers of the Church catholic; secondarily, of this or that particular flock or congregation: and therefore the catholic is the prime Church. And this appears by this demonstration: That Church to the which the donation of the ministry was first made, is the first subject thereof, but that was the Church catholic, therefore. For proof hereof see 1 Cor. 12:28-29, ‘God hath set some in the Church, first apostles, secondarily prophets, thirdly teachers.’ Now this Church was the Church catholic, and not any particular congregation, for it is the Church to which the Lord gave apostles. Note also from hence, that the same Church to which God gave apostles, and prophets, to the same He gave teachers also. Bishop and pastor may seem to be in respect to the particular relation to some particular place, wherein by the polity of the Church a particular minister is set, but presbyter, minister, and teacher, more general, extending to the whole Church catholic. Paul an apostle calls himself a teacher and preacher, 2 Tim. 1:11. Peter also and John the apostles call themselves presbyters, 1 Pet. 5:1-2; Ep. John 1; 3 John 1, we find also that ministers are in Scripture spoken of under a general notion. They are called ministers of the Word, Luke 1:2, and ministers of God, 2 Cor. 6:4, and ministers of Christ, 1 Cor. 4:1, and ministers of the New Testament, 2 Cor. 3:6, and ministers of the Gospel, 1 Thess. 3:2, and ministers of the Lord, Eph. 6:21, where the ministerial office is noted by the reference thereof to the author that employs them, and the subject about which they are employed, and not by the object to whom they preached; They are not called ministers of the people, but their teachers, rulers, pastors, overseers, or ministers for them, Col. 1:7. And if a minister of this or that congregation were not a minister of the Church catholic visible, then he were no minister out of his own congregation, and therefore could not preach, or administer any sacrament, as a minister, out of his own congregation.”

— Samuel Hudson, The Essence &amp; Unity of the Church, catholic, visible: and the Priority thereof in regard of Particular Churches Discussed (London, 1645), pp. 32-33">Copy</button><a class="share" href="https://x.com/intent/post?text=%E2%80%9CSixthly%2C+the+ministers+are+primarily+ministers+of+the+Church+catholic%3B+secondarily%2C+of+this+or+that+particular+flock+or+congregation%3A+and+therefore+the+catholic+is+the+prime+Church.+And+this+appears+by+this+demonstration%3A+That+Church+to+the+which+the+donation+of+the+ministry+was+first+made%2C+is+the+first+subject+thereof%2C+but+that+was+the+Church+catholic%2C+therefore.+For+proof+hereof+see+1+Cor.+12%3A28-29%2C+%E2%80%98God+hath+set+some+in+the+Church%2C+first+apostles%2C+secondarily+prophets%2C+thirdly+teachers.%E2%80%99+Now+this+Church+was+the+Church+catholic%2C+and+not+any+particular+congregation%2C+for+it+is+the+Church+to+which+the+Lord+gave+apostles.+Note+also+from+hence%2C+that+the+same+Church+to+which+God+gave+apostles%2C+and+prophets%2C+to+the+same+He+gave+teachers+also.+Bishop+and+pastor+may+seem+to+be+in+respect+to+the+particular+relation+to+some+particular+place%2C+wherein+by+the+polity+of+the+Church+a+particular+minister+is+set%2C+but+presbyter%2C+minister%2C+and+teacher%2C+more+general%2C+extending+to+the+whole+Church+catholic.+Paul+an+apostle+calls+himself+a+teacher+and+preacher%2C+2+Tim.+1%3A11.+Peter+also+and+John+the+apostles+call+themselves+presbyters%2C+1+Pet.+5%3A1-2%3B+Ep.+John+1%3B+3+John+1%2C+we+find+also+that+ministers+are+in+Scripture+spoken+of+under+a+general+notion.+They+are+called+ministers+of+the+Word%2C+Luke+1%3A2%2C+and+ministers+of+God%2C+2+Cor.+6%3A4%2C+and+ministers+of+Christ%2C+1+Cor.+4%3A1%2C+and+ministers+of+the+New+Testament%2C+2+Cor.+3%3A6%2C+and+ministers+of+the+Gospel%2C+1+Thess.+3%3A2%2C+and+ministers+of+the+Lord%2C+Eph.+6%3A21%2C+where+the+ministerial+office+is+noted+by+the+reference+thereof+to+the+author+that+employs+them%2C+and+the+subject+about+which+they+are+employed%2

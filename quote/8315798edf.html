<blockquote><p>9. That it [Creation] is an action not successive, but instantaneous; for creation is not motion, as Thomas rightly proves, Summa Contra Gentiles bk. 2, chs. 17 and 19. Therefore God created each thing, if we consider them separately and in themselves, in an instant: although the creation of some succeeded to others in the span of six days, if we consider them collectively. But why God did not create all things at once, no reason besides his will can be adduced. For the twofold διασκοπία [scope] which is usually adduced from Ambrose, Hexaemeron, bk. 1, ch. 7, and Augustine, On Genesis, seems to me indeed, to speak truly, insufficiently solid: namely so that hence it might more openly be established that the world was founded not from eternity, but in time; and that men might so much the more distinctly and attentively meditate on the individual works of God. As if namely we would less meditatively and attentively [consider] the soul of man, or the animation [ensoulment] of the fetus, or the sun, or the hypostatic union of Christ, because God effected those works in a moment. But that reason which Augustine adduces for the time of six days in bk. 4, On the Trinity, and bk. 4, On the Literal Meaning of Genesis, ch. 1, namely that the number six is the first perfect [number], is plainly atheological, and savors of Kabbalistic superstitions: Petrus Bongus, On the Mysteries of Numbers, on the number six, p. 268, thus urges this, that he does not fear to write: For the number six is said to be sacred, and perfect not only because in this number of days all the species of things were founded, as William Hamerus had thought, following Pope Gregory the Great, bk. 35, ch. 20, Moralia, but also for that reason God perfected his works in six days, because six is perfect, and sacrosanct. Therefore even if those things were not, it would be perfect; but unless it itself were perfect, those things would not become perfect according to it: In the same chapter he adduces for this μυσταγωγία Kabbalah Clement of Alexandria, and Eusebius, who in the books of Evangelical Preparation, cites Clement. But it can be said that they argued more to the man, than from the truth of the thing and their own sense. For thus Clement, bk. 5, Stromata, p. 432: The βάρβαρος φιλοσοφία indeed knows one world, which is perceived by the intellect, but another sensible, etc. καὶ τὸν μὲν ἀρχέτυπον, and that indeed archetypal it attributes to the monad as that which is perceived by the intellect: but this sensible [world], to the number six. For among the Pythagoreans marriage is called the number six, as that which is the generative number. We reject: 1. The opinion of those, who establish that the entire world was founded in an instant, or at once, and afterwards the individual [things] were successively separated from each other. Maimonides in The Guide of the Perplexed, pt. 2, ch. 30. Of the same opinion are Philo, bk. 1, Allegories, Cajetan on Gen. 1, Melchior Cano in Bañez on ST, pt. Ia, q. 74, art. 2, Augustine, bk. 11, On the Literal Meaning of Genesis, ch. 22. We reject: 2. Those, who Kabbalistically deduce the duration of the world and other mysteries from the six days of the creation of the world. Of which sort were not only Jews, but also some from the Christians: Concerning which perhaps we must speak elsewhere in the chapter ‘On the End of the World, or on the Signs of the Times’.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/gisbertus-voetius.html">Gisbertus Voetius</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Select Theological Disputations</cite>, vol. 1 tr. by AI by Onku (Utrecht: Johannes a Waesberg, 1648), pt. 2 Latin | On Creation, pt. 1, p. 112</span></figcaption>

<blockquote><p>7. And lastly, in what time or how many days did God create all things, in six days says the Scripture, and every day some thing says this place, till the seventh day, wherein He rested. Non uno momento, sed sex dierum spatio, ‘not in one moment, but in six days’ space.’ If you happily think or meet with Syrach’s words [in Ecclesiasticus], who says, ‘He that lives made all things together, the Lord who only is iust,’ etc., you must consider that he speaks not of the time, but of the multitude of creatures, meaning that God made them all together before He rested, and gave over creating, but not meaning that He made them all in one moment of time or in one day, for we see both this place and others against it: the Lord’s own commandment written with his own finger gives testimony that in six days the whole was made.</p></blockquote>

<blockquote><p>Sciences are differentiated according to the various means through which knowledge is obtained. For the astronomer and the physicist both may prove the same conclusion: that the earth, for instance, is round: the astronomer by means of mathematics (i.e. abstracting from matter), but the physicist by means of matter itself.</p></blockquote>

</figure><figure class="quote" id="q-216a1ae61b" data-kw="">
<blockquote><p>Therefore the aforesaid names signify the divine substance, but in an imperfect manner, even as creatures represent it imperfectly. So when we say, God is good, the meaning is not, God is the cause of goodness, or God is not evil; but the meaning is, Whatever good we attribute to creatures, pre-exists in God, and in a more excellent and higher way. Hence it does not follow that God is good, because He causes goodness; but rather, on the contrary, He causes goodness in things because He is good; according to what Augustine says (De Doctr. Christ. i, 32), Because He is good, we are.</p></blockquote>

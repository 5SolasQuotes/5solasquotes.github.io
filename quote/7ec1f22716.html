<main class="wrap"><figure class="quote" id="q-7ec1f22716" data-kw="hell sense loss">
<blockquote><p>Is there a hell? And what are its punishments—whether only of loss or also of sense? We affirm the latter. The execution of the sentence of the Judge will follow its promulgation. This will be carried out with respect to the wicked by casting them down into hell, where they must be tormented for ever with the devils; but with respect to the pious, by their introduction into heaven, to the joys of eternal life.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/francis-turretin.html">Francis Turretin</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Institutes of Elenctic Theology</cite>, 20.7.1</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/judgment-and-the-final-state/hell.html">Hell</a> › <a href="../topics/judgment-and-the-final-state/hell/eternal-punishment.html">Eternal punishment</a></span><span class="t"><a href="../topics/judgment-and-the-final-state/hell.html">Hell</a> › <a href="../topics/judgment-and-the-final-state/hell/nature-of-the-punishment.html">Nature of the punishment</a></span></div>

</figure><figure class="quote" id="q-bcdbb060e2" data-kw="Gehenna sheol">
<blockquote><p>Hell is called in Hebrew sheol, in Greek hades. Here we take it for the place of the damned, as it is taken in Lk. 16:23. Various synonyms of it occur in the Scriptures: perdition; Gehenna (Mt. 5:22, 29), a word derived from the valley of the children of Hinnom, in which the wicked Israelites were accustomed to practice horrible idolatries to Moloch.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/francis-turretin.html">Francis Turretin</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Institutes of Elenctic Theology</cite>, 20.7.2</span></figcaption>

</figure><figure class="quote" id="q-8872bfd394" data-kw="">
<blockquote><p>Although pardon of sin be compleated at that great day, yet this is not to be understood, as if Gods pardon of any sin were imperfect, and something of sinne did still remain to be done away. No, those expressions of forgivenes of sin in the Scripture, denote such a full and plenary pardon, that a sin cannot be more remitted then it is. But because we commit new sinnes daily, and so need pardon daily, Therefore it is that we are not compleatly pardoned till then. As also because the perfect pardon we have here, shall then solemnly and publikely be declared to all the world.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/anthony-burgess.html">Anthony Burgess</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The True Doctrine of Justification</cite>, London, 1651, Lecture 29, pp. 258–259</span></figcaption>

</figure><figure class="quote" id="q-434f3c8a49" data-kw="eternal life vision">
<blockquote><p>To the eternal death which awaits the damned, eternal life is opposed—the fulfillment and crown of all of Christ’s benefits. So great a good as neither eye has seen, nor ear heard, nor has it entered into the heart of anyone to conceive, and will not enter until we, obtaining our wish, ascend thither and know as we are known, and no longer walk by faith, but by sight.</p></blockquote>

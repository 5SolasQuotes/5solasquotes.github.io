<main class="wrap"><figure class="quote" id="q-5cbf7cd3e2" data-kw="">
<blockquote><p>The will of God is one and the same, but it is distinguished: 1. In respect of the object into voluntatem beneplaciti et placiti. God wills good things and good effects with the will of his good pleasure, approving them first of all, and by Himself, He intends their end and means, Eph. 1:5; but evil and evil effects as they are evil, he nils, disapproves and dislikes. Yet he voluntarily permits evil, and as there is a good end of it, He wills it with the will of his pleasure, for it is good that there should be evil, Ps. 81:12; Acts 14:16; 1 Cor. 10:5. Divines thus distinguish, there is volitio mala et mali [an evil volition and a volition of evil], to will sin to be, is not sinful; it had never come into the world if God had not willed it.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/edward-leigh.html">Edward Leigh</a></span><span class="wk"><span class="lbl">Work:</span> <cite>A System or Body of Divinity</cite>, … (London, 1654), bk. 2, ch. 7, ‘Of God’s Understanding that He is Omniscient, and of his Will’, p. 165</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/providence/providence-and-evil.html">Providence and Evil</a></span></div>

</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-b4af681b72" data-kw="Author of sin">

<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/john-gill.html">John Gill</a></span><span class="wk"><span class="lbl">Work:</span> <cite>A Body of Doctrinal Divinity</cite>, bk. 3, ch. 8 (Of the Sin and Fall of Our First Parents)</span></figcaption>

</figure><figure class="quote" id="q-9e238c3d89" data-kw="">
<blockquote><p>26. ‘Evil’ is an ambiguous term. It may stand for miserable evils or moral evils. One may morally choose to undergo and suffer certain miserable evils in necessity, other alternatives not being available, likely or reasonable. Electing to eat expired food rather than starve is not wrong. One ought never to do moral evil, though it be lesser in respect to another (1 Cor. 15:34; WLC 99.5).</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/travis-fentiman.html">Travis Fentiman</a></span><span class="wk"><span class="lbl">Work:</span> <cite>“Theses on the Ethics of Civil Voting, with a Correction to the Booklet, Christ Centered Voting”, “Choosing the Lesser of Two Evils” at ‘On Voting’</cite>, (RBO).</span></figcaption>

</figure><figure class="quote" id="q-4b8c25085e" data-kw="Author of sin">
<blockquote><p>Although God by his providence governs even sins, yet he is not the cause or author of sin: because he takes no delight in sin, but rather abhors it; nor does he himself sin, or can he sin; likewise because he neither commands nor persuades sin; nor does he pour malice into those who sin, nor compel them to sin; and moreover he directs all things to a good end.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/johannes-piscator.html">Johannes Piscator</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Aphorisms of Christian Doctrine</cite>, Locus 6, aph. 3</span></figcaption>

</figure><figure class="quote" id="q-6650e8cc1e" data-kw="">
<blockquote><p>Thesis XXI… yet properly the substance itself, or the nature, or the action of a rational creature is not sin, but is infected by sin. Sin, however, is the lawlessness (ἀνομία) itself, that is, the defect and privation of due righteousness in the action itself, or in the rational substance, according to the law of God. Therefore, the apostle rightly did not say that sin is an unjust thing, or an evil action, but ἀνομία, that is, that by which a nature or action is, and is called unjust. So that the nature and the action, which are good in themselves and of which God is the author, must be entirely distinguished from the iniquity, by which they are unjust, and of which God cannot be the author.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/christoph-luthard.html">Christoph Luthard</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Theological Disputation on Original Sin</cite>, (Bern: Fabricius, 1637), p. 9 Lüthardt (1590-1663) was a Swiss reformed professor of philosophy and theology at Bern.</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/providence/providence-and-evil.html">Providence and Evil</a></span></div>

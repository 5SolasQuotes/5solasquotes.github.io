</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-8f8b9a4f73" data-kw="">
<blockquote><p>England had a divided church. Even among puritans, fault lines had visibly widened under the pressure of the civil war and its aftermath. After his own traumatic experience of the war, Baxter longed for order and peace, and he developed a lifelong yearning to bring Christians together in unity. He identified four main parties within the English church (Congregationalists, Episcopalians, Erastians, and Presbyterians), but he felt that the moderates within each party held similar views and, more importantly, could work together in practice even if their principles varied. He believed that if England’s ministers simply got on with the work of ministry, they would be too busy to notice how their differing doctrines of church government might otherwise keep them apart. So he formed the Worcestershire Association, a network open to local parish ministers of all stripes who met monthly for the purpose of mutual edification and encouragement. In 1653 they published their agreement to work together, and similar ministerial associations sprang up in other counties.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/richard-baxter.html">Richard Baxter</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Intro | For background to Baxter’s paradigmatic and influential association of moderates of the differing parties for the sake of the Gospel and pastoral work (during a political and ecclesiastical vacuum), and the other similar associations which were modeled after it, see Tim Cooper, When Christians Disagree: Lessons from the Fractured Relationship of John Owen and Richard Baxter (Crossway, 2024), pp. 23, 91-92, 104. Cooper:</cite>, p. 23</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/the-church/church-unity-and-fundamentals.html">Church Unity and Fundamentals</a></span></div>

</figure><figure class="quote" id="q-3df12a43cc" data-kw="">
<blockquote><p>And I make no doubt but some opinions as well as practices render men unmeet for Church-communion, Tit. 3:10; 2 Jn. 10. All opinions which overthrow doctrines necessary to be believed, which the apostle comprehends under the name of Faith; and all such opinions as are inconsistent with an holy life and te power of godliness, which the apostle comprehends under the name of a good conscience, 1 Tim. 1:19-20. Whosoever shall hold or maintain any such opinions as these, he is either to be kept out, if not admitted; or cast out, if he be in Church-fellowship. In receiving such you receive but spies and incendiaries among you. What a fire-brand did Arius prove, not only in the Church of Constantinople, but even to the whole world? Men of graceless hearts and erroneous heads will give a continual exercise to the patience of sober Christians… if they can be discerned before they be admitted, a little preventive care would be of singular and seasonable use to the tranquillity of Church-societies.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/john-flavel.html">John Flavel</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Planelogia, a Succinct &amp; Seasonable Discourse of the Occasions, Causes, Nature, Rise, Growth &amp; Remedies of Mental Errors... (London: Roberts, 1691), pp. 438-39, 446 Flavel was a presbyterian. | Direction 1</cite></span></figcaption>
<div class="meta"><span class="t"><a href="../topics/the-church/church-unity-and-fundamentals.html">Church Unity and Fundamentals</a></span></div>

ity%20of%20Church%2Dsocieties&amp;text=And%20I%20make%20no%20doubt%20but%20some%20opinions&amp;text=and%20seasonable%20use%20to%20the%20tranquillity%20of%20Church%2Dsocieties" rel="noopener" target="_blank">Read it online · Reformed Books Online</a></div>
</figure><figure class="quote" id="q-af5b4d5876" data-kw="">
<blockquote><p>For I count it a special instance of God’s gracious providence to me, not only that I was born of a parent eminent for learning and piety… but also in this, that I was well acquainted with his doctrine, and particularly in this head concerning justification, which he had discussed with a piercing reason, and explicated with a happy perspicuity; not leaning to his own understanding, but after an examination of an innumerable variety of writers on this argument, making the language of Scripture in the common sense of the words the rule of his judgment and speaking, that he might speak as the oracles of God. (1 Pet. 4:11) By this religious observing the form of wholesome words, he did disentangle the truth from many thorny controversies, which have been raised impertinently, but agitated with much heat, to the injury of truth and peace.</p></blockquote>

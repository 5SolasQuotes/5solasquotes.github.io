<main class="wrap"><figure class="quote" id="q-964ec93cbe" data-kw="">
<blockquote><p>43. What is the connection of the exaltation of the Mediator to His humiliation? The connection of legal consequence. Christ is Mediator not as a private person but as an official person, as Head of His members. Hence He must receive the fruits of His merits in Himself. And as He did not suffer for Himself, so too He was not glorified for Himself.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/geerhardus-vos.html">Geerhardus Vos</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Other citations (work not named)</cite>, Ch. 5, ‘States’, #43, p. 218 in Reformed Dogmatics, vol. 3, Christology (Lexham Press, 2014)</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/good-works/merit-and-reward.html">Merit and Reward</a></span></div>

</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-76f840e0cf" data-kw="">
<blockquote><p>We cannot by our best works merit pardon of sin or eternal life at the hand of God, by reason of the great disproportion that is between them and the glory to come, and the infinite distance that is between us and God, whom by them we can neither profit nor satisfy for the debt of our former sins; but when we have done all we can, we have done but our duty, and are unprofitable servants (Rom. 3:20; Eph. 2:8–9; Rom. 4:6).</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/particular-baptists.html">Particular Baptists</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Second London Baptist Confession of Faith</cite>, 1689, 16.5</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/good-works/merit-and-reward.html">Merit and Reward</a> › <a href="../topics/good-works/merit-and-reward/merit-of-condignity-and-congruity.html">Merit of condignity and congruity</a></span><span class="t"><a href="../topics/rome/justification.html">Rome: Justification</a> › <a href="../topics/rome/justification/merit.html">Merit</a></span></div>

</figure><figure class="quote" id="q-f4a613b9b6" data-kw="">
<blockquote><p>Thus good works please God, and are not without fruit to their authors, since, by way of recompense, they obtain more ample blessings from God, not because they so deserve, but because the divine benignity is pleased of itself to set this value upon them. Such, however is our malignity, that not contented with this liberality on the part of God, which bestows rewards on works that do not at all deserve them, we with profane ambition maintain that that which is entirely due to the divine munificence is paid to the merit of works.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/john-calvin.html">John Calvin</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Institutes of the Christian Religion</cite>, 3.15.3</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/good-works/merit-and-reward.html">Merit and Reward</a> › <a href="../topics/good-works/merit-and-reward/reward-of-grace-against-rome.html">Reward of grace (against Rome)</a></span><span class="t"><a href="../topics/good-works/merit-and-reward.html">Merit and Reward</a></span></div>

— John Calvin, Institutes of the Christian Religion, 3.15.3">Copy</button><a class="share" href="https://x.com/intent/post?text=%E2%80%9CThus%20good%20works%20please%20God%2C%20and%20are%20not%20without%20fruit%20to%20their%20authors%2C%20since%2C%20by%20way%20of%20recompense%2C%20they%20obtain%20more%20ample%20blessings%20from%20God%2C%20not%20because%20they%20so%20deserve%2C%20but%20because%20the%20divine%20benignity%20is%20pleased%20of%20itself%20to%20set%20this%20value%20upon%20them.%20Such%2C%20however%20is%20our%20malignity%2C%20that%20not%20contented%20with%20this%20liberality%20on%20the%20part%20of%20God%2C%20which%20bestows%20rewards%20on%20works%20that%20do%20not%20at%20all%20deserve%20them%2C%20we%20with%20profane%20ambition%20maintain%20that%20that%20which%20is%20entirely%20due%20to%20the%20divine%20munificence%20is%20paid%20to%20the%20merit%20of%20works.%E2%80%9D%0A%0A%E2%80%94%20John%20Calvin%2C%20Institutes%20of%20the%20Christian%20Religion%2C%203.15.3&amp;url=https%3A%2F%2F5solasquotes.github.io%2Fquote%2Ff4a613b9b6.html&amp;via=5Solas" target="_blank" rel="noopener">Share on X</a><a class="perma" href="../quote/f4a613b9b6.html">Permalink</a><a class="src" href="https://ccel.org/ccel/calvin/institutes" rel="noopener" target="_blank">Read it online · CCEL</a></div>
</figure><figure class="quote" id="q-ae28ff4efe" data-kw="">
<blockquote><p>For though it may be easy to object, that the reward was laid up with a view to their future merits, any person who will candidly examine the words must acknowledge that there is an implied commendation of the grace of God. Nay more, Christ does not simply invite believers to possess the kingdom, as if they had obtained it by their merits, but expressly says that it is bestowed on them as heirs.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/john-calvin.html">John Calvin</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Commentary on a Harmony of the Evangelists</cite>, Matthew 25:34</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/adoption/privileges-of-sons.html">Privileges of Sons</a> › <a href="../topics/adoption/privileges-of-sons/heirs.html">Heirs</a></span><span class="t"><a href="../topics/good-works/merit-and-reward.html">Merit and Reward</a> › <a href="../topics/good-works/merit-and-reward/reward-of-grace-against-rome.html">Reward of grace (against Rome)</a></span></div>
<div class="actions"><button class="copy" data-copy="“For though it may be easy to object, that the reward was laid up with a view to their future merits, any person who will candidly examine the words must acknowledge that there is an implied commendation of the grace of God. Nay more, Christ does not simply invite believers to possess the kingdom, as if they had obtained it by their merits, but expressly says that it is bestowed on them as heirs.”

</figure><figure class="quote" id="q-e7e46bfbc0" data-kw="">
<blockquote><p>But it does not follow that God owes anything to us, because he renders righteously what he renders; for he is righteous even in those acts of kindness which are of free grace. And he &quot;renders the reward&quot; which he has promised, not because we take the lead by any act of obedience, but because, in the same course of liberality in which he has begun to act toward us, he follows up his former gifts by those which are afterwards bestowed.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/john-calvin.html">John Calvin</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Commentary on 1 &amp; 2 Timothy, Titus, and Philemon</cite>, 2 Timothy 4:8</span></figcaption>

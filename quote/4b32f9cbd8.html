<main class="wrap"><figure class="quote" id="q-4b32f9cbd8" data-kw="">
<blockquote><p>Nowadays, it is a little understood fact that the orthodox Covenanter position is that most of the penal sanctions of the Old Testament are part of the moral law, and thus forever bind all people (Westminster Confession 19:5). Those who appeal to Westminster Confession 19:4 in an attempt to prove that such laws have expired have seriously misunderstood what the Confession is referring to. As Samuel B. Wylie explains below, there is a section of the judicial laws that were unique to Israel; these laws have expired so as not to bind us any further than there general equity may require. However, other judicial laws do not fall under this category but are simply conceived as being part of natural/moral law:

Whatsoever the law of God commands to be punished, ought to be punished with the penalties therein made and provided; but God has commanded gross heretics, blasphemers, and idolaters, to be punished with certain specified penalties. Therefore, such ought to be punished. These commands could not belong to the ceremonial law, for then they would have flowed entirely from the arbitrary will of God, and been mere signs between him and Israel. Who would dare to think so of gross heresy, &amp;c.? Neither could they belong to that part of the judicial law which respected the Jews peculiarly. Who would dare to say that none but the Jews were, or are, under obligation to worship God in purity, or abstain from blaspheming his nature and dignity? They must, therefore, belong to the moral law, and flow from the moral nature of Jehovah, who has declared he will not give his glory to another, nor his praise to graven images.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/s-b-wylie.html">S. B. Wylie</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The two sons of oil; or, the faithful witness for magistracy and ministry upon a scriptural basis</cite>, (1803; York PA, 2002), p. 66.</span></figcaption>

<blockquote><p>Canon XXIV: But this later Covenant of Grace according to the diversity of times has also different dispensations. For when the Apostle speaks of the dispensation of the fullness of times, that is, the administration of the last time (Eph 1:10), he very clearly indicates that there had been another dispensation and administration until the times which the Father appointed. Yet in the dispensation of the Covenant of Grace the elect have not been saved in any other way than by the Angel of his presence (Isa 63:9), the Lamb slain from the foundation of the world (Rev 13:8), Christ Jesus, through the knowledge of that just Servant and faith in him and in the Father and his Spirit. For Christ is the same yesterday, today, and forever (Heb 13:8). And by His grace we believe that we are saved in the same manner as the Fathers also were saved, and in both Testaments these statutes remain unchanged: “Blessed are all they that put their trust in Him,” (the Son) (Ps 2:12); “He that believes in Him is not condemned, but he that does not believe is condemned already” (John 3:18). “You believe in God,” even the Father, “believe also in me” (John 14:1). But if, moreover, the holy Fathers believed in Christ as their God, it follows that they also believed in the Holy Spirit, without whom no one can call Jesus Lord. Truly there are so many clearer exhibitions of this faith of the Fathers and of the necessity of such faith in either Covenant, that they can not escape any one unless one wills it. But though this saving knowledge of Christ and the Holy Trinity was necessarily derived, according to the dispensation of that time, both from thc promise and from shadows and figures and mysteries, with greater difficulty than in the NT. Yet it was a true knowledge, and, in proportion to the measure of divine Revelation, it was sufficient to procure salvation and peace of conscience for the elect, by the help of God’s grace. Canon XXV: We disapprove therefore of the doctrine of those who fabricate for us three Covenants, the Natural, the Legal, and the Gospel, different in their entire nature and essence, and in explaining these and assigning their differences, so intricately entangle themselves that they greatly obscure and even impair the nucleus of solid truth and piety. Nor do they hesitate at all, with regard to the necessity, under the OT dispensation, of knowledge of Christ and faith in him and his satisfaction and in the whole sacred Trinity, to speculate much too loosely and dangerously.</p></blockquote>

<blockquote><p>IV. Third, “in all the precepts synecdoche is to be acknowledged” by which in one proposed species, all under the same genus are understood, and by one prohibited vice others of the same kind analogous to it (and whatever bear upon or lead to it) are prohibited. Thus in the precept “thou shalt not commit adultery” is prohibited every affection for another’s wife; to lust after her (Mt. 5:28) and all illicit desires are forbidden.

Under homicide, all angry feelings are included. What are most base and capital in each species of sin are forbidden, under which all the others are included, either because they flow thence or because they lead at length to it; or because what appear the smallest to men are in the most accurate judgment of God rated more severely. This is not done, therefore, to excuse or exclude lesser sins, but that a greater detestation of sin may be impressed upon our minds. For the flesh endeavours to dilute the foulness of sin and to cover it under specious pretexts; for example, anger and hatred are supposed to be so execrable when these terms are used, but when they are prohibited under the name of homicide, we understand better in how great abomination they are held by God.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/francis-turretin.html">Francis Turretin</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Institutes of Elenctic Theology</cite>, trans. George M. Giger, ed. James T. Dennison (1679-85; 3 vols, Phillipsburg NJ: Presbyterian &amp; Reformed, 1992), 11.6.4.</span></figcaption>

dcovenanter.wordpress.com/2020/12/09/francis-turretin-on-the-precepts-of-the-decalogue-as-a-synecdoche/" rel="noopener" target="_blank">Read it online · Reformed Covenanter</a></div>

<blockquote><p>TO WHAT USE THE LAW WAS GIVEN.

First, that is should declare unto us the will of God, how we ought to live, and what works we ought to do, that we may please the Lord our God. …

Secondly, that is should reveal and open unto us our sin and wickedness, while we consider how unable we be of ourselves to do that which the holy, righteous, and good law of God requireth of us to be done. …

Thirdly, after we have learned our weakness, our wretchedness, our sin, our wickedness, by comparing our strength and life with the law of God, which proveth us all sinners and worthy of eternal damnation, lest we should fall into desperation, and so be damned, the law was given of God to be a school-master unto us to lead us unto Christ, the alone end and perfect fulfiller of all the laws of God; that we, through faith taking upon us his righteousness, and his fulfilling of the law, might be found blameless through him in the sight of God, and so be made inheritors of everlasting glory.</p></blockquote>

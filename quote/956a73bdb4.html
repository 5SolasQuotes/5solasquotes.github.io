<main class="wrap"><figure class="quote" id="q-956a73bdb4" data-kw="">
<blockquote><p>Dr. Begg’s ministry in Paisley began under most trying circumstances, as much so as any with which a young minister ever had to contend. In 1832 there was a fearful outbreak of cholera, which visited many parts of the country, carried off many of all classes, and produced terror in the hearts of multitudes who escaped its actual attack. Probably on account of overcrowding and the want of sanitary arrangements, Paisley was one of the places which suffered most severely. The greater portion of the victims were of the destitute, enfeebled, and dissipated classes. But not all. The mansions of the higher classes were not exempt from the visitation. The strong and the fair were among the victims. The virtuous and the pious did not escape. In all faces were traces of deepest sorrow, mingled with the expression of anxiety and alarm. And there was more than simple sorrow, comfortless weeping for the dead because they were not. A strange madness took hold of the minds of the most ignorant portion of the people, and in some cases extended even to some of whom better things might have been expected. The medical men, who battled with the fell disease with all the courage and energy which are nobly characteristic of their profession, were regarded as its abettors. Every case which baffled their skill was regarded as a murder perpetrated by them. This strange and wicked delusion was, unhappily, not confined to Paisley, but it seems to have found there a peculiarly congenial soil.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/james-a-begg.html">James A. Begg</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The following historical events are related in the biography of Begg the Free Churchman</cite></span></figcaption>
<div class="meta"><span class="t"><a href="../topics/civil-government-and-society/plague-quarantine-and-public-health.html">Plague, Quarantine and Public Health</a></span></div>

</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-6e8bda2314" data-kw="">
<blockquote><p>Evangelicals responded similarly to the Scottish cholera epidemic of 1832, organizing weekly, and even nightly, prayer meetings in the hope of arresting the advance of the disease. These meetings supplemented the fast days called by the government at the request of the Church of Scotland… As a result, Evangelicals also saw these public prayer meetings as a suitable context in which to ask God to send religious revival. This latter purpose prevailed after the threat of the epidemic passed away, at least among groups in the parish of Kilsyth, which continued to meet during the remainder of the 1830’s, asking God ‘to awaken a spirit of earnest and vital religion among them, and throughout the Christian Church generally’ .</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/david-alan-currie.html">David Alan Currie</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Growth of Evangelicalism in the Church of Scotland</cite>, 1793-1843 PhD diss. (Univ. of St. Andrews, 1991)</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/civil-government-and-society/plague-quarantine-and-public-health.html">Plague, Quarantine and Public Health</a></span></div>

<blockquote><p>[1. The Rule of Reformation.] The rule of building the house of God, and of the reformation of religion is the same and perpetual: the commandment of God, and not the commandment of man one or more, whether they be civil or ecclesiastical persons. It is their part to provide according to their places and callings, to command and direct that the Commandment of God be obeyed. This King commands not that his will be done, but what God has commanded. Neither King nor Parliament can command otherwise. Civil powers have great authority, not only in things civil, but in matters of Religion; and they sin against God, if they use not the authority which God hath put in their hands, for the good of Religion. To them belongs inspection and watching over, not only ecclesiasticos [ecclesiastical persons], but ecclesiastica [that which is ecclesiastical]. Ecclesiastical persons are subject to civil authority no less than others; and in respect of things-ecclesiastical, or matters of religion, Eusebius brings in Constantine the great, saying: ‘Vos Episcopi in Ecclesia, ego extra Ecclesiam seu templum Episcopus a Deo constitutus sum‘ [Ye are overseers in the Church; I am constituted of God an overseer outside of the Church Church]: Not that any mortal man whether Pope or Prince, can be properly Head of the Church, or vice-gerent [regent] unto Christ the Mediator in his special and economical Kingdom of Grace: for princes are vice-gerents to God, and to his Son Jesus Christ as He is God, in his universal Kingdom of Providence; and this watching and inspection of princes and magistrates, is objective ecclesiastica [objectively ecclesiastical], but formaliter civilis [formally civil], it is about matters of religion in a civil manner, and in a way suitable to the nature and quality of their place and power. The faithful custody and preservation of religion, is a part of their office: for they are not only keepers of the Second, but of the First Table of the Law… Religion also expects from them the civil sanction, that the worship of God, and the wholesome constitutions of the Church about religion, be confirmed and settled by their Laws. Coaction [coercion] also is theirs, for they by their power [in a Christian nation] are to constrain their subjects to the duties of religion, and to coerce and stop them that they do nothing to the contrary.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/alexander-henderson.html">Alexander Henderson</a></span><span class="wk"><span class="lbl">Work:</span> <cite>‘A Sermon Preached To the Honorable House of Commons, at Their late Solemn Fast, Wed., Dec. 27</cite>, 1643’ (London, 1644)</span></figcaption>

<blockquote><p>[Rutherford arguing against an opponent:] David, if he was formally king [when he had not yet been elected by the people, which he was not], deserted his calling in flying to the Philistines; for a king should not forsake his calling upon any hazard, even of his life, no more than a pilot should give over the helm in an extreme storm…</p></blockquote>

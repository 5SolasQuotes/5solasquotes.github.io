<main class="wrap"><figure class="quote" id="q-12fc15a909" data-kw="hypostasis three persons">
<blockquote><p>The fair inference from the Apostle’s words is, that there is a proper subsistence (hypostasis) of the Father, which shines refulgent in the Son. From this, again it is easy to infer that there is a subsistence (hypostasis) of the Son which distinguishes him from the Father. The same holds in the case of the Holy Spirit; for we will immediately prove both that he is God, and that he has a separate subsistence from the Father. This, moreover, is not a distinction of essence, which it were impious to multiply.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/john-calvin.html">John Calvin</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Institutes of the Christian Religion</cite>, 1.13.2</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/the-trinity/the-persons.html">The Persons</a> › <a href="../topics/the-trinity/the-persons/distinct-persons.html">Distinct persons</a></span><span class="t"><a href="../topics/the-trinity/the-persons.html">The Persons</a> › <a href="../topics/the-trinity/the-persons/person-and-subsistence.html">Person and subsistence</a></span></div>

</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-fbc2a8d264" data-kw="same substance three persons">
<blockquote><p>These three are one God, the same in substance, equal in power and glory. We have seen that the Scriptures teach that there is but one true and living God. They teach with equal clearness that this one true and living God exists as three distinct Persons.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/loraine-boettner.html">Loraine Boettner</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Trinity</cite>, §5</span></figcaption>

<blockquote><p>Hence it is evident what must be understood by the word “person.” That which among the Greeks is called “hypostasis” is with the Latins called persona.… properly and strictly, it denotes an intellectual suppositum.</p></blockquote>

</figure><figure class="quote" id="q-c36511e0ac" data-kw="Father unbegotten">
<blockquote><p>However, the Holy Spirit speaking in the Scriptures does not merely propose one God to us but also teaches us the way to approach God. Therefore, God is revealed to us in three persons, namely the Father, the Son, and the Holy Spirit, so that we may know the path by which God is accessible. For if you consider God absolutely as Lord and Judge, that terrifying majesty presents itself to the mind, whose brilliance dazzles the eye, and the most righteous tribunal whose aspect strikes the conscience of men with sheer terror.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/pierre-du-moulin.html">Pierre Du Moulin</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Theological Theses on the One God and Three Persons</cite>, VII</span></figcaption>

<blockquote><p>In the one only and most simple essence of God there are three distinct persons so distinguished from each other by incommunicable properties or modes of subsisting that one cannot be the other—although by an inexpressible circum-insession (emperichōrēsin) they always remain and exist in each other mutually.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/francis-turretin.html">Francis Turretin</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Institutes of Elenctic Theology</cite>, 3.25.1</span></figcaption>

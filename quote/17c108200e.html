<blockquote><p>3. The third thing is the goodness of God in his government…. his goodness hovers over the whole frame… to conduct them to those ends which might illustrate his wisdom and goodness to his creatures. His goodness does no less incline Him to provide for them than to frame them. ‘Tis the natural inclination of man to love what is purely the birth of his own strength or skill. He is fond of preserving his own inventions, as well as laborious in inventing them. ‘Tis the glory of a man to preserve them as well as to produce them. God loves everything which He has made, which love could not be without a continued diffusiveness to them, suitable to the end for which He made them.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/stephen-charnock.html">Stephen Charnock</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Several Discourses upon the Existence &amp; Attributes of God</cite>, … (d. 1680; London: Newman, 1682), Goodness of God, p. 645</span></figcaption>

<blockquote><p>…these considerations must be premised: 1. That mercy is otherwise in God than in man: in man indeed it is a grief or compassion conceived upon another’s misery: but in God it is only a propension and readiness of the divine will to help those which are in misery. 2. Mercy in God either signifies the inclination, power, faculty and property to show mercy, and this is natural in God: or the act and exercising of that property toward the creature, and this is so natural in God as yet it is directed by his will. 3. A thing is said to be natural two ways: Either that which only proceeds from the instinct of nature, as the fire naturally burns: or that whereunto nature inclines, yet not without direction of the will, as thus a man is said to speak, to understand naturally: So God is both ways naturally merciful, in Himself the first way; toward his creatures the second. Now to the arguments we answer: 1. The apostle [in Rom. 9:18] speaks not of the natural property, but of the act of mercy, which is directed by the will of God. 2. All the natural properties which are in God He always uses not, nor towards all: as his justice, power, longanimity, mercy: they are always in God, but He exercises them as it pleases Him. 3. Justice and mercy are not contrary, but cruelty is opposed to mercy: neither is there any contrariety in God, but in the effects in diverse subjects: as the Sun with the same heat mollifies the wax and hardens the clay. 4. Neither are these properties unequal in God, but the effects and acts only are unequal, as it pleases God to dispose in his freewill.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/andrew-willet.html">Andrew Willet</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Hexapla, that is, a Six-fold Commentary upon the Most Divine Epistle of the Holy Apostle, St. Paul to the Romans</cite>, … Romans... (Lege, 1611) | on ch. 9, Places of Controversy, Controversy 12, Whether mercy be a natural property in God, or an effect only of his will, against Socinus?</span></figcaption>

<blockquote><p>Fifteenthly and lastly, It is clearly evident that the Lord Christ has a strong inclination to save sinners, by his giving out of Scripture in that way and manner as He has done; the Lord Christ has given out Scripture so as to answer the objections of men and women, to answer all the evils of their hearts, all the pleas of corruption, and of a guilty conscience, and of the Devil himself: The Lord has given out Scripture so as to answer all that might hinder their coming in unto Him… Is not here encouragement enough unto poor sinners: — So here in the next words, ‘Whosoever will let him come and drink of the water of life freely:’ It’s laid down so as to answer all your objections, and to take away all your pleas you have to stave you off from Christ. So then you see clear evidences that Christ is willing to save sinners.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/william-greenhill.html">William Greenhill</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Sermons of Christ, his Last Discovery of Himself</cite>, ... (London: R.I., 1656), Christ’s Willingness to Save Sinners, 2nd Sermon, pp. 168-69</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/the-covenant-of-grace/the-gospel-offer.html">The Gospel Offer</a></span></div>

<blockquote><p>§3. That this will or volition must be acknowledged by us in the greatest and most worthy being (that is, God) is established: … 2. The nexus which intervenes between knowledge and will also demands that what one knows with the consciousness of knowledge, he also acknowledge according to the dignity and goodness of the thing which he observes in it; to which, attending, an intellectual being also tends and is borne toward it as toward a good thing—which belongs to the will. But this has place much more and more eminently in God, whose intellect, the more perfect it is, so much the more distinctly represents to His most absolute thought the truth and goodness of things in their objects: which things, when He approves, He wills well.</p></blockquote>

<main class="wrap"><figure class="quote" id="q-ac4705b8fe" data-kw="">
<blockquote><p>For the erecting of a Church within a presbyterian Church, I must say that it is a novation with a witness. Our friends express much zeal for the obligation of our covenants (which I acknowledge is inviolable) and therefore I would recommend to their serious views that article of our National Covenant, whereby we abjure all novations contrary to our received standards. Sure I am, our old covenanters were not of their mind. I know no precedent for their way amongst us save this one, of which I think they will not be very fond, namely, that of the Public Resolutioners, who were the first that ever pretended to set up distinct judicatories in this Church: The Protesters sat with them in judicatories without any hesitation, and pressed to continue, and to act a faithful part as it might please the Lord to guide them, they were the separatists.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/john-currie.html">John Currie</a></span><span class="wk"><span class="lbl">Work:</span> <cite>An Essay on Separation</cite></span></figcaption>

</figure><figure class="quote" id="q-4da3f6c3f7" data-kw="">
<blockquote><p>Unhappily, however, a spirit of disunion began to appear among their leaders, who, instead of combining against the common enemy, spent their time in hot disputes about points in which the most hearty and genuine friends of the Presbyterian cause [outside the establishment] differed from each other. These disputes referred to the indulgence; and it may appear strange that there should have been any controversy about a subject with regard to the sinfulness of which all of them were agreed. The question agitated was not whether the indulgence was lawful, but whether the acceptance of it should be expressly condemned in the proclamation to be made by those who were in arms, and numbered among their causes of fasting. This was opposed by some as inexpedient, because it would hinder many from joining them who were cordial friends to Presbytery; and it was proposed that this point should be reserved for the determination of a free General Assembly.¹ At the head of this party was Mr. John Welsh, whose expulsion from Irongray was formerly noticed, and who was not only in his own judgment opposed to the indulgence, but had been intercommuned for preaching in the fields for many years. Among all the eighteen ministers present, there was not one who had accepted the indulgence, or who approved of it. ¹ M’Crie’s Miscellaneous Writings, Review of Tales, &amp;c, p. 437. Sixteen of these ministers while they condemned the Erastianism of the indulgence, and deplored the conduct of their brethren who had accepted it, were not prepared to exclude them from their ranks, or refuse aid from them in the common cause. Though they themselves could not conscientiously submit to the restrictions, or the acknowledgments implied in that insidious measure, they were disposed to make allowances for such of their brethren as had yielded under strong temptation or plausible arguments; and they argued, that whatever ecclesiastical censure their conduct might afterwards be found to deserve, to deny them in the meantime the opportunity of vindicating their rights and liberties, civil and religious, by excluding them from the army, would be no less presumptuous and unjust in principle, than it was preposterous in the present circumstances of the country. This liberal view of the subject was opposed by only two of the ministers, namely, Mr. [Donald] Cargill and Mr. [Thomas] Douglas; but these were supported by a considerable number of the lay leaders of the army, at the head of whom was Sir Robert Hamilton. Hamilton appears to have been a pious man, and of good intentions; but of narrow views, severe in his temper, and altogether unqualified by want of military talents and experience, for the command which he assumed. He is charged, and apparently not without reason, with having been active in pushing Cargill, Cameron,² and some other ministers, to those extremes which produced a breach between them and their brethren, with whom they had until of late acted in concert.³ ² Richard Cameron was not present at Bothwell, being at that time in Holland, but he returned to Scotland shortly after. He declared to the ministers who licensed him, “that he would be a bone of contention among them; for if ever he preached against a national sin in Scotland, it should be against the indulgence, and for separation from the indulged.” [P. Walker’s Biograph. Presbyter, i. 292) ³ M’Crie’s Mem. of Veitch, &amp;c., Notices of James Ure, p. 452. I am sorry I cannot retract the judgment here pronounced on the character of Hamilton, the correctness of which has been challenged by some, but which is borne out by the whole of his history, and refers entirely to his public management, without any reflection either on his piety, his integrity, or his courage. This party now began to maintain that the king [Charles II], by assuming an Erastian power over the Church, had forfeited all right to the civil obedience of his subjects; a principle which had never been known in the Church of Scotland before, and which was afterwards carried to a great extent by Richard Cameron and his followers, who from him were termed Cameronians. On the present occasion they insisted that there should be inserted in the statement of their quarrel a decided condemnation of those who had taken the benefit of the indulgence; and proceeding on a mistaken view of the principles advocated by the Church of Scotland in the time of the Engagement, and by the Protesters in their contendings against the public resolutions [in the late-1640’s and early-1650’s], they refused to admit any into their ranks but those who would condemn and testify against the indulgence.† † M’Crie’s Memoirs of Veitch, &amp;c., p. 453… The violence, pertinacity, and extravagance of this party, prevailed over the more sober counsels of their brethren; and the consequence was, that several of the latter left the army in disgust. Still, however, the great body of the people remained, and though placed in the most unfavourable circumstances for meeting the enemy, they drew up with determined front at Bothwell Bridge, where they awaited their approach. The Covenanters behaved with the utmost gallantry, but, overpowered by superior numbers, they soon gave way, and the royal army obtained an easy victory over troops divided and disheartened by the conduct of their leaders.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/thomas-m-crie-jr.html">Thomas M’Crie Jr.</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Story of the Scottish Church</cite>, (London: Blackie &amp; Son, 1875), pp. 328-331</span></figcaption>

nowledgments+implied+in+that+insidious+measure%2C+they+were+disposed+to+make+allowances+for+such+of+their+brethren+as+had+yielded+under+strong+temptation+or+plausible+arguments%3B+and+they+argued%2C+that+whatever+ecclesiastical+censure+their+conduct+might+afterwards+be+found+to+deserve%2C+to+deny+them+in+the+meantime+the+opportunity+of+vindicating+their+rights+and+liberties%2C+civil+and+religious%2C+by+excluding+them+from+the+army%2C+would+be+no+less+presumptuous+and+unjust+in+principle%2C+than+it+was+preposterous+in+the+present+circumstances+of+the+country.+This+liberal+view+of+the+subject+was+opposed+by+only+two+of+the+ministers%2C+namely%2C+Mr.+%5BDonald%5D+Cargill+and+Mr.+%5BThomas%5D+Douglas%3B+but+these+were+supported+by+a+considerable+number+of+the+lay+leaders+of+the+army%2C+at+the+head+of+whom+was+Sir+Robert+Hamilton.+Hamilton+appears+to+have+been+a+pious+man%2C+and+of+good+intentions%3B+but+of+narrow+views%2C+severe+in+his+temper%2C+and+altogether+unqualified+by+want+of+military+talents+and+experience%2C+for+the+command+which+he+assumed.+He+is+charged%2C+and+apparently+not+without+reason%2C+with+having+been+active+in+pushing+Cargill%2C+Cameron%2C%C2%B2+and+some+other+ministers%2C+to+those+extremes+which+produced+a+breach+between+them+and+their+brethren%2C+with+whom+they+had+until+of+late+acted+in+concert.%C2%B3+%C2%B2+Richard+Cameron+was+not+present+at+Bothwell%2C+being+at+that+time+in+Holland%2C+but+he+returned+to+Scotland+shortly+after.+He+declared+to+the+ministers+who+licensed+him%2C+%E2%80%9Cthat+he+would+be+a+bone+of+contention+among+them%3B+for+if+ever+he+preached+against+a+national+sin+in+Scotland%2C+it+should+be+against+the+indulgence%2C+and+for+separation+from+the+indulged.%E2%80%9D+%5BP.+Walker%E2%80%99s+Biograph.+Presbyter%2C+i.+292%29+%C2%B3+M%E2%80%99Crie%E2%80%99s+Mem.+of+Veitch%2C+%26c.%2C+Notices+of+James+Ure%2C+p.+452.+I+am+sorry+I+cannot+retract+the+judgment+here+pronounced+on+the+character+of+Hamilton%2C+the+correctness+of+which+has+been+challenged+by+some%2C+but+which+is+borne+out+by+the+whole+of+his+history%2C+and+refers+entirely+to+his+public+management%2C+without+any+reflection+either+on+his+piety%2C+his+integrity%2C+or+his+courage.+This+party+now+began+to+maintain+that+the+king+%5BCharles+II%5D%2C+by+assuming+an+Erastian+power+over+the+Church%2C+had+forfeited+all+right+to+the+civil+obedience+of+his+subjects%3B+a+principle+which+had+never+been+known+in+the+Church+of+Scotland+before%2C+and+which+was+afterwards+carried+to+a+great+extent+by+Richard+Cameron+and+his+followers%2C+who+from+him+were+termed+Cameronians.+On+the+present+occasion+they+insisted+that+there+should+be+inserted+in+the+statement+of+their+quarrel+a+decided+condemnation+of+those+who+had+taken+the+benefit+of+the+indulgence%3B+and+proceeding+on+a+mistaken+view+of+the+principles+advocated+by+the+Church+of+Scotland+in+the+time+of+the+Engagement%2C+and+by+the+Protesters+in+their+contendings+against+the+public+resolutions+%5Bin+the+late-1640%E2%80%99s+and+early-1650%E2%80%99s%5D%2C+they+refused+to+admit+any+into+their+ranks+but+those+who+would+condemn+and+testify+against+the+indulgence.%E2%80%A0+%E2%80%A0+M%E2%80%99Crie%E2%80%99s+Memoirs+of+Veitch%2C+%26c.%2C+p.+453%E2%80%A6+The+violence%2C+pertinacity%2C+and+extravagance+of+this+party%2C+prevailed+over+the+more+sober+counsels+of+their+brethren%3B+and+the+consequence+was%2C+that+several+of+the+latter+left+the+army+in+disgust.+Still%2C+however%2C+the+great+body+of+the+people+remained%2C+and+though+placed+in+the+most+unfavourable+circumstances+for+meeting+the+enemy%2C+they+drew+up+with+determined+front+at+Bothwell+Bridge%2C+where+they+awaited+their+approach.+The+Covenanters+behaved+with+the+utmost+gallantry%2C+but%2C+overpowered+by+superior+numbers%2C+they+soon+gave+way%2C+and+the+royal+army+obtained+an+easy+victory+over+troops+divided+and+disheartened+by+the+conduct+of+their+leaders.%E2%80%9D%0A%0A%E2%80%94+Thomas+M%E2%80%99Crie+Jr.%2C+The+Story+of+the+Scottish+Church%3A+from+the+Reformation+to+the+Disruption+%28London%3A+Blackie+%26+Son%2C+1875%29%2C+pp.+328-331&amp;url=https%3A%2F%2F5solasquotes.github.io%2Fquote%2F4da3f6c3f7.html&amp;via=5Solas" target="_blank" rel="noopener">Share on X</a><a class="perma" href="../quote/4da3f6c3f7.html">Permalink</a><a class="src" href="https://reformedbooksonline.com/on-cameronianism/#:~:text=Unhappily%2C%20however%2C%20a%20spirit%20of%20disunion,by%20the%20conduct%20of%20their%20leaders&amp;text=Unhappily%2C%20however%2C%20a%20spirit%20of%20disunion%20began%20to&amp;text=and%20disheartened%20by%20the%20conduct%20of%20their%20leaders" rel="noopener" target="_blank">Read it online · Reformed Books Online</a></div>

</figure><figure class="quote" id="q-5a8d4c7847" data-kw="">
<blockquote><p>…the King has sufficient power to oppose wasters of his kingdom and to require homage of his subjects. Suppose he have not an unlimited power to forbid these of other nations and Churches, and his own, to go to a synod, within or without his nation, for the settling of the Churches in necessary peace and truth, if the Churches must seek liberty and counsel for their souls good, and edification: nor has he any lawful power from God to hinder his own subjects to send commissioners to sound and godly synods for counsel and synodical light, more than Jeroboam could lawfully forbid the people to go and worship at Jerusalem, upon pretense that they might be persuaded to cleave to Rehoboam their lawful prince, and waste his new kingdom: nor hath the prince an unlimited and absolute power to exact such absolute homage of his people; nor such a power over their moving from place: ([Margin note:] The Lord of Life has principally in the First Table laid a law upon our locomotive, and all our actings, to honor and love Him first, and the prince only secondarily and subordinately to God; if God charge us first to go to public meetings to honor Him, the Prince under pretense of peace cannot forbid the people to go up to Jerusalem to worship; we are to obey God rather than man.) for so the [claimed] Church Independent of Jerusalem consisting of ten thousand, if not more, should have no intrinsic power to meet for the public worship of God; but the prince must have a lawful power to hinder their meeting, or then the Church cannot have a lawful power to meet; for the convening of ten thousands, if abused, is as dangerous for wasting of a kingdom in its own way, as the convening of a national synod, is, or may be destructive to peace.</p></blockquote>

</figure><figure class="quote" id="q-93bcfc0f7e" data-kw="">
<blockquote><p>And so judgement-like is [men’s] withdrawing [from God], and smells so of vengeance, that God plagues withdrawing with withdrawing: Hos. 5:4, ‘They will not frame their doings to turn unto their God.’ And what is the issue of that? ‘They shall go with their flocks and herds to seek the Lord, but they shall not find Him; for He hath withdrawn Himself from them.’ Prov. 1:24, ‘I called, and ye refused;’ Verse 26, then this must follow, verse 28 (as also Jn. 8:21, the like is) ‘they shall call upon Me, but I will not answer.’ Use 6. It’s a terrible plague of God, which we would eschew as hell, to wit, provoking of God by such sins as may procure that God should in his judgement mar the lock of the heart, the will, that the door should neither shut nor open; and cast poison into the soul, so as angels and men, heaven and earth cannot help or cure it: Christ is good at opening hearts, and drawing sinners; and He is as good at judicial closing of hearts: If He but put his finger in the eye, and snap in pieces the optic nerves, all the world cannot restore sight, or open the heart. He that is nearest to be drawn to Christ, and yet never drawn, is deepest in hell: An evangelic-fire of God’s fury is worse than a Sinai-fire, though it burn up to mid-heaven: 1. Sinning against the light of nature and the known will of God, as idolatry and the principles of your own religion, true and known to be so, brings delivering up to judicial blindness, Rom. 1:21. 2. If ye put your finger in nature’s eye, and blow out that candle, God will give you up to vile affections, Rom. 1:24 and a reprobate mind, vv. 26-28. Some blow out the candle of nature, and God blows out the sun of the Gospel, that it is to them like sack-cloth of hair, and a moon like blood. 3. Resisting of the call of God, brings on the plague of hardness of heart; Pro. 1:24-27; Acts 28:23-27; Jn. 8:21.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/samuel-rutherford.html">Samuel Rutherford</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Christ Dying and Drawing Sinners to Himself... (London, 1647)</cite>, pp. 332-3</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/civil-government-and-society/plague-quarantine-and-public-health.html">Plague, Quarantine and Public Health</a></span></div>

</figure><figure class="quote" id="q-f02898842e" data-kw="">
<blockquote><p>Sept, 17, 1585 Lyttis of the deacons [servants] elected. Henry Nesbet and William Nesbet, bailies, Nicoll Uddert, Dean of Guild, James Ros, Thesaurer [Treasurer], William Littill, Androw Sclater, George Smyth, Tailor [Jailor?], of the Council, and Jhonn Stevinsoun, deykin [deacon/servant?] of the weavers, remembering that since the beginning of this present pestilence they have remained within this burgh constantly, sustained the burdening of the offices laid upon them unto this hour, with the loss and death for the most part of diverse of their children, servants, and family, and not without the extreme danger of their own lives, most eminently known unto all men, the rest of their brethren of the council and deykins [deacons/servants], which were no less astricted, oblist [obliged], and sworn to assist and take care of this commonwealth, having deserted their places and forsaken their offices, contrary to their oaths and allegiance made and given, and yet continuing has not repaired to this burgh at this most necessary time, approached and appointed to convene and surrogate others in their room, whereby the whole estate of this burgh is appearing to fall in confusion; Therefore…</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/city-of-edinburgh.html">City of Edinburgh</a></span><span class="wk"><span class="lbl">Work:</span> <cite>‘Extracts from the Records: 1585, Jul-Sept’, in Extracts From the Records of the Burgh of Edinburgh, 1573-1589, ed. J D Marwick (Edinburgh, 1882), pp. 430-437. British History Online</cite></span></figcaption>

<div class="actions"><button class="copy" data-copy="“Sept, 17, 1585 Lyttis of the deacons [servants] elected. Henry Nesbet and William Nesbet, bailies, Nicoll Uddert, Dean of Guild, James Ros, Thesaurer [Treasurer], William Littill, Androw Sclater, George Smyth, Tailor [Jailor?], of the Council, and Jhonn Stevinsoun, deykin [deacon/servant?] of the weavers, remembering that since the beginning of this present pestilence they have remained within this burgh constantly, sustained the burdening of the offices laid upon them unto this hour, with the loss and death for the most part of diverse of their children, servants, and family, and not without the extreme danger of their own lives, most eminently known unto all men, the rest of their brethren of the council and deykins [deacons/servants], which were no less astricted, oblist [obliged], and sworn to assist and take care of this commonwealth, having deserted their places and forsaken their offices, contrary to their oaths and allegiance made and given, and yet continuing has not repaired to this burgh at this most necessary time, approached and appointed to convene and surrogate others in their room, whereby the whole estate of this burgh is appearing to fall in confusion; Therefore…”

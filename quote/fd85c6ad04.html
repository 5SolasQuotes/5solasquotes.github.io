<blockquote><p>As to the relation of good works to rewards, it may be observed—(1.) The word merit, in the strict sense of the term, means that common quality of all actions or services to which a reward is due in strict justice on account of their intrinsic value or worthiness. It is evident that, in this strict sense, no work of any creature can in itself merit any reward from God, because (a) all the faculties he possesses were originally granted and are continuously sustained by God, so that he is already so far in debt to God that he can never bring God in debt to him. (b.) Nothing the creature can do can be a just equivalent for the incomparable favour of God and its consequences. There is another sense of the word, however, in which it may be affirmed that if Adam had in his original probation yielded the obedience required, he would have “merited” the reward conditioned upon it, not because of the intrinsic value of that obedience, but because of the terms of the covenant which God had graciously condescended to form with him. By nature, the creature owed the Creator obedience, while the Creator owed the creature nothing. But by covenant the Creator voluntarily bound himself to owe the creature eternal life, upon the condition of perfect obedience.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/a-a-hodge.html">A. A. Hodge</a></span><span class="wk"><span class="lbl">Work:</span> <cite>A Commentary on the Confession of Faith</cite>, (Philadelphia: Presbyterian Board of Publication and Sabbath-School Work, 1869), 307–08.</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/good-works/merit-and-reward.html">Merit and Reward</a></span></div>

</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-289bf00ef4" data-kw="">
<blockquote><p>By his good works the just man may merit for himself many graces and favours, not, however, by right and justice (de condigno), but only congruously (de congruo). Most theologians incline to the opinion that the grace of final perseverance is among the objects of congruous merit, which grace, as has been shown above, is not and cannot be merited condignly.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/joseph-pohle.html">Joseph Pohle</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Catholic Encyclopedia</cite>, s.v. “Merit” (1911)</span></figcaption>

</figure><figure class="quote" id="q-d2a7d4c853" data-kw="">
<blockquote><p>For, whereas Jesus Christ Himself continually infuses his virtue into the said justified,-as the head into the members, and the vine into the branches,-and this virtue always precedes and accompanies and follows their good works, which without it could not in any wise be pleasing and meritorious before God,-we must believe that nothing further is wanting to the justified, to prevent their being accounted to have, by those very works which have been done in God, fully satisfied the divine law according to the state of this life, and to have truly merited eternal life, to be obtained also in its (due) time, if so be, however, that they depart in grace.</p></blockquote>

<blockquote><p>9.3 The Covenant Of Works The covenant of works is the pact of God initiated with the uncorrupted Adam, as head of the whole human race, in which He stipulated from man perfect obedience to the law, promised eternal, heavenly life for the same obedience, but threatened eternal death for transgression, and in turn man promised perfect obedience to God who stipulated, which having furnished, he could expect eternal, heavenly life. Scripture testifies that such a covenant existed with Adam. “They…(like Adam) transgressed the covenant” (Hos. 6:7). And God established the sacrament of the same covenant, “the tree of life” (Gen. 2:9). (VII). 9.4. God And Adam Covenanted They were covenanted, God as the Creator, Law-giver, and Rewarder, and Adam as the first man, uncorrupt, and head of the human race. For Adam was the “one blood” in which the whole posterity lay hidden (Acts 17:26), and he was “the first Adam,” equally representing those to be born from his blood, and “the second Adam” represents the faithful; indeed, he is a “type of” the one “to come” (Rom. 5:14). And since the remaining words concern the whole human race, the human race cannot be secluded from the covenant initiated with him. (VIII). 9.10. The Promise Of Heavenly And Eternal Life The promise of the covenant of works was eternal and heavenly life. This sacrament of it, “the tree of life,” by all means true and…(eternal) (Gen. 2:9), sanctioned not only for animals, and the earthly blessings that he already possessed, in which there was no διαθήκη (covenant), but there was προσθήκη (an accession) to the covenant. And when Christ, fulfilling the law in our place, merited eternal and heavenly life for us, He obtained the fulfillment of the same law by merit for us. Indeed, God promised something more in the covenant of works than that of whom could be a sharer outside of that. And it was not other than the translation into heavenly Paradise. (XXIII–XXVI). 10.4. The Stipulation Of God And The Promise Of The Son In this singular pact God the Father demanded from the Son, as Mediator, vicarious obedience to the law for man the sinner, and the Son promised it in turn. “Behold, I come. In the scroll of the book it has been written about me, that I shall do Your will” (Ps. 40:8–9). “Where He placed His soul as sacrifice, He will see a seed” (Isa. 53:10). “This commandment I have received from the Father, that I may place My soul” (John 10:17, 18). “He was born from a woman, gενόμενος ὑπὸ νόμον (born under the law) (Gal. 4:4). Therefore, everywhere Christ comes in the name br[ ἐγτύου and παρακλήτου (of advocate, guarantor), by guaranteeing and promising for another, of the one who receives Him in his faith (Job 33:23, Jer. 30:21, Isa. 38:14, Heb. 7:22). This Sponsor is at the same time is called “Mediator” (1 Tim. 2:5, Heb. 8:6), “Testator” (Heb. 9:15, 16), “High Priest” (Heb. 7:26), “Vindicator” (Job 19:25, Heb 2:16), etc. (VII–XIV). 10.5. The Demand Of The Son The demand of the same Son follows the promise. For as God the Father demanded payment from the Son and promised inheritance for paying, so the Son by promising and furnishing it, acquired the right to claim an inheritance, church, people of His own possession. “Demand from Me, and I will give you the nations as Your inheritance, and the ends of the earth as Your possession” (Ps. 2:8). “Surely My judgment is before the Lord, and…(My works) are a price before My God” (Isa. 49:4). For the promise and obedience of the Son had reason of true merit, even from condignity, for which nothing could be lacking (XIV).</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/johann-heinrich-heidegger.html">Johann Heinrich Heidegger</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Concise Marrow of Christian Theology</cite>, (1697). Trans. Casey Carmichael. ©R. Scott Clark and Casey Carmichael 2015.</span></figcaption>

CE%B8%CE%AE%CE%BA%CE%B7+%28covenant%29%2C+but+there+was+%CF%80%CF%81%CE%BF%CF%83%CE%B8%CE%AE%CE%BA%CE%B7+%28an+accession%29+to+the+covenant.+And+when+Christ%2C+fulfilling+the+law+in+our+place%2C+merited+eternal+and+heavenly+life+for+us%2C+He+obtained+the+fulfillment+of+the+same+law+by+merit+for+us.+Indeed%2C+God+promised+something+more+in+the+covenant+of+works+than+that+of+whom+could+be+a+sharer+outside+of+that.+And+it+was+not+other+than+the+translation+into+heavenly+Paradise.+%28XXIII%E2%80%93XXVI%29.+10.4.+The+Stipulation+Of+God+And+The+Promise+Of+The+Son+In+this+singular+pact+God+the+Father+demanded+from+the+Son%2C+as+Mediator%2C+vicarious+obedience+to+the+law+for+man+the+sinner%2C+and+the+Son+promised+it+in+turn.+%E2%80%9CBehold%2C+I+come.+In+the+scroll+of+the+book+it+has+been+written+about+me%2C+that+I+shall+do+Your+will%E2%80%9D+%28Ps.+40%3A8%E2%80%939%29.+%E2%80%9CWhere+He+placed+His+soul+as+sacrifice%2C+He+will+see+a+seed%E2%80%9D+%28Isa.+53%3A10%29.+%E2%80%9CThis+commandment+I+have+received+from+the+Father%2C+that+I+may+place+My+soul%E2%80%9D+%28John+10%3A17%2C+18%29.+%E2%80%9CHe+was+born+from+a+woman%2C+g%CE%B5%CE%BD%CF%8C%CE%BC%CE%B5%CE%BD%CE%BF%CF%82+%E1%BD%91%CF%80%E1%BD%B8+%CE%BD%CF%8C%CE%BC%CE%BF%CE%BD+%28born+under+the+law%29+%28Gal.+4%3A4%29.+Therefore%2C+everywhere+Christ+comes+in+the+name+br%5B+%E1%BC%90%CE%B3%CF%84%CF%8D%CE%BF%CF%85+and+%CF%80%CE%B1%CF%81%CE%B1%CE%BA%CE%BB%CE%AE%CF%84%CE%BF%CF%85+%28of+advocate%2C+guarantor%29%2C+by+guaranteeing+and+promising+for+another%2C+of+the+one+who+receives+Him+in+his+faith+%28Job+33%3A23%2C+Jer.+30%3A21%2C+Isa.+38%3A14%2C+Heb.+7%3A22%29.+This+Sponsor+is+at+the+same+time+is+called+%E2%80%9CMediator%E2%80%9D+%281+Tim.+2%3A5%2C+Heb.+8%3A6%29%2C+%E2%80%9CTestator%E2%80%9D+%28Heb.+9%3A15%2C+16%29%2C+%E2%80%9CHigh+Priest%E2%80%9D+%28Heb.+7%3A26%29%2C+%E2%80%9CVindicator%E2%80%9D+%28Job+19%3A25%2C+Heb+2%3A16%29%2C+etc.+%28VII%E2%80%93XIV%29.+10.5.+The+Demand+Of+The+Son+The+demand+of+the+same+Son+follows+the+promise.+For+as+God+the+Father+demanded+payment+from+the+Son+and+promised+inheritance+for+paying%2C+so+the+Son+by+promising+and+furnishing+it%2C+acquired+the+right+to+claim+an+inheritance%2C+church%2C+people+of+His+own+possession.+%E2%80%9CDemand+from+Me%2C+and+I+will+give+you+the+nations+as+Your+inheritance%2C+and+the+ends+of+the+earth+as+Your+possession%E2%80%9D+%28Ps.+2%3A8%29.+%E2%80%9CSurely+My+judgment+is+before+the+Lord%2C+and%E2%80%A6%28My+works%29+are+a+price+before+My+God%E2%80%9D+%28Isa.+49%3A4%29.+For+the+promise+and+obedience+of+the+Son+had+reason+of+true+merit%2C+even+from+condignity%2C+for+which+nothing+could+be+lacking+%28XIV%29.%E2%80%9D%0A%0A%E2%80%94+J.H.+Heidegger%2C+The+Concise+Marrow+of+Christian+Theology+%281697%29.+Trans.+Casey+Carmichael.+%C2%A9R.+Scott+Clark+and+Casey+Carmichael+2015.&amp;url=https%3A%2F%2F5solasquotes.github.io%2Fquote%2Fc047bece1d.html&amp;via=5Solas" target="_blank" rel="noopener">Share on X</a><a class="perma" href="../quote/c047bece1d.html">Permalink</a><a class="src" href="https://heidelblog.net/2015/04/j-h-heidegger-christ-condignly-merited-as-the-second-adam/" rel="noopener" target="_blank">Read it online · Heidelblog</a></div>

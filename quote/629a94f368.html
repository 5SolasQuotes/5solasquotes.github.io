<main class="wrap"><figure class="quote" id="q-629a94f368" data-kw="">
<blockquote><p>If we look about us, how often are we shocked to observe either the calamities of our country, or the sad disasters of our relations and friends, whom we have daily occasion to mourn, either as groaning under the pressures of poverty, pining away under languishing diseases, tortured by acute ones, or carried off by death, while we ourselves are, in like manner, very soon, to draw tears from the eyes of others; nay how often are we a burden to ourselves, and groan heavily under afflictions of our own, that press hard upon our estates, our bodies, or our minds?</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/robert-leighton.html">Robert Leighton</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Theological Lectures, Read in the Publick Hall of the University of Edinburgh. Together with Exhortations to the Candidates for the Degree of Master of Arts</cite>, (London: Plato’s Head, 1763), Lect. VI, pp 52-53.</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/civil-government-and-society.html">Civil Government and Society</a></span></div>

<blockquote><p>The officers that rule the world in God’s stead, as father mother, master, husband, lord and prince, are honoured, when the law, which Almighty God has committed unto them to rule with, is obeyed. Thy neighbour that is out of office is honored, when thou (as God has commanded thee) lovest Him as thyself, countest him as good as thyself, thinkest him as worthy of any thing as thyself, and comest lovingly to help him at all his need, as thou wouldest be holp thyself; because God hath made him like unto his own image, as well as thee, and Christ hath bought him as well as thee. If I hate the law, so I break it in mine heart; and both hate and dishonour God, the maker thereof. If I break it outwardly, then I dishonour God before the world, and the officer that ministers it. If I hurt my neighbour, then I dishonor my neighbor and Him that made him, and him also that bought him with his blood… If I be not ready to help my neighbor at his need, so I take his due honour from him, and dishonour him, and him that made him, and Him also that bought him with his blood, whose servant he is… In like manner, if the officer, abusing his power, compel the subject to do that which God forbiddeth, or to leave undone that which God commandeth, so he dishonoureth God in withdrawing his servant from him, and maketh an idol of his own lusts, in that he honoureth them above God; and he dishonoureth his brother in that he abuseth him, contrary unto the right use which God hath created him for, and Christ hath bought him for, which is to wait on God’s commandments. For if the officer be otherwise minded than this, the worst of these subjects is made by the hands of Him that made me, and bought with the blood of Him that bought me, and therefore, my brother; and I but his servant only, to defend him, and to keep him in the honour that God and Christ has set him, that no man dishonors him: he dishonours both God and man.</p></blockquote>

<blockquote><p>2. The civil corporation may: [1.] limit the major [an official] in regard of time, for a year and no longer; 2. they may make him half a tyrant, a dictator and absolute, or give him less power, that he shall rule none but with the consent of 12 assessors; but the people may not make him a pastor for a year and then lay him aside for no fault as a major is unofficed; nor may they limit him so as he shall not preach in season and out of season but by the consent of 12 men.

3. The corporation may erect itself in a kingdom or commonwealth and may create consuls, dictators, praetors, tribunos plebis, etc. as may most serve for the safety and peace of this State; but the Church may bring in no new officers but those appointed by Christ; nor may they alter the government, and metamorphose it into another than that which is according to the pattern showed in the mount.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/samuel-rutherford.html">Samuel Rutherford</a></span><span class="wk"><span class="lbl">Work:</span> <cite>A Survey of the Survey of that Sum of Church-Discipline Penned by Mr. Thomas Hooker</cite>, p. 278</span></figcaption>

</figure><figure class="quote" id="q-1cf524a599" data-kw="">
<blockquote><p>There are his rights of conscience, and more especially the right of judging for himself what is his duty and what his sin in reference to God, and of determining for himself what he shall believe as God’s truth, and what reject as man’s doctrine and commandment. There are the rights of his soul, and more especially the right to that salvation which his soul requires, and which is freely given him of God.

These are rights intimately spiritual nature, which are dearer and better to him than property or life; and these rights the Church of Rome, in the exercise of its ecclesiastical power, has rudely trampled on, or violently taken away. And the history of that Church tells on its every page, and in characters never to be effaced, that the spiritual power committed to it “for edification” has been turned “ to the destruction” of the body of Christ.

First, Popery has turned the power of the Church to the purposes of destruction, by violently taking away or rudely disregarding the rights of man, viewed as a rational and intellectual being. The right of every man to think and to judge for himself, and on his own responsibility, as a rational creature, Popery has taken away from its victims; and above all, the right to know God directly and immediately, by what God has made known of Himself, the Church of Rome has denied, and by its ecclesiastical power interdicted to its slaves.

Itself blind, and the leader of the blind, who have trusted it, the Church of Rome has “taken away the key of knowledge,” lest men should exercise their right to know God, and see for themselves His revealed will. It has sealed up the Bible as a perilous book, and forbidden men to receive it, except through the interpretation and teaching of the Church; thus standing between men and the knowledge of God in the way that God has given that knowledge in His own word.

It is the first right of every human being, as a rational and intellectual creature, to understand God; because this was the very end for which he was made, and for which he lives. It was the distinctive purpose of his creation; and it is not only to degrade him from his place in creation, but to destroy his very character as a rational creature, to take from him by violence and wrong the right he has to know God in the way in which God has made Himself to be known. A power so employed as to rob man by force or fraud of this right, and to substitute the teaching of a fellow-creature for the Word of God addressed to his understanding, is a power exercised not for edification, but destruction.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/james-bannerman.html">James Bannerman</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Church of Christ: A Treatise on the Nature, Powers, Ordinances, Discipline, and Government of the Christian Church</cite>, ed. D. Douglas Bannerman (2 vols, Edinburgh: T &amp; T Clark, 1868), 1: 258-59.</span></figcaption>

and+see+for+themselves+His+revealed+will.+It+has+sealed+up+the+Bible+as+a+perilous+book%2C+and+forbidden+men+to+receive+it%2C+except+through+the+interpretation+and+teaching+of+the+Church%3B+thus+standing+between+men+and+the+knowledge+of+God+in+the+way+that+God+has+given+that+knowledge+in+His+own+word.%0A%0AIt+is+the+first+right+of+every+human+being%2C+as+a+rational+and+intellectual+creature%2C+to+understand+God%3B+because+this+was+the+very+end+for+which+he+was+made%2C+and+for+which+he+lives.+It+was+the+distinctive+purpose+of+his+creation%3B+and+it+is+not+only+to+degrade+him+from+his+place+in+creation%2C+but+to+destroy+his+very+character+as+a+rational+creature%2C+to+take+from+him+by+violence+and+wrong+the+right+he+has+to+know+God+in+the+way+in+which+God+has+made+Himself+to+be+known.+A+power+so+employed+as+to+rob+man+by+force+or+fraud+of+this+right%2C+and+to+substitute+the+teaching+of+a+fellow-creature+for+the+Word+of+God+addressed+to+his+understanding%2C+is+a+power+exercised+not+for+edification%2C+but+destruction.%E2%80%9D%0A%0A%E2%80%94+James+Bannerman%2C+The+Church+of+Christ%3A+A+Treatise+on+the+Nature%2C+Powers%2C+Ordinances%2C+Discipline%2C+and+Government+of+the+Christian+Church%2C+ed.+D.+Douglas+Bannerman+%282+vols%2C+Edinburgh%3A+T+%26+T+Clark%2C+1868%29%2C+1%3A+258-59.&amp;url=https%3A%2F%2F5solasquotes.github.io%2Fquote%2F1cf524a599.html&amp;via=5Solas" target="_blank" rel="noopener">Share on X</a><a class="perma" href="../quote/1cf524a599.html">Permalink</a><a class="src" href="https://reformedcovenanter.wordpress.com/2021/01/26/james-bannerman-on-popery-and-the-rights-of-man/" rel="noopener" target="_blank">Read it online · Reformed Covenanter</a></div>

<blockquote><p>XV. …the orthodox maintain… the question here… (4) It is not whether any dissent of parents avaricious and through sheer obstinacy will not consent to the proper marriage of children and cannot give sufficient reasons for their dissent after the request has been made by their children that the latter are not absolutely bound to their will, but it is right for them to apply to a superior power to whom a judgment concerning the justice or injustice of the dissent belongs. Thus the matter being well considered, they may determine what the children ought to do and consult their interest by supplying in this point the defect of the consent of the parents.</p></blockquote>

<main class="wrap"><figure class="quote" id="q-7e99baf610" data-kw="">
<blockquote><p>IV. But the mutual union (which, on the part of an elect person, is likewise active and operative), whereby the soul draws near to Christ, joins itself to Him, applies, and in a becoming and proper manner closes with Him without any distraction, is made by faith only. And this is followed in order by the other benefits of the covenant of grace, justification, peace, adoption, sealing, perseverance, etc.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/herman-witsius.html">Herman Witsius</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Conciliatory or Irenical Animadversions on the Controversies Agitated in Britain: under the Unhappy Names of Antinomians &amp; Neonomians (1696; Glasgow, 1807), ch. 6</cite>, p. 68</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/assurance-peace-and-joy/assurance-of-salvation.html">Assurance of Salvation</a></span></div>
<div class="actions"><button class="copy" data-copy="“IV. But the mutual union (which, on the part of an elect person, is likewise active and operative), whereby the soul draws near to Christ, joins itself to Him, applies, and in a becoming and proper manner closes with Him without any distraction, is made by faith only. And this is followed in order by the other benefits of the covenant of grace, justification, peace, adoption, sealing, perseverance, etc.”

— Herman Witsius, Conciliatory or Irenical Animadversions on the Controversies Agitated in Britain: under the Unhappy Names of Antinomians &amp; Neonomians (1696; Glasgow, 1807), ch. 6, p. 68">Copy</button><a class="share" href="https://x.com/intent/post?text=%E2%80%9CIV.+But+the+mutual+union+%28which%2C+on+the+part+of+an+elect+person%2C+is+likewise+active+and+operative%29%2C+whereby+the+soul+draws+near+to+Christ%2C+joins+itself+to+Him%2C+applies%2C+and+in+a+becoming+and+proper+manner+closes+with+Him+without+any+distraction%2C+is+made+by+faith+only.+And+this+is+followed+in+order+by+the+other+benefits+of+the+covenant+of+grace%2C+justification%2C+peace%2C+adoption%2C+sealing%2C+perseverance%2C+etc.%E2%80%9D%0A%0A%E2%80%94+Herman+Witsius%2C+Conciliatory+or+Irenical+Animadversions+on+the+Controversies+Agitated+in+Britain%3A+under+the+Unhappy+Names+of+Antinomians+%26+Neonomians+%281696%3B+Glasgow%2C+1807%29%2C+ch.+6%2C+p.+68&amp;url=https%3A%2F%2F5solasquotes.github.io%2Fquote%2F7e99baf610.html&amp;via=5Solas" target="_blank" rel="noopener">Share on X</a><a class="perma" href="../quote/7e99baf610.html">Permalink</a><a class="src" href="https://reformedbooksonline.com/on-the-sealing-of-the-spirit/#:~:text=IV.%20But%20the%20mutual%20union%20%28which,justification%2C%20peace%2C%20adoption%2C%20sealing%2C%20perseverance%2C%20etc&amp;text=IV.%20But%20the%20mutual%20union%20%28which%2C%20on%20the&amp;text=of%20grace%2C%20justification%2C%20peace%2C%20adoption%2C%20sealing%2C%20perseverance%2C%20etc" rel="noopener" target="_blank">Read it online · Reformed Books Online</a></div>

</figure><figure class="quote" id="q-82e246423c" data-kw="">
<blockquote><p>This certainty is not a bare conjectural and probable persuasion grounded upon a fallible hope, but an infallible assurance of faith, founded on the blood and righteousness of Christ revealed in the Gospel; and also upon the inward evidence of those graces of the Spirit unto which promises are made, and on the testimony of the Spirit of adoption, witnessing with our spirits that we are the children of God; and, as a fruit thereof, keeping the heart both humble and holy.</p></blockquote>

</figure><figure class="quote" id="q-8e85739b7f" data-kw="">
<blockquote><p>A man may be really justified before God, and yet not have the evidence or assurance of it in his own mind; wherefore that evidence or assurance is not of the nature or essence of that faith whereby we are justified, nor does necessarily accompany our justification. But this manifestation of a man’s own justification unto himself, although it depend on many especial causes, which are not necessary unto his justification absolutely before God, is not a second justification when it is attained; but only the application of the former unto his conscience by the Holy Ghost.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/john-owen.html">John Owen</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Doctrine of Justification by Faith</cite>, ch. 5</span></figcaption>

<main class="wrap"><figure class="quote" id="q-4e40a5d205" data-kw="">
<blockquote><p>And so as to all the approbatory, exhortatory, remunerative will of God, it may truly be said that He wills these natural duties because they are good, and not that they are good because He wills them. As, also, that there is no further free act of his will necessary to make them good, or duty, besides this making man and the nature of creatures; but as to God’s creating will, which laid the foundation of this duty, it may truly be said, that all such duties are duties because He wills them; for He might have chosen to have made man, or have made him not man, but somewhat else.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/richard-baxter.html">Richard Baxter</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Unreasonableness of Infidelity</cite>, section 15 in The Unreasonableness of Infidelity (London: R.W., 1655), An Advertisement Explicatory, pp. 11-12, p. 12</span></figcaption>

</figure><figure class="quote" id="q-40416f46d3" data-kw="">
<blockquote><p>It happens, however, sometimes that God moves a man to some good, yet does not perfect him, so that such preparation precedes grace. But sometimes He moves him immediately and perfectly to good, and the man receives grace suddenly: according to that of John 6: ‘Everyone who has heard from the Father and has learned, comes to me.&#x27;</p></blockquote>

<div class="meta"><span class="t"><a href="../topics/attributes-of-god/will-of-god.html">Will of God</a></span></div>

id+not+call+it+by+that+name.+For+1-2%2C+q.+11%2C+art.+2%2C+ad+1%2C+he+says+thus%3A&amp;url=https%3A%2F%2F5solasquotes.github.io%2Fquote%2F40416f46d3.html&amp;via=5Solas" target="_blank" rel="noopener">Share on X</a><a class="perma" href="../quote/40416f46d3.html">Permalink</a><a class="src" href="https://reformedbooksonline.com/on-antecedent-consequent-aspects-of-gods-willing/#:~:text=It%20happens%2C%20however%2C%20sometimes%20that%20God,and%20has%20learned%2C%20comes%20to%20me&amp;text=It%20happens%2C%20however%2C%20sometimes%20that%20God%20moves%20a&amp;text=the%20Father%20and%20has%20learned%2C%20comes%20to%20me" rel="noopener" target="_blank">Read it online · Reformed Books Online</a></div>
</figure><figure class="quote" id="q-f54f4838e3" data-kw="">
<blockquote><p>In Romans 2:4, it [longsuffering] is associated with the goodness and forbearance of God, and subsumed under his goodness, as that which is despised by the impenitent who treasures up for himself wrath in the day of wrath, who does not know that the goodness of God “leadeth him to repentance” (eis metanoian se agei). The choice of the verb agein is to be noted. Since the impenitent are in view, it cannot refer to efficacious grace. Nevertheless, it is a strong verb as its use in Romans 8:14 shows: “As many as are led by the Spirit of God, these are the sons of God” (cf. Gal. 5:18). It must be understood as a constraining influence flowing from the goodness of God which is calculated to bring men to repentance. The construction in Romans 2:4 is remarkably similar to that in II Peter 3:9.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/john-murray.html">John Murray</a></span><span class="wk"><span class="lbl">Work:</span> <cite>‘Report of the Committee on the Free Offer of the Gospel presented to the Fifteenth</cite>, (1948) General Assembly of the Orthodox Presbyterian Church’, On 2 Pet., 3:9</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/attributes-of-god/will-of-god.html">Will of God</a></span></div>

</figure><figure class="quote" id="q-3b2234aaeb" data-kw="">
<blockquote><p>II. The one of these wills is called the antecedent will, the other is called the consequent, not because that will goes before this, for in this sense, this distinction may be admitted, because there is a certain order among the purposes of God: Thus his will of creating man was in order before his will of feeding or clothing him. But with [John] Damascene and [James] Arminius…</p></blockquote>

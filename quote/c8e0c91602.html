<main class="wrap"><figure class="quote" id="q-c8e0c91602" data-kw="">
<blockquote><p>1. I see not how all these arguments [of Thomas Hooker] taken from moral commandments, do not oblige son as well as father, servant as master, all are Christ’s freemen, son or servant, so as they are to obey what ever Christ commands, Mt. 18:10, and with the Spouse to seek Christ in the fullest measure and in all his ordinances; and son and servant are to know their own heart, so as they have need of all Christ’s ordinances, and are no more to remain in a congregation where their souls are famished because fathers and masters neglect to remove to other congregations where their souls may be fed in the fullest measure; [If the sinful exercise of an authority over us releases us from God’s commandment] then the apostles Acts 4:29 &amp; 5:29 were to preach no more in the name of Jesus, because the rulers commanded them to preach no more in his name.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/samuel-rutherford.html">Samuel Rutherford</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Due Right of Presbyteries, ‘Acts 15, A Pattern of a Juridicial Synod’</cite>, ... (London, 1644), pt. 1, ch. 4, section 4, question 5, p. 71</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/the-church/schism-and-separation.html">Schism and Separation</a></span></div>

<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/john-currie.html">John Currie</a></span><span class="wk"><span class="lbl">Work:</span> <cite>An Essay on Separation: or a Vindication of the Church of Scotland contra the Seceders</cite></span></figcaption>

<blockquote><p>Nothing begets so great an aptness in men to receive errors as this sinful admiration. Affection commonly makes men take down falsities; and error is easily received from them whom we much admire; and God does often leave admired teachers to err, for trial of the people, and the punishing of their vanity, in making God’s truth to stand at the devotion of the teacher for its acceptance, and trampling upon the holy, and (perhaps) learned labors of those who are more seeing and faithful than the admired.</p></blockquote>

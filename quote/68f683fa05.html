<blockquote><p>Let us cleave then to His blessing, and consider what are the means of possessing it. Let us think over the things which have taken place from the beginning. For what reason was our father Abraham blessed? was it not because he wrought righteousness and truth through faith? Isaac, with perfect confidence, as if knowing what was to happen, cheerfully yielded himself as a sacrifice. Jacob, through reason of his brother, went forth with humility from his own land, and came to Laban and served him; and there was given to him the sceptre of the twelve tribes of Israel.

Whosoever will candidly consider each particular, will recognise the greatness of the gifts which were given by him. For from him have sprung the priests and all the Levites who minister at the altar of God. From him also [was descended] our Lord Jesus Christ according to the flesh. From him [arose] kings, princes, and rulers of the race of Judah. Nor are his other tribes in small glory, inasmuch as God had promised, “Thy seed shall be as the stars of heaven.”

All these, therefore, were highly honoured, and made great, not for their own sake, or for their own works, or for the righteousness which they wrought, but through the operation of His will. And we, too, being called by His will in Christ Jesus, are not justified by ourselves, nor by our own wisdom, or understanding, or godliness, or works which we have wrought in holiness of heart; but by that faith through which, from the beginning, Almighty God has justified all men; to whom be glory for ever and ever. Amen.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/clement-of-rome.html">Clement of Rome</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The First Epistle to the Corinthians</cite>, (90), 31-32 in Ante-Nicene Fathers, 1: 13.</span></figcaption>

<blockquote><p>I answer, not only in the beginning of our conversion, but also in the continuance and final accomplishment thereof. For here Paul desires in the day of judgment to stand before God only by the justice of faith without his own justice of the law. And Paul brings in Abraham (as I have noted before) in the very midst of godly conversation and holy obedience to be justified without any works by his faith in the Messiah [Rom. 4:2–3]. And Paul avouches three things of faith: (1) by it ‘we have access’ to the grace of God; (2) by it we ‘stand in the same grace’; (3) by it ‘we rejoice under the hope of glory’ [Rom. 5:2]. Thus then, we see there is only one way of justification, namely that we are justified and accepted of God to life eternal through grace alone by faith alone for Christ alone in the beginning, middle, and end of our conversion. And here is plainly discovered the error of the Church of Rome. It makes a double justification: the first [is] whereby the sinner is made of an evil man a just man, and this (they say) is by faith alone; [and] the second is whereby a man of a just man is made more just, and this (they say) is by faith and works together. But [they speak] falsely.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/william-perkins.html">William Perkins</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Works of William Perkins: vol. 2: Commentary on Galatians</cite>, 9:65–66.</span></figcaption>

/a></div>
</figure><figure class="quote" id="q-cd461b1d8a" data-kw="">
<blockquote><p>You may remember that I said (a word perhaps that some think much of) that the question betwixt us and Rome is not whether we be justified by faith or no? But whether we be justified at all; I will make it good. There are two graces, righteousness imputed, which implies forgiveness of sins; and righteousness inherent, which is that grace of sanctification begun. They utterly deny that there is any righteousness but righteousness inherent. They say forgiveness of sins is nothing but sanctification. A new doctrine never heard of in the Church of God, till these last days, till the spawn of the Jesuits devised it. Forgiveness of sin is this, that God will never charge me with it again. They say that forgiveness of sin is an abolishing of sin in the subject, where is true remission; as much as to say, There is no justification distinct from sanctification: whereas the apostle distinguishes them, when as he says, ‘The Son of God is made unto us wisdom, righteousness, sanctification and redemption’: ‘He is made unto us’ (of God). By the way let me expound it unto you. Christ has three offices; A Prophetical, Regal and Sacerdotical office… The work of Christ’s priestly office is to be a propitiation for our sins; sanctification proceeds from the scepter of his kingdom: The one is without me, the other within me. The one receives degrees, the other not. As a man that is holy may be more holy; but imputed righteousness does not more forgive one man than another. Imputation is without augmentation or diminution. Those things which have diverse contraries, cannot be one and the same thing. Justification and sanctification have diverse contraries. The contrary to justification is condemnation; but the contrary to sanctification is wickedness, and false-dealing, etc. Aristotle distinguishes homonymous words and bids you consider their contraries; thus you see the difference between these two.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/james-ussher.html">James Ussher</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Eighteen Sermons preached in Oxford</cite>, 1640, of conversion, unto God, of redemption &amp; justification, by Christ (London: 1660) | 16th Sermon, on Rom. 5:1, pp. 421-23</span></figcaption>

<blockquote><p>Ver. 5. —But to him that worketh not, but we leave it on him that justifies the ungodly, his faith is counted for righteousness. But to him that worketh not.—This is entirely misunderstood by Dr. Macknight and Mr. Stuart, as if it meant, according to Dr. MacKnight, ‘one who does not work all that he is bound to do;’ or, according to Mr. Stuart, ‘the sinner who has not exhibited perfect obedience.’ It means, however, what it literally expresses, namely, that the person who is justified does not work at all for his justification. It is not that he does not perform all the works that he ought, but that for justification he does nothing. It is true that he works, but not for justification. Mr. Tholuck, who likewise misunderstands in this place the whole of the Apostle’s argument, seems to think that the case of Abraham is only an analogy, and not an example of justification by faith. But Abraham’s faith respected the Messiah, whose day he saw afar off, and by his righteousness he was justified. Justified the ungodly.—if the expression, ‘to him that worketh not,’ needed any explanation, this term—the ungodly—would place it meaning beyond all doubt. The term ungodly is applied throughout the Scriptures to wicked men, Rom v.6; 1 Tim ii. i.9; 1 Pet.iv.18; 2 Pet. ii.5, iii.7; Jude 4, 15. Men are ungodly in themselves, though, as soon as they are justified, they cease to be ungodly. They are ungodly till they believe; but in the moment that they receive the gift of faith, they are thereby united to the savior, and are instantly invested with the robe of righteousness, and also partake, according to the measure of their faith, of all those other graces that are received out of his fullness. They then passed from death to life,—A transition in which there is no medium; they are turned from darkness to light, and from the power of Satan unto God; for till then, being without Christ, they are the children of the devil. They cannot at the same time be both dead and alive–under the power of God, and under the power of the devil; they must in every instance of their existence be either under the one or the other. In that moment, then, in which they believe, they are justified; and to justify, signifies not to treat men as if they were just or righteous, though they are not so, but because they are in truth righteous by imputation, really righteous, the law having been fulfilled in them, ch. viii.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/robert-haldane.html">Robert Haldane</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Exposition of the Epistle to the Romans</cite>, (Edinburgh: The Banner of Truth Trust, 1996, repr. from 9th edition, 1874), 165 (on Rom 4:5).</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/justification.html">Justification</a></span></div>
<div class="actions"><button class="copy" data-copy="“Ver. 5. —But to him that worketh not, but we leave it on him that justifies the ungodly, his faith is counted for righteousness. But to him that worketh not.—This is entirely misunderstood by Dr. Macknight and Mr. Stuart, as if it meant, according to Dr. MacKnight, ‘one who does not work all that he is bound to do;’ or, according to Mr. Stuart, ‘the sinner who has not exhibited perfect obedience.’ It means, however, what it literally expresses, namely, that the person who is justified does not work at all for his justification. It is not that he does not perform all the works that he ought, but that for justification he does nothing. It is true that he works, but not for justification. Mr. Tholuck, who likewise misunderstands in this place the whole of the Apostle’s argument, seems to think that the case of Abraham is only an analogy, and not an example of justification by faith. But Abraham’s faith respected the Messiah, whose day he saw afar off, and by his righteousness he was justified. Justified the ungodly.—if the expression, ‘to him that worketh not,’ needed any explanation, this term—the ungodly—would place it meaning beyond all doubt. The term ungodly is applied throughout the Scriptures to wicked men, Rom v.6; 1 Tim ii. i.9; 1 Pet.iv.18; 2 Pet. ii.5, iii.7; Jude 4, 15. Men are ungodly in themselves, though, as soon as they are justified, they cease to be ungodly. They are ungodly till they believe; but in the moment that they receive the gift of faith, they are thereby united to the savior, and are instantly invested with the robe of righteousness, and also partake, according to the measure of their faith, of all those other graces that are received out of his fullness. They then passed from death to life,—A transition in which there is no medium; they are turned from darkness to light, and from the power of Satan unto God; for till then, being without Christ, they are the children of the devil. They cannot at the same time be both dead and alive–under the power of God, and under the power of the devil; they must in every instance of their existence be either under the one or the other. In that moment, then, in which they believe, they are justified; and to justify, signifies not to treat men as if they were just or righteous, though they are not so, but because they are in truth righteous by imputation, really righteous, the law having been fulfilled in them, ch. viii.”

— Robert Haldane, Exposition of the Epistle to the Romans, (Edinburgh: The Banner of Truth Trust, 1996, repr. from 9th edition, 1874), 165 (on Rom 4:5).">Copy</button><a class="share" href="https://x.com/intent/post?text=%E2%80%9CVer.+5.+%E2%80%94But+to+him+that+worketh+not%2C+but+we+leave+it+on+him+that+justifies+the+ungodly%2C+his+faith+is+counted+for+righteousness.+But+to+him+that+worketh+not.%E2%80%94This+is+entirely+misunderstood+by+Dr.+Macknight+and+Mr.+Stuart%2C+as+if+it+meant%2C+according+to+Dr.+MacKnight%2C+%E2%80%98one+who+does+not+work+all+that+he+is+bound+to+do%3B%E2%80%99+or%2C+according+to+Mr.+Stuart%2C+%E2%80%98the+sinner+who+has+not+exhibited+perfect+obedience.%E2%80%99+It+means%2C+however%2C+what+it+literally+expresses%2C+namely%2C+that+the+person+who+is+justified+does+not+work+at+all+for+his+justification.+It+is+not+that+he+does+not+perform+all+the+works+that+he+ought%2C+but+that+for+justification+he+does+nothing.+It+is+true+that+he+works%2C+but+not+for+justification.+Mr.+Tholuck%2C+who+likewise+misunderstands+in+this+place+the+whole+of+the+Apostle%E2%80%99s+argument%2C+seems+to+think+that+the+case+of+Abraham+is+only+an+analogy%2C+and+not+an+example+of+justification+by+faith.+But+Abraham%E2%80%99s+faith+respected+the+Messiah%2C+whose+day+he+saw+afar+off%2C+and+by+his+righteousness+he+was+justified.+Justified+the+ungodly.%E2%80%94if+the+expression%2C+%E2%80%98to+him+that+worketh+not%2C%E2%80%99+needed+any+explanation%2C+this+term%E2%80%94the+ungodly%E2%80%94would+place+it+meaning+beyond+all+doubt.+The+term+ungodly+is+applied+throughout+the+Scriptures+to+wicked+men%2C+Rom+v.6%3B+1+Tim+ii.+i.9%3B+1+Pet.iv.18%3B+2+Pet.+ii.5%2C+iii.7%3B+Jude+4%2C+15.+Men+are+ungodly+in+themselves%2C+though%2C+as+soon+as+they+are+justified%2C+they+cease+to+be+ungodly.+They+are+ungodly+till+they+believe%3B+but+in+the+moment+that+they+receive+the+gift+of+faith%2C+they+are+thereby+united+to+the+savior%2C+and+are+instantly+invested+with+the+robe+of+righteousness%2C+and+also+partake%2C+according+to+the+measure+of+their+faith%2C+of+all+those+other+graces+that+are+received+out+of+his+fullness.+They+then+passed+from+death+to+life%2C%E2%80%94A+transition+in+which+there+is+no+medium%3B+they+are+turned+from+darkness+to+light%2C+and+from+the+power+of+Satan+unto+God%3B+for+till+then%2C+being+without+Christ%2C+they+are+the+children+of+the+devil.+They+cannot+at+the+same+time+be+both+dead+and+alive%E2%80%93under+the+power+of+God%2C+and+under+the+power+of+the+devil%3B+they+must+in+every+instance+of+their+existence+be+either+under+the+one+or+the+other.+In+that+moment%2C+then%2C+in+which+they+believe%2C+they+are+justified%3B+and+to+justify%2C+signifies+not+to+treat+men+as+if+they+were+just+or+righteous%2C+though+they+are+not+so%2C+but+because+they+are+in+truth+righteous+by+imputation%2C+really+righteous%2C+the+law+having+been+fulfilled+in+them%2C+ch.+viii.%E2%80%9D%0A%0A%E2%80%94+Robert+Haldane%2C+Exposition+of+the+Epistle+to+the+Romans%2C+%28Edinburgh%3A+The+Banner+of+Truth+Trust%2C+1996%2C+repr.+from+9th+edition%2C+1874%29%2C+165+%28on+Rom+4%3A5%29.&amp;url=https%3A%2F%2F5solasquotes.github.io%2Fquote%2F54d52494b5.html&amp;via=5Solas" target="_blank" rel="noopener">Share on X</a><a class="perma" href="../quote/54d52494b5.html">Permalink</a><a class="src" href="https://heidelblog.net/2022/04/haldane-ungodly-in-romans-45-means-what-it-says-just-as-works-not-means-what-it-says/" rel="noopener" target="_blank">Read it online · Heidelblog</a></div>

<blockquote><p>At this point it may be asked whether justification is perfectly completed in this life? Let me say in response to this, first of all, that God’s benefits to us in Christ fall into two categories. One category includes benefits that are not inherent in man, such as his eternal predestination, his justification, and his adoption. The other includes benefits that are inherent in man, such as his effectual calling and his glorification. The benefits included in these two categories have this in common, that none of them—not predestination, not justification, not adoption, not effectual calling, not glorification—will be fully manifested and revealed until Christ’s own manifestation is full and perfect. Indeed, the revelation of these things in man has a beginning in the first manifestation of Christ Himself. Thus the apostle writes in Rom. 3:21, “but now the righteousness of God is revealed, etc.” But the revelation of them in believers is not yet full. Thus 1 Jn. 3:2: “We are already sons of God, but it has not yet appeared what we will be.</p></blockquote>

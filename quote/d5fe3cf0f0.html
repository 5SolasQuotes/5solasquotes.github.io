<blockquote><p>V. It is the opinion of the Arminian sect, that Reprobates may be saved: For (saith Arminius) that decree is not of the power, but of the act of saving. Very ill spoken: For where the act of God is determined by his decree, in vain is the power by which this act may be resisted. This opinion doth draw with it other opinions no better than it self, for errors are tied together among themselves like serpents’ eggs: For if a Reprobate may be saved, he that is not written in the book of life, may effect that he be now written in, and so the number of the Elect will not be certain, nor the decree of Reprobation be irrevocable and peremptory (as they speak) unless after final perseverance in incredulity. Also hence it will follow, that a Reprobate may, if he will, obtain saith, and convert himself: whence come to pass, that faith should not be of the mere grace of God, which we shall see hereafter to be the opinion of Arminius.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/pierre-du-moulin.html">Pierre Du Moulin</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Anatomy of Arminianism: Or, The Opening of the Controversies of These Times (Formerly Handled in the Low-Countries) Concerning the Doctrine of Providence, of Predestination, of the Death of Christ, of Nature and Grace, &amp;c</cite>, (1619; London: Nathanael Newbery, 1635), 26.5, p. 184.</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/arminians-remonstrants/free-will-and-prevenient-grace.html">Arminians (Remonstrants): Free Will and Prevenient Grace</a></span></div>

<blockquote><p>John Davenant wrote to his fellow member of the British delegation to the Synod of Dort, Joseph Hall, to correct false aspersion of Arminianism cast upon the latter divine and to affirm that Arminianism was contrary to the doctrine of the Church of England:

As for the aspersion of Arminianism, I can testify that in our joint employment at the Synod of Dort you [Joseph Hall] were as far from it as myself. And I know that no man can embrace it in the Doctrine of Predestination and Grace but he must first desert the Articles agreed upon by the Church of England, nor in the point of perseverance but he must vary from the common Tenet and received opinion of our best approved Doctors in the English Church. And therefore be no more troubled with other men’s groundless suspicions, then you would be in like case, with their idle dreams. Thus I have enlarged my self beyond my first intent. But my love to your self, and the assurance of your constant love unto the Truth, enforced me thereunto.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/john-davenant.html">John Davenant</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Letter to Joseph Hall, 30 January 1628 in Joseph Hall, The Reconciler, or An epistle pacificatory of the seeming differences of opinion concerning the true being and visibility of the Roman Church Enlarged with the addition of letters of resolution, for that purpose, from some famous divines of our </cite></span></figcaption>
<div class="meta"><span class="t"><a href="../topics/arminians-remonstrants/free-will-and-prevenient-grace.html">Arminians (Remonstrants): Free Will and Prevenient Grace</a></span></div>

<blockquote><p>But what is required hereunto?

1. There is required a clear apprehension in ourselves of those doctrines and truths which we are so to defend. Truth may be lost by weakness as well as by wickedness: if we have not a full apprehension of the truth, and that upon its own proper grounds and principles, we shall never be able to defend it. This is to be attained by all ways and means,—by the use, especially, of diligent prayer and study,—so that we may be able to stop the mouth of gainsayers.

2. There is required love of the truth. We shall never contend earnestly for the truth, we shall never ” buy it and not sell it,” whatever we know of it, unless our love and value of it arise from a sense and experience of it in our own souls. I fear there is much loss of truth, not for want of light, knowledge, and ability, but for want of love.

I have the advantage of most here present in this, that I know the contest we had for the truths of the gospel before our troubles began, and was an early person engaged in them; and knew those godly ministers that did contend for them as for their lives and souls, and that all the opposition that was made against them was never able to discourage them. What were these doctrines? — the doctrines of eternal predestination, effectual conversion to God, and the obduration of wicked reprobates by the providence of God. These truths are not lost for want of skill, but for want of love. We scarce hear one word of them; we are almost ashamed to mention them in the church; and he that doth it will be sure to expose himself to public obloquy and scorn: but we must not be ashamed of truth.

Formerly we could not meet with a godly minister, but the error of Arminianism was looked upon by him as the ruin and poison of the souls of men: such did tremble at it, — wrote and disputed against it. But now it is not so; the doctrine of the gospel is owned still, though little taken notice of by some among ourselves, the love of it being greatly decayed, — the sense and the power of it almost lost. But we have got no ground by it; we are not more holy, more fruitful, than we were in the preaching those doctrines, and attending diligently unto them.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/john-owen.html">John Owen</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Sermon V: The Duty of Pastors (1682) in William H. Goold (ed.), The Works of John Owen</cite></span></figcaption>
<div class="meta"><span class="t"><a href="../topics/arminians-remonstrants/free-will-and-prevenient-grace.html">Arminians (Remonstrants): Free Will and Prevenient Grace</a></span></div>

<blockquote><p>IX. They comprehend the whole doctrine of Election in four decrees, which they so knit among themselves with a perpetual linking, that the latter depend on the former.

X. The I. decree of God, is of giving his son for the abolishing of sin, &amp; for the redemption of all mankind, in which redemption, they would have all mankind to be reconciled, and remission of sins to be obtained for all. The 2. decree, that whereby God decreed to save them that believe, and would persevere in faith: This is that general and conditional Election. The third decree, is that whereby God decreed to give to all men sufficient grace for faith and repentance: which power, they say, is given irresistibly, yea 3 and that God is bound to give all men this grace: But the very act of believing, they say is not given but resistably, lest force should be offered to man’s will. They deny therefore that God decreed to give to any one precisely and absolutely faith, and the act of believing. The 4. and last decree, they would have to be that whereby God hath precisely and absolutely decreed to save some certain men, for their faith for-seen.</p></blockquote>

<div class="actions"><button class="copy" data-copy="“IX. They comprehend the whole doctrine of Election in four decrees, which they so knit among themselves with a perpetual linking, that the latter depend on the former.

X. The I. decree of God, is of giving his son for the abolishing of sin, &amp; for the redemption of all mankind, in which redemption, they would have all mankind to be reconciled, and remission of sins to be obtained for all. The 2. decree, that whereby God decreed to save them that believe, and would persevere in faith: This is that general and conditional Election. The third decree, is that whereby God decreed to give to all men sufficient grace for faith and repentance: which power, they say, is given irresistibly, yea 3 and that God is bound to give all men this grace: But the very act of believing, they say is not given but resistably, lest force should be offered to man’s will. They deny therefore that God decreed to give to any one precisely and absolutely faith, and the act of believing. The 4. and last decree, they would have to be that whereby God hath precisely and absolutely decreed to save some certain men, for their faith for-seen.”

— Pierre Du Moulin, The Anatomy of Arminianism: Or, The Opening of the Controversies of These Times (Formerly Handled in the Low-Countries) Concerning the Doctrine of Providence, of Predestination, of the Death of Christ, of Nature and Grace, &amp;c, (1619; London: Nathanael Newbery, 1635), 16.9-10, pp 99-100.">Copy</button><a class="share" href="https://x.com/intent/post?text=%E2%80%9CIX.+They+comprehend+the+whole+doctrine+of+Election+in+four+decrees%2C+which+they+so+knit+among+themselves+with+a+perpetual+linking%2C+that+the+latter+depend+on+the+former.%0A%0AX.+The+I.+decree+of+God%2C+is+of+giving+his+son+for+the+abolishing+of+sin%2C+%26+for+the+redemption+of+all+mankind%2C+in+which+redemption%2C+they+would+have+all+mankind+to+be+reconciled%2C+and+remission+of+sins+to+be+obtained+for+all.+The+2.+decree%2C+that+whereby+God+decreed+to+save+them+that+believe%2C+and+would+persevere+in+faith%3A+This+is+that+general+and+conditional+Election.+The+third+decree%2C+is+that+whereby+God+decreed+to+give+to+all+men+sufficient+grace+for+faith+and+repentance%3A+which+power%2C+they+say%2C+is+given+irresistibly%2C+yea+3+and+that+God+is+bound+to+give+all+men+this+grace%3A+But+the+very+act+of+believing%2C+they+say+is+not+given+but+resistably%2C+lest+force+should+be+offered+to+man%E2%80%99s+will.+They+deny+therefore+that+God+decreed+to+give+to+any+one+precisely+and+absolutely+faith%2C+and+the+act+of+believing.+The+4.+and+last+decree%2C+they+would+have+to+be+that+whereby+God+hath+precisely+and+absolutely+decreed+to+save+some+certain+men%2C+for+their+faith+for-seen.%E2%80%9D%0A%0A%E2%80%94+Pierre+Du+Moulin%2C+The+Anatomy+of+Arminianism%3A+Or%2C+The+Opening+of+the+Controversies+of+These+Times+%28Formerly+Handled+in+the+Low-Countries%29+Concerning+the+Doctrine+of+Providence%2C+of+Predestination%2C+of+the+Death+of+Christ%2C+of+Nature+and+Grace%2C+%26c%2C+%281619%3B+London%3A+Nathanael+Newbery%2C+1635%29%2C+16.9-10%2C+pp+99-100.&amp;url=https%3A%2F%2F5solasquotes.github.io%2Fquote%2F2bd6a475

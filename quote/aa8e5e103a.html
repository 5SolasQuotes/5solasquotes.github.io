<main class="wrap"><figure class="quote" id="q-aa8e5e103a" data-kw="">
<blockquote><p>None will pretend to deny that there is not great risk to the riders in the steeple-chase, from the nature of the ground, and for impediments in the course. And surely he who perils the life of a human being, without any adequate cause, should not be held guiltless.

The fact is, that the death of riders in steeple-chases is a matter of frequent occurrence. In October last, a man was killed at once in a race of this kind in the south of Ireland, and he left behind him a wife and family to bewail his untimely end. If the annals of racing are carefully inspected, it will be found that throughout these three kingdoms, at an average, several deaths – sometimes as many as six or eight – take place every year from this cruel punishment.

Surely the public authorities should interfere to prevent this prodigal waste of human life. If the same number of murders were annually committed by persons associated for this purpose, it would excite a thrill of horror throughout the whole community, and the most stringent measures would be demanded to put an end to such crimes. The only difference here is that the direct object of the steeple-chase is not the taking away of human life; but as it manifestly puts it in jeopardy, and as when followed it will inevitably cause the death of numbers, it is to be justly held chargeable with murder, and should therefore be put down, as opposed to the law of God, and an offence of the highest kind against society.

Where riders are not killed in the steeple-chase, numbers of them, by falls and sometimes by blows from the horses thrown, are often injured and greatly disabled. Were not horse-racing a fashionable amusement, countenanced and supported by those who, from their station, too often regard themselves, or are regarded as not amenable to the laws of morality, we are persuaded that the barbarous practice of the steeple-chase would not be tolerated in civilized society. Let the one be discontinued, and the other will disappear, only to be hereafter mentioned as a relic of savage life, or as the sport of madmen.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/thomas-houston.html">Thomas Houston</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Races: The Evils Connected with Horse-Racing and the Steeple-Chase and their Demoralizing Effects</cite>, (1853) in Works Doctrinal and Practical of the Rev. Thomas Houston, D.D, Knockbracken (4 vols, Edinburgh: Andrew Elliot, 1876), 4: 394.</span></figcaption>

</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-ee1a3d3007" data-kw="">
<blockquote><p>A second rule is, that as the matter in which we are zealous, must be good in it self, so it must be known unto us to be of that quality. True zeal must begin where the word begins, and end where it ends: for otherwise it cannot be of faith, which is ever grounded on the word; and whatsoever is not of faith is sin. We must not therefore content our selves with an honest meaning, and hope that we have a good zeal towards God, when we have no warrant for our hope: but must so acquaint our selves with the Scriptures of God, that our zeal may be according to knowledge.

Which rule discovereth the corruptness of their zeal, whether close hypocrites, or weak Christians, who are led on merely by the examples of good men, whom they affect, much to like of, and earnestly to stand for such things, as they perceive them in their practise to observe, and to make conscience of: and if there be but a word spoken against any of the things that they have taken a liking of, they are marvellously stirred with indignation thereat, and grow passionate and vehement against the parties, though they have never so good a meaning in that which they speak:

Yet let them be urged to prove out of the word the necessity of those duties which they so earnestly press, they can say little or nothing to the purpose for them; and so grow many times either to dislike and forsake all if they be hypocrites, or at least to be discouraged, and to be at a stand, if they be weaklings in Christ Jesus. And whence proceed these inconveniences but from this, that they are zealous for things that in themselves, and unto others are good and holy, but not thoroughly discerned of them to be of that nature: the consideration whereof, should make us to sit sure in matters of godliness, not building upon the example of good men, but upon the truth of the good word of God, and then our foundation shall never fail us.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/robert-cleaver.html">Robert Cleaver</a></span><span class="wk"><span class="lbl">Work:</span> <cite>A Brief Tract Concerning Zeal, wherein the properties of true Zeal are described, and the contrary discovered</cite>, in John Dod, Four godly and fruitful sermons two preached at Drayton in Oxford-shire, at a fast, enjoined by authority, by occasion of the pestilence then dangerously dispersed. Likewise two other sermons on the twelfth Psalm. Whereunto is annexed a brief tract of zeal (London: William Welbie, 1611), pp 86-87.</span></figcaption>

<blockquote><p>3. When Christ commands his disciples to bless them that curse them and persecute them, He gives not therein a rule to public officers, whether in Church or commonweal, to suffer notorious sinners, either in life or doctrine, to pass away with a blessing: But to private Christians to suffer persecution patiently, yea and to pray for their persecutors. Again, it is true, Christ would have his disciples to be far from persecuting (for that is a sinful oppression of men for righteousness sake) but that hinders not but that He would have them execute upon all disobedience the judgement and vengeance required in the Word, 2 Cor. 10:6; Rom. 13:4.

4. Though it be true that wicked persons now may by the grace of God become true disciples and converts, yet we may not do evil that good may come thereof: And evil it would be to tolerate notorious evil-doers, whether seducing teachers or scandalous livers. Christ had something against the angel of the Church of Pergamus for tolerating them that held the doctrine of Balaam, and against the Church of Thiatira for tolerating Jezabel to teach and seduce, Rev. 2:14, 20.</p></blockquote>

<blockquote><p>1. The question concerning the parts of the church. Do reprobates also belong to it? II. First it is inquired whether besides those called elect, reprobates and infidels also (whether secret or open) are to be considered as true members of the church. Bellarmine with others pretends this is so (“De Ecclesia Militante,” 3.2, 7, 9 Opera [1857], 2:74–75, 81–83, 85–89 and the following) when he teaches that in the definition of the church, pagans, heretics, the excommunicated and schismatics are excepted: “All others are included, even if they are reprobates, wicked and impious” because, as he immediately adds, “that a person may be said to be absolutely a part of the true church, of which the Scriptures speak, we do not think there is required any internal virtue, but only an external, especially a communion of faith and of the sacraments, which is perceived by the sense itself.” The design is that no other church may be acknowledged except that of which the Roman bishop is head. And because they clearly saw (if they restrict it to the elect and believers) the pope might possibly not belong to it, therefore they wished to extend it even to the reprobate, provided they were embraced under the one visible head. Hence in the Council of Constance, this proposition of John Hus was condemned as heretical: “The holy universal church is the universality of the predestinated” (Mansi 27:754). The importance of the controversy is such that on its decision depend all the others which are agitated concerning the church between us and the Romanists. Hence we must treat it the more accurately.</p></blockquote>

<div class="actions"><button class="copy" data-copy="“1. The question concerning the parts of the church. Do reprobates also belong to it? II. First it is inquired whether besides those called elect, reprobates and infidels also (whether secret or open) are to be considered as true members of the church. Bellarmine with others pretends this is so (“De Ecclesia Militante,” 3.2, 7, 9 Opera [1857], 2:74–75, 81–83, 85–89 and the following) when he teaches that in the definition of the church, pagans, heretics, the excommunicated and schismatics are excepted: “All others are included, even if they are reprobates, wicked and impious” because, as he immediately adds, “that a person may be said to be absolutely a part of the true church, of which the Scriptures speak, we do not think there is required any internal virtue, but only an external, especially a communion of faith and of the sacraments, which is perceived by the sense itself.” The design is that no other church may be acknowledged except that of which the Roman bishop is head. And because they clearly saw (if they restrict it to the elect and believers) the pope might possibly not belong to it, therefore they wished to extend it even to the reprobate, provided they were embraced under the one visible head. Hence in the Council of Constance, this proposition of John Hus was condemned as heretical: “The holy universal church is the universality of the predestinated” (Mansi 27:754). The importance of the controversy is such that on its decision depend all the others which are agitated concerning the church between us and the Romanists. Hence we must treat it the more accurately.”

— Francis Turretin, Institutes of Elenctic Theology, ed. James T. Dennison Jr., trans. George Musgrave Giger, vol. 3 (Phillipsburg, NJ: P&amp;R Publishing, 1992–1997), 18.3.2.">Copy</button><a class="share" href="https://x.com/intent/post?text=%E2%80%9C1.+The+question+concerning+the+parts+of+the+church.+Do+reprobates+also+belong+to+it%3F+II.+First+it+is+inquired+whether+besides+those+called+elect%2C+reprobates+and+infidels+also+%28whether+secret+or+open%29+are+to+be+considered+as+true+members+of+the+church.+Bellarmine+with+others+pretends+this+is+so+%28%E2%80%9CDe+Ecclesia+Militante%2C%E2%80%9D+3.2%2C+7%2C+9+Opera+%5B1857%5D%2C+2%3A74%E2%80%9375%2C+81%E2%80%9383%2C+85%E2%80%9389+and+the+following%29+when+he+teaches+that+in+the+definition+of+the+church%2C+pagans%2C+heretics%2C+the+excommunicated+and+schismatics+are+excepted%3A+%E2%80%9CAll+others+are+included%2C+even+if+they+are+reprobates%2C+wicked+and+impious%E2%80%9D+because%2C+as+he+immediately+adds%2C+%E2%80%9Cthat+a+person+may+be+said+to+be+absolutely+a+part+of+the+true+church%2C+of+which+the+Scriptures+speak%2C+we+do+not+think+there+is+required+any+internal+virtue%2C+but+only+an+external%2C+especially+a+communion+of+faith+and+of+the+sacraments%2C+which+is+perceived+by+the+sense+itself.%E2%80%9D+The+design+is+that+no+other+church+may+be+acknowledged+except+that+of+which+the+Roman+bishop+is+head.+And+because+they+clearly+saw+%28if+they+restrict+it+to+the+elect+and+believers%29+the+pope+might+possibly+not+belong+to+it%2C+therefore+they+wished+to+extend+it+even+to+the+reprobate%2C+provided+they+were+embraced+under+the+one+visible+head.+Hence+in+the+Council+of+Constance%2C+this+proposition+of+John+Hus+was+condemned+as+heretical%3A+%E2%80%9CThe+holy+universal+church+is+the+universality+of+the+predestinated%E2%80%9D+%28Mansi+27%3A754%29.+The+importance+of+the+controversy+is+such+that+on+its+decision+depend+all+the+others+which+are+agitated+concerning+the+church+between+us+and+the+Romanists.+Hence+we+must+treat+it+the+more+accurately.%E2%80%9D%0A%0A%E2%80%94+Francis+Turretin%2C+Institutes+of+Elenctic+Theology%2C+ed.+James+T.+Dennison+Jr.%2C+trans.+George+Musgrave+Giger%2C+vol.+3+%28Phillipsburg%2C+NJ%3A+P%26R+Publishing%2C+1992%E2%80%931997%29%2C+18.3.2.&amp;url=https%3A%2F%2F5solasquotes.github.io%2Fquote%2Fa18a02d690.html&amp;via=5Solas" target="_blank" rel="noopener">Share on X</a><a class="perma" href="../quote/a18a02d690.html">Permalink</a><a class="src" href="https://heidelblog.net/2016/09/turretin-hypocrites-and-reprobates-belong-to-the-church-only-outwardly/" rel="noopener" target="_blank">Read it online · Heidelblog</a></div>

<blockquote><p>Imperfect and unsatisfactory as this survey necessarily is, it is enough to prove not only that the Scriptures teach the divinity of Christ, but that Christianity as a religion consists in the love, worship, and service of the Lord Jesus, whose creatures we are, and to whom we belong by the still dearer relation of those whom He hath purchased with his own precious blood.</p></blockquote>

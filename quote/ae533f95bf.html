<main class="wrap"><figure class="quote" id="q-ae533f95bf" data-kw="">
<blockquote><p>The next argument is “the consent of all the parts,” and this, when rightly estimated and fully drawn out, affords a very strong proof of the divine origin and authority of the Bible. The Bible, it is to be remembered, consists of a great number of distinct books, produced by a great variety of authors, who lived in different ages, extending over a period of about 1600 years, i.e. from Moses to John, and placed in a very great variety of external circumstances, but all of them treating more or less of subjects which were in some respects identical. Yet in all these different books, and among all these different authors, we find the most perfect harmony in all the views they entertained, in all the truths they promulgated, in the motives by which they were animated, in the objects they aimed at, and in the kind of means they employed for attaining their ends.

And we find pervading the whole of those books, from first to last, not merely a perfect harmony of doctrine, sentiment, and object, but we can trace plainly one great scheme, one grand comprehensive economy, originating in one cause, directed to one object, partially and gradually developed, and at length fully unfolded and consummated. The authors of the different books of Scripture take naturally and obviously the position and aspect of men who were raised up and guided by a superior power, employed as his instruments for effecting his purposes, accomplishing for the time just the object which he had in view, their personal labours and their written productions being designed by him to serve purposes of which they themselves were not fully aware, but which we now see to have been closely and intimately connected with the attainment of one great object, with the completion of one great and glorious scheme.

This consent of all the parts, this wonderful harmony that pervades the whole of the sacred Scriptures, may be fairly regarded as a proof that one agency was concerned in the production of them all, and that that was the agency of Him who seeth the end in the beginning, with whom one day is as a thousand years, and a thousand years as one day. The unity, the harmony which we find, as a matter of fact, to pervade the whole Bible from beginning to end, could not have existed—must be regarded as an impossibility—had the books which compose it been the productions of unassisted men, had not the composition of them been superintended, directed, and controlled by one comprehensive mind; in short, had not God’s agency been so interposed in the production and composition of them as to make them really the word of God.

Contradictions and inconsistencies have indeed been alleged to exist in the sacred Scriptures, and these have been often adduced and urged, not only by infidels, but even by men who, while professing to believe in the truth of the Christian revelation, have refused to admit the divine origin and authority of the books which compose the Bible. Most of these alleged contradictions and inconsistencies originate in ignorance, carelessness, and prejudice on the part of those who adduce them, and admit of being easily explained or reconciled. If there are any that do not very readily admit of a precise and specific solution individually, there are general considerations, applicable more or less to all ancient books, which afford a sufficient answer to any objections that might be founded on circumstances of this sort.

Besides, the alleged inconsistencies and contradictions, especially those of them about which there is any real difficulty in giving a specific solution, respect only very insignificant matters, such as names and numbers, and therefore, even if they did affect the question of the plenary verbal inspiration of the Scriptures, a point to be afterwards considered, cannot affect that great truth which the consent of all the parts, the unity and harmony pervading all the books of Scripture, notwithstanding their having been composed by so many different men in different ages and circumstances, establishes, viz., that they were all composed under the superintendence and direction of one comprehensive mind; in other words, that God’s agency was so exerted in the production of them, that they are all his word, possessed of divine authority.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/william-cunningham.html">William Cunningham</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Theological Lectures on Subjects Connected with Natural Theology, Evidences of Christianity, the Canon and Inspiration of Scripture</cite>, (New York: Robert Carter and Brothers, 1878), Lecture XXII, pp 286-88.</span></figcaption>

<blockquote><p>I do not doubt that the most ancient fathers, to whom the coming night was the end of one day and the beginning of another, followed this mode of reckoning. Although Moses did not intend here to prescribe a rule which it would be criminal to violate; yet (as we have now said) he accommodated his discourse to the received custom. Wherefore, as the Jews foolishly condemn all the reckonings of other people, as if God had sanctioned this alone; so again are they equally foolish who contend that this modest reckoning, which Moses approves, is preposterous. The first day: Here the error of those is manifestly refuted, who maintain that the world was made in a moment. For it is too violent a cavil to contend that Moses distributes the work which God perfected at once into six days, for the mere purpose of conveying instruction. Let us rather conclude that God himself took the space of six days, for the purpose of accommodating his works to the capacity of men.</p></blockquote>

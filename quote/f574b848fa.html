<blockquote><p>God is essentially holy, and in this sense, none is holy but himself. Now essential holiness is all one with God himself. God’s essential holiness is God’s conformity to himself. Holiness in God is not a quality, but his essence. … Whatsoever is in God, is God. Holiness in angels and saints is but a quality, but in God it is his essence. The fallen angels keep their natures, though they have lost their holiness; for that holiness in them was a quality, and not their essence.

Look, as created holiness is the conformity of the reasonable creature to the rule, so the uncreated holiness of God is God’s conformity unto himself. God’s holiness and his nature are not two things, they are but one. God’s holiness is his nature, and God’s nature is his holiness. God is a pure act, and therefore, whatsoever is in God is God. It is God’s prerogative royal to be essentially holy. The most glorious creatures in heaven, and the choicest souls on earth, are only holy by participation: 1 Sam. ii. 2, ‘There is none holy as the Lord.’

God’s holiness is so essential and co-natural to him, that he can as soon cease to be, as cease to be holy. Holiness in God is a substance, but in angels and men it is only an accident, or a quality. The essence of the creature may remain when the holiness of the creature is lost, as you may see in Adam, and the fallen angels; but God’s essence and his holiness are always the same. His very nature is holy, and therefore it is that he is called ‘Jehovah,’ and ‘I am,’ because what he is really, that he is essentially, Exod. iii. 14.

Though men, for our information, do distinguish between the attributes of God and the nature of God, yet in him they are the same. Look, as the wisdom of God is the wise God, and the truth of God the true God, and the power of God the powerful God, and the justice of God the just God, and the mercy of God the merciful God, and the mightiness of God the mighty God, and the righteousness of God the righteous God, and the graciousness of God the gracious God, so the holiness of God is the holy God. God’s nature and his name are one and the same. God is essentially holy, and that is the top of all his glory.</p></blockquote>

<blockquote><p>I. Although the knowledge of God is one and simple intrinsically no less than his essence, yet it can be considered in different ways extrinsically as to the objects. But it is commonly distinguished by theologians into the knowledge of simple intelligence (or natural and indefinite) and the knowledge of vision (or free and definite). The former is the knowledge of things merely possible and is therefore called indefinite because nothing on either hand is determined concerning them by God. The latter is the knowledge of future things and is called definite because future things are determined by the sure will of God. Hence they mutually differ: (1) in object because the natural knowledge is occupied with possible things, but the free about future things; (2) in foundation because the natural is founded on the omnipotence of God, but the free depends upon his will and decree by which things pass from a state of possibility to a state of futurition; (3) in order because the natural precedes the decree, but the free follows it because it beholds things future; now they are not future except by the decree. Proof that no such middle knowledge can be granted.

IX. The reasons are: (1) Natural and free knowledge embrace all knowable things and entities and are not to be multiplied unnecessarily. There is nothing in the nature of things which is not possible or future; nor can future conditional things constitute a third order. For they are such either from a condition only possible or powerful, yet never to take place, or from a condition certainly future and decreed. In the former manner, they do not recede from the nature of possible things and belong to natural knowledge; in the latter, they are future and decreed by God and come under the free knowledge.

X. (2) Things not true cannot be foreknown as true. Now conditional future things are not true apart from the determination of the divine will; for example, the Sidonians would have repented if the powers had been supplied to them, for they would have been indifferently disposed in their nature to repent or not to repent, those powers being given; therefore from some other source ought to come the truth that they would repent, those powers being posited, if it is at all true. But no cause of this thing can be imagined except the will of God. There was nothing from eternity which could be the cause of the determination of a thing indifferent to either part except the will of God; not his essence or knowledge, for neither can operate ad extra separated from the will. Therefore, as no effect can be understood as future (whether absolutely or hypothetically) without the divine decree (because no creature can be in the world without the divine causality), so no future conditional thing can be knowable before the decree.

XI. (3) If all the acts of the created will fall under the divine providence so that none are independent and indeterminate, no middle knowledge can be granted (which is supposed to have for its object the free determination of the will, depending upon no superior cause). Now that there is such a subjection of the created will is evident from the dependence between the first cause and second causes, between the Creator and creatures. Nor can it suffice to save that dependence that the will may be said to be created and its liberty given by God for it would not cease to be the principle of its own determination, if its acts did not depend upon some decree. It would not be indeed the first being, but yet it would be the first operator (nor any more the second, but the first cause because if it depended in being upon God, it would not depend upon him in operation).

XII. (4) No uncertain knowledge should be ascribed to God. The middle knowledge can have no certainty because it is occupied about an uncertain and contingent object (viz., the indifference [adiaphorian] of the will). I ask, therefore, whence can God certainly know what will or will not take place? For either this can be done from the nature of the things themselves when he regards them (either in their causes or in themselves) as free acts in a created will (which pleases Bellarmine)—but how can an uncertain thing afford foundation to certain knowledge—or this can be done from the infinity of divine knowledge, which certainly foreknows in what direction moral persuasion will incline the will (otherwise free) to the opposite (which Vasquez and Suarez hold); but how could infirmity of knowledge change the nature of things and see a thing as certainly to take place which is contingent? Again knowledge either makes the event certain or foresees it as certain. If it makes it so, how can it foreknow it as such; where then is the indifference of the will? If it foresees it as certain, how could the foresight of an uncertain and indifferent thing be itself certain? Or from the eternal existence of things by which they are said to be present to God (as others prefer); but since they could have no real being from eternity (but only an intentional), they cannot be said to have existed from eternity otherwise than by reason of the decree in which they obtain their futurition. Since, therefore, the certain necessity of the event cannot be founded on the contingent connection of the ends or on the knowledge which recognizes but does not make the thing, it follows that it is only from the efficacious decree of the connector. Thomas Aquinas says most satisfactorily, “He who knows an effect contingent in its own cause only and not in some superior cause certainly determining it, has only a conjectural knowledge concerning it; since from an indifferent cause as far as it is indifferent, a determinate act cannot flow; and for the same reason from a contingent antecedent, as far as it is contingent, a necessary conclusion cannot flow before the decree of the divine will” (ST, I, Q. 14, Art. 13, p. 83).

XIII. (5) This middle knowledge takes away the dominion of God over free acts because according to it the acts of the will are supposed to be antecedent to the decree and therefore have their futurition not from God, but from itself. Indeed God would seem rather to depend upon the creature while he could decree or dispose nothing, unless a determination of the human will were posited which God would see in such a connection of things. Nor ought the reply to be made that the dominion of God is not therefore taken away because he can remove that connection or some circumstance of it; for example, in the foreknowledge by which God knew that Peter would deny Christ if placed in a certain condition, God could hinder him from denying Christ by taking away some foreseen circumstance (for instance, the fear of death) or by adding greater light in the intellect and a greater inclination in the will to confession, and the like. For it is not sufficient for the support of the dominion of God that he could hinder Peter from denying Christ, for he might have deprived Peter of life before the apprehension of Christ (but this would be to have dominion over the life of Peter, not over his free will); but it is requisite that the free acts of Peter, of denying or not denying Christ, should depend upon him (which is denied on the supposition of this knowledge). In fine, if God can take away one foreseen circumstance, he can therefore change the event of the thing: if he can by a decree change the event of a thing, therefore it also pertains to the decree to procure it; for he who hinders the event by a removal of some circumstance ought to cause it by supplying the circumstances.

XIV. (6) On the supposition of such a knowledge, a reason for predestination can be assigned out of God besides his purpose and good pleasure (eudokian) because the foreseen consent of the will of Jacob placed in such circumstances would be at least the condition without which God could not predestine to salvation Jacob rather than Esau. But no reason for that election can be derived from Paul except the purpose (eudokian) of God: “For the children being not yet born, neither having done any good or evil” not on account of a foreseen good use of free will through middle knowledge, but “that the purpose of God according to election might stand, not of works, but of him that calleth; it was said, the elder shall serve the younger” (Rom. 9:11, 12*). Nor should it be said that this condition is assigned on the part of God who has the knowledge, not of men; for although it is God who foreknows, yet the object which he foreknows is maintained to be the good use of free will foreseen before the decree, so that the reason of the decree is put not in God, but in man. Thus grace might with greater propriety be called the servant of the human inclination than the mistress, and the companion than the cause, making God depend upon man rather than man upon God.</p></blockquote>

— Francis Turretin, Institutes of Elenctic Theology, ed. James T. Dennison Jr., trans. George Musgrave Giger, 3 vol. (Phillipsburg, NJ: P&amp;R Publishing, 1992–1997), 1.212–16.">Copy</button><a class="share" href="https://x.com/intent/post?text=%E2%80%9CI.+Although+the+knowledge+of+God+is+one+and+simple+intrinsically+no+less+than+his+essence%2C+yet+it+can+be+considered+in+different+ways+extrinsically+as+to+the+objects.+But+it+is+commonly+distinguished+by+theologians+into+the+knowledge+of+simple+intelligence+%28or+natural+and+indefinite%29+and+the+knowledge+of+vision+%28or+free+and+definite%29.+The+former+is+the+knowledge+of+things+merely+possible+and+is+therefore+called+indefinite+because+nothing+on+either+hand+is+determined+concerning+them+by+God.+The+latter+is+the+knowledge+of+future+things+and+is+called+definite+because+future+things+are+determined+by+the+sure+will+of+God.+Hence+they+mutually+differ%3A+%281%29+in+object+because+the+natural+knowledge+is+occupied+with+possible+things%2C+but+the+free+about+future+things%3B+%282%29+in+foundation+because+the+natural+is+founded+on+the+omnipotence+of+God%2C+but+the+free+depends+upon+his+will+and+decree+by+which+things+pass+from+a+state+of+possibility+to+a+state+of+futurition%3B+%283%29+in+order+because+the+natural+precedes+the+decree%2C+but+the+free+follows+it+because+it+beholds+things+future%3B+now+they+are+not+future+except+by+the+decree.+Proof+that+no+such+middle+knowledge+can+be+granted.+IX.+The+reasons+are%3A+%281%29+Natural+and+free+knowledge+embrace+all+knowable+things+and+entities+and+are+not+to+be+multiplied+unnecessarily.+There+is+nothing+in+the+nature+of+things+which+is+not+possible+or+future%3B+nor+can+future+conditional+things+constitute+a+third+order.+For+they+are+such+either+from+a+condition+only+possible+or+powerful%2C+yet+never+to+take+place%2C+or+from+a+condition+certainly+future+and+decreed.+In+the+former+manner%2C+they+do+not+recede+from+the+nature+of+possible+things+and+belong+to+natural+knowledge%3B+in+the+latter%2C+they+are+future+and+decreed+by+God+and+come+under+the+free+knowledge.+X.+%282%29+Things+not+true+cannot+be+foreknown+as+true.+Now+conditional+future+things+are+not+true+apart+from+the+determination+of+the+divine+will%3B+for+example%2C+the+Sidonians+would+have+repented+if+the+powers+had+been+supplied+to+them%2C+for+they+would+have+been+indifferently+disposed+in+their+nature+to+repent+or+not+to+repent%2C+those+powers+being+given%3B+therefore+from+some+other+source+ought+to+come+the+truth+that+they+would+repent%2C+those+powers+being+posited%2C+if+it+is+at+all+true.+But+no+cause+of+this+thing+can+be+imagined+except+the+will+of+God.+There+was+nothing+from+eternity+which+could+be+the+cause+of+the+determination+of+a+thing+indifferent+to+either+part+except+the+will+of+God%3B+not+his+essence+or+knowledge%2C+for+neither+can+operate+ad+extra+separated+from+the+will.+Therefore%2C+as+no+effect+can+be+understood+as+future+%28whether+absolutely+or+hypothetically%29+without+the+divine+decree+%28because+no+creature+can+be+in+the+world+without+the+divine+causality%29%2C+so+no+future+conditional+thing+can+be+knowable+before+the+decree.+XI.+%283%29+If+all+the+acts+of+the+created+will+fall+under+the+divine+providence+so+that+none+are+independent+and+indeterminate%2C+no+middle+knowledge+can+be+granted+%28which+is+supposed+to+have+for+its+object+the+free+determination+of+the+will%2C+depending+upon+no+superior+cause%29.+Now+that+there+is+such+a+subjection+of+the+created+will+is+evident+from+the+dependence+between+the+first+cause+and+second+causes%2C+between+the+Creator+and+creatures.+Nor+can+it+suffice+to+save+that+dependence+that+the+will+may+be+said+to+be+created+and+its+liberty+given+by+God+for+it+would+not+cease+to+be+the+principle+of+its+own+determination%2C+if+its+acts+did+not+depend+upon+some+decree.+It+would+not+be+indeed+the+first+being%2C+but+yet+it+would+be+the+first+operator+%28nor+any+more+the+second%2C+but+the+first+cause+because+if+it+depended+in+being+upon+God%2C+it+would+not+depend+upon+him+in+operation%29.+XII.+%284%29+No+uncertain+knowledge+should+be+ascribed+to+God.+The+middle+knowledge+can+have+no+certainty+because+it+is+occupied+about+an+uncertain+and+contingent+object+%28viz.%2C+the+indifference+%5Badiaphorian%5D+of+the+will%29.+I+ask%2C+therefore%2C+whence+can+God+certainly+know+what+will+or+will+not+take+place%3F+For+either+this+can+be+done+from+the+nature+of+the+things+themselves+when+he+regards+them+%28either+in+their+causes+or+in+themselves%29+as+free+acts+in+a+created+will+%28which+pleases+Bellarmine%29%E2%80%94but+how+can+an+uncertain+thing+afford+foundation+to+certain+knowledge%E2%80%94or+this+can+be+done+from+the+infinity+of+divine+knowledge%2C+which+certainly+foreknows+in+what+direction+moral+persuasion+will+incline+the+will+%28otherwise+free%29+to+the+opposite+%28which+Vasquez+and+Suarez+hold%29%3B+but+how+could+infirmity+of+knowledge+change+the+nature+of+things+and+see+a+thing+as+certainly+to+take+place+which+is+contingent%3F+Again+knowledge+either+makes+the+event+certain+or+foresees+it+as+certain.+If+it+makes+it+so%2C+how+can+it+foreknow+it+as+such%3B+where+then+is+the+indifference+of+the+will%3F+If+it+foresees+it+as+certain%2C+how+could+the+foresight+of+an+uncertain+and+indifferent+thing+be+itself+certain%3F+Or+from+the+eternal+existence+of+things+by+which+they+are+said+to+be+present+to+God+%28as+others+prefer%29%3B+but+since+they+could+have+no+real+being+from+eternity+%28but+only+an+intentional%29%2C+they+cannot+be+said+to+have+existed+from+eternity+otherwise+than+by+reason+of+the+decree+in+which+they+obtain+their+futurition.+Since%2C+therefore%2C+the+certain+necessity+of+the+event+cannot+be+founded+on+the+contingent+connection+of+the+ends+or+on+the+knowledge+which+recognizes+but+does+not+make+the+thing%2C+it+follows+that+it+is+only+from+the+efficacious+decree+of+the+connector.+Thomas+Aquinas+says+most+satisfactorily%2C+%E2%80%9CHe+who+knows+an+effect+contingent+in+its+own+cause+only+and+not+in+some+superior+cause+certainly+determining+it%2C+has+only+a+conjectural+knowledge+concerning+it%3B+since+from+an+indifferent+cause+as+far+as+it+is+indifferent%2C+a+determinate+act+cannot+flow%3B+and+for+the+same+reason+from+a+contingent+antecedent%2C+as+far+as+it+is+contingent%2C+a+necessary+conclusion+cannot+flow+before+the+decree+of+the+divine+will%E2%80%9D+%28ST%2C+I%2C+Q.+14%2C+Art.+13%2C+p.+83%29.+XIII.+%285%29+This+middle+knowledge+takes+away+the+dominion+of+God+over+free+acts+because+according+to+it+the+acts+of+the+will+are+supposed+to+be+antecedent+to+the+decree+and+therefore+have+their+futurition+not+from+God%2C+but+from+itself.+Indeed+God+would+seem+rather+to+depend+upon+the+creature+while+he+could+decree+or+dispose+nothing%2C+unless+a+determination+of+the+human+will+were+posited+which+God+would+see+in+such+a+connection+of+things.+Nor+ought+the+reply+to+be+made+that+the+dominion+of+God+is+not+therefore+taken+away+because+he+can+remove+that+connection+or+some+circumstance+of+it%3B+for+example%2C+in+the+foreknowledge+by+which+God+knew+that+Peter+would+deny+Christ+if+placed+in+a+certain+condition%2C+God+could+hinder+him+from+denying+Christ+by+taking+away+some+foreseen+circumstance+%28for+instance%2C+the+fear+of+death%29+or+by+adding+greater+light+in+the+intellect+and+a+greater+inclination+in+the+will+to+confession%2C+and+the+like.+For+it+is+not+sufficient+for+the+support+of+the+dominion+of+God+that+he+could+hinder+Peter+from+denying+Christ%2C+for+he+might+have+deprived+Peter+of+life+before+the+apprehension+of+Christ+%28but+this+would+be+to+have+dominion+over+the+life+of+Peter%2C+not+over+his+free+will%29%3B+but+it+is+requisite+that+the+free+acts+of+Peter%2C+of+denying+or+not+denying+Christ%2C+should+depend+upon+him+%28which+is+denied+on+the+supposition+of+this+knowledge%29.+In+fine%2C+if+God+can+take+away+one+foreseen+circumstance%2C+he+can+therefore+change+the+event+of+the+thing%3A+if+he+can+by+a+decree+change+the+event+of+a+thing%2C+therefore+it+also+pertains+to+the+decree+to+procure+it%3B+for+he+who+hinders+the+event+by+a+removal+of+some+circumstance+ought+to+cause+it+by+supplying+the+circumstances.+XIV.+%286%29+On+the+supposition+of+such+a+knowledge%2C+a+reason+for+predestination+can+be+assigned+out+of+God+besides+his+purpose+and+good+pleasure+%28eudokian%29+because+the+foreseen+consent+of+the+will+of+Jacob+placed+in+such+circumstances+would+be+at+least+the+condition+without+which+God+could+not+predestine+to+salvation+Jacob+rather+than+Esau.+But+no+reason+for+that+election+can+be+derived+from+Paul+except+the+purpose+%28eudokian%29+of+God%3A+%E2%80%9CFor+the+children+being+not+yet+born%2C+neither+having+done+any+good+or+evil%E2%80%9D+not+on+account+of+a+foreseen+good+use+of+free+will+through+middle+knowledge%2C+but+%E2%80%9Cthat+the+purpose+of+God+according+to+election+might+stand%2C+not+of+works%2C+but+of+him+that+calleth%3B+it+was+said%2C+the+elder+shall+serve+the+younger%E2%80%9D+%28Rom.+9%3A11%2C+12%2A%29.+Nor+should+it+be+said+that+this+condition+is+assigned+on+the+part+of+God+who+has+the+knowledge%2C+not+of+men%3B+for+although+it+is+God+who+foreknows%2C+yet+the+object+which+he+foreknows+is+maintained+to+be+the+good+use+of+free+will+foreseen+before+the+decree%2C+so+that+the+reason+of+the+decree+is+put+not+in+God%2C+but+in+man.+Thus+grace+might+with+greater+propriety+be+called+the+servant+of+the+human+inclination+than+the+mistress%2C+and+the+companion+than+the+cause%2C+making+God+depend+upon+man+rather+than+man+upon+God.%E2%80%9D%0A%0A%E2%80%94+Francis+Turretin%2C+Institutes+of+Elenctic+Theology%2C+ed.+James+T.+Dennison+Jr.%2C+trans.+George+Musgrave+Giger%2C+3+vol.+%28Phillipsburg%2C+NJ%3A+P%26R+Publishing%2C+1992%E2%80%931997%29%2C+1.212%E2%80%9316.&amp;url=https%3A%2F%2F5solasquotes.github.io%2Fquote%2F6f2da85dbd.html&amp;via=5Solas" target="_blank" rel="noopener">Share on X</a><a class="perma" href="../quote/6f2da85dbd.html">Permalink</a><a class="src" href="https://heidelblog.net/2016/08/turretin-contra-middle-knowledge/" rel="noopener" target="_blank">Read it online · Heidelblog</a></div>
</figure><figure class="quote" id="q-0ab19fbbf2" data-kw="unity one God">
<blockquote><p>Is God one? We affirm against the heathen and Tritheists. God is so one affirmatively as to indivision that he is also one as to the exclusion of others. The question concerns the essential numerical unity: whether God is one numerically as to essence. We defend this against the polytheism of the heathen and the error of the Tritheists.</p></blockquote>

</figure><figure class="quote" id="q-3a779fe462" data-kw="">
<blockquote><p>Do you contemplate, O man, the most immaculate Lord, hanging on the cross: and do you dare, O impudent and unhappy man, to spend your whole time of your life on earth in delights and laughter? Do you not know, O miserable and impudent one, that He who was crucified for you as Lord will demand an account from you for all these negligences and contempts? Now indeed, while you hear this, you neglect it, you laugh in delights; and free from all care, you see yourself as free: but that terrible day will surely come, the day of vengeance, and you will mourn without end and cry out because of your pains in the eternal fire: and there will be absolutely no one there to answer and to have mercy on your soul.</p></blockquote>

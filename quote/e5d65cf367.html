<blockquote><p>Immediately upon the Reformation of Religion in these Western parts, the Controversy brake out a fresh; though in another manner than before it did. For there were some, of whom Calvin speaks, who would have had all days alike, all equally to be regarded; (he means the Anabaptists, as I take it) and reckoned that the Lord’s day, as the Church continued it, was a Jewish ceremony.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/william-twisse.html">William Twisse</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Of the Morality of the Fourth Commandment, as still in force to bind Christians</cite>, (London, 1641), p. 31.</span></figcaption>

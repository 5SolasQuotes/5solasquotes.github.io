<main class="wrap"><figure class="quote" id="q-b74fe8918d" data-kw="">
<blockquote><p>Peter, as the president of the apostles, delivers it as the sense of the whole college of apostles then present: Acts ii. 23, ‘He was delivered by the determinate counsel and foreknowledge of God.’ It was decreed and enacted in heaven, resolved before time, though done in the fulness of time. Therefore Christ is called ‘the Lamb slain from before the foundation of the world,’ determinately, in the counsel and decree of God; promissorily, in the promise and word of God passed to Adam after the fall; typically, in sacrifices which were settled immediately upon that promise of redemption; efficaciously, in regard of the merit of it, applied by God to believers before the actual suffering.

He was made sin, not by us, not only by himself, and his own will, but by God’s ordination: 2 Cor. v. 21, ‘He hath made him to be sin for us,’ by a divine statute, i.e. he was ordained to be put into the state and condition of a sinner in our stead; not into the practical and experimental state of sin, but the penal state of a sinner; to be a sacrifice for it, not to be polluted with it.

Indeed, had not God appointed it, it had not been meritorious; for the merit was not absolute for us, but pactional and conditional. It was capable of meriting, because of the worth and dignity of the person; but not actually meritorious for us, but upon the covenant transacted between the Father and the Son, that it should be performed by him for us, and accepted by the Father for us, and applied by the Spirit to us.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/stephen-charnock.html">Stephen Charnock</a></span><span class="wk"><span class="lbl">Work:</span> <cite>A Discourse of the Knowledge of Christ Crucified</cite>, (1684) in The Complete Works of Stephen Charnock, B.D. (5 vols, Edinburgh: James Nichol, 1865), 4: 496.</span></figcaption>

</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-6d2ec44acf" data-kw="">
<blockquote><p>If Christ were now speaking of the cause of our salvation, the Papists could not be blamed for inferring that we merit eternal life by good works; but as Christ had no other design than to exhort his people to holy and upright conduct, it is improper to conclude from his words what is the value of the merits of works. … But we have another reply to offer, which is still more clear; for we do not deny that a reward is promised to good works, but maintain that it is a reward of grace, because it depends on adoption.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/john-calvin.html">John Calvin</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Commentary on a Harmony of the Evangelists</cite>, Matthew 25:35</span></figcaption>

</figure><figure class="quote" id="q-73bdee7a45" data-kw="">
<blockquote><p>Merit and reward refer to the same, for a reward means something given anyone in return for work or toil, as a price for it. … Now it is clear that between God and man there is the greatest inequality: for they are infinitely apart, and all man&#x27;s good is from God. Hence there can be no justice of absolute equality between man and God, but only of a certain proportion, inasmuch as both operate after their own manner. Now the manner and measure of human virtue is in man from God. Hence man&#x27;s merit with God only exists on the presupposition of the Divine ordination, so that man obtains from God, as a reward of his operation, what God gave him the power of operation for.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/thomas-aquinas.html">Thomas Aquinas</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Summa Theologiae, pt. 1</cite>, I-II, q. 114, a. 1</span></figcaption>

</figure><figure class="quote" id="q-d2a7d4c853" data-kw="">
<blockquote><p>For, whereas Jesus Christ Himself continually infuses his virtue into the said justified,-as the head into the members, and the vine into the branches,-and this virtue always precedes and accompanies and follows their good works, which without it could not in any wise be pleasing and meritorious before God,-we must believe that nothing further is wanting to the justified, to prevent their being accounted to have, by those very works which have been done in God, fully satisfied the divine law according to the state of this life, and to have truly merited eternal life, to be obtained also in its (due) time, if so be, however, that they depart in grace.</p></blockquote>

</figure><figure class="quote" id="q-e7e46bfbc0" data-kw="">
<blockquote><p>But it does not follow that God owes anything to us, because he renders righteously what he renders; for he is righteous even in those acts of kindness which are of free grace. And he &quot;renders the reward&quot; which he has promised, not because we take the lead by any act of obedience, but because, in the same course of liberality in which he has begun to act toward us, he follows up his former gifts by those which are afterwards bestowed.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/john-calvin.html">John Calvin</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Commentary on 1 &amp; 2 Timothy, Titus, and Philemon</cite>, 2 Timothy 4:8</span></figcaption>

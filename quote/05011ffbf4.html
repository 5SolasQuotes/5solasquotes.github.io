<blockquote><p>The even more basic principle involved [in the indulgence controversy] is whether a minister may give up some liberty for a time, even indefinitely, for the furthering of Christ’s ministry, even for its long-term survival (Isa. 26:20) or the eternal well-being of souls (Col. 1:24)? Besides Jesus’s example and teaching in a broken and declining Church, Mt. 17:24–27; 26:51–54; Lk. 9:51; 22:43; 23:35–37; Jn. 10:17–18; Gal. 4:4–5; Phil. 2:8, see that of Paul often under the same state, Acts 16:3–4; 21:13, 23–26; 1 Cor. 4:11–12; 8:13; 9:12, 19–23; 2 Cor. 6:3–10; 11:23–28; Gal. 5:13; Phil. 1:12–14; 2 Tim. 2:9–10; 2 Thess. 3:8–9. Or is this principle sinful? If a person has liberty to amputate their own bodily extremities in some needful circumstances for the greater good of the whole (Mt. 18:8–9), from the greater to the lesser, may not one give up some of their bodily liberty for a greater good?</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/travis-fentiman.html">Travis Fentiman</a></span><span class="wk"><span class="lbl">Work:</span> <cite>“Editor’s Extended Introduction” in English Puritans, A Refutation of the Errors of Separatists</cite>, (1604; RBO, 2025), p. 112</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/the-christian-life/ethics-and-virtue.html">Ethics and Virtue</a></span></div>

0%5Bin%20the&amp;text=of%20their%20bodily%20liberty%20for%20a%20greater%20good" rel="noopener" target="_blank">Read it online · Reformed Books Online</a></div>

</figure><figure class="quote" id="q-a70f4018d9" data-kw="">
<blockquote><p>Question 1. Whether in a good or evil act there be necessarily required an inclination of the will? 1st Answer. First, the will is the principle and the first cause of all human operation in regard of the exercise of the act. For we therefore do this or that rather than another thing, because we will; As God Himself is said to do all things of his own Will, Eph. 1:11. So also does man who is made after the Image of God. The first cause therefore of the goodness or sinfulness of any act of man, is in the will. 2. Secondly, liberty also of election is formally in the will: that therefore anyone does yield obedience to God, or refuses to do so, proceeds from the will. 3. Lastly, our obedience stands in our conformity to the Will of God, and the disobedience, in our unconformity thereunto. Now our conformity with the Will of God is first and principally in our will, Apoc. 2:6.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/william-ames.html">William Ames</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Conscience with the Power &amp; Cases Thereof</cite>, (1639), bk. 3, ch. 19, ‘Of a Voluntary Act’, pp. 92-3</span></figcaption>

</figure><figure class="quote" id="q-56d954c30d" data-kw="">
<blockquote><p>Heaven-work and heart-work are the chiefest parts of Christian duty. Christ often gives us his summaries of the Law and inculcates his great Command; Jn. 13:35; Mt. 22:37-39; Lk. 10:27. And so does the apostle, Rom. 13:10; 1 Pet. 1:22; 1 Jn. 3:11, 14, 23 &amp; 4:7, 11-12, 20; 2 Jn. 5. And the fruits of the Spirit are manifest, Gal. 5:22-23. James says that pure religion and undefiled before God, even the Father, is this, to visit the fatherless and widows in adversity and to keep ourselves unspotted of the world, James 1:27. Paul says, 1 Tim. 1:5, ‘The end of the commandment is charity out of a pure heart, and of a good conscience and of faith unfeigned:’ And then adds, ‘From which some having swerved, have turned aside to vain janglings’— In a word: The effectual belief of pardon and eternal glory given through Christ, and the love of God and man, with the denial of ourselves, and fleshly desires, and contempt of all things in the world, which are competitors with God and our salvation, with a humble patient enduring of all which must be suffered for these ends, is the nature and sum of the Christian religion. Do nothing therefore as a duty which is a hinderance to any of this. Contentious preachings and factious sidings which weaken love are not of God. The servant of the Lord must not strive, but be gentle to all men, 2 Tim. 2:24… It is one of the most important things in the world for the resolving of a thousand cases of conscience and the directing of a Christian life to know which duties are the greater and which are the lesser, and so which is to be preferred in competition; For that which is a duty at another time is a sin when it is done instead of a greater! as Christ has resolved in the case of the Sabbath. If good must be loved as good, then the greatest good must be most loved and sought. Sacrifice instead of mercy is a sin: Our gift must be left at the altar while we go to be reconciled to our brother. Mt. 5. Never hearken to those men who would set up their controverted duties or any positives and lesser things against the duties of nature itself or the great substantial parts of godliness.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/richard-baxter.html">Richard Baxter</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Cure of Church Divisions</cite>, … (London, 1670), pt. 1, Direction 39, ‘Know which are the great duties of a Christian life, and wherein the nature of true Religion does consist; and then pretend not any lesser duty against those greater, though the least when it is indeed a duty, is not to be denied or neglected’, pp. 209-10</span></figcaption>

</figure><figure class="quote" id="q-d7a94b00e0" data-kw="">
<blockquote><p>Things inconvenient, even in matters of religion, may be commanded in some cases: as when it is to redeem a far worse inconvenience. For of two evils of punishments, the magistrate may take the less as well as any other private man. And if that subjects, to prevent worse inconveniences, may use inconvenient ceremonies, then may the Magistrate, to prevent worse inconveniences, command inconvenient ceremonies. If the apostles may use the inconvenient Jewish ceremonies, then the apostles may enjoin for a time the use of inconvenient ceremonies: as they did make ordinances about things which yet they called burdens, Acts 15. (Circumcision was a burden, Acts 15:10, and these burthens were necessary things, v. 28, and they were said to do well if they observe them, v. 29.) And Moses may make an ordinance about the use of a bill of divorcement, which yet was a grievous inconvenience to redeem a worse inconvenience. But if magistrates do appoint inconvenient things, and burden the Church with them, when there would be no great inconvenience to the Church if such things were not, then such magistrates must give their account to Christ for so doing; but yet the people are bound to obey still, because we cannot be freed from our subjection laid upon us by God, except it appear to us that they command not only an inconvenience, but a sin, as all sound divines confess.</p></blockquote>

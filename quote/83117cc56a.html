<main class="wrap"><figure class="quote" id="q-83117cc56a" data-kw="">
<blockquote><p>If anyone perform a duty of worship in that sincerity and strength that he is able to do it, though he be not prepared as he ought, yet it is better to do it than to neglect it.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/jeremiah-burroughs.html">Jeremiah Burroughs</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Gospel Worship</cite>, ... (London: 1647), Sermon 4, p. 59</span></figcaption>

</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-2936ce0eda" data-kw="">
<blockquote><p>Objection 13: The Lord forbids Judah going to Gilgal or to Bethel, Hos. 4:15-16. Answer: The meaning is plain, and the words express that they were not to go thither to offend and play the harlot in joining to idols, vv. 15-17. This I grant is to be done in no place, but deny any such thing to be done in the hearing [of established churches] by me pleaded for. The Scriptures everywhere forbid the going or coming to such places, or persons, as in or by which some evil is done, to wit, for the doing of anything evil or unlawful in, or with them.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/john-robinson.html">John Robinson</a></span><span class="wk"><span class="lbl">Work:</span> <cite>A Treatise of the Lawfulness of Hearing the Public Ministers in the Church of England</cite>, (d. 1625; 1634) in The Lawfulness of Hearing the Public Ministers of the Church of England Proved, by Mr. Philip Nye &amp; Mr. John Robinson… (London, 1683), p. 27 Robinson (d. 1625) was a leading minister of the English separatists, which settled in Amsterdam.</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/worship/impurities-in-worship.html">Impurities in Worship</a></span></div>
<div class="actions"><button class="copy" data-copy="“Objection 13: The Lord forbids Judah going to Gilgal or to Bethel, Hos. 4:15-16. Answer: The meaning is plain, and the words express that they were not to go thither to offend and play the harlot in joining to idols, vv. 15-17. This I grant is to be done in no place, but deny any such thing to be done in the hearing [of established churches] by me pleaded for. The Scriptures everywhere forbid the going or coming to such places, or persons, as in or by which some evil is done, to wit, for the doing of anything evil or unlawful in, or with them.”

— John Robinson, A Treatise of the Lawfulness of Hearing the Public Ministers in the Church of England (d. 1625; 1634) in The Lawfulness of Hearing the Public Ministers of the Church of England Proved, by Mr. Philip Nye &amp; Mr. John Robinson… (London, 1683), p. 27 Robinson (d. 1625) was a leading minister of the English separatists, which settled in Amsterdam.">Copy</button><a class="share" href="https://x.com/intent/post?text=%E2%80%9CObjection+13%3A+The+Lord+forbids+Judah+going+to+Gilgal+or+to+Bethel%2C+Hos.+4%3A15-16.+Answer%3A+The+meaning+is+plain%2C+and+the+words+express+that+they+were+not+to+go+thither+to+offend+and+play+the+harlot+in+joining+to+idols%2C+vv.+15-17.+This+I+grant+is+to+be+done+in+no+place%2C+but+deny+any+such+thing+to+be+done+in+the+hearing+%5Bof+established+churches%5D+by+me+pleaded+for.+The+Scriptures+everywhere+forbid+the+going+or+coming+to+such+places%2C+or+persons%2C+as+in+or+by+which+some+evil+is+done%2C+to+wit%2C+for+the+doing+of+anything+evil+or+unlawful+in%2C+or+with+them.%E2%80%9D%0A%0A%E2%80%94+John+Robinson%2C+A+Treatise+of+the+Lawfulness+of+Hearing+the+Public+Ministers+in+the+Church+of+England+%28d.+1625%3B+1634%29+in+The+Lawfulness+of+Hearing+the+Public+Ministers+of+the+Church+of+England+Proved%2C+by+Mr.+Philip+Nye+%26+Mr.+John+Robinson%E2%80%A6+%28London%2C+1683%29%2C+p.+27+Robinson+%28d.+1625%29+was+a+leading+minister+of+the+English+separatists%2C+which+settled+in+Amsterdam.&amp;url=https%3A%2F%2F5solasquotes.github.io%2Fquote%2F2936ce0eda.html&amp;via=5Solas" target="_blank" rel="noopener">Share on X</a><a class="perma" href="../quote/2936ce0eda.html">Permalink</a><a class="src" href="https://reformedbooksonline.com/on-impurities-in-worship/#:~:text=Objection%2013%3A%20The%20Lord%20forbids%20Judah,or%20unlawful%20in%2C%20or%20with%20them&amp;text=Objection%2013%3A%20The%20Lord%20forbids%20Judah%20going%20to&amp;text=anything%20evil%20or%20unlawful%20in%2C%20or%20with%20them" rel="noopener" target="_blank">Read it online · Reformed Books Online</a></div>
</figure><figure class="quote" id="q-bcb0b77408" data-kw="">
<blockquote><p>I deny not but a private Christian may dislike the corruptions that are allowed and practiced by a whole Church, he may refuse to subscribe or yield his consent unto them, he may by prayer and all other good means seek the reformation of them: but that any one private Christian or some few several assemblies [such as, of the Separatists] wherein also there are some learned men may account all the churches that are in an whole nation to be either as heathens (that is, such as are destitute of the Word and sacraments and service of God) or as publicans (that is, such as with whom they may not lawfully communicate and join in the said service of God), that do I utterly deny.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/arthur-hildersham.html">Arthur Hildersham</a></span><span class="wk"><span class="lbl">Work:</span> <cite>A Treatise of the Ministry of the Church of England, wherein is handled this Question: Whether it be to be separated from, or joined unto. Which is discussed in Two Letters, the one</cite>, [for joining] written for it [by Hildersham], the other against it [by Francis Johnson] (Low Countries, 1595), section 5, p. 59</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/worship/impurities-in-worship.html">Impurities in Worship</a></span></div>

ener" target="_blank">Read it online · Reformed Books Online</a></div>
</figure><figure class="quote" id="q-2f3b61fd2a" data-kw="">
<blockquote><p>37th Question, Why Nadab &amp; Abihu were Judged Only, and Not Eleazar and Ithamar, who also were in Error. … 2. Therefore the reason may be that these two had aliquam excusationem, ‘some excuse’ of their sin, because they were in grief, but their brethren which were slain had no such excuse. 3. And beside the Lord would not extinguere pontificiam dignitatem, at once ‘extinguish the pontifical dignity’ granted to Aaron and his posterity. 4. But chiefly the cause was the mercy of God, which He always tempers with his judgments: He was contented with this example of severity, as the Lord said to the angel that smote Israel after David had numbered the people: ‘It is sufficient, hold now thine hand.’ 5. Yet this is the best resolution, after we have scanned what we can, that the true cause was the good pleasure of God, whereof no reason is to be yielded, sure we are,Quamvis occulta sint Dei iduicia, non ideo iniqua esse, ‘although God’s judgments be secret, yet they are not unjust.&#x27;</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/andrew-willet.html">Andrew Willet</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Hexapla in Leviticum, that is, A Sixfold Commentary upon the Third Book of Moses, called Leviticus</cite>, … (London, 1631), on Lev. 10, pp. 197-98</span></figcaption>

gments%20be%20secret%2C%20yet%20they%20are%20not%20unjust" rel="noopener" target="_blank">Read it online · Reformed Books Online</a></div>
</figure><figure class="quote" id="q-d473f1181c" data-kw="">
<blockquote><p>But if one avoid more ordinary communion with a church, as judging it, though not essentially defective, yet to want [lack] or err in some circumstances so considerable as that he counts [that] another church comes nearer the common Christian rule, the Holy Scriptures, and finds its administrations more conducing to his spiritual advantage; he may be led, by the judgment of his conscience, both, sometimes upon weighty and important reasons to communicate with the former [defective Church], and continue therein, according as those reasons shall continue urgent upon him; and yet, sometimes, as the cessant or diminished weight of such reasons shall allow, to communicate with the other [more spiritually advantageous church].</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/john-howe.html">John Howe</a></span><span class="wk"><span class="lbl">Work:</span> <cite>‘Some Consideration of a Preface to an Inquiry Concerning the Occasional Conformity of Dissenters, etc.’ in The Works of John Howe</cite>, vol. 5, Containing the Treatises: On Divine Prescience &amp; the Trinity… (Religious Tract Society, 1863) Howe (1630-1705) was an English puritan and presbyterian theologian., pp. 275-76</span></figcaption>

<main class="wrap"><figure class="quote" id="q-ec75ff5b74" data-kw="">
<blockquote><p>4. This [absolute] submission concludes a man under a necessity of sinning against God, by omitting those necessary duties that are commanded him of God, upon a non-relevant reason, to wit, the mere will and pleasure of men, to whom God has given no power against the Truth, but for the Truth; no power to destruction, but to edification.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/james-guthrie.html">James Guthrie</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Protesters no Subverters, and presbyterie no papacie</cite>, … (1658), p. 103</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/the-church/schism-and-separation.html">Schism and Separation</a></span></div>
<div class="actions"><button class="copy" data-copy="“4. This [absolute] submission concludes a man under a necessity of sinning against God, by omitting those necessary duties that are commanded him of God, upon a non-relevant reason, to wit, the mere will and pleasure of men, to whom God has given no power against the Truth, but for the Truth; no power to destruction, but to edification.”

— James Guthrie, Protesters no Subverters, and presbytery no papacy; or, A vindication of the protesting brethren, and of the government of the kirk of Scotland from the aspersions unjustly cast upon them… (1658), p. 103">Copy</button><a class="share" href="https://x.com/intent/post?text=%E2%80%9C4.+This+%5Babsolute%5D+submission+concludes+a+man+under+a+necessity+of+sinning+against+God%2C+by+omitting+those+necessary+duties+that+are+commanded+him+of+God%2C+upon+a+non-relevant+reason%2C+to+wit%2C+the+mere+will+and+pleasure+of+men%2C+to+whom+God+has+given+no+power+against+the+Truth%2C+but+for+the+Truth%3B+no+power+to+destruction%2C+but+to+edification.%E2%80%9D%0A%0A%E2%80%94+James+Guthrie%2C+Protesters+no+Subverters%2C+and+presbytery+no+papacy%3B+or%2C+A+vindication+of+the+protesting+brethren%2C+and+of+the+government+of+the+kirk+of+Scotland+from+the+aspersions+unjustly+cast+upon+them%E2%80%A6+%281658%29%2C+p.+103&amp;url=https%3A%2F%2F5solasquotes.github.io%2Fquote%2Fec75ff5b74.html&amp;via=5Solas" target="_blank" rel="noopener">Share on X</a><a class="perma" href="../quote/ec75ff5b74.html">Permalink</a><a class="src" href="https://reformedbooksonline.com/scottish-theology/free-church-of-scotland/quotes-on-the-right-of-continued-protest/#:~:text=4.%20This%20%5Babsolute%5D%20submission%20concludes%20a,power%20to%20destruction%2C%20but%20to%20edification&amp;text=4.%20This%20%5Babsolute%5D%20submission%20concludes%20a%20man%20under&amp;text=Truth%3B%20no%20power%20to%20destruction%2C%20but%20to%20edification" rel="noopener" target="_blank">Read it online · Reformed Books Online</a></div>
</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-06015b364f" data-kw="">
<blockquote><p>The Church may be corrupted many ways, in doctrine, ordinances, worship, etc. And there are degrees of this corruption; the doctrine in some remote points, the worship in some rituals of man’s invention or custom. How many Churches do we find thus corrupted, and yet no separation of Christ from the Jewish Church, nor any commandment to the godly of Corinth, etc. to separate. I must in such a case avoid the corruption, hold the communion—But if corruptions invade the fundamentals, the foundation of doctrine is destroyed, the worship is become idolatrous; and what is above all, if the Church impose such laws of her communion as there is a necessity of doing or approving things unlawful, in that case, ‘Come out of Babylon.’ The Churches of Protestants so separated from Rome.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/richard-vines.html">Richard Vines</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Other citations (work not named)</cite>, On the Sacrament, p. 239 as quoted in A Collection of Cases &amp; other Discourses lately written to recover Dissenters to the communion of the Church of England by some Divines of the City of London (London, 1685), vol. 1, ‘The Non-Conformists Plea for Lay-Communion with the Church of England’, p. 21</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/the-church/schism-and-separation.html">Schism and Separation</a></span><span class="t"><a href="../topics/worship/impurities-in-worship.html">Impurities in Worship</a></span></div>
<div class="actions"><button class="copy" data-copy="“The Church may be corrupted many ways, in doctrine, ordinances, worship, etc. And there are degrees of this corruption; the doctrine in some remote points, the worship in some rituals of man’s invention or custom. How many Churches do we find thus corrupted, and yet no separation of Christ from the Jewish Church, nor any commandment to the godly of Corinth, etc. to separate. I must in such a case avoid the corruption, hold the communion—But if corruptions invade the fundamentals, the foundation of doctrine is destroyed, the worship is become idolatrous; and what is above all, if the Church impose such laws of her communion as there is a necessity of doing or approving things unlawful, in that case, ‘Come out of Babylon.’ The Churches of Protestants so separated from Rome.”

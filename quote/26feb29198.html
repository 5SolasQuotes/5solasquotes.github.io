</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-87bc282954" data-kw="">
<blockquote><p>But if to believe that Christ died for oneself is the same thing as to believe that the death of Christ is sufficient of itself to expiate one’s sins, we do not deny that reprobates are also bound to believe this: which is perfectly true, whether they believe it, or not. For, the value of Christ’s death is such, that it is of itself sufficient for the altogether complete expiation of the sins of all men, even if they should be ten thousand times more: even if God did not determine it for the expiation of the sins of all. So indeed in this controversy it is customary among many to make a distinction, that they say, that Christ died sufficiently for all, even reprobates; but efficiently only for the elect: which words, suitably explained, and applied to amplify the value of the merit of Christ, we readily admit: even if we have not made use of this distinction from the beginning: because the impropriety in the words appears to be overly harsh. For to [have] died for someone, if we speak properly, is to die for the favor of someone, or in the place of someone, so that he might be delivered from death: and if a voluntary death is met for another, it presupposes the greatest possible love, as Christ testifies, Jn. 15:13. Now, if you should add, ‘sufficiently only, not efficiently’, this not very suitable sense will emerge: Christ, impelled by the greatest possible charity, died in the place of reprobates, so that they might be delivered from death, sufficiently indeed, but not efficiently, that is, they are never actually delivered. Those that say, that Christ dies also for reprobates, not indeed so that they might actually be delivered, but so that they might be able to be delivered, tacitly suppose (or they really do not say anything relevant), that it is in the power and ability of reprobates to apprehend Christ’s offered merit by faith: since without faith they are not even able to be delivered. Likewise (which I wish properly to be observed), that God decreed from eternity to save all men and each through Christ, under this condition, that they believe upon Christ, the Redeemer of all men and each. Which no Orthodox theologian would admit, as Pelagian or Semi-pelagian dogma. I leave unmentioned, that God foreknew from eternity, that a great many were not going to believe, and that He decreed that He was not going to give faith to them, which is not able to be had, except with Him freely giving. Why then would He have decree salvation, and have determined means of salvation, that is, the death of His Son, under a condition, which He foreknew that He was not going to fulfill, and the ability of the fulfilling of which He denied in His eternal decree. Not even man plans so imprudently. But let us dismiss these things. Nevertheless, we think that it is more rightly and plainly said, that the death of Christ is sufficient in itself for the expiation of all the sins of men, than, Christ died sufficiently for all, even reprobates.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/marcus-f-wendelin.html">Marcus F. Wendelin</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Christian Theology 3rd ed. (1634), Species of the Office of Christ, pt. 3 Wendelin admits that Christ died for the world to make a sufficient atonement for all, yet Christ dying for someone properly means to deliver them; hence he does not like the language of Christ dying for all sufficiently. He then argues against hypothetical universalism.</cite></span></figcaption>

<blockquote><p>§VII… To gather the matter into a few words, according to this position God, being about to illustrate his glory, decreed: 1. To create the world and man in it with original justice and with the gifts necessary for persevering in the State of Innocence. 2. To permit the Fall of man. 3. To send a Mediator, who for the universal fault, would pay a universal and most sufficient ransom. 4. To call all seriously and sufficiently to embrace this Mediator. 5. Of the called and relapsed to elect some, through and on account of Christ, to give them a living and rooted faith, through this faith to justify, sanctify and glorify them; The rest, by their own fault, on account of their sins, original and actual, and therefore avoidable, especially on account of contempt of the Mediator, to reprobate and damn. §VIII. This position the divine John Sigismund, Elector of Brandenburg, professed in his Confession of Faith, heroically-Christianly; This the divine George William, Elector of Brandenburg, by sending the same Confession of Faith to the Synod of Dort, made his own, and testified to be his own, and at the Colloquy of Leipzig in the year 1631, he took care to have it expounded by the theologians, of Brandenburg, D. Johann Bergius, and of Hesse, D. Johann Crocius and Theophilus Neuberger; This the divine Frederick William the Great not only took care to have it more broadly explained and defended by his theologians in the year 1645 in the Declaration of Thorn at the Charitable Colloquy, but also gloriously asserted it in the Electoral Edicts of the year 1662 and the year 1664, and augmented them. This the August and Most Potent Lord Frederick, King of Prussia and Elector of Brandenburg, for his piety towards God, today asserts and defends. §IX. To this we also subscribe on account of the following reasons: … II. And that is proven by the philanthropy of God so often and so emphatically praised in Holy Scripture… To John 3:16, however, we note that by the word ‘world’ only the elect cannot be understood, is clear from the circumstances of the text itself. … Whence not only the doctors of the primitive Church, and among them Augustine, but also the most outstanding doctors of the Reformed Church, Bullinger, Musculus, Gualther, Calvin, Zanchi, Pezel, the Palatines, Johann Bergius, Conrad Bergius, Steinius, Johann and Ludwig Crocius, Hildebrand, Davenant, Ward, Cameron, Amyrald, Dallaeus, Hammond, Bartholomaeus Stoschius, Antonius Brunsenius, Johann Claude, and our own, of pious memory, teachers and predecessors D. Elias Grebenitz, D. Johann Simonis, D. Phil. Buchius, and he who today, with the highest praise, teaches in this our academy and Church, Dn. D. Samuel Strimesius, and others have accepted this word for the human race. … XIII… Then, it is to be observed that Augustine posits certain dogmas which necessarily require this series of ours, such as are: 1. That God has embraced the entire world, i.e., all men, with philanthropy (φιλανθρωπίᾳ, philanthrōpia). 2. That Christ died most sufficiently for all men. 3. That it was in the free power of the called men to come. 4. That the predestination or election of men was made after the exemplar of Christ. 5. That Esau and Judas could have been saved. 6. That all the baptized are regenerated. All of which, even taken separately, sufficiently evince this order of divine decrees. And all these things today—all the Thomists, Augustinians, Dominicans, and other doctors and monks of the Pontificals who are followers of Augustine—confess, approve and defend.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/barthold-holtzfus.html">Barthold Holtzfus</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Theological Treatise on Predestination, Election &amp; Reprobation of Men, for Promoting Ecclesiastical Concord 3rd ed. tr. by AI by Nosferatu (Leiden, 1705), pp. 41-44 &amp; 57 Latin Holtzfus (1659-1717) was a reformed professor of philosophy and theology at Frankfurt.</cite></span></figcaption>

l+Edicts+of+the+year+1662+and+the+year+1664%2C+and+augmented+them.+This+the+August+and+Most+Potent+Lord+Frederick%2C+King+of+Prussia+and+Elector+of+Brandenburg%2C+for+his+piety+towards+God%2C+today+asserts+and+defends.+%C2%A7IX.+To+this+we+also+subscribe+on+account+of+the+following+reasons%3A+%E2%80%A6+II.+And+that+is+proven+by+the+philanthropy+of+God+so+often+and+so+emphatically+praised+in+Holy+Scripture%E2%80%A6+To+John+3%3A16%2C+however%2C+we+note+that+by+the+word+%E2%80%98world%E2%80%99+only+the+elect+cannot+be+understood%2C+is+clear+from+the+circumstances+of+the+text+itself.+%E2%80%A6+Whence+not+only+the+doctors+of+the+primitive+Church%2C+and+among+them+Augustine%2C+but+also+the+most+outstanding+doctors+of+the+Reformed+Church%2C+Bullinger%2C+Musculus%2C+Gualther%2C+Calvin%2C+Zanchi%2C+Pezel%2C+the+Palatines%2C+Johann+Bergius%2C+Conrad+Bergius%2C+Steinius%2C+Johann+and+Ludwig+Crocius%2C+Hildebrand%2C+Davenant%2C+Ward%2C+Cameron%2C+Amyrald%2C+Dallaeus%2C+Hammond%2C+Bartholomaeus+Stoschius%2C+Antonius+Brunsenius%2C+Johann+Claude%2C+and+our+own%2C+of+pious+memory%2C+teachers+and+predecessors+D.+Elias+Grebenitz%2C+D.+Johann+Simonis%2C+D.+Phil.+Buchius%2C+and+he+who+today%2C+with+the+highest+praise%2C+teaches+in+this+our+academy+and+Church%2C+Dn.+D.+Samuel+Strimesius%2C+and+others+have+accepted+this+word+for+the+human+race.+%E2%80%A6+XIII%E2%80%A6+Then%2C+it+is+to+be+observed+that+Augustine+posits+certain+dogmas+which+necessarily+require+this+series+of+ours%2C+such+as+are%3A+1.+That+God+has+embraced+the+entire+world%2C+i.e.%2C+all+men%2C+with+philanthropy+%28%CF%86%CE%B9%CE%BB%CE%B1%CE%BD%CE%B8%CF%81%CF%89%CF%80%CE%AF%E1%BE%B3%2C+philanthr%C5%8Dpia%29.+2.+That+Christ+died+most+sufficiently+for+all+men.+3.+That+it+was+in+the+free+power+of+the+called+men+to+come.+4.+That+the+predestination+or+election+of+men+was+made+after+the+exemplar+of+Christ.+5.+That+Esau+and+Judas+could+have+been+saved.+6.+That+all+the+baptized+are+regenerated.+All+of+which%2C+even+taken+separately%2C+sufficiently+evince+this+order+of+divine+decrees.+And+all+these+things+today%E2%80%94all+the+Thomists%2C+Augustinians%2C+Dominicans%2C+and+other+doctors+and+monks+of+the+Pontificals+who+are+followers+of+Augustine%E2%80%94confess%2C+approve+and+defend.%E2%80%9D%0A%0A%E2%80%94+Barthold+Holtzfus%2C+Theological+Treatise+on+Predestination%2C+Election+%26+Reprobation+of+Men%2C+for+Promoting+Ecclesiastical+Concord+3rd+ed.+tr.+by+AI+by+Nosferatu+%28Leiden%2C+1705%29%2C+pp.+41-44+%26+57+Latin+Holtzfus+%281659-1717%29+was+a+reformed+professor+of+philosophy+and+theology+at+Frankfurt.&amp;url=https%3A%2F%2F5solasquotes.github.io%2Fquote%2F9dcd4c5c87.html&amp;via=5Solas" target="_blank" rel="noopener">Share on X</a><a class="perma" href="../quote/9dcd4c5c87.html">Permalink</a><a class="src" href="https://reformedbooksonline.com/on-hypothetical-universalism/#:~:text=%C2%A7VII%E2%80%A6%20To%20gather%20the%20matter%20into,followers%20of%20Augustine%E2%80%94confess%2C%20approve%20and%20defend." rel="noopener" target="_blank">Read it online · Reformed Books Online</a></div>
</figure><figure class="quote" id="q-39e6c20b73" data-kw="">
<blockquote><p>If the idea of a real succession in time between the parts of the divine decree be relinquished, as it must be; then this scheme is perfectly illusory, in representing God as decreeing to send Christ to provide a redemption to be offered to all, on condition of faith, and this out of His general compassion. For if He foresees the certain rejection of all at the time, and at the same time purposes sovereignly to withhold the grace which would work faith in the soul, from some, this scheme of election really makes Christ to be related, in God’s purpose, to the non-elect, no more closely nor beneficially than the stricter Calvinistic scheme. But second and chiefly, it represents Christ as not purchasing for His people the grace of effectual calling, by which they are persuaded and enabled to embrace redemption. But God’s purpose to confer this is represented as disconnected with Christ and His purchase, and subsequent, in order, to His work, and the foresight of its rejection by sinners. Whereas Scripture represents that this gift, along with all other graces of redemption, is given us in Christ, having been purchased for His people by Him (Eph. 1:3; Phil. 1:29; Heb. 12:2)</p></blockquote>

<blockquote><p>For the finding out of this middle course… the former [satisfaction of Christ] was once done for all, the other [application thereof] is still in doing: the former brings with it sufficiency, abundant to discharge the whole debt; the other adds to it efficacy. The satisfaction of Christ only makes the sins of mankind fit for pardon, which without it could not well be; the injury done to God’s majesty being so great, that it could not stand with his honour to put it up without amends made. The particular application makes the sins of those to whom that mercy is vouchsafed to be actually pardoned… Hence, we infer against the first extremity, that by the virtue of this blessed oblation, God is made placable unto our nature (which He never will be unto the angelical nature offending) but not actually appeased with any, until He has received his Son, and put on the Lord Jesus. As also against the latter extremity, that all men may be truly said to have interest in the merits of Christ, as in a common, though all do not enjoy the benefit thereof, because they have no will to take it.</p></blockquote>

<main class="wrap"><figure class="quote" id="q-6be95af5f6" data-kw="">
<blockquote><p>But in all the things that God has made… there is nothing which can properly be likened to the nature of God: neither are there any words in the mouths of men that can properly be spoken of it: neither are there any similitudes of man’s inuention that can rightly and squarely agree with the divine essence. And St. Basil, disputing De Ousia &amp; Hypostasi, says: ‘It cannot be that the comparisons of examples should in all points be like to those things, to the use whereof the examples do serve. Thou mayest say that injury is done to the majesty of God if it be compared with mortal things. But for because the holy scripture does not a little condescend and attemper itselfe to our infirmity, I will put a similitude, although in very deed much unlike, which is usually taken and commonly used. Behold the sun and the beams that come from it, and then the heat that proceedes from them both. As the sun is the head-spring of the light and the heat: so is the Father the headspring of the Son, who is light of light. And as of the sun and the beams together the heat does come, so of the Father and the Son together the holy Ghost proceeds. But now, put case, or imagine that the sun were such, as never had beginning, nor ever shall have ending, and should not then I pray you, ye beams of this everlasting sun be everlasting too? and should not the heat, which proceeds of them both, be everlasting as well as they? Finally, should not the Son be one still in essence or substance, and three by reason of the three subsistences or persons? This parable of the sun did Tertullian use (contra Praxeam.), whose words, which do also contain other similitudes, I will not be grieved to recite unto you. ‘I wil not doubt’ (says he) ‘to call both the stalk of a root, the brook of a springhead, and a beam of the sun, by the name of a son: for every original is a parent and every thing that issues of that original is a son: much more then the Word of God may be called a Son, which even properly has the name of Son, and yet neither is the stalk separated from the root, nor the brook from the springhead, nor the beam from the sun, no more is the Word separated from God. Therefore according to the fashion of these examples I profess that I say there are two, God &amp; his Word, the Father and his Son. For the root and the stalk are two things, but joined in one. And the springhead and the brook are two kinds, but undivided. And the sun and the beams are two forms, but both cleaving the one to the other. Everything that comes of anything must needs be second to that out of which it comes, and yet it is not separated from that from which it proceeds. But where a second is, there are two, and where a third is there are three. For the third is the spirit of God and the Son: even as the third from the root is the fruit of the stalk, the third from the springhead is the river of the brook, and the third from the sun is the heat of the beam: yet none of these is alienated from the matrix [womb] of which they take the properties that they have. So the Trinity descending by annexed and linked degrees from the Father, does not make against the monarchy, and does defend the economical state, that is, the mystery of the dispensation. Understand everywhere that I profess this rule wherein I testify, that the Father, the Son and the Holy Ghost are unseparated one from another, and so thou shalt know how everything is spoken.’ And so forth. For all these are the words of Tertullian, who flourished in Africa not long after the age of the apostles.</p></blockquote>

</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-3781e40148" data-kw="">
<blockquote><p>Prestige finds Christological perichoresis is no more than a“verbal formality,” adding nothing, and positively tending to monophysitism. My purpose hereis to propose the opposite view: Contra Prestige, Christology in the Damascene is actually anti-monophysite by design. Prestige on perichoresis is no longer tenable on three crucial points: 1) the meaning of perichoresis, 2) the philosophic background of perichoresis, and 3) the provenance of trinitarian perichoresis. None of these contentions is new, yet the implications of them taken together have not been fully realized in regards to the Damascene’s Christology. Contra Prestige, 1) the meaning “interpenetration” is early, not late, 2) the philosophic milieu is predominantly Stoic, not Aristotelian, and 3) the progenitor of trinitarian perichoresis is John of Damascus, not Pseudo-Cyril.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/scott-ables.html">Scott Ables</a></span><span class="wk"><span class="lbl">Work:</span> <cite>‘The Anti-Monophysite Trinitarian Christology of John of Damascus’ a paper read at NAPS, Annual Meeting, Chicago</cite>, (2010), pp. 1-2</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/the-trinity/the-persons.html">The Persons</a></span></div>

</figure><figure class="quote" id="q-eedfe4cad5" data-kw="Son generation">
<blockquote><p>Therefore, Scripture considers three persons in God, who are one God. The Father is indeed the source and principle of divinity, the Son is the Word and Wisdom of the Father, begotten from eternity and without beginning in time, and the Holy Spirit is the divine power proceeding from the Father and the Son.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/pierre-du-moulin.html">Pierre Du Moulin</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Theological Theses on the One God and Three Persons</cite>, VIII</span></figcaption>

</figure><figure class="quote" id="q-698d53b4a3" data-kw="">
<blockquote><p>The Reformed orthodox did not only deal with the internal distinguishing marks of the Trinitarian persons, but also with their outward marks, the ‘oecumenical offices of the three persons,’ as Mastricht labeled them (Mastricht 1699, 238-40; Neele 2009, 245-78). These outward marks concern works that are appropriated to specific persons, like creation preeminently to the Father, redemption to the incarnate Son, and sanctification to the Holy Spirit (Te Velde et al. 2014, 192-93). This was not meant to deny that ultimately all Trinitarian persons participate in these works, in accordance with the rule that the externally directed works of the Trinity are undivided (opera trinitatis ad extra indivisa sunt) (Mastricht 1699, 239). To be sure, this rule applies to immanent acts that are directed ad extra, like the divine decrees or decisions, just as to the external divine works ad extra, like creation and providence.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/andreas-beck.html">Andreas Beck</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Other citations (work not named)</cite>, ch. 13, ‘God, Creation, and Providence in Post-Reformation Reformed Theology’, p. 205 in eds. Lehner, Muller, Roeber, The Oxford Handbook of Early Modern Theology, 1600-1800 (Oxford, 2016)</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/the-trinity/the-persons.html">The Persons</a></span></div>
<div class="actions"><button class="copy" data-copy="“The Reformed orthodox did not only deal with the internal distinguishing marks of the Trinitarian persons, but also with their outward marks, the ‘oecumenical offices of the three persons,’ as Mastricht labeled them (Mastricht 1699, 238-40; Neele 2009, 245-78). These outward marks concern works that are appropriated to specific persons, like creation preeminently to the Father, redemption to the incarnate Son, and sanctification to the Holy Spirit (Te Velde et al. 2014, 192-93). This was not meant to deny that ultimately all Trinitarian persons participate in these works, in accordance with the rule that the externally directed works of the Trinity are undivided (opera trinitatis ad extra indivisa sunt) (Mastricht 1699, 239). To be sure, this rule applies to immanent acts that are directed ad extra, like the divine decrees or decisions, just as to the external divine works ad extra, like creation and providence.”

— Andreas Beck, ch. 13, ‘God, Creation, and Providence in Post-Reformation Reformed Theology’, p. 205 in eds. Lehner, Muller, Roeber, The Oxford Handbook of Early Modern Theology, 1600-1800 (Oxford, 2016)">Copy</button><a class="share" href="https://x.com/intent/post?text=%E2%80%9CThe+Reformed+orthodox+did+not+only+deal+with+the+internal+distinguishing+marks+of+the+Trinitarian+persons%2C+but+also+with+their+outward+marks%2C+the+%E2%80%98oecumenical+offices+of+the+three+persons%2C%E2%80%99+as+Mastricht+labeled+them+%28Mastricht+1699%2C+238-40%3B+Neele+2009%2C+245-78%29.+These+outward+marks+concern+works+that+are+appropriated+to+specific+persons%2C+like+creation+preeminently+to+the+Father%2C+redemption+to+the+incarnate+Son%2C+and+sanctification+to+the+Holy+Spirit+%28Te+Velde+et+al.+2014%2C+192-93%29.+This+was+not+meant+to+deny+that+ultimately+all+Trinitarian+persons+participate+in+these+works%2C+in+accordance+with+the+rule+that+the+externally+directed+works+of+the+Trinity+are+undivided+%28opera+trinitatis+ad+extra+indivisa+sunt%29+%28Mastricht+1699%2C+239%29.+To+be+sure%2C+this+rule+applies+to+immanent+acts+that+are+directed+ad+extra%2C+like+the+divine+decrees+or+decisions%2C+just+as+to+the+external+divine+works+ad+extra%2C+like+creation+and+providence.%E2%80%9D%0A%0A%E2%80%94+Andreas+Beck%2C+ch.+13%2C+%E2%80%98God%2C+Creation%2C+and+Providence+in+Post-Reformation+Reformed+Theology%E2%80%99%2C+p.+205+in+eds.+Lehner%2C+Muller%2C+Roeber%2C+The+Oxford+Handbook+of+Early+Modern+Theology%2C+1600-1800+%28Oxford%2C+2016%29&amp;url=https%3A%2F%2F5solasquotes.github.io%2Fquote%2F698d53b4a3.html&amp;via=5Solas" target="_blank" rel="noopener">Share on X</a><a class="perma" href="../quote/698d53b4a3.html">Permalink</a><a class="src" href="https://reformedbooksonline.com/on-the-doctrine-of-appropriations/#:~:text=The%20Reformed%20orthodox%20did%20not%20only,ad%20extra%2C%20like%20creation%20and%20providence&amp;text=The%20Reformed%20orthodox%20did%20not%20only%20deal%20with&amp;text=divine%20works%20ad%20extra%2C%20like%20creation%20and%20providence" rel="noopener" target="_blank">Read it online · Reformed Books Online</a></div>
</figure><figure class="quote" id="q-d1b8fd8c3e" data-kw="">
<blockquote><p>The Son, indeed, is incarnate because He wills voluntarily to be made our sponsor, voluntarily subjecting Himself to the Father not according to nature, but according to the voluntary arrangement (oeconomia) or dispensation: a natural subjection is, surely, distinct from an economic or dispensatory subjection: He is made freely obedient to the Father, not according to the divine nature itself (in se), but according to will: obedience, indeed, is not the natural act of a nature (actus naturalis naturae), but of the will or free accord of the Person of Christ (voluntarius personae Christi).</p></blockquote>

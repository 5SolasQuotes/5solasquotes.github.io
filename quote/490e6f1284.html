<blockquote><p>Prayer is the surest remedy against the devil and besetting sins. That sin will never stand firm which is heartily prayed against: that devil will never long keep dominion over us which we beseech the Lord to cast forth. But, then, we must spread out all our case before our Heavenly Physician, if he is to give us daily relief: we must drag our indwelling devils to the feet of Christ, and cry to him to send them back to the pit.</p></blockquote>

</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-d3d4d7bee7" data-kw="">
<blockquote><p>This is the first in a two-part series on Henry Bullinger and the issue of the conclusion to the Lord’s Prayer. Some have argued that denying the originality of the conclusion as is found in the Received Text/Majority Text or in the Authorised Version/New King James Version is tantamount to denying biblical inerrancy or the preservation of scripture. As we saw recently, Henry Bullinger clearly believed in the providential preservation of the biblical text. Nevertheless, he did not believe that the conclusion to the Lord’s Prayer was originally part of Matthew’s gospel. Ergo, one does not have to be a Received Text-ultraist to believe that God has preserved his word.

My own opinion is that the evidence seems to favour the view that the words ‘for thine is the kingdom, and the power, and the glory for ever’ (Matthew 6:13 Geneva Bible) belonged to the original text. However, it is important that people hear both sides of the argument and so I am allowing Bullinger’s position to be presented, even though I am not currently persuaded it is correct. In this post, we are simply highlighting what his position was. In the next post on this subject, we will give his reasons for holding this viewpoint. For now, we see that Bullinger did not believe that the conclusion was part of Matthew’s inspired account:

And because I have said, which all godly men also throughout the whole world confess, that a most perfect platform of praying is delivered unto us in the Lord’s Prayer by our Lord Jesus Christ himself; it remaineth, that we cite word for word that most holy form of praying, orderly made with most divine words even by the mouth of the Lord, as Matthew the apostle hath left it recorded unto us; and then to expound the same as briefly and plainly as may be, to the intent that every one may the better understand what he prayeth, and feel a more effectual working inwardly. Of that most heavenly prayer this is the form:

O our Father, which art in heaven; hallowed be thy name. Thy kingdom come. Thy will be done, as well in earth, as it is in heaven. Give us this day our daily bread. And forgive us our trespasses, as we forgive them that trespass against us. And lead us not into temptation but deliver us from evil. Amen.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/heinrich-bullinger.html">Heinrich Bullinger</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Fifty godly and learned sermons divided into the five decades containing the chief and principal points of Christian religion</cite>, ed. Thomas Harding (1849-52 Parker edn; 4 vols, Grand Rapids, 2004), iv, 205-06.</span></figcaption>

</figure><figure class="quote" id="q-cc49d79512" data-kw="">
<blockquote><p>Furthermore, some do place before the word, “Amen,” immediately after the rehearsal of these words, “But deliver us from evil,” “For thine is the kingdom, and the power, and the glory, for ever. Amen.” But Erasmus Roterod., in his annotations upon the new Testament, witnesseth, that those words are not found in any old Latin copy; but are found added in all Greek copies, howbeit not expounded of any of the interpreters, but of Chrysostom only and his follower Theophylact; and that therefore they seemed unto him to be added unto the Lord’s Prayer, as some have added these unto the Psalms: “Glory be to the Father, to the Son,” &amp;c. The same Erasmus immediately adjouneth: “Wherefore there is no cause why Laurentius Valla should stomach the matter, that a good part of the Lord’s Prayer was curtailed. Their rashness was rather to be reproved, who feared not to so heavenly a prayer to patch their own toys. For I may call them toys, in comparison of that which God hath taught whatsoever hath proceeded from men; especially if that which men have added and put to, be compared with Christ the author of the prayer.”

Neither did Erasmus only doubt of this addition; for the Spanish copy, which they call Codex Complutensis, hath: “That it seemeth more credible, that these words are not a part of the Lord’s prayer, as a member of the whole; but put in through the fault of some certain writers, or printer.” In the same book is by and bye added: “And albeit St Chrysostom in his Commentaries upon Matt., Homil. xx., do expound these words, as if they were of the text; yet it is conjectured to be more true, that even in his time the first originals in his treatise were corrupted: whereupon none of the Latins, no, not of the ancient interpreters or entreaters thereof, is read to have made any mention of these words.” And surely this is truly said. For the most diligent interpreters, which have taken in hand each of them word for word to expound the Lord’s Prayer, as were St Cyprian, Hierome, and Augustine, of this addition have not spoken so much as one word.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/heinrich-bullinger.html">Heinrich Bullinger</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Fifty godly and learned sermons divided into the five decades containing the chief and principal points of Christian religion</cite>, ed. Thomas Harding (1849-52 Parker edn; 4 vols, Grand Rapids, 2004), iv, 219-20.</span></figcaption>

</figure><figure class="quote" id="q-4dd6316407" data-kw="">
<blockquote><p>A Prayer for the King and Parliament, fit to be used by all good Christians daily in their Houses.

O God, the great Protector and guider of all Kings and Kingdoms, mercifully look with thy favourable eyes of mercy, upon this distressed Kingdom, and so inspire the heart of our Royal King Charles, whom thou hast called to the state and government of this Kingdom, and who through thy mercy, hath taken upon him the same, that he may effect all things to the honour and glory of thy name, and that he may receive the increase of all virtues, wherewith being decently adorned, he may both be able to avoid the monstrousness of vices, as also to come unto thee right gracious: and grant O merciful God, that there may be a true peace, and unity between Him and His Parliament and that thou O God, so inspire him with thy holy spirit, that he may hearken to his Parliament, and be ruled by them in all things that may be for the good of His sacred Person? and for His whole Kingdom[.]

[A]nd with the same holy spirit so inspire the hearts of this Parliament, whom it bath pleased thee to call together from several parts of this Kingdom, for the general good of the same, that they may do nothing but what may be to thy honour and glory, and that they may grow and persevere in all manner of virtue, setting all things in due order for the good of the kingdom; and that thy true Religion may here again be thoroughly settled amongst all men: Thou wouldst O God that none should perish, favourably look upon the souls deceived by devilish deceit of heretical Popish Sectaries and impiety, and remove from their hearts all such foulness, that they may be united to thy holy Church; and that all manner of wars or dissenions amongst thy people may be purged, and that thy servants earnestly craving thy mercy, the cruelty of their enemies be dispersed, thy Church truly settled, our king and Parliament faithfully united, we may evermore praise thee with incessant thankfulness, who livest and reignest one true and living God, world without end, Amen.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/adoniram-byfield.html">Adoniram Byfield</a></span><span class="wk"><span class="lbl">Work:</span> <cite>A letter sent from a worthy divine to the Right Honourable the Lord Mayor of the city of London being a true relation of the battle fought between His Majesty and His Excellency the Earl of Essex: from Warwick castle the 24 of October 1642, at two a clock in the morning: together with a prayer for t</cite>, (London: Robert Wood, 1642), unpaginated.</span></figcaption>

O God, the great Protector and guider of all Kings and Kingdoms, mercifully look with thy favourable eyes of mercy, upon this distressed Kingdom, and so inspire the heart of our Royal King Charles, whom thou hast called to the state and government of this Kingdom, and who through thy mercy, hath taken upon him the same, that he may effect all things to the honour and glory of thy name, and that he may receive the increase of all virtues, wherewith being decently adorned, he may both be able to avoid the monstrousness of vices, as also to come unto thee right gracious: and grant O merciful God, that there may be a true peace, and unity between Him and His Parliament and that thou O God, so inspire him with thy holy spirit, that he may hearken to his Parliament, and be ruled by them in all things that may be for the good of His sacred Person? and for His whole Kingdom[.]

[A]nd with the same holy spirit so inspire the hearts of this Parliament, whom it bath pleased thee to call together from several parts of this Kingdom, for the general good of the same, that they may do nothing but what may be to thy honour and glory, and that they may grow and persevere in all manner of virtue, setting all things in due order for the good of the kingdom; and that thy true Religion may here again be thoroughly settled amongst all men: Thou wouldst O God that none should perish, favourably look upon the souls deceived by devilish deceit of heretical Popish Sectaries and impiety, and remove from their hearts all such foulness, that they may be united to thy holy Church; and that all manner of wars or dissenions amongst thy people may be purged, and that thy servants earnestly craving thy mercy, the cruelty of their enemies be dispersed, thy Church truly settled, our king and Parliament faithfully united, we may evermore praise thee with incessant thankfulness, who livest and reignest one true and living God, world without end, Amen.”

— Adoniram Byfield, A letter sent from a worthy divine to the Right Honourable the Lord Mayor of the city of London being a true relation of the battle fought between His Majesty and His Excellency the Earl of Essex: from Warwick castle the 24 of October 1642, at two a clock in the morning: together with a prayer for t, (London: Robert Wood, 1642), unpaginated.">Copy</button><a class="share" href="https://x.com/intent/post?text=%E2%80%9CA+Prayer+for+the+King+and+Parliament%2C+fit+to+be+used+by+all+good+Christians+daily+in+their+Houses.%0A%0AO+God%2C+the+great+Protector+and+guider+of+all+Kings+and+Kingdoms%2C+mercifully+look+with+thy+favourable+eyes+of+mercy%2C+upon+this+distressed+Kingdom%2C+and+so+inspire+the+heart+of+our+Royal+King+Charles%2C+whom+thou+hast+called+to+the+state+and+government+of+this+Kingdom%2C+and+who+through+thy+mercy%2C+hath+taken+upon+him+the+same%2C+that+he+may+effect+all+things+to+the+honour+and+glory+of+thy+name%2C+and+that+he+may+receive+the+increase+of+all+virtues%2C+wherewith+being+decently+adorned%2C+he+may+both+be+able+to+avoid+the+monstrousness+of+vices%2C+as+also+to+come+unto+thee+right+gracious%3A+and+grant+O+merciful+God%2C+that+there+may+be+a+true+peace%2C+and+unity+between+Him+and+His+Parliament+and+that+thou+O+God%2C+so+inspire+him+with+thy+holy+spirit%2C+that+he+may+hearken+to+his+Parliament%2C+and+be+ruled+by+them+in+all+things+that+may+be+for+the+good+of+His+sacred+Person%3F+and+for+His+whole+Kingdom%5B.%5D%0A%0A%5BA%5Dnd+with+the+same+holy+spirit+so+inspire+the+hearts+of+this+Parliament%2C+whom+it+bath+pleased+thee+to+call+together+from+several+parts+of+this+Kingdom%2C+for+the+general+good+of+the+same%2C+that+they+may+do+nothing+but+what+may+be+to+thy+honour+and+glory%2C+and+that+they+may+grow+and+persevere+in+all+manner+of+virtue%2C+setting+all+things+in+due+order+for+the+good+of+the+kingdom%3B+and+that+thy+true+Religion+may+here+again+be+thoroughly+settled+amongst+all+men%3A+Thou+wouldst+O+God+that+none+should+perish%2C+favourably+look+upon+the+souls+deceived+by+devilish+deceit+of+heretical+Popish+Sectaries+and+impiety%2C+and+remove+from+their+hearts+all+such+foulness%2C+that+they+may+be+united+to+thy+holy+Church%3B+and+that+all+manner+of+wars+or+dissenions+amongst+thy+people+may+be+purged%2C+and+that+thy+servants+earnestly+craving+thy+mercy%2C+the+cruelty+of+their+enemies+be+dispersed%2C+thy+Church+truly+settled%2C+our+king+and+Parliament+faithfully+united%2C+we+may+evermore+praise+thee+with+incessant+thankfulness%2C+who+livest+and+reignest+one+true+and+living+God%2C+world+without+end%2C+Amen.%E2%80%9D%0A%0A%E2%80%94+Adoniram+Byfield%2C+A+letter+sent+from+a+worthy+divine+to+the+Right+Honourable+the+Lord+Mayor+of+the+city+of+London+being+a+true+relation+of+the+battle+fought+between+His+Majesty+and+His+Excellency+the+Earl+of+Essex%3A+from+Warwick+castle+the+24+of+October+1642%2C+at+two+a+clock+in+the+morning%3A+together+with+a+prayer+for+t%2C+%28London%3A+Robert+Wood%2C+1642%29%2C+unpaginated.&amp;url=https%3A%2F%2F5solasquotes.github.io%2Fquote%2F4dd6316407.html&amp;via=5Solas" target="_blank" rel="noopener">Share on X</a><a class="perma" href="../quote/4dd6316407.html">Permalink</a><a class="src" href="https://reformedcovenanter.wordpress.com/2019/07/27/adoniram-byfield-a-prayer-for-the-king-and-parliament/" rel="noopener" target="_blank">Read it online · Reformed Covenanter</a></div>
</figure><figure class="quote" id="q-f2ebe23f33" data-kw="">
<blockquote><p>The means whereby men may stir up their dull and heavy hearts, &amp; so prepare themselves to prayer, are three. The first is to read diligently the word of God, concerning those matters about which they are to pray: &amp; what then? This will be a means not only to direct him, but also to quicken the heart more fervently to deliver his prayer.

This is evident by a comparison. The beams of the sun descending, heat not before they come to the earth, or some solid body where they may reflect, and then by that means the earth and air adjoining is made hot: even so the Lord sends down unto us his blessed word, even as beams and the goodly sunshine, and thereby he speaks to our hearts: now when we make our prayers of that which we have read, God’s word is as it were reflected, and our hearts are thereby warmed with the comfortable heat of God’s Holy Spirit, to pour out our prayers to God more fervently.

The second means is to pray to God that he would strengthen us with his Spirit, that we might be able to pray as it is practised, Psal. 143.1. The third means is the consideration of God’s most glorious majesty, wherein he is willing; and secondly his omnipotence, whereby he is able to grant our requests.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/william-perkins.html">William Perkins</a></span><span class="wk"><span class="lbl">Work:</span> <cite>An Exposition of the Lord’s Prayer: In the way of Catechising, serving for Ignorant People</cite>, in The Work of William Perkins (Cambridge: John Legate, 1600), pp 530-31.</span></figcaption>

<blockquote><p>Now this punishment of adultery by death seems to be not a mere judicial law, which was proper and peculiar to the commonwealth of Israel, but a law of common equity, which binds and holds in subjection all nations unto it.</p></blockquote>

<blockquote><p>…and it is most true no man by the instinct of nature gives consent to penal laws as penal, for nature does not teach a man, nor incline his spirit to yield that his life shall be taken away by the sword, and his blood shed, except on this remote ground: a man has a disposition that a vein be cut by the physician, or a member of his body cut off, rather than the whole body and life perish by some contagious disease; but here reason in cold blood, not a natural disposition, is the nearest prevalent cause and disposer of the business.</p></blockquote>

</figure><figure class="quote" id="q-8ac8089445" data-kw="">
<blockquote><p>But I consider that there is a wide difference between the case of a congregation or society in which the right [of ladies to vote for ecclesiastical officers] had been recognized, at least tacitly and by practice, and the case of another congregation or society which had never recognized it, but had uniformly acted on a different principle. In the latter case, I would think it my duty to continue the common practice, not only because it had been the custom, but also because I looked on it as well-founded. And if any individuals should complain that they were denied their rights, I would say to them, ‘You are not denied any rights which were ever recognized in the body of which you are members; and provided you think that the right of election is too much circumscribed by its laws or usages, the least thing that is incumbent on you is, to wait until you can obtain a rectification of the supposed evil in a regular way, and, in the meantime, to show me and those whose province it is to authorize the alteration, that our present practice and mode of management is faulty and unscriptural.’ … It is generally allowed that when he refers to ‘nature itself’, he means to include custom, which is in many cases the best expounder of those principles and feelings which are natural to man, and recognized by those who are unenlightened by divine revelation; and by the manner in which he appeals to it, the apostle teaches us that there is a regard due to such dictates even in what relates to the Church; as we are taught by several places of the New Testament, that, from inadvertence or from other causes, Christians and Christian Churches may fall into opinions and practices, which those who had only nature’s dim lamp to guide them avoided.</p></blockquote>

<blockquote><p>2. We must believe none that speak against the Light of Nature and common notices of all mankind: for that were to renounce humanity: And the Law of Nature is God’s first Law. But it is not the sentiments of nature as depraved which is this Law. 3. We must believe no men against the common senses of mankind, exercised on their duly qualified objects. Faith contradicts not common sense, though it go above it. We are men before we are Christians, and sense and reason are presupposed to faith… For if sense be not to be trusted, we know not that there is a Church, or a man, or a Bible or any thing in the world, and so nothing can be believed. Whether all sound senses may be deceived or not, God has given us no surer way of certainty. 4. Nothing is to be believed against the certain interest of all mankind and tending to their destruction; That which would damn souls, or deny their immortality and future hope, or ruin the Christian world or nations, is not to be believed to be duty or lawful: For truth is for good, and faith is for felicity; and no man is bound to such destructive things. 5. Nothing is to be believed as absolutely certain which depends on the mere honesty of the speakers: For all men are liable to mistake or lie. 6. The more ignorant, malicious, unconscionable, factious, siding, any man is, the less credible he is. And the wiser and nearer to the action any man is, and the more conscionable, peaceable and impartial he is, the more credible he is. An enemy speaking well of a man, is so far more credible than a friend: Multitudes, as capable and honest, are more credible than one. 7. As that certainty which is called moral, as depending on men’s free-will, is never absolute, but has many degrees, as the witness is more or less credible; so there is a certainty by men’s report, tradition or history which is physical and wholly infallible: As that there is such a place as Rome, Paris, etc. and that the statutes of the land were made by such kings and parliaments to whom they are ascribed; and that there have been such kings, etc. For proof of which know: 1. That besides the free acts, the will has some acts as necessary as it is to the fire to burn, viz. To Love ourselves and felicity, and more such. 2. That when all men of contrary interest, friends and foes, agree in a matter that has sensible evidence, it is the effect of such a necessitating cause. 3. And there is no cause in nature that can make them so agree in a lie. Therefore it is a natural certainty. Look back to the sixth chapter.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/richard-baxter.html">Richard Baxter</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Catechizing of Families, a Teacher of Householders how to Teach their Households</cite>, ... (London, 1683), ch. 42, ‘Of the 9th Commandment’, pp. 361-62</span></figcaption>

<blockquote><p>Proceeding historically through ancient, modern, and postmodern thinkers, Owen Anderson studies beliefs about the good and how it is known, and how such beliefs shape claims about the moral law.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/owen-anderson.html">Owen Anderson</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Natural Moral Law: The Good After Modernity</cite>, (Cambridge Univ. Press, 2012)</span></figcaption>

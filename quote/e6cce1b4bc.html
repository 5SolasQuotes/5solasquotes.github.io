<blockquote><p>First, Christ is the only King and Head of the Church. This position needs but little proof – it may, however, require one or two words of explanation. The proof of it is simple. “My kingdom,” said Jesus to Pilate, “is not of this world.” My kingdom. Of course Christ is the only King of his own kingdom. “I have set my king,” says the eternal Father in the second Psalm, “upon my holy hill of Zion.” “He is the head of his body the church,” Paul writes by the Holy Ghost. And Jesus addressed his disciples thus, “Be not ye called masters: for one is your master, even Christ; and all ye are brethren.”

A certain difficulty, however — vague and undefined, perhaps, yet by no means unimportant practically — is apt to arise in some minds, as if this statement that Christ is the only King and Head of the Church, were unquestionably true in reference to all genuine believers, the spiritual and invisible Church consisting of the children of God everywhere, but were more doubtfully true at least, in respect to any organized and mixed community, such as the Free Church of Scotland. Let this doubt be brought to the test of holy Scripture.

Take our Lord’s parable, for instance, of the tares of the field: “The kingdom of heaven is likened to a man which sowed good seed in his field. But while men slept, his enemy came and sowed tares among the wheat, and went his way,” &amp;c. “The field is the world: the good seed are the children of the kingdom; but the tares are the children of the wicked one,” &amp;c. (See the entire parable, Matt. xiii. 24–30, 37–43).

It is very evident that “the kingdom of heaven,” the heavenly spiritual kingdom of which Jesus speaks, and of which undoubtedly he is the only King and Head, is not and cannot be the invisible Church merely, consisting of genuine believers alone; because the subject of the whole parable is the mingling in this world, within the kingdom spoken of, of the wicked with the righteous, “the children of the wicked one” with “the children of the kingdom.” — just as they are found mingled in such a community as the free Church of Scotland, or as they were mingled quite as much in the ancient Church of Laodicea, for instance, which nevertheless Christ addresses as its only King and Head, in his epistle to it in the third of Revelations. Therefore, the first of the three positions, that the Lord Jesus Christ is the only King and Head of the Church, holds, not doubtfully but unquestionably, true of his visible Church or Kingdom, and not of the invisible only.

Before passing to the second position of the three, respecting the office-bearers, there is a very important conclusion, arising out of the first, to which we crave attention. We shall have occasion to refer again to it immediately, and only mention it here. It is, that since Christ is the alone King, Master, Lord of the Church, there can be no legitimate government of it in any human hands whatever, which is of the nature of a mastery or lordship—He is the only Master, Lord. There can be no right government of the Church which is lordly, magisterial, in its nature—that is to say, which enjoins and enforces its own will upon the Church.

The only right government of it is that which is ministerial, administrative—for the carrying out, that is, only of the will of Christ revealed in his Word, subject to Him as the Church’s only Head, and to his Word as her only rule and law. Thus, then, we pass from the first of the three positions, that the Lord Jesus Christ is the only King and Head of the Church.</p></blockquote>

<blockquote><p>The third use is for reproof of those that hold outward government essentially necessary to the Church, as if the Church without this could have no being at all. I for my part desire, and would gladly go as far as I see Christ and his apostles have gone before me; and where they stay, there would I stay too. I find that the Church can never be long nor well without government, but yet it may be sometimes without it, and yet be a true Church. It is true of the inward government, for where that is not, it is not possible that the Church should have any being at all, but it is not so of the outward. Therefore we must rightly distinguish betwixt the inward and the outward government, otherwise we shall run into many absurdities: First, the inward is merely spiritual, the outward is for the most part bodily, that is, such as affects the ear, or the eye, or some other parts; only it is thus far spiritual, in regard of the end it aims at, that is, to make us spiritually minded. Secondly, the inward is proper to God, and reserued to Him only; the outward, though it be from God too, yet it is committed to the administration of men. Thirdly, the inward is peculiar to the faithful and elect alone, God rules in their hearts and consciences, justifying and sanctifying them, and none others; the outward is common to all that profess themselves to be members, though they be hypocrites. Fourthly, the inward is the highest and principal, the outward is but a serviceable dispensation fitted to the inward. Fifthly, the inward seconds the outward, and makes it effectual and fruitful; the outward does but lead vs by the hand (as it were) to the inward. I note this difference the rather, because many men do clamorously exclaim that Christ is robbed of the one half of his kingdom when that outward form which they pretend is not observed. And this is the Brownists’ exception: ‘You’ (say they) ‘deny Christ to be your King, because you own not his discipline which He has prescribed.’ I am with the apostle: God’s kingdom consists not of meats and drinks, and of outward rites, but of righteousnesse and peace, and joy in the Holy Ghost. [Rom. 14] The principal part of God’s kingdom is when He rules by his Spirit in the hearts of his children: and therefore if there were any such discipline prescribed by the Word as they pretend, yet we should not lose the one half of Christ’s kingdom, though it were not observed. Happily it is not known to them that do not observe it; and then it is no rebellion; if it be knowne by them, the sin is much the greater, if it be not observed. But yet Christ may still exercise his Kingdom in the hearts of many members of the Church by his Spirit, though this were wanting. The case may seem to be well paralleled by our outward and inward worship in prayer: The outward worship is but an appurtenance to the inward, for the inward may be true without the outward. And so discipline is rather an appurtenance to God’s kingdom, than the kingdom itself; so that we see that God’s Church may be without discipline, though it cannot be well nor long without it; where outward government is wanting, the Church may be defective and maimed, yea half-dead in outward show at least, and yet a true Church still. Yet, but are not the Word and the sacraments parts of the outward government, and they are necessary to the very being of the Church. Therefore some part of the outward government is essential to the Church. I answer: That they are not necessary to themselves, but by accident, because they 〈…〉to the inward, as that it cannot be without this. And besides, the Word and the sacraments are not so much of the outward government of themselves, but rather the carriage and manner of using of them is of the outward government. Lastly, I answer, they are simply necessary, as they are the causes and gathering of the Church, but not as they are parts of outward government. As Moses his message and gathering of the Israelites to the Lord was one thing, his governing of them another. So that the Word and sacraments must be considered in both these respects, and so in respect of gathering the Church, they are simply necessary, not in respect of governing of it. So that outward government is not simply necessary to the being of the Church, but to the well-being only.</p></blockquote>

8as+it+were%29+to+the+inward.+I+note+this+difference+the+rather%2C+because+many+men+do+clamorously+exclaim+that+Christ+is+robbed+of+the+one+half+of+his+kingdom+when+that+outward+form+which+they+pretend+is+not+observed.+And+this+is+the+Brownists%E2%80%99+exception%3A+%E2%80%98You%E2%80%99+%28say+they%29+%E2%80%98deny+Christ+to+be+your+King%2C+because+you+own+not+his+discipline+which+He+has+prescribed.%E2%80%99+I+am+with+the+apostle%3A+God%E2%80%99s+kingdom+consists+not+of+meats+and+drinks%2C+and+of+outward+rites%2C+but+of+righteousnesse+and+peace%2C+and+joy+in+the+Holy+Ghost.+%5BRom.+14%5D+The+principal+part+of+God%E2%80%99s+kingdom+is+when+He+rules+by+his+Spirit+in+the+hearts+of+his+children%3A+and+therefore+if+there+were+any+such+discipline+prescribed+by+the+Word+as+they+pretend%2C+yet+we+should+not+lose+the+one+half+of+Christ%E2%80%99s+kingdom%2C+though+it+were+not+observed.+Happily+it+is+not+known+to+them+that+do+not+observe+it%3B+and+then+it+is+no+rebellion%3B+if+it+be+knowne+by+them%2C+the+sin+is+much+the+greater%2C+if+it+be+not+observed.+But+yet+Christ+may+still+exercise+his+Kingdom+in+the+hearts+of+many+members+of+the+Church+by+his+Spirit%2C+though+this+were+wanting.+The+case+may+seem+to+be+well+paralleled+by+our+outward+and+inward+worship+in+prayer%3A+The+outward+worship+is+but+an+appurtenance+to+the+inward%2C+for+the+inward+may+be+true+without+the+outward.+And+so+discipline+is+rather+an+appurtenance+to+God%E2%80%99s+kingdom%2C+than+the+kingdom+itself%3B+so+that+we+see+that+God%E2%80%99s+Church+may+be+without+discipline%2C+though+it+cannot+be+well+nor+long+without+it%3B+where+outward+government+is+wanting%2C+the+Church+may+be+defective+and+maimed%2C+yea+half-dead+in+outward+show+at+least%2C+and+yet+a+true+Church+still.+Yet%2C+but+are+not+the+Word+and+the+sacraments+parts+of+the+outward+government%2C+and+they+are+necessary+to+the+very+being+of+the+Church.+Therefore+some+part+of+the+outward+government+is+essential+to+the+Church.+I+answer%3A+That+they+are+not+necessary+to+themselves%2C+but+by+accident%2C+because+they+%E3%80%88%E2%80%A6%E3%80%89to+the+inward%2C+as+that+it+cannot+be+without+this.+And+besides%2C+the+Word+and+the+sacraments+are+not+so+much+of+the+outward+government+of+themselves%2C+but+rather+the+carriage+and+manner+of+using+of+them+is+of+the+outward+government.+Lastly%2C+I+answer%2C+they+are+simply+necessary%2C+as+they+are+the+causes+and+gathering+of+the+Church%2C+but+not+as+they+are+parts+of+outward+government.+As+Moses+his+message+and+gathering+of+the+Israelites+to+the+Lord+was+one+thing%2C+his+governing+of+them+another.+So+that+the+Word+and+sacraments+must+be+considered+in+both+these+respects%2C+and+so+in+respect+of+gathering+the+Church%2C+they+are+simply+necessary%2C+not+in+respect+of+governing+of+it.+So+that+outward+government+is+not+simply+necessary+to+the+being+of+the+Church%2C+but+to+the+well-being+only.%E2%80%9D%0A%0A%E2%80%94+John+Randall%2C+Twenty-Nine+Lectures+of+the+Church%2C+%E2%80%A6+%28London%2C+1631%29%2C+Lecture+14+Randall+%281570%E2%80%931622%29+was+an+English+puritan+who+held+that+the+particular+form+of+Church+government+is+not+by+divine-right.%2C+pp.+242-44&amp;url=https%3A%2F%2F5solasquotes.github.io%2Fquote%2F6d3d08eca5.html&amp;via=5Solas" target="_blank" rel="noopener">Share on X</a><a class="perma" href="../quote/6d3d08eca5.html">Permalink</a><a class="src" href="https://reformedbooksonline.com/topics/the-church#:~:text=The%20third%20use%20is%20for%20reproof,Church%2C%20but%20to%20the%20well%2Dbeing%20only&amp;text=The%20third%20use%20is%20for%20reproof%20of%20those&amp;text=of%20the%20Church%2C%20but%20to%20the%20well%2Dbeing%20only" rel="noopener" target="_blank">Read it online · Reformed Books Online</a></div>

<blockquote><p>Externally this covenant is made with every member of the Church, even with the parents and their children, so many as hear and embrace the promises of salvation, and give and dedicate their children unto God according to his direction; for the sacraments—what are they but seals of the covenant? But savingly, effectually, and in a special manner it is made only with them who are partakers of the benefits promised. And as the covenant is made outwardly or effectually, so some are the people of God externally, others internally and in truth. For they are the people of God with whom God has contracted a covenant, and who in like manner have sworn to the words of the covenant, God stipulating and the people receiving the condition; which is done two ways: [1] for either the covenant is made extrinsically, God by some sensible token gathering the people, and the people embracing the condition in the same manner, and so an external consociation of God and the people is made; [2] or the covenant is entered after an invisible manner, by the intervention of the Spirit, and that with so great efficacy that the condition of the covenant is received after an invisible manner, and so an internal consociation of God and the people is made up.</p></blockquote>

<blockquote><p>XLII. As for the name ‘catholic,’ most of our [Reformed] theologians say that it is common to both the visible and invisible Church, but the invisible Church is absolutely and simply to be called catholic, that is, universal, because it encompasses all the elect from the beginning of the world. However, the visible Church is to be considered catholic in a certain respect, as it encompasses all those who together profess the true and saving religion on earth and includes all particular churches scattered in various parts of the world. In my opinion, the name Catholic is a title of that part of the Church which now militates on earth under Christ, and this name is given to it:

1. Because it is spread throughout the whole world, not restricted to one nation as the Jewish Church was in ancient times.

2. Because it embraces the entire doctrine of the apostles, not admitting part and rejecting part like heretical sects. Finally, because it has persevered the same in all times, namely, through succession and continuation.</p></blockquote>

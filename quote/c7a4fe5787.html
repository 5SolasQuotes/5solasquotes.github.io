<blockquote><p>3. We must know that there is no salvation out of this Church; such as never become members of it, must eternally perish: they that are true members, shall be saved. If they had been of us, they would haue continued with us: but they went out from us, that it might be manifest they were not of us. Without are dogs and scorners, etc. All out of the ark perished in the waters. ‘The Lord added to the Church daily such as should bee saved.’ First, because there is no means of salvation out of it; no word to teach, no sacraments to confirm. And especially because out of the Church there is no Christ, and out of Christ no salvation. Who have not the Church their mother, cannot have God their Father… ‘The general assembly’ [Heb. 12:23]: this is the property of the Church; ‘General’. It is catholic in three respects; of Time, of Persons, of Place:

1. Of Time, because the Church had a being in all ages, ever since the promise was given to our first parents in Paradise…

2. Of persons; for it consists of all degrees and sorts of men… There is no order nor state excluded, if they exclude not themselves…

3. Of Place, it is gathered from all parts of the earth; especially under the New Testament… When Christ gave his apostles their commission, He gave also the whole world for their parish… Thus we see the property of this Church, catholic or general. It is one, but not tied to one time, nor one place, nor one person: it is catholic to all times, to all places, to all persons…</p></blockquote>

<blockquote><p>2. Be it granted: That there is no salvation to any that are out of the communion (i.e.) internal of the Church (For certainly none are saved that are not the members of Christ, the Head; and then tis impossible that any should be one of the members of Christ and not have those of the church for his fellow-members, unless Christ have two distinct bodies). Of this St. Augustine, Against the Donatists, Of the Unity of the Church, ch. 2, speaks very fully: ‘Quaestio certe inter nos versatur, ubi sit Ecclesia; utrum apud nos, an apud illos? Quae utique una est; quam majores nostri Catholicam nominarunt. Haec autem Ecclesia corpus Christi est. Unde utique manifestum est, eum, qui non est in membris Christi, Christianam salutem habere non posse. Membra vero Christi per unitatis charitatem sibi copulantur, et per eandem capiti suo cohaerent, quod est Jesus Christus.’ He continues afterward, ch. 4: ‘Quicunque de ipso Capite Scripturis sanctis consentiunt [i.e. are never so orthodox in their belief] et unitati Ecclesiae non communicant, non sunt in Ecclesia; quia de Christi corpore (quod est Ecclesia) dissentiunt ab ipsius Christi testificatione [i.e. that she is toto orbe diffusa, and shall never perish, etc.] et apertissimis ac notissimis Scripturarum testimoniis contradicunt.’ Again: ‘Quicunque credunt quod Christus Jesus in carne vener it etc. sed tamen ab ejus corpore, quod est Ecclesia, ita dissentiunt, ut eorum communio non sit cum toto quacunque diffunditur, sed in aliqua parte separata inveniatur; manifestum est eos non esse in Ecclesia Catholica. In aliqua parte separata, for the reason given by him above; because they want charity: Membra vero Christi per unitatis charitatem sibi copulantur, et capiti suo; and because notissimis Scripturis contradicunt.’

3. But, all this being granted, yet 3rdly, if any happen to be extra Ecclesiam [outside the Church], out of the Church’s external communion, or also in parte separata [in a part separated]; so he be not guilty of that fault which makes such separation damnable, but still retains the necessary bond of charity; such a one (once joined unto it by baptism), though amongst other separatists, seems to remain himself still unseparated (though not from the external, yet) from the internal communion of the Church. And if any be so strict, as, besides this internal (effected by the same Spirit of Christ in all the faithful, and always seen to God) always to exact an external also, such assertion will in many instances prove false, even in St. Augustine’s Confessions; who freely acknowledges both many that are in the external communion of the Church, no true members thereof; and many to be true members of the Church who are out of the external communion thereof. See Of the Unity of the Church, ch. 20: ‘Multi tales sunt in Sacramentorum communione cum Ecclesia, et tamen jam non sunt in Ecclesia: Alioquin et tunc quisque praeciditur, cum excommunicatur. Consequens erit, ut tunc rursus inseratur, cum visibiliter communioni restituitur. Quid si ergo sictus accedat, atque adversus veritatem et Ecclesiam •or inimicissimum gerat? Quamvis peragatur in eo illa solemnitas, nunquid reconciliatur? nunquid inseritur? absit. Sicut ergo, jam denuo communicans nondum insertus est; sic et antequam visibiliter excommunicatur, quisquis contra veritatem, qua convincitur et arguitur, inimicum gest at animum, jam praecisus est.’ Again; Of Baptism, bk. 1, ch. 17: ‘Semper ab illius Ecclesiae, quae sine macula et ruga est, unitate divisus est, etiam qui, in carnali obduratione, congregationi Sanctorum miscetur.—Spirituales autem sive ad hoc ipsum pro studio proficientes, non eunt for as [i.e. when they are excommunicated]: quia et quum aliqua vel perversitate, vel necessitate hominum, videntur expelli; ibi magis probantur quam si intus permaneant; cum adversus Ecclesiam nullatenus eriguntur, sed in solida unitatis petra fortissimo charitatis robore radicantur.’ Add to this the place quoted below, §13, and that discourse of his Of the Unity of the Church, ch. 20, of the several degrees of their culpableness who may live in a schismatical communion, set down §7: Where the father affirms, God has some good corn amongst those tares: ubi radice viva herbae vigor atteritur, etc. Several instances therefore there may be given wherein such assertion will prove false. For example: It is granted to be false in those who are unjustly excommunicated (as some, tis by all conceded, may be); and in penitents, after a just excommunication, who are not yet actually reconciled, of whom Bellarmine, De Ecclesia, bk. 3, ch. 6, says: ‘Tales esse in Ecclesia animo sive desiderio, quod sufficit illis ad salutem:’ bringing in St. Augustine’s saying, Of the True Religion, ch. 6, of such like; Hos coronat in occulto Pater in occulto videns. (See below §) Again: false, at least, in those dying after baptism, before the use of reason, in a schismatical Church. Again, false in catechumeni [catechumens] that die before they receive baptism, or are entered into the Church… I add that some of the catechumeni were such, as, for secular reasons, etc, deferred baptism long after they might have been admitted to, and received, it: and amongst such, I suppose was Valentinian; who dying before baptism received, after baptism willingly deferred, yet St. Ambrose doubted not of his salvation… But we must put some difference between the committing of a fault (in the want [lack] thereof), and the incurring of certain damnation… I say therefore, in such cases, the position above, being meant of external communion, is false: and then why may it not also be so in some other cases? As namely in one, whose ill hap it is to be born in a schismatical communion, yet where he partakes the true sacraments; when it is supposed, that such a one may be guiltless of that crime, for which the schismatical are damned.</p></blockquote>

e+catechumeni+were+such%2C+as%2C+for+secular+reasons%2C+etc%2C+deferred+baptism+long+after+they+might+have+been+admitted+to%2C+and+received%2C+it%3A+and+amongst+such%2C+I+suppose+was+Valentinian%3B+who+dying+before+baptism+received%2C+after+baptism+willingly+deferred%2C+yet+St.+Ambrose+doubted+not+of+his+salvation%E2%80%A6+But+we+must+put+some+difference+between+the+committing+of+a+fault+%28in+the+want+%5Black%5D+thereof%29%2C+and+the+incurring+of+certain+damnation%E2%80%A6+I+say+therefore%2C+in+such+cases%2C+the+position+above%2C+being+meant+of+external+communion%2C+is+false%3A+and+then+why+may+it+not+also+be+so+in+some+other+cases%3F+As+namely+in+one%2C+whose+ill+hap+it+is+to+be+born+in+a+schismatical+communion%2C+yet+where+he+partakes+the+true+sacraments%3B+when+it+is+supposed%2C+that+such+a+one+may+be+guiltless+of+that+crime%2C+for+which+the+schismatical+are+damned.%E2%80%9D%0A%0A%E2%80%94+Obadiah+Walker%2C+%E2%80%98Of+the+Danger+of+Schism%E2%80%99%2C+pp.+4-7+in+Of+Faith+Necessary+to+Salvation+%26+of+the+Necessary+Ground+of+Faith+Salvifical+whether+this%2C+alway%2C+in+every+man%2C+must+be+infallibility%E2%80%A6+%28Oxford%2C+1688%29%2C+Concerning+Salvation+possible+to+be+had+in+a+Schismatical+Communion+and+Concerning+the+danger+of+living+in%2C+and+the+necessity+of+departing+from%2C+a+Known-Schismatical+Communion&amp;url=https%3A%2F%2F5solasquotes.github.io%2Fquote%2F871af72684.html&amp;via=5Solas" target="_blank" rel="noopener">Share on X</a><a class="perma" href="../quote/871af72684.html">Permalink</a><a class="src" href="https://reformedbooksonline.com/on-the-phrase-there-is-no-salvation-outside-the-church/#:~:text=2.%20Be%20it%20granted%3A%20That%20there,for%20which%20the%20schismatical%20are%20damned&amp;text=2.%20Be%20it%20granted%3A%20That%20there%20is%20no&amp;text=that%20crime%2C%20for%20which%20the%20schismatical%20are%20damned" rel="noopener" target="_blank">Read it online · Reformed Books Online</a></div>
</figure><figure class="quote" id="q-820cf352cf" data-kw="">
<blockquote><p>What now will you say to these things, that your Church is not the catholic Church, but a part of it only; and is only catholic, because of the catholic doctrine that she professes? But if this be true, wherefore then did your general council condemn it in John Hus, and burn him for that doctrine, which both yourself must confess to be true, and is agreeable to Scripture, Fathers, and your own Popes? …yet for all this, not only call ye [Romanists] your Church Catholic, because of the soundness of doctrine which ye suppose she professes, but also and specially to make the simple believe that there is no salvation out of her… Therefore ye call it the only true Church, and the Catholic Church: for out of the particular Church there is salvation, but out of the catholic Church there is no salvation.</p></blockquote>

</figure><figure class="quote" id="q-bf4c3b0d77" data-kw="">
<blockquote><p>The seconde rule is, that there is no salvation out of the Church, and that therefore every one which is to be saved must become a member and a citizen of the catholic and apostolic Church: and such as remain forever out of the same perish eternally. Therefore St. John says, ‘They went out of us, they were not of us, for if they had been of us,’ they would have remained with us: but this comes to pass that it might appear that they are not all of us.’ And again, that such as be holy are in the city of God, but without, that is, forth of the Church are dogs, enchanters,whoremongers, adulterers, etc. And the ark out of which all perished, figured the Church, out of which all are condemned. And for this cause St. Luke says that ‘the Lord added to the Church from day to day such as should be saved.’ [Acts 2] And the reason hereof is plain: for without Christ there is no salvation, but out of the militant Church there is no Christ nor faith in Christ: and therefore no salvation. Again, forth of the militant Church there are no means of salvation, no preaching of the word, no invocation of God’s name, no sacraments, and therefore no salvation. For this cause every man must be admonished evermore to join himself to some particular Church† being a sound member of the catholic Church. † [A “particular Church”, as seen by many quotes on this webpage, often referred in that era to some national or regional Church, such as that of England, Germany, Constantinople, etc., not necessarily a local church, especially when the Anglican Church in that era (which Perkins was a part of) often did not have local sessions of elders with local church membership in any proper sense.] The third rule is that the Church which here we believe is only one, as Christ Himself speaks, ‘My dove is alone, and my undefiled is the only daughter of her mother.’ [Song 6:8] And as there is only one God and one Redeemer, one faith, one baptism and one way of salvation by Christ only, so there is but one Church alone.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/william-perkins.html">William Perkins</a></span><span class="wk"><span class="lbl">Work:</span> <cite>An Exposition of the Symbol or Creed of the Apostles</cite>, ... (Cambridge: Legatt, 1595), An Exposition of the Creed, pp. 486-87</span></figcaption>

<blockquote><p>This book explores the Westminster Confession of Faith’s claim that ‘there is no ordinary possibility of salvation’ outside of the Church by asking what it means, whether it is biblical, and why it is important. The author concludes that the Westminster Confession rightly stresses the role of the Church in bringing people to salvation without making this claim absolute.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/ryan-mcgraw.html">Ryan McGraw</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Ark of Safety</cite></span></figcaption>

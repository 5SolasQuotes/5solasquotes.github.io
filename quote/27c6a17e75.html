<main class="wrap"><figure class="quote" id="q-27c6a17e75" data-kw="">
<blockquote><p>XVII… 1. All necessary good things should be sought not from any creature, but from God the Father and the Lord Jesus Christ, without separating the Holy Spirit from them. If someone objects that the invocation of the Holy Spirit is not mentioned here [in Col. 1:2] by Paul, I respond: the religious invocation of the Holy Spirit should be equally due, as it is to the Father and the Son. 1. Because it is the commandment of God: “You shall worship the Lord your God and Him only shall you serve.” And the Holy Spirit is God. 2. Because we have examples of the holy servants of God who invoked the Holy Spirit, such as John in Revelation 1:4, where he says, “Grace to you and peace from Him who is and who was and who is to come, and from the seven Spirits who are before His throne,” which refers to the Holy Spirit. For by these seven Spirits, we should not understand created spirits, for they are the eyes and horns of the Lamb (Revelation 5:6). Therefore, they are of the same essence as the Lamb and therefore uncreated. Since they are uncreated, they are the Holy Spirit. The holy prophets say that the one and the same Spirit is divided into seven spirits. Therefore, it is clear that the Holy Spirit was invoked by the Apostle John, and the same practice was continued by the Apostolic Church, as Justin Martyr testifies in his Second Apology to Emperor Antoninus Pius. “We worship and adore the prophetic Spirit, honoring Him with reason and truth.” It is evident, therefore, that all good things we need should be sought from God the Father, Son, and Holy Spirit.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/amandus-polanus.html">Amandus Polanus</a></span><span class="wk"><span class="lbl">Work:</span> <cite>‘Analytical Theses on Colossians, containing the Exordium of the Epistle’, pt. 1 (on Col. 1:1-11) $3 Download tr. Jonathan Tomes (Basel: Johannes Schroeter, 1601)</cite></span></figcaption>

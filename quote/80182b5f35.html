<blockquote><p>Sure the holy Lord in a Covenant would not be thought to equivocate, and be uncertain in his meaning. Though God appoints the outward administration of the covenant to Abraham the believer his seed indefinitely, Gen. 17. yet he gives the efficacy of the covenant but to some; viz. that shall be the seed by faith, Rom. 4. Yet we must follow the administration according to express institution, Gen. 17. To whom is derived the covenant effectually, to them are derived the promises of blessing in every manner recited by the Exercitator (subordinate things are not contrary) or in no manner per modum aut vim faederis, under the notion of a covenant. Unregenerate men have a right to temporal things, by an human right, and higher, by a divine right of common providence, either as dwelling with, or receiving them from those in real covenant with God; but not by virtue of any covenant between them and God.

And for that great quaere made by Mr. T[omes]. whether the children of believing Gentiles are called Abraham’s seed? which is the main thing to the question in hand.

Ans. They are, by the distinction and quotation of the Exercitator himself, by stronger consequence then by which the Exercitator proceeds in most things he allegeth. For first, he saith that the natural seed of Abraham, as Isaac, &amp;c. are called his seed. Secondly, that all believers are Abraham’s seed, quoting Rom. 4. We infer then, that the natural seed of believing Gentiles are as well the seed of Abraham, as the natural seed of Isaac were; though Esau were Esau.

If a Gentile believer be the seed of Abraham, Rom. 4.11. Gal. 3.8. then the children of the Gentile believer must needs be reckoned for the seed of Abraham; being the promise runs as truly in the New Testament, The promise is to you and your children. Act. 2. or I am the God of thee Gentile believer and of thy seed, as in the old Testament to Abraham, I am the God of thee Jewish Abraham, and of thy seed.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/nathanael-holmes.html">Nathanael Holmes</a></span><span class="wk"><span class="lbl">Work:</span> <cite>A vindication of baptizing believers infants: In some animadversions upon Mr. Tombes his Exercitations about infant baptism; as also upon his Examen, as touching the antiquities and authors by him alleged or contradicted that concern the same. Humbly submitted to the judgement of all candid Christia</cite>, (London: M. Simmons, 1646), pp 15-16.</span></figcaption>

</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-c358548691" data-kw="">
<blockquote><p>3… The true resolution is that God wills all things on account of His own goodness, as the ultimate end and the first reason for willing all things. However, this does not exclude that, in willing, He attends to the greater or lesser goodness in the things themselves, for from this arises also the greater or lesser fittingness of acting or willing, even on account of His own goodness. And the fact that God operates all things for Himself does not prevent Him from pursuing rational creatures with true love of benevolence and friendship. For they are capable of such love, and it befits the divine goodness to love them thus. Also, because He does not love them for His own utility or advantage, but for their own good. That this good of theirs is ordered to the glory of God as the ultimate end by God Himself is not contrary to the nature of friendship, for this does not exclude the due order to God or to the ultimate end. But God loves lower creatures with the love of concupiscence, because He wills all of them for the advantage and utility of rational creatures, and irrational beings are not capable of greater love. This is clear from Aristotle (Ethics VIII, ch. 2), St. Thomas (I, q. 20, a. 2, ad 3 and 4; Contra Gentiles, ch. 19).</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/francis-suarez.html">Francis Suarez</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Other citations (work not named)</cite>, On Thomas, pt. 1, On the Divine Substance &amp; its Attributes, pp. 505-6 tr. AI in All the Works (d. 1617; Paris: Vives, 1855), vol. 1 Latin Suarez was a major Jesuit theologian.</span></figcaption>

<blockquote><p>Seventhly, Get this principle rooted in you, That it is the delight of Christ to give poor sinners an interest [legal right] in Himself. He is not only able to do it, but it is his delight to do it. Christ’s soul is in nothing more. Witness his leaving his Father’s bosom; witness his laying down his crown; witness those many sufferings and deaths that He went through in this world; witness those gospel acclamations, Mk. 16:16, Rev. 22:17; witness those persuasive exhortations and gracious impetrations [obtaining by asking or petition] and entreaties, Isa. 53:11, Mt. 11:28, 2 Cor. 5:20; witness divine injunctions and comminations [threatenings, 1 Jn. 5:23, Mt. 11:21; witness those pathetical lamentations, Mt. 23:37, Lk. 19:42, Ps. 81:13; and witness the inward motions and secret excitations of his blessed Spirit, Gen. 6:3, all which speak out his great willingness and delight to save poor sinners;</p></blockquote>

<blockquote><p>The other covenant or testament here supposed, whereunto that whereof the Lord Christ was the mediator is preferred, is none other but that which God made with the people of Israel on mount Sinai. So it is expressly affirmed, verse 9: “The covenant which I made with your fathers in the day when I took them by the hand to lead them out of the land of Egypt.” This was that covenant which had all the institutions of worship annexed unto it, Hebrews 9:1-3.</p></blockquote>

<blockquote><p>To be a God unto thee. In this single word we are plainly taught, that this was a spiritual covenant, not confirmed in reference to the present life only; but one from which Abraham might conceive the hope of eternal salvation, so that being raised even to heaven, he might lay hold of solid and perfect bliss. For those whom God adopts to himself, from among a people—seeing that he makes them partakers of his righteousness and of all good things—he also constitutes heirs of celestial life. Let us then mark this as the principal part of the covenant, that He who is the God of the living, not of the dead, promises to be a God to the children of Abraham. It follows afterwards, in the way of augmentation of the grant, that he promises to give them the land. I confess, indeed, that something greater and more excellent than itself was shadowed forth by the land of Canaan; yet this is not at variance with the statement, that the promise now made was an accession to that primary one, ‘I will be thy God.’ Now, although God again affirms, as before, that He will give the land to Abraham himself, we nevertheless know, that Abraham never possessed dominion over it; but the holy man was contented with his title to it alone, although the possession of it was not granted him; and, therefore, he calmly passed from his earthly pilgrimage into heaven. God again repeats that He will be a God to the posterity of Abraham, in order that they may not settle upon earth, but may regard themselves as trained for higher things.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/john-calvin.html">John Calvin</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Commentary on Genesis</cite>, 1.450.</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/the-covenant-of-grace.html">The Covenant of Grace</a></span></div>
<div class="actions"><button class="copy" data-copy="“To be a God unto thee. In this single word we are plainly taught, that this was a spiritual covenant, not confirmed in reference to the present life only; but one from which Abraham might conceive the hope of eternal salvation, so that being raised even to heaven, he might lay hold of solid and perfect bliss. For those whom God adopts to himself, from among a people—seeing that he makes them partakers of his righteousness and of all good things—he also constitutes heirs of celestial life. Let us then mark this as the principal part of the covenant, that He who is the God of the living, not of the dead, promises to be a God to the children of Abraham. It follows afterwards, in the way of augmentation of the grant, that he promises to give them the land. I confess, indeed, that something greater and more excellent than itself was shadowed forth by the land of Canaan; yet this is not at variance with the statement, that the promise now made was an accession to that primary one, ‘I will be thy God.’ Now, although God again affirms, as before, that He will give the land to Abraham himself, we nevertheless know, that Abraham never possessed dominion over it; but the holy man was contented with his title to it alone, although the possession of it was not granted him; and, therefore, he calmly passed from his earthly pilgrimage into heaven. God again repeats that He will be a God to the posterity of Abraham, in order that they may not settle upon earth, but may regard themselves as trained for higher things.”

— John Calvin, Commentary on Genesis, 1.450.">Copy</button><a class="share" href="https://x.com/intent/post?text=%E2%80%9CTo+be+a+God+unto+thee.+In+this+single+word+we+are+plainly+taught%2C+that+this+was+a+spiritual+covenant%2C+not+confirmed+in+reference+to+the+present+life+only%3B+but+one+from+which+Abraham+might+conceive+the+hope+of+eternal+salvation%2C+so+that+being+raised+even+to+heaven%2C+he+might+lay+hold+of+solid+and+perfect+bliss.+For+those+whom+God+adopts+to+himself%2C+from+among+a+people%E2%80%94seeing+that+he+makes+them+partakers+of+his+righteousness+and+of+all+good+things%E2%80%94he+also+constitutes+heirs+of+celestial+life.+Let+us+then+mark+this+as+the+principal+part+of+the+covenant%2C+that+He+who+is+the+God+of+the+living%2C+not+of+the+dead%2C+promises+to+be+a+God+to+the+children+of+Abraham.+It+follows+afterwards%2C+in+the+way+of+augmentation+of+the+grant%2C+that+he+promises+to+give+them+the+land.+I+confess%2C+indeed%2C+that+something+greater+and+more+excellent+than+itself+was+shadowed+forth+by+the+land+of+Canaan%3B+yet+this+is+not+at+variance+with+the+statement%2C+that+the+promise+now+made+was+an+accession+to+that+primary+one%2C+%E2%80%98I+will+be+thy+God.%E2%80%99+Now%2C+although+God+again+affirms%2C+as+before%2C+that+He+will+give+the+land+to+Abraham+himself%2C+we+nevertheless+know%2C+that+Abraham+never+possessed+dominion+over+it%3B+but+the+holy+man+was+contented+with+his+title+to+it+alone%2C+although+the+possession+of+it+was+not+granted+him%3B+and%2C+therefore%2C+he+calmly+passed+from+his+earthly+pilgrimage+into+heaven.+God+again+repeats+that+He+will+be+a+God+to+the+posterity+of+Abraham%2C+in+order+that+they+may+not+settle+upon+earth%2C+but+may+regard+themselves+as+trained+for+higher+things.%E2%80%9D%0A%0A%E2%80%94+John+Calvin%2C+Commentary+on+Genesis%2C+1.450.&amp;url=https%3A%2F%2F5solasquotes.github.io%2Fquote%2F5c95a48cd0.html&amp;via=5Solas" target="_blank" rel="noopener">Share on X</a><a class="perma" href="../quote/5c95a48cd0.html">Permalink</a
